DOQxs0bc4kRrqP","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":280622560,"digest":"sha256:844c640c620ec4c152abe4b3736049f963205da50e9e77bd9bdf2a981a6ead55","download_count":2366,"created_at":"2026-10-03T22:06:31Z","updated_at":"2026-10-03T22:06:49Z"},{"id":608615056,"node_id":"RA_kwDOQxs0bc4kRrqQ","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":223960576,"digest":"sha256:58f017a08637fd1389b76752edc16feb93cf70fac93c036245207652abe531a5","download_count":18,"created_at":"2026-10-03T22:06:31Z","updated_at":"2026-10-03T22:06:47Z"},{"id":608615039,"node_id":"RA_kwDOQxs0bc4kRrp_","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":234917888,"digest":"sha256:0e26a67d451ba9414fa7e8c3971b4273ab942b2d046bca74f65a7ef4a9195dc3","download_count":1089,"created_at":"2026-10-03T22:06:30Z","updated_at":"2026-10-03T22:06:50Z"},{"id":608615049,"node_id":"RA_kwDOQxs0bc4kRrqJ","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:703428820c55c0fc587789ac2b71da542b0d1cab3b077eea1e6dc87811949309","download_count":117,"created_at":"2026-10-03T22:06:31Z","updated_at":"2026-10-03T22:06:31Z"},{"id":608615050,"node_id":"RA_kwDOQxs0bc4kRrqK","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":8,"created_at":"2026-10-03T22:06:31Z","updated_at":"2026-10-03T22:06:31Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Fixed\n\n- When a DeepSeek turn ends with raw `<\uff5cDSML\uff5c\u2026>` tool-call text that could not be parsed into a real call, and no tool call was made, the broken markup is now removed from the message before it is saved to history. The agent then tells the model the tool call failed, shows it the correct format, and asks it again, at most twice in a row. Previously the markup stayed in history, and the agent stopped as if the model had finished ([#14202](https://github.com/can1357/oh-my-pi/pull/14202) by [@H4vC](https://github.com/H4vC)).\n\n## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Fixed Antigravity chat and image requests sending an outdated client version when the model list came from cache, which could make newer models such as Claude Opus 5.5 unavailable.\n- When a DeepSeek model writes a broken DSML tool call (for example with the opening `<\uff5cDSML\uff5ctool_calls>` and `<\uff5cDSML\uff5cinvoke>` tags missing), its closing tags are now kept in the streamed text instead of being dropped. This lets the agent remove exactly the broken call while keeping any text after it ([#14202](https://github.com/can1357/oh-my-pi/pull/14202) by [@H4vC](https://github.com/H4vC)).\n\n## @oh-my-pi/pi-catalog\n\n### Fixed\n\n- Fixed DeepSeek V4 model IDs and the V4.1 Flash alias lacking version information in model identity and dashboards ([#14194](https://github.com/can1357/oh-my-pi/issues/14194)).\n- Fixed Antigravity models such as Claude Opus 5.5 and Sonnet 5.5 disappearing after `omp models refresh`. When the update check failed, omp reported an outdated Antigravity client version (2.8.0), so the server left the newer models out of the list. The fallback version is now 2.19.1.\n- DSML tool calls from DeepSeek models are now parsed on every host. This includes local servers (llama.cpp, LM Studio, vLLM), custom providers from `models.yml`, and gateways that weren't on the old list of supported hosts. Before, a complete `<\uff5cDSML\uff5ctool_calls>` envelope from these hosts showed up as plain text and the tool never ran ([#14202](https://github.com/can1357/oh-my-pi/pull/14202) by [@H4vC](https://github.com/H4vC)).\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- The `/models` Roles view shows which saved model preset is in effect, and Ctrl+\u2190/\u2192 (or `p`/`P` on the role rows, for macOS where Ctrl+\u2190/\u2192 switches Spaces) switches to the next or previous one, in Tern and text mode ([#14210](https://github.com/can1357/oh-my-pi/pull/14210) by [@H4vC](https://github.com/H4vC))\n\n### Changed\n\n- Picking a model for a role in `/models` now puts the cursor on the model list, so \u2191/\u2193 choose a model and Enter assigns it right away instead of moving through the sidebar and dropping the role selection; \u2190 still reaches the providers ([#14210](https://github.com/can1357/oh-my-pi/pull/14210) by [@H4vC](https://github.com/H4vC))\n- Sped up secret redaction on long conversations: it no longer slows down as history grows ([#14213](https://github.com/can1357/oh-my-pi/pull/14213) by [@H4vC](https://github.com/H4vC))\n- Startup is faster with plugins that bundle large dependency trees: the extension loader no longer re-reads and re-checks the same files while loading them (e.g. ~280 ms \u2192 ~185 ms with the IDA MCP plugin) ([#14219](https://github.com/can1357/oh-my-pi/pull/14219) by [@H4vC](https://github.com/H4vC))\n\n### Fixed\n\n- Fixed an `EPIPE: broken pipe` unhandled rejection crashing the session when a debug adapter, eval kernel, IDA worker, or RPC server exits mid-write (seen on Windows) ([#14196](https://github.com/can1357/oh-my-pi/pull/14196) by [@andrebrait](https://github.com/andrebrait))\n\n## @oh-my-pi/omp-stats\n\n### Fixed\n\n- Fixed the Frustration page splitting DeepSeek V4 provider variants and the V4.1 Flash alias into separate model-version rows ([#14194](https://github.com/can1357/oh-my-pi/issues/14194)).\n\n## @oh-my-pi/pi-tui\n\n### Fixed\n\n- Fixed Alt+Up (restore queued steering), arrows and other escape-sequence keys on Windows acting as Esc (interrupting the turn) and typing `[1;3A` into the editor when the console host relays them one byte at a time ([#14216](https://github.com/can1357/oh-my-pi/pull/14216) by [@H4vC](https://github.com/H4vC)).\n\n\n## What's Changed\n* fix(catalog): agy anthropic models display by @H4vC in https://github.com/can1357/oh-my-pi/pull/14197\n* fix(stats): merged DeepSeek V4 frustration rows by revision by @roboomp in https://github.com/can1357/oh-my-pi/pull/14199\n* fix(dsml): parse DeepSeek DSML on every host and keep unparsed markup out of history by @H4vC in https://github.com/can1357/oh-my-pi/pull/14202\n* feat(tui): switch model presets with ctrl+arrows in the /models roles view by @H4vC in https://github.com/can1357/oh-my-pi/pull/14210\n* perf(secrets): speed up secret redaction by @H4vC in https://github.com/can1357/oh-my-pi/pull/14213\n* fix(tui): reassemble escape keys relayed as win32-input-mode text records by @H4vC in https://github.com/can1357/oh-my-pi/pull/14216\n* perf(coding-agent): memoize legacy extension graph walk lookups by @H4vC in https://github.com/can1357/oh-my-pi/pull/14219\n* fix(coding-agent): handle pending pipe write failures by @andrebrait in https://github.com/can1357/oh-my-pi/pull/14196\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.5.1...v18.6.0","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
