wDOQxs0bc4hiZ45","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1077086,"digest":"sha256:104142244b8781b7828e64aa79a61b03fdf16e8a3464278647c3d84ad22cbce0","download_count":1,"created_at":"2026-09-14T05:30:22Z","updated_at":"2026-09-14T05:30:22Z"}],"body":"## @oh-my-pi/pi-coding-agent\n\n### Fixed\n\n- Fixed Flatpak Chromium launcher executables (including `com.google.Chrome`, `org.chromium.Chromium`, and `io.github.ungoogled_software.ungoogled_chromium`) so `app.path` is treated as a browser and gets managed Chromium profile handling\n- Fixed Chromium `--user-data-dir` handling by normalizing `--user-data-dir <dir>` and relative profile paths to absolute `--user-data-dir=...` values before launch\n- Browser automation now works alongside an already-running Chrome using an isolated profile, keeps requested profiles separate, and never kills reused browser processes.\n- First-use Chromium installation and browser operations no longer consume Eval's runtime timeout or reset its kernel while waiting.\n- Browser startup reuses a successful system-Chrome fallback instead of retrying an unavailable download during the same open.\n- Browser clicks and other interactions no longer stall when OMP-owned tabs are in the background, including after worker timeout recovery.\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added `getBrowserProfilesDir()` (`~/.omp/browser-profiles`; XDG: `$XDG_STATE_HOME/omp/browser-profiles`) for profiles of Chromium browsers spawned by the browser tool.\n\n### Fixed\n\n- Timed out stalled Chrome-for-Testing metadata requests after 30 seconds when looking up download metadata\n- Concurrent browser installations share one download without replacing a running browser, and stalled downloads time out with partial files cleaned up for retry.\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.1.20...v18.1.21"}
