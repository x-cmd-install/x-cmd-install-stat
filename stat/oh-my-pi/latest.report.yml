OQxs0bc4r-901","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":287529136,"digest":"sha256:b44fda2ae5c9cce2bbe124d1672cba532a136d9e1eef68599b16efcd3bc5c626","download_count":1977,"created_at":"2026-11-12T03:35:33Z","updated_at":"2026-11-12T03:35:46Z"},{"id":737926447,"node_id":"RA_kwDOQxs0bc4r-90v","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":233947648,"digest":"sha256:391bc66afe1447302443b06b6cc298e65f75575161798bf60f1ddd8f6b924bea","download_count":10,"created_at":"2026-11-12T03:35:33Z","updated_at":"2026-11-12T03:35:45Z"},{"id":737926444,"node_id":"RA_kwDOQxs0bc4r-90s","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":251062784,"digest":"sha256:6d5ad734bb6fafef49278670ca74fce838e333fa20fc08ffc65570581f501b0d","download_count":305,"created_at":"2026-11-12T03:35:33Z","updated_at":"2026-11-12T03:35:45Z"},{"id":737926458,"node_id":"RA_kwDOQxs0bc4r-906","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:dd806273f27c6c3d020002c968f2deb32281c2423f13c01332b6210e1c745dcf","download_count":151,"created_at":"2026-11-12T03:35:33Z","updated_at":"2026-11-12T03:35:34Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Added\n\n- Added the `liquid-systemone` judgment API for Liquid AI decision models, including validation that rejects image sets exceeding Liquid’s 10,000 32×32-patch request limit before submission.\n\n### Fixed\n\n- Fixed Gemini CLI and Antigravity responses losing or misordering thought signatures and reply text, including responses that follow tool calls.\n- Fixed Gemini CLI and Antigravity merging reply text around a thought signature, dropping signatures at the start of a reply or after a tool call, and placing a thought ahead of reply text that streamed before it ([#18942](https://github.com/can1357/oh-my-pi/pull/18942) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Fixed Google Antigravity judging Gemini models by quota buckets they do not consume: Gemini 3.x requests ignore the Gemini 4 Argon weekly bucket, and Argon requests ignore `gemini-weekly`, so an exhausted or low bucket no longer blocks, reserves, or caps an account for the other models ([#16104](https://github.com/can1357/oh-my-pi/issues/16104)).\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added Liquid AI provider support with the d1.1 and d1-ultra judge models and Liquid authentication via `/login liquid` using `LIQUID_API_KEY`.\n\n### Fixed\n\n- Fixed Google Antigravity Gemini 4 Argon models sharing the general Gemini quota scope instead of their dedicated weekly bucket ([#16104](https://github.com/can1357/oh-my-pi/issues/16104)).\n\n## @oh-my-pi/pi-coding-agent\n\n### Breaking Changes\n\n- Changed the browser `open` API: `ignore_https_errors` is now `insecure`, `allow_file_access` has been removed, and `file:` pages can access other local files.\n- Changed the browser `open` and `targets` `app` option from an object to a string or CDP endpoint/executable path. Use `argv` instead of `app.args` and the top-level `target` instead of `app.target`.\n- Removed `task.file` and the task tool's `taskFile` field; subagent instructions must now be provided inline.\n- Removed blocked todo tasks and the `blocked` status/blocker metadata. Existing blocked tasks are restored as pending.\n\n### Added\n\n- Added `systemPromptTemplates`, which maps model-selector patterns to Handlebars template files for customizing system prompts. Templates re-render when switching models, with warnings and fallback to the bundled prompt for missing or invalid templates.\n- Added ordered multi-step tasks through `task.steps`. Subagents receive steps sequentially, and the final step determines the task result; interrupted tasks resume with their remaining steps.\n- Added Liquid AI judge models `liquid/d1.1` and `liquid/d1-ultra`, including image resizing for Liquid's request limits.\n- Added per-step progress, state, and duration reporting for GitHub Actions watches, with expandable details and native Tern Surface Protocol views.\n- Added `task.autoParallel` (`off`, `suggest`, or `on`) to identify subtasks that can run concurrently and optionally delegate them in a single parallel task call.\n- Added portable `awk`, `tar`, `lsof`, `shasum`, `md5`, and `strings` support to the `bash` tool, including Windows support and internal-URI paths.\n\n### Changed\n\n- Browser sessions now prefer the bundled ABKit WebKit engine when available, with automatic installation and SHA-256 verification. WebKit provides headed, user-visible tabs and broader browser compatibility; Chromium remains the fallback and can be selected explicitly with `app: \"chromium\"`, while `app: \"webkit\"` requires WebKit. Configure this behavior with `browser.webkit` and `browser.webkitPath` or the corresponding environment variables.\n- Browser visibility controls now show or hide WebKit tab windows immediately. Headed WebKit tabs can be interacted with directly, while Chromium tabs retain their existing mode-switching behavior.\n- In Tern environments with native DOM access, browser observation and interaction use trusted native input across frames and closed shadow roots, with caret-aware typing and case-insensitive text selectors.\n- `edit.modelVariants` now uses the longest matching model pattern, so specific patterns take precedence over generic ones regardless of configuration order.\n- The `ask` tool now submits the form's current values when its timeout expires; updated settings and documentation reflect this behavior.\n- The `read` tool loads detailed format selectors and URI sub-path syntax on demand, reducing the default request description while retaining inline details when `read` is disabled.\n- The default system prompt and tool descriptions have been streamlined, with guidance moved closer to the tools and detailed task/procedure references provided when relevant.\n- The `bash` pseudo view renders words built from literals and expansions as f-strings (`f\"repos/org/{r}/rulesets\"`) instead of `concat(...)` calls.\n\n### Fixed\n\n- Fixed `computer.close()` so subsequent computer-control calls start a fresh desktop session instead of failing.\n- Fixed extension providers with `oauth.modifyModels` so they do not load the full model catalog before login.\n- Fixed resuming sessions so it no longer scans unrelated later session transcripts.\n- Fixed session saving on Windows to avoid UI stalls caused by repeated session-file access.\n- Fixed automatic chart selection so generated charts use compatible data and chart types.\n- Fixed `bash` previews for `env -i` commands so they display the requested command rather than generated shell setup code.\n\n## @oh-my-pi/collab-web\n\n### Fixed\n\n- Fixed `task` tool cards so spawned tasks consistently display their name, assigned agent, and instructions, with `steps` spawns shown as numbered stages.\n\n## @oh-my-pi/pi-natives\n\n### Added\n\n- Added `shellBuiltins(sessionEnv?)` to list commands provided by the embedded shell, including process controls and utilities.\n- Expanded the embedded shell with `awk`, `tar`, `shasum`, `md5`, `strings`, and `lsof` across Linux, macOS, and Windows. Destructive utilities can be disabled with `PI_DISABLE_UUTILS_DESTRUCTIVE`; when disabled, `tar` is delegated to the system.\n\n### Fixed\n\n- Fixed macOS text entry in Chrome and other Chromium-based applications so typing followed by Return opens the entered text instead of reloading the current page.\n\n## @oh-my-pi/pi-tui\n\n### Added\n\n- GitHub Actions watch cards now show current-step progress and can be expanded with Ctrl+O to display ordered step states and durations in ANSI and native Tern views.\n\n### Fixed\n\n- Fixed comparison charts mislabeling gaps against a rival column as improvements or regressions.\n- Fixed Tern edit diffs showing unrelated one-line hunks and incorrect line numbers around distant changes.\n- Fixed table charts incorrectly interpreting words such as “with,” “to,” and “from” in column names as comparison conditions.\n- Fixed chart row names containing trailing numbers, such as “EmbeddingGemma 2” and “Jev 15,” being split or incorrectly nested.\n- Fixed `read` rejecting colon-separated line ranges and displaying a single requested range as multiple rows.\n\n### Removed\n\n- Removed the `blocked` status from `TodoStatus`, the `blocker` field from `TodoItem`, and the `block`/`unblock` operations from `TodoOperation`.\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added browser utilities exposing trusted browser archive extraction limits and the installed WebKit host executable path.\n\n\n## What's Changed\n* feat(ai,catalog,coding-agent): add Liquid AI (d1-ultra, d1.1) judge provider by @SuperUserA in https://github.com/can1357/oh-my-pi/pull/18100\n* fix(collab): isolate test home directories and guard real ~/.omp paths by @iliaal in https://github.com/can1357/oh-my-pi/pull/18811\n* fix(ai): keep signature-only thought parts as signed thinking on Gemini CLI routes by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/18942\n* perf(tui): release regenerable render caches on retired tool cards by @iliaal in https://github.com/can1357/oh-my-pi/pull/18820\n* perf(coding-agent,catalog): keep model cache reads provider-scoped and prune expired legacy rows by @iliaal in https://github.com/can1357/oh-my-pi/pull/18821\n* feat(coding-agent): add per-model system prompt templates by @DeprecatedLuke in https://github.com/can1357/oh-my-pi/pull/17835\n* perf(session): read only headers when looking for a session's continuations by @iliaal in https://github.com/can1357/oh-my-pi/pull/18952\n* feat(github): show step-level Actions watch progress by @anatoli-tsinovoy in https://github.com/can1357/oh-my-pi/pull/18945\n* fix(ai): isolate antigravity argon quota bucket by @roboomp in https://github.com/can1357/oh-my-pi/pull/16106\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.18.9...v18.19.0","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
