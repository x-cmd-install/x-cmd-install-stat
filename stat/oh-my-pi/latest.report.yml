Qxs0bc4q3uwN","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":284657840,"digest":"sha256:ec271e0d7df4c0f57acb6a7a28f8585d46bd050bcef8494f6d33db8a6c0dfbba","download_count":1542,"created_at":"2026-11-07T01:49:01Z","updated_at":"2026-11-07T01:49:14Z"},{"id":719252506,"node_id":"RA_kwDOQxs0bc4q3uwa","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":231173120,"digest":"sha256:4cb8c1ca84baab5a3f66febc54c979c184802e9efa75a99627e3bec446535be9","download_count":7,"created_at":"2026-11-07T01:49:01Z","updated_at":"2026-11-07T01:49:12Z"},{"id":719252497,"node_id":"RA_kwDOQxs0bc4q3uwR","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":248622592,"digest":"sha256:20267b4914dca40306c71e824216e0f79061869d9e9d4780fc0c255b7a3e5339","download_count":220,"created_at":"2026-11-07T01:49:01Z","updated_at":"2026-11-07T01:49:15Z"},{"id":719252501,"node_id":"RA_kwDOQxs0bc4q3uwV","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:855b4c9eacd2268cb08551656cdcf4f46ee426156fc43937279ed2ce748d96fb","download_count":147,"created_at":"2026-11-07T01:49:01Z","updated_at":"2026-11-07T01:49:01Z"}],"body":"## @oh-my-pi/pi-catalog\n\n### Fixed\n\n- Fixed Mistral discovery listing embedding, OCR, moderation, transcription, and speech models as chat models; only rows with `capabilities.completion_chat` are offered, with context, image input, and reasoning read from the row ([#18244](https://github.com/can1357/oh-my-pi/pull/18244) by [@VeigaPunk](https://github.com/VeigaPunk))\n- A failed refresh no longer replaces a cached catalog whose models carry request headers with an empty snapshot; the next launch refetches it instead ([#18227](https://github.com/can1357/oh-my-pi/issues/18227))\n\n## @oh-my-pi/pi-coding-agent\n\n### Fixed\n\n- Fixed transcript output freezing after provider restarts or switching sessions mid-stream ([#18358](https://github.com/can1357/oh-my-pi/pull/18358) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Bash tool cards for a command whose leading `cd <dir> &&` / `cd <dir>;` was hoisted into the working directory show that `cd` again above the visualized command, with the separator the model wrote, instead of dropping where it ran\n- Bash commands starting with `cd <dir>; ...` now run in `<dir>` as their working directory when it exists, so its direnv environment loads and the directory shows on the tool card ([#18329](https://github.com/can1357/oh-my-pi/pull/18329) by [@harshaygadekar](https://github.com/harshaygadekar))\n- Task-file approvals show and keep the checked file target through dispatch, so retargeted symlinks cannot silently substitute another assignment; replaced files require a retry ([#18314](https://github.com/can1357/oh-my-pi/pull/18314) by [@iliaal](https://github.com/iliaal)).\n- Subagents receive task instructions with their blank lines, Markdown hard breaks, and table spacing intact, whether given inline or via `taskFile`.\n- Hindsight `retain` and `learn` memories are no longer lost when delivery fails or omp exits: they are kept on disk, retried, and delivered by the next session without duplicates ([#18176](https://github.com/can1357/oh-my-pi/pull/18176) by [@alphastorm](https://github.com/alphastorm))\n- Fixed the session crashing with `Native shell returned an invalid execution trace` when a bash command assigned a long value containing multi-byte characters such as Chinese text ([#18259](https://github.com/can1357/oh-my-pi/issues/18259))\n- `grep -e` and `rg -e` in the bash tool accept patterns that start with `-` (e.g. `grep -e \"--canary\"`) instead of failing with an unknown-option error.\n- The bash execution visualization keeps updating, and saved traces still restore, after a command handles bytes that aren't valid UTF-8 (e.g. `v=$(printf '\\377')`)\n- On Windows, `grep`, `glob` and isolated subagents no longer flash a console window when they query or start the ovnfs daemon.\n- A bash command containing a bare `[` (e.g. `a && [` while still streaming) no longer crashes omp in the Pseudo shell visualization ([#18320](https://github.com/can1357/oh-my-pi/issues/18320))\n- Fixed a prompt that mentions an internal-scheme URL with `@` (e.g. `@local://x`, `@vault://x`) aborting the run with \"uses internal scheme ... not as a filesystem path\"; such a mention is now left as plain text ([#16071](https://github.com/can1357/oh-my-pi/issues/16071))\n- Fixed MCP OAuth login and token refresh failing with `JSON Parse error: Unexpected identifier \"access_token\"` against GitHub's token endpoint ([#18292](https://github.com/can1357/oh-my-pi/issues/18292))\n- MCP OAuth requests tokens for the MCP server's own resource (from its protected-resource metadata) instead of a different `resource` advertised by the authorization server, fixing `401 invalid_token` after `/mcp reauth` on servers such as Firecrawl's hosted MCP ([#18315](https://github.com/can1357/oh-my-pi/issues/18315))\n- Concurrent subagent MCP calls now grant newly loaded tools to the session that made each call, even when providers reuse call IDs. ([#18324](https://github.com/can1357/oh-my-pi/pull/18324) by [@eggpeat](https://github.com/eggpeat))\n- LSP document symbols now show identifier lines, so those lines work with references, definition, and rename ([#18257](https://github.com/can1357/oh-my-pi/issues/18257)).\n- Subagents on worker threads no longer fail with `Cannot send … instance across threads` when their model comes from an extension-registered provider with its own `streamSimple` ([#18310](https://github.com/can1357/oh-my-pi/pull/18310) by [@Dangerboi](https://github.com/Dangerboi))\n- ⌘V in terminals with kitty enhanced paste (OSC 5522, e.g. Ghostty 1.4) now attaches macOS TIFF screenshots instead of reporting \"Clipboard paste has no supported text or image data\" ([#17696](https://github.com/can1357/oh-my-pi/issues/17696), [#18203](https://github.com/can1357/oh-my-pi/pull/18203) by [@roboomp](https://github.com/roboomp))\n- Disabling `display.shellVisualization` now omits bash execution traces from tool updates and saved sessions, including in ACP ([#18267](https://github.com/can1357/oh-my-pi/issues/18267)).\n- `/quit` and `/exit` no longer wait several seconds for an unresponsive OTLP telemetry collector ([#18255](https://github.com/can1357/oh-my-pi/issues/18255)).\n- Cancelling a Python eval cell right as it starts now stops the cell cleanly instead of letting it run and killing the kernel ([#18242](https://github.com/can1357/oh-my-pi/pull/18242) by [@eggpeat](https://github.com/eggpeat))\n- Browser `open` now returns the same tab with a recovery notice when Chrome detaches the relay during navigation and omp successfully reattaches, instead of failing the open and closing newly opened tabs ([#18252](https://github.com/can1357/oh-my-pi/pull/18252) by [@will-bogusz](https://github.com/will-bogusz))\n- `tab.errors()` keeps the fields of plain-object and other non-Error rejections, bounded like console arguments, instead of reporting only `Object` ([#16959](https://github.com/can1357/oh-my-pi/issues/16959)) ([#18251](https://github.com/can1357/oh-my-pi/pull/18251) by [@Alex-Wengg](https://github.com/Alex-Wengg))\n- An extension provider with `authHeader: true` keeps its cached `fetchDynamicModels` catalog when `omp models refresh` fails, instead of showing 0 models until the next successful forced refresh ([#18227](https://github.com/can1357/oh-my-pi/issues/18227))\n- A session whose request carries no titleable text of its own — an attached `@brief.md`, a greeting, a bare number — is now named once from the assistant's reading of it, instead of staying untitled until the next message that happens to be titleable (which, for an agent launched from one brief and left to run, never came) ([#18238](https://github.com/can1357/oh-my-pi/pull/18238) by [@sjawhar](https://github.com/sjawhar))\n- Prewalk no longer hands a subagent to its cheap model when the subagent messages its parent or another agent (`write agent://…`) before its first file edit ([#18322](https://github.com/can1357/oh-my-pi/pull/18322) by [@1vivy](https://github.com/1vivy))\n\n## @oh-my-pi/pi-mnemopi\n\n### Fixed\n\n- Fixed embedding rebuilds failing on hosted APIs that cap the inputs per request: `embed()` now splits large lists into requests of at most `MNEMOPI_EMBEDDING_BATCH_SIZE` texts (default 64; set `10` for DashScope) or the `embeddings.batchSize` runtime option, and returns `null` when the API returns a different number of vectors than texts ([#18278](https://github.com/can1357/oh-my-pi/pull/18278) by [@aleister1102](https://github.com/aleister1102))\n- Fixed an embedding model change deleting every stored vector when the new provider had no key, did not answer, or rejected a batch partway through: the store now embeds the whole corpus with the new model before replacing anything, keeps the old vectors if any request fails, and tries again on the next open ([#18278](https://github.com/can1357/oh-my-pi/pull/18278) by [@aleister1102](https://github.com/aleister1102))\n- Fixed rejected embedding API requests leaving no trace: the status and the first 300 characters of the response body now go to the log at `debug`, or at `warn` when runtime debug is on ([#18278](https://github.com/can1357/oh-my-pi/pull/18278) by [@aleister1102](https://github.com/aleister1102))\n\n## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Fixed `find()` missing elements more than 24 levels down, such as VS Code's editor; it now searches 64 levels deep ([#18221](https://github.com/can1357/oh-my-pi/pull/18221) by [@will-bogusz](https://github.com/will-bogusz))\n- `glob`, `grep`, `fuzzyFind`, `ast_grep` and `ast_edit` now run their directory traversal on a filesystem runtime of their own, so a search over a large or cold tree can no longer take the worker threads that the embedded shell and every other native call are scheduled on. Those threads are named `pi-fs-worker`, so a stall in a search is tellable apart from a stall elsewhere.\n- Fixed a workspace tree whose native addon does not match its checkout failing with `undefined is not a constructor` at the callsite: a class the addon lacks now throws a message naming the addon file, both releases and `bun run build:native` — from its constructor and from any static entrypoint — and the loader reports that mismatch once as it loads ([#18230](https://github.com/can1357/oh-my-pi/pull/18230) by [@sjawhar](https://github.com/sjawhar))\n\n## @oh-my-pi/pi-tui\n\n### Fixed\n\n- Ctrl+J from a win32-input-mode record with `VK_J` and `Uc=LF` now decodes as `ctrl+j`, so Windows Terminal / mini-term insert a newline instead of submitting ([#18253](https://github.com/can1357/oh-my-pi/pull/18253) by [@Clannad47](https://github.com/Clannad47))\n- The BTW history page (`f` on a side answer) scrolls its reader and history list with the mouse wheel, matching the other scrolling sheets ([#18303](https://github.com/can1357/oh-my-pi/pull/18303) by [@ImAlexBlock](https://github.com/ImAlexBlock))\n- The BTW history list shows the date for questions asked before today (and the year for ones from an earlier year), instead of a bare time that read as today's; a follow-up asked on a later day than its topic shows its date too ([#18210](https://github.com/can1357/oh-my-pi/pull/18210) by [@a-glapinski](https://github.com/a-glapinski))\n\n## @oh-my-pi/pi-utils\n\n### Fixed\n\n- Fixed abort signals leaving command output reads blocked when a descendant keeps stdout or stderr open after the root process exits. ([#18309](https://github.com/can1357/oh-my-pi/pull/18309) by [@eggpeat](https://github.com/eggpeat))\n\n## @oh-my-pi/pi-wire\n\n### Changed\n\n- `ShellTrace` fields that carry values from the run (argv, assignments, redirect targets, unlocated unit sources, diagnostics) are `ShellTraceBytes`: a string when the bytes are UTF-8, otherwise the raw byte values. `isShellTrace` accepts both forms\n\n## What's Changed\n* fix(builtins): accept dash-leading patterns after grep/rg -e by @H4vC in https://github.com/can1357/oh-my-pi/pull/18287\n* fix(shell): cut assign previews on a utf-8 character boundary by @roboomp in https://github.com/can1357/oh-my-pi/pull/18265\n* fix(ovnfs): hide the console window when querying or starting the daemon by @H4vC in https://github.com/can1357/oh-my-pi/pull/18290\n* obash: let the OS do teardown, where applicable by @H4vC in https://github.com/can1357/oh-my-pi/pull/18289\n* fix(wire): accept shell trace byte values that are not UTF-8 by @H4vC in https://github.com/can1357/oh-my-pi/pull/18291\n* fix(hindsight): persist tool retains in a durable outbox by @alphastorm in https://github.com/can1357/oh-my-pi/pull/18176\n* fix(browser): keep the tab an open successfully reattaches by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/18252\n* fix(lsp): used identifier lines for document symbols by @roboomp in https://github.com/can1357/oh-my-pi/pull/18261\n* fix(mnemopi): split embedding requests and keep vectors on failed model switch by @aleister1102 in https://github.com/can1357/oh-my-pi/pull/18278\n* fix(mcp): requested json from oauth token endpoints by @roboomp in https://github.com/can1357/oh-my-pi/pull/18293\n* fix(natives): give filesystem walks their own runtime by @sjawhar in https://github.com/can1357/oh-my-pi/pull/18301\n* fix(utils): retain abort handling until output collection finishes by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18309\n* docs(task): state the subagent worker threshold the code uses by @Dangerboi in https://github.com/can1357/oh-my-pi/pull/18311\n* fix(mcp): preferred protected-resource indicator over auth-server resource by @roboomp in https://github.com/can1357/oh-my-pi/pull/18316\n* fix(prewalk): don't hand off on file-free coordination writes by @1vivy in https://github.com/can1357/oh-my-pi/pull/18322\n* fix(mcp): isolate concurrent tool call attribution by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18324\n* fix(coding-agent): fell back to native clipboard for unsupported 5522 paste by @JonasBrilz in https://github.com/can1357/oh-my-pi/pull/18203\n* fix(coding-agent): treat @<scheme>:// mentions as prose instead of aborting by @draco28 in https://github.com/can1357/oh-my-pi/pull/18208\n* fix(tui): date btw history rows asked before today by @a-glapinski in https://github.com/can1357/oh-my-pi/pull/18210\n* fix(natives): search 64 levels deep in find() by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/18221\n* fix(models): kept extension catalogs with auth headers on failed refresh by @roboomp in https://github.com/can1357/oh-my-pi/pull/18229\n* fix(natives): name the stale addon when a class it predates is constructed by @sjawhar in https://github.com/can1357/oh-my-pi/pull/18230\n* fix(session): title a session whose request carries no titleable text by @sjawhar in https://github.com/can1357/oh-my-pi/pull/18238\n* fix(eval): preserve Python interrupts before cell startup by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18242\n* fix(catalog): limit Mistral discovery to chat-capable models by @VeigaPunk in https://github.com/can1357/oh-my-pi/pull/18244\n* fix(browser): keep the fields of non-Error rejections in tab.errors() by @Alex-Wengg in https://github.com/can1357/oh-my-pi/pull/18251\n* fix(tui): decode WSI Ctrl+J with Uc=LF as ctrl+j by @Clannad47 in https://github.com/can1357/oh-my-pi/pull/18253\n* fix(coding-agent): bounded otlp shutdown export wait by @roboomp in https://github.com/can1357/oh-my-pi/pull/18262\n* fix(bash): honored disabled shell visualization in acp by @roboomp in https://github.com/can1357/oh-my-pi/pull/18269\n* fix(tui): scroll the BTW history page with the wheel by @ImAlexBlock in https://github.com/can1357/oh-my-pi/pull/18303\n* fix(coding-agent): send only tool definitions to main for worker custom streams by @Dangerboi in https://github.com/can1357/oh-my-pi/pull/18310\n* fix(task): bind task-file dispatch to approved targets by @iliaal in https://github.com/can1357/oh-my-pi/pull/18314\n* fix(bash): opportunistically hoist leading cd with semicolon (#18295) by @harshaygadekar in https://github.com/can1357/oh-my-pi/pull/18329\n* fix(tui): discard abandoned tool previews on provider replay by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/18358\n\n## New Contributors\n* @1vivy made their first contribution in https://github.com/can1357/oh-my-pi/pull/18322\n* @JonasBrilz made their first contribution in https://github.com/can1357/oh-my-pi/pull/18203\n* @draco28 made their first contribution in https://github.com/can1357/oh-my-pi/pull/18208\n* @VeigaPunk made their first contribution in https://github.com/can1357/oh-my-pi/pull/18244\n* @Alex-Wengg made their first contribution in https://github.com/can1357/oh-my-pi/pull/18251\n* @Clannad47 made their first contribution in https://github.com/can1357/oh-my-pi/pull/18253\n* @ImAlexBlock made their first contribution in https://github.com/can1357/oh-my-pi/pull/18303\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.17.0...v18.18.0\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":19}
