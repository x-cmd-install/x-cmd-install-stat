wDOQxs0bc4lHiih","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":283690464,"digest":"sha256:877acdc48384b80fe4c083b1e610433d28922dd9fccde9ea430aaace8765b19b","download_count":4702,"created_at":"2026-10-08T19:04:44Z","updated_at":"2026-10-08T19:05:02Z"},{"id":622733459,"node_id":"RA_kwDOQxs0bc4lHiiT","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":226306560,"digest":"sha256:2e6b7995c51043e77eac3de0d6a4036f3bb96b9c259b6c75cacc0080458e2894","download_count":21,"created_at":"2026-10-08T19:04:44Z","updated_at":"2026-10-08T19:04:53Z"},{"id":622733460,"node_id":"RA_kwDOQxs0bc4lHiiU","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":237315584,"digest":"sha256:c139a5c4653ec475f63ac9076dcb1b1da150432a3b4f6c832131ceaf70ac8a86","download_count":2321,"created_at":"2026-10-08T19:04:44Z","updated_at":"2026-10-08T19:04:53Z"},{"id":622733468,"node_id":"RA_kwDOQxs0bc4lHiic","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:d39ec7d888b22822e2e487ae40114a197335acb20a8135801918ebff8a7188dc","download_count":252,"created_at":"2026-10-08T19:04:44Z","updated_at":"2026-10-08T19:04:44Z"},{"id":622733472,"node_id":"RA_kwDOQxs0bc4lHiig","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":20,"created_at":"2026-10-08T19:04:44Z","updated_at":"2026-10-08T19:04:45Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Added\n\n- Added support for warm-cache-aware conversation pruning, keeping pruned history within the model\u2019s prompt-cache lookback window while preserving Anthropic prompt-cache efficiency.\n- Added `AgentLoopConfig.hasQueuedAsides` (also available on `Agent`) to allow interruptible waits to detect queued asides without consuming them or signaling other tools.\n\n## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Fixed Google Gemini and Cloud Code Assist (Antigravity) requests failing when tool schemas contain unsupported JSON Schema keywords or fields that allow multiple types.\n- Fixed auth broker account selection and usage-limit enforcement to consistently use the selected account\u2019s quota when multiple accounts are present.\n- Fixed Anthropic-family model streaming so encoded marker tokens are decoded correctly in text, tool-call updates, partial messages, and completed tool calls.\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added prompt-cache lookback support for Claude models across all hosts, including the public `prompt-cache-lookback` catalog axis and `resolvePromptCacheLookback` API.\n\n### Fixed\n\n- Fixed model discovery when providers publish models before they are recognized by the catalog; unsupported models are now skipped with a warning so other available models remain discoverable.\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added per-session Git worktree support with `worktree.onStart` and `worktree.onExit` settings to create an isolated worktree for each session and clean it up when the session ends.\n- Expanded xAI web search with X post search, including X-only and author-specific queries, author exclusions, date and recency filters, and automatic xAI routing when credentials are available.\n- Added xAI-powered reading of X posts, threads and replies, profiles, searches, and hashtags when logged in, replacing the unavailable Nitter mirrors.\n\n### Changed\n\n- Web search now prefers an authenticated `xai-oauth` login over an `xai` API key when both are available, unless `modelProviderOrder` specifies a different order.\n\n### Fixed\n\n- Fixed judge-gated features continuing to use a stale model chain after switching judge roles.\n- Improved Anthropic prompt-cache reuse when pruning tool results from long conversations.\n- Fixed resumed Claude sessions losing earlier thinking context and prompt-cache reuse when extensions or MCP tools were registered before the first message.\n- Fixed subagent advisors configured with `@advisor` using the built-in `slow` model instead of the configured advisor role.\n- Fixed the `/switch` command and alternate model picker crashing when stored model speed statistics contained an unnamed model.\n- Fixed `lsp` and `generate_image` attempting to read FIFO, terminal, or unbounded device paths, which could hang or exhaust memory.\n- Fixed aside messages from extensions being blocked behind a running wait operation.\n- Fixed extensions importing `@oh-my-pi/pi-tui/native/*` failing to load in compiled `omp` binaries.\n- Fixed raw token markers appearing instead of Nerd Font icons in Anthropic idle recaps, `/btw` and `/omfg` replies, and streaming previews.\n- Fixed sessions moved with `/wt` disappearing from resume lists; sessions in Git worktrees now remain discoverable and can be resumed or relocated if their worktree was removed.\n- Fixed live config reload ignoring edits made during startup or right after a config symlink was retargeted, until the next unrelated edit.\n\n## @oh-my-pi/pi-tui\n\n### Changed\n\n- Improved rendering performance for streaming long Markdown lists while preserving nested items, numbering, and reference links.\n\n### Fixed\n\n- Added package exports for the native Tern/TSP modules, allowing extensions in compiled `omp` binaries to import them.\n- Fixed the Tern `/model` picker's Roles tab so typing and Backspace consistently edit the search field without triggering role commands.\n- Fixed the session picker so sessions retain and display their directory when switching between the current folder and all-project views.\n\n\n## What's Changed\n* fix(agent): stop tool-result pruning from re-writing the whole Anthropic cache behind many small turns by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/14751\n* fix(coding-agent): keep resumed Claude sessions' thinking and cache when tools register before the first message by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/14754\n* fix(ai): stop broker clients judging an account by a sibling's usage when its own fetch fails by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/14904\n* fix(coding-agent): resolve @advisor subagent advisor against owner roles by @H4vC in https://github.com/can1357/oh-my-pi/pull/14972\n* fix(judgment): invalidate the cached judge role chain when settings change by @alnaggar-dev in https://github.com/can1357/oh-my-pi/pull/14861\n* feat(coding-agent): add worktree.onStart and worktree.onExit settings by @gitpushoriginmaster in https://github.com/can1357/oh-my-pi/pull/14908\n* fix(coding-agent): skipped null model_perf keys that crashed the model picker by @roboomp in https://github.com/can1357/oh-my-pi/pull/14787\n* fix(lsp,image): refuse FIFOs and devices instead of hanging on them by @DrFaustus-vic in https://github.com/can1357/oh-my-pi/pull/14730\n* fix(agent): end an interruptible wait when an aside is queued by @mgpai22 in https://github.com/can1357/oh-my-pi/pull/14731\n* fix(ai): strip uniqueItems and unsupported schema keywords for Google and CCA by @jwaldrip in https://github.com/can1357/oh-my-pi/pull/14766\n* fix(tui): register pi-tui native/* subpaths for compiled-binary extensions by @clasalle-lila in https://github.com/can1357/oh-my-pi/pull/14835\n* Make long streamed lists incremental by @iliaal in https://github.com/can1357/oh-my-pi/pull/13701\n\n## New Contributors\n* @mgpai22 made their first contribution in https://github.com/can1357/oh-my-pi/pull/14731\n* @clasalle-lila made their first contribution in https://github.com/can1357/oh-my-pi/pull/14835\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.8.5...v18.8.6","reactions":{"total_count":8,"+1":4,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":11}
