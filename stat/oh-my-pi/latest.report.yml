DOQxs0bc4pfT5u","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":276646064,"digest":"sha256:cde0bc4ac8ec333c4880039a5242ff33dbfc6544747d67aeb99bb077874aeec1","download_count":1867,"created_at":"2026-10-31T17:55:44Z","updated_at":"2026-10-31T17:56:02Z"},{"id":696073836,"node_id":"RA_kwDOQxs0bc4pfT5s","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":225718272,"digest":"sha256:e6ecd0915122d0077e019b8aa4829948c63cd31420781e30f3fe883cf8aa60b3","download_count":19,"created_at":"2026-10-31T17:55:44Z","updated_at":"2026-10-31T17:55:59Z"},{"id":696073835,"node_id":"RA_kwDOQxs0bc4pfT5r","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":243099136,"digest":"sha256:aa04e4ff3b2d97d604839edf1bcf5a0085818389d9fc8c1a18875ee7b5e3b0f8","download_count":574,"created_at":"2026-10-31T17:55:44Z","updated_at":"2026-10-31T17:56:01Z"},{"id":696073845,"node_id":"RA_kwDOQxs0bc4pfT51","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:12d0ef1940e3f2dda966044deb642f33e6d6268e0cda5e6280892e37ce0bdedb","download_count":244,"created_at":"2026-10-31T17:55:44Z","updated_at":"2026-10-31T17:55:44Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Added\n\n- The soft steering signal a tool sees as `toolCall.steeringSignal` now aborts with the source of the queued message (`\"user\"`, `\"irc\"`, …) as its `reason`, so a tool can yield only to the sources it should ([#17537](https://github.com/can1357/oh-my-pi/issues/17537))\n\n### Fixed\n\n- Reject incomplete local compaction, turn-prefix, handoff, and branch summaries ending with `stopReason: \"length\"` instead of using truncated text as complete context. Omit incomplete display-only short summaries without discarding a completed full summary ([#17499](https://github.com/can1357/oh-my-pi/pull/17499) by [@Xytronix](https://github.com/Xytronix)).\n\n## @oh-my-pi/pi-ai\n\n### Breaking Changes\n\n- Replaced `isLoopGuardedModel` with `loopGuardLevel`, which returns `\"off\"`, `\"exact\"`, or `\"semantic\"` from the model's `thinking-loop-guard` catalog rule\n\n### Added\n\n- Added `disableServerSideFallback` to `FactoryDroidOptions` and `SimpleStreamOptions`: a Factory Droid request leaves out the server-side refusal fallback chain and fails, before any of its content is streamed, if another model answers it ([#12229](https://github.com/can1357/oh-my-pi/pull/12229) by [@Xytronix](https://github.com/Xytronix))\n\n### Changed\n\n- DeepSeek and Grok models on Amazon Bedrock now get the same near-duplicate reasoning-loop checks as on other hosts\n\n### Fixed\n\n- Fixed Claude turns failing with \"Thinking loop detected\" when summarized thinking repeated a progress line such as \"Still writing the parser...\"; Claude models no longer run the loop guard\n- Fixed the loop guard discarding turns from other models whose reasoning summary repeats one status line a few times; whole-line repetition now has to cover about 1 KB before it counts as a loop\n- Fixed per-request OpenAI-compatible headers being combined with differently cased model headers instead of overriding them ([#17513](https://github.com/can1357/oh-my-pi/pull/17513) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed a stalled Anthropic stream that keeps sending empty content deltas never timing out, because those deltas were treated as stream progress ([#17484](https://github.com/can1357/oh-my-pi/pull/17484) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed Anthropic-compatible endpoints that put a thinking signature on the streamed content block losing it, so replayed reasoning keeps its signed block ([#17483](https://github.com/can1357/oh-my-pi/pull/17483) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed `AuthStorage.close()` and `replaceStore()` losing a rotated OAuth refresh token when a refresh was still in flight, with or without durable refresh leases; the store now stays open until that token is saved, and new refreshes are refused ([#17518](https://github.com/can1357/oh-my-pi/issues/17518))\n- Fixed `/usage` showing Cursor's \"Other Models\" meter as an inflated dollar amount; it now shows the percentage Cursor reports, like Cursor Models ([#17462](https://github.com/can1357/oh-my-pi/pull/17462) by [@eggpeat](https://github.com/eggpeat))\n- Fixed the `omp auth-gateway` Responses endpoint rejecting documented null values for temperature, `top_p`, output limits, reasoning, and reasoning summaries ([#17466](https://github.com/can1357/oh-my-pi/pull/17466) by [@Xytronix](https://github.com/Xytronix)).\n- Fixed provider HTTP errors printing the response body twice when the thrown error already carried it, including responses with a retry header ([#17503](https://github.com/can1357/oh-my-pi/pull/17503) by [@metaphoric-dev](https://github.com/metaphoric-dev))\n- Fixed Gemini tool calls through the `omp auth-gateway` chat-completions endpoint failing on the next turn: the gateway now returns each call's thought signature in `extra_content` and replays the one a client sends back ([#17509](https://github.com/can1357/oh-my-pi/pull/17509) by [@justdoGIT](https://github.com/justdoGIT))\n\n## @oh-my-pi/pi-catalog\n\n### Breaking Changes\n\n- Removed `thinkingLoopGuard` from compat records; `thinking-loop-guard` is now a catalog axis that applies on every host, with `\"semantic\"` for Gemini, DeepSeek, and Grok and `\"off\"` for Claude\n\n### Fixed\n\n- Fixed GitHub Copilot Claude 5.x base models (`claude-opus-5`, `claude-opus-5.5`, `claude-sonnet-5`, `claude-sonnet-5.5`) reporting the 1M window of their `-1m` variants once the model list was read from cache; discovered limits now survive cached reads instead of reverting to bundled values ([#17481](https://github.com/can1357/oh-my-pi/issues/17481))\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added `task.perCallModel` (`off` by default, `eval`, `on`) so a task item or an eval `agent()`/`workpool()` call can run on one exact model the operator already names: a chat role from your own (non-project) settings, the selected agent's own model, or the parent's current model. Glob values (`anthropic/*`) never approve a model. `task.perCallModelAllow` narrows that list, `task.maxEffort` caps the worker's effort, and the worker never switches to another model. Project settings can only narrow this: they never turn it on or approve a model ([#12229](https://github.com/can1357/oh-my-pi/pull/12229) by [@Xytronix](https://github.com/Xytronix))\n- Added `Settings.reloadFromDisk({ includeParents: true })`, which reloads the persisted settings behind an overlay while keeping the overlay's own overrides ([#12229](https://github.com/can1357/oh-my-pi/pull/12229) by [@Xytronix](https://github.com/Xytronix))\n\n### Changed\n\n- `model` is now declared in every task schema: a task call, eval `agent()` or `workpool()` that passes a model the operator's configuration does not allow is refused with an error ([#12229](https://github.com/can1357/oh-my-pi/pull/12229) by [@Xytronix](https://github.com/Xytronix))\n- Viewing a subagent or returning to the main session no longer posts a \"Viewing agent …\" / \"Returned to main session\" status (a popup in Tern); the status line and Tern's composer already show which agent is in view\n- In a Tern pane, `omp stats` shows the dashboard in place of the block it runs in, with a Close button (or Esc, or Ctrl+C) that stops it and brings the terminal back, and `/stats` opens it in a browser block beside omp, instead of the system browser\n- `bash` tool commands now see `PI_TOOL_CALL_ID`, the id of the call running them, so a script the agent runs can point at that call in the session transcript ([#17489](https://github.com/can1357/oh-my-pi/pull/17489) by [@will-bogusz](https://github.com/will-bogusz))\n- Native judgments with a configured fallback now move to it after a 3-second candidate deadline (configurable with `judgment.attemptTimeoutMs`) and briefly skip the timed-out route; without a configured fallback a slow judge is never cut off or replaced ([#17465](https://github.com/can1357/oh-my-pi/pull/17465) by [@Xytronix](https://github.com/Xytronix)).\n\n### Fixed\n\n- Fixed a `!` or `$` command run while the agent works floating over the composer in Tern, where expanding its output covered the conversation; it now sits at the end of the conversation\n- Fixed `out://` replies sent from an eval cell (`tool.write` to `out://`, or `tool.bash` with `> out://`) never appearing even though the write reported \"Shown to the user.\"; they now draw as replies after the eval card, and are refused where nothing would show them (a backgrounded cell, a browser tab script)\n- Fixed a `write` to `out://` (such as `out://baselines.md`) drawing as a Write card with line numbers instead of a reply streaming as prose\n- Fixed table charts drawing a `ratio` or `speedup` column as a series beside the timings it was computed from, which read as \"719× less\" against the baseline\n- Fixed `read` of a directory hiding existing `dist`, `build`, `node_modules`, `.git`, and other dependency/build/cache subdirectories, which made them look absent ([#17539](https://github.com/can1357/oh-my-pi/issues/17539))\n- Fixed artifact writes reporting the staging-file cleanup error instead of the original short-write or publication failure ([#17485](https://github.com/can1357/oh-my-pi/pull/17485) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed MCP tool calls failing without reconnecting after DNS or socket-open errors ([#17461](https://github.com/can1357/oh-my-pi/pull/17461) by [@Xytronix](https://github.com/Xytronix)).\n- Fixed MCP connection timeouts and cancellation allowing a stdio server to start after the connection attempt had already failed. ([#17512](https://github.com/can1357/oh-my-pi/pull/17512) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed ACP updates and extension dialogs switching to an unadvertised session handle after a session reset, and a client reopening a continued conversation after a restart landing on the original session ([#17517](https://github.com/can1357/oh-my-pi/pull/17517) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed IRC coordination cards remaining visible when Hide Tool Activity is enabled, including live messages and replay ([#17498](https://github.com/can1357/oh-my-pi/pull/17498) by [@dannyboy-ai](https://github.com/dannyboy-ai)).\n- Fixed a message you queue while the agent waits on `ask` sitting behind the unanswered dialog; the dialog now closes without cancelling the turn, while IRC messages and background completions leave it open ([#17537](https://github.com/can1357/oh-my-pi/issues/17537)).\n- Fixed JS eval `output()` ignoring its documented `offset`, `limit`, `query` and `format` options and returning the raw `read` tool result; it now returns the selected text (or the `format: \"json\"` metadata) like Python's `output()` ([#17455](https://github.com/can1357/oh-my-pi/issues/17455))\n- Fixed session lookup losing readable project sessions when an unrelated project folder is unreadable ([#17467](https://github.com/can1357/oh-my-pi/pull/17467) by [@Xytronix](https://github.com/Xytronix)).\n- Fixed the advisor resending a byte-identical refused review before trying its model fallback when the review contained no primary reasoning to strip ([#17473](https://github.com/can1357/oh-my-pi/issues/17473))\n- Fixed `read` of a whole URL returning no content when the page's first line is over the 50 KB output budget, as on minified pages read with `:raw`; it now shows that line's first 50 KB ([#17500](https://github.com/can1357/oh-my-pi/pull/17500) by [@will-bogusz](https://github.com/will-bogusz))\n- Fixed an advisor whose usage-limited account kept being reported as switchable retrying the same capped account thousands of times; it now tries each sibling account at most once per provider per failing review, then falls back, waits, or pauses on the quota ([#17472](https://github.com/can1357/oh-my-pi/issues/17472))\n- Fixed LSP definition, type definition, implementation and reference results carrying a stray carriage return on every source context line from files with Windows (CRLF) line endings ([#17549](https://github.com/can1357/oh-my-pi/pull/17549) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n\n## @oh-my-pi/pi-mnemopi\n\n### Fixed\n\n- Fixed heuristic episodic facts storing word fragments (`Drafting is active.` → `ctive`), truncated multiword objects, or nothing for `has an …` sentences ([#17511](https://github.com/can1357/oh-my-pi/issues/17511))\n\n## @oh-my-pi/pi-natives\n\n### Added\n\n- Added `listWorkspace({ pruneExcludedDirs: false })` to stop pruning standard dependency/build directory names; hidden directories such as `.git` also require `hidden: true` ([#17539](https://github.com/can1357/oh-my-pi/issues/17539))\n\n## @oh-my-pi/omp-stats\n\n### Added\n\n- Added `setStatsCloseHandler`: while a host sets one, the dashboard shows a Close button in its top bar and closes on Esc or Ctrl+C (with no text selected), for hosts that show it in place of their terminal\n\n### Fixed\n\n- Fixed tool error rates counting skipped tool calls that were explicitly marked as not executed ([#17463](https://github.com/can1357/oh-my-pi/pull/17463) by [@Xytronix](https://github.com/Xytronix)).\n\n## @oh-my-pi/pi-tui\n\n### Added\n\n- Added `assertModelSupportsEffortCeiling()`, which throws when a model has no supported thinking effort at or below a `task.maxEffort` ceiling ([#12229](https://github.com/can1357/oh-my-pi/pull/12229) by [@Xytronix](https://github.com/Xytronix))\n- Added `iconButton()`, `quietButton()` and `segmentedTabs()` to `native/overlay`, and `disabled`, `busy` and `icon` options to `actionButton()`\n- Added `nativeTail` to `Composer.setRuntimeChildren` options: containers whose children continue the native surface's `main` after the transcript instead of riding in the dock\n- Added `isHighlightLanguage` and `createCodeFrameStyler` for renderers that highlight source lines in their file's language ([#17550](https://github.com/can1357/oh-my-pi/pull/17550) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n\n### Changed\n\n- Grep and read results with gaps between line runs now render in Tern as one code block that scrolls sideways as a whole, with `…` gap rows aligned in the line-number gutter\n- Tern builds that draw the `button` kind get omp's buttons as real buttons (pointer cursor, accessible pressed/disabled state, a disabled button's tooltip says why) and segmented controls as `tabs` `variant: \"segmented\"`; older Tern builds keep the role-styled rows\n- Source lines in Grep, AST Grep and Find results and LSP symbol names are syntax-highlighted in their file's language instead of drawn in one color; consecutive lines highlight together, so multi-line strings and comments keep their colors ([#17550](https://github.com/can1357/oh-my-pi/pull/17550) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n\n### Fixed\n\n- Fixed table charts plotting a ratio column against the timings it divides (`ratio` 0.997 beside `C++ (ms)` drew as \"719× less\"): `analyzeTable` reads a column equal to the quotient of two others as restating them, written bare or as `×`\n- Fixed IRC coordination cards remaining visible when Hide Tool Activity is enabled, including incoming messages, automatic replies, relays, and workpool messages in live and replayed transcripts ([#17498](https://github.com/can1357/oh-my-pi/pull/17498) by [@dannyboy-ai](https://github.com/dannyboy-ai)).\n- Fixed text after a nested color losing the outer color, such as the rest of the `/mcp` and `/ssh` hints after the highlighted command (`Run /mcp list to see all configured servers.`) falling back to the default text color instead of staying muted ([#17521](https://github.com/can1357/oh-my-pi/pull/17521) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Fixed LSP definition, type definition and implementation results showing the raw `Found 1 definition(s):` text; the response now counts them (`1 definition`) and shows each location over its source lines, its own line marked like a grep match ([#17549](https://github.com/can1357/oh-my-pi/pull/17549) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Fixed an LSP definition, type definition or implementation location whose path starts with whitespace being dropped, with its source lines shown under the previous location\n- Fixed session tree user and assistant turns looking identical in themes whose `accent` and `success` colors match or nearly match (`dark-terminal`, `dark-poimandres`, `light-poimandres`): user rows are now bold, the `assistant:` label switches to the path color, and custom and advisor messages are muted ([#17520](https://github.com/can1357/oh-my-pi/pull/17520) by [@wolfiesch](https://github.com/wolfiesch))\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added `oklabDistance`, the perceptual distance between two hex colors ([#17520](https://github.com/can1357/oh-my-pi/pull/17520))\n\n## @oh-my-pi/pi-wire\n\n### Added\n\n- Added `nums` to `code` props (`TspCodeProps`): each line's number, so one block can show non-contiguous lines with `…` gap rows where the numbers jump.\n- Added the TSP `button` kind (`TspButtonProps`: label, icon, keycaps, `default`/`primary`/`quiet`/`danger` variants, `sm`/`md` sizes, pressed, disabled with a reason, busy) and `tabs` `variant: \"segmented\"`.\n\n\n## What's Changed\n* fix(tui): tell session tree user turns from assistant turns beyond hue by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/17520\n* chore(coding-agent): remove SQLite files committed with the RPC test fixture by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/17501\n* fix(ai): accept nullable Responses request controls by @Xytronix in https://github.com/can1357/oh-my-pi/pull/17466\n* fix(advisor): bounded credential switches on repeated quota failures by @roboomp in https://github.com/can1357/oh-my-pi/pull/17476\n* fix(catalog): kept discovered rows on cached additive-catalog reads by @roboomp in https://github.com/can1357/oh-my-pi/pull/17482\n* fix(ai): stop empty Anthropic deltas from renewing stream timeouts by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/17484\n* fix(coding-agent): preserve artifact write errors when cleanup fails by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/17485\n* feat(coding-agent): expose PI_TOOL_CALL_ID to bash commands by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/17489\n* fix(compaction): reject length-truncated summaries and handoffs by @Xytronix in https://github.com/can1357/oh-my-pi/pull/17499\n* fix(coding-agent): show the head of an over-budget first line on whole-URL reads by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/17500\n* fix(ai): print provider error bodies once by @metaphoric-dev in https://github.com/can1357/oh-my-pi/pull/17503\n* fix(mcp): cancel pending stdio creation when connection ends by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/17512\n* fix(ai): honor case-insensitive per-request header overrides by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/17513\n* fix(mnemopi): kept whole words and phrases in episodic fact objects by @roboomp in https://github.com/can1357/oh-my-pi/pull/17516\n* fix(acp): keep protocol session handles stable across resets by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/17517\n* fix(ai): drained in-flight oauth refresh before closing auth store by @roboomp in https://github.com/can1357/oh-my-pi/pull/17519\n* fix(tui): keep a color applied over styled text after the inner styling ends by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/17521\n* test(coding-agent): make three tests independent of HOME and the inline image budget's value by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17527\n* fix(ask): interrupted pending dialogs for queued steering by @roboomp in https://github.com/can1357/oh-my-pi/pull/17541\n* fix(coding-agent): listed build and dependency dirs in read directory output by @roboomp in https://github.com/can1357/oh-my-pi/pull/17543\n* fix(lsp): render definition results as locations over their source by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/17549\n* feat(tui): highlight search results and LSP symbols in their file's language by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/17550\n* fix(coding-agent): honoured js eval output() offset/limit/query/format by @roboomp in https://github.com/can1357/oh-my-pi/pull/17460\n* fix(mcp): retry DNS and socket-open failures by @Xytronix in https://github.com/can1357/oh-my-pi/pull/17461\n* fix(ai): show Cursor's Other Models meter as a percentage by @eggpeat in https://github.com/can1357/oh-my-pi/pull/17462\n* fix(stats): exclude synthetic non-executions from tool errors by @Xytronix in https://github.com/can1357/oh-my-pi/pull/17463\n* fix(judgment): bound stalled native attempts and fail over by @Xytronix in https://github.com/can1357/oh-my-pi/pull/17465\n* fix(coding-agent): isolate unavailable session buckets by @Xytronix in https://github.com/can1357/oh-my-pi/pull/17467\n* fix(advisor): skipped the no-op reasoning strip on refusals by @roboomp in https://github.com/can1357/oh-my-pi/pull/17475\n* fix(ai): keep a thinking signature delivered on content_block_start by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/17483\n* fix(tui): make IRC cards respect Hide Tool Activity by @dannyboy-ai in https://github.com/can1357/oh-my-pi/pull/17498\n* fix(ai): keep Google thought signature in gateway by @justdoGIT in https://github.com/can1357/oh-my-pi/pull/17509\n* feat(task,eval): per-call model selector limited to operator-configured models by @Xytronix in https://github.com/can1357/oh-my-pi/pull/12229\n* docs: add Simplified Chinese README (README.zh-CN.md) by @bigHippoZz in https://github.com/can1357/oh-my-pi/pull/17480\n\n## New Contributors\n* @metaphoric-dev made their first contribution in https://github.com/can1357/oh-my-pi/pull/17503\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.14.1...v18.14.2","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":12}
