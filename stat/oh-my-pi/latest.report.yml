OQxs0bc4j6oY1","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":2,"created_at":"2026-10-01T06:07:54Z","updated_at":"2026-10-01T06:07:54Z"}],"body":"## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Fixed omp 18.4.3 and later crashing with a segmentation fault at startup on Apple silicon Macs running macOS older than 27; Apple Foundation Models support now loads only on macOS 27 and later\n\n## @oh-my-pi/pi-tui\n\n### Added\n\n- Added an optional `terminal` section to theme JSON (`background`, `foreground`, `chrome`, `widget`, 16 `ansi` colors) naming the terminal a theme was made for, for hosts that paint the terminal themselves; the built-in themes ported from known schemes (GitHub, Nord, Dracula, Catppuccin, Solarized, Gruvbox, Tokyo Night, One, Monokai, Ros\u00e9 Pine, Poimandres, Celestial) carry their scheme's.\n\n### Fixed\n\n- Fixed native-terminal (TSP) frames held back by unacknowledged credits waiting for an unrelated render after the 5-second stall fallback expired; a credit-blocked change now renders as soon as the oldest frame counts as stalled.\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.4.7...v18.4.8"}
