pi-ai\n\n### Added\n\n- Added the Antigravity CLI ACP provider with managed installation, Google sign-in, refreshable distributed credentials, host tools, and retained conversations across tool steps and history changes.\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added Antigravity CLI models for Gemini, Claude and GPT-OSS with selectable native thinking levels.\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added the `antigravity-cli` provider for Google Antigravity over ACP, with managed binary installation, `/login antigravity-cli` Google sign-in, host tool execution, and retained conversations across tool steps and history changes.\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added a profile-aware data directory for managed Antigravity CLI installations and isolated account state.\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.20.1...v18.20.2","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
