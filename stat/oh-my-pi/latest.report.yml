wDOQxs0bc4gvIsv","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":200111584,"digest":"sha256:27dd66cb6a2c39fff51e1fe6db40f1f376fee4a3d04457f236edaa5d0290e4d2","download_count":5100,"created_at":"2026-09-07T18:42:14Z","updated_at":"2026-09-07T18:42:25Z"},{"id":549227317,"node_id":"RA_kwDOQxs0bc4gvIs1","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":149848064,"digest":"sha256:9b70fe6b3a3dd69c5ba8f089777f05bc12f68c477f89a226a5863fe8b431192b","download_count":11,"created_at":"2026-09-07T18:42:14Z","updated_at":"2026-09-07T18:42:23Z"},{"id":549227319,"node_id":"RA_kwDOQxs0bc4gvIs3","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":160688640,"digest":"sha256:f5b46850f92ad2c2aa337b094fbf51742417ecdd808c088e24bb3d21b19e5177","download_count":2780,"created_at":"2026-09-07T18:42:14Z","updated_at":"2026-09-07T18:42:24Z"},{"id":549227321,"node_id":"RA_kwDOQxs0bc4gvIs5","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:5601561dfdc3b7892ee81e3c7e378dbc870ad13cf234df5a1e8451ba55f28263","download_count":178,"created_at":"2026-09-07T18:42:14Z","updated_at":"2026-09-07T18:42:14Z"},{"id":549227314,"node_id":"RA_kwDOQxs0bc4gvIsy","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1077086,"digest":"sha256:104142244b8781b7828e64aa79a61b03fdf16e8a3464278647c3d84ad22cbce0","download_count":15,"created_at":"2026-09-07T18:42:14Z","updated_at":"2026-09-07T18:42:14Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Fixed reasoning-off requests (e.g. GitHub Copilot `gpt-6-astra`) surfacing `400 Unsupported value: 'none' \u2026 Supported values are: \u2026` instead of retrying at the lowest allowed effort: the reasoning-effort fallback now recognizes `Supported values` phrasing ([#11128](https://github.com/can1357/oh-my-pi/pull/11128) by [@H4vC](https://github.com/H4vC)).\n- Fixed Cursor GPT off-tier requests sending raw `-none` sibling ids (e.g. `gpt-5.6-sol-none-fast`), which the Run endpoint rejects; they now normalize to the base model id with no reasoning parameter, matching every other effort tier ([#11128](https://github.com/can1357/oh-my-pi/pull/11128) by [@H4vC](https://github.com/H4vC)).\n\n## @oh-my-pi/pi-catalog\n\n### Fixed\n\n- Bills Astra API requests above 272K input at the documented 2x input / 1.5x output long-context tier; the Codex subscription route stays exempt with free cache writes ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Fixed Astra's extended window over-advertising input by 128K; it now uses the documented 922K input cap inside the 1.05M total context ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Fixed explicit Codex context-window overrides widening past the server-honored maximum; they now clamp to the documented ceiling like upstream Codex ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Fixed Codex Astra using its larger window without opt-in; its default is 272K and Extended Context enables at least the documented 1.05M window ([#11126](https://github.com/can1357/oh-my-pi/pull/11126) by [@H4vC](https://github.com/H4vC)).\n- Fixed GitHub Copilot enterprise-only model ids inheriting another provider's wire routing (e.g. `gpt-5.6-sol-fast` pinning every request to the `-none` sibling id regardless of thinking level) ([#11128](https://github.com/can1357/oh-my-pi/pull/11128) by [@H4vC](https://github.com/H4vC)).\n\n## @oh-my-pi/pi-coding-agent\n\n### Fixed\n\n- The startup update notice counts every change in a release: bullets written above a `###` heading now count under `Other`, and `+`/`*` markers and lightly indented bullets count like `-`.\n- Fixed Codex Astra retaining its larger window after disabling Extended Context, including cached models; explicit model overrides still take precedence.\n- Fixed explicit Codex context-window overrides widening past the server-honored maximum; they now clamp to the documented ceiling like upstream Codex ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Fixed Astra's extended window over-advertising input by 128K; it now uses the documented 922K input cap inside the 1.05M total context ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Bills Astra API requests above 272K input at the documented 2x input / 1.5x output long-context tier; the Codex subscription route stays exempt with free cache writes ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Fixed Extended Context silently enabling without a settings source (SDK embedding, early boot); it now matches the off default until opted in ([#11157](https://github.com/can1357/oh-my-pi/pull/11157) by [@H4vC](https://github.com/H4vC)).\n- Fixed `/copy` link captions showing Markdown delimiters for formatted labels and splitting across two rows for multiline labels ([#11086](https://github.com/can1357/oh-my-pi/pull/11086) by [@mustafaabidali](https://github.com/mustafaabidali)).\n- Fixed Ask custom answers requiring another submission after paste or remaining on the same multi-select question; pending clipboard text is preserved before submission, and single-question multi-select answers still go through review ([#11099](https://github.com/can1357/oh-my-pi/pull/11099) by [@camjac251](https://github.com/camjac251)).\n- The startup update notice no longer counts standalone `* * *` and `- - -` separator lines as changes.\n- Fixed `/loop` replacing the repeating prompt with a mid-turn interjection; steering while the agent runs is now one-off, and only an idle submission becomes the new loop body ([#11159](https://github.com/can1357/oh-my-pi/pull/11159) by [@H4vC](https://github.com/H4vC)).\n\n## @oh-my-pi/pi-tui\n\n### Fixed\n\n- `extractMarkdownLinks()` now returns one-row visible labels for formatted and multiline links ([#11086](https://github.com/can1357/oh-my-pi/pull/11086) by [@mustafaabidali](https://github.com/mustafaabidali)).\n\n\n## What's Changed\n* fix(lsp): evaluate idle timeout per workspace client (#8389) by @harshaygadekar in https://github.com/can1357/oh-my-pi/pull/10237\n* test(mcp): event-gate the reauth manual-input claim instead of a wall-clock budget by @rigel-mintaka in https://github.com/can1357/oh-my-pi/pull/11117\n* fix(coding-agent): preserve and advance Ask custom answers by @camjac251 in https://github.com/can1357/oh-my-pi/pull/11099\n* fix(tui,copy): flatten Markdown link labels to one visible row for /copy captions by @mustafaabidali in https://github.com/can1357/oh-my-pi/pull/11086\n* fix(catalog,coding-agent): keep Astra 1.05M window behind extended-context opt it by @H4vC in https://github.com/can1357/oh-my-pi/pull/11126\n* fix(ai): preserve Codex WebSocket abort causes by @Morrowmake in https://github.com/can1357/oh-my-pi/pull/11046\n* docs(browser): clarify tab.evaluate string semantics by @vwsa in https://github.com/can1357/oh-my-pi/pull/11114\n* fix(changelog): stop the startup notice undercounting a release by @2233admin in https://github.com/can1357/oh-my-pi/pull/11070\n* docs(changelog): hoist post-18.1.12 changes into 18.1.13 by @H4vC in https://github.com/can1357/oh-my-pi/pull/11138\n* fix(changelog): skip thematic breaks and gate unreleased notes by con\u2026 by @H4vC in https://github.com/can1357/oh-my-pi/pull/11134\n* fix(ai): retry Copilot Supported-values none rejection; normalize Cur\u2026 by @H4vC in https://github.com/can1357/oh-my-pi/pull/11128\n* test(mcp): replace the remaining wall-clock gates in the reauth tests with sync points by @rigel-mintaka in https://github.com/can1357/oh-my-pi/pull/11146\n* test(coding-agent): fix red runtime/session job on main by @sethmorton in https://github.com/can1357/oh-my-pi/pull/9460\n* fix(robomp): load work-items fixture from URL by @roboomp in https://github.com/can1357/oh-my-pi/pull/10886\n* fix(cli): reap orphaned IPC subprocess workers when parent terminates by @harshaygadekar in https://github.com/can1357/oh-my-pi/pull/11141\n* fix(compaction): defer idle compaction while an async job is pending by @mattwilkinsonn in https://github.com/can1357/oh-my-pi/pull/10223\n* Fix/codex faithful context window by @H4vC in https://github.com/can1357/oh-my-pi/pull/11157\n* fix(coding-agent): keep mid-turn steers from replacing the /loop prompt by @H4vC in https://github.com/can1357/oh-my-pi/pull/11159\n\n## New Contributors\n* @harshaygadekar made their first contribution in https://github.com/can1357/oh-my-pi/pull/10237\n* @rigel-mintaka made their first contribution in https://github.com/can1357/oh-my-pi/pull/11117\n* @camjac251 made their first contribution in https://github.com/can1357/oh-my-pi/pull/11099\n* @Morrowmake made their first contribution in https://github.com/can1357/oh-my-pi/pull/11046\n* @vwsa made their first contribution in https://github.com/can1357/oh-my-pi/pull/11114\n* @2233admin made their first contribution in https://github.com/can1357/oh-my-pi/pull/11070\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.1.13...v18.1.14","reactions":{"total_count":5,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":11}
