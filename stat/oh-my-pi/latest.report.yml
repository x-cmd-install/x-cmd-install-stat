_kwDOQxs0bc4jbcDa","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":3,"created_at":"2026-09-28T03:33:16Z","updated_at":"2026-09-28T03:33:16Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Changed\n\n- Updated telemetry attribute names from the `pi.*` namespace to the `omp.*` namespace.\n\n## @oh-my-pi/pi-ai\n\n### Breaking Changes\n\n- Changed `LimitsApi.rotate()` to return a `CredentialRotation` object (`{ switched, afterSiblingWait? }`) instead of a boolean. Check `.switched` explicitly, since the returned object is always truthy.\n\n### Added\n\n- Added image metadata to hosted OpenAI image-generation results, including the model used and each generated image\u2019s dimensions and quality.\n\n### Changed\n\n- Redesigned the browser page displayed during OAuth login.\n\n### Fixed\n\n- Fixed Anthropic accounts remaining blocked after quota resets, including for broker-connected clients, while preserving independent authentication and model-limit restrictions.\n- Fixed concurrent usage refreshes repeatedly probing providers after failures, reducing unnecessary usage-endpoint requests.\n- Fixed Gemini and Antigravity usage and cost reporting when upstream responses omit prompt-token counts or report more cached tokens than prompt tokens.\n- Fixed credential failover after authentication errors so stored credentials rotate through every distinct sibling instead of stopping after one attempt; rotation can also wait briefly for a temporarily blocked healthy sibling to become available.\n- Fixed native judge responses without token counts producing invalid usage and cost values.\n- Fixed Cursor usage, cost, and context accounting to include final input, cache, reasoning, and output metrics, improving compaction and handoff sizing.\n- Fixed Cursor MCP tool calls routed through external executors being returned as text instead of tool calls.\n- Fixed Cursor shell-tool timeouts being displayed in milliseconds rather than seconds.\n- Fixed fetch requests over Unix sockets when `PI_PROXY` is configured.\n- Fixed Ollama chat turns being recorded with zero cost; usage is now priced using the model\u2019s cost information.\n- Fixed Anthropic requests failing after native compaction when per-message effort settings were present; effort controls are now handled correctly with compaction.\n\n## @oh-my-pi/pi-catalog\n\n### Fixed\n\n- Corrected Cerebras model pricing so cached input tokens are charged at the model\u2019s input rate, consistent with Cerebras billing.\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added the `telemetry.otlpExportEnabled` setting under Settings \u2192 Providers \u2192 Privacy to disable OTLP trace, log, and metric export even when `OTEL_*` endpoints are configured; exporting remains enabled by default.\n- Added a first-launch warning when Python evaluation is enabled but no working Python interpreter is available, with guidance for configuring `python.interpreter` and checking the installation with `omp setup python --check`.\n\n### Changed\n\n- Updated `omp stats` and `/stats` to open the redesigned dashboard immediately while session data synchronizes in the background with live progress; `--json` and `--summary` continue to synchronize before producing output.\n- Replaced the stats dashboard\u2019s Behavior page with a Frustration page that can classify messages using the `judge` model role, showing an estimated cost before analysis and recording `/stats` spending in the current session.\n- Clarified the `eval` tool documentation to explain that its kernel may be shared with the parent session and concurrent task subagents.\n\n### Fixed\n\n- Fixed `/tree` reopening saved Ask results instead of navigating past them when an optional preview was saved as `null`.\n- Fixed the legacy `createGrepTool()` API when searching with both a file path and a `glob` filter.\n- Improved task and subagent reliability: eligible saved usage resets are now redeemed automatically when polling is throttled or transient failures occur, concurrent tasks share confirmed resets, headless subagents retain assignments across session transitions, tagged `^model` agents are available to nested subagents, and `wait` returns promptly with information about still-running work when no owned jobs are available.\n- Fixed SDK requests using `ApiKeyResolver` to wait for a nearby healthy credential when a drained account\u2019s quota block is about to expire, instead of immediately failing with a multi-hour quota error.\n- Fixed Anthropic requests failing after native compaction when experimental context notes were enabled.\n- Fixed Windows path handling for 8.3 short paths, including project-directory detection and home-directory display in status, tool labels, and errors.\n- Fixed `edit` `PUT >N` producing syntactically invalid code when inserting shallower constructs near closing braces.\n- Fixed Windows one-shot commands, including `omp update`, incorrectly reporting successful completion as an error; also fixed this behavior when no user npm or Bun configuration file exists.\n- Fixed missing judge token counts corrupting session usage totals and displaying `$NaN`.\n- Fixed Cursor sessions under-reporting token usage and cost, compacting based on the wrong context measurement, and applying shell-command timeouts in the wrong units.\n- Updated goal mode to wait for user input when all remaining todos are blocked instead of repeatedly requesting approval.\n- Fixed `pi-background-tasks` 2.6.0 and later failing to load due to a missing legacy `pi-ai` compatibility export.\n- Fixed blob broker requests when `PI_PROXY` is configured.\n- Fixed `generate_image` reporting the catalog model instead of the image model actually used by the ChatGPT/Codex backend; saved image metadata now reflects the provider-returned size and quality.\n- Fixed fast-model fallback selection so it no longer chooses Gemini or MiniMax models when no `smol` role is configured.\n- Fixed extension tool renderers using upstream pi\u2019s `renderCall(args, theme, context)` signature failing to render.\n- Fixed Nix flake and NixOS module builds failing because the native package version stamp was not recognized.\n- Fixed Nix dependency-lock checks failing after obsolete stats chart dependencies were removed.\n\n## @oh-my-pi/collab-web\n\n### Changed\n\n- Redesigned the web client: black chassis with one inset session panel, glass top bar with the omp mark and a live status pill, a docked composer card, prompts shown as cards in the transcript, a sectioned agents rail, and a floating agent drawer; the connect screen was rebuilt too\n\n## @oh-my-pi/pi-natives\n\n### Added\n\n- Added Windows path utilities for converting between long and 8.3 short path spellings without resolving symlinks or junctions. Import them from `@oh-my-pi/pi-natives/path`.\n\n### Fixed\n\n- Fixed the native `xargs` builtin so `-P`/`--max-procs` correctly limits parallel command execution, including GNU-compatible `-P 0` behavior.\n- Improved snapcompact rendering performance for stretched shapes on Windows x64, Intel Macs, and Linux CPUs without AVX2, with no visual changes.\n\n## @oh-my-pi/omp-stats\n\n### Changed\n\n- Redesigned the dashboard: new layout, navigation (`g` + letter to jump, `1`\u2013`6` to pick a range), sortable tables and in-house charts on every page\n- The dashboard opens immediately and ingests sessions in the background, most recent activity first, with live progress in the header; pages update as data lands and new session activity appears within seconds\n- Switching time ranges is now near-instant: range queries read hourly rollups instead of scanning every request (seconds \u2192 milliseconds on large histories)\n- Frustration judge runs now scale how many requests they keep in flight (up to 256, backing off on rate limits and retrying after a short delay) and save verdicts in batches; the progress line shows the rate and requests in flight\n- Provider subscription windows load separately from the rest of the Providers page, and the Projects page lists the 2,000 busiest folders\n- Replaced the dashboard's Behavior page with a Frustration page showing, per model version, how often users are annoyed, annoyed at the assistant, and angry at it; a button judges unclassified messages with the host's `judge` model (after a cost estimate) and the chart refines live as verdicts arrive\n\n### Fixed\n\n- Made session-statistics synchronization atomic to prevent duplicate entries when synchronization is interrupted.\n- Improved the speed and reliability of initial and repeat `omp stats` imports, including large session histories and already-indexed histories.\n\n## @oh-my-pi/pi-tui\n\n### Fixed\n\n- Prevented interrupted wait operations from appearing in the transcript when a queued completion or message is received.\n\n\n## What's Changed\n* perf(pi-natives): stopped snapcompact resize lowering mul_add to libm fmaf on x86-64-v2 by @H4vC in https://github.com/can1357/oh-my-pi/pull/13496\n* fix(coding-agent): read optional registry config via fs.promises in omp update by @H4vC in https://github.com/can1357/oh-my-pi/pull/13514\n* fix(cli): kept exit code when loop resumed after beforeExit by @roboomp in https://github.com/can1357/oh-my-pi/pull/13472\n* fix(coding-agent): wait ladder restored to old hub behavior by @H4vC in https://github.com/can1357/oh-my-pi/pull/13516\n* fix(windows): normalize working directories and abbreviate short home paths by @CoderTCY in https://github.com/can1357/oh-my-pi/pull/13394\n* feat(telemetry): add opt-out setting override to disable OTLP export by @krizh-p in https://github.com/can1357/oh-my-pi/pull/13444\n* docs(coding-agent): say the eval kernel is shared with concurrent task subagents by @radkawar in https://github.com/can1357/oh-my-pi/pull/13521\n* fix(pi-edit): keep PUT >N inserts before a closer when moving them breaks the parse by @radkawar in https://github.com/can1357/oh-my-pi/pull/13520\n* feat(coding-agent): eval backend missing by @H4vC in https://github.com/can1357/oh-my-pi/pull/13529\n* test: remove useless tests by @H4vC in https://github.com/can1357/oh-my-pi/pull/13539\n* fix(natives): allowed const-fn lint on windows path exports by @roboomp in https://github.com/can1357/oh-my-pi/pull/13548\n* fix(task): retried dropped headless prompts before yield by @roboomp in https://github.com/can1357/oh-my-pi/pull/13541\n* fix(goal): stop continuations while todos are blocked by @roboomp in https://github.com/can1357/oh-my-pi/pull/13497\n* docs(bash): clarified shellpath execution scope by @roboomp in https://github.com/can1357/oh-my-pi/pull/13420\n* fix(judgment): handled missing judge token counts by @roboomp in https://github.com/can1357/oh-my-pi/pull/13492\n* fix(nix): stamped the native addon version in the nix build by @roboomp in https://github.com/can1357/oh-my-pi/pull/13506\n* fix(ai): price ollama-chat terminal usage from the model cost card by @roboomp in https://github.com/can1357/oh-my-pi/pull/13057\n* fix(extensions): accept pi-order renderCall theme argument by @roboomp in https://github.com/can1357/oh-my-pi/pull/13086\n* fix(coding-agent): stopped smol mini pattern matching gemini models by @roboomp in https://github.com/can1357/oh-my-pi/pull/13410\n* fix(coding-agent): reported the image model the codex backend ran by @roboomp in https://github.com/can1357/oh-my-pi/pull/13404\n* fix(ai): bypassed proxy for unix-socket fetches by @roboomp in https://github.com/can1357/oh-my-pi/pull/13510\n* fix(coding-agent): restore anthropic compat adapter by @roboomp in https://github.com/can1357/oh-my-pi/pull/13251\n* fix(ai,coding-agent): recovered cursor turn usage and tool handoffs by @roboomp in https://github.com/can1357/oh-my-pi/pull/13085\n* fix(ai): waited out briefly blocked siblings before failing rotation by @roboomp in https://github.com/can1357/oh-my-pi/pull/13409\n* fix(ai): restore exec-resolved marking for streamed cursor MCP calls by @H4vC in https://github.com/can1357/oh-my-pi/pull/13554\n* fix(ai): drop unreachable cursor exec-resolved branch and its stale test by @H4vC in https://github.com/can1357/oh-my-pi/pull/13563\n* docs(changelog): note cursor MCP exec-resolution cleanup by @H4vC in https://github.com/can1357/oh-my-pi/pull/13565\n* fix(ai): rotated 401s through every distinct stored sibling by @roboomp in https://github.com/can1357/oh-my-pi/pull/13561\n* fix(ai,coding-agent): keep the Anthropic compaction block first in the request by @H4vC in https://github.com/can1357/oh-my-pi/pull/13569\n* fix(tui): restored saved ask questions with null previews by @roboomp in https://github.com/can1357/oh-my-pi/pull/13573\n* fix(coding-agent): corrected legacy grep file glob handling by @roboomp in https://github.com/can1357/oh-my-pi/pull/13574\n\n## New Contributors\n* @krizh-p made their first contribution in https://github.com/can1357/oh-my-pi/pull/13444\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.3.5...v18.4.0","mentions_count":5}
