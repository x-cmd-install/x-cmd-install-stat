wDOQxs0bc4kXj4h","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":280802784,"digest":"sha256:c92a6846d02984e84f07c6362d18add3783f528f494ffcf1e0f26e594f327463","download_count":4159,"created_at":"2026-10-04T16:12:26Z","updated_at":"2026-10-04T16:12:43Z"},{"id":610156063,"node_id":"RA_kwDOQxs0bc4kXj4f","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":224094208,"digest":"sha256:7246e9f4f2a60b9e34d5fab7b95f13d334fed7ca09d72b4663680f8df544924f","download_count":19,"created_at":"2026-10-04T16:12:26Z","updated_at":"2026-10-04T16:12:41Z"},{"id":610156062,"node_id":"RA_kwDOQxs0bc4kXj4e","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":235049472,"digest":"sha256:df10906c558ca188aa044c1c2bf27775693cbcf0aea8f16597dcd6949e0d1a1a","download_count":1988,"created_at":"2026-10-04T16:12:26Z","updated_at":"2026-10-04T16:12:42Z"},{"id":610156071,"node_id":"RA_kwDOQxs0bc4kXj4n","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:a337fe94cf40c2f2acd8d3a68e5f373c7b46374cbc15501e065a7fbaab9ba7c3","download_count":208,"created_at":"2026-10-04T16:12:26Z","updated_at":"2026-10-04T16:12:26Z"},{"id":610156069,"node_id":"RA_kwDOQxs0bc4kXj4l","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":26,"created_at":"2026-10-04T16:12:26Z","updated_at":"2026-10-04T16:12:26Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Fixed\n\n- Fixed native OpenAI context compaction for sessions containing many screenshots, preventing image-size estimates from incorrectly causing compaction requests to be rejected.\n\n## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Fixed compatibility with Command Code DeepSeek and other DeepSeek-family models by preserving the reasoning context required for warm OpenAI Responses sessions and correctly handling incomplete DSML tool-call wrappers in visible output.\n\n## @oh-my-pi/pi-coding-agent\n\n### Fixed\n\n- Fixed waiting for subagent follow-up messages: responses now appear as background jobs that can be waited on or canceled, and are delivered only once.\n- Improved `/switch` autocomplete so model and role suggestions use the same relevance ordering as the model picker, including support for `@role` aliases.\n- Fixed concurrent `skill://` searches blocking other filesystem operations and delaying subagent artifact publication.\n- Fixed compatibility checks for browser relays from other OMP versions and added guidance for resolving stale connection-refused errors.\n- Fixed follow-up hashline edits being incorrectly rejected after earlier edits shifted anchored lines, while continuing to reject genuinely stale line references.\n- Fixed `pi.exec()` reporting exit code `0` when a process was terminated by a timeout or signal; terminated processes now report code `-1`.\n- Fixed `/collab` guests being unable to respond to setting-change approval and tool-issue report consent prompts.\n- Fixed follow-up hashline edits being rejected as anchored on lines \"never displayed\" after an earlier edit shifted those lines, when the replacement carries the anchored content; genuinely stale line numbers are still rejected ([#14254](https://github.com/can1357/oh-my-pi/pull/14254) by [@abilliontokens](https://github.com/abilliontokens)).\n- Fixed long `/btw` answers in Tern being clipped with no way to scroll: `/btw` now answers in the scrollable BTW history sheet ([#14331](https://github.com/can1357/oh-my-pi/pull/14331) by [@H4vC](https://github.com/H4vC))\n- Fixed `/btw` answers longer than 4 KiB being cut off with `[\u2026truncated]` once they finished ([#14331](https://github.com/can1357/oh-my-pi/pull/14331) by [@H4vC](https://github.com/H4vC))\n- In Tern, Esc puts the BTW history sheet away while an answer keeps streaming (`/btw` reopens it); `x` cancels the answer ([#14331](https://github.com/can1357/oh-my-pi/pull/14331) by [@H4vC](https://github.com/H4vC))\n\n## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Fixed concurrent searches through host-provided filesystem callbacks so they no longer starve other asynchronous filesystem operations, and ensured canceled searches release promptly.\n\n## @oh-my-pi/pi-tui\n\n### Fixed\n\n- Fixed the Space key in the Git diff pane so it stages or unstages the focused hunk instead of scrolling or acting on the wrong change.\n- Fixed the BTW history sheet in Tern: the history list no longer collapses beside a long answer, the panes lose their foldable `##` headings, and the arrow/page keys scroll the answer ([#14331](https://github.com/can1357/oh-my-pi/pull/14331) by [@H4vC](https://github.com/H4vC))\n- Fixed a single saved side question in the BTW history panel opening on its one-row list: its answer now has focus, and Enter or `f` to follow up jumps to the bottom of the conversation ([#14331](https://github.com/can1357/oh-my-pi/pull/14331) by [@H4vC](https://github.com/H4vC))\n\n\n## What's Changed\n* fix(pi-edit): accept shift-consistent hashline anchors carrying current content by @abilliontokens in https://github.com/can1357/oh-my-pi/pull/14254\n* fix(agent): estimate image tokens from dimensions for native compaction fit by @H4vC in https://github.com/can1357/oh-my-pi/pull/14260\n* btw ux uplifts, tern specific. by @H4vC in https://github.com/can1357/oh-my-pi/pull/14331\n* fix(collab): mirrored cfg:// approval prompts to collab guests by @roboomp in https://github.com/can1357/oh-my-pi/pull/14282\n* fix(ai): filled reasoning_text on warm summary-only reasoning replay by @roboomp in https://github.com/can1357/oh-my-pi/pull/14294\n* fix(natives): moved provider searches off libuv workers by @roboomp in https://github.com/can1357/oh-my-pi/pull/14298\n* fix(browser): diagnosed stale relay after omp upgrades by @roboomp in https://github.com/can1357/oh-my-pi/pull/14299\n* fix(tui): restored Space row staging in git diff by @roboomp in https://github.com/can1357/oh-my-pi/pull/14329\n* fix(ai): preserved prose after incomplete dsml wrappers by @roboomp in https://github.com/can1357/oh-my-pi/pull/14273\n* fix(coding-agent): reported non-zero exit code for killed exec processes by @roboomp in https://github.com/can1357/oh-my-pi/pull/14290\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.6.0...v18.6.1","reactions":{"total_count":7,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":1,"eyes":1},"mentions_count":3}
