DOQxs0bc4s4jGJ","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":288938160,"digest":"sha256:f34ec9b0f0c368f1937701e2fe111b3c29a7cf53314a642448b3c6cf2925d85a","download_count":2883,"created_at":"2026-11-16T01:38:01Z","updated_at":"2026-11-16T01:38:20Z"},{"id":753021310,"node_id":"RA_kwDOQxs0bc4s4jF-","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":235359232,"digest":"sha256:f230e70bd9ede5192f3a2827eff340b2112b1fb3f38410fe900d91ba690e7710","download_count":13,"created_at":"2026-11-16T01:38:01Z","updated_at":"2026-11-16T01:38:14Z"},{"id":753021315,"node_id":"RA_kwDOQxs0bc4s4jGD","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":252522496,"digest":"sha256:753c705d43c502f24751efd2b4b0c6c2fffc05db65c7b8b7771dca87146c2c19","download_count":384,"created_at":"2026-11-16T01:38:01Z","updated_at":"2026-11-16T01:38:15Z"},{"id":753021311,"node_id":"RA_kwDOQxs0bc4s4jF_","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:215c3a6ead5b674c7390f7e3e04e1df48ae9982809326c5e2dfdc2f529381ca9","download_count":258,"created_at":"2026-11-16T01:38:01Z","updated_at":"2026-11-16T01:38:02Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Breaking Changes\n\n- Removed the public `isXdDevicePath` export from `providers/cursor-pi-args`. Ranged reads of `xd://` documents now use the standard line-selector behavior.\n\n### Fixed\n\n- Fixed rate-limit handling for Mistral and other OpenAI-compatible providers so requests with no available allowance fail immediately with an actionable error suggesting a model or plan change.\n- Fixed Anthropic OAuth requests for pooled Claude accounts to report accurate device and account information, including after credentials are rotated during a request.\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added publicly available image-sizing helpers for determining model-delivered image dimensions and fitting images to a specified long edge before coordinate mapping.\n\n### Fixed\n\n- Fixed image inputs being dropped for DeepSeek V4 Flash, restoring consistent multimodal image support.\n- Restricted reasoning-effort options for Mistral GLM 5.3, GLM 5.3 Flash, and Mistral Large 4 to the levels supported by those models.\n\n## @oh-my-pi/pi-coding-agent\n\n### Breaking Changes\n\n- Renamed the browser `tab.clickAt()` option from `clickCount` to `count`, matching `tab.click()`.\n- Browser viewport screenshot coordinates now use the displayed image coordinates when the screenshot is scaled for the model; pass `css: true` (or `{ x, y, css: true }` for drag points) to provide viewport CSS pixels explicitly.\n- Added opt-in `mnemopi.recallRelevance` (`off`, `auto`, or `on`; default `off`) to filter automatic memory recall for task relevance using the `judge` role.\n- Added path-scoped entries for `bash.patterns` and `bashInterceptor.patterns`, resolved per working directory. Project and `--config` overlays now prepend these rules to global rules instead of replacing them.\n- Added `bash.allowedEnvVars` and per-rule `env` lists to permit explicitly named environment-variable prefixes on matching `allow` rules.\n- Subagents now preserve `@upstream` provider pinning on inherited models.\n- Added `--no-judge`, `--no-spotlight`, and `--offline` options to restrict auxiliary services to the active model's provider or disable cross-provider services.\n- Added per-rule TTSR `repeatMode` frontmatter (`once`, `after-gap`, or `always`) to override the global repeat policy.\n- Compound bash approval prompts now show each command segment separately, distinguishing allowed segments from those requiring approval.\n- Removed the `seance` agent, `/seance` command, and the task tool's `sourceSession` parameter.\n\n### Added\n\n- Added `mnemopi.embeddingQueryPrefix` and `mnemopi.embeddingInputType` configuration for asymmetric and instruction-tuned embedding models, including providers that require an `input_type`.\n\n### Changed\n\n- Browser screenshots are delivered to the model in CSS pixels up to the supported unscaled size, making viewport screenshot coordinates directly usable with browser actions; scaling guidance remains for scaled full-page and element captures.\n- Browser `waitForUrl`, `waitForResponse`, and `requests({ filter })` now support `*` glob patterns in URL strings, while other strings retain substring matching.\n- The WebKit browser engine now automatically installs and updates to the newest stable ABKit release, with versioned installations that allow updates without waiting for existing browser hosts to exit.\n- Improved browser responsiveness and recovery: unresponsive WebKit pages fail fast with actionable errors, navigation can recover busy pages, and browser operations provide clearer diagnostics for timeouts, closed tabs, unsupported event listeners, invalid routes, cookie data, and viewport changes.\n- Pressing Delete at the end of the Ctrl+R search field removes the selected prompt from history.\n- `/copy` now works while viewing a subagent and copies from that subagent's transcript.\n- `find` now returns unranked literal keyword matches when all judge requests fail.\n- `take()` and `drop()` now reject nonexistent hunk units with a clear error.\n- `edit` rejection messages now suggest the file's current tag, and edits made before conflict resolution carry over to the resolved file.\n- `/marketplace` and marketplace install/uninstall commands now report picker and catalog-load errors without exiting the session.\n- ACP sessions honor `mcp.startupTimeoutMs` for MCP servers declared by the client, and ACP form elicitations no longer repeat field labels unnecessarily.\n- Task progress from every `task.steps` subagent step is now preserved, rather than only the final step's report.\n- Pasting HTML into the composer now preserves spaces from whitespace-only inline elements and indentation inside `<pre>` blocks.\n- Queued follow-ups edited with Alt+Up are restored as queued messages instead of being sent into the active turn.\n\n### Fixed\n\n- Fixed `ida` `exec` output on IDA 9.5+ by suppressing helper deprecation warnings and preserving the updated function metadata API.\n- Expired Perplexity logins and cookies no longer return an error page as a search answer; the provider is reported as expired and the search chain continues.\n- Fixed browser WebMCP discovery and invocation on Chrome and Chromium 157 and later.\n- Private hosts written with a trailing dot are now correctly handled by Ask and `always-ask-cached` before file tools access them.\n- Fixed the TUI freezing when switching sessions from an open tool-approval prompt.\n- Fixed `/commit` and eval `commit` dropping UTF-8 BOMs or mishandling quoted and Unicode filenames during change tracking and selective commits.\n- Fixed misleading Wayland clipboard warnings when pasting an image or when the clipboard is empty.\n- Fixed JavaScript evaluation after an in-place Linux upgrade by keeping session workers tied to the session's build.\n- Deleting a session that cannot be removed no longer deletes its prompt history and statistics.\n- Fixed `read` and `write` handling of line selectors on `xd://` device URLs.\n- Fixed `eval wait()` rejecting or mishandling numeric delays; browser waits now direct users to the appropriate wait helpers.\n- Fixed browser `open` with an existing Arch Chromium profile, Tern navigation, closed external Tern blocks, and docked Tern viewport emulation.\n- Fixed Tern and WebKit browser calls that incorrectly exposed unsupported page event-listener APIs; errors now identify the supported alternatives.\n- Fixed browser timeout and busy-page errors to include the current URL, affected tab, and actionable recovery guidance.\n- Fixed Mnemopi embedding failures being silently downgraded to keyword search; provider errors now produce a warning, including in print mode on stderr.\n\n## @oh-my-pi/pi-mnemopi\n\n### Added\n\n- Added configurable embedding query prefixes and input types for instruction-tuned and asymmetric embedding models, including Qwen3-Embedding, E5, and NVIDIA NIM.\n- Added the `embeddings.onRequestFailed` callback, allowing hosts to handle and surface failed embedding API requests.\n\n## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Committing or writing trees now correctly reports unresolved index conflicts instead of silently omitting conflicted files.\n- Fixed shell compatibility with GNU `grep` for end-of-line-anchored patterns, including `-o` and `-z` modes, and corrected `sed` substitutions on multibyte-character lines.\n- Fixed native diff and patch handling for filenames containing spaces and other characters requiring quoting, including binary changes.\n\n## @oh-my-pi/pi-utils\n\n### Fixed\n\n- Fixed HTML-to-Markdown conversion for fetched and pasted HTML to preserve whitespace in inline elements, maintain code indentation in preformatted blocks, and avoid inserting stray blank lines between block elements.\n\n\n## What's Changed\n* fix(edit): offer the current tag for the rows shown when a header tag is unknown by @Xytronix in https://github.com/can1357/oh-my-pi/pull/19332\n* fix(approval): gate private hosts written with a trailing dot by @XYZ1024-alt in https://github.com/can1357/oh-my-pi/pull/19228\n* fix(find): list literal keyword matches when every judge request fails by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/19231\n* fix(browser): launch Chromium with the WebMCP feature enabled by @tuschla in https://github.com/can1357/oh-my-pi/pull/19232\n* fix(coding-agent): kept retained snapshots when a conflict:// write resolves a block by @tuschla in https://github.com/can1357/oh-my-pi/pull/19233\n* fix(coding-agent): report /marketplace picker load failures instead of crashing by @tuschla in https://github.com/can1357/oh-my-pi/pull/19234\n* fix(browser): reuse Chromium started through a compiled launcher by @tuschla in https://github.com/can1357/oh-my-pi/pull/19235\n* fix(coding-agent): closed pending tool approval when the turn aborts by @roboomp in https://github.com/can1357/oh-my-pi/pull/19242\n* fix(coding-agent): kept the JS eval worker on the running build after an in-place upgrade by @tuschla in https://github.com/can1357/oh-my-pi/pull/19259\n* fix(coding-agent): stopped Ctrl+V on Wayland warning about a missing xsel when the clipboard holds no text by @tuschla in https://github.com/can1357/oh-my-pi/pull/19260\n* fix(builtins): stop sed panicking on empty matches inside a character by @tuschla in https://github.com/can1357/oh-my-pi/pull/19261\n* fix(grep): match -o and -z end anchors at the end of the line by @tuschla in https://github.com/can1357/oh-my-pi/pull/19262\n* fix(utils): keep whitespace-only inline elements and <pre> descendants in turndown by @tuschla in https://github.com/can1357/oh-my-pi/pull/19263\n* fix(advisor): preserve skill-prompt user text past the body cap by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/19267\n* fix(session): purge database rows only after transcript deletion by @eggpeat in https://github.com/can1357/oh-my-pi/pull/19271\n* fix(vcs): preserve filenames across native diff and patch round-trips by @eggpeat in https://github.com/can1357/oh-my-pi/pull/19274\n* fix(ai): derive Claude device identity from the serving account by @Xytronix in https://github.com/can1357/oh-my-pi/pull/19277\n* fix(acp): honor mcp.startupTimeoutMs for client-declared MCP servers by @Alex-Wengg in https://github.com/can1357/oh-my-pi/pull/19286\n* fix(catalog): use Mistral's documented effort ladders for GLM 5.3 and Large 4 by @Alex-Wengg in https://github.com/can1357/oh-my-pi/pull/19287\n* fix(catalog): kept image input on deepseek's v4-flash alias by @roboomp in https://github.com/can1357/oh-my-pi/pull/19289\n* fix(ai): failed fast on 429s with a zero x-ratelimit-limit allowance by @roboomp in https://github.com/can1357/oh-my-pi/pull/19301\n* fix(coding-agent): kept a dequeued follow-up queued on resubmit by @roboomp in https://github.com/can1357/oh-my-pi/pull/19306\n* fix(acp): dropped field questions from form elicitation message by @roboomp in https://github.com/can1357/oh-my-pi/pull/19307\n* fix(vcs): reject unresolved index entries before creating commits by @eggpeat in https://github.com/can1357/oh-my-pi/pull/19309\n* fix(commit): reject unknown hunk unit ids by @eggpeat in https://github.com/can1357/oh-my-pi/pull/19310\n* fix(commit): kept utf-8 bom in selective commit blobs by @roboomp in https://github.com/can1357/oh-my-pi/pull/19330\n* fix(coding-agent): allow /copy in focused subagent view by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/19373\n* feat(mnemopi): filter automatic recall for task relevance by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/19132\n* feat(mnemopi): support asymmetric embedders and surface embedding failures by @YibaiMeng in https://github.com/can1357/oh-my-pi/pull/19322\n\n## New Contributors\n* @XYZ1024-alt made their first contribution in https://github.com/can1357/oh-my-pi/pull/19228\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.20.2...v18.20.3","mentions_count":10}
