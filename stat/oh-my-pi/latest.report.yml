wDOQxs0bc4reWLY","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":286021808,"digest":"sha256:a8059b95de5eaba0b3fb6f7182842d661feae29cb2931cdbeba2986db4751ecb","download_count":3218,"created_at":"2026-11-09T23:30:31Z","updated_at":"2026-11-09T23:30:48Z"},{"id":729375452,"node_id":"RA_kwDOQxs0bc4reWLc","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":232907264,"digest":"sha256:a17419a67938a325c0059144ffb9f85e96d77031427ce3f5f9d142264f7098e1","download_count":17,"created_at":"2026-11-09T23:30:31Z","updated_at":"2026-11-09T23:30:47Z"},{"id":729375449,"node_id":"RA_kwDOQxs0bc4reWLZ","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":249985024,"digest":"sha256:dfb15c27cb2ea192a94761c26aa5cd4eed54b1e0a5a85c02938ab07d769bc8f7","download_count":516,"created_at":"2026-11-09T23:30:31Z","updated_at":"2026-11-09T23:30:47Z"},{"id":729375445,"node_id":"RA_kwDOQxs0bc4reWLV","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:3d11ad7277e7ad65ea76963b60c0db21d57ad7c0621a94a9379f2e851939f280","download_count":291,"created_at":"2026-11-09T23:30:31Z","updated_at":"2026-11-09T23:30:31Z"}],"body":"## @oh-my-pi/pi-catalog\n\n### Fixed\n\n- LiteLLM lists only the models the configured key can call (its authenticated `/v1/models`), keeping the proxy's metadata for them; a proxy whose `/v1/models` fails now lists no models instead of every model it serves ([#18601](https://github.com/can1357/oh-my-pi/issues/18601))\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- In Tern, a turn's long-press menu on a phone can edit and resend a prompt, retry the turn, open the rewind page on it, or fork the session from it into a new session\n- A rewind from the transcript says how many turns it dropped and offers Undo on its toast in Tern, which puts the turns and your draft back\n\n### Changed\n\n- Browser `role/` selectors in Chrome tabs now match the role and name Chrome's accessibility tree reports, so they reach open shadow roots and skip hidden elements; in Tern every name `observe()` reports selects its element again ([#18632](https://github.com/can1357/oh-my-pi/pull/18632) by [@will-bogusz](https://github.com/will-bogusz))\n\n### Fixed\n\n- A late usage-limit error from a previous provider no longer blocks or cools down the selected provider; when the old provider has spent its retry budget, a replay-safe turn still tries the selected model without the old quota delay ([#17098](https://github.com/can1357/oh-my-pi/issues/17098), [#17571](https://github.com/can1357/oh-my-pi/pull/17571) by [@Bensonluo](https://github.com/Bensonluo))\n- Multi-question ask forms in Tern show Submit on the last question tab, not only on the Review tab\n- MCP `headers` and stdio `env` values that use `!command` now run again on a 401/403 (the request is retried once), on `/mcp reconnect` and other reconnects, and on `/mcp reload`, so servers whose command mints short-lived tokens keep working past expiry instead of staying 401 until restart ([#18631](https://github.com/can1357/oh-my-pi/issues/18631))\n- Pausing an unapproved plan no longer tells the agent that the draft was approved or to continue executing it, and pausing with `/plan` closes an open plan review so it can no longer save and execute the plan ([#18610](https://github.com/can1357/oh-my-pi/issues/18610)).\n- Turning off `lsp.enabled` now also stops `write` and `edit` from starting language servers for diagnostics or formatting; previously only the `lsp` tool was disabled ([#18205](https://github.com/can1357/oh-my-pi/issues/18205), [#18490](https://github.com/can1357/oh-my-pi/pull/18490) by [@yuzu-octopus](https://github.com/yuzu-octopus))\n- Fixed background tabs omp borrows (relay `app.target`, `app.cdp_url`) ignoring omp's clicks and keys or timing out on hover and drag; the page reads as visible while omp drives it and hidden again once released ([#17831](https://github.com/can1357/oh-my-pi/pull/17831) by [@will-bogusz](https://github.com/will-bogusz))\n- Fixed the transcript jumping at the screen's top edge while scrolled back during a streamed reply, and the screen dropping two rows when a reply finished ([#12307](https://github.com/can1357/oh-my-pi/issues/12307), [#16117](https://github.com/can1357/oh-my-pi/pull/16117) by [@galtamam-cmyk](https://github.com/galtamam-cmyk))\n- Focusing a subagent or returning to the main session no longer loses or freezes the next assistant reply when a fast tool turn finishes before the previous reply's links finish resolving, and messages and tool runs that arrive during the switch show exactly once, in order ([#18564](https://github.com/can1357/oh-my-pi/pull/18564) by [@eggpeat](https://github.com/eggpeat))\n- `omp gc --strip` now keeps every response of the latest replay turn (including earlier tool-call steps joined by their tool results), reference-only images, and the transcript's file permissions ([#18636](https://github.com/can1357/oh-my-pi/pull/18636) by [@eggpeat](https://github.com/eggpeat))\n- Session files whose entries were written without ids are re-indexed when loaded, and migrating old sessions no longer gives two entries the same id ([#18636](https://github.com/can1357/oh-my-pi/pull/18636) by [@eggpeat](https://github.com/eggpeat))\n- `wait` and `write proc://<id>/kill` now say how a settled job's result reached the caller: delivered by the call itself (it finished while the call ran), handed over by this snapshot (it superseded the job's queued completion push, so no duplicate follows), or genuinely late — the last keeps its \"not auto-delivered; recovered by this snapshot\" warning and adds how long before the call it had finished ([#16052](https://github.com/can1357/oh-my-pi/issues/16052), [#18635](https://github.com/can1357/oh-my-pi/pull/18635) by [@yuzu-octopus](https://github.com/yuzu-octopus))\n- Fixed `ask` notes added with `n` right after picking an answer landing on the previous question instead of the one shown; a Tern click then Note still notes the answer just clicked, and the Note button names it ([#18317](https://github.com/can1357/oh-my-pi/pull/18317) by [@DonMikone](https://github.com/DonMikone))\n\n## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Fixed GTK4 apps such as Files (Nautilus) on X11: element clicks and `computer.elementAt()` now find their elements where they are on screen, and `ax()` no longer marks their enabled controls `(disabled)` ([#18643](https://github.com/can1357/oh-my-pi/pull/18643) by [@will-bogusz](https://github.com/will-bogusz))\n- `grep` no longer searches the file its own output is redirected into, nor standard input redirected from that same file: both are refused with `input file is also the output`, as GNU grep does ([#14808](https://github.com/can1357/oh-my-pi/issues/14808), [#16489](https://github.com/can1357/oh-my-pi/pull/16489) by [@yuzu-octopus](https://github.com/yuzu-octopus))\n\n## @oh-my-pi/pi-tui\n\n### Added\n\n- The `wait` result's `JobSnapshot` now carries `settledAtMs` (epoch ms when the run settled, absent while it is still running), so a snapshot can tell a result that finished during the call from one recovered from an earlier, never-delivered completion ([#18635](https://github.com/can1357/oh-my-pi/pull/18635) by [@yuzu-octopus](https://github.com/yuzu-octopus))\n- Added a `thinking.set` composer action so Tern's phone effort menu can pick a thinking level in one tap\n- Added All, Running, Done and Parked status scopes with counts to the agent hub's roster, so Tern's phone can filter agents by status\n- A prompt and a turn's answer list their actions for a phone's long press (`actions.hold`): Copy, Edit & resend (a prompt's), Retry turn, Rewind to here… and Fork from here; the desktop keeps its hover toolbars\n- A click or tap on a turn on the native rewind page picks it, and the rewind selector can open on a given turn (`startAt`)\n- A status notice can carry a button on its native toast (`StatusNoticeAction`), such as the Undo after a rewind\n\n### Fixed\n\n- Fixed streamed rows being clipped above the screen before they reached scrollback while the working row was up, so a scrolled-back terminal saw rows jump at the screen's top edge and the whole screen dropped when a run ended ([#12307](https://github.com/can1357/oh-my-pi/issues/12307), [#16117](https://github.com/can1357/oh-my-pi/pull/16117) by [@galtamam-cmyk](https://github.com/galtamam-cmyk)). `Composer.setRuntimeChildren` takes a `billedChrome` option for roots billed at their current height instead of through the floor.\n- Fixed rows of a streaming reply, and the top rows of a table taller than the screen, going missing from both the screen and scrollback with `tui.completeScrollback` on; such a table now keeps the column widths it had when it outgrew the screen ([#16355](https://github.com/can1357/oh-my-pi/pull/16355) by [@galtamam-cmyk](https://github.com/galtamam-cmyk))\n\n## @oh-my-pi/pi-wire\n\n### Added\n\n- `actions.hold` (`TspMenuEntry[]`): what a long press on a touch screen offers, beside `actions.menu`; and `toast`'s `action` / `label` props for a button on the toast\n\n\n## What's Changed\n* fix(coding-agent): keep late quota errors off the fallback provider by @Bensonluo in https://github.com/can1357/oh-my-pi/pull/17571\n* fix(builtins): refuse to grep the file grep writes its output to by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/16489\n* fix(mcp): re-ran command-backed headers on 401 and reconnect by @roboomp in https://github.com/can1357/oh-my-pi/pull/18633\n* fix(plan): prevent unapproved drafts from becoming execution references by @roboomp in https://github.com/can1357/oh-my-pi/pull/18615\n* fix(catalog): scoped litellm discovery to virtual keys by @roboomp in https://github.com/can1357/oh-my-pi/pull/18602\n* fix(coding-agent): gate write/edit LSP writethrough on lsp.enabled by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/18490\n* test(natives): unset LIBEI_SOCKET under the env lock in the Wayland no-portal test by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/18649\n* fix(coding-agent): resolve Chromium role selectors through Chrome's accessibility tree by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/18632\n* fix(coding-agent): let background relay and app.cdp_url tabs take omp's clicks and keys by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/17831\n* fix(tui): completeScrollback commits a streaming reply's rows, tall tables included, as they leave the screen by @galtamam-cmyk in https://github.com/can1357/oh-my-pi/pull/16355\n* fix(tui): commit streamed rows as they leave the screen while the working row is up by @galtamam-cmyk in https://github.com/can1357/oh-my-pi/pull/16117\n* fix(tui): serialize live events after focus attachment by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18564\n* fix(coding-agent): preserve the latest replay turn during gc stripping by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18636\n* fix(coding-agent): label a wait-delivered result accurately (#16052) by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/18635\n* fix(natives): find GTK4 app elements on X11 and stop marking them disabled by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/18643\n\n## New Contributors\n* @Bensonluo made their first contribution in https://github.com/can1357/oh-my-pi/pull/17571\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.18.5...v18.18.6","mentions_count":6}
