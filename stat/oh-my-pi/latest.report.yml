wDOQxs0bc4ldpvs","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":264579040,"digest":"sha256:cacc12d5cdd46ff207f3452b36a0d0cfa7c5b8aee0d403aa83c5ab1f46bccb58","download_count":3545,"created_at":"2026-10-10T17:14:59Z","updated_at":"2026-10-10T17:15:15Z"},{"id":628530154,"node_id":"RA_kwDOQxs0bc4ldpvq","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":217650688,"digest":"sha256:a5b9666244059e2675f4d4979c0eddd123542f151593bbb3fbc02cbbc6eb998d","download_count":22,"created_at":"2026-10-10T17:14:59Z","updated_at":"2026-10-10T17:15:14Z"},{"id":628530147,"node_id":"RA_kwDOQxs0bc4ldpvj","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":232920576,"digest":"sha256:545fd5195da9c61667f600de2f9845f51c2416465c17289176c2caa90f576d3a","download_count":1743,"created_at":"2026-10-10T17:14:59Z","updated_at":"2026-10-10T17:15:14Z"},{"id":628530151,"node_id":"RA_kwDOQxs0bc4ldpvn","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:a4f1fdc0846c5402b8316d8c264c665878d2f3f9eb1b44b2682d246b5c3dd438","download_count":206,"created_at":"2026-10-10T17:14:59Z","updated_at":"2026-10-10T17:14:59Z"},{"id":628530161,"node_id":"RA_kwDOQxs0bc4ldpvx","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":24,"created_at":"2026-10-10T17:14:59Z","updated_at":"2026-10-10T17:14:59Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Changed\n\n- Updated state field rendering to trim trailing whitespace and normalize empty collection formatting for consistent prompt output\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added capability-driven extension terminal launches for tmux, Zellij, Herdr, and CMUX, with consolidated multiplexer detection, provider/shell capability feedback, and required POSIX-shell confirmation for shell-input launches; CMUX shell input preserves non-ASCII arguments and pane working directories ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy)).\n- Added `/fork pane|window|tab` to open a fork of the session in a new multiplexer pane or window while this session keeps running; bare `/fork` still forks in place ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy)).\n- Added Orca CLI-based launches for `/fork pane|window|tab` and `ctx.ui.openTerminal()`, with POSIX-shell confirmation; when Orca can only start a tab as a background terminal, the launch reports a warning instead of a visible tab ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy)).\n\n### Changed\n\n- CLI `--fork` now pairs tool calls the source session left unresolved with an unknown-outcome result, and `/tan` clones report such calls as unknown-outcome instead of aborted; forking a source whose process already exited keeps the process-exit recovery and pending-tool warning ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy)).\n- Table charts (`tui.autoGraph`) now cover before/after tables whose rows are different metrics (time, memory, counts): each row's change is drawn as a factor of its \"before\" value (`48\u00d7 less`, `+27%`), and rows written in prose are skipped and named under the chart. A single column of scores like `12/12` is drawn as bars filling toward 100%\n- In terminals that speak the Tern Surface Protocol (Tern), the composer's bottom bar shows the git branch and its status beside the model chip when the status line has the `git` segment; it outlasts the other facts as the bar narrows, and clicking it opens `/git` ([#15220](https://github.com/can1357/oh-my-pi/pull/15220) by [@H4vC](https://github.com/H4vC))\n- Table charts plot scores like `154/160` as the share of their total instead of the first number, and tables comparing two or three columns across four or more metrics now get a chart: a grid of one small panel per metric\n\n### Fixed\n\n- Fixed table charts failing on a table cell such as `3 constructor` or `2 valueOf calls`\n\n## @oh-my-pi/pi-tui\n\n### Breaking Changes\n\n- Removed the `isInsideTmux()`, `isInsideZellij()`, and `isInsideHerdr()` exports; use `hasTerminalMultiplexerSession(\"tmux\" | \"zellij\" | \"herdr\", env)` instead ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy))\n\n### Added\n\n- `classifyTerminalMultiplexer()` reports `\"orca\"` inside Orca terminals while `isInsideTerminalMultiplexer()` stays false there, so Orca keeps the direct-terminal render path; `TERMINAL_MULTIPLEXER_ENV_KEYS` lists every environment variable multiplexer detection reads ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy))\n- Added `terminalMultiplexerSessions()`, `terminalMultiplexerForTerm()`, `classifyTerminalMultiplexerModule()`, and `routeTerminalMultiplexerNotification()`, driven by one multiplexer registry that now owns notification routing and per-multiplexer capability overrides ([#13620](https://github.com/can1357/oh-my-pi/pull/13620) by [@anatoli-tsinovoy](https://github.com/anatoli-tsinovoy))\n- Added `change` and `progress` table-chart kinds with `ChartSpec.baseline` and `TableColumn.scores`: a before/after table whose rows have their own units charts each metric as a factor of the baseline column (rows without two numbers are named in the caption), and `analyzeTable` reads whole-number scores (`12/12`, `154/160`) as the percent of their total, keeping `a / b` pairs and lists as written\n\n### Changed\n\n- `StatusLineComponent.describeComposerFacts()` includes the configured `git` segment among the composer's facts (branch and status, the `status.git` click action, pinned so it outlasts the other facts) instead of leaving the branch to Tern's pane header ([#15220](https://github.com/can1357/oh-my-pi/pull/15220) by [@H4vC](https://github.com/H4vC))\n- Small-multiple table charts with more than three panels and at most six categories draw as bands of per-metric panels with a color legend, and `worthCharting` counts their panels like categories\n- Table charts take the look of Apple's charts and Tern: a UI sans, hairline gridlines, rounded bars and cells, smooth lines over a soft area fill, dot legends, left-aligned category labels that never run off the edge, and axes labeled in one unit (`0, 5k, 10k`)\n- Line charts whose series differ 8\u00d7 or more in size stack panels on their own axes instead of flattening the smaller lines, and their end labels no longer overlap\n- SVG figure series colors `--c1`\u2026`--c6` are an even-weight palette led by the theme accent's hue instead of syntax colors\n\n### Fixed\n\n- Fixed `parseCell` throwing on table cells such as `3 constructor` or `2 valueOf calls`, and reading a `constructor` cell as a missing value\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added `hueDistance`, the angular distance between two OKLCH hues\n\n\n## What's Changed\n* feat(tui): show the git branch in Tern's composer bar by @H4vC in https://github.com/can1357/oh-my-pi/pull/15220\n* feat(coding-agent): add multiplexer terminal launch and /fork placements by @anatoli-tsinovoy in https://github.com/can1357/oh-my-pi/pull/13620\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.8.8...v18.8.9","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
