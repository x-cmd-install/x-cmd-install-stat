xs0bc4rDsI1","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":284801200,"digest":"sha256:2a75e16550676783b3bc8be0e06513478dd5881efc647954642ab30db8f9be06","download_count":1581,"created_at":"2026-11-08T00:24:56Z","updated_at":"2026-11-08T00:25:04Z"},{"id":722387505,"node_id":"RA_kwDOQxs0bc4rDsIx","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":231186944,"digest":"sha256:4416622d467edf78b420826c3d8c64f539713486a853b34062fd8f92e1d6a377","download_count":6,"created_at":"2026-11-08T00:24:56Z","updated_at":"2026-11-08T00:25:04Z"},{"id":722387503,"node_id":"RA_kwDOQxs0bc4rDsIv","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":248590336,"digest":"sha256:516fc375c3d69d175d651722e20bb321e9b8a046e60151c2757c39c14f775d16","download_count":279,"created_at":"2026-11-08T00:24:56Z","updated_at":"2026-11-08T00:25:05Z"},{"id":722387511,"node_id":"RA_kwDOQxs0bc4rDsI3","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:16bac5a1fc6ee9ac536e819c93126aa78073bd5425ff87a0cd6df8ff1c5f83ae","download_count":146,"created_at":"2026-11-08T00:24:56Z","updated_at":"2026-11-08T00:24:56Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Cursor exec frames keep tool-batch order: a file mutation (native StrReplace and Write, `write`, `delete`, `pi_edit`, `pi_write`) waits for the calls issued before it, and the calls issued after it wait until it lands, so a Shell sent in the same batch as a StrReplace no longer runs before the edit's write ([#18434](https://github.com/can1357/oh-my-pi/pull/18434) by [@KadirBerkpolat1](https://github.com/KadirBerkpolat1))\n- ChatGPT Pro Max (`promax`) counts as Pro for Codex account routing, so a blocked Pro account no longer wins over an open or pinned Pro Max account ([#18399](https://github.com/can1357/oh-my-pi/pull/18399) by [@serverinspector](https://github.com/serverinspector))\n- Cursor Shell results no longer end with `Timeout clamped to 3600s (requested 86400s; …)`: Cursor's 24 h `hard_timeout` is capped at the bash tool's 3600 s ceiling before it reaches the tool ([#18433](https://github.com/can1357/oh-my-pi/pull/18433) by [@KadirBerkpolat1](https://github.com/KadirBerkpolat1))\n- A 429 or 402 worded like a context overflow (Bedrock's \"429 Too many tokens, please wait…\") is treated as a rate limit, so it retries and walks the fallback chain instead of compacting ([#18345](https://github.com/can1357/oh-my-pi/pull/18345) by [@nick-maderight](https://github.com/nick-maderight))\n- `auth-gateway stdio` and `serve` no longer reject credentialless Apple on-device models ([#18370](https://github.com/can1357/oh-my-pi/issues/18370))\n\n## @oh-my-pi/browser-relay\n\n### Changed\n\n- The extension now requests `scripting` and access to all sites (Chrome lists \"Read and change all your data on all websites\"); it uses them only to empty another extension's frames in a tab omp is driving, when Chrome refuses it the debugger there ([#16908](https://github.com/can1357/oh-my-pi/pull/16908) by [@will-bogusz](https://github.com/will-bogusz))\n\n### Fixed\n\n- Fixed a password manager's inline autofill menu locking omp out of a tab it drives: the extension empties and hides such frames in that tab and retries the attach or command Chrome refused ([#16908](https://github.com/can1357/oh-my-pi/pull/16908) by [@will-bogusz](https://github.com/will-bogusz))\n\n## @oh-my-pi/pi-catalog\n\n### Fixed\n\n- Corrected Devin SWE-2 Flash and SWE-2 Fast token pricing, and SWE-2's promotional rates and end time ([#18332](https://github.com/can1357/oh-my-pi/pull/18332) by [@eggpeat](https://github.com/eggpeat))\n- DeepSeek V4.1 Flash ids spelled with a hyphen (`deepseek-v4-1-flash-1017` on Mistral and Venice) keep image attachments instead of being stripped to text-only ([#18405](https://github.com/can1357/oh-my-pi/issues/18405))\n- `compat.disabledThinking` in `models.yml` now applies to `anthropic-messages` models, so a custom Anthropic provider can switch thinking off when Off is selected ([#18412](https://github.com/can1357/oh-my-pi/pull/18412) by [@farnoy](https://github.com/farnoy))\n\n## @oh-my-pi/pi-coding-agent\n\n### Breaking Changes\n\n- Rust SDK: `BashCommand` and `ReadyEvent` struct literals need `exclude_from_context: None` and `supports_bash_exclude_from_context: None` ([#18206](https://github.com/can1357/oh-my-pi/pull/18206) by [@andrebrait](https://github.com/andrebrait))\n\n### Added\n\n- RPC `bash` accepts `excludeFromContext: true` to keep a run out of model context like terminal `!!`; runtimes advertise support with `supportsBashExcludeFromContext` in the `ready` frame, and the Python SDK exposes that frame as `client.ready` ([#18206](https://github.com/can1357/oh-my-pi/pull/18206) by [@andrebrait](https://github.com/andrebrait))\n\n### Changed\n\n- Agent `bash` commands run with `LANG`/`LC_ALL=C.UTF-8` on every platform instead of the inherited locale, so sort order, number formats and tool messages no longer vary by machine; a locale in the command's `env` or `.envrc` still wins, and `!` commands keep yours\n- omp's built-in shell (`omp bash`/`omp zsh` and the bash tool) parses scripts about a third faster, sources large function libraries about 20% faster, and re-runs a repeated `eval` or `source` without recompiling it.\n- The `computer` tool's `el.perform()` takes any spelling of an action `ax()` lists (`perform(\"open\")`), and `computer.backgroundFallback: refuse` refuses every spelling of a raise, open, context menu or popup press ([#15282](https://github.com/can1357/oh-my-pi/pull/15282) by [@will-bogusz](https://github.com/will-bogusz))\n- The `computer` tool no longer takes over your screen for a macOS `win.drag` across the text of a native text view, such as a TextEdit document; it selects that text in the background and returns the selection ([#16223](https://github.com/can1357/oh-my-pi/pull/16223) by [@will-bogusz](https://github.com/will-bogusz))\n\n### Fixed\n\n- A browser relay tab stays usable after a password manager's inline autofill menu opens in it; the call that opened the menu still fails once (reinstall the extension with `omp browser-relay install` and reload it) ([#16908](https://github.com/can1357/oh-my-pi/pull/16908) by [@will-bogusz](https://github.com/will-bogusz))\n- A `%%bash` cell in Python eval no longer prints its exit status (a stray `0`) after the command's output; a failing cell reports `%%bash: exit status N` on stderr instead.\n- Reusing an already running `omp stats` dashboard now exits successfully without stopping the existing server ([#18443](https://github.com/can1357/oh-my-pi/issues/18443)).\n- A function defined inside a command substitution in a here-document body (`cat <<E` / `$(f() { …; }; f)` / `E`) no longer crashes the built-in shell.\n- A Cursor tool call sent in the same batch as a native StrReplace or Write no longer runs before the edit is written, so a check right after an edit sees the new file ([#18434](https://github.com/can1357/oh-my-pi/pull/18434) by [@KadirBerkpolat1](https://github.com/KadirBerkpolat1))\n- Pinned sessions color their pin icon with the theme accent in the status line and the band composer's title instead of taking the title's color or dim style, matching the resume picker ([#18401](https://github.com/can1357/oh-my-pi/pull/18401) by [@SuperUserA](https://github.com/SuperUserA))\n- An ovnfs checkout stays recoverable with `omp worktree clear` when removing it fails, or when creating it fails after the daemon may already have it, instead of being forgotten ([#18337](https://github.com/can1357/oh-my-pi/pull/18337) by [@eggpeat](https://github.com/eggpeat))\n- A `retain` call that fails midway no longer delivers part of itself to the Hindsight server while telling the model nothing was queued ([#18440](https://github.com/can1357/oh-my-pi/pull/18440) by [@eggpeat](https://github.com/eggpeat))\n- A `bash.patterns` `deny` rule now blocks a command anywhere in a `;`, `|`, `||` or `&&` line even when an earlier `prompt` rule matches another part of it, and project settings can no longer override the operator's `deny` or `prompt` patterns with `allow` ([#18349](https://github.com/can1357/oh-my-pi/pull/18349) by [@asuffield](https://github.com/asuffield))\n- A subagent stopped by the session cost cap (`--max-cost` / `session.maxCost`) now reports the cap's refusal instead of \"Subagent ended without a final message\" ([#18362](https://github.com/can1357/oh-my-pi/issues/18362))\n- ERB templates open in ruby-lsp as `erb`, so valid templates no longer report dozens of bogus Ruby errors, and a diagnostics pull ruby-lsp answers with `null` no longer holds the call for its whole timeout ([#18372](https://github.com/can1357/oh-my-pi/pull/18372) by [@alphastorm](https://github.com/alphastorm))\n- Mistral Vibe browser sign-in shows subscription billing in the status line and advisor spend instead of pay-as-you-go pricing ([#18374](https://github.com/can1357/oh-my-pi/issues/18374))\n- Native OpenAI compaction no longer waits for a Hindsight memory recall it cannot use; fallback summaries still recall memory ([#18327](https://github.com/can1357/oh-my-pi/issues/18327))\n- An eval `wait()` on jobs owned by a worker returns finished jobs and consumes their results instead of reporting them as running or delivering them again ([#18363](https://github.com/can1357/oh-my-pi/issues/18363))\n- `/restart` no longer drops running subagents: they go on with their interrupted turns in the relaunched process and deliver their results to the agent that spawned them, as `omp --restore` now also does after a normal quit\n- A shell command nested hundreds of levels deep (subshells, groups, command substitutions) is now a syntax error in the built-in shell instead of crashing omp with a stack overflow.\n- Eval `wait()` progress rows for agents spawned by one `task` call show each agent's own tool count, context, cost and activity instead of the first agent's ([#18393](https://github.com/can1357/oh-my-pi/issues/18393))\n- In the Pseudo shell visualization, an `&&` chain keeps its `and` rows while it runs and after it finishes, instead of switching to literal ` && ` rows and a raw-bash tail when the output minimizer runs it one command at a time ([#18408](https://github.com/can1357/oh-my-pi/issues/18408))\n- Autoresearch `update_notes` calls can now append an idea with only `append_idea`, without passing a replacement `body` ([#18439](https://github.com/can1357/oh-my-pi/pull/18439) by [@eggpeat](https://github.com/eggpeat))\n\n## @oh-my-pi/pi-mnemopi\n\n### Fixed\n\n- Fixed recall scoring memories against vectors from a previous embedding model while a model-change rebuild was still running or had failed: dense search now only uses vectors stamped with the active model, falling back to lexical matching for memories awaiting re-embedding ([#18442](https://github.com/can1357/oh-my-pi/pull/18442) by [@eggpeat](https://github.com/eggpeat))\n- Fixed model-change embedding rebuilds overwriting newer vectors for updated memories or recreating vectors for deleted memories ([#18441](https://github.com/can1357/oh-my-pi/pull/18441) by [@eggpeat](https://github.com/eggpeat))\n\n## @oh-my-pi/pi-natives\n\n### Added\n\n- macOS `ax()` lines show what an element can do: `(selected)`, `(settable)` on dates `setValue` can write, `(readonly)` on web text fields the page locks, `actions=` beyond its press, and names for unlabeled window buttons ([#15282](https://github.com/can1357/oh-my-pi/pull/15282) by [@will-bogusz](https://github.com/will-bogusz))\n\n### Changed\n\n- macOS `ax()` lines show 200 characters of a long label or value instead of 80, keep newlines as `\\n`, and end a cut value with the call that reads it whole ([#15282](https://github.com/can1357/oh-my-pi/pull/15282) by [@will-bogusz](https://github.com/will-bogusz))\n- macOS `ax()` dates read in local time with their offset, the form `setValue` takes back, and `axPerform` runs a listed action in any case, with or without its `AX` prefix ([#15282](https://github.com/can1357/oh-my-pi/pull/15282) by [@will-bogusz](https://github.com/will-bogusz))\n- macOS background left drags across the text of one native text view, such as a TextEdit document, now select that text through accessibility, and `drag` resolves to `{ selection, focusReturn }`; drags on web page text and links still throw `BackgroundUnavailable` ([#16223](https://github.com/can1357/oh-my-pi/pull/16223) by [@will-bogusz](https://github.com/will-bogusz))\n\n### Fixed\n\n- macOS `ax()` no longer marks every cell of a focused table or sidebar `(focused)`; only the element holding the app's keyboard focus is ([#15282](https://github.com/can1357/oh-my-pi/pull/15282) by [@will-bogusz](https://github.com/will-bogusz))\n- macOS `axPerform` reports a followed Preview PDF link or an opened Finder item as unconfirmed instead of failed ([#15282](https://github.com/can1357/oh-my-pi/pull/15282) by [@will-bogusz](https://github.com/will-bogusz))\n- The embedded shell's `comm` merges in the same locale order as its `sort`, so `comm` on `sort` output under a UTF-8 locale no longer reports unsorted input and drops common lines\n- An edit whose path is missing on disk no longer stalls the embedded shell and other native calls while it searches for the file, and a cancelled edit stops that search at once ([#18386](https://github.com/can1357/oh-my-pi/pull/18386) by [@sjawhar](https://github.com/sjawhar))\n- macOS spellchecking (typo underlines, autocorrect, `apple` word completion) no longer leaks native memory for the life of the process ([#18285](https://github.com/can1357/oh-my-pi/pull/18285) by [@aleister1102](https://github.com/aleister1102))\n- Fixed large brace expansions running as literal text or silently dropping words: expansions support up to 4,194,304 words and report an error above that limit ([#18092](https://github.com/can1357/oh-my-pi/pull/18092) by [@sjawhar](https://github.com/sjawhar))\n\n## @oh-my-pi/pi-tui\n\n### Added\n\n- Grep headers syntax-highlight regex patterns, including incomplete patterns while a call streams, in terminal and native views ([#18392](https://github.com/can1357/oh-my-pi/pull/18392) by [@JustasMasiulis](https://github.com/JustasMasiulis)).\n\n### Changed\n\n- Grep results for a single searched file no longer repeat `1 file` after the match count; the header already names the file ([#18422](https://github.com/can1357/oh-my-pi/pull/18422) by [@JustasMasiulis](https://github.com/JustasMasiulis)).\n\n### Fixed\n\n- Pinned sessions color their pin icon with the theme accent in the status line instead of the session title's color, matching the resume picker ([#18401](https://github.com/can1357/oh-my-pi/pull/18401) by [@SuperUserA](https://github.com/SuperUserA))\n- A saved bash trace the shell visualization can no longer restore (e.g. a `tool_result` hook rewrote its `script`) renders as plain command and output instead of crashing the TUI and every `omp --resume` of that session ([#18338](https://github.com/can1357/oh-my-pi/issues/18338))\n- Tables with near-equal large numeric columns no longer crash transcript rendering during chart analysis ([#18343](https://github.com/can1357/oh-my-pi/issues/18343))\n- A JPEG truncated before its end-of-image marker is rejected when read and omitted from the request, instead of failing the whole provider request with \"unsupported image\" ([#18385](https://github.com/can1357/oh-my-pi/pull/18385) by [@iwangjie](https://github.com/iwangjie))\n- Desktop notifications use unique OSC 99 ids per omp process to avoid interfering with other omp processes ([#18413](https://github.com/can1357/oh-my-pi/pull/18413) by [@farnoy](https://github.com/farnoy))\n- `updateNotesToolRenderer` now renders `update_notes` calls that omit `body` ([#18439](https://github.com/can1357/oh-my-pi/pull/18439) by [@eggpeat](https://github.com/eggpeat))\n- The copy overlay now offers fenced code blocks indented under list items, and splits code and quote blocks the same way the message renderer draws them ([#18410](https://github.com/can1357/oh-my-pi/pull/18410) by [@farnoy](https://github.com/farnoy))\n\n\n## What's Changed\n* fix(isolation): preserve ovnfs recovery records after cleanup failures by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18337\n* fix(bash): enforce deny precedence across non-compound segments and operator authority by @asuffield in https://github.com/can1357/oh-my-pi/pull/18349\n* fix(catalog): price Devin SWE-2 Flash separately from SWE-2 by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18332\n* feat(tui): syntax-highlight grep header patterns by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/18392\n* feat(rpc): support excluding bash executions from model context by @andrebrait in https://github.com/can1357/oh-my-pi/pull/18206\n* fix(natives): drain an autorelease pool around macOS spell-server calls by @aleister1102 in https://github.com/can1357/oh-my-pi/pull/18285\n* fix(compaction): deferred unused native memory recall by @roboomp in https://github.com/can1357/oh-my-pi/pull/18330\n* fix(tui): rendered unrestorable bash traces plainly instead of crashing by @roboomp in https://github.com/can1357/oh-my-pi/pull/18340\n* fix(tui): prevent cyclic table compositions from crashing by @roboomp in https://github.com/can1357/oh-my-pi/pull/18344\n* fix(ai): a 429 or 402 with token-cap wording is not context overflow by @nick-maderight in https://github.com/can1357/oh-my-pi/pull/18345\n* fix(task): reported cost-cap refusal as a capped subagent's error by @roboomp in https://github.com/can1357/oh-my-pi/pull/18364\n* fix(eval): refreshed worker job snapshots during waits by @roboomp in https://github.com/can1357/oh-my-pi/pull/18365\n* fix(ai): allowed keyless models through auth gateway by @roboomp in https://github.com/can1357/oh-my-pi/pull/18371\n* fix(lsp): open .erb files as erb and end diagnostics waits on null pulls by @alphastorm in https://github.com/can1357/oh-my-pi/pull/18372\n* fix(auth): classify mistral vibe login as subscription billing by @roboomp in https://github.com/can1357/oh-my-pi/pull/18378\n* fix(tui): reject JPEGs truncated before their EOI marker by @iwangjie in https://github.com/can1357/oh-my-pi/pull/18385\n* fix(natives): run the edit tool's missing-path recovery off the host scheduler by @sjawhar in https://github.com/can1357/oh-my-pi/pull/18386\n* fix(ai): treat ChatGPT Pro Max as Pro for Codex account routing by @serverinspector in https://github.com/can1357/oh-my-pi/pull/18399\n* fix(tui): omit redundant 1 file count on single-file grep results by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/18422\n* fix(pi-shell): a function defined in a here-document body no longer crashes the shell by @H4vC in https://github.com/can1357/oh-my-pi/pull/18431\n* perf(pi-shell): reuse compiled units of re-sourced commands and cut per-command sourcing costs by @H4vC in https://github.com/can1357/oh-my-pi/pull/18354\n* refactor(pi-shell): add flat syntax tree module by @H4vC in https://github.com/can1357/oh-my-pi/pull/18355\n* perf(pi-shell): parse and lower through a flat syntax tree with reused buffers by @H4vC in https://github.com/can1357/oh-my-pi/pull/18356\n* fix(pi-shell): syntax JSON positions that differed from shfmt by @H4vC in https://github.com/can1357/oh-my-pi/pull/18367\n* fix(pi-shell): a brace expansion over the limit fails instead of going literal by @H4vC in https://github.com/can1357/oh-my-pi/pull/18368\n* fix(pi-shell): a command nested too deep is a syntax error, not a stack overflow by @H4vC in https://github.com/can1357/oh-my-pi/pull/18418\n* perf(pi-shell): store syntax trees packed by @H4vC in https://github.com/can1357/oh-my-pi/pull/18419\n* refactor(pi-shell): zsh parser builds on the scratch stack by @H4vC in https://github.com/can1357/oh-my-pi/pull/18420\n* fix(eval): a %%bash cell no longer prints its exit status by @H4vC in https://github.com/can1357/oh-my-pi/pull/18444\n* docs: sync zh-CN README and fix search backend count by @bigHippoZz in https://github.com/can1357/oh-my-pi/pull/18394\n* fix(eval): showed each agent's own progress in wait() rows by @roboomp in https://github.com/can1357/oh-my-pi/pull/18395\n* fix(tui): color session pin indicator with theme accent by @SuperUserA in https://github.com/can1357/oh-my-pi/pull/18401\n* fix(catalog): kept image input on hyphenated deepseek v4.1 flash ids by @roboomp in https://github.com/can1357/oh-my-pi/pull/18409\n* fix(tui): copied fenced code blocks indented under list items by @farnoy in https://github.com/can1357/oh-my-pi/pull/18410\n* fix(catalog): honored models.yml compat.disabledThinking on anthropic-message models by @farnoy in https://github.com/can1357/oh-my-pi/pull/18412\n* fix(tui): kept OSC 99 notification ids unique across omp processes by @farnoy in https://github.com/can1357/oh-my-pi/pull/18413\n* fix(shell): drew segmented && chains with pseudo and connectors by @roboomp in https://github.com/can1357/oh-my-pi/pull/18415\n* fix(cursor): cap Shell's 24 h hard_timeout at the bash ceiling by @KadirBerkpolat1 in https://github.com/can1357/oh-my-pi/pull/18433\n* fix(cursor): keep exec frames in tool-batch order by @KadirBerkpolat1 in https://github.com/can1357/oh-my-pi/pull/18434\n* test(coding-agent): isolate fork-attribution test from real agent dir by @nick-maderight in https://github.com/can1357/oh-my-pi/pull/18436\n* fix(coding-agent): allow update_notes with only append_idea by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18439\n* fix(hindsight): keep uncommitted retain batches out of drains by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18440\n* fix(mnemopi): preserve newer embeddings when committing a rebuild by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18441\n* fix(mnemopi): exclude stale-model vectors from dense recall by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18442\n* fix(stats): correct reused dashboard exit status by @roboomp in https://github.com/can1357/oh-my-pi/pull/18446\n* feat(natives): show what macOS ax() elements can do by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/15282\n* feat(natives): make a macOS background drag across native text an accessibility selection by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/16223\n* fix(browser-relay): keep a tab omp drives usable when a password manager's menu opens in it by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/16908\n\n## New Contributors\n* @iwangjie made their first contribution in https://github.com/can1357/oh-my-pi/pull/18385\n* @KadirBerkpolat1 made their first contribution in https://github.com/can1357/oh-my-pi/pull/18433\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.18.0...v18.18.1","mentions_count":17}
