_id":"RA_kwDOQxs0bc4iKejS","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1078315,"digest":"sha256:73c0c20e5b9b3ecedb5d6dbfcdd73905155927f52ae8a4d1d04fedcfacf0626e","download_count":19,"created_at":"2026-09-18T18:10:07Z","updated_at":"2026-09-18T18:10:08Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Fixed Anthropic prompt-cache head re-baselining on every memory recall refresh: the system breakpoint now anchors on the last stable segment instead of the volatile recall suffix, and the stable-system fingerprint ignores recall blocks, so a recall refresh re-bills only the suffix instead of the whole tools+system head.\n- Fixed auth-broker client config resolution failing silently on Windows when reading the token file or `config.yml`; reads now use `node:fs` instead of `Bun.file`.\n\n## @oh-my-pi/pi-coding-agent\n\n### Fixed\n\n- Fixed clipboard paste stalling on an empty clipboard; image and text clipboard reads now run concurrently so the empty-clipboard status surfaces after the slower read instead of the sum of both.\n- Fixed memory recall blocks carrying a minute-resolution `Current time` stamp that dirtied the cached system prompt on every refresh; recall rows already carry dates, so the stamp is removed.\n- Fixed `omp auth-broker token` and `omp auth-gateway token` exiting silently without creating a token on Windows when no token file exists yet; token and config reads now use `node:fs` instead of `Bun.file`.\n\n\n## What's Changed\n* fix(auth-broker): use node:fs for token and config reads on Windows by @H4vC in https://github.com/can1357/oh-my-pi/pull/12390\n* docs(changelog): restore contributor attribution for #12177 and #12236 (@shivamklr) by @shivamklr in https://github.com/can1357/oh-my-pi/pull/12396\n* fix(ai): keep prompt-cache head stable across memory recall refreshes by @H4vC in https://github.com/can1357/oh-my-pi/pull/12431\n* fix(coding-agent): run clipboard image and text reads concurrently on paste by @H4vC in https://github.com/can1357/oh-my-pi/pull/12447\n* fix(ai): remove dead breakpoint locals in head-caching recall test by @H4vC in https://github.com/can1357/oh-my-pi/pull/12453\n* fix(build): pin find-msvc-tools to 0.1.12 for Windows cc compat by @H4vC in https://github.com/can1357/oh-my-pi/pull/12455\n\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.2.5...v18.2.6","reactions":{"total_count":5,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":2}
