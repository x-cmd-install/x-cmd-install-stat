OQxs0bc4hY62g","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":201319904,"digest":"sha256:4b5df0c61cc978223bd12f7e8d533554e80bb360a9192491de13da3d53b283ac","download_count":1428,"created_at":"2026-09-12T23:56:56Z","updated_at":"2026-09-12T23:57:08Z"},{"id":560180639,"node_id":"RA_kwDOQxs0bc4hY62f","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":150732800,"digest":"sha256:4a5e90e1f1b85a263862b190860caaff76da6890863bbdbaaf29600a0eb54afb","download_count":4,"created_at":"2026-09-12T23:56:56Z","updated_at":"2026-09-12T23:57:06Z"},{"id":560180638,"node_id":"RA_kwDOQxs0bc4hY62e","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":161603072,"digest":"sha256:2c3bc145997620db35e7014f2c9dd552b6ce3c9a9a037e66dae5f548312b6aca","download_count":758,"created_at":"2026-09-12T23:56:56Z","updated_at":"2026-09-12T23:57:07Z"},{"id":560180652,"node_id":"RA_kwDOQxs0bc4hY62s","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:a36e998913f4349c00c8ad80e7dcb7b4ead88eb81441aaf02b0d60d5df4c919f","download_count":75,"created_at":"2026-09-12T23:56:56Z","updated_at":"2026-09-12T23:56:57Z"},{"id":560180650,"node_id":"RA_kwDOQxs0bc4hY62q","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1077086,"digest":"sha256:104142244b8781b7828e64aa79a61b03fdf16e8a3464278647c3d84ad22cbce0","download_count":8,"created_at":"2026-09-12T23:56:56Z","updated_at":"2026-09-12T23:56:57Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Added\n\n- Added `Agent.getPendingToolResults()` for reconstructing live displays before buffered tool results are persisted ([#11868](https://github.com/can1357/oh-my-pi/pull/11868) by [@serverinspector](https://github.com/serverinspector)).\n- Added opt-in host authorization and exact-once streamed child execution for discard-safe local reads.\n\n### Changed\n\n- `Tool <name> not found` now also suggests mounted `xd://` devices, not just the advertised tool set, via the new `suggestFallbackToolNames` option ([#11516](https://github.com/can1357/oh-my-pi/issues/11516), [#10109](https://github.com/can1357/oh-my-pi/issues/10109) by [@oldschoola](https://github.com/oldschoola)).\n\n### Fixed\n\n- Speculative stream sessions are now discarded when a hook or argument transform replaces a call's arguments while keeping its ID, instead of releasing deferred work planned from the original code ([#11889](https://github.com/can1357/oh-my-pi/pull/11889) by [@h4vc](https://github.com/h4vc)).\n\n## @oh-my-pi/pi-ai\n\n### Added\n\n- Charm Hyper accounts now report their remaining prepaid credit balance in `/usage` ([#11656](https://github.com/can1357/oh-my-pi/pull/11656) by [@oldschoola](https://github.com/oldschoola)).\n\n### Fixed\n\n- Fixed Kimi Code's 7-day rate-limiting window being mislabeled as \"Total quota\" in `omp usage`, causing accounts whose monthly subscription pool is exhausted to appear 100% free while chat completions fail; parsed `totalQuota` add-on packs into the true \"Total quota\" row when present, and recognized Kimi's HTTP 403 `access_terminated_error` as a credential-rotatable usage limit. ([#11827](https://github.com/can1357/oh-my-pi/pull/11827) by [@revofusion](https://github.com/revofusion))\n- Fixed provider streams that die after emitting `toolcall_start` but before any argument content failing validation with empty `{}` arguments; the uncommitted attempt is now discarded and retried ([#11823](https://github.com/can1357/oh-my-pi/pull/11823) by [@justdoGIT](https://github.com/justdoGIT)).\n- Fixed Windows `zcode://` (Z.AI coding-plan) OAuth sign-in never completing after a successful browser authorization: the native callback handler is now registered with a path the Windows shell can launch, so the `zcode://zai-auth/callback` redirect reaches omp instead of being silently dropped by the browser ([#11907](https://github.com/can1357/oh-my-pi/pull/11907) by [@oldschoola](https://github.com/oldschoola)).\n- Codex OAuth login now accepts valid account tokens that expose an email but omit `chatgpt_account_id`, without fabricating a workspace header ([#11847](https://github.com/can1357/oh-my-pi/pull/11847) by [@nguyennguyenit](https://github.com/nguyennguyenit)).\n- Fixed Muse Code login failing when Meta returns no assigned subscription tier (`subs_tier_id`/`subs_tier_name` as null); sign-in now succeeds and usage is reported without a tier ([#11843](https://github.com/can1357/oh-my-pi/pull/11843) by [@John-Cusack](https://github.com/John-Cusack)).\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added Charm Hyper as a built-in provider with API-key login, live model discovery, and per-model pricing, effort ladders, and limits read straight from its catalog ([#11656](https://github.com/can1357/oh-my-pi/pull/11656) by [@oldschoola](https://github.com/oldschoola)).\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added default-off speculative execution for validated local reads, including reads projected from nested JavaScript and Python eval cells.\n- `/usage` now shows prepaid credit balances (e.g. Charm Hyper's `100 credits left`) on the provider cards and account summaries instead of `no data` ([#11656](https://github.com/can1357/oh-my-pi/pull/11656) by [@oldschoola](https://github.com/oldschoola)).\n- Retry fallback chains now support per-model reasoning efforts: a fallback entry may carry an explicit thinking suffix (`\"default\": [\"openai/gpt-5-mini:low\"]`), and pressing `t` on a fallback row in `/models` sets or clears it. Bare entries keep inheriting the failing turn's effort. ([#11842](https://github.com/can1357/oh-my-pi/pull/11842) by [@H4vC](https://github.com/H4vC)).\n- Added `task.agentServiceTierOverrides` for sparse exact-name service-tier overrides on task/eval agents, so selected agents can use priority/Fast mode without accelerating every subagent ([#9668](https://github.com/can1357/oh-my-pi/pull/9668) by [@alphastorm](https://github.com/alphastorm)).\n- Added session-local `/btw` history with persistent answers and follow-ups; bare `/btw` reopens history, Escape cancels running answers before closing, and new questions no longer replace an in-progress answer.\n- Added `f follow up` in BTW history to continue a selected side conversation with an English input prompt, persistent multi-turn history, and no changes to the main conversation.\n- Completed inline BTW answers now support `f follow up` directly; history uses `Tab` for pane navigation and `Enter` or `f` to start a follow-up.\n- Codex web search now accepts valid email-only OAuth credentials without requiring or fabricating a `ChatGPT-Account-Id` header ([#11847](https://github.com/can1357/oh-my-pi/pull/11847) by [@nguyennguyenit](https://github.com/nguyennguyenit)).\n- Sessions now stay alive when their working directory is removed instead of crashing while preparing shell tools ([#11828](https://github.com/can1357/oh-my-pi/issues/11828)).\n- MCP tool calls spelled with the Claude Code doubled separator (`mcp__server__tool`) now reach their registered tool ([#11516](https://github.com/can1357/oh-my-pi/issues/11516) by [@oldschoola](https://github.com/oldschoola)).\n- MCP HTTP reconnects now release obsolete tool generations instead of growing session memory on every reconnect ([#11784](https://github.com/can1357/oh-my-pi/issues/11784)).\n- `/debug` memory reports now keep large heap snapshots out of JavaScript strings and reject empty snapshots instead of saving zero-byte files ([#11785](https://github.com/can1357/oh-my-pi/issues/11785)).\n- Sloppy-mode edits now drop a copied `[N more lines in ...]` read notice the same way they already drop the other read-metadata rows, so a pasted projection can no longer leak into the matched pattern or the written text ([#11797](https://github.com/can1357/oh-my-pi/pull/11797) by [@vasyza](https://github.com/vasyza)).\n- `/usage` now honors a provider's configured `baseUrl` when checking credentials before any model has been discovered, so a proxy-scoped API key is no longer sent to the provider's canonical host ([#11656](https://github.com/can1357/oh-my-pi/pull/11656) by [@oldschoola](https://github.com/oldschoola)).\n\n### Fixed\n\n- Fixed completed tool cards reverting to pending after refocusing live sessions, and tool output collapsing behind finished reasoning segments ([#11868](https://github.com/can1357/oh-my-pi/pull/11868) by [@serverinspector](https://github.com/serverinspector)).\n- Invalid `WATCHDOG.yml` entries now produce startup/editor warnings while healthy advisors remain available ([#11882](https://github.com/can1357/oh-my-pi/pull/11882) by [@olegpulatov](https://github.com/olegpulatov)).\n- Claude Code session imports now preserve typed user text stored alongside tool results ([#11854](https://github.com/can1357/oh-my-pi/issues/11854)).\n- Extension commands now settle BTW writes before creating, switching, or branching sessions, preventing side requests from outliving their source session ([#11335](https://github.com/can1357/oh-my-pi/pull/11335) by [@Ant39140](https://github.com/Ant39140)).\n- Session selection and active-session deletion now settle BTW writes before switching or removing history, preventing stale saves from blocking the next session ([#11335](https://github.com/can1357/oh-my-pi/pull/11335) by [@Ant39140](https://github.com/Ant39140)).\n- Escape now cancels BTW follow-ups that are still waiting for startup writes, without launching a model request ([#11335](https://github.com/can1357/oh-my-pi/pull/11335) by [@Ant39140](https://github.com/Ant39140)).\n- BTW history now rejects out-of-range timestamps instead of failing during display ([#11335](https://github.com/can1357/oh-my-pi/pull/11335) by [@Ant39140](https://github.com/Ant39140)).\n- BTW follow-ups now preserve separate user/assistant messages and reuse an isolated topic-specific provider session for prompt caching; cancellation or failure starts a fresh transport generation.\n- Restored Escape cancellation for running BTW answers and removed the separate `x` shortcut; cancelled output stays visible, and closing another history entry returns to any still-running BTW panel instead of hiding it.\n- BTW history now rejects stale cross-process writes and protects running topics with an OS-backed lease, preventing one instance from erasing another instance's follow-ups.\n- Copying a BTW topic now falls back to its most recent nonempty answer after an empty failed or cancelled follow-up.\n- Invalid or cancelled `/move` operations no longer cancel BTW requests; busy side conversations block relocation, and stalled history writes stop session operations with a bounded error instead of hanging indefinitely.\n- Session shutdown now shows closing progress before waiting for live commands or BTW history writes, and stops progress updates when cleanup completes or fails.\n- Failed BTW terminal saves now block session operations while retaining the answer for copying and safe retry, instead of being treated as a successful flush.\n- Standalone `!cd` now shares the BTW relocation guard with `/move` and `/wt`, refusing before shell execution when a side conversation is active or unsaved.\n- `/wt` now checks BTW migration availability before creating a branch or checkout, preventing unused worktrees when a side conversation is busy.\n- `/move` now checks BTW migration availability before confirming or creating a missing target directory, preventing leftover directories after a refused move.\n- BTW errors now shorten embedded home paths and sanitize control characters and oversized text before display, while retaining original diagnostic errors.\n- Speculative reads now open the authorized resolved target while rendering the requested path, so enabling speculation no longer changes read output for symlinks; video targets are declined at authorization ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n- JavaScript speculation now verifies the retained tool-bridge dispatcher and string-coercion intrinsic identities before projecting reads ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n- Speculative eval sessions are now discarded at reconciliation when a hook or transform appends source the stream never verified, instead of releasing reads planned from the original code ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n- Speculative reads now classify format and rendering by the requested path while opening the resolved target, so symlinks with a different extension read exactly like ordinary reads ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n- JavaScript speculation now validates coercion intrinsics used by `String()` and `.join()` inputs, not just template and `+` operands ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n- Speculative reads now infer the summary language from the requested path while reading the resolved target, so cross-language symlinks summarize exactly like ordinary reads (by [@h4vc](https://github.com/h4vc)).\n- The structural summary cache now keys on the parser language path, so one file read through different extensions no longer reuses a stale summary (by [@h4vc](https://github.com/h4vc)).\n- Fixed the Windows installer failing on Windows PowerShell 5.1: OS architecture detection no longer depends on the .NET `RuntimeInformation` type that only resolves reliably on PowerShell 7, and the script now requires PowerShell 5.1+ with a clear upgrade message instead of failing cryptically ([#11905](https://github.com/can1357/oh-my-pi/pull/11905) by [@h4vc](https://github.com/h4vc)).\n- Speculative reads now infer the summary language from the requested path while reading the resolved target, so cross-language symlinks summarize exactly like ordinary reads ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n- The structural summary cache now keys on the parser language path, so one file read through different extensions no longer reuses a stale summary ([#11892](https://github.com/can1357/oh-my-pi/pull/11892) by [@h4vc](https://github.com/h4vc)).\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added public `acquireFileLock()` and `FileLockHandle` APIs for holding and explicitly releasing exclusive OS-backed file locks.\n\n### Fixed\n\n- Child-shell environment filtering now tolerates a removed process working directory by retaining the resolved project directory ([#11828](https://github.com/can1357/oh-my-pi/issues/11828)).\n\n\n## What's Changed\n* fix(debug): avoid heap snapshot string limits by @roboomp in https://github.com/can1357/oh-my-pi/pull/11786\n* fix(mcp): release obsolete tools after reconnect by @roboomp in https://github.com/can1357/oh-my-pi/pull/11787\n* fix(catalog): give deepseek-flash the V4.1 Flash wire contract by @H4vC in https://github.com/can1357/oh-my-pi/pull/11799\n* fix(utils): tolerate deleted working directories by @roboomp in https://github.com/can1357/oh-my-pi/pull/11829\n* feat(catalog): add Charm Hyper provider by @oldschoola in https://github.com/can1357/oh-my-pi/pull/11656\n* fix(ai): rotate accounts when Anthropic reports credits_required by @AshishKumar4 in https://github.com/can1357/oh-my-pi/pull/11333\n* fix(tui): hide tool activity in retired transcript history by @notnotype in https://github.com/can1357/oh-my-pi/pull/11734\n* fix(ai): fall back to the canonical Anthropic usage endpoint when a custom baseUrl does not serve it by @sandboiii in https://github.com/can1357/oh-my-pi/pull/11376\n* fix(ai): retry tool calls with empty args by @justdoGIT in https://github.com/can1357/oh-my-pi/pull/11823\n* feat(coding-agent): per-model reasoning efforts in retry fallback chains by @H4vC in https://github.com/can1357/oh-my-pi/pull/11842\n* feat(coding-agent): add persistent btw history and follow-ups by @Ant39140 in https://github.com/can1357/oh-my-pi/pull/11335\n* test(release): sync native-core file list with VCS entrypoints by @roboomp in https://github.com/can1357/oh-my-pi/pull/10884\n* fix(coding-agent): make status test worktree-safe by @roboomp in https://github.com/can1357/oh-my-pi/pull/11716\n* fix(ai): allow null subs_tier_id/subs_tier_name in Muse Code login response by @John-Cusack in https://github.com/can1357/oh-my-pi/pull/11843\n* fix(cli): return non-zero when a JSON print-mode turn fails by @JamieJ5926 in https://github.com/can1357/oh-my-pi/pull/11545\n* fix(ai): allow Codex OAuth login without account ID by @nguyennguyenit in https://github.com/can1357/oh-my-pi/pull/11847\n* test(coding-agent): make two path assertions pass on Windows by @oleg494 in https://github.com/can1357/oh-my-pi/pull/11851\n* fix(ai): distinguish Kimi weekly limit from total quota and rotate on termination by @revofusion in https://github.com/can1357/oh-my-pi/pull/11827\n* test(coding-agent): assert the shortened artifact notice path independently by @oleg494 in https://github.com/can1357/oh-my-pi/pull/11853\n* fix(edit): drop a copied \"more lines in ...\" read notice in sloppy mode by @vasyza in https://github.com/can1357/oh-my-pi/pull/11797\n* fix(session): preserve text in mixed Claude records by @roboomp in https://github.com/can1357/oh-my-pi/pull/11856\n* fix(tui): skip hidden thinking formatting by @redsolver in https://github.com/can1357/oh-my-pi/pull/11632\n* feat(task): add per-agent service-tier overrides by @alphastorm in https://github.com/can1357/oh-my-pi/pull/9668\n* feat: Add speculative tool and eval execution by @wn-mitch in https://github.com/can1357/oh-my-pi/pull/9732\n* Wnmitch/spec followup nits by @H4vC in https://github.com/can1357/oh-my-pi/pull/11889\n* fix(advisor): preserve healthy WATCHDOG entries and surface warnings by @olegpulatov in https://github.com/can1357/oh-my-pi/pull/11882\n* fix(mcp): resolve the Claude Code tool-name spelling to its registered tool by @oldschoola in https://github.com/can1357/oh-my-pi/pull/11876\n* test(utils,coding-agent): fix Windows-only suite failures by @H4vC in https://github.com/can1357/oh-my-pi/pull/11893\n* fix(spec): exact-code reconcile, transform coercion gates, lexical cl\u2026 by @H4vC in https://github.com/can1357/oh-my-pi/pull/11892\n* fix(ai): anchor proxy tunnel socket in a typed const by @H4vC in https://github.com/can1357/oh-my-pi/pull/11901\n* docs(changelog): add 11892 links to follow-up entries, drop agent duplicate by @H4vC in https://github.com/can1357/oh-my-pi/pull/11902\n* fix(coding-agent): version-robust fetch/socket/console typings by @H4vC in https://github.com/can1357/oh-my-pi/pull/11903\n* fix(install): pwsh version check for pwsh installer by @H4vC in https://github.com/can1357/oh-my-pi/pull/11905\n* fix(tui): preserve live tool results and retire closed reasoning by @serverinspector in https://github.com/can1357/oh-my-pi/pull/11868\n* fix(auth): registe