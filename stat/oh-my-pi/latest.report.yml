wDOQxs0bc4kv3tx","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":282535392,"digest":"sha256:03387aceae62386eaefbe96786f6df0e2e2e843ce76926c063a485905b1f4c4f","download_count":3862,"created_at":"2026-10-06T20:05:33Z","updated_at":"2026-10-06T20:05:47Z"},{"id":616528751,"node_id":"RA_kwDOQxs0bc4kv3tv","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":225124864,"digest":"sha256:c128cc9b01b7e9d0cae936fba2f4b2d1d32ebbd9640e8b845702aac078ce60ff","download_count":19,"created_at":"2026-10-06T20:05:33Z","updated_at":"2026-10-06T20:05:47Z"},{"id":616528757,"node_id":"RA_kwDOQxs0bc4kv3t1","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":236147712,"digest":"sha256:c22e1c866289d05e617ddc0dcce7b3ef720a9707b45ef154c6d2cb202a95d1cf","download_count":1839,"created_at":"2026-10-06T20:05:33Z","updated_at":"2026-10-06T20:05:47Z"},{"id":616528761,"node_id":"RA_kwDOQxs0bc4kv3t5","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:fe55c51ea7ecb574dec3e2d5406ff1013a8f9ec29c2bab24c7f7ffc11a706b5a","download_count":264,"created_at":"2026-10-06T20:05:33Z","updated_at":"2026-10-06T20:05:34Z"},{"id":616528765,"node_id":"RA_kwDOQxs0bc4kv3t9","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1076437,"digest":"sha256:d0c2e7c05bb4d755044b13fa560be58d01ab7c980b87892400a979397e569a8b","download_count":9,"created_at":"2026-10-06T20:05:33Z","updated_at":"2026-10-06T20:05:34Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Fixed\n\n- Fixed interrupted runs so assistant message boundaries are emitted reliably, allowing subscribers to persist and recover the interrupted turn.\n\n## @oh-my-pi/pi-ai\n\n### Added\n\n- Added `getOAuthCredentialProvider()` to resolve login aliases, such as `openai-codex-device`, to the provider where their credentials are stored.\n\n### Fixed\n\n- Fixed Ultrafast service-tier billing and usage accounting: GPT-6 Astra now applies its published premium rates\u20146\u00d7 on the OpenAI API and 8\u00d7 included usage on Codex\u2014and is counted toward the premium-request limit.\n- Fixed Vertex AI authentication on Windows when credentials are created with `gcloud auth application-default login`.\n- Fixed selecting Cursor accounts by email through `auth.accountPolicies` and `/session pin`; newly refreshed and existing accounts now retain the account email.\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added Mistral Large 4 with reasoning support, image input, a 1M-token context window, and preview pricing.\n- Added configurable thinking levels from low through maximum for MiniMax-M3.1-Flash-Preview; because the model always reasons, requests that disable thinking use the low level.\n- Added Google Antigravity pricing and model support for Claude Opus 5.5 and Sonnet 5.5.\n\n### Changed\n\n- MiniMax Token Plan providers (`minimax-code` and `minimax-code-cn`) now use MiniMax's recommended Anthropic-compatible API for model requests and login key validation.\n- Google Antigravity now exposes Claude Opus 5.5 and Sonnet 5.5 once each, with selectable low, medium, and high thinking levels.\n\n### Fixed\n\n- Added the correct published pricing for GPT-6 Astra's Ultrafast service tier: a 6\u00d7 multiplier on the OpenAI API and an 8\u00d7 multiplier on the Codex card.\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added last-chance consumption of eligible banked Codex and Claude resets expiring within five minutes when auto-redeem is enabled, even with low usage or reserved credits.\n- Added inline rendering of agent-generated SVG diagrams, charts, and mockups, with theme-aware colors and a `tui.renderSvg` setting to disable it.\n- Added automatic chart generation for numeric tables, configurable with `tui.autoGraph` (`always`, `smart`, or `off`). The agent now chooses suitable visual formats\u2014including charts, Mermaid, SVG, tables, or prose\u2014based on the content. Charts and this guidance apply to the main TUI session only, not to subagents, print, RPC, or ACP.\n- Added first-class JSON and JSONL querying to the `read` tool with `?q=<jq-filter>`, including in-process filtering, raw or compact output, and offset/limit pagination for efficient large-file access.\n- Added `/prewalk off` to cancel a pending model handoff without changing the active model, saved prewalk setting, or continuation history.\n- Added logout support to RPC clients through `get_logout_accounts` and `logout`, with matching methods in the TypeScript, Python, Go, and Rust SDKs.\n- Added custom model-kind declarations for providers and extensions, allowing image, speech, embedding, judge, and other supported model roles to be registered and routed correctly.\n- Added working-directory reporting for Tern terminal sessions so the native composer bar can display the current folder.\n\n### Changed\n\n- Improved JSON and JSONL query streaming and pagination to reduce resource usage, support partial results, and provide clearer continuation between result pages.\n- Clarified the `read` tool documentation with complete examples for requesting line ranges.\n\n### Fixed\n\n- Fixed model-preset tests failing when provider credentials are configured in the environment.\n- Fixed unauthenticated Macs auto-selecting the on-device Apple model when the default prompt exceeds its context window; Apple remains selectable explicitly.\n- Fixed replay and compaction tests failing after bundled model roster changes.\n- Fixed standalone builds failing when the native addon archive could not be resolved.\n- Fixed JSON query parsing and parameter decoding for filters beginning with hyphens and other encoded query values.\n- Fixed task execution after settings could not be saved; subagents now use the current in-memory settings while the save failure is reported as a warning.\n- Fixed prewalk and model-recovery state across `/new`, handoffs, cancellations, and automatic recovery.\n- Fixed login, logout, model refresh, and provider-status reporting for aliased providers such as `openai-codex-device`.\n- Fixed model speed statistics mixing fast service-tier results into standard-tier averages; `/models` now reports the applicable tier separately.\n- Fixed the `write` and `edit` tools hanging or consuming excessive resources when given FIFOs, terminals, device files, or other non-regular targets; unsupported targets are now rejected safely.\n- Fixed long conversations losing user or tool-result images because assistant-generated images were counted against provider image limits.\n- Fixed local session paths for special session IDs such as `.` and `..` so they cannot escape the intended storage directory.\n- Fixed `omp gc --archive --apply` leaving orphaned session-title records behind.\n- Fixed `/retry` after an interrupted process exit while an extension-driven prompt was reopening.\n- Fixed browser relay sessions failing to discover or interact with cross-origin iframe content that loaded before the tab was opened.\n- Fixed browser clicks on visually styled radios and checkboxes whose underlying inputs are hidden.\n- Fixed `/model` failing to switch when selecting the model already assigned to a project's default role.\n- Fixed `wait` returning early when a background completion had already been consumed by another operation.\n- Fixed symlinked routing configurations failing to reload after their target links were replaced.\n- Fixed repeated coding-plan fallback confirmations in cases involving changing thinking settings, unavailable quota information, or account recovery.\n- Fixed Python evaluation failing when a shared runner temporary directory was created by another user.\n- Fixed RPC clients being unable to complete multi-select questions in multi-question `ask` prompts.\n- Corrected inaccurate tool and setting descriptions, including `read` ranges, background `bash` behavior, Python evaluation capabilities, edit replacement guidance, goal removal behavior, and `advisor.immuneTurns`.\n- Fixed custom glob backends hanging indefinitely; scans now honor tool deadlines and cancellation.\n- Fixed `--resume <path>` silently creating a new session when the specified path did not exist; it now reports the missing path.\n- Fixed `/settings` opening duplicate menus when invoked while the settings menu was already open.\n- Fixed native Git operations resolving repositories incorrectly when run through symbolic links.\n\n## @oh-my-pi/pi-natives\n\n### Breaking Changes\n\n- Renamed the `linux-all` Bazel target (`//:natives-linux-all`) to `all` (`//:natives-all`); the renamed target now includes Darwin addons.\n- Removed the `gen:native` and `gen:native:reset` scripts. Standalone binary builds now embed the native addon archive and manifest instead of writing them to `native/`.\n\n### Added\n\n- Enhanced `rasterizeSvg` with optional scaling and terminal-cell padding, allowing SVGs to render larger while preserving 1:1 display in terminals.\n- Added `OMP_NATIVE_FEATURES` for passing extra Cargo features to local native addon builds; Bazel builds ignore this setting.\n- Added support for cross-compiling macOS native addons from Linux hosts.\n\n### Changed\n\n- macOS addon release stamping now works on any host by refreshing the addon's ad-hoc signature automatically.\n\n### Fixed\n\n- Fixed `tail` failing to print files, or omitting their first 64 KiB, when file sizes were exact multiples of 64 KiB.\n- Fixed `tail` printing nothing, or dropping lines from the file's first 64 KiB, when the file size is an exact multiple of 64 KiB ([#14264](https://github.com/can1357/oh-my-pi/pull/14264) by [@jchanghong023](https://github.com/jchanghong023))\n- Fixed native `sed` and `jq` killing the host process with SIGBUS when an input file is truncated while they read it ([#14613](https://github.com/can1357/oh-my-pi/issues/14613))\n- Fixed `tail -f` piped into a command that exits early (such as `head -n 1` or `grep -m1`) never stopping on macOS ([#14614](https://github.com/can1357/oh-my-pi/issues/14614))\n- Native `sort -u` keeps punctuation-distinct paths under UTF-8 locales instead of silently dropping records ([#14606](https://github.com/can1357/oh-my-pi/issues/14606)).\n\n## @oh-my-pi/omp-stats\n\n### Fixed\n\n- Fixed Ultrafast turns not being counted toward the Premium Requests statistic.\n- Fixed the desktop stats dashboard menu button so it no longer appears unnecessarily or dims the page without opening navigation.\n\n## @oh-my-pi/pi-tui\n\n### Added\n\n- Assistant SVG code blocks now render as inline, theme-colored images on terminals with graphics support, updating as responses stream and adapting to terminal width; SVG that cannot be rendered remains available as code.\n- Numeric tables in assistant responses can now include automatically selected, themed charts based on the table\u2019s structure and units.\n\n### Changed\n\n- The status line now recognizes projects located in the user\u2019s `repos` directory.\n- Model mentions, `/switch` completions, and model-picker search now update immediately while typing, including with large model catalogs.\n\n### Fixed\n\n- Fixed terminal resizing issues that could cause flicker or briefly display an empty frame.\n- Improved `/annotate` handling for long source lines and filenames, preserving indentation and typed note text.\n- Fixed fullscreen inputs that could hide the cursor when hardware-cursor support was enabled.\n- Fixed model picker and mention-list ordering for same-provider `-latest` models so results remain alphabetically stable.\n- Model browser performance metrics now show the correct measurements for each service tier and identify the tier.\n- Fixed plan review keyboard navigation so horizontal options use Left/Right and model-slider adjustments use Shift+Left/Right.\n- Improved the Ask dialog footer so question-switching keyboard shortcuts are clearly labeled.\n- Fixed creating a new agent when its generated system prompt contains a Markdown code fence.\n- Timed-out `glob` scans are now labeled as timed out rather than truncated.\n- Ctrl+Delete now deletes the word after the cursor, matching Ctrl+Backspace behavior.\n\n\n## What's Changed\n* fix(tui): update autocomplete on every keystroke and speed up model ranking by @H4vC in https://github.com/can1357/oh-my-pi/pull/14595\n* feat(catalog): collapse Antigravity Claude 5.5 thinking tiers and add pricing by @eggpeat in https://github.com/can1357/oh-my-pi/pull/14195\n* feat(catalog): routed MiniMax Token Plan through the Anthropic-compatible API by @eggpeat in https://github.com/can1357/oh-my-pi/pull/13696\n* fix(ai): priced ultrafast turns at the published 6x premium and kept tier speeds separate by @eggpeat in https://github.com/can1357/oh-my-pi/pull/14471\n* feat(coding-agent): add RPC logout commands by @andrebrait in https://github.com/can1357/oh-my-pi/pull/14588\n* fix(prewalk): rearm new sessions and allow disarming by @NaC-L in https://github.com/can1357/oh-my-pi/pull/14587\n* feat(catalog): add Mistral Large 4 (AI-assisted) by @PierrunoYT in https://github.com/can1357/oh-my-pi/pull/14602\n* fix(coding-agent): release obsolete catalog snapshots by @iliaal in https://github.com/can1357/oh-my-pi/pull/14317\n* fix(write): refuse FIFOs and devices instead of freezing on them by @DrFaustus-vic in https://github.com/can1357/oh-my-pi/pull/14452\n* fix(edit): refuse FIFOs and devices instead of blocking on them by @DrFaustus-vic in https://github.com/can1357/oh-my-pi/pull/14462\n* Stop assistant images from evicting real input images by @F0Rextasy in https://github.com/can1357/oh-my-pi/pull/14390\n* fix(coding-agent): keep the local:// fallback root inside omp-local for . and .. session ids by @jaredlyon in https://github.com/can1357/oh-my-pi/pull/14385\n* fix(gc): delete session_titles rows for archived sessions by @F0Rextasy in https://github.com/can1357/oh-my-pi/pull/14358\n* fix(agent): persist the aborted turn when a context handler rejects on abort by @schickling-assistant in https://github.com/can1357/oh-my-pi/pull/14188\n* fix(tui): label the question-switch keys in the Ask dialog footer by @tahakotil in https://github.com/can1357/oh-my-pi/pull/14590\n* fix(tui): keep code fences inside JSON when parsing generated agent spec by @tahakotil in https://github.com/can1357/oh-my-pi/pull/14589\n* fix(coding-agent): show relay runs the iframes that loaded before the tab was opened by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/14422\n* fix(browser): click radios and checkboxes whose real input is transparent by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/14555\n* fix(ai): find gcloud user ADC under %APPDATA% on Windows by @jorgoose in https://github.com/can1357/oh-my-pi/pull/14549\n* fix(stats): hide topbar menu button on desktop by @lin-snow in https://github.com/can1357/oh-my-pi/pull/14406\n* fix(coding-agent): switch to the project default when its model-hub chip is picked by @jshield in https://github.com/can1357/oh-my-pi/pull/14382\n* fix(coding-agent): ignore consumed completions when peeking the yield queue by @nick-maderight in https://github.com/can1357/oh-my-pi/pull/14257\n* chore: remove duplicate Response.Moderation interface declarations by @kvnloo in https://github.com/can1357/oh-my-pi/pull/13719\n* docs(telemetry): document skill description oneshot kind by @xaviergmail in https://github.com/can1357/oh-my-pi/pull/14145\n* fix(ai): store the Cursor account email so account policies can select it by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/14511\n* fix(coding-agent): follow config symlink replacements live by @schickling-assistant in https://github.com/can1357/oh-my-pi/pull/14192\n* docs(readme): document project input trust controls by @JYeswak in https://github.com/can1357/oh-my-pi/pull/14259\n* fix(tui): use left/right to pick plan review options in Tern by @H4vC in https://github.com/can1357/oh-my-pi/pull/14607\n* fix(coding-agent): stop re-asking the reserve fallback prompt after No by @lemonleks in https://github.com/can1357/oh-my-pi/pull/14475\n* fix(eval): stage runner scripts in a per-uid temp dir by @TheRockPusher in https://github.com/can1357/oh-my-pi/pull/14449\n* fix(coding-agent): offer Done selecting for multi-select in multi-question ask over RPC by @ataberkus in https://github.com/can1357/oh-my-pi/pull/14253\n* fix(pi-builtins): read a full last chunk in tail when the size is a block multiple by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/14264\n* feat(natives): pass extra cargo features via env by @justdoGIT in https://github.com/can1357/oh-my-pi/pull/14058\n* docs(coding-agent): make tool descriptions match runtime behaviour by @radkawar in https://github.com/can1357/oh-my-pi/pull/13998\n* Correct advisor.immuneTurns description: blockers are always exempt by @F0Rextasy in https://github.com/can1357/oh-my-pi/pull/14360\n* fix(coding-agent): custom glob backends ignore the tool deadline by @F0Rextasy in https://github.com/can1357/oh-my-pi/pull/14426\n* fix(coding-agent): --resume <path> must fail closed on a missing file by @F0Rextasy in https://github.com/can1357/oh-my-pi/pull/14404\n* docs(coding-agent): show complete read range calls by @Dante-dan in https://github.com/can1357/oh-my-pi/pull/13956\n* feat(models): custom model kinds and runner APIs for models.yml and extensions by @jimhester in https://github.com/can1357/oh-my-pi/pull/14483\n* fix(tui): improve annotate wrapping, filenames, and cursor behavior by @anatoli-tsinovoy in https://github.com/can1357/oh-my-pi/pull/14609\n* feat(read): add first-class JSON and JSONL querying with ?q=<jq-filter> by @asuffield in https://github.com/can1357/oh-my-pi/pull/14141\n* fix(settings): kept reloads working after a failed config save by @roboomp in https://github.com/can1357/oh-my-pi/pull/14622\n* fix(builtins): read sed and jq inputs instead of mmapping them by @roboomp in https://github.com/can1357/oh-my-pi/pull/14618\n* fix(builtins): preserved punctuation in locale sort uniqueness by @roboomp in https://github.com/can1357/oh-my-pi/pull/14610\n* fix(builtins): stopped tail -f on macOS once its pipe reader exits by @roboomp in https://github.com/can1357/oh-my-pi/pull/14617\n\n## New Contributors\n* @PierrunoYT made their first contribution in https://github.com/can1357/oh-my-pi/pull/14602\n* @tahakotil made their first contribution in https://github.com/can1357/oh-my-pi/pull/14590\n* @lin-snow made their first contribution in https://github.com/can1357/oh-my-pi/pull/14406\n* @jshield made their first contribution in https://github.com/can1357/oh-my-pi/pull/14382\n* @TheRockPusher made their first contribution in https://github.com/can1357/oh-my-pi/pull/14449\n* @ataberkus made their first contribution in https://github.com/can1357/oh-my-pi/pull/14253\n* @jimhester made their first contribution in https://github.com/can1357/oh-my-pi/pull/14483\n* @asuffield made their first contribution in https://github.com/can1357/oh-my-pi/pull/14141\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.6.3...v18.7.0","reactions":{"total_count":4,"+1":2,"-1":0,"laugh":1,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":30}
