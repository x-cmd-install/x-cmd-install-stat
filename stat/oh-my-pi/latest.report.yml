DOQxs0bc4pot2x","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":276785328,"digest":"sha256:6737ee2415555a3656cc7b89c14d1c25c18658ee4c0fd4f7309705149ccb7b0f","download_count":2955,"created_at":"2026-11-01T14:16:54Z","updated_at":"2026-11-01T14:17:06Z"},{"id":698539447,"node_id":"RA_kwDOQxs0bc4pot23","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":225783296,"digest":"sha256:a9a4d83c509322f52fe9f3b187163d9c0cbe878d8a1ca4883032820c697a8184","download_count":18,"created_at":"2026-11-01T14:16:54Z","updated_at":"2026-11-01T14:17:07Z"},{"id":698539443,"node_id":"RA_kwDOQxs0bc4pot2z","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":243250176,"digest":"sha256:978846a816cb77f44a55e32b16493375ca837fbf87e0aec35a9c1c934bff0cd0","download_count":1104,"created_at":"2026-11-01T14:16:54Z","updated_at":"2026-11-01T14:17:05Z"},{"id":698539453,"node_id":"RA_kwDOQxs0bc4pot29","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":844,"digest":"sha256:c866af8cc5c8f04d0baee8b5a836b63419b6fa6095061685588af3a3cbe52f72","download_count":403,"created_at":"2026-11-01T14:16:54Z","updated_at":"2026-11-01T14:16:55Z"}],"body":"## @oh-my-pi/pi-agent-core\n\n### Fixed\n\n- Fixed OpenAI remote compaction (`/responses/compact`) replaying backend-only `internal_chat_message_metadata_passthrough` metadata that Codex rejects as an unknown parameter ([#17590](https://github.com/can1357/oh-my-pi/pull/17590) by [@briankeefe](https://github.com/briankeefe))\n\n## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Fixed Codex conversation replay failing with an unknown `internal_chat_message_metadata_passthrough.content_token_count` parameter by omitting backend-internal response metadata from replayed input ([#17590](https://github.com/can1357/oh-my-pi/pull/17590), [#17597](https://github.com/can1357/oh-my-pi/pull/17597) by [@briankeefe](https://github.com/briankeefe)).\n- Fixed `service_tier: \"ultrafast\"` being dropped for OpenAI-family models on custom providers even when the model's `serviceTiers` lists it ([#17577](https://github.com/can1357/oh-my-pi/pull/17577) by [@jakehemmerle](https://github.com/jakehemmerle))\n- Fixed Google Vertex requests with Workforce Identity Federation ADC failing token refresh against the wrong endpoint ([#17447](https://github.com/can1357/oh-my-pi/issues/17447)).\n- Fixed Anthropic (and other rotating-token) OAuth accounts being signed out automatically when a background usage poll's token refresh got `invalid_grant`, including refreshes a client delegates to an auth broker; usage polling no longer disables credentials, so only a real request's refresh can do that ([#17468](https://github.com/can1357/oh-my-pi/issues/17468))\n\n## @oh-my-pi/pi-catalog\n\n### Added\n\n- Added Modular Cloud (`modular`) as a provider: `/login modular` with an API key, models and prices from the models.dev `modular` entry, and per-model reasoning controls for MiniMax M3.1 Flash, MiniMax M3, and Gemma 4 31B ([#17334](https://github.com/can1357/oh-my-pi/pull/17334) by [@tommyjtl](https://github.com/tommyjtl))\n- SambaNova Cloud follow-up turns now reuse the provider's prefix cache, so multi-turn conversations stop re-processing earlier context ([#17555](https://github.com/can1357/oh-my-pi/pull/17555) by [@rjuez00](https://github.com/rjuez00))\n\n### Fixed\n\n- Fixed newly discovered OpenAI-compatible models ignoring provider-reported context and output token limits ([#17561](https://github.com/can1357/oh-my-pi/pull/17561) by [@wolfiesch](https://github.com/wolfiesch))\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Long or multi-step background shell commands get a one-line caption saying what they do and when they end, written once per job by the `widget` model role when the job, after running 15 seconds, is shown in a live widget or listed by `/jobs full`; the jobs sheet and `/jobs full` show it under the job's purpose. It follows the Live Job Widgets setting (`async.widgets`), and `CreateAgentSessionOptions.jobCaptionWriter` replaces the model call ([#17649](https://github.com/can1357/oh-my-pi/pull/17649) by [@wolfiesch](https://github.com/wolfiesch))\n\n### Changed\n\n- In a source checkout, the error for a missing HTML export viewer now names the script that builds it, `packages/collab-web/scripts/build-export-viewer.ts`, beside `bun gen:export-viewer` ([#17636](https://github.com/can1357/oh-my-pi/pull/17636) by [@sjawhar](https://github.com/sjawhar))\n- Fixed an eval cell running silently on a new kernel after the session's Python kernel or JS worker died between cells (a crash, a kill, an out-of-memory kill, or a cancelled JS cell): the first cell on the replacement now carries `Kernel restarted: … state is unavailable. Re-run needed setup` ahead of its own output, instead of failing with a bare `NameError` on a variable an earlier cell set ([#17595](https://github.com/can1357/oh-my-pi/pull/17595) by [@sjawhar](https://github.com/sjawhar))\n- Fixed a task worker messaged (`write agent://<id>`) while still starting up running on the shared `context` alone and never receiving its `tasks[].task` assignment; the message now waits for the assignment's turn ([#17587](https://github.com/can1357/oh-my-pi/issues/17587))\n- `lsp reload` now discovers Rust crates created after rust-analyzer started, so hover and other analysis work without restarting omp ([#17658](https://github.com/can1357/oh-my-pi/issues/17658)).\n- A model without image input (GLM, DeepSeek, Grok Composer and the like) reads a snapcompact archive's full kept text instead of image-omitted placeholders for its frames, after a model switch, on resume and in side requests ([#17510](https://github.com/can1357/oh-my-pi/pull/17510) by [@will-bogusz](https://github.com/will-bogusz))\n- Snapcompact no longer refuses a new archive as \"would not reduce context\" when it shrinks a session that already holds one (`/compact snapcompact`, idle and pre-prompt compaction) ([#17490](https://github.com/can1357/oh-my-pi/pull/17490) by [@will-bogusz](https://github.com/will-bogusz))\n- A failed `/compact snapcompact` now reports its reason once instead of twice, and names the `/compact` mode to run instead ([#17490](https://github.com/can1357/oh-my-pi/pull/17490) by [@will-bogusz](https://github.com/will-bogusz))\n- Background bash and eval jobs now carry the purpose the model gave for the call: `/jobs`, `/jobs full`, `proc://` listings, `wait` and `job` results, and the jobs HUD hover lead with it ahead of the raw command line ([#17649](https://github.com/can1357/oh-my-pi/pull/17649) by [@wolfiesch](https://github.com/wolfiesch))\n- The `seance` guidance in the task tool and the `archive` docs now say that a question about an earlier session is answered by the `seance` agent, and that reading the session's raw JSONL belongs to narrow mechanical checks only, so a consult is no longer duplicated by transcript reads and re-run checks ([#17523](https://github.com/can1357/oh-my-pi/pull/17523) by [@iacore](https://github.com/iacore))\n\n### Fixed\n\n- A prompt on a model whose provider has no usable credential (logged out, refresh token expired, or an auth broker holding none) now switches to the first `retry.fallbackChains` candidate that has one instead of failing with \"No API key found\", and switches back on the first prompt after the credential returns ([#17559](https://github.com/can1357/oh-my-pi/pull/17559) by [@wolfiesch](https://github.com/wolfiesch))\n- Fixed background results arriving during manual `/compact` starting turns on stale history or disappearing from the saved session ([#17599](https://github.com/can1357/oh-my-pi/issues/17599)).\n- Fixed isolated tasks on fuse-overlayfs leaving their overlay mounted and the `fuse-overlayfs` daemon running when the unmount hit a transient \"Device or resource busy\"; a failed unmount now reports fusermount's error and keeps the workspace for `omp worktree clear` instead of deleting its layers under the live mount ([#17644](https://github.com/can1357/oh-my-pi/issues/17644))\n- Usage-limit retries now count system sleep toward the quota-reset deadline instead of re-arming the remaining uptime delay after the countdown reaches zero ([#17606](https://github.com/can1357/oh-my-pi/pull/17606) by [@zhiland](https://github.com/zhiland)).\n- Fixed role assignments to a `models.yml` model whose id differs only by case from a bundled model of the same provider (such as `xiaomi/MiMo-V2.6-Pro` beside `xiaomi/mimo-v2.6-pro`) silently staying unset ([#17580](https://github.com/can1357/oh-my-pi/issues/17580))\n- Fixed Eval's direct browser wait helpers (`tab.waitForSelector`, `tab.waitForText`, …) giving up after 29 s when passed a longer `{ timeout }`; the requested timeout is now honored up to the browser tool's 300 s cap ([#17617](https://github.com/can1357/oh-my-pi/issues/17617))\n- Fixed `browser.open` with a fresh custom Chrome profile failing when Chrome has no initial tabs; it now opens its own tab without navigating an existing one ([#17583](https://github.com/can1357/oh-my-pi/issues/17583)).\n- Fixed the read tool's repeated-output notice suggesting a `path:A-B` selector on `xd://` topics, MCP resources and other URLs that reject selectors ([#17631](https://github.com/can1357/oh-my-pi/issues/17631))\n- The `lsp` tool now starts `typescript-native` (`tsc --lsp --stdio`) for a TypeScript 7 `tsc` installed without a `package.json`, such as the nixpkgs package, instead of leaving the project with no TypeScript server ([#17659](https://github.com/can1357/oh-my-pi/issues/17659))\n- DuckDuckGo excludes advertising click redirects before applying result limits, keeping them out of direct and Public Web sources ([#17564](https://github.com/can1357/oh-my-pi/pull/17564) by [@jasonharrison](https://github.com/jasonharrison)).\n- Fixed `/fast` refusing Ultrafast (\"The current model does not offer the Ultrafast service tier\") on custom OpenAI-compatible providers whose `/v1/models` row lists `ultrafast` in `service_tiers`, such as relays in front of a ChatGPT subscription ([#17577](https://github.com/can1357/oh-my-pi/pull/17577) by [@jakehemmerle](https://github.com/jakehemmerle))\n- Importing the SDK no longer takes over the embedding host's signal and fatal-error shutdown; registered cleanup still runs at exit ([#17674](https://github.com/can1357/oh-my-pi/issues/17674)).\n- Fixed raw browser `page.waitForFunction` waits timing out after a full-document navigation even when the destination matches the predicate ([#17584](https://github.com/can1357/oh-my-pi/issues/17584))\n- Fixed a Ctrl+R history entry picked while an ask dialog's \"Other\" or note prompt is open landing in the hidden main chat input instead of that prompt ([#17565](https://github.com/can1357/oh-my-pi/issues/17565))\n- Bash commands no longer hang on `git rebase -i` when git config sets a `sequence.editor` (an inline `GIT_SEQUENCE_EDITOR=…` still wins), or on Git Credential Manager GUI/browser sign-in prompts ([#17452](https://github.com/can1357/oh-my-pi/pull/17452) by [@wolfiesch](https://github.com/wolfiesch))\n- Fixed intercepted bash commands asking for approval before being blocked anyway ([#17502](https://github.com/can1357/oh-my-pi/pull/17502) by [@asuffield](https://github.com/asuffield))\n- Fixed `omp --from-claude` listing a Claude Code session renamed with `/rename` by its first prompt; the picker now shows the renamed title and importing the session keeps it ([#17361](https://github.com/can1357/oh-my-pi/pull/17361) by [@namest504](https://github.com/namest504)).\n- Auto-learn capture turns now reuse the main turn's prompt cache instead of re-sending the whole conversation uncached: they advertise the same tool list and refuse every call except `learn` and `manage_skill` without running it ([#17418](https://github.com/can1357/oh-my-pi/pull/17418) by [@STRML](https://github.com/STRML)).\n- Fixed extensions being unable to replace the background-job completion card with `registerMessageRenderer(\"async-result\", …)`; a registered renderer now owns the card, and the built-in row remains the fallback when none is registered, when one declines, and when one throws ([#17372](https://github.com/can1357/oh-my-pi/pull/17372) by [@AlexBrd999](https://github.com/AlexBrd999), from [#14484](https://github.com/can1357/oh-my-pi/pull/14484) by [@F0Rextasy](https://github.com/F0Rextasy); [#14131](https://github.com/can1357/oh-my-pi/issues/14131))\n- Local dictation stops live previews when the speech model repeatedly cannot keep up, so final transcripts no longer wait behind repeated previews ([#17410](https://github.com/can1357/oh-my-pi/issues/17410)).\n- ACP clients now receive `_omp/compaction/start` and `_omp/compaction/end` notifications, including failures and cancellations, without requiring an active prompt. ([#16969](https://github.com/can1357/oh-my-pi/issues/16969); [#17384](https://github.com/can1357/oh-my-pi/pull/17384) by [@SAKANA-MOONLIGHT](https://github.com/SAKANA-MOONLIGHT)).\n- Fixed `cd` (and `pushd`/`popd`/`z`) failing with `command not found: __zsh_like_cd` in agent shells when `mise activate` or `zoxide init` installed wrapper functions: the shell snapshot now keeps the underscore-prefixed helper functions those wrappers call, instead of dropping every private-looking function ([#17448](https://github.com/can1357/oh-my-pi/pull/17448) by [@KamijoToma](https://github.com/KamijoToma))\n\n## @oh-my-pi/collab-web\n\n### Changed\n\n- `job` tool results name each background job by the purpose the model gave for it, falling back to its command ([#17649](https://github.com/can1357/oh-my-pi/pull/17649) by [@wolfiesch](https://github.com/wolfiesch))\n\n## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Fixed the bash tool's shell stopping with status 1 and no message after about 40 levels of nested functions, `eval` or `source` when the process may open only 1,024 files; a shell that runs out of open files now says so and names the limit to raise ([#17668](https://github.com/can1357/oh-my-pi/pull/17668) by [@sjawhar](https://github.com/sjawhar))\n- `bun check` now runs the Rust half when your branch commits a Rust change on a clean tree, skips it on a TypeScript-only branch even under `CI=true`, and prints one line saying which it did and why (`OMP_FORCE_RUST_TASKS=1` always runs it) ([#17628](https://github.com/can1357/oh-my-pi/pull/17628) by [@sjawhar](https://github.com/sjawhar))\n\n## @oh-my-pi/snapcompact\n\n### Added\n\n- Added `viewWithoutFrames`: what a reader without image input reads for an archive, its kept text in place of its frames ([#17510](https://github.com/can1357/oh-my-pi/pull/17510) by [@will-bogusz](https://github.com/will-bogusz))\n\n## @oh-my-pi/pi-tui\n\n### Breaking Changes\n\n- `GroupedLineContext.isUrl` is replaced by `url`, the internal URL a header names or a body row belongs to ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n\n### Added\n\n- Added `FILE_NAME_COLOR`, `formatStyledPath` and `pathNameStart` to `render/render-utils` for paths in tool bodies and Tern file rows; `createGroupedRowStyler`, `groupedLinkTargets`, `fitGroupsToBudget`, `groupsByFile` and `isMatchRow` to `tools/grouped-file-output`; `splitReadQuery` to `tools/read`; and `HASHLINE_TAG_SUFFIX_RE` to `tools/hashline-format`. `classifyGroupedLines` reports each file header's full `displayPath` and `suffix`, and a `TranscriptStatusPart` without `color` keeps its already-styled text ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- `JobsPanelJob.caption`: the jobs sheet's detail pane shows it, muted, between the job's purpose and its command (`omp.jobs.caption`) ([#17649](https://github.com/can1357/oh-my-pi/pull/17649) by [@wolfiesch](https://github.com/wolfiesch))\n\n### Changed\n\n- The Background jobs sheet names each job by what it is for when the model said so, shows that above the full command in the detail pane, and no longer repeats the command in an empty widget box for jobs that print nothing ([#17649](https://github.com/can1357/oh-my-pi/pull/17649) by [@wolfiesch](https://github.com/wolfiesch))\n- File paths in tool output share one style: a dim directory and the file name in the custom-message label color (bronze in titanium), with line locations and selectors (`:1-175`, `:42:14`, `?q=`) muted. This covers Grep, AST Grep, AST Edit, Glob, Find, LSP, diagnostics, grouped Reads and file mentions; Glob's folder icon is muted like the file-type icons, and paths in tool headers keep their color ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Grep, AST Grep and AST Edit results label each file with its full path instead of the model-facing `# dir/` and `## file#tag` headers, and each file gets its own tree branch. Their collapsed previews fit the same row budget the same way, cutting the last file short rather than overflowing, and end with `… N more matches` (`… N more files` for AST Edit) ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- AST Grep match rows link to their line, as Grep's do ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- LSP diagnostics carry their severity color on the `[error]`/`[warning]` tag instead of the location, and collapsed diagnostic rows now show that tag ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n\n### Fixed\n\n- Rex sessions now render Kitty graphics without forcing the protocol, including when only `TERM=xterm-rex` identifies the client ([#17651](https://github.com/can1357/oh-my-pi/issues/17651)).\n- Fixed collapsed AST Grep showing no matches when its first file or folder was taller than the preview, and its `… N more` row counting hidden folders instead of hidden matches ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Fixed collapsed AST Edit overflowing its preview when the first file's diff was long ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Fixed search and diagnostic file paths in Tern dropping the leading `/` of absolute paths and a folder's own `(…)` ending, and AST Edit diffs in Tern losing highlighting to the file's `#tag`; a file name ending in lowercase or other-length `#…` text keeps it ([#17608](https://github.com/can1357/oh-my-pi/pull/17608) by [@JustasMasiulis](https://github.com/JustasMasiulis))\n- Fixed a read of a URL drawing as dead text in the folded read row: its target is not a file path, so no link was built for it, and clicking the URL did nothing. The row (and each row of a grouped read) now links to the URL itself, gaining an `https://` scheme for a bare `www.` host ([#17598](https://github.com/can1357/oh-my-pi/pull/17598) by [@iacore](https://github.com/iacore))\n- Fixed replayed transcripts ignoring a registered `async-result` message renderer, so a replayed conversation rendered differently from the live one ([#17372](https://github.com/can1357/oh-my-pi/pull/17372) by [@AlexBrd999](https://github.com/AlexBrd999), from [#14484](https://github.com/can1357/oh-my-pi/pull/14484) by [@F0Rextasy](https://github.com/F0Rextasy); [#14131](https://github.com/can1357/oh-my-pi/issues/14131))\n\n## @oh-my-pi/pi-utils\n\n### Added\n\n- Added abortable `sleepUntil` for wall-clock deadline waits that include system sleep, with bounded timer slices to recheck deadlines after resume ([#17606](https://github.com/can1357/oh-my-pi/pull/17606) by [@zhiland](https://github.com/zhiland)).\n\n### Fixed\n\n- Importing pi-utils no longer installs process-wide signal and fatal handlers in embedding hosts; exit-time cleanup stays installed ([#17674](https://github.com/can1357/oh-my-pi/issues/17674)).\n\n\n## What's Changed\n* fix(ai): strip internal response metadata from replay by @briankeefe in https://github.com/can1357/oh-my-pi/pull/17590\n* feat(tui): share one path style in tool bodies and label search files by full path by @JustasMasiulis in https://github.com/can1357/oh-my-pi/pull/17608\n* feat(coding-agent): name background jobs by their purpose and caption long commands by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/17649\n* fix: remove dead export-map entries and make export viewer errors name a working command by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17636\n* fix(iso): retried fuse unmount lazily and kept workspace on failure by @roboomp in https://github.com/can1357/oh-my-pi/pull/17645\n* docs(review): document /review and how a custom reviewer replaces the bundled one by @haesol-shin in https://github.com/can1357/oh-my-pi/pull/17654\n* style(robomp): format the Python examples in the incoming-PR review design doc by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17661\n* fix(lsp): restart rust-analyzer to discover new crates by @roboomp in https://github.com/can1357/oh-my-pi/pull/17663\n* fix(lsp): kept typescript-native for native tsc without package.json by @roboomp in https://github.com/can1357/oh-my-pi/pull/17664\n* fix(utils): deferred process handlers until CLI startup by @roboomp in https://github.com/can1357/oh-my-pi/pull/17675\n* feat(catalog): add Modular Cloud provider by @tommyjtl in https://github.com/can1357/oh-my-pi/pull/17334\n* docs: explain python memory retention and manual reset by @aktanazat in https://github.com/can1357/oh-my-pi/pull/17353\n* fix(coding-agent): show Claude session sidecar titles in the import picker by @namest504 in https://github.com/can1357/oh-my-pi/pull/17361\n* fix(tui): let a registered renderer own the async-result card (supersedes #14484) by @AlexBrd999 in https://github.com/can1357/oh-my-pi/pull/17372\n* fix(acp): forward automatic compaction lifecycle notifications by @SAKANA-MOONLIGHT in https://github.com/can1357/oh-my-pi/pull/17384\n* fix(stt): stop slow previews from delaying dictation by @roboomp in https://github.com/can1357/oh-my-pi/pull/17414\n* fix(coding-agent): reuse the main turn's prompt cache in auto-learn capture turns by @STRML in https://github.com/can1357/oh-my-pi/pull/17418\n* fix(coding-agent): keep snapshot function dependencies, not just public wrappers by @KamijoToma in https://github.com/can1357/oh-my-pi/pull/17448\n* fix(ai): supported workforce ADC token refresh by @roboomp in https://github.com/can1357/oh-my-pi/pull/17449\n* fix(coding-agent): stop git rebase -i and GCM prompts from hanging bash commands by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/17452\n* fix(ai): kept usage-probe oauth refreshes from disabling credentials by @roboomp in https://github.com/can1357/oh-my-pi/pull/17469\n* fix(coding-agent): let snapcompact replace an archive it shrinks, and report its refusal once by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/17490\n* fix(bash): deny intercepted and invalid calls in BashTool.approval by @asuffield in https://github.com/can1357/oh-my-pi/pull/17502\n* fix(snapcompact,coding-agent): give models without image input a snapcompact archive's text instead of its frames by @will-bogusz in https://github.com/can1357/oh-my-pi/pull/17510\n* prompt: send historical-session questions to the seance agent by @iacore in https://github.com/can1357/oh-my-pi/pull/17523\n* feat(catalog): replay SambaNova reasoning content across turns by @rjuez00 in https://github.com/can1357/oh-my-pi/pull/17555\n* fix(coding-agent): walk retry fallback chain when the active provider has no credential by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/17559\n* fix(catalog): preserve discovered model token limits by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/17561\n* fix(web): exclude DuckDuckGo advertising redirects by @jasonharrison in https://github.com/can1357/oh-my-pi/pull/17564\n* fix(coding-agent): routed ctrl+r history picks to the focused ask prompt by @roboomp in https://github.com/can1357/oh-my-pi/pull/17567\n* fix(ai): send Ultrafast to OpenAI-compatible relays that advertise it by @jakehemmerle in https://github.com/can1357/oh-my-pi/pull/17577\n* fix(browser): opened own tab in fresh Chrome profiles by @roboomp in https://github.com/can1357/oh-my-pi/pull/17586\n* fix(browser): resumed predicate waits after document navigation by @roboomp in https://github.com/can1357/oh-my-pi/pull/17589\n* fix(coding-agent): resolved exact-case ids that collide by case by @roboomp in https://github.com/can1357/oh-my-pi/pull/17591\n* fix(task): kept early irc messages from waking workers before assignment by @roboomp in https://github.com/can1357/oh-my-pi/pull/17594\n* fix(coding-agent): announce a restarted eval kernel on its first cell by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17595\n* refactor(ai): share replay metadata sanitization by @briankeefe in https://github.com/can1357/oh-my-pi/pull/17597\n* tui: link the URL a read row names by @iacore in https://github.com/can1357/oh-my-pi/pull/17598\n* fix(session): guarded async delivery during manual compaction by @roboomp in https://github.com/can1357/oh-my-pi/pull/17601\n* fix(coding-agent): resume quota retries after system sleep by @zhiland in https://github.com/can1357/oh-my-pi/pull/17606\n* fix(browser): honored direct wait helper timeouts past the call budget by @roboomp in https://github.com/can1357/oh-my-pi/pull/17621\n* fix(scripts): decide the Rust gate from the branch's merge-base diff by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17628\n* fix(read): stopped suggesting selectors on selector-free read targets by @roboomp in https://github.com/can1357/oh-my-pi/pull/17633\n* fix(tui): recognized native Rex Kitty graphics by @roboomp in https://github.com/can1357/oh-my-pi/pull/17652\n* fix(shell): share open files across nesting levels and name the open-file limit when it runs out by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17668\n\n## New Contributors\n* @briankeefe made their first contribution in https://github.com/can1357/oh-my-pi/pull/17590\n* @tommyjtl made their first contribution in https://github.com/can1357/oh-my-pi/pull/17334\n* @namest504 made their first contribution in https://github.com/can1357/oh-my-pi/pull/17361\n* @AlexBrd999 made their first contribution in https://github.com/can1357/oh-my-pi/pull/17372\n* @jakehemmerle made their first contribution in https://github.com/can1357/oh-my-pi/pull/17577\n* @zhiland made their first contribution in https://github.com/can1357/oh-my-pi/pull/17606\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.14.2...v18.15.0","reactions":{"total_count":10,"+1":2,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":2,"rocket":1,"eyes":1},"mentions_count":20}
