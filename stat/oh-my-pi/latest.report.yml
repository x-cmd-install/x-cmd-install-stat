kwDOQxs0bc4g_A1V","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1077086,"digest":"sha256:104142244b8781b7828e64aa79a61b03fdf16e8a3464278647c3d84ad22cbce0","download_count":1,"created_at":"2026-09-09T19:05:37Z","updated_at":"2026-09-09T19:05:37Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Fixed\n\n- Codex SSE streams that end without a terminal completion event now retry when replay-safe and remain transient errors when partial output prevents replay ([#11349](https://github.com/can1357/oh-my-pi/issues/11349)).\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- `/rename` without a title now generates a session name from recent conversation using the configured tiny model.\n- Added opt-in experimental notes-backed context windows with persistent branch-local notes, searchable original session history, retained latest user requests, and a model-callable rollover tool, including in Code Mode.\n- `/loop` accepts `--until '<cmd>'` / `--while '<cmd>'` to gate each iteration on a shell command's exit status, so a loop can stop on real project state instead of only a count or duration. ([#10858](https://github.com/can1357/oh-my-pi/pull/10858) by [@andyhite](https://github.com/andyhite))\n\n### Fixed\n\n- Read error and preview rendering now sanitizes tabs and Windows-style CRLF (e.g. ssh host-key failures, tab-indented fetched content) so raw output can no longer tear the result frame.\n- Unset `tiny` model roles now honor the configured `@smol` fallback in direct execution and the `/models` Roles view ([#11311](https://github.com/can1357/oh-my-pi/issues/11311)).\n- Extension Control Center (`/extensions`) search now accepts `j` and `k`, so extensions like `jira`/`json` are searchable; bare `j`/`k` no longer move the list selection (use arrow keys or the configured `tui.select.up`/`down`) ([#11350](https://github.com/can1357/oh-my-pi/issues/11350)).\n- Codex turns interrupted before terminal completion now auto-continue after resolved tool calls instead of stopping ([#11349](https://github.com/can1357/oh-my-pi/issues/11349)).\n- Fixed the status line's `pi` brand/working segment double-padding the first separator, so every gap around a separator is a single space ([#11103](https://github.com/can1357/oh-my-pi/issues/11103)).\n- `/handoff` no longer leaves the TUI in a running state when completion races with delayed session events ([#11263](https://github.com/can1357/oh-my-pi/issues/11263)).\n- Fixed legacy Pi extensions failing to load when calling `ctx.isProjectTrusted()` in an event handler; the extension context now exposes it (always `true`, since OMP applies no project-trust gating) ([#7955](https://github.com/can1357/oh-my-pi/issues/7955)).\n- Fixed Ctrl+Z jobs exiting successfully after `fg` instead of restarting the TUI because terminal teardown left Bun without a referenced event-loop handle while waiting for `SIGCONT` ([#8585](https://github.com/can1357/oh-my-pi/issues/8585)).\n- Extensions loaded by the npm CLI now apply settings overrides to the active session, so generated agents and model choices remain isolated between sessions ([#11047](https://github.com/can1357/oh-my-pi/pull/11047) by [@mgpai22](https://github.com/mgpai22)).\n- Live task dispatch now reloads added, changed, removed, and deleted project task and retry settings before resolving subagents ([#11191](https://github.com/can1357/oh-my-pi/issues/11191)).\n- Reset `/loop` iterations combined with `--while` / `--until` no longer keep submitting without resetting when vibe mode is enabled while the condition command is still running; the loop now disables itself instead ([#10858](https://github.com/can1357/oh-my-pi/pull/10858)).\n\n## @oh-my-pi/pi-utils\n\n### Fixed\n\n- Fixed `$which` capturing `Bun.which` at import on Linux and Windows, so `Bun.which` stubs installed later (e.g. per-test spies) are honoured and PATH-only language servers no longer leak into test results.\n\n\n## What's Changed\n* feat(coding-agent): add experimental notes-backed context windows by @wolfiesch in https://github.com/can1357/oh-my-pi/pull/10893\n* fix(coding-agent): sanitize tabs and CR in read error rendering by @H4vC in https://github.com/can1357/oh-my-pi/pull/11305\n* TUI: single delta marker for turn elapsed time in usage rows by @JamieJ5926 in https://github.com/can1357/oh-my-pi/pull/11332\n* fix(agent): retry truncated Codex streams by @roboomp in https://github.com/can1357/oh-my-pi/pull/11356\n* fix(tui): let /extensions search accept j and k by @roboomp in https://github.com/can1357/oh-my-pi/pull/11352\n* fix(coding-agent): honor configured smol fallback for tiny by @roboomp in https://github.com/can1357/oh-my-pi/pull/11312\n* fix(tui): clear stale loader after handoff completion by @roboomp in https://github.com/can1357/oh-my-pi/pull/11264\n* fix(auth): refresh desktop database for native zcode:// oauth by @roboomp in https://github.com/can1357/oh-my-pi/pull/11287\n* fix(update): validate foreign symlink targets by @roboomp in https://github.com/can1357/oh-my-pi/pull/11155\n* fix(compaction): rearm idle timer after setting changes by @roboomp in https://github.com/can1357/oh-my-pi/pull/10244\n* feat(coding-agent): gate /loop iterations on a shell condition  by @andyhite in https://github.com/can1357/oh-my-pi/pull/10858\n* fix(tests): dispose status lines before settings teardown by @roboomp in https://github.com/can1357/oh-my-pi/pull/11098\n* fix(commit): route agentic pipeline through commit model by @roboomp in https://github.com/can1357/oh-my-pi/pull/10993\n* fix(eval): return immediate thenable handles from JS completion/agent by @roboomp in https://github.com/can1357/oh-my-pi/pull/10992\n* fix(plan-mode): inline approved plan content by @roboomp in https://github.com/can1357/oh-my-pi/pull/10926\n* docs: fix README hashline package link to deleted directory by @roboomp in https://github.com/can1357/oh-my-pi/pull/10885\n* fix(coding-agent): recheck vibe guard after loop condition gate by @H4vC in https://github.com/can1357/oh-my-pi/pull/11367\n* fix(coding-agent): break tiny/smol fallback cycle on default alias by @H4vC in https://github.com/can1357/oh-my-pi/pull/11363\n* fix(settings): refresh project cache before reload by @roboomp in https://github.com/can1357/oh-my-pi/pull/11198\n* fix(coding-agent): discover --plugin-dir agents without claude opt-in by @roboomp in https://github.com/can1357/oh-my-pi/pull/11153\n* fix(tui): drop trailing pad from pi status segment by @roboomp in https://github.com/can1357/oh-my-pi/pull/11105\n* fix(coding-agent): preserve npm extension session settings by @roboomp in https://github.com/can1357/oh-my-pi/pull/11051\n* fix(coding-agent): restore getSupportedThinkingLevels in legacy pi-ai shim by @roboomp in https://github.com/can1357/oh-my-pi/pull/10801\n* fix(task): ignore Claude marketplace model aliases by @roboomp in https://github.com/can1357/oh-my-pi/pull/7967\n* fix(coding-agent): keep suspended sessions alive for fg by @roboomp in https://github.com/can1357/oh-my-pi/pull/8629\n* feat(catalog): update Fire Pass models to glm-5.2-fast and kimi-k3-fast by @olegpulatov in https://github.com/can1357/oh-my-pi/pull/10859\n* feat(coding-agent): generate a title when /rename has no arguments by @gitpushoriginmaster in https://github.com/can1357/oh-my-pi/pull/11084\n* fix(extensions): expose ctx.isProjectTrusted for legacy pi extensions by @roboomp in https://github.com/can1357/oh-my-pi/pull/7958\n* test(ai): gate the ::1 callback bind assertion on the host's IPv6 loopback by @PeterPonyu in https://github.com/can1357/oh-my-pi/pull/11385\n* fix(utils): resolve Bun.which per call in whichFresh by @PeterPonyu in https://github.com/can1357/oh-my-pi/pull/11386\n* test(coding-agent): make the project-venv setup test hermetic to an activated env by @PeterPonyu in https://github.com/can1357/oh-my-pi/pull/11387\n* fix(coding-agent): guard reset loops against in-flight vibe activation by @H4vC in https://github.com/can1357/oh-my-pi/pull/11368\n* docs: point AGENTS.md VCS helpers at natives/vcs by @PeterPonyu in https://github.com/can1357/oh-my-pi/pull/11396\n* fix(coding-agent): complete title signal stub in working-accent harness by @H4vC in https://github.com/can1357/oh-my-pi/pull/11398\n\n## New Contributors\n* @gitpushoriginmaster made their first contribution in https://github.com/can1357/oh-my-pi/pull/11084\n* @PeterPonyu made their first contribution in https://github.com/can1357/oh-my-pi/pull/11385\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.1.15...v18.1.16","mentions_count":8}
