4","download_count":459,"created_at":"2026-10-07T07:05:47Z","updated_at":"2026-10-07T07:05:49Z"},{"id":617883243,"node_id":"RA_kwDOGxaghM4k1CZr","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":380156016,"digest":"sha256:ec6b8cab0a988a58414bb67c8efb473fc4a005c9ef8bceccdda1f968edebcfee","download_count":3336,"created_at":"2026-10-07T07:05:47Z","updated_at":"2026-10-07T07:06:00Z"},{"id":617883242,"node_id":"RA_kwDOGxaghM4k1CZq","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:4c6cc4c50e21dce78f3e676e8d97f1166453516094dc7cb2ee751a8520b7e05d","download_count":15,"created_at":"2026-10-07T07:05:47Z","updated_at":"2026-10-07T07:05:47Z"},{"id":617883262,"node_id":"RA_kwDOGxaghM4k1CZ-","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":146925779,"digest":"sha256:00b75199531d9507a4f55638c8924807ae273d1aba67360fd97904d751a1bb90","download_count":858,"created_at":"2026-10-07T07:05:47Z","updated_at":"2026-10-07T07:05:53Z"}],"body":"\n\n### Added\n\n- Added `mirrord preview diff` to compare manifest files with the live cluster.\n- Added `mirrord preview start --resource` to build previews from your manifest\n  files.\n- Experimental Windows support: the layer is injected with stork and installs\n  its\n  hooks before a launched program reaches its entry point. The injection method\n  can be chosen with `MIRRORD_INJECTION_METHOD` (`load-library`, `apc` or\n  `iat`).\n  `mirrord attach` reports why the layer failed to initialize instead of\n  waiting\n  out a timeout, the layer log file records `info` events without\n  `MIRRORD_LOG`,\n  and crash reports explain fast-fail and heap-corruption exits.\n\n\n### Fixed\n\n- An unreachable `mirrord-console` no longer aborts the target: the layer\n  reports it\n  on stderr and logs to its usual file and stderr sinks instead. On Windows,\n  console\n  logging works again, and a console that stops responding is reported once\n  instead of stalling the process.\n- Fixed the internal proxy ending the whole session when accepting a new layer\n  connection failed transiently, for example when a process exited while its\n  connection was still waiting to be accepted.\n- The `feature` and `feature.env` config examples in the docs no longer set\n  both `include` and `exclude`. mirrord does not allow them together, so\n  `mirrord verify-config` rejected these examples.\n- The complete config example in the docs is now a valid config. It had the\n  removed `connect_tcp` field, a trailing comma, and both `include` and\n  `exclude` in `feature.env`, so `mirrord verify-config` rejected it.\n- `mirrord operator install` refuses to install an operator older than 3.197.0.\n\n"}
