wnload_count":51,"created_at":"2026-10-28T23:28:24Z","updated_at":"2026-10-28T23:28:27Z"},{"id":686687448,"node_id":"RA_kwDOGxaghM4o7gTY","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":397563776,"digest":"sha256:15925dde7f56d3954f024c4abb3a728401052e13687fb922bde0d323269c8b85","download_count":59,"created_at":"2026-10-28T23:28:24Z","updated_at":"2026-10-28T23:28:39Z"},{"id":686687433,"node_id":"RA_kwDOGxaghM4o7gTJ","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:734cfd64d1fe42ae27ec403e4c1de2cc072e6b12e3a80ba65a9c4ee830a71f73","download_count":8,"created_at":"2026-10-28T23:28:24Z","updated_at":"2026-10-28T23:28:24Z"},{"id":686687440,"node_id":"RA_kwDOGxaghM4o7gTQ","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":155720595,"digest":"sha256:a31456c6ec39077d0064470ba7a5ad3774352367600462bbe7e197bfcabb7695","download_count":89,"created_at":"2026-10-28T23:28:24Z","updated_at":"2026-10-28T23:28:30Z"}],"body":"\n\n### Added\n\n- Paid-feature errors identify the configuration key and required plan, with\n  billing guidance for cluster administrators.\n  Local paid-feature refusals are reported to operators that support\n  license-gate reporting.\n\n\n### Changed\n\n- Added sanitization to the `JDK_JAVA_OPTIONS` environment variable by removing\n  `javaagent` options.\n  This fixes some cases of injected variables pointing to non-existent files\n  and causing errors.\n  Malformed values (those with unmatched quotes) are left unchanged.\n  Set `feature.magic.java_agents` to `false` to keep the remote value\n  unchanged.\n\n\n### Fixed\n\n- Added `agent.http2_max_header_list_size` to configure the agent's HTTP/2\n  header size limit.\n- Fix the permissions of the local placeholder file created for remote files\n  when `experimental.use_dev_null` is `false`.\n- `mirrord up` no longer stops showing a service's output, and reports the\n  service as crashed, when the service prints text that isn't UTF-8, such as a\n  Windows console code page's `£`.\n- `mirrord up` now returns a helpful error when trying to use a label selector\n  target.\n\n"}
