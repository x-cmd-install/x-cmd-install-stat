load_count":101,"created_at":"2026-09-29T19:30:52Z","updated_at":"2026-09-29T19:30:54Z"},{"id":599039542,"node_id":"RA_kwDOGxaghM4jtJ42","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":357907968,"digest":"sha256:159142ac66c10d00a15236438ca0a646218feff8159da19fafc30b93139714f0","download_count":686,"created_at":"2026-09-29T19:30:52Z","updated_at":"2026-09-29T19:31:05Z"},{"id":599039532,"node_id":"RA_kwDOGxaghM4jtJ4s","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:926a816d73c13654ed94cac5c20e66ba35c03254c284bc9414d18ff6d39774de","download_count":4,"created_at":"2026-09-29T19:30:52Z","updated_at":"2026-09-29T19:30:52Z"},{"id":599039547,"node_id":"RA_kwDOGxaghM4jtJ47","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":139832882,"digest":"sha256:b161e52267513e656f2e26fd7c6346badd446f000ff395e714ed1830314c7b97","download_count":160,"created_at":"2026-09-29T19:30:52Z","updated_at":"2026-09-29T19:30:58Z"}],"body":"\n\n### Added\n\n- Added a JSON schema, `mirrord-up-schema.json`, for `mirrord-up.yaml`.\n- Preview environments accept a label target covering several workloads.\n\n\n### Changed\n\n- `mirrord up` replace mode no longer automatically adds queue splitting\n  config.\n\n\n### Fixed\n\n- Fixed remote `stat`-family calls in the agent: `fstatat` relative to a\n  directory fd looked up a path with the target root prefixed twice, and in\n  targetless mode paths were resolved relative to the agent's working directory\n  instead of `/`.\n- The internal proxy terminates registered mirrord-injected processes during\n  shutdown, including processes outside the launched application's process\n  group.\n- `mirrord ci stop` lets the internal proxy terminate registered injected\n  processes and retains failed cleanup targets for a later retry.\n- `mirrord ci stop` terminates background application process groups so child\n  processes started by wrappers do not keep running.\n\n"}
