"download_count":209,"created_at":"2026-10-05T18:53:14Z","updated_at":"2026-10-05T18:53:16Z"},{"id":613404664,"node_id":"RA_kwDOGxaghM4kj8_4","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":378413872,"digest":"sha256:617c202896deb1f6086b0d0a003ed12b37256cc6e288b6cbf92d04a372237edc","download_count":1757,"created_at":"2026-10-05T18:53:14Z","updated_at":"2026-10-05T18:53:28Z"},{"id":613404646,"node_id":"RA_kwDOGxaghM4kj8_m","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:bf4e8dca82a800926d668976d9d34393df5f29b776803355dfba6850e7f2854d","download_count":8,"created_at":"2026-10-05T18:53:14Z","updated_at":"2026-10-05T18:53:14Z"},{"id":613404651,"node_id":"RA_kwDOGxaghM4kj8_r","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":146318235,"digest":"sha256:9044db17289367f1015efd9a3815674d26b4bcfdc54a8b3bb67d62f3ca75e17e","download_count":507,"created_at":"2026-10-05T18:53:14Z","updated_at":"2026-10-05T18:53:20Z"}],"body":"\n\n### Added\n\n- Added `feature.network.incoming.tls_delivery.client_cert_source`. With\n  `\"target\"`, a preview session presents the client certificate already inside\n  the target's container (at the `client_cert` and `client_key` paths), read by\n  the operator from a running pod, so mutual TLS previews no longer need the\n  certificate copied to the developer's machine.\n- Added `mirrord operator uninstall`, which removes the operator that `mirrord\n  operator install` installed, also when the installation failed half-way. Like\n  `mirrord operator install`, it does not require the helm CLI, takes\n  `--context`, and on a terminal asks for confirmation first.\n- `mirrord operator install` and `mirrord operator uninstall` send one\n  anonymous usage event for each run, with its outcome. See `TELEMETRY.md` for\n  what the events contain and how to disable them.\n- `mirrord operator install` takes `--context` to install into a different\n  Kubernetes context. On a terminal, it asks for confirmation before it starts\n  a trial or changes the cluster, and `--yes` skips the question.\n\n\n### Fixed\n\n- Fixed `posix_spawn` children missing shared socket configuration after an\n  earlier child on the same thread executed.\n\n"}
