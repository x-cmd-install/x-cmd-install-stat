"download_count":1289,"created_at":"2026-09-20T07:15:17Z","updated_at":"2026-09-20T07:15:18Z"},{"id":576332666,"node_id":"RA_kwDOGxaghM4iWiN6","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":351520304,"digest":"sha256:009a8ac8894004d2982b75d4a4b7bcb28ba13a8955d0b6c2776eab3c2a39ea7c","download_count":5544,"created_at":"2026-09-20T07:15:17Z","updated_at":"2026-09-20T07:15:30Z"},{"id":576332657,"node_id":"RA_kwDOGxaghM4iWiNx","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:92a30373e8322c2e47620df74a05a99d11cd4c83727fe958b42a33c8bdbb1afa","download_count":7,"created_at":"2026-09-20T07:15:16Z","updated_at":"2026-09-20T07:15:17Z"},{"id":576332659,"node_id":"RA_kwDOGxaghM4iWiNz","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":137513283,"digest":"sha256:03f81f3c8541458b9a968525b4b3ef69c77f7c25b873bbf164c58366aa386816","download_count":1767,"created_at":"2026-09-20T07:15:17Z","updated_at":"2026-09-20T07:15:21Z"}],"body":"\n\n### Added\n\n- Added `--unmatched` and `--session-key-field` to `mirrord subscribe`,\n  reporting queue messages no filter took and naming the session each event\n  belongs to.\n- Added an Events tab to `mirrord ui`, listing the HTTP and queue messages the\n  operator intercepted across every cluster session.\n\n\n### Fixed\n\n- Fixed `mirrord subscribe` and `mirrord ui` ignoring the configured `baggage`,\n  so neither could reach an operator you are running yourself.\n- Fixed `mirrord ui` hanging indefinitely when the selected kube context's\n  credentials have expired, instead of reporting it as unreachable.\n- Fixed node-local UDP routing through the operator by preserving the target\n  pod's HostIP metadata when resolving its runtime state.\n- Fixed unix stream socket pathname truncation when clients like PHP report\n  `addrlen` without the trailing NUL, allowing the complete path to reach\n  outgoing matching and forwarding.\n- HTTPS stealing works when the original client sends no SNI and the\n  certificate names a host: set `serverName` in the TLS steal config.\n\n"}
