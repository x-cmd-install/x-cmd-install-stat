ownload_count":106,"created_at":"2026-10-30T18:12:04Z","updated_at":"2026-10-30T18:12:06Z"},{"id":692979129,"node_id":"RA_kwDOGxaghM4pTgW5","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":398338304,"digest":"sha256:82fb552356642194f21dd8f6febddd7f974c655c54671c52bd495dc31281546b","download_count":401,"created_at":"2026-10-30T18:12:04Z","updated_at":"2026-10-30T18:12:20Z"},{"id":692979125,"node_id":"RA_kwDOGxaghM4pTgW1","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:0fce92f41ad48c224e5fa989806cf1ea4d760ff6a90969433f11cbad170c04b5","download_count":2,"created_at":"2026-10-30T18:12:04Z","updated_at":"2026-10-30T18:12:04Z"},{"id":692979126,"node_id":"RA_kwDOGxaghM4pTgW2","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":155892689,"digest":"sha256:d0af5943957300f200b9d99d68cda977628fcb74ff98d0b44344f3cca85af837","download_count":159,"created_at":"2026-10-30T18:12:04Z","updated_at":"2026-10-30T18:12:10Z"}],"body":"\n\n### Added\n\n- Experimental: `mirrord up --debug <service>` holds that service's program\n  before its own code runs, until an IDE attaches its debugger and releases it.\n  It's hidden from help on every platform, and may still change.\n- New `mirrord up list` prints every service in an up file as `mirrord up`\n  would run it: its target, mode, command and folder, without touching the\n  cluster. `--format json` prints the same for scripts and IDE extensions.\n\n\n### Changed\n\n- `mirrord up` shows in `mirrord --help` and shell completions on Windows.\n\n\n### Fixed\n\n- Calls that describe a folder above the working directory, such as `stat` and\n  `access`, now stay local by default on Linux and macOS, so resolving a local\n  path no longer fails when the target doesn't have those folders.\n- Honor workload selector expressions when selecting target pods, including\n  workloads with expression-only selectors.\n- mirrord no longer waits for many minutes, printing nothing, when the cluster\n  answers 503 for the mirrord operator. `startup_retry` alone now decides how\n  often those requests are retried.\n\n"}
