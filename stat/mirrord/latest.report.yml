nload_count":67,"created_at":"2026-10-13T18:09:07Z","updated_at":"2026-10-13T18:09:09Z"},{"id":637847422,"node_id":"RA_kwDOGxaghM4mBMd-","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":386186208,"digest":"sha256:6510d757c85cfb3e43026449233be0e43c476265fa657c79eb604d221737b9b7","download_count":273,"created_at":"2026-10-13T18:09:07Z","updated_at":"2026-10-13T18:09:23Z"},{"id":637847407,"node_id":"RA_kwDOGxaghM4mBMdv","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:61ec4f545fbaf10f4bd3889df4f2f34eb871b95b5da42792c5f17d2ab2d5dcbe","download_count":4,"created_at":"2026-10-13T18:09:06Z","updated_at":"2026-10-13T18:09:07Z"},{"id":637847414,"node_id":"RA_kwDOGxaghM4mBMd2","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":149718721,"digest":"sha256:1e13cc79abf367d7cfe4e4bbb8ec9b7fd148b698bd59069fbe75eea8e8b3c8dc","download_count":150,"created_at":"2026-10-13T18:09:06Z","updated_at":"2026-10-13T18:09:14Z"}],"body":"\n\n### Added\n\n- Added the `get_skill` tool to `mirrord mcp`, and served every vendored skill\n  as an MCP prompt and a `mirrord://skills/<name>` resource.\n- Added the `search_docs` and `read_doc` tools to `mirrord mcp`, for keyword\n  search and reading of the docs, skills, and config options shipped with\n  mirrord, and served every docs page as a `mirrord://docs/<path>` resource.\n- `mirrord subscribe` streams every session without a key and names each\n  event's cluster.\n\n\n### Fixed\n\n- Include Kubernetes type and object metadata when submitting literal database\n  branch credentials, allowing Kubernetes access proxies to decode the request.\n- Preview `secret_mounts` and `db_branches` from a `MirrordSplitConfig` work\n  for users bound to `mirrord-operator-user` by a `RoleBinding`.\n- The `TMPDIR`, `TMP` and `TEMP` environment variables of the target are now\n  not copied to the local process by default, because their directory often\n  does not exist on the local machine. For example, `yarn run` failed with\n  `ENOENT: no such file or directory, lstat` on the remote temporary directory.\n- Users bound to `mirrord-operator-user` by a `RoleBinding` can use literal\n  `db_branches` connection values.\n\n"}
