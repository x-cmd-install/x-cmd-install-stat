,"download_count":261,"created_at":"2026-10-19T18:25:54Z","updated_at":"2026-10-19T18:25:57Z"},{"id":657071394,"node_id":"RA_kwDOGxaghM4nKh0i","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":391185504,"digest":"sha256:dc2ebe710f430b362c3f448fa40864de4b81bfd07aaa74c2e4041522c0ab4515","download_count":2640,"created_at":"2026-10-19T18:25:54Z","updated_at":"2026-10-19T18:26:20Z"},{"id":657071376,"node_id":"RA_kwDOGxaghM4nKh0Q","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:52f55030e98befaaa62ca4317d6b822fc654366c16c75e4d320af321e37194f7","download_count":7,"created_at":"2026-10-19T18:25:54Z","updated_at":"2026-10-19T18:25:54Z"},{"id":657071390,"node_id":"RA_kwDOGxaghM4nKh0e","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":153288232,"digest":"sha256:7c19cda8ff7518a285ed2be5148b97d100a680115a53d940af9acbc3804cc845","download_count":490,"created_at":"2026-10-19T18:25:54Z","updated_at":"2026-10-19T18:26:01Z"}],"body":"\n\n### Added\n\n- Add `namespace` to run DB branches in a namespace per key\n\n\n### Changed\n\n- Renamed the \"License key\" label in the mirrord UI session details to \"Session\n  key\".\n\n\n### Fixed\n\n- Fix Go programs on Linux arm64 receiving syscall results truncated to 32\n  bits, which crashed them when the result was a pointer such as an `mmap`\n  address. [#5092](https://github.com/metalbear-co/mirrord/issues/5092)\n- Avoid reporting an incorrect namespace in database branch warnings when the\n  operator uses a custom namespace pattern.\n- Fix `mirrord exec` on Windows not printing `Ready!` when the layer is\n  injected with `apc` or `iat`, so `mirrord up` never saw those services become\n  ready.\n- Fix `mirrord up` on Windows printing the \"no `run.directory` set\" notice when\n  run from the folder that holds `mirrord-up.yaml`.\n- Fix `mirrord up` on Windows sometimes hanging, even through Ctrl-C, after a\n  service exited or crashed on its own.\n\n"}
