ownload_count":212,"created_at":"2026-10-22T22:13:21Z","updated_at":"2026-10-22T22:13:23Z"},{"id":667235557,"node_id":"RA_kwDOGxaghM4nxTTl","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":394665120,"digest":"sha256:aa9a9937ace274e427dfb9afeeb519413f88c73dee069a0e56dd16f62493af90","download_count":204,"created_at":"2026-10-22T22:13:21Z","updated_at":"2026-10-22T22:13:39Z"},{"id":667235546,"node_id":"RA_kwDOGxaghM4nxTTa","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:46f3d0aa3237a479c3797c6aa6d242f31f5b5280876f584e6090a98025963dae","download_count":17,"created_at":"2026-10-22T22:13:21Z","updated_at":"2026-10-22T22:13:21Z"},{"id":667235545,"node_id":"RA_kwDOGxaghM4nxTTZ","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":154389822,"digest":"sha256:f4d27dc57c25c4c6326ba5abcfb4e7d41b05eee1d14c76340447f1976ad67ada","download_count":440,"created_at":"2026-10-22T22:13:21Z","updated_at":"2026-10-22T22:13:27Z"}],"body":"\n\n### Added\n\n- A `kube_context` set in the global `~/.mirrord/mirrord.json` (`mirrord config\n  set kube_context <context>`) is used when a command has no context of its\n  own, including `mirrord up`, `mirrord tui` and the `mirrord operator`\n  commands, and `mirrord ui` opens on it.\n- Install script verifies downloads and takes an install directory.\n- Read DB branch connection values from AWS SSM Parameter Store with\n  `aws_ssm_parameter`.\n\n\n### Changed\n\n- Point at the Helm value to enable when an operator feature is switched off in\n  the chart, instead of suggesting an upgrade.\n\n\n### Fixed\n\n- DB branches name the right database when the source URL is a literal `value`.\n- Fixed concurrency issues in the layer<->intproxy connection handler,\n  improving performance of multi-threaded applications.\n- Joining a session through the browser extension from `mirrord ui` sends the\n  session's kube context, so the extension finds the session's HTTP filter when\n  it runs outside the current context.\n\n"}
