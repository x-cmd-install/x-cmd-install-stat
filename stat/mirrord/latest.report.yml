","download_count":111,"created_at":"2026-11-24T19:00:12Z","updated_at":"2026-11-24T19:00:14Z"},{"id":788461057,"node_id":"RA_kwDOGxaghM4u_vYB","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":408297872,"digest":"sha256:6fa201eefb7749838ac0736ac698a7a1649d52e0e8f9e60479e4dd889063392b","download_count":911,"created_at":"2026-11-24T19:00:12Z","updated_at":"2026-11-24T19:00:30Z"},{"id":788461053,"node_id":"RA_kwDOGxaghM4u_vX9","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:4bef8def8510aa7be6320197085fa9f1e8997e5ffbe031835d1a4cf632a25e4a","download_count":7,"created_at":"2026-11-24T19:00:12Z","updated_at":"2026-11-24T19:00:12Z"},{"id":788461064,"node_id":"RA_kwDOGxaghM4u_vYI","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":162283909,"digest":"sha256:e92da1d4f59f32f22c3b3d3b39afec497a4535cd85b150ef21febdafc6342036","download_count":201,"created_at":"2026-11-24T19:00:12Z","updated_at":"2026-11-24T19:00:20Z"}],"body":"\n\n### Security\n\n- User-supplied jq filters can no longer call `env`, `halt`, or `halt_error`. A\n  filter that calls one of these now fails with an `Undefined filter` error.\n\n\n### Fixed\n\n- Outgoing unix socket connections now reach sockets whose path in the target\n  is too long for a socket address. In ephemeral mode, their paths now resolve\n  in the target container's filesystem rather than the agent's. The\n  `trustRoots` directories of a TLS steal config now load certificates that are\n  absolute symlinks in the target, as most of `/etc/ssl/certs` is. The agent's\n  DNS resolution now reads the target's `/etc/resolv.conf` and `/etc/hosts`\n  when they're absolute symlinks, instead of the agent's files. Remote file\n  operations relative to an open directory, with a path that leaves it such as\n  `../file`, now resolve from where the directory is after it's renamed, rather\n  than from its old path.\n- The agent now resolves the paths of remote file operations and outgoing unix\n  socket connections strictly inside the target container's filesystem. Remote\n  file operations no longer follow the magic links of `/proc` in any mode,\n  including targetless, so reading a path such as `/proc/self/exe` or\n  `/dev/stdin` remotely fails. A remote read now returns at most 1 MiB at a\n  time, and a `feature.fs.readonly_file_buffer` larger than 1 MiB buffers only\n  1 MiB.\n\n"}
