wnload_count":253,"created_at":"2026-09-24T09:35:24Z","updated_at":"2026-09-24T09:35:26Z"},{"id":585617283,"node_id":"RA_kwDOGxaghM4i58-D","name":"mirrord_mac_universal","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":355791056,"digest":"sha256:f6536c7a6cde15f2cd965c4bd8d7818cd5b036700a67223ebc56735761282771","download_count":1876,"created_at":"2026-09-24T09:35:24Z","updated_at":"2026-09-24T09:35:38Z"},{"id":585617266,"node_id":"RA_kwDOGxaghM4i589y","name":"mirrord_mac_universal.shasum256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:1ea206928b2a8c50c926014d768282fc5b7250aafc3450f049b73d0b6e6c1c24","download_count":4,"created_at":"2026-09-24T09:35:24Z","updated_at":"2026-09-24T09:35:24Z"},{"id":585617277,"node_id":"RA_kwDOGxaghM4i5899","name":"mirrord_mac_universal.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":138978650,"digest":"sha256:112d4a394c8ff8bb450736e3888a8ce7e0555bcc6550b444476fa0e0013be445","download_count":436,"created_at":"2026-09-24T09:35:24Z","updated_at":"2026-09-24T09:35:29Z"}],"body":"\n\n### Added\n\n- The mirrord UI now shows how many incoming traffic deliveries each active\n  port subscription receives.\n- mirrord now warns when a database branch's image runs a different server\n  version than the source database, naming both versions.\n\n\n### Changed\n\n- Messages that say a run needs the operator, and `mirrord session list`, tell\n  AI coding agents they can install the operator themselves, pointing at\n  `https://metalbear.com/agents.md`.\n- The `guard_std_fds` experimental config is now deprecated and enabled for all\n  users by default.\n- `mirrord up` now starts `mirrord ui` in the background by default.\n\n\n### Fixed\n\n- Fixed a deadlock when a process with an active gRPC channel forks.\n- The mirrord UI now distinguishes a missing operator from lost Kubernetes\n  access, shows the Kubernetes error with re-authentication guidance, and\n  retries with refreshed credentials.\n- `mirrord up` now gracefully stops all managed services when interrupted,\n  instead of reporting user-ended sessions as failures or leaving child\n  processes running.\n\n"}
