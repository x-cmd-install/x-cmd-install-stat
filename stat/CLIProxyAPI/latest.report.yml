ount":39,"created_at":"2026-11-25T14:04:25Z","updated_at":"2026-11-25T14:04:27Z"},{"id":791796834,"node_id":"RA_kwDOPFM7E84vMdxi","name":"CLIProxyAPI_8.1.4_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":27178808,"digest":"sha256:d36d5304eded3884cd0c4168c41a7638a3234631a64a54644069b963ae287cea","download_count":2418,"created_at":"2026-11-25T14:04:27Z","updated_at":"2026-11-25T14:04:28Z"},{"id":791795855,"node_id":"RA_kwDOPFM7E84vMdiP","name":"CLIProxyAPI_8.1.4_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":27037116,"digest":"sha256:6c03da0e408f63ed7190f4b9f6bd1011b034e9d7601ea07adc1701c5f4e1b2f9","download_count":153,"created_at":"2026-11-25T14:04:08Z","updated_at":"2026-11-25T14:04:11Z"},{"id":791805202,"node_id":"RA_kwDOPFM7E84vMf0S","name":"CLIProxyAPI_8.1.4_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24486419,"digest":"sha256:7fe1c3259c88e9bd0b4a7dfdad67105a1dc43ddca0896ce94c7d648ec1364713","download_count":45,"created_at":"2026-11-25T14:06:43Z","updated_at":"2026-11-25T14:06:45Z"},{"id":791799666,"node_id":"RA_kwDOPFM7E84vMedy","name":"CLIProxyAPI_8.1.4_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27474728,"digest":"sha256:665b670d42a5ceeadd33a6f03dffaa362cde920b726ab6b117c4def94ff81b09","download_count":1308,"created_at":"2026-11-25T14:05:16Z","updated_at":"2026-11-25T14:05:17Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(devin): add new model entries to the registry (e6eee6b6)\n- fix(registry): remove obsolete GPT-6.1 Terra model entry (5b857ecc)\n- fix(antigravity): update Hub fallback and changelist map to 2.35.1 (2d50f315)\n- fix(thinking): detach extracted usage effort labels from JSON buffers (8ba2b683)\n- Fix cross-platform tests and Git worktree handling (bc74887a)\n- Merge pull request #8067 from router-for-me/test (7aa827fd)\n- feat(home): delegate Home dispatch to plugin executors (ad2edae0)\n- fix(home): report antigravity project discovery failures (27e7618d)\n- fix(pluginhost): gate home executor dispatch on lifecycle state (4c8df6d7)\n- Merge pull request #8119 from router-for-me/home (b47cd8e8)\n- fix(codex): track streamed message text deltas per output item in Chat Completions translator (7ec25aaa)\n- fix(translator): preserve first-chunk OpenAI payload alongside delta.role in Gemini stream (f1193155)\n- fix(translator): preserve non-empty message content alongside tool calls in Interactions non-stream response (b35143f5)\n- fix(translator): omit premature finishReason on Claude tool_use block stop for Gemini streams (5ec384c6)\n- fix(translator): close active block before thinking or text transitions in Antigravity Claude stream (28d175c4)\n- fix(translator): construct interactions snake/camel JSON key conversions bottom-up (15ce5470)\n- fix(executor): fix Vertex Imagen panic, Meta response.done, and Antigravity tests (db276e8b)\n- fix(translator): ignore null usage on empty-choices chunks in OpenAI to Gemini responses (32a42455)\n- fix(translator): omit premature finishReason and validate functionCall args in Codex to Gemini responses (60035f91)\n- fix(translator): validate OpenAI tool call arguments before setting Gemini functionCall.args (f7137853)\n- fix(translator): preserve signature on thinking and tool_use blocks in Claude to Interactions requests (4a7f6142)\n- fix(translator): preserve thought summary and thoughtSignature in Gemini Interactions translation (8a7195b6)\n- fix(translator): validate Antigravity Claude reasoning signatures per part (e1c37c02)\n- fix(translator): resolve shortMap tool_choice, snake_case fields, args, and null thinkingBudget (aa1389a3)\n- fix(translator): ensure Interactions functionCall args are valid JSON objects (2dc57b5e)\n- fix(config): support request-scoped-errors for vertex-api-key (30a7c3bd)\n- fix(translator): flush signed thinking blocks before appending subsequent thought parts (1b5196ae)\n- fix(translator): preserve thought signatures, usage, and SSE frames in Interactions to Claude responses (c29742df)\n- fix(translator): guard null finishReason and non-object tool args in Gemini OpenAI responses (f5524379)\n- fix(translator): handle Antigravity Interactions streaming media, function call IDs, and args (6db5e941)\n- fix(translator): map interactions finish reasons and include thought tokens in Gemini totalTokenCount (10489887)\n- fix(antigravity): emit empty delta for parameterless tools and trim whitespace object args (36c17654)\n- fix(antigravity): skip empty parts and validate base64 inlineData in Claude requests (4771e69c)\n- fix(antigravity): validate OpenAI tool call arguments as JSON objects (c975104f)\n- fix(gemini): merge streaming continuation tool args and suppress empty input deltas (af624626)\n- fix(gemini): allow null tool_choice for Responses web search (3b1387ad)\n- fix(gemini): normalize null tool arguments and request echoes in responses translator (aa9eaeb3)\n- fix(translator): guard null Gemini generation fields and support snake_case in Claude requests (0c668192)\n- fix(openai): guard null gemini generation config, non-object args, and snake_case fields (dbd6729b)\n- fix(antigravity): preserve thought_signature canonicalization and snake_case paths in gemini translator (37f003c5)\n- fix(gemini): guard optional fields and object tool search arguments in responses translator (a66e0105)\n- fix(translator): guard null fields, tool_choice none, and thinking overrides in Claude to Interactions requests (15dd5c99)\n- fix(translator): handle null tool_choice, object tool_choice, and stop sequences for openai->antigravity/gemini (c8419674)\n- fix(translator): normalize interactions system_instruction and clear conflicting antigravity thinking fields (b6ef56df)\n- fix(auth): defer OAuth token refresh during Windows Modern Standby wakes (38fe9295)\n\n\n## What's Changed\n* Improve cross-platform tests and Git worktree handling by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/8067\n* feat(home): delegate Home dispatch to plugin executors by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/8119\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.1.3...v8.1.4\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
