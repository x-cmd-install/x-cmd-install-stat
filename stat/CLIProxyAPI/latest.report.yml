d_count":13,"created_at":"2026-09-22T02:27:22Z","updated_at":"2026-09-22T02:27:23Z"},{"id":580365236,"node_id":"RA_kwDOPFM7E84il6u0","name":"CLIProxyAPI_7.3.12_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22535866,"digest":"sha256:eb73eb43ef82dea0ffc7b433fc3b6f994cd0b3f35d3b59ee85870827e2fc3cec","download_count":180,"created_at":"2026-09-22T02:27:56Z","updated_at":"2026-09-22T02:27:57Z"},{"id":580364207,"node_id":"RA_kwDOPFM7E84il6ev","name":"CLIProxyAPI_7.3.12_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22439226,"digest":"sha256:bd0e31302d4ea2a8ca43f66f7b92f712b5a0e522f4357914ba07c203210446dd","download_count":18,"created_at":"2026-09-22T02:27:20Z","updated_at":"2026-09-22T02:27:21Z"},{"id":580368121,"node_id":"RA_kwDOPFM7E84il7b5","name":"CLIProxyAPI_7.3.12_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20347618,"digest":"sha256:211e6f24869a1d8105e05bcca9fff93e639d7c6f4253d52d3d69ea769cc8d722","download_count":8,"created_at":"2026-09-22T02:29:30Z","updated_at":"2026-09-22T02:29:31Z"},{"id":580365833,"node_id":"RA_kwDOPFM7E84il64J","name":"CLIProxyAPI_7.3.12_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22812105,"digest":"sha256:90a32811718f850fe1cab4d7bfaa7dfb973b402484f4f5e6cd53586dbc078720","download_count":111,"created_at":"2026-09-22T02:28:18Z","updated_at":"2026-09-22T02:28:20Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- perf(codex): avoid discarded copies of SSE data lines (cbf83183)\n- perf(codex): batch tool schema rewrites (56518489)\n- perf: index Responses tools and cache stream request validation (8a6a3968)\n- feat(models): add grok-4.7 model definition (130c8792)\n- chore(models): drop gpt-5.3-codex-spark from the embedded catalog (94b7cc2e)\n- style: gofmt codex bootstrap and cache-control tests (bf44a7f8)\n- fix(models): set grok-4.7 max completion to the context window (b9b50a83)\n- feat(executor): support execution-scoped request proxy overrides (d582067c)\n- Merge pull request #5680 from cookerpapa/perf/codex-tool-schema-batch (7f63f8c8)\n- Merge pull request #5990 from jack-5566/fix/responses-request-cache-pr (5083f650)\n- perf(executor): reuse identical Claude and Gemini request translations (639b7f11)\n- Merge pull request #5678 from cookerpapa/perf/codex-stream-copy (f6d582cb)\n- perf(executor): avoid discarded copies of Gemini and Kimi stream lines (a26cf2a8)\n- fix(gemini): preserve items for uppercase ARRAY type in schema sanitizer (2eb8dd11)\n\n\n## What's Changed\n* perf(codex): batch tool schema rewrites by @cookerpapa in https://github.com/router-for-me/CLIProxyAPI/pull/5680\n* perf: cache Responses request validation and index tool declarations by @jack-5566 in https://github.com/router-for-me/CLIProxyAPI/pull/5990\n* perf(codex): avoid discarded copies of SSE data lines by @cookerpapa in https://github.com/router-for-me/CLIProxyAPI/pull/5678\n\n## New Contributors\n* @jack-5566 made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5990\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.11...v7.3.12\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
