ha256:d15faeb44f111737890d55fcbd9e32eceecdd71d59f771e52be3e32c40853698","download_count":442,"created_at":"2026-09-26T18:38:46Z","updated_at":"2026-09-26T18:38:47Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(thinking): log baseline configuration for native Responses requests (12245ad3)\n- fix(thinking): log effective effort and baseline for native Responses requests (b4e5cc01)\n- fix(claude): preserve tool result adjacency for Antigravity requests (3de5709d)\n- feat(auth): support terminal rejection in plugin scheduler (6cd86fb2)\n- fix(codex): strip non-standard multi-agent metadata for compat models (3b2882b7)\n- feat(codex): support service tier in OpenAI request translation (be4b28f1)\n- feat(runtime): enhance Devin model aggregation and UID normalization (fc2c98d1)\n- fix(antigravity): extract and apply reasoning summary config for OpenAI responses (6dea3dfa)\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.18...v7.3.19\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
