"digest":"sha256:b02945199f5259e054c1691f8e42e7b9e0706955ff2a0b43c79b8bf5ca5a1a36","download_count":512,"created_at":"2026-09-10T10:45:13Z","updated_at":"2026-09-10T10:45:14Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(claude): preserve 1h cache ttl and beta header for subagent requests (6a73f396)\n- fix(openai): preserve prewarm input and allow named tool outputs in responses websocket (bd03aabc)\n- fix(openai): preserve nested error details and sequence numbers in responses stream (25913086)\n- fix(codex): treat model capacity errors as bootstrap overload failures (3ae9093d)\n- fix(auth): enable model cooldown and rotation for model not found errors (dde250f1)\n- fix(translator): ignore null and empty finish reasons in openai to gemini response (4dce5f3a)\n- fix(stream): handle split CRLF across chunk boundaries in SSE validation (638ed7e1)\n- docs(readme): remove RunAPI sponsor (09a29bd3)\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.2.156...v7.2.157\n","reactions":{"total_count":5,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
