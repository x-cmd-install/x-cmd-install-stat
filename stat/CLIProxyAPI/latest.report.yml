","download_count":20,"created_at":"2026-09-11T16:07:21Z","updated_at":"2026-09-11T16:07:22Z"},{"id":557565518,"node_id":"RA_kwDOPFM7E84hO8ZO","name":"CLIProxyAPI_7.2.158_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":21684911,"digest":"sha256:fe8d8a62c2464289e6fc10595bbb9595fbc4978f2abbf75854d052b91ecacb34","download_count":597,"created_at":"2026-09-11T16:07:53Z","updated_at":"2026-09-11T16:07:54Z"},{"id":557564323,"node_id":"RA_kwDOPFM7E84hO8Gj","name":"CLIProxyAPI_7.2.158_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":21600721,"digest":"sha256:a710b7834f581883377fc23726e0effdd392e06e1698db420dd9b2249d2f8271","download_count":37,"created_at":"2026-09-11T16:07:13Z","updated_at":"2026-09-11T16:07:14Z"},{"id":557567858,"node_id":"RA_kwDOPFM7E84hO89y","name":"CLIProxyAPI_7.2.158_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":19590879,"digest":"sha256:112cb30d7344efb7c9170512d7b3dd8068295e067bc9482bce027a32f6b6a89f","download_count":26,"created_at":"2026-09-11T16:09:09Z","updated_at":"2026-09-11T16:09:10Z"},{"id":557566136,"node_id":"RA_kwDOPFM7E84hO8i4","name":"CLIProxyAPI_7.2.158_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21954848,"digest":"sha256:28c3b4d77b6e380ee9158577013d8b365f890053f7da5bed9f3d8f2d097cc1e1","download_count":223,"created_at":"2026-09-11T16:08:15Z","updated_at":"2026-09-11T16:08:17Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(openai): process reasoning deltas before content in responses stream (c8ecb4f3)\n- fix(antigravity): keep active block open on empty text parts in claude stream (fd3e6623)\n- fix(auth): treat cloudflare 520-526 origin errors as transient upstream failures (9fad5055)\n- fix(gemini): preserve function call pairing for interrupted calls and replay failures (b8e6ec0a)\n- fix(auth): bound force refresh all concurrency using worker pool (6dce7867)\n- fix(translator): ignore fco output item IDs when extracting responses call ID (5a07045e)\n- feat(usage): propagate upstream base_url across usage records and plugin auth (c8f723e0)\n- chore(codex): update codex user-agent to 0.154.0 (8461b4e9)\n- fix(codex): inherit template metadata for model aliases and restrict provider capabilities (8f23ad02)\n- fix(translator): support incomplete status and response.incomplete event in responses translation (4efcac79)\n- feat(auth): support execution result policy before quota and cooldown mutations (2912516c)\n- fix(translator): relay claude tool result images as user messages for openai (4cd17293)\n- feat(auth): support organization-hashed claude credentials and legacy migration (fc96a87f)\n- fix(translator): preserve unknown thinking signatures in claude to codex compat translation (942bda99)\n- fix(translator): support audio transcription parts in gemini response translation (5c80a01c)\n- fix(auth): drop stale auth updates using monotonic watcher revisions (d1702fdf)\n- fix(signature): preserve Gemini 3 server-side tool thought signatures (#5652) (54776fb3)\n- fix(thinking): extract configuration_update reasoning effort in codex usage reporting (4edf9d1d)\n- feat(signature): validate Claude CAQS reasoning signatures (75ce6352)\n- fix(claude): anchor billing fingerprint to initial turn for cloaked cache stability (377c315f)\n- feat(kimi): add Kimi K2.8 model definitions, normalization, and temperature guard (8bd67f33)\n- feat(readme): add RapidProxy sponsorship details and logo (e88cd947)\n- feat(readme): add RapidProxy sponsorship details and logo in Chinese and Japanese (ae8f1f8b)\n- fix(gemini): include thought tokens in OpenAI completion usage (cd1e8e10)\n- fix(gemini): include thought tokens in OpenAI responses usage (c2562d8a)\n- fix(websockets): prevent keepalive pong starvation during large payload writes (b5ba02c2)\n- Merge pull request #5744 from smartconnect365/fix/5733 (9781fe46)\n- Merge pull request #5746 from smartconnect365/fix/gemini-responses-output-tokens (137db720)\n- fix(auth): clear unauthorized cooldowns on credential changes and sync codex plan type (456d4c37)\n- fix(claude): forward unmanaged caller betas on direct anthropic requests (d9b8fdb7)\n- feat(plugins): expose model list responses to plugin interceptors (5b278561)\n\n\n## What's Changed\n* fix(signature): preserve Gemini 3 server-side tool thought signatures (#5652) by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5731\n* feat(signature): validate Claude CAQS reasoning signatures by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5732\n* fix(gemini): include thought tokens in OpenAI completion usage by @smartconnect365 in https://github.com/router-for-me/CLIProxyAPI/pull/5744\n* fix(gemini): include thought tokens in OpenAI responses usage by @smartconnect365 in https://github.com/router-for-me/CLIProxyAPI/pull/5746\n\n## New Contributors\n* @smartconnect365 made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5744\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.2.157...v7.2.158\n","mentions_count":2}
