667421a9f37bef3cb8e73c4ee4044c8575016d3b30b1744169a159577a3","download_count":585,"created_at":"2026-09-19T18:10:44Z","updated_at":"2026-09-19T18:10:45Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(translator): deduct cache_write_tokens from input_tokens in openai/codex to claude (#5956) (883660fb)\n- Merge pull request #5962 from router-for-me/fix/issue-5956-cache-write-deduction (12773e74)\n- fix(translator): align tool choice mapping and enforce fail-closed handling (49eec664)\n- feat(translator): support strict tool mode mapping for gemini and claude (f247e2b0)\n- fix(translator): preserve constraints and additionalProperties in gemini parametersJsonSchema (b532db9c)\n- fix(management): reconcile expired cooldowns to active status in auth files (b4ff581d)\n- feat(management): support priority field in claude key patch (93b94d22)\n- feat(executor): support duplex streaming for codex websockets (42c9680e)\n- fix(pluginhost): preserve http status codes in host callback and execution errors (1c878749)\n- feat(translator): support multimodal audio, video, and file inputs in responses to gemini (61fdfc34)\n\n\n## What's Changed\n* fix(translator): deduct cache_write_tokens from input_tokens in openai/codex to claude (#5956) by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5962\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.8...v7.3.9\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
