t":19,"created_at":"2026-09-14T19:45:06Z","updated_at":"2026-09-14T19:45:07Z"},{"id":564096306,"node_id":"RA_kwDOPFM7E84hn20y","name":"CLIProxyAPI_7.3.3_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22204961,"digest":"sha256:7af8c99cd08eee3ccc81d1596e8a31785674d3de6bd7ec61416d59493dd8fc01","download_count":1015,"created_at":"2026-09-14T19:45:30Z","updated_at":"2026-09-14T19:45:31Z"},{"id":564095320,"node_id":"RA_kwDOPFM7E84hn2lY","name":"CLIProxyAPI_7.3.3_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22110627,"digest":"sha256:47e7b9f669b6599126db55a4b285b53d8a677d77fdb5922ebc0b6933c3d5be2c","download_count":46,"created_at":"2026-09-14T19:45:01Z","updated_at":"2026-09-14T19:45:02Z"},{"id":564098157,"node_id":"RA_kwDOPFM7E84hn3Rt","name":"CLIProxyAPI_7.3.3_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20049884,"digest":"sha256:cc8319d4db2a52bc4aa63cf52c778d6fadee1f7558d98c7ebda775b6f5c19b1b","download_count":22,"created_at":"2026-09-14T19:46:43Z","updated_at":"2026-09-14T19:46:45Z"},{"id":564097044,"node_id":"RA_kwDOPFM7E84hn3AU","name":"CLIProxyAPI_7.3.3_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22474457,"digest":"sha256:fccc11c14c9c6261a93b5b9313c2bc9bfe05c93ec553bb0bbb8edfd33dc99dc7","download_count":579,"created_at":"2026-09-14T19:45:59Z","updated_at":"2026-09-14T19:46:00Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(codex): buffer keepalive and empty item announcements during codex bootstrap (cb73cd99)\n- feat(devin): support port-free manual code login in no-browser mode (fe2fdde8)\n- fix(devin): align OAuth authorization URL parameter order with official CLI binary (09807c57)\n- fix(devin): mock AuthService in headless token test and validate prompt before printing URL (c35db127)\n- feat(discovery): add LAN gateway discovery (3428110d)\n- fix(translator): preserve html characters in tool arguments and fix devin sequential tool calls (c1cb0c5d)\n- docs(readme): remove FastAIToken sponsor (fd3cd151)\n- test(devin): route status calls to mock server in headless auth tests (f465ebdd)\n- fix(claude): repair tool call pairing and handle standalone tool outputs (2bcebaa8)\n- fix(discovery): harden advertiser lifecycle and browse limits (b9005770)\n- fix(discovery): honor caller cancellation and reload endpoint (c1b7c91f)\n- Merge pull request #5724 from Viggo95/fix/codex-bootstrap-buffer-noncontent-events (bb20fa2d)\n- fix(discovery): bound browse resource usage (f5c19d25)\n- fix(cmd/fetch_antigravity_models): support symlinked auth dir and multi-auth fallback (f341e07b)\n- feat(models): add gemini-3.5-flash-lite model definition (d48590a4)\n- feat(codex): add optional time ceiling for stream bootstrap buffering (6e307553)\n- test(discovery): report temp cleanup failures (c3a5e8c0)\n- fix(discovery): close lifecycle and routing gaps (20ec9b83)\n- Merge pull request #5818 from router-for-me/feat/codex-bootstrap-timeout (6c5fef91)\n- fix(discovery): keep JSON scans clean and honor interface filters (7d687054)\n- fix(discovery): load default scan config and sanitize hostnames (2dd2fd6d)\n- fix(discovery): uniquify instance names without a startup browse (9e847e59)\n- fix(devin): share manual paste parsing and surface oauth callback errors (5f74accd)\n- fix(discovery): tighten scan timeout, flags, and TCP-only types (13af6c00)\n- Merge pull request #5808 from router-for-me/feat/devin-code-login (c9b3dbef)\n- Merge pull request #5796 from router-for-me/feat/ai-gateway-discovery (9b52a499)\n- fix(pluginhost): keep request and method buffers alive during native call (b8477c71)\n- feat(pluginabi): support HTTP status code propagation in plugin error envelopes (6ba44455)\n- test(openai): add tests for responses websocket compaction replay and routing (ca929459)\n- feat(pluginhost): propagate forced provider and auth ID in host model execution (748d5767)\n- feat(auth): add tests to ensure async operations don\u2019t block unrelated actions (e3cbe437)\n- feat(executor): strip unsupported `id` fields from Gemini interactions payload (1fac8cc0)\n- feat(auth): add retry logic for pre-HTTP transport failures and related tests (bef1f65c)\n- feat(translator): handle orphan function outputs as user text in OpenAI and Gemini translators (8c984672)\n- feat(executor): promote reasoning content as summary and sanitize inputs (7bbfeaf8)\n\n\n## What's Changed\n* fix(codex): keep bootstrap buffer open for events that carry no output by @Viggo95 in https://github.com/router-for-me/CLIProxyAPI/pull/5724\n* feat(codex): add optional time ceiling for stream bootstrap buffering by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5818\n* feat(devin): support port-free manual code login in no-browser mode and align OAuth URL parameter order by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5808\n* feat(discovery): introduce mDNS/DNS-SD LAN service advertising and CLI discovery by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5796\n\n## New Contributors\n* @Viggo95 made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5724\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.2...v7.3.3\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
