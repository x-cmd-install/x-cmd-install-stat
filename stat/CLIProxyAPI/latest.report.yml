2a9","download_count":44,"created_at":"2026-09-08T17:39:19Z","updated_at":"2026-09-08T17:39:20Z"},{"id":550978253,"node_id":"RA_kwDOPFM7E84g10LN","name":"CLIProxyAPI_7.2.155_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":21602658,"digest":"sha256:5eb8e1ab3f90aa22e4843d0c881f113d4e359a8cb3d3ec130a53e356060be730","download_count":2798,"created_at":"2026-09-08T17:40:02Z","updated_at":"2026-09-08T17:40:04Z"},{"id":550977382,"node_id":"RA_kwDOPFM7E84g1z9m","name":"CLIProxyAPI_7.2.155_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":21514090,"digest":"sha256:2e4d1280baf48cb9184eb9e95c92079848202bb2ab9c23341176e9a4eca88881","download_count":101,"created_at":"2026-09-08T17:39:24Z","updated_at":"2026-09-08T17:39:25Z"},{"id":550979695,"node_id":"RA_kwDOPFM7E84g10hv","name":"CLIProxyAPI_7.2.155_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":19516375,"digest":"sha256:221846c698858b6967d767ab31099550f1b2f1bf431f142c2586a1033b81ca52","download_count":97,"created_at":"2026-09-08T17:41:02Z","updated_at":"2026-09-08T17:41:03Z"},{"id":550979005,"node_id":"RA_kwDOPFM7E84g10W9","name":"CLIProxyAPI_7.2.155_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21869299,"digest":"sha256:b24d8f443c4cdc6229a6d1a769476328a3290512dd1f5f26a03c181c3e8e15b5","download_count":1654,"created_at":"2026-09-08T17:40:31Z","updated_at":"2026-09-08T17:40:32Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(docs): remove Infistar.ai sponsorship details from README files (d198db54)\n- fix(claude): default function parameters for tools without input schema (6e1f9ec4)\n- fix(antigravity): normalize gemini responseJsonSchema to responseSchema (dc21a426)\n- fix(claude): align beta assembly and Haiku helper transport with the measured 2.1.258 (280b96ac)\n- fix(claude): attach helper request IDs according to the upstream base (35a47238)\n- feat(kimi): support openai responses api (d4146bde)\n- fix(antigravity): include resolved pool settings in transport cache key (68dd99d5)\n- fix(claude): enforce sequential content blocks for interleaved streaming tool calls (ef99119e)\n- fix(auth): cap refresh loop timer wait duration (48e5e9e0)\n- fix(claude): map codex reasoning tokens to thinking tokens (e365ab0c)\n- feat(session): enhance harness hierarchy recognition and deduplicate selector extraction (39058915)\n- feat(usage): normalize reported session hierarchy to canonical UUIDv8 (6b187e77)\n- fix(plugin-store): only check releases for installed update sources (1c9d7194)\n- fix(auth): strip monotonic clock reading from quota cooldown deadlines (1d5f7b2a)\n- fix(plugin-store): coalesce and throttle cached release checks (54b17ce8)\n- fix(plugin-store): honor shared GitHub API rate-limit cooldowns (8c0ad8cc)\n- feat(auth): export helper functions for headless antigravity oauth (20e3f731)\n- perf(antigravity): batch functionResponse name repairs (d8f2dcee)\n- fix(plugin-store): add network scope handling for shared GitHub API cooldowns (3639d924)\n- fix(api): skip access logging for health probes (e026cbf4)\n- fix(session): harden canonical UUIDv8 normalization for empty prefixes and context roots (1119ef14)\n- fix(logging): silence only successful health probes (a163c5e7)\n- Merge pull request #5625 from router-for-me/fix/issue-5608-plugin-store-rate-limit (f39702a2)\n- fix(gemini): normalize responses tool call outputs and resolve alternate call ids (d0bb908c)\n- Merge pull request #5626 from nichaoshou/fix/healthz-access-log (454452d5)\n- feat(plugin): preserve raw json in management responses on schema version 6 (c6327a86)\n- fix(gemini): reorder trailing text before function responses in user turns (4fde97f4)\n- fix(codex): strip schema dialect keywords from tool parameters (7fac6b15)\n\n\n## What's Changed\n* fix(claude): align beta assembly and helper transport with the measured 2.1.258 by @HYEONMIN94 in https://github.com/router-for-me/CLIProxyAPI/pull/5412\n* feat(session): enhance harness hierarchy recognition, deduplicate selector, and normalize usage to UUIDv8 by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5622\n* perf(antigravity): batch functionResponse name repairs by @rome-xi in https://github.com/router-for-me/CLIProxyAPI/pull/5582\n* fix(plugin-store): reduce release checks and honor shared GitHub rate-limit cooldowns by @LTbinglingfeng in https://github.com/router-for-me/CLIProxyAPI/pull/5625\n* fix(logging): silence successful health probes while preserving errors by @nichaoshou in https://github.com/router-for-me/CLIProxyAPI/pull/5626\n\n## New Contributors\n* @HYEONMIN94 made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5412\n* @nichaoshou made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5626\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.2.154...v7.2.155\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
