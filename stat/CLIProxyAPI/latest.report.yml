ha256:3b230fe663872741f872bbd1324971a5549caadc4277a751bc90b32572b8eacd","download_count":382,"created_at":"2026-10-02T20:23:56Z","updated_at":"2026-10-02T20:23:57Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(pluginhost): add host routing reset cooldown callback (8348923a)\n- fix(codex): retain template freeform apply_patch capability by default (d306f2c5)\n- fix(claude): pin session date in cloaked reminder to prevent prompt cache invalidation (6d57ac90)\n- feat(management): inject auth indexes into v8 api-keys config (0fb50a18)\n- fix(auth): preserve terminal unauthorized state and prevent unsafe refresh retry (c163bae4)\n- fix(claude): handle pause_turn stop reason in responses translation (e6f6f26a)\n- fix(codex): preserve web search sources in responses request include (2044a01f)\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.11...v8.0.12\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
