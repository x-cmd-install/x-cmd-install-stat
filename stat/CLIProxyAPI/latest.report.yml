"sha256:6d380093d9cf7a7199da3dc1dde51deafde452bb5307ee1200ee82a87b88bea3","download_count":1079,"created_at":"2026-10-07T19:03:25Z","updated_at":"2026-10-07T19:03:27Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(translator): stop dropping attachments and empty turns (3b69068e)\n- feat(xai): dynamically fetch latest Grok CLI version from npm registry with fallback (90654da5)\n- Merge pull request #6441 from soilSpoon/fix/attachment-parts (7cd8f7ba)\n- fix(translator): report unsendable user turn attachments in openai responses to interactions (f51624aa)\n- Merge pull request #6446 from jellyfish-p/feat/grok-cli-dynamic-version (298649f6)\n- fix(xai): add proxy support and semver validation to Grok CLI updater (34e73c75)\n- refactor(translator): update openai and interactions request converters to return errors (0f96f568)\n\n\n## What's Changed\n* fix(translator): stop dropping attachments and empty turns by @soilSpoon in https://github.com/router-for-me/CLIProxyAPI/pull/6441\n* feat(xai): dynamically fetch latest Grok CLI version from npm registry with fallback by @jellyfish-p in https://github.com/router-for-me/CLIProxyAPI/pull/6446\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.19...v8.0.20\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
