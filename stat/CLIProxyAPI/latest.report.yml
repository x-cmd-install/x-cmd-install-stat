nload_count":34,"created_at":"2026-10-26T15:51:20Z","updated_at":"2026-10-26T15:51:21Z"},{"id":678646923,"node_id":"RA_kwDOPFM7E84oc1SL","name":"CLIProxyAPI_8.0.44_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":24171994,"digest":"sha256:3957c34fe4a95a37f5997ab63d78dca431fa1521997d7c2ab3bdfe169ad89307","download_count":1722,"created_at":"2026-10-26T15:51:52Z","updated_at":"2026-10-26T15:51:53Z"},{"id":678645214,"node_id":"RA_kwDOPFM7E84oc03e","name":"CLIProxyAPI_8.0.44_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":24057577,"digest":"sha256:72b59dc9b79c1f6860031705c9e8d8676dab7cd3caef81009838928c91ab2beb","download_count":108,"created_at":"2026-10-26T15:51:09Z","updated_at":"2026-10-26T15:51:10Z"},{"id":678650622,"node_id":"RA_kwDOPFM7E84oc2L-","name":"CLIProxyAPI_8.0.44_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21807190,"digest":"sha256:6fd4da3655e8a2165b2699876e7fb1674ef62e4c3d12e8b86a038dbbe724efe5","download_count":36,"created_at":"2026-10-26T15:53:17Z","updated_at":"2026-10-26T15:53:18Z"},{"id":678647758,"node_id":"RA_kwDOPFM7E84oc1fO","name":"CLIProxyAPI_8.0.44_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24452848,"digest":"sha256:fad909f3b1ef873dbf5484c586d87db61576dc353cbc6e7cb9262a1770e77e2e","download_count":752,"created_at":"2026-10-26T15:52:11Z","updated_at":"2026-10-26T15:52:12Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(handlers): report cancellation when stream closes before first chunk (712e4970)\n- fix(auth,pluginapi,usage): share per-selection ID between Scheduler.Pick and UsageRecord (e5321f53)\n- feat(codex): add full-chain compression for Codex upstream and downstream traffic (064e008b)\n- fix(translator): map Claude thinking_tokens to reasoning_tokens in OpenAI chat usage (43f5386b)\n- fix(codex): restore Codex commentary history via internal thinking signature marker (531721bf)\n- fix(api): explicitly allow Authorization in CORS preflight responses (058b803b)\n- perf(pluginhost): gate request interceptor body delivery behind schema v7 opt-out (6fe654bf)\n- fix(interactions): emit [DONE] sentinel after terminal usage frame in Antigravity and Gemini streams (ede07caf)\n- feat(discovery): align TXT schema with draft-su-ai-gateway-discovery-00 (8a982a52)\n- chore(config): deprecate discovery advertise-management (b214385c)\n- fix(claude): handle forced tool restrictions in claude 5.5 (1d45a5f3)\n- fix(antigravity): accept bare content-block lists in interactions input (37bd18b0)\n- fix(discovery): resolve split mDNS responses with scoped bounded caches (11e5f67b)\n- docs(discovery): describe LAN resolution limits and trust boundaries (999526c7)\n- fix(gemini): keep truncated HTTP 200 streams out of credential cooldown and failover (aa4130e6)\n- Merge pull request #7010 from sususu98/feat/discovery-ietf-draft (ec81e70a)\n- docs(readme): remove APIMart sponsor sections and assets (1f917e77)\n\n\n## What's Changed\n* feat(discovery): align LAN discovery with IETF AI gateway draft by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/7010\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.43...v8.0.44\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
