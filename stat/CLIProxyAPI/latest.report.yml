756,"created_at":"2026-09-16T21:25:18Z","updated_at":"2026-09-16T21:25:19Z"},{"id":568827865,"node_id":"RA_kwDOPFM7E84h55_Z","name":"CLIProxyAPI_7.3.5_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22265146,"digest":"sha256:0415051a3ed8e5c659eda7017ef45d74b574b1f474ee880cb2b92da44bb61fb3","download_count":35,"created_at":"2026-09-16T21:25:03Z","updated_at":"2026-09-16T21:25:05Z"},{"id":568830373,"node_id":"RA_kwDOPFM7E84h56ml","name":"CLIProxyAPI_7.3.5_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20192674,"digest":"sha256:bb1e06d737ea01c31d22cd2049065a7b959133bfd9ed283e2d9e998fd2906906","download_count":17,"created_at":"2026-09-16T21:26:47Z","updated_at":"2026-09-16T21:26:48Z"},{"id":568829255,"node_id":"RA_kwDOPFM7E84h56VH","name":"CLIProxyAPI_7.3.5_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22629226,"digest":"sha256:f4bc9a277738773640aab53685f1bcaf360d4c66bb3bb4dd84300808314c3d13","download_count":524,"created_at":"2026-09-16T21:25:57Z","updated_at":"2026-09-16T21:25:58Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(auth): enhance retry logic with enriched error handling and tests (6724a958)\n- fix(interactions): strip invalid id from function_result and redundant call_id from function_call (f51d3ae9)\n- Merge pull request #5830 from router-for-me/fix/issue-5828-gemini-interactions-tool-result-id (10d464d4)\n- feat(translator): enhance finish reason handling and tool call translations (6f908cbc)\n- feat(translator): enhance cache usage handling and input token computation logic (e54a8e97)\n- feat(translator): introduce namespace-aware tool name capping and collision handling (e3e97ad9)\n- fix(devin): support swe-1-6-slow model variant (dea4ce8a)\n- feat(antigravity): support web search translation and URL resolution in OpenAI Responses (ef63d2e7)\n- feat(translator): preserve tool names in tool result messages (7def8425)\n- fix(devin): classify high-demand errors as rate limits (d44901f9)\n- Merge pull request #5867 from avabbbb/fix/devin-swe-1-6-slow (44f8343f)\n- fix(executor): prevent stream failure on client disconnect after claude completion (7c32971b)\n- Merge pull request #5862 from sususu98/feat/antigravity-websearch (8c6d4dcd)\n- feat(translator): enhance web search streaming and citation mapping in OpenAI Responses (7fcbdf88)\n- Merge pull request #5870 from avabbbb/fix/devin-high-demand-rate-limit (4613cfd4)\n- feat(translator): support alternative reasoning fields in OpenAI Claude translation (77820cb2)\n- fix(devin): buffer content deltas to handle late thinking signatures (c2bb91d2)\n- feat(translator): wrap demoted mid-session system messages in system-reminder envelope (b681a1e0)\n\n\n## What's Changed\n* fix(interactions): strip invalid id from function_result and redundant call_id from function_call by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5830\n* fix(devin): support swe-1-6-slow model variant by @avabbbb in https://github.com/router-for-me/CLIProxyAPI/pull/5867\n* feat(antigravity): support web search translation and URL resolution in OpenAI Responses by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5862\n* fix(devin): classify high-demand errors as rate limits by @avabbbb in https://github.com/router-for-me/CLIProxyAPI/pull/5870\n\n## New Contributors\n* @avabbbb made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5867\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.4...v7.3.5\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
