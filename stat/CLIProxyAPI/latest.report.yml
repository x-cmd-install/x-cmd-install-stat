6,"digest":"sha256:e50bd9362edb89d0816329f17372f00f1a68b8f72991cca41d39b4528c234563","download_count":623,"created_at":"2026-09-07T19:52:35Z","updated_at":"2026-09-07T19:52:36Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(gemini): hide trailing text thought signatures from responses timeline (510c9c8f)\n- fix(codex): restore dotted collaboration tool names in multi-agent v2 (82f4f370)\n- fix(antigravity): default to short connections and harden connection pool lifecycle (fixes #5494) (d5397905)\n- Merge pull request #5596 from sususu98/fix/issue-5494-antigravity-idle-conns (f19d6da0)\n- fix(codex): simplify complex tool schema unions and detect empty incomplete responses (bf20b999)\n- feat(claude): support structured output via system prompt instructions (4f038099)\n- fix(wsrelay): preserve queued frames during terminal message delivery (7871a5a9)\n- fix(codex): preserve service tier and cache write tokens in openai responses (8696585c)\n- fix(codex): explicitly default function tool strict to false (d01516c1)\n- fix(codex): recover omitted tool namespaces in openai responses (03a054e3)\n- fix(codex): sanitize invalid tool name characters for upstream compatibility (bee20b99)\n- fix(codex): recognize retryable server errors for bootstrap failover (ba7e5583)\n\n\n## What's Changed\n* fix(antigravity): default to short connections and harden connection pool lifecycle (#5494) by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5596\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.2.153...v7.2.154\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
