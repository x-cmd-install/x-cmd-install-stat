ha256:e0d999703c9af70067b15bf50e6521e76392da604d1543541361e6891c676c43","download_count":429,"created_at":"2026-10-05T21:50:05Z","updated_at":"2026-10-05T21:50:06Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- docs(readme): add panel4cliproxyapi to community projects (980c3bc3)\n- docs(readme): add cliproxy-rs to More choices (6d06098d)\n- docs(readme): add Oh-My-CPA to usage statistics (dfd7c638)\n- Merge pull request #6373 from WizisCool/docs/add-oh-my-cpa-usage-statistics (13da3cee)\n- feat(codex): support action sources in Claude web search translation (68afd0d1)\n- refactor(executor): unify model reporting and replay logs (611ebba4)\n- feat(antigravity): enhance context hash rejection logging and introduce replay phases (17dc1b81)\n- feat(antigravity): enhance context hash rejection logging and batch retry logic (40f4df07)\n- feat(claude): support explicit prompt cache options (eb6a768d)\n- Merge pull request #6386 from router-for-me/logs (3e83083b)\n- fix(openai): complete responses stream on clean EOF after finish reason (0ea4e1dc)\n- fix(registry): disable Devin catalog for home builds (01e28567)\n- Merge pull request #6391 from router-for-me/home (30700d44)\n- fix(codex): record reasoning effort after applying payload overrides (c7b4d573)\n- fix(gemini): support document blocks in Claude request translation (ba1bbd75)\n- fix(gemini): enforce object type on schema nodes with properties (e1e3a811)\n- fix(openai): preserve unknown encrypted content in responses compat mode (d2597a24)\n- Merge pull request #6355 from vayungodara/docs/add-cliproxy-rs (7dc25a7e)\n- Merge pull request #6112 from yaanlaan/docs/add-panel4cliproxyapi (abe54e85)\n- docs(readme): add japanese translation for panel4cliproxyapi (d2e3a77e)\n- fix(claude): share OAuth tool alias store across scoped executor copies (a2976eb8)\n\n\n## What's Changed\n* docs(readme): add Oh-My-CPA to usage statistics by @WizisCool in https://github.com/router-for-me/CLIProxyAPI/pull/6373\n* Unify model reporting and enhance logging for context hash rejections by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/6386\n* fix(registry): disable Devin catalog for home builds by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/6391\n* docs(readme): add cliproxy-rs to More choices by @vayungodara in https://github.com/router-for-me/CLIProxyAPI/pull/6355\n* docs(readme): add panel4cliproxyapi to community projects by @yaanlaan in https://github.com/router-for-me/CLIProxyAPI/pull/6112\n\n## New Contributors\n* @WizisCool made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/6373\n* @vayungodara made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/6355\n* @yaanlaan made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/6112\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.15...v8.0.16\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":4}
