81beb7c769b99e26a5f6f41d9999a07be7c36be170167f10a2a6ecfc7","download_count":536,"created_at":"2026-09-17T19:21:55Z","updated_at":"2026-09-17T19:21:57Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(management): paginate auth file listings (76ac75e6)\n- Merge pull request #5897 from camy-x/feat/auth-files-pagination (46d4baff)\n- fix(devin): support images in tool results (64c9433f)\n- fix(config): preserve plugin configurations when saving yaml (afba07ba)\n- feat(plugin): support scheduling across priorities (b715526a)\n- fix(management): reject unresolved token placeholders in api-call (0b550539)\n- fix(devin): aggregate tool calls by id and track cache write tokens (9e10db53)\n- fix(devin): handle orphaned tool results and normalize function result payloads (b6fe4f20)\n- feat(claude): support model-level cooling and scope overage rate limits (44eaef00)\n- fix(xai): unify forced hosted tool choice normalization (c616193a)\n- fix(ci): replace go-cross/cgo-actions with direct FreeBSD sysroot cross-compilation (b773607e)\n\n\n## What's Changed\n* feat(management): paginate auth file listings by @camy-x in https://github.com/router-for-me/CLIProxyAPI/pull/5897\n\n## New Contributors\n* @camy-x made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5897\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.6...v7.3.7\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
