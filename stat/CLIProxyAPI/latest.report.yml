1dcd83f24e491c78ad543a9d08d36d2472408194b21cf9d0a46eb4be1","download_count":238,"created_at":"2026-09-14T01:43:02Z","updated_at":"2026-09-14T01:43:04Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(openai): convert responses tool choice to chat completions format (8c5f6e18)\n- fix(devin): parse field 8 header submessages, accumulate field 4 prompt tokens, and add field 28 usage fallback (b4749cb2)\n- test(devin): add unit test for devin oauth-model-alias channel routing (01483310)\n- fix(devin): reject case-insensitive duplicate model IDs (db0b957c)\n- feat(api-call): support $TOKEN$ replacement in request body data (0719520f)\n- fix(devin): unwrap repeated field 28 groups, merge partial field 7 usage, and harden APICall escaping (4c331bb9)\n- fix(devin): trigger dimension group fallback if any usage metric is zero (5f56ce92)\n- fix(devin): use loopback callback endpoint for oauth redirect uri (cca35aee)\n- Merge pull request #5806 from router-for-me/feat/devin-followups (7fa443dc)\n\n\n## What's Changed\n* fix(devin): wire protocol submessage decoding, usage fallbacks, model uniqueness, and APICall body token replacement by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5806\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.1...v7.3.2\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
