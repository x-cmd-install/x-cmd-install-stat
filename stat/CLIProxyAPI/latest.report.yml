a256:1ccfc45c2c02cd337fef98d856514cca0b45f5a61e599960f06b282c6f55865d","download_count":447,"created_at":"2026-09-20T23:07:34Z","updated_at":"2026-09-20T23:07:35Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(translator): support builtin tools in gemini and antigravity interactions (cdfb79ef)\n- fix(claude): accept newer patch releases as native clients (#5820) (83a4913a)\n- docs(claude): clarify patch version floor rationale for native passthrough (c52ca7bd)\n- fix(auth): avoid unnecessary scheduler rebuilds by checking sync needs from auth map (e56547f3)\n- feat(steering): add documentation for Codex response steering and duplex transport (ddc3f731)\n- fix(translator): preserve reasoning content across tool turns in responses conversion (40cc6489)\n- feat(auth): propagate context compaction and node kind session metadata (28100e54)\n- Merge pull request #5982 from ysntony/add-kimi-ai-code-link (29bdd856)\n- feat: add full support for kimi.ai oauth and runtime execution (a5ab6952)\n\n\n## What's Changed\n* fix(claude): accept newer patch releases as native clients by @camy-x in https://github.com/router-for-me/CLIProxyAPI/pull/5820\n* docs: add international Kimi Code link (kimi.ai/code) to all README locales by @ysntony in https://github.com/router-for-me/CLIProxyAPI/pull/5982\n\n## New Contributors\n* @ysntony made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5982\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.9...v7.3.10\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":2},"mentions_count":2}
