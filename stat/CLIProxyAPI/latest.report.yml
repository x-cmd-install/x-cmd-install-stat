nload_count":33,"created_at":"2026-10-25T15:38:42Z","updated_at":"2026-10-25T15:38:43Z"},{"id":675412448,"node_id":"RA_kwDOPFM7E84oQfng","name":"CLIProxyAPI_8.0.43_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":24022497,"digest":"sha256:7825540634898e11fe9baf255b683856da5d9e75b95c66835891ebb40a79b526","download_count":1567,"created_at":"2026-10-25T15:39:59Z","updated_at":"2026-10-25T15:40:01Z"},{"id":675409281,"node_id":"RA_kwDOPFM7E84oQe2B","name":"CLIProxyAPI_8.0.43_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":23900947,"digest":"sha256:8f410d6e5a3a0448d10041398a71a971776c4847872574875afbd7de920c40fe","download_count":98,"created_at":"2026-10-25T15:38:31Z","updated_at":"2026-10-25T15:38:32Z"},{"id":675413772,"node_id":"RA_kwDOPFM7E84oQf8M","name":"CLIProxyAPI_8.0.43_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21676812,"digest":"sha256:7af79c3d8713a09213e0a68b78a7794c6f3459fcd2469ce10526960bb426bf34","download_count":33,"created_at":"2026-10-25T15:40:46Z","updated_at":"2026-10-25T15:40:47Z"},{"id":675412711,"node_id":"RA_kwDOPFM7E84oQfrn","name":"CLIProxyAPI_8.0.43_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24303589,"digest":"sha256:332cc8e0cd7370c841ce96b37cb1ae380136f1e4d7d54a610080ab81b5f6aec2","download_count":909,"created_at":"2026-10-25T15:40:09Z","updated_at":"2026-10-25T15:40:10Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(lint): resolve go vet lostcancel and static analysis warnings from v8.0.42 (2bb6ac6f)\n- fix(codex): bind duplex websocket turns to requested client model after interceptor rewrites (6340fe43)\n- fix(openai): isolate duplex turn reauthorization from gin context and enforce bound principal (3e7a21e2)\n- fix(watcher): preserve file snapshot binding on persisted auth updates (32dd2c86)\n- fix(auth): restore re-logged credentials to rotation after refresh failures (21553509)\n- fix(util): defer Gemini array placeholder items until after ref and allOf resolution (b2fda98e)\n- fix(plugin): preserve caller scope for replayed Claude OAuth MCP tool aliases (e48d780f)\n- fix(xai): deduplicate tools when promoting historical additional_tools (0c61b12c)\n- fix(cliproxy): back off home subscriber retries (ce433b37)\n- Merge pull request #6969 from router-for-me/home (cf4fc4e7)\n- fix(vertex): default credential location to global (ba06ec58)\n- fix(translator): preserve finishReason in Codex and OpenAI to Gemini streams (bdde391d)\n- feat(devin): aggregate swe-2 lightning UIDs into swe-2-lightning model (3dae075d)\n- feat(management): support session-scoped OAuth proxy with per-account persistence (#6973) (27f3abfb)\n- fix(openai): report buffered stream error when responses websocket data channel closes first (0fe4cc2c)\n- fix(handlers): report stream cancellation when channel closes with canceled context (90fe5b23)\n- test(executor): fix race conditions in flaky websocket executor tests (84e83441)\n- fix(aistudio): translate every SSE frame of a relay stream chunk (30780351)\n\n\n## What's Changed\n* fix(cliproxy): back off home subscriber retries by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/6969\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.42...v8.0.43\n","mentions_count":1}
