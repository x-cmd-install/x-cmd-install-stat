a256:7a17261b6389d52a641454cfb3d3c947ffdc80f59c50267c0e90af994e4e5f63","download_count":406,"created_at":"2026-09-24T00:13:00Z","updated_at":"2026-09-24T00:13:02Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(antigravity): sanitize Claude tool IDs and resolve collisions (580df95a)\n- feat(registry): update devin model definitions (65459cac)\n- fix(logging): prevent request log collisions and select latest log by ID (e6fcfa34)\n- feat(usage): track execution request ID and trace ID across usage records (2fe9932b)\n- fix(gemini): stringify function responses containing JSON schema $ref (5af6cd75)\n- fix(auth): isolate credential-scoped quota cooldown from model quota state (aafa4e95)\n- feat(pluginhost): add host http operation bridge and lifecycle scoping (855a7223)\n- feat(auth): persist meta mint subscription metadata in auth record (7d888bf3)\n- fix(claude): merge adjacent text blocks into single assistant message (781a203b)\n- fix(auth): preserve file priority across plugin auth refreshes (c404af96)\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.15...v7.3.16\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
