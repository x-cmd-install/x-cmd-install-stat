t":19,"created_at":"2026-11-25T04:27:51Z","updated_at":"2026-11-25T04:27:53Z"},{"id":790046531,"node_id":"RA_kwDOPFM7E84vFydD","name":"CLIProxyAPI_8.1.3_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":27129838,"digest":"sha256:f9c6651318d833a6c84d8b260554872fdee04ab78cfa8e16e270bc4ba7e7947e","download_count":621,"created_at":"2026-11-25T04:28:53Z","updated_at":"2026-11-25T04:28:57Z"},{"id":790045153,"node_id":"RA_kwDOPFM7E84vFyHh","name":"CLIProxyAPI_8.1.3_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":26987175,"digest":"sha256:52692c5515cc440714e439494367cba0e098a4cddc5015381b9a815c1e90789e","download_count":50,"created_at":"2026-11-25T04:28:19Z","updated_at":"2026-11-25T04:28:20Z"},{"id":790051162,"node_id":"RA_kwDOPFM7E84vFzla","name":"CLIProxyAPI_8.1.3_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24436999,"digest":"sha256:e9d8c3b817ae7b56dbf5a8be00d5f53afb88beac5ee36fddac80781bbb6d46c7","download_count":18,"created_at":"2026-11-25T04:30:44Z","updated_at":"2026-11-25T04:30:48Z"},{"id":790045574,"node_id":"RA_kwDOPFM7E84vFyOG","name":"CLIProxyAPI_8.1.3_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27412744,"digest":"sha256:764a79b0734338be5c191ff72b72a1441f38cdfcbc40b5d40e4de13d648ca23c","download_count":490,"created_at":"2026-11-25T04:28:30Z","updated_at":"2026-11-25T04:28:31Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- fix(claude): stabilize advisor system prompt placement (f73b8132)\n- fix(translator): preserve Claude generation constraints (32842348)\n- fix(translator,executor): harden Claude generation constraints and Vertex max output token cap (ac415c08)\n- fix(translator,executor): preserve native Claude max_tokens and remove Vertex silent cap (62c419e0)\n- fix(antigravity): preserve signature cache scope on first refresh (06225fcf)\n- fix(antigravity): align outbound request wire format (38067a29)\n- fix(gemini): merge multipart interaction user turns (9e19ffd3)\n- fix(meta): report clean eof before terminal event (32625f13)\n- fix(openai): preserve interactions steps on null finish reasons (3dc07c08)\n- fix(antigravity): restore standalone model enum discovery (e9a92d25)\n- fix(codex): handle nil auth in websocket streams (335b6987)\n- fix(openai): default empty responses tool arguments (927ed398)\n- fix(claude): preserve inline interaction tool arguments (37082b62)\n- fix(interactions): map Claude stop reasons to statuses (237fa0e4)\n- fix(pluginhost): advertise Windows plugin support without cgo (60abf6ba)\n- fix(antigravity): preserve thinking-group output caps (14a95b19)\n- fix(cache): normalize signature cache model groups (0286e5d1)\n- fix(cache): preserve Gemini sentinel with empty scope (6c2308a1)\n- fix(antigravity): reject empty successful streams (20be744e)\n- fix(antigravity): reject empty SSE responses in non-stream execution (d1bdee85)\n- fix(antigravity): emit complete tool calls once in OpenAI streams (fe571afe)\n- fix(antigravity): reject invalid HTTP 200 responses in CountTokens (9bce4825)\n- fix(auth): keep gemini, vertex, and aistudio in distinct LCP namespaces (3b20ee22)\n- fix(executor): refresh replay cache snapshot after pairing-failure invalidation (e9dd8bad)\n- fix(signature): handle snake_case function_call and function_response in Gemini thought signature sanitizer (7be2a678)\n- fix(proxyutil): preserve direct and none proxy modes in Redact (237e0740)\n- fix(signature): skip empty thoughtSignature paths when scanning Gemini fallbacks (b82d3d4e)\n- fix(management): namespace copilot and devin model ids in v8 (2a33e205)\n- fix(musecode): infer copilot ownership for models (28e5ae28)\n- Merge pull request #8022 from router-for-me/namespace (0acf4713)\n- fix(codex): preserve configured display name (237cbdaa)\n- Merge pull request #8023 from router-for-me/codex (f3cbdc5d)\n- fix(antigravity): synthesize fallback Claude message ID when responseId is missing or blank (da4396fd)\n- fix(claude): prefix Google input token limit errors with prompt is too long (ff9339fe)\n- fix(auth): recognize codex-acp user agents in Codex SIWC bypass (d71e9dcd)\n- fix(codex): force supported_in_api and default visibility on fallback client models (c39b20d4)\n- feat(thinking): parse extra_body.google.thinking_config on OpenAI Chat requests (ffa55112)\n- fix(translator): parse native Claude JSON, stop reason, and usage in Gemini non-stream response (e36449bc)\n- fix(util): normalize numeric protobuf Schema.Type enums in Gemini schemas (531aea15)\n- fix(translator): preserve OpenAI reasoning fields and array content in Gemini responses (2fbac976)\n- fix(codex): filter unsupported input modalities on named model templates (5fec95cf)\n- fix(translator): restore sanitized OpenAI tool names in Gemini chat-completions responses (5a64cfa1)\n- fix(gemini): normalize assistant image data URLs and merge tool response follow-up turns (de472050)\n- fix(translator): isolate multi-choice OpenAI non-stream responses into separate Gemini candidates (20c60014)\n- fix(translator): separate terminal finish_reason from delta payloads in OpenAI streams (8cd6817b)\n\n\n## What's Changed\n* fix(management): namespace copilot and devin model IDs in v8 by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/8022\n* fix(codex): preserve configured display name by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/8023\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.1.2...v8.1.3\n","mentions_count":1}
