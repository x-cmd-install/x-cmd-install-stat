705a0ba0ee6485310270612f0214d9522bad7d2b3027272e9a935c27faccc","download_count":1143,"created_at":"2026-11-26T17:04:51Z","updated_at":"2026-11-26T17:04:52Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- test(pluginhost): align unix plugin reload test with fresh-image contract (830b9cac)\n- fix(gemini): place merged follow-up user parts before function responses (7fa52365)\n- fix(pluginhost): preserve scheduler routing across reconfigure, hot reload, and dir errors (47f18e4d)\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.1.6...v8.1.7\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
