unt":22,"created_at":"2026-09-15T14:09:44Z","updated_at":"2026-09-15T14:09:45Z"},{"id":565831118,"node_id":"RA_kwDOPFM7E84hueXO","name":"CLIProxyAPI_7.3.4_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22291838,"digest":"sha256:48ded3538cccebc58918927e90ab91291d032df2e56bcf02b2b670b0912cbb21","download_count":1494,"created_at":"2026-09-15T14:08:38Z","updated_at":"2026-09-15T14:08:40Z"},{"id":565830999,"node_id":"RA_kwDOPFM7E84hueVX","name":"CLIProxyAPI_7.3.4_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22201192,"digest":"sha256:01965b60e9b863059bf51a579cf5195859a185c54520a3a288eaa002711fa9ba","download_count":65,"created_at":"2026-09-15T14:08:35Z","updated_at":"2026-09-15T14:08:36Z"},{"id":565835613,"node_id":"RA_kwDOPFM7E84hufdd","name":"CLIProxyAPI_7.3.4_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20127928,"digest":"sha256:c0563a3d7d55a9027b59673f9f1bb187f36a354a5080458eeaee1bfe1bc7ecfb","download_count":56,"created_at":"2026-09-15T14:11:22Z","updated_at":"2026-09-15T14:11:23Z"},{"id":565834155,"node_id":"RA_kwDOPFM7E84hufGr","name":"CLIProxyAPI_7.3.4_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22568234,"digest":"sha256:7eb4ff99f829bae429bace205da3a6e21b26b712e04ece15345769d8050257e9","download_count":895,"created_at":"2026-09-15T14:10:27Z","updated_at":"2026-09-15T14:10:29Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(meta): add native Meta (Muse Code) provider and OAuth device flow (54d4f4c0)\n- fix(cli): make config optional in commandMode so login works without existing config.yaml (fbf74645)\n- feat(meta): mint LLM API key from device access token via /muse-code/key (30191c3a)\n- feat(meta): add Meta OAuth management endpoint and WebUI / TUI support (23c16e29)\n- fix(management): disable caching for management.html to prevent stale SPA views (78c14b80)\n- fix(tui): rename Meta provider label from Meta (Muse) to Meta (18385de0)\n- feat(meta): add Meta API key management handlers, routes, logo, and tests (e475807a)\n- fix(meta): address review feedback on credential lifecycle, models, and config loading (cee799f6)\n- fix(meta): exclude cleared expired timestamp on persist, add runtime alias resolution, and fix test race (47cc31ae)\n- chore(meta): keep provider PR scoped to Meta support (21aa46b6)\n- fix(meta): recover and persist minted credentials correctly (be7323f3)\n- fix(meta): implement request preparer, disable unconditional refresh, scope 429 quota, and stabilize auth index (d09042a5)\n- fix(meta): require OAuth storage for DCA tokens and reject them in config meta-api-key (1144ae70)\n- fix(meta): validate catalog section, singleflight management mints, and synchronize singleflight test (06660dd6)\n- fix(meta): unify credential minting and preserve auth lifecycle (4a0131c0)\n- Merge dev into feat/meta-provider and preserve both registry tests (c6e076ff)\n- feat(plugin-quota): add typed summary metrics (acb0eae2)\n- fix(plugin-quota): accept summary-only probes (5cb41e23)\n- fix(plugin-quota): require summary metric values (7b60be35)\n- fix(plugin-quota): tolerate malformed summaries (782a5cd1)\n- fix(plugin-quota): validate summary identifiers (d3cb6859)\n- fix(plugin-quota): validate summary metadata (617b9fd1)\n- fix(plugin-quota): preserve mapped summaries (6aea72e2)\n- fix(plugin-quota): preserve valid mapped summaries (07e85de1)\n- Merge pull request #5803 from anpicasso/feat/plugin-quota-summary (512c453e)\n- feat(translator): refine tool call argument validation for finish reason logic (772c63c8)\n- Merge PR #5502 feat/meta-provider into cpa/muse (42ca5d34)\n- feat(executor): add native Meta (Muse Code) provider integration (65348b95)\n- feat(config): add Meta OAuth aliasing and error rules support (8335eac7)\n\n\n## What's Changed\n* feat(plugin-quota): add typed summary metrics by @anpicasso in https://github.com/router-for-me/CLIProxyAPI/pull/5803\n* feat(meta): add native Meta (Muse Code) provider by @kdcokenny in https://github.com/router-for-me/CLIProxyAPI/pull/5502\n\n## New Contributors\n* @anpicasso made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5803\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.3...v7.3.4\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
