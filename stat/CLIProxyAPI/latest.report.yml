nt":35,"created_at":"2026-11-21T19:05:08Z","updated_at":"2026-11-21T19:05:09Z"},{"id":776574490,"node_id":"RA_kwDOPFM7E84uSZYa","name":"CLIProxyAPI_8.1.0_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":26929012,"digest":"sha256:09492d9a338eb2d84b5e86f5456af0ff1fa951ad266c3df78e7db571e8ec41b1","download_count":1487,"created_at":"2026-11-21T19:05:49Z","updated_at":"2026-11-21T19:05:50Z"},{"id":776573357,"node_id":"RA_kwDOPFM7E84uSZGt","name":"CLIProxyAPI_8.1.0_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":26788245,"digest":"sha256:6ad9674a5633c49f5c8cf2d89625931064b09230ba4ec4eb0307140c6b4727c0","download_count":88,"created_at":"2026-11-21T19:05:20Z","updated_at":"2026-11-21T19:05:21Z"},{"id":776578891,"node_id":"RA_kwDOPFM7E84uSadL","name":"CLIProxyAPI_8.1.0_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24262748,"digest":"sha256:6c26406c64bc27d6d0d14c8001de289d817268503bff4463985da497e1e58e3d","download_count":30,"created_at":"2026-11-21T19:07:39Z","updated_at":"2026-11-21T19:07:40Z"},{"id":776575338,"node_id":"RA_kwDOPFM7E84uSZlq","name":"CLIProxyAPI_8.1.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27211895,"digest":"sha256:1497d7dea44e2097c0bbe9c8fa37f99a9b84efcc3485369ee3e7b5a504cd4ea3","download_count":655,"created_at":"2026-11-21T19:06:12Z","updated_at":"2026-11-21T19:06:13Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(copilot): add GitHub Copilot provider support (7ae771fc)\n- feat(copilot): support OAuth model aliases and exact route-aware selection (5dff8b67)\n- fix(codex): sync temp file before close and rename in WriteJSONFileAtomic (6d703fdf)\n- refactor(auth): rename applyRequestAfterAuthInterceptor (5ab97c6d)\n- fix(auth): treat zero-payload streams before EOF as empty_stream (ab971876)\n- fix(copilot): return gemini format for count tokens (b824c052)\n- fix(auth): preserve interceptor session clearing and metadata isolation (0147c80f)\n- fix(copilot): translate copilot streaming responses (9792ac28)\n- fix(copilot): use execution mode for claude stream translation (20211183)\n- fix(auth): clone per-attempt opts.Metadata from immutable base metadata (8f115808)\n- fix(auth): align VerifyInference with per-auth transport, auth prep, and cancellation (8906442b)\n- fix(auth): inspect response.candidates and additional Gemini failure finishReasons in completion flags (2c8b32fd)\n- fix(auth): clear stream rewriter before emitting flushed tail in wrapStreamResult (cdd6ae6d)\n- fix(auth): close canceled streams during upstream stalls (4aca8df3)\n- fix(auth): use syncPreferredUpstreamError in stream failover paths (b4247e19)\n- fix(auth): preserve stream headers and honor terminal request stops (df6c8ccb)\n- fix(auth): delete existing keys case-insensitively before applying updates in mergeRequestHeaders (486624c7)\n- fix(auth): cancel abandoned stream attempts before draining (538f9611)\n- fix(antigravity): publish unavailable credits hint when no GOOGLE_ONE_AI entry matches (8e5a98e8)\n- fix(antigravity): mark TOS pause 503 error as request-scoped (81018ba4)\n- fix(antigravity): harden SSE JSON reassembly and mid-stream error bookkeeping (892fc486)\n- fix(antigravity): preserve project discovery error classification (204be8b9)\n- fix(antigravity): persist execution-time token refreshes and preserve refresh context values (cdbda2f2)\n- feat(copilot)!: add preset-based in-memory catalog (d059cf28)\n- fix(auth): preserve disabled unavailability and skip inference verification on late success (29de31a8)\n- fix(antigravity): preserve thoughtSignature on text parts and empty-text carriers (9176cb22)\n- fix(auth): preserve disabled and terminal 401 states during model reconciliation (35afdf07)\n- fix(antigravity): filter ineligible credentials and resolve aliases in credits fallback (e0a1e93d)\n- fix(antigravity): honor explicit lower and zero max-idle-conns-per-host pool limits (80fb55d8)\n- fix(antigravity): scan all user parts for session ID and match models case-insensitively (18a03e40)\n- fix(antigravity): bound auth response reads, preserve error details, and make onboarding sleep ctx-aware (91ccf284)\n- fix(auth): check active plugin scheduler in affinity lookup and normalize mixed legacy provider keys (221d5e08)\n- fix(translator): correct antigravity gemini stream output (a3e75421)\n- fix(claude): preserve native haiku helpers on custom base URLs (7a5dee52)\n- fix(devin): preserve gpt reasoning across responses tool calls (cb5f62f7)\n- fix(antigravity): update Hub fallback and changelist map to 2.34.0 (093c7efa)\n- feat(copilot): support Home-dispatched Copilot execution (1ef770d9)\n- fix(antigravity): apply Host, custom auth headers, and TOS_VIOLATION handling in credits query (acb56c6c)\n- fix(antigravity): persist capability hints freshness metadata and initialize cache expiry on seed (533edd38)\n- fix(proxyutil): honor context cancellation on SOCKS5 HTTP transports (cec8a7f3)\n- fix(antigravity): skip model capability probes for unauthenticated credentials (f48975b4)\n- fix(antigravity): scope 403 validation and 401 inference errors to credential (d3e4db8b)\n- fix(antigravity): match claude 5.5 low, medium, and max effort variants for structured output (c813f779)\n- fix(antigravity): wire version updater into service lifecycle and honor proxy config (4ea1527c)\n- fix(antigravity): enforce tos-pause-window, Host, and custom auth headers in HttpRequest (d88d8dcb)\n- fix(antigravity): honor HTTP Retry-After header fallback on 429 responses (84b838e1)\n- feat(management): persist server identity and expose it to authenticated clients (69607634)\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.80...v8.1.0\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
