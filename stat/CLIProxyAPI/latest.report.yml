nload_count":49,"created_at":"2026-09-24T19:08:16Z","updated_at":"2026-09-24T19:08:17Z"},{"id":586628248,"node_id":"RA_kwDOPFM7E84i9zyY","name":"CLIProxyAPI_7.3.17_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22621107,"digest":"sha256:1c9aef78dcd372775ccd5252bd0f383366c93c1fa552204df8ea9191fa130927","download_count":2760,"created_at":"2026-09-24T19:09:07Z","updated_at":"2026-09-24T19:09:08Z"},{"id":586626757,"node_id":"RA_kwDOPFM7E84i9zbF","name":"CLIProxyAPI_7.3.17_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22518941,"digest":"sha256:aaecc113bad0f682546fa5ac62e8080adb646633e3f1da633cb5a742849fdaac","download_count":131,"created_at":"2026-09-24T19:08:21Z","updated_at":"2026-09-24T19:08:22Z"},{"id":586631614,"node_id":"RA_kwDOPFM7E84i90m-","name":"CLIProxyAPI_7.3.17_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20429257,"digest":"sha256:99fb4d3bdfc8d2e2002f2fb4d2c0b5d724cefe60d0c1c110f7e00cd8a49ef0ad","download_count":88,"created_at":"2026-09-24T19:10:53Z","updated_at":"2026-09-24T19:10:55Z"},{"id":586628630,"node_id":"RA_kwDOPFM7E84i9z4W","name":"CLIProxyAPI_7.3.17_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22898148,"digest":"sha256:3a036376a7c04a8fe70d7335915aa79cc520f8fad72030ef8da43a64e50bc38b","download_count":1539,"created_at":"2026-09-24T19:09:19Z","updated_at":"2026-09-24T19:09:20Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(executor): enhance sanitizeXAIResponsesBody to utilize resolved thinking support (984aee8d)\n- fix(codex): send the ChatGPT routing hint native Codex sends (b97f71da)\n- refactor(executor): remove unsupported reasoning effort handling and update related tests (6d1d74b3)\n- Merge pull request #6092 from router-for-me/xai (93cccc6b)\n- Merge commit 'refs/pull/6090/head' of github.com:router-for-me/CLIProxyAPI into dev (0876e7f0)\n- fix(codex): use resolved base model for routing hint (dd3b657b)\n- fix(claude): align 2.1.280 fingerprint and thinking visibility (#6096) (f7c738da)\n- fix(translator): sanitize tool names for Claude and inject fallback schema for parameterless tools (75b854eb)\n- Enhance logging and improve thought signature handling (#6106) (8222e328)\n- fix(translator,auth): avoid synthetic bypass on unsigned text parts and reduce stream rewrite log noise (107d7f76)\n- Merge pull request #6107 from sususu98/fix/stream-rewrite-log-noise (75f2d018)\n- fix(executor,auth): support Session_id header in Antigravity replay and remove redundant stream chunk logging (c7f358d4)\n- fix(registry,cliproxy): set xai owned_by for Devin grok models and align Antigravity web search tests (377747b8)\n- fix(api): immediately close connections on stop and guard state access (759c57c2)\n- fix(registry): keep request context active until response body is read (74c1ebd3)\n- fix(interceptors): avoid cloning request body for read-only interceptors (c9a06ba6)\n- fix(session): avoid rescanning large payloads during session extraction (1dffddf4)\n- fix(meta): fix client id header and preserve subscription metadata (9bdde54b)\n\n\n## What's Changed\n* Enhance XAI response sanitization and reasoning support by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/6092\n* fix(codex): send the ChatGPT routing hint native Codex sends by @SamGu-NRX in https://github.com/router-for-me/CLIProxyAPI/pull/6090\n* fix(claude): align 2.1.280 fingerprint and thinking visibility by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/6096\n* Enhance logging and improve thought signature handling by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/6106\n* fix(auth,translator): reduce stream model rewrite log noise and prevent empty parts on unsigned text by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/6107\n\n## New Contributors\n* @SamGu-NRX made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/6090\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.16...v7.3.17\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
