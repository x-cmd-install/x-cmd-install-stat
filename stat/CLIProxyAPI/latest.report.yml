a256:2722eccdabdbca935cfbd41e99b00a8017e91e45296e34b30004932c176b01b2","download_count":504,"created_at":"2026-09-23T00:58:28Z","updated_at":"2026-09-23T00:58:29Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- Merge pull request #6049 from ZYHUO/main (1efd01dc)\n- docs(readme): add CLIProxy Quota Tray to community projects (e01806f9)\n- feat(registry): add grok-4.7-build-fast model and update grok-4.7 (fc914b9d)\n- feat(claude): bump claude cli baseline to 2.1.280 and support tool changes beta (779bf317)\n- feat(claude): support Claude Code 2.1.280 feature-gated betas (bd584a75)\n- fix(codex): compact client model catalog and preserve required fields (673131f5)\n\n\n## What's Changed\n* docs: add CLIProxy Quota Tray to \"Who is with us?\" by @ZYHUO in https://github.com/router-for-me/CLIProxyAPI/pull/6049\n\n## New Contributors\n* @ZYHUO made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/6049\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.3.14...v7.3.15\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
