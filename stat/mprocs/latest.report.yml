id":676202090,"node_id":"RA_kwDOF-wLEc4oTgZq","name":"dekit-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":2830115,"digest":"sha256:853332f4a4621558ae5fd7ab2c4a7f69878914a1bdf88dd49f6af53b8541eb4c","download_count":45,"created_at":"2026-10-25T21:43:25Z","updated_at":"2026-10-25T21:43:25Z"},{"id":676202122,"node_id":"RA_kwDOF-wLEc4oTgaK","name":"dekit-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":3030345,"digest":"sha256:12c93546af4f35258610785d557519caa5a4780563bf845d4bd0b8010c7741d5","download_count":626,"created_at":"2026-10-25T21:43:25Z","updated_at":"2026-10-25T21:43:25Z"},{"id":676202130,"node_id":"RA_kwDOF-wLEc4oTgaS","name":"install.ps1","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-powershell","state":"uploaded","size":4724,"digest":"sha256:0271bdc1640f5c43d24496c7b0648682015824d6a63648430384111c4d62dbaa","download_count":5,"created_at":"2026-10-25T21:43:25Z","updated_at":"2026-10-25T21:43:25Z"},{"id":676202136,"node_id":"RA_kwDOF-wLEc4oTgaY","name":"install.sh","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-shellscript","state":"uploaded","size":3243,"digest":"sha256:6b742668dc6bdcd54feea07dc8d6c76904861e7d4be748e22d4e7d41278c3abc","download_count":2,"created_at":"2026-10-25T21:43:25Z","updated_at":"2026-10-25T21:43:25Z"},{"id":676202095,"node_id":"RA_kwDOF-wLEc4oTgZv","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":664,"digest":"sha256:a4246a7eef099dd12ac8515dd8e442eef385398846f978cd672d5ad1547e52c9","download_count":38,"created_at":"2026-10-25T21:43:25Z","updated_at":"2026-10-25T21:43:25Z"}],"body":"- A value tagged `!js` in `dekit.yaml` or a fragment is a JavaScript\n  expression, computed when the config loads, as in\n  `FIXTURES: !js std.path.join(ctx.dir, \"fixtures\")`; `ctx` has the\n  file's `dir`, the `runner`, and the `vars`\n- `vars:` in `dekit.yaml` names values that `!js` reads as `ctx.vars`, in\n  order\n- `dekit wait <target>` waits until tasks are ready, or with `--for exit`\n  until they have exited, and exits 0, 1 for a failure, or 124 when\n  `--timeout` runs out; `--timeout 0` checks once\n- `--wait` on `up`, `start`, and `restart` returns once what they started\n  is ready, and on `stop`, `kill`, and `veto` once it is down;\n  `--wait-timeout` bounds it. A failure names the task at the root and\n  shows the end of its screen\n- `std.dekit.wait(target, {for, timeoutMs})` waits from a script\n- `dekit run x --dep db` waits for `db` when it is not ready yet, instead\n  of exiting 1 at once\n- A running job shows as `running`, not `ready`; `ls --json` and `why`\n  carry `kind`\n- A stop dekit gave up on, because the process outlived a kill, shows as\n  `idle (stop timed out)`, with `reason: \"kill_timeout\"`\n- RPC: the `wait` method and feature, `kind` in task-info, and the\n  `kill_timeout` reason\n- A `tasks:` key that ends in `/` is a folder: `apps/: {collapsed: true}`\n  lists the `apps` folder collapsed at first, and a folder stays while it\n  is empty\n- `dekit rm apps` removes a folder or a group with everything in it\n- The console keeps which groups are collapsed across restarts; `H` and\n  `L` collapse and expand every group, and the `fold` action opens,\n  closes, or toggles the groups a path or glob names\n- `ready: {sd_notify: true}` counts a task ready when it sends `READY=1`\n  to the socket `NOTIFY_SOCKET` names, as it would to systemd\n- `dekit reload` brings what changed in `dekit.yaml` into a running\n  project; the console's header says when the file changed and opens the\n  reload dialog\n- A runner restart, `down` and `up`, and a live upgrade bring every task\n  back as it was; `dekit.yaml` is read at a fresh start and by `reload`\n- The console adds, edits, duplicates, moves, and removes tasks: `a`,\n  `e`, `C`, `J`/`K` or dragging a row, and `d`; `Space` or a right click\n  opens a task's menu, `y` copies its command\n- Changes made in the console are written back to `dekit.yaml` in place,\n  keeping its comments; what can't be edited safely goes to a coding\n  agent (`agent: {cmd: [...]}` in the user config) or is copied as a\n  prompt\n- Tasks are listed in the runner's order: a task moved in the console\n  stays where it was put, across restarts too\n- `dekit rm +dynamic` removes every task not from `dekit.yaml`; a\n  `dynamic` tag written in the config is refused\n- `dekit spawn --cwd` is relative to where the command is typed\n- The terminal emulator and renderer were rewritten: true color,\n  underline styles and colors, hyperlinks, the kitty keyboard and\n  graphics protocols, sixel, and output shaped to what the attached\n  terminal can show\n- Keymap: `e` opens the edit dialog (`show-rename-task` still works) and\n  `C` the duplicate dialog; `duplicate-task` copies without a dialog\n- RPC: `reload`; the `update`, `move`, and `set-origin` commands; `add`\n  takes the task entry under `spec`; `duplicate` takes `path` and\n  `start`; the `changed` and `bad_config` error codes; terminal\n  capabilities and the cell size on `attach`, and input as `key`,\n  `mouse`, `paste`, `focus`, and `resize` events\n- The console follows the terminal's light or dark background;\n  `tui.theme: dark | light` in the user config pins it\n"}
