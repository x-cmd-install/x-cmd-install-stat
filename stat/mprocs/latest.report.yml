17:13Z"},{"id":623033487,"node_id":"RA_kwDOF-wLEc4lIryP","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":664,"digest":"sha256:2213afa2fac1a6e53e43b213ce52272ad573a1ec9f820d3acb8839acbf6b84fb","download_count":20,"created_at":"2026-10-08T21:17:12Z","updated_at":"2026-10-08T21:17:12Z"}],"body":"- Install from npm (`npm install -g @dekit/cli`) or PyPI\n  (`pip install dekit-cli`)\n- The console groups tasks by path: `web/api` and `web/ui` sit under a\n  `web/` group that collapses and expands with `<h>` and `<l>`\n- `dekit ls` and the console list tasks in the order of `dekit.yaml`\n- `q` in the console asks how to quit: `q` down, `x` quit without saving,\n  `d` detach\n- `dekit` with no command starts the runner like `dekit up` when it is not\n  running\n- A binary started as `mprocs` (through a link) runs `dekit mprocs`\n- `dekit update` updates only a dekit from the install script; for other\n  installs it says to update that way\n"}
