{"id":256872314,"author":{"login":"mojavelinux","id":79351,"node_id":"MDQ6VXNlcjc5MzUx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAEUE484PT496","tag_name":"v2.0.26","target_commitish":"main","name":"v2.0.26","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-10-24T01:49:42Z","updated_at":"2025-10-24T01:52:31Z","published_at":"2025-10-24T01:52:31Z","assets":[],"body":"This is a patch release in the 2.0.x release line to fix bugs and make a few minor improvements.\r\n\r\nAttribute references in the attrlist of the toc macro are now resolved, as documented. If the stem macro uses invalid substitutions, the warning message will cite the stem macro rather than the passthrough macro. When converting to DocBook, the quoted text is no longer used to set the xreflabel as this leads to invalid XML.\r\n\r\nThe HTML now loads the MathJax configuration to support stem integration as recommended by MathJax itself (https://docs.mathjax.org/en/latest/output/html.html#html-support). In the manpage output, a thin space is used in between the dots of an ellipsis to distinguish it from three consecutive dots by making it wider.\r\n\r\n## Distribution\r\n\r\n- [RubyGem (asciidoctor)](https://rubygems.org/gems/asciidoctor)\r\n\r\nAsciidoctor is also packaged for [Fedora](https://apps.fedoraproject.org/packages/rubygem-asciidoctor), [Debian](https://packages.debian.org/sid/asciidoctor), [Ubuntu](https://packages.ubuntu.com/search?keywords=asciidoctor), [Alpine Linux](https://pkgs.alpinelinux.org/packages?name=asciidoctor), [OpenSUSE](https://software.opensuse.org/package/rubygem-asciidoctor), and [Homebrew](https://formulae.brew.sh/formula/asciidoctor). You can use the system's package manager to install the package named **asciidoctor**.\r\n\r\n## Changelog\r\n\r\n### Improvement\r\n\r\n* Use MathJax config recommended by MathJax itself; see https://docs.mathjax.org/en/latest/output/html.html#html-support (#4424)\r\n* Use thin space between dots of an ellipsis (U+2026) in manpage output (#4568)\r\n\r\n### Bug Fixes\r\n\r\n* Don't use text of span as value of xreflabel when node has ID in DocBook output (#4539)\r\n* Resolve attribute references (attributes substitution) in attrlist of toc macro (#4806)\r\n* Cite stem macro specifically in warning message when macro has invalid substitutions (#4808)\r\n\r\n## Release meta\r\n\r\nReleased on: 2025-10-23\r\nReleased by: @mojavelinux\r\nRelease beer: Oktoberfest by Athletic Brewing\r\n\r\nLogs: [resolved issues](https://github.com/asciidoctor/asciidoctor/issues?q=is%3Aissue+label%3Av2.0.26+is%3Aclosed) | [source diff](https://github.com/asciidoctor/asciidoctor/compare/v2.0.25...v2.0.26) | [gem diff](https://my.diffend.io/gems/asciidoctor/v2.0.25/v2.0.26)\r\n\r\n## Credits\r\n\r\nA very special thanks to all the **awesome** [supporters of the Asciidoctor OpenCollective campaign](https://opencollective.com/asciidoctor), who provide critical funding for the ongoing development of this project.","reactions":{"total_count":8,"+1":1,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":4,"rocket":1,"eyes":0},"mentions_count":1}
