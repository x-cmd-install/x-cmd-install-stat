node_id":"RA_kwDOP1JGW84lX-Kf","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3160936,"digest":"sha256:6bd40ba587456c62a9031920c37a969f853d529d399c443953ee6d7a40df84de","download_count":2,"created_at":"2026-10-10T04:55:32Z","updated_at":"2026-10-10T04:55:32Z"},{"id":627040921,"node_id":"RA_kwDOP1JGW84lX-KZ","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:39db396d2b377a97be440acb78eb97c35f53d06f9a187dd776fa4f1087bea298","download_count":55,"created_at":"2026-10-10T04:55:32Z","updated_at":"2026-10-10T04:55:32Z"},{"id":627040924,"node_id":"RA_kwDOP1JGW84lX-Kc","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4348176,"digest":"sha256:0f1de1998aca17e6430c5ec2608c57a7e9ca78e1623179bac40b77bed852b804","download_count":10,"created_at":"2026-10-10T04:55:32Z","updated_at":"2026-10-10T04:55:32Z"},{"id":627040928,"node_id":"RA_kwDOP1JGW84lX-Kg","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4218210,"digest":"sha256:2599c66a2206f0fb7ba5ddfe57e226472086b851091bcbf546046ca4254b0ece","download_count":46,"created_at":"2026-10-10T04:55:32Z","updated_at":"2026-10-10T04:55:32Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Clean leaves what is still in use**: `mo clean` no longer deletes `__pycache__`, `.dart_tool`, Flutter `build/` or `.next/cache` folders that Git tracks or that hold another repository, keeps the DiagnosticReports folder so crash reports still save, and no longer asks for your password later once you skip admin access at the start.\n2. **One slow tool no longer ends the clean**: When `go clean` times out or an npm cache command fails, Mole skips that step and keeps going, and Ctrl-C during Homebrew, bun, simctl or tart cleanup now stops the whole clean right away.\n3. **Faster clean and purge**: Large files measures its rows in parallel and now shows the big Simulator and DerivedData folders it used to miss, and a purge dry run over a large projects folder dropped from about 27 s to 12 s.\n4. **Dry run matches the real clean**: `mo clean --dry-run` lists every Trash item the real run empties, and browser code-signature clones no longer inflate the reclaimable total.\n5. **Uninstall list opens faster**: `mo uninstall` shows its list without the blank pause (about 0.9 s instead of 1.6 s on a Mac with 37 apps) and no longer rescans every installer receipt on the first run each hour. S and O sort by name before sizes load, and `/` search matches spaces and punctuation as typed.\n6. **Uninstall keeps data a second copy still uses**: Removing a Beta or Nightly build next to the stable app keeps the data they share, and the summary says once why that data stayed.\n7. **Update notices only for real releases**: After an interactive command, Mole mentions a new version only after it is published, and looks it up about once a day.\n8. **Optimize leaves your VPN alone**: `mo optimize` skips the DNS flush while a VPN is connected, so WireGuard-style clients stop reconnecting, and login item checks stopped by permissions or a time limit show as unavailable instead of failed.\n9. **History groups each run**: `mo history` keeps a run's actions together even when runs overlap or one was cut short, and a file name can no longer fake an entry.\n10. **Homebrew leftovers on one line**: `mo clean` lists unused Homebrew dependencies on one line with the `brew autoremove` command, and still leaves removing them to you.\n11. **Nix support**: Mole can be installed, upgraded and removed with Nix on macOS.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u6e05\u7406\u65f6\u4e0d\u52a8\u8fd8\u5728\u7528\u7684\u4e1c\u897f**\uff1aGit \u8ddf\u8e2a\u7740\u7684\u3001\u6216\u8005\u91cc\u9762\u8fd8\u5957\u7740\u4ed3\u5e93\u7684 `__pycache__`\u3001`.dart_tool`\u3001Flutter `build/` \u548c `.next/cache` \u4e0d\u518d\u88ab\u5220\uff0cDiagnosticReports \u76ee\u5f55\u672c\u8eab\u4f1a\u7559\u7740\uff0c\u5d29\u6e83\u62a5\u544a\u4e5f\u5c31\u80fd\u6b63\u5e38\u5199\u8fdb\u53bb\uff0c\u5f00\u5934\u8df3\u8fc7\u7ba1\u7406\u5458\u6743\u9650\u540e\uff0c\u540e\u9762\u4e5f\u4e0d\u4f1a\u518d\u627e\u4f60\u8981\u5bc6\u7801\u3002\n2. **\u4e00\u4e2a\u5de5\u5177\u5361\u4f4f\u4e0d\u4f1a\u62d6\u57ae\u6574\u8f6e\u6e05\u7406**\uff1a`go clean` \u8d85\u65f6\u6216\u8005 npm \u7f13\u5b58\u547d\u4ee4\u62a5\u9519\u65f6\uff0cMole \u53ea\u8df3\u8fc7\u8fd9\u4e00\u6b65\u63a5\u7740\u6e05\uff0c\u6e05 Homebrew\u3001bun\u3001simctl \u548c tart \u65f6\u6309 Ctrl-C \u4e5f\u80fd\u9a6c\u4e0a\u505c\u4e0b\u6765\u3002\n3. **clean \u548c purge \u5feb\u4e86\u4e0d\u5c11**\uff1aLarge files \u6539\u6210\u5e76\u884c\u6d4b\u91cf\uff0c\u4ee5\u524d\u6f0f\u6389\u7684\u5927\u5757 Simulator \u548c DerivedData \u76ee\u5f55\u4e5f\u80fd\u663e\u793a\u51fa\u6765\uff0c\u5bf9\u4e00\u4e2a\u5927\u9879\u76ee\u76ee\u5f55\u505a purge \u9884\u89c8\u4ece 27 \u79d2\u5de6\u53f3\u964d\u5230 12 \u79d2\u3002\n4. **\u9884\u89c8\u548c\u771f\u6e05\u7406\u5bf9\u5f97\u4e0a\u4e86**\uff1a`mo clean --dry-run` \u4f1a\u5217\u51fa\u771f\u6e05\u7406\u65f6\u8981\u6e05\u7a7a\u7684\u6bcf\u4e00\u9879\u5e9f\u7eb8\u7bd3\u5185\u5bb9\uff0c\u6d4f\u89c8\u5668\u4ee3\u7801\u7b7e\u540d\u514b\u9686\u4e5f\u4e0d\u4f1a\u518d\u628a\u53ef\u56de\u6536\u7a7a\u95f4\u7b97\u5927\u3002\n5. **\u5378\u8f7d\u5217\u8868\u51fa\u5f97\u66f4\u5feb**\uff1a`mo uninstall` \u51fa\u5217\u8868\u524d\u4e0d\u518d\u767d\u5c4f\uff0c\u4e00\u53f0\u88c5\u4e86 37 \u4e2a App \u7684 Mac \u4e0a\u4ece 1.6 \u79d2\u964d\u5230 0.9 \u79d2\u5de6\u53f3\uff0c\u6bcf\u5c0f\u65f6\u7b2c\u4e00\u6b21\u6253\u5f00\u4e5f\u4e0d\u7528\u91cd\u626b\u4e00\u904d\u5b89\u88c5\u5305\u56de\u6267\uff0cS \u548c O \u5728\u5927\u5c0f\u8fd8\u6ca1\u7b97\u5b8c\u65f6\u5c31\u80fd\u6309\u540d\u5b57\u6392\u5e8f\uff0c`/` \u641c\u7d22\u65f6\u7a7a\u683c\u548c\u6807\u70b9\u7167\u539f\u6837\u5339\u914d\u3002\n6. **\u5378\u8f7d\u65f6\u7559\u4e0b\u53e6\u4e00\u4e2a\u7248\u672c\u8fd8\u5728\u7528\u7684\u6570\u636e**\uff1a\u5378\u8f7d\u548c\u6b63\u5f0f\u7248\u5e76\u5b58\u7684 Beta \u6216 Nightly \u65f6\uff0c\u4e24\u8005\u5171\u7528\u7684\u6570\u636e\u4f1a\u7559\u7740\uff0c\u6c47\u603b\u91cc\u53ea\u8bf4\u4e00\u6b21\u4e3a\u4ec0\u4e48\u7559\u4e0b\u3002\n7. **\u53ea\u63d0\u793a\u771f\u6b63\u53d1\u5e03\u4e86\u7684\u65b0\u7248\u672c**\uff1a\u4ea4\u4e92\u5f0f\u547d\u4ee4\u8dd1\u5b8c\u540e\uff0c\u6709\u6b63\u5f0f\u53d1\u5e03\u7684\u65b0\u7248\u672c\u624d\u4f1a\u63d0\u793a\uff0c\u5927\u7ea6\u4e00\u5929\u67e5\u4e00\u6b21\u3002\n8. **\u4f18\u5316\u65f6\u4e0d\u78b0 VPN**\uff1aVPN \u8fde\u7740\u65f6 `mo optimize` \u4f1a\u8df3\u8fc7 DNS \u7f13\u5b58\u5237\u65b0\uff0cWireGuard \u8fd9\u7c7b\u5ba2\u6237\u7aef\u4e0d\u7528\u6bcf\u6b21\u90fd\u91cd\u8fde\uff0c\u767b\u5f55\u9879\u68c0\u67e5\u56e0\u4e3a\u6743\u9650\u6216\u8d85\u65f6\u6ca1\u8dd1\u5b8c\u65f6\uff0c\u663e\u793a\u4e3a\u4e0d\u53ef\u7528\u800c\u4e0d\u662f\u5931\u8d25\u3002\n9. **\u5386\u53f2\u8bb0\u5f55\u6309\u6bcf\u4e00\u8f6e\u5206\u597d**\uff1a`mo history` \u4f1a\u628a\u540c\u4e00\u8f6e\u7684\u64cd\u4f5c\u653e\u5728\u4e00\u8d77\uff0c\u51e0\u8f6e\u91cd\u53e0\u6216\u8005\u4e2d\u9014\u88ab\u6253\u65ad\u4e5f\u4e0d\u4f1a\u6df7\uff0c\u6587\u4ef6\u540d\u4e5f\u6ca1\u6cd5\u518d\u4f2a\u9020\u51fa\u4e00\u6761\u8bb0\u5f55\u3002\n10. **Homebrew \u591a\u4f59\u4f9d\u8d56\u53ea\u5360\u4e00\u884c**\uff1a`mo clean` \u628a\u53ef\u4ee5\u79fb\u9664\u7684 Homebrew \u4f9d\u8d56\u5408\u6210\u4e00\u884c\uff0c\u9644\u4e0a\u8981\u8dd1\u7684 `brew autoremove`\uff0c\u5220\u4e0d\u5220\u8fd8\u662f\u4f60\u6765\u5b9a\u3002\n11. **\u652f\u6301 Nix**\uff1a\u73b0\u5728\u53ef\u4ee5\u5728 macOS \u4e0a\u7528 Nix \u5b89\u88c5\u3001\u5347\u7ea7\u548c\u5378\u8f7d Mole\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @cdeil \u00b7 @Yuxin-Qiao \u00b7 @M-Hassan-Raza \u00b7 @md786-dotcom \u00b7 @HaraldNordgren \u00b7 @lylythechosenone \u00b7 @devcsb \u00b7 @jgreen417 \u00b7 @fhello23 \u00b7 @timonwong \u00b7 @dhjo70 \u00b7 @Pimzino.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":21,"+1":6,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":4,"rocket":3,"eyes":2},"mentions_count":12}
