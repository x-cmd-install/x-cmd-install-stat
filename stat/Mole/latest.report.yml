RA_kwDOP1JGW84rIFoL","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3250404,"digest":"sha256:e152f172c125a046b62ab78ed9741b13ea13e59bcec671680fd78d5098b8b40b","download_count":133,"created_at":"2026-11-08T09:55:07Z","updated_at":"2026-11-08T09:55:07Z"},{"id":723540496,"node_id":"RA_kwDOP1JGW84rIFoQ","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:51dd9af8f0eddd92532e402564b30f243ae3e1c6d7a873ff99b47a8ddd59acf2","download_count":1514,"created_at":"2026-11-08T09:55:07Z","updated_at":"2026-11-08T09:55:07Z"},{"id":723540494,"node_id":"RA_kwDOP1JGW84rIFoO","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4414272,"digest":"sha256:c074e10fdb7720d0dd67d7b7edfe57c7fedb3932c569e7927f5dd6ffb2babe95","download_count":343,"created_at":"2026-11-08T09:55:07Z","updated_at":"2026-11-08T09:55:07Z"},{"id":723540492,"node_id":"RA_kwDOP1JGW84rIFoM","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4268290,"digest":"sha256:89f874d5caa1f3f262e91832501118069c4eefe49fd1b156c11687e522334cc9","download_count":1158,"created_at":"2026-11-08T09:55:07Z","updated_at":"2026-11-08T09:55:07Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. Developer tools keep working after a clean: `mo clean` no longer removes the Cypress and Camoufox downloads in `~/Library/Caches` that those tools need to run, and it leaves Chrome's cache and the caches of running Electron apps such as Docker Desktop and VS Code alone.\n2. `mo purge` keeps your folder list: A `purge_paths` file that cannot be read, a broken link or a folder in its place now stops with the reason instead of scanning other folders or overwriting it, and a last line without a newline is no longer lost.\n3. More projects in `mo purge`: `~/Developer` joins the default search paths, T3 Code worktrees are covered, and `mo purge --paths` opens editor commands with arguments such as `code --wait`.\n4. Docker stays local: With a remote Docker context selected, `mo clean` and `mo optimize` no longer report on the remote engine or wait for one that does not answer.\n5. T3 Code preview caches: `mo clean` clears them while T3 Code is closed, and sign-ins and site data stay.\n6. DNS refresh on macOS 27: `mo optimize` refreshes the network cache again instead of skipping that step.\n7. Names line up: Korean, Chinese, accented and emoji names fit their columns in `mo status`, `mo analyze` and `mo uninstall --list`.\n8. Fewer false alarms: Current Homebrew services are no longer treated as orphaned, a custom `timeout` on PATH can no longer cancel a clean, and a clock set back no longer keeps old cached results.\n\n### 更新日志\n\n1. 清理后开发工具照常可用：`mo clean` 不再删除 `~/Library/Caches` 里 Cypress 和 Camoufox 运行要用的文件，也不再动 Chrome 的缓存，以及 Docker Desktop、VS Code 这类运行中 Electron 应用的缓存。\n2. `mo purge` 不再弄丢目录配置：`purge_paths` 读不了、是失效链接或被目录占位时，会停下来说明原因，不再扫别的目录或覆盖它，最后一行没有换行符也不会丢。\n3. `mo purge` 覆盖更多项目：默认搜索路径加上 `~/Developer`，支持 T3 Code 的 worktree，`mo purge --paths` 也能打开 `code --wait` 这种带参数的编辑器。\n4. Docker 只看本机：选了远程 Docker context 时，`mo clean` 和 `mo optimize` 不再显示远程引擎的数据，也不用等连不上的主机。\n5. 清理 T3 Code 预览缓存：T3 Code 关闭时 `mo clean` 会清理这部分缓存，登录状态和站点数据都会保留。\n6. macOS 27 上的 DNS 刷新：`mo optimize` 又能刷新网络缓存了，不再跳过这一步。\n7. 名字对齐：韩文、中文、带重音和 emoji 的名字在 `mo status`、`mo analyze` 和 `mo uninstall --list` 里都能对齐。\n8. 减少误判：当前 Homebrew 服务不再被当成孤立服务，PATH 里自定义的 `timeout` 不会再中断清理，系统时间调回去后也不会一直用旧缓存。\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @viniciusdsandrade · @LaansDole · @r266-tech · @po-et · @devtobi · @HiteshRohira · @mikeumus · @kevin9327 · @pro100andrey · @BIRSAx2 · @tslays.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":14,"+1":3,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":4,"rocket":2,"eyes":1},"mentions_count":11}
