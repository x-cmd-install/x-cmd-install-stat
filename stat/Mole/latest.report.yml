align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. Reclaim space from idle browser copies: Cleanup now removes the old signing clones Brave, Microsoft Edge and ego lite leave behind, which can hold several gigabytes, and keeps every clone while the browser is running.\n2. See other local disks in Analyze: The `mo analyze` overview lists mounted local volumes, skipping network, read-only and hidden mounts.\n3. Clearer free space in Status: The main disk line shows space you can use right now, with purgeable space kept in the details.\n4. Slimming respects your whitelist: `mo slim` rechecks whitelist protection before scanning and before replacing an app, so excluded apps stay untouched.\n5. Network refresh on macOS 27: When macOS refuses to restart the DNS service, `mo optimize` reports that step as skipped instead of failed.\n6. Protect more live state: Cleanup keeps the Kitty graphics cache and Jupyter connection files, and `mo analyze` refuses to move a folder that holds known runtime state.\n7. More accurate dry runs: A dry run counts each cleanup target once instead of measuring it twice.\n8. Fewer Mole leftovers and missed updates: `mo clean` sweeps old analyzer cache files, Mole removes temp files that interrupted runs left behind, and the update notice now waits longer and follows the macOS system proxy.\n\n### 更新日志\n\n1. 清理闲置的浏览器副本：清理会移除 Brave、Microsoft Edge 和 ego lite 留下的旧签名副本，这些副本可能占好几个 GB，浏览器运行时全部保留。\n2. Analyze 能看到其他本地磁盘：`mo analyze` 总览会列出已挂载的本地卷，网络、只读和隐藏的卷不会出现。\n3. Status 的可用空间更清楚：主磁盘一行显示马上能用的空间，可清除空间放在详情里。\n4. 瘦身遵守白名单：`mo slim` 在扫描前和替换应用前都会重新检查白名单，被排除的应用不会被改动。\n5. macOS 27 上的网络刷新：系统拒绝重启 DNS 服务时，`mo optimize` 把这一步标为跳过，不再报失败。\n6. 保护更多正在使用的数据：清理会保留 Kitty 图形缓存和 Jupyter 连接文件，`mo analyze` 不会移走含有已知运行状态的文件夹。\n7. 预览更准确：dry run 每个清理项只计算一次，不再重复测量。\n8. 减少 Mole 自己的残留和漏掉的更新提示：`mo clean` 会清理旧版分析缓存，Mole 也会清掉中断运行留下的临时文件，更新提示等待更久，并会走 macOS 系统代理。\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @hawkff · @viniciusdsandrade · @r266-tech · @tslays · @Cyb3rN8 · @AlephTheOne · @drybx.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":18,"+1":5,"-1":0,"laugh":1,"hooray":4,"confused":0,"heart":5,"rocket":2,"eyes":1},"mentions_count":7}
