7,"node_id":"RA_kwDOP1JGW84kMs0V","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3141434,"digest":"sha256:29cbe9dcdc13199f9d03d0105066abc3562547eff890e2311bef5334230cc32e","download_count":42,"created_at":"2026-10-03T06:45:00Z","updated_at":"2026-10-03T06:45:01Z"},{"id":607309083,"node_id":"RA_kwDOP1JGW84kMs0b","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:ab45ff0a12acd896d76991ad71ac2dcf4b1e58cf8fbccdb25390844ecbec1a72","download_count":602,"created_at":"2026-10-03T06:45:00Z","updated_at":"2026-10-03T06:45:01Z"},{"id":607309078,"node_id":"RA_kwDOP1JGW84kMs0W","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4331200,"digest":"sha256:3671a6848bad6a6ceb0c8af7ee00b8cac800c914ec0e0607f586623631c07f0b","download_count":133,"created_at":"2026-10-03T06:45:00Z","updated_at":"2026-10-03T06:45:01Z"},{"id":607309079,"node_id":"RA_kwDOP1JGW84kMs0X","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4201106,"digest":"sha256:6c6eff7dfb26f6fba15f1444f5d28adf581dcf318d229ee8450f776a3fbfdd4d","download_count":471,"created_at":"2026-10-03T06:45:00Z","updated_at":"2026-10-03T06:45:01Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **More reliable app uninstall**: Verified internal Time Machine snapshot folders no longer prevent app-copy checks from finishing, background items stay tied to the selected app, and retained-file reasons, Finder permission refusals, and reclaimed-space totals are reported more accurately.\n2. **Clean protects renv and uncertain app caches**: Saved whitelists no longer weaken renv protection, app caches stay untouched when running state is unknown, and a read-only probe timeout does not stop unrelated cleanup.\n3. **Purge spends less time waiting on slow checks**: A single slow activity check no longer holds up the whole batch, cancellation stops background checks, and filtering failures no longer repeat discovery.\n4. **Analyze refreshes changed sizes**: After deletion or a directory refresh, Analyze updates affected folder and overview totals instead of restoring outdated sizes from earlier scans.\n5. **Status handles VPN traffic and partial JSON**: Network totals use the active default-route tunnel without counting its carrier twice, and `mo status --json` preserves usable measurements when one collector fails.\n6. **Developer space and cache cleanup**: FVM Flutter SDKs and Codex worktrees get read-only size rows, worktree listings avoid duplicates, and VS Code and Cursor extension download caches are cleaned again.\n7. **History separates simultaneous commands**: Overlapping runs of different commands keep their own operations and totals instead of mixing into one history entry.\n8. **Clearer terminal progress**: Loading uses a centered 2\u00d72 shape, real cleanup results use the same capacity colors as previews, and the installer spinner no longer stops unexpectedly.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u5378\u8f7d\u6b8b\u7559\u5904\u7406\u66f4\u51c6\u786e**\uff1a\u68c0\u67e5 app \u526f\u672c\u65f6\uff0c\u4e0d\u518d\u88ab\u5df2\u786e\u8ba4\u7684 Time Machine \u5185\u90e8\u5feb\u7167\u76ee\u5f55\u963b\u65ad\uff0c\u540e\u53f0\u9879\u76ee\u91cd\u65b0\u6838\u5bf9\u5f52\u5c5e\uff0c\u4fdd\u7559\u6587\u4ef6\u4f1a\u8bf4\u660e\u539f\u56e0\uff0cFinder \u6743\u9650\u63d0\u793a\u548c\u91ca\u653e\u5bb9\u91cf\u7edf\u8ba1\u4e5f\u5df2\u4fee\u6b63\u3002\n2. **Clean \u4fdd\u7559 renv \u548c\u72b6\u6001\u672a\u77e5\u7684 app \u7f13\u5b58**\uff1a\u4fdd\u5b58\u767d\u540d\u5355\u540e\u4ecd\u4f1a\u4fdd\u62a4 renv\uff0c\u65e0\u6cd5\u786e\u8ba4\u8fd0\u884c\u72b6\u6001\u7684 app \u7f13\u5b58\u4f1a\u4fdd\u7559\uff0c\u53ea\u8bfb\u68c0\u67e5\u8d85\u65f6\u4e5f\u4e0d\u4f1a\u4e2d\u65ad\u5176\u4ed6\u6e05\u7406\u3002\n3. **Purge \u4e0d\u518d\u88ab\u5355\u4e2a\u6162\u68c0\u67e5\u62d6\u4f4f\u6574\u6279\u9879\u76ee**\uff1a\u9879\u76ee\u6d3b\u52a8\u68c0\u67e5\u5e76\u884c\u6267\u884c\uff0c\u53d6\u6d88\u4f1a\u505c\u6b62\u540e\u53f0\u68c0\u67e5\uff0c\u7b5b\u9009\u5931\u8d25\u65f6\u4e0d\u518d\u91cd\u590d\u626b\u63cf\u3002\n4. **Analyze \u5220\u9664\u548c\u5237\u65b0\u540e\u66f4\u65b0\u5bb9\u91cf**\uff1a\u53d7\u5f71\u54cd\u7684\u6587\u4ef6\u5939\u548c\u603b\u89c8\u4f1a\u91cd\u65b0\u6d4b\u91cf\uff0c\u8f83\u65e9\u7684\u626b\u63cf\u7ed3\u679c\u4e0d\u518d\u628a\u65e7\u6570\u5b57\u5e26\u56de\u6765\u3002\n5. **Status \u4fee\u6b63 VPN \u6d41\u91cf\u5e76\u4fdd\u7559\u53ef\u7528\u6570\u636e**\uff1a\u4f7f\u7528\u9ed8\u8ba4 VPN \u96a7\u9053\u65f6\u4e0d\u518d\u4e0e\u5e95\u5c42\u7f51\u5361\u91cd\u590d\u8ba1\u7b97\u6d41\u91cf\uff0c`mo status --json` \u5728\u67d0\u4e2a\u91c7\u96c6\u6b65\u9aa4\u5931\u8d25\u65f6\u4ecd\u4f1a\u8f93\u51fa\u5df2\u83b7\u53d6\u7684\u53ef\u7528\u6570\u636e\u3002\n6. **\u5f00\u53d1\u5de5\u5177\u5360\u7528\u4e0e\u7f13\u5b58\u6e05\u7406**\uff1a\u5927\u6587\u4ef6\u68c0\u67e5\u65b0\u589e FVM Flutter SDK \u548c Codex worktree \u7684\u53ea\u8bfb\u4f53\u79ef\u63d0\u793a\uff0cworktree \u4e0d\u518d\u91cd\u590d\u5217\u51fa\uff0cVS Code \u548c Cursor \u7684\u6269\u5c55\u4e0b\u8f7d\u7f13\u5b58\u4e5f\u6062\u590d\u6e05\u7406\u3002\n7. **\u540c\u65f6\u8fd0\u884c\u4e0d\u540c\u547d\u4ee4\u65f6\u5386\u53f2\u8bb0\u5f55\u4e0d\u518d\u6df7\u5728\u4e00\u8d77**\uff1a\u4e0d\u540c\u547d\u4ee4\u7684\u64cd\u4f5c\u548c\u7edf\u8ba1\u5206\u522b\u4fdd\u5b58\uff0c\u4e0d\u518d\u6df7\u6210\u4e00\u6761\u5386\u53f2\u8bb0\u5f55\u3002\n8. **\u7ec8\u7aef\u8fdb\u5ea6\u663e\u793a\u66f4\u6e05\u695a**\uff1a\u52a0\u8f7d\u52a8\u753b\u6539\u6210\u5c45\u4e2d\u7684 2\u00d72 \u5f62\u72b6\uff0c\u5b9e\u9645\u6e05\u7406\u7ed3\u679c\u548c\u9884\u89c8\u4f7f\u7528\u540c\u4e00\u5957\u5bb9\u91cf\u989c\u8272\uff0c\u5b89\u88c5\u65f6\u7684\u52a8\u753b\u4e5f\u4e0d\u518d\u610f\u5916\u505c\u4e0b\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @hmate9 \u00b7 @cdeil \u00b7 @M-Hassan-Raza \u00b7 @r266-tech \u00b7 @HaraldNordgren.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with free updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":26,"+1":11,"-1":0,"laugh":2,"hooray":3,"confused":0,"heart":5,"rocket":3,"eyes":2},"mentions_count":5}
