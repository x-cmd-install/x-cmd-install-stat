,"node_id":"RA_kwDOP1JGW84kgC16","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3153313,"digest":"sha256:6a3325e11fedc41776a9a95623ad7869fb254643d4c69d9eb5fa2c7559810bca","download_count":59,"created_at":"2026-10-05T11:30:52Z","updated_at":"2026-10-05T11:30:52Z"},{"id":612380017,"node_id":"RA_kwDOP1JGW84kgC1x","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:497a25298deabf3a28dfed79225ec892e770a277fba09cd198ac9912a696dbe4","download_count":986,"created_at":"2026-10-05T11:30:52Z","updated_at":"2026-10-05T11:30:52Z"},{"id":612380025,"node_id":"RA_kwDOP1JGW84kgC15","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4331200,"digest":"sha256:4e490998a00ef063f4a22d5e9db4a7b37fe86665f2b6205c45bec49fc3a473b6","download_count":246,"created_at":"2026-10-05T11:30:52Z","updated_at":"2026-10-05T11:30:52Z"},{"id":612380024,"node_id":"RA_kwDOP1JGW84kgC14","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4201106,"digest":"sha256:d2e4ed811f9e1bc2017f44b86f6a5841e3d202df17c3e50dabb591718a14d7c6","download_count":725,"created_at":"2026-10-05T11:30:52Z","updated_at":"2026-10-05T11:30:52Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Faster clean and uninstall**: Clean no longer stalls on large Gradle caches (a 2,000-entry build cache went from 24 s to under a second), scan workers pick up the next folder as soon as one finishes instead of waiting for the slowest, uninstall measures preview sizes in parallel, and repeated setup for every log line and Trash move is gone.\n2. **Uninstall finds leftovers again on Macs with a disconnected share**: A network drive left mounted after its server or virtual machine stopped, such as a Parallels Windows drive, no longer makes every uninstall keep the app's leftovers, and when leftovers are kept the reason now shows under that app in the preview.\n3. **Tidier Large files and clean output**: Large files gains a review-only row for Core ML compiled model caches, long paths show their last two folders while the link still opens the full path, and agent versions Mole cannot classify are no longer listed as skipped.\n4. **Clear stop in an inaccessible folder**: Running Mole from a directory it cannot read now stops with one line asking you to `cd ~`, instead of repeating system errors through every step.\n5. **Calmer terminal after menus**: Quitting the main menu with Q or Ctrl+C restores your terminal settings, and keys typed ahead no longer leak into the next menu or confirmation.\n6. **Analyze shows incomplete sizes honestly**: Folders that could only be partly measured are marked as partial or unavailable with a short reason, and the status line fits narrow terminals.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u6e05\u7406\u548c\u5378\u8f7d\u66f4\u5feb\u4e86**\uff1aGradle \u7f13\u5b58\u591a\u7684\u65f6\u5019 clean \u4e0d\u518d\u5361\u4f4f\uff0c2000 \u4e2a\u6761\u76ee\u7684\u6784\u5efa\u7f13\u5b58\u4ece 24 \u79d2\u964d\u5230 1 \u79d2\u4ee5\u5185\uff0c\u626b\u63cf\u65f6\u4e00\u4e2a\u76ee\u5f55\u5904\u7406\u5b8c\u5c31\u7acb\u523b\u63a5\u4e0b\u4e00\u4e2a\uff0c\u4e0d\u518d\u7b49\u6700\u6162\u7684\u90a3\u4e2a\uff0c\u5378\u8f7d\u9884\u89c8\u7684\u5927\u5c0f\u6539\u4e3a\u5e76\u884c\u8ba1\u7b97\uff0c\u6bcf\u5199\u4e00\u884c\u65e5\u5fd7\u3001\u6bcf\u79fb\u52a8\u4e00\u6b21\u5e9f\u7eb8\u7bd3\u4e5f\u4e0d\u518d\u91cd\u590d\u505a\u51c6\u5907\u5de5\u4f5c\u3002\n2. **\u6302\u7740\u65ad\u5f00\u7684\u7f51\u7edc\u76d8\u65f6\u5378\u8f7d\u4e5f\u80fd\u6e05\u6b8b\u7559\u4e86**\uff1a\u670d\u52a1\u5668\u6216\u865a\u62df\u673a\u5df2\u7ecf\u505c\u6389\u3001\u4f46\u7f51\u7edc\u76d8\u8fd8\u6302\u5728\u7cfb\u7edf\u91cc\u65f6\uff0c\u6bd4\u5982 Parallels \u91cc Windows \u7684 C \u76d8\uff0c\u5378\u8f7d\u4e0d\u4f1a\u518d\u56e0\u6b64\u4fdd\u7559\u6240\u6709\u6b8b\u7559\uff0c\u771f\u7684\u4fdd\u7559\u65f6\u539f\u56e0\u4f1a\u663e\u793a\u5728\u9884\u89c8\u91cc\u5bf9\u5e94 app \u7684\u4e0b\u9762\u3002\n3. **Large files \u548c\u6e05\u7406\u8f93\u51fa\u66f4\u6e05\u723d**\uff1aLarge files \u65b0\u589e Core ML \u7f16\u8bd1\u6a21\u578b\u7f13\u5b58\u7684\u53ea\u8bfb\u5927\u5c0f\u63d0\u793a\uff0c\u8fc7\u957f\u7684\u8def\u5f84\u53ea\u663e\u793a\u6700\u540e\u4e24\u7ea7\u76ee\u5f55\uff0c\u70b9\u5f00\u94fe\u63a5\u4ecd\u662f\u5b8c\u6574\u8def\u5f84\uff0c\u65e0\u6cd5\u5224\u65ad\u5f53\u524d\u7248\u672c\u7684 AI \u5de5\u5177\u4e5f\u4e0d\u518d\u5217\u51fa\u8df3\u8fc7\u8bb0\u5f55\u3002\n4. **\u5f53\u524d\u76ee\u5f55\u65e0\u6cd5\u8bbf\u95ee\u65f6\u76f4\u63a5\u8bf4\u6e05\u695a**\uff1a\u5728 Mole \u8bfb\u4e0d\u5230\u7684\u76ee\u5f55\u91cc\u8fd0\u884c\u65f6\uff0c\u4f1a\u7528\u4e00\u884c\u63d0\u793a\u8ba9\u4f60\u5148 `cd ~`\uff0c\u4e0d\u518d\u6bcf\u4e00\u6b65\u90fd\u91cd\u590d\u5237\u7cfb\u7edf\u62a5\u9519\u3002\n5. **\u83dc\u5355\u9000\u51fa\u540e\u7ec8\u7aef\u6062\u590d\u6b63\u5e38**\uff1a\u5728\u4e3b\u83dc\u5355\u6309 Q \u6216 Ctrl+C \u9000\u51fa\u540e\u7ec8\u7aef\u8bbe\u7f6e\u4f1a\u6062\u590d\uff0c\u63d0\u524d\u6572\u4e0b\u7684\u6309\u952e\u4e5f\u4e0d\u4f1a\u6f0f\u5230\u4e0b\u4e00\u4e2a\u83dc\u5355\u6216\u786e\u8ba4\u63d0\u793a\u91cc\u3002\n6. **Analyze \u5982\u5b9e\u6807\u51fa\u4e0d\u5b8c\u6574\u7684\u5927\u5c0f**\uff1a\u53ea\u6d4b\u5230\u4e00\u90e8\u5206\u7684\u6587\u4ef6\u5939\u4f1a\u6807\u4e3a\u90e8\u5206\u6216\u4e0d\u53ef\u7528\uff0c\u5e76\u9644\u4e0a\u7b80\u77ed\u539f\u56e0\uff0c\u72b6\u6001\u680f\u5728\u7a84\u7ec8\u7aef\u91cc\u4e5f\u80fd\u653e\u4e0b\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @cdeil \u00b7 @Yuxin-Qiao \u00b7 @r266-tech \u00b7 @justpwned.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with free updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":22,"+1":8,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":2,"rocket":5,"eyes":1},"mentions_count":4}
