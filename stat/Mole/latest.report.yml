e_id":"RA_kwDOP1JGW84mW5S2","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3179922,"digest":"sha256:652c7be7009004f90b53dfbbea3ff5f7d5ec584decb945be18fe73ed6756c86b","download_count":34,"created_at":"2026-10-15T10:44:53Z","updated_at":"2026-10-15T10:44:53Z"},{"id":643536041,"node_id":"RA_kwDOP1JGW84mW5Sp","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:e5c741f30f8b81046b6e5dca9d701a3699816fe89473e3a3812f6a9f6dcd0652","download_count":587,"created_at":"2026-10-15T10:44:53Z","updated_at":"2026-10-15T10:44:53Z"},{"id":643536051,"node_id":"RA_kwDOP1JGW84mW5Sz","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4397696,"digest":"sha256:05a5f4c6a158c3863f2c96aad2bac2b411ca54bd3db4cb74bbc5133491ae7caf","download_count":131,"created_at":"2026-10-15T10:44:53Z","updated_at":"2026-10-15T10:44:53Z"},{"id":643536047,"node_id":"RA_kwDOP1JGW84mW5Sv","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4268130,"digest":"sha256:1784f3153397c90cf353e7c55441388bed7ade05449de27c70bae48b67c59d6b","download_count":453,"created_at":"2026-10-15T10:44:53Z","updated_at":"2026-10-15T10:44:53Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Choose which app data to remove**: `mo uninstall` keeps personal data by default, including for Homebrew apps, lets you select exact paths with D before confirming, skips sizing data you keep, and points out configuration files that still reference a removed app without changing them.\n2. **Find more app leftovers**: Uninstall now recognizes PlayCover iOS apps and their launchers, finds Claude Desktop's third-party-provider folders and more app-specific crash caches, and no longer mistakes staged updates for installed copies or unmounted backup folders for unreadable disks.\n3. **Clean old developer files**: Clean now covers unused old Codex daemon releases, stale Homebrew service logs, Apple TV firmware and older visionOS DeviceSupport files, while a Codex marketplace backlog appears as one row instead of repeating for every folder.\n4. **Keep media and shared app data**: Automatic cleaning preserves Final Cut Pro generated media, Jianying rendered footage, Spotify offline music and current wallpaper renders, while uninstall protects shared Unity and Epic folders, neighboring IDE data, Raycast clipboard images and Mullvad Browser profiles, and avoids stopping unrelated Electron apps or cleaning protected security agents.\n5. **Report disk space more accurately**: Analyze counts fully shared APFS clones once during file-by-file scans and keeps equal-size rows in a consistent order, though fast folder estimates can still overcount shared blocks, and uninstall no longer counts containers macOS refused to remove as freed space.\n6. **Leave cloud-only folders online**: `mo purge` skips online-only cloud folders when macOS can identify them, avoiding downloads just to look for build files and preventing those folders from consuming the whole scan budget.\n7. **Keep passwords hidden and cancellation responsive**: Passwords typed while waiting for Touch ID no longer appear on screen, and uninstall and selection menus now stop correctly on interruption, including terminals where spinner shutdown previously hung.\n8. **Stop when exclusions cannot be read**: Clean, purge and optimize stop when your whitelist cannot be read or its location cannot be checked, rather than proceeding without the paths you protected.\n9. **Improve system checks**: Status recovers battery temperature from the battery pack when the usual reading is missing and bounds battery queries, while optimize supports newer recent-item lists, checks the correct launch-agent executable and avoids repeating DNS and Spotlight checks.\n10. **Finish updates and identify development builds**: Updates to custom install folders no longer stop after copying files, macOS installs ignore Windows release tags, failed downloads name the network problem, and `mo --version` shows the commit of a Homebrew HEAD build.\n11. **Use your own nixpkgs**: Nix users can import the Mole package or overlay into their configuration, and documentation or test changes no longer force the package to rebuild.\n12. **Read the guide in more languages**: The README now includes Russian and Ukrainian translations, clearer macOS and Windows entry points, and the official download sources.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u5378\u8f7d\u65f6\u81ea\u5df1\u9009\u62e9\u8981\u5220\u7684\u6570\u636e**\uff1a`mo uninstall` \u9ed8\u8ba4\u4fdd\u7559\u4e2a\u4eba\u6570\u636e\uff0cHomebrew \u5b89\u88c5\u7684 App \u4e5f\u4e00\u6837\uff0c\u786e\u8ba4\u524d\u6309 D \u9009\u62e9\u8981\u5220\u9664\u7684\u5177\u4f53\u8def\u5f84\uff0c\u4fdd\u7559\u7684\u6570\u636e\u4e0d\u518d\u53cd\u590d\u8ba1\u7b97\u5927\u5c0f\uff0c\u5378\u8f7d\u540e\u8fd8\u4f1a\u6307\u51fa\u54ea\u4e9b\u914d\u7f6e\u6587\u4ef6\u4ecd\u5f15\u7528\u8fd9\u4e2a App\uff0c\u4f46\u4e0d\u4f1a\u4fee\u6539\u914d\u7f6e\u3002\n2. **\u8bc6\u522b\u66f4\u591a App \u548c\u6b8b\u7559\u6587\u4ef6**\uff1a\u5378\u8f7d\u73b0\u5728\u80fd\u8bc6\u522b PlayCover \u5b89\u88c5\u7684 iOS App \u548c\u542f\u52a8\u5668\uff0c\u627e\u5230 Claude Desktop \u7b2c\u4e09\u65b9\u670d\u52a1\u914d\u7f6e\u76ee\u5f55\u53ca\u66f4\u591a App \u5d29\u6e83\u7f13\u5b58\uff0c\u4e5f\u4e0d\u4f1a\u518d\u628a\u66f4\u65b0\u6682\u5b58\u526f\u672c\u5f53\u6210\u53e6\u4e00\u4efd\u5b89\u88c5\uff0c\u6216\u628a\u672a\u6302\u8f7d\u7684\u5907\u4efd\u76ee\u5f55\u5f53\u6210\u65e0\u6cd5\u8bfb\u53d6\u7684\u78c1\u76d8\u3002\n3. **\u6e05\u7406\u66f4\u591a\u5f00\u53d1\u5de5\u5177\u65e7\u6587\u4ef6**\uff1a\u65b0\u589e\u6e05\u7406\u4e0d\u518d\u4f7f\u7528\u7684 Codex \u540e\u53f0\u7a0b\u5e8f\u65e7\u7248\u672c\u3001\u8fc7\u671f Homebrew \u670d\u52a1\u65e5\u5fd7\u3001Apple TV \u56fa\u4ef6\u548c\u65e7\u7248 visionOS DeviceSupport\uff0c\u79ef\u538b\u7684 Codex \u63d2\u4ef6\u66f4\u65b0\u6682\u5b58\u6587\u4ef6\u4e5f\u5408\u6210\u4e00\u884c\uff0c\u4e0d\u518d\u9010\u4e2a\u91cd\u590d\u663e\u793a\u3002\n4. **\u4fdd\u7559\u5a92\u4f53\u548c\u5171\u7528\u7684 App \u6570\u636e**\uff1a\u81ea\u52a8\u6e05\u7406\u4f1a\u4fdd\u7559 Final Cut Pro \u751f\u6210\u5a92\u4f53\u3001\u526a\u6620\u6e32\u67d3\u7d20\u6750\u3001Spotify \u79bb\u7ebf\u97f3\u4e50\u548c\u5f53\u524d\u58c1\u7eb8\uff0c\u5378\u8f7d\u65f6\u4e5f\u4f1a\u4fdd\u62a4 Unity\u3001Epic \u7684\u5171\u4eab\u76ee\u5f55\u3001\u5176\u4ed6 IDE \u7684\u6570\u636e\u3001Raycast \u526a\u8d34\u677f\u56fe\u7247\u548c Mullvad Browser \u914d\u7f6e\uff0c\u5e76\u907f\u514d\u9000\u51fa\u65e0\u5173\u7684 Electron App \u6216\u6e05\u7406\u53d7\u4fdd\u62a4\u7684\u5b89\u5168\u8f6f\u4ef6\u670d\u52a1\u3002\n5. **\u7a7a\u95f4\u7edf\u8ba1\u66f4\u51c6\u786e**\uff1aAnalyze \u9010\u6587\u4ef6\u626b\u63cf\u65f6\u4f1a\u5bf9\u5b8c\u5168\u5171\u4eab\u6570\u636e\u5757\u7684 APFS \u514b\u9686\u6587\u4ef6\u53bb\u91cd\uff0c\u540c\u6837\u5927\u5c0f\u7684\u6761\u76ee\u4fdd\u6301\u56fa\u5b9a\u987a\u5e8f\uff0c\u4f46\u5feb\u901f\u76ee\u5f55\u4f30\u7b97\u4ecd\u53ef\u80fd\u91cd\u590d\u8ba1\u7b97\u5171\u4eab\u5757\uff0c\u5378\u8f7d\u65f6\u4e5f\u4e0d\u518d\u628a macOS \u62d2\u7edd\u5220\u9664\u7684\u5bb9\u5668\u8ba1\u5165\u5df2\u6e05\u7406\u7a7a\u95f4\u3002\n6. **\u4e91\u7aef\u6587\u4ef6\u4e0d\u518d\u4e3a\u626b\u63cf\u800c\u4e0b\u8f7d**\uff1amacOS \u80fd\u8bc6\u522b\u4ec5\u5728\u7ebf\u6587\u4ef6\u5939\u65f6\uff0c`mo purge` \u4f1a\u8df3\u8fc7\u8fd9\u4e9b\u76ee\u5f55\uff0c\u4e0d\u518d\u4e3a\u4e86\u67e5\u627e\u6784\u5efa\u6587\u4ef6\u89e6\u53d1\u4e0b\u8f7d\uff0c\u4e5f\u4e0d\u4f1a\u8ba9\u5b83\u4eec\u5360\u6ee1\u626b\u63cf\u65f6\u95f4\u3002\n7. **\u5bc6\u7801\u4e0d\u663e\u793a\uff0c\u53d6\u6d88\u80fd\u9000\u51fa**\uff1a\u7b49\u5f85 Touch ID \u65f6\u8f93\u5165\u7684\u5bc6\u7801\u4e0d\u518d\u663e\u793a\u5728\u7ec8\u7aef\u91cc\uff0c\u5378\u8f7d\u548c\u9009\u62e9\u83dc\u5355\u4e5f\u80fd\u6b63\u786e\u54cd\u5e94\u4e2d\u65ad\uff0c\u4fee\u590d\u4e86\u90e8\u5206\u7ec8\u7aef\u91cc\u505c\u6b62 loading \u65f6\u5361\u4f4f\u7684\u95ee\u9898\u3002\n8. **\u767d\u540d\u5355\u8bfb\u4e0d\u5230\u5c31\u505c\u6b62\u6e05\u7406**\uff1aclean\u3001purge \u548c optimize \u65e0\u6cd5\u8bfb\u53d6\u767d\u540d\u5355\u6216\u68c0\u67e5\u5176\u6240\u5728\u8def\u5f84\u65f6\u4f1a\u505c\u6b62\uff0c\u4e0d\u518d\u6f0f\u6389\u4f60\u4fdd\u62a4\u7684\u8def\u5f84\u540e\u7ee7\u7eed\u6e05\u7406\u3002\n9. **\u7cfb\u7edf\u68c0\u67e5\u66f4\u51c6\u786e**\uff1aStatus \u5728\u5e38\u89c4\u6e29\u5ea6\u8bfb\u6570\u7f3a\u5931\u65f6\u4f1a\u8bfb\u53d6\u7535\u6c60\u7ec4\u6570\u636e\uff0c\u5e76\u9650\u5236\u7535\u6c60\u67e5\u8be2\u7684\u7b49\u5f85\u65f6\u95f4\uff0coptimize \u5219\u652f\u6301\u65b0\u7248\u6700\u8fd1\u4f7f\u7528\u5217\u8868\u3001\u6b63\u786e\u68c0\u67e5\u542f\u52a8\u4ee3\u7406\u7a0b\u5e8f\uff0c\u4e0d\u518d\u91cd\u590d\u8fd0\u884c DNS \u548c Spotlight \u68c0\u67e5\u3002\n10. **\u66f4\u65b0\u80fd\u5b8c\u6210\uff0c\u5f00\u53d1\u7248\u80fd\u533a\u5206**\uff1a\u81ea\u5b9a\u4e49\u5b89\u88c5\u76ee\u5f55\u7684\u66f4\u65b0\u4e0d\u518d\u590d\u5236\u5b8c\u6587\u4ef6\u5c31\u4e2d\u65ad\uff0cmacOS \u5b89\u88c5\u4f1a\u6392\u9664 Windows \u7248\u672c\u6807\u7b7e\uff0c\u4e0b\u8f7d\u5931\u8d25\u4f1a\u8bf4\u660e\u7f51\u7edc\u539f\u56e0\uff0c`mo --version` \u4e5f\u4f1a\u663e\u793a Homebrew HEAD \u6784\u5efa\u7684\u63d0\u4ea4\u6807\u8bc6\u3002\n11. **Nix \u53ef\u63a5\u5165\u81ea\u5df1\u7684\u914d\u7f6e**\uff1aNix \u7528\u6237\u53ef\u4ee5\u76f4\u63a5\u5bfc\u5165 Mole \u5305\u6216 overlay\uff0c\u6587\u6863\u548c\u6d4b\u8bd5\u6539\u52a8\u4e5f\u4e0d\u518d\u89e6\u53d1\u8f6f\u4ef6\u5305\u91cd\u65b0\u6784\u5efa\u3002\n12. **\u589e\u52a0\u4e24\u79cd\u8bed\u8a00\u7684\u4f7f\u7528\u8bf4\u660e**\uff1aREADME \u65b0\u589e\u4fc4\u8bed\u548c\u4e4c\u514b\u5170\u8bed\u7248\u672c\uff0c\u8865\u9f50 macOS\u3001Windows \u5165\u53e3\u548c\u5b98\u65b9\u4e0b\u8f7d\u6765\u6e90\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @Shramkoweb \u00b7 @tfc \u00b7 @viniciusdsandrade \u00b7 @kirinraw \u00b7 @r266-tech \u00b7 @danpalmer \u00b7 @mlsimon734 \u00b7 @Imyukehan \u00b7 @divemasterza \u00b7 @nicodiferd \u00b7 @r26gray \u00b7 @xuanzhangx.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":18,"+1":5,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":4,"rocket":4,"eyes":1},"mentions_count":12}
