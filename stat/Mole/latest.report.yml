"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Clean no longer goes quiet**: After App leftovers, `mo clean` keeps a \"Checking orphaned system services...\" line moving while it rechecks each service, and the Homebrew previews and Apps & utilities now show loading instead of a still screen.\n2. **Trash says why it was skipped**: When your terminal lacks Full Disk Access, `mo clean` prints one line saying so instead of leaving the Trash untouched without a word, and granting that access lets it empty the Trash again.\n3. **Uninstall loading keeps moving**: On a first scan, the \"Preparing app list...\" spinner keeps turning until the app list appears.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u6e05\u7406\u65f6\u4e0d\u518d\u9759\u6b62\u4e0d\u52a8**\uff1aApp leftovers \u4e4b\u540e\u9010\u4e2a\u590d\u67e5\u5b64\u513f\u7cfb\u7edf\u670d\u52a1\u65f6\uff0c\u4f1a\u4e00\u76f4\u663e\u793a \"Checking orphaned system services...\"\uff0cHomebrew \u9884\u89c8\u548c Apps & utilities \u8fd9\u4e24\u6bb5\u4e5f\u90fd\u6709 loading\uff0c\u4e0d\u4f1a\u518d\u4e00\u505c\u597d\u51e0\u79d2\u6ca1\u6709\u4efb\u4f55\u52a8\u9759\u3002\n2. **\u5e9f\u7eb8\u7bd3\u6ca1\u6e05\u4f1a\u8bf4\u660e\u539f\u56e0**\uff1a\u7ec8\u7aef\u6ca1\u6709\u5b8c\u5168\u78c1\u76d8\u8bbf\u95ee\u6743\u9650\u65f6\uff0c`mo clean` \u4f1a\u7528\u4e00\u884c\u63d0\u793a\u8bf4\u51fa\u6765\uff0c\u4e0d\u518d\u4e00\u58f0\u4e0d\u54cd\u5730\u8df3\u8fc7\u5e9f\u7eb8\u7bd3\uff0c\u7ed9\u7ec8\u7aef\u5f00\u4e86\u8fd9\u4e2a\u6743\u9650\u540e\u5c31\u4f1a\u7167\u5e38\u6e05\u7a7a\u3002\n3. **\u5378\u8f7d\u65f6\u7684 loading \u4f1a\u4e00\u76f4\u8f6c**\uff1a\u7b2c\u4e00\u6b21\u626b\u63cf\u65f6\uff0c\"Preparing app list...\" \u4f1a\u4e00\u76f4\u8f6c\u5230 App \u5217\u8868\u51fa\u6765\u3002\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":22,"+1":10,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":5,"rocket":3,"eyes":1}}
