align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Optimize explains more causes of a slow Mac**: performance diagnosis now shows swap pressure and memory-heavy processes, virtual machine memory use, and sustained CPU usage, while failed probes are reported without treating missing data as a healthy result.\n2. **Smoother loading animations**: scan indicators share a consistent dot animation, and Clean updates progress text in place between stages to reduce flicker and make waiting easier to follow.\n3. **Clean reaches more app caches**: adds Feishu/Lark webview caches, WeChat and WeCom container caches and logs, and stale Codex crash reports, with active apps and chat data protected.\n4. **Developer cleanup covers abandoned browser sessions and test devices**: reclaims orphaned Playwright browsers and stale profiles while preserving active sessions, handles Xcode test clones individually, and lists unused simulator runtimes with a manual removal command.\n5. **Purge is easier to review and safer to automate**: improves project search, paging, and selection responsiveness, preserves artifacts containing deployment keys, Git-tracked files, or nested repositories, names candidates it could not inspect, and requires `--yes` for unattended cleanup.\n6. **Clean preserves more state and reports partial results clearly**: leaves Calendar caches alone, adds a whitelist option for Final Cut Pro proxy media, restores obsolete VS Code extension cleanup on macOS 15, and improves external-volume scans and timeout or Trash failure messages.\n7. **Uninstall shows recognizable app names without disrupting other apps**: follows preferred system languages and refreshes names after language changes, recognizes mixed-case `.app` suffixes, and avoids restarting unrelated active extensions such as Shadowrocket's VPN tunnel.\n8. **Analyze and Status make their limits visible**: Analyze explains that deleting an app bundle leaves its support files behind and offers an uninstall command, while Status marks retained process data and alerts as stale when refreshes fail.\n9. **Command output works better in terminals and scripts**: Analyze and Status have dedicated help text, errors go to stderr, and redirected output omits color codes.\n10. **Installation and updates fail earlier with clearer guidance**: checks for macOS 12 or newer and rejects running the installer with sudo before writing files, while Homebrew updates repair launchers that point to removed versions.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **Optimize \u80fd\u770b\u51fa\u66f4\u591a Mac \u53d8\u6162\u7684\u7ebf\u7d22**\uff1a\u6027\u80fd\u8bca\u65ad\u65b0\u589e\u4ea4\u6362\u7a7a\u95f4\u538b\u529b\u3001\u5185\u5b58\u5360\u7528\u8f83\u9ad8\u7684\u8fdb\u7a0b\u3001\u865a\u62df\u673a\u5185\u5b58\u548c\u6301\u7eed CPU \u5360\u7528\uff0c\u68c0\u67e5\u5931\u8d25\u65f6\u4f1a\u660e\u786e\u63d0\u793a\uff0c\u4e0d\u628a\u7f3a\u5c11\u6570\u636e\u5f53\u6210\u6b63\u5e38\u7ed3\u679c\u3002\n2. **Loading \u52a8\u753b\u66f4\u6d41\u7545**\uff1a\u626b\u63cf\u63d0\u793a\u7edf\u4e00\u4f7f\u7528\u5706\u70b9\u52a8\u753b\uff0cClean \u5728\u9636\u6bb5\u5207\u6362\u65f6\u539f\u4f4d\u66f4\u65b0\u8fdb\u5ea6\u6587\u5b57\uff0c\u51cf\u5c11\u95ea\u70c1\uff0c\u8ba9\u7b49\u5f85\u8fc7\u7a0b\u66f4\u6e05\u6670\u3002\n3. **Clean \u652f\u6301\u66f4\u591a\u5e94\u7528\u7f13\u5b58**\uff1a\u65b0\u589e\u98de\u4e66\u548c Lark \u5185\u5d4c\u7f51\u9875\u7f13\u5b58\u3001\u5fae\u4fe1\u548c\u4f01\u4e1a\u5fae\u4fe1\u5bb9\u5668\u5185\u7684\u7f13\u5b58\u4e0e\u65e5\u5fd7\uff0c\u4ee5\u53ca\u8fc7\u671f Codex \u5d29\u6e83\u62a5\u544a\u6e05\u7406\uff0c\u4fdd\u7559\u6b63\u5728\u4f7f\u7528\u7684\u5e94\u7528\u72b6\u6001\u548c\u804a\u5929\u6570\u636e\u3002\n4. **\u5f00\u53d1\u5de5\u5177\u6e05\u7406\u8986\u76d6\u9057\u7559\u6d4f\u89c8\u5668\u548c\u6d4b\u8bd5\u8bbe\u5907**\uff1a\u56de\u6536\u5df2\u5931\u53bb\u6240\u5c5e\u8fdb\u7a0b\u7684 Playwright \u6d4f\u89c8\u5668\u4e0e\u8fc7\u671f\u4e34\u65f6\u914d\u7f6e\uff0c\u4fdd\u7559\u6d3b\u8dc3\u4f1a\u8bdd\uff0c\u9010\u9879\u5904\u7406 Xcode \u6d4b\u8bd5\u514b\u9686\uff0c\u5e76\u5217\u51fa\u65e0\u8bbe\u5907\u4f7f\u7528\u7684\u6a21\u62df\u5668\u8fd0\u884c\u65f6\u53ca\u624b\u52a8\u79fb\u9664\u547d\u4ee4\u3002\n5. **Purge \u66f4\u597d\u67e5\u627e\uff0c\u4e5f\u66f4\u9002\u5408\u811a\u672c\u4f7f\u7528**\uff1a\u6539\u8fdb\u9879\u76ee\u641c\u7d22\u3001\u7ffb\u9875\u548c\u52fe\u9009\u54cd\u5e94\uff0c\u4fdd\u7559\u5305\u542b\u90e8\u7f72\u5bc6\u94a5\u3001Git \u8ddf\u8e2a\u6587\u4ef6\u6216\u5d4c\u5957\u4ed3\u5e93\u7684\u6784\u5efa\u76ee\u5f55\uff0c\u660e\u786e\u5217\u51fa\u65e0\u6cd5\u68c0\u67e5\u7684\u5019\u9009\uff0c\u975e\u4ea4\u4e92\u6e05\u7406\u9700\u8981\u663e\u5f0f\u4f20\u5165 `--yes`\u3002\n6. **Clean \u4fdd\u7559\u66f4\u591a\u5e94\u7528\u72b6\u6001\uff0c\u6e05\u7406\u4e0d\u5b8c\u6574\u65f6\u8bf4\u660e\u539f\u56e0**\uff1a\u4e0d\u518d\u6e05\u7406\u65e5\u5386\u7f13\u5b58\uff0c\u65b0\u589e\u4fdd\u7559 Final Cut Pro \u4ee3\u7406\u5a92\u4f53\u7684\u767d\u540d\u5355\u9009\u9879\uff0c\u6062\u590d macOS 15 \u4e0a\u7684\u8fc7\u671f VS Code \u6269\u5c55\u6e05\u7406\uff0c\u5e76\u6539\u5584\u5916\u63a5\u5377\u626b\u63cf\u3001\u8d85\u65f6\u548c\u5e9f\u7eb8\u7bd3\u6e05\u7406\u5931\u8d25\u63d0\u793a\u3002\n7. **Uninstall \u663e\u793a\u719f\u6089\u7684\u5e94\u7528\u540d\u79f0\uff0c\u51cf\u5c11\u5bf9\u5176\u4ed6\u5e94\u7528\u7684\u5f71\u54cd**\uff1a\u6309\u7cfb\u7edf\u8bed\u8a00\u504f\u597d\u663e\u793a\u540d\u79f0\u5e76\u5728\u5207\u6362\u8bed\u8a00\u540e\u5237\u65b0\uff0c\u8bc6\u522b\u5927\u5c0f\u5199\u6df7\u5408\u7684 `.app` \u540e\u7f00\uff0c\u5378\u8f7d\u65f6\u907f\u514d\u91cd\u542f Shadowrocket VPN \u7b49\u65e0\u5173\u7684\u6d3b\u8dc3\u6269\u5c55\u3002\n8. **Analyze \u548c Status \u7684\u63d0\u793a\u66f4\u51c6\u786e**\uff1aAnalyze \u5220\u9664\u5e94\u7528\u5305\u524d\u4f1a\u8bf4\u660e\u652f\u6301\u6587\u4ef6\u4ecd\u4f1a\u4fdd\u7559\uff0c\u5e76\u7ed9\u51fa\u5378\u8f7d\u547d\u4ee4\uff0cStatus \u5219\u5728\u5237\u65b0\u5931\u8d25\u65f6\u628a\u4fdd\u7559\u7684\u8fdb\u7a0b\u6570\u636e\u548c\u544a\u8b66\u6807\u8bb0\u4e3a\u8fc7\u671f\u3002\n9. **\u547d\u4ee4\u8f93\u51fa\u66f4\u9002\u5408\u7ec8\u7aef\u548c\u811a\u672c**\uff1aAnalyze \u548c Status \u63d0\u4f9b\u4e13\u95e8\u7684\u5e2e\u52a9\u8bf4\u660e\uff0c\u9519\u8bef\u4fe1\u606f\u5199\u5165 stderr\uff0c\u91cd\u5b9a\u5411\u8f93\u51fa\u4e0d\u5e26\u989c\u8272\u63a7\u5236\u7801\u3002\n10. **\u5b89\u88c5\u548c\u66f4\u65b0\u66f4\u65e9\u8bf4\u660e\u95ee\u9898**\uff1a\u5b89\u88c5\u5668\u5728\u5199\u5165\u6587\u4ef6\u524d\u68c0\u67e5 macOS 12 \u6216\u66f4\u65b0\u7248\u672c\uff0c\u5e76\u62d2\u7edd\u901a\u8fc7 sudo \u8fd0\u884c\uff0cHomebrew \u66f4\u65b0\u540e\u53ef\u4fee\u590d\u6307\u5411\u5df2\u79fb\u9664\u7248\u672c\u7684\u542f\u52a8\u5165\u53e3\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @r266-tech \u00b7 @UncleCatWu \u00b7 @M-Hassan-Raza \u00b7 @dare2live \u00b7 @madsondeluna \u00b7 @HAOGRE \u00b7 @tszaks \u00b7 @md786-dotcom \u00b7 @YeJe-cpu \u00b7 @leslieeilsel \u00b7 @mehmetcansahin \u00b7 @Tairraos \u00b7 @felixwluo \u00b7 @ganwurrt \u00b7 @bashu \u00b7 @Xarius86 \u00b7 @hansnow \u00b7 @irl231 \u00b7 @TheViviana.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with lifetime updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n\n","reactions":{"total_count":6,"+1":1,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":19}
