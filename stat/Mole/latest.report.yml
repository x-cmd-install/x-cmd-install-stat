"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Optimize is gentler**: it no longer rebuilds LaunchServices, which dropped VPN tunnels and sent Siri re-indexing, and it only reports LaunchAgents whose program is missing instead of deleting them.\n2. **Clean leaves Gemini's Google state alone**: deleting it while Gemini ran could start a disk write loop of about 50 MB/s.\n3. **Homebrew old versions are cleaned and previewed**: `mo clean` runs `brew cleanup` even with a small download cache, and `mo clean --dry-run` lists each version it would remove.\n4. **A slow check no longer stops the whole run**: a timed-out size or SQLite check now affects only that item.\n5. **Previews and totals count only what goes**: nested items count once, Docker images in use no longer read as reclaimable, and tiny build-artifact hints stay quiet.\n6. **Smaller fixes**: idle Brave Nightly caches are cleaned while another channel runs, VS Code extension cleanup works on macOS 15 again, `mo remove` keeps a custom config directory, and Status shows one more busy process.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **Optimize \u66f4\u514b\u5236**\uff1a\u4e0d\u518d\u91cd\u5efa LaunchServices\uff0c\u907f\u514d VPN \u65ad\u7ebf\u548c Siri \u53cd\u590d\u7d22\u5f15\uff0c\u7a0b\u5e8f\u7f3a\u5931\u7684 LaunchAgent \u4e5f\u6539\u4e3a\u53ea\u62a5\u544a\u4e0d\u5220\u9664\u3002\n2. **Clean \u4e0d\u518d\u52a8 Gemini \u7684 Google \u8eab\u4efd\u6570\u636e**\uff1aGemini \u8fd0\u884c\u65f6\u5220\u6389\u5b83\u4eec\u4f1a\u89e6\u53d1\u6bcf\u79d2\u7ea6 50 MB \u7684\u6301\u7eed\u5199\u76d8\u3002\n3. **Homebrew \u65e7\u7248\u672c\u80fd\u6e05\u7406\u4e5f\u80fd\u9884\u89c8**\uff1a\u4e0b\u8f7d\u7f13\u5b58\u5f88\u5c0f\u65f6 `mo clean` \u4e5f\u4f1a\u6267\u884c `brew cleanup`\uff0c`mo clean --dry-run` \u4f1a\u9010\u4e2a\u5217\u51fa\u5c06\u5220\u9664\u7684\u7248\u672c\u3002\n4. **\u5355\u9879\u68c0\u67e5\u8d85\u65f6\u4e0d\u518d\u4e2d\u65ad\u6574\u8f6e\u6e05\u7406**\uff1a\u4f53\u79ef\u6216 SQLite \u68c0\u67e5\u8d85\u65f6\u53ea\u5f71\u54cd\u8fd9\u4e00\u9879\uff0c\u5176\u4f59\u7167\u5e38\u8fdb\u884c\u3002\n5. **\u9884\u89c8\u548c\u6c47\u603b\u53ea\u7b97\u771f\u6b63\u4f1a\u6e05\u6389\u7684\u90e8\u5206**\uff1a\u5d4c\u5957\u9879\u53ea\u7b97\u4e00\u6b21\uff0c\u6b63\u5728\u4f7f\u7528\u7684 Docker \u955c\u50cf\u4e0d\u518d\u7b97\u4f5c\u53ef\u56de\u6536\uff0c\u5f88\u5c0f\u7684\u6784\u5efa\u4ea7\u7269\u4e5f\u4e0d\u518d\u63d0\u793a\u3002\n6. **\u5176\u4ed6\u7ec6\u8282\u4fee\u590d**\uff1a\u53e6\u4e00\u4e2a Brave \u6e20\u9053\u5f00\u7740\u65f6\u4e5f\u80fd\u6e05\u7406\u7a7a\u95f2\u7684 Nightly \u7f13\u5b58\uff0cVS Code \u65e7\u6269\u5c55\u6e05\u7406\u5728 macOS 15 \u4e0a\u6062\u590d\u6b63\u5e38\uff0c`mo remove` \u4f1a\u4fdd\u7559\u81ea\u5b9a\u4e49\u914d\u7f6e\u76ee\u5f55\uff0cStatus \u8fdb\u7a0b\u5361\u7247\u591a\u663e\u793a\u4e00\u4e2a\u8fdb\u7a0b\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @QianyeSu \u00b7 @TyceHerrman \u00b7 @hawkff \u00b7 @jsiu93 \u00b7 @reorx \u00b7 @md786-dotcom \u00b7 @OPesicka \u00b7 @dominionthedev.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with lifetime updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":31,"+1":12,"-1":0,"laugh":3,"hooray":4,"confused":0,"heart":5,"rocket":5,"eyes":2},"mentions_count":8}
