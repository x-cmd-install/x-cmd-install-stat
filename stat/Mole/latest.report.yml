}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Slim universal apps on Apple Silicon**: `mo slim` removes the Intel code from apps you own, slims each one on a copy that must pass code signing and Gatekeeper checks before it replaces the original, moves the original to the Trash, and needs no developer tools; preview with `mo slim --dry-run`.\n2. **Let your AI agent drive Mole**: The official Mole skill teaches Claude Code, Codex, Cursor and other agents to preview every cleanup with `--dry-run` and leave uninstalls and admin steps to you; install it with `npx skills add tw93/Mole -a claude-code codex cursor -g -y`.\n3. **Uninstall with personal data selected**: `mo uninstall --with-data <name>` starts with the app's settings and data selected, still lists them in the preview, and `D` lets you keep any path.\n4. **Clean more app leftovers**: Clean reaches Feishu and its sandboxed caches, WeChat web profiles, idle Helium signing clones and Futu NiuNiu update downloads while Futu is closed.\n5. **Correct external drive cleanup**: `mo clean --external` reports the space it actually freed, keeps the drive's Trash and protected Finder metadata, and sizes a temporary folder with an unreadable child instead of skipping it.\n6. **Safer uninstall prompts**: Homebrew cask password prompts stay in the foreground, every real uninstall needs an interactive confirmation, a dry run without a terminal ends with its plan, and app names with control characters print safely.\n7. **No Command Line Tools prompt on update**: On a Mac without developer tools, `mo update` and the installer no longer pop up the Command Line Tools installer, and both fall back to Git release tags when the GitHub API lookup fails.\n8. **Stop commands that ignore Ctrl-C**: A command that ignores the stop signal is now force-stopped two seconds after its time limit, so a stuck step can no longer hang a cleanup or uninstall.\n9. **Cleaner `mo remove`**: It removes Mole's shell completion lines, keeps your own lines and rc symlinks intact, and exits with an error when no terminal can confirm the removal.\n10. **Smoother Analyze and Purge**: Analyze keeps every entry browsable and refreshes a folder that changed right after its scan, and Purge re-scans a slow container folder one project at a time instead of skipping later artifacts.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u5728 Apple Silicon \u4e0a\u7ed9\u901a\u7528 App \u7626\u8eab**\uff1a`mo slim` \u4f1a\u5220\u6389\u4f60\u81ea\u5df1\u88c5\u7684 App \u91cc\u7684 Intel \u4ee3\u7801\uff0c\u6bcf\u4e2a App \u90fd\u5148\u5728\u526f\u672c\u4e0a\u5904\u7406\uff0c\u526f\u672c\u901a\u8fc7\u4ee3\u7801\u7b7e\u540d\u548c Gatekeeper \u68c0\u67e5\u540e\u624d\u66ff\u6362\u539f App\uff0c\u539f App \u79fb\u5230\u5e9f\u7eb8\u7bd3\uff0c\u6574\u4e2a\u8fc7\u7a0b\u4e0d\u9700\u8981\u5f00\u53d1\u8005\u5de5\u5177\uff0c\u53ef\u4ee5\u5148\u7528 `mo slim --dry-run` \u9884\u89c8\u3002\n2. **\u8ba9 AI Agent \u5e2e\u4f60\u7528 Mole**\uff1a\u5b98\u65b9 Mole skill \u4f1a\u8ba9 Claude Code\u3001Codex\u3001Cursor \u7b49 Agent \u6bcf\u6b21\u6e05\u7406\u524d\u5148\u7528 `--dry-run` \u9884\u89c8\uff0c\u5378\u8f7d App \u548c\u9700\u8981\u7ba1\u7406\u5458\u6743\u9650\u7684\u6b65\u9aa4\u7559\u7ed9\u4f60\u81ea\u5df1\u6765\uff0c\u5b89\u88c5\u547d\u4ee4\u662f `npx skills add tw93/Mole -a claude-code codex cursor -g -y`\u3002\n3. **\u5378\u8f7d\u65f6\u9ed8\u8ba4\u9009\u4e2d\u4e2a\u4eba\u6570\u636e**\uff1a`mo uninstall --with-data <\u540d\u5b57>` \u4e00\u5f00\u59cb\u5c31\u9009\u4e2d App \u7684\u8bbe\u7f6e\u548c\u6570\u636e\uff0c\u9884\u89c8\u91cc\u4ecd\u4f1a\u9010\u6761\u5217\u51fa\uff0c\u6309 D \u53ef\u4ee5\u4fdd\u7559\u4efb\u610f\u4e00\u6761\u8def\u5f84\u3002\n4. **\u6e05\u7406\u66f4\u591a App \u6b8b\u7559**\uff1aclean \u73b0\u5728\u80fd\u6e05\u7406\u98de\u4e66\u53ca\u5176\u6c99\u76d2\u7f13\u5b58\u3001\u5fae\u4fe1\u7684\u7f51\u9875 profile\u3001\u95f2\u7f6e\u7684 Helium \u7b7e\u540d\u526f\u672c\uff0c\u4ee5\u53ca\u5bcc\u9014\u725b\u725b\u5173\u95ed\u65f6\u7559\u4e0b\u7684\u66f4\u65b0\u5b89\u88c5\u5305\u3002\n5. **\u5916\u7f6e\u786c\u76d8\u6e05\u7406\u66f4\u51c6\u786e**\uff1a`mo clean --external` \u62a5\u544a\u7684\u662f\u5b9e\u9645\u6e05\u7406\u51fa\u7684\u7a7a\u95f4\uff0c\u4fdd\u7559\u786c\u76d8\u4e0a\u7684\u5e9f\u7eb8\u7bd3\u548c\u53d7\u4fdd\u62a4\u7684 Finder \u5143\u6570\u636e\uff0c\u4e34\u65f6\u76ee\u5f55\u91cc\u6709\u8bfb\u4e0d\u5230\u7684\u5b50\u76ee\u5f55\u65f6\u4e5f\u4f1a\u7167\u5e38\u8ba1\u7b97\u5927\u5c0f\uff0c\u4e0d\u518d\u6574\u9879\u8df3\u8fc7\u3002\n6. **\u5378\u8f7d\u786e\u8ba4\u66f4\u7a33\u59a5**\uff1aHomebrew cask \u7684\u5bc6\u7801\u63d0\u793a\u4fdd\u6301\u5728\u524d\u53f0\uff0c\u771f\u5b9e\u5378\u8f7d\u5fc5\u987b\u5728\u7ec8\u7aef\u91cc\u786e\u8ba4\uff0c\u6ca1\u6709\u7ec8\u7aef\u65f6\u7684 dry run \u5217\u51fa\u8ba1\u5212\u540e\u6b63\u5e38\u7ed3\u675f\uff0c\u540d\u5b57\u91cc\u5e26\u63a7\u5236\u5b57\u7b26\u7684 App \u4e5f\u80fd\u5b89\u5168\u663e\u793a\u3002\n7. **\u66f4\u65b0\u65f6\u4e0d\u518d\u5f39\u51fa\u547d\u4ee4\u884c\u5de5\u5177\u5b89\u88c5\u6846**\uff1a\u6ca1\u88c5\u5f00\u53d1\u8005\u5de5\u5177\u7684 Mac \u4e0a\uff0c`mo update` \u548c\u5b89\u88c5\u811a\u672c\u4e0d\u4f1a\u518d\u5f39\u51fa Command Line Tools \u5b89\u88c5\u6846\uff0cGitHub API \u67e5\u4e0d\u5230\u7248\u672c\u65f6\u4e5f\u4f1a\u6539\u7528 Git \u7684 release tag\u3002\n8. **\u5ffd\u7565 Ctrl-C \u7684\u547d\u4ee4\u4e5f\u80fd\u505c\u4e0b**\uff1a\u67d0\u6761\u547d\u4ee4\u4e0d\u54cd\u5e94\u505c\u6b62\u4fe1\u53f7\u65f6\uff0c\u8d85\u8fc7\u65f6\u95f4\u9650\u5236\u4e24\u79d2\u540e\u4f1a\u88ab\u5f3a\u5236\u7ed3\u675f\uff0c\u6e05\u7406\u548c\u5378\u8f7d\u4e0d\u4f1a\u518d\u5361\u5728\u8fd9\u4e00\u6b65\u3002\n9. **`mo remove` \u5378\u5f97\u66f4\u5e72\u51c0**\uff1a\u4f1a\u5220\u6389 Mole \u5199\u5165\u7684 shell \u8865\u5168\u884c\uff0c\u4fdd\u7559\u4f60\u81ea\u5df1\u7684\u914d\u7f6e\u884c\u548c rc \u6587\u4ef6\u7684\u8f6f\u94fe\uff0c\u6ca1\u6709\u7ec8\u7aef\u53ef\u4ee5\u786e\u8ba4\u65f6\u4ee5\u9519\u8bef\u9000\u51fa\u3002\n10. **Analyze \u548c Purge \u66f4\u987a\u624b**\uff1aAnalyze \u7684\u6bcf\u4e00\u9879\u90fd\u80fd\u7ee7\u7eed\u6d4f\u89c8\uff0c\u626b\u63cf\u540e\u9a6c\u4e0a\u6709\u53d8\u5316\u7684\u76ee\u5f55\u4e5f\u4f1a\u5237\u65b0\uff0cPurge \u9047\u5230\u626b\u63cf\u5f88\u6162\u7684\u5bb9\u5668\u76ee\u5f55\u65f6\u4f1a\u9010\u4e2a\u9879\u76ee\u91cd\u626b\uff0c\u4e0d\u518d\u8df3\u8fc7\u540e\u9762\u7684\u6784\u5efa\u4ea7\u7269\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @viniciusdsandrade \u00b7 @HangLark \u00b7 @M-Hassan-Raza \u00b7 @greyby \u00b7 @r266-tech \u00b7 @Showdown76py \u00b7 @ragnarok22 \u00b7 @Ctrl-Alb.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":30,"+1":11,"-1":0,"laugh":2,"hooray":3,"confused":0,"heart":6,"rocket":6,"eyes":2},"mentions_count":8}
