"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Uninstall finishes again**: a slow login item or LaunchServices step no longer stops the run with only `Uninstalling X...` left on screen, and any real stop now names the app and the step.\n2. **Uninstall works on managed Macs**: when Mole cannot check for other copies of an app, it removes only the app you picked and leaves shared leftovers in place instead of refusing.\n3. **Installer cleanup is more careful**: an unreadable folder or ZIP no longer hides the readable installers, each file is checked again right before removal, and a timeout now shows what was removed and where it stopped.\n4. **Analyze shows what it could not measure**: folders it cannot fully read are marked partial or unknown instead of 0, and `mo analyze --json` reports this in `scan_status`.\n5. **Clean lists more large payloads for review**: Android emulators and system images, the Hugging Face cache, mise installs, and Gradle caches now show their size, and Mole never deletes them.\n6. **Status stops retrying too fast**: after a failed probe, the dashboard and `mo status --watch` wait before collecting again and keep the measurements that did succeed.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u5378\u8f7d\u80fd\u6b63\u5e38\u8d70\u5b8c**\uff1a\u767b\u5f55\u9879\u6216 LaunchServices \u8fd9\u7c7b\u6b65\u9aa4\u53d8\u6162\u65f6\uff0c\u4e0d\u518d\u4e2d\u9014\u505c\u4e0b\u53ea\u5269 `Uninstalling X...`\uff0c\u771f\u6b63\u505c\u4e0b\u65f6\u4e5f\u4f1a\u8bf4\u660e\u662f\u54ea\u4e2a app\u3001\u54ea\u4e00\u6b65\u3002\n2. **\u4f01\u4e1a\u7ba1\u7406\u7684 Mac \u4e5f\u80fd\u5378\u8f7d**\uff1aMole \u65e0\u6cd5\u68c0\u67e5\u540c\u4e00 app \u7684\u5176\u4ed6\u526f\u672c\u65f6\uff0c\u6539\u4e3a\u53ea\u5220\u9664\u4f60\u9009\u4e2d\u7684 app\uff0c\u5171\u4eab\u6b8b\u7559\u4fdd\u6301\u4e0d\u52a8\uff0c\u4e0d\u518d\u76f4\u63a5\u62d2\u7edd\u3002\n3. **\u5b89\u88c5\u5305\u6e05\u7406\u66f4\u7a33\u59a5**\uff1a\u67d0\u4e2a\u6587\u4ef6\u5939\u6216 ZIP \u8bfb\u4e0d\u4e86\u65f6\u4e0d\u518d\u8fde\u5e26\u9690\u85cf\u53ef\u8bfb\u7684\u5b89\u88c5\u5305\uff0c\u5220\u9664\u524d\u4f1a\u518d\u6838\u5bf9\u4e00\u6b21\u6587\u4ef6\uff0c\u8d85\u65f6\u65f6\u4e5f\u4f1a\u663e\u793a\u5df2\u5220\u9664\u7684\u5185\u5bb9\u548c\u505c\u5728\u54ea\u4e2a\u6587\u4ef6\u3002\n4. **Analyze \u4f1a\u6807\u51fa\u6ca1\u80fd\u6d4b\u5b8c\u7684\u90e8\u5206**\uff1a\u8bfb\u4e0d\u5168\u7684\u6587\u4ef6\u5939\u663e\u793a\u4e3a\u90e8\u5206\u6216\u672a\u77e5\uff0c\u4e0d\u518d\u663e\u793a\u4e3a 0\uff0c`mo analyze --json` \u901a\u8fc7 `scan_status` \u7ed9\u51fa\u540c\u6837\u7684\u4fe1\u606f\u3002\n5. **Clean \u63d0\u793a\u66f4\u591a\u5927\u6587\u4ef6\u4f9b\u4f60\u81ea\u884c\u5904\u7406**\uff1aAndroid \u6a21\u62df\u5668\u548c\u7cfb\u7edf\u955c\u50cf\u3001Hugging Face \u7f13\u5b58\u3001mise \u5b89\u88c5\u7684\u8fd0\u884c\u65f6\u548c Gradle \u7f13\u5b58\u4f1a\u663e\u793a\u4f53\u79ef\uff0cMole \u4e0d\u4f1a\u5220\u9664\u5b83\u4eec\u3002\n6. **Status \u4e0d\u518d\u9891\u7e41\u91cd\u8bd5**\uff1a\u63a2\u6d4b\u5931\u8d25\u540e\uff0c\u4eea\u8868\u76d8\u548c `mo status --watch` \u4f1a\u7b49\u4e00\u6bb5\u65f6\u95f4\u518d\u91c7\u96c6\uff0c\u5df2\u7ecf\u6210\u529f\u7684\u6570\u636e\u4e5f\u4f1a\u4fdd\u7559\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @M-Hassan-Raza \u00b7 @candidosales \u00b7 @ilypopv.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with free updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":33,"+1":12,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":9,"rocket":5,"eyes":1},"mentions_count":3}
