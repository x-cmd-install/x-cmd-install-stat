align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. Touch ID asks once: With Touch ID enabled for sudo, `mo clean` now waits for the one system dialog instead of opening a second password prompt, and after you type a password on a Mac with enrolled fingerprints Mole points to `mo touchid` so the next run can use your finger.\n2. Safer uninstall: Removing a Nightly or Beta build no longer takes the folders the stable build still uses, TeamViewer and antivirus apps such as Avast, Malwarebytes and Norton are sent to their own uninstallers, a failed removal makes `mo uninstall` exit 1, and uninstalling Docker no longer prints regex errors.\n3. Clearer updates: After a stable `mo update`, Mole shows the new version's highlights and release link, and an update that cannot replace its files, usually left root-owned by an earlier sudo install, now says so with the command to fix it instead of reporting success.\n4. iCloud Drive protected in analyze: `mo analyze` refuses to delete iCloud Drive's own folders while files inside them stay deletable, and the delete action now says \"Move to Trash\".\n5. More careful cleaning: Shared Adobe caches wait while any Adobe app runs, only Apple-signed macOS installers are removed, Yarn Berry dependencies are kept, and helpers you built yourself are no longer listed as orphaned services.\n6. Calmer status: `mo status` calls a disk critical only at 90% used with under 30 GB free, battery warnings start after 1000 cycles, two disks of the same size are both shown, and a terminal too short for the dashboard asks you to enlarge it instead of cutting off the top.\n7. Faster scans: Protection checks match every pattern in one test and timed commands are noticed as soon as they exit, so `mo clean --dry-run` took 43.6s instead of 54.8s on one Mac without `timeout`.\n\n### 更新日志\n\n1. Touch ID 只问一次：给 sudo 开了 Touch ID 后，`mo clean` 会等系统那一个授权框，不再接着弹第二次密码，录过指纹的 Mac 上如果你输的是密码，Mole 会提示运行 `mo touchid`，下次就能直接用指纹。\n2. 卸载更稳：卸载 Nightly、Beta 这类版本不再带走正式版还在用的文件夹，TeamViewer 和 Avast、Malwarebytes、Norton 等杀毒软件会引导到它们自己的卸载工具，卸载失败时 `mo uninstall` 返回 1，卸载 Docker 时也不再打印正则报错。\n3. 更新结果更清楚：稳定版 `mo update` 完成后会显示新版本的几条亮点和发布链接，之前用 sudo 安装留下 root 权限文件导致替换失败时，会直接说明并给出修复命令，不再显示更新成功。\n4. analyze 保护 iCloud Drive：`mo analyze` 不会删除 iCloud Drive 自己的文件夹，里面的文件照常可以删，删除操作的说法也改成了「Move to Trash」。\n5. 清理更谨慎：Adobe 软件运行时不清它们共用的缓存，只清理 Apple 签名的 macOS 安装器，保留 Yarn Berry 的依赖，自己编译的 helper 不再被当成孤立服务。\n6. status 不再乱报警：磁盘用了 90% 且剩余不到 30 GB 才算告急，电池循环超过 1000 次才提醒，容量相同的两块盘都会显示，终端太矮放不下面板时提示放大窗口，不再把顶部截掉。\n7. 扫描更快：保护规则一次匹配完，带超时的命令一结束就能被发现，一台没装 `timeout` 的 Mac 上 `mo clean --dry-run` 从 54.8 秒降到 43.6 秒。\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @tobbi · @sebastianbreguel · @Dev-next-gen · @r266-tech · @otakusboy · @iamxorum.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":20,"+1":9,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":4,"rocket":3,"eyes":1},"mentions_count":6}
