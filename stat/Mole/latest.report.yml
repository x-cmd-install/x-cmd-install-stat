e_id":"RA_kwDOP1JGW84iU1gE","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3129737,"digest":"sha256:b963404f7999318885a86c0d4d4ab5502bd5e35cc7477eaa5b86599402076421","download_count":9,"created_at":"2026-09-20T01:55:38Z","updated_at":"2026-09-20T01:55:38Z"},{"id":575887366,"node_id":"RA_kwDOP1JGW84iU1gG","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:ef1c8661a44def3cb2925dfaa2a7f48454d29123c31c3087bfb4d5175fcec197","download_count":109,"created_at":"2026-09-20T01:55:38Z","updated_at":"2026-09-20T01:55:38Z"},{"id":575887360,"node_id":"RA_kwDOP1JGW84iU1gA","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4326880,"digest":"sha256:3e7359879d11da4ab9d023e9c11289e318d3418da2f171649d3097186834e709","download_count":30,"created_at":"2026-09-20T01:55:38Z","updated_at":"2026-09-20T01:55:38Z"},{"id":575887359,"node_id":"RA_kwDOP1JGW84iU1f_","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4200882,"digest":"sha256:86c8abb3f97548ac4989c457321afacb6ead2de20958ac371fa656713b21e6c0","download_count":81,"created_at":"2026-09-20T01:55:38Z","updated_at":"2026-09-20T01:55:38Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Clean leaves Homebrew downloads that are still transferring alone**: a running `brew fetch` used to lose its in-flight cask downloads and its own lock files, and Homebrew's lock directory is no longer swept at all.\n2. **A slow check no longer cancels the rest of the run**: a Spotlight probe, a Large files sizing pass, or a simulator runtime review that times out now skips that item and carries on, and routine timeout notes stay out of the summary.\n3. **Clean reaches Notion's workspace cache**: only the cache storage is swept, the script cache and databases are left alone, and the whole family is skipped while Notion is running.\n4. **Uninstall names what it could not verify**: an incomplete scan, a failed cask lookup, and undetermined ownership each arrive with the check to run, and selector rows stay on one line in an 80-column terminal.\n5. **`mo` works when it is invoked through a symlink**: the launcher resolves the real directory behind the link, so it still finds its own libraries.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **Clean \u4e0d\u518d\u5220\u9664\u6b63\u5728\u4e0b\u8f7d\u7684 Homebrew \u6587\u4ef6**\uff1a\u4e4b\u524d\u6b63\u5728\u8dd1\u7684 `brew fetch` \u4f1a\u4e22\u6389\u5728\u9014\u7684 cask \u4e0b\u8f7d\u548c\u5b83\u81ea\u5df1\u6301\u6709\u7684\u9501\uff0cHomebrew \u7684\u9501\u76ee\u5f55\u73b0\u5728\u5b8c\u5168\u4e0d\u518d\u6e05\u7406\u3002\n2. **\u67d0\u4e00\u6b65\u68c0\u67e5\u8d85\u65f6\u4e0d\u518d\u4e2d\u65ad\u6574\u8f6e\u6e05\u7406**\uff1aSpotlight \u63a2\u6d4b\u3001\u5927\u6587\u4ef6\u4f53\u79ef\u7edf\u8ba1\u548c\u6a21\u62df\u5668\u8fd0\u884c\u65f6\u68c0\u67e5\u8d85\u65f6\u540e\u53ea\u8df3\u8fc7\u8fd9\u4e00\u9879\u7ee7\u7eed\u5f80\u4e0b\u8d70\uff0c\u5e38\u89c4\u8d85\u65f6\u8bf4\u660e\u4e5f\u4e0d\u518d\u8fdb\u5165\u7ed3\u679c\u6c47\u603b\u3002\n3. **Clean \u652f\u6301 Notion \u5de5\u4f5c\u533a\u7f13\u5b58**\uff1a\u53ea\u6e05\u7f13\u5b58\u5b58\u50a8\uff0c\u4fdd\u7559\u811a\u672c\u7f13\u5b58\u548c\u6570\u636e\u5e93\uff0cNotion \u8fd0\u884c\u671f\u95f4\u6574\u4f53\u8df3\u8fc7\u3002\n4. **Uninstall \u4f1a\u8bf4\u660e\u54ea\u4e9b\u6ca1\u80fd\u786e\u8ba4**\uff1a\u9884\u68c0\u6ca1\u626b\u5b8c\u3001cask \u67e5\u8be2\u5931\u8d25\u3001\u5f52\u5c5e\u65e0\u6cd5\u5224\u5b9a\uff0c\u90fd\u4f1a\u8fde\u540c\u8be5\u8dd1\u7684\u68c0\u67e5\u547d\u4ee4\u4e00\u8d77\u7ed9\u51fa\uff0c\u9009\u62e9\u5217\u8868\u5728 80 \u5217\u7ec8\u7aef\u91cc\u4e5f\u4e0d\u518d\u6298\u884c\u3002\n5. **\u901a\u8fc7\u8f6f\u94fe\u8c03\u7528 `mo` \u65f6\u80fd\u6b63\u5e38\u5de5\u4f5c**\uff1a\u542f\u52a8\u5668\u4f1a\u89e3\u6790\u51fa\u8f6f\u94fe\u80cc\u540e\u7684\u771f\u5b9e\u76ee\u5f55\uff0c\u56e0\u6b64\u4ecd\u80fd\u627e\u5230\u81ea\u5df1\u7684\u4f9d\u8d56\u5e93\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @ishaanko \u00b7 @xtnntn \u00b7 @huangy7 \u00b7 @idhyt \u00b7 @jiji262 \u00b7 @iammike2 \u00b7 @TarGz \u00b7 @TyceHerrman.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with lifetime updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":9,"+1":1,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":1,"rocket":2,"eyes":1},"mentions_count":8}
