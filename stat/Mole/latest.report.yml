:"RA_kwDOP1JGW84uPkhT","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3314844,"digest":"sha256:3ac3de93c539c8c194ba7f11182a281df08f971e01c6a5081ef7960a0cae95ca","download_count":426,"created_at":"2026-11-21T14:27:21Z","updated_at":"2026-11-21T14:27:21Z"},{"id":775833678,"node_id":"RA_kwDOP1JGW84uPkhO","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:bb67e69ccd9a9daa058942c55fd3e04447a5a14a30c4576971c7188fbdf7b2b2","download_count":4141,"created_at":"2026-11-21T14:27:21Z","updated_at":"2026-11-21T14:27:21Z"},{"id":775833669,"node_id":"RA_kwDOP1JGW84uPkhF","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4418448,"digest":"sha256:43e92d0cdeb7de0f341432d2d25b6b54ef4faf4c321699c8d460dfb2647b49c7","download_count":974,"created_at":"2026-11-21T14:27:20Z","updated_at":"2026-11-21T14:27:21Z"},{"id":775833680,"node_id":"RA_kwDOP1JGW84uPkhQ","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4284882,"digest":"sha256:39f53f435a841861e20915022d08937be72d7b8b7d96b57e4b14644e83779589","download_count":3149,"created_at":"2026-11-21T14:27:21Z","updated_at":"2026-11-21T14:27:21Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. Cleaning progress names the item: `mo clean` shows the section, the position and the item being removed, such as `Cleaning User app cache 3/12 · com.microsoft…ShipIt`, so a long removal no longer looks stuck.\n2. Online-only folders are skipped: iCloud placeholders in Documents, online-only CloudStorage providers and Next.js cache entries that live only in the cloud are no longer downloaded during `mo clean`, which ends the hangs and the skipped CloudStorage project caches.\n3. Accurate totals: Rows that print their own size and the space Homebrew cleanup reports freeing now count in the `mo clean` total.\n4. Previews name what they skipped: `mo clean --dry-run` ends with the families it left out while Xcode or the Simulator was open, so a later real run no longer removes paths the preview never listed.\n5. Clearer memory diagnosis: `mo optimize` judges memory by the macOS pressure level instead of swap use and lists the apps holding the most on one line, and WindowServer and CoreSimulator disk images are no longer reported as bottlenecks.\n6. Safer cleanup: A privileged helper is not offered when Spotlight cannot confirm its app is gone, `mo analyze` refuses to move the temporary folders ssh-agent and tmux depend on, and apps without a `Contents` folder, such as NetBird, no longer skip App leftovers.\n7. More caches and records: Postman HTTP and code caches are cleaned, cleanups run through gh, go, simctl, tart and Homebrew appear in `mo history`, and terminals that support OSC 7501 show the cleanup state.\n8. Other fixes: The uninstall confirm screen shows the personal data key on its heading and redraws cleanly after choosing, paths next to the home folder are no longer shortened to `~`, and logged sizes step up to the next unit at 1000KB and 1000MB.\n\n### 更新日志\n\n1. 清理进度显示当前项目：`mo clean` 显示所在栏目、进度和正在清理的项目，例如 `Cleaning User app cache 3/12 · com.microsoft…ShipIt`，耗时较长的清理不再像是卡住。\n2. 跳过仅存于云端的文件夹：`mo clean` 不再下载 Documents 中的 iCloud 占位文件、仅在线的 CloudStorage 云盘和只存在云端的 Next.js 缓存，扫描不再卡住，CloudStorage 中的项目缓存也不再被整体跳过。\n3. 总量统计更准确：自行显示大小的条目和 Homebrew 清理报告释放的空间现在计入 `mo clean` 的总量。\n4. 预览注明跳过的内容：Xcode 或模拟器运行时，`mo clean --dry-run` 会在末尾列出未纳入预览的类别，之后的正式清理不再删除预览中没有列出的路径。\n5. 内存诊断更清晰：`mo optimize` 按 macOS 内存压力等级而不是 swap 用量判断内存，并在一行内列出占用最多的应用，WindowServer 和 CoreSimulator 磁盘镜像不再被报告为瓶颈。\n6. 清理更安全：Spotlight 无法确认对应应用已删除时不再提供特权辅助程序，`mo analyze` 拒绝移动 ssh-agent 和 tmux 依赖的临时文件夹，NetBird 这类没有 `Contents` 文件夹的应用不再导致跳过应用残留检查。\n7. 覆盖更多缓存与记录：清理 Postman 的 HTTP 与代码缓存，经由 gh、go、simctl、tart 和 Homebrew 完成的清理会出现在 `mo history` 中，支持 OSC 7501 的终端会显示清理状态。\n8. 其他修复：卸载确认页把个人数据的按键提示放在标题上并在选择后完整重绘，与主目录同级的路径不再被缩写为 `~`，日志中的大小在 1000KB 和 1000MB 时进位到下一个单位。\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @viniciusdsandrade · @Yuxin-Qiao · @r266-tech · @Dev-next-gen · @osamakaram · @RaghuVatsavai · @valentynapolienova · @sebastianbreguel · @goul4rt · @TyceHerrman · @erickquintanar05.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":12,"+1":4,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":2,"rocket":2,"eyes":2},"mentions_count":11}
