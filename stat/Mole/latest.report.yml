A_kwDOP1JGW84oEcXM","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3246282,"digest":"sha256:846c9e2f31cdadc976cb1bc5eb652c6f49c755931cdf8f2d4820bc5e5605faac","download_count":27,"created_at":"2026-10-24T12:48:09Z","updated_at":"2026-10-24T12:48:10Z"},{"id":672253389,"node_id":"RA_kwDOP1JGW84oEcXN","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:6478d62d833363d41b1c93463f40101c1aa993cb3dfd783e3654975bf4d5bd05","download_count":468,"created_at":"2026-10-24T12:48:09Z","updated_at":"2026-10-24T12:48:10Z"},{"id":672253385,"node_id":"RA_kwDOP1JGW84oEcXJ","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4410176,"digest":"sha256:61108b5fb5b6f8c1aa36c5fc073bdd6c4d59411fa46d8503197e9049b8b59ecb","download_count":122,"created_at":"2026-10-24T12:48:09Z","updated_at":"2026-10-24T12:48:10Z"},{"id":672253382,"node_id":"RA_kwDOP1JGW84oEcXG","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4268290,"digest":"sha256:9211a0ddb469061ba24928ec10cedbbb686ca10245d0d50efdb4fd87d577cfa1","download_count":358,"created_at":"2026-10-24T12:48:09Z","updated_at":"2026-10-24T12:48:10Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. Find apps inside subfolders when slimming: `mo slim` now scans one level of plain folders under the app directories, displays long names more compactly and still searches their full names.\n2. Smoother Analyze and menus: Large-directory scans avoid repeated sorting, while narrow terminals keep selection, confirmation and cancellation controls visible with less unnecessary wrapping.\n3. More careful personal-data selection: `--with-data` no longer preselects CrossOver, Whisky or OpenEmu game data, and a hidden backup of an app no longer displaces its visible installation in the uninstall list.\n4. More accurate permission and disk checks: Missing Full Disk Access is detected more reliably, and external-drive cleanup stops without removing contents when disk information cannot be verified.\n5. Stop later work after cancellation: Cleanup stops subsequent steps after a cancellation signal, a timed-out Trash move stops later removals, and slimming, installer cleanup and configuration confirmations cancel when input closes.\n6. Find more developer-tool storage: Cleanup reports large Conductor workspaces and archived conversations without deleting them, and can find a standalone pnpm installation outside PATH.\n7. More accurate system status: A routed Ethernet interface shows the correct IP, and a minimal PATH no longer turns some system readings into zero.\n8. Touch ID and optimization preview fixes: Commented-out Touch ID configuration no longer appears enabled, and `mo optimize -n` previews the optimization plan.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. \u7626\u8eab\u80fd\u627e\u5230\u5b50\u6587\u4ef6\u5939\u91cc\u7684 App\uff1a`mo slim` \u4f1a\u626b\u63cf\u5e94\u7528\u76ee\u5f55\u4e0b\u4e00\u5c42\u666e\u901a\u6587\u4ef6\u5939\uff0c\u957f\u540d\u79f0\u663e\u793a\u66f4\u7d27\u51d1\uff0c\u641c\u7d22\u4ecd\u6309\u5b8c\u6574\u540d\u79f0\u5339\u914d\u3002\n2. Analyze \u548c\u5217\u8868\u64cd\u4f5c\u66f4\u6d41\u7545\uff1a\u626b\u63cf\u5927\u76ee\u5f55\u65f6\u51cf\u5c11\u91cd\u590d\u6392\u5e8f\uff0c\u7a84\u7ec8\u7aef\u4f18\u5148\u4fdd\u7559\u9009\u62e9\u3001\u786e\u8ba4\u548c\u53d6\u6d88\u63d0\u793a\uff0c\u51cf\u5c11\u4e0d\u5fc5\u8981\u7684\u6362\u884c\u3002\n3. \u5378\u8f7d\u65f6\u66f4\u7a33\u59a5\u5730\u5904\u7406\u4e2a\u4eba\u6570\u636e\uff1a`--with-data` \u4e0d\u518d\u9ed8\u8ba4\u9009\u4e2d CrossOver\u3001Whisky \u548c OpenEmu \u7684\u6e38\u620f\u6570\u636e\uff0c\u540c\u4e00 App \u7684\u9690\u85cf\u5907\u4efd\u4e5f\u4e0d\u518d\u6324\u6389\u6b63\u5e38\u5b89\u88c5\u7684\u6761\u76ee\u3002\n4. \u6743\u9650\u548c\u5916\u7f6e\u78c1\u76d8\u68c0\u67e5\u66f4\u51c6\u786e\uff1a\u66f4\u53ef\u9760\u5730\u8bc6\u522b\u5b8c\u6574\u78c1\u76d8\u8bbf\u95ee\u6743\u9650\u4e0d\u8db3\uff0c\u65e0\u6cd5\u786e\u8ba4\u78c1\u76d8\u4fe1\u606f\u65f6\u505c\u6b62\u5916\u7f6e\u76d8\u6e05\u7406\uff0c\u4fdd\u7559\u76ee\u6807\u5185\u5bb9\u3002\n5. \u53d6\u6d88\u64cd\u4f5c\u80fd\u53ca\u65f6\u505c\u4e0b\uff1a\u6e05\u7406\u6536\u5230\u53d6\u6d88\u4fe1\u53f7\u540e\u505c\u6b62\u540e\u7eed\u6b65\u9aa4\uff0c\u79fb\u5165\u5e9f\u7eb8\u7bd3\u8d85\u65f6\u540e\u505c\u6b62\u540e\u7eed\u5220\u9664\uff0c\u7626\u8eab\u3001\u5b89\u88c5\u5305\u6e05\u7406\u548c\u914d\u7f6e\u786e\u8ba4\u9047\u5230\u8f93\u5165\u5173\u95ed\u65f6\u4f1a\u53d6\u6d88\u3002\n6. \u66f4\u5bb9\u6613\u627e\u5230\u5f00\u53d1\u5de5\u5177\u7684\u5360\u7528\uff1a\u6e05\u7406\u65f6\u4f1a\u63d0\u793a Conductor \u5de5\u4f5c\u533a\u548c\u5f52\u6863\u5bf9\u8bdd\u7684\u8f83\u5927\u5360\u7528\uff0c\u4f46\u4e0d\u5220\u9664\u8fd9\u4e9b\u5185\u5bb9\uff0c\u72ec\u7acb\u5b89\u88c5\u4e14\u4e0d\u5728 PATH \u4e2d\u7684 pnpm \u4e5f\u80fd\u88ab\u53d1\u73b0\u3002\n7. \u7cfb\u7edf\u72b6\u6001\u663e\u793a\u66f4\u51c6\u786e\uff1a\u6709\u7ebf\u7f51\u7edc\u4f7f\u7528\u7684\u7f51\u5361\u80fd\u663e\u793a\u6b63\u786e\u7684 IP\uff0c\u7cbe\u7b80 PATH \u4e0d\u518d\u8ba9\u90e8\u5206\u7cfb\u7edf\u8bfb\u6570\u53d8\u6210\u96f6\u3002\n8. Touch ID \u548c\u4f18\u5316\u9884\u89c8\u7684\u5c0f\u4fee\u590d\uff1a\u88ab\u6ce8\u91ca\u6389\u7684 Touch ID \u914d\u7f6e\u4e0d\u518d\u663e\u793a\u4e3a\u5df2\u542f\u7528\uff0c`mo optimize -n` \u4e5f\u80fd\u9884\u89c8\u4f18\u5316\u8ba1\u5212\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @jkimdev \u00b7 @lilu007-github \u00b7 @noah-qin \u00b7 @viniciusdsandrade \u00b7 @viraone \u00b7 @carlwangx \u00b7 @Sissing \u00b7 @smontanaro \u00b7 @bit-blit.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":9,"+1":3,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":9}
