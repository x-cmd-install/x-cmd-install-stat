47532424,"node_id":"RA_kwDOP1JGW84mmI-I","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3240187,"digest":"sha256:67e5b7264f9bb6220b39dcac4f09f508d62fce648abbde198f2e6fde393bbb2b","download_count":118,"created_at":"2026-10-16T14:08:52Z","updated_at":"2026-10-16T14:08:53Z"},{"id":647532420,"node_id":"RA_kwDOP1JGW84mmI-E","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:89604ad6a24fc6b0fa1f055173612d33ce033d923ea23b336347eec0cf82da47","download_count":1732,"created_at":"2026-10-16T14:08:52Z","updated_at":"2026-10-16T14:08:52Z"},{"id":647532425,"node_id":"RA_kwDOP1JGW84mmI-J","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4397696,"digest":"sha256:9e0dc50459902d0b114ea1430d5611aab4982a689f3a8cd5231efe716ca3a954","download_count":429,"created_at":"2026-10-16T14:08:52Z","updated_at":"2026-10-16T14:08:53Z"},{"id":647532427,"node_id":"RA_kwDOP1JGW84mmI-L","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4268130,"digest":"sha256:75402ecb15dfb40ae348b27cdff3a9d5024941bb130d2951a8544be40f97e820","download_count":1298,"created_at":"2026-10-16T14:08:52Z","updated_at":"2026-10-16T14:08:53Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Select all personal data with one key**: In the personal data list `mo uninstall` opens with D, pressing A selects every path and pressing it again clears them, so removing all of an app's data takes two keys while you still see each path before confirming.\n2. **Work with GNU tools first in PATH**: Mole now calls the macOS versions of stat, find, tr, date and du directly, so Homebrew coreutils, findutils or grep earlier in PATH no longer stop `mo clean` with an unbound variable, skip cloud folders, break name search for apps like \u00c9crivain, or fail sizes in Analyze.\n3. **Keep game libraries, rollbacks and live system data**: Uninstall never offers the Steam folder that holds your games, Nix cleanup removes only store paths nothing references and keeps your profile generations, and clean leaves every live power log database alone.\n4. **Clean old browser builds and device symbols**: Clean removes Chrome builds agent-browser no longer launches, keeping the one it uses or that you pinned, and prunes old macOS and visionOS DeviceSupport versions like the other platforms.\n5. **No Xcode install prompt during clean**: Clean leaves the simulator tools alone until Xcode has finished its own first-launch setup, so skipping the admin prompt no longer leads to a system password dialog, and simulator checks show a spinner instead of looking stuck.\n6. **Log every change Mole makes**: Dry runs, refused removals, Analyze moves to Trash, Homebrew, launch and login item changes, and package manager cleanups now each leave a row in the operation log, and `mo remove` keeps those logs.\n7. **Search and list apps faster**: `mo uninstall <name>` with hundreds of apps returns in well under a second, and `mo uninstall --list` reads Homebrew ownership in batches instead of one cask at a time.\n8. **Ask for admin access before work starts**: The first admin prompt now appears before system cleanup begins instead of later behind a spinner.\n9. **Finish developer cleanup when one tool cannot be read**: An unreadable AI agent versions folder no longer cancels the rest of developer cleanup, npm cleanup has a time limit, and entries you whitelisted no longer count as skipped protected items.\n10. **Use the defaults Mole ships**: Thirteen undocumented tuning variables such as `MOLE_SKIP_TRASH_CLEANUP` are gone; to keep the Trash, tick its row in `mo clean --whitelist`.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **\u4e00\u4e2a\u952e\u9009\u4e2d\u5168\u90e8\u4e2a\u4eba\u6570\u636e**\uff1a`mo uninstall` \u4e2d\u6309 D \u6253\u5f00\u4e2a\u4eba\u6570\u636e\u5217\u8868\u540e\uff0c\u6309 A \u9009\u4e2d\u5168\u90e8\u8def\u5f84\uff0c\u518d\u6309\u4e00\u6b21\u53d6\u6d88\uff0c\u5220\u9664\u4e00\u4e2a App \u7684\u5168\u90e8\u6570\u636e\u53ea\u8981\u4e24\u4e2a\u952e\uff0c\u786e\u8ba4\u524d\u4ecd\u80fd\u770b\u5230\u6bcf\u4e00\u6761\u8def\u5f84\u3002\n2. **PATH \u91cc\u88c5\u4e86 GNU \u5de5\u5177\u4e5f\u80fd\u6b63\u5e38\u4f7f\u7528**\uff1aMole \u73b0\u5728\u76f4\u63a5\u8c03\u7528 macOS \u81ea\u5e26\u7684 stat\u3001find\u3001tr\u3001date \u548c du\uff0cHomebrew \u7684 coreutils\u3001findutils \u6216 grep \u6392\u5728 PATH \u524d\u9762\u65f6\uff0c`mo clean` \u4e0d\u518d\u56e0\u672a\u5b9a\u4e49\u53d8\u91cf\u4e2d\u65ad\uff0c\u4e5f\u4e0d\u4f1a\u8df3\u8fc7\u4e91\u76d8\u76ee\u5f55\u3001\u641c\u4e0d\u5230 \u00c9crivain \u8fd9\u7c7b\u540d\u5b57\u7684 App\uff0c\u6216\u8ba9 Analyze \u7b97\u4e0d\u51fa\u5927\u5c0f\u3002\n3. **\u4fdd\u7559\u6e38\u620f\u5e93\u3001\u56de\u6eda\u70b9\u548c\u6b63\u5728\u4f7f\u7528\u7684\u7cfb\u7edf\u6570\u636e**\uff1a\u5378\u8f7d\u6c38\u8fdc\u4e0d\u4f1a\u63d0\u4f9b\u5b58\u653e\u6e38\u620f\u7684 Steam \u76ee\u5f55\uff0cNix \u6e05\u7406\u53ea\u56de\u6536\u6ca1\u6709\u88ab\u5f15\u7528\u7684 store \u8def\u5f84\u5e76\u4fdd\u7559 profile \u7684\u5404\u4e2a\u7248\u672c\uff0cclean \u4e5f\u4e0d\u518d\u52a8\u6b63\u5728\u4f7f\u7528\u7684\u7535\u6e90\u65e5\u5fd7\u6570\u636e\u5e93\u3002\n4. **\u6e05\u7406\u65e7\u6d4f\u89c8\u5668\u548c\u8bbe\u5907\u8c03\u8bd5\u6587\u4ef6**\uff1aclean \u4f1a\u5220\u9664 agent-browser \u4e0d\u518d\u4f7f\u7528\u7684 Chrome \u65e7\u7248\u672c\uff0c\u4fdd\u7559\u5b83\u6b63\u5728\u7528\u6216\u4f60\u6307\u5b9a\u7684\u90a3\u4e00\u4e2a\uff0cmacOS \u548c visionOS \u7684\u65e7 DeviceSupport \u4e5f\u50cf\u5176\u4ed6\u5e73\u53f0\u4e00\u6837\u53ea\u4fdd\u7559\u6700\u65b0\u7248\u672c\u3002\n5. **\u6e05\u7406\u65f6\u4e0d\u518d\u5f39\u51fa Xcode \u5b89\u88c5\u6846**\uff1aXcode \u81ea\u5df1\u7684\u9996\u6b21\u8bbe\u7f6e\u5b8c\u6210\u524d\uff0cclean \u4e0d\u4f1a\u8c03\u7528\u6a21\u62df\u5668\u5de5\u5177\uff0c\u8df3\u8fc7\u7ba1\u7406\u5458\u6388\u6743\u540e\u4e0d\u4f1a\u518d\u5f39\u51fa\u7cfb\u7edf\u5bc6\u7801\u6846\uff0c\u68c0\u67e5\u6a21\u62df\u5668\u65f6\u4e5f\u4f1a\u663e\u793a\u8fdb\u5ea6\uff0c\u4e0d\u518d\u50cf\u5361\u4f4f\u4e00\u6837\u3002\n6. **\u6bcf\u6b21\u6539\u52a8\u90fd\u6709\u8bb0\u5f55**\uff1adry run\u3001\u88ab\u62d2\u7edd\u7684\u5220\u9664\u3001Analyze \u79fb\u5230\u5e9f\u7eb8\u7bd3\u3001Homebrew\u3001\u542f\u52a8\u9879\u548c\u767b\u5f55\u9879\u53d8\u66f4\uff0c\u4ee5\u53ca\u5305\u7ba1\u7406\u5668\u7684\u7f13\u5b58\u6e05\u7406\u90fd\u4f1a\u5199\u8fdb\u64cd\u4f5c\u65e5\u5fd7\uff0c`mo remove` \u5378\u8f7d Mole \u65f6\u4e5f\u4f1a\u4fdd\u7559\u8fd9\u4e9b\u65e5\u5fd7\u3002\n7. **\u641c\u7d22\u548c\u5217\u51fa App \u66f4\u5feb**\uff1a\u88c5\u4e86\u51e0\u767e\u4e2a App \u65f6 `mo uninstall <\u540d\u5b57>` \u4e0d\u5230\u4e00\u79d2\u5c31\u80fd\u8fd4\u56de\uff0c`mo uninstall --list` \u4e5f\u6539\u4e3a\u6279\u91cf\u8bfb\u53d6 Homebrew \u5f52\u5c5e\uff0c\u4e0d\u518d\u9010\u4e2a\u67e5\u8be2\u3002\n8. **\u5f00\u59cb\u6e05\u7406\u524d\u5148\u8bf7\u6c42\u7ba1\u7406\u5458\u6388\u6743**\uff1a\u7b2c\u4e00\u6b21\u7ba1\u7406\u5458\u6388\u6743\u4f1a\u5728\u7cfb\u7edf\u6e05\u7406\u5f00\u59cb\u524d\u51fa\u73b0\uff0c\u4e0d\u518d\u85cf\u5728 loading \u540e\u9762\u3002\n9. **\u5355\u4e2a\u5de5\u5177\u8bfb\u4e0d\u5230\u65f6\u7ee7\u7eed\u5b8c\u6210\u5f00\u53d1\u5de5\u5177\u6e05\u7406**\uff1a\u67d0\u4e2a AI \u5de5\u5177\u7684\u7248\u672c\u76ee\u5f55\u8bfb\u4e0d\u5230\u65f6\uff0c\u4e0d\u518d\u4e2d\u6b62\u540e\u9762\u7684\u5f00\u53d1\u5de5\u5177\u6e05\u7406\uff0cnpm \u7f13\u5b58\u6e05\u7406\u4e5f\u52a0\u4e0a\u4e86\u65f6\u95f4\u9650\u5236\uff0c\u52a0\u5165\u767d\u540d\u5355\u7684\u6761\u76ee\u4e0d\u518d\u8ba1\u5165\u8df3\u8fc7\u7684\u53d7\u4fdd\u62a4\u9879\u3002\n10. **\u7edf\u4e00\u4f7f\u7528\u5185\u7f6e\u9ed8\u8ba4\u503c**\uff1a\u5220\u9664\u4e86 13 \u4e2a\u6ca1\u6709\u5199\u8fdb\u6587\u6863\u7684\u8c03\u8282\u53d8\u91cf\uff0c\u4f8b\u5982 `MOLE_SKIP_TRASH_CLEANUP`\uff0c\u60f3\u4fdd\u7559\u5e9f\u7eb8\u7bd3\u8bf7\u5728 `mo clean --whitelist` \u4e2d\u52fe\u9009\u5b83\u90a3\u4e00\u884c\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @Ctrl-Alb \u00b7 @viztor \u00b7 @mbarbero \u00b7 @guilhem.\n\n### Mole Mac App\n\nIf you would rather work in a window than a terminal, [Mole Mac App](https://mole.fit/) covers cleaning, app removal, maintenance, disk analysis and live status, shows everything before it deletes, and adds tools in the menu bar. It costs $19 once, with free updates and a 14-day refund, and you can [download it here](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":20,"+1":9,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":3,"rocket":4,"eyes":1},"mentions_count":4}
