536026384,"node_id":"RA_kwDOP1JGW84f8x0Q","name":"binaries-darwin-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3010562,"digest":"sha256:3193b2322039680bf617f2e6794f85fbf1cad4992cc2457dd23c66e25b59db10","download_count":320,"created_at":"2026-08-30T02:08:12Z","updated_at":"2026-08-30T02:08:12Z"},{"id":536026383,"node_id":"RA_kwDOP1JGW84f8x0P","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":536,"digest":"sha256:faa5212910f42765a4e9707de6b924bb097a47968a7a562d4af46ddefcea05e0","download_count":5501,"created_at":"2026-08-30T02:08:12Z","updated_at":"2026-08-30T02:08:12Z"},{"id":536026380,"node_id":"RA_kwDOP1JGW84f8x0M","name":"status-darwin-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4139040,"digest":"sha256:0b310ecc008297ce227813aa077ad3007e7aa1eb86fb7f0daf9cd175e667ebb6","download_count":1287,"created_at":"2026-08-30T02:08:12Z","updated_at":"2026-08-30T02:08:13Z"},{"id":536026385,"node_id":"RA_kwDOP1JGW84f8x0R","name":"status-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4065586,"digest":"sha256:46b8aded69d013d00f858908b02d35ea2d39087ccc474bcb8c2e65988fe0028e","download_count":4099,"created_at":"2026-08-30T02:08:12Z","updated_at":"2026-08-30T02:08:13Z"}],"body":"<div align=\"center\">\n  <img src=\"https://cdn.tw93.fun/pic/cole.png\" alt=\"Mole Logo\" width=\"120\" height=\"120\" style=\"border-radius:50%\" />\n  <h1 style=\"margin: 12px 0 6px;\">Mole</h1>\n  <p><em>Deep clean and optimize your Mac.</em></p>\n</div>\n\n### Changelog\n\n1. **Clean and Purge are faster without widening deletion scope**: independent scans now run concurrently, stray home-level artifact folders such as `node_modules` are no longer mistaken for projects, and live container cache trees stay protected.\n2. **Safety probe cancellation now stops the whole cleanup**: if a live-cache or SQLite check times out or is interrupted, Mole preserves the current target, stops later cleanup sections, and returns the failure instead of continuing with partial evidence.\n3. **Analyze and Status report fresher, clearer system state**: Analyze shows the local Time Machine snapshot count and explains why snapshot-only space is excluded from directory totals; Status adds zombie process diagnostics and retains the last process sample as stale when a refresh fails.\n4. **Everyday edges are quieter and clearer**: CLT-only Macs no longer warn about a missing `simctl`, compressed menus keep the Space key hint, whitelist guidance accepts any path, and the `x/text` security update is included.\n\n### \u66f4\u65b0\u65e5\u5fd7\n\n1. **Clean \u548c Purge \u66f4\u5feb\uff0c\u4f46\u4e0d\u4f1a\u6269\u5927\u5220\u9664\u8303\u56f4**\uff1a\u4e92\u4e0d\u4f9d\u8d56\u7684\u626b\u63cf\u73b0\u5728\u53ef\u4ee5\u5e76\u53d1\u6267\u884c\uff1b\u7528\u6237\u76ee\u5f55\u4e0b\u8bef\u653e\u7684 `node_modules` \u7b49\u6784\u5efa\u4ea7\u7269\u4e0d\u4f1a\u518d\u88ab\u5f53\u6210\u9879\u76ee\uff1b\u6b63\u5728\u4f7f\u7528\u7684\u5bb9\u5668\u7f13\u5b58\u76ee\u5f55\u4e5f\u4f1a\u7ee7\u7eed\u53d7\u5230\u4fdd\u62a4\u3002\n2. **\u5b89\u5168\u63a2\u6d4b\u88ab\u53d6\u6d88\u65f6\u4f1a\u505c\u6b62\u6574\u6b21\u6e05\u7406**\uff1a\u5982\u679c\u6d3b\u8dc3\u7f13\u5b58\u6216 SQLite \u68c0\u67e5\u8d85\u65f6\u3001\u88ab\u4e2d\u65ad\uff0cMole \u4f1a\u4fdd\u7559\u5f53\u524d\u76ee\u6807\uff0c\u505c\u6b62\u540e\u7eed\u6e05\u7406\u9636\u6bb5\uff0c\u5e76\u8fd4\u56de\u5931\u8d25\uff0c\u4e0d\u4f1a\u4f9d\u636e\u4e0d\u5b8c\u6574\u8bc1\u636e\u7ee7\u7eed\u6267\u884c\u3002\n3. **Analyze \u548c Status \u5c55\u793a\u7684\u7cfb\u7edf\u72b6\u6001\u66f4\u53ca\u65f6\u3001\u66f4\u6e05\u695a**\uff1aAnalyze \u4f1a\u663e\u793a\u672c\u5730 Time Machine \u5feb\u7167\u6570\u91cf\uff0c\u5e76\u8bf4\u660e\u4e3a\u4f55\u76ee\u5f55\u7edf\u8ba1\u4e0d\u5305\u542b\u4ec5\u7531\u5feb\u7167\u5360\u7528\u7684\u7a7a\u95f4\uff1bStatus \u65b0\u589e\u50f5\u5c38\u8fdb\u7a0b\u8bca\u65ad\uff0c\u5b8c\u6574\u5237\u65b0\u5931\u8d25\u65f6\u4f1a\u4fdd\u7559\u4e0a\u4e00\u4efd\u8fdb\u7a0b\u6570\u636e\u5e76\u6807\u8bb0\u4e3a\u8fc7\u671f\u3002\n4. **\u65e5\u5e38\u4f7f\u7528\u4e2d\u7684\u7ec6\u8282\u66f4\u5b89\u9759\u3001\u66f4\u660e\u786e**\uff1a\u4ec5\u5b89\u88c5 Command Line Tools \u7684 Mac \u4e0d\u518d\u63d0\u793a\u7f3a\u5c11 `simctl`\uff0c\u7d27\u51d1\u83dc\u5355\u4f1a\u4fdd\u7559 Space \u952e\u63d0\u793a\uff0c\u767d\u540d\u5355\u8bf4\u660e\u652f\u6301\u4efb\u610f\u8def\u5f84\uff0c\u540c\u65f6\u5305\u542b `x/text` \u5b89\u5168\u66f4\u65b0\u3002\n\n### Thanks\n\nIssue reporters and PR contributors this cycle: @r266-tech \u00b7 @M-Hassan-Raza \u00b7 @anupamme \u00b7 @devcsb \u00b7 @TyceHerrman \u00b7 @ilhanpaksoy \u00b7 @mitchmalone \u00b7 @grevgeny \u00b7 @Veritas-7.\n\n### Mole Mac App\n\nPrefer a GUI? [Mole Mac App](https://mole.fit/) brings cleaning, app management, maintenance, disk analysis, and live system status into one native app, with review before deletion and a customizable menu bar HUD. It is $19 once, with lifetime updates and a 14-day refund. [Download and try it](https://mole.fit/download). The CLI stays free and open source.\n","reactions":{"total_count":34,"+1":16,"-1":0,"laugh":1,"hooray":5,"confused":0,"heart":5,"rocket":6,"eyes":1},"mentions_count":9}
