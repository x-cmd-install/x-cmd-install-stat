yun/aliyun-cli/pull/1478\n* fix: honor config path when refreshing OAuth and CloudSSO credentials by @PanPanZou in https://github.com/aliyun/aliyun-cli/pull/1468\n* feat: support CLI credentials in MCP proxy by @PanPanZou in https://github.com/aliyun/aliyun-cli/pull/1465\n* Sign release archives and publish an SBOM and provenance for each one by @yndu13 in https://github.com/aliyun/aliyun-cli/pull/1473\n* fix: clarify safety policy configuration and confirmation boundaries by @Winphies in https://github.com/aliyun/aliyun-cli/pull/1480\n* feat(openapi): tell \"confirmed free\" apart from \"cannot be quoted\" in --estimate-cost by @api-tool-agent in https://github.com/aliyun/aliyun-cli/pull/1410\n* feat: apply API metadata read timeout defaults by @pl0301 in https://github.com/aliyun/aliyun-cli/pull/1475\n* Add shared CloudSSO sessions across profiles by @AllyW in https://github.com/aliyun/aliyun-cli/pull/1481\n* fix: validate JSON parameters as parent values by @Winphies in https://github.com/aliyun/aliyun-cli/pull/1485\n\n## New Contributors\n* @Winphies made their first contribution in https://github.com/aliyun/aliyun-cli/pull/1480\n\n**Full Changelog**: https://github.com/aliyun/aliyun-cli/compare/v3.5.1...v3.5.2","mentions_count":8}
