{"id":313586767,"author":{"login":"remorses","id":31321188,"node_id":"MDQ6VXNlcjMxMzIxMTg4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOP-qVg84SsPRP","tag_name":"critique@0.1.140","target_commitish":"main","name":"critique@0.1.140","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-04-25T13:41:58Z","updated_at":"2026-04-25T13:43:14Z","published_at":"2026-04-25T13:43:14Z","assets":[],"body":"1. **Fixed TypeScript syntax highlighting for boundary template-literal and docstring hunks** \u2014 diffs now keep syntax colors when a hunk starts or ends inside a multi-line string. This fixes cases like the shared `cli/src/database.ts` patch where later TypeScript lines were previously rendered as plain white text.\n\n2. **Fixed `--open` on Windows and clarified temp-file help text** \u2014 `critique --open` now launches the default browser correctly on Windows, and the `--pdf`, `review --pdf`, and `--image` help text now describes temp-file locations without assuming `/tmp`.\n\n3. **Hide generated artifacts from diff views by default** \u2014 critique now ignores both `snapshot.json` and Wrangler's generated `worker-configuration.d.ts` file the same way it already ignores lockfiles, keeping reviews focused on meaningful source changes.\n\nThanks @shanselman for #40.","mentions_count":1}
