\u5b9a\u5feb\u7167\u4f1a\u8bdd\u5bfc\u51fa\u7684\u5de5\u4f5c\u539f\u7406\u3002\n- [**Windows \u6c99\u7bb1**](https://github.com/esengine/DeepSeek-Reasonix/blob/ec82bb3251550b03b43b83418a716f73fe758ffd/docs/WINDOWS_SANDBOX.md) \u2014 Windows \u6c99\u7bb1\u9000\u5f79\u4e0e\u5de5\u5177\u5c42\u8fb9\u754c\u3002\n- [**\u9644\u4ef6\u4fee\u590d**](https://github.com/esengine/DeepSeek-Reasonix/blob/ec82bb3251550b03b43b83418a716f73fe758ffd/docs/ATTACHMENT_REPAIR_10457.md) \u2014 \u56fe\u7247\u9644\u4ef6\u7684\u63a5\u7eb3\u3001\u6301\u4e45\u5316\u4e0e\u5bfc\u51fa\u3002\n\n## \u6982\u89c8\n\n**Reasonix v1.38.11 \u2014 \u684c\u9762\u7248 1.38.11\uff1a\u4f1a\u8bdd\u53ef\u9760\u6027\u3001Windows \u4fee\u590d\u4e0e\u56fe\u7247\u9644\u4ef6**\n\n\u6b64\u7248\u672c\u63d0\u5347\u4e86\u4f1a\u8bdd\u8fc1\u79fb\u3001\u63a5\u7ba1\u4e0e\u5bfc\u51fa\u7684\u53ef\u9760\u6027\uff0c\u4fee\u590d\u4e86 Windows \u51ed\u636e\u4e0e Shell \u95ee\u9898\uff0c\u5e76\u5b8c\u5584\u56fe\u7247\u9644\u4ef6\u5728\u63d0\u4ea4\u3001\u5386\u53f2\u8bb0\u5f55\u4e0e\u5bfc\u51fa\u4e2d\u7684\u5904\u7406\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-20\n\n**Desktop 28 \u00b7 CLI 1**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u5386\u53f2\u4f1a\u8bdd\u6309\u9700\u8fc1\u79fb** \u2014 \u542f\u52a8\u65f6\u4e0d\u518d\u91cd\u653e\u5386\u53f2\u5bfc\u5165\u3002\u4f1a\u8bdd\u663e\u793a\u5728\u4fa7\u8fb9\u680f\u4e2d\uff0c\u6253\u5f00\u65f6\u8fdb\u884c\u8fc1\u79fb\uff0c\u8eab\u4efd\u4e0e\u6240\u6709\u6743\u53ef\u9760\u3002 ([#10566](https://github.com/esengine/DeepSeek-Reasonix/pull/10566))\n- **[Desktop \u00b7 CLI]** **\u8de8\u7aef\u4f1a\u8bdd\u63a5\u7ba1** \u2014 \u5728\u684c\u9762\u7aef\u4e0e CLI \u4e4b\u95f4\u901a\u8fc7\u4ea4\u63a5\u3001\u56de\u6536\u4e0e\u955c\u50cf\u63a5\u7ba1\u4f1a\u8bdd\u3002\u684c\u9762\u7aef\u56de\u6536\u540e CLI \u4fdd\u6301\u5b58\u6d3b\u3002 ([#10320](https://github.com/esengine/DeepSeek-Reasonix/pull/10320))\n- **[Desktop]** **Windows \u51ed\u636e\u81ea\u9501\u95ee\u9898\u5df2\u89e3\u51b3** \u2014 \u51ed\u636e\u4fdd\u5b58\u4e0d\u518d\u4f9d\u8d56 ACL \u4fee\u590d\u3002\u5df2\u79fb\u9664\u9000\u5f79\u7684\u6c99\u7bb1\u540e\u7aef\uff0c\u51ed\u636e\u6587\u4ef6\u53d7\u5230\u4fdd\u62a4\uff0c\u907f\u514d\u81ea\u9501\u3002 ([#10562](https://github.com/esengine/DeepSeek-Reasonix/pull/10562), [#10561](https://github.com/esengine/DeepSeek-Reasonix/pull/10561), [#10559](https://github.com/esengine/DeepSeek-Reasonix/pull/10559), [#10466](https://github.com/esengine/DeepSeek-Reasonix/pull/10466))\n- **[Desktop]** **\u4f1a\u8bdd\u4e2d\u7684\u56fe\u7247\u9644\u4ef6** \u2014 \u56fe\u7247\u5728\u4f1a\u8bdd\u8fb9\u754c\u88ab\u63a5\u7eb3\uff0c\u6301\u4e45\u5316\u5728\u8349\u7a3f\u4e2d\uff0c\u663e\u793a\u5728\u5386\u53f2\u8bb0\u5f55\u4e2d\uff0c\u5e76\u5305\u542b\u5728\u5bfc\u51fa\u4e2d\u3002 ([#10545](https://github.com/esengine/DeepSeek-Reasonix/pull/10545), [#10546](https://github.com/esengine/DeepSeek-Reasonix/pull/10546), [#10547](https://github.com/esengine/DeepSeek-Reasonix/pull/10547), [#10548](https://github.com/esengine/DeepSeek-Reasonix/pull/10548))\n- **[Desktop]** **\u4f1a\u8bdd\u5bfc\u51fa\u6355\u83b7\u5b8c\u6574\u5386\u53f2** \u2014 \u5bfc\u51fa\u73b0\u5728\u4f7f\u7528\u56fa\u5b9a\u7684\u6743\u5a01\u5feb\u7167\uff0c\u56e0\u6b64\u957f\u5bf9\u8bdd\u5305\u542b\u6240\u6709\u6d88\u606f\u548c\u5de5\u5177\u7ed3\u679c\u3002 ([#10471](https://github.com/esengine/DeepSeek-Reasonix/pull/10471))\n- **[Desktop]** **\u6388\u6743\u786e\u8ba4\u4e0d\u518d\u5361\u6b7b** \u2014 \u521d\u59cb\u6388\u6743\u4e0e\u505c\u6b62\u64cd\u4f5c\u53ef\u9760\u5de5\u4f5c\uff0c\u5177\u6709\u6b63\u786e\u7684\u53d6\u6d88\u4e0e\u7ed3\u679c\u4f20\u64ad\u3002 ([#10552](https://github.com/esengine/DeepSeek-Reasonix/pull/10552))\n\n### \u65b0\u589e\n\n- **[Desktop]** **\u6301\u4e45\u5316\u672c\u5730\u8349\u7a3f** \u2014 \u8349\u7a3f\u6309\u5de5\u4f5c\u533a\u4fdd\u5b58\uff0c\u65e0\u9700\u521b\u5efa\u4f1a\u8bdd\uff0c\u5e76\u6e05\u7406\u5386\u53f2\u7a7a\u4f1a\u8bdd\u3002 ([#10469](https://github.com/esengine/DeepSeek-Reasonix/pull/10469))\n- **[Desktop]** **\u6a21\u578b\u7ea7\u601d\u8003\u80fd\u529b** \u2014 \u601d\u8003\u8bbe\u7f6e\u6309\u6a21\u578b\u89e3\u6790\uff0c\u4fee\u590d\u65e7\u8fde\u63a5\u4e0e\u4f1a\u8bdd\u601d\u8003\u5f3a\u5ea6\u7684\u7ed1\u5b9a\u3002 ([#10500](https://github.com/esengine/DeepSeek-Reasonix/pull/10500))\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u4f1a\u8bdd\u6807\u9898\u4e00\u81f4\u6027** \u2014 AI \u91cd\u547d\u540d\u73b0\u5728\u66f4\u65b0\u6240\u6709\u754c\u9762\uff0c\u672a\u547d\u540d\u4f1a\u8bdd\u663e\u793a\u5176\u9996\u6761\u7528\u6237\u6d88\u606f\u3002 ([#10558](https://github.com/esengine/DeepSeek-Reasonix/pull/10558))\n- **[Desktop]** **\u65b0\u4f1a\u8bdd\u8349\u7a3f\u9875** \u2014 \u5065\u5eb7\u8349\u7a3f\u663e\u793a\u6b22\u8fce\u8f93\u5165\u6846\uff0c\u6b63\u5f0f\u4f1a\u8bdd\u4ec5\u5728\u9996\u6761\u6d88\u606f\u540e\u521b\u5efa\u3002 ([#10551](https://github.com/esengine/DeepSeek-Reasonix/pull/10551))\n- **[Desktop]** **\u8349\u7a3f\u6a21\u578b\u4e0e\u6807\u9898\u5bf9\u9f50** \u2014 \u65b0\u4f1a\u8bdd\u8349\u7a3f\u9075\u5faa\u5b9e\u65f6\u9ed8\u8ba4\u6a21\u578b\uff0c\u907f\u514d\u5185\u90e8\u8def\u7531\u6807\u9898\u3002 ([#10572](https://github.com/esengine/DeepSeek-Reasonix/pull/10572))\n- **[Desktop]** **\u4f1a\u8bdd\u72b6\u6001\u5f52\u5c5e** \u2014 \u4ea4\u4e92\u5361\u7247\u7ed1\u5b9a\u5230\u5176\u539f\u59cb\u8bf7\u6c42\uff0c\u9632\u6b62\u8de8\u4f1a\u8bdd\u6cc4\u6f0f\u3002 ([#10507](https://github.com/esengine/DeepSeek-Reasonix/pull/10507))\n- **[Desktop]** **Windows \u5de5\u4f5c\u533a\u5f52\u5c5e** \u2014 \u4fee\u590d\u91cd\u590d\u5de5\u4f5c\u533a\u6240\u6709\u8005\uff0c\u5bfc\u822a\u5728\u5173\u95ed\u671f\u95f4\u53ef\u53d6\u6d88\u3002 ([#10554](https://github.com/esengine/DeepSeek-Reasonix/pull/10554), [#10570](https://github.com/esengine/DeepSeek-Reasonix/pull/10570))\n- **[Desktop]** **\u6587\u4ef6\u7cfb\u7edf\u8eab\u4efd\u7edf\u4e00** \u2014 \u8def\u5f84\u8eab\u4efd\u4e0e\u9501\u8de8\u7248\u672c\u7edf\u4e00\uff0c\u4fee\u590d Windows \u5927\u5c0f\u5199\u95ee\u9898\u3002 ([#10518](https://github.com/esengine/DeepSeek-Reasonix/pull/10518))\n- **[Desktop]** **Windows Shell \u6267\u884c** \u2014 Shell \u547d\u4ee4\u4f7f\u7528 PowerShell\uff0c\u5de5\u4f5c\u76ee\u5f55\u4e0e\u8fdb\u7a0b\u5904\u7406\u66f4\u52a0\u53ef\u9760\u3002 ([#10553](https://github.com/esengine/DeepSeek-Reasonix/pull/10553))\n- **[Desktop]** **\u4f1a\u8bdd\u5bfc\u51fa\u8eab\u4efd** \u2014 \u5bfc\u51fa\u56fa\u5b9a\u5230\u6355\u83b7\u7684\u4f1a\u8bdd\u8eab\u4efd\uff0c\u9632\u6b62\u51b2\u7a81\u3002 ([#10580](https://github.com/esengine/DeepSeek-Reasonix/pull/10580))\n- **[Desktop]** **\u5f52\u6863\u4f1a\u8bdd\u4fdd\u6301\u5f52\u6863** \u2014 \u5355\u5934\u5386\u53f2\u4f1a\u8bdd\u5f52\u6863\u540e\u4e0d\u518d\u91cd\u65b0\u51fa\u73b0\u3002 ([#10490](https://github.com/esengine/DeepSeek-Reasonix/pull/10490))\n- **[Desktop]** **\u4fdd\u5b58\u4f1a\u8bdd\u6062\u590d** \u2014 \u542f\u52a8\u65f6\u534f\u8c03\u4fdd\u5b58\u7684\u6807\u7b7e\u9875\uff0c\u4e0d\u4e22\u5931\u6709\u6548\u4f1a\u8bdd\u6216\u672a\u77e5\u5b57\u6bb5\u3002 ([#10510](https://github.com/esengine/DeepSeek-Reasonix/pull/10510))\n- **[Desktop]** **\u5feb\u7167\u8bb0\u5f55\u8eab\u4efd** \u2014 \u6bcf\u6761\u8bb0\u5f55\u83b7\u5f97\u7a33\u5b9a\u8eab\u4efd\uff0c\u4fee\u590d\u6c34\u5408\u5931\u8d25\u3002 ([#10550](https://github.com/esengine/DeepSeek-Reasonix/pull/10550))\n- **[Desktop]** **\u9000\u51fa\u4e0e\u8bca\u65ad** \u2014 \u9000\u51fa\u7b49\u5f85\u4f1a\u8bdd\u6301\u4e45\u5316\uff0c\u5d29\u6e83\u8bca\u65ad\u5f97\u5230\u6539\u8fdb\u3002 ([#10520](https://github.com/esengine/DeepSeek-Reasonix/pull/10520))\n- **[Desktop]** **AI \u4f1a\u8bdd\u6807\u9898\u9884\u7b97** \u2014 \u6a21\u578b\u8c03\u7528\u62e5\u6709\u5b8c\u6574\u8d85\u65f6\uff0c\u907f\u514d\u8fc7\u65e9\u5931\u8d25\u3002 ([#10575](https://github.com/esengine/DeepSeek-Reasonix/pull/10575))\n- **[Desktop]** **\u5f52\u6863\u540e\u7a7a\u767d\u4f1a\u8bdd** \u2014 \u5f52\u6863\u6