ed_at":"2026-10-23T17:49:55Z","updated_at":"2026-10-23T17:49:55Z"},{"id":669911869,"node_id":"RA_kwDOSIatD84n7gs9","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:87f950faa67d583cef10c5269de476dae88529f66344228400b5a84847e1bbfe","download_count":12,"created_at":"2026-10-23T17:49:55Z","updated_at":"2026-10-23T17:49:55Z"}],"body":"\u672c\u7248\u8ba9\u5b50\u4ee3\u7406\u53ef\u4ee5\u5728\u5de5\u4f5c\u53f0\u91cc\u5f00\u6210\u6807\u7b7e\u9875\u8bfb\u5b8c\u6574\u8bb0\u5f55\uff0c\u8bbe\u7f6e\u91cc\u65b0\u589e\u5bfc\u822a\u5165\u53e3\u7ba1\u7406\u3001\u8ba1\u8d39\u65b9\u5f0f\u548c\u653e\u5927\u8bbe\u7f6e\u7a97\u53e3\uff0c\u6b63\u6587\u680f\u53ef\u62d6\u5bbd\uff0c\u5e76\u4fee\u590d\u591a\u5904\u5361\u4f4f\u3001\u663e\u793a\u4e0e\u5bf9\u9f50\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u6b63\u6587\u680f\u5de6\u53f3\u8fb9\u7ebf\u53ef\u4ee5\u62d6\u52a8\uff0c\u4e24\u4fa7\u540c\u65f6\u7b49\u91cf\u53d8\u5bbd\u6216\u6536\u7a84\uff1b\u7f29\u5230\u201c\u9002\u5b9c\u9605\u8bfb\u201d\u4e3a\u6b62\uff0c\u653e\u5230\u7a97\u53e3\u5168\u5bbd\u4e3a\u6b62\uff0c\u88ab\u6321\u4f4f\u7684\u4fa7\u680f\u6309\u5404\u81ea\u8bbe\u5b9a\u7684\u6bd4\u4f8b\u8ba9\u4f4d\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- \u53cd\u9988\u8868\u5355\u7684\u6b63\u6587\u53ef\u4ee5\u5207\u5230\u300c\u9884\u89c8\u300d\uff0c\u5148\u770b Markdown \u6e32\u67d3\u7684\u6837\u5b50\uff1b\u516c\u5f00\u7684\u8bae\u9898\u4ecd\u628a\u539f\u6587\u653e\u5728\u4ee3\u7801\u5757\u91cc\u3002\u4fee\u590d #14248 fixed in #14255\u3002\n- \u8bbe\u7f6e \u2192 \u5916\u89c2 \u2192\u300c\u5bfc\u822a\u5165\u53e3\u300d\u53ef\u9690\u85cf\u6216\u8c03\u6574\u56fe\u6807\u680f\u548c\u4fa7\u680f\u91cc\u7684\u5165\u53e3\uff0c\u4e24\u5904\u540c\u6b65\uff1b\u4f1a\u8bdd\u3001\u53cd\u9988\u3001\u8d26\u53f7\u548c\u8bbe\u7f6e\u59cb\u7ec8\u4fdd\u7559\u3002\u5173\u8054 #14236\u3001#14190\u3002\n- \u8bbe\u7f6e\u7a97\u53e3\u5934\u90e8\u591a\u4e86\u300c\u653e\u5927\u8bbe\u7f6e\u7a97\u53e3\u300d\u6309\u94ae\uff0c\u53ef\u94fa\u6ee1\u6574\u4e2a\u7a97\u53e3\u3001\u5185\u5bb9\u533a\u540c\u6b65\u53d8\u5bbd\uff1b\u9009\u62e9\u4f1a\u8bb0\u4f4f\uff0c\u4e0b\u6b21\u6253\u5f00\u4fdd\u6301\u3002\u4fee\u590d #14272 fixed in #14271\u3002\n- \u684c\u9762\u7aef\u53ef\u8fde\u81ea\u5df1\u90e8\u7f72\u7684\u8fdc\u7a0b\u7f51\u5173\uff08REASONIX_REMOTE_URL\u3001REASONIX_REMOTE_GATEWAY_ID\uff09\uff0c\u624b\u673a\u7f51\u9875\u6309\u6388\u6743\u91cc\u7684\u7f51\u5173\u5730\u5740\u8fde\u63a5\uff1b\u975e wss:// \u5730\u5740\u4f1a\u88ab\u62d2\u7edd\u3002\u5173\u8054 #14282\u3002\n- \u4ece\u201c\u5b50\u4ee3\u7406\u201d\u9762\u677f\u6253\u5f00\u5b50\u4ee3\u7406\uff0c\u4f1a\u5728\u5de5\u4f5c\u53f0\u5f00\u6210\u6807\u7b7e\u9875\uff0c\u8bfb\u5185\u6838\u8bb0\u5f55\u7684\u5b8c\u6574\u5bf9\u8bdd\uff08\u8fd0\u884c\u4e2d\u6301\u7eed\u5237\u65b0\uff09\uff0c\u5de5\u5177\u6b65\u9aa4\u53ef\u6298\u53e0\u3001\u53ef\u540c\u65f6\u5f00\u591a\u4e2a\uff1b\u627e\u4e0d\u5230\u8bb0\u5f55\u65f6\u4ecd\u7528\u539f\u5bf9\u8bdd\u6846\u3002\u5173\u8054 #13523 fixed in #14291\u3002\n- \u8fde\u63a5\u7f16\u8f91\u9875\u53ef\u9009\u201c\u8ba1\u8d39\u65b9\u5f0f\u201d\uff08\u6309\u91cf\u8ba1\u8d39\u6216\u8ba2\u9605\u5957\u9910\uff09\uff0c\u8ba2\u9605\u5957\u9910\u7684\u7528\u91cf\u4f1a\u6309\u6240\u586b\u4ef7\u683c\u6298\u7b97\u6210\u4f30\u7b97\u503c\u5355\u72ec\u663e\u793a\uff0c\u4e0d\u8ba1\u5165\u5b9e\u9645\u82b1\u8d39\u3002\u5173\u8054 #13276\u3002\n- \u8bbe\u7f6e \u2192 \u5de5\u5177\u4e0e\u6743\u9650\u7b2c\u4e8c\u9879\u63d0\u4f9b\u300cAI \u6587\u4ef6\u4ea4\u4ed8\u5361\u7247\u300d\u5f00\u5173\uff0c\u652f\u6301\u641c\u7d22\u5e76\u4fdd\u5b58\u7528\u6237\u9009\u62e9\uff0c\u91cd\u65b0\u6253\u5f00\u4f1a\u8bdd\u751f\u6548\u3002\u5173\u8054 #14063 by @SivanCola\u3002\n\n## \u53d8\u66f4\n\n- \u4fa7\u680f\u4f1a\u8bb0\u4f4f\u4f60\u6298\u53e0\u8fc7\u7684\u9879\u76ee\uff0c\u91cd\u65b0\u6253\u5f00\u754c\u9762\u540e\u4ecd\u4fdd\u6301\u6298\u53e0\uff1b\u65b0\u9879\u76ee\u9ed8\u8ba4\u5c55\u5f00\uff0c\u4e0d\u66ff\u4f60\u505a\u51b3\u5b9a\u3002\u5173\u8054 #14195 by @lancy69\u3002\n- \u8bbe\u7f6e\u6253\u5f00\u65f6\uff0c\u80cc\u540e\u7684\u5185\u5bb9\u88ab\u66f4\u6df1\u7684\u5e73\u9762\u906e\u7f69\u538b\u4e0b\u53bb\uff0c\u8bbe\u7f6e\u9762\u677f\u66f4\u7a81\u51fa\uff1b\u6ca1\u6709\u4f7f\u7528\u5b9e\u65f6\u6a21\u7cca\u3002\u5173\u8054 #14196 by @lancy69\u3002\n- \u6b63\u6587\u4e24\u4fa7\u7684\u62d6\u62fd\u8fb9\u7ebf\u5e38\u9a7b\u4e00\u6761\u77ed\u7ec6\u7ebf\uff0c\u770b\u5f97\u51fa\u8fd9\u91cc\u53ef\u4ee5\u62d6\uff1b\u957f\u5bf9\u8bdd\u91cc\u56de\u5230\u9876\u90e8\u4e0e\u8df3\u5230\u6700\u65b0\u7684\u63d0\u793a\u4e0d\u518d\u4e00\u79fb\u5c31\u6d88\u5931\uff1b\u4e24\u4e2a\u628a\u624b\u4e5f\u80fd\u7528\u952e\u76d8\u8c03\u5bbd\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- \u9690\u85cf\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u5217\u51fa\u4e0e\u56fe\u6807\u680f\u76f8\u540c\u7684\u5165\u53e3\uff08\u6587\u4ef6\u3001\u5de5\u5177\u4e0e\u6743\u9650\u3001\u6269\u5c55\u3001\u8bb0\u5fc6\u3001\u8fdc\u7a0b\uff09\uff0c\u540d\u79f0\u7edf\u4e00\uff1b\u4e24\u5904\u8bfb\u540c\u4e00\u4efd\u6e05\u5355\u3002\u5173\u8054 #14236\u3002\n- \u5e76\u884c\u5199\u5165\u7684\u201c\u4e50\u89c2\u6a21\u5f0f\u201d\u73b0\u5728\u9ed8\u8ba4\u5f00\u542f\uff1a\u6ca1\u58f0\u660e\u5199\u5165\u8303\u56f4\u7684\u5b50\u4ee3\u7406\u548c\u5199\u5165\u4e0d\u518d\u5360\u4f4f\u6574\u4e2a\u5de5\u4f5c\u533a\uff1b\u5df2\u9009\u8fc7\u201c\u4e25\u683c\u201d\u7684\u4e0d\u53d7\u5f71\u54cd\uff0c\u53ef\u5728\u8bbe\u7f6e\u91cc\u5173\u95ed\u3002\u5173\u8054 #14240\u3002\n- \u4f60\u5bf9\u67d0\u4e2a\u5bf9\u8bdd\u9009\u7684\u201c\u672c\u4f1a\u8bdd\u5141\u8bb8\u201d\u73b0\u5728\u968f\u8fd9\u4e2a\u5bf9\u8bdd\u4fdd\u5b58\uff0c\u6062\u590d\u6216\u91cd\u65b0\u6253\u5f00\u8fd9\u4e2a\u5bf9\u8bdd\u540e\u4e0d\u518d\u91cd\u590d\u8be2\u95ee\uff1b\u4ecd\u53ea\u5bf9\u8be5\u5bf9\u8bdd\u6709\u6548\uff0c\u53ef\u968f\u65f6\u64a4\u9500\u3002\u5173\u8054 #14243\u3002\n- AI \u6587\u4ef6\u4ea4\u4ed8\u5de5\u5177\u9ed8\u8ba4\u5f00\u542f\uff1b\u5df2\u6709\u7684\u663e\u5f0f\u5173\u95ed\u9009\u62e9\u4ecd\u7136\u6709\u6548\u3002\u4e0b\u4e00\u6b21\u6253\u5f00\u4f1a\u8bdd\u65f6\u589e\u52a0\u5de5\u5177\u5b9a\u4e49\uff0c\u53ef\u80fd\u4ea7\u751f\u4e00\u6b21\u7f13\u5b58\u672a\u547d\u4e2d\u3002\u5173\u8054 #14063 by @SivanCola\u3002\n\n## \u4fee\u590d\n\n- \u5de5\u4f5c\u6a21\u5f0f\u83dc\u5355\u4e2d\u7684 Ask \u540d\u79f0\u540e\u660e\u786e\u6807\u6ce8\u201c\uff08\u672a\u5b9e\u73b0\uff09\u201d\uff0c\u907f\u514d\u8bef\u4ee5\u4e3a\u9700\u8981\u989d\u5916\u914d\u7f6e\u624d\u80fd\u542f\u7528\uff1b\u73b0\u6709\u6a21\u5f0f\u5207\u6362\u548c\u7981\u7528\u884c\u4e3a\u4fdd\u6301\u4e0d\u53d8\u3002\u5173\u8054 #14028 fixed in #14093 by @lancy69\u3002\n- \u5bf9\u8bdd\u680f\u53d8\u7a84\uff08\u5982\u5c55\u5f00\u5de5\u4f5c\u53f0\uff09\u65f6\uff0c\u8f93\u5165\u6846\u5e95\u90e8\u7684\u6309\u94ae\u6761\u4e0d\u518d\u6298\u6210\u4e24\u884c\uff1a\u6a21\u5f0f\u6309\u94ae\u66f4\u65e9\u6536\u6210\u56fe\u6807\uff0c\u6a21\u578b\u540d\u968f\u680f\u5bbd\u6536\u7f29\u3002\u5173\u8054 #14156\u3002\n- \u4e00\u4e2a\u4f1a\u8bdd\u7528\u5230\u591a\u79cd\u8d27\u5e01\u65f6\uff0c\u8ba1\u91cf\u6761\u548c\u8d39\u7528\u9762\u677f\u4e0d\u518d\u628a\u4e0d\u540c\u5e01\u79cd\u7684\u91d1\u989d\u76f4\u63a5\u76f8\u52a0\uff0c\u800c\u662f\u5206\u5e01\u79cd\u5404\u663e\u793a\u4e00\u4e2a\u91d1\u989d\u3002\u5173\u8054 #14178 by @chuiwenwei\u3002\n- \u53ea\u8fd0\u884c\u4e00\u6b21\u7684\u5b9a\u65f6\u4efb\u52a1\u9519\u8fc7\u65f6\u95f4\u540e\uff0c\u4e0d\u518d\u4e00\u76f4\u663e\u793a\u201c\u8fd0\u884c\u4e2d\u201d\uff1b\u5b83\u4f1a\u53d8\u6210\u201c\u5df2\u5230\u671f\u201d\uff0c\u4e0d\u518d\u51fa\u73b0\u70b9\u201c\u7eed\u671f\u201d\u63d0\u793a\u6210\u529f\u5374\u4ec0\u4e48\u90fd\u6ca1\u8fd0\u884c\u3002\u5173\u8054 #14179 by @chuiwenwei\u3002\n- \u7ec8\u7aef\u91cc\u5bf9\u201c\u53ef\u80fd\u5df2\u7ecf\u8dd1\u8fc7\u201d\u7684\u6062\u590d\u6761\u76ee\u6309 r \u6216 /queue retry \u4e0d\u518d\u91cd\u65b0\u53d1\u9001\uff0c\u4f1a\u8bf4\u660e\u539f\u56e0\u5e76\u5efa\u8bae\u5148\u770b\u5bf9\u8bdd\u8bb0\u5f55\u6216\u5220\u9664\u5b83\u3002\u5173\u8054 #14180 by @chuiwenwei\u3002\n- \u5bfc\u5165\u65e7\u4f1a\u8bdd\u65f6\uff0c\u4e0d\u518d\u628a\u53e6\u4e00\u4e2a\u7a97\u53e3\u6b63\u6253\u5f00\u7740\u7684\u4f1a\u8bdd\u642c\u8d70\u6216\u5220\u9664\uff1b\u8fd9\u7c7b\u4f1a\u8bdd\u4f1a\u7559\u5728\u539f\u5904\uff0c\u4e4b\u540e\u518d\u5bfc\u5165\u3002\u5173\u8054 #14181 by @chuiwenwei\u3002\n- \u8f93\u5165\u6846\u4e0b\u65b9\u8ba1\u91cf\u6761\u628a\u6574\u4e2a\u4f1a\u8bdd\u7684\u7d2f\u8ba1\u82b1\u8d39\u6807\u6210\u4e86\u201c\u672c\u8f6e\u201d\uff1b\u73b0\u5728\u201c\u672c\u4f1a\u8bdd\u201d\u663e\u793a\u7d2f\u8ba1\u603b\u989d\uff0c\u201c\u672c\u8f6e\u201d\u53ea\u663e\u793a\u6700\u8fd1\u4e00\u8f6e\u7684\u82b1\u8d39\u3002\u5173\u8054 #14200\u3002\n- \u961f\u5217\u73b0\u5728\u7531\u5185\u6838\u62d2\u7edd\u91cd\u53d1\u201c\u53ef\u80fd\u5df2\u7ecf\u8dd1\u8fc7\u201d\u7684\u6062\u590d\u6761\u76ee\uff0c\u901a\u8fc7\u63a5\u53e3\u6216 ACP \u8c03\u7528\u91cd\u8bd5\u65f6\u4e5f\u4e00\u6837\uff0c\u4e0d\u4f1a\u518d\u91cd\u590d\u6267\u884c\u540c\u4e00\u6761\u6307\u4ee4\u3002\u5173\u8054 #14202\u3002\n- \u201c\u4ea4\u4ed8\u9a8c\u6536\u201d\u5361\u7247\u91cc\u7684\u957f\u547d\u4ee4\u4e0d\u518d\u94fa\u6ee1\u4e00\u5927\u7247\uff0c\u53ea\u663e\u793a\u5f00\u5934\u4e00\u884c\u5e76\u4ee5\u7701\u7565\u53f7\u7ed3\u5c3e\uff0c\u5b8c\u6574\u547d\u4ee4\u5728\u9f20\u6807\u60ac\u505c\u65f6\u53ef\u89c1\u3002\u5173\u8054 #14204\u3002\n- \u9690\u85cf\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u5404\u884c\u7684\u56fe\u6807\u548c\u6587\u5b57\u5bf9\u9f50\u5728\u540c\u4e00\u6761\u7ad6\u7ebf\u4e0a\uff0c\u5b57\u53f7\u7edf\u4e00\u4e3a 12px\uff0c\u201c\u65b0\u5efa\u4f1a\u8bdd\u201d\u548c\u201c\u53d1\u9001\u53cd\u9988\u201d\u4e0d\u518d\u52a0\u7c97\u3002\u5173\u8054 #14207\u3002\n- \u8bbe\u7f6e\u91cc\u201c\u6a21\u578b\u53ef\u7528\u7684\u5de5\u5177\u201d\u5217\u8868\u4e2d\uff0c\u5176\u4f59\u5185\u7f6e\u5de5\u5177\uff08\u641c\u7d22\u3001\u8bfb\u5199\u6587\u4ef6\u3001\u5b50\u4ee3\u7406\u3001\u8bb0\u5fc6\u3001\u540c\u4f34\u534f\u4f5c\u7b49\uff09\u4e5f\u6309\u754c\u9762\u8bed\u8a00\u663e\u793a\u4e00\u53e5\u8bdd\u8bf4\u660e\uff0c\u4e0d\u518d\u9732\u51fa\u82f1\u6587\u539f\u6587\u3002\u5173\u8054 #14208\u3002\n- \u5728\u53cd\u9988\u7a97\u53e3\u91cc\u70b9\u8fc7\u7a7a\u767d\u5904\u4e4b\u540e\uff0cCtrl+V \u7c98\u8d34\u622a\u56fe\u4e0d\u518d\u6ca1\u53cd\u5e94\uff1b\u526a\u8d34\u677f\u91cc\u4ee5\u6761\u76ee\u5f62\u5f0f\u7ed9\u51fa\u7684\u56fe\u7247\u4e5f\u80fd\u8d34\u8fdb\u53bb\u3002\u5173\u8054 #14210\u3002\n- \u8bbe\u7f6e\u7a97\u53e3\u52a0\u9ad8\uff0c\u83dc\u5355\u5728 1080p \u5c4f\u5e55\u4e0a\u5b8c\u6574\u663e\u793a\u3001\u4e0d\u518d\u51fa\u73b0\u6eda\u52a8\u6761\uff1b\u201c\u8bb0\u5fc6\u201d\u56fe\u6807\u4e0e\u6587\u5b57\u5782\u76f4\u5bf9\u9f50\uff1b\u7a7a\u767d\u4f1a\u8bdd\u63d0\u793a\u548c\u8fd0\u884c\u5206\u6790\u9762\u677f\u7edf\u4e00\u79f0\u201c\u8fd0\u884c\u5206\u6790\u201d\u548c\u201c\u8fd0\u884c\u8bb0\u5f55\u201d\uff0c\u4e0d\u518d\u6df7\u79f0\u201c\u8f68\u8ff9\u201d\u3002\u5173\u8054 #14211\u3002\n- \u5b9a\u65f6\u8fd0\u884c\u9875\u73b0\u5728\u53ef\u4ee5\u76f4\u63a5\u4fe1\u4efb\u5f53\u524d\u9879\u76ee\uff0c\u4e0d\u518d\u8981\u6c42\u5148\u53bb\u522b\u5904\u70b9\u4fe1\u4efb\uff1b\u4e4b\u524d\u70b9\u8fc7\u201c\u6682\u4e0d\u4fe1\u4efb\u201d\u6216\u624b\u52a8\u9009\u8fc7\u6279\u51c6\u6a21\u5f0f\u3001\u4ece\u672a\u770b\u5230\u4fe1\u4efb\u63d0\u793a\u7684\u9879\u76ee\u4e5f\u80fd\u5904\u7406\u3002\u5173\u8054 #14216\u3002\n- \u4fa7\u680f\u5404\u884c\uff08\u65b0\u5efa\u4f1a\u8bdd\u3001\u641c\u7d22\u3001\u6587\u4ef6\u3001\u5de5\u5177\u4e0e\u96c6\u6210\u3001\u8fd0\u884c\u73af\u5883\u3001\u94b1\u5305\u4e0e\u7528\u91cf\u3001\u53d1\u9001\u53cd\u9988\uff09\u7684\u6587\u5b57\u7edf\u4e00\u4e3a\u540c\u4e00\u79cd\u989c\u8272\uff0c\u201c\u65b0\u5efa\u4f1a\u8bdd\u201d\u4e0d\u518d\u6709\u5e95\u8272\u3002\u5173\u8054 #14221\u3002\n- \u9876\u680f\u300c\u8fd0\u884c\u5206\u6790\u300d\u7684\u56fe\u6807\u6362\u6210\u8109\u51b2\u7ebf\uff0c\u548c\u65c1\u8fb9\u7684\u56fe\u6807\u4e00\u6837\u5927\u3001\u4e00\u6837\u7c97\uff0c\u4e0d\u518d\u662f\u504f\u5c0f\u7684\u534a\u5706\u4eea\u8868\u76d8\u3002\u4fee\u590d #14222 fixed in #14269\u3002\n- \u9690\u85cf\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u56fe\u6807\u5bf9\u9f50\u9879\u76ee\u6587\u4ef6\u5939\uff0c\u6807\u5fd7\u5bf9\u9f50\u884c\u6587\u5b57\uff1b\u4f1a\u8bdd\u5206\u7ec4\u6807\u7b7e\u6587\u5b57\u4e0a\u4e0b\u5c45\u4e2d\uff1b\u4e0a\u9762\u51e0\u884c\u53bb\u6389\u63d0\u793a\uff1b\u8d26\u53f7\u5934\u50cf\u6539\u4e3a\u5355\u4e00\u5706\u89d2\u65b9\u5757\u3002\u5173\u8054 #14226\u3002\n- \u300c\u5728\u6587\u4ef6\u7ba1\u7406\u5668\u4e2d\u663e\u793a\u300d\u6309\u94ae\u6362\u6210\u6253\u5f00\u7684\u6587\u4ef6\u5939\u56fe\u6807\uff0c\u4e0d\u518d\u50cf\u5206\u4eab\u6216\u5916\u94fe\u7bad\u5934\u3002\u5173\u8054 #14227\u3002\n- \u5de5\u4f5c\u53f0\u9876\u680f\u91cc\u201c\u52a0\u5bbd\u5de5\u4f5c\u53f0\u201d\u6309\u94ae\u79fb\u5230\u6700\u5de6\u8fb9\uff0c\u201c\u5168\u5c4f\u5de5\u4f5c\u53f0\u201d\u6309\u94ae\u79fb\u5230\u6700\u53f3\u8fb9\uff0c\u4e0d\u518d\u5939\u5728\u6807\u7b7e\u4e2d\u95f4\u3002\u5173\u8054 #14229\u3002\n- \u6a21\u578b\u73b0\u5728\u77e5\u9053\u5b50\u4ee3\u7406\u4e0d\u662f\u65b0\u4f1a\u8bdd\uff1a\u7531\u5b83\u6d3e\u51fa\u3001\u7ed3\u679c\u56de\u5230\u5f53\u524d\u5bf9\u8bdd\u3001\u5d4c\u5957\u6df1\u5ea6\u53d7 `max_subagent_depth` \u9650\u5236\u3002\u5173\u8054 #14247\u3002\n- \u8bfb\u53d6\u88ab\u62d2\u65f6\u4e0d\u518d\u53ea\u5199\u201c\u6ca1\u6709\u6743\u9650\u201d\uff1a\u73b0\u5728\u8bf4\u660e\u662f\u54ea\u4e2a\u8def\u5f84\u3001\u5b83\u4e0d\u5728\u4f1a\u8bdd\u5141\u8bb8\u8bfb\u53d6\u7684\u6587\u4ef6\u5939\u91cc\uff0c\u8fd8\u662f\u5728\u4f60\u914d\u7f6e\u7684\u7981\u8bfb\u5217\u8868\u91cc\u3002\u5173\u8054 #14252\u3002\n- \u201c\u6211\u7684\u53cd\u9988\u201d\u518d\u6b21\u6253\u5f00\u65f6\u7acb\u5373\u663e\u793a\u4e0a\u6b21\u7684\u5217\u8868\u5e76\u5728\u540e\u53f0\u5237\u65b0\uff1b\u7b49\u7ea7\u3001\u8d26\u53f7\u5173\u8054\u548c\u8d21\u732e\u699c\u6536\u8fdb\u4e00\u884c\u6298\u53e0\uff0c\u70b9\u5f00\u624d\u52a0\u8f7d\uff0c\u4e0d\u518d\u5360\u6ee1\u9996\u5c4f\u3002\u5173\u8054 #14254\u3002\n- \u6267\u884c\u8fc7\u7a0b\u91cc\u8c03\u7528\u6280\u80fd\u7684\u6b65\u9aa4\u4f1a\u5199\u51fa\u6280\u80fd\u540d\u79f0\uff0c\u4e0d\u518d\u53ea\u663e\u793a `run_skill`\u3002\u5173\u8054 #14256 fixed in #14259\u3002\n- \u5185\u6838\u62d2\u7edd\u8bf7\u6c42\u540e\uff0c\u5916\u58f3\u4f1a\u68c0\u67e5\u672c\u6b21\u542f\u52a8\u7684\u51ed\u636e\uff0c\u7f3a\u5931\u5c31\u7acb\u5373\u8865\u56de\uff0c\u4e0d\u5fc5\u91cd\u542f Studio\u3002\u5173\u8054 #14260\u3002\n- \u63d2\u4ef6\u7684\u8fd0\u884c\u65f6\u547d\u4ee4\u4e0d\u662f\u53ef\u6267\u884c\u7a0b\u5e8f\uff08\u4f8b\u5982 Windows \u4e0a\u7684 `.sh` \u811a\u672c\uff09\u65f6\uff0c\u62a5\u9519\u76f4\u63a5\u8bf4\u660e\u9700\u8981\u63d0\u4f9b\u539f\u751f\u53ef\u6267\u884c\u6587\u4ef6\uff0c\u4e0d\u518d\u53ea\u663e\u793a\u7cfb\u7edf\u539f\u8bdd\u3002\u5173\u8054 #14263\u3002\n- \u9009\u4e86\u4e0e\u5f53\u524d\u5b9e\u9645\u8bf7\u6c42\u76f8\u540c\u7684\u601d\u8003\u5f3a\u5ea6\uff08\u5982\u300c\u81ea\u52a8\u300d\u672c\u5c31\u7b49\u4e8e\u300c\u6df1\u5165\u300d\uff09\u540e\uff0c\u5f3a\u5ea6\u6309\u94ae\u7acb\u523b\u663e\u793a\u4f60\u7684\u9009\u62e9\uff0c\u4e0d\u5fc5\u9000\u51fa\u91cd\u8fdb\u3002\u4fee\u590d #14173 fixed in #14265\u3002\n- \u4ed8\u8d39\u641c\u7d22\u3001\u7f51\u7edc\u51fa\u7ad9\u548c MCP \u767b\u5f55\u7684\u5ba1\u6279\u5361\uff0c\u300c\u59cb\u7ec8\u5141\u8bb8\u300d\u4e0b\u65b9\u7684\u8bf4\u660e\u6539\u4e3a\u5199\u660e\u5b83\u5b9e\u9645\u8bb0\u5728\u54ea\u91cc\uff0c\u4e0d\u518d\u4e00\u5f8b\u8bf4\u6210\u6743\u9650\u89c4\u5219\u3002\u5173\u8054 #14242\u3002\n- \u8bbe\u7f6e\u91cc\u300c\u591a\u4e2a\u4f1a\u8bdd\u540c\u65f6\u5199\u4e00\u4e2a\u9879\u76ee\u300d\u548c\u300c\u5b50\u4ee3\u7406\u7684\u5199\u5165\u8303\u56f4\u300d\u4e24\u5904\u7684\u8bf4\u660e\u6539\u4e3a\u4e0e\u65b0\u7684\u9ed8\u8ba4\u503c\uff08\u4e50\u89c2\u6a21\u5f0f\uff09\u4e00\u81f4\uff0c\u4e0d\u518d\u5199\u300c\u9ed8\u8ba4\u4e25\u683c\u300d\u3002\u5173\u8054 #14240\u3002\n- \u6a21\u578b\u770b\u5230\u7684\u300c\u6d3e\u51fa\u5b50\u4ee3\u7406\u300d\u5de5\u5177\u8bf4\u660e\uff0c\u6309\u65b0\u7684\u9ed8\u8ba4\u503c\uff08\u4e50\u89c2\u6a21\u5f0f\uff09\u63cf\u8ff0\u6ca1\u58f0\u660e\u5199\u5165\u8303\u56f4\u7684\u5199\u5165\uff0c\u4e0d\u518d\u8bf4\u5b83\u4f1a\u5360\u4f4f\u6574\u4e2a\u5de5\u4f5c\u533a\u3002\u5173\u8054 #14240\u3002\n- \u4fa7\u680f\u5165\u53e3\u7684\u6587\u5b57\u6bd4\u56fe\u6807\u504f\u9ad8\uff0c\u4e14\u201c\u5de5\u5177\u4e0e\u6743\u9650\u201d\u7b49\u56fe\u6807\u6bd4\u4e0a\u9762\u51e0\u9879\u66f4\u7c97\u66f4\u5927\uff1b\u73b0\u5728\u6587\u5b57\u4e0e\u56fe\u6807\u5c45\u4e2d\uff0c\u56fe\u6807\u7c97\u7ec6\u5927\u5c0f\u4e00\u81f4\u3002\u5173\u8054 #14266\u3002\n- \u8f93\u5165\u5b8c\u6574\u547d\u4ee4\uff08\u5982 /reload\uff09\u800c\u65c1\u8fb9\u6709\u540c\u524d\u7f00\u7684\u66f4\u957f\u547d\u4ee4\uff08\u5982 /reload-cmd\uff09\u65f6\uff0c\u56de\u8f66\u4f1a\u8865\u5168\u6210\u957f\u547d\u4ee4\uff1b\u73b0\u5728\u5b8c\u6574\u547d\u4ee4\u6392\u7b2c\u4e00\uff0c\u56de\u8f66\u76f4\u63a5\u53d1\u9001\u3002\u4fee\u590d #14302 fixed in #14304\u3002\n\n## \u5347\u7ea7\u987b\u77e5\n\n- \u5e76\u884c\u5199\u5165\u7684\u201c\u4e50\u89c2\u6a21\u5f0f\u201d\u9ed8\u8ba4\u5f00\u542f\uff0c\u6ca1\u58f0\u660e\u5199\u5165\u8303\u56f4\u7684\u5b50\u4ee3\u7406\u4e0d\u518d\u4e92\u76f8\u5360\u4f4f\u6574\u4e2a\u5de5\u4f5c\u533a\uff1b\u60f3\u4fdd\u6301\u539f\u6765\u7684\u4e25\u683c\u884c\u4e3a\uff0c\u5728\u8bbe\u7f6e\u91cc\u5173\u95ed\u3002\u5173\u8054 #14240\u3002\n- AI \u6587\u4ef6\u4ea4\u4ed8\u5de5\u5177\u9ed8\u8ba4\u5f00\u542f\uff0c\u5347\u7ea7\u540e\u7b2c\u4e00\u6b21\u6253\u5f00\u4f1a\u8bdd\u4f1a\u56e0\u5de5\u5177\u5b9a\u4e49\u589e\u52a0\u800c\u6709\u4e00\u6b21\u7f13\u5b58\u672a\u547d\u4e2d\uff1b\u60f3\u5173\u95ed\uff0c\u5728\u8bbe\u7f6e \u2192 \u5de5\u5177\u4e0e\u6743\u9650\u91cc\u5173\u6389\u300cAI \u6587\u4ef6\u4ea4\u4ed8\u5361\u7247\u300d\u3002\u5173\u8054 #14063 by @SivanCola\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@imcreazy\u3001@SivanCola\u3001@lancy69\u3001@chuiwenwei\n\n---\n\n<!-- lang:en -->\n\nThis release opens sub-agents as Workbench tabs with their full record, adds navigation-entry management, a billing choice and an enlarged Settings window, lets you drag the reading column wider, and fixes a number of stalls, display and alignment problems.\n\n## New\n\n- The reading column's edges can be dragged: both sides widen or narrow by the same amount, between the readable measure and the window. Refs #14198 by @imcreazy.\n- the feedback form's body can switch to a Markdown preview; a public issue still shows the original text in a code block. Fixes #14248 fixed in #14255.\n- Settings \u2192 Appearance \u2192 Navigation entries hides or reorders the shortcuts in the icon rail and sidebar together; sessions, feedback, account and settings stay. Refs #14236, #14190.\n- the settings window has an Enlarge button that fills the whole window and widens its content; the choice is remembered. Fixes #14272 fixed in #14271.\n- the desktop host can use a remote gateway you run (REASONIX_REMOTE_URL, REASONIX_REMOTE_GATEWAY_ID); the phone page follows the grant's gateway; non-wss:// relays are refused. Refs #14282.\n- a sub-agent opened from the Sub-agents panel is now a Workbench tab reading the kernel's full record (live while it runs), foldable, several at once; no record keeps the dialog. Refs #13523 fixed in #14291.\n- the connection editor now has a Billing choice (pay as you go or subscription plan); a plan's usage is shown as a separate estimate at the entered prices, never as money spent. Refs #13276.\n- a searchable AI file delivery switch is the second item in Tools & permissions. It saves your choice for reopened sessions. Refs #14063 by @SivanCola.\n\n## Changed\n\n- the sidebar remembers which projects you folded and keeps them folded when the interface reopens; new projects still start expanded. Refs #14195 by @lancy69.\n- while Settings is open, the content behind it is pushed back by a stronger flat scrim, so Settings stands out; no live blur is used. Refs #14196 by @lancy69.\n- The reading column's edges carry a standing mark, the two pills keep their tip while the pointer moves, and the handles answer the arrow keys. Refs #14198 by @imcreazy.\n- with the icon rail hidden, the sidebar now lists the same destinations as the rail (Files, Tools and permissions, Extensions, Memory, Remote) under the same names, from one list. Refs #14236.\n- optimistic mode for parallel writes is on by default, so writers with no declared scope no longer hold the whole workspace; a saved strict choice is kept. Refs #14240.\n- \"Allow for this session\" is now saved with its conversation, so resuming or reopening it no longer asks again; it still covers only that conversation and can be revoked. Refs #14243.\n- AI file delivery defaults on; explicit off choices remain off. Newly opened sessions add its tool schema and may incur one cold prefix. Refs #14063 by @SivanCola.\n\n## Fixed\n\n- the work-mode menu now labels the unavailable mode \u201cAsk (Not implemented)\u201d so it does not imply a missing configuration step. Mode switching and Ask's disabled state are unchanged. Refs #14028 fixed in #14093 by @lancy69.\n- with the conversation column narrow (workbench open), the buttons under the composer stay on one row: the mode button collapses sooner and the model name shrinks. Refs #14156.\n- a session billed in more than one currency no longer shows one summed figure under a single symbol; the meter and cost panel show one amount per currency. Refs #14178 by @chuiwenwei.\n- a one-shot scheduled run that missed its time no longer stays Active; it shows as expired, so Renew no longer reports success when nothing will run. Refs #14179 by @chuiwenwei.\n- in the terminal, r and /queue retry no longer re-send a recovered queue entry that may already have run; they say why and suggest checking the transcript or deleting it. Refs #14180 by @chuiwenwei.\n- importing legacy sessions no longer moves or deletes a session that another window has open; it is left in place and settled on a later import. Refs #14181 by @chuiwenwei.\n- the meter under the composer labelled the whole session's spend as \"This turn\"; it now shows \"This session\" and the last turn's own amount. Refs #14200.\n- the queue itself now refuses to retry a recovered entry that may already have run, including retries made through the API or ACP, so an instruction is not run twice. Refs #14202.\n- a long command in the delivery receipt card no longer fills the card; it shows its first line with an ellipsis, and the whole command is in the hover text. Refs #14204.\n- with the icon rail hidden, sidebar rows line up icons and labels on one vertical line and share one 12px regular label style; New session and Send feedback are no longer bold. Refs #14207.\n- the settings tool list now describes the remaining built-in tools (search, file edits, sub-agents, memory, peers) in the interface language, not model-facing English. Refs #14208.\n- pasting a screenshot into the feedback form no longer does nothing after clicking a blank part of it, and an image the clipboard offers as an item is taken too. Refs #14210.\n- the settings sheet is taller so its whole menu shows on a 1080p screen, the Memory icon lines up with its label, and the run analysis view keeps one name instead of \"trajectory\". Refs #14211.\n- the scheduled runs page can trust the open project itself, so a project that never showed the trust prompt, or was declined earlier, no longer leaves you stuck. Refs #14216.\n- the sidebar rows now share one label colour, and New session no longer has a filled background at rest. Refs #14221.\n- the top bar's Run analysis icon is now a pulse line the same size and weight as its neighbours, instead of a small half-circle gauge. Fixes #14222 fixed in #14269.\n- with the rail hidden, sidebar icons match the project folders and the logo the labels; session tabs centre their text; top rows lose hints; the avatar is one rounded square. Refs #14226.\n- the \"show in file manager\" button now uses an open-folder icon instead of an arrow that read as share or external link. Refs #14227.\n- the workbench bar puts the wide toggle at its left edge and the full-size toggle at its right edge instead of between the tabs. Refs #14229.\n- the model is now told a sub-agent is not a new session: it dispatches it, the answer returns here, and nesting is bounded by `max_subagent_depth`. Refs #14247.\n- a refused read now says which path was refused and whether it is outside the folders the session may read or on your forbidden-read list, not just \"permission denied\". Refs #14252.\n- My feedback shows its last list at once and refreshes behind it; level, account and the leaderboard sit behind one collapsed row loaded on open instead of filling the first screen. Refs #14254.\n- a skill step in the execution process now shows which skill it ran instead of just `run_skill`. Fixes #14256 fixed in #14259.\n- after the kernel refuses a request the shell now checks this launch's credential cookie and restores it if missing, so no relaunch is needed. Refs #14260.\n- when a plugin's runtime command is not an executable program (such as a `.sh` script on Windows), the error now says the plugin must ship a native executable. Refs #14263.\n- choosing a reasoning depth that sends the same request as the current one (such as High when Auto resolves to High) now shows at once, not after a restart. Fixes #14173 fixed in #14265.\n- on the paid search, network egress and MCP sign-in approval cards, the note under \"Always allow\" now says where the answer is actually kept instead of calling it a permission rule. Refs #14242.\n- the settings text for sessions writing one project and for sub-agent write scope now matches the new default (optimistic mode) instead of saying \"strict by default\". Refs #14240.\n- the sub-agent tool's description the model reads now describes writes with no declared scope under the new default (optimistic mode), not as claiming the whole workspace. Refs #14240.\n- sidebar labels sat higher than their icons, and the Tools/Extensions/Memory/Remote icons were bolder and larger than the others; both are now level and matched. Refs #14266.\n- with a command typed in full (/reload) beside longer ones sharing its name (/reload-cmd), Enter completed the longer one; the typed one is now listed first and Enter sends it. Fixes #14302 fixed in #14304.\n\n## Upgrade notes\n\n- Optimistic parallel writes are on by default, so sub-agents that declare no write paths no longer hold the whole workspace; turn it off in Settings to keep the strict behaviour. Refs #14240.\n- The AI file-delivery tool is on by default, so the first session after upgrading has one cache miss; turn it off under Settings, Tools and permissions. Refs #14063 by @SivanCola.\n\n## Contributors\n\nThanks to this release's contributors: @imcreazy, @SivanCola, @lancy69, @chuiwenwei\n\n## What's Changed\n* feat(studio): drag the edges of the reading column by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14198\n* fix(migrate): leave a leased session where it is by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14181\n* fix(desktop): keep a session's money per currency by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14178\n* fix(tui): refuse a retry that may already have run by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14180\n* feat(studio): separate Settings with a feedback-style flat scrim by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14196\n* feat(studio): propose remembered sidebar expansion states by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14195\n* docs(release-notes): fragments for #14178, #14180, #14181, #14195 and #14196 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14199\n* fix(schedule): a missed one-shot stops being active by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14179\n* fix(desktop): label the meter's running total as the session's and add the turn's own amount by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14200\n* docs(release-notes): fragment for #14179 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14201\n* fix(inbox): the queue refuses to retry an entry that may already have run by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14202\n* fix(desktop): show only the start of a long command in the delivery receipt by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14204\n* fix(desktop): line up the sidebar rows' icons and labels with the rail hidden by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14207\n* fix(desktop): describe every built-in tool in the settings list in the interface language by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14208\n* fix(desktop): a paste into the feedback form reaches it after a click on a blank part by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14210\n* fix(desktop): the settings sheet shows its whole menu, the memory icon is centred, and the run analysis view keeps one name by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14211\n* fix(schedule): offer the open project for trust on the scheduled runs page by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14216\n* fix(control): retract the goal contract when a goal stops by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14104\n* fix(migrate): a failed copy must not stamp the import marker by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14212\n* fix(stats): the projection keeps a zero-amount quote by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14215\n* fix(stats): a relocated stats root does not count twice by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14214\n* fix(desktop): the sidebar rows read in one colour and New session has no fill at rest by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14221\n* test(stats): the relocation fixture expects the zero-amount quote the projection now keeps by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14224\n* fix(desktop): the workbench's wide toggle sits at the left edge of its bar and the full-size toggle at the right edge by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14229\n* fix(studio): keep composer chip text aligned during reflow by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14225\n* fix(desktop): the sidebar's top and bottom rows sit on the project folders' icon line by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14226\n* ci(studio): give the browser guards job 25 minutes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14244\n* feat(approval): a conversation remembers the answers given for it, and resuming it does not ask again by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14243\n* fix(tui): a runtime continuation is not the person's message by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14238\n* fix(memory): a fact that cannot be read is not absent by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14239\n* feat(config): optimistic claims are the default for sub-agent claims and the write lease by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14240\n* fix(desktop): my feedback shows the list it has at once and keeps level, account and board behind one row by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14254\n* feat(feedback): preview the report body as Markdown before sending by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14255\n* fix(tools): a refused read says which target, which folders may be read and why by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14252\n* fix(delegation): tell the model a sub-agent is not a new session by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14257\n* fix(studio): the reveal-in-file-manager icon is an open folder, not an arrow by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14258\n* fix(studio): a skill step names the skill it ran by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14259\n* fix(desktop): check and restore the launch credential cookie after a refused request by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14261\n* fix(sidecar): a runtime that is not a program says what the plugin has to ship by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14263\n* fix(effort): the status says the depth the person chose even when the request does not change by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14265\n* feat(studio): the sidebar offers the same destinations as the icon rail, from one list by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14266\n* fix(approval): session grants persist in order, so a revoke is not undone by an earlier write by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14262\n* feat(studio): hide or reorder the navigation entries of the icon rail and the sidebar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14268\n* fix(studio): the run analysis icon is a pulse line that matches its neighbours by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14269\n* fix(studio): label Ask work mode as not implemented by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14093\n* fix(approval-card): the always-allow note says where paid search, egress and sign-in answers are kept by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14270\n* feat(studio): the settings window can be enlarged to fill the window, and remembers it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14271\n* fix(studio): the buttons under the composer stay on one row as the conversation column narrows by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14273\n* test(approval): wait for every queued grant write before reading the sidecar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14274\n* fix(settings): the session-coordination hints say optimistic is the default by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14275\n* fix(delegation): the task tool description says optimistic is the default for undeclared writes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14276\n* fix(sessionstore): a NUL-filled branch-meta sidecar reads as absent by @ShryukGrandhi in https://github.com/esengine/DeepSeek-Reasonix/pull/14281\n* feat(remote): the desktop host and the phone page can use a gateway the person runs by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14286\n* fix(jobs): bound background wait timeout by @tongsailong in https://github.com/esengine/DeepSeek-Reasonix/pull/14277\n* fix(delegation): track background subagent progress by @tongsailong in https://github.com/esengine/DeepSeek-Reasonix/pull/14278\n* fix(composition): allow lightweight mode without image capability by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14152\n* feat(delegation): a sub-agent run names the tool call that spawned it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14290\n* feat(tools): propose default-on file delivery / \u63d0\u8bae\u9ed8\u8ba4\u542f\u7528\u6587\u4ef6\u4ea4\u4ed8\u5361\u7247 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14066\n* fix(completion): report writes outside observed roots by @tongsailong in https://github.com/esengine/DeepSeek-Reasonix/pull/14279\n* feat(studio): add opt-in file delivery settings / \u65b0\u589e\u6587\u4ef6\u4ea4\u4ed8\u5361\u7247\u5f00\u5173 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14063\n* feat(studio): a sub-agent opens beside the conversation as a workbench tab that reads its full record by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14291\n* feat(providers): a connection says whether it is billed per use or by subscription by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14292\n* test(control): wait for the second ask to yield, not just to register by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14297\n* docs(mcp): point a running chat at the /mcp panel, not /mcp add by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14298\n* fix(studio): make the reading column's handles visible and reachable by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14293\n* fix(studio): a sidebar destination's label centres on its icon by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14303\n* fix(studio): a command typed in full is still sent by Enter when longer commands share its name by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14304\n* docs(release): studio 2.50.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14306\n\n## New Contributors\n* @ShryukGrandhi made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/14281\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.49.0...studio-v2.50.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002x86_64 \u7528\u6587\u4ef6\u540d\u5e26 amd64 \u7684\u5305\uff0caarch64\uff08\u7edf\u4fe1 UOS\u3001\u9e92\u9e9f\u7b49\uff09\u7528\u5e26 arm64 \u7684\u5305\u3002\u4e5f\u63d0\u4f9b `.AppImage`\uff08\u53ea\u63d0\u4f9b\u4e0b\u8f7d\uff0c\u4e0d\u4f1a\u81ea\u66f4\u65b0\uff1b\u9700\u8981 FUSE 2\uff0c\u6216\u7528 `--appimage-extract-and-run` \u542f\u52a8\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","mentions_count":8}
