1881,"node_id":"RA_kwDOSIatD84pJmQ5","name":"ReasonixStudio-windows-arm64-installer.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":134008952,"digest":"sha256:8db2b2ea2272bc9064acab554caaa1640a9832d2f2ac70498cbd7d646be3873f","download_count":21,"created_at":"2026-10-30T00:29:23Z","updated_at":"2026-10-30T00:29:29Z"},{"id":690381921,"node_id":"RA_kwDOSIatD84pJmRh","name":"ReasonixStudio-windows-arm64-installer.exe.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":299,"digest":"sha256:d6527c7ee42cd22de5ad265e0ee4ef708cbe69cdf144113309da8fc9c628d47c","download_count":5,"created_at":"2026-10-30T00:29:24Z","updated_at":"2026-10-30T00:29:24Z"},{"id":690381943,"node_id":"RA_kwDOSIatD84pJmR3","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":186783966,"digest":"sha256:0ff6e7878ebd3997868335ea84a4d26a55092e02e37327d814df52712b99f914","download_count":9,"created_at":"2026-10-30T00:29:24Z","updated_at":"2026-10-30T00:29:31Z"},{"id":690381947,"node_id":"RA_kwDOSIatD84pJmR7","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:d363a4d529b9696c14e5df88f321f673b8af6d9ceeb879603c427901fa51b359","download_count":5,"created_at":"2026-10-30T00:29:25Z","updated_at":"2026-10-30T00:29:25Z"},{"id":690381970,"node_id":"RA_kwDOSIatD84pJmSS","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:dda53c094cbc4f60ca7cc7d9774a0f1c74295274d21dd8633859f0c5ac79200e","download_count":34,"created_at":"2026-10-30T00:29:25Z","updated_at":"2026-10-30T00:29:25Z"}],"body":"本版新增项目栏「最近」跨项目找会话、每日定时深色模式和可关闭的输入框提示，并修复从旧版找回会话全部被跳过、更新失败后无法下载完整安装包等多处问题。\n\n## 新增\n\n- 项目栏新增「最近」：按最近活动时间跨项目列出会话，完整分页、可搜索；点选后定位到所属项目并打开会话，也可选择远程环境。关联 #14319 fixed in #14784 by @lancy69。\n- 「外观 → 明暗」新增「定时」模式：每天按本机时间切换深色，默认 20:00 到次日 07:00，可跨午夜；桌面窗口的边框和底色同步变化。只有选择它时才生效。关联 #14699 fixed in #14783 by @lancy69。\n- 「外观 → 会话显示」新增「输入框提示」开关：可隐藏输入框里的任务和排队占位文字，默认显示，只保存在本机。关联 #14759 fixed in #14781 by @lancy69。\n- 文档：使用指南新增跨项目任务派发的完整流程。关联 #14603 fixed in #14780 by @lancy69。\n\n## 变更\n\n- 浏览器工具的说明现在提示模型读静态网页时用 web_fetch、用完关闭标签，避免一轮留下十几个页面。修复 #14737 fixed in #14764。\n- 设置里「快捷键」页的卡片顺序调整：「Esc 停止任务」紧跟发送相关设置，全局快捷键和按键表放在后面。关联 #14789 fixed in #14790。\n\n## 修复\n\n- 从旧版找回会话时，目标文件夹里残留没有对话文件的过期索引，会让所有会话被反复跳过、一个都导入不了；现在会清掉它们并正常导入，侧栏里的未导入列表也能显示。修复 #14804 fixed in #14806。\n- 更新失败后提示里的「下载完整安装包」改为用系统浏览器打开发布页，不再落到被设置页盖住的内置浏览器里。修复 #14775 fixed in #14788。\n- 侧栏里「早先版本」和「恢复副本」那一行，悬停或键盘聚焦时重新显示删除按钮 ×。修复 #14703 fixed in #14803 by @xxoingr。\n- 删除配置来源文件夹后，仍可移除残留的 MCP 服务；配置损坏时会保留服务，并指出无法解析的配置文件。关联 #14738 fixed in #14749 by @lancy69、#14739 fixed in #14749 by @lancy69。\n- 连接远程主机（如 WSL）时，读取会话列表、删除、置顶或归档不再每次都重新建立连接；连接在最后一次操作后保留 45 秒。修复 #14745 fixed in #14763。\n- 从对话分叉出的分支会继承源会话的上下文压缩简报，打开后继续在压缩视图上工作。关联 #14768 by @jf200s。\n- 同一项目里并行启动的隔离任务不再偶尔因 Git 报 failed to read …/commondir 而失败。关联 #14805 by @xxoingr。\n- 隔离结果应用、委派续跑和用量预算：应用时拒绝被换成目录链接的父目录，并发续跑不再重复创建转录副本，已知用量计入根预算，恢复任务时文件权限变化也会使旧证明失效。关联 #14025。\n\n## 贡献者\n\n感谢本版本的贡献者：@lancy69、@xxoingr、@jf200s\n\n---\n\n<!-- lang:en -->\n\n## New\n\n- The project header gains \"Recent\": conversations across projects by last activity, paged and searchable; picking one locates its project and opens it, also on remote hosts. Refs #14319 fixed in #14784 by @lancy69.\n- Appearance → Light and dark gains a \"Scheduled\" mode: dark during a daily local-clock range (default 20:00–07:00, overnight allowed); the window frame follows. Opt-in. Refs #14699 fixed in #14783 by @lancy69.\n- Appearance → Conversation display gains a \"Composer hint\" switch that hides the task and queue placeholder text; on by default, remembered on this machine. Refs #14759 fixed in #14781 by @lancy69.\n- Docs: the guide now walks through cross-project task dispatch. Refs #14603 fixed in #14780 by @lancy69.\n\n## Changed\n\n- The browser tool now tells the model to read static pages with web_fetch and to close tabs when done, so a turn no longer leaves a dozen pages open. Fixes #14737 fixed in #14764.\n- On the Shortcuts settings page, \"Esc to stop\" now sits right after the send settings, with the global shortcut and the key table after it. Refs #14789 fixed in #14790.\n\n## Fixed\n\n- Recovering older sessions no longer skips every conversation because of stale indexes with no transcript in the destination; they are cleared and the import proceeds. Fixes #14804 fixed in #14806.\n- After a failed update, \"download the full installer\" opens the release page in the system browser instead of the in-app browser behind the settings sheet. Fixes #14775 fixed in #14788.\n- An earlier version or recovery copy in the sidebar shows its delete × again on hover or keyboard focus. Fixes #14703 fixed in #14803 by @xxoingr.\n- Stale MCP servers can be removed after their source folder is deleted; a malformed config names the file and keeps the servers. Refs #14738 fixed in #14749 by @lancy69, #14739 fixed in #14749 by @lancy69.\n- On a remote host such as WSL, listing, deleting, pinning or archiving sessions no longer reconnects every time; the link is held 45 seconds after the last action. Fixes #14745 fixed in #14763.\n- A fork inherits its source's compacted context, so the branch continues on the compacted view. Refs #14768 by @jf200s.\n- Isolated tasks started in parallel in one project no longer fail now and then with Git's \"failed to read …/commondir\". Refs #14805 by @xxoingr.\n- Isolated results and delegation: applying refuses a parent directory swapped for a link, parallel continuations no longer duplicate copies, and known usage counts toward budgets. Refs #14025.\n\n## Contributors\n\nThanks to this release's contributors: @lancy69, @xxoingr, @jf200s\n\n## What's Changed\n* fix(delegation): reserve ancestor copy admission / 预留祖先副本续跑准入 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14684\n* fix(agent): count reported totals in token budgets / 将已报告总量计入 token 预算 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14730\n* feat(e2ebench): a batch emits an auditable manifest by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14757\n* fix(agent): invalidate carried proof after file-mode changes / 文件模式变化时拒绝旧证明 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14677\n* feat(studio): show green unread markers instead of session dates by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14746\n* feat(studio): optional progress track for collapsed plans by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14747\n* fix(serve): hold a request's remote link past its answer by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14763\n* fix(tools): tell the model browser_open is visible and web_fetch reads static pages by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14764\n* feat(studio): choose steer or follow-up as the running-message default by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14750\n* fix(control): remove stale MCP entries without losing source authority by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14749\n* fix(control): a fork inherits its source's context projection by @jf200s in https://github.com/esengine/DeepSeek-Reasonix/pull/14768\n* feat(control): support precise @path:start-end file references by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14748\n* fix(worktree): guard apply ancestors and confine deletions / 防止父目录链接重定向隔离结果删除 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14726\n* test(stats): every aggregate field declares its provenance by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14769\n* fix(control): bound the fallback recovery task summary by runes by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14773\n* fix(worktree): cut git stderr in error messages on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14774\n* docs: explain cross-project task dispatch by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14780\n* fix(studio): the full-installer link after a failed update opens the system browser by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14788\n* fix(studio): Esc-to-stop sits with the send settings on the Shortcuts page by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14790\n* test(desktop): the settings search is measured without the storage tally by @1012905 in https://github.com/esengine/DeepSeek-Reasonix/pull/14791\n* feat(serve): 通过 POST /tree/sessions/remove-many 批量删除会话 by @1012905 in https://github.com/esengine/DeepSeek-Reasonix/pull/14771\n* feat(studio): add a default-on composer hint visibility setting by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14781\n* ci(android): build the APK on a tag and attach it to the release by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14493\n* feat(studio): add a daily dark-mode schedule by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14783\n* fix(studio): an earlier version in the sidebar shows its delete button by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14803\n* fix(sessionstore): stale indexes with no transcript no longer make every 1.x import copy_failed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14806\n* fix(worktree): run one repository's worktree commands one at a time by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14805\n* fix(studio): share pane startup workspace metadata by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14800\n* fix(agent): preserve unknown scope across yielded workspace claims by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14801\n* feat(studio): add globally paged recent session discovery by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14784\n* docs(parity): scheduled runs exist in Studio; the 1.x heartbeat loop is the gap by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14808\n* docs(release-notes): studio 2.56.0 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14810\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.55.0...studio-v2.56.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n","mentions_count":10}
