u3002\n- [**Windows Agent Shell**](https://github.com/esengine/DeepSeek-Reasonix/blob/ab15e65955e9031444d133e51a5a1f39b7a690ee/docs/WINDOWS_AGENT_SHELL.md) \u2014 \u5728 Windows \u4e0a\u6062\u590d Git Bash \u548c Shell \u8bbe\u7f6e\u3002\n- [**\u5386\u53f2\u542f\u52a8\u52a0\u8f7d**](https://github.com/esengine/DeepSeek-Reasonix/blob/ab15e65955e9031444d133e51a5a1f39b7a690ee/docs/history-startup-loading.md) \u2014 \u5ef6\u8fdf\u5386\u53f2\u4f1a\u8bdd\u52a0\u8f7d\u548c\u6709\u754c\u539f\u751f\u5206\u9875\u3002\n\n## \u6982\u89c8\n\n**Reasonix v1.38.12 \u2014 \u684c\u9762\u7a33\u5b9a\u6027\u3001\u4f1a\u8bdd\u751f\u547d\u5468\u671f\u4e0e\u6027\u80fd\u6539\u8fdb**\n\n\u6b64\u7248\u672c\u91cd\u70b9\u4fee\u590d\u4f1a\u8bdd\u521b\u5efa\u3001\u5bfc\u822a\u548c\u751f\u547d\u5468\u671f\u95ee\u9898\uff0c\u63d0\u5347\u6027\u80fd\uff0c\u5e76\u6539\u5584\u6574\u4f53\u684c\u9762\u4f53\u9a8c\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-24\n\n**Desktop 32 \u00b7 CLI 5**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u4fee\u590d\u9879\u76ee\u4fa7\u680f\u4e0e\u4f1a\u8bdd\u5207\u6362\u4e00\u81f4\u6027** \u2014 \u79fb\u9664\u540e\u91cd\u65b0\u6dfb\u52a0\u9879\u76ee\u53ef\u6062\u590d\u4fa7\u680f\u53ef\u89c1\u6027\uff0c\u8fc7\u671f\u8bfb\u53d6\u4e0d\u518d\u8986\u76d6\u5f53\u524d\u4f1a\u8bdd\u5217\u8868\uff0c\u539f\u751f\u5386\u53f2\u8bb0\u5f55\u53ef\u901a\u8fc7\u7edf\u4e00\u4f1a\u8bdd\u8eab\u4efd\u6b63\u5e38\u6253\u5f00\u3002 ([#10699](https://github.com/esengine/DeepSeek-Reasonix/pull/10699))\n- **[Desktop]** **\u7b80\u5316\u4f1a\u8bdd\u521b\u5efa\u4e0e\u6062\u590d** \u2014 \u65b0\u5efa\u4f1a\u8bdd\u4e0d\u518d\u51fa\u73b0 target_changed \u9519\u8bef\u3001\u65e0\u5173\u6062\u590d\u5931\u8d25\u6216\u6b8b\u7559\u8f93\u5165\u3002\u521b\u5efa\u53cd\u9988\u73b0\u5728\u5f52\u5c5e\u4e8e\u6240\u9009\u4f1a\u8bdd\u3002 ([#10697](https://github.com/esengine/DeepSeek-Reasonix/pull/10697))\n- **[Desktop]** **\u4fee\u590d\u5386\u53f2\u4f1a\u8bdd\u534f\u8c03** \u2014 \u65e7\u683c\u5f0f\u4f1a\u8bdd\u53ef\u76f4\u63a5\u6253\u5f00\uff0c\u5df2\u91c7\u7528\u7684\u6e90\u4e0d\u518d\u663e\u793a\u4e3a\u91cd\u590d\u7684\u4e0d\u53ef\u7528\u884c\u3002 ([#10696](https://github.com/esengine/DeepSeek-Reasonix/pull/10696))\n- **[Desktop]** **\u5ef6\u8fdf\u5386\u53f2\u52a0\u8f7d\uff0c\u542f\u52a8\u66f4\u5feb** \u2014 \u5386\u53f2\u4f1a\u8bdd\u52a0\u8f7d\u4ece\u542f\u52a8\u5173\u952e\u8def\u5f84\u4e2d\u79fb\u9664\uff0c\u91c7\u7528\u6709\u754c\u540e\u53f0\u53d1\u73b0\u548c\u539f\u751f\u5206\u9875\u3002 ([#10664](https://github.com/esengine/DeepSeek-Reasonix/pull/10664))\n- **[Desktop]** **\u6d88\u9664\u4f1a\u8bdd\u751f\u547d\u5468\u671f\u6b7b\u9501** \u2014 \u4fee\u590d\u4e86\u6e05\u7406\u4e0e\u9884\u89c8\u64cd\u4f5c\u3001AI \u91cd\u547d\u540d\u548c\u81ea\u52a8\u4fdd\u5b58\u5b8c\u6210\u7ade\u4e89\u5bfc\u81f4\u7684\u6302\u8d77\u3002 ([#10690](https://github.com/esengine/DeepSeek-Reasonix/pull/10690))\n- **[Desktop]** **\u7a33\u5b9a\u7684\u4f1a\u8bdd\u5217\u8868\u5206\u9875** \u2014 \u6709\u754c\u8bfb\u53d6\u5feb\u7167\u9632\u6b62\u8fc7\u671f\u6e38\u6807\u9519\u8bef\uff0c\u5e76\u5728\u5143\u6570\u636e\u66f4\u65b0\u671f\u95f4\u4fdd\u6301\u5206\u9875\u7a33\u5b9a\u3002 ([#10621](https://github.com/esengine/DeepSeek-Reasonix/pull/10621))\n- **[Desktop \u00b7 CLI]** **\u6a21\u578b\u66f4\u6539\u540e\u4fdd\u7559\u540e\u53f0\u7f51\u5173** \u2014 \u4fdd\u5b58\u6a21\u578b\u8bbe\u7f6e\u4e0d\u518d\u5728\u540e\u53f0\u4efb\u52a1\u8fd0\u884c\u65f6\u963b\u585e\u540e\u7eed\u6d88\u606f\u3002 ([#10688](https://github.com/esengine/DeepSeek-Reasonix/pull/10688))\n\n### \u65b0\u589e\n\n- **[Desktop]** **\u7f16\u8f91\u5e76\u8c03\u6574\u5f85\u5904\u7406\u6d88\u606f\u987a\u5e8f** \u2014 \u5f85\u5904\u7406\u6d88\u606f\u53ef\u5c31\u5730\u7f16\u8f91\uff0c\u5e76\u53ef\u7528\u6307\u9488\u6216\u952e\u76d8\u8c03\u6574\u987a\u5e8f\u3002 ([#10626](https://github.com/esengine/DeepSeek-Reasonix/pull/10626))\n- **[Desktop]** **\u539f\u751f\u56fe\u5f62\u6545\u969c\u6062\u590d** \u2014 \u684c\u9762\u7aef\u4e3a\u91cd\u590d\u7684 GPU \u6545\u969c\u6216\u6301\u7eed\u5361\u987f\u63d0\u4f9b\u539f\u751f\u6062\u590d\u5bf9\u8bdd\u6846\u3002 ([#10644](https://github.com/esengine/DeepSeek-Reasonix/pull/10644))\n- **[Desktop]** **\u7edf\u4e00\u5185\u7f6e HTML \u9884\u89c8** \u2014 \u672c\u5730 HTML \u6587\u4ef6\u5728\u4efb\u52a1\u7ed1\u5b9a\u7684\u5185\u7f6e\u6d4f\u89c8\u5668\u6807\u7b7e\u9875\u4e2d\u6253\u5f00\uff0c\u5e76\u652f\u6301\u54cd\u5e94\u5f0f\u5de5\u4f5c\u533a\u4ea4\u4ed8\u3002 ([#10596](https://github.com/esengine/DeepSeek-Reasonix/pull/10596))\n\n### \u6539\u8fdb\n\n- **[Desktop \u00b7 CLI]** **\u66f4\u65b0 DeepSeek \u4e0e MiMo \u6a21\u578b\u9009\u9879** \u2014 \u65b0\u5efa DeepSeek \u5b98\u65b9\u8fde\u63a5\u9ed8\u8ba4\u4f7f\u7528 deepseek-flash\u3002MiMo \u660e\u786e\u533a\u5206 API \u4e0e Token Plan\uff0c\u5e76\u52a0\u5165 V2.6 Pro\u3001Flash\uff0c\u540c\u65f6\u4fdd\u7559\u5df2\u6709\u9ed8\u8ba4\u6a21\u578b\u548c\u7528\u6237\u9009\u62e9\u3002 ([#10624](https://github.com/esengine/DeepSeek-Reasonix/pull/10624), [#10655](https://github.com/esengine/DeepSeek-Reasonix/pull/10655))\n- **[Desktop]** **\u5347\u7ea7\u5185\u7f6e\u6d4f\u89c8\u5668\u8fd0\u884c\u65f6** \u2014 \u6d4f\u89c8\u5668\u64cd\u4f5c\u4fdd\u7559\u6240\u5c5e\u4f1a\u8bdd\u4e0e\u9875\u9762\u6846\u67b6\uff0c\u80fd\u529b\u72b6\u6001\u4e0e\u5b9e\u9645\u7ed1\u5b9a\u7684\u8fd0\u884c\u65f6\u4e00\u81f4\uff0c\u5e76\u63d0\u4f9b\u8bca\u65ad\u5bfc\u51fa\u4ee5\u6392\u67e5\u6d4f\u89c8\u5668\u6545\u969c\u3002 ([#10615](https://github.com/esengine/DeepSeek-Reasonix/pull/10615), [#10635](https://github.com/esengine/DeepSeek-Reasonix/pull/10635))\n- **[Desktop]** **\u51cf\u5c11\u804a\u5929\u533a\u91cd\u590d\u6e32\u67d3** \u2014 \u6d41\u5f0f\u8f93\u51fa\u4e0d\u518d\u4f7f\u672a\u66f4\u6539\u7684\u804a\u5929\u8bb0\u5f55\u884c\u5931\u6548\uff0c\u51cf\u5c11\u6e32\u67d3\u5668\u957f\u4efb\u52a1\u3002 ([#10691](https://github.com/esengine/DeepSeek-Reasonix/pull/10691))\n- **[Desktop]** **\u4fa7\u680f\u5237\u65b0\u66f4\u5b89\u9759** \u2014 \u5f53\u5b58\u5728\u5e38\u9a7b\u9875\u9762\u65f6\uff0c\u540e\u53f0\u5237\u65b0\u4e0d\u518d\u95ea\u70c1\u52a0\u8f7d\u6307\u793a\u5668\u3002 ([#10683](https://github.com/esengine/DeepSeek-Reasonix/pull/10683))\n- **[Desktop]** **\u7b80\u5316\u5f52\u6863\u4f1a\u8bdd\u7ba1\u7406** \u2014 \u5f52\u6863\u9875\u9762\u91c7\u7528\u54cd\u5e94\u5f0f\u5217\u8868/\u9884\u89c8\u5e03\u5c40\uff0c\u6062\u590d\u4e3a\u4e3b\u8981\u64cd\u4f5c\u3002 ([#10623](https://github.com/esengine/DeepSeek-Reasonix/pull/10623))\n- **[Desktop]** **\u6062\u590d\u5b8c\u6574\u4f1a\u8bdd\u8f6e\u6b21\u5bfc\u822a** \u2014 \u8f6e\u6b21\u5bfc\u822a\u680f\u73b0\u5728\u5305\u542b\u6240\u6709\u4f1a\u8bdd\u8f6e\u6b21\uff0c\u5e76\u652f\u6301\u6709\u754c\u5206\u9875\u3002 ([#10619](https://github.com/esengine/DeepSeek-Reasonix/pull/10619))\n- **[Desktop]** **\u964d\u4f4e\u5386\u53f2\u4f1a\u8bdd\u4e0e\u591a\u4f1a\u8bdd\u8d44\u6e90\u5360\u7528** \u2014 \u7f13\u5b58\u548c\u5408\u5e76\u51cf\u5c11\u4f1a\u8bdd\u5207\u6362\u671f\u95f4\u7684\u91cd\u590d\u5de5\u4f5c\u3002 ([#10603](https://github.com/esengine/DeepSeek-Reasonix/pull/10603))\n- **[Desktop]** **\u5ef6\u8fdf\u4f1a\u8bdd\u52a0\u8f7d\u63d0\u793a** \u2014 \u5feb\u901f\u4f1a\u8bdd\u5207\u6362\u4e0d\u518d\u95ea\u70c1\u52a0\u8f7d\u754c\u9762\u3002 ([#10599](https://github.com/esengine/DeepSeek-Reasonix/pull/10599))\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **\u6062\u590d Windows Shell \u4e0e\u8def\u5f84\u517c\u5bb9\u6027** \u2014 \u6062\u590d Git Bash \u4e0e Shell \u8bbe\u7f6e\uff0c\u5e76\u7edf\u4e00 Junction \u8def\u5f84\u8eab\u4efd\uff0c\u907f\u514d\u540c\u4e00\u9879\u76ee\u7684\u7b49\u4ef7\u8def\u5f84\u5e72\u6270\u5347\u7ea7\u6062\u590d\u3002 ([#10617](https://github.com/esengine/DeepSeek-Reasonix/pull/10617), [#10656](https://github.com/esengine/DeepSeek-Reasonix/pull/10656))\n- **[Desktop \u00b7 CLI]** **\u4fee\u590d\u624b\u52a8\u538b\u7f29\u4e0e\u91cd\u590d\u63d0\u4ea4** \u2014 \u624b\u52a8\u538b\u7f29\u6b63\u786e\u8b