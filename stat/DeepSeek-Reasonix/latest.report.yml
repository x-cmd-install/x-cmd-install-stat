thub.com/esengine/DeepSeek-Reasonix/blob/27a409937d7431ffb2b5760feeef46ccf35eecab/docs/CAPABILITY_DIAGNOSTICS.md) \u2014 \u4e86\u89e3\u6280\u80fd\u5de5\u5177\u5f15\u7528\u8bca\u65ad\u3002\n\n## \u6982\u89c8\n\n**Reasonix v1.38.3 \u2014 Reasonix 1.38.3**\n\n\u6b64\u7248\u672c\u6539\u8fdb\u4e86\u6a21\u578b\u8bbe\u7f6e\u6301\u4e45\u5316\u3001\u8fd0\u884c\u65f6\u72b6\u6001\u4e00\u81f4\u6027\u3001\u8bfb\u53d6\u8bc1\u636e\u5904\u7406\u4ee5\u53ca\u684c\u9762\u754c\u9762\u4f18\u5316\uff0c\u5e76\u4fee\u590d\u4e86\u5173\u95ed\u3001\u8bbe\u7f6e\u5e03\u5c40\u548c\u6280\u80fd\u8bca\u65ad\u7b49\u95ee\u9898\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-09\n\n**Desktop 14 \u00b7 CLI 7**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u65e0\u9700\u6d3b\u52a8\u4f1a\u8bdd\u5373\u53ef\u4fdd\u5b58\u6a21\u578b\u8bbe\u7f6e** \u2014 \u4f1a\u8bdd\u5c1a\u672a\u542f\u52a8\u65f6\u4e5f\u80fd\u4fdd\u5b58\u6a21\u578b\u504f\u597d\u548c\u4f9b\u5e94\u5546\u8fde\u63a5\u3002\u9ed8\u8ba4\u6a21\u578b\u7528\u4e8e\u65b0\u4f1a\u8bdd\uff0c\u5df2\u6709\u4f1a\u8bdd\u4fdd\u7559\u81ea\u5df1\u7684\u9009\u62e9\u3002\u5df2\u7ecf\u5f00\u59cb\u7684\u4efb\u52a1\u53ca\u5176\u5de5\u5177\u3001\u91cd\u8bd5\u3001\u5ba1\u6279\u548c\u5b50\u4efb\u52a1\u7ee7\u7eed\u4f7f\u7528\u539f\u8fde\u63a5\uff0c\u76f8\u5173\u8bbe\u7f6e\u5728\u4e0b\u4e00\u6b21\u8fd0\u884c\u524d\u751f\u6548\u3002 ([#9973](https://github.com/esengine/DeepSeek-Reasonix/pull/9973))\n- **[Desktop \u00b7 CLI]** **\u540c\u6b65\u672c\u5730\u4e0e\u8fdc\u7a0b\u4efb\u52a1\u72b6\u6001** \u2014 \u4fee\u590d\u4efb\u52a1\u7ed3\u675f\u540e\u4ecd\u6301\u7eed\u8f6c\u5708\u7684\u95ee\u9898\u3002\u672c\u5730\u684c\u9762\u4e0e\u8fdc\u7a0b Serve \u4f1a\u8bdd\u4f7f\u7528\u4e00\u81f4\u7684\u8fd0\u884c\u72b6\u6001\uff0c\u91cd\u8fde\u540e\u91cd\u65b0\u540c\u6b65\uff1b\u8fde\u63a5\u72b6\u6001\u4e0d\u786e\u5b9a\u65f6\u4fdd\u7559\u5df2\u77e5\u5185\u5bb9\u3002\u4efb\u52a1\u6536\u5c3e\u671f\u95f4\u53d1\u9001\u7684\u540e\u7eed\u6d88\u606f\u4f1a\u4fdd\u7559\u5728\u961f\u5217\u4e2d\u3002 ([#9971](https://github.com/esengine/DeepSeek-Reasonix/pull/9971))\n- **[Desktop]** **\u67e5\u770b\u6bcf\u8f6e\u5b9e\u9645\u6539\u52a8\u4e0e\u68c0\u67e5\u7ed3\u679c** \u2014 \u672c\u8f6e\u7ed3\u679c\u5c55\u793a\u786e\u8ba4\u7684\u51c0\u6587\u4ef6\u6539\u52a8\uff0c\u4ee5\u53ca\u5b9e\u9645\u6267\u884c\u7684\u547d\u4ee4\u3001\u9000\u51fa\u7801\u548c\u65e5\u5fd7\u3002\u53ef\u4ee5\u67e5\u770b\u8be5\u8f6e\u56fa\u5b9a\u7684\u5dee\u5f02\uff0c\u4e0d\u6df7\u5165\u540e\u7eed\u7f16\u8f91\uff1b\u7f3a\u5931\u6216\u4e0d\u5b8c\u6574\u7684\u8bc1\u636e\u4f1a\u660e\u786e\u6807\u6ce8\uff0c\u4e0d\u4f1a\u88ab\u663e\u793a\u4e3a\u68c0\u67e5\u901a\u8fc7\u3002 ([#9869](https://github.com/esengine/DeepSeek-Reasonix/pull/9869))\n\n### \u65b0\u589e\n\n- **[Desktop]** **\u5de5\u4f5c\u53f0\u6b22\u8fce\u9875\u4e0e\u4f1a\u8bdd\u6062\u590d** \u2014 \u7a7a\u5de5\u4f5c\u53f0\u4f1a\u8bdd\u5c45\u4e2d\u5c55\u793a\u6b22\u8fce\u5185\u5bb9\u548c\u8f93\u5165\u680f\uff0c\u53d1\u9001\u9996\u6761\u6d88\u606f\u540e\u56de\u5230\u5bf9\u8bdd\u5e03\u5c40\u3002\u5386\u53f2\u52a0\u8f7d\u6216\u8fdc\u7a0b\u8fde\u63a5\u5931\u8d25\u65f6\u6301\u7eed\u663e\u793a\u91cd\u8bd5\u5165\u53e3\uff0c\u5e76\u4fdd\u7559\u5df2\u6709\u6d88\u606f\u548c\u8349\u7a3f\u3002 ([#9961](https://github.com/esengine/DeepSeek-Reasonix/pull/9961))\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u66f4\u6e05\u6670\u7684\u8f93\u5165\u680f\u64cd\u4f5c\u4e0e\u8fd0\u884c\u53cd\u9988** \u2014 \u8ba1\u5212\u3001\u76ee\u6807\u548c\u4ea4\u4ed8\u9009\u9879\u79fb\u5165\u6dfb\u52a0\u83dc\u5355\uff0c\u542f\u7528\u540e\u53ef\u901a\u8fc7\u6a21\u5f0f\u6807\u7b7e\u79fb\u9664\u3002\u6a21\u578b\u4e0e\u601d\u8003\u5f3a\u5ea6\u5206\u5f00\u9009\u62e9\uff0c\u83dc\u5355\u9002\u914d\u7a84\u7a97\u53e3\uff1b\u8f93\u5165\u680f\u8fb9\u6846\u52a8\u753b\u663e\u793a\u8fd0\u884c\u72b6\u6001\uff0c\u8017\u65f6\u7b49\u6307\u6807\u53ef\u5728\u4e0a\u4e0b\u6587\u6d6e\u5c42\u4e2d\u67e5\u770b\u3002 ([#9958](https://github.com/esengine/DeepSeek-Reasonix/pull/9958))\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **\u4f1a\u8bdd\u8fd0\u884c\u65f6\u9000\u51fa\u524d\u5b8c\u6210\u6536\u4ef6\u7bb1\u626b\u63cf** \u2014 \u5173\u95ed\u6216\u66ff\u6362\u4f1a\u8bdd\u8fd0\u884c\u65f6\u65f6\uff0c\u4f1a\u5148\u7b49\u5f85\u81ea\u52a8\u6536\u4ef6\u7bb1\u626b\u63cf\u7ed3\u675f\u3002\u6a21\u578b\u5237\u65b0\u4ecd\u53ef\u5728\u4e0b\u4e00\u6761\u6392\u961f\u8bf7\u6c42\u542f\u52a8\u524d\u5b89\u5168\u66ff\u6362\u5f53\u524d\u8fd0\u884c\u65f6\u3002 ([#9978](https://github.com/esengine/DeepSeek-Reasonix/pull/9978))\n- **[Desktop \u00b7 CLI]** **\u51c6\u786e\u8bb0\u5f55\u6587\u4ef6\u8bfb\u53d6\u8fdb\u5ea6\u4e0e\u6682\u505c\u539f\u56e0** \u2014 \u5927\u6587\u4ef6\u9884\u89c8\u4e0d\u518d\u610f\u5916\u89e6\u53d1\u5168\u6587\u8bfb\u53d6\u8981\u6c42\uff1b\u5df2\u5b8c\u6210\u7684\u8bfb\u53d6\u4e0d\u4f1a\u56e0\u8f93\u51fa\u53bb\u91cd\u91cd\u65b0\u53d8\u4e3a\u672a\u5b8c\u6210\uff0c\u7f16\u8f91\u4ecd\u987b\u6ee1\u8db3\u5f53\u524d\u6587\u4ef6\u7248\u672c\u7684\u8bfb\u53d6\u6761\u4ef6\u3002\u8bfb\u53d6\u672a\u5b8c\u6210\u5bfc\u81f4\u6682\u505c\u65f6\uff0c\u5b9e\u65f6\u4e0e\u6062\u590d\u540e\u7684\u5386\u53f2\u90fd\u4f1a\u5728\u6a21\u578b\u56de\u590d\u65c1\u663e\u793a\u6682\u505c\u539f\u56e0\u3002 ([#9966](https://github.com/esengine/DeepSeek-Reasonix/pull/9966))\n- **[Desktop \u00b7 CLI]** **\u4e00\u81f4\u7684\u6280\u80fd\u5de5\u5177\u8bca\u65ad** \u2014 \u6d88\u9664\u5185\u7f6e\u8bc4\u5ba1\u6280\u80fd\u7684 use_capability \u8bef\u62a5\u3002\u4e24\u4e2a doctor \u5165\u53e3\u8bc6\u522b\u4e00\u81f4\u7684\u5b9e\u9645\u5de5\u5177\u548c\u63d2\u4ef6\u8303\u56f4\u5185\u7684 MCP \u522b\u540d\uff0c\u540c\u65f6\u4fdd\u7559\u672a\u77e5\u540d\u79f0\u53ca\u683c\u5f0f\u9519\u8bef\u63d0\u793a\u3002\u9759\u6001\u8bca\u65ad\u4e0d\u4f1a\u542f\u52a8 MCP \u670d\u52a1\u3002 ([#9962](https://github.com/esengine/DeepSeek-Reasonix/pull/9962))\n- **[Desktop]** **\u907f\u514d\u8bbe\u7f6e\u641c\u7d22\u6846\u548c\u4fdd\u5b58\u64cd\u4f5c\u88ab\u906e\u6321** \u2014 \u8bbe\u7f6e\u641c\u7d22\u6846\u4e0e\u6eda\u52a8\u5bfc\u822a\u5206\u79bb\u3002Hooks \u548c\u7f51\u7edc\u8bbe\u7f6e\u7684\u4fdd\u5b58\u64cd\u4f5c\u4e0d\u518d\u8986\u76d6\u7f16\u8f91\u5668\u6216\u4ee3\u7406\u8f93\u5165\u6846\uff0c\u7a84\u7a97\u53e3\u4e0b\u6309\u94ae\u53ef\u81ea\u52a8\u6362\u884c\u3002 ([#9969](https://github.com/esengine/DeepSeek-Reasonix/pull/9969))\n- **[Desktop \u00b7 CLI]** **\u63d0\u5347 Windows \u4f1a\u8bdd\u4e0e\u66f4\u65b0\u6062\u590d\u53ef\u9760\u6027** \u2014 \u5206\u79bb\u4f1a\u8bdd\u72b6\u6001\u4f7f\u7528\u4e00\u81f4\u7684\u4f1a\u8bdd\u6807\u8bc6\u3002\u65e7\u7248\u66f4\u65b0\u7684\u5e76\u53d1\u6062\u590d\u548c\u4efb\u52a1\u5feb\u7167\u4fdd\u5b58\u80fd\u591f\u5904\u7406 Windows \u77ed\u6682\u6587\u4ef6\u5360\u7528\uff0c\u540c\u65f6\u4fdd\u7559\u4e8b\u52a1\u6821\u9a8c\uff0c\u907f\u514d\u66b4\u9732\u90e8\u5206\u5199\u5165\u7684\u5feb\u7167\u3002 ([#9974](https://github.com/esengine/DeepSeek-Reasonix/pull/9974))\n- **[Desktop \u00b7 CLI]** **\u8ba9 MCP \u8fdb\u7a0b\u6b63\u5e38\u5b8c\u6210\u5173\u95ed** \u2014 \u5148\u5173\u95ed MCP \u4f20\u8f93\uff0c\u518d\u53d6\u6d88\u8fdb\u7a0b\u4e0a\u4e0b\u6587\u3002Windows \u4e0a\u5728\u91ca\u653e\u5b9e\u4f8b\u540d\u989d\u524d\u6e05\u7406\u8fdb\u7a0b\u4f5c\u4e1a\uff0c\u63d0\u5347\u91cd\u8fde\u4e0e\u5173\u95ed\u7684\u53ef\u9760\u6027\u3002 ([#9973](https://github.com/esengine/DeepSeek-Reasonix/pull/9973))\n- **[Desktop]** **\u4fdd\u7559\u6b63\u786e\u7684\u8fde\u63a5\u663e\u793a\u4e0e\u63d0\u793a\u8bcd\u5386\u53f2\u6807\u8bc6** \u2014 \u6062\u590d\u4f1a\u8bdd\u540e\uff0c\u65e0\u9700\u6253\u5f00\u6a21\u578b\u83dc\u5355\u5373\u53ef\u663e\u793a\u9009\u4e2d\u7684\u8fde\u63a5\u3002\u4ec5\u7528\u4e8e\u663e\u793a\u7684\u5143\u6570\u636e\u8bfb\u53d6\u4e0d\u518d\u6539\u5199\u8fdb\u7a0b\u51ed\u636e\uff1b\u4e0d\u540c\u63d0\u793a\u8bcd\u5386\u53f2\u76ee\u5f55\u4e5f\u4e0d\u4f1a\u56e0\u5728\u540c\u4e00\u65f6\u949f\u523b\u5ea6\u6253\u5f00\u800c\u8bef\u7528\u7f13\u5b58\u3002 ([#9973](https://github.com/esengine/DeepSeek-Reasonix/pull/9973))\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u540c\u6b65\u672c\u5730\u4e0e\u8fdc\u7a0b\u4efb\u52a1\u72b6\u6001** \u2014 \u4fee\u590d\u4efb\u52a1\u7ed3\u675f\u540e\u4ecd\u6301\u7eed\u8f6c\u5708\u7684\u95ee\u9898\u3002\u672c\u5730\u684c\u9762\u4e0e\u8fdc\u7a0b Serve \u4f1a\u8bdd\u4f7f\u7528\u4e00\u81f4\u7684\u8fd0\u884c\u72b6\u6001\uff0c\u91cd\u8fde\u540e\u91cd\u65b0\u540c\u6b65\uff1b\u8fde\u63a5\u72b6\u6001\u4e0d\u786e\u5b9a\u65f6\u4fdd\u7559\u5df2\u77e5\u5185\u5bb9\u3002\u4efb\u52a1\u6536\u5c3e\u671f\u95f4\u53d1\u9001\u7684\u540e\u7eed\u6d88\u606f\u4f1a\u4fdd\u7559\u5728\u961f\u5217\u4e2d\u3002 ([#9971](https://github.com/esengine/DeepSeek-Reasonix/pull/9971))\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **\u4f1a\u8bdd\u8fd0\u884c\u65f6\u9000\u51fa\u524d\u5b8c\u6210\u6536\u4ef6\u7bb1\u626b\u63cf** \u2014 \u5173\u95ed\u6216\u66ff\u6362\u4f1a\u8bdd\u8fd0\u884c\u65f6\u65f6\uff0c\u4f1a\u5148\u7b49\u5f85\u81ea\u52a8\u6536\u4ef6\u7bb1\u626b\u63cf\u7ed3\u675f\u3002\u6a21\u578b\u5237\u65b0\u4ecd\u53ef\u5728\u4e0b\u4e00\u6761\u6392\u961f\u8bf7\u6c42\u542f\u52a8\u524d\u5b89\u5168\u66ff\u6362\u5f53\u524d\u8fd0\u884c\u65f6\u3002 ([#9978](https://github.com/esengine/DeepSeek-Reasonix/pull/9978))\n- **[Desktop \u00b7 CLI]** **\u51c6\u786e\u8bb0\u5f55\u6587\u4ef6\u8bfb\u53d6\u8fdb\u5ea6\u4e0e\u6682\u505c\u539f\u56e0** \u2014 \u5927\u6587\u4ef6\u9884\u89c8\u4e0d\u518d\u610f\u5916\u89e6\u53d1\u5168\u6587\u8bfb\u53d6\u8981\u6c42\uff1b\u5df2\u5b8c\u6210\u7684\u8bfb\u53d6\u4e0d\u4f1a\u56e0\u8f93\u51fa\u53bb\u91cd\u91cd\u65b0\u53d8\u4e3a\u672a\u5b8c\u6210\uff0c\u7f16\u8f91\u4ecd\u987b\u6ee1\u8db3\u5f53\u524d\u6587\u4ef6\u7248\u672c\u7684\u8bfb\u53d6\u6761\u4ef6\u3002\u8bfb\u53d6\u672a\u5b8c\u6210\u5bfc\u81f4\u6682\u505c\u65f6\uff0c\u5b9e\u65f6\u4e0e\u6062\u590d\u540e\u7684\u5386\u53f2\u90fd\u4f1a\u5728\u6a21\u578b\u56de\u590d\u65c1\u663e\u793a\u6682\u505c\u539f\u56e0\u3002 ([#9966](https://github.com/esengine/DeepSeek-Reasonix/p