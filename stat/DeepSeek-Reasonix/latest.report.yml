":"RA_kwDOSIatD84rvHHj","name":"ReasonixStudio-windows-arm64-installer.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":135030088,"digest":"sha256:f7400d61e862436c737af5f99672b66f78baf9aa287c81e07f2f5c839e65c46a","download_count":2,"created_at":"2026-11-11T02:09:09Z","updated_at":"2026-11-11T02:09:14Z"},{"id":733770212,"node_id":"RA_kwDOSIatD84rvHHk","name":"ReasonixStudio-windows-arm64-installer.exe.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":299,"digest":"sha256:d58f9ce934398f669c3da6311a0ead4a82b1f80cbd6c3f66e216713ab22f28b4","download_count":2,"created_at":"2026-11-11T02:09:09Z","updated_at":"2026-11-11T02:09:09Z"},{"id":733770224,"node_id":"RA_kwDOSIatD84rvHHw","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":186983871,"digest":"sha256:912a00156bfc9f0c3e410e7fc52830276dce3cc6dbebea6d6b08946d40dfe065","download_count":2,"created_at":"2026-11-11T02:09:09Z","updated_at":"2026-11-11T02:09:16Z"},{"id":733770235,"node_id":"RA_kwDOSIatD84rvHH7","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:d2e4a9a600b490de756a1680f5d998e25a97ae0b0ce57a5f8d579fb71b331ba4","download_count":2,"created_at":"2026-11-11T02:09:09Z","updated_at":"2026-11-11T02:09:09Z"},{"id":733770262,"node_id":"RA_kwDOSIatD84rvHIW","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:b121c4804b9d5aee5c0fa5362dc9f3fa87f476c6203a736f92c96d10ce69a27e","download_count":6,"created_at":"2026-11-11T02:09:10Z","updated_at":"2026-11-11T02:09:10Z"}],"body":"本版让内置浏览器可以点选页面元素并把修改直接存回本地网页，会话之间的消息不再需要批准，工作台可并排显示文件树。\n\n## 新增\n\n- 内置浏览器新增「点选页面元素」：点一下页面上的元素，就能看到它的选择器、文字和颜色 (6c9c6851a)\n- 从工作区本地文件打开的网页，可以直接改所选元素的文字、文字颜色、背景色和字号，并保存回文件；文件源码里对不上的元素会说明原因，不会写入 (6c9c6851a)\n- 工作台在打开的文件旁边显示文件树 (2ff95dbc5)\n\n## 变更\n\n- 「让模型把任务交给其他会话」开关打开时（默认开启），你自己的其他会话发来的消息直接交给模型，不再出现批准卡；关闭开关则仍需批准 (4dc2b1938)\n- 保存会话时不再为每条消息复制一份数据，长会话的保存更快、占用更少内存 (e19fc12a5)\n\n## 升级须知\n\n- 会话间消息默认不再需要批准：同机其他会话写进消息目录的内容，会在开关打开时直接进入模型；不想要请在设置的「会话间消息」里关闭派发开关 (4dc2b1938)\n\n---\n\n<!-- lang:en -->\n\n## New\n\n- The built-in browser can pick an element on the page: click it to see its selector, text and colors (6c9c6851a)\n- On a page opened from a workspace file, the picked element's text, text color, background and size can be changed and saved back to the file; an element the file's source cannot place is refused with the reason and nothing is written (6c9c6851a)\n- The workbench shows the file tree beside the open file (2ff95dbc5)\n\n## Changed\n\n- While the switch that lets the model hand tasks to other sessions is on (the default), a message from your other sessions reaches the model without an approval card; with the switch off it still waits for approval (4dc2b1938)\n- Saving a session no longer copies every message, so long sessions save faster and use less memory (e19fc12a5)\n\n## Upgrade notes\n\n- Messages between sessions no longer need approval by default: anything another session on this machine writes to the message directory goes straight to the model while the switch is on; turn the dispatch switch off under Messages between sessions in Settings to keep the card (4dc2b1938)\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.59.0...studio-v2.60.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n"}
