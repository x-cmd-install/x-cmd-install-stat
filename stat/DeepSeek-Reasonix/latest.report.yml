er requests by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12064\n* fix(serve): list skills with one configuration read instead of one per skill by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12074\n* fix(compaction): bound the summary request by lack of progress, not total time by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12036\n* perf(skill): leave references and scripts unread when listing skills by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12077\n* perf(serve): answer /status model facts from the build, not a config load by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12079\n* fix(studio): select a session row on the click instead of after the kernel answers by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12076\n* fix(compaction): a failed summary's retry hold gives way before the window by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12082\n* fix(boot): side models retry on the lowest effort when an endpoint refuses \"disabled\" by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12101\n* docs(contributing): open-PR cap, issue-first for features, AI-assist note by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12132\n* docs(contributing): drop the open-PR cap by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12134\n* fix(studio): scope backup forms to connection by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12127\n* fix(studio): scope memory panels to their connection by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12131\n* fix(tui): /resume <n> continues the nth saved session in place by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12113\n* fix(studio): search settings by localized labels by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12094\n* fix(studio): mark cached MCP tools without descriptions by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12096\n* fix(jobs): reclaim temp roots abandoned by killed kernels via a lock-owned scratch dir by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12145\n* fix(workbench): show why a browser tab could not open by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12140\n* fix(tui): restore 1.x /quit, second Ctrl+C while stopping, and Tab accept by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12146\n* fix(settings): keep a role saved while busy and say it is not applied yet by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12150\n* fix(studio): composer control tooltips wrap inside their box and no longer fade when the host is disabled by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12152\n* fix(control): return the plan to planning when a stop cancels the approval card by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12154\n* fix(control): hold a mid-turn message as a follow-up when the queue is paused by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12157\n* docs(release): Studio 2.29.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12160\n\n## New Contributors\n* @keeyangyy made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/11992\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.28.0...studio-v2.29.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** \u4ece `.deb` \u5b89\u88c5\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u8d70\u81ea\u5df1\u7684\u5305\uff0cWindows \u8fd0\u884