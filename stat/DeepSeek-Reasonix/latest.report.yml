3\uff1a\u505c\u6b62\u8fde\u63a5\u8be5\u673a\u5668\uff0c\u4ee5\u53ca\u4e0d\u5728\u4fa7\u680f\u91cc\u5217\u51fa\u5b83\uff1b\u88ab\u505c\u6b62\u8fde\u63a5\u7684\u673a\u5668\u4e0d\u4f1a\u518d\u88ab\u62e8\u53f7\uff0c\u5df2\u6253\u5f00\u7684\u7a97\u683c\u4e0d\u53d7\u5f71\u54cd (#11991 by @keeyangyy)\n- \u4e3b\u9898\u5305\u53ef\u4ee5\u5355\u72ec\u8bbe\u7f6e\u94fe\u63a5\u3001\u54c1\u724c\u8272\u3001\u60ac\u505c\u5149\u6655\u548c\u4ee3\u7406\u540d\u79f0\u7684\u989c\u8272\uff0c\u9ed8\u8ba4\u5916\u89c2\u4e0d\u53d8 (#12030)\n- \u547d\u4ee4\u884c\uff1a\u7ec8\u7aef\u754c\u9762\u7684 `/resume <n>` \u76f4\u63a5\u5728\u539f\u4f4d\u7ee7\u7eed\u7b2c n \u4e2a\u5df2\u4fdd\u5b58\u7684\u4f1a\u8bdd\uff0c\u5e8f\u53f7\u4e0d\u5bf9\u6216\u6b63\u5fd9\u65f6\u4f1a\u8bf4\u660e\u539f\u56e0\uff1b\u4e0d\u5e26\u6570\u5b57\u4ecd\u6253\u5f00\u9009\u62e9\u5668 (#12113 by @xxoingr)\n\n## \u53d8\u66f4\n\n- \u538b\u7f29\u6458\u8981\u8bf7\u6c42\u6539\u4e3a\u53ea\u8981\u8fd8\u5728\u6301\u7eed\u8fd4\u56de\u5185\u5bb9\u5c31\u4e0d\u4f1a\u88ab\u5207\u65ad\uff0c\u957f\u65f6\u95f4\u6ca1\u6709\u4efb\u4f55\u8fdb\u5c55\u624d\u7b97\u8d85\u65f6\uff0c\u53e6\u6709 30 \u5206\u949f\u7684\u603b\u4e0a\u9650\uff0c\u63d0\u793a\u4f1a\u8bf4\u660e\u662f\u54ea\u4e00\u79cd (#12036)\n- \u6458\u8981\u5931\u8d25\u540e\u7684\u91cd\u8bd5\u7b49\u5f85\u4f1a\u5728\u5230\u8fbe\u4e0a\u4e0b\u6587\u7a97\u53e3\u4e4b\u524d\u89e3\u9664\uff0c\u4e0d\u518d\u5e26\u7740\u8d85\u7a97\u53e3\u7684\u8bf7\u6c42\u53d1\u51fa\uff1b\u4e2d\u8f6c\u7ad9\u5bf9\u8d85\u5927\u8bf7\u6c42\u8fd4\u56de 400 \u6216 413 \u65f6\u4e5f\u4f1a\u5148\u538b\u7f29\u518d\u91cd\u8bd5 (#12082)\n- \u6a21\u578b\u8bf7\u6c42\u88ab\u91cd\u8bd5\u65f6\uff0c\u72b6\u6001\u884c\u4f1a\u8bf4\u660e\u539f\u56e0\uff08\u8fde\u63a5\u4e2d\u65ad\u3001\u8d85\u65f6\u3001\u670d\u52a1\u7aef\u72b6\u6001\u7801\u3001\u6d41\u5f0f\u8f93\u51fa\u505c\u6ede\u7b49\uff09\u3001\u7b49\u591a\u4e45\uff0c\u79d2\u6570\u6309\u6bcf\u6b21\u5c1d\u8bd5\u91cd\u65b0\u8ba1\u65f6\uff1b\u670d\u52a1\u5546\u8bbe\u7f6e\u91cc\u65b0\u589e `idle_timeout_seconds` (#12050)\n- \u8bbe\u7f6e\u91cc\u7684\u300c\u9ed8\u8ba4\u6a21\u578b\u300d\u4e00\u884c\u663e\u793a\u914d\u7f6e\u7684\u9ed8\u8ba4\u6a21\u578b\uff0c\u4e0d\u518d\u8ddf\u7740\u5f53\u524d\u4f1a\u8bdd\u5207\u6362\u7684\u6a21\u578b\u53d8\u5316 (#11992 by @keeyangyy)\n- \u5728\u8bbe\u7f6e\u91cc\u641c\u7d22\u652f\u6301\u5f53\u524d\u754c\u9762\u8bed\u8a00\u663e\u793a\u7684\u540d\u79f0\uff0c\u4f8b\u5982\u82f1\u6587\u754c\u9762\u8f93\u5165 `Community market` \u53ef\u4ee5\u627e\u5230\u5bf9\u5e94\u8bbe\u7f6e (#12094 by @KHG420)\n- \u4e2d\u6587\u7684\u300c\u672c\u4f1a\u8bdd\u4e0d\u518d\u8be2\u95ee\u300d\u300c\u6b64\u7c7b\u64cd\u4f5c\u4e0d\u518d\u8be2\u95ee\u300d\u6309\u94ae\u6539\u4e3a\u660e\u786e\u5199\u51fa\u300c\u5141\u8bb8\u300d\uff0c\u4e0d\u4f1a\u518d\u88ab\u5f53\u6210\u9759\u9ed8\u62d2\u7edd (#12021)\n- \u4e3b\u9898\u5305\u7684\u53d6\u503c\u6539\u7531\u4e00\u4e2a\u751f\u6210\u7684\u6837\u5f0f\u8868\u4e0b\u53d1\uff0c\u4f5c\u8005\u7684\u6837\u5f0f\u8868\u4e0d\u5fc5\u518d\u52a0 `!important` \u5c31\u80fd\u8986\u76d6 (#12014)\n- \u63d2\u4ef6\u5305\u91cc Claude Code \u7684\u6a21\u5757\u58f0\u660e\u73b0\u5728\u4f1a\u88ab\u6807\u4e3a\u4e0d\u652f\u6301\u7684\u80fd\u529b\uff0c\u53ea\u5e26\u6a21\u5757\u7684\u5305\u4e0d\u518d\u663e\u793a\u4e3a\u5b8c\u5168\u517c\u5bb9 (#12017)\n- \u547d\u4ee4\u884c\uff1a`/quit`\u3001`/exit` \u91cd\u65b0\u53ef\u7528\uff0c\u4e0d\u518d\u88ab\u5f53\u6210\u666e\u901a\u6d88\u606f\u53d1\u7ed9\u6a21\u578b\uff1b\u505c\u6b62\u8fc7\u7a0b\u4e2d\u518d\u6309\u4e00\u6b21 Ctrl+C \u5373\u53ef\u9000\u51fa\uff1b\u8865\u5168\u83dc\u5355\u91cc\u6309 Tab \u63a5\u53d7\u9ad8\u4eae\u9879\uff0c\u800c\u4e0d\u662f\u4e0b\u79fb (#12146)\n\n## \u4fee\u590d\n\n- \u5b89\u88c5\u4e86\u5f88\u591a\u63d2\u4ef6\u6280\u80fd\u65f6\uff0c\u6280\u80fd\u5217\u8868\u3001\u6253\u5f00\u7a97\u683c\u548c\u72b6\u6001\u8bfb\u53d6\u5927\u5e45\u53d8\u5feb\uff1b\u5b9e\u6d4b 240 \u4e2a\u63d2\u4ef6\u6280\u80fd\u7684\u5217\u8868\u8bf7\u6c42\u5728 macOS \u4e0a\u7531\u7ea6 3.1 \u79d2\u964d\u5230\u7ea6 33 \u6beb\u79d2 (#12074, #12077, #12079)\n- \u72b6\u6001\u8bfb\u53d6\u4e0d\u518d\u5806\u79ef\u5360\u6ee1\u6d4f\u89c8\u5668\u8fde\u63a5\uff0c\u4e0d\u518d\u51fa\u73b0\u6279\u51c6\u3001\u8ba1\u5212\u51b3\u5b9a\u6216\u56de\u7b54\u5361\u7247\u957f\u65f6\u95f4\u5361\u5728\u300c\u63d0\u4ea4\u4e2d\u300d\uff0c\u51b3\u5b9a\u63d0\u4ea4\u6700\u591a\u7b49\u5f85 20 \u79d2\u5e76\u7ed9\u51fa\u660e\u786e\u63d0\u793a (#12056)\n- \u70b9\u51fb\u4fa7\u680f\u4f1a\u8bdd\u884c\u65f6\u7acb\u5373\u663e\u793a\u4e3a\u9009\u4e2d\uff0c\u4e0d\u5fc5\u7b49\u5185\u6838\u54cd\u5e94\uff1b\u91cd\u590d\u70b9\u51fb\u540c\u4e00\u884c\u4e0d\u4f1a\u91cd\u590d\u6253\u5f00 (#12076)\n- \u72b6\u6001\u6807\u7b7e\u5728\u540e\u63a5\u5165\u7684\u7a97\u53e3\u91cc\u4e0d\u518d\u5728\u56de\u5408\u8fd0\u884c\u65f6\u663e\u793a\u300c\u7a7a\u95f2\u300d (#12047)\n- \u63d0\u793a\u8bcd\u4f18\u5316\u548c\u63d0\u4ea4\u8bf4\u660e\u8349\u62df\u5728\u901a\u7528\u7684 OpenAI \u517c\u5bb9\u670d\u52a1\u4e0a\u53ef\u7528\uff0c\u8fd9\u4e9b\u670d\u52a1\u62d2\u7edd\u300c\u5173\u95ed\u601d\u8003\u300d\u65f6\u4f1a\u6539\u7528\u6700\u4f4e\u6863\u91cd\u8bd5\uff0c\u4e0d\u518d\u63d0\u793a\u6ca1\u6709\u53ef\u7528\u6a21\u578b (#12101)\n- \u7248\u672c\u76ee\u5f55\u3001\u4e2d\u8f6c\u7ad9\u7b49\u8bf7\u6c42\u6539\u7528 Studio \u81ea\u5df1\u7684\u5ba2\u6237\u7aef\u6807\u8bc6\uff0c\u4e0d\u518d\u4ee5 Go \u9ed8\u8ba4\u6807\u8bc6\u53d1\u51fa\u800c\u53ef\u80fd\u88ab Cloudflare \u4ee5 403 \u62e6\u622a (#12064)\n- \u5207\u6362\u8fde\u63a5\u540e\uff0c\u5907\u4efd\u9762\u677f\u4e0d\u518d\u4fdd\u7559\u4e0a\u4e00\u4e2a\u8fde\u63a5\u7684\u6062\u590d\u51ed\u636e\u548c\u786e\u8ba4\uff0c\u9009\u62e9\u53e6\u4e00\u4efd\u5907\u4efd\u65f6\u4e5f\u4f1a\u6e05\u9664\u4e0a\u4e00\u4efd\u7684\u9884\u89c8 (#12127 by @KHG420)\n- \u5207\u6362\u8fde\u63a5\u540e\uff0c\u8bb0\u5fc6\u9762\u677f\u4e0d\u518d\u628a\u65e7\u8fde\u63a5\u7684\u7f16\u8f91\u5185\u5bb9\u3001\u540d\u79f0\u6216\u7248\u672c\u53d1\u7ed9\u65b0\u8fde\u63a5\uff0c\u4e5f\u4e0d\u4f1a\u88ab\u65e7\u8fde\u63a5\u7684\u8fdf\u5230\u7ed3\u679c\u8986\u76d6 (#12131 by @KHG420)\n- \u7f13\u5b58\u7684 MCP \u5de5\u5177\u6ca1\u6709\u81ea\u5e26\u63cf\u8ff0\u65f6\uff0c\u4e5f\u4f1a\u663e\u793a\u300c\u4e0a\u6b21\u8fde\u63a5\u7684\u5feb\u7167\u300d\u6807\u8bb0 (#12096 by @KHG420)\n- \u6d4f\u89c8\u5668\u6807\u7b7e\u6253\u4e0d\u5f00\u65f6\u4f1a\u5728\u7a97\u683c\u91cc\u663e\u793a\u539f\u56e0\uff08\u7f3a\u5c11\u6d4f\u89c8\u5668\u5f15\u64ce\u3001\u542f\u52a8\u5931\u8d25\u3001\u914d\u7f6e\u88ab\u5360\u7528\u7b49\uff09\uff0c\u9519\u8bef\u6587\u5b57\u4e5f\u4e0d\u518d\u663e\u793a\u4e3a\u6b63\u6587\u989c\u8272 (#12140)\n- \u88ab\u5f3a\u884c\u7ed3\u675f\u7684\u5185\u6838\u9057\u7559\u7684 `reasonix-jobs-*` \u4e34\u65f6\u76ee\u5f55\uff0c\u4f1a\u5728\u4e0b\u4e00\u6b21\u542f\u52a8\u65f6\u6e05\u7406\uff1b\u66f4\u65b0\u7a0b\u5e8f\u7684\u4e34\u65f6\u6587\u4ef6\u4e0d\u5728\u672c\u6b21\u4fee\u590d\u8303\u56f4\u5185 (#12145)\n- \u8fd0\u884c\u4e2d\u4fdd\u5b58\u5b50\u4ee3\u7406\u6a21\u578b\u65f6\uff0c\u9009\u62e9\u6846\u4e0d\u518d\u8df3\u56de\u300c\u8ddf\u968f\u4e3b\u6a21\u578b\u300d\uff0c\u5e76\u63d0\u793a\u300c\u5df2\u4fdd\u5b58\uff0c\u5c1a\u672a\u751f\u6548\u300d (#12150)\n- \u8f93\u5165\u6846\u4e0a\u7684\u5de5\u5177\u63d0\u793a\u4e0d\u518d\u8d85\u51fa\u63d0\u793a\u6846\uff0c\u4f18\u5316\u6309\u94ae\u4e0d\u53ef\u7528\u65f6\u4e5f\u4e0d\u518d\u53d1\u865a (#12152)\n- \u5728\u8ba1\u5212\u6279\u51c6\u5361\u7247\u6253\u5f00\u65f6\u505c\u6b62\uff0c\u8ba1\u5212\u4f1a\u56de\u5230\u89c4\u5212\u9636\u6bb5\uff0c\u4e0d\u518d\u5361\u5728\u7b49\u5f85\u6279\u51c6\uff0c\u4e4b\u540e\u7684\u6d88\u606f\u4e5f\u4e0d\u4f1a\u518d\u88ab\u5f53\u6210\u5199\u64cd\u4f5c\u62d2\u7edd (#12154)\n- \u505c\u6b62\u540e\u53d1\u9001\u961f\u5217\u5904\u4e8e\u6682\u505c\u65f6\uff0c\u518d\u53d1\u7684\u6d88\u606f\u4f1a\u4f5c\u4e3a\u540e\u7eed\u6d88\u606f\u4fdd\u7559\uff0c\u5e76\u63d0\u793a\u300c\u5f85\u53d1\u9001\u5df2\u6682\u505c\uff0c\u8fd9\u6761\u6d88\u606f\u5df2\u6392\u5165\u961f\u5217\uff0c\u70b9\u201c\u7ee7\u7eed\u6d3e\u53d1\u201d\u540e\u624d\