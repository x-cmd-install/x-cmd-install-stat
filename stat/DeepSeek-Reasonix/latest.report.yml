0d7 \u5173\u95ed\u540e\u7126\u70b9\u56de\u5230\u8f85\u52a9\u4f1a\u8bdd\u6309\u94ae\u3002\u5173\u8054 #13539 fixed in #13557\u3002\n- \u4e24\u4e2a\u7a97\u53e3\u6216\u9879\u76ee\u7528\u540c\u540d\u4f46\u542f\u52a8\u65b9\u5f0f\u4e0d\u540c\u7684 MCP \u670d\u52a1\u5668\u65f6\uff0c\u4e0d\u518d\u6bcf\u6b21\u542f\u52a8\u4e92\u76f8\u51b2\u6389\u63e1\u624b\u7f13\u5b58\u3002\u5173\u8054 #13560\u3002\n- \u6ca1\u6709\u4ee3\u7406\u3001\u8bfb\u4e0d\u5230\u7248\u672c\u76ee\u5f55\u65f6\uff0c\u6253\u5f00\u8bbe\u7f6e\u9875\u4f1a\u8ba9\u300c\u7248\u672c\u300d\u7b49\u4e0a 15 \u79d2\uff1b\u73b0\u5728\u5404\u5904\u5171\u7528\u4e00\u6b21\u8bfb\u53d6\uff0c\u5931\u8d25\u53ea\u8bb0 20 \u79d2\uff0c\u70b9\u300c\u91cd\u8bd5\u300d\u624d\u91cd\u65b0\u8bfb\u3002\u5173\u8054 #13565\u3002\n- \u539f\u76ee\u5f55\u548c\u9694\u79bb\u76ee\u5f55\u7684\u4f1a\u8bdd\u5f52\u5165\u540c\u4e00\u9879\u76ee\uff0c\u5e76\u6807\u51fa\u5b9e\u9645\u76ee\u5f55\uff1b\u539f\u76ee\u5f55\u5931\u6548\u65f6\u4f7f\u7528\u4ecd\u5b58\u5728\u7684\u76ee\u5f55\uff0c\u624b\u52a8\u9009\u62e9\u9694\u79bb\u76ee\u5f55\u4ecd\u6253\u5f00\u8be5\u76ee\u5f55\u3002\u5173\u8054 #13586 by @SivanCola\u3002\n- \u540c\u4e00\u6587\u4ef6\u5939\u88ab\u5199\u6210\u4e0d\u540c\u5f62\u5f0f\uff08\u5927\u5c0f\u5199\u3001\u659c\u6760\u65b9\u5411\u3001\u672b\u5c3e\u5206\u9694\u7b26\uff09\u65f6\uff0c\u7a97\u683c\u4e0e\u4fa7\u680f\u9879\u76ee\u5bf9\u4e0d\u4e0a\uff0c\u6807\u7b7e\u548c\u5217\u8868\u53ef\u80fd\u7f3a\u5c11\u5df2\u6253\u5f00\u6807\u8bb0\uff1b\u7a97\u683c\u7684\u4f1a\u8bdd\u627e\u4e0d\u5230\u5217\u8868\u884c\u65f6\uff0c\u65e5\u5fd7\u91cc\u4f1a\u7559\u4e00\u884c\u8bf4\u660e\u3002\u5173\u8054 #13600\u3002\n- \u65ad\u7f51\u6062\u590d\u540e\uff0c\u4fa7\u680f\u201c\u8fdb\u884c\u4e2d\u201d\u8ba1\u6570\u4e0d\u518d\u5361\u5728\u5df2\u7ecf\u7ed3\u675f\u7684\u4f1a\u8bdd\u4e0a\uff08\u6ca1\u6253\u5f00\u7684\u7a97\u683c\u4e5f\u4f1a\u5728\u7f51\u7edc\u6062\u590d\u540e\u91cd\u65b0\u8bfb\u5230\u72b6\u6001\uff09\u3002\u5173\u8054 #13604 fixed in #13623\u3002\n- agent \u6253\u5f00\u3001\u5237\u65b0\u6216\u7ffb\u9875\u5185\u7f6e\u6d4f\u89c8\u5668\u65f6\uff0c\u4e0d\u518d\u6253\u65ad\u4f60\u6b63\u5728\u8fdb\u884c\u7684\u8f93\u5165\u6cd5\u8f93\u5165\uff08\u62fc\u97f3\u4e0d\u4f1a\u88ab\u5f53\u6210\u5b57\u6bcd\u76f4\u63a5\u4e0a\u5c4f\uff09\u3002\u5173\u8054 #13605\u3002\n- agent \u6253\u5f00\u3001\u5bfc\u822a\u6216\u663e\u793a\u5185\u7f6e\u6d4f\u89c8\u5668\u9875\u9762\u65f6\uff0c\u4e0d\u518d\u628a\u4f60\u6b63\u5728\u8f93\u5165\u7684\u952e\u76d8\u7126\u70b9\u62a2\u8d70\uff1b\u4f60\u81ea\u5df1\u70b9\u8fdb\u90a3\u4e2a\u9875\u9762\u5219\u7167\u5e38\u3002\u5173\u8054 #13605\u3002\n- \u8bbe\u7f6e\u9875\u5de6\u4fa7\u5df2\u9009\u4e2d\u7684\u5206\u533a\uff0c\u9f20\u6807\u505c\u5728\u4e0a\u9762\u65f6\u4e0d\u518d\u88ab\u60ac\u505c\u6837\u5f0f\u76d6\u6389\uff1a\u6d45\u8272\u4e3b\u9898\u4fdd\u6301\u9009\u4e2d\u5e95\u8272\uff0c\u4e24\u79cd\u4e3b\u9898\u4e0b\u56fe\u6807\u90fd\u4fdd\u6301\u9009\u4e2d\u65f6\u7684\u989c\u8272\u3002\u5173\u8054 #13610\u3002\n- \u53cd\u9988\u521a\u63d0\u4ea4\u3001\u72b6\u6001\u8fd8\u662f\u201c\u5df2\u6536\u5230\u201d\u65f6\uff0c\u5982\u679c\u7ef4\u62a4\u8005\u5df2\u7ecf\u7559\u8a00\u63d0\u95ee\uff0c\u73b0\u5728\u53ef\u4ee5\u76f4\u63a5\u5728\u8fd9\u6761\u4e0b\u9762\u56de\u590d\uff0c\u4e0d\u5fc5\u7b49\u5b83\u88ab\u767b\u8bb0\u4e3a GitHub \u8bae\u9898\uff1b\u5ba1\u6838\u4e2d\u7684\u53cd\u9988\u4ecd\u4e0d\u80fd\u56de\u590d\u3002\u5173\u8054 #13626\u3002\n- \u4e3b\u4f1a\u8bdd\u7684\u6a21\u578b\u4e0d\u8bfb\u56fe\u3001\u5b50\u4ee3\u7406\u7684\u6a21\u578b\u8bfb\u56fe\u65f6\uff0c\u5b50\u4ee3\u7406\u73b0\u5728\u4e5f\u6709 view_image \u53ef\u4ee5\u770b\u56fe\uff0c\u4e0d\u518d\u9519\u7528\u89c6\u9891\u5de5\u5177\uff1b\u7236\u4f1a\u8bdd\u7684\u5de5\u5177\u8868\u4e0d\u53d8\u3002\u5173\u8054 #13642\u3002\n- \u547d\u4ee4\u884c\u91cc\u8f93\u5165\u659c\u6760\u547d\u4ee4\u65f6\uff0c\u540c\u4e00\u6761\u6280\u80fd\u53d1\u73b0\u8b66\u544a\u4e0d\u518d\u6bcf\u6b21\u6309\u952e\u91cd\u590d\u6253\u5370\u3001\u76d6\u4f4f\u8f93\u5165\u884c\u548c\u72b6\u6001\u680f\uff1b\u6bcf\u6761\u8b66\u544a\u6bcf\u4e2a\u4f1a\u8bdd\u53ea\u51fa\u73b0\u4e00\u6b21\u3002\u5173\u8054 #13655\u3002\n- \u540e\u53f0\u4efb\u52a1\u4e00\u6bb5\u65f6\u95f4\u6ca1\u5f80\u81ea\u5df1\u7684\u8f93\u51fa\u91cc\u5199\u5185\u5bb9\u65f6\uff0c\u754c\u9762\u4e0a\u7684\u8b66\u544a\u6539\u6210\u4e2d\u6587\uff0c\u5199\u660e\u4efb\u52a1\u540d\u548c\u5df2\u5b89\u9759\u7684\u65f6\u957f\uff0c\u4e0d\u518d\u663e\u793a\u82f1\u6587\u539f\u6587\u3002\u5173\u8054 #13566 fixed in #13568\u3002\n- \u591a\u4e2a\u4f1a\u8bdd\u540c\u65f6\u8fd0\u884c\u65f6\uff0c\u8d85\u957f\u8f93\u51fa\u5076\u5c14\u88ab\u622a\u65ad\u7684\u95ee\u9898\u3002\u5173\u8054 #13620\u3002\n- Windows \u4e0a\u9ed8\u8ba4\u7aef\u53e3\u843d\u5728\u7cfb\u7edf\u4fdd\u7559\u6bb5\uff08Hyper-V\u3001WSL\u3001Docker\uff09\u65f6\uff0c\u7f51\u9875\u670d\u52a1\u73b0\u5728\u4f1a\u987a\u5ef6\u5230\u4e0b\u4e00\u4e2a\u53ef\u7528\u7aef\u53e3\uff0c\u4e0d\u518d\u76f4\u63a5\u542f\u52a8\u5931\u8d25\u3002\u5173\u8054 #13649\u3002\n- \u7f51\u7edc\u6296\u52a8\u65f6\u8bfb\u53d6\u7a97\u683c\u5217\u8868\u5931\u8d25\uff0c\u4e0d\u518d\u5173\u6389\u6240\u6709\u6807\u7b7e\u5e76\u628a\u4f60\u5207\u5230\u522b\u7684\u7a97\u683c\uff1b\u5171\u4eab\u4e8b\u4ef6\u6d41\u9996\u6b21\u8fde\u4e0a\u540e\u82e5\u65ad\u5f00\uff0c\u91cd\u8fde\u4e0d\u518d\u6f0f\u6389\u4e2d\u95f4\u7684\u4e8b\u4ef6\u3002\u5173\u8054 #13603\u3002\n- \u4f1a\u8bdd\u6807\u9898\u5728\u540e\u53f0\u751f\u6210\u65f6\uff0c\u9996\u6761\u6d88\u606f\u6539\u4e86\u4f1a\u91cd\u65b0\u751f\u6210\uff0c\u8f83\u6162\u7684\u65e7\u7ed3\u679c\u4e0d\u4f1a\u76d6\u6389\u65b0\u6807\u9898\u3002\u5173\u8054 #13611\u3002\n- \u7f51\u7edc\u3001\u58c1\u7eb8\u548c\u8d26\u53f7\u9762\u677f\u5931\u8d25\u65f6\uff0c\u6309\u754c\u9762\u8bed\u8a00\u8bf4\u660e\u539f\u56e0\uff1a\u4e0d\u652f\u6301\u7684\u58c1\u7eb8\u683c\u5f0f\u3001\u88ab\u62d2\u7edd\u7684\u4ee3\u7406\u3001\u767b\u5f55\u8bf7\u6c42\u5df2\u8fc7\u671f\u90fd\u4e0d\u518d\u663e\u793a\u82f1\u6587\u539f\u6587\u6216\u8def\u5f84\u52a0\u72b6\u6001\u7801\u3002\u5173\u8054 #13621 by @xxoingr\u3001#13637 by @xxoingr\u3002\n- \u4f1a\u8bdd\u6536\u4ef6\u7bb1\u7684\u961f\u5217\u6682\u65f6\u8bfb\u4e0d\u51fa\u6765\u65f6\uff0c\u4e0d\u518d\u5f53\u6210\u7a7a\u961f\u5217\u800c\u505c\u6b62\u6295\u9012\uff0c\u4f1a\u7a0d\u540e\u91cd\u8bd5\u3002\u5173\u8054 #13438 by @chuiwenwei\u3002\n- Windows \u4e0a\u8bfb\u53d6 PDF \u5f15\u7528\u8d85\u65f6\u88ab\u53d6\u6d88\u65f6\uff0c\u4e0d\u518d\u56e0\u4e3a\u7ed3\u675f\u8fdb\u7a0b\u547d\u4ee4\u65e0\u54cd\u5e94\u800c\u5361\u4f4f\u3002\u5173\u8054 #13614 by @xxoingr\u3002\n\n## \u5347\u7ea7\u987b\u77e5\n\n- \u672c\u7248\u65e0\u9700\u7528\u6237\u64cd\u4f5c\u3002\u552f\u4e00\u6539\u53d8\u9ed8\u8ba4\u884c\u4e3a\u7684\u662f\u5b50\u4ee3\u7406\u5e76\u53d1\u6570\u548c\u5e76\u884c\u5199\u8005\u6570\u4e0d\u518d\u6709\u9ed8\u8ba4\u4e0a\u9650\uff1b\u60f3\u4fdd\u7559\u4e0a\u9650\uff0c\u5728\u7528\u6237\u914d\u7f6e\u91cc\u8bbe\u7f6e\u3002\u5173\u8054 #13526\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@SivanCola\u3001@tongsailong\u3001@xxoingr\u3001@chuiwenwei\n\n---\n\n<!-- lang:en -->\n\nThis release adds image and video reading tools for the model, web search and fetch backend settings, a real switch and dispatch for session messages, opening a local page in the default program and a provider retry setting, and fixes a batch of sub-agent, MCP, sidebar, IME and feedback-reply problems.\n\n## New\n\n- Appearance > Size has an Interface text step (small to larger) that enlarges only sidebar, settings and tab text, not spacing or controls; body text keeps its own. Refs #11577.\n- For an MCP server you trust, choose to follow it: its changed tool definitions are taken without a click, each still announced, and you can undo it. Refs #12356.\n- an MCP server that answered 401 has a Sign in button; withheld tools gain \"accept and follow this server's changes\", and a followed server can be un-followed. Refs #12357.\n- the My feedback level card now says what \"shipped\" counts: a report that was fixed or built and released in a version. Fixes #12900 fixed in #13530.\n- the model can hand a task to a session in another of your projects (dispatch_to_project); that project's user approves first. Refs #13341.\n- a session you have written to carries a small icon on its row and tab saying where the exchange stands (waiting, working, replied, declined); click it to open that session. Refs #13371.\n- Settings has real session-message switches; a held message can be approved with its project remembered, and revoked in Settings. Applies from the next turn. Refs #13371.\n- declare `video_models` and `video_protocol` and `read_video` hands an MP4 to a model that watches video (DashScope inline, Kimi upload); the card shows which. Refs #13399.\n- a model that reads images gets a view_image tool that shows it a PNG, JPEG, GIF or WebP file in the workspace; text-only models are unchanged. Refs #13540.\n- when this machine cannot read a page, `web_fetch` can fall back to DeepSeek's paid Fetch API after you agree on a card; internal addresses are never sent. Refs #13541.\n- when the free search did not answer, `web_search` can fall back to DeepSeek's paid Search API, after a card shows the price and the query and you agree. Refs #13541.\n- `web_search` can use your own SearXNG instance for free searches, set in your user config, off by default. Refs #13541.\n- Settings > Tools and permissions sets the web search and fetch backends and their order; consent to be billed is its own switch, never ticked for you. New panes only. Refs #13551.\n- A path in the conversation that points into an extra folder you granted now opens read-only in the workbench (no saving); a path outside every granted folder still does not open. Refs #13582 fixed in #13589.\n- Added the user setting `agent.max_provider_retries`: how often a failed provider connection is retried, still 10 by default; 0 keeps trying until you cancel, for long unattended runs. Refs #13526.\n- A goal now shows its usage: the desktop plan fold lists state, turns, requests, tokens and work time and says why it stopped; the terminal footer shows the same. Refs #13663.\n- A local HTML, SVG or PDF file in the workbench browser can now be opened in the system default program from the toolbar button; a note says page scripts run as usual. Refs #13665 fixed in #13668.\n- ACP gains read-only `session/info` (model, workspace, preset, auto-approve, cache) and `session/mcpServers` (configured servers, on or off, no commands). Refs #13644.\n- ACP can reconnect or disconnect an MCP server for one session and submit extension forms; a project-declared server that is not approved is never started, only its command is reported. Refs #13660.\n- In editors (ACP), consent to paid search or fetch can be given for the session or always (saved to your settings), and a reconnected card keeps that choice. Refs #13606.\n\n## Changed\n\n- the composer border sweeps with light on hover or focus as in 1.x (not while running or with reduced motion); the idle/running word is no longer printed but still announced. Refs #13253 fixed in #13567.\n- Settings names models whose price is not in the vendor's list and so cannot be converted to the pinned currency; the price row offers Restore official price. Refs #13513.\n- Sub-agent concurrency and parallel writers are no longer capped by default (were 6 and 3); set limits in your user config. Nesting depth defaults to 8; 0 removes it. Refs #13526.\n- The session queue no longer stops at 64 waiting prompts; set `agent.max_queued_inputs` in your user config to limit it, and the queue's byte limits still apply. Refs #13526.\n- The sidebar no longer stops at 32 remembered projects; set max_workspaces under [desktop] in your user config to limit it. Refs #13526.\n- The STUDIO badge beside the wordmark is now an outline with muted text instead of a solid dark block; its size is unchanged. Refs #13601.\n- MCP sign-in names the host a server sends you to and asks before the browser opens; \"always\" is remembered per server and host only. Refs #12357.\n- `/peer` and the messages-between-sessions API now say whether a message you sent is waiting, being worked on, replied to or declined. Refs #13341.\n- A queued message with a picture cannot join a running turn and waits for it to end; its queue line now says \"Has an image: sent when this turn ends\", not just \"not delivered yet\". Refs #13563.\n- A finished sub-agent in the list now says \"Handed back\" with its time, in green, instead of showing only a number of seconds. Refs #13596 fixed in #13599.\n- Preparing a workspace shows its real stages, success, retry and cancel; a failure or cancel keeps the task and attachments, and existing worktrees are searchable there. Refs #13598 by @SivanCola.\n\n## Fixed\n\n- Compaction reuses the sent system/tool prefix, plus eligible text history. Tool arguments remain elided and oversized or stale requests fall back. Refs #11860.\n- Windows SSH remotes launch the kernel from a UTF-8 script instead of a WMI encoded command, preserving non-ASCII paths. Refs #12750.\n- Fixes the slow skill list after typing \"/\" (most visible with many plugin skills installed): repeated completions within a moment no longer re-read every skill file. Refs #13197 fixed in #13470.\n- Collapse a side question to read the transcript without losing its draft, quotes, answers or pending request. Refs #13288.\n- projects of one repository that declare an MCP server by the same name with different contents keep their enables side by side across a restart. Refs #13527.\n- when the shared event stream never opens (an older kernel, or a proxy), panes read their own streams after 10 seconds instead of staying silent. Refs #13562 by @tongsailong.\n- the side-conversation panel now opens above the composer instead of sitting at the top right over the file tree; Esc or the close cross returns focus to its button. Refs #13539 fixed in #13557.\n- two windows or projects using an MCP server of the same name but a different launch spec no longer evict each other's handshake cache on every start. Refs #13560.\n- With no proxy and an unreachable version catalog, opening Settings kept Versions waiting 15 s; callers now share one read, a failure is kept 20 s, and Retry reads again. Refs #13565.\n- source and worktree chats share one project with checkout labels. A surviving checkout replaces a missing source; picking a worktree still opens it. Refs #13586 by @SivanCola.\n- A folder spelled two ways (case, slashes, trailing separator) no longer splits a pane from its sidebar project; a pane with no row for its conversation now leaves a log line. Refs #13600.\n- after a network flap the sidebar's running count no longer sticks on conversations that finished; a pane you have not opened reads its status again once the network is back. Refs #13604 fixed in #13623.\n- the agent opening, reloading or navigating the built-in browser no longer cuts off an input-method composition in progress (the pinyin is no longer committed as raw letters). Refs #13605.\n- the agent opening, navigating or showing a built-in browser page no longer takes the keyboard from what you are typing in; clicking into that page yourself still works. Refs #13605.\n- The selected settings section keeps its look while the pointer rests on it: its fill in the light theme, and its icon colour in both themes. Refs #13610.\n- A \"received\" report can be answered from its thread once a maintainer has written to it, without waiting to be filed as an issue; one under review still takes no reply. Refs #13626.\n- A sub-agent on an image-reading model now gets view_image even if the session's model cannot read images; the parent's tool block is unchanged. Refs #13642.\n- Typing slash commands no longer reprints the same skill-discovery warning on every keystroke over the input line and status bar; each warning appears once per session. Refs #13655.\n- the warning about a background job that has been silent on its own output is now worded in the interface language, with the job name and how long it has been quiet. Refs #13566 fixed in #13568.\n- Oversize output was occasionally truncated when several sessions ran at once. Refs #13620.\n- On Windows, when the default port falls in a range the system reserves (Hyper-V, WSL, Docker), the web server now moves on to the next free port instead of failing to start. Refs #13649.\n- A failed pane-list read in a network blip no longer closes every tab, and a shared stream that drops right after its first attach no longer loses events. Refs #13603.\n- Session titles generated in the background are asked again when the first message changes, and a slower older result no longer overwrites the newer title. Refs #13611.\n- Network, wallpaper and account panels word their failures in the interface language instead of English text or a path and a status. Refs #13621 by @xxoingr, #13637 by @xxoingr.\n- When the session inbox queue cannot be read for a moment, delivery no longer stops as if it were empty; it retries shortly. Refs #13438 by @chuiwenwei.\n- On Windows, cancelling a timed-out PDF reference extraction no longer hangs when the process-kill command does not answer. Refs #13614 by @xxoingr.\n\n## Upgrade notes\n\n- No action is needed. The only default that changed is that sub-agent concurrency and parallel writers are no longer capped; set limits in your user config to keep them. Refs #13526.\n\n## Contributors\n\nThanks to this release's contributors: @SivanCola, @tongsailong, @xxoingr, @chuiwenwei\n\n## What's Changed\n* fix(web): preserve live remote updates with older Studio kernels by @tongsailong in https://github.com/esengine/DeepSeek-Reasonix/pull/13562\n* test(boot): run the three tests that share the docs-helper cache entry one after another by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13559\n* fix(desktop): the side-conversation panel opens above the composer, inside its pane by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13557\n* feat(desktop): the sidebar remembers as many projects as you open; desktop.max_workspaces is your own limit by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13555\n* feat(search): web_search can answer from the user's own SearXNG, through an ordered backend chain by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13545\n* test(storage): let the state-path guard walk past an in-tree temp folder by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13490\n* fix(studio): panes read their own event streams when the shared one never opens by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13564\n* test(config): the churn in the walk test never reuses a directory name by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13570\n* feat(search): DeepSeek Search API as a paid fallback behind a billing-consent card by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13547\n* fix(jobs): word the stalled background job warning in the interface language by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13568\n* feat(fetch): DeepSeek Fetch API as a paid fallback for web_fetch, behind the billing-consent card by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13551\n* fix(remote): launch detached Windows kernels from a script file by @par73e in https://github.com/esengine/DeepSeek-Reasonix/pull/13556\n* feat(peers): a model tool that hands a task to a session in another project, default off by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13548\n* fix(mcp): projects of one repository that declare a server by the same name keep their enables side by side by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13576\n* fix(desktop): collapse side questions without losing their state by @par73e in https://github.com/esengine/DeepSeek-Reasonix/pull/13558\n* test(relay): drive a hosted page against a real Studio through a stand-in relay in CI by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13574\n* feat(tools): view_image shows a model the picture in a workspace file, for models that read images by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13577\n* test(serve): per-pane delivery metrics on the multiplexed stream and a hundred-pane soak by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13581\n* feat(desktop): the composer keeps the 1.x feel \u2014 a border sweep on hover and focus, no state word inside the box by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13567\n* feat(delegation): sub-agent concurrency and parallel writers default to no limit; depth keeps a named stop at 8 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13550\n* feat(workbench): open a file in a folder the user granted, read-only by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13589\n* refactor(desktop): every interface font size rides one scale, so a text-size setting can reach it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13575\n* test(secrets): let the sink registry walk past an in-tree temp folder by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13592\n* feat(peers): where each hand-off stands: waiting, working, replied or declined by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13549\n* feat(desktop): an interface text size, separate from the interface zoom by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13580\n* fix(compaction): reuse eligible sent request prefixes safely by @par73e in https://github.com/esengine/DeepSeek-Reasonix/pull/13561\n* fix: keep the open pane across a failed pane-list read and resume a first mux attach from where it attached by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13603\n* fix(desktop