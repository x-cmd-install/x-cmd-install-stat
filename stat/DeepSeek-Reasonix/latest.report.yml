ted_at":"2026-10-24T22:02:54Z","updated_at":"2026-10-24T22:02:54Z"},{"id":673422620,"node_id":"RA_kwDOSIatD84oI50c","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:2922ab1900546997509aecc3a334efe5d7f978c05ed9cf479ff1c6dc892837de","download_count":7,"created_at":"2026-10-24T22:02:55Z","updated_at":"2026-10-24T22:02:55Z"}],"body":"\u672c\u7248\u65b0\u589e\u89c6\u9891\u58c1\u7eb8\u3001\u67e5\u627e\u6846\u7684\u5927\u5c0f\u5199\u4e0e\u6b63\u5219\u5f00\u5173\u3001\u5feb\u6377\u952e\u4e00\u89c8\u548c\u957f\u5bf9\u8bdd\u5206\u9875\u52a0\u8f7d\uff0c\u6b63\u6587\u680f\u53ef\u62d6\u5f97\u66f4\u7a84\uff0c\u5e76\u4fee\u590d\u591a\u5904\u4fdd\u5b58\u3001\u7c98\u8d34\u4e0e\u663e\u793a\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u58c1\u7eb8\u53ef\u4ee5\u9009 MP4 \u6216 WebM \u89c6\u9891\uff0c\u4f5c\u4e3a\u9759\u97f3\u5faa\u73af\u7684\u52a8\u6001\u58c1\u7eb8\uff1b\u7a97\u53e3\u9690\u85cf\u6216\u5931\u7126\u3001\u7cfb\u7edf\u51cf\u5f31\u52a8\u6548\u6216\u7cbe\u7b80\u6548\u679c\u4e0b\u505c\u5728\u7b2c\u4e00\u5e27\u3002\u5173\u8054 #14357\u3002\n- \u5bf9\u8bdd\u91cc\u7684\u67e5\u627e\u6846\u591a\u4e86\u4e24\u4e2a\u5f00\u5173\uff1a\u533a\u5206\u5927\u5c0f\u5199\uff0c\u4ee5\u53ca\u628a\u67e5\u8be2\u5f53\u4f5c\u6b63\u5219\u8868\u8fbe\u5f0f\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- \u8bbe\u7f6e\u7684\u5916\u89c2\u9875\u589e\u52a0\u300c\u5feb\u6377\u952e\u300d\u4e00\u680f\uff0c\u5217\u51fa\u7a97\u53e3\u91cc\u6240\u6709\u53ef\u7528\u6309\u952e\uff0c\u53ef\u4ee5\u641c\u300c\u5feb\u6377\u952e\u300d\u300cCtrl\u300d\u300cEsc\u300d\u7b49\u8bcd\u627e\u5230\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- agent \u6d4f\u89c8\u5668\u7684\u7f51\u9875\u53ef\u5728\u300c\u8bbe\u7f6e \u2192 \u5916\u89c2\u300d\u5f00\u542f\u7a7a\u95f2\u4f11\u7720\uff1a15 \u5206\u949f\u65e0\u4eba\u4f7f\u7528\u540e\u6574\u9875\u6536\u8d77\u7701\u5185\u5b58\uff0c\u518d\u7528\u65f6\u6062\u590d\u4e3a\u540c\u4e00\u6807\u7b7e\u9875\u3002\u9ed8\u8ba4\u5173\u95ed\u3002\u5173\u8054 #14332 by @jf200s\u3002\n- \u7248\u672c\u5217\u8868\u91cc\u7684\u4e0b\u8f7d\u548c\u540e\u53f0\u81ea\u52a8\u4e0b\u8f7d\u73b0\u5728\u90fd\u53ef\u4ee5\u53d6\u6d88\uff1b\u53d6\u6d88\u4f1a\u505c\u6b62\u4f20\u8f93\uff0c\u5e76\u5220\u9664\u8fd9\u6b21\u4e0b\u8f7d\u7559\u4e0b\u7684\u90e8\u5206\u6587\u4ef6\u3002\u5173\u8054 #14338\u3002\n- \u65b0\u589e\u53ef\u9009\u7684\u5386\u53f2\u63a5\u53e3\uff0c\u6309\u9875\u8bfb\u53d6\u6b63\u6587\u5e76\u4fdd\u7559\u7a33\u5b9a\u7684\u6d88\u606f\u4f4d\u7f6e\u548c\u8de8\u9875\u5de5\u5177\u4e0a\u4e0b\u6587\uff1b\u73b0\u6709\u5ba2\u6237\u7aef\u7ee7\u7eed\u5168\u91cf\u8bfb\u53d6\u3002\u5173\u8054 #14048\u3001#14087 by @SivanCola\u3002\n\n## \u53d8\u66f4\n\n- \u58c1\u7eb8\u4e0d\u518d\u6709 12 MB \u4e0a\u9650\uff0c\u539f\u6837\u4f7f\u7528\u4f60\u9009\u7684\u56fe\u7247\uff1b\u4e0a\u4f20\u6539\u4e3a\u8fb9\u6536\u8fb9\u5199\u5165\u78c1\u76d8\uff0c\u8bfb\u53d6\u652f\u6301\u5206\u6bb5\uff0c\u5927\u6587\u4ef6\u4e0d\u518d\u5360\u6ee1\u5185\u5b58\u3002\u5173\u8054 #13980\u3002\n- \u6b63\u6587\u5b57\u5bbd\u73b0\u5728\u53ef\u4ee5\u8fde\u7eed\u62d6\u5230 640px\uff0c\u4e0d\u518d\u505c\u5728\u300c\u9002\u5b9c\u9605\u8bfb\u300d\u7684 760px\uff1b\u6309 Home \u6216\u4e0d\u62d6\u52a8\u65f6\u4ecd\u662f 760px\u3002\u5173\u8054 #14384\u3002\n- \u9605\u8bfb\u680f\u5de6\u53f3\u4e24\u4fa7\u7684\u62d6\u52a8\u628a\u624b\u5e73\u65f6\u4e0d\u518d\u663e\u793a\uff0c\u9f20\u6807\u79fb\u5230\u680f\u8fb9\u7f18\u624d\u51fa\u73b0\uff0c\u62d6\u52a8\u548c\u952e\u76d8\u8c03\u6574\u4e0d\u53d8\u3002\u5173\u8054 #14352 fixed in #14353\u3002\n- \u79fb\u9664\u5de5\u4f5c\u53f0\u7684\u300c\u52a0\u5bbd\u300d\u6309\u94ae\u3001\u72ec\u7acb\u52a0\u5bbd\u6a21\u5f0f\u53ca Ctrl/Cmd+Shift+B\uff1b\u53ef\u62d6\u52a8\u5206\u9694\u6761\u6216\u805a\u7126\u540e\u7528\u65b9\u5411\u952e\u8c03\u5bbd\u3002\u5173\u8054 #14324 fixed in #14335 by @lancy69\u3002\n- \u8f6e\u6b21\u591a\u7684\u5bf9\u8bdd\u91cc\uff0c\u53f3\u4fa7\u63d0\u95ee\u7ec6\u6761\u4f1a\u628a\u76f8\u90bb\u51e0\u6761\u6298\u6210\u4e00\u7ec4\uff0c\u60ac\u505c\u663e\u793a\u6db5\u76d6\u7684\u8303\u56f4\uff1b\u53f3\u952e\u67d0\u6761\u53ef\u52a0\u4e66\u7b7e\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- \u300c\u8fd0\u884c\u5206\u6790\u300d\u5165\u53e3\u53d8\u6210\u56fe\u6807\u52a0\u6587\u5b57\uff0c\u5206\u6790\u9875\u6807\u9898\u5de6\u4fa7\u591a\u4e86\u8fd4\u56de\u7bad\u5934\uff1b\u70b9\u5df2\u5728\u5c4f\u4e0a\u7684\u4f1a\u8bdd\u4f1a\u56de\u5230\u6b63\u6587\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- \u5bfc\u51fa\u4f1a\u8bdd\u591a\u4e86 Markdown \u683c\u5f0f\uff1a\u53ea\u4fdd\u7559\u63d0\u95ee\u4e0e\u56de\u7b54\uff0c\u6309\u53d1\u751f\u987a\u5e8f\uff1bJSON \u4ecd\u4fdd\u7559\u5168\u90e8\u5b57\u6bb5\u3002\u5173\u8054 #14198 by @imcreazy\u3002\n- \u5f00\u542f\u300c\u6d3e\u53d1\u300d\u540e\uff0c\u628a\u4efb\u52a1\u6d3e\u5230\u4fa7\u8fb9\u680f\u91cc\u4f60\u81ea\u5df1\u7684\u9879\u76ee\u65f6\uff0c\u4e0d\u518d\u56e0\u8be5\u9879\u76ee\u5c1a\u672a\u51b3\u5b9a\u4fe1\u4efb\u800c\u505c\u5728\u4fe1\u4efb\u5361\u4e0a\u3002\u5173\u8054 #13341\u3002\n- \u6ca1\u6709\u9009\u8fc7\u9879\u76ee\u4e5f\u6ca1\u6709\u8bb0\u4f4f\u7684\u9879\u76ee\u65f6\uff0c\u9996\u6b21\u542f\u52a8\u4e0d\u518d\u6253\u5f00\u7528\u6237\u4e3b\u76ee\u5f55\uff0c\u800c\u662f\u6253\u5f00\u5e94\u7528\u81ea\u5df1\u7ba1\u7406\u7684\u4e00\u4e2a\u5c0f\u76ee\u5f55\uff0c\u5b83\u4e0d\u4f1a\u88ab\u8bb0\u6210\u9879\u76ee\u3002\u5173\u8054 #14363\u3002\n- \u8f93\u5165 `/` \u540e\u53ef\u7ee7\u7eed\u8f93\u5165\u63cf\u8ff0\u4e2d\u7684\u5173\u952e\u8bcd\u67e5\u627e\u6280\u80fd\u548c\u547d\u4ee4\uff1b\u540d\u79f0\u5339\u914d\u4ecd\u4f18\u5148\u4e8e\u63cf\u8ff0\u5339\u914d\u3002\u5173\u8054 #14323 fixed in #14344 by @lancy69\u3002\n- \u5de5\u5177\u53c2\u6570\u7f3a\u5fc5\u586b\u9879\u3001\u5f85\u529e\u5217\u8868\u89c4\u5219\u4e0d\u7b26\u3001diff \u8bc1\u636e\u88ab\u62d2\u65f6\uff0c\u62a5\u9519\u4f1a\u76f4\u63a5\u7ed9\u51fa\u5408\u6cd5\u793a\u4f8b\u6216\u6539\u7528 files \u8bc1\u636e\u7684\u51fa\u8def\u3002\u5173\u8054 #14311\u3002\n- \u652f\u6301\u5206\u9875\u7684\u670d\u52a1\u7aef\u4f18\u5148\u663e\u793a\u6700\u8fd1\u6d88\u606f\uff1b\u8bfb\u53d6\u65e7\u9875\u4fdd\u7559\u9605\u8bfb\u4f4d\u7f6e\u548c\u63a7\u4ef6\uff0c\u641c\u7d22\u4f1a\u63d0\u793a\u5386\u53f2\u8986\u76d6\u4e0d\u5b8c\u6574\u3002\u5173\u8054 #14048\u3001#14087 by @SivanCola\u3002\n\n## \u4fee\u590d\n\n- \u5207\u56de\u300c\u53d1\u9001\u53cd\u9988\u300d\u6807\u7b7e\u6216\u70b9\u51fb\u53cd\u9988\u7a97\u53e3\u6807\u9898\u540e\uff0cCtrl+V \u4e5f\u80fd\u6dfb\u52a0\u622a\u56fe\uff1b\u6253\u5f00\u7a97\u53e3\u540e\u7acb\u523b\u7c98\u8d34\u4e5f\u4e0d\u518d\u88ab\u5076\u5c14\u5ffd\u7565\u3002\u5173\u8054 #14205 fixed in #14333 by @lancy69\u3001#14333 by @lancy69\u3002\n- \u65b0\u5bf9\u8bdd\u7b2c\u4e00\u6b21\u4fdd\u5b58\u524d\u5728\u53f3\u4fa7\u63d0\u95ee\u7ec6\u6761\u4e0a\u52a0\u7684\u4e66\u7b7e\uff0c\u4fdd\u5b58\u540e\u4e0d\u518d\u6d88\u5931\uff0c\u91cd\u542f\u540e\u4e5f\u4e0d\u4f1a\u51fa\u73b0\u5728\u53e6\u4e00\u6bb5\u65b0\u5bf9\u8bdd\u91cc\u3002\u5173\u8054 #14296 by @imcreazy\u3002\n- \u63a5\u53e3\u62a5\u544a\u300c\u7f13\u5b58\u547d\u4e2d 0\u300d\u65f6\u6309\u5b8c\u5168\u672a\u547d\u4e2d\u8ba1\u7b97\uff0c\u7f13\u5b58\u547d\u4e2d\u7387\u4e0d\u518d\u865a\u9ad8\uff1b\u5f02\u5e38\u7684\u8d85\u989d\u547d\u4e2d\u88ab\u622a\u65ad\uff0c99.5% \u4ee5\u4e0a\u4e0d\u518d\u5199\u6210 100%\u3002\u5173\u8054 #14313 by @jf200s\u3002\n- \u540e\u53f0\u4efb\u52a1\u542f\u52a8\u65f6\u7684\u63d0\u793a\u6309\u754c\u9762\u8bed\u8a00\u663e\u793a\u4e3a\u300c\u540e\u53f0\u4efb\u52a1\u5df2\u5f00\u59cb\uff1a\u2026\u300d\uff0c\u4e0d\u518d\u662f\u552f\u4e00\u7684\u82f1\u6587\u3002\u5173\u8054 #14308\u3002\n- \u6b63\u6587\u5b57\u5bbd\u7684\u4e24\u4e2a\u624b\u67c4\u5728\u7b2c\u4e00\u6b21\u62d6\u8fc7\u4e4b\u540e\u4e0d\u518d\u5931\u6548\uff1b\u62d6\u52a8\u65f6\u4e24\u4fa7\u680f\u6309\u5404\u81ea\u6bd4\u4f8b\u8ba9\u4f4d\uff0c\u8f93\u5165\u6846\u8ddf\u968f\u6b63\u6587\u53d8\u5bbd\u3002\u5173\u8054 #14320 by @imcreazy\u3002\n- \u5c55\u5f00\u5f85\u529e\u8ba1\u5212\u65f6\uff0c\u53f3\u4fa7\u6d88\u606f\u7ec6\u6761\u548c\u300c\u8df3\u5230\u6700\u65b0 / \u56de\u5230\u9876\u90e8\u300d\u6309\u94ae\u4e0d\u518d\u88ab\u9876\u8d77\uff1b\u8ba1\u5212\u9762\u677f\u6d6e\u5728\u8f93\u5165\u6846\u4e0a\u65b9\u3002\u5173\u8054 #14321 by @imcreazy\u3002\n- \u4e0a\u4e0b\u6587\u538b\u7f29\u5b8c\u6210\u540e\u7684\u8bca\u65ad\u884c\u6309\u754c\u9762\u8bed\u8a00\u5199\u6210\u4e00\u53e5\u8bdd\uff0c\u4e0d\u518d\u662f\u82f1\u6587 key=value\u3002\u5173\u8054 #14307\u3002\n- \u5de5\u4f5c\u53f0\u53f3\u952e\u83dc\u5355\u5408\u5e76\u7f16\u8f91\u64cd\u4f5c\u4e0e\u300c\u52a0\u5165\u5bf9\u8bdd\u300d\uff1b\u9605\u8bfb\u548c\u53ea\u8bfb\u89c6\u56fe\u4e0d\u663e\u793a\u4fee\u6539\u64cd\u4f5c\uff0c\u672a\u9009\u4e2d\u6587\u5b57\u65f6\u4e0d\u663e\u793a\u5f15\u7528\u3002\u5173\u8054 #14326 fixed in #14348 by @lancy69\u3002\n- \u8fd8\u6ca1\u786e\u8ba4\u7684\u63d0\u95ee\u5361\u7247\u6eda\u51fa\u89c6\u91ce\u518d\u56de\u6765\u540e\uff0c\u5df2\u52fe\u9009\u7684\u9009\u9879\u3001\u81ea\u586b\u6587\u5b57\u3001\u8865\u5145\u8bf4\u660e\u548c\u6240\u5728\u9898\u76ee\u4f1a\u4fdd\u7559\u3002\u5173\u8054 #14336 fixed in #14337\u3002\n- \u7528\u667a\u80fd\u4f53\u9884\u8bbe\u5efa\u7684\u4f1a\u8bdd\uff0c\u5347\u7ea7\u540e\u56e0\u5185\u7f6e\u5de5\u5177\u53d8\u5316\u4e0d\u518d\u53d8\u6210\u53ea\u80fd\u67e5\u770b\uff1b\u6309\u5f53\u65f6\u8bb0\u5f55\u7684\u5de5\u5177\u7ee7\u7eed\uff0c\u5e76\u63d0\u793a\u4e00\u6b21\u3002\u5173\u8054 #14360 fixed in #14370\u3002\n- \u6267\u884c\u8fc7\u7a0b\u90a3\u4e00\u884c\u7684\u300cN \u9879\u8fd0\u884c\u4e2d / \u5931\u8d25 / \u64cd\u4f5c\u300d\u548c\u6807\u9898\u73b0\u5728\u5b57\u53f7\u3001\u5b57\u91cd\u4e00\u81f4\u3002\u5173\u8054 #14364\u3002\n- \u81ea\u52a8\u547d\u540d\u65f6\u6807\u9898\u6a21\u578b\u628a\u8f93\u51fa\u989d\u5ea6\u90fd\u82b1\u5728\u601d\u8003\u4e0a\uff0c\u7a0b\u5e8f\u4f1a\u653e\u5bbd\u989d\u5ea6\u91cd\u8bd5\u4e00\u6b21\uff0c\u800c\u4e0d\u662f\u76f4\u63a5\u5931\u8d25\u3002\u5173\u8054 #14374\u3002\n- \u8bbe\u7f6e\u300c\u5b58\u50a8\u300d\u91cc\u300c\u5bfc\u5165\u539f\u751f\u4f1a\u8bdd\u300d\u7684\u5361\u7247\u4e0d\u518d\u9732\u51fa\u6d4f\u89c8\u5668\u81ea\u5e26\u7684\u6587\u4ef6\u9009\u62e9\u6846\uff0c\u6539\u7528\u5e94\u7528\u98ce\u683c\u6309\u94ae\u3002\u5173\u8054 #14378\u3002\n- \u5b50\u4ee3\u7406\u4ee5\u53ca\u8ba1\u5212\u8005\u3001Guardian \u7684\u6587\u4ef6\u8bfb\u53d6\u5404\u7528\u72ec\u7acb\u8bb0\u5f55\uff0c\u4e0d\u518d\u5237\u65b0\u6267\u884c\u4ee3\u7406\u7684\u8fc7\u671f\u6587\u4ef6\u4fdd\u62a4\u800c\u8986\u76d6\u4f60\u7684\u4fee\u6539\u3002\u5173\u8054 #14025\u3001#14133 by @SivanCola\u3002\n- Guardian \u81ea\u8eab\u7684 `use_capability` \u8c03\u7528\u5bf9\u771f\u5b9e\u76ee\u6807\u505a\u53ea\u8bfb\u68c0\u67e5\uff0c\u62d2\u7edd\u5199\u5165\u548c\u5df2\u58f0\u660e\u7684\u5bbf\u4e3b\u53d8\u66f4\u3002\u5173\u8054 #14025\u3001#14133 by @SivanCola\u3002\n- \u91cd\u542f\u540e Git \u6682\u65f6\u4e0d\u53ef\u7528\u65f6\u4fdd\u7559\u9694\u79bb\u7ed3\u679c\u7684\u6587\u4ef6\u548c ID\uff1b\u6062\u590d\u524d\u6838\u5bf9\u6258\u7ba1\u76ee\u5f55\u4e0e\u4ed3\u5e93\u8eab\u4efd\uff0c\u9519\u914d\u7684\u8bb0\u5f55\u4fdd\u7559\u4e14\u4e0d\u4f1a\u88ab\u6e05\u7406\u6216\u5e94\u7528\u3002\u5173\u8054 #14025\u3001#14133 by @SivanCola\u3002\n- \u4e50\u89c2\u6a21\u5f0f\u4e0b\u7684\u4efb\u52a1\u5199\u5165\u4f1a\u68c0\u67e5\u5144\u5f1f\u4efb\u52a1\u5360\u7528\uff0c\u5305\u542b\u52a8\u6001\u672c\u5730\u5de5\u5177\uff1b\u4e0d\u76f8\u4ea4\u7684\u5199\u5165\u4ecd\u53ef\u5e76\u884c\u3002\u5173\u8054 #14025\u3001#14133 by @SivanCola\u3002\n\n## \u5347\u7ea7\u987b\u77e5\n\n- \u6d3e\u53d1\u5230\u4fa7\u8fb9\u680f\u91cc\u6ca1\u51b3\u5b9a\u8fc7\u4fe1\u4efb\u7684\u9879\u76ee\u65f6\uff0c\u8be5\u9879\u76ee\u4f1a\u88ab\u8bb0\u4e3a\u5df2\u4fe1\u4efb\u5e76\u76f4\u63a5\u53d1\u51fa\u4efb\u52a1\uff1b\u5bb6\u76ee\u5f55\u7b49\u4e0d\u53ef\u6574\u4f53\u4fe1\u4efb\u7684\u6587\u4ef6\u5939\u4ecd\u4f1a\u8be2\u95ee\u3002\u5173\u8054 #13341\u3002\n- \u4e50\u89c2\u6a21\u5f0f\u4e0b\uff0c\u540c\u4e00\u6587\u4ef6\u88ab\u5144\u5f1f\u4efb\u52a1\u5360\u7528\u65f6\uff0c\u540e\u5230\u7684\u5199\u5165\u4f1a\u4ee5 write.path_busy \u88ab\u62d2\u7edd\uff0c\u800c\u4e0d\u518d\u9759\u9ed8\u8986\u76d6\u3002\u5173\u8054 #14025\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@imcreazy\u3001@jf200s\u3001@SivanCola\u3001@lancy69\n\n---\n\n<!-- lang:en -->\n\nThis release adds video wallpapers, case and regex switches in find, a shortcut sheet and paged loading of long conversations, lets the reading column go narrower, and fixes several saving, pasting and display problems.\n\n## New\n\n- A wallpaper can be an MP4 or WebM video, played muted and looping; it stays on its first frame while the window is hidden or unfocused, under reduced motion or reduced effects. Refs #14357.\n- The find bar gained two switches: match case, and read the query as a regular expression. Refs #14198 by @imcreazy.\n- The appearance settings gained a keyboard shortcut sheet listing every chord the window answers to, reachable by searching \"shortcut\", \"Ctrl\" or \"Esc\". Refs #14198 by @imcreazy.\n- Agent browser pages can sleep when idle (Settings \u2192 Appearance): a page nobody drives for 15 minutes is folded away and wakes as the same tab. Off by default. Refs #14332 by @jf200s.\n- A version download, started from the version list or by automatic download, can now be cancelled; cancelling stops the transfer and removes the partial files. Refs #14338.\n- An optional history API reads the transcript in bounded pages with stable positions and cross-page tool context; existing clients keep full reads. Refs #14048, #14087 by @SivanCola.\n\n## Changed\n\n- Wallpapers have no 12 MB limit and are used as chosen; the upload is written to disk as it arrives and served in ranges, so a large one no longer fills memory. Refs #13980.\n- The reading column can be dragged continuously down to 640px instead of stopping at 760px; Home and an untouched window still give 760px. Refs #14384.\n- The reading column's resize grips no longer draw at rest; they appear under the pointer or on keyboard focus, and dragging and keys are unchanged. Refs #14352 fixed in #14353.\n- Removed Widen mode, its button and Ctrl/Cmd+Shift+B; use the divider or the arrow keys on it to resize. Refs #14324 fixed in #14335 by @lancy69.\n- A long conversation folds neighbouring questions in the rail into one line and names the range on hover; right click stars one. Refs #14198 by @imcreazy.\n- The run analysis entry reads as words beside its icon, the page has a back arrow, and picking a conversation already on screen returns to reading. Refs #14198 by @imcreazy.\n- A conversation can be exported as Markdown, keeping only the questions and answers in order; JSON still carries every field. Refs #14198 by @imcreazy.\n- With dispatch on, a task sent to a project in your sidebar no longer stops on its trust card because you hadn't decided about it yet. Refs #13341.\n- With no chosen or remembered project, a first launch opens a small folder the app owns instead of your home directory; it is never remembered as a project. Refs #14363.\n- Type description keywords after `/` to find skills and commands; name matches still rank first. Refs #14323 fixed in #14344 by @lancy69.\n- A tool call missing a required field, a todo list breaking a rule, and a diff citation for command-made changes now show a valid example or the files-evidence way out. Refs #14311.\n- Paging servers show the latest messages first; older pages keep your reading position and controls, and search says when history is incomplete. Refs #14048, #14087 by @SivanCola.\n\n## Fixed\n\n- Pasting a screenshot works after returning to the Send feedback tab or clicking the dialog heading, and a paste right after opening is no longer sometimes ignored. Refs #14205 fixed in #14333 by @lancy69, #14333 by @lancy69.\n- A question starred in the rail before a new conversation is first saved stays starred, and no longer reappears in another unsaved conversation after a restart. Refs #14296 by @imcreazy.\n- A request reported with zero cache hits counts as a full miss, so the hit rate no longer drifts up; over-reported hits are clamped and 99.5% no longer shows as 100%. Refs #14313 by @jf200s.\n- The notice shown when a background job starts is worded in the interface language instead of staying the one English line. Refs #14308.\n- The reading column's grips no longer stop after the first drag; sidebars give way while dragging and the composer follows the width. Refs #14320 by @imcreazy.\n- Opening the todo plan no longer pushes the message rail or the jump buttons up; the panel floats above the composer. Refs #14321 by @imcreazy.\n- The line shown after a context fold is one sentence in the interface language, not an English key=value dump. Refs #14307.\n- Workbench text menus combine editing and Add to conversation, respect read-only views and selection, and keep focus and undo/redo. Refs #14326 fixed in #14348 by @lancy69.\n- An unanswered ask card keeps its picks, typed text, notes and current question when it scrolls out of view and back. Refs #14336 fixed in #14337.\n- A conversation bound to an Agent preset no longer turns read-only after an upgrade changes a built-in tool; it continues with the recorded tools and says so once. Refs #14360 fixed in #14370.\n- The running / failed / action counts on the activity line now share the title's size and weight. Refs #14364.\n- When the title model spends its whole output budget thinking, automatic naming asks once more with room for the title instead of failing. Refs #14374.\n- The \"Import a native session\" card in Settings \u2192 Storage no longer shows the browser's own file input; it uses an app-styled button. Refs #14378.\n- Reads by child tasks, the Planner and the Guardian use their own records and no longer refresh the executor's stale-file guard and overwrite your edits. Refs #14025, #14133 by @SivanCola.\n- The Guardian's own `use_capability` calls enforce read-only execution on the real target, refusing writes and declared host mutations. Refs #14025, #14133 by @SivanCola.\n- After a restart with Git unavailable, an isolated result keeps its files and ID; recovery checks managed paths and repository identity, and a mismatched record stays untouched. Refs #14025, #14133 by @SivanCola.\n- Optimistic task writes honour live sibling claims, including dynamically resolved local tools; disjoint writes stay parallel. Refs #14025, #14133 by @SivanCola.\n\n## Upgrade notes\n\n- Dispatching to a sidebar project you have not decided about records it as trusted and sends the task; folders that cannot be trusted whole, such as your home directory, still ask. Refs #13341.\n- In optimistic mode, a write to a file a sibling task holds is refused with write.path_busy instead of silently overwriting it. Refs #14025.\n\n## Contributors\n\nThanks to this release's contributors: @imcreazy, @jf200s, @SivanCola, @lancy69\n\n## What's Changed\n* test(delegation): observe the running fleet job before the children are released by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14316\n* fix(stats): an endpoint's zero cache hit is a full miss, not an absence by @jf200s in https://github.com/esengine/DeepSeek-Reasonix/pull/14313\n* feat(studio): match case and regular expressions in the find bar by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14301\n* feat(studio): export a conversation as Markdown by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14299\n* fix(studio): make run analysis easy to enter and to leave by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14294\n* fix(jobs): a started background job is announced with a code and its payload, so it follows the language by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14317\n* feat(studio): fold a crowded conversation rail, and let a question be starred by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14296\n* feat(studio): a shortcut sheet in the settings by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14300\n* Keep the plan panel from pushing the rail and the jump arrows by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14321\n* fix(compaction): a finished fold is announced with a code and a typed payload, so it follows the language by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14322\n* Let the reading column's grips, sidebars and composer move together by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14320\n* fix(studio): route feedback image paste through the dialog by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14333\n* feat(browser): a page nobody drives sleeps, and wakes as the same target by @jf200s in https://github.com/esengine/DeepSeek-Reasonix/pull/14332\n* fix(studio): an unanswered ask card keeps its picks when its block unmounts by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14337\n* fix(migrate): an imported session completes its sidecar by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14213\n* build(deps): bump zod from 3.25.76 to 4.6.6 in /workers/forum by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14339\n* build(deps-dev): bump fast-uri from 3.1.8 to 3.1.9 in /tools/acp-conformance by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14340\n* build(deps): bump undici from 8.12.1 to 8.12.3 in /desktop/frontend-next by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14342\n* fix(studio): the feedback form takes a paste in the commit that draws it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14347\n* fix(completion): find slash skills by description by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14344\n* fix(studio): the reading column's grips draw nothing until the pointer is on them by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14353\n* feat(studio): first run without a picked workspace by @Oliver-Rui in https://github.com/esengine/DeepSeek-Reasonix/pull/14351\n* feat(studio): cancel an update download from the Versions panel by @1012905 in https://github.com/esengine/DeepSeek-Reasonix/pull/14345\n* fix(studio): remove redundant workbench widening mode by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14335\n* docs: remove the first-run workspace design (moved to #14363) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14367\n* feat(studio): wallpapers upload as a streamed body, have no size limit and are served in ranges by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14369\n* fix(studio): a conversation bound to an Agent preset continues when a built-in tool schema changed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14370\n* fix(tools): refusals of malformed calls, todo lists and diff evidence show what a valid one looks like by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14372\n* Set the activity line in one type scale by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14376\n* fix(studio): automatic naming asks once more with room when the title model only thought by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14375\n* fix(studio): the native session import card uses the app's button like the legacy one beside it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14378\n* feat(studio): a wallpaper can be an MP4 or WebM video, played muted and looping by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14373\n* fix(dispatch): trust an undecided project the user named in their own list by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14381\n* fix(studio): integrate workbench text context menus by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14348\n* feat(studio): a launch with no chosen or remembered project opens the app's own auto workspace, not home by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14379\n* fix(agent): give each child its own file views / \u4fee\u590d\u7236\u5b50\u4ee3\u7406\u6587\u4ef6\u8bfb\u53d6\u8bb0\u5f55\u5171\u4eab by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14382\n* feat(studio): the reading column can be dragged narrower than the readable measure by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14384\n* fix(guardian): enforce resolved read-only execution / \u4fee\u590d\u5ba1\u67e5\u89d2\u8272\u52a8\u6001\u5199\u5165\u8d8a\u6743 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14386\n* fix(isolation): retain results on inspection errors / \u4fee\u590d\u6062\u590d\u68c0\u67e5\u5931\u8d25\u4e22\u5931\u9694\u79bb\u7ed3\u679c by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14390\n* fix(agent): isolate review-role file views / \u4fee\u590d\u5ba1\u67e5\u89d2\u8272\u5237\u65b0\u6267\u884c\u4ee3\u7406\u8bfb\u53d6\u8bb0\u5f55 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14387\n* test(agent): wait out a held final observation, not a slow seal by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14391\n* fix(studio): a star placed before a conversation's first save stays with it by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14393\n* feat(history): add cursor-based history API / \u72ec\u7acb\u6e38\u6807\u5206\u9875\u63a5\u53e3 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14365\n* fix(isolation): verify recovered record identity / \u6821\u9a8c\u9694\u79bb\u6062\u590d\u8bb0\u5f55\u7684\u5bbf\u4e3b\u8eab\u4efd by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14392\n* fix(agent): coordinate optimistic child writes / \u4fee\u590d\u4e50\u89c2\u5b50\u4ee3\u7406\u5177\u540d\u5199\u5165\u7ed5\u8fc7\u5360\u7528 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14394\n* feat(studio): load transcript pages incrementally / \u6b63\u6587\u6e10\u8fdb\u5206\u9875\u754c\u9762 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14366\n* docs(release): studio 2.51.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14396\n\n## New Contributors\n* @Oliver-Rui made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/14351\n* @1012905 made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/14345\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.50.0...studio-v2.51.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002x86_64 \u7528\u6587\u4ef6\u540d\u5e26 amd64 \u7684\u5305\uff0caarch64\uff08\u7edf\u4fe1 UOS\u3001\u9e92\u9e9f\u7b49\uff09\u7528\u5e26 arm64 \u7684\u5305\u3002\u4e5f\u63d0\u4f9b `.AppImage`\uff08\u53ea\u63d0\u4f9b\u4e0b\u8f7d\uff0c\u4e0d\u4f1a\u81ea\u66f4\u65b0\uff1b\u9700\u8981 FUSE 2\uff0c\u6216\u7528 `--appimage-extract-and-run` \u542f\u52a8\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":10}
