t","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":283,"digest":"sha256:58314a95b9725ecc94a38cdad04cdcb45d9ec59408f9a578fc84080a8b954694","download_count":6,"created_at":"2026-09-29T03:40:34Z","updated_at":"2026-09-29T03:40:34Z"}],"body":"> \u9879\u76ee\u914d\u7f6e\u4e0e\u6c99\u76d2\u7684\u5b89\u5168\u52a0\u56fa\u3001\u4e0a\u4e0b\u6587\u6574\u7406\u4e0d\u518d\u65e0\u9650\u7b49\u5f85\uff0c\u4ee5\u53ca\u82e5\u5e72\u684c\u9762\u7aef\u4fee\u590d\u3002\n\n**\u53d1\u5e03\u6e20\u9053\uff1a\u7a33\u5b9a\u7248 \u00b7 v1.39.5**\n\n[English \u2192](https://reasonix.io/changelog/v1.39.5/?lang=en) \u00b7 [\u7f51\u9875\u7248\u5b8c\u6574\u66f4\u65b0\u65e5\u5fd7 \u2192](https://reasonix.io/changelog/v1.39.5/)\n\n## \u6982\u89c8\n\n**Reasonix v1.39.5 \u2014 Reasonix 1.39.5**\n\n\u9879\u76ee\u914d\u7f6e\u4e0e\u6c99\u76d2\u7684\u5b89\u5168\u52a0\u56fa\u3001\u4e0a\u4e0b\u6587\u6574\u7406\u4e0d\u518d\u65e0\u9650\u7b49\u5f85\uff0c\u4ee5\u53ca\u82e5\u5e72\u684c\u9762\u7aef\u4fee\u590d\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-29\n\n**Desktop 13 \u00b7 CLI 8**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u9879\u76ee\u914d\u7f6e\u53ea\u80fd\u6536\u7d27\u4f60\u7684\u8bbe\u7f6e** \u2014 \u4ed3\u5e93\u91cc\u7684 reasonix.toml \u548c .reasonix/settings.json \u4e0d\u80fd\u518d\u653e\u5bbd\u6c99\u76d2\u3001\u6743\u9650\u548c\u5ba1\u6279\u8bbe\u7f6e\uff0c\u53ea\u80fd\u8ba9\u5b83\u4eec\u66f4\u4e25\u683c\u3002\u9879\u76ee\u58f0\u660e\u7684\u7a0b\u5e8f\uff08\u94a9\u5b50\u3001\u8bed\u8a00\u670d\u52a1\u5668\u3001\u6a21\u578b\u670d\u52a1\u5546\u3001shell\u3001ripgrep \u548c\u6d4f\u89c8\u5668\u8def\u5f84\uff09\u9996\u6b21\u4f7f\u7528\u524d\u9700\u8981\u4f60\u6279\u51c6\uff0c\u58f0\u660e\u6216\u76f8\u5173\u6587\u4ef6\u53d8\u5316\u540e\u4f1a\u518d\u6b21\u8be2\u95ee\u3002\u5728\u9879\u76ee\u91cc\u9009\u62e9\u7684\u300c\u603b\u662f\u5141\u8bb8\u300d\u6539\u4e3a\u4fdd\u5b58\u5728\u4f60\u7684 Reasonix \u4e3b\u76ee\u5f55\uff0c\u800c\u4e0d\u662f\u5199\u8fdb\u4ed3\u5e93\u3002 ([#11209](https://github.com/esengine/DeepSeek-Reasonix/pull/11209) by @esengine)\n- **[Desktop \u00b7 CLI]** **\u4e0a\u4e0b\u6587\u6574\u7406\u6709\u65f6\u95f4\u4e0a\u9650\uff0c\u5931\u8d25\u65f6\u4fdd\u7559\u539f\u6709\u4e0a\u4e0b\u6587** \u2014 \u63a5\u8fd1\u4e0a\u9650\u7684\u5bf9\u8bdd\u5728\u6574\u7406\u65f6\u53ef\u80fd\u65e0\u9650\u7b49\u5f85\uff0c\u56e0\u4e3a\u670d\u52a1\u7aef\u5fc3\u8df3\u4e00\u76f4\u8ba9\u8bf7\u6c42\u4fdd\u6301\u6d3b\u8dc3\u3002\u73b0\u5728\u6bcf\u6b21\u6574\u7406\u6709\u7edf\u4e00\u7684\u4e94\u5206\u949f\u4e0a\u9650\uff1b\u6458\u8981\u5931\u8d25\u65f6\u4fdd\u7559\u6700\u540e\u4e00\u6b21\u786e\u8ba4\u7684\u4e0a\u4e0b\u6587\uff0c\u4e0d\u518d\u9000\u56de\u6709\u635f\u622a\u65ad\u3002 ([#11171](https://github.com/esengine/DeepSeek-Reasonix/pull/11171) by @SivanCola)\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u4fdd\u5b58\u6743\u9650\u89c4\u5219\u65f6\u62d2\u7edd\u672a\u77e5\u5de5\u5177\u540d** \u2014 \u684c\u9762\u8bbe\u7f6e\u4e0d\u518d\u4fdd\u5b58\u50cf deny = [\"rm\"] \u8fd9\u6837\u4e0d\u5bf9\u5e94\u4efb\u4f55\u5df2\u6ce8\u518c\u5de5\u5177\u3001\u6c38\u8fdc\u4e0d\u4f1a\u751f\u6548\u7684\u89c4\u5219\uff0c\u5e76\u7ed9\u51fa\u5e94\u5199\u6210\u7684 Bash(...) \u5f62\u5f0f\uff1bMCP \u670d\u52a1\u6682\u65f6\u65ad\u5f00\u65f6\uff0c\u5b83\u7684\u5de5\u5177\u540d\u4ecd\u53ef\u4fdd\u5b58\u3002 ([#11185](https://github.com/esengine/DeepSeek-Reasonix/pull/11185) by @KHG420)\n- **[Desktop \u00b7 CLI]** **\u6a21\u578b\u8bf7\u6c42\u5931\u8d25\u7684\u8bca\u65ad\u4fe1\u606f\u5728\u6536\u5c3e\u548c\u91cd\u542f\u540e\u4fdd\u7559** \u2014 \u6a21\u578b\u8bf7\u6c42\u5931\u8d25\u540e\uff0c\u6700\u7ec8\u72b6\u6001\u4e0e\u5931\u8d25\u5206\u7c7b\u5728\u6536\u5c3e\u65f6\u4e0d\u518d\u4e22\u5931\uff0c\u91cd\u65b0\u6253\u5f00\u4f1a\u8bdd\u540e\u4ecd\u80fd\u770b\u5230\u3002\u53d1\u7ed9\u6a21\u578b\u7684\u5185\u5bb9\u548c\u91cd\u8bd5\u7b56\u7565\u4e0d\u53d8\u3002 ([#11152](https://github.com/esengine/DeepSeek-Reasonix/pull/11152) by @SivanCola)\n- **[Desktop]** **\u6807\u9898\u680f\u56fe\u6807\u8ddf\u968f\u4e3b\u9898\u914d\u8272** \u2014 \u6807\u9898\u680f\u56fe\u6807\u6539\u7528\u4e3b\u9898\u5f3a\u8c03\u8272\uff0c\u5728\u6df1\u8272\u4e3b\u9898\u4e0b\u4e5f\u6e05\u6670\u53ef\u89c1\u3002 ([#11188](https://github.com/esengine/DeepSeek-Reasonix/pull/11188) by @esengine)\n\n### \u4fee\u590d\n\n- **[Desktop]** **\u8def\u5f84\u76f8\u8fd1\u7684\u4e24\u4e2a\u9879\u76ee\u4e0d\u518d\u5171\u7528\u4f1a\u8bdd** \u2014 \u50cf front-end/app \u4e0e front/end-app \u8fd9\u6837\u7684\u5de5\u4f5c\u533a\u4f1a\u6620\u5c04\u5230\u540c\u4e00\u4e2a\u9879\u76ee\u76ee\u5f55\uff0c\u4e00\u4e2a\u9879\u76ee\u91cc\u4fdd\u5b58\u7684\u4f1a\u8bdd\u53ef\u80fd\u51fa\u73b0\u5728\u53e6\u4e00\u4e2a\u9879\u76ee\u4e2d\u3002\u73b0\u5728\u65b0\u6dfb\u52a0\u7684\u9879\u76ee\u82e5\u53d1\u751f\u51b2\u7a81\u4f1a\u4f7f\u7528\u72ec\u7acb\u76ee\u5f55\uff0c\u5df2\u6709\u9879\u76ee\u4fdd\u6301\u4e0d\u53d8\u3002 ([#11190](https://github.com/esengine/DeepSeek-Reasonix/pull/11190) by @KHG420)\n- **[Desktop]** **\u5f52\u6863\u65e7\u4f1a\u8bdd\u65f6\u4e00\u5e76\u5f52\u6863\u5b83\u7684\u6240\u6709\u7248\u672c** \u2014 \u5f52\u6863\u65e7\u7248\u672c\u7559\u4e0b\u7684\u4f1a\u8bdd\u65f6\uff0c\u5b83\u7684\u5176\u4ed6\u7248\u672c\u4ecd\u7559\u5728\u4fa7\u8fb9\u680f\uff0c\u770b\u8d77\u6765\u50cf\u662f\u5f52\u6863\u540e\u53c8\u51fa\u73b0\u3002\u73b0\u5728\u4f1a\u4e00\u5e76\u5f52\u6863\u6240\u6709\u7248\u672c\u3002 ([#11187](https://github.com/esengine/DeepSeek-Reasonix/pull/11187) by @esengine)\n- **[Desktop]** **\u65e7\u7248 Linux \u4fbf\u643a\u5b89\u88c5\u5347\u7ea7\u5931\u8d25\u65f6\u6062\u590d\u539f\u7248\u672c** \u2014 Linux \u4fbf\u643a\u7248 1.18 \u81f3 1.19.2 \u7684\u66f4\u65b0\u7a0b\u5e8f\u53ef\u80fd\u53ea\u89e3\u51fa\u90e8\u5206\u6587\u4ef6\u3002\u73b0\u5728\u8fc1\u79fb\u7a0b\u5e8f\u4f1a\u62d2\u7edd\u8fd9\u79cd\u4e0d\u5b8c\u6574\u7684\u66f4\u65b0\u5e76\u6062\u590d\u539f\u7248\u672c\uff0c\u4e0d\u518d\u7559\u4e0b\u65e0\u6cd5\u542f\u52a8\u7684\u5b89\u88c5\u3002 ([#11182](https://github.com/esengine/DeepSeek-Reasonix/pull/11182) by @esengine)\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u9879\u76ee\u914d\u7f6e\u53ea\u80fd\u6536\u7d27\u4f60\u7684\u8bbe\u7f6e** \u2014 \u4ed3\u5e93\u91cc\u7684 reasonix.toml \u548c .reasonix/settings.json \u4e0d\u80fd\u518d\u653e\u5bbd\u6c99\u76d2\u3001\u6743\u9650\u548c\u5ba1\u6279\u8bbe\u7f6e\uff0c\u53ea\u80fd\u8ba9\u5b83\u4eec\u66f4\u4e25\u683c\u3002\u9879\u76ee\u58f0\u660e\u7684\u7a0b\u5e8f\uff08\u94a9\u5b50\u3001\u8bed\u8a00\u670d\u52a1\u5668\u3001\u6a21\u578b\u670d\u52a1\u5546\u3001shell\u3001ripgrep \u548c\u6d4f\u89c8\u5668\u8def\u5f84\uff09\u9996\u6b21\u4f7f\u7528\u524d\u9700\u8981\u4f60\u6279\u51c6\uff0c\u58f0\u660e\u6216\u76f8\u5173\u6587\u4ef6\u53d8\u5316\u540e\u4f1a\u518d\u6b21\u8be2\u95ee\u3002\u5728\u9879\u76ee\u91cc\u9009\u62e9\u7684\u300c\u603b\u662f\u5141\u8bb8\u300d\u6539\u4e3a\u4fdd\u5b58\u5728\u4f60\u7684 Reasonix \u4e3b\u76ee\u5f55\uff0c\u800c\u4e0d\u662f\u5199\u8fdb\u4ed3\u5e93\u3002 ([#11209](https://github.com/esengine/DeepSeek-Reasonix/pull/11209) by @esengine)\n- **[Desktop \u00b7 CLI]** **\u4e0a\u4e0b\u6587\u6574\u7406\u6709\u65f6\u95f4\u4e0a\u9650\uff0c\u5931\u8d25\u65f6\u4fdd\u7559\u539f\u6709\u4e0a\u4e0b\u6587** \u2014 \u63a5\u8fd1\u4e0a\u9650\u7684\u5bf9\u8bdd\u5728\u6574\u7406\u65f6\u53ef\u80fd\u65e0\u9650\u7b49\u5f85\uff0c\u56e0\u4e3a\u670d\u52a1\u7aef\u5fc3\u8df3\u4e00\u76f4\u8ba9\u8bf7\u6c42\u4fdd\u6301\u6d3b\u8dc3\u3002\u73b0\u5728\u6bcf\u6b21\u6574\u7406\u6709\u7edf\u4e00\u7684\u4e94\u5206\u949f\u4e0a\u9650\uff1b\u6458\u8981\u5931\u8d25\u65f6\u4fdd\u7559\u6700\u540e\u4e00\u6b21\u786e\u8ba4\u7684\u4e0a\u4e0b\u6587\uff0c\u4e0d\u518d\u9000\u56de\u6709\u635f\u622a\u65ad\u3002 ([#11171](https://github.com/esengine/DeepSeek-Reasonix/pull/11171) by @SivanCola)\n\n### \u6539\u8fdb\n\n- **[Desktop \u00b7 CLI]** **\u6a21\u578b\u8bf7\u6c42\u5931\u8d25\u7684\u8bca\u65ad\u4fe1\u606f\u5728\u6536\u5c3e\u548c\u91cd\u542f\u540e\u4fdd\u7559** \u2014 \u6a21\u578b\u8bf7\u6c42\u5931\u8d25\u540e\uff0c\u6700\u7ec8\u72b6\u6001\u4e0e\u5931\u8d25\u5206\u7c7b\u5728\u6536\u5c3e\u65f6\u4e0d\u518d\u4e22\u5931\uff0c\u91cd\u65b0\u6253\u5f00\u4f1a\u8bdd\u540e\u4ecd\u80fd\u770b\u5230\u3002\u53d1\u7ed9\u6a21\u578b\u7684\u5185\u5bb9\u548c\u91cd\u8bd5\u7b56\u7565\u4e0d\u53d8\u3002 ([#11152](https://github.com/esengine/DeepSeek-Reasonix/pull/11152) by @SivanCola)\n\n## \u5347\u7ea7\u63d0\u9192\n\n- **[Desktop \u00b7 CLI]** **\u9879\u76ee\u58f0\u660e\u7684\u7a0b\u5e8f\u9700\u8981\u6279\u51c6\u4e00\u6b21** \u2014 \u9879\u76ee reasonix.toml \u6216 .reasonix/settings.json \u91cc\u58f0\u660e\u7684\u94a9\u5b50\u3001\u8bed\u8a00\u670d\u52a1\u5668\u3001\u6a21\u578b\u670d\u52a1\u5546\u3001tools.shell.path\u3001tools.search.rg_path \u548c [browser] \u8bbe\u7f6e\uff0c\u5728\u4f60\u6279\u51c6\u524d\u4e0d\u4f1a\u751f\u6548\uff1a\u5728\u9879\u76ee\u76ee\u5f55\u8fd0\u884c reasonix trust \u67e5\u770b\uff08reasonix trust --yes \u6279\u51c6\uff09\uff0c\u6216\u5728\u684c\u9762\u7aef\u7684\u94a9\u5b50\u8bbe\u7f6e\u91cc\u6279\u51c6\u3002\u53ea\u6307\u5411\u672a\u6279\u51c6\u9879\u76ee\u670d\u52a1\u5546\u7684\u6a21\u578b\u8bbe\u7f6e\u4f1a\u56de\u843d\u5230\u4f60\u81ea\u5df1\u7684\u8bbe\u7f6e\u3002\n- **[Desktop \u00b7 CLI]** **\u6279\u51c6\u6309\u6587\u4ef6\u5939\u5206\u522b\u8bb0\u5f55** \u2014 \u540c\u4e00\u4ed3\u5e93\u7684\u6bcf\u4e2a\u5de5\u4f5c\u6811\u3001\u6bcf\u4e2a\u5176\u4ed6\u6587\u4ef6\u5939\u90fd\u9700\u8981\u5206\u522b\u6279\u51c6\u3002\n- **[Desktop \u00b7 CLI]** **\u4e0d\u518d\u63a5\u53d7\u4f4d\u4e8e\u5de5\u4f5c\u533a\u5185\u7684\u7a0b\u5e8f\u8def\u5f84** \u2014 tools.shell.path\u3001tools.search.rg_path \u548c browser.chrome_path \u4e0d\u80fd\u518d\u6307\u5411\u5de5\u4f5c\u533a\u3001\u4e34\u65f6\u76ee\u5f55\u3001allow_write \u76ee\u5f55\u6216\u5de5\u5177\u94fe\u7f13\u5b58\u91cc\u7684\u7a0b\u5e8f\uff0c\u8bf7\u6539\u4e3a\u6307\u5411\u5df2\u5b89\u88c5\u7684\u7a0b\u5e8f\u3002\n- **[Desktop \u00b7 CLI]** **\u6c99\u76d2\u3001\u6743\u9650\u548c\u4ee3\u7406\u8bbe\u7f6e\u53ea\u53d6\u4f60\u81ea\u5df1\u7684\u914d\u7f6e** \u2014 \u9879\u76ee\u53ea\u80fd\u8ba9 [sandbox] \u548c [permissions] \u66f4\u4e25\u683c\uff1bpermissions.mode\u3001allow\u3001allow_dynamic_bash\u3001[network] \u4ee3\u7406\u8bbe\u7f6e\u548c\u9ed8\u8ba4\u5de5\u5177\u5ba1\u6279\u6a21\u5f0f\u90fd\u53d6\u81ea\u4f60\u7684\u7528\u6237\u914d\u7f6e\u3002\u9879\u76ee\u91cc\u4e0d\u518d\u751f\u6548\u7684\u8bbe\u7f6e\u4f1a\u5728\u52a0\u8f7d\u65f6\u4ee5\u8b66\u544a\u5217\u51fa\u3002\n- **[Desktop \u00b7 CLI]** **\u673a\u5668\u4eba\u53ea\u8bfb\u53d6\u4f60\u81ea\u5df1\u7684\u914d\u7f6e** \u2014 \u4e0d\u518d\u8bfb\u53d6\u9879\u76ee reasonix.toml \u91cc\u7684 [bot] \u6bb5\uff0c\u684c\u9762\u7aef\u4e5f\u4e0d\u518d\u628a\u9879\u76ee\u7684 reasonix.toml \u5408\u5e76\u8fdb\u4f60\u7684\u914d\u7f6e\u3002\u8bf7\u628a\u673a\u5668\u4eba\u8bbe\u7f6e\u79fb\u5230\u7528\u6237\u914d\u7f6e\u4e2d\u3002\n\n## \u98ce\u9669\u63d0\u793a\n\n\u5f53\u524d\u6ca1\u6709\u9700\u8981\u989d\u5916\u64cd\u4f5c\u7684\u5df2\u77e5\u98ce\u9669\u3002\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.39.4...desktop-v1.39.5)\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@esengine\u3001@SivanCola\u3001@KHG420\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
