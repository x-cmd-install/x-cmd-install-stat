in":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:8ba85374b9bb0a08ae9704f30d31801ead4b6f053f941c4b7f004a2ad7ee4fa6","download_count":5,"created_at":"2026-10-13T01:43:30Z","updated_at":"2026-10-13T01:43:30Z"}],"body":"\u672c\u7248\u52a0\u5165\u4ece\u4efb\u610f\u56de\u590d\u5206\u652f\u4f1a\u8bdd\u3001\u4f1a\u8bdd\u6279\u91cf\u64cd\u4f5c\u3001\u6a21\u578b\u663e\u793a\u522b\u540d\u548c MCP \u5de5\u5177\u5b9a\u4e49\u53d8\u66f4\u5ba1\u6279\uff0c\u5e76\u4fee\u590d\u957f\u5bf9\u8bdd\u91cc\u62d6\u9009\u6587\u5b57\u5361\u6b7b\u3001\u91cd\u8f7d\u540e\u4e22\u5931\u64a4\u9500\u5165\u53e3\u7b49\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u53ef\u4ee5\u4ece\u4efb\u610f\u4e00\u6761\u56de\u590d\u5206\u652f\u51fa\u4e00\u4e2a\u72ec\u7acb\u7684\u65b0\u4f1a\u8bdd (#12770)\n- \u4f1a\u8bdd\u884c\u4e0a\u6709\u5feb\u901f\u5f52\u6863\u548c\u5220\u9664\uff1b\u53ef\u4ee5\u591a\u9009\u672c\u5730\u4f1a\u8bdd\u505a\u6279\u91cf\u64cd\u4f5c (#12775, #12807)\n- \u628a\u6587\u4ef6\u5939\u62d6\u5230\u4fa7\u8fb9\u680f\u5373\u53ef\u6dfb\u52a0\u4e3a\u9879\u76ee\uff0c\u9879\u76ee\u53f3\u952e\u83dc\u5355\u53ef\u4ee5\u6253\u5f00\u9879\u76ee\u64cd\u4f5c (#12776, #12324 by @KHG420)\n- \u4ece\u4e0a\u4e0b\u6587\u73af\u548c\u68c0\u67e5\u5668\u5c31\u80fd\u538b\u7f29\u4e0a\u4e0b\u6587 (#12777)\n- \u5bf9\u8bdd\u5bfc\u822a\u65c1\u663e\u793a\u5f53\u524d\u8ba1\u5212 (#12803)\n- \u6d4f\u89c8\u5668\u9762\u677f\u65b0\u589e\u5bbd\u5c4f\u6a21\u5f0f\uff0c\u6253\u5f00\u65f6\u4ecd\u80fd\u770b\u5230\u5bf9\u8bdd\uff1b\u6d4f\u89c8\u5668\u9875\u9762\u53ef\u4ee5\u9010\u4e2a\u6216\u6279\u91cf\u5173\u95ed (#11762, #12806)\n- \u6587\u4ef6\u9762\u677f\u53f3\u952e\u589e\u52a0\u300c\u590d\u5236\u8def\u5f84\u300d\u548c\u300c\u590d\u5236\u5f15\u7528\u300d\uff0c\u540d\u79f0\u91cc\u542b\u5192\u53f7\u6216\u4ee5\u53cd\u659c\u6760\u7ed3\u5c3e\u800c\u65e0\u6cd5\u8868\u793a\u6210\u5f15\u7528\u65f6\u4f1a\u7981\u7528\u540e\u8005 (#12818, #12842 by @XTLine)\n- \u53ef\u4ee5\u7ed9\u6bcf\u4e2a\u6a21\u578b\u8bbe\u7f6e\u663e\u793a\u522b\u540d\uff1b\u6dfb\u52a0\u6765\u6e90\u524d\u53ef\u4ee5\u6279\u91cf\u68c0\u6d4b\u6a21\u578b (#12821, #12835)\n- \u6a21\u578b\u504f\u597d\u91cc\u53ef\u4ee5\u8bbe\u7f6e\u8054\u7f51\u641c\u7d22\u4f7f\u7528\u7684\u6a21\u578b (#11761)\n- MCP \u670d\u52a1\u5668\u7684\u5de5\u5177\u5b9a\u4e49\u53d8\u66f4\u540e\uff0c\u9700\u8981\u91cd\u65b0\u6279\u51c6\u624d\u4f1a\u542f\u7528 (#12829)\n- \u56de\u9000\u4e4b\u540e\u5bf9\u8bdd\u9876\u90e8\u663e\u793a\u6301\u4e45\u7684\u64a4\u9500\u63d0\u793a\uff0c\u53ef\u4ee5\u5173\u95ed\uff0c\u91cd\u8f7d\u540e\u4ecd\u5728 (#12831, #12559 by @XTLine)\n- \u53ef\u4ee5\u5728\u53f3\u952e\u83dc\u5355\u91cc\u5f15\u7528\u9009\u4e2d\u7684\u56de\u590d\u6587\u5b57 (#12836)\n- \u53d1\u9001\u5feb\u6377\u952e\u6210\u4e3a\u7edf\u4e00\u7684\u504f\u597d\u8bbe\u7f6e (#12837)\n- \u53cd\u9988\u8868\u5355\u91cc\u53ef\u4ee5\u76f4\u63a5\u6253\u5f00\u65e5\u5fd7\u6587\u4ef6\u5939\uff1b\u53cd\u9988\u5bf9\u8bdd\u6298\u53e0\u663e\u793a\u5e76\u4fdd\u7559\u672a\u8bfb\u72b6\u6001 (#12768, #12802)\n- \u6b63\u5728\u4f7f\u7528\u7684\u7248\u672c\u88ab\u64a4\u56de\u65f6\uff0c\u5e94\u7528\u4f1a\u544a\u77e5\u7528\u6237 (#12769)\n- \u5de5\u4f5c\u53f0\u300c+\u300d\u6309\u94ae\u4f1a\u663e\u793a\u542f\u52a8\u5668\uff0c\u4ece\u5bfc\u822a\u6253\u5f00\u805a\u7126\u4f1a\u8bdd\u7684\u6587\u4ef6 (#12826 by @XTLine, #12832)\n\n## \u53d8\u66f4\n\n- \u4f1a\u8bdd\u6807\u7b7e\u9875\u6539\u4e3a\u6309\u9700\u5f00\u542f (#12841)\n- \u9879\u76ee\u91cc\u7f6e\u9876\u7684\u4f1a\u8bdd\u6392\u5728\u6700\u524d\u5e76\u5e26\u6807\u8bb0 (#12845)\n- \u9ed8\u8ba4\u6d45\u8272\u4e3b\u9898\u7684\u5c42\u6b21\u91cd\u65b0\u8c03\u6574\uff1b\u89c6\u56fe\u6807\u7b7e\u4e0e\u9875\u9762\u8272\u8c03\u4e00\u81f4 (#12793, #12782)\n- \u5bf9\u8bdd\u58c1\u7eb8\u4e0b\u7684\u6587\u5b57\u5149\u6655\u53ef\u4ee5\u914d\u7f6e (#12839)\n- \u5f53\u524d\u4f7f\u7528\u7684\u6a21\u578b\u5728\u8f93\u5165\u6846\u7684\u9009\u62e9\u5668\u91cc\u6392\u7b2c\u4e00 (#12801)\n- \u624b\u673a\u7a84\u5c4f\u4e0a\u672a\u8f93\u5165\u65f6\u7684\u8f93\u5165\u6846\u66f4\u7d27\u51d1\uff0c\u5e76\u4fdd\u7559\u5206\u652f\u6807\u8bc6 (#12800, #12813)\n- \u5de6\u4fa7\u56fe\u6807\u680f\u7684\u56fe\u6807\u4e0e\u5bf9\u5e94\u8bbe\u7f6e\u5206\u533a\u4e00\u81f4\uff1b\u8bbe\u7f6e\u9875\u6253\u5f00\u65f6\u4fa7\u8fb9\u680f\u5f00\u5173\u4ecd\u53ef\u7528 (#12753, #12798)\n- \u9996\u5c4f\u6539\u7528 1.9 MB \u7684\u6838\u5fc3\u5b57\u4f53\u5b50\u96c6\uff1b\u5bf9\u8bdd\u5bfc\u822a\u6761\u6bcf\u4e2a\u53ef\u533a\u5206\u4f4d\u7f6e\u53ea\u753b\u4e00\u4e2a\u6807\u8bb0 (#12766, #12767)\n- \u591a\u4e2a\u4f1a\u8bdd\u5171\u7528\u4e00\u4e2a\u5de5\u4f5c\u533a\u65f6\uff0c\u5199\u5165\u6539\u7528\u4e50\u89c2\u79df\u7ea6 (#12772)\n- \u6ca1\u6709\u58f0\u660e\u68c0\u67e5\u7684\u9879\u76ee\u91cc\uff0c\u5199\u8fc7\u6587\u4ef6\u7684\u672a\u8bc6\u522b\u547d\u4ee4\u4e0d\u518d\u514d\u9664\u9a8c\u8bc1 (#12848 by @boscocp)\n\n## \u4fee\u590d\n\n- \u957f\u5bf9\u8bdd\u91cc\u62d6\u9009\u6587\u5b57\u4f1a\u5361\u6b7b\uff1a\u9009\u533a\u7ecf\u8fc7\u7684\u8fdc\u5904\u5757\u6539\u4e3a\u6309\u5bf9\u8bdd\u539f\u6587\u4fdd\u7559\uff0c1200 \u8f6e\u5bf9\u8bdd\u91cc\u8de8\u5c4f\u9009\u62e9\u4ece\u6570\u5341\u79d2\u964d\u5230\u7ea6 0.1 \u79d2\uff1b\u8fd9\u4e9b\u4e2d\u95f4\u5757\u590d\u5236\u51fa\u7684\u662f\u5bf9\u8bdd\u539f\u6587\uff0c\u4e0d\u518d\u5e26\u754c\u9762\u6807\u7b7e (#12850)\n- \u4e00\u4e2a\u8d85\u8fc7 128 \u4e2a\u5b57\u7b26\u7684 MCP \u5de5\u5177\u540d\u4f1a\u8ba9\u6574\u4e2a\u4f1a\u8bdd\u7684\u6bcf\u6b21\u8bf7\u6c42\u5931\u8d25\uff1a\u73b0\u5728\u53ea\u7f29\u77ed\u5de5\u5177\u540d\u90e8\u5206 (#12849)\n- \u5bc6\u96c6\u7684\u65f6\u95f4\u7ebf\u4fe1\u53f7\u53ef\u4ee5\u9010\u4e2a\u67e5\u770b (#12815)\n- \u538b\u7f29\u5bf9\u8bdd\u65f6\u8f6c\u5f55\u533a\u4e0d\u518d\u8df3\u52a8 (#12783)\n- \u505c\u653e\u7684\u6d4f\u89c8\u5668\u9875\u9762\u518d\u6b21\u663e\u793a\u65f6\u4f1a\u91cd\u65b0\u9644\u7740\uff0c\u4e