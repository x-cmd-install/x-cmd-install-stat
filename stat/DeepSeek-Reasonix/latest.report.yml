ek-Reasonix/pull/11114) by @esengine)\n- **[Desktop]** **\u8fdc\u7a0b SSH \u4f1a\u8bdd\u6062\u590d\u6b63\u5e38\u52a0\u8f7d\u4e0e\u53d1\u9001** \u2014 \u5728\u8fdc\u7aef\u6253\u5f00\u8fc7\u4e00\u6b21\u65e7\u7684\u5386\u53f2\u4f1a\u8bdd\u540e\uff0c\u4e4b\u540e\u7684\u8fde\u63a5\u4f1a\u62a5 \"transcript v2 is required\" \u6216 \"Transcript v2 is not synchronized\"\uff0c\u65e0\u6cd5\u52a0\u8f7d\u4e5f\u65e0\u6cd5\u53d1\u9001\u3002\u73b0\u5728\u8fdc\u7aef Serve \u4f1a\u59cb\u7ec8\u5982\u5b9e\u58f0\u660e\u5b83\u652f\u6301\u7684\u80fd\u529b\u3002\u66f4\u65b0\u540e\u91cd\u8fde\u4e00\u6b21\uff0c\u684c\u9762\u7aef\u4f1a\u81ea\u52a8\u91cd\u542f\u8fdc\u7aef Serve \u5e76\u66ff\u6362\u5176\u7a0b\u5e8f\u3002 ([#11124](https://github.com/esengine/DeepSeek-Reasonix/pull/11124) by @esengine)\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u9879\u76ee\u914d\u7f6e\u3001serve \u5ba1\u6279\u3001\u5bbf\u4e3b git \u4e0e\u6c99\u76d2\u7684\u5b89\u5168\u52a0\u56fa** \u2014 \u9879\u76ee\u58f0\u660e\u7684 MCP \u670d\u52a1\u5728\u542f\u52a8\u524d\u4f1a\u5148\u5f81\u5f97\u4f60\u7684\u540c\u610f\uff0c\u9879\u76ee\u4e5f\u4e0d\u80fd\u518d\u8bbe\u7f6e\u72b6\u6001\u680f\u547d\u4ee4\uff1b\u901a\u8fc7 serve \u8fdb\u884c\u7684\u4fee\u6539\u4e0e\u5ba1\u6279\u9700\u8981\u672c\u6b21\u542f\u52a8\u7684\u4ee4\u724c\uff1bReasonix \u81ea\u5df1\u6267\u884c\u7684 git \u547d\u4ee4\u4e0d\u518d\u8fd0\u884c\u4ed3\u5e93\u914d\u7f6e\u7684\u7a0b\u5e8f\uff1b\u5728 bash \u6c99\u76d2\u5185\uff0c\u4ed3\u5e93\u7684 git \u914d\u7f6e\u4e0e\u94a9\u5b50\u4fdd\u6301\u53ea\u8bfb\u3002 ([#11114](https://github.com/esengine/DeepSeek-Reasonix/pull/11114) by @esengine)\n\n### \u4fee\u590d\n\n- **[CLI]** **ACP \u5bf9\u8bdd\u4fdd\u7559\u4f60\u8f93\u5165\u7684\u6280\u80fd\u8c03\u7528\u539f\u6587** \u2014 \u901a\u8fc7 ACP \u53d1\u9001\u7684\u884c\u5185\u6280\u80fd\u8c03\u7528\uff0c\u73b0\u5728\u4ee5\u4f60\u8f93\u5165\u7684\u539f\u6587\u8fdb\u5165\u672c\u8f6e\uff0c\u800c\u4e0d\u662f\u6e32\u67d3\u540e\u7684\u6280\u80fd\u6b63\u6587\uff0c\u4e0e CLI \u548c\u684c\u9762\u7aef\u4e00\u81f4\u3002 ([#11047](https://github.com/esengine/DeepSeek-Reasonix/pull/11047) by @KHG420)\n\n## \u5347\u7ea7\u63d0\u9192\n\n\u672c\u7248\u672c\u65e0\u9700\u624b\u52a8\u8fc1\u79fb\u3002\n\n## \u98ce\u9669\u63d0\u793a\n\n\u5f53\u524d\u6ca1\u6709\u9700\u8981\u989d\u5916\u64cd\u4f5c\u7684\u5df2\u77e5\u98ce\u9669\u3002\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.39.2...desktop-v1.39.3)\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@esengine\u3001@KHG420\n","mentions_count":2}
