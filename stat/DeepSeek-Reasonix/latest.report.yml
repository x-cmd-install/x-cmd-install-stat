at":"2026-10-19T02:08:48Z","updated_at":"2026-10-19T02:08:48Z"},{"id":654995136,"node_id":"RA_kwDOSIatD84nCm7A","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:4b6d3ea671a34c13b0b1995e937e29d63b21a985920f879c866b98b823c7a258","download_count":10,"created_at":"2026-10-19T02:08:48Z","updated_at":"2026-10-19T02:08:48Z"}],"body":"\u672c\u7248\u65b0\u589e\u5b9a\u65f6\u4efb\u52a1\u3001\u4f1a\u8bdd\u6392\u5e8f\u4e0e\u8de8\u9879\u76ee\u79fb\u52a8\u3001\u624b\u673a\u63d0\u9192\u3001WSL \u8fdc\u7a0b\u3001Git \u9762\u677f\u3001\u53cd\u9988\u8d21\u732e\u699c\u3001\u89c4\u5219\u76ee\u5f55\u4e0e\u6309\u540d\u79f0\u5173\u95ed\u5de5\u5177\uff0c\u63a8\u7406\u5f3a\u5ea6\u53ef\u5728\u8fdb\u884c\u4e2d\u7684\u56de\u5408\u91cc\u5207\u6362\uff0c\u5e76\u4fee\u590d\u5185\u7f6e\u6d4f\u89c8\u5668\u9875\u9762\u7f29\u653e\u3001\u7ec8\u7aef\u5361\u987f\u3001\u5b50\u4ee3\u7406\u8bc6\u56fe\u7b49\u4e00\u6279\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- `reasonix schedule add|list|tick` \u7b49\u547d\u4ee4\uff0c\u5728\u7ec8\u7aef\u786e\u8ba4\u540e\u6309\u65f6\u95f4\u53ea\u8bfb\u5730\u8fd0\u884c\u4efb\u52a1\uff1b\u9700\u7528\u7cfb\u7edf\u8ba1\u5212\u4efb\u52a1\u8c03\u7528 `schedule tick`\u3002\u5173\u8054 #11406\u3002\n- Studio \u6253\u5f00\u4e14\u53ef\u89c1\uff08\u7a97\u53e3\u6216\u6258\u76d8\u56fe\u6807\uff09\u65f6\uff0c\u4f1a\u6309\u8ba1\u5212\u81ea\u52a8\u8fd0\u884c\u5df2\u786e\u8ba4\u7684\u5b9a\u65f6\u4efb\u52a1\uff1b\u540c\u4e00\u65f6\u523b\u53ea\u6709\u4e00\u4e2a\u5185\u6838\u6267\u884c\u3002\u5173\u8054 #11406\u3002\n- \u4f1a\u8bdd\u83dc\u5355\u91cc\u53ef\u4ee5\u628a\u4f1a\u8bdd\u4e0a\u79fb\u6216\u4e0b\u79fb\uff0c\u4e5f\u53ef\u4ee5\u5728\u4f1a\u8bdd\u884c\u4e0a\u6309 Alt+\u4e0a\u4e0b\u952e\uff1b\u987a\u5e8f\u4fdd\u5b58\u5728\u5185\u6838\u91cc\uff0c\u91cd\u542f\u540e\u4e0d\u53d8\u3002\u5173\u8054 #11420\u3002\n- Linux \u589e\u52a0 `.AppImage` \u4e0b\u8f7d\uff08amd64 \u548c arm64\uff09\uff0c\u53ef\u76f4\u63a5\u8fd0\u884c\uff1b\u5b83\u4e0d\u4f1a\u81ea\u66f4\u65b0\uff0c\u65b0\u7248\u672c\u9700\u91cd\u65b0\u4e0b\u8f7d\u3002\u5173\u8054 #11653\u3002\n- \u6d4f\u89c8\u5668\u548c\u5de5\u4f5c\u53f0\u53ef\u4ee5\u5168\u5c4f\u67e5\u770b\uff0c\u4f1a\u8bdd\u4e0e\u8f93\u5165\u6846\u6682\u65f6\u6536\u8d77\uff0c\u6309 Esc \u6216\u518d\u70b9\u4e00\u6b21\u56de\u5230\u5206\u680f\uff1b\u6709\u4e8b\u7b49\u4f60\u51b3\u5b9a\u65f6\u81ea\u52a8\u9000\u51fa\u5168\u5c4f\u3002\u5173\u8054 #11721\u3002\n- \u767b\u5f55\u540c\u4e00\u8d26\u53f7\u7684\u624b\u673a\u53ef\u5728\u6709\u64cd\u4f5c\u5f85\u6279\u51c6\u3001\u6a21\u578b\u63d0\u95ee\u3001\u4e00\u8f6e\u51fa\u9519\u65f6\u6536\u5230\u63d0\u9192\uff0c\u901a\u77e5\u53ea\u542b\u7c7b\u522b\u548c\u6570\u91cf\u3002\u7535\u8111\u548c\u624b\u673a\u4e24\u8fb9\u9ed8\u8ba4\u90fd\u5173\uff0c\u9700\u5206\u522b\u5f00\u542f\u3002\u5173\u8054 #11878\u3002\n- MCP \u670d\u52a1\u5668\u56e0\u6388\u6743\u8303\u56f4\u4e0d\u591f\u62d2\u7edd\u8c03\u7528\u65f6\uff0c\u6a21\u578b\u4f1a\u505c\u4e0b\uff0c\u4f60\u53ef\u5728\u8be5\u670d\u52a1\u5668\u90a3\u884c\u70b9\u201c\u6388\u6743\u66f4\u591a\u6743\u9650\u201d\uff0c\u6bcf\u6b21\u90fd\u4f1a\u5148\u95ee\u4f60\u3002\u5173\u8054 #11959\u3002\n- \u5728\u201c\u6211\u7684\u53cd\u9988\u201d\u91cc\u53ef\u4ee5\u64a4\u56de\u81ea\u5df1\u7684\u53cd\u9988\uff08\u547d\u4ee4\u884c\u7528 /feedback withdraw\uff09\uff1b\u5df2\u767b\u8bb0\u7684\u8bae\u9898\u4f1a\u88ab\u5173\u95ed\uff0c\u5df2\u6709\u7ed3\u8bba\u7684\u53cd\u9988\u4e0d\u80fd\u64a4\u56de\u3002\u5173\u8054 #11995\u3002\n- \u53ef\u9009\u7684\u7b49\u7ea7\u63d0\u793a\uff08\u8bbe\u7f6e\u91cc\u201c\u7b49\u7ea7\u63d0\u5347\u65f6\u901a\u77e5\u6211\u201d\uff0c\u9ed8\u8ba4\u5173\uff09\uff1a\u53cd\u9988\u7b49\u7ea7\u63d0\u9ad8\u65f6\u5728\u7a97\u53e3\u9876\u90e8\u63d0\u793a\u4e00\u6b21\uff0c\u7ec8\u7aef /feedback list \u8bf4\u4e00\u884c\u3002\u5173\u8054 #12025\u3002\n- \u5728\u201c\u6211\u7684\u53cd\u9988\u201d\u7684\u5bf9\u8bdd\u91cc\uff0c\u4f60\u81ea\u5df1\u7684\u56de\u590d\u65c1\u4f1a\u663e\u793a\u4f60\u7684\u7b49\u7ea7\u5fbd\u7ae0\uff0c\u7ef4\u62a4\u8005\u7684\u56de\u590d\u65c1\u6ca1\u6709\u3002\u5173\u8054 #12025\u3002\n- \u5173\u8054\u8d26\u53f7\u7684\u7535\u8111\u4e0a\uff0c\u201c\u6211\u7684\u53cd\u9988\u201d\u4f1a\u5217\u51fa\u5176\u4ed6\u5df2\u5173\u8054\u8bbe\u5907\u7684\u53cd\u9988\u548c\u56de\u590d\uff1b\u7ec8\u7aef\u65b0\u589e /feedback link\u3001unlink\u3001links\u3002\u5173\u8054 #12073\u3002\n- \u8bbe\u7f6e \u2192 \u8fdc\u7a0b\u53ef\u4ee5\u6dfb\u52a0\u672c\u673a\u7684 WSL \u53d1\u884c\u7248\uff1a\u5185\u6838\u8fd0\u884c\u5728\u53d1\u884c\u7248\u91cc\uff0c\u754c\u9762\u4ecd\u5728 Windows\uff1b\u5173\u95ed Studio \u540e\u5185\u6838\u968f\u53d1\u884c\u7248\u505c\u6b62\uff0c\u5bf9\u8bdd\u4f1a\u4fdd\u7559\u3002\u5173\u8054 #12225\u3002\n- \u7ec8\u7aef\u754c\u9762\u7684 /mcp \u9762\u677f\u91cc\uff0c\u8fd4\u56de 401 \u7684\u670d\u52a1\u5668\u53ef\u6309 a \u767b\u5f55\uff0c\u8981\u6c42\u66f4\u591a\u6743\u9650\u7684\u670d\u52a1\u5668\u53ef\u6309 u \u6388\u6743\uff0c\u90fd\u4f1a\u5148\u95ee\u4f60\u3002\u5173\u8054 #12357\u3001#11959\u3002\n- ACP \u4f1a\u8bdd\u652f\u6301 `additionalDirectories`\uff0c\u591a\u6587\u4ef6\u5939\u5de5\u4f5c\u533a\u53ef\u8ba9\u4f1a\u8bdd\u5199\u5165\u989d\u5916\u6587\u4ef6\u5939\uff0c\u4ec5\u9650\u8be5\u4f1a\u8bdd\uff0c\u4e14\u7ecf\u8fc7\u4e0e\u624b\u52a8\u6388\u6743\u76f8\u540c\u7684\u68c0\u67e5\u3002\u5173\u8054 #13114\u3002\n- ACP \u652f\u6301 `$/cancel_request`\u3001\u6d88\u606f\u5757 `messageId`\u3001\u6743\u9650\u8bf7\u6c42\u5e26\u5de5\u5177\u540d\uff0c\u5e76\u6309\u5ba2\u6237\u7aef\u58f0\u660e\u8f6c\u4ea4 MCP \u7684\u8868\u5355\u4e0e\u5916\u90e8\u9875\u9762\u3002\u5173\u8054 #13114\u3002\n- \u53ef\u9009\u7684\u8ffd\u8e2a\u5bfc\u51fa\uff0c\u5728\u7528\u6237\u914d\u7f6e\u91cc\u5f00\u542f\u5e76\u586b\u5199\u6536\u96c6\u5668\u5730\u5740\u540e\uff0c\u6bcf\u8f6e\u5bf9\u8bdd\u4e