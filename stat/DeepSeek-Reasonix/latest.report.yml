a21\u62df\uff1bARM64 \u673a\u5668\u6309\u81ea\u5df1\u7684\u5e73\u53f0\u66f4\u65b0\uff0c\u589e\u91cf\u66f4\u65b0\u6682\u53ea\u5bf9 x64 \u63d0\u4f9b\uff0c\u4f1a\u4e0b\u8f7d\u5b8c\u6574\u5b89\u88c5\u5305 (#12272, #12286, #12270)\n- \u4efb\u52a1\u8fd0\u884c\u671f\u95f4\u8ba9\u7535\u8111\u4fdd\u6301\u5524\u9192\uff1a\u8bbe\u7f6e\u7684\u5916\u89c2\u9875\u300c\u7a97\u53e3\u300d\u65b0\u589e\u672c\u673a\u5f00\u5173\uff0c\u9ed8\u8ba4\u5f00\u542f\uff0c\u53ea\u963b\u6b62\u7cfb\u7edf\u7a7a\u95f2\u7761\u7720\uff0c\u5408\u4e0a\u76d6\u5b50\u7531\u7cfb\u7edf\u51b3\u5b9a\uff0c\u540e\u53f0\u4f5c\u4e1a\u4e0d\u8ba1\u5165 (#12283)\n- \u6211\u7684\u53cd\u9988\u663e\u793a\u5df2\u83b7\u5f97\u7684\u7b49\u7ea7\u3001\u5df2\u91c7\u7eb3\u6570\u3001\u8ddd\u4e0b\u4e00\u7ea7\u7684\u8fdb\u5ea6\u548c\u5f53\u524d\u9650\u989d\uff1b\u63d0\u4ea4\u6216\u56de\u590d\u88ab\u9650\u6d41\u65f6\u8bf4\u660e\u54ea\u4e2a\u65f6\u95f4\u7a97\u7528\u5b8c\u53ca\u4f55\u65f6\u91cd\u7f6e\uff0c`/feedback list` \u540c\u6837\u663e\u793a\u3002\u4ec5\u4f5c\u663e\u793a\uff0c\u76ee\u524d\u4e0d\u6539\u53d8\u4efb\u4f55\u9650\u989d (#12319)\n- \u5df2\u6536\u5230\u7684\u53cd\u9988\u88ab\u7ef4\u62a4\u8005\u5ba1\u9605\u65f6\uff0c\u53cd\u9988\u9762\u677f\u663e\u793a\u300c\u5ba1\u6838\u4e2d\u300d (#12260)\n- \u53cd\u9988\u5bf9\u8bdd\u6846\u65b0\u589e\u300c\u94fa\u6ee1\u7a97\u53e3\u300d\u6309\u94ae\uff0c\u8f83\u957f\u7684\u7ef4\u62a4\u8005\u56de\u590d\u4e0d\u518d\u6324\u5728\u7a84\u5217\u91cc (#12111 by @xxoingr, #11575 fixed in #12111 by @xxoingr)\n- \u6a21\u578b\u76ee\u5f55\u52a0\u5165 MiMo V2.6\uff08pro\u3001flash\u3001pro-ultraspeed\uff09\uff0c\u672a\u6539\u52a8\u8fc7\u7684 V2.5 \u9884\u8bbe\u81ea\u52a8\u8fc1\u5230 V2.6\uff1b\u5c0f\u7c73\u5c06\u4e8e 2026-10-21 \u505c\u7528 V2.5 (#12262)\n- \u8bbe\u7f6e\u7684\u5b50\u4ee3\u7406\u884c\u4f1a\u6307\u51fa\u54ea\u4e9b `subagent_models` \u6761\u76ee\u4f18\u5148\u4e8e\u5b83\uff0c\u5e76\u63d0\u4f9b\u300c\u6539\u56de\u8ddf\u968f\u8fd9\u91cc\u300d\u6309\u94ae\uff1b\u9879\u76ee\u7ea7\u6761\u76ee\u53ea\u63d0\u793a (#12306)\n\n## \u53d8\u66f4\n\n- \u4e0d\u518d\u4e3b\u52a8\u63a8\u9001\u4e0a\u4e0b\u6587\u5360\u7528\u8b66\u544a\uff1a\u5bf9\u8bdd\u91cc\u4e0d\u518d\u51fa\u73b0\u300c\u4e0a\u4e0b\u6587\u5df2\u8fbe\u538b\u7f29\u9608\u503c\u300d\u5361\u7247\uff0c\u6a21\u578b\u4ecd\u53ef\u7528 `context_budget` \u5de5\u5177\u6309\u9700\u67e5\u8be2 (#12248)\n- \u7ec8\u7aef\u754c\u9762 `reasonix tui` \u9996\u6b21\u4ea4\u4e92\u8fd0\u884c\u65f6\u8be2\u95ee\u4e00\u6b21\u662f\u5426\u5141\u8bb8\u533f\u540d\u4f7f\u7528\u7edf\u8ba1\uff1b\u5728 1.x \u91cc\u56de\u7b54\u8fc7\u7684\u4e0d\u518d\u8be2\u95ee\uff0c`DO_NOT_TRACK`\u3001CI \u548c\u5f00\u53d1\u7248\u4e0d\u8be2\u95ee\u4e5f\u4e0d\u4e0a\u62a5 (#12336)\n- Studio \u7684\u6bcf\u65e5\u533f\u540d\u5fc3\u8df3\u5931\u8d25\u540e\u4f1a\u9000\u907f\u91cd\u8bd5\uff0c\u5f00\u7740\u8de8\u8fc7 UTC \u5348\u591c\u4f1a\u518d\u53d1\u4e00\u6b21\uff1b\u5728\u8bbe\u7f6e\u91cc\u5173\u95ed\u9065\u6d4b\u540e\u65e0\u9700\u91cd\u542f\u5373\u505c\u6b62\u53d1\u9001 (#12333)\n- \u62e6\u622a\u7c7b\u4e8b\u4ef6\u4e0a\u7684\u94a9\u5b50\u65e0\u6cd5\u6267\u884c\uff08\u5339\u914d\u6b63\u5219\u65e0\u6548\u3001\u8fdb\u7a0b\u542f\u52a8\u5931\u8d25\u3001\u8f7d\u8377\u65e0\u6cd5\u5e8f\u5217\u5316\uff09\u65f6\uff0c\u73b0\u5728\u963b\u6b62\u8be5\u64cd\u4f5c\uff0c\u4e0d\u518d\u5f53\u4f5c\u6ca1\u6709\u94a9\u5b50\u800c\u653e\u884c (#12261)\n- \u589e\u91cf\u66f4\u65b0\u8981\u4e0b\u8f7d\u7684\u5185\u5bb9\u8d85\u8fc7\u5b8c\u6574\u5305\u4e00\u534a\u65f6\uff0c\u76f4\u63a5\u4e0b\u8f7d\u5b8c\u6574\u5305\uff0c\u4e0d\u518d\u5148\u62c9\u5206\u5757\u518d\u5931\u8d25\u91cd\u6765 (#12247)\n- \u4f1a\u8bdd\u5728\u7b49\u5f85\u63d0\u95ee\u6216\u5ba1\u6279\u56de\u7b54\u671f\u95f4\u91ca\u653e\u5de5\u4f5c\u533a\u5199\u5165\u5360\u7528\uff0c\u5176\u4ed6\u4f1a\u8bdd\u53ef\u4ee5\u5199\u8fd9\u671f\u95f4\u6ca1\u4eba\u5728\u5199\u7684\u8def\u5f84 (#12298)\n- \u8bfb\u53d6\u670d\u52a1\u5546\u6a21\u578b\u5217\u8868\u7684\u5165\u53e3\u632a\u5230\u6dfb\u52a0\u6a21\u578b\u8f93\u5165\u6846\u65c1\uff0c\u6807\u7b7e\u548c\u63d0\u793a\u66f4\u660e\u786e (#12279)\n- \u72b6\u6001\u680f\u7684\u5b50\u4ee3\u7406\u6570\u53ea\u7edf\u8ba1\u6b63\u5728\u8fd0\u884c\u7684\uff0c\u4e0e\u540e\u53f0\u4efb\u52a1\u6570\u542b\u4e49\u4e00\u81f4 (#12282)\n- \u8fd0\u884c\u4e2d\u72b6\u6001\u6539\u4e3a\u9192\u76ee\u7684\u5b9e\u5fc3\u5fbd\u6807\uff0c\u7b49\u5f85\u4e0e\u7a7a\u95f2\u4fdd\u6301\u539f\u6837 (#12066 by @par73e, #12044 fixed in #12066 by @par73e)\n- \u6d45\u8272\u4e3b\u9898\u4e0b\u8b66\u544a\u3001\u6210\u529f\u3001\u9519\u8bef\u8272\u7684\u6587\u5b57\u6539\u7528\u5bf9\u6bd4\u5ea6\u8fbe\u6807\u7684\u6587\u5b57\u8272 (#12274)\n- \u5728 Windows \u4e0a\uff0c\u4f4d\u4e8e\u914d\u7f6e\u5de5\u4f5c\u533a\u4e4b\u5916\u7684\u7f51\u7edc\u5171\u4eab\u8def\u5f84\uff08`\\\\host\\share`\uff09\uff0c\u6587\u4ef6\u5de5\u5177\u3001\u5185\u7f6e\u6d4f\u89c8\u5668\u548c\u5b89\u88c5\u6765\u6e90\u9884\u89c8\u4f1a\u5728\u67e5\u627e\u4e4b\u524d\u76f4\u63a5\u62d2\u7edd\uff0c\u62d2\u7edd\u63d0\u793a\u5199\u660e\u539f\u56e0 (f551c4bb6, 389cc40be)\n- \u5185\u7f6e\u6d4f\u89c8\u5668\u5bf9\u8fd9\u7c7b\u7f51\u7edc\u5171\u4eab\u8def\u5f84\u7684\u62d2\u7edd\u4ee3\u7801\u7531 `browser.url_refused` \u6539\u4e3a `browser.network_path` (389cc40be)\n- \u5728 Windows \u4e0a\uff0c\u547d\u4ee4\u884c\u91cc\u628a\u7f51\u7edc\u5171\u4eab\u8def\u5f84\u5f53\u64cd\u4f5c\u6570\u7684\u547d\u4ee4\u73b0\u5728\u4f1a\u8bf7\u6c42\u6279\u51c6\uff0c\u4e0d\u518d\u5f53\u4f5c\u53ea\u8bfb\u76f4\u63a5\u8fd0\u884c\uff1b\u5df2\u8bb0\u4f4f\u7684\u524d\u7f00\u653e\u884c\u89c4\u5219\u4e0d\u518d\u8986\u76d6\u8fd9\u7c7b\u64cd\u4f5c\u6570 (040f77bde)\n\n## \u4fee\u590d\n\n- \u538b\u7f29\u65f6\u6458\u8981\u6a21\u578b\u56de\u7684\u4e0d\u662f\u6458\u8981\uff08\u7167\u5e38\u8c03\u7528\u5de5\u5177\u6216\u7ee7\u7eed\u5e72\u6d3b\uff09\u65f6\uff0c\u4e0d\u518d\u88ab\u5f53\u4f5c\u6458\u8981\u88c5\u5165\uff0c\u8be5\u6b21\u538b\u7f29\u6309\u5931\u8d25\u5904\u7406\uff1b\u8fd9\u53ea\u4fee\u4e86\u4e24\u4e2a\u5df2\u67e5\u5b9e\u7684\u7f3a\u9677\uff0c\u538b\u7f29\u7684\u5176\u4f59\u95ee\u9898\u4ecd\u5728 #12309 \u8ddf\u8e2a (#12322, #12308)\n- \u4e00\u4e2a\u5931\u8d25\u7684\u8c03\u7528\u4e0d\u518d\u628a\u540c\u4e00\u6279\u5e76\u884c\u8c03\u7528\u7684\u5168\u90e8\u7ed3\u679c\u90fd\u7559\u5728\u538b\u7f29\u540e\u7684\u4e0a\u4e0b\u6587\u91cc\uff0c\u538b\u7f29\u56e0\u6b64\u80fd\u7f29\u5230\u9650\u989d\u5185\uff1b\u5176\u4f59\u7ed3\u679c\u7167\u5e38\u6298\u53e0 (#12317)\n- \u5728\u5185\u7f6e\u6d4f\u89c8\u5668\u91cc\u70b9\u94fe\u63a5\u65f6\uff0c\u65b0\u9875\u9762\u4e0d\u518d\u88ab\u5207\u56de\u4ee3\u7406\u7684\u6807\u7b7e\uff0c\u4e5f\u4e0d\u518d\u591a\u51fa\u4e00\u4e2a\u7a7a\u767d\u6807\u7b7e (#12249, #12285)\n- \u5728\u5185\u7f6e\u6d4f\u89c8\u5668\u5730\u5740\u680f\u8f93\u5165\u78c1\u76d8\u8def\u5f84\uff08\u5982 `D:/x.html`\uff09\u65f6\u6309\u6587\u4ef6\u6253\u5f00\uff0c\u4e0d\u518d\u5f53\u6210\u4ee5\u76d8\u7b26\u4e3a\u4e3b\u673a\u540d\u7684\u7f51\u5740 (#12326, #12321 fixed in #12326)\n- \u505c\u6b62\u6216\u51b3\u5b9a\u8fdf\u8fdf\u6ca1\u6709\u786e\u8ba4\u65f6\uff0c\u63d0\u793a\u4f1a\u533a\u5206\u5185\u6838\u5fd9\u3001\u5185\u6838\u8fde\u4e0d\u4e0a\u548c\u672c\u7a97\u53e3\u81ea\u5df1\u5361\u4f4f\uff0c\u505c\u6b62\u5728\u5185\u6838\u62a5\u544a\u7a7a\u95f2\u540e\u5373\u7ed3\u675f (#12294)\n- \u72b6\u6001\u680f\u4f59\u989d\u968f\u6a21\u578b\u6765\u6e90\u5207\u6362\u7acb\u5373\u5237\u65b0\uff0c\u4e0d\u518d\u663e\u793a\u4e0a\u4e00\u4e2a\u6765\u6e90\u7684\u4f59\u989d (#12271)\n- \u6682\u505c\u961f\u5217\u91cc\u300c\u5f15\u5bfc\u6d88\u606f\u672a\u88ab\u8bfb\u5230\u300d\u7684\u5f85\u53d1\u6761\u76ee\u73b0\u5728\u6709\u300c\u91cd\u8bd5\u300d\u6309\u94ae\uff0c\u4e0d\u5fc5\u64a4\u56de\u91cd\u53d1 (#12275)\n- \u5728\u8fdc\u7a0b\u7a97\u683c\u91cc\u8bbe\u7f6e\u9ed8\u8ba4\u6a21\u578b\uff0c\u73b0\u5728\u8bb0\u5f55\u5728\u6a21\u578b\u6240\u5c5e\u7684\u90a3\u53f0\u673a\u5668\u4e0a\uff0c\u5e76\u5728\u5931\u8d25\u65f6\u8bf4\u660e\u539f\u56e0\uff0c\u4e0d\u518d\u9759\u9ed8\u65e0\u6548 (#12301)\n- \u5b50\u4ee3\u7406\u7ee7\u627f\u7684\u63a8\u7406\u5f3a\u5ea6\u630