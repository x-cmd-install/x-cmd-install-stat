a7a3d/docs/WINDOWS_AGENT_SHELL.md) \u2014 \u4e86\u89e3\u6301\u4e45 PowerShell \u5982\u4f55\u5728 Windows \u4e0a\u4fdd\u7559\u72b6\u6001\u5e76\u62a5\u544a\u547d\u4ee4\u5b8c\u6210\u60c5\u51b5\u3002\n- [**Windows \u5b89\u88c5\u7a0b\u5e8f\u9a8c\u6536**](https://github.com/esengine/DeepSeek-Reasonix/blob/26f1984e97d8f4403317d6d00dd27c77395a7a3d/docs/WINDOWS_INSTALLER_ACCEPTANCE.md) \u2014 Windows \u5b89\u88c5\u7a0b\u5e8f\u6784\u5efa\u7684\u9a8c\u6536\u6807\u51c6\u3002\n\n## \u6982\u89c8\n\n**Reasonix v1.38.10 \u2014 Reasonix 1.38.10**\n\n\u6b64\u7248\u672c\u91cd\u70b9\u63d0\u5347\u4f1a\u8bdd\u53ef\u9760\u6027\u3001Windows \u5347\u7ea7\u4e0e Agent \u6267\u884c\u3001\u6587\u4ef6\u8def\u5f84\u5904\u7406\u548c\u5bf9\u8bdd\u8bb0\u5f55\u7a33\u5b9a\u6027\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-17\n\n**Desktop 36 \u00b7 CLI 2**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u66f4\u53ef\u9760\u7684\u4f1a\u8bdd\u7ba1\u7406** \u2014 \u4f1a\u8bdd\u73b0\u5728\u5728\u91cd\u542f\u540e\u4fdd\u6301\u8eab\u4efd\u548c\u5386\u53f2\u8bb0\u5f55\uff0c\u5f52\u6863\u548c\u56de\u6536\u7ad9\u5904\u7406\u5f97\u5230\u6539\u8fdb\u3002 ([#10440](https://github.com/esengine/DeepSeek-Reasonix/pull/10440), [#10396](https://github.com/esengine/DeepSeek-Reasonix/pull/10396), [#10437](https://github.com/esengine/DeepSeek-Reasonix/pull/10437))\n- **[Desktop]** **\u66f4\u5feb\u7684\u672c\u5730\u5386\u53f2\u52a0\u8f7d** \u2014 \u5207\u6362\u6807\u7b7e\u9875\u65f6\uff0c\u672c\u5730\u4f1a\u8bdd\u5386\u53f2\u7acb\u5373\u663e\u793a\uff0c\u65e0\u9700\u7b49\u5f85\u8fd0\u884c\u65f6\u542f\u52a8\u3002 ([#10414](https://github.com/esengine/DeepSeek-Reasonix/pull/10414), [#10423](https://github.com/esengine/DeepSeek-Reasonix/pull/10423))\n- **[Desktop \u00b7 CLI]** **Windows \u8def\u5f84\u548c\u5347\u7ea7\u4fee\u590d** \u2014 \u4fee\u590d\u4e86 Windows \u6587\u4ef6 URI\u3001CLI \u8bca\u65ad\u3001\u65e7\u4f1a\u8bdd\u5347\u7ea7\u548c\u5b89\u88c5\u7a0b\u5e8f\u8eab\u4efd\u95ee\u9898\u3002 ([#10459](https://github.com/esengine/DeepSeek-Reasonix/pull/10459), [#10451](https://github.com/esengine/DeepSeek-Reasonix/pull/10451))\n- **[Desktop]** **\u53ef\u5c55\u5f00\u4f1a\u8bdd\u4e0e\u5de5\u4f5c\u533a\u4e0a\u4e0b\u6587** \u2014 \u4fa7\u680f\u73b0\u5728\u6bcf\u4e2a\u9879\u76ee\u6216\u5206\u7ec4\u663e\u793a 5 \u4e2a\u4f1a\u8bdd\uff0c\u53ef\u5206\u6279\u5c55\u5f00\uff0c\u65b0\u4f1a\u8bdd\u652f\u6301\u9879\u76ee\u548c\u5206\u652f\u4e0a\u4e0b\u6587\u3002 ([#10426](https://github.com/esengine/DeepSeek-Reasonix/pull/10426))\n- **[Desktop]** **\u91cd\u542f\u540e\u4fdd\u7559\u538b\u7f29\u4e0a\u4e0b\u6587** \u2014 \u538b\u7f29\u540e\u7684\u6a21\u578b\u4e0a\u4e0b\u6587\u73b0\u5728\u5728\u5207\u6362\u4f1a\u8bdd\u3001\u91cd\u542f\u548c\u5bfc\u5165\u65e7\u4f1a\u8bdd\u540e\u4ecd\u7136\u4fdd\u7559\u3002 ([#10430](https://github.com/esengine/DeepSeek-Reasonix/pull/10430))\n- **[Desktop]** **\u4fee\u590d\u7528\u6237\u6d88\u606f\u5386\u53f2\u5206\u9875** \u2014 \u53d1\u9001\u7684\u6d88\u606f\u5728\u5386\u53f2\u9875\u9762\u56de\u6536\u6216\u786e\u8ba4\u8d85\u51fa\u53ef\u89c1\u7a97\u53e3\u65f6\u4e0d\u518d\u91cd\u590d\u6216\u6d88\u5931\u3002 ([#10438](https://github.com/esengine/DeepSeek-Reasonix/pull/10438))\n\n### \u65b0\u589e\n\n- **[Desktop]** **\u7edf\u4e00\u6a21\u578b\u51ed\u636e\u6062\u590d** \u2014 \u684c\u9762\u7aef\u4e0e CLI \u73b0\u5728\u5171\u4eab\u51ed\u636e\u69fd\u3001\u56de\u6267\u548c\u6062\u590d\u670d\u52a1\uff0c\u9632\u6b62\u7f3a\u5931\u51ed\u636e\u8fdb\u5165\u65b0\u5bf9\u8bdd\u8f6e\u6b21\u3002 ([#10460](https://github.com/esengine/DeepSeek-Reasonix/pull/10460))\n- **[Desktop]** **\u7edf\u4e00 Windows \u684c\u9762\u542f\u52a8\u5165\u53e3** \u2014 Reasonix.exe \u73b0\u5728\u662f Windows \u7684\u89c4\u8303 GUI \u5165\u53e3\uff0c\u540c\u65f6\u4fdd\u7559\u65e7\u542f\u52a8\u5668\u7684\u517c\u5bb9\u6027\u3002 ([#10439](https://github.com/esengine/DeepSeek-Reasonix/pull/10439))\n- **[Desktop]** **\u540e\u53f0\u5bf9\u8bdd\u901a\u77e5** \u2014 \u540e\u53f0\u5bf9\u8bdd\u73b0\u5728\u65e0\u9700\u5207\u6362\u6807\u7b7e\u9875\u5373\u53ef\u64ad\u653e\u63d0\u793a\u97f3\u5e76\u663e\u793a\u901a\u77e5\u3002 ([#10382](https://github.com/esengine/DeepSeek-Reasonix/pull/10382))\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u9879\u76ee\u6811\u5c55\u5f00\u4e0e\u7f13\u5b58\u903b\u8f91** \u2014 \u9879\u76ee\u6811\u73b0\u5728\u4f7f\u7528\u4e94\u884c\u521d\u59cb\u7a97\u53e3\u548c\u4e94\u884c\u589e\u91cf\uff0c\u7f13\u5b58\u5931\u6548\u4e0e\u53ef\u89c1\u6027\u5206\u79bb\u3002 ([#10447](https://github.com/esengine/DeepSeek-Reasonix/pull/10447))\n- **[Desktop]** **\u9ed8\u8ba4\u6309\u521b\u5efa\u65f6\u95f4\u6392\u5e8f** \u2014 \u6b64\u7248\u672c\u9996\u6b21\u542f\u52a8\u65f6\uff0c\u73b0\u6709\u5de5\u4f5c\u53f0\u6392\u5e8f\u504f\u597d\u4e00\u6b21\u6027\u91cd\u7f6e\u4e3a\u521b\u5efa\u65f6\u95f4\u3002 ([#10444](https://github.com/esengine/DeepSeek-Reasonix/pull/10444))\n- **[Desktop]** **\u62e6\u622a Windows \u4fbf\u643a\u7248\u5171\u4eab\u76ee\u5f55\u542f\u52a8** \u2014 \u73b0\u5728\u5728 Electron \u542f\u52a8\u524d\u62d2\u7edd\u4ece UNC \u548c\u6620\u5c04\u8fdc\u7a0b\u9a71\u52a8\u5668\u542f\u52a8 Windows \u4fbf\u643a\u7248\u3002 ([#10442](https://github.com/esengine/DeepSeek-Reasonix/pull/10442))\n- **[Desktop]** **\u4fee\u590d\u76ee\u5f55\u8fc1\u79fb\u7684\u672a\u8bfb\u57fa\u7ebf** \u2014 \u8fc1\u79fb\u7684\u5386\u53f2\u8bb0\u5f55\u4e0d\u518d\u56e0\u5360\u4f4d\u8bfb\u53d6\u57fa\u7ebf\u800c\u663e\u793a\u84dd\u8272\u672a\u8bfb\u70b9\u3002 ([#10428](https://github.com/esengine/DeepSeek-Reasonix/pull/10428))\n- **[Desktop]** **\u4fee\u590d\u89c4\u8303\u4f1a\u8bdd\u672a\u8bfb\u72b6\u6001** \u2014 \u672a\u8bfb\u72b6\u6001\u73b0\u5728\u53ea\u8ddf\u8e2a\u53ef\u89c1\u7684\u7ec8\u7aef\u52a9\u624b\u7ed3\u679c\uff0c\u800c\u4e0d\u662f\u5143\u6570\u636e\u66f4\u6539\u3002 ([#10424](https://github.com/esengine/DeepSeek-Reasonix/pull/10424))\n- **[Desktop]** **\u672c\u5730\u4f1a\u8bdd\u6301\u4e45\u5316\u64cd\u4f5c\u4e0e\u8fd0\u884c\u65f6\u89e3\u8026** \u2014 \u4f1a\u8bdd\u64cd\u4f5c\u73b0\u5728\u901a\u8fc7\u663e\u5f0f SessionRef \u89e3\u6790\uff0c\u6539\u8fdb\u4e86\u6807\u9898 CAS \u548c\u751f\u547d\u5468\u671f\u9632\u62a4\u3002 ([#10409](https://github.com/esengine/DeepSeek-Reasonix/pull/10409))\n- **[Desktop]** **\u81ea\u52a8\u4fee\u590d\u5b98\u65b9\u4f9b\u5e94\u5546\u534f\u8bae\u4e0e\u7aef\u70b9\u51b2\u7a81** \u2014 \u5f53 URL \u552f\u4e00\u5339\u914d\u76ee\u5f55\u8def\u7531\u65f6\uff0c\u73b0\u5728\u4f1a\u81ea\u52a8\u4fee\u590d\u51b2\u7a81\u7684\u5b98\u65b9\u4f9b\u5e94\u5546\u534f\u8bae/\u7aef\u70b9\u8bbe\u7f6e\u3002 ([#10411](https://github.com/esengine/DeepSeek-Reasonix/pull/10411))\n- **[Desktop]** **\u6309\u6b63\u5f0f\u6784\u5efa\u8eab\u4efd\u9650\u5236\u684c\u9762\u66f4\u65b0\u5668** \u2014 \u66f4\u65b0\u5668\u73b0\u5728\u5728 canary\u3001preview\u3001test\u3001dev \u548c prerelease \u6784\u5efa\u4e2d\u7981\u7528\uff0c\u81ea\u52a8\u68c0\u67e5\u9650\u5236\u4e3a\u6bcf\u516d\u5c0f\u65f6\u4e00\u6b21\u3002 ([#10406](https://github.com/esengine/DeepSeek-Reasonix/pull/10406))\n- **[Desktop]** **\u7edf\u4e00\u4f1a\u8bdd\u5f52\u6863\u3001\u56de\u6536\u7ad9\u4e0e\u5386\u53f2\u6062\u590d** \u2014 \u5f52\u6863\u4f1a\u8bdd\u73b0\u5728\u4f7f\u7528\u4e00\u4e2a\u6301\u4e45\u751f\u547d\u5468\u671f\uff1a\u6b63\u5e38\u4f1a\u8bdd \u2192 \u56de\u6536\u7ad9 \u2192 \u6062\u590d\u6216\u6c38\u4e45\u5220\u9664\u3002 ([#10396](https://github.com/esengine/DeepSeek-Reasonix/pull/10396))\n- **[Desktop]** **\u5b8c\u5584\u65e7\u7248\u5bf9\u8bdd\u8fc1\u79fb\u5e76\u6392\u9664\u91cd\u590d\u6062\u590d\u526f\u672c** \u2014 \u684c\u9762\u5347\u7ea7\u73b0\u5728\u8de8\u4ee3\u53d1\u73b0\u5e76\u6574\u5408\u65e7\u7248\u5386\u53f2\uff0c\u4e0d\u91cd\u590d\u6062\u590d\u526f\u672c\u3002 ([#10395](https://github.com/esengine/DeepSeek-Reasonix/pull/10395))\n- **[Desktop]** **\u4fee\u590d\u6d88\u606f\u8eab\u4efd\u3001\u5de5\u5177\u72b6\u6001\u4e0e\u6301\u4e45 PowerShell** \u2014 \u5355\u6b21\u53d1\u9001\u4e0d\u518d\u6e32\u67d3\u4e24\u6b21\uff0cWindows Agent \u6267\u884c\u4f7f\u7528\u5e26\u7ed3\u6784\u5316\u5b8c\u6210\u7684\u6301\u4e45 PowerShell\u3002 ([#10392](https://github.com/esengine/DeepSeek-Reasonix/pull/10392))\n- **[Desktop]** **\u5c06\u547d\u4ee4\u9762\u677f\u641c\u7d22\u79fb\u81f3\u4fa7\u680f\u5e95\u90e8** \u2014 \u547d\u4ee4\u9762\u677f\u641c\u7d22\u64cd\u4f5c\u4ece\u4e3b\u9898\u680f\u79fb\u81f3\u4fa7\u680f\u5e95\u90e8\u7684\u7b2c\u4e00\u4e2a\u63d2\u69fd\u3002 ([#10390](https://github.com/esengine/DeepSeek-Reasonix/pull/10390))\n- **[Desktop]** **\u5173\u95ed\u6700\u540e\u4e00\u4e2a\u6807\u7b7e\u9875\u540e\u81ea\u52a8\u6536\u8d77\u5de5\u4f5c\u533a** \u2014 \u5173\u95ed\u6700\u540e\u4e00\u4e2a\u5de5\u4f5c\u533a\u6807\u7b7e\u9875\u73b0\u5728\u4f1a\u6536\u8d77\u6574\u4e2a\u53f3\u4fa7\u505c\u9760\u680f\uff0c\u5e76\u5c06\u5176\u7a7a\u95f4\u8fd4\u56de\u7ed9\u5bf9\u8bdd\u3002 ([#10388](https://github.com/esengine/DeepSeek-Reasonix/pull/10388))\n- **[Desktop]** **\u4fee\u590d\u8fc1\u79fb\u540e\u4f1a\u8bdd AI \u91cd\u547d\u540d\u5931\u8d25** \u2014 AI \u91cd\u547d\u540d\u73b0\u5728\u4ece\u89c4\u8303\u6301\u4e45\u5386\u53f2\u4e2d\u8bfb\u53d6\u7528\u6237\u6d88\u606f\uff0c\u4fee\u590d\u4e86\u8fc1\u79fb\u5bf9\u8bdd\u7684\u91cd\u547d\u540d\u5931\u8d25\u3002 ([#10389](https://github.com/esengine/DeepSeek-Reasonix/pull/10389))\n- **[Desktop]** **\u7edf\u4e00\u4f1a\u8bdd\u540c\u6b65\u4e0e\u5b8c\u6210\u673a\u5236** \u2014 \u5df2\u5b8c\u6210\u3001\u53d6\u6d88\u6216\u91cd\u65b0\u8fde\u63a5\u7684\u804a\u5929\u4e0d\u518d\u4e22\u5931\u53ef\u89c1\u6587\u672c\u6216\u663e\u793a\u8fc7\u65f6\u7684\u8fd0\u884c\u72b6\u6001\u3002 ([#10385](https://github.com/esengine/DeepSeek-Reasonix/pull/10385))\n- **[Desktop]** **\u6682\u505c\u4e0e\u6062\u590d\u6539\u4e3a\u8ffd\u52a0\u5f0f\u7ec8\u7ed3** \u2014 \u505c\u6b62\u4e00\u4e2a\u8f6e\u6b21\u5e76\u6253\u5f00\u53e6\u4e00\u4e2a\u5bf9\u8bdd\u4e0d\u518d\u5bfc\u81f4\u6301\u4e45\u5386\u53f2\u4e0d\u53ef\u8bfb\u3002 ([#10383](https://github.com/esengine/DeepSeek-Reasonix/pull/10383))\n- **[Desktop]** **\u6062\u590d\u9879\u76ee\u6811\u5e76\u6574\u5408\u4f1a\u8bdd\u6062\u590d\u4fee\u590d** \u2014 \u6062\u590d\u4e86 ProjectTree \u5de5\u4f5c\u53f0\u4fa7\u680f\uff0c\u5e76\u6574\u5408\u4e86\u4f1a\u8bdd\u3001\u5386\u53f2\u3001\u804a\u5929\u663e\u793a\u548c\u7ec8\u7aef\u4fee\u590d\u3002 ([#10380](https://github.com/esengine/DeepSeek-Reasonix/pull/10380))\n- **[Desktop]** **\u5347\u7ea7 Desktop SessionID \u4f1a\u8bdd\u67b6\u6784** \u2014 \u684c\u9762\u89c4\u8303\u4f1a\u8bdd\u73b0\u5728\u4ec5\u6309 SessionID \u6301\u4e45\u5316\uff0c\u9632\u6b62\u5207\u6362\u6216\u91cd\u542f\u540e\u6d88\u5931\u3002 ([#10326](https://github.com/esengine/DeepSeek-Reasonix/pull/10326))\n\n### \u4fee\u590d\n\n- **[Desktop]** **\u4fdd\u6301\u8fc1\u79fb\u4f1a\u8bdd\u7684\u8eab\u4efd\u5e76\u6e05\u9664\u6062\u590d\u540e\u7684\u9519\u8bef\u63d0\u793a** \u2014 \u542f\u52a8\u548c\u7ee7\u7eed\u8bfb\u53d6\u5386\u53f2\u65f6\u590d\u7528\u5df2\u8fc1\u79fb\u7684\u4f1a\u8bdd\u8eab\u4efd\uff0c\u907f\u514d\u5143\u6570\u636e\u5237\u65b0\u540e\u91cd\u590d\u5bfc\u5165\u3002\u5386\u53f2\u6062\u590d\u6210\u529f\u540e\u6e05\u9664\u9519\u8bef\u72b6\u6001\uff0c\u4e0d\u518d\u6b8b\u7559\u9519\u8bef\u7684\u804a\u5929\u8b66\u544a\u3002 ([#10472](https://github.com/esengine/DeepSeek-Reasonix/pull/10472))\n- **[Desktop]** **\u7a33\u5b9a Windows \u53d1\u7248\u9a8c\u8bc1** \u2014 \u4fee\u590d\u4e86 Windows \u9a8c\u8bc1\u7f3a\u9677\uff0c\u5305\u62ec\u5728 Windows \u4e0a\u8fd0\u884c\u4ec5\u9650 POSIX \u7684\u6d4b\u8bd5\u548c shell \u63a2\u6d4b\u7f13\u5b58\u6c61\u67d3\u3002 ([#10468](https://github.com/esengine/DeepSeek-Reasonix/pull/10468))\n- **[Desktop \u00b7 CLI]** **\u7edf\u4e00 PowerShell \u51b7\u542f\u52a8\u63e1\u624b\u9884\u7b97** \u2014 PowerShell \u73b0\u5728\u4ece\u8fdb\u7a0b\u542f\u52a8\u5230\u8fde\u63a5\u63a5\u53d7\u548c\u5c31\u7eea\u5e27\u63a5\u6536\u6709 30 \u79d2\u9884\u7b97\u3002 ([#10464](https://github.com/esengine/DeepSeek-Reasonix/pull/10464))\n- **[Desktop]** **\u4fee\u590d\u91cd\u5f00\u4f1a\u8bdd\u7684\u5386\u53f2\u7f13\u5b58\u590d\u7528** \u2014 \u89c4\u8303\u5386\u53f2\u7a97\u53e3\u73b0\u5728\u5728\u540c\u4e00\u4f1a\u8bdd\u4ee5\u65b0\u6807\u7b7e ID \u91cd\u65b0\u6253\u5f00\u65f6\u590d\u7528\u70ed\u9a7b\u7559\u3002 ([#10423](https://github.com/esengine/DeepSeek-Reasonix/pull/10423))\n- **[Desktop]** **\u4e32\u884c\u5316\u56de\u6536\u7ad9\u6062\u590d\u4e0e\u6c38\u4e45\u5220\u9664** \u2014 \u56de\u6536\u7ad9\u5220\u9664\u73b0\u5728\u5728\u5237\u65b0\u3001\u9501\u7b49\u5f85\u3001\u91cd\u8bd5\u548c\u91cd\u542f\u671f\u95f4\u4fdd\u7559\u7528\u6237\u7684\u539f\u59cb\u786e\u8ba4\u5feb\u7167\u3002 ([#10437](https://github.com/esengine/DeepSeek-Reasonix/pull/10437))\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **Windows \u8def\u5f84\u548c\u5347\u7ea7\u4fee\u590d** \u2014 \u4fee\u590d\u4e86 Windows \u6587\u4ef6 URI\u3001CLI \u8bca\u65ad\u3001\u65e7\u4f1a\u8bdd\u5347\u7ea7\u548c\u5b89\u88c5\u7a0b\u5e8f\u8eab\u4efd\u95ee\u9898\u3002 ([#10459](https://github.com/esengine/DeepSeek-Reasonix/pull/10459), [#10451](https://github.com/esengine/DeepSeek-Reasonix/pull/10451))\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **\u7edf\u4e00 PowerShell \u51b7\u542f\u52a8\u63e1\u624b\u9884\u7b97** \u2014 PowerShell \u73b0\u5728\u4ece\u8fdb\u7a0b\u542f\u52a8\u5230\u8fde\u63a5\u63a5\u53d7\u548c\u5c31\u7eea\u5e27\u63a5\u6536\u6709 30 \u79d2\u9884\u7b97\u3002 ([#10464](https://github.com/esengine/DeepSeek-Reasonix/pull/10464))\n\n## \u5347\u7ea7\u63d0\u9192\n\n- **[Desktop]** **\u4f1a\u8bdd\u6ce8\u518c\u8868\u5347\u7ea7** \u2014 \u9996\u6b21\u542f\u52a8\u65f6\uff0c\u73b0\u6709\u4f1a\u8bdd\u5c06\u8fc1\u79fb\u5230\u65b0\u7684\u6ce8\u518c\u8868\u683c\u5f0f\u3002\u65e7\u5ba2\u6237\u7aef\u65e0\u6cd5\u7f16\u8f91\u5347\u7ea7\u540e\u7684 v3 \u6ce8\u518c\u8868\u3002 ([#10440](https://github.com/esengine/DeepSeek-Reasonix/pull/10440))\n- **[Desktop]** **Windows \u5b89\u88c5\u7a0b\u5e8f\u8eab\u4efd** \u2014 \u5b89\u88c5\u7684\u6d4b\u8bd5\u6784\u5efa\u6709\u610f\u66ff\u6362\u540c\u4e00\u4ea7\u54c1\u5e76\u5171\u4eab\u6570\u636e\uff1b\u4fbf\u643a\u6784\u5efa\u4fdd\u6301\u7a0b\u5e8f\u6587\u4ef6\u72ec\u7acb\u3002 ([#10451](https://github.com/esengine/DeepSeek-Reasonix/pull/10451))\n- **[Desktop]** **\u66f4\u65b0\u5668\u9650\u5236** \u2014 \u975e\u7a33\u5b9a\u6784\u5efa\u4e2d\u66f4\u65b0\u5668\u5df2\u7981\u7528\u3002\u7a33\u5b9a\u66f4\u65b0\u4fdd\u6301\u663e\u5f0f\uff1a\u68c0\u67e5\u4ec5\u8bfb\u53d6\u5143\u6570\u636e\uff0c\u4e0b\u8f7d/\u5b89\u88c5\u9700\u7528\u6237\u64cd\u4f5c\u540e\u5f00\u59cb\u3002 ([#10406](https://github.com/esengine/DeepSeek-Reasonix/pull/10406))\n- **[Desktop]** **\u964d\u7ea7\u9700\u8981\u65b0\u8bfb\u53d6\u5668** \u2014 \u6682\u505c/\u6062\u590d\u66f4\u6539\u540e\uff0c\u964d\u7ea7\u9700\u8981\u4fdd\u7559\u65b0\u8bfb\u53d6\u5668\u6216\u6062\u590d\u5b8c\u6574\u7684\u5347\u7ea7\u524d\u5907\u4efd\u3002 ([#10383](https://github.com/esengine/DeepSeek-Reasonix/pull/10383))\n\n## \u98ce\u9669\u63d0\u793a\n\n\u5f53\u524d\u6ca1\u6709\u9700\u8981\u989d\u5916\u64cd\u4f5c\u7684\u5df2\u77e5\u98ce\u9669\u3002\n\n## \u81f4\u8c22\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a[@SivanCola](https://github.com/SivanCola)\u3001[@github-actions[bot]](https://github.com/github-actions[bot])\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.38.9...desktop-v1.38.10)\n"}
