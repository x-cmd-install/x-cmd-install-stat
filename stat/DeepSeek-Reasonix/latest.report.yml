18d\u91cd\u8bd5\u5341\u6b21\u3002\u5982\u679c\u4f60\u7684\u4e2d\u8f6c\u7ad9\u4f1a\u91cd\u5b9a\u5411\uff0c\u628a base URL \u6539\u6210\u5b83\u91cd\u5b9a\u5411\u5230\u7684\u5730\u5740\u5373\u53ef (#12570)\n- \u6bcf\u5929\u7684\u7b2c\u4e00\u4e2a\u56de\u5408\u4f1a\u544a\u8bc9\u6a21\u578b\u5f53\u5929\u65e5\u671f\uff0c\u53ea\u653e\u5728\u56de\u5408\u672b\u5c3e\uff0c\u4e0d\u6539\u53d8\u7f13\u5b58\u524d\u7f00 (#12598)\n- `reasonix upgrade` \u9047\u5230\u7531 npm \u6216 Homebrew \u5b89\u88c5\u7684\u7a0b\u5e8f\uff0c\u4f1a\u63d0\u793a\u7528\u5bf9\u5e94\u7684\u5305\u7ba1\u7406\u5668\u5347\u7ea7\uff0c\u4e0d\u518d\u81ea\u5df1\u66ff\u6362\u6587\u4ef6 (#12578)\n- \u68c0\u67e5\u901a\u8fc7\u4e4b\u540e\u624d\u5199\u5165\u7684\u6587\u6863\u4e0d\u518d\u8981\u6c42\u518d\u9a8c\u8bc1\u4e00\u6b21\uff1b\u6709\u5de5\u5177\u94a9\u5b50\u6216\u8fb9\u8f66\u4ecb\u5165\u65f6\u4ecd\u7136\u8981\u6c42\u9a8c\u8bc1 (#12560)\n\n## \u4fee\u590d\n\n- \u4e25\u683c\u7684\u7f51\u5173\u5728\u56de\u653e\u65e0\u53c2\u6570\u7684\u5de5\u5177\u8c03\u7528\u65f6\u8fd4\u56de HTTP 400\u300carguments must be valid JSON\u300d\uff1a\u7a7a\u53c2\u6570\u73b0\u5728\u53d1\u9001 `{}`\uff0c\u5df2\u4fdd\u5b58\u7684\u4f1a\u8bdd\u4fdd\u6301\u539f\u6837 (#12745)\n- \u5916\u58f3\u63a2\u6d4b\u6574\u4f53\u6709\u65f6\u9650\uff0c\u4e00\u6b21\u5361\u4f4f\u7684\u63a2\u6d4b\u4e0d\u518d\u62d6\u4f4f\u5185\u6838\uff0c\u4e5f\u4e0d\u4f1a\u53cd\u590d\u91cd\u65b0\u542f\u52a8 (#12615)\n- \u672c\u5730 `.mcp.json` \u7b49\u6e05\u5355\u6709\u5927\u5c0f\u4e0a\u9650\uff0c\u5b89\u88c5\u88ab\u62d2\u65f6\u4f1a\u5199\u660e\u5177\u4f53\u539f\u56e0 (#12641)\n- \u5185\u90e8\uff1aWindows \u66f4\u65b0\u52a9\u624b\u79fb\u9664\u3001\u914d\u7f6e\u8fc1\u79fb\u5408\u5e76\u4e3a\u4e00\u6b21\u8bfb\u53d6\u3001\u542f\u52a8\u8f93\u5165\u663e\u5f0f\u7ed1\u5b9a\u3001\u6d4b\u8bd5\u7a33\u5b9a\u6027 (#12594, #12592, #12555, #12742)\n\n## What's Changed\n* fix(providers): keep key-carrying provider requests on the configured origin by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12570\n* fix(readiness): prose written after a passing check owes no second run by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12560\n* feat(providers): report the roles a removal moved or cleared and prune provider_access by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12589\n* feat(control): tell the model the calendar date on the turn tail, once per day by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12598\n* feat(providers): offer the kernel's curated presets when adding a source by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12645\n* fix(sandbox): bound shell discovery as a whole so a stalled lookup cannot hold the kernel handshake by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12615\n* perf(config): run the retired-key migrations over one read of each config by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12592\n* fix(installsource): bound a local .mcp.json and name the cause of a refused install by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12641\n* perf(boot): bind every storage root Build resolves to its stated home by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12555\n* fix(upgrade): leave npm-installed binaries to npm by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12578\n* refactor(update): remove the unused Windows update helper from studio by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12594\n* feat(studio): delete a theme pack from Appearance by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12623\n* fix(provider): replay a tool call with no arguments as an empty object by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12745\n* docs(release): Studio 2.37.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12746\n* fix(e2ebench): fail mutation and differential analysis when source restoration fails by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/12562\n* fix(serve): send an empty sessions list for a folder with no conversations by @jipeng6036-del in https://github.com/esengine/DeepSeek-Reasonix/pull/12744\n\n## New Contributors\n* @jipeng6036-del made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/12744\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.36.0...studio-v2.37.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
