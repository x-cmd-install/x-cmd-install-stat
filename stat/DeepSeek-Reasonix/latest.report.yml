user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":283,"digest":"sha256:79ae88e3e3faa465e158e370953373b44a781040e5643807a425f5ae7678fe50","download_count":5,"created_at":"2026-10-02T06:33:53Z","updated_at":"2026-10-02T06:33:53Z"}],"body":"> \u684c\u9762\u7aef\u4fee\u590d\uff1a\u4f1a\u8bdd\u7528\u91cf\u7edf\u8ba1\u6e05\u96f6\u3001\u957f\u8f6e\u6b21\u5386\u53f2\u5206\u9875\u3001\u8fdc\u7aef\u4f1a\u8bdd\u5207\u6362\u3001\u5206\u53c9\u4f1a\u8bdd\u548c\u7f16\u8f91\u76ee\u6807\uff0c\u5e76\u90e8\u5206\u4fee\u590d\u8fc1\u79fb\u540e\u4f1a\u8bdd\u6d88\u5931\u7684\u95ee\u9898\u3002\n\n**\u53d1\u5e03\u6e20\u9053\uff1a\u7a33\u5b9a\u7248 \u00b7 v1.39.7**\n\n[English \u2192](https://reasonix.io/changelog/v1.39.7/?lang=en) \u00b7 [\u7f51\u9875\u7248\u5b8c\u6574\u66f4\u65b0\u65e5\u5fd7 \u2192](https://reasonix.io/changelog/v1.39.7/)\n\n## \u6982\u89c8\n\n**Reasonix v1.39.7 \u2014 Reasonix 1.39.7**\n\n\u684c\u9762\u7aef\u4fee\u590d\uff1a\u4f1a\u8bdd\u7528\u91cf\u7edf\u8ba1\u6e05\u96f6\u3001\u957f\u8f6e\u6b21\u5386\u53f2\u5206\u9875\u3001\u8fdc\u7aef\u4f1a\u8bdd\u5207\u6362\u3001\u5206\u53c9\u4f1a\u8bdd\u548c\u7f16\u8f91\u76ee\u6807\uff0c\u5e76\u90e8\u5206\u4fee\u590d\u8fc1\u79fb\u540e\u4f1a\u8bdd\u6d88\u5931\u7684\u95ee\u9898\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-10-02\n\n**Desktop 7 \u00b7 CLI 0**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u5207\u6362\u4f1a\u8bdd\u540e\u518d\u5207\u56de\u6765\uff0c\u7528\u91cf\u7edf\u8ba1\u4e0d\u518d\u6e05\u96f6** \u2014 \u5f53\u524d\u5b58\u50a8\u683c\u5f0f\u7684\u4f1a\u8bdd\u6ca1\u6709\u4fdd\u5b58\u7528\u91cf\u5feb\u7167\uff0c\u5207\u6362\u5230\u522b\u7684\u4f1a\u8bdd\u518d\u5207\u56de\u6765\u540e\uff0c\u8bf7\u6c42\u6570\u3001\u4ee4\u724c\u6570\u3001\u8d39\u7528\u548c\u5df2\u8bfb\u6587\u4ef6\u8bb0\u5f55\u90fd\u4f1a\u5f52\u96f6\u3002\u73b0\u5728\u8fd9\u4e9b\u6570\u636e\u6309\u4f1a\u8bdd\u4fdd\u5b58\uff0c\u6253\u5f00\u4f1a\u8bdd\u65f6\u6062\u590d\uff1b\u6587\u4ef6\u7f3a\u5931\u6216\u635f\u574f\u65f6\u56de\u9000\u4e3a\u7a7a\uff0c\u4e0d\u4f1a\u5f71\u54cd\u5207\u6362\u3002 ([#11621](https://github.com/esengine/DeepSeek-Reasonix/pull/11621))\n- **[Desktop]** **\u8fdc\u7aef\u4f1a\u8bdd\u5fd9\u788c\u65f6\u5207\u6362\uff0c\u6d88\u606f\u548c\u5386\u53f2\u4e0d\u518d\u4e22\u5931** \u2014 \u8fdc\u7aef\u4f1a\u8bdd\u5904\u4e8e\u8fc7\u6e21\u72b6\u6001\u65f6\u63d0\u4ea4\u7684\u6d88\u606f\u53ef\u80fd\u76f4\u63a5\u5931\u8d25\uff0c\u5fd9\u788c\u65f6\u63d0\u4ea4\u7684\u6d88\u606f\u4e0d\u4f1a\u7acb\u523b\u51fa\u73b0\u5728\u961f\u5217\u91cc\uff0c\u56de\u5230\u8bbf\u95ee\u8fc7\u7684\u4f1a\u8bdd\u8fd8\u8981\u7b49\u5b8c\u6574\u5386\u53f2\u52a0\u8f7d\u3002\u73b0\u5728\u4e34\u65f6\u8fc7\u6e21\u4f1a\u5728\u4fdd\u7559\u6d88\u606f\u548c\u9644\u4ef6\u7684\u524d\u63d0\u4e0b\u91cd\u8bd5\uff0c\u6392\u961f\u7684\u6d88\u606f\u7acb\u5373\u663e\u793a\uff0c\u8fd0\u884c\u4e2d\u7684\u4f1a\u8bdd\u5728\u540e\u53f0\u4fdd\u6301\u8fde\u63a5\uff0c\u8bbf\u95ee\u8fc7\u7684\u4f1a\u8bdd\u5148\u663e\u793a\u5df2\u6709\u5386\u53f2\uff0c\u518d\u4e0e\u6743\u5a01\u5386\u53f2\u5bf9\u8d26\u3002 ([#11345](https://github.com/esengine/DeepSeek-Reasonix/pull/11345), [#11512](https://github.com/esengine/DeepSeek-Reasonix/pull/11512) by @XTLine)\n\n### \u4fee\u590d\n\n- **[Desktop]** **\u88ab\u5386\u53f2\u5206\u9875\u622a\u65ad\u7684\u957f\u8f6e\u6b21\u53ef\u4ee5\u6298\u53e0\uff0c\u6eda\u5230\u5e95\u90e8\u4f1a\u81ea\u52a8\u52a0\u8f7d\u6700\u65b0\u4e00\u9875** \u2014 \u5386\u53f2\u5206\u9875\u628a\u4e00\u8f6e\u5bf9\u8bdd\u622a\u6210\u4e24\u534a\u65f6\uff0c\u540e\u534a\u90e8\u5206\u7684\u5de5\u5177\u5361\u7247\u4f1a\u4e00\u76f4\u5c55\u5f00\u4e14\u6ca1\u6709\u6298\u53e0\u6309\u94ae\uff0c\u76f4\u5230\u524d\u4e00\u9875\u52a0\u8f7d\u5b8c\u3002\u73b0\u5728\u5b83\u548c\u5176\u4ed6\u5df2\u5b8c\u6210\u7684\u8f6e\u6b21\u4e00\u6837\u53ef\u4ee5\u6298\u53e0\u3002\u52a0\u8f7d\u66f4\u65e9\u7684\u9875\u9762\u540e\uff0c\u6eda\u5230\u7a97\u53e3\u5e95\u90e8\u4f1a\u81ea\u52a8\u8bf7\u6c42\u4e0b\u4e00\u9875\u4e00\u6b21\uff0c\u6298\u53e0\u8d77\u6765\u7684\u957f\u8f6e\u6b21\u4e0d\u518d\u770b\u8d77\u6765\u50cf\u5bf9\u8bdd\u7ed3\u5c3e\u3002\u624b\u52a8\u6309\u94ae\u4ecd\u7136\u4fdd\u7559\u3002 ([#11338](https://github.com/esengine/DeepSeek-Reasonix/pull/11338))\n- **[Desktop]** **\u540c\u4e00\u4e2a\u4f1a\u8bdd\u7b2c\u4e8c\u6b21\u5206\u53c9\u540e\uff0c\u5de5\u4f5c\u533a\u5386\u53f2\u4e0d\u518d\u65e0\u6cd5\u52a0\u8f7d** \u2014 \u5206\u53c9\u7684\u6765\u6e90\u662f\u5b83\u7684\u7236\u4f1a\u8bdd\u76ee\u5f55\uff0c\u800c\u4e00\u4e2a\u6765\u6e90\u53ea\u80fd\u767b\u8bb0\u4e00\u6b21\u3002\u540c\u4e00\u4e2a\u7236\u4f1a\u8bdd\u7684\u7b2c\u4e8c\u6b21\u5206\u53c9\u4f1a\u649e\u4e0a\u51b2\u7a81\uff0c\u5bfc\u81f4\u5de5\u4f5c\u533a\u5386\u53f2\u65e0\u6cd5\u52a0\u8f7d\u3002\u73b0\u5728\u6765\u6e90\u5df2\u767b\u8bb0\u65f6\u4f1a\u8df3\u8fc7\u91cd\u590d\u767b\u8bb0\u3002 ([#11587](https://github.com/esengine/DeepSeek-Reasonix/pull/11587), [#11597](https://github.com/esengine/DeepSeek-Reasonix/pull/11597))\n- **[Desktop]** **\u7f16\u8f91\u76ee\u6807\u6539\u4e3a\u5e94\u7528\u5185\u8868\u5355\uff0c\u4e0d\u518d\u70b9\u51fb\u540e\u65e0\u53cd\u5e94** \u2014 \u8f93\u5165\u6846\u91cc\u7684\u300c\u7f16\u8f91\u76ee\u6807\u300d\u8c03\u7528\u4e86\u684c\u9762\u5916\u58f3\u4e0d\u652f\u6301\u7684\u6d4f\u89c8\u5668\u8f93\u5165\u6846\uff0c\u70b9\u51fb\u540e\u6ca1\u6709\u4efb\u4f55\u53cd\u5e94\u3002\u73b0\u5728\u6539\u4e3a\u5185\u5d4c\u8868\u5355\uff0c\u53ef\u4ee5\u4fee\u6539\u76ee\u6807\u548c\u6700\u5927\u8f6e\u6570\uff0c\u5e76\u5e26\u6821\u9a8c\u3002 ([#11573](https://github.com/esengine/DeepSeek-Reasonix/pull/11573), [#11576](https://github.com/esengine/DeepSeek-Reasonix/pull/11576))\n- **[Desktop]** **\u672a\u767b\u8bb0\u9879\u76ee\u91cc\u65e7\u6807\u7b7e\u9875\u7684\u4f1a\u8bdd\u4e0d\u518d\u5361\u5728\u5de5\u4f5c\u533a\u51b2\u7a81\uff08\u90e8\u5206\u4fee\u590d\uff09** \u2014 \u8fc1\u79fb\u4e00\u4e2a\u6307\u5411\u672a\u767b\u8bb0\u9879\u76ee\u76ee\u5f55\u7684\u65e7\u6807\u7b7e\u9875\u65f6\uff0c\u4f1a\u6cbf\u7528\u6807\u7b7e\u9875\u81ea\u5df1\u7684\u8303\u56f4\uff0c\u53ef\u80fd\u62a5\u300c\u5de5\u4f5c\u533a\u51b2\u7a81\u300d\u3002\u73b0\u5728\u5f53\u4f1a\u8bdd\u8bb0\u5f55\u7684\u9879\u76ee\u6839\u76ee\u5f55\u4e0e\u8be5\u76ee\u5f55\u4e00\u81f4\u65f6\uff0c\u8303\u56f4\u53d6\u81ea\u4f1a\u8bdd\u8bb0\u5f55\uff1b\u5176\u4ed6\u4e0d\u4e00\u81f4\u4ecd\u4f1a\u62a5\u544a\u51b2\u7a81\u3002\u8fd9\u53ea\u662f #11641 \u7684\u90e8\u5206\u4fee\u590d\uff1a\u5df2\u88ab\u6807\u8bb0\u4e3a\u51b2\u7a81\u7684\u6761\u76ee\u4e0d\u4f1a\u81ea\u52a8\u6e05\u9664\uff0c\u62a5\u544a\u8005\u7684\u5177\u4f53\u60c5\u51b5\u4ecd\u5728\u8c03\u67e5\u3002 ([#11641](https://github.com/esengine/DeepSeek-Reasonix/pull/11641), [#11647](https://github.com/esengine/DeepSeek-Reasonix/pull/11647))\n\n## CLI \u7aef\u66f4\u65b0\n\n\u672c\u7248\u672c\u6ca1\u6709 CLI \u76f8\u5173\u529f\u80fd\u3001\u6539\u8fdb\u6216\u4fee\u590d\uff0cCLI \u7528\u6237\u53ef\u6309\u9700\u8df3\u8fc7\u3002\n\n## \u5347\u7ea7\u63d0\u9192\n\n\u672c\u7248\u672c\u65e0\u9700\u624b\u52a8\u8fc1\u79fb\u3002\n\n## \u98ce\u9669\u63d0\u793a\n\n- **[Desktop]** **\u90e8\u5206\u8fc1\u79fb\u540e\u7684\u4f1a\u8bdd\u53ef\u80fd\u4ecd\u7136\u7f3a\u5931\uff08#11641\uff09** \u2014 \u672c\u7248\u672c\u4e0d\u4f1a\u6e05\u9664\u5df2\u7ecf\u88ab\u6807\u8bb0\u4e3a\u5de5\u4f5c\u533a\u51b2\u7a81\u7684\u6062\u590d\u6761\u76ee\u3002\u66f4\u65b0\u540e\u5982\u679c\u4f1a\u8bdd\u4ecd\u7136\u7f3a\u5931\uff0c\u8bf7\u5230 #11641 \u8865\u5145\u4fe1\u606f\u3002 ([#11641](https://github.com/esengine/DeepSeek-Reasonix/pull/11641))\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.39.6...desktop-v1.39.7)\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@XTLine\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hoor