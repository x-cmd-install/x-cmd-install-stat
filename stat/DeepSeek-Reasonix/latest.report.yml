w_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":283,"digest":"sha256:b78bc07481d80bf7d5aca250e583da58a47e3c6f969372f408b7e4158f9e9329","download_count":3,"created_at":"2026-10-01T03:35:31Z","updated_at":"2026-10-01T03:35:31Z"}],"body":"> \u4fee\u590d\u5347\u7ea7\u540e\u6e05\u4e0d\u6389\u7684\u914d\u7f6e\u544a\u8b66\u3001\u505c\u987f\u540e\u8fde\u63a5\u5df2\u65ad\u5bfc\u81f4\u7684\u8bf7\u6c42\u5931\u8d25\u3001Windows \u4e0a\u7684 shell \u547d\u4ee4\u95ee\u9898\uff0c\u4ee5\u53ca\u591a\u5904\u684c\u9762\u7aef\u4f1a\u8bdd\u4e0e\u4fa7\u8fb9\u680f\u95ee\u9898\u3002\n\n**\u53d1\u5e03\u6e20\u9053\uff1a\u7a33\u5b9a\u7248 \u00b7 v1.39.6**\n\n[English \u2192](https://reasonix.io/changelog/v1.39.6/?lang=en) \u00b7 [\u7f51\u9875\u7248\u5b8c\u6574\u66f4\u65b0\u65e5\u5fd7 \u2192](https://reasonix.io/changelog/v1.39.6/)\n\n## \u6982\u89c8\n\n**Reasonix v1.39.6 \u2014 Reasonix 1.39.6**\n\n\u4fee\u590d\u5347\u7ea7\u540e\u6e05\u4e0d\u6389\u7684\u914d\u7f6e\u544a\u8b66\u3001\u505c\u987f\u540e\u8fde\u63a5\u5df2\u65ad\u5bfc\u81f4\u7684\u8bf7\u6c42\u5931\u8d25\u3001Windows \u4e0a\u7684 shell \u547d\u4ee4\u95ee\u9898\uff0c\u4ee5\u53ca\u591a\u5904\u684c\u9762\u7aef\u4f1a\u8bdd\u4e0e\u4fa7\u8fb9\u680f\u95ee\u9898\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-10-01\n\n**Desktop 18 \u00b7 CLI 7**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u5347\u7ea7\u540e\u4e0d\u518d\u6b8b\u7559\u6e05\u4e0d\u6389\u7684\u914d\u7f6e\u544a\u8b66** \u2014 \u4ece 1.38 \u5347\u7ea7\u5230 1.39.5 \u540e\uff0c\u65e7\u7248\u672c\u5199\u5165\u7684\u9879\u76ee\u6743\u9650\u89c4\u5219\uff0c\u4ee5\u53ca\u540c\u4e00\u4e2a Windows \u6587\u4ef6\u5939\u7684\u4e0d\u540c\u5199\u6cd5\uff0c\u4f1a\u4e00\u76f4\u5f39\u51fa\u914d\u7f6e\u6709\u95ee\u9898\u7684\u63d0\u793a\uff0c\u5c3d\u7ba1\u5bf9\u8bdd\u672c\u8eab\u6b63\u5e38\u3002\u73b0\u5728\u5df2\u6709\u6388\u6743\u8986\u76d6\u7684\u89c4\u5219\u4f1a\u88ab\u8bc6\u522b\uff0c\u5c1a\u672a\u6279\u51c6\u7684\u9879\u76ee\u58f0\u660e\u4f1a\u4fdd\u7559\u4f9b\u67e5\u770b\uff0c\u4e0d\u518d\u88ab\u5f53\u4f5c\u914d\u7f6e\u5931\u8d25\u3002\u9879\u76ee\u8bbe\u7f6e\u4ecd\u7136\u4e0d\u80fd\u6388\u4e88\u6743\u9650\uff0c\u4e5f\u4e0d\u80fd\u6062\u590d\u5df2\u64a4\u9500\u7684\u6388\u6743\u3002 ([#11431](https://github.com/esengine/DeepSeek-Reasonix/pull/11431) by @SivanCola)\n- **[Desktop \u00b7 CLI]** **\u8fde\u63a5\u5728\u7a7a\u95f2\u65f6\u5df2\u65ad\u5f00\uff0c\u4e0d\u518d\u8ba9\u4e0b\u4e00\u8f6e\u5bf9\u8bdd\u5931\u8d25** \u2014 \u505c\u987f\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u4e0b\u4e00\u8f6e\u5bf9\u8bdd\u53ef\u80fd\u56e0 `unexpected EOF` \u5931\u8d25\uff0c\u539f\u56e0\u662f\u8bf7\u6c42\u8d70\u4e86\u5df2\u88ab\u5bf9\u7aef\u65ad\u5f00\u7684\u590d\u7528\u7a7a\u95f2\u8fde\u63a5\uff1b\u81ea 1.39.0 \u8d77\u8bf7\u6c42\u53ea\u53d1\u9001\u4e00\u6b21\uff0c\u6240\u4ee5\u8fd9\u4e2a\u5931\u8d25\u76f4\u63a5\u66b4\u9732\u7ed9\u4e86\u7528\u6237\u3002\u73b0\u5728\u53ea\u6709\u5728\u8bf7\u6c42\u4f7f\u7528\u4e86\u590d\u7528\u7684\u7a7a\u95f2\u8fde\u63a5\u3001\u4e14\u6ca1\u6709\u6536\u5230\u4efb\u4f55\u54cd\u5e94\u5b57\u8282\u65f6\uff0c\u624d\u4f1a\u5728\u65b0\u8fde\u63a5\u4e0a\u91cd\u53d1\u4e00\u6b21\uff1b\u5176\u4ed6\u5931\u8d25\u3001\u8d85\u65f6\u548c\u53d6\u6d88\u4e0d\u4f1a\u91cd\u53d1\u3002 ([#11271](https://github.com/esengine/DeepSeek-Reasonix/pull/11271) by @esengine)\n\n### \u6539\u8fdb\n\n- **[Desktop \u00b7 CLI]** **\u65b0\u6d88\u606f\u4f18\u5148\u4e8e\u88ab\u4e2d\u65ad\u8f6e\u6b21\u7684\u6062\u590d\u63d0\u793a** \u2014 \u5f3a\u5236\u505c\u6b62\u4e00\u8f6e\u5bf9\u8bdd\u540e\uff0c\u6062\u590d\u63d0\u793a\u6ca1\u6709\u8bf4\u660e\u4ee5\u54ea\u6761\u6307\u4ee4\u4e3a\u51c6\uff0c\u65e0\u5173\u7684\u65b0\u6d88\u606f\u53ef\u80fd\u88ab\u5f53\u6210\u7ee7\u7eed\u65e7\u4efb\u52a1\u7684\u4fe1\u53f7\u3002\u73b0\u5728\u63d0\u793a\u660e\u786e\u5199\u51fa\uff1a\u4ee5\u4f60\u7684\u65b0\u6d88\u606f\u4e3a\u51c6\uff0c\u4e24\u8005\u65e0\u5173\u65f6\u4e0d\u8981\u6062\u590d\u65e7\u4efb\u52a1\u3002 ([#11386](https://github.com/esengine/DeepSeek-Reasonix/pull/11386) by @esengine)\n- **[Desktop]** **\u4f1a\u8bdd\u5386\u53f2\u52a0\u8f7d\u5931\u8d25\u65f6\u663e\u793a\u5177\u4f53\u539f\u56e0** \u2014 \u300c\u65e0\u6cd5\u52a0\u8f7d\u6b64\u4f1a\u8bdd\u300d\u539f\u5148\u7528\u4e00\u53e5\u901a\u7528\u63d0\u793a\u76d6\u4f4f\u4e86\u771f\u5b9e\u539f\u56e0\u3002\u73b0\u5728\u300c\u8be6\u60c5\u300d\u91cc\u4f1a\u9644\u4e0a\u8bfb\u53d6\u5931\u8d25\u7684\u5177\u4f53\u539f\u56e0\uff0c\u4fbf\u4e8e\u53cd\u9988\u548c\u6392\u67e5\u3002 ([#11282](https://github.com/esengine/DeepSeek-Reasonix/pull/11282) by @esengine)\n- **[Desktop]** **\u5386\u53f2\u5bf9\u8bdd\u5bfc\u5165\u5931\u8d25\u65f6\u8bf4\u660e\u539f\u56e0\u548c\u67e5\u770b\u4f4d\u7f6e** \u2014 \u300c\u5bfc\u5165\u5e76\u6253\u5f00\u300d\u5931\u8d25\u65f6\u539f\u5148\u603b\u662f\u540c\u4e00\u53e5\u8bdd\u3002\u73b0\u5728\u63d0\u793a\u6761\u548c\u5386\u53f2\u5217\u8868\u4f1a\u5199\u51fa\u5931\u8d25\u7c7b\u522b\uff08\u4f8b\u5982\u5de5\u4f5c\u533a\u51b2\u7a81\u3001\u5386\u53f2\u8fc7\u5927\u6216\u635f\u574f\u3001\u7248\u672c\u4e0d\u53d7\u652f\u6301\u3001\u6765\u6e90\u88ab\u5360\u7528\uff09\uff0c\u8be6\u60c5\u6536\u5728\u5c55\u5f00\u9879\u91cc\uff0c\u5e76\u63d0\u4f9b\u300c\u67e5\u770b\u6062\u590d\u8be6\u60c5\u300d\u5165\u53e3\uff0c\u76f4\u63a5\u6253\u5f00\u8bbe\u7f6e\u4e2d\u7684\u5b58\u50a8\u9875\u3002\u5bfc\u5165\u6210\u529f\u540e\u6253\u5f00\u5931\u8d25\uff0c\u4e5f\u4e0d\u518d\u88ab\u8bf4\u6210\u5bfc\u5165\u5931\u8d25\u3002 ([#11294](https://github.com/esengine/DeepSeek-Reasonix/pull/11294) by @esengine)\n- **[Desktop]** **\u53ef\u4ee5\u91cd\u7f6e\u4fa7\u8fb9\u680f\u7684\u624b\u52a8\u6392\u5e8f** \u2014 \u9879\u76ee\u624b\u52a8\u8c03\u6574\u6392\u5e8f\u540e\uff0c\u5373\u4f7f\u9009\u62e9\u6309\u521b\u5efa\u6216\u66f4\u65b0\u65f6\u95f4\u6392\u5e8f\uff0c\u4fa7\u8fb9\u680f\u4ecd\u4fdd\u6301\u624b\u52a8\u987a\u5e8f\u3002\u9879\u76ee\u83dc\u5355\u65b0\u589e\u300c\u91cd\u7f6e\u624b\u52a8\u6392\u5e8f\u300d\uff0c\u5173\u95ed\u624b\u52a8\u6392\u5e8f\u5e76\u4fdd\u7559\u5df2\u4fdd\u5b58\u7684\u5206\u7ec4\u548c\u4f4d\u7f6e\u3002 ([#11303](https://github.com/esengine/DeepSeek-Reasonix/pull/11303) by @KHG420)\n- **[Desktop]** **\u5173\u95ed\u684c\u9762\u7aef\u65f6\u91ca\u653e\u673a\u5668\u4eba\u6865\u63a5\u548c\u7528\u91cf\u8bb0\u5f55\u7ebf\u7a0b** \u2014 \u684c\u9762\u7aef\u6bcf\u6b21\u542f\u52a8\u90fd\u4f1a\u7559\u4e0b\u673a\u5668\u4eba\u6865\u63a5\u7ebf\u7a0b\u548c\u6309\u76ee\u5f55\u7684\u7528\u91cf\u8bb0\u5f55\u7ebf\u7a0b\uff0c\u8fd0\u884c\u671f\u95f4\u4e00\u76f4\u4e0d\u91ca\u653e\uff0c\u957f\u65f6\u95f4\u4f7f\u7528\u4f1a\u8d8a\u79ef\u8d8a\u591a\u3002\u73b0\u5728\u5b83\u4eec\u968f\u5e94\u7528\u4e00\u8d77\u5173\u95ed\u3002 ([#11415](https://github.com/esengine/DeepSeek-Reasonix/pull/11415) by @jf200s)\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **Windows \u4e0a\u7684 shell \u547d\u4ee4\u4e0d\u518d\u5148\u8f93\u51fa\u7f16\u7801\u9519\u8bef** \u2014 PowerShell \u7684\u524d\u7f6e\u811a\u672c\u5728\u6ca1\u6709\u63a7\u5236\u53f0\u6216\u5904\u4e8e ConstrainedLanguage \u6a21\u5f0f\u65f6\u4f1a\u5728\u4f60\u7684\u547d\u4ee4\u4e4b\u524d\u62a5\u9519\uff0c\u6bcf\u6b21\u7ed3\u679c\u524d\u90fd\u5e26\u7740\u9519\u8bef\u884c\u3002\u73b0\u5728\u6bcf\u9879\u8bbe\u7f6e\u90fd\u6709\u4fdd\u62a4\u3002\u5728 Windows PowerShell 5.1 \u4e0a\uff0c`>` \u548c `Out-File` \u6539\u4e3a\u5199\u5165 UTF-8 \u800c\u4e0d\u662f UTF-16\uff0c\u901a\u8fc7\u7ba1\u9053\u4f20\u7ed9\u539f\u751f\u7a0b\u5e8f\u7684\u6587\u672c\u4e5f\u4e0d\u518d\u4ee5\u5b57\u8282\u5e8f\u6807\u8bb0\u5f00\u5934\uff1b\u80fd\u771f\u6b63\u542f\u52a8\u7684 Microsoft Store \u7248 PowerShell 7 \u4e5f\u4f1a\u88ab\u8bc6\u522b\u3002 ([#11253](https://github.com/esengine/DeepSeek-Reasonix/pull/11253) by @esengine)\n- **[Desktop \u00b7 CLI]** **Windows \u547d\u4ee4\u884c\u8fc7\u957f\u65f6\u7ed9\u51fa\u660e\u786e\u539f\u56e0\uff0c\u4e0d\u518d\u62a5\u300c\u6587\u4ef6\u540d\u592a\u957f\u300d** \u2014 shell \u547d\u4ee4\u5185\u5d4c\u5927\u6bb5\u6587\u5b57\u65f6\u4f1a\u8d85\u8fc7 Windows 32,767 \u5b57\u7b26\u7684\u547d\u4ee4\u884c\u4e0a\u9650\uff0c\u8fc7\u53bb\u53ea\u62a5\u300c\u6587\u4ef6\u540d\u6216\u6269\u5c55\u540d\u592a\u957f\u300d\u3002\u73b0\u5728\u4f1a\u5728\u542f\u52a8\u524d\u62d2\u7edd\uff0c\u5e76\u8bf4\u660e\u5b9e\u9645\u5927\u5c0f\u548c\u4e0a\u9650\u3001\u544a\u77e5\u6ca1\u6709\u6267\u884c\u4efb\u4f55\u5185\u5bb9\uff0c\u63d0\u793a\u6539\u7528 `write_file` \u6216 `edit_file`\u3002 ([#11232](https://github.com/esengine/DeepSeek-Reasonix/pull/11232) by @esengine)\n- **[Desktop \u00b7 CLI]** **\u6062\u590d\u76ee\u6807\u65f6\u4e0d\u518d\u56e0\u591a\u4f59\u53c2\u6570\u5931\u8d25** \u2014 \u6a21\u578b\u5728\u6062\u590d\u76ee\u6807\u65f6\u56de\u4f20\u4e86\u76ee\u6807\u63cf\u8ff0\u3001\u7a7a\u7684\u8f6e\u6570\u4e0a\u9650\u548c\u7a7a\u7684\u963b\u585e\u539f\u56e0\uff0c\u4f1a\u88ab\u5de5\u5177\u62d2\u7edd\u3002\u73b0\u5728\u76ee\u6807\u7684\u751f\u547d\u5468\u671f\u64cd\u4f5c\u4f1a\u63a5\u53d7\u5c5e\u4e8e\u5176\u4ed6\u64cd\u4f5c\u7684\u5b57\u6bb5\u4f46\u4e0d\u5e94\u7528\u5b83\u4eec\uff0c\u7ed3\u679c\u91cc\u4f1a\u5217\u51fa\u672a\u751f\u6548\u7684\u503c\uff0c\u907f\u514d\u88ab\u8bef\u5f53\u6210\u5df2\u751f\u6548\u7684\u4fee\u6539\u3002 ([#11238](https://github.com/esengine/DeepSeek-Reasonix/pull/11238) by @SivanCola)\n- **[Desktop]** **\u6743\u9650\u9884\u8bbe\u8ddf\u968f\u5404\u81ea\u7684\u8fdc\u7a0b\u4f1a\u8bdd** \u2014 \u5728 SSH \u8fdc\u7a0b\u5de5\u4f5c\u533a\u91cc\uff0c\u4fee\u6539\u4e00\u4e2a\u4f1a\u8bdd\u7684\u6743\u9650\u9884\u8bbe\u53ef\u80fd\u5f71\u54cd\u53e6\u4e00\u4e2a\u4f1a\u8bdd\uff0c\u5207\u6362\u4f1a\u8bdd\u6216\u91cd\u542f\u8fdc\u7a0b\u670d\u52a1\u540e\u9009\u62e9\u8fd8\u4f1a\u4e22\u5931\u3002\u73b0\u5728\u6bcf\u4e2a\u4f1a\u8bdd\u5404\u81ea\u4fdd\u5b58\u9884\u8bbe\uff0c\u5206\u53c9\u51fa\u7684\u4f1a\u8bdd\u6743\u9650\u4e0d\u4f1a\u6bd4 `workspace-write` \u66f4\u5bbd\u3002 ([#11086](https://github.com/esengine/DeepSeek-Reasonix/pull/11086) by @KHG420)\n- **[Desktop]** **\u673a\u5668\u4eba\u5bf9\u8bdd\u53ef\u4ee5\u4ece\u673a\u5668\u4eba\u4fa7\u8fb9\u680f\u6253\u5f00** \u2014 \u5185\u5d4c\u673a\u5668\u4eba\u4ecd\u5360\u7528\u4f1a\u8bdd\u65f6\uff0c\u4ece\u684c\u9762\u7aef\u673a\u5668\u4eba\u4fa7\u8fb9\u680f\u6253\u5f00\u8be5\u5bf9\u8bdd\u53ef\u80fd\u5931\u8d25\u3002\u73b0\u5728\u684c\u9762\u7aef\u548c\u5185\u5d4c\u673a\u5668\u4eba\u5171\u7528\u540c\u4e00\u4e2a\u4f1a\u8bdd\u670d\u52a1\uff0c\u4fa7\u8fb9\u680f\u4ee5\u53ea\u8bfb\u65b9\u5f0f\u6253\u5f00\u5df2\u4fdd\u5b58\u7684\u8bb0\u5f55\u3002 ([#11273](https://github.com/esengine/DeepSeek-Reasonix/pull/11273) by @KHG420)\n- **[Desktop]** **\u624b\u52a8\u6392\u5e8f\u7684\u4fa7\u8fb9\u680f\u91cc\u65b0\u5bf9\u8bdd\u4e0d\u518d\u627e\u4e0d\u5230** \u2014 \u62d6\u52a8\u4e00\u4e2a\u5bf9\u8bdd\u4f1a\u5f00\u542f\u624b\u52a8\u6392\u5e8f\uff0c\u5e76\u628a\u5217\u8868\u6574\u4e2a\u98a0\u5012\u6210\u6700\u65e7\u7684\u5728\u6700\u4e0a\u9762\uff0c\u65b0\u5bf9\u8bdd\u8fd8\u88ab\u8ffd\u52a0\u5230\u672b\u5c3e\uff0c\u7ffb\u4e0d\u5230\u7b2c\u4e00\u9875\u3002\u73b0\u5728\u7b2c\u4e00\u6b21\u62d6\u52a8\u4f1a\u4fdd\u6301\u4f60\u5f53\u65f6\u770b\u5230\u7684\u987a\u5e8f\uff0c\u65b0\u5bf9\u8bdd\u653e\u5728\u6700\u524d\u9762\u3002 ([#11270](https://github.com/esengine/DeepSeek-Reasonix/pull/11270) by @esengine)\n- **[Desktop]** **\u79fb\u5165\u5e9f\u7eb8\u7bd3\u65f6\u65e7\u7248\u5bf9\u8bdd\u7684\u6240\u6709\u7248\u672c\u53ea\u5f52\u6863\u4e00\u6b21** \u2014 \u5bf9\u4e8e\u5e26\u6709\u672a\u547d\u540d\u5206\u53c9\u6216\u5e76\u53d1\u4fdd\u5b58\u540e\u4ea7\u751f\u7248\u672c\u7684\u65e7\u7248\u5bf9\u8bdd\uff0c\u6bcf\u70b9\u4e00\u6b21\u53ea\u5f52\u6863\u4e00\u4e2a\u7248\u672c\uff0c\u91cd\u590d\u5f52\u6863\u5df2\u5904\u7406\u7684\u7248\u672c\u8fd8\u53ef\u80fd\u591a\u5199\u51fa\u4f1a\u8bdd\u526f\u672c\u3002\u73b0\u5728\u4f1a\u4e00\u6b21\u5f52\u6863\u8be5\u5bf9\u8bdd\u7684\u6240\u6709\u7248\u672c\uff0c\u5df2\u5f52\u6863\u7684\u7248\u672c\u4e0d\u518d\u91cd\u590d\u590d\u5236\uff0c\u4e5f\u4e0d\u4f1a\u5220\u9664\u4efb\u4f55\u5185\u5bb9\u3002 ([#11309](https://github.com/esengine/DeepSeek-Reasonix/pull/11309) by @esengine)\n- **[Desktop]** **\u5f52\u6863\u65e7\u7248\u672c\u65f6\u4e0d\u518d\u52a8\u6b63\u5728\u4f7f\u7528\u7684\u540c\u7ea7\u7248\u672c** \u2014 \u5f52\u6863\u65e7\u7248\u5bf9\u8bdd\u7684\u67d0\u4e2a\u7248\u672c\u65f6\uff0c\u53ef\u80fd\u7ed9\u5df2\u4f5c\u4e3a\u6d3b\u8dc3\u4f1a\u8bdd\u6253\u5f00\u7684\u540c\u7ea7\u7248\u672c\u518d\u9020\u4e00\u4efd\u526f\u672c\uff0c\u5e76\u628a\u8be5\u4f1a\u8bdd\u7684\u6765\u6e90\u5173\u8054\u632a\u5230\u526f\u672c\u4e0a\u3002\u73b0\u5728\u5df2\u6709\u6765\u6e90\u5173\u8054\u7684\u7248\u672c\u4e0d\u4f1a\u518d\u88ab\u52a8\u5230\u3002 ([#11319](https://github.com/esengine/DeepSeek-Reasonix/pull/11319) by @KHG420)\n- **[Desktop]** **\u4ecd\u5728\u8f93\u51fa\u7684\u601d\u8003\u5757\u53ef\u4ee5\u70b9\u300c\u52a0\u8f7d\u5168\u6587\u300d** \u2014 \u5728\u4ecd\u5728\u8f93\u51fa\u7684\u601d\u8003\u5757\u91cc\u70b9\u300c\u52a0\u8f7d\u5168\u6587\u300d\uff0c\u4e0b\u4e00\u6bb5\u5185\u5bb9\u5230\u8fbe\u65f6\u4f1a\u7acb\u523b\u9000\u56de 8000 \u5b57\u7684\u9884\u89c8\u3002\u73b0\u5728\u8f93\u51fa\u671f\u95f4\u601d\u8003\u5757\u4f1a\u8ddf\u968f\u5b9e\u65f6\u6587\u672c\uff0c\u7ed3\u675f\u540e\u518d\u4e00\u6b21\u6027\u52a0\u8f7d\u5b8c\u6574\u5185\u5bb9\u3002 ([#11414](https://github.com/esengine/DeepSeek-Reasonix/pull/11414) by @esengine)\n- **[Desktop]** **\u6bcf\u4e2a\u5df2\u7ed3\u675f\u7684\u8f6e\u6b21\u90fd\u80fd\u624b\u52a8\u6298\u53e0** \u2014 \u56e0\u505c\u6b62\u3001\u51fa\u9519\u6216\u7559\u6709\u672a\u5b8c\u6210\u5de5\u5177\u8c03\u7528\u800c\u7ed3\u675f\u7684\u8f6e\u6b21\u4f1a\u4fdd\u6301\u5c55\u5f00\uff0c\u4e14\u6ca1\u6709\u6298\u53e0\u5165\u53e3\u3002\u73b0\u5728\u53ea\u8981\u662f\u5e26\u8fc7\u7a0b\u7684\u5df2\u7ed3\u675f\u8f6e\u6b21\u90fd\u4f1a\u663e\u793a\u6298\u53e0\u63a7\u4ef6\uff0c\u5e76\u6309\u8f6e\u6b21\u8bb0\u4f4f\u4f60\u7684\u9009\u62e9\uff1b\u8fd9\u7c7b\u8f6e\u6b21\u9ed8\u8ba4\u4ecd\u4fdd\u6301\u5c55\u5f00\uff0c\u4f7f\u4e2d\u65ad\u60c5\u51b5\u4e00\u76ee\u4e86\u7136\u3002 ([#11405](https://github.com/esengine/DeepSeek-Reasonix/pull/11405) by @esengine)\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u5347\u7ea7\u540e\u4e0d\u518d\u6b8b\u7559\u6e05\u4e0d\u6389\u7684\u914d\u7f6e\u544a\u8b66** \u2014 \u4ece 1.38 \u5347\u7ea7\u5230 1.39.5 \u540e\uff0c\u65e7\u7248\u672c\u5199\u5165\u7684\u9879\u76ee\u6743\u9650\u89c4\u5219\uff0c\u4ee5\u53ca\u540c\u4e00\u4e2a Windows \u6587\u4ef6\u5939\u7684\u4e0d\u540c\u5199\u6cd5\uff0c\u4f1a\u4e00\u76f4\u5f39\u51fa\u914d\u7f6e\u6709\u95ee\u9898\u7684\u63d0\u793a\uff0c\u5c3d\u7ba1\u5bf9\u8bdd\u672c\u8eab\u6b63\u5e38\u3002\u73b0\u5728\u5df2\u6709\u6388\u6743\u8986\u76d6\u7684\u89c4\u5219\u4f1a\u88ab\u8bc6\u522b\uff0c\u5c1a\u672a\u6279\u51c6\u7684\u9879\u76ee\u58f0\u660e\u4f1a\u4fdd\u7559\u4f9b\u67e5\u770b\uff0c\u4e0d\u518d\u88ab\u5f53\u4f5c\u914d\u7f6e\u5931\u8d25\u3002\u9879\u76ee\u8bbe\u7f6e\u4ecd\u7136\u4e0d\u80fd\u6388\u4e88\u6743\u9650\uff0c\u4e5f\u4e0d\u80fd\u6062\u590d\u5df2\u64a4\u9500\u7684\u6388\u6743\u3002 ([#11431](https://github.com/esengine/DeepSeek-Reasonix/pull/11431) by @SivanCola)\n- **[Desktop \u00b7 CLI]** **\u8fde\u63a5\u5728\u7a7a\u95f2\u65f6\u5df2\u65ad\u5f00\uff0c\u4e0d\u518d\u8ba9\u4e0b\u4e00\u8f6e\u5bf9\u8bdd\u5931\u8d25** \u2014 \u505c\u987f\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u4e0b\u4e00\u8f6e\u5bf9\u8bdd\u53ef\u80fd\u56e0 `unexpected EOF` \u5931\u8d25\uff0c\u539f\u56e0\u662f\u8bf7\u6c42\u8d70\u4e86\u5df2\u88ab\u5bf9\u7aef\u65ad\u5f00\u7684\u590d\u7528\u7a7a\u95f2\u8fde\u63a5\uff1b\u81ea 1.39.0 \u8d77\u8bf7\u6c42\u53ea\u53d1\u9001\u4e00\u6b21\uff0c\u6240\u4ee5\u8fd9\u4e2a\u5931\u8d25\u76f4\u63a5\u66b4\u9732\u7ed9\u4e86\u7528\u6237\u3002\u73b0\u5728\u53ea\u6709\u5728\u8bf7\u6c42\u4f7f\u7528\u4e86\u590d\u7528\u7684\u7a7a\u95f2\u8fde\u63a5\u3001\u4e14\u6ca1\u6709\u6536\u5230\u4efb\u4f55\u54cd\u5e94\u5b57\u8282\u65f6\uff0c\u624d\u4f1a\u5728\u65b0\u8fde\u63a5\u4e0a\u91cd\u53d1\u4e00\u6b21\uff1b\u5176\u4ed6\u5931\u8d25\u3001\u8d85\u65f6\u548c\u53d6\u6d88\u4e0d\u4f1a\u91cd\u53d1\u3002 ([#11271](https://github.com/esengine/DeepSeek-Reasonix/pull/11271) by @esengine)\n\n### \u6539\u8fdb\n\n- **[Desktop \u00b7 CLI]** **\u65b0\u6d88\u606f\u4f18\u5148\u4e8e\u88ab\u4e2d\u65ad\u8f6e\u6b21\u7684\u6062\u590d\u63d0\u793a** \u2014 \u5f3a\u5236\u505c\u6b62\u4e00\u8f6e\u5bf9\u8bdd\u540e\uff0c\u6062\u590d\u63d0\u793a\u6ca1\u6709\u8bf4\u660e\u4ee5\u54ea\u6761\u6307\u4ee4\u4e3a\u51c6\uff0c\u65e0\u5173\u7684\u65b0\u6d88\u606f\u53ef\u80fd\u88ab\u5f53\u6210\u7ee7\u7eed\u65e7\u4efb\u52a1\u7684\u4fe1\u53f7\u3002\u73b0\u5728\u63d0\u793a\u660e\u786e\u5199\u51fa\uff1a\u4ee5\u4f60\u7684\u65b0\u6d88\u606f\u4e3a\u51c6\uff0c\u4e24\u8005\u65e0\u5173\u65f6\u4e0d\u8981\u6062\u590d\u65e7\u4efb\u52a1\u3002 ([#11386](https://github.com/esengine/DeepSeek-Reasonix/pull/11386) by @esengine)\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **Windows \u4e0a\u7684 shell \u547d\u4ee4\u4e0d\u518d\u5148\u8f93\u51fa\u7f16\u7801\u9519\u8bef** \u2014 PowerShell \u7684\u524d\u7f6e\u811a\u672c\u5728\u6ca1\u6709\u63a7\u5236\u53f0\u6216\u5904\u4e8e ConstrainedLanguage \u6a21\u5f0f\u65f6\u4f1a\u5728\u4f60\u7684\u547d\u4ee4\u4e4b\u524d\u62a5\u9519\uff0c\u6bcf\u6b21\u7ed3\u679c\u524d\u90fd\u5e26\u7740\u9519\u8bef\u884c\u3002\u73b0\u5728\u6bcf\u9879\u8bbe\u7f6e\u90fd\u6709\u4fdd\u62a4\u3002\u5728 Windows PowerShell 5.1 \u4e0a\uff0c`>` \u548c `Out-File` \u6539\u4e3a\u5199\u5165 UTF-8 \u800c\u4e0d\u662f UTF-16\uff0c\u901a\u8fc7\u7ba1\u9053\u4f20\u7ed9\u539f\u751f\u7a0b\u5e8f\u7684\u6587\u672c\u4e5f\u4e0d\u518d\u4ee5\u5b57\u8282\u5e8f\u6807\u8bb0\u5f00\u5934\uff1b\u80fd\u771f\u6b63\u542f\u52a8\u7684 Microsoft Store \u7248 PowerShell 7 \u4e5f\u4f1a\u88ab\u8bc6\u522b\u3002 ([#11253](https://github.com/esengine/DeepSeek-Reasonix/pull/11253) by @esengine)\n- **[Desktop \u00b7 CLI]** **Windows \u547d\u4ee4\u884c\u8fc7\u957f\u65f6\u7ed9\u51fa\u660e\u786e\u539f\u56e0\uff0c\u4e0d\u518d\u62a5\u300c\u6587\u4ef6\u540d\u592a\u957f\u300d** \u2014 shell \u547d\u4ee4\u5185\u5d4c\u5927\u6bb5\u6587\u5b57\u65f6\u4f1a\u8d85\u8fc7 Windows 32,767 \u5b57\u7b26\u7684\u547d\u4ee4\u884c\u4e0a\u9650\uff0c\u8fc7\u53bb\u53ea\u62a5\u300c\u6587\u4ef6\u540d\u6216\u6269\u5c55\u540d\u592a\u957f\u300d\u3002\u73b0\u5728\u4f1a\u5728\u542f\u52a8\u524d\u62d2\u7edd\uff0c\u5e76\u8bf4\u660e\u5b9e\u9645\u5927\u5c0f\u548c\u4e0a\u9650\u3001\u544a\u77e5\u6ca1\u6709\u6267\u884c\u4efb\u4f55\u5185\u5bb9\uff0c\u63d0\u793a\u6539\u7528 `write_file` \u6216 `edit_file`\u3002 ([#11232](https://github.com/esengine/DeepSeek-Reasonix/pull/11232) by @esengine)\n- **[Desktop \u00b7 CLI]** **\u6062\u590d\u76ee\u6807\u65f6\u4e0d\u518d\u56e0\u591a\u4f59\u53c2\u6570\u5931\u8d25** \u2014 \u6a21\u578b\u5728\u6062\u590d\u76ee\u6807\u65f6\u56de\u4f20\u4e86\u76ee\u6807\u63cf\u8ff0\u3001\u7a7a\u7684\u8f6e\u6570\u4e0a\u9650\u548c\u7a7a\u7684\u963b\u585e\u539f\u56e0\uff0c\u4f1a\u88ab\u5de5\u5177\u62d2\u7edd\u3002\u73b0\u5728\u76ee\u6807\u7684\u751f\u547d\u5468\u671f\u64cd\u4f5c\u4f1a\u63a5\u53d7\u5c5e\u4e8e\u5176\u4ed6\u64cd\u4f5c\u7684\u5b57\u6bb5\u4f46\u4e0d\u5e94\u7528\u5b83\u4eec\uff0c\u7ed3\u679c\u91cc\u4f1a\u5217\u51fa\u672a\u751f\u6548\u7684\u503c\uff0c\u907f\u514d\u88ab\u8bef\u5f53\u6210\u5df2\u751f\u6548\u7684\u4fee\u6539\u3002 ([#11238](https://github.com/esengine/DeepSeek-Reasonix/pull/11238) by @SivanCola)\n\n## \u5347\u7ea7\u63d0\u9192\n\n\u672c\u7248\u672c\u65e0\u9700\u624b\u52a8\u8fc1\u79fb\u3002\n\n## \u98ce\u9669\u63d0\u793a\n\n- **[Desktop \u00b7 CLI]** **\u91cd\u53d1\u7684\u8bf7\u6c42\u5728\u6781\u5c11\u6570\u7ade\u6001\u4e0b\u53ef\u80fd\u88ab\u91cd\u590d\u8ba1\u8d39** \u2014 \u7a7a\u95f2\u8fde\u63a5\u5df2\u65ad\u5f00\u540e\u7684\u91cd\u53d1\u6700\u591a\u4e00\u6b21\u3002\u5982\u679c\u8fde\u63a5\u65ad\u5f00\u524d\u670d\u52a1\u5546\u6070\u597d\u5df2\u6536\u5230\u7b2c\u4e00\u6b21\u8bf7\u6c42\uff0c\u8fd9\u4e00\u8f6e\u4f1a\u88ab\u8ba1\u8d39\u4e24\u6b21\uff0c\u9884\u8ba1\u4e0d\u5e38\u89c1\u3002 ([#11271](https://github.com/esengine/DeepSeek-Reasonix/pull/11271) by @esengine)\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.39.5...desktop-v1.39.6)\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@SivanCola\u3001@esengine\u3001@KHG420\u3001@jf200s\n","mentions_count":4}
