t":"2026-10-21T04:10:20Z","updated_at":"2026-10-21T04:10:20Z"},{"id":661312397,"node_id":"RA_kwDOSIatD84natON","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:abddbb76c9aab8efbde30a1781ebb53ecf97e2442b6603387d0fed0dc407d599","download_count":4,"created_at":"2026-10-21T04:10:21Z","updated_at":"2026-10-21T04:10:21Z"}],"body":"\u672c\u7248\u7528 Go 1.26.10 \u91cd\u65b0\u6784\u5efa\uff0c\u4fee\u590d\u6807\u51c6\u5e93\u8bc1\u4e66\u9a8c\u8bc1\u5bf9\u5df2\u4e0d\u518d\u53d7\u4fe1\u4efb\u7684\u4e2d\u95f4\u8bc1\u4e66\u7684\u5904\u7406\uff0c\u5e76\u4fee\u597d\u5386\u53f2\u641c\u7d22\u8bfb\u4e0d\u5230\u4f1a\u8bdd\u65f6\u8bef\u62a5\u201c\u6ca1\u6709\u5339\u914d\u201d\u548c\u591a\u8fdb\u7a0b\u4e0b\u4f1a\u8bdd\u4ece\u641c\u7d22\u91cc\u6d88\u5931\u7684\u95ee\u9898\u3002\n\n## \u4fee\u590d\n\n- \u6784\u5efa\u6539\u7528 Go 1.26.10\uff0c\u4fee\u590d\u6807\u51c6\u5e93\u8bc1\u4e66\u9a8c\u8bc1 crypto/x509 \u5bf9\u5df2\u4e0d\u518d\u53d7\u4fe1\u4efb\u7684\u4e2d\u95f4\u8bc1\u4e66\u7684\u5904\u7406\uff08GO-2026-6809\uff09\u3002\u5173\u8054 #14034\u3002\n- \u4f1a\u8bdd\u8bb0\u5f55\u8bfb\u4e0d\u51fa\u6765\u65f6\uff0c\u5386\u53f2\u641c\u7d22\u4e0d\u518d\u8bf4\u300c\u6ca1\u6709\u5339\u914d\u300d\uff0c\u800c\u662f\u5148\u63d0\u793a\u7d22\u5f15\u4e0d\u5b8c\u6574\uff0c\u5e76\u628a\u8be5\u4f1a\u8bdd\u6807\u4e3a\u635f\u574f\u3001\u7a0d\u540e\u81ea\u52a8\u91cd\u8bd5\u3002\u5173\u8054 #14023 by @chuiwenwei\u3002\n- \u4e24\u4e2a\u8fdb\u7a0b\u5171\u7528\u4e00\u4e2a\u5386\u53f2\u7d22\u5f15\u65f6\uff0c\u53e6\u4e00\u4e2a\u8fdb\u7a0b\u521a\u7d22\u5f15\u7684\u4f1a\u8bdd\u4e0d\u518d\u88ab\u8bef\u5224\u4e3a\u300c\u5df2\u5220\u9664\u300d\u800c\u4ece\u5386\u53f2\u641c\u7d22\u91cc\u6d88\u5931\uff1b\u53ea\u6709\u786e\u8ba4\u6587\u4ef6\u4e0d\u5b58\u5728\u624d\u4f1a\u88ab\u6807\u8bb0\u7f3a\u5931\u3002\u5173\u8054 #14024 by @chuiwenwei\u3002\n- \u4fa7\u680f\u201c\u9879\u76ee\u201d\u6807\u9898\u884c\u91cc\u7684\u201c+\u201d\u548c\u201c\u66f4\u591a\u64cd\u4f5c\u201d\u6309\u94ae\u60ac\u505c\u65f6\u73b0\u5728\u662f\u540c\u4e00\u79cd\u9ad8\u4eae\u3002\u5173\u8054 #14041 fixed in #14043 by @lancy69\u3001#14043 by @lancy69\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@chuiwenwei\u3001@lancy69\n\n---\n\n<!-- lang:en -->\n\nThis release is rebuilt with Go 1.26.10, which fixes how certificate verification treats intermediate certificates that are no longer trusted, and fixes history search reporting no match for an unreadable transcript or losing a session another process had just indexed.\n\n## Fixed\n\n- builds now use Go 1.26.10, which fixes how crypto/x509 certificate verification treats intermediate certificates that are no longer trusted (GO-2026-6809). Refs #14034.\n- when a session's transcript cannot be read, history search no longer claims a miss; it says the index is incomplete, marks that session corrupt, and retries on the next scan. Refs #14023 by @chuiwenwei.\n- with two processes sharing one history index, a conversation the other process just indexed is no longer swept as deleted; only a file confirmed gone is marked missing. Refs #14024 by @chuiwenwei.\n- The sidebar's Projects header now highlights the \"+\" and more-actions buttons the same way on hover. Refs #14041 fixed in #14043 by @lancy69, #14043 by @lancy69.\n\n## Contributors\n\nThanks to this release's contributors: @chuiwenwei, @lancy69\n\n## What's Changed\n* fix(studio): unify project header button highlights by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14043\n* fix(history): an unreadable transcript is a corrupt source, not no results by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14023\n* fix(history): a scan must confirm absence before it marks a source missing by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14024\n* build: use Go 1.26.10 for the crypto/x509 fix (GO-2026-6809) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14050\n* docs(release): studio 2.47.1 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14057\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.47.0...studio-v2.47.1\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002x86_64 \u7528\u6587\u4ef6\u540d\u5e26 amd64 \u7684\u5305\uff0caarch64\uff08\u7edf\u4fe1 UOS\u3001\u9e92\u9e9f\u7b49\uff09\u7528\u5e26 arm64 \u7684\u5305\u3002\u4e5f\u63d0\u4f9b `.AppImage`\uff08\u53ea\u63d0\u4f9b\u4e0b\u8f7d\uff0c\u4e0d\u4f1a\u81ea\u66f4\u65b0\uff1b\u9700\u8981 FUSE 2\uff0c\u6216\u7528 `--appimage-extract-and-run` \u542f\u52a8\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","mentions_count":3}
