/github.com/esengine/DeepSeek-Reasonix/pull/10696))\n- **[Desktop]** **\u4fdd\u6301 macOS Dock \u56fe\u6807\u6bd4\u4f8b** \u2014 macOS \u5b89\u88c5\u5305\u4e2d\u7684\u5e94\u7528\u56fe\u6807\u5728 Dock \u4e2d\u4fdd\u6301\u9884\u671f\u7f29\u653e\u6bd4\u4f8b\u3002 ([#10641](https://github.com/esengine/DeepSeek-Reasonix/pull/10641))\n- **[Desktop]** **\u4fee\u590d\u5207\u6362\u4f1a\u8bdd\u540e\u7684\u901f\u7387\u5f02\u5e38\u98d9\u5347** \u2014 \u6062\u590d\u7684\u4f1a\u8bdd\u73b0\u5728\u6839\u636e\u5339\u914d\u7684\u63d0\u4f9b\u7a0b\u5e8f\u6d3b\u52a8\u95f4\u9694\u6d4b\u91cf\u8f93\u51fa\u3002 ([#10684](https://github.com/esengine/DeepSeek-Reasonix/pull/10684))\n- **[Desktop]** **\u4fee\u590d\u6982\u89c8\u4e0a\u4e0b\u6587\u4e0e\u7528\u91cf\u4e32\u4f1a\u8bdd** \u2014 \u4e0a\u4e0b\u6587\u7528\u91cf\u4e0d\u518d\u4ece\u4e0a\u4e00\u4e2a\u4f1a\u8bdd\u6cc4\u6f0f\u3002 ([#10679](https://github.com/esengine/DeepSeek-Reasonix/pull/10679))\n- **[Desktop]** **\u9632\u6b62\u6e05\u7a7a\u56de\u6536\u7ad9\u540e\u7684\u5e7d\u7075\u4f1a\u8bdd** \u2014 \u6e05\u7a7a\u56de\u6536\u7ad9\u4e0d\u518d\u4e3a\u5df2\u6e05\u9664\u7684\u4f1a\u8bdd\u521b\u5efa\u5e7d\u7075\u884c\u3002 ([#10677](https://github.com/esengine/DeepSeek-Reasonix/pull/10677))\n- **[Desktop]** **\u4fee\u590d\u8fde\u7eed\u5206\u53c9\u540e\u4fa7\u680f\u672a\u663e\u793a** \u2014 \u6765\u81ea\u540c\u4e00\u6765\u6e90\u7684\u8fde\u7eed\u5206\u53c9\u73b0\u5728\u65e0\u9700\u91cd\u542f\u5373\u53ef\u663e\u793a\u5728\u4fa7\u680f\u4e2d\u3002 ([#10673](https://github.com/esengine/DeepSeek-Reasonix/pull/10673))\n- **[Desktop]** **\u4fee\u590d\u5207\u56de\u8fd0\u884c\u4e2d\u4f1a\u8bdd\u65f6\u601d\u8003\u9519\u5e8f** \u2014 \u8fd4\u56de\u8fd0\u884c\u4e2d\u7684\u4f1a\u8bdd\u65f6\uff0c\u63a8\u7406\u4e0d\u518d\u663e\u793a\u5728\u7528\u6237\u6d88\u606f\u4e0a\u65b9\u3002 ([#10670](https://github.com/esengine/DeepSeek-Reasonix/pull/10670))\n- **[Desktop]** **\u4fee\u590d\u4efb\u52a1\u5b8c\u6210\u540e\u5de5\u5177\u7ed3\u679c\u91cd\u590d\u663e\u793a** \u2014 \u5df2\u5b8c\u6210\u7684\u5de5\u5177\u8c03\u7528\u4e0d\u518d\u51fa\u73b0\u5728\u6700\u7ec8\u7b54\u6848\u4e0b\u65b9\u3002 ([#10590](https://github.com/esengine/DeepSeek-Reasonix/pull/10590))\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u6a21\u578b\u66f4\u6539\u540e\u4fdd\u7559\u540e\u53f0\u7f51\u5173** \u2014 \u4fdd\u5b58\u6a21\u578b\u8bbe\u7f6e\u4e0d\u518d\u5728\u540e\u53f0\u4efb\u52a1\u8fd0\u884c\u65f6\u963b\u585e\u540e\u7eed\u6d88\u606f\u3002 ([#10688](https://github.com/esengine/DeepSeek-Reasonix/pull/10688))\n\n### \u6539\u8fdb\n\n- **[Desktop \u00b7 CLI]** **\u66f4\u65b0 DeepSeek \u4e0e MiMo \u6a21\u578b\u9009\u9879** \u2014 \u65b0\u5efa DeepSeek \u5b98\u65b9\u8fde\u63a5\u9ed8\u8ba4\u4f7f\u7528 deepseek-flash\u3002MiMo \u660e\u786e\u533a\u5206 API \u4e0e Token Plan\uff0c\u5e76\u52a0\u5165 V2.6 Pro\u3001Flash\uff0c\u540c\u65f6\u4fdd\u7559\u5df2\u6709\u9ed8\u8ba4\u6a21\u578b\u548c\u7528\u6237\u9009\u62e9\u3002 ([#10624](https://github.com/esengine/DeepSeek-Reasonix/pull/10624), [#10655](https://github.com/esengine/DeepSeek-Reasonix/pull/10655))\n\n### \u4fee\u590d\n\n- **[Desktop \u00b7 CLI]** **\u6062\u590d Windows Shell \u4e0e\u8def\u5f84\u517c\u5bb9\u6027** \u2014 \u6062\u590d Git Bash \u4e0e Shell \u8bbe\u7f6e\uff0c\u5e76\u7edf\u4e00 Junction \u8def\u5f84\u8eab\u4efd\uff0c\u907f\u514d\u540c\u4e00\u9879\u76ee\u7684\u7b49\u4ef7\u8def\u5f84\u5e72\u6270\u5347\u7ea7\u6062\u590d\u3002 ([#10617](https://github.com/esengine/DeepSeek-Reasonix/pull/10617), [#10656](https://github.com/esengine/DeepSeek-Reasonix/pull/10656))\n- **[Desktop \u00b7 CLI]** **\u4fee\u590d\u624b\u52a8\u538b\u7f29\u4e0e\u91cd\u590d\u63d0\u4ea4** \u2014 \u624b\u52a8\u538b\u7f29\u6b63\u786e\u8bc6\u522b\u53ef\u538b\u7f29\u5386\u53f2\u5e76\u663e\u793a\u8fdb\u5ea6\uff0c\u963b\u6b62\u91cd\u590d\u63d0\u4ea4\u4e14\u4fdd\u7559\u6240\u5c5e\u4f1a\u8bdd\u56de\u6267\uff1b\u53d6\u6d88\u64cd\u4f5c\u4e0d\u518d\u63d0\u4ea4\u65b0\u7684\u6458\u8981\u6295\u5f