onix/pull/12260\n* test(boot): the VCS prefix test takes its own probe answer by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12273\n* fix(studio): the status-bar wallet follows the pane's model source by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12271\n* test(update): pin the windows-arm64 platform contract by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12270\n* fix(styles): semantic hues read as text through their ink token by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12274\n* fix(studio): offer Retry on a held uncertain queue entry by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12275\n* feat(desktop): make reading the provider's model list discoverable by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12279\n* test(studio): an elicitation answer settles inside its test by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12280\n* fix(extension): report a missing sidecar as a typed, localized notice by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12281\n* fix(studio): count only running sub-agents on the status chip by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12282\n* fix(studio): isolate theme import feedback by connection by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12088\n* fix(studio): scope theme inventory reads to their connection by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12090\n* fix(desktop): a followed link and the empty column share one tab request by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12285\n* fix(studio): make running status easier to notice by @par73e in https://github.com/esengine/DeepSeek-Reasonix/pull/12066\n* ci(studio): build and smoke-test a native Windows ARM64 package by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12272\n* ci(release): ship a native Windows ARM64 Studio by @esengin