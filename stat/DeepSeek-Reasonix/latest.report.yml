_at":"2026-10-27T01:42:00Z","updated_at":"2026-10-27T01:42:00Z"},{"id":680099753,"node_id":"RA_kwDOSIatD84oiX-p","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:92e088ab3105c4d9418587bc233014be8b37825f7de79a4c36d35fbe1d0ff67c","download_count":4,"created_at":"2026-10-27T01:42:00Z","updated_at":"2026-10-27T01:42:00Z"}],"body":"本版修复 2.53.0 里放大后的设置窗口头部按钮点不动的问题，并让语义路由用量计入共享预算。\n\n## 修复\n\n- 2.53.0 里放大后的设置窗口，头部的收起、关闭、最小化、最大化按钮和搜索框点不动；现在都可以点击。修复 #14596 fixed in #14597。\n- 语义路由用量在路由前就绑定根预算，计入规划与执行共享的软额度，保留缓存决定和任务边界。关联 #14595 by @SivanCola。\n\n## 贡献者\n\n感谢本版本的贡献者：@SivanCola\n\n---\n\n<!-- lang:en -->\n\n## Fixed\n\n- In 2.53.0 the enlarged settings window's header buttons (collapse, close, minimise, maximise) and search field did not respond; they do now. Fixes #14596 fixed in #14597.\n- Semantic routing usage is bound to the root budget before routing, counting in the soft limit shared by planning and execution, with cached decisions and task boundaries kept. Refs #14595 by @SivanCola.\n\n## Contributors\n\nThanks to this release's contributors: @SivanCola\n\n## What's Changed\n* fix(control): include semantic routing in root budgets / 语义路由计入根预算 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14595\n* fix(studio): the full-window settings header's buttons respond to clicks by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14597\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.53.0...studio-v2.53.1\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n","mentions_count":2}
