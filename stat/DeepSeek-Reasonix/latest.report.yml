f1a\u8bdd\u4e0d\u53ef\u7528\u201d\uff0c\u8981\u5148 /reload \u624d\u884c\uff1b\u73b0\u5728\u542f\u52a8\u540e\u5373\u53ef\u7528\u3002\u5173\u8054 #12073\u3002\n- \u7528\u91cf\u9875\u7684\u300c\u5b9e\u4ed8\u300d\u4e0d\u518d\u5305\u542b\u8ba2\u9605\u7b49\u4ef7\uff08Token Plan \u4e4b\u7c7b\uff09\u7684\u4f30\u7b97\uff1b\u4f30\u7b97\u5355\u72ec\u4e00\u884c\u6807\u4e3a\u300c\u7b49\u4ef7\u4f30\u7b97\u300d\uff0c\u6bcf\u65e5\u660e\u7ec6\u91cc\u4e5f\u5e76\u6392\u663e\u793a\u3002\u8bae\u9898 #13276\u3002\n- \u5df2\u9009\u300c\u81ea\u52a8\u4e0b\u8f7d\u300d\u65f6\uff0c\u6253\u5f00\u8bbe\u7f6e\u91cc\u7684\u7248\u672c\u9875\u4f1a\u7acb\u5373\u68c0\u67e5\u4e00\u6b21\u65b0\u7248\u672c\u5e76\u5f00\u59cb\u4e0b\u8f7d\uff0c\u4e0d\u5fc5\u518d\u7b49\u6700\u957f\u4e00\u5929\u7684\u540e\u53f0\u68c0\u67e5\u3002\u8bae\u9898 #13683 fixed in #13875\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@SivanCola\n\n---\n\n<!-- lang:en -->\n\nThis release adds scheduled tasks, session moves, phone reminders, WSL remotes, a Git panel, a contribution board and rules directories, lets reasoning depth change mid-turn, and fixes browser scaling, terminal slowdown and sub-agent image reading.\n\n## New\n\n- `reasonix schedule add|list|tick` and friends: a read-only task runs when you confirm it in a terminal; call `tick` from your OS scheduler. Refs #11406.\n- While Studio is open and visible (a window or tray icon), it runs the schedules you confirmed; only one kernel ticks at a time. Refs #11406.\n- A conversation can be moved up or down from its menu or with Alt+Arrow on its row; the order is kept by the kernel and survives restarts. Refs #11420.\n- Linux gets an `.AppImage` download for amd64 and arm64 that runs in place. It does not update itself: download the next release. Refs #11653.\n- Full-screen browser and workbench with the conversation folded away; Esc or the button restores the split, and it exits by itself when something needs your decision. Refs #11721.\n- phones on the same account can be reminded when an action awaits approval, the model asks, or a turn fails; only the kind and a count are sent. Off by default on both sides. Refs #11878.\n- When an MCP server refuses a call for lack of access, the model stops and you can click \"Grant more access\" on its row; you are asked every time. Refs #11959.\n- You can withdraw your own report from My feedback (or /feedback withdraw in the terminal); its issue is closed, and a report with an outcome can no longer be withdrawn. Refs #11995.\n- An optional level-up notice (Settings \"Tell me when my level goes up\", off by default): one note at the top of the window, one line in /feedback list. Refs #12025.\n- In a My feedback thread, your level badge now sits beside your own replies and never beside a maintainer's. Refs #12025.\n- On a linked device, My feedback also lists reports and replies from your other linked devices; the terminal gains /feedback link, unlink, links. Refs #12073.\n- Settings, Remote can add a WSL distribution on this PC. The kernel runs in it and stops with it when Studio closes; conversations are kept. Refs #12225.\n- In the terminal /mcp panel, press a to sign in to a server that answered 401, or u to grant one the extra access it asked for; you are asked first. Refs #12357, #11959.\n- ACP sessions accept `additionalDirectories`, so a multi-folder workspace can give a session extra write roots, for that session only and with the usual vetting. Refs #13114.\n- ACP supports `$/cancel_request`, `messageId` on chunks and tool names on permission requests, and forwards MCP forms and pages when advertised. Refs #13114.\n- Opt-in trace export: once your user config enables it and names a collector, each turn goes to your own observability stack as OpenTelemetry traces; off by default. Refs #13115.\n- A contribution board in the feedback panel, ranked per release; you choose to join, preview the name and can leave. Terminal: /feedback board. Refs #13142.\n- Move a conversation to another project from its menu; permissions, checkpoints, task logs and queued messages stay behind and are removed. Refs #13370.\n- A Test connection button beside the SearXNG address says why an instance does not answer; it tests only the saved one, never a metadata address. Refs #13541.\n- Large files use native references or streaming; the default 1 GiB upload safety ceiling is user-configurable. Refs #13544 by @SivanCola.\n- (experimental, not run against the real endpoint) a native Gemini provider on the Interactions API with thinking, tools and video. Refs #13615.\n- a Settings switch (off by default) to hand a public video address you wrote to the model vendor, which visits it itself; Zhipu GLM and Gemini (YouTube). Refs #13616.\n- a sub-agent's panel row, full-record header and nested card now show the model and effort it actually ran on, failed or interrupted runs included. See #13640 fixed in #13812.\n- The model can now ask you to turn on a switch it needs (such as dispatching to another project), applied only when you confirm; boundary settings it can never change. Refs #13678.\n- Type # in the message box to reference a past conversation of this workspace as read-only material; search hits can be referenced too, with a size limit in Settings. Refs #13687, #11942.\n- The model can give a running sub-agent more guidance with task's task_id, read at its next tool call; Settings sets the size and per-minute limits. Refs #13693.\n- A mod's install preview states full trust and a static listing; a mod can draw a band above the prompt, and its questions say whose they are. Refs #13694.\n- Hovering your own message now shows when it was sent next to its action icons, so a long-running task's start can be checked against it. Refs #13697.\n- Settings > Extensions can remove a skill of your own or the project's, after a confirmation naming the place to be deleted; built-in and package skills do not offer it. Refs #13714 fixed in #13725.\n- The terminal's /mcp panel can now add and remove MCP servers (n, d), showing the full command it would run and asking you to confirm first. Refs #13754.\n- A Git panel in the workbench: a folder tree of changes to stage and discard, push with a preview, commit details, and a section per repository. Refs #13821.\n- In the terminal, /btw <question> asks a read-only side question: the answer is shown once and is not saved to the session or sent into its prompt. Refs #7950 fixed in #13757.\n- `reasonix acp --permission-mode`, for hosts embedding Reasonix as a subagent, fixes the approval posture: clients can lower it, never raise it; a higher saved posture is clamped. Issue #13839.\n- A connection can declare the format its balance endpoint answers in; a relay must pick one or shows as not configured and is not sent the key. Refs #13736.\n- Settings can start new conversations in plan mode (agent.default_mode, off by default); existing conversations keep their own mode. Refs #7852 fixed in #13760.\n- The status bar shows which of the vendor's billing windows (peak or off-peak) the model is in and how long until it changes, only where the model is billed at the vendor's own rate. Refs #8853.\n- Studio Persona settings add user-level prefix/suffix text and a runtime-context switch, preserving built-in guidance. Applies at the next session build. Refs #13588 by @SivanCola.\n- A model's price in the connection editor can carry a source link and a check date (UTC); only the host is shown, the link opens when clicked and is never fetched. Issue #13276.\n- Rules directories (.reasonix/rules, .claude/rules and the user's rules folder), optionally scoped to files with paths:; the cache-stable prefix is untouched. Refs #9886 fixed in #13766.\n- Tools can be turned off by name ([tools] disabled, a switch per tool in Settings): they leave every request and a call is refused; tools another feature needs stay, with a note. Refs #8394 fixed in #13763.\n\n## Changed\n\n- when the provider takes reasoning depth per request, changing it no longer rebuilds the session and works mid-turn, taking effect on the next request. See #11411.\n- a session waiting on you gives up its write claim, Auto Guard and sandbox-escape asks included; contention reaches the model and receipt, and the longest wait is a setting. See #11531 fixed in #13842.\n- The task tool gains a task_id parameter, so the tool-description cache is cold once on the first turn after upgrading and then warm again. Refs #13693.\n- Over ACP, a failed turn now ends with a JSON-RPC error (-32603, data.code turn_failed), not the non-standard stopReason \"error\". Refs #13703.\n- Over ACP, opening a session with a keyless model or no provider now returns the protocol's \"Authentication required\" error (-32000) so clients can offer reasonix setup. Refs #13705.\n- Over ACP, a turn paused as unverified now ends with end_turn, a paused outcome and a [paused] receipt at the end of the text. Refs #13706.\n- Over ACP, the vendor status notifications are sent only to clients that declare statusUpdates at initialize, and the transcript path moves into the response _meta. Refs #13721.\n- the Dispatch switch is your consent: tasks and replies come in with no card, and the opened session keeps the sender's model, preset, approval mode and planning, never wider. See #13526.\n- existing full-trust permission extensions are now also consulted for installed MCP tools (they can only tighten). See #13694.\n- A message let in by a standing release starts only over a pause the host set itself, never over one you pressed; it stays queued for you. Refs #13775.\n- Local and SSH projects share one list. Open Project moves to the heading's plus button, alongside collapse/expand all. Commit da051abb2.\n- Neutral session selection offers opt-in hover Pin and Archive, off by default; session menus remain available. Environment routing, repeated clicks, focus and stream budgets are fixed. PR #13638 by @SivanCola.\n- Remote reads and unqualified opens share the host default. Existing panes cannot redirect a read or bypass a disabled host. PR #13638 by @SivanCola.\n- Unknown SSH hosts are refused before connecting; remote mutation request bodies are limited to 64 KiB. PR #13638 by @SivanCola.\n\n## Fixed\n\n- The code editor and its search bar now follow the interface text size in Appearance instead of staying at 12px and 11px. Refs #11577.\n- When a report is withdrawn, its mirror GitHub issue is now closed automatically as not planned. Refs #11995.\n- After the data root is moved, a conversation the window remembers by its old location opens from the new session folder by file name. Refs #13152.\n- [[keep]] turns now have their own budget (15% of the window, newest first); older ones fold with a notice. Shared-window models fold before the reply runs out of room. See #13320, #12773.\n- when the provider refuses a compaction's summary request as too large, it is retried with a smaller input (70%, 50%, 35%) instead of giving up the fold. See #13320.\n- with an OS sandbox confining the shell to its folder, sessions in two projects of one git repository no longer wait on each other for bash writes; without one they still do. See #13335 fixed in #13851.\n- a delegated task naming a pasted screenshot (a file under .reasonix/attachments) now gives the sub-agent the image on the vision model; skill sub-agents no longer drop it. See #13642 fixed in #13876.\n- Opening the branch menu just as a pane settles no longer shuts it or leaves it loading forever. Refs #13674.\n- When cross-project dispatch is refused because the user's switch is off, the error now says so and names the setting, not a generic \"cannot open sessions\". Refs #13677 fixed in #13679.\n- When a newer release is known, the Version row in the settings list now carries the same mark as the gear, so the update entry is easy to find. Refs #13682 fixed in #13685.\n- on Windows the header and tab always read \"New chat\" when the transcript file name had upper-case letters (for example a custom model name). Refs #13684.\n- Pressing the title bar search button while the find bar is open now closes it instead of only re-focusing; the shortcut and the palette still open it. Refs #13696 fixed in #13701.\n- The action icons under your own messages (copy, edit, rewind) are now the same size as those under a reply instead of smaller. Refs #13699 fixed in #13704.\n- The rail's search box stays open while it holds a query, so the first press on a result is no longer lost to the list moving up. Refs #13708.\n- Removing a skill whose SKILL.md sits at the top of a skills folder deleted the whole folder with every other skill; it now deletes only that file. Refs #13714 fixed in #13725.\n- the web-search model picker no longer lists models from unadded connections, and a refused pick now says \"not added\" rather than \"removed\". Refs #13806 fixed in #13813.\n- Over an HTTP connection a refused `!` command now stays selected in the box, so what you type next replaces it and the next ordinary message sends. Refs #13810.\n- A page the agent laid out wider than the pane (for example 1440 wide) showed only its left part in the built-in browser; it is now scaled to fit. Refs #13811 fixed in #13835.\n- A built-in browser page given a viewport smaller than the panel is centred at its own size, and clicks on a page scaled to fit the panel land where they were aimed. Refs #13811 fixed in #13835.\n- when a project or external folder is moved, renamed or deleted, tools now say the folder is gone instead of a bare system error, and the window prompts to choose it again. Refs #13833.\n- OpenCode Go's documented endpoint (opencode.ai/inference/go/\u2026) no longer fails with 400 for lack of the session header. Refs #13849 fixed in #13860.\n- /effort on a custom provider with no declared reasoning levels now says so and points at supported_efforts instead of claiming the model does not support them. Refs #13857 fixed in #13863.\n- Two model services on one host but different ports were merged into one and the new one never showed; the port is now part of the address, and exact duplicates are listed too. Refs #13858 fixed in #13865.\n- the terminal UI slowed down as a command's output, an answer or its thinking grew, since each appended piece copied everything so far; appending now costs the same at any length. See #13872.\n- clicks the agent sent the built-in browser were dropped yet reported done while Studio was minimized; the window is now raised unseen for input, then minimized again (Windows). See #13628.\n- A message from another session that you approved on its card now starts even when the send queue is paused; what was queued before stays paused. Refs #13775.\n- An @token in the text of a message from another session is no longer read as a local file reference, and an unreadable one no longer pauses the send queue. Refs #13775.\n- In the terminal, /feedback said \"not available in this session\" until a /reload; it now works from the start. Refs #12073.\n- The usage page's paid figure no longer includes a subscription-equivalent estimate; it is its own labelled line and sits beside each day. Issue #13276.\n- With automatic download chosen, opening the Versions page now checks for a release at once and starts the download, instead of waiting for the next daily background check. Issue #13683 fixed in #13875.\n\n## Contributors\n\nThanks to this release's contributors: @SivanCola\n\n## What's Changed\n* chore(repolint): scope five frontend-parity edges where a frontend reaches the same behaviour another way by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13675\n* fix(desktop): the branch menu survives the chip settling, and its list is re-read when the root moves by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13674\n* fix(desktop): the code editor's text and find panel follow the interface text size by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13676\n* fix(peers): say that the dispatch switch is off, apart from a host that cannot open panes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13679\n* feat(settings): declare every user-config key with a class, an effect timing and a secret flag by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13680\n* fix(desktop): raise a minimized window unseen so the agent's clicks reach the built-in browser by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13681\n* fix(studio): reference native files and stream attachment uploads / \u5927\u6587\u4ef6\u8def\u5f84\u5f15\u7528\u4e0e\u6d41\u5f0f\u4e0a\u4f20 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13544\n* fix(settings): mark the Version row when an update is known by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13685\n* refactor(config): move ProviderEntry's model and key methods out of config.go by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13691\n* fix(studio): key each skill metadata row / \u6280\u80fd\u5143\u6570\u636e\u884c\u8865\u4e0a key by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13688\n* fix(find): the title bar search button closes an open find bar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13701\n* feat(settings): the model can propose a setting change and the user confirms it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13690\n* fix(acp): a failed session/prompt turn is a JSON-RPC error with a typed code by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13703\n* feat(settings): draw the setting card and point at a setting only the user may change by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13698\n* fix(chat): the action icons under your own message match the reply's size by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13704\n* feat(chat): show when your own message was sent in its action row by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13707\n* fix(acp): a host-paused turn ends with end_turn, a paused outcome and a receipt by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13706\n* feat(peers): the dispatch switch is the consent between a session and the sessions it opens by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13709\n* fix(agent): give [[keep]] turns a budget of their own and stop the fold ceiling where the send-time output check stops by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13711\n* feat(delegation): read a sub-agent run's conversation while it runs by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13717\n* feat(studio): reference a past conversation of this workspace from the message box by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13708\n* feat(gemini): a native Gemini provider on the Interactions API, with video (experimental) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13712\n* fix(acp): vendor notifications reach only clients that declare them; transcriptPath rides _meta by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13721\n* fix(studio): the rail search box stays open while it holds a query, so the first press on a result is a click by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13715\n* fix(delegation): a run recorded complete is not live while its owner has yet to let go by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13726\n* feat(mcp): let the user grant a server the access it asked for by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13730\n* feat(acp): session-scoped additionalDirectories as write roots by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13731\n* feat(studio): move a conversation up or down in its project's list, kept by the kernel by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13733\n* feat(search): test a SearXNG address from settings and say why it does not answer by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13659\n* feat(tui): sign in to an MCP server, or grant it more access, from /mcp by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13732\n* feat(video): hand a public video address the user wrote to the model vendor (off by default) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13718\n* feat(persona): add a system persona to Studio / \u65b0\u589e Studio \u7cfb\u7edf\u4eba\u8bbe by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13588\n* docs(sandbox): what the Linux sandbox does in a container, measured by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13749\n* feat(otlp): opt-in OpenTelemetry trace export, user config only by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13742\n* feat(acp): cancel one request, message ids, elicitation by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13746\n* fix(peers): a dispatch proof is valid once per sequence number, and the adopt/spool boundaries are pinned by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13743\n* feat(modhost): run Claude Code mods as tighten-only extension runtimes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13724\n* feat(schedule): a tick that runs what is due, and the schedule commands by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13747\n* feat(tui): /btw asks a read-only side question that is not saved to the session by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13757\n* fix(completion): cut a declined check's command at a character boundary by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13762\n* fix(hub): open a session by its pre-move path after the state root moves by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13744\n* refactor(remote): bootstrap depends on the file calls it uses, not on SFTP by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13761\n* feat(agent): start new conversations in plan mode when the user chose it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13760\n* feat(feedback): withdraw your own report from My feedback or /feedback withdraw by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13753\n* feat(delegation): report an estimated token rate while a sub-agent streams by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13750\n* feat(remote): a host entry has a kind, and a WSL distribution is one by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13765\n* feat(studio): the browser and workbench can be viewed full screen with the conversation folded away by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13686\n* feat(skills): remove a skill from Settings, and never take its whole folder root with it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13725\n* feat(studio): move a conversation to another project, carrying the conversation and not what the old project allowed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13737\n* feat(schedule): the Studio host runs the ticker while supervised and visible by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13752\n* feat(rules): rules directories, delivered on the turn and scoped by paths by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13766\n* fix(acp): a session that cannot open for want of credentials is the authentication-required error by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13705\n* feat(feedback): close the mirror issue of a withdrawn report by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13768\n* feat(delegation): guide a running sub-agent through task_id or from the window by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13739\n* feat(feedback): show linked devices' reports in My feedback and link from the terminal by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13770\n* feat(feedback): show the reporter's level badge beside their replies in a thread by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13772\n* feat(receipt): say when a Claude Code mod's effects were not observed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13773\n* feat(integrations): run Reasonix as a DeepSeek Harness subagent, with docs, a plugin package and a market index by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13771\n* feat(remote): bring up a kernel in a WSL distribution and reach it over loopback by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13767\n* feat(studio): Claude Code mods in the window: install preview, the band above the prompt, mod questions (settings block hidden) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13764\n* feat(tui): add and remove MCP servers from the /mcp panel by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13776\n* refactor(schedule): run the scheduled child from a small package the Studio host can import without the command line by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13779\n* feat(desktop): add a WSL distribution as a remote machine from Settings by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13781\n* feat(agent): count a call whose arguments copy text an external result gave the task by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13783\n* feat(cli): add, test and connect a WSL machine from the command line by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13777\n* fix(sessioninbox): stop publishing an empty queue when the bodies cannot be read by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13246\n* docs(dsh): an installed plugin starts off and must be switched on by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13789\n* fix(cli): name the terminal's feedback surface in its first build so /feedback works from the start by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13790\n* fix(peers): the text of a message from another session is not read for file references by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13787\n* feat(feedback): tell the person once when their level goes up, if they asked by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13793\n* fix(memory): repair a rename interrupted after retiring the old file by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13797\n* Unify local and SSH project navigation / \u7edf\u4e00\u672c\u673a\u4e0e SSH \u9879\u76ee\u4fa7\u680f by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13638\n* chore(deps): bump the npm group in /desktop/frontend-next with 7 updates by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/13808\n* feat(extension): a mod answers a tool call, adds turn context, reads the session and queues a prompt by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13778\n* fix(settings): do not offer search models from connections that were never added by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13813\n* feat(delegation): sub-agents show the model and effort they ran on by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13812\n* fix(agent): release a stale-context maintenance block on the growth that caused it by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13798\n* chore(deps): bump golang.org/x/mod from 0.41.0 to 0.42.0 in /desktop in the go group by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/13799\n* chore(deps-dev): bump the npm group in /desktop/electron with 2 updates by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/13807\n* docs: point to the DeepSeek Harness integration from the README and the guide by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13816\n* chore(deps): bump the actions group with 2 updates by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/13804\n* fix(delegation): the dispatch profile stays the call's selection by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13819\n* chore(deps): bump the go group with 11 updates, including the desktop module by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13809\n* feat(host): tell enrolled phones that something is waiting, and manage them from the desktop by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13795\n* test(acp): drive the agent with the official SDK and hold its output to the shipped schema by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13827\n* feat(cli): refuse remote subcommands that change the book or open a link for an agent's shell by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13784\n* feat(release): build and verify an AppImage of Studio on Linux (download only) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13782\n* fix(peers): a message the person let in starts over a paused queue, by what paused it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13791\n* test: three timing-dependent tests no longer depend on wall-clock thresholds or cleanup races by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13830\n* feat(billing): a balance endpoint declares the format it answers in by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13828\n* test(mcp): hold step-up authorization at the boot boundary by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13832\n* feat(phone): remind this phone through Web Push, with its own key and a push-only service worker by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13822\n* fix(studio): show a page the agent laid out wider than the pane whole, scaled to fit by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13835\n* fix(phone): say a browser that cannot reach its push service is that, not an account outage by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13836\n* feat(status): show which of the vendor's billing windows the model is in by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13838\n* feat(tools): turn tools off by name, one registry removal for every surface by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13763\n* feat(studio): one Git panel: a changes tree, discard, push with a preview, commit details and a section per repository by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13834\n* test(boot): bound the catalog close in cleanup by the hang budget by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13846\n* chore(security): declare the Git push path and the host-only route list sensitive by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13850\n* fix(workspace): a writer with no declared extent holds its own folder, not the whole repository by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13851\n* feat(acp): --permission-mode fixes the session posture and caps what a client can raise by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13844\n* fix(effort): say a model's levels are undeclared, and where to declare them by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13863\n* test(control): cover the push trust gate and hold control/git_push.go to it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13862\n* fix(providers): recognise OpenCode Go under it