8\u5bf9\u5e94\u6309\u94ae\u65c1\uff0c\u65b0\u589e\u300c\u6d4b\u8bd5\u5df2\u542f\u7528\u6a21\u578b\u300d\u6309\u94ae\u4e0e\u6c47\u603b\u884c\uff0c\u5e95\u90e8\u56fa\u5b9a\u4fdd\u5b58\u680f\u652f\u6301 Ctrl/Cmd+S (#12189, #12193, #12196, #12202)\n- \u670d\u52a1\u5546\u8868\u5355\uff1a\u6709\u672a\u4fdd\u5b58\u4fee\u6539\u65f6\u5207\u6362\u670d\u52a1\u6216\u65b0\u589e\u4f1a\u4ea7\u751f\u8be2\u95ee\uff0c\u6574\u4f53\u8fde\u63a5\u68c0\u67e5\u5931\u8d25\u65f6\u4f1a\u7ed9\u51fa\u5206\u7c7b\u540e\u7684\u539f\u56e0 (#12185, #12191)\n- \u6a21\u578b\u8c03\u7528 `render_chart` \u540e\uff0c\u5bf9\u8bdd\u91cc\u76f4\u63a5\u753b\u51fa\u67f1\u72b6\u56fe\u3001\u6298\u7ebf\u56fe\u6216\u997c\u56fe\uff1b\u7ec8\u7aef\u754c\u9762\u663e\u793a\u4e3a\u5bf9\u9f50\u7684\u6570\u636e\u8868 (#12179, #12181)\n- \u6280\u80fd\u652f\u6301 `paths:` \u58f0\u660e\uff1a\u53ea\u6709\u4f1a\u8bdd\u78b0\u8fc7\u5339\u914d\u7684\u6587\u4ef6\u540e\uff0c\u8be5\u6280\u80fd\u624d\u4f1a\u51fa\u73b0\u5728\u6a21\u578b\u7684\u6280\u80fd\u5217\u8868\u91cc (#12192, #12195, #12199)\n- \u4f1a\u8bdd\u5b8c\u6210\u4f46\u8fd8\u6ca1\u770b\u8fc7\u65f6\uff0c\u4fa7\u680f\u548c\u6807\u7b7e\u9875\u4f1a\u663e\u793a\u6807\u8bb0\uff0c\u91cd\u542f\u540e\u4ecd\u5728\uff0c\u6253\u5f00\u8be5\u4f1a\u8bdd\u624d\u6e05\u9664 (#12231, #12233, #12234)\n- \u624b\u673a\u7f51\u9875\u7aef\u53ef\u4ee5\u53ea\u8bfb\u67e5\u770b\u4ee3\u7406\u6b63\u5728\u4f7f\u7528\u7684\u6d4f\u89c8\u5668\u6807\u7b7e\u9875 (#12209)\n\n## \u53d8\u66f4\n\n- \u538b\u7f29\u89e6\u53d1\u6539\u4e3a\u53c2\u8003\u670d\u52a1\u5546\u4e0a\u6b21\u62a5\u544a\u7684\u63d0\u793a\u8bcd\u5927\u5c0f\uff0c\u5e26\u622a\u56fe\u7b49\u672c\u5730\u4f30\u7b97\u504f\u4f4e\u7684\u4f1a\u8bdd\u4e0d\u518d\u62d6\u5230\u8d85\u7a97\u53e3\u624d\u538b\u7f29 (#12222)\n- \u538b\u7f29\u4e4b\u540e\uff0c\u6a21\u578b\u81ea\u5df1\u5199\u7684\u4efb\u52a1\u6e05\u5355\u3001\u5df2\u5168\u90e8\u5b8c\u6210\u7684\u6e05\u5355\u3001\u6298\u53e0\u671f\u95f4\u6539\u8fc7\u7684\u6587\u4ef6\u548c\u5df2\u901a\u8fc7\u7684\u68c0\u67e5\u4f1a\u91cd\u65b0\u968f\u8bf7\u6c42\u5e26\u4e0a (#12216)\n- \u9644\u4ef6\u88ab\u62d2\u7edd\u65f6\uff0c\u9644\u4ef6\u6761\u76f4\u63a5\u663e\u793a\u539f\u56e0\uff08\u7c7b\u578b\u4e0d\u652f\u6301\u3001\u8fc7\u5927\u3001\u4e3a\u7a7a\u3001\u65e0\u6cd5\u8bfb\u53d6\u3001\u5199\u76d8\u5931\u8d25\uff09 (#12239)\n- MCP \u63d0\u793a\u8bcd\u83b7\u53d6\u5931\u8d25\u65f6\uff0c\u63d0\u793a\u4f1a\u5199\u660e\u662f\u54ea\u4e2a\u63d0\u793a\u8bcd\u3001\u4e3a\u4ec0\u4e48\u5931\u8d25\uff0c\u6a21\u578b\u4e0b\u4e00\u8f6e\u4e5f\u4f1a\u77e5\u9053\u8fd9\u6b21\u8c03\u7528\u5931\u8d25\u4e86 (#12241)\n- \u5e02\u573a\u5728\u6ce8\u518c\u8868\u8fde\u4e0d\u4e0a\u65f6\uff0c\u663e\u793a\u4e0a\u4e00\u6b21\u6210\u529f\u7684\u6d4f\u89c8\u7ed3\u679c\u5e76\u6807\u660e\u662f\u7f13\u5b58 (#12210)\n- \u547d\u4ee4\u884c\uff1aCtrl+L \u6e05\u5c4f\uff0c\u4e0e `/cls` \u76f8\u540c\uff1b\u8865\u5168\u83dc\u5355\u548c `/resume` \u9009\u62e9\u5668\u652f\u6301 Ctrl+P/Ctrl+N \u4e0a\u4e0b\u79fb\u52a8 (#12223 by @xxoingr, #12217 by @xxoingr)\n- \u6dfb\u52a0\u670d\u52a1\u5546\u7684\u63a2\u6d4b\u88ab\u62d2\u7edd\u65f6\u4fdd\u7559\u9519\u8bef\u4ee3\u7801\uff0c\u4e0d\u518d\u628a\u5bf9\u7aef\u56de\u663e\u7684\u5185\u5bb9\uff08\u53ef\u80fd\u542b\u5bc6\u94a5\uff09\u5e26\u8fdb\u63d0\u793a (#12212 by @xxoingr)\n\n## \u4fee\u590d\n\n- \u5728\u540e\u53f0\u542f\u52a8\u7684\u547d\u4ee4\u4e0d\u518d\u88ab\u753b\u6210\u7ea2\u8272\u5931\u8d25\uff1b\u4e4b\u540e\u8bfb\u53d6\u5230\u540e\u53f0\u4efb\u52a1\u5931\u8d25\u6216\u8d85\u65f6\u65f6\uff0c\u8be5\u8c03\u7528\u4f1a\u6b63\u786e\u6807\u4e3a\u5931\u8d25 (#12198, #12213 by @xxoingr)\n- \u540c\u65f6\u5f00\u7740\u591a\u4e2a\u4f1a\u8bdd\u65f6\uff0c\u88ab\u5176\u4ed6\u7a97\u683c\u906e\u4f4f\u7684\u7a97\u683c\u4e0d\u518d\u6309\u6d41\u5f0f\u8f93\u51fa\u901f\u5ea6\u91cd\u7ed8\uff0c\u754c\u9762\u660e\u663e\u66f4\u6d41\u7545 (#12237)\n- \u6253\u5f00\u53cd\u9988\u5bf9\u8bdd\u6846\u65f6\u80cc\u666f\u4e0d\u518d\u505a\u6a21\u7cca\uff0c\u8fd0\u884c\u4e2d\u7684\u56de\u5408\u4e0d\u518d\u8ba9 GPU \u6301\u7eed\u6ee1\u8f7d (#12220)\n- \u8fde\u63a5\u8fdc\u7a0b\u673a\u5668\u65f6\u4f1a\u63a5\u5165\u5df2\u7ecf\u5728\u8fd0\u884c\u7684\u670d\u52a1\uff0c\u4e0d\u518d\u53e6\u8d77\u4e00\u4e2a\u4e89\u62a2\u4f1a\u8bdd\u79df\u7ea6\uff0c\u4e5f\u4e0d\u518d\u5220\u6389\u5b83\u53d1\u5e03\u7684\u7aef\u53e3\u6587\u4ef6 (#12229)\n- \u4fdd\u5b58\u670d\u52a1\u5546\u540e\u7f16\u8f91\u5668\u5728\u5217\u8868\u91cd\u65b0\u8bfb\u53d6\u4e4b\u540e\u624d\u91cd\u5efa\uff0c\u4e0d\u518d\u663e\u793a\u65e7\u503c (#12177)\n- \u670d\u52a1\u5546\u7f16\u8f91\u548c\u6dfb\u52a0\u5728\u4fdd\u5b58\u671f\u95f4\u9501\u5b9a\u8349\u7a3f\uff0c\u4fdd\u5b58\u671f\u95f4\u7684\u4fee\u6539\u4e0d\u4f1a\u518d\u9759\u9ed8\u4e22\u5931\uff1b\u6539\u5730\u5740\u540e\u4f1a\u4e22\u5f03\u65e7\u5730\u5740\u7684\u63a2\u6d4b\u7ed3\u679c\uff0c\u6a21\u578b\u68c0\u67e5\u6cbf\u7528\u8868\u5355\u91cc\u7684\u4ee3\u7406\u7ed5\u8fc7\u8bbe\u7f6e (#12167 by @KHG420, #12170 by @KHG420, #12174 by @KHG420, #12175 by @KHG420)\n- \u5907\u4efd\u9762\u677f\u5728\u521b\u5efa\u3001\u6062\u590d\u548c\u5220\u9664\u8fdb\u884c\u4e2d\u9501\u5b9a\u8f93\u5165\uff0c\u4e0d\u4f1a\u91cd\u590d\u63d0\u4ea4\u5220\u9664\uff1b\u53d6\u6d88\u5168\u90e8\u7c7b\u522b\u540e\u91cd\u65b0\u52a0\u8f7d\u4ecd\u4fdd\u6301\u4e3a\u7a7a (#12178 by @KHG420, #12180 by @KHG420, #12183 by @KHG420, #12184 by @KHG420)\n- \u8bb0\u5fc6\u9762\u677f\u4fdd\u5b58\u3001\u6062\u590d\u6216\u9057\u5fd8\u540e\uff0c\u5386\u53f2\u7248\u672c\u5217\u8868\u968f\u5373\u66f4\u65b0 (#12133 by @KHG420)\n- \u79fb\u9664\u63d2\u4ef6\u5305\u540e\uff0c\u8bbe\u7f6e\u91cc\u663e\u793a\u6700\u65b0\u7684\u91cd\u8f7d\u7ed3\u679c\uff1b\u5305\u8be6\u60c5\u7684\u94a9\u5b50\u884c\u4e0d\u518d\u91cd\u590d\u6216\u6b8b\u7559 (#12155 by @KHG420, #12163 by @KHG420)\n- \u767b\u5f55\u6216\u9000\u51fa\u540e\uff0c\u5e02\u573a\u8be6\u60c5\u9875\u7684\u6295\u7968\u9762\u677f\u4f1a\u968f\u8d26\u53f7\u5237\u65b0 (#12169 by @KHG420)\n- \u9996\u6b21\u6253\u5f00\u5e26\u4ee4\u724c\u7247\u6bb5\u7684\u94fe\u63a5\u65f6\uff0c\u9875\u9762\u8