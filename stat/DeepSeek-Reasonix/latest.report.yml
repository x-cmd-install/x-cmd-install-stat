{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:d0fb1c2f3d0ed81925539b6d91c8400865cca9ffb749adf3183c6beeb58e6d17","download_count":10,"created_at":"2026-10-11T02:06:26Z","updated_at":"2026-10-11T02:06:26Z"}],"body":"\u672c\u7248\u52a0\u5165 Linux \u7684 rpm \u5b89\u88c5\u5305\u3001MCP \u5de5\u5177\u5b9a\u4e49\u56fa\u5b9a\u4e0e\u53d8\u66f4\u6263\u7559\u3001\u95f2\u7f6e\u4f1a\u8bdd\u81ea\u52a8\u5f52\u6863\u3001\u786c\u4ef6\u52a0\u901f\u5f00\u5173\u548c\u53cd\u9988\u56de\u590d\u901a\u77e5\uff0c\u5e76\u4fee\u590d\u4fe1\u4efb\u5e93\u65e0\u9650\u589e\u957f\u3001\u65b0\u4f1a\u8bdd\u9ed8\u8ba4\u6a21\u578b\u88ab\u8df3\u8fc7\u65f6\u65e0\u63d0\u793a\u7b49\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u65b0\u589e Linux \u7684 `.rpm` \u5b89\u88c5\u5305\uff08`ReasonixStudio-linux-*.rpm`\uff09\uff0c\u672c\u7248\u662f\u9996\u4e2a\u542b rpm \u7684\u7248\u672c\uff1b\u7528 minisign \u6821\u9a8c\uff0c\u65e0 GPG \u7b7e\u540d\uff1brpm \u5b89\u88c5\u7684\u7248\u672c\u6682\u4e0d\u81ea\u52a8\u66f4\u65b0 (#12608)\n- MCP \u5de5\u5177\u5b9a\u4e49\u5728\u4f60\u6279\u51c6\u65f6\u88ab\u56fa\u5b9a\uff1a\u4e4b\u540e\u6709\u53d8\u5316\u6216\u65b0\u589e\u7684\u5de5\u5177\u4f1a\u88ab\u6263\u4f4f\uff0c\u4e0d\u8fdb\u5165\u6a21\u578b\u8bf7\u6c42\uff0c\u8c03\u7528\u4f1a\u88ab\u660e\u786e\u62d2\u7edd\uff0c\u76f4\u5230\u7528 `reasonix mcp trust <\u540d\u79f0> --digest <\u6458\u8981>` \u6279\u51c6\uff1b\u684c\u9762\u7aef\u76ee\u524d\u53ea\u663e\u793a\u901a\u77e5 (#12597)\n- \u8bbe\u7f6e\u7684\u5916\u89c2\u9875\u65b0\u589e\u300c\u56fe\u5f62\u300d\uff1a\u53ef\u5173\u95ed\u786c\u4ef6\u52a0\u901f\uff08\u4e0b\u6b21\u542f\u52a8\u751f\u6548\uff09\uff0c\u5e76\u663e\u793a\u5f53\u524d\u7a97\u53e3\u7684\u7ed8\u5236\u65b9\u5f0f\uff1b\u7a97\u53e3\u65e0\u6cd5\u7ed8\u5236\u65f6\uff0c\u53ef\u7528\u73af\u5883\u53d8\u91cf `REASONIX_DISABLE_GPU=1` \u6216\u53c2\u6570 `--disable-gpu` \u4ec5\u5173\u95ed\u8fd9\u4e00\u6b21 (#12451)\n- \u8bbe\u7f6e\u65b0\u589e\u53ef\u9009\u7684\u95f2\u7f6e\u4f1a\u8bdd\u81ea\u52a8\u5f52\u6863\uff08\u9ed8\u8ba4\u5173\u95ed\uff0c\u9ed8\u8ba4 30 \u5929\uff0c\u8303\u56f4 1 \u5230 3650\uff09\uff1b\u5df2\u7f6e\u9876\u3001\u6b63\u5728\u8fd0\u884c\u3001\u6709\u5f85\u56de\u7b54\u4e8b\u9879\u6216\u6709\u672a\u8bfb\u5b8c\u6210\u7684\u4f1a\u8bdd\u4e0d\u4f1a\u88ab\u5f52\u6863\uff0c\u5f52\u6863\u53ef\u6062\u590d (#11535)\n- \u53cd\u9988\u7684\u672a\u8bfb\u89d2\u6807\u5728\u5e94\u7528\u6253\u5f00\u671f\u95f4\u81ea\u52a8\u5237\u65b0\uff0c\u7a97\u53e3\u4e0d\u5728\u524d\u53f0\u65f6\u6709\u65b0\u56de\u590d\u4f1a\u5f39\u51fa\u901a\u77e5\uff1b\u901a\u77e5\u8bbe\u7f6e\u91cc\u65b0\u589e\u300c\u53cd\u9988\u6709\u56de\u590d\u65f6\u300d\u5f00\u5173\uff0c\u5728\u603b\u5f00\u5173\u6253\u5f00\u65f6\u9ed8\u8ba4\u5f00\u542f (#11538)\n- \u8bbe\u7f6e\u7684\u300c\u5173\u4e8e\u300d\u9875\u65b0\u589e\u300c\u652f\u6301\u9879\u76ee\u300d\u5165\u53e3\uff0c\u542b PayPal \u94fe\u63a5\u4ee5\u53ca\u9ed8\u8ba4\u6298\u53e0\u7684\u5fae\u4fe1\u3001\u652f\u4ed8\u5b9d\u6536\u6b3e\u7801 (#11709)\n\n## \u53d8\u66f4\n\n- \u63d0\u4ea4\u63a5\u53e3 `POST /submit` \u53ea\u5728\u63d0\u4ea4\u786e\u5b9e\u88ab\u4e22\u5f03\u65f6\u8fd4\u56de 409\uff1b\u5df2\u53d7\u7406\u5e76\u7acb\u523b\u7ed3\u675f\u7684\u56de\u5408\u3001\u6392\u5728\u7ed3\u675f\u4e2d\u56de\u5408\u4e4b\u540e\u7684\u63d0\u4ea4\u73b0\u5728\u8fd4\u56de 202 (#12596)\n- \u7535\u8111\u64cd\u4f5c\u8fd4\u56de\u7ed9\u6a21\u578b\u7684\u5e94\u7528\u540d\u548c\u7a97\u53e3\u6807\u9898\u73b0\u5728\u9650\u957f\u5e76\u8f6c\u4e49\uff0c\u5305\u542b\u6362\u884c\u6216\u4e0d\u53ef\u89c1\u5b57\u7b26\u7684\u540d\u79f0\u4e0d\u518d\u80fd\u4f2a\u9020\u5feb\u7167\u884c (#12585)\n- \u5b89\u88c5 skill \u6216\u672c\u5730\u63d2\u4ef6\u65f6\uff0c\u590d\u5236\u7684\u6765\u6e90\u82e5\u662f\u6307\u5411\u76ee\u5f55\u7684\u522b\u540d\u73b0\u5728\u53ef\u4ee5\u5b89\u88c5\uff1b\u6279\u51c6\u4e4b\u540e\u6765\u6e90\u522b\u540d\u88ab\u6539\u6307\u5411\u522b\u5904\uff0c\u4f1a\u88ab\u62d2\u7edd\u800c\u4e0d\u4f1a\u590d\u5236 (#12112 by @KHG420)\n\n## \u4fee\u590d\n\n- \u4fe1\u4efb\u5e93 `trusted/` \u76ee\u5f55\u4e0d\u518d\u65e0\u9650\u589e\u957f\uff1a\u5bc6\u5c01\u8bb0\u5f55\u4e0d\u518d\u628a\u5408\u540c\u7684\u9a8c\u6536\u6761\u76ee\u590d\u5236\u8fdb\u6bcf\u4e00\u56de\u5408\uff0c\u4e49\u52a1\u6e05\u5355\u6539\u4e3a\u53ea\u5b58\u4e00\u4efd\u5e76\u6309\u6458\u8981\u5f15\u7528 (#12609, Fixes #12603 fixed in #12609)\n- \u65b0\u4f1a\u8bdd\u7684\u9ed8\u8ba4\u6a21\u578b\u662f\u51b3\u7b56\u6765\u6e90\u800c\u88ab\u8df3\u8fc7\u65f6\uff0c\u7ec8\u7aef\u754c\u9762\u548c `reasonix run` \u73b0\u5728\u7ed9\u51fa\u300c\u9ed8\u8ba4\u6a21\u578b\u4e0d\u53ef\u7528\u300d\u7684\u901a\u77e5\uff0c\u4e0d\u518d\u9759\u9ed8\u6539\u7528\u522b\u7684\u6a21\u578b (#12605 by @xxoingr)\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@KHG420\u3001@xxoingr\n\n## What's Changed\n* test(serve): wait for a trace turn to go silent, not for a fixed time by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12599\n* fix(repolint): wire-parity reads embedded structs and extends, declares PermissionRules by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12590\n* perf(gitcmd): skip the driver listing for subcommands that cannot run a driver by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12588\n* fix(computer): bound and escape application names in the snapshot and app list by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12585\n* fix(serve): judge POST /submit by what admission did with it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12596\n* feat(studio): opt-in archiving of conversations inactive for N days by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/11535\n* fix(config): report a skipped default on the new-session path too by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12605\n* feat(studio): switch hardware acceleration off and show how the window is drawn by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12451\n* feat(release): build and publish an rpm of Studio for Linux by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12608\n* feat(feedback): refresh the unread badge while open and announce new replies by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/11538\n* feat(studio): add a Support entry to Settings > About by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/11709\n* fix(installsource): copy directory root aliases by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12112\n* fix(agent): stop copying the contract's criteria into every sealed bundle by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12609\n* feat(plugin): pin MCP tool definitions at approval and hold changed tools by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12597\n* docs(release): Studio 2.35.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12610\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.34.0...studio-v2.35.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","mentions_count":3}
