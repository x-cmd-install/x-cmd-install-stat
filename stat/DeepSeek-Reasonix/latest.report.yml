":"RA_kwDOSIatD84ouyC0","name":"ReasonixStudio-windows-arm64-installer.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":133937232,"digest":"sha256:ebfe7dab5db30904a42c5f985e2e1c862535662f3c771170eccc1ec075856e5e","download_count":5,"created_at":"2026-10-28T00:46:15Z","updated_at":"2026-10-28T00:46:19Z"},{"id":683352256,"node_id":"RA_kwDOSIatD84ouyDA","name":"ReasonixStudio-windows-arm64-installer.exe.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":299,"digest":"sha256:042dfa8e3d90479b03974dd57a010e1b674c3ada3bfbf8acb0877b4d4d5e9113","download_count":2,"created_at":"2026-10-28T00:46:15Z","updated_at":"2026-10-28T00:46:15Z"},{"id":683352286,"node_id":"RA_kwDOSIatD84ouyDe","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":186677584,"digest":"sha256:c44b785c7b67d863452f27d3be3f47ad34ee2b127af51e8e15ac70c4aebeb468","download_count":4,"created_at":"2026-10-28T00:46:16Z","updated_at":"2026-10-28T00:46:21Z"},{"id":683352283,"node_id":"RA_kwDOSIatD84ouyDb","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:cb1b137ff687a745559bf37b3a45ef6803120f9d9c38b70b6ac19946c678562f","download_count":2,"created_at":"2026-10-28T00:46:16Z","updated_at":"2026-10-28T00:46:16Z"},{"id":683352305,"node_id":"RA_kwDOSIatD84ouyDx","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:b94edea383bb1acab611d357f369799cf5a0d309babd5c2725ff3ef1c325b55c","download_count":7,"created_at":"2026-10-28T00:46:16Z","updated_at":"2026-10-28T00:46:16Z"}],"body":"本版新增全局显示 / 隐藏快捷键、用量页的上传量、隐藏服务商共同前缀，并把设置拆成子页、壁纸移到外观，修复多处预算与界面问题。\n\n## 新增\n\n- 桌面设置提供默认关闭的全局显示 / 隐藏快捷键，支持按键录制与清除；仅 Studio 运行时有效，不会启动已退出的应用。关联 #8290 fixed in #14592 by @lancy69。\n- 服务商设置里可以「隐藏共同前缀」，路由类服务给每个模型加的同一段前缀（如 group/）在各处显示时省略，只改显示。关联 #14573 fixed in #14578。\n- 设置 → 用量里多了「上传量」，显示今天和近 30 天发给模型服务商的请求内容大小、次数、平均每次多大，并按服务商列出。关联 #14670。\n- 反馈窗口会记住上一次成功提交的联系方式并自动填入，仍可修改，清空后不会再冒出旧的。关联 #14610 fixed in #14666 by @lancy69。\n- 主题可以按深色 / 浅色分别设置导航、图标栏、顶栏、侧栏和输入框在背景图上的不透明度。关联 #14589 by @lancy69。\n- 新增默认关闭的「连接检测」授权开关，只有你打开后才会向服务商发起后台检测请求。关联 #14620 by @SivanCola。\n\n## 变更\n\n- 设置里「模型偏好」的「看图」下拉框只列出已声明支持读图的模型；已选的旧模型仍会显示，并标明\"未声明读图\"。关联 #14418 fixed in #14420 and #14597。\n- 「壁纸」及其选择、替换、移除、导入、浓度、压暗和焦点控件移到「外观」的独立区块，已选壁纸的预览直接显示。关联 #14470 fixed in #14588 by @lancy69。\n- 待发送队列与输入框共用外框和底色，采用紧凑透明行与轻量图标操作；现有操作与快捷键保持不变。关联 #14497 fixed in #14591 by @lancy69。\n- 较长的「工具与权限」和「外观」拆成几个子页，在左侧导航里直接点选；搜索或链接会自动切到设置所在的子页。关联 #14625。\n- 设置页文字统一成同一套样式，字号从 10 种减到 5 种，字重和灰色也收成固定几档。关联 #14625。\n- 关闭工作台里最后一个页面后，留下\"新建页面\"的启动器，不再把整列收起。关联 #14037 by @imcreazy。\n- 「柔和」对比度改为真正更低对比、仍达 AA 的内置配色，不再比默认更强。关联 #12019 fixed in #14590 by @lancy69。\n\n## 修复\n\n- 打开设置时不再每次遍历磁盘统计「存储」大小；这个数字延后读取，十分钟内沿用上次结果。关联 #14315 fixed in #14650。\n- 用量总额会说明其中有几笔调用未定价、以及原因，不再只由一个标志暗示。关联 #14522 by @chuiwenwei。\n- 压缩上下文时摘要请求的连接被中途重置（比如本地网关重启），会自动重试一次，不再直接失败。关联 #14643 fixed in #14648。\n- 压缩后“较早的消息过长，只通过摘要保留”的提示在中文界面下也用中文显示。修复 #14651 fixed in #14664。\n- 命令或同一批调用被宿主拦截时，工具卡片用中文说明原因，不再显示英文的 blocked 提示。修复 #14652 fixed in #14655。\n- 历史超过读取上限的会话不再只报英文错误，会说明文件完好，并可「从最近的内容继续」另存为新会话。修复 #14660 fixed in #14662。\n- 删除来自 Reasonix 1.x 的会话后，同一会话不再重新出现在侧栏；删除状态重启后保留，且不修改 1.x 的原始存储。修复 #14632 fixed in #14657 by @lancy69。\n- 在弹窗里放大查看截图时，按 Esc 只退出大图，不再关掉整个反馈弹窗。修复 #14609 fixed in #14612。\n- 点“继续派发”后，输入框上方“待发送已暂停”的提示会随之消失。修复 #14616 fixed in #14618。\n- 鼠标点开设置等弹窗后按 Esc 关闭，左侧图标栏按钮不再带着焦点环停在“悬停”样子。关联 #14624。\n- 工作区里有多个 Git 仓库时，改动列表不再撑出面板，有自己的滚动条。修复 #14628 fixed in #14630。\n- 文件工具栏的保存按钮保持紧凑，启用和禁用状态都清晰可读。关联 #14231。\n- 同一个网关拒绝 stream_options 的结论按进程只学一次，不再让每个新会话都多发一次失败请求。关联 #14606。\n- 显式子代理技能调用遵守已有任务根预算；恢复 Goal 时规划与执行一起获得新的预算切片；本地费用门禁采用发生时刻的权威报价；Windows 跟踪命令保留已发布的 Job Object owner。关联 #14025。\n- 文件大小和修改时间未变时，候选快照不再复用 Git 缓存中的旧内容，私有索引重建保留用户暂存区。关联 #14025。\n- ACP 的 inbox 拒绝带机器码：`-32020` 队列拒绝，`-32021` 该工作可能已执行、不要重试。关联 #14551 by @chuiwenwei。\n\n## 贡献者\n\n感谢本版本的贡献者：@lancy69、@SivanCola、@imcreazy、@chuiwenwei\n\n---\n\n<!-- lang:en -->\n\n## New\n\n- An opt-in global show/hide shortcut in desktop settings, with key recording and Clear; it works only while Studio runs and never launches a stopped app. Refs #8290 fixed in #14592 by @lancy69.\n- A provider can hide the prefix all its models share (such as group/ from a router) everywhere the model name is drawn; display only. Refs #14573 fixed in #14578.\n- Settings → Usage has \"Upload volume\": request bodies sent to model providers today and over 30 days, count, average size, and a per-provider list. Refs #14670.\n- The feedback form remembers the last successfully submitted contact and prefills it; it stays editable and a cleared field stays cleared. Refs #14610 fixed in #14666 by @lancy69.\n- Themes can set per-scheme (dark / light) opacity for the navigation, rail, chrome, side and composer surfaces over a background image. Refs #14589 by @lancy69.\n- A default-off connection-health consent setting: background provider checks run only after you turn it on. Refs #14620 by @SivanCola.\n\n## Changed\n\n- The vision row in Model preferences lists only models declared to read images; a model chosen earlier stays visible, marked as not declared. Refs #14418 fixed in #14420 and #14597.\n- Wallpaper, choose/change/remove, import, strength, dim and focus move to Appearance; the selected preview is visible directly. Refs #14470 fixed in #14588 by @lancy69.\n- Pending messages share the composer frame, with compact transparent rows and icon actions; existing queue actions and shortcuts are unchanged. Refs #14497 fixed in #14591 by @lancy69.\n- The long Tools & permissions and Appearance sections are split into pages in the left navigation; search and links open the page a setting is on. Refs #14625.\n- Settings text follows one set of styles: 5 font sizes instead of 10, with fixed weights and grey tones. Refs #14625.\n- Closing the last page in the workbench leaves the new-page launcher instead of folding the column away. Refs #14037 by @imcreazy.\n- The Soft contrast level is a genuinely lower-contrast built-in palette that still meets AA, instead of reading stronger than the default. Refs #12019 fixed in #14590 by @lancy69.\n\n## Fixed\n\n- Opening Settings no longer walks the disk for the Storage total each time; it is read after the window is up and reused for ten minutes. Refs #14315 fixed in #14650.\n- A usage total says how many of its calls were never priced, and why, instead of only carrying an incomplete flag. Refs #14522 by @chuiwenwei.\n- When the connection of a context-summary request is reset mid-stream, compaction retries once instead of failing at once. Refs #14643 fixed in #14648.\n- The \"earlier messages were too large to keep whole\" notice after a compaction reads in the window's language. Fixes #14651 fixed in #14664.\n- When the host stops a command or a call in a batch before it runs, the tool card explains why in your language instead of an English \"blocked:\" line. Fixes #14652 fixed in #14655.\n- A session over the read limit no longer stops at an English error; the file stays intact and \"Continue from the most recent part\" saves its newest part as a new session. Fixes #14660 fixed in #14662.\n- Deleted 1.x conversations stay out of the sidebar after restart; the original store stays unchanged. Fixes #14632 fixed in #14657 by @lancy69.\n- Pressing Esc on an enlarged screenshot closes only the screenshot instead of the whole feedback dialog. Fixes #14609 fixed in #14612.\n- The \"queue paused\" notice goes away once dispatch resumes instead of lingering. Fixes #14616 fixed in #14618.\n- After a mouse-opened dialog is closed with Esc, the icon rail button no longer keeps a focus ring as if hovered. Refs #14624.\n- With several Git repositories in a workspace, the workbench changes list no longer grows past the panel; it scrolls on its own. Fixes #14628 fixed in #14630.\n- The file toolbar's Save button stays compact and readable in both enabled and disabled states. Refs #14231.\n- An endpoint's refusal of stream_options is learned once per process, so each new session no longer sends one extra failing request. Refs #14606.\n- Explicit subagent skills share the existing root budget, and resuming a Goal renews planner and executor budget together. Refs #14025.\n- Local cost gates use the occurrence-time quote, and tracked Windows commands keep their published Job Object owner. Refs #14025.\n- Candidate snapshots no longer reuse stale Git-cached content when size and mtime are unchanged, and private index rebuilds keep the user's staging area. Refs #14025.\n- ACP inbox refusals carry machine codes: `-32020` for a queue refusal, `-32021` for work that may already have run and must not be retried. Refs #14551 by @chuiwenwei.\n\n## Contributors\n\nThanks to this release's contributors: @lancy69, @SivanCola, @imcreazy, @chuiwenwei\n\n## What's Changed\n* fix(openai): an endpoint's refusal of stream_options is learned once per process by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14606\n* fix(studio): Escape closes only the innermost open layer by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14612\n* fix(proc): retain published Job Object owner / 保留已发布的作业对象 owner by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14604\n* fix(control): renew planner budget on Goal resume / 恢复 Goal 时续给规划预算 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14614\n* fix(desktop): clear the held-queue notice when the queue resumes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14618\n* test(notify): wait for the first phone delivery before attaching the link by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14621\n* fix(desktop): return focus to a mouse-opened dialog's opener without a focus ring by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14626\n* fix(desktop): the multi-repository Git panel scrolls instead of growing past the explorer by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14630\n* feat(provider): gate connection health on user opt-in / 连接检测默认关闭并限定用户授权 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14620\n* feat(desktop): settings text follows one set of type roles by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14635\n* fix(agent): retry a context summary once when its stream is reset by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14648\n* fix(desktop): opening settings no longer walks the disk for the storage total by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14650\n* fix(agent): calls the host stops before they run carry a refusal identity the window words by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14655\n* fix(studio): keep file Save compact and readable by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14602\n* fix(studio): keep deleted legacy conversations out of the sidebar by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14657\n* feat(studio): expose wallpaper settings and selected preview by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14588\n* fix(studio): give Soft contrast a lower AA palette by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14590\n* fix(studio): integrate pending queue into composer layout by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14591\n* feat(theme): allow per-scheme backdrop surface opacity by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14589\n* feat(studio): the vision row lists only models declared to read images by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14571\n* fix(compaction): word the dropped-turn notices in the window's language by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14664\n* fix(session): open the newest part of a history too large to replay by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14662\n* feat(studio): remember last submitted feedback contact by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14666\n* feat(studio): add an opt-in global show/hide shortcut by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14592\n* feat(desktop): long settings sections split into pages in the navigation by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14647\n* feat(usage): show how much is uploaded to model providers by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14670\n* feat(providers): a provider can hide the prefix all its models share by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14578\n* fix(studio): closing the last page offers a new tab by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14037\n* fix: use authoritative local cost quotes / 本地费用门禁采用权威报价 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14671\n* fix(stats): a total says how many calls it could not price by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14522\n* fix(control): share root budget with explicit skills / 显式技能共享任务根预算 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14631\n* fix(worktree): capture current bytes and refuse stale apply / 修复快照旧内容与过期整合覆盖 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14371\n* fix(acp): an inbox refusal says which refusal it is by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14551\n* fix(studio): put global-shortcut on a settings page and keep Composer under the size ceiling by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14672\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.53.1...studio-v2.54.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n","mentions_count":5}
