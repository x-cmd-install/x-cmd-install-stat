"RA_kwDOSIatD84mRzkI","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:69d60455aa9855a12cd6c58b9269dc940d8ab1d56cb753c62092498220682609","download_count":7,"created_at":"2026-10-15T00:55:12Z","updated_at":"2026-10-15T00:55:12Z"}],"body":"\u672c\u7248\u672c\u65b0\u589e\u8f85\u52a9\u4f1a\u8bdd\u3001\u6309\u9700\u4fdd\u5b58\u957f\u7c98\u8d34\u3001\u4f1a\u8bdd\u884c\u5feb\u6377\u6309\u94ae\u3001\u6c99\u76d2\u8bbe\u5907\u767d\u540d\u5355\u7b49\u529f\u80fd\uff0c\u5e76\u4fee\u590d\u7a84\u7a97\u53e3\u5e03\u5c40\u3001\u5bf9\u6bd4\u5ea6\u3001\u8bb0\u5fc6\u53ec\u56de\u548c\u8fdc\u63a7\u517c\u5bb9\u7b49\u4e00\u6279\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u8bbe\u7f6e \u2192 \u6a21\u578b\u504f\u597d\u65b0\u589e\u300c\u547d\u540d\u6a21\u578b\u300d\u548c\u6309\u89d2\u8272\u7684\u63a8\u7406\u5f3a\u5ea6\uff1a\u53ef\u4ee5\u5355\u72ec\u6307\u5b9a\u7528\u54ea\u4e2a\u6a21\u578b\u7ed9\u4f1a\u8bdd\u8d77\u6807\u9898\uff0c\u5e76\u5206\u522b\u8bbe\u7f6e\u5404\u89d2\u8272\u7684\u63a8\u7406\u5f3a\u5ea6\u3002\u5173\u8054 #11851 by @Guan0923\u3002\n- \u65b0\u589e\u300c\u8f85\u52a9\u4f1a\u8bdd\u300d\uff1a\u5728\u4e3b\u5bf9\u8bdd\u65c1\u8fb9\u95ee\u4e00\u4e2a\u53ea\u8bfb\u7684\u5c0f\u95ee\u9898\uff0c\u7528\u53ea\u8bfb\u5de5\u5177\u56de\u7b54\uff0c\u4e0d\u5199\u8fdb\u4e3b\u5bf9\u8bdd\u3001\u4e0d\u6539\u6587\u4ef6\uff0c\u5173\u95ed\u5373\u4e22\u5f03\u3002\u5173\u8054 #12927 fixed in #13128\u3001#13128\u3002\n- \u4e0a\u4e0b\u6587\u8be6\u60c5\u91cc\u6bcf\u4e00\u7c7b\u5360\u7528\u53ef\u4ee5\u5c55\u5f00\uff0c\u770b\u6700\u5927\u7684\u51e0\u9879\uff08\u53ea\u663e\u793a\u5927\u5c0f\u548c\u5de5\u5177\u540d\uff0c\u4e0d\u542b\u6d88\u606f\u5185\u5bb9\uff09\u3002\u5173\u8054 #13052\u3001#13143\u3002\n- MCP \u670d\u52a1\u5668\u5728\u5de5\u5177\u5217\u8868\u54cd\u5e94\u91cc\u7ed9\u51fa `ttlMs` \u65f6\uff0c\u5de5\u5177\u76ee\u5f55\u4f1a\u5728\u5230\u671f\u540e\u81ea\u52a8\u91cd\u8bfb\uff08\u9650\u5236\u5728 30 \u79d2\u5230 1 \u5c0f\u65f6\u4e4b\u95f4\uff09\uff0c\u4e0d\u518d\u53ea\u9760\u53d8\u66f4\u901a\u77e5\u3002\u5173\u8054 #13108\u3002\n- \u6280\u80fd\u7684 `allowed-tools` \u73b0\u5728\u4e5f\u63a5\u53d7\u5f00\u653e\u6807\u51c6\u5199\u6cd5\uff08\u7a7a\u683c\u5206\u9694\uff0c\u5982 `Bash(git add:*) Read`\uff09\uff0c\u539f\u6765\u7684\u9017\u53f7\u5206\u9694\u7167\u5e38\u53ef\u7528\uff1b\u62ec\u53f7\u5185\u7684\u5206\u9694\u7b26\u5c5e\u4e8e\u540c\u4e00\u6761\u89c4\u5219\u3002\u5173\u8054 #13110\u3002\n- `reasonix doctor` \u73b0\u5728\u4f1a\u63d0\u793a\u6280\u80fd\u7684\u540d\u79f0\u3001\u63cf\u8ff0\u4e0d\u7b26\u5408 Agent Skills \u5f00\u653e\u6807\u51c6\uff08\u5927\u5199\u3001\u8fde\u5b57\u7b26\u3001\u8d85\u957f\u3001\u4e0e\u76ee\u5f55\u540d\u4e0d\u4e00\u81f4\uff09\uff0c\u8fd9\u4e9b\u6280\u80fd\u4ecd\u4f1a\u6b63\u5e38\u52a0\u8f7d\u3002\u5173\u8054 #13110\u3002\n- \u8bbe\u7f6e \u2192 \u5916\u89c2\u65b0\u589e\u300c\u4f1a\u8bdd\u884c\u5feb\u6377\u6309\u94ae\u300d\uff1a\u6253\u5f00\u540e\uff0c\u9f20\u6807\u79fb\u5230\u4fa7\u680f\u4f1a\u8bdd\u884c\u4e0a\u4f1a\u663e\u793a\u300c\u5f52\u6863\u300d\u300c\u5220\u9664\u300d\u6309\u94ae\uff1b\u9ed8\u8ba4\u5173\u95ed\uff0c\u4e24\u4e2a\u64cd\u4f5c\u4ecd\u5728\u53f3\u952e\u83dc\u5355\u91cc\u3002\u5173\u8054 #13132\u3002\n- \u538b\u7f29\u88ab\u62d2\u65f6\uff0c\u63d0\u793a\u73b0\u5728\u5217\u51fa\u5019\u9009\u5185\u5bb9\u7684\u6784\u6210\uff08\u56fa\u5b9a\u524d\u7f00\u3001\u88ab\u4fdd\u62a4\u7684\u6d88\u606f\u3001\u6458\u8981\u3001\u6700\u8fd1\u56de\u5408\u5404\u5360\u591a\u5c11\uff09\uff0c\u4e0d\u518d\u53ea\u8bf4\u300c\u5019\u9009\u4ecd\u9ad8\u4e8e\u89e6\u53d1\u7ebf\u300d\u3002\u5173\u8054 #13148\u3002\n- \u53cd\u9988\u5bf9\u8bdd\u6846\u65b0\u589e\u300c\u60f3\u6cd5\u4e0e\u8ba8\u8bba\u300d\u5165\u53e3\uff0c\u5efa\u8bae\u548c\u60f3\u6cd5\u53ef\u4ee5\u53d1\u5230 GitHub \u8ba8\u8bba\u533a\uff0cbug \u548c\u9519\u8bef\u4ecd\u7528\u53d1\u9001\u3002\u5173\u8054 #13141\u3001#13155\u3002\n- \u65b0\u589e `[sandbox] allow_devices`\uff1aLinux \u547d\u4ee4\u6c99\u76d2\u9ed8\u8ba4\u770b\u4e0d\u5230\u5bbf\u4e3b\u7684\u8bbe\u5907\u8282\u70b9\uff08\u5982\u663e\u5361\uff09\uff0c\u73b0\u5728\u53ef\u5728\u7528\u6237\u7ea7\u914d\u7f6e\u91cc\u7528 `/dev/nvidia*` \u8fd9\u7c7b\u767d\u540d\u5355\u653e\u8fdb\u53bb\uff1b\u9ed8\u8ba4\u5173\u95ed\uff0c\u9879\u76ee\u914d\u7f6e\u4e0d\u80fd\u5f00\u3002\u5173\u8054 #13157\u3002\n- \u64b0\u5199\u6846\u91cc\u7684\u957f\u7c98\u8d34\u82af\u7247\u65b0\u589e\u300c\u5b58\u4e3a\u6587\u4ef6\u300d\uff1a\u70b9\u4e86\u624d\u628a\u8fd9\u6bb5\u6587\u5b57\u5b58\u6210\u6587\u4ef6\uff0c\u6d88\u606f\u91cc\u53ea\u5e26\u4e00\u6bb5\u6307\u9488\uff08\u884c\u6570\u3001\u5927\u5c0f\u3001\u8def\u5f84\u3001\u600e\u4e48\u8bfb\uff09\uff0c\u539f\u6587\u4e0d\u518d\u968f\u6bcf\u4e2a\u8bf7\u6c42\u53d1\u9001\uff1b\u4e0d\u4f1a\u81ea\u52a8\u5b58\u3002\u5173\u8054 #13148\u3001#13162\u3002\n- \u7ec8\u7aef\u754c\u9762\u91cc\u6298\u53e0\u7684\u957f\u7c98\u8d34\u53ef\u4ee5\u6309 Ctrl+G \u5b58\u6210\u6587\u4ef6\uff1a\u53d1\u9001\u65f6\u53ea\u5e26\u4e00\u6bb5\u6307\u9488\uff0c\u4e0d\u518d\u628a\u539f\u6587\u9001\u7ed9\u6a21\u578b\uff1b\u4e0d\u6309\u5c31\u548c\u4ee5\u524d\u4e00\u6837\u6574\u6bb5\u53d1\u9001\u3002\u5173\u8054 #13148\u3001#13166\u3002\n\n## \u53d8\u66f4\n\n- ACP \u7684\u5de5\u5177\u8c03\u7528\u66f4\u65b0\u73b0\u5728\u5e26\u4e0a\u88ab\u8c03\u7528\u7684\u5de5\u5177\u540d\u3002\u5173\u8054 #13114\u3001#13130\u3002\n- Linux \u4e0a bubblewrap \u5df2\u5b89\u88c5\u5374\u4e0d\u80fd\u521b\u5efa\u547d\u540d\u7a7a\u95f4\uff08\u5bb9\u5668\u3001\u53d7\u9650\u5185\u6838\uff09\u65f6\uff0c\u63d0\u793a\u4e0d\u518d\u8bf4\u300c\u8bf7\u5b89\u88c5\u300d\uff0c\u800c\u662f\u8bf4\u660e\u771f\u5b9e\u539f\u56e0\u548c\u51fa\u8def\u3002\u5173\u8054 #13117\u3001#13138\u3001#13146\u3002\n- \u538b\u7f29\u524d\u5148\u9884\u5224\uff1a\u88ab\u4fdd\u62a4\u7684\u6d88\u606f\u548c\u6700\u8fd1\u56de\u5408\u672c\u8eab\u5c31\u5df2\u8d85\u8fc7\u89e6\u53d1\u7ebf\u3001\u6458\u8981\u65e0\u8bba\u600e\u6837\u90fd\u653e\u4e0d\u8fdb\u53bb\u65f6\uff0c\u76f4\u63a5\u62d2\u7edd\u5e76\u8bf4\u660e\u6784\u6210\uff0c\u4e0d\u518d\u5148\u82b1\u4e00\u6b21\u6458\u8981\u8c03\u7528\u3002\u5173\u8054 #13148\u3002\n\n## \u4fee\u590d\n\n- \u4f1a\u8bdd\u91cc\u53ec\u56de\u8fc7\u7684\u8bb0\u5fc6\u5728\u4f1a\u8bdd\u5916\u88ab\u4fee\u6539\u6216\u5220\u9664\u540e\uff0c\u4e0b\u4e00\u6b21\u53ec\u56de\u4f1a\u8bfb\u5230\u65b0\u5185\u5bb9\uff08\u53ea\u91cd\u67e5\u4e0a\u6b21\u547d\u4e2d\u7684\u51e0\u6761\uff0c\u4e0d\u5168\u91cf\u626b\u63cf\uff09\u3002\u5173\u8054 #12948 fixed in #13147\u3002\n- \u8bb0\u5fc6\u76ee\u5f55\u56e0\u6743\u9650\u6216\u5b58\u50a8\u6545\u969c\u65e0\u6cd5\u8bfb\u53d6\u65f6\uff0c\u73b0\u5728\u660e\u786e\u62a5\u9519\uff0c\u907f\u514d\u6f0f\u5217\u5386\u53f2\u7248\u672c\u3001\u8bef\u62a5\u7248\u672c\u4e0d\u5b58\u5728\uff0c\u6216\u6839\u636e\u4e0d\u5b8c\u6574\u5386\u53f2\u8ba1\u7b97\u6062\u590d\u7248\u672c\u53f7\u3002\u5173\u8054 #12950 fixed in #13016 by @SivanCola\u3002\n- Linux \u4e0a\u542f\u52a8\u65f6\u4e0d\u518d\u628a\u6ca1\u4eba\u9009\u8fc7\u3001\u4e5f\u6ca1\u8bf4\u8fc7\u8bdd\u7684\u542f\u52a8\u76ee\u5f55\uff08\u4e3b\u76ee\u5f55\uff09\u5217\u6210\u9879\u76ee\uff0c\u5220\u6389\u5b83\u91cd\u542f\u540e\u4e0d\u4f1a\u518d\u56de\u6765\u3002\u5173\u8054 #13107 fixed in #13127\u3001#13127\u3002\n- \u8981\u6253\u5f00\u7684\u6587\u4ef6\u4e0d\u5b58\u5728\u65f6\uff0c\u53f3\u4fa7\u9762\u677f\u73b0\u5728\u660e\u786e\u63d0\u793a\u300c\u627e\u4e0d\u5230\u8be5\u6587\u4ef6\u300d\uff0c\u4e0d\u518d\u6253\u5f00\u4e00\u7247\u7a7a\u767d\u7684\u9884\u89c8\u9875\u3002\u5173\u8054 #13125\u3001#13133\u3002\n- \u8bbe\u7f6e\u58c1\u7eb8\u540e\uff0c\u4fa7\u680f\u5e95\u90e8\uff08\u94b1\u5305\u4e0e\u7528\u91cf\u3001\u53d1\u9001\u53cd\u9988\u3001\u8d26\u53f7\uff09\u4e0d\u518d\u591a\u51fa\u4e00\u5757\u53d1\u767d\u7684\u5e95\uff0c\u58c1\u7eb8\u4e00\u76f4\u5ef6\u7eed\u5230\u6700\u4e0b\u9762\u3002\u5173\u8054 #13129\u3001#13131\u3002\n- \u624b\u673a\u6d4f\u89c8\u5668\u7248\u672c\u592a\u65e7\u3001\u6ca1\u6709 X25519 \u52a0\u5bc6\u65f6\uff0c\u8fdc\u63a7\u73b0\u5728\u6539\u7528\u7ecf\u5ba1\u8ba1\u7684\u8f6f\u4ef6\u5b9e\u73b0\u7ee7\u7eed\u8fde\u63a5\uff08\u53ea\u5728\u9700\u8981\u65f6\u624d\u52a0\u8f7d\uff0c\u7ea6 24 KB\uff09\uff0c\u4e0d\u518d\u8981\u6c42\u6362\u6d4f\u89c8\u5668\u3002\u5173\u8054 #13140\u3002\n- \u91cd\u542f\u540e\u70b9\u4ee5\u524d\u7684\u4f1a\u8bdd\u6253\u4e0d\u5f00\u65f6\uff0c\u63d0\u793a\u73b0\u5728\u533a\u5206\u539f\u56e0\uff1a\u4f1a\u8bdd\u6587\u4ef6\u5df2\u4e0d\u5728\u3001\u4f1a\u8bdd\u6240\u5728\u76ee\u5f55\u4e0d\u5728\u3001\u6216\u7cfb\u7edf\u8bfb\u4e0d\u4e86\u8be5\u8def\u5f84\uff08\u5e76\u5e26\u4e0a\u7cfb\u7edf\u7ed9\u7684\u539f\u56e0\uff09\uff0c\u4e0d\u518d\u4e00\u5f8b\u8bf4\u300c\u65e0\u6cd5\u89e3\u6790\u8be5\u4f1a\u8bdd\u8def\u5f84\u300d\u3002\u5173\u8054 #13152\u3001#13159\u3002\n- \u7a84\u7a97\u53e3\u4e0b\u754c\u9762\u4e0d\u518d\u91cd\u53e0\u6216\u88ab\u6324\u538b\uff1a\u6807\u7b7e\u680f\u4f1a\u6362\u884c\uff0c\u8bbe\u7f6e\u91cc\u7684\u6807\u7b7e\u4e0d\u518d\u88ab\u538b\u6210\u4e00\u5b57\u4e00\u884c\uff0c\u5206\u6bb5\u63a7\u4ef6\u4e0d\u518d\u8dd1\u51fa\u9762\u677f\uff0c\u51e0\u5904\u6587\u5b57\u5bf9\u6bd4\u5ea6\u63d0\u9ad8\u5230 AA\u3002\u5173\u8054 #13169\u3002\n- \u7a84\u7a97\u53e3\u4e0b\u7684\u6392\u7248\u4fee\u6b63\uff1a\u6d3b\u52a8\u6b65\u9aa4\u884c\u7684\u8017\u65f6\u4e0e\u7bad\u5934\u4e0d\u518d\u88ab\u6324\u51fa\uff0c\u8ba1\u91cf\u680f\u7684\u5b50\u4ee3\u7406\u82af\u7247\u6536\u8d77\u6587\u5b57\u4fdd\u7559\u6570\u5b57\uff0c\u914d\u7f6e\u9519\u8bef\u6846\u7684\u8def\u5f84\u6539\u4e3a\u6362\u884c\u3002\u5173\u8054 #13154\u3001#13172\u3002\n- \u4fee\u590d\u4e24\u5904\u5bf9\u6bd4\u5ea6\u4e0d\u8fbe AA\uff1a\u5f00\u573a\u9875\u7684\u300c\u6309\u4efb\u610f\u952e\u8df3\u8fc7\u300d\u63d0\u793a\uff0c\u548c\u8f93\u5165\u6846\u4e0a\u65b9\u300c\u5df2\u66f4\u6539\u6587\u4ef6\u300d\u80f6\u56ca\u91cc\u7684 +/\u2212 \u6570\u5b57\uff08\u6df1\u6d45\u4e24\u79cd\u4e3b\u9898\uff09\u3002\u6574\u673a\u5ba1\u67e5\u4e8e f8c262da0\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@Guan0923\u3001@SivanCola\n\n---\n\n<!-- lang:en -->\n\nThis release adds side questions, keeping a long paste as a file, optional session-row buttons and a sandbox device allowlist, and fixes narrow-window layout, contrast, memory recall and remote-control compatibility.\n\n## New\n\n- Settings \u2192 Model preferences gains an independent naming model and per-role reasoning effort, so titles can use their own model and each role its own effort. Refs #11851 by @Guan0923.\n- New side questions: ask a read-only question beside the main conversation; read-only tools, never in the main transcript, dropped on close. Refs #12927 fixed in #13128, #13128.\n- Each class in the context details can be opened to its largest items (sizes and tool names only, never message text). Refs #13052, #13143.\n- When an MCP server puts `ttlMs` on its tool list, the catalog is re-read once it runs out (clamped to 30 s to 1 h) instead of relying on change notices alone. Refs #13108.\n- A skill's `allowed-tools` now also takes the open-standard spelling (space separated, like `Bash(git add:*) Read`); commas still work. Refs #13110.\n- `reasonix doctor` now reports skill names and descriptions that depart from the Agent Skills spec (uppercase, hyphens, length, directory mismatch); such skills still load. Refs #13110.\n- Settings \u2192 Appearance gains \"Session row buttons\": when on, hovering a sidebar session row shows Archive and Delete; off by default, both stay in the context menu. Refs #13132.\n- When compaction rejects its candidate as too large, the message now splits it into fixed prefix, protected messages, summary and recent tail, not just \"still above trigger\". Refs #13148.\n- The feedback dialog gains an \"Ideas and discussion\" link to GitHub Discussions for suggestions; bugs and errors still use Send. Refs #13141, #13155.\n- New `[sandbox] allow_devices`: the Linux command sandbox hides host devices such as the GPU; a user-level allowlist binds them in. Off by default; project config cannot set it. Refs #13157.\n- The long-paste chip gains \"save as file\": on click the text is stored as a file and the message carries only a pointer (lines, size, path, how to read it); never automatic. Refs #13148, #13162.\n- In the terminal, a folded long paste can be kept as a file with Ctrl+G: the message carries a pointer, not the text; without the key it is sent whole as before. Refs #13148, #13166.\n\n## Changed\n\n- ACP tool-call updates now name the invoked tool. Refs #13114, #13130.\n- On Linux, bubblewrap installed but unable to create a namespace (containers, hardened kernels) now gets its real cause and ways out, not \"install it\". Refs #13117, #13138, #13146.\n- Compaction now refuses up front when the protected messages and recent tail already reach the trigger, naming what holds the size, instead of paying for a summary that cannot fit. Refs #13148.\n\n## Fixed\n\n- A recalled memory fact edited or deleted outside the session is re-read before the next recall (only the last hits are checked, no full scan). Refs #12948 fixed in #13147.\n- Unreadable memory directories now report errors, keeping revision lists, restores, and recovery from treating permission or storage failures as missing data. Refs #12950 fixed in #13016 by @SivanCola.\n- On Linux, a launch folder nobody picked and nothing was said in is no longer listed as a project, so deleting it does not bring it back on restart. Refs #13107 fixed in #13127, #13127.\n- A requested file that does not exist is now said so in the side panel instead of opening a blank preview page. Refs #13125, #13133.\n- With a wallpaper set, the sidebar footer no longer paints a whiter plate; the picture continues to the bottom. Refs #13129, #13131.\n- On a phone browser too old for X25519 in WebCrypto, remote control now falls back to an audited software curve, loaded only then (about 24 KB), instead of asking for a newer browser. Refs #13140.\n- When an older session cannot be opened after a restart, the error now says why: the file is gone, its folder is gone, or the system could not read the path (with its reason). Refs #13152, #13159.\n- Narrow windows no longer overlap or squeeze: the tab bar wraps, settings labels keep their width, segmented controls stay in the sheet, and a few colours reach AA. Refs #13169.\n- Narrow windows: activity step rows keep their duration and arrow, the meter rail's subagent chip keeps its count when it cannot fit, and config error paths wrap. Refs #13154, #13172.\n- Fixed two contrast shortfalls: the intro \"press any key to skip\" hint and the +/\u2212 counts in the changed-files pill (both themes). Found by the audit at f8c262da0.\n\n## Contributors\n\nThanks to this release's contributors: @Guan0923, @SivanCola\n\n## What's Changed\n* test(openwith): skip fakes of a POSIX disk on a Windows host by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13124\n* test(plugin): give the writable-roots host-context tests absolute paths on Windows by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13121\n* test(session): let a released save lock be waited for under load by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13122\n* test(plugin): bound the mid-browser OAuth removal by the hang budget by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13123\n* fix(serve): do not list a launch folder nobody picked and nothing was said in by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13127\n* feat(acp): name the invoked tool on tool_call updates by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13130\n* fix(studio): the sidebar footer takes the rail's tint over a wallpaper instead of a plate of its own by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13131\n* fix(memory): report unreadable store directories / \u4fee\u590d\u8bb0\u5fc6\u76ee\u5f55\u8bfb\u53d6\u9519\u8bef\u88ab\u5ffd\u7565 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13016\n* fix(studio): a requested file that is not there is said so, not opened as a blank preview by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13133\n* feat(session): a read-only side question beside the main conversation by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13128\n* feat(skill): accept space-separated allowed-tools through one shared splitter by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13135\n* perf(boot): read the user config once for the startup migrations and leave an untouched config unlocked by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13136\n* feat(studio): opt-in hover Archive and Delete buttons on session rows by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13137\n* feat(sandbox): say why bubblewrap is unusable: missing, or installed but denied a namespace by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13138\n* fix(remote): say the browser is too old when it has no X25519 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13145\n* feat(mcp): re-read a tool catalog when the server's ttlMs runs out by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13139\n* feat(studio): open a context class to the messages that made it heavy by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13143\n* feat(sandbox): a bwrap that cannot be started is not reported as a denied namespace by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13146\n* docs(guide): describe the terminal keys 2.x has by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13144\n* fix(memory): re-read the facts the last recall returned before recalling again by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13147\n* feat(compaction): say what holds a rejected candidate above the trigger by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13149\n* feat(skill): report front matter that departs from the Agent Skills spec by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13150\n* feat(compaction): refuse a fold that cannot fit before paying for its summary by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13151\n* fix(studio): lift the intro hint and the changed-files counts over AA contrast by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13154\n* feat(studio): add an independent naming model and per-role reasoning effort by @Guan0923 in https://github.com/esengine/DeepSeek-Reasonix/pull/11851\n* docs(release): fragments for the user-visible changes merged since 2.40.0 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13156\n* feat(studio): point ideas and questions from the feedback dialog to Discussions by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13155\n* docs(release): fragment for the naming model and per-role effort by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13158\n* fix(serve): resume says whether the transcript is gone, outside, or unreadable and why by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13159\n* feat(remote): fall back to a software X25519 when the browser has none by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13160\n* feat(sandbox): bind user-allowed host device nodes into the Linux bash sandbox by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13161\n* feat(studio): keep a long paste as a file on request by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13162\n* docs(release): fragment for the keep-a-paste-as-a-file chip action by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13163\n* docs(guide): document the sandbox device allowlist by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13164\n* feat(tui): keep a folded paste as a file with Ctrl+G by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13166\n* docs(release): fragment for keeping a folded paste as a file in the terminal by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13167\n* test(boot): build SDK examples against the host go build cache by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13168\n* fix(sandbox): probe bubblewrap with the network flag the launch will use by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13165\n* fix(studio): narrow-width layout and contrast defects found by the sweep by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13169\n* test(studio): i18n and fault sweeps take a viewport and wait for the settings control by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13170\n* docs(release): fragment for the narrow-width layout fixes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13171\n* fix(studio): narrow-width step rows, meter rail and config error block by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13172\n* test(session): bound the stream-failure recovery turns by the hang budget by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13173\n* docs(release): Studio 2.41.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13174\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.40.0...studio-v2.41.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora