A_kwDOSIatD84o-gB6","name":"ReasonixStudio-windows-arm64-installer.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":133962296,"digest":"sha256:72e07e1141fef1ef0bfa0ad3a32540500d85586a3acd32fe2031477a2234e63d","download_count":4,"created_at":"2026-10-29T05:29:59Z","updated_at":"2026-10-29T05:30:05Z"},{"id":687472804,"node_id":"RA_kwDOSIatD84o-gCk","name":"ReasonixStudio-windows-arm64-installer.exe.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":299,"digest":"sha256:0db32bfeba60573d259c8ded544ca638e4d7daff23496740c6c258c0c8117499","download_count":2,"created_at":"2026-10-29T05:30:00Z","updated_at":"2026-10-29T05:30:00Z"},{"id":687472824,"node_id":"RA_kwDOSIatD84o-gC4","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":186704557,"digest":"sha256:5247d1a46a9709ad775e2adea328f500ae2324213c4a28a9c1cfd88f59fc8317","download_count":3,"created_at":"2026-10-29T05:30:01Z","updated_at":"2026-10-29T05:30:10Z"},{"id":687472833,"node_id":"RA_kwDOSIatD84o-gDB","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:de43bb624caf7d55fcc029efe7ada038b3e6b31f759e44612416402b0522a30b","download_count":3,"created_at":"2026-10-29T05:30:01Z","updated_at":"2026-10-29T05:30:01Z"},{"id":687472850,"node_id":"RA_kwDOSIatD84o-gDS","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:81c2d9c3937f0abf492a97bebe8686b771df502b8d27918692d8189139695870","download_count":3,"created_at":"2026-10-29T05:30:01Z","updated_at":"2026-10-29T05:30:02Z"}],"body":"本版新增可自定义的对话宽度百分比，调整设置页与安装升级的体验，并修复 Windows 沙箱下 Git Bash 不可用等多处问题。\n\n## 新增\n\n- 「外观 → 尺寸 → 行宽」新增自定义百分比，可在 30–100% 之间按 1% 调整，对话与输入框一起生效，不影响已有预设。关联 #14649 fixed in #14667 by @lancy69。\n\n## 变更\n\n- 设置页顶部的标题块（分类名、设置项数量）去掉了，导航已标明位置，第一张卡片直接出现在页面顶部。关联 #14625。\n- 已安装的程序位于项目文件夹内时，「用其他程序打开」会列出它并标明原因，悬停可看是哪个文件夹，不再悄悄消失。关联 #14627。\n- 安装升级时 Studio 还在运行，安装程序会连同内核一起关掉，必要时请求一次管理员权限；仍关不掉就用中文说明怎么退出。修复 #14658 fixed in #14659。\n- 设置里的「图形渲染」从「外观与主题」页移到「窗口与性能」页，和其他与占用相关的选项放在一起。修复 #14719 fixed in #14732。\n- 普通目录会话不再显示顶部的「原目录」徽标，独立工作树统一显示「独立工作树」并补充目录说明。关联 #14619 by @SivanCola。\n\n## 修复\n\n- Windows 开启沙箱后 Git Bash 每条命令都报「couldn't create signal pipe」；现在 Git Bash 在沙箱下起不来时，会话自动改用 PowerShell 并说明原因。修复 #14713 fixed in #14735，关联 #14714。\n- 设置里主按钮（编辑模型后的「保存」、「新建预设」、「加入 QQ 群」）的文字与底色几乎同色、看不清的问题。修复 #14679 fixed in #14733。\n- 输入框下方的执行权限、模式、模型、强度菜单展开时，不再被上方的计划条盖住一截。修复 #14720 fixed in #14731。\n- 对话里「执行过程」一行的字号与同级的「思考」一行统一。修复 #14682 fixed in #14686。\n- 设置按钮高度对齐、重命名对话框字体统一，项目栏的「添加项目」在长列表滚动时保持可点。关联 #14600 fixed in #14708 by @lancy69、#14601 fixed in #14707 by @lancy69、#14607 fixed in #14709 by @lancy69。\n- 恢复会话时，纯图片的一轮不再消失，终端会显示「附有 N 张图片」。关联 #14716 by @chuiwenwei。\n- `reasonix doctor catalogs` 不再对记录过失败的目录打印 `ok`，而是显示 `failed` 或 `degraded`。关联 #14549 by @chuiwenwei。\n- 会话租约无法证明时不再谎称被占用：密钥擦除拒绝改写并以错误退出，会话与任务列表显示 `unknown`。关联 #14727 by @chuiwenwei。\n- 以 `..` 开头的根目录名现在按仓库内路径判断 gitignore。关联 #14734 by @kevin9327。\n- 后台子任务的用量保留启动时的 Goal 归属，嵌套委派继承原归属；子任务恢复拒绝无法识别的持久化状态。关联 #14025。\n\n## 贡献者\n\n感谢本版本的贡献者：@lancy69、@SivanCola、@chuiwenwei、@kevin9327\n\n---\n\n<!-- lang:en -->\n\n## New\n\n- Appearance → Size → Line width has a custom percentage, 30–100% in 1% steps, applied to the transcript and composer together; the presets are unchanged. Refs #14649 fixed in #14667 by @lancy69.\n\n## Changed\n\n- The title block at the top of each settings page (section name and setting count) is gone; the navigation already shows where you are. Refs #14625.\n- An installed program inside a project folder is listed in \"Open with\" as unavailable, with the reason and folder on hover, instead of silently missing. Refs #14627.\n- During install or upgrade the installer closes a running Studio with its kernel, asks once for administrator permission if needed, and says how to quit by hand. Fixes #14658 fixed in #14659.\n- \"Graphics rendering\" moves from the Appearance and theme page to the Window and performance page, next to the other options that affect resource use. Fixes #14719 fixed in #14732.\n- Ordinary sessions no longer show the Local checkout header badge; isolated worktrees use one neutral label with explanatory tooltips. Refs #14619 by @SivanCola.\n\n## Fixed\n\n- With the Windows sandbox on, every Git Bash command failed; a sandboxed session now uses PowerShell and says why when Git Bash cannot start there. Fixes #14713 fixed in #14735, refs #14714.\n- Primary buttons in Settings (Save after editing a model, New preset, Join the QQ group) no longer draw their label in almost the same colour as their fill. Fixes #14679 fixed in #14733.\n- The permission, mode, model and effort menus under the composer are no longer partly covered by the plan bar above them. Fixes #14720 fixed in #14731.\n- The \"Execution\" row in a conversation uses the same text size as the \"Thinking\" row at the same level. Fixes #14682 fixed in #14686.\n- Settings button heights line up, the rename dialog uses the shared type styles, and the project header's Add project stays reachable while a long list scrolls. Refs #14600 fixed in #14708 by @lancy69, #14601 fixed in #14707 by @lancy69, #14607 fixed in #14709 by @lancy69.\n- A restored transcript no longer drops a turn that was only an image; the terminal says \"N image(s) attached\". Refs #14716 by @chuiwenwei.\n- `reasonix doctor catalogs` no longer prints `ok` for a catalog that recorded a failure; it reports `failed` or `degraded`. Refs #14549 by @chuiwenwei.\n- When a session lease cannot be proven, the secret scrub refuses to rewrite and exits non-zero instead of claiming the lease is held; listings show `unknown`. Refs #14727 by @chuiwenwei.\n- A root name starting with `..` is judged as inside the repository for gitignore. Refs #14734 by @kevin9327.\n- Background children keep the Goal that started them for usage accounting, nested delegation inherits it, and subagent continuation refuses unrecognised persisted states. Refs #14025.\n\n## Contributors\n\nThanks to this release's contributors: @lancy69, @SivanCola, @chuiwenwei, @kevin9327\n\n## What's Changed\n* feat(installer): close a running Studio thoroughly and say how when it cannot by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14659\n* fix(doctor): a catalog that recorded a failure is not ok by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14549\n* feat(proc): expose root wait completion / 区分根等待完成与取消返回 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14459\n* feat(mutation): coordinate opaque writes across roots / 未知范围写入跨根互斥 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14446\n* feat(isolation): prepare Store-owned candidates / 由结果 Store 统一准备候选 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14494\n* fix(studio): clarify worktree labels and directory choices / 简化工作树标识并保留目录模式选择 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14619\n* fix(deps): bump golang.org/x/net to v0.62.0 for GO-2026-6860 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14685\n* feat(openwith): say why an installed program is not offered by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14654\n* feat(studio): add adjustable conversation viewport width by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14667\n* fix: retain delegated Goal usage ownership / 保留委派任务的 Goal 用量归属 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14661\n* fix(delegation): refuse unknown saved run states / 拒绝未知子任务恢复状态 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14656\n* fix(studio): the Execution row uses the same text size as the Thinking row by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14686\n* feat(desktop): drop the title block above each settings page by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14700\n* fix(studio): composer menus open above the plan bar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14731\n* feat(studio): graphics rendering lives on the window and performance page by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14732\n* fix(studio): align settings header button heights by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14707\n* fix(studio): keep project controls outside the scrolling tree by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14708\n* fix(studio): use semantic typography in session rename dialog by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14709\n* fix(studio): primary actions in settings keep their paired text colour by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14733\n* fix(testenv): isolate config locks from the real user home by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14711\n* fix(tui): a restored image-only turn is still a turn by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14716\n* fix(sessionstore): an unprovable lease is its own answer by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14727\n* fix(repolint): register the wire mirrors that had no guard by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14729\n* fix(gitignore): treat a root name starting with .. as inside the repo by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14734\n* fix(sandbox): a Windows session passes over a Git Bash that cannot start under the token by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14735\n* docs(release-notes): studio 2.55.0 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14761\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.54.0...studio-v2.55.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n","mentions_count":5}
