684423,"node_id":"RA_kwDOSIatD84sB24H","name":"ReasonixStudio-windows-arm64-installer.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":135028216,"digest":"sha256:8fad6ffbe4438a93c5ae33d772e3afc9c3d015ed140e44fe026e48ba661cbe47","download_count":32,"created_at":"2026-11-12T08:27:57Z","updated_at":"2026-11-12T08:28:06Z"},{"id":738684460,"node_id":"RA_kwDOSIatD84sB24s","name":"ReasonixStudio-windows-arm64-installer.exe.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":299,"digest":"sha256:717711f2334663dfa1da68fac91673b96ebf34e1d67206e3b390ad7159dbf2dd","download_count":5,"created_at":"2026-11-12T08:27:58Z","updated_at":"2026-11-12T08:27:58Z"},{"id":738684479,"node_id":"RA_kwDOSIatD84sB24_","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":186981161,"digest":"sha256:cbc2d33113d85ab7919585d494968bffce794aad306c1375d9650f7bc0c5eddc","download_count":16,"created_at":"2026-11-12T08:27:58Z","updated_at":"2026-11-12T08:28:11Z"},{"id":738684496,"node_id":"RA_kwDOSIatD84sB25Q","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:a2b50e6a11cc422df95332bfa5147637c53e9f2ed0594ef0988d23afdfe7df39","download_count":5,"created_at":"2026-11-12T08:27:58Z","updated_at":"2026-11-12T08:27:59Z"},{"id":738684525,"node_id":"RA_kwDOSIatD84sB25t","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:e0dad0dab4f07272b7ede68e6a832fa3c58bb3659c0438a9ccd332f7e999698a","download_count":53,"created_at":"2026-11-12T08:27:59Z","updated_at":"2026-11-12T08:27:59Z"}],"body":"本版是最后一个版本：移除软件内的反馈建议、崩溃报告上传和匿名统计，并修复文件树、提交历史等一批问题。\n\n## 新增\n\n- 工作台的文件树可以拖动边缘调整宽度，宽度会被记住，双击边缘恢复默认 (376376843)\n- 新增「进程」按钮，点开列出本会话正在运行的后台任务和子智能体 (3807e411d)\n- 新增设置「允许模型直接打开工作区内的文件夹」，默认关闭；打开后模型把本工作区内的文件夹加入项目时不再弹批准卡 #15090\n\n## 修复\n\n- 公式不再被裁掉上标的顶部 #15092\n- 没有伪控制台的 Windows 上，终端会说明原因，而不是报\"shell 启动失败\" #15091\n- 在 Cygwin 或 MSYS 终端里运行时，会提示界面无法在这里运行以及该怎么办 #15091\n- Windows 上安装前端依赖（pnpm install）不再失败 #15067\n- 操作被拒绝时的原因不再被输入框盖住 (f4b815ecd)\n- 读取内核失败时，窗口会说明内核无法连接以及是哪一次读取，而不是只显示\"Failed to fetch\" #15070\n- 窄栏里「更改」标题行的按钮换行显示，不再挤成竖排并出现横向滚动条 (a717dcd34)\n- 提交历史会在新提交出现、分支变化时自动刷新 (803583e4a)\n- 选了资源管理器后，右边不再留着已经打开的启动菜单 (0a17f7774)\n- 归档长会话时不再逐个规范化其他会话的路径，归档明显更快 (5cd38fde8)\n- Homebrew 安装不再因为 cask 无法读取而失败 #15071\n- 构建改用 Go 1.26.11，修复标准库 net/http 的已知漏洞 GO-2026-6859 (75f560400)\n\n## 移除\n\n- 移除软件内的反馈与建议入口、崩溃报告上传和匿名统计；项目不再维护 (21ffa334b)\n\n## 升级须知\n\n- 本版之后项目不再维护。软件不会再向维护者发送任何报告或统计，`reasonix report send` 会被拒绝；更新检查和扩展市场仍会访问原有服务，服务停止后将不可用 (21ffa334b)\n\n---\n\n<!-- lang:en -->\n\nThis is the last release: it removes the in-app feedback, crash report upload and anonymous statistics, and fixes a batch of issues in the file tree, commit history and more.\n\n## New\n\n- The workbench file tree can be resized by dragging its edge; the width is remembered and a double click restores the default (376376843)\n- A new Processes button opens a list of this session's running background jobs and sub-agents (3807e411d)\n- A new setting, \"Let the model open folders inside the workspace directly\", is off by default; when on, the model adds folders inside this workspace to the project without an approval card #15090\n\n## Fixed\n\n- A display formula no longer loses the top of a raised exponent #15092\n- On a Windows without a pseudoconsole, the terminal says so instead of reporting that the shell failed to start #15091\n- Run from a Cygwin or MSYS terminal, it says the UI cannot run there and what to do instead #15091\n- Installing the frontend dependencies (pnpm install) on Windows no longer fails #15067\n- The reason an action was refused is no longer painted over by the composer (f4b815ecd)\n- When the kernel cannot be reached, the window says so and names the read, instead of showing only \"Failed to fetch\" #15070\n- In a narrow explorer the Changes header wraps its buttons instead of squeezing into a vertical stack with a horizontal scrollbar (a717dcd34)\n- The commit history refreshes when a commit appears or the branch changes (803583e4a)\n- Choosing the explorer no longer leaves the start menu beside the tree it just opened (0a17f7774)\n- Archiving a long session no longer canonicalizes every other session's path, so it is noticeably faster (5cd38fde8)\n- Homebrew installs no longer fail because the cask cannot be read #15071\n- Builds now use Go 1.26.11, which fixes the known net/http vulnerability GO-2026-6859 (75f560400)\n\n## Removed\n\n- The in-app feedback and suggestion entry, crash report upload and anonymous statistics are removed; the project is no longer maintained (21ffa334b)\n\n## Upgrade notes\n\n- The project is no longer maintained after this release. The app sends no report or statistic to the maintainers, and `reasonix report send` is refused; update checks and the extension market still use the existing services and will stop working once those are shut down (21ffa334b)\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.60.0...studio-v2.61.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n"}
