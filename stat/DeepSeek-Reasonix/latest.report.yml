_count":4,"created_at":"2026-11-07T15:54:04Z","updated_at":"2026-11-07T15:54:04Z"},{"id":721150816,"node_id":"RA_kwDOSIatD84q--Ng","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":186774958,"digest":"sha256:06dc8b9a0a5534e1d9ef08494e36a19e3e6bb1ce55fa3f7181f3a65582225b55","download_count":9,"created_at":"2026-11-07T15:54:04Z","updated_at":"2026-11-07T15:54:10Z"},{"id":721150812,"node_id":"RA_kwDOSIatD84q--Nc","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:5070f939457d67aac8dbe8774cbbc89a8b279836cc081008e92db5b772030406","download_count":4,"created_at":"2026-11-07T15:54:04Z","updated_at":"2026-11-07T15:54:05Z"},{"id":721150840,"node_id":"RA_kwDOSIatD84q--N4","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:905920bbc1e96f217d7738a070e5aa5c4599bb6532a00f4c61f6d1ba78bb6b31","download_count":20,"created_at":"2026-11-07T15:54:05Z","updated_at":"2026-11-07T15:54:05Z"}],"body":"本版重新排版了手机端（标题栏、审批、输入区、模型菜单、设置），让设置更好找（搜索按相关度排序、每页有目录），并缩小了发给模型的工具定义、加快了启动和长会话的恢复与保存。\n\n## 新增\n\n- 记忆按「星系」归类，带重要度和遗忘曲线：常用的越记越牢，久不用的慢慢淡下去，仍能搜到（da640949c、bfc838a3c）。\n- 约束类和每轮常驻的记忆永不变淡（c22dd9495）。\n- 设置里的记忆页改成三栏：左边分类，中间带搜索的列表，右边详情，可改类型、星系、重要度（d0289a4d0）。\n- 刚记住的记忆放在「新的」里，一键「对 / 忘掉」；忘掉是归档，不是删除（d0289a4d0）。\n- 手机宽度（≤520px）重新排版：标题栏保留会话列表、居中的标题和机器状态；断线时说明正在重连（411e19d87）。\n- 手机上的审批卡是两个等宽的大按钮，拒绝在左、允许在右，其余选项收在「更多选项」后面（411e19d87）。\n- 手机上的输入区只留添加、模型和发送，其余控件收在一个「更多工具」按钮后面；运行中发送变成圆形暂停键（ae46c30d3）。\n- 手机上的模型菜单改为贴底的面板；推理深度是一条品牌色的深度线，松手时才选定（e8b13d13d、8c71d355b）。\n- 手机上的设置全屏、单列，分类变成顶部可滑动的一排，鼠标滚轮也能横向滑动（37ec85381、081f35e9d）。\n- 设置搜索按相关度排序，可输入多个词或一整句；43 条常见说法（如「深色模式」「换模型」「关闭通知」）都排在前三，其中 23 条原来显示「没有匹配的设置」（4779d91c5）。\n- 每个设置分类页顶部有「本页包含」目录，折进该页的设置也能一键跳到（4779d91c5）。\n- 有新版本时，侧栏底部会出现「新版本 x.y.z 可用」按钮，点一下直接打开版本页；已下载待重启时也在这里提示（289033df0）。\n- 更新方式默认改为「通知」：全新安装会在后台读取版本目录，发现新版本时提示，不下载也不安装；选过「手动」的会被保留（289033df0）。\n\n## 变更\n\n- 执行过程步骤超过 6 项时，更早的步骤合成一行，写明有几项、各是什么类型，点开能看全部；失败和运行中的步骤不会被折叠（42e8d2e5a）。\n- 提问卡里的单行选项压到一行的正常高度，只有带说明的选项才会变高（ed18015c1）。\n- 对话正文默认字号改为 14 像素（原来中文 13、英文 12.5），「正文字号」的四档也相应调整（c84e1682e）。\n- 内置浏览器的空白页改成中文标题，并说明模型操作页面时页签上会有蓝点（0b21cafee）。\n- 输入框里的「N 个文件已更改」移到右上角，和左上的运行徽标同一行（1a649b2ff）。\n- 输入框下方的按钮和选择器统一成同一个高度（52534f832）。\n- 运行中的输入框：停止键改成红色圆形，发送键一直在旁边，输入后变成「插话」或「排队发送」按钮（efdbf9788）。\n- 运行中输入框提示「运行中也可以继续输入…」，模型按钮前显示厂商图标（efdbf9788）。\n- 还没连接模型服务时，输入框上方的提示带警告图标，并说明「发不出去」（97c3ebbbf）。\n- 上下文用到 80% 以上时，状态栏里的上下文读数和圆环变成橙色提醒，不弹窗（20903c347）。\n- 上下文压缩只有一个自动触发点：输入到模型窗口的一定比例，新配置默认从 85% 改为 90%，已有配置保持原值（7e1cdccb8）。\n- 工作台页签和文件列表里的文件图标按类型着色：代码、数据、图片各一种颜色，文档和未知类型保持灰色（df2ae9661）。\n- 界面字体改成设计稿的字体栈：英文数字用 Inter，中文优先用系统字体（苹方、微软雅黑 UI），内置的 Inter Studio 和 Noto 作后备，中文笔画比之前更细（46dd272fc）。\n- 最左边的图标栏默认不再显示，用量、文件、工具与权限、扩展、记忆、远程、反馈这些入口都在侧栏里；要图标栏可以在设置的「导航与侧栏」里打开，已经选过的保持原样（e461d4899）。\n- 输入框下方的后台任务读数写明有几个在跑；没有在跑但有失败时变红并写明失败几个，否则显示已结束的总数（751974427）。\n- 有两个以上后台任务在跑时，任务列表多了「全部停止」，点一次确认后才会全部停下（498d2af00）。\n- 后台任务的用时写成「12 分 21 秒」，停止要再点一次「确定」，3 秒不点自动收回（11169ceb3）。\n- 子代理统一为 `spawn_agents`，一次 1 到 8 个并行任务，子代理自带读文件、写文件、执行命令三件工具（ad2c96347）。\n- 计划模式下子代理只读；完整输出归档，主模型先看开头和引用，再用 `read_subagent_result` 读后面（ad2c96347）。\n- `complete_step` 不再要求提交证据，计划步骤不再有验收和检查字段（5766a8ebe）。\n- `use_capability` 的说明不再提 `task:fleet`，工具清单前缀因此变化一次（ad2c96347）。\n- 按钮统一成三种尺寸：小号 24px 胶囊、中号 32px 圆角、图标 28px 方形；各页面原来各不相同的高度和圆角都改成一致（3d6e532b0）。\n- 设置里的输入框统一成一种样式：32px 高、7px 圆角、13px 字，聚焦和出错的光圈一致；模型逐行的价格和上限用 24px 小号（0e1dff5b5）。\n- 下拉框统一成一种样式：32px 高、7px 圆角、细灰箭头贴右边，列表行里用 24px 小号；不再显示系统自带的粗箭头（e3e06303f）。\n- 工作台的新标签页给每个入口加了一句说明，并加了标题（dddcf2b3d）。\n- 底部状态读数里的缓存和本会话花费前加了图标，数值用正文色、标签用浅色（2db788599）。\n- 输入框里的模型和推理强度合成一个按钮、一个面板：左边选模型，右边选这个模型的推理强度（5d560c287）。\n- 按钮上推理强度只写一次中文，悬停显示完整的模型和档位（5d560c287）。\n- 「移到另一个项目」对话框改成单选列表，并把「会带走」和「不会带走」分成两栏（38143faff）。\n- 没有别的项目时可以直接在对话框里添加项目（38143faff）。\n- 命令面板更宽（600），位置略靠上，背后是淡淡的压暗而不是模糊（0a8829fbb）。\n- 命令面板打开时先列出「最近用过」，是你最近选过的三个操作或会话（2b6405327）。\n- 命令面板可以用开头的 `>` `#` `,` 只搜操作、会话或设置，Tab 切换范围；搜索时「最佳匹配」单独排最前，也能直接搜到设置并跳到对应位置（f46e8a274）。\n- 等你批准的权限请求卡加了强调色描边，按钮行不再压在灰条和分隔线上（cbaaeb98f）。\n- 批准、提问和扩展请求这几种需要你处理的卡片，头部统一显示强调色的「等你处理」标签，处理后变成「已处理」（c78941743）。\n- 消息导航条的悬停卡片：数字和文字之间不再有空格，标题旁写明改了几个文件，下方提示点击跳转和右键加星标（d7e6e0129）。\n- 消息导航条里，改过文件的消息横线更长，一眼能和普通消息分开（b14f1ea82）。\n- 侧栏的会话行和项目行改成与设计稿同一份样式：行高 30、悬停时时间换成「···」菜单、置顶图钉放在标题右侧（8e203505d、9c4393d30）。\n- 界面英文和数字改用内置的 Inter 字体，字重也不再全部变成最粗（b4c548b1a）。\n- 排队消息上的「立即发送」改成设计稿里的 24px 胶囊按钮（ff34193a5）。\n- 「最近的会话」按「今天」「更早」分组，搜索框带图标，运行环境收成紧凑的选择框（d0f2be43a）。\n- 「最近的会话」里正在运行或等你确认的会话会写出状态，并可以用上下方向键选、回车打开（c97d7b6af）。\n- 批量选择会话时，操作条固定在会话列表底部，按钮统一成小号（5b51c0128）。\n- 侧栏的会话筛选改成一个下拉，每项带数量，新增「等你处理」「未读」两个筛选，选中后旁边有一键清除（8b1218dd4）。\n- 会话行上给 1.x 创建的会话加的「旧」小标签去掉了，和设计稿一致（一行最多一个标签）（8b8ca3605）。\n- 会话右键菜单按用途分成五组，导出合成一项并可选 Markdown 或 JSON（738182072）。\n- 会话在运行时先给「暂停执行」，不能关闭或移动的原因直接写在菜单项下面（738182072）。\n- 会话列表里，运行中的会话行右侧写「运行中」，等你处理的写「等你确认」，代替时间（a0ce00b5f）。\n- 侧栏的会话行和项目行改成设计稿的尺寸：行高 30、会话标题 13 号字，本地项目前面加了折叠箭头（a51e00325）。\n- 侧栏会话行按设计稿：左边一个状态圆点（蓝＝运行中，橙＝等你确认，黑＝未读），右边一个状态词或时间；时间写成「刚刚、N 分钟、N 小时、昨天、月-日」；去掉原来的竖条、微光、闪烁和阴影，会话行不再往里缩进（962da251e）。\n- 在会话列表里搜索时，每个标题里命中的部分会高亮（aebed7fb5）。\n- 会话行右边那个「+1」小胶囊去掉了，设计稿里一行最多一个标签；有早先版本或恢复副本的会话，在它的「···」菜单里多一项「早先版本（N）」，点开在会话下面原地展开，缩进一层的灰色小字（d23cfeb21）。\n- 设置里「会话」「人设」「会话间消息」合成一页「Agent 行为」，设置现在是 10 页（d0b1bc8fd）。\n- 设置里的「自动化」并入「扩展」页的已安装视图，设置现在是 9 页（a2289aa88）。\n- 设置的「常用」页分成「开始」「输入与提醒」两张卡，每项一行、控件在右边，语言改成下拉，和设计稿一致（765ac8aa2）。\n- 设置新增第一页「常用」，把最常改的六项放在一起：新对话的起始模式、更新方式、语言、发送快捷键、通知和明暗，它们不再散在别的页里（862f8865c）。\n- 设置里「网络」和「远程」合成一页「连接」：网络、远程机器和手机访问放在一起（10d87b83a）。\n- 设置里「记忆」「用量」「存储」合成一页「数据」，「账号」和「版本」合成一页「账号与关于」，设置的页数现在是 12 页（111debd2b）。\n- 设置的外观页拆成「外观」「对话显示」「操作与性能」三页，设置现在是设计稿的 11 个分类：常用、模型、Agent 行为、权限与安全、扩展、对话显示、操作与性能、外观、数据、连接、账号与关于（d3b6daef1）。\n- 设置里几项挪到设计稿归的页：备份、会话写入位置、自动归档、1.x 旧会话在「数据」，追踪导出在「账号与关于」（eae50a7a5）。\n- 设置左栏的 11 个图标换成设计稿里的图标，栏宽 240，搜索框 32 高，文字改用设计稿的字体（系统中文字体优先），说明文字用设计稿的浅灰色（e2c1587e7）。\n- 设置的标题和搜索框挪到左栏顶部，每个分类右边显示它有几项，关闭和放大按钮放在右上角，和设计稿一致（43e78eda0）。\n- 设置窗口的外壳、卡片、行、分段按钮和下拉，按设计稿量出的数值调整尺寸和字号（8ee94c103）。\n- 设置里「模型偏好」和「模型服务」合成一页「模型」：按用途选模型、上下文维护、模型服务和连接检测都在这一页（80353df7e）。\n- 设置左侧的分类按设计稿的顺序平铺，不再分组；「工具与权限」改叫「权限与安全」，每一页顶部写明有几项和这一页管什么（0767a73bd）。\n- 设置的每一页顶部加了当前页标题，写明所属分组和页面名，滚动或搜索跳转后不会迷路（f066c3ad8）。\n- 设置的「权限与安全」不再是四个子页，而是一页里分「批准」「沙箱与执行」「联网与浏览器」三个小节；计划批准挪到「Agent 行为」，AI 文件交付卡片挪到「对话显示」（84ebeedc0）。\n- 设置的「常用」页每一行统一成设计稿的样式：名字、说明在左，分段、下拉或开关在右（a5d5e7653）。\n- 设置里只有一个开关的项并成一行，开关在右边；「数据」页分成「记忆与用量」「会话存储」「备份」三张卡（7dd377fe4）。\n- 设置搜索结果现在写「页面 › 小节」，合并进别的页的旧页名（例如「模型服务」「远程」「自动化」）仍然搜得到（8def264b9）。\n- 设置里「权限与安全」的每个小节改成一张卡，卡里一项一行，分段选择放在这一行右边，说明和「本机 · 立即生效」收紧在名字下面，和设计稿一致（ff391889b）。\n- 设置页标题把名字、说明和项数写在一行；「Agent 行为」里计划与提问、协作各成一张卡（757415776）。\n- 浮层的投影统一读一个阴影颜色变量，不再各自写死黑色（9d9926e48）。\n- 侧栏顶部按设计稿 1:1：商标字形和下面按钮的图标左对齐，STUDIO 徽标和商标字母基线对齐，右边加了收起侧栏按钮，侧栏默认宽度从 316 改成设计稿的 264（3197b4c56）。\n- 「收起所有项目」「展开所有项目」是「项目 / 最近」那一行里「全部」左边的图标按钮，搜索时置灰；项目行的「···」菜单里只留「选择本机会话」（b0a0adc2f）。\n- 侧栏顶部按设计稿重做：「新建会话」「搜索会话与操作」是带边框的按钮，右边写出快捷键 Alt N 和 Ctrl K；文件、工具与权限、扩展、记忆、远程这一串入口挪到侧栏底部（594a2bd74）。\n- 侧栏顶部品牌行高 32、上面留 12，项目分组之间不再多空一截，按设计稿；macOS 为了让出红绿灯按钮仍用标题栏的高度（146271386）。\n- 侧栏「项目 / 最近」那一行里画板没有的「···」去掉了：「选择本机会话」（批量管理）挪到每个项目行的「···」菜单里，和设计稿一致；「收起所有项目」暂时也放在那里，等设计稿定位置（d10bdfaad）。\n- 侧栏里的「远程」入口旁边显示在线的机器数，没有在线的就不显示（0de5fe17c）。\n- 侧栏的「项目 / 最近」改成设计稿里的一行：左边是「项目｜最近」分段控件，右边是「全部 ⌄」筛选和「+」；原来单独一行的筛选并进这一行，「收起所有项目」挪进「···」菜单（032ae8f08）。\n- 几处小按钮（资源管理器里的「暂存全部」「提交」、改动文件胶囊、模型筛选标签）统一成同一个小号高度（c3563fc22）。\n- 界面圆角、正文字号和动画时长统一到设计规范：圆角略大，动画略快（0280ffb39）。\n- 之前直接写死的圆角和时长改为统一取自设计变量，主题的圆角设置现在对它们也生效（0280ffb39）。\n- 出错的子代理现在写「失败」，原因放在悬停提示里，不再写「已中断」（f2b44860c）。\n- 输入框下方的子代理读数写明有几个在跑；全部结束后变成灰字，显示一共派过几个（ce6c6d144）。\n- 折叠后的思考标签先写字数再写用时，用时取整秒，例如「思考 214 字 · 6 秒」（6eda69659）。\n- 窗口角落的提示统一了样子：带图标，失败和说明一眼能分开，按钮和其他界面一致（419b65dbc）。\n- 更新提醒和「界面是不是偏小」也用同一种样式（419b65dbc）。\n- 界面里所有文字字号统一到六档（11 / 12 / 13 / 14 / 17 / 22），原来 9、10 像素的小字略微变大（f360221b0）。\n- 英文界面的字重和中文一致，统一到 500 / 600 / 700 三档，输入框正文固定为 14 像素（7f7f64e7f）。\n- 界面所有文字的字重统一到三档（常规 / 中 / 粗），原来零散的 450、550、620 等字重归并（5f78e0b21）。\n- 工作台页签改成文件夹式：所有页签同高、顶部圆角，当前页签和下面的内容相连、字更粗（71212621b）。\n- 工作台新标签页多了「最近打开」，列出这个项目最近打开过的 6 个文件，点一下就重新打开（c5483809c）。\n- 桌面端设置搜索的结果铺满右侧页面栏，不再横跨并盖住左侧分类（87d20e14b）。\n- 首轮发给模型的工具定义缩小约 27%：浏览器、设置、文件交付、压缩和上下文余量等工具改为按需使用，说明里按名称列出（c8afd3be6、339f443ff）。\n- 全自动模式下，记住和忘掉记忆不再弹确认（5b8097617、26f72585e）。\n- 窗口顶栏、侧栏底部、输入框、对话气泡与执行卡、生成文件卡按新设计稿重画（fe55132d5、732d5f94d、04ad0e3c2、673459479、9937a1cb4）。\n- 工作台重画：页签栏、文件树、路径栏、阅读/编辑/Diff 分段按钮、命令面板（ca167b6c4、f28fdf47f、a922116e9、93b39b755、a7fbbe179、3ada52167、29c042439）。\n- 工作台的变更页、菜单、编辑器工具栏和「打开方式」统一到同一套样式（07c77d946、fb1cbc547、12aa7764c、6affac79d、fbcd7d077）。\n- 记忆页、字体排版和开关控件按设计稿重画（0c428a31f、0f3f03aa9、eb386d72a）。\n- 反馈中心、我的反馈和新建反馈重画（16bc3c691、17f5a5621、7480ae88f）。\n- 思考块、执行块、计划卡和连续读取的样式与动效重画（627ee68b8、6cf29ac1b、ad1a11685、f90ab3cce、62b543555、00601023c、002a3216f）。\n- 子代理、后台任务和消息导轨重画（a0a50379c、3fafc4a52、2d3b79163、7d2e9b945、bf34fd5d3、200db241a、c370090b8）。\n- 浏览器登录、PDF 与 Office 预览重画（8ab2315dd、a87cb3ac5、3d50eddcc）。\n- 扩展与市场页面重画（80b9d44fb、e7bcc1e4b、263344eae、954c8ff8e、d66f91ea2、4e7432422）。\n- 远程与设备页面重画（8a18aa87e、5f937aa60、0dbb8abc1、7abb8c142、8473abce7、8e89cefdd）。\n- 首次引导与用量页重画（7ee8ae017、a54fd4585、2228d8862、954961436）。\n- 设置的子页面与窗口页重画（948604dfe、29c7d74ce、cfdc83247、288a47b34、0355736aa、febf34475）。\n- 设置的其余页面按同一套样式收齐（0b8c08fd5、c4e07cbe0、3d0fae17a、6a733bb77、bf6ff1be7、98e340699）。\n- 侧栏会话列表、命令面板与若干小修（112ea17e8、4e09005d0、e28583407）。\n- 压缩折叠与轻量卡片重画（7b43b1455、12bad68c6）。\n- 重绘期间其余的界面细节修正（ec63de72e、c93eabbe4、53cd9a0ac、22aeea5cd、f4f342cec、870a5ef3c、15078fbdb、965b9c1af）。\n- 重绘期间其余的界面细节修正（847246803、e239a0745、b2b1b2302、e512b30cf、cf4ed6d7c、52ce4c5dd、25f26b071）。\n\n## 修复\n\n- DeepSeek 只输出思考而没有答案时，现在会提示并最多重试两次；仍无答案则明确报错，不再静默结束。关联 #14940 by @lancy69。\n- 修复在 1.x 里用过的会话提示「该待送达由更高版本写入，当前版本只能读取」的问题：队列里的消息既不能发送也不能删除（#14966）。\n- 现在能正常读写 1.x 留下的待送达队列。带着 1.x 图片的消息会停住并说明原因，不会去掉图片照发（#14966）。\n- Windows 上防火墙或安全软件拦截了本机入站连接时，Studio 不再等 21 秒后只报一个看不懂的 ERR_CONNECTION_TIMED_OUT，而是几秒内告诉你内核在运行但连不上它，并说明要放行 Reasonix Studio 和 reasonix-studio-host（#14970）。\n- 提问卡里点一下下方的填写框，就会自动选上「其他 —— 自行填写」，不用再先点那个选项（3933dbed4）。\n- 修正设置里「在输入框上方显示文件改动」的说法：这个「n 个文件已更改」标签实际显示在输入框的顶部，文案改成「输入框顶部」，和实际位置一致（7f4d00ca95）。\n- 修复 Windows 上安装或更新被「Reasonix Studio 仍在运行」反复拦住的问题：机器上有别的应用留下的 `cua-driver.exe`（比如以管理员身份运行、或父进程已退出的孤儿进程）时，安装器会把它当成 Studio 本体，点多少次重试都过不去。现在只按名字匹配 Studio 自己的程序，不再匹配这个多个应用共用的驱动（f1bbea388）。\n- 上下文已超过自动压缩线时点“立即压缩”，只要能腾出空间就会压缩，不再提示“无需压缩”（cee09e76b）。\n- 修复在「设置 → 数据 → 存储」里更改位置时，每敲一个字符就在磁盘上留下一个半截目录的问题（比如输入 `D:\\test\\reasonix` 会留下 `r`、`re`、`rea` 等 8 个空目录）。现在预检只读：它在目标最近的已存在上级目录里验证可写、读取剩余空间，目录要等你点「开始迁移」后才创建；输入路径时也不再每个字符都请求一次，而是停顿后再检查（#14998）。\n- 手动 /compact 在上次折叠之后只新增了少量内容时不再被拒绝；内容完全没变时仍会跳过（756c6159a）。\n- Windows 启动更快（143 ms 降到 91 ms）；恢复和保存很长的会话时不再重复重放事件日志（63da66261、7c7e3ff99、868a14cad）。\n- 渲染器管理的技能警告：TUI 和 Studio 的技能诊断改用渲染器管理的通知，包括斜杠补全时的首次和新增警告；#13656 的重复警告去重和非交互 stderr 输出保持不变。关联 #13655 fixed in #14943 by @lancy69。\n- 历史搜索在索引读不到来源时不再表现为「没有结果」，而是说明结果可能不完整（索引失败或仍在建立）。关联 #14947 by @chuiwenwei。\n- ACP 的会话租约拒绝现在带机器码：`-32022`（被另一窗口持有）与 `-32023`（所有权无法证明），不再一律回 `-32600`/`-32603`。关联 #14948 by @chuiwenwei。\n\n## 移除\n\n- 移除按绝对大小提前压缩的上限，以及设置页里的“整理策略/阈值”和上下文面板里的拖动手柄（7e1cdccb8）。\n- 折叠时不再省略保留下来的失败输出，也不再为此多发一次模型调用（7e1cdccb8）。\n- 移除 `task`、`fleet`、`parallel_tasks`、后台子任务、转向、`continue_from`、隔离工作树和多候选择优（ad2c96347）。\n- 移除“完成标准”、交付验收卡片、就绪检查、评审闸和基线检查（b364c1693）。\n- 移除缺失推理检测（be5c98c74）。\n- 移除 `--fail-on-unverified` 和 `agent.host_verification`，旧配置里带这些键仍可加载（8c785fa4b）。\n- 设置页移除“给运行中子代理的指示”（ad2c96347）。\n- 移除任务预算设置 `task_cost_budget`、`task_time_budget_minutes`、`task_token_budget`：任务不再因为花了多少而被截停，老配置里的这些键启动时会自动清理并提示一次（a341d5615）。\n\n## 贡献者\n\n感谢本版本的贡献者：@lancy69、@chuiwenwei\n\n---\n\n<!-- lang:en -->\n\n## New\n\n- Memories are grouped into galaxies with importance and a forgetting curve (da640949c, bfc838a3c).\n- What gets used stays clear; what does not fades slowly and stays searchable (bfc838a3c).\n- Constraints and pinned memories never fade (c22dd9495).\n- The memory page in Settings has three columns: categories, a searchable list, and details (d0289a4d0).\n- Type, galaxy and importance can be changed from the details pane (d0289a4d0).\n- Newly learned facts wait under New for a one-click confirm or forget; forget archives (d0289a4d0).\n- Phone-width layout (up to 520px): the title bar keeps the session list, a centred title and the machine's state, and says it is reconnecting when the link drops (411e19d87).\n- On a phone the approval card is two equal large buttons, refuse on the left and allow on the right, with the other options behind More options (411e19d87).\n- On a phone the composer keeps add, the model and send, with the other controls behind one More tools button; send becomes a round pause while a turn runs (ae46c30d3).\n- On a phone the model menu is a sheet along the bottom edge; reasoning depth is a line in the product's colour that is chosen when it is let go (e8b13d13d, 8c71d355b).\n- On a phone Settings is full screen in one column, the categories are a strip along the top, and the mouse wheel scrolls it sideways (37ec85381, 081f35e9d).\n- Settings search ranks by relevance and takes several words or a whole sentence; 43 everyday phrasings (such as dark mode, switch model, turn off notifications) rank in the first three, 23 of which used to say No matching setting (4779d91c5).\n- Each Settings category page opens with an On this page index, so settings folded into it are one click away (4779d91c5).\n- When a newer release is published, the sidebar footer shows a \"Version x.y.z available\" button that opens the version page; a downloaded release waiting for a restart is shown there too (289033df0).\n- The default update mode is now Notify: a fresh install reads the version catalog in the background and says when a release is newer, without downloading or installing; an explicit choice of Manual is kept (289033df0).\n\n## Changed\n\n- Past six steps, earlier ones fold into one line saying how many and of what kind; failed and running steps are never folded (42e8d2e5a).\n- Options in a question card are one normal row tall; only an option with a description grows (ed18015c1).\n- The conversation body now defaults to 14px (it was 13 in Chinese and 12.5 in English), and the four body-size steps follow (c84e1682e).\n- The built-in browser's blank page has a Chinese title and explains the blue dot on the tab (0b21cafee).\n- The changed-files pill in the input box moves to the top right, on the same row as the run badge (1a649b2ff).\n- The buttons and selectors under the input box now share one height (52534f832).\n- While a turn runs, stop is a red circle with send beside it, and send becomes a Steer or Queue button once you type (efdbf9788).\n- The input box says you can keep typing while it runs, and the model button shows the vendor's mark (efdbf9788).\n- The note above the input when no model service is connected now has a warning icon and says nothing can be sent (97c3ebbbf).\n- From 80% context use, the status reading and its ring turn the warning colour, with no dialog (20903c347).\n- Context compaction has a single automatic trigger, a share of the model window; the default for new configs moves from 85% to 90% and saved configs keep their value (7e1cdccb8).\n- File icons in the workbench tabs and file list are tinted by kind: code, data and images each get their own colour; documents and unknown types stay grey (df2ae9661).\n- The interface font stack is the designed one: Inter, then the system CJK fonts, with the bundled Inter Studio and Noto as fallbacks, so Chinese text is lighter than before (46dd272fc).\n- The far-left icon column is off by default, and its entries are in the sidebar; settings can turn it on (e461d4899).\n- The background-job reading under the composer says how many are running, turns red and says how many failed once none is running, and otherwise reads the total that ended (751974427).\n- With two or more background jobs running, the job list offers \"Stop all\", asking once before it stops them (498d2af00).\n- Background task times read as minutes and seconds, and stopping takes a second press that lapses after three seconds (11169ceb3).\n- Sub-agents are now one `spawn_agents` tool: 1 to 8 parallel tasks, each with read file, write file and run command (ad2c96347).\n- Sub-agents are read-only in plan mode; full output is archived and read in pages with `read_subagent_result` (ad2c96347).\n- `complete_step` no longer asks for evidence and plan steps carry no acceptance or verification fields (5766a8ebe).\n- The `use_capability` description no longer names `task:fleet`, so the tool prefix changes once (ad2c96347).\n- Buttons now come in three sizes: 24px small pills, 32px medium rounded buttons and 28px square icons, the same on every page (3d6e532b0).\n- Text fields in settings share one look: 32px high, 7px corners, 13px text and the same focus and error rings, with a 24px size in per-model rows (0e1dff5b5).\n- Drop-downs share one look: 32px high, 7px corners and a thin arrow at the right edge, with a 24px size in list rows (e3e06303f).\n- The workbench's new tab has a heading and a line under each entry saying what it opens (dddcf2b3d).\n- The cache and session cost readings now lead with an icon, with the value in the text colour and its label in the light one (2db788599).\n- The model and the reasoning effort in the input box are one button and one panel: models on the left, the efforts of that model on the right (5d560c287).\n- The button writes the effort once, and its tooltip gives the full model and level (5d560c287).\n- The move-to-another-project dialog is now a radio list, with what travels and what stays behind in two columns (38143faff).\n- With no other project, you can add one right from the dialog (38143faff).\n- The command palette is wider and sits a little higher, over a plain dim rather than a blur (0a8829fbb).\n- The command palette now opens with a \"Recently used\" group holding the last three actions or sessions you picked (2b6405327).\n- The command palette narrows by a leading > # or , to actions, conversations or settings, ranks a best match first, and finds settings and jumps to them (f46e8a274).\n- A permission request waiting for you is outlined in the accent colour, and its button row no longer sits on a grey strip under a divider (cbaaeb98f).\n- Permission, question and extension-request cards waiting on you show one accent \"Needs you\" tag, which becomes \"Handled\" once answered (c78941743).\n- The message rail's hover card drops the spaces around numbers, names how many files a message changed, and hints at click and right-click (d7e6e0129).\n- On the message rail, a message that changed files draws a longer line (b14f1ea82).\n- Session and project rows in the sidebar now use the same stylesheet as the design boards: 30px rows, the time swaps for a more menu on hover, and the pin sits right of the title (8e203505d, 9c4393d30).\n- Latin text and digits in the interface use the bundled Inter font, and weights no longer all resolve to the heaviest one (b4c548b1a).\n- The Send now button on a queued message is the 24px pill from the design board (ff34193a5).\n- Recent sessions are grouped under Today and Earlier, and the search box and environment select share one row (d0f2be43a).\n- Recent sessions name a running or waiting conversation and can be walked with Up and Down and opened with Enter (c97d7b6af).\n- Selecting several sessions shows an action bar fixed to the bottom of the list, with small standard buttons (5b51c0128).\n- The session filter is one dropdown with a count on each entry, adds Needs you and Unread, and shows a clear mark when a filter is on (8b1218dd4).\n- The small Old tag on sessions kept by Reasonix 1.x is gone from the sidebar rows, as the design allows at most one tag per row (8b8ca3605).\n- The session menu is grouped by what an action does, and export is one entry with Markdown or JSON (738182072).\n- While a session runs, pause comes first and the reason close or move waits is written under the item (738182072).\n- A running conversation row reads \"Running\" and one waiting on you reads \"Needs you\", in place of the time (a0ce00b5f).\n- Session and project rows in the sidebar take the designed size: 30 high, 13px session titles, and a fold chevron before each local project (a51e00325).\n- Sidebar session rows follow the design: a left status dot (blue running, orange waiting, black unread), one status word or the time on the right, ages written as just now, minutes, hours, yesterday or month-day, with the old bar, shimmer, blink and shadow removed and no indent (962da251e).\n- Searching the session list now highlights the matching part of each title (aebed7fb5).\n- The +1 chip on a session row is gone, as a row carries at most one tag; a conversation with earlier versions or recovery copies has an Earlier versions (N) entry in its menu that unfolds them under the row, indented in small grey text (d23cfeb21).\n- Session, Persona and Peer messages settings are one Agent behaviour page, leaving settings with 10 pages (d0b1bc8fd).\n- The Automation settings page now sits in the installed view of the Extensions page, leaving settings with 9 pages (a2289aa88).\n- The Common settings page is two cards, Start and Input and reminders, with one-line rows, controls on the right and language as a dropdown, as designed (765ac8aa2).\n- Settings has a first Common page holding the six most-changed items, which no longer sit on other pages (862f8865c).\n- The Network and Remote settings pages are one Connections page: network, remote machines and phone access together (10d87b83a).\n- Memory, Usage and Storage settings are one Data page, and Account and Version are one Account and About page, leaving settings with 12 pages (111debd2b).\n- The Appearance page is split into Appearance, Conversation display and Controls and performance, so settings has the designed eleven categories (d3b6daef1).\n- Backups, session location, auto-archive and 1.x sessions moved to Data, and trace export to Account and About, as designed (eae50a7a5).\n- The settings left column takes the designed icons, a 240 width and a 32-high search box, and the settings window uses the designed font stack and the lighter note colour (e2c1587e7).\n- Settings puts its title and search at the top of the left column with an item count on each category, and the expand and close buttons at the top right, as designed (43e78eda0).\n- The settings window, cards, rows, segmented buttons and dropdowns take their sizes from the design (8ee94c103).\n- The Model Preferences and Model Services settings pages are one Model page: picking models by purpose, context upkeep, services and connection checks together (80353df7e).\n- The settings list is flat and in the designed order, Tools and permissions is Permissions and safety, and each page says how many items it holds and what it covers (0767a73bd).\n- Each settings page opens with a title naming its group and the page, so a long page or a search jump keeps its place (f066c3ad8).\n- Permissions and safety is one page with Approval, Sandbox and execution, and Web and browser sub-headings; plan approval moved to Agent behaviour and file cards to Conversation display (84ebeedc0).\n- Each row on the Common settings page follows the design: name and note left, control right (a5d5e7653).\n- A setting with a single switch is one row with the switch on the right, and Data is three section cards: Memory and usage, Session storage and Backup (7dd377fe4).\n- Settings search results read \"page › sub-section\", and a page folded into another is still found by its old name, such as Model Services, Remote or Automation (8def264b9).\n- On Permissions and safety each sub-section is one card with a row per item, segmented choices on the right and the scope note under the name, as designed (ff391889b).\n- The settings page title reads on one line with its description and item count, and Agent behaviour groups plans and questions and collaboration into cards (757415776).\n- Drop shadows on floating panels share one shade colour variable instead of each spelling out black (9d9926e48).\n- The sidebar head matches the design: the logo lines up with the button icons, the STUDIO badge shares the logo's baseline, a collapse button sits on the right, and the default sidebar width is the designed 264 instead of 316 (3197b4c56).\n- Collapse and Expand all projects is the icon button left of the filter on the Projects/Recent row, greyed out while searching; the project row menu keeps only Select sessions (b0a0adc2f).\n- The sidebar head follows the design: New session and Search are bordered buttons showing Alt N and Ctrl K, and the Files, Tools, Extensions, Memory and Remote entries moved to the foot of the sidebar (594a2bd74).\n- The sidebar brand row is 32 high with 12 above it and project groups sit flush as designed; macOS keeps the title-bar height to clear the window buttons (146271386).\n- The more menu on the Projects/Recent row, which the design does not have, is gone: Select sessions (batch manage) now lives in each project row's menu as designed, and Collapse all projects sits there too until the design places it (d10bdfaad).\n- The sidebar's Remote entry shows how many machines are online, and nothing when none is (0de5fe17c).\n- The sidebar's Projects and Recent now sit on the designed single row: a Projects/Recent segment on the left, the filter and the add button on the right; the filter row is gone and Collapse all moved into the more menu (032ae8f08).\n- Several small buttons (Stage all and Commit in the explorer, the changed-files pill, the model filter chips) now share one small height (c3563fc22).\n- Corners, the lead text size and animation timing follow the design spec: corners a little larger, motion a little quicker (0280ffb39).\n- Corners and timings that were written as bare numbers now come from the design tokens, so a theme's corner setting reaches them too (0280ffb39).\n- A sub-agent that ended in error is now listed as \"Failed\" with the reason on hover, instead of \"Interrupted\" (f2b44860c).\n- The sub-agent reading under the composer now says how many are running (\"1 subagents running\") and, once they have all finished, the total that were dispatched in grey (ce6c6d144).\n- A folded thought now reads \"Thought 214 chars · 6 s\": how much first, then how long, in whole seconds (6eda69659).\n- Notices in the window corner now share one look: an icon tells a failure from a note (419b65dbc).\n- The update reminder and the \"is the interface too small?\" question use it too (419b65dbc).\n- All text in the interface now uses the six type sizes; the smallest 9 and 10px text is a little larger (f360221b0).\n- Weights are 500 / 600 / 700 in every language, and the input box text is a fixed 14px (7f7f64e7f).\n- Every font weight in the interface is one of three steps (regular, medium, bold); the stray 450, 550 and 620 weights are folded into them (5f78e0b21).\n- Workbench tabs are folder tabs: one height, rounded tops, and the current one joins the content below and reads heavier (71212621b).\n- The workbench start page lists the last six files opened in the project under Recently opened, one click to reopen (c5483809c).\n- On desktop the Settings search results fill the page column instead of floating across and covering the category list (87d20e14b).\n- The tool definitions sent to the model on the first round are about 27% smaller: the browser, settings, file delivery, compress and context-budget tools are used on demand and listed by name in the description (c8afd3be6, 339f443ff).\n- In full-access mode, remembering and forgetting a memory no longer asks for approval (5b8097617, 26f72585e).\n- Top bar, sidebar footer, composer, chat bubbles, execution card and generated-file cards redrawn to the new design (fe55132d5, 732d5f94d, 04ad0e3c2, 673459479, 9937a1cb4).\n- Workbench redrawn: tab bar, file tree, path bar, read/edit/diff segments, command palette (ca167b6c4, f28fdf47f, a922116e9, 93b39b755, a7fbbe179, 3ada52167, 29c042439).\n- Workbench changes page, menus, editor toolbars and open-with share one style (07c77d946, fb1cbc547, 12aa7764c, 6affac79d, fbcd7d077).\n- Memory page, typography and toggles redrawn to the design (0c428a31f, 0f3f03aa9, eb386d72a).\n- Feedback center, my feedback and new feedback redrawn (16bc3c691, 17f5a5621, 7480ae88f).\n- Thinking and execution blocks, plan card, consecutive reads and their motion redrawn (627ee68b8, 6cf29ac1b, ad1a11685, f90ab3cce, 62b543555, 00601023c, 002a3216f).\n- Subagents, background jobs and the message rail redrawn (a0a50379c, 3fafc4a52, 2d3b79163, 7d2e9b945, bf34fd5d3, 200db241a, c370090b8).\n- Browser login, PDF and Office previews redrawn (8ab2315dd, a87cb3ac5, 3d50eddcc).\n- Extensions and market pages redrawn (80b9d44fb, e7bcc1e4b, 263344eae, 954c8ff8e, d66f91ea2, 4e7432422).\n- Remote and device pages redrawn (8a18aa87e, 5f937aa60, 0dbb8abc1, 7abb8c142, 8473abce7, 8e89cefdd).\n- Onboarding and usage pages redrawn (7ee8ae017, a54fd4585, 2228d8862, 954961436).\n- Settings sub-pages and window page redrawn (948604dfe, 29c7d74ce, cfdc83247, 288a47b34, 0355736aa, febf34475).\n- Remaining settings pages brought to the same style (0b8c08fd5, c4e07cbe0, 3d0fae17a, 6a733bb77, bf6ff1be7, 98e340699).\n- Sidebar session list, command palette and small fixes (112ea17e8, 4e09005d0, e28583407).\n- Compaction folds and lightweight cards redrawn (7b43b1455, 12bad68c6).\n- Remaining interface detail fixes made during the redraw (ec63de72e, c93eabbe4, 53cd9a0ac, 22aeea5cd, f4f342cec, 870a5ef3c, 15078fbdb, 965b9c1af).\n- Remaining interface detail fixes made during the redraw (847246803, e239a0745, b2b1b2302, e512b30cf, cf4ed6d7c, 52ce4c5dd, 25f26b071).\n\n## Fixed\n\n- DeepSeek replies with reasoning but no answer now show a notice and retry up to twice, then report an error instead of silently finishing. #14940 by @lancy69\n- Sessions used in 1.x no longer show \"This queue was written by a newer version and is read-only here\" (#14966).\n- The queue 1.x leaves behind now reads and writes normally. An entry queued with 1.x images is held with a stated reason, not sent without them (#14966).\n- When a Windows firewall or security product blocks the local inbound connection, Studio no longer waits 21 seconds and shows only ERR_CONNECTION_TIMED_OUT; within seconds it says the kernel is running but unreachable and which programs to allow (#14970).\n- Clicking into the free-text box under a question now selects \"Other\" without picking that option first (3933dbed4).\n- The setting that said it shows file changes above the input box now says top of the input box, which is where the \"n files changed\" chip actually appears (7f4d00ca95).\n- Fixed the Windows installer and updater being blocked forever by \"Reasonix Studio is still running\". A `cua-driver.exe` left behind by another application (for example one running as administrator, or an orphan whose parent exited) was taken for Studio itself, so Retry could never succeed. Only Studio's own programs are matched by name now, not the driver other applications share (f1bbea388).\n- Compacting by hand above the automatic trigger now folds whenever it frees space, instead of saying there is nothing to compact (cee09e76b).\n- Typing a new location under Settings > Data > Storage no longer leaves a half-typed folder on disk for every keystroke (typing `D:\\test\\reasonix` used to leave `r`, `re`, `rea` and so on as eight empty folders). The check is now read-only: it proves the nearest existing parent is writable and reads its free space, and the folder is only created when you start the move, and typing no longer asks for a check on every character, only once you pause (#14998).\n- A manual /compact is no longer refused when only a little was added since the last fold; an unchanged context is still skipped (756c6159a).\n- Windows starts faster (143 ms down to 91 ms), and resuming or saving a very long session no longer replays the event log (63da66261, 7c7e3ff99, 868a14cad).\n- TUI and Studio skill diagnostics use renderer-managed notices, including first and new warnings during slash completion; the duplicate-warning filter from #13656 and non-interactive stderr output are unchanged. Refs #13655 fixed in #14943 by @lancy69.\n- History search no longer presents an unreadable source as no matches; it says results may be incomplete because the index failed or is still building. Refs #14947 by @chuiwenwei.\n- ACP lease refusals now carry codes, `-32022` for a session held by another window and `-32023` for ownership that cannot be proven, instead of `-32600`/`-32603`. Refs #14948 by @chuiwenwei.\n\n## Removed\n\n- Removed the absolute-size compaction limit, the threshold controls in Settings and the draggable fold handle in the context panel (7e1cdccb8).\n- A fold no longer elides retained failure output and no longer makes an extra model call to choose which lines to keep (7e1cdccb8).\n- Removed `task`, `fleet`, `parallel_tasks`, background sub-tasks, steering, `continue_from`, isolated worktrees and best-of-n (ad2c96347).\n- Removed completion criteria, delivery receipt cards, readiness checks, the review gate and baseline checks (b364c1693).\n- Removed missing-reasoning detection (be5c98c74).\n- Removed `--fail-on-unverified` and `agent.host_verification`; old configs carrying them still load (8c785fa4b).\n- Removed \"guidance to a running sub-agent\" from Settings (ad2c96347).\n- Removed `task_cost_budget`, `task_time_budget_minutes` and `task_token_budget`: a task is no longer stopped by what it spends (a341d5615).\n- Old configs carrying these keys are cleaned on start with a one-time notice (a341d5615).\n\n## Contributors\n\nThanks to this release's contributors: @lancy69, @chuiwenwei\n\n## What's Changed\n* fix(studio): fade clipped tool results without coloured shadows by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14847\n* feat(studio): add opt-in health status to grouped picker / 为原分组模型列表增加可选检测状态 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14634\n* feat(minimax): default to M3.1 Flash and preserve reasoning contracts by @octo-patch in https://github.com/esengine/DeepSeek-Reasonix/pull/14017\n* chore(deps-dev): bump electron from 44.7.2 to 45.1.0 in /desktop/electron by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14902\n* fix(agent): recover DeepSeek reasoning-only final answers by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14940\n* ci: limit pull requests to maintainers and an allowlist of invited authors by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14941\n* fix(skills): render first and new discovery warnings safely in TUI by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14943\n* fix(desktop): prevent version download text overlap by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14938\n* fix(acp): a lease refusal says which refusal it is by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14948\n* fix(history): a search says when the index could not read a source by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14947\n* fix(studio): normalize reply selection menu tracking by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14927\n* fix(gitignore): read info/exclude from the common dir when .git is a file by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14355\n\n## New Contributors\n* @octo-patch made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/14017\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.57.0...studio-v2.58.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n","mentions_count":7}
