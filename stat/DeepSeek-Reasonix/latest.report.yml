_at":"2026-10-22T02:28:55Z","updated_at":"2026-10-22T02:28:55Z"},{"id":664438216,"node_id":"RA_kwDOSIatD84nmoXI","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:90553179a3112a73737218fc0be7599096b1c5b70588c05d2d455b4ac606a654","download_count":10,"created_at":"2026-10-22T02:28:56Z","updated_at":"2026-10-22T02:28:56Z"}],"body":"\u672c\u7248\u5927\u5e45\u964d\u4f4e\u957f\u4f1a\u8bdd\u548c\u5927\u578b\u5de5\u4f5c\u533a\u7684\u9875\u9762\u5185\u5b58\u5360\u7528\uff0c\u9884\u8bbe\u6a21\u5757\u9009\u62e9\u652f\u6301\u591a\u9009\uff0c\u5e76\u4fee\u597d\u8bb0\u5fc6\u591a\u8fdb\u7a0b\u5199\u5165\u4e92\u76f8\u8986\u76d6\u7b49\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u9884\u8bbe\u6a21\u5757\u9009\u62e9\u652f\u6301\u591a\u9009\u3001\u641c\u7d22\u3001\u5168\u9009\u4e0e\u5185\u7f6e\uff0f\u81ea\u5b9a\u4e49\u5206\u7ec4\uff0c\u624b\u52a8\u8f93\u5165 ID \u79fb\u5230\u9ad8\u7ea7\u9009\u9879\u3002\u5173\u8054 #13988\u3002\n\n## \u53d8\u66f4\n\n- \u65e7\u4f1a\u8bdd\u5148\u663e\u793a\u5217\u8868\uff0c\u6458\u8981\u4e0e\u8f6e\u6570\u5728\u540e\u53f0\u8865\u5168\uff1b\u8bfb\u53d6\u672a\u5b8c\u6210\u6216\u5931\u8d25\u4f1a\u660e\u786e\u63d0\u793a\uff0c\u540e\u53f0\u7d22\u5f15\u4f1a\u4e3a\u6253\u5f00\u4f1a\u8bdd\u8ba9\u51fa\u8d44\u6e90\u3002\u5173\u8054 #14086 by @SivanCola\u3002\n\n## \u4fee\u590d\n\n- \u957f\u4f1a\u8bdd\u91cc\u5df2\u5b8c\u6210\u4e14\u6536\u8d77\u7684\u5de5\u5177\u8c03\u7528\u5361\u7247\u4e0d\u518d\u6302\u8f7d\u6574\u6bb5\u8f93\u51fa\uff0c\u9875\u9762\u8282\u70b9\u6570\u548c\u5185\u5b58\u5360\u7528\u5927\u5e45\u4e0b\u964d\u3002\u5173\u8054 #13899\u3002\n- \u5de5\u4f5c\u533a\u6709\u51e0\u4e07\u4e2a\u672a\u63d0\u4ea4\u6587\u4ef6\u65f6\uff0c\u201c\u6539\u52a8\u201d\u5217\u8868\u53ea\u6e32\u67d3\u4e00\u9875\uff0c\u5176\u4f59\u663e\u793a\u201c\u8fd8\u6709 N \u9879\u6ca1\u6709\u663e\u793a\u201d\uff0c\u53ef\u6309 500 \u9879\u5c55\u5f00\u3002\u5173\u8054 #13899\u3002\n- \u4e24\u4e2a\u8fdb\u7a0b\u5171\u7528\u4e00\u4e2a\u8bb0\u5fc6\u76ee\u5f55\u65f6\uff0c\u5199\u5165\u4e0d\u518d\u4e92\u76f8\u8986\u76d6\uff0c\u4e5f\u4e0d\u518d\u51fa\u73b0\u4e24\u6761\u751f\u6548\u4e8b\u5b9e\u3001\u6539\u540d\u6ca1\u5b58\u4e0b\u6765\u3001\u56de\u6eda\u5012\u9000\u7248\u672c\u6216\u7d22\u5f15\u4e22\u884c\u3002\u5173\u8054 #14100 by @chuiwenwei\u3002\n- \u56de\u6eda\u5230\u65e7\u7248\u672c\u7684\u8bb0\u5fc6\u65f6\uff0c\u4e0d\u518d\u8fd4\u56de\u8be5\u7248\u672c\u4ece\u672a\u6709\u8fc7\u7684\u5185\u5bb9\u6216\u62a5\u201c\u627e\u4e0d\u5230\u8be5\u7248\u672c\u201d\u3002\u5173\u8054 #14096 by @chuiwenwei\u3002\n- \u4f1a\u8bdd\u5386\u53f2\u641c\u7d22\u4e0d\u518d\u628a\u5bbf\u4e3b\u8ffd\u52a0\u7684\u8bb0\u5fc6\u53ec\u56de\u548c\u6267\u884c\u7b56\u7565\u5757\u5f53\u4f5c\u7528\u6237\u8bf4\u8fc7\u7684\u8bdd\u3002\u5173\u8054 #14076 by @chuiwenwei\u3002\n- \u8bfb\u53d6 JSONL \u68c0\u67e5\u70b9\u65f6\u4e0d\u518d\u8ddf\u968f\u6307\u5411\u6240\u6307\u5b9a\u4f1a\u8bdd\u76ee\u5f55\u4e4b\u5916\u7684\u6587\u4ef6\u7b26\u53f7\u94fe\u63a5\u3002\u5173\u8054 #14086 by @SivanCola\u3002\n- \u6062\u590d\u628a\u53f3\u4fa7\u5de5\u4f5c\u533a\u6587\u4ef6\u6811\u91cc\u7684\u6587\u4ef6\u548c\u6587\u4ef6\u5939\u62d6\u5165\u5bf9\u8bdd\uff0c\u4f5c\u4e3a\u6587\u4ef6\u5f15\u7528\u6dfb\u52a0\u3002\u5173\u8054 #12771 fixed in #12877\u3002\n- \u666e\u901a\u4f1a\u8bdd\u542f\u52a8\u671f\u95f4\u8bfb\u53d6 MCP \u8d44\u6e90\u65f6\uff0c\u4f1a\u7b49\u5f85\u5df2\u6388\u6743\u7684\u670d\u52a1\u5668\u8fde\u63a5\u5c31\u7eea\uff0c\u4e0d\u518d\u56e0\u8fde\u63a5\u672a\u5b8c\u6210\u800c\u63d0\u524d\u62a5\u9519\u3002\u5173\u8054 #14084 by @SivanCola\u3002\n- \u5df2\u767b\u5f55\u8d26\u53f7\u65f6\uff0c\u53cd\u9988\u8d21\u732e\u699c\u4e0d\u518d\u9519\u8bef\u5730\u63d0\u793a\u5148\u53bb\u8bbe\u7f6e\u91cc\u767b\u5f55\u3002\u5173\u8054 #14012 fixed in #14071 by @lancy69\u3002\n- `reasonix config compact-ratio 33.3` \u73b0\u5728\u5199\u5165 `0.333`\uff0c\u4e0d\u518d\u5199\u6210 `0.33299999999999996`\u3002\u5173\u8054 #14120\u3002\n- `reasonix session` \u548c `reasonix task` \u7684 `--dir` \u6307\u5411\u4e0d\u5b58\u5728\u7684\u8def\u5f84\u6216\u6587\u4ef6\u65f6\uff0c\u62a5\u53c2\u6570\u9519\u8bef\u5e76\u9000\u51fa\u7801 2\uff0c\u4e0d\u518d\u8fd4\u56de\u7a7a\u7ed3\u679c\u3002\u5173\u8054 #14119\u3002\n- \u7a97\u53e3\u6bd4\u9879\u76ee\u53f3\u952e\u83dc\u5355\u77ee\u65f6\uff0c\u83dc\u5355\u5e95\u90e8\u7684\u64cd\u4f5c\u4e0d\u518d\u88ab\u5207\u6389\uff0c\u83dc\u5355\u9650\u5236\u5728\u7a97\u53e3\u5185\u5e76\u53ef\u6eda\u52a8\u3002\u5173\u8054 #14128\u3001#14129\u3002\n\n## \u5347\u7ea7\u987b\u77e5\n\n- \u5347\u7ea7\u540e\u9996\u6b21\u6253\u5f00\u4f1a\u91cd\u5efa\u4e00\u6b21\u5386\u53f2\u7d22\u5f15\uff0c\u9996\u6b21\u6253\u5f00\u4f1a\u6162\u4e00\u4e9b\u3002\u5173\u8054 #14076 by @chuiwenwei\u3002\n- \u53e6\u4e00\u4e2a\u8fdb\u7a0b\u6b63\u6301\u6709\u8bb0\u5fc6\u76ee\u5f55\u7684\u9501\u65f6\uff0c\u5199\u5165\u53ef\u80fd\u7b49\u7ea6 2 \u79d2\u540e\u8fd4\u56de\u53ef\u91cd\u8bd5\u7684\u201c\u88ab\u53e6\u4e00\u4e2a\u8fdb\u7a0b\u9501\u5b9a\u201d\uff0c\u800c\u4e0d\u662f\u6084\u6084\u5199\u574f\u3002\u5173\u8054 #14100 by @chuiwenwei\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@SivanCola\u3001@chuiwenwei\u3001@lancy69\n\n---\n\n<!-- lang:en -->\n\nThis release cuts page memory in long sessions and large workspaces, adds multi-select for preset modules, and fixes memory writes overwriting each other across processes.\n\n## New\n\n- Preset module selection supports multi-select, search, select all and built-in/custom groups; manual ID entry moves to advanced. Refs #13988.\n\n## Changed\n\n- Legacy chats appear before summaries finish, which fill in the background; pending or failed reads are shown, and background indexing yields to opening a chat. Refs #14086 by @SivanCola.\n\n## Fixed\n\n- A finished, closed tool-call card no longer mounts its whole output, which cuts DOM nodes and memory in long sessions. Refs #13899.\n- With tens of thousands of changed files the Changes list draws one page and says how many it left out, opening 500 at a time. Refs #13899.\n- With two processes sharing one memory directory, writes no longer overwrite each other, duplicate an active subject, lose a rename, roll a revision back or drop an index line. Refs #14100 by @chuiwenwei.\n- Restoring an old memory revision no longer returns a body that revision never had or reports it missing. Refs #14096 by @chuiwenwei.\n- History search no longer treats host-appended memory-recall and execution-policy blocks as words the user said. Refs #14076 by @chuiwenwei.\n- JSONL checkpoint reads no longer follow file symlinks that point outside the supplied session directory. Refs #14086 by @SivanCola.\n- Dragging files and folders from the workbench file tree into chat as file references works again. Refs #12771 fixed in #12877.\n- Ordinary sessions wait for the authorized MCP server connection when reading resources at startup instead of failing early. Refs #14084 by @SivanCola.\n- The feedback contribution board no longer asks signed-in users to log in through Settings. Refs #14012 fixed in #14071 by @lancy69.\n- `reasonix config compact-ratio 33.3` saves `0.333` instead of `0.33299999999999996`. Refs #14120.\n- `reasonix session` and `reasonix task` fail with an argument error (exit 2) for a `--dir` that does not exist or is a file, instead of an empty result. Refs #14119.\n- When the window is shorter than a project's right-click menu, the actions at the bottom are no longer cut off; the menu stays inside the window and scrolls. Refs #14128, #14129.\n\n## Upgrade notes\n\n- The history index rebuilds once on first open after upgrading, so the first open is slower. Refs #14076 by @chuiwenwei.\n- While another process holds the memory directory lock, a write may wait about 2 seconds and then return a retryable \"locked by another process\" error instead of silently corrupting it. Refs #14100 by @chuiwenwei.\n\n## Contributors\n\nThanks to this release's contributors: @SivanCola, @chuiwenwei, @lancy69\n\n## What's Changed\n* fix(tools): normalize redundant argument envelopes / \u517c\u5bb9\u591a\u4f59\u5de5\u5177\u53c2\u6570\u5305\u88c5 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14013\n* fix(guardian): roll the transcript cursor back with the review by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14046\n* fix(studio): prevent settings search result overlap by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14062\n* fix(tui): offer /quit in the slash completion menu by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14060\n* fix(mcp): keep add argument errors readable by @pei711 in https://github.com/esengine/DeepSeek-Reasonix/pull/14068\n* fix(mcp): import cc-switch servers without sqlite3 by @pei711 in https://github.com/esengine/DeepSeek-Reasonix/pull/14069\n* fix(serve): expose account state to the feedback board by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14071\n* fix(history): strip the host-appended blocks from what the user said by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14076\n* fix(startup): wait for MCP readiness and isolate tests / \u4fee\u590d\u542f\u52a8\u7b49\u5f85\u4e0e\u6d4b\u8bd5\u9694\u79bb by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14084\n* fix(agent): a degraded fold lists what the user said, not the host's blocks by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14090\n* fix(studio): restore workspace file drag into chat / \u6062\u590d\u5de5\u4f5c\u533a\u6587\u4ef6\u62d6\u5165\u5bf9\u8bdd by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14082\n* fix(agent): exempt from the origin check only what the person typed by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14091\n* test(sessionstore): observe the 1.x listing replay instead of timing it by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14097\n* fix(history): progressive legacy discovery and background scheduling / \u65e7\u4f1a\u8bdd\u6e10\u8fdb\u52a0\u8f7d\u4e0e\u540e\u53f0\u8c03\u5ea6 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14086\n* fix(memory): a revision snapshot must hold the revision it names by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14096\n* fix(memory): serialise store mutations across processes with one file lock per directory by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14100\n* test(memory): reconcile the cross-process test helpers of the snapshot and lock changes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14103\n* feat(studio): grouped preset module multiselect / \u9884\u8bbe\u6a21\u5757\u5206\u7ec4\u591a\u9009 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14064\n* fix(config): a price source refuses invisible format characters by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14107\n* docs(guide): the Chinese guide describes WSL machines and the agent-shell refusal by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14109\n* docs(guide): the terminal key tables match the /mcp panel and the keys 2.x has by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/14111\n* fix(desktop): do not mount the body of a finished, closed tool card by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14117\n* fix(cli): save the compact ratio as the decimal the user typed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14121\n* fix(cli): refuse a machine --dir that is not a directory by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14123\n* fix(studio): name a property the sheets define by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14047\n* fix(desktop): draw a page of the changes list, not every row by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14124\n* fix(desktop): keep a project's context menu inside a short window by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14128\n* docs(release): studio 2.48.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14130\n\n## New Contributors\n* @pei711 made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/14068\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.47.1...studio-v2.48.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002x86_64 \u7528\u6587\u4ef6\u540d\u5e26 amd64 \u7684\u5305\uff0caarch64\uff08\u7edf\u4fe1 UOS\u3001\u9e92\u9e9f\u7b49\uff09\u7528\u5e26 arm64 \u7684\u5305\u3002\u4e5f\u63d0\u4f9b `.AppImage`\uff08\u53ea\u63d0\u4f9b\u4e0b\u8f7d\uff0c\u4e0d\u4f1a\u81ea\u66f4\u65b0\uff1b\u9700\u8981 FUSE 2\uff0c\u6216\u7528 `--appimage-extract-and-run` \u542f\u52a8\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","mentions_count":7}
