asonix/blob/0c35021eb330f38cadde7831a8bb561d5988a970/docs/CHECKPOINTS.md) \u2014 \u53ef\u914d\u7f6e\u7684\u56de\u6eaf\u5feb\u7167\u4fdd\u7559\u7b56\u7565\u3002\n\n## \u6982\u89c8\n\n**Reasonix v1.38.7 \u2014 Reasonix 1.38.7**\n\n\u684c\u9762\u7aef\u53ef\u9760\u6027\u4e0e\u6613\u7528\u6027\u6539\u8fdb\uff0c\u5305\u62ec Windows \u542f\u52a8\u4fee\u590d\u3001\u6d4f\u89c8\u5668\u63a7\u5236\u4ee5\u53ca\u804a\u5929\u8bb0\u5f55\u5e03\u5c40\u4fee\u6b63\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-11\n\n**Desktop 17 \u00b7 CLI 3**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u5185\u7f6e\u6d4f\u89c8\u5668\u63a7\u5236\u8bbe\u7f6e** \u2014 \u8bbe\u7f6e\u4e2d\u5fc3\u65b0\u589e\u201c\u6d4f\u89c8\u5668\u63a7\u5236\u201d\u9875\u9762\uff0c\u53ef\u542f\u7528\u5185\u7f6e\u6d4f\u89c8\u5668\u3001\u5bfc\u5165 Chrome \u767b\u5f55\u72b6\u6001\u3001\u7ba1\u7406\u8bc1\u4e66\u9a8c\u8bc1\u5e76\u6e05\u9664\u6d4f\u89c8\u5668\u6570\u636e\u3002 ([#10080](https://github.com/esengine/DeepSeek-Reasonix/pull/10080))\n- **[Desktop]** **Windows \u542f\u52a8\u4e0e\u7a97\u53e3\u53ef\u9760\u6027** \u2014 \u4fee\u590d\u5931\u6548\u58f3\u6062\u590d\u3001\u4efb\u52a1\u680f\u8eab\u4efd\u9694\u79bb\u3001\u542f\u52a8\u9ed1\u6846\u95ea\u73b0\u4ee5\u53ca\u7a97\u53e3\u51e0\u4f55\u4fe1\u606f\u6301\u4e45\u5316\u95ee\u9898\u3002 ([#10115](https://github.com/esengine/DeepSeek-Reasonix/pull/10115), [#10130](https://github.com/esengine/DeepSeek-Reasonix/pull/10130), [#10111](https://github.com/esengine/DeepSeek-Reasonix/pull/10111), [#10128](https://github.com/esengine/DeepSeek-Reasonix/pull/10128))\n- **[Desktop]** **\u804a\u5929\u8bb0\u5f55\u5e03\u5c40\u4e0e\u547d\u4ee4\u53ef\u89c1\u6027** \u2014 \u957f\u5185\u5bb9\u4e0d\u518d\u6ea2\u51fa\u804a\u5929\u9762\u677f\uff0c\u5c55\u5f00\u7684\u7ec8\u7aef\u5de5\u5177\u5361\u663e\u793a\u5b8c\u6574\u547d\u4ee4\u3002 ([#10137](https://github.com/esengine/DeepSeek-Reasonix/pull/10137), [#6298](https://github.com/esengine/DeepSeek-Reasonix/pull/6298), [#9860](https://github.com/esengine/DeepSeek-Reasonix/pull/9860))\n\n### \u65b0\u589e\n\n- **[Desktop]** **\u5185\u7f6e\u6d4f\u89c8\u5668\u63a7\u5236\u8bbe\u7f6e** \u2014 \u8bbe\u7f6e\u4e2d\u5fc3\u65b0\u589e\u201c\u6d4f\u89c8\u5668\u63a7\u5236\u201d\u9875\u9762\uff0c\u53ef\u542f\u7528\u5185\u7f6e\u6d4f\u89c8\u5668\u3001\u5bfc\u5165 Chrome \u767b\u5f55\u72b6\u6001\u3001\u5ffd\u7565\u8bbf\u5ba2\u4f1a\u8bdd\u8bc1\u4e66\u9519\u8bef\uff0c\u4ee5\u53ca\u6e05\u9664\u6d4f\u89c8\u5668\u7f13\u5b58\u6216\u5168\u90e8\u6570\u636e\u3002 ([#10080](https://github.com/esengine/DeepSeek-Reasonix/pull/10080))\n- **[Desktop \u00b7 CLI]** **\u53ef\u914d\u7f6e\u7684\u68c0\u67e5\u70b9\u4fdd\u7559\u7b56\u7565** \u2014 \u65b0\u589e [checkpoints] \u914d\u7f6e\u9879 retain_turns \u4e0e blob_quota_bytes\uff0c\u7528\u4e8e\u63a7\u5236\u56de\u6eaf\u5feb\u7167\u4fdd\u7559\u3002 ([#9911](https://github.com/esengine/DeepSeek-Reasonix/pull/9911))\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u804a\u5929\u8bb0\u5f55\u6295\u5f71\u7edf\u4e00** \u2014 \u7edf\u4e00\u5386\u53f2\u5feb\u7167\u4e0e\u5b9e\u65f6\u4e8b\u4ef6\u6295\u5f71\uff0c\u907f\u514d\u5185\u5bb9\u91cd\u590d\u4e0e\u4e8b\u4ef6\u9057\u6f0f\uff0c\u5e76\u63d0\u5347\u68c0\u67e5\u70b9\u6027\u80fd\u3002 ([#9983](https://github.com/esengine/DeepSeek-Reasonix/pull/9983))\n- **[Desktop]** **\u4f1a\u8bdd\u5207\u6362\u6821\u9a8c** \u2014 \u4f1a\u8bdd\u5207\u6362\u5feb\u7167\u73b0\u4f1a\u4e0e\u63a7\u5236\u5668\u6355\u83b7\u7684\u5386\u53f2\u8fdb\u884c\u6821\u9a8c\uff0c\u5e76\u62a5\u544a\u52a0\u8f7d\u9636\u6bb5\u3002 ([#10120](https://github.com/esengine/DeepSeek-Reasonix/pull/10120))\n- **[Desktop]** **\u9650\u65f6\u6027\u80fd\u91c7\u6837** \u2014 \u6027\u80fd\u8bca\u65ad\u73b0\u91c7\u7528\u9650\u65f6\u91c7\u6837\u4e0e\u6309\u9700\u5206\u6790\uff0c\u65e0\u9700\u6301\u7eed CPU \u91c7\u6837\u5373\u53ef\u8bc6\u522b\u5361\u987f\u4e0e\u5185\u5b58\u589e\u957f\u3002 ([#10124](https://github.com/esengine/DeepSeek-Reasonix/pull/10124))\n- **[Desktop]** **\u80fd\u529b\u9636\u6bb5\u6307\u6807\u4fee\u590d** \u2014 \u4fee\u590d capability_phases \u8017\u65f6\u6876\u6052\u4e3a\u96f6\u7684\u95ee\u9898\uff0c\u8865\u9f50\u9636\u6bb5\u53d1\u51fa\u4e0e\u8ba1\u8d39\u3002 ([#9981](https://github.com/esengine/DeepSeek-Reasonix/pull/9981))\n\n### \u4fee\u590d\n\n- **[Desktop]** **Windows \u58f3\u751f\u547d\u5468\u671f\u6062\u590d** \u2014 \u4fee\u590d\u670d\u52a1\u63e1\u624b\u5931\u8d25\u540e\u5931\u6548\u58f3\u8fdb\u7a0b\u5360\u7528\u5355\u5b9e\u4f8b\u9501\u7684\u95ee\u9898\uff0c\u5f15\u5165\u663e\u5f0f\u6062\u590d\u72b6\u6001\u6a21\u578b\u3002 ([#10115](https://github.com/esengine/DeepSeek-Reasonix/pull/10115))\n- **[Desktop]** **Windows \u4efb\u52a1\u680f\u8eab\u4efd\u9694\u79bb** \u2014 \u684c\u9762\u7aef\u73b0\u4f7f\u7528 io.reasonix.desktop \u4f5c\u4e3a\u58f3\u3001\u542f\u52a8\u5668\u3001\u670d\u52a1\u3001\u5feb\u6377\u65b9\u5f0f\u4e0e\u901a\u77e5\u7684\u8eab\u4efd\uff0c\u907f\u514d\u4e0e Studio \u5f52\u7ec4\u3002 ([#10130](https://github.com/esengine/DeepSeek-Reasonix/pull/10130))\n- **[Desktop]** **Windows \u542f\u52a8\u9ed1\u6846\u95ea\u73b0** \u2014 \u4fee\u590d\u4ece\u5feb\u6377\u65b9\u5f0f\u542f\u52a8 Windows \u684c\u9762\u65f6\u77ed\u6682\u51fa\u73b0\u63a7\u5236\u53f0\u7a97\u53e3\u7684\u95ee\u9898\u3002 ([#10111](https://github.com/esengine/DeepSeek-Reasonix/pull/10111))\n- **[Desktop]** **\u7a97\u53e3\u51e0\u4f55\u4fe1\u606f\u6301\u4e45\u5316** \u2014 \u6301\u4e45\u5316\u8fd8\u539f\u77e9\u5f62\u800c\u975e\u6700\u5927\u5316\u8fb9\u6846\uff0c\u907f\u514d\u8fd8\u539f\u65f6\u51fa\u73b0\u8d85\u5927\u7a97\u53e3\u3002 ([#10128](https://github.com/esengine/DeepSeek-Reasonix/pull/10128))\n- **[Desktop]** **\u804a\u5929\u8bb0\u5f55\u6ea2\u51fa\u4e0e\u547d\u4ee4\u53ef\u89c1\u6027** \u2014 \u957f\u5185\u5bb9\u4e0d\u518d\u4f7f\u804a\u5929\u8bb0\u5f55\u8d85\u51fa\u804a\u5929\u9762\u677f\uff0c\u5c55\u5f00\u7684\u7ec8\u7aef\u5de5\u5177\u5361\u663e\u793a\u5b8c\u6574\u547d\u4ee4\u3002 ([#10137](https://github.com/esengine/DeepSeek-Reasonix/pull/10137), [#6298](https://github.com/esengine/DeepSeek-Reasonix/pull/6298), [#9860](https://github.com/esengine/DeepSeek-Reasonix/pull/9860))\n- **[Desktop]** **\u538b\u7f29\u56de\u6267\u53ef\u89c1\u6027** \u2014 /compact \u56de\u6267\u73b0\u6e32\u67d3\u5728\u8fdb\u7a0b\u6298\u53e0\u4e4b\u5916\uff0c\u7528\u6237\u53ef\u770b\u5230\u538b\u7f29\u7ed3\u679c\u3002 ([#10132](https://github.com/esengine/DeepSeek-Reasonix/pull/10132))\n- **[Desktop \u00b7 CLI]** **\u6a21\u578b\u8986\u76d6 max_output_tokens \u4fdd\u7559** \u2014 \u4fee\u590d\u5355\u72ec\u4f7f\u7528\u9010\u6a21\u578b max_output_tokens \u65f6\u88ab\u9759\u9ed8\u4e22\u5f03\u7684\u95ee\u9898\u3002 ([#10094](https://github.com/esengine/DeepSeek-Reasonix/pull/10094))\n- **[Desktop]** **DeepSeek Flash \u601d\u8003\u6df1\u5ea6** \u2014 \u4fee\u590d deepseek-flash \u522b\u540d\u7f3a\u5c11\u601d\u8003\u6df1\u5ea6\u63a7\u5236\u7684\u95ee\u9898\u3002 ([#10117](https://github.com/esengine/DeepSeek-Reasonix/pull/10117))\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u65b0\u589e\n\n- **[Desktop \u00b7 CLI]** **\u53ef\u914d\u7f6e\u7684\u68c0\u67e5\u70b9\u4fdd\u7559\u7b56\u7565** \u2014 \u65b0\u589e [checkpoints] \u914d\u7f6e\u9879 retain_turns \u4e0e blob_quota_bytes\uff0c\u7528\u4e8e\u63a7\u5236\u56de\u6eaf\u5feb\u7167\u4fdd\u7559\u3002 ([#9911](https://github.com/esengine/DeepSeek-Reasonix/pull/9911))\n\n### \u4fee\u590d\n\n- **[CLI]** **WSL \u526a\u8d34\u677f UTF-8 \u4fdd\u7559** \u2014 \u4fee\u590d\u4ece WSL \u590d\u5236\u4e2d\u6587\u7b49 UTF-8 \u5185\u5bb9\u51fa\u73b0\u4e71\u7801\u7684\u95ee\u9898\uff0c\u6539\u7528 PowerShell UTF-8 \u6865\u63a5\u800c\u975e\u539f\u59cb clip.exe\u3002 ([#10074](https://github.com/esengine/DeepSeek-Reasonix/pull/10074))\n- **[Desktop \u00b7 CLI]** **\u6a21\u578b\u8986\u76d6 max_output_tokens \u4fdd\u7559** \u2014 \u4fee\u590d\u5355\u72ec\u4f7f\u7528\u9010\u6a21\u578b max_output_tokens \u65f6\u88ab\u9759\u9ed8\u4e22\u5f03\u7684\u95ee\u9898\u3002 ([#10094](https://github.com/esengine/DeepSeek-Reasonix/pull/10094))\n\n## \u5347\u7ea7\u63d0\u9192\n\n\u672c\u7248\u672c\u65e0\u9700\u624b\u52a8\u8fc1\u79fb\u3002\n\n## \u98ce\u9669\u63d0\u793a\n\n\u5f53\u524d\u6ca1\u6709\u9700\u8981\u989d\u5916\u64cd\u4f5c\u7684\u5df2\u77e5\u98ce\u9669\u3002\n\n## \u81f4\u8c22\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a[@SivanCola](https://github.com/SivanCola)\u3001[@boscocp](https://github.com/boscocp)\u3001[@SauronSkywalker](https://github.com/SauronSkywalker)\u3001[@Linearl](https://github.com/Linearl)\u3001[@lengxiaouser](https://github.com/lengxiaouser)\n\n## \u4e0b\u8f7d\u4e0e\u5b89\u88c5\n\n- [\u5b98\u7f51\u6309\u5e73\u53f0\u4e0b\u8f7d](https://reasonix.io/?download=desktop&channel=stable#start)\n- [\u67e5\u770b\u5b8c\u6574\u5dee\u5f02](https://github.com/esengine/DeepSeek-Reasonix/compare/desktop-v1.38.6...desktop-v1.38.7)\n"}
