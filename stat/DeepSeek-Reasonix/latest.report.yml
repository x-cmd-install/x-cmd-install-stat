121fd60e","download_count":7,"created_at":"2026-11-02T01:05:10Z","updated_at":"2026-11-02T01:05:10Z"},{"id":700035584,"node_id":"RA_kwDOSIatD84pubIA","name":"ReasonixStudio-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":187117117,"digest":"sha256:b5108cf3ea473f021ce0f132a71387b730c673dcc7ff988eed49e121bd9200e7","download_count":20,"created_at":"2026-11-02T01:05:10Z","updated_at":"2026-11-02T01:05:20Z"},{"id":700035695,"node_id":"RA_kwDOSIatD84pubJv","name":"ReasonixStudio-windows-arm64.zip.minisig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289,"digest":"sha256:407bd4467efee5ae551c0496749e832662934934482966be3b73e3cde97559ca","download_count":6,"created_at":"2026-11-02T01:05:12Z","updated_at":"2026-11-02T01:05:13Z"},{"id":700035725,"node_id":"RA_kwDOSIatD84pubKN","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:43ffb58dc33314edeba6a1c6e73dbc1b0916642781a33a5d2022759a17042a9d","download_count":126,"created_at":"2026-11-02T01:05:13Z","updated_at":"2026-11-02T01:05:13Z"}],"body":"本版新增工作台里的 Word 和 Excel 只读预览；修复 `serve` 密码出现在进程命令行里的问题，并改进长时间等待后台任务时模型的表现和功耗。\n\n## 新增\n\n- 工作台可只读预览 Word（.docx）和 Excel（.xlsx），含多工作表、数字格式和合并单元格；在隔离框中显示、不运行宏和脚本，可在设置里关闭。关联 #14622。\n\n## 修复\n\n- 安全：`reasonix serve` 新增 `--password-file`，密码从仅所有者可读的文件读取，不再出现在进程命令行里；`--hash-password` 同样支持。修复 #14913 fixed in #14914。\n- 让模型盯后台长任务（如打包）时，它不再轮询几次就写「未完成」收尾；工具结果会告诉它任务结束后会自动开一轮继续。修复 #14879 fixed in #14900。\n- 视觉效果设为「节能」后，运行中的循环动画（状态标志描线、会话行流光、工具旋转图标）也会停下，长时间等待任务时不再让显卡持续工作。修复 #14919 fixed in #14922。\n- 运行中发送带技能卡片的消息时，按钮和提示如实显示「排队发送」，不再写着「插话」却悄悄排队。关联 #14889。\n- 重启后出现在待发送区、需要你决定的后台任务完成通知，标签写明「后台 · 状态不明」或「后台 · 受阻」，不再和你自己发的消息混在一起。关联 #14885。\n- 文件大小在进位时显示为下一单位（如 1024 KB 显示为 1.0 MB）。关联 #14890 by @kevin9327。\n- 浏览器脚本结果、电脑操控拒绝原因、插件启动失败摘要等处截断的中文不再出现半个字符。关联 #14891 by @kevin9327、#14894 by @kevin9327、#14907 by @kevin9327、#14908 by @kevin9327、#14911 by @kevin9327、#14912 by @kevin9327。\n\n## 贡献者\n\n感谢本版本的贡献者：@kevin9327\n\n---\n\n<!-- lang:en -->\n\n## New\n\n- The workbench previews Word (.docx) and Excel (.xlsx) read-only in an isolated frame with no macros or scripts; it can be turned off in Settings. Refs #14622.\n\n## Fixed\n\n- Security: `reasonix serve` takes `--password-file`, reading the password from an owner-only file instead of argv where `ps` shows it; `--hash-password` accepts it too. Fixes #14913 fixed in #14914.\n- A model watching a long background job such as a build no longer gives up and reports it unfinished; it is told a new turn starts when the job ends. Fixes #14879 fixed in #14900.\n- Reduced visual effects now also stop the looping run animations (status mark, session-row sweep, tool spinner), so a long wait no longer keeps the GPU busy. Fixes #14919 fixed in #14922.\n- While a turn runs, a message with a skill card shows \"Queue\" on the button and hint instead of \"Steer\", since steering carries plain text only. Refs #14889.\n- A background job's follow-on that needs a decision in the pending panel is labelled \"Background · uncertain\" or \"Background · blocked\", apart from your own lines. Refs #14885.\n- Byte sizes move to the next unit when rounding carries over: 1024 KB shows as 1.0 MB. Refs #14890 by @kevin9327.\n- Multi-byte text cut in browser results, computer refusals and plugin failure summaries no longer ends in half a character. Refs #14891 by @kevin9327, #14894 by @kevin9327, #14907 by @kevin9327, #14908 by @kevin9327, #14911 by @kevin9327, #14912 by @kevin9327.\n\n## Contributors\n\nThanks to this release's contributors: @kevin9327\n\n## What's Changed\n* fix(size): move byte sizes to the next unit when rounding reaches 1024 by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14890\n* fix(capability): cut semantic-router candidate descriptions on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14891\n* fix(composer): name a running send with a skill card as queued by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14893\n* fix(plugin): cut MCP startup failure summaries on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14894\n* fix(queue): label a background job's follow-on that needs a decision as background by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14898\n* fix(jobs): tell the model a running background job resumes the session when it ends by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14900\n* chore(deps): bump actions/setup-java from 4.9.1 to 6.1.0 in the actions group by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14905\n* chore(deps): bump the go group with 4 updates by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14901\n* chore(deps): bump the npm group in /desktop/frontend-next with 10 updates by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/14906\n* fix(recovery): cut ArgsSummary on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14908\n* fix(evidence): cut quoted mutation-scan segments on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14907\n* test(serve): age seeded sessions through their branch meta by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14909\n* fix(browser): cut a long eval result on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14911\n* fix(computer): cut a long CUA refusal reason on a rune boundary by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/14912\n* fix(serve): read the password from --password-file instead of argv by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14914\n* feat(workbench): preview Word and Excel files read-only by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14915\n* test(boot): show where an extra root moved the cache-stable prefix by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14920\n* fix(studio): Reduced effects also stop the looping run animations by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14922\n* release(studio): notes for 2.57.0 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14923\n\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.56.1...studio-v2.57.0\n\n\n---\n\n**macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。**Linux** Debian 系从 `.deb` 安装，Fedora、RHEL、openSUSE 等从 `.rpm` 安装（`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`）。x86_64 用文件名带 amd64 的包，aarch64（统信 UOS、麒麟等）用带 arm64 的包。也提供 `.AppImage`（只提供下载，不会自更新；需要 FUSE 2，或用 `--appimage-extract-and-run` 启动）。\n\n三个平台都能自更新：Linux 的 `.deb` 走自己的包（`.rpm` 的自更新尚未提供，请手动下载新包），Windows 运行下一个安装器，macOS 替换自身 bundle。\n","mentions_count":3}
