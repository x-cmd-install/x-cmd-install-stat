ed_at":"2026-10-22T17:54:07Z","updated_at":"2026-10-22T17:54:07Z"},{"id":666622115,"node_id":"RA_kwDOSIatD84nu9ij","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:3ac7c6272664c0bbf317cd997b26007f8cdc6e61cf58490e4ca9c4c8d86b3e52","download_count":6,"created_at":"2026-10-22T17:54:07Z","updated_at":"2026-10-22T17:54:07Z"}],"body":"\u672c\u7248\u65b0\u589e\u7528\u91cf\u9875\u201c\u4eca\u65e5\u201d\u5c0f\u65f6\u89c6\u56fe\u548c Patina \u4e3b\u9898\uff0c\u8f85\u52a9\u4f1a\u8bdd\u652f\u6301 Markdown \u4e0e\u6d41\u5f0f\u8fdb\u5ea6\uff0c\u6539\u8fc7\u6587\u4ef6\u7684\u56de\u5408\u4e0d\u518d\u9ed8\u8ba4\u88ab\u8ffd\u95ee\u68c0\u67e5\uff0c\u5e76\u4fee\u590d\u591a\u5904\u5185\u5b58\u3001\u5361\u4f4f\u548c\u663e\u793a\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u5185\u7f6e Patina \u4e3b\u9898\uff0c\u96fe\u7070\u753b\u5e03\u3001\u767d\u8272\u6d6e\u5361\u4e0e\u94a2\u84dd\u5f3a\u8c03\u8272\uff0c\u660e\u6697\u4e24\u5957\uff0c\u9700\u8981\u65f6\u5728\u8bbe\u7f6e\u91cc\u624b\u52a8\u9009\u62e9\u3002\u5173\u8054 #14136 by @FuchaZ\u3002\n- \u7528\u91cf\u9875\u591a\u4e86\u201c\u4eca\u65e5\u201d\u8303\u56f4\uff0c\u5355\u65e5\u7a97\u53e3\u6309\u5c0f\u65f6\u663e\u793a\u7528\u91cf\u3001\u82b1\u8d39\u548c\u8bf7\u6c42\u3002\u5173\u8054 #14176 by @EMEEEEMMMM\u3002\n\n## \u53d8\u66f4\n\n- \u6539\u8fc7\u6587\u4ef6\u7684\u56de\u5408\u4e0d\u518d\u9ed8\u8ba4\u88ab\u8981\u6c42\u5148\u505a\u68c0\u67e5\u3001\u590d\u6838\u548c\u7b7e\u6536\u624d\u80fd\u7ed3\u675f\uff1b\u9700\u8981\u65f6\u5728\u7528\u6237\u914d\u7f6e\u91cc\u8bbe `host_verification = \"on\"`\u3002\"\u4ea4\u4ed8\"\u9884\u8bbe\u548c `--fail-on-unverified` \u4ecd\u4f1a\u8981\u6c42\u3002\u5173\u8054 #14154\u3002\n- \u9690\u85cf\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u4e0d\u518d\u6709\u4e24\u4e2a\u6253\u5f00\u540c\u4e00\u4e2a\u201c\u8fdc\u7a0b\u201d\u8bbe\u7f6e\u9875\u7684\u5165\u53e3\uff1b\u5e95\u90e8\u91cd\u590d\u7684\u201c\u8fde\u63a5\u4e0e\u673a\u5668\u201d\u5df2\u79fb\u9664\uff0c\u9876\u90e8\u201c\u8fd0\u884c\u73af\u5883\u201d\u4ecd\u53ef\u8fdb\u5165\u3002\u5173\u8054 #14187\u3002\n- \u81ea\u52a8\u547d\u540d\u9047\u5230\u5173\u4e0d\u6389\u601d\u8003\u7684\u6a21\u578b\u65f6\uff0c\u4f1a\u660e\u786e\u63d0\u793a\u201c\u6a21\u578b\u628a\u8f93\u51fa\u989d\u5ea6\u82b1\u5728\u601d\u8003\u4e0a\u201d\uff0c\u5e76\u5efa\u8bae\u6362\u4e00\u4e2a\u80fd\u5173\u95ed\u601d\u8003\u7684\u547d\u540d\u6a21\u578b\u3002\u5173\u8054 #14188\u3002\n- \u9690\u85cf\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u641c\u7d22\u884c\u4e0e\u4e0b\u9762\u7684\u5feb\u6377\u5165\u53e3\u4e4b\u95f4\u4e0d\u518d\u6709\u591a\u4f59\u7a7a\u767d\uff1b\u4e24\u5904\u5c0f\u5b57\u63d0\u793a\u7edf\u4e00\u4f7f\u7528\u201c\u00b7\u201d\u5206\u9694\u3002\u5173\u8054 #14191\u3002\n\n## \u4fee\u590d\n\n- \u914d\u7f6e\u4e86 TCP \u65b9\u5f0f\u7684 DNS \u670d\u52a1\u5668\u65f6\uff0c\u5065\u5eb7\u63a2\u6d4b\u628a\u6b63\u5e38\u5e94\u7b54\u7684\u670d\u52a1\u5668\u8bef\u5224\u4e3a\u4e0d\u53ef\u7528\uff0c\u5bfc\u81f4\u7b2c\u4e00\u4e2a\u670d\u52a1\u5668\u5931\u6548\u540e\u4e0d\u4f1a\u5207\u6362\u5230\u4e0b\u4e00\u4e2a\u3002\u5173\u8054 #14044 by @imcreazy\u3002\n- \u53ea\u6253\u5f00\u4e86\u8fdc\u7a0b\u4f1a\u8bdd\u7a97\u683c\u65f6\uff0c\u76f4\u63a5\u8bbf\u95ee\u672c\u673a\u7aef\u53e3\uff08\u4e0d\u5e26\u7a97\u683c\u524d\u7f00\uff09\u7684\u8bf7\u6c42\u6ca1\u6709\u5e94\u7b54\uff0c\u73b0\u5728\u4f1a\u8f6c\u53d1\u7ed9\u8fdc\u7aef\u5185\u6838\uff1b\u672c\u5730\u7a97\u683c\u4ecd\u7136\u4f18\u5148\u3002\u5173\u8054 #14045 by @imcreazy\u3002\n- \u6ce8\u5165\u7684\u5e38\u9a7b\u4e0a\u4e0b\u6587\uff08\u6280\u80fd\u6e05\u5355\u3001\u9879\u76ee\u6307\u4ee4\u3001\u89c4\u5219\u3001\u65e5\u671f\uff09\u4e0d\u518d\u56e0\u4e3a\u300c\u5df2\u4ea4\u4ed8\u300d\u7684\u4e66\u7b7e\u800c\u6f0f\u53d1\u3002\u5173\u8054 #14099 by @chuiwenwei\u3002\n- \u6269\u5c55\u62d2\u7edd\u3001\u53d6\u6d88\u3001\u6298\u53e0\u3001\u56de\u9000\u3001\u622a\u65ad\u4e4b\u540e\uff0c\u90fd\u4f1a\u6309\u6a21\u578b\u771f\u6b63\u770b\u5230\u7684\u5386\u53f2\u91cd\u65b0\u5224\u65ad\u3002\u5173\u8054 #14099 by @chuiwenwei\u3002\n- \u670d\u52a1\u7aef\u65b0\u5efa\u4f1a\u8bdd\uff08/new\uff09\u7684\u9996\u4e2a\u8bf7\u6c42\u73b0\u5728\u4f1a\u5e26\u4e0a\u6280\u80fd\u6e05\u5355\u3001\u9879\u76ee\u6307\u4ee4\u4e0e\u65e5\u671f\u3002\u5173\u8054 #14099 by @chuiwenwei\u3002\n- \u7528\u91cf\u9875\u4e0e hero \u7684\u300c\u5b9e\u4ed8\u300d\u73b0\u5728\u5305\u542b\u5b88\u62a4\u8bc4\u5ba1\u8fd9\u4e9b\u5b89\u5168\u5ba1\u67e5\u7684\u82b1\u8d39\uff08\u6b64\u524d\u5b83\u4eec\u7684 token \u8ba1\u5165\u800c\u94b1\u6ca1\u8ba1\u5165\uff09\u3002\u5173\u8054 #14110 by @chuiwenwei\u3002\n- \u7528\u91cf\u603b\u989d\u73b0\u5728\u628a\"\u53ea\u8ba1\u4e86\u6b21\u6570\u548c token\u3001\u6ca1\u6709\u91d1\u989d\"\u7684\u8c03\u7528\uff08\u65e7\u7248\u672c\u5199\u5165\u7684\u8bb0\u5f55\u3001\u6807\u9898\u751f\u6210\uff09\u7b97\u4f5c\u672a\u5b9a\u4ef7\uff0c\u603b\u989d\u6807\u6210\u4e0b\u9650\u800c\u4e0d\u662f\u8d26\u5355\u3002\u5173\u8054 #14112 by @chuiwenwei\u3002\n- \u6807\u9898\u751f\u6210\u7684\u8c03\u7528\u73b0\u5728\u4f1a\u6309\u4ef7\u76ee\u8ba1\u4ef7\uff0c\u4e0d\u518d\u53ea\u8ba1 token \u4e0d\u8ba1\u94b1\u3002\u5173\u8054 #14112 by @chuiwenwei\u3002\n- \u65e7\u7248 1.x \u5386\u53f2\u7d22\u5f15\u4e0d\u518d\u4fdd\u7559\u5df2\u56de\u9000\u6216\u88ab\u8986\u76d6\u7684\u6d88\u606f\u6b63\u6587\uff0c\u964d\u4f4e\u542f\u52a8\u65f6\u7684\u5185\u5b58\u538b\u529b\u3002\u5173\u8054 #14116\u3002\n- `browser_act` \u7684\u811a\u672c\u7b49\u5f85\u4e00\u4e2a\u6c38\u8fdc\u4e0d\u4f1a\u7ed3\u675f\u7684 Promise \u65f6\u4e0d\u518d\u65e0\u9650\u671f\u5361\u4f4f\uff08\u6709\u7528\u6237\u7b49\u4e86\u5341\u5206\u949f\u4ee5\u4e0a\uff09\uff1b30 \u79d2\u540e\u505c\u6b62\u811a\u672c\uff0c\u5e76\u544a\u8bc9\u6a21\u578b\"\u811a\u672c\u8d85\u65f6\"\u3002\u5173\u8054 #14118 fixed in #14143\u3002\n- \u6700\u7ec8\u56de\u7b54\u540e\u7684\u5de5\u4f5c\u533a\u89c2\u5bdf\u9047\u5230\u963b\u585e I/O \u65f6\uff0c\u4f1a\u8bdd\u4e0d\u518d\u957f\u65f6\u95f4\u663e\u793a\u8fd0\u884c\u4e2d\uff1b\u505c\u6b62\u64cd\u4f5c\u4f1a\u53d6\u6d88\u89c2\u5bdf\u548c\u8bc1\u636e\u5c01\u5b58\u7684\u7b49\u5f85\uff0c\u672a\u5b8c\u6210\u7684\u89c2\u5bdf\u8bb0\u5f55\u4e3a\u8bc1\u636e\u7f3a\u53e3\u3002\u5173\u8054 #13953\u3001#14140 by @SivanCola\u3002\n- \u4e0a\u4e0b\u6587\u538b\u7f29\u8d85\u65f6\u6216\u53d6\u6d88\u65f6\uff0c\u4e0d\u518d\u56e0\u6458\u8981\u6d41\u540c\u65f6\u5173\u95ed\u800c\u8bef\u62a5\u6210\u529f\u6216\u91c7\u7528\u672a\u5b8c\u6210\u7684\u6458\u8981\u3002\u5173\u8054 #14144 by @SivanCola\u3002\n- \u4ece\u5fae\u4fe1\u7b49\u5e94\u7528\u590d\u5236\u6587\u4ef6\u7c98\u8d34\u5230\u8f93\u5165\u6846\u65f6\uff0c\u6587\u4ef6\u4f1a\u5148\u590d\u5236\u6210\u9644\u4ef6\u518d\u53d1\u9001\uff0c\u4e0d\u518d\u767b\u8bb0\u539f\u8def\u5f84\uff0c\u907f\u514d\u6765\u6e90\u5e94\u7528\u7684\u7f13\u5b58\u8def\u5f84\u8bfb\u4e0d\u5230\u800c\u5931\u8d25\u3002\u5173\u8054 #14150 by @KHG420\u3002\n- \u8f85\u52a9\u4f1a\u8bdd\u9762\u677f\u91cc\u7684\u56de\u7b54\u73b0\u5728\u6309 Markdown \u663e\u793a\uff0c\u52a0\u7c97\u3001\u884c\u5185\u4ee3\u7801\u548c\u5217\u8868\u4e0d\u518d\u9732\u51fa\u539f\u59cb\u7b26\u53f7\u3002\u5173\u8054 #14157\u3002\n- \u8f85\u52a9\u95ee\u9898\u7acb\u5373\u663e\u793a\u63d0\u95ee\uff0c\u6d41\u5f0f\u663e\u793a\u56de\u7b54\u6587\u5b57\u3001\u9636\u6bb5\u548c\u8017\u65f6\uff1b\u4e2d\u65ad\u7684\u56de\u7b54\u6807\u4e3a\u672a\u5b8c\u6210\uff0c\u8f93\u5165\u4fdd\u7559\u53ef\u91cd\u8bd5\u3002\u5173\u8054 #14162 by @lancy69\u3002\n- \u8f93\u5165 `/mcp`\u3001`/skills` \u65f6\uff0c\u8865\u5168\u53ea\u63d0\u4f9b\u771f\u6b63\u4f1a\u6267\u884c\u7684\u5b50\u547d\u4ee4\uff1b\u8f93\u5165\u4e0d\u8ba4\u8bc6\u7684\u5b50\u547d\u4ee4\u4f1a\u660e\u786e\u63d0\u793a\uff0c\u800c\u4e0d\u662f\u6084\u6084\u663e\u793a\u5217\u8868\u3002\u5173\u8054 #14167\u3002\n- \u5bbf\u4e3b\u53d1\u51fa\u7684\u300c\u672c\u8f6e\u8fd8\u6709\u672a\u5b8c\u6210\u4e8b\u9879\u300d\u7684\u7eed\u505a\u63d0\u793a\u4e0d\u518d\u88ab\u5f53\u6210\u4f60\u53d1\u7684\u8bdd\uff0c\u4e0d\u4f1a\u518d\u53d8\u6210\u4f1a\u8bdd\u6807\u9898\u3001\u9884\u89c8\u6216\u7528\u6237\u8f6e\u6b21\u3002\u5173\u8054 #14170 by @imcreazy\u3002\n- \u8bbe\u7f6e\u91cc\u201c\u6a21\u578b\u53ef\u7528\u7684\u5de5\u5177\u201d\u4e0d\u518d\u663e\u793a\u82f1\u6587\u539f\u6587\uff1b\u5185\u7f6e\u5de5\u5177\u6309\u754c\u9762\u8bed\u8a00\u7ed9\u51fa\u4e00\u53e5\u8bdd\u8bf4\u660e\uff0c\u88ab\u622a\u65ad\u7684\u8bf4\u660e\u4e5f\u4e0d\u518d\u5728\u8bcd\u4e2d\u95f4\u65ad\u5f00\u3002\u5173\u8054 #14175\u3002\n- \u9690\u85cf\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u5e95\u90e8\u7684\u201c\u8fde\u63a5\u4e0e\u673a\u5668\u201d\u4e0d\u518d\u6bd4\u5176\u4ed6\u5165\u53e3\u66f4\u5927\u66f4\u7c97\uff0c\u548c\u540c\u7c7b\u5165\u53e3\u4f7f\u7528\u540c\u4e00\u5b57\u53f7\u548c\u5b57\u91cd\u3002\u5173\u8054 #14184\u3002\n\n## \u5347\u7ea7\u987b\u77e5\n\n- \u6ca1\u6709\u4ef7\u76ee\u7684\u884c\u4e0d\u518d\u663e\u793a\u6210 \u00a50\uff0c\u800c\u662f\u628a\u603b\u989d\u6807\u4e3a\u300c\u672a\u5b9a\u4ef7\u8c03\u7528\u672a\u8ba1\u5165\u300d\u7684\u4e0b\u9650\u3002\u5173\u8054 #14110 by @chuiwenwei\u3002\n- \u8d85\u8fc7 64 MiB \u5b89\u5168\u9884\u7b97\u7684\u8bb0\u5f55\u3001\u6709\u6548\u6d88\u606f\u6b63\u6587\u6216 DAG \u5143\u6570\u636e\u4f1a\u88ab\u62d2\u7edd\uff1b\u539f\u6587\u4ef6\u4fdd\u6301\u4e0d\u53d8\uff0c\u5176\u4ed6\u4f1a\u8bdd\u4ecd\u53ef\u7d22\u5f15\u3002\u5173\u8054 #14116\u3002\n- \u6ca1\u8bbe\u8fc7\u8fd9\u4e00\u9879\u7684\u7528\u6237\u5347\u7ea7\u540e\uff0c\u56de\u5408\u6536\u5c3e\u524d\u4e0d\u518d\u88ab\u8ffd\u95ee\"\u8fd8\u6b20\u4ec0\u4e48\"\uff1b\u9879\u76ee\u914d\u7f6e\u6587\u4ef6\u4ecd\u6539\u4e0d\u4e86\u8fd9\u4e00\u9879\u3002\u5173\u8054 #14154\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@FuchaZ\u3001@EMEEEEMMMM\u3001@imcreazy\u3001@chuiwenwei\u3001@SivanCola\u3001@KHG420\u3001@lancy69\n\n---\n\n<!-- lang:en -->\n\nThis release adds an hourly Today view to Usage and a Patina theme, renders side-conversation answers as Markdown with streamed progress, stops asking for checks by default after a turn that changed files, and fixes several memory, hang and display problems.\n\n## New\n\n- A built-in Patina theme with a grey canvas, white cards and a steel-blue accent, in light and dark, chosen in Settings when you want it. Refs #14136 by @FuchaZ.\n- The Usage page has a Today range, and any one-day window shows usage, spend and requests by the hour. Refs #14176 by @EMEEEEMMMM.\n\n## Changed\n\n- A turn that changed files is no longer held open until a check, review and sign-off exist; set `host_verification = \"on\"` in your user config for that. Refs #14154.\n- With the icon rail hidden, the sidebar no longer has two entries to the same Remote settings page; the duplicate bottom row is gone and \"Environments\" still opens it. Refs #14187.\n- When a model that cannot turn thinking off spends its budget thinking, automatic naming now says so and suggests a naming model that can. Refs #14188.\n- With the icon rail hidden, the blank band between the sidebar's search row and the shortcut rows is gone, and both hints use the same \"\u00b7\" separator. Refs #14191.\n\n## Fixed\n\n- The DNS server health probe read a TCP reply as if it had no length prefix and reported a live server as dead, so failover to the next `[network]` server never happened. Refs #14044 by @imcreazy.\n- A request made straight to the port with no pane prefix got no answer while only a remote pane was open; it now goes to the far kernel, and a local pane still takes precedence. Refs #14045 by @imcreazy.\n- Injected standing context (skills listing, project instructions, rules, the date) can no longer be believed delivered when the model never got it. Refs #14099 by @chuiwenwei.\n- A refusal, cancel, fold, rewind or truncation now re-asks the model-visible history instead of a bookmark. Refs #14099 by @chuiwenwei.\n- A new session in the served app now starts with the skills listing, project instructions and the date. Refs #14099 by @chuiwenwei.\n- The usage page and hero paid total now include the guardian's safety reviews, whose tokens were counted but whose money was not. Refs #14110 by @chuiwenwei.\n- The usage total now treats a call that was counted but carries no amount (pre-schema rows, title generation) as unpriced, so the total is a floor rather than a bill. Refs #14112 by @chuiwenwei.\n- Title-generation calls are now priced from the rate card instead of counting tokens with no money. Refs #14112 by @chuiwenwei.\n- Legacy 1.x indexing retains payload locations, not discarded message bodies. Preflight no longer copies large strings. Refs #14116.\n- A `browser_act` script awaiting a promise that never settles no longer holds the call forever; after 30 seconds it is stopped and the model is told it timed out. Refs #14118 fixed in #14143.\n- Blocked workspace observation no longer holds a turn after its final answer; Stop cancels observation and seal waits, and incomplete observations remain gaps. Refs #13953, #14140 by @SivanCola.\n- Context compaction no longer reports success or accepts an unfinished digest when its summary stream closes at the same time as a timeout or cancellation. Refs #14144 by @SivanCola.\n- A file pasted from another application, such as WeChat, is now copied into an attachment instead of being registered by its original path, which could fail to read later. Refs #14150 by @KHG420.\n- Answers in the side conversation panel are now drawn as Markdown, so bold, inline code and lists no longer show raw markers. Refs #14157.\n- Side questions show your question immediately and stream the answer, phase and elapsed time; interrupted answers are marked incomplete and drafts stay available for retry. Refs #14162 by @lancy69.\n- `/mcp` and `/skills` completion now offers only the subcommands that run, and an unrecognised one is reported instead of silently printing the listing. Refs #14167.\n- The host's own \"work still outstanding\" prompt is no longer read back as something you typed, so it stops becoming a session title, a preview line or a user turn. Refs #14170 by @imcreazy.\n- The tool list in Settings no longer shows the model-facing English text; built-in tools get a one-line description in the interface language, and a long line is cut cleanly. Refs #14175.\n- With the icon rail hidden, the sidebar's \"Connections & machines\" row is no longer larger and bolder than the other shortcut rows; they share one size and weight. Refs #14184.\n\n## Upgrade notes\n\n- A row with no price no longer shows as zero; the total is marked as a floor with \"unpriced calls not included\". Refs #14110 by @chuiwenwei.\n- Records, retained payloads, and DAG metadata have separate 64 MiB budgets. Refusals preserve files, never use stale checkpoints, and leave healthy sources indexable. Refs #14116.\n- If you never set this key, the end-of-turn \"still owes\" prompts stop after upgrading; a project config cannot change it. Refs #14154.\n\n## Contributors\n\nThanks to this release's contributors: @FuchaZ, @EMEEEEMMMM, @imcreazy, @chuiwenwei, @SivanCola, @KHG420, @lancy69\n\n## What's Changed\n* fix(browser): stop an eval script whose promise never settles by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14143\n* fix(agent): reject interrupted summaries at EOF / \u4fee\u590d\u538b\u7f29\u6d41\u7ed3\u675f\u4e0e\u53d6\u6d88\u7ade\u6001 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14144\n* fix(stats): quote a guardian review's usage like any other call by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14110\n* fix(control): derive projection delivery from the visible history by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14099\n* feat(loopmetrics): read-only loop metrics for trajectories, with negative controls by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14149\n* fix(agent): bound post-answer finalization / \u4fee\u590d\u56de\u7b54\u7ed3\u675f\u540e\u7684\u6536\u5c3e\u963b\u585e by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/14140\n* feat(loopmetrics): phase 1 harness and first results on long-session conditions by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14155\n* feat(loopmetrics): how to feed a real session, plus usage and M4 definition fixes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14158\n* fix(desktop): draw the side conversation's answer as markdown by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14157\n* fix(studio): copy pasted files into managed attachments by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/14150\n* feat(config): the host no longer holds a changed turn to its checks unless asked by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14154\n* test(memory): drop the wall-clock bound on uncontended saves by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14165\n* fix(control): offer only the /mcp and /skills subcommands the controller runs by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14167\n* fix(studio): stream progress for side questions by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14162\n* fix(sessionstore): bound history replay memory by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/14161\n* fix(netdns): read a TCP reply past its length prefix by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14044\n* fix(serve): carry an unprefixed request to a remote pane by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14045\n* fix(desktop): describe each tool in the settings list in the interface language by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14175\n* fix(control): keep the host's continuation prompt out of the user's turns by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/14170\n* fix(stats): count a call with no cost fact as incomplete by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/14112\n* test(sessionstore): count the bytes a redaction reads instead of process-wide allocation by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14182\n* feat(theme): add Patina as a plain light/dark palette by @FuchaZ in https://github.com/esengine/DeepSeek-Reasonix/pull/14136\n* fix(desktop): give the sidebar's shortcut rows one type scale when the icon rail is hidden by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14184\n* ci(race): give the full-suite package timeout headroom over assembly/boot by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14186\n* feat(usage): show hourly usage for a single-day window by @EMEEEEMMMM in https://github.com/esengine/DeepSeek-Reasonix/pull/14176\n* fix(desktop): drop the sidebar's second link to the remote settings when the icon rail is hidden by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14187\n* fix(serve): say when the title model spent its budget thinking by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14188\n* fix(desktop): even out the sidebar's shortcut rows and use one hint separator by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14191\n* docs(release): studio 2.49.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/14193\n\n## New Contributors\n* @FuchaZ made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/14136\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.48.0...studio-v2.49.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5