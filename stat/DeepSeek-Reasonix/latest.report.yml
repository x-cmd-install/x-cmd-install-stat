,"user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":283,"digest":"sha256:5ae28de020f64970c81622d36e86296a2b9d29222cac40c3cf788ec79c37788c","download_count":7,"created_at":"2026-09-26T14:01:39Z","updated_at":"2026-09-26T14:01:40Z"}],"body":"> \u684c\u9762\u7aef\u4e0e CLI \u7684\u7a33\u5b9a\u6027\u4fee\u590d\uff1a\u66f4\u65b0\u540e\u4f1a\u8bdd\u300c\u6d88\u5931\u300d\u3001Windows \u7a97\u53e3\u6253\u4e0d\u5f00\u3001\u65e7\u4f1a\u8bdd\u5bfc\u5165\u3001\u94a9\u5b50\u8986\u76d6\u6240\u6709\u5de5\u5177\u8c03\u7528\u5904\uff0c\u4ee5\u53ca\u8bb0\u5fc6\u5b89\u5168\u3002\n\n**\u53d1\u5e03\u6e20\u9053\uff1a\u7a33\u5b9a\u7248 \u00b7 v1.39.1**\n\n[English \u2192](https://reasonix.io/changelog/v1.39.1/?lang=en) \u00b7 [\u7f51\u9875\u7248\u5b8c\u6574\u66f4\u65b0\u65e5\u5fd7 \u2192](https://reasonix.io/changelog/v1.39.1/)\n\n## \u6982\u89c8\n\n**Reasonix v1.39.1 \u2014 Reasonix 1.39.1**\n\n\u684c\u9762\u7aef\u4e0e CLI \u7684\u7a33\u5b9a\u6027\u4fee\u590d\uff1a\u66f4\u65b0\u540e\u4f1a\u8bdd\u300c\u6d88\u5931\u300d\u3001Windows \u7a97\u53e3\u6253\u4e0d\u5f00\u3001\u65e7\u4f1a\u8bdd\u5bfc\u5165\u3001\u94a9\u5b50\u8986\u76d6\u6240\u6709\u5de5\u5177\u8c03\u7528\u5904\uff0c\u4ee5\u53ca\u8bb0\u5fc6\u5b89\u5168\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-26\n\n**Desktop 12 \u00b7 CLI 6**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u66f4\u65b0\u540e\u4f1a\u8bdd\u300c\u6d88\u5931\u300d\u7684\u95ee\u9898\u5df2\u4fee\u590d** \u2014 \u4ece 1.38 \u5347\u7ea7\u540e\uff0c\u4fa7\u680f\u53ef\u80fd\u4e00\u6761\u4f1a\u8bdd\u90fd\u4e0d\u663e\u793a\uff1b\u5982\u679c\u4e0a\u6b21\u505c\u7559\u5728\u4e00\u4e2a\u6ca1\u53d1\u8fc7\u6d88\u606f\u7684\u65b0\u5bf9\u8bdd\u4e0a\uff0c\u8fd8\u4f1a\u4e00\u542f\u52a8\u5c31\u62a5\u9519\u3002\u4e24\u8005\u90fd\u5df2\u4fee\u590d\uff0c\u4f1a\u8bdd\u76ee\u5f55\u7684\u542f\u52a8\u4fee\u590d\u4e5f\u4f1a\u627e\u56de\u5e26\u5206\u652f\u4f1a\u8bdd\u7684\u5217\u8868\u3002\u4f1a\u8bdd\u5185\u5bb9\u672c\u8eab\u4e00\u76f4\u90fd\u5728\u3002 ([#10763](https://github.com/esengine/DeepSeek-Reasonix/pull/10763), [#10853](https://github.com/esengine/DeepSeek-Reasonix/pull/10853))\n- **[Desktop]** **\u7528\u8fc7 1.38 \u6c99\u7bb1\u7684 Windows \u7535\u8111\u4e0a\u7a97\u53e3\u80fd\u6b63\u5e38\u6253\u5f00\u4e86** \u2014 1.38.8\u20131.38.10 \u7684 Windows \u6c99\u7bb1\u53ef\u80fd\u5728\u5b89\u88c5\u76ee\u5f55\u4e0a\u7559\u4e0b\u4e00\u6761\u8bbf\u95ee\u6743\u9650\uff0c\u5bfc\u81f4 Chromium \u8fdb\u7a0b\u5168\u90e8\u5d29\u6e83\u3001\u7a97\u53e3\u59cb\u7ec8\u4e0d\u51fa\u73b0\u3002\u684c\u9762\u7aef\u73b0\u5728\u542f\u52a8\u65f6\u4f1a\u4ece\u81ea\u5df1\u7684\u5b89\u88c5\u76ee\u5f55\u79fb\u9664\u8fd9\u7c7b\u6743\u9650\uff0c\u88ab\u7cfb\u7edf\u62d2\u7edd\u65f6\u4f1a\u5f39\u7a97\u8bf4\u660e\u539f\u56e0\u3002 ([#10858](https://github.com/esengine/DeepSeek-Reasonix/pull/10858), [#10853](https://github.com/esengine/DeepSeek-Reasonix/pull/10853))\n- **[Desktop]** **\u6253\u5f00\u548c\u5bfc\u5165\u65e7\u4f1a\u8bdd\u4e0d\u518d\u6539\u52a8\u539f\u59cb\u6587\u4ef6** \u2014 \u4ece\u4fa7\u680f\u6253\u5f00\u65e7\u4f1a\u8bdd\u4e0d\u518d\u591a\u51fa\u4e00\u884c\u4ee5\u6587\u4ef6\u540d\u547d\u540d\u7684\u91cd\u590d\u6761\u76ee\uff1b\u5bfc\u5165\u65f6\u539f\u59cb\u6587\u4ef6\u4fdd\u6301\u4e0d\u53d8\uff0c\u4e5f\u4e0d\u4f1a\u518d\u8bef\u62a5\u300c\u65e7\u6765\u6e90\u6709\u66f4\u65b0\u300d\u3002 ([#10495](https://github.com/esengine/DeepSeek-Reasonix/pull/10495), [#10853](https://github.com/esengine/DeepSeek-Reasonix/pull/10853))\n- **[Desktop]** **\u8f93\u5165\u6cd5\u56de\u8f66\u4e0d\u518d\u5173\u95ed\u91cd\u547d\u540d\u8f93\u5165\u6846** \u2014 \u5f53\u4e2d\u6587\u8f93\u5165\u6cd5\u4f7f\u7528\u56de\u8f66\u7ed3\u675f\u7ec4\u5408\u65f6\uff0c\u4f1a\u8bdd\u91cd\u547d\u540d\u8f93\u5165\u6846\u4fdd\u6301\u6253\u5f00\uff0c\u4fdd\u7559\u5df2\u4fdd\u5b58\u7684\u6807\u9898\u3002 ([#10836](https://github.com/esengine/DeepSeek-Reasonix/pull/10836))\n- **[Desktop \u00b7 CLI]** **\u8bfb\u53d6\u5931\u8d25\u65f6\u8bb0\u5fc6\u64cd\u4f5c\u4fdd\u7559\u7d22\u5f15** \u2014 \u4e0d\u53ef\u8bfb\u7684 MEMORY.md \u4e0d\u518d\u5bfc\u81f4\u4fdd\u5b58\u6216\u5f52\u6863\u6e05\u9664\u53d7\u7ba1\u6761\u76ee\u548c\u624b\u5199\u7b14\u8bb0\u3002 ([#10833](https://github.com/esengine/DeepSeek-Reasonix/pull/10833))\n- **[Desktop \u00b7 CLI]** **\u5de5\u5177\u94a9\u5b50\u8986\u76d6\u6240\u6709\u8c03\u7528\u5de5\u5177\u7684\u5730\u65b9** \u2014 \u9879\u76ee\u548c\u5168\u5c40\u5de5\u5177\u94a9\u5b50\u73b0\u5728\u4e5f\u4f5c\u7528\u4e8e\u5b50\u4ee3\u7406\uff08task\u3001read_only_task\u3001run_skill\u3001read_only_skill\uff09\u3001\u89c4\u5212\u5668\u3001reasonix review \u548c\u684c\u9762\u7aef\u8bd5\u8fd0\u884c\uff1b\u7eed\u8dd1\u7684\u6280\u80fd\u4fdd\u6301\u540c\u4e00\u4e2a\u94a9\u5b50\u4f1a\u8bdd ID\u3002 ([#10843](https://github.com/esengine/DeepSeek-Reasonix/pull/10843), [#10845](https://github.com/esengine/DeepSeek-Reasonix/pull/10845), [#10848](https://github.com/esengine/DeepSeek-Reasonix/pull/10848))\n\n### \u6539\u8fdb\n\n- **[Desktop]** **\u957f\u63d0\u4f9b\u65b9\u6a21\u578b\u540d\u79f0\u5728\u4e24\u884c\u5185\u663e\u793a** \u2014 \u5c06\u663e\u793a\u7684\u6a21\u578b\u540d\u79f0\u9650\u5236\u4e3a\u4e24\u884c\uff0c\u5e76\u5728\u60ac\u505c\u65f6\u663e\u793a\u5b8c\u6574\u540d\u79f0\u3002 ([#10830](https://github.com/esengine/DeepSeek-Reasonix/pull/10830))\n\n### \u4fee\u590d\n\n- **[Desktop]** **\u5d29\u6e83\u8986\u76d6\u5c42\u53ef\u91cd\u542f Reasonix** \u2014 \u5728\u5d29\u6e83\u8986\u76d6\u5c42\u6dfb\u52a0\u201c\u91cd\u542f Reasonix\u201d\u64cd\u4f5c\uff0c\u5e76\u56de\u9000\u5230\u9875\u9762\u91cd\u65b0\u52a0\u8f7d\u3002 ([#10775](https://github.com/esengine/DeepSeek-Reasonix/pull/10775))\n- **[Desktop]** **\u6587\u4ef6\u9762\u677f\u663e\u793a\u9876\u5c42 tmp/\u3001bin/\u3001stage/** \u2014 \u5de5\u4f5c\u533a\u6587\u4ef6\u9762\u677f\u548c\u76d1\u89c6\u5668\u4e0d\u518d\u9690\u85cf\u8fd9\u4e9b\u76ee\u5f55\u3002 ([#10774](https://github.com/esengine/DeepSeek-Reasonix/pull/10774))\n- **[Desktop \u00b7 CLI]** **\u4e2d\u65ad\u8f6e\u6b21\u663e\u793a\u63d0\u4f9b\u65b9\u9519\u8bef** \u2014 \u5e26\u6709\u63d0\u4f9b\u65b9\u9519\u8bef\u7684\u4e2d\u65ad\u8f6e\u6b21\u73b0\u5728\u663e\u793a\u9519\u8bef\u6587\u672c\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u901a\u7528\u901a\u77e5\u3002 ([#10778](https://github.com/esengine/DeepSeek-Reasonix/pull/10778))\n- **[Desktop \u00b7 CLI]** **\u8f93\u5165\u957f\u5ea6\u9519\u8bef\u7684\u4e0a\u4e0b\u6587\u6ea2\u51fa\u68c0\u6d4b** \u2014 \u5c06\u201c\u8f93\u5165\u957f\u5ea6\u8d85\u8fc7\u6700\u5927\u503c\u201d\u8bc6\u522b\u4e3a\u4e0a\u4e0b\u6587\u6ea2\u51fa\uff0c\u89e6\u53d1\u538b\u7f29\u3002 ([#10770](https://github.com/esengine/DeepSeek-Reasonix/pull/10770))\n- **[Desktop]** **\u4e00\u6b21\u6027\u7684 reasonix -p \u8fd0\u884c\u4e0d\u518d\u51fa\u73b0\u5728\u4fa7\u680f** \u2014 \u65e0\u5934\u8fd0\u884c\uff08\u5305\u62ec\u667a\u80fd\u4f53\u81ea\u5df1\u542f\u52a8\u7684\uff09\u4e0d\u518d\u5728\u4fa7\u680f\u7559\u4e0b\u4ee5\u539f\u59cb ID \u547d\u540d\u7684\u6c38\u4e45\u6761\u76ee\u3002 ([#10857](https://github.com/esengine/DeepSeek-Reasonix/pull/10857))\n\n## CLI \u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop \u00b7 CLI]** **\u8bfb\u53d6\u5931\u8d25\u65f6\u8bb0\u5fc6\u64cd\u4f5c\u4fdd\u7559\u7d22\u5f15** \u2014 \u4e0d\u53ef\u8bfb\u7684 MEMORY.md \u4e0d\u518d\u5bfc\u81f4\u4fdd\u5b58\u6216\u5f52\u6863\u6e05\u9664\u53d7\u7ba1\u6761\u76ee\u548c\u624b\u5199\u7b14\u8bb0\u3002 ([#10833](https://github.com/esengine/DeepSeek-Reasonix/pull/10833))\n- **[Desktop \u00b7 CLI]** **\u5de5\u5177\u94a9\u5b50\u8986\u76d6\u6240\u6709\u8c03\u7528\u5de5\u5177\u7684\u5730\u65b9** \u2014 \u9879\u76ee\u548c\u5168\u5c40\u5de5\u5177\u94a9\u5b50\u73b0\u5728\u4e5f\u4f5c\u7528\u4e8e\u5b50\u4ee3\u7406\uff08task\u3001read_only_task\u3001run_skill\u3001read_only_skill\uff09\u3001\u89c4\u5212\u5668\u3001reasonix review \u548c\u684c\u9762\u7aef\u8bd5\u8fd0\u884c\uff1b\u7eed\u8dd1\u7684\u6280\u80fd\u4fdd\u6301\u540c\u4e00\u4e2a\u94a9\u5b50\u4f1a\u8bdd ID\u3002 ([#10843](https://github.com/esengine/DeepSeek-Reasonix/pull/10843), [#10845](https://github.com/esengine/DeepSeek-Reasonix/pull/10845), [#10848](https://github.com/esengine/DeepSeek-Reasonix/pull/10848))\n\n### \u6539\u8fdb\n\n- **[CLI]** **\u6a21\u7cca\u7684 --resume \u67e5\u8be2\u5217\u51fa\u5339\u914d\u9879** \u2014 \u65e0\u5934\u6062\u590d\u9047\u5230\u591a\u4e2a\u5339\u914d\u65f6\uff0c\u73b0\u5728\u4f1a\u5217\u51fa\u5019\u9009\u9879\u5e76\u5efa\u8bae\u4f7f\u7528 --resume <id>\u3002 ([#10782](https://github.com/esengine/DeepSeek-Reasonix/pull/10782))\n\n### \u4fee\u590d\n\n- **[CLI]** **\u957f\u4f1a\u8bdd\u7684\u81f4\u547d\u5d29\u6e83\u8f93\u51fa\u88ab\u6355\u83b7** \u2014 \u8fd0\u884c\u65f6\u5d29\u6e83\u8f93\u51fa\u5199\u5165\u6bcf\u4e2a PID \u7684\u6587\u4ef6\uff0c\u8bca\u65ad\u65e5\u5fd7\u8f6e\u8f6c\u4ee5\u4fdd\u7559\u6700\u65b0\u6761\u76ee\u3002 ([#10788](https://github.com/esengine/DeepSeek-Reasonix/pull/10788))\n- **[Desktop \u00b7 CLI]** **\u4e2d\u65ad\u8f6e\u6b21\u663e\u793a\u63d0\u4f9b\u65b9\u9519\u8bef** \u2014 \u5e26\u6709\u63d0\u4f9b\u65b9\u9519\u8bef\u7684\u4e2d\u65ad\u8f6e\u6b21\u73b0\u5728\u663e\u793a\u9519\u8bef\u6587\u672c\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u901a\u7528\u901a\u77e5\u3002 ([#10778](https://github.com/esengine/DeepSeek-Reasonix/pull/10778))\n- **[Desktop \u00b7 CLI]** **\u8f93\u5165\u957f\u5ea6\u9519\u8bef\u7684\u4e0a\u4e0b\u6587\u6ea2\u51fa\u68c0\u6d4b** \u2014 \u5c06\u201c\u8f93\u5165\u957f\u5ea6\u8d85\u8fc7\u6700\u5927\u503c\u201d\u8bc6\u522b\u4e3a\u4e0a\u4e0b\u6587\u6ea2\u51fa\uff0c\u89e6\u53d1\u538b\u7f29\u3002 ([#10770](https://github.com/esengine/DeepSeek-Reasonix/pull/10770))\n\n## \u5347\u7ea7\u63d0\u9192\n\n\u672c\u7248\u672c\u65e0\u9700\u624b\u52a8\u8fc1\u79fb\u3002\n\n## \u98ce\u9669\u63d0\u793a\n\n\u5f53\u524d\u6ca1\u6709\u9700\u8981\u989d\u5916\u64cd\u4f5c\u7684\u5df2\u77e5\u98ce\u9669\u3002\n\n## \u81f4\u8c22\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a[@