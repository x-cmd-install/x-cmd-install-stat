ted_at":"2026-10-20T01:00:10Z","updated_at":"2026-10-20T01:00:10Z"},{"id":657877569,"node_id":"RA_kwDOSIatD84nNmpB","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":564,"digest":"sha256:97b9c6f7287bb622e3e3f4f063c0052d24fd19745a6a16092dbb0d145f5f91c4","download_count":9,"created_at":"2026-10-20T01:00:11Z","updated_at":"2026-10-20T01:00:11Z"}],"body":"\u672c\u7248\u65b0\u589e\u4f1a\u8bdd\u7ea7 Agent \u9884\u8bbe\uff08\u9ed8\u8ba4\u5173\u95ed\uff09\u3001\u7ec8\u7aef\u6392\u961f\u6d88\u606f\u7ba1\u7406\u3001\u8bbe\u7f6e\u91cc\u72ec\u7acb\u7684\u201c\u4f1a\u8bdd\u95f4\u6d88\u606f\u201d\u3001\u9879\u76ee\u5185 `.reasonix/reasonix.toml`\uff0c\u957f\u4f1a\u8bdd\u5360\u7528\u7684\u5185\u5b58\u660e\u663e\u964d\u4f4e\uff0c\u5e76\u4fee\u590d\u516c\u7f51\u8fdc\u7a0b\u8bef\u62a5\u79bb\u7ebf\u3001\u591a\u6807\u7b7e\u9875\u6389\u5e27\u3001macOS \u6258\u76d8\u56fe\u6807\u30011.x \u4f1a\u8bdd\u5bfc\u5165\u7b49\u4e00\u6279\u95ee\u9898\u3002\n\n## \u65b0\u589e\n\n- \u65b0\u589e\u4f1a\u8bdd\u7ea7 Agent \u9884\u8bbe\uff1a\u4eba\u8bbe\u3001\u5de5\u5177\u548c\u6a21\u5757\u6309\u4f1a\u8bdd\u7ed1\u5b9a\u7248\u672c\uff0c\u5728\u4eba\u8bbe\u9875\u7ba1\u7406\uff0c\u8f93\u5165\u6846\u4e0a\u65b9\u7684\u72b6\u6001\u884c\u91cc\u9009\u62e9\uff1b\u9ed8\u8ba4\u4e0d\u542f\u7528\uff0c\u9009\u62e9\u5668\u9ed8\u8ba4\u9690\u85cf\uff0c\u53ef\u5728\u4eba\u8bbe\u9875\u5f00\u542f\u3002\u5173\u8054 #13613 by @SivanCola\u3002\n- \u9884\u8bbe\u53ea\u80fd\u8c03\u6574 MCP \u548c\u6269\u5c55\u7684\u8d85\u65f6\uff0c\u4e0d\u80fd\u6539\u5199\u542f\u52a8\u53c2\u6570\u3001\u5730\u5740\u6216\u51ed\u636e\uff1b\u5199\u9884\u8bbe\u548c\u5207\u6362\u7ec4\u5408\u9700\u8981\u914d\u7f6e\u7f16\u8f91\u6388\u6743\uff1b\u8de8\u9879\u76ee\u79fb\u52a8\u5df2\u7ed1\u5b9a\u7684\u4f1a\u8bdd\u4f1a\u88ab\u62d2\u7edd\uff0c\u539f\u4f1a\u8bdd\u4fdd\u6301\u4e0d\u53d8\u3002\u5173\u8054 #13613 by @SivanCola\u3002\n- \u7ec8\u7aef\u91cc\u6392\u961f\u7684\u6d88\u606f\u753b\u5728\u5de5\u4f5c\u884c\u4e0b\uff1a\u2191 \u9009\u4e2d\u4fee\u6539\uff0cAlt+\u2191/\u2193 \u8c03\u5e8f\uff0cEnter \u4fdd\u5b58\uff0c\u8fde\u6309\u4e24\u6b21 d \u5220\u9664\uff0cr \u91cd\u8bd5\uff0c\u7a7a\u683c\u6682\u505c\u3002\u5173\u8054 #12144\u3002\n- \u8bbe\u7f6e\u91cc\u7684\u201c\u4f1a\u8bdd\u95f4\u6d88\u606f\u201d\u6210\u4e3a\u72ec\u7acb\u7684\u4e00\u9879\uff0c\u53ef\u4ee5\u4ece\u5df2\u6dfb\u52a0\u7684\u9879\u76ee\u91cc\u9009\u62e9\u653e\u884c\u3001\u4e00\u952e\u64a4\u9500\u3002\u5173\u8054 #13794\u3002\n- \u63d0\u95ee\u5361\u7247\u7684\u81ea\u7531\u586b\u5199\u6846\u4e5f\u80fd\u201c\u4f18\u5316\u63d0\u793a\u8bcd\u201d\uff1a\u70b9\u661f\u6807\u6216\u6309 Ctrl+Shift+E\uff0c\u6539\u5199\u53ea\u5728\u4f60\u70b9\u201c\u91c7\u7528\u201d\u540e\u624d\u66ff\u6362\u3002\u5173\u8054 #13870\u3002\n- \u5173\u8054\u7535\u8111\u5230\u8d26\u53f7\u65f6\u591a\u4e00\u4e2a\u9ed8\u8ba4\u52fe\u9009\u7684\u201c\u52a0\u5165\u8d21\u732e\u699c\u201d\uff0c\u65c1\u8fb9\u663e\u793a\u5c06\u516c\u5f00\u7684\u540d\u5b57\uff0c\u70b9\u201c\u786e\u8ba4\u201d\u624d\u751f\u6548\uff1b\u7ec8\u7aef\u5173\u8054\u540e\u4e5f\u4f1a\u63d0\u793a\u52a0\u5165\u547d\u4ee4\u3002\u5173\u8054 #13142\u3002\n- \u53d1\u9001\u53cd\u9988\u65f6\u9644\u4e0a\u5404\u8fdb\u7a0b\u7684\u5185\u5b58\uff08\u53ea\u6709\u8fdb\u7a0b\u7c7b\u578b\u548c\u6570\u5b57\uff09\uff0c\u8868\u5355\u91cc\u80fd\u5148\u770b\u5230\uff0c\u65b9\u4fbf\u5224\u65ad\u662f\u754c\u9762\u8fd8\u662f\u5185\u6838\u5360\u5f97\u591a\u3002\u5173\u8054 #13899\u3002\n- Studio \u9879\u76ee\u914d\u7f6e\u652f\u6301 `.reasonix/reasonix.toml`\uff0c\u4ec5\u5728\u6839\u76ee\u5f55\u7684 `reasonix.toml` \u4e0d\u5b58\u5728\u65f6\u4f7f\u7528\uff0c\u9879\u76ee\u6743\u9650\u9650\u5236\u4e0d\u53d8\u3002\u5173\u8054 #6007 fixed in #13887 by @lancy69\u3002\n\n## \u53d8\u66f4\n\n- \u957f\u4f1a\u8bdd\u5360\u7528\u7684\u5185\u5b58\u66f4\u5c11\uff1a\u5df2\u5b8c\u6210\u7684\u957f\u8f93\u51fa\u5728\u9875\u9762\u91cc\u53ea\u4fdd\u7559\u5f00\u5934\u548c\u7ed3\u5c3e\u5404 4 KB\uff0c\u53ef\u70b9\u201c\u663e\u793a\u5b8c\u6574\u8f93\u51fa\u201d\u53d6\u56de\uff1b\u547d\u4ee4\u8fd0\u884c\u671f\u95f4\u53ea\u4fdd\u7559\u6700\u8fd1 64 KB\u3002\u5173\u8054 #13899\u3002\n- \u5df2\u5b8c\u6210\u7684\u5b50\u4ee3\u7406\u5361\u7247\u6536\u8d77\u65f6\u4e0d\u518d\u52a0\u8f7d\u5b83\u7684\u5b50\u8c03\u7528\uff0c\u5c55\u5f00\u624d\u52a0\u8f7d\uff1b120 \u4e2a\u5b50\u4ee3\u7406\u7684\u9875\u9762\u8282\u70b9\u4ece\u7ea6 5 \u4e07\u964d\u5230\u7ea6 5 \u5343\u3002\u5173\u8054 #13899\u3002\n- \u6280\u80fd\u5b50\u4ee3\u7406\uff08explore\u3001locate \u7b49\uff09\u5728\u5b50\u4ee3\u7406\u5217\u8868\u91cc\u9664\u4e86\u540d\u5b57\uff0c\u4e5f\u663e\u793a\u5b83\u6536\u5230\u7684\u4efb\u52a1\u7684\u7b2c\u4e00\u884c\u3002\u5173\u8054 #13458\u3002\n- \u6a21\u578b\u6d3e\u4efb\u52a1\u7ed9\u5c1a\u672a\u51b3\u5b9a\u4fe1\u4efb\u7684\u9879\u76ee\u65f6\uff0c\u5bf9\u65b9\u7a97\u53e3\u4fdd\u6301\u6253\u5f00\u5e76\u663e\u793a\u4fe1\u4efb\u95ee\u9898\uff0c\u5e76\u544a\u77e5\u4efb\u52a1\u672a\u53d1\u9001\uff1b\u540e\u53f0\u7a97\u683c\u5728\u7b49\u4f60\u51b3\u5b9a\u4fe1\u4efb\u65f6\uff0c\u4fa7\u680f\u4f1a\u8bdd\u884c\u4e5f\u4f1a\u6807\u51fa\u6765\u3002\u5173\u8054 #13681\u3001#13890\u3002\n\n## \u4fee\u590d\n\n- \u516c\u7f51\u8fdc\u7a0b\u65f6\uff0c\u8f83\u5927\u7684\u5386\u53f2\u6216\u6587\u4ef6\u4f20\u8f93\u8d85\u8fc7\u534a\u5206\u949f\u4f1a\u88ab\u8bef\u62a5\u201c\u8bf7\u68c0\u67e5\u7535\u8111\u662f\u5426\u5728\u7ebf\u201d\uff1b\u73b0\u5728\u7535\u8111\u4ecd\u5728\u56de\u4f20\u5c31\u7ee7\u7eed\u7b49\u3002\u5173\u8054 #13909\u3002\n- \u6253\u5f00\u4e24\u4e2a\u53ca\u4ee5\u4e0a\u6807\u7b7e\u9875\u65f6\uff0c\u5c55\u5f00\u6216\u6536\u8d77\u5de6\u4fa7\u4f1a\u8bdd\u680f\u4f1a\u6389\u5e27\uff1b\u73b0\u5728\u9690\u85cf\u7684\u6807\u7b7e\u9875\u4e0d\u518d\u53c2\u4e0e\u91cd\u6392\u3002\u5173\u8054 #13936 fixed in #13937\u3002\n- macOS \u83dc\u5355\u680f\u91cc\u7684\u6258\u76d8\u56fe\u6807\u4e0d\u518d\u662f\u6574\u4e2a\u5f69\u8272\u5e94\u7528\u56fe\u6807\uff0c\u6539\u4e3a\u968f\u6d45\u8272\u3001\u6df1\u8272\u83dc\u5355\u680f\u7740\u8272\u7684\u5355\u8272\u56fe\u6807\u3002\u5173\u8054 #13929 fixed in #13930\u3002\n- \u957f\u65f6\u95f4\u4f7f\u7528\u540e\u5076\u53d1\u201c\u7f3a\u5c11\u672c\u6b21\u542f\u52a8\u7684\u51ed\u636e\uff0c\u8bf7\u91cd\u65b0\u6253\u5f00 Studio \u540e\u91cd\u8bd5\u201d\u3001\u53d1\u9001\u6309\u94ae\u5931\u6548\uff1b\u5916\u58f3\u73b0\u5728\u4f1a\u5728\u8ba4\u8bc1 cookie \u88ab\u79fb\u9664\u65f6\u7acb\u5373\u8865\u56de\uff0c\u5e76\u5728\u65e5\u5fd7\u91cc\u8bb0\u4e0b\u539f\u56e0\u3002\u5173\u8054 #13932\u3002\n- \u6062\u590d\u65e7\u4f1a\u8bdd\u65f6\uff0c1.x \u684c\u9762\u7aef\u81ea\u5df1\u65b0\u5efa\u7684\u3001\u7f16\u53f7\u5e26 desktop- \u6216 desktop-manual- \u524d\u7f00\u7684\u4f1a\u8bdd\u4e0d\u518d\u88ab\u8df3\u8fc7\uff1b1.x \u91cc\u5df2\u5f52\u6863\u7684\u4f1a\u8bdd\u8fc1\u79fb\u540e\u4ecd\u662f\u5f52\u6863\u3002\u5173\u8054 #13920 fixed in #13921\u3001#13880 by @imcreazy\u3002\n- \u4f1a\u8bdd\u5f88\u591a\u65f6\u70b9\u5f00\u201c\u5f52\u6863\u201d\uff0c\u8bfb\u53d6\u671f\u95f4\u4e0d\u518d\u663e\u793a\u201c\u6ca1\u6709\u5339\u914d\u7684\u4f1a\u8bdd\u201d\uff0c\u6539\u4e3a\u201c\u6b63\u5728\u8bfb\u53d6\u6587\u4ef6\u5939\u2026\u201d\u3002\u5173\u8054 #13884\u3002\n- \u5de5\u4f5c\u533a\u5f88\u5927\uff08\u5982\u6574\u4e2a\u76d8\u6839\uff09\u65f6\uff0c\u9996\u4e2a\u5de5\u5177\u6700\u591a\u7b49\u5f85 10 \u79d2\u7684\u5de5\u4f5c\u533a\u5feb\u7167\uff0c\u8d85\u65f6\u8bb0\u4e3a\u89c2\u5bdf\u4e0d\u5b8c\u6574\uff0c\u4e0d\u518d\u4e00\u76f4\u5361\u4f4f\u3002\u5173\u8054 #13883\u3002\n- \u4fa7\u680f\u4f1a\u8bdd\u884c\u7684\u6807\u9898\u4e0d\u518d\u88ab\u8fc7\u65e9\u622a\u65ad\uff1a\u4e0d\u518d\u4e3a\u6ca1\u663e\u793a\u7684\u6309\u94ae\u7559\u7a7a\u4f4d\uff0c\u5f52\u6863\u6309\u94ae\u53ea\u5728\u60ac\u505c\u6216\u805a\u7126\u65f6\u5360\u4f4d\u3002\u5173\u8054 #13904 fixed in #13908\u3002\n- \u663e\u793a\u5de6\u4fa7\u56fe\u6807\u680f\u65f6\uff0c\u4fa7\u680f\u5e95\u90e8\u7684\u201c\u8fde\u63a5\u4e0e\u673a\u5668\u201d\u4e0d\u518d\u91cd\u590d\u51fa\u73b0\u3002\u5173\u8054 #13916\u3002\n- \u5386\u53f2\u7d22\u5f15\u9047\u5230\u6682\u65f6\u8bfb\u4e0d\u4e86\u7684\u4f1a\u8bdd\u6587\u4ef6\u540e\uff0c\u4f1a\u5728\u5b83\u6062\u590d\u53ef\u8bfb\u65f6\u91cd\u65b0\u7d22\u5f15\uff0c\u4e0d\u518d\u4e00\u76f4\u663e\u793a\u201c\u6b63\u5728\u5efa\u7acb\u7d22\u5f15\u201d\u3002\u5173\u8054 #13923 by @chuiwenwei\u3002\n- \u4ee3\u7801\u6a21\u5f0f\u7684\u811a\u672c\u91cc `read_file` \u73b0\u5728\u8fd4\u56de\u6587\u4ef6\u539f\u6587\uff0c\u4e0d\u518d\u628a\u5e26\u884c\u53f7\u7684\u663e\u793a\u5f62\u5f0f\u5199\u56de\u6587\u4ef6\u9020\u6210\u6c61\u67d3\u3002\u5173\u8054 #13945 by @SivanCola\u3002\n- \u538b\u7f29\u5931\u8d25\uff08\u6458\u8981\u88ab\u622a\u65ad\u6216\u62d2\u7edd\uff09\u540e\u4e0d\u518d\u628a\u65e5\u671f\u3001\u6280\u80fd\u5217\u8868\u3001\u9879\u76ee\u8bf4\u660e\u91cd\u590d\u53d1\u7ed9\u6a21\u578b\uff0c\u63d0\u793a\u4e0d\u518d\u8d8a\u6eda\u8d8a\u5927\u3002\u5173\u8054 #13949 by @SivanCola\u3002\n- \u6839\u76ee\u5f55\u5ffd\u7565\u89c4\u5219\u91cc\u4ee5\u8f6c\u4e49\u7684 `!` \u6216 `#` \u5f00\u5934\u7684\u6a21\u5f0f\u3001\u4ee5\u53ca `core.excludesFile` \u7684\u8bfb\u53d6\u65b9\u5f0f\uff0c\u73b0\u5728\u548c git \u4e00\u81f4\u3002\u5173\u8054 #13907 by @kevin9327\u3001#13906 by @kevin9327\u3002\n- \u8bb0\u5fc6\u8fc1\u79fb\u9047\u5230\u8bfb\u4e0d\u4e86\u7684\u6761\u76ee\u65f6\u4f1a\u5982\u5b9e\u62a5\u544a\u800c\u4e0d\u662f\u4e2d\u9014\u505c\u6b62\uff1b\u8fd8\u539f\u5f52\u6863\u65f6\u5148\u6682\u5b58\u518d\u53d1\u5e03\uff0c\u907f\u514d\u534a\u9014\u5931\u8d25\u4e22\u5931\u3002\u5173\u8054 #13912 by @chuiwenwei\u3001#13905 by @chuiwenwei\u3002\n- \u8bfb\u53d6 OpenAI \u517c\u5bb9\u6d41\u91cc\u6570\u5b57\u5f62\u5f0f\u7684\u9519\u8bef\u7801\uff1b\u5408\u5e76\u5de5\u5177\u8fdb\u5ea6\u548c\u524d\u540e\u589e\u91cf\uff0c\u5c55\u5f00\u6e38\u6807\u8ddf\u968f\u6700\u65b0\u8f93\u51fa\u3002\u5173\u8054 #13881 by @imcreazy\u3001#13895 by @jf200s\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@SivanCola\u3001@lancy69\u3001@imcreazy\u3001@chuiwenwei\u3001@kevin9327\u3001@jf200s\n\n---\n\n<!-- lang:en -->\n\nThis release adds session Agent presets (off by default), terminal queue management, a Session messages entry in Settings and `.reasonix/reasonix.toml`.\nLong sessions use much less memory, and it fixes false offline reports over the relay, dropped frames with several tabs, the macOS tray icon and 1.x session import.\n\n## New\n\n- Session Agent presets: personas, tools and modules are bound to a session by version, managed on the Persona page. Off by default; the picker stays hidden until you turn it on. Refs #13613 by @SivanCola.\n- Presets may adjust only MCP and extension timeouts, never launch arguments, endpoints or credentials. Writing presets and switching need configuration-edit authority. Refs #13613 by @SivanCola.\n- Moving a conversation bound to a preset into another project is refused, and the original stays unchanged. Refs #13613 by @SivanCola.\n- In the terminal, queued messages show under the working line: Up selects, Alt+Up/Down reorders, Enter saves, d twice deletes, r retries, Space pauses. Refs #12144.\n- Session messages is its own entry in Settings, where projects can be allowed through from those already added or taken back. Refs #13794.\n- The free-text box of a question card can optimise the prompt: click the sparkle or press Ctrl+Shift+E; the rewrite replaces your text only when you take it. Refs #13870.\n- Linking a computer offers a pre-ticked \"join the contribution board\" with the public name, applied only on Confirm; the terminal prints the join command. Refs #13142.\n- A report now carries each process's memory (only the process type and numbers), shown in the form first, to tell the interface from the kernel. Refs #13899.\n- Studio loads `.reasonix/reasonix.toml` when the root `reasonix.toml` is absent, with unchanged project restrictions. Refs #6007 fixed in #13887 by @lancy69.\n\n## Changed\n\n- Long sessions use less memory: a finished call's long output keeps its first and last 4 KB, with \"Show full output\" to fetch the rest; a running command keeps its last 64 KB. Refs #13899.\n- A closed, finished sub-agent no longer holds its child calls in the page; 120 sub-agents drop from about 50,000 nodes to 5,000. Refs #13899.\n- A skill sub-agent (explore, locate and the like) shows the first line of its task in the sub-agent list beside its name. Refs #13458.\n- Dispatching to a project you have not yet trusted keeps its window open with the trust question and says the task was not sent. Refs #13681.\n- A background pane asking whether to trust its folder is marked in the sidebar like any other waiting one. Refs #13890.\n\n## Fixed\n\n- Over the public relay, a history or file taking over 30 seconds to arrive was reported as \"check the computer is online\"; it is now waited for. Refs #13909.\n- With two or more tabs open, folding the left session rail dropped frames; hidden tabs no longer take part in that relayout. Refs #13936 fixed in #13937.\n- On macOS the menu-bar tray icon is a monochrome template glyph that follows the light or dark bar, not the full-colour app badge. Refs #13929 fixed in #13930.\n- The occasional \"this launch's credential is missing\" refusal after long use, with a dead send button: the shell now restores its authentication cookie if it is removed and logs the cause. Refs #13932.\n- Recovering older sessions no longer skips the conversations 1.x Desktop created itself (ids prefixed desktop- or desktop-manual-), and sessions 1.x had archived stay archived. Refs #13920 fixed in #13921, #13880 by @imcreazy.\n- With a long history, Archived no longer says \"No matching sessions\" while still reading; it says it is reading. Refs #13884.\n- In a very large workspace (a drive root, say) the first tool waits at most 10 s for the workspace snapshot and records the observation as incomplete. Refs #13883.\n- Session titles in the sidebar are no longer cut short: nothing is held back for buttons that are not showing, and the archive button takes room only while hovered or focused. Refs #13904 fixed in #13908.\n- The sidebar's \"Connections and machines\" button no longer repeats the Remote entry of the icon rail while the rail is shown. Refs #13916.\n- After a session file was briefly unreadable, the history index retries it once it can be read, instead of staying at \"still building\". Refs #13923 by @chuiwenwei.\n- In code mode, a script's `read_file` returns the file's text, so a read-edit-write script no longer writes the numbered display back into the file. Refs #13945 by @SivanCola.\n- After a failed compaction (a truncated or refused summary), the date, skills listing and project instructions are no longer sent to the model again, so the prompt stops growing. Refs #13949 by @SivanCola.\n- An escaped leading `!` or `#` in root ignore patterns, and how `core.excludesFile` is read, now follow git. Refs #13907 by @kevin9327, #13906 by @kevin9327.\n- A memory migration reports an entry it cannot read instead of stopping; archive restores stage before publishing. Refs #13912 by @chuiwenwei, #13905 by @chuiwenwei.\n- A numeric error code in an OpenAI-compatible stream error is read; tool progress merges with the deltas around it, and the reveal cursor follows the latest output. Refs #13881 by @imcreazy, #13895 by @jf200s.\n\n## Contributors\n\nThanks to this release's contributors: @SivanCola, @lancy69, @imcreazy, @chuiwenwei, @kevin9327, @jf200s\n\n## What's Changed\n* fix(agent): the first tool waits at most snapshotWait for the turn-start snapshot by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13885\n* test(openai): pin how usage is read from captured DeepSeek streams (stop and length) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13878\n* fix(studio): the sidebar says it is reading, not that nothing matches, while the rows of another view are still in hand by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13886\n* fix(delegation): a skill sub-agent's row carries the first line of its task as its label by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13879\n* fix(openai): read a numeric error code from a stream error event by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/13881\n* feat(tui): queued messages are drawn as rows and managed with the keys 1.x had by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13854\n* feat(config): support .reasonix/reasonix.toml project fallback by @lancy69 in https://github.com/esengine/DeepSeek-Reasonix/pull/13887\n* feat(studio): linking a computer offers the contribution board with a name to confirm, and the terminal says how to join by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13896\n* fix(memory): rebuild the derived index when it cannot be read by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13800\n* fix(dispatch): keep an undecided project's window open and say the task was not sent by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13890\n* feat(studio): the free-text answer of a question card can optimise the prompt like the composer by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13893\n* feat(studio): a conversation out of sight that is asking whether to trust its folder is marked as waiting in the sidebar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13900\n* Update acknowledgments contributors / \u66f4\u65b0\u81f4\u8c22\u8d21\u732e\u8005 by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13897\n* feat(studio): session messages have a settings entry of their own, with projects allowed through to add and take back by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13847\n* fix: explain invalid market source commits / \u51c6\u786e\u63d0\u793a\u5e02\u573a\u6765\u6e90\u63d0\u4ea4\u53f7\u9519\u8bef by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13855\n* fix(memory): stage archive entries before publishing a restore by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13905\n* fix(studio): a session title takes the room the row leaves it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13908\n* fix(gitignore): read core.excludesFile the way git does by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/13906\n* fix(sessionstore): gate the compaction sidecar on the session write permit by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13910\n* feat(feedback): a report carries each process's memory as a fixed type and two numbers, shown in the form first by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13911\n* perf(studio): a finished sub-agent card mounts its child calls only while it is open by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13903\n* fix(remote): wait for a desktop answer that is still arriving instead of reporting the computer offline by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13909\n* fix(event): merge tool progress with the deltas around it; fix(studio): the reveal cursor follows a shorter replacement back by @jf200s in https://github.com/esengine/DeepSeek-Reasonix/pull/13895\n* fix(studio): a feedback capture that finishes after the dialog is gone writes no state by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13914\n* fix(studio): the sidebar does not repeat the Remote entry while the icon rail shows it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13916\n* perf(studio): a running command keeps only the end of its output in the page and says how much came before by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13915\n* fix(gitignore): keep an escaped leading ! or # in root ignore patterns by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/13907\n* fix(memory): report a fact the migration cannot read instead of stopping by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13912\n* fix(migration): keep the conversations 1.x had archived archived by @imcreazy in https://github.com/esengine/DeepSeek-Reasonix/pull/13880\n* fix(sessionstore): import the 1.x Desktop sessions whose ids carry a desktop- or desktop-manual- prefix by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13921\n* feat(studio): a finished call's long output is kept as its two ends in the page and fetched whole from the kernel on request by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13917\n* fix(history): retry a corrupt source once its transcript is readable by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13923\n* fix(e2ebench): count a killed run's wall in the same population as the report by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13925\n* fix(desktop): draw a monochrome template glyph in the macOS menu bar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13930\n* fix(desktop): restore the launch credential cookie when something removes it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13933\n* Publish the Studio website changelog after releases / \u53d1\u5e03\u540e\u81ea\u52a8\u540c\u6b65\u5e76\u9a8c\u8bc1\u5b98\u7f51 Studio \u66f4\u65b0\u65e5\u5fd7 by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13939\n* perf(studio): hidden panes skip layout while the rail animates by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13937\n* feat(studio): add session Agent compositions / \u65b0\u589e\u4f1a\u8bdd\u7ea7 Agent \u9884\u8bbe by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13613\n* fix(e2ebench): count script calls inside their round; keep one trajectory per trial by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13944\n* fix(script): a script's read_file returns the file's text, not its display by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13945\n* fix(control): a fold that folded nothing does not re-owe standing state by @SivanCola in https://github.com/esengine/DeepSeek-Reasonix/pull/13949\n\n## New Contributors\n* @lancy69 made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/13887\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.45.0...studio-v2.46.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002x86_64 \u7528\u6587\u4ef6\u540d\u5e26 amd64 \u7684\u5305\uff0caarch64\uff08\u7edf\u4fe1 UOS\u3001\u9e92\u9e9f\u7b49\uff09\u7528\u5e26 arm64 \u7684\u5305\u3002\u4e5f\u63d0\u4f9b `.AppImage`\uff08\u53ea\u63d0\u4f9b\u4e0b\u8f7d\uff0c\u4e0d\u4f1a\u81ea\u66f4\u65b0\uff1b\u9700\u8981 FUSE 2\uff0c\u6216\u7528 `--appimage-extract-and-run` \u542f\u52a8\uff09\u3002\n\n\u4e09\u4e2a\u5e73\u53f0\u90fd\u80fd\u81ea\u66f4\u65b0\uff1aLinux \u7684 `.deb` \u8d70\u81ea\u5df1\u7684\u5305\uff08`.rpm` \u7684\u81ea\u66f4\u65b0\u5c1a\u672a\u63d0\u4f9b\uff0c\u8bf7\u624b\u52a8\u4e0b\u8f7d\u65b0\u5305\uff09\uff0cWindows \u8fd0\u884c\u4e0b\u4e00\u4e2a\u5b89\u88c5\u5668\uff0cmacOS \u66ff\u6362\u81ea\u8eab bundle\u3002\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions