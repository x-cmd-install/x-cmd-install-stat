898\u3002\n\n## \u65b0\u589e\n\n- \u56fe\u6807\u680f\u79fb\u5230\u7a97\u53e3\u6700\u5de6\u8fb9\uff0c\u5e95\u90e8\u65b0\u589e\u5e26\u672a\u8bfb\u89d2\u6807\u7684\u300c\u53d1\u9001\u53cd\u9988\u300d\u5165\u53e3\uff1b\u5916\u89c2\u9875\u300c\u56fe\u6807\u680f\u300d\u6539\u4e3a\u59cb\u7ec8\u663e\u793a\uff08\u9ed8\u8ba4\uff09\uff0f\u4ec5\u4fa7\u680f\u6298\u53e0\u65f6\u663e\u793a\uff0f\u4ece\u4e0d\u663e\u793a\uff0c\u7acb\u5373\u751f\u6548 (#12428)\n- \u8f93\u5165\u6846\u7684\u6a21\u578b\u9009\u62e9\u5668\u5e26\u641c\u7d22\u6846\uff08\u8f93\u5165\u5373\u8fc7\u6ee4\uff0c\u56de\u8f66\u9009\u7b2c\u4e00\u9879\uff0cEsc \u5173\u95ed\uff09\uff0c\u6309\u670d\u52a1\u5546\u5206\u7ec4\u5e76\u56fa\u5b9a\u663e\u793a\u5206\u7ec4\u6807\u9898\uff0c\u6761\u76ee\u6539\u4e3a\u5355\u884c\uff0c\u5f53\u524d\u6a21\u578b\u4fdd\u7559\u52fe\u9009\uff0c\u58f0\u660e\u53ef\u8bfb\u56fe\u7684\u6a21\u578b\u5e26\u300c\u8bfb\u56fe\u300d\u6807\u8bb0 (#12442)\n- \u5de5\u4f5c\u53f0\u6587\u4ef6\u6d4f\u89c8\u5668\u91cc\u6253\u5f00 `.html`/`.htm` \u6587\u4ef6\u65f6\uff0c\u6807\u7b7e\u9875\u65b0\u589e\u300c\u9884\u89c8\u300d\u89c6\u56fe\uff08\u9ed8\u8ba4\uff09\uff1a\u6309\u7f51\u9875\u6253\u5f00\uff0c\u540c\u76ee\u5f55\u7684\u6837\u5f0f\u3001\u811a\u672c\u3001\u56fe\u7247\u7167\u5e38\u52a0\u8f7d\uff0c\u6587\u4ef6\u53d8\u5316\u540e\u81ea\u52a8\u5237\u65b0\uff0c\u672a\u4fdd\u5b58\u7684\u8349\u7a3f\u4e0d\u4f1a\u88ab\u8986\u76d6 (#12443)\n- \u8bbe\u7f6e\u7684\u5916\u89c2\u9875\u300c\u9ad8\u7ea7\u5916\u89c2\u300d\u65b0\u589e\u300c\u89c6\u89c9\u6548\u679c\u300d\uff1a\u5b8c\u6574\uff08\u9ed8\u8ba4\uff09\uff0f\u8282\u80fd\u3002\u8282\u80fd\u6863\u53bb\u6389\u78e8\u7802\u73bb\u7483\u3001\u52a8\u6001\u5929\u7a7a\u548c\u9897\u7c92\uff0c\u5e03\u5c40\u4e0d\u53d8\uff1b\u53ea\u4f5c\u7528\u4e8e\u672c\u673a\uff0c\u7acb\u5373\u751f\u6548 (#12448)\n- \u7ec8\u7aef\u754c\u9762\u7684\u5de5\u5177\u5ba1\u6279\u548c\u8ba1\u5212\u5ba1\u6279\u5361\u7247\u652f\u6301\u7528 `j`/`k` \u548c `Ctrl+N`/`Ctrl+P` \u79fb\u52a8\u5149\u6807 (#12419 by @xxoingr)\n- \u7ec8\u7aef\u754c\u9762\u7684\u63d0\u95ee\u5361\u7247\u652f\u6301 `j`/`k` \u4e0a\u4e0b\u79fb\u52a8\u3001`h`/`l` \u5728\u95ee\u9898\u4e4b\u95f4\u5de6\u53f3\u5207\u6362 (#12420 by @xxoingr)\n- \u7ec8\u7aef\u754c\u9762\u7684 `/mcp` \u9762\u677f\u652f\u6301 `l`/\u53f3\u65b9\u5411\u952e\u8fdb\u5165\u670d\u52a1\u7684\u5de5\u5177\u5217\u8868\uff0c`h`/\u5de6\u65b9\u5411\u952e\u8fd4\u56de\u6216\u5173\u95ed\u9762\u677f\uff0c`q` \u76f4\u63a5\u5173\u95ed (#12421 by @xxoingr)\n- \u7ec8\u7aef\u754c\u9762\u5728\u5f00\u542f\u5e94\u7528\u5185\u9f20\u6807\u6355\u83b7\u65f6\uff0c\u6ca1\u6709\u9009\u4e2d\u6587\u5b57\u7684\u53f3\u952e\u4f1a\u7c98\u8d34\u526a\u8d34\u677f\u91cc\u7684\u6587\u5b57\uff0c\u4e0e 1.x \u4e00\u81f4\uff0c\u901a\u8fc7 SSH \u8fde\u63a5\u65f6\u4ecd\u663e\u793a\u539f\u6709\u63d0\u793a\uff1b\u8f93\u5165\u6846\u9690\u85cf\u65f6\u4e0d\u7c98\u8d34 (#12436 by @xxoingr)\n- \u7ec8\u7aef\u754c\u9762\u5728\u56de\u5408\u8fd0\u884c\u4e2d\u6309 `Ctrl+Enter`\uff0c\u628a\u8f93\u5165\u6846\u5185\u5bb9\u4f5c\u4e3a\u5f15\u5bfc\u53d1\u9001\uff0c\u6548\u679c\u4e0e `Ctrl+S` \u76f8\u540c\uff0c\u5728\u4e0b\u4e00\u4e2a\u5de5\u5177\u8fb9\u754c\u9001\u8fbe\uff1b\u7a7a\u95f2\u65f6\u6309\u5b83\u4e0d\u505a\u4efb\u4f55\u4e8b\uff0c\u4e0d\u4f1a\u628a\u60f3\u6362\u884c\u7684\u8349\u7a3f\u63d0\u4ea4\u51fa\u53bb (#12437 by @xxoingr)\n\n## \u53d8\u66f4\n\n- \u6253\u5f00\u4f1a\u8bdd\u7a97\u683c\u65f6\uff0cMCP\u3001\u6539\u52a8\u3001\u4e0a\u4e0b\u6587\u548c\u961f\u5217\u4e0d\u518d\u5728\u72b6\u6001\u8fd4\u56de\u524d\u540e\u5404\u8bfb\u53d6\u4e00\u6b21\uff1b\u5728\u6d4b\u8bd5\u5939\u5177\u91cc\u8fd9\u56db\u9879\u5404\u7531\u4e24\u6b21\u964d\u4e3a\u4e00\u6b21\uff0c\u5b9e\u9645\u8017\u65f6\u53d8\u5316\u5c1a\u672a\u5b9e\u6d4b (#12344 by @KHG420)\n- Go \u5de5\u5177\u94fe\u5347\u5230 1.26.9\u3001\u7f51\u7edc\u5e93 `golang.org/x/net` \u5347\u5230 v0.60.0\uff0c\u6e05\u9664\u6f0f\u6d1e\u626b\u63cf\u5bf9\u672c\u7a0b\u5e8f\u62a5\u544a\u7684 11 \u9879\u53ef\u8fbe\u6f0f\u6d1e\uff0c\u626b\u63cf\u7ed3\u679c\u4e3a 0\uff1b\u53ea\u5f71\u54cd\u6784\u5efa\uff0c\u6ca1\u6709\u6e90\u7801\u6539\u52a8 (#12446)\n\n## \u4fee\u590d\n\n- \u5e26\u5929\u7a7a\u7684\u4e3b\u9898\u5305\u4e0d\u518d\u8ba9\u663e\u5361\u6301\u7eed\u6ee1\u8f7d\uff1a\u5929\u7a7a\u753b\u5e03\u964d\u5230\u6bcf\u79d2 15 \u5e27\uff0c\u7a97\u53e3\u4e0d\u53ef\u89c1\u6216\u5931\u7126\u65f6\u505c\u7ed8\uff0c\u9762\u677f\u6a21\u7cca\u6539\u4e3a\u66f4\u5b9e\u7684\u5e95\u8272\u3002RTX 3060 \u4e0a\u7a7a\u95f2\u5360\u7528\u4ece 9.3% \u964d\u5230 1.0%\uff0c\u96c6\u6210\u663e\u5361\u672a\u5b9e\u6d4b (#12448)\n- \u8fde\u7eed\u70b9\u51fb\u961f\u5217\u91cc\u4e24\u6761\u7684\u300c\u7f16\u8f91\u300d\u65f6\uff0c\u5148\u70b9\u7684\u90a3\u6761\u8f83\u665a\u8fd4\u56de\uff0c\u4e0d\u518d\u8986\u76d6\u540e\u70b9\u90a3\u6761\u7684\u7f16\u8f91\u6846\u548c\u672a\u4fdd\u5b58\u7684\u8349\u7a3f\uff1b\u8f83\u65e9\u7684\u62d2\u7edd\u63d0\u793a\u4e5f\u4e0d\u518d\u76d6\u6389\u5df2\u6253\u5f00\u7684\u7f16\u8f91\u6846 (#12411 by @KHG420)\n- \u7f16\u8f91\u5df2\u53d1\u9001\u7684\u6d88\u606f\u5e76\u91cd\u53d1\u65f6\uff0c\u5982\u679c\u56de\u9000\u5931\u8d25\uff0c\u7f16\u8f91\u6846\u4fdd\u7559\u4fee\u6539\u7684\u6587\u5b57\u5e76\u5728\u539f\u5904\u663e\u793a\u9519\u8bef\uff0c\u53ef\u76f4\u63a5\u91cd\u8bd5\uff0c\u4e0d\u518d\u5173\u95ed\u7f16\u8f91\u6846\u540e\u4ec0\u4e48\u90fd\u6ca1\u53d1\u51fa\u53bb (#12426 by @KHG420)\n- \u53cd\u9988\u622a\u56fe\u8fd8\u5728\u8bfb\u53d6\u65f6\u63d0\u4ea4\u53cd\u9988\u518d\u70b9\u300c\u518d\u5199\u4e00\u6761\u300d\uff0c\u4e0a\u4e00\u6761\u7684\u622a\u56fe\u4e0d\u518d\u6df7\u8fdb\u4e0b\u4e00\u6761\u53cd\u9988 (#12423 by @KHG420)\n- \u6253\u5f00\u53cd\u9988\u5bf9\u8bdd\u6846\u540e\uff0c\u7126\u70b9\u5076\u5c14\u505c\u5728\u6807\u7b7e\u9875\u4e0a\u800c\u4e0d\u8fdb\u5165\u6b63\u6587\u8f93\u5165\u6846\u7684\u95ee\u9898\u5df2\u4fee\u590d (#12439)\n- \u5df2\u53d1\u9001\u6d88\u606f\u91cc\u7c98\u8d34\u6216\u4e0a\u4f20\u5e76\u4fdd\u5b58\u7684\u56fe\u7247\u73b0\u5728\u663e\u793a\u9884\u89c8\uff1b\u56fe\u7247\u8bfb\u53d6\u5931\u8d25\u65f6\u4fdd\u7559\u9884\u89c8\u6846\u5e76\u663e\u793a\u300c\u56fe\u7247\u4e0d\u53ef\u7528\u300d\uff0c\u7ad6\u56fe\u4e0d\u518d\u6491\u51fa\u9884\u89c8\u6846 (#12332 by @KHG420)\n- \u6807\u9898\u680f\u7684\u8bbe\u5907\u9762\u677f\u5728\u4e91\u7aef\u8bbf\u95ee\u79bb\u7ebf\u65f6\uff0c\u4f1a\u533a\u5206\u8bf4\u660e\u662f\u672a\u767b\u5f55\u3001\u4e2d\u7ee7\u4e0d\u53ef\u8fbe\u8fd8\u662f\u4e2d\u7ee7\u62d2\u7edd\uff0c\u4e0d\u518d\u4e00\u5f8b\u663e\u793a\u4e3a\u672a\u767b\u5f55 (#12429 by @icebear02)\n- \u7ec8\u7aef\u754c\u9762\u8f93\u5165\u6846\u91cc\u8c03\u51fa\u4e86\u591a\u884c\u5386\u53f2\u6761\u76ee\u540e\uff0c\u4e0a\u4e0b\u952e\u53ef\u4ee5\u7ee7\u7eed\u5f80\u66f4\u65e9\u7684\u6761\u76ee\u7ffb\uff0c\u4e0d\u518d\u5361\u5728\u8be5\u6761\u76ee\u7684\u7b2c\u4e00\u884c (#12435 by @xxoingr)\n- \u9879\u76ee\u91cc\u58f0\u660e\u7684 MCP \u670d\u52a1\u542f\u7528\u540e\uff0c\u82e5\u547d\u4ee4\u3001\u53c2\u6570\u3001\u73af\u5883\u53d8\u91cf\u6216\u7f51\u5740\u88ab\u6539\u52a8\uff0c\u4f1a\u56de\u5230\u300c\u5f85\u6388\u6743\u300d\u5e76\u663e\u793a\u5c06\u8981\u542f\u52a8\u7684\u547d\u4ee4\uff1b\u5347\u7ea7\u540e\u5df2\u542f\u7528\u7684\u9879\u76ee\u670d\u52a1\u4f1a\u518d\u8be2\u95ee\u4e00\u6b21 (e2d8eba20, GHSA-j7r7-jh9q-wrq2)\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@xxoingr\u3001@KHG420\u3001@icebear02\n\n## What's Changed\n* feat(studio): icon rail at the far left, with feedback and three display modes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12428\n* docs(readme): say what Reasonix does in plain words by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12424\n* fix(studio): preserve message edits when rewind fails by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12426\n* perf(studio): avoid duplicate reads before the session is known by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12344\n* docs: UI-change section in the PR template and a 1.x parity table by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12432\n* fix(studio): keep the latest queued edit selection by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12411\n* fix(studio): keep pending screenshots within their feedback draft by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12423\n* fix(tui): j/k and Ctrl+N/Ctrl+P move the approval cursor by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12419\n* fix(tui): j/k and h/l drive the question card by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12420\n* chore(deps-dev): bump source-map-js from 1.2.1 to 1.2.2 in /workers/crash-report by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/12408\n* chore(deps): bump tinypool and vitest in /workers/crash-report by @dependabot[bot] in https://github.com/esengine/DeepSeek-Reasonix/pull/12409\n* fix(tui): q, h/l and Left/Right in the MCP manager by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12421\n* test(studio): wait for the pane's subscription before emitting into it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12438\n* fix(studio): move focus into the feedback body after the environment has committed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/12439\n* fix(studio): explain why Internet device access is unavailable by @icebear02 in https://github.com/esengine/DeepSeek-Reasonix/pull/12429\n* fix(studio): preview saved image attachments in user messages by @KHG420 in https://github.com/esengine/DeepSeek-Reasonix/pull/12332\n* fix(tui): history recall walks past a multi-line entry by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12435\n* fix(tui): right-click with no selection pastes clipboard text by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12436\n* fix(tui): Ctrl+Enter steers a running turn by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/12437\n* feat(