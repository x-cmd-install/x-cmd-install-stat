3d0\u4ea4\u4e0e\u6062\u590d\u6d41\u7a0b\uff0c\u9694\u79bb\u4e86\u8fc7\u671f\u7684\u684c\u9762\u4f1a\u8bdd\u72b6\u6001\uff0c\u7edf\u4e00\u4e86 Ask \u4e0e\u51b3\u7b56\u5f39\u7a97\uff0c\u5e76\u4fee\u590d\u4e86 DeepSeek \u5468\u672b\u8ba1\u8d39\u3002\n\n\u53d1\u5e03\u65e5\u671f\uff1a2026-09-06\n\n**Desktop 18 \u00b7 CLI 4**\n\n## \u684c\u9762\u7aef\u66f4\u65b0\n\n### \u91cd\u70b9\u5185\u5bb9\n\n- **[Desktop]** **\u6062\u590d\u63d0\u95ee\u63d0\u4ea4\u4e0e\u72b6\u6001\u6062\u590d** \u2014 \u7cbe\u786e\u7684 Ask \u56de\u7b54\u4e0d\u518d\u56e0\u672a\u6302\u8d77\u800c\u5931\u8d25\uff0c\u4e0d\u53ef\u5199\u7684\u4e8b\u4ef6\u8d26\u672c\u4e0d\u518d\u5bfc\u81f4\u53d6\u6d88\u6216\u63d0\u793a\u89e3\u6790\u6b7b\u9501\u3002\u952e\u76d8\u8f93\u5165\u7684\u81ea\u5b9a\u4e49\u7b54\u6848\u5f97\u4ee5\u4fdd\u7559\uff0cAsk \u8349\u7a3f\u6309\u6807\u7b7e\u9875/\u8fd0\u884c\u65f6/\u8f6e\u6b21/\u63d0\u793a\u8eab\u4efd\u9694\u79bb\uff0c\u540e\u53f0\u6062\u590d\u9519\u8bef\u5f97\u5230\u904f\u5236\u3002 ([#9862](https://github.com/esengine/DeepSeek-Reasonix/pull/9862))\n- **[Desktop]** **\u9694\u79bb\u8fc7\u671f\u63d0\u793a\u5361\u7247** \u2014 \u5ef6\u8fdf\u7684 Ask \u6216\u51b3\u7b56\u5361\u7247\u54cd\u5e94\u4e0d\u518d\u80fd\u8d85\u8fc7\u521b\u5efa\u5b83\u4eec\u7684\u8f6e\u6b21\u6216\u63a7\u5236\u5668\u3002\u6bcf\u4e2a\u63d0\u793a\u90fd\u7ed1\u5b9a\u5230 promptId\u3001turnId\u3001runtimeEpoch \u548c kind\uff0c\u8fc7\u671f\u54cd\u5e94\u4ec5\u4f7f\u5339\u914d\u7684\u8eab\u4efd\u5931\u6548\u3002 ([#9852](https://github.com/esengine/DeepSeek-Reasonix/pull/9852))\n- **[Desktop]** **\u4fee\u590d\u684c\u9762\u4f1a\u8bdd\u72b6\u6001\u7ade\u6001** \u2014 \u4f1a\u8bdd\u4e0d\u518d\u5728\u8f6c\u5f55\u6216\u8fd0\u884c\u65f6\u4ecd\u5b58\u5728\u65f6\u663e\u793a\u4e3a\u7a7a\u6216\u65e0\u6cd5\u6267\u884c\u3002\u6765\u81ea\u5148\u524d\u4f1a\u8bdd\u7ed1\u5b9a\u7684\u5ef6\u8fdf\u4e8b\u4ef6\u901a\u8fc7 runtimeEpoch \u548c sessionGeneration \u9694\u79bb\u88ab\u62d2\u7edd\u3002 ([#9842](https://github.com/esengine/DeepSeek-Reasonix/pull/9842))\n- **[Desktop]** **\u7edf\u4e00 Ask \u4e0e\u51b3\u7b56\u5f39\u7a97** \u2014 \u684c\u9762 Ask \u754c\u9762\u73b0\u5728\u4e0e DeepSeek Harness \u4e00\u81f4\uff0c\u5177\u6709\u7d27\u51d1\u7684\u6807\u9898\u63a7\u4ef6\u3001\u9010\u9898\u5206\u9875\u5668\u3001\u5185\u8054\u81ea\u5b9a\u4e49\u7b54\u6848\u3001\u8349\u7a3f\u6062\u590d\uff0c\u4ee5\u53ca\u7528\u4e8e\u5ba1\u6279\u3001MCP \u4ea4\u4e92\u3001\u8fd0\u884c\u65f6\u51b3\u7b56\u548c\u6269\u5c55\u8868\u5355\u7684\u5171\u4eab\u89c6\u89c9\u5916\u58f3\u3002 ([#9844](https://github.com/esengine/DeepSeek-Reasonix/pull/9844))\n- **[Desktop]** **\u4fee\u590d Ask \u81ea\u5b9a\u4e49\u56de\u7b54\u8349\u7a3f\u4e22\u5931** \u2014 \u9009\u62e9\u5efa\u8bae\u9009\u9879\u4e0d\u518d\u6e05\u9664\u81ea\u5b9a\u4e49\u7b54\u6848\u8349\u7a3f\u3002\u8349\u7a3f\u6309\u95ee\u9898\u4fdd\u7559\uff0c\u5e76\u5728\u91cd\u65b0\u6253\u5f00\u81ea\u5b9a\u4e49\u8f93\u5165\u65f6\u6062\u590d\u3002 ([#9840](https://github.com/esengine/DeepSeek-Reasonix/pull/9840))\n- **[Desktop]** **\u4fee\u590d\u4e3b\u9898\u680f\u6253\u5f00\u5668 key \u51b2\u7a81** \u2014 \u5207\u6362\u9879\u76ee\u4e0d\u518d\u5728\u4e3b\u9898\u680f\u4e2d\u7559\u4e0b\u91cd\u590d\u7684\u5916\u90e8\u6253\u5f00\u5668\u63a7\u4ef6\u3002\u7ec4\u4ef6\u952e\u72ec\u7acb\u547d\u540d\u7a7a\u95f4\u5316\uff0c\u4ee5\u9632\u6b62\u9648\u65e7\u5b9e\u4f8b\u3002 ([#9836](https://github.com/esengine/DeepSeek-Reasonix/pull/9836))\n- **[Desktop \u00b7 CLI]** **\u4fee\u590d DeepSeek \u5468\u672b\u5cf0\u503c\u8ba1\u8d39** \u2014 DeepSeek \u5cf0\u503c\u8ba1\u8d39\u4e0d\u518d\u5728\u5468\u516d\u548c\u5468\u65e5\u5e94\u7528\u3002\u8ba1\u8d39\u8868\u73b0\u5728\u6b63\u786e\u5730\u4ec5\u9002\u7528\u4e8e\u5468\u4e00\u81f3\u5468\u4e94\u3002 ([#9846](https://github.com/esengine/DeepSeek-Reasonix/pull/9846))\n- **[Desktop \u00b7 CLI]** **\u53ef\u6062\u590d\u7684\u5de5\u5177\u53c2\u6570\u9519\u8bef** \u2014 \u683c\u5f0f\u9519\u8bef\u7684\u5de5\u5177\u53c2\u6570\u73b0\u5728\u62a5\u544a\u4e3a\u53ef\u6