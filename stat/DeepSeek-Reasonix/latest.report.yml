8fd0\u884c\u5219\u4e0d\u4fdd\u5b58\u3002\u5173\u8054 #13247\u3002\n- \u65b0\u589e\uff1a\u53f3\u4fa7\u6587\u4ef6\u7a97\u53e3\u7684\u5de5\u5177\u680f\u52a0\u4e86\u201c\u5728\u7cfb\u7edf\u6587\u4ef6\u7ba1\u7406\u5668\u4e2d\u663e\u793a\u6b64\u6587\u4ef6\u201d\u6309\u94ae\uff0c\u4e0d\u7528\u518d\u53bb\u6587\u4ef6\u5217\u8868\u91cc\u53f3\u952e\uff0c\u5173\u8054 #13255\n- \u65b0\u589e\uff1a\u56de\u590d\u53cd\u9988\u65f6\u53ef\u4ee5\u9644\u4e0a\u622a\u56fe\uff08\u7c98\u8d34\u6216\u9009\u62e9\uff0c\u6700\u591a 3 \u5f20\uff09\uff0c\u53ea\u53d1\u7ed9\u7ef4\u62a4\u8005\uff0c\u7531\u7ef4\u62a4\u8005\u51b3\u5b9a\u662f\u5426\u516c\u5f00\u3002\u5173\u8054 #13258\u3002\n- \u65b0\u589e\uff1a\u53ef\u4ee5\u4ece\u9009\u5b9a\u7684\u5206\u652f\u521b\u5efa\u72ec\u7acb\u7684\u5de5\u4f5c\u533a\u526f\u672c\uff0c\u6307\u5b9a\u7684\u5206\u652f\u4e0d\u5b58\u5728\u65f6\u4f1a\u660e\u786e\u63d0\u793a\u3002\u5173\u8054 #13271\u3002\n- \u65b0\u589e\uff1a\u8bbe\u7f6e\u91cc\u300c\u5b50\u4ee3\u7406\u7684\u5199\u5165\u8303\u56f4\u300d\u53ef\u5f00\u542f\u4e50\u89c2\u6a21\u5f0f\uff08\u9ed8\u8ba4\u5173\u95ed\uff09\uff1a\u6ca1\u6709\u58f0\u660e write_paths \u7684\u5b50\u4ee3\u7406\u4e0d\u518d\u5360\u4f4f\u6574\u4e2a\u5de5\u4f5c\u533a\uff0c\u53ef\u4e0e\u4e3b\u4f1a\u8bdd\u5e76\u53d1\u5199\u3002\u5173\u8054 #13274\u3002\n- \u65b0\u589e\uff1a\u8fde\u63a5\u7f16\u8f91\u5668\u91cc\u53ef\u4ee5\u6309\u6a21\u578b\u586b\u5199\u6bcf\u767e\u4e07 token \u7684\u4ef7\u683c\uff08\u8f93\u5165\u3001\u8f93\u51fa\u3001\u7f13\u5b58\u547d\u4e2d\u3001\u8d27\u5e01\uff09\uff0c\u6ca1\u4ef7\u683c\u7684\u6a21\u578b\u5728\u7528\u91cf\u91cc\u4ecd\u663e\u793a\u300c\u672a\u77e5\u300d\u3002\u5173\u8054 #13276\u3002\n- \u65b0\u589e\uff1a\u8bbe\u7f6e \u2192 \u7248\u672c\u91cc\u7684\u201c\u66f4\u65b0\u65b9\u5f0f\u201d\u3002\u9ed8\u8ba4\u201c\u624b\u52a8\u201d\u4e0d\u505a\u540e\u53f0\u8054\u7f51\uff1b\u9009\u201c\u63d0\u9192\u201d\u540e\u6bcf\u5929\u67e5\u4e00\u6b21\u7248\u672c\u76ee\u5f55\uff0c\u6709\u65b0\u7248\u672c\u65f6\u8bbe\u7f6e\u56fe\u6807\u51fa\u73b0\u5c0f\u70b9\u3002\u4e24\u79cd\u65b9\u5f0f\u90fd\u4e0d\u4e0b\u8f7d\u3001\u4e0d\u5b89\u88c5\u3001\u4e0d\u91cd\u542f\u3002\u5173\u8054 #13291\u3002\n- \u65b0\u589e\uff1a\u70b9\u51fb\u8f93\u5165\u6846\u4e0b\u7684\u201c\u7f13\u5b58\u201d\u6570\u5b57\u6253\u5f00\u4f1a\u8bdd\u6982\u89c8\uff1a\u8bf7\u6c42\u3001Token\u3001\u7f13\u5b58\u547d\u4e2d\u3001\u5de5\u4f5c\u65f6\u957f\u3001\u8d39\u7528\u53ca\u6309\u6765\u6e90\u660e\u7ec6\uff0c\u5404\u6570\u5b57\u65c1\u5199\u660e\u53e3\u5f84\uff0c\u8d39\u7528\u4e0d\u5b8c\u6574\u65f6\u53ea\u7ed9\u4e0b\u9650\u3002\u5173\u8054 #13297\u3002\n- \u65b0\u589e\uff1a\u4f1a\u8bdd\u6982\u89c8\u91cc\u52a0\u4e0a\u201c\u4e0a\u4e0b\u6587\u7a97\u53e3\u201d\uff1a\u5df2\u4f7f\u7528\u3001\u5bb9\u91cf\u3001\u5404\u7c7b\u5360\u6bd4\u4e0e\u81ea\u52a8\u538b\u7f29\u7ebf\uff0c\u6807\u660e\u662f\u4e0b\u4e00\u6b21\u8bf7\u6c42\u7684\u5f53\u524d\u503c\u800c\u975e\u7d2f\u8ba1\uff0c\u53ef\u76f4\u8fbe\u4e0a\u4e0b\u6587\u8be6\u60c5\u3002\u5173\u8054 #13297\u3002\n- \u65b0\u589e\uff1a\u6280\u80fd\u5217\u8868\u4f1a\u6807\u51fa\u4ece\u67d0\u4e2a\u6587\u4ef6\u5939\u5b89\u88c5\u7684\u6280\u80fd\u526f\u672c\u4e0e\u6765\u6e90\u6587\u4ef6\u5939\u662f\u5426\u4e00\u81f4\uff08\u6765\u6e90\u6709\u66f4\u65b0\u3001\u526f\u672c\u88ab\u6539\u8fc7\u3001\u4e24\u8fb9\u90fd\u6539\u8fc7\u3001\u6765\u6e90\u4e0d\u89c1\u4e86\uff09\u3002\u5173\u8054 #13311\u3002\n- \u65b0\u589e\uff1a\u6280\u80fd\u5217\u8868\u91cc\uff0c\u4ece\u672c\u673a\u6587\u4ef6\u5939\u590d\u5236\u5b89\u88c5\u7684\u6280\u80fd\u5728\u6765\u6e90\u6709\u53d8\u5316\u65f6\u53ef\u4ee5\u201c\u4ece\u6e90\u6587\u4ef6\u5939\u66f4\u65b0\u2026\u201d\uff1a\u5148\u9884\u89c8\u6bcf\u4e2a\u6587\u4ef6\u7684\u6539\u52a8\uff08\u811a\u672c\u9700\u9010\u9879\u5c55\u5f00\uff09\uff0c\u786e\u8ba4\u540e\u624d\u66ff\u6362\uff0c\u5931\u8d25\u4f1a\u4fdd\u7559\u539f\u526f\u672c\u3002\u5173\u8054 #13311\u3002\n\n## \u53d8\u66f4\n\n- \u4fa7\u680f\u5e95\u90e8\u7684\u300c\u53d1\u9001\u53cd\u9988\u300d\u73b0\u5728\u7528\u5f3a\u8c03\u8272\u52a0\u7c97\u663e\u793a\uff0c\u66f4\u5bb9\u6613\u627e\u5230\uff08\u4e0d\u52a0\u52a8\u753b\uff1b\u9519\u8bef\u63d0\u793a\u4e0a\u7684\u300c\u62a5\u544a\u6b64\u95ee\u9898\u300d\u548c\u547d\u4ee4\u9762\u677f\u5165\u53e3\u4e0d\u53d8\uff09\u3002\u5173\u8054 #13048\u3002\n- MCP \u670d\u52a1\u5668\u628a\u8017\u65f6\u7684\u5de5\u5177\u8c03\u7528\u4f5c\u4e3a\u4efb\u52a1\u8fd4\u56de\u65f6\uff0c\u73b0\u5728\u4f1a\u81ea\u52a8\u8ddf\u8fdb\u5230\u7ed3\u679c\uff0c\u4e0d\u518d\u8fd4\u56de\u7a7a\u7ed3\u679c\u6216\u8981\u6c42\u4efb\u52a1\u6269\u5c55\u800c\u62a5\u9519\u3002\u5173\u8054 #13108\u3002\n- MCP \u4efb\u52a1\u8d85\u8fc7\u5de5\u5177\u8d85\u65f6\u540e\uff0c\u4f1a\u8f6c\u6210\u540e\u53f0\u4efb\u52a1\u7ee7\u7eed\u8fd0\u884c\uff0c\u53ef\u7528 wait\u3001bash_output \u53d6\u7ed3\u679c\u3001kill_shell \u53d6\u6d88\uff0c\u4e0d\u518d\u76f4\u63a5\u8d85\u65f6\u5931\u8d25\u3002\u5173\u8054 #13108\u3002\n- \u6280\u80fd\u5217\u8868\u91cc\uff0c\u6280\u80fd\u58f0\u660e\u7684\u8bb8\u53ef\uff08license\uff09\u3001\u8fd0\u884c\u8981\u6c42\uff08compatibility\uff09\u548c\u9644\u52a0\u4fe1\u606f\uff08metadata\uff09\u73b0\u5728\u53ef\u4ee5\u5c55\u5f00\u67e5\u770b\uff1b\u8fd9\u4e9b\u53ea\u662f\u663e\u793a\uff0c\u4e0d\u5f71\u54cd\u6280\u80fd\u600e\u4e48\u8fd0\u884c\u3002\u5173\u8054 #13110\u3002\n- \u4f1a\u8bdd\u5f88\u591a\u65f6\u4fa7\u680f\u5237\u65b0\u3001\u6539\u540d\u66f4\u5feb\uff1a\u6bcf\u6b21\u5237\u65b0\u4e0d\u518d\u9010\u4e2a\u4f1a\u8bdd\u89e3\u6790\u8def\u5f84\uff08Windows \u4e0a 2100 \u4e2a\u4f1a\u8bdd\u7ea6\u4ece 1.2 \u79d2\u964d\u5230 0.4 \u79d2\uff09\u3002\u5173\u8054 #13176\u3002\n- \u7528\u91cf\u9875\u7684\u300c\u6bcf\u65e5\u660e\u7ec6\u300d\u73b0\u5728\u6700\u65b0\u4e00\u5929\u6392\u5728\u6700\u4e0a\u9762\uff0c\u4e0d\u7528\u518d\u6eda\u5230\u5e95\u624d\u80fd\u770b\u5230\u6700\u8fd1\u7684\u6570\u636e\u3002\u5173\u8054 #13179 fixed in #13182\u3002\n- \u6253\u5f00\u6587\u4ef6\u5931\u8d25\u65f6\u6309\u771f\u5b9e\u539f\u56e0\u63d0\u793a\uff1a\u53ea\u6709\u6587\u4ef6\u786e\u5b9e\u4e0d\u5b58\u5728\u624d\u8bf4\u201c\u627e\u4e0d\u5230\u6587\u4ef6\u201d\uff1b\u88ab\u8f6f\u94fe\u63a5\u6216\u6743\u9650\u62d2\u7edd\u7684\u6587\u4ef6\u4e0d\u518d\u88ab\u8bef\u62a5\u4e3a\u4e0d\u5b58\u5728\u3002\u5173\u8054 #13180\u3002\n- \u8f93\u5165 / \u5f39\u51fa\u547d\u4ee4\u5217\u8868\u66f4\u5feb\uff1a\u8865\u5168\u547d\u4ee4\u540d\u65f6\u4e0d\u518d\u6bcf\u6b21\u8bfb\u53d6\u63d2\u4ef6\u5305\u3001\u6a21\u578b\u548c\u8bb0\u5fc6\u6570\u636e\uff0c\u88c5\u4e86\u5927\u91cf\u63d2\u4ef6\u6280\u80fd\u65f6\u5c24\u5176\u660e\u663e\u3002\u5173\u8054 #13197\u3002\n- \u8f93\u5165 / \u6216 @ \u65f6\uff0c\u4e0a\u4e00\u4e2a\u6309\u952e\u8fd8\u6ca1\u8fd4\u56de\u7684\u8865\u5168\u8bf7\u6c42\u4f1a\u88ab\u53d6\u6d88\uff0c\u4e0d\u518d\u5806\u79ef\u5360\u6ee1\u8fde\u63a5\u3002\u5173\u8054 #13197\u3002\n- \u8bbe\u7f6e\u4e86\u63d0\u95ee\u8d85\u65f6\u540e\uff0c\u63d0\u95ee\u5361\u7247\u4f1a\u663e\u793a\u201cN \u79d2\u540e\u81ea\u52a8\u8df3\u8fc7\uff0c\u70b9\u4efb\u610f\u5904\u4fdd\u7559\u201d\u7684\u5012\u8ba1\u65f6\uff0c\u63a5\u7ba1\u540e\u6d88\u5931\uff1b\u547d\u4ee4\u884c\u754c\u9762\u540c\u6b65\u663e\u793a\u3002\u5173\u8054 #13210\u3002\n- \u5206\u652f\u82af\u7247\u533a\u5206\u201c\u4e0d\u662f Git \u4ed3\u5e93\u201d\u201cGit \u62d2\u7edd\u6253\u5f00\u201d\u201cGit \u6ca1\u6709\u53ca\u65f6\u54cd\u5e94\u201d\uff0c\u5e76\u663e\u793a Git \u7684\u539f\u8bdd\uff0c\u4e0d\u518d\u7edf\u4e00\u8bf4\u4e0d\u662f\u4ed3\u5e93\u3002\u5173\u8054 #13217\u3002\n- \u542f\u52a8\u65f6 Git \u6ca1\u53ca\u65f6\u54cd\u5e94\u4e0d\u518d\u8ba9\u5206\u652f\u82af\u7247\u6574\u573a\u4f1a\u8bdd\u90fd\u663e\u793a\u6ca1\u6709\u4ed3\u5e93\uff1a\u7b2c\u4e00\u6b21\u8bfb\u53d6\u65f6\u4f1a\u518d\u8bd5\u4e00\u6b21\u3002\u5173\u8054 #13217\u3002\n- \u6539\u8fdb\uff1a\u914d\u7f6e\u6587\u4ef6\u65e0\u6cd5\u8bfb\u53d6\u5bfc\u81f4\u8bbe\u7f6e\u6ca1\u4fdd\u5b58\u65f6\uff0c\u63d0\u793a\u4f1a\u6307\u5230\u300c\u8bbe\u7f6e\u300d\u91cc\u67e5\u770b\u51fa\u9519\u4f4d\u7f6e\u5e76\u4fee\u590d\uff0c\u5173\u8054 #13220\n- \u4f18\u5316\uff1a\u5207\u6362\u672c\u5730 Git \u5206\u652f\u6210\u529f\u540e\u7acb\u5373\u4f7f\u7528\u5207\u6362\u7ed3\u679c\u66f4\u65b0\u754c\u9762\uff0c\u53d8\u66f4\u5217\u8868\u5355\u72ec\u5237\u65b0\uff0c\u72b6\u6001\u6458\u8981\u7684\u4e09\u9879\u8bfb\u53d6\u5e76\u884c\u8fdb\u884c\u3002\u5173\u8054 #12780\u3002\n- \u6539\u8fdb\uff1a\u4f1a\u8bdd\u6807\u7b7e\u9875\u91cc\u6b63\u5728\u5de5\u4f5c\u7684\u4f1a\u8bdd\u72b6\u6001\u70b9\u4f1a\u547c\u5438\u95ea\u52a8\uff0c\u5df2\u5b8c\u6210\u672a\u8bfb\u4e5f\u76f4\u63a5\u7531\u8fd9\u4e2a\u70b9\u8868\u793a\uff08\u4e0d\u518d\u591a\u51fa\u4e00\u4e2a\u5c0f\u70b9\uff09\uff0c\u5173\u8054 #13254\n- \u6539\u8fdb\uff1a\u5e26 write_paths \u7684\u5b50\u4ee3\u7406\u8c03\u7528\u4e0d\u5141\u8bb8\u7684\u5de5\u5177\u65f6\uff0c\u62d2\u7edd\u539f\u56e0\u73b0\u5728\u8bf4\u660e\u7f18\u7531\u548c\u4e0b\u4e00\u6b65\uff08\u4e0d\u8981\u91cd\u8bd5\uff0c\u6539\u7528\u6587\u4ef6\u5de5\u5177\u6216\u6536\u5c3e\u6c47\u62a5\uff09\u3002\u5173\u8054 #13269\u3002\n- \u6539\u8fdb\uff1a\u538b\u7f29\u5b8c\u6210\u7684\u5361\u7247\u5728\u6298\u53e0\u540e\u4ecd\u5360\u7a97\u53e3\u5f88\u5927\u4e00\u5757\u65f6\uff0c\u4f1a\u8bf4\u660e\u5269\u4e0b\u7684\u662f\u4ec0\u4e48\uff08\u6a21\u578b\u56de\u590d\u3001\u5de5\u5177\u8f93\u51fa\u3001\u7528\u6237\u6d88\u606f\u5404\u591a\u5c11\uff0c\u6700\u5927\u7684\u4e00\u6761\u662f\u8c01\uff09\u3002\u5173\u8054 #13284\u3002\n- \u6539\u8fdb\uff1a\u66f4\u65b0\u4e0b\u8f7d\u5361\u4f4f\u65f6\uff0c\u7248\u672c\u9762\u677f\u4f1a\u8bf4\u660e\u201c\u5df2\u91cd\u8fde N \u6b21\u201d\uff1b\u91cd\u8fde\u4ecd\u65e0\u6548\u5219\u63d0\u793a\u4e0b\u8f7d\u5361\u4f4f\uff0c\u5e76\u7ed9\u51fa\u91cd\u8bd5\u6216\u624b\u52a8\u4e0b\u8f7d\u7684\u529e\u6cd5\u3002\u5173\u8054 #13291\u3002\n- \u6539\u53d8\uff1a\u8f93\u5165\u6846\u4e0b\u7684\u7f13\u5b58\u767e\u5206\u6bd4\u4e0d\u518d\u628a\u670d\u52a1\u5546\u672a\u533a\u5206\u7f13\u5b58\u7684\u8f93\u5165\u7b97\u4f5c\u672a\u547d\u4e2d\uff0c\u4e0e\u4f1a\u8bdd\u6982\u89c8\u540c\u4e00\u53e3\u5f84\uff1b\u8fd9\u7c7b\u8f93\u5165\u591a\u7684\u4f1a\u8bdd\u8bfb\u6570\u66f4\u9ad8\u3002\u5173\u8054 #13297\u3002\n- \u6539\u8fdb\uff1a\u5bf9\u8bdd\u53f3\u4e0b\u89d2\u201c\u56de\u5230\u9876\u90e8/\u5e95\u90e8\u201d\u7684\u6309\u94ae\u66f4\u6de1\u66f4\u5c0f\uff0c\u6539\u4e3a\u5706\u89d2\u65b9\u5f62\u3001\u534a\u900f\u660e\u6d45\u5e95\uff0c\u4e0d\u518d\u662f\u6df1\u8272\u5706\u5f62\u3002\u5173\u8054 #13303 fixed in #13310\u3002\n- \u6539\u8fdb\uff1a\u7ed9\u201c\u989d\u5916\u53ef\u5199\u6587\u4ef6\u5939\u201d\u9009\u62e9\u6280\u80fd\u5b89\u88c5\u4f4d\u7f6e\u65f6\uff0c\u62d2\u7edd\u539f\u56e0\u73b0\u5728\u8bf4\u660e\u51fa\u8def\uff1a\u628a\u6280\u80fd\u6e90\u6587\u4ef6\u5939\u7528\u201c\u767b\u8bb0\u201d\u65b9\u5f0f\u5b89\u88c5\uff0c\u5e76\u5728\u6e90\u6587\u4ef6\u5939\u91cc\u4fee\u6539\u3002\u5173\u8054 #13311\u3002\n\n## \u4fee\u590d\n\n- \u4fee\u590d\u8d85\u957f\u4f1a\u8bdd\u91cc\u81ea\u52a8\u538b\u7f29\u53cd\u590d\u653e\u5f03\u7684\u95ee\u9898\uff1a\u6458\u8981\u6a21\u578b\u6ca1\u770b\u5230\u7684\u6539\u52a8\u4e0d\u518d\u88ab\u5f53\u6210\u300c\u6458\u8981\u4e22\u4e86\u5168\u90e8\u6539\u52a8\u300d\uff0c\u7531\u7cfb\u7edf\u8865\u8bb0\u540e\u6b63\u5e38\u6298\u53e0\u3002\u5173\u8054 #13013\u3002\n- \u4fee\u590d\uff1a\u91cd\u547d\u540d\u6216\u590d\u5236\u7684\u6587\u4ef6\u5728 Git \u53d8\u66f4\u91cc\u7684\u65b0\u589e/\u5220\u9664\u884c\u6570\u73b0\u5728\u80fd\u6b63\u786e\u7edf\u8ba1\u3002\u5173\u8054 #13175 by @kevin9327\u3002\n- \u4fee\u590d\u9f20\u6807\u79fb\u5411\u72b6\u6001\u680f\u91cc\u7684\u4e0a\u4e0b\u6587\u6d6e\u7a97\u65f6\u5b83\u7acb\u523b\u6d88\u5931\u3001\u5bfc\u81f4\u70b9\u4e0d\u5230\u300c\u7acb\u5373\u538b\u7f29\u300d\u548c\u300c\u7ba1\u7406 MCP\u300d\u7684\u95ee\u9898\uff08\u6d6e\u7a97\u4e0e\u89e6\u53d1\u5904\u4e4b\u95f4\u7684\u7a7a\u9699\u73b0\u5728\u4f1a\u4fdd\u6301\u60ac\u505c\uff09\u3002\u5173\u8054 #13178 fixed in #13181\u3002\n- \u4fee\u590d\uff1a\u8bbe\u7f6e\u4e86\u58c1\u7eb8\u65f6\uff0c\u6807\u7b7e\u680f\u4e0b\u6cbf\u4e0d\u518d\u662f\u4e00\u6761\u751f\u786c\u7684\u6a2a\u7ebf\uff0c\u800c\u662f\u5411\u4e0b\u67d4\u548c\u6e10\u9690\uff0c\u5173\u8054 #13194 fixed in #13198\n- \u4fee\u590d\uff1a\u5df2\u8fc7\u671f\u7684\u7f6e\u9876\u8bb0\u5fc6\u4e0d\u518d\u8fdb\u5165\u7a33\u5b9a\u524d\u7f00\u3001\u4e0d\u518d\u906e\u853d\u5168\u5c40\u6307\u5f15\u3001\u4e5f\u4e0d\u518d\u5360\u7528\u7f6e\u9876\u5b57\u6570\u9884\u7b97\u3002\u5173\u8054 #13201 by @chuiwenwei\u3002\n- \u4fee\u590d\uff1a\u5173\u95ed\u4e00\u4e2a\u5185\u6838\u91cc\u5df2\u4e0d\u5b58\u5728\u7684\u4f1a\u8bdd\u7a97\u683c\u65f6\u4e0d\u518d\u5f39\u51fa \u201cno runtime r1\u201d\uff0c\u6309\u5df2\u5173\u95ed\u5904\u7406\uff0c\u5173\u8054 #13204 fixed in #13208\n- \u4fee\u590d\uff1a\u7535\u8111\u5d29\u6e83\u540e\u4f1a\u8bdd\u68c0\u67e5\u70b9\u7684\u6700\u540e\u4e00\u884c\u5199\u4e86\u4e00\u534a\u65f6\uff0c\u4e0d\u518d\u4e22\u6389\u5176\u4f59\u5b8c\u597d\u7684\u5bf9\u8bdd\u8f6e\u6b21\u3002\u5173\u8054 #13241 by @chuiwenwei\u3002\n- \u4fee\u590d\u5bf9\u8bdd\u680f\u53d8\u7a84\u65f6\u8f93\u5165\u6846\u5de5\u5177\u680f\uff08\u6a21\u578b\u3001\u601d\u8003\u5f3a\u5ea6\u3001\u505c\u4e0b\u6309\u94ae\uff09\u6298\u6210\u4e24\u884c\u9519\u4f4d\u7684\u95ee\u9898\uff1a\u73b0\u5728\u59cb\u7ec8\u4fdd\u6301\u4e00\u884c\uff0c\u653e\u4e0d\u4e0b\u65f6\u6a21\u578b\u540d\u5148\u7f29\u7565\u3002\u5173\u8054 #13259\u3002\n- \u4fee\u590d\uff1a\u8bbe\u7f6e\u4e86\u72ec\u7acb\u7684 REASONIX_HOME \u65f6\uff0c\u914d\u7f6e\u7f16\u8f91\u9501\u4e0d\u518d\u5199\u5230\u7cfb\u7edf\u9ed8\u8ba4\u7684 ~/.reasonix\uff0c\u4fdd\u6301\u72ec\u7acb\u76ee\u5f55\u81ea\u5305\u542b\u3002\u5173\u8054 #13275\u3002\n- \u4fee\u590d\uff1a\u7a97\u53e3\u622a\u56fe\u7684\u5bf9\u8bdd\u6846\u5df2\u7ecf\u5173\u95ed\u65f6\uff0c\u622a\u56fe\u6d41\u7a0b\u4f1a\u5b89\u9759\u505c\u6b62\uff0c\u4e0d\u518d\u62a5\u201cwindow is not defined\u201d\u7c7b\u9519\u8bef\u3002\u5173\u8054 #13285\u3002\n- \u4fee\u590d\uff1a\u300c\u6062\u590d\u65e7\u4f1a\u8bdd\u300d\u73b0\u5728\u80fd\u5bfc\u5165 1.x \u684c\u9762\u7248\u65b0\u5b58\u50a8\uff08desktop-sessions-v5\uff09\u91cc\u7684\u4f1a\u8bdd\uff0c\u6b64\u524d\u5b83\u4eec\u88ab\u6084\u6084\u8df3\u8fc7\uff1b\u65e0\u6cd5\u4f7f\u7528\u7684\u7f16\u53f7\u4f1a\u5217\u5165\u201c\u672a\u5bfc\u5165\u201d\u3002\u5173\u8054 #13290 fixed in #13296\u3002\n- \u4fee\u590d\uff1a\u9879\u76ee\u83dc\u5355\u91cc\u7684\u201c\u6587\u4ef6\u7ba1\u7406\u5668\u201d\u201c\u7ec8\u7aef\u201d\u73b0\u5728\u663e\u793a\u4e2d\u6587\uff0c\u4e14\u201c\u7528\u6587\u4ef6\u7ba1\u7406\u5668\u6253\u5f00\u201d\u4e0d\u518d\u4e0e\u201c\u5728\u6587\u4ef6\u7ba1\u7406\u5668\u4e2d\u663e\u793a\u201d\u91cd\u590d\u3002\u5173\u8054 #13292 fixed in #13298\u3002\n- \u4fee\u590d\uff1a\u6539\u52a8\u8303\u56f4\u65e0\u6cd5\u786e\u8ba4\u65f6\uff0c\u7ed3\u675f\u524d\u7684\u63d0\u793a\u4f1a\u8bf4\u660e\u68c0\u67e5\u89e3\u51b3\u4e0d\u4e86\u5b83\uff0c\u8981\u6362\u7528\u4f1a\u62a5\u544a\u8def\u5f84\u7684\u5de5\u5177\u91cd\u505a\u3002\u5173\u8054 #13293\u3002\n- \u4fee\u590d\uff1a\u6253\u5f00\u4f1a\u8bdd\u65f6\uff0c\u4e4b\u524d\u4fdd\u5b58\u7684\u538b\u7f29\u7ed3\u679c\u82e5\u56e0\u5386\u53f2\u53d8\u5316\u6216\u6a21\u578b/\u5de5\u4f5c\u533a\u4e0d\u540c\u800c\u65e0\u6cd5\u590d\u7528\uff0c\u73b0\u5728\u4f1a\u63d0\u793a\u539f\u56e0\uff0c\u4e0d\u518d\u6084\u6084\u6539\u53d1\u5b8c\u6574\u5386\u53f2\u3002\u5173\u8054 #13295\u3002\n- \u4fee\u590d\uff1aWindows \u4e0a\u505c\u6b62\u4efb\u52a1\u65f6\uff0c\u5982\u679c\u7cfb\u7edf\u7684 taskkill \u5361\u4f4f\uff0c\u6574\u4e2a\u201c\u505c\u6b62\u201d\u4e0d\u518d\u88ab\u5b83\u65e0\u9650\u671f\u62d6\u4f4f\uff1a\u6700\u591a\u7b49 10 \u79d2\uff0c\u4e4b\u540e\u76f4\u63a5\u7ed3\u675f\u4e3b\u8fdb\u7a0b\u3002\u5173\u8054 #13299\u3002\n- \u4fee\u590d\uff1a\u9876\u90e8\u7684\u8ba1\u5212\u6309\u94ae\u4e0d\u518d\u505c\u5728\u6807\u7b7e\u884c\u4e2d\u95f4\uff0c\u800c\u662f\u9760\u53f3\u7d27\u6328\u201c\u8f85\u52a9\u4f1a\u8bdd\u201d\u3002\u5173\u8054 #13302 fixed in #13307\u3002\n- \u4fee\u590d\uff1a\u505c\u6b62\u540e\u628a\u540c\u4e00\u53e5\u8bdd\u518d\u53d1\u4e00\u6b21\uff0c\u4e0d\u518d\u5728\u5f85\u53d1\u961f\u5217\u91cc\u53e0\u51fa\u591a\u4efd\uff1b\u539f\u6765\u672a\u751f\u6548\u7684\u90a3\u6761\u88ab\u91cd\u65b0\u6392\u961f\uff0c\u6062\u590d\u540e\u53ea\u4f1a\u56de\u7b54\u4e00\u6b21\u3002\u5173\u8054 #13318\u3002\n- \u4fee\u590d\uff1a\u505c\u6b62\u540e\u53f0\u4efb\u52a1\u540e\uff0c\u53f3\u4e0b\u89d2\u7684\u4efb\u52a1\u5217\u8868\u4f1a\u7acb\u5373\u5237\u65b0\uff1b\u5bf9\u5df2\u5728\u505c\u6b62\u4e2d\u7684\u4efb\u52a1\u518d\u70b9\u505c\u6b62\uff0c\u4f1a\u8bf4\u660e\u201c\u5df2\u8bf7\u6c42\u505c\u6b62\uff0c\u8fdb\u7a0b\u8fd8\u6ca1\u9000\u51fa\u201d\uff0c\u4e0d\u518d\u8bef\u62a5\u201c\u5df2\u7ecf\u4e0d\u5728\u8fd0\u884c\u201d\u3002\u5173\u8054 #13319\u3002\n- \u4fee\u590d\uff1a\u4ece\u6e90\u6587\u4ef6\u5939\u66f4\u65b0\u6280\u80fd\u540e\uff0c\u8bb0\u5f55\u5199\u5165\u5931\u8d25\u4f1a\u81ea\u52a8\u91cd\u8bd5\u4e00\u6b21\uff1b\u4ecd\u5931\u8d25\u65f6\u518d\u70b9\u4e00\u6b21\u66f4\u65b0\u5373\u53ef\u8865\u4e0a\u8bb0\u5f55\uff0c\u6280\u80fd\u4e0d\u518d\u88ab\u8bef\u5224\u4e3a\u201c\u526f\u672c\u88ab\u6539\u8fc7\u201d\u3002\u5173\u8054 #13311\u3002\n- \u4fee\u590d\uff1a\u5bf9\u8bdd\u53f3\u4e0b\u89d2\u201c\u56de\u5230\u4f1a\u8bdd\u9876\u90e8/\u8df3\u5230\u6700\u65b0\u201d\u6309\u94ae\u4e00\u6b21\u70b9\u51fb\u76f4\u8fbe\u4e24\u7aef\uff1b\u539f\u6765\u7684\u201c\u9010\u4e2a\u5c55\u5f00\u5757\u201d\u8df3\u6cd5\u6539\u4e3a\u6309\u4f4f Shift \u70b9\u51fb\u3002\u5173\u8054 #13326\u3001#13229\u3002\n- \u4fee\u590d\uff1a\u4f1a\u8bdd\u6982\u89c8\u91cc\u540c\u4e00\u884c\u7684\u6570\u5b57\u6309\u540c\u4e00\u9ad8\u5ea6\u5bf9\u9f50\uff0c\u4e0d\u518d\u56e0\u65c1\u8fb9\u683c\u7684\u811a\u6ce8\u8f83\u957f\u800c\u4e0b\u6c89\u3002\u5173\u8054 #13297\u3002\n- \u4fee\u590d\uff1a\u540c\u4e00\u4e2a Git \u4ed3\u5e93\u4e0b\u7684\u591a\u4e2a\u9879\u76ee\u4e92\u76f8\u7b49\u5f85\u5199\u5165\u65f6\uff0c\u63d0\u793a\u73b0\u5728\u8bf4\u660e\u5b83\u4eec\u5171\u7528\u8be5\u4ed3\u5e93\u8fd9\u4e00\u4e2a\u5199\u5165\u57df\uff0c\u5e76\u7ed9\u51fa\u51fa\u8def\u3002\u5173\u8054 #13335\u3002\n\n## \u8d21\u732e\u8005\n\n\u611f\u8c22\u672c\u7248\u672c\u7684\u8d21\u732e\u8005\uff1a@kevin9327\u3001@chuiwenwei\n\n---\n\n<!-- lang:en -->\n\nThis release adds a session overview, updating skills from their source folder, update notifications, per-model prices and an optimistic sub-agent write mode, and fixes stuck Stop, background-job state, projects in one repository waiting on each other and compaction recovery.\n\n## New\n\n- \"My feedback\" gains an \"Account link\": once signed in, link this computer yourself and unlink any time. Off by default, changes no limits. Refs #13141.\n- New \"Branch from the latest reply\" in the session menu: a running conversation can branch from its latest finished reply, and older replies' branch buttons work mid-run. Refs #13177.\n- Added: the sidebar session menu now has Auto name, which generates and saves a title in one step without opening Rename first, refs #13195 fixed in #13199\n- Added: Settings \u203a Conversation folding \u203a Thinking gains \"Folded, with first sentence\", showing the first sentence after a folded thought (long ones end in \u2026). Default unchanged. Refs #13212.\n- Added: a hosted Studio page left open across an upgrade now says it is not the latest build and offers a refresh, instead of failing with errors like n.filter, refs #13213 fixed in #13218\n- Added: deleting a conversation that has recovery copies now offers to delete the copies with it, instead of one by one, refs #13221 fixed in #13225\n- Added: the file window has an \"open the project in another program\" menu (VS Code, terminal and the other programs installed here), refs #13227\n- Added: built-in browser tabs can be renamed by double-clicking, instead of always showing the address, refs #13228 fixed in #13267\n- Added: on Windows, \"point at an executable\" takes launcher arguments (for example wsl.exe -d <distro> -- /bin/bash), verified by running them before saving. Refs #13247.\n- Added: the file window in the right sidebar has a \"show this file in the system file manager\" button in its toolbar, so you no longer need the file list right-click, refs #13255\n- Added: replies to feedback can carry screenshots (paste or pick, up to 3); they go to the maintainers only, who decide whether to make them public. Refs #13258.\n- Added: an isolated workspace copy can be created from a chosen branch, and an unknown branch is reported clearly. Refs #13271.\n- Added: an optimistic mode for sub-agent write scope in Settings (off by default): a sub-agent with no write_paths no longer holds the whole workspace. Refs #13274.\n- Added: the connection editor takes a per-model price (input, output, cache hit, currency); a model with no price still shows as unknown in usage. Refs #13276.\n- Added: Settings, Version, \"Update mode\". Manual (default) does nothing in the background; Notify checks daily and dots the Settings icon. Neither downloads, installs or restarts. Refs #13291.\n- Added: the cache figure under the composer opens a session overview: requests, tokens, cache hit, work time, cost, by source, each with its definition; incomplete cost shows a floor. Refs #13297.\n- Added: the session overview shows the context window: used, capacity, share by kind and the fold line, stated as a current reading, with a way into the context details. Refs #13297.\n- Added: the Skills list marks an installed skill copy that no longer matches the folder it came from: source changed, copy edited, both changed, or source gone. Refs #13311.\n- Added: a skill copied from a local folder can be updated from it in the Skills list: preview each file change (scripts must be opened), confirm; a failure keeps the old copy. Refs #13311.\n\n## Changed\n\n- The sidebar footer's \"Send feedback\" is now bold in the accent colour so it is easier to find (no animation; other feedback entries unchanged). Refs #13048.\n- MCP servers that answer a long tool call as a task are now followed to the result, instead of returning nothing or failing for lack of the tasks extension. Refs #13108.\n- An MCP task that outruns the tool's timeout now continues as a background job you can wait on, read with bash_output or cancel with kill_shell, instead of failing on the timeout. Refs #13108.\n- A skill's declared license, requirements (compatibility) and metadata can now be opened in the skills list; display only, nothing about how it runs changes. Refs #13110.\n- With many sessions the sidebar refreshes and renames faster: a refresh no longer resolves every session's path (2100 sessions on Windows: about 1.2 s to 0.4 s). Refs #13176.\n- The usage page's daily breakdown now lists the newest day first, so the latest figures are visible without scrolling to the bottom. Refs #13179 fixed in #13182.\n- Opening a file that fails now says why: only a file that is not there is reported as missing, and one behind a refused link or a permission error is no longer called \"not found\". Refs #13180.\n- Typing / opens the command list faster: completing a command name no longer reads plugin packages, models and memory on every keystroke, which matters most with many plugin skills. Refs #13197.\n- While typing / or @, a completion request a newer keystroke has made stale is cancelled instead of piling up on the connection pool. Refs #13197.\n- With an ask timeout set, the question card now counts down \"skipped in N s, click anywhere to keep it\" and stops once you take the question over; the terminal UI shows it too. Refs #13210.\n- The branch chip tells \"not a Git repository\" from \"Git refused to open it\" and \"Git did not respond\", and shows Git's own words. Refs #13217.\n- If Git does not answer when a session opens, the branch chip no longer says there is no repository for the whole session: the first read tries once more. Refs #13217.\n- Improved: when a setting is not saved because the config file does not parse, the message now points to Settings, where the broken line is shown and can be repaired, refs #13220\n- Improved: after a successful local Git branch switch, the UI uses the returned state at once and refreshes the change list on its own; the summary's three reads now overlap. Refs #12780.\n- Improved: the session tab dot breathes while a session is working, and finished-but-unread is shown by that same dot (no extra small dot), refs #13254\n- Improved: when a write_paths sub-agent calls a target it may not run, the refusal now says why and what to do next (do not retry; use file tools or report). Refs #13269.\n- Improved: when a fold still leaves a large share of the window, its card says what the rest is made of and which single message is the largest. Refs #13284.\n- Improved: when an update download goes quiet, the version panel says it reconnected N times, and if that fails says it got stuck, with a retry or manual installer. Refs #13291.\n- Changed: the cache percentage under the composer no longer counts prompt the provider did not split as uncached, matching the overview; sessions with much of it read higher. Refs #13297.\n- Improved: the jump-to-top/bottom buttons are lighter and smaller, rounded squares with a translucent pale fill instead of dark circles. Refs #13303 fixed in #13310.\n- Improved: granting the installed-skills folder as a writable folder now explains the way forward: install the skill's source folder in register mode and edit it there. Refs #13311.\n\n## Fixed\n\n- Fixed auto-compaction repeatedly giving up in very long sessions: changes the summarizer never saw are no longer treated as lost by it. Refs #13013.\n- Fixed: added and removed line counts are now correct for renamed and copied files in the Git changes. Refs #13175 by @kevin9327.\n- Fixed the status-bar context card closing as the pointer moved toward it, which made \"Compress now\" and \"Manage MCP\" unreachable; the gap now keeps the hover. Refs #13178 fixed in #13181.\n- Fixed: over a wallpaper the tab strip no longer ends on a hard line; it now fades softly into the conversation, refs #13194 fixed in #13198\n- Fixed: an expired pinned memory no longer rides the stable prefix, shadows live global guidance, or consumes the pinned-character budget. Refs #13201 by @chuiwenwei.\n- Fixed: closing a pane the kernel no longer holds no longer surfaces a raw \"no runtime r1\" error; it counts as closed, refs #13204 fixed in #13208\n- Fixed: when a crash leaves the last line of a session checkpoint half-written, the intact turns before it are no longer lost. Refs #13241 by @chuiwenwei.\n- Fixed the composer toolbar breaking into two misaligned lines when the conversation column is narrow: it stays on one line and the model name shortens first. Refs #13259.\n- Fixed: with an isolated REASONIX_HOME, config edit locks no longer go to the default ~/.reasonix; the isolated home stays self-contained. Refs #13275.\n- Fixed: the window capture now stops quietly when its dialog is already gone, instead of raising a \"window is not defined\" error. Refs #13285.\n- Fixed: \"Recover older sessions\" now imports 1.x desktop (desktop-sessions-v5) conversations, which were skipped silently; an unusable id is listed as skipped. Refs #13290 fixed in #13296.\n- Fixed: the project menu now shows \"File manager\" and \"Terminal\" in your language, and no longer lists the file manager twice. Refs #13292 fixed in #13298.\n- Fixed: when a change's extent is unknown, the end-of-turn prompt now says a check cannot settle it and to redo it with a path-reporting tool. Refs #13293.\n- Fixed: when a saved compaction cannot be reused on opening a session, a notice now says why instead of silently sending the full history. Refs #13295.\n- Fixed: on Windows a hung taskkill no longer holds a Stop forever; it is given 10 seconds, after which the main process is ended directly. Refs #13299.\n- Fixed: the plan button in the tab row now sits at the right edge beside the side-question toggle instead of floating mid-row. Fixes #13302 fixed in #13307.\n- Fixed: after a stop, sending the same words again no longer stacks copies in the held queue; the steer that did not apply is requeued, so once released it is answered once. Refs #13318.\n- Fixed: after stopping a background job the task list refreshes at once, and stopping one already shutting down says so instead of claiming it is not running. Refs #13319.\n- Fixed: a failed record write after a skill update is retried once; if it still fails, updating again repairs the record instead of leaving the skill marked edited. Refs #13311.\n- Fixed: the jump-to-top and jump-to-latest buttons now go straight to the ends in one click; the old step through expanded blocks is Shift+click. Refs #13326, #13229.\n- Fixed: in the session overview, figures on one row now share a baseline instead of sinking when the neighbouring cell's footnote is longer. Refs #13297.\n- Fixed: when projects under one Git repository wait on each other to write, the notice now says they share that repository's single write domain, and how to avoid it. Refs #13335.\n\n## Contributors\n\nThanks to this release's contributors: @kevin9327, @chuiwenwei\n\n## What's Changed\n* fix(gitstatus): count lines on renamed and copied paths by @kevin9327 in https://github.com/esengine/DeepSeek-Reasonix/pull/13175\n* fix(studio): keep the context card open while the pointer crosses to it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13181\n* fix(studio): list the newest day first in the daily usage table by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13182\n* fix(serve): a file that cannot be opened is not reported as missing by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13183\n* feat(studio): branch a conversation from its latest finished reply while it runs by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13185\n* perf(serve): do not canonicalise every listed session path in /tree by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13186\n* fix(control): refuse a running-turn branch whose recorded boundary names another prompt by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13187\n* test(serve): the trace fixtures do not compare two more measured clocks by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13189\n* fix(studio): draw the sidebar's feedback entry in the accent colour by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13192\n* feat(skill): read and show the specification's license, compatibility and metadata by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13190\n* feat(mcp): follow a tool call the server answers as a task to its result by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13193\n* fix(studio): fade the tab strip's lower edge over a wallpaper by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13198\n* feat(mcp): continue a task that outran its timeout as a background job by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13202\n* feat(studio): auto-name a session from the sidebar menu by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13199\n* perf(control): completing a command name reads no package, config or memory data by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13205\n* fix(memory): identify the cross-scope name refusal and hand back both ids by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13200\n* perf(studio): abandon a completion request a newer keystroke has made stale by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13207\n* fix(mcp): promoted task jobs do not hold the inline task slots by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13206\n* fix(serve): closing a runtime the hub no longer holds is typed, and the port treats it as closed by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13208\n* perf(control): completing command arguments loads each config once by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13209\n* test(serve): budget the plugin package parses a hot endpoint may cost by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13211\n* fix(git): say why a folder with a .git has no repository identity by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13222\n* fix(studio): a refused settings save says where to see and repair the broken config by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13223\n* fix(git): give a session whose git did not answer one second attempt at its repository by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13226\n* fix(memory): re-check a delivered fact by reading its own file, not its stat by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13203\n* feat(studio): deleting a conversation can take its recovery copies along by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13225\n* perf(studio): reduce latency after selecting a Git branch by @par73e in https://github.com/esengine/DeepSeek-Reasonix/pull/13234\n* feat(feedback): link an install to the signed-in account only when the person asks by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13243\n* ci: let a push to studio finish instead of cancelling the run before it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13224\n* feat(ask): show the countdown to an ask-timeout skip and stop it when the question is taken over by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13216\n* fix(agent): do not refuse a fold for changes the summarizer was never shown by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13256\n* feat(studio): a hosted page left open across a deploy says it is not the latest build by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13218\n* fix(studio): keep the composer toolbar on one line in a narrow conversation column by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13266\n* feat(studio): the working session's tab dot breathes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13257\n* feat(feedback): replies can carry screenshots by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13270\n* feat(worktree): create an isolated copy from a chosen branch by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13271\n* feat(studio): show the open file in the file manager from its toolbar by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13263\n* fix(agent): say why a write_paths sub-agent may not run a capability, and what to do by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13272\n* fix(config): keep config edit locks inside an isolated Reasonix home by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13279\n* feat(studio): optional first-sentence preview beside folded thinking by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13280\n* feat(delegation): optimistic claims for sub-agents that declare no write_paths by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13281\n* fix(memory): keep expired facts out of pinned guidance by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13201\n* feat(studio): open the project in other programs from the file panel by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13265\n* test(boot): write the optimistic-claims test's user config where the platform reads it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13283\n* fix(studio): stop the window capture quietly when its dialog is already gone by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13285\n* feat(compaction): say what a fold still leaves behind when it is a large share of the window by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13289\n* fix(context-retrieval): stop scoring runs that never produced a transcript by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13238\n* fix(sessionstore): keep the turns a torn checkpoint still decodes by @chuiwenwei in https://github.com/esengine/DeepSeek-Reasonix/pull/13241\n* fix(sessionstore): import 1.x Desktop sessions whose ids are 24 digits by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13296\n* fix(agent): tell the turn what discharges a change the host could not read by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13300\n* feat(shell): launcher arguments for a pinned shell (wsl.exe -d <distro> -- /bin/bash) by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13277\n* feat(feedback-sync): bring a mirrored reply comment up to date when its images change by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13287\n* fix(studio): translate the open-with names and drop the duplicate file manager entry by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13298\n* fix(update): say when a download stalls and keeps stalling by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13306\n* feat(providers): per-model price entry in the connection editor by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13282\n* fix(studio): keep the plan chip at the right edge of the tab row by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13307\n* test(openai): cancelling ends a stream wherever the gateway goes silent by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13308\n* test(migration): 24-digit by-id sessions import beside empty legacy markers by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13309\n* fix(studio): quieter jump-to-top/bottom buttons by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13310\n* fix(config): the skills folder refuses a write grant with its own identity and the way forward by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13315\n* docs(guide): list the rewind picker's partial-coverage confirmation by @xxoingr in https://github.com/esengine/DeepSeek-Reasonix/pull/13314\n* docs(release-notes): fragments for four merged changes that had none by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13316\n* feat(update): an update mode setting, with a background notify tier by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13313\n* feat(skills): remember where an installed skill came from, and say whether it is still in step by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13317\n* feat(skills): update an installed skill from its source folder, after previewing the change by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13321\n* fix(jobs): say when a background job's stop is already under way, and refresh the list after a refused stop by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13322\n* fix(skills): retry a failed update record and let the next update heal it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13324\n* feat(studio): rename a built-in browser tab by double-clicking it by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13267\n* fix(inbox): the same words sent again while the first copy waits are not another item by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13325\n* fix(proc): bound the taskkill a Windows stop depends on by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13323\n* fix(studio): the jump buttons go straight to the ends; Shift+click steps through expanded blocks by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13327\n* feat(serve): /status carries the session's usage by source, from the cost ledger by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13328\n* test(plugin): wait for the registry swap, not just the server by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13329\n* feat(studio): a session overview behind the cache meter, each figure beside what it counts by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13330\n* test(studio): scope the context-card hover guard to the context anchor by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13331\n* feat(studio): the context window in the session overview by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13332\n* docs(release-notes): fragments for the expired-pin fix and the branch-switch latency by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13333\n* fix(studio): overview figures on one row share a baseline by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13334\n* fix(control): say why a saved fold was not reused when a session is opened by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13336\n* fix(workspacelease): say which git repository folds two folders into one write domain by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13337\n* docs(release): Studio 2.42.0 notes by @esengine in https://github.com/esengine/DeepSeek-Reasonix/pull/13339\n\n## New Contributors\n* @kevin9327 made their first contribution in https://github.com/esengine/DeepSeek-Reasonix/pull/13175\n\n**Full Changelog**: https://github.com/esengine/DeepSeek-Reasonix/compare/studio-v2.41.0...studio-v2.42.0\n\n\n---\n\n**macOS** \u5df2\u7528 Developer ID \u7b7e\u540d\u5e76\u516c\u8bc1\uff0c\u6253\u5f00\u65f6\u4e0d\u9700\u8981\u6e05\u9664\u9694\u79bb\u5c5e\u6027\u3002**Windows** \u7684\u7a97\u53e3\u3001\u5185\u6838\u4e0e\u5b89\u88c5\u5668\u90fd\u7ecf Certum \u4ee3\u7801\u7b7e\u540d\u8bc1\u4e66\u505a\u4e86 Authenticode \u7b7e\u540d\u3002**Linux** Debian \u7cfb\u4ece `.deb` \u5b89\u88c5\uff0cFedora\u3001RHEL\u3001openSUSE \u7b49\u4ece `.rpm` \u5b89\u88c5\uff08`sudo dnf install ./ReasonixStudio-linux-amd64.rpm`\uff09\u3002x86_64 \u7528\u6587\u4ef6\u540d\u5e26 amd64 \u