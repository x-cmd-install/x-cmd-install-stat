"node_id":"RA_kwDOM1jsIM4cD01P","name":"cargo-seek-v0.2.0-macos-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2359509,"digest":"sha256:b4f800f9cb7eb08d523a16829132b4b4cfa2319e875913d93cbe2bbf98f3b6ed","download_count":1,"created_at":"2026-07-08T23:08:25Z","updated_at":"2026-07-08T23:08:26Z"},{"id":470764882,"node_id":"RA_kwDOM1jsIM4cD01S","name":"cargo-seek-v0.2.0-windows-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2139589,"digest":"sha256:5d53286781c7d18238c7391a71e8b70dd3dae8c1d3c022000e254440f25d7828","download_count":1,"created_at":"2026-07-08T23:08:25Z","updated_at":"2026-07-08T23:08:26Z"},{"id":470764881,"node_id":"RA_kwDOM1jsIM4cD01R","name":"cargo-seek-v0.2.0-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2245137,"digest":"sha256:783ec0cde31d3f45055229bc757d8b1f871b2865904d58e0f2dd6f102a6ae4bb","download_count":1,"created_at":"2026-07-08T23:08:25Z","updated_at":"2026-07-08T23:08:26Z"}],"body":"**If you like the project, please star the repo :star2:!**\r\n\r\n### Added\r\n\r\n- Feature-flag support: a crate's features are shown in the details pane and can be\r\n  selected when adding or installing, building the matching `cargo add` / `cargo install`\r\n  command (passing `--no-default-features` when a default feature is unchecked).\r\n- Confirmation prompt before removing or uninstalling a crate.\r\n- Enhanced the details pane to show more info like features, version history, license, size, MSRV, releases, yank\r\n  markers and more...\r\n- Key commands now work while the Help screen is open.\r\n- Prebuilt binaries for Linux (arm64) and Windows (arm64).\r\n\r\n### Changed\r\n\r\n- Default search scope is now \"All\".\r\n- The crate details pane is larger and scrollable.\r\n- Cargo operations run off the UI event loop, so the interface stays responsive while\r\n  adding, removing, installing, or uninstalling.\r\n- Cargo commands target the correct manifest and are guarded by the crate's current state.\r\n- Upgraded the ratatui UI stack to 0.30.\r\n- Modernized dependencies and overhauled error handling.\r\n- Component-update failures are now non-fatal.\r\n- Better status bar notifications\r\n- Switched TLS to rustls with the OS trust store plus bundled roots, dropping the runtime dependency on system OpenSSL.\r\n- Linux binaries are now statically linked (musl), so they run on any distribution regardless of glibc version.\r\n\r\n### Fixed\r\n\r\n- Search pagination no longer exceeds crates.io's serving limits.\r\n- Pagination underflow on page 0.\r\n- Button focus no longer switches unintuitively when some buttons are hidden.\r\n- Help screen scrolling is bounded to the actual content height.\r\n- Hardened color/style and config parsing against malformed input.\r\n\r\n## New Contributors\r\n* @jarjk made their first contribution in https://github.com/tareqimbasher/cargo-seek/pull/6\r\n\r\n**Full Changelog**: https://github.com/tareqimbasher/cargo-seek/compare/v0.1.0...v0.2.0","mentions_count":1}
