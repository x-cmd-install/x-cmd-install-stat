) |\n| [@stan-lei](https://github.com/stan-lei) | [#549](https://github.com/SaladDay/cc-switch-cli/pull/549), [#553](https://github.com/SaladDay/cc-switch-cli/issues/553) |\n| [@SunriseOrient](https://github.com/SunriseOrient) | [#135](https://github.com/SaladDay/cc-switch-cli/pull/135) |\n| [@Super-Dian](https://github.com/Super-Dian) | [#554](https://github.com/SaladDay/cc-switch-cli/issues/554) |\n| [@tao-deng](https://github.com/tao-deng) | [#498](https://github.com/SaladDay/cc-switch-cli/pull/498) |\n| [@usufu](https://github.com/usufu) | [#540](https://github.com/SaladDay/cc-switch-cli/issues/540) |\n| [@Xiao-Maker-droid](https://github.com/Xiao-Maker-droid) | [#527](https://github.com/SaladDay/cc-switch-cli/pull/527) |\n| [@xiaoma404](https://github.com/xiaoma404) | [#538](https://github.com/SaladDay/cc-switch-cli/pull/538) |\n| [@xuyinkui](https://github.com/xuyinkui) | [#8](https://github.com/SaladDay/cc-switch-cli/issues/8) |\n| [@ycwfs](https://github.com/ycwfs) | [#537](https://github.com/SaladDay/cc-switch-cli/issues/537) |\n| [@zczsyqxl](https://github.com/zczsyqxl) | [#542](https://github.com/SaladDay/cc-switch-cli/issues/542), [#543](https://github.com/SaladDay/cc-switch-cli/issues/543) |\n| [@zydo](https://github.com/zydo) | [#403](https://github.com/SaladDay/cc-switch-cli/issues/403), [#533](https://github.com/SaladDay/cc-switch-cli/issues/533), [#534](https://github.com/SaladDay/cc-switch-cli/pull/534), [#544](https://github.com/SaladDay/cc-switch-cli/pull/544), [#548](https://github.com/SaladDay/cc-switch-cli/pull/548) |\n\nThanks also to IPWO and our other sponsors, everyone supporting and using the project, and the CC-Switch maintainers and contributors whose upstream work underpins these improvements.\n\n## Install or update\n\nRun `cc-switch update`, or use `brew upgrade cc-switch-cli` for Homebrew installations once the formula is updated. Platform packages and the installer are available below:\n\n```bash\ncurl -fsSL https://github.com/SaladDay/cc-switch-cli/releases/latest/download/install.sh | bash\n```\n\n[Full comparison](https://github.com/SaladDay/cc-switch-cli/compare/v5.11.3...v5.11.4)\n\n\n## What's Changed\n* fix(tui): align managed Codex OAuth quota with upstream by @zydo in https://github.com/SaladDay/cc-switch-cli/pull/534\n* fix(codex): preserve provider authentication in forms by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/535\n* fix(claude): align configuration editing with upstream by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/536\n* fix(presets): refresh provider model templates to current lineups by @zydo in https://github.com/SaladDay/cc-switch-cli/pull/548\n* fix(proxy): keep mid-conversation system messages in place for prefix cache by @Xiao-Maker-droid in https://github.com/SaladDay/cc-switch-cli/pull/527\n* fix(codex): omit unsupported MCP type field from generated TOML by @RGB-loop in https://github.com/SaladDay/cc-switch-cli/pull/512\n* fix(codex): bind managed ChatGPT accounts to official providers by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/550\n* fix(proxy): emit response.incomplete for incomplete Codex responses by @RGB-loop in https://github.com/SaladDay/cc-switch-cli/pull/551\n* fix(sessions): allow Windows snapshot publication and cleanup by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/552\n* fix(claude): align proxy placeholder authentication with upstream by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/556\n* fix(database): support upstream schemas 23–26 for sync restore by @stan-lei in https://github.com/SaladDay/cc-switch-cli/pull/549\n* fix(tui): exit when the input terminal hangs up by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/558\n* fix(webdav-sync): keep file symlink names in skills archives by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/559\n* docs: unify the blind review gate by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/560\n* docs: refine the blind review gate by @SaladDay in https://github.com/SaladDay/cc-switch-cli/pull/561\n\n## New Contributors\n* @zydo made their first contribution in https://github.com/SaladDay/cc-switch-cli/pull/534\n* @Xiao-Maker-droid made their first contribution in https://github.com/SaladDay/cc-switch-cli/pull/527\n* @RGB-loop made their first contribution in https://github.com/SaladDay/cc-switch-cli/pull/512\n* @stan-lei made their first contribution in https://github.com/SaladDay/cc-switch-cli/pull/549\n\n**Full Changelog**: https://github.com/SaladDay/cc-switch-cli/compare/v5.11.3...v5.11.4","mentions_count":5}
