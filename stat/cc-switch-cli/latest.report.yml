uploaded","size":7907966,"digest":"sha256:cfafaa7e0070d5f2498c14c427639f3473c6a17eb0fc7e1d1d79d7950421288a","download_count":89,"created_at":"2026-11-17T08:09:34Z","updated_at":"2026-11-17T08:09:35Z"},{"id":758191066,"node_id":"RA_kwDOQbUM0c4tMRPa","name":"cc-switch-cli-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7907966,"digest":"sha256:cfafaa7e0070d5f2498c14c427639f3473c6a17eb0fc7e1d1d79d7950421288a","download_count":181,"created_at":"2026-11-17T08:09:34Z","updated_at":"2026-11-17T08:09:35Z"},{"id":758191065,"node_id":"RA_kwDOQbUM0c4tMRPZ","name":"checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1819,"digest":"sha256:18ab61acac4fa567b241b9643fb5922137da5ec2721c6c0166f4a5194be5e8b1","download_count":198,"created_at":"2026-11-17T08:09:34Z","updated_at":"2026-11-17T08:09:34Z"},{"id":758191058,"node_id":"RA_kwDOQbUM0c4tMRPS","name":"install.sh","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-sh","state":"uploaded","size":9449,"digest":"sha256:5036498ce7580d3c2aeb3353374a93f5266d2eeae55772ebf78425e0c51a5266","download_count":1510,"created_at":"2026-11-17T08:09:34Z","updated_at":"2026-11-17T08:09:34Z"},{"id":758191057,"node_id":"RA_kwDOQbUM0c4tMRPR","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":3376,"digest":"sha256:9878eb3abfb10aa4eb4ba48344929d78ae886152539d9e22dc89c8457ed9d6fb","download_count":1968,"created_at":"2026-11-17T08:09:34Z","updated_at":"2026-11-17T08:09:34Z"}],"body":"# CC Switch CLI v5.11.4\n\nThis release restores database compatibility with CC Switch desktop v4.0.33 (schema 26), adds managed ChatGPT account selection for Codex, and fixes configuration, proxy, session and terminal issues.\n\n## Added\n\n- **Codex / Official Accounts**: Select a managed ChatGPT account in the OpenAI Official provider form, or keep the native Codex login. Account activation preserves the previous native login and follows upstream credential ownership and refresh behavior. Includes [#550](https://github.com/SaladDay/cc-switch-cli/pull/550), fixing [#547](https://github.com/SaladDay/cc-switch-cli/issues/547).\n- **Sponsors**: Add IPWO to the sixth README sponsor position across the English, Chinese and Japanese documentation.\n\n## Changed\n\n- **Claude / Configuration Editing**: Edit the complete Claude configuration, saving provider fields to the provider record and global settings to the live configuration, with conflict handling for external changes. Legacy Claude common snippets remain readable but are no longer merged at runtime or newly written. Includes [#536](https://github.com/SaladDay/cc-switch-cli/pull/536), addressing [#530](https://github.com/SaladDay/cc-switch-cli/issues/530).\n- **Presets / Pricing**: Refresh bundled model templates, model capabilities and pricing seeds against upstream. Existing custom prices are preserved; historical built-in prices are repaired only when they still match known defaults. Includes [#548](https://github.com/SaladDay/cc-switch-cli/pull/548).\n\n## Fixed\n\n- **Database / Compatibility**: Support upstream database schemas 23 through 26 for local startup and WebDAV/S3 restore, including snapshots from CC Switch desktop v4.0.33. Preserve upstream MCP/Skills enablement flags and session parser state through migrations, edits and sync round-trips. Includes [#549](https://github.com/SaladDay/cc-switch-cli/pull/549), fixing [#553](https://github.com/SaladDay/cc-switch-cli/issues/553) and addressing [#564](https://github.com/SaladDay/cc-switch-cli/issues/564).\n- **WebDAV / Skills**: Preserve each file symlink's own name in skills archives, avoiding duplicate ZIP entries such as `CLAUDE.md -> AGENTS.md`. Directory cycle detection and outside-root restrictions remain intact. Includes [#559](https://github.com/SaladDay/cc-switch-cli/pull/559).\n- **TUI / Terminal Hangup**: Exit the Unix TUI when its terminal disconnects, preventing an input polling loop from consuming a CPU core. Normal connected-terminal exits still restore terminal state. Includes [#558](https://github.com/SaladDay/cc-switch-cli/pull/558), fixing [#555](https://github.com/SaladDay/cc-switch-cli/issues/555).\n- **Windows / Sessions**: Release child lock handles before publishing or retiring session snapshot directories, fixing `Access is denied (os error 5)` while preserving reader protection. Includes [#552](https://github.com/SaladDay/cc-switch-cli/pull/552), fixing [#542](https://github.com/SaladDay/cc-switch-cli/issues/542).\n- **Claude / Proxy Authentication**: Use `ANTHROPIC_AUTH_TOKEN` for ordinary proxy-route placeholders and clear stale `ANTHROPIC_API_KEY` values, avoiding custom-key confirmation and conflicting credential warnings. Includes [#556](https://github.com/SaladDay/cc-switch-cli/pull/556), fixing [#554](https://github.com/SaladDay/cc-switch-cli/issues/554).\n- **Proxy / Responses**: Emit `response.incomplete` for incomplete converted Codex responses and retain their usage and Chat history, so truncated turns are not reported as successful completions. Includes [#551](https://github.com/SaladDay/cc-switch-cli/pull/551), fixing [#546](https://github.com/SaladDay/cc-switch-cli/issues/546).\n- **Proxy / Prompt Caching**: Keep mid-conversation system messages in their original positions during Anthropic-to-Chat conversion, preserving stable prompt prefixes across turns. Includes [#527](https://github.com/SaladDay/cc-switch-cli/pull/527).\n- **Codex / Configuration**: Preserve explicit authentication settings and existing bearer credentials when editing provider forms. Omit the unsupported MCP `type` field from generated Codex TOML. Includes [#535](https://github.com/SaladDay/cc-switch-cli/pull/535) and [#512](https://github.com/SaladDay/cc-switch-cli/pull/512), addressing [#532](https://github.com/SaladDay/cc-switch-cli/issues/532) and [#496](https://github.com/SaladDay/cc-switch-cli/issues/496).\n- **Codex OAuth / Quotas**: Use the bound account's native quota query for managed OAuth providers and hide the conflicting generic usage-template control in the Claude provider form. Existing automatic and manual refresh behavior is preserved. Includes [#534](https://github.com/SaladDay/cc-switch-cli/pull/534), fixing [#533](https://github.com/SaladDay/cc-switch-cli/issues/533).\n\n## Upgrade notes\n\n- Upgrade all CLI devices and containers before sharing a schema-26 database. CLI v5.11.3 and earlier cannot open it. Existing pre-migration backups remain in place; databases newer than schema 26, including upstream development schema 27, are still rejected.\n- Database compatibility does not add CLI management for Oh My Pi, DeepSeek Harness, GitHub Copilot CLI or WorkBuddy.\n- Managed ChatGPT accounts are not supported by isolated launches (`start`, TUI temporary launch or `--shared-sessions`). Switch to the bound official provider first, then run `codex`.\n- Claude global settings should be edited through the complete configuration editor. Codex and Gemini common-snippet behavior is unchanged. Incomplete Codex responses can now surface a truncation or refusal error instead of silently completing.\n- Run `cc-switch update`, or use `brew upgrade cc-switch-cli` for Homebrew installations once the formula is updated.\n\n## Thanks\n\nThank you to everyone who opened an issue or pull request, shared diagnostics, reviewed code, or joined a discussion. The list below covers issues and pull requests active since v5.11.3, including earlier participants in those discussions and commit co-authors. Contributions that remain open or were not merged are included in these thanks, not in the release's feature list.\n\n| Contributor | Issues and pull requests |\n| --- | --- |\n| [@3aKHP](https://github.com/3aKHP) | [#496](https://github.com/SaladDay/cc-switch-cli/issues/496) |\n| [@Alemax067](https://github.com/Alemax067) | [#547](https://github.com/SaladDay/cc-switch-cli/issues/547) |\n| [@AloneAtWar](https://github.com/AloneAtWar) | [#135](https://github.com/SaladDay/cc-switch-cli/pull/135) |\n| [@AtaraxiaEpiphany](https://github.com/AtaraxiaEpiphany) | [#522](https://github.com/SaladDay/cc-switch-cli/pull/522) |\n| [@badcodebuilder](https://github.com/badcodebuilder) | [#554](https://github.com/SaladDay/cc-switch-cli/issues/554) |\n| [@bytemain](https://github.com/bytemain) | [#467](https://github.com/SaladDay/cc-switch-cli/pull/467) |\n| [@claude](https://github.com/claude) | [#551](https://github.com/SaladDay/cc-switch-cli/pull/551) |\n| [@CodeCatMeow](https://github.com/CodeCatMeow) | [#403](https://github.com/SaladDay/cc-switch-cli/issues/403) |\n| [@cxwx](https://github.com/cxwx) | [#526](https://github.com/SaladDay/cc-switch-cli/issues/526) |\n| [@Cyclonekid](https://github.com/Cyclonekid) | [#530](https://github.com/SaladDay/cc-switch-cli/issues/530) |\n| [@feicai922](https://github.com/feicai922) | [#516](https://github.com/SaladDay/cc-switch-cli/issues/516) |\n| [@fengyunzaidushi](https://github.com/fengyunzaidushi) | [#8](https://github.com/SaladDay/cc-switch-cli/issues/8), [#532](https://github.com/SaladDay/cc-switch-cli/issues/532) |\n| [@GalaxyKW](https://github.com/GalaxyKW) | [#514](https://github.com/SaladDay/cc-switch-cli/pull/514) |\n| [@GOTOgxy](https://github.com/GOTOgxy) | [#564](https://github.com/SaladDay/cc-switch-cli/issues/564) |\n| 