ublic","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":969836,"digest":"sha256:6cf6df8927cdb4989d273e809bc88119ab685d3edf247acfdfebeb63eca2591d","download_count":5,"created_at":"2026-09-10T13:33:01Z","updated_at":"2026-09-10T13:33:01Z"},{"id":555082981,"node_id":"RA_kwDORXJDbs4hFeTl","name":"SHA256SUMS","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:22ad234adac06fe130f400b393d3ee1aa9eb88b6c239aa55b3f7a795a4959eb3","download_count":10,"created_at":"2026-09-10T13:33:01Z","updated_at":"2026-09-10T13:33:01Z"}],"body":"Released: 2026-09-10\n\n### Fixed\n\n- Restores the telemetry recovery fix from 1.3.2 that was missing in 1.4.0.\n  After reporting a partial backlog, the client now reports recovery when the\n  remaining events finish sending, including after a restart.\n- Restores installation and recovery guidance, including PATH checks, retry\n  commands, custom install locations, and the distinction between installing\n  the companion and activating Pro.\n\nThe original update feed remains frozen at the 1.3.2 bridge. Current managed\ninstallations receive 1.4.1 through the newer feed.\n\n### Commits and PRs\n\n- Source commit: [5b3fb3ac](https://github.com/ctxrs/ctx/commit/5b3fb3ac63a0ecb66ba943a5d0e9380134320726).\n- Full diff: [v1.4.0...5b3fb3ac](https://github.com/ctxrs/ctx/compare/v1.4.0...5b3fb3ac63a0ecb66ba943a5d0e9380134320726).\n- Merged PR: [#962](https://github.com/ctxrs/ctx/pull/962).\n"}
