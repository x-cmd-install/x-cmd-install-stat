d":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1037681,"digest":"sha256:801675da80e5560a98e1c70f00178c5c9204c85200b96f54a31b9a63448f371a","download_count":6,"created_at":"2026-09-22T22:14:40Z","updated_at":"2026-09-22T22:14:41Z"},{"id":582363102,"node_id":"RA_kwDORXJDbs4itife","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:6a6a76005c990590154c87d52a3df46f0ec039b977c46b0d760ce84522060c79","download_count":9,"created_at":"2026-09-22T22:14:40Z","updated_at":"2026-09-22T22:14:41Z"}],"body":"Released: 2026-09-22\n\n### Added\n\n- Blame indexing remains enabled by default. Set `enabled = false` in the\n  `[blame]` section of `config.toml` to stop new foreground and background\n  indexing passes. Existing results remain readable; an active pass may finish.\n  Re-enable it and run `ctx import --all` to catch up retained history.\n- `ctx import --no-blame` skips Blame completion for that import, without\n  changing the configuration or stopping an independently enabled daemon.\n- Imports and `ctx setup --wait` report Blame preparation, indexing and\n  publication progress. Status shows active work separately from the last\n  committed index's readiness. Plain and JSON progress are supported;\n  `--progress none` remains silent.\n\n### Commits and PRs\n\n- Source commit: [14b8c2e4](https://github.com/ctxrs/ctx/commit/14b8c2e412a2513c15cdca83a2c4a69de6623b81).\n- Full diff: [v1.6.2...14b8c2e4](https://github.com/ctxrs/ctx/compare/v1.6.2...14b8c2e412a2513c15cdca83a2c4a69de6623b81).\n- [#1043](https://github.com/ctxrs/ctx/pull/1043) \u2014 add Blame indexing controls and progress.\n"}
