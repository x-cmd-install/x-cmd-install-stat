e_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1418219,"digest":"sha256:d00bf10723814917c3a2100c72ac3ac04f7d3458f3e6d7b68b22edca113597ad","download_count":6,"created_at":"2026-09-24T19:32:48Z","updated_at":"2026-09-24T19:32:49Z"},{"id":586672005,"node_id":"RA_kwDORXJDbs4i9-eF","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:9cbd28308e6d63fb4088df4f48a5b6349026feee0606c8a6662ddab8cab1a77f","download_count":7,"created_at":"2026-09-24T19:32:49Z","updated_at":"2026-09-24T19:32:49Z"}],"body":"Released: 2026-09-24\n\n### Added\n\n- `ctx graph` indexes a chosen codebase and answers symbol, dependency, and impact questions from a local SQLite graph. Existing `.graf/index.db` databases can be used without conversion.\n- `ctx sift` compacts tool output locally. Supported agent hooks can be installed explicitly; the optional Jev selector remains off unless enabled.\n\n### Changed\n\n- Agent-history search, Blame, code graph, and Sift now ship in one `ctx` executable. Search and Blame remain available after the ordinary setup. Graph indexing and Sift hooks are opt-in.\n- The README now introduces the unified workflows, including the Graphify comparison and migration path.\n\n### Fixed\n\n- Devin sessions with repeated rejected subagent lineages no longer block Devin history indexing. Compacted sidekick handoffs remain connected to the original lineage.\n\n### Commits and PRs\n\n- Source commit: [d7b1da6f](https://github.com/ctxrs/ctx/commit/d7b1da6fe580c2ce757cc9a803e7b7560204dba6).\n- Full diff: [v1.6.3...d7b1da6f](https://github.com/ctxrs/ctx/compare/v1.6.3...d7b1da6fe580c2ce757cc9a803e7b7560204dba6).\n- [#1044](https://github.com/ctxrs/ctx/pull/1044) \u2014 repair Devin history imports across compaction.\n- [#1047](https://github.com/ctxrs/ctx/pull/1047) \u2014 unify history, graph, and Sift for ctx 2.0.\n- [#1048](https://github.com/ctxrs/ctx/pull/1048) \u2014 align macOS release checks with graph DNS imports.\n- [#1049](https://github.com/ctxrs/ctx/pull/1049) \u2014 align the README opening with ctx.rs.\n- [#1050](https://github.com/ctxrs/ctx/pull/1050) \u2014 align Windows release checks with graph system imports.\n- [#1051](https://github.com/ctxrs/ctx/pull/1051) \u2014 accept the unified executable size in release staging.\n- [#1052](https://github.com/ctxrs/ctx/pull/1052) \u2014 accept ctx 2.0 in hosted release verification.\n- [#1053](https://github.com/ctxrs/ctx/pull/1053) \u2014 qualify the current installer feed before ctx 2.0.\n"}
