_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1418113,"digest":"sha256:a1cf2301a6194a3a94e2895070977a7c1776266e6b8dc3d5149a7b29206bc4c6","download_count":1,"created_at":"2026-10-01T20:03:20Z","updated_at":"2026-10-01T20:03:20Z"},{"id":604036013,"node_id":"RA_kwDORXJDbs4kANut","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:2908dc7f8733abb91daa3092c3d7caf8ed61b6873f588f5cbb19eb1b133a774a","download_count":2,"created_at":"2026-10-01T20:03:10Z","updated_at":"2026-10-01T20:03:10Z"}],"body":"ctx 2.2.5 restores the skill\u2019s original guidance to search prior agent work before starting unfamiliar work, resuming a task, or revisiting an investigation. It also explains when to query an indexed code graph.\n\n- Existing managed skills refresh automatically after upgrading. Locally edited skills are preserved.\n- Fix imports after OpenCode\u2019s SQLite migration, including repeat imports and retained session evidence.\n- Restore Blame attribution for supported primary agent sessions.\n- Requested imports that fail now return a failing exit status instead of reporting success.\n\nRun `ctx upgrade` to update.\n\n[Full changes](https://github.com/ctxrs/ctx/compare/v2.2.4...v2.2.5).\n\nReleased: 2026-10-01. [Source](https://github.com/ctxrs/ctx/commit/7a1e4ae41dc702756c68b7188779ee104f0a740d).\n"}
