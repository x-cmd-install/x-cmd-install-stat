blic","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":969836,"digest":"sha256:5146eed5901d254c0ed95a2cc0ec11cc8a2ef9e97dd422273bb2221f3eb2a4ab","download_count":5,"created_at":"2026-09-14T16:29:45Z","updated_at":"2026-09-14T16:29:45Z"},{"id":563776869,"node_id":"RA_kwDORXJDbs4hmo1l","name":"SHA256SUMS","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:03cf0dc0a57cd626483534898a731d917cc791f124b699fbff0c190978296940","download_count":6,"created_at":"2026-09-14T16:29:45Z","updated_at":"2026-09-14T16:29:45Z"}],"body":"Released: 2026-09-14\n\n### Fixed\n\n- History on tmpfs and supported eCryptfs encrypted-home filesystems can be\n  indexed. eCryptfs requires an inspectable backing filesystem that meets the\n  existing local-filesystem requirements.\n- Rejected source roots retain their filesystem or permission error instead\n  of being reported as symlink problems. `ctx doctor` JSON now reports\n  incomplete source discovery, matching the human-readable output.\n- `ctx doctor` no longer recommends retrying a completed import solely because\n  some records were rejected.\n- MCP clients can list event metadata when an event is too large to inline.\n\n### Changed\n\n- Failed background refreshes retain coarse failure-stage and error-family\n  diagnostics. These do not include error text or paths, change retry behavior,\n  or retroactively diagnose earlier failures.\n\n### Commits and PRs\n\n- Source commit: [a9980606](https://github.com/ctxrs/ctx/commit/a9980606570f659f9ae4ef1a9a44fead3f61fd1c).\n- Full diff: [v1.4.2...a9980606](https://github.com/ctxrs/ctx/compare/v1.4.2...a9980606570f659f9ae4ef1a9a44fead3f61fd1c).\n- Merged PRs: [#982](https://github.com/ctxrs/ctx/pull/982),\n  [#983](https://github.com/ctxrs/ctx/pull/983), [#984](https://github.com/ctxrs/ctx/pull/984),\n  [#985](https://github.com/ctxrs/ctx/pull/985).\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
