ode_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1445698,"digest":"sha256:0579c0102c66a1f26872128244e17f43f4b63efc7b4cfa604a8b8740da047ba9","download_count":7,"created_at":"2026-11-21T12:46:08Z","updated_at":"2026-11-21T12:46:08Z"},{"id":775560488,"node_id":"RA_kwDORXJDbs4uOh0o","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:3d7f89148d24f8e6b0276c84e5743bc4fc8f295a5e363e9baafa49ee5b0e3edf","download_count":11,"created_at":"2026-11-21T12:46:08Z","updated_at":"2026-11-21T12:46:08Z"}],"body":"Released: 2026-11-21\n\n### Added\n\n- `ctx sessions` lists indexed sessions ordered by most recent activity, with `--since`, `--provider`, `--workspace`, `--no-subagents`, `--limit`, and `--format text|json`, reading only the pinned active index without reopening provider transcripts.\n- ATIF v1.8 trajectory import and export support: import trajectories with `ctx import --input-format atif-v1 --path`, export a session with `ctx show session <id> --format atif`, and export full archives with `ctx archive atif --out <dir>`.\n- `ctx upgrade external-replace` preserves running daemons cleanly across external binary replacements such as package-manager upgrades.\n- Antigravity App 2.x and T3 Code ACP session roots are discovered automatically with bounded directory traversal.\n\n### Improved\n\n- Read-only queries (`ctx search`, `ctx show`, `ctx sessions`) open an authenticated generation summary sidecar instead of loading the full manifest, speeding up query startup on large histories.\n- Incremental refreshes record newly added sources in compact flat manifest deltas instead of rewriting the full manifest.\n- Search index rebuilds bound memory and worker usage with `indexing.memory_mb` and `indexing.workers`, cap staging segment merges, spill large changed-session registries to disk, reclaim unleased predecessor storage before upgrade rebuilds, and report upgrade progress and ETA in `ctx status`.\n\n### Fixed\n\n- Upgrading from schema-22 or rebuild-marked generations runs a clean full rebuild while preserving explicit source catalogs and detached provider root metadata, and prevents partial refreshes from dropping routes mid-rebuild.\n- Duplicate background maintenance wakes coalesce instead of saturating the daemon queue, and queue-full responses report the active request ID.\n- Manual imports tie their worker to the caller's stdin lifeline and cancel cleanly if the caller exits.\n- Supervised macOS daemons stay alive under load without launchd restarts interrupting concurrent searches.\n- OpenZFS source roots qualify on Linux, Codex Zstd workers share a 1 GiB scratch budget and retain subagent lifecycle notices, Hermes tool-call rows with empty content are indexed and re-parsed on parser upgrades, Pi skips OMP `changes.jsonl` and non-session files, Windows missing-path errors map cleanly across providers, configured roots no longer warn as partial when optional sub-paths are absent, local usage storage recovers from stale SHM and WAL state, and CLI stdout/stderr pipes exit cleanly on `BrokenPipe`.\n- Updated bundled SQLite (`rusqlite`/`libsqlite3-sys`), `rmcp`, `quinn-udp`, and `rustix` dependencies to versions that address the release scan's security advisories.\n\n- Source commit: [0b117cbac91be486e5a966c6106fd15f2573d0ea](https://github.com/ctxrs/ctx/commit/0b117cbac91be486e5a966c6106fd15f2573d0ea)\n"}
