ublic","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":969836,"digest":"sha256:cef92dfa7803cb7eb53590683950a97549d04602143126750731f585cfaa3f35","download_count":7,"created_at":"2026-09-13T03:24:28Z","updated_at":"2026-09-13T03:24:29Z"},{"id":560466656,"node_id":"RA_kwDORXJDbs4haArg","name":"SHA256SUMS","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:ec650e711febc4429939f629d1384577bdec2718c71a6a8b7cfb0b0f534df747","download_count":13,"created_at":"2026-09-13T03:24:28Z","updated_at":"2026-09-13T03:24:28Z"}],"body":"Released: 2026-09-12\n\n### Fixed\n\n- Fixed a macOS folder-watcher shutdown race that could leave background\n  refresh stuck while the list of watched folders was being updated.\n- Background refresh on macOS now detects appended history even when a folder\n  notification is missed.\n- Readers and recovery processes prepare their file limits before opening an\n  index. Stalled refresh requests return an actionable error instead of waiting\n  indefinitely, and `ctx doctor` explains disk-space and file-limit failures.\n- Semantic search keeps large source catalogs within the manifest size limit\n  and reports runtime startup failures instead of showing continued preparation.\n- Fixed SQLite lock handling during Semantic indexing and local usage recording.\n- Codex imports preserve oversized prompts and history after a revert. Goose\n  imports accept database versions 9, 15 and 16, and Cursor imports retain\n  native turn timestamps.\n- Fixed Cargo subprocess-test compilation.\n\n### Commits and PRs\n\n- Source commit: [e4602f78](https://github.com/ctxrs/ctx/commit/e4602f787c55ba9e4ef76e000d47fea9ff4a7344).\n- Full diff: [v1.4.1...e4602f78](https://github.com/ctxrs/ctx/compare/v1.4.1...e4602f787c55ba9e4ef76e000d47fea9ff4a7344).\n- Merged PRs: [#964](https://github.com/ctxrs/ctx/pull/964), [#965](https://github.com/ctxrs/ctx/pull/965),\n  [#967](https://github.com/ctxrs/ctx/pull/967), [#952](https://github.com/ctxrs/ctx/pull/952),\n  [#968](https://github.com/ctxrs/ctx/pull/968), [#969](https://github.com/ctxrs/ctx/pull/969),\n  [#954](https://github.com/ctxrs/ctx/pull/954), [#972](https://github.com/ctxrs/ctx/pull/972),\n  [#956](https://github.com/ctxrs/ctx/pull/956), [#979](https://github.com/ctxrs/ctx/pull/979).\n"}
