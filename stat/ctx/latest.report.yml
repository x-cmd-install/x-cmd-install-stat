"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1037681,"digest":"sha256:599e87aaed836fd8d7359fa580bc22544c0a5be690911fabdb7944d97c393c01","download_count":1,"created_at":"2026-09-26T02:24:39Z","updated_at":"2026-09-26T02:24:39Z"},{"id":589748154,"node_id":"RA_kwDORXJDbs4jJte6","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:d0a96e10bea9a232c92711f470e4ca785ecc424bb1442727ec5b26ef1f4bb0d3","download_count":2,"created_at":"2026-09-26T02:24:35Z","updated_at":"2026-09-26T02:24:35Z"}],"body":"## ctx 1.6.4\n\nA maintenance release for the 1.6.x line.\n\n- Raises the managed updater artifact limit from 128 MiB to 512 MiB so larger signed releases can update normally.\n- Aligns the 1.6.4 release metadata and dependency lock inputs.\n- Stabilizes the public release CI fixtures for telemetry PostgreSQL and systemd setup tests.\n- Ships signed binaries for Linux x64/arm64, macOS arm64/x64, and Windows x64.\n\nAll release files are listed in `SHA256SUMS`; SBOM and third-party notice files are included for each executable.\n"}
