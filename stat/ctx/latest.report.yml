ode_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1417553,"digest":"sha256:b2fe50fc4758b89e7d080d2aa74c85370f209391c13d2535599ca55e35f255a5","download_count":1,"created_at":"2026-09-29T03:48:00Z","updated_at":"2026-09-29T03:48:00Z"},{"id":597173717,"node_id":"RA_kwDORXJDbs4jmCXV","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:58a165a951099475e68c7ff49c0e47366295cb1b2697d6aaf18d0dddb76bcb62","download_count":2,"created_at":"2026-09-29T03:47:51Z","updated_at":"2026-09-29T03:47:51Z"}],"body":"## 2.1.1\n\nReleased: 2026-09-29\n\n### Fixed\n\n- Sift hooks use `ctx sift run`, so intercepted shell commands execute correctly and preserve their exit status.\n- History refresh retains readers safely during publication and keeps verified index files reusable across managed link changes, avoiding false corruption errors and unnecessary full-index hashing.\n- Blame rebuilds a corrupt derived manifest from retained history. Doctor reports the failure, and foreground setup shows the active writer's progress.\n- Interrupted install and uninstall attempts no longer leave a fresh reinstall stuck in migration state. Other pending upgrades retain ownership of their recovery.\n- Uninstall recognizes current managed `ctx` skills while preserving edited skills. New manual-page directories install correctly with a group-writable shell umask.\n- Agent configuration updates preserve large JSON numbers and recognize valid inline TOML tables and owned renamed executables.\n- MCP reports missing history generations consistently, rejects non-object tool arguments, and documents its input and output limits accurately.\n- Installer and release tooling use undici 7.29.1 to address GHSA-3wwx-pv8p-q78v.\n\nFull diff: [v2.1.0...v2.1.1](https://github.com/ctxrs/ctx/compare/v2.1.0...v2.1.1).\n"}
