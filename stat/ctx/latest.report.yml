ode_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1418113,"digest":"sha256:0b756774bea61c2eba5cbf8bc3df8534fedbb32bcbf82af8c654b76f9f72bfcb","download_count":7,"created_at":"2026-10-05T23:40:41Z","updated_at":"2026-10-05T23:40:42Z"},{"id":613901112,"node_id":"RA_kwDORXJDbs4kl2M4","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:f8b485a28e579f0493c7cc3e2fcdeb3b35c87a18b9bf9ecaf9fc7804a2d96ed9","download_count":11,"created_at":"2026-10-05T23:40:42Z","updated_at":"2026-10-05T23:40:42Z"}],"body":"Released: 2026-10-05\n\n### Fixed\n\n- Incremental imports reuse validated ownership for accepted Codex appends, avoiding repeated reads of large, unchanged prefixes.\n- Unfinished trailing records resume from the last complete record instead of replaying completed history. Replacement, truncation, and appended ownership conflicts still trigger validation; exhaustive imports still check historical bytes.\n- Worker compatibility checks use executable file metadata instead of reading the entire binary on each import. Strict executable verification remains in place when signalling another process.\n- Background blame maintenance selects the current history after acquiring the writer lock, so a queued worker cannot publish stale attribution. Logical writer leases release their native lock even when a duplicated file descriptor remains open.\n\nTantivy index merging is unchanged.\n\n- Source commit: [56aaf35233ce7f8aa739c207525a3d67e6ddddbd](https://github.com/ctxrs/ctx/commit/56aaf35233ce7f8aa739c207525a3d67e6ddddbd)\n\n[Full changes](https://github.com/ctxrs/ctx/compare/v2.2.7...v2.2.8).\n"}
