lic","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":969836,"digest":"sha256:f0fe581a1a6fe15d0de86035004c97062e514f6b3884a88e77f164b5e2138250","download_count":6,"created_at":"2026-09-15T20:07:34Z","updated_at":"2026-09-15T20:07:34Z"},{"id":566418918,"node_id":"RA_kwDORXJDbs4hwt3m","name":"SHA256SUMS","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:c4251324a1f045d195bd8fc26d7e82acb65dfe4d08fd86cb7846fed6f4f7d5a4","download_count":6,"created_at":"2026-09-15T20:07:34Z","updated_at":"2026-09-15T20:07:34Z"}],"body":"Released: 2026-09-15\n\n### Changed\n\n- Background refresh diagnostics distinguish supported filesystem and resource\n  failures using typed causes, without collecting paths or error text.\n- Telemetry upload recovery reports distinguish supported connection, timeout,\n  response-read and local queue failures. Older clients can continue sharing\n  the same queue. Unknown causes remain unspecified; retry behavior is unchanged.\n\n### Fixed\n\n- In 1.4.6, managed installation, upgrade and uninstall accept user-owned `755` and\n  `775` executable directories and preserve their permissions and unrelated\n  tools. The shell installer no longer changes an existing `bin` to `700`.\n- Installer failures stop progress output before showing the error and tell\n  users to resolve the reported problem before retrying.\n  Already-installed older CLIs still apply their old permission checks during\n  upgrade; their errors are now shown without changing shared directory permissions.\n- On Linux, ctx pro credentials use the existing `/run/user/<uid>` session\n  directory when `XDG_RUNTIME_DIR` is unset.\n\n### Commits and PRs\n\n- Source commit: [a6ee08e9](https://github.com/ctxrs/ctx/commit/a6ee08e928b12d25fcb3ece538b3f145ac839003).\n- Full diff: [v1.4.4...a6ee08e9](https://github.com/ctxrs/ctx/compare/v1.4.4...a6ee08e928b12d25fcb3ece538b3f145ac839003).\n- Telemetry recovery compatibility: [#998](https://github.com/ctxrs/ctx/pull/998).\n- Installer permissions: [#993](https://github.com/ctxrs/ctx/pull/993).\n- Diagnostic recovery: [#992](https://github.com/ctxrs/ctx/pull/992).\n"}
