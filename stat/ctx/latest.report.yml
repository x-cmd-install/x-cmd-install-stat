e_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1432430,"digest":"sha256:d3b57f71b1fae234d1d749950451f4479721763284a8174ed6ae0abd21c16a00","download_count":4,"created_at":"2026-11-05T08:57:38Z","updated_at":"2026-11-05T08:57:39Z"},{"id":712734029,"node_id":"RA_kwDORXJDbs4qe3VN","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:3eaded5fccf0eaddd444bf6d3168692133953209107848f5b12b16eec0f1f04d","download_count":4,"created_at":"2026-11-05T08:57:39Z","updated_at":"2026-11-05T08:57:39Z"}],"body":"Released: 2026-11-05\n\n### Fixed\n\n- Broad multi-word searches run about 40 to 50 percent faster on large histories and return the same best matches.\n- While background indexing catches Blame up with newer history, Blame tells you to check `ctx status` and retry instead of starting another full import.\n- Retrying an interrupted search index rebuild removes abandoned build files before starting again, while keeping searchable history and files still in use.\n- `ctx status` no longer briefly reports a stale daemon lock while the daemon is starting or updating it.\n- Importing a folder with `--path` keeps healthy sessions when a neighboring file can't be read, and reports the problem file. This covers Pi, Claude Code, Codex and Prime Agent. Pi also skips files that aren't sessions and symlinks.\n- Cline SDK imports keep previously imported sessions and report a failure when a session catalog can't be read.\n\n- Source commit: [33ba4645b620fd89d138c6db1fabf33096a0ee16](https://github.com/ctxrs/ctx/commit/33ba4645b620fd89d138c6db1fabf33096a0ee16)\n"}
