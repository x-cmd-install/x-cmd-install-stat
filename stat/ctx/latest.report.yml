e_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1432430,"digest":"sha256:8ce5f34db5b3a79d02d8b5b9a8c2a3aad6c699d4d406e436a1ccae1b4231ba4c","download_count":5,"created_at":"2026-11-05T00:56:38Z","updated_at":"2026-11-05T00:56:39Z"},{"id":711529057,"node_id":"RA_kwDORXJDbs4qaRJh","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:aa1f139ea8b68065cc1900cb398b49bc8681ff9339154aaf13104b3bba1d7f97","download_count":8,"created_at":"2026-11-05T00:56:39Z","updated_at":"2026-11-05T00:56:39Z"}],"body":"Released: 2026-11-04\n\n### Added\n\n- Prime Agent is a supported history provider, separate from Pi. ctx discovers version 3 sessions in the selected Prime directory, RLM child sessions, and T3 Code's local Prime session store.\n- Search and show preserve conversation and custom messages, Python tool calls and results, and session relationships. Explicit imports accept `--provider prime-agent --path PATH`; `prime` and `prime_agent` are aliases.\n- Structured file references and tool diffs remain available to history and Blame. Dynamic Python source does not establish exact file ownership or MCP server identity.\n- `ctx status` shows how the active search index's storage is split between the docstore, terms, postings, positions and fast fields.\n\n### Fixed\n\n- Broad multi-word searches on large histories return their best matches instead of stopping after the first 65,536 candidates.\n- Background indexing no longer rereads whole live Codex sessions after every small append, which kept one or two CPU cores busy while agents were writing. The search index and Blame data are rebuilt once after upgrading. Search keeps working during the rebuild, Blame is available again when it finishes, and `ctx status` shows progress.\n- Blame attributes commits made in primary Claude Code and Pi sessions. Subagent, forked and copied sessions stay unattributed.\n- Blame finds commits made from Codex code mode.\n- A Pi sessions folder that contains other JSONL files, or files that can't be read, no longer blocks every Pi import. Tool calls nested in Pi messages are recorded.\n- OMP sessions keep importing while OMP updates the session title.\n- Cursor imports preserve conflicting transcript copies as separately addressable histories, including reordered messages and unique tool events. Existing canonical citations stay stable while their source remains present, even when another copy grows longer.\n- OpenCode imports check payload sizes before copying them, so one very large record no longer uses hundreds of megabytes of memory.\n- Unchanged search index files are shared between index generations with hard links where the filesystem supports them.\n- A rolled-back index write can no longer leave background merges writing into an index that was already published.\n- Updated Markdown parsing and Zstandard compression dependencies to versions that address the release scan's security advisories.\n\n- Source commit: [aa92103fe9e56c047bc85c562b2641e8954ccfa8](https://github.com/ctxrs/ctx/commit/aa92103fe9e56c047bc85c562b2641e8954ccfa8)\n"}
