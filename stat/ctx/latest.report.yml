node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1417553,"digest":"sha256:6747aebe02e069d8fdaf19b58f93335ae1274d7104545737e891a141b0275b10","download_count":2,"created_at":"2026-09-27T15:48:07Z","updated_at":"2026-09-27T15:48:07Z"},{"id":593229305,"node_id":"RA_kwDORXJDbs4jW_X5","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:ad535108051e2b9da878e2ed77f0dd0a9bca9cb9ac5b1695f7d54a173ec9785b","download_count":4,"created_at":"2026-09-27T15:47:58Z","updated_at":"2026-09-27T15:47:58Z"}],"body":"This patch repairs the path from older ctx installations to ctx 2.x.\n\n- Current releases and new installs use a separate stable update feed.\n- Older 1.x installations can first download the small 1.6.5 bridge, then upgrade to the current release.\n- Existing 2.x installations that miss the transition can update by rerunning the installer. Their indexed history is retained.\n\nInstall or update:\n\n```sh\ncurl -fsSL https://ctx.rs/install | sh\n```\n\nOn Windows:\n\n```powershell\nirm https://ctx.rs/install.ps1 | iex\n```\n"}
