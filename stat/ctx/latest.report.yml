ublic","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":969837,"digest":"sha256:1a8713342d402d316eb4a9d320de260d03f27c9c50bb7c25169c7cb125d15c2e","download_count":6,"created_at":"2026-09-16T23:02:40Z","updated_at":"2026-09-16T23:02:41Z"},{"id":568973810,"node_id":"RA_kwDORXJDbs4h6dny","name":"SHA256SUMS","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:c1203bfbb130f01f9553ceb5bbbf7b2b0c63b7b2fcf08f0eff262c1191a8737c","download_count":9,"created_at":"2026-09-16T23:02:41Z","updated_at":"2026-09-16T23:02:41Z"}],"body":"Released: 2026-09-16\n\n### Fixed\n\n- Upgrades recognize stopped daemons even when another process has reused\n  their process ID.\n- Daemon status no longer requests a restart solely because another shell has\n  different locale, temporary-directory, or session settings.\n- Windows manual upgrades and semantic-runtime repairs record completion\n  before restarting background indexing. Resume preserves the installed\n  environment and data-root path.\n- Windows scheduled tasks wait for fresh daemon ownership when process IDs\n  are reused.\n- Hosted installers accept supported existing semantic and named-source settings.\n\n### Commits and PRs\n\n- Source commit: [31109e1d](https://github.com/ctxrs/ctx/commit/31109e1d4fcb8dc522a70a24061c389ab44e42ef).\n- Full diff: [v1.4.9...31109e1d](https://github.com/ctxrs/ctx/compare/v1.4.9...31109e1d4fcb8dc522a70a24061c389ab44e42ef).\n- [#1006](https://github.com/ctxrs/ctx/pull/1006) \u2014 restore daemon availability after upgrades and shell changes.\n- [#1007](https://github.com/ctxrs/ctx/pull/1007) \u2014 preserve Windows task ownership across upgrades.\n- [#1008](https://github.com/ctxrs/ctx/pull/1008) \u2014 prepare the 1.4.10 patch release.\n"}
