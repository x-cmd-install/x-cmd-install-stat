216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":49068304,"digest":"sha256:397b058a522fe27bbc28fcfc7519ecd7d40d768344403bf6a7d50cd90bc84dff","download_count":15,"created_at":"2026-09-03T02:01:19Z","updated_at":"2026-09-03T02:01:22Z"},{"id":542052113,"node_id":"RA_kwDORXJDbs4gTw8R","name":"ctx-windows-x64.exe","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":60906216,"digest":"sha256:4c92e1cac5196b28e9263394bac6865ac136b1402219f327d8f30f13e0a8ebdf","download_count":26,"created_at":"2026-09-03T02:01:19Z","updated_at":"2026-09-03T02:01:23Z"},{"id":542052146,"node_id":"RA_kwDORXJDbs4gTw8y","name":"SHA256SUMS","label":"","uploader":{"login":"luca-ctx","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":412,"digest":"sha256:63500ab40e1815ca716e4b7ef19ec3b2e898a6615f7cbfcc02a83c222a83f203","download_count":47,"created_at":"2026-09-03T02:01:22Z","updated_at":"2026-09-03T02:01:22Z"}],"body":"Released: 2026-09-02\n\nctx 1.3.1 improves background work, managed upgrades, and snapshot reads while\nmaking partial history results easier to understand.\n\n### Changed\n\n- Semantic maintenance now gets bounded opportunities to make progress during\n  continuous Core refresh activity.\n- Partial history labels now distinguish files that were not indexed from\n  individual records that were skipped.\n- The persistent daemon now delivers queued telemetry in the background, so\n  foreground CLI and MCP commands do not perform telemetry network delivery.\n\n### Fixed\n\n- Certified unchanged SQLite histories are reused without snapshot copies or\n  logical rescans.\n- Managed upgrades safely refresh existing ctx-owned skills and\n  installer-owned man pages while leaving uncertain or modified installs\n  untouched.\n- Artifact redirects remain bound to the signed artifact origin while retaining\n  existing transport and integrity checks.\n- Snapshot reads can reopen a certified retained predecessor after legitimate\n  publication metadata changes without accepting unrelated stale state.\n\nThe binaries attached to the GitHub Release provide ctx Core only. The hosted\ninstaller remains the recommended path for a managed Core and Pro installation.\n\n### Commits and PRs\n\n- Source commit: [e44fb562](https://github.com/ctxrs/ctx/commit/e44fb5623db966254f195c182d7642f9df013cb2).\n- Full changelog: [v1.3.0...e44fb562](https://github.com/ctxrs/ctx/compare/v1.3.0...e44fb5623db966254f195c182d7642f9df013cb2).\n- Merged PRs: [#866](https://github.com/ctxrs/ctx/pull/866),\n  [#867](https://github.com/ctxrs/ctx/pull/867),\n  [#868](https://github.com/ctxrs/ctx/pull/868),\n  [#869](https://github.com/ctxrs/ctx/pull/869),\n  [#873](https://github.com/ctxrs/ctx/pull/873),\n  [#880](https://github.com/ctxrs/ctx/pull/880),\n  [#882](https://github.com/ctxrs/ctx/pull/882),\n  [#883](https://github.com/ctxrs/ctx/pull/883), and\n  [#884](https://github.com/ctxrs/ctx/pull/884).\n"}
