"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1435004,"digest":"sha256:45cc744ba50c0ba142793f224243e6d80007c6f978d7eac9cae7813081c09d72","download_count":8,"created_at":"2026-10-25T13:12:23Z","updated_at":"2026-10-25T13:12:24Z"},{"id":675082358,"node_id":"RA_kwDORXJDbs4oPPB2","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:3d0966b2d166e7da11119511a27373eee44c98542d4451d3b10bebe1c5ef030b","download_count":14,"created_at":"2026-10-25T13:12:24Z","updated_at":"2026-10-25T13:12:24Z"}],"body":"Released: 2026-10-25\n\n### Added\n\n- Restored conversations show the archive creator's origin and view in search, detail and `locate` output, with optional `archive_provenance` in JSON and MCP. Labels are creator-supplied; restore older imports again to add them. ([#1134](https://github.com/ctxrs/ctx/pull/1134), [#1123](https://github.com/ctxrs/ctx/issues/1123))\n- `ctx archive export` selects conversations by `--workspace`, `--since` and `--until`. Use `--preview` to inspect the selection without writing an archive. ([#1138](https://github.com/ctxrs/ctx/pull/1138), [#1122](https://github.com/ctxrs/ctx/issues/1122))\n- `ctx daemon status --all` lists registered data roots and daemon state as text or JSON. ([#1137](https://github.com/ctxrs/ctx/pull/1137), [#1124](https://github.com/ctxrs/ctx/issues/1124))\n\n### Changed\n\n- Upgrade dependencies affected by security advisories, including Tantivy 0.27, lru, the TLS stack and ZIP handling; replace retired YAML dependencies with `yaml_serde`. Existing YAML records and 2.2.8 search indexes remain usable. ([#1131](https://github.com/ctxrs/ctx/pull/1131))\n\n### Fixed\n\n- Avoid repeatedly reading unchanged Codex history when new sessions appear during ongoing appends. ([#1130](https://github.com/ctxrs/ctx/pull/1130), [#1119](https://github.com/ctxrs/ctx/issues/1119))\n- Stop idle daemon CPU loops after refresh admission failures while allowing later scheduled refreshes. ([#1132](https://github.com/ctxrs/ctx/pull/1132), [#1125](https://github.com/ctxrs/ctx/issues/1125))\n- Recover search from invalid retention holds, correct macOS file-identity checks, and report the actual read-lock error. `ctx doctor --repair` verifies history and preserves invalid hold files in quarantine. ([#1133](https://github.com/ctxrs/ctx/pull/1133), [#1121](https://github.com/ctxrs/ctx/issues/1121))\n- Keep other Codex sessions refreshing when one rollout is oversized or a transcript symlink is refused, preserving previously indexed content. Sources paused by an earlier internal failure retry after upgrading. ([#1135](https://github.com/ctxrs/ctx/pull/1135), [#1126](https://github.com/ctxrs/ctx/issues/1126))\n- Explain on stderr when a search against a separate `--data-root` starts a persistent indexer, including how to switch that root to manual indexing. ([#1137](https://github.com/ctxrs/ctx/pull/1137), [#1124](https://github.com/ctxrs/ctx/issues/1124))\n\n- Source commit: [0e1b92ab6e835866eb7e5e5bd79c76d329cc1a3f](https://github.com/ctxrs/ctx/commit/0e1b92ab6e835866eb7e5e5bd79c76d329cc1a3f)\n\n[Full changes](https://github.com/ctxrs/ctx/compare/v2.2.8...v2.3.0).\n"}
