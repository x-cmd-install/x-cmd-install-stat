id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1037681,"digest":"sha256:babf16b42eee37685ae51c66f63991bc451bf821b4452a9fd7f5efd334632c7b","download_count":2,"created_at":"2026-09-21T16:38:11Z","updated_at":"2026-09-21T16:38:11Z"},{"id":579430089,"node_id":"RA_kwDORXJDbs4iiWbJ","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:87dcd332e6b739ad082e67f489fef64ca198666c16f6a37ee0bcaa0dcbd61515","download_count":7,"created_at":"2026-09-21T16:38:07Z","updated_at":"2026-09-21T16:38:07Z"}],"body":"## 1.5.0\n\nReleased: 2026-09-21\n\n### Changed\n\n- Blame is built into the open-source ctx CLI, including source and\n  package-manager builds. File, commit, and pull-request attribution retains\n  the short and explicit CLI forms and the MCP `blame` tool, with citations and\n  text and structured results. Blame no longer requires a Pro companion, trial,\n  activation, machine fingerprint, or subscription.\n- Blame, its build tools, the installer, and the documentation site now live\n  in the public ctx repository.\n- Automatic indexing maintains attribution alongside local history. Run\n  `ctx setup --wait` or `ctx import --all` to complete it explicitly, including\n  in manual mode or when history is already current. Setup's `--no-daemon`\n  option continues to suppress refresh.\n- `ctx status` and `ctx doctor` report attribution readiness and coverage.\n  Blame queries read the existing index without starting a rebuild. A current\n  index remains ready when no attribution evidence is available. History\n  remains searchable while attribution catches up.\n- Existing retained history and citations are preserved. Blame uses the\n  unencrypted local `search/attribution/` index; old encrypted Pro data and keys\n  are left untouched and unused. Upgrading does not cancel an existing\n  subscription.\n- For hosted installs from 1.5 onward, uninstalling with no option or\n  `--keep-data` preserves history, attribution, and legacy data and keys.\n  `--delete-data` is rejected before changes are made; rerun without that\n  option. Package-manager and source installs use their original removal\n  method. There is no native `ctx uninstall` command.\n- Restored the original \u201csearch it with ctx\u201d banner and updated documentation\n  and bundled agent skills for included Blame, without trial or purchase\n  instructions.\n\n### Commits and PRs\n\n- Source commit: [137f60fe](https://github.com/ctxrs/ctx/commit/137f60fe7e45238d96afeb41103432095aabf8a7).\n- Full diff: [v1.4.12...137f60fe](https://github.com/ctxrs/ctx/compare/v1.4.12...137f60fe7e45238d96afeb41103432095aabf8a7).\n- [#1018](https://github.com/ctxrs/ctx/pull/1018) \u2014 include native Blame in the public ctx 1.5 product.\n- [#1020](https://github.com/ctxrs/ctx/pull/1020) \u2014 renew bounded paste/lru exceptions and allow omitted Windows install evidence.\n"}
