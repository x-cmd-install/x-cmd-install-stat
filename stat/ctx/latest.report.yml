node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1417553,"digest":"sha256:5eb5d25b790dbd55e9278a32e581320360db6789af9cdb04d95a84cdf5810043","download_count":2,"created_at":"2026-09-30T00:12:11Z","updated_at":"2026-09-30T00:12:11Z"},{"id":599558351,"node_id":"RA_kwDORXJDbs4jvIjP","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:5cac9f4e81e5137103852cfdc04403344ea51ebcd18960133ddf0173dfa91daf","download_count":3,"created_at":"2026-09-30T00:12:01Z","updated_at":"2026-09-30T00:12:01Z"}],"body":"Large history refreshes now avoid repeated source lookups and rebuilding unchanged search records. Edits to older messages and deleted records are still detected.\n\n`ctx status` explains what history work is running and what triggered it. Run `ctx status --sample 5` for a short CPU report, or add `--format json` for structured output. The sampled report contains aggregate counts and status fields, without transcripts, source paths, or raw errors.\n\nThis patch also includes the latest graph fixes for YAML streams and local document errors, plus clearer disk-space error messages.\n"}
