_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1418113,"digest":"sha256:67a8bfd3bb1e70a0859dbc0fd791fc16d4576e3fb8b4cbc02a09cb4c9232181e","download_count":2,"created_at":"2026-10-01T02:02:28Z","updated_at":"2026-10-01T02:02:28Z"},{"id":602228965,"node_id":"RA_kwDORXJDbs4j5Ujl","name":"SHA256SUMS","label":"","uploader":{"login":"willsmanley","id":216224554,"node_id":"U_kgDODONTKg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1901,"digest":"sha256:72a5d99d6087aeae0189ad9f7256c48f51ed23413165660102d98e5490a666b5","download_count":3,"created_at":"2026-10-01T02:02:19Z","updated_at":"2026-10-01T02:02:20Z"}],"body":"ctx 2.2.4 extends optional telemetry to Graph, Sift, and Server so we can diagnose problems across the whole CLI.\n\n- Graph indexing, search, and MCP operations report timing, result completeness, and failures.\n- Sift reports measured input/output savings, missing measurements, and filter versus child-command failures.\n- Server reports request delivery, publication and indexing, background sync, and lifecycle health separately.\n- Standalone Graph and Sift can deliver telemetry without setting up history search or starting its daemon. Delivery stays in the background, with bounded queues and offline retries.\n\nExisting telemetry settings and opt-out behavior still apply. New observations contain no queries, source paths, command arguments, code, or tool-output content.\n\nRun `ctx upgrade` to update. Older updaters continue through the existing compatibility bridge automatically.\n\n[Full changes](https://github.com/ctxrs/ctx/compare/v2.2.3...v2.2.4).\n"}
