_id":"RA_kwDOAb2sRc4j4LiR","name":"caddy_2.11.6_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16514934,"digest":"sha256:aa6ecf039466a5aa65c16cf2e3057470d36905afcb9bbc18287202c70d54218d","download_count":36,"created_at":"2026-09-30T22:38:04Z","updated_at":"2026-09-30T22:38:06Z"},{"id":601930276,"node_id":"RA_kwDOAb2sRc4j4Lok","name":"caddy_2.11.6_windows_arm64.zip.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:6171ddf90b3962983d15e40da4afcea273e9fce03af0c9a42cdded34f3c9732f","download_count":11,"created_at":"2026-09-30T22:38:19Z","updated_at":"2026-09-30T22:38:19Z"}],"body":"This patch release contains a large number of minor and some noticeable enhancements and bug fixes. Thank you to everyone who contributed or spent their LLM tokens responsibly to help with this release!\r\n\r\nWe have much more in the pipeline still, as AI has made contributions of all quality levels cheap and easy. We will be trying to go through them as quickly and efficiently as we can.\r\n\r\n**Huge thank you to our sponsors for keeping the project alive with resources, and for our maintainers who triage and assist tirelessly in this relentless new age of AI.**\r\n\r\n:warning: **Please read the breaking changes below before upgrading.** Most of them come from security hardening, and most configs won't notice. If you were relying on one of the old behaviors, though, you'll want to know about it.\r\n\r\n## Highlights\r\n\r\n- **New [`url_pattern` request matcher](https://caddyserver.com/docs/caddyfile/matchers#url-pattern):** Match requests with the [URLPattern](https://urlpattern.spec.whatwg.org/) standard, the same syntax used by browsers (JS) and many web frameworks. It supports named groups, wildcards, and regexp components. Captured groups become placeholders (`{http.url_pattern.<component>.<group>}`), and there's a matching `url_pattern` CEL function too. Thanks @dunglas! (#7787)\r\n- **Slowloris mitigation:** New idle read/write timeouts reset on every successful read or write. A stalled connection gets cut off, and a slow one that's still making progress is left alone. You can also set optional minimum transfer rates, and there's a new [`timeouts`](https://caddyserver.com/docs/caddyfile/directives/timeouts) handler directive for per-route tuning. (#7913)\r\n- **New [`tls_automate_names`](https://caddyserver.com/docs/caddyfile/options#tls-automate-names) global option:** Manage certificates for names without serving them in a site block. (#8015)\r\n- **New [`expected_underscore_headers`](https://caddyserver.com/docs/caddyfile/options#expected-underscore-headers) server option:** If dropping header fields with underscores in 2.11.4 broke your app, you can now list the specific headers to keep. (#7809)\r\n- **HTTP/3 over Tailscale and other low-MTU links** now works, because the initial QUIC packet size is smaller. (#7886)\r\n- **Reverse proxy got more love:**\r\n  - partial responses are flushed to clients properly (#7849)\r\n  - TCP half-close is propagated on upgraded streams (#8027)\r\n  - `versions 3` upstreams now honor [`tls_trust_pool`](https://caddyserver.com/docs/caddyfile/directives/reverse_proxy#tls_trust_pool) (#8042)\r\n  - [active health check](https://caddyserver.com/docs/caddyfile/directives/reverse_proxy#active-health-checks) state is kept separate per check config, so one handler's failing probes don't mark the upstream down for everyone else (#7916)\r\n  - the `random_choose` policy distributes correctly now (#7873)\r\n- **Server-sent events behind [`encode`](https://caddyserver.com/docs/caddyfile/directives/encode)** now stream immediately instead of being buffered. (#7905)\r\n- **Graceful shutdown** now waits for servers left over from previous configs, so long-lived responses that started before a reload aren't cut off at exit. (#8009)\r\n- **Caddyfile:** [`import`](https://caddyserver.com/docs/caddyfile/directives/import) now works inside [named routes](https://caddyserver.com/docs/caddyfile/concepts#named-routes) (#7986), and quoted braces are treated as literal arguments (#7875).\r\n- **Logging:**\r\n  - new [`set_cookie`](https://caddyserver.com/docs/caddyfile/directives/log#set-cookie) log filter (#7888)\r\n  - [`roll_interval`](https://caddyserver.com/docs/caddyfile/directives/log#roll_interval) accepts days (`d`) (#7900)\r\n  - recovered handler panics are logged at ERROR level (#7924)\r\n  - write timeout errors show up in access logs (#7945)\r\n- **Performance:** fewer allocations in request hot paths, encoding negotiation, and the reverse proxy, from @jvoisin and @dunglas. Directory browsing is much faster for large directories. (#7847, #7903, #7911, #7925, #7926, #7936)\r\n- **Other new stuff:**\r\n  - `{http.request.proto_name}` placeholder (#7782)\r\n  - FastCGI populates `SERVER_ADDR` (#7912)\r\n  - multiple `authentication` providers no longer clobber each other's responses (#7904)\r\n\r\n## :warning: Breaking changes\r\n\r\n- **Go 1.26 is now the minimum version** for building Caddy and plugins. (#8056)\r\n- **Request headers are limited to 16 KiB by default.** Before, we used Go's 1 MB default. Requests with larger headers (giant cookies, oversized tokens, etc.) will now get `431 Request Header Fields Too Large`. If you need more, raise it with the [`max_header_size`](https://caddyserver.com/docs/caddyfile/options#max-header-size) server option.\r\n- **New 1-minute idle read/write timeouts by default.** If a request body read or a response write stalls (makes no progress at all) for longer than that, the connection is aborted. Pauses *between* writes, like with SSE, don't count. Some long-lived streams where the client goes quiet mid-body may be affected. You can tune these with `read_body_idle` and `write_idle` in the [`timeouts`](https://caddyserver.com/docs/caddyfile/options#timeouts) server option, or per-route with the [`timeouts`](https://caddyserver.com/docs/caddyfile/directives/timeouts) directive. (#7913)\r\n- **Request header fields containing `.` are now dropped**, the same way underscores were in 2.11.4. PHP folds `.` to `_`, so these could be used to impersonate legitimate headers. If you need specific ones, allow them with the new [`expected_dot_headers`](https://caddyserver.com/docs/caddyfile/options#expected-dot-headers) server option.\r\n- **A wildcard site's [`client_auth`](https://caddyserver.com/docs/caddyfile/directives/tls#client_auth) no longer applies to more specific hostnames that have their own site blocks.** For example, `public.example.com` no longer inherits mTLS from `*.example.com`. If you were counting on that inheritance, configure `client_auth` on the specific site explicitly. (#7920)\r\n- **Stricter config validation.** Some configs that used to be silently accepted (and probably didn't do what you expected) are now errors:\r\n  - duplicate `named_routes` (#7800)\r\n  - duplicate `forward_auth` `uri` (#7814)\r\n  - invalid `weighted_round_robin` weights (#7807)\r\n  - a non-integer `browse` `file_limit` (#7988)\r\n  - duplicate or ambiguous `map` inputs (#8067)\r\n  - malformed `map` destination placeholders (#8074)\r\n  - module paths with ambiguous `@` version separators (#7974)\r\n- **Admin API [`/load`](https://caddyserver.com/docs/api#post-load)** now returns `400` with warnings inside a valid JSON body when a config is invalid. Before, it returned `200` with two concatenated JSON objects. (#7267)\r\n- **[`method`](https://caddyserver.com/docs/caddyfile/matchers#method) matcher values are normalized to uppercase**, so `method get` now matches `GET` requests. (#7832)\r\n\r\n## Security fixes\r\n\r\nThank you to everyone who reported responsibly and helped with patches:\r\n\r\n- reverseproxy: When a route used both [`forward_auth`](https://caddyserver.com/docs/caddyfile/directives/forward_auth) and [`reverse_proxy`](https://caddyserver.com/docs/caddyfile/directives/reverse_proxy), a request could be sent on the wrong upstream connection. Reported by @carlt, fixed by @WeidiDeng. (GHSA-6365-7ppr-5r92, #7859)\r\n- reverseproxy: Hop-by-hop headers from upstreams are now stripped from `101 Switching Protocols` responses too. Thanks @jirn073-76.\r\n- caddyhttp: [`handle_path`](https://caddyserver.com/docs/caddyfile/directives/handle_path) and [`uri`](https://caddyserver.com/docs/caddyfile/directives/uri) `strip_prefix`/`strip_suffix` now canonicalize the resulting path, so it can't bypass path-based authorization. Thanks @steadytao.\r\n- caddyhttp: Extended the 2.11.4 header-alias filter to `.` (see above) to prevent bypassing `forward_auth copy_headers` with PHP/FastCGI backends. Thanks @dunglas.\r\n- caddyhttp: The [`path_regexp`](https://caddyserver.com/docs/caddyfile/matchers#path-regexp) matcher now normalizes Windows backslashes like the `path` matcher does. This completes the fix for CVE-2026-52844. Thanks @thientd. (#7858)\r\n- fileserver: Windows 8.3 short names are rejected in every path component, not just the last one. Thanks @DavidCarliez. (#7952)\r\n- fileserver: Fixed ETag collisions between files with different modification times and sizes. Thanks @dunglas.\r\n- fastcgi: The client's `Proxy` header is no longer passed to backends as `HTTP_PROXY` (HTTPoxy). Thanks @bzyy1024. (#7934)\r\n- reverseproxy: Sticky session cookie hashes are compared in constant time. Thanks @alhudz. (#7853)\r\n- admin: Request paths are normalized in the remote admin access check, and origin/host allow-lists compare case-insensitively (defense-in-depth). Thanks @AmariahAK, @mohammed90, and @hktitof. (#7910, #7973, #7993)\r\n- caddyhttp: Oversized request bodies used through placeholders now correctly return `413`. Thanks @hktitof. (#7969)\r\n\r\n:warning: These security patches may be breaking if your application relies on the buggy behaviors.\r\n\r\n:rotating_light: **Notice for Caddy plugin maintainers: Dependabot will probably alert you to the security fixes in Caddy and urge you to upgrade it in your `go.mod` file. Please ONLY upgrade the Caddy dependency if there's a change to an exported API your plugin uses.** Note that doing so now also requires Go 1.26.\r\n\r\nThank you to everyone who was involved this release, especially our 40 new contributors! :tada:\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n## What's Changed\r\n* reverseproxy: replace placeholders specified for sni while using http3 by @WeidiDeng in https://github.com/caddyserver/caddy/pull/7737\r\n* caddyhttp: add {http.request.proto_name} placeholder for spec-compliant protocol names by @Jualhosting in https://github.com/caddyserver/caddy/pull/7782\r\n* httpcaddyfile: error on duplicate named_routes by @vijayvenkatj in https://github.com/caddyserver/caddy/pull/7800\r\n* cmd: colored error message in WrapCommandFuncForCobra (#7760) by @u5surf in https://github.com/caddyserver/caddy/pull/7768\r\n* chore: add missing \"is\" in SECURITY.md by @AliMickey in https://github.com/caddyserver/caddy/pull/7802\r\n* reverseproxy: validate on weighted_round_robin loadbalancing policy by @vijayvenkatj in https://github.com/caddyserver/caddy/pull/7807\r\n* forwardauth: error on duplicate uri subdirective by @vijayvenkatj in https://github.com/caddyserver/caddy/pull/7814\r\n* encode: add standard benchmark and conformance harness by @ottenhoff in https://github.com/caddyserver/caddy/pull/7804\r\n* caddyhttp: restore allow_underscore_in_headers server option by @bluegate-studio in https://github.com/caddyserver/caddy/pull/7809\r\n* rewrite: fix wrong index check in trimPathPrefix by @alhudz in https://github.com/caddyserver/caddy/pull/7812\r\n* intercept: fix replace_status being silently dropped by @oksusucha in https://github.com/caddyserver/caddy/pull/7810\r\n* fileserver: append repeated hide subdirectives instead of overwriting by @luccinmasirika in https://github.com/caddyserver/caddy/pull/7817\r\n* rewrite: scope keyed query replace to its named key by @alhudz in https://github.com/caddyserver/caddy/pull/7818\r\n* reverseproxy: log status 499 instead of 0 when client disconnects by @larrasket in https://github.com/caddyserver/caddy/pull/7827\r\n* tracing: fix BatchSpanProcessor goroutine leak on config reload by @Dean2026 in https://github.com/caddyserver/caddy/pull/7826\r\n* caddyhttp: normalize method names to uppercase in MatchMethod.Provision by @yintaisha in https://github.com/caddyserver/caddy/pull/7832\r\n* caddyhttp: add URL pattern request matcher by @dunglas in https://github.com/caddyserver/caddy/pull/7787\r\n* caddyhttp: fix escaped path matcher over-matching longer paths by @alhudz in https://github.com/caddyserver/caddy/pull/7828\r\n* core: preserve metrics registry in Context.WithValue by @dunglas in https://github.com/caddyserver/caddy/pull/7861\r\n* reverseproxy: compare sticky-session cookie hash in constant time by @alhudz in https://github.com/caddyserver/caddy/pull/7853\r\n* reverseproxy: fix misleading handle_response error for extra matcher args by @TowyTowy in https://github.com/caddyserver/caddy/pull/7869\r\n* reverseproxy: save dial info in a context key instead of a variable k\u2026 by @WeidiDeng in https://github.com/caddyserver/caddy/pull/7859\r\n* caddyhttp: fix path_regexp (MatchPathRE) Windows backslash bypass by @thientd in https://github.com/caddyserver/caddy/pull/7858\r\n* intercept: fix misleading handle_response error for extra matcher args by @TowyTowy in https://github.com/caddyserver/caddy/pull/7871\r\n* build(deps): bump cel-go from v0.28.1 to v0.29.2 by @techknowlogick in https://github.com/caddyserver/caddy/pull/7872\r\n* reverseproxy: fix broken reservoir sampling in random_choose policy by @TowyTowy in https://github.com/caddyserver/caddy/pull/7873\r\n* caddyfile: treat quoted braces as literal arguments by @elee1766 in https://github.com/caddyserver/caddy/pull/7875\r\n* logging: hash query parameter values in QueryFilter by @PichuChen in https://github.com/caddyserver/caddy/pull/7884\r\n* chore: fix sabotage spelling in nolint comments by @futurehua in https://github.com/caddyserver/caddy/pull/7892\r\n* pki: Handle error immediately after reading root from disk by @hslatman in https://github.com/caddyserver/caddy/pull/7896\r\n* log: support `d` (day) in `roll_interval` directive by @mohammed90 in https://github.com/caddyserver/caddy/pull/7900\r\n* deps: update GitHub Actions and Go modules by @steadytao in https://github.com/caddyserver/caddy/pull/7876\r\n* build(deps): bump google.golang.org/grpc from 1.81.1 to 1.82.1 by @dependabot[bot] in https://github.com/caddyserver/caddy/pull/7908\r\n* core: reduce QUIC initial packet size for low-MTU paths by @Salynn in https://github.com/caddyserver/caddy/pull/7886\r\n* rewrite: preserve non-canonical path encoding after uri replace by @larrasket in https://github.com/caddyserver/caddy/pull/7907\r\n* caddyhttp: use canonical header key casing to avoid re-canonicalization by @dunglas in https://github.com/caddyserver/caddy/pull/7911\r\n* caddyconfig: Register nested named-route invokes transitively by @SillyZir in https://github.com/caddyserver/caddy/pull/7898\r\n* encode: reduce allocations in AcceptedEncodings by @jvoisin in https://github.com/caddyserver/caddy/pull/7847\r\n* encode: flush headers immediately for server-sent events responses by @SillyZir in https://github.com/caddyserver/caddy/pull/7905\r\n* fileserver: speed up directory browsing for large directories by @firefart in https://github.com/caddyserver/caddy/pull/7903\r\n* caddyauth: isolate provider responses to prevent cross-provider clobbering by @SillyZir in https://github.com/caddyserver/caddy/pull/7904\r\n* log: don't allow overwriting singly-assigned vals by @mohammed90 in https://github.com/caddyserver/caddy/pull/7927\r\n* caddyconfig: cancel HTTP loader requests with context by @cuishuang in https://github.com/caddyserver/caddy/pull/7918\r\n* feat(fastcgi): populate SERVER_ADDR by default by @renich in https://github.com/caddyserver/caddy/pull/7912\r\n* reverseproxy: reduce allocation/CPU overhead in request hot paths by @jvoisin in https://github.com/caddyserver/caddy/pull/7925\r\n* reverseproxy: preallocate upstream slices with known sizes by @jvoisin in https://github.com/caddyserver/caddy/pull/7926\r\n* network_proxy: reject proxy URLs that resolve to a port with no host by @r0h1tb in https://github.com/caddyserver/caddy/pull/7922\r\n* caddyhttp: log recovered handler panics at ERROR level by @ousamabenyounes in https://github.com/caddyserver/caddy/pull/7924\r\n* caddyhttp: allocate the request UUID lazily instead of on every request by @jvoisin in https://github.com/caddyserver/caddy/pull/7936\r\n* caddyhttp: shield specific hostnames from a covering wildcard's client auth by @SillyZir in https://github.com/caddyserver/caddy/pull/7920\r\n* reverseproxy: isolate active health-check state per distinct check config by @SillyZir in https://github.com/caddyserver/caddy/pull/7916\r\n* logging: add set_cookie log filter for Set-Cookie response headers by @steffenbusch in https://github.com/caddyserver/caddy/pull/7888\r\n* caddyhttp: fix url_pattern authorization bypass via encoded-slash traversal by @dunglas in https://github.com/caddyserver/caddy/pull/7941\r\n* fix: close resources on error paths by @ittakestwo123 in https://github.com/caddyserver/caddy/pull/7940\r\n* fastcgi: fix HTTPoxy vulnerability by @bzyy1024 in https://github.com/caddyserver/caddy/pull/7934\r\n* caddyhttp: mitigate slowloris via idle read/write deadlines by @dunglas in https://github.com/caddyserver/caddy/pull/7913\r\n* chore: fix lint errors from newer golangci-lint by @faiyazrahmann in https://github.com/caddyserver/caddy/pull/7958\r\n* pki: honor skip_install_trust for explicit tls internal issuers by @gautamrizwani in https://github.com/caddyserver/caddy/pull/7894\r\n* caddyfile: clarify ArgErr documentation by @0jaspahwa in https://github.com/caddyserver/caddy/pull/7960\r\n* rewrite: fix URI splitting when a query or fragment arrives via a placeholder by @francislavoie in https://github.com/caddyserver/caddy/pull/7947\r\n* admin: normalize request path in remote admin access-control check (defense-in-depth) by @AmariahAK in https://github.com/caddyserver/caddy/pull/7910\r\n* fileserver: reject short names in every path component by @DavidCarliez in https://github.com/caddyserver/caddy/pull/7952\r\n* rewrite: fix strip_path_suffix ignoring percent-encoding by @TowyTowy in https://github.com/caddyserver/caddy/pull/7877\r\n* admin: stabilise log redaction test by @steadytao in https://github.com/caddyserver/caddy/pull/7942\r\n* chore: fix canonicalheader failures by @steadytao in https://github.com/caddyserver/caddy/pull/7964\r\n* cmd: upgrade automemlimit to v1.0.0 by @dunglas in https://github.com/caddyserver/caddy/pull/7978\r\n* caddy: fix ParseNetworkAddress port-range span off-by-one by @mohammed90 in https://github.com/caddyserver/caddy/pull/7975\r\n* usagepool: avoid lock inversion after constructor failure by @kojah in https://github.com/caddyserver/caddy/pull/7968\r\n* cmd: reject ambiguous module version separators by @mohammed90 in https://github.com/caddyserver/caddy/pull/7974\r\n* admin: fix origin allow-list host comparison to be case-insensitive by @mohammed90 in https://github.com/caddyserver/caddy/pull/7973\r\n* caddyfile: fix importGraph self-loop and stale-edge bugs by @mohammed90 in https://github.com/caddyserver/caddy/pull/7971\r\n* caddyhttp: remove unused QUICConfig from the HTTP/3 server by @faiyazrahmann in https://github.com/caddyserver/caddy/pull/7980\r\n* fileserver: reject non-integer browse file_limit by @SashaMIT in https://github.com/caddys