ic-output by @harehare in https://github.com/harehare/mq/pull/2299\r\n* \u2728 feat(mq-chrome-extension): auto-run queries with copy/download and shortcuts by @harehare in https://github.com/harehare/mq/pull/2266\r\n* \u2728 feat(mq-lang): add top_by, stats_by, histogram, and table nest/unnest helpers by @harehare in https://github.com/harehare/mq/pull/2257\r\n* \u2728 feat(mq-lang): add stack-based bytecode VM behind tarn feature by @harehare in https://github.com/harehare/mq/pull/2267\r\n* \u2728 feat(mq-lang): add strip_ansi builtin function by @harehare in https://github.com/harehare/mq/pull/2293\r\n* \u2728 feat(mq-lang): add shell_quote builtin for POSIX shell escaping by @harehare in https://github.com/harehare/mq/pull/2294\r\n* \u2728 feat(mq-lang): add unzip builtin function by @harehare in https://github.com/harehare/mq/pull/2298\r\n* \u2728 feat(mq-run): add --csv-delimiter and --no-header CLI flags by @harehare in https://github.com/harehare/mq/pull/2258\r\n* \u2728 feat(mq-run): transparently decompress .gz input files by @harehare in https://github.com/harehare/mq/pull/2259\r\n* \u2728 feat(mq-run): add --compact flag for single-line JSON output by @harehare in https://github.com/harehare/mq/pull/2268\r\n* \u2728 feat(mq-run): expand unmatched glob patterns in file arguments by @harehare in https://github.com/harehare/mq/pull/2279\r\n* \u2728 feat(mq-run): infer -F from -o extension, add -T/--format shortcut by @harehare in https://github.com/harehare/mq/pull/2281\r\n* \u2728 feat(mq-run): add --indent/--tab options for JSON and XML output by @harehare in https://github.com/harehare/mq/pull/2292\r\n* \u2728 feat(mq-web-api): add opt-in API key auth with scopes and per-key rate limits by @harehare in https://github.com/harehare/mq/pull/2262\r\n* \u2728 feat(mq-web-api): add request body size limit and HTTP request timeout by @harehare in https://github.com/harehare/mq/pull/2282\r\n\r\n### Fixes\r\n\r\n* fix(cli): correct the -U help example's in-place and untouched claims by @mp-grind in https://github.com/harehare/mq/pull/2297\r\n* \ud83d\udc1b fix(help): register `nodes` keyword so `mq help nodes` resolves by @harehare in https://github.com/harehare/mq/pull/2300\r\n* \ud83d\udc1b fix(mq-run): prevent orphaned mq --watch process on test panic by @harehare in https://github.com/harehare/mq/pull/2278\r\n\r\n### Documentation\r\n\r\n* docs: add Helix syntax highlighting setup guide by @harehare in https://github.com/harehare/mq/pull/2286\r\n\r\n### Refactoring\r\n\r\n* \u267b\ufe0f refactor(mq-lang): clean up tarn VM compiler error messages and dead_code by @harehare in https://github.com/harehare/mq/pull/2305\r\n\r\n### Performance\r\n\r\n* \u26a1 perf(mq-lang): shrink RuntimeValue and avoid Vec allocation for builtin args by @harehare in https://github.com/harehare/mq/pull/2253\r\n\r\n### Test\r\n\r\n* \u2705 test(mq-run): fix wrap-dependent assertion in blocked-read repl test by @harehare in https://github.com/harehare/mq/pull/2277\r\n\r\n### Dependency Updates\r\n\r\n* build(deps): bump taiki-e/install-action from 2.86.3 to 2.86.4 in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2261\r\n* build(deps): bump rust from 1.97.1-slim to 1.98.0-slim in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2264\r\n* build(deps): bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2265\r\n* build(deps): bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2272\r\n* build(deps): bump the dependencies group with 4 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2273\r\n* build(deps): bump which from 8.0.5 to 8.0.6 in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2284\r\n* build(deps): bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2285\r\n* build(deps): bump taiki-e/install-action from 2.86.8 to 2.87.0 in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2289\r\n* build(deps): bump flate2 from 1.1.9 to 1.1.10 in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2291\r\n* build(deps): bump vscode-languageclient from 10.1.0 to 10.1.1 in /editors/vscode in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2301\r\n* build(deps): bump tower-http from 0.7.0 to 0.7.1 in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2303\r\n* build(deps): bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2304\r\n* build(deps-dev): bump @types/vscode from 1.125.0 to 1.134.0 in /editors/vscode in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2255\r\n* build(deps-dev): bump @babel/core from 7.29.7 to 8.0.1 in /packages/mq-playground in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2256\r\n* build(deps-dev): bump the dependencies group in /packages/mq-playground with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2260\r\n* build(deps-dev): bump @babel/core from 7.29.7 to 8.0.1 in /packages/mq-playground in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2263\r\n* build(deps-dev): bump the dependencies group in /editors/vscode with 2 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2269\r\n* build(deps-dev): bump the dependencies group in /packages/mq-web with 2 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2270\r\n* build(deps-dev): bump the dependencies group in /packages/mq-playground with 4 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2271\r\n* build(deps-dev): bump @babel/core from 7.29.7 to 8.0.1 in /packages/mq-playground in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2280\r\n* build(deps-dev): bump @babel/core from 7.29.7 to 8.0.1 in /packages/mq-playground in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2283\r\n* build(deps-dev): bump @types/node from 26.3.0 to 26.4.0 in /editors/vscode in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2287\r\n* build(deps-dev): bump the dependencies group in /packages/mq-playground with 2 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2288\r\n* build(deps-dev): bump the dependencies group in /packages/mq-playground with 2 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2290\r\n* build(deps-dev): bump @babel/core from 7.29.7 to 8.0.1 in /packages/mq-playground in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2302\r\n\r\n## New Contributors\r\n* @mp-grind made their first contribution in https://github.com/harehare/mq/pull/2297\r\n\r\n**Full Changelog**: https://github.com/harehare/mq/compare/v0.8.4...v0.8.5\r\n","mentions_count":3}
