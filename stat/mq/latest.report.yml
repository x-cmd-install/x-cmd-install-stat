ub's markdown type registration by @harehare in https://github.com/harehare/mq/pull/2436\r\n- \u2728 feat(mq-lang): add squeeze_whitespace by @harehare in https://github.com/harehare/mq/pull/2437\r\n- \u2728 feat(mq-lang): add env() builtin for environment variable access by @harehare in https://github.com/harehare/mq/pull/2441\r\n- feat(mq-lang): simplify embedded engine setup by @harehare in https://github.com/harehare/mq/pull/2448\r\n- feat(mq-lang): improve embedding support for host applications by @harehare in https://github.com/harehare/mq/pull/2449\r\n- feat(mq-lang,mq-run): add .mqc compiled bytecode format by @harehare in https://github.com/harehare/mq/pull/2451\r\n\r\n### Fixes\r\n\r\n- \ud83d\udc1b fix(mq-lang): normalize ragged Markdown table rows by @harehare in https://github.com/harehare/mq/pull/2434\r\n- \ud83d\udc1b fix(mq-lang): trim/ltrim/rtrim use a markdown node's rendered source, not its value by @harehare in https://github.com/harehare/mq/pull/2439\r\n- \ud83d\udc1b fix(mq-lang): keep full number precision and distinguish types in uniq by @harehare in https://github.com/harehare/mq/pull/2455\r\n- \ud83d\udc1b fix(mq-lang): persist top-level import/include across query session evals by @harehare in https://github.com/harehare/mq/pull/2457\r\n- \ud83d\udc1b fix(mq-lang): keep remote modules with the same name distinct by @harehare in https://github.com/harehare/mq/pull/2458\r\n- fix(mq-playground): rely on mq-wasm's native execution timeout by @harehare in https://github.com/harehare/mq/pull/2431\r\n- \ud83d\udc1b fix(mq-run): stop auto-collecting coroutines at the output boundary by @harehare in https://github.com/harehare/mq/pull/2433\r\n- \ud83d\udc1b fix(mq-run): end JSON output with a trailing newline by @harehare in https://github.com/harehare/mq/pull/2456\r\n\r\n### Documentation\r\n\r\n- \ud83d\udcdd docs: add stream and coroutine examples by @harehare in https://github.com/harehare/mq/pull/2462\r\n\r\n### Refactoring\r\n\r\n- \u267b\ufe0f refactor(mq-lang): give binary operators a dedicated AST node by @harehare in https://github.com/harehare/mq/pull/2426\r\n- \u267b\ufe0f refactor(mq-lang)!: replace CST children with typed NodeKind fields by @harehare in https://github.com/harehare/mq/pull/2442\r\n- \u267b\ufe0f refactor(mq-lang): move array() from native Rust to builtin.mq by @harehare in https://github.com/harehare/mq/pull/2446\r\n- \u267b\ufe0f refactor(mq-lang): split engine.rs into engine modules by @harehare in https://github.com/harehare/mq/pull/2459\r\n\r\n### Performance\r\n\r\n- \u26a1 perf(mq-lang): update and compare numeric locals in place by @harehare in https://github.com/harehare/mq/pull/2461\r\n- perf(tarn): build dictionary literals directly by @harehare in https://github.com/harehare/mq/pull/2450\r\n- perf(vm): avoid copies in host function dispatch by @harehare in https://github.com/harehare/mq/pull/2440\r\n- perf(vm): reuse bytecode across file global updates by @harehare in https://github.com/harehare/mq/pull/2447\r\n\r\n### Test\r\n\r\n- \u2705 test(mq-lang): fix flaky prop_default_domain_always_allowed by @harehare in https://github.com/harehare/mq/pull/2435\r\n\r\n### Dependency Updates\r\n\r\n<details>\r\n<summary>Show dependency updates</summary>\r\n\r\n- \ud83d\udce6 build(mq-chrome-extension): bump mq-web to 0.9.1 and set query timeout by @harehare in https://github.com/harehare/mq/pull/2432\r\n- build(deps-dev): bump the dependencies group in /packages/mq-playground with 2 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2443\r\n- build(deps-dev): bump @babel/core from 7.29.7 to 8.0.6 in /packages/mq-playground in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2452\r\n- build(deps): bump the dependencies group with 2 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2444\r\n- build(deps): bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2454\r\n- build(deps): bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/harehare/mq/pull/2453\r\n- build(deps): bump taiki-e/install-action from 2.87.13 to 2.87.14 in the dependencies group by @dependabot[bot] in https://github.com/harehare/mq/pull/2445\r\n\r\n</details>\r\n\r\nFull Changelog: https://github.com/harehare/mq/compare/v0.9.1...v0.9.2","mentions_count":2}
