id":772130760,"node_id":"RA_kwDON-sE7c4uBcfI","name":"mq-x86_64-unknown-linux-gnu.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":4261641,"digest":"sha256:c6b44168b50b7b75bfb7c26adc44074dde386e77e54c9348dfa8f4a9128102c0","download_count":3,"created_at":"2026-11-20T14:28:15Z","updated_at":"2026-11-20T14:28:16Z"},{"id":772130936,"node_id":"RA_kwDON-sE7c4uBch4","name":"mq-x86_64-unknown-linux-musl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":12529200,"digest":"sha256:d0b5b9fb0e0b98b178a4aa3862d7568cabc15af59af48ee569442e9d3039f703","download_count":18,"created_at":"2026-11-20T14:28:19Z","updated_at":"2026-11-20T14:28:20Z"},{"id":772130829,"node_id":"RA_kwDON-sE7c4uBcgN","name":"mq-x86_64-unknown-linux-musl.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":4048444,"digest":"sha256:e6b2b38937d4968282163145c7af8df91284b178d3a0954acbaba939573e69b7","download_count":1,"created_at":"2026-11-20T14:28:17Z","updated_at":"2026-11-20T14:28:17Z"},{"id":772130852,"node_id":"RA_kwDON-sE7c4uBcgk","name":"mq-x86_64-unknown-linux-musl.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":4365224,"digest":"sha256:b83444b87b14603125e9743e8e5ca39df3161f7fd58632a3ef98497b6e66599f","download_count":1,"created_at":"2026-11-20T14:28:17Z","updated_at":"2026-11-20T14:28:18Z"}],"body":"## What's Changed\r\n\r\n### Features\r\n\r\n* ✨ feat(check): hint min_by/max_by when min/max gets a single array by @harehare in https://github.com/harehare/mq/pull/2946\r\n* ✨ feat(cli): add --version to mq-lint and mq-check by @harehare in https://github.com/harehare/mq/pull/2962\r\n* ✨ feat(crawler): allow local files for robots_path by @harehare in https://github.com/harehare/mq/pull/2942\r\n* ✨ feat(crawler): skip non-HTML extensions before requesting by @harehare in https://github.com/harehare/mq/pull/2978\r\n* ✨ feat(docs): publish the module index as docs/modules.json by @harehare in https://github.com/harehare/mq/pull/2915\r\n* ✨ feat(ffi): add mq_define_string_value_ex and mq_define_json_value_ex by @harehare in https://github.com/harehare/mq/pull/2951\r\n* ✨ feat(ffi): add null, raw and module-backed input formats by @harehare in https://github.com/harehare/mq/pull/2968\r\n* ✨ feat(help): add --search to mq help and complete help names by @harehare in https://github.com/harehare/mq/pull/2908\r\n* ✨ feat(help): show parameters with default values as optional (name?) by @harehare in https://github.com/harehare/mq/pull/2945\r\n* ✨ feat(lang): resolve name/name.mq and search ./vendor for modules by @harehare in https://github.com/harehare/mq/pull/2860\r\n* ✨ feat(lang): add is_infinite and is_finite builtins by @harehare in https://github.com/harehare/mq/pull/2918\r\n* ✨ feat(lang): accept version strings in semver compare, sort, max and min by @harehare in https://github.com/harehare/mq/pull/2957\r\n* ✨ feat(lang): join returns empty bytes for an empty array with a bytes separator by @harehare in https://github.com/harehare/mq/pull/2990\r\n* ✨ feat(lang): add concat to join array elements one level deep by @harehare in https://github.com/harehare/mq/pull/2991\r\n* ✨ feat(lang): accept negative integers in band, bor and xor by @harehare in https://github.com/harehare/mq/pull/3007\r\n* ✨ feat(lang): point at the stray `)` when else/elif has no if, and atbor for `|` by @harehare in https://github.com/harehare/mq/pull/3008\r\n* ✨ feat(lang): assign bytes elements with b[i] = v and set by @harehare in https://github.com/harehare/mq/pull/3012\r\n* ✨ feat(lang): validate argument types in module functions by @harehare in https://github.com/harehare/mq/pull/3015\r\n* ✨ feat(lint): add assign_to_immutable rule by @harehare in https://github.com/harehare/mq/pull/2909\r\n* ✨ feat(lint): add bare_pipe_in_branch rule by @harehare in https://github.com/harehare/mq/pull/2944\r\n* ✨ feat(lint): add prefer_index_assignment for x = set(x, key, value) by @harehare in https://github.com/harehare/mq/pull/3014\r\n* ✨ feat(lsp): index unopened .mq files in workspace/symbol by @harehare in https://github.com/harehare/mq/pull/2963\r\n* ✨ feat(lsp): add spelling quickfix and source.fixAll.mq-lint code action by @harehare in https://github.com/harehare/mq/pull/2964\r\n* ✨ feat(markdown): convert iframe srcdoc to markdown in html-to-markdown by @harehare in https://github.com/harehare/mq/pull/2924\r\n* ✨ feat(repl): open the current buffer or last query in /edit by @harehare in https://github.com/harehare/mq/pull/2940\r\n* ✨ feat(run): add MQ_SANDBOX env default for --sandbox by @harehare in https://github.com/harehare/mq/pull/2838\r\n* ✨ feat(run): add tsv output format by @harehare in https://github.com/harehare/mq/pull/3004\r\n* ✨ feat(test): run doc examples with mq-test --doc by @harehare in https://github.com/harehare/mq/pull/2921\r\n* ✨ feat(test): accept directory arguments in mq-test by @harehare in https://github.com/harehare/mq/pull/2952\r\n\r\n### Fixes\r\n\r\n* 🐛 fix(check): count unresolved imports as resolve errors, not syntax errors by @harehare in https://github.com/harehare/mq/pull/2947\r\n* 🐛 fix(check): follow the branch a type guard selects when inlining a call by @harehare in https://github.com/harehare/mq/pull/2933\r\n* 🐛 fix(check): accept ordering of a union when one member pairing is ordered by @harehare in https://github.com/harehare/mq/pull/2949\r\n* 🐛 fix(crawler): resolve links and name output by the post-redirect URL by @harehare in https://github.com/harehare/mq/pull/2948\r\n* 🐛 fix(ffi): return MQ_ERR_INVALID_ARGUMENT for null C string arguments by @harehare in https://github.com/harehare/mq/pull/2891\r\n* 🐛 fix(ffi): ignore zero in mq_set_max_call_stack_depth by @harehare in https://github.com/harehare/mq/pull/2971\r\n* 🐛 fix(lang): bound multi-char string range size by exact odometer count by @harehare in https://github.com/harehare/mq/pull/2834\r\n* 🐛 fix(lang): register the html standard module without html-parse by @harehare in https://github.com/harehare/mq/pull/2839\r\n* 🔒 fix(lang): block IPv6 ranges that embed IPv4 in is_global_ip by @harehare in https://github.com/harehare/mq/pull/2859\r\n* 🐛 fix(lang): return an error for invalid strftime/to_date formats by @harehare in https://github.com/harehare/mq/pull/2879\r\n* 🐛 fix(lang): count negative indices from the end when assigning to arrays by @harehare in https://github.com/harehare/mq/pull/2880\r\n* 🐛 fix(lang): error on invalid count in repeat, word_wrap and implode by @harehare in https://github.com/harehare/mq/pull/2884\r\n* 🐛 fix(lang): validate to_md_table_cell row and column bounds by @harehare in https://github.com/harehare/mq/pull/2892\r\n* 🐛 fix(lang): hint to pass arguments as an array when system gets a command with whitespace by @harehare in https://github.com/harehare/mq/pull/2895\r\n* 🐛 fix(lang): do not cap to_md_table_cell row index at 65535 by @harehare in https://github.com/harehare/mq/pull/2900\r\n* 🐛 fix(lang): error on malformed input in csv_parse by @harehare in https://github.com/harehare/mq/pull/2901\r\n* 🐛 fix(lang): skip body reading for HEAD and 204 http responses by @harehare in https://github.com/harehare/mq/pull/2905\r\n* 🐛 fix(lang): allow attribute access after an index on self by @harehare in https://github.com/harehare/mq/pull/2906\r\n* 🐛 fix(lang): validate semver_parse input against the SemVer 2.0.0 grammar by @harehare in https://github.com/harehare/mq/pull/2917\r\n* 🐛 fix(lang): render composite YAML mapping keys in flow notation by @harehare in https://github.com/harehare/mq/pull/2936\r\n* 🐛 fix(lang): accept uppercase https:// scheme in is_https by @harehare in https://github.com/harehare/mq/pull/2939\r\n* 🐛 fix(lang): deny writes through dangling symlinks leaving the allowed paths by @harehare in https://github.com/harehare/mq/pull/2959\r\n* 🐛 fix(lang): make set_attr reject unknown attributes and invalid values by @harehare in https://github.com/harehare/mq/pull/2970\r\n* 🐛 fix(lang): support indexing bytes with b[i] by @harehare in https://github.com/harehare/mq/pull/2989\r\n* 🐛 fix(lang): bound allocations by numeric arguments, not by existing data by @harehare in https://github.com/harehare/mq/pull/3001\r\n* 🐛 fix(lang): decode bytes as UTF-8 in to_string by @harehare in https://github.com/harehare/mq/pull/3006\r\n* 🐛 fix(lint): treat index assignment as reassignment in prefer_let_over_var by @harehare in https://github.com/harehare/mq/pull/2894\r\n* 🐛 fix(lint): report while(true) and until(false) in infinite_loop by @harehare in https://github.com/harehare/mq/pull/2904\r\n* 🐛 fix(lint): reduce false positives in prefer_pipe_style and unused rules by @harehare in https://github.com/harehare/mq/pull/2914\r\n* 🐛 fix(lint): always report a range for deeply_nested diagnostics by @harehare in https://github.com/harehare/mq/pull/2932\r\n* 🐛 fix(lint): skip underscore-prefixed names in shadow_variable by @harehare in https://github.com/harehare/mq/pull/2943\r\n* 🐛 fix(lint): detect system, env and file_size in dangerous_capability_call  by @harehare in https://github.com/harehare/mq/pull/2965\r\n* 🐛 fix(lsp): return None when formatting an unopened document by @harehare in https://github.com/harehare/mq/pull/2846\r\n* 🐛 fix(lsp): return an error instead of panicking on URIs that url::Url rejects by @harehare in https://github.com/harehare/mq/pull/2847\r\n* 🐛 fix(lsp): resolve `module::member` inside its module by @harehare in https://github.com/harehare/mq/pull/2916\r\n* 🐛 fix(lsp): use UTF-16 columns for code action ranges and completion cursor by @harehare in https://github.com/harehare/mq/pull/2922\r\n* 🐛 fix(lsp): report nested documentSymbol with accurate kinds and ranges by @harehare in https://github.com/harehare/mq/pull/2923\r\n* 🐛 fix(lsp): honor includeDeclaration from reference sites by @harehare in https://github.com/harehare/mq/pull/2925\r\n* 🐛 fix(lsp): reject rename of keywords and literals by @harehare in https://github.com/harehare/mq/pull/2926\r\n* 🐛 fix(markdown): do not double-escape a heading that is only hashes by @harehare in https://github.com/harehare/mq/pull/2858\r\n* 🐛 fix(markdown): render table cell line breaks as `<br>` by @harehare in https://github.com/harehare/mq/pull/2890\r\n* 🐛 fix(markdown): keep link URLs whose prefix before a colon is not a valid scheme by @harehare in https://github.com/harehare/mq/pull/2928\r\n* 🐛 fix(markdown): join a relative <base href> onto base_url and use the first base[href] by @harehare in https://github.com/harehare/mq/pull/2937\r\n* 🐛 fix(markdown): escape line-leading markers only when they form block syntax by @harehare in https://github.com/harehare/mq/pull/3002\r\n* 🐛 fix(repl): skip history for piped stdin and report usage for bad arity by @harehare in https://github.com/harehare/mq/pull/2883\r\n* 🐛 fix(repl): name the failing file and skip duplicate paths in /load by @harehare in https://github.com/harehare/mq/pull/2919\r\n* 🐛 fix(repl): reject /env when --allow-env is not granted by @harehare in https://github.com/harehare/mq/pull/2973\r\n* 🐛 fix(run): return a miette error instead of panicking when the debugger lock is poisoned by @harehare in https://github.com/harehare/mq/pull/2929\r\n* 🐛 fix(run): skip unmatched nodes in text and csv output by @harehare in https://github.com/harehare/mq/pull/2898\r\n* 🐛 fix(test): report duplicate test function names as an error by @harehare in https://github.com/harehare/mq/pull/2941\r\n* 🐛 fix(test): fail @parametrize cases whose argument count does not match the parameters by @harehare in https://github.com/harehare/mq/pull/2938\r\n* 🐛 fix(test): fail when no tests match and name the path on coverage output errors by @harehare in https://github.com/harehare/mq/pull/2967\r\n* 🐛 fix(wasm): accept plain-object htmlToMarkdown options and quiet empty diagnostics by @harehare in https://github.com/harehare/mq/pull/2882\r\n* 🐛 fix(wasm): readable module-not-found and format() errors by @harehare in https://github.com/harehare/mq/pull/2953\r\n* 🐛 fix(wasm): report unresolved symbols in diagnostics by @harehare in https://github.com/harehare/mq/pull/2969\r\n* 🐛 fix(wasm): default all run options and treat timeoutMs 0 as no timeout by @harehare in https://github.com/harehare/mq/pull/2972\r\n\r\n### Documentation\r\n\r\n* 📝 docs: add examples for --count/--skip/--limit/--stream/-P/--error-f… by @harehare in https://github.com/harehare/mq/pull/2961\r\n* 📝 docs(cookbook): add dates and timestamps recipe by @harehare in https://github.com/harehare/mq/pull/2950\r\n* 📝 docs(cookbook): add sort-csv-rows and select-html-with-css-selectors to index by @harehare in https://github.com/harehare/mq/pull/2954\r\n* 📝 docs(help): state that markdown constructors do not escape string values by @harehare in https://github.com/harehare/mq/pull/2893\r\n* 📝 docs(io): list input and output limitations in input-and-output.md by @harehare in https://github.com/harehare/mq/pull/2980\r\n* 📝 docs(lint): add deprecated_function_call, duplicate_import and negated_condition to README rule tables by @harehare in https://github.com/harehare/mq/pull/2979\r\n* 📝 docs(modules): mark gen as available only under mq test by @harehare in https://github.com/harehare/mq/pull/2981\r\n\r\n### Refactoring\r\n\r\n* ♻  refactor(lang): make Position column u32 by @harehare in https://github.com/harehare/mq/pull/2836\r\n* ♻  refactor(lang): shrink Expr to 40 bytes and Node to 48 bytes by @harehare in https://github.com/harehare/mq/pull/2837\r\n* ♻  refactor(lang): call similar's Myers directly via text_diff by @harehare in https://github.com/harehare/mq/pull/2899\r\n* 🧹 chore(lang): dedupe error help text and remove allow(dead_code) by @harehare in https://github.com/harehare/mq/pull/2903\r\n* ♻  refactor(lang): deprecate to_date in favor of strftime by @harehare in https://github.com/harehare/mq/pull/2920\r\n* ♻  refactor(lang): return VmError::Corrupt instead of panicking on frame stack misuse by @harehare in https://github.com/harehare/mq/pull/2930\r\n* ♻  refactor(lang): drop explicit array()/dict() fast paths in the compiler by @harehare in https://github.com/harehare/mq/pull/2934\r\n* ♻  refactor(repl): remove the /copy command and the arboard dependency by @harehare in https://github.com/harehare/mq/pull/3005\r\n\r\n### Performance\r\n\r\n* ⚡ perf(lang): update captured arrays and dicts in place on index assignment by @harehare in https://github.com/harehare/mq/pull/2835\r\n* ⚡ perf(lang): short-circuit any and all on arrays and dicts by @harehare in https://github.com/harehare/mq/pull/2841\r\n* ⚡ perf(lang): skip nested coroutine scan until a coroutine exists  by @harehare in https://github.com/harehare/mq/pull/2840\r\n* ⚡ perf(lang): compute builtin dependencies lazily and scan def names faster by @harehare in https://github.com/harehare/mq/pull/2843\r\n* ⚡ perf(lang): compute builtin dependencies lazily and scan def names faster by @harehare in https://github.com/harehare/mq/pull/2845\r\n* ⚡ perf(lang): make difference, intersection and group_by linear by @harehare in https://github.com/harehare/mq/pull/2857\r\n* ⚡ perf(lang): add PathAssign node so nested index assignment is linear by @harehare in https://github.com/harehare/mq/pull/2861\r\n* ⚡ perf(lang): switch plain call frames inside the opcode loop by @harehare in https://github.com/harehare/mq/pull/2867\r\n* ⚡ perf(lang): avoid per-call frame chunk clone and pop-reverse of call args by @harehare in https://github.com/harehare/mq/pull/2927\r\n* ⚡ perf(lang): move a local on its last use when later pure arguments also read it by @harehare in https://github.com/harehare/mq/pull/2866\r\n* ⚡ perf(lang): evaluate the keys and value of an index assignment before reading the target by @harehare in https://github.com/harehare/mq/pull/2997\r\n* ⚡ perf(lang): make is_none, is_number and the other type predicates native builtins by @harehare in https://github.com/harehare/mq/pull/2996\r\n* ⚡ perf(lang): make unzip linear and stop copying the result array in section loops by @harehare in https://github.com/harehare/mq/pull/3003\r\n* ⚡ perf(markdown): presize line and root node lists by @harehare in https://github.com/harehare/mq/pull/2849\r\n* ⚡ perf(markdown): reserve top-level block and node lists up front  by @harehare in https://github.com/harehare/mq/pull/2850\r\n* ⚡ perf(markdown): speed up parsing of lines, inline spans and top-level blocks by @harehare in https://github.com/harehare/mq/pull/2976\r\n* ⚡ perf(run): speed up output, input reading and external subcommand lookup by @harehare in https://github.com/harehare/mq/pull/2977\r\n\r\n### Test\r\n\r\n* test(security): cover sandbox escape patterns (symlink chains/loops, nonexistent writes, case, --allow-run names) by @harehare in https://github.com/harehare/mq/pull/2998\r\n* ✅ test(check): accept literal field types in runtime conformance by @harehare in https://github.com/harehare/mq/pull/2958\r\n* ✅ test(lang): fix flaky cycle threshold test under sync by @harehare in https://github.com/harehare/mq/pull/2842\r\n* ✅ test(lsp): add stdio JSON-RPC integration test harness by @harehare in https://github.com/harehare/mq/pull/2966\r\n* ✅ test(markdown): add html heading cases with links and images by @harehare in https://github.com/harehare/mq/pull/2902