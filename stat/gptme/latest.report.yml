/gptme/issues/4912)) ([`5375685ed`](https://github.com/gptme/gptme/commit/5375685ed84b69c4e4bd5cb443e13f7bf3976cc8))\n - feat(subagent): report cache-aware usage breakdown on subagent results ([#4903](https://github.com/gptme/gptme/issues/4903)) ([`5e1e6378d`](https://github.com/gptme/gptme/commit/5e1e6378d8c3f52cb654ebdffc7265bd55f4f7d0))\n - feat(tui): show child progress and independent unread outcomes ([#4893](https://github.com/gptme/gptme/issues/4893)) ([`936c6770f`](https://github.com/gptme/gptme/commit/936c6770fa828c2924ff7a853452cdedf88995e9))\n - feat(hooks): warn before externally enforced session deadlines ([#4892](https://github.com/gptme/gptme/issues/4892)) ([`864c03c11`](https://github.com/gptme/gptme/commit/864c03c110359fa3512528b9e2b91df67bab7c2f))\n - feat(tui): show child agents and monitors with work overview screen ([#4557](https://github.com/gptme/gptme/issues/4557)) ([#4834](https://github.com/gptme/gptme/issues/4834)) ([`b96423106`](https://github.com/gptme/gptme/commit/b9642310618380ebe1efd8ca98e77148e4f6be4f))\n - feat(models): add Gemini 4 Hydrogen ([#4881](https://github.com/gptme/gptme/issues/4881)) ([`84c33356d`](https://github.com/gptme/gptme/commit/84c33356d8142b26e2928ae79a0d4e9654ce9e98))\n - feat(shell): promoted foreground jobs adopt their capture into the job spool ([#4663](https://github.com/gptme/gptme/issues/4663) step 3) ([#4880](https://github.com/gptme/gptme/issues/4880)) ([`e08a56792`](https://github.com/gptme/gptme/commit/e08a56792715348a7fa48207c509cba1ed7402c4))\n - feat(tui): auto-name conversations and show the name in statusline and terminal title ([#4879](https://github.com/gptme/gptme/issues/4879)) ([`1ad8fe94c`](https://github.com/gptme/gptme/commit/1ad8fe94c3a305e5c8f51d660719f082046f2042))\n - feat(memory): let memory match trigger lessons (--lessons, --lesson-dir) ([#4870](https://github.com/gptme/gptme/issues/4870)) ([`62cce2de5`](https://github.com/gptme/gptme/commit/62cce2de597a477407198a64544e4568813278ea))