ub-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":2244,"digest":"sha256:be204f6cc9abb24a5a344157705bdff8280173210742909b879edb7f08c0fc16","download_count":3,"created_at":"2026-10-15T22:10:27Z","updated_at":"2026-10-15T22:10:27Z"},{"id":645378342,"node_id":"RA_kwDOJN3IDs4md7Em","name":"latest.json","label":"latest.json","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4669,"digest":"sha256:d775fddc02fdea08191c2a73cb75b0249bc6422b9e6b08c5ea196c0962edb58e","download_count":174,"created_at":"2026-10-15T22:34:09Z","updated_at":"2026-10-15T22:34:10Z"}],"body":"These are the release notes for gptme version v0.35.1.\n\n## Contributors\n\nThanks to everyone who contributed to this release:\n\n@erikbjare, @TimeToBuildBob\n\n## Changelog\n\nChanges since v0.35.0:\n\n\n## \ud83d\udce6 gptme\n\n### \u2728 Features (1)\n\n - feat(python): run IPython in a separate Jupyter kernel process ([#4359](https://github.com/gptme/gptme/issues/4359)) ([`7dc2d7c87`](https://github.com/gptme/gptme/commit/7dc2d7c87ed23a46ae0430a116c6addb1d28aed5))\n\n### \ud83d\udc1b Fixes (4)\n\n - fix(shell): shellcheck blocks error-severity findings, hides style advice ([#4374](https://github.com/gptme/gptme/issues/4374)) ([`c2d437ea1`](https://github.com/gptme/gptme/commit/c2d437ea189001c3c024849f540e64b9f4d38340))\n - fix(tui): no blinks or jumps while a turn runs; frame-level regression tests ([#4372](https://github.com/gptme/gptme/issues/4372)) ([`4ed122a37`](https://github.com/gptme/gptme/commit/4ed122a37e8d921496f9aae5206a0ab0c6a41203))\n - fix(release): pin concrete Python for uv build in publish job ([#4370](https://github.com/gptme/gptme/issues/4370)) ([`c72b136ce`](https://github.com/gptme/gptme/commit/c72b136ce5a518d25e06c50b5b956098340d10a5))\n - fix(llm): avoid rebuilding grok client per-request; reuse HTTP session in openai-subscription ([#4365](https://github.com/gptme/gptme/issues/4365)) ([`88bc08d6b`](https://github.com/gptme/gptme/commit/88bc08d6b1d85651de374f070af14d8ed906cba0))\n\n### \ud83d\udd28 Misc (1)\n\n - chore: bump version to 0.35.1 ([`v0.35.1`](https://github.com/gptme/gptme/tree/v0.35.1))\n\n**Full Changelog**: https://github.com/gptme/gptme/compare/v0.35.0...v0.35.1\n","mentions_count":2}
