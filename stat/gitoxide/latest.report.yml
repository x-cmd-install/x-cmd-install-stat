ted_at":"2026-10-08T09:51:11Z","updated_at":"2026-10-08T09:51:12Z"},{"id":621429171,"node_id":"RA_kwDOCCL8X84lCkGz","name":"gitoxide-small-v0.60.0-x86_64-pc-windows-gnu.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4675432,"digest":"sha256:52db7b5ccd0d5f7a9b9b54c6c9e76651de6332e6fff96693b97505dd245b1122","download_count":2,"created_at":"2026-10-08T10:00:01Z","updated_at":"2026-10-08T10:00:02Z"},{"id":621406873,"node_id":"RA_kwDOCCL8X84lCeqZ","name":"gitoxide-small-v0.60.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4814052,"digest":"sha256:3ea7100271bd105a7bff3a43f9b61d51537c1f053a94e82b0371bd8a3f757309","download_count":2,"created_at":"2026-10-08T09:50:25Z","updated_at":"2026-10-08T09:50:25Z"},{"id":621457836,"node_id":"RA_kwDOCCL8X84lCrGs","name":"hashes.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4635,"digest":"sha256:696b565b99ef31437d4ee406270187ef6449074bdd2e955061215b9d6a653509","download_count":24,"created_at":"2026-10-08T10:12:58Z","updated_at":"2026-10-08T10:12:58Z"}],"body":"Headline benefits of this extra-curricular release are various security improvements,\nand greatly improved error handling and consisstency. Plumbing crates for instance will now\nuse a standard `std::error::Error` compatible error type.\n\nBesides that, the tracing of all commands was greatly improved.\n\n### Changed (BREAKING)\n\n - remove full-screen progress mode\n   <!-- agent -->\n   Full-screen progress required separate command and UI threads plus channel\n   coordination, while line progress already covers long-running commands and works\n   with independently buffered tracing.\n   \n   Remove `--progress`, `--progress-keep-open`, and the `prodash-render-tui` feature. Keep synchronous line progress as the only progress UI.\n\n### New Features\n\n - make trace output independently configurable\n   <!-- Byron -->\n   \n   Quick review only, as it's mostly about tracing and `gix` which both aren't super\n   important, and are seemingly working well. An extra agent-review couldn't\n   find anything either.\n   \n   <!-- agent -->\n   Replace the old boolean trace switch with a bounded `-t`/`--trace` counter:\n   forest INFO and DEBUG at one or two occurrences, then flat DEBUG and TRACE at\n   three or four. Keep `--threads` long-only and route tracing independently of\n   verbose and progress rendering, including commands with bespoke execution paths\n   and corpus runs.\n   \n   Initialize display tracing once before repository discovery, buffer it outside\n   `prodash`, and emit it after command and progress teardown. Format forest and\n   flat output with ANSI, then adapt the final stderr write so terminals get color\n   while pipes and `NO_COLOR` remain plain.\n   \n   Corpus worker subscribers share that sink while retaining their complete\n   JSON trace storage, and flat modes include completed spans. `gix tix` remains\n   delegated to Tix so it installs only one subscriber.\n - add and remove linked worktrees from the CLI\n   <!-- Byron -->\n   \n   rubber-stamp mostly for gitoxide-core changes, did look at it though\n   just to be sure.\n   \n   Journey test was present but removed.\n   \n   <!-- agent -->\n   The CLI previously exposed only worktree listing, despite `gix` supporting\n   both checkout and safe removal. Add `worktree add` (alias `create`) and\n   `worktree remove` using those APIs.\n   \n   Creation follows Git's local-branch and detached-revision selection, including\n   destination-basename defaults and `-b`. It retains new branches after setup\n   failures, uses the existing listing format on success, and reports incomplete\n   checkouts. Removal maps repeated `-f` flags to dirty-worktree and lock overrides\n   while retaining branches.\n   \n   Both commands use the existing repository, configuration, and progress options.\n   Unsupported JSON output is rejected before mutation.\n\n### Commit Statistics\n\n - 12 commits contributed to the release over the course of 9 calendar days.\n - 13 days passed between releases.\n - 3 commits were understood as [conventional](https://www.conventionalcommits.org).\n - 0 issues like '(#ID)' were seen in commit messages\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n * **Uncategorized**\n    - Merge pull request #3032 from GitoxideLabs/sec-audit (1d7bac7)\n    - Merge pull request #2938 from GitoxideLabs/tix-improvements (ac6e89f)\n    - Address review feedback about gix tix dispatch (5295bfb)\n    - Merge pull request #3033 from GitoxideLabs/gix-cli-progress-cleanup (80f4b03)\n    - Remove full-screen progress mode (624ddcd)\n    - Make trace output independently configurable (bc278ac)\n    - Merge pull request #3022 from GitoxideLabs/release-testtools (f819565)\n    - Merge pull request #3029 from cruessler/fix-minor-sha-256-issues-in-cli (6c12f2d)\n    - Add SHA-256 to `AsHashKind` (106db87)\n    - Don't hardcode hash in `gix free index` (a8e3143)\n    - Merge pull request #3025 from GitoxideLabs/worktree-create (acf906f)\n    - Add and remove linked worktrees from the CLI (ca0473a)\n</details>\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
