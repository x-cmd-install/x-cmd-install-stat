{"id":422834965,"author":{"login":"Byron","id":63622,"node_id":"MDQ6VXNlcjYzNjIy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCCL8X84ZM_MV","tag_name":"gix-testtools-v0.22.0","target_commitish":"main","name":"gix-testtools v0.22.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-24T16:08:04Z","updated_at":"2026-10-24T16:08:18Z","published_at":"2026-10-24T16:08:18Z","assets":[],"body":"### Chore\n\n - make docs-rs work, and publishing\n\n### New Features\n\n - add `rename()` for replacing read-only fixture files\n   I removed a lot of tests for that, assuming it's trivial enough to get right\n   and existing tests that use it are proof of function enough.\n   \n   <!-- agent -->\n   Git creates read-only commit-graph files. On Windows, this also prevents\n   replacing them with `std::fs::rename()`, requiring fixture setup to clear\n   the destination's read-only attribute first.\n   \n   Add `gix_testtools::rename()` to retry permission-denied renames after\n   clearing that attribute. Other platforms retain `std::fs::rename()`\n   behavior. Document that callers must use writable fixtures or fixture\n   initialization and release memory mappings before replacing backing files.\n - Trace Bash fixture commands without changing captured baselines\n   <!-- agent -->\n   A flaky Windows fetch test failed while generating `make_remote_repos.sh`,\n   before the worktree assertions ran. The fixture output stopped after cloning\n   `credential-helpers`, leaving no failing command or process exit status to\n   explain the abort. Expected merge conflicts earlier in the script further\n   obscured where setup actually failed.\n   \n   Enable `set -x` by default for `.sh` fixtures on Bash 4.1 and newer. Route\n   traces through `BASH_XTRACEFD` to a duplicate of the original stderr, so\n   commands that redirect stderr into fixture baselines do not capture tracing\n   output. Keep successful fixture generation quiet by retaining the runner's\n   existing policy of printing captured output only on failure.\n   \n   Bash 3.2, including the version shipped with macOS, cannot redirect xtrace\n   independently of stderr. Use an inherited `ERR` trap there to report the\n   failed command, script location, and status through the same descriptor.\n   Include the subprocess exit status in the runner's error on every platform.\n   \n   Add coverage for silent command lookup failures, unchanged redirected stderr\n   baselines, and exit statuses in fixture errors. This improves diagnosis; it\n   does not identify or fix the original Windows flake.\n - add symlink preflight for Bash fixtures\n   <!-- Byron -->\n   \n   Careful refackiew, only the tests were mostly waved through as they\n   are known to be super thorough. Only their style needs checking, which\n   was fine here.\n   \n   <!-- agent -->\n   Fixtures that require symbolic links need to distinguish unavailable symlink\n   creation on the host from broken fixture setup. Otherwise, tests either fail\n   on unsupported filesystems or risk hiding unrelated errors when skipping.\n   \n   Inject `gix_testtools_require_symlinks` into Bash fixtures to probe creation\n   of a real link before generating contents. Record the outcome at the fixture\n   root and stop successfully when links are unavailable. Tests can then use\n   `fixture_has_symlinks()` to skip explicitly; missing or malformed results,\n   unexpected `ln` exits, copied files, and later setup failures remain errors.\n   \n   Preserve script arguments and Bash 3.2 source context without exporting the\n   helper to child shells. Include the prelude in cache keys for fixtures using\n   the probe, and document archive and writable-fixture constraints.\n - redact unstable values in diagnostic snapshots\n   <!-- agent -->\n   Complete error snapshots expose useful context and causes, but temporary\n   paths, dynamically assigned ports, object IDs, and platform-specific I/O\n   messages make their output unstable.\n   \n   Add `redact_debug_snapshot()` to apply explicit replacements, reuse object-ID\n   normalization, and render OS errors by their portable `ErrorKind`. Handle\n   plain and debug-escaped Windows paths while retaining meaningful suffixes\n   and unrelated backslashes. Return an owned `Debug` value so `insta` displays\n   the diagnostic without additional quoting or newline escaping.\n   \n   Cover redaction, object identity, and OS error formatting, and convert the\n   environment, SBOM argument, and Rust fixture error assertions to complete\n   inline snapshots. The helper is available before downstream diagnostic\n   snapshot migrations need it.\n\n### Bug Fixes\n\n - Make checkout safety fixtures reliable on Windows\n   <!-- agent -->\n   The traversal fixture rewrites `.git/index` to install paths Git would not\n   normally accept. MSYS `sed` reads that binary index in text mode, removing\n   carriage returns from incidental CRLF bytes in its stat data. Variable\n   timestamps make the resulting corruption intermittent. Setting the mtime to\n   `2000-11-01T12:31:06Z` (`0x3a000d0a`) reproduced the reported\n   `U git/hooks/pre-commit` and unresolved-conflict error exactly.\n   \n   Use Perl with binary standard streams and literal path substitution, which\n   also works on systems without `sed -b`. Keep the CRLF-containing timestamp\n   in every generated repository so text-mode index corruption is exercised\n   deterministically by the existing checkout safety tests.\n   \n   The same log's long-path warnings come from a relative `XDG_CONFIG_HOME`\n   being reinterpreted after the fixture changes directories. Make the isolated\n   configuration path absolute, and exercise both absolute and relative fixture\n   roots by checking that Git still reads the intended attributes after `cd`.\n   \n   Validated on Windows with Git `2.55.0.windows.3`:\n - Keep rust workspace tests inside disposable repositories and isolated environments\n   <!-- agent -->\n   Direct Git launches inherited repository selectors and user configuration even\n   when tests supplied a fixture working directory. Tests of default-environment\n   APIs and local Git transports also shared the runner's environment. A few\n   journey tests wrote beneath source directories or used the source checkout as\n   the repository under test.\n   \n   Use the shared `gix-testtools` Git command builder for subprocess setup, isolated\n   repository options for fixtures, and isolated child processes where the real\n   environment-reading API must be exercised. Scope CWD changes, copy the fixture\n   used by an object-write test, and run shell journeys through `jtt run`. Keep\n   journey worktrees and example output within their disposable sandboxes and\n   replace the attributes checkout test with a representative fixture repository.\n   Prompt examples also run in isolated children and must build successfully; the\n   old tests could ignore build failures and execute stale cached binaries.\n   \n   The affected Rust crate suites, internal test-tool build, and `max-pure` journey\n   suite pass from a source copy without Git metadata. Signing and Git-daemon\n   checks use only disposable keys, repositories, and local sockets.\n - isolate fixtures from inherited Git templates\n   <!-- agent -->\n   Fixture commands already ignore external Git configuration, but inherited\n   `GIT_TEMPLATE_DIR` could still inject personal template files into repositories\n   created by `git init`, making fixtures depend on the caller's environment.\n   \n   Clear that variable in the shared command setup used by fixture scripts and\n   isolated Git helpers. Keep Git's installed templates available because existing\n   fixtures rely on their standard files and directory layout.\n   \n   Document the isolation behavior and add a regression that supplies an external\n   template containing a marker file, then verifies that `git init` does not copy\n   it into the fixture repository.\n - keep fixture scripts isolated when they set GIT_CONFIG_COUNT themselves\n   The isolation configuration (no signing, no auto-maintenance, `init.defaultBranch=main`)\n   reached scripts only as `GIT_CONFIG_COUNT` variables, so a script exporting its own\n   `GIT_CONFIG_COUNT` replaced all of it. With maintenance back on, each commit in such a\n   script spawned a detached `git maintenance run --auto` that could outlive the script and\n   mutate the fixture while it was being copied, failing tests with a bare ENOENT.\n   \n   - the isolation now lives in a global configuration file under\n     `tests/fixtures/generated-do-not-edit/`, written once per process; a script's own\n     `GIT_CONFIG_COUNT` layers on top of it\n   - ambient `GIT_CONFIG_COUNT` is removed from the script environment, as it used to be\n     overwritten\n   - a script or `git()` call that writes global configuration fails with a clear message\n     and the file is restored, so the mistake stays contained to the offender\n\n### Changed (BREAKING)\n\n - raise MSRV to Rust 1.88\n   <!-- agent -->\n   The newly published `dua-core` 3.3 release used by linked-worktree removal\n   requires Rust 1.88, so raise every workspace crate and the advertised badge\n   together.\n   \n   Keep the MSRV checks buildable by selecting the latest `sysinfo` and `rusqlite`\n   release lines that support Rust 1.88.\n\n### Commit Statistics\n\n - 42 commits contributed to the release over the course of 62 calendar days.\n - 62 days passed between releases.\n - 10 commits were understood as [conventional](https://www.conventionalcommits.org).\n - 0 issues like '(#ID)' were seen in commit messages\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n * **Uncategorized**\n    - Merge pull request #3083 from GitoxideLabs/report-october (e87b6ee)\n    - Release gix-error v0.5.2, gix-date v0.18.1, gix-actor v0.44.1, gix-trace v0.3.1, gix