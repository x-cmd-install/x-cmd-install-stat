eated_at":"2026-11-23T03:38:43Z","updated_at":"2026-11-23T03:38:50Z"},{"id":781386564,"node_id":"RA_kwDOCCL8X84ukwNE","name":"gitoxide-small-v0.62.0-x86_64-pc-windows-gnu.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5788195,"digest":"sha256:4ec1bf169a2c070edf694a80653898228ba40be478312e90c463233c27f38588","download_count":2,"created_at":"2026-11-23T03:34:22Z","updated_at":"2026-11-23T03:34:23Z"},{"id":781393747,"node_id":"RA_kwDOCCL8X84ukx9T","name":"gitoxide-small-v0.62.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6015177,"digest":"sha256:74776f6b15ed3db2da4a5c85417037cec3cf4c6415bbda2263b8979b7f389410","download_count":5,"created_at":"2026-11-23T03:37:18Z","updated_at":"2026-11-23T03:37:18Z"},{"id":781438804,"node_id":"RA_kwDOCCL8X84uk89U","name":"hashes.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4635,"digest":"sha256:5f22fdf56487e59341bea5084251903331b2ebb7f60ed6fa923844dd839417f7","download_count":19,"created_at":"2026-11-23T03:56:05Z","updated_at":"2026-11-23T03:56:05Z"}],"body":"Headline benefits of this extra-curricular release are various security improvements,\nand greatly improved error handling and consisstency. Plumbing crates for instance will now\nuse a standard `std::error::Error` compatible error type.\n\nBesides that, the tracing of all commands was greatly improved.\n\n### Changed\n\n- require Rust 1.91 for CLI tooling\n  <!-- agent -->\n  Keep `gix` and its plumbing on Rust 1.88. The supported library API does not\n  require a broad move to Rust 1.99, as experimental module gates can use\n  inline bodies with `include!` on the existing MSRV.\n  \n  Declare Rust 1.91 for `gitoxide`, `gix-tix`, and `internal-tools` to match\n  the tooling dependencies, and make `gitoxide-core`'s Rust 1.88 requirement\n  explicit. Document the per-crate MSRV policy and express Tix's existing\n  seven-day log retention with `Duration::from_hours`.\n\n### New Features\n\n- set repository trust with `--repo-trust`\n  <!-- agent -->\n  Let CLI users compare how repository configuration behaves at different\n  trust levels. Use `full` or `reduced` to supply initial trust, or\n  `force-full` or `force-reduced` to set the final level.\n  \n  Print the effective trust level in `gix env` when the selected repository\n  can be opened.\n- add `gix notify`, `gix watch`, and self-spawning `gix fsmonitor`\n  A very straightforward implementation of the subcommands above. By the book,\n  nothing special, and all working nicely.\n  \n  <!-- agent -->\n  Expose filesystem notifications, repository invalidations, and Git-compatible\n  filesystem monitor control through the installed `gix` binary. These commands\n  make native coverage and recovery observable and let applications exercise the\n  public `gix` APIs against real worktrees.\n  \n  `gix notify` observes files and multiple directory roots without Git discovery.\n  Print event and path kinds, loss, diagnostics, coverage generations, and\n  publication sequences. Expose recursion, queue limits, drain budgets, and root\n  check intervals. Bounded wakeups drive delivery, and interruption between\n  batches permits graceful teardown under sustained filesystem activity.\n  \n  Move the repository notification example into `gix watch`. Report metadata and\n  worktree invalidations, checkout inventory, linked-worktree lifecycle changes,\n  watcher statistics, and recovery diagnostics. Expose coverage, debounce, burst\n  latency, retry, and idle-wait controls. Stream output immediately, including\n  with `-v`, and release watches on Ctrl-C.\n  \n  `gix fsmonitor` adapts the public daemon API for foreground service, detached\n  startup, status, shutdown, flush, binary token queries, endpoint inspection,\n  and Git hook-v2 autostart. Reexecute the running binary as `fsmonitor run` and\n  forward configuration overrides. Shared daemon facilities preserve repository\n  identity, wait for native child readiness, and clean up unsuccessful startup.\n  The standalone executable supplies its own adapter and starts itself too.\n  Resolve remote-worktree policy and startup timing from trusted repository\n  configuration, and carry the resolved values into the detached child.\n  \n  Share packet framing between blocking clients and servers and their async\n  adapters. Preserve binary payloads, cumulative limits, interrupted-read retries,\n  and timeout or connection errors. Use one Windows pipe-name transformation for\n  all transports, retaining native wide characters and rejecting NUL bytes.\n  Use standard file opening for Windows client handles and `rustix` for Unix\n  session creation and macOS filesystem classification, preserving validation\n  errors, native I/O causes, and inspection context.\n  \n  Expose endpoint selection for already-canonical paths so repository daemon\n  contexts avoid resolving them twice. Unresolved paths still use the original\n  helper, which resolves the worktree only when a remote endpoint needs it.\n  Tests cover equivalent endpoint selection and local Git-directory paths that\n  do not require a worktree.\n  \n  Keep all CLI commands blocking when async library features are unified; normal\n  default and `small` builds remain Tokio-free. Enable the workspace lint policy\n  for `gix-imara-diff` with matching code, test, and provenance adaptations, and\n  remove unused `fs-err` feature, dependency, and lockfile wiring.\n  \n  Document debugging controls, daemon lifecycle, hook setup, and platform\n  requirements. Isolated integration tests cover live output, Ctrl-C, multiple\n  roots, daemon control and tokens, Git hook status parity, linked worktrees,\n  configuration forwarding, symlink-dependent includes, and idle shutdown.\n\n### Commit Statistics\n\n- 23 commits contributed to the release.\n- 31 days passed between releases.\n- 3 commits were understood as [conventional](https://www.conventionalcommits.org).\n- 0 issues like '(#ID)' were seen in commit messages\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n- **Uncategorized**\n  - Release gix-error v0.5.3, gix-macros v0.2.2, gix-date v0.19.0, gix-actor v0.45.0, gix-trace v0.3.2, gix-validate v0.13.2, gix-path v0.14.2, gix-utils v0.5.3, gix-quote v0.10.2, gix-command v0.12.2, gix-hash v0.29.0, gix-hashtable v0.19.0, gix-parallel v0.50.2, gix-fs v1.0.0, gix-tempfile v27.0.0, gix-object v0.67.0, gix-glob v0.30.0, gix-attributes v0.38.0, gix-zlib v0.4.1, gix-encoding v0.1.0, gix-packetline v0.24.2, gix-filter v0.37.0, gix-chunk v0.10.2, gix-commitgraph v0.43.0, gix-revwalk v0.39.0, gix-traverse v0.65.0, gix-worktree-stream v0.40.0, gix-archive v0.40.0, gix-bitmap v0.6.2, gix-lock v27.0.0, gix-index v0.59.0, gix-config-value v0.21.2, gix-pathspec v0.23.0, gix-ignore v0.25.0, gix-worktree v0.60.0, gix-imara-diff v0.3.4, gix-diff v0.71.0, gix-blame v0.21.0, gix-ref v0.70.0, gix-sec v0.17.0, gix-config v0.63.0, gix-prompt v0.19.2, gix-url v0.41.0, gix-credentials v0.43.0, gix-discover v0.58.0, gix-dir v0.33.0, gix-fsck v0.28.0, gix-notify v0.1.0, gix-fsmonitor v0.1.0, gix-mailmap v0.36.2, gix-revision v0.53.0, gix-merge v0.24.0, gix-negotiate v0.39.0, gix-note v0.4.0, gix-pack v0.78.0, gix-odb v0.88.0, gix-refspec v0.48.0, gix-shallow v0.16.0, gix-transport v0.63.0, gix-protocol v0.69.0, gix-status v0.38.0, gix-submodule v0.37.0, gix-worktree-state v0.38.0, gix v0.91.0, gitoxide-core v0.65.0, gix-tix v0.7.0, gitoxide v0.62.0, safety bump 44 crates (df27410)\n  - Merge pull request #3220 from GitoxideLabs/trust-in-CLI (689a724)\n  - Set repository trust with `--repo-trust` (dd5e45b)\n  - Merge pull request #3028 from GitoxideLabs/repo-sharing-permissions (a77e8d4)\n  - Merge pull request #3191 from GitoxideLabs/notify-and-more (ab7c5dc)\n  - Add `gix notify`, `gix watch`, and self-spawning `gix fsmonitor` (5d2b983)\n  - Merge pull request #3211 from GitoxideLabs/jiff-upgrade (12eff45)\n  - Merge pull request #3187 from trevorlasn/status-macos-thread-cap (8118e5e)\n  - Review (6f51b5c)\n  - Merge pull request #3036 from ameyypawar/merge-base-is-ancestor (e2743fe)\n  - Merge pull request #3165 from GitoxideLabs/encoding (1b025f7)\n  - Merge pull request #3168 from GitoxideLabs/fix-ident-filter (f06f106)\n  - Merge pull request #3152 from GitoxideLabs/even-faster-qa (2baa819)\n  - Reduce development and CI artifacts while preserving runtime checks (d2e37e5)\n  - Merge pull request #3143 from GitoxideLabs/fast-ci (c4a28f8)\n  - Parse workflow YAML in `internal-tools` without `yq` (59ff9df)\n  - Discover QA work from manifests and share it between local runs and CI (8bf25a2)\n  - Merge pull request #3061 from GitoxideLabs/stable-gix (5c88568)\n  - Require Rust 1.91 for CLI tooling (c9441a7)\n  - Merge pull request #3127 from srijs/gix-zlib-sirocco-deflate (8644bf3)\n  - Review (9b8c4e1)\n  - Merge pull request #3092 from GitoxideLabs/brace-brace (15b71a3)\n  - Merge pull request #3083 from GitoxideLabs/report-october (e87b6ee)\n\n</details>\n\n","reactions":{"total_count":4,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0}}
