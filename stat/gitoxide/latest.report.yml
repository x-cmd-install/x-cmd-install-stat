{"id":409528643,"author":{"login":"Byron","id":63622,"node_id":"MDQ6VXNlcjYzNjIy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCCL8X84YaOlD","tag_name":"gix-utils-v0.5.1","target_commitish":"main","name":"gix-utils v0.5.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-11T08:14:28Z","updated_at":"2026-10-11T08:14:32Z","published_at":"2026-10-11T08:14:32Z","assets":[],"body":"### Bug Fixes\n\n - Document the `gix-utils/prodash` workaround and guard auditable builds\n   <!-- agent -->\n   `cargo-auditable` reconstructs enabled features from Cargo\u2019s `rustc` arguments\n   and replays them into workspace-wide `cargo metadata`. The root package\u2019s\n   implicit `prodash` feature also matches `gix-utils`\u2019 optional dependency,\n   despite `dep:prodash` suppressing its implicit feature. Cargo then rejects the\n   request for the nonexistent `gix-utils/prodash` feature.\n   \n   Explain why the explicit alias is a tooling compatibility workaround, link\n   the upstream Cargo and `cargo-auditable` issues, and document a metadata\n   reproduction and how to reassess removal.\n   \n   Add `just check-auditable` and a blocking CI job using stable Rust and\n   `cargo-auditable` 0.7.6. Test an actual auditable build of the `small`\n   configuration rather than requiring the alias itself, so an upstream fix can\n   allow the workaround to be removed without rewriting the check.\n\n### Commit Statistics\n\n - 4 commits contributed to the release over the course of 2 calendar days.\n - 3 days passed between releases.\n - 1 commit was understood as [conventional](https://www.conventionalcommits.org).\n - 0 issues like '(#ID)' were seen in commit messages\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n * **Uncategorized**\n    - Merge pull request #3050 from plusky/fix-gix-utils-prodash-feature (e7ddf81)\n    - Document the `gix-utils/prodash` workaround and guard auditable builds (6a262bc)\n    - Restore explicit prodash feature in gix-utils dropped in dep: migration (3c367a6)\n    - Merge pull request #3048 from GitoxideLabs/new-release (5fccccf)\n</details>\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
