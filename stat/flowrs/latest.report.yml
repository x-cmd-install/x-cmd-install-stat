digest":"sha256:12b49243898765b5c05773b4f5b48aec8ed2e7d9af1565ded1d5de0affa5dba2","download_count":0,"created_at":"2026-10-08T15:58:29Z","updated_at":"2026-10-08T15:58:29Z"}],"body":"## Release Notes\n\n### Fixed\n\n- fix fmt, clippy 1.99 assert_is_empty, address review\n\n### Other\n\n- Add command-based cookie auth\n- Support cookie auth\n- *(deps)* bump google-cloud-auth from 1.16.0 to 1.17.0\n- *(deps)* bump thiserror from 2.0.20 to 2.0.21\n- *(deps)* bump aws-sdk-mwaa from 1.120.0 to 1.121.0\n- *(deps)* bump toml from 1.1.5+spec-1.1.0 to 1.1.6+spec-1.1.0\n- *(deps)* bump clap from 4.6.6 to 4.6.7 ([#729](https://github.com/jvanbuel/flowrs/pull/729))\n- Merge pull request #728 from jvanbuel/dependabot/cargo/aws-sdk-mwaa-1.120.0\n- *(deps)* bump aws-sdk-mwaa from 1.118.0 to 1.120.0\n- *(deps)* bump dirs from 6.0.0 to 7.0.0\n\n## Install flowrs-tui 0.16.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/jvanbuel/flowrs/releases/download/flowrs-tui-v0.16.0/flowrs-tui-installer.sh | sh\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install jvanbuel/flowrs/flowrs\n```\n\n## Download flowrs-tui 0.16.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [flowrs-tui-aarch64-apple-darwin.tar.xz](https://github.com/jvanbuel/flowrs/releases/download/flowrs-tui-v0.16.0/flowrs-tui-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/jvanbuel/flowrs/releases/download/flowrs-tui-v0.16.0/flowrs-tui-aarch64-apple-darwin.tar.xz.sha256) |\n| [flowrs-tui-x86_64-apple-darwin.tar.xz](https://github.com/jvanbuel/flowrs/releases/download/flowrs-tui-v0.16.0/flowrs-tui-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/jvanbuel/flowrs/releases/download/flowrs-tui-v0.16.0/flowrs-tui-x86_64-apple-darwin.tar.xz.sha256) |\n| [flowrs-tui-x86_64-unknown-linux-gnu.tar.xz](https://github.com/jvanbuel/flowrs/releases/download/flowrs-tui-v0