{"id":428803063,"author":{"login":"xmatthias","id":5024695,"node_id":"MDQ6VXNlcjUwMjQ2OTU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBXYo-M4ZjwP3","tag_name":"2026.10","target_commitish":"stable","name":"2026.10","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-30T08:35:25Z","updated_at":"2026-10-30T08:35:55Z","published_at":"2026-10-30T08:35:55Z","assets":[],"body":"# Highlighted changes\r\n\r\n- Add Orderbook websocket support.\r\n- Fully Decouple bot from RPC messaging for more reliable bot loop execution.\r\n- Parameter values are now kept per strategy instance. Access them through `self.<param>.value`, not through the class.\r\n- Armv7 (raspberry 32bit)  image updated to python 3.13.\r\n- Dropped support for python 3.11.\r\n- Support changing strategy parameters from Backtesting UI (`webserver` mode only).\r\n- FreqUI will now use the backtested strategy to plot in backtest mode (`webserver` mode only).\r\n- `backtesting-show --export-params` now writes the parameters from a backtest back to the strategy.\r\n- Improved efficiency for `AgeFilter` doing fewer calls for validated pairs.\r\n\r\n## Sponsor\r\n\r\nYou can sponsor the work on freqtrade via the following links:\r\n\r\n- froggleston (FTUI) https://github.com/sponsors/froggleston/\r\n- robcaulk (freqAI) https://github.com/sponsors/robcaulk/\r\n- xmatthias (freqtrade and freqUI): https://github.com/sponsors/xmatthias/\r\n\r\n## New Contributors\r\n* @Siegelth made their first contribution in https://github.com/freqtrade/freqtrade/pull/13657\r\n* @Jhacarreiro made their first contribution in https://github.com/freqtrade/freqtrade/pull/13662\r\n* @Bortlesboat made their first contribution in https://github.com/freqtrade/freqtrade/pull/13678\r\n* @lizimu1013 made their first contribution in https://github.com/freqtrade/freqtrade/pull/13697\r\n* @louisvikk6-max made their first contribution in https://github.com/freqtrade/freqtrade/pull/13681\r\n* @M1ch43lV made their first contribution in https://github.com/freqtrade/freqtrade/pull/13719\r\n\r\n## How to update\r\n\r\nAs always, you can update your bot using one of the following commands:\r\n\r\n### docker-compose\r\n\r\n```bash\r\ndocker-compose pull\r\ndocker-compose up -d\r\n```\r\n\r\n### Installation via setup script\r\n\r\n``` bash\r\n# Deactivate venv and run \r\n./setup.sh --update\r\n```\r\n\r\n### Plain native installation\r\n\r\n``` bash\r\ngit pull\r\npip install -U -r requirements.txt\r\n```\r\n\r\n<details>\r\n<summary>Expand full changelog</summary>\r\n\r\n```\r\n4a39de1a5 chore: bump version to 2026.10\r\nbe53411c7 chore: remove reduced excludes\r\n686e59b99 chore(deps): update python docker tag to v3.14.10\r\n4209674c0 chore(deps): update python docker tag to v3.13.18\r\nde1f3bb5a chore: update binance leverage tiers\r\nd4d48db16 Drop the get_rate assertion, it is not part of the call path anymore\r\n0b3ef98dc Pass the placed price to emergency_exit when the cancelled order has none\r\n4c3e11286 chore: format CI yaml files\r\ndafa0b6f4 test: fix random, timing based test failure\r\n953d0c2ba fix: avoid attribute error\r\n91aa6b6b2 Fix emergency exit crash when the cancelled order has no price\r\n43b62f22f chore(deps): update python non-major dependencies\r\nce2246364 chore(deps): update dependency filelock to v4.2.1 [security]\r\nc8a1e03e2 chore(deps): update dependency ubuntu to v26\r\n1948b0f75 chore(deps): update zizmorcore/zizmor-action action to v0.7.1\r\nc5bdef921 chore(deps): update pre-commit hooks\r\nf95ca1508 chore(deps): update ruff to v0.17.1\r\n826d54c38 chore(deps): update python non-major dev dependencies\r\n8eb66c7ad chore(deps): update dependency ccxt to v4.5.90\r\na20c63bcb test: add test for expired fuding_fee history\r\nba9f6def4 fix: loop funding history if older than 1 request\r\n150a10bc2 fix: humanize for daylight-saving periods\r\n9830ab1c1 chore: don't sanitize None values.\r\n451047bf0 fix: ensure c