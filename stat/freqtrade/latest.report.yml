{"id":379512023,"author":{"login":"xmatthias","id":5024695,"node_id":"MDQ6VXNlcjUwMjQ2OTU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBXYo-M4WnuTX","tag_name":"2026.8","target_commitish":"stable","name":"2026.8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-31T04:33:43Z","updated_at":"2026-08-31T04:34:31Z","published_at":"2026-08-31T04:34:31Z","assets":[],"body":"# Highlighted changes\r\n\r\n- Added `@informative` call caching (\u26a0\ufe0fthis is a behavioral change enabled by default - but will only impact strategies that do non-dataframe operations as part of an `@informative`  decorated function).\r\n- Pairlists:\r\n    - `VolatilityFilter` - Support `lookback_period` and `lookback_timeframe` .\r\n    - `RangeStabilityFilter` - Support `lookback_period` and `lookback_timeframe`.\r\n    - `VoliatilityFilter` - slight behavior change after fixing a bug causing the first row in lookbacks to always be 0. Results will slightly change due to that - as the average now no longer includes an additional \u201c0\u201d line.\r\n    - Improved and aligned wording for pairlist filters with lookback parameters.\r\n- Issue a warning during hyperopt when Parameters values are used during `populate_indicators` .\r\n- Enhanced detailed formats for `--timerange` - supporting Hour/Minute based inputs in human readable form (e.g. `\u2014timerange 20260101T1500-20260602`).\r\n- Remove Bitmart support and references (it ceased operations end of July).\r\n\r\n## Sponsor\r\n\r\nYou can sponsor the work on freqtrade via the following links:\r\n\r\n- froggleston (FTUI) https://github.com/sponsors/froggleston/\r\n- robcaulk (freqAI) https://github.com/sponsors/robcaulk/\r\n- xmatthias (freqtrade and freqUI): https://github.com/sponsors/xmatthias/\r\n\r\n## New Contributors\r\n* @SubminO made their first contribution in https://github.com/freqtrade/freqtrade/pull/13427\r\n\r\n## How to update\r\n\r\nAs always, you can update your bot using one of the following commands:\r\n\r\n### docker-compose\r\n\r\n```bash\r\ndocker-compose pull\r\ndocker-compose up -d\r\n```\r\n\r\n### Installation via setup script\r\n\r\n``` bash\r\n# Deactivate venv and run \r\n./setup.sh --update\r\n```\r\n\r\n### Plain native installation\r\n\r\n``` bash\r\ngit pull\r\npip install -U -r requirements.txt\r\n```\r\n\r\n<details>\r\n<summary>Expand full changelog</summary>\r\n\r\n```\r\n9775bb7e9 chore: bump version to 2026.8\r\ncadc05eba chore: remove missleading parameter\r\n892be4a08 docs: add note about backtest result caching\r\n997ef6e36 test: add hyperopt_logger test\r\n9112e674e fix: don't reassign log queue in hyperopt unconditionally\r\n135220c02 fix: docstring with merge hint\r\n1d8663b1a feat: update candle_type docstring\r\nc59ce4615 chore(deps): bump uvicorn from 0.52.3 to 0.52.4\r\n432a9d618 chore(deps): bump ccxt from 4.5.75 to 4.5.76\r\n40ae81ce1 chore: update binance leverage tiers\r\n922ab09d2 chore: update pre-commit hooks\r\n160c23cc1 fix: avoid fragmented dataframe, fix mean calculation problem\r\n4fab1d983 test: update test to verify 13481\r\n70dfd76d9 chore(deps-dev): bump ruff from 0.16.2 to 0.16.3\r\n78841fa48 chore(deps): bump astral-sh/setup-uv from 9.0.0 to 10.0.1\r\n4c7af7096 chore(deps): bump docker/setup-buildx-action in the docker group\r\ncfa58f8ed chore(deps): bump filelock from 3.32.2 to 3.32.3\r\n7ae57e11c chore(deps): bump ccxt from 4.5.74 to 4.5.75\r\n30ae2c1fa chore(deps): Apply pre-commit types update\r\n2b54bc438 chore(deps): bump uvicorn from 0.52.1 to 0.52.3\r\n1ef4b202e chore(deps): bump sqlalchemy from 2.0.51 to 2.0.52\r\ndd84b8a17 chore(deps-dev): bump mypy from 2.3.0 to 2.3.1\r\n10db8654c chore: fix devcontainer build\r\nc8b7e7678 test: remove get_mock_coro in favor of AsyncMock\r\neb334b77d chore: bump api_version to 2.50 to indicate timerange minute support\r\n6ace4cfac docs: Update docs typos\r\nb6e0febde chore: add Agents stuff to gitignore\r\n914af5