{"id":399358443,"author":{"login":"xmatthias","id":5024695,"node_id":"MDQ6VXNlcjUwMjQ2OTU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBXYo-M4Xzbnr","tag_name":"2026.9","target_commitish":"stable","name":"2026.9","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-29T17:05:27Z","updated_at":"2026-09-29T17:06:05Z","published_at":"2026-09-29T17:06:05Z","assets":[],"body":"# Highlighted changes\r\n\r\n- Add time offset check against exchange clock.\r\n- Add support for open interest data as informative pair (for exchanges that support this).\r\n- Startup now fails if the strategy requests informative candle types the exchange doesn't support (e.g. `open_interest`).\r\n- freqUI: Show available free balance in force-entry form.\r\n- Add configurable liquidation warning messages in futures mode.\r\n- Add `delete_custom_data()`  support to allow removing data from trades again.\r\n- Improved refresh logic for pairs with little activity.\r\n- Security hardening in several places (config output redaction, freqAI identifier path traversal).\r\n- Fixed funding fees being reset to 0 when a filled order is reprocessed.\r\n- Fixed wallet handling for cross-margin bots.\r\n\r\n\r\n## Sponsor\r\n\r\nYou can sponsor the work on freqtrade via the following links:\r\n\r\n- froggleston (FTUI) https://github.com/sponsors/froggleston/\r\n- robcaulk (freqAI) https://github.com/sponsors/robcaulk/\r\n- xmatthias (freqtrade and freqUI): https://github.com/sponsors/xmatthias/\r\n\r\n## New Contributors\r\n* @svenmittner made their first contribution in https://github.com/freqtrade/freqtrade/pull/13531\r\n\r\n## How to update\r\n\r\nAs always, you can update your bot using one of the following commands:\r\n\r\n### docker-compose\r\n\r\n```bash\r\ndocker-compose pull\r\ndocker-compose up -d\r\n```\r\n\r\n### Installation via setup script\r\n\r\n``` bash\r\n# Deactivate venv and run \r\n./setup.sh --update\r\n```\r\n\r\n### Plain native installation\r\n\r\n``` bash\r\ngit pull\r\npip install -U -r requirements.txt\r\n```\r\n\r\n<details>\r\n<summary>Expand full changelog</summary>\r\n\r\n```\r\n0d7510da3 fix: remove coinex from online tests\r\n30afbfa3b chore: bump version to 2026.9\r\n3e74d86a9 chore: update pre-commit hooks\r\n30c00ed63 fix: proactively protect from session errors on shutdown\r\ndcadba2d5 chore: Remove \"newer package\" excludes, add virtualenv\r\nbff1e31a1 chore: delist bitmex\r\nb8022cbf4 chore(deps): bump ccxt from 4.5.83 to 4.5.84\r\n830748dc7 chore(deps): bump codecov/codecov-action from 7.1.0 to 7.1.1\r\n08d3d99a3 chore(deps): bump astral-sh/setup-uv from 10.1.0 to 10.2.0\r\ne48de8f1c chore(deps): bump the docker group with 2 updates\r\nd2d9af885 chore(deps): Apply pre-commit types update\r\n6811ed80d chore(deps): bump pymdown-extensions from 11.0.2 to 12.0.1\r\n3b6cd5ad4 chore(deps): bump filelock from 3.32.6 to 4.0.1\r\n11642c514 chore(deps-dev): bump ruff from 0.16.7 to 0.16.8\r\na2ead3b96 chore(deps): bump cachetools from 7.1.8 to 7.2.0\r\n75c0fa819 chore(deps): bump plotly from 7.0.0 to 7.1.0\r\na086a85d8 chore(deps): bump uvicorn from 0.52.4 to 0.53.0\r\n56dadb7d9 chore(deps): bump sqlalchemy from 2.0.52 to 2.0.54\r\na2f8703fa chore(deps): bump pandas from 3.0.5 to 3.0.6\r\nd6c736fc1 docs: improve docs for open interest data\r\n5284e4d27 fix: check contracts to verify for position openness\r\n548cd47b1 chore: update binance leverage tiers\r\nbfd88c97a docs: update rateLimit docs to warn from changing them.\r\nd7b38e989 docs: formatting / wording\r\n6637d6212 chore: bump ccxt to 4.5.83\r\n698b96203 fix: don't drop funding-fee candle in data-download\r\n06ef42228 test: add test for model identifier path traversal\r\n9cf942017 fix: don't allow freqAI model identifiers outside of model directory\r\n33e32a52b feat: add \"is_path_in_dir\" helper\r\nfd0e573ac test: update test ensuring strategy params are typed correctly\r\nb748e66b6 test: fix base64 strategy t