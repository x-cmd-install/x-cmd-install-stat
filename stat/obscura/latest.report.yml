ublic","site_admin":false},"content_type":"application/zip","state":"uploaded","size":73101868,"digest":"sha256:a32a26fc73fcc21850a67d9cd0d0cd7caf7b400a0e20aa91703126f0fc47c33f","download_count":638,"created_at":"2026-10-31T20:59:40Z","updated_at":"2026-10-31T20:59:47Z"},{"id":696469078,"node_id":"RA_kwDOSBUdsc4pg0ZW","name":"obscura-x86_64-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":69076668,"digest":"sha256:0a110d0693753a252ed7ffd61e682363e8622caf79697f564c529099a31a6242","download_count":1366,"created_at":"2026-10-31T20:59:40Z","updated_at":"2026-10-31T20:59:47Z"}],"body":"# v0.2.6\n\nThis release improves request interception, frame navigation, CDP responsiveness, and JavaScript startup. It also fixes browser API behavior, updates security-sensitive dependencies, and strengthens performance regression checks. 117 commits since v0.2.5.\n\n## Highlights\n\n- **Main-document requests can be intercepted before transport.** Playwright and Puppeteer can fulfill navigation requests directly. Binary bodies, repeated cookies, continuation overrides, redirects, and request completion retain their expected behavior ([#1384](https://github.com/h4ckf0r0day/obscura/pull/1384)).\n- **CDP remains responsive while evaluations await promises.** Other commands and interception replies can proceed while asynchronous evaluations settle. Script evaluation runs directly through V8 and preserves global lexical bindings ([#1310](https://github.com/h4ckf0r0day/obscura/pull/1310)).\n- **Frame navigation stays in the correct document.** Child-frame Location methods and named form targets navigate their owning frames. Blank iframe documents initialize during insertion, and iframe shadow roots use the correct document ([#1357](https://github.com/h4ckf0r0day/obscura/pull/1357), [#1359](https://github.com/h4ckf0r0day/obscura/pull/1359), [#1385](https://github.com/h4ckf0r0day/obscura/pull/1385)).\n- **Startup and response handling avoid repeated work.** Common browser methods are precompiled, bootstrap source is shared across isolates, inline styles are allocated on demand, and stored response bodies are encoded only when a client reads them.\n- **Security dependencies are updated without replacing stealth profiles.** Compression, Tokio, and TLS verification dependencies receive patched versions. Dependency audits pass without additional advisory exceptions ([#1352](https://github.com/h4ckf0r0day/obscura/pull/1352), [#1393](https://github.com/h4ckf0r0day/obscura/pull/1393)).\n\n## Rust API change\n\n`StoredResponseBody.body` changes from `String` to `Vec<u8>` and now contains the raw response bytes.\n\nRust callers needing the previous text or base64 representation should use `.cdp_body()`. CDP response formats are unchanged ([#1335](https://github.com/h4ckf0r0day/obscura/pull/1335)).\n\n## Security\n\n- Tokio is updated to 1.53.3, `rustls-webpki` to 0.103.16, and the affected WebPKI root packages to 1.0.10 ([#1352](https://github.com/h4ckf0r0day/obscura/pull/1352)).\n- Compression dependencies move to patched `zstd` 0.14.3, `zstd-safe` 8.2.0, and `zstd-sys` 2.1.2, with Brotli dependencies aligned. The existing emulation profiles are retained. Already-buffered certificate input avoids an unnecessary decoder allocation ([#1393](https://github.com/h4ckf0r0day/obscura/pull/1393)).\n- The network loader itself enforces the `file://` opt-in, protecting callers that do not pass through navigation-level checks. Explicitly permitted file access remains available ([#1280](https://github.com/h4ckf0r0day/obscura/pull/1280)).\n- Scripted `fetch()` ignores forbidden request headers ([#1358](https://github.com/h4ckf0r0day/obscura/pull/1358)).\n- Wrapped JWK serialization and parsing use native JSON handling. Key wrapping validates permissions and extractability ([#1290](https://github.com/h4ckf0r0day/obscura/pull/1290)).\n\n## CDP and automation\n\n- `Runtime.evaluate` executes directly in V8. Replacing the page’s `eval` no longer intercepts protocol evaluation, and global lexical bindings remain accessible to later evaluations ([#1310](https://github.com/h4ckf0r0day/obscura/pull/1310)).\n- Awaited evaluations no longer hold up all subsequent CDP commands. Function calls use native invocation and preserve JSON arguments.\n- `DOM.getAttributes`, `DOM.requestNode`, `DOM.requestChildNodes`, and `DOM.getNodeForLocation` support the top-level light DOM. Published node tracking belongs to each session and resets during navigation and teardown ([#1300](https://github.com/h4ckf0r0day/obscura/pull/1300)).\n- Initialization scripts are scoped to their target instead of leaking into unrelated pages ([#1360](https://github.com/h4ckf0r0day/obscura/pull/1360)).\n- Main-document interception preserves supplied bytes and repeated `Set-Cookie` headers. Failed and canceled requests complete once under their original request IDs ([#1384](https://github.com/h4ckf0r0day/obscura/pull/1384)).\n- Explicit network-idle navigation respects its configured deadline and reports failure if requests remain active. It no longer reports successful idle after an unconditional five-second cutoff ([#1388](https://github.com/h4ckf0r0day/obscura/pull/1388)).\n- MCP `browser_wait_for_function` continues driving page tasks, allowing predicates dependent on network callbacks to complete ([#1298](https://github.com/h4ckf0r0day/obscura/pull/1298)).\n\n## Networking and page lifecycle\n\n- `Response` accepts supplied `ReadableStream` bodies without stringifying or draining them during construction. Consumption preserves byte validation, errors, locking, cancellation, cloning, and pull backpressure ([#1386](https://github.com/h4ckf0r0day/obscura/pull/1386)).\n- Child-frame Location navigation loads that frame without replacing its parent. Detached frame windows cannot queue parent navigation ([#1385](https://github.com/h4ckf0r0day/obscura/pull/1385)).\n- Forms honor named child-frame targets ([#1357](https://github.com/h4ckf0r0day/obscura/pull/1357)).\n- Blank iframe documents initialize during insertion. Initial frame setup also handles reentrant operations safely, fixing an iframe initialization abort ([#1359](https://github.com/h4ckf0r0day/obscura/pull/1359), [#1306](https://github.com/h4ckf0r0day/obscura/pull/1306)).\n- Fragment navigation updates same-document history and dispatches `hashchange` without reloading the document. Assigning an unchanged fragment preserves the existing history entry ([#1287](https://github.com/h4ckf0r0day/obscura/pull/1287)).\n- `robots.txt` parsing keeps consecutive user-agent lines in one group and separates wildcard matches from named-agent matches ([#1350](https://github.com/h4ckf0r0day/obscura/pull/1350)).\n- `--user-agent` is accepted as a global CLI option. Explicit overrides reach both stealth requests and `navigator.userAgent`, with per-request headers taking precedence ([#1279](https://github.com/h4ckf0r0day/obscura/pull/1279), [#1389](https://github.com/h4ckf0r0day/obscura/pull/1389)).\n\n## DOM, JavaScript, and rendering\n\n- Twenty-eight missing HTML interface globals gain distinct prototypes and tag-specific brands. Namespace-aware creation and cloning preserve qualified names and prefixes ([#1387](https://github.com/h4ckf0r0day/obscura/pull/1387)).\n- Worker globals expose ECMAScript built-ins and Web APIs as properties of their scope ([#1368](https://github.com/h4ckf0r0day/obscura/pull/1368)).\n- `DOMImplementation` is exposed globally ([#1375](https://github.com/h4ckf0r0day/obscura/pull/1375)).\n- `window.event` identifies the current event during handlers and listeners, restoring the previous value after nested dispatch or exceptions ([#1345](https://github.com/h4ckf0r0day/obscura/pull/1345)).\n- `document` is read-only, and ordered-list and list-item attributes reflect through their DOM properties ([#1303](https://github.com/h4ckf0r0day/obscura/pull/1303), [#1297](https://github.com/h4ckf0r0day/obscura/pull/1297)).\n- Summary activation toggles details elements, and changes to `open` queue toggle events ([#1299](https://github.com/h4ckf0r0day/obscura/pull/1299)).\n- Shadow-root creation and lookup inside iframes use the owning frame’s document ([#1343](https://github.com/h4ckf0r0day/obscura/pull/1343)).\n- `checkVisibility()` evaluates implemented visibility rules instead of always returning true. Render builds also preserve inherited computed visibility ([#1071](https://github.com/h4ckf0r0day/obscura/pull/1071)).\n- Hidden table rows are excluded from layout, and table row and row-group display values are respected ([#1304](https://github.com/h4ckf0r0day/obscura/pull/1304), [#1307](https://github.com/h4ckf0r0day/obscura/pull/1307)).\n- Previously missing computed-style longhands and the `cssFloat` alias are exposed ([#762](https://github.com/h4ckf0r0day/obscura/pull/762)).\n- WebCrypto supports AES-KW key wrapping and unwrapping with native JWK serialization ([#1290](https://github.com/h4ckf0r0day/obscura/pull/1290)).\n\n## Runtime performance\n\n- Common DOM, URL, and response methods are precompiled into the startup snapshot. Their bodies are not executed during preparation, and compiler hooks are removed before page execution ([#1325](https://github.com/h4ckf0r0day/obscura/pull/1325)).\n- Bootstrap source is shared across isolates, inline style objects are allocated on demand, and parallel runtime startup is bounded.\n- Window named-property lookup batches work in the native DOM, and UTF-8 decoding uses the native path while preserving explicit encoding handling.\n- Native-function source metadata uses weak references so discarded functions can be collected ([#1322](https://github.com/h4ckf0r0day/obscura/pull/1322)).\n- Response bodies remain raw bytes until CDP serialization is requested, avoiding eager text or base64 conversion for unread bodies ([#1335](https://github.com/h4ckf0r0day/obscura/pull/1335)).\n\n## Packaging and validation\n\n- Patched compression, font, and layout dependencies propagate to embedded Rust consumers ([#1393](https://github.com/h4ckf0r0day/obscura/pull/1393)).\n- Release packaging runs the dependency audit before building and publishing artifacts.\n- Performance CI checks sustained DOM workloads and CPU consumption alongside latency and memory. Obstacle-course latency regressions also fail the performance gate ([#1351](https://github.com/h4ckf0r0day/obscura/pull/1351), [#1383](https://github.com/h4ckf0r0day/obscura/pull/1383)).\n- Rendering fixture checks enforce zero-count assertions ([#1305](https://github.com/h4ckf0r0day/obscura/pull/1305)).\n- Final validation passed **2,459 render tests** with five existing skips, **1,505 no-render workspace tests** with three existing skips, **31 library API tests**, and the stealth networking checks.\n- All four release build configurations passed: render, render+stealth, no-render, and no-render+stealth.\n- Main passed the complete **33/33 obstacle course**.\n- The shipping render+stealth binary received separate paired CPU, memory, and screenshot checks. Both rendering fixtures produced pixel-identical output against the preceding shipping baseline.\n\n## Current limitations\n\n- The new CDP node commands cover the top-level light DOM. Live mutation events, detached-node publication, and frame or shadow-tree traversal remain incomplete.\n- Supplied `Response` streams are supported; network response bodies remain bounded and buffered.\n- PDF output remains raster-backed.\n- Service workers, native media, some Web APIs, and long-tail rendering behavior remain incomplete relative to Chromium.\n\n## Contributors\n\nThanks to @alexskinner, @anzal1, @bkircher, @chiliec, @flolep2607, @fwonce, @HyperionBurn, @Kevsosmooth, @lisa0314, @lucasbrito-wdt, @Micaso, @ntdatt812, @orezraey, @shaipe, @suleman-dawood, and @yzyf1312 for contributions to this release.\n\n**Full Changelog:** https://github.com/h4ckf0r0day/obscura/compare/v0.2.5...v0.2.6\n","reactions":{"total_count":9,"+1":3,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":0,"rocket":2,"eyes":1},"mentions_count":16}
