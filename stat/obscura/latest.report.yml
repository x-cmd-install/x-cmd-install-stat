st":"sha256:0fff3953a0484f505bc4445e8fab3d718084c7d0bd704dc05d2958e49b1ad4c7","download_count":17,"created_at":"2026-10-04T19:48:13Z","updated_at":"2026-10-04T19:48:21Z"},{"id":610526032,"node_id":"RA_kwDOSBUdsc4kY-NQ","name":"obscura-x86_64-macos.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":69064144,"digest":"sha256:91b1b5e1f581e7572bdffd289195ad112cd5cf33069019e892b251c099bef015","download_count":42,"created_at":"2026-10-04T19:48:13Z","updated_at":"2026-10-04T19:48:23Z"},{"id":610526038,"node_id":"RA_kwDOSBUdsc4kY-NW","name":"obscura-x86_64-windows-no-render-stealth.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44652903,"digest":"sha256:6d9f123c8789f3ef926063aff6e332907931ffc9a88122cd6962e4578a35cee2","download_count":45,"created_at":"2026-10-04T19:48:13Z","updated_at":"2026-10-04T19:48:19Z"},{"id":610526023,"node_id":"RA_kwDOSBUdsc4kY-NH","name":"obscura-x86_64-windows-no-render.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":40658347,"digest":"sha256:8da1d406bbf6a51dbe6dd534f3de854758fc5c6d3f9f33eb11c3f685f0daa2b4","download_count":45,"created_at":"2026-10-04T19:48:13Z","updated_at":"2026-10-04T19:48:18Z"},{"id":610526033,"node_id":"RA_kwDOSBUdsc4kY-NR","name":"obscura-x86_64-windows-stealth.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":72526801,"digest":"sha256:47d85a13fb1d19aca0fd71ebb3a1367248542f5344878b064c8586a193d604c9","download_count":304,"created_at":"2026-10-04T19:48:13Z","updated_at":"2026-10-04T19:48:21Z"},{"id":610526029,"node_id":"RA_kwDOSBUdsc4kY-NN","name":"obscura-x86_64-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":68520432,"digest":"sha256:8e5428bf8c101f1439c53a9dcb52d7d09bb22599206b49f6420028d93d01189b","download_count":421,"created_at":"2026-10-04T19:48:13Z","updated_at":"2026-10-04T19:48:21Z"}],"body":"# v0.2.4\r\n\r\nThis release focuses on automation reliability, browser compatibility, and reducing unnecessary engine work. It fixes frame teardown crashes, adds recovery for failed CDP workers, improves input and navigation behavior, and tightens the release validation gate. 212 commits since v0.2.3.\r\n\r\n## Highlights\r\n\r\n\u2022 **Frame teardown no longer crashes under garbage collection.** Borrowed iframe contexts are cleaned up safely when their isolate is destroyed, fixing process aborts during page closure (\\#1197).\r\n\u2022 **Failed CDP workers are reaped and restarted.** Multiworker serving replaces exited workers and avoids routing new connections to workers known to be unavailable. Sessions on a failed worker still require reconnection (\\#1198).\r\n\u2022 **Automation spends less time waiting unnecessarily.** Idle polling, CDP reply stalls, redundant DOM traversal, and unchanged rendering work were reduced. Ready timers and awaited evaluations now yield so other browser work can proceed (\\#1078, \\#1111, \\#1131, \\#1132, \\#1137).\r\n\u2022 **Input and page lifecycle behavior follow browsers more closely.** Text insertion respects `beforeinput` and canceled keyboard events, readonly controls reject deletion, detached frames stop running timers, and document replacement preserves parser behavior (\\#1184, \\#1185, \\#1186, \\#1190, \\#1191).\r\n\u2022 **Release CI requires all 33 obstacle-course stages.** A failure shared by the baseline and candidate can no longer satisfy the absolute behavioral gate (\\#1195).\r\n\r\n## Security\r\n\r\n\u2022 Teredo addresses containing a forbidden IPv4 destination are rejected by the SSRF gate (\\#1098).\r\n\u2022 The standalone renderer HTTP loader applies the same private-network restrictions as page networking (\\#1072).\r\n\u2022 Malformed request-interception URL rewrites fail closed instead of bypassing URL validation (\\#1076).\r\n\u2022 `file://` navigation requires explicit permission at the browser layer, not just the CLI (\\#1070).\r\n\u2022 `history.pushState()` and `replaceState()` enforce same-origin URLs (\\#1057).\r\n\u2022 `__Host-` cookies require an explicit `Path=/`; cookie expiry parsing and IP-domain matching were hardened (\\#1099, \\#1073).\r\n\u2022 CSS-sized image and mask allocations, robots cache growth, and protocol-supplied values have tighter bounds (\\#1062, \\#1064, \\#1094).\r\n\r\n## CDP and automation\r\n\r\n\u2022 Network events reach observer sessions, including intercepted requests, without losing their target routing (\\#1128, \\#1194).\r\n\u2022 Worker navigation responses expose the final HTTP status. Blocked requests no longer receive a fabricated status (\\#1119).\r\n\u2022 Redirected navigation responses are associated with the final document URL (\\#1139).\r\n\u2022 Active screencasts receive the new-document frame before load completion, reducing blank recordings of short navigations (\\#1134).\r\n\u2022 `Runtime.getHeapUsage` reports native V8 heap measurements, and `HeapProfiler.collectGarbage` performs collection (\\#1135).\r\n\u2022 Text insertion honors `beforeinput` cancellation, and canceled `keydown` events prevent default editing (\\#1184, \\#1185).\r\n\u2022 Readonly deletion and textarea newline behavior were corrected (\\#1186).\r\n\u2022 Readiness-file permission handling is portable to Windows (\\#1150).\r\n\r\n## Networking and runtime\r\n\r\n\u2022 Fetch resolves when response headers are available rather than waiting for the complete buffered body (\\#1146).\r\n\u2022 Fetch and XHR cancellation stop native request work and release network-readiness counters. Canceled requests emit `Network.loadingFailed` (\\#1193).\r\n\u2022 Dynamic resources retain their request destinations (\\#1181).\r\n\u2022 Folded HTTP/1 response headers are accepted by both the normal and stealth transports (\\#1160).\r\n\u2022 Same-origin non-GET fetch and XHR requests send the appropriate `Origin` header (\\#1081, \\#1104).\r\n\u2022 WebAssembly streaming calls no longer reach an unset native callback that aborts the process (\\#1163).\r\n\u2022 Microtask exceptions are reported without discarding remaining queued work (\\#1174).\r\n\u2022 Initial iframe realms are created synchronously; detached frames retire their timers and realms (\\#1140, \\#1191).\r\n\u2022 Iframe discovery microtasks are covered by the termination watchdog (\\#1136).\r\n\r\n## Rendering\r\n\r\n\u2022 Unchanged pages reuse retained rendering work, and transform measurement avoids repeated layout churn (\\#1111, \\#1110).\r\n\u2022 Native controls inherit font shorthand correctly and retain their intrinsic size when stretched in grids (\\#1177, \\#1178).\r\n\u2022 Percentage heights resolve across anonymous inline wrappers (\\#1179).\r\n\u2022 Absolutely positioned inline content preserves its static position (\\#1180).\r\n\u2022 Mixed inline content retains the correct owner geometry (\\#1188).\r\n\u2022 Hit testing excludes the bottom and right boundaries of boxes. Borrowed document methods use the receiver\u2019s realm (\\#1164, \\#1144).\r\n\u2022 Caret lookup uses rendered text geometry, and focus scrolling handles nested containers (\\#1187, \\#1133).\r\n\u2022 Canvas strokes and gradient color stops are implemented (\\#1022).\r\n\r\n## DOM and JavaScript\r\n\r\n\u2022 `new Option(text, value, defaultSelected, selected)` creates a real option element (\\#1196).\r\n\u2022 Concrete SVG element interfaces support standard prototype and interface checks (\\#1112).\r\n\u2022 `innerText` uses rendered text rather than raw DOM text (\\#1106).\r\n\u2022 Session history is exposed through `window.history` (\\#1105, \\#1074).\r\n\u2022 Replacement documents and `document.write` preserve lifecycle, EOF processing, and live foster-parenting anchors (\\#1027, \\#1189, \\#1190).\r\n\u2022 Mutation observers honor attribute filters (\\#1138).\r\n\u2022 `Response` construction and static factories validate their inputs (\\#1173).\r\n\u2022 No-op `style.setProperty()` calls leave the style attribute unchanged (\\#1172).\r\n\u2022 Media-query changes and reduced-motion emulation reach page scripts and CSS (\\#1028).\r\n\u2022 User Timing marks, measures, and observers are supported. Legacy navigation timing records implemented lifecycle milestones rather than fabricated values (\\#1166).\r\n\u2022 Unsupported editing commands are reported truthfully; iframe IDs are excluded from Window named access (\\#1183, \\#1192).\r\n\r\n## MCP, packaging, and validation\r\n\r\n\u2022 MCP text-search offsets remain correct across Unicode case folding (\\#1016).\r\n\u2022 Local-network denial messages explain how to enable explicitly permitted local access (\\#1129, \\#1175).\r\n\u2022 Build and V8 memory configuration documentation was corrected (\\#1114, \\#1115).\r\n\u2022 CI reuses trusted dependency caches and validates rendering, no-render, and stealth configurations (\\#1147).\r\n\u2022 Final main passed 2,115 render tests with five existing skips and the complete 33/33 obstacle course.\r\n\u2022 Additional validation passed 50/50 GC-stressed page closures and the unchanged four-test Grafana admin subset in both Chromium and Obscura. These are bounded checks, not a claim of complete Playwright compatibility.\r\n\r\n## Current limitations\r\n\r\n\u2022 IndexedDB can report successful writes without retaining data between transactions. Applications requiring IndexedDB correctness remain affected by \\#1093.\r\n\u2022 Worker recovery replaces the process but does not restore its active sessions.\r\n\u2022 Response bodies remain bounded and buffered; earlier header delivery does not provide incremental network streaming.\r\n\u2022 Service workers, native media, some Web APIs, and long-tail rendering behavior remain incomplete relative to Chromium.\r\n\r\n## Contributors\r\n\r\nThanks to @SGavrl, @h4ckf0r0day, @mnaza, @ice-zeus, @flolep2607, @AntonioRossi, @Micaso, @jorgensandhaug, @visto-a11y, @vvinayakkk, @zorahrel, @DamoyY, @abn, and @Yi-111-a for contributions to this release.\r\n\r\n**Full Changelog**: https://github.com/h4ckf0r0day/obscura/compare/v0.2.3...v0.2.4","reactions":{"total_count":6,"+1":2,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":14}
