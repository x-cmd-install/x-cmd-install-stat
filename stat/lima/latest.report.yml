sha256:8d03b82a456e299813276c6ff532fce1848fee5e50527433fe3374cde9183175","download_count":2206,"created_at":"2026-07-21T15:03:27Z","updated_at":"2026-07-21T15:03:29Z"},{"id":484814034,"node_id":"RA_kwDOFeRR284c5azS","name":"lima-additional-guestagents-2.2.0-Windows-AMD64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":37848272,"digest":"sha256:cc9fc8aa418f7ede746d02dc7059a53d8710feea187b610325ceb5993437a632","download_count":35,"created_at":"2026-07-21T15:03:28Z","updated_at":"2026-07-21T15:03:29Z"},{"id":484814039,"node_id":"RA_kwDOFeRR284c5azX","name":"lima-additional-guestagents-2.2.0-Windows-ARM64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":38655348,"digest":"sha256:8d959f43ce8e38d1a35e77c9685634f4eeb441f0eb29f7ef02c56b7b131c70ef","download_count":19,"created_at":"2026-07-21T15:03:28Z","updated_at":"2026-07-21T15:03:29Z"},{"id":484813995,"node_id":"RA_kwDOFeRR284c5ayr","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1396,"digest":"sha256:7da5160ee9b22de8eec4222e581334ee6326881e20d5aa8eb29b22f897312a5f","download_count":3827,"created_at":"2026-07-21T15:03:25Z","updated_at":"2026-07-21T15:03:25Z"},{"id":484815947,"node_id":"RA_kwDOFeRR284c5bRL","name":"SHA256SUMS.asc","label":null,"uploader":{"login":"AkihiroSuda","id":9248427,"node_id":"MDQ6VXNlcjkyNDg0Mjc=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":699,"digest":"sha256:b0333fbb88a0b83403641328cb96df81e896d3a61bed2c59788350d5f0fe3bf7","download_count":149,"created_at":"2026-07-21T15:05:32Z","updated_at":"2026-07-21T15:05:33Z"}],"body":"Highlights:\r\n- \ud83e\ude9f[Experimentally support Windows server 2025 guests](https://lima-vm.io/docs/usage/guests/windows/)\r\n- \ud83e\ude9f[Experimentally support Windows 11 guests](https://lima-vm.io/docs/usage/guests/windows/)\r\n- \ud83d\udc27[Experimentally allow opting out from password-less sudo](https://lima-vm.io/docs/config/sudo/)\r\n\r\n## Changes\r\n- Windows guest support:\r\n  - Experimentally support Windows server 2025 guests (#5138, thanks to [LFX mentee](https://lfx.linuxfoundation.org/tools/mentorship/) @mie313)\r\n  - Experimentally support Windows 11 guests (#5164 #5185 #5244, thanks to [LFX mentee](https://lfx.linuxfoundation.org/tools/mentorship/) @mie313)\r\n\r\n- Linux guest support:\r\n  - Experimentally allow opting out from password-less sudo (#5109 etc., thanks to @Aneesh-Hegde)\r\n\r\n- Windows host support:\r\n  - Change the default VM driver from `wsl2` to `qemu` (#4788)\r\n  - Remove dependency on `cygpath.exe` (#5205, thanks to [LFX mentee](https://lfx.linuxfoundation.org/tools/mentorship/) @mie313 with assistance from @jandubois)\r\n\r\n- macOS host support:\r\n  - Add LaunchDaemon support for headless macOS servers (#4984, thanks to @resker)\r\n\r\n- VM driver infrastructure:\r\n  - Update API (#4877, thanks to @unsuman)\r\n\r\n- QEMU:\r\n  - Implement TPM emulation (#5148, thanks to @mie313)\r\n\r\n- VZ:\r\n  - Implement virtio-sound interface (#5016, thanks to @Aneesh-Hegde)\r\n\r\n- `limactl` CLI:\r\n  - Add `limactl screenshot` (#5098, thanks to @trodemaster)\r\n  - Accept `limactl edit` flags in `limactl restart` (#5076, thanks to @itsme-ranger)\r\n  - Accept `--shell` flag in `limactl (create|edit|start)` (#5194, thanks to @unsuman)\r\n\r\n- Networking:\r\n  - Limit `socket_vmnet` access from `%everyone` to the `%admin` group (#5190, thanks to @ekalinin)\r\n\r\n- nerdctl:\r\n  - Update from v2.3.4 to [v2.3.5](https://github.com/containerd/nerdctl/releases/tag/v2.3.5) (#5297)\r\n\r\n- Templates:\r\n  - `almalinux-kitten`: Move to `experimental/` (#4736)\r\n  - `alpine`: Support `--plain` (#3057)\r\n  - `debian`: Support `--image-variant=nocloud` (#5159, thanks to @Nachiket-Roy)\r\n  - `fedora`: support RISC-V 64 (#5201)\r\n  - `ubuntu`: Support `--image-variant=minimal` (#5159, thanks to @Nachiket-Roy)\r\n  - `k8s`: Support version and registry parameters (#4872 #5200, thanks to @afbjorklund)\r\n  - `experimental/ubuntu-next`: point to `ubuntu-26.10` (#5214)\r\n\r\nFull changes: https://github.com/lima-vm/lima/milestone/70?closed=1\r\nThanks to @Aneesh-Hegde @Austin1serb @Nachiket-Roy @Nashit-h @SABITHSAHEB @SAY-5 @afbjorklund @arimu1 @arixmkii @bitalizer @ciderale @coulof @ekalinin @gaurav0107 @itsme-ranger @jandubois @kavirakesh14 @loncharles @mie313 @mvanhorn @opjt @pirate @resker @trodemaster @unsuman\r\n\r\n## Usage\r\n```console\r\n$ limactl create\r\n$ limactl start\r\n...\r\nINFO[0029] READY. Run `lima` to open the shell.\r\n\r\n$ lima uname\r\nLinux\r\n```\r\n\r\n- - -\r\nThe binaries were built automatically on GitHub Actions.\r\nThe build log is available for 90 days: https://github.com/lima-vm/lima/actions/runs/29840916918\r\n\r\nThe sha256sum of the SHA256SUMS file itself is `7da5160ee9b22de8eec4222e581334ee6326881e20d5aa8eb29b22f897312a5f` .\r\n- - -\r\nRelease manager: @AkihiroSuda\r\n","reactions":{"total_count":13,"+1":6,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":26}
