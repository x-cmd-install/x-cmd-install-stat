te":"uploaded","size":39472,"digest":"sha256:1ceb6cbb2026e0fdcf8f997ca2c0ab6dbb2e6ff8af2b9ea9433d9f54c329e307","download_count":5,"created_at":"2026-11-06T14:45:51Z","updated_at":"2026-11-06T14:45:52Z"},{"id":717479696,"node_id":"RA_kwDOFeRR284qw98Q","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1485,"digest":"sha256:5f9eaa93d2b58986273347d0f139b95f8fb87f117d98897760dee8d5b9d45ca6","download_count":231,"created_at":"2026-11-06T14:45:45Z","updated_at":"2026-11-06T14:45:45Z"},{"id":717488201,"node_id":"RA_kwDOFeRR284qxABJ","name":"SHA256SUMS.asc","label":null,"uploader":{"login":"AkihiroSuda","id":9248427,"node_id":"MDQ6VXNlcjkyNDg0Mjc=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":699,"digest":"sha256:4bf1cf1831f8b465824d66ce3ee12489285b3f0d017b5473eaf271012abfc702","download_count":7,"created_at":"2026-11-06T14:49:17Z","updated_at":"2026-11-06T14:49:19Z"}],"body":"Highlights:\r\n- 🪟[Experimentally support HCS driver](https://lima-vm.io/docs/config/vmtype/hcs/) for eliminating QEMU dependency (Windows hosts)\r\n- 🍎[Attach host block devices to VZ guests](https://lima-vm.io/docs/config/disk/#attach-host-block-devices) (macOS hosts)\r\n- 🐧[Experimentally support `lima:shared`, `lima:host`, and `lima:bridged` networks](https://lima-vm.io/docs/config/network/) (Linux hosts)\r\n- 🖥️`limactl menu`: an experimental menu-based user interface\r\n\r\n<img width=\"600\" alt=\"image\" src=\"https://github.com/user-attachments/assets/1c001842-a743-40e8-9688-a3fa595cd9e3\" />\r\n\r\n\r\n## Changes\r\n- Windows host support:\r\n  - Experimentally support HCS driver (#5449 #5514, thanks to [LFX mentee](https://lfx.linuxfoundation.org/tools/mentorship/) @mie313, and @unsuman)\r\n  - Support native Windows OpenSSH (#5298 #5299 #5300 #5337, thanks to @jandubois)\r\n  - Automatically append common tool directories (e.g., QEMU) to `PATH` (#5348, thanks to [LFX mentee](https://lfx.linuxfoundation.org/tools/mentorship/) @mie313)\r\n\r\n- Windows guest support:\r\n  - Support `provision` (#5263, thanks to [LFX mentee](https://lfx.linuxfoundation.org/tools/mentorship/) @mie313)\r\n\r\n- macOS guest support:\r\n  - Add `osOpts.darwin.suppressFirstLoginSetup` to skip the first-login Setup Assistant (#5336, thanks to @trodemaster)\r\n\r\n- VZ:\r\n  - Support attaching host block devices (`limactl start --block-device`) (#5117, thanks to @pirate)\r\n  - Add `audio.microphone` to attach a capture stream (#5462, thanks to @iamstarkov)\r\n  - Add `networkOpts.hostLoopback` to block guest access to the host's loopback services (#5581, thanks to @ranacseruet)\r\n\r\n- QEMU:\r\n  - Support `nestedVirtualization` with HVF (QEMU >= 11.1) (#5443, thanks to @sharanrajt)\r\n  - Implement `limactl screenshot` (#5478, thanks to @afbjorklund)\r\n\r\n- krunkit:\r\n  - Warn when a read-only mount is requested (#5740)\r\n\r\n- Networking:\r\n  - Experimentally support `lima:shared`, `lima:host`, and `lima:bridged` networks on Linux hosts, via the new `lima-privileged-net` helper (#5483 #5484 #5485 #5486 #5513 #5669, thanks to @unsuman)\r\n\r\n- SSH:\r\n  - Verify the guest VM's SSH host key, even for locally forwarded ports (#5687)\r\n\r\n- Port forwarding:\r\n  - Forward Unix sockets over gRPC instead of SSH (#5653, thanks to @KayleMaster)\r\n\r\n- YAML:\r\n  - Add `archVariant` (`--arch-variant`) for selecting x86-64-v2/v3 images (#5335, thanks to @ekalinin)\r\n  - `additionalDisks`: support custom `mountPoint` and optional mounting (#5198, thanks to @ekalinin)\r\n  - `copyToHost`: add `skipIfMissing` (#5183, thanks to @afbjorklund)\r\n  - Warn when overlapping mounts are detected (#5748)\r\n\r\n- `limactl` CLI:\r\n  - Add `limactl menu`, an experimental TUI for managing instances (#5330 #5629 #5668 ..., thanks to @Soumya-codr et al.)\r\n    - `limactl` without arguments now opens the menu on an interactive terminal\r\n  - Support stopping multiple instances with `limactl stop` (#5369, thanks to @MEETNANDA8107)\r\n  - `limactl autostart enable`: add `--keep-alive` (#5086, thanks to @resker)\r\n  - `limactl shell --sync`: add `--sync-exclude` and support the `.limasyncignore` file (#4917, thanks to @peschmae)\r\n  - Show the boot progress with an `(N/total)` counter (#4902 #5602, thanks to @mn-ram and @saswatsam786)\r\n\r\n- MCP:\r\n  - Implement the `replace` tool for targeted file edits (#5540, thanks to @bonifaido)\r\n\r\n- nerdctl:\r\n  - Update from v2.4.1 to [v2.4.2](https://github.com/containerd/nerdctl/releases/tag/v2.4.2) (#5703)\r\n\r\n- Templates:\r\n  - Update the default Ubuntu (`default`, `ubuntu`, ...) to 26.10 (#5657)\r\n  - Update Fedora (`fedora`, `podman`, ...) to 45 (#5694m #5734, thanks to @kolyshin)\r\n  - Update openSUSE Leap (`opensuse-leap`) to 16.1 (#5735, thanks to @e-minguez)\r\n  - `oraclelinux-8`, `centos-stream`: Drop legacy BIOS configuration (#5710)\r\n  - `k8s`: Add a parameter for apt-proxy (#5251, thanks to @afbjorklund)\r\n  - `k8s`: Allow installing on the minimal image variant (#5385, thanks to @afbjorklund)\r\n  - `k8s`: Pin Kubernetes version to 1.37 (#5463, thanks to @afbjorklund)\r\n  - `k8s`: Accept an `https://` URL when joining a node (#5559, thanks to @Sarthak-Shreshtha01)\r\n  - `k3s`: Add parameters for apt-proxy and registry (#5251, #5257 #5377, thanks to @afbjorklund)\r\n\r\n- Release artifacts:\r\n  - Add SBOM artifacts (#5220, thanks to @afbjorklund)\r\n  - Add the JSON schema of `lima.yaml` (#5339 #5380, thanks to @afbjorklund)\r\n\r\n- Security fixes:\r\n  - GHSA-566x-598w-h7w7 Guest can read host files as QEMU option ROMs loaded from limactl's cwd (800a96b14e96b5d2ceb20ab2602147c1e79224ea)\r\n  - GHSA-4wvf-9pjc-cpfp limactl shell --sync applies unreviewed guest changes to host (TOCTOU) (#5752, thanks to @unsuman)\r\n\r\nFull changes: https://github.com/lima-vm/lima/milestone/74?closed=1\r\n\r\nThanks to @ChengyuZhu6 @Glitch-On @HMM-210 @KayleMaster @MEETNANDA8107 @Nachiket-Roy @Nashit-h @PhysicistJohn @QIU-Guanzong @SABITHSAHEB @Sarthak-Shreshtha01 @SethFalco @ShauryaBisht @Sonichigo @Soumya-codr @afbjorklund @aka-rider @albdv @alexandear @arixmkii @bcollard @bonifaido @chrisanderton @dawudkhan @deltron-fr @e-minguez @ekalinin @iamstarkov @jandubois @kolyshkin @lbarrosby @mie313 @mn-ram @mvanhorn @nightcityblade @olamile\r\n\r\n## Usage\r\n```console\r\n$ limactl create\r\n$ limactl start\r\n...\r\nINFO[0029] READY. Run `lima` to open the shell.\r\n\r\n$ lima uname\r\nLinux\r\n```\r\n\r\n- - -\r\nThe binaries were built automatically on GitHub Actions.\r\nThe build log is available for 90 days: https://github.com/lima-vm/lima/actions/runs/42233760842\r\n\r\nThe Software Bill of Materials (SBOM) is in the *.sbom.tar.gz artifact.\r\nIt does not cover software that is downloaded during Lima operation, such as nerdctl-full*.tar.gz or the cloud images.\r\n\r\nThe sha256sum of the SHA256SUMS file itself is `5f9eaa93d2b58986273347d0f139b95f8fb87f117d98897760dee8d5b9d45ca6` .\r\n- - -\r\nRelease manager: @AkihiroSuda\r\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":46}
