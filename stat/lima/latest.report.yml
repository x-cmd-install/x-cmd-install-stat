517ed41101782d10b59ed23cbbb36c1bf54b030adb98f577211fd4d9","download_count":25,"created_at":"2026-10-03T13:01:08Z","updated_at":"2026-10-03T13:01:10Z"},{"id":607822670,"node_id":"RA_kwDOFeRR284kOqNO","name":"lima-additional-guestagents-2.2.1-Windows-AMD64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":38782230,"digest":"sha256:e64b4e3127ae50835b7a97788ff2f4c00a6ba1a3df80b8ef9bddc12d77d10752","download_count":6,"created_at":"2026-10-03T13:01:09Z","updated_at":"2026-10-03T13:01:10Z"},{"id":607822679,"node_id":"RA_kwDOFeRR284kOqNX","name":"lima-additional-guestagents-2.2.1-Windows-ARM64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":39625454,"digest":"sha256:771dc6783b30757305ce9ff42055386fcb6f276291efbab3d951ed6cb54103cd","download_count":6,"created_at":"2026-10-03T13:01:09Z","updated_at":"2026-10-03T13:01:11Z"},{"id":607822573,"node_id":"RA_kwDOFeRR284kOqLt","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1396,"digest":"sha256:4805ceeb791229ecaddcde32bf04b14742f4d036b343ad5d8c478ba5d220fff2","download_count":164,"created_at":"2026-10-03T13:01:06Z","updated_at":"2026-10-03T13:01:06Z"},{"id":607825767,"node_id":"RA_kwDOFeRR284kOq9n","name":"SHA256SUMS.asc","label":null,"uploader":{"login":"AkihiroSuda","id":9248427,"node_id":"MDQ6VXNlcjkyNDg0Mjc=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":699,"digest":"sha256:cc974212784876111d1a1d4ab2539e5c7fe2058de04e6c64c60d3887c8cabf2c","download_count":7,"created_at":"2026-10-03T13:03:01Z","updated_at":"2026-10-03T13:03:02Z"}],"body":"Several bug fixes and dependency updates.\r\n\r\n## Changes\r\n\r\n- Cherry-picks from `master` to `release/2.2` (#5564)\r\n  - end rsync option parsing before the copy paths (#5314, thanks to @Nashit-h)\r\n  - quote guest error string in time sync log (#5365, thanks to @Nashit-h)\r\n  - Update the Apptainer template for Ubuntu 26.04 (#5331, thanks to @afbjorklund)\r\n  - fix(store): do not trust PID files left behind by a previous boot (#5437, thanks to @ekalinin)\r\n  - strip control characters from guest cloud-init log lines (#5426, thanks to @Nashit-h)\r\n  - portfwdserver: relay TCP half-close from the host (#5401, thanks to @ravi-arnan)\r\n  - qemuimgutil: reject qcow2 external data file references (#5441, thanks to @Nashit-h)\r\n  - portfwd: don't close the live udp listener on a duplicate forward (#5384, thanks to @SABITHSAHEB)\r\n  - go.mod: update minimum Go version to 1.26 (remove `pkg/ptr`) (#5439)\r\n  - reject guest agent events that report an invalid IP (#5454, thanks to @SABITHSAHEB)\r\n  - hostagent: don't fsync every log record (#5418, thanks to @chrisanderton)\r\n  - copytool: make `copy -r` into an existing directory consistent across backends (#5501)\r\n  - templates: add macos-27 (Golden Gate) (#5503)\r\n  - nerdctl: update from v2.3.5 to [v2.4.0](https://github.com/containerd/nerdctl/releases/tag/v2.4.0) (#5509)\r\n  - driver(qemu): disable the TPM PPI on HVF with QEMU >= 11.0 (#5544, thanks to @unsuman)\r\n  - hack: ignore the Ubuntu grubenv race in the systemd check (#5357, thanks to @jandubois)\r\n  - CI: tolerate systemd-binfmt failure on wsl2 (#5555, thanks to @unsuman)\r\n  - guestagent: close the gRPC connection when a write fails (#5546, thanks to @Sarthak-Shreshtha01)\r\n  - fix: Disable LLMNR to prevent Debian SSH login delay (#5399, thanks to @mvanhorn)\r\n  - nerdctl: update from v2.4.0 to [v2.4.1](https://github.com/containerd/nerdctl/releases/tag/v2.4.1) (#5561)\r\n  - templates: update (#5562)\r\n  - limactl-url-fedora-rawhide: don't rely on COMPOSE_ID (#5563, thanks to @kolyshkin)\r\n  - portfwd: dial through the current guest agent client, not the one captured at listen time (#5558, thanks to @aka-rider)\r\n  - build(deps): bump google.golang.org/grpc from 1.82.0 to 1.82.1 (#5318)\r\n  - build(deps): bump google.golang.org/grpc from 1.82.1 to 1.83.0 (#5396)\r\n  - CI: Windows: install perl (#5427)\r\n  - CI: lint-quick: ignore cloud-native.slack.com 403 (#5428)\r\n  - build(deps): bump the golang-x group across 1 directory with 2 updates (#5429)\r\n  - hack/tools/go.mod: github.com/golangci/golangci-lint/v2 v2.13.0 (#5431)\r\n  - build(deps): bump google.golang.org/grpc from 1.83.0 to 1.83.1 (#5444)\r\n  - build(deps): bump google.golang.org/grpc from 1.83.1 to 1.83.2 (#5470)\r\n  - go.mod: golang.org/x/crypto v0.56.0 (#5479)\r\n  - fix(docs): replace broken Twitter/X URL in README (#5542, thanks to @unsuman)\r\n  - CI: lint-quick: ignore deepwiki.com 429 (#5548, thanks to @jandubois)\r\n  - build(deps): bump github.com/golangci/golangci-lint/v2 from 2.13.2 to 2.14.0 in /hack/tools (#5556)\r\n\r\nFull changes: https://github.com/lima-vm/lima/milestone/75?closed=1\r\n\r\n## Usage\r\n```console\r\n$ limactl create\r\n$ limactl start\r\n...\r\nINFO[0029] READY. Run `lima` to open the shell.\r\n\r\n$ lima uname\r\nLinux\r\n```\r\n\r\n- - -\r\nThe binaries were built automatically on GitHub Actions.\r\nThe build log is available for 90 days: https://github.com/lima-vm/lima/actions/runs/37123971168\r\n\r\nThe sha256sum of the SHA256SUMS file itself is `4805ceeb791229ecaddcde32bf04b14742f4d036b343ad5d8c478ba5d220fff2` .\r\n- - -\r\nRelease manager: @AkihiroSuda\r\n","mentions_count":13}
