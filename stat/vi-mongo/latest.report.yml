e v0.3.1\n\n<img src=\"https://github.com/kopecmaciej/vi-mongo/blob/master/assets/logo/no-background.svg\" align=\"center\"/>\n\n## What's New\n\n### New Features\n\n- **Configurable History Limit** (by [@thisago](https://github.com/thisago), [#123](https://github.com/kopecmaciej/vi-mongo/pull/123)): New top-level `historyLimit` property in `config.yaml` controls how many entries the history modal keeps. Default stays at 10.\n\n### Bug Fixes\n\n- **History Modal Quick-Select Shortcuts**: Digit shortcuts in the history modal now map correctly to entries 0-9 instead of breaking once more than ten entries were stored.\n\n## Thank You\n\nThank you to everyone who contributed to and tested this release!\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
