e5c8bf5864aa7efa03f8324","download_count":34,"created_at":"2026-10-15T18:31:27Z","updated_at":"2026-10-15T18:31:27Z"},{"id":644785088,"node_id":"RA_kwDOC0cxwM4mbqPA","name":"dua-v2.46.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2171247,"digest":"sha256:49616d1deb36109274f19c09dd70420d45bd0c58ea1441236b65b2fd0bdc89ff","download_count":367,"created_at":"2026-10-15T18:32:34Z","updated_at":"2026-10-15T18:32:34Z"},{"id":644781322,"node_id":"RA_kwDOC0cxwM4mbpUK","name":"dua-v2.46.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2494930,"digest":"sha256:4f284a388a063a99f938c6e0f5ea8d932868e1f9a4224622d97488f4ec671b41","download_count":431,"created_at":"2026-10-15T18:31:04Z","updated_at":"2026-10-15T18:31:06Z"}],"body":"A bugfix release, and one that should also restore cargo installations, making them function.\n\n### New Features\n\n - make walk result buffering configurable per worker\n   <!-- agent -->\n   Replace the fixed QUEUED_BATCHES_PER_WORKER constant with\n   Options::queued_batches_per_worker and a chainable builder method. Use\n   two queued batches per worker by default in both production and tests,\n   preserving the original bounded buffering behavior.\n   \n   Consumers that pause to process entries can opt into a larger queue to\n   keep traversal workers busy, trading memory for less idle time. A value\n   of zero selects an unbuffered channel. Check the worker-count\n   multiplication so excessive capacities cannot silently overflow.\n   \n   Update existing Options literals to inherit the new default. Verify the\n   actual queue capacity with one and two workers, and exercise larger and\n   unbuffered queues through the public single-root and multi-root walkers.\n\n### Bug Fixes\n\n - pass strict workspace Clippy on Rust 1.99\n   <!-- agent -->\n   Replace empty-container assertions with equality comparisons and empty\n   string checks with inequality comparisons. This satisfies Clippy's\n   assert_is_empty lint while showing actual values when assertions fail.\n   \n   Locally allow the deprecated fetch_update alias in directory identifier\n   allocation. Its replacement, try_update, requires Rust 1.95, while\n   dua-core supports Rust 1.88. Preserve the existing atomic update and\n   overflow handling without raising the minimum supported Rust version.\n - preserve flame graphs when export fails\n\n### Commit Statistics\n\n - 6 commits contributed to the release.\n - 15 days passed between releases.\n - 3 commits were understood as [conventional](https://www.conventionalcommits.org).\n - 0 issues like '(#ID)' were seen in commit messages\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n * **Uncategorized**\n    - Merge pull request #413 from dduugg/buffer-batches-ahead-of-consumer (4179fe2)\n    - Pass strict workspace Clippy on Rust 1.99 (afbe487)\n    - Make walk result buffering configurable per worker (2989d30)\n    - Merge pull request #412 from Likio3000/fix/atomic-flamegraph-export (d11cb9c)\n    - Review (c0c749a)\n    - Preserve flame graphs when export fails (9226029)\n</details>\n\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
