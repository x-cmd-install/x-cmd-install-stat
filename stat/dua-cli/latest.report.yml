43a0c89bf06b5c","download_count":90,"created_at":"2026-11-02T09:40:44Z","updated_at":"2026-11-02T09:40:45Z"},{"id":701243980,"node_id":"RA_kwDOC0cxwM4pzCJM","name":"dua-v3.0.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2151886,"digest":"sha256:5426e4a62ae7c0a893cf7dad2ecdb7b1645b636c200ca2f767a302d0f0716a1f","download_count":672,"created_at":"2026-11-02T09:42:34Z","updated_at":"2026-11-02T09:42:34Z"},{"id":701237992,"node_id":"RA_kwDOC0cxwM4pzAro","name":"dua-v3.0.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2500758,"digest":"sha256:59438b0934a521dd4cf2896fa42046023df60e1c25812a07cef913dc2b2d103f","download_count":997,"created_at":"2026-11-02T09:40:03Z","updated_at":"2026-11-02T09:40:04Z"}],"body":"### Documentation (BREAKING)\n\n - declare the Rust library API experimental\n   Mark the crate root so all Rust library exports participate in experimental\n   compatibility checks. Future API breaks require minor releases while patch\n   compatibility remains checked. Document tilde requirements for library\n   consumers and retain the stable CLI and dua-core compatibility policies.\n   \n   The transition removes the previous stable Rust library API promise and\n   requires dua-cli 3.0.0. Let smart-release apply versions during release.\n\n### Bug Fixes (BREAKING)\n\n - retain filesystem paths in traversal errors\n   Just looked at the production code and rubber-stamped the tests.\n   All that really happens is a new error type that retains more information\n   \n   <!-- agent -->\n   RootEvent and Walk previously yielded plain I/O errors, leaving consumers\n   unable to identify a failing descendant. Return a typed dua_core::Error\n   with the entry path, or the directory path when enumeration cannot identify\n   an entry, and retain the original I/O error for kind and OS-code inspection.\n   \n   Keep sibling failures as separate iterator items. Update native and ordinary\n   reads, streamed roots, prepared roots, cancellation, and CLI forwarding.\n   Metadata errors remain attached to their Entry. Document the breaking API\n   change and conversion back to io::Error.\n   \n   Regression coverage removes two sibling directories before descent in both\n   orders and metadata modes; it also checks missing and streamed roots,\n   original OS errors, source access, and conversion without losing context.\n   The regression initially failed because io::Error has no path accessor.\n\n### Commit Statistics\n\n - 6 commits contributed to the release.\n - 18 days passed between releases.\n - 2 commits were understood as [conventional](https://www.conventionalcommits.org).\n - 1 unique issue was worked on: #421\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n * **#421**\n    - Retain filesystem paths in traversal errors (d5114df)\n * **Uncategorized**\n    - Declare the Rust library API experimental (c45461d)\n    - Merge pull request #424 from Byron/better-error-handling (c392945)\n    - Merge pull request #415 from Rajvira10/fix/marked-path-display-width (9ccf20f)\n    - Review (3ab91b4)\n    - Fix marked-pane alignment for wide Unicode paths (d8a9376)\n</details>\n\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":0,"rocket":0,"eyes":0}}
