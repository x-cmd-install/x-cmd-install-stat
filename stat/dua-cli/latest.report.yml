59869e91ebfb41397f5d67d","download_count":106,"created_at":"2026-09-30T11:38:01Z","updated_at":"2026-09-30T11:38:02Z"},{"id":600782484,"node_id":"RA_kwDOC0cxwM4jzzaU","name":"dua-v2.45.1-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2169099,"digest":"sha256:48c245f987c5359df0302202e6338e3235e4a4724db58d7d66138b096e8b2015","download_count":593,"created_at":"2026-09-30T11:39:24Z","updated_at":"2026-09-30T11:39:24Z"},{"id":600780353,"node_id":"RA_kwDOC0cxwM4jzy5B","name":"dua-v2.45.1-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2494791,"digest":"sha256:e9279f02bbbf22611c1602c4d5b526c9b99962d3d828016d48a0ee5b27252805","download_count":841,"created_at":"2026-09-30T11:38:12Z","updated_at":"2026-09-30T11:38:13Z"}],"body":"### Documentation\n\n - correct platform defaults in threads help\n\n### Bug Fixes\n\n - don't fail on sole directory inputs beyond `MAX_PATH` on Windows\n   A sole directory input is changed into so its entries can be listed and\n   reported relative to it, but `set_current_dir` enforces `MAX_PATH` on\n   Windows (os error 206) even though the directory itself can still be\n   traversed through verbatim paths.\n   \n   When the change fails, expand the directory into absolute input paths\n   directly instead of aborting, which makes a single long directory input\n   work in list, aggregate, stacks and interactive modes alike. Reported\n   paths are absolute then, consistent with how multiple inputs are already\n   displayed.\n   \n   The expanded root is returned to callers so the interactive mode still\n   knows which directory the inputs belong to, and recorded in the new\n   `WalkOptions::base_dir`, which every traversal uses as the working\n   directory stand-in for ignore-pattern matching. That keeps `--ignore-from`\n   patterns matching descendants relative to the expanded root - identical to\n   what a successful `chdir` would have produced.\n   \n   Fixes https://github.com/Byron/dua-cli/issues/410\n - don't panic on non-UTF-8 filenames when matching ignore patterns\n   On Windows, NTFS filenames may contain unpaired surrogates that cannot be\n   represented in UTF-8. `IgnorePatterns::is_excluded` converted each entry's\n   relative path with the panicking `gix::path::into_bstr`, so a single such\n   name anywhere in a scanned tree aborted the whole process when\n   `--ignore-from` was used - in list, aggregate and stacks modes alike, as\n   well as in `clean`'s entry filtering.\n   \n   Match on the OS string's encoded bytes instead - `OsStr::as_encoded_bytes`\n   yields a self-synchronizing UTF-8 superset (WTF-8 on Windows, the raw bytes\n   on Unix) which represents lone surrogates losslessly. The glob matcher then\n   compares bytes, so wildcard patterns that don't spell out the invalid code\n   unit, like `*` or `*.txt`, still match such names instead of silently\n   letting them through.\n   \n   Fixes https://github.com/Byron/dua-cli/issues/408\n\n### Commit Statistics\n\n - 9 commits contributed to the release.\n - 18 days passed between releases.\n - 3 commits were understood as [conventional](https://www.conventionalcommits.org).\n - 0 issues like '(#ID)' were seen in commit messages\n\n### Commit Details\n\n<csr-read-only-do-not-edit/>\n\n<details><summary>view details</summary>\n\n * **Uncategorized**\n    - Merge pull request #411 from Mathjk/fix/long-path-single-dir (9a854d2)\n    - Review (1d68918)\n    - Merge pull request #409 from Mathjk/fix/ignore-from-nonutf8 (37e6aa8)\n    - Don't fail on sole directory inputs beyond `MAX_PATH` on Windows (2fbb8f5)\n    - Don't panic on non-UTF-8 filenames when matching ignore patterns (22d5588)\n    - Merge pull request #405 from Byron/del-remaining (d190513)\n    - Show deleted bytes in the deletion status line (9a3bfa1)\n    - Merge pull request #404 from Likio3000/docs/dua-cli-behavior-20260923 (cf59618)\n    - Correct platform defaults in threads help (d6acb50)\n</details>\n\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0}}
