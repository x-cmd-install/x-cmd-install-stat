{"id":443194754,"author":{"login":"themez","id":1323793,"node_id":"MDQ6VXNlcjEzMjM3OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJF_VYs4aap2C","tag_name":"v1.24.4","target_commitish":"main","name":"v1.24.4","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-12T15:41:10Z","updated_at":"2026-11-12T16:12:43Z","published_at":"2026-11-12T16:12:43Z","assets":[],"body":"## v1.24.4 - 2026.11.12\n\n### Downloads\n\n- [macOS (Apple Silicon)](https://download.chatboxai.app/releases/Chatbox-1.24.4-arm64.dmg)\n- [macOS (Intel)](https://download.chatboxai.app/releases/Chatbox-1.24.4.dmg)\n- [Windows (x64)](https://download.chatboxai.app/releases/Chatbox-1.24.4-Setup.exe)\n- [Linux (x64 DEB)](https://download.chatboxai.app/releases/Chatbox-1.24.4-amd64.deb)\n- [Linux (ARM64 DEB)](https://download.chatboxai.app/releases/Chatbox-1.24.4-arm64.deb)\n\n### What’s Changed\n\n1. Improved conversation scrolling and history loading, including position retention when switching branches or regenerating replies\n2. Unified the frosted glass appearance of popups and panels over chat wallpapers\n3. Improved settings card styling in dark mode\n4. Fixed downloading large SVG diagrams on mobile and added error messages\n5. Fixed file tools being enabled in some cases when they were not needed\n\n### 更新说明\n\n1. 优化对话滚动和历史消息加载，改善切换分支、重新生成回复时的位置保持\n2. 使用聊天壁纸时，弹窗和面板采用统一的毛玻璃效果\n3. 优化深色模式下设置页面的卡片样式\n4. 修复移动端下载较大 SVG 图表可能失败的问题，并增加失败提示\n5. 修复部分情况下错误启用文件工具的问题\n"}
