{"id":395756243,"author":{"login":"themez","id":1323793,"node_id":"MDQ6VXNlcjEzMjM3OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJF_VYs4XlsLT","tag_name":"v1.23.5","target_commitish":"main","name":"v1.23.5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-24T14:08:30Z","updated_at":"2026-09-24T14:09:30Z","published_at":"2026-09-24T14:09:30Z","assets":[],"body":"## v1.23.5 - 2026.09.24\n\n### Downloads\n\n- [macOS (Apple Silicon)](https://download.chatboxai.app/releases/Chatbox-1.23.5-arm64.dmg)\n- [macOS (Intel)](https://download.chatboxai.app/releases/Chatbox-1.23.5.dmg)\n- [Windows (x64)](https://download.chatboxai.app/releases/Chatbox-1.23.5-Setup.exe)\n- [Linux (x64 DEB)](https://download.chatboxai.app/releases/Chatbox-1.23.5-amd64.deb)\n- [Linux (ARM64 DEB)](https://download.chatboxai.app/releases/Chatbox-1.23.5-arm64.deb)\n\n### What\u2019s Changed\n\n1. Fixed external one-click MCP setup links failing to open the prefilled server dialog when the app was not running\n2. You can now edit the last output of a Work Mode reply\n3. Fixed Image Creator history going blank or failing to finish loading when a record is incomplete\n4. Fixed undoing a new topic sometimes deleting the previous conversation\n5. Fixed leftover digits in the message input after pasting during nine-key typing\n\n### \u66f4\u65b0\u8bf4\u660e\n\n1. \u4fee\u590d\u5e94\u7528\u672a\u542f\u52a8\u65f6\uff0c\u901a\u8fc7\u5916\u90e8\u94fe\u63a5\u4e00\u952e\u6dfb\u52a0 MCP \u670d\u52a1\u65e0\u6cd5\u6253\u5f00\u9884\u586b\u914d\u7f6e\u7a97\u53e3\u7684\u95ee\u9898\n2. \u5de5\u4f5c\u6a21\u5f0f\u7684\u52a9\u624b\u56de\u590d\u73b0\u5728\u53ef\u4ee5\u7f16\u8f91\u6700\u540e\u4e00\u6bb5\u8f93\u51fa\n3. \u4fee\u590d\u56fe\u7247\u521b\u4f5c\u5386\u53f2\u8bb0\u5f55\u4e0d\u5b8c\u6574\u65f6\u9875\u9762\u767d\u5c4f\u6216\u65e0\u6cd5\u7ee7\u7eed\u52a0\u8f7d\u7684\u95ee\u9898\n4. \u4fee\u590d\u65b0\u5efa\u8bdd\u9898\u540e\u64a4\u9500\u4f1a\u8bef\u5220\u539f\u6765\u804a\u5929\u8bb0\u5f55\u7684\u95ee\u9898\n5. \u4fee\u590d\u4e5d\u952e\u8f93\u5165\u8fc7\u7a0b\u4e2d\u7c98\u8d34\u540e\u8f93\u5165\u6846\u51fa\u73b0\u4e00\u4e32\u6570\u5b57\u7684\u95ee\u9898\n"}
