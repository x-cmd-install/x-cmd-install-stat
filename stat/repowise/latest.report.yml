): render the history the file pages already carry by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2082\n* feat(architecture): move map chrome off the canvas and give it a ground by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2102\n* feat(architecture): make the Map a place you can drill into by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2104\n* fix(graph): declare every graph hook above the loading early-return by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2111\n* feat(communities): count production files, read conductance, name the ungrouped by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2112\n* feat(ingestion): index Razor/Blazor markup (.razor, .cshtml) into the graph (#1404) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/1962\n* feat(languages): QML at the lightweight import tier (#727) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2039\n* feat(workspace): HTTP consumer contracts for Go, Ruby, Java, Kotlin and PHP by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2114\n* feat(workspace): provider contracts for Flask, Micronaut and Remix by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2115\n* feat(workspace): breaking changes on the contracts page and a contract drawer by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2116\n* feat(ingestion): emit Flutter widget-tree edges from build() bodies (#142) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2049\n* feat(languages): GDScript AST support at the Good tier by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/1620\n* feat(languages): add VB.NET at the Good tier (#1041) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2048\n* feat(godot): make Godot scripts reachable through scenes, autoloads and class_name by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/1624\n* docs(languages): keep LANGUAGE_SUPPORT.md to the ladder, move mechanics to the architecture note by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2124\n* feat(workspace): cross-repo test impact analysis (#2006) by @soumojit-D48 in https://github.com/repowise-dev/repowise/pull/2008\n* feat(mcp): size in tool telemetry, freshness on flows, and an update pointer on stale low answers by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2122\n* feat(workspace): surface cross-repo test impact on get_change_risk, get_blast_radius, the API and the contract page by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2123\n* feat(mcp): a basis on every zero, a scope hint, a completeness line, and no source served twice by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2125\n* docs(mcp): guidance that matches the response envelope by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2126\n* feat(languages): parse Elixir to a full AST and move it to Good by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2127\n* fix(cli): warn when cascade budget truncates regeneration by @jyotirmya17 in https://github.com/repowise-dev/repowise/pull/1720\n* fix(coverage): stamp ingested_commit_sha from the live HEAD, not the stale stored column by @sloemo01 in https://github.com/repowise-dev/repowise/pull/1800\n* fix(generation): prioritize oldest stale pages when the budget is constrained by @sloemo01 in https://github.com/repowise-dev/repowise/pull/1845\n* perf(update): record a phase timing row per update stage by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2128\n* fix(cli): prevent stale file_page rows from surviving repowise update (#1744) by @kunnalsinngh14 in https://github.com/repowise-dev/repowise/pull/1906\n* fix(update): five places the incremental path knew less than a full index by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2129\n* feat(risk): say when a diff is several changes the index does not connect by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2130\n* perf(update): a one-file update sized by what changed by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2134\n* feat(risk): branch overlap, the other open branches editing the files you edit by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2131\n* feat(languages): parse F# to a full AST and move it to Good by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2133\n* feat(languages): parse Objective-C to a full AST and move it to Good by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2135\n* feat(ingestion): register unresolved Python imports as external nodes by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2136\n* feat(decisions): propose conventions the import graph proves by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2141\n* fix(cli): resolve the hooks dir git actually runs by @haibeeb in https://github.com/repowise-dev/repowise/pull/1511\n* fix(vocabulary): guard symbol-only headings from crashing by @akshatmalik-bruh in https://github.com/repowise-dev/repowise/pull/2101\n* fix(persistence): compile dialect-safe boolean defaults by @justonemorenight in https://github.com/repowise-dev/repowise/pull/2087\n* fix(cli): stop doctor reporting excluded files as missing by @azhard in https://github.com/repowise-dev/repowise/pull/2085\n* fix MCP workspace detection and add no-workspace flag by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/2088\n* fix(risk-semantics): correct temporal_hotspot contract to unbounded (\u2026 by @akshatmalik-bruh in https://github.com/repowise-dev/repowise/pull/1971\n* fix(core): validate REPOWISE_EMBEDDING_DIMS at parse points (#826) by @jyotirmya17 in https://github.com/repowise-dev/repowise/pull/1979\n* feat: Enable C language health coverage and format codebase by @krishna231122-del in https://github.com/repowise-dev/repowise/pull/2113\n* build(deps-dev): bump fast-uri from 3.1.5 to 3.1.7 by @dependabot[bot] in https://github.com/repowise-dev/repowise/pull/2081\n* release: v0.49.0 - five languages to Good, a Map you can drill into, and an update that sizes itself by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2146\n\n## New Contributors\n* @soumojit-D48 made their first contribution in https://github.com/repowise-dev/repowise/pull/2008\n* @kunnalsinngh14 made their first contribution in https://github.com/repowise-dev/repowise/pull/1906\n* @krishna231122-del made their first contribution in https://github.com/repowise-dev/repowise/pull/2113\n\n**Full Changelog**: https://github.com/repowise-dev/repowise/compare/v0.48.0...v0.49.0","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":3,"eyes":0},"mentions_count":12}
