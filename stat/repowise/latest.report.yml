ect what 0.52.0 changed, and give documentation drift a page by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2480\n* feat(perf): plans that claim only what they can back, and an over-fetch detector by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2495\n* refactor(core): move the lead fold into core, add heritage kinds, compare change health without a checkout by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2494\n* fix(security): detect vendor credential shapes and PEM keys, not just variable names by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/2223\n* refactor(workspace): one dialect base for every contract type, and topics that follow RabbitMQ bindings by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2501\n* feat(workspace): open contracts in a drawer, with search, paging and a needs-attention list by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2497\n* fix(ui): scroll only the tab row when ViewTabs reveals its active tab by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2498\n* feat(workspace): open co-changing file pairs in a drawer, with search and cap reporting by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2499\n* feat(workspace): replace the System Map inspector with a drawer, lenses and findings by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2500\n* fix(security): mask secrets in every stored snippet, and clear rows stored raw by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2496\n* fix(communities): never name a community after a third-party module by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2502\n* feat(graph): bundle community links in the Files view, and make it the default by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2503\n* feat(perf): promote plans on facts that settle their prerequisites by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2504\n* refactor(php): one composer reader and framework-facts registry, with PHP references the graph used to miss by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2505\n* refactor(attention): move the ranking fold into core over plain records by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2506\n* perf(server): load repowise.server.schemas submodules on first access by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2507\n* refactor(test-impact): split analyze_test_impact into a session read and a pure assemble_test_impact by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2508\n* fix(mcp): report an unknown search_codebase mode instead of coercing it by @8rulerstar in https://github.com/repowise-dev/repowise/pull/2392\n* refactor(decisions): read acceptance requirements from plain records in lifecycle by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2510\n* refactor(search): move query-shape routing into a module with no database import by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2511\n* feat(laravel): serve routes under their groups, link registrations, and read migrations as tables by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2512\n* feat(perf): read session.get as a query, and prove fewer batch plans than before by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2513\n* feat(perf): keep repetition with nothing to change out of the default queue by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2514\n* fix(health): keep the test named for a file when a validation list is capped by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2515\n* fix(ui): give the health map the expected actionability state by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2520\n* refactor(core): move knowledge silo ranking and onboarding targets into core by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2517\n* refactor(core): move owner, module health and reviewer rollups into core by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2518\n* refactor(core): move the refactoring summary chips into core by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2519\n* refactor(ui): read the drawer's actionability words from ACTIONABILITY_LABEL by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2522\n* fix(perf): prove fewer batch plans, and stop reading a plugin registry as a query by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2521\n* feat(workspace): read queues, pub/sub and socket events across Laravel and Node by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2525\n* feat(stats): one-page stats report, scoped windows and new records by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2526\n* feat(workspace): read NestJS routes, Node HTTP clients and Node ORM tables by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2527\n* feat(perf): flag a lazily loaded relationship read once per row in a loop by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2528\n* refactor(workspace): serve workspace reads from importable functions by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2530\n* feat(workspace): read Angular HttpClient calls and Angular app entry points by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2531\n* fix(test-impact): report a failed head-commit read as degraded instead of absent by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/2529\n* fix(providers): make opencode subprocess concurrency configurable via shared resolver by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/2485\n* fix(mcp): keep pathless symbol rows out of get_answer's homonym union by @8rulerstar in https://github.com/repowise-dev/repowise/pull/2391\n* fix(cli): honor REPOWISE_MODEL environment variable in provider resolution by @Tyagiquamar in https://github.com/repowise-dev/repowise/pull/2276\n* fix(rust): inherit `impl` block visibility from target type/trait declaration (#2389) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2427\n* fix(health): count Pascal for-in loops, add a performance dialect by @Laex in https://github.com/repowise-dev/repowise/pull/2233\n* Derive LiteLLM reasoning capabilities from local metadata by @Selene29 in https://github.com/repowise-dev/repowise/pull/2240\n* fix(cli): clear distill.commands.enabled and remove AGENTS.md on hook rewrite uninstall (#2471) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2491\n* fix(claude): remove distill allow rules on uninstall and check in leftover reason (#2470) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2483\n* release: v0.53.0 \u2014 Laravel, NestJS, Node and Angular contracts, and performance plans that claim only what they prove by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2533\n\n## New Contributors\n* @8rulerstar made their first contribution in https://github.com/repowise-dev/repowise/pull/2392\n* @Tyagiquamar made their first contribution in https://github.com/repowise-dev/repowise/pull/2276\n\n**Full Changelog**: https://github.com/repowise-dev/repowise/compare/v0.52.0...v0.53.0","mentions_count":7}
