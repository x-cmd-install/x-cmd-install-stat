om/repowise-dev/repowise/pull/5733\n* fix(embedding): accept an OpenRouter model outside _DIMS when its width is configured by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5732\n* fix(mcp): publish selected tests before releasing the flight by @SteelOtter1242 in https://github.com/repowise-dev/repowise/pull/5730\n* fix: replace cp1252-double-encoded UTF-8 across seven tracked files by @aazminu in https://github.com/repowise-dev/repowise/pull/4100\n* feat(telemetry): record which include blocks an MCP tool call asked for by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5752\n* feat(health): store each function's body digest and size in function_facts by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5755\n* fix(ui): label a proven performance cost \"Loop size known\", not \"Measured\" by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5748\n* fix(ingestion): index JS/TS functions assigned to a property or a var by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5750\n* feat(telemetry): record which web views are opened by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5754\n* feat(telemetry): report how coverage add ended by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5753\n* refactor(core): one line-to-enclosing-symbol helper over symbol spans by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5757\n* feat(settings): add the evidence block for runtime evidence caps by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5764\n* feat(core): resolve profile frames to indexed symbols by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5758\n* docs(performance): describe the default queue by how the code shows cost, not measured cost by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5749\n* feat(evidence): define the repowise-evidence-v1 format and its validator by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5762\n* refactor(coverage): share the report ingest steps outside coverage add by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5763\n* feat(core): fold nested frames and attribute module bodies in resolve_frames by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5759\n* feat(persistence): add the runtime evidence store tables by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5761\n* fix(server): waive the bodiless view telemetry route in the response contract by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5769\n* fix(evidence): refuse non-string kinds and padded commits in evidence files by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5772\n* feat(change-health): list every symbol a diff touches by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5767\n* feat(suspects): name the function a trace frame ran in by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5760\n* feat(evidence): add repowise evidence add by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5765\n* feat(update): carry a function's lineage across renames and moves by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5756\n* feat(mcp): list changed symbols in get_change_risk under include=findings by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5768\n* feat(evidence): add repowise evidence status by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5766\n* fix(coverage): stamp measurement_commit on re-read coverage reports (#5744) by @Imad2702 in https://github.com/repowise-dev/repowise/pull/5770\n* feat(doctor): name the source files ingestion drops on size (#5415) by @raphaelbahat in https://github.com/repowise-dev/repowise/pull/5597\n* feat(perl): add Perl 5 as a supported language by @SteelOtter1242 in https://github.com/repowise-dev