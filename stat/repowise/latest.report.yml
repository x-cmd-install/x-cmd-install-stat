: report actual LLM provider availability by @justonemorenight in https://github.com/repowise-dev/repowise/pull/2086\n* fix(server): keep Git inspection off the event loop by @justonemorenight in https://github.com/repowise-dev/repowise/pull/2103\n* fix(server): resolve primary vector store for postgresql databases (#2140) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2144\n* fix(security): add value gate, placeholder filter, and path awareness for credential findings (#2118) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2121\n* docs: document native VS Code Language Model tools and agentTools setting by @akshatmalik-bruh in https://github.com/repowise-dev/repowise/pull/2096\n* fix(init): surface generation-phase embed failures in the run's degraded list (#1369) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2108\n* fix(update): surface the two silent embedder degradations (#1370) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2107\n* fix(update): show live progress and persist incrementally on --full (#1709) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2038\n* fix(cli): dispose the cost-tracker engine so a later loop doesn't reuse a dead connection by @AmirF194 in https://github.com/repowise-dev/repowise/pull/2083\n* fix(pages): pass repo_id to regenerate so Write-with-AI works in workspace mode by @sloemo01 in https://github.com/repowise-dev/repowise/pull/1809\n* feat(health): score code files only and split the score in two by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2153\n* feat(health): report production or all code, and name a cause you can fix by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2154\n* feat(health): lead with two figures and mark history as something to watch by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2161\n* feat(health): lead with one score, and let the reader choose what it counts by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2164\n* feat(health): stop alarming for a fall the code did not cause by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2171\n* feat(init): install the post-commit hook by default, with the guards that make it safe by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2143\n* perf(workspace): make the package init lazy so a leaf import stops loading the analysis stack by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2178\n* fix(mcp): count response tokens by content class, and stamp what the budget dropped by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2179\n* feat(health): one band vocabulary, and counts for the CLI and MCP by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2180\n* perf(mcp): cache query embeddings so a repeated search skips the provider by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2189\n* feat(chat): ground the first answer in the page the person is on by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2188\n* fix(search): weight the path and title columns in the full-text rank by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2191\n* feat(chat): reach a scoped composer in one gesture from any repository page by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2190\n* feat(health): make the findings tab one triage list that pages by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2200\n* docs(health): say what the score counts, and stop the agent line reading inverted by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2201\n* fix: raise tree-sitter floor to 0.25, test query compilation by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/2170\n* fix(core): consolidate DOC_EXTENSIONS copies and add drift guard (#1489) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2159\n* fix(postgres): widen git_function_blame.symbol_id to Text by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/2169\n* fix(workspace): stop dropping the repo you pointed at when it is a submodule by @oldschoola in https://github.com/repowise-dev/repowise/pull/2196\n* fix(server): detect repo index presence from database in list_repos (#2139) by @rishu685 in https://github.com/repowise-dev/repowise/pull/2187\n* perf(server): cache HTTP query embeddings by @justonemorenight in https://github.com/repowise-dev/repowise/pull/2192\n* fix(web): load active provider from providers API by @justonemorenight in https://github.com/repowise-dev/repowise/pull/2155\n* fix(init): --resume skips the interactive questionnaire (#2098) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2106\n* fix(vocabulary): skip fenced code blocks when harvesting headings (#2142) by @akshatmalik-bruh in https://github.com/repowise-dev/repowise/pull/2150\n* docs(quickstart): --no-editor-setup covers the repo-root .mcp.json too by @oldschoola in https://github.com/repowise-dev/repowise/pull/2199\n* fix(server): index with the provider the dashboard picked, not a guess by @oldschoola in https://github.com/repowise-dev/repowise/pull/2198\n* fix(workspace): give the index phase the provider it was launched with by @oldschoola in https://github.com/repowise-dev/repowise/pull/2197\n* fix(generation): give e2e spec files a wiki page by @sloemo01 in https://github.com/repowise-dev/repowise/pull/1842\n* feat(mcp): add set_finding_status \u2014 the durable write half of findings triage (#1535) by @sloemo01 in https://github.com/repowise-dev/repowise/pull/2043\n* fix: map boolean reasoning config values to valid modes by @soumojit-D48 in https://github.com/repowise-dev/repowise/pull/1990\n* feat(risk): say which side of a co-change pair leads by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2202\n* feat(chat): Build composer suggestions from what the page measured by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2205\n* chore(deps): group Dependabot updates, and bump gitpython by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2206\n* feat: add Elixir, F# and ObjC to health complexity maps by @krishna231122-del in https://github.com/repowise-dev/repowise/pull/2152\n* fix(web): list the providers the server actually has, not a hardcoded copy by @oldschoola in https://github.com/repowise-dev/repowise/pull/2203\n* fix(health): correct the Elixir, F# and Objective-C complexity maps by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2225\n* release: v0.50.0 - one health vocabulary, findings you can triage, and chat you reach from the row by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/2221\n\n## New Contributors\n* @AmirF194 made their first contribution in https://github.com/repowise-dev/repowise/pull/2083\n* @oldschoola made their first contribution in https://github.com/repowise-dev/repowise/pull/2196\n\n**Full Changelog**: https://github.com/repowise-dev/repowise/compare/v0.49.0...v0.50.0","mentions_count":10}
