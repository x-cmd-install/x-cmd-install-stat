tet-stream","state":"uploaded","size":5527,"digest":"sha256:b31dba1ba67bcaa8f41b23268527ae16cd70b2be9b9990d3eb028f8d7d54ff51","download_count":130,"created_at":"2026-11-20T02:13:17Z","updated_at":"2026-11-20T02:13:18Z"},{"id":770092603,"node_id":"RA_kwDORDJI584t5q47","name":"SHA256SUMS.sig","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:75c025423e761f8af49e5600f6bfd4ee586782f0b5175b7bd9f1e04b6c3e0b7d","download_count":4,"created_at":"2026-11-20T02:13:18Z","updated_at":"2026-11-20T02:13:18Z"}],"body":"## New features\n\n- File a message in Tasks or quote it in a Kata issue from the web reader or Files viewer. When you add a message to an existing task, open **What's sent** to review the details, including the full sent timestamp.\n- Open **Related copies** in the email reader to find archived copies, replies, and forwards across accounts. Each result shows its account and why it matches. Archive owners can also use `msgvault family show <id>` or the `get_email_family` MCP tool.\n- Import LinkedIn messages, posts, and comments you wrote with `import-linkedin`. Use `import-tiktok` for TikTok direct messages and comments you wrote. Both commands accept a ZIP or extracted folder and update existing entries when you import again.\n- Archive Facebook Page and Instagram inbox messages as searchable chats. Configure Meta webhooks to capture new messages, comment changes, and mentions as they arrive. Inbox polling imports up to 20 recent messages per conversation, and Instagram profiles can also archive tagged media and ad comments.\n- Hide, unhide, delete, or reply to archived Facebook Page and Instagram comments with `msgvault comment` after enabling the actions for the profile.\n- Archive Bland calls with `add-bland` and `sync-bland`. MsgVault stores summaries, transcripts, and audio locally so they stay available after Bland's recording links expire.\n- See emailed meeting invitations, updates, and cancellations as calendar events. Use `msgvault import-ics` to add `.ics` calendar files or `repair-derived` to extract invitations from email already in your archive.\n- Open linked meeting notes and calendar events as one record, including individual occurrences of recurring meetings. Use `meetings suggest` to find likely matches, then link or split copies to correct the record.\n- Find Beeper voice memos by spoken words in ordinary message search. Set `voice_transcript_search = true` under `[integrations.docbank]` and restart the daemon to include generated transcripts for WAV and MP3 memos.\n- Search recording transcripts by meaning with `msgvault media search --mode semantic`, or combine meaning and keywords with `--mode hybrid`. This requires a Docbank server that supports semantic transcript search and a configured `recording_search_profile`.\n- Save someone you've never messaged with `msgvault person create`. Add contact details, employment, an address, and a note, then use `--publish` to request CardDAV publication.\n- Find people due for a check-in with `msgvault person directory --cadence due`, or sort overdue contacts by who has waited longest. Assign a contact list with a 21-, 60-, 180-, or 365-day interval, or set a custom interval. Filters and sorting are available through the CLI, API, and MCP.\n- Choose a server per command with `--remote <name>`. Define each archive under `[remotes.<name>]` in one config file. Hosted archives can use a local `credential_provider` to issue short-lived credentials for read commands limited to approved sources.\n- Stream JSONL with `export-messages` using a read-only remote key. Remote exports require server API schema 5.19.0 or later, and the CLI exits with an error if the stream ends before the completion record.\n- Filter the owner message change feed by sender, source, conversation, or incoming direction over HTTP or MCP. A filtered page can be empty while more changes remain, so keep paging while `has_more` is true.\n- Start and track a Gmail or IMAP historical import over MCP. Owners set a message limit and can narrow the import by date or use a Gmail query. Starting a job requires write opt-in and approval.\n- Read structured person profiles, edit history, and stored photos over MCP. Owners can also edit profile fields after enabling writes and confirming each change.\n- Find the right command by describing a task, for example `msgvault cli search \"find email by sender\"`. MCP clients can browse the quickstart and bundled guides with `msgvault.skills`.\n- See which Gmail downloads, processing steps, and file saves are still queued for retry with `msgvault diagnose-acquisition --source-id <id>`. Add `--all` to include failures that were resolved, retired, or could not be classified.\n\n## Improvements\n\n- Search Files by filename alongside the file type filters. The viewer shows the source message's title, date, and participants.\n- See saved values next to competing claims in a person's Facts panel, with the source of each claim and the reason MsgVault kept or changed the value. `person get --json` also reports when and how a saved person first appeared in the archive.\n- Count each attended meeting once in People and Relationships, even when linked notes and transcripts come from different sources or only one copy matches a filter. Meeting counts include occurrences with a transcript.\n- Get more complete lists of unresolved follow-ups on later requests. When the first scan is incomplete, MsgVault continues scanning in the background.\n- Resume an interrupted `sync-full` by copying the command it prints. The command preserves the account, filters, and other flags you used.\n- Recognize reply headers and quoted or forwarded history in plain-text Thunderbird mail in Spanish, Italian, and Portuguese when reading messages through MCP.\n- Share usage statistics only after opting in through Kenn or setting `TELEMETRY_ENABLED=1`. Changes to consent take effect at the next start. MsgVault ignores the old `[telemetry]` config section.\n- Review CardDAV cards again after upgrading if they contain names, contact details, or addresses inferred by MsgVault. Those cards require fresh approval before republication.\n\n## Bug fixes\n\n- Gmail and IMAP messages restored from Trash return to default search after sync confirms the restore. If an earlier Gmail restore is still hidden, run `msgvault sync-full <account>`.\n- Full Gmail backfills preserve pending label changes and deletions so the next incremental sync applies them.\n- `message-tags` reads current provider tags for messages marked deleted in the archive when the provider still has them.\n- IMAP sync handles failed reconnects as network errors without crashing.\n- Circleback sync retries HTTP rate limits for up to about two minutes per call.\n- Scheduled Beeper imports pause large group member lists between members so other sources get a turn. Later runs resume the unfinished work.\n- Explore shows which sources are waiting for account matching and lets you retry each one. In People, retrying a failed refresh updates the affected views without repeating the saved identity change.\n- Clicking a Messages row near the bottom of a person page opens it without the page scrolling the row out from under the pointer.\n- Scheduled profile enrichment defers work to the next budget day when it hits its daily limit around midnight UTC.\n- MCP reports when it cannot confirm the outcome of a write, so clients can check whether the change landed before retrying."}
