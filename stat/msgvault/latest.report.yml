et-stream","state":"uploaded","size":5527,"digest":"sha256:da52e5b65ac17d3694277eb564119e59427b46babe01a208c544ba9c7380260d","download_count":124,"created_at":"2026-11-15T13:37:41Z","updated_at":"2026-11-15T13:37:41Z"},{"id":751118273,"node_id":"RA_kwDORDJI584sxSfB","name":"SHA256SUMS.sig","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:09d77b7062eb5b0349a16b01d9b7cb292f6557051b3fd00e838c8ff9fd9c484b","download_count":3,"created_at":"2026-11-15T13:37:41Z","updated_at":"2026-11-15T13:37:41Z"}],"body":"## New features\n\n- Connect Claude Code and Codex to your archive with `msgvault agent setup`. The command installs skills and configures MCP access, the connection assistants use to work with MsgVault. `msgvault setup status` reports each installed agent's connection status and any repair command.\n- Sync Microsoft 365 mailboxes from multiple organizations without switching configuration between runs. Define named apps under `[microsoft.apps.NAME]` and select one with `msgvault add-o365 ADDRESS --oauth-app NAME`. Teams, contacts, and the web add-source form continue to use `[microsoft]`.\n- Find MCP tools by describing a task with `search_tools`. Search runs locally and returns relevant tools with their descriptions and inputs, limited to those available to the connection.\n- Export one person's messages as JSONL through an MCP-connected assistant. Archive owners receive the export, manifest, and completion receipt without running `msgvault export-messages` separately. Exports must fit within the 512 KiB response limit.\n- Review staged deletions through MCP without enabling writes. Archive owners can now list deletion batches with `list_deletions` and read a batch's receipt with `get_deletion`. These tools are unavailable to delegated sessions.\n\n## Improvements\n\n- Remove leftover Microsoft tokens when removing a Graph mail or IMAP source. MsgVault attempts cleanup across the default and named apps, keeps tokens another active source still uses, and warns when unreadable IMAP settings prevent cleanup.\n- Identify an IMAP account's authentication method through the accounts API's optional `auth_method` field when its settings are readable.\n\n## Bug fixes\n\n- Run the Linux release binaries on distributions back to Ubuntu 22.04 again. The withdrawn 0.24.0 Linux binaries required glibc 2.43 and failed with ``version `GLIBC_2.43' not found`` on Ubuntu 24.04, Debian 12, and other releases older than Ubuntu 26.04. If updating to 0.24.0 left msgvault unable to start, reinstall with `curl -fsSL https://msgvault.io/install.sh | bash`. Your archive was not changed.\n- Keep your working installation when an update fails verification. `msgvault update` checks that the new binary starts before replacing the installed one. A failed, timed-out, or canceled check leaves the existing binary in place.\n- Restore provider credentials, CardDAV logins, and the server API key on Windows with the required access permissions. Restore preserves files omitted from the backup and reports permission conflicts. To repair a conflict, move the conflicting file aside, stop the daemon, and rerun `msgvault backup restore SNAPSHOT --repo REPO --target DIR --permissions-only`.\n"}
