on/octet-stream","state":"uploaded","size":5527,"digest":"sha256:ec878f3f5831fae4c291ee8a04b16705f4db19dcf7ea17c807b5a4e50300e7ef","download_count":337,"created_at":"2026-11-05T01:36:34Z","updated_at":"2026-11-05T01:36:34Z"},{"id":711629214,"node_id":"RA_kwDORDJI584qapme","name":"SHA256SUMS.sig","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:0e0a1bf4cc0128bb6349f8b80cd7b5199cac03f65d304419fa7a6a5a6cefa7f1","download_count":5,"created_at":"2026-11-05T01:36:35Z","updated_at":"2026-11-05T01:36:35Z"}],"body":"## New features\n\n- Import Telegram Desktop JSON exports with `msgvault import-telegram <export-dir>`. Re-imports add new messages and missing media while preserving previously archived text. Single-chat exports require `--me`.\n- Archive Inline chats and threads with scheduled, resumable sync and attachment capture. Browser OAuth is the default connection; an authenticated Inline CLI connection is also available.\n- Add personal Pocket meeting sources with `add-pocket` and `sync-pocket` to archive transcripts and recorded actions. Audio downloads and organization API keys are not included.\n- Recover encrypted Matrix history from your account's server-side key backup, including edits, reactions, and replies. Setup requires a recovery secret, or `--skip-key-backup` to retain placeholders. Keys absent from the backup remain unavailable.\n- Keep locally available iMessage photos, videos, and voice notes with `import-imessage`. Configure `[imessage].media_max_participants` and `max_media_mb`, or pass `--max-media-mb` for one import. Defaults remain 20 participants and 250 MiB per file.\n- List archived calendar events with `msgvault calendar events --from <date> --to <date>`. Results expand repeats, show moved meetings at their new times, and mark cancellations. Existing Google Calendar archives need no re-sync.\n- Browse people and domains in one People workspace, with messages, files, calendars, and editable profile details together. Saved profiles remain available even without archived messages.\n- Review possible duplicates through People → Filter → Possible duplicates. Merge profiles, keep them separate, undo a decision, or split a merged profile through History.\n- Preview contact tiers with `person tiers preview` and inspect the reasons with `person tiers explain <person-id>`. Tiers reflect message exchanges, shared meetings, and qualifying answered calls. Previewing does not track anyone.\n- Track or untrack several people in one command by passing multiple IDs to `person track` or `person untrack`.\n- Find archived chats across networks with `find-chat` and MCP `find_chat`. Results include network labels and a message reference for opening the chat.\n- Search text inside mirrored PDFs and documents through media search, the HTTP API, and MCP. Attachment results open their messages and require attachment mirroring.\n- Enable local semantic search without setting up an embedding server. Switching from Ollama's `nomic-embed-text` preserves the existing index; switching from another model asks before rebuilding it.\n- Connect an authenticated Streamable HTTP MCP client directly to `msgvault serve` at `/mcp`. Reads require the owner bearer key. `--mcp-allow-writes` enables a separate `/mcp/writes` catalog, with additional write families requiring their own flags.\n- Read the MCP connection and safety guide offline with `msgvault quickstart --mcp`, without a configured archive or running daemon.\n- Read archive totals with `msgvault stats --json`, including active and source-deleted message counts and the scope they cover.\n- Find saved people with `person directory --query` or literal, case-insensitive `--address` filtering. Address filtering is also available through the Directory API and MCP.\n- Inspect and save room policy overrides with `msgvault policy list`, `set`, and `reset`. This release does not enforce those tiers or hide rooms.\n\n## Improvements\n\n- Navigate the Web UI through Messages, People, Files, and Sources. Saved searches live in the sidebar, and the footer status dot opens queued jobs, running jobs, failures, and past runs.\n- Save ordinary settings through one Save changes bar. Settings opens on Overview, warns before leaving with unsaved edits, and identifies changes that require a restart.\n- Find attachments, recordings, linked tasks, and actions under each message. Message menus offer original downloads, meeting export, text or HTML switching, and Add to task where available.\n- Manage mail and Contacts sync independently in Sources. Staged deletion batches show their date, message count, and account, and staging opens a review dialog before `msgvault delete-staged` performs deletion.\n- Load message lists, searches, statistics, person files, and large conversation windows faster. In a SQLite benchmark, opening a message in a million-message conversation drops from about two seconds to 98 ms.\n- Refresh analytics faster after sync on Linux, macOS, and Windows. Measured incremental updates after one added message take 23% less time on Linux and 29% less on macOS and Windows.\n- Build analytics with a memory budget based on available resources unless explicitly configured. Large chat archives and linked participant sets use less memory, and exhaustion errors identify the limits and retry command.\n- Import SQLite mailboxes and growing group chats faster. Participant merges, attachment verification, and message deletion or re-embedding also avoid repeated work across unrelated archive data.\n- Select verification samples faster with `msgvault verify`. Selecting 1,000 samples from a million-message SQLite archive takes about 233 ms instead of 95 seconds in benchmarks.\n- Let queued mail and contact syncs run during large indexing jobs. Automatic indexing yields in bounded passes, and `embeddings optimize` allows archive writes between preparation batches.\n- Choose activity day boundaries during `msgvault setup`. Restart the daemon after changing the time zone; later activity updates re-date existing rows.\n- See which Beeper chats failed and which command retries their messages or media. Slack sync and media backfill summaries also include an example download error.\n- Allow time and disk space for new archive indexes during upgrade. The analytics cache also rebuilds once to exclude drafts and unsent messages from contact activity.\n\n## Bug fixes\n\n- Keep previously indexed messages searchable across daemon restarts while keyword backfill fills remaining gaps.\n- Find newly imported or edited iMessage, SMS, and Google Voice messages by keyword immediately. Re-run imports or the normal search backfill to fill existing omissions.\n- Remove archived iMessage text when a re-import finds that the source body is empty, including after an unsend. The message record remains in the archive.\n- Include Spam and Trash in Gmail full sync. To recover historical omissions, run one unfiltered, unlimited `sync-full` without query, date, or limit filters.\n- Retry failed Gmail downloads and saves during later incremental syncs, even without new mail. Sync stops before advancing its checkpoint if it cannot save the failure record. Older failures outside the retained retry history still require a full sync.\n- Respect saved IMAP folder exclusions during scheduled and manual syncs. Configure `sync.imap_skip_folders` by account; explicit folder flags replace those exclusions for one run. Filtered syncs pause deletion tracking.\n- Wait and retry when an IMAP server rejects reads because of command limits. Set `[sync].imap_max_commands_per_minute` and restart the daemon to enable pacing. The default `0` leaves pacing off.\n- Keep drafts and unsent messages out of relationship activity and person file listings while retaining them in general search. Re-import Synctech backups to correct older draft, queued, and failed text classifications.\n- Load person calendars, timelines, and domain details without the previous memory exhaustion on large chat archives. The TUI relationship calendar also loads with default system time zones; Windows groups its days in UTC and labels that choice.\n- Show readable text for HTML-only email in the TUI and `show-message` through the daemon. JSON output keeps HTML in `body_html` instead of mislabeling it as plain text.\n- Flag messages whose HTML appears to hide readable text in MCP and CLI output. Detection checks inline styles and legacy attributes, so an unset flag does not guarantee that all text was visible.\n- Stage every source-deletable match through MCP `stage_deletion`, up to 100,000, or refuse without saving a batch. Larger queries receive guidance to narrow the search.\n- Reconnect local MCP proxies after a daemon restart without restarting the proxy.\n- Leave supervised daemons for systemd or launchd to restart after `msgvault update`. Use `--no-restart` to leave a self-started daemon stopped. Homebrew installations receive `brew upgrade msgvault` guidance instead of self-updating.\n- Preserve the host daemon's runtime record when commands run inside a PID-namespace sandbox.\n- Report empty stored originals as sample errors in `verify` and as inconclusive in Gmail audits. Verification sample errors appear in the summary without changing the exit status.\n- Restore Mistral document extraction with `mistral-ocr-4-1`. Update or remove an explicit `mistral-ocr-4-0` setting, then run `msgvault documents probe-mistral` and `msgvault documents consent-mistral` again.\n- Process long PDFs through Docling in 50-page jobs and reuse saved progress after restarts. Saved range text is plaintext; status and backups disclose it, and `documents purge-derived` removes it.\n- Complete embedding builds when a message contains only invisible or control characters by skipping empty content.\n- Reject schedules with out-of-range wrapped values in both Settings and the daemon. Rewrite previously saved invalid ranges, such as `60-5`, using valid field values.\n- Apply HTML sanitizer bypass fixes to email rendering in the Web UI.\n\n\n## Acknowledgements\n\nThanks to everyone who contributed to this release:\n\n- [@AndrewWiggins](https://github.com/AndrewWiggins) for complete Gmail full syncs that include Spam and Trash, retrying failed Gmail downloads, and verifying empty stored originals.\n- [@cpcloud](https://github.com/cpcloud) for faster person and domain pages, lower Explore memory use, consistent page headers, and CI hardening.\n- [@elviskahoro](https://github.com/elviskahoro) for keeping sync progress lines aligned.\n- [@eserie](https://github.com/eserie) for decrypting Matrix history from the account's key backup.\n- [@franklintra](https://github.com/franklintra) for full-height saved view rows.\n- [@hansn74](https://github.com/hansn74) for faster attachment verification and fixing empty embedding inputs.\n- [@mariusvniekerk](https://github.com/mariusvniekerk) for running archive reads in parallel, restoring Mistral document extraction, Web UI security updates, and shared build caches.\n- [@morajabi](https://github.com/morajabi) for the Inline source.\n- [@rodboev](https://github.com/rodboev) for the redesigned Web UI, Telegram imports, attachment text search, shared local embeddings, saved IMAP folder exclusions, long Docling PDFs, and many speed and memory improvements.\n- [@salmonumbrella](https://github.com/salmonumbrella) for Pocket meetings, native daemon MCP, archived calendar events, finding chats, the MCP quickstart, IMAP command-limit pacing, and analytics memory budgets.\n- [@sweenzor](https://github.com/sweenzor) for listing the Beeper chats behind sync errors.\n- [@wesm](https://github.com/wesm) for contact tiers, iMessage attachments, tracking several people at once, room policy overrides, and calendar event state in message details.\n\n"}
