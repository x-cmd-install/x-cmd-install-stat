loader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":207214,"digest":"sha256:0da69f7fc40e15aabda57545655ed8e544cdc5553cb920019ea26c95f9198a0e","download_count":2,"created_at":"2026-10-02T22:26:34Z","updated_at":"2026-10-02T22:26:34Z"},{"id":606614192,"node_id":"RA_kwDORDJI584kKDKw","name":"SHA256SUMS","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2540,"digest":"sha256:d528b60b8f928432762acf7dd53faf9be36f2fcc25eac5b522090871ce27b4e3","download_count":99,"created_at":"2026-10-02T22:26:34Z","updated_at":"2026-10-02T22:26:34Z"},{"id":606614195,"node_id":"RA_kwDORDJI584kKDKz","name":"SHA256SUMS.sig","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:1f69f2fb2ea893f96e896857cb1949ad3611ed078cc703f421f8b2d76055bdd0","download_count":4,"created_at":"2026-10-02T22:26:34Z","updated_at":"2026-10-02T22:26:35Z"}],"body":"## New features\n\n- Navigate the Web UI through a grouped sidebar and search from any page. Press `/` to focus global search. Everything and Files also let you save the current view directly from their headers.\n- Sync Microsoft 365 and Outlook.com mail through Microsoft Graph with `add-o365 --graph` when IMAP is unavailable. Staged deletion supports these accounts, including moving messages to Deleted Items and permanent deletion. Deletion requires `Mail.ReadWrite` consent and that permission in the app registration.\n- Sign in to Microsoft 365 and Teams without a local browser using `msgvault add-o365 you@example.com --headless` or `msgvault add-teams you@example.com --headless`. MsgVault prints a Microsoft URL and a code to use on another device.\n- Create and manage plain-text Gmail reply drafts, compose fresh IMAP drafts, and reply-all to archived mail. Enable drafts for each source. Delegated agents can read, edit, and delete managed drafts within their granted account access.\n- Forward archived email with its stored attachments using `msgvault draft-forward`. MsgVault creates an IMAP draft with your note and the original message quoted as text. Missing attachments or an exceeded server upload limit prevent draft creation.\n- Save draft replies to archived Slack, Teams, and Discord conversations with `draft-compose --conversation`. Review, edit, or delete them in MsgVault. MsgVault never sends these replies.\n- Place draft replies directly in Beeper Desktop's message box through the draft commands after enabling `[[beeper.drafts]]`. MsgVault rejects writes when it finds unrelated text already there. Text typed between its check and write can still be lost.\n- Export a conversation's visible emails as numbered `.eml` files with `msgvault export-eml <id> --thread -o DIR`. MCP clients can list threads and download stored emails and attachments without shell access. PST email exports contain reconstructed MIME.\n- Import iMazing Messages CSV exports with `import-imazing-csv`, including available attachments. Supply `--me` and use `--timezone` when the export's timezone differs from your local zone.\n- Archive completed Muesli meetings, notes, transcripts, and later edits with `add-muesli` and `sync-muesli`. MsgVault must run on the Mac containing Muesli. Grant the daemon Full Disk Access to read Contacts; meetings still sync without Contacts access.\n- Link meeting attendees to existing people through email or phone evidence. Names alone never establish a match, and conflicting ownership goes to review.\n- Export selected meetings as JSON or Markdown context with archive citations and optional transcripts. Query recorded action items and meeting activity through the Web UI, CLI, HTTP, or read-only MCP tools. Existing archives gain this data without a provider resync.\n- Show live Kata todos on a person's page through the opt-in `[integrations.kata]` connection. Create and unlink tasks in the Web UI, or link existing tasks through the CLI and API. Edit and complete tasks in Kata. This requires Kata API schema 0.21.0 or later.\n- Connect multiple named CardDAV accounts, each with its own credentials, schedule, and sync history. Select one with `--connection` or in Settings. `sync-carddav` without a connection syncs all enabled connections and exits nonzero on partial failure. Contact publication still uses one target.\n- Connect CardDAV servers that require Digest authentication or an approved private HTTPS destination. Configure `trusted_origin` and `trusted_addresses` locally before adding a private destination.\n- Accelerate SQLite semantic, hybrid, and similar-message searches with an approximate index and exact reranking. Run `msgvault embeddings optimize` to build or resume it from stored embeddings without provider calls. Set `[vector.search].sqlite_accelerator = \"exact\"` for exhaustive search.\n- Review identity suggestions, which propose linking archived identities to people, through the CLI or MCP. MCP also supports person merges and CardDAV writes. Enable each capability with its corresponding `--allow-identity-decisions`, `--allow-person-merges`, or `--allow-carddav-writes` flag. Each confirmation requires user approval.\n- Score identity suggestions with the optional Jev service. Scoring is disabled by default and requires configuration and consent. `msgvault person scoring status` lists the names, email addresses, phone numbers, identifiers, scopes, and matching evidence sent to `api.typesafe.ai`. Scores remain advisory and never accept matches or merge people.\n- Configure people inference with OpenAI, OpenRouter, or Venice presets and explicit model, privacy, and consent choices. Setup no longer enables inference just because an OpenAI key exists. Codex sign-in and inference remain unavailable in this release.\n- Process stored WAV and MP3 recordings from captured sources through Docbank, preserving supplied transcripts or using a configured speech-recognition profile. Enable `all_sources_upload_consent = true`. Existing Beeper audio users must consent again; the former `upload_consent` setting no longer permits uploads.\n- Select Slack direct conversations independently with `[slack].dms` and `group_dms`, or override either setting for one sync using `--dms` and `--group-dms`. Skipped conversations retain their incremental progress.\n- Query archive analytics through the advanced MCP `query_sql` tool on supported SQLite daemons.\n- Compare search rankings with Jev reranking using `msgvault eval --rerank-jev`. This sends queries and bounded message text to TypeSafe using `TYPESAFE_API_KEY`. Results include quality, latency, usage, and cost measurements, with incomplete usage marked.\n\n## Improvements\n\n- Keep querying published analytics while a cache refresh runs in the background. `--fresh` requests include writes committed before the request. CLI queries wait when a build is required; HTTP and MCP callers receive a build job to poll.\n- Refresh analytics with less repeated work. New messages, label changes, and identity-link changes reuse retained cache data where possible, including when sync overlaps a build. Existing caches require one full rebuild after upgrade.\n- Keep scheduled syncs moving under load. Background maintenance yields to queued work and resumes saved progress across restarts. Scheduled activity and attachment maintenance use one-minute budgets; scheduled Beeper imports use three-minute budgets. Status distinguishes queued jobs from running jobs.\n- Reduce query work for full-text, semantic, hybrid, and address-filter searches. Large People and Domain groupings also avoid the memory exhaustion reproduced with a 512 MB limit.\n- Reduce CPU time spent preparing messages for embedding builds. Existing vectors remain compatible, and no rebuild is required.\n- Show readable chat snippets in CLI search tables and fit columns to the terminal width. Redirected output preserves full sender and subject or snippet text. Slow searches show elapsed time without implying that search waits for concurrent daemon work.\n- Check full-text index coverage without reading stored message content. Searches show an incomplete-results warning when the index needs rebuilding or is rebuilding.\n- Read person records through separate scroll areas and organized sections. Populated attributes appear near the top, empty fields stay hidden until requested, and linked identities explain their service and match origin.\n- Show readable statuses and errors across Sources, Operations, Deletions, and Settings. Settings remembers its category and applies saved theme or density changes to the open tab unless a Display override is active.\n- Finish `msgvault setup` without Google credentials by pressing Enter at the credential prompt. The wizard then shows IMAP, Microsoft 365, and file-import examples.\n- Control implicit daemon startup with `[server].daemon_auto_start = false` when a supervisor manages the daemon. CLI commands use a running daemon or return an actionable error.\n- Discover MCP tools without waiting for archive statistics. Upgrade clients and daemon together to API schema 3.0.0, which replaces token-free identity decisions with reviewed decisions. HTTP MCP writes also require `--http-allow-writes`, and confirmation-dependent writes require MCP protocol 2026-07-28 or newer.\n- Diagnose document extraction failures through specific build errors and status details. Inline attachments remain excluded by default; enabling `attachments.documents.scope.include_inline` requires fresh consent.\n\n## Bug fixes\n\n- Preserve PST message identifiers and repair reply chains after importing all folders. To repair an earlier import, rerun the same PST with the same account identifier and `--no-resume`. Existing messages remain counted as skipped.\n- Complete IMAP syncs for supported legacy and damaged Message-IDs without replacing archived messages or repeatedly enumerating folders. DavMail messages with empty header responses receive a full-header retry to recover identities and labels.\n- Skip unchanged partial Apple Mail messages during repeated `import-emlx` runs. Only newly restored attachments trigger re-ingestion, and the restored count reports attachments added during that run.\n- Keep invalid Apple Messages dates from blocking analytics builds. Rerun `msgvault import-imessage` without date filters or a message limit to correct an earlier import, retaining any original `--db-path` and `--me` options. Undated messages remain archived.\n- Build analytics caches despite invalid UTF-8, late-occurring quoted fields, or pre-1970 messages. Damaged display text uses replacement characters, while damaged identities export as unknown. Repair an older damaged cache with `msgvault build-cache --full-rebuild`.\n- Return complete API JSON when archived subjects, snippets, or names contain invalid UTF-8.\n- Complete activity updates for affected upgraded SQLite archives with missing message timestamps. The first startup after upgrade scans the messages table once to fill those timestamps.\n- Recover Gmail syncs when quota pauses exceed an individual request timeout. Quota retries honor `Retry-After`, cancellation, and the caller's deadline.\n- Stop repeatedly downloading Beeper media that the source reports as permanently unavailable. Sync and backfill summaries report those files, while temporary failures remain eligible for retry.\n- Complete repeated person enrichment lookups without failing on reused citations or duplicate values. Scheduled lookups stop repeating terminal failures, and disabling a profile retains queued work for re-enablement.\n- Preserve `--no-default-identity` choices during scheduled sync and re-authorization.\n- Give newly promoted people an observed display name when one is available. Contacts without names also receive generated full names so vCard publication succeeds.\n- Filter Directory by Email, Chat, Meeting, or Other through the Primary channel menu. Directory media and file filters also apply.\n- Keep cached Files listings usable when a provider resync retains the same attachments. Old attachment links no longer trigger endless page requests.\n- Preserve files created at a SQLite backup target while the backup is running. MsgVault returns `backup target already exists` instead of overwriting the competing file.\n- Avoid a panic when updating MsgVault and restarting a running daemon.\n- Load the full MCP tool catalog in strict clients through the corrected Saved View schema.\n\n## Acknowledgements\n\nThanks to everyone who contributed to this release:\n\n- [@aaronwolen](https://github.com/aaronwolen) for fixing quoted fields in analytics caches and initial Google Contacts sync.\n- [@eliemada](https://github.com/eliemada) for preserving legacy IMAP Message-IDs.\n- [@exactmike](https://github.com/exactmike) for Microsoft mail sync, deletion, and headless sign-in.\n- [@franklintra](https://github.com/franklintra) for recovering empty IMAP header responses.\n- [@fucx](https://github.com/fucx) for fixing daemon restart during updates.\n- [@mariusvniekerk](https://github.com/mariusvniekerk) for Web pane dividers, vector requests, retries, and backup protection.\n- [@metcalfc](https://github.com/metcalfc) for recovering Gmail syncs after quota throttling.\n- [@rodboev](https://github.com/rodboev) for mail and chat drafts, audio processing, and archive maintenance.\n- [@salmonumbrella](https://github.com/salmonumbrella) for people and meeting workflows, reviewed agent tools, analytics, and scheduling.\n- [@shntnu](https://github.com/shntnu) for Slack DM selection and narrower people-fact migration checks.\n- [@spf13](https://github.com/spf13) for generating full names for nameless contacts.\n- [@wesm](https://github.com/wesm) for Web navigation, search, sync, activity, and documentation.\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
