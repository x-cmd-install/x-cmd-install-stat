30Z","updated_at":"2025-05-05T12:40:31Z"},{"id":251999050,"node_id":"RA_kwDOHE9Ui84PBTNK","name":"trippy-0.13.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3679426,"digest":null,"download_count":5544,"created_at":"2025-05-05T12:41:32Z","updated_at":"2025-05-05T12:41:33Z"},{"id":251998603,"node_id":"RA_kwDOHE9Ui84PBTGL","name":"trippy-0.13.0-x86_64-unknown-netbsd.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3588324,"digest":null,"download_count":105,"created_at":"2025-05-05T12:38:48Z","updated_at":"2025-05-05T12:38:48Z"},{"id":251998646,"node_id":"RA_kwDOHE9Ui84PBTG2","name":"trippy-0.13.0-x86_64.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":2738047,"digest":null,"download_count":1521,"created_at":"2025-05-05T12:39:23Z","updated_at":"2025-05-05T12:39:23Z"},{"id":251998786,"node_id":"RA_kwDOHE9Ui84PBTJC","name":"trippy_x86_64-unknown-linux-gnu_0.13.0_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":2316404,"digest":null,"download_count":1943,"created_at":"2025-05-05T12:40:29Z","updated_at":"2025-05-05T12:40:30Z"},{"id":251999046,"node_id":"RA_kwDOHE9Ui84PBTNG","name":"trippy_x86_64-unknown-linux-musl_0.13.0_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":2383608,"digest":null,"download_count":1029,"created_at":"2025-05-05T12:41:32Z","updated_at":"2025-05-05T12:41:32Z"}],"body":"## Highlights\r\n\r\nThe 0.13.0 release of Trippy includes several enhancements related to Type of Service (`ToS`) and adds new `Dscp` and `Ecn` columns.\r\n\r\nIt also includes improvements to the TUI such as allowing a custom timezone to be set and adding the ability to read the configuration file from the XDG app config directory. The `json` report has been enriched with start and end timestamps.\r\n\r\nThis release includes a number of bug fixes. For Windows users in particular, this release includes several important stability improvements.\r\n\r\nThe release also introduces a new `system` address family option, which will become the new default in the next major release.\r\n\r\nFinally, Trippy now has a dedicated website and a logo!\r\n\r\n### Type of Service (DSCP/ECN) Improvements\r\n\r\nTrippy allows setting the Type of Service (`ToS`) for IPv4 via the `--tos` (`-Q`) command-line argument (or via the configuration file). The `ToS` value is the second byte of the `IPv4` header and encodes the Differentiated Services Code Point (`DSCP`) and Explicit Congestion Notification (`ECN`) fields.\r\n\r\nSetting the `ToS` on outgoing probe packets can influence the Quality of Service (`QoS`) used by the network devices along the path.\r\n\r\nProbe responses received from the hops along the path include the `ToS` values in the Original Datagram (the `IPv4`/`IPv6` header of the probe packet nested inside the `ICMP` error). Examining the `ToS` value from the Original Datagram can provide useful insight into the `QoS` treatment of the probe packets by network devices along the path.\r\n\r\nThis release of Trippy adds two new columns to display the `DSCP` & `ECN` values, which are derived from the `ToS` value from the Original Datagram for each hop. The new columns are:\r\n\r\n- `Dscp` (`K`): The Differentiated Services Code Point (`DSCP`) of the Original Datagram for a hop\r\n- `Ecn` (`M`): The Explicit Congestion Notification (`ECN`) of the Original Datagram for a hop\r\n\r\nThe `Dscp` and `Ecn` columns are decoded from the `ToS` field of the Original Datagram. If no `ToS` value is present, then the columns will show `na`. Note that these columns show the most recent `ToS` value received from the hop and may therefore change between rounds.\r\n\r\nWell-known `DSCP` values are displayed as follows:\r\n\r\n- Default Forwarding (`DF`) aka Best Effort aka Class Selector 0 (`CS0`)\r\n- Assured Forwarding (`AFn`)\r\n- Class Selector (`CSn`)\r\n- High Priority Expedited Forwarding (`EF`)\r\n- Voice Admit (`VA`)\r\n- Lower Effort (`LE`)\r\n\r\nUnknown `DSCP` values are displayed as a hexadecimal value.\r\n\r\nThe `ECN` value is displayed as follows:\r\n\r\n- Not ECN-Capable Transport (`NotECT`)\r\n- ECN Capable Transport(1) (`ECT1`)\r\n- ECN Capable Transport(0) (`ECT0`)\r\n- Congestion Experienced (`CE`)\r\n\r\nThese columns are hidden by default but can be enabled as needed. For more details, see the [Column Reference](https://trippy.rs/reference/column).\r\n\r\nThe following example sets the `ToS` to be `224`, which is a `DSCP` value of `CS7` (0x38) and an `ECN` value of `NotECT` (0x0), and enables the new columns:\r\n\r\n```shell\r\ntrip example.com --tos 224 --tui-custom-columns holsravbwdtKM\r\n```\r\n\r\nThe following screenshot shows the example trace:\r\n\r\n<img width=\"60%\" src=\"https://raw.githubusercontent.com/fujiapple852/trippy/master/assets/0.13.0/dscp_ecn.png\"/>\r\n\r\nThe `ToS` field of the Original Datagram has also been added to the `json` output format as a decimal value.\r\n\r\nSee [#1539](https://github.com/fujiapple852/trippy/issues/1539) for details.\r\n\r\nThis release also adds support for setting the `IPv6` Traffic Class (which encodes the `DSCP` & `ECN` values in the same way as `IPv4`) via the same `--tos` (`-Q`) command-line argument (or via the configuration file). Note that setting the `IPv6` Traffic Class is not currently supported on Windows. See [#202](https://github.com/fujiapple852/trippy/issues/202) for details.\r\n\r\nFinally, a bug which caused the `--tos` (`-Q`) command-line argument to be ignored for `IPv4/UDP` tracing has been fixed in this release. See [#1540](https://github.com/fujiapple852/trippy/issues/1540) for details.\r\n\r\n### Custom TUI Timezone\r\n\r\nTrippy shows the wall-clock time in the header of the TUI. Currently, this is set to show the local timezone of the system running Trippy. This can be problematic for users who are running Trippy in a container or on a remote system that uses a different timezone.\r\n\r\nThis release adds the ability to set a custom timezone for the TUI using the `--tui-timezone` command-line argument (or via the configuration file). The timezone can be set to any valid IANA timezone identifier, such as `UTC`, `America/New_York`, or `Europe/London`.\r\n\r\nThe following example sets the timezone to `UTC`:\r\n\r\n```shell\r\ntrip example.com --tui-timezone UTC\r\n```\r\n\r\nThis can be made permanent by setting the `tui-timezone` value in the `tui` section of the configuration file:\r\n\r\n```toml\r\n[tui]\r\ntui-timezone = \"UTC\"\r\n```\r\n\r\nSee [#1513](https://github.com/fujiapple852/trippy/issues/1513) for details.\r\n\r\n### XDG App Config Directory\r\n\r\nTrippy will now attempt to locate a `trippy.toml` or `.trippy.toml` config file in the XDG app config directory (i.e. `$XDG_CONFIG_HOME/trippy` or `~/.config/trippy`) in addition to existing locations.\r\n\r\nThis allows users to store their Trippy configuration files in a dedicated directory for Trippy, separate from other applications.\r\n\r\nThe full list of locations Trippy will check for a `trippy.toml` or `.trippy.toml` config file is as follows:\r\n\r\n- the current directory\r\n- the user home directory\r\n- the XDG config directory (Unix only): `$XDG_CONFIG_HOME` or `~/.config`\r\n- the XDG app config directory (Unix only): `$XDG_CONFIG_HOME/trippy` or `~/.config/trippy`\r\n- the Windows data directory (Windows only): `%APPDATA%`\r\n\r\nSee [#1528](https://github.com/fujiapple852/trippy/issues/1528) for details.\r\n\r\n### System Address Family\r\n\r\nTrippy supports tracing for both `IPv4` and `IPv6` address families. If the tracing target is supplied as a hostname, Trippy will attempt to resolve the hostname to a single `IPv4` or `IPv6` address. If the hostname resolves to both, Trippy will use the address family (`--addr-family`) configuration to determine which address family to use.\r\n\r\nThe possible values for `--addr-family` are:\r\n\r\n- `ipv4` - Lookup IPv4 only\r\n- `ipv6` - Lookup IPv6 only\r\n- `ipv6-then-ipv4` - Lookup IPv6 with a fallback to IPv4\r\n- `ipv4-then-ipv6` - Lookup IPv4 with a fallback to IPv6 [default]\r\n\r\nThe current default value for `--addr-family` is `ipv4-then-ipv6`, which means that if the hostname resolves to both `IPv4` and `IPv6` addresses, Trippy will prefer the `IPv4` address family.\r\n\r\nSome users find the default behavior undesirable, as it can lead to unexpected results when the hostname resolves to a different address family than the one used by other applications on the system.\r\n\r\nThis release adds a new value for `--addr-family` called `system`. This value defers the choice of address family to the first address returned by OS resolver. This means that if the hostname resolves to both `IPv4` and `IPv6` addresses, the OS resolver will determine which address family to use based on the OS configuration.\r\n\r\nNote that if the `--addr-family` value is set to `system` and the `--dns-resolve-method` is set to any value _other_ than `system` (i.e. `resolv`, `cloudflare` or `google`), then the address family lookup will effectively default to `ipv6-then-ipv4`.\r\n\r\n> **Important**: The default value for `--addr-family` will change to become `system` in the next major release of Trippy (0.14.0). This will be a breaking change for users who rely on the current default value of `ipv4-then-ipv6`.\r\n\r\nSee [#1469](https://github.com/fujiapple852/trippy/issues/1469) for details.\r\n\r\n### Remove Address Family \"downgrade\" for Dublin Strategy\r\n\r\nCurrently, the address families `ipv4-then-ipv6` and `ipv6-then-ipv4` are silently _downgraded_ to `ipv4` when the `dublin` ECMP strategy is used. This behaviour was previously necessary, as Trippy did not support the `dublin` ECMP strategy for `IPv6`. However, Trippy has supported the `dublin` ECMP strategy for `IPv6` since version 0.10.0. As a result, this release removes the address family _downgrade_ for the `dublin` ECMP strategy.\r\n\r\nSee [#1476](https://github.com/fujiapple852/trippy/issues/1476) for details.\r\n\r\n### Windows Stability Improvements\r\n\r\nThis release includes several stability improvements for Windows. It fixes several known or potential issues that could cause crashes or memory corruption. It is recommended that all Windows users upgrade to this release.\r\n\r\nSee the following issues for details:\r\n\r\n- Memory corruption on Windows ([#1527](https://github.com/fujiapple852/trippy/issues/1527))\r\n- Socket being closed twice on Windows ([#1443](https://github.com/fujiapple852/trippy/issues/1443))\r\n- Potential crash on Windows for adapters without unicast addresses ([#1547](https://github.com/fujiapple852/trippy/issues/1547))\r\n- Potential use-after-free when discovering source address on Windows ([#1558](https://github.com/fujiapple852/trippy/issues/1558))\r\n\r\n### Start and End Timestamps in JSON report\r\n\r\nThe Trippy `json` report mode has been enhanced to show the start and end timestamps for the trace. These timestamps are shown in UTC using RFC 3339 format.\r\n\r\nThe following example runs a trace to `example.com` for a single round and outputs the results in `json` format:\r\n\r\n```shell\r\ntrip example.com -m json -C 1\r\n```\r\n\r\nThe `info` section of the output now includes the `start_timestamp` and `end_timestamp` fields:\r\n\r\n```json\r\n{\r\n  \"info\": {\r\n    \"target\": {\r\n      \"ip\": \"23.192.228.80\",\r\n      \"hostname\": \"example.com\"\r\n    },\r\n    \"start_timestamp\": \"2025-05-04T09:50:10.383221Z\",\r\n    \"end_timestamp\": \"2025-05-04T09:50:11.392039Z\"\r\n  }\r\n}\r\n```\r\n\r\nSee [#1510](https://github.com/fujiapple852/trippy/issues/1510) for details.\r\n\r\n### Reduce Tracing Verbosity\r\n\r\nThe `trippy-core` crate logging is overly verbose. This release reduces all `#[instrument]` annotations from the default `info` level to the `trace` level. It also removes some tracing annotations and, in some cases, adds new ones.\r\n\r\nThere are now no `info` level logs and only a handful of `debug` level logs:\r\n\r\n- Log the channel config when a channel is created (typically just once)\r\n- Log the strategy config when the tracer is started (typically just once)\r\n- Log each probe sent and received during a round (typically a handful per round)\r\n\r\nFor application users there is no change; however the default logging level (`--log-filter trippy=debug`) used when `-v` is passed will now show substantially fewer logs. Users can set `--log-filter trippy=trace` to see a logging level similar to the previous default.\r\n\r\nSee [#1482](https://github.com/fujiapple852/trippy/issues/1482) for details.\r\n\r\n### Bug Fixes\r\n\r\nThis release fixes a bug where ICMP packets larger than 256 bytes could cause a tracer panic. See [#1561](https://github.com/fujiapple852/trippy/issues/1561) for details.\r\n\r\nIt also adds a handful of missing configuration options to the settings dialog. See [#1541](https://github.com/fujiapple852/trippy/issues/1541) for details.\r\n\r\n### Trippy Website & Logo\r\n\r\nTrippy now has a dedicated website: https://trippy.rs\r\n\r\nThe website is now the primary source of documentation. My thanks to @orhun for building the https://binsider.dev website which I ~~took inspiration from~~ shamelessly copied for Trippy.\r\n\r\nAlong with the new website, Trippy (finally!) has a logo:\r\n\r\n<img src=\"https://raw.githubusercontent.com/fujiapple852/trippy/master/docs/src/assets/Trippy-Vertical-DarkMode.svg#gh-dark-mode-only\" width=\"200\">\r\n<img src=\"https://raw.githubusercontent.com/fujiapple852/trippy/master/docs/src/assets/Trippy-Vertical.svg#gh-light-mode-only\" width=\"200\"><br>\r\n\r\nWith thanks to [Harun Ocaksiz Design](https://www.instagram.com/harunocaksiz).\r\n\r\nSee [#100](https://github.com/fujiapple852/trippy/issues/100) for details.\r\n\r\n### New Distribution Packages\r\n\r\nTrippy has been added to the Void Linux package repository (with thanks to @icp1994!):\r\n\r\n[![Void Linux x86_64 package](https://repology.org/badge/version-for-repo/void_x86_64/trippy.svg)](https://github.com/void-linux/void-packages/tree/master/srcpkgs/trippy)\r\n\r\n```shell\r\nxbps-install -S trippy\r\n```\r\n\r\nTrippy was also added to ALT Sisyphus package repository (with thanks to [Aleksandr Voyt](https://packages.altlinux.org/en/sisyphus/maintainers/sobue)!)\r\n\r\n[![ALT Sisyphus package](https://repology.org/badge/version-for-repo/altsisyphus/trippy.svg)](https://packages.altlinux.org/en/sisyphus/srpms/trippy/)\r\n\r\n```shell\r\napt-get install trippy\r\n```\r\n\r\nFinally, Trippy has been added to the Chimera Linux package repository (with thanks to @ttyyls!):\r\n\r\n[![Chimera Linux package](https://repology.org/badge/version-for-repo/chimera/trippy.svg)](https://github.com/chimera-linux/cports/tree/master/user/trippy)\r\n\r\n```shell\r\napk add trippy\r\n```\r\n\r\n### Thanks\r\n\r\nMy thanks to all Trippy contributors, package maintainers, translators and community members.\r\n\r\nFeel free to drop by the Trippy Zulip room for a chat:\r\n\r\n[![project chat](https://img.shields.io/badge/zulip-join_chat-brightgreen.svg)](https://trippy.zulipchat.com/)\r\n\r\nHappy Tracing!\r\n\r\n## Change Log\r\n\r\n### Added\r\n\r\n- Added DSCP and ECN columns ([#1539](https://github.com/fujiapple852/trippy/issues/1539))\r\n- Added support for setting IPv6 traffic class from `--tos` ([#202](https://github.com/fujiapple852/trippy/issues/202))\r\n- Added ability to read config from `$XDG_CONFIG_HOME/trippy` directory ([#1528](https://github.com/fujiapple852/trippy/issues/1528))\r\n- Added `--tui-timezone` flag to set a custom timezone ([#1513](https://github.com/fujiapple852/trippy/issues/1513))\r\n- Added support for `--addr-family system` to defer address family selection to the OS resolver ([#1469](https://github.com/fujiapple852/trippy/issues/1469))\r\n- Added tracing start and end timestamps to the `json` report ([#1510](https://github.com/fujiapple852/trippy/issues/1510))\r\n- Added the Trippy logo! ([#100](https://github.com/fujiapple852/trippy/issues/100))\r\n\r\n### Changed\r\n\r\n- Remove address family downgrade for `dublin` strategy ([#1476](https://github.com/fujiapple852/trippy/issues/1476))\r\n- Reduce verbosity of tracing for library users ([#1482](https://github.com/fujiapple852/trippy/issues/1482))\r\n- Increase MSRV to 1.78 ([#1576](https://github.com/fujiapple852/trippy/issues/1576))\r\n\r\n### Fixed\r\n\r\n- Tracer panic for large icmp packets ([#1561](https://github.com/fujiapple852/trippy/issues/1561))\r\n- Memory corruption on Windows ([#1527](https://github.com/fujiapple852/trippy/issues/1527))\r\n- Socket being closed twice on Windows ([#1443](https://github.com/fujiapple852/trippy/issues/1443))\r\n- Potential crash on Windows for adapters without unicast addresses ([#1547](https://github.com/fujiapple852/trippy/issues/1547))\r\n- Potential use-after-free when discovering source address on Windows ([#1558](https://github.com/fujiapple852/trippy/issues/1558))\r\n- The `--tos` (`-Q`) flag is ignored for `IPv4/udp` tracing ([#1540](https://github.com/fujiapple852/trippy/issues/1540))\r\n- Items missing from settings dialog ([#1541](https://github.com/fujiapple852/trippy/issues/1541))\r\n\r\nSee [CHANGELOG.md](https://github.com/fujiapple852/trippy/blob/master/CHANGELOG.md) for details.\r\n\r\n**Full Changelog**: https://github.com/fujiapple852/trippy/compare/0.12.2...0.13.0","reactions":{"total_count":20,"+1":0,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":8,"rocket":6,"eyes":0},"mentions_count":3}
