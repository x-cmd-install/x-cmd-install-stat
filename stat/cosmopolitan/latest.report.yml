{"id":193228205,"author":{"login":"jart","id":49262,"node_id":"MDQ6VXNlcjQ5MjYy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOED1fhs4LhG2t","tag_name":"4.0.2","target_commitish":"master","name":"Cosmopolitan v4.0.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-01-05T22:05:49Z","updated_at":"2025-01-06T02:08:59Z","published_at":"2025-01-06T00:04:15Z","assets":[{"id":218248524,"node_id":"RA_kwDOED1fhs4NAjVM","name":"cosmocc-4.0.2.zip","label":null,"uploader":{"login":"jart","id":49262,"node_id":"MDQ6VXNlcjQ5MjYy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-zip-compressed","state":"uploaded","size":441763966,"digest":null,"download_count":32093,"created_at":"2025-01-05T23:34:27Z","updated_at":"2025-01-05T23:35:02Z"},{"id":218249444,"node_id":"RA_kwDOED1fhs4NAjjk","name":"cosmopolitan-4.0.2.tar.gz","label":null,"uploader":{"login":"jart","id":49262,"node_id":"MDQ6VXNlcjQ5MjYy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gzip","state":"uploaded","size":44058183,"digest":null,"download_count":1034,"created_at":"2025-01-05T23:38:06Z","updated_at":"2025-01-05T23:38:11Z"},{"id":218247825,"node_id":"RA_kwDOED1fhs4NAjKR","name":"cosmos-4.0.2.zip","label":null,"uploader":{"login":"jart","id":49262,"node_id":"MDQ6VXNlcjQ5MjYy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-zip-compressed","state":"uploaded","size":402711738,"digest":null,"download_count":1505,"created_at":"2025-01-05T23:31:00Z","updated_at":"2025-01-05T23:31:58Z"}],"body":"[Cosmopolitan Libc](https://justine.lol/cosmopolitan/index.html) makes C/C++ a build-once run-anywhere language, like Java, except it doesn't need an interpreter or virtual machine. Instead, it reconfigures stock GCC and Clang to output a POSIX-approved polyglot format that runs natively on Linux + Mac + Windows + FreeBSD + OpenBSD 7.3 + NetBSD + BIOS with the best performance and reliability.\r\n\r\n### Cosmo v4.0.2 Release Notes\r\n\r\nAfter testing 4.0.x with various programs and hammering out the\r\nremaining issues, this release includes the latest build of Cosmos.\r\nWe've confirmed bash, emacs, vim, git, links, wget, etc. work well\r\nacross platforms.\r\n\r\n- 29eb7e67b Fix fork() regression on Windows\r\n- 42a3bb729 Make execve() linger when it can't spoof parent\r\n- f0b0f926b Enable sqlite3 serialization in redbean (#1349)\r\n- 035b0e2a6 Attempt to fix MODE=dbg Windows execve() flake\r\n- 7b67b20da Fix Windows MODE=tiny breakage\r\n- c97a85847 Remove missing definitions\r\n\r\nRead the documentation:\r\n\r\n- [cosmocc toolchain readme](https://github.com/jart/cosmopolitan/blob/master/tool/cosmocc/README.md)\r\n- [cosmos v4.0.2 install guide](https://cosmo.zip/pub/cosmos/v/4.0.2/README.txt)\r\n\r\nRedundant download URLs are provided:\r\n\r\n- https://cosmo.zip/pub/cosmos/v/4.0.2/\r\n- https://cosmo.zip/pub/cosmos/zip/cosmos-4.0.2.zip\r\n- https://cosmo.zip/pub/cosmocc/cosmocc-4.0.2.zip\r\n- https://cosmo.zip/pub/cosmo/cosmopolitan-4.0.2.tar.gz\r\n- https://justine.lol/cosmopolitan/cosmocc-4.0.2.zip\r\n- https://justine.lol/cosmopolitan/cosmos-4.0.2.zip\r\n- https://justine.lol/cosmopolitan/cosmopolitan-4.0.2.tar.gz\r\n\r\nKnown issues:\r\n\r\n- You might need [our `binfmt_misc` interpreter](https://github.com/jart/cosmopolitan/blob/master/tool/cosmocc/README.md#gotchas) with some Linux distros\r\n- Run Windows Terminal Preview with admin privileges to use symlinks\r\n- Use `TERM=vt100 nano` to fix frozen display state with nano editor\r\n- Self-modifying code isn't preserved across fork() on Windows\r\n- Function tracing is disabled in child after fork() on Windows\r\n- Z shell users need zsh 5.9+ which fixes an execve() bug","reactions":{"total_count":39,"+1":16,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":12,"rocket":7,"eyes":4}}
