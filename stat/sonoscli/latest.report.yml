d_count":11,"created_at":"2026-10-23T17:58:01Z","updated_at":"2026-10-23T17:58:01Z"},{"id":669930824,"node_id":"RA_kwDOQn0El84n7lVI","name":"sonoscli_0.3.5_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4095962,"digest":"sha256:66c6ddd1e27306f1b5f5f471d8064d2daed2f8b29e2b1a82c1aa1c1687f45252","download_count":6,"created_at":"2026-10-23T17:58:01Z","updated_at":"2026-10-23T17:58:02Z"}],"body":"## [0.3.5] - 2026-10-23\n\n**Highlights:** Fix the reachable crypto/x509 vulnerability GO-2026-6809 with Go 1.27.3, explain SMAPI API-client identity rejections, and correctly label initial watch events.\n\n### Fixed\n- Explain SMAPI API-client identity rejections and suggest supported playback alternatives without exposing service response bodies. Thanks @DonnieFi.\n- Label initial `watch` notifications with the correct service even when they arrive before subscription setup finishes.\n\n### Changed\n- Prefer Go 1.27.3 for source, CI, Docker, and release builds to fix reachable standard-library vulnerabilities while retaining Go 1.26 compatibility; refresh lint tooling, the Dockerfile frontend, and pinned documentation workflow actions.\n- Allow release workflow dry runs to build and verify the current version without creating tags or publishing a release.\n\n","mentions_count":1}
