oad_count":10,"created_at":"2026-11-16T07:42:01Z","updated_at":"2026-11-16T07:42:01Z"},{"id":753935789,"node_id":"RA_kwDOQn0El84s8CWt","name":"sonoscli_0.3.6_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4100119,"digest":"sha256:73073d803b9459139b94b27a753681df33084f1909311363077f7a450c8a560e","download_count":6,"created_at":"2026-11-16T07:42:01Z","updated_at":"2026-11-16T07:42:02Z"}],"body":"## [0.3.6] - 2026-11-15\n\n**Highlights:** Protect saved scenes when speaker reads fail, honor explicit speaker IPs, and prevent playback from starting at an unrelated queue position.\n\n### Fixed\n- Preserve saved scenes on failed volume/mute reads and report grouping or audio-setting failures when applying scenes. Thanks @SebTardif.\n- Report missing queue positions after enqueueing without starting unrelated playback; explain how to recover without enqueueing twice. Thanks @SebTardif.\n- Honor explicit speaker IPs when saving and applying scenes.\n\n### Changed\n- Use Go 1.27.4 for build, CI, Docker and release tooling while retaining Go 1.26 compatibility; update pflag to 1.1.0.\n\n","mentions_count":1}
