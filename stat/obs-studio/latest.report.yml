plication/zip","state":"uploaded","size":64725662,"digest":"sha256:2c1a97efd63c78f5e1b7313bd4700d64242d4a06473945952c2429ebe5136463","download_count":133,"created_at":"2026-11-22T01:53:18Z","updated_at":"2026-11-22T01:53:23Z"},{"id":777522627,"node_id":"RA_kwDOAMnsBs4uWA3D","name":"OBS-Studio-33.0.3-Windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":235774237,"digest":"sha256:18a68c325adbda6f6082d5281021a8d1e35a6432842800618e8690b71925c107","download_count":4344,"created_at":"2026-11-22T01:53:18Z","updated_at":"2026-11-22T01:53:32Z"}],"body":"33.0.3 Hotfix Changes\r\n---------------------\r\n\r\n- Fixed a crash on Windows in 33.0.2 with certain older CPUs [R1CH/Warchamp7]\r\n\r\n\r\n33.0.2 Hotfix Changes\r\n---------------------\r\n\r\n* Fixed macOS Screen Capture not working on Intel-based systems [jcm93]\r\n* Fixed Hybrid MP4 not splitting by time [Johnsoac671]\r\n* Fixed frequent audio dropouts on Decklink output [CyBeRoni]\r\n* Fixed a potential crash when right-clicking a spinbox in certain places [Warchamp7]\r\n* Fixed a crash during shutdown when a native device dialog is still open [prgmitchell]\r\n* Fixed YouTube AutoStop being mistakenly set to the AutoStart value [fcolona]\r\n* Fixed a crash when source properties change while a subdialog such as Font selection is open [prgmitchell]\r\n* Fixed a crash related to browser source memory allocation on Linux [tytan652/WizardCM]\r\n* Fixed a bug where controller inputs in browser sources no longer worked when OBS lost focus on Windows & macOS [WizardCM]\r\n* Fixed a crash on macOS when a browser source would request Bluetooth access [tytan652/WizardCM]\r\n* Fixed a potential crash when a browser source would request a Passkey [tytan652/WizardCM]\r\n* Enable WebGPU support on Windows for browser sources [WizardCM]\r\n* Fixed a potential crash when initializing the virtual cam [notr1ch]\r\n* Fixed a potential crash when unloading the virtual cam [notr1ch]\r\n* Fixed a potential crash related to vertex buffers [notr1ch]\r\n* Fixed repeated log entries sometimes not being truncated [exeldro]\r\n* Fixed a browser-related startup crash on Windows [prgmitchell]\r\n* Fixed a bug where OBS Helper for browser sources would appear in the dock on macOS [WizardCM]\r\n* Fixed a bug where duplicated groups would be missing a name [Warchamp7]\r\n\r\n33.0.1 Hotfix Changes\r\n---------------------\r\n\r\n* Fixed a crash on startup when logged into a service integration [WizardCM] ([#554](https://github.com/obsproject/obs-browser/pull/554))\r\n* Fixed a crash when logging into the Twitch integration [WizardCM] ([#14072](https://github.com/obsproject/obs-studio/pull/14072))\r\n* Fixed a deadlock when logging into the YouTube integration [WizardCM] ([#556](https://github.com/obsproject/obs-browser/pull/556))\r\n* Fixed a race condition where browser panels could end up with incorrectly sized content [WizardCM] ([#558](https://github.com/obsproject/obs-browser/pull/558))\r\n* Fixed a memory leak when using the image slideshow source [prgmitchell] ([#14078](https://github.com/obsproject/obs-studio/pull/14078))\r\n* Fixed plugins failing to load on Flatpak [FiniteSingularity] ([#14103](https://github.com/obsproject/obs-studio/pull/14103))\r\n* Fixed Plugin Manager not prompting for save after a change until the dialog is re-opened [Warchamp7] ([#14112](https://github.com/obsproject/obs-studio/pull/14112))\r\n\r\n33.0 New Features\r\n-----------------\r\n\r\n* Updated CEF from 127/6533 to 150/7871 [WizardCM] ([#13900](https://github.com/obsproject/obs-studio/pull/13900))\r\n  + This is a massive update to the underlying framework used for browser sources and docks from the July 2024 release to September 2026\r\n  + All of this work is on the backend and should be invisible to users. Please be sure to report any new weirdness or problems you run into with browser sources!\r\n* Complete overhaul to plugin loading [FiniteSingularity/PatTheMav] ([#13594](https://github.com/obsproject/obs-studio/pull/13594))\r\n  + First-party plugins are now in a new folder named core\r\n  + Third-party plugins have an updated installation location and folder structure\r\n  + Existing third-party plugins will continue to load from the legacy locations until OBS Studio 34.0\r\n  + More information is available in our [knowledge base article](https://obsproject.com/kb/legacy-plugin-locations)\r\n* Improved how source snapping works in the preview [Warchamp7] ([#12298](https://github.com/obsproject/obs-studio/pull/12298))\r\n  + New visual indicator added\r\n  + Sources now snap along the entire axis instead of only when directly touching\r\n  + Sources no longer snap to hidden sources\r\n* Improved behavior of spinboxes for number values [Warchamp7] ([#12337](https://github.com/obsproject/obs-studio/pull/12337))\r\n  + Typing is no longer mysteriously blocked in some situations\r\n  + Numbers are no longer cut off in some situations\r\n  + Values now update only after pressing Enter and Enter does not close the window\r\n  + Holding Shift + Up/Down now advances multiple steps at a time\r\n  + Dragging the cursor inside the input but outside the text itself now works properly\r\n* Enabled NVENC on Arm64 [RytoEX] ([#13827](https://github.com/obsproject/obs-studio/pull/13827))\r\n\r\n33.0 Changes\r\n------------\r\n\r\n* Added a check for encoders being missing when loading a profile [derrod] ([#11340](https://github.com/obsproject/obs-studio/pull/11340))\r\n* Added support for newest NVIDIA Broadcast SDKs for NVIDIA Audio Effects and Video Effects [pkviet] ([#13838](https://github.com/obsproject/obs-studio/pull/13838))\r\n* Added hotkeys for controlling audio monitoring of a source [Warchamp7] ([#13599](https://github.com/obsproject/obs-studio/pull/13599))\r\n* Changed Safe Mode to not start WebSocket Server [FiniteSingularity/RytoEX] ([#13984](https://github.com/obsproject/obs-studio/pull/13984))\r\n* Fixed issues with groups in Studio Mode [Warchamp7] ([#11092](https://github.com/obsproject/obs-studio/pull/11092))\r\n  + Fixed moving sources inside a group causing them to glitch out in Program\r\n  + Fixed moving sources inside a group showing up live in Program\r\n* Adjusted naming of Window Capture methods on Windows [Penwy] ([#12047](https://github.com/obsproject/obs-studio/pull/12047))\r\n* Improved detection of fullscreen games for Game Capture [Kira-NT] ([#10880](https://github.com/obsproject/obs-studio/pull/10880))\r\n* Improved transparency handling for macOS Screen Capture [jcm93] ([#13030](https://github.com/obsproject/obs-studio/pull/13030))\r\n* Scaled simple output recording audio bitrate by channel count [nickvonkaenel] ([#13311](https://github.com/obsproject/obs-studio/pull/13311))\r\n* Removed support for Ubuntu 24.04 \r\n\r\n33.0 Bug Fixes\r\n--------------\r\n\r\n* Added a startup error if obs-transitions failed to load [notr1ch] ([#13321](https://github.com/obsproject/obs-studio/pull/13321))\r\n* Improved file splitting for Hybrid MP4/MOV [derrod] ([#13386](https://github.com/obsproject/obs-studio/pull/13386))\r\n* Fixed outputs getting stuck running when a bad rescale output resolution is set [suogesi] ([#13375](https://github.com/obsproject/obs-studio/pull/13375))\r\n* Fixed monitoring icon state getting desynced when using third-party tools or websockets [prgmitchell] ([#13822](https://github.com/obsproject/obs-studio/pull/13822))\r\n* Fixed a crash on macOS 27.2 when starting OBS Studio [RytoEX] ([#14070](https://github.com/obsproject/obs-studio/pull/14070))\r\n* Fixed potential crash when shader cache file is invalid [notr1ch] ([#13538](https://github.com/obsproject/obs-studio/pull/13538))\r\n* Fixed a potential crash on Linux when USB mic is removed [R0te/RytoEX] ([#13922](https://github.com/obsproject/obs-studio/pull/13922))\r\n* Fixed a potential crash when renaming a source with the Add Source window open [Warchamp7] ([#13800](https://github.com/obsproject/obs-studio/pull/13800))\r\n* Fixed a potential deadlock during video/audio tasks [exeldro] ([#13579](https://github.com/obsproject/obs-studio/pull/13579))\r\n* Fixed an issue with B-frame offset calculation in AMF that could cause streams to disconnect [lexano-ivs] ([#13762](https://github.com/obsproject/obs-studio/pull/13762))\r\n* Fixed PipeWire screencast sources being duplicated in studio mode [tytan652] ([#13673](https://github.com/obsproject/obs-studio/pull/13673))\r\n* Fixed a potential crash when switching off a newly created profile [Warchamp7] ([#13182](https://github.com/obsproject/obs-studio/pull/13182))\r\n* Fixed a source toolbar crash when source type is missing [Penwy] ([#13539](https://github.com/obsproject/obs-studio/pull/13539))\r\n* Fixed profile import failing on paths with a trailing slash [Ushkalovk] ([#13863](https://github.com/obsproject/obs-studio/pull/13863))\r\n\r\n33.0 Developer Information\r\n--------------------------\r\n\r\n* Added frontend event and output signal for replay buffer saving [Penwy] ([#8955](https://github.com/obsproject/obs-studio/pull/8955))\r\n* Added guidance regarding the theme system to the top of all theme files [Warchamp7] ([#13733](https://github.com/obsproject/obs-studio/pull/13733))\r\n* Added ability to set a file extension filter for OBS_PATH_FILE_SAVE path types [FiniteSingularity] ([#10190](https://github.com/obsproject/obs-studio/pull/10190))\r\n* Added obs_frontend_is_safe_mode for first-party plugins\r\n  + Third-party plugins are not loaded at all in Safe Mode\r\n* Added versions to Flatpak plugin extension point [tytan652] ([#13735](https://github.com/obsproject/obs-studio/pull/13735))\r\n* Added obs_canvas_video_active() to check if the video of a canvas is active [exeldro] ([#13110](https://github.com/obsproject/obs-studio/pull/13110))\r\n* The minimum supported versions of Visual Studio, Windows SDK, and clang-format have been increased. Previous versions may continue to work, but will no longer be tested/supported. It is recommended that build environments are kept up-to-date with the project's toolchain.\r\n  + Changed Windows builds to use Visual Studio 2026 and SDK 26100 [RytoEX] ([#13543](https://github.com/obsproject/obs-studio/pull/13543))\r\n  + Changed clang-format version used to 22.1.3 [PatTheMav] ([#13549](https://github.com/obsproject/obs-studio/pull/13549))\r\n* Changed obs_canvas_reset_video() to allow resetting a canvas's video when any other canvas's video is active, but not its own video [exeldro] ([#13110](https://github.com/obsproject/obs-studio/pull/13110))\r\n* Updated libnsgif to 1.0.0 [RytoEX] ([#11178](https://github.com/obsproject/obs-studio/pull/11178))\r\n  + This is a breaking change for any plugins using libobs/graphics gs_image_file\r\n* Clarified documentation for obs_module_unload [notr1ch] ([#13327](https://github.com/obsproject/obs-studio/pull/13327))\r\n* Required MbedTLS 3 and exclude 4 or later [tytan652] ([#13799](https://github.com/obsproject/obs-studio/pull/13799))\r\n* Removed support for FFmpeg 6.x and 7.x [RytoEX] ([#13964](https://github.com/obsproject/obs-studio/pull/13964))\r\n* Removed support for Qt 6.4-6.9 [RytoEX] ([#13969](https://github.com/obsproject/obs-studio/pull/13969))\r\n* Fixed repeated preview enable/disables not working [WarmUpTill] ([#12580](https://github.com/obsproject/obs-studio/pull/12580))\r\n* Only emit core signal handlers for public canvases [tt2468] ([#13574](https://github.com/obsproject/obs-studio/pull/13574))\r\n* Deprecated unused hidden API for sources [derrod] ([#13122](https://github.com/obsproject/obs-studio/pull/13122))\r\n* Deprecated APIs for audio source monitoring_type [Warchamp7] ([#13599](https://github.com/obsproject/obs-studio/pull/13599))\r\n  + This is replaced by a new monitoring_enabled boolean\r\n\r\n### Checksums\r\n    OBS-Studio-33.0.3-Sources.tar.gz: 784879e4ce0c5cc69a34bb6ae0ed7f0a7c5fad59950ba04c3b43614f1df41a0c\r\n    OBS-Studio-33.0.3-Ubuntu-26.04-x86_64-dbsym.ddeb: ec40979911d648826acd5ee1beb26db143b63516a65ed18bf063c437e2d96f5e\r\n    OBS-Studio-33.0.3-Ubuntu-26.04-x86_64.deb: 5056f517efafcf720047fb3848e5c04398ddbd9caea548f5e2024ed32c97689a\r\n    OBS-Studio-33.0.3-Windows-arm64-PDBs.zip: 899aa95a4bab116e50fe260435cec3dc630db84a7d42289e705fa9e355e5b5f6\r\n    OBS-Studio-33.0.3-Windows-arm64.zip: be4796536a182f2c04c719b6edd7aa704ea4c083d5e511913d380ccfea00facf\r\n    OBS-Studio-33.0.3-Windows-x64-Installer.exe: 700be33c01468c2a1e43820bbcc49ba914f570f0f82250022bb680fba43b2a67\r\n    OBS-Studio-33.0.3-Windows-x64-PDBs.zip: 2c1a97efd63c78f5e1b7313bd4700d64242d4a06473945952c2429ebe5136463\r\n    OBS-Studio-33.0.3-Windows-x64.zip: 18a68c325adbda6f6082d5281021a8d1e35a6432842800618e8690b71925c107\r\n    OBS-Studio-33.0.3-macOS-Apple-dSYMs.tar.xz: df085a33a9fbc20a66ef15896d06bdd8dcbc3104a241f1646041cfb60882d1d9\r\n    OBS-Studio-33.0.3-macOS-Apple.dmg: 92212873b6f84c54285203cac3f846590ac00dfad76b312cf266100ff5edf0c8\r\n    OBS-Studio-33.0.3-macOS-Intel-dSYMs.tar.xz: 058fecb411607520a3ae0e7c25fd26d593ad2f687e34f17c7da8b24abae12e69\r\n    OBS-Studio-33.0.3-macOS-Intel.dmg: 45269723d1265563524cb3d635fe090a0b0e1104e3a2eb02ee5355bd16742903\r\n","reactions":{"total_count":39,"+1":14,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":12,"rocket":5,"eyes":2}}
