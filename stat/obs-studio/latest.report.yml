e":"application/zip","state":"uploaded","size":65925795,"digest":"sha256:dbda0e1e9967262380e619e071de068809ccae2ccb3f68f52034db9a8276475d","download_count":294,"created_at":"2026-10-23T22:19:30Z","updated_at":"2026-10-23T22:19:34Z"},{"id":670572636,"node_id":"RA_kwDOAMnsBs4n-CBc","name":"OBS-Studio-33.0.0-Windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":223737114,"digest":"sha256:3369a3ecd67b5669a8a08d77357f87cc786d1fba42fbbd1054d841a69f6271a7","download_count":10361,"created_at":"2026-10-23T22:19:30Z","updated_at":"2026-10-23T22:19:42Z"}],"body":"33.0 New Features\r\n-----------------\r\n\r\n* Updated CEF from 127/6533 to 150/7871 [WizardCM] ([#13900](https://github.com/obsproject/obs-studio/pull/13900))\r\n  + This is a massive update to the underlying framework used for browser sources and docks from the July 2024 release to September 2026\r\n  + All of this work is on the backend and should be invisible to users. Please be sure to report any new weirdness or problems you run into with browser sources!\r\n* Complete overhaul to plugin loading [FiniteSingularity/PatTheMav] ([#13594](https://github.com/obsproject/obs-studio/pull/13594))\r\n  + First-party plugins are now in a new folder named core\r\n  + Third-party plugins have an updated installation location and folder structure\r\n  + Existing third-party plugins will continue to load from the legacy locations until OBS Studio 34.0\r\n  + More information is available in our [knowledge base article](https://obsproject.com/kb/legacy-plugin-locations)\r\n* Improved how source snapping works in the preview [Warchamp7] ([#12298](https://github.com/obsproject/obs-studio/pull/12298))\r\n  + New visual indicator added\r\n  + Sources now snap along the entire axis instead of only when directly touching\r\n  + Sources no longer snap to hidden sources\r\n* Improved behavior of spinboxes for number values [Warchamp7] ([#12337](https://github.com/obsproject/obs-studio/pull/12337))\r\n  + Typing is no longer mysteriously blocked in some situations\r\n  + Numbers are no longer cut off in some situations\r\n  + Values now update only after pressing Enter and Enter does not close the window\r\n  + Holding Shift + Up/Down now advances multiple steps at a time\r\n  + Dragging the cursor inside the input but outside the text itself now works properly\r\n* Enabled NVENC on Arm64 [RytoEX] ([#13827](https://github.com/obsproject/obs-studio/pull/13827))\r\n\r\n33.0 Changes\r\n------------\r\n\r\n* Added a check for encoders being missing when loading a profile [derrod] ([#11340](https://github.com/obsproject/obs-studio/pull/11340))\r\n* Added support for newest NVIDIA Broadcast SDKs for NVIDIA Audio Effects and Video Effects [pkviet] ([#13838](https://github.com/obsproject/obs-studio/pull/13838))\r\n* Added hotkeys for controlling audio monitoring of a source [Warchamp7] ([#13599](https://github.com/obsproject/obs-studio/pull/13599))\r\n* Changed Safe Mode to not start WebSocket Server [FiniteSingularity/RytoEX] ([#13984](https://github.com/obsproject/obs-studio/pull/13984))\r\n* Fixed issues with groups in Studio Mode [Warchamp7] ([#11092](https://github.com/obsproject/obs-studio/pull/11092))\r\n  + Fixed moving sources inside a group causing them to glitch out in Program\r\n  + Fixed moving sources inside a group showing up live in Program\r\n* Adjusted naming of Window Capture methods on Windows [Penwy] ([#12047](https://github.com/obsproject/obs-studio/pull/12047))\r\n* Improved detection of fullscreen games for Game Capture [Kira-NT] ([#10880](https://github.com/obsproject/obs-studio/pull/10880))\r\n* Improved transparency handling for macOS Screen Capture [jcm93] ([#13030](https://github.com/obsproject/obs-studio/pull/13030))\r\n* Scaled simple output recording audio bitrate by channel count [nickvonkaenel] ([#13311](https://github.com/obsproject/obs-studio/pull/13311))\r\n* Removed support for Ubuntu 24.04 \r\n\r\n33.0 Bug Fixes\r\n--------------\r\n\r\n* Added a startup error if obs-transitions failed to load [notr1ch] ([#13321](https://github.com/obsproject/obs-studio/pull/13321))\r\n* Improved file splitting for Hybrid MP4/MOV [derrod] ([#13386](https://github.com/obsproject/obs-studio/pull/13386))\r\n* Fixed outputs getting stuck running when a bad rescale output resolution is set [suogesi] ([#13375](https://github.com/obsproject/obs-studio/pull/13375))\r\n* Fixed monitoring icon state getting desynced when using third-party tools or websockets [prgmitchell] ([#13822](https://github.com/obsproject/obs-studio/pull/13822))\r\n* Fixed a crash on macOS 27.2 when starting OBS Studio [RytoEX] ([#14070](https://github.com/obsproject/obs-studio/pull/14070))\r\n* Fixed potential crash when shader cache file is invalid [notr1ch] ([#13538](https://github.com/obsproject/obs-studio/pull/13538))\r\n* Fixed a potential crash on Linux when USB mic is removed [R0te/RytoEX] ([#13922](https://github.com/obsproject/obs-studio/pull/13922))\r\n* Fixed a potential crash when renaming a source with the Add Source window open [Warchamp7] ([#13800](https://github.com/obsproject/obs-studio/pull/13800))\r\n* Fixed a potential deadlock during video/audio tasks [exeldro] ([#13579](https://github.com/obsproject/obs-studio/pull/13579))\r\n* Fixed an issue with B-frame offset calculation in AMF that could cause streams to disconnect [lexano-ivs] ([#13762](https://github.com/obsproject/obs-studio/pull/13762))\r\n* Fixed PipeWire screencast sources being duplicated in studio mode [tytan652] ([#13673](https://github.com/obsproject/obs-studio/pull/13673))\r\n* Fixed a potential crash when switching off a newly created profile [Warchamp7] ([#13182](https://github.com/obsproject/obs-studio/pull/13182))\r\n* Fixed a source toolbar crash when source type is missing [Penwy] ([#13539](https://github.com/obsproject/obs-studio/pull/13539))\r\n* Fixed profile import failing on paths with a trailing slash [Ushkalovk] ([#13863](https://github.com/obsproject/obs-studio/pull/13863))\r\n\r\n33.0 Developer Information\r\n--------------------------\r\n\r\n* Added frontend event and output signal for replay buffer saving [Penwy] ([#8955](https://github.com/obsproject/obs-studio/pull/8955))\r\n* Added guidance regarding the theme system to the top of all theme files [Warchamp7] ([#13733](https://github.com/obsproject/obs-studio/pull/13733))\r\n* Added ability to set a file extension filter for OBS_PATH_FILE_SAVE path types [FiniteSingularity] ([#10190](https://github.com/obsproject/obs-studio/pull/10190))\r\n* Added obs_frontend_is_safe_mode for first-party plugins\r\n  + Third-party plugins are not loaded at all in Safe Mode\r\n* Added versions to Flatpak plugin extension point [tytan652] ([#13735](https://github.com/obsproject/obs-studio/pull/13735))\r\n* Added obs_canvas_video_active() to check if the video of a canvas is active [exeldro] ([#13110](https://github.com/obsproject/obs-studio/pull/13110))\r\n* The minimum supported versions of Visual Studio, Windows SDK, and clang-format have been increased. Previous versions may continue to work, but will no longer be tested/supported. It is recommended that build environments are kept up-to-date with the project's toolchain.\r\n  + Changed Windows builds to use Visual Studio 2026 and SDK 26100 [RytoEX] ([#13543](https://github.com/obsproject/obs-studio/pull/13543))\r\n  + Changed clang-format version used to 22.1.3 [PatTheMav] ([#13549](https://github.com/obsproject/obs-studio/pull/13549))\r\n* Changed obs_canvas_reset_video() to allow resetting a canvas's video when any other canvas's video is active, but not its own video [exeldro] ([#13110](https://github.com/obsproject/obs-studio/pull/13110))\r\n* Updated libnsgif to 1.0.0 [RytoEX] ([#11178](https://github.com/obsproject/obs-studio/pull/11178))\r\n  + This is a breaking change for any plugins using libobs/graphics gs_image_file\r\n* Clarified documentation for obs_module_unload [notr1ch] ([#13327](https://github.com/obsproject/obs-studio/pull/13327))\r\n* Required MbedTLS 3 and exclude 4 or later [tytan652] ([#13799](https://github.com/obsproject/obs-studio/pull/13799))\r\n* Removed support for FFmpeg 6.x and 7.x [RytoEX] ([#13964](https://github.com/obsproject/obs-studio/pull/13964))\r\n* Removed support for Qt 6.4-6.9 [RytoEX] ([#13969](https://github.com/obsproject/obs-studio/pull/13969))\r\n* Fixed repeated preview enable/disables not working [WarmUpTill] ([#12580](https://github.com/obsproject/obs-studio/pull/12580))\r\n* Only emit core signal handlers for public canvases [tt2468] ([#13574](https://github.com/obsproject/obs-studio/pull/13574))\r\n* Deprecated unused hidden API for sources [derrod] ([#13122](https://github.com/obsproject/obs-studio/pull/13122))\r\n* Deprecated APIs for audio source monitoring_type [Warchamp7] ([#13599](https://github.com/obsproject/obs-studio/pull/13599))\r\n  + This is replaced by a new monitoring_enabled boolean\r\n\r\n\r\n### Checksums\r\n    OBS-Studio-33.0.0-Sources.tar.gz: c1ae3c98c1bb70ebdced33e894a526fcbbbda9bfd95806970a3fc31f74b08f6c\r\n    OBS-Studio-33.0.0-Ubuntu-26.04-x86_64-dbsym.ddeb: 12045838dfd0202ba26b77fb2e8572f4db27c709b3aabe425ac979ee0532a61c\r\n    OBS-Studio-33.0.0-Ubuntu-26.04-x86_64.deb: f5844914eadd560314f3a9db020afa7a8afbefb67a26c488f2956dc339704918\r\n    OBS-Studio-33.0.0-Windows-arm64-PDBs.zip: e43139f467ccedb4fbb583f09ce64341a7c96b44030181ef57abd1528142b947\r\n    OBS-Studio-33.0.0-Windows-arm64.zip: 02c53d7bff3f9c159401da79fc375d7b75b00c9ca62d2b4ec5fc05a575d2fa1f\r\n    OBS-Studio-33.0.0-Windows-x64-Installer.exe: 3bf55dae6d9db651505828090de74540296c742ed2a94a28cf055cb6ddc6bed3\r\n    OBS-Studio-33.0.0-Windows-x64-PDBs.zip: dbda0e1e9967262380e619e071de068809ccae2ccb3f68f52034db9a8276475d\r\n    OBS-Studio-33.0.0-Windows-x64.zip: 3369a3ecd67b5669a8a08d77357f87cc786d1fba42fbbd1054d841a69f6271a7\r\n    OBS-Studio-33.0.0-macOS-Apple-dSYMs.tar.xz: 6b162ccbafc2eaaee3ced192a851eb5d3d616ad8d54125ce5cd701d26e6939bf\r\n    OBS-Studio-33.0.0-macOS-Apple.dmg: b36f4e9da5f2f17c733ba711c8fe0656d6b0cd573cfe96eeb3e68325cffef739\r\n    OBS-Studio-33.0.0-macOS-Intel-dSYMs.tar.xz: 997ba41207e9fd7b045b955561cdd5c32b29f12d98ea3ea5a43de7c9edd8f1c7\r\n    OBS-Studio-33.0.0-macOS-Intel.dmg: 8524ff428f038573f8905a206841081d3da9ec607063906f7bbfe38d55810c1c\r\n","reactions":{"total_count":155,"+1":57,"-1":0,"laugh":9,"hooray":33,"confused":0,"heart":29,"rocket":21,"eyes":6}}
