3314b8df5c32c2731053125598acbea3b3fac519","download_count":148,"created_at":"2026-07-18T14:28:31Z","updated_at":"2026-07-18T14:28:31Z"},{"id":481535761,"node_id":"RA_kwDOQydsfM4cs6cR","name":"vortix-x86_64-unknown-linux-gnu.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":106,"digest":"sha256:6a8570336b48b6f1b379bf365bfd82bf258c7f09c01cf1d3daa57c035722b5b5","download_count":4,"created_at":"2026-07-18T14:28:31Z","updated_at":"2026-07-18T14:28:31Z"},{"id":481535762,"node_id":"RA_kwDOQydsfM4cs6cS","name":"vortix-x86_64-unknown-linux-musl.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":2824876,"digest":"sha256:31a7591bbe5a58a72eaf43c38cf0818638b85366134a48ecc2b886d71c23745d","download_count":46,"created_at":"2026-07-18T14:28:31Z","updated_at":"2026-07-18T14:28:32Z"},{"id":481535765,"node_id":"RA_kwDOQydsfM4cs6cV","name":"vortix-x86_64-unknown-linux-musl.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":107,"digest":"sha256:e46158e93474b10ed0f7bacfa40371ca42562d8c41a1ef81ec5af0e2a0435c32","download_count":5,"created_at":"2026-07-18T14:28:31Z","updated_at":"2026-07-18T14:28:32Z"},{"id":481535770,"node_id":"RA_kwDOQydsfM4cs6ca","name":"vortix.rb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-ruby","state":"uploaded","size":2539,"digest":"sha256:e5ac8ed2d1910438a42b89101f40a50ae5d491d4fa01f28e87ceeb1ab0865ec0","download_count":4,"created_at":"2026-07-18T14:28:31Z","updated_at":"2026-07-18T14:28:32Z"}],"body":"## Release Notes\n\n### Highlights\n\n- **IPv6-disabled hosts get a clean refusal instead of a crash-dump** ([#242](https://github.com/Harry-kp/vortix/issues/242)). Connecting a WireGuard profile whose `Address` line declares an IPv6 entry used to fail mid-way inside `wg-quick` with a raw `RTNETLINK answers: Operation not supported` error and a retry loop. Both the TUI and CLI now refuse pre-flight with an actionable message: re-enable IPv6 via sysctl (or remove `ipv6.disable=1` from the kernel cmdline), or drop the IPv6 entry from the profile. The profile is never rewritten silently. ([#247](https://github.com/Harry-kp/vortix/pull/247))\n- **CLI lifecycle hardening** ([#249](https://github.com/Harry-kp/vortix/pull/249)). `vortix up` is now truly idempotent, live tunnels are no longer flagged as \"possible orphans\" on every `down`, and concurrent `up`/`down`/`reconnect` invocations from multiple terminals serialize instead of racing.\n\n### Fixed\n\n- **`vortix up` is now truly idempotent.** Re-running `up` for an already-connected profile prints `Already connected` and exits 0 instead of re-spawning the tunnel. Previously a second `up` of an OpenVPN profile spawned a duplicate daemon whose `--writepid` clobbered the first's pidfile, leaving the original daemon untracked. ([#249](https://github.com/Harry-kp/vortix/pull/249))\n- **No more spurious orphan warnings for live tunnels.** The startup orphan scan now excludes PIDs recorded in profile pidfiles (`run/<name>.pid`), so `vortix down` / `status` no longer flags the active session's own `openvpn` daemon as a \"possible orphan from a previous session.\" ([#249](https://github.com/Harry-kp/vortix/pull/249))\n- **Concurrent `up`/`down`/`reconnect` invocations are serialized** via a `flock` lifecycle lock in the config dir. Two terminals racing the same mutation now queue instead of interleaving; the second prints a one-line \"waiting\u2026\" note. ([#249](https://github.com/Harry-kp/vortix/pull/249))\n- **OpenVPN double-spawn guard** at the tunnel layer: `up()` refuses when the profile's pidfile records a live daemon (covers the mid-negotiation window the scanner can't see). ([#249](https://github.com/Harry-kp/vortix/pull/249))\n- WireGuard connect on a Linux host with IPv6 disabled no longer fails mid-way inside `wg-quick` (see Highlights). Detection covers both disable mechanisms: sysctl `disable_ipv6=1` and the `ipv6.disable=1` boot param, verified against real kernels in both states. ([#242](https://github.com/Harry-kp/vortix/issues/242), [#247](https://github.com/Harry-kp/vortix/pull/247))\n- Daemon socket now binds inside the Tokio runtime ([#233](https://github.com/Harry-kp/vortix/pull/233)).\n\n### Security\n\n- Bumped `crossbeam-epoch` 0.9.18 \u2192 0.9.20 for [RUSTSEC-2026-0204](https://rustsec.org/advisories/RUSTSEC-2026-0204) (invalid pointer dereference in `fmt::Pointer`; reached via a build-tooling dependency chain, not vortix's runtime path).\n\n### Changed\n\n- README now documents the kill-switch **reboot boundary**: firewall rules do not survive an OS reboot, so `vpn-only` is unenforced between boot and the next vortix launch. Persistence across reboot is tracked in [#250](https://github.com/Harry-kp/vortix/issues/250). ([#249](https://github.com/Harry-kp/vortix/pull/249))\n- The flip-panel widget now ships as the extracted [`ratatui-flip-panel`](https://crates.io/crates/ratatui-flip-panel) crate, consumed as a dependency. ([#232](https://github.com/Harry-kp/vortix/pull/232))\n\n### Documentation\n\n- README overhaul: install matrix, named competitor comparison, security model, contributing section. ([#230](https://github.com/Harry-kp/vortix/pull/230))\n- Refreshed demo GIFs (hero + 4 scenario clips) and README cleanup. ([#236](https://github.com/Harry-kp/vortix/pull/236))\n- X/Twitter handle badge. ([#244](https://github.com/Harry-kp/vortix/pull/244))\n\n\n---\n\n## Install vortix 0.4.3\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-installer.sh | sh\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install Harry-kp/tap/vortix\n```\n\n### Install prebuilt binaries into your npm project\n\n```sh\nnpm install @harry-kp/vortix@0.4.3\n```\n\n## Download vortix 0.4.3\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [vortix-aarch64-apple-darwin.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-aarch64-apple-darwin.tar.xz.sha256) |\n| [vortix-x86_64-apple-darwin.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-x86_64-apple-darwin.tar.xz.sha256) |\n| [vortix-aarch64-unknown-linux-gnu.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [vortix-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [vortix-aarch64-unknown-linux-musl.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.4.3/vortix-aarch64-unknown-linux-musl.tar.xz.sha2