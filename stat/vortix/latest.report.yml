t-stream","state":"uploaded","size":107,"digest":"sha256:14e9a7b5f15a646a3f5d63aae1db2ae840a949cbd8c78c971796113c346587e9","download_count":3,"created_at":"2026-10-24T19:44:36Z","updated_at":"2026-10-24T19:44:36Z"},{"id":673148954,"node_id":"RA_kwDOQydsfM4oH3Aa","name":"vortix_0.5.5_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2928796,"digest":"sha256:f6e11e5d4d7eca17d7956130185d5c4f659725c5730303b40effa211e8076334","download_count":1,"created_at":"2026-10-24T19:45:57Z","updated_at":"2026-10-24T19:45:57Z"},{"id":673148955,"node_id":"RA_kwDOQydsfM4oH3Ab","name":"vortix_0.5.5_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2892580,"digest":"sha256:cf67438af2391fc69398fc6dfd807b25f9a9959df6108f36877dac18e53079fd","download_count":1,"created_at":"2026-10-24T19:45:57Z","updated_at":"2026-10-24T19:45:57Z"}],"body":"## Release Notes\n\n### Security\n\n- **TLS fixes in the address lookups.** The library that checks certificates for Vortix's public-IP and ISP lookups had four advisories (RUSTSEC-2026-0346 to 0349), and its certificate checker and root store two more (RUSTSEC-2026-0381, 0382). All are updated; nothing changes in how tunnels work. ([#398](https://github.com/Harry-kp/vortix/pull/398), [#400](https://github.com/Harry-kp/vortix/pull/400))\n\n### Fixed\n\n- **The dashboard no longer waits 20 s to start when a tunnel's server is unreachable.** With a full tunnel whose server had gone away, DNS went into the dead tunnel and Vortix waited out its timeouts before showing anything; `vortix status` and `vortix down` waited too. A server's last known address is now used after 2 s. ([#399](https://github.com/Harry-kp/vortix/pull/399))\n- **`vortix list` says `1 hour ago` and `1 day ago`,** not `1 hours ago`. ([#389](https://github.com/Harry-kp/vortix/pull/389))\n\n## Install vortix 0.5.5\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-installer.sh | sh\n```\n\n## Download vortix 0.5.5\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [vortix-aarch64-apple-darwin.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-aarch64-apple-darwin.tar.xz.sha256) |\n| [vortix-x86_64-apple-darwin.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-x86_64-apple-darwin.tar.xz.sha256) |\n| [vortix-aarch64-unknown-linux-gnu.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [vortix-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [vortix-aarch64-unknown-linux-musl.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [vortix-x86_64-unknown-linux-musl.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.5.5/vortix-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
