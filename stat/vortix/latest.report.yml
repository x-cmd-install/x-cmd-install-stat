n/octet-stream","state":"uploaded","size":107,"digest":"sha256:6c6fa3a61b14ce06638460b73bc76993d3d36c84e3d4f41fe3a3ef6b70aa5e5e","download_count":5,"created_at":"2026-11-01T20:37:03Z","updated_at":"2026-11-01T20:37:03Z"},{"id":699463580,"node_id":"RA_kwDOQydsfM4psPec","name":"vortix_0.6.0_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":3025834,"digest":"sha256:3bd35d768d5400d2edc6139fb6fb342d74c1af1599e250031b709e7865e8b879","download_count":13,"created_at":"2026-11-01T20:38:32Z","updated_at":"2026-11-01T20:38:32Z"},{"id":699463581,"node_id":"RA_kwDOQydsfM4psPed","name":"vortix_0.6.0_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2985160,"digest":"sha256:c95636193a2ff8d514cda1b8c83677fec51f79efb9315c24c86e20af0f564de1","download_count":6,"created_at":"2026-11-01T20:38:32Z","updated_at":"2026-11-01T20:38:32Z"}],"body":"## Release Notes\n\n![Vortix 0.6: add a NetBird network, sign in, see its peers](https://raw.githubusercontent.com/Harry-kp/vortix/main/assets/netbird.gif)\n\nAnnouncement and questions: https://github.com/Harry-kp/vortix/discussions/430\n\n### Highlights\n\n- **NetBird, run by Vortix.** Press `i` and type `netbird` (or `netbird https://your.server`); sign in in your browser, or from any device over SSH. Same keys, kill switch, CLI and `--json` as every other tunnel. Run it beside your own WireGuard or OpenVPN: company addresses go through NetBird, the internet through your VPN. ([#405](https://github.com/Harry-kp/vortix/pull/405), [#413](https://github.com/Harry-kp/vortix/pull/413))\n- **Routes and peers on the back of Details** (`F2`, `f`), for every VPN. ([#421](https://github.com/Harry-kp/vortix/pull/421))\n- **Select to copy, click to open links** in the TUI. ([#412](https://github.com/Harry-kp/vortix/pull/412), [#423](https://github.com/Harry-kp/vortix/pull/423))\n\n### Fixed\n\n- **No false \"matches the pre-VPN address\" warning on split tunnels.** ([#409](https://github.com/Harry-kp/vortix/pull/409))\n\n### Changed\n\n- **`i` is now \"Add a VPN\";** Details' back shows routes and peers instead of Health. ([#413](https://github.com/Harry-kp/vortix/pull/413), [#421](https://github.com/Harry-kp/vortix/pull/421))\n\n## Install vortix 0.6.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-installer.sh | sh\n```\n\n## Download vortix 0.6.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [vortix-aarch64-apple-darwin.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-aarch64-apple-darwin.tar.xz.sha256) |\n| [vortix-x86_64-apple-darwin.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-x86_64-apple-darwin.tar.xz.sha256) |\n| [vortix-aarch64-unknown-linux-gnu.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [vortix-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [vortix-aarch64-unknown-linux-musl.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [vortix-x86_64-unknown-linux-musl.tar.xz](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/Harry-kp/vortix/releases/download/v0.6.0/vortix-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n\n\n\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":0,"eyes":0}}
