{"id":339916053,"author":{"login":"vitaut","id":576385,"node_id":"MDQ6VXNlcjU3NjM4NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAGurSs4UQrUV","tag_name":"12.2.0","target_commitish":"release","name":"12.2.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-06-16T05:05:35Z","updated_at":"2026-06-16T05:30:06Z","published_at":"2026-06-16T05:30:06Z","assets":[{"id":448868846,"node_id":"RA_kwDOAGurSs4awTHu","name":"fmt-12.2.0.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19971,"digest":"sha256:1cb23987c7e7cc821eac3a94dd2c7d8b6575fc7b95307a8be44b73e6fd3f5705","download_count":94,"created_at":"2026-06-16T05:10:17Z","updated_at":"2026-06-16T05:10:17Z"},{"id":448867611,"node_id":"RA_kwDOAGurSs4awS0b","name":"fmt-12.2.0.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1486029,"digest":"sha256:a2f4a8d51178f954e4c339007f77edd76ba0cb2e36f87a48e5a5403d9be5878f","download_count":203818,"created_at":"2026-06-16T05:08:14Z","updated_at":"2026-06-16T05:08:14Z"}],"body":"- Added a C11 API that brings fast, type-safe formatting to C. The new `fmt-c` library and `fmt/fmt-c.h` header use `_Generic` to dispatch on argument types and outperform `printf`/`sprintf`. For example:\r\n\r\n  ```c++\r\n  #include <fmt/fmt-c.h>\r\n\r\n  fmt_print(stdout, \"The answer is {}.\\n\", 42);\r\n  ```\r\n\r\n  (https://github.com/fmtlib/fmt/issues/4663, https://github.com/fmtlib/fmt/pull/4671, https://github.com/fmtlib/fmt/pull/4696, https://github.com/fmtlib/fmt/issues/4693, https://github.com/fmtlib/fmt/pull/4694, https://github.com/fmtlib/fmt/pull/4712, https://github.com/fmtlib/fmt/pull/4789). Thanks @Soumik15630m, @Ferdi265 and @localspook.\r\n\r\n- Added a separate `fmt::fmt-module` CMake target for C++20 modules and a CI workflow that exercises module-based builds (https://github.com/fmtlib/fmt/issues/4684, https://github.com/fmtlib/fmt/pull/4685, https://github.com/fmtlib/fmt/issues/4707, https://github.com/fmtlib/fmt/pull/4708, https://github.com/fmtlib/fmt/pull/4702, https://github.com/fmtlib/fmt/pull/4709). Thanks @MathewBensonCode.\r\n\r\n- Enabled the full Dragonbox lookup cache by default for floating-point formatting unless optimizing for binary size (`__OPTIMIZE_SIZE__`), giving a ~10\u201325% speedup. Thanks Matthias Kretz for the suggestion. Average time per `double` on Apple M1 Pro (clang 17, random digits, smaller is better) measured with [dtoa-benchmark](https://github.com/fmtlib/dtoa-benchmark):\r\n\r\n  | Method                  | Time (ns) |\r\n  | ----------------------- | --------: |\r\n  | fmt (full)              |     22.07 |\r\n  | fmt (compact)           |     29.55 |\r\n  | ryu                     |     35.21 |\r\n  | double-conversion       |     81.81 |\r\n  | `sprintf`               |    726.27 |\r\n  | `ostringstream`         |    864.34 |\r\n\r\n- Improved integer formatting performance by ~3% (https://github.com/fmtlib/fmt/pull/4630). Thanks @user202729.\r\n\r\n- Optimized formatting into back-insert iterators by using bulk container append/insert methods (e.g. on `std::vector<char>` and custom string types) (https://github.com/fmtlib/fmt/pull/4679). Thanks @user202729.\r\n\r\n- Reduced binary size of debug builds (~200k to ~85k in the bloat test) and improved compile speed when `consteval` is unavailable.\r\n\r\n- Made path formatting lossless, preserving ill-formed UTF-16 sequences when converting `std::filesystem::path` to a narrow string.\r\n\r\n- Added support for formatting `std::unexpected` (https://github.com/fmtlib/fmt/pull/4675). Thanks @17steen.\r\n\r\n- Added overloads of `fmt::println` that take a `fmt::text_style` (https://github.com/fmtlib/fmt/pull/4782). Thanks @ahoarau.\r\n\r\n- Added support for positional arguments as width and precision specifiers in `fmt::printf` (https://github.com/fmtlib/fmt/pull/4643). Thanks @KareemOtoum.\r\n\r\n- Made `FMT_STRING` a no-op when `FMT_USE_CONSTEVAL` is enabled, since the consteval format-string constructor already provides compile-time validation (https://github.com/fmtlib/fmt/issues/4611, https://github.com/fmtlib/fmt/pull/4612). Thanks @friedkeenan.\r\n\r\n- Promoted `fmt::detail::named_arg` to the public API as `fmt::named_arg` and deprecated the detail alias (https://github.com/fmtlib/fmt/issues/4683, https://github.com/fmtlib/fmt/pull/4687). Thanks @TPPPP72.\r\n\r\n- Moved the `std::byte` formatter from `fmt/format.h` to `fmt/std.h`.\r\n\r\n- Provided a default definition for `fmt::is_contiguous` (https://github.com/fmtlib/fmt/pull/4731, https://github.com/fmtlib/fmt/pull/4770). Thanks @user202729 and @phprus.\r\n\r\n- Added the `FMT_USE_FLOCKFILE` macro to disable the use of `flockfile` (https://github.com/fmtlib/fmt/issues/4646, https://github.com/fmtlib/fmt/pull/4666). Thanks @mvastola.\r\n\r\n- Added `include_guard(GLOBAL)` so that {fmt} can be used in multiple submodules of the same project (https://github.com/fmtlib/fmt/pull/4672). Thanks @torsten48.\r\n\r\n- Improved `constexpr` support (https://github.com/fmtlib/fmt/pull/4659, https://github.com/fmtlib/fmt/pull/4591). Thanks @elbeno and @17steen.\r\n\r\n- Deprecated the implicit conversion from `fmt::format_string` and `fmt::basic_fstring` to `string_view` to align with `std::format_string`; use `format_string::get()` instead.\r\n\r\n- Opted out `std::complex` from tuple formatting so that the dedicated `std::complex` formatter is always used.\r\n\r\n- Removed the `fmt::say` function.\r\n\r\n- Deprecated the `std::initializer_list` overload of `fmt::join` and the array overload of `fmt::vformat_to`.\r\n\r\n- Made the `<fmt/core.h>` header equivalent to `<fmt/base.h>` by default. Code that relied on `<fmt/core.h>` pulling in `<fmt/format.h>` must now either include `<fmt/format.h>` directly or define `FMT_DEPRECATED_HEAVY_CORE` to opt back in.\r\n\r\n- Improved `wchar_t` support: `fmt::join` now accepts `wchar_t` and other non-`char` separators, and `fmt::format_to_n` now works with `fmt::runtime` on `wchar_t` (https://github.com/fmtlib/fmt/pull/4686, https://github.com/fmtlib/fmt/issues/4714, https://github.com/fmtlib/fmt/pull/4715). Thanks @Yancey2023 and @sunmy2019.\r\n\r\n- Fixed formatting of `std::tm` with a null `tm_zone` (https://github.com/fmtlib/fmt/pull/4790). Thanks @Carmel0.\r\n\r\n- Fixed compile-time formatting in `fmt/ranges.h`, `fmt/style.h` and `fmt/std.h` (https://github.com/fmtlib/fmt/pull/4759). Thanks @j4niwzis.\r\n\r\n- Fixed an ambiguity between `formatter<std::optional<T>>` in `fmt/std.h` and `fmt/ranges.h` on C++26 (P3168R2) (https://github.com/fmtlib/fmt/pull/4761). Thanks @phprus.\r\n\r\n- Fixed a GCC PCH breakage triggered by a scoped `#pragma GCC optimize`.\r\n\r\n- Fixed a TSAN false positive in the locale handling code (https://github.com/fmtlib/fmt/issues/4755).\r\n\r\n- Fixed compile-time format string checks truncating string literals at an embedded null byte (https://github.com/fmtlib/fmt/pull/4732). Thanks @user202729.\r\n\r\n- Fixed out-of-bounds reads in `printf` formatting (https://github.com/fmtlib/fmt/issues/4741, https://github.com/fmtlib/fmt/pull/4742, https://github.com/fmtlib/fmt/pull/4800). Thanks @Algunenano and @aizu-m.\r\n\r\n- Fixed the return type of the `f(un)lockfile`   wrappers on Windows (https://github.com/fmtlib/fmt/pull/4739). Thanks @mvastola.\r\n\r\n- Worked around a CUDA issue when handling UTF-32 literals (https://github.com/fmtlib/fmt/pull/4719). Thanks @Cazadorro.\r\n\r\n- Fixed missing named-argument validation for compiled format strings (https://github.com/fmtlib/fmt/pull/4638). Thanks @JaeheonShim.\r\n\r\n- Fixed `fmt::format_to_n` in `<fmt/compile.h>` failing to compile when `<iterator>` is not transitively included (https://github.com/fmtlib/fmt/issues/4615).\r\n\r\n- Fixed handling of pointers in format string compilation with `FMT_BUILTIN_TYPES=0`.\r\n\r\n- Stopped assuming nul termination of the format string in `fmt::printf`. Thanks @ZUENS2020 for reporting.\r\n\r\n- Fixed a build error when locale support is disabled (https://github.com/fmtlib/fmt/pull/4627). Thanks @marcel-behlau-elfin.\r\n\r\n- Fixed a fallback range formatter for types with a `container_type` member (https://github.com/fmtlib/fmt/issues/4123, https://github.com/fmtlib/fmt/pull/4660). Thanks @Soumik15630m.\r\n\r\n- Fixed C++20 concept detection (https://github.com/fmtlib/fmt/pull/4653). Thanks @tearfur.\r\n\r\n- Fixed a clang compilation failure (https://github.com/fmtlib/fmt/pull/4718). Thanks @mccakit.\r\n\r\n- Fixed various MSVC warnings, including C4305 and conversion warnings on x86 (https://github.com/fmtlib/fmt/pull/4668, https://github.com/fmtlib/fmt/pull/4594). Thanks @kanren3 and @blizzard4591.\r\n\r\n- Updated the Android Gradle Plugin to 9.x (https://github.com/fmtlib/fmt/issues/4651, https://github.com/fmtlib/fmt/pull/4658). Thanks @Soumik15630m.\r\n\r\n- Made various code, build and test improvements (https://github.com/fmtlib/fmt/pull/4625, https://github.com/fmtlib/fmt/pull/4639, https://github.com/fmtlib/fmt/pull/4644, https://github.com/fmtlib/fmt/pull/4656, https://github.com/fmtlib/fmt/pull/4680, https://github.com/fmtlib/fmt/pull/4681, https://github.com/fmtlib/fmt/pull/4704, https://github.com/fmtlib/fmt/pull/4710, https://github.com/fmtlib/fmt/pull/4713, https://github.com/fmtlib/fmt/pull/4729, https://github.com/fmtlib/fmt/pull/4751, https://github.com/fmtlib/fmt/pull/4758, https://github.com/fmtlib/fmt/pull/4799). Thanks @ZephyrLykos, @togunchan, @kagancansit, @BerndPetrovitsch, @Skylion007, @st0rmbtw, @localspook and @EXtremeExploit.\r\n\r\n- Improved documentation, including a rewrite of the format string syntax, better handling of doxygen tags, documenting `output_file`, fixing CSS so that whitespace is displayed properly, and various smaller fixes (https://github.com/fmtlib/fmt/pull/4622, https://github.com/fmtlib/fmt/pull/4626, https://github.com/fmtlib/fmt/pull/4631, https://github.com/fmtlib/fmt/pull/4667, https://github.com/fmtlib/fmt/pull/4616, https://github.com/fmtlib/fmt/pull/4748). Thanks @heavywatal, @ZephyrLykos, @user202729, @ssszcmawo, @bigmoonbit and @Powerbyte7.\r\n\r\n- Added building of release artifacts and SLSA provenance in CI, added a CodeQL workflow, and added the security policy in `.github/SECURITY.md`.\r\n\r\n","reactions":{"total_count":50,"+1":19,"-1":0,"laugh":0,"hooray":24,"confused":0,"heart":5,"rocket":0,"eyes":2},"mentions_count":38}
