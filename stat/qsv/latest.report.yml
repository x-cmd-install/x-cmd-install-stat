t_type":"binary/octet-stream","state":"uploaded","size":434350789,"digest":"sha256:96d31296985ad94a9d9ff97d5e249dd2c7eed4f6ae10b8eb267a647ef70eb421","download_count":57,"created_at":"2026-10-19T15:19:02Z","updated_at":"2026-10-19T15:19:17Z"},{"id":656247119,"node_id":"RA_kwDOExnjV84nHYlP","name":"qsv-26.0.0-x86_64-unknown-linux-musl.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":58862158,"digest":"sha256:1c8eccb4aae47a046ff350a6a3d31c92d188793ffd6583486676746698708336","download_count":49,"created_at":"2026-10-19T12:42:11Z","updated_at":"2026-10-19T12:42:14Z"},{"id":656439718,"node_id":"RA_kwDOExnjV84nIHmm","name":"qsv-data-wrangling-26.0.0.plugin","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98025,"digest":"sha256:263492ebf952c6b6474ca73dc9a066560ffb0e75ab62380be806891f0e95adb5","download_count":1,"created_at":"2026-10-19T14:00:26Z","updated_at":"2026-10-19T14:00:26Z"},{"id":656439719,"node_id":"RA_kwDOExnjV84nIHmn","name":"qsv-mcp-server-26.0.0.mcpb","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11138284,"digest":"sha256:99b60088e35d9304bd74cbb076a3f931dc3faf80a484d3b44dd05f02ff982f9f","download_count":1,"created_at":"2026-10-19T14:00:26Z","updated_at":"2026-10-19T14:00:26Z"}],"body":"## [26.0.0] - 2026-10-19 \ud83e\udded The \"New Angles\" Release \ud83d\udcd0\r\n\r\n<p align=\"center\">\r\n<img width=\"1000\" height=\"680\" alt=\"qsv-26 0 0-new-angles\" src=\"https://github.com/user-attachments/assets/fc663ddd-f2bb-4b0f-bfd2-075155f062b9\" />\r\n</p>\r\n\r\n~57 commits since 25.0.0, and the theme is **NEW ANGLES**: four new ways to look at your data in `viz`, three of them off the usual x/y grid. Some data doesn't fit a scatter plot. Wind directions, hours of the day and months go around a circle, soil textures and vote shares are parts of a whole, and a table with six correlated measures has more dimensions than two axes can show.\r\n\r\n**POLAR.** [`viz barpolar`](https://github.com/dathere/qsv/blob/master/docs/help/viz.md) draws a wind rose: one bar per direction, clockwise from north, with compass labels (`N`, `NE`, `NNE`...) at their true bearings and `--degrees` for a numeric bearing column. The `viz smart` seasonality panel now uses polar bars too, so hour of day, day of week and month read like a clock face, starting at the top and running clockwise.\r\n\r\n**TERNARY.** `viz ternary` plots three parts of a whole, such as sand, silt and clay, or three candidates' vote shares, with each row placed at its shares of the total.\r\n\r\n**PARALLEL COORDINATES.** `viz parcoords` draws one line per row across several numeric columns; drag along an axis to filter. `viz smart` adds a parallel-coordinates panel to the Data Schematic when three or more measures correlate.\r\n\r\n**FUNNEL AREA.** `viz funnel --area` sizes each stage by its share of the total.\r\n\r\n**SQL, from new angles too.** Polars is bumped to upstream [`b951cd7`](https://github.com/pola-rs/polars/commit/b951cd7072489d54276b38586924ea4a21b838dc), and `sqlp` gains moving-window frames (`ROWS BETWEEN 2 PRECEDING AND CURRENT ROW`), `REGEXP_REPLACE`, `DATE_TRUNC`, `BIT_COUNT`, and a `read_ndjson()` table function with named options.\r\n\r\n**Saying what you mean.** `--delimiter` and `QSV_DEFAULT_DELIMITER` now follow the documented precedence in seven commands, `schema` output validates the CSV it was inferred from (`--ignore-case`, `--enum-threshold` and non-ASCII string lengths), `count --width` is fixed for quoted fields, and `geoconvert` handles GeoJSON features with different properties.\r\n\r\nSame data, new angles.\r\n\r\n---\r\n\r\n### Breaking Changes\r\nThis is 26.0.0 rather than 25.1.0 because two changes can alter existing output:\r\n\r\n- **`excel`, `jsonl` and `readstat` now follow `QSV_DEFAULT_DELIMITER` on output** ([#4819](https://github.com/dathere/qsv/pull/4819)), as other qsv writers already do. If you set it only to read semicolon files, these three now write semicolons to stdout as well. Unset it for those commands, or pass `--delimiter ,`, to keep commas.\r\n- **`schema` can generate stricter schemas** ([#4830](https://github.com/dathere/qsv/pull/4830)). A column that holds a single value in the input now always gets a `const` constraint, which most files with a low-cardinality column used to lose, so `validate` rejects later data with any other value there (e.g. a changed phone number or URL). Generate schemas from a representative dataset, and loosen or remove `const`/`enum` constraints where values are expected to change.\r\n\r\n### \ud83d\ude4f Contributors\r\n\r\nThanks to everyone who made 26.0.0 possible:\r\n\r\n- [@dajiaohuang](https://github.com/dajiaohuang) for making `schema` infer Unicode character lengths instead of UTF-8 byte lengths ([#4827](https://github.com/dathere/qsv/pull/4827))\r\n- [@ybai08](https://github.com/ybai08) for fixing `geoconvert` GeoJSON to CSV when features have different properties ([#4837](https://github.com/dathere/qsv/pull/4837))\r\n\r\n---\r\n\r\n**Detailed Changelog**: https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v26-changes\r\n\r\n**Full Commit log**: https://github.com/dathere/qsv/compare/25.0.0...26.0.0"}
