,"content_type":"binary/octet-stream","state":"uploaded","size":348138565,"digest":"sha256:7d863841300bb3ae22d8c7146ab048f7419a2d3a4400d31f8b4165034cc18d93","download_count":511,"created_at":"2026-10-05T12:10:09Z","updated_at":"2026-10-05T12:10:20Z"},{"id":611523906,"node_id":"RA_kwDOExnjV84kcx1C","name":"qsv-24.0.0-x86_64-unknown-linux-musl.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":56233031,"digest":"sha256:0079acb8542af8b243fa861259746a6a88cef1aefc07214aaaf0f0a1b0593738","download_count":111,"created_at":"2026-10-05T04:48:48Z","updated_at":"2026-10-05T04:48:50Z"},{"id":613618738,"node_id":"RA_kwDOExnjV84kkxQy","name":"qsv-data-wrangling-24.0.0.plugin","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98025,"digest":"sha256:0d2aa5d5131493bf8dd076690c21d7b3fd3d09fcfcb9f2772b178df70bc99c3a","download_count":8,"created_at":"2026-10-05T21:11:09Z","updated_at":"2026-10-05T21:11:10Z"},{"id":613618737,"node_id":"RA_kwDOExnjV84kkxQx","name":"qsv-mcp-server-24.0.0.mcpb","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11134663,"digest":"sha256:873ff521cda3c68cce6be40d5c46ac1638f0ed62ed41a3eaa1087044c5994583","download_count":4,"created_at":"2026-10-05T21:11:09Z","updated_at":"2026-10-05T21:11:24Z"}],"body":"## [24.0.0] - 2026-10-05 \u2696\ufe0f The \"Evidence Act\" Release \ud83c\udfdb\ufe0f\r\n\r\n~160 commits since 23.0.1, and the theme is **EVIDENCE**. The 2018 [Foundations for Evidence-Based Policymaking Act](https://www.congress.gov/bill/115th-congress/house-bill/4174) asks US federal agencies to build policy on evidence, to make their data open by default and machine-readable, and to describe all of it in a public data inventory. Eight years on, the hard part is rarely the law. It is the plumbing: the evidence sits in SAS, Stata and SPSS files, and the inventory has to pass a validator. This release works on both.\r\n\r\n**The inventory first.** Metadata is what makes data [FAIR](https://www.go-fair.org/fair-principles/) (Findable, Accessible, Interoperable and Reusable), and an inventory entry only does that job if it validates: a catalog record data.gov cannot harvest leaves the dataset unfindable, however open the data itself is. The metadata data.gov harvests is [DCAT-US](https://github.com/GSA/dcat-us), and DCAT-US v3 quietly **stopped being JSON-LD** this spring and the [initial implementation guidance](https://www.councils.gov/news-events/news/published-dcat-us-schema-30-implementation-guide/) was just published late summer. `profile` was still emitting the prefixed JSON-LD form, and [data.gov's latest validator](https://harvest.data.gov/validate/) rejected it outright. It now emits canonical, unprefixed v3, and `--validate` actually bites. JSON Schema treats `format` as an annotation by default, so a malformed date used to pass locally and then fail at data.gov; formats are now asserted. Unknown keys are reported, `--strict` aborts only on Required findings, and the validator is tested against **GSA's own 23 conformance fixtures**. The *F* and the *I* in FAIR start with metadata that passes.\r\n\r\n**Then the evidence itself.** Program evaluations, surveys and statistical microdata, the raw material of the Act's learning agendas and its statistical agencies, live largely in SAS, Stata and SPSS files. 23.0.1 brought [`readstat`](https://github.com/dathere/qsv/blob/master/docs/help/readstat.md) to read them. 24.0.0 makes it a **round trip**:\r\n\r\n- The new [`writestat`](https://github.com/dathere/qsv/blob/master/docs/help/writestat.md) command writes a CSV back out as SPSS (`.sav`, `.por`), Stata (`.dta`) or SAS transport (`.xpt`).\r\n- `readstat --dictionary` writes a JSON Schema data dictionary from the file's *own* metadata (variable labels, value labels, declared missing values, display formats) with no LLM involved. `qsv validate` and `viz smart` read it like any other dictionary.\r\n- Hand that dictionary to `writestat` and the file comes back **with its metadata**: decoded labels return to their codes, and missing-value codes become declared missing values again. Round trips are identical for every SPSS `.sav` fixture and for the SAS transport fixtures.\r\n- Where a format cannot hold something, `writestat` **refuses rather than silently dropping it**. `--lossy` writes the file anyway and warns about each thing it left out.\r\n\r\n**In evidence, an empty cell is not one thing.** \"Refused\", \"Don't know\" and \"Not applicable\" are different answers, and SAS, Stata and SPSS keep them apart as *user-defined missing values*. `readstat` now preserves them for all three formats with `--sentinels-as value|label`, labels SAS's from `.sas7bcat` format catalogs, and, when you don't ask it to keep them, **no longer drops them silently**: it reports how many were written as empty cells and where. Checked against upstream's 578-file test corpus, its counts match pyreadstat's exactly. `readstat` can also read just part of a large file (`--select`, `--offset`, `--limit`, `--sample`). Thanks to [@jrothbaum](https://github.com/jrothbaum) for a run of fast upstream fixes in [polars-readstat-rs](https://github.com/jrothbaum/polars_readstat) that made much of this possible.\r\n\r\n**Evidence also needs numbers you can defend.** [`moarstats`](https://github.com/dathere/qsv/blob/master/docs/help/moarstats.md) gains **17 statistical measures (56 \u2192 73)**, each checked against scipy. Among them are [L-moments](https://en.wikipedia.org/wiki/L-moment), [lag-1 autocorrelation](https://en.wikipedia.org/wiki/Autocorrelation), the [Hoover index](https://en.wikipedia.org/wiki/Hoover_index), [Cram\u00e9r's V](https://en.wikipedia.org/wiki/Cram%C3%A9r%27s_V), [OLS regression](https://en.wikipedia.org/wiki/Ordinary_least_squares) and **Benford MAD**, Nigrini's first-digit test of [Benford's law](https://en.wikipedia.org/wiki/Benford%27s_law), a classic data-fabrication signal. The same scrutiny found that [Jarque-Bera](https://en.wikipedia.org/wiki/Jarque%E2%80%93Bera_test), the [Bimodality Coefficient](https://en.wikipedia.org/wiki/Multimodal_distribution#Bimodality_coefficient) and [kurtosis](https://en.wikipedia.org/wiki/Kurtosis) were computed from the wrong inputs; **all three now match scipy, so their values change.** `frequency --lmt-threshold` had applied its limits to the wrong columns ever since the option was added, and weighted ties and the \"Other\" row were mishandled; all fixed. `stats` and `frequency` no longer invoke undefined behavior on malformed CSV, and `stats` caches no longer leak a private file's values through world-readable permissions. Evidence you cannot reproduce is anecdata.\r\n\r\n**Machine-readable by default** applies to tools too. Every command now describes itself: `<command> --help --format json|md` prints its JSON tool definition or help Markdown, and `--export-tool-definitions` writes them for every installed command. The definitions are generated by the binary from its own usage text, so they always match the version and feature set you are running. Agents and pipelines get the same truth humans do.\r\n\r\n**And it's faster.** `frequency` is 1.5\u00d7 faster by default (2\u00d7 with `--weight`) with lower peak memory; `stats --infer-dates` is 1.43\u00d7 and `sniff` 1.81\u00d7 faster, after we removed regex lock contention in [qsv-dateparser](https://github.com/dathere/qsv-dateparser#qsv-dateparser) and [csv-nose](https://github.com/jqnatividad/csv-nose?tab=readme-ov-file#csv-nose). The un-indexed `count` regression we flagged in 23.0.1 is **fixed** ([#4603](https://github.com/dathere/qsv/issues/4603)): the row count is multithreaded again. `viz --geojson census:state` adds automatic US state boundaries (USPS codes, FIPS, or full state names), and new Linux ARM64 musl and Windows ARM64 GNU prebuilts round out the platforms.\r\n\r\nFrom the statistician's `.sav` file to the inventory entry on data.gov, qsv now carries the evidence *and* the metadata that makes it evidence. That metadata is what makes data FAIR, and [Findable, Accessible, Interoperable & Reusable (FAIR) Data](https://en.wikipedia.org/wiki/FAIR_data) is [AI-Ready Data](https://dathere.com/2025/09/fair-data-is-federated-ai-ready-data/): the same labels, codes and declared missing values that keep a statistician honest keep an AI agent from guessing. Evidence that is FAIR serves Humans, Agents and Machines alike, as we march towards **_Accelerated Civic Intelligence (ACI)_**.\r\n\r\n> [!IMPORTANT]\r\n> **The x86_64 prebuilts now require a CPU with AVX2** (`x86-64-v3`). Older Intel Pentium/Celeron/Atom parts and VMs with a conservative CPU model (`kvm64`/`qemu64`) will die with `Illegal instruction`, and **`qsv --update` would install a binary that cannot run, or update itself back.** Check with `grep -o avx2 /proc/cpuinfo | head -1` before updating. `qsvdp` and the aarch64, ppc64le and s390x prebuilts are unaffected. See Breaking Changes.\r\n>\r\n> In addition, [Profile Guided Optimization (PGO)](https://doc.rust-lang.org/rustc/profile-guided-optimization.html) did not work on Apple Silicon for this release (https://github.com/dathere/qsv/issues/4740), so the performance gains realized by improving `stats` & `frequency` algorithms will not be as much until PGO starts working again on Apple Silicon.\r\n\r\n### \ud83d\ude4f Contributors\r\n\r\nThanks to everyone who made 24.0.0 possible:\r\n\r\n- [@meop](https://github.com/meop) for the new Linux ARM64 musl ([#4721](https://github.com/dathere/qsv/pull/4721)) and Windows ARM64 GNU ([#4722](https://github.com/dathere/qsv/pull/4722)) prebuilts\r\n- [@dexhunter](https://github.com/dexhunter) (with Aiden of [Weco AI](https://weco.ai)) for frequency caches that survive temp-dir cleanup ([#4641](https://github.com/dathere/qsv/pull/4641))\r\n- @kulnor for his detailed guidance and feedback on the `readstat` and `writestat` commands - and overall - for his awesome advocacy for qsv\r\n- @benjaminbeuster and @ondohotola for chiming in on both\r\n- [@jrothbaum](https://github.com/jrothbaum) for the run of upstream [polars-readstat-rs](https://github.com/jrothbaum/polars_readstat) fixes behind this release's `readstat` work\r\n\r\n---\r\n\r\n**Detailed Changelog**: https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v24-changes\r\n\r\n**Full Commit log**: https://github.com/dathere/qsv/compare/23.0.1...24.0.0","mentions_count":3}
