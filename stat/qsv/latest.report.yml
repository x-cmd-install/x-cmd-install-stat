lication/octet-stream","state":"uploaded","size":97660,"digest":"sha256:0b59c703e8af04288d8239e1cb2dbc9810952f3643ad319b58750594695d724b","download_count":2,"created_at":"2026-09-13T12:01:06Z","updated_at":"2026-09-13T12:01:07Z"},{"id":561143951,"node_id":"RA_kwDOExnjV84hcmCP","name":"qsv-mcp-server-23.0.1.mcpb","label":null,"uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11129079,"digest":"sha256:bc7b227044acf33f05f3e4dfe8aa7d0ef67f973cb09e373b331c534b17a23e0d","download_count":2,"created_at":"2026-09-13T12:01:07Z","updated_at":"2026-09-13T12:01:10Z"}],"body":"## [23.0.1] - 2026-09-13 \ud83d\udc51 The \"Context is King\" Release \ud83e\udde0\r\n\r\n### Highlights\r\n\r\n270 commits since 22.0.1, and the theme is **CONTEXT** - the surrounding facts that turn a number into a finding. A count of 4,312 says nothing; 4,312 *per 100,000 residents* says where to look.\r\n\r\nThe headliner is the **Data Schematic's deep US Census integration**. A choropleth colored by raw counts is largely a population map - the big region wins because it is big. A choropleth colored by a *rate* is a finding ([example](https://dathere.github.io/qsv/smart_pa_crashes.html)).\r\n\r\nClosing that gap used to mean sourcing boundary files, sourcing population tables, joining both to your data and computing the rate by hand; `viz smart` now does all of it from nothing but a CSV. `--geojson auto` fetches US boundaries from the [US Census TIGERweb REST services](https://tigerweb.geo.census.gov/tigerwebmain/TIGERweb_restmapservice.html), `--denominator census` fetches the matching population denominators, and a `--locations` column of county *names* - not just [FIPS codes](https://www.census.gov/library/reference/code-lists/ansi.html) - resolves against the Census's own name table with nothing supplied but the CSV, while `--geocode` extends the same path to *city*-name columns. [Census Designated Places](https://en.wikipedia.org/wiki/Census-designated_place) make `census:place` the full place universe rather than incorporated places alone ([#4394](https://github.com/dathere/qsv/issues/4394), [#4395](https://github.com/dathere/qsv/issues/4395), [#4397](https://github.com/dathere/qsv/issues/4397), [#4417](https://github.com/dathere/qsv/issues/4417), [#4540](https://github.com/dathere/qsv/issues/4540)).\r\n\r\n`describegpt` closes the loop, which is what makes this more than a flag. It *derives* an `x-qsv.denominator` from a population column and declares the geography that denominator describes, so the [neuro-symbolic](https://en.wikipedia.org/wiki/Neuro-symbolic_AI) dictionary carries the denominator and `viz` charts the rate without the reader ever naming either. It also knows when **not** to: a denominator that is constant across regions, or one measured over a different geography than the region key, is refused rather than charted as a rescaled count ([example](https://dathere.github.io/qsv/gallery.html#fig-smart-data-schematic-denominator-aware-region-rate-real-counties)).\r\n\r\nAnd the human is not merely *in* the loop - the human stays **in control** (thanks Liz Tupper!).\r\n\r\nEverything above is an LLM **proposal**, and the artifact that actually drives a Data Schematic is the [editable JSON Schema data dictionary](https://github.com/dathere/qsv/blob/master/examples/viz/nyc311_dict.schema.json) sitting beside your CSV: an inferred dictionary is a *draft*, and the reviewed copy is the artifact of record. Domain experts fine-tune those inferences in a terminal UI - the [`visual-data-dictionary`](https://github.com/dathere/qsv/tree/master/.claude/skills/visual-data-dictionary) skill's `edit_dictionary.py` walks every column, edits the five fields that steer panel selection (`role`, `concept`, label, description, `aggregation`), and **previews how each edit reroutes the column before you render** (`--summary` prints the current routing non-interactively). The control is real but bounded, which is the point: qsv re-verifies every hint on read, so a hand-edit can correct the model where it guessed wrong, but **cannot assert a hint the data does not support** - a declared money measure on a zero-padded code column is refused, not drawn. Human judgment overrides the model; neither overrides the data.\r\n\r\nAlso new, and notable in its own right: **[`readstat`](https://github.com/dathere/qsv/blob/master/docs/help/readstat.md)** converts SAS (`.sas7bdat`, `.xpt`), Stata (`.dta`) and SPSS (`.sav`, `.zsav`, `.por`) files to CSV, so the decades of public-sector and academic data locked in proprietary statistical formats join the qsv pipeline without a licence ([#4542](https://github.com/dathere/qsv/issues/4542)).\r\n\r\nContext also means **units**. `describegpt` now proposes a per-field [UCUM](https://ucum.org/) `x-qsv.unit` and a first-class `measure.money` concept, and `viz` carries both into KPI tiles, panel subtitles, hover text and axis titles - so a Data Schematic says \"18.4 \u00b0C\" and \"$192B\" rather than a bare float and an SI \"G\".\r\n\r\nAnd because a reader cannot use context they never find, a Data Schematic now **opens with a guided Tour** - budgeted by `--tour-steps <n>` and followed by first-visit hint beacons on the affordances a newcomer has no reason to look for. The Tour is narrated by an LLM, and `--tour-audience` decides *who it is talking to*. It defaults to **\"Explain like I'm 10\"**, but the same dataset will happily brief `\"the mayor\"`, `\"the City Council\"`, `\"my 11th grade Civics class\"`, `\"my grandma\"` or `\"an urban planner\"` - one flag, and the numbers stay identical while the story around them is re-pitched. The audience shapes the tour prose **only**: field labels and descriptions keep their normal register, so re-pitching the narration never quietly rewrites the data dictionary. You can even have a non-English Tour narration with the `--language` option.\r\n\r\nIn the Age of AI - we compile all this context for Humans, Agents and Machines alike - as we march towards **_Accelerated Civic Intelligence (ACI)_** - using AI as a Tool towards Actionable Insights.\r\n\r\nUnderneath all of it: a sustained **correctness** sweep. A four-batch review of `stats.rs` fixed panics, undefined behavior, tempfile leaks, stats-cache validity and a cluster of outright wrong results; `count` stopped disagreeing with itself on files containing blank lines; and the auto-indexing machinery was rewritten to be race-free, atomic and permission-preserving - [**adding more than 500 tests in the process**](https://github.com/dathere/qsv/commit/a6e0e3d4932be5d61bab07c6ad59dd23f22f875f). Numbers you cannot trust are not context - they are noise.\r\n\r\n### \ud83d\udcca Performance\r\n\r\nThe [interactive benchmark Data Schematic](https://dathere.github.io/qsv/benchmarks/) and the [Benchmarks wiki page](https://github.com/dathere/qsv/wiki/Benchmarks) have been regenerated against the 23.0.1 run \u2014 277 benchmarks on a 1,000,000-row \u00d7 41-column, 520 MB slice of NYC 311 data. Same machine and same prebuilt-PGO build as the 22.0.1 run, so the release-over-release deltas are real rather than a change of hardware.\r\n\r\n\u26a1 **With an index, the flagship commands are the FASTEST they have ever been!** \ud83c\udfce\ufe0f \r\n\r\nOf the 22 measurable indexed variants across `stats`, `frequency`, `validate` and `moarstats`, **17 set all-time highs** in 23.0.1 \u2014 among them indexed `frequency` (1,992,032 recs/sec), indexed `stats --everything` (1,805,054) and every indexed `moarstats` bivariate variant. The standout is full JSON Schema `validate` with an index, which **more than doubled**: 657,030 \u2192 1,338,688 recs/sec, mean run time down from 1.52s to 0.75s (cc @Stranger6667 ).\r\n\r\n**However, there is a regression, and I would rather flag it than have you find it.** Un-indexed `count` is **~8.6x slower** than in 22.0.1 (9.0M \u2192 1.05M recs/sec), and the commands that need a row count without an index went with it \u2014 `sample_1000_systematic` (-58%), `frequency_selregex` (-53%), `extsort` (-47%), `split_chunks` (-41%), `searchset` (-39%) and `frequency` (-34%).\r\n\r\nIt is **not** the blank-line correctness fix, which is the obvious suspect since it landed in the same release. That fix only takes the slower csv-reader path when a file *may* contain a blank line, and on the benchmark file it never fires \u2014 forcing it is actually **faster** (0.35s vs 0.58s). The regression instead tracks this release's move of polars from crates.io `0.55.2` to the `py-1.44.2` git pin: `util::count_rows()` reaches polars **only when there is no index**, which is exactly the split the benchmarks show. Being chased down in [#4603](https://github.com/dathere/qsv/issues/4603).\r\n\r\n*With* an index, none of it applies \u2014 `count` reads a stored row count at ~100M recs/sec, ~96x the un-indexed scan, and every affected command takes the same shortcut. **SO ALWAYS CREATE INDICES!**\r\n\r\n**Detailed Changelog**: https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v23-changes\r\n\r\n**Full Commit log**: https://github.com/dathere/qsv/compare/22.0.1...23.0.1","mentions_count":1}
