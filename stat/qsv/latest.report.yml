t_type":"binary/octet-stream","state":"uploaded","size":362746885,"digest":"sha256:8c3f4f8ecb9ab8b471533455f672e2d6c7545c29366cf05b610273ccfea487e9","download_count":22,"created_at":"2026-10-14T20:34:05Z","updated_at":"2026-10-14T20:34:18Z"},{"id":641243408,"node_id":"RA_kwDOExnjV84mOJkQ","name":"qsv-25.0.0-x86_64-unknown-linux-musl.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":57800501,"digest":"sha256:8d04b7ce68bc839778a6daf203978168ae5ad23f22b62749c5063be6a84b4865","download_count":19,"created_at":"2026-10-14T18:20:25Z","updated_at":"2026-10-14T18:20:28Z"},{"id":641536826,"node_id":"RA_kwDOExnjV84mPRM6","name":"qsv-data-wrangling-25.0.0.plugin","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98025,"digest":"sha256:38188f6d2d1bbe1da1024ed9184f863e649fbc0c6f8588a01c901245a07f250f","download_count":2,"created_at":"2026-10-14T20:14:46Z","updated_at":"2026-10-14T20:14:46Z"},{"id":641536837,"node_id":"RA_kwDOExnjV84mPRNF","name":"qsv-mcp-server-25.0.0.mcpb","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11137045,"digest":"sha256:9c35eadf778308ab0ef3ed13ce2e873ff5a352982f426c6120e68ea503eea524","download_count":2,"created_at":"2026-10-14T20:14:46Z","updated_at":"2026-10-14T20:14:48Z"}],"body":"## [25.0.0] - 2026-10-14 \ud83c\udf10 The \"Spatiotemporal\" Release \u23f3\r\n\r\n~95 commits since 24.0.0, and the theme is **SPATIOTEMPORAL**: *where* and *when*. Our company's name, datHere, is short for \"data here\", because we've always known that location and time are the universal join keys (and future clients can demand _\"I want that here!\"_ :smile:). A 311 complaint, a property tax roll, a building permit and a Census table share no column, yet each record happened somewhere, at some time. Pin down the where and the when, and datasets that seemed unrelated line up.\r\n\r\n**WHERE.** Two new geocoders, both built on authoritative government sources, turn addresses into the geographies public data is keyed by:\r\n\r\n- [`geocode census`](https://github.com/dathere/qsv/blob/master/docs/help/geocode.md) uses the free [US Census Geocoder](https://geocoding.geo.census.gov/geocoder/), no API key needed. Beyond coordinates, it returns the Census geographies each address falls in, with their GEOIDs (state, county, tract, block group, block, places, congressional and legislative districts, ZCTAs and more): the keys for joining Census statistics. Large files go through Census's batch endpoints, 2,000 rows per upload.  <br>  \r\n**Be kind to the Census Geocoder.** It is a free public service with no API key, so it has no per-user quota to protect it either: Census publishes no rate limit, caps batch uploads at 10,000 rows, and can throttle or block heavy or shared-IP users. We'd like it to stay free, so `geocode census` is deliberately polite. It keeps a persistent on-disk result cache, de-duplicates lookups, sends only uncached rows in a batch, paces single lookups at 5 requests/second, and backs off and gives up rather than hammering a struggling server. For teams and pipelines, we also built [**ucgeocoder**](https://github.com/dathere/uscensus-caching-geocoder), a caching, rate-limited proxy that speaks the Census API unchanged. Set `QSV_CENSUS_GEOCODER_URL=http://<host>:8080/geocoder` and every qsv user, script or R/Python client behind it shares one cache, so an address is fetched from Census once rather than once per person and per run. Upstream, a deployment sends at most 5 single-record requests/second and one batch upload at a time, with a circuit breaker. It keeps answering from its cache when Census is slow or down, and it can warm the cache with resumable background jobs. You get faster repeat runs, and Census gets less load.\r\n- `geocode geoclient` uses NYC's [Geoclient](https://github.com/mlipper/geoclient) API over the Department of City Planning's Geosupport, returning BBL, BIN, community and council districts, police precincts, school districts, NTAs and census tracts. A search that matches in more than one borough is **not** silently given the first one, and when Geosupport rejects a location, its reason is available in `_reject.*` columns (or `geoclientnow`'s JSON).  We started our entrepreneurial journey 15 years ago after winning [NYCBigApps 3.0](https://nycbigapps2011.devpost.com/) - that's why NYC is near and dear to our hearts. We \u2764\ufe0f NYC!\r\n\r\n**WHEN.** A geography is a join key only for a point in time. Tract boundaries are redrawn after every decennial census, and Connecticut's nine planning regions have replaced its eight counties in Census geography, so the same address can carry different GEOIDs in a 2019 table and a 2024 one. `geocode census` lets you choose the moment: `--vintage` picks the geography release (`Current_Current` by default, `Census2020_Current` for the 2020 Census's, `ACS2026_Current` for the American Community Survey's) and `--benchmark` the address-range release. Match a dataset's vintage and its GEOIDs join; miss it and they quietly don't. qsv even looks Connecticut batch matches up again one by one, because batch results carry only the 2020 county.\r\n\r\nTime gets its due elsewhere too. `schema --polars` and `sqlp --cache-schema` no longer write schemas in which Polars reads `04/05/2019` as 4 May while qsv reads it as April 5; `writestat` recognises dates and times the way Polars does, without minutes of type inference; and `viz smart --smarter` notes when a measure drifts in file order.\r\n\r\n**The Geonames geocoder got a review.** A county-FIPS bug that dropped the first digit of codes 100 and up is fixed, missing translations no longer print blank names, `index-update` rebuilds in-process and keeps the index's city set and languages, concurrent first runs no longer collide downloading the index, old releases' indexes are pruned from the cache, and the command now scales across cores (up to 2.8\u00d7 faster with 12 jobs). [geosuggest](https://github.com/estin/geosuggest) 0.9.0 also shrinks the default index by about a third.\r\n\r\n**And the rest of the geo pipeline.** `geoconvert` now streams CSV input (857 MB \u2192 28 MB peak on a 500k-row file), skips rows it can't place instead of writing invalid GeoJSON, and no longer panics on shapefiles. `viz --geocode` no longer maps a place name to a bigger city whose alternate name starts with it.\r\n\r\nElsewhere: **Polars 2.0** (with `sqlp` semantics changes worth reading before upgrading, plus `generate_series()`/`range()` and named `read_csv()` options), **MiniJinja 3.0** (`template` ~1.6\u00d7 faster, with some output changes), and `QSV_ERROR_FORMAT=json` + `qsv --capabilities` for programs that run qsv as a subprocess.\r\n\r\n**qsv MCP Server and Cowork plugin 25.0.0:** the qsv MCP Server is a standard MCP server, so it works with MCP-capable AI assistants beyond Claude. For example, [Gemini CLI](https://github.com/dathere/qsv/blob/master/.claude/skills/docs/guides/GEMINI_CLI.md) has its own setup guide. Both it and the Claude Cowork plugin are updated to 25.0.0 and need qsv 25.0.0. The `qsv-geocode` skill now covers the new `census` and `geoclient` geocoders, and `qsv-sqlp` adds examples for `read_csv()` options and `generate_series()`/`range()`. For Claude Desktop, double-click the attached `qsv-mcp-server-25.0.0.mcpb`. For Cowork, install the plugin from the `dathere/qsv` marketplace, or use the attached `qsv-data-wrangling-25.0.0.plugin`. Other clients, including Claude Code and Gemini CLI, run the server from source. See the [Getting Started guide](https://github.com/dathere/qsv/blob/master/.claude/skills/docs/guides/START_HERE.md) and the [MCP changelog](https://github.com/dathere/qsv/blob/master/.claude/skills/CHANGELOG.md).\r\n\r\nData here, data now: with the where and the when resolved, the join is the easy part.\r\n\r\n### \ud83d\ude4f Contributors\r\n\r\nThanks to everyone who made 25.0.0 possible:\r\n\r\n- [@AMDmi3](https://github.com/AMDmi3) for fixing the README's Repology URLs (and for creating and maintaining [Repology](https://repology.org/)!) ([#4761](https://github.com/dathere/qsv/pull/4761))\r\n\r\n---\r\n\r\n**Detailed Changelog**: https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v25-changes\r\n\r\n**Full Commit log**: https://github.com/dathere/qsv/compare/24.0.0...25.0.0\r\n\r\n"}
