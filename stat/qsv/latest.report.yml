,"content_type":"binary/octet-stream","state":"uploaded","size":424600707,"digest":"sha256:53f5792a780dc99553dc6af420447c5e7e34872f3ba74a148d901e305475d94f","download_count":982,"created_at":"2026-11-02T08:28:36Z","updated_at":"2026-11-02T08:28:47Z"},{"id":700542161,"node_id":"RA_kwDOExnjV84pwWzR","name":"qsv-28.0.0-x86_64-unknown-linux-musl.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":57900743,"digest":"sha256:66619384e9bf9585a4cac7b800690ebfd006ae3ae4f515c4f7c326fb4dab0c43","download_count":280,"created_at":"2026-11-02T04:44:43Z","updated_at":"2026-11-02T04:44:46Z"},{"id":701282339,"node_id":"RA_kwDOExnjV84pzLgj","name":"qsv-data-wrangling-28.0.0.plugin","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98025,"digest":"sha256:e23056d7c960094c44da146ce6b9444f9e5da1cee858d6cf19ddbeb4e3daa185","download_count":4,"created_at":"2026-11-02T09:57:39Z","updated_at":"2026-11-02T09:57:39Z"},{"id":701282342,"node_id":"RA_kwDOExnjV84pzLgm","name":"qsv-mcp-server-28.0.0.mcpb","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11442806,"digest":"sha256:f070698445cd578a0b2b08b83afcc0b85ad6e3e6a701f9cfbc52fc912f01dd16","download_count":8,"created_at":"2026-11-02T09:57:39Z","updated_at":"2026-11-02T09:57:40Z"}],"body":"## [28.0.0] - 2026-11-01 🧠 The \"DCAT-US v3.0 neuro-symbolic F-AI-Rification\" Release 🏛️\r\n\r\n### Highlights\r\n\r\n~58 commits since 27.0.1, and the banner feature is **`profile` writing much more of a [DCAT-US v3.0](https://resources.data.gov/resources/dcat-us3/) record for you**, the metadata standard US Government is moving to as part of the [Evidence Act](https://datafoundation.org/news/evidence-act-hub/772/772-Foundations-for-Evidence-Based-Policymaking-Act-of-2018-A-Primer), and subsequently, the [Genesis Mission](https://en.wikipedia.org/wiki/Genesis_Mission) - as it turns out [FAIR data is indeed](https://dathere.com/2025/09/fair-data-is-federated-ai-ready-data/) [AI-Ready Data](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5164337) for it's the **_perfect context for AI_** - it's token-efficient;  describes very large datasets efficiently; and makes for faster inferencing.\r\n\r\nqsv is a [neuro-symbolic](https://en.wikipedia.org/wiki/Neuro-symbolic_AI) [FAIRification](https://www.go-fair.org/fair-principles/fairification-process/) engine, and this release puts both halves to work on the same record:\r\n\r\n- **Symbolic: properties measured from the data.** `profile` computes what is tedious and error-prone to write by hand from the stats and frequency it already runs, plus a SQL pass over the file: `temporalResolution` as an exact duration, `accrualPeriodicity` only when the dates really are a regular series, a `spatial` bounding box that drops out-of-range and \"null island\" rows, the dataset's `language`, DQV quality measurements, and CSVW column constraints and a primary key. `--locate` names the places a dataset covers, from the offline GeoNames index or the US Census Geocoder, and a WKT `POINT` column now counts as coordinates.\r\n- **Neural: metadata an LLM proposes, checked before it is used.** `--describegpt` or `--infer` adds a `describegpt` description, tags and data dictionary. Tags can be held to a controlled vocabulary, dictionary entries must name real columns, and a generated description says so in the description itself.\r\n\r\nEvery value records where it came from: values the publisher supplies win over inferred ones, and values measured from the file win over everything discovered. A new `projection_provenance` block lists which tier each value came from, and `llm_attribution` keeps the LLM run's command line, API URL and timestamp out of the published record. See the [DCAT-US v3](https://github.com/dathere/qsv/wiki/DCAT-US-v3) and [Metadata Profiling](https://github.com/dathere/qsv/wiki/Metadata-Profiling) wiki pages.\r\n\r\nAlso in this release:\r\n\r\n- **`describegpt`'s answer cache works as documented.** `--fresh`, `--forget` and multi-phase JSON/TOON runs all hit, replace or remove the entries they should, on disk and on Redis.\r\n- **Data Schematics size themselves when embedded.** A framed `viz smart` page reports its height to the host page, so CKAN can fit the iframe without injecting a script, and a map in a sandboxed iframe explains why it is blank.\r\n- **Benchmarks on hyperfine 2.0**, with peak memory recorded, suspect results quarantined, and new `geocode geoclient` benchmarks.\r\n- **Least-privilege CI.** Every workflow declares the `GITHUB_TOKEN` permissions it needs, and third-party actions are pinned to commit SHAs.\r\n\r\nRead **[Breaking Changes](https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v28-breaking-changes)** before upgrading if you consume `profile`'s DCAT-US v3 output: two of its properties changed shape.\r\n\r\n### 🙏 Contributors\r\n\r\nThanks to everyone who made 28.0.0 possible:\r\n\r\n- [@jaemk](https://github.com/jaemk) for adding `RedbCache::scan_stats()` to [`cached`](https://github.com/jaemk/cached) 4.1 at our request ([jaemk/cached#336](https://github.com/jaemk/cached/issues/336), [jaemk/cached#337](https://github.com/jaemk/cached/pull/337)), which `geocode cache-info` now uses to count entries\r\n\r\n---\r\n\r\n**Detailed Changelog**: https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v28-changes\r\n\r\n**Full Commit log**: https://github.com/dathere/qsv/compare/27.0.1...28.0.0\r\n"}
