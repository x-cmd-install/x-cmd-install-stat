t_type":"binary/octet-stream","state":"uploaded","size":423494010,"digest":"sha256:3d236cf926045070899b4e21e8bb7dc360e8c0f2aaa9a663ab38e2b5af2b128b","download_count":75,"created_at":"2026-10-27T15:15:56Z","updated_at":"2026-10-27T15:16:09Z"},{"id":681603391,"node_id":"RA_kwDOExnjV84ooHE_","name":"qsv-27.0.1-x86_64-unknown-linux-musl.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":57754023,"digest":"sha256:e331e8b8fb41df3782e9e734d52793a4fb6ac2e36251289d83d9e3add66e9ec0","download_count":47,"created_at":"2026-10-27T12:57:12Z","updated_at":"2026-10-27T12:57:15Z"},{"id":682308398,"node_id":"RA_kwDOExnjV84oqzMu","name":"qsv-data-wrangling-27.0.1.plugin","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98025,"digest":"sha256:4b92967fdc87dcd1da2b3b557b38731c4769486910a5e4b4bed73cf16b3a0c59","download_count":1,"created_at":"2026-10-27T17:20:14Z","updated_at":"2026-10-27T17:20:15Z"},{"id":682308401,"node_id":"RA_kwDOExnjV84oqzMx","name":"qsv-mcp-server-27.0.1.mcpb","label":"","uploader":{"login":"jqnatividad","id":1980690,"node_id":"MDQ6VXNlcjE5ODA2OTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11140166,"digest":"sha256:3c97433be9b8e47e930031b6b19992e5566b238425af9e500bfdfafb237b1697","download_count":2,"created_at":"2026-10-27T17:20:14Z","updated_at":"2026-10-27T17:20:18Z"}],"body":"## [27.0.1] - 2026-10-27 📡 The \"Live Data Schematics\" Release 📊\r\n\r\n<p align=\"center\">\r\n<img width=\"1120\" height=\"892\" alt=\"qsv-27 0 1-live-data-schematics-light-tray\" src=\"https://github.com/user-attachments/assets/2d417b52-6174-4f16-b44a-2795494cee95\" />\r\n</p>\r\n\r\n### Highlights\r\n\r\n~119 commits since 26.0.0, and the banner feature is **Live Data Schematics**.\r\n\r\nUntil now, a [Data Schematic](https://dathere.com/2026/08/data-schematic-a-neuro-symbolic-visual-story-telling-data-explorer-dictionary/) was a snapshot: a self-contained HTML page describing the data as it was when `viz smart` rendered it. A question the page didn't anticipate sent you back to the terminal, and new data meant rendering it again.\r\n\r\nIn 27.0.1, a schematic can stay connected to its data. Open it from disk with [qsv-clientd](https://github.com/dathere/qsv-client#the-qsv-clientd-daemon) running, approve a one-time pairing code in your shell, and the page itself can drill into the rows behind a frequency bar, refresh its stats, fetch the latest copy of the data, re-render itself and run read-only queries, with results of any size paged from the daemon. Results of up to 10,000 rows get the data viewer's Advanced Filter and an Export CSV button. qsv-clientd is a small, optional per-user daemon from [qsv-client](https://github.com/dathere/qsv-client); without it, schematics work exactly as before. The bridge stays inert unless the page was opened from disk or is served from loopback, so a schematic published on the web never contacts its viewers' machines.\r\n\r\nPublic [CKAN](https://ckan.org) data is one command away: with [qsv-client 0.6.0](https://github.com/dathere/qsv-client/releases/tag/0.6.0) or later, point `qsv-clientd viz` at any public CKAN resource or dataset page (or a `ckan://` id) to get a live schematic of it. qsv-clientd remembers where the data came from, so Fetch latest gets the current version.\r\n\r\nAlso in this release:\r\n\r\n- **Polars 2.1.0, streamed.** `sqlp --streaming` and `joinp --streaming` now write results batch by batch, Polars' query optimizations apply again, and `pivotp` handles wide pivots with a fraction of the memory. `sqlp` gains recursive CTEs, and has one breaking change: a `FROM` subquery alias can no longer be read as a table.\r\n- **A correctness sweep across `validate`, `stats`, `frequency`, `schema`, `viz` and `writestat`.** `validate` now reads piped stdin, follows local `$ref`s, honors every `type` in a type array and fixes `dynamicEnum` on numeric and nullable columns; `stats` fixes weighted quantiles and modes; `frequency` stops collapsing columns to `<ALL_UNIQUE>` when it shouldn't; `writestat` no longer writes wrong data to SPSS portable files, or numbers too large for SAS transport files as missing values.\r\n- **Inputs read as written.** Compressed CSVs are decompressed byte-for-byte (leading zeros and `1.50` survive), and `QSV_SNIFF_PREAMBLE` now actually skips the title lines it finds.\r\n- **`get` ships in the prebuilt `qsv` binaries**, so `dc:` inputs work out of the box.\r\n- **Private caches on shared machines.** The `get` cache and the `dc:` copies other commands read are now readable by you only, and so is every file `stats` writes beside a private CSV. Before, other local users could read data `qsv get` had fetched, including private CKAN resources fetched with an API token.\r\n\r\nRead **Breaking Changes** before upgrading: `sqlp` subquery aliases, three `validate` schema behaviors, and `QSV_SNIFF_PREAMBLE`. `--low-memory` is gone from `sqlp`, `joinp` and `count`. The two security fixes at the top of **Fixed** also change behavior: a `get` cache shared with a group on purpose becomes owner-only, and `dc:` inputs stop with an error if another user has taken their temp folder.\r\n\r\n### Breaking Changes\r\n- **`sqlp`: the alias of a subquery in `FROM` can no longer be read as a table** ([#4907](https://github.com/dathere/qsv/pull/4907), Polars [#30207](https://github.com/pola-rs/polars/pull/30207)). Some queries that worked in qsv 26.0.0 now fail with `relation '<alias>' was not found`. The alias still qualifies the subquery's columns (`a.x`). Reading it as a table, whether in another subquery or in a later `FROM` item, now fails:\r\n  ```sql\r\n  -- now fails: `a` is read as a table in the IN subquery\r\n  SELECT a.x FROM (SELECT * FROM t WHERE g = 1) AS a WHERE a.x IN (SELECT x FROM a)\r\n  -- now fails: `a` is read as a table in a later FROM item\r\n  SELECT * FROM (SELECT g FROM t) AS a, a AS b\r\n  ```\r\n  **To fix a query, move the subquery into a `WITH` clause** (a CTE), which still works and returns the same rows as before:\r\n  ```sql\r\n  WITH a AS (SELECT * FROM t WHERE g = 1) SELECT a.x FROM a WHERE a.x IN (SELECT x FROM a)\r\n  WITH a AS (SELECT g FROM t) SELECT * FROM a, a AS b\r\n  ```\r\n  In a `.sql` script, `CREATE TABLE a AS SELECT ...` also keeps a result for later statements. This also fixes queries where the alias hid a loaded table of the same name: in `SELECT x FROM (SELECT g AS x FROM u) AS t WHERE x IN (SELECT g FROM t)`, the inner `t` now reads the `t` input file, as in DuckDB and PostgreSQL, instead of failing.\r\n\r\n- **`validate`: some schemas give different results** ([#4911](https://github.com/dathere/qsv/pull/4911), [#4913](https://github.com/dathere/qsv/pull/4913)). Most of the `validate` fixes below only stop valid data being flagged. Three of them change results that schemas may rely on today:\r\n  - **Stricter: numeric text in a column that also allows strings is read as a number.** For a column typed `[\"integer\", \"string\"]` (in either order) with `\"minimum\": 0`, the cell `-3` used to be read as a string, so `minimum` was skipped and the row passed. It is now read as a number and fails. Text that doesn't parse as a number is still read as a string.\r\n  - **Looser: `dynamicEnum` no longer rejects empty cells.** In a column whose `type` allows null (e.g. `[\"string\", \"null\"]`), an empty cell that `dynamicEnum` used to reject now passes, because no reference file can list null. To keep rejecting empty cells, remove `\"null\"` from the column's `type`.\r\n  - **Stricter: `uniqueCombinedWith` must name columns the CSV has.** A column name missing from the header (a typo, or a column only some files have) used to be skipped silently, so uniqueness was checked on fewer columns. Now the schema fails to compile (`'uniqueCombinedWith' column \"x\" is not in the CSV header`) and no rows are validated. The same goes for a column index past the last column, and for an index whose header name a later column repeats. A schema shared across files with different columns needs a `uniqueCombinedWith` that fits each file.\r\n\r\n- **`QSV_SNIFF_PREAMBLE` now skips the preamble rows it finds, so commands can return fewer rows and a different header** ([#4916](https://github.com/dathere/qsv/pull/4916)). It used to sniff the number of rows above the header and then ignore it (only `input --auto-skip` used it), so a title line above the header was read as the header. Now every command reads from the header, including `count`, `stats`, `input`, the Polars-based commands (`sqlp`, `joinp`, `pivotp`, `to parquet`, `writestat`) and the DuckDB queries of `scoresql --duckdb` and `describegpt`. A file with a preamble is read without its index, and `qsv index` still indexes the file as stored. Stats caches and Polars schemas are kept apart for the two modes, so turning the env var on or off never reuses one built the other way (a schema of the rows past an N-line preamble is `<file>.skip<N>.pschema.json`). `QSV_SNIFF_DELIMITER` alone now only sniffs the delimiter. Not covered: stdin and Polars SQL's `read_csv()` table function. **If you set `QSV_SNIFF_PREAMBLE`, check your results:** unset it to keep the old behavior, or use `input --skip-lines` to control the skip yourself.\r\n\r\n### 🙏 Contributors\r\n\r\nThanks to everyone who made 27.0.1 possible:\r\n\r\n- [@slonyik](https://github.com/slonyik) for reporting, with a clear repro, that `json` left a copy of the converted data in the system temp directory ([#4924](https://github.com/dathere/qsv/issues/4924), fixed in [#4925](https://github.com/dathere/qsv/pull/4925))\r\n\r\n---\r\n\r\n**Detailed Changelog**: https://github.com/dathere/qsv/blob/master/CHANGELOG.md#v27-changes\r\n\r\n**Full Commit log**: https://github.com/dathere/qsv/compare/26.0.0...27.0.1"}
