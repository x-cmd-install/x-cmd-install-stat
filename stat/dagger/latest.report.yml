664013769,"node_id":"RA_kwDODUgI1s4nlAvJ","name":"dagger_v0.21.11_windows_arm64.zip","label":"","uploader":{"login":"dagger-ci","id":83475260,"node_id":"MDQ6VXNlcjgzNDc1MjYw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20622184,"digest":"sha256:7fa128034bc1bb24eecac9caeeb400b61e0939d1b9a8aecc295a2e34e73434d7","download_count":4,"created_at":"2026-10-21T22:50:24Z","updated_at":"2026-10-21T22:50:25Z"}],"body":"## v0.21.11 - 2026-10-21\n\n### Fixed\n- Fix Go module codegen failing with `import cycle not allowed` in OpenTelemetry packages by @sipsma in https://github.com/dagger/dagger/pull/14646 \\\n  Generated modules now pin `github.com/dagger/otel-go` and `go.opentelemetry.io/otel/sdk`\n  instead of resolving them to their latest versions, which pulled\n  `go.opentelemetry.io/otel` v1.47.0 into a cycle with the pinned `otel/log` v0.16.0.\n- Fix engine memory growth from schema servers retained after their sessions end by @sipsma in https://github.com/dagger/dagger/pull/14756 \\\n  Cached results, types, module resolvers and module dependency schemas no longer keep\n  session schema servers alive, so long-running engines stop accumulating heap until OOM-killed.\n\n### What to do next?\n- Read the [documentation](https://docs.dagger.io)\n- Join our [Discord server](https://discord.gg/dagger-io)\n- Follow us on [Twitter](https://twitter.com/dagger_io)\n\n","mentions_count":1}
