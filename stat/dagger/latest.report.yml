Z"},{"id":760665347,"node_id":"RA_kwDODUgI1s4tVtUD","name":"dagger_v0.21.12_windows_arm64.zip","label":"","uploader":{"login":"dagger-ci","id":83475260,"node_id":"MDQ6VXNlcjgzNDc1MjYw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20624333,"digest":"sha256:49529c0eab434ea46c2ca8321cfd9686b26ac3abc19ced995141866fdecb7cab","download_count":72,"created_at":"2026-11-17T21:16:48Z","updated_at":"2026-11-17T21:16:49Z"}],"body":"## v0.21.12 - 2026-11-17\n\n### Fixed\n- Fix Dockerfile `COPY` reading the whole image and keeping a hash record of it in engine memory by @sipsma in https://github.com/dagger/dagger/pull/15040 \\\n  A plain `COPY` is now keyed on its parent, its arguments and the content of its sources,\n  as BuildKit does, and a `COPY --from` of a single file no longer records the source stage's\n  whole filesystem. Engines running many Dockerfile builds no longer grow until OOM-killed.\n- Fix gracefully stopped services being force-killed when a binding detaches during shutdown by @sipsma in https://github.com/dagger/dagger/pull/15069 \\\n  A detach of a service that is already stopping is now a no-op, and a graceful stop joins one\n  already in flight instead of sending another SIGTERM followed by a SIGKILL 10s later.\n- Fix execs escaping the engine pod's CPU and memory limits under Kubernetes by @sipsma in https://github.com/dagger/dagger/pull/15096 \\\n  The engine now runs in its own cgroup namespace rooted at its container's cgroup, so execs\n  nest under the pod's limits as they do under Docker. An exec that exceeds the memory limit\n  is OOM-killed on its own and the engine keeps running.\n- Fix setting `GitRepository` and `GitRef` arguments from `.env` user defaults by @marcosnils in https://github.com/dagger/dagger/pull/15155 \\\n  These failed with `Address has no such field: \"gitrepository\"` while the same value passed\n  as a flag worked.\n\n### What to do next?\n- Read the [documentation](https://docs.dagger.io)\n- Join our [Discord server](https://discord.gg/dagger-io)\n- Follow us on [Twitter](https://twitter.com/dagger_io)\n\n","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":2}
