":530870103,"node_id":"RA_kwDODUgI1s4fpG9X","name":"dagger_v0.21.9_windows_arm64.zip","label":"","uploader":{"login":"dagger-ci","id":83475260,"node_id":"MDQ6VXNlcjgzNDc1MjYw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20363401,"digest":"sha256:59fc291356b956b3339c4155692034ba2f4047e29404d46d2ac12de1627443ef","download_count":8,"created_at":"2026-08-26T13:45:56Z","updated_at":"2026-08-26T13:45:57Z"}],"body":"## v0.21.9 - 2026-08-25\n\n### Added\n- Added SSHFS-backed volumes, allowing remote filesystems to be mounted into containers without copying their contents into Dagger's content store by @sipsma in https://github.com/dagger/dagger/pull/13462\n\n### Fixed\n- `Container.withDirectory` and `Directory.withDirectory` no longer restore by @sipsma in https://github.com/dagger/dagger/pull/13848 \\\n  deleted nested files after execs remove and recreate an ancestor\n  directory.\n- Engine client enumeration no longer blocks behind another session's by @sipsma in https://github.com/dagger/dagger/pull/13542 \\\n  initialization or teardown, preventing Cloud keeper heartbeats from stalling\n  and live engines from being suspended.\n- Session teardown now runs in the background after the main client disconnects, by @sipsma in https://github.com/dagger/dagger/pull/13681 \\\n  preventing shutdown responses from timing out while the engine releases\n  session-owned cache results.\n- The engine now bounds retained DAGQL cache metadata independently of disk by @sipsma in https://github.com/dagger/dagger/pull/13846 \\\n  usage by pruning cold persisted results when the structural estimate exceeds\n  its configured limit. This may mitigate metadata growth at scale while\n  preserving active and engine-lifetime cache roots.\n- Registry protocol probes no longer appear as scary errors in progress output by @vito in https://github.com/dagger/dagger/pull/13410 \\\n  when image pulls or publishes succeed, while genuine registry failures remain\n  visible.\n- Registry authentication no longer invalidates downstream container cache reuse across sessions when applied before or after `Container.from` by @sipsma in https://github.com/dagger/dagger/pull/13901\n\n### What to do next?\n- Read the [documentation](https://docs.dagger.io)\n- Join our [Discord server](https://discord.gg/dagger-io)\n- Follow us on [Twitter](https://twitter.com/dagger_io)\n\n","mentions_count":2}
