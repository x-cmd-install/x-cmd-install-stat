{"id":372733581,"author":{"login":"sooperset","id":32061883,"node_id":"MDQ6VXNlcjMyMDYxODgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDONYN7OM4WN3aN","tag_name":"v0.23.1","target_commitish":"main","name":"v0.23.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-19T00:38:05Z","updated_at":"2026-08-19T00:38:15Z","published_at":"2026-08-19T00:38:15Z","assets":[],"body":"Maintenance release cut from `v0.23.0`. It contains exactly two fixes \u2014 a security patch and a dependency compatibility pin \u2014 and none of the ongoing `v0.24.0` development on `main`.\n\n## \ud83d\udd12 Security\n\n- **SSE transport authentication boundary** (GHSA-5j8j-256g-vvp5): the `/sse` and `/messages` endpoints of `--transport sse` now enforce the same per-request authentication as the streamable-HTTP transport. Full details in the security advisory published alongside this release. Upgrading is strongly recommended for anyone running the SSE transport.\n\n## \ud83d\udc1b Fixed\n\n### Confluence\n\n- **Pin `atlassian-python-api` below v5** ([#1585](https://github.com/sooperset/mcp-atlassian/issues/1585), [#1589](https://github.com/sooperset/mcp-atlassian/pull/1589)): `atlassian-python-api` 5.0 removed core Confluence Cloud methods (`get_page_by_id`, `create_page`, `update_page`), so fresh installs that resolved the new major failed with `AttributeError` on basic page operations. The dependency is now bounded to `>=4.0.0,<5.0.0` and a regression test guards the contract. Thanks @breezeFur for the fix and @mihnatova for the detailed report.\n\n## Contributors\n\nThanks to @breezeFur for the dependency fix and @mihnatova for the report that pinpointed #1585.\n\n**Full Changelog**: https://github.com/sooperset/mcp-atlassian/compare/v0.23.0...v0.23.1\n","mentions_count":2}
