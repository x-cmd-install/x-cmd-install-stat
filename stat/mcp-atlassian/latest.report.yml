{"id":454896295,"author":{"login":"sooperset","id":32061883,"node_id":"MDQ6VXNlcjMyMDYxODgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDONYN7OM4bHSqn","tag_name":"v0.24.8","target_commitish":"29518e3a438c1f92ad71bd78e7f02bdd0d3ee06c","name":"v0.24.8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-23T01:40:52Z","updated_at":"2026-11-23T01:41:07Z","published_at":"2026-11-23T01:41:07Z","assets":[],"body":"## 🔒 Security\n\n- GHSA-68x4-2r5j-m2jr: The Confluence comment tools sent a body that started with `<` to Confluence as raw storage format, although the parameter was documented as Markdown.\n- GHSA-v49j-6r3q-mm6w: With PAC/WPAD proxy support turned on, Jira and Confluence sessions lost the dot-segment request guard added in v0.24.5.\n- GHSA-ghv2-fwfq-923p: Callers of the HTTP transport could use up the server's shared worker threads, request limits or memory from one site and slow every other caller.\n- GHSA-6567-g8vf-xq69: Crafted Markdown, wiki markup or ADF could keep a Confluence or Jira conversion busy for a time that grows faster than the input.\n- GHSA-rw8f-cvm7-4j63: Since v0.24.7, Confluence Markdown with many unpaired `~` or `^` could take a time that grows with the square of its length.\n- GHSA-45jx-jvrm-qvm2: Some paths still let a caller learn about or reach issues outside `JIRA_PROJECTS_FILTER`.\n- GHSA-6g2v-78xr-8523: Transport sessions were not bound to the caller's credential, and the OAuth proxy kept unbounded login state.\n- GHSA-254j-6q43-w4c8: `JIRA_SSL_VERIFY=false` or `CONFLUENCE_SSL_VERIFY=false` also turned off certificate checks for header-PAT requests to the other service's origin.\n\n## 🐛 Bug Fixes\n\n### Server and transport\n\n- **Each upstream trust level now has its own worker threads.** Sites the operator trusts (`JIRA_URL`, `CONFLUENCE_URL`, `MCP_ALLOWED_URL_DOMAINS`, Atlassian Cloud on port 443) use one pool, and `JIRA_URL` and `CONFLUENCE_URL` keep reserved slots in it. Sites that arrive only in an `X-Atlassian-*-Url` header share a small pool, and each such call stops after a deadline. A cancelled or overdue call shuts down its open sockets, so its thread returns promptly.\n- **URL header checks have their own small thread pools and a deadline.** When the pool is full, the server answers 503 with `Retry-After`. An unsupported `Authorization` scheme is rejected before any DNS lookup.\n- **Response bodies are limited after decompression.** Non-streamed responses stop at `ATLASSIAN_MAX_RESPONSE_BYTES` (default 64 MiB), including retried 429, 502, 503 and 504 answers. A too-large response is reported as such, not as a network error. Streamed attachment downloads are not affected.\n- **The circuit breaker counts per site and credential.** One user's 429 or 503 answers no longer open the breaker for other users of the same site.\n\n### Authentication\n\n- **Transport sessions belong to the credential that opened them.** Another credential gets `404 Session not found`. With the built-in OAuth proxy the session follows the OAuth grant, so a token refresh keeps it.\n- **A token whose OAuth grant cannot be read again is rejected (401)** instead of being processed under a different identity.\n- **The OAuth proxy bounds what an unauthenticated caller can make it store.** `/authorize` refuses `state` or `redirect_uri` over 2048 characters, a `code_challenge` outside 43 to 128 characters, and bodies over 16 KiB. Client registrations that never complete a login expire after 24 hours, and expired files are cleaned up.\n\n### Jira\n\n- **`JIRA_PROJECTS_FILTER` now also covers:**\n  - JQL that names an issue of another project, or an issue ID, by key, ID, parent, Epic Link or Parent Link, or as the issue argument of `linkedIssues` and similar functions. Such a query is refused.\n  - Rendered issue links and reference custom fields in tool output. A link to an issue that is not confirmed in scope becomes its plain text.\n  - `jira_get_queue_issues`, which now drops issues outside the allowlist and no longer returns the queue's total and JQL.\n  - `jira_edit_comment`, which now checks that the comment belongs to the given issue.\n- **Allowlist denials name only the identifier the caller passed**, not the resolved project, issue or space key.\n- **Markdown to Jira Cloud and Jira wiki to Markdown run in linear time.** This covers unclosed code fences, unclosed link and mention brackets, and deeply nested HTML.\n\n### Confluence\n\n- **Comment tools take the body format from `content_format`.** `confluence_add_comment`, `confluence_reply_to_comment` and `confluence_add_inline_comment` accept `content_format`: `markdown` (default, always converted) or `storage` (sent as is). The body is no longer sniffed by its first character.\n- **Markdown writes finish in time that grows with the length of the page.** The fixed paths include link brackets, attachment images and task lists, the md2conf element walk, raw HTML blocks, block splits, deep indentation, footnotes, mail addresses and the `~`, `^`, `=` delimiters. Each conversion has work limits proportional to its length. Normal pages stay within these limits.\n- **User mention lookups are limited per tool call.** One Confluence tool call looks up at most 100 distinct mentioned users across all the documents it converts. Mentions past that show the stored identifier.\n- **ADF to text no longer recurses.** Deeply nested ADF, expand and panel blocks are read with an explicit stack.\n\n## ⚠️ Behaviour changes\n\n- A Confluence comment body that starts with `<` is now converted as Markdown. Pass `content_format=\"storage\"` to send storage format.\n- A streamable-http or SSE session can be used only with the credential that opened it. When a header Bearer token changes, the client gets 404 and must open a new session.\n- Calls to a host named only in an `X-Atlassian-*-Url` header share 8 worker threads and stop after 120 seconds. Add such self-hosted domains to `MCP_ALLOWED_URL_DOMAINS` to lift this.\n- `ATLASSIAN_MAX_CONCURRENT_REQUESTS` and `ATLASSIAN_REQUESTS_PER_SECOND` now apply per upstream site. With several sites, the total can be higher than the configured value.\n- With the default storage, OAuth proxy logins in progress are kept in memory, so a restart cancels them.\n- With `JIRA_PROJECTS_FILTER` or `JIRA_INTERNAL_ONLY_PROJECTS` set, `jira_edit_comment` makes two extra GET requests per edit.\n- The Confluence mention limit moves from 50 users per document (v0.24.5) to 100 users per tool call.\n- On Jira Cloud, Markdown link text can no longer contain an opening bracket of its own kind: `[a [b](c)` now links only `b`, as CommonMark does.\n- With `JIRA_SSL_VERIFY=false` or `CONFLUENCE_SSL_VERIFY=false`, a header-PAT request to the other service's origin keeps certificate verification on.\n- On stdio, a working directory of `/` or the home directory now logs a startup warning that names `MCP_ATLASSIAN_FILES_DIR`. Behaviour is otherwise unchanged.\n\n## Known limitations\n\nThese are conversion limits in Confluence Markdown writes. None of them loses data or fails the write.\n\n- **A paragraph with thousands of inline tags can keep its formatting as source text.** For example, `<b>x</b>` repeated 3,000 times (27 KB) in one paragraph is stored as literal text.\n- **A paragraph with many unpaired `~`, `^` or `=` before a formatted span can keep that span as source text.** For example, a 1.4 KB list of file names such as `report001~backup.txt` followed by `**Keep these files.**` stores the bold text as `**Keep these files.**`.\n- **A list item with a continuation line of hundreds of spaces before a nested marker can be stored as a paragraph.** For example, `- x` followed by 260 spaces and `- y`.\n- **Very large documents of short paragraphs still take several seconds.** 128 KiB of short paragraphs with `~` takes 7 to 8.5 seconds, and 128 KiB of `|a` lines followed by headings takes about 2.2 seconds. Both grow in proportion to the length (v0.24.7: 4.6 to 22 seconds, and 86 seconds). This is the converter's own cost per byte.\n\n## 📚 Docs\n\n- `docs/http-transport.mdx` describes the thread pools, deadlines and URL check pools.\n- `docs/tools/confluence-comments.mdx` documents `content_format`.\n- `ATLASSIAN_MAX_RESPONSE_BYTES` is in `.env.example` and `docs/configuration.mdx`.\n\n## Contributors\n\n- @zt2misay2 for reporting GHSA-68x4-2r5j-m2jr\n- @endofcake for reporting GHSA-v49j-6r3q-mm6w\n\n**Full Changelog**: https://github.com/sooperset/mcp-atlassian/compare/v0.24.7...v0.24.8\n","mentions_count":2}
