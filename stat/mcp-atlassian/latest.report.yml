{"id":446858582,"author":{"login":"sooperset","id":32061883,"node_id":"MDQ6VXNlcjMyMDYxODgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDONYN7OM4aooVW","tag_name":"v0.24.6","target_commitish":"a423ea579955bd4e00bf97ef64effea21f6ad1a3","name":"v0.24.6","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-16T09:59:10Z","updated_at":"2026-11-16T09:59:27Z","published_at":"2026-11-16T09:59:27Z","assets":[],"body":"## 🔒 Security\n\n- GHSA-3c26-hw8g-vvc9: Confluence write calls with Markdown content that ran at the same time could store malformed content or content from another call. Only 0.24.5 is affected. The fix is in #1887.\n\n## 🐛 Bug Fixes\n\n### Confluence\n\n- **Markdown writes that run at the same time no longer affect each other.** 0.24.5 started running Confluence calls in parallel, and the Markdown converter was shared between them. A page or comment written while another Markdown write was converting could be stored with broken formatting or with text from the other call. Each conversion now uses its own converter, so a conversion that fails also no longer affects the ones after it (#1887).\n\n## ⚠️ If you ran 0.24.5\n\nReview the pages and comments that were written with Markdown content while 0.24.5 was running, if several users shared the server or a client sent write calls in parallel. Content that was already stored in Confluence was not read or changed by this issue.\n\n**Full Changelog**: https://github.com/sooperset/mcp-atlassian/compare/v0.24.5...v0.24.6\n"}
