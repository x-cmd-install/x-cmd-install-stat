","download_count":5,"created_at":"2026-09-11T14:48:48Z","updated_at":"2026-09-11T14:48:48Z"},{"id":557436125,"node_id":"RA_kwDOCF-u4c4hOczd","name":"xan-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":7366002,"digest":"sha256:04e4bb7da4345a9e39cd64b1c91c5b48eab9986b0e53981d425fe0ddd6019dae","download_count":109,"created_at":"2026-09-11T14:48:48Z","updated_at":"2026-09-11T14:48:49Z"}],"body":"*Features*\n\n* Support for `.mtx` (Matrix Market) files.\n* Adding `geometric_mean` & `harmonic_mean` aggregation functions.\n\n*Fixes*\n\n* Fixing `xan rename` with non-comma delimiters.\n* Fixing `xan from -f=parquet` not converting timestamp columns.\n* Fixing open-ended moonblade slicing.\n* Fixing `xan parallel (cat|map)` not working with `-R/--run`.\n* Fixing `xan parallel -R/--run` not spawning checker thread.\n* Fixing `xan cat rows (-I|-U) -S/--source-column`.\n\n*Performance*\n\n* Improving performance of `xan freq` & `xan p freq`.\n\n*Quality of Life*\n\n* Better moonblade error messages when values are not yet materialized.\n* Better `xan count -H/--human-readable`.","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
