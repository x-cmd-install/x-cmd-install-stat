mpt_v0.12.0_windows_amd64.exe","label":null,"uploader":{"login":"mvdan","id":3576549,"node_id":"MDQ6VXNlcjM1NzY1NDk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":3425792,"digest":"sha256:66bd679908b64864fc85417e7ea01148774b477364b9a02ab1c194333a55c997","download_count":996,"created_at":"2026-09-07T22:36:13Z","updated_at":"2026-09-07T22:36:14Z"}],"body":"This release is based on Go 1.27's gofmt, and requires Go 1.26 or later.\r\n\r\nA standard library import carrying a doc or inline comment is no longer moved into the top import group, as the comment stayed behind and ended up detached at the bottom of the group. See #289.\r\n\r\nMoving a standard library import up no longer leaves an empty line where it used to be, which split the remaining imports into extra groups. See #225.\r\n\r\nA copyright header or package doc no longer makes gofumpt treat a single-line first declaration as multi-line, adding an empty line after it.\r\n\r\nAn assignment whose right-hand side is separated by a comment is now left alone, as merging the lines produced output which gofmt would change back.\r\n\r\nConsider [becoming a sponsor](https://github.com/sponsors/mvdan) if you benefit from the work that went into this release!\r\n\r\nBinaries built on `go version go1.27.1 linux/amd64` with:\r\n\r\n\tCGO_ENABLED=0 go build -trimpath -ldflags=\"-w -s\"","reactions":{"total_count":7,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":5,"rocket":1,"eyes":0}}
