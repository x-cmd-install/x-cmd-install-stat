reated_at":"2026-11-17T19:07:02Z","updated_at":"2026-11-17T19:07:17Z"},{"id":760496744,"node_id":"RA_kwDOJrGO5M4tVEJo","name":"AnythingLLMDesktop.exe","label":null,"uploader":{"login":"timothycarambat","id":16845892,"node_id":"MDQ6VXNlcjE2ODQ1ODky","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":396626360,"digest":"sha256:63dad00f576986d5403a3ff5f354192347ecafdbb885e10168e3d8b77c725f55","download_count":1548,"created_at":"2026-11-17T20:18:42Z","updated_at":"2026-11-17T20:19:02Z"},{"id":759987548,"node_id":"RA_kwDOJrGO5M4tTH1c","name":"installer.sh","label":null,"uploader":{"login":"timothycarambat","id":16845892,"node_id":"MDQ6VXNlcjE2ODQ1ODky","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/x-sh","state":"uploaded","size":26329,"digest":"sha256:6e0c491d37172de3e09126bff7ef52c3557011b71630759302bd6da5b352cd0e","download_count":43,"created_at":"2026-11-17T17:31:18Z","updated_at":"2026-11-17T17:31:18Z"},{"id":759987570,"node_id":"RA_kwDOJrGO5M4tTH1y","name":"version.txt","label":null,"uploader":{"login":"timothycarambat","id":16845892,"node_id":"MDQ6VXNlcjE2ODQ1ODky","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":6,"digest":"sha256:babb6a2b71ed088aa943e35bcc54c10671b049e45db7a8f9c46a6c06c5127303","download_count":85,"created_at":"2026-11-17T17:31:18Z","updated_at":"2026-11-17T17:31:18Z"}],"body":"### Updated browser extension\r\n\r\nThe [browser extension](https://github.com/Mintplex-Labs/anythingllm-extension) has been improved beyond its original function of just collecting documents to now a full fledged UI chat bar with the ability to right click -> Add context (text and image) and chat directly  in Chrome. This sidebar should have mostly full parity for tooling and more with the traditional chat UI.\r\n\r\nWhile it is backward and forward compatible, only full functionality is expected when the server and extension are on version 1.20.0 or later. The [Chrome webstore](https://chromewebstore.google.com/detail/anythingllm-browser-compa/pncmdlebcopjodenlllcomedphdmeogm) has been updated to this version as well.\r\n\r\nhttps://github.com/user-attachments/assets/830069a6-34cb-4f37-80b0-6d52eb4622d0\r\n\r\n### PowerPoint tool overhaul\r\n\r\n<img width=\"1990\" height=\"1099\" alt=\"pptx-generation\" src=\"https://github.com/user-attachments/assets/05689972-1296-4869-b208-dd9301222dd3\" />\r\n\r\nThe agent's PowerPoint tool has been rebuilt from the ground up to produce cleaner, better looking presentations.\r\n\r\n- **Themes and layouts:** decks use new color themes and a set of layouts that are picked to fit each slide's content, so the same layout is not repeated slide after slide.\r\n- **Live slide previews:** slides appear in the chat as they are built, so you can watch the deck come together. Click a preview to see it full size.\r\n- **Grounded content:** figures, chart values and quotes are only kept when your outline, research or conversation contains them, and text is sized to fit each slide.\r\n\r\n### Email approval cards for Gmail and Outlook\r\n\r\n<img width=\"1990\" height=\"1099\" alt=\"email-drafting\" src=\"https://github.com/user-attachments/assets/0b571869-c43b-454f-bdf1-0e2e3d4b4beb\" />\r\n\r\nWhen an agent wants to send or draft an email with the [Gmail](https://docs.anythingllm.com/agent/usage/gmail-agent) or [Outlook](https://docs.anythingllm.com/agent/usage/outlook-agent) tools, the approval request is now shown as an email card. You can edit the recipients, Cc, Bcc, subject and body right in the card before you approve it. The approval timer pauses while you edit, and you can expand a sent email to see exactly what went out.\r\n\r\n### MCP improvements\r\n\r\n- **Identity forwarding:** MCP servers can now receive the workspace and user that is calling them. Opt in per server with `anythingllm.forwardIdentity`. See [Forwarding identity to MCP servers](https://docs.anythingllm.com/mcp-compatibility/forward-identity).\r\n- **Per-server timeouts:** set `anythingllm.timeout` (in seconds) on an MCP server to control how long its tool calls can run. The default is 60 seconds.\r\n- **Developer API:** new `/v1/mcp-servers` endpoints let you list, add, update, delete, start, stop and reload MCP servers, and turn individual tools on or off.\r\n- MCP servers with many tools now load every page of tools, starting one server also picks up any newly saved servers, and disconnected servers can be deleted.\r\n\r\n----\r\n\r\n## What's Changed\r\n* fix: wrap markdown tables in a scroll container for narrow screens (#6852) by @ManojDevarajulu in https://github.com/Mintplex-Labs/anything-llm/pull/6859\r\n* fix: return the requested last lines in filesystem-read-text-file tail by @RaphaelFakhri in https://github.com/Mintplex-Labs/anything-llm/pull/6833\r\n* fix: skip unnamed header rows in the agent flow API Call block by @RaphaelFakhri in https://github.com/Mintplex-Labs/anything-llm/pull/6835\r\n* fix: preserve Ollama and llmman images when compressing long prompts by @clean99 in https://github.com/Mintplex-Labs/anything-llm/pull/6840\r\n* Update OpenAI fallback models to gpt-5.6-luna by @shatfield4 in https://github.com/Mintplex-Labs/anything-llm/pull/6855\r\n* fix: retain individually selected document search results by @Max-Reisinger in https://github.com/Mintplex-Labs/anything-llm/pull/6829\r\n* fix: parse extensionless files when a parent folder name has a dot by @MohammadHijjawi97 in https://github.com/Mintplex-Labs/anything-llm/pull/6857\r\n* fix(frontend): toPercentString should respect decimals instead of rounding first by @abining in https://github.com/Mintplex-Labs/anything-llm/pull/6861\r\n* fix(embed): apply enabled/allowlist/session checks to history routes by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6870\r\n* feat(localai): read context window and capabilities from /v1/models/capabilities by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6872\r\n* Stage hotdir uploads under unique names to prevent cross-request collisions by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6868\r\n* Save chat prompt to thread before the AI responds by @shatfield4 in https://github.com/Mintplex-Labs/anything-llm/pull/6751\r\n* Chore/Maint: Bump Node from 18 to 24 LTS by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6893\r\n* fix: responsive widths on Workspace Settings forms by @lakshya-dhariwal in https://github.com/Mintplex-Labs/anything-llm/pull/6891\r\n* fix: report chunk progress while embedding with Voyage AI by @Shaurya55555 in https://github.com/Mintplex-Labs/anything-llm/pull/6882\r\n* fix: list Microsoft Foundry Local in the onboarding LLM provider picker by @Shaurya55555 in https://github.com/Mintplex-Labs/anything-llm/pull/6884\r\n* fix: preserve chat action IDs after saving replies by @Max-Reisinger in https://github.com/Mintplex-Labs/anything-llm/pull/6875\r\n* fix: treat empty tool call arguments as {} in tooledComplete by @jaeminbird in https://github.com/Mintplex-Labs/anything-llm/pull/6879\r\n* docs: point Qdrant setup reference at the quickstart page by @SoulmatelynchVFX in https://github.com/Mintplex-Labs/anything-llm/pull/6896\r\n* Hide Sent By column in workspace chats outside multi user mode by @shatfield4 in https://github.com/Mintplex-Labs/anything-llm/pull/6886\r\n* Add vision support to DeepSeek provider by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6910\r\n* Add DeepSeek as an agent web search provider by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6911\r\n* fix: pptx section sub-agent provider instance and call arguments by @rtmalikian in https://github.com/Mintplex-Labs/anything-llm/pull/6904\r\n* fix: encode file paths when re-syncing GitHub documents by @clean99 in https://github.com/Mintplex-Labs/anything-llm/pull/6901\r\n* fix: honor max response tokens in native KoboldCPP agent requests by @clean99 in https://github.com/Mintplex-Labs/anything-llm/pull/6902\r\n* feat: add DISABLE_METRICS_ENDPOINT opt-out for /api/utils/metrics by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6912\r\n* fix: filter ineligible Lance candidates before reranking by @Max-Reisinger in https://github.com/Mintplex-Labs/anything-llm/pull/6908\r\n* fix: serve the dynamic PWA manifest before static files by @lakshya-dhariwal in https://github.com/Mintplex-Labs/anything-llm/pull/6944\r\n* fix: use the Responses API for Azure OpenAI reasoning agent calls by @henricop in https://github.com/Mintplex-Labs/anything-llm/pull/6942\r\n* fix: apply frame protection to generated SPA pages by @JH-ustc in https://github.com/Mintplex-Labs/anything-llm/pull/6940\r\n* fix: allow deleting disconnected MCP servers by @Max-Reisinger in https://github.com/Mintplex-Labs/anything-llm/pull/6938\r\n* fix: load all pages of MCP tools by @Max-Reisinger in https://github.com/Mintplex-Labs/anything-llm/pull/6937\r\n* feat: configurable per-server MCP tool call timeout by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6948\r\n* fix: keep static agent flow variables out of flow results and status messages by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6950\r\n* fix: reject browser extension API keys whose owner is no longer an admin or manager by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6952\r\n* fix: prevent infinite recursion when copying directory into its own's by @Bensonbenyi in https://github.com/Mintplex-Labs/anything-llm/pull/6934\r\n* fix: compare filesystem agent paths case-insensitively on Windows by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6953\r\n* fix: re-check user and workspace access when an agent invocation connects by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6954\r\n* fix: preserve images after prompt-based agent tool calls in `Untooled` by @clean99 in https://github.com/Mintplex-Labs/anything-llm/pull/6928\r\n* fix: preserve provider formatting in compressed chat history by @clean99 in https://github.com/Mintplex-Labs/anything-llm/pull/6926\r\n* fix: use Microsoft Graph webLink for Outlook thread citation permalinks by @Bensonbenyi in https://github.com/Mintplex-Labs/anything-llm/pull/6923\r\n* fix: remove a deleted folder's documents from workspaces on Windows by @tanishqbaweja in https://github.com/Mintplex-Labs/anything-llm/pull/6921\r\n* fix: reject failed Responses API agent streams by @clean99 in https://github.com/Mintplex-Labs/anything-llm/pull/6919\r\n* fix: enforce daily message limit on agent session follow-ups by @lakshya-dhariwal in https://github.com/Mintplex-Labs/anything-llm/pull/6918\r\n* Fix contextual save bar colors in light mode by @shatfield4 in https://github.com/Mintplex-Labs/anything-llm/pull/6955\r\n* fix: decode characters split across chunks in filesystem head/tail reads by @hsusul in https://github.com/Mintplex-Labs/anything-llm/pull/6915\r\n* Keep workspace chats when deleting a user by @shatfield4 in https://github.com/Mintplex-Labs/anything-llm/pull/6913\r\n* fix: replace agent session complete notice with an explicit exit notice by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/6966\r\n* fix: keep * bullets and spaced * as text in Telegram replies by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/6962\r\n* fix: keep underscores inside words when reading messages aloud by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/6964\r\n* Fix light mode highlight for active settings sidebar items by @shatfield4 in https://github.com/Mintplex-Labs/anything-llm/pull/6974\r\n* fix: honor a chat history limit of 0 by @RaphaelFakhri in https://github.com/Mintplex-Labs/anything-llm/pull/6973\r\n* fix: auto-name threads first messaged via the mobile app or developer API by @udjamaflip in https://github.com/Mintplex-Labs/anything-llm/pull/6982\r\n* fix: report Bedrock non-streaming output tokens per second from seconds by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/6985\r\n* fix: escape and shorten Telegram tool approval prompts by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/6987\r\n* fix: shorten long messages in Telegram /history so it fits Telegram's limit by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/6989\r\n* fix: read the file extension from the last path segment only by @Shaurya55555 in https://github.com/Mintplex-Labs/anything-llm/pull/6997\r\n* fix: trim provider names in PROVIDER_DISABLE_NATIVE_TOOL_CALLING by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/7000\r\n* fix: honour the workspace chat mode in the mobile stream-chat command by @udjamaflip in https://github.com/Mintplex-Labs/anything-llm/pull/6983\r\n* fix: read the Telegram /history count when the command includes @BotName by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/7002\r\n* fix: accept null and JSON string arguments in prompt-based tool calls by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/7006\r\n* fix: use SambaNova completion_tokens_per_sec for non-streaming outputTps by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/7010\r\n* fix: resolve local $ref pointers to other properties in dereferenceSchema by @Fahmid-Arman in https://github.com/Mintplex-Labs/anything-llm/pull/7009\r\n* test: fix mobile stream-chat mock and skip host-dependent suites locally by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/pull/7012\r\n* fix: reject nested folder names and move destinations in document storage by @timothycarambat in https://github.com/Mintplex-Labs/anything-llm/