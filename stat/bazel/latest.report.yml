"id":15028808,"node_id":"MDQ6VXNlcjE1MDI4ODA4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:6c728a92c8a17be81862156919ecca00682e4460a68844eb2f4b59ea07e4dc5f","download_count":9,"created_at":"2026-10-07T16:47:31Z","updated_at":"2026-10-07T16:47:31Z"}],"body":"> [!NOTE] \r\n> If you are looking for [rolling releases](https://bazel.build/release#rolling-releases), please visit [this page](https://bazel.build/release/rolling).\r\n\r\n# Release 9.3.0 (2026-10-07)\r\n\r\nBazel 9.3.0 is a minor LTS release. It is fully backward compatible with Bazel 9 releases starting from 9.0.1; see [Bazel 9.0.1 release notes](https://github.com/bazelbuild/bazel/releases/tag/9.0.1) for a note on backward compatibility.\r\n\r\n\r\n## General\r\n\r\n\r\n\r\n* Fix for regression in [#29284](https://github.com/bazelbuild/bazel/pull/29284) that caused select builtin actions to incorrectly inherit resource set overrides. ([#31136](https://github.com/bazelbuild/bazel/pull/31136))\r\n* Fixed a bug that could cause `ignore_directories()` to not ignore directories. ([#30564](https://github.com/bazelbuild/bazel/pull/30564))\r\n\r\n\r\n## C++ / Objective-C\r\n\r\n\r\n\r\n* The C++ include scanner now properly resolves headers that are generated at build time and included as part of the toolchain. ([#30879](https://github.com/bazelbuild/bazel/pull/30879))\r\n\r\n\r\n## Configurability\r\n\r\n\r\n\r\n* Test targets can now be built for a target platform that no execution platform is compatible with, e.g. to cross-compile them. Running such a test fails with an error at execution time instead of failing analysis. ([#30946](https://github.com/bazelbuild/bazel/pull/30946))\r\n\r\n\r\n## External Deps\r\n\r\n\r\n\r\n* Fixed `repository_ctx.download_and_extract` failing with an \"Expected a file with a ... suffix\" error when `--downloader_config` blocks all URLs and the archive is served from the repository cache. ([#30470](https://github.com/bazelbuild/bazel/pull/30470))\r\n* Running `bazel shutdown` no longer results in stale lockfile data being written. ([#30394](https://github.com/bazelbuild/bazel/pull/30394))\r\n* Cycles between `MODULE.bazel` files connected via `include()` are now reported as an error instead of hanging the build. ([#30804](https://github.com/bazelbuild/bazel/pull/30804))\r\n* Fixed a crash while evaluating `MODULE.bazel` files when Skyframe dropped its temporary state in response to memory pressure. ([#30809](https://github.com/bazelbuild/bazel/pull/30809))\r\n* `{r,m}ctx.download*` now report the size of downloaded files. ([#30974](https://github.com/bazelbuild/bazel/pull/30974))\r\n* Added `repository_ctx.patch(directory)`. ([#31016](https://github.com/bazelbuild/bazel/pull/31016))\r\n* Facts of reproducible module extensions are now restored to the expected state after external modifications by every Bazel command that updates the lockfile. ([#31073](https://github.com/bazelbuild/bazel/pull/31073))\r\n* `bazel fetch --force` no longer causes the fetched repos to be fetched again by the next build with a spurious warning about external modifications. ([#31134](https://github.com/bazelbuild/bazel/pull/31134))\r\n\r\n\r\n## Local Execution\r\n\r\n\r\n\r\n* Sandboxed actions no longer fail with \"File exists\" when an input is nested under a source directory input. ([#31414](https://github.com/bazelbuild/bazel/pull/31414))\r\n\r\n\r\n## Performance\r\n\r\n\r\n\r\n* Fixed a build failure with `--execution_log_compact_file` when a C++ action template has no inputs. ([#30826](https://github.com/bazelbuild/bazel/pull/30826))\r\n\r\n\r\n## Remote Execution\r\n\r\n\r\n\r\n* Action rewinding (`--rewind_lost_inputs`) can now succeed even if the remote cache doesn't verify that AC entries aren't stale. ([#30393](https://github.com/bazelbuild/bazel/pull/30393))\r\n* Fix incremental remote builds failing to create output directories beneath stale dangling symlinks. ([#30969](https://github.com/bazelbuild/bazel/pull/30969))\r\n* Files uploaded to the disk cache are now copied with a copy-on-write clone where the filesystem supports it, so a cache entry can share its blocks with the output it was uploaded from. ([#30901](https://github.com/bazelbuild/bazel/pull/30901))\r\n* Retry 408 and 429 status codes with HTTP remote caching. ([#30973](https://github.com/bazelbuild/bazel/pull/30973))\r\n* Disk cache entries deleted by a concurrent garbage collection are now treated as cache misses and don't result in failures. ([#31021](https://github.com/bazelbuild/bazel/pull/31021))\r\n* Invalidate cached action execution results when remote cache/executor endpoints or `--remote_instance_name` change between invocations. ([#30986](https://github.com/bazelbuild/bazel/pull/30986))\r\n* With Build without the Bytes, a requested top-level output that was deleted locally is now reliably redownloaded in the next build that requests it, even if other invocations ran in between. ([#30963](https://github.com/bazelbuild/bazel/pull/30963))\r\n* `--rewind_lost_inputs` is now enabled by default. Builds with BwoB automatically recover from remote cache eviction by rewinding actions that generated lost inputs. ([#31416](https://github.com/bazelbuild/bazel/pull/31416))\r\n\r\n\r\n## Starlark / Build Language\r\n\r\n\r\n\r\n* Added Label.repo_root as a replacement for the deprecated Label.workspace_root. ([#31399](https://github.com/bazelbuild/bazel/pull/31399))\r\n\r\n\r\n## Windows\r\n\r\n\r\n\r\n* Windows parameter files now preserve empty arguments and correctly escape backslashes before quotes and at the end of quoted arguments. ([#31249](https://github.com/bazelbuild/bazel/pull/31249))\r\n\r\n\r\n## Acknowledgments\r\n\r\nThis release contains contributions from many people at Google, as well as Andrew Hewitson, Bryce Lampe, Chris McDonald, David Jyo, David Zbarsky, Fabian Meumertzheim, Fredrik Medley, Futa, George Gensure, Guillaume Maudoux, Jason Bedard, Javier Maestro, jdymitarai, JonathanPerry651, Jordan, Keith Smiley, Ladd Van Tol, Malte Poll, peakschris, Rahul Butani, Showta Ishizaki, Son Luong Ngoc, Tamir Duberstein, and Ulrik Falkl\u00f6f. \r\n\r\n\r\n\r\n_Notice_: Bazel installers contain binaries licensed under the GPLv2 with Classpath exception. Those installers should always be redistributed along with the source code.\r\n\r\nSome versions of Bazel contain a bundled version of OpenJDK. The license of the bundled OpenJDK and other open-source components can be displayed by running the command `bazel license`. The vendor and version information of the bundled OpenJDK can be displayed by running the command `bazel info java-runtime`. The binaries and source-code of the bundled OpenJDK can be [downloaded from our mirror server](https://mirror.bazel.build/openjdk/index.html).\r\n\r\n_Security_: All our binaries are signed with our [public key](https://releases.bazel.build/bazel-release.pub.gpg) 3D5919B448457EE0.\r\n\r\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":4,"eyes":0}}
