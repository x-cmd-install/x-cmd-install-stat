:"","uploader":{"login":"bazel-io","id":15028808,"node_id":"MDQ6VXNlcjE1MDI4ODA4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:28fddbd69e58dd79bfe1a2588ef1065862336d2826373bf74795e210189608a3","download_count":19,"created_at":"2026-10-21T02:23:14Z","updated_at":"2026-10-21T02:23:15Z"}],"body":"> [!NOTE] \r\n> If you are looking for [rolling releases](https://bazel.build/release#rolling-releases), please visit [this page](https://bazel.build/release/rolling).\r\n\r\n# Release 9.3.1 (2026-10-20)\r\n\r\nBazel 9.3.1 is a patch LTS release. It is fully backward compatible with Bazel 9 releases starting from 9.0.1; see [Bazel 9.0.1 release notes](https://github.com/bazelbuild/bazel/releases/tag/9.0.1) for a note on backward compatibility.\r\n\r\n\r\n## General\r\n\r\n\r\n\r\n* Removed distrusted eMudhra and Sectigo AAA root CA certificates from the bundled JDK, to address the private key leakage (see [https://emudhra.we-have-a-problem.com/](https://emudhra.we-have-a-problem.com/); [#31920](https://github.com/bazelbuild/bazel/pull/31920))\r\n\r\n\r\n## Core\r\n\r\n\r\n\r\n* Preserve packages in top-level alias chains across pre-execution cache discards. ([#31912](https://github.com/bazelbuild/bazel/pull/31912))\r\n\r\n\r\n## External Deps\r\n\r\n\r\n\r\n* Close the channel of a lock file when acquiring a lock fails ([#31896](https://github.com/bazelbuild/bazel/pull/31896))\r\n\r\n\r\n## Performance\r\n\r\n\r\n\r\n* Rewind an action whose output was lost before it could be downloaded ([#31902](https://github.com/bazelbuild/bazel/pull/31902))\r\n\r\n\r\n## Acknowledgments\r\n\r\nThis release contains contributions from many people at Google, as well as Fabian Meumertzheim. \r\n\r\n\r\n\r\n_Notice_: Bazel installers contain binaries licensed under the GPLv2 with Classpath exception. Those installers should always be redistributed along with the source code.\r\n\r\nSome versions of Bazel contain a bundled version of OpenJDK. The license of the bundled OpenJDK and other open-source components can be displayed by running the command `bazel license`. The vendor and version information of the bundled OpenJDK can be displayed by running the command `bazel info java-runtime`. The binaries and source-code of the bundled OpenJDK can be [downloaded from our mirror server](https://mirror.bazel.build/openjdk/index.html).\r\n\r\n_Security_: All our binaries are signed with our [public key](https://releases.bazel.build/bazel-release.pub.gpg) 3D5919B448457EE0.\r\n\r\n"}
