fM4nMhqk","name":"hl-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":2940738,"digest":"sha256:b8f5b963d7f9f9f30d0453754f78ac4f142d865c438ef41b9c7e5770d677f632","download_count":5,"created_at":"2026-10-19T22:21:58Z","updated_at":"2026-10-19T22:21:59Z"},{"id":657594911,"node_id":"RA_kwDOEPtVfM4nMhof","name":"hl-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3182573,"digest":"sha256:67802561929ee5ee7481a262e7cdd154d1bf9d9cce1fabc1118b3cf5d075af35","download_count":14,"created_at":"2026-10-19T22:21:54Z","updated_at":"2026-10-19T22:21:55Z"}],"body":"\n\n## Changed\n\n- Compare file identity through a platform-independent API by @pamburus in #1599\n\n## Fixed\n\n- Correct the shebang in the regeneration script by @pamburus in #1542\n- Lower the glibc requirement of the x86_64 GNU Linux binary by @pamburus in #1600\n- Stop busy-looping while lines wait to be printed by @pamburus in #1597\n- Stop dropping log lines with identical timestamps by @pamburus in #1544\n- Regenerate index_capnp.rs for capnp 0.26 compatibility by @dependabot in #1467\n- Dependabot cap'n proto regeneration workflow by @Copilot in #1560\n\n## Other\n\n- Allow updates for indirect dependencies by @pamburus in #1532\n- Batch patch updates instead of ignoring them by @pamburus in #1531\n- Centralize dependency versions in the workspace table by @pamburus in #1540\n- Declare dependency versions per crate by @pamburus in #1534\n- Group capnp and capnpc updates together by @pamburus in #1523\n- Raise manifest requirements on cargo updates by @pamburus in #1528\n- Remove the duplicate cargo update config by @pamburus in #1525\n- Update nixpkgs to nixos-26.05 by @pamburus in #1541\n- Avoid deprecated nixfmt directory argument by @pamburus in #1470\n- Install rustfilt from a prebuilt binary in the coverage job by @pamburus in #1520\n- Revert \"build(dependabot): raise manifest requirements on cargo updates\" by @pamburus in #1530\n\nCargo accepts only `lockfile-only` and `auto` for `versioning-strategy`, so `increase` made the whole configuration invalid and stopped it being parsed.\n\nThis reverts commit 4515379e.\n- Revert \"build(dependabot): allow updates for indirect dependencies\" by @pamburus in #1533\n\nRecreating #1526 against the change produced the same lock-file-only pull request, so the setting does not affect whether manifest requirements are raised. Restoring it keeps indirect dependencies out of version updates.\n\nThis reverts commit aa81d21c.\n- Revert \"build(dependabot): batch patch updates instead of ignoring them (#1531)\" by @pamburus in #1536\n\nThis reverts commit dcd3b7a7dd55a2fcd3618a5d6e1ab81b89d28e88.\n- Revert \"build(cargo): declare dependency versions per crate (#1534)\" by @pamburus in #1538\n\nThis reverts commit 967269b2633073d9aa741ee29a3dced14c450137.\n- Regenerate Cap'n Proto bindings on dependency update branches by @pamburus in #1524\n- Ignore the local .worktrees directory by @pamburus in #1545\n\n## Dependencies\n\n- Bump DavidAnson/markdownlint-cli2-action by @dependabot in #1478, #1489, #1507\n- Bump DeterminateSystems/nix-installer-action from 22 to 23 by @dependabot in #1561\n- Bump Swatinem/rust-cache from 2.9.1 to 2.9.2 by @dependabot in #1509\n- Bump actions-rust-lang/setup-rust-toolchain by @dependabot in #1474, #1564\n- Bump actions/checkout from 6.0.3 to 7.0.1 by @dependabot in #1468, #1495\n- Bump actions/create-github-app-token from 3.2.0 to 3.3.0 by @dependabot in #1592\n- Bump cachix/cachix-action by @dependabot in #1553\n- Bump cachix/install-nix-action from 31.10.6 to 31.11.1 by @dependabot in #1484, #1490, #1512\n- Bump capnp from 0.26.2 to 0.27.0 by @pamburus in #1522\n- Bump capnpc from 0.25.3 to 0.27.0 by @dependabot in #1466, #1504\n- Bump chrono-english from 0.1.8 to 0.2.1 by @dependabot in #1552\n- Bump codecov/codecov-action from 7.0.0 to 7.1.1 by @dependabot in #1571\n- Bump dirs from 6.0.0 to 7.0.0 by @dependabot in #1559\n- Bump dtolnay/rust-toolchain by @dependabot in #1513, #1570, #1587, #1590\n- Bump github/codeql-action/init from 4.36.2 to 4.39.0 by @dependabot in #1480, #1485, #1496, #1500, #1506, #1515, #1518, #1549, #1562, #1572, #1575, #1585, #1593\n- Bump itertools from 0.14.0 to 0.15.0 by @dependabot in #1465\n- Bump mockall from 0.14.0 to 0.15.0 by @pamburus in #1521\n- Bump rstest from 0.26.1 to 0.27.0 by @dependabot in #1558\n- Bump syn from 2.0.119 to 3.0.3 by @dependabot in #1494\n- Bump taiki-e/install-action from 2.86.7 to 2.87.29 by @dependabot in #1548, #1555, #1565, #1569, #1576, #1584, #1591\n- Bump tombi-toml/setup-tombi from 1.1.2 to 1.8.5 by @dependabot in #1462, #1469, #1473, #1479, #1491, #1499, #1508, #1514, #1527, #1554, #1563, #1568, #1586, #1594\n- Update dependencies by @missionis in #1464, #1472, #1476, #1483, #1493, #1498, #1503, #1511, #1517, #1529, #1543, #1547, #1551, #1557, #1567, #1574, #1578, #1583, #1589\n- Update nix flake dependencies by @missionis in #1463, #1471, #1475, #1482, #1486, #1497, #1502, #1510, #1516, #1546, #1550, #1556, #1566, #1573, #1577, #1582, #1588\n\n\n**Full Changelog**: https://github.com/pamburus/hl/compare/v0.36.3...v0.36.4\n","mentions_count":2}
