07-20T09:04:18Z","updated_at":"2026-07-20T09:04:19Z"}],"body":"## What's Changed\r\n* Fix: add KinD setup step to sync-sdk workflow by @vishal210893 in https://github.com/kubevela/kubevela/pull/6937\r\n* Fix(references/appfile): Fix namespace check and Terraform output parsing by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6915\r\n* Chore: update homebrew bump action by @roguepikachu in https://github.com/kubevela/kubevela/pull/6939\r\n* Chore: Remove unused parameter 'addonName' from 'vela-cli' workflow s\u2026 by @jamesdobson in https://github.com/kubevela/kubevela/pull/6930\r\n* Feat: Enhance unit test coverage for `references/common` package  by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6918\r\n* Chore: Add codeowners by @briankane in https://github.com/kubevela/kubevela/pull/6946\r\n* Fix(addon): Correct path calculation and test location for GitLab reader by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6902\r\n* Feat(appfile): Add comprehensive unit tests for `appfile` and `component` package by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6908\r\n* Feat(addon): Enhance unit test coverage for `pkg/addon` by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6901\r\n* Fix: Prevent index out-of-bounds in definitions by @roguepikachu in https://github.com/kubevela/kubevela/pull/6948\r\n* Fix: Update documentation generation and fixed comp title by @jguionnet in https://github.com/kubevela/kubevela/pull/6957\r\n* Refactor: controller flags registration and cobra options by @roguepikachu in https://github.com/kubevela/kubevela/pull/6949\r\n* Chore: Upgrade cuelang version to v0.14.1 by @Chaitanyareddy0702 in https://github.com/kubevela/kubevela/pull/6877\r\n* Feat(test): Enhance unit test coverage for webhook, workflow, VELAQL, and monitor packages by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6895\r\n* Feat(testing): Enhance Unit Test Coverage for Core Utility Packages by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6929\r\n* Feat: Enhance unit test coverage for `references/appfile` package by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6913\r\n* Fix(addon): show correct owner in definition conflict error by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6903\r\n* Feat(addon): Store addon registry tokens in Secrets by @AshvinBambhaniya2003 in https://github.com/kubevela/kubevela/pull/6935\r\n* Chore: Graceful skip and robust processing for missing definition directories in install script by @vishal210893 in https://github.com/kubevela/kubevela/pull/6964\r\n* Refactor: controller setup and improve server tests by @roguepikachu in https://github.com/kubevela/kubevela/pull/6958\r\n* Fix: update YAML import path to use go.yaml.in/yaml/v3 and adjust dep\u2026 by @ANIRUDH-333 in https://github.com/kubevela/kubevela/pull/6944\r\n* Fix: Fix issue with imports/packages in status validations by @briankane in https://github.com/kubevela/kubevela/pull/6963\r\n* Chore: imports workflow crd from pkg repo by @semmet95 in https://github.com/kubevela/kubevela/pull/6954\r\n* Fix: Prevent namespace admins from accessing vela-system definitions without explicit permissions by @roguepikachu in https://github.com/kubevela/kubevela/pull/6972\r\n* Fix: E2E Application Test (live-diff application version)  by @roguepikachu in https://github.com/kubevela/kubevela/pull/6976\r\n* Feat: Add configurable timeout for admission webhooks by @Chaitanyareddy0702 in https://github.com/kubevela/kubevela/pull/6977\r\n* Refactor: Pre-Validation Hooks to be More Extensible and Testable  by @roguepikachu in https://github.com/kubevela/kubevela/pull/6978\r\n* Refactor: update workflow-related types to use v1alpha1 API by @Chaitanyareddy0702 in https://github.com/kubevela/kubevela/pull/6975\r\n* Feat(KEP): Nested Definition Rendering (Compositions) by @briankane in https://github.com/kubevela/kubevela/pull/6993\r\n* Feat(KEP): #6973 - Native Helm Rendering by @briankane in https://github.com/kubevela/kubevela/pull/6974\r\n* Fix: Preserve last-applied-configuration for shared resources in applications  by @roguepikachu in https://github.com/kubevela/kubevela/pull/6998\r\n* fix: semgrep-dangerous-exec-command by @rahulkhinchi-wq in https://github.com/kubevela/kubevela/pull/6999\r\n* Feat(KEP): Declarative Addon Support by @briankane in https://github.com/kubevela/kubevela/pull/6996\r\n* Style: Remove trailing whitespace from dry-run heading by @LeongBryan in https://github.com/kubevela/kubevela/pull/7007\r\n* Docs(KEP): Go SDK for X-Definition Authoring (defkit) by @anoop2811 in https://github.com/kubevela/kubevela/pull/7009\r\n* Fix: typos in documentation by @oglok in https://github.com/kubevela/kubevela/pull/7015\r\n* Feat: Improve Cue Error Reporting by @briankane in https://github.com/kubevela/kubevela/pull/6984\r\n* Feat: post dispatch output context by @semmet95 in https://github.com/kubevela/kubevela/pull/7008\r\n* Fix: Support cuex package imports in vela show by @GoGstickGo in https://github.com/kubevela/kubevela/pull/7017\r\n* Feat: 7019 Support re-running workflows and ensure passed data is upd\u2026 by @briankane in https://github.com/kubevela/kubevela/pull/7025\r\n* Feat: Provider Registry by @briankane in https://github.com/kubevela/kubevela/pull/7021\r\n* Chore: bumps up pkg and workflow dependency versions by @semmet95 in https://github.com/kubevela/kubevela/pull/7026\r\n* Fix: 7018 Ensure Component removals are correctly persisted and refle\u2026 by @briankane in https://github.com/kubevela/kubevela/pull/7027\r\n* Feat: 7024 Enable custom errors in components similar to traits by @briankane in https://github.com/kubevela/kubevela/pull/7028\r\n* Fix: Prevent app validation errors when traits are used alongside workflow data passing by @briankane in https://github.com/kubevela/kubevela/pull/7031\r\n* Fix: 7032 Adds component type to structured log output by @briankane in https://github.com/kubevela/kubevela/pull/7033\r\n* Feat: eager status for post dispatch by @vishal210893 in https://github.com/kubevela/kubevela/pull/7030\r\n* Feat: Defkit implementation by @anoop2811 in https://github.com/kubevela/kubevela/pull/7037\r\n* Feat: Implement array builder and enhance CUE generation for X-Definitions by @roguepikachu in https://github.com/kubevela/kubevela/pull/7039\r\n* Feat: Defkit Refactor and Clean-Up by @roguepikachu in https://github.com/kubevela/kubevela/pull/7042\r\n* Fix: defkit CUE generation for task health, nested array schemas, and patch traits by @vishal210893 in https://github.com/kubevela/kubevela/pull/7041\r\n* Chore: fix trait definition translation discrepancies  by @roguepikachu in https://github.com/kubevela/kubevela/pull/7044\r\n* Fix: Fixes #7046 \u2014 status.details CUE import statements now compile correctly by @vishal210893 in https://github.com/kubevela/kubevela/pull/7047\r\n* Feat: defkit comp def discrepancies by @roguepikachu in https://github.com/kubevela/kubevela/pull/7048\r\n* Fix: do not recreate externally deleted apply-once resources on reconciliation by @oanasc in https://github.com/kubevela/kubevela/pull/7051\r\n* Fix: Update duration format handling and enhance StringParam with enum string support by @vishal210893 in https://github.com/kubevela/kubevela/pull/7053\r\n* Fix: Extend status.details validation to support dynamic CUE patterns by @briankane in https://github.com/kubevela/kubevela/pull/7056\r\n* Fix: add enum generation for struct fields in CUEGenerator by @roguepikachu in https://github.com/kubevela/kubevela/pull/7058\r\n* Fix: update debug-webhook-setup.sh for k3d on macOS with Docker Desktop by @briankane in https://github.com/kubevela/kubevela/pull/7060\r\n* Feat: defkit api completeness by @vishal210893 in https://github.com/kubevela/kubevela/pull/7064\r\n* Fix: StateKeep: add nil-guard in dispatch path and clean up stale ResourceTracker entries for deleted apply-once resources by @gabrnavarro in https://github.com/kubevela/kubevela/pull/7065\r\n* Feat: introduce Mandatory() API and three-state CUE field markers in defkit by @jerrinfrancis in https://github.com/kubevela/kubevela/pull/7068\r\n* Fix: remove Mandatory() API and simplify to two-state CUE field markers by @jerrinfrancis in https://github.com/kubevela/kubevela/pull/7070\r\n* Feat: add ClosedUnion and ClosedStruct support in defkit by @roguepikachu in https://github.com/kubevela/kubevela/pull/7069\r\n* Refactor: sort map keys before rendering in CUE generation functions by @roguepikachu in https://github.com/kubevela/kubevela/pull/7073\r\n* Feat: Cue 0.14.1 Preupgrade CLI Check by @briankane in https://github.com/kubevela/kubevela/pull/6983\r\n* Feat: Immutable Parameters by @briankane in https://github.com/kubevela/kubevela/pull/7059\r\n* Feat: Application-Scoped Policies by @briankane in https://github.com/kubevela/kubevela/pull/7067\r\n* Chore: Updating pkg and workflow versions by @jerrinfrancis in https://github.com/kubevela/kubevela/pull/7077\r\n* Feat: Validate undeclared parameters in application definitions by @majiayu000 in https://github.com/kubevela/kubevela/pull/7075\r\n* Fix: Align legacy config provider keys with workflow repo to resolve CUE conflict and key collision by @jerrinfrancis in https://github.com/kubevela/kubevela/pull/7078\r\n* Fix: rebuild appliedResources from ResourceTracker by @briankane in https://github.com/kubevela/kubevela/pull/7083\r\n* Fix: rename statusDetails CUE field to details to match Status struct by @officialasishkumar in https://github.com/kubevela/kubevela/pull/7088\r\n* Feat: extend fluent builder API validator patterns by @roguepikachu in https://github.com/kubevela/kubevela/pull/7092\r\n* Feat: native helm component and provider by @roguepikachu in https://github.com/kubevela/kubevela/pull/7080\r\n* Fix: CLI gen fixes and corrections to documentation by @briankane in https://github.c