ame":"jjui-0.10.13-linux-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8131330,"digest":"sha256:dfad1d044970b721a3c51c2b82e43531847debb216c5ee356eb1a9027b94856c","download_count":6,"created_at":"2026-11-12T22:19:27Z","updated_at":"2026-11-12T22:19:28Z"},{"id":741302904,"node_id":"RA_kwDOMusg3s4sL2J4","name":"jjui-0.10.13-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8997946,"digest":"sha256:cc1a1dd603a0fb158ce4bc093e9695358af590f8a6598cbb76671de3de5c57c6","download_count":41,"created_at":"2026-11-12T22:19:21Z","updated_at":"2026-11-12T22:19:22Z"},{"id":741303214,"node_id":"RA_kwDOMusg3s4sL2Ou","name":"jjui-0.10.13-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8231532,"digest":"sha256:93672bb531128aad1810d568f64a75ca5360bb046d3a47441ff9579e8a3dde55","download_count":17,"created_at":"2026-11-12T22:19:27Z","updated_at":"2026-11-12T22:19:28Z"}],"body":"This release is a batch of bug fixes and little improvements. Heads up: This release requires jj 0.39 or newer. \r\n\r\n## Improvements\r\n\r\n### Select consecutive revisions with Space\r\n\r\nPressing `space` now toggles revision selection and moves down one row. Previously it jumped to the revision's parent, which could skip rows on branching graphs. See the notes below to restore the previous behavior.\r\n\r\n### File search and command suggestions\r\n\r\nThe file finder now loads paths asynchronously, keeping the UI responsive while loading. Scroll results with the mouse wheel or click a file or directory to apply the history filter and close the finder.\r\n\r\nCommand-history suggestions in the `:` and `$` prompts also support mouse-wheel scrolling. Clicking a suggestion executes that command.\r\n\r\n## Fixes\r\n\r\n### Preserve merge-parent order\r\n\r\nChecked revisions now retain the order in which you selected them. When creating a merge with `n`, that order determines the parent order, giving you control over the first parent. Previously jjui used graph order, which could cause unrelated history to appear in a GitHub pull request.\r\n\r\nSet Parents also preserves the order of retained parents and appends new parents in selection order. Adding a parent no longer unexpectedly changes a merge's first parent.\r\n\r\n(#766)\r\n\r\n### Use the full width for external diff tools\r\n\r\nFull-screen diffs now pass terminal dimensions to tools such as difftastic, avoiding the 80-column fallback on wider terminals. This applies to diffs opened from Revisions, Details, Evolog, Diff Range, and Oplog. Loading an individual file uses the current diff viewport dimensions.\r\n\r\n(#772)\r\n\r\n### Keep long descriptions visible while editing\r\n\r\nInline Describe now opens with the cursor visible in long descriptions and follows it as you edit. Mouse-wheel scrolling no longer leaves parts of the description hidden or stops the editor from following the cursor.\r\n\r\n(#771)\r\n\r\n### Search across highlighted ID prefixes\r\n\r\nQuick search now matches across text with different styling. Searching for a change or commit ID works even when the query spans its highlighted unique prefix and dimmed remainder.\r\n\r\n(#759)\r\n\r\n### Filter history by directory\r\n\r\nSelecting a directory in the file finder now shows revisions that touched files anywhere within that directory. Previously the directory path was treated as an exact file path and matched nothing.\r\n\r\n### Render menus correctly on narrow terminals\r\n\r\nGit and bookmark menus truncate names by display width without splitting Unicode characters. The remotes line also stays within the menu border on narrow terminals.\r\n\r\n### Respect rebound help keys\r\n\r\nThe status bar hints now show your configured keys for expanding status help and opening full help.\r\n\r\n## Notes\r\n\r\n### Requires jj 0.39 or newer\r\n\r\nThe minimum supported `jj` version increases from 0.37 to 0.39. Snapshotting now uses the documented `jj util snapshot` command, replacing the deprecated `jj debug snapshot` command.\r\n\r\n(#780)\r\n\r\n### Restore jump-to-parent after selection\r\n\r\nTo make `space` select a revision and jump to its parent as before, add this action override to `config.toml`:\r\n\r\n```toml\r\n[[actions]]\r\nname = \"revisions.toggle_select\"\r\nlua = \"\"\"\r\njjui.builtin.revisions.toggle_select()\r\njjui.builtin.revisions.jump_to_parent()\r\n\"\"\"\r\n```\r\n\r\n## What's Changed\r\n* fix(diff): pass terminal width to full-screen diff subprocesses by @nickchomey in https://github.com/idursun/jjui/pull/772\r\n* fix: switch from jj debug snapshot to documented jj util snapshot by @hey2022 in https://github.com/idursun/jjui/pull/780\r\n\r\n## New Contributors\r\n* @hey2022 made their first contribution in https://github.com/idursun/jjui/pull/780\r\n\r\n**Full Changelog**: https://github.com/idursun/jjui/compare/v0.10.12...v0.10.13","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
