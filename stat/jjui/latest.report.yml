","name":"jjui-0.10.10-linux-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7841354,"digest":"sha256:1e77770473d32dd0928eeae73c2b22d11888d13668284426c883c4a6c712ef5c","download_count":65,"created_at":"2026-09-08T22:59:07Z","updated_at":"2026-09-08T22:59:08Z"},{"id":551485089,"node_id":"RA_kwDOMusg3s4g3v6h","name":"jjui-0.10.10-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8688402,"digest":"sha256:a8904e7a27dd299e719f28696a6c381295c64cd20aeb2a2c996d5c1121ec506e","download_count":249,"created_at":"2026-09-08T22:59:08Z","updated_at":"2026-09-08T22:59:09Z"},{"id":551485161,"node_id":"RA_kwDOMusg3s4g3v7p","name":"jjui-0.10.10-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7949217,"digest":"sha256:260393e692bb97344db2f6604704999acc088276665ce886c3ac3d596468eb34","download_count":38,"created_at":"2026-09-08T22:59:11Z","updated_at":"2026-09-08T22:59:12Z"}],"body":"This release adds an experimental interactive bookmark pane, an annotation view for reviewing changes, startup-relative file paths, and basename-only window titles.\r\n\r\n## Features\r\n\r\n### Experimental Interactive Bookmark Pane\r\n\r\nEnable the experimental bookmark pane in `config.toml`:\r\n\r\n```toml\r\n[bookmark]\r\ninteractive_bookmark_pane = true\r\n```\r\n\r\nThis experimental pane was created by @baggiiiie. It is disabled by default, so existing users keep the classic bookmark menu. When enabled, `b` toggles a split-pane bookmark browser and `tab` moves focus between the revisions list and the pane. It supports local and remote bookmark inspection, remote and text filtering, expanding remote refs, multi-selection, and bookmark operations including create, move, rename, delete, forget, track, untrack, push, and fetch.\r\n\r\n(#584, #721, #732)\r\n\r\n### Experimental Annotation View\r\n\r\nThe experimental annotation view provides a lightweight code-review workflow directly in jjui. Press `Shift+C` in the revisions view to open it for the selected revision, `c` to leave comments on the changes, and `y` to copy the comments as Markdown to the clipboard for sharing. Check #718 for more details.\r\n\r\n![Annotation view](https://github.com/user-attachments/assets/420f6d5f-5be0-44b1-af49-bd600f80a7bb)\r\n\r\n\r\n### Startup-Relative File Paths\r\n\r\nDisplayed file paths in details, diffs, the fuzzy file finder, and file target pickers are now relative to the directory where jjui was started. This changes the display only; commands continue to receive the repository-relative paths they expect.\r\n\r\n(#719, #735)\r\n\r\n## Improvements\r\n\r\n- `ui.set_window_title` now accepts `\"base\"` to show a title such as `jjui - repo`, `\"full\"` (or `true`) to show the full repository path, and `false` to show only `jjui`. The default remains the full path; the shorter title is useful when several terminal tabs are open. (#736)\r\n- Press `Home` or `End` in the revisions list to jump directly to the first or last revision. (#687)\r\n- Expanded help now uses a shared, compact column width across sections, making shortcuts easier to scan in wide terminals. (#728)\r\n\r\n## Fixes\r\n\r\n- Inline describe now supports `Ctrl-Y` to restore text accidentally deleted with `Ctrl-K` or `Ctrl-U`, including when the deletion reaches a line boundary. (#726)\r\n- jjui now accepts the extended `revset-aliases` format used by newer jj versions, where an alias can be written as `{ definition = \"...\", doc = \"...\" }`, instead of crashing on valid configuration. (#724, #725)\r\n- Fixed graph gutter padding that could shift embedded operation panels to the left under comfortable log templates. Details, inline describe, evolog, and rebase previews now stay aligned with the revision graph. (#722)\r\n- Lua API type definitions now include missing function signatures, improving completion and type checking for Lua configuration scripts.\r\n\r\n## What's Changed\r\n* feat: add Home/End key support for navigating to top/bottom of revs by @nikosavola in https://github.com/idursun/jjui/pull/687\r\n* fix(parser): keep gutter one segment per rune when padding blank graph lines by @shuvamk in https://github.com/idursun/jjui/pull/722\r\n* fix(config): support jj extended revset-alias config by @academician in https://github.com/idursun/jjui/pull/725\r\n* fix: ui: align expanded help columns by @beborngod in https://github.com/idursun/jjui/pull/728\r\n* [experiment] interactive bookmark view by @baggiiiie in https://github.com/idursun/jjui/pull/584\r\n* feat(config): add [bookmark] config for bookmark pane by @baggiiiie in https://github.com/idursun/jjui/pull/721\r\n* toggle bookmarkpane with `b` when config flag is set by @baggiiiie in https://github.com/idursun/jjui/pull/732\r\n* feat(files): render file paths relative to startup directory by @idursun in https://github.com/idursun/jjui/pull/735\r\n* Feat: Add config option to show just the basename in title by @nickchomey in https://github.com/idursun/jjui/pull/736\r\n\r\n## New Contributors\r\n* @shuvamk made their first contribution in https://github.com/idursun/jjui/pull/722\r\n* @beborngod made their first contribution in https://github.com/idursun/jjui/pull/728\r\n\r\n**Full Changelog**: https://github.com/idursun/jjui/compare/v0.10.9...v0.10.10","reactions":{"total_count":8,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":6,"rocket":1,"eyes":0},"mentions_count":7}
