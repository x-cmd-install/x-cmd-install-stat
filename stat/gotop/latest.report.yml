id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2478072,"digest":null,"download_count":359,"created_at":"2022-09-29T18:25:22Z","updated_at":"2022-09-29T18:25:23Z"},{"id":79448996,"node_id":"RA_kwDODk6wRc4EvEuk","name":"gotop_v4.2.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2666650,"digest":null,"download_count":2700,"created_at":"2022-09-29T18:25:23Z","updated_at":"2022-09-29T18:25:23Z"}],"body":"I've been trying to focus on clearing out bugs; unfortunately, many of these are on platforms I don't have access to, which really slows me down. At the same time, the stuff I *could* easily work on, including some of the exciting (well, exciting to me) features has completely halted because of my guilt about the bugs. In the meantime, I've been working on other projects.\r\n\r\nThank goodness for all you wonderful people submitting PRs. These folks keep things moving, and despite my languid approach to merging, the contributions are so very appreciated. Consequently, this release really is brought to you by contributors:\r\n\r\n- Sol\u00e8ne Rapenne (@rapenne-s), who added gotop to Nix\r\n- Anatol Pomozov (@anatol) for:\r\n  - simplifying and improving the `getTemps()` logic, which reduced both LOC and ABC complexity:\r\n    - LOC: 9075 -> 9056\r\n    - ABC: 4367 -> 4359\r\n  - Fixing the nvme temps for Kelvins to Celsius\r\n- Stanis\u0142aw Pitucha (@viraptor), for noticing that a gopsutil introduced a build issue on OSX and needed another bump.\r\n- sitiom, for notifying me that that gotop is available via scoop, on Windows\r\n- Heimen Stoffels (@vistaus) for the Dutch (nl) translation\r\n- Clayton Townsend II (@ctII) for the page-up/page-down process scrolling patch\r\n- @kqzz, for adding sort-by-command, and especially for being so patient for the merge.\r\n\r\nIn addition, unit tests were failing for a sort used in the display lists. While fixing it, I rewrote the original code and got a 10% performance improvement in the bargain.\r\n\r\nThere were some hiccups in the deb and RPMs; please let me know if these are still broken.","reactions":{"total_count":18,"+1":11,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
