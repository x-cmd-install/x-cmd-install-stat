","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":98466324,"digest":"sha256:4774631868db53163bfecff457b9440e55cc04f24d4c3168df67722409a0bef2","download_count":476,"created_at":"2026-10-03T10:03:46Z","updated_at":"2026-10-03T10:03:50Z"},{"id":607581339,"node_id":"RA_kwDOLmfWBM4kNvSb","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":111336696,"digest":"sha256:9ad79f50f52a60b85f1a0787de227235934ea0bd994f79b739fa806081b3fcf0","download_count":16225,"created_at":"2026-10-03T10:03:46Z","updated_at":"2026-10-03T10:03:50Z"},{"id":607581341,"node_id":"RA_kwDOLmfWBM4kNvSd","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":233642363,"digest":"sha256:3b06f974000c5f76267ad9cf53abf4b80c1958b626d99cc60cd503e551858ec3","download_count":16165,"created_at":"2026-10-03T10:03:46Z","updated_at":"2026-10-03T10:03:56Z"},{"id":607581332,"node_id":"RA_kwDOLmfWBM4kNvSU","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1075999095,"digest":"sha256:c2a2f7853f939f1a5f510c885d450564e5bcf6957453c1ff3adb0ea595b872aa","download_count":275,"created_at":"2026-10-03T10:03:46Z","updated_at":"2026-10-03T10:04:23Z"}],"body":"# Zen Stable Release\nIntroducing Library! A better place to organize and access your history, media, downloads, spaces and more.\n\n## Security\n- https://www.mozilla.org/en-US/security/advisories/mfsa2026-97/\n\n## New Features\n- Introducing Library! A better place to organize and access your history, media, downloads, spaces and more.\n- You can now resize the sidebar even when its hidden. If the sidebar is resized too small, it will automatically hide itself.\n- Updated to Firefox 157.0\n- WebRTC video calls can now use hardware AV1 decoding on devices that support it, instead of always decoding AV1 video in software.\n\n## Fixes\n- Significant performance improvements on startups/new windows when there are lots of tabs open.\n- Certain icon animations like the boost indicator or musical notes on the sidebar are now more performant. ([#15299](https://github.com/zen-browser/desktop/issues/15299))\n- Fixed status panel and glance controls not using the correct theme colors. ([#15280](https://github.com/zen-browser/desktop/issues/15280))\n- Fixed some HDR videos encoded in 8-bit color formats looking dull and gray on Windows instead of displaying in HDR.\n- Improved audio and video synchronization when repeatedly changing the playback speed of videos, for example on YouTube.\n- Fixed an issue on Windows where making a video full screen would leave the Windows taskbar showing over the video.\n\n## Changes\n- When a link gets routed to a specific space, it will prioritize the window that has that space open.\n- Some elements like the sidebar and the command bar now appear with blur effects.\n- On MacOS, buttons at the bottom of the sidebar now appear larger.\n- Swiping to the right on the last space will now try to create a new space.\n- When the sidebar is at the right, the buttons at the bottom are now reversed.\n","reactions":{"total_count":92,"+1":38,"-1":0,"laugh":4,"hooray":8,"confused":0,"heart":24,"rocket":13,"eyes":5}}
