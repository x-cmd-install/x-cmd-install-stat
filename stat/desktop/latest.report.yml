OBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":102586088,"digest":"sha256:1100cb3e857254edba833a293eb50010de66a166465edfcdcc8536dde732dfa7","download_count":402,"created_at":"2026-10-16T22:08:07Z","updated_at":"2026-10-16T22:08:12Z"},{"id":648766343,"node_id":"RA_kwDOLmfWBM4mq2OH","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":113083216,"digest":"sha256:bb2045d3e21654d40fe841250092eeadfd2c1fc831eefb509222773c8bdca149","download_count":9048,"created_at":"2026-10-16T22:08:07Z","updated_at":"2026-10-16T22:08:15Z"},{"id":648766342,"node_id":"RA_kwDOLmfWBM4mq2OG","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":237964106,"digest":"sha256:051fa36cc7a4c74d001915369c483d1f2ea884680fce6ade4e5dfc4eb72218e0","download_count":19734,"created_at":"2026-10-16T22:08:07Z","updated_at":"2026-10-16T22:08:16Z"},{"id":648766341,"node_id":"RA_kwDOLmfWBM4mq2OF","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1079206494,"digest":"sha256:71c938da6baa0ed15892933f2e7964ad777279cfcbd4e29c3b4b22efe17e8aeb","download_count":101,"created_at":"2026-10-16T22:08:07Z","updated_at":"2026-10-16T22:08:50Z"}],"body":"# Zen Stable Release\n\n\n## Security\n- https://www.mozilla.org/security/advisories/mfsa2026-106\n\n## New Features\n- Updated Firefox to 158.0\n- Added a `--space <id|name>` option to the command line interface.\n- Library will now show a 'Open in Folder' option and download speed when hovering over the toolbar icon.\n- Zen now creates more accessible PDFs when saving a page as PDF, and when printing on Linux and macOS. This also fixes a variety of PDF rendering issues, such as missing math symbols.\n\n## Fixes\n- Fixed various animation, urlbar and UI performance issues.\n- Fixed Library media tab requesting onedrive to download all files from cloud. ([#15888](https://github.com/zen-browser/desktop/issues/15888))\n- Fixed unwanted label next to the search icon in urlbar. ([#14856](https://github.com/zen-browser/desktop/issues/14856))\n- Fixed Avahi access so CUPS printers are listed in flatpak sandbox. ([#9651](https://github.com/zen-browser/desktop/issues/9651))\n- Fixed various memory leak issues. ([#15954](https://github.com/zen-browser/desktop/issues/15954))\n- Fixed a crash that could occur while Zen loaded website icons (favicons).\n- Fixed menus such as List all tabs, Settings, etc being hard to read with a Windows High Contrast theme. Menu background and text colors now follow the Background and Text colors chosen for a custom contrast theme in Windows Settings.\n- Other bug fixes and improvements.\n\n## Changes\n- Space routing regex will now match URLs as case-insensitive.\n- Library's widget hover list will now only display recently downloaded files.\n- Zen no longer rounds scroll positions to whole screen pixels. Scrolling is now smoother and more precise, especially on high-resolution displays or when a page is zoomed.\n","reactions":{"total_count":37,"+1":16,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":12,"rocket":5,"eyes":0}}
