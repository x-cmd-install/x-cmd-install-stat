system handles on Windows as content processes were started and stopped.\n- Fixed context menu actions on the urlbar not working. ([#15437](https://github.com/zen-browser/desktop/issues/15437))\n- Fixed overflow-extension order in single toolbar mode. ([#15419](https://github.com/zen-browser/desktop/issues/15419))\n- Fixed not being able to install add-ons while in compact mode. ([#15445](https://github.com/zen-browser/desktop/issues/15445))\n- Fixed Zen windows on macOS 27 immediately returning to maximized after being restored by double-clicking the title bar.\n- Other bug fixes and improvements.\n","reactions":{"total_count":32,"+1":18,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":7,"rocket":3,"eyes":0}}
