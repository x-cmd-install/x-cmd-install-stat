5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":96508624,"digest":"sha256:a717fa3b01fa32123b410fe0da4b0f862e553c7c22343322ca40c8dc50fb4bfe","download_count":593,"created_at":"2026-09-05T17:56:46Z","updated_at":"2026-09-05T17:56:50Z"},{"id":546122034,"node_id":"RA_kwDOLmfWBM4gjSky","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":109482964,"digest":"sha256:41e725c82a2bee91a351c5fe8f8771f8e2748c7f323ebbb0138dbeaae84afbb8","download_count":18887,"created_at":"2026-09-05T17:56:46Z","updated_at":"2026-09-05T17:56:51Z"},{"id":546122031,"node_id":"RA_kwDOLmfWBM4gjSkv","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":233598412,"digest":"sha256:39dd0fc40523ffe4749c3e977e10fd6c9005d6d11285421899114dadbbbfdd9b","download_count":14562,"created_at":"2026-09-05T17:56:46Z","updated_at":"2026-09-05T17:56:57Z"},{"id":546122039,"node_id":"RA_kwDOLmfWBM4gjSk3","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1069115617,"digest":"sha256:b7e63d24e0ec4cf80bc811e6106eb9f468c5f3847074d10e965ed587cf649a5f","download_count":117,"created_at":"2026-09-05T17:56:46Z","updated_at":"2026-09-05T17:57:19Z"}],"body":"# Zen Stable Release\n\n\n## Security\n- https://www.mozilla.org/en-US/security/advisories/mfsa2026-82/\n\n## New Features\n- Updated to Freifox 155.0 and 155.0.1\n- By using your Mozilla account, you can now sync your Spaces, Folders, Tabs, and much more between devices! This can be enabled in Settings > Sync > Sync your Spaces across devices.\n- The chrome UI now has a better look and feel, implementing squircles and other design elements to make it more visually appealing.\n- A new on-boarding experience has been added to help new users get started with the browser and its features.\n- Creating a new Space is now faster and requires less animation wait time, making the process more efficient.\n- Containers can now be reordered in Settings, and the new order is used wherever containers are listed.\n\n## Fixes\n- Fixed live folders for GitHub issues not working with the new GitHub UI\n- Fixed Zen preventing Linux systems from going to sleep after a long browsing session.\n- Fixed arrow-key and Page Up/Down scrolling not working on some pages with embedded content from other sites.\n- Fixed live audio streams such as internet radio stopping when playing in the background.\n- Other bug fixes and improvements.\n\n## Changes\n- Font size has been increased for the sidebar text, making it easier to read and navigate through tabs and spaces.\n- Zen now uses firefox-portal-detection.com instead of detectportal.firefox.com to detect captive portals and check network connectivity, so network allowlists referencing the old domain need updating.\n- PDFs smaller than the paper size can now be enlarged to fill the sheet when printing, by setting the scale above 100%.\n","reactions":{"total_count":59,"+1":23,"-1":0,"laugh":3,"hooray":9,"confused":0,"heart":14,"rocket":8,"eyes":2}}
