DOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":97387300,"digest":"sha256:3255963c7d11ff8d3bb3080104a33f31efb41608d732688f938d05a9172957e5","download_count":990,"created_at":"2026-09-16T15:38:50Z","updated_at":"2026-09-16T15:38:57Z"},{"id":568262976,"node_id":"RA_kwDOLmfWBM4h3wFA","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":110381300,"digest":"sha256:163823cf56b068e81bb8a48d93c9dbda3993f54f03f8d37e684e380bfc11b892","download_count":31877,"created_at":"2026-09-16T15:38:50Z","updated_at":"2026-09-16T15:38:58Z"},{"id":568262965,"node_id":"RA_kwDOLmfWBM4h3wE1","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":232138870,"digest":"sha256:2332673353551bfe4607aa6edd3c3ee3149652651a7698acabad935612c93943","download_count":29142,"created_at":"2026-09-16T15:38:50Z","updated_at":"2026-09-16T15:39:02Z"},{"id":568262980,"node_id":"RA_kwDOLmfWBM4h3wFE","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1068050003,"digest":"sha256:b47a1188bdf956be44966d06a757a79016d34044a66874a92a8d395e7f96c0a0","download_count":137,"created_at":"2026-09-16T15:38:50Z","updated_at":"2026-09-16T15:39:34Z"}],"body":"# Zen Stable Release\n\n\n## Security\n- https://www.mozilla.org/en-US/security/advisories/mfsa2026-90/\n\n## New Features\n- Updated to Firefox 156.0\n- Zen on macOS can now be set to open automatically when the computer starts up, from the Startup section of Settings.\n- Added the following actions to the command bar: 'Expand current view', 'New space', 'Reopen closed tab', 'Duplicate tab', 'Reset pinned tab'.\n\n## Fixes\n- Fixed high-sample-rate FLAC audio in MP4 failing to play on certain video sites.\n- Fixed subtitles not appearing in the Picture-in-Picture window when they are turned on in the video player after the window has already opened.\n- Fixed the find bar becoming permanently unavailable in a tab after reversing the panes in Split View.\n- Fixed some sites failing to load when DNS over HTTPS is enabled and the site does not support HTTPS.\n- Fixed an issue on Windows where Zen could block an auto-hiding taskbar from showing.\n- Fixed the sidebar not hiding if the urlbar is open when compact mode is enabled. ([#13196](https://github.com/zen-browser/desktop/issues/13196))\n- Fixed an issue where cross-space tab routing would freeze the browser under certain conditions. ([#14171](https://github.com/zen-browser/desktop/issues/14171))\n- Fixed cross-device sync losing certain tabs if they are created too quickly ([#15380](https://github.com/zen-browser/desktop/issues/15380))\n- Fixed certain issues related to live folders appearing as active even when they are no tabs showing in them.\n- Other bug fixes and improvements.\n\n## Changes\n- Zen's built-in PDF viewer now starts up to 45% faster.\n- Improved memory and CPU usage when Zen displays large JPEG images scaled down to fit a page.\n- On Windows devices with ARM64 processors, WebRTC video calls may now use hardware H264 decoding instead of falling back to software.\n- Live Folders will now ignore archived issues and pull requests.\n- Improved the look and feel of drag-and-drop interactions for tabs. Specially on MacOS, where the drag-and-drop behavior is now done natively.\n- Folders will now fully-expand if all tabs within them are visible. Folder animations has also been improved for smoother transitions.\n","reactions":{"total_count":49,"+1":18,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":20,"rocket":7,"eyes":0}}
