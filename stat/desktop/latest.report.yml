a account, you can now sync your Spaces, Folders, Tabs, and much more between devices! This can be enabled in Settings > Sync > Sync your Spaces across devices.\n- The chrome UI now has a better look and feel, implementing squircles and other design elements to make it more visually appealing.\n- A new on-boarding experience has been added to help new users get started with the browser and its features.\n- Creating a new Space is now faster and requires less animation wait time, making the process more efficient.\n- Containers can now be reordered in Settings, and the new order is used wherever containers are listed.\n\n## Fixes\n- Fixed live folders for GitHub issues not working with the new GitHub UI\n- Fixed Zen preventing Linux systems from going to sleep after a long browsing session.\n- Fixed arrow-key and Page Up/Down scrolling not working on some pages with embedded content from other sites.\n- Fixed live audio streams such as internet radio stopping when playing in the background.\n- Other bug fixes and improvements.\n\n## Changes\n- Font size has been increased for the sidebar text, making it easier to read and navigate through tabs and spaces.\n- Zen now uses firefox-portal-detection.com instead of detectportal.firefox.com to detect captive portals and check network connectivity, so network allowlists referencing the old domain need updating.\n- PDFs smaller than the paper size can now be enlarged to fill the sheet when printing, by setting the scale above 100%.\n","reactions":{"total_count":62,"+1":24,"-1":0,"laugh":3,"hooray":9,"confused":0,"heart":15,"rocket":8,"eyes":3}}
