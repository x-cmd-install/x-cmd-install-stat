kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":102643248,"digest":"sha256:75142191e0ad3380e485a39a3737b502e69cf30368fbb516b80e7e6f0b0f3a5f","download_count":601,"created_at":"2026-10-21T13:41:14Z","updated_at":"2026-10-21T13:41:19Z"},{"id":662638369,"node_id":"RA_kwDOLmfWBM4nfw8h","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":113405592,"digest":"sha256:ba81dd70af70d645f2f0a692f7fa4510f819290abfd8d8e60273d3d5a60d0536","download_count":21174,"created_at":"2026-10-21T13:41:14Z","updated_at":"2026-10-21T13:41:20Z"},{"id":662638355,"node_id":"RA_kwDOLmfWBM4nfw8T","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":238695703,"digest":"sha256:da410033b1bb334ba054850943a39fd364c74d368deba7eb19dc5e4f68420fad","download_count":40970,"created_at":"2026-10-21T13:41:14Z","updated_at":"2026-10-21T13:41:23Z"},{"id":662638378,"node_id":"RA_kwDOLmfWBM4nfw8q","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1078471440,"digest":"sha256:a14da36b6aa101a59794c7f7e29e3a00c1be0c5e0e53d9f6c05a06e1cb631064","download_count":82,"created_at":"2026-10-21T13:41:14Z","updated_at":"2026-10-21T13:42:00Z"}],"body":"# Zen Stable Release\n\n\n## Security\n- https://www.mozilla.org/en-US/security/advisories/mfsa2026-111/\n\n## New Features\n- Updated to Firefox 158.0.1\n- Boosts now have a 'focus' feature, allowing you to concentrate on a specific part of the website.\n- Windows builds now run with CSIR PGO, improving performance and startup times. All other platforms also have performance improvements.\n\n## Fixes\n- Mozilla blocked compromised eMudhra intermediate certificates via OneCRL on October 17th. The blocks were distributed to clients via Remote Settings the same day. This update contains the updated OneCRL block list, ensuring clients will block the compromised certificates even if RemoteSettings is disabled by policy or otherwise unavailable in the user's network environment. (<a href=\"https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/\"><b><u>Learn More</u></b></a>)\n- Fixed the sidebar hiding when the mouse is still over it. ([#15995](https://github.com/zen-browser/desktop/issues/15995))\n- Fixed devtools not appearing on glance tabs. ([#15261](https://github.com/zen-browser/desktop/issues/15261))\n- Boosts zap bar will now push the web contents up when activated. ([#13972](https://github.com/zen-browser/desktop/issues/13972))\n- Fixed sidebar scroll being reset when entering fullscreen. ([#14389](https://github.com/zen-browser/desktop/issues/14389))\n- Fixed multiple windows launching on startup on Linux and Windows. ([#12140](https://github.com/zen-browser/desktop/issues/12140))\n- Fixed a crash on Windows when printing or saving a page as PDF while a screen reader or other assistive technology was running.\n- Fixed an issue where Zen was opening windows on the wrong monitor in multi-monitor setups on Linux.\n- Fixed multiple media bars appearing when 2 or more tabs are using WebRTC.\n- Fixed an issue where files dragged into Firefox from other applications were not dropped onto the page on macOS.\n- External links will now be routed through the Space Routing feature on startup\n- More bug fixes and improvements.\n","reactions":{"total_count":37,"+1":13,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":13,"rocket":6,"eyes":0}}
