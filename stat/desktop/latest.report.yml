_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":104227420,"digest":"sha256:77c04bdb0575ab918c1d6f41d04a55996d2263824a0392dc1b3f38deb873a57a","download_count":863,"created_at":"2026-11-18T19:27:05Z","updated_at":"2026-11-18T19:27:12Z"},{"id":764695279,"node_id":"RA_kwDOLmfWBM4tlFLv","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":114438524,"digest":"sha256:dde4b4e44002128c2ff3efc56074e671c24effe56fd192ab2eee3972541e1a2d","download_count":29523,"created_at":"2026-11-18T19:27:05Z","updated_at":"2026-11-18T19:27:11Z"},{"id":764695282,"node_id":"RA_kwDOLmfWBM4tlFLy","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":240816809,"digest":"sha256:86f6a01e786095d7661c68357396a00cd3e169d6ae5e176245077bb701af8b65","download_count":51656,"created_at":"2026-11-18T19:27:05Z","updated_at":"2026-11-18T19:27:16Z"},{"id":764695276,"node_id":"RA_kwDOLmfWBM4tlFLs","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1088375013,"digest":"sha256:c165124818352f4a4dffd6454b70e8d63c017e2311f4c941a7ba6a3572ce51b4","download_count":605,"created_at":"2026-11-18T19:27:05Z","updated_at":"2026-11-18T19:27:51Z"}],"body":"# Zen Stable Release\n\n\n## Security\n- https://www.mozilla.org/en-US/security/advisories/mfsa2026-130/\n\n## New Features\n- Updated to Firefox 160.0.1\n- The copy URL and copy URL as Markdown shortcuts now copy the URLs of all selected tabs when multiple tabs are selected.\n\n## Fixes\n- Fixed boosts color tinting and controls not working. ([#16586](https://github.com/zen-browser/desktop/issues/16586))\n- Fixed closed browser and popup windows never being freed from memory, which made memory usage and pauses grow over time. ([#16587](https://github.com/zen-browser/desktop/issues/16587))\n- Switching spaces is now smooth when spaces use gradient themes, instead of being choppy. ([#13029](https://github.com/zen-browser/desktop/issues/13029))\n- Fixed tabs shown in a split view or behind a glance being unloaded when memory runs low. ([#16624](https://github.com/zen-browser/desktop/issues/16624))\n- Fixed Spaces Sync for spaces and pinned tabs assigned to the built-in containers (Personal, Work, Banking, Shopping) on profiles that don't have them. Missing containers are now created when needed. ([#16614](https://github.com/zen-browser/desktop/issues/16614))\n- Fixed the copy URL shortcut copying \"about:blank\" while a page is still loading. ([#16510](https://github.com/zen-browser/desktop/issues/16510))\n- Improved performance when opening new windows with mods installed. ([#16674](https://github.com/zen-browser/desktop/issues/16674))\n- Fixed thin lines in PDFs printing as thick black boxes on some printers on Windows.\n- Fixed PDFs, web page graphics, and WebGL content appearing blank or broken on Macs with AMD graphics, such as black cells in Google Sheets.\n- Fixed incorrect colors in WebGL and canvas content, such as games and Google Meet backgrounds, on some Linux systems using Wayland.\n- Fixed links on some sites, such as the Google Store, taking a very long time to load.\n- Fixed tabs crashing on some sites, most notably ChatGPT.\n- Fixed WebTransport connections being unable to send datagrams after a site sent many in quick succession.\n- Fixed trackpad and mouse swipes sometimes scrolling the page when a site had blocked scrolling.\n- More bug fixes and improvements.\n\n## Changes\n- The zoom level button is now hidden in the single toolbar layout. A toast shows the current zoom level when you change it instead.\n","reactions":{"total_count":30,"+1":19,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":8,"rocket":2,"eyes":0}}
