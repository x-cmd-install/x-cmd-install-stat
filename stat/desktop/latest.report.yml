 Sync your Spaces across devices.\n- You can now share Spaces, folders and split views to other Zen users and non-Zen users via a shareable link. This can be found in the context menu of a Space, folder or split view.\n\n## Fixes\n- Noticeably improved performance and battery usage while scrolling, and playing videos.\n- Other bug fixes and improvements.\n","reactions":{"total_count":32,"+1":4,"-1":0,"laugh":1,"hooray":6,"confused":0,"heart":15,"rocket":6,"eyes":0}}
