es\n- Changed session backup file names to use local dates ([#15806](https://github.com/zen-browser/desktop/issues/15806))\n- Fixed the library getting stuck after opening and closing it quickly ([#15833](https://github.com/zen-browser/desktop/issues/15833))\n- Fixed blocked/unsafe downloads not having the choice to be opened or saved. ([#15809](https://github.com/zen-browser/desktop/issues/15809))\n- Fixed moving multiple tabs to new window irrecoverably loses unloaded tabs. ([#15810](https://github.com/zen-browser/desktop/issues/15810))\n- Fixed the sidebar having too much minimum width when they are aligned to the right. ([#15794](https://github.com/zen-browser/desktop/issues/15794))\n- Fixed HEIC media being listed in the media tab but do not render correctly. ([#15778](https://github.com/zen-browser/desktop/issues/15778))\n- Fixed space-assigned bookmarks not being saved anymore. ([#12721](https://github.com/zen-browser/desktop/issues/12721))\n- Fixed a memory leak issue on startup.\n- Other bug fixes and improvements.\n","reactions":{"total_count":42,"+1":24,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":7,"rocket":7,"eyes":2}}
