{"id":388475743,"author":{"login":"graemerocher","id":66626,"node_id":"MDQ6VXNlcjY2NjI2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4XJ6tf","tag_name":"v5.2.2","target_commitish":"5.2.x","name":"Micronaut Core 5.2.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-14T15:00:45Z","updated_at":"2026-09-14T15:00:49Z","published_at":"2026-09-14T14:45:12Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### Bug Fixes \ud83d\udc1e\r\n* Register the physical signature of Kotlin suspend functions in the Graal reflection config by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13133\r\n* Answer 400 when a Publisher<CompletedFileUpload> part has no file name by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13124\r\n### Improvements \u2b50\r\n* Resolve the built-in body handlers' types once by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13139\r\n* Reduce cold startup work: no zip file system scans, lazy MediaType quality, no Loom probe by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13121\r\n* Look up optional netty types by name in the access log connection metadata by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13120\r\n* Only devolve the streams read in the current batch at read complete by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13148\r\n* Keep the open WebSocket sessions next to the channel group by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13143\r\n* Record per pipeline whether the access log handler is installed by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13142\r\n* Make the HTTP/2 connection receive window configurable by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13140\r\n### Docs \ud83d\udcd6\r\n* Document where request event listeners run and report slow ones by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13146\r\n### Other Changes \ud83d\udca1\r\n* HTTP/2 specification conformance and h2c pipeline wiring by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13100\r\n* Netty server pipeline configuration fixes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13101\r\n* Tidy up response and request lifecycle handling in PipeliningServerHandler by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13102\r\n* Four small correctness fixes in the HTTP server, Netty layer and form binding by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13104\r\n* Netty server bootstrap and shutdown fixes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13107\r\n* Cache parsed Accept header media type lists by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13108\r\n* Add JMH benchmarks for multipart, form, chunked and streaming JSON server scenarios by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13112\r\n* Do not retain lazy proxy targets as dependents of the proxy's context by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13131\r\n* Fix/12749 Jackson exception handling in core processor by @samikshathorat21 in https://github.com/micronaut-projects/micronaut-core/pull/13172\r\n* Handle absent optional HTTP/2 client configuration by @dlwhdgus0810 in https://github.com/micronaut-projects/micronaut-core/pull/13092\r\n* Let a refresh read the catalog it is rebuilding by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13168\r\n* Report annotation member defaults for Kotlin, Groovy and Python as for Java by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13160\r\n* Preserve annotation occurrence semantics in EvaluatedAnnotationMetadata by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13173\r\n* Answer a non-repeatable annotation from the annotation values by name by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13166\r\n* Describe a java.lang.reflect.Proxy through the interfaces it stands for by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13175\r\n* Add BeanConstructor.getTargetConstructor() and cache ExecutableMethod.getTargetMethod() by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13156\r\n* Read @Introspected.Property on the most derived declaration, for a proxy as for a class by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13181\r\n* Synthesize annotations of package private types by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13174\r\n* Fix duplicate Kotlin collection introspection properties by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13144\r\n* Bind the type arguments of super types two or more levels up through each level by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13138\r\n* Bind Python transitive supertype arguments by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13149\r\n* Release buffered HTTP/2 request data when the stream closes before read complete by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13182\r\n* Instantiate beans with a private injected constructor reflectively by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13136\r\n* Resolve Python compiler error dump directory lazily by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13184\r\n* Make StreamPressureSpec independent of the reader thread by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13186\r\n* Cache the Date header and access log timestamp per second; clear the access log request attribute by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13118\r\n\r\n## New Contributors\r\n* @dlwhdgus0810 made their first contribution in https://github.com/micronaut-projects/micronaut-core/pull/13092\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.1...v5.2.2","mentions_count":4}
