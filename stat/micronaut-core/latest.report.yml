{"id":418626051,"author":{"login":"sdelamo","id":864788,"node_id":"MDQ6VXNlcjg2NDc4OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4Y87oD","tag_name":"v5.2.17","target_commitish":"5.2.x","name":"Micronaut Core 5.2.17","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-20T16:36:22Z","updated_at":"2026-10-20T16:36:25Z","published_at":"2026-10-20T16:32:39Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### Bug Fixes \ud83d\udc1e\r\n* Ignore a Range request when the If-Range validator does not match by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/14020\r\n* Map the non-sealed modifier and skip unknown modifiers in Java elements by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13996\r\n* Answer 400 for a StreamingFileUpload without a form body by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13868\r\n### Improvements \u2b50\r\n* Python: warn about function-local classes GraalPy adapts to a Java type by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13832\r\n### Other Changes \ud83d\udca1\r\n* Python: restore the Extending Java Classes guide page by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13931\r\n* Describe @ReadableBytes configuration properties as byte sizes in JSON schemas by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13827\r\n* Let a client filter add a cookie to a raw request by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13435\r\n* Reuse the bootstrap context across environment refreshes by @radovanradic in https://github.com/micronaut-projects/micronaut-core/pull/13988\r\n\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.16...v5.2.17","mentions_count":3}
