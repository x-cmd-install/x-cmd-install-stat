{"id":441529604,"author":{"login":"sdelamo","id":864788,"node_id":"MDQ6VXNlcjg2NDc4OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4aUTUE","tag_name":"v5.2.23","target_commitish":"5.2.x","name":"Micronaut Core 5.2.23","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-11T11:19:36Z","updated_at":"2026-11-11T16:51:33Z","published_at":"2026-11-11T10:16:56Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n\r\nMicronaut Core 5.2.23 is a patch release with security fixes and framework improvements. It addresses 38 GitHub Security Advisories.\r\n\r\n## 🚨 Security fixes\r\n\r\n### HTTP server and routing\r\n\r\n- Isolate listeners and protect id-less management endpoints: [GHSA-c856-m48r-3gpc](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-c856-m48r-3gpc).\r\n- Harden the CORS localhost guard against spoofed forwarded headers and IPv6 loopback `Host` values: [GHSA-72p5-8f28-xwp2](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-72p5-8f28-xwp2), [GHSA-fv5h-6pjp-g363](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-fv5h-6pjp-g363).\r\n- Keep filters and route arguments from seeing different values for the same request: [GHSA-hm9j-m8h9-32v9](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-hm9j-m8h9-32v9).\r\n- Keep request-terminated events and pooled client continuations in their own propagated context: [GHSA-xh4x-vj47-4px7](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-xh4x-vj47-4px7).\r\n- Apply `@JsonView` to wrapped bodies, SSE events, and fallback writers: [GHSA-432j-9h93-pv45](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-432j-9h93-pv45).\r\n- Escape control characters in access log values: [GHSA-wgxm-75ph-q27x](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-wgxm-75ph-q27x).\r\n- Evaluate CORS preflight requests against the route serving the requested method: [GHSA-c79q-p83r-9vpm](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-c79q-p83r-9vpm).\r\n- Bound request parsing work and keep blocking calls off the event loop: [GHSA-jfwr-qrpq-5g48](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-jfwr-qrpq-5g48).\r\n- Prevent TLS listeners from serving plaintext while their SSL context is pending or has failed: [GHSA-35qg-26hc-qr84](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-35qg-26hc-qr84).\r\n- Run route-scoped filters for every request reaching the route: [GHSA-p72j-v3qh-v5mm](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-p72j-v3qh-v5mm).\r\n- Match filters against the path used by the router and static resource resolver: [GHSA-wcgp-mmwm-x2x2](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-wcgp-mmwm-x2x2).\r\n- Reset HTTP/3 request streams that fail or close early: [GHSA-6v2q-5rcc-qfmc](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-6v2q-5rcc-qfmc).\r\n- Enforce form limits across part headers, `Content-Length`, and tiny chunks: [GHSA-h2j4-vr48-c4vv](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-h2j4-vr48-c4vv).\r\n- Ensure context-path filters cover function and WebSocket routes and prefix-colliding paths: [GHSA-gj4v-r6x3-66jp](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-gj4v-r6x3-66jp).\r\n- Bound caches keyed by request-controlled values: [GHSA-jj39-pp85-xj49](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-jj39-pp85-xj49).\r\n- Correct connection lifecycle, idle-timeout, and HTTP/2 response framing behavior: [GHSA-82w6-g6gh-pjrv](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-82w6-g6gh-pjrv).\r\n- Release request body buffers and stop late-body loops when a route does not consume its body: [GHSA-wjxw-jjr4-4mqr](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-wjxw-jjr4-4mqr), [GHSA-8rrh-x2ch-p2vv](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-8rrh-x2ch-p2vv).\r\n- Release response buffers, streams, and compressors when responses are discarded or clients disconnect: [GHSA-5g2v-x779-wr6w](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-5g2v-x779-wr6w).\r\n- Prevent classpath resource resolution from following symlinks outside the configured base: [GHSA-5hmw-vf9q-xqhv](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-5hmw-vf9q-xqhv).\r\n- Close `StreamedFile` input streams when returning `304 Not Modified`: [GHSA-mjjj-6mx9-p8px](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-mjjj-6mx9-p8px).\r\n- Bound compressed request processing and reject truncated compressed bodies: [GHSA-2j79-mgc9-v76r](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-2j79-mgc9-v76r), [GHSA-hgj7-52cp-647p](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-hgj7-52cp-647p).\r\n- Fix multipart parser hangs and direct-memory leaks on malformed, truncated, or over-limit bodies: [GHSA-88m6-wjjg-mc7g](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-88m6-wjjg-mc7g).\r\n- Fail in-flight HTTP/2 request bodies and release buffered data when their stream closes: [GHSA-4j6j-v86m-5xv7](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-4j6j-v86m-5xv7).\r\n\r\n### HTTP clients\r\n\r\n- Bound HTTP client response sizes and timeouts for stalled bodies: [GHSA-j3jr-9qw4-m252](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-j3jr-9qw4-m252).\r\n- Release client buffers and connections after malicious or failing upstream responses: [GHSA-fr2f-ww99-xgcc](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-fr2f-ww99-xgcc).\r\n- Clear stale `Content-Length` state and prevent unsafe connection reuse after decode failures: [GHSA-wv7m-pmvh-98h9](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-wv7m-pmvh-98h9).\r\n- Isolate client cookies and credentials and prevent unsafe request-construction behavior: [GHSA-mfrv-8fw9-56vq](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-mfrv-8fw9-56vq).\r\n- Bound JSON stream element size and processing work: [GHSA-5pxm-5867-gjc9](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-5pxm-5867-gjc9).\r\n- Honor configured header filters on cross-origin redirects in the JDK HTTP client: [GHSA-9mfm-8wr5-m838](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-9mfm-8wr5-m838).\r\n- Do not forward request framing or hop-by-hop headers from relayed requests in the JDK HTTP client: [GHSA-64w5-89v4-549v](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-64w5-89v4-549v).\r\n\r\n### WebSockets and server-sent events\r\n\r\n- Harden WebSocket upgrade handling: [GHSA-gpxf-v9p3-4hh5](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-gpxf-v9p3-4hh5).\r\n- Close WebSocket connections after sending a close frame, including when the endpoint has no `@OnClose` handler: [GHSA-38pj-464p-88jf](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-38pj-464p-88jf).\r\n- Bound WebSocket inbound work and outbound waits: [GHSA-973f-vvmg-r76v](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-973f-vvmg-r76v).\r\n- Release WebSocket messages whose decoding fails: [GHSA-xccf-9g9p-4q66](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-xccf-9g9p-4q66).\r\n- Neutralize line breaks in server-sent event fields: [GHSA-596x-f5j6-xvhc](https://github.com/micronaut-projects/micronaut-core/security/advisories/GHSA-596x-f5j6-xvhc).\r\n\r\n## Improvements and fixes\r\n\r\n- Keep `@InjectScope` beans scoped to each creation, including nested and concurrent creations.\r\n- Keep runtime proxy target resolutions isolated, and deliver reactive signals with the propagated context bound.\r\n- Make propagated context entry and exit cheaper, and restore the previous context even when a thread element fails.\r\n- Prevent environment lookups from failing while the environment is starting.\r\n- Choose the highest-weight acceptable compression algorithm and never select an algorithm assigned `q=0`.\r\n- Avoid duplicate processing of executable methods by deprecated method processors.\r\n- Resolve `@Replaces` chains and allow replacements to satisfy the qualifiers of the beans they replace.\r\n- Resolve placeholders in `@Executable` annotation members separately for each application context.\r\n- Preserve Python object identity during conversion and support type-use annotation metadata without a native originating element.\r\n- Read Kotlin annotation defaults from the compiled annotation class when the current processing round has no usage.\r\n\r\n## Other changes\r\n\r\n- Improve test compatibility and stability for current JDK and Netty behavior, including retrying an external TLS test when the remote test service times out.\r\n\r\n[Full changelog](https://github.com/micronaut-projects/micronaut-core/compare/v5.2.22...v5.2.23)\r\n"}
