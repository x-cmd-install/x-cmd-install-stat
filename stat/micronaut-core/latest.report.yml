{"id":387096956,"author":{"login":"sdelamo","id":864788,"node_id":"MDQ6VXNlcjg2NDc4OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4XEqF8","tag_name":"v5.2.1","target_commitish":"5.2.x","name":"Micronaut Core 5.2.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-11T15:27:45Z","updated_at":"2026-09-11T15:27:48Z","published_at":"2026-09-11T14:20:22Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### Bug Fixes \ud83d\udc1e\r\n* Iterate the introspections in a stable order again by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13096\r\n* Keep a property's annotations to the type it is read through by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13099\r\n* Find beans compiled before their annotation was self-indexed by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13111\r\n### Other Changes \ud83d\udca1\r\n* Fix the two critical Sonar issues failing the 5.2.x quality gate by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13095\r\n* Only look up introspections in a class loader that shares the core types by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13109\r\n* Make BinaryWebSocketSpec join ordering deterministic by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13094\r\n* Serve the registered annotation type to a caller naming no class loader by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13114\r\n* Compare nested type arguments by type in equalsType and typeHashCode by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13115\r\n* Update managed-netty version to 4.2.18.Final by @sdelamo in https://github.com/micronaut-projects/micronaut-core/pull/13097\r\n\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.0...v5.2.1","mentions_count":3}
