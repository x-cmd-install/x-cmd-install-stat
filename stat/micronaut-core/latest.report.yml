{"id":427248033,"author":{"login":"radovanradic","id":10271067,"node_id":"MDQ6VXNlcjEwMjcxMDY3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4Zd0mh","tag_name":"v5.2.21","target_commitish":"5.2.x","name":"Micronaut Core 5.2.21","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-28T22:57:37Z","updated_at":"2026-10-28T22:57:40Z","published_at":"2026-10-28T22:16:07Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### Bug Fixes 🐞\r\n* Keep a property source added while the environment loads its configuration files after the next refresh by @radovanradic in https://github.com/micronaut-projects/micronaut-core/pull/14162\r\n* Keep lookups from failing while a property source is added to the running environment by @radovanradic in https://github.com/micronaut-projects/micronaut-core/pull/14167\r\n* Answer a streamed multipart body cut before its closing boundary with the bad request by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/14166\r\n* Answer a streamed request body over the size limit with 413 for a streaming response by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/14164\r\n* Delegate the default AnnotationMetadata methods of environment aware metadata to the backing metadata by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/14172\r\n* KSP: include the owner in KotlinNativeElement.hashCode by @bookernath in https://github.com/micronaut-projects/micronaut-core/pull/14180\r\n### Other Changes 💡\r\n* Type PollingConditions variables so eventually blocks assert their conditions by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13980\r\n* Process a property source added just before a refresh reads only once, in its order by @radovanradic in https://github.com/micronaut-projects/micronaut-core/pull/14171\r\n* Close disabled and rejected config importers by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/14182\r\n\r\n## New Contributors\r\n* @bookernath made their first contribution in https://github.com/micronaut-projects/micronaut-core/pull/14180\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.20...v5.2.21","mentions_count":5}
