{"id":404029656,"author":{"login":"graemerocher","id":66626,"node_id":"MDQ6VXNlcjY2NjI2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4YFQDY","tag_name":"v5.2.14","target_commitish":"5.2.x","name":"v5.2.14","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-05T19:02:38Z","updated_at":"2026-10-05T19:02:41Z","published_at":"2026-10-05T18:58:49Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### Bug Fixes \ud83d\udc1e\r\n* Preserve coroutine identity for Python introductions by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/13670\r\n* Fix abstract Python WebSocket client close operations by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/13668\r\n* Fix asyncio bridge behaviour without the Netty loop and for awaited Java values by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13657\r\n* Visit the Java class generated for a Python class once by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13659\r\n* Keep the Python bridge state of data classes out of their declared fields by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13660\r\n* Run async methods of Python singletons in their own context by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13661\r\n* Python: bind AOP proxy calls through the Python signature (defaults and keyword arguments) by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13665\r\n* Raise the original Python exception when awaiting an intercepted async def by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13666\r\n* Python: map positional-only parameters onto the generated Java method by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13672\r\n* Test async routes of explicitly scoped Python module scripts by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13671\r\n* Support native Python domain exceptions in typed handlers by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/13681\r\n* Python: invoke module-level functions once when converting the result by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13704\r\n* Follow the Reactive Streams contract in CancellableMonoSink by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13682\r\n* Treat every 1xx, 204 and 304 response as bodiless by status code by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13685\r\n* Give each pending acquire its own max-pending-acquires permit by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13684\r\n### Improvements \u2b50\r\n* Allow masked HTTP header tracing by logger name by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/13678\r\n* Support native Python Decimal interop by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/13696\r\n* Run native and Python CI after Java CI and Sonar pass by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13700\r\n### Other Changes \ud83d\udca1\r\n* Name imported bean definitions after their importer only by @alvarosanchez in https://github.com/micronaut-projects/micronaut-core/pull/13638\r\n* Cache the CORS origin patterns and per-route @CrossOrigin configurations by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13303\r\n\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.13...v5.2.14","mentions_count":5}
