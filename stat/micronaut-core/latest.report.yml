ut-core/pull/12891\r\n* Fix Python bridge casts for response subtypes by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/12895\r\n* Exclude BC dependencies by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12904\r\n* fix(aop): preserve toString behavior for lazy proxies by @Boulea7 in https://github.com/micronaut-projects/micronaut-core/pull/12875\r\n* Initialize parameterized Python config beans before builder injection by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/12907\r\n* Invoke @PreDestroy methods on beans with PRE_DESTROY advice by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12920\r\n* Fix an interceptor not matching a bean that leaves a binding member at its default by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12925\r\n* Compare the members of a qualifier built from an annotation instance by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12928\r\n* Allow a primitive type to be named among a bean's exposed types by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12927\r\n* Property cache issue by @msupic in https://github.com/micronaut-projects/micronaut-core/pull/12926\r\n* Leave @Primary out of composite qualifiers by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12945\r\n* Fix @InjectScope destruction for constructor parameters and prototype beans by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12934\r\n* Allow a runtime bean definition's factory to receive the resolution context by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12937\r\n* Honour the argument of RuntimeBeanDefinition.Builder.singleton(boolean) by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12946\r\n* Remove a bean from the scope map when a custom scope destroys it by @dstepanov in https://github.com/micro