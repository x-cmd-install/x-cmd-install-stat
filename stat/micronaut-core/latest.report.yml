{"id":386130418,"author":{"login":"graemerocher","id":66626,"node_id":"MDQ6VXNlcjY2NjI2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4XA-Hy","tag_name":"v5.2.0","target_commitish":"5.2.x","name":"Micronaut Core 5.2.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-10T08:59:01Z","updated_at":"2026-09-10T08:59:03Z","published_at":"2026-09-10T08:56:18Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### New Features \ud83c\udf89\r\n* Add RFC 10008 support (QUERY Method) by @desiderantes in https://github.com/micronaut-projects/micronaut-core/pull/12780\r\n* Derive configuration metadata documentation from Kotlin KDoc by @MariusVolkhart in https://github.com/micronaut-projects/micronaut-core/pull/12831\r\n* feat: add experimental Python support with GraalPy by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12843\r\n* Add Netty activation controls by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/12842\r\n* feat: add incremental Python and Java compilation by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12850\r\n* Support Python module annotations and JUnit 5 tests by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12881\r\n* Add cross-origin policy header configuration by @sdelamo in https://github.com/micronaut-projects/micronaut-core/pull/12914\r\n* Control the order in which singletons are destroyed by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12965\r\n* Let AbstractConcurrentCustomScope answer for a bean definition by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12969\r\n* Add language-neutral extension points for Scala integration by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12695\r\n* Retain the annotations a composed annotation introduces by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12968\r\n* Add the micronaut-reflection module by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12977\r\n* Compile a wildcard type argument to a WildcardArgument that keeps its bounds by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13023\r\n* Record on a bean introspection the type arguments a type binds in a super type by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13048\r\n* Support default parameters for languages other than Kotlin by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13041\r\n* Honour @Bean(preDestroy) on a bean class by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13066\r\n* Let a runtime bean definition declare its injection points by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13065\r\n* Keep the bounds of a type variable on the argument it compiles to by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13063\r\n* Add isInherited() method to AnnotationElement interface by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13053\r\n### Bug Fixes \ud83d\udc1e\r\n* Fix KSP2 crash writing aggregating outputs by @kamilkrzywanski in https://github.com/micronaut-projects/micronaut-core/pull/12805\r\n* Cache successful message lookups in ResourceBundleMessageSource by @el-psy-kongroo-d in https://github.com/micronaut-projects/micronaut-core/pull/12837\r\n* Fix bean introspection for OpenAPI generated $ref properties by @samikshathorat21 in https://github.com/micronaut-projects/micronaut-core/pull/12823\r\n* Diagnose concrete Java inheritance in native Python by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/12896\r\n* Propagate hasEvaluatedExpressions in DefaultAnnotationMetadata copies by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12975\r\n* Key a parameter's and a field's mutated metadata by the declaring type, not the type it is read through by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12971\r\n* Keep a generated introspection name usable as a file name by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12967\r\n* Resolve a repeatable annotation through its container in the by-name metadata queries by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12963\r\n* Return the resolved values from getAnnotationValuesByName by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12978\r\n* fix: handle discovery health without cache implementation by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12983\r\n* Fix NoSuchMethodError when instantiating a Python bean via a @Creator classmethod by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13033\r\n* Prefer an explicit @Head route over the implicit one derived from @Get by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13030\r\n* Fix the endless destruction of a per-bean-locked scope holding a bean it cannot take out by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13049\r\n* Resolve member-level @AnnotationExpressionContext in Kotlin by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13035\r\n* fix(cookie): parse request Cookie header as name/value pairs by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13054\r\n* Propagate the context of pre-matching filters into the route match by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13082\r\n* Publish a refreshed property catalog atomically by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13079\r\n* Don't instantiate an empty bean for an absent @QueryValue POJO by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13080\r\n* Add the SslHandler for every wss connection by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13085\r\n* Invoke the Kotlin $default method on the type that declares it by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13084\r\n### Improvements \u2b50\r\n* Fix KSP configuration interface inheritance by @sakshichitnis27 in https://github.com/micronaut-projects/micronaut-core/pull/12814\r\n* fix(http): @QueryValue object binding for @JsonProperty aliases with underscores by @samikshathorat21 in https://github.com/micronaut-projects/micronaut-core/pull/12803\r\n* Handle health status for endpoint base paths by @sakshichitnis27 in https://github.com/micronaut-projects/micronaut-core/pull/12812\r\n* Inherit HTTP/2 settings for service clients by @hutiefang76 in https://github.com/micronaut-projects/micronaut-core/pull/12800\r\n* reject header-injection characters in default cookie encoders by @kali834x in https://github.com/micronaut-projects/micronaut-core/pull/12753\r\n* fix: allow validated @Value constructor params without @Introspected by @arimu1 in https://github.com/micronaut-projects/micronaut-core/pull/12859\r\n* Add shared GraalPy context execution APIs by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12849\r\n* Preserve original Python sources for debugging by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12874\r\n* Fix native Python Throwable subclasses by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/12893\r\n* Allow disabling ImageSingletons lookups by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12894\r\n* Memoize repeated Resolver calls by @Nillerr in https://github.com/micronaut-projects/micronaut-core/pull/12897\r\n* Fix Python pooled request-body context conversion by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12942\r\n* Fix: Micronaut Python cannot start on a JVM without JVMCI by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12976\r\n* Make a field resolution segment a `FieldInjectionPoint` with no outer injection point by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12970\r\n* Let a custom scope lock bean creation per bean rather than for the whole scope by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12973\r\n* Destroy a proxy's retained interceptors from `destroyBean(Object)` by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12972\r\n* Expose the target constructor to constructor interceptors of proxied beans by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12959\r\n* Honour the route's executor for Kotlin suspend functions by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13032\r\n* Expose the beans predicate a context was built with by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13050\r\n* Cut annotation processor CPU by profiling the Java and Python pipelines by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13060\r\n* Add a JDT compiler test suite and fix three javac specific assumptions by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13070\r\n* Reject AOP advice on a sealed type at compile time by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13067\r\n* Let a method element be annotated through the default method annotation metadata by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13062\r\n* Copy all HTTP client configuration fields by @yawkat in https://github.com/micronaut-projects/micronaut-core/pull/12816\r\n* Resolve a type argument bound at an intermediate generic super type by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13081\r\n* Tell a raw type apart from a usage written with a type variable by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13086\r\n* Add extensible response header populators by @sdelamo in https://github.com/micronaut-projects/micronaut-core/pull/12992\r\n### Docs \ud83d\udcd6\r\n* Update JDK setup requirements by @sdelamo in https://github.com/micronaut-projects/micronaut-core/pull/12844\r\n* docs: document Python threading configuration by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/12984\r\n* Document retaining composed annotations by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12989\r\n* docs: fix guide errors and fill in missing language snippets by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13034\r\n* Document immutable configuration with record-like types by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13057\r\n### Dependency updates \ud83d\ude80\r\n* Update bytebuddy to v1.18.11 by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core/pull/12785\r\n* Update dependency ch.qos.logback:logback-classic to v1.5.38 by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core/pull/12811\r\n* Update dependency com.github.javaparser:javaparser-symbol-solver-core to v3.28.2 by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core/pull/12819\r\n* Update dependency com.uber.nullaway:nullaway to v0.13.8 by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core/pull/12824\r\n* Update Micronaut dependencies by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core/pull/12736\r\n* Update dependency com.squareup.okio:okio to v3.18.0 by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core/pull/11549\r\n* Update actions/setup-java digest to 03ad4de by @renovate[bot] in https://github.com/micronaut-projects/micronaut-core