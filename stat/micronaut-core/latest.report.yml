{"id":433878318,"author":{"login":"sdelamo","id":864788,"node_id":"MDQ6VXNlcjg2NDc4OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4Z3HUu","tag_name":"v5.2.22","target_commitish":"5.2.x","name":"Micronaut Core 5.2.22","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T13:55:01Z","updated_at":"2026-11-04T13:55:04Z","published_at":"2026-11-04T12:17:02Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### Bug Fixes 🐞\r\n* Cache exception handler lookups instead of re-resolving and contending on every error by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/14212\r\n* Preserve Python exceptions across synchronous AOP calls by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/14224\r\n* Parse X-Forwarded-Host like the Forwarded host by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/14243\r\n### Dependency updates 🚀\r\n* Update Netty to 4.2.20.Final by @sdelamo in https://github.com/micronaut-projects/micronaut-core/pull/14253\r\n### Other Changes 💡\r\n* Bind the default locale to Locale arguments when the request has none by @sharanggupta in https://github.com/micronaut-projects/micronaut-core/pull/14102\r\n* Give inject-java's Groovy test compilation a 3 GB compiler daemon of its own by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/14187\r\n* Retry failing repository requests longer before Gradle gives up on the repository by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/14188\r\n* Expand Iterable and array values passed to UriBuilder.queryParam into… by @sdelamo in https://github.com/micronaut-projects/micronaut-core/pull/14197\r\n\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.21...v5.2.22","mentions_count":4}
