{"id":392964084,"author":{"login":"graemerocher","id":66626,"node_id":"MDQ6VXNlcjY2NjI2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB2eaPM4XbCf0","tag_name":"v5.2.3","target_commitish":"5.2.x","name":"Micronaut Core 5.2.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-21T13:41:22Z","updated_at":"2026-09-21T13:41:25Z","published_at":"2026-09-21T13:01:17Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at 5.2.x -->\r\n\r\n## What's Changed\r\n### New Features \ud83c\udf89\r\n* Python-native streaming: async for over publishers, async generators as publishers by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13208\r\n### Bug Fixes \ud83d\udc1e\r\n* Fix NPE in PythonContextRuntime.helper when contexts start concurrently by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13200\r\n* Python: do not generate the is-getter of a boolean @property twice by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13205\r\n* Survive a missing netty in LeakTracker.Factory.staticInitializer by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13191\r\n* Subtract handed-off bytes from the shared buffer size count by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13106\r\n* Python: constructor-injected async beans and awaited Python beans in event-loop contexts by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13206\r\n* Python: merge source and Java package initializers, report duplicate types and skipped sources by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13204\r\n* Python: bridge same-arity Java overloads, map *args to varargs, select Collection/byte[] overloads for list/bytes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13207\r\n* Python: bridge overrides of inherited Java methods with the inherited signature by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13209\r\n* Python: generate valid stubs for generic Java signatures by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13211\r\n* Python: only treat @Bean-stereotyped methods of a @Factory as factory methods by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13215\r\n* Python: compile introduction types with only abstract methods to Java interfaces by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13216\r\n* Python: report the implicit constructor as primary constructor and derive element modifiers by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13217\r\n* Python: load the runtime module once under the import lock by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13218\r\n* Python: bytes type arguments as byte[] and reactive return type adaptation by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13219\r\n* Python: resolve nested Java types as decorators, Annotated metadata and imports by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13220\r\n* Python: forward super constructor arguments and messages of Python exception subclasses to the Java base by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13221\r\n* Python: no-arg constructor for all-default dataclasses, untyped class attributes and constants in decorator members by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13223\r\n* Python: propagate the Reactor context into publishers and coroutines returned by Python code by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13224\r\n* Python: decide decorator forms and placeholder bodies from the source by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13225\r\n* Python: expose Java interface default methods on Python implementations by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13227\r\n* Python: bind imported Java classes to the host class at run time by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13230\r\n* Python: nested application contexts keep the enclosing runtime, generated classes are persistable by EclipseStore by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13231\r\n* Python: scoped proxies, nested member types and JVM-wide services of generated classes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13232\r\n* Python: map keys, nullable bytes, subclass wrappers, missing and star imports, nested constants by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13234\r\n* Python: visitor and annotation mapper integration fixes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13241\r\n* Give ConcurrentFormTransferSpec.uploadTest a timeout that only catches a hang by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13185\r\n* Keep draining a request body the server has already rejected by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13255\r\n* Charge the declared Content-Length once on the HTTP/2 request path by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13256\r\n### Improvements \u2b50\r\n* Keep buffered body pieces in place, size the JSON output buffer and parse the form type once by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13129\r\n* HTTP server TCK: body framing, request size limit, cookie attributes, Content-Length; Vary is only CORS when it names Origin by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13147\r\n* Resolve Java packages under io.* other than io.micronaut by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13238\r\n* Python: initialize the Python runtime on demand before the @Context bean by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13203\r\n* Python: resolve keyword-safe member aliases on Java objects returned at runtime by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13210\r\n* Python: copy runtime annotations onto the generated Java class for reflection-based frameworks (JPA) by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13212\r\n* Python: pass Java collections by reference and make introspected Python classes Serializable by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13213\r\n* Python: dataclass stubs - inheritance, interface accessors, equality and generic attributes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13214\r\n* Python: select functional interface overloads by lambda arity by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13226\r\n* Python: Python classes as Class arguments, wrapper views in Python, numeric overload guard by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13233\r\n* Python: implicit validation advice and self-invocations through the proxy by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13239\r\n* JSON handling correctness fixes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13103\r\n### Other Changes \ud83d\udca1\r\n* Add a JMH benchmark for streaming a Flux of records by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13192\r\n* Cache Jackson readers and writers per type by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13195\r\n* Cache MediaType.isTextBased by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13194\r\n* Remove netty server classes left behind by earlier rewrites, keeping the two micronaut-spring still needs by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13105\r\n* Python: declare the compiler helper before the inner class loader type by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13247\r\n* Python: bridge every public method of a generated class and copy @ExtendWith test annotations by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13228\r\n* Python: compile imports across source roots and merge the package files of every root by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13229\r\n* Python: extend Java classes from Python classes by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13242\r\n* Python: shim packages import their subpackages on first access instead of eagerly by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13249\r\n* Tokenize Accept-Encoding in place with scans bounded to the entry by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13193\r\n* Let a buffer consumer receive the final bytes and the completion as one signal by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13190\r\n* Write the trailing bytes of a streamed response as part of the terminating message by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13196\r\n* Use the shared Python compiler Gradle plugin from micronaut-build by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13198\r\n* Python: serve imported Java packages and annotations at run time without generated shim modules by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13250\r\n* Propagate the exception of a reflectively dispatched executable method by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13132\r\n* Python: gate the reflection data of generated classes behind micronaut.introspection.allow-reflection by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13252\r\n* Close the undelivered copies when a combined add-and-complete fails by @graemerocher in https://github.com/micronaut-projects/micronaut-core/pull/13253\r\n* Introspect Groovy records compiled from source through their record accessors by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13258\r\n* Python: compiler baseline: an opt-in compilation profile, no trivial property hook overrides, mixed-package end-to-end test by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13251\r\n\r\n\r\n**Full Changelog**: https://github.com/micronaut-projects/micronaut-core/compare/v5.2.2...v5.2.3","mentions_count":6}
