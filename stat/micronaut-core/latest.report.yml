l fast when adding a method definition after inheriting the super ones by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13000\r\n* Do not break a destruction cycle at a bean the cycle requires by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13005\r\n* Destroy singletons created during context shutdown by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13007\r\n* Do not lose a bean created while a per-bean-locked scope shuts down by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13008\r\n* Inherit the active environment in GraalPy contexts by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/13011\r\n* Enumerate beans by their @Indexed types even when not implemented by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/12960\r\n* Do not derive an interceptor binding for a kind that is already declared by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13001\r\n* Register binder constructors for native images by @n0tl3ss in https://github.com/micronaut-projects/micronaut-core/pull/12986\r\n* Three unrelated cleanups in inject, inject-python and inject-kotlin by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13003\r\n* Four fixes from a deep analysis pass: interceptor member binding, PowerPoint media type, unsafe publication, header name validation by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13004\r\n* Reject header values holding a character above U+00FF by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13002\r\n* Invoke the pre-destroy method of a proxied factory-produced bean by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13015\r\n* Register the proxy synthesize() actually creates for DYNAMIC_PROXY annotations by @dstepanov in https://github.com/micronaut-projects/micronaut-core/pull/13014\r\n*