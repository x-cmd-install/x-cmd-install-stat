{"id":420183457,"author":{"login":"jelmer","id":49032,"node_id":"MDQ6VXNlcjQ5MDMy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB-NI1s4ZC32h","tag_name":"brz-3.3.23","target_commitish":"main","name":"3.3.23","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-22T00:28:13Z","updated_at":"2026-10-22T00:28:35Z","published_at":"2026-10-22T00:28:35Z","assets":[],"body":" * Add Python 3.15 support. (Jelmer Vernooĳ)\n\n * launchpad: Fix authorization engine creation against newer\n   launchpadlib, which made `Launchpad.authorization_engine_factory`\n   take keyword arguments only. Enumerating forges raised `TypeError`\n   before this. (Zainab Mehmut)\n\n * gitlab: Report the name of the project that was asked for when it does\n   not exist. `NoSuchProject` carried `None` instead.\n   (Zainab Mehmut)\n\n * Let `-r date:` select the newest revision in a branch. The bisect\n   stopped one short of the tip, so when only the newest revision came\n   after the date, `date:` reported no such revision.\n   (Jelmer Vernooĳ)\n\n * Fix opening a colocated branch whose name holds `/`. The\n   `user_url` of such a branch could not be opened. `brz info`\n   shows such a name decoded. (Zainab Mehmut)\n\n * git: Free a dropped repository or branch at once, so its `.pack`\n   and `.idx` files are closed without waiting for Python's cycle\n   collector.\n   (Zainab Mehmut)\n"}
