{"id":438591331,"author":{"login":"jelmer","id":49032,"node_id":"MDQ6VXNlcjQ5MDMy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOB-NI1s4aJF9j","tag_name":"brz-3.3.25","target_commitish":"main","name":"brz-3.3.25","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-08T23:19:11Z","updated_at":"2026-11-08T23:19:24Z","published_at":"2026-11-08T23:19:24Z","assets":[],"body":" * git: Clone submodules whose URL is scp-like (`git@example.com:team/lib.git`) or starts with `ssh://`, using `git+ssh`.\n * Read chunked HTTP responses to their end before reusing the connection. This fixes `brz push` of large git branches, mostly over HTTPS.\n * Do not resend a request whose body came from an already consumed iterator or file; a push sent an empty pack.\n * gitlab: Accept numeric project ids.\n * git: Ignore peeled `^{}` lines in `info/refs` over dumb HTTP. Branching a repository with an annotated tag failed with `RefFormatError`.\n * `workspace.check_clean_tree` no longer hashes files inside `.gitignore`'d directories on git working trees.\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
