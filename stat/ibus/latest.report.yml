,"label":null,"uploader":{"login":"fujiwarat","id":105929,"node_id":"MDQ6VXNlcjEwNTkyOQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":89,"digest":"sha256:dea9d130ddceb99cae11e73a0996bb225ee82f4eacffda89673dde4a97a6ea4e","download_count":1,"created_at":"2026-09-22T12:01:52Z","updated_at":"2026-09-22T12:01:53Z"}],"body":"IBus 1.5.35 RC1 implements several features and fixes some critical issues:\r\n- Build with Meson 1.5 or later\r\n- Support XKB latch keys in Wayland input-method\r\n- Support use-system-keymap setting in Wayland input-method\r\n  - This option is available in `ibus-setup` utility and usuful in case you use no modifier key as control key like Games, VIM, Qt no-modifier shortcut keys(\"Ctrl+E,4\")\r\n- Support forwarding key events in Wayland input-method V2\r\n\r\nThank you for the code and translation contributions.\r\n\r\nMeson build (Meson version 1.5 or later)\r\n- [ibus-1.5.35-rc1.tar.xz](https://github.com/ibus/ibus/releases/download/1.5.35-rc1/ibus-1.5.35-rc1.tar.xz)\r\n\r\nAutomake build\r\n- [ibus-1.5.35-rc1.tar.gz](https://github.com/ibus/ibus/releases/download/1.5.35-rc1/ibus-1.5.35-rc1.tar.gz)\r\n\r\n\r\nFeatures & Bug Fixes:\r\n- Implement Meson support  9d4863fb  bc6a4856 c0d1e324  013ff73e  2e901bb7 59cccd32 2c29673d b9b2a93c 63691396 33a1916d 87087955 26aaf13b 6a7ddfb4 4e0a3420 d8240a45 4e0a3420 d8240a45 25f693ae 56e84af4 7b1f2e4b a1387a8e 9d17552f 2534675c 38b65836 041d1821\r\n- Support use-system-keymap setting in Wayland input-method cbaffca2 6796a3dc ce066c8d 3796af72\r\n- Support XKB latch keys in Wayland input-method 84aaf61f df8230ff 056b3e59 22ca37a5 b60b5404 00abb9bf 232c4ac5\r\n- Support forwarding key events in Wayland input-method V2 0dfc7e0d\r\n- Fix `ibus` command in Plasma Wayland 6.7 06e1978f fdcb903a 72f915a9\r\n- Update ibusunicodegen.h with Unicode 18.0.0 e754f011\r\n- Fix build issues 6d3a98b9 9e3e3e34 81ac95ed ac3a9177 d60f1628 7b907a63 9bdc9176 e27e3ea3 859433f9 287317d3 8a18a53e 067de1c2\r\n- Fix CI issues 44e22e5e 1a0d9a6b 68e1dcc7 c0e290db 3d5ee47e 6b8ad533 e675040e \r\n- Fix GTK4 SEGV in Xorg c534999a\r\n- Call setlocale() in ibus-x11 aeca3e88\r\n- Disable Unicode input with Ctrl-Shift-u twice 3768387b\r\n\r\nCode Contributors:\r\n- Support Meson build system (Niels De Graef) 369bebc6\r\n- Support forwarding key events in Wayland input-method V2  (Danny Milosavljevic) 58b74bd7\r\n- Fix Wayland issues (Danny Milosavljevic) a8ff7559 18d8e37e 06b073df 72b09de3 e8d36baa a32d034f ad28e5e4 12f8ac51 34279955 6139d1a2\r\n- Fix some logics  (Danny Milosavljevic) 614eb098 41f36c09 61397c70\r\n- Fix a memory leak in Emoji feature  (matiwari) 526e509b\r\n- Make an IBusText own an updated IBusAttrList reference (Tianhao Chai) 5bbe88a1\r\n- Normalize sender when removing match rules (Christian Hergert) a67d95be\r\n- Use env shebangs in python scripts for portability (Zopolis4) 3e6d0c93\r\n- Fix IBusAttrList leak when converting text (Sebastian Keller) 1a331e69\r\n- Fix use-after-free when an engine request is cancelled (Jianfei Guo) 14ec1665\r\n\r\nTranslation Contributors:\r\n- po: Update translation (Indonesian) (Arif Budiman) 3f3f76f1\r\n- po: Update translation (Portuguese) (Am\u00e9rico Monteiro) 2dfa6e0d e10e23e8\r\n- po: Update translation (Czech) (Jonas Hubeny) 0775d13d\r\n- po: Update translation (Czech) (Pavel Borecki) 824733b2\r\n- po: Update translation (Italian) (Ali Ciloqlu) 39190959\r\n- po: Update translation (Italian) (Nathan) 4db865d7\r\n- po: Update translation (Serbian) (\u041c\u0430\u0440\u043a\u043e \u041a\u043e\u0441\u0442\u0438\u045b (Marko Kosti\u0107)) 85c44641\r\n- po: Update translation (Finnish) (Ricky Tigg) 5cd896e7\r\n- po: Update translation (French) (Julien Humbert) 99d92e01\r\n- po: Update translation (Lao) (Bone NI) 14f8dd25\r\n- po: Update translation (Kabyle) (ButterflyOfFire) 5272e56f\r\n- po: Update translation (Greek) (Jim Spentzos) 5fed1394\r\n- po: Update translation (Polish) (Nik Nikovsky) 8cbc4f15\r\n- po: Update translation (Spanish) (Fco. Javier F. Serrador) 3792626c\r\n- po: Update translation (Russian) (Andrei Stepanov) 432b2937\r\n- po: Update translation (Estonian) (Priit J\u00f5er\u00fc\u00fct) c1a2005d\r\n- po: Update translation (Danish) (Alan01) ddc1f3a8\r\n\r\n**Full Changelog**: https://github.com/ibus/ibus/compare/1.5.34...1.5.35-rc1","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
