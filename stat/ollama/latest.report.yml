47Z","updated_at":"2026-11-06T01:34:54Z"},{"id":715495465,"node_id":"RA_kwDOJ0Z1Ps4qpZgp","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1689667936,"digest":"sha256:106ef3d2a02437810fba6f574914b1413c512ea84ddd4f184c8e7f434b6f5564","download_count":41718,"created_at":"2026-11-06T01:34:46Z","updated_at":"2026-11-06T01:35:40Z"},{"id":715497607,"node_id":"RA_kwDOJ0Z1Ps4qpaCH","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:d2c12adac14461645748e9ee9c19d43c05cac944a785f30e65c49d089c0968aa","download_count":594,"created_at":"2026-11-06T01:35:41Z","updated_at":"2026-11-06T01:35:41Z"}],"body":"## MiMo V2.6\r\n\r\nXiaomi MiMo's [mimo-v2.6](https://ollama.com/library/mimo-v2.6), a 9B model built for code and agent workflows, is now supported in Ollama.\r\n\r\n```sh\r\nollama run mimo-v2.6\r\n```\r\n\r\n## AutoTrust decision models\r\n\r\n[AutoTrust](https://ollama.com/library/autotrust-jev) decision models read text and return choices, yes or no probabilities, and ratings for the questions you supply. The family includes 9b, 35b, and 27b-vl sizes — the 35b and 27b-vl sizes can also read images.\r\n\r\n```sh\r\nollama run autotrust-jev \"A customer says their card was charged twice.\" --ask \"Is this a billing issue?\"\r\n```\r\n\r\nNote: autotrust-jev is supported on Apple silicon in this release.\r\n\r\n## What's Changed\r\n\r\n - ollama launch now supports Kimi Code CLI — the successor to kimi-cli — and offers to migrate existing kimi-cli setups\r\n - ollama launch now fills in Pi's model list automatically so models can be picked inside Pi, and Claude Desktop's model\r\n   picker shows Ollama's actual model names\r\n - Recurrent and vision GGUF models can now serve more than one request at a time\r\n - Qwen3 and Qwen3.5 models using long-context (YaRN) scaling\r\n - Running ollama with no arguments opens the welcome launcher\r\n\r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.40.14...v0.40.15","reactions":{"total_count":14,"+1":13,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
