rs made their first contribution in https://github.com/ollama/ollama/pull/18814\r\n* @chenlichao made their first contribution in https://github.com/ollama/ollama/pull/18233\r\n\r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.40.0...v0.40.1-rc0","reactions":{"total_count":5,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
