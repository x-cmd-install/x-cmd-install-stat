11-21T03:37:59Z","updated_at":"2026-11-21T03:38:07Z"},{"id":774305126,"node_id":"RA_kwDOJ0Z1Ps4uJvVm","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1857946272,"digest":"sha256:2eeb9ff7ef83902b5d48562dbaf0af5489829c3d52435fb8067ddad23cb33c65","download_count":212148,"created_at":"2026-11-21T03:37:58Z","updated_at":"2026-11-21T03:38:41Z"},{"id":774306598,"node_id":"RA_kwDOJ0Z1Ps4uJvsm","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:dc2f480e48d4f8dfd37d127e6a54347cf7f3fd80a52beb1e1ca611d47bdf4dcd","download_count":3479,"created_at":"2026-11-21T03:38:42Z","updated_at":"2026-11-21T03:38:42Z"}],"body":"## Inkling 2 Mini\r\n[Inkling 2 Mini](https://ollama.com/library/inkling-2-mini) from Thinking Machines is a 26B parameter model with 5.4B active.\r\n\r\nIts looped layers give it more computation per token than its size suggests, and it still fits on a Mac at about 20GB. It handles text and images, tool calls, and thinking, and scores 79.2% on SWE-Bench Verified).\r\n\r\n```\r\n  ollama run inkling-2-mini\r\n```\r\n\r\nNote: inkling-2-mini is supported on Apple silicon only in this release.  PC support will follow in an upcoming release.\r\n\r\n ## What's Changed\r\n- `ollama launch claude` supports Claude Code's deferred tool loading, so MCP tools are loaded when needed instead of all at\r\nonce\r\n- Ollama on Apple silicon now serves multiple requests at once.\r\n- `ollama launch opencode` sets thinking options from the model's metadata\r\n- `ollama launch pi` refreshes Pi's model list after sign-in and passes along prompt arguments\r\n- `ollama launch chatgpt --restore` asks before switching an active profile and preserves existing settings and chat history;\r\n quitting ChatGPT yourself now lets it exit through its own quit prompt\r\n- Running `ollama` with no arguments in a non-interactive shell prints help instead of erroring\r\n- Ctrl+C or Ctrl+G while in a multiline `\"\"\"` block leaves multiline mode instead of swallowing the next line\r\n- Changing the context shift setting no longer reloads the model\r\n- Vulkan now uses mmap for integrated GPUs, fixing `Failed to allocate pinned memory` load failures on shared-memory GPUs\r\n- On Windows iGPUs, partially offloaded models no longer fail to allocate the KV cache\r\n- Tool definitions passed through the API keep JSON schema keywords Ollama doesn't model instead of dropping them\r\n- Disabling thinking now maps to the model's lowest supported reasoning level rather than being ignored\r\n- Source builds can use prebuilt MLX-C and XGrammar binaries\r\n\r\n    **Full Changelog**: https://github.com/ollama/ollama/compare/v0.40.16...v0.40.17-rc3","reactions":{"total_count":33,"+1":19,"-1":0,"laugh":2,"hooray":5,"confused":0,"heart":2,"rocket":4,"eyes":1}}
