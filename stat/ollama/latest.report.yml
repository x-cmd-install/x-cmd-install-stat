Z","updated_at":"2026-09-22T19:04:11Z"},{"id":582047975,"node_id":"RA_kwDOJ0Z1Ps4isVjn","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1570198936,"digest":"sha256:fe1cce219b07ba13982a9419bfa3697c911bf77667ee636c967baed1b06ee3a0","download_count":59705,"created_at":"2026-09-22T19:04:03Z","updated_at":"2026-09-22T19:04:50Z"},{"id":582049359,"node_id":"RA_kwDOJ0Z1Ps4isV5P","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:141291a7339affb0b6ad0f1c0f8c996b6678d7542c4ef429063f7eb495911665","download_count":528,"created_at":"2026-09-22T19:04:50Z","updated_at":"2026-09-22T19:04:51Z"}],"body":"## What's Changed\r\n\r\n`GET /api/show` now advertises each model's thinking controls and default:\r\n\r\nAvailable in the CLI with:\r\n```\r\nollama show gemma4\r\n```\r\n\r\n```\r\n    thinking\r\n        levels     false, true\r\n        default    true\r\n```\r\n\r\nAvailable in the API with:\r\n```sh \r\ncurl http://localhost:11434/api/show -d '{\"model\": \"glm-5.3-flash:cloud\"}'\r\n```\r\n\r\n```json\r\n{\r\n  \"thinking\": {\r\n    \"values\": [\"low\", \"high\", \"max\"],\r\n    \"default\": \"max\"\r\n  }\r\n}\r\n```\r\n\r\nAlso available on ollama.com directly for cloud models.\r\n\r\n* **Nemotron H** vision models are now supported on Apple Silicon with MLX\r\n* Ollama's macOS app will now no longer reopen windows you've closed when activating it\r\n* Fix for model pulls from HuggingFace\r\n\r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.34.2...v0.34.3","reactions":{"total_count":35,"+1":19,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":1,"rocket":8,"eyes":3}}
