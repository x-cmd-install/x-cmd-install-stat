Z","updated_at":"2026-09-15T19:24:29Z"},{"id":566349756,"node_id":"RA_kwDOJ0Z1Ps4hwc-8","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1570506608,"digest":"sha256:a92986c86ab6854675ffd1b725db7c0350d40755895c95c397c58d61014e14d9","download_count":60031,"created_at":"2026-09-15T19:24:22Z","updated_at":"2026-09-15T19:25:10Z"},{"id":566349401,"node_id":"RA_kwDOJ0Z1Ps4hwc5Z","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:b52870f305bb43f7dc6aa2c9c22ebac27b8a4793fd458e209dd95e5e1114c51b","download_count":343,"created_at":"2026-09-15T19:24:09Z","updated_at":"2026-09-15T19:24:09Z"}],"body":"## What's Changed\r\n* MLX safetensors `ollama create` no longer experimental.  GGUF model creation now requires using llama.cpp tooling for safetensor conversion and quantization.\r\n* Improved MLX memory handling on Apple Silicon\r\n* Runaway repeat token detection now requires 100 repeat tokens for reduced false positives (e.g. OCR)\r\n* `/api/tags` is much faster on large model libraries (3.1 s \u2192 294 ms cold in testing), and model capabilities are now reported consistently.\r\n* Deprecated `typical_p`: it can no longer be set when creating new models, existing GGUF models retain support.\r\n* MLX and llama.cpp updates\r\n\r\n\r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.34.0...v0.34.1-rc1","reactions":{"total_count":24,"+1":23,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
