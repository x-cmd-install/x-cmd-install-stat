Z","updated_at":"2026-09-29T01:53:12Z"},{"id":596942529,"node_id":"RA_kwDOJ0Z1Ps4jlJ7B","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1571105888,"digest":"sha256:92e45c3518daf7d4ea60480896ee7bdb1bed71381593cfc9f2d7c1ceb941efde","download_count":40996,"created_at":"2026-09-29T01:53:04Z","updated_at":"2026-09-29T01:53:55Z"},{"id":596945137,"node_id":"RA_kwDOJ0Z1Ps4jlKjx","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:9f5c94636d06e93d1ad8a1f2386018b906dc4d7c9ff96d57efb01933d5f176a1","download_count":391,"created_at":"2026-09-29T01:54:15Z","updated_at":"2026-09-29T01:54:15Z"}],"body":"## Decision models\r\n\r\nOllama now supports decision models through `/v1/systemone`, based on [TypeSafe\u2019s Jev API](https://typesafe.ai).\r\n\r\nDecision models return choices, probabilities, and scores instead of text. Use them for tasks such as ticket triage, model routing, and content classification.\r\n\r\nAvailable models:\r\n- [**Nimble**](https://ollama.com/library/nimble) from Bespoke Labs\r\n- [**Tev1**](https://ollama.com/library/tev1) from Together AI\r\n\r\n```sh\r\nollama pull nimble\r\n```\r\n\r\nSend context and one or more questions:\r\n\r\n```sh\r\ncurl http://localhost:11434/v1/systemone \\\r\n  -H 'Content-Type: application/json' \\\r\n  -d '{\r\n    \"model\": \"nimble\",\r\n    \"state\": \"Our checkout has returned 500 errors since 9am.\",\r\n    \"questions\": {\r\n      \"label\": {\r\n        \"type\": \"choice\",\r\n        \"instructions\": \"Which label fits this ticket?\",\r\n        \"criteria\": {\r\n          \"billing\": \"Payments and refunds\",\r\n          \"bug\": \"Software errors\",\r\n          \"account\": \"Login and account access\"\r\n        }\r\n      }\r\n    }\r\n  }'\r\n```\r\n\r\nExample response:\r\n\r\n```json\r\n{\r\n  \"model\": \"nimble\",\r\n  \"answers\": {\r\n    \"label\": {\r\n      \"type\": \"choice\",\r\n      \"choice\": \"bug\",\r\n      \"probabilities\": {\r\n        \"billing\": 0.0125,\r\n        \"bug\": 0.9781,\r\n        \"account\": 0.0093\r\n      },\r\n      \"confidence\": 0.8906\r\n    }\r\n  },\r\n  \"usage\": {\r\n    \"input_tokens\": 174,\r\n    \"output_tokens\": 1\r\n  }\r\n}\r\n```\r\n\r\nThe API supports three question types:\r\n- `choice`: Select an option and return probabilities for each.\r\n- `noul`: Return the probability that a condition is true.\r\n- `score`: Return a score across an ordered set of criteria\r\n\r\n## What's Changed\r\n\r\n- Settings now opens without waiting for model discovery.\r\n- Fixed the macOS update menu and icon not reflecting an available update at startup.\r\n- Fixed stalled MLX model downloads hanging indefinitely.\r\n- Requests containing the deprecated `typical_p` parameter now log a warning instead of failing.\r\n\r\n**Full Changelog:** https://github.com/ollama/ollama/compare/v0.34.4...v0.35.0","reactions":{"total_count":29,"+1":15,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":3,"rocket":6,"eyes":0}}
