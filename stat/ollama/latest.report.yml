","updated_at":"2026-10-21T21:28:08Z"},{"id":663838143,"node_id":"RA_kwDOJ0Z1Ps4nkV2_","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1658535520,"digest":"sha256:777f775abb9458ece249f8721db816ac38f7c457767843120ce4fb3d01380b56","download_count":54472,"created_at":"2026-10-21T21:28:00Z","updated_at":"2026-10-21T21:28:47Z"},{"id":663839880,"node_id":"RA_kwDOJ0Z1Ps4nkWSI","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:3a1e4581d43c3370e77f3c6d4952c47cedc18074f507b46a6a4f1f44ead9a485","download_count":491,"created_at":"2026-10-21T21:28:49Z","updated_at":"2026-10-21T21:28:49Z"}],"body":"<p align=\"center\"><img width=\"160\" alt=\"flint-logo\" src=\"https://github.com/user-attachments/assets/3c1741a5-710c-4bde-8ac7-096e40b495bb\" /></p>\r\n\r\n## Recursive Flint\r\n\r\n[Flint](https://ollama.com/library/flint) brings Recursive's coding model to Ollama. It is designed for the work coding agents do across a repository: understanding unfamiliar code, tracing bugs, implementing features, and adding tests. Reasoning, multi-turn tool use, and a 262K-token context window support longer tasks across files and tool interactions.\r\n\r\nFlint is an Apache 2.0-licensed, 40B-parameter mixture-of-experts model with approximately 2.5B parameters active per token. In its [release evaluations](https://huggingface.co/RecursiveSI/flint#evaluation), Recursive reports 54.9% on Terminal-Bench 2.1 and 74.2% on SWE-bench Verified.\r\n\r\n```sh\r\nollama run flint\r\n```\r\n\r\n\r\nNote: Flint is supported on MacOS.  Other GPU support will be enabled in a subsequent release.\r\n\r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.40.7...v0.40.8","reactions":{"total_count":18,"+1":8,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":1,"rocket":7,"eyes":0}}
