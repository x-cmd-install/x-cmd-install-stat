w_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:3650d1bc3684738a93b2e051db509d8da48a1352d3f29dd092a92418658d8d09","download_count":3,"created_at":"2025-06-04T12:39:09Z","updated_at":"2025-06-04T12:39:09Z"}],"body":"## Release Notes\n\n- Removed establishment date for some countries, as certain countries may have multiple establishment dates / no certain establishment date\n- No longer requires `nightly` Rust (can be built with Stable)\n- Updated country data\n\n## Install countryfetch 0.2.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install nik-rev/tap/countryfetch\n```\n\n## Download countryfetch 0.2.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [countryfetch-aarch64-apple-darwin.tar.xz](https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-aarch64-apple-darwin.tar.xz.sha256) |\n| [countryfetch-x86_64-apple-darwin.tar.xz](https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-x86_64-apple-darwin.tar.xz.sha256) |\n| [countryfetch-x86_64-pc-windows-msvc.zip](https://github.com/nik-rev/countryfetch/releases/download/v0.2.0/countryfetch-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/nik-rev/countryfe