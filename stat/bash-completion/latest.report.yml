{"id":349117656,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAw_jPs4UzxzY","tag_name":"2.18.0","target_commitish":"b80d38cce5645fb98acd4eba857843fdf66be570","name":"v2.18.0","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-07-05T08:03:50Z","updated_at":"2026-07-05T08:13:49Z","published_at":"2026-07-05T08:13:49Z","assets":[{"id":466998009,"node_id":"RA_kwDOAw_jPs4b1dL5","name":"bash-completion-2.18.0.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":492024,"digest":"sha256:88bcf85124f77f74f2f2f8bcd16ac4382d807a827ede742a64940c7116aea33f","download_count":9413,"created_at":"2026-07-05T08:09:41Z","updated_at":"2026-07-05T08:09:41Z"}],"body":"## [2.18.0](https://github.com/scop/bash-completion/compare/2.17.0...2.18.0) (2026-07-05)\r\n\r\nThis release comes with notable changes to the directories used for looking up and sourcing completion recipes and helpers, allowing for more flexibility and customization and fewer conflicts between things shipping with bash-completion and third party/upstream/origin packages.\r\n\r\nFiles that come with bash-completion itself are located in directories reserved for that use, their names ending with `-core` and `-fallback`. Packages should continue install their files in the same `completions` and `helpers` dirs like before; these directories precede the bash-completion \"core\" ones in lookup order.\r\n\r\nA new concept of `startup` dirs has been introduced. Files from these directories are sourced eagerly on bash-completion startup. This replaces and allows for more flexibility than using the deprecated `/etc/bash_completion.d` directory for this purpose.\r\n\r\nSee README.md for more information.\r\n\r\n### Features\r\n\r\n* **_comp__init:** source system startup files earlier ([b09700d](https://github.com/scop/bash-completion/commit/b09700dda29b56fb89812e1215956a631cc7c848))\r\n* **_comp_compgen_filedir:** automatically add `-f` on _comp_compgen `-C` or `-P` ([#1552](https://github.com/scop/bash-completion/issues/1552)) ([6d5fca6](https://github.com/scop/bash-completion/commit/6d5fca6eaeb4e33750a187072efceecd22e82346))\r\n* **_comp_compgen_filedir:** support \"filedir -X\" ([ce28419](https://github.com/scop/bash-completion/commit/ce2841911c7a3f5a056b6a310038f0df17a8da42))\r\n* **_comp_compgen_sysv_services:** factorize SysV service generation ([c4c8c4b](https://github.com/scop/bash-completion/commit/c4c8c4b54040d4acc2688ed8fc040330d964fe12))\r\n* **aclocal,automake:** support versioned 1.17 executables ([94bbb3a](https://github.com/scop/bash-completion/commit/94bbb3a1b6fafeac96c27e1899dd5efc920a6a89))\r\n* **aclocal,automake:** support versioned 1.18 executables ([9287b4b](https://github.com/scop/bash-completion/commit/9287b4be2d49be873aded3fb40f56380fd8f97d8))\r\n* **apt-*:** update known options up to apt 3.2.0 ([c421d50](https://github.com/scop/bash-completion/commit/c421d508b6d922ee43364fd9e0d9bc3bddb5f56c))\r\n* **apt-cache:** update known options up to apt 3.2.0 ([0ab85c5](https://github.com/scop/bash-completion/commit/0ab85c5ff2c39300acfce0afde2e65b707e314b4))\r\n* **apt-get:** update known options up to apt 3.2.0 ([6a18e0c](https://github.com/scop/bash-completion/commit/6a18e0c0cf11c9be16616bc817f4613cb9ba95b0))\r\n* **apt-mark:** update known options up to apt 3.2.0 ([644a026](https://github.com/scop/bash-completion/commit/644a0268c117c98a6915dfd23548a3a8b8def6db))\r\n* **codex:** 3rd party fallback completion loader ([0f425bd](https://github.com/scop/bash-completion/commit/0f425bd37c2982b70f6c2ce865eeae0af05a715d))\r\n* **copilot:** 3rd party fallback completion loader ([744602a](https://github.com/scop/bash-completion/commit/744602ac64dc2