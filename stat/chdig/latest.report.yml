d00ef873d4157469f889f576ebcdc9bddba43038a","download_count":16,"created_at":"2026-11-16T08:05:49Z","updated_at":"2026-11-16T08:05:50Z"},{"id":753998653,"node_id":"RA_kwDOI0o4Sc4s8Rs9","name":"chdig_26.11.1_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6889242,"digest":"sha256:2c78ab4520b322393c4ee1f203af5648a9ff04d4fa8f67f107428fa7b98af836","download_count":1,"created_at":"2026-11-16T08:06:00Z","updated_at":"2026-11-16T08:06:01Z"},{"id":753999180,"node_id":"RA_kwDOI0o4Sc4s8R1M","name":"chdig_26.11.1_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6632446,"digest":"sha256:ce7dc3d9fff2646c4211538d8a00ecda3f60b23ec5142b448427f868df6d651e","download_count":1,"created_at":"2026-11-16T08:06:12Z","updated_at":"2026-11-16T08:06:12Z"}],"body":"**This is mostly cleanup release with a few fixes and minor improvements**\r\n\r\n### Improvements\r\n- SQL highlighting now matches ClickHouse (d5e0df6)\r\n- Clipboard works over ssh and under tmux (0fad225)\r\n- Flamegraph: `Home`/`End`/`PgUp`/`PgDn` scrolling, keep selection when the frame shrinks (5e94302, 97d8e02)\r\n- Summary: rates suffixed with `/s` (#305)\r\n- Set `storage_system_stack_trace_pipe_read_timeout_ms` per query, not per connection (9c9414f)\r\n\r\n### Bug fixes\r\n- Row counts rendered with a bytes suffix (f0c7e98)\r\n- Summary: IO buffer alloc removed, it deflated `Unknown` memory (27e733c, 6a39407)\r\n- Columns never shrink below their title width (11f7eed)\r\n\r\n### Dependencies\r\n- `cargo audit` is clean (4ba12e2, 488ca2f, d5e0df6)\r\n- Fewer dependencies (396e488, 968c39f, 0fad225)\r\n\r\n### Tests\r\n- Adapt to ClickHouse 26.10 system log schemas (d2aec3e)\r\n- Fix running tests on macOS (95debac)\r\n\r\n<details>\r\n\r\n## Commits\r\n- 9c9414f: Set storage_system_stack_trace_pipe_read_timeout_ms per query (over per connection) (Azat Khuzhin)\r\n- adapt to the 26.10 system log schemas ([Azat Khuzhin](https://github.com/azat/chdig/commit/d2aec3eb01c4cdd847d4b544207bae788466af34))\r\n- 66f7072: cargo update (Azat Khuzhin)\r\n- never shrink a column below its title width ([Azat Khuzhin](https://github.com/azat/chdig/commit/11f7eed2ae8c6fe38583dd0a57ac17c31dd8d9fe))\r\n- 95debac: Fix running tests on macOS (Azat Khuzhin)\r\n- 4ba12e2: Resolve some cargo audit warnings (Azat Khuzhin)\r\n- e4cc149: cargo update (Azat Khuzhin)\r\n- bind Home/End/PgUp/PgDn to scrolling (flamelens only knows g/G/b/f) ([Azat Khuzhin](https://github.com/azat/chdig/commit/5e94302340f3b82159c819df620a3476802cac47))\r\n- 97d8e02: Keep selection by scrolling when the frame height shrinks in flamegraphs (Azat Khuzhin)\r\n- 488ca2f: Update clickhouse-rs to avoid using unmaintained rustls-pemfile (Azat Khuzhin)\r\n- d5e0df6: Replace syntect with a port of ClickHouse's SQL lexer (Azat Khuzhin) [#303](https://github.com/azat/chdig/pull/303)\r\n- 1f3c8ec: Replace syntect with a port of ClickHouse's SQL lexer (#303) (Azat Khuzhin) [#303](https://github.com/azat/chdig/pull/303)\r\n- 396e488: Use std::backtrace instead of backtrace crate (Azat Khuzhin)\r\n- 968c39f: Use getrandom directly instead of rand (Azat Khuzhin)\r\n- 0fad225: Replace arboard with clipboard helpers and OSC 52 (Azat Khuzhin) [#304](https://github.com/azat/chdig/pull/304)\r\n- 06230ec: Replace arboard with clipboard helpers and OSC 52 (#304) (Azat Khuzhin) [#304](https://github.com/azat/chdig/pull/304)\r\n- 27e733c: Show IO buffer alloc as a throughput, not a memory category (Azat Khuzhin) [#305](https://github.com/azat/chdig/pull/305)\r\n- f0c7e98: Format row counts with a plain count formatter (Azat Khuzhin) [#305](https://github.com/azat/chdig/pull/305)\r\n- 6a39407: Remove IO buffer alloc rate from the summary (Azat Khuzhin) [#305](https://github.com/azat/chdig/pull/305)\r\n- 8db840e: Polish summary rates (#305) (Azat Khuzhin) [#305](https://github.com/azat/chdig/pull/305)\r\n- 8eadd01: Remove redundant homepage (repository is enough) (Azat Khuzhin) [#306](https://github.com/azat/chdig/pull/306)\r\n- c0d64c3: cargo update (Azat Khuzhin) [#307](https://github.com/azat/chdig/pull/307)\r\n- af4005a: v26.11.1 (Azat Khuzhin)\r\n\r\n</details>"}
