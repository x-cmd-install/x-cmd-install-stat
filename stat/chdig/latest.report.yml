b60cd782e573e2d80","download_count":1,"created_at":"2026-10-05T22:08:27Z","updated_at":"2026-10-05T22:08:28Z"},{"id":613729193,"node_id":"RA_kwDOI0o4Sc4klMOp","name":"chdig-latest_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":7536982,"digest":"sha256:1ca89087bd3c1274edc7f097e42d3f4acde31a45d98c116c33cfdbccee624260","download_count":1,"created_at":"2026-10-05T22:08:38Z","updated_at":"2026-10-05T22:08:38Z"},{"id":613728497,"node_id":"RA_kwDOI0o4Sc4klMDx","name":"chdig-macos-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19478864,"digest":"sha256:8a13fb7877799ee12f9ff273b594064bdcd821f720ecd7e6b0406d276544214f","download_count":2,"created_at":"2026-10-05T22:08:16Z","updated_at":"2026-10-05T22:08:17Z"},{"id":613728440,"node_id":"RA_kwDOI0o4Sc4klMC4","name":"chdig-macos-x86_64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19939464,"digest":"sha256:d7722fbecb296e0e8794121123752e0e6a3ec978a832809ae601a67e8b25a947","download_count":1,"created_at":"2026-10-05T22:08:15Z","updated_at":"2026-10-05T22:08:16Z"},{"id":613728565,"node_id":"RA_kwDOI0o4Sc4klME1","name":"chdig-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17080320,"digest":"sha256:15fd50cf062f3de350477732e469740948829130fd3f581f4a7dc368ddbe3ee3","download_count":14,"created_at":"2026-10-05T22:08:18Z","updated_at":"2026-10-05T22:08:19Z"},{"id":613728952,"node_id":"RA_kwDOI0o4Sc4klMK4","name":"chdig_26.10.1_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":7819994,"digest":"sha256:52c132c0b728d45e907da61c195e0fcf15afb5e4ff95935b60cd782e573e2d80","download_count":2,"created_at":"2026-10-05T22:08:28Z","updated_at":"2026-10-05T22:08:29Z"},{"id":613729246,"node_id":"RA_kwDOI0o4Sc4klMPe","name":"chdig_26.10.1_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":7536982,"digest":"sha256:1ca89087bd3c1274edc7f097e42d3f4acde31a45d98c116c33cfdbccee624260","download_count":2,"created_at":"2026-10-05T22:08:39Z","updated_at":"2026-10-05T22:08:40Z"}],"body":"### New features\r\n- ZooKeeper browser (`system.zookeeper`) with integration into the replicas view (0a965bd)\r\n- Per-host summary rows in `--cluster` mode (toggled with `1`): usage bars on the capacity scale, running queries column, resizable with `[`/`]` or by dragging the separator (#299, e0c04aa, 05e7a9a)\r\n- Per-query actions: metric log with charts and threads (`query_thread_log`) (242a036)\r\n- Live ProfileEvents popup (per-interval rates) for running queries (8b65edf)\r\n- `KILL QUERY` for all queries selected with `Space` (single `KILL QUERY ... IN (...)` statement) (b483c9b)\r\n- Queries filter (`/`): predicates with `Tab`/`Shift-Tab` completion, `normalized_query` field, quoted empty values (`s.workload!=''`) (#298, #301)\r\n- `ProfileEvents.<Name>`/`Settings.<name>` columns and filter fields (`pe.<Name>`, `s.<name>`) in the queries views; column and `pe.<Name>` predicates in the `/` filter of SQL views (#300)\r\n- `part_log`: ProfileEvents and configurable columns (`views.part_log.columns`) (#300, d29aa05)\r\n- Settings dialog: one tab per view, column fields with completion (#300)\r\n- Config: `views.*.order_by=<column> [asc|desc]`, aliases in `views.*.columns` (`foobar as x`), `clickhouse.settings` instead of URL parameters, named view instances listed in the Views menu (`F2`/fuzzy) (#301)\r\n- Reorder table columns by dragging the header (persisted in `query_columns`) (1b5bbf3)\r\n- Show query: less-style search (`/`, `?`, `n`, `N`) (#301)\r\n- Perfetto export: ProfileEvent stack traces as an events flamegraph, ProfileEvents and Settings as nested annotations on query slices, all `query_thread_log` ProfileEvents instead of the top 10 (f8ac6f9, 7dd8c17, 8563eaa)\r\n- Readline bindings in edit fields (`Ctrl-W/U/K/A/E`, `Alt-B/F`, `Ctrl-Left/Right`) (b2fd2e3, 69d00e1)\r\n\r\n### Improvements\r\n- `r` refreshes only the focused view (b934808)\r\n- Query ProfileEvents summed over `initial_query_id` across hosts, so the initial row of a distributed query carries the whole cluster's counters (f1ecbd4)\r\n- `system.asynchronous_metrics` `key_values` Map support (ClickHouse 26.8+) (43000b6)\r\n- `toValidUTF8()` for server-provided strings (normalized query, Settings values, exceptions, `text_log` messages) (7c16208)\r\n\r\n### Bug fixes\r\n- Time-frame seeking: `T`/`t` were identical and never accumulated (#297, #296)\r\n- CPU accounting on cgroup-limited servers (`CGroupUserTime`/`CGroupSystemTime` when `CGroupMaxCPU` is set), used cores no longer exceed the limit (cee4d53)\r\n- cpu/io_wait/cpu_wait of finished queries showed seconds\u00d7100 under a `%` label instead of average utilization (0e047c7)\r\n- Tables view hid tables without background schedule tasks (inner JOIN \u2192 LEFT JOIN) (37edfb4)\r\n- Duplicated log lines and lost/delayed wakeups in the background runner (92a53d4, #301)\r\n- Hostname stripping inconsistency across log batches (213390f)\r\n- Dialogs with scrollable content (e.g. server warnings) required `Tab` before `Enter` (87140e6)\r\n- Summary net/disk rates precision (b7df974)\r\n- Settings search for `end` landed on the time interval instead of the column (aacd44a)\r\n- Sort indicator for very long columns; queries view no longer sorts by a column the table does not have (#301)\r\n\r\n<details>\r\n\r\n## Commits\r\n- 37edfb4: Use LEFT JOIN with background_schedule_pool in the tables view (Azat Khuzhin)\r\n- f8ac6f9: Include ProfileEvent stack traces (events flamegraph) in the Perfetto export (Azat Khuzhin)\r\n- e460f46: Adjust the cast-quirk test for ProfileEvent samples in the Perfetto export (Azat Khuzhin)\r\n- 43000b6: Handle key_values Map in system.asynchronous_metrics (26.8+) (Azat Khuzhin)\r\n- 0b36a3f: Fix time-frame seeking: T/t were identical and never accumulated (Azat Khuzhin) [#297](https://github.com/azat/chdig/pull/297)\r\n- bb493bd: Make RelativeDateTime an enum: Absolute/Offset/Now (Azat Khuzhin) [#297](https://github.com/azat/chdig/pull/297)\r\n- e7226e2: Fix time-frame seeking: T/t were identical and never accumulated (and refactor RelativeDateTime) (#297) (Azat Khuzhin) [#297](https://github.com/azat/chdig/pull/297)\r\n- 87140e6: Fix dialogs with scrollable content requiring Tab before Enter (e.g. server warnings) (Azat Khuzhin)\r\n- b2fd2e3: Add readline bindings to EditView (Ctrl-W/U/K/A/E, Alt-B/F) (Azat Khuzhin)\r\n- Ctrl-Left/Right move by words (as Alt-B/F) ([Azat Khuzhin](https://github.com/azat/chdig/commit/69d00e1be6627ee0daf1b2cf31e825e10ae03b5a))\r\n- 753bbe9: Make log_name a wide column in background schedule pool logs (Azat Khuzhin)\r\n- 7c8cb34: Remove \"huge bunch of ideas\" from README (not too much left) (Azat Khuzhin)\r\n- 213390f: Fix hostname stripping inconsistency across log batches (Azat Khuzhin)\r\n- 0e047c7: Show average utilization for cpu/io_wait/cpu_wait of finished queries (Azat Khuzhin)\r\n- b7df974: Fix summary net/disk rates precision and uptime=0 panic (Azat Khuzhin)\r\n- 8b65edf: Make the query profile events popup live (per-interval rates) for running queries (Azat Khuzhin)\r\n- 242a036: Add per-query metric log (with charts) and threads (query_thread_log) actions (Azat Khuzhin)\r\n- b483c9b: KILL all queries selected with <Space> (one KILL QUERY ... IN (...) statement) (Azat Khuzhin)\r\n- 1b5bbf3: Reorder table columns by dragging the header (persisted in query_columns) (Azat Khuzhin)\r\n- 0a965bd: Add ZooKeeper browser (system.zookeeper) with replicas integration (Azat Khuzhin)\r\n- b7ed8cf: Queries filter predicates with Tab completion and instant/server render (Azat Khuzhin) [#298](https://github.com/azat/chdig/pull/298)\r\n- d2cf088: Per-host summary rows in --cluster mode (system.asynchronous_metrics GROUP BY host), toggled with 1 (Azat Khuzhin) [#299](https://github.com/azat/chdig/pull/299)\r\n- bc5d2ff: Resize the per-host summary table with [ ] or by dragging its separator (Azat Khuzhin) [#299](https://github.com/azat/chdig/pull/299)\r\n- 138ec2e: Per-host summary rows in --cluster mode, toggled with `1` (#299) (Azat Khuzhin) [#299](https://github.com/azat/chdig/pull/299)\r\n- 7c16208: toValidUTF8() for user-controlled strings: normalized query, Settings values, exceptions, text_log messages (Azat Khuzhin)\r\n- 4389f2b: Fix clippy lints (sort_by_key, collapsible match, checked_div) (Azat Khuzhin)\r\n- 92a53d4: Fix duplicated log lines (Azat Khuzhin)\r\n- f1ecbd4: Sum query ProfileEvents over initial_query_id across hosts (Azat Khuzhin)\r\n- e0c04aa: Usage bars and running queries in the per-host summary rows (Azat Khuzhin)\r\n- 05e7a9a: Order the per-host summary rows by name (Azat Khuzhin)\r\n- cee4d53: Fix CPU CPU accounting when the server is cgroup-limited (Azat Khuzhin)\r\n- 7dd8c17: Attach ProfileEvents and Settings as nested annotations to perfetto query slices (Azat Khuzhin)\r\n- 8563eaa: Nest all query_