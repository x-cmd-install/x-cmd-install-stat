{"id":207600773,"author":{"login":"vassilit","id":32412779,"node_id":"MDQ6VXNlcjMyNDEyNzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAA5jU84MX7yF","tag_name":"v2.11.0","target_commitish":"master","name":"2.11.0 Evolving Echidna","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-01T23:44:26Z","updated_at":"2026-11-01T23:52:28Z","published_at":"2026-11-01T23:52:28Z","assets":[],"body":"### Fixed\r\n\r\n* Do not `--backup`-rename special output paths like `/dev/null` (see issue #763)\r\n* Fix json UTF-encoding issues (see issues #463 and #464)\r\n* Fix ``rmlint --gui`` ignoring manual tagging of originals (see issue #385)\r\n* Fix various bugs in ``--replay`` mode (see issue #383)\r\n* Fix bug if ``--treemerge`` used in combination with ``--algorithm=SHA1``\r\n* Fix broken ``rmlint.py`` script after adding of part_of_directory types\r\n* Don't disable fiemap when gettext is disabled\r\n* Various fixes aimed at improving mac osx compatibility\r\n* Avoid generating ``rmlint.sh`` or other output files for ``rmlint --dedupe`` or ``rmlint --is-reflink`\r\n* Fix possible compile problems scons' default CC flags are non-functional\r\n* Fix GUI failing to start with pygobject >= 3.56\r\n* Make SSE4.2 runtime dispatch works on Clang builds.\r\n* FreeBSD: ``rmlint.sh``'s RMLINT_BINARY= entry.\r\n* Fix ``--honour-dir-layout``/``-j`` when filenames and content are the sames, just not\r\n  at the same place.\r\n* Add a protection against ``-D`` XOR cancellation\r\n\r\n### Added\r\n\r\n* Implement --hash-uniques option to generate full checksums of unique files too.\r\n* Implement --hash-unmatched option, similar to --hash-uniques but only for size twins.\r\n* Implement --rank-by f option to rank originals by directory full path\r\n* Can now atomically clone from original to its hardlink via ``rmlint --dedupe``\r\n* Option ``-c json:traversed`` to include list of fully-traversed dirs in json output\r\n* Option ``--ignore-bad-paths`` to not abort run if one or more bad paths passed\r\n* Exit code 12 for ``rmlint --is-reflink``: inline extents.\r\n* FreeBSD: support for xattr checksum cache (#800).\r\n* BLAKE3 and its 512-bit extension\r\n* xxHash3-128 digest: still ultra-fast with less collision risks than the 64-bit variant.\r\n* ``,d`` flag to ``--size`` to skip directories by `st_size`.\r\n* Tests: new markers for tests with special needs (reflink, xattr, manpage).\r\n* ``scons --show-config`` shows features and build in one run.\r\n* Build target test understands a new SCons variable: ``PYTEST_ARGS``.\r\n* For packagers: build targets ``install-cli`` and ``install-gui``, handy for split-packaging.\r\n  Note that the GUI still depends on the CLI.\r\n* For packagers: environement variable ``SOURCE_DATE_EPOCH`` is honoured.\r\n* For packagers: environement variables ``PYTHONHASHSEED``, ``PYTHONPATH``,\r\n  and ``DEB_PYTHON_INSTALL_LAYOUT`` are honoured for the GUI.\r\n* On Debian, without ``PREFIX=`` and ``DEB_PYTHON_INSTALL_LAYOUT``,\r\n  ``scons install-gui`` installs to ``/usr/local/lib/python3.YY/dist-packages``.\r\n* ``CFLAGS`` and ``LDFLAGS`` from the environment are now appending to our flags,\r\n  so that they could override ours.\r\n* Build no longer strip at link time unless explicitly asked with ``STRIP=1`` (or ``=yes``, ``=true``).\r\n* Japanese translation\r\n\r\n### Changed\r\n\r\n* Option ``--dedupe`` option parsing changed.  See ``rmlint --dedupe -h`` for more.\r\n  Previously:\r\n  ``rmlint --dedupe [--dedupe-xattr] [--dedupe-readonly] [-v] [-V] <src> <dest>``\r\n  Now:\r\n  ``rmlint --dedupe [--xattr] [--readonly] [--followlinks] [--inline-extents] [-v] [-V] <src> <dest>``\r\n* Made json-glib a hard dependency\r\n* Improved progress reporting ETA algorithm when large number of small files remaining to scan\r\n* Small files (<4k) are now generally ignored for reflinking / cloning options since They\r\n  are typically stored as inline extents\r\n* container: provide images for building, running and testing\r\n* short option ``-U`` now refers to ``--hash-unmatched`` instead of ``--write-unfinished``.\r\n* Treat paths beyond ``PATH_MAX`` as a hard error instead of truncating them\r\n* ``-g --progress`` and ``-G --no-progress`` do not clear outputs anymore (#582).\r\n* ``rmlint.sh`` sets ``-eu`` by default (#469).\r\n* The generated ``rmlint.py`` minimum supported Python is now 3.9\r\n* GUI: the minimum supported Python version is now 3.12\r\n* GUI: the minimum supported Gtk version is now 3.22\r\n* GUI: remove hard Rsvg dependency.\r\n* The minimum supported Glib version is now 2.74\r\n* The default installation prefix is now ``/usr/local``.\r\n* The build system supports ``PREFIX=``, ``DESTDIR=`` and ``LIBDIR=`` variables\r\n  instead of the old ``--prefix``, ``--actualprefix`` and ``--libdir`` options.\r\n  Note that ``DESTDIR=`` is not equivalent to ``--actualprefix``.\r\n* Shredder's GSettings schema is now ``io.github.sahib.rmlint.Shredder``\r\n  instead of ``org.gnome.Shredder`` — Shredder is not a GNOME project. The\r\n  application ID and the GResource prefix changed as well accordingly.\r\n  Shredder will therefore starts from its defaults, but the old values can be\r\n  read using: ``dconf dump /org/gnome/Shredder/``.\r\n\r\n### Removed\r\n\r\n* ``--dedupe-xattr``. Use ``--dedupe --xattr``\r\n* ``--dedupe-readonly``. Use ``--dedupe --readonly``\r\n* Build target ``config``. Use ``scons --show-config -n``.\r\n* Dropped support for Python 2.\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
