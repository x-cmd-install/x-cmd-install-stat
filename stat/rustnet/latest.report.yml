DM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":2462333,"digest":"sha256:d25991c32fc70b987660ab11d61b075b70b71cd2fc5db0fd662a997f2562ae54","download_count":27,"created_at":"2026-10-06T18:40:04Z","updated_at":"2026-10-06T18:40:04Z"},{"id":616340932,"node_id":"RA_kwDOOglN584kvJ3E","name":"Rustnet_macOS_Intel.dmg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":2599901,"digest":"sha256:799d8c45e586fbea6d0194f82f2ca5cc62de9b20bc5574d205dfb413085e0ed2","download_count":22,"created_at":"2026-10-06T18:39:25Z","updated_at":"2026-10-06T18:39:26Z"},{"id":616325865,"node_id":"RA_kwDOOglN584kvGLp","name":"Rustnet_Windows_32-bit.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2486272,"digest":"sha256:14132271c52f2071f553a4b6834e5ec68ebc61465bddbd64d22d9573772d09b6","download_count":21,"created_at":"2026-10-06T18:33:08Z","updated_at":"2026-10-06T18:33:08Z"},{"id":616326098,"node_id":"RA_kwDOOglN584kvGPS","name":"Rustnet_Windows_64-bit.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2580480,"digest":"sha256:070b366c28bca5d0885be3a298be82785ac5fcd60c36346776c71716583ec23c","download_count":48,"created_at":"2026-10-06T18:33:12Z","updated_at":"2026-10-06T18:33:13Z"}],"body":"\n### Security\n- Reject Unix output files owned by unrelated users before changing or writing them, anchor opens to validated directories, and create diagnostic logs exclusively\n\n### Added\n- **Traffic surge visibility**: automatic linear scales, preserved sampled peaks,\n  time labels, and two-second rate averages in Graph/Details and Activity sorting\n- **Traffic reporting clarity**: graphs follow the capture interface; label smoothed\n  process rates, use binary byte units, and show explicit idle rates\n- **Retained Linux process identity**: eBPF preserves bounded executable paths\n  and immediate-parent metadata after exit or exec, and checks task birth times\n  before extending ancestry through procfs (#640)\n- **Generic container attribution (Linux)**: identify Docker, Podman and LXC\n  from socket/process cgroups without daemon sockets. Show runtime, ID and\n  available names in Details, `container:` / `runtime:` filters, headless JSON,\n  JSONL logs, PCAP sidecars and PCAPNG comments\n- **Database DPI**: identify MySQL classic greetings and TLS requests, Redis\n  RESP command arrays, and PostgreSQL startup messages and TLS requests.\n  Details shows bounded metadata without retaining credentials, SQL, Redis\n  keys, or values. Recognition uses complete messages within one TCP payload;\n  no stream reassembly or TLS decryption is added\n- **Observed VLAN IDs**: preserve captured 802.1Q IDs in connection details,\n  headless snapshots, JSON event logs, and PCAP sidecars, including priority\n  tags (VID 0). Supports Ethernet and Linux cooked capture; stripped tags\n  remain unknown\n- **Headless Traffic Counters**: JSON/JSONL stats include lifetime packet and\n  original-length byte totals from capture, independent of connection snapshots\n  and TUI clears, for external metrics exporters\n- **Initial Connection View**: `[view] group_by_process` in `config.toml`\n  enables process grouping at startup and on view reset; the default stays flat.\n- **Headless Mode**: `--headless` runs without the TUI, with optional\n  `--duration` and shared `--filter` syntax. Versioned snapshots stream as\n  JSONL by default, while `--output json` emits one final snapshot. Stdout is\n  reserved for machine-readable output. A bounded asynchronous writer replaces\n  stale queued snapshots before JSON serialization and prevents blocked\n  consumers from delaying shutdown, while runtime capture and critical\n  worker failures emit terminal error state and return a nonzero status.\n  Connection IDs remain stable through archival and distinguish reused\n  endpoints, traffic rates have explicit bytes-per-second field names, and\n  timed-out workers retain a `stopping` terminal status. Documentation clarifies\n  snapshot-history limits, separate PCAP collection, and full-snapshot costs\n- **Reusable Connection Filters**: the complete filter language now lives in\n  `rustnet-core`, with the existing TUI path retained as a compatibility\n  re-export for future headless frontends\n- **Inline Connection Health**: connection rows now show compact TCP\n  retransmit/out-of-order, QUIC Retry/version, and transactional UDP\n  retry/timeout badges, with a severity-first Health sort. The Details\n  Transport Health card marks the counters behind the badge with their\n  letters, e.g. `TCP Retransmits (R)` and `Out-of-Order (O)` (#583)\n- **VPN Traffic Detection**: identify WireGuard and OpenVPN connections through\n  packet signatures, including OpenVPN over UDP and TCP (#581)\n- **Passive DNS Analytics**: the Host tab now shows rolling response codes,\n  timeouts, matched latency, question names, and DNS health, with a compact\n  health line in Overview\n- **Host Socket Inventory**: the new Host tab shows TCP LISTEN sockets, UDP\n  BOUND endpoints, TCP state totals, observed RTT, process owners, and the\n  detailed interface table on Linux, macOS, FreeBSD, and Windows\n- **State-Aware Status Bar**: the Overview footer highlights active process\n  grouping and history modes and shows whether Space will expand or collapse\n  the selected process group\n\n### Changed\n- Publish the internal workspace crates as 0.6.0 for the changed library APIs.\n- Label the Overview interface error and drop counters as Interfaces.\n- Simplify Graph and Details to automatic independent RX/TX scales, with no scale,\n  log, or lock controls.\n  Current rates and peak labels retain raw measurements. Details gains taller\n  plots, aligned totals, and clear messages when no live history is available.\n- Smooth scrolling in Overview, Graph, and Details at 20 fps, preserving the\n  500 ms sampling interval. Activity, DNS, and Graph bars animate value changes\n  over 250 ms; numeric readings update immediately and settled bars redraw slowly.\n- Restore Activity's application and interface traffic-share charts on roomy\n  terminals, plus capture coverage bars, while keeping the table and drill-down.\n  Share charts use 60-second totals and live interface rates stay in fixed columns.\n- Improve TUI readability with wrapped Host records on narrow terminals,\n  Unicode cell-aware truncation, consistent headings and gutters, and labeled\n  RX/TX chart scales. TCP state rows can scroll; Help shadows are opt-in\n  through `[ui] popup_shadow = true`\n- Move DNS-inferred hostnames from Remote to App and their Details metadata\n  into the Application card, retaining the `~` marker and SNI / Host precedence (#638)\n- **Documentation accuracy**: Align English, Chinese, and Japanese feature\n  claims, installation and profiling steps, sandbox limits, and the roadmap\n  with the current implementation.\n- **App artwork**: use a cyan and green terminal signal for desktop icons,\n  the macOS installer, and the README logo in all three languages.\n- Document Scoop installation in all three README languages and both\n  installation guides\n- **Contextual help**: each tab and Host section now explains its purpose before\n  listing controls. Activity defines Egress (TX) and Ingress (RX) from the device's\n  perspective; Host DNS explains passive lookup outcomes and coverage limits.\n- **Compact layouts**: Overview, Details, Activity, and Graph share clickable section\n  selectors with `v` / Shift+`v` when the full layout does not fit. Overview\n  shows System inline with dividers; Host uses the same controls for its two views.\n  Section tabs share the main tabs' styling and show shortcuts in the footer.\n  Activity groups traffic by application name, with scrollable PID lists, stable\n  selection, inline details, and exact connection jumps to Overview. Application\n  peers are deduplicated and peaks use simultaneous rates. Overview filters do\n  not affect Activity totals. The new `pid:` filter matches exact process IDs.\n  Capture stays accessible at every size; interface inventory lives in Host.\n  Capture panels omit explanatory footnotes.\n- **TUI visual polish**: Activity uses compact TX/RX summaries, a roomier\n  process ranking, and a separate capture-quality sidebar on wide terminals.\n  Share bars use theme-derived gradients with textured ANSI fallbacks.\n  The default keeps TX blue / RX green; other themes retain their own traffic\n  tokens. Shared section rules and table headings improve hierarchy throughout\n  the TUI, with responsive navigation and NO_COLOR support.\n  Graph's health, TCP state, and application distribution bars share Activity's\n  shading, fractional tips, and dotted tracks while preserving semantic colours.\n- **Frontend Modules**: startup and the TUI loop now live in library modules;\n  headless orchestration, schema projection, and output handling are separate\n  modules. Overlapping JSON, PCAP, sidecar, PCAPNG, and regular-file stdout\n  destinations are rejected before RustNet truncates or writes output data\n- **Packet Processing**: consolidate tracker lookups, reuse parsed-packet buffers,\n  and group up to 16 already queued batches per ordered update without waiting\n  to fill the group. A sole processor parses and updates each packet immediately,\n  without staging DPI allocations. Parallel workers keep packet cleanup outside\n  the ordered commit and skip notifications without waiters.\n  The queue remains bounded at 10,000 packets,\n  plus up to 1,600 in-flight packets per worker (6,400 across at most four workers).\n  A full queue uses a 5 ms send timeout. Linux, macOS, FreeBSD, and Windows capture\n  share bounded idle-wait and fallback handling, using Unix descriptor readiness\n  or Npcap events where supported to wake promptly for new traffic.\n  Overload can still cause queue or capture-backend loss\n- **Runtime Lifecycle Foundation**: privileged capture and process attribution\n  are prepared synchronously before sandboxing, while all long-lived workers\n  start through a typed post-sandbox handoff and stop under one owned,\n  bounded supervisor\n- **Staleness Cue**: idle connection rows now show a stripe at their left\n  edge and a removal countdown in the bandwidth column from halfway through\n  their timeout (previously 75%), both running yellow to red as cleanup\n  nears, while the rest of the row softens toward gray\n  instead of recoloring whole rows, so Health, RTT, and State keep their\n  colors and stale rows stay distinct from gray historic rows on dark\n  terminals\n- **Responsive System Sidebar**: Traffic now appears before the static Security\n  details, which collapse to the sandbox status when terminal height is limited\n- **Contextual Help Overlay**: Help now opens above the active tab and only\n  shows controls and concepts relevant to that view. The tab bar now contains\n  the five application views, with direct shortcuts `1` through `5`\n- **Internal Deduplication**: duplicated helpers, fixtures, and workflow steps\n  were consolidated across the workspace, removing about 2,000 lines with no\n  intended change in behaviour. Small visible differences: truncated names in\n  the connection table, Activity tab, and filter chip no longer leave a space\n  before the ellipsis, GeoIP lookups also skip multicast, reserved,\n  benchmarking, documentation, and discard addresses, hostnames stuck in a\n  pending DNS state are retried after 30 seconds, a connection superseded by\n  a new SYN is archived with its cached rates zeroed like an expired one, the\n  sandbox report uses one wording for a failed root uid drop on every\n  platform and, on builds without Landlock, for the success case as well, the\n  standalone aarch64 and Android static build workflows are removed since the\n  release workflow already produces those binaries, and dispatching the\n  release workflow with `skip_downstream` now also skips the crates.io,\n  Docker, COPR, PPA, and OBS publish jobs so a backfill cannot republish\n- **Release Backfills**: a re-run of the release workflow no longer overwrites\n  assets that are already on the release unless `overwrite_assets` is set,\n  since Chocolatey, Scoop, and the AUR binary package pin checksums of the\n  published files\n\n- **Acronym Casing**: the Details header chip reads `RTT` instead of `rtt`\n  and PCAPNG export errors spell the format in uppercase\n\n### Fixed\n- Restore FreeBSD builds with mio 1.2.4, which supports libc 0.2.190.\n- Apply Overview's PTR visibility setting to Activity totals, including retained\n  connections; use `--show-ptr-lookups` to include reverse DNS traffic in both tabs.\n- Preserve Linux Host socket owners discovered at startup across restricted procfs refreshes, including listeners and bound UDP sockets\n- Keep packet rates, connection lifecycle, and health updating when interface counters are unavailable; prevent compact RX/TX rates from losing leading digits.\n- **macOS traffic graphs**: use aggregate counters for default PKTAP capture, keep\n  Details scrolling independently, and publish complete interface-rate snapshots\n- Add the missing divider between Overview traffic and interface counters.\n- Keep the filter cursor on UTF-8 character boundaries when typing, moving, or deleting non-ASCII text, avoiding TUI panics.\n- Preserve regex syntax in connection filters, including uppercase escapes such as `\\D` and explicit case-sensitive groups.\n- ARM DEB compatibility with Ubuntu 22.04 and Debian 12/13: use a glibc 2.35\n  build baseline, declare runtime dependencies, and embed ARMv7 libpcap to\n  avoid Debian 13's time64 ABI mismatch. Test package installation and capture.\n- **Traffic graph stability**: remove hollow outlines and preserve the scroll position\n  across sample arrivals; interpolate before rasterizing to prevent contour wobble\n- Keep Activity summary TX/RX labels, numbers, and units aligned as live rates change\n- **QUIC handshake storage**: coalesce bounded CRYPTO ranges in either arrival\n  order, keep assembling through ClientHello for ALPN, and release bytes after\n  extraction. UI/history snapshots retain metadata only. Library consumers must\n  adapt `get_fragments()` from a map reference to an `(offset, slice)` iterator\n- **32-bit parser validation**: test QUIC and SNMP length boundaries in debug\n  and release CI; constrain SNMP nested fields to their declared containers\n- **Short Kubernetes flows**: retain cgroup v2 pod/container identity with eBPF\n  socket records after process exit, match both endpoint orientations, and\n  evict old records when the map fills.\n  Track evidence export before debug-pod cleanup in the separate\n  [kubectl-rustnet follow-up](https://github.com/domcyrus/kubectl-rustnet/issues/20).\n- Clarify unreleased features and Windows setup in all three documentation\n  languages; link v1.6.0 docs and add release checks for availability notes (#620)\n- **Connection viewport**: paging, scrollbars, and mouse targets track the current\n  layout immediately after resizing, including filters and two-row capture errors.\n- **Details information pages**: replace overflowing information scrollbars with\n  sections and numbered pages reached with v/V. Keep j/k, paging, and the wheel\n  for connection navigation; retain Traffic plots when they fit\n- **Details layout**: use the terminal's full width and anchor RX/TX plots\n  above the footer with a proportional height capped at 18 rows\n- **TUI alignment**: align Activity pane headings, expand Host interface columns,\n  and size Graph process names and rows to the available space\n- **Required UID Drop**: abort startup before packet-processing workers when a\n  requested root UID/GID drop fails, including in best-effort mode\n- **Windows Connection History**: connections that reuse a tuple with the\n  same capture timestamp keep distinct history entries\n- **Idle Capture Shutdown**: nonblocking capture reads and bounded idle\n  polling let worker shutdown finish even after packet traffic stops\n- **Windows Address Discovery**: collect IPv4, IPv6, and subnet broadcasts\n  through IP Helper without loading the Npcap capture driver\n- **Loss and Export Accounting**: queue backpressure drops are reported\n  separately from libpcap and interface drops, partial batches drain during\n  shutdown, and classic PCAP output remains bound to its securely pre-opened\n  file descriptor\n- **32-bit eBPF Map ABI**: explicitly align the shared C and Rust `ConnInfo`\n  structures to 8 bytes, fixing compilation on i586 (#611)\n- **macOS Host Tab SYN_RCVD**: sockets that `lsof` reports as `SYN_RCVD` now\n  show as SYN received instead of an unknown state\n\n- **Bogus \"unknown\" Process Group on Linux**: a process that exited while\n  RustNet scanned `/proc` was recorded under the literal name `unknown`, which\n  showed up as its own process group next to the real `<unknown>` bucket and,\n  with eBPF attribution, overrode the correct name the kernel had captured at\n  socket creation. Such a process is now skipped instead (#590)\n- **TCP Window Size Per Direction**: the Details Transport Health card kept a\n  single window slot that every segment overwrote, so the value flipped\n  between the local and remote advertised windows. Both are now shown (`\u2193`\n  local, `\u2191` remote), in bytes only when the captured handshake proved the\n  window scale. Without it the scale is unknowable from the wire, so the row\n  reads `unknown (no handshake)` rather than a raw header field that stands\n  for anything up to 16384 times its value; the Details help and USAGE explain\n  it (#589)\n- **TCP Analytics for a Connection's First Packet**: the packet that creates a\n  connection now reaches the TCP analytics. For a connection this host\n  initiates that packet is its own SYN, the only carrier of the local\n  window-scale option, so windows could never be reported in bytes even with\n  the whole handshake captured (#589)\n- **Duplicate ACK False Positives**: a repeated ACK only counts as a duplicate\n  when this host has data outstanding and the advertised window is unchanged\n  (RFC 5681), so an idle connection's keepalives and the peer's window updates\n  no longer inflate the counter or report a fast retransmit on a connection\n  that never retransmitted. A RST no longer overwrites the last advertised\n  window with its meaningless zero (#589)\n- **Default Npcap Installations on Windows**: RustNet now finds Npcap in its\n  standard `System32\\Npcap` directory, so WinPcap API-compatible mode is no\n  longer required. `--help` and `--version` also work without Npcap installed\n- **Attribution of Pre-Existing Connections on Linux**: connections that were\n  already open before RustNet started keep their process name after privilege\n  reduction, including root services when RustNet runs with file capabilities\n  on Linux 5.11 and newer. A one-shot BPF task-file inventory and the\n  privileged procfs scan feed a validated fallback shown as the \"startup\n  snapshot\" match quality (#575)\n\n- Keep new releases in draft until Linux, macOS and Windows installer jobs\n  all succeed, preventing publication with missing installer assets.\n\n### Removed\n- Unused screenshots, the macOS PNG export, duplicate PPA setup notes,\n  obsolete manual build/debug tools, and redundant services copies in local\n  installers and Docker. Release archives retain services for the AUR package.\n- Unused internal APIs, ineffective DPI packet limits, and sandbox pathname\n  write exceptions. Capture outputs continue using descriptors opened before\n  sandboxing\n- **Ubuntu 25.10 (Questing) PPA**: the series reached end of life and\n  Launchpad rejects new uploads for it, so the PPA build matrix and install\n  docs drop it. Already-published questing packages stay in the PPA archive\n\n","reactions":{"total_count":8,"+1":1,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":1,"rocket":3,"eyes":1}}
