://github.com/mozilla-ai/llamafile/pull/1043\r\n* llamafile_open_zip: validate the zip entry window against the actual file size by @professor-moody in https://github.com/mozilla-ai/llamafile/pull/1039\r\n* fix(zip): guard extra-field header read before bounds are known by @shoemoney in https://github.com/mozilla-ai/llamafile/pull/1044\r\n* fix(build): add missing link recipes for llama-bench, quantize, imatrix and perplexity by @dexhunter in https://github.com/mozilla-ai/llamafile/pull/1034\r\n* fix(build): compile the ggml objects with -DNDEBUG by @aittalam in https://github.com/mozilla-ai/llamafile/pull/1050\r\n* Enable -DGGML_CUDA_USE_GRAPHS / -DGGML_HIP_GRAPHS by @aittalam in https://github.com/mozilla-ai/llamafile/pull/1051\r\n* fix(ggml): use `ggml_time_init()` in `ggml_time_ms` and `ggml_time_us` so that `timer_freq` is initialised by @aittalam in https://github.com/mozilla-ai/llamafile/pull/1054\r\n* Vulkan toolchain by @aittalam in https://github.com/mozilla-ai/llamafile/pull/1055\r\n\r\n## New Contributors\r\n* @professor-moody made their first contribution in https://github.com/mozilla-ai/llamafile/pull/1039\r\n* @shoemoney made their first contribution in https://github.com/mozilla-ai/llamafile/pull/1044\r\n* @dexhunter made their first contribution in https://github.com/mozilla-ai/llamafile/pull/1034\r\n\r\n**Full Changelog**: https://github.com/mozilla-ai/llamafile/compare/0.10.5...0.10.6","reactions":{"total_count":18,"+1":6,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":2,"rocket":3,"eyes":0},"mentions_count":4}
