,"name":"marchat-v1.3.8-linux-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24848981,"digest":"sha256:58cceeb97bf609c8a3b08c54032fb9d09baf87e3ad872a99b0e472c0502af7f7","download_count":5,"created_at":"2026-10-01T17:49:57Z","updated_at":"2026-10-01T17:50:00Z"},{"id":603803765,"node_id":"RA_kwDOPNoTDc4j_VB1","name":"marchat-v1.3.8-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27166344,"digest":"sha256:8ae5df8f319adad1898841693a531e70ff1e7466c6767dae09e986e440ff521b","download_count":32,"created_at":"2026-10-01T17:49:57Z","updated_at":"2026-10-01T17:50:01Z"}],"body":"## v1.3.8\n\n*Released: 1 October 2026*  \n*Commit: 052a575*\n\n### Server\n\n- **Message size**: Cap chat `content` at 32 KiB by default (`MARCHAT_MAX_MESSAGE_BYTES`, or `MARCHAT_MAX_MESSAGE_MB`). Oversized `text`, `dm`, `edit`, `search`, and command bodies get a System reply and stay connected; nothing is persisted or broadcast. Encrypted ciphertext uses the same byte cap. Plugin chat and command replies over the cap are dropped before broadcast. File uploads keep their own limit. Admin TUI, web admin, and `-doctor` show the message cap.\n\n### Client\n\n- **Message size**: Reject oversized composer, DM, code snippet, edit, and search bodies before send, including E2E wire `content` after encryption. WebSocket close **1009** is reported as a message-too-big error.\n\n### Dependencies\n\n- **modernc.org/sqlite** v1.59.0 (transitive **modernc.org/libc** v1.75.7; **modernc.org/mathutil** v1.7.1 and **modernc.org/memory** v1.12.1 unchanged); **github.com/mattn/go-runewidth** v0.0.30\n\n### Version and packaging\n\n- **Install and build defaults**: **install.ps1**, **install.sh**, **build-release.ps1**, **`scripts/build-windows.ps1`**, and **`scripts/build-linux.sh`** target **v1.3.8** release assets on GitHub.\n- **Docs and metadata**: **SECURITY.md** and **README** (version badge, install snippets, Docker tag) reference **v1.3.8**; canonical Homebrew, Scoop, winget, Chocolatey, and AUR templates in **`packaging/`** target **v1.3.8** (refresh zip SHA256 from published assets before `choco pack` / manifest validation).\n\n### Assets\n\n- marchat-v1.3.8-linux-amd64.zip\n- marchat-v1.3.8-linux-arm64.zip\n- marchat-v1.3.8-windows-amd64.zip\n- marchat-v1.3.8-darwin-amd64.zip\n- marchat-v1.3.8-darwin-arm64.zip\n\n**Full Changelog:** https://github.com/Cod-e-Codes/marchat/compare/v1.3.7...v1.3.8\n\n### Breaking changes\n\n- **WebSocket JSON protocol**: No intentional breaking change; keystore and E2E wire encoding unchanged.\n- **Database**: No schema migration.\n- **Message size**: Chat `content` longer than 32 KiB (default) is rejected. Previously those bodies were stored and broadcast. File uploads keep their own limit.\n\n### Migration guide\n\n- **Binaries**: use **v1.3.8** archives from this release page, or **install.ps1** / **install.sh** with their default version.\n- **Client / server**: restart after upgrade. No schema migration.\n- **Operators**: the default chat cap is 32 KiB of UTF-8 `content`. Encrypted messages are measured as ciphertext, so the plaintext that fits is shorter (about 24,450 ASCII characters). Raise the cap with `MARCHAT_MAX_MESSAGE_BYTES` or `MARCHAT_MAX_MESSAGE_MB` when you need longer messages.\n- **Packaging maintainers**: run **`packaging/ci/render-release-manifests.sh`** after zips publish to refresh SHA256 in **`packaging/`** and downstream manifests.\n\n## Docker Image\n\nA multi-architecture Docker image (linux/amd64, linux/arm64) is available on Docker Hub:\n\n```bash\ndocker pull codecodesxyz/marchat:v1.3.8\n# or use latest tag\ndocker pull codecodesxyz/marchat:latest\n```\n"}
