996,"node_id":"RA_kwDOPNoTDc4hXgm0","name":"marchat-v1.3.7-linux-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24668960,"digest":"sha256:702b1efce4ceaa9a7936b5c996a84ffbec7c8e3f75e8f53bdae12db84ccf495f","download_count":4,"created_at":"2026-09-12T19:18:40Z","updated_at":"2026-09-12T19:18:41Z"},{"id":559810995,"node_id":"RA_kwDOPNoTDc4hXgmz","name":"marchat-v1.3.7-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27203993,"digest":"sha256:8c74382f5b762c732d2f72728344ba0d8c6a7dcb65d5c34acb386da1f4d865af","download_count":8,"created_at":"2026-09-12T19:18:40Z","updated_at":"2026-09-12T19:18:41Z"}],"body":"## v1.3.7\n\n*Released: 12 September 2026*  \n*Commit: aac5d26*\n\n### Documentation\n\n- **Bots**: Pointer to [marchat-bot](https://github.com/Cod-e-Codes/marchat-bot) (standalone Go WebSocket bot SDK; not a plugin) in **README**, **PROTOCOL**, **docs/README**, **CLIENT_HOOKS**, and **PLUGIN_ECOSYSTEM**\n\n### Dependencies\n\n- **golang.org/x/crypto** v0.57.0; **golang.org/x/term** v0.46.0 (transitive **golang.org/x/sync** v0.23.0, **golang.org/x/sys** v0.48.0, **golang.org/x/text** v0.42.0, **golang.org/x/mod** v0.41.0, **golang.org/x/tools** v0.49.0)\n- **modernc.org/sqlite** v1.58.0 (transitive **modernc.org/libc** v1.75.6, **modernc.org/mathutil** v1.7.1, **modernc.org/memory** v1.12.1)\n- **github.com/jackc/pgx/v5** v5.11.0; **github.com/go-sql-driver/mysql** v1.10.1; **github.com/mattn/go-runewidth** v0.0.29\n\n### Toolchain\n\n- **Go 1.26.8** in **go.mod**, nested plugin modules (**plugin/sdk**, **plugin/examples/echo**), CI (**.github/workflows/go.yml**, **.github/workflows/release.yml**), and **Dockerfile**. Minimum required by **golang.org/x/crypto** v0.57.0 is **1.26.0** (module `go` directive).\n\n### Version and packaging\n\n- **Install and build defaults**: **install.ps1**, **install.sh**, **build-release.ps1**, **`scripts/build-windows.ps1`**, and **`scripts/build-linux.sh`** target **v1.3.7** release assets on GitHub.\n- **Docs and metadata**: **SECURITY.md** and **README** (version badge, install snippets, Docker tag) reference **v1.3.7**; canonical Homebrew, Scoop, winget, Chocolatey, and AUR templates in **`packaging/`** target **v1.3.7** (refresh zip SHA256 from published assets before `choco pack` / manifest validation).\n- **Post-release helper**: versioned `scripts/post-release-v*.ps1` helpers were dropped; use **`packaging/ci/render-release-manifests.sh`** after assets upload (**PACKAGING.md**). Chocolatey remains `choco pack` in **`packaging/chocolatey/`**.\n\n### Assets\n\n- marchat-v1.3.7-linux-amd64.zip\n- marchat-v1.3.7-linux-arm64.zip\n- marchat-v1.3.7-windows-amd64.zip\n- marchat-v1.3.7-darwin-amd64.zip\n- marchat-v1.3.7-darwin-arm64.zip\n\n**Full Changelog:** https://github.com/Cod-e-Codes/marchat/compare/v1.3.6...v1.3.7\n\n### Breaking changes\n\n- **WebSocket JSON protocol**: No intentional breaking change; keystore and E2E wire encoding unchanged.\n- **Database**: No schema migration.\n- **Toolchain**: Source builds and CI now require **Go 1.26.8+** (was **1.25.13+**). Prebuilt binaries and Docker images do not require a local Go install.\n\n### Migration guide\n\n- **Binaries**: use **v1.3.7** archives from this release page, or **install.ps1** / **install.sh** with their default version.\n- **Client / server**: restart after upgrade. No schema migration.\n- **Operators building from source**: install **Go 1.26.8** or later before `go build` / `go test`.\n- **Packaging maintainers**: run **`packaging/ci/render-release-manifests.sh`** after zips publish to refresh SHA256 in **`packaging/`** and downstream manifests.\n\n## Docker Image\n\nA multi-architecture Docker image (linux/amd64, linux/arm64) is available on Docker Hub:\n\n```bash\ndocker pull codecodesxyz/marchat:v1.3.7\n# or use latest tag\ndocker pull codecodesxyz/marchat:latest\n```\n"}
