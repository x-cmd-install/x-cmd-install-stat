 then `flatpak run in.fincept.FinceptTerminal` |\n| **Linux (Debian/Ubuntu .deb)** | `FinceptTerminal-*-linux-x64.deb` | `sudo apt install ./FinceptTerminal-*.deb` |\n| **macOS Apple Silicon** | `FinceptTerminal-*.dmg` or setup | Open DMG → drag to Applications |\n\n### Requirements\n- Windows 10/11 x64\n- Linux Flatpak: any x86_64 Linux with Flatpak; its runtime (org.kde.Platform 6.11) is installed from Flathub on first install\n- Linux .deb: Ubuntu 22.04+ / Debian 12+ and derivatives (x86_64, glibc 2.35+). Fedora, RHEL, Arch, openSUSE and others: use the Flatpak\n- The AppImage and .rpm are no longer published\n- macOS 13+ (Apple Silicon)\n\nSee the [README](https://github.com/Fincept-Corporation/FinceptTerminal#readme) for full installation instructions.\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":2,"eyes":0}}
