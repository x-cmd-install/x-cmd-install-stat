37) - Always complete the export when the OTLP sender is shut down\n  * [#56255](https://github.com/quarkusio/quarkus/pull/56255) - Bump org.freemarker:freemarker from 2.3.34 to 2.3.35\n  * [#56349](https://github.com/quarkusio/quarkus/pull/56349) - [3.39] Bump to Vert.x 4.5.33\n  * [#56573](https://github.com/quarkusio/quarkus/pull/56573) - Bump aesh 3.18.0, add pipeline stage results, lazy runtime startup\n  * [#56783](https://github.com/quarkusio/quarkus/pull/56783) - Typo fixes in gRPC guides\n  * [#56796](https://github.com/quarkusio/quarkus/pull/56796) - docs: Fix the dead Jose4J link in the JWT Build guide\n  * [#56800](https://github.com/quarkusio/quarkus/pull/56800) - Add javadoc to AbstractSecurityIdentityAssociation\n  * [#56821](https://github.com/quarkusio/quarkus/pull/56821) - [3.40] SmallRye Fault Tolerance: bump to 6.11.4\n  * [#56831](https://github.com/quarkusio/quarkus/pull/56831) - [3.40] Qute: EvalSectionHelper and StrEvalNamespaceResolver fixes\n  * [#56837](https://github.com/quarkusio/quarkus/pull/56837) - Do not stack asciidoc anchors, because it does not work\n  * [#56838](https://github.com/quarkusio/quarkus/pull/56838) - Fix malformed link\n  * [#56842](https://github.com/quarkusio/quarkus/pull/56842) - Fix dead link for Redis sandbox\n  * [#56845](https://github.com/quarkusio/quarkus/pull/56845) - Bump Keycloak version to 26.7.4\n  * [#56849](https://github.com/quarkusio/quarkus/pull/56849) - [3.40] Upgrade RESTEasy to 6.2.19.Final\n  * [#56853](https://github.com/quarkusio/quarkus/pull/56853) - [3.40] Upgrade to Hibernate 7.4.9.Final\n  * [#56857](https://github.com/quarkusio/quarkus/pull/56857) - [3.40] WebSockets Next: add max-pending-messages back-pressure\n  * [#56861](https://github.com/quarkusio/quarkus/pull/56861) - [3.40] Fix path normalization bypass on wildcard routes (matrix-param + dot-segment)\n  * [#56867](https://github.com/quarkusio/quarkus/pull/56867) - [3.40] : Bump smallrye-jwt version to 4.6.4\n  * [#56884](https://g