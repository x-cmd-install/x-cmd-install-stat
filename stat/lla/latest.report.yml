b0f72bae554847482aeed37994cca","download_count":13,"created_at":"2026-11-16T23:42:18Z","updated_at":"2026-11-16T23:42:18Z"},{"id":756893595,"node_id":"RA_kwDOKBwvKM4tHUeb","name":"themes.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":33141,"digest":"sha256:9de6913258b8fa5ac0d03cb669e28b2bb8dfac9275fee2547b52f2eef80ce711","download_count":1,"created_at":"2026-11-16T23:44:01Z","updated_at":"2026-11-16T23:44:01Z"}],"body":"# Release v0.9.0\n\n## Changelog\n\n## [0.9.0] - 2026-11-16\n\n### Added\n\n- The fuzzy finder has three modes, switched with `Ctrl+F`: files, folders and\n  text inside files. Text search shows matching lines as they are found, opens\n  the editor at the line with `Ctrl+E`, and the preview scrolls to it.\n  `lla --dirs` and `lla --contents` open the finder in those modes.\n- Images show up in the finder preview: at full resolution in Kitty, Ghostty\n  and WezTerm, and drawn with colored half blocks in other terminals.\n  Folders preview as a list of what is inside them.\n- `lla shell-init <shell>` prints `j` and a new `lcd` function, which picks a\n  folder with the finder and changes into it. Works in bash, zsh, fish and\n  PowerShell.\n- The finder remembers the file list of large folders between runs, so results\n  show up right away while the folder is read again. On a home folder with\n  2.6 million entries everything is searchable after 1.5 s instead of 7.4 s.\n  Turn it off with `listers.fuzzy.remember_index = false`.\n- `lla scan` finds large duplicate files in your own folders. It checks them in\n  the background, lists them under Duplicates, and never lets you remove the\n  last copy. They also appear in `--report` and `--json`; `--no-duplicates`\n  skips the search.\n- More cleanup targets in `lla scan`: Xcode DeviceSupport for tvOS, visionOS\n  and macOS, simulator caches, SwiftUI previews, iPhone and iPad backups (named\n  by device), OrbStack, Colima and Lima disks, the Homebrew download cache on\n  Linux and from `HOMEBREW_CACHE`, and the uv cache on Windows.\n- On Windows, `lla scan` includes your Recycle Bin on every fixed drive and\n  shows each entry under its original name.\n\n\n\n## SHA256 Checksums\n\n```\n7aa3c7ed20f215d0ec5d75cbe142d19886c5a8e5733dfc2fe68620aaab708ff8  lla-0.9.0-1-aarch64.pkg.tar.zst\nb55d450a45b034298ef71bc84bf0933e2dbcff1af832051ad1e773a43ac8d3ad  lla-0.9.0-1-i686.pkg.tar.zst\n7a3334a97e72b3d164d99769ffd35a8b1b97e9992da2354087a144a08580d651  lla-0.9.0-1-x86_64.pkg.tar.zst\nff3bae918ce191e28f8df0ac935b8117d011a3c9ea1760a0211557e3794b2db1  lla-0.9.0-1.aarch64.rpm\n9ee8129f137283eb2957e3da297bc9c03e8ef1330f82adf2dabee0da20d52106  lla-0.9.0-1.i686.rpm\n3fb8a131e77653a6015ea48ac8d03ba9e51acf819d0b0893fa1d5ac925de4735  lla-0.9.0-1.x86_64.rpm\n4851087905728f4332536b5d462f047d0655ead81048d775dcb75fdf73ff2a7f  lla-0.9.0-r0.aarch64.apk\n97dce2313619c6faf79bdcc1920cfa8d169af3f05da6a189a6131123bca780df  lla-0.9.0-r0.x86.apk\ne8a1cf7be8df63cd27b5f87091fe33d5e9945a062aed456c747716583c3fe97f  lla-0.9.0-r0.x86_64.apk\nd3994092e8a92bb4a7c10ff2e48d06437769d24d4f30c97383130a8477d0fdab  lla-linux-amd64\n8770dfe619ee39fb823069c2ce304c38edefe73d4c3733289cc694ec188decc2  lla-linux-amd64-musl\nf6eeff0a30c0bd0e0cb91ef7cbf04a4a9c05dcf9c5826331ffd1f141d61575fd  lla-linux-arm64\n6d590b500d1550c06ff69a5b01361579f88b5a12c24a9cd7f748308a0c716564  lla-linux-arm64-musl\nc3a6b53acf012a1eadd449437fac639a560f746c63f02678b2277bff77372ed4  lla-linux-i686\n742aa12343bafea2cf19de50d7a444b78626902b8c6bb167dc21a509b6fabe43  lla-macos-amd64\n540d3ab685b08d068357c229048b402950fc13de65c9b262202a7fb2c4a6bfeb  lla-macos-arm64\n7a7fbf730d5e2602a4c00908526d7d55a98912a628408134c19fd53c0bf41507  lla-netbsd-amd64\n322d0b499013b3295c8b09c207f1c66c3b4152c0d1d6e8b78463e0a870ed4a2f  lla-windows-amd64.exe\nea01845a781a5ff3d505be552e63