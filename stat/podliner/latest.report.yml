rzGW0","name":"podliner-win-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":348508972,"digest":"sha256:34d166831ed1da38042b56dfcb397f7f251532fd4df7d34336b3c7b7e73f06db","download_count":54,"created_at":"2026-11-11T08:53:09Z","updated_at":"2026-11-11T08:53:21Z"},{"id":734815520,"node_id":"RA_kwDOPxMbp84rzGUg","name":"podliner-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":155182790,"digest":"sha256:c1e9984af9f44088c04739bb5b23bb0ca000a493a822fcc86ebe8b3be0f48cbd","download_count":4,"created_at":"2026-11-11T08:53:05Z","updated_at":"2026-11-11T08:53:14Z"},{"id":734815703,"node_id":"RA_kwDOPxMbp84rzGXX","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":780,"digest":"sha256:24db57bef828d6e4ba3aa73286bf461b312946eac3f618721617aab59c94ac3a","download_count":8,"created_at":"2026-11-11T08:53:09Z","updated_at":"2026-11-11T08:53:10Z"}],"body":"podliner v2.4.0\n\nan option to mark episodes played only at the very end (#40).\n\n## new\n\n- **`:played-at end`.** by default an episode counts as played 30 seconds before its end or at 90% (5 seconds or 98% for episodes up to a minute). with `:played-at end` it only counts once playback reaches the end. `:played-at near-end` goes back to the default and `:played-at` shows what is set. the choice is kept across restarts, as `MarkPlayedAtEnd` in `appsettings.json`. thanks to richardHangHimself for the report.\n"}
