jipDt","name":"podliner-win-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":346766405,"digest":"sha256:bc62659d1e5a2d1727c77831bec0ae25fc866822b8affcbed203478682c5a704","download_count":13,"created_at":"2026-09-28T19:58:21Z","updated_at":"2026-09-28T19:58:35Z"},{"id":596283567,"node_id":"RA_kwDOPxMbp84jipCv","name":"podliner-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":154505310,"digest":"sha256:1f964947778a430058ad6cada767ba3b63b8f228baf42aeb321c2dccc6bb5fd4","download_count":2,"created_at":"2026-09-28T19:58:19Z","updated_at":"2026-09-28T19:58:27Z"},{"id":596283646,"node_id":"RA_kwDOPxMbp84jipD-","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":780,"digest":"sha256:59c010c6070bf87d54e8ba56ac26b2a1859e0c074e72c11f2f8a701f67741a3e","download_count":3,"created_at":"2026-09-28T19:58:22Z","updated_at":"2026-09-28T19:58:22Z"}],"body":"podliner v2.0.2\n\none fix, for the terminal being left broken after quitting (#34).\n\n## fixed\n\n- **quitting could leave mouse tracking and the alternate screen switched on.** the shell then printed mouse reports as text on every pointer move until you ran `reset`. it hit everyone with gPodder auto-sync on, on every quit.\n\n  the terminal was restored as the very last step of the exit cleanup, and a 1.5s watchdog killed the process whenever that cleanup ran long. the gPodder push on exit always did, because it waited on terminal.gui's main loop after that loop had already stopped. the restore now runs first, and again from the process exit hook, so a killed or signalled podliner hands the terminal back too.\n\n- **the gPodder push on exit never actually ran.** same cause: it hung before it reached the network and was killed. it goes through now.\n\n- **quitting takes well under half a second** instead of being cut off at 1.5s by the watchdog.\n\n## under the hood\n\n- a new ci job starts the published binary in a real pty, quits it ten different ways (`q`, `:q`, `:wq`, ctrl+q, sigterm, with dialogs open, against a gPodder server that never answers) and fails if any terminal mode is left on. against 2.0.1 all ten fail.\n"}
