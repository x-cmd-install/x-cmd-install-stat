j2_1J","name":"podliner-win-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":348487980,"digest":"sha256:14544da3cf06f35278a07122d0d02d3e644ddf6a19d525a64b5366493bdb356b","download_count":33,"created_at":"2026-09-30T19:11:10Z","updated_at":"2026-09-30T19:11:19Z"},{"id":601619749,"node_id":"RA_kwDOPxMbp84j2_0l","name":"podliner-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":155183452,"digest":"sha256:eef6bd2c1fcfda30803a108906c75e0e23c4e8a5791b79f43f27365d0259e8be","download_count":2,"created_at":"2026-09-30T19:11:08Z","updated_at":"2026-09-30T19:11:13Z"},{"id":601619802,"node_id":"RA_kwDOPxMbp84j2_1a","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":780,"digest":"sha256:db9000b8bffdff00b06866f1d75dc9722f58f79508ffb652708d38bc0db36d38","download_count":7,"created_at":"2026-09-30T19:11:11Z","updated_at":"2026-09-30T19:11:11Z"}],"body":"podliner v2.2.0\n\na built-in audio engine for macs without vlc or mpv (#3), and a handful of fixes, some of them old.\n\n## new\n\n- **built-in engine.** podliner can now play mp3 on its own, nothing to install. on macOS it steps in when neither vlc nor mpv is there; before, only ffplay was left, which cannot pause, seek or change speed. everywhere else it is there with `:engine builtin`. it plays mp3 only for now, which is what nearly every feed serves; for anything else it says so.\n\n  a jump goes straight to that point in the file, so resuming at 45:00 does not download the 45 minutes before it.\n\n- **opml import and export work without a terminal.** `podliner --opml-import feeds.opml` and `--opml-export` do their job and exit when nothing can show the ui, without needing an audio engine or the network. this is what a homebrew formula test needs.\n\n## fixed\n\n- **the next episode never started on its own.** auto-advance had been broken since october 2025: the next episode was picked, but nothing played it. it plays again, queue first, then the feed.\n- **with mpv every episode started at 100% volume and 1.0x**, whatever you had set. volume and speed now carry over to every episode.\n- **feeds and downloads timed out where ipv6 is broken.** podliner waited on the ipv6 address until its 30s timeout; curl got the same feeds in 4s. it now tries ipv4 alongside after a moment, like browsers do.\n- **closing the terminal window or killing podliner lost up to 30s of position.** both now quit the way `q` does and save first.\n- **an episode that could not be played showed \"slow\u2026\" for good.** it now says why, for example \"can't play: HTTP 404\".\n- **`H` and `L` jumped 10 seconds**, not the minute the help promises.\n\n## under the hood\n\n- new smoke tests in a real terminal: the built-in engine against local files with and without headers, killing podliner while it plays, and opml without a terminal.\n"}
