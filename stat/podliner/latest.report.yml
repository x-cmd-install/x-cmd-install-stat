jpSA7","name":"podliner-win-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":346778693,"digest":"sha256:30d8017e299d84ee0a64decf297edf30f686b206f0701c5e51bb723d317c205c","download_count":22,"created_at":"2026-09-29T11:15:47Z","updated_at":"2026-09-29T11:15:58Z"},{"id":598024185,"node_id":"RA_kwDOPxMbp84jpR_5","name":"podliner-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":154505344,"digest":"sha256:0028137fb357054768890eae63410285b57ca0bb385eb79919a4f2c42d1ba3a1","download_count":2,"created_at":"2026-09-29T11:15:46Z","updated_at":"2026-09-29T11:15:51Z"},{"id":598024278,"node_id":"RA_kwDOPxMbp84jpSBW","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":780,"digest":"sha256:d6dffa76a0868073e3cd0cd644e46163bc48ef01422f9014d331d8bcd6154a29","download_count":4,"created_at":"2026-09-29T11:15:48Z","updated_at":"2026-09-29T11:15:48Z"}],"body":"podliner v2.1.0\n\nfeeds now refresh on their own (#32), and mpris finally says what is playing (#33).\n\n## new\n\n- **feeds are fetched on start and every 60 minutes.** before, nothing was fetched until you typed `:refresh`, so a library could sit on old episodes for months. the sidebar title shows how old the feeds are (`Feeds \u00b7 12m ago`, `Feeds \u00b7 refreshing`, `Feeds \u00b7 2 failed`). change the interval with `:refresh auto <minutes>`, turn it off with `:refresh auto off` or `RefreshIntervalMinutes: 0`. `--offline` fetches nothing.\n\n## fixed\n\n- **mpris metadata was always empty** and a paused episode showed as stopped. it read the current episode from a field nothing ever set. title, show, length and track id now come through, so waybar, playerctl and the gnome/kde widgets show the episode.\n- **no audio engine installed** crashed with an unhandled exception and a stack trace. podliner now says to install vlc, mpv or ffmpeg, with the pacman, apt and brew line, and exits.\n- **the first key after resizing the terminal was lost** or came out as garbage.\n- **a refresh moved the selection back to the first episode.** with refreshes running on their own that would have pulled the cursor away while you browse.\n- **`--offline` and `:net offline` lasted about a second**: the next network check switched back online. going offline by hand now holds until `:net online`.\n- **`--log-dir` was ignored under systemd**, logs went to the journal instead.\n- the help and readme said `g` / `G` jump to the top and bottom of the list. they seek to the start and end of the episode.\n\n## under the hood\n\n- new smoke tests in a real pty: auto refresh against a local feed server that counts requests, typing right after a resize, and starting with no audio engine.\n"}
