khXeI","name":"podliner-win-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":348484396,"digest":"sha256:c730edbd3fc7050f9c1cae22360d0ce616d8839b53ae01a20f7a0c00f964c9f6","download_count":42,"created_at":"2026-10-05T13:56:47Z","updated_at":"2026-10-05T13:57:04Z"},{"id":612726566,"node_id":"RA_kwDOPxMbp84khXcm","name":"podliner-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":155182841,"digest":"sha256:827c7a012eaa3ef5667972524a343a07cf7176b37a75c8c408fad4219d78c5e5","download_count":4,"created_at":"2026-10-05T13:56:44Z","updated_at":"2026-10-05T13:56:50Z"},{"id":612726785,"node_id":"RA_kwDOPxMbp84khXgB","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":780,"digest":"sha256:5dffbd269dd973d7550e07f7655354eea0c5846f0dd1fd1d866a4ae9d856b53f","download_count":14,"created_at":"2026-10-05T13:56:49Z","updated_at":"2026-10-05T13:56:50Z"}],"body":"podliner v2.2.1\n\nfixes for resuming episodes (#39) and for positions that got mixed up between episodes.\n\n## fixed\n\n- **streamed episodes did not resume where you left off.** podliner told the engine where to start only 350 ms after it began. by then a stream is usually still opening, so mpv threw the position away and the episode started at 0:00. the position now goes with the play itself, for every engine. thanks to dmaglio for the detailed report.\n- **vlc could hang at 0:00 when resuming.** it moved to the saved position from inside one of its own callbacks, which libvlc does not allow.\n- **a slow or broken stream wiped the saved position.** while an episode loaded podliner saved 0 as its position, so quitting before it started lost your place.\n- **switching episodes could carry the old position over.** right after a switch the new episode briefly took the position of the one before, which could mark a short episode as played.\n- **while a resumed episode loaded the list showed it as unplayed.** it now keeps showing where it resumes and \"loading\u2026\" stays until it really plays.\n"}
