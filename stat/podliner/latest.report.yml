hHB6z","name":"podliner-win-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":346766405,"digest":"sha256:205f5739cba77708a1c67f8a9be59c0e774c4e1b3292eaac4b04d32663c4834b","download_count":6,"created_at":"2026-09-10T17:40:44Z","updated_at":"2026-09-10T17:40:55Z"},{"id":555490906,"node_id":"RA_kwDOPxMbp84hHB5a","name":"podliner-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":154501836,"digest":"sha256:e80a2bd91f6b6fe3ae9db1b77b47b422035e978c8716c1d63855bebe14eb29ae","download_count":1,"created_at":"2026-09-10T17:40:40Z","updated_at":"2026-09-10T17:40:50Z"},{"id":555491024,"node_id":"RA_kwDOPxMbp84hHB7Q","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":780,"digest":"sha256:dd1a8a1519d09b7d60f6f5172d848581a96fa31837dd4c54be2f69e4fb197210","download_count":4,"created_at":"2026-09-10T17:40:45Z","updated_at":"2026-09-10T17:40:45Z"}],"body":"podliner v2.0.0\n\nthe project is now called podliner all the way down: namespaces, assemblies, test projects. that rename is the reason for the major bump. everything else here is bug fixes and a lot of tests.\n\n## breaking\n\n- **namespaces renamed** from `StuiPodcast.*` to `Podliner.*`. only matters if you built against the assemblies. `.git-blame-ignore-revs` carries the rename commit so blame still works.\n- **`q` only quits now.** it used to double as `:queue add` when typed in the command box, so the help browser documented a shortcut that quits the app when pressed and queues an episode when typed. use `:queue add`.\n- **menus have no alt shortcuts.** the `_` hotkey markers are gone from all 19 labels; they collided with the single-letter keys.\n- **`:queue add` no longer removes.** it was a second name for `toggle`, so running it on an already queued episode dropped it back out. `add` appends, `toggle` toggles.\n- **`:download` on a finished download no longer says \"unqueued\".** it never removed anything; use `:download rm`.\n\n## new\n\n- **`:download rm`** (alias `:dl rm`) deletes a downloaded file and frees the space. there was no way to do that before, from any command.\n- **chapters tab is reachable from the keyboard.** `h` and `l` now walk the whole row: feeds, episodes, shownotes, chapters. they used to stop at shownotes, which left the chapters tab mouse-only.\n- **`Esc` leaves a search.**\n- **`:theme user`** selects the fourth theme, which the toggle could already reach but the command could not.\n\n## fixed\n\n- **adding your first feed did nothing visible.** `:add <url>` fetched, persisted and logged the feed and left the sidebar empty until you restarted. same for episodes pulled by `:refresh`. the app-side caches could not see writes that went into the library from the feed service.\n- **the queue looked empty after every restart** even though it was persisted correctly the whole time.\n- **the player bar showed 0% volume after launch**; the persisted volume and speed were loaded and then never painted.\n- **a search could not be left.** `:search clear` rebuilt the list but left the filter in place, so the list stayed filtered.\n- **the engine preference reset to `auto` on every restart** for vlc and mediafoundation.\n- **the F12 log overlay showed one line** above 27 blank rows.\n- **`:engine show` printed one of its three lines** and drew a box wider than the screen.\n- **`:copy` reported success on wayland and left the clipboard untouched.** it only tried xclip and xsel, and xclip exits 0 on a wayland session without owning the selection.\n- **`:queue rm` can be undone** now, like the rest of the destructive actions.\n- **the window redraws after you move or resize it** on linux and macos (#4). terminal.gui polls for resizes instead of listening for a signal, and a missed poll left every view at its old size.\n- **the player control row no longer overlaps itself** below ~140 columns; controls drop by tier instead.\n- **menu separators** rendered as a literal `-` row.\n- **`:speed +0.1`** accumulated float error and wrote values like `0.9999999999999997` into the config.\n- **`<script>` content no longer leaks into shownotes.**\n- the `Search:` label in the help browser was drawn underneath the search field and invisible.\n- `:theme` toggled the theme and then threw the preference away, so it reset on the next start.\n- an unknown `:theme <name>` silently applied a different theme and reported success.\n- `:play-source local` said \"offline: not downloaded\" while online.\n\n## under the hood\n\n- **CI** builds and tests on ubuntu, windows and macos for every push and pull request. before this, nothing gated a merge.\n- **1515 tests**, up from 0 for the UI. there is a headless terminal.gui harness now, so panes, key bindings, dialogs and the whole wiring layer are covered in `dotnet test` with no terminal.\n- dropped the unused `Microsoft.Data.Sqlite` dependency and bumped AngleSharp past its advisory. no known vulnerable packages.\n- `UiShell` split from 1027 lines into partial files; `IFeedService`, `IDownloadManager` and the runtime stores extracted so the wiring can be tested against fakes.\n\nthanks to @odilf for spotting the Terminal.Gui HintPath that broke the build for everyone outside my machine (#27).\n","mentions_count":1}
