{"id":400608193,"author":{"login":"mzau","id":11637059,"node_id":"MDQ6VXNlcjExNjM3MDU5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPcP5wM4X4MvB","tag_name":"2.0.8","target_commitish":"main","name":"2.0.8 \u2014 security fixes + honest token budget + torch-free","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-30T20:16:29Z","updated_at":"2026-10-01T02:46:37Z","published_at":"2026-10-01T02:46:37Z","assets":[{"id":602293080,"node_id":"RA_kwDOPcP5wM4j5kNY","name":"mlx_knife-2.0.8-py3-none-any.whl","label":"","uploader":{"login":"mzau","id":11637059,"node_id":"MDQ6VXNlcjExNjM3MDU5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":997792,"digest":"sha256:08729f6b218cf8c1ec289f41f0c6a900731744729760b6950f888d97bde56b3a","download_count":0,"created_at":"2026-10-01T02:46:36Z","updated_at":"2026-10-01T02:46:37Z"},{"id":602293079,"node_id":"RA_kwDOPcP5wM4j5kNX","name":"mlx_knife-2.0.8.tar.gz","label":"","uploader":{"login":"mzau","id":11637059,"node_id":"MDQ6VXNlcjExNjM3MDU5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1008468,"digest":"sha256:8724b4318ccd5724b5dc287048d32199e7ba4a5e4bbc87f19233b26b8762bd52","download_count":0,"created_at":"2026-10-01T02:46:36Z","updated_at":"2026-10-01T02:46:37Z"}],"body":"## New since 2.0.7\n\n**Two security fixes.** A checkpoint whose `config.json` declares `model_file` is refused before any backend is called \u2014 mlx-lm executes that file on load ([CVE-2026-5843](https://github.com/mzau/mlx-knife/security/advisories/GHSA-9q3w-6wx3-7vh9), [#72](https://github.com/mzau/mlx-knife/issues/72)). And mlx-knife no longer runs Python found in the directory a command is started in: `serve` and `embed-serve` imported a module named like `mlxk2` or one of its dependencies from there instead of the installed package, and `run --audio` ran a `multiprocessing/` package found there \u2014 a cloned model directory could carry one. Affected are 2.0.0 through 2.0.8b2 ([GHSA-3pcp-w323-9wmv](https://github.com/mzau/mlx-knife/security/advisories/GHSA-3pcp-w323-9wmv)). Code a checkpoint declares through `auto_map` remains outside mlx-knife's control on the vision and audio paths ([#71](https://github.com/mzau/mlx-knife/issues/71), [SECURITY.md](https://github.com/mzau/mlx-knife/blob/main/SECURITY.md#code-in-model-directories)).\n\n**An empty path no longer means the working directory.** `mlxk push \"\" <repo>` \u2014 easily produced by an unset shell variable \u2014 uploaded the directory it was run from, and `mlxk convert \"\"` converted it. Both now refuse an empty or whitespace-only path. On an older version, guard the argument in scripts: `mlxk push \"${DIR:?}\" <repo> --private`.\n\n**The generation budget holds** ([#66](https://github.com/mzau/mlx-knife/issues/66)). Without `max_tokens`, CLI and server generate at most `min(32768, context window \u2212 prompt)` tokens, where `run` used the whole window and `serve` half of it. A cut answer says `finish_reason: \"length\"`, a prompt that fills the window is refused before the first token, and `serve --max-tokens` reaches every request.\n\n**Nothing is dropped in silence.** An image or audio file sent to a text-only model gets **422** instead of an answer that ignored it; `stop` cuts batch answers; `usage` counts tokens instead of words \u00d7 1.3.\n\n**Fewer dependencies, more vision models.** torch, torchvision and `datasets` are gone \u2014 a 524 MB (36 %) smaller install on mlx-vlm 0.6.10, mlx-audio 0.4.8 and transformers 5.14.1. `qwen2_vl`, `qwen2_5_vl` and `qwen3_5` checkpoints run as vision models, and `list` and the server agree on which models can see.\n\n**`serve` behaves under load and on stop.** `/health` and `/v1/models` answer while a request generates ([#64](https://github.com/mzau/mlx-knife/issues/64)), streaming is no longer many times slower than batch ([#73](https://github.com/mzau/mlx-knife/issues/73)), and no server process outlives its supervisor ([#60](https://github.com/mzau/mlx-knife/issues/60)).\n\n### Upgrade Note\n\n**Python 3.11 or later is required.** On Python 3.10, `pip install -U mlx-knife` says nothing and leaves 2.0.7 in place, which does not carry this release's security fixes; upgrade the interpreter first. Server clients: `GET /health` now answers `\"status\": \"ok\"`; every wire change is listed in the [SERVER-HANDBOOK](https://github.com/mzau/mlx-knife/blob/main/docs/SERVER-HANDBOOK.md) under *From 2.0.7 \u2192 2.0.8*.\n\n### Known limits\n\nA stream that arrives as one event runs on after the client closes it ([#82](https://github.com/mzau/mlx-knife/issues/82)); `mlxk run` on a vision model prints no answer when the generation reaches its 2048-token default ([#79](https://github.com/mzau/mlx-knife/issues/79)); after an inference-backend fault `serve` keeps answering `/health` ([#65](https://github.com/mzau/mlx-knife/issues/65)).\n\n### Install\n\n```bash\npip install -U mlx-knife\n```\n\nFull details: [CHANGELOG.md](https://github.com/mzau/mlx-knife/blob/main/CHANGELOG.md)\n"}
