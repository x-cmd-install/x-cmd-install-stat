JumM4iylZ8","name":"kuttl_0.27.0_linux_s390x.tar.gz","label":"","uploader":{"login":"porridge","id":489420,"node_id":"MDQ6VXNlcjQ4OTQyMA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15441939,"digest":"sha256:06838c3b0f1c10c35ded62c35cc8e6f62ebb80bf4d98a96821b4aecb6409a843","download_count":1,"created_at":"2026-09-23T12:01:10Z","updated_at":"2026-09-23T12:01:50Z"},{"id":583685750,"node_id":"RA_kwDODVJumM4iylZ2","name":"kuttl_0.27.0_linux_x86_64.tar.gz","label":"","uploader":{"login":"porridge","id":489420,"node_id":"MDQ6VXNlcjQ4OTQyMA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":16125623,"digest":"sha256:5a51888ff8a162b4ffe2f32564b8c62d5c0319569ccf6805851554fa1a8ded8b","download_count":312,"created_at":"2026-09-23T12:01:10Z","updated_at":"2026-09-23T12:01:58Z"}],"body":"This release has seen the most contributions since I remember! \ud83e\udd73 Thanks everyone!\r\n\r\n## \ud83d\ude80 Highlights\r\n\r\n- lint: enable thelper linter (#723) - the visible effect is that the prefix in `kuttl` output (which used to be a useless `logger.go:42` on all lines) now usually reflects the relevant place in the code\r\n- add: new `--delete` flag (#715) - it is now possible to skip deletion of namespaces of only failing cases; it also now correctly skips cluster deletion\r\n\r\n## \u26a0\ufe0f Breaking Changes\r\n\r\n- fix: respect case-insensitive `reportFormat` in TestSuite config (#721) - the Go type changed for the field, the underlying base type is still `string` and the allowed values did not change (modulo whitespace trimming) so hopefully it's unlikely to cause any pain in real life\r\n\r\n## \ud83d\udc1b Bug Fixes\r\n\r\n- fix: respect case-insensitive reportFormat in TestSuite config (#721)\r\n- add: new `--delete` flag (#715)\r\n- docs: fix typos in KEPs (#713)\r\n- fix(test): use require.NoError for envtest startup in TestAssertExpressions (#706)\r\n- fix: randomize namespace in TestStepDeleteExistingLabelMatch to prevent -count flake (#694)\r\n\r\n## \ud83c\udf31 Dependency bumps\r\n\r\n- ci: derive Go version from go.mod in test workflows (#722)\r\n- chore(tests): tell setup-envtest to use any k8s patch version (#697)\r\n- chore(deps): bump github.com/dustin/go-humanize from 1.0.1 to 1.1.0 (#720)\r\n- chore(deps): bump github.com/go-logr/logr from 1.4.3 to 1.4.4 (#705)\r\n- chore(deps): bump github.com/google/cel-go from 0.28.0 to 0.31.0 (#692, #699, #701, #704, #710)\r\n- chore(deps): bump github.com/moby/moby/api from 1.54.2 to 1.55.0 (#695)\r\n- chore(deps): bump github.com/moby/moby/client from 0.4.1 to 0.6.0 (#696, #707, #717)\r\n- chore(deps): bump github.com/stretchr/testify from 1.11.1 to 1.12.1 (#712)\r\n- chore(deps): bump golang.org/x/crypto from 0.51.0 to 0.52.0 (#700)\r\n- chore(deps): bump golang.org/x/net from 0.53.0 to 0.55.0 (#698)\r\n- chore(deps): bump google.golang.org/grpc from 1.80.0 to 1.82.1 (#702)\r\n- chore(deps): bump sigs.k8s.io/controller-runtime from 0.25.0 to 0.25.1 in the kubernetes group across 1 directory (#719)\r\n- chore(deps): bump the actions group with 3 updates (#724) \r\n- chore(deps): bump the kubernetes group (#703, #693, #716, #711, #714)\r\n\r\n## Contributors\r\n\r\n@porridge, @pujitha24, @somaz94, @vaibhav8a, @winiciusallan and [@dependabot[bot]](https://github.com/apps/dependabot) \r\nThanks to @vladbologa and @mclasmeier for reviews!","mentions_count":7}
