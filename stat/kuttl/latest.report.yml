s): bump go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp from 1.27.0 to 1.43.0 (#678)\r\n\r\n## Contributors\r\n\r\n@aaronhurt, @dependabot, @dependabot[bot], @mandre and @porridge\r\n","mentions_count":4}
