ed_at":"2026-10-26T15:37:39Z"},{"id":678612366,"node_id":"RA_kwDOD2fs7M4ocs2O","name":"provenance.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":25079,"digest":"sha256:5933138fce19623ed2ba26d4e3bd80d98d3a47522764a8480251221716e3d0d4","download_count":84,"created_at":"2026-10-26T15:38:41Z","updated_at":"2026-10-26T15:38:42Z"}],"body":"## Highlights\n\nFlux v2.10.0 is a feature release. Users are encouraged to upgrade for the best experience.\n\nOverview of the new features:\n\n- Object identity is generally available; the `ObjectLevelWorkloadIdentity` feature gate is retired\n- SPIFFE mTLS for inter-controller communication\n- Notification `Event`, `Alert` and `Provider` APIs promoted to `v1`\n- `OCIRepository` as a chart source for `HelmRelease`\n- SOPS decryption for files encrypted with comment regexes, and `--override-manager-before-dry-run` (`Kustomization`)\n- Image update batching with `.spec.policyChangeDelay`, retry on rejected pushes, and `.Changed.Summary` (`ImageUpdateAutomation`)\n- Flux artifact storage backend enabled by default for `ImageRepository` tags\n- Cross-namespace artifacts, tenant namespace provisioning, and path-pattern discovery (`ArtifactGenerator`)\n- New Zoom, incident.io and Mastodon notification providers\n- Built with Kubernetes 1.37 and Go 1.27\n\n❤️ Big thanks to all the Flux contributors that helped us with this release!\n\n### Kubernetes compatibility\n\nThis release is compatible with the following Kubernetes versions:\n\n| Kubernetes version | Minimum required |\n|--------------------|------------------|\n| `v1.35`            | `>= 1.35.2`      |\n| `v1.36`            | `>= 1.36.1`      |\n| `v1.37`            | `>= 1.37.0`      |\n\n> [!NOTE]\n> Note that the Flux project offers support only for the latest three minor versions of Kubernetes.\n> Backwards compatibility with older versions of Kubernetes and OpenShift is offered by vendors such as\n> [ControlPlane](https://control-plane.io/enterprise-for-flux-cd/) that provide enterprise support for Flux.\n\n### OpenShift compatibility\n\nFlux can be installed on Red Hat OpenShift cluster directly from OperatorHub using [Flux Operator](https://operatorhub.io/operator/flux-operator). The operator allows the configuration of Flux multi-tenancy lockdown, network policies, persistent storage, sharding, vertical scaling and the synchronization of the cluster state from Git repositories, OCI artifacts, and S3-compatible storage.\n\n## Upgrade procedure\n\n⚠️ **Breaking changes in this release:**\n\n- Object identity is always enabled and the default Flux RBAC no longer grants the `create` verb on the `serviceaccounts/token` resource. If your installation relies on the default RBAC, bind a ClusterRole with this permission to the controller ServiceAccount before upgrading. See [fluxcd/flux2#6139](https://github.com/fluxcd/flux2/pull/6139) for the required ClusterRole and ClusterRoleBinding.\n- The notification `Alert` and `Provider` APIs are promoted to `v1`. Converting a `v1beta3` `Alert` or `Provider` to `v1` drops the deprecated `Alert.spec.summary` and `Provider.spec.interval` fields, the static JWT token for Azure Event Hub, and TLS or proxy configuration in `Provider.spec.secretRef`. Use `eventMetadata.summary`, `proxySecretRef` and `certSecretRef` instead.\n- The Flux artifact storage backend is now the default for the `ImageRepository` tag database. Switching the gate wipes the local tag database, so the first reconciliation after the upgrade rescans every `ImageRepository`. Set `--feature-gates=FluxStorage=false` to keep using BadgerDB.\n- Remote cluster authentication with `.spec.kubeConfig.configMapRef` uses object identity; replace the legacy `audiences` key with `credential.auth.fluxcd.io/audiences`.\n\nPlease follow the [Upgrade Procedure for Flux v2.7+](https://github.com/fluxcd/flux2/discussions/5572) for a smooth upgrade from older versions of Flux to v2.10.\n\n## Components changelog\n\n- source-controller [v1.10.1](https://github.com/fluxcd/source-controller/blob/v1.10.1/CHANGELOG.md)\n- kustomize-controller [v1.10.1](https://github.com/fluxcd/kustomize-controller/blob/v1.10.1/CHANGELOG.md)\n- notification-controller [v1.10.0](https://github.com/fluxcd/notification-controller/blob/v1.10.0/CHANGELOG.md)\n- helm-controller [v1.7.1](https://github.com/fluxcd/helm-controller/blob/v1.7.1/CHANGELOG.md)\n- image-reflector-controller [v1.3.0](https://github.com/fluxcd/image-reflector-controller/blob/v1.3.0/CHANGELOG.md)\n- image-automation-controller [v1.3.0](https://github.com/fluxcd/image-automation-controller/blob/v1.3.0/CHANGELOG.md)\n- source-watcher [v2.3.1](https://github.com/fluxcd/source-watcher/blob/v2.3.1/CHANGELOG.md)\n\n## CLI changelog\n\n* Add backport label for 2.9 by @matheuscscp in https://github.com/fluxcd/flux2/pull/5970\n* Fix breaking change in-memory kustomization build by @matheuscscp in https://github.com/fluxcd/flux2/pull/5969\n* Update fluxcd/pkg dependencies by @fluxcdbot in https://github.com/fluxcd/flux2/pull/5976\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/5978\n* Add checksum verification for SOPS in e2e workflows by @ivonaest in https://github.com/fluxcd/flux2/pull/5961\n* Add --add-ignore-paths flag to artifact commands by @ruslan-shaydullin in https://github.com/fluxcd/flux2/pull/5885\n* Update fluxcd/pkg dependencies by @fluxcdbot in https://github.com/fluxcd/flux2/pull/5983\n* Update fluxcd/pkg dependencies by @fluxcdbot in https://github.com/fluxcd/flux2/pull/5989\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/5993\n* Include source-watcher to oci flux-manifests by @sergelogvinov in https://github.com/fluxcd/flux2/pull/5995\n* docs: fix typo in RFC-0004 (enviornment -> environment) by @mridulagithub in https://github.com/fluxcd/flux2/pull/6002\n* Update fluxcd/pkg dependencies by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6005\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6010\n* Add version-file input to the Flux CLI action by @somaz94 in https://github.com/fluxcd/flux2/pull/5975\n* Add support for 2.9 in `migrate -f` by @matheuscscp in https://github.com/fluxcd/flux2/pull/6020\n* Fix Azure e2e tests after new major version with breaking changes by @matheuscscp in https://github.com/fluxcd/flux2/pull/6022\n* fix: restrict `allow-webhooks` netpol to receiver port by @stefanprodan in https://github.com/fluxcd/flux2/pull/6028\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6030\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6050\n* build(deps): bump the ci group across 1 directory with 19 updates by @dependabot[bot] in https://github.com/fluxcd/flux2/pull/6052\n* Format reproducible created timestamp in UTC by @lexfrei in https://github.com/fluxcd/flux2/pull/6074\n* Update to Kubernetes 1.37 by @stefanprodan in https://github.com/fluxcd/flux2/pull/6082\n* Run conformance tests for Kubernetes 1.37 by @stefanprodan in https://github.com/fluxcd/flux2/pull/6083\n* Remove the Cosign v2.6.1 pin by @matheuscscp in https://github.com/fluxcd/flux2/pull/6084\n* Add `--app-client-id` flag to `create secret githubapp` by @Erik-Schuetze in https://github.com/fluxcd/flux2/pull/6090\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6096\n* Match plugin archive entries with a leading ./ by @Saadanjum0 in https://github.com/fluxcd/flux2/pull/6099\n* Stop diff processing after an error by @idelchi in https://github.com/fluxcd/flux2/pull/6070\n* Respect pruning exclusions in kustomization diff by @idelchi in https://github.com/fluxcd/flux2/pull/6073\n* Introduce RBAC for ArtifactGenerator cross-namespace artifacts by @matheuscscp in https://github.com/fluxcd/flux2/pull/6101\n* [RFC-0014] Advanced Support for Short-Lived Cryptographic Material by @matheuscscp in https://github.com/fluxcd/flux2/pull/5702\n* Validate plugin manifest name by @Arawoof06 in https://github.com/fluxcd/flux2/pull/6104\n* ci: disable Replicated conformance tests by @stefanprodan in https://github.com/fluxcd/flux2/pull/6111\n* [RFC-0014] RFC refinements by @matheuscscp in https://github.com/fluxcd/flux2/pull/6105\n* [RFC-0014] Annotations for AWS STS Endpoint and Docker Hub OIDC Connection by @matheuscscp in https://github.com/fluxcd/flux2/pull/6114\n* Update to Kubernetes 1.37.1 and Go 1.27 by @stefanprodan in https://github.com/fluxcd/flux2/pull/6117\n* build(deps): bump the ci group across 1 directory with 15 updates by @dependabot[bot] in https://github.com/fluxcd/flux2/pull/6118\n* [RFC-0014] Add rules for missing corner cases by @matheuscscp in https://github.com/fluxcd/flux2/pull/6121\n* [RFC-0014] Address final nits arising from apis/crypto implementation by @matheuscscp in https://github.com/fluxcd/flux2/pull/6122\n* [RFC-0014] Final iterations for 2.10 by @matheuscscp in https://github.com/fluxcd/flux2/pull/6125\n* Revert \"Introduce RBAC for ArtifactGenerator cross-namespace artifacts\" by @matheuscscp in https://github.com/fluxcd/flux2/pull/6129\n* Allow controllers to perform SubjectAccessReview by @matheuscscp in https://github.com/fluxcd/flux2/pull/6132\n* Accept TYPE/NAME resource args in get/reconcile by @souvik-biswas-dev in https://github.com/fluxcd/flux2/pull/6134\n* Add digests flag to plugin search, which displays SHA values for all os/arch per binary by @datosh in https://github.com/fluxcd/flux2/pull/6016\n* Extend kubectl-style resource args to all Flux kinds and commands by @stefanprodan in https://github.com/fluxcd/flux2/pull/6135\n* Escape terminal control characters in CLI output by @Arawoof06 in https://github.com/fluxcd/flux2/pull/6110\n* Add suspend, resume and reconcile commands for ArtifactGenerator by @xchose in https://github.com/fluxcd/flux2/pull/6119\n* [RFC-0014] Address review findings by @matheuscscp in https://github.com/fluxcd/flux2/pull/6136\n* [RFC-0014] Inter-controller mTLS via SPIFFE by @matheuscscp in https://github.com/fluxcd/flux2/pull/6127\n* Fix proxy bypass in bootstrap --ca-file by @ljluestc in https://github.com/fluxcd/flux2/pull/6038\n* use restrictive file modes for generated manifests by @Arawoof06 in https://github.com/fluxcd/flux2/pull/6113\n* fix(goreleaser): make Homebrew formula pass brew audit by @trademomentumllc in https://github.com/fluxcd/flux2/pull/5973\n* Fix envsubst dropping input on long lines by @stefanprodan in https://github.com/fluxcd/flux2/pull/6138\n* fix: return clear error when --private-key-file path starts with '~' by @rafaelperoco in https://github.com/fluxcd/flux2/pull/5859\n* Fix stale flags and commands in CLI examples by @rawsun007 in https://github.com/fluxcd/flux2/pull/6123\n* Fix typos in user-facing CLI messages and comments by @MsfPablo in https://github.com/fluxcd/flux2/pull/6051\n* Remove unused fields from installFlags by @Pranav-error in https://github.com/fluxcd/flux2/pull/6061\n* ⚠️ Breaking change: Harden RBAC for controllers by @matheuscscp in https://github.com/fluxcd/flux2/pull/6139\n* Fix `--in-memory-build` restricting disk access by @rycli in https://github.com/fluxcd/flux2/pull/5974\n* Update dependencies for Flux 2.10 by @stefanprodan in https://github.com/fluxcd/flux2/pull/6140\n* [RFC-0014] Add 2.10 notes to RFC by @matheuscscp in https://github.com/fluxcd/flux2/pull/6145\n* fix(create): reject conflicting image policy selectors for every flag pair by @NUAAwqy in https://github.com/fluxcd/flux2/pull/6144\n* ci: Update GitHub Actions by @stefanprodan in https://github.com/fluxcd/flux2/pull/6147\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6148\n* Add `--policy-change-delay` to create image update by @stefanprodan in https://github.com/fluxcd/flux2/pull/6146\n* [RFC-0014] Remove temporary workarounds for mTLS e2e by @matheuscscp in https://github.com/fluxcd/flux2/pull/6137\n* [RFC-0014] Add HTTPS port to controller Services by @stefanprodan in https://github.com/fluxcd/flux2/pull/6149\n* [RFC-0014] Include SPIFFE mTLS in the e2e workflow by @stefanprodan in https://github.com/fluxcd/flux2/pull/6150\n* ci: fix goreleaser signing with cosign v3 by @stefanprodan in https://github.com/fluxcd/flux2/pull/6151\n* Remove unsupported fields in migrate -f by @stefanprodan in https://github.com/fluxcd/flux2/pull/6152\n* Bump minimum Kubernetes version to 1.35 by @stefanprodan in https://github.com/fluxcd/flux2/pull/6153\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6154\n* Use podinfo in the SPIFFE mTLS e2e test by @stefanprodan in https://github.com/fluxcd/flux2/pull/6156\n\n## New Contributors\n* @ivonaest made their first contribution in https://github.com/fluxcd/flux2/pull/5961\n* @ruslan-shaydullin made their first contribution in https://github.com/fluxcd/flux2/pull/5885\n* @sergelogvinov made their first contribution in https://github.com/fluxcd/flux2/pull/5995\n* @mridulagithub made their first contribution in https://github.com/fluxcd/flux2/pull/6002\n* @somaz94 made their first contribution in https://github.com/fluxcd/flux2/pull/5975\n* @lexfrei made their first contribution in https://github.com/fluxcd/flux2/pull/6074\n* @Erik-Schuetze made their first contribution in https://github.com/fluxcd/flux2/pull/6090\n* @Saadanjum0 made their first contribution in https://github.com/fluxcd/flux2/pull/6099\n* @idelchi made their first contribution in https://github.com/fluxcd/flux2/pull/6070\n* @Arawoof06 made their first contribution in https://github.com/fluxcd/flux2/pull/6104\n* @souvik-biswas-dev made their first contribution in https://github.com/fluxcd/flux2/pull/6134\n* @datosh made their first contribution in https://github.com/fluxcd/flux2/pull/6016\n* @xchose made their first contribution in https://github.com/fluxcd/flux2/pull/6119\n* @ljluestc made their first contribution in https://github.com/fluxcd/flux2/pull/6038\n* @trademomentumllc made their first contribution in https://github.com/fluxcd/flux2/pull/5973\n* @rawsun007 made their first contribution in https://github.com/fluxcd/flux2/pull/6123\n* @MsfPablo made their first contribution in https://github.com/fluxcd/flux2/pull/6051\n* @Pranav-error made their first contribution in https://github.com/fluxcd/flux2/pull/6061\n* @NUAAwqy made their first contribution in https://github.com/fluxcd/flux2/pull/6144\n\n**Full Changelog**: https://github.com/fluxcd/flux2/compare/v2.9.6...v2.10.0\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":25}
