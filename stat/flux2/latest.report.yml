10-01T09:56:44Z","updated_at":"2026-10-01T09:56:44Z"},{"id":602941231,"node_id":"RA_kwDOD2fs7M4j8Ccv","name":"manifests.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":47959,"digest":"sha256:781a4748ea8d0d7fcdc0e1683f1b81c8e5c92d7f4265694d756c0b49660b927d","download_count":20728,"created_at":"2026-10-01T09:56:44Z","updated_at":"2026-10-01T09:56:44Z"},{"id":602943103,"node_id":"RA_kwDOD2fs7M4j8C5_","name":"provenance.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":25107,"digest":"sha256:d1c99ad9ec3f9b2c38e4a55375fc10b9b80dd8636bf4646fb6527ac5de2e91a8","download_count":10943,"created_at":"2026-10-01T09:57:39Z","updated_at":"2026-10-01T09:57:39Z"}],"body":"## Highlights\n\nFlux v2.9.6 is a patch release that stops helm-controller from reapplying chart CRDs on every upgrade when server-side apply is enabled, and recovers HelmReleases left with a drifted `Ready=Unknown` condition after a failed status patch. source-controller normalizes Azure Blob listing ETags so unchanged containers are no longer re-downloaded on every reconcile, and evicts stale Helm repository index entries from the cache so repositories with frequently changing indexes no longer fail with \"Cache is full\". kustomize-controller extends SOPS decryption error redaction to `spec.postBuild.substituteFrom` values, so substituted secrets echoed back in API validation errors are masked out of status conditions and events, and adds the opt-in `DisableCommitStatusEvent` feature gate. Users are encouraged to upgrade for the best experience.\n\n\u2139\ufe0f Please follow the [Upgrade Procedure for Flux v2.7+](https://github.com/fluxcd/flux2/discussions/5572) for a smooth upgrade from Flux v2.6 to the latest version.\n\nFixes:\n- Stop reapplying chart CRDs on upgrades when using server-side apply with the default `Create` policy (helm-controller)\n- Recover HelmReleases stranded with a drifted `Ready=Unknown` condition after a failed status patch (helm-controller)\n- Ignore `NotFound` when deleting the HelmChart (helm-controller)\n- Normalize Azure Blob listing ETags so unchanged containers are not re-downloaded on every reconcile (source-controller)\n- Evict stale Helm repository index entries from the cache to avoid \"Cache is full\" errors (source-controller)\n- Extend SOPS decryption error redaction to `spec.postBuild.substituteFrom` values (kustomize-controller)\n\nImprovements:\n- Add the opt-in `DisableCommitStatusEvent` feature gate (kustomize-controller)\n\n## Components changelog\n\n- source-controller [v1.9.6](https://github.com/fluxcd/source-controller/blob/v1.9.6/CHANGELOG.md)\n- kustomize-controller [v1.9.6](https://github.com/fluxcd/kustomize-controller/blob/v1.9.6/CHANGELOG.md)\n- helm-controller [v1.6.5](https://github.com/fluxcd/helm-controller/blob/v1.6.5/CHANGELOG.md)\n\n## CLI changelog\n\n* [release/v2.9.x] Format reproducible created timestamp in UTC by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6081\n* Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6097\n\n**Full Changelog**: https://github.com/fluxcd/flux2/compare/v2.9.5...v2.9.6\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":3,"eyes":0},"mentions_count":1}
