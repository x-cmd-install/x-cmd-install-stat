Z","updated_at":"2026-11-20T13:08:38Z"},{"id":771873761,"node_id":"RA_kwDOD2fs7M4uAdvh","name":"provenance.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":25379,"digest":"sha256:6d16e4996cb589efb471066acc1f8982f8fafa44377a88d7ebf0fb51ae582c31","download_count":281,"created_at":"2026-11-20T13:09:38Z","updated_at":"2026-11-20T13:09:38Z"}],"body":"## Highlights\n\nFlux v2.10.1 is a patch release that fixes credential caching across the controllers, so changes to the `credential.auth.fluxcd.io/username` and `gcp.auth.fluxcd.io/workload-identity-provider` ServiceAccount annotations take effect on the next reconcile instead of continuing to use the previously cached authenticator until it expires or the controller restarts. It also resolves the default decryption ServiceAccount lazily for Kustomizations that only use Age or PGP keys, restores authentication to registries whose token service runs on a private address and after same-host HTTP to HTTPS redirects by updating ORAS to v2.7.0, and fixes Git checkouts that deleted the target of a relative symlink or got permanently stuck when the push branch removed a file that relative symlinks point to. Users are encouraged to upgrade for the best experience.\n\nℹ️ Please follow the [Upgrade Procedure for Flux v2.7+](https://github.com/fluxcd/flux2/discussions/5572) for a smooth upgrade from Flux v2.6 to the latest version.\n\nFixes:\n- Fix the credentials cache key so changes to the credential username or the GCP workload identity provider take effect on the next reconcile (helm-controller, kustomize-controller, source-controller, notification-controller, image-reflector-controller, image-automation-controller)\n- Fix resolving the default ServiceAccount for providers that don't use one (source-controller, image-reflector-controller, image-automation-controller)\n- Resolve the default decryption ServiceAccount lazily, only when a cloud KMS or Vault backend is used (kustomize-controller)\n- Restore authentication to registries whose token service runs on a private address and after same-host HTTP to HTTPS redirects by updating ORAS to v2.7.0 (source-controller)\n- Fix Git checkouts deleting the target of a relative symlink when the checked-out revision removes the symlink (source-controller)\n- Fix Git checkouts getting stuck when the push branch removes a file that relative symlinks point to (image-automation-controller)\n- Delete the reconcile duration metric series for objects that no longer exist (kustomize-controller)\n\nImprovements:\n- Remove leftover object-level workload identity log message (helm-controller, kustomize-controller, source-controller, notification-controller, image-reflector-controller, image-automation-controller)\n\n## Components changelog\n\n- source-controller [v1.10.2](https://github.com/fluxcd/source-controller/blob/v1.10.2/CHANGELOG.md)\n- kustomize-controller [v1.10.2](https://github.com/fluxcd/kustomize-controller/blob/v1.10.2/CHANGELOG.md)\n- notification-controller [v1.10.1](https://github.com/fluxcd/notification-controller/blob/v1.10.1/CHANGELOG.md)\n- helm-controller [v1.7.2](https://github.com/fluxcd/helm-controller/blob/v1.7.2/CHANGELOG.md)\n- image-reflector-controller [v1.3.1](https://github.com/fluxcd/image-reflector-controller/blob/v1.3.1/CHANGELOG.md)\n- image-automation-controller [v1.3.1](https://github.com/fluxcd/image-automation-controller/blob/v1.3.1/CHANGELOG.md)\n\n## CLI changelog\n\n* [release/v2.10.x] Strip credentials from the push artifact source URL by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6179\n* [release/v2.10.x] Reject partial basic auth in secret commands by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6185\n* [release/v2.10.x] Paginate resource listing in flux migrate by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6196\n* [release/v2.10.x] Prevent infinite loop on flux migrate by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6205\n* [release/v2.10.x] Fix resolve-symlinks for read-only directories by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6207\n* [release/v2.10.x] Fix panic on unreadable kustomization file by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6208\n* [release/v2.10.x] Update toolkit components by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6210\n* [release/v2.10.x] Fix panic decoding short Helm release storage in tree by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6211\n* [release/v2.10.x] Allow colons in --registry-creds password by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6212\n* [release/v2.10.x] Fix --team parsing in bootstrap commands by @fluxcdbot in https://github.com/fluxcd/flux2/pull/6213\n\n**Full Changelog**: https://github.com/fluxcd/flux2/compare/v2.10.0...v2.10.1\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":1}
