wDOBaULH84jjGmC","name":"pdfcpu_0.16.0_Windows_i386.zip","label":"","uploader":{"login":"hhrutter","id":11322155,"node_id":"MDQ6VXNlcjExMzIyMTU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6684119,"digest":"sha256:da6061ab90241cbacebad9d7369abb5aca422fe8516ebb94eee246e9825dc8ae","download_count":23,"created_at":"2026-09-28T21:00:36Z","updated_at":"2026-09-28T21:00:42Z"},{"id":596404609,"node_id":"RA_kwDOBaULH84jjGmB","name":"pdfcpu_0.16.0_Windows_i386.zip.sbom.json","label":"","uploader":{"login":"hhrutter","id":11322155,"node_id":"MDQ6VXNlcjExMzIyMTU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":12493,"digest":"sha256:1fb141b9666eb38e3c121b02a8fdcac7d1e0692da1c90f09a18f9017eb727ef5","download_count":4,"created_at":"2026-09-28T21:00:36Z","updated_at":"2026-09-28T21:00:36Z"},{"id":596404597,"node_id":"RA_kwDOBaULH84jjGl1","name":"pdfcpu_0.16.0_Windows_x86_64.zip","label":"","uploader":{"login":"hhrutter","id":11322155,"node_id":"MDQ6VXNlcjExMzIyMTU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6911387,"digest":"sha256:10eec0629e2472fd7d6df8ca5a4b0c5c3ef47bc3da7003583143ad85c31eeab7","download_count":166,"created_at":"2026-09-28T21:00:35Z","updated_at":"2026-09-28T21:00:42Z"},{"id":596404650,"node_id":"RA_kwDOBaULH84jjGmq","name":"pdfcpu_0.16.0_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"hhrutter","id":11322155,"node_id":"MDQ6VXNlcjExMzIyMTU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":12546,"digest":"sha256:7d9921e01df20377d687ee43b83763aaeef2e0c6e8b46bfe24e3f46944f85527","download_count":4,"created_at":"2026-09-28T21:00:37Z","updated_at":"2026-09-28T21:00:37Z"}],"body":"## v0.16.0\r\n\r\nThis release updates the Go API and configuration model, improves automation and PDF validation, and includes processing fixes and security hardening.\r\n\r\n## Changes since v0.16.0-rc.1\r\n\r\n- Protect image buffer allocations against integer overflow and enforce resource limits before decoding each TIFF page.\r\n- Fix default-configuration handling (#1492): synchronize access to the cached default configuration and return independent clones to callers.\r\n\r\n## Security advisories\r\n\r\nThis release includes fixes covered by six security advisories.\r\n\r\n- [Integer overflow in image buffer allocation](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-g766-88fx-58h8)\r\n- [Traditional cross-reference tables bypass configured XRef limits](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-fjh6-rrhv-4g63)\r\n- [Packed RGB image samples can cause an index-out-of-range panic during image extraction](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-9mmx-88p2-c8c6)\r\n- [Missing BitsPerComponent can cause a nil-pointer panic during image extraction](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-prvw-v9vv-6966)\r\n- [Integer overflow in XRef stream /W array can cause denial of service](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-w2hj-54mc-76r4)\r\n- [Off-by-one revision mapping weakens PDF signature modification reporting](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-7v74-phpq-xq6g)\r\n\r\n## Highlights\r\n\r\n- **Updated Go API** \u2014 Explicit contexts for long-running operations, optional progress reporting, and reusable caller-owned configuration.\r\n- **Configuration redesign** \u2014 Schema-aware loading, explicit initialization and reset, plus read-only and stateless operation.\r\n- **Automation and container preparation** \u2014 Signal cancellation, safer output replacement, password-file inputs, and verified execution under arbitrary user IDs.\r\n- **Stronger PDF validation** \u2014 Improved malformed-input handling, graph-traversal safeguards, and compatibility warnings for selected relaxed-validation decisions.\r\n- **Clearer signature validation** \u2014 Separate reporting of document integrity, certificate trust, revocation, and timestamp evidence.\r\n- **PDF processing fixes** \u2014 Improved resize orientation, rotated watermarks, form appearances, image handling, and LZW decoding.\r\n- **Smaller Go module** \u2014 Approximately 94% smaller in the original packaging comparison. Samples and test fixtures remain in Git but are excluded from module downloads.\r\n\r\n\r\n## Requirements and installation\r\n\r\nGo applications require **Go 1.26 or later** and updates to affected API calls. Existing file-backed configurations from **v0.15 or earlier** require an explicit configuration reset.\r\n\r\n\r\n```sh\r\ngo get github.com/pdfcpu/pdfcpu@v0.16.0\r\n```\r\n\r\n## Before upgrading\r\n\r\n### Reset legacy file-backed configuration\r\n\r\nExisting v0.15 and older `config.yml` files do not contain the new configuration schema identifier. pdfcpu preserves the\r\nfile and reports that a reset is required instead of rewriting it automatically.\r\n\r\nIf the configuration is not customized, run:\r\n\r\n```sh\r\npdfcpu config reset\r\npdfcpu config validate\r\n```\r\n\r\nFor an explicit configuration root, use the same root for every command:\r\n\r\n```sh\r\npdfcpu --conf /srv/pdfcpu config reset\r\npdfcpu --conf /srv/pdfcpu config validate\r\npdfcpu --conf /srv/pdfcpu config inspect\r\n```\r\n\r\nBefore resetting, back up any customized `config.yml`. After resetting, reapply your settings.\r\nInstalled user fonts and trusted certificates are preserved.<br>\r\nNew installations and stateless operation with `--conf disable` need no migration.\r\n\r\nSee the [v0.16 configuration upgrade guide](https://pdfcpu.io/getting_started/configuration_v016/).\r\n\r\n### Update Go API callers\r\n\r\n| Change | Required action |\r\n|:--|:--|\r\n| Long-running operations require a `context.Context` | Pass the request or job context, or `context.Background()` when cancellation is not needed. Nil contexts are rejected. |\r\n| Validation and optimization operations take a final `*api.ProgressOptions` | Pass `nil` when progress events are not needed. |\r\n| `LoadConfiguration()` now takes options and returns an error | Call `api.LoadConfiguration(api.ConfigurationOptions{})` and handle the error. |\r\n| Context-free and interim `WithContext`/`WithOptions` variants were consolidated | Use the canonical operation name. |\r\n\r\nConfigurations supplied by an application remain caller-owned and can be reused after an operation. Clone a configuration\r\nbefore applying different settings for another job; do not mutate it concurrently while operations use it.\r\nPassing `nil` loads the default configuration and may initialize files on disk. For stateless\r\napplications, explicitly load `api.ConfigurationModeStateless` and pass the returned configuration.\r\n\r\nSee [API installation and usage](https://pdfcpu.io/getting_started/install_api/) and the\r\n[v0.16 migration guide](https://pdfcpu.io/getting_started/configuration_v016/) for before/after examples.\r\n\r\n## Configuration and runtime\r\n\r\n### Explicit configuration modes\r\n\r\n- **Automatic** discovers or initializes file-backed configuration for normal CLI and API use.\r\n- **Read-only** loads a prepared configuration tree without modifying it.\r\n- **Stateless** uses built-in settings and the 14 core PDF fonts without accessing configuration files, user fonts or the\r\n  local certificate store.\r\n\r\nThe CLI selects stateless mode with `--conf disable`. <br>\r\nApplications select a mode through `api.ConfigurationOptions`. <br>\r\nConfiguration root precedence is the explicit flag, `PDFCPU_CONFIG_ROOT`, then the operating-system default. <br> Normal CLI PDF\r\ncommands have no read-only-mode flag: prepare the complete tree first and mount it read-only. <br> Go applications can select `api.ConfigurationModeReadOnly` to load existing configuration without modifying files.\r\n\r\nThe new commands are:\r\n\r\n```text\r\npdfcpu config init\r\npdfcpu config list\r\npdfcpu config inspect [--json]\r\npdfcpu config validate\r\npdfcpu config reset\r\n```\r\n\r\nUse\r\n`pdfcpu config inspect` for configuration paths and effective policy.\r\n\r\n### Cancellation and transactional output\r\n\r\nThe CLI responds to `Ctrl+C`, `SIGINT` and `SIGTERM`. The first signal requests a clean stop; a second signal terminates\r\nimmediately. Go callers control cancellation through the context passed to the operation.\r\n\r\nCancellation is cooperative, so a large operation may take a moment to reach a safe stopping point. File-producing\r\noperations stage output before publication. When cancellation or an ordinary write failure occurs before publication,\r\nan existing destination is preserved and unfinished temporary output is removed.\r\n\r\nStdin PDF input and merged form multi-fill output to stdout use the operating-system temporary directory. Replacement\r\nfiles are staged beside their destination. On supported Unix systems, replacement preserves the destination group or\r\nfails before publication.\r\n\r\n### Password files\r\n\r\nUse `--upw-file` or `--opw-file` wherever the corresponding literal password flag is accepted. Supply a password either\r\ndirectly or through a file, not both. Password files cannot use stdin.\r\n\r\nOne trailing LF or CRLF is ignored. Other spaces and line endings remain part of the password. An empty file supplies an\r\nempty password, except where a non-empty owner password is required.\r\n\r\nPassword changes can replace their positional old/new password pair with:\r\n\r\n| Command | Old password | New password |\r\n|:--|:--|:--|\r\n| `changeupw` | `--upwold-file` | `--upwnew-file` |\r\n| `changeopw` | `--opwold-file` | `--opwnew-file` |\r\n\r\nBoth file options for a password change must be supplied together.\r\n\r\n### Resource and network policy\r\n\r\n- `maxInputBytes` optionally limits each PDF input, including stdin spooling. Zero remains unlimited.\r\n- `maxObjectBytes` exposes the existing per-object reader buffer limit. Its default remains 64 MiB.\r\n- Offline mode now consistently covers remote images, link validation and live CRL/OCSP requests.\r\n- Outbound image and revocation requests reject loopback, private, link-local, multicast, unspecified and selected\r\n  special-purpose destinations by default. Trusted private revocation hosts can be configured explicitly.\r\n\r\nThese settings limit individual inputs or operations; they are not a total memory, disk or job-time budget.\r\n\r\n## Validation\r\n\r\n### Compatibility warnings\r\n\r\nCompatibility-warning coverage has substantially expanded. Relaxed validation reports selected conditions that strict validation would reject, indicating whether content was accepted, skipped or repaired in memory. These warnings are available through the CLI and structured API reports; `--quiet` suppresses CLI warnings.\r\n\r\nGo callers can obtain the same ordered report through `ValidateWithReport`, `ValidateFileWithReport` and\r\n`ValidateContextWithReport`. Existing error-only validation APIs remain available.\r\n\r\nWarning coverage is partial and will expand over time. Some relaxed-validation fallbacks produce no notice, so silence\r\ndoes not imply strict validation.\r\n\r\nStrict validation describes the checks pdfcpu currently implements; it does not certify complete ISO 32000 compliance\r\nor prove that no bounded low-level reader recovery occurred.\r\n\r\n### Expanded validation and malformed-input handling\r\n\r\nStronger validation and safer handling of malformed PDFs, including improved bounds checks, cycle detection and error reporting. Relaxed mode adds targeted compatibility exceptions while strict validation retains its requirements.\r\n\r\n## Signature-validation evidence\r\n\r\nSignature validation now clearly separates integrity, certificate trust, revocation and timestamp evidence from the\r\noverall local assessment. See the [signature-validation guide](https://pdfcpu.io/core/sign_validate/) for output examples,\r\nsupported checks and current limitations.\r\n\r\n## Distribution and constrained environments\r\n\r\nThe Go module now excludes samples and test fixtures while retaining all runtime resources (#1449).<br>\r\nThis release prepares pdfcpu for container deployment; an official image is planned for v0.17.\r\n\r\n## Compatibility summary\r\n\r\n- Existing v0.15 and older file-backed configuration requires an explicit reset.\r\n- Long-running Go APIs require a non-nil context under their canonical names.\r\n- Validation and optimization APIs listed above require the final progress argument.\r\n- Strict validation may reject malformed structures that earlier releases did not check.\r\n- Relaxed compatibility warnings do not yet cover every pre-existing fallback.\r\n- Cancellation takes effect at checkpoints, so some operations may not stop immediately.\r\n\r\n## Fixed issues\r\n\r\n[#1407](https://github.com/pdfcpu/pdfcpu/issues/1407),\r\n[#1444](https://github.com/pdfcpu/pdfcpu/issues/1444),\r\n[#1449](https://github.com/pdfcpu/pdfcpu/issues/1449),\r\n[#1457](https://github.com/pdfcpu/pdfcpu/issues/1457),\r\n[#1460](https://github.com/pdfcpu/pdfcpu/issues/1460),\r\n[#1461](https://github.com/pdfcpu/pdfcpu/issues/1461),\r\n[#1465](https://github.com/pdfcpu/pdfcpu/issues/1465),\r\n[#1466](https://github.com/pdfcpu/pdfcpu/issues/1466),\r\n[#1467](https://github.com/pdfcpu/pdfcpu/issues/1467),\r\n[#1470](https://github.com/pdfcpu/pdfcpu/issues/1470),\r\n[#1472](https://github.com/pdfcpu/pdfcpu/issues/1472),\r\n[#1473](https://github.com/pdfcpu/pdfcpu/issues/1473),\r\n[#1474](https://github.com/pdfcpu/pdfcpu/issues/1474),\r\n[#1477](https://github.com/pdfcpu/pdfcpu/issues/1477),\r\n[#1479](https://github.com/pdfcpu/pdfcpu/issues/1479),\r\n[#1484](https://github.com/pdfcpu/pdfcpu/issues/1484),\r\n[#1485](https://github.com/pdfcpu/pdfcpu/issues/1485),\r\n[#1487](https://github.com/pdfcpu/pdfcpu/issues/1487),\r\n[#1492](https://github.com/pdfcpu/pdfcpu/issues/1492).\r\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
