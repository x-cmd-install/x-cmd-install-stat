urity and stability update with no public API changes. \r\nRequires Go 1.26 or later.\r\n\r\nThis release fixes a denial-of-service vulnerability in grayscale and Indexed image rendering, including CalRGB palette\r\nhandling. Processing a crafted PDF could cause an index-out-of-range panic and terminate the calling process if the\r\npanic was not recovered. \r\n\r\nVersions v0.16.0 and earlier are affected.\r\nApplications extracting or rendering images from untrusted PDFs should upgrade to v0.16.1. \r\nSee [GHSA-6524-w46v-6399](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-6524-w46v-6399).\r\n\r\n\r\nImprovements:\r\n- Harden PDF parsing, image processing, JSON input handling, and signature-data parsing.\r\n- Prevent panics when rendering grayscale and Indexed images, including palette bounds and Decode mapping checks.\r\n- Strengthen external-link checks and reporting of problematic links; redact URL passwords in reports and CLI output.\r\n- Improve structural validation of embedded files, 3D annotations, and multimedia dictionaries.\r\n- Report JavaScript and supported media presence during validation without executing content or displaying script code.\r\n- Report invalid zero-offset xref entries as skipped in relaxed validation and reject them in strict mode (#612).\r\n- Fix strict validation of PDF dates ending in `Z` (#1493).\r\n- Update the TIFF dependency to v1.0.7.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
