(api): parse Bedrock event-stream binary framing (streaming was broken) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/238\n* fix(tui): char-boundary/UTF-8 panics that crash the TUI by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/239\n* fix(security): lock OAuth tokens, credential store & session files to 0o600 by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/240\n* fix(api): capture thinking/signature deltas & preserve block order in non-streaming aggregator by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/241\n* fix(query): preserve conversation across failed compaction (was mem::take-wiped) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/242\n* fix(query): don't execute tools from a failed provider stream; error on malformed tool args by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/243\n* perf(tui): reuse completed-message cache during streaming (was O(messages^2) re-render) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/244\n* fix(tools): preserve line endings on edit (was silent CRLF->LF rewrite) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/245\n* fix(query): size compaction from the model's real context window (not a Claude-only heuristic) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/246\n* fix(tools): route apply_patch/batch_edit/notebook_edit/cron writes through write_atomic by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/247\n* add self-hosted SearXNG web search backend by @TheChuckster in https://github.com/Kuberwastaken/claurst/pull/167\n* fix(tui): bound memory growth (evict paste bodies, clamp scroll_offset) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/248\n* fix: make background-agent cancel actually stop the task (not just relabel it) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/249\n* fix(tools): harden the live PTY shell (kill on timeout/drop, #184 non-hang); delete dead BashTool by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/250\n* feat(release): publish SHA256SUMS and verify downloads in install.sh / install.ps1 by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/251\n* feat(tui): Shift+Enter inserts a newline; Enter submits by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/252\n* fix(security): central permission backstop in execute_tool; gate worktree post_create_command by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/253\n* feat(core): session tree \u2014 non-destructive /revert via leaf pointer + branch reconstruction by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/254\n* fix(query): make in-flight tools & sub-agents cancellable (cancellation tree) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/255\n* refactor(api): shared SSE byte-decoder (fixes UTF-8 chunk corruption) + registry-driven picker + protocol scaffold by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/256\n* feat(query): sanitize_history invariant pass (retires tool_use/tool_result 400s) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/257\n* feat: conditional tool guidelines + functional ToolSearch discovery (MI-6) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/258\n* refactor(query): /goal as in-loop continuation policy + max-steps graceful degradation (MI-3) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/259\n* feat(query): compaction upgrades \u2014 token-budget keep, real-usage trigger, UPDATE summary, files manifest (MI-4) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/260\n* refactor: split god-files (commands/lib.rs -81%, query runner/ modules) \u2014 behavior-preserving (MI-5) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/261\n* feat: XDG base directory support + CLAURST_HOME 