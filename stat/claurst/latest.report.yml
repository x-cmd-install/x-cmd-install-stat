28:14Z"},{"id":639601651,"node_id":"RA_kwDOR1lxFc4mH4vz","name":"claurst-macos-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":14951235,"digest":"sha256:a105fe400174bb00dbadd8a1ad85f5329e9c93ec51c18ef6cbd4d1c86dadbabf","download_count":19,"created_at":"2026-10-14T07:28:14Z","updated_at":"2026-10-14T07:28:15Z"},{"id":639601659,"node_id":"RA_kwDOR1lxFc4mH4v7","name":"claurst-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15665039,"digest":"sha256:e9c663486f5094ee4f0fc1783e2bf9cf63606ccafa60e8e69fd1d84ceed33f45","download_count":82,"created_at":"2026-10-14T07:28:14Z","updated_at":"2026-10-14T07:28:15Z"},{"id":639601652,"node_id":"RA_kwDOR1lxFc4mH4v0","name":"install.ps1","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":12456,"digest":"sha256:50415ccf63103c27c466a8d969804017d5423e32f0ae6be61a1657a7be21bf25","download_count":30,"created_at":"2026-10-14T07:28:14Z","updated_at":"2026-10-14T07:28:14Z"},{"id":639601656,"node_id":"RA_kwDOR1lxFc4mH4v4","name":"install.sh","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-sh","state":"uploaded","size":19542,"digest":"sha256:508b47b4c024fb5f976527244f0bcce395f656f121f439662ae3d1fa31a6a5c2","download_count":46,"created_at":"2026-10-14T07:28:14Z","updated_at":"2026-10-14T07:28:14Z"},{"id":639601658,"node_id":"RA_kwDOR1lxFc4mH4v6","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":626,"digest":"sha256:b54e94116e63caece521da54f0ca2302a925fc95d142982925df56e2ba9a7809","download_count":86,"created_at":"2026-10-14T07:28:14Z","updated_at":"2026-10-14T07:28:14Z"}],"body":"Parity release. Deep-dives against pi, Codex CLI and OpenCode found that much of the documented surface was inert; v0.2.0 makes it real and closes the gaps. Full details per area in [docs/changelog.md](https://github.com/Kuberwastaken/claurst/blob/main/docs/changelog.md).\n\n\n## Breaking\n- MCP tools are exposed as `mcp__<server>__<tool>`; update allow/deny rules and hook matchers that named the old form (#463)\n- Hooks use the Claude Code contract: matchers, JSON on stdin/stdout, exit codes and timeouts; the old hooks config shape is not read (#483)\n- Permission rules for Bash match per command, so `Bash(git *)` style rules apply to each command in a pipeline, not the whole line (#469)\n- Project `.claurst/commands` is no longer read; commands come from skills and instruction files (#474)\n- Headless: stream-json events are typed, exit codes are defined, and `--max-turns` defaults to 100 (#481)\n- macOS: the Bash sandbox is on by default with network off; use `/sandbox-toggle network on` or the retry-unsandboxed prompt (#476)\n- Deny rules apply in every mode, including bypass; ApplyPatch is checked as Edit, so rules naming ApplyPatch no longer match (#469, #477)\n- ACP failed turns return a JSON-RPC error instead of `stopReason: refusal` (#460)\n\n## Security\n- Permission model v2: shell scanner, per-subcommand rules, project-scoped approvals, real allow/deny lists (#469)\n- macOS Seatbelt sandbox for Bash with denial detection and retry-unsandboxed escalation (#476)\n- MCP servers shipped in a project's `.claurst/plugins/` need the same approval as project mcp_servers (#493)\n- Edits take a per-path lock, so concurrent sub-agents cannot clobber the same file (#452)\n\n## Features\n- Prompt caching breakpoints with a stable system prompt; adaptive thinking with `output_config.effort` on Claude 4.6+ models (#454)\n- Provider-agnostic compaction with pre-request and overflow checks (#459)\n- Unified retry policy, stream-integrity checks and tool-JSON repair (#458)\n- Steering queue: type while the model works, completion wake-ups, Esc cancel, accurate context meter, notifications and tok/s (#482)\n- One skill registry the model can see, plus `CLAUDE.md`/`AGENTS.md` instruction files with `@include` and budgets (#474)\n- Hooks engine: PreToolUse/PostToolUse/Stop and friends, plugin hooks (#483)\n- apply_patch with the Codex envelope format and fuzzy context matching (#477)\n- MCP: concurrent startup with timeouts, list_changed refresh, server instructions and rich results (#463)\n- Headless contract: typed stream-json, resume, permission rejection with a reason, `--json-schema` (#481)\n- ACP: per-prompt cancel, real permission routing, MCP tools, session cwd (#460)\n- Honest Read with continuation and tiered Edit matching with hints (#452)\n- Bounded Bash output with spill files and a pager-free child env (#455)\n- System prompt overhaul: neutral identity, truthful capabilities, permission and working-style contracts (#472)\n- Atomic per-step session persistence with a journal and crash recovery (#480)\n\n## Fixes\n- Codex subscription path: token refresh, account header, cache key, reasoning replay (#453)\n- Rewind edits model history explicitly instead of replacing it with the display list (#489)\n\n## Upgrade\n\nInstallers: `curl -fsSL https://github.com/kuberwastaken/claurst/releases/latest/download/install.sh | bash` (macOS/Linux), `irm https://github.com/kuberwastaken/claurst/releases/latest/download/install.ps1 | iex` (Windows), `npm i -g claurst`, or `claurst update` from v0.1.x. Read the breaking changes above before upgrading a configured install.\n\n<details><summary>Generated commit and PR list</summary>\n\n## \ud83d\udee0 Direct commits\n\nWork pushed to `main` outside of pull requests in this release:\n\n- chore(release): stamp v0.2.0 [skip ci] ([`3081bf0`](https://github.com/Kuberwastaken/claurst/commit/3081bf0fe9a0128439526e1cc188d9930cc7aee6))\n- chore(release): v0.2.0 ([`12058c8`](https://github.com/Kuberwastaken/claurst/commit/12058c847d2484b188f54d41a8b7d7956faabb23))\n- docs(readme,site): v0.2.0 beta callout, plugin and sub-agent overview ([`e8fe0fd`](https://github.com/Kuberwastaken/claurst/commit/e8fe0fd79eb6b5a5c10368199f4a6a0a576c1204))\n- docs(changelog): exact retry statuses, sandbox paths, two more breaking changes ([`34e7a2c`](https://github.com/Kuberwastaken/claurst/commit/34e7a2c0dba5296be97cdb76e9f3d23e54a038da))\n- docs(commands,keybindings,advanced): fix command, key and session claims from review ([`f384d5d`](https://github.com/Kuberwastaken/claurst/commit/f384d5d9d7af7af545652f65da776ca09057e542))\n- docs(providers,agents): Responses API rejection, Azure version, Codex default, read-only access ([`94a83c4`](https://github.com/Kuberwastaken/claurst/commit/94a83c45f5a75efcaf6a1c805bafb03d552147fa))\n- docs(tools,plugins): fix permission, tool and plugin claims from review ([`f170bd8`](https://github.com/Kuberwastaken/claurst/commit/f170bd8dcee86b71f7ea69e8ed4ffba64820fc1e))\n- docs: reconcile with merged #469, #476 and #482 (sandbox command, permission keys, allow/deny lists) ([`5e421fe`](https://github.com/Kuberwastaken/claurst/commit/5e421fe601094de638b119b593b5d4a7c2def268))\n- docs(commands,keybindings): reconcile slash commands and key bindings with the registry and TUI ([`8af2e4f`](https://github.com/Kuberwastaken/claurst/commit/8af2e4f2274cad7b7083ee4fa942e36bab3e4364))\n- docs(auth,providers,agents,install): credential order, token refresh, provider ids, coordinator mode ([`f346d61`](https://github.com/Kuberwastaken/claurst/commit/f346d6194f6e41a8e4f3cf863700fae028e57c94))\n- docs(tools,mcp,plugins): real tool names and schemas, /mcp subcommands, plugin loading ([`e0cf309`](https://github.com/Kuberwastaken/claurst/commit/e0cf309af86ebaf0583ba9215d2052436ece407c))\n- docs(config,advanced): reconcile settings keys, env vars and compaction with the code ([`fec59ea`](https://github.com/Kuberwastaken/claurst/commit/fec59ea81d0cd6f6f6295cfbbfdb914ba389c125))\n- docs(site): v0.2.0 capabilities on the docs overview, changelog page, installer path ([`f42878f`](https://github.com/Kuberwastaken/claurst/commit/f42878f70c5912b1db250787dbdd136738eacc4b))\n- docs(vscode): describe permission routing and the cancelled outcome on dismissal ([`ab133be`](https://github.com/Kuberwastaken/claurst/commit/ab133be39ae0cc85debb86c2ee3dae071a1479b1))\n- docs(readme): v0.2.0 updates, headless quick start, ACP permission routing ([`b71b245`](https://github.com/Kuberwastaken/claurst/commit/b71b245bb52bf9d69390b792c12d2cfbb7244937))\n- docs: add changelog with the v0.2.0 section ([`a13ee5b`](https://github.com/Kuberwastaken/claurst/commit/a13ee5bdb07b951b6ecacd73abe90a420d1b496b))\n- refactor(cli): extract project-plugin MCP gating into a tested helper ([`d9cab89`](https://github.com/Kuberwastaken/claurst/commit/d9cab89b2bffaa56175f912cd11ab8822e6bdb7c))\n- docs(plugins): drop references to a nonexistent --plugin-dir flag ([`26e2c1a`](https://github.com/Kuberwastaken/claurst/commit/26e2c1acf19e2965c530bcf2f9a79e84884eeba7))\n- fix(cli): warn in headless mode when project-plugin MCP servers are skipped ([`912752e`](https://github.com/Kuberwastaken/claurst/commit/912752e513d1e05562a61a7ba4cbb619f4db0030))\n- fix(plugins): don't rescan the user plugins dir as project plugins when cwd is $HOME ([`f9bbd91`](https://github.com/Kuberwastaken/claurst/commit/f9bbd91cdf4c6ae2eec348d437ceb0e524104a88))\n- fix(plugins): mark project-plugin MCP servers in 