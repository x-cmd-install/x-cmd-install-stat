/Kuberwastaken/claurst/commit/936a06638e6639dd045aefceaa699fff9e194c5c))\n- Discard generated auto-poke submissions when parking session input ([`30f6001`](https://github.com/Kuberwastaken/claurst/commit/30f6001ecd3ea0f63b8b4f76bd26b8dfdaa795b9))\n- Discard generated auto-poke submissions when parking session input ([`5daef87`](https://github.com/Kuberwastaken/claurst/commit/5daef8768e77338b3794ad06260359614ab4d397))\n- fix(mcp): reconcile plugin servers at startup and reload (fixes #497) ([`e6ba233`](https://github.com/Kuberwastaken/claurst/commit/e6ba2333ddc1289cc4970ab33944cb7c9d3e8ee0))\n- fix(mcp): reconcile plugin servers at startup and reload (fixes #497) ([`31a981e`](https://github.com/Kuberwastaken/claurst/commit/31a981e97d451ecc46a53e298a5b739bcddd964d))\n- Show local shell output on an otherwise empty transcript ([`445dc79`](https://github.com/Kuberwastaken/claurst/commit/445dc7923e3908af0c6ab31916d2a266a6ec55cd))\n- Remove unreachable legacy keyboard selection copy branches ([`33d475b`](https://github.com/Kuberwastaken/claurst/commit/33d475bac30b3227bb263e67f7a62a54597445c7))\n- Keep conflicted session writers read-only and rotate durable checkpoints ([`f0fc64b`](https://github.com/Kuberwastaken/claurst/commit/f0fc64bd1983711ccd78104e5308a6dc260d0bd4))\n- Retain live transcript when starting a new session fails ([`9e432e4`](https://github.com/Kuberwastaken/claurst/commit/9e432e440cb56ea56bd3bb4fbb44448f271336de))\n- Use a portable shell command in live routing regression ([`813adf5`](https://github.com/Kuberwastaken/claurst/commit/813adf58061d2c4eb8ac8237b3a728501534bd31))\n- Route live bang submissions locally before model dispatch ([`514a41b`](https://github.com/Kuberwastaken/claurst/commit/514a41beb076452217013700336dfdb67b43edc5))\n- fix(core): retain integrated configuration defaults (refs #468) ([`461ac7f`](https://github.com/Kuberwastaken/claurst/commit/461ac7f79f46d9c3e19f1c09248eb398dfad9369))\n- fix(query): honor compaction settings and bound s