ken in https://github.com/Kuberwastaken/claurst/pull/481\n* feat(core,query): hooks engine with the Claude Code contract: matchers, JSON stdin/stdout, timeouts, plugin hooks, Stop once (#447) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/483\n* fix(cli,tui): rewind explicitly instead of replacing model history with the display list (#484) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/489\n* feat(tools): macOS Seatbelt sandbox for Bash with denial detection and retry-unsandboxed escalation (#470) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/476\n* feat(tui,query): steering queue, completion wake-ups, Esc cancel, accurate context meter, notifications and tok/s (#444) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/482\n* feat(core,tools): permission model v2: shell scanner, per-subcommand rules, project-scoped approvals, real allow/deny lists (#445) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/469\n* feat(core): atomic, per-step session persistence with journal replay and compaction-safe rewind (#449) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/480\n* fix(plugins): require project approval for MCP servers shipped in a project's .claurst/plugins/ (#493) by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/496\n* docs: reconcile documentation and website with the code for v0.2.0 by @Kuberwastaken in https://github.com/Kuberwastaken/claurst/pull/492\n\n\n**Full Changelog**: https://github.com/Kuberwastaken/claurst/compare/v0.1.8...v0.2.0\n\n\n</details>\n","mentions_count":2}
