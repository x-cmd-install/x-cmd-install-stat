{"id":409111501,"author":{"login":"CoderLuii","id":203967356,"node_id":"U_kgDODChLfA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORtT6M84YYovN","tag_name":"v1.6.6","target_commitish":"master","name":"v1.6.6","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-10T16:38:11Z","updated_at":"2026-10-10T17:57:47Z","published_at":"2026-10-10T17:57:47Z","assets":[],"body":"## 10/10/2026\n\n### Changed\n\n- Updated Node to 26.11.1, Claude Code to 2.1.296, Gemini CLI to 0.63.0, Codex to 0.162.1, Junie to stable 3579.5 and OpenCode to 1.18.35.\n- Updated compatible developer and deployment tools using official upstream packages.\n- EAS, Netlify and Vercel keep their official dependency trees.\n- Updated Syft to 1.54.1, Grype to 0.120.1 and the artifact upload and download actions to 7.0.2 and 8.0.2.\n- Kept CloudCLI account controls, notifications, proxy paths and existing plugins. See [deferred updates](https://github.com/CoderLuii/HolyClaude/blob/master/docs/official-dependency-updates.md) for compatibility details.\n\n### Fixed\n\n- Updated release validation to use v1.6.5 as the source parent while keeping retained artifact checks tied to their original reviewed baseline.\n- Corrected the contributor guide's description of the Docker build stages.\n\n### Security\n\n- Dependency scans continue. Accepted upstream vulnerabilities remain unresolved; source, artifact integrity and runtime checks still block delivery.\r\n\r\n"}
