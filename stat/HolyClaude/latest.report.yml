{"id":413471608,"author":{"login":"CoderLuii","id":203967356,"node_id":"U_kgDODChLfA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORtT6M84YpRN4","tag_name":"v1.6.7","target_commitish":"c3420f297fe12bd46b4d8be30900e596204a88ae","name":"v1.6.7","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-15T04:36:50Z","updated_at":"2026-10-15T06:09:20Z","published_at":"2026-10-15T06:09:20Z","assets":[],"body":"## 10/14/2026\n\n### Changed\n\n- Updated Node to 26.12.0, Claude Code to 2.1.300, Gemini CLI to 0.64.0, Junie to stable 3659.4 and OpenCode to 1.19.0.\n- Updated Chromium to 155.0.8059.39 and aligned Node and Python Playwright at 1.64.0.\n- Updated compatible developer, deployment, Python and optional Docker client tools from official upstream packages.\n- Added disk and swap capacity preparation to published Full-image monitoring before scanner installation, with disk and memory diagnostics retained in the job log.\n- Updated Azure CLI to 2.91.0 while retaining its strict embedded-runtime probes.\n- Kept Go, CloudCLI, Vercel CLI and Pi Coding Agent at their qualified compatibility baselines. See [deferred replacements](https://github.com/CoderLuii/HolyClaude/blob/v1.6.7/docs/official-dependency-updates.md).\n\n### Security\n\n- Refreshed immutable-input bindings for v1.6.7 and kept dependency scans active.\r\n- Scans still report accepted upstream vulnerabilities in Vercel's smol-toml 1.5.2, EAS's tar 7.5.19, Azure's cryptography 48.0.1 and other bundled dependencies. These remain unresolved.\n- Kept historical Chromium review decisions bound to their original package version instead of carrying them into Chromium 155.\n\n### Fixed\n\n- Made immutable-input validation reject stale or untracked Docker and workflow references, including mismatched GitHub Action versions and commit pins.\n"}
