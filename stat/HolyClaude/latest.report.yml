{"id":424100403,"author":{"login":"CoderLuii","id":203967356,"node_id":"U_kgDODChLfA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORtT6M84ZR0Iz","tag_name":"v1.6.8","target_commitish":"b9e0d11d8d4173899e210742a8f7af8cefcf94f1","name":"v1.6.8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-26T08:56:19Z","updated_at":"2026-10-26T10:17:43Z","published_at":"2026-10-26T10:17:43Z","assets":[],"body":"## 10/26/2026\n\n### Changed\n\n- Updated the runtime to Node 26.12.1 and Python 3.14.9, with Debian Chromium 156.0.8078.47.\n- Updated Claude Code to 2.1.307, Gemini CLI to 0.65.0, OpenAI Codex to 0.163.0, Junie to nightly 3888.1 and OpenCode to 1.19.3.\n- Updated GitHub CLI to 2.103.0 and refreshed compatible npm and Python packages.\n- Removed the Prisma mysql2 and PM2 js-yaml replacement steps. Prisma 7.10.1 supplies mysql2 3.24.4, and PM2 7.1.0 supplies js-yaml 4.3.2 through their official package trees.\n- Updated the optional Full-derived Docker client recipe to Docker CLI 29.9.2 and Compose 5.6.1.\n- Kept Node and Python Playwright aligned at 1.64.0. CloudCLI features and the existing FFmpeg security patches remain unchanged.\n- Kept Go 1.27.1 for the existing custom esbuild binaries. A toolchain update remains deferred.\n\n### Security\n\n- Refreshed immutable input bindings for v1.6.8 and retained checks of the official Prisma and PM2 dependency trees.\n- Updated Syft to 1.55.0 and Grype to 0.121.0. Dependency reports still list accepted upstream vulnerabilities with their installed versions. These remain unresolved.\n"}
