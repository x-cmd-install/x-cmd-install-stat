es (@nao1215)\n* da3298fefed5923b76dcd38ce7bf0a9e1aa67aaa: build(deps): update deps, Go floor 1.26.10, bundle dependency licenses (#1029) (@nao1215)\n* eacc7d88ac589fb08904917b1eae76e5b37b6aeb: build(deps): update filesql to v0.60.1 and excelize to v2.11.1 (#1046) (@nao1215)\n\n**Full changelog**: https://github.com/nao1215/sqly/compare/v1.7.3...v1.7.4\n\n","mentions_count":1}
