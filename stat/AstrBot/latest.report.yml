{"id":384219702,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOIlMBmM4W5ro2","tag_name":"v4.28.0","target_commitish":"master","name":"v4.28.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-07T16:38:18Z","updated_at":"2026-09-07T16:56:13Z","published_at":"2026-09-07T16:43:43Z","assets":[{"id":549090330,"node_id":"RA_kwDOIlMBmM4gunQa","name":"AstrBot-v4.28.0-dashboard.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6025513,"digest":"sha256:71a5144a42ce93c0d91e5efbbeaaf0bd8c823db3ae3dfe3e00bbd91e7a35c056","download_count":468,"created_at":"2026-09-07T16:43:44Z","updated_at":"2026-09-07T16:43:44Z"}],"body":"## [4.28.0] - 2026-09-08\r\n\r\n\u56db\u65f6\u4e4b\u666f\u4e0d\u540c\uff0c\u800c\u4e50\u4ea6\u65e0\u7a77\u4e5f\u3002\r\n\r\nEach season brings its own beauty, and the joy is endless.\r\n\r\n> \ud83d\udce2 \u7531\u4e8e\u914d\u7f6e\u6587\u4ef6\u90e8\u5206\u7ed3\u6784\u4f18\u5316\uff0c\u5347\u7ea7\u540e\u518d\u964d\u7ea7\u5c06\u5bfc\u81f4\u90e8\u5206\u914d\u7f6e\u5185\u5bb9\u91cd\u7f6e\uff0c\u5347\u7ea7\u540e\u8bf7\u8c28\u614e\u964d\u7ea7\u3002\r\n> Due to structural optimizations in the configuration file, downgrading after an upgrade will result in the reset of some configuration content. Please be cautious when downgrading after an upgrade.\r\n\r\n### Major Additions\r\n\r\n- Redesigned the WebUI pages for model providers, bots, and profiles, and consolidated logs, traces, conversation management, and data into the **Data & Logs** page. Removed the **Agent Runner** from model providers and embedded its settings into each profile. (#9820, #9825, #9821, #9883, #9846)\r\n- Redesigned the default and local T2I rendering. (#9803)\r\n- Enriched unified group metadata across messaging platform adapters. (#9851)\r\n- Automatically record readable names for unified message origins (UMOs), such as group and user names, making them easier to find in the WebUI. (#9909)\r\n- Added masked secret fields for sensitive values in the WebUI and plugin configurations. (#9824)\r\n- Added batch deletion to the WebUI skill management page. (#9906)\r\n- Added AnySearch as a built-in web search provider. (#9767)\r\n- Added support for password-style plugin configuration fields and masked sensitive profile fields by default. (#9824)\r\n\r\n### Major Optimizations\r\n\r\n- Improved how browser password managers recognize the WebUI login page. (#9830)\r\n- Adapted model provider icons for dark mode. (#9647)\r\n- Improved context handling for future-task agents. (#9818)\r\n- Made the skill editor dialog responsive on smaller screens. (#9873)\r\n- Stabilized the OpenAI tool schema order by sorting tools alphabetically by name. (#9798)\r\n\r\n### Major Fixes\r\n\r\n- Fixed an issue where DingTalk could remain in an unknown `CREATING` state after scanning the QR code, preventing app creation from continuing. (#9808)\r\n- Fixed an issue where commands in Lark groups would not trigger when the bot mention appeared before the command. (#9872)\r\n- Isolated rate limits by unified message origin (UMO). (#9814)\r\n- Aligned Anthropic API Base URL handling with the OpenAI API; `/v1` must now be included in the configured URL. (#9802)\r\n- Fixed cached-token usage accounting for Anthropic and Gemini. (#9880, #9881)\r\n- Applied the `max_agent_step` configuration to scheduled-task and background-task agents. (#9801)\r\n- Preserved text in Lark mixed text-and-image messages. (#9841)\r\n- Displayed the create-folder button in the mobile persona manager. (#9812)\r\n\r\n## \u4e2d\u6587\r\n\r\n### \u4e3b\u8981\u65b0\u589e\r\n\r\n- \u91cd\u65b0\u8bbe\u8ba1 WebUI \u7684\u6a21\u578b\u63d0\u4f9b\u5546\u9875\u3001\u673a\u5668\u4eba\u9875\u548c\u914d\u7f6e\u6587\u4ef6\u9875\uff0c\u5e76\u5c06\u65e5\u5fd7\u3001\u8ffd\u8e2a\u3001\u5bf9\u8bdd\u7ba1\u7406\u3001\u6570\u636e\u9875\u7efc\u5408\u4e3a\u300c\u6570\u636e\u4e0e\u65e5\u5fd7\u300d\u9875\u3002\u79fb\u9664\u6a21\u578b\u63d0\u4f9b\u5546\u7684 \u201cAgent \u6267\u884c\u5668\u201d\uff0c\u5c06\u5176\u5185\u5d4c\u5230\u5404\u4e2a\u914d\u7f6e\u6587\u4ef6\u4e2d\u3002 (#9820, #9825, #9821, #9883, #9846)\r\n- \u91cd\u65b0\u8bbe\u8ba1\u9ed8\u8ba4\u548c\u672c\u5730\u7684 T2I \u6e32\u67d3\u6548\u679c\u3002 (#9803)\r\n- \u4e30\u5bcc\u5404\u6d88\u606f\u5e73\u53f0\u9002\u914d\u5668\u7684\u7edf\u4e00\u7fa4\u7ec4\u5143\u6570\u636e (#9851)\r\n- \u81ea\u52a8\u8bb0\u5f55\u7edf\u4e00\u6d88\u606f\u6765\u6e90\uff08UMO\uff09\u7684\u53ef\u8bfb\u540d\u79f0\uff08\u5982\u7fa4\u540d\u3001\u7528\u6237\u540d\uff09\uff0c\u65b9\u4fbf\u5728 WebUI \u67e5\u8be2\u3002 (#9909)\r\n- \u4e3a WebUI \u548c\u63d2\u4ef6\u914d\u7f6e\u4e2d\u7684\u654f\u611f\u503c\u65b0\u589e\u63a9\u7801\u5bc6\u94a5\u5b57\u6bb5\u3002 (#9824)\r\n- \u4e3a WebUI \u6280\u80fd\u7ba1\u7406\u9875\u65b0\u589e\u6279\u91cf\u5220\u9664\u529f\u80fd\u3002 (#9906)\r\n- \u65b0\u589e AnySearch \u5185\u7f6e\u7f51\u9875\u641c\u7d22\u670d\u52a1\u5546\u3002 (#9767)\r\n- \u652f\u6301\u63d2\u4ef6\u914d\u7f6e\u9879\u4f7f\u7528\u5bc6\u7801\u6548\u679c\u7684\u5b57\u6bb5\uff0c\u5e76\u9ed8\u8ba4\u5c06\u914d\u7f6e\u6587\u4ef6\u4e2d\u654f\u611f\u5b57\u6bb5\u4f7f\u7528\u5bc6\u7801\u6548\u679c\u3002 (#9824)\r\n\r\n### \u4e3b\u8981\u4f18\u5316\r\n\r\n- \u6539\u8fdb\u6d4f\u89c8\u5668\u81ea\u52a8\u8bb0\u5fc6\u5bc6\u7801\u529f\u80fd\u5bf9 WebUI \u767b\u5f55\u9875\u7684\u8bc6\u522b\u903b\u8f91\u3002 (#9830)\r\n- \u4f7f\u6a21\u578b\u63d0\u4f9b\u5546\u56fe\u6807\u9002\u914d\u6df1\u8272\u6a21\u5f0f\u3002 (#9647)\r\n- \u4f18\u5316\u672a\u6765\u4efb\u52a1 Agent \u7684\u4e0a\u4e0b\u6587\u3002 (#9818)\r\n- \u4f7f\u6280\u80fd\u7f16\u8f91\u5668\u5bf9\u8bdd\u6846\u9002\u914d\u5c0f\u5c4f\u5e55\u3002 (#9873)\r\n- \u6309\u5de5\u5177\u540d\u5b57\u5178\u5e8f\u7a33\u5b9a OpenAI \u5de5\u5177 Schema \u7684\u987a\u5e8f\u3002 (#9798)\r\n\r\n### \u4e3b\u8981\u4fee\u590d\r\n\r\n- \u9489\u9489\u90e8\u5206\u60c5\u51b5\u4e0b\u626b\u7801\u4e4b\u540e\u51fa\u73b0 CREATING \u672a\u77e5\u72b6\u6001\u5bfc\u81f4\u65e0\u6cd5\u7ee7\u7eed\u521b\u5efa\u3002 (#9808)\r\n- \u4fee\u590d\u98de\u4e66\u7fa4\u91cc\u5f53 at \u673a\u5668\u4eba\u5728\u524d\u800c\u547d\u4ee4\u5728\u540e\u4f1a\u65e0\u6cd5\u89e6\u53d1\u547d\u4ee4\u7684\u95ee\u9898\u3002 (#9872)\r\n- \u6309\u7edf\u4e00\u6d88\u606f\u6765\u6e90\uff08UMO\uff09\u9694\u79bb\u9650\u6d41\u3002 (#9814)\r\n- \u4f7f Anthropic API Base URL \u903b\u8f91\u4e0e OpenAI API \u4fdd\u6301\u4e00\u81f4\uff0c\u9700\u8981\u8f93\u5165 /v1\u3002 (#9802)\r\n- \u4fee\u590d Anthropic \u548c Gemini \u6709\u5173\u7f13\u5b58 token \u7684\u7528\u91cf\u7edf\u8ba1\u53e3\u5f84\u3002 (#9880, #9881)\r\n- \u5c06 max_agent_step \u914d\u7f6e\u5e94\u7528\u5230\u5b9a\u65f6\u4efb\u52a1\u548c\u540e\u53f0\u4efb\u52a1 Agent\u3002 (#9801)\r\n- \u4fdd\u7559\u98de\u4e66\u56fe\u6587\u6df7\u5408\u6d88\u606f\u4e2d\u7684\u6587\u672c\u3002 (#9841)\r\n- \u5728\u79fb\u52a8\u7aef\u7684\u4eba\u683c\u7ba1\u7406\u5668\u4e2d\u663e\u793a\u65b0\u5efa\u6587\u4ef6\u5939\u6309\u94ae\u3002 (#9812)\r\n\r\n\r\n[4.28.0-beta.1]: https://github.com/AstrBotDevs/AstrBot/compare/v4.27.4...v4.28.0-beta.1\r\n\r\n## Changes Since 4.28.0-beta.1\r\n\r\n### Additions and Optimizations\r\n\r\n- Added Japanese localization for the WebUI and built-in plugins. (#9955)\r\n- Expanded syntax highlighting for common languages in ChatUI and added Go highlighting to the T2I renderer. (#9892)\r\n- Included the Python version in metrics uploads. (#9973)\r\n- Enabled unit test CI on Windows, macOS, and Linux, and fixed cross-platform test compatibility. (#9954)\r\n\r\n### Fixes\r\n\r\n- Added missing English translations in the WebUI. (#9896)\r\n- Fixed the namespace of the Chinese provider synchronization translations. (#9932)\r\n- Fixed remote sandbox skill archive paths on Windows hosts. (#8182)\r\n- Fixed plugin market detail pages displaying the wrong information for plugins with the same metadata name. (#9925)\r\n- Fixed serialization of Gemini thinking levels. (#9899)\r\n- Preserved user-defined content in dictionary-type configuration items. (#9958)\r\n- Preserved the existing context prefix during tool parameter re-query instead of modifying the initial system message. (#9957)\r\n- Removed the invalid \u201cAll\u201d page size option from knowledge base document lists. (#9908)\r\n- Applied Markdown rendering to proactive QQ Official messages sent through `send_by_session`. (#9914)\r\n- Made proactive agents respect computer runtime settings and treated missing runtime settings as disabled. (#9971)\r\n- Included WebChat conversations in history lists by default and exposed WebChat in the bot ID filter. (#9910)\r\n- Isolated event loop watchdog stack dumps from other traceback output. (#9941)\r\n\r\n## \u81ea 4.28.0-beta.1 \u4ee5\u6765\u7684\u53d8\u66f4\r\n\r\n### \u65b0\u589e\u4e0e\u4f18\u5316\r\n\r\n- \u4e3a WebUI \u548c\u5185\u7f6e\u63d2\u4ef6\u65b0\u589e\u65e5\u8bed\u672c\u5730\u5316\u3002 (#9955)\r\n- \u6269\u5c55 ChatUI \u5e38\u7528\u8bed\u8a00\u7684\u4ee3\u7801\u9ad8\u4eae\uff0c\u5e76\u4e3a T2I \u6e32\u67d3\u5668\u52a0\u5165 Go \u8bed\u6cd5\u9ad8\u4eae\u3002 (#9892)\r\n- \u5728\u7edf\u8ba1\u6570\u636e\u4e0a\u62a5\u4e2d\u5305\u542b Python \u7248\u672c\u3002 (#9973)\r\n- \u5728 Windows\u3001macOS \u548c Linux \u4e0a\u542f\u7528\u5355\u5143\u6d4b\u8bd5 CI\uff0c\u5e76\u4fee\u590d\u6d4b\u8bd5\u7684\u8de8\u5e73\u53f0\u517c\u5bb9\u6027\u3002 (#9954)\r\n\r\n### \u4fee\u590d\r\n\r\n- \u8865\u9f50 WebUI \u7f3a\u5931\u7684\u82f1\u6587\u7ffb\u8bd1\u3002 (#9896)\r\n- \u4fee\u590d\u4e2d\u6587\u6a21\u578b\u63d0\u4f9b\u5546\u540c\u6b65\u7ffb\u8bd1\u7684\u547d\u540d\u7a7a\u95f4\u3002 (#9932)\r\n- \u4fee\u590d Windows \u5bbf\u4e3b\u673a\u5411\u8fdc\u7aef\u6c99\u7bb1\u540c\u6b65\u6280\u80fd\u65f6\u7684\u538b\u7f29\u5305\u8def\u5f84\u3002 (#8182)\r\n- \u4fee\u590d\u63d2\u4ef6\u5e02\u573a\u4e2d metadata name \u76f8\u540c\u7684\u63d2\u4ef6\u8be6\u60c5\u9875\u663e\u793a\u9519\u8bef\u4fe1\u606f\u7684\u95ee\u9898\u3002 (#9925)\r\n- \u4fee\u590d Gemini thinking level \u7684\u5e8f\u5217\u5316\u3002 (#9899)\r\n- \u4fdd\u7559\u5b57\u5178\u7c7b\u578b\u914d\u7f6e\u9879\u4e2d\u7684\u7528\u6237\u81ea\u5b9a\u4e49\u5185\u5bb9\u3002 (#9958)\r\n- \u5de5\u5177\u53c2\u6570\u8865\u5168\u8bf7\u6c42\u4fdd\u7559\u5df2\u6709\u4e0a\u4e0b\u6587\u524d\u7f00\uff0c\u4e0d\u518d\u4fee\u6539\u9996\u6761\u7cfb\u7edf\u6d88\u606f\u3002 (#9957)\r\n- \u79fb\u9664\u77e5\u8bc6\u5e93\u6587\u6863\u5217\u8868\u4e2d\u65e0\u6548\u7684 \u201cAll\u201d \u5206\u9875\u9009\u9879\u3002 (#9908)\r\n- \u4e3a\u901a\u8fc7 `send_by_session` \u4e3b\u52a8\u53d1\u9001\u7684 QQ \u5b98\u65b9\u673a\u5668\u4eba\u6d88\u606f\u5e94\u7528 Markdown \u6e32\u67d3\u3002 (#9914)\r\n- \u4f7f\u4e3b\u52a8 Agent \u9075\u5faa\u8ba1\u7b97\u673a\u8fd0\u884c\u65f6\u914d\u7f6e\uff0c\u5e76\u5728\u7f3a\u5c11\u8be5\u914d\u7f6e\u65f6\u9ed8\u8ba4\u7981\u7528\u8ba1\u7b97\u673a\u8fd0\u884c\u65f6\u3002 (#9971)\r\n- \u9ed8\u8ba4\u5728\u5bf9\u8bdd\u5386\u53f2\u5217\u8868\u4e2d\u663e\u793a WebChat \u4f1a\u8bdd\uff0c\u5e76\u652f\u6301\u901a\u8fc7\u673a\u5668\u4eba ID \u7b5b\u9009 WebChat\u3002 (#9910)\r\n- \u5c06\u4e8b\u4ef6\u5faa\u73af\u770b\u95e8\u72d7\u7684\u5806\u6808\u8f6c\u50a8\u4e0e\u5176\u4ed6 traceback \u8f93\u51fa\u9694\u79bb\u3002 (#9941)\r\n\r\n[4.28.0]: https://github.com/AstrBotDevs/AstrBot/compare/v4.28.0-beta.1...v4.28.0\r\n\r\n## What's Changed\r\n* fix: update deprecated NVIDIA retrieval models by @C10H14N2O5 in https://github.com/AstrBotDevs/AstrBot/pull/9750\r\n* fix: register standard SVG MIME type for WebUI static files by @wcqqq1214 in https://github.com/AstrBotDevs/AstrBot/pull/9735\r\n* fix(provider): adapt anthropic source to httpx2 rename in anthropic 1.0.0 by @RC-CHN in https://github.com/AstrBotDevs/AstrBot/pull/9791\r\n* fix: resolve double scrollbar in edit mode of conversation detail dialog by @Rain-0x01-39 in https://github.com/AstrBotDevs/AstrBot/pull/9752\r\n* chore(deps): bump the github-actions group with 2 updates by @dependabot[bot] in https://github.com/AstrBotDevs/AstrBot/pull/9799\r\n* fix: add touch device detection for menu interaction by @mantoujun12 in https://github.com/AstrBotDevs/AstrBot/pull/9782\r\n* Optimize Dockerfile build cache: move COPY after dependency installation by @lqfy-jhc in https://github.com/AstrBotDevs/AstrBot/pull/9787\r\n* fix: align Anthropic API base URL logic with OpenAI API by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9802\r\n* fix: gray out commands of disabled plugins in behavior manager by @chufeng in https://github.com/AstrBotDevs/AstrBot/pull/9664\r\n* fix: stabilize OpenAI tool schema order by @x1051445024 in https://github.com/AstrBotDevs/AstrBot/pull/9798\r\n* fix: keep WeCom callback receive loop responsive by @LIghtJUNction in https://github.com/AstrBotDevs/AstrBot/pull/9759\r\n* fix(logging): make console and root logger follow configured log level by @DBJD-CR in https://github.com/AstrBotDevs/AstrBot/pull/9805\r\n* fix: handle DingTalk app creation status by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9808\r\n* feat: improve default and local t2i rendering by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9803\r\n* fix: apply max_agent_step config to cron and background task agents by @Shaofei215 in https://github.com/AstrBotDevs/AstrBot/pull/9801\r\n* fix(dashboard): show create folder button on mobile in persona manager by @mantoujun12 in https://github.com/AstrBotDevs/AstrBot/pull/9812\r\n* fix: adapt provider icons to dark mode by @xxynet in https://github.com/AstrBotDevs/AstrBot/pull/9647\r\n* refactor(dashboard): unify provider management workspace by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9820\r\n* feat(dashboard): support masked secret config fields by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9824\r\n* fix: isolate rate limits by unified message origin by @kidding-404 in https://github.com/AstrBotDevs/AstrBot/pull/9814\r\n* fix: hide internal personal WeChat settings by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9827\r\n* fix: stop empty LLM requests before provider dispatch by @mameikagou in https://github.com/AstrBotDevs/AstrBot/pull/9815\r\n* feat(dashboard): improve authentication controls by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9830\r\n* fix(dashboard): reset persona folder after deletion by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9832\r\n* refactor(dashboard): redesign bot management workspace by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9825\r\n* fix: keep proactive agent history in contexts by @kidding-404 in https://github.com/AstrBotDevs/AstrBot/pull/9818\r\n* fix: preserve QQ Official group routing in unique sessions by @kidding-404 in https://github.com/AstrBotDevs/AstrBot/pull/9833\r\n* fix(provider): preserve current user turn in Gemini history by @SunmiJJW in https://github.com/AstrBotDevs/AstrBot/pull/9738\r\n* feat: consolidate data dashboard and redesign conversations by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9846\r\n* feat: add conversation shortcuts to statistics by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9847\r\n* refactor: embed agent runner configuration in profiles by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9821\r\n* fix(dashboard): make skill editor dialog responsive on small screens by @mantoujun12 in https://github.com/AstrBotDevs/AstrBot/pull/9873\r\n* fix(lark): recognize commands after leading bot mention by @Ars1027 in https://github.com/AstrBotDevs/AstrBot/pull/9872\r\n* fix: preserve text in Lark mixed messages by @kidding-404 in https://github.com/AstrBotDevs/AstrBot/pull/9841\r\n* fix: resolve Gemini history image references by @SunmiJJW in https://github.com/AstrBotDevs/AstrBot/pull/9874\r\n* feat(websearch): add AnySearch as a web search provider by @WangPan59 in https://github.com/AstrBotDevs/AstrBot/pull/9767\r\n* fix: ensure config directory exists before mkstemp in _write_config_snapshot by @xiaoyuyu6420 in https://github.com/AstrBotDevs/AstrBot/pull/9856\r\n* fix: defer dashboard setup until startup by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9879\r\n* refactor(dashboard): productize profile configuration by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9883\r\n* fix(plugin): detect updates for plugins without persisted install sources by @xiaoyuyu6420 in https://github.com/AstrBotDevs/AstrBot/pull/9887\r\n* chore(deps): bump github/codeql-action from 4.37.8 to 4.37.9 in the github-actions group by @dependabot[bot] in https://github.com/AstrBotDevs/AstrBot/pull/9885\r\n* feat(platform): enrich group metadata across adapters by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9851\r\n* fix: skip the respond stage on an empty message chain by @KBVsent in https://github.com/AstrBotDevs/AstrBot/pull/9653\r\n* feat: automatically record UMO names by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9909\r\n* feat(dashboard): add batch deletion for skills by @Ars1027 in https://github.com/AstrBotDevs/AstrBot/pull/9906\r\n* fix(provider): count Anthropic cache_creation tokens in input usage by @xiaoyuyu6420 in https://github.com/AstrBotDevs/AstrBot/pull/9881\r\n* fix(provider): exclude cached tokens from Gemini input usage accounting by @xiaoyuyu6420 in https://github.com/AstrBotDevs/AstrBot/pull/9880\r\n* chore: bump version to 4.28.0-beta.1 by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/9911\r\n* fix(i18n): add missing en-US dashboard translations by @yunyancuo in https://github.com/AstrBotDevs/AstrBot/pull/9896\r\n* fix: expand shiki code highlight language support by @atqiyu in https://github.com/AstrBotDevs/AstrBot/pull/9892\r\n* fix(i18n): \u5c06 zh-CN \u7684 syncProvider \u5b50\u6811\u79fb\u81f3\u547d\u540d\u7a7a\u95f4\u6