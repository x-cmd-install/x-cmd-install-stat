{"id":397700170,"author":{"login":"Soulter","id":37870767,"node_id":"MDQ6VXNlcjM3ODcwNzY3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOIlMBmM4XtGxK","tag_name":"v4.28.2","target_commitish":"master","name":"v4.28.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-27T15:16:26Z","updated_at":"2026-09-27T15:22:10Z","published_at":"2026-09-27T15:22:07Z","assets":[{"id":593185430,"node_id":"RA_kwDOIlMBmM4jW0qW","name":"AstrBot-v4.28.2-dashboard.zip","label":"","uploader":{"login":"Soulter","id":37870767,"node_id":"MDQ6VXNlcjM3ODcwNzY3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5314263,"digest":"sha256:20a85309adf0802c66c70140a729d11890665521aa928310d150f74c3464d66f","download_count":48,"created_at":"2026-09-27T15:22:08Z","updated_at":"2026-09-27T15:22:10Z"}],"body":"## [4.28.2] - 2026-09-27\n\n### Fixes\n\n- Fixed SQLite datetime fields being inferred as SQLModel `UTCDateTime` after dependency upgrades, which caused knowledge-base writes, dashboard statistics, and related database operations to fail for naive datetime values. (#10205, #10212, #10255)\n- Fixed platform message-history cleanup using a local-time cutoff instead of UTC, which could leave records undeleted on hosts outside UTC. (#10255)\n\n## \u4e2d\u6587\n\n### \u4fee\u590d\n\n- \u4fee\u590d SQLModel \u4f9d\u8d56\u5347\u7ea7\u540e SQLite \u65f6\u95f4\u5b57\u6bb5\u88ab\u63a8\u65ad\u4e3a `UTCDateTime`\uff0c\u5bfc\u81f4\u77e5\u8bc6\u5e93\u5199\u5165\u3001Dashboard \u7edf\u8ba1\u53ca\u76f8\u5173\u6570\u636e\u5e93\u64cd\u4f5c\u56e0 naive datetime \u5931\u8d25\u7684\u95ee\u9898\u3002 (#10205, #10212, #10255)\n- \u4fee\u590d\u5e73\u53f0\u6d88\u606f\u5386\u53f2\u6e05\u7406\u4f7f\u7528\u672c\u5730\u65f6\u95f4\u8ba1\u7b97\u622a\u6b62\u65f6\u95f4\u7684\u95ee\u9898\uff0c\u907f\u514d\u975e UTC \u4e3b\u673a\u4e0a\u51fa\u73b0\u6d88\u606f\u672a\u88ab\u5220\u9664\u7684\u60c5\u51b5\u3002 (#10255)\n\n[4.28.2]: https://github.com/AstrBotDevs/AstrBot/compare/v4.28.1...v4.28.2\n"}
