{"id":388497116,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOIlMBmM4XJ_7c","tag_name":"v4.28.1","target_commitish":"master","name":"v4.28.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-14T15:11:06Z","updated_at":"2026-09-14T16:54:07Z","published_at":"2026-09-14T15:14:30Z","assets":[{"id":563645097,"node_id":"RA_kwDOIlMBmM4hmIqp","name":"AstrBot-v4.28.1-dashboard.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5314263,"digest":"sha256:b579944a38421b118baa49c1f1b82c41c6632ef329447f5124d455612946fd22","download_count":1619,"created_at":"2026-09-14T15:14:31Z","updated_at":"2026-09-14T15:14:32Z"}],"body":"## [4.28.1] - 2026-09-14\r\n\r\nWe live in stories we collectively believe in.\r\n\r\n\u6211\u4eec\u6d3b\u5728\u5171\u540c\u76f8\u4fe1\u7684\u6545\u4e8b\u91cc\u3002\r\n\r\n### Additions and Optimizations\r\n\r\n- Added paginated ChatUI history loading and improved chat settings, the message composer, and streaming interactions. Reasoning is now displayed by default, and workspace code previews use Shiki highlighting. (#9667, #10021, #10020, #10023)\r\n- Added provider source filters and sticky group headers to model selection, and improved provider configuration dialogs. (#10084, #10007)\r\n- Added adaptive input image processing for the built-in Agent: resize or convert images when needed and turn animated images into frame montages. Preserve static image dimensions in CUA sandboxes and warn when images may exceed provider upload limits. (#9703, #10071)\r\n- Unified `/new` and `/reset` to start a new conversation, with permissions configurable in command management. (#10004)\r\n- Added desktop update download progress and reduced bundled WebUI font and diagram assets. (#10050, #10034)\r\n- Improved configuration slider robustness. (#10037)\r\n- Standardized provider request User-Agent headers to include the AstrBot version. (#10082)\r\n\r\n### Fixes\r\n\r\n- \u203c\ufe0f Preserved original image attachment paths after event cleanup so agents can continue to access attachments. (#10042)\r\n- Fixed plugin updates through URL and file installation. (#10053)\r\n- Fixed model selection in WebChat side threads and restored session model fallback for proactive agents. (#10065, #10028)\r\n- Fixed delivery of skills-like fallback replies during streaming. (#10025)\r\n- Made scheduled agents honor session context compression settings and record failures when the runner ends in an error state. (#9992, #9987)\r\n- Fixed OpenAI endpoint resolution when `api_base` is empty. (#10079)\r\n- Fixed missing fields, swallowed error codes, and parameter validation in web search tools. (#9979)\r\n- Spaced out concurrent URL-cleaning rate limiter waiters in the knowledge base. (#10015)\r\n- Improved Lark private-message delivery by falling back from rejected open IDs to known chat IDs without duplicating successful sends. (#10018)\r\n- Fixed QQ Official C2C streaming responses missing the closing frame. (#10069)\r\n- Reduced Telegram polling and conflict error log spam. (#10027, #10046)\r\n- Fixed mention-all handling in message outlines. (#9993)\r\n- Fixed current conversation deletion when the active conversation must be resolved from storage, and used WebChat session titles as a fallback in conversation history. (#10003, #9983)\r\n- Batched console log rendering to prevent WebUI freezes. (#9988, #9990)\r\n- Rejected stale WebUI assets in desktop-managed mode and excluded temporary dashboard build artifacts from PyPI source packages. (#9898, #10036)\r\n\r\n### Upgrade Notes\r\n\r\n- `/reset` now follows `/new`: the built-in Agent starts a new conversation while preserving the old history and current persona. Third-party Agent backends reset their stored session IDs and may not preserve old records. (#10004)\r\n\r\n## \u4e2d\u6587\r\n\r\n### \u65b0\u589e\u4e0e\u4f18\u5316\r\n\r\n- \u65b0\u589e ChatUI \u5386\u53f2\u6d88\u606f\u5206\u9875\u52a0\u8f7d\uff0c\u4f18\u5316\u804a\u5929\u8bbe\u7f6e\u3001\u6d88\u606f\u8f93\u5165\u6846\u548c\u6d41\u5f0f\u4ea4\u4e92\u4f53\u9a8c\u3002\u9ed8\u8ba4\u663e\u793a\u63a8\u7406\u8fc7\u7a0b\uff0c\u5de5\u4f5c\u533a\u4ee3\u7801\u9884\u89c8\u4f7f\u7528 Shiki \u8bed\u6cd5\u9ad8\u4eae\u3002 (#9667, #10021, #10020, #10023)\r\n- \u4e3a\u6a21\u578b\u9009\u62e9\u5668\u65b0\u589e\u63d0\u4f9b\u5546\u6765\u6e90\u7b5b\u9009\u548c\u5206\u7ec4\u6807\u9898\u5438\u9876\uff0c\u4f18\u5316\u6a21\u578b\u63d0\u4f9b\u5546\u914d\u7f6e\u5bf9\u8bdd\u6846\u3002 (#10084, #10007)\r\n- \u4e3a\u5185\u7f6e Agent \u65b0\u589e\u81ea\u9002\u5e94\u8f93\u5165\u56fe\u7247\u5904\u7406\uff1a\u6309\u9700\u7f29\u653e\u3001\u8f6c\u6362\u683c\u5f0f\uff0c\u5e76\u5c06\u52a8\u56fe\u8f6c\u4e3a\u591a\u5e27\u62fc\u56fe\u3002\u5728 CUA \u6c99\u7bb1\u4e0b\u4fdd\u7559\u9759\u56fe\u5c3a\u5bf8\uff0c\u56fe\u7247\u53ef\u80fd\u8d85\u8fc7\u6a21\u578b\u63d0\u4f9b\u5546\u4e0a\u4f20\u9650\u5236\u65f6\u7ed9\u51fa\u8b66\u544a\u3002 (#9703, #10071)\r\n- \u7edf\u4e00 `/new` \u548c `/reset` \u7684\u65b0\u5efa\u5bf9\u8bdd\u884c\u4e3a\uff0c\u5e76\u652f\u6301\u5728\u6307\u4ee4\u7ba1\u7406\u4e2d\u914d\u7f6e\u6743\u9650\u3002 (#10004)\r\n- \u65b0\u589e\u684c\u9762\u7aef\u66f4\u65b0\u4e0b\u8f7d\u8fdb\u5ea6\u663e\u793a\uff0c\u7cbe\u7b80 WebUI \u6253\u5305\u7684\u5b57\u4f53\u548c\u56fe\u8868\u8d44\u6e90\u3002 (#10050, #10034)\r\n- \u6539\u8fdb\u914d\u7f6e\u6ed1\u5757\u7684\u5065\u58ee\u6027\u3002 (#10037)\r\n- \u7edf\u4e00\u6a21\u578b\u63d0\u4f9b\u5546\u8bf7\u6c42\u7684 User-Agent\uff0c\u4f7f\u5176\u5305\u542b AstrBot \u7248\u672c\u3002 (#10082)\r\n\r\n### \u4fee\u590d\r\n\r\n- \u203c\ufe0f \u5728\u4e8b\u4ef6\u6e05\u7406\u540e\u4fdd\u7559\u56fe\u7247\u9644\u4ef6\u539f\u56fe\u8def\u5f84\uff0c\u4f7f Agent \u80fd\u591f\u7ee7\u7eed\u8bbf\u95ee\u9644\u4ef6\u3002 (#10042)\r\n- \u4fee\u590d\u901a\u8fc7 URL \u6216\u6587\u4ef6\u5b89\u88c5\u65b9\u5f0f\u66f4\u65b0\u63d2\u4ef6\u51fa\u73b0\u7684\u95ee\u9898\u3002 (#10053)\r\n- \u4fee\u590d WebChat \u4fa7\u8fb9\u7ebf\u7a0b\u7684\u6a21\u578b\u9009\u62e9\uff0c\u6062\u590d\u4e3b\u52a8 Agent \u5bf9\u4f1a\u8bdd\u6a21\u578b\u7684\u56de\u9000\u903b\u8f91\u3002 (#10065, #10028)\r\n- \u4fee\u590d\u6d41\u5f0f\u6a21\u5f0f\u4e0b skills-like \u56de\u9000\u56de\u590d\u672a\u9001\u8fbe\u7684\u95ee\u9898\u3002 (#10025)\r\n- \u4f7f\u5b9a\u65f6\u4efb\u52a1 Agent \u9075\u5faa\u4f1a\u8bdd\u4e0a\u4e0b\u6587\u538b\u7f29\u8bbe\u7f6e\uff0c\u5e76\u5728\u6267\u884c\u5668\u4ee5\u9519\u8bef\u72b6\u6001\u7ed3\u675f\u65f6\u8bb0\u5f55\u4efb\u52a1\u5931\u8d25\u3002 (#9992, #9987)\r\n- \u4fee\u590d `api_base` \u4e3a\u7a7a\u65f6\u7684 OpenAI \u63a5\u53e3\u5730\u5740\u89e3\u6790\u3002 (#10079)\r\n- \u4fee\u590d\u7f51\u9875\u641c\u7d22\u5de5\u5177\u7684\u5b57\u6bb5\u4e22\u5931\u3001\u9519\u8bef\u7801\u541e\u6ca1\u548c\u53c2\u6570\u6821\u9a8c\u95ee\u9898\u3002 (#9979)\r\n- \u4fee\u590d\u77e5\u8bc6\u5e93 URL \u6e05\u6d17\u9650\u6d41\u5668\u4e2d\u5e76\u53d1\u7b49\u5f85\u8bf7\u6c42\u672a\u9519\u5f00\u6267\u884c\u7684\u95ee\u9898\u3002 (#10015)\r\n- \u63d0\u9ad8\u98de\u4e66\u79c1\u804a\u6d88\u606f\u9001\u8fbe\u53ef\u9760\u6027\uff1aopen ID \u88ab\u62d2\u7edd\u65f6\u56de\u9000\u5230\u5df2\u77e5 chat ID\uff0c\u907f\u514d\u91cd\u590d\u53d1\u9001\u5df2\u6210\u529f\u7684\u6d88\u606f\u3002 (#10018)\r\n- \u4fee\u590d QQ \u5b98\u65b9\u673a\u5668\u4eba C2C \u6d41\u5f0f\u56de\u590d\u7f3a\u5c11\u7ed3\u675f\u5e27\u7684\u95ee\u9898\u3002 (#10069)\r\n- \u51cf\u5c11 Telegram \u8f6e\u8be2\u548c\u51b2\u7a81\u9519\u8bef\u7684\u91cd\u590d\u65e5\u5fd7\u3002 (#10027, #10046)\r\n- \u4fee\u590d\u6d88\u606f\u6982\u8981\u4e2d\u5168\u4f53\u6210\u5458\u63d0\u53ca\u7684\u5904\u7406\u987a\u5e8f\u3002 (#9993)\r\n- \u4fee\u590d\u9700\u8981\u4ece\u6301\u4e45\u5316\u5b58\u50a8\u89e3\u6790\u5f53\u524d\u5bf9\u8bdd\u65f6\u7684\u5220\u9664\u884c\u4e3a\uff0c\u5e76\u5728\u5bf9\u8bdd\u5386\u53f2\u4e2d\u4f7f\u7528 WebChat \u4f1a\u8bdd\u6807\u9898\u4f5c\u4e3a\u56de\u9000\u3002 (#10003, #9983)\r\n- \u6279\u91cf\u6e32\u67d3\u63a7\u5236\u53f0\u65e5\u5fd7\uff0c\u907f\u514d WebUI \u5361\u987f\u3002 (#9988, #9990)\r\n- \u4fee\u590d\u684c\u9762\u7aef\u6258\u7ba1\u6a21\u5f0f\u52a0\u8f7d\u8fc7\u671f WebUI \u8d44\u6e90\u7684\u95ee\u9898\uff0c\u5e76\u4ece PyPI \u6e90\u7801\u5305\u4e2d\u6392\u9664\u4e34\u65f6\u524d\u7aef\u6784\u5efa\u4ea7\u7269\u3002 (#9898, #10036)\r\n\r\n### \u5347\u7ea7\u63d0\u793a\r\n\r\n- `/reset` \u73b0\u5728\u4e0e `/new` \u884c\u4e3a\u4e00\u81f4\uff1a\u5185\u7f6e Agent \u4f1a\u521b\u5efa\u65b0\u5bf9\u8bdd\uff0c\u4fdd\u7559\u65e7\u5386\u53f2\u5e76\u7ee7\u627f\u5f53\u524d\u4eba\u683c\uff1b\u7b2c\u4e09\u65b9 Agent \u540e\u7aef\u4f1a\u91cd\u7f6e\u4fdd\u5b58\u7684\u4f1a\u8bdd ID\uff0c\u4e0d\u4fdd\u8bc1\u4fdd\u7559\u65e7\u8bb0\u5f55\u3002\u7fa4\u804a\u9ed8\u8ba4\u6743\u9650\u8ddf\u968f\u5bf9\u8bdd\u9694\u79bb\u8bbe\u7f6e\uff0c\u5df2\u6709\u6307\u4ee4\u6743\u9650\u8bbe\u7f6e\u7ee7\u7eed\u751f\u6548\u3002 (#10004)\r\n\r\n[4.28.1]: https://github.com/AstrBotDevs/AstrBot/compare/v4.28.0...v4.28.1\r\n\r\n## What's Changed\r\n* fix(dashboard): reject stale WebUI assets in desktop-managed mode by @JosephTian876 in https://github.com/AstrBotDevs/AstrBot/pull/9898\r\n* fix(cron): honor session context compression settings by @camera-2018 in https://github.com/AstrBotDevs/AstrBot/pull/9992\r\n* fix(cron): record active-agent job failure when the runner ends in ERROR by @he-yufeng in https://github.com/AstrBotDevs/AstrBot/pull/9987\r\n* perf: improve provider dialog by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10007\r\n* fix: resolve persisted current conversation before deletion by @wcqqq1214 in https://github.com/AstrBotDevs/AstrBot/pull/10003\r\n* fix: batch console log rendering to avoid UI freeze (#9988) by @nina-ysml in https://github.com/AstrBotDevs/AstrBot/pull/9990\r\n* fix(webui): fall back to WebChat session titles in conversation history by @heerxingen in https://github.com/AstrBotDevs/AstrBot/pull/9983\r\n* fix: resolve field loss, error code swallowing, and parameter validation issues in web search tool by @WangPan59 in https://github.com/AstrBotDevs/AstrBot/pull/9979\r\n* fix: correct At/AtAll branch order in message outline by @DFGHJ43 in https://github.com/AstrBotDevs/AstrBot/pull/9993\r\n* feat(webchat): enable reasoning display by default by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10020\r\n* feat(chatui): refine settings, composer and streaming experience by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10021\r\n* fix(lark): Ensure Lark private messages are delivered reliably by falling back from rejected open IDs to known chat IDs without duplicating successful sends. by @NayukiChiba in https://github.com/AstrBotDevs/AstrBot/pull/10018\r\n* feat(chatui): reuse Shiki for workspace code previews by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10023\r\n* perf(dashboard): reduce bundled font and diagram assets by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10034\r\n* fix(ci): exclude temporary dashboard artifacts from PyPI source packages by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10036\r\n* feat: enhance slider robustness by @PyuraMazo in https://github.com/AstrBotDevs/AstrBot/pull/10037\r\n* fix(agent): deliver skills-like fallback replies when streaming by @camera-2018 in https://github.com/AstrBotDevs/AstrBot/pull/10025\r\n* fix(kb): space out concurrent waiters in the URL cleaning RateLimiter by @L4XB in https://github.com/AstrBotDevs/AstrBot/pull/10015\r\n* fix: restore session model fallback for proactive agents by @beemines in https://github.com/AstrBotDevs/AstrBot/pull/10028\r\n* fix: preserve image attachment paths after event cleanup by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10042\r\n* feat(dashboard): paginate chat history by @wcqqq1214 in https://github.com/AstrBotDevs/AstrBot/pull/9667\r\n* feat(dashboard): show desktop update download progress by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10050\r\n* feat: unify /new and /reset behavior by @w31r4 in https://github.com/AstrBotDevs/AstrBot/pull/10004\r\n* fix: support plugin updates through URL and file installation by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10053\r\n* fix: use selected model in webchat side threads by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10065\r\n* feat: adaptively prepare model input images in the local process stage by @piexian in https://github.com/AstrBotDevs/AstrBot/pull/9703\r\n* fix: standardize provider user agents with the AstrBot version by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10082\r\n* fix(qqofficial): always send the state=10 closing frame in C2C streaming by @he-yufeng in https://github.com/AstrBotDevs/AstrBot/pull/10069\r\n* feat: optimize model selection with source filters and sticky groups by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10084\r\n* fix: preserve OpenAI endpoint resolution for empty api_base by @wcqqq1214 in https://github.com/AstrBotDevs/AstrBot/pull/10079\r\n* fix: reduce Telegram log spam from polling and conflict errors (#10027) by @nina-ysml in https://github.com/AstrBotDevs/AstrBot/pull/10046\r\n* fix: preserve input image geometry under CUA sandbox and warn on oversized images by @piexian in https://github.com/AstrBotDevs/AstrBot/pull/10071\r\n* chore: bump version to 4.28.1 by @Soulter in https://github.com/AstrBotDevs/AstrBot/pull/10085\r\n\r\n## New Contributors\r\n* @nina-ysml made their first contribution in https://github.com/AstrBotDevs/AstrBot/pull/9990\r\n* @DFGHJ43 made their first contribution in https://github.com/AstrBotDevs/AstrBot/pull/9993\r\n* @L4XB made their first contribution in https://github.com/AstrBotDevs/AstrBot/pull/10015\r\n* @beemines made their first contribution in https://github.com/AstrBotDevs/AstrBot/pull/10028\r\n\r\n**Full Changelog**: https://github.com/AstrBotDevs/AstrBot/compare/v4.28.0...v4.28.1","mentions_count":15}
