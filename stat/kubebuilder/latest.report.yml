# \u26a0\ufe0f Breaking Changes\r\n\r\n### Only for users of the Helm Plugin (`helm/v2-alpha`)\r\n\r\n- Standardize feature toggle naming from `enable` to `enabled` (#5736)\r\n\r\n**Action Required**\r\n\r\nRun:\r\n\r\n```sh\r\nkubebuilder edit --plugins=helm/v2-alpha --force\r\n```\r\n\r\nThen ensure that all occurrences of `enable` are renamed to `enabled` in:\r\n\r\n```text\r\n<path>/chart/values.yaml\r\n```\r\n\r\n## \u2728 Upgrades\r\n\r\nAdds support for Kubernetes `1.36` and Go `1.26`.\r\n\r\n- **(go/v4)** Upgrade Go from `1.25.7` to `1.26.0` (#5670)\r\n- **(go/v4)** Upgrade controller-runtime from `v0.23.3` to `v0.24.1` and Kubernetes dependencies to support Kubernetes `1.36` (#5671, #5710)\r\n- **(go/v4)** Upgrade controller-tools from `v0.20.1` to `v0.21.0` (#5683)\r\n- **(go/v4)** Upgrade golangci-lint from `v2.11.4` to `v2.12.2` (#5711)\r\n\r\n## \u2728 New Features\r\n\r\n- **(go/v4)** Pin ENVTEST version in generated projects (supported starting with controller-runtime `v0.24.0`) (#5684)\r\n- **(helm/v2-alpha)** Generate optional NetworkPolicy resources by default when none are defined in the provided Kustomize configuration (#5708)\r\n- **(go/v4)** Add a `depguard` rule to deny usage of the Go `sort` package (#5755)\r\n\r\n## \ud83d\udc1b Bug Fixes\r\n\r\n- **(helm/v2-alpha)** Fix indentation of conditional volume mounts in generated manifests (#5678)\r\n- **(API)** Fix file descriptor leak caused by deferred file closing inside loops in the external plugin handler (#5688)\r\n- **(API)** Preserve external plugin flag values containing double hyphens (`--`) (#5716)\r\n- **(CLI)** Fix panic caused by an unchecked type assertion in deprecation warning handling (#5689)\r\n- **(CLI)** Fix `CloseFileError` wrapping `nil` instead of the actual close error (#5681)\r\n- **(CLI)** Fix redundant guard and swallowed checkout error in `alpha update push` (#5694)\r\n- **(CLI)** Add context timeout to HTTP calls used by `alpha update` (#5695)\r\n- **(CLI)** Correct capture group handling and improve error messages (#5714)\r\n- **(grafana/v1-alpha)** Fix file handle leak when configuration loading fails (#5682)\r\n- **(helm/v2-alpha)** Fix `edit` hanging on malformed `dist/install.yaml` files (#5753)\r\n\r\n## What's Changed\r\n* \ud83c\udf31 chore: Pin setup-envtest to commit hash by @vitorfloriano in https://github.com/kubernetes-sigs/kubebuilder/pull/5666\r\n* \ud83c\udf31 Bump k8s.io/apimachinery from 0.35.4 to 0.36.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5656\r\n* \u2728 chore(go/v4): Upgrade golang version from 1.25.7 to 1.26.0 by @camilamacedo86 in https://github.com/kubernetes-sigs/kubebuilder/pull/5670\r\n* \u2728 (go/v4): Upgrade controller-runtime from v0.23.3 to v0.24.0 and k8s dependencies to support k8s 1.26 by @camilamacedo86 in https://github.com/kubernetes-sigs/kubebuilder/pull/5671\r\n* \ud83d\udcd6 (External Plugin Sample) Update k8s.io/apimachinery from  v0.35.4 to v0.36.0 by @camilamacedo86 in https://github.com/kubernetes-sigs/kubebuilder/pull/5673\r\n* \ud83c\udf31 Bump github/codeql-action from 4.35.2 to 4.35.3 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5675\r\n* \ud83c\udf31 Bump github/codeql-action from 4.35.3 to 4.35.4 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5680\r\n* \ud83c\udf31 Bump golang.org/x/text from 0.36.0 to 0.37.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5687\r\n* \u2728 (go/v4) Upgrade controller-tools from v0.20.1 to v0.21.0 by @camilamacedo86 in https://github.com/kubernetes-sigs/kubebuilder/pull/5683\r\n* \ud83c\udf31  Bump golang.org/x/tools from 0.44.0 to 0.45.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5686\r\n* \ud83d\udc1b fix(helm/v2-alpha): correct indentation of conditional volume mounts by @felix-kaestner in https://github.com/kubernetes-sigs/kubebuilder/pull/5678\r\n* \ud83d\udc1b (API): Fix file descriptor leak from defer inside loop in external plugin handler by @SebTardif in https://github.com/kubernetes-sigs/kubebuilder/pull/5688\r\n* \ud83d\udc1b (CLI): Fix panic from unchecked type assertion in printDeprecationWarnings by @SebTardif in https://github.com/kubernetes-sigs/kubebuilder/pull/5689\r\n* \ud83d\udc1b (CLI): Fix CloseFileError wrapping nil instead of actual close error by @SebTardif in https://github.com/kubernetes-sigs/kubebuilder/pull/5681\r\n* \u2728 (go/v4): Pin the ENVTEST version in the scaffold, now supported starting with controller-runtime release v0.24.0 by @v47 in https://github.com/kubernetes-sigs/kubebuilder/pull/5684\r\n* \ud83d\udc1b (grafana/v1alpha): Fix file handle leak on config read error by @SebTardif in https://github.com/kubernetes-sigs/kubebuilder/pull/5682\r\n* \ud83c\udf31 Bump helm.sh/helm/v3 from 3.20.2 to 3.21.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5696\r\n* \ud83c\udf31 Bump k8s.io/apimachinery from 0.36.0 to 0.36.1 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5691\r\n* \ud83c\udf31  Bump zizmorcore/zizmor-action from 0.5.3 to 0.5.4 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5698\r\n* \ud83c\udf31 Bump github/codeql-action from 4.35.4 to 4.35.5 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5697\r\n* \ud83d\udc1b (CLI): Fix redundant guard and swallowed checkout error in alpha update push by @SebTardif in https://github.com/kubernetes-sigs/kubebuilder/pull/5694\r\n* \ud83d\udc1b (CLI): Add context timeout to HTTP calls in alpha update by @SebTardif in https://github.com/kubernetes-sigs/kubebuilder/pull/5695\r\n* \ud83c\udf31 Bump zizmorcore/zizmor-action from 0.5.4 to 0.5.6 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5699\r\n* \ud83c\udf31 Bump goreleaser/goreleaser-action from 7.2.1 to 7.2.2 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5700\r\n* \ud83c\udf31 Bump github.com/onsi/ginkgo/v2 from 2.28.3 to 2.29.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5702\r\n* \ud83c\udf31 Bump github.com/onsi/gomega from 1.40.0 to 1.41.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5701\r\n* \ud83d\udcd6  Bump github.com/onsi/ginkgo/v2 from 2.28.3 to 2.29.0 in /docs/book/src/simple-external-plugin-tutorial/testdata/sampleexternalplugin/v1 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5703\r\n* \ud83d\udcd6 Bump github.com/onsi/gomega from 1.40.0 to 1.41.0 in /docs/book/src/simple-external-plugin-tutorial/testdata/sampleexternalplugin/v1 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5704\r\n* \u2728  (go/v4) Upgrade controller-runtime from v0.24.0 to v0.24.1 by @camilamacedo86 in https://github.com/kubernetes-sigs/kubebuilder/pull/5710\r\n* \ud83c\udf31 Bump golangci/golangci-lint-action from 9.2.0 to 9.2.1 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5713\r\n* \ud83c\udf31 Bump github/codeql-action from 4.35.5 to 4.36.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5712\r\n* \u2728 (helm/v2-alpha): Helm charts now include optional NetworkPolicy resources by default when none are defined in the informed Kustomize file. by @mattsu2020 in https://github.com/kubernetes-sigs/kubebuilder/pull/5708\r\n* \ud83c\udf31 (CLI): Add support for k8s 1.36 by @camilamacedo86 in https://github.com/kubernetes-sigs/kubebuilder/pull/5674\r\n* \ud83d\udc1b (CLI) fix: correct wrong capture group and fix typos in error messages by @immanuwell in https://github.com/kubernetes-sigs/kubebuilder/pull/5714\r\n* \ud83d\udcd6 (go/v4): Enhance create webhook command help  by @cmallikarjunah in https://github.com/kubernetes-sigs/kubebuilder/pull/5720\r\n* \ud83c\udf31 Bump actions/checkout from 6.0.2 to 6.0.3 by @dependabot[bot] in https://github.com/kubernetes-sigs/kub