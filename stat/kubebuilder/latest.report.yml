on guide](https://book.kubebuilder.io/migrations.html): follow the AI instructions, or make the changes by hand, to re-scaffold your project with the latest version and put your own changes back on top. Use them as a one-time step to reach a supported version, then continue using these update workflows.\r\n\r\n## \u2757Recommended Scaffold Fixes to Apply\r\n\r\nThese are not breaking changes but are significant bug fixes. If you upgrade with [`alpha update`](https://book.kubebuilder.io/reference/commands/alpha_update.html) or the [AutoUpdate Plugin](https://book.kubebuilder.io/plugins/available/autoupdate-v1-alpha), you get them automatically. Apply them by hand only if you update your project manually.\r\n\r\n<details>\r\n<summary><b>Fix the default webhook names to align with the controller-runtime interfaces</b></summary>\r\n\r\nApplies to projects with webhooks. The generated webhook structs were renamed. [#5877](https://github.com/kubernetes-sigs/kubebuilder/pull/5877)\r\n\r\n`<Kind>CustomDefaulter` is now `<Kind>Defaulter`, and `<Kind>CustomValidator` is now `<Kind>Validator`.\r\n\r\nTo apply this by hand, open `internal/webhook/<version>/<kind>_webhook.go` and rename both types. Then update three more places: the method receivers, the `WithDefaulter` and `WithValidator` calls in `Setup<Kind>WebhookWithManager`, and `<kind>_webhook_test.go`.\r\n\r\n> For example, the sample: [`captain_webhook.go`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4/internal/webhook/v1/captain_webhook.go) and [`captain_webhook_test.go`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4/internal/webhook/v1/captain_webhook_test.go).\r\n\r\n</details>\r\n\r\n**If you skip it:** nothing breaks. Your code still compiles and runs. But the next webhook you add with `create webhook` uses the new names, so one project ends up with both `<Kind>CustomValidator` and `<Kind>Validator`.\r\n\r\n<details>\r\n<summary><b>Fix the <code>envtest</code> suite teardown</b></summary>\r\n\r\nApplies to every project with an API or a webhook. `AfterSuite` no longer retries `testEnv.Stop()`. [#5838](https://github.com/kubernetes-sigs/kubebuilder/pull/5838)\r\n\r\nThe teardown used to run inside `Eventually`, which kept retrying after a `SIGKILL`. That hid real shutdown failures. Kubebuilder now checks the result once.\r\n\r\nTo apply this by hand, replace the `AfterSuite` body in `suite_test.go` and `webhook_suite_test.go` with:\r\n```go\r\n     err := testEnv.Stop()\r\n     Expect(err).NotTo(HaveOccurred())\r\n```\r\n\r\nSuites that passed before may now fail. The failure was always there. The retry only hid it.\r\n\r\n> For example, the sample: [`suite_test.go`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4/internal/controller/suite_test.go) and [`webhook_suite_test.go`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4/internal/webhook/v1/webhook_suite_test.go). To learn more, see [Configuring envtest](https://book.kubebuilder.io/reference/envtest).\r\n\r\n</details>\r\n\r\n**If you skip it:** your tests keep passing, and that is the problem. A failing `testEnv.Stop()` is retried away instead of reported, so a control plane that did not shut down leaves `kube-apiserver` and `etcd` processes behind without telling you.\r\n\r\n<details>\r\n<summary><b>Fix the webhook NetworkPolicy</b></summary>\r\n\r\nApplies to every project. It matters most if you uncommented `- ../network-policy` in `config/default/kustomization.yaml`. The webhook [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/) was fixed. [#5905](https://github.com/kubernetes-sigs/kubebuilder/pull/5905)\r\n\r\nThe old policy allowed traffic on port `443`, and only from namespaces labeled `webhook: enabled`. Two things were wrong with that. Port `443` is the Service port, not the port the manager listens on. And the API server does not run in a labeled namespace. So turning the policy on blocked every webhook call.\r\n\r\nTo apply this by hand, replace the `ingress` block in `config/network-policy/allow-webhook-traffic.yaml` with:\r\n```yaml\r\n   ingress:\r\n     - ports:\r\n         - port: 9443\r\n           protocol: TCP\r\n```\r\n\r\nIf you set `--webhook-port`, use your own port instead of `9443`. You can also remove the `webhook: enabled` label from your namespaces, because nothing uses it now.\r\n\r\nTo limit which namespaces a webhook applies to, use [`namespaceSelector`](https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/#matching-requests-namespaceselector) instead. This release ships [controller-tools `v0.22.0`](https://github.com/kubernetes-sigs/controller-tools/releases/tag/v0.22.0), which adds a `patch` option to the webhook marker, so you can set the selector in your code ([controller-tools#1339](https://github.com/kubernetes-sigs/controller-tools/pull/1339)):\r\n\r\n```go\r\n// +kubebuilder:webhook:path=/mutate-v1-pod,mutating=true,...,patch=`{\"namespaceSelector\":{\"matchLabels\":{\"webhook-enabled\":\"true\"}}}`\r\n```\r\nRun `make manifests` to regenerate your `MutatingWebhookConfiguration` and `ValidatingWebhookConfiguration`.\r\n\r\n> For example, the sample: [`allow-webhook-traffic.yaml`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4/config/network-policy/allow-webhook-traffic.yaml).\r\n\r\n</details>\r\n\r\n**If you skip it:** on a cluster whose CNI does not enforce NetworkPolicy, nothing changes. On one that does, such as Calico or Cilium, enabling the policy blocks webhook traffic: the rule allows pod port `443`, but the manager listens on `9443`. Either way, the `webhook: enabled` label gave a false sense of protection. NetworkPolicy cannot decide which namespaces a webhook applies to \u2014 only `namespaceSelector` in the webhook configuration can.\r\n\r\n# What's Changed\r\n\r\n\r\n## \u26a0\ufe0f Breaking Changes\r\n\r\n<details>\r\n<summary><b>Only for projects using the AutoUpdate plugin (<a href=\"https://book.kubebuilder.io/plugins/available/autoupdate-v1-alpha\"><code>autoupdate/v1-alpha</code></a>)</b></summary>\r\n\r\nGitHub Models support has been removed. [#5777](https://github.com/kubernetes-sigs/kubebuilder/pull/5777)\r\n\r\nUpdate the plugin and review the changes:\r\n```sh\r\nkubebuilder edit --plugins=autoupdate/v1-alpha --force\r\n```\r\n\r\n> For example, the sample: [`auto_update.yml`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4-with-plugins/.github/workflows/auto_update.yml).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Only for projects using the Helm plugin (<a href=\"https://book.kubebuilder.io/plugins/available/helm-v2-alpha\"><code>helm/v2-alpha</code></a>)</b></summary>\r\n\r\nTwo chart values are now required. Without them, your chart fails to render.\r\n\r\nUpgrade your project using [`alpha update`](https://book.kubebuilder.io/reference/commands/alpha_update.html) or alternatively, regenerate the chart with:\r\n```sh\r\nkubebuilder edit --plugins=helm/v2-alpha --force\r\n```\r\nNew values are not added automatically. Add them manually by comparing your chart with the [`v4.16.0` sample values file](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4-with-plugins/dist/chart/values.yaml).\r\n\r\nThree changes need your attention:\r\n\r\n- `manager.healthProbe.port` is new, and the chart has no default for it. If you do not add it, the chart fails to render with `nil pointer evaluating interface {}.port`. Add it under `manager`: [#5866](https://github.com/kubernetes-sigs/kubebuilder/pull/5866), [#5888](https://github.com/kubernetes-sigs/kubebuilder/pull/5888)\r\n```yaml\r\n   manager:\r\n     healthProbe:\r\n       port: 8081\r\n```\r\n- `serviceAccount.name` is now required when you set `serviceAccount.enabled: false`. Before, the chart rendered and pointed at a [ServiceAccount](https://kubernetes.io/docs/concepts/security/service-accounts/) that did not exist. Now it fails instead. Set a name, or use `name: default` to use the namespace default ServiceAccount. [#5833](https://github.com/kubernetes-sigs/kubebuilder/pull/5833)\r\n- Helm now runs the values in `manager.args` through the [`tpl` function](https://helm.sh/docs/howto/charts_tips_and_tricks/#using-the-tpl-function). If an argument contains `{{ }}`, Helm evaluates it as a template. Before, it passed the argument through as plain text. [#5927](https://github.com/kubernetes-sigs/kubebuilder/pull/5927)\r\n\r\n> For example, the sample: [`values.yaml`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4-with-plugins/dist/chart/values.yaml), [`manager.yaml`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4-with-plugins/dist/chart/templates/manager/manager.yaml), and [`_helpers.tpl`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4-with-plugins/dist/chart/templates/_helpers.tpl).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Only for projects with webhooks under <code>api/&lt;version&gt;/</code></b></summary>\r\n\r\nThe deprecated `--legacy` flag has been removed. Projects already using `internal/webhook/<version>/` are not affected. [#5837](https://github.com/kubernetes-sigs/kubebuilder/pull/5837)\r\n\r\nMove your webhooks from `api/<version>/` to `internal/webhook/<version>/` and update them to use interfaces compatible with controller-runtime `v0.20.0` and later. Follow the [migration guide with AI instructions](https://book.kubebuilder.io/migration/reorganize-layout.html).\r\n\r\n> For example, the sample: [`internal/webhook/v1/`](https://github.com/kubernetes-sigs/kubebuilder/blob/v4.16.0/testdata/project-v4/internal/webhook/v1). For more context, see the [Kubebuilder v4.3.0 release notes](https://github.com/kubernetes-sigs/kubebuilder/releases/tag/v4.3.0), where the `--legacy` flag was introduced to help users migrate from controller-runtime deprecations.\r\n\r\n</details>\r\n\r\n## \u2728 Upgrades\r\n\r\n- **(go/v4)** Upgrade [cert-manager](https://cert-manager.io/) from `v1.20.2` to [`v1.21.1`](https://github.com/cert-manager/cert-manager/releases/tag/v1.21.1) (#5799, #5861, #6000)\r\n- **(go/v4, [deploy-image/v1-alpha](https://book.kubebuilder.io/plugins/available/deploy-image-plugin-v1-alpha))** Upgrade [golangci-lint](https://golangci-lint.run/) to [`v2.13.1`](https://github.com/golangci/golangci-lint/releases/tag/v2.13.1), and replace the deprecated `Requeue` field with `RequeueAfter` in the scaffolds and the docs (#5992)\r\n- **(go/v4)** Upgrade [controller-tools](https://github.com/kubernetes-sigs/controller-tools) from `v0.21.0` to [`v0.22.0`](https://github.com/kubernetes-sigs/controller-tools/releases/tag/v0.22.0) (#6025)\r\n- **(go/v4)** Upgrade [controller-runtime](https://github.com/kubernetes-sigs/controller-runtime) from `v0.24.1` to [`v0.25.0`](https://github.com/kubernetes-sigs/controller-runtime/releases/tag/v0.25.0) (#6026)\r\n- **(go/v4)** Add support for [Kubernetes 1.37](https://kubernetes.io/releases/). This upgrades the `k8s.io/*` dependencies from `v0.36.0` to `v0.37.0`, makes `kubebuilder version` report Kubernetes `1.37.0`, and runs the end-to-end tests against [KIND](https://kind.sigs.k8s.io/) `v1.37.0` (#6027)\r\n\r\n## \u2728 New Features\r\n\r\n- **(go/v4)** Add alpha [Server-Side Apply](https://kubernetes.io/docs/reference/using-api/server-side-apply/) scaffolding with `create api --ssa`. See [Server-Side Apply](https://book.kubebuilder.io/reference/server-side-apply) (#5458, #5829, #5840, #5939, #6024)\r\n- **(go/v4)** Let you change the base image used to build the manager with the `BASE_IMAGE` build argument (#5915)\r\n- **(go/v4, API)** Check the path of an [external API](https://book.kubebuilder.io/reference/using_an_external_resource) sooner, reject a path that is only a domain, and show a clearer error when the path is wrong (#5766, #5903)\r\n- **(go/v4)** Set webhook configuration fields such as `namespaceSelector` and `objectSelector` directly from the `+kubebuilder:webhook:` marker, using the new `patch` option that comes with [controller-tools `v0.22.0`](https://github.com/kubernetes-sigs/controller-tools/releases/tag/v0.22.0) ([controller-tools#1339](https://github.com/kubernetes-sigs/controller-tools/pull/1339))\r\n- **(CLI)** Show the plugin prefix in the CLI help only when it is needed, so the help is easier to read (#5843)\r\n- **(helm/v2-alpha)** Let you set the manager health probe port with `manager.healthProbe.port` (#5866, #5888) \u2014 see [Breaking Changes](#\ufe0f-breaking-changes)\r\n- **(go/v4, helm/v2-alpha)** Let you set a custom webhook port, and keep the manager and the Helm chart using the same value (#5868, #5884, #5896)\r\n- **(helm/v2-alpha)** Let you use Helm templates in `manager.args` values (#5927) \u2014 see [Breaking Changes](#\ufe0f-breaking-changes)\r\n- **(helm/v2-alpha)** Let you add your own labels and annotations to the ServiceMonitor. See [Metrics](https://book.kubebuilder.io/reference/metrics) (#5994)\r\n- **(helm/v2-alpha, go/v4)** add support for stop the webhook server when webhook.enabled=false (#6031,6034)\r\n\r\n## \ud83d\udc1b Bug Fixes\r\n\r\n- **(go/v4)** Rename the generated webhook types from `<Kind>CustomDefaulter` and `<Kind>CustomValidator` to `<Kind>Defaulter` and `<Kind>Validator`, and correct the comments that name the interfaces they implement (#5877) \u2014 see [Recommended Scaffold Fixes](#-recommended-scaffold-fixes)\r\n- **(go/v4)** Use the Go 1.26 `new(expr)` syntax in generated code instead of `k8s.io/utils/ptr`, and stop turning off the `newexpr` check in the generated `.golangci.yml` (#5775)\r\n- **(go/v4)** Report [`envtest`](https://book.kubebuilder.io/reference/envtest) shutdown failures instead of hiding them behind retries (#5838) \u2014 see [Recommended Scaffold Fixes](#-recommended-scaffold-fixes)\r\n- **(go/v4)** Find the right resource when you run `create webhook` for an [external API](https://book.kubebuilder.io/reference/using_an_external_resource). Kubebuilder now reuses the configuration already recorded in `PROJECT`, matches on Group, Version and Kind because the caller does not know the domain, and lets you pick with `--external-api-domain` when more than one recorded resource matches (#5792, #5917, #5932)\r\n- **(go/v4)** Fix the generated webhook code and tests for external APIs, for projects with several APIs, and when you add webhooks one at a time (#5839, #5871)\r\n- **(go/v4)** Explain the Podman limitation in the generated `.dockerignore`, so you can find the workaround when a Podman build fails (#5887, #5914)\r\n- **(go/v4, CLI)** Replace the `YEAR` placeholder only when it stands alone, so words that contain `YEAR` are left alone (#5809)\r\n- **(go/v4, helm/v2-alpha)** Fix the webhook [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/), which stopped the API server from reaching your webhooks (#5905) \u2014 see [Recommended Scaffold Fixes](#-recommended-scaffold-fixes)\r\n- **(helm/v2-alpha)** Make `make helm-deploy` use the controller image you configured (#5765)\r\n- **(helm/v2-alpha)** Find the right manager Deployment and container, even when the file holds several Deployments or the YAML fields are in a different order (#5781, #5784)\r\n- **(helm/v2-alpha)** Fix the [ServiceAccount](https://kubernetes.io/docs/concepts/security/service-accounts/) name, keep its labels and annotations, and require a name when you turn ServiceAccount creation off (#5757, #5833, #5852) \u2014 see [Breaking Changes](#\ufe0f-breaking-changes)\r\n- **(helm/v2-alpha)** Stop adding your custom volumes twice (#5764)\r\n- **(helm/v2-alpha)** Stop the chart from failing to render when you do not set pod annotations (#5795)\r\n- **(helm/v2-alpha)** Set `prometheus.enabled` from the generated kustomize output, instead of always setting it to `false` (#5913)\r\n- **(helm/v2-alpha)** Pass the manager `--metrics-secure` argument through to the chart's `metrics.secure` value. See [Metrics](https://book.kubebuilder.io/reference/metrics) (#5951)\r\n- **(CLI)** Delete the temporary files and Git branches that [`alpha update`](https://book.kubebuilder.io/reference/commands/alpha_update) creates, including when it fails (#5705, #5830)\r\n- **(CLI)** Read the [`PROJECT`](https://book.kubebuilder.io/reference/project-config.html) file only for the commands that need it. `version`, `help`, and `completion` now work even when the current directory holds an invalid `PROJECT` file (#5845, #5942, #6030)\r\n- **(CLI)** Delete the [`alpha generate`](https://book.kubebuilder.io/reference/commands/alpha_generate) output directory without calling the shell, which removes a shell injection risk (#5920)\r\n- **(CLI)** Stop `alpha generate` from deleting the current directory when you use `--input-dir` without `--output-dir`. It now regenerates the project in place (#5957)\r\n- **(CLI)** Keep your [Grafana](https://book.kubebuilder.io/plugins/available/grafana-v1-alpha) changes when `alpha generate` runs in place (#5968)\r\n- **(CLI)** Update retired Go plugin keys in `PROJECT` to `go.kubebuilder.io/v4`. `go/v3-alpha` used to become `go/v4-alpha`, which does not exist, because `go/v3` matched first. `go/v4-alpha` is now retired too (#6023)\r\n\r\n<details>\r\n<summary> <b>Full Changelog and New contributors</b></summary>\r\n\r\n## What Changed\r\n\r\n* \ud83c\udf31  Bump github.com/onsi/gomega from 1.41.0 to 1.42.0 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5768\r\n* \ud83d\udcd6 Bump github.com/onsi/gomega from 1.41.0 to 1.42.0 in /docs/book/src/simple-external-plugin-tutorial/testdata/sampleexternalplugin/v1 by @dependabot[bot] in https://github.com/kubernetes-sigs/kubebuilder/pull/5770\r\n* \ud83c\udf31 Bump github.com/onsi/ginkgo/v2 from 2.30.0 to 2.31.0 by @dependabot[bot] in 