{"id":437736371,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORnOeDM4aF1Oz","tag_name":"v2.0.3","target_commitish":"main","name":"v2.0.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-07T17:39:04Z","updated_at":"2026-11-07T17:45:59Z","published_at":"2026-11-07T17:45:12Z","assets":[{"id":721444953,"node_id":"RA_kwDORnOeDM4rAGBZ","name":"opencli-extension-v1.0.27.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":49186,"digest":"sha256:8636d42a0fe44d7ba3b0603dbcd9581e8269ccbca950136d0dfc0ffc39a8a213","download_count":1813,"created_at":"2026-11-07T17:45:11Z","updated_at":"2026-11-07T17:45:11Z"}],"body":"Includes Chrome extension **1.0.27**. Update the extension for loopback connectivity, native keyboard input, and browser-window recovery fixes.\n\n### Features\n\n- Add Pinduoduo search and Twitter list-members commands.\n- Include replies and retweets in Twitter search results, and suggest site login commands on authentication failures.\n\n### Fixes\n\n- Agree on a reachable loopback address across the daemon, CLI, and extension; avoid replacing a newer daemon with an older CLI.\n- Aim browser clicks at the resolved element, detect sibling occlusion, send complete native keyboard events, and recover owned idle windows after restart.\n- Fall back to DataTransfer uploads when the file chooser does not open; safely replace stale plugin host junctions on Windows.\n- Preserve JavaScript pipes and quoted expressions in pipelines, append query parameters before URL fragments, and escape CSV/Markdown headers.\n- Isolate concurrent download temporary files, preserve article code blocks, and honor yt-dlp failure exit status.\n- Improve LinkedIn experience, activity, and job parsing; wait for Weixin verification and article rendering; fix Ctrip train navigation.\n- Improve Twitter identity, Facebook search, Reddit blocked-page handling, JD login detection, Gemini conversation extraction, Grok session/text extraction, and YouTube login detection.\n- Update Xiaohongshu search and creator-note extraction, and report unloaded interaction counts as errors rather than zero.\n- Update undici to 7.30.1 for published security advisories.\n\n\n## What's Changed\n* docs: highlight Chrome Web Store installation by @jackwener in https://github.com/jackwener/OpenCLI/pull/2687\n* fix(extension): recover marked idle browser windows after restart by @wangning19940904 in https://github.com/jackwener/OpenCLI/pull/2703\n* fix(deps): bump undici to 7.30.1 for three published advisories by @yisiliu in https://github.com/jackwener/OpenCLI/pull/2709\n* fix(skills): pass --session to autofix browser page commands by @StrivingLee in https://github.com/jackwener/OpenCLI/pull/2706\n* fix(pipeline/template): evaluate expressions that start and end with a quote by @Enesuygurs in https://github.com/jackwener/OpenCLI/pull/2696\n* fix(ctrip): use one-way ticketType and unblock train navigation (#2689) by @nengqi in https://github.com/jackwener/OpenCLI/pull/2700\n* fix(adapters): fall through to DataTransfer upload when the intercepted file chooser never opens by @LeoLin990405 in https://github.com/jackwener/OpenCLI/pull/2683\n* fix(xiaohongshu): fail typed when a note's interaction counts never load instead of reporting 0 by @yisiliu in https://github.com/jackwener/OpenCLI/pull/2708\n* fix(linkedin): prevent title and company shift on grouped experience cards (#2433) by @nengqi in https://github.com/jackwener/OpenCLI/pull/2701\n* fix(weixin): wait for the captcha to auto-resolve before failing (#2045) by @LeoLin990405 in https://github.com/jackwener/OpenCLI/pull/2694\n* fix(browser): aim retargeted clicks at the resolved element, not the ancestor centre by @LeoLin990405 in https://github.com/jackwener/OpenCLI/pull/2682\n* fix(xiaohongshu): read the current .note-card render in creator-notes DOM fallback by @jackwener in https://github.com/jackwener/OpenCLI/pull/2779\n* fix(xiaohongshu): search on the AI-search homepage, with a guarded result-URL fallback by @jackwener in https://github.com/jackwener/OpenCLI/pull/2777\n* fix(daemon): agree on one loopback address across daemon, CLI and extension (#2690) by @jackwener in https://github.com/jackwener/OpenCLI/pull/2782\n* fix(daemon): only replace a daemon older than the CLI (#2761) by @jackwener in https://github.com/jackwener/OpenCLI/pull/2783\n* fix(reddit): classify Reddit's network-security block across all read commands; keep partial read on denied expansion by @jackwener in https://github.com/jackwener/OpenCLI/pull/2784\n* fix(output): escape CSV and Markdown column headers by @gavenren in https://github.com/jackwener/OpenCLI/pull/2743\n* fix(download): honor yt-dlp failure exit status by @gavenren in https://github.com/jackwener/OpenCLI/pull/2744\n* fix(download): preserve literal article code blocks by @gavenren in https://github.com/jackwener/OpenCLI/pull/2745\n* fix(pipeline): append query parameters before URL fragments by @gavenren in https://github.com/jackwener/OpenCLI/pull/2738\n* fix(pipeline): preserve pipes inside JavaScript expressions by @gavenren in https://github.com/jackwener/OpenCLI/pull/2742\n* fix(download): isolate concurrent transfer temporary files by @gavenren in https://github.com/jackwener/OpenCLI/pull/2741\n* feat(auth): suggest the site login command on not_logged_in rows by @gaurav0107 in https://github.com/jackwener/OpenCLI/pull/2775\n* feat(clis): add pinduoduo search adapter by @Ghost-Sam1222 in https://github.com/jackwener/OpenCLI/pull/2752\n* fix(linkedin): escape Rest.li reserved characters in job search values by @vshalpnjabi in https://github.com/jackwener/OpenCLI/pull/2769\n* fix(linkedin): recognise SDUi activity cards in posts (#2651) by @jackwener in https://github.com/jackwener/OpenCLI/pull/2778\n* docs: explain cleanup for legacy sitemap skill copies by @deosiree in https://github.com/jackwener/OpenCLI/pull/2764\n* fix(plugin): safely replace stale host junctions on Windows (#2711) by @jackwener in https://github.com/jackwener/OpenCLI/pull/2780\n* fix(facebook): poll search results and recover rejected navigation (#2650) by @LeoLin990405 in https://github.com/jackwener/OpenCLI/pull/2693\n* fix(twitter): resolve the logged-in account from the twid cookie instead of sidebar testids (#2770) by @jackwener in https://github.com/jackwener/OpenCLI/pull/2781\n* feat(twitter): add list-members to enumerate a list's member accounts (#2776) by @jackwener in https://github.com/jackwener/OpenCLI/pull/2785\n* fix(twitter): add replies/retweets to search results; flag partial list pages outside JSON by @simon1uo in https://github.com/jackwener/OpenCLI/pull/2766\n* fix(youtube): trust page login state for whoami by @wmgylc in https://github.com/jackwener/OpenCLI/pull/2759\n* fix(gemini): read turns from conversation containers without height filtering by @Q-My99 in https://github.com/jackwener/OpenCLI/pull/2749\n* fix(grok): resolve session via /api/auth/session and strip chrome nodes from message text by @Q-My99 in https://github.com/jackwener/OpenCLI/pull/2748\n* fix(browser): send code, keyCode and keypress text with native key presses by @gaurav0107 in https://github.com/jackwener/OpenCLI/pull/2756\n* fix(jd): fail typed when search redirects to login instead of returning empty results by @gaurav0107 in https://github.com/jackwener/OpenCLI/pull/2754\n* chore(release): prepare 2.0.3 with extension 1.0.27 by @jackwener in https://github.com/jackwener/OpenCLI/pull/2793\n\n## New Contributors\n* @wangning19940904 made their first contribution in https://github.com/jackwener/OpenCLI/pull/2703\n* @StrivingLee made their first contribution in https://github.com/jackwener/OpenCLI/pull/2706\n* @Enesuygurs made their first contribution in https://github.com/jackwener/OpenCLI/pull/2696\n* @nengqi made their first contribution in https://github.com/jackwener/OpenCLI/pull/2700\n* @gavenren made their first contribution in https://github.com/jackwener/OpenCLI/pull/2743\n* @gaurav0107 made their first contribution in https://github.com/jackwener/OpenCLI/pull/2775\n* @Ghost-Sam1222 made their first contribution in https://github.com/jackwener/OpenCLI/pull/2752\n* @vshalpnjabi made their first contribution in https://github.com/jackwener/OpenCLI/pull/2769\n* @deosiree made their first contribution in https://github.com/jackwener/OpenCLI/pull/2764\n* @simon1uo made their first contribution in https://github.com/jackwener/OpenCLI/pull/2766\n* @wmgylc made their first contribution in https://github.com/jackwener/OpenCLI/pull/2759\n* @Q-My99 made their first contribution in https://github.com/jackwener/OpenCLI/pull/2749\n\n**Full Changelog**: https://github.com/jackwener/OpenCLI/compare/v2.0.2...v2.0.3\n","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":15}
