cess; the extension ZIP is also attached to this release.\n\n**Full Changelog**: https://github.com/jackwener/OpenCLI/compare/v2.0.0...v2.0.1\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
