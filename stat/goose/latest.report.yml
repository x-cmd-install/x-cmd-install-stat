-","name":"goose_linux_arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":39714976,"digest":"sha256:3968855c11b4093af271c5226909789ea294468f6e50203d738b7504995b6247","download_count":1058,"created_at":"2026-09-02T08:34:06Z","updated_at":"2026-09-02T08:34:08Z"},{"id":540871035,"node_id":"RA_kwDOAyHt9s4gPQl7","name":"goose_linux_x86_64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":42090656,"digest":"sha256:ab073515b78ef345f64f018c0d79aa7db50106806efc686dda7181253765ae13","download_count":16338,"created_at":"2026-09-02T08:34:06Z","updated_at":"2026-09-02T08:34:08Z"},{"id":540871075,"node_id":"RA_kwDOAyHt9s4gPQmj","name":"goose_windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":35961856,"digest":"sha256:8ef2f1525a51504a43e3b9fb2701ac50be32b3e150e97096b4393b370f7051f4","download_count":55,"created_at":"2026-09-02T08:34:08Z","updated_at":"2026-09-02T08:34:10Z"},{"id":540871039,"node_id":"RA_kwDOAyHt9s4gPQl_","name":"goose_windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":42570752,"digest":"sha256:c8d66777b66638cc215abe92db305cc5ba41539cd57aa36c99deac7f52730666","download_count":58,"created_at":"2026-09-02T08:34:06Z","updated_at":"2026-09-02T08:34:08Z"}],"body":"### Added\n- CLI: `azuresql` driver for Azure SQL with Microsoft Entra ID (Azure AD) authentication via\n  `fedauth` connection string parameters, e.g.\n  `goose azuresql \"sqlserver://host?database=mydb&fedauth=ActiveDirectoryDefault\" status`.\n  Excluded when building with the `no_mssql` or `no_azuresql` tags (#1109)\n- MySQL/MariaDB table-based `Locker` via `lock.NewMySQLTableLocker`, the MySQL counterpart to the\n  Postgres table locker from #993, accepting the same `TableLockerOption` set (#1075)\n### Changed\n- **Minimum Go version is now 1.26**\n- ClickHouse: new `goose_db_version` tables are created with `ORDER BY (version_id)` instead of\n  `ORDER BY (date)`. Existing tables are unchanged (#1085)\n- MySQL/TiDB: the `tstamp` column is now `DATETIME` instead of `TIMESTAMP`, which is capped at\n  2038-01-19 (#1053). Only newly created tables are affected; existing tables can be updated with:\n  ```sql\n  ALTER TABLE goose_db_version MODIFY tstamp datetime NULL DEFAULT CURRENT_TIMESTAMP;\n  ```\n- Various dependency upgrades\n### Fixed\n- `goose create` returns a clear \"file exists\" error, including the path, instead of `%!w(<nil>)`\n  when the migration file already exists (#1104)\n\n","reactions":{"total_count":4,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0}}
