dmin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":462982392,"digest":"sha256:56bd391519143efcaa371202b4b42ad577d4fbdc5c3759c873e0d9cff74c34e4","download_count":49,"created_at":"2026-10-31T02:43:09Z","updated_at":"2026-10-31T02:43:25Z"}],"body":"## What's New in v0.5.1\n\nThree weeks of fixes for the desktop app: the AI works on the page you are viewing, a style button sits next to the selection, PDF export keeps the crop size on Windows, every answer shows its tokens and time, and models can think or not by a switch. It also brings the security updates of Electron 42.\n\n### New Features\n\n- **Style button next to the selection**: a brush button next to the selected shapes opens draw.io's format panel, for changing colors, lines and text by hand. With the chat panel hidden, a sparkle button next to it opens the panel to ask the AI (#1039)\n- **Tokens, time and estimated cost under each answer**: hover the numbers for the details, such as how much input was read from the cache (#1016), and an estimated cost priced from models.dev (#762 by @Zhangxiaoyi688)\n- **Thinking switch**: models whose API can turn thinking on or off get a switch in the model settings (#911 by @lq-kiren)\n- **Named styles**: the model defines a style once and draws with it by name, instead of repeating the same style string on every shape (#969)\n- **Models that cannot read images are marked** in the settings, with a warning when an image is attached to one (#1018)\n- **MCP server card on the start screen**, with a short video, and a docs button (#990, #991, #1010)\n\n### Improvements\n\n- **The AI reads and draws the page you are viewing** in a multi-page diagram, instead of always the first page (#974)\n- **The canvas goes with a message only when the model needs it**: earlier messages stay unchanged, so prompt caching works, and hand edits made between answers are no longer turned back (#1024)\n- **Saved prompts fill the message box** instead of sending at once, so they can be changed first (#1036)\n- **Pictures in the diagram reach the model as short references** instead of thousands of characters of image data (#1007)\n- **Time so far while a model draws without streaming** (#1011)\n- **Fixes from a user simulation**: the \"changed by AI\" outline fades after a few seconds, Enter sends, saved diagrams are one click away, PNG export is 2x on white with a margin, and each edit's reply says what changed (#996)\n- **New app icon** (#985)\n- **MiniMax**: current text models suggested (#1026 by @octo-patch)\n\n### Bug Fixes\n\n- **PDF export on the desktop**: Export in the PDF dialog saves the PDF directly with the diagram's own page size, so Crop no longer adds large margins and wide diagrams are no longer turned 90 degrees on Windows (#1038)\n- **Shapes stay on their layer** when the AI edits a page whose other layer comes first in the file (#1037)\n- **Custom data on shapes** is kept on their `<object>` wrapper (#1017)\n- **Retries, stops and cut-off answers**: a retry after a tool error sends the current canvas, Stop also ends the screenshot check and the connection test, and an answer that ran out of output tokens before drawing says so with a Retry button (#987)\n- **The daily limit message** no longer crashes the page (#1006)\n\n### Security\n\n- **Credentials**: the Test and model list endpoints refuse credentials that are not text (#1021)\n- **Dependencies**: Electron 42 (#1029, after Electron 41.10.7 in #973), `@modelcontextprotocol/sdk` 1.32.0 (#1028), `@opennextjs/cloudflare` 1.20.2 (#1000), `proxy-addr`, `shell-quote` and `wrangler` (#971)\n\n### MCP Server (0.4.1 to 0.4.7)\n\n- **The preview is the web app's canvas**: version cards, compare and restore, and `get_selection` for \"this box\" (#984)\n- **Saved sessions**, `restore_version` and the history on disk (#981); a screenshot attached to `create_new_diagram` and `edit_diagram` results on request (#983)\n- **`load_diagram`** opens `.drawio.svg` files (#982) and accepts inline `xml` (#946 by @caoxiaole07); a summary of the user's hand changes, an XML reference by topic and preview options (#982); drawing guide hints and your own drawing rules (#980)\n- **Install**: one-click install for VS Code and Cursor, and a Gemini CLI extension (#1015); the Windows preview opens without PowerShell (#1002); fixes from the user simulation (#997)\n\n### Developer Experience\n\n- The provider layer keeps one record per provider (#988); dead code, guards that cannot fire and tests that cannot fail are removed (#986, #1012)\n- CI reminds and closes issues waiting for the reporter (#977); Docker build and deploy runs queue per branch (#1023), can be rerun by hand (#992), and build arm64 on a native ARM runner instead of QEMU (#1040); the demo runs on ECS behind a Cloudflare Tunnel (#1009)\n- Biome 2.5.15 (#931); a steadier deselect step in the e2e tests (#975)\n\n### Documentation\n\n- A landing page, an MCP server page and docs in four languages (#1008, #1010, #1014, #1022), a gallery of 23 diagrams with their prompts (#1013), and search fixes (#1003, #1020, #1031)\n- MCP README with the promo video and a comparison of draw.io MCP servers (#989, #1001, #978); the old Vercel demo redirects to the new one (#995)\n\n### Contributors\n\n- @DayuanJiang\n- @caoxiaole07\n- @lq-kiren\n- @octo-patch\n- @Zhangxiaoyi688\n\n### Downloads\n\n| Platform | File | Notes |\n|----------|------|-------|\n| macOS (Intel) | [Next-AI-Draw.io-0.5.1.dmg](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/Next-AI-Draw.io-0.5.1.dmg) | |\n| macOS (Apple Silicon) | [Next-AI-Draw.io-0.5.1-arm64.dmg](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/Next-AI-Draw.io-0.5.1-arm64.dmg) | |\n| Windows (Installer) | [Next.AI.Draw.io.Setup.0.5.1.exe](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/Next.AI.Draw.io.Setup.0.5.1.exe) | Recommended. Installs to Program Files |\n| Windows (Portable) | [Next.AI.Draw.io.0.5.1.exe](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/Next.AI.Draw.io.0.5.1.exe) | No installation needed, just run |\n| Linux (AppImage) | [Next-AI-Draw.io-0.5.1.AppImage](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/Next-AI-Draw.io-0.5.1.AppImage) | |\n| Linux (deb) | [next-ai-draw-io_0.5.1_amd64.deb](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/next-ai-draw-io_0.5.1_amd64.deb) | |\n| Linux (rpm) | [next-ai-draw-io-0.5.1.x86_64.rpm](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/next-ai-draw-io-0.5.1.x86_64.rpm) | |\n| Linux ARM64 (AppImage) | [Next-AI-Draw.io-0.5.1-arm64.AppImage](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/Next-AI-Draw.io-0.5.1-arm64.AppImage) | |\n| Linux ARM64 (deb) | [next-ai-draw-io_0.5.1_arm64.deb](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/next-ai-draw-io_0.5.1_arm64.deb) | |\n| Linux ARM64 (rpm) | [next-ai-draw-io-0.5.1.aarch64.rpm](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.5.1/next-ai-draw-io-0.5.1.aarch64.rpm) | |\n\n> ⚠️ **Note**: The app is not code-signed on macOS. You may see security warnings:\n> - **macOS**: \"App is damaged\": right-click the app, choose Open, then Open again, or run: `sudo xattr -rd com.apple.quarantine \"/Applications/Next AI Draw.io.app\"`\n> - **Windows**: Code-signed with SignPath\n\n---\n\n**Full Changelog**: https://github.com/DayuanJiang/next-ai-draw-io/compare/v0.5.0...v0.5.1\n","mentions_count":5}
