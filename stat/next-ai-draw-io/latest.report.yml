vatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":497093928,"digest":"sha256:f12a048f8f77051a45a7ada25901cb9c4b369a9da53feb3e1e8efbce6d84a1db","download_count":15237,"created_at":"2026-05-21T00:46:13Z","updated_at":"2026-05-21T00:46:33Z"}],"body":"## What's New in v0.4.16\n\n### Bug Fixes\n\n- **Electron Window Close**: Override draw.io iframe `beforeunload` so the window can be closed after editing a diagram on macOS/Windows (fixes #815) (#840)\n- **Kimi Reasoning Models**: Use `createDeepSeek` for the Kimi provider so `reasoning_content` round-trips correctly in multi-turn conversations (fixes #824) (#825)\n- **Access Code Config**: Always re-fetch access code config when the settings dialog opens, so the input field shows up after server-side `ACCESS_CODE_LIST` changes (fixes #811) (#816)\n- **Model Config Sidebar**: Add `min-h-0` to the AI Model Configuration sidebar so the \"Add model\" button stays reachable when many models are added (fixes #576) (#818)\n\n### Improvements\n\n- **All Draw.io Themes**: Replace the theme toggle in the settings panel with a dropdown exposing all 6 draw.io themes \u2014 kennedy, atlas, dark, min, sketch, simple (closes #499) (#835)\n\n### Developer Experience\n\n- **Dead Code Cleanup**: Remove renderer-side workarounds and IDB recovery code left over from earlier #815 fix attempts now that #840 is the real fix (#841)\n- **E2E Test Fix**: Resolve iframe toolbar strict-mode violation in the `can interact with draw.io toolbar` test (#837)\n- **Biome Schema Alignment**: Bump `biome.json` `$schema` to `2.4.14` so the repo matches the version installed by the Auto Format workflow (#832)\n- **Dependency Updates**: Security update for `next` to v16.2.6 (#842), security update for `electron` to v39.8.5 (#789), security update for `@xmldom/xmldom` to v0.9.10 (#821), core framework packages major update (#724), and other minor/patch dependency updates (#829)\n\n### Contributors\n\n- @DayuanJiang\n- @LaaraibAhmed\n- @octo-patch\n- @ruguoba\n\n### Downloads\n\n| Platform | File | Notes |\n|----------|------|-------|\n| macOS (Intel) | [Next-AI-Draw.io-0.4.16.dmg](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/Next-AI-Draw.io-0.4.16.dmg) | |\n| macOS (Apple Silicon) | [Next-AI-Draw.io-0.4.16-arm64.dmg](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/Next-AI-Draw.io-0.4.16-arm64.dmg) | |\n| Windows (Installer) | [Next.AI.Draw.io.Setup.0.4.16.exe](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/Next.AI.Draw.io.Setup.0.4.16.exe) | Recommended - installs to Program Files, auto-updates |\n| Windows (Portable) | [Next.AI.Draw.io.0.4.16.exe](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/Next.AI.Draw.io.0.4.16.exe) | No installation needed, just run |\n| Linux (AppImage) | [Next-AI-Draw.io-0.4.16.AppImage](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/Next-AI-Draw.io-0.4.16.AppImage) | |\n| Linux (deb) | [next-ai-draw-io_0.4.16_amd64.deb](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/next-ai-draw-io_0.4.16_amd64.deb) | |\n| Linux (rpm) | [next-ai-draw-io-0.4.16.x86_64.rpm](https://github.com/DayuanJiang/next-ai-draw-io/releases/download/v0.4.16/next-ai-draw-io-0.4.16.x86_64.rpm) | |\n\n> \u26a0\ufe0f **Note**: The app is not code-signed on macOS. You may see security warnings:\n> - **macOS**: \"App is damaged\" \u2192 Right-click the app \u2192 Open \u2192 Open, or run: `sudo xattr -rd com.apple.quarantine \"/Applications/Next AI Draw.io.app\"`\n> - **Windows**: Now code-signed with SignPath!\n\n---\n\n**Full Changelog**: https://github.com/DayuanJiang/next-ai-draw-io/compare/v0.4.15...v0.4.16\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":4}
