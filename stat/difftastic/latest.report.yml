ff4","download_count":166,"created_at":"2026-10-29T21:11:30Z","updated_at":"2026-10-29T21:11:30Z"}],"body":"Difftastic is a structural diff tool that understands syntax. See [the manual](https://difftastic.wilfred.me.uk/introduction.html) to get started, and [the changelog](https://github.com/Wilfred/difftastic/blob/master/CHANGELOG.md) for historical changes.\r\n\r\n### Diffing\r\n\r\nImproved preprocessing heuristics, so difftastic should be faster and fall back to text diffing less often.\r\n\r\n### Parsing\r\n\r\nUpdated Haskell (the previous version was prone to crashing) and Kotlin parsers.\r\n\r\nImproved delimiter and trailing punctuation handling in: C, C++, C#, Elixir, Erlang, Gleam, Go, Java, JavaScript, Kotlin, Haskell, Nix, OCaml, Python, TypeScript and YAML.\r\n\r\nRemoved Smali support (upstream parser is no longer maintained).\r\n\r\nRemoved support for Verilog and F# due to the very large parser size making the difft binary big. Adding support for dynamically loading parsers in a future release should allow users to parse these languages again.\r\n\r\n### Display\r\n\r\nFixed an issue with inline display where unchanged lines between two nearby changes were not shown.\r\n\r\nFixed an issue (introduced in 0.71) where the terminal width wasn't detected when stdin, stdout and stderr were all redirected. This was most noticeable when using difft with jj.","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":0,"eyes":0}}
