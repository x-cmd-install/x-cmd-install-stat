":"2026-08-07T21:05:27Z","updated_at":"2026-08-07T21:05:27Z"}],"body":"Difftastic is a structural diff tool that understands syntax. See [the manual](https://difftastic.wilfred.me.uk/introduction.html) to get started, and [the changelog](https://github.com/Wilfred/difftastic/blob/master/CHANGELOG.md) for historical changes.\r\n\r\n### Diffing\r\n\r\nImproved diffing performance, particularly when diffing directories.\r\n\r\n### Parsing\r\n\r\nFiles with parse errors now report the position of the first error, to help investigate issues.\r\n\r\nAdded support for Dockerfiles and Fish shell.\r\n\r\nImproved support for Dart, Emacs Lisp, Erlang, Java, OCaml, PHP, Protocol Buffers and TOML.\r\n\r\nRemoved support for Elvish and SCSS (upstream parsers are no longer maintained).\r\n\r\n### Display\r\n\r\nFixed an issue where files with tabs were not always aligned correctly in some build configurations.\r\n\r\nFix an alignment issue with line numbers in side-by-side mode.\r\n\r\n### Release\r\n\r\nFixed an issue where prebuilt binaries on GitHub did not respect Cargo.lock, so they used newer library versions than tested on CI. This caused rendering bugs in source code with tabs.","reactions":{"total_count":8,"+1":4,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":3,"rocket":0,"eyes":0}}
