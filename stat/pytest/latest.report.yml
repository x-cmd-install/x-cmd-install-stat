.parametrize</span> to fail with \"duplicate parametrization of '\\<fixture name\\>'\".\n- [\\#14606](https://github.com/pytest-dev/pytest/issues/14606): Fixed `list-item` typing errors from mypy in `@pytest.mark.parametrize <pytest.mark.parametrize ref>` `argvalues` parameter.\n- [\\#14608](https://github.com/pytest-dev/pytest/issues/14608): Fixed a regression in pytest 9.1.0 where `conftest.py` files located in `<invocation dir>/test*` were no longer loaded as initial conftests when invoked without arguments.\n  This could cause certain hooks (like `pytest_addoption`) in these files to not fire.\n","reactions":{"total_count":7,"+1":4,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":2,"eyes":0}}
