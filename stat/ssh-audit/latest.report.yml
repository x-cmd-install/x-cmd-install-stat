":2982011,"node_id":"MDQ6VXNlcjI5ODIwMTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":9711069,"digest":"sha256:8fbacc731e8e3dc850204e8eefa909baed219bc3f90b83905c8421ca3ad25177","download_count":551,"created_at":"2026-07-04T21:32:23Z","updated_at":"2026-07-04T21:32:24Z"},{"id":466626921,"node_id":"RA_kwDOBjS5VM4b0Clp","name":"ssh-audit.exe.sig","label":null,"uploader":{"login":"jtesta","id":2982011,"node_id":"MDQ6VXNlcjI5ODIwMTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":119,"digest":"sha256:6f5f9df164df354ab854760e977d663dddb7e8358e88da77def83566cbaab95c","download_count":14,"created_at":"2026-07-04T21:32:24Z","updated_at":"2026-07-04T21:32:24Z"},{"id":466628801,"node_id":"RA_kwDOBjS5VM4b0DDB","name":"v3.9.0.tar.gz","label":null,"uploader":{"login":"jtesta","id":2982011,"node_id":"MDQ6VXNlcjI5ODIwMTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":182593,"digest":"sha256:618ec29801c3abefcef8bb8177f918dcba6b3542f0803ce510cd13bfcd13815d","download_count":368,"created_at":"2026-07-04T21:35:55Z","updated_at":"2026-07-04T21:35:55Z"},{"id":466628290,"node_id":"RA_kwDOBjS5VM4b0C7C","name":"v3.9.0.tar.gz.sig","label":null,"uploader":{"login":"jtesta","id":2982011,"node_id":"MDQ6VXNlcjI5ODIwMTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":119,"digest":"sha256:557b6e7fd3723a1594a216820be3dca1548c41cf6951f8d6c057f38afeaa0052","download_count":70,"created_at":"2026-07-04T21:35:18Z","updated_at":"2026-07-04T21:35:18Z"}],"body":"The highlights of this release are:\r\n* Warnings will be issued on key exchanges that are not post-quantum safe.\r\n* Hardening guides are now included for all supported platforms (see `--list-hardening-guides`).\r\n* UNIX sockets can be used as scan targets (specified with `unix:///path/to/socket`); useful in containerized environments such as CI/CD pipelines.\r\n* Scanning through SOCKS5 proxies can now be done (with `--socks5`).\r\n* A variety of new post-quantum algorithms can now be identified.\r\n\r\nBIG THANKS to [realmiwi](https://github.com/realmiwi) for being the project's *very first sponsor!!*\r\n\r\nThe full release notes are:\r\n - Added support for Python 3.14.\r\n - Dropped support for Python 3.8, as it reached end-of-life in October 2024.\r\n - Dropped support for Python 3.9, as it reached end-of-life in October 2025.\r\n - Added warning to all key exchanges that do not include protections against quantum attacks due to the Harvest Now, Decrypt Later strategy (see https://en.wikipedia.org/wiki/Harvest_now,_decrypt_later).\r\n - Removed SSHv1 support (rationale is documented in: https://github.com/jtesta/ssh-audit/issues/298).\r\n - Added hardening guides (see `--list-hardening-guides` and `--get-hardening-guide`).  Previously, they were only available at <https://ssh-audit.com/hardening_guides.html>, but now they are built-in for convenience; partial credit [oam7575](https://github.com/oam7575).\r\n - Added `allow_hostkey_subset_and_reordering` policy option to allow targets to have a more stringent list of host keys and/or a different ordering of them.\r\n - Migrated from deprecated `getopt` module to `argparse`; partial credit [oam7575](https://github.com/oam7575).\r\n - When running against multiple hosts, now prints each target host regardless of output level.\r\n - Batch mode (`-b`) no longer automatically enables verbose mode, due to sometimes confusing results; users can still explicitly enable verbose mode using the `-v` flag.\r\n - Added UNIX server socket scanning (specify the target with `unix:///path/to/socket`).\r\n - Added SOCKS5 proxy support (specify the proxy with `--socks5 host:port`); partial credit [Micha\u0142 Majchrowicz](https://github.com/sectroyer).\r\n - Updated built-in policy for Debian 12.\r\n - Added built-in policies for OpenSSH 10.0, 10.1, 10.2, 10.3, and 10.4.\r\n - Added hardening guides and policies for Debian 13.\r\n - Added hardening guides and policies for Rocky Linux 10.\r\n - Added hardening guides and policies for Ubuntu 26.04.\r\n - Added 2 new key exchanges: `mlkem768nistp256-sha256`, `mlkem1024nistp384-sha384`.\r\n - Added 11 new host keys: `webauthn-sk-ecdsa-sha2-nistp256-cert-v01@openssh.com`, `mldsa-44`, `ssh-mldsa44-ed25519@openssh.com`, `mldsa-65`, `mldsa-87`, `ssh-mldsa-44`, `ssh-mldsa-65`, `ssh-mldsa-87`, `ssh-mldsa44`, `ssh-mldsa65`, `ssh-mldsa87`.\r\n - Added 2 new ciphers: `AEAD_CAMELLIA_128_GCM`, `AEAD_CAMELLIA_256_GCM`.\r\n","reactions":{"total_count":16,"+1":4,"-1":0,"laugh":0,"hooray":8,"confused":0,"heart":3,"rocket":1,"eyes":0}}
