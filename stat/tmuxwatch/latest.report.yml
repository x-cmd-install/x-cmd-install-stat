y captures, and recognize subsequent output as activity. Thanks @SebTardif.\n\n### Changed\n- Use patched Go 1.27.4 for source builds and Go 1.26.11 for macOS 12-compatible releases; update pflag to 1.1.0.\n\n","mentions_count":1}
