erseedr_v1.0.14_amd64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr_v1.0.14_amd64.deb)\r\n* **Linux Debian (arm64):** [superseedr_v1.0.14_arm64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr_v1.0.14_arm64.deb)\r\n* **Linux Tarball (amd64):** [superseedr_v1.0.14_linux-amd64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr_v1.0.14_linux-amd64.tar.gz)\r\n* **Linux Tarball (arm64):** [superseedr_v1.0.14_linux-arm64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr_v1.0.14_linux-arm64.tar.gz)\r\n* **Windows (EXE, no admin):** [superseedr-v1.0.14-x64-setup.exe](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-v1.0.14-x64-setup.exe)\r\n* **Windows (MSI):** [superseedr_v1.0.14_x64_en-US.msi](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr_v1.0.14_x64_en-US.msi)\r\n---\r\n## Private Builds (Advanced)\r\nThese builds do not contain PEX or DHT in the final binary. Not recommended for normal users unless you have privacy requirements.\r\n\r\n* **macOS Universal:** [superseedr-v1.0.14-private-universal-macos.pkg](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-v1.0.14-private-universal-macos.pkg)\r\n* **Linux Debian (amd64):** [superseedr-private_v1.0.14_amd64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-private_v1.0.14_amd64.deb)\r\n* **Linux Debian (arm64):** [superseedr-private_v1.0.14_arm64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-private_v1.0.14_arm64.deb)\r\n* **Linux Tarball (amd64):** [superseedr-private_v1.0.14_linux-amd64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-private_v1.0.14_linux-amd64.tar.gz)\r\n* **Linux Tarball (arm64):** [superseedr-private_v1.0.14_linux-arm64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-private_v1.0.14_linux-arm64.tar.gz)\r\n* **Windows (EXE, no admin):** [superseedr-private-v1.0.14-x64-setup.exe](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-private-v1.0.14-x64-setup.exe)\r\n* **Windows (MSI):** [superseedr-private_v1.0.14_x64_en-US.msi](https://github.com/Jagalite/superseedr/releases/download/v1.0.14/superseedr-private_v1.0.14_x64_en-US.msi)\r\n---\r\n\r\n<img width=\"589\" height=\"846\" alt=\"Screenshot 2026-08-29 at 7 42 23\u202fPM\" src=\"https://github.com/user-attachments/assets/3d474844-05ad-4dd3-bd6b-cc26a90a209d\" />\r\n\r\n\r\n## Release v1.0.14\r\n### \ud83d\ude80 New Features\r\n- **Native Network Binding**: Added host-scoped interface and exact-address binding for Superseedr-owned peer, DHT, tracker, web-seed, RSS, update, and DNS traffic, with fail-closed generation invalidation, live recovery, TUI controls, runtime status visibility, and platform-specific validation gates.\r\n- **Component Visualization Picker**: Added a focused visualization workspace for cycling persistent Peer Stream, Disk Health, and DHT renderers while retaining the classic views as defaults. Keybind [v]\r\n\r\n### \u2728 Improvements\r\n- **Current-Directory Shared Config Discovery**: Launching Superseedr from an existing shared root or its `superseedr-config` directory now selects that cluster automatically without requiring an environment variable or persisted launcher setting.\r\n- **Network Binding Visibility and Control**: Added interface discovery, host-scoped configuration, CLI overrides, bound-DNS policy, activation warnings, event-journal transitions, and detailed JSON status for active or blocked network generations.\r\n- **Visualization Readability and Motion**: Refined component-specific animation timing, legends, terminal-aware layouts, semantic centers, focus navigation, and configuration persistence across the Peer Stream, Disk Health, and DHT galleries.\r\n- **Dependency and Development Maintenance**: Updated current dependencies and added a repeatable Debian development-box bootstrap with the repository toolchain and integration-test environment.\r\n\r\n### \ud83d\udc1b Bug Fixes\r\n- **Network Generation Safety**: Hardened rebinding, recovery, address-family selection, DNS validation, listener and UDP lifecycle handling, queued peer permits, tracker and web-seed routing, and Windows interface support so stale generations cannot continue owned network work.\r\n- **Visualization Selection Compatibility**: Preserved valid renderer selections across restarts, mapped retired visualization names to supported fallbacks, and fixed Disk Health and DHT animation behavior without changing the classic renderer timing.\r\n- **Shared Config Selection Stability**: Frozen the initial current-directory shared-config decision for the process lifetime and aligned focus and animation visibility after automatic discovery.","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
