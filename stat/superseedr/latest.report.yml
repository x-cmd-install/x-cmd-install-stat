tate":"uploaded","size":11337660,"digest":"sha256:980b4641681d36387b4d1020e65836fb2454caaba4d4f830156eb8058dd5a790","download_count":1,"created_at":"2026-09-22T23:12:23Z","updated_at":"2026-09-22T23:12:24Z"},{"id":582445765,"node_id":"RA_kwDOQFBSu84it2rF","name":"superseedr_v1.0.15_linux-amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10672009,"digest":"sha256:5793f32f2510849bfab5f257bf6b0f985d85a09ee47df95fd29eb7d186043bfd","download_count":11,"created_at":"2026-09-22T23:12:23Z","updated_at":"2026-09-22T23:12:24Z"},{"id":582445766,"node_id":"RA_kwDOQFBSu84it2rG","name":"superseedr_v1.0.15_linux-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9994964,"digest":"sha256:7bf2167c517b866b0017c2129f3cb2365e6e444e3ca426de33cacc20e9eeb703","download_count":1,"created_at":"2026-09-22T23:12:23Z","updated_at":"2026-09-22T23:12:24Z"},{"id":582445771,"node_id":"RA_kwDOQFBSu84it2rL","name":"superseedr_v1.0.15_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":11644928,"digest":"sha256:19f1b30b1845b88dd48106e78a2ee8b090050610b3f46839bcedf59b8eefb88d","download_count":9,"created_at":"2026-09-22T23:12:23Z","updated_at":"2026-09-22T23:12:24Z"}],"body":"## Standard Builds (Recommended)\r\n* **macOS Universal:** [superseedr-v1.0.15-universal-macos.pkg](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-v1.0.15-universal-macos.pkg)\r\n* **Linux Debian (amd64):** [superseedr_v1.0.15_amd64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr_v1.0.15_amd64.deb)\r\n* **Linux Debian (arm64):** [superseedr_v1.0.15_arm64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr_v1.0.15_arm64.deb)\r\n* **Linux Tarball (amd64):** [superseedr_v1.0.15_linux-amd64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr_v1.0.15_linux-amd64.tar.gz)\r\n* **Linux Tarball (arm64):** [superseedr_v1.0.15_linux-arm64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr_v1.0.15_linux-arm64.tar.gz)\r\n* **Windows (EXE, no admin):** [superseedr-v1.0.15-x64-setup.exe](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-v1.0.15-x64-setup.exe)\r\n* **Windows (MSI):** [superseedr_v1.0.15_x64_en-US.msi](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr_v1.0.15_x64_en-US.msi)\r\n---\r\n## Private Builds (Advanced)\r\nThese builds do not contain PEX or DHT in the final binary. Not recommended for normal users unless you have privacy requirements.\r\n\r\n* **macOS Universal:** [superseedr-v1.0.15-private-universal-macos.pkg](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-v1.0.15-private-universal-macos.pkg)\r\n* **Linux Debian (amd64):** [superseedr-private_v1.0.15_amd64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-private_v1.0.15_amd64.deb)\r\n* **Linux Debian (arm64):** [superseedr-private_v1.0.15_arm64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-private_v1.0.15_arm64.deb)\r\n* **Linux Tarball (amd64):** [superseedr-private_v1.0.15_linux-amd64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-private_v1.0.15_linux-amd64.tar.gz)\r\n* **Linux Tarball (arm64):** [superseedr-private_v1.0.15_linux-arm64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-private_v1.0.15_linux-arm64.tar.gz)\r\n* **Windows (EXE, no admin):** [superseedr-private-v1.0.15-x64-setup.exe](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-private-v1.0.15-x64-setup.exe)\r\n* **Windows (MSI):** [superseedr-private_v1.0.15_x64_en-US.msi](https://github.com/Jagalite/superseedr/releases/download/v1.0.15/superseedr-private_v1.0.15_x64_en-US.msi)\r\n---\r\n\r\nhttps://github.com/user-attachments/assets/89881b84-7a6c-4a8c-8525-2a38ee6d7afb\r\n\r\n\r\n## Release v1.0.15 - New Web [Demo](https://web.superseedr.com/)\r\n### \ud83d\ude80 New Features\r\n- **Native WebTorrent**: Enabled WebRTC peers and WebSocket trackers in default native builds, alongside TCP and uTP. Native network-binding, private-client, and torrent eligibility policies gate WebRTC activation.\r\n- **Browser Client**: Added a separate browser client using the production torrent engine, WebRTC transfers, an IndexedDB catalog, and OPFS payload storage. Verified files can be saved individually or together through folder and ZIP exports while retained browser data remains available for seeding.\r\n- **Interactive Terminal Demo**: Added a browser-hosted terminal demo with simulated torrent activity, separate from the real-transfer browser client.\r\n- **Show Theme and Traffic History**: Added synchronized animated scenes, automatic traffic-burst framing, and peer activity history charts.\r\n\r\n### \u2728 Improvements\r\n- **Dashboard and Navigation**: Preserved equal dashboard bands across terminal sizes, adapted statistics to available height, reorganized Help, and retained the selected torrent row during sorting.\r\n- **Shared Engine and Telemetry**: Consolidated native/browser application boundaries, portable payload storage, and manager telemetry while avoiding browser-only file-progress scans in native metrics.\r\n- **Connectivity Validation**: Extended synthetic workloads with idle sessions, connection churn, mixed transports, deliberate handshake failures, and optional WebRTC diagnostics.\r\n\r\n### \ud83d\udc1b Bug Fixes\r\n- **Transfer Backpressure and Cancellation**: Retained queued peer commands and requests under manager/writer pressure, honored cancellation, preserved pending announcements, and kept temporary storage admission pressure from being treated as missing data.\r\n- **Queued Request Reliability**: Removed the 10-second timeout that could silently discard block requests waiting for capacity when peers responded slowly. Requests now remain queued until they can be sent, are canceled, or the connection shuts down.\r\n- **Slow Peer Tolerance**: Increased the no-data timeout for peers with outstanding requests from 20 to 30 seconds, reducing premature disconnections during temporary stalls.\r\n- **Browser Recovery and Removal**: Hardened catalog persistence, payload ownership, initialization retry, RTC bridge replacement, and removal during shutdown. Failed cleanup remains recoverable across reloads.\r\n- **Browser Pause Persistence**: Prevented stale manager metrics from overwriting accepted pause/resume commands and persisting the wrong state for the next launch.\r\n- **Seeding Negotiation**: Allowed newly connected peers time to express interest before cleaning up mutually uninterested sessions.\r\n- **Automatic Graph Recovery**: Corrected burst framing and restored automatic sorting after temporary user interaction.\r\n- **Dependency Compatibility**: Updated the native lockfile from the yanked `chacha20 0.10.0` to `0.10.2`, which fixes the RNG's SSE2 backend compatibility on older x86 processors.\r\n- **Browser Build Output**: Honor custom Cargo target directories when generating the terminal demo so builds cannot silently package stale Wasm output.\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
