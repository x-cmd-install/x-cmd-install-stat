,"state":"uploaded","size":11519330,"digest":"sha256:ab1374bf371be60d9561976c8921dbca19d176589584be0c3108dc6dc72918b3","download_count":4,"created_at":"2026-10-17T23:41:52Z","updated_at":"2026-10-17T23:41:53Z"},{"id":651909463,"node_id":"RA_kwDOQFBSu84m21lX","name":"superseedr_v1.0.16_linux-amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10852977,"digest":"sha256:2fa56eb4cb361e16d86e7588923914616924811c0514d884a1c06ffe76f8d7fc","download_count":16,"created_at":"2026-10-17T23:41:52Z","updated_at":"2026-10-17T23:41:53Z"},{"id":651909462,"node_id":"RA_kwDOQFBSu84m21lW","name":"superseedr_v1.0.16_linux-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10149832,"digest":"sha256:fd18dafe7206a1bc61f37754fb7fe3b3d8bdeaf5f2bb88289227c85444d814bd","download_count":3,"created_at":"2026-10-17T23:41:52Z","updated_at":"2026-10-17T23:41:53Z"},{"id":651909470,"node_id":"RA_kwDOQFBSu84m21le","name":"superseedr_v1.0.16_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":11837440,"digest":"sha256:179ebfa3837813205bba6f9edd5a2affcecdbb6d634f7359660f36fc176b3b40","download_count":8,"created_at":"2026-10-17T23:41:52Z","updated_at":"2026-10-17T23:41:53Z"}],"body":"## Standard Builds (Recommended)\r\n* **macOS Universal:** [superseedr-v1.0.16-universal-macos.pkg](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-v1.0.16-universal-macos.pkg)\r\n* **Linux Debian (amd64):** [superseedr_v1.0.16_amd64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr_v1.0.16_amd64.deb)\r\n* **Linux Debian (arm64):** [superseedr_v1.0.16_arm64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr_v1.0.16_arm64.deb)\r\n* **Linux Tarball (amd64):** [superseedr_v1.0.16_linux-amd64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr_v1.0.16_linux-amd64.tar.gz)\r\n* **Linux Tarball (arm64):** [superseedr_v1.0.16_linux-arm64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr_v1.0.16_linux-arm64.tar.gz)\r\n* **Windows (EXE, no admin):** [superseedr-v1.0.16-x64-setup.exe](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-v1.0.16-x64-setup.exe)\r\n* **Windows (MSI):** [superseedr_v1.0.16_x64_en-US.msi](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr_v1.0.16_x64_en-US.msi)\r\n---\r\n## Private Builds (Advanced)\r\nThese builds do not contain PEX or DHT in the final binary. Not recommended for normal users unless you have privacy requirements.\r\n\r\n* **macOS Universal:** [superseedr-v1.0.16-private-universal-macos.pkg](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-v1.0.16-private-universal-macos.pkg)\r\n* **Linux Debian (amd64):** [superseedr-private_v1.0.16_amd64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-private_v1.0.16_amd64.deb)\r\n* **Linux Debian (arm64):** [superseedr-private_v1.0.16_arm64.deb](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-private_v1.0.16_arm64.deb)\r\n* **Linux Tarball (amd64):** [superseedr-private_v1.0.16_linux-amd64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-private_v1.0.16_linux-amd64.tar.gz)\r\n* **Linux Tarball (arm64):** [superseedr-private_v1.0.16_linux-arm64.tar.gz](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-private_v1.0.16_linux-arm64.tar.gz)\r\n* **Windows (EXE, no admin):** [superseedr-private-v1.0.16-x64-setup.exe](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-private-v1.0.16-x64-setup.exe)\r\n* **Windows (MSI):** [superseedr-private_v1.0.16_x64_en-US.msi](https://github.com/Jagalite/superseedr/releases/download/v1.0.16/superseedr-private_v1.0.16_x64_en-US.msi)\r\n---\r\n<img width=\"1578\" height=\"874\" alt=\"image\" src=\"https://github.com/user-attachments/assets/6d5be939-1015-4c83-9303-7619f191d816\" />\r\n\r\n## Release v1.0.16\r\n### 🚀 New Features\r\n- **Per-Torrent Download Diagnostics**: Native downloads now record bounded diagnostics for metadata acquisition, peer activity, and suspected stalls. Debug detail is enabled by default while downloading; collection stops when paused or complete. Use `trace-torrent <info-hash>` for a temporary detailed capture, or configure diagnostics globally and per torrent.\r\n- **Optional XDG Directories**: Added `--xdg-dirs` and `SUPERSEEDR_XDG_DIRS=true` to separate configuration, saved torrent data, and runtime state. First use imports existing settings, torrent metadata, saved torrent files, default watch queues, and launcher identity while retaining the originals. Shared catalogs and payload locations stay on their existing paths. See the [XDG directory guide](https://github.com/Jagalite/superseedr/wiki/XDG-Directories) for setup and migration details.\r\n\r\n### ✨ Improvements\r\n- **Compact Torrent File Lists**: Cap the normal file panel at five rows, prioritize recently active files in larger lists, and summarize hidden files so the swarm chart retains space.\r\n- **Adaptive Swarm Symbols**: Swarm availability uses braille below three actively transferring peers and shaded blocks at three or more, with the original lavender palette and dimmed empty cells.\r\n- **RAM Graph in MB**: Show process memory usage in MB with an automatic vertical scale. Older percentage-based RAM history resets while other activity history is preserved.\r\n- **Smaller Retained History**: Reduce spare activity-history capacity, create sparse native history checkpoints before cloning, and store peer client labels compactly while preserving history retention and peer-protection evidence.\r\n- **Peer Memory Cleanup**: Release unused uTP closing buffers and bound abandoned FIN acknowledgements after queued payloads have been acknowledged. Periodically reclaim spare peer-table capacity and expire stale history while torrents remain unpaused, preserving active-peer evidence and the existing history retention window.\r\n- **Download Scheduling**: Reduced redundant piece scans and rarity calculations, including skipping new-candidate scans when pending requests have already filled the pipeline. Piece priorities and rarest-first selection are preserved.\r\n- **Smaller Download and Seeding State**: Packed block-completion flags into one bit per block instead of one byte, reducing flag storage by roughly 87.5% while preserving completion, verification, and re-download behavior.\r\n- **Lower Per-Torrent Memory Overhead**: Torrent managers retain only the network settings they need instead of full catalog snapshots. Disconnect, failure, and file-activity buffers now allocate on first use.\r\n- **Cheaper Idle Updates**: Unchanged metrics are compared without copying peer snapshots, and global peer-management views are built only while that workspace is open. Peer protection and history continue updating in the background.\r\n- **Diagnostic Controls and Status**: Added live diagnostic policy updates, temporary Trace captures of up to one hour, and status fields for collection state, log paths, and dropped or suppressed records. Logs rotate at 2 MiB per segment with three segments per torrent and a 128 MiB host-wide budget.\r\n\r\n### 🐛 Bug Fixes\r\n- **File Priority Persistence**: Prevented stale native manager metrics from overwriting newly selected file priorities and saving the old priorities during shutdown.\r\n- **Magnet Startup Memory Use**: Skip piece-rarity calculations until the torrent's piece count is known, avoiding repeated counter allocations from oversized early peer bitfields. Early availability information is retained for use after metadata arrives.\r\n- **XDG State Migration**: First-use standalone imports now preserve peer restrictions, RSS state, and persisted histories in the XDG state directory. Original files remain intact, and conflicting destination files stop migration before settings are published.\r\n\r\n### Upgrade Notes\r\n- Existing platform directories remain the default. XDG users must select the same layout for the running client and CLI commands; desktop and protocol-handler launches need the option in their launch environment too. Stop the old client before switching layouts.\r\n"}
