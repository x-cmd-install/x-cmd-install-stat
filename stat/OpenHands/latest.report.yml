ated_at":"2026-11-24T09:18:09Z","updated_at":"2026-11-24T09:18:14Z"},{"id":786482959,"node_id":"RA_kwDOLfkiw84u4McP","name":"OpenHands.Agent.Canvas-1.45.0.AppImage","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.appimage","state":"uploaded","size":200550258,"digest":"sha256:0f546613342aaf18db213065207cb234cc1672278993e3b0e01a99c17ad3f3f6","download_count":26,"created_at":"2026-11-24T09:18:01Z","updated_at":"2026-11-24T09:18:10Z"}],"body":"## 1.45.0 (2026-11-24)\n\n<!-- Release notes generated using configuration in .github/release.yml at main -->\n\n## What's Changed\n### Features\n* feat(factories): show a factory's worklogs, newest first by @jpshackelford in https://github.com/OpenHands/OpenHands/pull/19811\n* feat(factories): delete a factory from its page by @jpshackelford in https://github.com/OpenHands/OpenHands/pull/19861\n* feat(projects): OpenHands Projects in Canvas (experimental) by @enyst in https://github.com/OpenHands/OpenHands/pull/19495\n* feat(projects): project conversations in the sidebar, files and PRs beside the chat by @enyst in https://github.com/OpenHands/OpenHands/pull/19810\n* feat(frontend): nest sub-agent conversations under their parent by @neubig in https://github.com/OpenHands/OpenHands/pull/20010\n### Bug Fixes\n* fix(automations): wrap the setup draft bar at phone width instead of squeezing its title by @enyst in https://github.com/OpenHands/OpenHands/pull/19558\n* fix(automations): keep the setup page's repository menu on screen at phone widths by @enyst in https://github.com/OpenHands/OpenHands/pull/19479\n* fix(api): resolve chat upload destination within conversation workspace by @lx3133584 in https://github.com/OpenHands/OpenHands/pull/18429\n* fix(settings): keep a typed custom classifier in the Model Router editor by @enyst in https://github.com/OpenHands/OpenHands/pull/19716\n* fix(files): refresh tree after terminal file changes by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19992\n* fix(root): sequence first-run telemetry before onboarding by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19978\n* fix(settings): label agent profile comboboxes by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19996\n* fix(sidebar): keep the conversation preview on screen in the phone drawer by @enyst in https://github.com/OpenHands/OpenHands/pull/19150\n* fix(a11y): home composer textbox semantics by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19976\n* fix: keep selected Usage tab visible on phone by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19995\n* fix: make workspace picker add action keyboard accessible by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19998\n* fix(command-menu): hide desktop sidebar toggle on mobile by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19991\n* fix: clarify voice input autosave settings by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19994\n* fix(conversation): cancel inline rename on Escape by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19997\n* fix(sidebar): trap mobile drawer focus by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19999\n* fix(chat): close the agent profile and model pill popovers on Escape by @enyst in https://github.com/OpenHands/OpenHands/pull/18812\n### Documentation\n* docs(verify-openhands): smoke every app in the extensions catalog by @enyst in https://github.com/OpenHands/OpenHands/pull/19049\n* docs(verify): include user hooks in the conversation feature map by @enyst in https://github.com/OpenHands/OpenHands/pull/19726\n* docs(verify-openhands): map maintenance 2026-11-23 by @enyst in https://github.com/OpenHands/OpenHands/pull/20007\n### Maintenance\n* refactor(ui): name the existing Canvas version feedback styles by @enyst in https://github.com/OpenHands/OpenHands/pull/19722\n* refactor(ui): name the shared onboarding slide height by @enyst in https://github.com/OpenHands/OpenHands/pull/19725\n* test(verify): OpenHands Projects verification map and tooling by @enyst in https://github.com/OpenHands/OpenHands/pull/19496\n\n\n**Full Changelog**: https://github.com/OpenHands/OpenHands/compare/v1.44.0...v1.45.0\n\n---\nThis PR was generated with [Release Please](https://github.com/googleapis/release-please). See [documentation](https://github.com/googleapis/release-please#release-please).\n<!-- AGENT_CANVAS_DOCKER_START -->\n\n<!-- macos-install-note -->\n### macOS install note\n\nThe app isn't signed with an Apple Developer ID yet, so macOS may call a\ndownloaded build *\"damaged\"* — it's Gatekeeper quarantine, not a bad file.\nAfter moving the app to Applications, clear the flag once, then open normally:\n\n```sh\nxattr -dr com.apple.quarantine \"/Applications/OpenHands Agent Canvas.app\"\n```\n\nSigning + notarization is tracked in OpenHands/OpenHands#16774.\n","mentions_count":5}
