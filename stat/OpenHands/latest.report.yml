ed_at":"2026-11-16T20:49:25Z","updated_at":"2026-11-16T20:49:29Z"},{"id":756398137,"node_id":"RA_kwDOLfkiw84tFbg5","name":"OpenHands.Agent.Canvas-1.41.0.AppImage","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.appimage","state":"uploaded","size":200369876,"digest":"sha256:8a4478ca4479c3c7c20519921bb816056c77730dcbe440a1d087319ac087883a","download_count":10,"created_at":"2026-11-16T20:49:51Z","updated_at":"2026-11-16T20:50:00Z"}],"body":"## 1.41.0 (2026-11-16)\n\n<!-- Release notes generated using configuration in .github/release.yml at main -->\n\n## What's Changed\n### Features\n* feat(verify-openhands): scenarios beyond the happy path, `map controls`, `browser timezone` by @enyst in https://github.com/OpenHands/OpenHands/pull/19670\n* feat(acp): choose the reasoning effort from what the agent reports by @simonrosenberg in https://github.com/OpenHands/OpenHands/pull/19436\n* feat(hooks): name the workspace and user hooks files in the Available Hooks dialog by @enyst in https://github.com/OpenHands/OpenHands/pull/18366\n* feat(analytics): instrument automation setup funnel dead ends by @neubig in https://github.com/OpenHands/OpenHands/pull/19394\n* feat: reuse profile secret consent for automatic managed App enablement by @neubig in https://github.com/OpenHands/OpenHands/pull/18572\n* feat(automations): group the dashboard list by tag by @hieptl in https://github.com/OpenHands/OpenHands/pull/19745\n* feat(automations): open assisted templates in the setup view and add the CVE Remediation Factory icon by @dylan-openhands in https://github.com/OpenHands/OpenHands/pull/19700\n### Bug Fixes\n* fix(theme): make catalog removal and restriction feedback readable by @enyst in https://github.com/OpenHands/OpenHands/pull/19485\n* fix(conversations): delete all pages with one captured backend scope by @enyst in https://github.com/OpenHands/OpenHands/pull/18367\n* fix(theme): keep confirmation modal descriptions readable by @enyst in https://github.com/OpenHands/OpenHands/pull/18540\n* fix: generate UUIDs without crypto.randomUUID on plain-HTTP non-loopback origins by @neubig in https://github.com/OpenHands/OpenHands/pull/19732\n* fix(mcp): send the browser's backend URL as the MCP OAuth callback base by @neubig in https://github.com/OpenHands/OpenHands/pull/19744\n* fix(agent-profiles): sync agent_settings.agent_kind with the active profile on cloud by @suzhiguo7 in https://github.com/OpenHands/OpenHands/pull/18913\n* fix(automations): retain mobile setup drafts across view switches by @stefanielizeth73-art in https://github.com/OpenHands/OpenHands/pull/19386\n* fix(modals): let an open combobox listbox take Escape before the dialog closes by @SaltGardenia in https://github.com/OpenHands/OpenHands/pull/19688\n* fix: keep mobile conversation navigation visible by @niebloomj in https://github.com/OpenHands/OpenHands/pull/19711\n* fix: allow secure replacement of requested secrets by @neubig in https://github.com/OpenHands/OpenHands/pull/19062\n* fix(acp): refresh login status on focus and remount by @DevinVinson in https://github.com/OpenHands/OpenHands/pull/19729\n* fix(canvas): advance Debian snapshot to 20261114 for linux-libc-dev security fixes by @openhands-agent in https://github.com/OpenHands/OpenHands/pull/19786\n### Documentation\n* docs(verify-openhands): map maintenance 2026-11-11 by @enyst in https://github.com/OpenHands/OpenHands/pull/19653\n* docs(verify-openhands): map maintenance 2026-11-13 by @enyst in https://github.com/OpenHands/OpenHands/pull/19715\n* docs(verify-openhands): map maintenance 2026-11-14 by @enyst in https://github.com/OpenHands/OpenHands/pull/19750\n* docs(helm): fix stale session-api-key.txt path in NOTES (#17092) by @TINGyu123644 in https://github.com/OpenHands/OpenHands/pull/18922\n### Maintenance\n* chore(deps): bump lucide-react from 1.68.0 to 1.69.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19709\n* chore(deps): bump the tanstack group with 2 updates by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19703\n* chore(deps-dev): bump electron from 45.2.2 to 45.2.3 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19707\n* chore(deps): bump framer-motion from 14.9.0 to 14.9.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19708\n* chore(deps-dev): bump eslint from 9.39.5 to 10.14.0 in the eslint group across 1 directory by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19507\n* chore(deps): bump the i18next group across 1 directory with 2 updates by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19704\n* chore(deps): bump posthog-js from 1.446.0 to 1.447.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19706\n* chore(deps-dev): bump the testing group with 2 updates by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19705\n* chore(canvas): update Debian snapshot to 20261108T000000Z by @all-hands-bot in https://github.com/OpenHands/OpenHands/pull/18968\n* chore(deps): bump @microlink/react-json-view from 1.31.46 to 1.31.48 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19739\n* chore(deps): bump framer-motion from 14.9.1 to 14.10.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19740\n* chore(deps): bump posthog-js from 1.447.1 to 1.447.3 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19738\n* chore(deps): bump vite from 8.3.5 to 8.3.6 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19736\n* chore(deps): bump zustand from 5.0.16 to 5.1.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19737\n* chore(deps): bump the tanstack group with 2 updates by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19733\n* chore(deps-dev): bump msw from 3.0.3 to 3.0.4 in