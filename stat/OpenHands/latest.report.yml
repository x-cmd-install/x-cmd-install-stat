ated_at":"2026-11-23T15:34:53Z","updated_at":"2026-11-23T15:34:58Z"},{"id":783484611,"node_id":"RA_kwDOLfkiw84uswbD","name":"OpenHands.Agent.Canvas-1.44.0.AppImage","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.appimage","state":"uploaded","size":200484471,"digest":"sha256:ba79bd27e5cd5bdba0d4ff82a72d1bca4e9301786da4b31f96dc04f0d1bdb767","download_count":20,"created_at":"2026-11-23T15:33:43Z","updated_at":"2026-11-23T15:33:52Z"}],"body":"## 1.44.0 (2026-11-23)\n\n<!-- Release notes generated using configuration in .github/release.yml at main -->\n\n## What's Changed\n### Features\n* feat(chat): conversation mentions, behind the conversation_mentions flag by @enyst in https://github.com/OpenHands/OpenHands/pull/19921\n* feat(automations): choose who can see an automation (OHE-4206) by @hieptl in https://github.com/OpenHands/OpenHands/pull/19893\n* feat(chat): show a readable error when a budget is reached by @hieptl in https://github.com/OpenHands/OpenHands/pull/19926\n* feat: View and edit an automation's key-value store by @tofarr in https://github.com/OpenHands/OpenHands/pull/19907\n* feat(factories): add Factories sidebar entry with list and drill-in views by @jpshackelford in https://github.com/OpenHands/OpenHands/pull/19800\n### Bug Fixes\n* fix(chat): drop a Home message's pending bubble once history has moved past it (OHE-4121) by @hieptl in https://github.com/OpenHands/OpenHands/pull/19875\n* fix(settings): make SettingsDropdownInput clearable by default by @SaltGardenia in https://github.com/OpenHands/OpenHands/pull/19664\n* fix(conversation-overview): count diff stats from the longest common subsequence by @LeizhenZhang in https://github.com/OpenHands/OpenHands/pull/19580\n### Documentation\n* docs(verify-openhands): list Projects as pending in Not mapped by @enyst in https://github.com/OpenHands/OpenHands/pull/19892\n* docs(verify-openhands): map maintenance 2026-11-20 by @enyst in https://github.com/OpenHands/OpenHands/pull/19894\n* docs(verify-openhands): list Factories as not mapped by @jpshackelford in https://github.com/OpenHands/OpenHands/pull/19897\n* docs(verify-openhands): map maintenance 2026-11-21 by @enyst in https://github.com/OpenHands/OpenHands/pull/19941\n* docs(verify-openhands): map Factories as F31 by @jpshackelford in https://github.com/OpenHands/OpenHands/pull/19899\n### Maintenance\n* chore(deps-dev): bump electron from 45.3.0 to 45.3.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19887\n* chore(deps): bump driver.js from 1.12.0 to 1.12.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19886\n* chore(deps): bump posthog-js from 1.447.12 to 1.447.15 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19889\n* chore(deps): bump ws from 8.22.2 to 8.23.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19885\n* chore(compat): require agent-server 1.63.1 by @enyst in https://github.com/OpenHands/OpenHands/pull/19923\n* chore(deps): bump driver.js from 1.12.1 to 1.14.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19920\n* chore(deps-dev): bump electron from 45.3.1 to 45.3.2 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19919\n* chore(deps): bump posthog-js from 1.447.15 to 1.449.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19917\n* chore(deps-dev): bump eslint from 10.14.0 to 10.15.0 in the eslint group by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19916\n* chore(deps-dev): bump the testing group with 2 updates by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19915\n* chore(deps): bump framer-motion from 14.12.0 to 14.14.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19918\n* chore(deps): bump posthog-js from 1.449.1 to 1.449.2 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19947\n* chore(deps): bump lucide-react from 1.72.0 to 1.73.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19946\n* chore(ci): defer the human note until a PR is ready for review by @malhotra5 in https://github.com/OpenHands/OpenHands/pull/19972\n* chore(deps-dev): bump lint-staged from 17.6.0 to 17.6.1 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19982\n* chore(deps): bump i18next from 27.1.1 to 27.1.2 in the i18next group by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19979\n* chore(deps): bump posthog-js from 1.449.2 to 1.450.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19981\n* chore(deps-dev): bump the testing group across 1 directory with 2 updates by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/20008\n* chore: bump agent-server to 1.63.1, automation to 1.35.0, extensions to 0.43.0 by @openhands-release-bot[bot] in https://github.com/OpenHands/OpenHands/pull/20012\n\n\n**Full Changelog**: https://github.com/OpenHands/OpenHands/compare/v1.43.0...v1.44.0\n\n---\nThis PR was generated with [Release Please](https://github.com/googleapis/release-please). See [documentation](https://github.com/googleapis/release-please#release-please).\n<!-- AGENT_CANVAS_DOCKER_START -->\n\n<!-- macos-install-note -->\n### macOS install note\n\nThe app isn't signed with an Apple Developer ID yet, so macOS may call a\ndownloaded build *\"damaged\"* — it's Gatekeeper quarantine, not a bad file.\nAfter moving the app to Applications, clear the flag once, then open normally:\n\n```sh\nxattr -dr com.apple.quarantine \"/Applications/OpenHands Agent Canvas.app\"\n```\n\nSigning + notarization is tracked in OpenHands/OpenHands#16774.\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":8}
