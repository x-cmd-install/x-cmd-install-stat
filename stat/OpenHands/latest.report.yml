ated_at":"2026-11-20T18:55:47Z","updated_at":"2026-11-20T18:55:53Z"},{"id":772970050,"node_id":"RA_kwDOLfkiw84uEpZC","name":"OpenHands.Agent.Canvas-1.43.0.AppImage","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.appimage","state":"uploaded","size":200359907,"digest":"sha256:03573a7093adabf8f99d9c46bcfc38aaa9939ac87b38eb21a8949ac5ed9bf82d","download_count":41,"created_at":"2026-11-20T18:54:53Z","updated_at":"2026-11-20T18:54:58Z"}],"body":"## 1.43.0 (2026-11-20)\n\n<!-- Release notes generated using configuration in .github/release.yml at main -->\n\n## What's Changed\n### Features\n* feat(automations): create automations enabled from the setup wizard by @SaltGardenia in https://github.com/OpenHands/OpenHands/pull/19769\n* feat(settings): Features page for experimental user feature flags, with Conversation reactions by @enyst in https://github.com/OpenHands/OpenHands/pull/19503\n* feat(chat): render experimental decision cards by @enyst in https://github.com/OpenHands/OpenHands/pull/19789\n* feat(chat): show the agent's message edits (experimental) by @enyst in https://github.com/OpenHands/OpenHands/pull/19794\n* feat: Show a conversation indicator icon on automation run rows by @tofarr in https://github.com/OpenHands/OpenHands/pull/19903\n### Bug Fixes\n* fix(automations): keep the setup form when switching conversations by @ak684 in https://github.com/OpenHands/OpenHands/pull/19860\n* fix(settings): list Experimental last, after Secrets by @enyst in https://github.com/OpenHands/OpenHands/pull/19881\n### Performance\n* perf(chat): virtualize the conversation message list by @analisaperlengkapan in https://github.com/OpenHands/OpenHands/pull/17820\n### Documentation\n* docs(verify-openhands): list Settings → Experimental as pending in Not mapped by @enyst in https://github.com/OpenHands/OpenHands/pull/19854\n* docs(verify-openhands): map maintenance 2026-11-19 by @enyst in https://github.com/OpenHands/OpenHands/pull/19873\n* docs(verify-openhands): map Settings → Experimental and reactions as F30 by @enyst in https://github.com/OpenHands/OpenHands/pull/19882\n### Maintenance\n* chore(deps): bump driver.js from 1.11.0 to 1.12.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19869\n* chore(deps): bump vite from 8.3.7 to 8.3.8 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19867\n* chore(deps): bump posthog-js from 1.447.10 to 1.447.12 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19868\n* chore(deps): bump lucide-react from 1.71.0 to 1.72.0 by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19870\n* chore(deps-dev): bump prettier from 3.9.10 to 3.10.0 in the eslint group by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19866\n* chore(deps-dev): bump msw from 3.0.4 to 3.0.5 in the testing group by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19865\n* ci: open one bot PR for the agent-server, automation and extensions pins by @VascoSch92 in https://github.com/OpenHands/OpenHands/pull/19690\n* chore: bump agent-server to 1.62.0, automation to 1.33.0, extensions to 0.43.0 by @openhands-release-bot[bot] in https://github.com/OpenHands/OpenHands/pull/19876\n* chore: bump agent-server to 1.63.0, automation to 1.34.0, extensions to 0.43.0 by @openhands-release-bot[bot] in https://github.com/OpenHands/OpenHands/pull/19879\n* chore: bump agent-server to 1.63.1, automation to 1.34.1, extensions to 0.43.0 by @openhands-release-bot[bot] in https://github.com/OpenHands/OpenHands/pull/19895\n* ci: grant contents write to the release-ready job by @SaltGardenia in https://github.com/OpenHands/OpenHands/pull/19615\n* chore(deps-dev): bump prettier from 3.10.0 to 3.10.1 in the eslint group by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19884\n* chore(deps-dev): bump @testing-library/user-event from 14.6.9 to 14.6.10 in the testing group by @dependabot[bot] in https://github.com/OpenHands/OpenHands/pull/19883\n* test(e2e): align release harness with SDK 1.63.1 by @neubig in https://github.com/OpenHands/OpenHands/pull/19900\n* test(e2e): expand action groups before asserting live output by @neubig in https://github.com/OpenHands/OpenHands/pull/19906\n\n\n**Full Changelog**: https://github.com/OpenHands/OpenHands/compare/v1.42.0...v1.43.0\n\n---\nThis PR was generated with [Release Please](https://github.com/googleapis/release-please). See [documentation](https://github.com/googleapis/release-please#release-please).\n<!-- AGENT_CANVAS_DOCKER_START -->\n\n<!-- macos-install-note -->\n### macOS install note\n\nThe app isn't signed with an Apple Developer ID yet, so macOS may call a\ndownloaded build *\"damaged\"* — it's Gatekeeper quarantine, not a bad file.\nAfter moving the app to Applications, clear the flag once, then open normally:\n\n```sh\nxattr -dr com.apple.quarantine \"/Applications/OpenHands Agent Canvas.app\"\n```\n\nSigning + notarization is tracked in OpenHands/OpenHands#16774.\n","mentions_count":8}
