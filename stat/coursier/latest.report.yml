6-11-18T17:57:13Z"},{"id":764403812,"node_id":"RA_kwDOAjzyOc4tj-Bk","name":"cs-x86_64-pc-win32.zip","label":"","uploader":{"login":"alexarchambault","id":7063723,"node_id":"MDQ6VXNlcjcwNjM3MjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":32655292,"digest":"sha256:89b30670b87a2f592bfbc260e08ed5d232e77adb0b1e21d07728a6240403a5a0","download_count":2952,"created_at":"2026-11-18T17:57:13Z","updated_at":"2026-11-18T17:57:14Z"}],"body":"This release is mostly about security hardening. POM and Gradle module parsing, downloads and the cache, archive extraction, generated launchers and shell scripts, and the release pipeline were all reviewed. It also adds checksum-related features: JVM index v2 with archive checksums, optional SHA-256 validation in bootstrap launchers, and `COURSIER_CHECKSUMS`. It fixes a number of bugs, makes JAR generation about 2× faster, and moves the CLI to Scala 3.10.\r\n\r\n## Behaviour changes to be aware of\r\n\r\n- **Credentials are only sent over HTTPS by default.** Credentials can also be scoped to a scheme and a port now. If you relied on credentials being sent to a plain-HTTP repository, set `host` to `http://host:port`, or set `https-only` to `false` (more details [below](#downloads-cache-and-credentials)). ([#3926](https://github.com/coursier/coursier/pull/3926))\r\n- **Archive / JVM extraction is limited** to 8 GiB of extracted content and 1,000,000 entries by default. Change these limits with `COURSIER_ARCHIVE_MAX_SIZE` / `COURSIER_ARCHIVE_MAX_ENTRIES` (or the `coursier.archive.max-size` / `coursier.archive.max-entries` Java properties); `0` disables a limit. ([#3941](https://github.com/coursier/coursier/pull/3941))\r\n- **Files extracted from archives / JVMs get the process umask applied**, so they can no longer be group- or world-writable, even if the archive asks for it. ([#4041](https://github.com/coursier/coursier/pull/4041))\r\n- **`cs config` masks passwords** unless `--password` is passed. ([#3946](https://github.com/coursier/coursier/pull/3946))\r\n- **JVM management uses the per-platform JVM index v2 by default** and checks the checksums of downloaded JVM archives. ([#4026](https://github.com/coursier/coursier/pull/4026))\r\n- **Gradle `org.gradle.jvm.version` variant matching was reversed** and is now fixed. This can change which variant gets picked in Gradle module support. ([#4025](https://github.com/coursier/coursier/pull/4025))\r\n- **Having a proxy configured no longer unnecessarily enables Basic auth for HTTPS proxy tunnels JVM-wide.** Basic auth is only re-enabled when proxy credentials are configured. ([#3939](https://github.com/coursier/coursier/pull/3939))\r\n- **POMs with an external `DOCTYPE` now parse**, with the DTD ignored. Before, the JDK parser made them fail. ([#3945](https://github.com/coursier/coursier/pull/3945))\r\n\r\n## Security hardening\r\n\r\n### Dependency resolution\r\n\r\n- **Parent POM cycles are reported instead of hanging resolution** ([#3938](https://github.com/coursier/coursier/pull/3938)). A POM that is its own parent, or an `A → B → A` parent chain (including BOMs importing each other), could make resolution loop until the JVM ran out of memory, or stop after 100 iterations without saying why. Cycles are now reported as a new `coursier.error.ParentCycleError` (\"Cycle in parent POMs: …\") for the module concerned.\r\n- **POM property expansion is bounded in time, depth and size** ([#3954](https://github.com/coursier/coursier/pull/3954)). Properties referencing each other in a chain (`p1=${p0}${p0}`, `p2=${p1}${p1}`, …) could take exponential time and memory, and long reference chains could overflow the stack. Expansions are now memoized. References can nest at most 256 levels deep, and expanded values can be at most 2^20 characters long. Past these limits, the expression is left unsubstituted, as cyclic references already were.\r\n- **External DTDs and entities are never loaded when parsing POMs** ([#3945](https://github.com/coursier/coursier/pull/3945)). The JDK's own parser already refused to load them. But another JAXP implementation on the class path, like a Xerces in an sbt / Mill / IDE process embedding coursier, could fetch a DTD (SSRF) or expand local file entities (XXE). External DTD loading is now disabled whatever the JAXP implementation.\r\n- **Gradle module file URLs must stay within their repository** ([#3953](https://github.com/coursier/coursier/pull/3953)). File URLs in `.module` files are now taken as relative to the module file's directory, as Gradle does. URLs with a scheme or a host, absolute paths, and paths escaping the repository are rejected, so a module file can't point coursier at arbitrary hosts or local files.\r\n\r\n### Downloads, cache and credentials\r\n\r\n- **Credentials are matched by scheme and port, and are HTTPS-only by default** ([#3926](https://github.com/coursier/coursier/pull/3926)). The `host` of credentials can now be `repo.example.com:8443`, `https://repo.example.com` or `http://nexus.local:8081`. `https-only` now defaults to `true`. Before, it defaulted to `false`, so credentials could leak in clear text to a plain-HTTP redirect to the same host. To keep sending credentials to a plain-HTTP repository, either put its scheme and port in `host` (safer, but coursier 2.1.26 and older can't read such entries), or set `https-only` to `false`. With `COURSIER_HTTP_DEBUG=1`, credentials skipped for this reason are marked `(HTTPS only)`. See the [credentials documentation](https://get-coursier.io/docs/other-credentials) for details. This applies to the bootstrap launcher too.\r\n- **Basic auth is only allowed for proxy tunnels when proxy credentials are configured** ([#3939](https://github.com/coursier/coursier/pull/3939)). Configuring a proxy, for example in `~/.m2/settings.xml`, used to clear `jdk.http.auth.tunneling.disabledSchemes` for the whole JVM. That affected any app embedding coursier (sbt, Mill, IDEs). Now this only happens when a proxy user is set, and only `Basic` is removed from the JDK default list. A value you set yourself is still left alone.\r\n- **Temporary and lock files in the cache don't follow symlinks** ([#3942](https://github.com/coursier/coursier/pull/3942)). In a cache shared with another local user, that user could plant symlinks at the paths of `.part`, `.lock`, `.structure.lock`, `.error`, `.checked` or `.links` files. Coursier could then be made to create, truncate or write arbitrary files. These files are now opened with `NOFOLLOW_LINKS`, after removing any symlink found at their path. This also covers the bootstrap launcher.\r\n- **A full response is no longer appended to a partial download** ([#3943](https://github.com/coursier/coursier/pull/3943)). When resuming a download, a server ignoring `Range` and answering `200 OK` had its whole body appended to the existing `.part` file, which produced a corrupt artifact. A download is now only resumed on a `206` whose `Content-Range` matches. Any other success answer overwrites the `.part` file, and a `416` or a mismatched `206` restarts the download.\r\n- **New `COURSIER_CHECKSUMS` setting to pick checksum types and require checksums** ([#3944](https://github.com/coursier/coursier/pull/3944)). It takes a comma-separated list of checksum types, tried in order. Without a trailing `none`, a missing checksum is an error. For example, `COURSIER_CHECKSUMS=SHA-256,SHA-1` checks SHA-256 when available, SHA-1 otherwise, and fails when neither is there. The setting is also available as the `coursier.checksums` Java property, and is the default of `FileCache#checksums`. This PR also fixes some checksum type parsing issues.\r\n- **Cached \"not found\" markers of artifacts now expire** ([#4043](https://github.com/coursier/coursier/pull/4043)). For Maven artifacts whose POM is in cache (JARs, sources, javadoc…), the `.error` marker recorded after a 404 used to be permanent, even with the `Update` / `UpdateChanging` cache policies. A single transient or spoofed 404 could hide an artifact for good. These markers now follow the TTL like other cached errors.\r\n- **Gzip-encoded downloads are handled correctly when resuming or watching progress** ([#4030](https://github.com/coursier/coursier/pull/4030)). Encoded lengths are now ignored, and resumed downloads restart, so that the decoded content is written correctly.\r\n\r\n### Archive extraction\r\n\r\n- **Extraction limits** ([#3941](https://github.com/coursier/coursier/pull/3941)): zip, tar, tar.gz, tar.zst, gzip and xz archives fail with the new `UnArchiver.ExtractionLimitException` once their extracted size or entry count goes past the limits described above. Library users can pass explicit limits with `UnArchiver.default(maxSize, maxEntries)`. Temporary extraction directories are now also removed when an extraction fails. xz and tar.xz are covered by tests too ([#3968](https://github.com/coursier/coursier/pull/3968)).\r\n- The limits now also apply to:\r\n  - prebuilt launchers unarchived by `cs install`, whose partial files are now removed on failure ([#4028](https://github.com/coursier/coursier/pull/4028))\r\n  - privileged tar extraction (Docker layers extracted with `sudo tar`). Those tar streams are now decompressed and inspected in the JVM before being piped to `tar` ([#4029](https://github.com/coursier/coursier/pull/4029)). A follow-up fix handles a `tar` that exits successfully before reading all of its input, like bsdtar on macOS, which stops at the end-of-archive marker ([#4052](https://github.com/coursier/coursier/pull/4052))\r\n  - archives decompressed to check their integrity in the cache. These now fail early with an `ArtifactError`. Oversized zip symlink targets are also rejected before they're read into memory ([#4042](https://github.com/coursier/coursier/pull/4042))\r\n- **Symlinks pointing outside the archive cache are rejected** ([#3924](https://github.com/coursier/coursier/pull/3924)), and symlinks are cleaned up without being followed.\r\n- **Archive cache sub-paths are validated** ([#3922](https://github.com/coursier/coursier/pull/3922)). Paths after `!` in archive URLs, pointing at files or inner archives within an archive, can no longer be absolute or contain `.` / `..` segments.\r\n- **The process umask is applied to extracted files** ([#4041](https://github.com/coursier/coursier/pull/4041)). plexus-archiver used to apply the mode recorded in each archive entry as is. A JVM archive, say, could thus create a world-writable `bin/java` that other local users could replace. Entry modes are now masked with the process umask, which also works in native images, with a restrictive fallback when it can't be read. setuid, setgid and sticky bits are dropped.\r\n\r\n### Launchers, installed apps and shell scripts\r\n\r\n- **Optional SHA-256 validation in bootstrap launchers** ([#3960](https://github.com/coursier/coursier/pull/3960), [#3966](https://github.com/coursier/coursier/pull/3966)). Pass `--validate-checksums` to `cs bootstrap`, `cs install`, `cs update` or `cs setup`. The generated launchers then record the SHA-256 of each of their JARs, and check every JAR against it at start-up, whether it comes from the cache or was just downloaded. On a mismatch, they refuse to start, and a rejected download never reaches the cache. This protects against tampered downloads, like a compromised or plain-HTTP repository, and against a tampered cache. Launchers generated without this option, or by older versions, are unchanged. (`ClassPathEntry.Url` gets an optional `sha256` field, in a binary compatible way.)\r\n- **Values in generated launcher preambles are escaped** ([#3950](https://github.com/coursier/coursier/pull/3950)). Java options and environment values are now passed verbatim by the sh and bat preambles. On Windows, values that can't be escaped are rejected.\r\n- **Shell environment values are quoted safely** ([#3949](https://github.com/coursier/coursier/pull/3949)). `JAVA_HOME` comes from the top-level directory name of a downloaded JVM archive. That name was written with only its double quotes escaped to `~/.profile`, `~/.zprofile`, `~/.bash_profile` and fish config, and in the `cs java --env` / `cs install --env` output. A crafted name could thus run commands at every login. Values are now properly escaped for sh / bash / zsh, fish, bat and PowerShell. The output is unchanged for ordinary paths, so existing profile sections are still updated in place.\r\n- **`cs` is resolved to an absolute `PATH` entry in the bootstrap launcher** ([#3947](https://github.com/coursier/coursier/pull/3947)). Relative and empty `PATH` entries are ignored, so that the lookup never depends on the current directory.\r\n- **Invalid app names are rejected** by `cs install`, both on the command line and in app descriptors ([#3920](https://github.com/coursier/coursier/pull/3920)).\r\n- **`cs config` masks passwords** ([#3946](https://github.com/coursier/coursier/pull/3946)). `repositories.credentials` prints `configRepoN.password=****`, without resolving the password. `publish.credentials` prints `//user:****@host`. Values stored as `value:…` print `value:****`. References like `env:NAME`, `file:…` or `command:…` are still shown as is. Pass `--password` to show the actual values.\r\n- **File descriptors are no longer leaked to processes started with `exec`** ([#4048](https://github.com/coursier/coursier/pull/4048)). Descriptors that weren't explicitly marked as inherited are now closed when the current process is replaced, with platform-specific implementations for Linux and macOS.\r\n\r\n### Cache server and experimental Docker / VM features\r\n\r\n- **Cache server URL filtering is fixed** ([#3921](https://github.com/coursier/coursier/pull/3921)). `cs server --allow` / `--disallow` prefixes now match on path boundaries: `https://repo1.maven.org/maven2` no longer matches `https://repo1.maven.org/maven2-other/…`. End a prefix with `*` to get raw prefix matching. Schemes and hosts are compared ignoring case. URLs with `.` / `..` segments are rejected whenever a rule applies.\r\n- **Docker builds are hardened against unsafe sources and blobs** ([#3923](https://github.com/coursier/coursier/pull/3923)). `COPY` paths and downloaded layer digests are validated before use, including during privileged extraction.\r\n- **The VM SSH port forward is bound to the loopback interface** ([#3940](https://github.com/coursier/coursier/pull/3940)). The QEMU VM started by `cs docker` / `cs vm start` used to listen for SSH on all interfaces.\r\n\r\n### Native launchers\r\n\r\n- **Native launchers distrust the compromised eMudhra root certificates** ([#3981](https://github.com/coursier/coursier/pull/3981)). At first this used an embedded, pinned trust store. That workaround was removed ([#4023](https://github.com/coursier/coursier/pull/4023)) once the launchers were built with a GraalVM whose trust store already excludes these roots ([#4017](https://github.com/coursier/coursier/pull/4017)).\r\n\r\n### Release pipeline and supply chain\r\n\r\n- **Artifacts pushed to Maven Central get build provenance attestations**, generated with GitHub's `actions/attest-build-provenance`. Artifacts are staged first, so that the attested files are exactly the ones uploaded. ([#3957](https://github.com/coursier/coursier/pull/3957))\r\n- **CI token permissions are narrowed, and release secrets are gated behind a `release` environment.** Only the jobs that attest artifacts can mint OIDC tokens or write attestations. ([#3952](https://github.com/coursier/coursier/pull/3952))\r\n- **GitHub Actions are pinned to commit SHAs**, with the release in a trailing comment so Dependabot can still bump them. ([#3951](https://github.com/coursier/coursier/pull/3951))\r\n- **The GraalVM archives the native launchers are built with are pinned and verified.** ([#3948](https://github.com/coursier/coursier/pull/3948))\r\n- **Website builds are hardened against npm scripts and secrets.** They now run `npm ci --ignore-scripts`, publishing tokens are kept out of the environment of third-party build tools, and website building is separated from publishing. ([#3955](https://github.com/coursier/coursier/pull/3955))\r\n\r\n## New features and improvements\r\n\r\n- **JVM index v2 with archive checksums** ([#4026](https://github.com/coursier/coursier/pull/4026)). By default, coursier now uses the index of the current OS and CPU architecture from [coursier/jvm-index](https://github.com/coursier/jvm-index/tree/master/indices-v2), which has checksums for most JDKs. The strongest available checksum (SHA-512, SHA-256, SHA-1 or MD5) is checked before extracting an archive. On a mismatch, the archive is downloaded again once, and coursier fails if it still doesn't match. Verified digests are persisted in the cache, so they aren't computed again. The Maven Central index is read in v2 format from version `0.0.5` on.\r\n- **32-bit x86, ppc64le and s390x support in JVM management** ([#3897](https://github.com/coursier/coursier/pull/3897)). x86 architecture variants are recognized, with Liberica used for x86 JDKs. Errors for unsupported platforms are deferred until the index lookup.\r\n- **Shared dependencies in app version overrides** ([#3899](https://github.com/coursier/coursier/pull/3899)). Entries of an app descriptor's `versionOverrides` can now set `shared` too. The `shared` and `versionOverrides` fields are now documented.\r\n- **Repository errors are reported during Scala version resolution** ([#3927](https://github.com/coursier/coursier/pull/3927)). The CLI now tells unavailable repositories apart from missing dependencies.\r\n- **Clean errors and a real help message for `cs config`** ([#4049](https://github.com/coursier/coursier/pull/4049)). Errors that already had a clear message used to come with a Java stack trace: a config directory with group or others permissions, inline repository credentials, a malformed config file. They're now printed as a single `Error: …` line, with a hint where it helps (the `chmod 700 <dir>` command to run, or the config file to edit), and exit code 1. Unknown or missing keys point to `config --help`. `--unset` with values, which used to set them, is refused. A relative `--config-file` without a directory no longer crashes on save. `cs config --help` now has a usage line and a description, says where the config file lives (Scala CLI's file by default, `SCALA_CLI_CONFIG`, `--config-file`), and lists the available keys.\r\n- **Improved `exec` module** ([#4002](https://github.com/coursier/coursier/pull/4002)). `execve` and `chdir` are more portable, libc handling is shared between the JVM and GraalVM implementations, errno failures are reported in detail, and the module has Javadoc.\r\n- **The CLI is built with Scala 3.10** ([#3903](https://github.com/coursier/coursier/pull/3903), then 3.10.1 in [#4024](https://github.com/coursier/coursier/pull/4024)), **with Scala 3 bytecode optimizations enabled** ([#3918](https://github.com/coursier/coursier/pull/3918)). JDK and GraalVM classes are excluded from inlining.\r\n- **No more `sun.misc.Unsafe` warnings on recent JDKs.** These came from Scala lazy vals, and are now hidden in the JAR launchers ([#3961](https://github.com/coursier/coursier/pull/3961)) and in the native CLI runners ([#3998](https://github.com/coursier/coursier/pull/3998), fixes [#3997](https://github.com/coursier/coursier/issues/3997)).\r\n- `cs install` / `cs setup` only list every Scala version they find from `-v -v -v` on, instead of printing about 400 lines at `-v -v` ([#4011](https://github.com/coursier/coursier/pull/4011)).\r\n\r\n## Performance\r\n\r\n- **JAR generation is about 2× faster.** Launcher generators (assemblies, shaded assemblies, bootstraps, manifest JARs) now buffer their output. Before, `ZipOutputStream` issued a system call for almost every header byte. Benchmark: assembly 2387 ms → 1058 ms. By [@romanowski](https://github.com/romanowski) in [#3958](https://github.com/coursier/coursier/pull/3958), with a new JMH benchmark.\r\n- Larger buffers are used for compressed archive reads and writes ([#4022](https://github.com/coursier/coursier/pull/4022)).\r\n\r\n## Bug fixes\r\n\r\n- **Nonstandard `Last-Modified` time zones are handled** ([#3900](https://github.com/coursier/coursier/pull/3900), fixes [#1806](https://github.com/coursier/coursier/issues/1806)). UTC suffixes that `URLConnection` rejects are now parsed, which preserves remote timestamps and avoids redundant downloads.\r\n- **Gradle JVM version variant matching is fixed** ([#4025](https://github.com/coursier/coursier/pull/4025)). Variants requiring a JVM version lower than or equal to the requested one are now accepted. For example, a Java 11 variant can be used on Java 17, but a Java 21 variant can't.\r\n- **Integrity checks are now done by `Cache` rather than `ArchiveCache`** ([#3930](https://github.com/coursier/coursier/pull/3930)), so that they also apply when going through a remote cache.\r\n- **Interface fixes** ([#4015](https://github.com/coursier/coursier/pull/4015)):\r\n  - `Dependency.withOverrides` / `addOverride` of `coursierapi` had no effect: their overrides never reached resolution. They do now, and the dependencies of fetch results carry their overrides.\r\n  - Converting a dependency with a Gradle variant selector fails with an explicit error.\r\n- **Prebuilt launchers and shared class loaders** ([#4011](https://github.com/coursier/coursier/pull/4011)):\r\n  - `cs install` crashed with a `MatchError` on `xz+…` prebuilt launchers. They're now decompressed. `ar+…` ones fail with an explicit error.\r\n  - The artifacts of Gradle module variants could never end up in shared / parent class loaders in `cs bootstrap`, `cs launch` and `cs install`. They now can.\r\n- **Homebrew formula fixes:**\r\n  - The native `cs` launcher is made executable before generating completions. By [@sean0407](https://github.com/sean0407) in [#3902](https://github.com/coursier/coursier/pull/3902), fixes [#3896](https://github.com/coursier/coursier/issues/3896).\r\n  - The formula test uses a test-local archive cache, so that it passes in Homebrew's sandbox. By [@lucasbrixner](https://github.com/lucasbrixner) in [#3963](https://github.com/coursier/coursier/pull/3963).\r\n\r\n## Documentation\r\n\r\n- **The website moved to Docusaurus 3**, with a local search index computed at build time instead of the legacy Algolia DocSearch index ([#4051](https://github.com/coursier/coursier/pull/4051)).\r\n- Bootstrap launcher checksum validation is documented ([#3966](https://github.com/coursier/coursier/pull/3966)).\r\n- The outdated g8 channel template mention is removed ([#4027](https://github.com/coursier/coursier/pull/4027)).\r\n- Versioned docs are copied before building the website ([#3962](https://github.com/coursier/coursier/pull/3962)).\r\n\r\n## Build, CI and release process\r\n\r\n- **Selective testing on CI**: pull requests only run the tests affected by their changes ([#3864](https://github.com/coursier/coursier/pull/3864), [#3975](https://github.com/coursier/coursier/pull/3975)). Only changes relevant to a job invalidate its selection ([#4010](https://github.com/coursier/coursier/pull/4010)).\r\n- Tests that weren't running on CI now run there: `class-file-version-check` and the proxy integration tests (Nexus 2 / 3, authenticated proxies) ([#4005](https://github.com/coursier/coursier/pull/4005)).\r\n- CI stability: retries and timeouts were tweaked ([#3925](https://github.com/coursier/coursier/pull/3925)), main CI was fixed ([#3928](https://github.com/coursier/coursier/pull/3928)), previous runs on main are cancelled ([#3929](https://github.com/coursier/coursier/pull/3929)), and the linux-compat job runs on Ubuntu 24.04 to avoid QEMU crashes ([#3982](https://github.com/coursier/coursier/pull/3982)).\r\n- Lots of compiler, javac, native-image, mdoc and Mill warnings were addressed, and CI logs are less verbose ([#4011](https://github.com/coursier/coursier/pull/4011), [#4015](https://github.com/coursier/coursier/pull/4015)).\r\n- Homebrew: checks were added for the formula workflow ([#3956](https://github.com/coursier/coursier/pull/3956)), and formula updates are now handled from Mill ([#3992](https://github.com/coursier/coursier/pull/3992)).\r\n- On release, the Coursier version update of `coursier/cache-action` is triggered ([#4009](https://github.com/coursier/coursier/pull/4009)).\r\n- The Linux launchers are built with cs 2.1.26 ([#3894](https://github.com/coursier/coursier/pull/3894)), and `cs.sh` was updated to 2.1.26 ([#3893](https://github.com/coursier/coursier/pull/3893)).\r\n- Mill: downgraded to 1.3.0 ([#3901](https://github.com/coursier/coursier/pull/3901)), then updated to 1.3.1 ([#3987](https://github.com/coursier/coursier/pull/3987)). Its maximum heap is now 4 GB ([#3972](https://github.com/coursier/coursier/pull/3972)).\r\n- The upstream data-class Scala 3 compiler plugin replaces the vendored unroll plugin ([#3999](https://github.com/coursier/coursier/pull/3999)), and the Scala 3 modules build with the released data-class 0.3.1 instead of a snapshot ([#4050](https://github.com/coursier/coursier/pull/4050)).\r\n- Scala 3 tests are compiled with the latest Scala 3 ([#3959](https://github.com/coursier/coursier/pull/3959)).\r\n- Scala Steward no longer updates the `config_3` comments ([#4040](https://github.com/coursier/coursier/pull/4040)).\r\n\r\n## Dependency updates\r\n\r\n### Library dependencies\r\n\r\n- zstd-jni 1.5.7-16 → 1.5.7-28 ([#3871](https://github.com/coursier/coursier/pull/3871), [#3907](https://github.com/coursier/coursier/pull/3907), [#3932](https://github.com/coursier/coursier/pull/3932), [#3976](https://github.com/coursier/coursier/pull/3976), [#4016](https://github.com/coursier/coursier/pull/4016), [#4034](https://github.com/coursier/coursier/pull/4034)). Native images now register the zstd-jni foreign downcalls.\r\n- jsoniter-scala → 2.43.0 on the Scala 3 modules ([#3919](https://github.com/coursier/coursier/pull/3919), [#3933](https://github.com/coursier/coursier/pull/3933), [#3964](https://github.com/coursier/coursier/pull/3964), [#3977](https://github.com/coursier/coursier/pull/3977), [#3994](https://github.com/coursier/coursier/pull/3994), [#4014](https://github.com/coursier/coursier/pull/4014), [#4021](https://github.com/coursier/coursier/pull/4021))\r\n- plexus-archiver 4.14.0 → 4.16.0 ([#3936](https://github.com/coursier/coursier/pull/3936), [#4036](https://github.com/coursier/coursier/pull/4036)), plexus-utils 4.1.0 → 4.2.0 ([#4037](https://github.com/coursier/coursier/pull/4037))\r\n- maven-model → 3.10.1 ([#3913](https://github.com/coursier/coursier/pull/3913), [#4035](https://github.com/coursier/coursier/pull/4035))\r\n- case-app 2.1.0 → 2.2.0 ([#3905](https://github.com/coursier/coursier/pull/3905), [#4001](https://github.com/coursier/coursier/pull/4001)), with jsoup 1.24.1\r\n- sttp client → 4.1.3 ([#3989](https://github.com/coursier/coursier/pull/3989), [#4006](https://github.com/coursier/coursier/pull/4006), [#4038](https://github.com/coursier/coursier/pull/4038), [#4045](https://github.com/coursier/coursier/pull/4045))\r\n- coursier-dependency 0.3.4 and coursier-versions 0.7.0 ([#4007](https://github.com/coursier/coursier/pull/4007))\r\n- jni-utils 0.5.0 and native-terminal 0.1.0 ([#4008](https://github.com/coursier/coursier/pull/4008)), directories-jvm 0.5.0 / directories-jni 0.2.0 ([#4012](https://github.com/coursier/coursier/pull/4012))\r\n- scala-cli `config_3` 1.18.0 on the Scala 3 modules, while the Scala 2.13 modules stay on 1.17.1 to keep Java 8 class files ([#3917](https://github.com/coursier/coursier/pull/3917), [#4031](https://github.com/coursier/coursier/pull/4031))\r\n- asm 9.10.1 → 9.11.1 ([#3915](https://github.com/coursier/coursier/pull/3915), [#3935](https://github.com/coursier/coursier/pull/3935))\r\n- jsch 2.28.8 ([#3908](https://github.com/coursier/coursier/pull/3908))\r\n- os-lib 0.11.10 ([#3978](https://github.com/coursier/coursier/pull/3978))\r\n\r\n### Scala and tooling\r\n\r\n- Scala 3.3.9 for the published Scala 3 modules ([#3980](https://github.com/coursier/coursier/pull/3980)), and Scala 3.10.1 for the CLI ([#4024](https://github.com/coursier/coursier/pull/4024))\r\n- Scala.js 1.23.0 ([#4039](https://github.com/coursier/coursier/pull/4039)), scalajs-dom 2.8.1 ([#3991](https://github.com/coursier/coursier/pull/3991)), and scalajs-react 4.1.0, with the web app moved to React 19 ([#3906](https://github.com/coursier/coursier/pull/3906))\r\n- GraalVM: Native Image 25.0.4.1 ([#3988](https://github.com/coursier/coursier/pull/3988)), then Liberica NIK 25.0.5.0.3 ([#4017](https://github.com/coursier/coursier/pull/4017)); svm → 25.0.5.1 ([#3937](https://github.com/coursier/coursier/pull/3937), [#3965](https://github.com/coursier/coursier/pull/3965), [#3979](https://github.com/coursier/coursier/pull/3979), [#4047](https://github.com/coursier/coursier/pull/4047))\r\n- Scalafix 0.14.10 ([#4018](https://github.com/coursier/coursier/pull/4018))\r\n- scala-cli 1.19.0, used by the build and tests ([#4032](https://github.com/coursier/coursier/pull/4032))\r\n- Build dependencies ([#3989](https://github.com/coursier/coursier/pull/3989)) and miscellaneous ones, like sbt-coursier and scala-cli in tests, or http-server ([#3990](https://github.com/coursier/coursier/pull/3990))\r\n\r\n### Test and server dependencies\r\n\r\n- http4s 0.23.38 ([#3914](https://github.com/coursier/coursier/pull/3914))\r\n- undertow-core 2.4.4.Final ([#3912](https://github.com/coursier/coursier/pull/3912))\r\n- slf4j-nop 2.0.20 ([#3916](https://github.com/coursier/coursier/pull/3916))\r\n- logback-classic 1.6.3 → 1.6.7 ([#3904](https://github.com/coursier/coursier/pull/3904), [#3970](https://github.com/coursier/coursier/pull/3970), [#4033](https://github.com/coursier/coursier/pull/4033))\r\n- java-diff-utils 4.18 ([#3934](https://github.com/coursier/coursier/pull/3934))\r\n\r\n### GitHub Actions\r\n\r\n- coursier/cache-action 8.2.0 ([#3969](https://github.com/coursier/coursier/pull/3969)) then 9.0.1 ([#3993](https://github.com/coursier/coursier/pull/3993))\r\n- coursier/setup-action 3.1.0 ([#4019](https://github.com/coursier/coursier/pull/4019))\r\n- actions/setup-java 6.2.0 ([#4020](https://github.com/coursier/coursier/pull/4020))\r\n\r\n### Website (npm)\r\n\r\n- brace-expansion 1.1.21 ([#3892](https://github.com/coursier/coursier/pull/3892))\r\n- postcss-selector-parser 6.1.4 ([#3895](https://github.com/coursier/coursier/pull/3895))\r\n- proxy-addr 2.0.8 ([#3898](https://github.com/coursier/coursier/pull/3898))\r\n\r\n## New Contributors\r\n\r\n- [@sean0407](https://github.com/sean0407) made their first contribution in [#3902](https://github.com/coursier/coursier/pull/3902)\r\n- [@romanowski](https://github.com/romanowski) made their first contribution in [#3958](https://github.com/coursier/coursier/pull/3958)\r\n- [@lucasbrixner](https://github.com/lucasbrixner) made their first contribution in [#3963](https://github.com/coursier/coursier/pull/3963)\r\n\r\n**Full Changelog**: [v2.1.26...v2.1.27](https://github.com/coursier/coursier/compare/v2.1.26...v2.1.27)\r\n\r\n## Interface 1.0.31\r\n\r\nThe Java-only interface (`io.get-coursier:interface`) was released alongside, as version 1.0.31. It shades the coursier 2.1.27 modules, so it gets the resolution, download, cache and archive fixes listed below. On top of that:\r\n\r\n- **`Dependency.withOverrides` / `addOverride` now affect resolution**: they used to be ignored, and the dependencies of fetch results now carry their overrides too ([#4015](https://github.com/coursier/coursier/pull/4015)).\r\n- **`Credentials.of(…)` creates HTTPS-only credentials**, like the rest of coursier now ([#3926](https://github.com/coursier/coursier/pull/3926)).\r\n- Converting a dependency with a Gradle variant selector fails with an explicit error ([#4015](https://github.com/coursier/coursier/pull/4015)), and jni-utils is updated to 0.5.0 ([#4008](https://github.com/coursier/coursier/pull/4008)).\r\n\r\n**Interface changelog**: [interface-v1.0.30...interface-v1.0.31](https://github.com/coursier/coursier/compare/interface-v1.0.30...interface-v1.0.31)","reactions":{"total_count":4,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
