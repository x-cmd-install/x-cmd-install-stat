570803712,"node_id":"RA_kwDOAjzyOc4iBcYA","name":"cs-x86_64-pc-linux-sdk.zip","label":"","uploader":{"login":"alexarchambault","id":7063723,"node_id":"MDQ6VXNlcjcwNjM3MjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":29706983,"digest":"sha256:ee571f5d69b903dbbe33048e17b1e9959a1a053be58698bf9b3f15b825e49d95","download_count":11,"created_at":"2026-09-17T18:09:10Z","updated_at":"2026-09-17T18:09:13Z"},{"id":570803811,"node_id":"RA_kwDOAjzyOc4iBcZj","name":"cs-x86_64-pc-linux-static.gz","label":"","uploader":{"login":"alexarchambault","id":7063723,"node_id":"MDQ6VXNlcjcwNjM3MjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":29075527,"digest":"sha256:2d834754c96c1c2a83e2152a2fdaeb5deba63437a808e2351144112502794ad4","download_count":143,"created_at":"2026-09-17T18:09:13Z","updated_at":"2026-09-17T18:09:15Z"},{"id":570803853,"node_id":"RA_kwDOAjzyOc4iBcaN","name":"cs-x86_64-pc-linux.gz","label":"","uploader":{"login":"alexarchambault","id":7063723,"node_id":"MDQ6VXNlcjcwNjM3MjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":29706456,"digest":"sha256:415fa0e9514dcffd521eca13dbf05bddaf3f542795faec728021defcaa25abdf","download_count":45946,"created_at":"2026-09-17T18:09:15Z","updated_at":"2026-09-17T18:09:16Z"},{"id":570803889,"node_id":"RA_kwDOAjzyOc4iBcax","name":"cs-x86_64-pc-win32-sdk.zip","label":"","uploader":{"login":"alexarchambault","id":7063723,"node_id":"MDQ6VXNlcjcwNjM3MjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":31429575,"digest":"sha256:667c5b6987abf80d34cd1aaaae6047145459597072514baf23f19587187913fe","download_count":4,"created_at":"2026-09-17T18:09:17Z","updated_at":"2026-09-17T18:09:18Z"},{"id":570803930,"node_id":"RA_kwDOAjzyOc4iBcba","name":"cs-x86_64-pc-win32.zip","label":"","uploader":{"login":"alexarchambault","id":7063723,"node_id":"MDQ6VXNlcjcwNjM3MjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":32318482,"digest":"sha256:35fa5c65b2439ffb3609cf699e6a89a7d5d8e0eb794b2ce51005d96f9efd5242","download_count":2775,"created_at":"2026-09-17T18:09:18Z","updated_at":"2026-09-17T18:09:20Z"}],"body":"## Highlights\r\n\r\n### Scala 3 artifacts, and no more Scala 2.12 on Maven Central\r\n\r\n- **The library modules are now published for Scala 3** alongside 2.13 (#3742): `coursier_3`, `coursier-core_3`, `coursier-cache_3`, \u2026, and `_sjs1_3` for Scala.js. They're compiled with Scala 3.9.0. That's a mistake, the next versions should be compiled with Scala 3.3.x. The coursier CLI is itself written in Scala 3 now (#3281), and it's built against these Scala 3 modules.\r\n- **The generated `withFoo` setters of data classes are deprecated** on Scala 2.13 (#3840) and **don't exist at all in the Scala 3 artifacts**. Use `copy` instead, e.g. `dep.copy(version = \u2026)` rather than `dep.withVersion(\u2026)`. Coursier's own code already does this (#3839).\r\n- **Scala 2.12 artifacts aren't published to Maven Central anymore.** The sources still compile with 2.12 for the modules sbt-coursier needs (util, core, cache, coursier), and sbt-coursier now publishes those locally itself.\r\n- **Some modules were merged or dropped:**\r\n  - `coursier-sbt-maven-repository` is now part of `coursier-core`.\r\n  - `coursier-cache-util` is now part of `coursier-cache`.\r\n  - `coursier-proxy-setup` is now part of `coursier`.\r\n\r\n  Package names haven't changed, so removing those dependencies is enough. The cats / scalaz interop modules are no longer published (#3826).\r\n- **New modules:**\r\n  - `coursier-paths`, a Java module that shades the `directories` library (#3447, #3452).\r\n  - `coursier-archive-cache`: `ArchiveCache` moved out of `coursier-cache` into it (#3447).\r\n- **Fewer transitive dependencies:** argonaut is gone (#3810), along with the legacy report code that needed it (#3276). slf4j-api is pinned to 1.x (#3809).\r\n\r\n### Gradle Module Metadata support\r\n\r\nCoursier can now read Gradle `.module` files, in addition to POMs (#3271, #3320, and many follow-ups). Pass `--enable-modules` on the command line to turn it on. When enabled:\r\n\r\n- **Gradle module files are checked before POMs** (#3389), and cached like any other metadata (#3392).\r\n- **Dependencies without variant attributes fall back sensibly.** Coursier maps the usual Maven configuration (`runtime`, `compile`) to Gradle variant attributes (#3320, #3534). So something like this works as expected:\r\n\r\n  ```text\r\n  cs fetch -r google androidx.core:core-ktx:1.15.0 --enable-modules -A jar,aar,klib\r\n  ```\r\n- **Gradle-specific version features are supported:** `endorseStrictVersions` (#3402), `reject` in version specifiers (#3539), and empty versions (#3383).\r\n- **Source and javadoc JARs are supported too** (#3387, #3388). Their classifiers now show up in JSON report coordinates (#3547, by @albertocavalcante).\r\n- **BOM `endorseStrictVersions` pins aren't reported as dependency edges anymore** in `--tree` and JSON reports (#3725, by @Dolfik1). They used to show up as dependency cycles in tools such as Bazel's `rules_jvm_external`.\r\n\r\n### New version and variant types in the API\r\n\r\nThis is a large refactoring of the core data model. API users will run into it.\r\n\r\n- **Versions are no longer plain `String`s** (#3242). They're modeled by two types from [coursier/versions](https://github.com/coursier/versions):\r\n  - `Version`: a concrete version, like `1.2.3`.\r\n  - `VersionConstraint`: what a dependency asks for, like `1.2.3`, `[1.0,2)`, `2.2+` or `latest.release`.\r\n\r\n  Both types parse their input lazily, and only once. The refactoring also fixed several dependency tree printing issues.\r\n- **`Configuration` gives way to `Variant` and `VariantSelector`** (#3269), which parallel `Version` and `VersionConstraint`. Gradle module variants are built on these.\r\n- **`latest.*` handling was reworked** (#3257), and `Repository#find0` has a new signature (#3268).\r\n\r\n### Networking: timeouts, rate limiting and retries\r\n\r\nA new [Retries and rate limiting](https://get-coursier.io/docs/other-retries) page documents all of the following.\r\n\r\n- **Connect and read timeouts** (#3775): 30 s to connect and 1 min per read by default. Change them with `COURSIER_CONNECT_TIMEOUT` / `COURSIER_READ_TIMEOUT`, or the `coursier.connect-timeout` / `coursier.read-timeout` Java properties.\r\n- **HTTP 429 handling** (#3800, #3804):\r\n  - `Retry-After` is honored.\r\n  - The pause applies to every download from that host within the JVM, not just to the one that got the 429, with some jitter.\r\n  - Waiting doesn't use up the retry budget.\r\n  - Coursier gives up quickly if a server asks for an excessively long pause.\r\n  - `COURSIER_MAX_HTTP_RETRY_AFTER` and `COURSIER_MAX_THROTTLE_WAIT` set the limits, with higher defaults when `CI` is set.\r\n- **More errors are retried:** HTTP 500 (#3515, by @lihaoyi), `ConnectException` (#3550, by @lihaoyi), `OverlappingFileLockException` on Windows (#3318, by @eed3si9n), and DNS lookup failures. Retry logic was also fixed (#3629).\r\n- **New default User-Agent:** `Coursier/2.1 (+https://github.com/coursier; \u2026)`, with `cli`, `ci` and `json` context tokens. You can customize it in three places (#3842, by @eed3si9n, and #3844):\r\n  - `--user-agent` on the command line\r\n  - `FileCache#withUserAgent` in the API\r\n  - the `coursier.http.agent` Java property\r\n- **`COURSIER_HTTP_DEBUG=1`** prints the HTTP requests and responses (#3849).\r\n- **`--fail-203` / `--reject-non-authoritative-responses`** make coursier fail on the HTTP 203 sign-in pages that Azure DevOps sends instead of a 401 (#2068, by @markoutso).\r\n- **If an artifact was cached as not found**, a later failed download of it now reports \"not found\" rather than the network error. This helps when offline (#3483).\r\n\r\n### Repositories and mirrors\r\n\r\n- **Mirrors are read from Maven's `settings.xml`** (#3843), from `~/.m2`, `CS_MAVEN_HOME` / `MAVEN_HOME`, or `COURSIER_MAVEN_SETTINGS`. See the new [mirrors documentation](https://get-coursier.io/docs/other-mirrors) (#3748).\r\n- **Mirroring a repository no longer breaks sbt plugin resolution**, and trailing slashes in mirror URLs are normalized (#3632).\r\n- **New repository shorthand `central:maven-snapshots`** (#3504), for the new Central snapshots repository.\r\n- **`default` is accepted in `COURSIER_REPOSITORIES`** to mean the default repositories (#3555).\r\n- **Repositories from the config file are used in place of the defaults** (#3426), but not in place of repositories you add explicitly.\r\n\r\n### Resolution fixes and additions\r\n\r\n- **Maven compatibility:**\r\n  - Properties are substituted in `artifactId`s (#3341, by @JohnnyMorganz; #3851).\r\n  - Parent POMs can use version ranges (#3766, by @shuch3ng).\r\n  - Snapshot versions are picked by timestamp (#3417, by @Iilun).\r\n  - Maven 2 `RELEASE` / `LATEST` meta-versions are supported (#3238, by @yzia2000).\r\n- **Optional dependencies:** `optional` is now an `Option[Boolean]`, so \"explicitly not optional\" can be told apart from \"unspecified\" (#3743). A new `ResolutionParams.ignoreOptionalFromDepMgmt` ignores `<optional>` in dependency management (#3745).\r\n- **New `ResolutionParams.scalaOrganizationOverride`** rewrites `org.scala-lang` dependencies to a custom organization (#3571, by @mbovel).\r\n- **Forced versions accept patterns like `some-org:*`**, and conflict trees involving root dependencies are fixed (#3394).\r\n- **Dependency management key substitution is now deterministic** (#3837). Before, results could depend on hash ordering.\r\n- **POM parse errors include the URL of the faulty file** (#3589). Dependencies are parsed more strictly (#3280), and printing conflicts no longer throws occasionally (#3577).\r\n\r\n### Performance\r\n\r\nResolution got noticeably faster and lighter on memory, largely through a series of PRs by @retronym:\r\n\r\n- Faster overrides handling (#3635), XML parsing (#3636) and property substitution (#3662).\r\n- Smaller improvements in hot paths: #3642, #3648, #3650, #3741, plus #3468 and #3532 by @lihaoyi and #3568 by @nguyenyou.\r\n- **Out-of-memory fixes:**\r\n  - Intermediate resolutions are released sooner (#3640).\r\n  - The reverse dependency tree no longer expands the same subtree again and again, which blew up exponentially on large graphs (#3671). Subtrees that were already printed now show as `(*)`.\r\n- **Fewer version listings are fetched** (#3649), JVM indexes are memoized (#3848), and the config file is cached (#3514).\r\n\r\n### Archive cache\r\n\r\n- **More formats:**\r\n  - `.jar` (#3272) and `.aar` (#3644)\r\n  - `ar`, `tar.bz2`, `tar.xz`, `tar.zst`, `gz` and `xz` (#3282)\r\n  - archives nested in archives (#3349)\r\n- **Corrupted archives are detected before extraction**, deleted and downloaded again (#3482, #3486, #3542). The integrity checks are cached (#3528).\r\n- **New `ArchiveCache#shortPathDirectory`** (#3373).\r\n\r\n### Launchers and distribution\r\n\r\n- **Linux ARM64 launchers** are built and uploaded by the release pipeline (#3250).\r\n- **Compat Linux x86-64 launchers** (`cs-x86_64-pc-linux-compat.gz`), for CPUs without AVX2 (#3381), now really target the baseline x86-64 instruction set (#3601). They're tested under QEMU emulating a Nehalem CPU.\r\n- **New standalone JVM launchers** bundle a Java runtime via `jpackage`, so they run without a JVM installed (#3658). They're available for Linux, macOS and Windows, including Windows ARM64 (#3674).\r\n- **The Windows bootstrap launcher is uploaded to GitHub releases** (#3675).\r\n- **\"Mostly static\" Linux launchers are no longer built** (#3592). Fully static (musl) launchers are unaffected.\r\n- **New [`cs.sh`](https://github.com/coursier/coursier/raw/main/cs.sh) script** downloads and runs a pinned `cs` version, with retries (#3770, #3791).\r\n- **Nightly launchers are published to a dedicated `nightly` release** (#3767, #3850).\r\n- **New docs on verifying the build attestations of release artifacts** (#3659).\r\n\r\n### CLI\r\n\r\n- **`cs launch` and `cs setup` default to JDK 21** (#3311), with a better default JVM on Windows ARM (#3360). A `JAVA_HOME` without a `bin/java` is now ignored, with a warning (#3605).\r\n- **`cs bootstrap --assembly --relocate from=to`** relocates (shades) packages in assemblies (#3740). Assemblies without a main class are now allowed (#3734). Fixed:\r\n  - `META-INF/services` files that got merged incorrectly (#3595)\r\n  - multi-release JARs losing their `Multi-Release` flag when shading (#3442)\r\n- **`cs fetch --json-report-add-urls`** adds the download URL of each artifact to JSON reports (#3583). Various JSON report fixes: #3247 and follow-ups.\r\n- **`cs list` shows installed versions** (#3598).\r\n- **App channels default to the JSON listings of [coursier/apps](https://github.com/coursier/apps)** (#3811), rather than the Maven-based `io.get-coursier:apps`. **Ammonite is no longer installed by `cs setup`** (#3656).\r\n- **`cs launch org::name:version` works with Scala 3-only artifacts** that are missing from the Complete API index (#3613).\r\n- **Shutdown hooks run before `execve`** (#3579).\r\n- **Windows fixes:**\r\n  - Non-ASCII characters in arguments and paths are no longer garbled (#3604).\r\n  - `cs java --setup` no longer piles up JVM entries in `PATH` (#3597).\r\n  - `.bat` launchers no longer hide negative exit codes (#3580, #3596).\r\n\r\n### coursier/interface now lives here\r\n\r\nThe Java-friendly [interface](https://github.com/coursier/interface) API moved into this repository (#3796). It is released separately, as `io.get-coursier:interface:1.0.29`. Changes:\r\n\r\n- Custom cache credentials are now honored when downloading artifacts, not only for metadata (#3801).\r\n- Progress bars can write to arbitrary `Writer`s (#3803).\r\n- New `coursierapi.ProxySetup.setup()` for JVM-wide proxy setup (#3806).\r\n- `interface-svm-subs`, `interface-no-shading` and `interface-interpolators` aren't published anymore (#3807, #3808, #3820).\r\n\r\n### Experimental\r\n\r\n- **Docker commands:** `cs docker-build`, `cs docker-pull`, `cs docker-run`, plus `cs vm start` / `cs vm stop`, which run them in a QEMU VM (#3316, #3363). These are very experimental.\r\n- **`cs server`** shares a host coursier cache with containers, which see it read-only (#3614). It's meant for agent-based development.\r\n\r\n## What's Changed\r\n\r\n### Scala 3, published modules and dependencies of coursier itself\r\n\r\n* Get rid of legacy report stuff by @alexarchambault in https://github.com/coursier/coursier/pull/3276\r\n* Compile cli sources with Scala 3 by @alexarchambault in https://github.com/coursier/coursier/pull/3281\r\n* Don't pull jsoniter-scala-core_3 from scala-cli-config by @alexarchambault in https://github.com/coursier/coursier/pull/3435\r\n* Publish paths module, slim down cache module dependencies by @alexarchambault in https://github.com/coursier/coursier/pull/3447\r\n* Shade directories library in new coursier-paths module by @alexarchambault in https://github.com/coursier/coursier/pull/3452\r\n* Cross-compile things with Scala 3 too by @alexarchambault in https://github.com/coursier/coursier/pull/3742\r\n* Pin slf4j-api to 1.x by @alexarchambault in https://github.com/coursier/coursier/pull/3809\r\n* Remove the argonaut dependency by @alexarchambault in https://github.com/coursier/coursier/pull/3810\r\n* Compile the interface module with 2.13 only by @alexarchambault in https://github.com/coursier/coursier/pull/3825\r\n* Stop publishing interop modules by @alexarchambault in https://github.com/coursier/coursier/pull/3826\r\n* Prepare things for Scala 3 by @alexarchambault in https://github.com/coursier/coursier/pull/3827\r\n* More thing preparing the ground for Scala 3 / unroll by @alexarchambault in https://github.com/coursier/coursier/pull/3829\r\n* Use case class copy methods instead of generated setters by @alexarchambault in https://github.com/coursier/coursier/pull/3839\r\n* Deprecate generated setters in data classes by @alexarchambault in https://github.com/coursier/coursier/pull/3840\r\n* Build Scala.js modules only for Scala 2.13 by @alexarchambault in https://github.com/coursier/coursier/pull/3852\r\n\r\n### coursier/interface\r\n\r\n* Fold coursier/interface module here by @alexarchambault in https://github.com/coursier/coursier/pull/3796\r\n* Honor custom cache credentials for artifacts by @alexarchambault in https://github.com/coursier/coursier/pull/3801\r\n* [interface] Support progress bars with arbitrary Writers by @alexarchambault in https://github.com/coursier/coursier/pull/3803\r\n* Add API in interface module for (JVM-wide) proxy setup by @alexarchambault in https://github.com/coursier/coursier/pull/3806\r\n* Remove interface-svm-subs module by @alexarchambault in https://github.com/coursier/coursier/pull/3807\r\n* Stop publishing io.get-coursier::interface-no-shading by @alexarchambault in https://github.com/coursier/coursier/pull/3808\r\n* Remove deprecated interface-interpolators modules by @alexarchambault in https://github.com/coursier/coursier/pull/3820\r\n\r\n### Gradle Module Metadata\r\n\r\n* Add Gradle Module support by @alexarchambault in https://github.com/coursier/coursier/pull/3271\r\n* More refined handling of Gradle Modules by @alexarchambault in https://github.com/coursier/coursier/pull/3320\r\n* Tweak Gradle Module stuff by @alexarchambault in https://github.com/coursier/coursier/pull/3353\r\n* Accept empty versions in Gradle Modules by @alexarchambault in https://github.com/coursier/coursier/pull/3383\r\n* Various Gradle Modules fixes by @alexarchambault in https://github.com/coursier/coursier/pull/3384\r\n* In AnyOf variant matcher, give decreasing scores to passed matchers by @alexarchambault in https://github.com/coursier/coursier/pull/3386\r\n* Add source JAR support for Gradle Modules by @alexarchambault in https://github.com/coursier/coursier/pull/3387\r\n* Tweak source JAR support for Gradle Modules by @alexarchambault in https://github.com/coursier/coursier/pull/3388\r\n* Ensure Gradle Module files are checked before using POM files by @alexarchambault in https://github.com/coursier/coursier/pull/3389\r\n* Fix caching of Gradle Module files by @alexarchambault in https://github.com/coursier/coursier/pull/3392\r\n* Take Gradle Modules' endorseStrictVersions into account by @alexarchambault in https://github.com/coursier/coursier/pull/3402\r\n* Use more sensible default configuration for Gradle modules by @alexarchambault in https://github.com/coursier/coursier/pull/3534\r\n* Accept rejects in Gradle module version specifiers by @alexarchambault in https://github.com/coursier/coursier/pull/3539\r\n* fix(gmm): include sources/javadoc classifiers in coordinates by @albertocavalcante in https://github.com/coursier/coursier/pull/3547\r\n* Don't report Gradle BOM endorseStrictVersions pins as dependency edges by @Dolfik1 in https://github.com/coursier/coursier/pull/3725\r\n\r\n### Resolution\r\n\r\n* feat: add maven 2 meta version support by @yzia2000 in https://github.com/coursier/coursier/pull/3238\r\n* Use VersionConstraint and Version rather than String for versions by @alexarchambault in https://github.com/coursier/coursier/pull/3242\r\n* Rework latest handling by @alexarchambault in https://github.com/coursier/coursier/pull/3257\r\n* Fix fallback logger messages, and change Repository#find0 signature by @alexarchambault in https://github.com/coursier/coursier/pull/3268\r\n* Add Variant and VariantSelector ADTs by @alexarchambault in https://github.com/coursier/coursier/pull/3269\r\n* Parse dependencies more strictly by @alexarchambault in https://github.com/coursier/coursier/pull/3280\r\n* Fix empty version handling by @alexarchambault in https://github.com/coursier/coursier/pull/3301\r\n* Fix tree printing by @alexarchambault in https://github.com/coursier/coursier/pull/3302\r\n* Substitute properties in module name by @JohnnyMorganz in https://github.com/coursier/coursier/pull/3341\r\n* Fix pre-2.1.25 Versions.latest by @Gedochao in https://github.com/coursier/coursier/pull/3343\r\n* Fix conflict trees involving root dependencies and accept patterns like 'some-org:*' to force versions by @alexarchambault in https://github.com/coursier/coursier/pull/3394\r\n* Use timestamp to compute snapshot version. Fixes #3416 by @Iilun in https://github.com/coursier/coursier/pull/3417\r\n* Default to jar type when adding overrides by @alexarchambault in https://github.com/coursier/coursier/pull/3493\r\n* Allow users to customize module / version rendering in trees by @alexarchambault in https://github.com/coursier/coursier/pull/3509\r\n* Add scalaOrganizationOverride to ResolutionParams by @mbovel in https://github.com/coursier/coursier/pull/3571\r\n* Fix exception thrown sometimes when printing conflicts by @alexarchambault in https://github.com/coursier/coursier/pull/3577\r\n* Include source URL in POM XML parse error messages by @alexarchambault with @Copilot in https://github.com/coursier/coursier/pull/3589\r\n* Fix things in MinimizedExclusions by @alexarchambault in https://github.com/coursier/coursier/pull/3622\r\n* Cycle detection in DependencyTree relocation walk by @retronym in https://github.com/coursier/coursier/pull/3641\r\n* Tweak optional dependencies handling by @alexarchambault in https://github.com/coursier/coursier/pull/3743\r\n* Allow users to ignore optional stuff from dep mgmt via ResolutionParams by @alexarchambault in https://github.com/coursier/coursier/pull/3745\r\n* Support version ranges in parent POM coordinates by @shuch3ng in https://github.com/coursier/coursier/pull/3766\r\n* Make dependency management key substitution deterministic by @alexarchambault in https://github.com/coursier/coursier/pull/3837\r\n* Fixup for property substitution in artifactId by @alexarchambault in https://github.com/coursier/coursier/pull/3851\r\n\r\n### Downloads, cache, repositories and mirrors\r\n\r\n* Allow users to reject 203 responses by @markoutso in https://github.com/coursier/coursier/pull/2068\r\n* Remove recursion from Complete.hasOrg by @jackkoenig in https://github.com/coursier/coursier/pull/2655\r\n* Retry on OverlappingFileLockException by @eed3si9n in https://github.com/coursier/coursier/pull/3318\r\n* Use java.nio.file.Path in CoursierPaths instead of java.io.File by @vasilmkd in https://github.com/coursier/coursier/pull/3364\r\n* Read repositories in config files from Resolve.defaultRepositories by @alexarchambault in https://github.com/coursier/coursier/pull/3426\r\n* Add CoursierEnv by @alexarchambault in https://github.com/coursier/coursier/pull/3427\r\n* Allow users to disable FFM use via a global Java property by @alexarchambault in https://github.com/coursier/coursier/pull/3456\r\n* Recall more not-found errors from cache by @alexarchambault in https://github.com/coursier/coursier/pull/3483\r\n* Add Repositories.centralMavenSnapshots and accept 'central:maven-snapshots' by @alexarchambault in https://github.com/coursier/coursier/pull/3504\r\n* Cache default coursier config file in Coursier by @lihaoyi in https://github.com/coursier/coursier/pull/3514\r\n* Mark HTTP 500 errors as retryable in `Downloader.scala` to mitigate download endpoint flakiness by @lihaoyi in https://github.com/coursier/coursier/pull/3515\r\n* Catch and retry ConnectException on downloads by @lihaoyi in https://github.com/coursier/coursier/pull/3550\r\n* Accept \"default\" in COURSIER_REPOSITORIES by @alexarchambault in https://github.com/coursier/coursier/pull/3555\r\n* Fix negative download speed values by @alexarchambault with @Copilot in https://github.com/coursier/coursier/pull/3591\r\n* Fix Scala 3-only artifact version auto-detection when Complete API returns empty results by @alexarchambault with @Copilot in https://github.com/coursier/coursier/pull/3613\r\n* Fix retry stuff by @alexarchambault in https://github.com/coursier/coursier/pull/3629\r\n* Preserve `SbtMavenRepository` semantics in `MavenMirror` and normalize mirror destination URLs by @alexarchambault with @Copilot in https://github.com/coursier/coursier/pull/3632\r\n* Add connect and read timeouts by @alexarchambault in https://github.com/coursier/coursier/pull/3775\r\n* Slightly better handling of HTTP 429 response code by @alexarchambault in https://github.com/coursier/coursier/pull/3800\r\n* Add HostThrottle for better retries after HTTP 429 by @alexarchambault in https://github.com/coursier/coursier/pull/3804\r\n* Allow User Agent to be customized by @eed3si9n in https://github.com/coursier/coursier/pull/3842\r\n* Read mirrors from Maven's settings.xml too by @alexarchambault in https://github.com/coursier/coursier/pull/3843\r\n* Update default user agent and give more options to users for customizing it by @alexarchambault in https://github.com/coursier/coursier/pull/3844\r\n* Allow users to debug HTTP issues with COURSIER_HTTP_DEBUG in the env by @alexarchambault in https://github.com/coursier/coursier/pull/3849\r\n\r\n### Archive cache\r\n\r\n* Have ArchiveCache handle .jar files by @alexarchambault in https://github.com/coursier/coursier/pull/3272\r\n* Add support for more formats in ArchiveCache by @alexarchambault in https://github.com/coursier/coursier/pull/3282\r\n* ArchiveType.Ar shouldn't inherit from ArchiveType.Tar by @alexarchambault in https://github.com/coursier/coursier/pull/3286\r\n* Add \"archive in archive\" support to ArchiveCache by @alexarchambault in https://github.com/coursier/coursier/pull/3349\r\n* Add ArchiveCache#shortPathDirectory by @alexarchambault in https://github.com/coursier/coursier/pull/3373\r\n* Check for the integrity of archives before attempting to extract them by @alexarchambault in https://github.com/coursier/coursier/pull/3482\r\n* Fix corrupted tar.gz detection by @alexarchambault in https://github.com/coursier/coursier/pull/3486\r\n* Cache ArchiveCache integrity checks by @alexarchambault in https://github.com/coursier/coursier/pull/3528\r\n* Fix corrupted archive detection by @alexarchambault in https://github.com/coursier/coursier/pull/3542\r\n* Ensure users can extract aar files in archive cache by @alexarchambault in https://github.com/coursier/coursier/pull/3644\r\n\r\n### Performance\r\n\r\n* Try to micro-optimize `coursier.core.compatibility.substituteEntities` and `entityIdx` by @lihaoyi in https://github.com/coursier/coursier/pull/3468\r\n* More micro-optimizations for `entityIdx` by @lihaoyi in https://github.com/coursier/coursier/pull/3532\r\n* Cache hashCode in ReverseModuleTree.Node by @nguyenyou in https://github.com/coursier/coursier/pull/3568\r\n* Improve performance of Overrides by @retronym in https://github.com/coursier/coursier/pull/3635\r\n* Improve performance of XML processing by @retronym in https://github.com/coursier/coursier/pull/3636\r\n* Release memory sooner during iterations of resolution by @retronym in https://github.com/coursier/coursier/pull/3640\r\n* Performance micro-optimisations in resolution hot paths by @retronym in https://github.com/coursier/coursier/pull/3642\r\n* Use cachedHashCode rather than lazy val by @retronym in https://github.com/coursier/coursier/pull/3648\r\n* Use version listing less by @alexarchambault in https://github.com/coursier/coursier/pull/3649\r\n* Cache allConfigurations by @retronym in https://github.com/coursier/coursier/pull/3650\r\n* Improve performance of property substitution, by @retronym  by @alexarchambault in https://github.com/coursier/coursier/pull/3662\r\n* Fix OOM in reverse dependency tree via global visited set by @retronym in https://github.com/coursier/coursier/pull/3671\r\n* Optimize resolution hot paths and POM parsing by @alexarchambault in https://github.com/coursier/coursier/pull/3741\r\n* Memoize JVM index loading across lookups by @alexarchambault in https://github.com/coursier/coursier/pull/3848\r\n\r\n### CLI\r\n\r\n* Add more json report tests by @alexarchambault in https://github.com/coursier/coursier/pull/3246\r\n* Fix JSON report tests and tweak report generation by @alexarchambault in https://github.com/coursier/coursier/pull/3247\r\n* Revert \"Fix JSON reports - a dependency can have several artifacts\" by @alexarchambault in https://github.com/coursier/coursier/pull/3248\r\n* Add more JSON report tests by @alexarchambault in https://github.com/coursier/coursier/pull/3249\r\n* Don't assume /lib and /usr/sbin exist in musl check by @alexarchambault in https://github.com/coursier/coursier/pull/3251\r\n* Add JSON report bouncy castle test by @alexarchambault in https://github.com/coursier/coursier/pull/3252\r\n* Extra report tests by @alexarchambault in https://github.com/coursier/coursier/pull/3263\r\n* Default to JDK 21 in 'cs launch' and 'cs setup' commands by @alexarchambault in https://github.com/coursier/coursier/pull/3311\r\n* Handle 404 (and other errors) in Scala.js helper by @alexarchambault in https://github.com/coursier/coursier/pull/3354\r\n* Better default JVM on Windows ARM by @alexarchambault in https://github.com/coursier/coursier/pull/3360\r\n* Preserve multi-release flag in JARs with shading by @alexarchambault in https://github.com/coursier/coursier/pull/3442\r\n* Fix shading by @alexarchambault in https://github.com/coursier/coursier/pull/3487\r\n* Fix deprecation message for `coursierIndexUrl` by @Gedochao in https://github.com/coursier/coursier/pull/3510\r\n* Run shutdown hooks right before doing execve by @alexarchambault in https://github.com/coursier/coursier/pull/3579\r\n* Add `--json-report-add-urls` flag to include artifact downlo