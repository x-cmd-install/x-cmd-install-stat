:22554306,"digest":null,"download_count":96128,"created_at":"2025-01-09T23:19:59Z","updated_at":"2025-01-09T23:20:01Z"}],"body":"## What's Changed\r\n* Detect when we're running on linux-musl (like Alpine Linux) by @alexarchambault in https://github.com/coursier/coursier/pull/3227\r\n\r\n## Fixes\r\n* Stop using System.console() == null by @alexarchambault in https://github.com/coursier/coursier/pull/3216\r\n* Fix dependency import vs parent precedence in BOMs by @alexarchambault in https://github.com/coursier/coursier/pull/3226\r\n\r\n## Updates / maintenance\r\n* Update directories sub-module by @alexarchambault in https://github.com/coursier/coursier/pull/3198\r\n* Update cats-effect to 3.5.7 by @scala-steward in https://github.com/coursier/coursier/pull/3211\r\n* Update mdoc to 2.6.2 by @scala-steward in https://github.com/coursier/coursier/pull/3210\r\n* Update jsoup to 1.18.3 by @scala-steward in https://github.com/coursier/coursier/pull/3208\r\n* Update http4s-blaze-server to 0.23.17 by @scala-steward in https://github.com/coursier/coursier/pull/3206\r\n* Update java-diff-utils to 4.15 by @scala-steward in https://github.com/coursier/coursier/pull/3204\r\n* Update windows-ansi to 0.0.6 by @scala-steward in https://github.com/coursier/coursier/pull/3203\r\n* Update http4s-dsl, http4s-server to 0.23.30 by @scala-steward in https://github.com/coursier/coursier/pull/3207\r\n* Use directories as a Maven dep rather than a sub-module by @alexarchambault in https://github.com/coursier/coursier/pull/3215\r\n* Update directories to 0.1.2 by @alexarchambault in https://github.com/coursier/coursier/pull/3217\r\n* Update logback-classic to 1.5.16 by @scala-steward in https://github.com/coursier/coursier/pull/3214\r\n* Update proguard-base to 7.6.1 by @scala-steward in https://github.com/coursier/coursier/pull/3201\r\n* Update plexus-archiver to 4.10.0 by @scala-steward in https://github.com/coursier/coursier/pull/3205\r\n* Update cs launcher used in docker-based ITs by @alexarchambault in https://github.com/coursier/coursier/pull/3219\r\n* Clean-up thing in build by @alexarchambault in https://github.com/coursier/coursier/pull/3220\r\n* Bump Mill by @alexarchambault in https://github.com/coursier/coursier/pull/3218\r\n* Get Java 8 boot class path from a native ARM JDK on Mac ARM by @alexarchambault in https://github.com/coursier/coursier/pull/3228\r\n* Add back some tests for JVM CLI launcher by @alexarchambault in https://github.com/coursier/coursier/pull/3221\r\n* Update GraalVM by @alexarchambault in https://github.com/coursier/coursier/pull/3222\r\n\r\n\r\n**Full Changelog**: https://github.com/coursier/coursier/compare/v2.1.23...v2.1.24","mentions_count":2}
