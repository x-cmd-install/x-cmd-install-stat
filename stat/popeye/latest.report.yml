ated_at":"2025-01-28T15:33:20Z"},{"id":224311762,"node_id":"RA_kwDOCoNXDs4NXrnS","name":"popeye_windows_arm64.tar.gz.sbom.json","label":"","uploader":{"login":"derailed","id":4060,"node_id":"MDQ6VXNlcjQwNjA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":230657,"digest":null,"download_count":13,"created_at":"2025-01-28T15:34:32Z","updated_at":"2025-01-28T15:34:33Z"}],"body":"<img src=\"https://raw.githubusercontent.com/derailed/popeye/master/assets/popeye_logo.png\" align=\"right\" width=\"200\" height=\"auto\"/>\n\n# Release v0.22.1\n\n## Notes\n\nThank you to all that contributed with flushing out issues and enhancements for Popeye! I'll try to mark some of these issues as fixed. But if you don't mind grab the latest rev and see if we're happier with some of the fixes! If you've filed an issue please help me verify and close. Your support, kindness and awesome suggestions to make Popeye better is as ever very much noticed and appreciated!\n\nThis project offers a GitHub Sponsor button (over here \ud83d\udc46). As you well know this is not pimped out by big corps with deep pockets. If you feel `Popeye` is saving you cycles diagnosing potential cluster issues please consider sponsoring this project!! It does go a long way in keeping our servers lights on and beers in our fridge.\n\nAlso if you dig this tool, please make some noise on social! [@kitesurfer](https://twitter.com/kitesurfer)\n\n---\n\n## Maintenance Release\n\n---\n\n## Resolved Issues\n\n* [#425](https://github.com/derailed/popeye/issues/425) Upload to s3 failing in v0.22.0\n\n<img src=\"https://raw.githubusercontent.com/derailed/popeye/master/assets/imhotep_logo.png\" width=\"32\" height=\"auto\"/>&nbsp; \u00a9 2025 Imhotep Software LLC. All materials licensed under [Apache v2.0](http://www.apache.org/licenses/LICENSE-2.0)\n\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
