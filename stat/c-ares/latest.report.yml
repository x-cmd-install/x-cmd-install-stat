2026\r\n\r\nThis is a security release.\r\n\r\nSecurity:\r\n* Memory corruption when an application cancels its lookups after a connection failure. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-wpr3-8q3r-4q8c\r\n* A DNS reply that arrived from a different server than the one queried could be accepted. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-fqh5-3x7m-wp44\r\n* Use-after-free of a lookup after shutting down a failed connection. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-97vq-4mxv-7vhm\r\n* Use-after-free when an application cancels lookups from a callback, or shuts a channel down. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-rf6g-ww74-97qh\r\n* Use-after-free of a connection after the socket-state callback returns. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-mw23-pfg6-2x9r\r\n* Use-after-free when an application cancels lookups from a server-state callback. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-v33j-65h4-4ch8\r\n* Use-after-free of a server record when an application changes its DNS servers from a callback. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-pj7p-v3cw-hq66\r\n* Use-after-free of a cached DNS answer while the application is still reading it. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-grv7-fq5q-9vfc\r\n* Buffer overflow when `ares_dup()` or `ares_save_options()` runs while another thread changes the servers. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-ph6c-3cvx-mq6v\r\n* Uninitialized memory returned for a numeric IPv6 name with a prefix length. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-cfcv-8v2j-qj6r\r\n* The query cache could return an answer obtained using different EDNS options. Please see https://github.com/c-ares/c-ares/security/advisories/GHSA-wrgc-prmw-27xh\r\n\r\nChanges:\r\n* Answers served from the query cache now report their remaining TTL rather than the TTL originally received.\r\n* `ares_inet_pton()` rejects a \"/bits\" prefix length and returns 0, rather than -1, for any input it cannot parse.\r\n* UDP replies must now come from the server's port as well as its address. Custom `arecvfrom` socket functions (`ares_set_socket_functions_ex()` or `ares_set_socket_functions()`) must fill in the full source address, including the port. For compatibility, a reported port of 0 checks only the address, but such implementations are insecure and should be fixed. [PR #1370](https://github.com/c-ares/c-ares/pull/1370)\r\n* Document that socket functions and socket, configure and pending-write callbacks must not call c-ares functions on the same channel. [PR #1360](https://github.com/c-ares/c-ares/pull/1360)\r\n\r\nBugfixes:\r\n* `ares_dup()`: don't leave the new channel bound to the source channel. [PR #1333](https://github.com/c-ares/c-ares/pull/1333)\r\n* `ares_init_options()`: don't report the default query cache as a caller-set option. [PR #1354](https://github.com/c-ares/c-ares/pull/1354)\r\n* Clamp DNS record TTLs to the signed int range used by public APIs. [PR #1313](https://github.com/c-ares/c-ares/pull/1313)\r\n* `ares_dns_write()`: reject messages larger than 64KB. [PR #1314](https://github.com/c-ares/c-ares/pull/1314)\r\n* `ares_dns_parse()`: accept legacy compressed RDATA names. [PR #1326](https://github.com/c-ares/c-ares/pull/1326)\r\n* `ares_parse_a_reply()`/`ares_parse_aaaa_reply()`: ignore a negative `*naddrttls`. [PR #1302](https://github.com/c-ares/c-ares/pull/1302)\r\n* select event backend: refuse descriptors >= `FD_SETSIZE` instead of overflowing `fd_set`. [PR #1312](https://github.com/c-ares/c-ares/pull/1312)\r\n* Strip inline comments from resolv.conf values. [PR #1276](https://github.com/c-ares/c-ares/pull/1276)\r\n* Ignore absurd resolv.conf retry/attempts values. [PR #1315](https://github.com/c-ares/c-ares/pull/1315)\r\n* Zero-initialize the server config when parsing nameserver URIs. [PR #1325](https://github.com/c-ares/c-ares/pull/1325)\r\n* URI parsing: roll back the ':' probe when it lands past the '@'. [PR #1265](https://github.com/c-ares/c-ares/pull/1265)\r\n* Do not assume `gethostname()` NUL-terminates its buffer. [PR #1269](https://github.com/c-ares/c-ares/pull/1269)\r\n* Combine the hash table seed with XOR instead of OR. [PR #1330](https://github.com/c-ares/c-ares/pull/1330)\r\n* Turn off stdio buffering when loading a file. [PR #939](https://github.com/c-ares/c-ares/pull/939)\r\n* Guard `pipe2()` on Apple platforms to prevent unguarded availability warnings. [PR #1328](https://github.com/c-ares/c-ares/pull/1328)\r\n\r\nThanks go to these friendly people for their efforts and contributions for this release:\r\n\r\n* (@ahillspace)\r\n* (@anon5376)\r\n* Brad House (@bradh352)\r\n* Nikolaos Chatzikonstantinou (@createyourpersonalaccount)\r\n* Dev (@devdgna)\r\n* (@evilgensec)\r\n* Ilias (@iliasabk)\r\n* (@jdymitarai)\r\n* (@jmestwa-coder)\r\n* Manohar Paturi (@ManoharPaturi)\r\n* (@mardgez13)","mentions_count":11}
