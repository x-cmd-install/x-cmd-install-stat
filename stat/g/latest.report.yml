blic","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2951124,"digest":"sha256:f6e354d7e642697d4c4eaada6de85957806c03c9a02921162d1b8770d72d0474","download_count":28,"created_at":"2026-03-23T02:39:22Z","updated_at":"2026-03-23T02:39:27Z"},{"id":379442016,"node_id":"RA_kwDOJaNoxM4WndNg","name":"g_0.31.2_arm.deb","label":"","uploader":{"login":"equationzhao","id":75521101,"node_id":"MDQ6VXNlcjc1NTIxMTAx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2646744,"digest":"sha256:8cea3bed7646a9029d494795912926cdbc3b3cbe1507ff72d786aa3c8a25af07","download_count":2,"created_at":"2026-03-23T02:39:26Z","updated_at":"2026-03-23T02:39:30Z"},{"id":379442050,"node_id":"RA_kwDOJaNoxM4WndOC","name":"g_0.31.2_arm64.deb","label":"","uploader":{"login":"equationzhao","id":75521101,"node_id":"MDQ6VXNlcjc1NTIxMTAx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2627804,"digest":"sha256:d895afc34bae26389556c64c4f6e9ffd04c199b46beff8cdbc32cf28532ba7c5","download_count":3,"created_at":"2026-03-23T02:39:29Z","updated_at":"2026-03-23T02:39:36Z"},{"id":379442060,"node_id":"RA_kwDOJaNoxM4WndOM","name":"g_0.31.2_loong64.deb","label":"","uploader":{"login":"equationzhao","id":75521101,"node_id":"MDQ6VXNlcjc1NTIxMTAx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2119440,"digest":"sha256:7013798540fc6bcf069cc9dade3f4f15b64ca9721e6ea634404ca4932da95ff1","download_count":5,"created_at":"2026-03-23T02:39:31Z","updated_at":"2026-03-23T02:39:37Z"}],"body":"## v0.31.2 Release Notes\r\n\r\n### New Features\r\n\r\n- **`-t` flag for time-based sorting** \u2014 Added `-t` as a shorthand flag to sort by modification time, complementing the existing `--sort=time` option for a quicker workflow\r\n\r\n### Performance Improvements\r\n\r\n- **Iterative tree traversal** (#272) \u2014 Replaced recursive directory tree traversal with an explicit stack-based iterative DFS, significantly reducing memory pressure and goroutine count in deep directory trees. Also refactored `TreeBuilder`/`TreePrinter`, added typed `ParentPath`/`Level` fields on `FileInfo`, and added unit tests\r\n- **Adaptive batch processing strategy** \u2014 Introduced intelligent strategy selection for directory processing:\r\n  - Directories with < 50 files: uses traditional approach to avoid optimization overhead\r\n  - Directories with \u2265 50 files: uses batch file processing for better throughput\r\n  - JSON output: always uses traditional processing to prevent ~24% performance regression\r\n\r\n### Bug Fixes\r\n\r\n- **fish shell path completion** (#267) \u2014 Removed the `-f` flag from fish completions to fix broken path auto-completion in fish shell\r\n- **Lint violations** (#280) \u2014 Fixed remaining lint warnings across benchmarks, printers, and content helpers\r\n\r\n### Maintenance\r\n\r\n- **Go 1.24.1 upgrade** (#279) \u2014 Updated CI workflows and docs to use Go 1.24.1\r\n- **`go fix` cleanup** (#274) \u2014 Ran `go fix` to update deprecated API usage\r\n- **Dependency bump** (#287) \u2014 `github.com/buger/jsonparser` 1.1.1 \u2192 1.1.2\r\n- **Release workflow fixes** (#286, #288) \u2014 Fixed dirty-file check failures and non-deterministic man page generation; release process now uses PRs for consistency\r\n\r\n**Full Changelog**: https://github.com/equationzhao/g/compare/v0.31.0...v0.31.2"}
