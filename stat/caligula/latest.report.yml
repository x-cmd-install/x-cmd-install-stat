{"id":327392640,"author":{"login":"ifd3f","id":7308591,"node_id":"MDQ6VXNlcjczMDg1OTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJD5VD84Tg52A","tag_name":"v0.5.0","target_commitish":"release/v0.5.0","name":"v0.5.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-05-19T23:11:08Z","updated_at":"2026-05-21T23:30:09Z","published_at":"2026-05-21T23:30:09Z","assets":[{"id":426556642,"node_id":"RA_kwDOJD5VD84ZbLzi","name":"caligula-aarch64-darwin","label":null,"uploader":{"login":"ifd3f","id":7308591,"node_id":"MDQ6VXNlcjczMDg1OTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3278480,"digest":"sha256:5fef54f50b209ce0fcd6883432a2dd96119a211ef5f441902aa078719ae6ac28","download_count":105,"created_at":"2026-05-21T23:19:46Z","updated_at":"2026-05-21T23:19:47Z"},{"id":426556654,"node_id":"RA_kwDOJD5VD84ZbLzu","name":"caligula-aarch64-linux","label":null,"uploader":{"login":"ifd3f","id":7308591,"node_id":"MDQ6VXNlcjczMDg1OTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3691032,"digest":"sha256:9dd0cea2080bfa51e5b9a50c8048632e9767c1b269784e6902663566f53dbf75","download_count":447,"created_at":"2026-05-21T23:19:47Z","updated_at":"2026-05-21T23:19:48Z"},{"id":426556662,"node_id":"RA_kwDOJD5VD84ZbLz2","name":"caligula-x86_64-darwin","label":null,"uploader":{"login":"ifd3f","id":7308591,"node_id":"MDQ6VXNlcjczMDg1OTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3502804,"digest":"sha256:0e8528d6c4d375bf14cd3e8be3ab76b5cda9a464e9c39cc7f41769153f26ad29","download_count":146,"created_at":"2026-05-21T23:19:48Z","updated_at":"2026-05-21T23:19:49Z"},{"id":426556672,"node_id":"RA_kwDOJD5VD84ZbL0A","name":"caligula-x86_64-linux","label":null,"uploader":{"login":"ifd3f","id":7308591,"node_id":"MDQ6VXNlcjczMDg1OTE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3904752,"digest":"sha256:470da9381d2ac44bbd54485ac8c8afcc23fd2aecbce98cd1aba815d1ef5ed3ed","download_count":4435,"created_at":"2026-05-21T23:19:49Z","updated_at":"2026-05-21T23:19:51Z"}],"body":"## What's Changed\r\n\r\nThis v0.5.0 version bump release constitutes a very large refactor of 3000 or so lines. We've improved reliability and error handling significantly, and the refactors lay the groundwork for more features in upcoming release versions.\r\n\r\nThis release has been thoroughly tested, and we recommend upgrading for the improved error handling and bug fixes.\r\n\r\n### Features\r\n\r\n* The biggest one: **Error messages and logging are now much better!** It's easier to yell at me when stuff breaks! In fact, the program now gives you much more explicit instructions on how you can do that!\r\n  * Logs now record information about your OS, computer, and terminal. Now, all you need to add when submitting a bug report is the logs, and what distribution channel you got Caligula from! (Feel free to omit some of this data from your logs if you worry about your privacy.)\r\n\r\n<img width=\"2193\" height=\"640\" alt=\"image\" src=\"https://github.com/user-attachments/assets/9d90ae80-8995-4be4-aa4e-ed9dd7459625\" />\r\n\r\n### Bug fixes\r\n\r\n- https://github.com/ifd3f/caligula/issues/213: Fixed issue where running it in `nix-shell` broke. In fact, it's now completely impossible for this entire class of \"socket path too long\" issue to occur, because we've stopped using sockets entirely!\r\n\r\n### Internal improvements\r\n\r\nThese are nitty-gritty technical things that you probably won't care about or won't see, but they're at least worth a mention if you're curious about these things. Don't worry, this is all building up to something cool.\r\n\r\n* **Significantly improved error handling in the fancy TUI!** [It doesn't even return a `Result` anymore](https://github.com/ifd3f/caligula/blob/c6bef3efe085ffca25b0091ceec7dfc6128b22f0/src/ui/fancy_ui/mod.rs#L36), because it handles everything* gracefully! How cool is that?\r\n* **Returned to stdin/stdout-based IPC for the child process!** (see rationale in #222). That's how the nix-shell issue got fixed, and this should hopefully make the program more stable on weird system configurations.\r\n* **Made the UI code fully synchronous, and made our async code only run on a single thread!** This will improve resource utilization ever so slightly.\r\n* **Got rid of `anyhow` for everything that happens after the wizard.** And yes, I will get rid of it from the wizard as well. (For non-Rust devs, this basically means we're becoming much more rigorous about error handling.)\r\n* **Cleaned up our dependency graph!** (https://github.com/ifd3f/caligula/pull/228, https://github.com/ifd3f/caligula/pull/229). Thanks @sermuns!\r\n\r\n*Okay, it doesn't actually handle *everything*. [It does panic when your terminal stops accepting writes.](https://github.com/ifd3f/caligula/blob/c6bef3efe085ffca25b0091ceec7dfc6128b22f0/src/ui/fancy_ui/mod.rs#L102) But at that point, that's a you problem, not a me problem.\r\n\r\n## New Contributors\r\n* @sermuns made their first contribution in https://github.com/ifd3f/caligula/pull/228\r\n\r\n**Full Changelog**: https://github.com/ifd3f/caligula/compare/v0.4.11...v0.5.0","reactions":{"total_count":6,"+1":2,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":1}
