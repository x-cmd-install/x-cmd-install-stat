{"id":335315395,"author":{"login":"afc163","id":507615,"node_id":"MDQ6VXNlcjUwNzYxNQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAOmbgc4T_IHD","tag_name":"v11.0.0","target_commitish":"main","name":"v11.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-06-06T06:13:54Z","updated_at":"2026-06-06T06:14:54Z","published_at":"2026-06-06T06:14:54Z","assets":[],"body":"fanyi@11.0.0 来了！这一版的核心是**开箱即用**——内置免费 LLM 代理，装上就能用大模型翻译，无需任何配置。同时恢复了有道词典，LLM 结果支持流式语义着色，并新增了让 AI Agent 直接调用 fanyi 的 Agent Skill。🚀\n\n## ✨ 新功能\n\n- 🆓 **内置免费 LLM 代理**：未配置 `LLM_API_KEY` 时自动走内置免费代理，无需任何配置即可使用大模型翻译，真正开箱即用。\n- 🌊 **LLM 流式输出 + 语义着色**：边生成边上色，词性、例句、词义分别着色；等待时实时显示已耗时秒数。\n- 📖 **恢复有道词典**：与 iciba、LLM 三路结果并列展示。\n- 🤖 **新增 [Agent Skill](https://github.com/afc163/fanyi/tree/main/skills/fanyi)**：让 Claude Code、Claude.ai 等支持 Agent Skills 的工具自动调用 `fanyi` 翻译，技能会自动探测 `bun`/`pnpm`/`yarn`/`cnpm`/`tnpm`/`utoo`/`npm` 并代为安装。\n- 🔧 **自定义 LLM**：支持通过 `LLM_API_KEY` / `LLM_API_BASE_URL` / `LLM_MODEL_ID` 接入任意 OpenAI 兼容模型。\n\n## 💄 体验优化\n\n- 🌈 全新青紫流光 spinner，单字宽细亮线持续划过，文案固定不打断。\n- 🟢 词义文本绿色微渐变着色，亮度缓慢过渡，输出更灵动。\n- 🎨 词性标注（adj. n. v.）用 magenta、来源域名用 yellow、词形/词组/相关词用蓝色，分类更清晰。\n- ⏱️ LLM 请求等待时显示已耗时秒数。\n\n## 🛠️ 工程与稳定性\n\n- 🚀 LLM 代理从 Deno Deploy 迁移到 Cloudflare Worker。\n- 🔒 重写 LLM Prompt，消除占位符/指令泄漏；补全流式响应空值保护；修复 CodeQL 安全告警。\n- 🔁 切换 iciba 词典接口并改用 Node 原生 fetch。\n- 🤝 支持自定义 LLM 配置（#175），bump fast-xml-parser（#171）。\n\n---\n\n**Full Changelog**: https://github.com/afc163/fanyi/compare/v10.0.0...v11.0.0\n"}
