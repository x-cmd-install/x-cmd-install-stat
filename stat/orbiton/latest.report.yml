},{"id":586973844,"node_id":"RA_kwDODKFpt84i_IKU","name":"orbiton-2.74.5-openbsd_x86_64_static.tar.gz","label":null,"uploader":{"login":"xyproto","id":52813,"node_id":"MDQ6VXNlcjUyODEz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6319096,"digest":"sha256:dbf01139c82dc756e7b062701b31e11eee022bacf6f755eb59f13d6316bbca66","download_count":1,"created_at":"2026-09-24T22:24:50Z","updated_at":"2026-09-24T22:24:51Z"},{"id":586973660,"node_id":"RA_kwDODKFpt84i_IHc","name":"orbiton-2.74.5-windows_aarch64_static.zip","label":null,"uploader":{"login":"xyproto","id":52813,"node_id":"MDQ6VXNlcjUyODEz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5819015,"digest":"sha256:7fe0c4e22989902975e77c822239ebfd3661ca8e68206f019f6c2c7f5e024348","download_count":1,"created_at":"2026-09-24T22:24:43Z","updated_at":"2026-09-24T22:24:45Z"},{"id":586973624,"node_id":"RA_kwDODKFpt84i_IG4","name":"orbiton-2.74.5-windows_x86_64_static.zip","label":null,"uploader":{"login":"xyproto","id":52813,"node_id":"MDQ6VXNlcjUyODEz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6478201,"digest":"sha256:d1649cc0f8f873b19970a18860521a4d804ff5b5a7ad75c70976703a6fb23e35","download_count":1,"created_at":"2026-09-24T22:24:43Z","updated_at":"2026-09-24T22:24:44Z"}],"body":"\r\n### Various\r\n\r\n* Make it possible to run Orbiton at boot on Linux with `init=/usr/bin/o`.\r\n* Improve the `shift-tab` behavior and how lines can be dedented.\r\n* Make it possible to indent and dedent selected text.\r\n* Update gif recordings and `.tape` files.\r\n* Make the `ctrl-l` / jump to letter feature case insensitive.\r\n* Add a menu option for copying the last used command.\r\n* Improve the font detection.\r\n* Improve how lines with single-line comments are joined.\r\n* Simplify and improve support for Kitty.\r\n* Add a menu entry for block editing.\r\n* Support more function keys (F1 etc).\r\n* Add a menu entry for jumping to the next typo.\r\n* Improve support for tmux and some terminal emulators.\r\n* Use shorter descriptions in the `ctrl-o` menu.\r\n* Fix the cursor being hidden when running under Konsole.\r\n* Improve support for the Zutty terminal emulator.\r\n* Add support for `llmman`, ref #29, thanks @ericcurtin\r\n* Improve the look of the \"quick help\" box.\r\n* Improve smart indentation behavior.\r\n* Improve how lines are split.\r\n* Fix in issue with parsing given filenames with `+` in the path.\r\n* Fix an issue with jumping to the previous word.\r\n* Add back the `lig` symlink in the Makefile.\r\n* Improve syntax highlighting for RST tables.\r\n\r\n### Markdown related\r\n\r\n* Make checkbox toggles undo-able.\r\n* Improve syntax highlighting for Markdown.\r\n\r\n### Copy/cut/paste related\r\n\r\n* Paste diffs in a smarter way.\r\n* Improve copy/paste for multiple platforms.\r\n\r\n### Man page related\r\n\r\n* Let Esc clear searches when viewing man pages.\r\n* Remember the location when viewing man pages.\r\n* Improve man page syntax highlighting.\r\n\r\n### Hotkeys\r\n\r\n* Let `ctrl-w` only cycle git rebase keywords when editing git commit messages.\r\n* Adjust the `ctrl-r` behavior.\r\n* Improve the `ctrl-b` behavior.\r\n* Let `ctrl-n` and `ctrl-p` not jump between files, for some cases.\r\n* Let `ctrl-g` jump back after jumping to a definition.\r\n* Improve the `ctrl-g` behavior.\r\n* Disable `ctrl-up` and `ctrl-down` when editing Git commit messages.\r\n\r\n### Programming related\r\n\r\n* Add initial support for the Tim programming language.\r\n* Improve support for Object Pascal.\r\n* Improve syntax highlighting of multiline strings for Python.\r\n* Add support for `hare run`.\r\n* Improve LSP connection/startup behavior.\r\n* Improve the Zig template.\r\n* Improve the support for Kotlin.\r\n* Jump to the first merge conflict marker if the file contains merge conflict\r\nmarkers. `ctrl-n` can be used to jump to the next one.\r\n* Improve the \"jump back\" feature, after jumping to a definition.\r\n* Improve function name detection.\r\n* Add back generic syntax highlighting of unrecognized programming languages.\r\n\r\n### Linux distro related\r\n\r\n* Add `nixfmt` support + a template for Nix, ref #28.\r\n* Improve support for `nixd`.\r\n* Add initial support for `.nvchecker.toml` files.\r\n\r\n### Look and feel\r\n\r\n* Improve bullet point rendering in graphical book mode on macOS.\r\n\r\n### General\r\n\r\n* Update dependencies.\r\n* Update documentation.\r\n","mentions_count":1}
