{"id":420017408,"author":{"login":"cyberw","id":1134328,"node_id":"MDQ6VXNlcjExMzQzMjg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOABUGS84ZCPUA","tag_name":"2.47.0","target_commitish":"master","name":"2.47.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-21T19:42:51Z","updated_at":"2026-10-22T06:20:27Z","published_at":"2026-10-21T20:20:57Z","assets":[],"body":"## Breaking changes\r\n* Make /stop and /stats/reset POST-only. If you're using the web UI as an api, you'll need to adjust your calls https://github.com/locustio/locust/pull/3567\r\n\r\n## What's Changed\r\n* chore: move resonse -> response from geventhttpclient and set min geventhttpclient version to 2.5.1 by @even-even in https://github.com/locustio/locust/pull/3540\r\n* chore: up python 3.13 -> 3.14 in dockerfiles and up uv to 0.12.24 by @even-even in https://github.com/locustio/locust/pull/3542\r\n* Percent-encode the request target in FastHttpUser by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3541\r\n* Cancel the web UI run_time timer when a test is stopped or restarted by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3543\r\n* Keep OTEL request names that were already seen when the name cap is reached by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3544\r\n* Accept response_time=None in the OTEL and CSV request listeners by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3545\r\n* Report a malformed HTTP response in FastHttpUser as a failed request by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3549\r\n* Do not report a duplicate shape class when one locustfile imports it from another by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3553\r\n* Keep a fractional spawn rate in the --html report file name by @Lesereingrape in https://github.com/locustio/locust/pull/3555\r\n* Reject a non-finite spawn_rate instead of reporting a successful start by @Lesereingrape in https://github.com/locustio/locust/pull/3557\r\n* Fix RST warnings for **kwargs in Milvus/Qdrant user docstrings by @SatvikMishra08 in https://github.com/locustio/locust/pull/3551\r\n* Create the output directory for --html, --csv, --json-file and --logfile by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3550\r\n* Do not ask users that are already stopping to stop again by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3548\r\n* Use a local server instead of www.locust.io in two test_main tests by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3561\r\n* Keep the worker's message loop alive when a custom message listener raises by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3552\r\n* Do not crash locust_exception_handler when Environment.parsed_options is None by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3562\r\n* Do not skip the next listener when a listener removes itself while the event fires by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3563\r\n* Fire user_error when an exception is raised in User.on_start by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3564\r\n* Fix MongoDBClient querying the wrong database and never running the query by @SulimanAbdulrazzaq in https://github.com/locustio/locust/pull/3565\r\n* Make /stop and /stats/reset POST-only to close CSRF vector by @charan-rathore in https://github.com/locustio/locust/pull/3567\r\n* fix: don't crash the stats history CSV writer on workers with --csv-full-history by @ybai08 in https://github.com/locustio/locust/pull/3568\r\n* test: use local_http_server instead of www.locust.io in test_pytest_locustfile by @piyusha2005-bit in https://github.com/locustio/locust/pull/3569\r\n\r\n## New Contributors\r\n* @SatvikMishra08 made their first contribution in https://github.com/locustio/locust/pull/3551\r\n* @charan-rathore made their first contribution in https://github.com/locustio/locust/pull/3567\r\n* @ybai08 made their first contribution in https://github.com/locustio/locust/pull/3568\r\n* @piyusha2005-bit made their first contribution in https://github.com/locustio/locust/pull/3569\r\n\r\n**Full Changelog**: https://github.com/locustio/locust/compare/2.46.7...2.47.0","mentions_count":7}
