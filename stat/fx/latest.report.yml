der":{"login":"antonmedv","id":141232,"node_id":"MDQ6VXNlcjE0MTIzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":21018603,"digest":"sha256:1200eb9c7e78aae2108c84809a90e361193b2859c2ea528ad49f2e8b690620c9","download_count":85,"created_at":"2026-10-05T16:07:42Z","updated_at":"2026-10-05T16:07:49Z"},{"id":613037500,"node_id":"RA_kwDOBxb1Xs4kijW8","name":"fx_windows_amd64.exe","label":"","uploader":{"login":"antonmedv","id":141232,"node_id":"MDQ6VXNlcjE0MTIzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":22693376,"digest":"sha256:95ad6b786a435c7e06e15c7090f4fe0d6e92ef6f47e9a5e76f493a9626629f70","download_count":328,"created_at":"2026-10-05T16:07:42Z","updated_at":"2026-10-05T16:07:49Z"},{"id":613037501,"node_id":"RA_kwDOBxb1Xs4kijW9","name":"fx_windows_arm64.exe","label":"","uploader":{"login":"antonmedv","id":141232,"node_id":"MDQ6VXNlcjE0MTIzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":21131776,"digest":"sha256:a596df619f4126914b3e1c8367820165ba5d292fb53cdf177cfceaf840a7d973","download_count":23,"created_at":"2026-10-05T16:07:42Z","updated_at":"2026-10-05T16:07:49Z"}],"body":"This is the biggest fx release yet. You can now write queries inside the viewer and watch the result update as you type, with Tab completion for keys. fx also reads six new input formats, runs on Bubble Tea v2, and has vim-style commands.\r\n\r\n<p align=\"center\"><img src=\"https://github.com/antonmedv/fx/raw/master/.github/images/query.gif\" width=\"600\" alt=\"Interactive query in fx\"></p>\r\n\r\n## \u26a1 Interactive queries\r\n\r\nPress <kbd>.</kbd> in the viewer and start typing. As you type:\r\n\r\n- **Live preview.** The result updates on every keystroke, so you see what your query does before you press Enter.\r\n- **Tab completion.** Tab completes keys from your data, even inside lambdas. On arrays it walks every element and document. `.items.` on an array becomes `.items[].key`.\r\n- **The fx syntax you know**, with multiple arguments: `.users ?.active @.name` filters and then maps, like on the command line.\r\n- **JS syntax highlighting** in the query input.\r\n- **History.** <kbd>\u2191</kbd>/<kbd>\u2193</kbd> go through earlier queries, and your unfinished draft is kept.\r\n- **Esc to cancel.** The query is dropped and the original document comes back.\r\n- **Streams and slow queries work.** A query that never ends can be cancelled, and streamed documents keep flowing in.\r\n\r\nThe same completion engine now powers shell completion too, so `fx data.json .us<Tab>` behaves the same in the TUI and in your shell.\r\n\r\n## \ud83d\udcc4 New input formats: XML, HTML, EDN, MAML\r\n\r\n```sh\r\nfx feed.xml .rss.channel.item[].title\r\nfx page.html .html.body\r\nfx deps.edn .paths\r\nfx config.maml .server.port\r\n```\r\n\r\n- **XML** (`--xml`, `.xml`, `.svg`): attributes become `@attr`, text becomes `#text`, repeated children become arrays. This is the familiar xmltodict mapping. Namespace prefixes stay as written, and non-UTF-8 charsets are handled. A file with several root elements becomes a stream of JSON documents.\r\n- **HTML** (`--html`, `.html`, `.htm`): parsed as a full HTML5 tree, so even messy real-world pages load. `<meta charset>` is respected.\r\n- **EDN** (`--edn`, `.edn`): keywords lose the colon, so `:paths` is queried as `.paths`. Key order and big integers are kept.\r\n- **MAML** (`--maml`, `.maml`): key order and exact number text are kept. `MAML.parse` and `MAML.stringify` are also available in queries, and in the npm version of fx.\r\n\r\n## \u2328\ufe0f Vim-style commands\r\n\r\nPress <kbd>:</kbd> to open the command line:\r\n\r\n| Command | What it does |\r\n|---|---|\r\n| `:w [file]` | Write the current view, or the query result, to a file |\r\n| `:wq` | Write and quit |\r\n| `:w !cmd` | Pipe the JSON to a shell command: `:w !less`, `:w !vim -`, `:w !code -`, `:w !pbcopy` |\r\n| `:q` | Quit |\r\n| `:<n>` | Go to line *n* |\r\n\r\n## \ud83e\udee7 Bubble Tea v2\r\n\r\nfx now runs on Bubble Tea v2:\r\n\r\n- **Yank works over SSH.** Copying uses OSC 52 and falls back to the local clipboard tool. This fixes #283 and #413.\r\n- The terminal **window title shows the file name**.\r\n- **Pasting into the query and search inputs** works.\r\n- Colors are downsampled correctly when output goes to a pipe.\r\n\r\n## \ud83e\udded Viewer improvements\r\n\r\n- <kbd>%</kbd> jumps to the matching bracket.\r\n- <kbd>r</kbd> reloads the file.\r\n- <kbd>Ctrl-E</kbd>/<kbd>Ctrl-Y</kbd> scroll the view one line at a time.\r\n- **Search in the preview pane**, with highlighting and navigation keys.\r\n- Sizes of objects and arrays are shown next to their keys.\r\n- The help screen is grouped by category.\r\n- `--no-tui` prints the output and never opens the viewer.\r\n\r\n## \ud83e\uddf0 New functions\r\n\r\n- `sortKeys` sorts object keys recursively.\r\n- `del(key)` removes a key from an object or an index from an array: `.users map(del('password'))`.\r\n- `exit(code)` exits fx with the given status code.\r\n\r\n## \ud83d\udee1\ufe0f Stability\r\n\r\nA lot of work went into making fx hard to break:\r\n\r\n- The JS engine can no longer crash fx. Panics inside queries are reported as errors, and only previews time out.\r\n- Several ways to crash or freeze the viewer were fixed, including ones involving deleted nodes and searches that were still running.\r\n- Windows TTY raw mode is restored after reading stdin.\r\n- UTF-8 BOMs are handled.\r\n- fx works when `$HOME` is not set.\r\n- File arguments are detected correctly in non-TTY contexts.\r\n- String escapes are decoded in preview and print.\r\n\r\n## \ud83c\udfb2 One more thing\r\n\r\n```sh\r\nfx --dungeon\r\n```\r\n\r\nThere's a roguelike dungeon hidden inside your JSON viewer. Good luck. \ud83d\udde1\ufe0f\r\n\r\n## \u26a0\ufe0f Breaking changes\r\n\r\n- **<kbd>Esc</kbd> no longer quits.** Use <kbd>q</kbd> or <kbd>Ctrl-C</kbd>.\r\n- **The <kbd>v</kbd> key (open in editor) is removed.** Use `:w !vim -`, or any other editor that reads from stdin.\r\n- **The `dig` feature is removed.** Interactive queries with Tab completion replace it.\r\n- **Game of Life is removed.** It has been replaced by the dungeon.\r\n- fx exits with a non-zero status on empty input.\r\n- Save operations are rejected for non-JSON input files, so a YAML or XML file is never overwritten with JSON.\r\n\r\n---\r\n\r\nFull documentation: **[fx.wtf](https://fx.wtf)**\r\n\r\n**Full Changelog**: https://github.com/antonmedv/fx/compare/39.2.0...40.0.0\r\n","reactions":{"total_count":11,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":5,"rocket":4,"eyes":0}}
