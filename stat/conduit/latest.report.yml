he source down on stop (#3295) (@devarismeroxa)\n* 98f44ee89fbad8fe573a18769463d83c748a80a6: fix(funnel): fail the run when a batched flush fails while the source is idle (#3331) (@devarismeroxa)\n* 48b1aefd67fa7c2e33ef9a295a847bf153bc79ea: fix(funnel): release a fan-out nack only after every destination has voted (#3323) (#3324) (@devarismeroxa)\n* f9858a3c9a2890a7e39cac80a0226eb0c5375d08: fix(funnel): release filtered and nacked source acks in order behind buffered batches (#3294) (@devarismeroxa)\n* 680f1b4a56dc5c1775591d7cf0996fb1192e04fc: fix(funnel): release queued source acks on the synchronous path (#3300) (@devarismeroxa)\n* b9a6ae47fcaadad52a084eac4b9b4fc432e100f8: fix(kcmigrate): report that Kafka Connect wrote column defaults for NULL on Debezium sources (#3360) (@devarismeroxa)\n* 98271672dc54d6381a63848bbb11459e010bf242: fix(kcmigrate): translate table.include.list to bare postgres table names with search_path (#3353) (@devarismeroxa)\n* 292897f8f74a0322ae2b3fb8b43a81d7331d9581: fix(lifecycle): do not panic on an empty destination ack response (#3299) (@devarismeroxa)\n* 09796006acb4b057d1d407394a83a74b3a3a3315: fix(lifecycle-poc): arch-v2 owns destination batching, connector defaults included (#3321) (#3339) (@devarismeroxa)\n* b5d7781c6560e5feee9571e21957fcaec06925e6: fix(orchestrator): stop a failed connector-delete commit from panicking (#3366) (@devarismeroxa)\n* a23efb64be780109998cac2e327a59c705edfdf4: test(api): interleave the token timing measurement (#3288) (@devarismeroxa)\n* cdbf73ebc7c449063834ec9110bfd42e845d8457: test(chaos): do not let a stalled child make the fan-out redelivery guard flake (#3313) (@devarismeroxa)\n* 47843276effccae58edb1298539875dc75bb7ec0: test(chaos): drop a killed writer's partial line before the FIFO restart (#3326) (@devarismeroxa)\n* fd8ec8f4d17d1cc17ffc1b45d6b8959a30797306: test(chaos): trim torn destination lines at file-test kill boundaries (#3332) (@devarismeroxa)\n* 287b7eb96765a45e6833f2b8e3478d806de48d41: