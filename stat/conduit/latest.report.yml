lication/zip","state":"uploaded","size":24115778,"digest":"sha256:2ec711d9d49ffaaac52c4965d7336b14414d1326c5813f62dcbb645bcde6b5c2","download_count":2,"created_at":"2026-10-20T04:39:14Z","updated_at":"2026-10-20T04:39:15Z"},{"id":658276780,"node_id":"RA_kwDOGqIHV84nPIGs","name":"conduit_0.20.5_Windows_arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":347317,"digest":"sha256:539053fd68e29c18ee40e8bbf418fd07cd810fcdb54d2973d8e793ed0da6ebc7","download_count":1,"created_at":"2026-10-20T04:39:21Z","updated_at":"2026-10-20T04:39:21Z"},{"id":658276502,"node_id":"RA_kwDOGqIHV84nPICW","name":"conduit_0.20.5_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26735480,"digest":"sha256:05e7bbe57f8349cd533d6bcdd1b6c72623538232b5688ebff03633f2167db016","download_count":4,"created_at":"2026-10-20T04:39:14Z","updated_at":"2026-10-20T04:39:16Z"},{"id":658276807,"node_id":"RA_kwDOGqIHV84nPIHH","name":"conduit_0.20.5_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":347536,"digest":"sha256:1436169b3d1c7bb342cc4747235461f32a996e8f0c6bde479f6dff936db5019d","download_count":1,"created_at":"2026-10-20T04:39:21Z","updated_at":"2026-10-20T04:39:22Z"}],"body":"**Security advisories:** [GHSA-fhm8-v27h-q65j](https://github.com/ConduitIO/conduit-commons/security/advisories/GHSA-fhm8-v27h-q65j) (conduit-commons#342), [GHSA-2cr9-8q6v-733r](https://github.com/ConduitIO/conduit-commons/security/advisories/GHSA-2cr9-8q6v-733r) (conduit-commons#312)\n\n# Conduit v0.20.5\n\nv0.20.5 is a patch release. It fixes three ways records could be changed without an error: copies of a record\nsharing nested data, Avro decoding dropping map keys, and Avro encoding rewriting the values it was given. It\nalso fixes a self-referencing Avro schema hanging the pipeline. Embedded library: conduit-commons v0.7.1 \u2192\nv0.7.2 (#3216). The built-in Postgres connector is v0.14.4 \u2192 v0.14.5, which fixes a silent value conversion after a\ncolumn type change.\n\nThese fixes were planned for v0.20.3. v0.20.3 and v0.20.4 were cut on conduit-commons v0.7.1 and do not have them.\n\nUpgrading from v0.20.1 or earlier? Read the\n[v0.20.2 notes](https://github.com/ConduitIO/conduit/releases/tag/v0.20.2) first.\n\n## Upgrade if you fan out, clone or split records\n\n**Copies of a record shared nested data** (conduit-commons#336). Affected: v0.8.0 through v0.20.4.\n\nConduit copies a record when a pipeline sends it to two or more destinations (with one destination there is no\ncopy), and the `clone` and `split` processors copy records too. Those copies shared their nested arrays and\nnested objects with each other and with the original. A processor that changed one of them in place changed\nevery copy. The most likely case is a JavaScript processor (`custom.javascript`) that edits an array element on\none destination's branch: the other destinations then received the edited value too. There was no error.\n\n**You are affected only if** a pipeline has two or more destinations, or a `clone` or `split` processor, **and**\na processor after that point changes a nested array or nested object in place. Standalone (WASM) processors are\nnot affected unless the processor itself calls `Record.Clone`; rebuild those against a processor SDK built on\nconduit-commons v0.8.3 or later (SDK releases on fixed commons are in progress).\n\n**How to check:** compare what two destinations of the same pipeline received for one source record, or compare\na destination record with the source. A nested value that changed on a branch whose processors never touch it is\nthe sign.\n\n- Upgrade to v0.20.5. Each copy is now independent. Inferred Avro schemas and field types do not change.\n- Records written before the upgrade are not repaired.\n\n## Upgrade if you decode Avro\n\n**Some nested Avro unions lost map keys on decode** (conduit-commons#312). Affected: v0.20.0 through\nv0.20.4, reproduced. Earlier releases back to v0.9.0, the first with `avro.decode`, are probably affected but were\nnot checked.\n\nIt happens when a union has a `record`, `enum`, `fixed`, `map` or `array` branch that itself contains another\nunion, for example `[\"null\", map<[\"null\",\"int\"]>]`. Map keys could be dropped with no error, a nested map could be\nflattened one level, and some values stayed in their union wrapper. One shape failed with\n`expected single value encoded as a map` instead.\n\nIt affects `avro.decode` and the connector SDK's schema middleware, which decodes for every built-in destination\nwhen a record carries a schema.\n\n**How to check:** see whether any schema you decode has the shape above. If one does, compare a sample of\ndestination records with the source and look for missing map entries and values one level higher than expected.\n\n- Upgrade to v0.20.5. Union values are now unwrapped by walking the schema together with the value.\n- Records decoded before the upgrade are not repaired. Records that hit the error case failed and were not written.\n- Standalone connectors and processors carry their own conduit-commons. Rebuild them once connector-sdk and processor-sdk releases built on conduit-commons v0.7.2/v0.8.3 or later are out (in progress).\n\n## Upgrade if you encode Avro\n\n**Avro encoding rewrote the values it was given** (conduit-commons#342).\nAffected: v0.11.0 through v0.20.4.\n\nTo encode a union, the encoder wrapped each value in place, inside the record's own maps and arrays: `\"bar\"`\nbecame `{\"string\": \"bar\"}`. Anything else holding the same map or array saw the wrapped value afterwards. If that\nvalue was encoded again, the second encode either failed, or, when the wrapper happened to fit another branch of\nthe union (for example a `map` of strings), succeeded and wrote the wrapper instead of the value. There was no\nerror in that case.\n\nThis is the encoder behind `avro.encode` and behind the connector SDK's and processor SDK's schema middleware,\nwhich encode records by default (`sdk.schema.extract.payload.enabled` and `.key.enabled` are `true`).\n\n**You are affected only if** a schema has a union with a `map` or `array` branch, or a union inside a `map` or\n`array`, **and** the same nested map or array is encoded twice. That happens when a record's `Before` and `After`\nshare a nested value, when copies of a record shared nested data (#336 above), or when a connector reuses its own\ndata between records.\n\n**How to check:** decode destination records with their schema and look for values that arrived as a one-key map\nsuch as `{\"string\": \"\u2026\"}` where a plain value was expected. Encode errors on records that share data with an\nearlier record are the loud form of the same bug.\n\n- Upgrade to v0.20.5. Encoding no longer changes its input, and two encodes of one value give the same bytes.\n- **Standalone connectors and processors encode in their own process with their own copy of conduit-commons, so\n  upgrading Conduit does not fix them.** Rebuild them once connector-sdk and processor-sdk releases built on conduit-commons v0.7.2/v0.8.3 or later are out (in progress).\n- Records written before the upgrade are not repaired.\n\n## Fixes\n\n- **A self-referencing Avro schema no longer hangs the pipeline** (conduit-commons#314). A schema that refers to\n  itself, directly or through another type (a linked list `L{next: [\"null\",\"L\"]}`, a tree `T{kids: array<\"T\">}`),\n  made schema parsing recurse until the process ran out of memory. Parsing now stops at a reference to a type\n  already on the current path. Such schemas now parse, encode and decode.\n- **The built-in Postgres destination no longer converts values after a column type change**\n  ([conduit-connector-postgres#367](https://github.com/ConduitIO/conduit-connector-postgres/issues/367), fixed in\n  built-in postgres v0.14.5, [#3218](https://github.com/ConduitIO/conduit/pull/3218)). Affected: built-in postgres\n  v0.14.4 and earlier. A running destination kept the statements it had prepared, with their parameter types, so after\n  `ALTER TABLE ... ALTER COLUMN ... TYPE` on a table it writes, Postgres converted new values to the new type without an\n  error: 5/2 written to a column changed from `numeric` to `integer` was stored as 3. The destination now describes\n  each statement before it runs it (pgx `describe_exec`), so the next write after the change is typed for the new column\n  and a value the new type cannot hold fails the write (the record is nacked) instead of being converted. Rows written\n  before the upgrade are not repaired. An explicit `default_query_exec_mode` in the destination's `url`, keyword/value\n  connection string or service file is kept as set, and an explicit cache mode logs a warning at start.\n  **Opt-out:** add `default_query_exec_mode=cache_statement` to the `url` to reuse prepared statements as before. Use\n  it on a direct connection only, and only if the tables the pipeline writes never change type while it runs; with it\n  the bug above returns, and behind PgBouncer or another pooler that shares prepared statements a restart does not\n  clear it.\n\n## Before you upgrade\n\n- **Some Avro values that encoded before now fail to encode.** A value that fits more than one branch of a union\n  is now an error (`ErrSchemaValueMismatch`, \"ambiguous\") instead of being written as one of the branches by\n  guess. Examples: a map that is also a valid record of another branch, a string that is also an enum symbol in a\n  union with an array or map branch, a `time.Time` in a union with both a date and a timestamp. In a test of\n  20,000 random union-heavy schema shapes, 18 now fail this way. Before, those 18 were written wrong without an\n  error. The record is nacked and goes to the DLQ or stops the pipeline, depending on its DLQ settings. To fix it,\n  pass the value in its named form (`{\"<branch name>\": value}`) or make the union's branches distinguishable.\n- **Record copies no longer share nested data** (conduit-commons#336). A processor that relied on an in-place\n  change on one copy showing up in another, on purpose or by accident, no longer sees it. Copying a record now\n  allocates its nested arrays and objects instead of sharing them.\n- **Encoding allocates more.** For schemas with unions through maps or arrays, each encode copies the containers\n  it wraps.\n- Neither cost was benchmarked on the v0.20 line, and we make no performance claim.\n- **Postgres destination: a value that does not fit the column type now fails the write.** After an\n  `ALTER COLUMN ... TYPE` on a running pipeline, such a record is nacked and goes to the DLQ or stops the pipeline,\n  depending on its DLQ settings. Before, it was converted without an error. Describing each statement adds a round\n  trip. Measured on the postgres connector's `main` branch, throughput was 35% and 16% lower in the measured\n  cases; it was **not** measured on v0.14.x or on the v0.20 line. Opt-out:\n  `default_query_exec_mode=cache_statement` (see Fixes).\n- **Decoded Avro maps can change shape.** For schemas with the conduit-commons#312 shape, decoded records now\n  carry every map key, and values are no longer left in their union wrapper. Consumers that worked around the old\n  shape need to change back.\n- **Self-referencing Avro schemas now work.** Before, they hung the pipeline, so nothing relies on the old\n  behavior.\n- **Downgrading to v0.20.4 or earlier brings back these bugs.** Nothing stored changes between v0.20.4 and\n  v0.20.5.\n\n## Known issues\n\n- **Processors that address a nested field fail after fan-out, `clone` or `split`.** `field.set`,\n  `field.exclude`, `field.rename` and other processors that use a nested reference such as `.Payload.After.a.b`\n  fail on a record that was copied by fan-out to two or more destinations, or by `clone` / `split`. The record is\n  nacked and goes to the DLQ or stops the pipeline; nothing is changed silently. With one destination and no\n  `clone` or `split`, they work. This is unchanged from earlier v0.20 releases. Workaround: put nested-path\n  processors before the fan-out, as pipeline-level processors rather than destination-level ones. Fixed in v0.21.\n- Everything under Known issues in the v0.20.1 and v0.20.2 notes still applies, except conduit-commons#312 and\n  #314, which are fixed here.\n\n## Verify this release\n\nRequires [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) v3 or later.\nDownload `checksums.txt`, `checksums.txt.sigstore.json` and your files into one directory:\n\n```sh\ncosign verify-blob \\\n  --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/v0.20.5' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  --bundle checksums.txt.sigstore.json \\\n  checksums.txt\n\n# only once the signature verifies (on macOS: shasum -a 256 --check --ignore-missing)\nsha256sum --check --ignore-missing checksums.txt\n```\n\nThe Docker image (pin the digest it prints):\n\n```sh\ncosign verify \\\n  --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/v0.20.5' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  ghcr.io/conduitio/conduit:v0.20.5\n```\n\nThe SBOM is attested on each platform digest, not the tag or index:\n\n```sh\nDIGEST=$(docker buildx imagetools inspect --raw ghcr.io/conduitio/conduit:v0.20.5 \\\n  | jq -r '.manifests[] | select(.platform.os == \"linux\" and .platform.architecture == \"arm64\") | .digest')\n\ncosign verify-attestation \\\n  --type spdxjson \\\n  --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/v0.20.5' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  \"ghcr.io/conduitio/conduit@$DIGEST\" \\\n  | jq -r '.payload | @base64d | fromjson | .predicate' > conduit-linux-arm64.spdx.json\n```\n\nUse `amd64` for the other platform.\n\n---\n\n## Changelog\n* 54f2ba703c5ce39cb93771d8999fb6e2e09c6f87: fix(deps): bump conduit-commons to v0.7.2 (#3216) (@devarismeroxa)\n* 37d8d8a48459852e85d743dd24f4e892c0d07871: fix(deps): bump conduit-connector-postgres to v0.14.5 (#3218) (@devarismeroxa)\n\n## Release Artifacts\n\n### OSX Darwin\n\n- \ud83d\udce6 [conduit_0.20.5_Darwin_arm64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Darwin_arm64.tar.gz)\n- \ud83d\udce6 [conduit_0.20.5_Darwin_x86_64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Darwin_x86_64.tar.gz)\n\n### Linux\n\n- \ud83d\udce6 [conduit_0.20.5_Linux_arm64.deb](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_arm64.deb)\n- \ud83d\udce6 [conduit_0.20.5_Linux_arm64.rpm](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_arm64.rpm)\n- \ud83d\udce6 [conduit_0.20.5_Linux_arm64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_arm64.tar.gz)\n- \ud83d\udce6 [conduit_0.20.5_Linux_i386.deb](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_i386.deb)\n- \ud83d\udce6 [conduit_0.20.5_Linux_i386.rpm](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_i386.rpm)\n- \ud83d\udce6 [conduit_0.20.5_Linux_i386.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_i386.tar.gz)\n- \ud83d\udce6 [conduit_0.20.5_Linux_x86_64.deb](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_x86_64.deb)\n- \ud83d\udce6 [conduit_0.20.5_Linux_x86_64.rpm](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_x86_64.rpm)\n- \ud83d\udce6 [conduit_0.20.5_Linux_x86_64.tar.gz](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Linux_x86_64.tar.gz)\n\n### Windows\n\n- \ud83d\udce6 [conduit_0.20.5_Windows_arm64.zip](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Windows_arm64.zip)\n- \ud83d\udce6 [conduit_0.20.5_Windows_x86_64.zip](https://conduit.gateway.scarf.sh/conduit/download/v0.20.5/conduit_0.20.5_Windows_x86_64.zip)\n\n## Verifying\n\n`checksums.txt` is signed with [Sigstore](https://www.sigstore.dev/) keyless signing (`checksums.txt.sigstore.json`), and each archive has an SPDX SBOM. The Docker image is signed by digest. See [Verifying a release](https://github.com/ConduitIO/conduit/blob/main/docs/releases.md#verifying-a-release).\n\n```\ncosign verify-blob \\\n  --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/v0.20.5' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  --bundle checksums.txt.sigstore.json checksums.txt\nsha256sum --check --ignore-missing checksums.txt\n```\n\n## Docker images\n\nTo pull the image, you can execute the following command:\n```\ndocker pull conduit.docker.scarf.sh/conduitio/conduit:v0.20.5\n```\n![conduit-release-view](https://static.scarf.sh/a.png?x-pxid=3df89eef-1623-4cd5-9dbc-a6b36588a0eb)\n","mentions_count":1}
