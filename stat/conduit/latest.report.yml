n): conduit generate \u2014 AI-assisted pipeline generation (#2647) (@devarismeroxa)\n* befbf669b4555f0316031e4589be46f9aeb5367c: docs(design): embed / libconduit embedded v1 (#2651) (@devarismeroxa)\n* 8ad099fefb1fcda8aad198fe08dc966b62c9fac8: docs(design): gRPC embed client library (supersedes C-ABI) (#2675) (@devarismeroxa)\n* d2f0826f3732360a8b746b6501595104fee706a1: docs(design): gRPC-standalone Rust connector SDK (#2650) (@devarismeroxa)\n* 6d2b38d10886fb6db0addef610b1513322a7c4f0: docs(design): partition-claims protocol RFC (v0.19 Workstream 5) (#2665) (@devarismeroxa)\n* 851c406e39f7910505b3ebbe2da0d21af7e6806c: docs(roadmap): reconcile Phase 0/1 checkboxes with shipped state (#2638) (@devarismeroxa)\n* ec258ab51a6e75dea360e441014c72d4c45b170d: feat(cli): pipelines init --template (vendored gallery) (#2678) (@devarismeroxa)\n* 5a3aef98218e682beba5da707fed67af02844f33: feat(embed): B2 pipelines-in-code builder (#2673) (@devarismeroxa)\n* e6a8b9f1868e7af57cc730cf5b0f13af05d86644: feat(embed): libconduit B1 Go embedding API (New/Engine/Handle/Import) (#2667) (@devarismeroxa)\n* 8f41580cf45d91223fa4c701234f0c273fe7d1e9: feat(generate): eval harness + benchmark corpus (design-only path) (#2674) (@devarismeroxa)\n* bf64f751f3d65d20edf8126faadebc74608898aa: fix(cli): pipelines init refuses to silently overwrite, adds --force/--dry-run/--json (#2666) (@devarismeroxa)\n* 9d21ccd60d426ee93d93cb5a81ba0638cd26fa20: fix(embed): lazy DB open + skip file provisioning on empty PipelinesDir (B1 DX hardening) (#2676) (@devarismeroxa)\n* 045f283c55f9e03d65d9d1de36fec4de3f1d7a1d: fix(engine): persist position before plugin ack \u2014 sev-0 Source.Ack ordering (Approach A) (#2680) (@devarismeroxa)\n* 8e0432ebbb7dc5c6f1c0f9dc409d8672afd3349b: fix: `conduit open docs` opens conduitdata.io/docs (was dead conduit.io) (#2664) (@devarismeroxa)\n* 6da2c7264e13727e281dc64645db8a23a7b0fa80: test(cli): shared CLI contract schema-golden test (v0.19 workstream 8) (#2668) (@devarismeroxa)\n\