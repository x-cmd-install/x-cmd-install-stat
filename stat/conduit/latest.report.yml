ication/zip","state":"uploaded","size":23769361,"digest":"sha256:1c98a907e734bef5a7117d5659e1182e3c2cf6f97a2c82afbd9d197e47db56d7","download_count":2,"created_at":"2026-10-12T17:45:35Z","updated_at":"2026-10-12T17:45:36Z"},{"id":634513024,"node_id":"RA_kwDOGqIHV84l0eaA","name":"conduit_0.20.0_Windows_arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":345813,"digest":"sha256:92d9d3680671eb2931c81ee6a7b35ff626fb4428b0326acad5bf53348968660c","download_count":2,"created_at":"2026-10-12T17:45:40Z","updated_at":"2026-10-12T17:45:41Z"},{"id":634512671,"node_id":"RA_kwDOGqIHV84l0eUf","name":"conduit_0.20.0_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26347729,"digest":"sha256:7a7919aef873fb1b1b44d174247a837bde50ccf59340f64296c4c9918c03827a","download_count":3,"created_at":"2026-10-12T17:45:35Z","updated_at":"2026-10-12T17:45:37Z"},{"id":634513063,"node_id":"RA_kwDOGqIHV84l0ean","name":"conduit_0.20.0_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":346031,"digest":"sha256:7ee18195242b78b0fe19d8e2962e1eb7a307ea60d3dfcb617e44b120e518f2c7","download_count":3,"created_at":"2026-10-12T17:45:41Z","updated_at":"2026-10-12T17:45:41Z"}],"body":"v0.20.0 is the first stable release since v0.19.0 (2026-07-24). It adds `conduit generate`, which\nwrites a pipeline config from a plain-English description; a Postgres-to-pgvector RAG pipeline\ntemplate with new chunking and embedding processors; outbound HTTP for WASM processors, closed by\ndefault; and signed release artifacts. It fixes a SEV-0 bug, present in v0.19.0, where a Postgres\nsnapshot-to-CDC handoff could stall silently, and a gRPC server panic. It also changes how stopped\npipelines are reported and recovered; read [Behavior changes](#behavior-changes) before you\nupgrade. The default pipeline engine is unchanged. The RAG pipeline needs the preview engine\n(arch-v2).\n\n## Upgrading from v0.19.0\n\nUpgrade if you run v0.19.0:\n\n- **SEV-0 snapshot-to-CDC stall.** In v0.19.0 the Postgres source could stop after its snapshot\n  without starting CDC. Inserts, updates and deletes after the snapshot were not delivered, there\n  was no error, and the pipeline still showed running. Fixed in this release.\n- **gRPC advisory GO-2026-6443.** v0.19.0 ships grpc v1.82.1, which can panic on a request with no\n  `:authority` or `Host` header. v0.20.0 ships v1.83.2.\n\nCheck these before you upgrade:\n\n- **Stop and shutdown status.** A force stop is now `UserStopped`, not `Degraded`, and no longer\n  triggers `pipelines.exit-on-degraded`. Stopped pipelines can carry an error message. Pipelines\n  stopped by a shutdown are `SystemStopped` and start again on the next boot. If you alert on\n  `Degraded` or on status alone, see [Behavior changes](#behavior-changes).\n- **Error text.** Fan-out on the default engine now fails with `pipeline.fanout_requires_arch_v2`,\n  and `Start` during shutdown fails with `pipeline.shutting_down`. Update anything that matches on\n  error text.\n- **Community links.** The Discord invite is gone. Use\n  [GitHub Discussions](https://github.com/ConduitIO/conduit/discussions). Docs links now point to\n  `conduitdata.io`; `conduit.io` no longer resolves.\n- **Mirrors.** If you mirror releases, also copy `checksums.txt.sigstore.json` and the\n  `.sbom.json` files.\n\n## Highlights\n\n### `conduit generate` (preview)\n\n`conduit generate \"<description>\"` writes a pipeline config file using Anthropic, OpenAI or a local\nOllama server. Set `ANTHROPIC_API_KEY` or `OPENAI_API_KEY`, or run Ollama, and pick one with\n`--provider` if more than one is available. Every candidate goes through the same offline check as\n`conduit pipelines validate`, including that each connector it names exists, and the command never\nwrites an invalid config. It does not deploy anything: there is no `--apply` flag, and deploying is\nthe usual `conduit pipelines deploy` step.\n\nThe command is a preview. Review what it writes before you deploy it. On our 28-request test\ncorpus with Claude Sonnet 5, every generated config validated, and about two in three (64\u201368%\nover three runs) matched what the request asked for. It is reliable at picking connectors\n(45/45 on requests that need no processor) and often leaves out a requested processor step (8/39\non requests that need one). These are measurements from one model on a small corpus. A weekly\neval tracks them from v0.20.1, and processor-aware generation is planned for v0.21.\n\n> **Correction (2026-10-12):** the semantic-match and processor figures above understate\n> `conduit generate`. Our scorer did not accept processor names written with the `builtin:` prefix,\n> which is the form the prompt tells the model to use, so some correct pipelines were scored as\n> missing a processor. Rescoring the same recorded outputs with the fixed scorer moves the corpus\n> from 18 to 22 of 28 matched requests. The validation result is unaffected. Corrected numbers,\n> measured on fresh runs, will be in the v0.20.1 release notes.\n\n```sh\nconduit generate \"read from postgres and write new rows to s3 as json\" --out pg-to-s3.yaml\nconduit pipelines validate pg-to-s3.yaml\n```\n\n`--json` is supported.\n\n### RAG pipeline template (requires the preview engine and egress)\n\nThe `postgres-pgvector-rag` template reads Postgres (snapshot, then CDC), splits text with\n`ai.chunk`, embeds it with `ai.embed`, and upserts into pgvector. Writes are keyed so redelivery\nand updates converge to one row per chunk, and deleting a source row deletes every chunk made from\nit.\n\nIt needs two things the defaults don't give you:\n\n1. **The preview engine, `--preview.pipeline-arch-v2`.** `ai.chunk` turns one record into many,\n   and the default engine passes one record in and one out. On the default engine the pipeline\n   stops at the chunk step with `pipeline.fanout_requires_arch_v2`.\n2. **The egress ceiling.** WASM processors have no network access unless the operator allows it.\n   The template already sets `ollama.baseURL: http://127.0.0.1:11434` and\n   `sdk.egress.allow: http://127.0.0.1:11434` on the embed processor. You open the ceiling with\n   `--processors.egress.enabled --processors.egress.allow http://127.0.0.1:11434`, or\n   `processors.egress.enabled: true` and `processors.egress.allow: [http://127.0.0.1:11434]` in\n   `conduit.yaml`. Without it every embed call fails with\n   `http egress is not enabled for this processor` and the record is nacked.\n\nUse the IP literal. The egress gate rejects `http://localhost:11434` as an allowlist entry and\nonly admits loopback through an exact IP:port entry. If you scaffolded this template from a\nnightly up to and including v0.20.0-nightly.20261007, change `ollama.baseURL` to `http://127.0.0.1:11434` and add\n`sdk.egress.allow: http://127.0.0.1:11434` to the `embed` processor, or scaffold it again.\n\n```sh\nconduit pipelines init --template postgres-pgvector-rag   # prints the prerequisites\nconduit connectors install pgvector\nconduit processor-plugins install ai.chunk\nconduit processor-plugins install ai.embed\nconduit run --preview.pipeline-arch-v2 \\\n  --processors.egress.enabled --processors.egress.allow http://127.0.0.1:11434\n```\n\nCreate the pgvector table first; the template README has the SQL and the settings for a hosted\nprovider such as OpenAI. `ai.chunk` and `ai.embed` (0.1.0) require Conduit 0.20.0 or later.\n`conduit-connector-pgvector` v0.1.0 is a standalone connector, not built in.\n\nRegistry installs depend on a fresh signature on the hosted index. The client refuses an index\nsigned more than 7 days ago with `registry.index_stale`. For offline or air-gapped hosts, use\n`--index-file` (a local signed index) or `--bundle` (a signed bundle).\n\n**The flag is temporary.** Conduit is moving to a single pipeline engine that supports one-to-many\nprocessors, fan-out and multiple sources and destinations, so you won't have to choose. Until that\nengine is the default, the RAG template needs `--preview.pipeline-arch-v2`. Once it is, the flag\nwill be accepted and ignored with a deprecation warning before it is removed. We make no\nperformance claims for arch-v2 and don't recommend it for pipelines that don't need fan-out.\n\n### Host egress for WASM processors (processor SDK v0.6.0)\n\nStandalone (WASM) processors can make outbound HTTP calls through the host. `ai.embed` uses this\nto reach its embedding provider. Egress is closed by default. A processor gets it only when the\noperator opens the instance ceiling (`processors.egress.*`) and the pipeline opts that processor in\nwith `sdk.egress.allow`; the effective allowlist is where the two overlap. Addresses are checked\nagain when the connection is made, so a hostname that resolves to a private, link-local or\nmetadata address is refused. Credentials stay on the host: grant a name in\n`processors.egress.secret-refs`, export `CONDUIT_SECRET_<NAME>`, and the host injects the\n`Authorization` header. The secret never enters the guest. Build processors against\n`github.com/conduitio/conduit-processor-sdk` v0.6.0. Older processors work unchanged.\nConfiguration reference: README, \"Processor host egress\".\n\n### `conduit processor-plugins install` / `uninstall`\n\nInstalls WASM processors from the signed registry, with the same signature and SLSA provenance\nchecks as `conduit connectors install`. Offline installs work with `--index-file` or `--bundle`.\n`uninstall` refuses to remove a processor that a pipeline still uses.\n\n```sh\nconduit processor-plugins install ai.chunk --dry-run --json\n```\n\nThe registry index now lists processors next to connectors. The change is additive, so older\nclients ignore processor entries and keep installing connectors.\n\n### Signed releases\n\nFrom this release on, every release and nightly is signed with Sigstore keyless signing through\nGitHub Actions OIDC. There is no long-lived key. `checksums.txt` is signed\n(`checksums.txt.sigstore.json`), and since it lists every archive, package and SBOM, one signature\ncovers all of them. Each archive comes with an SPDX SBOM (`<archive>.sbom.json`). The Docker image\non GHCR is signed by digest. See the snippet at the end of these notes or\n[\"Verifying a release\"](https://github.com/ConduitIO/conduit/blob/main/docs/releases.md#verifying-a-release).\nReleases up to and including v0.19.0 are not signed. macOS binaries are not notarized yet.\n\n### CI gates\n\nThe chaos suite (`tests/chaos`) is a required check on `main` and runs on every PR and nightly. It\nSIGKILLs pipelines mid-snapshot, mid-batch and mid-checkpoint, then checks for loss and position\ncorrectness on recovery. govulncheck runs on every PR, push to `main` and nightly, and fails a PR\nthat makes a new vulnerability reachable. `bundle-e2e` (WASM egress) and `rag-e2e` (chunk, embed,\npgvector) are also required.\n\n## Behavior changes\n\n### Stopped pipelines are never recovered (#2901)\n\nBoth engines. Details:\n[ADR 20261007](https://github.com/ConduitIO/conduit/blob/main/docs/architecture-decision-records/20261007-stop-requested-never-recovers.md).\n\n- Once a stop is requested, by you or by shutdown, the pipeline is not sent into recovery and not\n  restarted.\n- A user `Stop`, graceful or force, ends `UserStopped`. If the drain hit an error, the error is\n  kept.\n- A force stop is now `UserStopped` with `force stop` recorded. It was `Degraded`. It no longer\n  runs OnFailure handlers, so it no longer shuts Conduit down under `pipelines.exit-on-degraded`.\n- A shutdown, graceful or not, ends `SystemStopped` with any error kept. Those pipelines start\n  again on the next boot and resume from their last persisted position.\n- Under `exit-on-degraded`, only the pipeline whose own fatal error triggered the exit is\n  `Degraded`. The other pipelines are `SystemStopped` with the reason recorded and auto-start next\n  boot. Before, they were also `Degraded` and needed a manual start.\n- `Start` and recovery restarts during shutdown are refused with `pipeline.shutting_down` (gRPC\n  `Unavailable`).\n- A shutdown during a recovery backoff completes at once instead of waiting out the backoff or the\n  30s exit timeout.\n- Drain errors are kept: shutdown returns them as its error, and arch-v2 now records them on the\n  pipeline.\n- **A stopped pipeline can carry a non-empty error.** It means the drain did not end cleanly; the\n  affected records were nacked and replay on the next start. Dashboards that alert only on\n  `Degraded` no longer see drain failures. Alert on the error field of stopped pipelines too.\n- `pipeline_recovering_count` no longer counts a run whose stop was requested before it failed.\n\n| Case | v0.19.0 | v0.20.0 | Error kept | OnFailure |\n| --- | --- | --- | --- | --- |\n| User `Stop`, clean drain | UserStopped | UserStopped | \u2014 | no |\n| User `Stop`, error during drain | default engine: recovered and restarted; arch-v2: UserStopped, error dropped | UserStopped | yes | no |\n| User force stop | Degraded | UserStopped | `force stop` | no (was yes) |\n| User `Stop` during recovery backoff | restarted after the backoff | UserStopped | original error | no |\n| Shutdown, clean drain | SystemStopped | SystemStopped | \u2014 | no |\n| Shutdown with an error (drain error, runtime error, exit-on-degraded) | default engine: restarted during shutdown, or Degraded if the cause was fatal; arch-v2: error dropped | SystemStopped, auto-starts next boot | yes | no (was yes when Degraded) |\n| Fatal error before any stop | Degraded | Degraded | yes | yes |\n| Transient error, no stop | Recovering, then restarted | unchanged | \u2014 | \u2014 |\n| `Start` during shutdown | could start | refused, `pipeline.shutting_down` | \u2014 | \u2014 |\n\n### Other changes\n\n- **Built-in connectors:** postgres v0.14.0 \u2192 v0.14.2, kafka v0.12.3 \u2192 v0.12.5, file v0.10.3 \u2192\n  v0.10.8, log v0.7.3 \u2192 v0.7.5. Dependency updates and re-releases with signed artifacts, no\n  feature changes.\n- **New error code `pipeline.fanout_requires_arch_v2`** replaces `unknown record type:\n  sdk.MultiRecord` when a fan-out processor runs on the default engine.\n- **`--preview.pipeline-arch-v2`** still defaults to off. Its help text now says what it is for\n  and names one limit: a split record whose pieces are cut across a multi-destination fan-out fails\n  with `pipeline.split_run_straddles_fanout`.\n- **New `processors.egress.*` settings** (`enabled`, `allow`, `secret-refs`, `timeout`,\n  `max-response-bytes`). With the default `enabled: false` nothing changes. Processor settings\n  under `sdk.egress.*` are reserved for the host and are no longer passed to the processor.\n- **Settings are redacted in API responses.** Connector, processor and DLQ setting values come\n  back as `\"***\"`. Requests must send real values (see Known issues, #2913).\n- **Embedded Conduit with the API enabled (#2747):** `/metrics` serves from the registry you pass\n  in. A `MetricsRegisterer` that is not also a `prometheus.Gatherer` now makes the first `Run` or\n  `Import` return `CodeInvalidArgument`; before, it started and served unrelated default metrics.\n- **Prerelease builds and `minConduitVersion` (#2822):** a v0.20.0 nightly now satisfies a\n  `minConduitVersion` of 0.20.0.\n\n## Fixes\n\n- **SEV-0: Postgres snapshot-to-CDC handoff could stall silently (#2707).** Present in v0.19.0. An\n  ack the source waits for at the end of a snapshot could be dropped under load, so CDC never\n  started and later changes were never delivered, with no error and no DLQ entry. Found before\n  release by the RAG e2e; no production occurrence is known. Postmortem:\n  [`docs/postmortems/20260729-snapshot-handoff-deferred-ack-deadlock.md`](https://github.com/ConduitIO/conduit/blob/main/docs/postmortems/20260729-snapshot-handoff-deferred-ack-deadlock.md).\n- **Connector state write errors were ignored, so a source could ack upstream without a saved\n  position (#2925).** Present since 2023, including v0.19.0. If saving one connector's state failed\n  inside an otherwise healthy write, the error was only logged, the write was committed without it,\n  and the source was told the position was saved. It then released its upstream ack (for example a\n  Postgres slot advance or a Kafka offset commit), so after a restart those records could be lost.\n  The failure now aborts the write and fails the pipeline instead.\n- **gRPC server panic, GO-2026-6443 / CVE-2026-84445 (#2881).** A request with no `:authority` or\n  `Host` header could panic the gRPC API server. v0.19.0 ships the affected grpc v1.82.1; v0.20.0\n  pins the fixed v1.83.2.\n- **Go standard library advisories (#2914).** Moving to Go 1.25.14 clears the 20 standard-library\n  advisories govulncheck found reachable in the Conduit binary.\n- **HTTP/2 server advisories GO-2026-6603, -6611, -6612, -6617 (#2970).** A malicious HTTP/2 client\n  could crash the API server, exhaust its memory or CPU, or corrupt flow control. v0.20.0 builds\n  with Go 1.26.9 and golang.org/x/net v0.60.0, which fix all four. Go 1.25 gets no fix upstream, so\n  **building Conduit from source or embedding it now requires Go 1.26 or newer.**\n- **Shutdown could restart pipelines and write positions after the database closed (#2901).** On a\n  non-graceful shutdown, or a transient error during a user `Stop`, the default engine sent\n  pipelines into recovery and restarted them. During shutdown, a restarted run could write\n  positions after the database was closed. Fixed by the stop semantics above.\n- **Failed pipeline reported as `UserStopped` (#2896).** Default engine. A node error could leave a\n  pipeline marked user-stopped with no error, skipping OnFailure and recovery, so a transient error\n  stopped the pipeline for good. No data loss.\n- **arch-v2: run cleanup could erase a live run (#2811).** If a status write failed during a\n  recovery restart, the superseded run's cleanup could remove the live run, which then could not be\n  stopped or waited on.\n- **Process panic on shutdown of a multi-source pipeline (#2749).** Shutting down a pipeline with\n  two or more sources could crash Conduit with `sync: WaitGroup is reused`. Reproduced on v0.19.0.\n- **Recovered pipeline reported with its old error; shutdown could close the DB under a live run\n  (#2807, #2812).** Default engine, on recovery restarts.\n- **`conduit init` then `conduit run` failed out of the box (#2855).** The generated `conduit.yaml`\n  wrote empty lists as the string `'[]'`, which `conduit run` rejected.\n- **`conduit pipelines init` with no arguments failed outside a workspace (#2857).** It now creates\n  `pipelines/`, and remaining failures return a validation code with the OS error and a fix.\n- **`processor-plugins install` refused every processor (#2818).** Fixed before any stable release\n  shipped the command.\n- **Other arch-v2 fixes:** destination-scoped processors run before the write (#2805); split records\n  hold back their source position until every piece is done (#2731); nack and retry bounds (#2732,\n  #2733); empty batch and empty position guards (#2738, #2744).\n\n## Known issues\n\n- **arch-v2: destination batching can stall (#2979).** On `--preview.pipeline-arch-v2`, a destination\n  with `sdk.batch.size` above 1 and the default `sdk.batch.delay` of 0 can stop delivering, and with a\n  delay set it slows to roughly one batch delay per record. The defaults and the RAG template are not\n  affected. On arch-v2, don't set `sdk.batch.size` on destinations. v0.20.1 refuses that\n  configuration at start with an actionable error.\n- **Shutdown can hang if a source fails at the same moment (#2969).** Default engine, present in\n  v0.19.0. If a source errors just as Conduit is stopping, shutdown can block indefinitely. No data\n  is lost: kill the process and the unacked records are replayed on restart. Fix planned for\n  v0.20.1.\n- **Postgres CDC can lose a row on restart when transactions interleave\n  (conduit-connector-postgres#331).** Present since 2022, including v0.19.0. Trigger: a transaction\n  that started before the last checkpoint commits after it while other transactions commit in\n  between (for example a long-running transaction alongside short ones), and then Conduit\n  restarts. On resume, that transaction's changes are skipped and never delivered. Restarts with\n  no long-running transaction in flight are not affected. Fixed in Postgres connector v0.14.3\n  (released 2026-10-08), which becomes the built-in connector in v0.20.1.\n- **Postgres CDC can lose rows loaded in one statement (for example `COPY` or a multi-row\n  insert) if Conduit restarts partway through them.** Present in v0.19.0 and earlier. Postgres\n  gives all rows from such a statement the same log position, so after a restart between two of\n  them the rest are skipped, and the connector can confirm progress past rows it has not\n  delivered yet. Fixed in the same v0.20.1 connector patch.\n- **Avro decoder advisories GO-2026-5046, GO-2026-5047, GO-2026-5048** (CPU exhaustion, integer\n  overflow, unbounded map allocation in `hamba/avro`, archived upstream with no fix). Reachable when\n  Conduit decodes untrusted Avro through the built-in Avro processor, or through the built-in\n  Postgres connector's schema extraction. v0.20.1 partly mitigates them (conduit-commons v0.7.0 caps Avro arrays and maps at\n  1,000,000 elements). v0.21 clears them by moving to a maintained fork.\n- **#2929 (arch-v2 preview engine): a persistent connector-state write failure stalls without\n  a status signal.** No data is lost: upstream acks are withheld (#2925). But the pipeline keeps\n  reporting healthy, logs one error per flush, and the upstream keeps retention, for example a\n  growing Postgres replication slot. Transient failures recover on their own. Very unlikely on the\n  default store for single-source pipelines such as the RAG template. Watch replication-slot lag.\n- **#2898 (default engine): a failed `Running` status write can orphan a live run.** Trigger: a\n  transient pipeline-store write failure on start. Impact: a run that can't be stopped or drained;\n  starting it again puts two readers on one source (duplicates, positions can move backwards).\n- **#2899 (both engines): a failed status write during recovery can leave a live run `Degraded`.**\n  Trigger: a status-store write failure during recovery. Impact: the run keeps going, can't be\n  stopped, can be started twice, and can trip exit-on-degraded.\n- **#2900 (default engine): source teardown waits its full 10s after a plugin stream error.**\n  Trigger: a source plugin's stream ends with an error. Impact: about 10s of extra delay before\n  Degraded/Recovering and on shutdown. No data loss.\n- **#2913: sending a redacted settings map back stores `\"***\"` as the value.** Trigger: an API\n  update that echoes settings read from the API. Impact: the real secret is overwritten. Send real\n  values.\n- **#2908: `generate.provider` in `conduit.yaml` is not read.** Use `--provider`.\n- **#2907: `processor-plugins install` / `uninstall --help` list the wrong exit codes.**\n- **`postgres-s3` template is not verified end to end.** The built-in S3 connector (v0.9.3) fails\n  against MinIO and other S3-compatible stores; the fix needs an S3 connector release with\n  conduit-connector-s3#994 and reaches Conduit in v0.21. The template targets AWS S3.\n\n## Deferred\n\n- **A single pipeline engine.** Instead of switching the default to arch-v2, v0.21 designs and\n  prototypes one engine that keeps arch-v2's batching and fan-out and runs pipeline stages\n  concurrently, as the default engine does. The target is to make it the default in v0.22, after\n  it matches or beats the current default on throughput and passes the chaos suite.\n- **Debezium-parity Postgres CDC \u2192 v0.21.** The built-in Postgres connector stays at v0.14.2 until\n  then.\n- **Protobuf decode (Confluent wire format) \u2192 v0.21.**\n- **\u2192 v0.22:** embedded Conduit with external connectors (embed Slice 2), a Node client, a Qdrant\n  destination, and a source-side DLQ path.\n- **Python connector SDK and `conduit-client` GA** ship on their own schedule. Neither blocks this\n  release.\n\n## Verify this release\n\nRequires [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) v3 or later.\nDownload `checksums.txt`, `checksums.txt.sigstore.json` and the files you want into one directory,\nthen:\n\n```sh\ncosign verify-blob \\\n  --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/v0.20.0' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  --bundle checksums.txt.sigstore.json \\\n  checksums.txt\n\n# only once the signature verifies (on macOS: shasum -a 256 --check --ignore-missing)\nsha256sum --check --ignore-missing checksums.txt\n```\n\nThe Docker image:\n\n```sh\ncosign verify \\\n  --certificate-identity 'https://github.com/ConduitIO/conduit/.github/workflows/release.yml@refs/tags/v0.20.0' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  ghcr.io/conduitio/conduit:v0.20.0\n```\n\n`cosign verify` resolves the tag to a digest and checks the signature on that digest. To pin what\nyou run, use the digest it prints: `ghcr.io/conduitio/conduit@sha256:...`.\n\n\n**Full changelog:** http