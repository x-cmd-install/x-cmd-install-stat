{"id":397066533,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4XqsEl","tag_name":"v4.25.1","target_commitish":"main","name":"v4.25.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-26T03:35:50Z","updated_at":"2026-09-26T03:44:48Z","published_at":"2026-09-26T03:44:48Z","assets":[{"id":589858371,"node_id":"RA_kwDOOYrAVM4jKIZD","name":"linkedin-mcp-server-v4.25.1.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":764303,"digest":"sha256:e02b559d2410730d11f045aab63b10e72a6f693182ed6ef90f495288b73ea6ea","download_count":2,"created_at":"2026-09-26T03:44:47Z","updated_at":"2026-09-26T03:44:47Z"}],"body":"### Bug Fixes\n\n- Profile URLs whose query string or fragment mentions a search, company people or details route no longer switch capture to that mode. ([#1076](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1076))\n- get_job_details now keeps captured posting text and reports a description_missing section error when the expected description heading is absent. ([#1088](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1088))\n- The contact_info section in get_person_profile and get_my_profile now reports a section error when its overlay cannot be found instead of returning underlying profile text and links. ([#1096](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1096))\n- get_inbox, search_conversations and get_conversation by username now attribute a thread id to a conversation only when clicking it visibly opens that thread, and report or refuse a row they cannot verify instead of returning another conversation's id. ([#1102](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1102))\n- send_message no longer refuses every recipient with recipient_resolution_failed, and get_person_profile returns profile_urn again, after LinkedIn nested the profile top card and changed its name heading. ([#1105](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1105))\n\n## Install or update\n\n- **uvx:** clients configured with `mcp-server-linkedin@latest` pick up v4.25.1 on their next start.\n- **Claude Desktop (MCP Bundle):** download [linkedin-mcp-server-v4.25.1.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.25.1/linkedin-mcp-server-v4.25.1.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n- **Docker:** run `docker pull stickerdaniel/linkedin-mcp-server:latest`, or use the `4.25.1` tag to pin this release.\n\nNew here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.25.0...v4.25.1\n"}
