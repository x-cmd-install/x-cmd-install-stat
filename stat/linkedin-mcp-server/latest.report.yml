{"id":402667826,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4YADky","tag_name":"v4.26.2","target_commitish":"main","name":"v4.26.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-03T19:46:12Z","updated_at":"2026-10-03T19:54:31Z","published_at":"2026-10-03T19:54:31Z","assets":[{"id":608432932,"node_id":"RA_kwDOOYrAVM4kQ_Mk","name":"linkedin-mcp-server-v4.26.2.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":801062,"digest":"sha256:23ab9f1e40014bf8ffdb743bd8a890120d5b67273c04f9e30cfc40ecb681ad2d","download_count":17,"created_at":"2026-10-03T19:54:30Z","updated_at":"2026-10-03T19:54:31Z"}],"body":"## Breaking Changes\n\n- Python imports move from `linkedin_mcp_server.scraping` to `linkedin_mcp_server.linkedin`. ([#1189](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1189))\n- Every Python name containing \"scrap\" is renamed, keywords too; error context: `read_*`. ([#1190](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1190))\n\n<details>\n<summary><b>Bug Fixes (3)</b></summary>\n\n- `--status` now says another process holds the browser profile instead of failing. ([#1191](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1191))\n- On Windows, closing the shared daemon's browser no longer breaks its next browser start. ([#1201](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1201))\n- Send messages and return `profile_urn` again on LinkedIn's redesigned profile page. ([#1214](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1214) by @stevenmcsorley)\n\n</details>\n\n## Install or update\n\n> [!TIP]\n> New here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n### Update with uvx\n\nClients configured with `mcp-server-linkedin@latest` pick up v4.26.2 on their next start. To pin this release, use `mcp-server-linkedin@4.26.2` instead.\n\n### Update with the MCP Bundle\n\nFor Claude Desktop, download [linkedin-mcp-server-v4.26.2.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.26.2/linkedin-mcp-server-v4.26.2.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n\n### Update with Docker\n\n```bash\ndocker pull stickerdaniel/linkedin-mcp-server:latest\n```\n\nUse the `4.26.2` tag instead of `latest` to pin this release.\n\n---\n\n**Contributors:** @stevenmcsorley (first contribution \ud83c\udf89), @stickerdaniel\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.26.1...v4.26.2\n","mentions_count":2}
