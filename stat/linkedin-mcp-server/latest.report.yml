3d\ude80 Features\n* feat(scraping): capture post permalinks on content-search pages by @mattelacchiato in https://github.com/stickerdaniel/linkedin-mcp-server/pull/999\n### \ud83d\udc1b Bug Fixes\n* fix(diagnostics): Keep scrape notes off GitHub by @stickerdaniel in https://github.com/stickerdaniel/linkedin-mcp-server/pull/994\n* fix(ci): Keep main runs and 3.13 Windows coverage by @stickerdaniel in https://github.com/stickerdaniel/linkedin-mcp-server/pull/1004\n* fix(daemon): Report an unknown outcome after owner loss by @stickerdaniel in https://github.com/stickerdaniel/linkedin-mcp-server/pull/1008\n* fix(daemon): Keep a closing session from burying the answer by @stickerdaniel in https://github.com/stickerdaniel/linkedin-mcp-server/pull/1012\n* fix(session): Name the Windows arch without WMI by @stickerdaniel in https://github.com/stickerdaniel/linkedin-mcp-server/pull/1013\n* fix(daemon): Stop post-call schema discovery by @stickerdaniel in https://github.com/stickerdaniel/linkedin-mcp-server/pull/1017\n* fix(scraping): Accept periods in company slugs by @shbernal in https://github.com/stickerdaniel/linkedin-mcp-server/pull/973\n\n## New Contributors\n* @framegrabber made their first contribution in https://github.com/stickerdaniel/linkedin-mcp-server/pull/996\n* @mattelacchiato made their first contribution in https://github.com/stickerdaniel/linkedin-mcp-server/pull/999\n* @shbernal made their first contribution in https://github.com/stickerdaniel/linkedin-mcp-server/pull/973\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.24.3...v4.24.4","mentions_count":4}
