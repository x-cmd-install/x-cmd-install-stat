{"id":397720425,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4XtLtp","tag_name":"v4.26.0","target_commitish":"main","name":"v4.26.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-27T16:11:39Z","updated_at":"2026-09-28T05:52:17Z","published_at":"2026-09-27T16:22:08Z","assets":[{"id":593290995,"node_id":"RA_kwDOOYrAVM4jXObz","name":"linkedin-mcp-server-v4.26.0.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":801735,"digest":"sha256:3678774bbbb98ac5a052c290a795edbea42d694935c2a22d75c0466ef279ac6f","download_count":21,"created_at":"2026-09-27T16:22:07Z","updated_at":"2026-09-27T16:22:07Z"}],"body":"## Highlights\n\n- **MCP 2026-07-28.** The server accepts clients on the new protocol and earlier ones. ([#1139](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1139))\n- **Sent means sent.** `send_message` confirms delivery from LinkedIn's own receipt. ([#1108](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1108) by @Ymx1ZQ)\n- **Restrictions are named.** A restricted account no longer reads as an expired login. ([#1147](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1147))\n\n## Features\n\n- `get_company_posts` takes `max_scrolls` to read further back in a company feed. ([#1104](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1104) by @ConnorMoss02)\n- The opt-in shared browser stays off on network, FUSE and cloud-synced storage. ([#1126](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1126))\n- The opt-in shared browser lets running calls finish before a newer owner takes over. ([#1127](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1127))\n- Login, logout and browser import ask an idle shared browser to step aside first. ([#1128](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1128))\n- The server runs on FastMCP 4 and accepts clients on the 2026-07-28 MCP protocol. ([#1139](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1139))\n- The opt-in shared browser talks the 2026-07-28 protocol when its owner offers it. ([#1140](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1140))\n\n<details>\n<summary><b>Bug Fixes (7)</b></summary>\n\n- `send_message` reports `sent` for delivered messages instead of `send_unconfirmed`. ([#1108](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1108) by @Ymx1ZQ)\n- A shared browser owner that cannot close its browser no longer signals other processes. ([#1122](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1122))\n- The Docker image runs Chrome for Testing 153, and older images refuse its profiles. ([#1123](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1123))\n- `CHROME_PATH` and `--chrome-path` keep the server on its own browser. ([#1125](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1125))\n- `connect_with_person` returns `connect_unavailable` when the note cannot be filled. ([#1136](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1136))\n- `connect_with_person` no longer reports a sent invitation as `send_failed`. ([#1137](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1137))\n- A restricted LinkedIn account is reported as restricted, not as an expired session. ([#1147](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1147))\n\n</details>\n\n## Install or update\n\n> [!TIP]\n> New here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n### Update with uvx\n\nClients configured with `mcp-server-linkedin@latest` pick up v4.26.0 on their next start. To pin this release, use `mcp-server-linkedin@4.26.0` instead.\n\n### Update with Docker\n\n```bash\ndocker pull stickerdaniel/linkedin-mcp-server:latest\n```\n\nUse the `4.26.0` tag instead of `latest` to pin this release.\n\n### Update with the MCP Bundle\n\nFor Claude Desktop, download [linkedin-mcp-server-v4.26.0.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.26.0/linkedin-mcp-server-v4.26.0.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n\n---\n\n**Contributors:** @Ymx1ZQ (first contribution \ud83c\udf89), @ConnorMoss02, @stickerdaniel\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.25.1...v4.26.0\n","mentions_count":3}
