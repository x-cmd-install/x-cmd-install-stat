{"id":452333250,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4a9g7C","tag_name":"v4.31.0","target_commitish":"main","name":"v4.31.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-20T05:57:45Z","updated_at":"2026-11-20T06:12:07Z","published_at":"2026-11-20T06:12:07Z","assets":[{"id":770694510,"node_id":"RA_kwDOOYrAVM4t791u","name":"linkedin-mcp-server-v4.31.0.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":888043,"digest":"sha256:ad386b4d97fb2fa63f38daacec5d86a7e9472dbc5cbe8616239f97d3aad22d58","download_count":33,"created_at":"2026-11-20T06:12:06Z","updated_at":"2026-11-20T06:12:06Z"}],"body":"## Highlights\n\n- **HTTP token.** Beyond loopback, as in Docker, HTTP needs `LINKEDIN_MCP_HTTP_TOKEN`. ([#1518](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1518) by @stickerdaniel)\n- **FastMCP 4.2.0.** Resource listings through the shared browser stay local again. ([#1513](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1513) by @stickerdaniel)\n- **Docker security fixes.** The image ships dnspython 2.9.2 and opentelemetry-api 1.45.2. ([#1515](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1515) by @stickerdaniel)\n\n## Breaking Changes\n\n- HTTP beyond loopback now needs a bearer token, set with LINKEDIN_MCP_HTTP_TOKEN. ([#1518](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1518) by @stickerdaniel)\n\n<details>\n<summary><b>Bug Fixes (2)</b></summary>\n\n- The shared browser server answers resource listings again when its owner has stopped. ([#1513](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1513) by @stickerdaniel)\n- Installs get a new FastMCP, MCP SDK or httpx2 minor only after it is tested here. ([#1531](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1531) by @stickerdaniel)\n\n</details>\n\n## Install or update\n\n> [!TIP]\n> New here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n### Update with uvx\n\nClients configured with `mcp-server-linkedin@latest` pick up v4.31.0 on their next start. To pin this release, use `mcp-server-linkedin@4.31.0` instead.\n\n### Update with the MCP Bundle\n\nFor Claude Desktop, download [linkedin-mcp-server-v4.31.0.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.31.0/linkedin-mcp-server-v4.31.0.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n\n### Update the Codex or Claude Code plugin\n\nCodex picks up v4.31.0 of the plugin in the background on its next start. In Claude Code, run this and restart:\n\n```bash\nclaude plugin update linkedin-mcp-server@linkedin-mcp-server\n```\n\n### Update with Docker\n\n```bash\ndocker pull stickerdaniel/linkedin-mcp-server:latest\n```\n\nUse the `4.31.0` tag instead of `latest` to pin this release.\n\n---\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.30.0...v4.31.0\n","mentions_count":1}
