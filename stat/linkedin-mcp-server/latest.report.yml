{"id":408526718,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4YWZ9-","tag_name":"v4.27.0","target_commitish":"main","name":"v4.27.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-10T02:01:39Z","updated_at":"2026-10-10T02:12:02Z","published_at":"2026-10-10T02:12:02Z","assets":[{"id":626755829,"node_id":"RA_kwDOOYrAVM4lW4j1","name":"linkedin-mcp-server-v4.27.0.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":831909,"digest":"sha256:4d41db0f7a0b350dfe96634229ac94bca2fd1400362e927190d53769cbd7960f","download_count":524,"created_at":"2026-10-10T02:12:01Z","updated_at":"2026-10-10T02:12:01Z"}],"body":"## Highlights\n\n- **Multi-line messages.** `send_message` sends line breaks and empty lines as one message. ([#1224](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1224))\n- **Apply links.** `get_job_apply_url` returns the apply type and the employer's link. ([#1035](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1035) by @shbernal)\n- **Sessions recover.** A profile that lost its cookies gets them back before any page. ([#1251](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1251))\n\n## Features\n\n- get_job_apply_url says how a posting takes applications and gives the employer's URL. ([#1035](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1035) by @shbernal)\n- get_saved_jobs takes a stage to read in-progress, applied and archived tracker jobs. ([#1058](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1058) by @shbernal)\n- send_message now sends multi-line messages as one message, keeping empty lines. ([#1224](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1224))\n- send_message reports the thread a confirmed message landed in, or null on compose. ([#1243](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1243))\n- get_job_details adds apply: {type} for postings applied to or closed. ([#1249](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1249) by @shbernal)\n\n<details>\n<summary><b>Bug Fixes (15)</b></summary>\n\n- A browser install no longer fails when its helper processes end late under load. ([#1220](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1220))\n- A profile locked under another host name now says which lock files to remove, and when. ([#1228](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1228))\n- A browser install whose size limit was exceeded is now refused even if it exits cleanly. ([#1229](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1229))\n- The CLI now says that Ctrl+Z does not pause a browser download. ([#1230](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1230))\n- Logout no longer deletes a session another client signed in with while it waited. ([#1231](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1231))\n- A lost shared browser now tells clients to reconnect instead of an internal error. ([#1232](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1232))\n- send_message now reports an unconfirmed send instead of a bare timeout error. ([#1233](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1233))\n- A cancelled job search no longer keeps scrolling its results in the shared page. ([#1234](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1234))\n- Tools now refuse a page that ended up off LinkedIn instead of reading it as LinkedIn's. ([#1235](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1235))\n- A browser that stopped is shut down, and the next tool call starts a new one. ([#1240](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1240))\n- A feed navigation is timed from the request, and one that is never sent still ends. ([#1245](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1245))\n- get_job_apply_url reads an Easy Apply that LinkedIn now renders as a button. ([#1250](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1250) by @shbernal)\n- A profile that opens without its saved cookies loads them before the first page. ([#1251](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1251))\n- Exclude new-message compose destinations from conversation references and thread IDs. ([#1255](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1255) by @ihuzaifashoukat)\n- search_jobs keeps the pages it has when a slow page reaches the end of its time budget. ([#1261](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1261) by @shbernal)\n\n</details>\n\n## Install or update\n\n> [!TIP]\n> New here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n### Update with uvx\n\nClients configured with `mcp-server-linkedin@latest` pick up v4.27.0 on their next start. To pin this release, use `mcp-server-linkedin@4.27.0` instead.\n\n### Update with the MCP Bundle\n\nFor Claude Desktop, download [linkedin-mcp-server-v4.27.0.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.27.0/linkedin-mcp-server-v4.27.0.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n\n### Update with Docker\n\n```bash\ndocker pull stickerdaniel/linkedin-mcp-server:latest\n```\n\nUse the `4.27.0` tag instead of `latest` to pin this release.\n\n---\n\n**Contributors:** @shbernal, @ihuzaifashoukat (first contribution \ud83c\udf89), @stickerdaniel\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.26.2...v4.27.0\n","mentions_count":3}
