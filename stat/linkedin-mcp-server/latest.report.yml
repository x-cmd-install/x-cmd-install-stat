{"id":430134445,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4Zo1St","tag_name":"v4.29.0","target_commitish":"main","name":"v4.29.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-31T19:08:55Z","updated_at":"2026-10-31T19:17:26Z","published_at":"2026-10-31T19:17:26Z","assets":[{"id":696257474,"node_id":"RA_kwDOOYrAVM4pgAvC","name":"linkedin-mcp-server-v4.29.0.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":860178,"digest":"sha256:4463e840984421105797c4ba785efc8d3de736c2a81507287394341766ddbe5f","download_count":400,"created_at":"2026-10-31T19:17:25Z","updated_at":"2026-10-31T19:17:25Z"}],"body":"## Highlights\n\n- **Stable error codes.** Failed calls name a code in `_meta` that clients can branch on. ([#1390](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1390) by @benjamin-di)\n- **Usage rules at connect.** Clients get the usage rules as MCP server instructions. ([#1402](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1402) by @mvanhorn)\n- **Crashed pages recover.** A crashed page is replaced instead of failing every later call. ([#1382](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1382) by @benjamin-di)\n\n## Features\n\n- A failed tool call now says when LinkedIn answered HTTP 429 or 999 during it. ([#1264](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1264) by @shbernal)\n- MCPB bundle settings can point the server at your own Chrome or Chromium executable. ([#1303](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1303) by @kumiDa)\n- search_jobs reports why paging stopped, so a caller knows whether more results may exist. ([#1323](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1323) by @shbernal)\n- dismiss_job dismisses a job from job search so later searches no longer show it. ([#1326](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1326) by @shbernal)\n- New `get_easy_apply_form` tool reads an Easy Apply form's questions without answering. ([#1343](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1343) by @shbernal)\n- New `archive_conversation` tool archives a messaging thread by its id, InMail included. ([#1354](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1354) by @shbernal)\n- `get_person_profile` and `get_my_profile` can now read a profile's volunteering section. ([#1357](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1357) by @JaiPi)\n- search_posts can filter by content type, such as uploaded documents. ([#1377](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1377) by @sunnycho100)\n- Failed tool calls name a stable error code in `_meta`, beside the unchanged message. ([#1390](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1390) by @benjamin-di)\n- Add `get_session_status`, which reports the saved session without opening a browser. ([#1392](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1392) by @benjamin-di)\n- The server now sends its usage rules to MCP clients as server instructions. ([#1402](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1402) by @mvanhorn)\n- get_feed pairs a post's permalink with its text excerpt and URN when its markup has one. ([#1409](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1409) by @letya999)\n- Ctrl+V (Cmd+V on a Mac) in the Docker login viewer pastes plain text. ([#1414](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1414))\n\n<details>\n<summary><b>Bug Fixes (5)</b></summary>\n\n- search_people refuses a plain-text location and filters by a numeric geo URN id instead. ([#722](https://github.com/stickerdaniel/linkedin-mcp-server/pull/722) by @BasitS-hash)\n- search_jobs reports no_matching_jobs when LinkedIn's redesigned search matches nothing. ([#1363](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1363) by @shbernal)\n- A crashed browser page is now shut down and replaced instead of failing every later call. ([#1382](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1382) by @benjamin-di)\n- Raise fastmcp to 4.1.3, fixing the M2M OAuth advisory GHSA-vqqp-x5qm-5qp4. ([#1408](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1408) by @letya999)\n- Sidebar \"Show all\" links off LinkedIn are skipped, and diagnostics hide proxy credentials. ([#1417](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1417))\n\n</details>\n\n## Install or update\n\n> [!TIP]\n> New here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n### Update with uvx\n\nClients configured with `mcp-server-linkedin@latest` pick up v4.29.0 on their next start. To pin this release, use `mcp-server-linkedin@4.29.0` instead.\n\n### Update with the MCP Bundle\n\nFor Claude Desktop, download [linkedin-mcp-server-v4.29.0.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.29.0/linkedin-mcp-server-v4.29.0.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n\n### Update the Codex or Claude Code plugin\n\nCodex picks up v4.29.0 of the plugin in the background on its next start. In Claude Code, run this and restart:\n\n```bash\nclaude plugin update linkedin-mcp-server@linkedin-mcp-server\n```\n\n### Update with Docker\n\n```bash\ndocker pull stickerdaniel/linkedin-mcp-server:latest\n```\n\nUse the `4.29.0` tag instead of `latest` to pin this release.\n\n---\n\n**Contributors:** @benjamin-di (first contribution 🎉), @mvanhorn, @shbernal, @kumiDa (first contribution 🎉), @JaiPi (first contribution 🎉), @sunnycho100 (first contribution 🎉), @letya999 (first contribution 🎉), @BasitS-hash (first contribution 🎉), @stickerdaniel\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.28.0...v4.29.0\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":9}
