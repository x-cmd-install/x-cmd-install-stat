{"id":398617827,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYrAVM4Xwmzj","tag_name":"v4.26.1","target_commitish":"main","name":"v4.26.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-28T20:43:20Z","updated_at":"2026-09-28T20:55:14Z","published_at":"2026-09-28T20:55:14Z","assets":[{"id":596394676,"node_id":"RA_kwDOOYrAVM4jjEK0","name":"linkedin-mcp-server-v4.26.1.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":803700,"digest":"sha256:d017a8c1f3bee61ebb33d7827c8c88bf21974b57a232aa8fe2f1661361496e21","download_count":123,"created_at":"2026-09-28T20:55:13Z","updated_at":"2026-09-28T20:55:13Z"}],"body":"## Bug Fixes\n\n- send_message reports \"Press Enter to Send\" and explains how to switch that setting. ([#1109](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1109) by @Ymx1ZQ)\n- Keep an open chat overlay from blocking connect_with_person invitations. ([#1110](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1110) by @Ymx1ZQ)\n- Avoid needless browser setup when Patchright versions share the cache. ([#1162](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1162))\n- Recover browser setup when Windows AppContainer grants block the default temp directory. ([#1163](https://github.com/stickerdaniel/linkedin-mcp-server/pull/1163))\n\n## Install or update\n\n> [!TIP]\n> New here? The [README](https://github.com/stickerdaniel/linkedin-mcp-server#readme) covers setup.\n\n### Update with uvx\n\nClients configured with `mcp-server-linkedin@latest` pick up v4.26.1 on their next start. To pin this release, use `mcp-server-linkedin@4.26.1` instead.\n\n### Update with the MCP Bundle\n\nFor Claude Desktop, download [linkedin-mcp-server-v4.26.1.mcpb](https://github.com/stickerdaniel/linkedin-mcp-server/releases/download/v4.26.1/linkedin-mcp-server-v4.26.1.mcpb) and open it to install or update. Bundles do not update themselves, so repeat this for every release.\n\n### Update with Docker\n\n```bash\ndocker pull stickerdaniel/linkedin-mcp-server:latest\n```\n\nUse the `4.26.1` tag instead of `latest` to pin this release.\n\n---\n\n**Contributors:** @Ymx1ZQ, @stickerdaniel\n\n**Full Changelog**: https://github.com/stickerdaniel/linkedin-mcp-server/compare/v4.26.0...v4.26.1\n","mentions_count":2}
