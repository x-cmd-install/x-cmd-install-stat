nu-debug.tar.gz","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":117901977,"digest":"sha256:ab2d51b01f3a999085e267259f598f92b31d9eee92ee63ab51fc2e1dcd1de768","download_count":3,"created_at":"2026-11-05T15:46:29Z","updated_at":"2026-11-05T15:46:34Z"},{"id":713915989,"node_id":"RA_kwDOSkSdJs4qjX5V","name":"loreserver-v0.13.0-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17613785,"digest":"sha256:c9b212c0216a8d972850f117378ce4be1843679ee75b781973284afe1a3e5b98","download_count":97,"created_at":"2026-11-05T15:46:34Z","updated_at":"2026-11-05T15:46:35Z"}],"body":"The latest release of Lore, Epic Games' next-generation open source version control system.\r\n\r\n[Quickstart](https://epicgames.github.io/lore/tutorials/quickstart/) | [Design](https://epicgames.github.io/lore/explanation/system-design/) | [Documentation](https://epicgames.github.io/lore/) | [Discord](https://discord.gg/E4SFJKRPbg)\r\n\r\n## Quick Install\r\n\r\nWindows\r\n```\r\nirm https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.ps1 | iex\r\n```\r\n\r\nmacOS / Linux\r\n```\r\ncurl -fsSL https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.sh | bash\r\n```\r\n\r\n## Release Notes\r\n\r\nChanges since v0.12.0.\r\n\r\n### Breaking changes\r\n\r\n* `lore.user.v1`: `UserService` partition RPCs are replaced by `RepositoryRegistryService`; with `user_url` set, the directory there must serve it before `lore-server` is upgraded\r\n* `lore-server` authorization: changing a partition needs `write`, changing branch protection needs `owner` or `admin` (or `write` for the creator), and presigned URLs need `presign` instead of `is_service_account`\r\n* Server hooks: `Hook::pre_handler` is now `async`; a timeout fails the request with `UNAVAILABLE` instead of `INTERNAL`\r\n* Clients on a `lores://` remote refuse advertised endpoints that don't authenticate the server, such as `lore://`\r\n* Ignore and view rules match paths as `.gitignore` does: `**` and character classes stay within one path component\r\n* `.loreignore` applies only to untracked paths, so changes to committed files it matches are reported and staged ([ADR-00027](https://github.com/EpicGames/lore/blob/main/docs/developing/decisions/00027-ignore-filter-applies-to-untracked-paths-only.md))\r\n* `lore sync --reset` and `lore branch switch --reset` leave untracked files in place, and `lore reset` no longer consults the ignore file\r\n* A failed link push exits with its error's code instead of 255, or the new code 52 (`LinkDivergent`)\r\n* File names Windows reads as something else, such as `C:`, `file.` or `file::$DATA`, are refused on every platform\r\n\r\n### Features\r\n\r\n* Progress is printed every 30 seconds when stdout is not a terminal (`LORE_PROGRESS_INTERVAL`)\r\n* `lore auth login --reuse-session` reuses a still-valid login\r\n* The `AuthUserToken` event reports when the stored OIDC session expires\r\n* `[sync] prefetch_tree = true` fetches a sync's tree in bulk requests\r\n* `lore-server`: `server.trust_unsigned_identity` names callers in locks and notifications on servers without auth\r\n* `lore-server`: the lock service's `Query` can be forwarded to a remote server (`lock_query`)\r\n* `lore-server`: configurable QUIC initial congestion window (`initial_cwnd_bytes`) and, on Linux, several UDP sockets per endpoint (`num_sockets`)\r\n\r\n### Fixes & Improvements\r\n\r\n* Much faster scans under large views and ignore files (157 s to 11 s for a 6,342-rule view over 450,000 files)\r\n* Whole-directory adds and deletes in a sync run on every core, and large syncs use less memory\r\n* Windows: fewer file system calls for antivirus and other filter drivers to inspect\r\n* Written files take fewer stats and only change executable bits where needed\r\n* Throttled storage copies back off and retry instead of uploading the full payload\r\n* gRPC over TLS falls back to bundled root certificates when the OS store has none\r\n* Sparse views: excluded directories are skipped by clone, diff and scans, and created only for content the view keeps\r\n* Scans and staging add or delete excluded directories only along with content below them\r\n* Directory-only rules such as `Intermediate/` apply to directories only\r\n* `lore status` lists and `lore unstage` takes back staged changes to ignored paths\r\n* Fixed `lore stage --scan` taking in some ignored files under nested re-inclusions\r\n* Fixed scans keeping untracked entries an ignore rule later excludes\r\n* Fixed `lore stage` taking in every file of a new directory where only some were marked\r\n* Merges keep both a move and an edit of the same file, and report conflicts for paths with `[` or `]`\r\n* Case-only renames commit without `--force`\r\n* Fixed deleted directories left behind when a file in them is spelled in another case\r\n* Merges under a sparse view show up in diffs, file history and `lore link list`\r\n* Fixed several staging, unstaging and reset problems with links and layers\r\n* `lore reset` keeps nested repositories\r\n* Fixed a failed removal on Unix making files world-writable; removals no longer follow symbolic links\r\n* Lore service closes its SWFS mounts on exit, and on Windows a second service no longer takes over the socket\r\n* `lore repository instance prune` keeps unreadable instances on file systems such as Btrfs\r\n* Revisions named by number resolve faster, and common-ancestor lookups no longer return a too-new revision\r\n* `lore-server`: faster branch push and BranchList, and the legacy `BranchPush` handles deleted branches as v1 does\r\n* `lore-server`: replicated store requests no longer stall during a client refresh, and composite reads fall back to the durable store sooner\r\n* `lore-aws`: shared DynamoDB reads, and batch reads back off on unprocessed keys\r\n* `lore-server`: more branch push metrics under `lore.branch_push`\r\n\r\n## Release Assets\r\n\r\n> [!IMPORTANT]\r\nThese can be downloaded under the \"Assets\" section below.\r\n\r\n### Installer\r\n- `lore-setup` - Lore CLI Windows installer\r\n\r\n### Binaries\r\n- `lore` - Lore CLI\r\n- `loreserver` - Lore Server\r\n- `liblore` - Lore Shared Library\r\n\r\n### Headers\r\n- `lore.h` - Single header for `liblore` (packaged with `liblore`)\r\n\r\n### Supported Platforms\r\n- Windows x86_64\r\n- macOS AArch64\r\n- Linux x86_64\r\n- Linux AArch64\r\n- Linux AArch64, optimized for Graviton/Neoverse 512-tvb\r\n\r\n## Lore Desktop Client\r\n\r\n> [!IMPORTANT]\r\nLore Desktop Client is available as binaries only, download the installer for your platform here:\r\n\r\n- Windows: [Lore-Desktop-Setup-x64.exe](https://releases.lore.org/desktop/releases/stable/Lore-Desktop-Setup-x64.exe)\r\n- macOS: [Lore-Desktop-arm64.dmg](https://releases.lore.org/desktop/releases/stable/Lore-Desktop-arm64.dmg)\r\n- Linux (Ubuntu 24.04): [lore-desktop_amd64.deb](https://releases.lore.org/desktop/releases/stable/lore-desktop_amd64.deb)\r\n- Linux (AppImage): [Lore-Desktop-x86_64.AppImage](https://releases.lore.org/desktop/releases/stable/Lore-Desktop-x86_64.AppImage)\r\n\r\n##  ⬇️ Open Source Lore Assets Below ⬇️","reactions":{"total_count":5,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":2,"eyes":0}}
