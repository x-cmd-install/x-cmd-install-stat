ype":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14785323,"digest":"sha256:940777fc84c0959ddaa6be9a1e93fdf28eee2e009828a77048e4cc3ca783d35e","download_count":6,"created_at":"2026-10-26T16:04:56Z","updated_at":"2026-10-26T16:04:57Z"},{"id":678684244,"node_id":"RA_kwDOSkSdJs4oc-ZU","name":"loreserver-v0.12.0-aarch64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15893639,"digest":"sha256:8a6236e031af5ab8d93c820360850fff398c55dd759f9c78add444a09b6c3b60","download_count":5,"created_at":"2026-10-26T16:04:58Z","updated_at":"2026-10-26T16:04:59Z"},{"id":678684353,"node_id":"RA_kwDOSkSdJs4oc-bB","name":"loreserver-v0.12.0-x86_64-pc-windows-msvc-debug.zip","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98562018,"digest":"sha256:c479e12a5ff8a952ecb96a9909d8bfd9ab59b19e08683977bd5504ca05908ba7","download_count":2,"created_at":"2026-10-26T16:04:59Z","updated_at":"2026-10-26T16:05:06Z"},{"id":678684787,"node_id":"RA_kwDOSkSdJs4oc-hz","name":"loreserver-v0.12.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15735369,"digest":"sha256:124be4a35a0b44685d07b3e52c3725ee1a2760380fad9026b06d30083e67b9a9","download_count":28,"created_at":"2026-10-26T16:05:07Z","updated_at":"2026-10-26T16:05:08Z"},{"id":678684868,"node_id":"RA_kwDOSkSdJs4oc-jE","name":"loreserver-v0.12.0-x86_64-unknown-linux-gnu-debug.tar.gz","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":111257425,"digest":"sha256:dbd3e03838402dc4a4e145892b8fefe82dbab083cd2a7bb03f0c27636a849dae","download_count":4,"created_at":"2026-10-26T16:05:08Z","updated_at":"2026-10-26T16:05:13Z"},{"id":678685048,"node_id":"RA_kwDOSkSdJs4oc-l4","name":"loreserver-v0.12.0-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"epic-lore-bot[bot]","id":289003844,"node_id":"BOT_kgDOETnZRA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17264366,"digest":"sha256:9372eb024ff571063b8b783dc99281fed7d73c96e234770266736873443d773a","download_count":19,"created_at":"2026-10-26T16:05:13Z","updated_at":"2026-10-26T16:05:14Z"}],"body":"The latest release of Lore, Epic Games' next-generation open source version control system.\r\n\r\n[Quickstart](https://epicgames.github.io/lore/tutorials/quickstart/) | [Design](https://epicgames.github.io/lore/explanation/system-design/) | [Documentation](https://epicgames.github.io/lore/) | [Discord](https://discord.gg/E4SFJKRPbg)\r\n\r\n## Quick Install\r\n\r\nWindows\r\n```\r\nirm https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.ps1 | iex\r\n```\r\n\r\nmacOS / Linux\r\n```\r\ncurl -fsSL https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.sh | bash\r\n```\r\n\r\n## Release Notes\r\n\r\nChanges since v0.11.0.\r\n\r\n### Features\r\n\r\n* `lore service run` runs the Lore service in the current process until it stops (via `lore service stop` or `lore::service::quit`); Rust only, no C API equivalent\r\n* Expired OIDC access tokens are renewed with the refresh token (RFC 6749 §6) on the next operation, without a new `lore auth login`\r\n* `lore auth logout` (C API: `lore_auth_logout`) revokes the OIDC refresh token at the provider when it advertises a revocation endpoint (RFC 7009); a failed revocation fails the logout, after the local login is removed\r\n\r\n### Fixes & Improvements\r\n\r\n* `--dry-run` is now side-effect free across the CLI: no writes to the working tree, `.lore` config, branch/revision/staged/layer state, local or shared store, token store, settings, or the remote. Affected commands included `file reset`, `branch create|reset|archive`, `revision amend`, `unstage`, `layer add`, `link add`, `repository create|clone|gc`, `shared-store create`, `file obliterate`, `commit`, `branch merge into` and `auth login|logout|clear`\r\n* `repository clone --force --dry-run`, `clone --dry-run --vfs swfs` and `clone --dry-run --use-shared-store` (when it would create the store) now fail instead of acting\r\n* `repository verify --heal --dry-run` reports without healing\r\n* Fixed a cross-process deadlock when several processes run commands on the same repository or shared store (e.g. concurrent `lore history`). All processes using the store must run this version\r\n* `lore repository verify` fails on unreadable parts of the local store instead of skipping them, and heals fragments moved by a concurrent flush\r\n* `lore stage` of several paths under a directory missing from disk stages deletes for only those paths, not the whole directory\r\n* `lore stage --case keep` with a differently-cased directory stages files as modified under the repository's case, not as deleted, on case-sensitive file systems\r\n* `lore branch switch <branch> <revision>` resolves a bare revision (`1234`, `@1234`) on `<branch>`, not the current branch\r\n* TLS: reject certificates chained through compromised eMudhra intermediates (RUSTSEC-2026-0382) and drop the emSign ECC Root CA - G3, Root CA - C1 and ECC Root CA - C3 built-in roots\r\n* TLS: abort on TLS 1.3 handshake messages at the wrong encryption level (RUSTSEC-2026-0285), prevent forced downgrade to classical key exchange (RUSTSEC-2026-0349), and redact secrets from client session debug output (RUSTSEC-2026-0346)\r\n\r\n## Release Assets\r\n\r\n> [!IMPORTANT]\r\nThese can be downloaded under the \"Assets\" section below.\r\n\r\n### Installer\r\n- `lore-setup` - Lore CLI Windows installer\r\n\r\n### Binaries\r\n- `lore` - Lore CLI\r\n- `loreserver` - Lore Server\r\n- `liblore` - Lore Shared Library\r\n\r\n### Headers\r\n- `lore.h` - Single header for `liblore` (packged with `liblore`)\r\n\r\n### Supported Platforms\r\n- Windows x84_64\r\n- macOS AArch64\r\n- Linux x86_64\r\n- Linux AArch64 (for Graviton/Neoverse 512-tvb only)\r\n\r\n## Lore Desktop Client\r\n\r\n> [!IMPORTANT]\r\nLore Desktop Client is available as binaries only, download the installer for your platform here:\r\n\r\n- Windows: [Lore-Desktop-Setup-x64.exe](https://releases.lore.org/desktop/releases/stable/Lore-Desktop-Setup-x64.exe)\r\n- macOS: [Lore-Desktop-arm64.dmg](https://releases.lore.org/desktop/releases/stable/Lore-Desktop-arm64.dmg)\r\n- Linux (Ubuntu 24.04): [lore-desktop_amd64.deb](https://releases.lore.org/desktop/releases/stable/lore-desktop_amd64.deb)\r\n- Linux (AppImage): [Lore-Desktop-x86_64.AppImage](https://releases.lore.org/desktop/releases/stable/Lore-Desktop-x86_64.AppImage)\r\n\r\n##  ⬇️ Open Source Lore Assets Below ⬇️","reactions":{"total_count":8,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":3,"rocket":2,"eyes":0}}
