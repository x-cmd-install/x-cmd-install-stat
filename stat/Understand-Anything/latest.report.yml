{"id":446035017,"author":{"login":"Lum1104","id":87774050,"node_id":"MDQ6VXNlcjg3Nzc0MDUw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORnUji84alfRJ","tag_name":"v2.9.8","target_commitish":"b861852dda79273bd9d2e01c3160d42e2df510d2","name":"v2.9.8 — Code lessons + Devin/MCP support","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-15T03:24:50Z","updated_at":"2026-11-15T12:10:30Z","published_at":"2026-11-15T12:10:30Z","assets":[{"id":750885220,"node_id":"RA_kwDORnUji84swZlk","name":"understand-anything-viewer.tgz","label":"","uploader":{"login":"Lum1104","id":87774050,"node_id":"MDQ6VXNlcjg3Nzc0MDUw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":807775,"digest":"sha256:37393fc364e7c71b13ea657b9b2bca91c8232474dd7e6efb9f627e72a87ef65c","download_count":2112,"created_at":"2026-11-15T12:10:28Z","updated_at":"2026-11-15T12:10:29Z"}],"body":"## Highlights\n\n### Code lessons alongside your source (#753) — by @06FallingLight90\n\nThe code viewer now includes per-file explanations aligned with the guided tour. Tour-covered files get detailed sections; clicking a section highlights its source lines. Other files receive an overview. Lessons are generated when the tour is built or rebuilt, published after the graph is saved, and pruned when files leave the graph. Partial updates preserve existing lessons; a tour rebuild refreshes their line ranges.\n\n### Devin support and a stdio MCP server (#726) — by @isaiahfrantz\n\nDevin can load the plugin's analysis pipeline and post-commit hooks. The new MCP server exposes six tools for existing graphs: status, search, explanation, change-impact analysis, onboarding, and dashboard startup. Each tool includes graph freshness information, and dashboard processes are stopped when the server exits. Setup instructions are in the [MCP README](https://github.com/Egonex-AI/Understand-Anything/blob/v2.9.8/understand-anything-plugin/packages/mcp/README.md).\n\n### Incremental analysis and symbol preservation\n\n- Deterministic incremental preparation reconciles file changes, ignore rules, structural fingerprints, and imports. Updates preserve surviving architecture and tour content when those stages do not need to run (#682).\n- Source-evidence checks protect existing symbols during incremental updates, and failed finalization restores the saved graph and fingerprints (#683, #753).\n- Fingerprints match methods by their enclosing owner and name, keeping same-named methods in different classes distinct (#766) — by @thejesh23.\n- Baseline batch merging, Python relative imports, Makefile target detection, and `tested_by` relationships for Swift, Rust, Ruby, and PHP receive correctness fixes (#564, #728, #725, #689).\n\n### Graph freshness and automatic updates\n\n- The dashboard and graph-consuming skills report when saved analysis is stale (#558) — by @jiang4wqy.\n- PostToolUse hooks read tool input from stdin and deliver additional context in the supported response format (#598, #609) — by @amitvijapur and @KumamuKuma.\n- Commits containing only generated graph artifacts no longer trigger an auto-update loop (#634) — by @SulimanAbdulrazzaq.\n- Unreadable files are reported separately from files without parser support (#686) — by @dajiaohuang.\n\n### Dashboard and large-repository support\n\n- Force-layout computation runs in a Web Worker (#576) — by @KumamuKuma.\n- Graph-processing improvements cover tour generation, parsing, community detection, filtering, and embedding search (#490) — by @DashBot-0001.\n- A reproducible benchmark records deterministic analysis timings, memory, coverage, and integrity results for large repositories (#587) — by @KumamuKuma.\n- Markdown files render in the code viewer, and graph-loading failures surface their HTTP errors (#577).\n- `/understand --exclude` accepts user-supplied ignore patterns (#373) — by @yiziff. Starter ignore rules now cover additional Python, Rust, Ruby, and Swift tests and fixtures (#579, #582, #597, #600) — by @thejesh23.\n\n### Languages, installation, and documentation\n\n- Vietnamese dashboard, skill, and README support (#709) — by @rgb-vgx.\n- Kimi installation uses `.kimi-code/skills` on Unix and Windows (#685, #687) — by @FumasterLin and @dajiaohuang.\n- Windows installation supports PowerShell 5.1 (#185) — by @Bortlesboat.\n- Updated Codex and VS Code Copilot installation guidance, contributor test commands, translated READMEs, and onboarding output saved as `UA_ONBOARDING.md` (#566, #756, #718, #567, #606, #637).\n\n## Standalone viewer\n\nThe attached `understand-anything-viewer.tgz` includes the dashboard from this release. Open an already analyzed project with:\n\n```bash\nnpx https://github.com/Egonex-AI/Understand-Anything/releases/download/v2.9.8/understand-anything-viewer.tgz /path/to/analyzed/project\n```\n\nThe viewer requires Node.js 18 or newer. Workspace builds and the MCP server require Node.js 22 or newer and pnpm 10 or newer. Existing `.ua/` and legacy `.understand-anything/` data directories remain supported.\n\n**Full Changelog**: https://github.com/Egonex-AI/Understand-Anything/compare/v2.9.0...v2.9.8\n","mentions_count":13}
