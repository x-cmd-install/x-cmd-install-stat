,{"id":531641381,"node_id":"RA_kwDOAg1jWs4fsDQl","name":"xmake-v3.1.1.win32.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":2209163,"digest":"sha256:26a574af424a7a69f9927c9c5f1a04ae6a1ad4a559dc8c85c440566ba2195815","download_count":295,"created_at":"2026-08-27T02:36:18Z","updated_at":"2026-08-27T02:36:18Z"},{"id":531641398,"node_id":"RA_kwDOAg1jWs4fsDQ2","name":"xmake-v3.1.1.win32.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":76,"digest":"sha256:d25038186997a3dd7b07c7b7da1f972a9d37c92b072474f047a4a9f50b30bbfd","download_count":210,"created_at":"2026-08-27T02:36:20Z","updated_at":"2026-08-27T02:36:20Z"},{"id":531641392,"node_id":"RA_kwDOAg1jWs4fsDQw","name":"xmake-v3.1.1.win32.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3943116,"digest":"sha256:fec180eca7a17e80dbf680390ea1fada838fb046b0f80306d534603327b72caa","download_count":195,"created_at":"2026-08-27T02:36:19Z","updated_at":"2026-08-27T02:36:20Z"},{"id":531646273,"node_id":"RA_kwDOAg1jWs4fsEdB","name":"xmake-v3.1.1.win64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4053240,"digest":"sha256:8df50f2884111ff874d290e61e1a26d2117e498f626fb1c6985545e2e4abab35","download_count":37296,"created_at":"2026-08-27T02:42:49Z","updated_at":"2026-08-27T02:42:50Z"},{"id":531646346,"node_id":"RA_kwDOAg1jWs4fsEeK","name":"xmake-v3.1.1.win64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":76,"digest":"sha256:9c0a5220d9f7daec31aaf35163f3107c3169d73ba63385a2a452fef3e9592714","download_count":318,"created_at":"2026-08-27T02:42:52Z","updated_at":"2026-08-27T02:42:52Z"},{"id":531646291,"node_id":"RA_kwDOAg1jWs4fsEdT","name":"xmake-v3.1.1.win64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6163696,"digest":"sha256:33fdf2f34a0e45fa731c000d59590d27b13dec7011f69cbf575004ed9279b4a2","download_count":1822,"created_at":"2026-08-27T02:42:51Z","updated_at":"2026-08-27T02:42:52Z"},{"id":531596354,"node_id":"RA_kwDOAg1jWs4fr4RC","name":"xmake-v3.1.1.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6076403,"digest":"sha256:7cb2ca42c14e52b533db1189fdfda84b4330937590c773ed5f0f72900d818c98","download_count":197,"created_at":"2026-08-27T01:47:32Z","updated_at":"2026-08-27T01:47:33Z"}],"body":"### New features\r\n\r\n* [#7696](https://github.com/xmake-io/xmake/pull/7696): Add addons support, to extend xmake with plugins, rules, toolchains, templates, modules and includes files\r\n* [#7702](https://github.com/xmake-io/xmake/pull/7702): Auto-install the addons declared by a project and lock them in `xmake-addons.lock`\r\n* [#7714](https://github.com/xmake-io/xmake/pull/7714): Support `add_addons(...)` in `xmake.lua`\r\n* [#7706](https://github.com/xmake-io/xmake/pull/7706): Add tests for addons\r\n* [#7707](https://github.com/xmake-io/xmake/pull/7707): Add tests for the package definitions shipped by addons\r\n* [#7717](https://github.com/xmake-io/xmake/pull/7717): Move the `format` / `doxygen` / `macro` plugins to addons\r\n* [#7723](https://github.com/xmake-io/xmake/pull/7723): Add new cross-compilation architectures, e.g. SPARC64\r\n* [#7721](https://github.com/xmake-io/xmake/pull/7721): Add the `package.host.install_locally` policy\r\n* [#7699](https://github.com/xmake-io/xmake/pull/7699): Rework the templates directory and template distribution\r\n* Add the `pkg` package manager for BSD\r\n\r\n### Changes\r\n\r\n* [#7719](https://github.com/xmake-io/xmake/pull/7719): Propagate the vector extensions of a package to its consumers\r\n* [#7713](https://github.com/xmake-io/xmake/pull/7713): Run `hlsl2spv` / `glsl2spv` before the C++ module scan\r\n* [#7722](https://github.com/xmake-io/xmake/pull/7722): Improve the interpreter, project loading, search cache and semver\r\n* [#7733](https://github.com/xmake-io/xmake/pull/7733): Check the name conflicts of the global modules of addons\r\n* [#7726](https://github.com/xmake-io/xmake/pull/7726): Improve the mingw toolchain for clang and libc++\r\n\r\n### Bugs fixed\r\n\r\n* [#7737](https://github.com/xmake-io/xmake/pull/7737): Fix the duplicated packages of the nested builds when installing them locally\r\n* [#7738](https://github.com/xmake-io/xmake/issues/7738): Fix the platform menu of the remote build, e.g. `xmake f -p windows --wdk=xxx`\r\n* [#7710](https://github.com/xmake-io/xmake/pull/7710): Fix the link name of libraries ending with `.lib`\r\n* [#7709](https://github.com/xmake-io/xmake/pull/7709): Fix the runtime flags of clang\r\n* [#7703](https://github.com/xmake-io/xmake/pull/7703): Fix wix to recognize `x86_64` when passing `-arch`\r\n* [#7701](https://github.com/xmake-io/xmake/pull/7701): Fix the dependency check to detect appended nested values\r\n* [#7698](https://github.com/xmake-io/xmake/pull/7698): Fix the semver version selection and build metadata sorting\r\n* Fix `scheduler.co_resume` to raise the errors of the resumed coroutine\r\n\r\n\r\n### \u65b0\u7279\u6027\r\n\r\n* [#7696](https://github.com/xmake-io/xmake/pull/7696): \u6dfb\u52a0 addons \u652f\u6301\uff0c\u53ef\u4ee5\u7528\u63d2\u4ef6\u3001\u89c4\u5219\u3001\u5de5\u5177\u94fe\u3001\u6a21\u677f\u3001\u6a21\u5757\u548c includes \u6587\u4ef6\u6269\u5c55 xmake\r\n* [#7702](https://github.com/xmake-io/xmake/pull/7702): \u81ea\u52a8\u5b89\u88c5\u5de5\u7a0b\u58f0\u660e\u7684 addon\uff0c\u5e76\u7528 `xmake-addons.lock` \u9501\u5b9a\u7248\u672c\r\n* [#7714](https://github.com/xmake-io/xmake/pull/7714): \u652f\u6301\u5728 `xmake.lua` \u4e2d\u4f7f\u7528 `add_addons(...)`\r\n* [#7706](https://github.com/xmake-io/xmake/pull/7706): \u6dfb\u52a0 addon \u6d4b\u8bd5\r\n* [#7707](https://github.com/xmake-io/xmake/pull/7707): \u6dfb\u52a0 addon \u5206\u53d1 package \u5b9a\u4e49\u7684\u6d4b\u8bd5\r\n* [#7717](https://github.com/xmake-io/xmake/pull/7717): \u5c06 `format` / `doxygen` / `macro` \u63d2\u4ef6\u8fc1\u79fb\u4e3a addon\r\n* [#7723](https://github.com/xmake-io/xmake/pull/7723): \u6dfb\u52a0\u65b0\u7684\u4ea4\u53c9\u7f16\u8bd1\u67b6\u6784\uff0c\u4f8b\u5982 SPARC64\r\n* [#7721](https://github.com/xmake-io/xmake/pull/7721): \u6dfb\u52a0 `package.host.install_locally` \u7b56\u7565\r\n* [#7699](https://github.com/xmake-io/xmake/pull/7699): \u91cd\u6784\u6a21\u677f\u76ee\u5f55\u548c\u6a21\u677f\u5206\u53d1\r\n* \u6dfb\u52a0 BSD \u7684 `pkg` \u5305\u7ba1\u7406\u5668\u652f\u6301\r\n\r\n### \u6539\u8fdb\r\n\r\n* [#7719](https://github.com/xmake-io/xmake/pull/7719): \u5c06\u5305\u7684\u5411\u91cf\u6269\u5c55\u914d\u7f6e\u4f20\u9012\u7ed9\u4f7f\u7528\u5b83\u7684\u76ee\u6807\r\n* [#7713](https://github.com/xmake-io/xmake/pull/7713): \u8ba9 `hlsl2spv` / `glsl2spv` \u5728 C++ \u6a21\u5757\u626b\u63cf\u4e4b\u524d\u6267\u884c\r\n* [#7722](https://github.com/xmake-io/xmake/pull/7722): \u6539\u8fdb interpreter\u3001\u5de5\u7a0b\u52a0\u8f7d\u3001\u641c\u7d22\u7f13\u5b58\u548c semver\r\n* [#7733](https://github.com/xmake-io/xmake/pull/7733): \u68c0\u67e5 addon \u5168\u5c40\u6a21\u5757\u7684\u547d\u540d\u51b2\u7a81\r\n* [#7726](https://github.com/xmake-io/xmake/pull/7726): \u6539\u8fdb mingw \u5de5\u5177\u94fe\u5bf9 clang \u548c libc++ \u7684\u652f\u6301\r\n\r\n### Bug \u4fee\u590d\r\n\r\n* [#7737](https://github.com/xmake-io/xmake/pull/7737): \u4fee\u590d\u672c\u5730\u5b89\u88c5\u5305\u65f6\uff0c\u5d4c\u5957\u6784\u5efa\u91cd\u590d\u5b89\u88c5\u5305\u7684\u95ee\u9898\r\n* [#7738](https://github.com/xmake-io/xmake/issues/7738): \u4fee\u590d\u8fdc\u7a0b\u7f16\u8bd1\u4e0b\u7684\u5e73\u53f0\u83dc\u5355\uff0c\u4f8b\u5982 `xmake f -p windows --wdk=xxx`\r\n* [#7710](https://github.com/xmake-io/xmake/pull/7710): \u4fee\u590d `.lib` \u7ed3\u5c3e\u7684\u5e93\u540d\u88ab\u9519\u8bef\u88c1\u526a\u7684\u95ee\u9898\r\n* [#7709](https://github.com/xmake-io/xmake/pull/7709): \u4fee\u590d clang \u7684 runtime flags \u68c0\u6d4b\r\n* [#7703](https://github.com/xmake-io/xmake/pull/7703): \u4fee\u590d wix \u4f20\u9012 `-arch` \u65f6\u65e0\u6cd5\u8bc6\u522b `x86_64` \u7684\u95ee\u9898\r\n* [#7701](https://github.com/xmake-io/xmake/pull/7701): \u4fee\u590d\u4f9d\u8d56\u68c0\u6d4b\u65e0\u6cd5\u53d1\u73b0\u5d4c\u5957\u503c\u8ffd\u52a0\u7684\u95ee\u9898\r\n* [#7698](https://github.com/xmake-io/xmake/pull/7698): \u4fee\u590d semver \u7684\u7248\u672c\u9009\u62e9\u548c build metadata \u6392\u5e8f\r\n* \u4fee\u590d `scheduler.co_resume`\uff0c\u8ba9\u88ab\u6062\u590d\u534f\u7a0b\u7684\u9519\u8bef\u80fd\u591f\u6b63\u5e38\u629b\u51fa\r\n\r\n## What's Changed\r\n* move templates dir by @waruqi in https://github.com/xmake-io/xmake/pull/7699\r\n* fix(semver): correct version selection by @apocelipes in https://github.com/xmake-io/xmake/pull/7698\r\n* fix(depend): detect appended nested values by @jnhu76 in https://github.com/xmake-io/xmake/pull/7701\r\n* Auto fetch addons by @waruqi in https://github.com/xmake-io/xmake/pull/7702\r\n* fix(pack): recognize x86_64 when passing -arch to wix by @gycherish in https://github.com/xmake-io/xmake/pull/7703\r\n* Add addon support for plugins by @waruqi in https://github.com/xmake-io/xmake/pull/7696\r\n* add packages test for addon by @waruqi in https://github.com/xmake-io/xmake/pull/7707\r\n* add addon test by @waruqi in https://github.com/xmake-io/xmake/pull/7706\r\n* fix clang runtime flags by @waruqi in https://github.com/xmake-io/xmake/pull/7709\r\n* fix linkname by @waruqi in https://github.com/xmake-io/xmake/pull/7710\r\n* move add_addons to xmake.lua by @waruqi in https://github.com/xmake-io/xmake/pull/7714\r\n* let hlsl2spv before module scan by @vkensou in https://github.com/xmake-io/xmake/pull/7713\r\n* Move some plugins to addons by @waruqi in https://github.com/xmake-io/xmake/pull/7717\r\n* Propagate package vector extensions to consumers by @Northn in https://github.com/xmake-io/xmake/pull/7719\r\n* add host install locally policy by @waruqi in https://github.com/xmake-io/xmake/pull/7721\r\n* improve core by @waruqi in https://github.com/xmake-io/xmake/pull/7722\r\n* Add new architectures for cross-compilation by @ifarbod in https://github.com/xmake-io/xmake/pull/7723\r\n* Check conflict for addon modules by @waruqi in https://github.com/xmake-io/xmake/pull/7733\r\n* Improve MinGW toolchain support for Clang and libc++ by @damster101 in https://github.com/xmake-io/xmake/pull/7726\r\n* fix local dir by @waruqi in https://github.com/xmake-io/xmake/pull/7737\r\n\r\n## New Contributors\r\n* @jnhu76 made their first contribution in https://github.com/xmake-io/xmake/pull/7701\r\n* @gycherish made their first contribution in https://github.com/xmake-io/xmake/pull/7703\r\n* @damster101 made their first contribution in https://github.com/xmake-io/xmake/pull/7726\r\n\r\n**Full Changelog**: https://github.com/xmake-io/xmake/compare/v3.1.0...v3.1.1","mentions_count":8}
