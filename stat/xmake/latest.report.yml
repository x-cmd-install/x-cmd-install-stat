/github.com/xmake-io/xmake/pull/7812): \u514b\u9686\u3001\u53cd\u8f6c\u56fe\u65f6\u4fdd\u7559\u5b64\u7acb\u9876\u70b9\r\n* [#7825](https://github.com/xmake-io/xmake/pull/7825): \u4fee\u590d\u7a7a\u5b57\u7b26\u4e32\u7684\u52a0\u6743 Levenshtein \u8ddd\u79bb\r\n* [#7827](https://github.com/xmake-io/xmake/pull/7827): \u4fee\u590d `table.clone(value, -1)` \u6df1\u62f7\u8d1d\r\n\r\n## What's Changed\r\n* add more lua native modules by @waruqi in https://github.com/xmake-io/xmake/pull/7743\r\n* fix C++ modules scanning and compile_commands for Clang with MSVC environment by @damster101 in https://github.com/xmake-io/xmake/pull/7750\r\n* Support Clang 23 `--precompile-reduced-bmi` pipeline by @ryblust in https://github.com/xmake-io/xmake/pull/7742\r\n* support unicode escapes in the pure lua json decoder by @zjncs in https://github.com/xmake-io/xmake/pull/7752\r\n* escape brackets in path.pattern by @zjncs in https://github.com/xmake-io/xmake/pull/7753\r\n* fix(verilator): Add verilator arguments as depvalues by @24bit-xjkp in https://github.com/xmake-io/xmake/pull/7749\r\n* Fix quoted flags in the Conan generator by @Hanabi9248 in https://github.com/xmake-io/xmake/pull/7760\r\n* fix: enable exceptions for clang-cl by default by @ShrBox in https://github.com/xmake-io/xmake/pull/7763\r\n* add downloader option for download tasks and do not use aria2 UserAgent by @luadebug in https://github.com/xmake-io/xmake/pull/7758\r\n* Add raddbg as Linux debugger by @ArnavMehta3000 in https://github.com/xmake-io/xmake/pull/7766\r\n* check workdir by @waruqi in https://github.com/xmake-io/xmake/pull/7767\r\n* fix(depend): detect changed number and boolean values by @Dev-next-gen in https://github.com/xmake-io/xmake/pull/7765\r\n* Keep the default MSVC environment when a newer toolset is incomplete by @Hanabi9248 in https://github.com/xmake-io/xmake/pull/7761\r\n* Improve xmakever by @waruqi in https://github.com/xmake-io/xmake/pull/7757\r\n* fetch local addon by @waruqi in https://github.com/xmake-io/xmake/pull/7776\r\n* qt: avoid debug suffix for Harmony libraries by @KnightJun in https://github.com/xmake-io/xmake/pull/7772\r\n* remove gitee/gitcode mirror by @waruqi in https://github.com/xmake-io/xmake/pull/7780\r\n* fix midl detection when cross-compiling to arm64 by @space-axel in https://github.com/xmake-io/xmake/pull/7782\r\n* Preserve MSVC system includes in clangd compilation databases by @gabriel-andreescu in https://github.com/xmake-io/xmake/pull/7770\r\n* Add the compiler runtime library directory to $PATH when installing p\u2026 by @gycherish in https://github.com/xmake-io/xmake/pull/7779\r\n* feat: add `xmake test --output-on-failure` by @space-axel in https://github.com/xmake-io/xmake/pull/7791\r\n* add configdirs for pkgconfig/find_package by @waruqi in https://github.com/xmake-io/xmake/pull/7792\r\n* fix #7786 Failed to find brew::XXX under macOS by @WittonBell in https://github.com/xmake-io/xmake/pull/7789\r\n* Improve module cache for asan by @waruqi in https://github.com/xmake-io/xmake/pull/7788\r\n* parse version_build, version_prerelease in semver by @choyy in https://github.com/xmake-io/xmake/pull/7799\r\n* fix vs_runtime warning by @choyy in https://github.com/xmake-io/xmake/pull/7803\r\n* Include nil members in hashset equality by @skyoyy in https://github.com/xmake-io/xmake/pull/7801\r\n* Fix invalid-input checks in the isnan test by @zqzq0422 in https://github.com/xmake-io/xmake/pull/7800\r\n* fix static deps by @waruqi in https://github.com/xmake-io/xmake/pull/7798\r\n* Fix isolated vertices being dropped by graph clone and reverse by @NUMS-half in https://github.com/xmake-io/xmake/pull/7812\r\n* Return removed items from list pop and shift by @kkxuexihenlan in https://github.com/xmake-io/xmake/pull/7811\r\n* Fix heap ordering after removing a non-root element by @kkxuexihenlan in https://github.com/xmake-io/xmake/pull/7810\r\n* fix addons for repo by @waruqi in https://github.com/xmake-io/xmake/pull/7809\r\n* Skip the compiler cache for MSVC precompiled headers by @gabriel-andreescu in https://github.com/xmake-io/xmake/pull/7819\r\n* Unescape dollar signs in gcc dependency files by @gabriel-andreescu in https://github.com/xmake-io/xmake/pull/7816\r\n* Fix clang-cl PCH dependency tracking by @gabriel-andreescu in https://github.com/xmake-io/xmake/pull/7815\r\n* add --std c++23 mapping to nvcc by @bolu61 in https://github.com/xmake-io/xmake/pull/7808\r\n* Remove `raise` from ascend c toolchain by @Stehsaer in https://github.com/xmake-io/xmake/pull/7813\r\n* Activate the required version of installed addons by @gabriel-andreescu in https://github.com/xmake-io/xmake/pull/7821\r\n* Fix Levenshtein costs for empty strings by @Hanabi9249 in https://github.com/xmake-io/xmake/pull/7825\r\n* Fix documented deep table cloning by @Hanabi9249 in https://github.com/xmake-io/xmake/pull/7827\r\n* add `-Qunused-arguments` for clang-cl by @damster101 in https://github.com/xmake-io/xmake/pull/7852\r\n* Xpack: add inno setup support by @choyy in https://github.com/xmake-io/xmake/pull/7854\r\n* update matlab versions by @charlesseizilles in https://github.com/xmake-io/xmake/pull/7855\r\n* fix git pull issues by @waruqi in https://github.com/xmake-io/xmake/pull/7820\r\n* Fix unused include flags when compiling Clang module BMIs by @L-Sun in https://github.com/xmake-io/xmake/pull/7849\r\n* fix(make): pass the toolchain programs if toolchains are specified by @gycherish in https://github.com/xmake-io/xmake/pull/7857\r\n* fix gxx compatibility with gcc in tool detection and flag matching by @damster101 in https://github.com/xmake-io/xmake/pull/7853\r\n* Add addons examples by @waruqi in https://github.com/xmake-io/xmake/pull/7860\r\n\r\n## New Contributors\r\n* @ryblust made their first contribution in https://github.com/xmake-io/xmake/pull/7742\r\n* @zjncs made their first contribution in https://github.com/xmake-io/xmake/pull/7752\r\n* @Hanabi9248 made their first contribution in https://github.com/xmak