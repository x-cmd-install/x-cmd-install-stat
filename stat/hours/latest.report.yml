s)\r\n- Keymap to finish active task log without comment\r\n- Contextual cues in the \"Task Log Entry\" view\r\n\r\nhttps://github.com/user-attachments/assets/f588967f-f393-4012-99bd-63e8dc6fed1e\r\n\r\n### Changed\r\n\r\n- Removed date range limit for stats and log commands\r\n- Missing end date in date range implies today (eg. 2025/08/12...)\r\n- \"today\" can be used in date range (eg. 2025/08/12...today)\r\n- Improved TUI navigation: esc/q now function in more panes, returning the user\r\n    to previous panes in a predictable manner\r\n- User messages in the TUI remain visible for a while\r\n- Minimum terminal width needed brought down to 80 characters (from 96)\r\n\r\n---\r\n\r\n## Changelog\r\n* d75892e598244acf7e87e37a7cdb67e1576bb1b2 add basic snapshot tests (#93)\r\n* c4040c53811ee27b3ec56e1a6dc59dc9e88d9ab2 add more ways to specify \"today\" in date range (#85)\r\n* 70049e3a796cad047c039f497eb4709ece5712d7 allow logging frames (for debugging) (#91)\r\n* fb3601c20154867e4773b17e5eb721a2bb7477d3 allow saving time log without asking for comment (#86)\r\n* 616e45265563cf45950ad91f9bc383e219f9c0f5 build: bump github.com/charmbracelet/bubbletea from 1.3.5 to 1.3.6 (#76)\r\n* 813e31076fcc5580980b2670fd4f91cd5d3211e3 build: bump github.com/olekukonko/tablewriter from 1.0.7 to 1.0.8 (#75)\r\n* b281e5207f3c762aa43ee3f3661b7d85014476a6 build: bump github.com/olekukonko/tablewriter from 1.0.8 to 1.0.9 (#81)\r\n* e6bcb420a2a815cc5c445990b808c2ff7ad7661d build: bump modernc.org/sqlite from 1.37.1 to 1.38.0 (#73)\r\n* 974af56609ece003a44cb334223fc18038f92f7d build: bump modernc.org/sqlite from 1.38.0 to 1.38.1 (#78)\r\n* 8e577bd7c6c027c698b6302c7d403294877fbde7 build: bump modernc.org/sqlite from 1.38.1 to 1.38.2 (#80)\r\n* 0493ed5360e04362c9e9a82ed38964b6cbd6375f build: upgrade go and deps (#63)\r\n* df1e976b3e987a82e37cb6a9834e0d58d5beff92 chore(deps): bump github.com/charmbracelet/bubbles from 0.20.0 to 0.21.0 (#66)\r\n* 526d0de3d6c15d9566c98eece1c9a6ea60e34525 chore(deps): bump github.com/charmbracelet/bubbletea from 1.3.4 to 1.3.5 (#65)\r\n* 23f6d3958f4ab6487a60c18fba5b3c76e66689e6 chore(deps): bump jaxxstorm/action-install-gh-release from 2.0.0 to 2.1.0 (#64)\r\n* 06aad6d124d9090d393c3a45949e25b40ba05e67 chore(deps): bump modernc.org/sqlite from 1.37.0 to 1.37.1 (#69)\r\n* e721a0f99a8fc06a427dabcff9d38e814c2dfb90 feat(stats): filter (in)active tasks (#56)\r\n* cde501edc85719e38f5d5fe871110b456fcfa1db improve cicd (#72)\r\n* d0643a91e5a6a8c104baa4d0570bf700dbef1358 improve traversal in the tui (#89)\r\n* d454e68bb6b210a4d653d51c9f51e4f69906d20e lower min terminal width needed (#97)\r\n* 3c4cf98acf80f1104d7f2d6f305ec4e44af3526b pass time provider as a dependency (#92)\r\n* d298983a882d2e93ad920201a833657ef94bd2dc persist user messages for a while (#90)\r\n* c0aa94f0b19de20c99c027541e06920fce1489f0 remove range limit for stats and log (#84)\r\n* 8ba28d493c52349faa49bced6db422202ba37347 remove reviewers from dependabot config\r\n* e01b36a8ef034d44dbdeb5064646834319ce6459 show contextual cues in task log entry view (#88)\r\n* a29a5ce7b7c6f2025f24d51225fda3170a9c9a8c streamline task log duration validation (#95)\r\n* 36d6f1411f2a0442662033441214eb17eeb53484 update changelog for v0.6.0\r\n* b6835e16bba4e1ccc61b9c54108e663398dda183 update dependabot commit message\r\n* 59cea83850d8e18dcc151d1c2f2d0421591ca05c upgrade dependencies (#98)\r\n* a181531ef57db923a03c00d704382a065fe3705b upgrade go to 1.24.3 (#67)\r\n* ec3075e022f8ac243f3958adcfe76753940bcf28 upgrade tablewriter to v1 (#71)\r\n* 657c01d6dd34576fbf76800391d2228b54c685fe upgrade to go 1.24.4 (#74)\r\n* 10fd02cf622eefb0a1277df5603abcddcfbf018c upgrade to go 1.25.0 (#82)\r\n* acfb3c71da4e1749f0a3c4c99aa0988bef227198 use correct badge\r\n* 23b1236e37a522036097a9aa6825e628f5626fe5 use correct key for theme tests (#87)","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
