EXQF","name":"kapp-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":77052416,"digest":"sha256:13e430858479a68bee76bae1edc1049431b2ef200f20a8917bd62173d0875608","download_count":15,"created_at":"2026-11-12T12:07:32Z","updated_at":"2026-11-12T12:07:35Z"}],"body":"<details>\r\n\r\n<summary><h2>Installation and signature verification</h2></summary>\r\n\r\n### Installation\r\n\r\n#### By downloading binary from the release\r\n\r\nFor instance, if you are using Linux on an AMD64 architecture:\r\n```shell\r\n# Download the binary\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.66.2/kapp-linux-amd64\r\n\r\n# Move the binary in to your PATH\r\nmv kapp-linux-amd64 /usr/local/bin/kapp\r\n\r\n# Make the binary executable\r\nchmod +x /usr/local/bin/kapp\r\n```\r\n\r\n#### Via Homebrew (macOS or Linux)\r\n```shell\r\n$ brew tap carvel-dev/carvel\r\n$ brew install kapp\r\n$ kapp version  \r\n```\r\n\r\n### Verify checksums file signature\r\n\r\nThe checksums file provided within the artifacts attached to this release is signed using [Cosign](https://docs.sigstore.dev/cosign/overview/) with GitHub OIDC(Refer [this](https://docs.sigstore.dev/system_config/installation/) page for cosign installation). To validate the signature of this file, run the following commands:\r\n\r\n```shell\r\n# Download the checksums file, certificate and signature\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.66.2/checksums.txt\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.66.2/checksums.txt.pem\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.66.2/checksums.txt.sig\r\n\r\n# Verify the checksums file\r\ncosign verify-blob checksums.txt \\\r\n  --certificate checksums.txt.pem \\\r\n  --signature checksums.txt.sig \\\r\n  --certificate-identity-regexp=https://github.com/carvel-dev \\\r\n  --certificate-oidc-issuer=https://token.actions.githubusercontent.com\r\n```\r\n\r\n### Verify binary integrity\r\n\r\nTo verify the integrity of the downloaded binary, you can utilize the checksums file after having validated its signature.\r\n```shell\r\n# Verify the binary using the checksums file\r\nsha256sum -c checksums.txt --ignore-missing\r\n```\r\n</details>\r\n\r\n## What's Changed\r\n* f54f5342 Bump Go to 1.27.4 and update dependencies to fix CVEs\r\n* 8558cf83 Bump carvel.dev/kapp-controller from 0.59.7 to 0.60.9\r\n* 1716cc2f Document FORCE_COLOR in the kapp help\r\n* 7106aa55 Merge pull request #1140 from carvel-dev/dependabot/go_modules/carvel.dev/kapp-controller-0.60.9\r\n* 89c3a830 Merge pull request #1143 from himsngh/fix/729-noop-dependency-ordering\r\n* 21455a9b Merge pull request #1145 from cvas22/docs/632-force-color\r\n* a68752f6 Merge pull request #1148 from praveenrewar/chore/bump-go-1.27.4\r\n* cbe96d53 Preserve dependency ordering for unchanged resources\r\n\r\n## :open_file_folder: Files Checksum\r\n\r\n```\r\ne93b89fbd1a15495725119bb4a0fd70b98efaa206532f9c8398ad4ad7a05c8aa  ./kapp-darwin-amd64\r\n80fedd817c6df60253ba73b1f3d15a87daba5d401113cd74b2332899036a5a93  ./kapp-darwin-arm64\r\n48122dc249e48f8c92e2b3613fb4672950aaef2570248655fbede4c4d57b08a3  ./kapp-linux-amd64\r\n3c2fc725afee527a0e38b4da55e41bdddf608d27a1ee830c29ba566132366fcb  ./kapp-linux-arm64\r\n13e430858479a68bee76bae1edc1049431b2ef200f20a8917bd62173d0875608  ./kapp-windows-amd64.exe\r\n```\r\n\r\n"}
