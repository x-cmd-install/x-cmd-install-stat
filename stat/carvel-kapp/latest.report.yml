nvz284fiJnX","name":"kapp-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":79057920,"digest":"sha256:e9c0c3e48ba2b3c26380b6a997dcf1798b19147c3e9a11895a4e9c55c52470b0","download_count":40,"created_at":"2026-08-25T10:45:58Z","updated_at":"2026-08-25T10:46:02Z"}],"body":"\r\n\r\n<details>\r\n\r\n<summary><h2>Installation and signature verification</h2></summary>\r\n\r\n### Installation\r\n\r\n#### By downloading binary from the release\r\n\r\nFor instance, if you are using Linux on an AMD64 architecture:\r\n```shell\r\n# Download the binary\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.65.4/kapp-linux-amd64\r\n\r\n# Move the binary in to your PATH\r\nmv kapp-linux-amd64 /usr/local/bin/kapp\r\n\r\n# Make the binary executable\r\nchmod +x /usr/local/bin/kapp\r\n```\r\n\r\n#### Via Homebrew (macOS or Linux)\r\n```shell\r\n$ brew tap carvel-dev/carvel\r\n$ brew install kapp\r\n$ kapp version  \r\n```\r\n\r\n### Verify checksums file signature\r\n\r\nThe checksums file provided within the artifacts attached to this release is signed using [Cosign](https://docs.sigstore.dev/cosign/overview/) with GitHub OIDC(Refer [this](https://docs.sigstore.dev/system_config/installation/) page for cosign installation). To validate the signature of this file, run the following commands:\r\n\r\n```shell\r\n# Download the checksums file, certificate and signature\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.65.4/checksums.txt\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.65.4/checksums.txt.pem\r\ncurl -LO https://github.com/carvel-dev/kapp/releases/download/v0.65.4/checksums.txt.sig\r\n\r\n# Verify the checksums file\r\ncosign verify-blob checksums.txt \\\r\n  --certificate checksums.txt.pem \\\r\n  --signature checksums.txt.sig \\\r\n  --certificate-identity-regexp=https://github.com/carvel-dev \\\r\n  --certificate-oidc-issuer=https://token.actions.githubusercontent.com\r\n```\r\n\r\n### Verify binary integrity\r\n\r\nTo verify the integrity of the downloaded binary, you can utilize the checksums file after having validated its signature.\r\n```shell\r\n# Verify the binary using the checksums file\r\nsha256sum -c checksums.txt --ignore-missing\r\n```\r\n</details>\r\n\r\n\r\n## What's Changed\r\n* Allow non-approved MD5 use under GODEBUG=fips140=only by @sameerforge in https://github.com/carvel-dev/kapp/pull/1133\r\n\r\n**Full Changelog**: https://github.com/carvel-dev/kapp/compare/v0.65.3...v0.65.4\r\n\r\n## :open_file_folder: Files Checksum\r\n\r\n```\r\nbf7df0647d7645572d45185bb8bf6a40dd1e631ff4ee1522bc8ce56db53bd243  ./kapp-linux-amd64\r\ne41693ac3d69e1143c7e5fe870712ca05ed810e1e0bc5b00f77ca22ba0f18ae1  ./kapp-linux-arm64\r\nd2f6a45c09703f2aff01422cc130f00f702094757c17804ab18de4dda2249ada  ./kapp-darwin-amd64\r\na7ecd6a2ac62fdce02bb40784f2701e2421539e4bae6c3cd58dc8e943170c666  ./kapp-darwin-arm64\r\ne9c0c3e48ba2b3c26380b6a997dcf1798b19147c3e9a11895a4e9c55c52470b0  ./kapp-windows-amd64.exe\r\n```","mentions_count":1}
