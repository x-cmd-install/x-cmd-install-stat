{"id":389280498,"author":{"login":"cytostack","id":268406248,"node_id":"U_kgDOD_-N6A","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORnz07s4XM_Ly","tag_name":"v2.5.2","target_commitish":"571bd1aec1d383be43d4a9dd0fab5f22ebe025e6","name":"v2.5.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-15T15:47:08Z","updated_at":"2026-09-15T16:00:43Z","published_at":"2026-09-15T16:00:43Z","assets":[{"id":566011629,"node_id":"RA_kwDORnz07s4hvKbt","name":"openwolf-2.5.2.tgz","label":"","uploader":{"login":"cytostack","id":268406248,"node_id":"U_kgDOD_-N6A","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":679811,"digest":"sha256:901a7293536fc9e451a0fecf007c7e7fb1ce22c5edf8acea87dfe43dd08e7677","download_count":6,"created_at":"2026-09-15T15:53:41Z","updated_at":"2026-09-15T15:53:42Z"}],"body":"OpenWolf 2.5.2 adds saved task handover, more reliable project memory, recorded usage by model and quiet session notices.\n\n### Changes\n\n- Transfer selected saved context between Claude Code and Codex with explicit handover packets and project checks.\n- Recover task checkpoints after supported session restarts and compaction.\n- Archive eligible old notes with restore pointers. Preserve active, latest and pinned notes.\n- Preserve project-map entries during partial scans and improve updates after file changes.\n- Reconcile available Claude, Codex and OpenCode token counters. Estimate API costs using the actual provider and model, with missing data shown.\n- Prepare compatible stable hook and plugin updates for new sessions. Major upgrades remain notification-only by default.\n- Show short notices for completed OpenWolf work and synchronize handover, usage, memory and activity in the dashboard.\n- Fix concurrent writes, missing hook dependencies, malformed settings handling and Windows runtime and daemon path issues.\n\n### Upgrade\n\n```bash\nnpm install -g openwolf@2.5.2\nopenwolf update --dry-run\nopenwolf update\n```\n\nRestart project daemons and start new agent sessions. Automatic runtime updates do not replace the global CLI or a running daemon.\n\n### Checks and limits\n\nAll 322 regression tests passed on Linux, macOS and Windows. Package installation, 2.5.1 upgrade and daemon checks passed, including Node 20. [Main validation](https://github.com/cytostack/openwolf/actions/runs/34990762239).\n\nNative Codex recovery through resume and compaction, OpenCode notifications and Grok startup were checked. A full live Claude to Codex to Claude coding handover and broader token-efficiency comparisons remain unverified. Protected durable instructions require independent administrator setup. Handover imports remain explicit. API cost estimates are not subscription charges.\n\n### Credits\n\nThank you to the reporters, PR submitters, code authors and reviewers. [Contributor credits](https://github.com/cytostack/openwolf/blob/v2.5.2/CREDITS.md) and the [issue and PR audit](https://github.com/cytostack/openwolf/blob/v2.5.2/docs/audit/README.md) record each role and distinguish adapted work from merged PRs.\n\n[Full changelog](https://github.com/cytostack/openwolf/blob/v2.5.2/CHANGELOG.md) \u00b7 [Validation details](https://github.com/cytostack/openwolf/blob/v2.5.2/docs/release-2.5.2.md)\n"}
