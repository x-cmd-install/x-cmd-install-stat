ar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":34213952,"digest":null,"download_count":4421646,"created_at":"2019-09-02T12:02:04Z","updated_at":"2019-09-02T12:02:08Z"},{"id":14701922,"node_id":"MDEyOlJlbGVhc2VBc3NldDE0NzAxOTIy","name":"docker-machine-Windows-i386.exe","label":"","uploader":{"login":"guillaumerose","id":172624,"node_id":"MDQ6VXNlcjE3MjYyNA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":29082112,"digest":null,"download_count":9283,"created_at":"2019-09-02T12:02:10Z","updated_at":"2019-09-02T12:02:15Z"},{"id":14701924,"node_id":"MDEyOlJlbGVhc2VBc3NldDE0NzAxOTI0","name":"docker-machine-Windows-x86_64.exe","label":"","uploader":{"login":"guillaumerose","id":172624,"node_id":"MDQ6VXNlcjE3MjYyNA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":34462720,"digest":null,"download_count":134799,"created_at":"2019-09-02T12:02:17Z","updated_at":"2019-09-02T12:02:23Z"},{"id":14701926,"node_id":"MDEyOlJlbGVhc2VBc3NldDE0NzAxOTI2","name":"md5sum.txt","label":"","uploader":{"login":"guillaumerose","id":172624,"node_id":"MDQ6VXNlcjE3MjYyNA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":383,"digest":null,"download_count":471,"created_at":"2019-09-02T12:02:27Z","updated_at":"2019-09-02T12:02:27Z"},{"id":14701925,"node_id":"MDEyOlJlbGVhc2VBc3NldDE0NzAxOTI1","name":"sha256sum.txt","label":"","uploader":{"login":"guillaumerose","id":172624,"node_id":"MDQ6VXNlcjE3MjYyNA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":575,"digest":null,"download_count":2865,"created_at":"2019-09-02T12:02:25Z","updated_at":"2019-09-02T12:02:25Z"}],"body":"## Installation\r\n\r\nIf you're a Mac or Windows user, the [Docker Toolbox](https://www.docker.com/docker-toolbox) will install Docker Machine v0.16.2 for you, alongside the latest versions of the Docker Engine, Compose and Kitematic.\r\n\r\nYou can use the usual commands to install or upgrade:\r\n\r\nOn OS X\r\n```console\r\n$ curl -L https://github.com/docker/machine/releases/download/v0.16.2/docker-machine-`uname -s`-`uname -m` >/usr/local/bin/docker-machine && \\\r\n  chmod +x /usr/local/bin/docker-machine\r\n```\r\nOn Linux\r\n```console\r\n$ curl -L https://github.com/docker/machine/releases/download/v0.16.2/docker-machine-`uname -s`-`uname -m` >/tmp/docker-machine &&\r\n    chmod +x /tmp/docker-machine &&\r\n    sudo cp /tmp/docker-machine /usr/local/bin/docker-machine\r\n```\r\nOn Windows with git bash\r\n```console\r\n$ if [[ ! -d \"$HOME/bin\" ]]; then mkdir -p \"$HOME/bin\"; fi && \\\r\ncurl -L https://github.com/docker/machine/releases/download/v0.16.2/docker-machine-Windows-x86_64.exe > \"$HOME/bin/docker-machine.exe\" && \\\r\nchmod +x \"$HOME/bin/docker-machine.exe\"\r\n```\r\n\r\nOtherwise, download one of the releases from the [release page](https://github.com/docker/machine/releases/) directly.\r\n\r\nSee the install [docs](https://docs.docker.com/machine/install-machine/) for more install options and instructions.\r\n\r\n## Changelog\r\n\r\n* Compile with Golang 1.12.9\r\n* Fix VTX detection\r\n* drivers/amazonec2: add ssh-port flag\r\n* drivers/amazonec2: add eu-north-1 zone\r\n* drivers/vmwarefusion: add nonempty flag to fix share-folder bug\r\n* drivers/hyperv: allow localized names for Virtual Switch\r\n* drivers/google: add support for non-default service account\r\n* drivers/openstack: add flag for metadata\r\n* drivers/softlayer: don't set the request method again\r\n\r\n## Thank You\r\n\r\nThank you very much to our active users and contributors. If you have filed detailed bug reports, THANK YOU!\r\nPlease continue to do so if you encounter any issues. It's your hard work that makes Docker Machine better.\r\n\r\nThe following authors contributed changes to this release:\r\n\r\n- Albin Gustavsson\r\n- Anders F Bj\u00f6rklund\r\n- Chris Crone\r\n- David Gageot\r\n- Gerard Braad\r\n- Guillaume Rose\r\n- Jason-ZW\r\n- Joffrey F\r\n- Mohit Agarwal\r\n- Peter Schultz\r\n- Serhii R\r\n- Stefan Scherer\r\n- Timothy Jones\r\n- Ulysses Souza\r\n- xinau\r\n\r\nGreat thanks to all of the above! We appreciate it. Keep up the great work!\r\n\r\n## Checksums\r\n\r\n\r\n * **docker-machine-Darwin-x86_64**\r\n  * sha256 `367ab763a78ee6ad3b5d3e769838404ad6cc68143dad48870127afeffd6bcc83`\r\n  * md5 `f07310174aa763f03ce37a2e1f5f1323`\r\n * **docker-machine-Linux-aarch64**\r\n  * sha256 `109f534bfb8b9b852c938cad978e60a86b13f5ecf92da5e24320dacd2a7216ac`\r\n  * md5 `7c0e2e6c7ca425671b512897a6c49827`\r\n * **docker-machine-Linux-armhf**\r\n  * sha256 `07f8f7c4e82905d0c9a6fe6f0e84667907f3e1a17d7712e918e76975b67dc6e3`\r\n  * md5 `a5434e74415cfebff5899f74ef83e2f8`\r\n * **docker-machine-Linux-x86_64**\r\n  * sha256 `a7f7cbb842752b12123c5a5447d8039bf8dccf62ec2328853583e68eb4ffb097`\r\n  * md5 `50bac98e320225d04995e944ffdf348c`\r\n * **docker-machine-Windows-i386.exe**\r\n  * sha256 `2b67d7b6cd95983bdb01da472a541052f3ca236950354c7e76f215fbf9188745`\r\n  * md5 `0bf867369463361a789a4d4cb1e54933`\r\n * **docker-machine-Windows-x86_64.exe**\r\n  * sha256 `dcf774857069749b5d973f85b15d926544a7c5556c3478c45b4f35cf86494130`\r\n  * md5 `3d9a29ea55188dddf98c4ca1f02dd623`","reactions":{"total_count":17,"+1":17,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
