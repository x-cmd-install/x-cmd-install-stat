206f1a97260fb423f5125eb2","download_count":30,"created_at":"2026-08-20T08:13:44Z","updated_at":"2026-08-20T08:13:44Z"},{"id":521957964,"node_id":"RA_kwDOHe7bmc4fHHJM","name":"gum_2.0.0_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":5192860,"digest":"sha256:2728fe07a547d1321b681eccf21bf6ad7eb5aea178a1a1843db52136f76b0f73","download_count":13,"created_at":"2026-08-20T08:13:44Z","updated_at":"2026-08-20T08:13:44Z"}],"body":"# Gum v2\r\n\r\nThis release updates [Bubble Tea](https://github.com/charmbracelet/bubbletea) and [Lip Gloss](https://github.com/charmbracelet/lipgloss) to their glorious v2s. While there are no UX changes, there's a ton great stuff with the Bubble Tea v2 ecosystem, most notably faster, more accurate rendering.\r\n\r\n[More on v2](https://charm.land/blog/v2/)\r\n\r\n## New Home \ud83c\udfe0\r\n\r\nNow, Gum uses a new package name `charm.land/gum/v2`!\r\n\r\nHappy coding,\r\n\r\nCharm\r\n\r\n## Changelog\r\n### Fixed\r\n* 057099caf0e53d6aa493278da1d009b86b62ccf7: fix: write was not compiling (@andreynering)\r\n### Docs\r\n* 4409974788c69546c80e5b0f093b904a1e4aed6e: docs: fix README wording (@rohan436)\r\n* fc8e9a5c96e315abf30f0b43eeaf1cb9543b828c: docs: fix filter comment typo (#1030) (@Rohan5commit)\r\n* 591ded27921265d4e3b5542f5273140c9a8314fc: docs: fix log section typo and example output (#1068) (@truffle-dev)\r\n* dd35798a37369faf19f38fc1ec2fd10ea95a543f: docs: fix typo in spinner comment (#1032) (@Rohan5commit)\r\n### Other stuff\r\n* f3a3f53026429fcde12b20b3ad707afd8b51b6eb: ci: fix build action (@andreynering)\r\n* b0471e842b5438b909d431dc55ddf5bd6c8f0859: ci: fix lint (@andreynering)\r\n* 7423ddf1c810e2df87599ed666977333c162bfc9: ci: sync dependabot config (#1113) (@charmcli)\r\n* 845f6b2ec8f4a8bf14b2d93db4c18d6689f08d58: ci: sync dependabot config (#973) (@charmcli)\r\n* 0ad76ee88ccdadbde9fad4b1e35ae706426ec535: ci: sync golangci-lint config (#995) (@github-actions[bot])\r\n* 7871625c9d2e537a9a1dc85cb0879f351b804ec8: readme: gum is packaged in Fedora for some time (#1007) (@juhp)\r\n* 4d089f95507708a71f64dacfe7ca513219dd5267: v2.0.0 (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/gum/releases/download/v2.0.0/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/gum/releases/download/v2.0.0/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/gum/releases/download/v2.0.0/checksums.txt'\r\nwget 'https://github.com/charmbracelet/gum/releases/download/v2.0.0/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":10,"+1":0,"-1":0,"laugh":0,"hooray":10,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":7}
