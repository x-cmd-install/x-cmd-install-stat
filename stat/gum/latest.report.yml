98","download_count":9,"created_at":"2026-09-11T05:30:33Z","updated_at":"2026-09-11T05:30:33Z"},{"id":556563053,"node_id":"RA_kwDOHe7bmc4hLHpt","name":"gum_2.0.1_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":5192840,"digest":"sha256:e74a822ba2b77ffcc0ebf3d9c9a4b6e59d9c7f1d809e717bc3e3694f0937128f","download_count":5,"created_at":"2026-09-11T05:30:33Z","updated_at":"2026-09-11T05:30:33Z"}],"body":"# No more gibberish\r\n\r\n<img width=\"228\" height=\"42\" alt=\"Screenshot 2026-09-11 at 09 34 44\" src=\"https://github.com/user-attachments/assets/3b23d418-d653-4470-9407-76b5bd735bb8\" />\r\n\r\nThis is a small Friday fix bumping [Bubbletea](https://github.com/charmbracelet/bubbletea) to fix these symbols leaking from keyboard protocol\r\n\r\nHappy Friday and weekend,\r\n\r\nCharm \u2600\ufe0f\r\n\r\n\r\n## Changelog\r\n### Other stuff\r\n* 7179388031ae67d7f538d001be87d931f1cf5e28: v2.0.1 (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/gum/releases/download/v2.0.1/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/gum/releases/download/v2.0.1/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/gum/releases/download/v2.0.1/checksums.txt'\r\nwget 'https://github.com/charmbracelet/gum/releases/download/v2.0.1/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
