09e","download_count":5,"created_at":"2026-09-24T08:33:30Z","updated_at":"2026-09-24T08:33:30Z"},{"id":585508765,"node_id":"RA_kwDOHe7bmc4i5ied","name":"gum_2.0.2_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":5188795,"digest":"sha256:fd46518190e43a9da03d367699633e75ca659d96d38b3d7ccdc40d4b98ee7330","download_count":1,"created_at":"2026-09-24T08:33:30Z","updated_at":"2026-09-24T08:33:30Z"}],"body":"# No more raw ANSI sequences\r\n\r\nPreviously, there was a bug in [Bubbletea v2](https://github.com/charmbracelet/bubbletea) which sent raw ANSI sequences about capabilities, even on no input programs.\r\n\r\nAll the bests,\r\nCharm \u2728\r\n\r\n## Changelog\r\n### Fixed\r\n* 070426c8bbc122b88f4c71dd573bf174ba3f4a6d: fix: bump bt to remove raw ANSI sequences leaking (#1155) (@andrinoff)\r\n### Other stuff\r\n* 879f048103adf0214b85943b52d8d65b08d772c5: v2.0.2 (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/gum/releases/download/v2.0.2/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/gum/releases/download/v2.0.2/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/gum/releases/download/v2.0.2/checksums.txt'\r\nwget 'https://github.com/charmbracelet/gum/releases/download/v2.0.2/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":0,"eyes":0},"mentions_count":1}
