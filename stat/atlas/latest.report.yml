{"id":448948639,"author":{"login":"a8m","id":7413593,"node_id":"MDQ6VXNlcjc0MTM1OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOFaZ9g84awmmf","tag_name":"v1.4.0","target_commitish":"master","name":"v1.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-17T10:31:35Z","updated_at":"2026-11-17T17:08:19Z","published_at":"2026-11-17T17:08:19Z","assets":[],"body":"## We're excited to announce [Atlas v1.4](https://atlasgo.io/blog/2026/11/17/atlas-v1-4) 🎊\r\n\r\nThis release brings security scanning to your databases: the new atlas security scan command reports the CVEs affecting your database servers and extensions, from the CLI, CI, or Kubernetes. It also introduces agent skills, a profiler for the Atlas testing framework that works on production-like data, and drift checks between deployments.\r\n\r\nHere is what you can find in this release:\r\n\r\n- [Security Scanning for Databases](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#security-scanning-for-databases) - Vulnerability detection for your database servers and extensions with atlas security scan, from CI to Kubernetes, and blast-radius checks for roles.\r\n- [Atlas Agent Skills](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#atlas-agent-skills) - Teach Claude Code, Codex, Cursor, and GitHub Copilot to plan, lint, and test schema changes with Atlas.\r\n- [Profiler for the Testing Framework](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#profiler) - Measure the locks, rewrites, and space of migrations, queries, and database code, over a masked Amazon RDS snapshot, CSV files, or synthetic rows. In preview.\r\n- [Drift Detection Between Deployments](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#drift-detection-between-deployments) - atlas migrate drift reports every object that diverged from your migrations, for one database or every tenant.\r\n- [Schema Repositories in Your Own Storage](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#self-hosted-schema-storage) - Store schema repositories in your own S3, GCS, or Azure Blob Storage bucket, or an OCI registry, instead of Atlas Cloud.\r\n- [Database Driver Improvements](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#database-driver-improvements) - Snowflake governance policies, SQL Server linked servers and filegroups, PostgreSQL temporal keys, Databricks metric views, Redshift datashares, and more.\r\n- [Atlas Binaries Are Moving to `atlasbinaries.com`](https://atlasgo.io/blog/2026/11/17/atlas-v1-4#atlas-binaries-are-moving) - Starting December 2026, `release.ariga.io` redirects to `atlasbinaries.com`. Direct downloads only need the new hostname.\r\n\r\nRead the full announcement in our [blogpost](https://atlasgo.io/blog/2026/11/17/atlas-v1-4).\r\n\r\n<img width=\"3456\" height=\"932\" alt=\"image\" src=\"https://github.com/user-attachments/assets/c90d1088-15f8-4b18-b6ab-5158c607e181\" />\r\n\r\n## Quick installation\r\n\r\n**macOS + Linux:**\r\n\r\n```bash\r\ncurl -sSf https://atlasgo.sh | sh\r\n```\r\n\r\n**Homebrew:**\r\n\r\n```bash\r\nbrew install ariga/tap/atlas\r\n```\r\n\r\n**Docker:**\r\n\r\n```bash\r\ndocker pull arigaio/atlas\r\n```\r\n\r\n### Windows\r\n\r\n[Download](https://release.ariga.io/atlas/atlas-windows-amd64-v1.4.0.exe)\r\n\r\n### Legal\r\nThe default binaries in this release are distributed released under our [MSA](https://ariga.io/legal/msa), and the community binaries are released under the Apache 2.0 license.","reactions":{"total_count":28,"+1":7,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":8,"rocket":7,"eyes":0}}
