ent_type":"application/gzip","state":"uploaded","size":5552477,"digest":null,"download_count":826,"created_at":"2021-05-25T13:11:27Z","updated_at":"2021-05-25T13:11:31Z"},{"id":37500152,"node_id":"MDEyOlJlbGVhc2VBc3NldDM3NTAwMTUy","name":"cue_v0.4.0_windows_amd64.zip","label":"","uploader":{"login":"mpvl","id":6445383,"node_id":"MDQ6VXNlcjY0NDUzODM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6185696,"digest":null,"download_count":143,"created_at":"2021-05-25T13:11:31Z","updated_at":"2021-05-25T13:11:31Z"}],"body":"In line with our aim to release smaller changes more frequently on our way to language stability, the `v0.4.0` release comes just under two months after `v0.3.0`. It includes one language addition, a fairly significant reshaping of the API and tooling improvements, as well as the usual host of bug fixes, and performance and error message enhancements. \r\n\r\nThis release includes a more comprehensive implementation of protobuf, supporting textproto and JSON protobuf mappings, and paves the way for binary protobuf support. See the [`v0.4.0-alpha.1` release notes](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.1) for more details.\r\n\r\nThis release also sets the direction for the CUE API, and brings the overall API much closer to where we would like it to go  in the run up to `v1.0.0`. It also prepares the API for the [query extension](https://github.com/cuelang/cue/issues/165). See the [`v0.4.0-alpha.2` release notes](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2) for more details.\r\n\r\nThe `v0.4.0` minor release follows the pre-`v1.0.0` release policy described in the [`v0.3.0` release notes](https://github.com/cuelang/cue/releases/tag/v0.3.0): it contains backwards incompatible changes discussed below.\r\n\r\nAs a reminder: users can register their projects with [`unity`](https://github.com/cue-sh/unity). `unity` is used to ensure that a project's CUE evaluations do not unexpectedly stop working, or regress in terms of performance. We are in the process of adding support for API-based tests, as well as private instances. \r\n\r\n### Language additions\r\n\r\n* Value aliases: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n\r\n### Tooling\r\n\r\n* Tag variables to inject contextual system values: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* Binary file type: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n\r\n### API additions\r\n\r\n* `Context.NewList`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* `Value.FillPath`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* `Context.Encode`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* The  `cue.Path`  model: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n* Phasing out  `Instance`: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n* `Context`  to replace  `Runtime`: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n* `Value.Allows`: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n\r\n\r\n### CUE package additions\r\n\r\n* `crypto/hmac`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* `uuid`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n\r\n\r\n### Performance and error handling\r\n\r\n* Error message tuning: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n* Fix for pathological performance hit when using `Fill` or `Unify`: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n\r\n\r\n\r\n### Backwards incompatible changes\r\n\r\n* Dropped support for old-style aliases: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* Dropped support for old-style comprehensions: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* Removed `ast.TemplateLabel` type from API: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* `Value.Expr`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* `Value.Decode`: [`v0.4.0-beta.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-beta.1)\r\n* `Value.Format` implementation: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n* `cue/encoding`: [`v0.4.0-alpha.2`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.2)\r\n* `@protobuf` tag: [`v0.4.0-alpha.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.1)\r\n* JSON mappings: [`v0.4.0-alpha.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.1)\r\n* Enum mappings: [`v0.4.0-alpha.1`](https://github.com/cuelang/cue/releases/tag/v0.4.0-alpha.1)\r\n\r\n\r\n## Changelog\r\n\r\nb39a2d00 cmd/cue/cmd: avoid roundtrip when printing non-CUE in eval\r\n3b0a537a cmd/cue/cmd: fix bug in resolving builtin package shorthands\r\ncd944260 cue: don't extract embedded values\r\n37bf801b cue: keep sane references for embedded disjunctions in Expr\r\na4e0f525 encoding/openapi: detect cycles when expanding references\r\n\r\n"}
