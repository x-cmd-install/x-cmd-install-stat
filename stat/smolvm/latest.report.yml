e_id":"RA_kwDOQrXKJc4rorfo","name":"smolvm-1.34.1-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":47835713,"digest":"sha256:680c0b8902c7112579de286dd1a79a4db736df5a396924ad934e76a4afa2d00e","download_count":158,"created_at":"2026-11-10T16:17:02Z","updated_at":"2026-11-10T16:17:04Z"},{"id":732084197,"node_id":"RA_kwDOQrXKJc4rorfl","name":"smolvm-1.34.1-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43387710,"digest":"sha256:b31af80517f59f28ef4690d423d78d9f853899ecbd836f4f7263b5eba4cbb420","download_count":67,"created_at":"2026-11-10T16:17:02Z","updated_at":"2026-11-10T16:17:04Z"}],"body":"## What's Changed\n* docs: say that virtiofs DAX is off on arm64 hosts and SMOLVM_MOUNT_DAX does nothing there by @BinSquare in https://github.com/smol-machines/smolvm/pull/2087\n* Add smolvm docker: one command starts a Docker engine in a managed machine and points docker at it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2089\n* Share the home directory with the smolvm docker machine at the same path by @BinSquare in https://github.com/smol-machines/smolvm/pull/2090\n* Resolve host.docker.internal to the host from smolvm docker containers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2091\n* Fix a port race in the leader-exit test by @BinSquare in https://github.com/smol-machines/smolvm/pull/2096\n* Remove smolvm docker by @BinSquare in https://github.com/smol-machines/smolvm/pull/2095\n* Hand supplied credential values to a running embedded machine at once by @BinSquare in https://github.com/smol-machines/smolvm/pull/2097\n* Pin libkrunfw with UDP kept inside a TSI guest, and test it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2099\n* Publish ports below 1024 on macOS, add IPv6 loopback to live-forwarded ports, and lift the 64-mapping cap by @BinSquare in https://github.com/smol-machines/smolvm/pull/2092\n* Return idle guest memory to the host within two minutes and cap new machines at half the host's RAM by @BinSquare in https://github.com/smol-machines/smolvm/pull/2094\n* Install a root-owned agent-rootfs when root runs install.sh by @rdslw in https://github.com/smol-machines/smolvm/pull/2082\n* Announce a changed file to the guest once per change by @BinSquare in https://github.com/smol-machines/smolvm/pull/2102\n* Answer guest DNS from a host cache that coalesces bursts and resends lost queries by @BinSquare in https://github.com/smol-machines/smolvm/pull/2098\n* Keep every disk chain under the branch depth limit: fold restored checkpoint layers and frozen-source chains by @BinSquare in https://github.com/smol-machines/smolvm/pull/2103\n* Exec sessions: commands the node owns, resumable after a dropped connection by @BinSquare in https://github.com/smol-machines/smolvm/pull/2101\n* Let a guest hold tens of thousands of connections on virtio-net and free their host sockets promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2104\n* Scope the usage journal to the test's own thread by @BinSquare in https://github.com/smol-machines/smolvm/pull/2106\n* Pin libkrun 526be460 and libkrunfw f290c62b, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2109\n* Build the agent rootfs as non-root on hosts with user namespaces again by @BinSquare in https://github.com/smol-machines/smolvm/pull/2107\n* Answer a start missing the mediated interceptor with 400, not 500 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2108\n* Run tests that need a released file lock free at once in their own process by @BinSquare in https://github.com/smol-machines/smolvm/pull/2110\n* Pin libkrun 9df62257 and libkrunfw 7f4d4950, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2113\n* Stop resetting virtio-net connections a server closes first by @BinSquare in https://github.com/smol-machines/smolvm/pull/2118\n* Upgrade rusqlite to 0.41 for the patched bundled SQLite (RUSTSEC-2026-0459) by @BinSquare in https://github.com/smol-machines/smolvm/pull/2128\n* Keep a host memory reserve VMs cannot take and charge branch children for growth by @BinSquare in https://github.com/smol-machines/smolvm/pull/2127\n\n## New Contributors\n* @rdslw made their first contribution in https://github.com/smol-machines/smolvm/pull/2082\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.34.0...v1.34.1","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
