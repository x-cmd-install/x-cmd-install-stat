id":"RA_kwDOQrXKJc4miDiv","name":"smolvm-1.29.1-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":47403517,"digest":"sha256:bfbc3c37368b416060bf41b367887cab1d4cf52d6dd88873693bb316d3d649c5","download_count":56,"created_at":"2026-10-16T07:01:35Z","updated_at":"2026-10-16T07:01:37Z"},{"id":646461626,"node_id":"RA_kwDOQrXKJc4miDi6","name":"smolvm-1.29.1-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43519763,"digest":"sha256:ebbfbbdeb11de288895e32c3ed71fc86e1adb02146d08c92a3186cbc67b7e007","download_count":33,"created_at":"2026-10-16T07:01:35Z","updated_at":"2026-10-16T07:01:37Z"}],"body":"## What's Changed\n* Keep host directory mounts in checkpoints on request and always when pausing by @BinSquare in https://github.com/smol-machines/smolvm/pull/1793\n* Sweep partial downloads abandoned for a day that no pull holds, at most hourly from the pull path, so cancelled pulls no longer leave partial blobs on a node forever. by @BinSquare in https://github.com/smol-machines/smolvm/pull/1794\n* Retry image pulls cut off by a dropped connection by @BinSquare in https://github.com/smol-machines/smolvm/pull/1798\n* Let a branch set labels on its child by @BinSquare in https://github.com/smol-machines/smolvm/pull/1799\n* Record machine lifecycle events in a local usage journal by @BinSquare in https://github.com/smol-machines/smolvm/pull/1780\n* Extract a zstd-compressed agent rootfs without a zstd program by @BinSquare in https://github.com/smol-machines/smolvm/pull/1801\n* Unpack image layers with GNU tar so symlinks keep their owners by @BinSquare in https://github.com/smol-machines/smolvm/pull/1805\n* Count a macOS process's CPU time in nanoseconds instead of mach ticks by @AlixANNERAUD in https://github.com/smol-machines/smolvm/pull/1807\n* Stop `machine run -i` spinning forever on macOS when stdin is /dev/null by @RitikaxG in https://github.com/smol-machines/smolvm/pull/1804\n* Record symlink owners on their parent directory in Linux host-extracted layers by @BinSquare in https://github.com/smol-machines/smolvm/pull/1809\n* Pin libkrun at the hinted free page zeroing fix, so a machine's later checkpoints, restores and branches skip memory the guest freed (2.4 GB to 0.26 GB in one test). by @BinSquare in https://github.com/smol-machines/smolvm/pull/1800\n* Pin libkrun at the symlink owner record, so .smolmachine symlinks keep their image owners on Linux hosts by @BinSquare in https://github.com/smol-machines/smolvm/pull/1810\n* Let a checkpoint capture reply once the artifact is held on the node and upload it later through POST /checkpoints/{key}/upload, so a caller no longer waits on a multi-gigabyte upload it does not need. by @BinSquare in https://github.com/smol-machines/smolvm/pull/1795\n* Add serve --guest-rollout-port by @BinSquare in https://github.com/smol-machines/smolvm/pull/1811\n* Mount the image seed behind every attached disk so exporting an image machine works when VMs run under their own uid by @BinSquare in https://github.com/smol-machines/smolvm/pull/1812\n* Mirror the pod netns gateway neighbor and route state into the guest by @quantike in https://github.com/smol-machines/smolvm/pull/1781\n* Keep the local API socket private before publishing it by @BinSquare in https://github.com/smol-machines/smolvm/pull/1709\n* Avoid UID registry warnings when deleting unassigned VMs by @BinSquare in https://github.com/smol-machines/smolvm/pull/1708\n* Resolve guest hostnames in image VMs and restored clones by @BinSquare in https://github.com/smol-machines/smolvm/pull/1705\n* Preserve source VM CPU and memory when creating a pack by @BinSquare in https://github.com/smol-machines/smolvm/pull/1693\n* Let non-root image users write to fresh workspaces by @BinSquare in https://github.com/smol-machines/smolvm/pull/1688\n* Skip unused packed-layer device for VM-mode machines by @BinSquare in https://github.com/smol-machines/smolvm/pull/1678\n* Preserve installed agent rootfs when relocating machine state by @BinSquare in https://github.com/smol-machines/smolvm/pull/1667\n* Test the DNS allow-list helper against a fixed resolver, not the host's by @BinSquare in https://github.com/smol-machines/smolvm/pull/1665\n* Fail a boot for lack of progress, not for being slow by @BinSquare in https://github.com/smol-machines/smolvm/pull/1788\n* Make file operations target the filesystem exec uses and give each image run its own overlay by @BinSquare in https://github.com/smol-machines/smolvm/pull/1564\n* Hash a published cache disk while it uploads instead of before by @BinSquare in https://github.com/smol-machines/smolvm/pull/1814\n* Pin libkrun at the macOS symlink xattr fix, rebuild every bundled libkrun, and test packed symlinks by @BinSquare in https://github.com/smol-machines/smolvm/pull/1817\n* Bump smolvm to 1.29.0 on main by @BinSquare in https://github.com/smol-machines/smolvm/pull/1818\n* Read a chain with sixteen threads when flattening it for a publish by @BinSquare in https://github.com/smol-machines/smolvm/pull/1823\n* Boot packed and cached runs on macOS in a fresh _boot-vm process so a registry pull no longer crashes the VM by @BinSquare in https://github.com/smol-machines/smolvm/pull/1821\n* Show a running machine's CPU and memory usage with machine stats by @AlixANNERAUD in https://github.com/smol-machines/smolvm/pull/1808\n* Accept a local archive, stdin or rootfs directory on pack create --image by @NickyHeC in https://github.com/smol-machines/smolvm/pull/1797\n* Restamp skill packets on v1.29.0 and remove duplicated docs by @NickyHeC in https://github.com/smol-machines/smolvm/pull/1822\n* Prepare SmolVM v1.29.1 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/1824\n\n## New Contributors\n* @RitikaxG made their first contribution in https://github.com/smol-machines/smolvm/pull/1804\n* @quantike made their first contribution in https://github.com/smol-machines/smolvm/pull/1781\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.28.1...v1.29.1","mentions_count":5}
