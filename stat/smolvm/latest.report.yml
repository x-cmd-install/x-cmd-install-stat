 by @BinSquare in https://github.com/smol-machines/smolvm/pull/1981\n* Bump smolvm to 1.32.2 by @BinSquare in https://github.com/smol-machines/smolvm/pull/1982\n\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.32.0...v1.32.2","mentions_count":1}
