e_id":"RA_kwDOQrXKJc4vVR3q","name":"smolvm-1.37.7-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":57631458,"digest":"sha256:be1fc77abb10e8af9b54b72baf643aa26f2029d55581cd69e6f625c9562b6248","download_count":164,"created_at":"2026-11-26T03:07:00Z","updated_at":"2026-11-26T03:07:03Z"},{"id":794107378,"node_id":"RA_kwDOQrXKJc4vVR3y","name":"smolvm-1.37.7-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":46623258,"digest":"sha256:fb696d43e92e60be7199a84b8afab669ab89c53be5908fd34f74f079b4b4a897","download_count":56,"created_at":"2026-11-26T03:07:00Z","updated_at":"2026-11-26T03:07:02Z"}],"body":"## What's Changed\n* Keep a pack's layers directory reachable by the VM when the pack was built under a strict umask by @BinSquare in https://github.com/smol-machines/smolvm/pull/2433\n* Fix three macOS test flakes: open-file exhaustion, a missed socketpair wakeup, and a cargo-only env var by @BinSquare in https://github.com/smol-machines/smolvm/pull/2429\n* Let a non-root workload own a folder mounted into a running machine from another filesystem by @BinSquare in https://github.com/smol-machines/smolvm/pull/2435\n* Refresh the guest firmware to renew overdue CPU quotas by @BinSquare in https://github.com/smol-machines/smolvm/pull/2436\n* Check every path a machine's dropped uid needs before boot, and fix three pre-existing permission bugs it exposed by @BinSquare in https://github.com/smol-machines/smolvm/pull/2438\n* Allow live CPU grow and shrink on Linux arm64 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2437\n* Fix guest Vulkan on Intel GPUs that do not share the CPU cache by @BinSquare in https://github.com/smol-machines/smolvm/pull/2426\n* Prepare SmolVM v1.37.2 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2439\n* Refresh forwarded ports on Docker container events by @BinSquare in https://github.com/smol-machines/smolvm/pull/2444\n* Pin libkrun to 36b08461 for live vCPU resize on Linux arm64 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2440\n* Stop a guest thread that outlives its Vulkan instance from crashing on exit by @BinSquare in https://github.com/smol-machines/smolvm/pull/2443\n* Keep seed eviction's backing scan from blocking machine creates by @BinSquare in https://github.com/smol-machines/smolvm/pull/2445\n* Forward only list and sign to the host SSH agent so a machine cannot add, remove, or lock its keys by @BinSquare in https://github.com/smol-machines/smolvm/pull/2441\n* Guard forced machine stops with a host PID by @BinSquare in https://github.com/smol-machines/smolvm/pull/2447\n* Keep older-layout pack layers readable under the per-VM uid drop, and repair existing caches by @BinSquare in https://github.com/smol-machines/smolvm/pull/2448\n* Report a machine whose image workload failed to launch instead of a plain running start by @BinSquare in https://github.com/smol-machines/smolvm/pull/2449\n* chore(nix): bump flake to 1.37.4 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/2450\n* chore(nix): bump flake to 1.37.5 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/2451\n* Keep a Mac machine running when a nested guest touches performance counters by @BinSquare in https://github.com/smol-machines/smolvm/pull/2452\n* Give a disk copied from a template its own writable mode instead of the template's by @BinSquare in https://github.com/smol-machines/smolvm/pull/2453\n* Pin libkrun to 7641156e so branching a busy source stays fast by @BinSquare in https://github.com/smol-machines/smolvm/pull/2454\n* Repair a path the machine's uid cannot read in the permission class the kernel checks for it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2459\n\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.37.1...v1.37.7","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
