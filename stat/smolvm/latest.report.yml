e_id":"RA_kwDOQrXKJc4oyIZy","name":"smolvm-1.32.4-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":47801772,"digest":"sha256:7b0580c2ef98e183ac5c3a1567eca3a336d58aa0e2ca5904350f7d3a851205e8","download_count":268,"created_at":"2026-10-28T07:42:16Z","updated_at":"2026-10-28T07:42:20Z"},{"id":684230260,"node_id":"RA_kwDOQrXKJc4oyIZ0","name":"smolvm-1.32.4-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43634787,"digest":"sha256:97c702731ff2758b5e9f31b95acbd6aa83d534fc1cb781dd8165cd6395584ed4","download_count":59,"created_at":"2026-10-28T07:42:16Z","updated_at":"2026-10-28T07:42:20Z"}],"body":"## What's Changed\n* chore(nix): bump flake to 1.32.2 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/1983\n* Require that no commit, commit author or PR text credits an AI tool by @BinSquare in https://github.com/smol-machines/smolvm/pull/1991\n* Expose the VM's DMA-BUF heaps to containers so Android can allocate graphics buffers by @BinSquare in https://github.com/smol-machines/smolvm/pull/1992\n* Bump libkrunfw with the Android kernel options and the TSI socket fixes by @BinSquare in https://github.com/smol-machines/smolvm/pull/1993\n* Seed private registry images whose credentials arrive with the start by @BinSquare in https://github.com/smol-machines/smolvm/pull/1984\n* Give a checkpoint started during another one its share of workers by @BinSquare in https://github.com/smol-machines/smolvm/pull/1990\n* Bump zstd to 0.14.3 to clear four security advisories by @BinSquare in https://github.com/smol-machines/smolvm/pull/1997\n* Run the macOS CI job on our own Mac mini and keep its target/ between runs by @BinSquare in https://github.com/smol-machines/smolvm/pull/1999\n* Fix Docker socket forwarding into workload namespaces by @horjulf in https://github.com/smol-machines/smolvm/pull/1998\n* Remove an ephemeral `machine run`'s data directory when the run fails before its VM starts by @RitikaxG in https://github.com/smol-machines/smolvm/pull/1996\n* Let a frozen branch source stop once every branch of it is stopped by @BinSquare in https://github.com/smol-machines/smolvm/pull/2003\n* Run the Linux x86_64 CI job on our own MS-A2, keeping target/ between runs by @BinSquare in https://github.com/smol-machines/smolvm/pull/2005\n* Make the usage journal and engine-binary tests independent of tests running beside them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2007\n\n## New Contributors\n* @horjulf made their first contribution in https://github.com/smol-machines/smolvm/pull/1998\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.32.2...v1.32.4","mentions_count":3}
