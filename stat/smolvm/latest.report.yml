:"RA_kwDOQrXKJc4j68_y","name":"smolvm-1.22.1-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":45350842,"digest":"sha256:548317b45fefa517127dd93771e6007ca77cf62710061b87bd370e6807a14e72","download_count":6,"created_at":"2026-10-01T07:02:28Z","updated_at":"2026-10-01T07:02:30Z"},{"id":602656755,"node_id":"RA_kwDOQrXKJc4j68_z","name":"smolvm-1.22.1-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41612962,"digest":"sha256:e06deb20c381a48d8161039eb833616425624977e9ea135ac91bdaa56b744973","download_count":2,"created_at":"2026-10-01T07:02:28Z","updated_at":"2026-10-01T07:02:30Z"}],"body":"## What's Changed\n* Bump libkrunfw to the guest kernel with conntrack marks so nft ct mark rules load by @BinSquare in https://github.com/smol-machines/smolvm/pull/1493\n* Stop the workload wait ticker without waiting out its sleep by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1495\n* Pin libkrunfw to the merged conntrack-mark commit on main by @BinSquare in https://github.com/smol-machines/smolvm/pull/1494\n* Restrict serve mTLS clients by certificate subject CN by @BinSquare in https://github.com/smol-machines/smolvm/pull/1499\n* Speed up restored starts with --keep-identity and RAM prefetch by @BinSquare in https://github.com/smol-machines/smolvm/pull/1497\n* Preserve HTTP machine records when storage cleanup fails by @hfiguera in https://github.com/smol-machines/smolvm/pull/1498\n* Give machine update the --outbound-localhost-only flag create has by @BABTUNA in https://github.com/smol-machines/smolvm/pull/1500\n* Prefetch restored RAM and allow keep-identity restores in the embedded runtime by @BinSquare in https://github.com/smol-machines/smolvm/pull/1502\n* Bump the workspace to 1.22.1 by @BinSquare in https://github.com/smol-machines/smolvm/pull/1496\n\n## New Contributors\n* @hfiguera made their first contribution in https://github.com/smol-machines/smolvm/pull/1498\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.22.0...v1.22.1","mentions_count":4}
