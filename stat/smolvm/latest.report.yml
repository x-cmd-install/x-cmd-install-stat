":"RA_kwDOQrXKJc4noIKH","name":"smolvm-1.31.2-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":47478958,"digest":"sha256:c4e5a7a20f5f3a0dd840965fa35444b56548641101f7b48184a07a1e3765edd2","download_count":10,"created_at":"2026-10-22T05:53:45Z","updated_at":"2026-10-22T05:53:48Z"},{"id":664830600,"node_id":"RA_kwDOQrXKJc4noIKI","name":"smolvm-1.31.2-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43411561,"digest":"sha256:f7f3659af9afbd018e28eeebe2c3143e044951fc2abe3b6a7e1125b9c2602f00","download_count":1,"created_at":"2026-10-22T05:53:45Z","updated_at":"2026-10-22T05:53:47Z"}],"body":"## What's Changed\n* chore(nix): bump flake to 1.31.0 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/1917\n* Never lower a branch source's memory ceiling below what its cgroup still holds by @BinSquare in https://github.com/smol-machines/smolvm/pull/1921\n* chore(nix): bump flake to 1.31.1 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/1923\n* Fix flaky branchpoint lease test by @BinSquare in https://github.com/smol-machines/smolvm/pull/1918\n* Let machine monitor flags override the Smolfile health settings by @RaphaelFakhri in https://github.com/smol-machines/smolvm/pull/1920\n* Give a new disk volume the image's ownership and bind nested volumes after their parents by @BinSquare in https://github.com/smol-machines/smolvm/pull/1870\n* ci: run every Linux job on smol machines by @BinSquare in https://github.com/smol-machines/smolvm/pull/1916\n* Change ports live on machines without virtio-net through a vsock port forwarder by @BinSquare in https://github.com/smol-machines/smolvm/pull/1875\n* Add Chinese, Japanese and Korean READMEs by @BinSquare in https://github.com/smol-machines/smolvm/pull/1871\n* Pass the guest path to ns-file and stage on scratch for streamed container uploads by @Vishv07 in https://github.com/smol-machines/smolvm/pull/1925\n* Isolate filesystem unit tests from the CI runner overlay by @BinSquare in https://github.com/smol-machines/smolvm/pull/1927\n* agent: unit tests never resolve paths through the machine they run on by @BinSquare in https://github.com/smol-machines/smolvm/pull/1926\n* Checkpoint a source frozen as a branch base without resuming it, so its branches can move to another node by @BinSquare in https://github.com/smol-machines/smolvm/pull/1928\n* Keep cache disk bases within a byte budget, evicting the least recently used by @BinSquare in https://github.com/smol-machines/smolvm/pull/1930\n* Bump smolvm to 1.31.2 by @BinSquare in https://github.com/smol-machines/smolvm/pull/1929\n* Put /tmp on disk, regrow /dev/shm after a RAM grow, match GitHub runner limits and LANG by @BinSquare in https://github.com/smol-machines/smolvm/pull/1931\n* Record why a machine's VMM ended, OOM kill and seccomp included by @BinSquare in https://github.com/smol-machines/smolvm/pull/1884\n* Fix inherited disk-chain compaction by @BinSquare in https://github.com/smol-machines/smolvm/pull/1933\n* Move a live-published host port to another guest port without rebinding it, and close removed ports before the change returns by @BinSquare in https://github.com/smol-machines/smolvm/pull/1935\n* Unpack a .smolmachine once per pack on macOS and clone it for each machine, and let no create leave its data behind when it fails or its client disconnects by @BinSquare in https://github.com/smol-machines/smolvm/pull/1934\n* Keep a machine's disk durability across checkpoint restore and let machine update change it by @BinSquare in https://github.com/smol-machines/smolvm/pull/1932\n* Answer a branch at the disk chain limit with 409 instead of 500 by @BinSquare in https://github.com/smol-machines/smolvm/pull/1936\n\n## New Contributors\n* @github-actions[bot] made their first contribution in https://github.com/smol-machines/smolvm/pull/1917\n* @RaphaelFakhri made their first contribution in https://github.com/smol-machines/smolvm/pull/1920\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.31.0...v1.31.2","mentions_count":3}
