id":"RA_kwDOQrXKJc4iL_lE","name":"smolvm-1.16.2-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":41893961,"digest":"sha256:1cd32644920b835b62fbbe542e79e085482562bff01d81700499b902f3755b4e","download_count":69,"created_at":"2026-09-18T22:18:43Z","updated_at":"2026-09-18T22:18:44Z"},{"id":573569350,"node_id":"RA_kwDOQrXKJc4iL_lG","name":"smolvm-1.16.2-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":40465166,"digest":"sha256:084a8ae960dd9278159ed5b8dff795b165ab72ff34cb3fa7b21e83b7f134dde5","download_count":61,"created_at":"2026-09-18T22:18:43Z","updated_at":"2026-09-18T22:18:44Z"}],"body":"## What's Changed\n* Allow releases after the version bump has merged by @BinSquare in https://github.com/smol-machines/smolvm/pull/1281\n* Resolve registry credentials from the host Docker config, credential helpers included by @BinSquare in https://github.com/smol-machines/smolvm/pull/1279\n* Avoid recopying retained checkpoint disks on every restore by @BinSquare in https://github.com/smol-machines/smolvm/pull/1283\n* Persist checkpoint filenames before reporting success by @BinSquare in https://github.com/smol-machines/smolvm/pull/1282\n* Reuse protected checkpoint RAM when restoring branchable machines by @BinSquare in https://github.com/smol-machines/smolvm/pull/1285\n* Use a plain fsync per checkpoint object on macOS instead of a whole-device flush by @BinSquare in https://github.com/smol-machines/smolvm/pull/1286\n* Trust present checkpoint objects on reuse and leave content verification to restore by @BinSquare in https://github.com/smol-machines/smolvm/pull/1287\n* Speed up incremental checkpoint saves by @BinSquare in https://github.com/smol-machines/smolvm/pull/1288\n* Speed up saves that reuse checkpoint data by @BinSquare in https://github.com/smol-machines/smolvm/pull/1289\n* Speed up checkpoint verification during restore by @BinSquare in https://github.com/smol-machines/smolvm/pull/1290\n* Speed up incremental checkpoint capture by @BinSquare in https://github.com/smol-machines/smolvm/pull/1291\n* Store checkpoint chunks through a pool of worker threads by @BinSquare in https://github.com/smol-machines/smolvm/pull/1293\n* Restore checkpoint chunks across worker threads by @BinSquare in https://github.com/smol-machines/smolvm/pull/1294\n* Restore checkpoints as a diff against the last restored one by @BinSquare in https://github.com/smol-machines/smolvm/pull/1295\n* Stop the GPU docs pinning a guest Vulkan ICD by architecture by @BinSquare in https://github.com/smol-machines/smolvm/pull/1298\n* Keep concurrent checkpoint restores on a consistent base by @BinSquare in https://github.com/smol-machines/smolvm/pull/1300\n* Bound checkpoint workers across simultaneous saves and restores by @BinSquare in https://github.com/smol-machines/smolvm/pull/1301\n* Verify cached checkpoint data before reusing it during restore by @BinSquare in https://github.com/smol-machines/smolvm/pull/1302\n* Clean up exited branches without waiting for the server by @BinSquare in https://github.com/smol-machines/smolvm/pull/1308\n* Extract image layers on the host and describe their ownership to the guest by @BinSquare in https://github.com/smol-machines/smolvm/pull/1306\n* Record registry-cache recency on a marker file so a cache hit no longer fails a concurrent verification by @BinSquare in https://github.com/smol-machines/smolvm/pull/1310\n* Verify a restored clone's holes from one extent walk instead of a seek per chunk by @BinSquare in https://github.com/smol-machines/smolvm/pull/1317\n* docs: add practical READMEs for published Rust crates by @BinSquare in https://github.com/smol-machines/smolvm/pull/1320\n* Trust a restore base this process wrote until its files change by @BinSquare in https://github.com/smol-machines/smolvm/pull/1318\n* Update libkrun so Linux virtiofs shares can serve recorded ownership by @BinSquare in https://github.com/smol-machines/smolvm/pull/1313\n* Cover the blob cache's upgrade path so a marker-less blob keeps its atime recency by @BinSquare in https://github.com/smol-machines/smolvm/pull/1311\n* Let the export helper's disk be resized and name it when it fills by @BinSquare in https://github.com/smol-machines/smolvm/pull/1312\n* Stream the merged layer tar to the host instead of staging it in the guest by @Bnjoroge1 in https://github.com/smol-machines/smolvm/pull/1321\n* Fix interactive stdin buffer bug on unix by @louix in https://github.com/smol-machines/smolvm/pull/1314\n* Prepare SmolVM v1.16.2 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/1325\n* Stop a frozen fork base instead of waiting for an acknowledgement its paused guest cannot send by @BinSquare in https://github.com/smol-machines/smolvm/pull/1324\n\n## New Contributors\n* @louix made their first contribution in https://github.com/smol-machines/smolvm/pull/1314\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.16.1...v1.16.2","mentions_count":3}
