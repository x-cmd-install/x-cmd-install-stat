iner filesystem lifetime by @BinSquare in https://github.com/smol-machines/smolvm/pull/2213\n* Follow a machine's shared pack pointer only to a shared extraction by @BinSquare in https://github.com/smol-machines/smolvm/pull/2341\n* Check a carried agent rootfs's digest before it reaches the store by @BinSquare in https://github.com/smol-machines/smolvm/pull/2342\n* Adopt only indexed checkpoint objects that hash to their names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2344\n* Publish a pause's kept-resume record whole, so a resume never reads it half-written by @BinSquare in https://github.com/smol-machines/smolvm/pull/2345\n* Refuse a launch whose mount source now resolves to a protected path by @BinSquare in https://github.com/smol-machines/smolvm/pull/2346\n* Hand out a per-VM uid only once no process still runs as it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2347\n* Keep per-machine ready markers out of the rootfs every guest shares by @BinSquare in https://github.com/smol-machines/smolvm/pull/2350\n* Revoke the share the host attached for a detached path, not the one the guest names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2343\n* Walk a machine directory by descriptor when handing it to the VM's uid by @BinSquare in https://github.com/smol-machines/smolvm/pull/2348\n* Record the disk backings root attaches and report chains that name any other by @BinSquare in https://github.com/smol-machines/smolvm/pull/2351\n* Add and remove credential bindings on a running machine, with a name-constrained CA of its own for each new host by @BinSquare in https://github.com/smol-machines/smolvm/pull/2265\n* Reach the host's local services by default on your own computer by @BinSquare in https://github.com/smol-machines/smolvm/pull/2352\n* Prepare SmolVM v1.36.0 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2353\n* Let embedders change a machine's credential bindings, and fix live trust fo