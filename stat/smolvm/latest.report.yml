:"RA_kwDOQrXKJc4sRmJE","name":"smolvm-1.34.3-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":47955106,"digest":"sha256:a0c321915c38155571131526b0f3e32ee787538e904a4537855826802fb82064","download_count":8,"created_at":"2026-11-13T08:01:25Z","updated_at":"2026-11-13T08:01:28Z"},{"id":742810185,"node_id":"RA_kwDOQrXKJc4sRmJJ","name":"smolvm-1.34.3-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43484454,"digest":"sha256:81ab163a08ed841b3a9a0953163a499699323839d02d7f359270ff46d6b33d3c","download_count":5,"created_at":"2026-11-13T08:01:25Z","updated_at":"2026-11-13T08:01:26Z"}],"body":"## What's Changed\n* docs: say that virtiofs DAX is off on arm64 hosts and SMOLVM_MOUNT_DAX does nothing there by @BinSquare in https://github.com/smol-machines/smolvm/pull/2087\n* Add smolvm docker: one command starts a Docker engine in a managed machine and points docker at it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2089\n* Share the home directory with the smolvm docker machine at the same path by @BinSquare in https://github.com/smol-machines/smolvm/pull/2090\n* Resolve host.docker.internal to the host from smolvm docker containers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2091\n* Fix a port race in the leader-exit test by @BinSquare in https://github.com/smol-machines/smolvm/pull/2096\n* Remove smolvm docker by @BinSquare in https://github.com/smol-machines/smolvm/pull/2095\n* Hand supplied credential values to a running embedded machine at once by @BinSquare in https://github.com/smol-machines/smolvm/pull/2097\n* Pin libkrunfw with UDP kept inside a TSI guest, and test it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2099\n* Publish ports below 1024 on macOS, add IPv6 loopback to live-forwarded ports, and lift the 64-mapping cap by @BinSquare in https://github.com/smol-machines/smolvm/pull/2092\n* Return idle guest memory to the host within two minutes and cap new machines at half the host's RAM by @BinSquare in https://github.com/smol-machines/smolvm/pull/2094\n* Install a root-owned agent-rootfs when root runs install.sh by @rdslw in https://github.com/smol-machines/smolvm/pull/2082\n* Announce a changed file to the guest once per change by @BinSquare in https://github.com/smol-machines/smolvm/pull/2102\n* Answer guest DNS from a host cache that coalesces bursts and resends lost queries by @BinSquare in https://github.com/smol-machines/smolvm/pull/2098\n* Keep every disk chain under the branch depth limit: fold restored checkpoint layers and frozen-source chains by @BinSquare in https://github.com/smol-machines/smolvm/pull/2103\n* Exec sessions: commands the node owns, resumable after a dropped connection by @BinSquare in https://github.com/smol-machines/smolvm/pull/2101\n* Let a guest hold tens of thousands of connections on virtio-net and free their host sockets promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2104\n* Scope the usage journal to the test's own thread by @BinSquare in https://github.com/smol-machines/smolvm/pull/2106\n* Pin libkrun 526be460 and libkrunfw f290c62b, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2109\n* Build the agent rootfs as non-root on hosts with user namespaces again by @BinSquare in https://github.com/smol-machines/smolvm/pull/2107\n* Answer a start missing the mediated interceptor with 400, not 500 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2108\n* Run tests that need a released file lock free at once in their own process by @BinSquare in https://github.com/smol-machines/smolvm/pull/2110\n* Pin libkrun 9df62257 and libkrunfw 7f4d4950, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2113\n* Stop resetting virtio-net connections a server closes first by @BinSquare in https://github.com/smol-machines/smolvm/pull/2118\n* Upgrade rusqlite to 0.41 for the patched bundled SQLite (RUSTSEC-2026-0459) by @BinSquare in https://github.com/smol-machines/smolvm/pull/2128\n* Keep a host memory reserve VMs cannot take and charge branch children for growth by @BinSquare in https://github.com/smol-machines/smolvm/pull/2127\n* Ask before stopping a machine on delete, so a refused or declined delete leaves it running by @connorburgess in https://github.com/smol-machines/smolvm/pull/2131\n* Prepare SmolVM v1.34.1 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2135\n* Bring a soft open-file limit above kern.maxfilesperproc down to the cap on macOS, so the limit raise_nofile_limit reports is the one in force by @connorburgess in https://github.com/smol-machines/smolvm/pull/2132\n* Leave no data directory behind when exec, status or stop name a machine that does not exist by @connorburgess in https://github.com/smol-machines/smolvm/pull/2129\n* Warn when --block-private keeps a named host unreachable by @BinSquare in https://github.com/smol-machines/smolvm/pull/2146\n* Register Rosetta itself as the x86_64 interpreter when the host answers its start-up ioctl by @BinSquare in https://github.com/smol-machines/smolvm/pull/2148\n* Make a mounted host directory belong to the workload user so a non-root workload can write to it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2149\n* Record the image platform on the machine so a Rosetta machine can be created from an amd64 image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2147\n* Bump libkrun so a Rosetta machine runs amd64 programs directly and a macOS machine stops promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2150\n* Keep a cache disk's chain on its shared base when compaction shortens it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2145\n* Satisfy Rust 1.100's needless_bool lint in connect_in_progress on Windows by @BinSquare in https://github.com/smol-machines/smolvm/pull/2154\n* Bound branch admission and reported capacity by the VM slice's memory limit, not just host free memory by @BinSquare in https://github.com/smol-machines/smolvm/pull/2152\n* Stop throttling the VM slice and reclaim it from the pressure guard instead by @BinSquare in https://github.com/smol-machines/smolvm/pull/2153\n* Release a paused branch child's VM lock so the memory pressure guard can resume it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2157\n\n## New Contributors\n* @rdslw made their first contribution in https://github.com/smol-machines/smolvm/pull/2082\n* @connorburgess made their first contribution in https://github.com/smol-machines/smolvm/pull/2131\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.34.0...v1.34.3","mentions_count":3}
