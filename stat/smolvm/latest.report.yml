 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2378\n* Keep credential bindings set by API callers and embedders from ever reading this host's values, drop a held value when its binding changes, and refuse a binding change that would turn networking back on. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2385\n* Keep root from following links, FIFOs or foreign files in a machine's directory when it changes credential bindings, and refuse a live control socket that is not the machine's own. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2384\n* Fail the install when checksums.sha256 is missing or has no single match by @rdslw in https://github.com/smol-machines/smolvm/pull/2088\n* Carry added credential CAs through checkpoints, hand a running, resumed or branched guest every CA the interceptor may sign with before it does, prune guest trust only at boot, defer only what an older guest cannot trust, mint CAs without index collisions, and keep pod machines booting without an interceptor while refusing new bindings there. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2386\n* Allow the legacy stat and lstat syscalls the mount watcher's SQLite reaches on x86_64 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2389\n* Update url to 2.5.9 for RUSTSEC-2026-0592 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2393\n* Serve restored disks lazily from the checkpoint store by @BinSquare in https://github.com/smol-machines/smolvm/pull/2392\n* Run --gpu machines Vulkan-only so the VM process never runs the host OpenGL driver by @BinSquare in https://github.com/smol-machines/smolvm/pull/2397\n* Restore lazily while the checkpoint is still being imported by @BinSquare in https://github.com/smol-machines/smolvm/pull/2399\n* Report a missing machine as NOT_FOUND from every machine command by @josmo in https://github.com/smol-machines/smolvm/pull/2367\n* Give Linux --gpu machines GPU OpenGL again by @BinSquare in https://github.com/smol-machines/smolvm/pull/2400\n* Rebuild a restored machine's RAM lazily from the checkpoint store by @BinSquare in https://github.com/smol-machines/smolvm/pull/2403\n* Map GPU memory write-combined in x86_64 guests by @BinSquare in https://github.com/smol-machines/smolvm/pull/2404\n* Record a restore tree's identity from the digest taken as its artifact arrived by @BinSquare in https://github.com/smol-machines/smolvm/pull/2406\n* Keep a coding agent's API key outside its machine by default and show where each credential's placeholder lands by @BinSquare in https://github.com/smol-machines/smolvm/pull/2407\n* Keep a lazy restore tree from being withdrawn by a RAM write-back it never needed by @BinSquare in https://github.com/smol-machines/smolvm/pull/2408\n* Make lazily rebuilt RAM its own opt-in, off by default by @BinSquare in https://github.com/smol-machines/smolvm/pull/2410\n* Build the guest Vulkan driver from Mesa 25.2.8 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2411\n* Pass a host serial device into a machine with --serial by @BinSquare in https://github.com/smol-machines/smolvm/pull/2409\n* Finish checkpoint imports that a lazy restore streams, even across a restart by @BinSquare in https://github.com/smol-machines/smolvm/pull/2412\n* Restore chunked checkpoints through the API on macOS by @BinSquare in https://github.com/smol-machines/smolvm/pull/2414\n* Keep synced writes on lazy disks as fast as on copied disks by @BinSquare in https://github.com/smol-machines/smolvm/pull/2415\n* Bump libkrun so a guest waiting on a GPU fence is not held to a millisecond tick by @BinSquare in https://github.com/smol-machines/smolvm/pull/2417\n* Keep a streamed import's source without touching it while it is verified by @BinSquare in https://github.com/smol-machines/smolvm/pull/2416\n* Use machine stop --force for emergency shutdown by @BinSquare in https://github.com/smol-machines/smolvm/pull/2405\n* Read the largest