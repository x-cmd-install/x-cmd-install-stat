d":"RA_kwDOQrXKJc4jHuHF","name":"smolvm-1.19.0-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":44396948,"digest":"sha256:4feb274fd24d4722d718b9c85881fb9bba3c0c9f8123f67584436065bf583311","download_count":26,"created_at":"2026-09-25T20:55:03Z","updated_at":"2026-09-25T20:55:06Z"},{"id":589226439,"node_id":"RA_kwDOQrXKJc4jHuHH","name":"smolvm-1.19.0-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41174396,"digest":"sha256:187ffadc3f6f721f1f243ca14e483afe586f5f78ba78699358c0bfe306c7713f","download_count":13,"created_at":"2026-09-25T20:55:03Z","updated_at":"2026-09-25T20:55:05Z"}],"body":"## What's Changed\n* Honor --credential when creating a machine from a pack by @BinSquare in https://github.com/smol-machines/smolvm/pull/1400\n* Pin the Nix flake to 1.18.2 with its real release hashes by @BinSquare in https://github.com/smol-machines/smolvm/pull/1398\n* Launch a credentialed machine with its credentials on every start and resume by @BinSquare in https://github.com/smol-machines/smolvm/pull/1402\n* Report a forked machine's own creation time by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1407\n* External egress interceptor by @ankrgyl in https://github.com/smol-machines/smolvm/pull/1405\n* Let a lease request wait for a clean pool worker by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1408\n* Keep the pool controller from retiring a worker a lease just claimed by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1406\n* Keep external interception fail closed across VM restarts by @BinSquare in https://github.com/smol-machines/smolvm/pull/1409\n* Let a virtio-net machine start after machine update --no-net by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1410\n* Upload captured checkpoints straight to object storage by @BinSquare in https://github.com/smol-machines/smolvm/pull/1403\n* Fail a Windows virtio-net launch when a published host port is in use by @nitzzzu in https://github.com/smol-machines/smolvm/pull/1416\n* Share one database handle per process by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1417\n* Retry a read-then-write DB transaction that loses the write race by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1413\n* Don't retire a paused leased fork pool worker by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1414\n* Refuse to implicitly start a paused machine by @LoganGrasby in https://github.com/smol-machines/smolvm/pull/1415\n* Retry an agent connect the guest hangs up during the handshake by @BinSquare in https://github.com/smol-machines/smolvm/pull/1412\n* Keep the guest agent answering pings while every work slot is busy by @BinSquare in https://github.com/smol-machines/smolvm/pull/1411\n* Take API credential values from the API, never from the host environment by @BinSquare in https://github.com/smol-machines/smolvm/pull/1401\n* Bump libkrun for the restored-inode, vsock restore, kqueue and fork generation fixes by @BinSquare in https://github.com/smol-machines/smolvm/pull/1399\n* Read the machine name from SMOLVM_MACHINE_NAME when --name is omitted by @BABTUNA in https://github.com/smol-machines/smolvm/pull/1392\n* Bump the workspace to 1.19.0 by @BinSquare in https://github.com/smol-machines/smolvm/pull/1418\n\n## New Contributors\n* @ankrgyl made their first contribution in https://github.com/smol-machines/smolvm/pull/1405\n* @nitzzzu made their first contribution in https://github.com/smol-machines/smolvm/pull/1416\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.18.2...v1.19.0","mentions_count":5}
