id":"RA_kwDOQrXKJc4mQ4i8","name":"smolvm-1.28.1-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":46991474,"digest":"sha256:ea2ce8ee7c9c1fcad1f594b74644ea7b6e04f9be70e07eba92b18c8cb27ca548","download_count":27,"created_at":"2026-10-14T23:06:15Z","updated_at":"2026-10-14T23:06:19Z"},{"id":641960123,"node_id":"RA_kwDOQrXKJc4mQ4i7","name":"smolvm-1.28.1-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43188523,"digest":"sha256:a32202a4c55b7765b4eb817976af50c6ab621bf70b3e7be97812ac83018b13b1","download_count":17,"created_at":"2026-10-14T23:06:15Z","updated_at":"2026-10-14T23:06:19Z"}],"body":"## What's Changed\n* Count UDP ports when planning a machine's network backend by @BinSquare in https://github.com/smol-machines/smolvm/pull/1783\n* Adopt a complete partial blob left by a cancelled pull, and restart a download the registry refuses to resume, instead of failing every later pull with 416. by @BinSquare in https://github.com/smol-machines/smolvm/pull/1782\n* Let a running machine grow its RAM by more than 1 GiB, and stop a failed RAM resize from blocking the machine's checkpoints, pauses and branches. by @BinSquare in https://github.com/smol-machines/smolvm/pull/1786\n* Take start options from the JSON body as well as the query string by @BinSquare in https://github.com/smol-machines/smolvm/pull/1789\n* Add disk volumes, --block-private egress, and a coding-agent guide by @BinSquare in https://github.com/smol-machines/smolvm/pull/1787\n* Fix Windows pack extraction for read-only entries by @NickyHeC in https://github.com/smol-machines/smolvm/pull/1784\n* Keep a .smolmachine's file owners on Linux: host-extracted layers stay owned by root, older caches are repaired once, and the export helper sees the real owners instead of the VMM's uid and 65534. by @BinSquare in https://github.com/smol-machines/smolvm/pull/1790\n* Change a machine's published ports through the API by @BinSquare in https://github.com/smol-machines/smolvm/pull/1791\n* Bump version to 1.28.1. by @BinSquare in https://github.com/smol-machines/smolvm/pull/1785\n* Bump libkrun so Windows machines stop committing about 1 GiB per VM for unused DAX windows by @BinSquare in https://github.com/smol-machines/smolvm/pull/1792\n\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.28.0...v1.28.1","mentions_count":2}
