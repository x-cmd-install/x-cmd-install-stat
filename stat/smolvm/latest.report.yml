id":"RA_kwDOQrXKJc4rIy2D","name":"smolvm-1.34.0-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":47421028,"digest":"sha256:89e098b1f7749c515ed95263f081c469befb0aa10b49ee589ccb3e901090608a","download_count":134,"created_at":"2026-11-08T11:25:49Z","updated_at":"2026-11-08T11:25:52Z"},{"id":723725697,"node_id":"RA_kwDOQrXKJc4rIy2B","name":"smolvm-1.34.0-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43099266,"digest":"sha256:8fd7c3a6b2b83ec4e6d19dccff42e763b9ca17f2c0dcec04b37774e7c11bcc59","download_count":38,"created_at":"2026-11-08T11:25:49Z","updated_at":"2026-11-08T11:25:52Z"}],"body":"## What's Changed\n* Add keepMachineId to the branch request by @BinSquare in https://github.com/smol-machines/smolvm/pull/2039\n* Add the Dockerfile and threat model that enrol smolvm in Anthropic's OSS Scanner by @BinSquare in https://github.com/smol-machines/smolvm/pull/2038\n* Pin libkrun to ea8c0144 so a frozen branch copies its written RAM across threads instead of on one. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2040\n* Upgrade past the audited crates instead of ignoring them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2049\n* Ignore the superblock write time a no-op resize2fs refreshes in the format guard test. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2048\n* Report truncated output from exec on image machines by @cherylaurelia in https://github.com/smol-machines/smolvm/pull/2050\n* Prepare SmolVM v1.34.0 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2052\n* Answer a timed-out exec on time when a child that left its process group still holds the output by @RitikaxG in https://github.com/smol-machines/smolvm/pull/2047\n* Sample the guest's pressure stall information through the agent and report it on machine stats and the machine list by @BinSquare in https://github.com/smol-machines/smolvm/pull/2051\n* Compare the engine build, not the executable's inode, before branching a running machine by @BinSquare in https://github.com/smol-machines/smolvm/pull/2055\n* Let machine cp upload a host directory recursively like cp -r by @BinSquare in https://github.com/smol-machines/smolvm/pull/2056\n* Stream exec output past 11 MiB from the CLI, and stop on a closed reader by @BinSquare in https://github.com/smol-machines/smolvm/pull/2054\n* Pin libkrun to a543fcd3 so a partly restored checkpoint names the MSR KVM refused. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2058\n* Exit quietly by SIGPIPE when the CLI's output pipe closes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2061\n* Keep a persistent machine whose process died while the server was down as stopped with its disks by @BinSquare in https://github.com/smol-machines/smolvm/pull/2064\n* Refuse a live RAM resize the guest cannot take, and clear a RAM resize a restart already met by @BinSquare in https://github.com/smol-machines/smolvm/pull/2065\n* Kill what still holds a timed-out exec's output, and stop waiting on background jobs after an exec exits by @BinSquare in https://github.com/smol-machines/smolvm/pull/2053\n* Build the macOS release and libkrun on macos-15, since GitHub no longer runs macos-14 jobs by @BinSquare in https://github.com/smol-machines/smolvm/pull/2069\n* Pin libkrun to 2f6d58f3 so guests on SHA-NI hosts get SHA-NI, a restore names an instruction set its host lacks, and RAM growth fits the guest's physical address width by @BinSquare in https://github.com/smol-machines/smolvm/pull/2070\n* Use rotated credential values on a running machine without a restart by @BinSquare in https://github.com/smol-machines/smolvm/pull/2072\n* Pin libkrun to cac2acc1 so a stopped VM's disk images keep every write, and give the exit flush 15 s by @BinSquare in https://github.com/smol-machines/smolvm/pull/2074\n* Give a machine without an image the credential trust bundle its environment names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2073\n* Report a running machine as branchable when it was started branchable, not only when it was created so by @BinSquare in https://github.com/smol-machines/smolvm/pull/2057\n* Keep --secret-*, --workdir, --block-private, --gpu and --rosetta on machine create --from a pack by @BinSquare in https://github.com/smol-machines/smolvm/pull/2077\n* Let pack prune target one pack and size only what it removes by @0xvectr in https://github.com/smol-machines/smolvm/pull/2071\n* Add Russian, Spanish, and German READMEs and refresh existing translations by @NickyHeC in https://github.com/smol-machines/smolvm/pull/2041\n* Resolve every machine creation path through one spec, so each option is applied or refused by name instead of dropped by @BinSquare in https://github.com/smol-machines/smolvm/pull/2084\n* Drop the stale smolvm-sdk submodule by @BinSquare in https://github.com/smol-machines/smolvm/pull/2063\n* Run VMs in their own slice so they can never starve the node's API by @BinSquare in https://github.com/smol-machines/smolvm/pull/2062\n\n## New Contributors\n* @cherylaurelia made their first contribution in https://github.com/smol-machines/smolvm/pull/2050\n* @0xvectr made their first contribution in https://github.com/smol-machines/smolvm/pull/2071\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.33.0...v1.34.0","mentions_count":5}
