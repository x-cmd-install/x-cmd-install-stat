id":"RA_kwDOQrXKJc4ikitE","name":"smolvm-1.17.0-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":41955382,"digest":"sha256:b648e6aa47dc4fee1ddc255f5c11401fc6aab41bab61335bde903ad2fc2e1bd1","download_count":70,"created_at":"2026-09-21T22:34:59Z","updated_at":"2026-09-21T22:35:02Z"},{"id":580004669,"node_id":"RA_kwDOQrXKJc4ikis9","name":"smolvm-1.17.0-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":40529669,"digest":"sha256:fca3d2f511b3081345a505b9f0cd63450976156d2a0051776d40e4788e3736a9","download_count":49,"created_at":"2026-09-21T22:34:58Z","updated_at":"2026-09-21T22:35:02Z"}],"body":"## What's Changed\n* Let aarch64 Linux resume a branch source instead of freezing it by @BinSquare in https://github.com/smol-machines/smolvm/pull/1327\n* Attach host disks and vhost-user block devices to a machine by @BinSquare in https://github.com/smol-machines/smolvm/pull/1326\n* agent: refresh persistent DNS and retain shutdown receipts by @sgrove in https://github.com/smol-machines/smolvm/pull/1328\n* Return a directory listing when the files API is asked for a directory by @BinSquare in https://github.com/smol-machines/smolvm/pull/1330\n* Fail a delete that needs confirmation when stdin is not a terminal, instead of reading EOF as a decline and exiting successfully by @BinSquare in https://github.com/smol-machines/smolvm/pull/1333\n* Run the image's own entrypoint for a cached --oci-cache run instead of the bake's no-op placeholder by @BinSquare in https://github.com/smol-machines/smolvm/pull/1335\n* Provision the --oci-cache bake without launching a workload so images without /bin/true can be cached by @BinSquare in https://github.com/smol-machines/smolvm/pull/1340\n* Give a clone a host port the kernel will not reassign before it binds by @BinSquare in https://github.com/smol-machines/smolvm/pull/1341\n* Rebuild libkrun so aarch64 machines can branch again by @BinSquare in https://github.com/smol-machines/smolvm/pull/1342\n* Make incremental checkpoints reusable as a Rust crate by @BinSquare in https://github.com/smol-machines/smolvm/pull/1344\n* Reserve every recorded host port so a clone is never given a stopped machine's port by @BinSquare in https://github.com/smol-machines/smolvm/pull/1345\n* Forward CLI --secret-env/--secret-file secrets to the workload on the oci-cache and pack-ref run paths by @BinSquare in https://github.com/smol-machines/smolvm/pull/1343\n* Save checkpoints without staging a second RAM copy by @BinSquare in https://github.com/smol-machines/smolvm/pull/1305\n\n## New Contributors\n* @sgrove made their first contribution in https://github.com/smol-machines/smolvm/pull/1328\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.16.2...v1.17.0","mentions_count":2}
