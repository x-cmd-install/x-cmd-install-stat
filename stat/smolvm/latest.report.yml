 to 1.35.4 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/2263\n* Preserve machine ownership across lifecycle and transfer operations by @BinSquare in https://github.com/smol-machines/smolvm/pull/2289\n* Preserve workload dependencies during transfers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2290\n* Unpack image layers whose entries use absolute paths by @BinSquare in https://github.com/smol-machines/smolvm/pull/2291\n* Keep the vendored tar crate's lockfile out of git by @BinSquare in https://github.com/smol-machines/smolvm/pull/2292\n* Clear every networking request when machine update turns the network off by @BinSquare in https://github.com/smol-machines/smolvm/pull/2307\n* Keep artifacts from naming a host directory as their image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2302\n* Match an IPv4-mapped IPv6 destination against the watchlist as its IPv4 form by @BinSquare in https://github.com/smol-machines/smolvm/pull/2305\n* Learn allowed addresses only from a successful answer to a plain DNS query by @BinSquare in https://github.com/smol-machines/smolvm/pull/2306\n* Floor multicast and reserved addresses under the private and strict egress floors by @BinSquare in https://github.com/smol-machines/smolvm/pull/2304\n* Hold a gateway flow to the full egress policy on the loopback address it reaches by @BinSquare in https://github.com/smol-machines/smolvm/pull/2295\n* Attach a restored checkpoint's host mounts only where the user names them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2301\n* Give a pack entry its mode and owner where it landed, never through a link by @BinSquare in https://github.com/smol-machines/smolvm/pull/2297\n* Refuse a checkpoint disk listed as raw that is a qcow2 image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2299\n* Attach a packed run's disks as raw instead of trusting their header by @BinSquare in https://github.com/smol-machines/smolvm/pull/2293\n* Refuse to attach a disk whose qcow2 header names another file by @BinSquare in https://github.com/smol-machines/smolvm/pull/2296\n* Attach the pod share to the sandbox VM read-only by @BinSquare in https://github.com/smol-machines/smolvm/pull/2294\n* Refuse a restored checkpoint's egress policy when its own entries reach the host by @BinSquare in https://github.com/smol-machines/smolvm/pull/2300\n* Preserve sparse disk copies and APFS archive holes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2310\n* Bind workload previews to image and machine identities by @BinSquare in https://github.com/smol-machines/smolvm/pull/2309\n* Keep this host's registry logins out of pulls for an artifact-chosen image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2303\n* Treat a branch or fork request's secret refs as untrusted, like every HTTP request by @BinSquare in https://github.com/smol-machines/smolvm/pull/2311\n* Refuse symlinks among a pack's or checkpoint's own files, and non-file objects on export by @BinSquare in https://github.com/smol-machines/smolvm/pull/2313\n* Recover container cleanup across workload transfer cancellation by @BinSquare in https://github.com/smol-machines/smolvm/pull/2312\n* Check that the bundled guest kernels are built with gcc by @josmo in https://github.com/smol-machines/smolvm/pull/2308\n* Bring the installer header, default memory text and docs/llms.txt up to date by @NickyHeC in https://github.com/smol-machines/smolvm/pull/2273\n* Fix the Windows native test build by @BinSquare in https://github.com/smol-machines/smolvm/pull/2318\n* Pin libkrun so branches are not charged twice for their base's untouched memory by @BinSquare in https://github.com/smol-machines/smolvm/pull/2317\n* Show a Windows interactive session's output without waiting for a keypress by @BinSquare in https://github.com/smol-machines/smolvm/pull/2246\n* Allow checkpoint restores to override egress policy by @NickyHeC in https://git