id":"RA_kwDOQrXKJc4tljef","name":"smolvm-1.35.4-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":51169340,"digest":"sha256:1099f272c1dedba1b02ebe4bed0ee29912e977e6715eb1f85dbe74d99fe33c71","download_count":49,"created_at":"2026-11-18T20:07:42Z","updated_at":"2026-11-18T20:07:45Z"},{"id":764819362,"node_id":"RA_kwDOQrXKJc4tljei","name":"smolvm-1.35.4-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44401800,"digest":"sha256:7fd5880bfeb058e36b369d040aec37612dfff0d2a2ab4b8d410ab8c074661a47","download_count":26,"created_at":"2026-11-18T20:07:42Z","updated_at":"2026-11-18T20:07:45Z"}],"body":"## What's Changed\n* docs: say that virtiofs DAX is off on arm64 hosts and SMOLVM_MOUNT_DAX does nothing there by @BinSquare in https://github.com/smol-machines/smolvm/pull/2087\n* Add smolvm docker: one command starts a Docker engine in a managed machine and points docker at it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2089\n* Share the home directory with the smolvm docker machine at the same path by @BinSquare in https://github.com/smol-machines/smolvm/pull/2090\n* Resolve host.docker.internal to the host from smolvm docker containers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2091\n* Fix a port race in the leader-exit test by @BinSquare in https://github.com/smol-machines/smolvm/pull/2096\n* Remove smolvm docker by @BinSquare in https://github.com/smol-machines/smolvm/pull/2095\n* Hand supplied credential values to a running embedded machine at once by @BinSquare in https://github.com/smol-machines/smolvm/pull/2097\n* Pin libkrunfw with UDP kept inside a TSI guest, and test it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2099\n* Publish ports below 1024 on macOS, add IPv6 loopback to live-forwarded ports, and lift the 64-mapping cap by @BinSquare in https://github.com/smol-machines/smolvm/pull/2092\n* Return idle guest memory to the host within two minutes and cap new machines at half the host's RAM by @BinSquare in https://github.com/smol-machines/smolvm/pull/2094\n* Install a root-owned agent-rootfs when root runs install.sh by @rdslw in https://github.com/smol-machines/smolvm/pull/2082\n* Announce a changed file to the guest once per change by @BinSquare in https://github.com/smol-machines/smolvm/pull/2102\n* Answer guest DNS from a host cache that coalesces bursts and resends lost queries by @BinSquare in https://github.com/smol-machines/smolvm/pull/2098\n* Keep every disk chain under the branch depth limit: fold restored checkpoint layers and frozen-source chains by @BinSquare in https://github.com/smol-machines/smolvm/pull/2103\n* Exec sessions: commands the node owns, resumable after a dropped connection by @BinSquare in https://github.com/smol-machines/smolvm/pull/2101\n* Let a guest hold tens of thousands of connections on virtio-net and free their host sockets promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2104\n* Scope the usage journal to the test's own thread by @BinSquare in https://github.com/smol-machines/smolvm/pull/2106\n* Pin libkrun 526be460 and libkrunfw f290c62b, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2109\n* Build the agent rootfs as non-root on hosts with user namespaces again by @BinSquare in https://github.com/smol-machines/smolvm/pull/2107\n* Answer a start missing the mediated interceptor with 400, not 500 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2108\n* Run tests that need a released file lock free at once in their own process by @BinSquare in https://github.com/smol-machines/smolvm/pull/2110\n* Pin libkrun 9df62257 and libkrunfw 7f4d4950, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2113\n* Stop resetting virtio-net connections a server closes first by @BinSquare in https://github.com/smol-machines/smolvm/pull/2118\n* Upgrade rusqlite to 0.41 for the patched bundled SQLite (RUSTSEC-2026-0459) by @BinSquare in https://github.com/smol-machines/smolvm/pull/2128\n* Keep a host memory reserve VMs cannot take and charge branch children for growth by @BinSquare in https://github.com/smol-machines/smolvm/pull/2127\n* Ask before stopping a machine on delete, so a refused or declined delete leaves it running by @connorburgess in https://github.com/smol-machines/smolvm/pull/2131\n* Prepare SmolVM v1.34.1 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2135\n* Bring a soft open-file limit above kern.maxfilesperproc down to the cap on macOS, so the limit raise_nofile_limit reports is the one in force by @connorburgess in https://github.com/smol-machines/smolvm/pull/2132\n* Leave no data directory behind when exec, status or stop name a machine that does not exist by @connorburgess in https://github.com/smol-machines/smolvm/pull/2129\n* Warn when --block-private keeps a named host unreachable by @BinSquare in https://github.com/smol-machines/smolvm/pull/2146\n* Register Rosetta itself as the x86_64 interpreter when the host answers its start-up ioctl by @BinSquare in https://github.com/smol-machines/smolvm/pull/2148\n* Make a mounted host directory belong to the workload user so a non-root workload can write to it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2149\n* Record the image platform on the machine so a Rosetta machine can be created from an amd64 image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2147\n* Bump libkrun so a Rosetta machine runs amd64 programs directly and a macOS machine stops promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2150\n* Keep a cache disk's chain on its shared base when compaction shortens it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2145\n* Satisfy Rust 1.100's needless_bool lint in connect_in_progress on Windows by @BinSquare in https://github.com/smol-machines/smolvm/pull/2154\n* Bound branch admission and reported capacity by the VM slice's memory limit, not just host free memory by @BinSquare in https://github.com/smol-machines/smolvm/pull/2152\n* Stop throttling the VM slice and reclaim it from the pressure guard instead by @BinSquare in https://github.com/smol-machines/smolvm/pull/2153\n* Release a paused branch child's VM lock so the memory pressure guard can resume it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2157\n* Keep a restored machine's local image on its storage disk instead of mounting the capturing host's archive by @BinSquare in https://github.com/smol-machines/smolvm/pull/2163\n* Update quinn-udp to 0.5.16 for RUSTSEC-2026-0538 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2165\n* Count every symlink with one mode in the agent rootfs digest so a Mac checkpoint restores on Linux by @BinSquare in https://github.com/smol-machines/smolvm/pull/2162\n* Carry guest traffic in 64 KB frames over the gateway link so downloads use a quarter of the CPU by @BinSquare in https://github.com/smol-machines/smolvm/pull/2168\n* Pin libkrun 518949b4 and libkrunfw 0fae3853, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2169\n* Reserve tmpfs for concurrent RAM captures and sweep abandoned checkpoint scratch at serve start by @BinSquare in https://github.com/smol-machines/smolvm/pull/2173\n* Let a packed image's branch take the deferred checkpoint save and say when the VM died mid-save by @BinSquare in https://github.com/smol-machines/smolvm/pull/2174\n* Integrate and validate Docker Engine, automatic ports, and nested Rosetta support by @BinSquare in https://github.com/smol-machines/smolvm/pull/2172\n* Run x86_64 images in containers Docker starts inside a Rosetta machine, keeping their PID by @BinSquare in https://github.com/smol-machines/smolvm/pull/2093\n* Serve the Docker Engine API from smolvm, every container a machine by @BinSquare in https://github.com/smol-machines/smolvm/pull/2114\n* Publish the ports a machine starts listening on, with --auto-ports by @BinSquare in https://github.com/smol-machines/smolvm/pull/2136\n* Give engine containers user-defined networks, so Docker Compose stacks run by @BinSquare in https://github.com/smol-machines/smolvm/pull/2115\n* Let engine containers reach the Docker socket, so Testcontainers and Dev Containers work by @BinSquare in https://github.com/smol-machines/smolvm/pull/2116\n* Branch engine containers from a warm base when many of one image run by @BinSquare in https://github.com/smol-machines/smolvm/pull/2117\n* Publish engine container ports on the address each one names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2119\n* Give engine containers a volume for each VOLUME their image declares by @BinSquare in https://github.com/smol-machines/smolvm/pull/2120\n* Move images in and out of the engine: save, load, push, commit, import, export by @BinSquare in https://github.com/smol-machines/smolvm/pull/2121\n* Run --network container:<id> containers in that container's machine by @BinSquare in https://github.com/smol-machines/smolvm/pull/2122\n* Give engine networks IPv6 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2123\n* Run the Docker API on demand with independent workload supervisors by @BinSquare in https://github.com/smol-machines/smolvm/pull/2175\n* Fix Buildx volume permissions and macOS restart stalls by @BinSquare in https://github.com/smol-machines/smolvm/pull/2178\n* Improve default macOS shared-volume write performance by @BinSquare in https://github.com/smol-machines/smolvm/pull/2179\n* engine: speed up macOS Buildx with automatic overlayfs snapshots by @BinSquare in https://github.com/smol-machines/smolvm/pull/2181\n* Run the guest keep-alive init as root while workloads and execs keep the image user and its supplementary groups. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2004\n* engine: fix multi-stage Buildx builds containing deleted files by @BinSquare in https://github.com/smol-machines/smolvm/pull/2183\n* Scrub injected credential values from what a credential host sends back by @BinSquare in https://github.com/smol-machines/smolvm/pull/2180\n* Re-authorize a restored checkpoint's credential bindings from the CLI, and refuse a start that could not inject them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2182\n* Sweep a deleted machine's pause-operation lock along with its fork-operation lock by @connorburgess in https://github.com/smol-machines/smolvm/pull/2184\n* Let machine update set and remove labels, in any machine state by @josmo in https://github.com/smol-machines/smolvm/pull/2143\n* Leave the Docker Engine API opt-in so installing or upgrading smolvm never switches the user's Docker context by @BinSquare in https://github.com/smol-machines/smolvm/pull/2186\n* Bump every workspace crate and the nix flake to 1.35.0 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2185\n* fix(network): retain OS-allocated local TCP listeners by @kumanday in https://github.com/smol-machines/smolvm/pull/2112\n* Retry a checkpoint part the object store refuses with a transient error by @BinSquare in https://github.com/smol-machines/smolvm/pull/2191\n* fix(shim): preserve foreground helper exit statuses by @hfiguera in https://github.com/smol-machines/smolvm/pull/2190\n* Delete the image seed builder when a CLI start is interrupted, and reap builders whose owner exited (#2083) by @rdslw in https://github.com/smol-machines/smolvm/pull/2188\n* Honor SMOLVM_DATA_DIR and --state-dir on macOS by @BinSquare in https://github.com/smol-machines/smolvm/pull/2193\n* Map a mounted host directory to the workload user again, not the keep-alive init's root, so a non-root workload can write to it by @josmo in https://github.com/smol-machines/smolvm/pull/2189\n* Open the Nix flake bump from main and run its required attribution check, so the bump PR can merge by @BinSquare in https://github.com/smol-machines/smolvm/pull/2194\n* Bind the port forward tests' ports before using them, instead of picking a free port and binding it again later by @BinSquare in https://github.com/smol-machines/smolvm/pull/2195\n* engine: use an on-demand native Buildx builder by @BinSquare in https://github.com/smol-machines/smolvm/pull/2196\n* perf(engine): reduce container lifecycle overhead by @BinSquare in https://github.com/smol-machines/smolvm/pull/2198\n* perf(engine): improve streaming output throughput by @BinSquare in https://github.com/smol-machines/smolvm/pull/2200\n* perf(engine): bound log tail reads and stream binary payloads by @BinSquare in https://github.com/smol-machines/smolvm/pull/2201\n* Compile the auto ports test's port helper only on Unix, where its one caller runs by @BinSquare in https://github.com/smol-machines/smolvm/pull/2199\n* Keep an image's files under /run when a container starts by @BinSquare in https://github.com/smol-machines/smolvm/pull/2203\n* Leave the Docker context alone when an engine with its own state directory is set up, and remove its registration by name by @BinSquare in https://github.com/smol-machines/smolvm/pull/2202\n* Stop a workload supervisor on SIGTERM and when its engine state is deleted, whoever holds the warm base lock by @BinSquare in https://github.com/smol-machines/smolvm/pull/2204\n* Start a display without a host GPU, check the host GPU before a --gpu start, and finish stop and delete around a process the kernel will not let exit by @BinSquare in https://github.com/smol-machines/smolvm/pull/2210\n* Allow ARM cloud checkpoints to return to macOS by @BinSquare in https://github.com/smol-machines/smolvm/pull/2216\n* Refuse a staged sync entry whose parent leads outside the mount through a symlink, so a guest cannot delete host files by @BinSquare in https://github.com/smol-machines/smolvm/pull/2242\n* Serve at most eight workload log connections, closing the oldest, so a guest cannot exhaust host threads by @BinSquare in https://github.com/smol-machines/smolvm/pull/2243\n* Bump libkrun so a resumed macOS machine releases the memory its guest frees and keeps it out of checkpoints by @BinSquare in https://github.com/smol-machines/smolvm/pull/2244\n* Trim the guest's disks before a capture, so deleted files leave the checkpoint and the host disk by @BinSquare in https://github.com/smol-machines/smolvm/pull/2245\n* Forget a host's learned addresses when a running machine's allow list is left with no hosts by @josmo in https://github.com/smol-machines/smolvm/pull/2142\n* Point exec and cp on a paused machine at resume, not at a start that refuses it by @connorburgess in https://github.com/smol-machines/smolvm/pull/2167\n* Bump libkrun so restored macOS machines keep later writes in checkpoints and qcow2 discards free host disk space by @BinSquare in https://github.com/smol-machines/smolvm/pull/2248\n* Preserve local-image machines across export and restore by @Vishv07 in https://github.com/smol-machines/smolvm/pull/1980\n* Preserve packed network restrictions and apply overrides atomically by @Vishv07 in https://github.com/smol-machines/smolvm/pull/2006\n* Clone the case-sensitive layers image instead of formatting a new one by @BABTUNA in https://github.com/smol-machines/smolvm/pull/1713\n* Preserve staged files when an interactive output pipe closes by @connorburgess in https://github.com/smol-machines/smolvm/pull/2164\n* Diagnose unsupported macOS virtualization without masking other failures by @Bnjoroge1 in https://github.com/smol-machines/smolvm/pull/1323\n* Allow disk growth before first boot by @BinSquare in https://github.com/smol-machines/smolvm/pull/2211\n* Expose machine files and harden engine storage workflows by @BinSquare in https://github.com/smol-machines/smolvm/pull/2206\n* Close failed port-forward tunnels and reap reply readers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2214\n* Fix Docker container name filtering by @BinSquare in https://github.com/smol-machines/smolvm/pull/2225\n* Speed up and isolate first-use disk template expansion by @BinSquare in https://github.com/smol-machines/smolvm/pull/2229\n* Fix Docker networking and persistent VM lifecycle by @BinSquare in https://github.com/smol-machines/smolvm/pull/2234\n* Serialize overlay remounts so concurrent prepares don't race by @Liamso in https://github.com/smol-machines/smolvm/pull/2166\n* Fix interactive stream stalls and idle wakeups by @BinSquare in https://github.com/smol-machines/smolvm/pull/2250\n* Report Docker container resources from guest kernel accounting by @BinSquare in https://github.com/smol-machines/smolvm/pull/2228\n* Preserve image index digests for Docker image lookup by @BinSquare in https://github.com/smol-machines/smolvm/pull/2224\n* Hold back the growth already promised to running branch children when admitting a branch by @BinSquare in https://github.com/smol-machines/smolvm/pull/2205\n* Share local images with managed Kubernetes and recover filesystem notifications by @BinSquare in https://github.com/smol-machines/smolvm/pull/2219\n* fix(engine): stop polling idle Docker event streams by @BinSquare in https://github.com/smol-machines/smolvm/pull/2251\n* fix(checkpoint): retain booted rootfs after app updates by @BinSquare in https://github.com/smol-machines/smolvm/pull/2253\n* Preserve container sessions and discover local apps by @BinSquare in https://github.com/smol-machines/smolvm/pull/2254\n* Build a restored checkpoint over the most similar tree the node has, not only a recorded ancestor by @BinSquare in https://github.com/smol-machines/smolvm/pull/2255\n* Clean up disconnected sessions when guest input is blocked by @BinSquare in https://github.com/smol-machines/smolvm/pull/2256\n* chore(nix): bump flake to 1.35.3 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/2249\n* Add machine credentials refresh, which hands a running machine new credential values from this shell without a restart by @BinSquare in https://github.com/smol-machines/smolvm/pull/2257\n* Approve the Nix flake bump PR's held checks, so a release's bump can merge by @BinSquare in https://github.com/smol-machines/smolvm/pull/2258\n\n## New Contributors\n* @rdslw made their first contribution in https://github.com/smol-machines/smolvm/pull/2082\n* @connorburgess made their first contribution in https://github.com/smol-machines/smolvm/pull/2131\n* @josmo made their first contribution in https://github.com/smol-machines/smolvm/pull/2143\n* @kumanday made their first contribution in https://github.com/smol-machines/smolvm/pull/2112\n* @Liamso made their first contribution in https://github.com/smol-machines/smolvm/pull/2166\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.34.0...v1.35.4","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":10}
