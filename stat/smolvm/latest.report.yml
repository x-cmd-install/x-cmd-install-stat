id":"RA_kwDOQrXKJc4uxyb6","name":"smolvm-1.37.0-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":57569340,"digest":"sha256:899dce2a1145f0a0519a41e7a13a7c5cad49dc530d29a4f4aac19d57cd567775","download_count":65,"created_at":"2026-11-23T22:36:35Z","updated_at":"2026-11-23T22:36:38Z"},{"id":784803581,"node_id":"RA_kwDOQrXKJc4uxyb9","name":"smolvm-1.37.0-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":46605732,"digest":"sha256:279f500357ba906d73cf04ce9226844dae95329b7d5be19d53e742e75ce1ae38","download_count":28,"created_at":"2026-11-23T22:36:35Z","updated_at":"2026-11-23T22:36:37Z"}],"body":"## What's Changed\n* docs: say that virtiofs DAX is off on arm64 hosts and SMOLVM_MOUNT_DAX does nothing there by @BinSquare in https://github.com/smol-machines/smolvm/pull/2087\n* Add smolvm docker: one command starts a Docker engine in a managed machine and points docker at it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2089\n* Share the home directory with the smolvm docker machine at the same path by @BinSquare in https://github.com/smol-machines/smolvm/pull/2090\n* Resolve host.docker.internal to the host from smolvm docker containers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2091\n* Fix a port race in the leader-exit test by @BinSquare in https://github.com/smol-machines/smolvm/pull/2096\n* Remove smolvm docker by @BinSquare in https://github.com/smol-machines/smolvm/pull/2095\n* Hand supplied credential values to a running embedded machine at once by @BinSquare in https://github.com/smol-machines/smolvm/pull/2097\n* Pin libkrunfw with UDP kept inside a TSI guest, and test it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2099\n* Publish ports below 1024 on macOS, add IPv6 loopback to live-forwarded ports, and lift the 64-mapping cap by @BinSquare in https://github.com/smol-machines/smolvm/pull/2092\n* Return idle guest memory to the host within two minutes and cap new machines at half the host's RAM by @BinSquare in https://github.com/smol-machines/smolvm/pull/2094\n* Install a root-owned agent-rootfs when root runs install.sh by @rdslw in https://github.com/smol-machines/smolvm/pull/2082\n* Announce a changed file to the guest once per change by @BinSquare in https://github.com/smol-machines/smolvm/pull/2102\n* Answer guest DNS from a host cache that coalesces bursts and resends lost queries by @BinSquare in https://github.com/smol-machines/smolvm/pull/2098\n* Keep every disk chain under the branch depth limit: fold restored checkpoint layers and frozen-source chains by @BinSquare in https://github.com/smol-machines/smolvm/pull/2103\n* Exec sessions: commands the node owns, resumable after a dropped connection by @BinSquare in https://github.com/smol-machines/smolvm/pull/2101\n* Let a guest hold tens of thousands of connections on virtio-net and free their host sockets promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2104\n* Scope the usage journal to the test's own thread by @BinSquare in https://github.com/smol-machines/smolvm/pull/2106\n* Pin libkrun 526be460 and libkrunfw f290c62b, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2109\n* Build the agent rootfs as non-root on hosts with user namespaces again by @BinSquare in https://github.com/smol-machines/smolvm/pull/2107\n* Answer a start missing the mediated interceptor with 400, not 500 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2108\n* Run tests that need a released file lock free at once in their own process by @BinSquare in https://github.com/smol-machines/smolvm/pull/2110\n* Pin libkrun 9df62257 and libkrunfw 7f4d4950, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2113\n* Stop resetting virtio-net connections a server closes first by @BinSquare in https://github.com/smol-machines/smolvm/pull/2118\n* Upgrade rusqlite to 0.41 for the patched bundled SQLite (RUSTSEC-2026-0459) by @BinSquare in https://github.com/smol-machines/smolvm/pull/2128\n* Keep a host memory reserve VMs cannot take and charge branch children for growth by @BinSquare in https://github.com/smol-machines/smolvm/pull/2127\n* Ask before stopping a machine on delete, so a refused or declined delete leaves it running by @connorburgess in https://github.com/smol-machines/smolvm/pull/2131\n* Prepare SmolVM v1.34.1 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2135\n* Bring a soft open-file limit above kern.maxfilesperproc down to the cap on macOS, so the limit raise_nofile_limit reports is the one in force by @connorburgess in https://github.com/smol-machines/smolvm/pull/2132\n* Leave no data directory behind when exec, status or stop name a machine that does not exist by @connorburgess in https://github.com/smol-machines/smolvm/pull/2129\n* Warn when --block-private keeps a named host unreachable by @BinSquare in https://github.com/smol-machines/smolvm/pull/2146\n* Register Rosetta itself as the x86_64 interpreter when the host answers its start-up ioctl by @BinSquare in https://github.com/smol-machines/smolvm/pull/2148\n* Make a mounted host directory belong to the workload user so a non-root workload can write to it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2149\n* Record the image platform on the machine so a Rosetta machine can be created from an amd64 image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2147\n* Bump libkrun so a Rosetta machine runs amd64 programs directly and a macOS machine stops promptly by @BinSquare in https://github.com/smol-machines/smolvm/pull/2150\n* Keep a cache disk's chain on its shared base when compaction shortens it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2145\n* Satisfy Rust 1.100's needless_bool lint in connect_in_progress on Windows by @BinSquare in https://github.com/smol-machines/smolvm/pull/2154\n* Bound branch admission and reported capacity by the VM slice's memory limit, not just host free memory by @BinSquare in https://github.com/smol-machines/smolvm/pull/2152\n* Stop throttling the VM slice and reclaim it from the pressure guard instead by @BinSquare in https://github.com/smol-machines/smolvm/pull/2153\n* Release a paused branch child's VM lock so the memory pressure guard can resume it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2157\n* Keep a restored machine's local image on its storage disk instead of mounting the capturing host's archive by @BinSquare in https://github.com/smol-machines/smolvm/pull/2163\n* Update quinn-udp to 0.5.16 for RUSTSEC-2026-0538 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2165\n* Count every symlink with one mode in the agent rootfs digest so a Mac checkpoint restores on Linux by @BinSquare in https://github.com/smol-machines/smolvm/pull/2162\n* Carry guest traffic in 64 KB frames over the gateway link so downloads use a quarter of the CPU by @BinSquare in https://github.com/smol-machines/smolvm/pull/2168\n* Pin libkrun 518949b4 and libkrunfw 0fae3853, rebuilt for every platform by @BinSquare in https://github.com/smol-machines/smolvm/pull/2169\n* Reserve tmpfs for concurrent RAM captures and sweep abandoned checkpoint scratch at serve start by @BinSquare in https://github.com/smol-machines/smolvm/pull/2173\n* Let a packed image's branch take the deferred checkpoint save and say when the VM died mid-save by @BinSquare in https://github.com/smol-machines/smolvm/pull/2174\n* Integrate and validate Docker Engine, automatic ports, and nested Rosetta support by @BinSquare in https://github.com/smol-machines/smolvm/pull/2172\n* Run x86_64 images in containers Docker starts inside a Rosetta machine, keeping their PID by @BinSquare in https://github.com/smol-machines/smolvm/pull/2093\n* Serve the Docker Engine API from smolvm, every container a machine by @BinSquare in https://github.com/smol-machines/smolvm/pull/2114\n* Publish the ports a machine starts listening on, with --auto-ports by @BinSquare in https://github.com/smol-machines/smolvm/pull/2136\n* Give engine containers user-defined networks, so Docker Compose stacks run by @BinSquare in https://github.com/smol-machines/smolvm/pull/2115\n* Let engine containers reach the Docker socket, so Testcontainers and Dev Containers work by @BinSquare in https://github.com/smol-machines/smolvm/pull/2116\n* Branch engine containers from a warm base when many of one image run by @BinSquare in https://github.com/smol-machines/smolvm/pull/2117\n* Publish engine container ports on the address each one names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2119\n* Give engine containers a volume for each VOLUME their image declares by @BinSquare in https://github.com/smol-machines/smolvm/pull/2120\n* Move images in and out of the engine: save, load, push, commit, import, export by @BinSquare in https://github.com/smol-machines/smolvm/pull/2121\n* Run --network container:<id> containers in that container's machine by @BinSquare in https://github.com/smol-machines/smolvm/pull/2122\n* Give engine networks IPv6 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2123\n* Run the Docker API on demand with independent workload supervisors by @BinSquare in https://github.com/smol-machines/smolvm/pull/2175\n* Fix Buildx volume permissions and macOS restart stalls by @BinSquare in https://github.com/smol-machines/smolvm/pull/2178\n* Improve default macOS shared-volume write performance by @BinSquare in https://github.com/smol-machines/smolvm/pull/2179\n* engine: speed up macOS Buildx with automatic overlayfs snapshots by @BinSquare in https://github.com/smol-machines/smolvm/pull/2181\n* Run the guest keep-alive init as root while workloads and execs keep the image user and its supplementary groups. by @BinSquare in https://github.com/smol-machines/smolvm/pull/2004\n* engine: fix multi-stage Buildx builds containing deleted files by @BinSquare in https://github.com/smol-machines/smolvm/pull/2183\n* Scrub injected credential values from what a credential host sends back by @BinSquare in https://github.com/smol-machines/smolvm/pull/2180\n* Re-authorize a restored checkpoint's credential bindings from the CLI, and refuse a start that could not inject them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2182\n* Sweep a deleted machine's pause-operation lock along with its fork-operation lock by @connorburgess in https://github.com/smol-machines/smolvm/pull/2184\n* Let machine update set and remove labels, in any machine state by @josmo in https://github.com/smol-machines/smolvm/pull/2143\n* Leave the Docker Engine API opt-in so installing or upgrading smolvm never switches the user's Docker context by @BinSquare in https://github.com/smol-machines/smolvm/pull/2186\n* Bump every workspace crate and the nix flake to 1.35.0 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2185\n* fix(network): retain OS-allocated local TCP listeners by @kumanday in https://github.com/smol-machines/smolvm/pull/2112\n* Retry a checkpoint part the object store refuses with a transient error by @BinSquare in https://github.com/smol-machines/smolvm/pull/2191\n* fix(shim): preserve foreground helper exit statuses by @hfiguera in https://github.com/smol-machines/smolvm/pull/2190\n* Delete the image seed builder when a CLI start is interrupted, and reap builders whose owner exited (#2083) by @rdslw in https://github.com/smol-machines/smolvm/pull/2188\n* Honor SMOLVM_DATA_DIR and --state-dir on macOS by @BinSquare in https://github.com/smol-machines/smolvm/pull/2193\n* Map a mounted host directory to the workload user again, not the keep-alive init's root, so a non-root workload can write to it by @josmo in https://github.com/smol-machines/smolvm/pull/2189\n* Open the Nix flake bump from main and run its required attribution check, so the bump PR can merge by @BinSquare in https://github.com/smol-machines/smolvm/pull/2194\n* Bind the port forward tests' ports before using them, instead of picking a free port and binding it again later by @BinSquare in https://github.com/smol-machines/smolvm/pull/2195\n* engine: use an on-demand native Buildx builder by @BinSquare in https://github.com/smol-machines/smolvm/pull/2196\n* perf(engine): reduce container lifecycle overhead by @BinSquare in https://github.com/smol-machines/smolvm/pull/2198\n* perf(engine): improve streaming output throughput by @BinSquare in https://github.com/smol-machines/smolvm/pull/2200\n* perf(engine): bound log tail reads and stream binary payloads by @BinSquare in https://github.com/smol-machines/smolvm/pull/2201\n* Compile the auto ports test's port helper only on Unix, where its one caller runs by @BinSquare in https://github.com/smol-machines/smolvm/pull/2199\n* Keep an image's files under /run when a container starts by @BinSquare in https://github.com/smol-machines/smolvm/pull/2203\n* Leave the Docker context alone when an engine with its own state directory is set up, and remove its registration by name by @BinSquare in https://github.com/smol-machines/smolvm/pull/2202\n* Stop a workload supervisor on SIGTERM and when its engine state is deleted, whoever holds the warm base lock by @BinSquare in https://github.com/smol-machines/smolvm/pull/2204\n* Start a display without a host GPU, check the host GPU before a --gpu start, and finish stop and delete around a process the kernel will not let exit by @BinSquare in https://github.com/smol-machines/smolvm/pull/2210\n* Allow ARM cloud checkpoints to return to macOS by @BinSquare in https://github.com/smol-machines/smolvm/pull/2216\n* Refuse a staged sync entry whose parent leads outside the mount through a symlink, so a guest cannot delete host files by @BinSquare in https://github.com/smol-machines/smolvm/pull/2242\n* Serve at most eight workload log connections, closing the oldest, so a guest cannot exhaust host threads by @BinSquare in https://github.com/smol-machines/smolvm/pull/2243\n* Bump libkrun so a resumed macOS machine releases the memory its guest frees and keeps it out of checkpoints by @BinSquare in https://github.com/smol-machines/smolvm/pull/2244\n* Trim the guest's disks before a capture, so deleted files leave the checkpoint and the host disk by @BinSquare in https://github.com/smol-machines/smolvm/pull/2245\n* Forget a host's learned addresses when a running machine's allow list is left with no hosts by @josmo in https://github.com/smol-machines/smolvm/pull/2142\n* Point exec and cp on a paused machine at resume, not at a start that refuses it by @connorburgess in https://github.com/smol-machines/smolvm/pull/2167\n* Bump libkrun so restored macOS machines keep later writes in checkpoints and qcow2 discards free host disk space by @BinSquare in https://github.com/smol-machines/smolvm/pull/2248\n* Preserve local-image machines across export and restore by @Vishv07 in https://github.com/smol-machines/smolvm/pull/1980\n* Preserve packed network restrictions and apply overrides atomically by @Vishv07 in https://github.com/smol-machines/smolvm/pull/2006\n* Clone the case-sensitive layers image instead of formatting a new one by @BABTUNA in https://github.com/smol-machines/smolvm/pull/1713\n* Preserve staged files when an interactive output pipe closes by @connorburgess in https://github.com/smol-machines/smolvm/pull/2164\n* Diagnose unsupported macOS virtualization without masking other failures by @Bnjoroge1 in https://github.com/smol-machines/smolvm/pull/1323\n* Allow disk growth before first boot by @BinSquare in https://github.com/smol-machines/smolvm/pull/2211\n* Expose machine files and harden engine storage workflows by @BinSquare in https://github.com/smol-machines/smolvm/pull/2206\n* Close failed port-forward tunnels and reap reply readers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2214\n* Fix Docker container name filtering by @BinSquare in https://github.com/smol-machines/smolvm/pull/2225\n* Speed up and isolate first-use disk template expansion by @BinSquare in https://github.com/smol-machines/smolvm/pull/2229\n* Fix Docker networking and persistent VM lifecycle by @BinSquare in https://github.com/smol-machines/smolvm/pull/2234\n* Serialize overlay remounts so concurrent prepares don't race by @Liamso in https://github.com/smol-machines/smolvm/pull/2166\n* Fix interactive stream stalls and idle wakeups by @BinSquare in https://github.com/smol-machines/smolvm/pull/2250\n* Report Docker container resources from guest kernel accounting by @BinSquare in https://github.com/smol-machines/smolvm/pull/2228\n* Preserve image index digests for Docker image lookup by @BinSquare in https://github.com/smol-machines/smolvm/pull/2224\n* Hold back the growth already promised to running branch children when admitting a branch by @BinSquare in https://github.com/smol-machines/smolvm/pull/2205\n* Share local images with managed Kubernetes and recover filesystem notifications by @BinSquare in https://github.com/smol-machines/smolvm/pull/2219\n* fix(engine): stop polling idle Docker event streams by @BinSquare in https://github.com/smol-machines/smolvm/pull/2251\n* fix(checkpoint): retain booted rootfs after app updates by @BinSquare in https://github.com/smol-machines/smolvm/pull/2253\n* Preserve container sessions and discover local apps by @BinSquare in https://github.com/smol-machines/smolvm/pull/2254\n* Build a restored checkpoint over the most similar tree the node has, not only a recorded ancestor by @BinSquare in https://github.com/smol-machines/smolvm/pull/2255\n* Clean up disconnected sessions when guest input is blocked by @BinSquare in https://github.com/smol-machines/smolvm/pull/2256\n* chore(nix): bump flake to 1.35.3 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/2249\n* Add machine credentials refresh, which hands a running machine new credential values from this shell without a restart by @BinSquare in https://github.com/smol-machines/smolvm/pull/2257\n* Approve the Nix flake bump PR's held checks, so a release's bump can merge by @BinSquare in https://github.com/smol-machines/smolvm/pull/2258\n* Let the Nix package keep the guest rootfs's links, and build the flake in CI by @BinSquare in https://github.com/smol-machines/smolvm/pull/2261\n* Bump libkrun so a Windows guest rewrite keeps a file's owner and a share can serve a default owner by @BinSquare in https://github.com/smol-machines/smolvm/pull/2262\n* Let a host mount name the guest owner of its files (-v HOST:GUEST:uid=N[,gid=N]) by @BinSquare in https://github.com/smol-machines/smolvm/pull/2260\n* Keep pack and OCI layer extraction from touching anything outside the layer by @BinSquare in https://github.com/smol-machines/smolvm/pull/2264\n* Reuse a pack's extraction only for the artifact it came from, and key bundled libraries by SHA-256 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2266\n* Load a pack's own libraries only when they came from the executable running by @BinSquare in https://github.com/smol-machines/smolvm/pull/2267\n* Serve only the host on the guest agent's vsock listeners by @BinSquare in https://github.com/smol-machines/smolvm/pull/2268\n* Keep host loopback closed to gateway flows under --block-private by @BinSquare in https://github.com/smol-machines/smolvm/pull/2269\n* Pin libkrun at the share-confinement fixes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2271\n* Add on-demand SSH and SFTP for seamless environment access by @BinSquare in https://github.com/smol-machines/smolvm/pull/2272\n* Preserve image-backed containers across VM pause and resume by @BinSquare in https://github.com/smol-machines/smolvm/pull/2274\n* Expose checkpoint reader requirements before local offload by @BinSquare in https://github.com/smol-machines/smolvm/pull/2277\n* Keep pod volume copies private to the VMM and honor read-only volume mounts by @BinSquare in https://github.com/smol-machines/smolvm/pull/2270\n* Support POSIX ACLs on a machine's ext4 disks by @BinSquare in https://github.com/smol-machines/smolvm/pull/2276\n* Keep guest root ownership consistent across hosts by @BinSquare in https://github.com/smol-machines/smolvm/pull/2279\n* Preserve guest permissions when installing the runtime by @BinSquare in https://github.com/smol-machines/smolvm/pull/2281\n* Preserve PAX filenames and links containing newlines by @BinSquare in https://github.com/smol-machines/smolvm/pull/2283\n* Relocate checkpoint mounts without losing ownership by @BinSquare in https://github.com/smol-machines/smolvm/pull/2284\n* chore(nix): bump flake to 1.35.4 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/2263\n* Preserve machine ownership across lifecycle and transfer operations by @BinSquare in https://github.com/smol-machines/smolvm/pull/2289\n* Preserve workload dependencies during transfers by @BinSquare in https://github.com/smol-machines/smolvm/pull/2290\n* Unpack image layers whose entries use absolute paths by @BinSquare in https://github.com/smol-machines/smolvm/pull/2291\n* Keep the vendored tar crate's lockfile out of git by @BinSquare in https://github.com/smol-machines/smolvm/pull/2292\n* Clear every networking request when machine update turns the network off by @BinSquare in https://github.com/smol-machines/smolvm/pull/2307\n* Keep artifacts from naming a host directory as their image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2302\n* Match an IPv4-mapped IPv6 destination against the watchlist as its IPv4 form by @BinSquare in https://github.com/smol-machines/smolvm/pull/2305\n* Learn allowed addresses only from a successful answer to a plain DNS query by @BinSquare in https://github.com/smol-machines/smolvm/pull/2306\n* Floor multicast and reserved addresses under the private and strict egress floors by @BinSquare in https://github.com/smol-machines/smolvm/pull/2304\n* Hold a gateway flow to the full egress policy on the loopback address it reaches by @BinSquare in https://github.com/smol-machines/smolvm/pull/2295\n* Attach a restored checkpoint's host mounts only where the user names them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2301\n* Give a pack entry its mode and owner where it landed, never through a link by @BinSquare in https://github.com/smol-machines/smolvm/pull/2297\n* Refuse a checkpoint disk listed as raw that is a qcow2 image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2299\n* Attach a packed run's disks as raw instead of trusting their header by @BinSquare in https://github.com/smol-machines/smolvm/pull/2293\n* Refuse to attach a disk whose qcow2 header names another file by @BinSquare in https://github.com/smol-machines/smolvm/pull/2296\n* Attach the pod share to the sandbox VM read-only by @BinSquare in https://github.com/smol-machines/smolvm/pull/2294\n* Refuse a restored checkpoint's egress policy when its own entries reach the host by @BinSquare in https://github.com/smol-machines/smolvm/pull/2300\n* Preserve sparse disk copies and APFS archive holes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2310\n* Bind workload previews to image and machine identities by @BinSquare in https://github.com/smol-machines/smolvm/pull/2309\n* Keep this host's registry logins out of pulls for an artifact-chosen image by @BinSquare in https://github.com/smol-machines/smolvm/pull/2303\n* Treat a branch or fork request's secret refs as untrusted, like every HTTP request by @BinSquare in https://github.com/smol-machines/smolvm/pull/2311\n* Refuse symlinks among a pack's or checkpoint's own files, and non-file objects on export by @BinSquare in https://github.com/smol-machines/smolvm/pull/2313\n* Recover container cleanup across workload transfer cancellation by @BinSquare in https://github.com/smol-machines/smolvm/pull/2312\n* Check that the bundled guest kernels are built with gcc by @josmo in https://github.com/smol-machines/smolvm/pull/2308\n* Bring the installer header, default memory text and docs/llms.txt up to date by @NickyHeC in https://github.com/smol-machines/smolvm/pull/2273\n* Fix the Windows native test build by @BinSquare in https://github.com/smol-machines/smolvm/pull/2318\n* Pin libkrun so branches are not charged twice for their base's untouched memory by @BinSquare in https://github.com/smol-machines/smolvm/pull/2317\n* Show a Windows interactive session's output without waiting for a keypress by @BinSquare in https://github.com/smol-machines/smolvm/pull/2246\n* Allow checkpoint restores to override egress policy by @NickyHeC in https://github.com/smol-machines/smolvm/pull/2280\n* Refuse API requests that web pages send from origins that are not allowed by @BinSquare in https://github.com/smol-machines/smolvm/pull/2319\n* Serve a packed machine's published ports without turning on egress by @BinSquare in https://github.com/smol-machines/smolvm/pull/2320\n* Present the restore's registry token only to registries the server is configured for by @BinSquare in https://github.com/smol-machines/smolvm/pull/2321\n* Check checkpoint lineage ids and tie restored trees to the checkpoint they came from by @BinSquare in https://github.com/smol-machines/smolvm/pull/2322\n* Fetch a run's image on the host instead of opening its registry to the workload by @BinSquare in https://github.com/smol-machines/smolvm/pull/2323\n* Run an init bake under the run's private-range floor and deny rules by @BinSquare in https://github.com/smol-machines/smolvm/pull/2324\n* Keep a machine's egress interceptor requirement across a checkpoint restore by @BinSquare in https://github.com/smol-machines/smolvm/pull/2325\n* Share a staged mount's host directory with the guest read-only by @BinSquare in https://github.com/smol-machines/smolvm/pull/2326\n* Mount a pod share nodev,nosuid so copied device nodes stay inert on the host by @BinSquare in https://github.com/smol-machines/smolvm/pull/2331\n* Have the boot helper refuse a boot config the launcher did not write by @BinSquare in https://github.com/smol-machines/smolvm/pull/2330\n* Rotate machine logs without following a link the machine directory's owner planted by @BinSquare in https://github.com/smol-machines/smolvm/pull/2332\n* Stage each agent rootfs install in a tree of its own by @BinSquare in https://github.com/smol-machines/smolvm/pull/2328\n* Read a fork disk chain's layer formats from what the host declared by @BinSquare in https://github.com/smol-machines/smolvm/pull/2327\n* Keep an in-guest pull's registry login in memory, never on the storage disk by @BinSquare in https://github.com/smol-machines/smolvm/pull/2329\n* Hold a reference's tag and registry host to the characters a registry URL allows by @BinSquare in https://github.com/smol-machines/smolvm/pull/2333\n* Serve a cached pack only to a caller the registry authorizes for that repository by @BinSquare in https://github.com/smol-machines/smolvm/pull/2334\n* Give API commands the secrets the machine's record grants, not a stale entry's by @BinSquare in https://github.com/smol-machines/smolvm/pull/2335\n* Floor the clouds' IPv6 metadata endpoints in every egress mode by @BinSquare in https://github.com/smol-machines/smolvm/pull/2336\n* Keep a registry's token realm and redirects off the host's own and private addresses by @BinSquare in https://github.com/smol-machines/smolvm/pull/2337\n* Contain Docker and OCI image archive references by @BinSquare in https://github.com/smol-machines/smolvm/pull/2212\n* Refuse a tenant image on a private registry, as a tenant registryRef already is by @BinSquare in https://github.com/smol-machines/smolvm/pull/2338\n* Accept a display WebSocket only from the display's own page by @BinSquare in https://github.com/smol-machines/smolvm/pull/2340\n* Refuse credential hosts a URL parser reads as an IPv4 address by @BinSquare in https://github.com/smol-machines/smolvm/pull/2339\n* Run image init without reading the host keyboard by @BinSquare in https://github.com/smol-machines/smolvm/pull/2192\n* Resume a paused machine on the same host without decoding its artifact by @BinSquare in https://github.com/smol-machines/smolvm/pull/2085\n* Let a machine whose guest cannot confirm shutdown still be deleted by @BinSquare in https://github.com/smol-machines/smolvm/pull/2151\n* Restore read-only checkpoint files from cloned cache entries by @BinSquare in https://github.com/smol-machines/smolvm/pull/2217\n* Name the OS error when a checkpoint or layer entry fails to unpack by @BinSquare in https://github.com/smol-machines/smolvm/pull/2068\n* Preserve Docker container filesystem lifetime by @BinSquare in https://github.com/smol-machines/smolvm/pull/2213\n* Follow a machine's shared pack pointer only to a shared extraction by @BinSquare in https://github.com/smol-machines/smolvm/pull/2341\n* Check a carried agent rootfs's digest before it reaches the store by @BinSquare in https://github.com/smol-machines/smolvm/pull/2342\n* Adopt only indexed checkpoint objects that hash to their names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2344\n* Publish a pause's kept-resume record whole, so a resume never reads it half-written by @BinSquare in https://github.com/smol-machines/smolvm/pull/2345\n* Refuse a launch whose mount source now resolves to a protected path by @BinSquare in https://github.com/smol-machines/smolvm/pull/2346\n* Hand out a per-VM uid only once no process still runs as it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2347\n* Keep per-machine ready markers out of the rootfs every guest shares by @BinSquare in https://github.com/smol-machines/smolvm/pull/2350\n* Revoke the share the host attached for a detached path, not the one the guest names by @BinSquare in https://github.com/smol-machines/smolvm/pull/2343\n* Walk a machine directory by descriptor when handing it to the VM's uid by @BinSquare in https://github.com/smol-machines/smolvm/pull/2348\n* Record the disk backings root attaches and report chains that name any other by @BinSquare in https://github.com/smol-machines/smolvm/pull/2351\n* Add and remove credential bindings on a running machine, with a name-constrained CA of its own for each new host by @BinSquare in https://github.com/smol-machines/smolvm/pull/2265\n* Reach the host's local services by default on your own computer by @BinSquare in https://github.com/smol-machines/smolvm/pull/2352\n* Prepare SmolVM v1.36.0 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2353\n* Let embedders change a machine's credential bindings, and fix live trust for a new host by @BinSquare in https://github.com/smol-machines/smolvm/pull/2356\n* Check the resize suite against the \"Resized machine\" summary the CLI prints by @connorburgess in https://github.com/smol-machines/smolvm/pull/2315\n* Prepare SmolVM v1.36.1 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2358\n* Check in the serve API's OpenAPI spec and fail when it is stale by @BinSquare in https://github.com/smol-machines/smolvm/pull/2361\n* Change a running machine's environment with machine update -e and PUT /api/v1/machines/:name/env by @BinSquare in https://github.com/smol-machines/smolvm/pull/2360\n* Take exec requests in the cloud API's names and shapes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2362\n* Serve PATCH labels and GET metrics in the cloud API's shapes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2364\n* Replace a machine's egress policy with PUT network in the cloud API's 