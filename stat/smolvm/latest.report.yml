:"RA_kwDOQrXKJc4plfaX","name":"smolvm-1.33.0-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":49105006,"digest":"sha256:97e0c64d50abc407499802daa6c849ac010ef29d44e1d97664d8a78067927274","download_count":5,"created_at":"2026-11-01T07:54:33Z","updated_at":"2026-11-01T07:54:35Z"},{"id":697693846,"node_id":"RA_kwDOQrXKJc4plfaW","name":"smolvm-1.33.0-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44908834,"digest":"sha256:f1734b45c0f713509f2e37c8644f5e618179033d220cb9a544dfb077248c3083","download_count":0,"created_at":"2026-11-01T07:54:33Z","updated_at":"2026-11-01T07:54:35Z"}],"body":"## What's Changed\n* chore(nix): bump flake to 1.32.2 by @github-actions[bot] in https://github.com/smol-machines/smolvm/pull/1983\n* Require that no commit, commit author or PR text credits an AI tool by @BinSquare in https://github.com/smol-machines/smolvm/pull/1991\n* Expose the VM's DMA-BUF heaps to containers so Android can allocate graphics buffers by @BinSquare in https://github.com/smol-machines/smolvm/pull/1992\n* Bump libkrunfw with the Android kernel options and the TSI socket fixes by @BinSquare in https://github.com/smol-machines/smolvm/pull/1993\n* Seed private registry images whose credentials arrive with the start by @BinSquare in https://github.com/smol-machines/smolvm/pull/1984\n* Give a checkpoint started during another one its share of workers by @BinSquare in https://github.com/smol-machines/smolvm/pull/1990\n* Bump zstd to 0.14.3 to clear four security advisories by @BinSquare in https://github.com/smol-machines/smolvm/pull/1997\n* Run the macOS CI job on our own Mac mini and keep its target/ between runs by @BinSquare in https://github.com/smol-machines/smolvm/pull/1999\n* Fix Docker socket forwarding into workload namespaces by @horjulf in https://github.com/smol-machines/smolvm/pull/1998\n* Remove an ephemeral `machine run`'s data directory when the run fails before its VM starts by @RitikaxG in https://github.com/smol-machines/smolvm/pull/1996\n* Let a frozen branch source stop once every branch of it is stopped by @BinSquare in https://github.com/smol-machines/smolvm/pull/2003\n* Run the Linux x86_64 CI job on our own MS-A2, keeping target/ between runs by @BinSquare in https://github.com/smol-machines/smolvm/pull/2005\n* Make the usage journal and engine-binary tests independent of tests running beside them by @BinSquare in https://github.com/smol-machines/smolvm/pull/2007\n* Cache per-VMM PSS samples so the machine list stays fast by @BinSquare in https://github.com/smol-machines/smolvm/pull/2015\n* Add a live fractional CPU limit on a running machine and a per-machine open-flow summary to the machine list by @BinSquare in https://github.com/smol-machines/smolvm/pull/2011\n* Let API machine create request disk volumes by @BinSquare in https://github.com/smol-machines/smolvm/pull/2018\n* Agent rootfs to alpine 3.24 by @nwp90 in https://github.com/smol-machines/smolvm/pull/2017\n* Clear the per-VM egress counter at VMM launch so a restarted machine never reports the previous run's total by @BinSquare in https://github.com/smol-machines/smolvm/pull/2016\n* Grow a stopped machine's grown disks online at boot so the next start keeps its storage mounted by @BinSquare in https://github.com/smol-machines/smolvm/pull/2019\n* Bump libkrun to 2b0b86da so overlayfs copy-up origins from an earlier boot no longer alias another file by @BinSquare in https://github.com/smol-machines/smolvm/pull/2020\n* Run the Linux x86_64 CI job on smol machines and restore the cargo cache on cold smol runners by @BinSquare in https://github.com/smol-machines/smolvm/pull/2022\n* ci: restore the cargo cache on every smol run instead of skipping it on SMOL_WARM by @BinSquare in https://github.com/smol-machines/smolvm/pull/2023\n* Bump libkrunfw so a virtio NIC's rx-checksumming can be switched off by @BinSquare in https://github.com/smol-machines/smolvm/pull/2026\n* Keep a machine's /tmp on its root filesystem by @BinSquare in https://github.com/smol-machines/smolvm/pull/2025\n* Intercept a range reopened with --allow-private and archive a layer named twice once by @BinSquare in https://github.com/smol-machines/smolvm/pull/2030\n* Boot a restored or resumed machine on the agent rootfs it was captured with by @BinSquare in https://github.com/smol-machines/smolvm/pull/2031\n* Boot a branch on the rootfs its golden runs after a roll installs a new one beside it by @BinSquare in https://github.com/smol-machines/smolvm/pull/2032\n* Bump libkrunfw to the linux-6.18.60 guest kernel for CVE-2026-98432 by @BinSquare in https://github.com/smol-machines/smolvm/pull/2033\n* Describe where /tmp lives, what a rename out of it can reach, and that it never enters a pack by @BinSquare in https://github.com/smol-machines/smolvm/pull/2034\n* Move a boot's previous /tmp aside in one rename, keep the tmpfs when the fresh one cannot be made opaque, and test that a pack leaves /tmp behind by @BinSquare in https://github.com/smol-machines/smolvm/pull/2035\n* Prepare SmolVM v1.33.0 for release by @BinSquare in https://github.com/smol-machines/smolvm/pull/2021\n\n## New Contributors\n* @horjulf made their first contribution in https://github.com/smol-machines/smolvm/pull/1998\n* @nwp90 made their first contribution in https://github.com/smol-machines/smolvm/pull/2017\n\n**Full Changelog**: https://github.com/smol-machines/smolvm/compare/v1.32.2...v1.33.0","mentions_count":4}
