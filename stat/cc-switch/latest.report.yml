","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:eef80a07ddf851c9f5776fb362a042d937c2e24202bf41e491e38bde819a5468","download_count":10621,"created_at":"2026-11-01T15:05:40Z","updated_at":"2026-11-01T15:05:40Z"}],"body":"# CC Switch v4.0.24\n\n本版本在授权中心加了「登录时自动打开浏览器」开关，关掉后登录账号只复制登录链接，由你自己选浏览器打开，适合每个账号用独立浏览器环境的用户。另外修复了 Claude Code、Claude Desktop 经路由用 GPT 6.1 Sol / Terra 时 max 思考档位被降成 xhigh、DeepSeek Harness 选了支持 PDF 输入的模型后第三方供应商全部不显示、WSL 上 CC Switch 启动就退出、Codex 的 Chat 供应商重开「支持思考等级」后思考档位发不出去等问题。4.0 完整的更新内容请见 [v4.0 发布说明](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)。\n\n**[English →](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.24-en.md) | [日本語版 →](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.24-ja.md)**\n\n---\n\n## 新增\n\n### 登录账号时可以只复制链接\n\n以前在授权中心登录账号，一律用系统默认浏览器打开登录页。用 AdsPower 这类工具给每个账号单独开浏览器环境的话，登录会落到错误的浏览器里。\n\n现在授权中心顶部多了「登录时自动打开浏览器」开关，Claude、ChatGPT、Copilot、xAI、Antigravity、Kimi、DeepSeek 账号登录都受它控制，包括在添加供应商表单里发起的登录。关掉后：\n\n- 点登录只把登录链接复制到剪贴板，在你要用的浏览器里打开、登录并同意授权，CC Switch 会自动更新。\n- 需要输入验证码的登录不再自动复制验证码，免得把剪贴板里的链接顶掉。\n- 等待登录时可以点「复制登录链接」再复制一次，打开登录页的按钮不显示。\n\nWindows 上 Claude Code 会自己打开浏览器，开关关掉时 CC Switch 会让它只输出登录链接。\n\n开关默认打开，只记在这台电脑上，不随云同步。\n\n**预设：** A6API 改用新域名 a6api.vip。\n\n---\n\n## 修复\n\n- **Claude Code、Claude Desktop 经路由连 OpenAI 格式的上游、模型是 gpt-6.1-sol 或 gpt-6.1-terra 时，max 思考档位被降成 xhigh 发出**（[#9122](https://github.com/farion1231/cc-switch/issues/9122)）。现在 GPT 5.6 及以后的版本，不带后缀或带 sol、terra、luna、astra 后缀的模型都保留 max；pro、codex、mini 等其他后缀仍按 xhigh 发。\n- **DeepSeek Harness 从拉取到的模型列表里选了支持 PDF 输入的模型后，第三方供应商全部不显示**（[#9116](https://github.com/farion1231/cc-switch/issues/9116)）。DeepSeek Harness 的模型输入类型只认文字和图片，写进去一个 PDF 就会让这一条配置整体失效。现在只写文字和图片。\n- **WSL 上 CC Switch 启动后直接退出，报托盘图标「Permission denied」**（[#9021](https://github.com/farion1231/cc-switch/pull/9021)、[#9020](https://github.com/farion1231/cc-switch/issues/9020)）。Linux 的托盘图标改为放在应用的缓存目录。\n- **Codex 的 Chat 供应商关掉再打开「支持思考等级」后，选的思考档位不再发给上游**（[#8998](https://github.com/farion1231/cc-switch/pull/8998)、[#8954](https://github.com/farion1231/cc-switch/issues/8954)）。GitHub Copilot 等上游因此收不到任何思考档位。以前保存过的供应商不用重新编辑，也会恢复正常。\n- **DeepSeek Harness 的「DeepSeek 官方登录」卡片写着「用 Claude 账号登录」**（[#9058](https://github.com/farion1231/cc-switch/pull/9058)）。现在是「用 DeepSeek 账号登录」。\n\n---\n\n## 致谢\n\n感谢 @gddg（WSL 托盘）、@guishiw（Codex 思考等级）、@iSanae233（DeepSeek 登录文案）的贡献。\n\n感谢 @Xinyu-Li-1997、@clickwzy、@mhsbz、@ggbdpq 报告问题、提供复现信息和修复思路。\n\n完整的技术细节请见 [CHANGELOG](https://github.com/farion1231/cc-switch/blob/main/CHANGELOG.md)。\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":4,"eyes":0},"mentions_count":7}
