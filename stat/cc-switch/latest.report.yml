0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.20-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.20-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n### Oh My Pi\n\nOh My Pi\uff08\u547d\u4ee4\u662f `omp`\uff09\u73b0\u5728\u662f\u4e00\u4e2a\u72ec\u7acb\u7684\u5e94\u7528\uff0c\u6709\u81ea\u5df1\u7684\u4f9b\u5e94\u5546\u3001MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u548c\u4f1a\u8bdd\uff08[#6747](https://github.com/farion1231/cc-switch/pull/6747)\u3001[#8308](https://github.com/farion1231/cc-switch/pull/8308)\uff09\u3002\u914d\u7f6e\u5728 `~/.omp/agent`\uff0c\u7528\u4e86\u547d\u540d profile \u65f6\u5728 `~/.omp/profiles/<\u540d\u79f0>/agent`\uff1b\u4e5f\u53ef\u4ee5\u5728\u8bbe\u7f6e\u91cc\u6539\u6210\u522b\u7684\u76ee\u5f55\u3002\n\n- **\u4f9b\u5e94\u5546\u53ef\u4ee5\u540c\u65f6\u542f\u7528\u3002** \u548c Pi \u4e00\u6837\uff0c\u5361\u7247\u4e0a\u662f\u300c\u542f\u7528\u300d\u300c\u79fb\u9664\u300d\uff0c\u591a\u4e2a\u4f9b\u5e94\u5546\u540c\u65f6\u5199\u8fdb `models.yml`\uff0c\u5728 Oh My Pi \u91cc\u9009\u7528\u3002\u53ea\u6539 CC Switch \u5199\u7684\u90a3\u4e00\u6761\uff0c\u6587\u4ef6\u91cc\u5176\u4ed6\u5185\u5bb9\u539f\u6837\u4fdd\u7559\uff1b\u7528\u4e86 YAML \u951a\u70b9\u3001\u6807\u7b7e\u8fd9\u7c7b\u5199\u6cd5\u7684\u6761\u76ee\u4e0d\u4f1a\u88ab\u91cd\u5199\uff0c\u4f1a\u63d0\u793a\u4f60\u624b\u52a8\u4fee\u6539\u3002\n- **\u5199\u5165\u524d\u6309 Oh My Pi \u7684\u89c4\u5219\u68c0\u67e5\u3002** Oh My Pi \u53ea\u8981\u6709\u4e00\u6761\u4f9b\u5e94\u5546\u4e0d\u5408\u89c4\uff0c\u5c31\u4f1a\u505c\u7528\u6240\u6709\u81ea\u5b9a\u4e49\u4f9b\u5e94\u5546\uff0c\u6240\u4ee5\u586b\u4e86\u5b83\u4e0d\u63a5\u53d7\u7684\u503c\uff0c\u4fdd\u5b58\u65f6\u4f1a\u76f4\u63a5\u63d0\u793a\uff0c\u4e0d\u4f1a\u5199\u8fdb\u53bb\u3002\u53ea\u6709\u65e7\u7248\u7684 `models.json`\u3001\u8fd8\u6ca1\u6709 `models.yml` \u65f6\uff0c\u4f1a\u63d0\u793a\u4f60\u5148\u8fd0\u884c\u4e00\u6b21 `omp`\uff0c\u8ba9\u5b83\u81ea\u5df1\u8fc1\u79fb\uff0c\u4e0d\u4f1a\u65b0\u5efa\u6587\u4ef6\u6324\u6389\u4f60\u539f\u6765\u7684\u4f9b\u5e94\u5546\u3002\n- **\u6dfb\u52a0\u4f9b\u5e94\u5546\u3002** \u8868\u5355\u548c Pi \u5171\u7528\uff0c\u9884\u8bbe\u4e5f\u6765\u81ea Pi \u7684\u76ee\u5f55\uff1b\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u540e\u5728\u5f39\u7a97\u91cc\u52fe\u9009\u6a21\u578b\u3002\u300c\u6a21\u578b\u81ea\u52a8\u53d1\u73b0\u300d\uff08\u8ba9 Oh My Pi \u81ea\u5df1\u53bb\u63a5\u53e3\u67e5\u6709\u54ea\u4e9b\u6a21\u578b\uff09\u548c\u8bf7\u6c42\u5934\u3001\u517c\u5bb9\u9009\u9879\u4e00\u8d77\u653e\u5728\u300c\u9ad8\u7ea7\u9009\u9879\u300d\u91cc\u3002API Key \u53ef\u4ee5\u5199\u73af\u5883\u53d8\u91cf\u540d\uff0c\u67e5\u8be2\u989d\u5ea6\u65f6 CC Switch \u4f1a\u6309 Oh My Pi \u7684\u89c4\u5219\u53d6\u51fa\u5b9e\u9645\u7684\u503c\u3002\n- **MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u3002** MCP \u5199\u8fdb `mcp.json`\uff0cSkills \u88c5\u8fdb Oh My Pi \u81ea\u5df1\u7684\u6280\u80fd\u76ee\u5f55\uff0c\u63d0\u793a\u8bcd\u5199\u8fdb `AGENTS.md`\u3002Oh My Pi \u8fd8\u4f1a\u4ece\u5176\u4ed6\u5de5\u5177\u7684\u76ee\u5f55\u91cc\u627e MCP \u548c\u6280\u80fd\uff0c\u5b9e\u9645\u52a0\u8f7d\u7684\u53ef\u80fd\u6bd4 CC Switch \u91cc\u5217\u51fa\u7684\u591a\uff0cMCP \u548c Skills \u9875 Oh My Pi \u4e00\u5217\u7684\u8bf4\u660e\u91cc\u6709\u89e3\u91ca\u3002\n- **\u4f1a\u8bdd\u3002** \u53ef\u4ee5\u6d4f\u89c8\u548c\u6062\u590d Oh My Pi \u7684\u4f1a\u8bdd\uff0c\u9884\u89c8\u91cc\u80fd\u663e\u793a\u9879\u76ee\u91cc\u7684\u56fe\u7247\u3002\n- **\u300c\u5e94\u7528\u300d\u9875\u7ba1\u7406 Oh My Pi\u3002** \u7528\u5b98\u65b9\u5b89\u88c5\u811a\u672c\u5b89\u88c5\uff08\u88c5\u4e86 Bun \u5c31\u7528 Bun\uff0c\u6ca1\u88c5\u5c31\u4e0b\u8f7d\u5b98\u65b9\u7684\u4e8c\u8fdb\u5236\uff09\uff0c\u5347\u7ea7\u8fd0\u884c `omp update`\uff08\u7528 Homebrew \u88c5\u7684\u4ecd\u7136\u8d70 Homebrew\uff09\uff0c\u53ef\u4ee5\u5378\u8f7d\u3002\n- Oh My Pi \u4e0d\u7ecf\u8fc7\u672c\u5730\u8def\u7531\uff0c\u4e5f\u6682\u4e0d\u7edf\u8ba1\u7528\u91cf\u3002\n\n### \u6258\u7ba1 ChatGPT \u8d26\u53f7\u53ef\u4ee5\u7528\u6d4f\u89c8\u5668\u767b\u5f55\n\n\u5728\u6388\u6743\u4e2d\u5fc3\u6216 Codex \u7684\u4f9b\u5e94\u5546\u8868\u5355\u91cc\u6dfb\u52a0\u6258\u7ba1 ChatGPT \u8d26\u53f7\u65f6\uff0c\u53ef\u4ee5\u5728\u300c\u767b\u5f55\u65b9\u5f0f\u300d\u91cc\u9009\u300c\u6d4f\u89c8\u5668\u767b\u5f55\u300d\uff08[#8288](https://github.com/farion1231/cc-switch/pull/8288)\u3001[#8284](https://github.com/farion1231/cc-switch/issues/8284)\uff09\u3002\u6709\u4e9b\u4f01\u4e1a\u5de5\u4f5c\u533a\u5173\u6389\u4e86\u8bbe\u5907\u4ee3\u7801\u767b\u5f55\uff0c\u8fd9\u4e9b\u8d26\u53f7\u4ee5\u524d\u52a0\u4e0d\u8fdb\u6765\uff1b\u91cd\u65b0\u767b\u5f55\u4e5f\u53ef\u4ee5\u7528\u6d4f\u89c8\u5668\u3002\u300c\u8bbe\u5907\u4ee3\u7801\u767b\u5f55\u300d\u4ecd\u7136\u53ef\u9009\u3002\n\n## \u6539\u8fdb\n\n**\u300c\u5e94\u7528\u300d\u9875\u5206\u6210\u300c\u5df2\u5b89\u88c5\u300d\u300c\u672a\u5b89\u88c5\u300d\u4e24\u7ec4\u3002** \u6bcf\u7ec4\u6807\u9898\u5e26\u6570\u91cf\uff0c\u6ca1\u6709\u5e94\u7528\u7684\u7ec4\u4e0d\u663e\u793a\uff1b\u521a\u6253\u5f00\u3001\u8fd8\u5728\u68c0\u6d4b\u65f6\u5148\u663e\u793a\u4e00\u6574\u5f20\u8868\uff0c\u68c0\u6d4b\u5b8c\u518d\u5206\u7ec4\uff0c\u884c\u4e0d\u4f1a\u4e00\u4e2a\u4e2a\u8df3\u3002Claude Desktop \u6ca1\u6709\u547d\u4ee4\u53ef\u67e5\uff0c\u6309\u662f\u5426\u88c5\u4e86 Desktop \u6765\u5206\u7ec4\uff0c\u884c\u91cc\u7167\u65e7\u5199\u662f\u5426\u5df2\u63a5\u5165 CC Switch\u3002\n\n**\u5df2\u5b89\u88c5\u7684\u5e94\u7528\u53ef\u4ee5\u62d6\u52a8\u6392\u5e8f\u3002** \u9f20\u6807\u79fb\u5230\u67d0\u4e00\u884c\u4e0a\uff0c\u884c\u9996\u4f1a\u51fa\u73b0\u62d6\u52a8\u624b\u67c4\uff0c\u548c\u4f9b\u5e94\u5546\u5361\u7247\u6392\u5e8f\u4e00\u6837\u3002\u4fa7\u680f\u548c\u9ed8\u8ba4\u6253\u5f00\u7684\u5e94\u7528\u90fd\u8ddf\u7740\u8fd9\u4e2a\u987a\u5e8f\uff1b\u987a\u5e8f\u53ea\u5b58\u5728\u672c\u673a\uff0c\u4e0d\u968f\u4e91\u540c\u6b65\u3002\n\n**Kimi \u5b98\u65b9\u8d26\u53f7\u7684\u5361\u7247\u53ef\u4ee5\u7f16\u8f91\u548c\u79fb\u9664\u3002** \u4ee5\u524d\u5b98\u65b9\u5361\u7247\u53ea\u80fd\u5728\u6388\u6743\u4e2d\u5fc3\u7ba1\u7406\uff0c\u6a21\u578b\u505c\u5728\u767b\u5f55\u65f6\u7684\u90a3\u4e00\u4efd\u3002\u73b0\u5728\u53ef\u4ee5\u7f16\u8f91\u5361\u7247\uff1a\u8fde\u63a5\u548c\u767b\u5f55\u4ecd\u7531\u6388\u6743\u4e2d\u5fc3\u7ba1\uff0c\u8fd9\u91cc\u53ea\u6539\u6a21\u578b\uff0c\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u8bfb\u53d6\u8fd9\u4e2a\u8d26\u53f7\u5f53\u524d\u53ef\u7528\u7684\u5b98\u65b9\u6a21\u578b\uff0c\u5e26\u4e0a\u5b98\u65b9\u7684\u4e0a\u4e0b\u6587\u7a97\u53e3\u3001\u80fd\u529b\u548c\u601d\u8003\u6863\u4f4d\u3002\u5b98\u65b9\u5361\u7247\u4e5f\u53ef\u4ee5\u50cf\u5176\u4ed6 Kimi \u4f9b\u5e94\u5546\u4e00\u6837\u4ece Kimi Code \u91cc\u300c\u79fb\u9664\u300d\uff0c\u5361\u7247\u548c\u767b\u5f55\u90fd\u4fdd\u7559\uff0c\u518d\u70b9\u300c\u6dfb\u52a0\u300d\u5c31\u6062\u590d\uff1b\u8981\u5220\u9664\uff0c\u5148\u79fb\u9664\uff0c\u6216\u8005\u5230\u6388\u6743\u4e2d\u5fc3\u5220\u3002\n\n**\u6ca1\u6709 Kimi Code \u5957\u9910\u7684 Kimi \u8d26\u53f7\u663e\u793a\u300c\u672a\u8ba2\u9605\u300d\u3002** \u4ee5\u524d\u6388\u6743\u4e2d\u5fc3\u548c\u5b98\u65b9\u5361\u7247\u7684\u989d\u5ea6\u4e00\u680f\u662f\u7a7a\u7684\uff0c\u770b\u8d77\u6765\u50cf\u67e5\u8be2\u5931\u8d25\u3002\n\n**\u4f59\u989d\u7528\u5b8c\u4e5f\u663e\u793a\u91d1\u989d\u3002** \u4f59\u989d\u4e3a\u96f6\u6216\u6b20\u8d39\u65f6\uff0c\u4f9b\u5e94\u5546\u5361\u7247\u548c\u6258\u76d8\u4ee5\u524d\u53ea\u5199\u300c\u4f59\u989d\u5df2\u7528\u5b8c\u300d\uff0c\u770b\u4e0d\u51fa\u6b20\u4e86\u591a\u5c11\uff0c\u7ea2\u5b57\u4e5f\u548c\u300c\u989d\u5ea6\u67e5\u8be2\u5931\u8d25\u300d\u5206\u4e0d\u6e05\u3002\u73b0\u5728\u4e00\u5f8b\u663e\u793a\u300c\u4f59\u989d <\u91d1\u989d>\u300d\uff0c\u4e3a\u96f6\u6216\u8d1f\u6570\u65f6\u5361\u7247\u4e0a\u6574\u884c\u53d8\u7ea2\u3001\u6258\u76d8\u91cc\u53d8\u6210\u6a59\u8272\uff0c\u548c\u4ee5\u524d\u4e00\u6837\u3002\n\n**\u989d\u5ea6\u67e5\u8be2\u5931\u8d25\u7684\u4e2d\u6587\u63d0\u793a\u6539\u6210\u300c\u989d\u5ea6\u67e5\u8be2\u5931\u8d25\u300d**\uff08\u4ee5\u524d\u662f\u300c\u989d\u5ea6\u6ca1\u67e5\u5230\u300d\uff09\uff0c\u4f9b\u5e94\u5546\u5361\u7247\u3001\u6388\u6743\u4e2d\u5fc3\u548c\u6258\u76d8\u4e00\u8d77\u6539\u3002\n\n**Pi \u83b7\u53d6\u6a21\u578b\u5217\u8868\u540e\u5728\u5f39\u7a97\u91cc\u52fe\u9009\u3002** \u4ee5\u524d\u53ea\u80fd\u9010\u884c\u4ece\u4e0b\u62c9\u6846\u91cc\u9009\uff0c\u73b0\u5728\u548c OpenCode\u3001Codex\u3001Kimi Code \u4e00\u6837\u5f39\u51fa\u5217\u8868\uff0c\u52fe\u9009\u7684\u6a21\u578b\u81ea\u52a8\u52a0\u6210\u4e00\u884c\uff0c\u4ece\u9884\u8bbe\u6216 models.dev \u8865\u4e0a\u53c2\u6570\uff1b\u53d6\u6d88\u52fe\u9009\u4f1a\u5220\u6389\u5bf9\u5e94\u7684\u884c\u3002\u9010\u884c\u7684\u4e0b\u62c9\u6846\u8fd8\u5728\u3002\n\n**Pi \u7684\u8bf7\u6c42\u5934\u548c\u517c\u5bb9\u9009\u9879\u6536\u8fdb\u300c\u9ad8\u7ea7\u9009\u9879\u300d\u3002** \u9ed8\u8ba4\u6536\u8d77\uff0c\u548c Claude Code\u3001Codex \u7684\u8868\u5355\u4e00\u81f4\uff1b\u517c\u5bb9\u9009\u9879\u7684\u8bf4\u660e\u6539\u6210\u4e86\u767d\u8bdd\u3002\n\n**Claude Code\u3001Claude Desktop \u9009 GitHub Copilot \u4f9b\u5e94\u5546\u65f6\uff0c\u4e0a\u6e38\u683c\u5f0f\u663e\u793a\u4e3a\u300c\u7531\u8def\u7531\u6309\u6a21\u578b\u81ea\u52a8\u9009\u62e9\u300d**\uff08[#8196](https://github.com/farion1231/cc-switch/pull/8196)\u3001[#8195](https://github.com/farion1231/cc-switch/issues/8195)\uff09\u3002Copilot \u7684\u4e0a\u6e38\u683c\u5f0f\u672c\u6765\u5c31\u6309\u6a21\u578b\u81ea\u52a8\u9009\uff0c\u4ee5\u524d\u8868\u5355\u91cc\u8fd8\u80fd\u624b\u9009\uff0c\u9009\u4e86\u4e5f\u4e0d\u751f\u6548\u3002\n\n**\u7528\u91cf\u9875\u660e\u7ec6\u9875\u7b7e\u7684\u6570\u91cf\u4e00\u6b21\u5168\u663e\u793a\u3002** \u4ee5\u524d\u300c\u6a21\u578b\u300d\u9875\u7b7e\u8981\u70b9\u5f00\u624d\u6709\u6570\u91cf\uff0c\u5207\u6362\u5e94\u7528\u65f6\u4e09\u4e2a\u6570\u91cf\u4f1a\u6d88\u5931\u518d\u51fa\u73b0\uff0c\u9875\u7b7e\u680f\u8ddf\u7740\u8df3\u3002\n\n**\u4ef7\u683c\u8868\u65b0\u589e Kimi K3.1 Pro \u548c K3.1 Pro HighSpeed\u3002**\n\n**\u571f\u8033\u5176\u8bed\u7ffb\u8bd1\u8865\u5168**\uff08[#8616](https://github.com/farion1231/cc-switch/pull/8616)\uff09\u3002\n\n**\u9884\u8bbe\uff1a** \u5404\u5bb6\u9884\u8bbe\u7684\u6a21\u578b\u66f4\u65b0\u5230\u5f53\u524d\u7684\u6700\u65b0\u578b\u53f7\uff0c\u586b\u4e0a Key \u5c31\u80fd\u7528\u3002\n\n## \u4fee\u590d\n\n- **DeepSeek \u4f59\u989d\u4e3a\u96f6\u6216\u6b20\u8d39\u65f6\uff0c\u5361\u7247\u548c\u6258\u76d8\u663e\u793a\u300c\u5957\u9910\u5df2\u8fc7\u671f\u300d\uff0c\u4f59\u989d\u6570\u5b57\u4e0d\u89c1\u4e86**\uff08[#8812](https://github.com/farion1231/cc-switch/issues/8812)\uff09\u3002DeepSeek \u8fd4\u56de\u7684\u300c\u662f\u5426\u53ef\u7528\u300d\u53ea\u8868\u793a\u4f59\u989d\u591f\u4e0d\u591f\u8c03\u7528\uff0c\u4f59\u989d\u4e00\u5230\u96f6\u5c31\u53d8\u6210\u5426\uff0cKey \u672c\u8eab\u4ecd\u7136\u6709\u6548\u3002\u73b0\u5728\u7167\u5e38\u663e\u793a\u4f59\u989d\uff1bKey \u771f\u7684\u5931\u6548\u65f6\uff0c\u4ecd\u6309\u8ba4\u8bc1\u5931\u8d25\u63d0\u793a\u3002\n- **Kimi Code \u5b50\u4ee3\u7406\u7684\u7528\u91cf\u6ca1\u6709\u7edf\u8ba1\u8fdb\u6765**\uff08[#8792](https://github.com/farion1231/cc-switch/issues/8792)\uff09\u3002Kimi Code \u628a\u6bcf\u4e2a\u5b50\u4ee3\u7406\u7684\u8bb0\u5f55\u5199\u5728\u5355\u72ec\u7684\u6587\u4ef6\u91cc\uff0c\u4ee5\u524d\u53ea\u8bfb\u4e86\u4e3b\u4ee3\u7406\u7684\u90a3\u4efd\u3002\u73b0\u5728\u6bcf\u4e2a\u5b50\u4ee3\u7406\u90fd\u4f1a\u5bfc\u5165\uff0c\u6309\u6bcf\u6b21\u8c03\u7528\u8bb0\u8d26\uff0c\u4e0d\u4f1a\u548c\u4e3b\u4ee3\u7406\u7684\u6c47\u603b\u91cd\u590d\u8ba1\u7b97\u3002\n- **Antigravity \u5b50\u4ee3\u7406\u548c ACP \u4f1a\u8bdd\u7684\u7528\u91cf\u8bb0\u6210\u672a\u77e5\u6a21\u578b**\uff08[#8693](https://github.com/farion1231/cc-switch/pull/8693)\uff09\u3002\u73b0\u5728\u4ece agy \u672c\u5730\u7684\u5bf9\u8bdd\u6570\u636e\u5e93\u91cc\u627e\u56de\u6a21\u578b\uff08\u53ea\u8bfb\uff0c\u4e0d\u4f1a\u7b49 agy \u5199\u5b8c\uff09\u3002\n- **Skills \u5b89\u88c5\u6216\u66f4\u65b0\u4e00\u76f4\u62a5 HTTP 429**\uff08[#8813](https://github.com/farion1231/cc-switch/issues/8813)\uff09\u3002\u4e0b\u8f7d GitHub \u4ed3\u5e93\u538b\u7f29\u5305\u65f6\u6ca1\u5e26 User-Agent\uff0cGitHub \u5bf9\u8fd9\u7c7b\u8bf7\u6c42\u9650\u6d41\u66f4\u4e25\uff0c\u591a\u4eba\u5171\u7528\u4e00\u4e2a\u51fa\u53e3 IP \u65f6\u66f4\u5bb9\u6613\u78b0\u5230\u3002\u73b0\u5728\u4f1a\u5e26\u4e0a `CC-Switch/<version>`\u3002\n- **Pi \u7684 API Key \u5199\u6210 `$NAME`\u3001`${NAME}` \u8fd9\u7c7b\u73af\u5883\u53d8\u91cf\u5f15\u7528\u65f6\uff0c\u989d\u5ea6\u548c\u4f59\u989d\u67e5\u8be2\u62a5 401**\uff08[#8822](https://github.com/farion1231/cc-switch/issues/8822)\uff09\u3002\u4ee5\u524d\u628a\u5f15\u7528\u539f\u6837\u5f53\u6210 Key \u53d1\u51fa\u53bb\uff0c\u73b0\u5728\u6309 Pi \u7684\u89c4\u5219\u53d6\u51fa\u53d8\u91cf\u7684\u503c\uff1b\u53d8\u91cf\u6ca1\u8bbe\u7f6e\u65f6\uff0c\u4e5f\u4e0d\u4f1a\u518d\u628a\u5f15\u7528\u5f53\u6210 Key \u53d1\u51fa\u53bb\u3002`!command` \u5f62\u5f0f\u7684 Key\uff0cCC Switch \u4ecd\u7136\u4e0d\u4f1a\u6267\u884c\u3002\u53d6\u51fa\u7684\u503c\u53ea\u7528\u4e8e\u8fd9\u6b21\u67e5\u8be2\uff0c\u4e0d\u5199\u56de\u914d\u7f6e\u3002\n- **Claude Code \u4f1a\u8bdd\u5728\u4f1a\u8bdd\u7ba1\u7406\u91cc\u7684\u6807\u9898\u663e\u793a\u6210 `<local-command-stdout>Set model to opus</local-command-stdout>`**\uff08[#8799](https://github.com/farion1231/cc-switch/pull/8799)\u3001[#8798](https://github.com/farion1231/cc-switch/issues/8798)\uff09\u3002\u4f1a\u8bdd\u4e00\u5f00\u5934\u8fd0\u884c\u4e86 `/model`\u3001`/effort` \u8fd9\u7c7b\u672c\u5730\u547d\u4ee4\u65f6\uff0c\u6807\u9898\u4f1a\u8fd9\u6837\uff1b\u6700\u540e\u8fd0\u884c\u4e86\u672c\u5730\u547d\u4ee4\u65f6\uff0c\u5217\u8868\u91cc\u663e\u793a\u7684\u6700\u540e\u4e00\u6761\u6d88\u606f\u4e5f\u662f\u547d\u4ee4\u8f93\u51fa\u3002\u73b0\u5728\u4f1a\u8df3\u8fc7\u8fd9\u4e9b\u8bb0\u5f55\u3002\n- **Linux \u4e0a\u5f00\u542f\u300c\u542f\u7528\u5e94\u7528\u7ea7\u7a97\u53e3\u6309\u94ae\u300d\u540e\uff0c\u9875\u5934\u62d6\u4e0d\u52a8\u7a97\u53e3\uff0c\u7a97\u53e3\u8fb9\u7f18\u4e5f\u6ca1\u6709\u7f29\u653e\u5149\u6807**\uff08[#8092](https://github.com/farion1231/cc-switch/pull/8092)\u3001[#8091](https://github.com/farion1231/cc-switch/issues/8091)\uff09\u3002\n- **Codex \u7ecf Chat \u4e0a\u6e38\u65f6\uff0c\u5e26\u56fe\u7247\u7684\u5b64\u7acb\u5de5\u5177\u7ed3\u679c\u91cc\uff0c\u5360\u4f4d\u6587\u5b57\u8bf4\u56fe\u7247\u5728\u300c\u4e0b\u4e00\u6761\u6d88\u606f\u300d\u91cc\uff0c\u5b9e\u9645\u5e76\u6ca1\u6709\u8fd9\u6761\u6d88\u606f**\uff08[#8157](https://github.com/farion1231/cc-switch/pull/8157)\uff09\u3002\u73b0\u5728\u6539\u6210\u8bf4\u56fe\u7247\u5df2\u7ecf\u4f5c\u4e3a\u56fe\u7247\u9644\u4e0a\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7248\u672c\u4ece 22 \u5347\u5230 23**\uff0c\u4e3a MCP \u589e\u52a0 Oh My Pi \u7684\u5f00\u5173\u3002\u5347\u7ea7\u524d\u4f1a\u81ea\u52a8\u5907\u4efd\u6570\u636e\u5e93\uff1b\u5347\u7ea7\u540e\u518d\u9000\u56de\u65e7\u7248\u672c\uff0c\u65e7\u7248\u672c\u4f1a\u63d0\u793a\u6570\u636e\u5e93\u7248\u672c\u8fc7\u65b0\uff0c\u6253\u4e0d\u5f00\u3002\n\n- Oh My Pi \u9ed8\u8ba4\u663e\u793a\u5728\u4fa7\u680f\uff0c\u4e0d\u7528\u7684\u8bdd\u53ef\u4ee5\u5728\u300c\u5e94\u7528\u300d\u9875\u5173\u6389\u300c\u5728\u4fa7\u680f\u663e\u793a Oh My Pi\u300d\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @JackieJK\u3001@allenxu09\uff08Oh My Pi \u652f\u6301\uff09\u3001@Llugaes\uff08ChatGPT \u8d26\u53f7\u6d4f\u89c8\u5668\u767b\u5f55\uff09\u3001@dsdbb520\uff08Antigravity \u5b50\u4ee3\u7406\u7528\u91cf\uff09\u3001@L4XB\uff08Claude Code \u4f1a\u8bdd\u6807\u9898\uff09\u3001@vianrina\uff08Linux \u7a97\u53e3\u62d6\u52a8\uff09\u3001@Railgun-wiki\uff08Copilot \u4e0a\u6e38\u683c\u5f0f\uff09\u3001@NeeYoonc\uff08\u5b64\u7acb\u5de5\u5177\u7ed3\u679c\u7684\u56fe\u7247\u5360\u4f4d\uff09\u3001@alkank\uff08\u571f\u803