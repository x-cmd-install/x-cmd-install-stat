","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:3097c2cd4fdd8337e482a0a2edee1f7f792b9c6531a85f26e4bd6128f8c4b62d","download_count":15332,"created_at":"2026-10-19T10:46:36Z","updated_at":"2026-10-19T10:46:37Z"}],"body":"# CC Switch v4.0.16\n\n\u672c\u7248\u672c\u628a\u6258\u76d8\u6539\u4e3a\u5feb\u6377\u9762\u677f\uff0c\u5e76\u4fee\u590d\u4e86\u4e00\u6279 Codex \u4e0e\u8def\u7531\u95ee\u9898\u3002\u73b0\u5728\u70b9\u6258\u76d8\u56fe\u6807\u4f1a\u5f39\u51fa\u9762\u677f\uff0c\u80fd\u770b\u5230\u5404\u5e94\u7528\u6b63\u5728\u7528\u7684\u4f9b\u5e94\u5546\u3001\u6a21\u5f0f\u3001\u989d\u5ea6\u548c\u7528\u91cf\uff0c\u4e5f\u80fd\u76f4\u63a5\u641c\u7d22\u3001\u5207\u6362\u4f9b\u5e94\u5546\uff1b\u60f3\u7528\u539f\u6765\u7684\u83dc\u5355\uff0c\u53ef\u4ee5\u5728\u300c\u8bbe\u7f6e \u2192 \u901a\u7528 \u2192 \u6258\u76d8\u6837\u5f0f\u300d\u91cc\u6362\u56de\u3002Codex \u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u4f1a\u8bdd\u5728\u9ed8\u8ba4\u4f9b\u5e94\u5546\u548c\u5176\u4ed6\u6210\u5458\u4e4b\u95f4\u5207\u6362\u540e\u4e0d\u4f1a\u518d\u5361\u5728\u539f\u6765\u90a3\u5bb6\u53cd\u590d\u538b\u7f29\u5931\u8d25\uff1bCodex \u8d70\u8def\u7531\u65f6\uff0c\u6bcf\u6b21\u91cd\u542f CC Switch \u90fd\u8981\u91cd\u65b0\u767b\u5f55 ChatGPT \u7684\u95ee\u9898\u4e5f\u5df2\u4fee\u590d\u3002Codex \u7ecf\u8def\u7531\u8fde Chat \u4e0a\u6e38\u65f6\uff0c\u5e76\u884c\u5de5\u5177\u7ed3\u679c\u4e0d\u518d\u88ab\u4e2d\u9014\u63d2\u5165\u7684\u63d0\u793a\u62c6\u5f00\u3001\u62a5 400\uff1b\u81ea\u5df1\u586b\u7684 GPT \u4e0a\u4e0b\u6587\u7a97\u53e3\u5bf9\u5b98\u65b9\u540c\u540d\u6a21\u578b\u4e5f\u751f\u6548\u4e86\uff0c4.0.13 \u52a0\u7684 272K \u5c01\u9876\u6539\u4e3a\u53ea\u9650\u5236\u501f\u7528\u539f\u5382\u6570\u636e\u7684\u7a97\u53e3\u3002\u4e0a\u6e38\u662f 5.5 \u6a21\u578b\u65f6\uff0cClaude Code \u8def\u7531\u548c Claude Desktop \u8def\u7531\u6a21\u5f0f\u90fd\u6539\u7528 5.5 \u7684\u6a21\u578b ID\u3002\u53e6\u5916\u4fee\u590d\u4e86\u667a\u8c31\u6309\u91cf\u4ed8\u8d39\u8d26\u53f7\u663e\u793a\u300c\u989d\u5ea6\u6ca1\u67e5\u5230\u300d\u3001\u65b0\u5efa\u7684\u706b\u5c71\u5957\u9910\u5361\u7247\u989d\u5ea6\u76f4\u63a5\u62a5\u9519\u3001Windows \u4e0a\u8ba4\u4e0d\u51fa fnm \u7ba1\u7406\u7684 Node \u5de5\u5177\u3001\u7a7a\u95f2\u7684\u5361\u7247\u5220\u4e0d\u6389\u3001\u7f16\u8f91\u4f9b\u5e94\u5546\u65f6\u300c\u83b7\u53d6 API Key\u300d\u94fe\u63a5\u4e0d\u89c1\u7b49\u95ee\u9898\uff0cmacOS \u56fe\u6807\u5e95\u8272\u4e5f\u6539\u6210\u4e86\u67d4\u548c\u7684\u6d45\u7070\u3002OpenCode \u7684\u5361\u7247\u73b0\u5728\u53ef\u4ee5\u8bbe\u4e3a OpenCode \u7684\u9ed8\u8ba4\u6a21\u578b\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.16-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.16-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u6258\u76d8\u6539\u4e3a\u5feb\u6377\u9762\u677f**\uff08[#8432](https://github.com/farion1231/cc-switch/pull/8432)\uff09\u3002\u5728 macOS \u548c Windows \u4e0a\uff0c\u70b9\u6258\u76d8\u56fe\u6807\u73b0\u5728\u4f1a\u5f39\u51fa\u5feb\u6377\u9762\u677f\uff1a\u300c\u914d\u7f6e\u300d\u9875\u5217\u51fa\u5404\u5e94\u7528\u6b63\u5728\u7528\u7684\u4f9b\u5e94\u5546\u3001\u5f53\u524d\u6a21\u5f0f\uff08\u76f4\u8fde\u3001\u8def\u7531\u3001\u805a\u5408\u7528\u548c\u4e3b\u754c\u9762\u76f8\u540c\u7684\u989c\u8272\uff09\u548c\u989d\u5ea6\uff0c\u53ef\u4ee5\u641c\u7d22\u3001\u5207\u6362\u4f9b\u5e94\u5546\uff1b\u300c\u7528\u91cf\u300d\u9875\u7684\u8d8b\u52bf\u56fe\u8ddf\u968f\u4e3b\u754c\u9762\u9009\u7684\u5e01\u79cd\u548c\u56fe\u8868\u6837\u5f0f\u3002macOS \u4e0a\u662f\u7cfb\u7edf\u6bdb\u73bb\u7483\uff0c\u53e0\u5728\u6df1\u8272\u7a97\u53e3\u4e0a\u4e5f\u770b\u5f97\u6e05\uff1bWindows \u4e0a\u662f\u4e0d\u900f\u660e\u5361\u7247\u3002\u60f3\u7528\u539f\u6765\u7684\u83dc\u5355\uff0c\u53ef\u4ee5\u5728\u300c\u8bbe\u7f6e \u2192 \u901a\u7528 \u2192 \u7a97\u53e3\u4e0e\u7ec8\u7aef\u300d\u7684\u300c\u6258\u76d8\u6837\u5f0f\u300d\u91cc\u9009\u300c\u83dc\u5355\u300d\uff0c\u7acb\u5373\u751f\u6548\uff0c\u4e0d\u7528\u91cd\u542f\u3002Linux \u4ecd\u662f\u539f\u751f\u83dc\u5355\uff0c\u6700\u4e0a\u9762\u591a\u4e86\u4e00\u9879\u300c\u6253\u5f00\u5feb\u6377\u9762\u677f\u300d\u3002\n\n**OpenCode \u5361\u7247\u53ef\u4ee5\u8bbe\u4e3a\u9ed8\u8ba4\u6a21\u578b**\uff08[#8509](https://github.com/farion1231/cc-switch/issues/8509)\uff09\u3002OpenCode \u542f\u52a8\u65f6\u6309 `opencode.json` \u9876\u5c42\u7684 `model` \u9009\u6a21\u578b\uff0c\u4ee5\u524d CC Switch \u6ca1\u6cd5\u8bbe\u7f6e\uff0c\u53ea\u80fd\u624b\u6539\u6587\u4ef6\u3002\u73b0\u5728\u5df2\u6dfb\u52a0\u7684 OpenCode \u5361\u7247\u4e0a\u6709\u300c\u8bbe\u4e3a\u9ed8\u8ba4\u300d\uff0c\u9009\u4e00\u4e2a\u6a21\u578b\u5373\u53ef\uff1b\u53ea\u6539\u9876\u5c42\u7684 `model`\uff0c\u6ce8\u91ca\u548c `small_model` \u539f\u6837\u4fdd\u7559\u3002\n\n## \u6539\u8fdb\n\n**MiniMax \u5b98\u65b9\u9884\u8bbe\u9ed8\u8ba4\u7528 MiniMax-M3.1-Flash**\uff08[#8518](https://github.com/farion1231/cc-switch/pull/8518)\uff09\u3002Claude Code\u3001Claude Desktop\u3001Codex\u3001Hermes\u3001OpenCode\u3001OpenClaw\u3001Pi \u90fd\u5df2\u66f4\u65b0\uff0cMiniMax-M3 \u4ecd\u53ef\u9009\u62e9\u3002\n\n**\u300c\u83b7\u53d6 API Key\u300d\u94fe\u63a5\u6062\u590d\u4e3a\u6d45\u84dd\u8272**\uff0c\u4e0d\u518d\u5e26\u4e0b\u5212\u7ebf\u3002\n\n**\u4fa7\u680f\u300c\u4eca\u65e5\u300d\u6062\u590d\u300c\u4eca\u65e5\u300d\u524d\u7f00**\uff0c\u64a4\u56de 4.0.15 \u7684\u6539\u52a8\u3002\n\n**\u4ef7\u683c\u66f4\u65b0**\uff1aKimi K3 \u8865\u4e0a\u7f13\u5b58\u5199\u5165\u4ef7\uff08\u6bcf\u767e\u4e07 Token 3 \u7f8e\u5143\uff0c\u539f\u6765\u8bb0\u6210 0\uff09\uff1bStep 5 Preview \u7684\u7f13\u5b58\u8bfb\u53d6\u4ef7\u6309\u9636\u8dc3\u661f\u8fb0 10 \u6708 14 \u65e5\u7684\u8c03\u4ef7\u6539\u4e3a\u6bcf\u767e\u4e07 Token 0.70 \u5143\uff1b\u65b0\u589e qwen3.7-flash\u3001qwen3.6-27b\u3001qwen3.8-omni-flash \u7684\u4ef7\u683c\u3002\u8fd9\u4e24\u9879\u6539\u4ef7\u4f1a\u81ea\u52a8\u66f4\u65b0\u5230\u5df2\u6709\u7684\u4ef7\u683c\u8868\uff0c\u624b\u52a8\u6539\u8fc7\u7684\u9664\u5916\u3002\n\n**\u667a\u8c31\u7684\u300c\u83b7\u53d6 API Key\u300d\u94fe\u63a5\u53bb\u6389\u4e86\u9080\u8bf7\u7801\u3002**\n\n**\u571f\u8033\u5176\u8bed**\uff1a\u6539\u8fdb\u4e86 17 \u5904\u754c\u9762\u7528\u8bed\uff08[#8481](https://github.com/farion1231/cc-switch/pull/8481)\uff09\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e AllTokens SI\u3002\n\n## \u4fee\u590d\n\n- **Codex \u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u4f1a\u8bdd\u6362\u5230\u53e6\u4e00\u5bb6\u4f9b\u5e94\u5546\u540e\u4e00\u76f4\u62a5\u9519**\uff08[#8485](https://github.com/farion1231/cc-switch/issues/8485)\uff09\u3002\u4f1a\u8bdd\u5728\u805a\u5408\u7684\u9ed8\u8ba4\u4f9b\u5e94\u5546\u548c\u5176\u4ed6\u805a\u5408\u6210\u5458\u4e4b\u95f4\u6362\u6a21\u578b\u65f6\uff0cCodex \u4f1a\u5148\u7528\u539f\u6765\u90a3\u5bb6\u538b\u7f29\u4e0a\u4e0b\u6587\uff1b\u90a3\u5bb6\u989d\u5ea6\u7528\u5b8c\u65f6\u538b\u7f29\u5931\u8d25\uff0c\u4e4b\u540e\u6bcf\u4e00\u8f6e\u90fd\u5361\u5728\u540c\u4e00\u5904\u3002\u73b0\u5728\u805a\u5408\u6a21\u5f0f\u4e0b\u7b2c\u4e09\u65b9\u8def\u7531\u7684\u6a21\u578b\u548c\u805a\u5408\u6210\u5458\u7528\u540c\u4e00\u5957\u538b\u7f29\u6807\u8bc6\uff0c\u4e0d\u4f1a\u518d\u89e6\u53d1\u8fd9\u6b21\u538b\u7f29\uff0c\u5df2\u7ecf\u5361\u4f4f\u7684\u4f1a\u8bdd\u4e5f\u80fd\u6062\u590d\u3002\u5b98\u65b9\u8def\u7531\u4e0d\u53d7\u5f71\u54cd\u3002\n- **Codex \u8d70\u8def\u7531\u65f6\uff0c\u6bcf\u6b21\u91cd\u542f CC Switch \u90fd\u8981\u91cd\u65b0\u767b\u5f55 ChatGPT**\uff08[#8431](https://github.com/farion1231/cc-switch/issues/8431)\uff09\u3002Codex \u684c\u9762\u7248 26.1013 \u8d77\uff0c\u7ee7\u7eed\u4f1a\u8bdd\u9700\u8981\u767b\u5f55 ChatGPT\u3002\u5173\u95ed\u300c\u975e\u63a5\u7ba1\u5207\u6362\u65f6\u4fdd\u7559\u5b98\u65b9\u767b\u5f55\u300d\u3001\u76f4\u8fde\u4f9b\u5e94\u5546\u662f\u7b2c\u4e09\u65b9\u65f6\uff0c\u9000\u51fa CC Switch \u4f1a\u6536\u8d77\u767b\u5f55\u5e76\u5220\u6389 `auth.json`\uff0c\u4e0b\u6b21\u542f\u52a8\u4e5f\u6ca1\u6709\u8fd8\u56de\u53bb\u3002\u73b0\u5728\u9000\u51fa CC Switch \u65f6\u4e00\u5f8b\u4fdd\u7559\u767b\u5f55\uff0c\u771f\u6b63\u9000\u51fa\u8def\u7531\u65f6\u4ecd\u6309\u8fd9\u4e2a\u8bbe\u7f6e\u5904\u7406\uff1b\u8fdb\u5165\u6216\u63a5\u4e0a\u7b2c\u4e09\u65b9\u8def\u7531\u65f6\uff0c\u5982\u679c `auth.json` \u91cc\u6ca1\u6709\u767b\u5f55\uff0c\u4f1a\u8fd8\u56de\u6700\u8fd1\u6536\u8d77\u7684\u90a3\u4efd\uff0c\u4e4b\u524d\u5df2\u7ecf\u8fd9\u6837\u4e22\u6389\u7684\u767b\u5f55\u4e5f\u80fd\u627e\u56de\u3002\n- **Codex \u7ecf\u8def\u7531\u8fde Chat \u4e0a\u6e38\u65f6\uff0c\u5e76\u884c\u5de5\u5177\u7ed3\u679c\u88ab\u4e2d\u9014\u7684\u63d0\u793a\u62c6\u5f00\uff0c\u62a5 400\u300cNo tool output found\u300d**\uff08[#7190](https://github.com/farion1231/cc-switch/issues/7190)\u3001[#7569](https://github.com/farion1231/cc-switch/issues/7569)\uff09\u3002\u4f8b\u5982 Codex \u770b\u56fe\u7247\u65f6\u63d2\u5165\u7684 `image_resize_notice`\u3002\u73b0\u5728\u8fd9\u7c7b\u63d0\u793a\u4e0d\u518d\u6253\u65ad\u5de5\u5177\u7ed3\u679c\uff0c\u6821\u9a8c\u4e25\u683c\u7684 Chat \u4e0a\u6e38\uff08\u5982 DeepSeek\uff09\u4e0d\u518d\u62d2\u6536\u3002\n- **\u81ea\u5df1\u586b\u7684 GPT \u4e0a\u4e0b\u6587\u7a97\u53e3\u5bf9\u5b98\u65b9\u540c\u540d\u6a21\u578b\u4e0d\u751f\u6548**\uff08[#8366](https://github.com/farion1231/cc-switch/issues/8366)\u3001[#8350](https://github.com/farion1231/cc-switch/issues/8350)\uff09\u3002\u73b0\u5728\u6309\u4f9b\u5e94\u5546\u6216\u6309\u6a21\u578b\u586b\u7684\u7a97\u53e3\u90fd\u4f1a\u5199\u8fdb Codex \u7684\u6a21\u578b\u76ee\u5f55\uff0c\u81ea\u52a8\u538b\u7f29\u7684\u9608\u503c\u968f\u4e4b\u8c03\u6574\uff1b\u6ca1\u586b\u65f6\u4ecd\u7528\u5b98\u65b9\u9ed8\u8ba4\u503c\u3002Codex \u7ecf\u8def\u7531\u8fde Gemini \u65f6\u5982\u679c\u8f93\u5165\u8d85\u957f\uff0c\u73b0\u5728\u4f1a\u8fd4\u56de Codex \u8ba4\u5f97\u7684\u300c\u4e0a\u4e0b\u6587\u8d85\u957f\u300d\u9519\u8bef\uff0c\u8ba9 Codex \u81ea\u5df1\u538b\u7f29\u3002\n- **4.0.13 \u7684 GPT 272K \u5c01\u9876\u628a\u771f\u6709 1.05M \u7a97\u53e3\u7684\u5e73\u53f0\u4e5f\u5c01\u4e86\u3002** \u73b0\u5728\u53ea\u6709\u501f\u7528\u539f\u5382\u6570\u636e\u7684\u7a97\u53e3\u624d\u5c01\u9876\u5230 272K\uff1a\u540c\u4e00\u5730\u5740\u7684\u9884\u8bbe\u3001models.dev \u6309\u5730\u5740\u8ba4\u51fa\u7684\u4f9b\u5e94\u5546\u7528\u5b83\u4eec\u81ea\u5df1\u7684\u7a97\u53e3\uff0c\u624b\u586b\u7684\u7a97\u53e3\u4e5f\u7167\u7528\uff1bGPT \u7a97\u53e3\u8d85\u8fc7 272K \u65f6\uff0cCodex\u3001Hermes\u3001OpenClaw\u3001OpenCode\u3001Pi \u7684\u8868\u5355\u4f1a\u5728\u8f93\u5165\u6846\u4e0b\u65b9\u63d0\u9192\u3002OpenRouter\u3001Vercel AI Gateway\u3001Cloudflare AI Gateway\u3001DigitalOcean \u7684\u9884\u8bbe\u6062\u590d 1.05M\u3002\n- **\u8def\u7531\u4e0b\u4e0a\u6e38\u662f 5.5 \u6a21\u578b\u65f6\uff0cClaude Code \u4ecd\u5f53\u6210 5 \u7684\u6a21\u578b**\uff08[#8450](https://github.com/farion1231/cc-switch/pull/8450)\uff09\u3002\u73b0\u5728 Opus\u3001Sonnet \u6863\u7684\u4e0a\u6e38\u662f 5.5 \u65f6\uff0c\u5199\u7ed9 Claude Code \u7684\u662f `claude-opus-5-5` / `claude-sonnet-5-5`\uff0cClaude Code \u663e\u793a\u6b63\u786e\u7684\u6a21\u578b\uff0c\u8f93\u51fa\u4e0a\u9650\u4e5f\u4ece 64K \u53d8\u4e3a 128K\uff1b\u5b50\u4ee3\u7406\u6a21\u578b\u540c\u6837\u5904\u7406\u3002\n- **Claude Desktop \u8def\u7531\u6a21\u5f0f\u4e0b\uff0c\u76ee\u6807\u662f 5.5 \u6a21\u578b\u65f6\u8bf7\u6c42\u88ab\u4e0a\u6e38\u62d2\u6536**\uff08[#8082](https://github.com/farion1231/cc-switch/issues/8082)\uff09\u3002\u4ee5\u524d\u53d1\u5e03\u7ed9 Desktop \u7684\u6a21\u578b\u540d\u56fa\u5b9a\u662f `claude-opus-5` / `claude-sonnet-5`\uff0cDesktop \u6309 5 \u7684\u53c2\u6570\u6784\u9020\u8bf7\u6c42\uff0c5.5 \u4e0a\u6e38\u4e0d\u63a5\u53d7\uff1b\u624b\u6539\u751f\u6210\u7684\u914d\u7f6e\u53c8\u4f1a\u88ab\u4e0b\u6b21\u5199\u5165\u8986\u76d6\u3002\u73b0\u5728\u76ee\u6807\u662f 5.5 \u65f6\u53d1\u5e03 5.5 \u7684\u6a21\u578b ID\uff1b\u6620\u5c04\u8868\u672c\u8eab\u4e0d\u53d8\uff0c\u65e7\u914d\u7f6e\u53d1\u6765\u7684\u8bf7\u6c42\u4ecd\u6307\u5411\u539f\u6765\u7684\u76ee\u6807\u3002\n- **Claude Code \u7ecf Codex OAuth \u4f7f\u7528\u5e26\u6b21\u6570\u4e0a\u9650\u7684 WebSearch \u65f6\u76f4\u63a5\u62a5\u9519**\uff08[#7936](https://github.com/farion1231/cc-switch/pull/7936)\uff09\u3002\u4ee5\u524d\u53ea\u6709\u5f3a\u5236\u4f7f\u7528 WebSearch \u65f6\u624d\u653e\u884c\uff0c\u73b0\u5728\u4e0d\u5f3a\u5236\u4e5f\u80fd\u7528\uff0c\u6b21\u6570\u4e0a\u9650\u901a\u8fc7\u63d0\u793a\u7ea6\u675f\uff0c\u8d85\u51fa\u6b21\u6570\u65f6\u8fd9\u4e00\u8f6e\u54cd\u5e94\u4f1a\u5728\u8fd4\u56de\u65f6\u622a\u65ad\u3002\n- **\u667a\u8c31\u6309\u91cf\u4ed8\u8d39\u8d26\u53f7\u7684\u5361\u7247\u663e\u793a\u300c\u989d\u5ea6\u6ca1\u67e5\u5230\u300d**\uff08[#8465](https://github.com/farion1231/cc-switch/issues/8465)\uff09\u3002\u667a\u8c31\u5361\u7247\u9ed8\u8ba4\u67e5\u5957\u9910\u989d\u5ea6\uff0c\u6ca1\u6709 Coding Plan \u7684\u8d26\u53f7\u4f1a\u88ab\u5f53\u6210\u51fa\u9519\u3002\u73b0\u5728\u6ca1\u6709\u5957\u9910\u65f6\u6539\u4e3a\u663e\u793a\u8d26\u6237\u4f59\u989d\uff08\u56e2\u961f\u5957\u9910\u4e0d\u56de\u843d\uff09\u3002\n- **\u65b0\u5efa\u7684\u706b\u5c71 Agent / Coding Plan \u5361\u7247\u4e00\u4e0a\u6765\u5c31\u663e\u793a\u300c\u989d\u5ea6\u6ca1\u67e5\u5230\u300d**\uff08[#8494](https://github.com/farion1231/cc-switch/issues/8494)\uff09\u3002\u706b\u5c71\u7684\u5957\u9910\u989d\u5ea6\u8981\u7528\u8d26\u53f7\u7684 AccessKey ID \u548c SecretAccessKey \u67e5\u8be2\uff0c\u4e0d\u662f\u63a8\u7406\u7528\u7684 API Key\u3002\u73b0\u5728\u7528\u91cf\u8bbe\u7f6e\u91cc\u4f1a\u9884\u9009\u706b\u5c71\uff0c\u4f46\u586b\u597d AccessKey \u4e4b\u524d\u4e0d\u542f\u7528\u67e5\u8be2\uff1b\u4e00\u952e\u5bfc\u5165\u94fe\u63a5\u91cc\u660e\u786e\u5199\u4e86\u542f\u7528\u7684\uff0c\u7167\u5e38\u542f\u7528\u3002\n- **Codex \u5b98\u65b9\u5361\u7684\u7f16\u8f91\u5668\u91cc\uff0c`auth.json` \u663e\u793a\u7684\u662f\u65e7\u767b\u5f55\u3002** \u4ee5\u524d\u663e\u793a\u7684\u662f\u65e7\u7248\u672c\u5b58\u4e0b\u7684\u767b\u5f55\u5feb\u7167\uff0cCodex \u6362\u8fc7\u4ee4\u724c\u540e\u5c31\u548c `~/.codex/auth.json` \u5bf9\u4e0d\u4e0a\uff1b\u8ddf\u968f\u5f53\u524d\u767b\u5f55\u7684\u5361\u7247\u5219\u663e\u793a\u4e3a\u7a7a\u3002\u73b0\u5728\u672a\u7ed1\u5b9a\u6258\u7ba1\u8d26\u53f7\u7684\u5b98\u65b9\u5361\u663e\u793a\u7684\u662f\u5207\u6362\u5230\u8fd9\u5f20\u5361\u540e `auth.json` \u7684\u5185\u5bb9\uff1b\u4e0d\u52a8\u8fd9\u4e2a\u6846\u76f4\u63a5\u4fdd\u5b58\uff0c\u5361\u7247\u539f\u6765\u7684\u767b\u5f55\u4fe1\u606f\u4fdd\u6301\u4e0d\u53d8\u3002\u5207\u6362\u65f6\u5b9e\u9645\u5199\u5165\u7684\u6587\u4ef6\u4e00\u76f4\u662f\u5bf9\u7684\u3002\n- **Windows \u4e0a\u7528 fnm \u7ba1\u7406 Node \u65f6\uff0c\u8ba4\u4e0d\u51fa\u5df2\u5b89\u88c5\u7684 Codex \u7b49\u5de5\u5177**\uff08[#8484](https://github.com/farion1231/cc-switch/issues/8484)\uff09\u3002fnm \u53ea\u5728\u5404\u4e2a\u7ec8\u7aef\u91cc\u4e34\u65f6\u52a0 PATH\uff0cCC Switch \u627e\u4e0d\u5230 node \u548c npm\uff0c\u5e94\u7528\u5185\u5b89\u88c5\u4e5f\u62a5\u300c'npm' \u4e0d\u662f\u5185\u90e8\u6216\u5916\u90e8\u547d\u4ee4\u300d\u3002\u73b0\u5728\u4f1a\u628a fnm \u9ed8\u8ba4 Node \u7248\u672c\u7684\u76ee\u5f55\u52a0\u5230 PATH \u672b\u5c3e\uff0c\u539f\u6709\u7684 PATH \u4ecd\u7136\u4f18\u5148\u3002\n- **\u7a7a\u95f2\u7684\u4f9b\u5e94\u5546\u5361\u7247\u5220\u4e0d\u6389\uff0c\u63d0\u793a\u300c\u65e0\u6cd5\u5220\u9664\u5f53\u524d\u6b63\u5728\u4f7f\u7528\u7684\u4f9b\u5e94\u5546\u300d**\uff08[#8506](https://github.com/farion1231/cc-switch/issues/8506)\uff09\u3002\u5e38\u89c1\u4e8e\u5e26\u7740\u65e7\u7248 Claude Desktop \u6620\u5c04\u5361\u5347\u7ea7\u540e\uff0c\u6570\u636e\u5e93\u91cc\u65e7\u7684\u300c\u5f53\u524d\u300d\u6807\u8bb0\u8fd8\u6307\u7740\u5b83\u3002\u73b0\u5728\u53ea\u770b\u5b9e\u9645\u5728\u7528\u7684\u76f4\u8fde\u4f9b\u5e94\u5546\u548c\u8def\u7531\u76ee\u6807\uff0c\u548c\u754c\u9762\u4e0a\u7981\u7528\u5220\u9664\u7684\u89c4\u5219\u4e00\u81f4\u3002\n- **\u7f16\u8f91\u4f9b\u5e94\u5546\u65f6\u300c\u83b7\u53d6 API Key\u300d\u94fe\u63a5\u4e0d\u89c1\u4e86\u3002** \u73b0\u5728\u7f16\u8f91\u65f6\u4f1a\u6309\u5f53\u524d\u5730\u5740\u627e\u5230\u5bf9\u5e94\u7684\u9884\u8bbe\uff0c\u663e\u793a\u5b83\u7684\u94fe\u63a5\uff0c\u548c\u6dfb\u52a0\u65f6\u4e00\u6837\u3002\n- **macOS / Linux \u4e0a\u8bef\u62a5\u73af\u5883\u53d8\u91cf\u51b2\u7a81\u3002** \u4ee5\u524d\u4f1a\u628a CC Switch \u4ece\u542f\u52a8\u5b83\u7684\u7a0b\u5e8f\u7ee7\u627f\u6765\u7684\u73af\u5883\u53d8\u91cf\u4e5f\u7b97\u8fdb\u53bb\uff08\u4f8b\u5982\u4ece Claude Desktop \u6253\u5f00\u7684\u7ec8\u7aef\u91cc\u81ea\u5e26\u7684 `ANTHROPIC_BASE_URL`\uff09\uff0c\u8fd9\u4e9b\u5728\u5e94\u7528\u91cc\u4e5f\u5220\u4e0d\u6389\u3002\u73b0\u5728\u53ea\u68c0\u67e5 shell \u914d\u7f6e\u6587\u4ef6\u91cc\u7684\u5b9a\u4e49\uff0cWindows \u4e0d\u53d8\u3002\n- **MiniMax Code \u7684\u90e8\u5206\u7528\u91cf\u8bb0\u5f55\u6a21\u578b\u663e\u793a\u4e3a unknown\u3002** \u73b0\u5728\u4f1a\u4ece\u540c\u4e00\u4f1a\u8bdd\u3001\u540c\u4e00\u65f6\u95f4\u7684\u90a3\u6761\u56de\u590d\u91cc\u627e\u56de\u6a21\u578b\u540d\uff0c\u80fd\u6b63\u5e38\u8ba1\u4ef7\uff1b\u5df2\u7ecf\u5bfc\u5165\u7684\u8bb0\u5f55\u4fdd\u6301\u539f\u6837\u3002\n- **Hermes \u91cc\u6dfb\u52a0 MiniMax \u5b98\u65b9\u4f9b\u5e94\u5546\u540e\u8bf7\u6c42\u53d1\u4e0d\u51fa\u53bb**\uff08[#8538](https://github.com/farion1231/cc-switch/pull/8538)\uff09\u3002\u4f9b\u5e94\u5546\u6807\u8bc6\u6309\u76f4\u89c9\u586b\u6210 `minimax` \u65f6\uff0c\u548c Hermes \u5185\u7f6e\u7684 MiniMax \u91cd\u540d\uff0cHermes \u4f1a\u6539\u7528\u5185\u7f6e\u90a3\u5bb6\u3001\u8981\u6c42\u8bbe\u7f6e `MINIMAX_API_KEY`\u3002\u73b0\u5728 MiniMax \u9884\u8bbe\u4f1a\u9884\u586b `cc-switch-minimax` / `cc-switch-minimax-en`\uff1b\u4e4b\u524d\u5df2\u7ecf\u7528 `minimax` \u6dfb\u52a0\u7684\uff0c\u8bf7\u6539\u7528\u522b\u7684\u6807\u8bc6\u91cd\u65b0\u6dfb\u52a0\u3002MiniMax-M3.1-Flash \u4e5f\u6807\u4e3a\u652f\u6301\u56fe\u7247\u8f93\u5165\u3002\n- **\u4e2d\u6587\u548c\u65e5\u6587\u4e0b\u7528\u91cf\u56fe\u7684\u7eb5\u8f74\u592a\u5bbd\u3002** \u300c5000\u4e07\u300d\u300c2000\u4ebf\u300d\u8fd9\u6837\u7684\u523b\u5ea6\u6539\u5199\u6210\u300c5\u5343\u4e07\u300d\u300c2\u5343\u4ebf\u300d\uff0c\u7528\u91cf\u9875\u548c\u6258\u76d8\u9762\u677f\u7684\u7eb5\u8f74\u6309\u6700\u5bbd\u7684\u523b\u5ea6\u81ea\u52a8\u8c03\u6574\u5bbd\u5ea6\uff0c\u77ed\u523b\u5ea6\u4e0d\u518d\u7559\u7a7a\uff0c\u957f\u91d1\u989d\u4e0d\u518d\u88ab\u622a\u6389\u3002\n- **macOS \u56fe\u6807\u7684\u767d\u5e95\u592a\u4eae**\uff08[#8495](https://github.com/farion1231/cc-switch/issues/8495)\uff09\u30024.0.15 \u7684\u767d\u8272\u5706\u89d2\u65b9\u5757\u6539\u4e3a\u6d45\u7070\uff0c\u5f62\u72b6\u4e0d\u53d8\uff1bWindows \u548c Linux \u56fe\u6807\u4e0d\u53d8\u3002\n- **\u300c\u5173\u4e8e\u300d\u5361\u7247\u7684 Logo \u6a21\u7cca**\uff08[#8470](https://github.com/farion1231/cc-switch/issues/8470)\uff09\u3002\u6539\u7528\u77e2\u91cf\u56fe\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n- \u5347\u7ea7\u540e\u70b9\u6258\u76d8\u56fe\u6807\u4f1a\u5f39\u51fa\u5feb\u6377\u9762\u677f\uff1b\u60f3\u7528\u539f\u6765\u7684\u83dc\u5355\uff0c\u8bf7\u5230\u300c\u8bbe\u7f6e \u2192 \u901a\u7528 \u2192 \u6258\u76d8\u6837\u5f0f\u300d\u91cc\u9009\u300c\u83dc\u5355\u300d\uff08macOS\u3001Windows\uff09\u3002Windows \u4e0a\u5de6\u952e\u70b9\u6258\u76d8\u56fe\u6807\u4ee5\u524d\u662f\u6253\u5f00\u4e3b\u754c\u9762\uff0c\u73b0\u5728\u4e5f\u5f39\u51fa\u9762\u677f\uff0c\u4e3b\u754c\u9762\u4ece\u9762\u677f\u5e95\u90e8\u7684\u300c\u6253\u5f00\u4e3b\u7a97\u53e3\u300d\u8fdb\u5165\u3002\n- \u5df2\u4fdd\u5b58\u7684 GPT \u6a21\u578b\u7a97\u53e3\u4e0d\u505a\u8fc1\u79fb\u30024.0.13 \u4e4b\u524d\u4fdd\u5b58\u3001\u81ea\u52a8\u586b\u6210 1.05M \u7684 Codex GP