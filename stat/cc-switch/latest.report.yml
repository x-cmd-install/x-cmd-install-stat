{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5800,"digest":"sha256:c1ed32092eb82a525c1aa012f11cff8e075858751583e945bd417fb2e251c271","download_count":11680,"created_at":"2026-10-11T15:49:16Z","updated_at":"2026-10-11T15:49:16Z"}],"body":"# CC Switch v4.0.9\n\n### 4.0 \u6b63\u5f0f\u7248\u7684\u7b2c\u4e94\u4e2a\u4fee\u590d\u7248\u672c\n\n\u91cd\u65b0\u68b3\u7406\u4e86\u6dfb\u52a0\u4f9b\u5e94\u5546\u7684\u6574\u4e2a\u6d41\u7a0b\uff1a\u8868\u5355\u6309\u586b\u5199\u987a\u5e8f\u6392\u5217\uff0c\u5730\u5740\u548c Key \u4e4b\u540e\u5c31\u662f\u6a21\u578b\u5217\u8868\uff1b\u70b9\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u540e\u5f39\u7a97\u81ea\u52a8\u6253\u5f00\uff0c\u6bcf\u4e2a\u6a21\u578b\u7684\u4e0a\u4e0b\u6587\u7a97\u53e3\u3001\u662f\u5426\u652f\u6301\u63a8\u7406\u548c\u56fe\u7247\u8f93\u5165\u90fd\u5df2\u7ecf\u67e5\u597d\uff0c\u52fe\u9009\u540e\u70b9\u300c\u5e94\u7528\u300d\u5c31\u8fde\u540c\u53c2\u6570\u4e00\u8d77\u52a0\u8fdb\u5217\u8868\uff0c\u540c\u4e00\u4e2a\u5f39\u7a97\u91cc\u53d6\u6d88\u52fe\u9009\u5c31\u80fd\u79fb\u9664\uff1b\u5b57\u6bb5\u8bf4\u660e\u6536\u8fdb\u300c?\u300d\uff0c\u63d0\u793a\u4f1a\u6309\u5e94\u7528\u5f53\u524d\u662f\u76f4\u8fde\u3001\u8def\u7531\u8fd8\u662f\u805a\u5408\u6765\u663e\u793a\u3002\u53e6\u5916\u4fee\u590d\u4e86 Codex \u65b0\u5efa\u7ebf\u7a0b\u548c\u81ea\u52a8\u5316\u5728\u90e8\u5206\u4e0a\u6e38\u62a5\u9519\u3001\u6574\u4e2a\u7ebf\u7a0b\u65e0\u6cd5\u7ee7\u7eed\u7684\u95ee\u9898\uff1a\u7ecf\u8def\u7531\u8f6c\u6210 Chat \u534f\u8bae\u7684 DeepSeek\u3001OpenCode Zen \u7b49\u62a5 400\uff0cxAI \u539f\u751f Responses \u62a5 422\u3002WSL2 \u91cc\u7684 Claude Desktop \u7b49\u8fde\u4e0d\u4e0a\u672c\u673a\u56de\u73af\u7684\u5ba2\u6237\u7aef\uff0c\u73b0\u5728\u53ef\u4ee5\u5728\u300c\u8bbe\u7f6e \u2192 \u672c\u5730\u8def\u7531\u300d\u586b\u4e00\u4e2a\u300c\u8fde\u63a5\u5730\u5740\u300d\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.9-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.9-ja.md)**\n\n---\n\n## \u91cd\u65b0\u68b3\u7406\u7684\u4f9b\u5e94\u5546\u6dfb\u52a0\u6d41\u7a0b\n\n\u8fd9\u4e00\u7248\u628a\u6dfb\u52a0\u548c\u7f16\u8f91\u4f9b\u5e94\u5546\u7684\u8868\u5355\u4ece\u5934\u5230\u5c3e\u7406\u4e86\u4e00\u904d\uff0c\u4e3b\u8981\u662f Claude Code\u3001Codex \u548c\u805a\u5408\u4e09\u79cd\u5e03\u5c40\u3002\u4ee5\u524d\u6a21\u578b\u5217\u8868\u6536\u5728\u9ad8\u7ea7\u9009\u9879\u91cc\uff0c\u6392\u5728\u5b83\u6240\u51b3\u5b9a\u7684\u9ed8\u8ba4\u6a21\u578b\u540e\u9762\uff1b\u83b7\u53d6\u5230\u7684\u6a21\u578b\u53ea\u80fd\u5728\u5217\u8868\u4e0b\u65b9\u9010\u4e2a\u6dfb\u52a0\uff0c\u52a0\u5b8c\u8fd8\u8981\u9010\u4e2a\u6838\u5bf9\u81ea\u52a8\u586b\u597d\u7684\u53c2\u6570\uff1b\u51e0\u4e4e\u6bcf\u4e2a\u5b57\u6bb5\u4e0b\u9762\u90fd\u6709\u4e00\u6bb5\u7070\u5b57\uff0c\u6709\u4e9b\u63d0\u793a\u548c\u4f60\u5b9e\u9645\u6240\u5904\u7684\u6a21\u5f0f\u5bf9\u4e0d\u4e0a\u3002\u73b0\u5728\u6309\u586b\u5199\u987a\u5e8f\u8d70\u4e00\u904d\uff1a\n\n**1. \u5730\u5740\u3001Key \u548c\u4e0a\u6e38\u683c\u5f0f\u3002** \u5148\u9009\u9884\u8bbe\u6216\u586b\u5730\u5740\u548c Key\u3002\u9009\u4e0a\u6e38\u683c\u5f0f\u65f6\uff0c\u63d0\u793a\u6309\u5e94\u7528\u5f53\u524d\u7684\u6a21\u5f0f\u663e\u793a\uff1a\u5e94\u7528\u5904\u5728\u76f4\u8fde\u6a21\u5f0f\u65f6\uff0c\u5982\u679c\u9009\u7684\u683c\u5f0f\u9700\u8981\u8f6c\u6362\uff0c\u683c\u5f0f\u4e0b\u9762\u4f1a\u63d0\u793a\u8fd9\u5f20\u5361\u6b63\u5728\u76f4\u8fde\u4f7f\u7528\u3001\u6539\u6210\u8fd9\u79cd\u683c\u5f0f\u4fdd\u5b58\u540e\u8bf7\u6c42\u4f1a\u5931\u8d25\uff0c\u6216\u8005\u8fd9\u79cd\u683c\u5f0f\u8981\u5148\u5207\u5230\u8def\u7531\u6216\u805a\u5408\u624d\u80fd\u7528\u3002Claude Code \u7684\u4e0a\u6e38\u683c\u5f0f\u9009 OpenAI Chat \u6216 Responses \u65f6\uff0c\u4e0d\u518d\u663e\u793a\u7528\u4e0d\u4e0a\u7684\u8ba4\u8bc1\u5b57\u6bb5\u3002\n\n**2. \u6a21\u578b\u5217\u8868\uff1a\u83b7\u53d6\u3001\u6311\u9009\u3001\u81ea\u52a8\u586b\u53c2\u6570\u3002** Codex \u7684\u6a21\u578b\u5217\u8868\u4ece\u9ad8\u7ea7\u9009\u9879\u91cc\u632a\u4e86\u51fa\u6765\uff0c\u7d27\u8ddf\u5728\u5730\u5740\u548c Key \u540e\u9762\uff0c\u548c\u805a\u5408\u5e03\u5c40\u4e00\u6837\u53eb\u300c\u6a21\u578b\u5217\u8868\u300d\u3002Claude Code \u805a\u5408\u3001Codex\u3001OpenCode \u548c MiniMax Code \u7684\u6a21\u578b\u5217\u8868\u73b0\u5728\u8fd9\u6837\u6dfb\u52a0\u6a21\u578b\uff1a\n\n1. \u70b9\u6a21\u578b\u5217\u8868\u4e0a\u7684\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u3002\n2. \u83b7\u53d6\u6210\u529f\u540e\u300c\u9009\u62e9\u6a21\u578b\u300d\u5f39\u7a97\u81ea\u52a8\u6253\u5f00\u3002\u6bcf\u4e2a\u6a21\u578b\u65c1\u8fb9\u5df2\u7ecf\u663e\u793a\u597d\u4e0a\u4e0b\u6587\u7a97\u53e3\uff0c\u4ee5\u53ca\u662f\u5426\u652f\u6301\u63a8\u7406\u548c\u56fe\u7247\u8f93\u5165\uff0c\u6570\u503c\u6765\u81ea\u540c\u5730\u5740\u7684\u9884\u8bbe\uff0c\u5176\u6b21\u6309\u4f9b\u5e94\u5546\u5730\u5740\u67e5 models.dev\uff0c\u518d\u5176\u6b21\u67e5\u6a21\u578b\u5382\u5546\u81ea\u5df1\u7684\u6761\u76ee\u3002\n3. \u52fe\u9009\u60f3\u8981\u7684\u6a21\u578b\uff0c\u70b9\u300c\u5e94\u7528\u300d\u3002\u65b0\u6a21\u578b\u8ffd\u52a0\u5230\u5217\u8868\u672b\u5c3e\uff0c\u53c2\u6570\u6309\u5f39\u7a97\u91cc\u663e\u793a\u7684\u503c\u76f4\u63a5\u586b\u597d\uff0c\u4e0d\u518d\u5f39\u300c\u5df2\u8865\u5168\u2026\u2026\u7684\u4e0a\u4e0b\u6587\u7b49\u53c2\u6570\uff0c\u8bf7\u6838\u5bf9\u300d\u7684\u63d0\u793a\u3002\n\n\u540c\u4e00\u4e2a\u5f39\u7a97\u4e5f\u8d1f\u8d23\u5220\u9664\uff1a\u52fe\u9009\u8868\u793a\u300c\u5728\u5217\u8868\u91cc\u300d\uff0c\u5df2\u914d\u7f6e\u7684\u6a21\u578b\u9ed8\u8ba4\u52fe\u9009\uff0c\u53d6\u6d88\u52fe\u9009\u540e\u70b9\u300c\u5e94\u7528\u300d\u5c31\u4f1a\u4ece\u5217\u8868\u79fb\u9664\uff0c\u70b9\u300c\u53d6\u6d88\u300d\u4ec0\u4e48\u90fd\u4e0d\u6539\u3002\u7559\u4e0b\u7684\u6a21\u578b\u4fdd\u6301\u539f\u6765\u7684\u987a\u5e8f\u548c\u8bbe\u7f6e\u3002\u5df2\u914d\u7f6e\u4f46\u4f9b\u5e94\u5546\u8fd9\u6b21\u6ca1\u8fd4\u56de\u7684\u6a21\u578b\uff0c\u5355\u72ec\u5217\u5728\u300c\u4e0d\u5728\u4f9b\u5e94\u5546\u5217\u8868\u4e2d\u300d\u4e00\u7ec4\uff0c\u4e5f\u80fd\u4e00\u5e76\u6e05\u7406\u3002\u5f39\u7a97\u652f\u6301\u641c\u7d22\u3001\u5168\u9009 / \u5168\u4e0d\u9009\u3001\u53ea\u770b\u5df2\u9009\uff0c\u5e76\u663e\u793a\u5df2\u9009\u6570\u91cf\uff1b\u83b7\u53d6\u8fc7\u4e00\u6b21\u540e\u6309\u94ae\u53d8\u6210\u300c\u9009\u62e9\u6a21\u578b\u300d\uff0c\u518d\u70b9\u4e0d\u4f1a\u91cd\u65b0\u83b7\u53d6\uff0c\u9700\u8981\u65f6\u5728\u5f39\u7a97\u91cc\u70b9\u300c\u91cd\u65b0\u83b7\u53d6\u300d\u3002\n\n**3. \u9ed8\u8ba4\u6a21\u578b\uff1a\u5217\u8868\u7b2c\u4e00\u884c\u3002** Codex \u6709\u6a21\u578b\u5217\u8868\u65f6\uff0c\u7b2c\u4e00\u884c\u5c31\u662f\u9ed8\u8ba4\u6a21\u578b\uff0c\u4e0d\u518d\u5355\u72ec\u6709\u4e00\u4e2a\u9ed8\u8ba4\u6a21\u578b\u8f93\u5165\u6846\uff1b\u6539\u540d\u6216\u5220\u6389\u7b2c\u4e00\u884c\uff0c\u9ed8\u8ba4\u6a21\u578b\u8ddf\u7740\u53d8\u3002\u5217\u8868\u539f\u672c\u4e3a\u7a7a\u65f6\uff0c\u6dfb\u52a0\u6a21\u578b\u4f1a\u81ea\u52a8\u628a\u5f53\u524d\u7684\u9ed8\u8ba4\u6a21\u578b\u653e\u5728\u7b2c\u4e00\u884c\uff0c\u9ed8\u8ba4\u6a21\u578b\u4e0d\u4f1a\u56e0\u4e3a\u52a0\u4e86\u5217\u8868\u800c\u53d8\u6389\u3002\u6ca1\u6709\u914d\u7f6e\u6a21\u578b\u5217\u8868\u7684\u5361\u4ecd\u7136\u4fdd\u7559\u9ed8\u8ba4\u6a21\u578b\u8f93\u5165\u6846\uff1a\u8fd9\u7c7b\u5361\u7528\u7684\u662f Codex \u81ea\u5e26\u7684 `/model` \u83dc\u5355\uff0c\u52a0\u4e0a\u5217\u8868\u540e\u83dc\u5355\u91cc\u53ea\u4f1a\u5269\u4e0b\u5217\u8868\u91cc\u7684\u6a21\u578b\u3002\u805a\u5408\u6a21\u578b\u5217\u8868\u4e5f\u53bb\u6389\u4e86\u6bcf\u884c\u7684 \u2605 \u548c\u300c\u8bbe\u4e3a\u9ed8\u8ba4\u6a21\u578b\u300d\uff0c\u89c4\u5219\u540c\u6837\u662f\u7b2c\u4e00\u884c\u5373\u9ed8\u8ba4\u3002\n\n**4. \u5b50\u4ee3\u7406\uff08Codex\uff0c\u65b0\u589e\uff09\u3002** Codex \u8868\u5355\u65b0\u589e\u300c\u5b50\u4ee3\u7406\u6a21\u578b\u300d\u548c\u300c\u5b50\u4ee3\u7406\u63a8\u7406\u5f3a\u5ea6\u300d\uff0c\u5bf9\u5e94 `config.toml` \u91cc `[agents]` \u4e0b\u7684 `default_subagent_model` \u548c `default_subagent_reasoning_effort`\u3002\u7559\u7a7a\u5c31\u5220\u6389\u5bf9\u5e94\u7684\u952e\uff0c\u5b50\u4ee3\u7406\u6cbf\u7528\u4e3b\u4ee3\u7406\u7684\u8bbe\u7f6e\uff1b\u5207\u6362\u4f9b\u5e94\u5546\u65f6\u8fd9\u4e24\u9879\u8ddf\u7740\u6362\uff0c`[agents]` \u4e0b\u7684\u5176\u4ed6\u8bbe\u7f6e\u4e0d\u52a8\u3002\u586b\u7684\u6a21\u578b\u4e0d\u5728\u6a21\u578b\u5217\u8868\u91cc\u65f6\uff0c\u8868\u5355\u4f1a\u63d0\u793a\u5e76\u53ef\u4ee5\u4e00\u952e\u52a0\u5165\uff1a\u4e0d\u5728\u5217\u8868\u91cc\u7684\u6a21\u578b\uff0cCodex \u62ff\u4e0d\u5230\u5b83\u7684\u4e0a\u4e0b\u6587\u7a97\u53e3\uff0c\u7ecf\u8def\u7531\u8f6c\u6210 Chat / Anthropic \u534f\u8bae\u65f6\u8fd8\u4f1a\u88ab\u6362\u6210\u9ed8\u8ba4\u6a21\u578b\u3002\u805a\u5408\u6a21\u5f0f\u4e0b\u4e0d\u5199\u8fd9\u4e24\u9879\uff0c\u5b50\u4ee3\u7406\u8ddf\u968f\u4e3b\u6a21\u578b\uff0c\u4ee5\u514d\u4e3b\u4ee3\u7406\u6362\u5230\u53e6\u4e00\u5bb6\u7684\u6a21\u578b\u540e\uff0c\u5b50\u4ee3\u7406\u53c8\u88ab\u9001\u56de\u9ed8\u8ba4\u4f9b\u5e94\u5546\u3002\n\n**5. \u9ad8\u7ea7\u9009\u9879\u3002** \u300c\u5b8c\u6574 URL\u300d\u5f00\u5173\u53ea\u5bf9\u7aef\u70b9\u8def\u5f84\u4e0d\u6807\u51c6\u7684\u7f51\u5173\u6709\u7528\uff0c\u632a\u8fdb\u4e86\u9ad8\u7ea7\u9009\u9879\uff1b\u5df2\u7ecf\u6253\u5f00\u5b83\u7684\u5361\uff0c\u7f16\u8f91\u65f6\u9ad8\u7ea7\u9009\u9879\u4f1a\u81ea\u52a8\u5c55\u5f00\u3002User-Agent \u548c\u8bf7\u6c42\u8986\u76d6\u5408\u6210\u4e00\u5757\uff0c\u7edf\u4e00\u6ce8\u660e\u53ea\u5728\u8def\u7531\u548c\u805a\u5408\u6a21\u5f0f\u4e0b\u751f\u6548\u3002\n\n**\u8d2f\u7a7f\u6574\u4e2a\u8868\u5355\uff1a\u8bf4\u660e\u6536\u8fdb\u300c?\u300d\u3002** \u5b57\u6bb5\u662f\u4ec0\u4e48\u3001\u4ec0\u4e48\u65f6\u5019\u7528\uff0c\u653e\u5728\u5b57\u6bb5\u540d\u540e\u9762\u7684\u300c?\u300d\u91cc\uff1b\u9875\u9762\u4e0a\u53ea\u7559\u9700\u8981\u4f60\u6ce8\u610f\u7684\u540e\u679c\uff0c\u6bd4\u5982\u6539\u4e86\u6a21\u578b\u5217\u8868\u8981\u91cd\u542f Codex\u3001\u6700\u5927\u8f93\u51fa\u8d85\u8fc7\u5b9e\u9645\u4e0a\u9650\u4f1a\u62a5 400\u3002\u6258\u7ba1\u8d26\u53f7\u7684\u5361\uff08Codex\u3001xAI \u767b\u5f55\u548c Copilot\uff09\u4e0a\uff0c\u540e\u7aef\u672c\u6765\u5c31\u4e0d\u8bfb\u7684\u5b57\u6bb5\u4e0d\u518d\u663e\u793a\uff1b\u65e7\u7248\u6b8b\u7559\u5b57\u6bb5\u7684\u63d0\u793a\u7f29\u6210\u4e00\u53e5\u8bdd\uff1bClaude Desktop \u7684\u6a21\u578b\u6a21\u5f0f\u8bf4\u660e\u6539\u6210\u4e00\u53e5\u8bdd\uff1a\u4f9b\u5e94\u5546\u63d0\u4f9b\u539f\u751f Claude \u6a21\u578b\u65f6\u7528\u76f4\u8fde\uff0cDeepSeek\u3001Kimi \u7b49\u7b2c\u4e09\u65b9\u6a21\u578b\u7528\u6a21\u578b\u6620\u5c04\u3002\n\n## \u65b0\u589e\n\n**\u300c\u8bbe\u7f6e \u2192 \u672c\u5730\u8def\u7531\u300d\u65b0\u589e\u300c\u8fde\u63a5\u5730\u5740\u300d\u3002** CC Switch \u5199\u8fdb\u5ba2\u6237\u7aef\u914d\u7f6e\u7684\u4ee3\u7406\u5730\u5740\uff08\u5305\u62ec Claude Desktop \u7684\u7f51\u5173\u5730\u5740\uff09\u4ee5\u524d\u603b\u662f\u6309\u76d1\u542c\u5730\u5740\u63a8\u5bfc\uff0c\u76d1\u542c `0.0.0.0` \u65f6\u5199\u7684\u662f `127.0.0.1`\u3002WSL2\uff08NAT \u6a21\u5f0f\uff09\u91cc\u7684 Claude Desktop \u4f1a\u8bdd\u8bbf\u95ee\u4e0d\u5230 Windows \u7684\u672c\u673a\u56de\u73af\uff0c\u6240\u4ee5\u4e00\u76f4\u8fde\u4e0d\u4e0a\uff0c\u628a\u76d1\u542c\u5730\u5740\u6539\u6210 `0.0.0.0` \u4e5f\u6ca1\u7528\u3002\u73b0\u5728\u628a\u76d1\u542c\u5730\u5740\u8bbe\u4e3a `0.0.0.0`\uff0c\u518d\u5728\u300c\u8fde\u63a5\u5730\u5740\u300d\u91cc\u586b WSL \u80fd\u8bbf\u95ee\u5230\u7684 Windows \u5730\u5740\uff0c\u5199\u7ed9\u5ba2\u6237\u7aef\u7684\u4ee3\u7406\u5730\u5740\u5c31\u4f1a\u6539\u7528\u5b83\u3002\u4fdd\u5b58\u540e\u4f1a\u76f4\u63a5\u6539\u5199\u6b63\u5728\u8d70\u8def\u7531\u7684\u5ba2\u6237\u7aef\uff0c\u4e0d\u7528\u91cd\u542f\u8def\u7531\u670d\u52a1\u3002\u8fd9\u4e2a\u8bbe\u7f6e\u53ea\u4fdd\u5b58\u5728\u672c\u673a\uff0c\u4e0d\u4f1a\u968f\u4e91\u540c\u6b65\u5e26\u5230\u5176\u4ed6\u8bbe\u5907\u3002\n\n**\u65b0\u589e\u9884\u8bbe\uff1a** SoruxGPT\u3001IKunCode\u3001RunToken\u3001BotCF\u3001YYLX\u3001TokenFlux\u3001OpenModel\u3002\n\n## \u4fee\u590d\n\n- **Codex \u65b0\u5efa\u7ebf\u7a0b\u6216\u8dd1\u81ea\u52a8\u5316\u65f6\uff0cDeepSeek \u7b49\u4e0a\u6e38\u62a5 400\uff0c\u6574\u4e2a\u7ebf\u7a0b\u7528\u4e0d\u4e86\u3002** Codex \u684c\u9762\u7248\u65b0\u5efa\u7ebf\u7a0b\u65f6\u4f1a\u5f80\u5386\u53f2\u91cc\u63d2\u5165\u4e00\u6761\u6ca1\u6709\u5bf9\u5e94\u5de5\u5177\u8c03\u7528\u7684\u5de5\u5177\u7ed3\u679c\uff08create_thread \u56de\u6267\uff09\u3002\u7ecf\u8def\u7531\u628a Responses \u8f6c\u6210 Chat \u534f\u8bae\u65f6\uff0c\u8fd9\u7c7b\u7ed3\u679c\u4ee5\u524d\u88ab\u5f53\u6210 `role=tool` \u6d88\u606f\u53d1\u51fa\u53bb\uff0cDeepSeek\u3001OpenCode Zen \u8fd9\u7c7b\u4e25\u683c\u7684 Chat \u4e0a\u6e38\u4f1a\u62d2\u7edd\u8fd9\u4e2a\u7ebf\u7a0b\u91cc\u7684\u6bcf\u4e00\u6b21\u8bf7\u6c42\u3002\u73b0\u5728\u8fd9\u7c7b\u627e\u4e0d\u5230\u5bf9\u5e94\u8c03\u7528\u7684\u5de5\u5177\u7ed3\u679c\u4f1a\u6539\u6210\u4e00\u6761\u5e26\u6807\u8bb0\u7684\u7528\u6237\u6d88\u606f\uff0c\u91cc\u9762\u7684\u56fe\u7247\u7167\u5e38\u4f5c\u4e3a\u56fe\u7247\u53d1\u9001\uff1b\u6709\u5bf9\u5e94\u8c03\u7528\u7684\u5de5\u5177\u7ed3\u679c\u548c\u4ee5\u524d\u5b8c\u5168\u4e00\u6837\u3002\n- **Codex \u7528 xAI \u539f\u751f Responses \u65f6\u62a5 422\uff0c\u7ebf\u7a0b\u65e0\u6cd5\u6062\u590d\u3002** Codex \u684c\u9762\u7248\u63d2\u5165\u7684\u56de\u6267\uff08\u65b0\u5efa\u7ebf\u7a0b\u3001\u81ea\u52a8\u5316\u66f4\u65b0\u3001\u5fc3\u8df3\u3001\u8de8\u7ebf\u7a0b\u6d88\u606f\uff09\u6ca1\u6709 `call_id`\uff0cxAI \u4f1a\u4ee5\u300c\u7f3a\u5c11 `call_id`\u300d\u62d2\u7edd\u6574\u4e2a\u8bf7\u6c42\uff0c\u800c\u56de\u6267\u4e00\u76f4\u7559\u5728\u5386\u53f2\u91cc\uff0c\u6240\u4ee5\u8fd9\u4e2a\u7ebf\u7a0b\u4e4b\u540e\u90fd\u53d1\u4e0d\u51fa\u53bb\u3002\u73b0\u5728\u53ea\u5728\u53d1\u5f80 xAI \u65f6\uff0c\u628a\u8fd9\u7c7b\u56de\u6267\u6539\u5199\u6210\u5e26\u540c\u6837\u6807\u8bb0\u7684\u7528\u6237\u6d88\u606f\uff0c\u4fdd\u7559\u6587\u5b57\u548c\u56fe\u7247\uff1b\u6709 `call_id` \u7684\u6761\u76ee\u548c\u5176\u4ed6\u4e0a\u6e38\u90fd\u4e0d\u53d7\u5f71\u54cd\u3002\n- **Claude Code \u7684\u4e0a\u6e38\u683c\u5f0f\u9009 OpenAI Chat \u6216 Responses \u65f6\uff0c\u8def\u7531\u53d1\u51fa\u7684\u662f `x-api-key`\u3002** \u4ee5\u524d\u8bf7\u6c42\u5934\u53ea\u770b Key \u7684\u53d8\u91cf\u540d\uff0c\u7528 `ANTHROPIC_API_KEY` \u7684\u5361\u4f1a\u53d1 `x-api-key`\uff0cOpenAI \u683c\u5f0f\u7684\u4e0a\u6e38\u4e0d\u8ba4\u3002\u73b0\u5728 OpenAI \u683c\u5f0f\u4e00\u5f8b\u7528 `Authorization: Bearer`\uff0cAnthropic \u683c\u5f0f\u4ecd\u6309\u53d8\u91cf\u540d\u51b3\u5b9a\u3002\n- **Claude Code \u805a\u5408\u6a21\u5f0f\u53ea\u7528\u9ed8\u8ba4\u4f9b\u5e94\u5546\u7684\u517c\u5bb9\u5f00\u5173\u3002** \u9009\u5230\u5176\u4ed6\u4f9b\u5e94\u5546\u7684\u6a21\u578b\u65f6\uff0c\u53ef\u80fd\u53d1\u51fa\u90a3\u5bb6\u4e0d\u652f\u6301\u7684\u529f\u80fd\u800c\u62a5\u9519\u3002\u73b0\u5728\u6309\u5f00\u5173\u7684\u6027\u8d28\u5408\u5e76\u6240\u6709\u6210\u5458\u7684\u8bbe\u7f6e\uff1a\u5173\u95ed\u5b9e\u9a8c\u6027 beta\u3001Artifact\u3001\u81ea\u52a8\u6a21\u5f0f\u670d\u52a1\u5668\u8fd9\u7c7b\uff0c\u53ea\u8981\u6709\u4e00\u5bb6\u5173\u5c31\u5173\uff1b\u5de5\u5177\u641c\u7d22\u3001\u59cb\u7ec8\u542f\u7528 effort\u3001\u7ec6\u7c92\u5ea6\u5de5\u5177\u6d41\u5f0f\u8fd9\u7c7b\uff0c\u6240\u6709\u6210\u5458\u90fd\u5f00\u624d\u5f00\u3002\u989d\u5916\u8bf7\u6c42\u4f53\u3001\u601d\u8003\u548c\u7a97\u53e3\u76f8\u5173\u7684\u5f00\u5173\u4ecd\u7136\u8ddf\u968f\u9ed8\u8ba4\u4f9b\u5e94\u5546\u3002\n- **\u542f\u52a8\u65f6\u754c\u9762\u8bed\u8a00\u4e0d\u5bf9\uff0c\u6253\u5f00\u8bbe\u7f6e\u9875\u540e\u624d\u53d8\u56de\u6765\u3002** \u9996\u5c4f\u8bed\u8a00\u8bfb\u7684\u662f\u6d4f\u89c8\u5668\u7f13\u5b58\uff0c\u7f13\u5b58\u4e3a\u7a7a\u6216\u8fc7\u671f\u65f6\uff08\u6bd4\u5982\u6e05\u8fc7 WebView \u6570\u636e\u3001\u628a `~/.cc-switch` \u590d\u5236\u5230\u65b0\u7535\u8111\uff09\u4f1a\u5148\u663e\u793a\u7cfb\u7edf\u8bed\u8a00\u3002\u73b0\u5728\u542f\u52a8\u65f6\u4f1a\u8bfb\u53d6\u4fdd\u5b58\u7684\u8bed\u8a00\u8bbe\u7f6e\u5e76\u7acb\u5373\u5e94\u7528\u3002\n- **macOS \u4e0a\u8fde\u4e0d\u4e0a\u5c40\u57df\u7f51\u91cc\u7684 API \u5730\u5740\u3002** CC Switch \u73b0\u5728\u4f1a\u5411 macOS \u7533\u8bf7\u300c\u672c\u5730\u7f51\u7edc\u300d\u6743\u9650\u3002\u7b2c\u4e00\u6b21\u8fde\u63a5\u5c40\u57df\u7f51\u5730\u5740\u65f6\u7cfb\u7edf\u4f1a\u5f39\u51fa\u6388\u6743\uff0c\u8fd9\u6b21\u8bf7\u6c42\u53ef\u80fd\u4ecd\u7136\u5931\u8d25\uff0c\u70b9\u300c\u5141\u8bb8\u300d\u540e\u91cd\u8bd5\u5373\u53ef\u3002\u5982\u679c\u4ee5\u524d\u70b9\u8fc7\u62d2\u7edd\uff0c\u9700\u8981\u5230\u300c\u7cfb\u7edf\u8bbe\u7f6e \u2192 \u9690\u79c1\u4e0e\u5b89\u5168\u6027 \u2192 \u672c\u5730\u7f51\u7edc\u300d\u91cc\u6253\u5f00 CC Switch\u3002\n- **\u6253\u5f00\u4f9b\u5e94\u5546\u7f16\u8f91\u9762\u677f\u65f6\u9875\u9762\u95ea\u4e00\u4e0b\u3002** \u7f16\u8f91\u9762\u677f\u4ee5\u524d\u5148\u6253\u5f00\u4e00\u4e2a\u52a0\u8f7d\u9875\u518d\u6362\u6210\u5185\u5bb9\uff1b\u73b0\u5728\u7b49\u5185\u5bb9\u51c6\u5907\u597d\u518d\u6253\u5f00\uff0c\u4fdd\u7559\u548c\u65b0\u589e\u9762\u677f\u4e00\u6837\u7684\u6de1\u5165\u6548\u679c\u3002\n\n**\u5176\u4ed6\uff1a** Flatpak \u6784\u5efa\u6587\u6863\u4fee\u6b63\u4e86 `--bundles` \u53c2\u6570\u7684\u5199\u6cd5\uff0c\u5e76\u8bf4\u660e\u6ca1\u6709\u7b7e\u540d\u79c1\u94a5\u65f6\u600e\u4e48\u8df3\u8fc7\u66f4\u65b0\u5305\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\u65b0\u589e\u9884\u8bbe\u53ea\u5f71\u54cd\u65b0\u6dfb\u52a0\u7684\u4f9b\u5e94\u5546\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @NeeYoonc\uff08Codex \u7ebf\u7a0b\u91cc\u627e\u4e0d\u5230\u5bf9\u5e94\u8c03\u7528\u7684\u5de5\