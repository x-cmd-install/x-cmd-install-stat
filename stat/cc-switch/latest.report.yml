n","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:3028ee91f0c9e25cbb14313e233ea1e228eda4afe99d6c184911aadfac6aee43","download_count":15948,"created_at":"2026-10-14T10:58:31Z","updated_at":"2026-10-14T10:58:31Z"}],"body":"# CC Switch v4.0.12\n\n\u672c\u7248\u672c\u8ba9\u300c\u5e94\u7528\u300d\u9875\u53ef\u4ee5\u5b8c\u6574\u7ba1\u7406\u7f16\u7a0b\u5de5\u5177\uff1a\u5b89\u88c5\u3001\u5347\u7ea7\u3001\u5378\u8f7d\uff0c\u4ee5\u53ca\u68c0\u6d4b\u5b89\u88c5\u51b2\u7a81\u3002\u540c\u4e00\u4e2a\u5de5\u5177\u88c5\u4e86\u591a\u5904\u65f6\uff0c\u73b0\u5728\u53ef\u4ee5\u76f4\u63a5\u9009\u62e9\u5378\u8f7d\u591a\u4f59\u7684\u90a3\u4e00\u5904\uff0c\u51b2\u7a81\u5728 CC Switch \u91cc\u5c31\u80fd\u89e3\u51b3\uff1b\u5347\u7ea7\u524d\u4f1a\u5148\u68c0\u67e5 Node \u7248\u672c\uff0c\u65b0\u7248\u672c\u8981\u6c42\u66f4\u9ad8\u7684 Node \u65f6\u4e0d\u518d\u663e\u793a\u6ce8\u5b9a\u5931\u8d25\u7684\u5347\u7ea7\u6309\u94ae\uff1bGrok Build \u65b0\u7248\u7684\u5b89\u88c5\u65b9\u5f0f\u4e5f\u80fd\u5378\u8f7d\u4e86\u3002\u53e6\u5916\u65b0\u589e\u300c\u672c\u5730\u300d\u5206\u7ec4\uff0c\u53ef\u4ee5\u76f4\u63a5\u6dfb\u52a0\u5728\u672c\u673a\u8fd0\u884c\u7684 Ollama\u3001LM Studio\u3001llama.cpp\u3001vLLM\uff0c\u5e76\u65b0\u589e Ollama Cloud\u3001Groq\u3001Hugging Face\u3001Vercel AI Gateway \u7b49 14 \u5bb6\u4e91\u5e73\u53f0\u7684\u9884\u8bbe\u3002\u4f1a\u8bdd\u65e5\u5fd7\u7684\u540e\u53f0\u626b\u63cf\u4ece\u6bcf 60 \u79d2\u4e00\u6b21\u6539\u4e3a\u6bcf 10 \u5206\u949f\u4e00\u6b21\uff0c\u5e73\u65f6\u66f4\u7701\u8d44\u6e90\uff1b\u6253\u5f00\u7528\u91cf\u9875\u65f6\u6309\u6240\u9009\u95f4\u9694\u626b\u63cf\uff0c\u65b0\u7528\u91cf\u53cd\u800c\u663e\u793a\u5f97\u66f4\u5feb\u3002\u754c\u9762\u65b0\u589e\u571f\u8033\u5176\u8bed\uff08\u793e\u533a\u7ffb\u8bd1\uff09\uff1b\u7cfb\u7edf\u8bed\u8a00\u4e0d\u5728\u652f\u6301\u8303\u56f4\u5185\u65f6\uff0c\u9996\u6b21\u542f\u52a8\u6539\u7528\u82f1\u6587\u3002\u8fd8\u4fee\u590d\u4e86\u4e91\u540c\u6b65\u6062\u590d Skills \u5931\u8d25\u4e00\u6b21\u540e\u518d\u4e5f\u6062\u590d\u4e0d\u4e86\u3001Claude Code \u7ecf\u8def\u7531\u8fde\u63a5 Responses \u4e0a\u6e38\u65f6\u56de\u590d\u7ed3\u675f\u540e\u53c8\u62a5\u9519\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.12-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.12-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u300c\u5e94\u7528\u300d\u9875\uff1a\u5b89\u88c5\u3001\u5347\u7ea7\u3001\u5378\u8f7d\u3001\u68c0\u6d4b\u5b89\u88c5\u51b2\u7a81\u90fd\u9f50\u4e86\u3002** v4.0.11 \u52a0\u4e0a\u5378\u8f7d\u4e4b\u540e\uff0c\u8fd9\u4e00\u7248\u8865\u9f50\u4e86\u5269\u4e0b\u7684\u73af\u8282\u3002\u4e00\u4e2a\u5de5\u5177\u88c5\u4e86\u591a\u5904\u65f6\uff0c\u300c\u8bca\u65ad\u5b89\u88c5\u51b2\u7a81\u300d\u4f1a\u5217\u51fa\u6bcf\u4e00\u5904\uff0c\u5e76\u6807\u51fa\u547d\u4ee4\u884c\u5b9e\u9645\u4f7f\u7528\u7684\u300c\u9ed8\u8ba4\u300d\u90a3\u5904\uff1b\u73b0\u5728\u5378\u8f7d\u65f6\u53ef\u4ee5\u9009\u62e9\u5176\u4e2d\u4efb\u610f\u4e00\u5904\uff0c\u7559\u4e0b\u60f3\u7528\u7684\u90a3\u4efd\uff0c\u51b2\u7a81\u76f4\u63a5\u5728 CC Switch \u91cc\u89e3\u51b3\u3002\u5347\u7ea7\u524d\u4f1a\u5148\u6838\u5bf9 Node \u7248\u672c\uff0c\u4e0d\u518d\u7ed9\u51fa\u88c5\u4e0d\u4e0a\u3001\u6216\u8005\u88c5\u5b8c\u8dd1\u4e0d\u8d77\u6765\u7684\u5347\u7ea7\u3002\n\n**\u5378\u8f7d\u65f6\u53ef\u4ee5\u9009\u62e9\u5378\u8f7d\u54ea\u4e00\u5904\u5b89\u88c5\u3002** \u4ee5\u524d\u786e\u8ba4\u6846\u53ea\u63d0\u4f9b\u5f53\u524d\u4f7f\u7528\u7684\u90a3\u4e00\u5904\uff0c\u800c\u88c5\u4e86\u591a\u5904\u7684\u7528\u6237\u5f80\u5f80\u60f3\u5378\u8f7d\u7684\u662f\u53e6\u4e00\u5904\uff1b\u6709\u591a\u5904\u5b89\u88c5\u53c8\u8ba4\u4e0d\u51fa\u54ea\u5904\u662f\u9ed8\u8ba4\u65f6\uff0c\u5378\u8f7d\u4f1a\u76f4\u63a5\u5931\u8d25\u3002\u73b0\u5728\u786e\u8ba4\u6846\u4f1a\u5217\u51fa\u68c0\u6d4b\u5230\u7684\u6bcf\u4e00\u5904\u5b89\u88c5\uff0c\u5e26\u6765\u6e90\u3001\u8def\u5f84\u3001\u7248\u672c\u548c\u300c\u9ed8\u8ba4\u300d\u6807\u8bb0\uff1a\u53ea\u6709\u4e00\u5904\u80fd\u5378\u8f7d\u65f6\u81ea\u52a8\u9009\u4e2d\uff0c\u6709\u4e24\u5904\u4ee5\u4e0a\u65f6\u4e0d\u9884\u9009\uff0c\u4e0d\u80fd\u81ea\u52a8\u5378\u8f7d\u7684\u663e\u793a\u539f\u56e0\u5e76\u7981\u7528\u3002\u6267\u884c\u524d\u6309\u4f60\u9009\u7684\u8def\u5f84\u91cd\u65b0\u6838\u5bf9\u4e00\u904d\uff0c\u548c\u9884\u89c8\u4e0d\u4e00\u81f4\u5c31\u4e0d\u6267\u884c\u3002\n\n- \u652f\u6301 Grok Build 0.2.112 \u8d77\u7684\u5b89\u88c5\u65b9\u5f0f\uff08`~/.grok/bin/grok-<version>`\uff09\uff0c\u4ee5\u524d\u4f1a\u63d0\u793a\u300c\u65e0\u6cd5\u81ea\u52a8\u5378\u8f7d\u300d\u3002\u5378\u8f7d\u4f1a\u5220\u9664\u8fd9\u5957\u5b89\u88c5\u7684\u5168\u90e8\u7a0b\u5e8f\u6587\u4ef6\uff0c\u53ea\u5220\u6587\u4ef6\u4e0d\u5220\u76ee\u5f55\uff0c`config.toml` \u548c\u4f1a\u8bdd\u4fdd\u7559\u3002\n- \u5378\u8f7d\u5b98\u65b9\u811a\u672c\u88c5\u7684\u5de5\u5177\u65f6\uff0c\u6307\u5411\u540c\u4e00\u7a0b\u5e8f\u7684\u542f\u52a8\u94fe\u63a5\uff08\u4f8b\u5982 `~/.local/bin/grok`\uff09\u4f1a\u4e00\u8d77\u5220\u9664\uff0c\u4e0d\u518d\u7559\u4e0b\u5931\u6548\u7684\u547d\u4ee4\u3002\n- \u5df2\u6709\u5b98\u65b9\u5b89\u88c5\u3001\u53c8\u5728 `~/.grok/config.toml` \u91cc\u8bbe\u7f6e\u7528 npm \u66f4\u65b0\u65f6\uff0cnpm \u90a3\u4e00\u4efd\u4f1a\u88ab `grok update` \u88c5\u56de\u6765\uff0c\u786e\u8ba4\u6846\u4f1a\u63d0\u793a\u8fd9\u4e00\u70b9\u3002\n- Windows \u4e0a\u5378\u8f7d Hermes \u65f6\uff0c\u786e\u8ba4\u6846\u4f1a\u63d0\u793a\u6b63\u5728\u8fd0\u884c\u7684 Python \u53ef\u80fd\u88ab\u9501\u5b9a\u800c\u7559\u4e0b\u6587\u4ef6\uff1b\u5378\u8f7d\u547d\u4ee4\u6210\u529f\u4f46\u968f\u540e\u7684\u72b6\u6001\u68c0\u67e5\u5931\u8d25\u65f6\uff0c\u6539\u4e3a\u63d0\u793a\u300c\u5378\u8f7d\u547d\u4ee4\u5df2\u5b8c\u6210\uff0c\u8bf7\u68c0\u67e5\u7ed3\u679c\u300d\uff0c\u4e0d\u518d\u8bef\u62a5\u5378\u8f7d\u5931\u8d25\u3002\n\n**\u5347\u7ea7\u524d\u68c0\u67e5 Node \u7248\u672c\u3002** OpenClaw 2026.9.3 \u8d77\u8981\u6c42 Node 24.16 \u4ee5\u4e0a\uff0c\u65e7\u7248 Node \u4e0a\u5347\u7ea7\u5fc5\u7136\u5931\u8d25\uff0c\u300c\u5e94\u7528\u300d\u9875\u5374\u4e00\u76f4\u663e\u793a\u5347\u7ea7\u6309\u94ae\uff1b\u6ca1\u6709\u81ea\u5e26\u68c0\u67e5\u7684 npm \u5305\u66f4\u7cdf\uff0cnpm \u53ea\u8b66\u544a\u4e00\u58f0\u5c31\u88c5\u4e0a\uff0c\u88c5\u5b8c\u8fd0\u884c\u4e0d\u4e86\u3002\u73b0\u5728\u53d1\u73b0\u65b0\u7248\u672c\u65f6\u4f1a\u5148\u8bfb\u53d6\u5b83\u8981\u6c42\u7684 Node \u7248\u672c\uff0c\u548c\u8fd9\u5904\u5b89\u88c5\u5b9e\u9645\u4f7f\u7528\u7684 Node \u6bd4\u8f83\u3002\u4e0d\u6ee1\u8db3\u65f6\u8fd9\u4e00\u884c\u5199\u660e\u9700\u8981\u5148\u5347\u7ea7 Node\uff0c\u4e0d\u663e\u793a\u5347\u7ea7\u6309\u94ae\uff0c\u300c\u5168\u90e8\u5347\u7ea7\u300d\u4e5f\u4f1a\u8df3\u8fc7\u5b83\uff1b\u6267\u884c\u5347\u7ea7\u524d\u8fd8\u4f1a\u518d\u67e5\u4e00\u6b21\u3002\u8ba4\u4e0d\u51fa\u7684\u7248\u672c\u5199\u6cd5\u3001\u67e5\u8be2\u5931\u8d25\u90fd\u4e0d\u4f1a\u6321\u4f4f\u5347\u7ea7\uff1b\u539f\u751f\u7a0b\u5e8f\u3001Homebrew\u3001Bun \u5b89\u88c5\u548c WSL \u91cc\u7684\u5b89\u88c5\u4e0d\u505a\u8fd9\u9879\u68c0\u67e5\u3002\n\n**\u300c\u5e94\u7528\u300d\u9875\u66f4\u6574\u9f50\u3002** \u5378\u8f7d\u4ece\u6bcf\u884c\u7684\u7ea2\u8272\u6309\u94ae\u79fb\u8fdb\u884c\u5c3e\u7684\u300c\u2026\u300d\u83dc\u5355\u3002\u8868\u5934\u548c\u5404\u884c\u5171\u7528\u540c\u4e00\u5957\u5217\u5bbd\uff0c\u7248\u672c\u5217\u5bf9\u9f50\u4e86\uff1b\u8bfb\u53d6\u7248\u672c\u3001\u53d1\u73b0\u66f4\u65b0\u3001\u68c0\u67e5\u66f4\u65b0\u671f\u95f4\uff0c\u8868\u5934\u548c\u5404\u5217\u4e0d\u518d\u5de6\u53f3\u8df3\u52a8\uff08[#8293](https://github.com/farion1231/cc-switch/pull/8293)\uff09\u3002\u9690\u85cf\u5e94\u7528\u7684\u8bf4\u660e\u6539\u5199\u5f97\u66f4\u660e\u786e\uff1a\u53ea\u662f\u4e0d\u663e\u793a\uff0c\u4f9b\u5e94\u5546\u3001MCP \u7b49\u914d\u7f6e\u90fd\u8fd8\u5728\uff0c\u5b83\u81ea\u5df1\u7684\u914d\u7f6e\u6587\u4ef6\u4e5f\u4e0d\u4f1a\u88ab\u6539\u52a8\u3002\n\n**\u672c\u5730\u63a8\u7406\u670d\u52a1\uff1aOllama\u3001LM Studio\u3001llama.cpp\u3001vLLM\u3002** \u6dfb\u52a0\u4f9b\u5e94\u5546\u65f6\u591a\u4e86\u4e00\u4e2a\u300c\u672c\u5730\u300d\u5206\u7ec4\uff0c\u653e\u5728\u300c\u4e91\u670d\u52a1\u5546\u300d\u4e4b\u540e\uff0c\u91cc\u9762\u662f\u8fde\u63a5\u672c\u673a\u63a8\u7406\u670d\u52a1\u7684\u9884\u8bbe\uff0c\u9ed8\u8ba4\u5730\u5740\u5c31\u662f\u5404\u670d\u52a1\u7684\u9ed8\u8ba4\u7aef\u53e3\uff08Ollama 11434\u3001LM Studio 1234\u3001llama.cpp 9931\u3001vLLM 8000\uff09\uff0cllama.cpp \u65e7\u7248\u3001Homebrew \u548c Docker \u5e38\u7528\u7684 8080 \u7aef\u53e3\u4f5c\u4e3a\u5907\u9009\u5730\u5740\u3002\u8fd9\u4e9b\u670d\u52a1\u9ed8\u8ba4\u4e0d\u6821\u9a8c Key\uff0c\u9884\u8bbe\u91cc\u586b\u7684\u662f\u5404\u5bb6\u6587\u6863\u7528\u7684\u5360\u4f4d\u503c\u3002\u4f7f\u7528\u524d\u8981\u5148\u542f\u52a8\u670d\u52a1\u3001\u4e0b\u8f7d\u6a21\u578b\uff0c\u9884\u8bbe\u91cc\u7684\u9ed8\u8ba4\u6a21\u578b\u53ef\u4ee5\u6362\u6210\u4f60\u672c\u5730\u5df2\u6709\u7684\uff0c\u4e5f\u53ef\u4ee5\u70b9\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u4ece\u670d\u52a1\u8bfb\u53d6\uff1b\u4e0a\u4e0b\u6587\u7a97\u53e3\u4ee5\u542f\u52a8\u670d\u52a1\u65f6\u8bbe\u5b9a\u7684\u957f\u5ea6\u4e3a\u51c6\u3002\n\n- Claude Code\u3001Codex \u76f4\u63a5\u8fde\u672c\u5730\u670d\u52a1\u7684 Anthropic Messages \u548c Responses \u63a5\u53e3\uff0cClaude Desktop \u7ecf\u8def\u7531\u8fde\u63a5\uff1bOpenCode\u3001OpenClaw\u3001Hermes\u3001Pi \u6309\u5404\u81ea\u5df2\u6709\u7684\u5185\u7f6e\u4f9b\u5e94\u5546\u60c5\u51b5\u63d0\u4f9b\uff08\u5e94\u7528\u81ea\u5e26\u4e86\u7684\u5c31\u4e0d\u91cd\u590d\u6dfb\u52a0\uff09\u3002\n- \u53d1\u5f80\u672c\u673a\u5730\u5740\uff08localhost\u3001127.0.0.1 \u7b49\uff09\u7684\u8bf7\u6c42\u4e0d\u518d\u8d70 CC Switch \u8bbe\u7f6e\u7684\u4ee3\u7406\u6216\u7cfb\u7edf\u4ee3\u7406\u3002\u4ee5\u524d\u8bbe\u7f6e\u4e86\u4ee3\u7406\u65f6\uff0c\u8def\u7531\u8f6c\u53d1\u3001\u6d4b\u901f\u3001\u83b7\u53d6\u6a21\u578b\u8fd9\u4e9b\u8bf7\u6c42\u4f1a\u88ab\u9001\u8fdb\u4ee3\u7406\uff0c\u8fde\u4e0d\u4e0a\u672c\u5730\u670d\u52a1\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e Ollama Cloud\u3001Baseten\u3001Meta Model API\u3001DeepInfra\u3001Vercel AI Gateway\u3001Nebius Token Factory\u3001Groq\u3001SambaNova\u3001DigitalOcean\u3001Hugging Face\u3001Microsoft Foundry\u3001Fireworks AI\u3001Mistral AI\u3001Cloudflare AI Gateway\uff1bOpenCode \u65b0\u589e\u7845\u57fa\u6d41\u52a8\u56fd\u5185\u7ad9\u548c\u56fd\u9645\u7ad9\uff08[#4500](https://github.com/farion1231/cc-switch/issues/4500)\uff09\uff1bStreamLake \u65b0\u589e Codex \u9884\u8bbe\uff0c\u6240\u6709 StreamLake \u9884\u8bbe\u6539\u7528\u516c\u5f00\u7684 KAT-Coder \u63a5\u5165\u70b9\uff0c\u4e0d\u7528\u518d\u81ea\u5df1\u521b\u5efa\u63a5\u5165\u70b9 ID\u3002\n\n## \u6539\u8fdb\n\n**\u4f1a\u8bdd\u65e5\u5fd7\u626b\u63cf\uff1a\u540e\u53f0\u66f4\u7701\u8d44\u6e90\uff0c\u7528\u91cf\u9875\u66f4\u53ca\u65f6\u3002** \u4ee5\u524d\u4e0d\u7ba1\u7528\u4e0d\u7528\u5f97\u4e0a\uff0c\u540e\u53f0\u90fd\u6bcf 60 \u79d2\u628a\u4f1a\u8bdd\u65e5\u5fd7\u626b\u4e00\u904d\uff0c\u957f\u65f6\u95f4\u5f00\u7740 CC Switch \u65f6\uff0c\u8fd9\u90e8\u5206\u8bfb\u76d8\u548c CPU \u4e00\u76f4\u5728\u6d88\u8017\uff1b\u800c\u7528\u91cf\u9875\u7684\u300c\u81ea\u52a8\u5237\u65b0\u95f4\u9694\u300d\u53ea\u662f\u91cd\u65b0\u67e5\u4e00\u904d\u6570\u636e\u5e93\uff0c\u4f1a\u8bdd\u7528\u91cf\u4ecd\u7136\u8981\u7b49\u8fd9 60 \u79d2\uff0c\u9009 5 \u79d2\u4e5f\u6ca1\u7528\uff08[#8301](https://github.com/farion1231/cc-switch/pull/8301)\uff09\u3002\u73b0\u5728\u8fd9\u4e2a\u8bbe\u7f6e\u6539\u540d\u4e3a\u300c\u4f1a\u8bdd\u65e5\u5fd7\u626b\u63cf\u95f4\u9694\u300d\uff1a\u6253\u5f00\u7528\u91cf\u9875\u65f6\u7acb\u5373\u626b\u63cf\u4e00\u6b21\uff0c\u7a97\u53e3\u91cd\u65b0\u663e\u793a\u65f6\u518d\u626b\u4e00\u6b21\uff0c\u4e4b\u540e\u6309\u6240\u9009\u95f4\u9694\uff085\u300110\u300130\u300160 \u79d2\uff0c\u9ed8\u8ba4 60 \u79d2\uff09\u626b\u63cf\uff1b\u540e\u53f0\u626b\u63cf\u6539\u4e3a\u6bcf 10 \u5206\u949f\u4e00\u6b21\uff0c\u53ea\u4f5c\u515c\u5e95\uff0c\u5e73\u65f6\u7684\u540e\u53f0\u6d88\u8017\u660e\u663e\u51cf\u5c11\u3002\u300c\u5173\u95ed\u300d\u9009\u9879\u53bb\u6389\u4e86\uff0c\u5173\u95ed\u300c\u81ea\u52a8\u626b\u63cf\u4f1a\u8bdd\u65e5\u5fd7\u300d\u65f6\u4e0d\u663e\u793a\u8fd9\u4e2a\u8bbe\u7f6e\u3002\u7ecf\u8def\u7531\u7684\u7528\u91cf\u672c\u6765\u5c31\u662f\u5b9e\u65f6\u8bb0\u5f55\u7684\uff0c\u4e0d\u53d7\u5f71\u54cd\u3002\n\n**\u4f9b\u5e94\u5546\u641c\u7d22\u6846\u4e0d\u518d\u906e\u6321\u6216\u63a8\u5f00\u5361\u7247\u3002** \u641c\u7d22\u6846\u4ee5\u524d\u6d6e\u5728\u5217\u8868\u4e0a\u65b9\uff0c\u4f1a\u6321\u4f4f\u7b2c\u4e00\u5f20\u5361\u7247\u7684\u7f16\u8f91\u548c\u66f4\u591a\u64cd\u4f5c\u6309\u94ae\uff08[#8100](https://github.com/farion1231/cc-switch/issues/8100)\uff09\u3002\u73b0\u5728\u5b83\u653e\u5728\u5361\u7247\u4e0a\u65b9\u90a3\u4e00\u884c\u7684\u6700\u53f3\u7aef\uff1aClaude Code\u3001Codex\u3001Gemini CLI\u3001Grok Build \u653e\u5728\u6a21\u5f0f\u90a3\u4e00\u884c\uff0c\u5176\u4ed6\u5e94\u7528\u653e\u5728\u300c\u5df2\u6dfb\u52a0\u300d\u6807\u9898\u90a3\u4e00\u884c\u3002\u6253\u5f00\u641c\u7d22\u65f6\u5361\u7247\u65e2\u4e0d\u88ab\u6321\u4f4f\uff0c\u4e5f\u4e0d\u4f1a\u88ab\u5f80\u4e0b\u63a8\u3002\n\n**\u754c\u9762\u8bed\u8a00\u3002** \u65b0\u589e\u571f\u8033\u5176\u8bed\uff0c\u7531\u793e\u533a\u7ffb\u8bd1\uff0c\u8fd8\u6ca1\u7ffb\u8bd1\u7684\u6587\u5b57\u663e\u793a\u82f1\u6587\uff08[#8208](https://github.com/farion1231/cc-switch/pull/8208)\uff09\u3002\u9996\u6b21\u542f\u52a8\u65f6\uff0c\u5982\u679c\u7cfb\u7edf\u8bed\u8a00\u662f\u754c\u9762\u4e0d\u652f\u6301\u7684\u8bed\u8a00\uff08\u5fb7\u8bed\u3001\u6cd5\u8bed\u3001\u97e9\u8bed\u7b49\uff09\uff0c\u754c\u9762\u548c\u6258\u76d8\u6539\u7528\u82f1\u6587\uff0c\u4e0d\u518d\u9ed8\u8ba4\u7b80\u4f53\u4e2d\u6587\uff1b\u5df2\u7ecf\u9009\u8fc7\u7684\u8bed\u8a00\u4e0d\u53d7\u5f71\u54cd\u3002\n\n## \u4fee\u590d\n\n- **\u4e91\u540c\u6b65\u6062\u590d Skills \u5931\u8d25\u4e00\u6b21\u4e4b\u540e\uff0c\u518d\u4e5f\u6062\u590d\u4e0d\u4e86**\uff08[#8153](https://github.com/farion1231/cc-switch/issues/8153)\uff09\u3002Windows \u4e0a\u4e0b\u8f7d\u4e91\u540c\u6b65\u65f6\u5982\u679c\u9047\u5230\u6587\u4ef6\u88ab\u5360\u7528\uff08os error 5\uff09\uff0c\u4f1a\u7559\u4e0b `skills.bak`\uff0c\u4e4b\u540e\u6bcf\u6b21\u6062\u590d\u90fd\u5728\u5904\u7406\u5b83\u65f6\u5931\u8d25\u3002\u73b0\u5728\u6062\u590d\u65f6\u628a\u4e91\u7aef\u7684 Skills \u5b8c\u6574\u590d\u5236\u5230\u5355\u72ec\u7684\u76ee\u5f55\u518d\u6574\u4f53\u66ff\u6362\uff0c\u4e0d\u518d\u590d\u7528 `skills.bak`\uff1b\u66ff\u6362\u548c\u56de\u6eda\u90fd\u5931\u8d25\u65f6\u4fdd\u7559\u539f\u6765\u7684\u5b8c\u6574\u526f\u672c\uff0c\u5e76\u5728\u62a5\u9519\u91cc\u7ed9\u51fa\u5b83\u7684\u4f4d\u7f6e\u3002\n- **Claude Code \u7ecf\u8def\u7531\u8fde\u63a5 OpenAI Responses \u4e0a\u6e38\u65f6\uff0c\u56de\u590d\u5df2\u7ecf\u7ed3\u675f\u53c8\u6536\u5230\u4e00\u6761\u9519\u8bef**\uff08[#8138](https://github.com/farion1231/cc-switch/pull/8138)\uff09\u3002\u4e0a\u6e38\u5728\u53d1\u5b8c\u7ed3\u675f\u4e8b\u4ef6\u540e\u624d\u65ad\u5f00\u8fde\u63a5\u65f6\uff0cCC Switch \u4f1a\u5728\u6b63\u5e38\u7ed3\u675f\u4e4b\u540e\u518d\u8865\u53d1\u4e00\u4e2a\u6d41\u9519\u8bef\uff0c\u5ba2\u6237\u7aef\u53ef\u80fd\u628a\u5b8c\u6574\u7684\u56de\u590d\u5f53\u6210\u5931\u8d25\u3002\u73b0\u5728\u7ed3\u675f\u4e4b\u540e\u7684\u8fde\u63a5\u9519\u8bef\u4e0d\u518d\u8f6c\u53d1\u3002\n- **\u5728 MCP\u3001\u63d0\u793a\u8bcd\u3001\u5b9a\u4ef7\u7f16\u8f91\u9875\u518d\u6b21\u70b9\u51fb\u4fa7\u680f\u7684\u5f53\u524d\u9875\u9762\uff0c\u4f1a\u4e22\u6389\u300c\u6709\u672a\u4fdd\u5b58\u7684\u4fee\u6539\u300d\u7684\u4fdd\u62a4**\uff08[#7900](https://github.com/farion1231/cc-switch/pull/7900)\uff09\u3002\u4ee5\u524d\u4f1a\u5f39\u51fa\u653e\u5f03\u66f4\u6539\u7684\u786e\u8ba4\uff0c\u786e\u8ba4\u540e\u7f16\u8f91\u9875\u8fd8\u5f00\u7740\uff0c\u4f46\u4e4b\u540e\u79bb\u5f00\u9875\u9762\u5c31\u4e0d\u518d\u63d0\u9192\uff0c\u6539\u52a8\u76f4\u63a5\u4e22\u5931\u3002\u73b0\u5728\u70b9\u51fb\u5f53\u524d\u9875\u9762\u4ec0\u4e48\u4e5f\u4e0d\u505a\u3002\n- **\u4e0a\u6e38\u8fd4\u56de\u7a7a\u9519\u8bef\u5185\u5bb9\u65f6\uff0c\u9519\u8bef\u4fe1\u606f\u7ed3\u5c3e\u662f\u4e00\u4e2a\u5b64\u96f6\u96f6\u7684\u5192\u53f7**\uff08[#6910](https://github.com/farion1231/cc-switch/pull/6910)\uff09\uff0c\u770b\u8d77\u6765\u50cf CC Switch \u541e\u6389\u4e86\u4e0a\u6e38\u7684\u8bf4\u660e\u3002\u73b0\u5728\u4f1a\u5199\u660e\u300c\u4e0a\u6e38\u672a\u8fd4\u56de\u9519\u8bef\u5185\u5bb9\u300d\u3002\n- **Pi \u4f1a\u8bdd\u5386\u53f2\u7684\u901f\u5ea6\u4e00\u76f4\u663e\u793a\u300c\u2014\u300d**\uff08[#8278](https://github.com/farion1231/cc-switch/pull/8278)\uff09\u3002Pi \u4f1a\u8bdd\u5bfc\u5165\u65f6\u8017\u65f6\u56fa\u5b9a\u8bb0\u6210 0\uff0c\u73b0\u5728\u6309\u6bcf\u6761\u56de\u590d\u7684\u8bf7\u6c42\u5f00\u59cb\u65f6\u95f4\u548c\u5199\u5165\u65f6\u95f4\u4f30\u7b97\u8017\u65f6\uff0c\u7b26\u5408\u6761\u4ef6\u7684\u8bb0\u5f55\u80fd\u663e\u793a\u4f30\u7b97\u901f\u5ea6\u3002\n- **Pi \u914d\u7f6e\u76ee\u5f55\u6307\u5411 WSL \u65f6\uff0c\u6bcf\u6b21\u5199\u5165\u90fd\u5148\u5c1d\u8bd5 WSL \u4e0d\u652f\u6301\u7684\u7cfb\u7edf\u8c03\u7528**\uff08[#8245](https://github.com/farion1231/cc-switch/issues/8245)\uff09\u3002\u542f\u7528 Skills\u3001\u4fdd\u5b58 AGENTS.md \u65f6\uff0c\u73b0\u5728\u76f4\u63a5\u4f7f\u7528\u5728 WSL \u8def\u5f84\u4e0a\u53ef\u7528\u7684\u5199\u6cd5\uff1b\u81ea\u52a8\u6a21\u5f0f\u4e0b\u540c\u6b65 Skills \u6539\u4e3a\u590d\u5236\uff0c\u624b\u52a8\u9009\u4e86\u8f6f\u94fe\u63a5\u7684\u4ecd\u4f1a\u660e\u786e\u62a5\u9519\u3002\n- **Windows \u4e0a\u81ea\u52a8\u66f4\u65b0\u91cd\u542f\u540e\uff0c\u8bfb\u53d6 OpenCode\u3001Codex \u81ea\u5e26\u7684\u6a21\u578b\u5217\u8868\u65f6\u4ecd\u53ef\u80fd\u627e\u4e0d\u5230\u5de5\u5177**\uff08[#8262](https://github.com/farion1231/cc-switch/pull/8262)\uff09\u3002v4.0.11 \u4fee\u597d\u4e86\u5b89\u88c5\u548c\u5347\u7ea7\uff0c\u8fd9\u6b21\u628a\u8865\u5168\u540e\u7684 PATH \u4e5f\u7528\u5230\u8fd9\u4e24\u5904\uff1bPATH \u91cc `%PNPM_HOME%` \u8fd9\u6837\u7684\u53d8\u91cf\u5f15\u7528\u4e5f\u4f1a\u6309\u7528\u6237\u548c\u7cfb\u7edf\u73af\u5883\u53d8\u91cf\u5c55\u5f00\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n- \u6ca1\u6253\u5f00\u7528\u91cf\u9875\u65f6\uff0c\u540e\u53f0\u6bcf 10 \u5206\u949f\u626b\u63cf\u4e00\u6b21\u4f1a\u8bdd\u65e5\u5fd7\uff08\u4ee5\u524d\u662f 60 \u79d2\uff09\uff0c\u6240\u4ee5\u4e0d\u7ecf\u8def\u7531\u7684\u7528\u91cf\u6700\u591a\u665a 10 \u5206\u949f\u8fdb\u5165\u7edf\u8ba1\uff1b\u6253\u5f00\u7528\u91cf\u9875\u4f1a\u7acb\u5373\u626b\u63cf\u3002\u4ee5\u524d\u9009\u4e86\u300c\u5173\u95ed\u300d\u7684\uff0c\u6539\u4e3a 60 \u79d2\u3002\n- Pi \u7684\u901f\u5ea6\u4f30\u7b97\u53ea\u5bf9\u5347\u7ea7\u540e\u65b0\u5bfc\u5165\u7684\u8bb0\u5f55\u751f\u6548\uff0c\u5df2\u7ecf\u5bfc\u5165\u7684\u8bb0\u5f55\u4ecd\u663e\u793a\u300c\u2014\u300d\u3002\n- \u65b0\u9884\u8bbe\u548c StreamLake \u7684\u6539\u52a8\u53ea\u5f71\u54cd\u65b0\u6dfb\u52a0\u7684\u4f9b\u5e94\u5546\uff0c\u5df2\u6dfb\u52a0\u7684 StreamLake \u4f9b\u5e94\u5546\u4ecd\u4f7f\u7528\u539f\u6765\u7684\u63a5\u5165\u70b9 ID\u3002\n- Claude Desktop \u9009\u62e9\u672c\u5730\u9884\u8bbe\u65f6\uff0c\u8868\u5355\u4f1a\u6e05\u7a7a Key\uff0c\u9700\u8981\u624b\u52a8\u586b\u4e0a\u5360\u4f4d\u503c\uff1aOllama \u586b `ollama`\uff0cLM Studio \u586b `lmstudio`\uff0cllama.cpp \u586b `no-key`\uff0cvLLM \u586b `dummy`\uff1b\u542f\u52a8\u670d\u52a1\u65f6\u8bbe\u4e86 Key \u7684\uff0c\u586b\u4f60\u8bbe\u7684\u503c\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @funkpopo\uff08\u7528\u91cf\u9875\u4f1a\u8bdd\u626b\u63cf\u95f4\u9694\u3001\u300c\u5e94\u7528\u300d\u9875\u5217\u5bf9\u9f50\u3001\u5378\u8f7d\u53cd\u9988\u4e0e Windows