,"label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:c33cdb0c7d34fc65dbd9972c5735dd1bbf8a5db05011aa4c9976b82e4715d78f","download_count":8684,"created_at":"2026-10-21T16:16:26Z","updated_at":"2026-10-21T16:16:26Z"}],"body":"# CC Switch v4.0.18\n\n\u672c\u7248\u672c\u65b0\u589e\u5bf9 Antigravity CLI\uff08agy\uff09\u7684\u652f\u6301\uff0c\u5b83\u662f CC Switch \u7ba1\u7406\u7684\u7b2c 11 \u4e2a\u5e94\u7528\u3002\u4f60\u53ef\u4ee5\u4e3a agy \u6dfb\u52a0\u5b98\u65b9\u767b\u5f55\u5361\u548c\u7b2c\u4e09\u65b9 API Key \u5361\u3002**\u6ce8\u610f\uff1aAntigravity \u7684\u4f9b\u5e94\u5546\u53ea\u5728\u4ece CC Switch \u5361\u7247\u300c\u4f7f\u7528\u6b64\u4f9b\u5e94\u5546\u6253\u5f00\u7ec8\u7aef\u300d\u542f\u52a8\u7684 agy \u91cc\u751f\u6548**\uff0c\u5728\u5176\u4ed6\u7ec8\u7aef\u91cc\u76f4\u63a5\u8fd0\u884c `agy` \u4e0d\u4f1a\u7528\u5230\u5b83\uff1bMCP\u3001Skills \u548c\u63d0\u793a\u8bcd\u540c\u6b65\u7ed9 agy\uff0c\u4f1a\u8bdd\u53ef\u4ee5\u6d4f\u89c8\u548c\u6062\u590d\uff0c\u7528\u91cf\u4ece\u4f1a\u8bdd\u65e5\u5fd7\u5bfc\u5165\uff1b\u300c\u5e94\u7528\u300d\u9875\u53ef\u4ee5\u5b89\u88c5\u3001\u5347\u7ea7\u3001\u5378\u8f7d agy\u3002macOS \u4e0a\uff0c\u6388\u6743\u4e2d\u5fc3\u8fd8\u80fd\u7ba1\u7406\u591a\u4e2a Antigravity \u8d26\u53f7\uff1a\u4e00\u952e\u5207\u6362 agy \u7684\u767b\u5f55\uff0c\u67e5\u770b\u6bcf\u4e2a\u8d26\u53f7\u7684\u989d\u5ea6\uff0c\u628a\u5b98\u65b9\u5361\u7ed1\u5b9a\u5230\u67d0\u4e2a\u8d26\u53f7\u3002\u53e6\u5916\uff0cWindows \u4e0a\u7684\u5e94\u7528\u5185\u66f4\u65b0\u4e0d\u4f1a\u518d\u56e0\u4e3a\u6587\u4ef6\u88ab\u5360\u7528\u800c\u91cd\u542f\u7535\u8111\uff0cMSI \u5b89\u88c5\u65f6\u53ef\u4ee5\u9009\u62e9\u4e0d\u521b\u5efa\u684c\u9762\u5feb\u6377\u65b9\u5f0f\uff1b\u9875\u5934\u6539\u4e3a\u5728\u5e94\u7528\u540d\u65c1\u7528\u5c0f\u5fbd\u7ae0\u663e\u793a\u5b9e\u9645\u7684\u8fde\u63a5\u3002\u8fd8\u4fee\u590d\u4e86 macOS \u4e0a\u5e76\u53d1\u8bf7\u6c42\u591a\u65f6\u8def\u7531\u56e0\u6587\u4ef6\u53e5\u67c4\u8017\u5c3d\u800c\u5931\u8d25\u3001\u4ece\u8bbf\u8fbe\u542f\u52a8\u65f6\u300c\u91cd\u542f Codex \u5b88\u62a4\u8fdb\u7a0b\u300d\u62a5 `env: node`\u3001Claude Code \u4f1a\u8bdd\u7528 `/cd` \u6362\u76ee\u5f55\u540e\u4ecd\u5f52\u5728\u65e7\u9879\u76ee\u4e0b\u3001Windows \u4e0a\u6253\u5f00\u7ec8\u7aef\u540e\u4e00\u76f4\u8f6c\u5708\u76f4\u5230\u5173\u6389\u7ec8\u7aef\u7a97\u53e3\u3001Codex \u672a\u4f7f\u7528\u7684\u989d\u5ea6\u7a97\u53e3\u663e\u793a\u5012\u8ba1\u65f6\u3001DeepSeek V4.1 Flash \u6ca1\u6709\u8ba1\u4ef7\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.18-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.18-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n### Antigravity CLI\uff08agy\uff09\n\nGoogle \u7684 Antigravity CLI\uff08\u547d\u4ee4\u662f `agy`\uff09\u73b0\u5728\u662f\u4e00\u4e2a\u72ec\u7acb\u7684\u5e94\u7528\uff0c\u6709\u81ea\u5df1\u7684\u4f9b\u5e94\u5546\u3001MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u3001\u4f1a\u8bdd\u548c\u7528\u91cf\uff0c\u548c Gemini CLI \u5206\u5f00\u7ba1\u7406\uff08[#8268](https://github.com/farion1231/cc-switch/pull/8268)\u3001[#2959](https://github.com/farion1231/cc-switch/issues/2959)\uff09\u3002\n\n> **\u26a0\ufe0f Antigravity \u7684\u4f9b\u5e94\u5546\u5fc5\u987b\u4ece CC Switch \u4ee5\u7ec8\u7aef\u542f\u52a8\u624d\u751f\u6548\u3002** \u548c\u5176\u4ed6\u5e94\u7528\u4e0d\u540c\uff0cCC Switch \u4e0d\u6539 agy \u81ea\u5df1\u7684\u8bbe\u7f6e\u6587\u4ef6\uff0c\u6240\u4ee5 Antigravity \u7684\u5361\u7247\u6ca1\u6709\u300c\u5207\u6362\u300d\uff0c\u4e5f\u6ca1\u6709\u300c\u4f7f\u7528\u4e2d\u300d\u3002\u8981\u7528\u54ea\u5f20\u5361\uff0c\u5c31\u70b9\u90a3\u5f20\u5361\u4e0a\u7684\u300c\u4f7f\u7528\u6b64\u4f9b\u5e94\u5546\u6253\u5f00\u7ec8\u7aef\u300d\uff0c\u5728\u5f39\u51fa\u7684\u7ec8\u7aef\u91cc\u8fd0\u884c\u7684 agy \u624d\u4f1a\u7528\u8fd9\u5bb6\u4f9b\u5e94\u5546\uff1b\u5728\u5176\u4ed6\u7ec8\u7aef\u91cc\u76f4\u63a5\u8fd0\u884c `agy`\uff0c\u7528\u7684\u4ecd\u662f agy \u81ea\u5df1\u7684 Google \u767b\u5f55\u548c\u8bbe\u7f6e\u3002\uff08macOS \u4e0a\u5728\u6388\u6743\u4e2d\u5fc3\u5207\u6362\u8d26\u53f7\u662f\u4f8b\u5916\uff1a\u5b83\u6539\u7684\u662f agy \u7684\u5168\u5c40\u767b\u5f55\uff0c\u89c1\u4e0b\u4e00\u8282\u3002\uff09\n\n- **\u4e24\u79cd\u4f9b\u5e94\u5546\u5361\u3002** \u5b98\u65b9\u767b\u5f55\u5361\u7528 agy \u81ea\u5df1\u7684 Google \u767b\u5f55\uff0c\u6253\u5f00\u7ec8\u7aef\u65f6\u7528\u5361\u4e0a\u9009\u7684\u6a21\u578b\u542f\u52a8 agy\uff0c\u53ea\u5bf9\u8fd9\u6b21\u4f1a\u8bdd\u751f\u6548\uff1b\u7b2c\u4e09\u65b9\u5361\u586b\u517c\u5bb9 Gemini API \u7684\u5730\u5740\u548c Key\uff0c\u5730\u5740\u7559\u7a7a\u7528 Google \u9ed8\u8ba4\u7684 API\uff0cKey \u548c\u5730\u5740\u53ea\u4ea4\u7ed9\u8fd9\u4e2a\u7ec8\u7aef\u91cc\u7684 agy\uff0c\u4e0d\u5199\u8fdb agy \u7684\u914d\u7f6e\u548c shell \u542f\u52a8\u6587\u4ef6\uff08\u542f\u52a8\u7528\u7684\u4e34\u65f6\u6587\u4ef6\u4f1a\u81ea\u52a8\u5220\u9664\uff09\u3002\u6a21\u578b\u5217\u8868\u6765\u81ea agy \u81ea\u5e26\u7684\u6a21\u578b\u76ee\u5f55\uff0c\u586b\u7684\u662f agy \u8ba4\u5f97\u7684\u663e\u793a\u540d\u79f0\u3002\n- **MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u3002** \u540c\u6b65\u5230 `~/.gemini/config`\uff0c\u8fd9\u662f agy \u7684\u5168\u5c40\u5b9a\u5236\u76ee\u5f55\uff0c\u53ef\u80fd\u548c\u540c\u4e00\u53f0\u7535\u8111\u4e0a\u7684 Antigravity IDE \u5171\u7528\u3002\u7b2c\u4e09\u65b9\u5361\u542f\u52a8\u7684 agy \u540c\u6837\u80fd\u7528\u8fd9\u4e9b MCP\u3001Skills \u548c\u63d0\u793a\u8bcd\u3002\n- **\u4f1a\u8bdd\u3002** \u53ef\u4ee5\u6d4f\u89c8 agy \u548c Antigravity IDE \u7684\u4f1a\u8bdd\uff0c\u53ea\u663e\u793a\u4f60\u8f93\u5165\u7684\u5185\u5bb9\uff0c\u4e0d\u663e\u793a agy \u81ea\u5df1\u9644\u52a0\u7684\u4e0a\u4e0b\u6587\uff1b\u7b2c\u4e09\u65b9\u5361\u542f\u52a8\u7684\u4f1a\u8bdd\u4e5f\u80fd\u627e\u5230\uff0c\u5e76\u7528\u540c\u4e00\u5f20\u5361\u6062\u590d\u3002\n- **\u7528\u91cf\u3002** \u4ece\u4f1a\u8bdd\u65e5\u5fd7\u5bfc\u5165\uff08\u5305\u62ec Antigravity IDE \u7684\u4f1a\u8bdd\uff09\uff0c\u6309\u6bcf\u8f6e\u9009\u62e9\u7684\u6a21\u578b\u8bb0\u8d26\uff0c\u8d39\u7528\u6309\u4ef7\u683c\u8868\u91cc\u5bf9\u5e94\u6a21\u578b\u7684 API \u4ef7\u683c\u4f30\u7b97\u3002\n- **\u5b98\u65b9\u989d\u5ea6\u3002** \u5728\u5b98\u65b9\u5361\u4e0a\u5f00\u542f\u989d\u5ea6\u67e5\u8be2\u540e\uff0c\u663e\u793a Gemini \u548c Claude/GPT \u4e24\u7ec4\u989d\u5ea6\uff0c\u6bcf\u7ec4\u6709 5 \u5c0f\u65f6\u548c\u6bcf\u5468\u4e24\u4e2a\u7a97\u53e3\uff1b\u5361\u7247\u4e0a\u6bcf\u7ec4\u53ea\u663e\u793a\u5269\u5f97\u5c11\u7684\u90a3\u4e2a\u7a97\u53e3\uff0c\u70b9\u5f00\u4e0b\u62c9\u53ef\u4ee5\u770b\u5168\u90e8\u56db\u4e2a\u7a97\u53e3\u548c\u5404\u81ea\u7684\u91cd\u7f6e\u65f6\u95f4\u3002\n- **\u300c\u5e94\u7528\u300d\u9875\u7ba1\u7406 agy\u3002** \u7528\u5b98\u65b9\u5b89\u88c5\u811a\u672c\u5b89\u88c5\uff0c\u7528 `agy update` \u5347\u7ea7\uff08Homebrew \u5b89\u88c5\u7684\u4e5f\u4e00\u6837\uff09\uff0c\u53ef\u4ee5\u5378\u8f7d\u3002\n- \u6df1\u94fe\u63a5\u4e5f\u53ef\u4ee5\u5bfc\u5165 agy \u7684\u4f9b\u5e94\u5546\u3001MCP \u548c\u63d0\u793a\u8bcd\u3002\n\n### \u6388\u6743\u4e2d\u5fc3\u7ba1\u7406\u591a\u4e2a Antigravity \u8d26\u53f7\uff08macOS\uff09\n\nagy \u540c\u65f6\u53ea\u80fd\u767b\u5f55\u4e00\u4e2a\u8d26\u53f7\u3002\u73b0\u5728\u6388\u6743\u4e2d\u5fc3\u591a\u4e86 Antigravity \u4e00\u7ec4\uff1a\u70b9\u300c\u7528 Google \u767b\u5f55\u300d\u6216\u300c\u6dfb\u52a0\u8d26\u53f7\u300d\uff0c\u5728\u6d4f\u89c8\u5668\u91cc\u6dfb\u52a0\u8d26\u53f7\uff0cagy \u91cc\u5df2\u7ecf\u767b\u5f55\u7684\u8d26\u53f7\u4e5f\u4f1a\u81ea\u52a8\u6536\u8fdb\u6765\u3002\n\n- **\u5207\u6362\u3002** \u5728\u8d26\u53f7\u7684\u83dc\u5355\u91cc\u9009\u300c\u5207\u6362 agy \u5230\u8fd9\u4e2a\u8d26\u53f7\u300d\uff0c\u4e4b\u540e\u65b0\u5f00\u7684 agy \u90fd\u7528\u8fd9\u4e2a\u53f7\u3002\u539f\u6765\u767b\u5f55\u7684\u53f7\u4f1a\u5148\u6536\u56de\u6388\u6743\u4e2d\u5fc3\uff0c\u5207\u8d70\u4e5f\u4e0d\u4f1a\u4e22\u3002\u5982\u679c agy \u6b63\u5728\u8fd0\u884c\uff0c\u4f1a\u63d0\u9192\u4f60\uff1a\u5df2\u7ecf\u6253\u5f00\u7684 agy \u8fd8\u7528\u539f\u6765\u7684\u53f7\uff0c\u800c\u4e14\u53ef\u80fd\u628a\u539f\u6765\u7684\u53f7\u5199\u56de\u53bb\uff0c\u6700\u597d\u5148\u9000\u51fa\u3002\n- **\u6bcf\u4e2a\u8d26\u53f7\u7684\u989d\u5ea6\u3002** \u6bcf\u4e00\u884c\u90fd\u663e\u793a\u81ea\u5df1\u7684\u989d\u5ea6\uff0c\u4e0d\u7528\u5207\u8fc7\u53bb\u624d\u80fd\u770b\u3002\u67e5\u989d\u5ea6\u53ea\u8bfb\u989d\u5ea6\uff0c\u4e0d\u8c03\u7528\u6a21\u578b\u3002\u4e0d\u80fd\u4f7f\u7528 Antigravity \u7684\u8d26\u53f7\uff08\u6bd4\u5982\u6709\u5e74\u9f84\u9650\u5236\u7684\uff09\u4f1a\u663e\u793a Google \u7ed9\u51fa\u7684\u539f\u56e0\uff0c\u800c\u4e0d\u662f\u4e00\u53e5\u770b\u4e0d\u61c2\u7684 403\u3002\n- **\u628a\u5b98\u65b9\u5361\u7ed1\u5b9a\u5230\u8d26\u53f7\u3002** \u5b98\u65b9\u5361\u7684\u8868\u5355\u91cc\u53ef\u4ee5\u9009\u4e00\u4e2a\u8d26\u53f7\uff1a\u6253\u5f00\u7ec8\u7aef\u524d\u4f1a\u5148\u628a agy \u7684\u767b\u5f55\u5207\u5230\u8fd9\u4e2a\u53f7\uff0c\u5df2\u7ecf\u662f\u5b83\u5c31\u4e0d\u518d\u5199\u5165\uff1b\u5361\u7247\u4e0a\u663e\u793a\u7684\u4e5f\u662f\u8fd9\u4e2a\u53f7\u7684\u989d\u5ea6\u3002\u4e0d\u9009\u5c31\u8ddf\u968f agy \u5f53\u524d\u7684\u767b\u5f55\u3002\u5361\u7247\u540c\u6b65\u5230\u53e6\u4e00\u53f0\u7535\u8111\u540e\uff0c\u90a3\u53f0\u7535\u8111\u4e0a\u4e5f\u6dfb\u52a0\u4e86\u8fd9\u4e2a\u53f7\u624d\u80fd\u7528\uff0c\u5426\u5219\u6253\u5f00\u7ec8\u7aef\u65f6\u4f1a\u63d0\u793a\uff0c\u4e0d\u4f1a\u7528\u522b\u7684\u53f7\u542f\u52a8\u3002\n- **\u5220\u9664\u8d26\u53f7\u4e0d\u4f1a\u8ba9 agy \u9000\u51fa\u767b\u5f55\u3002** CC Switch \u53ea\u5220\u6389\u81ea\u5df1\u4fdd\u5b58\u7684\u90a3\u4e00\u4efd\u3002\n\n## \u6539\u8fdb\n\n**Windows \u4e0a\u7684\u5e94\u7528\u5185\u66f4\u65b0\u4e0d\u4f1a\u518d\u91cd\u542f\u7535\u8111**\uff08[#8628](https://github.com/farion1231/cc-switch/pull/8628)\u3001[#8534](https://github.com/farion1231/cc-switch/issues/8534)\uff09\u3002\u5e94\u7528\u5185\u66f4\u65b0\u4ee5\u4e0d\u5f39\u5bf9\u8bdd\u6846\u7684\u65b9\u5f0f\u8fd0\u884c MSI \u5b89\u88c5\u5305\uff0c\u4ee5\u524d\u53ea\u8981\u5b89\u88c5\u76ee\u5f55\u91cc\u6709\u6587\u4ef6\u8fd8\u88ab\u5360\u7528\uff0cWindows Installer \u5c31\u4f1a\u4e0d\u63d0\u793a\u76f4\u63a5\u91cd\u542f\u7535\u8111\u3002\u73b0\u5728\u5b89\u88c5\u5305\u672c\u8eab\u7981\u6b62\u91cd\u542f\uff0c\u4ece\u65e7\u7248\u672c\u66f4\u65b0\u5230\u8fd9\u4e00\u7248\u65f6\u4e5f\u751f\u6548\u3002\n\n**MSI \u5b89\u88c5\u65f6\u53ef\u4ee5\u4e0d\u521b\u5efa\u684c\u9762\u5feb\u6377\u65b9\u5f0f**\uff08[#8601](https://github.com/farion1231/cc-switch/pull/8601)\u3001[#5667](https://github.com/farion1231/cc-switch/issues/5667)\uff09\u3002\u5b89\u88c5\u76ee\u5f55\u9875\u591a\u4e86\u300cCreate a desktop shortcut\u300d\u9009\u9879\uff0c\u9ed8\u8ba4\u52fe\u4e0a\uff1b\u9759\u9ed8\u5b89\u88c5\u53ef\u4ee5\u52a0 `CREATEDESKTOPSHORTCUT=0` \u8df3\u8fc7\u3002\u5347\u7ea7\u65f6\u4fdd\u7559\u73b0\u5728\u7684\u72b6\u6001\uff1a\u4f60\u5220\u6389\u7684\u5feb\u6377\u65b9\u5f0f\u4e0d\u4f1a\u88ab\u91cd\u65b0\u521b\u5efa\u3002\u684c\u9762\u76ee\u5f55\u5199\u4e0d\u8fdb\u53bb\u65f6\u4e5f\u4e0d\u4f1a\u518d\u8ba9\u5b89\u88c5\u5931\u8d25\u3002\n\n**\u9875\u5934\u663e\u793a\u5b9e\u9645\u7684\u8fde\u63a5**\uff08[#8634](https://github.com/farion1231/cc-switch/pull/8634)\uff09\u3002\u5b9e\u9645\u8fde\u5230\u54ea\u91cc\uff0c\u4ece\u6a21\u5f0f\u6807\u7b7e\u65c1\u632a\u5230\u5e94\u7528\u540d\u65c1\uff0c\u7528\u5f53\u524d\u6a21\u5f0f\uff08\u76f4\u8fde\u3001\u8def\u7531\u3001\u805a\u5408\uff09\u7684\u989c\u8272\u753b\u6210\u4e00\u4e2a\u5c0f\u5fbd\u7ae0\uff1b\u5207\u5230\u522b\u7684\u6a21\u5f0f\u6807\u7b7e\u770b\u65f6\u4e5f\u4e00\u76f4\u663e\u793a\uff0c\u540d\u79f0\u592a\u957f\u4f1a\u622a\u65ad\uff0c\u9f20\u6807\u60ac\u505c\u53ef\u4ee5\u770b\u5230\u5168\u90e8\u3002\n\n**\u7cbe\u7b80\u754c\u9762\u4e0a\u7684\u8bf4\u660e\u6587\u5b57**\uff08[#8633](https://github.com/farion1231/cc-switch/pull/8633)\uff09\u3002\u4f9b\u5e94\u5546\u8868\u5355\u3001OpenClaw\u3001\u6bcf\u65e5\u8bb0\u5fc6\u3001\u540c\u6b65\u548c\u6574\u6d41\u5668\u8bbe\u7f6e\u91cc\uff0c\u548c\u65c1\u8fb9\u6807\u7b7e\u3001\u6807\u9898\u91cd\u590d\u7684\u8bf4\u660e\u53bb\u6389\u4e86\uff0c\u8865\u5145\u8bf4\u660e\u632a\u8fdb\u5df2\u6709\u7684\u5e2e\u52a9\u5361\u7247\uff1b\u4f1a\u5f71\u54cd\u7ed3\u679c\u7684\u63d0\u793a\uff08\u8d39\u7528\u3001\u91cd\u542f\u3001\u540c\u6b65\u3001\u5220\u9664\u7b49\uff09\u7167\u5e38\u663e\u793a\u3002\n\n**\u7528\u91cf\u9875\u7684\u5e94\u7528\u7b5b\u9009\u53ea\u5217\u300c\u5e94\u7528\u300d\u9875\u91cc\u663e\u793a\u7684\u5e94\u7528\u3002** \u548c\u4f1a\u8bdd\u7ba1\u7406\u4e00\u6837\uff1a\u663e\u793a Claude Desktop \u65f6 Claude Code \u4e5f\u4fdd\u7559\uff0c\u5f53\u524d\u9009\u4e2d\u7684\u5e94\u7528\u5373\u4f7f\u88ab\u9690\u85cf\u4e5f\u4e0d\u4f1a\u6d88\u5931\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e DIT.ai\u3001hao.ai\u3002\n\n## \u4fee\u590d\n\n- **macOS \u4e0a\u5e76\u53d1\u8bf7\u6c42\u591a\u65f6\u8def\u7531\u5931\u8d25**\uff08[#8668](https://github.com/farion1231/cc-switch/issues/8668)\uff09\u3002\u4ece\u8bbf\u8fbe\u6216\u767b\u5f55\u9879\u542f\u52a8\u7684\u5e94\u7528\uff0c\u540c\u65f6\u80fd\u6253\u5f00\u7684\u6587\u4ef6\u6570\u53ea\u6709 256 \u4e2a\u3002\u8def\u7531\u6bcf\u4e2a\u8fdb\u884c\u4e2d\u7684\u8bf7\u6c42\u8981\u5360\u4e00\u4e2a\u5ba2\u6237\u7aef\u8fde\u63a5\u548c\u4e00\u4e2a\u4e0a\u6e38\u8fde\u63a5\uff0c\u5e76\u53d1\u4e00\u591a\u5c31\u7528\u5b8c\u4e86\uff1a\u63a5\u4e0d\u4e86\u65b0\u8bf7\u6c42\u3001\u8fde\u4e0d\u4e0a\u4e0a\u6e38\uff0c\u8fde\u914d\u7f6e\u6587\u4ef6\u548c\u6570\u636e\u5e93\u90fd\u6253\u4e0d\u5f00\u3002\u73b0\u5728\u542f\u52a8\u65f6\u628a\u8fd9\u4e2a\u4e0a\u9650\u8c03\u9ad8\u5230\u7cfb\u7edf\u5141\u8bb8\u7684\u503c\uff08\u6700\u591a 10240\uff09\u3002Linux \u540c\u6837\u5904\u7406\u3002\n- **\u4ece\u8bbf\u8fbe\u542f\u52a8\u65f6\uff0c\u300c\u91cd\u542f Codex \u5b88\u62a4\u8fdb\u7a0b\u300d\u62a5 `env: node: No such file or directory`**\uff08[#8653](https://github.com/farion1231/cc-switch/issues/8653)\uff09\u3002\u4ece\u8bbf\u8fbe\u542f\u52a8\u65f6 CC Switch \u53ea\u6709\u7cfb\u7edf\u76ee\u5f55\u7684 PATH\uff0cnpm \u5b89\u88c5\u7684 codex \u8981\u9760 node \u8fd0\u884c\uff0cnode \u88c5\u5728\u522b\u7684\u76ee\u5f55\u65f6\u5c31\u627e\u4e0d\u5230\u3002\u73b0\u5728\u8fd0\u884c\u8fd9\u7c7b\u547d\u4ee4\u65f6\u4f1a\u5148\u52a0\u4e0a\u767b\u5f55 shell \u7684 PATH\uff0c\u548c\u5b89\u88c5\u3001\u5347\u7ea7\u5de5\u5177\u65f6\u4e00\u6837\u3002OpenCode \u83b7\u53d6\u6a21\u578b\u5217\u8868\u4e5f\u53d7\u8fd9\u4e2a\u95ee\u9898\u5f71\u54cd\uff0c\u4e00\u5e76\u4fee\u590d\u3002\n- **Claude Code \u4f1a\u8bdd\u91cc\u7528 `/cd` \u6362\u4e86\u76ee\u5f55\uff0c\u4f1a\u8bdd\u7ba1\u7406\u91cc\u4ecd\u5f52\u5728\u65e7\u9879\u76ee\u4e0b**\uff08[#8643](https://github.com/farion1231/cc-switch/pull/8643)\u3001[#6862](https://github.com/farion1231/cc-switch/issues/6862)\uff09\u3002\u590d\u5236\u7684\u6062\u590d\u547d\u4ee4\u4e5f\u4f1a\u5148 `cd` \u5230\u65e7\u76ee\u5f55\uff0c\u5728\u90a3\u91cc `claude --resume` \u627e\u4e0d\u5230\u8fd9\u4e2a\u4f1a\u8bdd\u3002\u73b0\u5728\u548c Claude Code \u81ea\u5df1\u7684\u89c4\u5219\u4e00\u6837\uff0c\u6309\u6700\u540e\u4e00\u6b21\u6362\u5230\u7684\u76ee\u5f55\u5f52\u7c7b\uff0c\u8fdb\u51fa worktree \u4e5f\u4e00\u6837\u3002\n- **Windows \u4e0a\u6253\u5f00\u7ec8\u7aef\u540e\uff0c\u6309\u94ae\u4e00\u76f4\u8f6c\u5708\uff0c\u76f4\u5230\u5173\u6389\u90a3\u4e2a\u7ec8\u7aef\u7a97\u53e3**\uff08[#6712](https://github.com/farion1231/cc-switch/issues/6712)\uff09\u3002\u73b0\u5728\u7ec8\u7aef\u6253\u5f00\u540e\u5c31\u4f1a\u7ed3\u675f\u7b49\u5f85\u3002\n- **Codex \u6ca1\u7528\u8fc7\u7684\u989d\u5ea6\u7a97\u53e3\u4e5f\u663e\u793a\u91cd\u7f6e\u5012\u8ba1\u65f6**\uff08[#8631](https://github.com/farion1231/cc-switch/pull/8631)\uff09\u3002\u7528\u91cf\u4e3a 0 \u7684\u7a97\u53e3\uff0cCodex \u8fd4\u56de\u7684\u91cd\u7f6e\u65f6\u95f4\u662f\u300c\u73b0\u5728\u52a0\u4e00\u4e2a\u7a97\u53e3\u957f\u5ea6\u300d\uff0c\u6240\u4ee5\u6bcf\u6b21\u5237\u65b0\u5012\u8ba1\u65f6\u90fd\u4f1a\u8df3\u56de\u6574\u4e2a\u7a97\u53e3\uff085 \u5c0f\u65f6\u7a97\u53e3\u8df3\u56de 5 \u5c0f\u65f6\uff09\u3002\u73b0\u5728\u7528\u91cf\u4e3a 0 \u7684\u7a97\u53e3\u4e0d\u663e\u793a\u91cd\u7f6e\u65f6\u95f4\u3002\n- **DeepSeek V4.1 Flash \u7684\u8bf7\u6c42\u663e\u793a\u300c\u672a\u5b9a\u4ef7\u300d\u3001\u6309 0 \u5143\u8ba1\u3002** OpenCode Go\u3001OpenRouter \u548c Hermes \u9884\u8bbe\u7528\u7684\u6a21\u578b\u540d\u662f `deepseek-v4.1-flash`\uff0c\u4ee5\u524d\u4ef7\u683c\u8868\u91cc\u6ca1\u6709\u3002\u73b0\u5728\u6309 DeepSeek Flash \u7684\u5b98\u65b9\u4ef7\u683c\u8ba1\u7b97\uff1b\u5df2\u7ecf\u8bb0\u5f55\u7684\u8bf7\u6c42\u4e0d\u4f1a\u91cd\u65b0\u8ba1\u4ef7\u3002\n- **\u624b\u518c\u91cc\u300c\u5b98\u65b9\u989d\u5ea6\u7528\u5b8c\u540e Codex \u9501\u4f4f\u53d1\u9001\u952e\u300d\u7684\u7ed5\u5f00\u529e\u6cd5\u5df2\u5931\u6548\uff0c\u5df2\u66f4\u6b63**\uff08[#7962](https://github.com/farion1231/cc-switch/issues/7962)\uff09\u30024.0.16 \u8d77\u805a\u5408\u6a21\u5f0f\u4f1a\u4fdd\u7559 ChatGPT \u767b\u5f55\uff0c\u628a\u7b2c\u4e09\u65b9\u8bbe\u4e3a\u805a\u5408\u7684\u9ed8\u8ba4\u4f9b\u5e94\u5546\u5df2\u7ecf\u7ed5\u4e0d\u5f00\u3002\u73b0\u5728\u7684\u529e\u6cd5\u662f\uff1a\u5207\u5230\u76f4\u8fde\uff0c\u786e\u8ba4\u300c\u8bbe\u7f6e \u2192 \u5e94\u7528\u914d\u7f6e \u2192 Codex\u300d\u91cc\u7684\u300c\u975e\u63a5\u7ba1\u5207\u6362\u65f6\u4fdd\u7559\u5b98\u65b9\u767b\u5f55\u300d\u662f\u5173\u95ed\u7684\uff0c\u5207\u5230\u4e00\u5bb6\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u540e\u5f7b\u5e95\u91cd\u542f Codex\uff1b\u989d\u5ea6\u91cd\u7f6e\u540e\u518d\u5207\u56de\u805a\u5408\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7248\u672c\u4ece 20 \u5347\u5230 21**\uff0c\u4e3a MCP \u548c Skills \u589e\u52a0 Antigravity \u7684\u5f00\u5173\u3002\u5347\u7ea7\u524d\u4f1a\u81ea\u52a8\u5907\u4efd\u6570\u636e\u5e93\uff1b\u5347\u7ea7\u540e\u518d\u9000\u56de\u65e7\u7248\u672c\uff0c\u65e7\u7248\u672c\u4f1a\u63d0\u793a\u6570\u636e\u5e93\u7248\u672c\u8fc7\u65b0\uff0c\u6253\u4e0d\u5f00\u3002\n\n- Antigravity \u7684\u4f9b\u5e94\u5546\u53ea\u5728\u4ece\u5361\u7247\u300c\u4f7f\u7528\u6b64\u4f9b\u5e94\u5546\u6253\u5f00\u7ec8\u7aef\u300d\u542f\u52a8\u7684 agy \u91cc\u751f\u6548\uff0c\u5728\u5176\u4ed6\u7ec8\u7aef\u91cc\u76f4\u63a5\u8fd0\u884c `agy` \u4e0d\u4f1a\u7528\u5230\u5b83\u3002\n- Antigravity \u9ed8\u8ba4\u663e\u793a\u5728\u300c\u5e94\u7528\u300d\u9875\uff0c\u4e0d\u7528\u7684\u8bdd\u53ef\u4ee5\u5728\u90a3\u91cc\u9690\u85cf\u3002\n- \u5728\u6388\u6743\u4e2d\u5fc3\u7ba1\u7406 Antigravity \u8d26\u53f7\u76ee\u524d\u53ea\u652f\u6301 macOS\u3002\u5176\u4ed6\u5e73\u53f0\u4e0d\u663e\u793a\u8d26\u53f7\u9009\u62e9\uff0c\u5b98\u65b9\u5361\u8ddf\u968f agy \u81ea\u5df1\u7684\u767b\u5f55\uff1b\u4ece Mac \u540c\u6b65\u8fc7\u6765\u7684\u7ed1\u5b9a\u4f1a\u88ab\u5ffd\u7565\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @Owlbay\u3001@peterLwk888\u3001@ajia1206\uff08Antigravity CLI \u652f\u6301\uff09\u3001@YUZHEthefool\uff08Windows \u66f4\u65b0\u4e0d\u518d\u91cd\u542f\u3001\u53ef\u9009\u684c\u9762\u5feb\u6377\u65b9\u5f0f\uff09\u3001@funkpopo\uff08\u53ef\u9009\u684c\u9762\u5feb\u6377\u65b9\u5f0f\uff09\u3001@SaladDay\uff08\u9875\u5934\u8fde\u63a5\u5fbd\u7ae0\u3001\u7cbe\u7b80\u8bf4\u660e\u6587\u5b57\uff09\u3001@Dopetaiga\uff08`/cd` \u540e\u7684\u4f1a\u8bdd\u5f52\u7c7b\uff09\u3001@cuiyf5516\uff08Codex \u672a\u4f7f\u7528\u7684\u989d\u5ea6\u7a97\u53e3\uff09\u3001@umutcankurt\uff08Windows \u6253\u5f00\u7ec8\u7aef\u4e00\u76f4\u7b49\u5f85\uff09\u7684\u8d21\u732e\u3002\n\n\u611f\u8c22 @lm902\u3001@zhufeizzz\u3001@AisinGioroKiIoi\u3001@WzLYVg387U\u3001@mvdorofeev\u3001@dw2286\u3001@LeenixP \u62a5\u544a\u95ee\u9898\u3001\u63d0\u4f9b\u590d\u73b0\u4fe1\u606f\u548c\u4fee\u590d\u601d\u8def\u3002\n\n\u5b8c\u6574