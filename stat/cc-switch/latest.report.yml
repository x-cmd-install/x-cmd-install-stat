","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:71be89a057d945ba178ff89e58e9f204a219b66c890c2eae6067ed1ae84748b1","download_count":11274,"created_at":"2026-10-16T12:35:35Z","updated_at":"2026-10-16T12:35:35Z"}],"body":"# CC Switch v4.0.14\n\n\u672c\u7248\u672c\u4e3a\u7528\u91cf\u7edf\u8ba1\u9762\u677f\u589e\u52a0\u4e86\u5927\u91cf\u81ea\u5b9a\u4e49\u9009\u9879\uff1a\u7528\u91cf\u9875\u65b0\u589e\u300c\u8bbe\u7f6e\u300d\u9875\u7b7e\uff0c\u91d1\u989d\u53ef\u4ee5\u6362\u6210\u4eba\u6c11\u5e01\u3001\u6b27\u5143\u3001\u65e5\u5143\u7b49\u5e01\u79cd\u663e\u793a\uff08\u6c47\u7387\u53ef\u4ee5\u81ea\u5df1\u6539\uff09\uff0c\u4fa7\u680f\u300c\u4eca\u65e5\u300d\u53ef\u4ee5\u9009\u663e\u793a\u91d1\u989d\u3001Token\u3001\u8bf7\u6c42\u6570\u6216\u7f13\u5b58\u547d\u4e2d\u7387\uff0c\u8bf7\u6c42\u65e5\u5fd7\u53ef\u4ee5\u9009\u663e\u793a\u54ea\u4e9b\u5217\uff0c\u5e76\u65b0\u589e\u7f13\u5b58\u5199\u5165\u3001\u547d\u4e2d\u7387\u3001\u603b\u8017\u65f6\u548c\u72b6\u6001\u7801\u56db\u5217\uff1b\u518d\u6253\u5f00\u7528\u91cf\u9875\u65f6\uff0c\u4f1a\u56de\u5230\u4e0a\u6b21\u770b\u7684\u9875\u7b7e\u3001\u65f6\u95f4\u8303\u56f4\u548c\u56fe\u8868\u6307\u6807\u3002Claude Code \u5361\u7247\u4e0a\u7684\u300c\u6253\u5f00\u7ec8\u7aef\u300d\u4f1a\u5148\u8bf4\u660e\u8fd9\u4e2a\u76ee\u5f55\u662f\u505a\u4ec0\u4e48\u7528\u7684\uff0c\u5e76\u8bb0\u4f4f\u6700\u8fd1\u7528\u8fc7\u7684\u76ee\u5f55\u3002\u8fd8\u4fee\u590d\u4e86 Codex \u7ecf\u8def\u7531\u8fde\u63a5 Gemini \u65f6\u7b2c\u4e8c\u8f6e\u5de5\u5177\u8c03\u7528\u62a5 400\u3001\u8def\u7531\u6a21\u5f0f\u4e0b Codex \u7684\u91cd\u8bd5\u6b21\u6570\u8bbe\u7f6e\u5931\u6548\u3001\u8d85\u8fc7 128 MiB \u7684 Skills \u4ed3\u5e93\u88c5\u4e0d\u4e0a\u3001\u542b\u5927\u5199\u5b57\u6bcd\u7684\u81ea\u5b9a\u4e49\u5b9a\u4ef7\u4e0d\u751f\u6548\u3001Hermes \u5f00\u53d1\u7248\u4e00\u76f4\u63d0\u793a\u6709\u65b0\u7248\u672c\u3001\u6545\u969c\u8f6c\u79fb\u961f\u5217\u8c03\u6574\u987a\u5e8f\u6ca1\u53cd\u5e94\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.14-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.14-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u7528\u91cf\u91d1\u989d\u53ef\u4ee5\u6362\u6210\u5176\u4ed6\u5e01\u79cd\u663e\u793a\u3002** \u7528\u91cf\u9875\u539f\u6765\u7684\u300c\u5b9a\u4ef7\u300d\u9875\u7b7e\u6539\u4e3a\u300c\u8bbe\u7f6e\u300d\uff0c\u4e0a\u9762\u662f\u65b0\u7684\u300c\u663e\u793a\u300d\u533a\uff0c\u4e0b\u9762\u4ecd\u662f\u5b9a\u4ef7\u914d\u7f6e\u3002\u5728\u300c\u5e01\u79cd\u300d\u91cc\u53ef\u4ee5\u9009\u7f8e\u5143\uff08\u9ed8\u8ba4\uff09\u3001\u4eba\u6c11\u5e01\u3001\u6b27\u5143\u3001\u65e5\u5143\u3001\u65b0\u53f0\u5e01\u3001\u571f\u8033\u5176\u91cc\u62c9\uff0c\u300c\u6c47\u7387\u300d\u9884\u586b\u4e86\u53c2\u8003\u503c\uff0c\u53ef\u4ee5\u81ea\u5df1\u6539\u3002\u8d39\u7528\u4ecd\u6309\u7f8e\u5143\u8bb0\u5f55\uff0c\u53ea\u5728\u663e\u793a\u65f6\u6362\u7b97\uff0c\u60ac\u505c\u53ef\u4ee5\u770b\u5230\u7f8e\u5143\u539f\u503c\uff1b\u56fe\u8868\u5148\u6362\u7b97\u518d\u753b\uff0c\u5750\u6807\u8f74\u523b\u5ea6\u4ecd\u662f\u6574\u6570\u3002\u6362\u7b97\u540e\u7684\u91d1\u989d\u6700\u591a\u4fdd\u7559\u4e24\u4f4d\u5c0f\u6570\uff08\u65e5\u5143\u5c11\u4e24\u4f4d\uff09\uff0c\u91d1\u989d\u8f83\u5927\u65f6\u6309\u5343\u5206\u4f4d\u5206\u9694\u3002\n\n**\u4fa7\u680f\u300c\u4eca\u65e5\u300d\u53ef\u4ee5\u9009\u663e\u793a\u4ec0\u4e48\u3002** \u4fa7\u680f\u7528\u91cf\u90a3\u4e00\u884c\u539f\u6765\u56fa\u5b9a\u663e\u793a\u4eca\u65e5\u91d1\u989d\uff0c\u73b0\u5728\u53ef\u4ee5\u5728\u300c\u4fa7\u680f\u300c\u4eca\u65e5\u300d\u300d\u91cc\u9009\u91d1\u989d\u3001Token\u3001\u8bf7\u6c42\u6570\u3001\u7f13\u5b58\u547d\u4e2d\u7387\uff0c\u6700\u591a\u9009\u4e24\u9879\uff0c\u4e5f\u53ef\u4ee5\u90fd\u4e0d\u9009\u3001\u4e0d\u663e\u793a\u3002\u540d\u5b57\u4e0d\u518d\u88ab\u540e\u9762\u7684\u6570\u5b57\u6324\u7a84\uff1b\u9009\u4e86\u4e24\u9879\u65f6\uff0c\u8fd9\u4e00\u884c\u53ea\u663e\u793a\u4e24\u4e2a\u6570\u5b57\uff0c\u5b8c\u6574\u8bf4\u660e\u653e\u5728\u60ac\u505c\u63d0\u793a\u91cc\u3002\n\n**\u8bf7\u6c42\u65e5\u5fd7\u53ef\u4ee5\u9009\u663e\u793a\u54ea\u4e9b\u5217\u3002** \u5728\u300c\u8bf7\u6c42\u65e5\u5fd7\u7684\u5217\u300d\u91cc\u52fe\u9009\u8981\u663e\u793a\u7684\u5217\uff0c\u65b0\u589e\u56db\u5217\uff0c\u9ed8\u8ba4\u90fd\u4e0d\u663e\u793a\uff1a\n\n- **\u7f13\u5b58\u5199\u5165**\uff1a\u5199\u8fdb\u7f13\u5b58\u7684 Token \u6570\u3002Codex\u3001Gemini\u3001Grok \u4e0d\u62a5\u544a\u8fd9\u4e2a\u6570\uff0c\u663e\u793a\u300c\u2014\u300d\u5e76\u5728\u60ac\u505c\u65f6\u8bf4\u660e\u3002\n- **\u547d\u4e2d\u7387**\uff1a\u6bcf\u6761\u8bf7\u6c42\u7684\u7f13\u5b58\u547d\u4e2d\u7387\uff08[#7298](https://github.com/farion1231/cc-switch/issues/7298)\uff09\uff0c\u7b97\u6cd5\u548c\u603b\u547d\u4e2d\u7387\u76f8\u540c\uff1b\u5411\u4e0b\u53d6\u5230\u4e00\u4f4d\u5c0f\u6570\uff0c\u63a5\u8fd1\u5168\u4e2d\u4e5f\u4e0d\u4f1a\u663e\u793a\u6210 100%\u3002\n- **\u603b\u8017\u65f6**\uff1a\u6574\u4e2a\u6d41\u5f0f\u54cd\u5e94\u7684\u65f6\u957f\uff1b\u4ece\u4f1a\u8bdd\u65e5\u5fd7\u4f30\u7b97\u7684\u503c\u524d\u9762\u5e26\u300c\u2248\u300d\u3002\n- **\u72b6\u6001\u7801**\uff1a\u663e\u793a\u8fd9\u4e00\u5217\u65f6\uff0c\u65f6\u95f4\u65c1\u8fb9\u7684\u9519\u8bef\u6807\u8bb0\u5c31\u4e0d\u518d\u663e\u793a\u3002\n\n\u5217\u591a\u65f6\u8868\u683c\u53ef\u4ee5\u5de6\u53f3\u6eda\u52a8\uff0c\u4e0d\u518d\u628a\u6bcf\u4e00\u5217\u6324\u7a84\u3002\n\n**\u7528\u91cf\u9875\u8bb0\u4f4f\u4e0a\u6b21\u7684\u89c6\u56fe\u3002** \u518d\u6253\u5f00\u7528\u91cf\u9875\u65f6\uff0c\u4f1a\u56de\u5230\u4e0a\u6b21\u770b\u7684\u9875\u7b7e\u3001\u9884\u8bbe\u65f6\u95f4\u8303\u56f4\u548c\u8d8b\u52bf\u56fe\u3001\u70ed\u529b\u56fe\u7684\u6307\u6807\u3002\u81ea\u5b9a\u4e49\u7684\u65e5\u671f\u8303\u56f4\u4e0d\u4f1a\u8986\u76d6\u8bb0\u4f4f\u7684\u9884\u8bbe\u8303\u56f4\uff0c\u5e94\u7528\u3001\u4f9b\u5e94\u5546\u3001\u6a21\u578b\u7b5b\u9009\u4e0d\u4fdd\u7559\u3002\n\n**\u300c\u6253\u5f00\u7ec8\u7aef\u300d\u5148\u8bf4\u660e\u518d\u9009\u76ee\u5f55\u3002** \u4ee5\u524d\u70b9 Claude Code \u5361\u7247\u4e0a\u7684\u300c\u6253\u5f00\u7ec8\u7aef\u300d\u4f1a\u76f4\u63a5\u5f39\u51fa\u7cfb\u7edf\u7684\u9009\u76ee\u5f55\u7a97\u53e3\uff0c\u770b\u4e0d\u51fa\u8fd9\u4e2a\u76ee\u5f55\u662f\u505a\u4ec0\u4e48\u7684\u3002\u73b0\u5728\u5148\u5f39\u51fa\u300c\u5728\u54ea\u4e2a\u76ee\u5f55\u6253\u5f00\u7ec8\u7aef\uff1f\u300d\uff0c\u8bf4\u660e\u4f1a\u5728\u4f60\u9009\u7684\u76ee\u5f55\u91cc\u6253\u5f00\u7ec8\u7aef\uff0c\u5e76\u7528\u8fd9\u5f20\u5361\u7684\u914d\u7f6e\u542f\u52a8 Claude Code\uff0c\u4e00\u822c\u9009\u9879\u76ee\u6587\u4ef6\u5939\u3002\u4e0a\u6b21\u6210\u529f\u6253\u5f00\u7684\u76ee\u5f55\u4f1a\u81ea\u52a8\u586b\u4e0a\uff0c\u300c\u6700\u8fd1\u7528\u8fc7\u300d\u91cc\u6700\u591a\u5217\u51fa\u4e94\u4e2a\u76ee\u5f55\uff0c\u70b9\u4e00\u4e0b\u5c31\u80fd\u9009\uff0c\u4e5f\u53ef\u4ee5\u79fb\u9664\u3002\u5361\u7247\u6709\u81ea\u5df1\u7684\u5730\u5740\u548c Key \u65f6\uff0c\u8fd8\u4f1a\u8bf4\u660e\u8fd9\u4e2a\u7ec8\u7aef\u662f\u9694\u79bb\u7684\uff1a\u4e4b\u540e\u5728 CC Switch \u91cc\u5207\u6362\u4f9b\u5e94\u5546\u4e0d\u4f1a\u5f71\u54cd\u5b83\u3002\n\n**\u5b9a\u4ef7\uff1a** \u65b0\u589e Gemini 4 Argon \u7684\u5185\u7f6e\u4ef7\u683c\uff08[#8356](https://github.com/farion1231/cc-switch/pull/8356)\uff09\uff0c\u662f 2026-11-30 \u524d\u7684\u4ecb\u7ecd\u4ef7\uff1b\u5df2\u7ecf\u8bb0\u6210 0 \u7684\u5386\u53f2\u8bf7\u6c42\u4f1a\u5728\u542f\u52a8\u65f6\u91cd\u65b0\u8ba1\u4ef7\u3002\n\n## \u6539\u8fdb\n\n**Claude Desktop \u7684 1M \u6a21\u578b\u53ea\u663e\u793a\u4e00\u884c\u3002** Desktop \u4ee5\u524d\u4f1a\u628a\u6bcf\u4e2a\u58f0\u660e\u4e86 1M \u7684\u6a21\u578b\u5217\u4e24\u6b21\uff1a\u666e\u901a\u7684\u4e00\u884c\uff0c\u52a0\u4e00\u884c\u300c1M \u4e0a\u4e0b\u6587\u300d\u3002\u73b0\u5728\u53ea\u7559\u666e\u901a\u7684\u4e00\u884c\uff0c\u9009\u4e2d\u540e\u4ecd\u6309 1M \u7a97\u53e3\u7528\u3002\u8def\u7531\u548c\u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u4e0b\u6b21\u542f\u52a8 CC Switch \u6216\u5207\u6362\u6a21\u5f0f\u540e\u751f\u6548\uff1b\u76f4\u8fde\u6a21\u5f0f\u4e0b\uff0c\u4e0b\u6b21\u5207\u6362\u4f9b\u5e94\u5546\u6216\u4fdd\u5b58\u8fd9\u5f20\u5361\u540e\u751f\u6548\u3002\n\n**\u8def\u7531\u65f6\u4e0d\u80fd\u5220\u9664\u76f4\u8fde\u90a3\u5bb6\uff0c\u73b0\u5728\u4f1a\u8bf4\u660e\u539f\u56e0\u3002** \u8def\u7531\u6216\u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u76f4\u8fde\u6307\u5411\u7684\u90a3\u5f20\u5361\u4e0d\u80fd\u5220\u9664\uff0c\u56e0\u4e3a\u9000\u51fa\u8def\u7531\u540e\u8981\u56de\u5230\u5b83\uff08[#8277](https://github.com/farion1231/cc-switch/issues/8277)\uff09\u3002\u4ee5\u524d\u63d0\u793a\u5199\u7684\u662f\u300c\u6b63\u5728\u7528\u7684\u8fd9\u5bb6\u4e0d\u80fd\u5220\u9664\u300d\uff0c\u800c\u8def\u7531\u9875\u4e0a\u8fd9\u5f20\u5361\u5e76\u6ca1\u6709\u6807\u6210\u6b63\u5728\u4f7f\u7528\uff0c\u8ba9\u4eba\u6478\u4e0d\u7740\u5934\u8111\u3002\u73b0\u5728\u63d0\u793a\u4f1a\u5199\u660e\u539f\u56e0\uff0c\u4ee5\u53ca\u5148\u5728\u76f4\u8fde\u9875\u5bf9\u522b\u5bb6\u70b9\u300c\u56de\u5230\u76f4\u8fde\u5e76\u4f7f\u7528\u300d\u518d\u5220\u9664\u3002\n\n**\u8fde\u63a5\u4e0a\u6e38\u5931\u8d25\u65f6\uff0c\u65e5\u5fd7\u5199\u660e\u5177\u4f53\u539f\u56e0\u3002** \u4ee5\u524d\u8def\u7531\u8f6c\u53d1\u5931\u8d25\u53ea\u8bb0\u300cerror sending request\u300d\u8fd9\u7c7b\u7b3c\u7edf\u7684\u8bdd\uff0c\u5206\u4e0d\u51fa\u662f\u57df\u540d\u89e3\u6790\u3001\u8fde\u63a5\u88ab\u62d2\u3001TLS \u8fd8\u662f\u8fde\u63a5\u88ab\u91cd\u7f6e\uff08[#8416](https://github.com/farion1231/cc-switch/issues/8416)\uff09\u3002\u73b0\u5728\u65e5\u5fd7\u4f1a\u5e26\u4e0a\u5e95\u5c42\u539f\u56e0\uff0c\u65b9\u4fbf\u5224\u65ad\u591a\u5bb6\u540c\u65f6\u5931\u8d25\u662f\u4e0d\u662f\u540c\u4e00\u6761\u7f51\u7edc\u51fa\u4e86\u95ee\u9898\uff1b\u8bb0\u5f55\u524d\u4f1a\u5148\u53bb\u6389 URL\uff0c\u67e5\u8be2\u53c2\u6570\u91cc\u7684 Key \u4e0d\u4f1a\u8fdb\u65e5\u5fd7\u3002\n\n**\u9884\u8bbe\uff1a** \u7845\u57fa\u6d41\u52a8\u56fd\u5185\u7ad9\u7684 Claude Code\u3001Claude Desktop\u3001Hermes\u3001OpenClaw \u9884\u8bbe\u6539\u7528 DeepSeek-V4-Flash\uff08\u539f\u6765\u7684 MiniMax-M2.5 \u5df2\u4e0b\u7ebf\uff09\uff1bTokenFactory \u5728\u4e2d\u6587\u754c\u9762\u663e\u793a\u4e3a\u300c\u8bcd\u5143\u5de5\u5382\u300d\uff1bPi \u6362\u6210 pi.dev \u65b0\u7684\u4e09\u8272\u56fe\u6807\u3002\n\n## \u4fee\u590d\n\n- **Codex \u7ecf\u8def\u7531\u8fde\u63a5 Gemini \u65f6\uff0c\u7b2c\u4e8c\u8f6e\u5de5\u5177\u8c03\u7528\u62a5 400\u300cmissing a thought_signature\u300d**\uff08[#8336](https://github.com/farion1231/cc-switch/issues/8336)\uff09\u3002Gemini \u4f1a\u5728\u5de5\u5177\u8c03\u7528\u91cc\u8fd4\u56de\u4e00\u4e2a\u7b7e\u540d\uff0c\u5e76\u8981\u6c42\u4e0b\u4e00\u8f6e\u539f\u6837\u5e26\u56de\uff0cCC Switch \u7684\u683c\u5f0f\u8f6c\u6362\u628a\u5b83\u4e22\u4e86\u3002\u73b0\u5728\u4f1a\u4fdd\u5b58\u5e76\u5e26\u56de\uff1bCC Switch \u5728\u4e00\u8f6e\u5de5\u5177\u8c03\u7528\u4e2d\u9014\u91cd\u542f\u3001\u7b7e\u540d\u4e22\u5931\u65f6\uff0c\u6309 Gemini \u6587\u6863\u7684\u505a\u6cd5\u8865\u4e00\u4e2a\u5360\u4f4d\u7b7e\u540d\uff0c\u4e0d\u518d\u62a5\u9519\u3002\u5176\u4ed6\u4e0a\u6e38\u4e0d\u53d7\u5f71\u54cd\u3002\n- **\u8def\u7531\u6a21\u5f0f\u4e0b\uff0cCodex \u914d\u7f6e\u91cc\u7684\u91cd\u8bd5\u6b21\u6570\u4e0d\u751f\u6548**\uff08[#8265](https://github.com/farion1231/cc-switch/issues/8265)\uff09\u3002\u8fdb\u5165\u8def\u7531\u540e\uff0c\u4f9b\u5e94\u5546\u8bbe\u7f6e\u7684 `stream_max_retries`\u3001`request_max_retries`\u3001`stream_idle_timeout_ms` \u4f1a\u88ab\u4e22\u6389\uff0c\u6bd4\u5982\u8bbe\u6210 50 \u6b21\u7684\u91cd\u8bd5\u53c8\u56de\u5230 Codex \u9ed8\u8ba4\u7684 5 \u6b21\u3002\u73b0\u5728\u4f1a\u4fdd\u7559\u3002\n- **\u8d85\u8fc7 128 MiB \u7684 Skills \u4ed3\u5e93\u88c5\u4e0d\u4e0a\uff0c\u8fd8\u88ab\u8bef\u62a5\u6210\u89e3\u538b\u8d85\u9650**\uff08[#8421](https://github.com/farion1231/cc-switch/issues/8421)\uff09\u3002\u4ed3\u5e93\u538b\u7f29\u5305\u4ee5\u524d\u6574\u4e2a\u8bfb\u8fdb\u5185\u5b58\uff0c\u4e0a\u9650 128 MiB\uff1b\u73b0\u5728\u8fb9\u4e0b\u8f7d\u8fb9\u5199\u8fdb\u4e34\u65f6\u6587\u4ef6\uff0c\u4e0a\u9650\u63d0\u9ad8\u5230\u548c\u89e3\u538b\u4e00\u81f4\u7684 512 MiB\uff0c\u4e0b\u8f7d\u8d85\u9650\u65f6\u5355\u72ec\u63d0\u793a\u3002\n- **\u542b\u5927\u5199\u5b57\u6bcd\u7684\u81ea\u5b9a\u4e49\u6a21\u578b\u5b9a\u4ef7\u4e0d\u751f\u6548\uff0c\u6210\u672c\u4e00\u76f4\u662f 0**\uff08[#8413](https://github.com/farion1231/cc-switch/issues/8413)\uff09\u3002\u4f8b\u5982\u6309\u754c\u9762\u663e\u793a\u540d\u586b\u7684 `GLM-5.3-Flash-EXL3`\u3002\u73b0\u5728\u67e5\u4ef7\u4e0d\u533a\u5206\u5927\u5c0f\u5199\uff0c\u65b0\u8bf7\u6c42\u548c\u4fdd\u5b58\u540e\u7684\u5386\u53f2\u56de\u586b\u90fd\u80fd\u7b97\u4e0a\u3002\n- **OpenCode \u4f1a\u8bdd\u4e2d\u5de5\u5177\u8c03\u7528\u591a\u7684\u8f6e\u6b21\uff0c\u4f30\u7b97\u901f\u5ea6\u504f\u4f4e**\uff08[#8402](https://github.com/farion1231/cc-switch/issues/8402)\uff09\u3002\u8017\u65f6\u4ee5\u524d\u7b97\u5230\u5de5\u5177\u6267\u884c\u5b8c\uff0c\u73b0\u5728\u7b97\u5230\u6a21\u578b\u8f93\u51fa\u7ed3\u675f\u3002\n- **OpenCode \u4e00\u952e\u5bfc\u5165\u7684\u4e24\u4e2a\u95ee\u9898**\uff1a\u5bfc\u5165\u6210\u529f\u540e\u5361\u7247\u7684\u300c\u5df2\u6dfb\u52a0\u300d\u72b6\u6001\u4e0d\u53ca\u65f6\u66f4\u65b0\uff08[#8380](https://github.com/farion1231/cc-switch/issues/8380)\uff09\uff1b\u540d\u5b57\u662f\u4e2d\u6587\u7684\u4f9b\u5e94\u5546\u5bfc\u5165\u540e\u5728\u7f16\u8f91\u9875\u4fdd\u5b58\u4e0d\u4e86\uff08[#8379](https://github.com/farion1231/cc-switch/issues/8379)\uff09\u3002\n- **Hermes \u5f00\u53d1\u7248\u4e00\u76f4\u63d0\u793a\u6709\u65b0\u7248\u672c**\uff08[#8394](https://github.com/farion1231/cc-switch/issues/8394)\uff09\u3002`0.22.1+238.g<sha>` \u8fd9\u7c7b\u5f00\u53d1\