","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:bbf62e137573b8069339e7956a4d58b540ae943a628150904346e3a7bd4c68c4","download_count":10459,"created_at":"2026-10-20T14:27:46Z","updated_at":"2026-10-20T14:27:47Z"}],"body":"# CC Switch v4.0.17\n\n\u672c\u7248\u672c\u4fee\u590d\u4e86 4.0.16 \u5e26\u6765\u7684\u4e24\u4e2a\u95ee\u9898\uff0c\u5e76\u6539\u8fdb\u4e86\u6258\u76d8\u5feb\u6377\u9762\u677f\u3002\u8f7b\u91cf\u6a21\u5f0f\u53c8\u80fd\u91ca\u653e\u6258\u76d8\u9762\u677f\u5360\u7528\u7684\u5185\u5b58\uff0cWindows \u4e0a\u7684 WebView2 \u8fdb\u7a0b\u80fd\u6b63\u5e38\u9000\u51fa\uff1bCodex \u8fdb\u5165\u8def\u7531\u65f6\u4e0d\u4f1a\u518d\u8fd8\u56de\u4e00\u4efd\u65e9\u5df2\u8fc7\u671f\u7684 ChatGPT \u767b\u5f55\u3001\u5361\u5728\u767b\u5f55\u9875\u3002\u6258\u76d8\u9762\u677f\u5728\u5e94\u7528\u4e4b\u95f4\u60ac\u505c\u65f6\u4e0d\u518d\u8df3\u52a8\uff0c\u5728\u9ad8\u7f29\u653e\u548c\u5c0f\u5c4f\u5e55\u7684 Windows \u4e0a\u4e5f\u80fd\u5b8c\u6574\u663e\u793a\uff1b\u989d\u5ea6\u6761\u5bf9\u9f50\u4e86\uff0c\u5e76\u663e\u793a\u8ddd\u91cd\u7f6e\u8fd8\u6709\u591a\u4e45\uff0c\u5269\u4f59\u4f59\u989d\u6807\u6210\u7eff\u8272\uff1bWindows \u4e0a\u5de6\u952e\u70b9\u6258\u76d8\u56fe\u6807\u6062\u590d\u4e3a\u6253\u5f00\u4e3b\u754c\u9762\u3002Hermes \u7684\u4f9b\u5e94\u5546\u6807\u8bc6\u548c\u5185\u7f6e\u4f9b\u5e94\u5546\u91cd\u540d\u65f6\uff0c\u8868\u5355\u4f1a\u7ed9\u51fa\u63d0\u9192\u3002\u53e6\u5916\u4fee\u590d\u4e86 Windows \u4e0a\u9000\u51fa\u540e\u8def\u7531\u7aef\u53e3\u4ecd\u88ab\u5360\u7528\u3001Codex \u8fdc\u7a0b\u538b\u7f29\u7684\u7528\u91cf\u8bb0\u6210 0\u3001\u540c\u65f6\u52fe\u9009\u591a\u4e2a MCP \u670d\u52a1\u5668\u65f6\u6709\u7684\u4e22\u5931\u3001\u53ea\u6709\u5730\u5740\u7684 MCP \u670d\u52a1\u5668\u540c\u6b65\u5230 Hermes \u548c OpenCode \u540e\u662f\u7a7a\u7684\u3001TOML \u5b57\u7b26\u4e32\u91cc\u7684\u5f2f\u5f15\u53f7\u88ab\u6539\u6389\u3001\u6570\u636e\u80f6\u56ca\u7684 WebDAV \u540c\u6b65\u5931\u8d25\u3001macOS \u628a\u624b\u8f93\u7684 API Key \u9996\u5b57\u6bcd\u6539\u6210\u5927\u5199\u3001\u5728\u4fbf\u643a\u7248\u76ee\u5f55\u4e0a\u5b89\u88c5 MSI \u540e\u4ecd\u88ab\u5f53\u6210\u4fbf\u643a\u7248\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.17-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.17-ja.md)**\n\n---\n\n## \u6539\u8fdb\n\n**Hermes \u7684\u4f9b\u5e94\u5546\u6807\u8bc6\u548c\u5185\u7f6e\u4f9b\u5e94\u5546\u91cd\u540d\u65f6\u7ed9\u51fa\u63d0\u9192**\u3002Hermes \u9047\u5230\u548c\u5185\u7f6e\u4f9b\u5e94\u5546\u540c\u540d\u7684\u6807\u8bc6\uff08\u5982 `deepseek`\u3001`openrouter`\uff09\u4f1a\u6539\u7528\u5185\u7f6e\u90a3\u5bb6\uff0c\u8981\u5b83\u81ea\u5df1\u7684\u73af\u5883\u53d8\u91cf Key\uff0c\u8fd9\u5f20\u5361\u7684\u5730\u5740\u548c Key \u90fd\u4e0d\u751f\u6548\uff1b4.0.16 \u53ea\u4fee\u4e86 MiniMax \u4e24\u4e2a\u9884\u8bbe\uff08[#8538](https://github.com/farion1231/cc-switch/pull/8538)\uff09\u3002\u73b0\u5728\u586b\u7684\u6807\u8bc6\u662f Hermes \u5185\u7f6e\u4f9b\u5e94\u5546\u7684\u6807\u8bc6\u65f6\uff0c\u8f93\u5165\u6846\u4e0b\u65b9\u4f1a\u63d0\u9192\u5e76\u5efa\u8bae\u6539\u6210 `cc-switch-<\u6807\u8bc6>`\uff1b\u5df2\u7ecf\u6dfb\u52a0\u3001\u6807\u8bc6\u6539\u4e0d\u4e86\u7684\u5361\uff0c\u4f1a\u63d0\u793a\u7528\u522b\u7684\u6807\u8bc6\u91cd\u65b0\u6dfb\u52a0\u3002`kimi` \u8fd9\u7c7b\u522b\u540d\u4e0d\u53d7\u5f71\u54cd\uff0c\u4e5f\u4e0d\u4f1a\u62a5\u3002\u63d0\u9192\u4e0d\u5f71\u54cd\u4fdd\u5b58\u3002\n\n**\u6258\u76d8\u9762\u677f\u7684\u989d\u5ea6\u663e\u793a**\u3002\u5404\u6863\u989d\u5ea6\u7684\u6807\u7b7e\u3001\u8fdb\u5ea6\u6761\u548c\u91cd\u7f6e\u65f6\u95f4\u6392\u6210\u6574\u9f50\u7684\u4e09\u5217\uff0c\u8fdb\u5ea6\u6761\u8d77\u6b62\u5bf9\u9f50\uff0c\u4e5f\u66f4\u957f\u4e86\uff1b\u91cd\u7f6e\u65f6\u95f4\u4ece\u5177\u4f53\u65e5\u671f\u6539\u4e3a\u300c\u8fd8\u5269\u591a\u4e45\u300d\uff0c\u4f8b\u5982\u300c1\u592923\u5c0f\u65f6\u540e\u91cd\u7f6e\u300d\u3002\u6309\u91cf\u4ed8\u8d39\u7684\u5269\u4f59\u4f59\u989d\u53ea\u628a\u91d1\u989d\u6807\u6210\u7eff\u8272\uff0c\u548c\u4f9b\u5e94\u5546\u5361\u7247\u4e00\u81f4\uff1b\u4f59\u989d\u7528\u5b8c\u65f6\u4ecd\u663e\u793a\u8b66\u544a\u8272\u3002\n\n**Windows \u4e0a\u5de6\u952e\u70b9\u6258\u76d8\u56fe\u6807\u6062\u590d\u4e3a\u6253\u5f00\u4e3b\u754c\u9762**\uff08[#8572](https://github.com/farion1231/cc-switch/pull/8572)\uff09\u3002\u53f3\u952e\u5f39\u51fa\u8bbe\u7f6e\u91cc\u9009\u7684\u6258\u76d8\u6837\u5f0f\uff08\u9762\u677f\u6216\u83dc\u5355\uff09\u3002macOS \u4e0d\u53d8\uff0c\u5de6\u53f3\u952e\u90fd\u5f39\u51fa\u6240\u9009\u6837\u5f0f\u3002\n\n## \u4fee\u590d\n\n- **\u8f7b\u91cf\u6a21\u5f0f\u4e0b\u6258\u76d8\u9762\u677f\u4e00\u76f4\u5360\u7740\u5185\u5b58**\uff08[#8612](https://github.com/farion1231/cc-switch/issues/8612)\uff09\u30024.0.16 \u8d77\u6258\u76d8\u9762\u677f\u9ed8\u8ba4\u5f00\u542f\uff0c\u5b83\u662f\u5355\u72ec\u7684\u4e00\u4e2a\u7a97\u53e3\uff0c\u7b2c\u4e00\u6b21\u5f39\u51fa\u540e\u53ea\u9690\u85cf\u4e0d\u5173\u95ed\uff0c\u8fdb\u5165\u8f7b\u91cf\u6a21\u5f0f\u540e Windows \u4e0a\u7684 WebView2 \u8fdb\u7a0b\u4e5f\u4e0d\u4f1a\u9000\u51fa\u3002\u73b0\u5728\u8f7b\u91cf\u6a21\u5f0f\u4e0b\u9762\u677f\u4e00\u6536\u8d77\u5c31\u91ca\u653e\uff0c\u4e0b\u6b21\u70b9\u6258\u76d8\u56fe\u6807\u518d\u91cd\u65b0\u6253\u5f00\u3002\n- **Codex \u8fdb\u5165\u8def\u7531\u540e\u5361\u5728 ChatGPT \u767b\u5f55\u9875**\uff08[#8573](https://github.com/farion1231/cc-switch/issues/8573)\uff09\u30024.0.16 \u8d77\uff0c\u8fdb\u5165\u7b2c\u4e09\u65b9\u8def\u7531\u65f6\u5982\u679c `auth.json` \u91cc\u6ca1\u6709\u767b\u5f55\uff0c\u4f1a\u8fd8\u56de\u6700\u8fd1\u6536\u8d77\u7684\u90a3\u4efd\uff1b\u8fd9\u4efd\u767b\u5f55\u53ef\u80fd\u662f\u51e0\u4e2a\u6708\u524d\u6536\u8d77\u7684\u3001\u65e9\u5df2\u8fc7\u671f\uff0cCodex \u684c\u9762\u7248\u62ff\u7740\u5b83\u53cd\u590d\u5237\u65b0\u5931\u8d25\uff0c\u6bcf\u6b21\u8fdb\u51fa\u8def\u7531\u53c8\u4f1a\u88ab\u8fd8\u56de\u6765\u3002\u73b0\u5728\u5df2\u8fc7\u671f\u7684\u767b\u5f55\u4e0d\u518d\u8fd8\u56de\uff0c\u4ecd\u7559\u5728\u6682\u5b58\u91cc\uff0c\u5207\u56de\u5b98\u65b9\u5361\u65f6\u7167\u5e38\u8fd8\u56de\u3002\n- **\u6258\u76d8\u9762\u677f\u60ac\u505c\u65f6\u6765\u56de\u8df3\u52a8\uff0cWindows \u9ad8\u7f29\u653e\u4e0b\u663e\u793a\u4e0d\u5168**\uff08[#8572](https://github.com/farion1231/cc-switch/pull/8572)\u3001[#8595](https://github.com/farion1231/cc-switch/pull/8595)\uff0c[#8549](https://github.com/farion1231/cc-switch/issues/8549)\u3001[#8553](https://github.com/farion1231/cc-switch/issues/8553)\u3001[#8564](https://github.com/farion1231/cc-switch/issues/8564)\uff09\u3002\u4e24\u680f\u9ad8\u5ea6\u6539\u4e3a\u4ee5\u4e3b\u9762\u677f\u4e3a\u51c6\uff0c\u4f9b\u5e94\u5546\u591a\u7684\u5217\u8868\u5728\u53f3\u680f\u91cc\u6eda\u52a8\uff0c\u5728\u5e94\u7528\u4e4b\u95f4\u60ac\u505c\u65f6\u884c\u4e0d\u4f1a\u518d\u632a\u5230\u9f20\u6807\u4e0b\u9762\uff0c\u53ea\u6709\u4e00\u4e2a\u5e94\u7528\u65f6\u4e5f\u4e0d\u518d\u7559\u51fa\u5927\u7247\u7a7a\u767d\u3002Windows \u4e0a\u6309\u663e\u793a\u5668\u7684\u7f29\u653e\u6bd4\u4f8b\u6362\u7b97\u5c3a\u5bf8\uff0c\u9762\u677f\u4f1a\u6536\u7a84\u5e76\u9650\u5236\u5728\u5c4f\u5e55\u53ef\u7528\u533a\u57df\u5185\uff0c\u5e95\u90e8\u7684\u300c\u6253\u5f00\u4e3b\u7a97\u53e3\u300d\u548c\u300c\u9000\u51fa\u300d\u4e0d\u4f1a\u518d\u88ab\u6324\u51fa\u53bb\uff1b\u632a\u5230\u7f29\u653e\u4e0d\u540c\u7684\u53e6\u4e00\u5757\u5c4f\u5e55\u540e\uff0c\u7b2c\u4e00\u6b21\u5f39\u51fa\u4e5f\u80fd\u6b63\u786e\u663e\u793a\u3002\n- **Windows \u4e0a\u9000\u51fa CC Switch \u540e\u8def\u7531\u7aef\u53e3\u4ecd\u88ab\u5360\u7528\uff0c\u4e0b\u6b21\u542f\u52a8\u62a5 os error 10048**\uff08[#8552](https://github.com/farion1231/cc-switch/issues/8552)\uff09\u3002CC Switch \u6253\u5f00\u7684\u7ec8\u7aef\u548c\u547d\u4ee4\u884c\u5de5\u5177\u7ee7\u627f\u4e86\u76d1\u542c\u7aef\u53e3\uff0cCC Switch \u9000\u51fa\u540e\u7aef\u53e3\u4ecd\u88ab\u5b83\u4eec\u5360\u7740\uff0c\u4e0b\u6b21\u542f\u52a8\u53ea\u80fd\u56de\u5230\u76f4\u8fde\uff0c\u76f4\u5230\u91cd\u542f\u7535\u8111\u6216\u6362\u7aef\u53e3\u3002\u73b0\u5728\u8fd9\u4e9b\u5b50\u8fdb\u7a0b\u4e0d\u518d\u7ee7\u627f\u76d1\u542c\u7aef\u53e3\u3002\n- **Codex \u8fdc\u7a0b\u538b\u7f29\u7684\u7528\u91cf\u8bb0\u6210 0**\uff08[#8479](https://github.com/farion1231/cc-switch/pull/8479)\uff09\u3002Codex 0.153 \u8d77\uff0c\u8fdc\u7a0b\u538b\u7f29\u7684\u7528\u91cf\u5199\u5728\u53e6\u4e00\u79cd\u8bb0\u5f55\u91cc\uff0c\u4ee5\u524d\u6ca1\u6709\u8bfb\u53d6\uff0c\u8fd9\u4e9b\u8bf7\u6c42\u90fd\u6309 0 \u8ba1\u3002\u73b0\u5728\u4f1a\u6b63\u5e38\u8ba1\u5165\uff1b\u5347\u7ea7\u524d\u5df2\u7ecf\u626b\u63cf\u8fc7\u7684\u8bb0\u5f55\u4fdd\u6301\u539f\u6837\u3002\n- **\u540c\u65f6\u52fe\u9009\u591a\u4e2a MCP \u670d\u52a1\u5668\u65f6\uff0c\u6709\u7684\u6ca1\u5199\u8fdb\u914d\u7f6e\u6587\u4ef6**\uff08[#8580](https://github.com/farion1231/cc-switch/issues/8580)\uff09\u3002\u51e0\u6b21\u52fe\u9009\u540c\u65f6\u5199\u540c\u4e00\u4e2a\u914d\u7f6e\u6587\u4ef6\u65f6\u4f1a\u4e92\u76f8\u8986\u76d6\uff0c\u754c\u9762\u663e\u793a\u5df2\u542f\u7528\uff0c\u914d\u7f6e\u6587\u4ef6\u91cc\u5374\u6ca1\u6709\u3002\u73b0\u5728\u4f1a\u4f9d\u6b21\u5199\u5165\u3002\n- **\u53ea\u6709\u5730\u5740\u7684 MCP \u670d\u52a1\u5668\u540c\u6b65\u5230 Hermes \u548c OpenCode \u540e\u662f\u7a7a\u7684**\uff08[#8579](https://github.com/farion1231/cc-switch/issues/8579)\uff09\u3002\u5728 JSON \u6a21\u5f0f\u91cc\u7c98\u8d34\u6216\u901a\u8fc7\u6df1\u94fe\u63a5\u5bfc\u5165\u3001\u53ea\u5199\u4e86 `url` \u6ca1\u5199 `type` \u7684\u670d\u52a1\u5668\uff0c\u4ee5\u524d\u88ab\u5f53\u6210\u672c\u5730\u547d\u4ee4\uff0c\u540c\u6b65\u540e Hermes \u91cc\u53ea\u6709 `enabled: true`\uff0cOpenCode \u91cc\u547d\u4ee4\u4e3a\u7a7a\uff0c\u754c\u9762\u5374\u663e\u793a\u540c\u6b65\u6210\u529f\u3002\u73b0\u5728\u548c Codex \u4e00\u6837\uff0c\u6709\u5730\u5740\u3001\u6ca1\u6709\u547d\u4ee4\u7684\u6309\u8fdc\u7a0b\u670d\u52a1\u5668\u5904\u7406\u3002\n- **TOML \u5b57\u7b26\u4e32\u91cc\u7684\u5f2f\u5f15\u53f7\uff08\u542b\u4e2d\u6587\u5f15\u53f7\uff09\u88ab\u6539\u6210\u76f4\u5f15\u53f7**\uff08[#8559](https://github.com/farion1231/cc-switch/issues/8559)\uff09\u3002\u4e3a\u4e86\u517c\u5bb9\u4e2d\u6587\u8f93\u5165\u6cd5\uff0c\u5bfc\u5165 MCP \u548c\u7f16\u8f91 Codex \u914d\u7f6e\u65f6\u4f1a\u628a\u5f2f\u5f15\u53f7\u8f6c\u6210\u76f4\u5f15\u53f7\uff0c\u4ee5\u524d\u8fde\u5b57\u7b26\u4e32\u91cc\u9762\u7684\u4e5f\u4e00\u8d77\u8f6c\u4e86\uff0c\u628a `\"don\u2019t\"` \u6539\u6210 `\"don't\"`\uff0c\u6709\u7684\u5408\u6cd5\u914d\u7f6e\u8fd8\u4f1a\u88ab\u62d2\u7edd\u3002\u73b0\u5728\u53ea\u8f6c\u6362\u7528\u4f5c\u5b57\u7b26\u4e32\u8fb9\u754c\u7684\u5f15\u53f7\uff0c\u5b57\u7b26\u4e32\u91cc\u9762\u7684\u4fdd\u6301\u539f\u6837\uff0c\u7528\u4e2d\u6587\u8f93\u5165\u6cd5\u76f4\u63a5\u8f93\u5165\u5f15\u53f7\u4ecd\u7136\u53ef\u4ee5\u3002\n- **\u6570\u636e\u80f6\u56ca\u7684 WebDAV \u540c\u6b65\u4e0a\u4f20\u5931\u8d25\uff0c\u8fd4\u56de 500**\uff08[#8554](https://github.com/farion1231/cc-switch/issues/8554)\uff09\u3002\u73b0\u5728\u540c\u6b65\u6e05\u5355\u6539\u7528\u901a\u7528\u7684\u6587\u4ef6\u7c7b\u578b\u4e0a\u4f20\uff0c\u5185\u5bb9\u4e0d\u53d8\uff0c\u65b0\u65e7\u7248\u672c\u53ef\u4ee5\u4e92\u76f8\u8bfb\u53d6\u3002S3 \u540c\u6b65\u4e0d\u53d7\u5f71\u54cd\u3002\n- **macOS \u4e0a\u624b\u8f93\u7684 API Key \u9996\u5b57\u6bcd\u88ab\u81ea\u52a8\u6539\u6210\u5927\u5199\u3002** \u663e\u793a\u660e\u6587\u65f6\uff0c\u8f93\u5165\u7684 `sk-\u2026` \u53ef\u80fd\u88ab\u7cfb\u7edf\u6539\u6210 `Sk-\u2026` \u4fdd\u5b58\u4e0b\u6765\uff0c\u5bfc\u81f4\u8ba4\u8bc1\u5931\u8d25\u3002\u73b0\u5728\u8fd9\u4e2a\u8f93\u5165\u6846\u5173\u95ed\u4e86\u81ea\u52a8\u5927\u5199\u3001\u81ea\u52a8\u66f4\u6b63\u548c\u62fc\u5199\u68c0\u67e5\u3002\u7c98\u8d34\u7684 Key \u4e0d\u53d7\u5f71\u54cd\u3002\n- **\u5728\u4fbf\u643a\u7248\u76ee\u5f55\u4e0a\u5b89\u88c5 MSI \u540e\uff0c\u4ecd\u88ab\u5f53\u6210\u4fbf\u643a\u7248\uff0c\u53ea\u80fd\u624b\u52a8\u4e0b\u8f7d\u66f4\u65b0**\uff08[#8529](https://github.com/farion1231/cc-switch/pull/8529)\uff0c[#3132](https://github.com/farion1231/cc-switch/issues/3132)\uff09\u3002\u73b0\u5728\u5b89\u88c5\u65f6\u4f1a\u5220\u6389\u76ee\u5f55\u91cc\u6b8b\u7559\u7684\u4fbf\u643a\u7248\u6807\u8bb0 `portable.ini`\uff0c\u5b89\u88c5\u540e\u53ef\u4ee5\u5728\u5e94\u7528\u5185\u66f4\u65b0\u3002\u5378\u8f7d\u65f6\u4e0d\u4f1a\u5220\u9664\u8fd9\u4e2a\u6587\u4ef6\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n- Windows \u4e0a\u5de6\u952e\u70b9\u6258\u76d8\u56fe\u6807\u6062\u590d\u4e3a\u6253\u5f00\u4e3b\u754c\u9762\uff084.0.16 \u7528\u9762\u677f\u6837\u5f0f\u65f6\u662f\u5f39\u51fa\u9762\u677f\uff0c\u83dc\u5355\u6837\u5f0f\u4e00\u76f4\u5982\u6b64\uff09\uff1b\u53f3\u952e\u5f39\u51fa\u300c\u8bbe\u7f6e \u2192 \u901a\u7528 \u2192 \u6258\u76d8\u6837\u5f0f\u300d\u91cc\u9009\u7684\u6837\u5f0f\u3002\n- Codex \u8fdc\u7a0b\u538b\u7f29\u7684\u7528\u91cf\u53ea\u4ece\u5347\u7ea7\u540e\u8bfb\u5230\u7684\u8bb0\u5f55\u5f00\u59cb\u8ba1\u5165\uff0c\u5347\u7ea7\u524d\u5df2\u7ecf\u626b\u63cf\u8fc7\u7684\u4e0d\u4f1a\u8865\u7b97\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @funkpopo\uff08\u6258\u76d8\u9762\u677f\u7684\u6eda\u52a8\u4e0e\u7f29\u653e\uff09\u3001@Chaoqi31\uff08Codex \u8fdc\u7a0b\u538b\u7f29\u7528\u91cf\uff09\u3001@chonngyi\uff08\u5728\u4fbf\u643a\u7248\u76ee\u5f55\u4e0a\u5b89\u88c5 MSI\uff09\u7684\u8d21\u732e\u3002\n\n\u611f\u8c22 @SamPheng\u3001@xinxinxiaoxin\u3001@XinwangTao\u3001@ramonmi\u3001@Jdker22\u3001@Geneslves\u3001@Jinmoli\u3001@nanfenggushi\u3001@fereverlove\u3001@hulkbig\u3001@AngryBigCat\u3001@QC2168 \u62a5\u544a\u95ee\u9898\u3001\u63d0\