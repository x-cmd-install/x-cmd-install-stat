label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:d4c30c3387b34a40e99ceaa361b2f3eae56b976b47a556a172faaa553b9f691c","download_count":7583,"created_at":"2026-10-17T15:40:19Z","updated_at":"2026-10-17T15:40:19Z"}],"body":"# CC Switch v4.0.15\n\n\u672c\u7248\u672c\u4ee5\u4fee\u590d\u4e3a\u4e3b\uff1aWindows \u4e0a\u66f4\u65b0\u540e\u9690\u85cf\u7684\u5e94\u7528\u3001\u914d\u7f6e\u76ee\u5f55\u8986\u76d6\u7b49\u8bbe\u7f6e\u4f1a\u88ab\u91cd\u7f6e\u4e3a\u9ed8\u8ba4\u503c\u7684\u95ee\u9898\u5df2\u4fee\u590d\uff1b\u66f4\u65b0 Codex \u65f6\uff0c`--version` \u54cd\u5e94\u6162\u4e0d\u4f1a\u518d\u628a\u597d\u597d\u7684 Codex \u5378\u6389\uff1bmacOS \u5e94\u7528\u56fe\u6807\u6539\u4e3a\u767d\u8272\u5706\u89d2\u65b9\u5757\uff0cmacOS 26 \u4e0d\u518d\u628a\u5b83\u585e\u8fdb\u7070\u8272\u5e95\u677f\u3002\u7ecf\u8def\u7531\u7684\u8bf7\u6c42\u91cd\u65b0\u8ba4\u5f97\u51fa Claude Code \u7684\u4f1a\u8bdd\uff0c\u8d70 Codex OAuth \u65f6\u7684\u7f13\u5b58\u952e\u548c Claude Desktop \u8fde Gemini \u65f6\u7684\u7b7e\u540d\u56de\u653e\u90fd\u6062\u590d\u6b63\u5e38\uff1bCodex \u5386\u53f2\u91cc\u6709\u4e00\u6761\u574f\u6389\u7684\u5de5\u5177\u8c03\u7528\u65f6\u4e0d\u518d\u6bcf\u8f6e\u90fd\u62a5\u9519\uff0cDeepSeek \u4e5f\u4e0d\u518d\u62d2\u6536\u56de\u653e\u7684\u5de5\u5177\u5386\u53f2\u3002\u53e6\u5916\u4fee\u590d\u4e86 WebDAV/S3 \u6162\u901f\u4f20\u8f93 300 \u79d2\u88ab\u6390\u65ad\u3001Windows \u4e0a\u300c\u6253\u5f00\u7ec8\u7aef\u300d\u627e\u4e0d\u5230 `claude`\u3001WSL \u91cc\u7684 Hermes \u4f1a\u8bdd\u8bfb\u4e0d\u51fa\u3001\u8def\u7531\u5207\u6362\u603b\u662f\u63d0\u793a\u91cd\u542f\u7b49\u95ee\u9898\u3002\u65b0\u589e\u7528\u91cf\u8d8b\u52bf\u56fe\u7684\u67f1\u5f62\u56fe / \u66f2\u7ebf\u9762\u79ef\u56fe\u5207\u6362\u3001Hermes \u6309\u6a21\u578b\u58f0\u660e\u56fe\u7247\u8f93\u5165\uff0cClaude Desktop \u8868\u5355\u4e5f\u80fd\u4e3a Copilot \u7b49\u6258\u7ba1\u767b\u5f55\u7684\u4f9b\u5e94\u5546\u83b7\u53d6\u6a21\u578b\u5217\u8868\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.15-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.15-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u7528\u91cf\u8d8b\u52bf\u56fe\u53ef\u4ee5\u9009\u67f1\u5f62\u56fe\u6216\u66f2\u7ebf\u9762\u79ef\u56fe**\uff08[#8406](https://github.com/farion1231/cc-switch/issues/8406)\uff09\u3002\u5728\u7528\u91cf\u9875\u300c\u8bbe\u7f6e\u300d\u9875\u7b7e\u7684\u300c\u663e\u793a\u300d\u533a\uff0c\u300c\u8d8b\u52bf\u56fe\u6837\u5f0f\u300d\u53ef\u4ee5\u9009\u67f1\u5f62\u56fe\uff08\u9ed8\u8ba4\uff09\u6216\u66f2\u7ebf\u9762\u79ef\u56fe\uff0c\u4e24\u79cd\u6837\u5f0f\u7684\u6307\u6807\u3001\u5750\u6807\u8f74\u3001\u60ac\u505c\u63d0\u793a\u548c\u5e01\u79cd\u6362\u7b97\u90fd\u4e00\u6837\u3002\u300c\u663e\u793a\u300d\u533a\u7684\u51e0\u9879\u8bbe\u7f6e\u4e5f\u91cd\u65b0\u6392\u6210\u4e86\u5bf9\u9f50\u7684\u4e24\u5217\uff0c\u6c47\u7387\u5355\u72ec\u4e00\u884c\uff0c\u653e\u5728\u5e01\u79cd\u4e0b\u9762\u3002\n\n**Hermes \u53ef\u4ee5\u6309\u6a21\u578b\u58f0\u660e\u652f\u6301\u56fe\u7247\u8f93\u5165**\uff08[#8464](https://github.com/farion1231/cc-switch/issues/8464)\uff09\u3002Hermes \u6309\u6bcf\u4e2a\u6a21\u578b\u7684 `supports_vision` \u5224\u65ad\u80fd\u4e0d\u80fd\u770b\u56fe\uff0c\u6ca1\u5199\u7684\u672a\u77e5\u6a21\u578b\u4f1a\u88ab\u5f53\u6210\u7eaf\u6587\u672c\u3001\u56fe\u7247\u88ab\u538b\u6210\u6587\u5b57\uff1b\u4ee5\u524d\u8868\u5355\u91cc\u6ca1\u6709\u5730\u65b9\u8bbe\u7f6e\uff0c\u624b\u5199\u7684\u503c\u4fdd\u5b58\u540e\u4e5f\u4f1a\u88ab\u51b2\u6389\u3002\u73b0\u5728\u5c55\u5f00\u6a21\u578b\u8be6\u60c5\u540e\u6709\u300c\u652f\u6301\u56fe\u7247\u8f93\u5165\u300d\u5f00\u5173\uff1a\u6253\u5f00\u5199 `supports_vision: true`\uff0c\u5173\u6389\u5219\u5220\u9664\u8fd9\u4e2a\u952e\uff0c\u4ea4\u7ed9 Hermes \u81ea\u5df1\u5224\u65ad\u3002\u4ece\u6a21\u578b\u5217\u8868\u9009\u5230\u5df2\u77e5\u652f\u6301\u56fe\u7247\u7684\u6a21\u578b\u65f6\u4f1a\u81ea\u52a8\u6253\u5f00\u3002\n\n**Claude Desktop \u53ef\u4ee5\u4e3a\u6258\u7ba1\u767b\u5f55\u7684\u4f9b\u5e94\u5546\u83b7\u53d6\u6a21\u578b\u5217\u8868**\uff08[#8426](https://github.com/farion1231/cc-switch/issues/8426)\uff09\u3002GitHub Copilot\u3001Codex OAuth\u3001xAI OAuth \u8fd9\u7c7b\u4f9b\u5e94\u5546\u4ee5\u524d\u5728 Desktop \u8868\u5355\u91cc\u6ca1\u6709\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u6309\u94ae\uff0c\u73b0\u5728\u6709\u4e86\uff0c\u4f1a\u6309\u767b\u5f55\u7684\u8d26\u53f7\u62c9\u53d6\uff1b\u8fd8\u6ca1\u767b\u5f55\u65f6\u5148\u63d0\u793a\u767b\u5f55\u3002\u6362\u4e86\u4f9b\u5e94\u5546\u7c7b\u578b\u6216\u8d26\u53f7\u540e\uff0c\u5217\u8868\u4f1a\u6e05\u7a7a\u91cd\u62c9\uff0c\u4e0d\u4f1a\u6df7\u8fdb\u522b\u7684\u8d26\u53f7\u7684\u6a21\u578b\u3002\n\n## \u6539\u8fdb\n\n**\u8def\u7531\u4e0b\u5207\u6362\u4f9b\u5e94\u5546\uff0c\u63d0\u793a\u5199\u660e\u5b9e\u9645\u505a\u4e86\u4ec0\u4e48**\uff08[#8347](https://github.com/farion1231/cc-switch/issues/8347)\uff09\u3002\u4ee5\u524d\u8def\u7531\u6a21\u5f0f\u4e0b\u5207\u6362\uff0cCodex\u3001Gemini CLI\u3001Grok Build \u603b\u4f1a\u63d0\u793a\u91cd\u542f\u5ba2\u6237\u7aef\u3002\u73b0\u5728\u63d0\u793a\u4f1a\u8bf4\u660e\u662f\u8bb0\u4f4f\u4e86\u4f9b\u5e94\u5546\u3001\u6539\u4e86\u8def\u7531\u76ee\u6807\u3001\u5207\u6362\u4e86\u8def\u7531\uff0c\u8fd8\u662f\u6539\u4e86\u805a\u5408\u9ed8\u8ba4\u4f9b\u5e94\u5546\uff1b\u53ea\u6709\u5ba2\u6237\u7aef\u914d\u7f6e\u6587\u4ef6\u786e\u5b9e\u6539\u4e86\uff0c\u624d\u63d0\u793a\u91cd\u542f\u3002\n\n**\u4fa7\u680f\u300c\u4eca\u65e5\u300d\u4e0d\u518d\u5e26\u300c\u4eca\u65e5\u300d\u524d\u7f00\u3002** \u53ea\u9009\u4e00\u9879\u65f6\u4e5f\u548c\u9009\u4e24\u9879\u65f6\u4e00\u6837\u53ea\u663e\u793a\u6570\u503c\uff0c\u5b8c\u6574\u8bf4\u660e\u5728\u60ac\u505c\u63d0\u793a\u91cc\u3002\n\n**Claude Code \u7528\u91cf\u5bfc\u5165\u66f4\u5feb**\uff08[#8224](https://github.com/farion1231/cc-switch/issues/8224)\uff09\u3002\u540c\u4e00\u6b21\u5bfc\u5165\u91cc\uff0c\u67e5\u8fc7\u7684\u6a21\u578b\u4ef7\u683c\u4f1a\u590d\u7528\uff0c\u4e0d\u518d\u6bcf\u6761\u8bb0\u5f55\u90fd\u67e5\u4e00\u904d\uff1b\u6539\u4e86\u4ef7\u683c\uff0c\u4e0b\u4e00\u6b21\u5bfc\u5165\u5c31\u4f1a\u7528\u4e0a\u3002\n\n**\u571f\u8033\u5176\u8bed**\uff1a\u8865\u9f50\u4e86\u5378\u8f7d\u548c\u5957\u9910\u989d\u5ea6\u76f8\u5173\u7684\u65b0\u6587\u6848\uff08[#8291](https://github.com/farion1231/cc-switch/pull/8291)\uff09\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e EveryAPI\u3001AllTokens\u3002\n\n## \u4fee\u590d\n\n- **Windows \u4e0a\u6bcf\u6b21\u66f4\u65b0\u540e\uff0c\u9690\u85cf\u7684\u5e94\u7528\u3001\u914d\u7f6e\u76ee\u5f55\u8986\u76d6\u7b49\u8bbe\u7f6e\u88ab\u91cd\u7f6e\u4e3a\u9ed8\u8ba4\u503c**\uff08[#8429](https://github.com/farion1231/cc-switch/issues/8429)\uff09\u3002\u4ee5\u524d\u76f4\u63a5\u8986\u76d6\u5199 `settings.json`\uff0c\u4e2a\u522b\u73af\u5883\u4e0b\u65b0\u5185\u5bb9\u53d8\u77ed\u65f6\uff0c\u65e7\u5185\u5bb9\u7684\u5c3e\u5df4\u6ca1\u88ab\u622a\u6389\uff0c\u4e0b\u6b21\u542f\u52a8\u6574\u4efd\u89e3\u6790\u5931\u8d25\uff1b\u8bfb\u53d6\u5931\u8d25\u65f6\u53c8\u6084\u6084\u7528\u4e86\u9ed8\u8ba4\u503c\uff0c\u66f4\u65b0\u540e\u5f39\u51fa\u7684\u66f4\u65b0\u6458\u8981\u4e00\u4fdd\u5b58\uff0c\u5c31\u628a\u9ed8\u8ba4\u503c\u5199\u4e86\u56de\u53bb\u3002\u73b0\u5728\u5148\u5199\u4e34\u65f6\u6587\u4ef6\u518d\u66ff\u6362\uff1b\u8bfb\u53d6\u65f6\u4f1a\u53bb\u6389 BOM\uff0c\u6709\u5c3e\u5df4\u65f6\u53ea\u8bfb\u7b2c\u4e00\u6bb5 JSON\uff0c\u89e3\u6790\u4e0d\u4e86\u7684\u5b57\u6bb5\u5355\u72ec\u4e22\u6389\u3001\u5176\u4f59\u7167\u5e38\u4fdd\u7559\u3002\u6ca1\u6709\u5b8c\u6574\u8bfb\u51fa\u7684\u6587\u4ef6\u4f1a\u5148\u5907\u4efd\u6210 `settings.json.broken-<\u65f6\u95f4>.bak`\uff0c\u5907\u4efd\u6210\u529f\u4e4b\u524d\u4e0d\u4f1a\u4fdd\u5b58\u3002\n- **\u66f4\u65b0 Codex \u65f6\uff0c`--version` \u54cd\u5e94\u6162\u4f1a\u628a\u597d\u597d\u7684 Codex \u5378\u6389\u3002** \u4ee5\u524d\u66f4\u65b0\u524d\u68c0\u6d4b\u5230 `--version` \u8d85\u65f6\u6216\u542f\u52a8\u5931\u8d25\uff0c\u5c31\u4f1a\u5148\u5378\u8f7d\u518d\u91cd\u88c5\uff0c\u91cd\u88c5\u4e00\u5931\u8d25\uff0cCodex \u5c31\u663e\u793a\u6210\u672a\u5b89\u88c5\u3002\u73b0\u5728\u53ea\u6709 `--version` \u771f\u7684\u8fd0\u884c\u5e76\u62a5\u9519\u65f6\u624d\u8fd9\u6837\u4fee\u590d\uff0c\u5176\u4f59\u60c5\u51b5\u7167\u5e38\u5347\u7ea7\u3002\n- **macOS 26 \u628a\u5e94\u7528\u56fe\u6807\u653e\u8fdb\u7070\u8272\u5e95\u677f\u5e76\u7f29\u5c0f**\uff08[#8401](https://github.com/farion1231/cc-switch/issues/8401)\uff09\u3002macOS \u5e94\u7528\u56fe\u6807\u73b0\u5728\u81ea\u5e26\u767d\u8272\u5706\u89d2\u65b9\u5757\uff0cmacOS 26 \u548c 15 \u663e\u793a\u4e00\u81f4\uff1bWindows \u548c Linux \u56fe\u6807\u4e0d\u53d8\u3002\n- **\u7ecf\u8def\u7531\u7684\u8bf7\u6c42\u8ba4\u4e0d\u51fa Claude Code \u7684\u4f1a\u8bdd**\uff08[#8235](https://github.com/farion1231/cc-switch/issues/8235)\u3001[#8234](https://github.com/farion1231/cc-switch/issues/8234)\u3001[#8418](https://github.com/farion1231/cc-switch/issues/8418)\uff09\u3002\u65b0\u7248 Claude Code \u628a\u4f1a\u8bdd ID \u5199\u6210 JSON \u653e\u5728 `metadata.user_id` \u91cc\uff0c\u8def\u7531\u4ee5\u524d\u89e3\u6790\u4e0d\u4e86\uff0c\u540c\u4e00\u4e2a\u5bf9\u8bdd\u7684\u6bcf\u4e2a\u8bf7\u6c42\u90fd\u88ab\u5f53\u6210\u65b0\u4f1a\u8bdd\uff1bClaude Desktop \u7684\u8bf7\u6c42\u4e5f\u6ca1\u6709\u8bfb\u4f1a\u8bdd\u5934\u3002\u7ed3\u679c\u662f\u8d70 Codex OAuth \u65f6\u6ca1\u6709\u7a33\u5b9a\u7684\u7f13\u5b58\u952e\uff0cClaude Desktop \u7ecf\u8def\u7531\u8fde Gemini \u65f6\u5de5\u5177\u8c03\u7528\u62a5\u9519\u3002\u73b0\u5728\u4e24\u79cd\u683c\u5f0f\u90fd\u8ba4\u5f97\uff0cClaude Desktop \u4e5f\u8bfb\u4f1a\u8bdd\u5934\u3002\n- **Codex \u5386\u53f2\u91cc\u6709\u4e00\u6761\u53c2\u6570\u574f\u6389\u7684\u5de5\u5177\u8c03\u7528\u65f6\uff0c\u4e4b\u540e\u6bcf\u8f6e\u90fd\u88ab Chat \u4e0a\u6e38\u62d2\u6536**\uff08[#5197](https://github.com/farion1231/cc-switch/issues/5197)\uff09\u3002\u4f8b\u5982\u8f93\u51fa\u88ab\u622a\u65ad\u3001\u53c2\u6570\u4e0d\u662f\u5b8c\u6574\u7684 JSON\u3002\u73b0\u5728\u8f6c\u6362\u65f6\u628a\u8fd9\u6761\u8c03\u7528\u6539\u5199\u6210\u666e\u901a\u6587\u5b57\uff0c\u6b63\u5e38\u7684\u5386\u53f2\u4e00\u4e2a\u5b57\u8282\u90fd\u4e0d\u6539\u3002\n- **Codex \u7ecf\u8def\u7531\u8fde DeepSeek \u7ecf\u5e38\u62a5 400**\uff08[#8331](https://github.com/farion1231/cc-switch/issues/8331)\uff09\u3002\u56de\u653e\u5de5\u5177\u5386\u53f2\u65f6\uff0c\u5de5\u5177\u8c03\u7528\u548c\u7ed3\u679c\u4e4b\u95f4\u5939\u7740\u7684\u7a7a\u6d88\u606f\u3001\u8fdb\u5ea6\u6587\u5b57\u6216\u601d\u8003\u5185\u5bb9\u4f1a\u88ab\u62c6\u6210\u5355\u72ec\u7684\u6d88\u606f\uff0cDeepSeek \u4e0d\u63a5\u53d7\u3002\u73b0\u5728\u53ea\u5bf9 DeepSeek \u6a21\u578b\u628a\u5b83\u4eec\u5e76\u56de\u5de5\u5177\u8c03\u7528\u90a3\u6761\u6d88\u606f\uff0c\u5176\u4ed6\u4e0a\u6e38\u4e0d\u53d7\u5f71\u54cd\u3002\n- **Codex \u805a\u5408\u6a21\u5f0f\u53bb\u6389\u4e86 `x-codex-beta-features` \u8bf7\u6c42\u5934**\uff08[#8435](https://github.com/farion1231/cc-switch/issues/8435)\uff09\u3002\u90e8\u5206\u539f\u751f Responses \u7f51\u5173\u9700\u8981\u8fd9\u4e2a\u5934\u3002\u73b0\u5728\u53d1\u5f80\u539f\u751f Responses \u4e0a\u6e38\u65f6\u4fdd\u7559\u5b83\uff0c\u8eab\u4efd\u76f8\u5173\u7684\u8bf7\u6c42\u5934\u4ecd\u7136\u53bb\u6389\u3002\n- **Claude Desktop \u539f\u751f\u4f9b\u5e94\u5546\u914d\u6a21\u578b\u6620\u5c04\u65f6\u5361\u5728\u6b7b\u5faa\u73af**\uff08[#8441](https://github.com/farion1231/cc-switch/issues/8441)\uff09\u3002\u4fdd\u5b58\u6620\u5c04\u8981\u6c42\u5148\u5f00\u8def\u7531\uff0c\u5f00\u8def\u7531\u53c8\u8981\u6c42\u5df2\u6709\u6620\u5c04\u3002\u73b0\u5728\u6ca1\u586b\u6a21\u578b\u5217\u8868\u7684\u539f\u751f\u4f9b\u5e94\u5546\u53ef\u4ee5\u5148\u8fdb\u5165\u8def\u7531\uff0c\u518d\u5728\u540c\u4e00\u5f20\u5361\u4e0a\u4fdd\u5b58\u6620\u5c04\u3002\n- **WebDAV / S3 \u540c\u6b65\u6162\u901f\u4f20\u8f93\u5230 300 \u79d2\u5c31\u88ab\u6390\u65ad**\uff08[#8428](https://github.com/farion1231/cc-switch/issues/8428)\uff09\u3002\u6162\u901f\u7f51\u7edc\u4e0b\uff0c\u4f20\u8f93\u8d85\u8fc7 300 \u79d2\u7684\u5927 Skills \u5305\u4f1a\u5931\u8d25\u3002\u73b0\u5728\u603b\u8d85\u65f6\u968f\u6587\u4ef6\u5927\u5c0f\u653e\u5bbd\uff0c\u4e0b\u8f7d\u53e6\u8bbe 120 \u79d2\u65e0\u6570\u636e\u8d85\u65f6\uff0c\u8fde\u63a5\u771f\u5361\u4f4f\u65f6\u4ecd\u4f1a\u53ca\u65f6\u62a5\u9519\u3002\n- **Windows \u4e0a\u5361\u7247\u7684\u300c\u6253\u5f00\u7ec8\u7aef\u300d\u62a5\u300c'claude' \u4e0d\u662f\u5185\u90e8\u6216\u5916\u90e8\u547d\u4ee4\u300d**\uff08[#8446](https://github.com/farion1231/cc-switch/issues/8446)\uff09\u3002\u5e94\u7528\u5185\u66f4\u65b0\u81ea\u52a8\u91cd\u542f\u540e\uff0c\u6216\u5148\u6253\u5f00 CC Switch \u518d\u5b89\u88c5 CLI \u65f6\uff0c\u8fdb\u7a0b\u91cc\u7f3a\u5c11\u7528\u6237\u7ea7 PATH\uff0c\u7ec8\u7aef\u6cbf\u7528\u4e86\u5b83\u3002\u73b0\u5728\u6253\u5f00\u7684\u7ec8\u7aef\u4f1a\u5e26\u4e0a\u5b8c\u6574\u7684\u7528\u6237\u548c\u7cfb\u7edf PATH\u3002\n- **Windows \u4e0a\u8bfb\u4e0d\u51fa WSL \u91cc Hermes \u7684\u4f1a\u8bdd**\uff08[#8205](https://github.com/farion1231/cc-switch/issues/8205)\uff09\u3002Hermes \u6570\u636e\u5728 WSL \u91cc\u65f6\uff0c\u6539\u4e3a\u5728\u5bf9\u5e94\u7684\u53d1\u884c\u7248\u5185\u53ea\u8bfb\u8bfb\u53d6\u6570\u636e\u5e93\uff1b\u9700\u8981\u53d1\u884c\u7248\u91cc\u6709 `python3`\uff083.7 \u53ca\u4ee5\u4e0a\uff09\u3002\u5176\u4ed6\u8def\u5f84\u4e0d\u53d7\u5f71\u54cd\u3002\n- **\u6545\u969c\u8f6c\u79fb\u540e\uff0c\u300c\u8def\u7531\u4e2d\u300d\u6807\u8bb0\u8fd8\u505c\u5728\u539f\u6765\u90a3\u5bb6**\uff08[#7998](https://github.com/farion1231/cc-switch/issues/7998)\uff09\u3002\n- **Pi \u5b50\u4ee3\u7406\u7684\u7528\u91cf\u7edf\u8ba1\u4e0d\u4e0a\uff0c\u6216\u8bb0\u6210 unknown**\uff08[#8298](https://github.com/farion1231/cc-switch/issues/8298)\uff09\u3002\u73b0\u5728\u4ece\u6bcf\u4e2a\u5b50\u4ee3\u7406\u81ea\u5df1\u7684\u4f1a\u8bdd\u6587\u4ef6\u5bfc\u5165\uff0c\u5e26\u4e0a\u771f\u5b9e\u7684\u6a21\u578b\u548c\u4f9b\u5e94\u5546\uff1b\u4ece\u5347\u7ea7\u540e\u7b2c\u4e00\u6b21\u5bfc\u5165\u8d77\u7edf\u8ba1\uff0c\u4e4b\u524d\u7684\u4e0d\u8865\u7b97\u3002\n- **\u62d6\u52a8\u6392\u5e8f\u4f9b\u5e94\u5546\u65f6\u5361\u7247\u88ab\u62c9\u4f38\u3001\u4e92\u76f8\u906e\u6321**\uff08[#8283](https://github.com/farion1231/cc-switch/issues/8283)\uff09\u3002\n- **Skills \u4e0b\u8f7d\u5931\u8d25\u65f6\uff0c\u771f\u6b63\u7684\u539f\u56e0\u88ab\u300c\u4ed3\u5e93\u6216\u5206\u652f\u4e0d\u5b58\u5728\uff0c\u8bf7\u68c0\u67e5\u5730\u5740\u300d\u76d6\u6389\u3002** \u4ee5\u524d\u914d\u7f6e\u7684\u5206\u652f\u5931\u8d25\u540e\u4f1a\u4f9d\u6b21\u8bd5 main\u3001master\uff0c\u6700\u540e\u62a5\u7684\u662f master \u7684 404\u3002\u73b0\u5728\u53ea\u6709 404 \u624d\u6362\u5206\u652f\uff0c\u8d85\u65f6\u3001\u538b\u7f29\u5305\u8fc7\u5927\u3001\u89e3\u538b\u5931\u8d25\u90fd\u6309\u539f\u56e0\u62a5\u9519\u3002\n- **DeepSeek \u4e00\u4e2a\u5e01\u79cd\u7684\u94b1\u5305\u8fd8\u6709\u4f59\u989d\uff0c\u53e6\u4e00\u4e2a\u4e3a 0 \u65f6\u663e\u793a\u300c\u4f59\u989d\u5df2\u7528\u5b8c\u300d**\uff08[#8170](https://github.com/farion1231/cc-switch/issues/8170)\uff09\u3002\u73b0\u5728\u53ea\u8981\u6709\u94b1\u5305\u8fd8\u6709\u4f59\u989d\uff0c\u5c31\u4e0d\u518d\u5217\u51fa\u7a7a\u94b1\u5305\uff0c\u5361\u7247\u4e5f\u4e0d\u4f1a\u6bcf\u6b21\u542f\u52a8\u90fd\u81ea\u52a8\u5c55\u5f00\u989d\u5ea6\u9762\u677f\u3002\n- **\u7a97\u53e3\u8f83\u77ee\u65f6\uff0cCodex \u6a21\u578b\u5217\u8868\u7684\u601d\u8003\u7b49\u7ea7\u5f39\u7a97\u4e0b\u534a\u622a\u88ab\u622a\u6389**\uff08[#8094](https://github.com/farion1231/cc-switch/issues/8094)\uff09\u3002\u73b0\u5728\u5f39\u7a97\u4e0d\u8d85\u51fa\u7a97\u53e3\uff0c\u653e\u4e0d\u4e0b\u65f6\u5217\u8868\u5728\u5f39\u7a97\u91cc\u6eda\u52a8\uff0c\u300c\u9ed8\u8ba4\u7b49\u7ea7\u300d\u4e00\u76f4\u53ef\u89c1\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n- Windows \u4e0a\u5df2\u7ecf\u5e26\u5c3e\u5df4\u7684 `settings.json` \u4f1a\u5728\u9996\u6b21\u542f\u52a8\u65f6\u6062\u590d\uff0c\u539f\u6587\u4ef6\u4fdd\u7559\u4e3a `settings.json.broken-<\u65f6\u95f4>.bak`\uff1b\u4e4b\u524d\u66f4\u65b0\u65f6\u5df2\u7ecf\u88ab\u91cd\u7f6e\u7684\u8bbe\u7f6e\u65e0\u6cd5\u627e\u56de\u3002\n- Pi \u5b50\u4ee3\u7406\u7528\u91cf\u4ece\u5347\u7ea7\u540e\u7b2c\u4e00\u6b21\u5bfc\u5165\u5f00\u59cb\u7edf\u8ba1\uff0c\u4e4b\u524d\u7684\u8bb0\u5f55\u4fdd\u6301\u539f\u6837\u3002\n- \u5728 Windows \u4e0a\u8bfb\u53d6 WSL \u91cc\u7684 Hermes \u4f1a\u8bdd\uff0c\u9700\u8981\u53d1\u884c\u7248\u91cc\u88c5\u6709 `python3`\uff083.7 \u53ca\u4ee5\u4e0a\uff09\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @Foodie05\uff08Claude Code \u4f1a\u8bdd\u8bc6\u522b\uff09\u3001@MonsterXia\uff08Codex \u574f\u5de5\u5177\u8c03\u7528\u5386\u53f2\uff09\u3001@funkpopo\uff08DeepSeek \u5de5\u5177\u5386\u53f2\u3001\u8d8b\u52bf\u56fe\u6837\u5f0f\u3001\u62d6\u52a8\u6392\u5e8f\uff09\u3001@JfanLiu\uff08\u805a\u5408\u6a21\u5f0f beta \u8bf7\u6c42\u5934\uff09\u3001@ix-prism\uff08Claude Desktop \u6620\u5c04\u5faa\u73af\uff09\u3001@Dante-dan\uff08WSL \u91cc\u7684 Hermes \u4f1a\u8bdd\uff09\u3001@SmileMachine\uff08\u8def\u7531\u5207\u6362\u63d0\u793a\uff09\u3001@Chaoqi31\uff08Pi \u5b50\u4ee3\u7406\u7528\u91cf\uff09\u3001@Carl723000\uff08\u7528\u91cf\u5bfc\u5165\u63d0\u901f\uff09\u3001@alkank\uff08\u571f\u8033\u5176\u8bed\uff09\u3001@NestorRay\uff08\u9762\u677f\u8fc7\u6e21\u6e05\u7406\uff09\u7684\u8d21\u732e\u3002\n\n\u611f\u8c22 @wangding0610\u3001@DiYi1999\u3001@CaiSre\u3001@vincerise\u3001@qiangyidian\u3001@zhouys0725\u3001@qianlongwuyong-zxl\u3001@ElijahHong\u3001@wx2cyj\u3001@rvwmng9rvk-crypto\u3001@luckday888\u3001@ramonmi\u3001@quntaoli\u3001@LwTen2019\u3001@CYRickyArAr\u3001@edwardchenchen\u3001@ximigoo \u62a5\u544a\u9