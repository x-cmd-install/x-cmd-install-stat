"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5800,"digest":"sha256:af71d43390ff02853debd7524191c5bbc0b1b8c4f98e9dfcaa6f775e92b09bf3","download_count":9415,"created_at":"2026-10-10T15:51:18Z","updated_at":"2026-10-10T15:51:18Z"}],"body":"# CC Switch v4.0.8\n\n### 4.0 \u6b63\u5f0f\u7248\u7684\u7b2c\u56db\u4e2a\u4fee\u590d\u7248\u672c\n\n\u53ea\u88c5\u4e86 Codex \u684c\u9762\u7248\u3001\u6ca1\u6709\u5355\u72ec\u88c5 Codex \u547d\u4ee4\u884c\u7684\u7528\u6237\uff0c\u73b0\u5728\u4e5f\u80fd\u7528 Codex \u805a\u5408\u6a21\u5f0f\u4e86\u3002\u5b98\u65b9\u6a21\u578b\u5217\u8868\u8bfb\u4e0d\u5230\u65f6\uff0c\u63d0\u793a\u4f1a\u5199\u660e\u539f\u56e0\uff0c\u95ee\u9898\u89e3\u51b3\u540e\u63d0\u793a\u4e5f\u4f1a\u81ea\u5df1\u6d88\u5931\u3002\u6dfb\u52a0\u548c\u7f16\u8f91\u4f9b\u5e94\u5546\u65f6\uff0c\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u4f1a\u5e26\u4e0a\u4f60\u914d\u7f6e\u7684\u8bf7\u6c42\u5934\uff0c\u9700\u8981\u989d\u5916\u8bf7\u6c42\u5934\u7684\u7f51\u5173\u4e0d\u4f1a\u518d\u62d2\u7edd\u3002\u300c\u8bbe\u7f6e \u2192 \u6570\u636e\u300d\u65b0\u589e\u300c\u6253\u5f00\u65e5\u5fd7\u300d\u6309\u94ae\u3002\u6df1\u8272\u6a21\u5f0f\u7684\u6587\u5b57\u8c03\u6697\u4e86\u4e00\u4e9b\uff0c\u4e0d\u518d\u90a3\u4e48\u523a\u773c\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.8-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.8-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u300c\u8bbe\u7f6e \u2192 \u6570\u636e \u2192 \u5e94\u7528\u8bca\u65ad\u65e5\u5fd7\u300d\u65b0\u589e\u300c\u6253\u5f00\u65e5\u5fd7\u300d\u6309\u94ae\u3002** \u70b9\u51fb\u540e\u4f1a\u5728\u7cfb\u7edf\u7684\u6587\u4ef6\u7ba1\u7406\u5668\u91cc\u9009\u4e2d `cc-switch.log`\uff1b\u65e5\u5fd7\u6587\u4ef6\u8fd8\u6ca1\u751f\u6210\u65f6\u6253\u5f00\u65e5\u5fd7\u6240\u5728\u7684\u6587\u4ef6\u5939\u3002\u62a5\u544a\u95ee\u9898\u65f6\u53ef\u4ee5\u76f4\u63a5\u628a\u5b83\u9644\u4e0a\uff0c\u4e0d\u7528\u518d\u53bb\u627e\u9690\u85cf\u7684\u914d\u7f6e\u76ee\u5f55\u3002\n\n## \u4fee\u590d\n\n- **\u53ea\u88c5\u4e86 Codex \u684c\u9762\u7248\u65f6\uff0c\u805a\u5408\u9875\u63d0\u793a\u300c\u8bfb\u53d6\u4e0d\u5230 Codex \u6a21\u578b\u5217\u8868\u300d\uff0c\u805a\u5408\u6a21\u5f0f\u7528\u4e0d\u4e86\u3002** \u8054\u7f51\u83b7\u53d6\u5b98\u65b9\u5217\u8868\u5931\u8d25\u65f6\uff0cCC Switch \u4f1a\u6539\u7528 Codex \u547d\u4ee4\u884c\u81ea\u5e26\u7684\u6a21\u578b\u5217\u8868\uff0c\u4f46\u4ee5\u524d\u53ea\u5728\u7cfb\u7edf\u8def\u5f84\u91cc\u627e `codex` \u547d\u4ee4\u3002\u53ea\u88c5\u684c\u9762\u7248\u7684\u7528\u6237\u6ca1\u6709\u8fd9\u4e2a\u547d\u4ee4\uff0c\u6240\u4ee5\u4e00\u76f4\u5931\u8d25\u3002\u73b0\u5728\u627e\u4e0d\u5230\u65f6\u4f1a\u518d\u53bb\u7528 Codex \u684c\u9762\u7248\u81ea\u5e26\u7684\u547d\u4ee4\u884c\uff1amacOS \u4e0a\u627e\u300c\u5e94\u7528\u7a0b\u5e8f\u300d\u91cc\u7684 ChatGPT.app \u548c\u6539\u540d\u524d\u7684 Codex.app\uff0c\u4e24\u4e2a\u90fd\u5728\u65f6\u7528 ChatGPT.app\uff0c\u907f\u514d\u65e7\u7684 Codex.app \u7ed9\u51fa\u8fc7\u65f6\u7684\u6a21\u578b\u5217\u8868\uff1bWindows \u4e0a\u627e\u684c\u9762\u7248\u5b89\u88c5\u76ee\u5f55\u91cc\u6700\u65b0\u7684\u4e00\u4e2a\u7248\u672c\u3002\u5355\u72ec\u5b89\u88c5\u7684 Codex \u547d\u4ee4\u884c\u4ecd\u7136\u4f18\u5148\u3002\n- **\u5b98\u65b9\u6a21\u578b\u5217\u8868\u8bfb\u4e0d\u5230\u65f6\uff0c\u63d0\u793a\u770b\u4e0d\u51fa\u539f\u56e0\uff0c\u95ee\u9898\u89e3\u51b3\u540e\u63d0\u793a\u4e5f\u4e0d\u4f1a\u6d88\u5931\u3002** \u4ee5\u524d\u6240\u6709\u539f\u56e0\u90fd\u663e\u793a\u6210\u540c\u4e00\u53e5\u300c\u8bfb\u53d6\u4e0d\u5230 Codex \u6a21\u578b\u5217\u8868\u300d\u3002\u73b0\u5728\u63d0\u793a\u4e0b\u9762\u4f1a\u5217\u51fa\u5177\u4f53\u539f\u56e0\uff0c\u5e76\u544a\u8bc9\u4f60\u600e\u4e48\u5904\u7406\uff1aCodex \u6ca1\u6709\u53ef\u7528\u7684 ChatGPT \u767b\u5f55\u3001\u767b\u5f55\u8d85\u8fc7 8 \u5929\u6ca1\u6709\u5237\u65b0\u3001\u767b\u5f55\u4fe1\u606f\u4e0d\u5b8c\u6574\u3001\u8bfb\u4e0d\u5230 Codex \u7248\u672c\u3001\u8054\u7f51\u83b7\u53d6\u5931\u8d25\u3001\u8fd4\u56de\u7684\u6570\u636e\u4e0d\u5b8c\u6574\uff1bCodex \u81ea\u5e26\u7684\u5217\u8868\u5219\u5206\u4e3a\u627e\u4e0d\u5230 Codex \u547d\u4ee4\u884c\u3001\u547d\u4ee4\u884c\u6ca1\u80fd\u8f93\u51fa\u5217\u8868\u3001\u5217\u8868\u91cc\u6ca1\u6709\u80fd\u7528\u7684\u6a21\u578b\u3002\u8054\u7f51\u5931\u8d25\u548c\u547d\u4ee4\u884c\u5931\u8d25\u7684\u8be6\u7ec6\u4fe1\u606f\u4f1a\u5199\u8fdb\u65e5\u5fd7\u3002\u53e6\u5916\uff0c\u4ee5\u524d\u6362\u7528\u5907\u7528\u5217\u8868\u540e\uff0c\u5373\u4f7f\u5b98\u65b9\u5217\u8868\u540e\u6765\u6062\u590d\u4e86\uff08\u6bd4\u5982\u8fc7\u671f\u7684\u767b\u5f55\u88ab Codex \u81ea\u52a8\u5237\u65b0\uff09\uff0c\u63d0\u793a\u4e5f\u8981\u7b49\u4f60\u4e0b\u6b21\u624b\u52a8\u5207\u6362\u624d\u4f1a\u6d88\u5931\uff1b\u73b0\u5728 CC Switch \u4f1a\u81ea\u52a8\u6362\u56de\u5b98\u65b9\u5217\u8868\uff0c\u63d0\u793a\u968f\u4e4b\u6d88\u5931\u3002\n- **\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u4e0d\u5e26\u4f60\u914d\u7f6e\u7684\u8bf7\u6c42\u5934\uff0c\u9700\u8981\u989d\u5916\u8bf7\u6c42\u5934\u7684\u7f51\u5173\u4f1a\u62d2\u7edd\u3002** \u6bd4\u5982 Cloudflare AI Gateway \u8981\u6c42 `cf-aig-authorization` \u8bf7\u6c42\u5934\u3002\u73b0\u5728 OpenCode \u4f9b\u5e94\u5546\u4f1a\u5e26\u4e0a\u5b83\u914d\u7f6e\u7684\u8bf7\u6c42\u5934\uff1bClaude Code\u3001Codex \u548c Grok Build \u4f9b\u5e94\u5546\u4f1a\u5e26\u4e0a\u300cHeader \u8986\u76d6\u300d\u91cc\u586b\u7684\u8bf7\u6c42\u5934\uff0c\u683c\u5f0f\u4e0d\u5bf9\u6216\u7559\u7a7a\u65f6\u7167\u5e38\u83b7\u53d6\u3002\u5728 Codex \u548c Grok Build \u7684\u8868\u5355\u91cc\u4fee\u6539\u300cHeader \u8986\u76d6\u300d\u540e\uff0c\u5df2\u7ecf\u83b7\u53d6\u7684\u6a21\u578b\u5217\u8868\u4f1a\u6e05\u7a7a\uff0c\u907f\u514d\u9009\u5230\u5f53\u524d\u8eab\u4efd\u7528\u4e0d\u4e86\u7684\u6a21\u578b\u3002\n- **\u6df1\u8272\u6a21\u5f0f\u7684\u6587\u5b57\u592a\u4eae\uff0c\u770b\u4e45\u4e86\u523a\u773c\u3002** \u4e09\u6863\u6587\u5b57\u989c\u8272\u90fd\u63a5\u8fd1\u7eaf\u767d\uff0c\u6ee1\u5c4f\u8868\u683c\u548c\u6807\u7b7e\u65f6\u663e\u5f97\u5f88\u51b2\uff0c\u4e3b\u6b21\u4e5f\u5206\u4e0d\u6e05\u3002\u73b0\u5728\u4e09\u6863\u90fd\u8c03\u6697\u4e86\u4e00\u4e9b\uff0c\u6b21\u8981\u6587\u5b57\u5728\u5361\u7247\u548c\u9009\u4e2d\u80cc\u666f\u4e0a\u4ecd\u7136\u4fdd\u6301\u8db3\u591f\u7684\u5bf9\u6bd4\u5ea6\u3002\u6d45\u8272\u6a21\u5f0f\u6ca1\u6709\u53d8\u5316\u3002\n\n**\u5176\u4ed6\uff1a**\n- v4.0.7 \u53d1\u5e03\u8bf4\u660e\u91cc\u300c\u538b\u7f29 Codex \u5386\u53f2\u4f1a\u8bdd\u300d\u4e00\u8282\u8865\u5145\u4e86\u600e\u4e48\u6253\u5f00\u3001\u4ec0\u4e48\u65f6\u5019\u538b\u7f29\u3001\u600e\u4e48\u7ee7\u7eed\u65e7\u4f1a\u8bdd\u3001CC Switch \u91cc\u600e\u4e48\u663e\u793a\u548c\u9700\u8981\u6ce8\u610f\u7684\u5730\u65b9\u3002\n- \u82f1\u6587\u548c\u65e5\u6587\u7684\u989d\u5ea6\u663e\u793a\u8bf4\u660e\u3001\u82f1\u6587\u3001\u65e5\u6587\u548c\u7e41\u4f53\u4e2d\u6587\u7684\u5907\u4efd\u63d0\u793a\uff0c\u6539\u7528\u754c\u9762\u4e0a\u5b9e\u9645\u663e\u793a\u7684\u540d\u79f0\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @SailingLoong\uff08OpenCode \u83b7\u53d6\u6a21\u578b\u5217\u8868\u65f6\u5e26\u4e0a\u8bf7\u6c42\u5934\uff09\u3001@ggbdpq\uff08Claude Code\u3001Codex \u83b7\u53d6\u6a21\u578b\u5217\u8868\u65f6\u5e26\u4e0a\u300cHeader \u8986\u76d6\u300d\uff09\u7684\u8d21\u732e\u3002\n\n\u611f\u8c22 @xovow\u3001@YX-bobi\u3001@cydebbb \u62a5\u544a\u95ee\u9898\u548c\u63d0\u51fa\u5efa\u8bae\u3002\n\n\u5b8c\u6574\u7684\u6280\u672f\u7ec6\u8282\u8bf7\u89c1 [CHANGELOG](https://github.com/farion1231/cc-switch/blob/main/CHANGELOG.md)\u3002\n","reactions":{"total_count":5,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
