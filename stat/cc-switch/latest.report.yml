","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:00a8ac6df6ebab488273072016ae4ef20bd0cb38cf623287488bccbcd45edc16","download_count":10510,"created_at":"2026-10-23T12:49:40Z","updated_at":"2026-10-23T12:49:40Z"}],"body":"# CC Switch v4.0.19\n\n\u672c\u7248\u672c\u65b0\u589e\u5bf9 Kimi Code \u7684\u652f\u6301\uff0c\u5b83\u662f CC Switch \u7ba1\u7406\u7684\u7b2c 12 \u4e2a\u5e94\u7528\u3002**Kimi Code \u7684\u547d\u4ee4\u884c\u7248\u548c\u684c\u9762\u7248\u5171\u7528\u540c\u4e00\u4efd\u914d\u7f6e\uff0c\u6240\u4ee5 CC Switch \u7684\u652f\u6301\u5bf9\u4e24\u8005\u90fd\u9002\u7528\u3002**Kimi Code \u7684\u591a\u4e2a\u4f9b\u5e94\u5546\u53ef\u4ee5\u540c\u65f6\u5199\u8fdb\u5b83\u7684\u914d\u7f6e\uff0c\u5728 CC Switch \u91cc\u6dfb\u52a0\u3001\u79fb\u9664\u3001\u8bbe\u4e3a\u9ed8\u8ba4\uff1bMCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u540c\u6b65\u7ed9 Kimi Code\uff0c\u4f1a\u8bdd\u53ef\u4ee5\u6d4f\u89c8\u548c\u6062\u590d\uff0c\u7528\u91cf\u4ece\u4f1a\u8bdd\u65e5\u5fd7\u5bfc\u5165\uff1b\u300c\u5e94\u7528\u300d\u9875\u53ef\u4ee5\u5b89\u88c5\u3001\u5347\u7ea7\u3001\u5378\u8f7d Kimi Code\u3002Kimi \u7f16\u7a0b\u5957\u9910\u4e5f\u80fd\u5728\u6388\u6743\u4e2d\u5fc3\u767b\u5f55\uff0c\u53ef\u4ee5\u6dfb\u52a0\u591a\u4e2a\u8d26\u53f7\uff0c\u6bcf\u4e2a\u8d26\u53f7\u663e\u793a\u6635\u79f0\u548c\u989d\u5ea6\u3002\u7528\u91cf\u7edf\u8ba1\u9875\u91cd\u65b0\u6392\u4e86\u7248\uff1a\u65f6\u95f4\u3001\u5e94\u7528\u3001\u4f9b\u5e94\u5546\u548c\u6a21\u578b\u653e\u5728\u540c\u4e00\u884c\uff0c\u9009\u4e2d\u7684\u6307\u6807\u540c\u65f6\u51b3\u5b9a\u8d8b\u52bf\u56fe\u548c\u70ed\u529b\u56fe\uff0c\u660e\u7ec6\u8868\u6539\u6210\u5e26\u6570\u91cf\u7684\u9875\u7b7e\uff0c\u8bf7\u6c42\u65e5\u5fd7\u53ef\u4ee5\u9009\u6bcf\u9875\u6761\u6570\u3002\u53e6\u5916\u4fee\u590d\u4e86\u805a\u5408\u6a21\u5f0f\u4e0b\u4ece\u7b2c\u4e09\u65b9 GPT \u5207\u5230\u5176\u4ed6\u6a21\u578b\u540e Codex \u4e00\u76f4\u62a5 `unsupported call: exec`\u3001\u5728 Linux/WSL \u4e0a\u4ece\u7ec8\u7aef\u542f\u52a8\u65f6\u6253\u5f00\u300c\u5173\u4e8e\u300d\u9875\u6574\u4e2a\u5e94\u7528\u5361\u6b7b\u3001\u7ed9 Codex \u9009\u6a21\u578b\u540e\u56fe\u7247\u8f93\u5165\u88ab\u5173\u6389\u3001Claude Code \u7684 VS Code \u6269\u5c55\u7ecf Responses \u4e0a\u6e38\u65f6\u663e\u793a `redacted_thinking` \u62a5\u9519\u3001macOS \u4e0a Claude \u8ba2\u9605\u989d\u5ea6\u8bfb\u9519\u94a5\u5319\u4e32\u6761\u76ee\u3001Antigravity \u989d\u5ea6\u7f3a\u5c11 Gemini \u4e00\u7ec4\u3001Hermes \u88c5\u5728 WSL \u91cc\u65f6\u63a7\u5236\u53f0\u5728 Windows \u4e0a\u542f\u52a8\u3001\u6309 Esc \u4e00\u6b21\u5173\u6389\u6240\u6709\u53e0\u8d77\u6765\u7684\u9762\u677f\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.19-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.19-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n### Kimi Code\n\nKimi Code\uff08\u547d\u4ee4\u662f `kimi`\uff09\u73b0\u5728\u662f\u4e00\u4e2a\u72ec\u7acb\u7684\u5e94\u7528\uff0c\u6709\u81ea\u5df1\u7684\u4f9b\u5e94\u5546\u3001MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u3001\u4f1a\u8bdd\u548c\u7528\u91cf\uff08[#8687](https://github.com/farion1231/cc-switch/pull/8687)\uff09\u3002\u914d\u7f6e\u5728 `~/.kimi-code/config.toml`\uff0c\u8bbe\u7f6e\u4e86 `KIMI_CODE_HOME` \u65f6\u7528\u5b83\u6307\u5b9a\u7684\u76ee\u5f55\u3002\n\n> **\ud83d\udca1 \u547d\u4ee4\u884c\u7248\u548c\u684c\u9762\u7248\u90fd\u9002\u7528\u3002** Kimi Code \u7684\u547d\u4ee4\u884c\u7248\u548c\u684c\u9762\u7248\u5171\u7528 `~/.kimi-code` \u91cc\u7684\u540c\u4e00\u4efd\u914d\u7f6e\u548c\u767b\u5f55\uff0c\u5728 CC Switch \u91cc\u6dfb\u52a0\u7684\u4f9b\u5e94\u5546\u3001MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u548c\u5b98\u65b9\u8d26\u53f7\uff0c\u4e24\u4e2a\u7248\u672c\u90fd\u80fd\u76f4\u63a5\u7528\u3002\n\n- **\u4f9b\u5e94\u5546\u53ef\u4ee5\u540c\u65f6\u542f\u7528\u3002** \u548c OpenCode \u4e00\u6837\uff0c\u591a\u4e2a\u4f9b\u5e94\u5546\u53ef\u4ee5\u540c\u65f6\u5199\u8fdb Kimi Code \u7684\u914d\u7f6e\uff0c\u5728 Kimi Code \u91cc\u7528 `/model` \u9009\u62e9\u3002\u300c\u53ef\u6dfb\u52a0\u300d\u7684\u5361\u7247\u70b9\u300c\u6dfb\u52a0\u300d\u5199\u8fdb\u914d\u7f6e\uff0c\u4e0d\u6539\u9ed8\u8ba4\u6a21\u578b\uff1b\u5df2\u6dfb\u52a0\u7684\u5361\u7247\u53ef\u4ee5\u300c\u79fb\u9664\u300d\uff0c\u300c\u8bbe\u4e3a\u9ed8\u8ba4\u300d\u5728\u5361\u7247\u7684\u66f4\u591a\u83dc\u5355\u91cc\u3002Kimi Code \u6b63\u5728\u7528\u4f5c\u9ed8\u8ba4\u6a21\u578b\u6216\u5b50\u4ee3\u7406\u6a21\u578b\u7684\u4f9b\u5e94\u5546\u4e0d\u80fd\u79fb\u9664\uff0c\u4f1a\u63d0\u793a\u4f60\u5148\u5728 Kimi Code \u91cc\u6362\u6389\u3002\u53ea\u6539 CC Switch \u7ba1\u7684\u90a3\u4e9b\u4f9b\u5e94\u5546\u548c\u6a21\u578b\uff0c\u5176\u4ed6\u914d\u7f6e\u539f\u6837\u4fdd\u7559\u3002\n- **\u6dfb\u52a0\u4f9b\u5e94\u5546\u3002** \u9884\u8bbe\u548c\u5176\u4ed6\u5e94\u7528\u4e00\u6837\u6309\u300c\u6a21\u578b\u5382\u5546\u300d\u300c\u7b2c\u4e09\u65b9\u5e73\u53f0\u300d\u300c\u4e91\u670d\u52a1\u5546\u300d\u300c\u672c\u5730\u300d\u5206\u7ec4\uff0c\u53e6\u6709\u300c\u8d26\u53f7\u767b\u5f55\u300d\u5206\u7ec4\u7528\u6765\u767b\u5f55 Kimi \u5b98\u65b9\u8d26\u53f7\u3002\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u540e\u9009\u4e2d\u7684\u6a21\u578b\u4f1a\u81ea\u52a8\u586b\u4e0a\u4e0a\u4e0b\u6587\u7a97\u53e3\u3001\u601d\u8003\u548c\u56fe\u7247\u8f93\u5165\uff1b\u6bcf\u4e2a\u6a21\u578b\u4e00\u884c\uff0c\u53ef\u4ee5\u586b\u663e\u793a\u540d\u79f0\uff08Kimi Code \u7684 `/model` \u91cc\u663e\u793a\u5b83\uff09\u3002\u300c\u59cb\u7ec8\u601d\u8003\u300d\u300c\u6309\u9700\u52a0\u8f7d\u5de5\u5177\u300d\u65c1\u8fb9\u6709\u300c?\u300d\u8bf4\u660e\uff1b\u8bf7\u6c42\u5934\u632a\u8fdb\u4e86\u300c\u9ad8\u7ea7\u9009\u9879\u300d\u3002\n- **MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u3002** MCP \u652f\u6301 stdio\u3001HTTP \u548c SSE\uff1bSkills \u4e0d\u4f1a\u8986\u76d6 Kimi Code \u81ea\u5df1\u76ee\u5f55\u91cc\u7684\u540c\u540d\u6280\u80fd\u3002\n- **\u4f1a\u8bdd\u548c\u7528\u91cf\u3002** \u53ef\u4ee5\u6d4f\u89c8\u548c\u6062\u590d Kimi Code \u7684\u4f1a\u8bdd\uff1b\u7528\u91cf\u4ece\u4f1a\u8bdd\u65e5\u5fd7\u5bfc\u5165\uff0c\u5305\u62ec\u8f93\u5165\u3001\u8f93\u51fa\u3001\u7f13\u5b58\u3001\u9996\u5b57\u65f6\u95f4\u548c\u8017\u65f6\u3002\n- **\u300c\u5e94\u7528\u300d\u9875\u7ba1\u7406 Kimi Code\u3002** \u7528\u5b98\u65b9\u5b89\u88c5\u7a0b\u5e8f\u5b89\u88c5\uff0c\u53ef\u4ee5\u5347\u7ea7\u548c\u5378\u8f7d\u3002\n- Kimi Code \u4e0d\u7ecf\u8fc7\u672c\u5730\u8def\u7531\uff0c\u4e5f\u6ca1\u6709\u805a\u5408\u6a21\u5f0f\u3002\n\n### Kimi \u5b98\u65b9\u8d26\u53f7\n\n\u5728\u6388\u6743\u4e2d\u5fc3\u53ef\u4ee5\u300c\u767b\u5f55 Kimi\u300d\uff08\u6dfb\u52a0\u4f9b\u5e94\u5546\u91cc\u9009\u300cKimi Code \u5b98\u65b9\u767b\u5f55\u300d\u4e5f\u4f1a\u5e26\u4f60\u8fc7\u53bb\uff09\uff0c\u9009\u56fd\u5185\u7248\u6216\u6d77\u5916\u7248\uff0c\u5728\u6d4f\u89c8\u5668\u91cc\u5b8c\u6210\u6388\u6743\u540e\u81ea\u52a8\u6dfb\u52a0\u5b98\u65b9\u6a21\u578b\uff08[#8710](https://github.com/farion1231/cc-switch/pull/8710)\u3001[#8726](https://github.com/farion1231/cc-switch/pull/8726)\uff09\u3002\n\n- **\u591a\u4e2a\u8d26\u53f7\u3002** \u7b2c\u4e00\u4e2a\u8d26\u53f7\u7528 Kimi Code \u81ea\u5df1\u7684\u767b\u5f55\u4f4d\u7f6e\uff1b\u4e4b\u540e\u6dfb\u52a0\u7684\u6bcf\u4e2a\u8d26\u53f7\u90fd\u6709\u81ea\u5df1\u7684\u51ed\u636e\u3001\u4f9b\u5e94\u5546\u548c\u6a21\u578b\uff0c\u5728 Kimi Code \u7684\u6a21\u578b\u5217\u8868\u91cc\u663e\u793a\u4e3a\u300cKimi \u8ba2\u9605 <\u6635\u79f0>\u300d\u3002\u5728\u6388\u6743\u4e2d\u5fc3\u70b9\u300c\u4f7f\u7528\u6b64\u8d26\u53f7\u300d\uff0c\u6216\u5728\u5361\u7247\u66f4\u591a\u83dc\u5355\u91cc\u9009\u300c\u8bbe\u4e3a\u9ed8\u8ba4\u300d\uff0c\u5c31\u628a Kimi Code \u7684\u9ed8\u8ba4\u6a21\u578b\u6362\u6210\u8fd9\u4e2a\u53f7\u7684\u3002\u5b98\u65b9\u5361\u7247\u4e0d\u80fd\u5728\u4f9b\u5e94\u5546\u9875\u7f16\u8f91\u6216\u5220\u9664\uff0c\u8981\u5728\u6388\u6743\u4e2d\u5fc3\u7ba1\u7406\u3002\n- **\u6635\u79f0\u548c\u989d\u5ea6\u3002** \u6bcf\u4e2a\u8d26\u53f7\u548c\u5b98\u65b9\u5361\u7247\u90fd\u663e\u793a\u6635\u79f0\u548c\u989d\u5ea6\u3002\u5feb\u8fc7\u671f\u7684\u767b\u5f55\u4f1a\u5728\u540e\u53f0\u7eed\u671f\uff0c\u548c Kimi Code \u81ea\u5df1\u7528\u540c\u4e00\u628a\u9501\uff0c\u4e0d\u4f1a\u548c\u5b83\u62a2\uff1bWindows \u4e0a\u53ea\u8bfb\u53d6\u989d\u5ea6\uff0c\u4e0d\u7eed\u671f\u3002\n- **\u91cd\u65b0\u767b\u5f55\u548c\u5220\u9664\u3002** \u91cd\u65b0\u767b\u5f55\u540c\u4e00\u4e2a\u53f7\u4f1a\u66f4\u65b0\u539f\u6765\u7684\u90a3\u4e00\u4efd\uff0c\u4e0d\u4f1a\u591a\u51fa\u4e00\u4e2a\uff1b\u5220\u9664\u5355\u72ec\u6dfb\u52a0\u7684\u8d26\u53f7\u4f1a\u4e00\u8d77\u5220\u6389\u5b83\u7684\u4f9b\u5e94\u5546\u3001\u6a21\u578b\u3001\u51ed\u636e\u548c\u5361\u7247\uff0c\u6b63\u5728\u4f7f\u7528\u65f6\u4e0d\u80fd\u5220\u3002Kimi Code \u81ea\u5df1\u767b\u7740\u7684\u53f7\u53ea\u4f1a\u4ece\u5217\u8868\u91cc\u79fb\u51fa\uff0cCC Switch \u4e0d\u4f1a\u66ff\u5b83\u9000\u51fa\u767b\u5f55\u3002\n- \u5728 Kimi Code \u91cc\u5df2\u7ecf\u767b\u5f55\u7684\u53f7\u4f1a\u81ea\u52a8\u51fa\u73b0\u5728\u6388\u6743\u4e2d\u5fc3\u3002\n\n## \u6539\u8fdb\n\n**\u7528\u91cf\u7edf\u8ba1\u9875\u91cd\u65b0\u6392\u7248**\uff08[#8711](https://github.com/farion1231/cc-switch/pull/8711)\uff09\u3002\n\n- \u9875\u9762\u53f3\u4e0a\u89d2\u53ea\u7559\u4e00\u4e2a\u540c\u6b65\u6309\u94ae\uff08\u663e\u793a\u4e0a\u6b21\u540c\u6b65\u65f6\u95f4\uff09\u548c\u4e00\u4e2a\u8bbe\u7f6e\u6309\u94ae\uff0c\u6570\u636e\u6765\u6e90\u3001\u663e\u793a\u548c\u4ef7\u683c\u8bbe\u7f6e\u90fd\u5728\u8bbe\u7f6e\u91cc\u3002\u8bf7\u6c42\u65e5\u5fd7\u663e\u793a\u54ea\u4e9b\u5217\uff0c\u6539\u5728\u8bf7\u6c42\u65e5\u5fd7\u9875\u7b7e\u53f3\u4fa7\u7684\u300c\u8bf7\u6c42\u65e5\u5fd7\u7684\u5217\u300d\u83dc\u5355\u91cc\u9009\u3002\n- \u65f6\u95f4\u3001\u5e94\u7528\u3001\u4f9b\u5e94\u5546\u548c\u6a21\u578b\u653e\u5728\u540c\u4e00\u884c\uff0c\u4f9b\u5e94\u5546\u548c\u6a21\u578b\u5408\u6210\u4e00\u4e2a\u4e24\u7ea7\u83dc\u5355\u3002\n- \u6982\u89c8\u91cc\u70b9\u9009\u4e00\u4e2a\u6307\u6807\uff0c\u8d8b\u52bf\u56fe\u548c\u70ed\u529b\u56fe\u5c31\u663e\u793a\u5b83\uff1b\u8f93\u5165\u3001\u8f93\u51fa\u3001\u7f13\u5b58\u8bfb\u5199\u56db\u9879 Token \u53ef\u4ee5\u5c55\u5f00\u6210\u7b2c\u4e8c\u884c\u3002\n- \u660e\u7ec6\u9875\u7b7e\u53bb\u6389\u4e86\u300c\u8bbe\u7f6e\u300d\uff0c\u5269\u4e0b\u300c\u8bf7\u6c42\u65e5\u5fd7\u300d\u300c\u4f9b\u5e94\u5546\u300d\u300c\u6a21\u578b\u300d\u4e09\u4e2a\uff0c\u6807\u7b7e\u4e0a\u5e26\u6570\u91cf\uff1b\u8868\u683c\u6309\u5185\u5bb9\u5bbd\u5ea6\u6392\u5217\uff0c\u592a\u5bbd\u65f6\u5de6\u53f3\u6eda\u52a8\uff0c\u65f6\u95f4\u548c\u5e94\u7528\u4e24\u5217\u56fa\u5b9a\u5728\u5de6\u8fb9\u3002\n- \u8bf7\u6c42\u65e5\u5fd7\u53ef\u4ee5\u9009\u6bcf\u9875 10\u300120 \u6216 50 \u6761\uff0c\u9ed8\u8ba4 20 \u6761\uff0c\u4f1a\u8bb0\u4f4f\u4f60\u7684\u9009\u62e9\u3002\u6ca1\u6709\u6570\u636e\u7684\u683c\u5b50\u663e\u793a\u300c\u2014\u300d\u3002\n\n**OpenCode\u3001OpenClaw \u7684\u300c\u8bbe\u4e3a\u9ed8\u8ba4\u300d\u632a\u8fdb\u66f4\u591a\u83dc\u5355\u3002** \u4ee5\u524d\u5df2\u6dfb\u52a0\u5361\u7247\u4e0a\u7684\u661f\u5f62\u56fe\u6807\u4e0d\u597d\u8ba4\uff0c\u4e5f\u770b\u4e0d\u51fa\u6709\u6ca1\u6709\u9009\u4e2d\u3002\u73b0\u5728\u5728\u5361\u7247\u7684\u66f4\u591a\u83dc\u5355\u91cc\uff0c\u6709\u591a\u4e2a\u6a21\u578b\u7684\u4f9b\u5e94\u5546\u53ef\u4ee5\u4ece\u5b50\u83dc\u5355\u91cc\u9009\u9ed8\u8ba4\u6a21\u578b\u3002OpenCode\u3001OpenClaw\u3001Hermes\u3001Kimi Code \u7684\u9ed8\u8ba4\u4f9b\u5e94\u5546\u6539\u7528\u548c\u300c\u4f7f\u7528\u4e2d\u300d\u4e00\u6837\u7684\u84dd\u8272\u6807\u51fa\u3002\n\n**Pi \u7684\u4f9b\u5e94\u5546\u6807\u8bc6\u59cb\u7ec8\u663e\u793a\u3002** \u7528\u9884\u8bbe\u6dfb\u52a0\u65f6\u4e5f\u4f1a\u663e\u793a\u5e76\u9884\u586b\uff0c\u53ef\u4ee5\u4fee\u6539\uff1b\u548c\u522b\u7684 Pi \u5361\u7247\u91cd\u590d\u65f6\uff0c\u8f93\u5165\u6846\u4e0b\u65b9\u4f1a\u63d0\u793a\uff0c\u4e0d\u80fd\u4fdd\u5b58\u3002\u4ee5\u524d\u8981\u5230\u4fdd\u5b58\u65f6\u624d\u62a5\u9519\u3002\n\n**MCP \u670d\u52a1\u5668\u663e\u793a\u81ea\u5b9a\u4e49\u7684\u663e\u793a\u540d\u79f0**\uff08[#8692](https://github.com/farion1231/cc-switch/pull/8692)\uff09\u3002\u8bbe\u7f6e\u4e86\u663e\u793a\u540d\u79f0\u7684\u670d\u52a1\u5668\uff0c\u5217\u8868\u548c\u5220\u9664\u786e\u8ba4\u6846\u91cc\u90fd\u663e\u793a\u5b83\uff0c\u6807\u8bc6\u5199\u5728\u65c1\u8fb9\u3002\n\n**\u4f1a\u8bdd\u9875\u7684\u9879\u76ee\u5206\u7ec4\u6807\u9898\u6574\u884c\u90fd\u80fd\u70b9\u51fb\u5c55\u5f00\u548c\u6536\u8d77**\uff08[#8709](https://github.com/farion1231/cc-switch/pull/8709)\uff09\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e BuyToken\u3001V-API\u3002\n\n## \u4fee\u590d\n\n- **\u805a\u5408\u6a21\u5f0f\u4e0b\u4ece\u7b2c\u4e09\u65b9 GPT \u5207\u5230 DeepSeek\u3001Kimi \u7b49\u6a21\u578b\u540e\uff0cCodex \u6bcf\u4e00\u8f6e\u90fd\u62a5 `unsupported call: exec`**\uff08[#8676](https://github.com/farion1231/cc-switch/issues/8676)\uff09\u3002\u7b2c\u4e09\u65b9 GPT \u548c\u5176\u4ed6\u6a21\u578b\u8c03\u7528\u547d\u4ee4\u884c\u5de5\u5177\u7684\u65b9\u5f0f\u4e0d\u540c\uff0c\u4ee5\u524d\u5207\u6362\u65f6 Codex \u4e0d\u4f1a\u5148\u538b\u7f29\u5386\u53f2\uff0c\u65b0\u6a21\u578b\u7167\u6284\u4e86\u5386\u53f2\u91cc\u5b83\u4e0d\u652f\u6301\u7684\u8c03\u7528\u3002\u73b0\u5728\u5728\u8fd9\u4e24\u7c7b\u6a21\u578b\u4e4b\u95f4\u5207\u6362\u65f6\uff0cCodex \u4f1a\u5148\u7528\u539f\u6765\u7684\u6a21\u578b\u538b\u7f29\u4e00\u6b21\uff1b\u540c\u4e00\u7c7b\u6a21\u578b\u4e4b\u95f4\u5207\u6362\u7167\u65e7\u4e0d\u538b\u7f29\u3002\n- **\u5728 Linux \u6216 WSL \u4e0a\u4ece\u7ec8\u7aef\u542f\u52a8 CC Switch\uff0c\u6253\u5f00\u300c\u8bbe\u7f6e \u2192 \u5173\u4e8e\u300d\u6574\u4e2a\u5e94\u7528\u5361\u6b7b**\uff08[#3241](https://github.com/farion1231/cc-switch/issues/3241)\uff09\u3002\u67e5\u8be2\u5de5\u5177\u7248\u672c\u7684\u547d\u4ee4\u5360\u4f4f\u4e86\u7ec8\u7aef\uff0c\u88ab\u7cfb\u7edf\u6682\u505c\u3002\u73b0\u5728\u8fd9\u4e2a\u67e5\u8be2\u4e0d\u518d\u5360\u7528\u7ec8\u7aef\uff0c\u6700\u591a\u7b49 10 \u79d2\u3002\n- **\u7ed9 Codex \u9009\u4e86\u83b7\u53d6\u5230\u7684\u6a21\u578b\u540e\uff0c\u56fe\u7247\u8f93\u5165\u88ab\u5173\u6389**\uff08[#8682](https://github.com/farion1231/cc-switch/issues/8682)\uff09\u3002\u67e5\u5230\u7684\u8d44\u6599\u8bf4\u6a21\u578b\u53ea\u652f\u6301\u6587\u5b57\u65f6\uff0c\u4ee5\u524d\u4f1a\u5199\u6210\u300c\u53ea\u652f\u6301\u6587\u5b57\u300d\uff0cCodex \u5c31\u62d2\u7edd\u56fe\u7247\uff0c\u8868\u5355\u91cc\u4e5f\u6ca1\u6709\u529e\u6cd5\u6539\u56de\u6765\u3002\u73b0\u5728\u53ea\u5728\u8d44\u6599\u8bf4\u652f\u6301\u56fe\u7247\u65f6\u624d\u586b\u8fd9\u4e00\u9879\uff0c\u5176\u4ed6\u60c5\u51b5\u4ea4\u7ed9 Codex \u9ed8\u8ba4\u7684\u5224\u65ad\u3002\n- **\u9009\u4e86\u4e2d\u8f6c\u7ad9\u7684\u67d0\u4e9b\u6a21\u578b\u540e\uff0c\u586b\u8fdb\u6765\u7684\u662f\u522b\u5bb6\u7684\u53c2\u6570**\uff08[#8765](https://github.com/farion1231/cc-switch/issues/8765)\uff09\u3002\u4ee5 DeepSeek-V4.1-Flash-1017 \u4e3a\u4f8b\uff0cmodels.dev \u4e0a\u6ca1\u6709 DeepSeek \u81ea\u5df1\u7684\u8fd9\u4e2a\u6761\u76ee\uff0c\u4ee5\u524d\u4f1a\u501f\u7528\u53e6\u4e00\u5bb6\u6258\u7ba1\u7684\u5fae\u8c03\u7248\u672c\uff0c\u586b\u8fdb\u53bb\u7684\u662f\u300c\u53ea\u652f\u6301\u6587\u5b57\u300d\u548c 262K \u7684\u4e0a\u4e0b\u6587\u7a97\u53e3\uff0c\u53ea\u6709\u5b9e\u9645\u7a97\u53e3\u7684\u56db\u5206\u4e4b\u4e00\u3002\u73b0\u5728\u67e5\u4e0d\u5230\u539f\u5382\u6761\u76ee\u65f6\u4e0d\u518d\u501f\u7528\u522b\u5bb6\u6258\u7ba1\u7684\u6761\u76ee\uff0c\u8fd9\u51e0\u9879\u7559\u7a7a\u3002\n- **Claude Code \u7684 VS Code \u6269\u5c55\u7ecf OpenAI Responses \u4e0a\u6e38\u65f6\uff0c\u5de5\u5177\u8c03\u7528\u524d\u663e\u793a `Unsupported content type: redacted_thinking`**\uff08[#8691](https://github.com/farion1231/cc-switch/issues/8691)\uff09\u3002\u53ea\u6709\u52a0\u5bc6\u5185\u5bb9\u7684\u601d\u8003\u4ee5\u524d\u8f6c\u6210\u4e86\u6269\u5c55\u4e0d\u8ba4\u8bc6\u7684\u683c\u5f0f\uff0c\u73b0\u5728\u6539\u6210\u548c Anthropic \u4e00\u6837\u7684\u7a7a\u601d\u8003\u5757\uff1b\u53d1\u56de\u4e0a\u6e38\u7684\u8bf7\u6c42\u4e0d\u53d8\u3002\u53ea\u5728\u6700\u540e\u624d\u7ed9\u51fa\u7684\u601d\u8003\u6458\u8981\u4e5f\u4f1a\u8865\u4e0a\u3002\n- **macOS \u4e0a Claude \u8ba2\u9605\u989d\u5ea6\u67e5\u8be2\u5931\u8d25**\uff08[#8764](https://github.com/farion1231/cc-switch/pull/8764)\u3001[#8762](https://github.com/farion1231/cc-switch/issues/8762)\uff09\u3002\u94a5\u5319\u4e32\u91cc\u6709\u597d\u51e0\u6761\u540c\u540d\u6761\u76ee\u65f6\uff0c\u53ef\u80fd\u8bfb\u5230\u4e00\u6761\u53ea\u5b58\u4e86 MCP \u767b\u5f55\u4fe1\u606f\u7684\u65e7\u6761\u76ee\u3002\u73b0\u5728\u5148\u6309\u5f53\u524d\u7528\u6237\u7684\u8d26\u53f7\u627e\uff0c\u627e\u4e0d\u5230\u53ef\u7528\u7684\u767b\u5f55\u518d\u56de\u5230\u539f\u6765\u7684\u65b9\u5f0f\u3002\n- **macOS \u4e0a Antigravity \u5b98\u65b9\u5361\u7684\u989d\u5ea6\u53ea\u6709 Claude/GPT\uff0c\u6ca1\u6709 Gemini\u3002** Google \u53ea\u628a Gemini \u989d\u5ea6\u8fd4\u56de\u7ed9\u8f83\u65b0\u7248\u672c\u7684 agy\uff0c\u73b0\u5728\u67e5\u8be2\u65f6\u4f1a\u5e26\u4e0a\u672c\u673a agy \u7684\u7248\u672c\u3002\n- **Windows \u4e0a\u5237\u65b0 Antigravity \u989d\u5ea6\u3001\u83b7\u53d6\u6a21\u578b\u5217\u8868\u65f6\u5f39\u51fa\u9ed1\u8272\u547d\u4ee4\u884c\u7a97\u53e3**\uff08[#8700](https://github.com/farion1231/cc-switch/issues/8700)\uff09\u3002\n- **Windows \u4e0a Hermes \u88c5\u5728 WSL \u91cc\u65f6\uff0cWeb UI \u672a\u542f\u52a8\u65f6\u70b9\u300c\u6253\u5f00\u7ec8\u7aef\u5e76\u542f\u52a8\u300d\uff0c\u542f\u52a8\u7684\u662f Windows \u4e0a\u7684 Hermes**\uff08[#8689](https://github.com/farion1231/cc-switch/issues/8689)\uff09\u3002Hermes \u914d\u7f6e\u76ee\u5f55\u6307\u5411 WSL \u8def\u5f84\u65f6\uff0c\u73b0\u5728\u4f1a\u5728\u90a3\u4e2a WSL \u53d1\u884c\u7248\u91cc\u8fd0\u884c `hermes dashboard`\u3002\n- **Codex \u8bf7\u6c42\u5e26 `session-id` \u6216 `thread-id` \u5934\u65f6\uff0c\u8def\u7531\u8ba4\u4e0d\u51fa\u4f1a\u8bdd**\uff08[#8718](https://github.com/farion1231/cc-switch/pull/8718)\uff09\u3002\n- **\u963f\u91cc\u4e91\u767e\u70bc\u3001\u5343\u95ee Token Plan \u7684 Anthropic \u5730\u5740\u83b7\u53d6\u4e0d\u5230\u6a21\u578b\u5217\u8868**\uff08[#8755](https://github.com/farion1231/cc-switch/pull/8755)\uff09\u3002\n- **OpenCode Zen\u3001Go \u7684\u4f9b\u5e94\u5546\u4ece models.dev \u8865\u4e0d\u5168\u6a21\u578b\u53c2\u6570\u3002** models.dev \u6362\u4e86\u8fd9\u4e24\u5bb6\u7684\u5730\u5740\uff0c\u73b0\u5728\u65e7\u5730\u5740\u4e5f\u80fd\u5bf9\u4e0a\uff0c`deepseek-v4.1-flash` \u7b49\u6a21\u578b\u53c8\u80fd\u81ea\u52a8\u586b\u4e0a\u53c2\u6570\u3002\n- **\u53e0\u7740\u6253\u5f00\u597d\u51e0\u4e2a\u5168\u5c4f\u9762\u677f\u65f6\uff0c\u6309\u4e00\u6b21 Esc \u5168\u90e8\u5173\u6389\u3002** \u73b0\u5728\u53ea\u5173\u6700\u4e0a\u9762\u90a3\u4e2a\u3002\n- **\u4e00\u4e2a\u6df1\u94fe\u63a5\u8fd8\u5728\u5bfc\u5165\u65f6\u53c8\u6765\u4e86\u7b2c\u4e8c\u4e2a\uff0c\u7b2c\u4e00\u4e2a\u5bfc\u5165\u5b8c\u6210\u540e\u4f1a\u628a\u7b2c\u4e8c\u4e2a\u7684\u786e\u8ba4\u6846\u5173\u6389**\uff08[#8696](https://github.com/farion1231/cc-switch/issues/8696)\uff09\u3002\n- **\u7528\u91cf\u9875\u7684\u300c\u8fd1 7 \u5929\u300d\u300c\u8fd1 14 \u5929\u300d\u300c\u8fd1 30 \u5929\u300d\u5728\u590f\u4ee4\u65f6\u5207\u6362\u524d\u540e\u591a\u7b97\u6216\u5c11\u7b97\u4e00\u5929**\uff08[#8719](https://github.com/farion1231/cc-switch/issues/8719)\uff09\u3002\n- **\u8bf7\u6c42\u65e5\u5fd7\u505c\u5728\u540e\u51e0\u9875\u65f6\uff0c\u603b\u6570\u53d8\u5c11\u540e\u8868\u683c\u53d8\u7a7a\u3001\u56de\u4e0d\u53bb\u3002** \u73b0\u5728\u4f1a\u9000\u56de\u6700\u540e\u4e00\u9875\u3002\n- **\u300c\u5e94\u7528\u300d\u9875\u6ca1\u5b89\u88c5\u7684\u5de5\u5177\u4e0b\u9762\u591a\u51fa\u4e00\u884c\u82f1\u6587\u7684\u300cnot installed\u300d\u3002**\n- **\u6309\u4e0b\u300c\u9ad8\u7ea7\u9009\u9879\u300d\u65f6\u6587\u