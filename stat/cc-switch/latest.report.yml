:{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5800,"digest":"sha256:a4fbed335e5ca84aadcc7dbfceddcff368426df5246d0edeff05668d53f13b2b","download_count":12486,"created_at":"2026-10-09T14:34:45Z","updated_at":"2026-10-09T14:34:45Z"}],"body":"# CC Switch v4.0.6\n\n### 4.0 \u6b63\u5f0f\u7248\u7684\u7b2c\u4e8c\u4e2a\u4fee\u590d\u7248\u672c\n\n\u4f9b\u5e94\u5546\u9875\u7684\u9875\u5934\u591a\u4e86\u641c\u7d22\u6309\u94ae\uff0c\u8fd8\u80fd\u6309\u8bf7\u6c42\u5730\u5740\u67e5\u627e\u3002Skills \u68c0\u67e5\u5230\u66f4\u65b0\u540e\u53ef\u4ee5\u4e00\u952e\u5168\u90e8\u66f4\u65b0\uff0c\u786e\u8ba4\u524d\u4f1a\u5217\u51fa\u8981\u66f4\u65b0\u7684 Skill\u3002\u989d\u5ea6\u6570\u5b57\u7684\u7eff\u3001\u6a59\u3001\u7ea2\u4e09\u8272\u56de\u6765\u4e86\uff0c\u5269\u4f59\u4e0d\u8db3 20% \u5c31\u4f1a\u53d8\u8272\u63d0\u9192\u3002Codex \u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u4e3b agent \u548c\u5b50 agent \u7528\u4e0d\u540c\u4f9b\u5e94\u5546\u65f6\u5b50 agent \u8bfb\u4e0d\u5230\u4efb\u52a1\uff0c\u73b0\u5728\u53ef\u4ee5\u6253\u5f00\u65b0\u5f00\u5173\u6539\u7528\u7ecf\u5178\u5b50 agent \u5de5\u5177\u3002\u8fd9\u4e2a\u7248\u672c\u8fd8\u4fee\u590d\u4e86 Claude Code \u7ecf\u8def\u7531\u8f6c OpenAI Chat \u683c\u5f0f\u65f6\u6700\u540e\u4e00\u6bb5\u56de\u590d\u4e22\u5931\u3001Codex \u805a\u5408\u6a21\u5f0f\u4e0b\u5b98\u65b9\u6a21\u578b\u6d88\u5931\u3001\u6258\u76d8\u770b\u4e0d\u5230\u706b\u5c71\u7b49 5 \u5c0f\u65f6\u989d\u5ea6\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.6-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.6-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u4f9b\u5e94\u5546\u9875\u52a0\u4e86\u641c\u7d22\u6309\u94ae\u3002** \u4ee5\u524d\u53ea\u80fd\u6309 \u2318F / Ctrl+F \u6253\u5f00\u641c\u7d22\uff0c\u5f88\u591a\u4eba\u4e0d\u77e5\u9053\u6709\u8fd9\u4e2a\u529f\u80fd\u3002\u73b0\u5728\u300c\u6dfb\u52a0\u4f9b\u5e94\u5546\u300d\u65c1\u8fb9\u6709\u641c\u7d22\u6309\u94ae\uff0c\u9664\u4e86\u540d\u79f0\u3001\u5907\u6ce8\u548c\u5b98\u7f51\uff0c\u4e5f\u80fd\u6309\u8bf7\u6c42\u5730\u5740\u67e5\u627e\u3002\u5173\u6389\u641c\u7d22\u6846\u540e\u5217\u8868\u4f1a\u6062\u590d\u5b8c\u6574\uff0c\u4e0d\u4f1a\u518d\u505c\u5728\u7b5b\u9009\u7ed3\u679c\u4e0a\u3002\u4e0d\u9700\u8981\u8fd9\u4e2a\u6309\u94ae\u7684\u8bdd\uff0c\u53ef\u4ee5\u5728\u300c\u8bbe\u7f6e \u2192 \u901a\u7528 \u2192 \u4fa7\u680f\u4e0e\u9875\u5934\u300d\u5173\u6389\u300c\u663e\u793a\u4f9b\u5e94\u5546\u641c\u7d22\u300d\uff0c\u5feb\u6377\u952e\u7167\u6837\u80fd\u7528\u3002\n\n**Skills \u4e00\u952e\u66f4\u65b0\u5168\u90e8\u3002** \u4ee5\u524d\u8981\u5148\u68c0\u67e5\u66f4\u65b0\uff0c\u518d\u628a\u5217\u8868\u7b5b\u5230\u300c\u53ef\u66f4\u65b0\u300d\uff0c\u518d\u5230\u7b5b\u9009\u680f\u91cc\u627e\u300c\u5168\u90e8\u66f4\u65b0\u300d\u3002\u73b0\u5728\u68c0\u67e5\u5230\u66f4\u65b0\u540e\uff0c\u300c\u68c0\u67e5\u66f4\u65b0\u300d\u6309\u94ae\u4f1a\u76f4\u63a5\u53d8\u6210\u300c\u5168\u90e8\u66f4\u65b0\uff08N \u4e2a\uff09\u300d\uff0c\u786e\u8ba4\u6846\u4f1a\u5217\u51fa\u6bcf\u4e2a\u8981\u66f4\u65b0\u7684 Skill \u548c\u5b83\u7684\u6765\u6e90\u4ed3\u5e93\u3002\u786e\u8ba4\u540e\u5bf9\u8bdd\u6846\u9a6c\u4e0a\u5173\u95ed\uff0c\u6309\u94ae\u4e0a\u663e\u793a\u66f4\u65b0\u8fdb\u5ea6\u3002\u91cd\u65b0\u68c0\u67e5\u653e\u5230\u4e86\u300c\u2026\u300d\u83dc\u5355\u91cc\u3002\n\n**\u989d\u5ea6\u6570\u5b57\u7684\u989c\u8272\u56de\u6765\u4e86\u3002** 4.0 \u628a\u989d\u5ea6\u6587\u5b57\u90fd\u6539\u6210\u4e86\u7070\u8272\uff0c\u989d\u5ea6\u5145\u8db3\u8fd8\u662f\u5feb\u7528\u5b8c\u5f88\u96be\u4e00\u773c\u770b\u51fa\u6765\u3002\u73b0\u5728\u6062\u590d 3.x \u7684\u7eff\u3001\u6a59\u3001\u7ea2\u4e09\u8272\uff0c\u53ea\u7ed9\u6570\u5b57\u4e0a\u8272\uff0c\u6863\u4f4d\u540d\u79f0\u548c\u300c\u5269\u4f59\u300d\u4e24\u4e2a\u5b57\u4ecd\u662f\u7070\u8272\u3002\u5269\u4f59\u4e0d\u8db3 20% \u5c31\u4f1a\u53d8\u8272\u63d0\u9192\uff08\u4ee5\u524d\u662f 10%\uff09\uff0c\u6258\u76d8\u91cc\u7684\u300c\u5feb\u7528\u5b8c\u300d\u4e5f\u6309 20% \u7b97\u3002\n\n**Codex \u805a\u5408\u6a21\u5f0f\u53ef\u4ee5\u8ba9\u5b50 agent \u7528\u7ecf\u5178\u5de5\u5177\u3002** Codex \u65b0\u7248\u7684\u5b50 agent \u5de5\u5177\u4f1a\u628a\u4e3b agent \u4ea4\u4ee3\u7684\u4efb\u52a1\u4ea4\u7ed9\u4e3b agent \u6240\u5728\u7684\u670d\u52a1\u5546\u52a0\u5bc6\uff0c\u5b50 agent \u6362\u5230\u53e6\u4e00\u5bb6\u4f9b\u5e94\u5546\u5c31\u89e3\u4e0d\u5f00\uff0c\u53ea\u80fd\u62a5\u9519\u6216\u62ff\u5230\u7a7a\u4efb\u52a1\u3002\u5728\u300c\u8bbe\u7f6e \u2192 \u5e94\u7528\u914d\u7f6e \u2192 Codex\u300d\u6253\u5f00\u300c\u805a\u5408\u6a21\u5f0f\u4e0b\u5b50 agent \u7528\u7ecf\u5178\u5de5\u5177\u300d\u540e\uff0c\u805a\u5408\u91cc\u7684\u6240\u6709\u6a21\u578b\u6539\u7528 Codex \u7ecf\u5178\u7684\u5b50 agent \u5de5\u5177\uff0c\u4efb\u52a1\u4ee5\u660e\u6587\u4f20\u9012\uff1b\u4ee3\u4ef7\u662f\u6ca1\u6709 `followup_task`\u3001`interrupt_agent` \u7b49\u65b0\u7248\u529f\u80fd\u3002\u5f00\u5173\u9ed8\u8ba4\u5173\u95ed\uff0c\u53ea\u5f71\u54cd\u805a\u5408\u6a21\u5f0f\uff0c\u6539\u5b8c\u8981\u91cd\u542f Codex\u3002\u5f00\u5173\u5173\u95ed\u65f6\u9047\u5230\u8fd9\u79cd\u60c5\u51b5\uff0cCC Switch \u4f1a\u76f4\u63a5\u8fd4\u56de\u9519\u8bef\u8bf4\u660e\u539f\u56e0\u5e76\u63d0\u793a\u8fd9\u4e2a\u5f00\u5173\uff0c\u4e0d\u518d\u8ba9\u5b50 agent \u5e26\u7740\u7a7a\u4efb\u52a1\u8fd0\u884c\uff0c\u4e5f\u4e0d\u518d\u8ba9 Codex \u53cd\u590d\u91cd\u8bd5\u3002\n\n**Codex \u5207\u6362\u8d26\u53f7\u540e\u4f1a\u63d0\u793a\u91cd\u542f\u540e\u53f0\u670d\u52a1\u3002** Codex \u7684\u540e\u53f0\u670d\u52a1\u4e0d\u4e00\u5b9a\u4f1a\u91cd\u65b0\u8bfb\u53d6\u767b\u5f55\u4fe1\u606f\uff0c\u5207\u6362\u8d26\u53f7\u540e\u53ef\u80fd\u8fd8\u5728\u7528\u5207\u6362\u524d\u7684\u8d26\u53f7\u3002\u4ee5\u524d\u53ea\u6709\u805a\u5408\u6a21\u5f0f\u4e0b\u6a21\u578b\u5217\u8868\u53d8\u4e86\u624d\u4f1a\u63d0\u793a\u91cd\u542f\uff0c\u73b0\u5728\u76f4\u8fde\u3001\u8def\u7531\u3001\u805a\u5408\u4e09\u79cd\u6a21\u5f0f\u4e0b\u5207\u6362\u4e86\u8d26\u53f7\u90fd\u4f1a\u63d0\u793a\uff0c\u70b9\u6309\u94ae\u786e\u8ba4\u540e\u624d\u4f1a\u91cd\u542f\u540e\u53f0\u670d\u52a1\uff1b\u7528 Codex \u684c\u9762\u7248\u6216\u7f16\u8f91\u5668\u63d2\u4ef6\u65f6\uff0c\u63d0\u793a\u5b8c\u5168\u9000\u51fa\u540e\u91cd\u65b0\u6253\u5f00\u3002\n\n**CC Switch \u6709\u65b0\u7248\u672c\u65f6\uff0c\u4fa7\u680f\u300c\u8bbe\u7f6e\u300d\u4e0a\u7684\u63d0\u793a\u70b9\u6539\u6210\u7eff\u8272**\uff0c\u70b9\u300c\u8bbe\u7f6e\u300d\u4f1a\u76f4\u63a5\u6253\u5f00\u300c\u5173\u4e8e\u300d\u9875\u3002\u300c\u5e94\u7528\u300d\u4e0a\u7684\u5de5\u5177\u66f4\u65b0\u63d0\u793a\u70b9\u4fdd\u6301\u539f\u6837\u3002\n\n## \u4fee\u590d\n\n- **Claude Code \u7ecf\u8def\u7531\u8f6c\u6362\u5230 OpenAI Chat \u683c\u5f0f\u7684\u4f9b\u5e94\u5546\u65f6\uff0c\u6700\u540e\u4e00\u6bb5\u56de\u590d\u6574\u6bb5\u4e22\u5931\u3002** \u6709\u7684\u4e0a\u6e38\u5728\u7ed3\u675f\u65f6\u4e0d\u53d1\u9001\u7ed3\u675f\u539f\u56e0\uff0c\u6216\u8005\u53d1\u5b8c\u7ed3\u675f\u539f\u56e0\u540e\u53c8\u8865\u4e86\u4e00\u6bb5\u5185\u5bb9\uff0c\u8f6c\u6362\u540e\u7684\u6700\u540e\u4e00\u6bb5\u6587\u5b57\u6216\u5de5\u5177\u8c03\u7528\u6ca1\u6709\u6b63\u786e\u7ed3\u675f\uff0cClaude Code \u4f1a\u4e22\u6389\u8fd9\u6bb5\u5185\u5bb9\uff0c\u8fd8\u4f1a\u89e6\u53d1\u91cd\u8bd5\u3002\n- **Codex \u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u5e26\u6709\u7f51\u9875\u641c\u7d22\u8bb0\u5f55\u7684\u4f1a\u8bdd\u538b\u7f29\u4e0a\u4e0b\u6587\u65f6\u62a5 502\u3002** \u538b\u7f29\u65f6 CC Switch \u4f1a\u5220\u6389\u8bf7\u6c42\u91cc\u7684\u5de5\u5177\u5b9a\u4e49\uff0c\u4f46\u5386\u53f2\u8bb0\u5f55\u91cc\u8fd8\u6709\u7f51\u9875\u641c\u7d22\u3001\u51fd\u6570\u8c03\u7528\u8fd9\u4e9b\u5de5\u5177\u8c03\u7528\uff0c\u90e8\u5206\u4e0a\u6e38\u4f1a\u76f4\u63a5\u62d2\u7edd\u8fd9\u6837\u7684\u8bf7\u6c42\u3002\u73b0\u5728\u538b\u7f29\u65f6\u4fdd\u7559\u5de5\u5177\u5b9a\u4e49\uff0c\u5e76\u8981\u6c42\u6a21\u578b\u8fd9\u4e00\u8f6e\u4e0d\u8c03\u7528\u5de5\u5177\u3002\n- **Codex \u805a\u5408\u6a21\u5f0f\u4e0b\uff0c\u5b98\u65b9\u8d26\u53f7\u8bbe\u4e3a\u9ed8\u8ba4\u540e\uff0c`/model` \u91cc\u53ea\u5269\u7b2c\u4e09\u65b9\u6a21\u578b\u3002** CC Switch \u6309 PATH \u91cc `codex` \u547d\u4ee4\u7684\u7248\u672c\u53bb\u62c9\u5b98\u65b9\u6a21\u578b\u5217\u8868\uff0c\u5b98\u65b9\u5bf9 0.140 \u53ca\u66f4\u65e9\u7684\u7248\u672c\u53ea\u8fd4\u56de\u9690\u85cf\u7684\u6a21\u578b\u3002\u53ea\u7528 Codex \u684c\u9762\u7248\u7684\u7528\u6237 PATH \u91cc\u5e38\u5e38\u7559\u7740\u65e7\u7248\u547d\u4ee4\u884c\uff0c\u5b98\u65b9\u6a21\u578b\u5c31\u5168\u88ab\u9690\u85cf\u4e86\u3002\u73b0\u5728\u6309\u672c\u673a\u5b9e\u9645\u5728\u7528\u7684\u6700\u65b0\u7248\u672c\u53bb\u62c9\uff08\u547d\u4ee4\u884c\u3001\u684c\u9762\u7248\u3001\u7f16\u8f91\u5668\u63d2\u4ef6\u90fd\u7b97\uff09\u3002\u5982\u679c\u62c9\u5230\u7684\u5217\u8868\u91cc\u6ca1\u6709\u53ef\u663e\u793a\u7684\u6a21\u578b\uff0c\u4f1a\u6539\u7528 CC Switch \u81ea\u5e26\u7684\u5217\u8868\uff0c\u5e76\u63d0\u793a\u5347\u7ea7 Codex\u3002\n- **Codex \u7528\u8def\u7531\u8f6c Chat \u683c\u5f0f\u7684\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u6216 GitHub Copilot \u65f6\uff0c\u6a21\u578b\u76ee\u5f55\u4f1a\u8ddf\u7740\u5b98\u65b9\u6761\u76ee\u7684\u6539\u52a8\u53d8\u5316\u3002** \u4ee5\u524d CC Switch \u7167\u7740 Codex \u672c\u5730\u7f13\u5b58\u7684\u5b98\u65b9 gpt-5.5 \u6761\u76ee\u751f\u6210\u8fd9\u7c7b\u6a21\u578b\u7684\u76ee\u5f55\uff0c\u5b98\u65b9\u6bcf\u6b21\u6539\u8fd9\u4e2a\u6761\u76ee\uff08\u6bd4\u5982\u8bbe\u4e3a\u9690\u85cf\u3001\u6362\u6210\u65b0\u7684\u5de5\u5177\u5f62\u6001\uff09\u90fd\u4f1a\u5e26\u5230\u7b2c\u4e09\u65b9\u6a21\u578b\u4e0a\uff1b\u7f13\u5b58\u8fd8\u5199\u660e GPT-5.5 \u5c06\u5728 10 \u6708 14 \u65e5\u4e0b\u7ebf\uff0c\u4e0b\u7ebf\u540e\u6bcf\u6b21\u5207\u6362\u90fd\u8981\u989d\u5916\u542f\u52a8\u4e00\u6b21 Codex \u547d\u4ee4\u884c\u3002\u73b0\u5728\u4e00\u5f8b\u4f7f\u7528 CC Switch \u81ea\u5e26\u7684\u6a21\u677f\u3002\n- **\u5220\u9664\u6258\u7ba1\u7684 ChatGPT \u8d26\u53f7\u6216\u5168\u90e8\u767b\u51fa\u540e\uff0c\u7ed1\u5b9a\u8fd9\u4e2a\u8d26\u53f7\u7684 Codex \u4f9b\u5e94\u5546\u65e0\u6cd5\u5207\u6362\u3002** \u8fd9\u4e9b\u4f9b\u5e94\u5546\u8fd8\u6307\u7740\u5df2\u5220\u9664\u7684\u8d26\u53f7\u3002\u73b0\u5728\u5220\u9664\u6216\u767b\u51fa\u65f6\u4f1a\u4e00\u8d77\u89e3\u9664\u7ed1\u5b9a\uff0c\u4f9b\u5e94\u5546\u6539\u4e3a\u8ddf\u968f Codex \u81ea\u5df1\u7684\u767b\u5f55\u3002\u4f9b\u5e94\u5546\u4f1a\u968f\u4e91\u540c\u6b65\uff0c\u6240\u4ee5\u53ea\u89e3\u9664\u672c\u673a\u8d26\u53f7\u7684\u7ed1\u5b9a\uff0c\u5176\u4ed6\u8bbe\u5907\u4e0a\u7684\u8d26\u53f7\u7ed1\u5b9a\u4e0d\u53d7\u5f71\u54cd\u3002\n- **\u7528 npm \u5b89\u88c5\u7684 Claude Code\uff0c\u5728 macOS\u3001Linux \u4e0a\u901a\u8fc7\u300c\u5e94\u7528\u300d\u9875\u5347\u7ea7\u540e\u65e0\u6cd5\u8fd0\u884c\u3002** \u4e0a\u4e00\u7248\u4fee\u597d\u4e86 npm 12 \u4e0b\u7684\u5b89\u88c5\uff0c\u4f46\u5347\u7ea7\u65f6\u8c03\u7528\u7684 `claude update` \u4ecd\u4f1a\u88ab npm 12 \u62e6\u4e0b\u5b89\u88c5\u811a\u672c\uff0c\u540c\u65f6\u63d0\u793a\u5347\u7ea7\u6210\u529f\u3002\u73b0\u5728\u5347\u7ea7\u65f6\u4e5f\u5141\u8bb8\u5b89\u88c5\u811a\u672c\u8fd0\u884c\u3002Windows \u548c WSL \u7684\u5347\u7ea7\u8def\u5f84\u8fd9\u6b21\u6ca1\u6709\u6539\u3002\n- **Skills \u5bfc\u5165\u5bf9\u8bdd\u6846\u5173\u4e0d\u6389\u3002** \u6253\u5f00\u8fc7\u300c\u53d1\u73b0\u300d\u9875\u7684\u8bdd\uff0c\u5bfc\u5165\u65f6\u8981\u7b49\u300c\u53d1\u73b0\u300d\u5217\u8868\u4ece GitHub \u5168\u90e8\u91cd\u65b0\u4e0b\u8f7d\u5b8c\uff0c\u7f51\u7edc\u6162\u65f6\u5bf9\u8bdd\u6846\u4f1a\u4e00\u76f4\u5361\u4f4f\uff0c\u65e0\u6cd5\u53d6\u6d88\u6216\u5173\u95ed\u3002\n- **\u6258\u76d8\u91cc\u706b\u5c71\u3001\u667a\u8c31\u3001MiniMax \u7b49\u6709\u4e09\u6863\u989d\u5ea6\u7684\u4f9b\u5e94\u5546\uff0c\u770b\u4e0d\u5230 5 \u5c0f\u65f6\u989d\u5ea6\u3002** \u6258\u76d8\u53ea\u663e\u793a\u5269\u4f59\u6700\u5c11\u7684\u4e24\u6863\uff0c5 \u5c0f\u65f6\u989d\u5ea6\u91cd\u7f6e\u6700\u52e4\u3001\u901a\u5e38\u5269\u5f97\u6700\u591a\uff0c\u51e0\u4e4e\u603b\u88ab\u7701\u6389\u3002\u73b0\u5728\u548c 3.x \u4e00\u6837\u663e\u793a\u5168\u90e8\u6863\u4f4d\u3002\n- **\u6d45\u8272\u6a21\u5f0f\u4e0b\uff0c\u300c\u5e94\u7528\u300d\u9875\u300c\u663e\u793a\u300d\u5217\u7684\u5f00\u5173\u5206\u4e0d\u6e05\u5f00\u548c\u5173\u3002** \u6253\u5f00\u65f6\u662f\u6df1\u7070\u3001\u5173\u95ed\u65f6\u662f\u4e2d\u7070\uff0c\u73b0\u5728\u6539\u7528\u548c\u5176\u4ed6\u5f00\u5173\u4e00\u6837\u7684\u989c\u8272\u3002\n\n**\u5176\u4ed6\uff1a**\n- \u65b0\u589e\u4e2d\u6587\u7248\u805a\u5408\u6a21\u5f0f\u6307\u5357\uff0c\u7528\u6237\u624b\u518c\u8865\u5145\u4e86\u83b7\u53d6\u6a21\u578b\u5217\u8868\u3001models.dev \u8865\u5168\u53c2\u6570\u548c\u624b\u52a8\u586b\u5199\u7684\u533a\u522b\u3002\n- \u4e09\u8bed\u7528\u6237\u624b\u518c\u66f4\u65b0\u4e86 Linux \u5e94\u7528\u7ea7\u7a97\u53e3\u6309\u94ae\u7684\u8bbe\u7f6e\u8def\u5f84\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n**Codex \u7ecf\u8def\u7531\u4f7f\u7528 Chat \u683c\u5f0f\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u6216 GitHub Copilot \u7684\u4f1a\u8bdd**\uff0c\u5347\u7ea7\u540e\u7ee7\u7eed\u4e4b\u524d\u7684\u4f1a\u8bdd\u65f6\u4f1a\u81ea\u52a8\u538b\u7f29\u4e00\u6b21\u4e0a\u4e0b\u6587\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @SailingLoong\uff08Claude Code \u7ecf\u8def\u7531\u65f6\u6700\u540e\u4e00\u6bb5\u56de\u590d\u4e22\u5931\uff09\u3001@ggbdpq\uff08\u805a\u5408\u6a21\u5f0f\u538b\u7f29\u4e0a\u4e0b\u6587\u62a5 502\uff09\u3001@Komikawayi\uff08Codex \u5207\u6362\u8d26\u53f7\u540e\u7684\u91cd\u542f\u63d0\u793a\uff09\u3001@CacinieP\uff08npm 12 \u4e0b\u5347\u7ea7 Claude Code\uff09\u3001@SaladDay\uff08\u62a5\u544a\u5e76\u6700\u65e9\u4fee\u590d\u5220\u9664\u8d26\u53f