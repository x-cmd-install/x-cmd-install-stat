6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":3534,"digest":"sha256:0c57cc32bff3cb055c4c18884d2723415af1bf96169979c4cace64b2baa5d636","download_count":12482,"created_at":"2026-09-22T14:42:44Z","updated_at":"2026-09-22T14:42:44Z"}],"body":"# CC Switch v3.20.4\r\n\r\n> \u8fd9\u4e00\u7248\u4ee5\u4fee\u590d\u4e3a\u4e3b\uff0c\u53e6\u6709\u4e00\u9879\u65b0\u63a5\u5165\uff1a**MiniMax Code \u6210\u4e3a\u7b2c\u5341\u4e2a\u53d7\u7ba1\u5e94\u7528**\uff0c\u4f9b\u5e94\u5546\u3001MCP\u3001Skills\u3001\u63d0\u793a\u8bcd\u3001\u4f1a\u8bdd\u6d4f\u89c8\u4e0e\u7528\u91cf\u7edf\u8ba1\u4e00\u5e76\u63a5\u5165\uff0c\u9ed8\u8ba4\u6a21\u578b\u3001\u767b\u5f55\u548c\u4f1a\u8bdd\u5220\u9664\u4ecd\u7531 MiniMax Code \u81ea\u5df1\u7ba1\u3002\u4fee\u590d\u4e3b\u8981\u96c6\u4e2d\u5728\u7ecf\u672c\u5730\u4ee3\u7406\u4f7f\u7528 Codex \u7684\u573a\u666f\uff0c\u56db\u4e2a\u4f1a\u8ba9 Codex \u7528\u4e0d\u4e0b\u53bb\u7684\u95ee\u9898\u5728\u672c\u7248\u5173\u95ed\uff1aCodex 0.154 \u8d77\u653e\u8fdb `additional_tools` \u7684\u5de5\u5177\u8ba9\u4e25\u683c\u7684 Chat \u7f51\u5173\u76f4\u63a5 400\uff1b\u4e00\u5f20 `detail: \"original\"` \u7684\u622a\u56fe\u8ba9\u6574\u6bb5\u4f1a\u8bdd\u6b64\u540e\u6bcf\u8f6e\u90fd 400\uff1b\u7f16\u8f91\u6216\u5207\u8d70\u90e8\u5206 Codex \u4f9b\u5e94\u5546\u4f1a\u6084\u6084\u6e05\u7a7a\u5df2\u4fdd\u5b58\u7684 API Key\uff1b\u7ed1\u5b9a\u5230\u5df2\u5220\u9664 ChatGPT \u8d26\u53f7\u7684\u5361\u7247\u65e2\u5207\u4e0d\u8d70\uff0c\u4e5f\u6539\u4e0d\u4e86\u7ed1\u5b9a\u3002Claude Code \u8fd9\u8fb9\uff0cGitHub Copilot \u4e0b\u7684 auto mode \u6062\u590d\u53ef\u7528\uff0c`/effort` \u7684 `xhigh`\u3001`max` \u4e0e Grok 4.6 \u7684\u63a8\u7406\u5f3a\u5ea6\u90fd\u6309\u6240\u9009\u6863\u4f4d\u53d1\u9001\u3002Claude Desktop \u7684\u7b2c\u4e09\u65b9\u914d\u7f6e\u73b0\u5728\u4e5f\u652f\u6301 Linux\u3002**\u672c\u7248\u542b\u6570\u636e\u5e93\u8fc1\u79fb\uff08v18 \u2192 v19\uff09\uff0c\u5efa\u8bae\u5347\u7ea7\u524d\u624b\u52a8\u5907\u4efd\u4e00\u6b21\u6570\u636e\u5e93**\uff0c\u89c1[\u5347\u7ea7\u63d0\u9192](#\u672c\u7248\u542b\u6570\u636e\u5e93\u8fc1\u79fb)\u3002\r\n\r\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/release-notes/v3.20.4-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/release-notes/v3.20.4-ja.md)**\r\n\r\n---\r\n\r\n## \u91cd\u70b9\u5185\u5bb9\uff1a\u4f60\u73b0\u5728\u53ef\u4ee5\r\n\r\n- **\u7528 CC Switch \u7ba1\u7406 MiniMax Code**\uff08[#7383](https://github.com/farion1231/cc-switch/pull/7383)\u3001[#7578](https://github.com/farion1231/cc-switch/pull/7578)\uff09\uff1a\u7b2c\u5341\u4e2a\u53d7\u7ba1\u5e94\u7528\u3002\u4f9b\u5e94\u5546\u5199\u8fdb `~/.minimax/config.yaml`\uff0c\u4e0e MiniMax Code \u81ea\u5df1\u7684\u8bbe\u7f6e\u5171\u5b58\uff0c\u591a\u4e2a\u4f9b\u5e94\u5546\u53ef\u4ee5\u540c\u65f6\u5b58\u5728\uff1bMCP \u4e0e `~/.minimax/mcp.json` \u53cc\u5411\u540c\u6b65\uff1bSkills \u4e0e `AGENTS.md` \u63d0\u793a\u8bcd\u5e93\u4e00\u5e76\u63a5\u5165\uff1b\u9884\u8bbe\u6765\u81ea Pi \u7684\u9884\u8bbe\u76ee\u5f55\uff0c\u5171 41 \u4e2a\u3002\u9ed8\u8ba4\u6a21\u578b\u3001\u767b\u5f55\u4e0e\u4f1a\u8bdd\u5220\u9664**\u4ecd\u7531 MiniMax Code \u81ea\u5df1\u7ba1**\uff0cCC Switch \u4e0d\u78b0\u3002\r\n- **\u5728\u770b\u677f\u91cc\u770b\u5230 MiniMax Code \u7684\u4f1a\u8bdd\u4e0e\u7528\u91cf**\uff1a\u53ea\u8bfb\u6d4f\u89c8\u4f1a\u8bdd\u3001\u590d\u5236 resume \u547d\u4ee4\uff1b\u7528\u91cf\u4ee5\u72ec\u7acb\u7684\u300cMiniMax Code (Session)\u300d\u6765\u6e90\u589e\u91cf\u5bfc\u5165\uff0c\u9996\u6b21\u540c\u6b65\u4f1a\u8865\u9f50\u5386\u53f2\u3002\r\n- **\u5728 Linux \u4e0a\u7ed9 Claude Desktop \u5207\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546**\uff08[#7331](https://github.com/farion1231/cc-switch/pull/7331)\uff0c\u4fee\u590d [#4855](https://github.com/farion1231/cc-switch/issues/4855)\uff09\uff1a\u914d\u7f6e\u8def\u5f84\u4e0e macOS\u3001Windows \u4e00\u81f4\uff0cFlatpak \u7248\u4e5f\u80fd\u7528\u3002\r\n- **Codex 0.154 \u53ca\u4ee5\u540e\u7248\u672c\u7ecf Chat \u7f51\u5173\u4e0d\u518d 400**\uff08[#7454](https://github.com/farion1231/cc-switch/pull/7454)\uff0c\u4fee\u590d [#7451](https://github.com/farion1231/cc-switch/issues/7451)\u3001[#6158](https://github.com/farion1231/cc-switch/issues/6158)\uff09\uff1a`additional_tools` \u91cc\u7684\u5de5\u5177\u6b63\u786e\u5e76\u5165\u8bf7\u6c42\uff0c\u4e0d\u518d\u53d8\u6210\u4e00\u6761 `content: null` \u7684 system \u6d88\u606f\u3002\r\n- **\u4e00\u5f20\u622a\u56fe\u4e0d\u518d\u6bc1\u6389\u6574\u6bb5 Codex \u4f1a\u8bdd**\uff08[#7476](https://github.com/farion1231/cc-switch/pull/7476)\uff0c\u4fee\u590d [#6495](https://github.com/farion1231/cc-switch/issues/6495)\u3001[#7458](https://github.com/farion1231/cc-switch/issues/7458)\uff09\uff1a\u5df2\u7ecf\u574f\u6389\u7684\u4f1a\u8bdd\u5347\u7ea7\u540e\u76f4\u63a5\u6062\u590d\uff0c\u4e0d\u7528\u624b\u52a8\u6539\u5386\u53f2\u3002\r\n- **\u7f16\u8f91\u6216\u5207\u8d70 Codex \u4f9b\u5e94\u5546\u4e0d\u518d\u6e05\u7a7a\u5df2\u4fdd\u5b58\u7684 API Key**\uff08[#7434](https://github.com/farion1231/cc-switch/pull/7434)\uff0c\u4fee\u590d [#7433](https://github.com/farion1231/cc-switch/issues/7433)\uff09\u3002\r\n- **\u5220\u6389 ChatGPT \u8d26\u53f7\u540e\uff0c\u7ed1\u7740\u5b83\u7684 Codex \u5361\u7247\u80fd\u91cd\u65b0\u7ed1\u5b9a\u6216\u5207\u8d70**\uff08[#7395](https://github.com/farion1231/cc-switch/pull/7395)\uff0c\u4fee\u590d [#7392](https://github.com/farion1231/cc-switch/issues/7392)\uff09\u3002\r\n- **\u5728 GitHub Copilot \u4e0b\u7528 Claude Code \u7684 auto mode**\uff08[#5404](https://github.com/farion1231/cc-switch/pull/5404)\uff0c\u4fee\u590d [#5175](https://github.com/farion1231/cc-switch/issues/5175)\uff09\u3002\r\n- **`/effort` \u9009\u54ea\u6863\u5c31\u53d1\u54ea\u6863**\uff08[#7318](https://github.com/farion1231/cc-switch/pull/7318)\u3001[#7531](https://github.com/farion1231/cc-switch/pull/7531)\uff0c\u4fee\u590d [#7314](https://github.com/farion1231/cc-switch/issues/7314)\u3001[#5367](https://github.com/farion1231/cc-switch/issues/5367)\uff09\uff1a`xhigh` \u4e0d\u518d\u88ab\u4e22\uff0c\u6620\u5c04\u5230 Grok 4.6 \u7684\u6a21\u578b\u91cd\u65b0\u5e26\u4e0a\u63a8\u7406\u5f3a\u5ea6\uff0cGPT-5.6 \u4e0e GPT-6 Astra \u7684 `max` \u4e0d\u518d\u964d\u6210 `xhigh`\u3002\r\n- **\u6ca1\u5199\u63cf\u8ff0\u7684\u5de5\u5177\u4e0d\u518d\u8ba9\u6574\u8f6e\u8bf7\u6c42 400**\uff08[#7319](https://github.com/farion1231/cc-switch/pull/7319)\u3001[#7378](https://github.com/farion1231/cc-switch/pull/7378)\uff0c\u4fee\u590d [#7303](https://github.com/farion1231/cc-switch/issues/7303)\uff09\u3002\r\n- **\u5728\u8bf7\u6c42\u65e5\u5fd7\u91cc\u770b\u5230\u6bcf\u79d2\u8f93\u51fa token \u6570**\uff08[#3369](https://github.com/farion1231/cc-switch/pull/3369)\uff0c\u4fee\u590d [#5936](https://github.com/farion1231/cc-switch/issues/5936)\uff09\u3002\r\n- **\u5728 OpenCode \u4f9b\u5e94\u5546\u8868\u5355\u91cc\u641c\u7d22\u5e76\u6279\u91cf\u6dfb\u52a0\u6a21\u578b**\uff08[#7515](https://github.com/farion1231/cc-switch/pull/7515)\uff0c\u4fee\u590d [#7423](https://github.com/farion1231/cc-switch/issues/7423)\uff09\u3002\r\n\r\n---\r\n\r\n## \u4f7f\u7528\u653b\u7565\r\n\r\n- **[Claude Desktop](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/user-manual/zh/2-providers/2.6-claude-desktop.md)**\uff1a\u672c\u7248\u65b0\u589e\u7684 Linux \u914d\u7f6e\u8def\u5f84\u3001Flatpak \u7684\u8fb9\u754c\uff0c\u4ee5\u53ca\u66f4\u65b0\u540e\u7684\u652f\u6301\u8303\u56f4\u8868\u3002\r\n- **[\u6dfb\u52a0\u4f9b\u5e94\u5546](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/user-manual/zh/2-providers/2.1-add.md)**\uff1aCodex \u539f\u751f Responses \u76f4\u8fde\u4e0e Chat \u8def\u7531\u8f6c\u6362\u7684\u533a\u522b\uff08\u300c\u4ec5 Chat\u300d\u793a\u4f8b\u6539\u4e3a\u70b9\u540d\u767e\u5ea6\u5343\u5e06 Coding Plan \u4e0e\u9636\u8dc3 Step Plan\uff09\uff0c\u4ee5\u53ca\u300c\u9690\u85cf AI \u7f72\u540d\u300d\u5f00\u5173\u73b0\u5728\u5199\u5165\u7684\u4e09\u4e2a\u5b57\u6bb5\u3002\r\n\r\n---\r\n\r\n> [!WARNING]\r\n>\r\n> ## \u552f\u4e00\u5b98\u65b9\u6e20\u9053\u58f0\u660e\uff08\u8bf7\u52a1\u5fc5\u9605\u8bfb\uff09\r\n>\r\n> CC Switch \u662f**\u5b8c\u5168\u514d\u8d39\u3001\u5f00\u6e90**\u7684\u684c\u9762\u5e94\u7528\uff0c**\u4e0d\u4f1a\u5411\u7528\u6237\u6536\u53d6\u4efb\u4f55\u8d39\u7528**\u3002\u8bf7\u4ec5\u901a\u8fc7\u4e0b\u5217\u5b98\u65b9\u6e20\u9053\u83b7\u53d6\u672c\u8f6f\u4ef6\uff1a\r\n>\r\n> | \u7c7b\u522b     | \u552f\u4e00\u5b98\u65b9                                                                       |\r\n> | -------- | ------------------------------------------------------------------------------ |\r\n> | \u5b98\u7f51     | **[ccswitch.io](https://ccswitch.io)**                                         |\r\n> | \u6e90\u7801     | **[github.com/farion1231/cc-switch](https://github.com/farion1231/cc-switch)** |\r\n> | \u4e0b\u8f7d     | **[GitHub Releases](https://github.com/farion1231/cc-switch/releases)**        |\r\n> | \u4f5c\u8005     | **[@farion1231](https://github.com/farion1231)**                               |\r\n> | \u4e3e\u62a5\u5c71\u5be8 | **[GitHub Issues](https://github.com/farion1231/cc-switch/issues)**            |\r\n>\r\n> **\u4efb\u4f55\u5411\u4f60\u6536\u8d39\u3001\u8981\u6c42\u5145\u503c\u3001\u6216\u7d22\u53d6\u767b\u5f55\u51ed\u636e\u7684\"CC Switch\"\u7f51\u7ad9\u6216\u5ba2\u6237\u7aef\u5747\u4e3a\u5047\u5192**\u3002\u5982\u679c\u4f60\u88ab\u8bf1\u5bfc\u652f\u4ed8\u4e86\u8d39\u7528\uff0c\u8bf7\u7acb\u5373\u505c\u6b62\u64cd\u4f5c\u5e76\u901a\u8fc7 GitHub Issues \u53cd\u9988\u3002\r\n\r\n---\r\n\r\n## \u6982\u89c8\r\n\r\nMiniMax Code \u662f MiniMax \u7684\u7f16\u7a0b\u667a\u80fd\u4f53\uff0c\u7ec8\u7aef\u7248 `mcode` \u4e0e\u684c\u9762\u7248\u5171\u7528 `~/.minimax` \u6570\u636e\u76ee\u5f55\u3002CC Switch \u4ee5\u7d2f\u52a0\u6a21\u5f0f\u7ba1\u7406\u5b83\uff0c\u4e0e OpenCode\u3001Hermes\u3001Pi \u76f8\u540c\uff1a\u6bcf\u4e2a\u4f9b\u5e94\u5546\u662f `~/.minimax/config.yaml` \u4e2d `custom_provider` \u4e0b\u7684\u4e00\u9879\uff0c\u591a\u4e2a\u4f9b\u5e94\u5546\u5171\u5b58\uff0c\u5199\u5165\u65f6\u4fdd\u7559 MiniMax Code \u81ea\u5df1\u7684\u5176\u4ed6\u8bbe\u7f6e\uff0c\u5e76\u9075\u5b88\u5b83\u7684\u914d\u7f6e\u6587\u4ef6\u9501\u3002MCP \u4e0e `~/.minimax/mcp.json` \u53cc\u5411\u540c\u6b65\uff0cSkills \u90e8\u7f72\u5230 `~/.minimax/skills/`\uff0c\u63d0\u793a\u8bcd\u5e93\u5199\u5165 `~/.minimax/AGENTS.md`\uff1b\u4f1a\u8bdd\u6d4f\u89c8\u662f\u53ea\u8bfb\u7684\uff0c\u7528\u91cf\u4ece MiniMax Code \u81ea\u5df1\u7684\u6570\u636e\u5e93\u589e\u91cf\u5bfc\u5165\u3002\u63a5\u5165\u8303\u56f4\u523b\u610f\u6536\u5f97\u5f88\u7d27\uff1a\u9ed8\u8ba4\u6a21\u578b\u3001\u767b\u5f55\u3001\u4e91\u7aef\u529f\u80fd\u4e0e\u4f1a\u8bdd\u5220\u9664\u90fd\u7559\u7ed9 MiniMax Code\uff0c\u672c\u5730\u4ee3\u7406\u63a5\u7ba1\u3001\u6545\u969c\u8f6c\u79fb\u3001\u6258\u76d8\u3001\u901a\u7528\u914d\u7f6e\u7247\u6bb5\u4e0e Profiles \u4e5f\u4e0d\u8986\u76d6\u5b83\u3002\uff08[#7383](https://github.com/farion1231/cc-switch/pull/7383)\u3001[#7578](https://github.com/farion1231/cc-switch/pull/7578)\uff09\r\n\r\n\u4fee\u590d\u91cc\u5206\u91cf\u6700\u91cd\u7684\u662f\u7ecf\u672c\u5730\u4ee3\u7406\u4f7f\u7528 Codex \u7684\u4e00\u7ec4\u3002Codex 0.154 \u8d77\u628a\u63d2\u4ef6\u3001\u6267\u884c\u547d\u540d\u7a7a\u95f4\u7b49\u989d\u5916\u5de5\u5177\u653e\u8fdb\u4e00\u4e2a `additional_tools` \u8f93\u5165\u9879\uff0c\u8f6c\u6362\u5668\u628a\u5b83\u5f53\u6210\u6d88\u606f\uff0c\u751f\u6210\u4e00\u6761 `content: null` \u7684 system \u6d88\u606f\uff0c\u4e25\u683c\u7684 Chat \u7f51\u5173\u76f4\u63a5 400\uff0c\u91cc\u9762\u7684\u5de5\u5177\u4e5f\u88ab\u4e22\u6389\uff08[#7454](https://github.com/farion1231/cc-switch/pull/7454)\uff09\u3002Codex \u7ed9\u622a\u56fe\u6807 `detail: \"original\"`\uff0c\u8fd9\u4e2a\u503c\u53ea\u5728 Responses API \u91cc\u5408\u6cd5\uff0c\u88ab\u539f\u6837\u642c\u8fdb Chat \u8bf7\u6c42\u540e\uff0c\u65b9\u821f/\u8c46\u5305\u3001\u65e5\u65e5\u65b0\u3001GLM\u3001vLLM \u4e00\u7c7b\u7f51\u5173\u5bf9\u6574\u6761\u8bf7\u6c42\u8fd4\u56de 400\uff1bCodex \u6bcf\u8f6e\u90fd\u4f1a\u91cd\u653e\u5b8c\u6574\u5386\u53f2\uff0c\u4e00\u5f20\u56fe\u5c31\u8ba9\u8fd9\u4e2a\u4f1a\u8bdd\u4ece\u6b64\u6bcf\u8f6e\u5931\u8d25\uff08[#7476](https://github.com/farion1231/cc-switch/pull/7476)\uff09\u3002\u53e6\u5916\u4e24\u4e2a\u662f\u8d26\u53f7\u6570\u636e\u95ee\u9898\uff1a\u81ea\u5e26\u51ed\u636e\u6765\u6e90\u7684 Codex \u4f9b\u5e94\u5546\u5728\u7f16\u8f91\u4fdd\u5b58\u6216\u5207\u8d70\u65f6\uff0c\u5df2\u4fdd\u5b58\u7684 API Key \u88ab live \u91cc\u7684\u7a7a auth \u8986\u76d6\uff08[#7434](https://github.com/farion1231/cc-switch/pull/7434)\uff09\uff1b\u5728\u8ba4\u8bc1\u4e2d\u5fc3\u5220\u6389\u5e76\u91cd\u65b0\u767b\u5f55 ChatGPT \u8d26\u53f7\u540e\uff0c\u7ed1\u7740\u65e7\u8d26\u53f7\u7684\u5361\u7247\u6bcf\u6b21\u5207\u6362\u3001\u63a5\u7ba1\u548c\u542f\u52a8\u6062\u590d\u90fd\u62a5\u300c\u8d26\u53f7\u4e0d\u5b58\u5728\u300d\uff08[#7395](https://github.com/farion1231/cc-switch/pull/7395)\uff09\u3002\r\n\r\nClaude Code \u7ecf\u8f6c\u6362\u7684\u8bf7\u6c42\u4e5f\u6709\u51e0\u5904\u4fee\u6b63\uff1a\u6ca1\u5199\u63cf\u8ff0\u7684\u5de5\u5177\u4e0d\u518d\u4ee5 `\"description\": null` \u53d1\u51fa\uff08[#7319](https://github.com/farion1231/cc-switch/pull/7319)\u3001[#7378](https://github.com/farion1231/cc-switch/pull/7378)\uff09\uff1bGitHub Copilot \u4e0b auto mode \u7684\u5206\u7c7b\u5668\u4e0d\u518d\u56e0 `stop` \u53c2\u6570 400\uff08[#5404](https://github.com/farion1231/cc-switch/pull/5404)\uff09\uff1b`/effort xhigh` \u4e0d\u518d\u88ab\u4e22\uff0c\u6620\u5c04\u5230 Grok 4.6 \u7684\u6a21\u578b\u91cd\u65b0\u5e26\u4e0a\u63a8\u7406\u5f3a\u5ea6\uff0cGPT-5.6 \u4e0e GPT-6 Astra \u7684 `max` \u4e0d\u518d\u964d\u6210 `xhigh`\uff08[#7318](https://github.com/farion1231/cc-switch/pull/7318)\u3001[#7531](https://github.com/farion1231/cc-switch/pull/7531)\uff09\u3002\u5176\u4f59\u4fee\u590d\u8986\u76d6 Skills \u5b89\u88c5\uff08skills.sh \u7684 id \u4e0e\u76ee\u5f55\u540d\u4e0d\u4e00\u81f4\u3001\u8d85\u8fc7 1 \u4e07\u4e2a\u6587\u4ef6\u7684\u4ed3\u5e93\uff0c[#6381](https://github.com/farion1231/cc-switch/pull/6381)\u3001[#7489](https://github.com/farion1231/cc-switch/pull/7489)\uff09\u3001\u63d0\u793a\u8bcd\u8bfb\u56de\u5916\u90e8\u4fee\u6539\uff08[#7194](https://github.com/farion1231/cc-switch/pull/7194)\uff09\u3001WSL \u4e0a\u7684 OMO \u7edf\u4e00\u914d\u7f6e\uff08[#7550](https://github.com/farion1231/cc-switch/pull/7550)\uff09\u3001\u5173\u4e8e\u9875\u7684\u7248\u672c\u63a2\u6d4b\uff08[#7346](https://github.com/farion1231/cc-switch/pull/7346)\u3001[#7348](https://github.com/farion1231/cc-switch/pull/7348)\uff09\u4e0e Windows \u4efb\u52a1\u680f\uff08[#6348](https://github.com/farion1231/cc-switch/pull/6348)\uff09\u3002\u65b0\u529f\u80fd\u65b9\u9762\uff0cClaude Desktop \u7b2c\u4e09\u65b9\u914d\u7f6e\u652f\u6301 Linux\uff08[#7331](https://github.com/farion1231/cc-switch/pull/7331)\uff09\uff0c\u8bf7\u6c42\u65e5\u5fd7\u663e\u793a\u6bcf\u79d2\u8f93\u51fa token \u6570\uff08[#3369](https://github.com/farion1231/cc-switch/pull/3369)\uff09\uff0cOpenCode \u4f9b\u5e94\u5546\u8868\u5355\u53ef\u4ee5\u641c\u7d22\u5e76\u6279\u91cf\u6dfb\u52a0\u83b7\u53d6\u5230\u7684\u6a21\u578b\uff08[#7515](https://github.com/farion1231/cc-switch/pull/7515)\uff09\u3002\r\n\r\n\u9884\u8bbe\u505a\u4e86\u4e00\u8f6e\u7ef4\u62a4\uff1a\u56fd\u5185 Codex \u9884\u8bbe\u6309\u5404\u5bb6 Responses \u6587\u6863\u5bf9\u9f50\uff08Kimi For Coding \u5347\u5230 K2.8 Preview\u30011M \u7a97\u53e3\uff0cDeepSeek \u9ed8\u8ba4 `deepseek-flash`\uff09\uff0cMiniMax \u56fd\u5185\u7ad9\u4e0e\u767e\u7075\u8fc1\u5230\u5f53\u524d\u5b98\u65b9\u57df\u540d\uff0cAICodeWith \u7684 Codex \u65cf\u7aef\u70b9\u6539\u6b63\u4e3a `/v1`\uff0c\u53e6\u65b0\u589e\u51e0\u4e2a\u9884\u8bbe\u3002DeepSeek \u5728 2026-09-12 \u64a4\u56de\u4e86 V4 Pro \u6539\u6309 V4.1 Flash \u8ba1\u4ef7\u7684\u516c\u544a\uff0cv3.20.3 \u63d0\u524d\u6267\u884c\u7684\u8c03\u4ef7\u5728\u672c\u7248\u6539\u56de\u9ad8\u5cf0\u6863\u3002\u672c\u7248\u542b\u6570\u636e\u5e93\u8fc1\u79fb\uff1a`SCHEMA_VERSION` 18 \u2192 19\uff0c\u4e3a MCP \u4e0e Skills \u8868\u52a0\u4e0a MiniMax Code \u7684\u542f\u7528\u5217\u3002\r\n\r\n**\u53d1\u5e03\u65e5\u671f**\uff1a2026-09-22\r\n\r\n**\u66f4\u65b0\u89c4\u6a21**\uff1a46 commits | 156 files changed | +8,673 / -684 lines\r\n\r\n---\r\n\r\n## \u65b0\u529f\u80fd\r\n\r\n### MiniMax Code \u6210\u4e3a\u7b2c\u5341\u4e2a\u53d7\u7ba1\u5e94\u7528\r\n\r\nMiniMax Code\uff08`app_type` \u4e3a `mcode`\uff09\u7684\u7ec8\u7aef\u7248\u4e0e\u684c\u9762\u7248\u5171\u7528\u4e00\u4e2a\u6570\u636e\u76ee\u5f55\uff0c\u9ed8\u8ba4\u662f `~/.minimax`\uff0c\u53ef\u4ee5\u7528 `MINIMAX_DATA_DIR`\uff08\u6216\u65e7\u7684 `MAVIS_DATA_DIR`\uff09\u6539\u5230\u522b\u5904\u3002\uff08[#7383](https://github.com/farion1231/cc-switch/pull/7383)\u3001[#7578](https://github.com/farion1231/cc-switch/pull/7578)\uff09\r\n\r\n- **\u4f9b\u5e94\u5546**\uff1a\u7d2f\u52a0\u6a21\u5f0f\uff0c\u4e0e OpenCode\u3001Hermes\u3001Pi \u76f8\u540c\u3002\u6bcf\u4e2a\u4f9b\u5e94\u5546\u662f `~/.minimax/config.yaml` \u4e2d `custom_provider` \u4e0b\u7684\u4e00\u9879\uff0c\u5361\u7247\u7b97\u4e0d\u7b97\u300c\u5df2\u6dfb\u52a0\u300d\u53ea\u770b\u6587\u4ef6\u91cc\u6709\u6ca1\u6709\u5b83\u7684\u952e\u3002\u8868\u5355\u6cbf\u7528 OpenCode \u98ce\u683c\u7684\u7ed3\u6784\u5316\u7f16\u8f91\u5668\uff0c\u53e6\u6709 JSON \u7f16\u8f91\u5668\uff0c\u652f\u6301 `anthropic-messages`\u3001`openai-completions`\u3001`openai-responses` \u4e09\u79cd API \u683c\u5f0f\uff1b\u9884\u8bbe\u4ece Pi \u7684\u9884\u8bbe\u76ee\u5f55\u6d3e\u751f\uff0c\u53d1\u7248\u65f6\u5171 41 \u4e2a\u3002\u5728 MiniMax Code \u91cc\u65b0\u5efa\u7684\u81ea\u5b9a\u4e49\u4f9b\u5e94\u5546\u4f1a\u5728\u5217\u8868\u52a0\u8f7d\u65f6\u5bfc\u5165\uff0c\u5728\u90a3\u8fb9\u505a\u7684\u4fee\u6539\u4e5f\u4f1a\u540c\u6b65\u56de\u6765\uff1b\u8d26\u53f7\u7c7b\u4f9b\u5e94\u5546\uff08`kind` \u4e0d\u662f `custom` \u7684\uff09\u65e2\u4e0d\u5bfc\u5165\u4e5f\u4e0d\u8986\u76d6\u3002\u5199\u5165\u65f6\u4fdd\u7559 `config.yaml` \u91cc\u5176\u4ed6\u6240\u6709\u952e\uff0c\u9075\u5b88 MiniMax Code \u81ea\u5df1\u7684 `config.yaml.lock` \u76ee\u5f55\u9501\uff08\u8d85\u8fc7 10 \u79d2\u7684\u9501\u4f1a\u88ab\u56de\u6536\uff0c\u5426\u5219\u4fdd\u5b58\u5931\u8d25\u5e76\u63d0\u793a\u91cd\u8bd5\uff09\uff0c\u539f\u751f\u6587\u4ef6\u5199\u5165\u5931\u8d25\u65f6\u6570\u636e\u5e93\u6539\u52a8\u56de\u6eda\u3002\u5728 `config.yaml` \u91cc\u5220\u6389\u67d0\u4e2a\u4f9b\u5e94\u5546\u540e\uff0c\u5b83\u7684\u5361\u7247\u4f1a\u7acb\u5373\u5237\u65b0\u4e3a\u672a\u6dfb\u52a0\uff0c\u53ef\u4ee5\u518d\u6b21\u6dfb\u52a0\uff08[#7578](https://github.com/farion1231/cc-switch/pull/7578)\uff09\u3002\r\n- **\u9ed8\u8ba4\u6a21\u578b\u5f52 MiniMax Code \u7ba1**\uff1aCC Switch \u4ece\u4e0d\u5199 `defaultModel` / `defaultLightModel`\u3002\u67d0\u4e2a\u4f9b\u5e94\u5546\u6216\u6a21\u578b\u6b63\u88ab\u8fd9\u4e24\u9879\u5f15\u7528\u65f6\uff0cCC Switch \u62d2\u7edd\u5220\u9664\u6216\u505c\u7528\u5b83\uff0c\u9700\u8981\u5148\u5728 MiniMax Code \u91cc\u6362\u4e00\u4e2a\u9ed8\u8ba4\u6a21\u578b\u3002\r\n- **MCP**\uff1a\u4e0e `~/.minimax/mcp.json` \u53cc\u5411\u540c\u6b65\u3002\u7f16\u8f91\u53ea\u66ff\u6362\u4f20\u8f93\u5b57\u6bb5\uff08`command`\u3001`args`\u3001`env`\u3001`url`\u3001`headers`\u3001`type`\uff09\uff0c`timeout` \u8fd9\u7c7b\u539f\u751f\u9009\u9879\u4f1a\u4fdd\u7559\uff1b\u540c id \u4f46\u4f20\u8f93\u65b9\u5f0f\u4e0d\u540c\u7684\u670d\u52a1\u5668\u4f1a\u8df3\u8fc7\u5e76\u63d0\u793a\uff0c\u4e0d\u4f1a\u8986\u76d6\uff1b\u5168\u91cf\u91cd\u65b0\u540c\u6b65\u4e0d\u4f1a\u5220\u9664\u5f00\u5173\u5173\u95ed\u7684\u6761\u76ee\uff0c\u53ea\u6709\u663e\u5f0f\u505c\u7528\u6216\u5220\u9664\u624d\u4f1a\u79fb\u9664\u3002\u6570\u636e\u5e93\u63d0\u4ea4\u5931\u8d25\u65f6\u539f\u751f\u6587\u4ef6\u4f1a\u8fd8\u539f\u3002\r\n- **Skills \u4e0e\u63d0\u793a\u8bcd**\uff1aSkills \u90e8\u7f72\u5230 `~/.minimax/skills/`\uff0c\u6cbf\u7528 Pi \u7684\u5f52\u5c5e\u68c0\u67e5\uff0c\u540c\u540d\u4f46\u4e0d\u662f CC Switch \u90e8\u7f72\u7684 Skill \u4e00\u5f8b\u4e0d\u52a8\u3002\u63d0\u793a\u8bcd\u5e93\u628a\u542f\u7528\u7684\u63d0\u793a\u8bcd\u5199\u8fdb `~/.minimax/AGENTS.md`\uff1a\u5207\u6362\u524d\u5148\u628a\u6587\u4ef6\u91cc\u7684\u5916\u90e8\u4fee\u6539\u5199\u56de\u5f53\u524d\u63d0\u793a\u8bcd\uff1b\u8fd8\u6ca1\u6709\u542f\u7528\u4efb\u4f55 MiniMax Code \u63d0\u793a\u8bcd\u65f6\uff0c\u6587\u4ef6\u91cc\u5bf9\u4e0d\u4e0a\u7684\u5185\u5bb9\u5148\u5b58\u6210\u4e00\u6761\u5907\u4efd\u63d0\u793a\u8bcd\u3002\u505c\u7528\u6700\u540e\u4e00\u4e2a\u63d0\u793a\u8bcd\u65f6\u6e05\u7a7a\u6587\u4ef6\uff1b\u5355\u4e2a\u63d0\u793a\u8bcd\u4e0a\u9650 32 KiB\uff08\u6309 UTF-8 \u5b57\u8282\u8ba1\uff09\u3002\r\n- **Deep link**\uff1aMCP deep link \u7684 `apps` \u652f\u6301 `mcode`\uff1bMiniMax Code \u7684\u4f9b\u5e94\u5546 deep link \u4f1a\u88ab\u62d2\u7edd\u3002\r\n- **\u4e0d\u5728\u672c\u7248\u8303\u56f4\u5185**\uff1aMiniMax Code \u7684\u539f\u751f\u767b\u5f55\u4e0e\u4e91\u7aef\u529f\u80fd\u3001\u672c\u5730\u4ee3\u7406\u63a5\u7ba1\u4e0e\u6545\u969c\u8f6c\u79fb\u3001\u6258\u76d8\u5165\u53e3\u3001\u901a\u7528\u914d\u7f6e\u7247\u6bb5\u3001\u7edf\u4e00\u4f9b\u5e94\u5546\u3001Profiles\uff08MiniMax Code \u9875\u9762\u9690\u85cf Profile \u5207\u6362\u5668\uff09\u3001\u5355\u5361\u4f9b\u5e94\u5546\u68c0\u6d4b\u3001\u8bbe\u7f6e\u91cc\u7684\u76ee\u5f55\u8986\u76d6\uff0c\u4ee5\u53ca\u5728\u300c\u8bbe\u7f6e \u2192 \u5173\u4e8e\u300d\u91cc\u5b89\u88c5\u6216\u5347\u7ea7\u3002\r\n\r\n### MiniMax Code \u7684\u4f1a\u8bdd\u4e0e\u7528\u91cf\u8fdb\u5165\u770b\u677f\r\n\r\n\u4f1a\u8bdd\u6d4f\u89c8\u5668\u4ee5\u53ea\u8bfb\u65b9\u5f0f\u6253\u5f00 `~/.minimax/v2/sqlite/runtime-state.sqlite`\uff0c\u5217\u51fa MiniMax Code \u7684\u5bf9\u8bdd\uff08\u9690\u85cf\u3001\u5f52\u6863\u3001\u5b50\u4f1a\u8bdd\u4ee5\u53ca peek/channel/cron \u4f1a\u8bdd\u4e0d\u5217\uff09\uff0c\u6bcf\u4e2a\u4f1a\u8bdd\u63d0\u4f9b resume \u547d\u4ee4 `env MINIMAX_DATA_DIR=<dir> mcode --session <id>`\uff08Windows \u4e0a\u662f PowerShell \u5199\u6cd5\uff09\u3002\u4f1a\u8bdd\u4e0e MiniMax Code \u7684\u8fd0\u884c\u72b6\u6001\u7ed1\u5b9a\uff0c\u6240\u4ee5\u754c\u9762\u4e0a\u4e0d\u80fd\u5220\u9664\uff0c\u540e\u7aef\u4e5f\u4f1a\u62d2\u7edd\u3002\r\n\r\n\u7528\u91cf\u4ece\u540c\u4e00\u4e2a\u6570\u636e\u5e93\u7684 `local_runtime_token_usage` \u8868\u589e\u91cf\u5bfc\u5165\uff0c\u6765\u6e90\u4e3a\u300cMiniMax Code (Session)\u300d\uff0c\u770b\u677f\u6709\u72ec\u7acb\u7684\u5e94\u7528\u7b5b\u9009\u3002\u63a8\u7406 token \u8ba1\u5165\u8f93\u51fa\uff1b\u6a21\u578b id \u53d6\u7b2c\u4e00\u4e2a `/` \u4e4b\u540e\u7684\u90e8\u5206\uff08`custom_provider:router/vendor/model` \u8bb0\u4e3a `vendor/model`\uff09\u3002MiniMax Code \u81ea\u5df1\u7b97\u51fa\u7684 `cost_usd` \u662f\u6709\u9650\u7684\u975e\u8d1f\u6570\u65f6\u76f4\u63a5\u91c7\u7528\uff0c\u7f3a\u5931\u3001\u4e3a\u8d1f\u6216\u975e\u6709\u9650\u503c\u65f6\u6539\u6309 CC Switch \u7684\u5b9a\u4ef7\u8868\u8ba1\u7b97\uff1b\u539f\u751f\u8d39\u7528\u6070\u597d\u4e3a $0 \u7684\u884c\u6309 $0 \u5165\u5e93\uff0c\u4f46\u548c\u5176\u4ed6\u6709 token \u7684 $0 \u884c\u4e00\u6837\uff0c\u4e00\u65e6\u8be5\u6a21\u578b\u5728\u5b9a\u4ef7\u8868\u91cc\u6709\u4e86\u4ef7\u683c\uff0c\u5c31\u4f1a\u88ab\u5171\u4eab\u7684\u8d39\u7528\u56de\u586b\u91cd\u65b0\u8ba1\u4ef7\u3002\u4e0e Pi \u4e00\u6837\uff0c\u542b MiniMax Code \u7684\u5408\u8ba1\u5e26\u300c\u7f13\u5b58\u5199\u5165\u6570\u636e\u4e0d\u5b8c\u6574\u300d\u7684\u63d0\u793a\u3002\uff08[#7383](https://github.com/farion1231/cc-switch/pull/7383)\uff09\r\n\r\n### Claude Desktop \u7b2c\u4e09\u65b9\u914d\u7f6e\u652f\u6301 Linux\r\n\r\n\u6b64\u524d\u5728 Linux \u4e0a\u5199 Claude Desktop \u7b2c\u4e09\u65b9\u914d\u7f6e\u4f1a\u76f4\u63a5\u62a5\u5e73\u53f0\u4e0d\u652f\u6301\u3002\u73b0\u5728 Linux \u4e0e macOS\u3001Windows \u4f7f\u7528\u540c\u4e00\u5957\u6587\u4ef6\u5e03\u5c40\uff1a\u914d\u7f6e\u6839\u76ee\u5f55\u662f `$XDG_CONFIG_HOME`\uff08\u5fc5\u987b\u662f\u7edd\u5bf9\u8def\u5f84\uff09\uff0c\u6ca1\u6709\u8bbe\u7f6e\u65f6\u662f `~/.config`\uff0cCC Switch \u5728\u5176\u4e0b\u7ef4\u62a4 `Claude/` \u4e0e `Claude-3p/` \u4e24\u4e2a\u76ee\u5f55\u91cc\u7684\u914d\u7f6e\u6587\u4ef6\u3002CC Switch \u4ee5 Flatpak \u8fd0\u884c\u65f6\uff08\u901a\u8fc7 `/.flatpak-info` \u8bc6\u522b\uff09\u603b\u662f\u5199\u5bbf\u4e3b\u673a\u7684 `~/.config`\uff0c\u4e0d\u5199\u6c99\u76d2\u79c1\u6709\u7684 `XDG_CONFIG_HOME`\uff1b\u5982\u679c\u4f60\u7684 Claude Desktop \u7528\u7684\u662f\u81ea\u5b9a\u4e49 XDG \u76ee\u5f55\uff0c\u8bf7\u6539\u7528\u539f\u751f\u5b89\u88c5\u5305\u3002\u81ea\u5e26\u7684 Flatpak \u6e05\u5355\u5df2\u7ecf\u6388\u4e88\u5bb6\u76ee\u5f55\u8bbf\u95ee\u6743\u9650\u3002macOS \u4e0e Windows \u7684\u8def\u5f84\u4e0d\u53d8\uff1b\u624b\u518c\uff08\u4e2d/\u82f1/\u65e5\uff09\u8865\u4e0a\u4e86 Linux \u8def\u5f84\u4e0e\u652f\u6301\u8303\u56f4\u8868\u3002\uff08[#7331](https://github.com/farion1231/cc-switch/pull/7331)\uff0c\u4fee\u590d [#4855](https://github.com/farion1231/cc-switch/issues/4855)\uff09\r\n\r\n### \u8bf7\u6c42\u65e5\u5fd7\u663e\u793a\u6bcf\u79d2\u8f93\u51fa token \u6570\r\n\r\n\u8bf7\u6c42\u65e5\u5fd7\u8868\u7684\u8f93\u51fa token \u65c1\u663e\u793a\u751f\u6210\u901f\u7387\uff08\u5982 `1,234/56 tps`\uff09\uff0c\u8bf7\u6c42\u8be6\u60c5\u9762\u677f\u5728\u8f93\u51fa token \u540e\u7528\u62ec\u53f7\u663e\u793a\u3002\u6d41\u5f0f\u8bf7\u6c42\u8bb0\u5f55\u4e86\u9996 token \u65f6\u95f4\u65f6\uff0c\u901f\u7387 = \u8f93\u51fa token \u00f7\uff08\u603b\u5ef6\u8fdf \u2212 \u9996 token \u65f6\u95f4\uff09\uff0c\u53ea\u7b97\u9996 token \u4e4b\u540e\u7684\u751f\u6210\uff1b\u975e\u6d41\u5f0f\u8bf7\u6c42\u7528\u5b8c\u6574\u5ef6\u8fdf\uff0c\u6240\u4ee5\u5305\u542b\u4e86\u9996 token \u7684\u7b49\u5f85\u65f6\u95f4\u3002\u901f\u7387\u4e0d\u5c0f\u4e8e 1 \u65f6\u53d6\u6574\uff0c\u5c0f\u4e8e 1 \u65f6\u4fdd\u7559\u4e00\u4f4d\u5c0f\u6570\u3002\u6ca1\u6709\u8f93\u51fa token \u6216\u6ca1\u6709\u6709\u6548\u65f6\u95f4\u7a97\u7684\u884c\u4e0d\u663e\u793a\uff0c\u5305\u62ec\u4ece Claude Code\u3001Codex\u3001Gemini \u4f1a\u8bdd\u65e5\u5fd7\u5bfc\u5165\u7684\u884c\uff0c\u5b83\u4eec\u6ca1\u6709\u5ef6\u8fdf\u6570\u636e\u3002\u901f\u7387\u5728\u663e\u793a\u65f6\u7528\u5df2\u5b58\u5b57\u6bb5\u8ba1\u7b97\uff0c\u4e0d\u6d89\u53ca schema \u6216\u65e5\u5fd7\u6539\u52a8\u3002\uff08[#3369](https://github.com/farion1231/cc-switch/pull/3369)\uff0c\u4fee\u590d [#5936](https://github.com/farion1231/cc-switch/issues/5936)\uff09\r\n\r\n### OpenCode \u4f9b\u5e94\u5546\u8868\u5355\uff1a\u641c\u7d22\u5e76\u6279\u91cf\u6dfb\u52a0\u6a21\u578b\r\n\r\n\u70b9\u300c\u83b7\u53d6\u6a21\u578b\u5217\u8868\u300d\u540e\uff0c\u8868\u5355\u4e0a\u65b9\u4f1a\u51fa\u73b0\u4e00\u4e2a\u53ef\u641c\u7d22\u7684\u591a\u9009\u5217\u8868\uff1a\u6309\u6a21\u578b ID \u6216\u6240\u6709\u8005\u8fc7\u6ee4\uff0c\u52fe\u9009\u60f3\u8981\u7684\u6a21\u578b\uff08\u6362\u641c\u7d22\u8bcd\u65f6\u52fe\u9009\u4f1a\u4fdd\u7559\uff09\uff0c\u518d\u70b9\u300c\u6dfb\u52a0\u6240\u9009\u6a21\u578b\uff08N\uff09\u300d\u4e00\u6b21\u52a0\u5165\uff0c\u6a21\u578b ID \u540c\u65f6\u4f5c\u4e3a\u914d\u7f6e\u952e\u548c\u521d\u59cb\u663e\u793a\u540d\u3002\u5df2\u914d\u7f6e\u7684\u6a21\u578b\u663e\u793a\u4e3a\u52fe\u9009\u3001\u4e0d\u53ef\u9009\u5e76\u6807\u6ce8\u300c\u5df2\u6dfb\u52a0\u300d\uff0c\u5df2\u6709\u6761\u76ee\u7684\u540d\u79f0\u3001\u9650\u5236\u4e0e\u9009\u9879\u4fdd\u6301\u4e0d\u53d8\u3002\u4fee\u6539 Base URL \u6216 API Key \u4f1a\u6e05\u7a7a\u5019\u9009\u5217\u8868\uff0c\u5e76\u4e22\u5f03\u4e0a\u4e00\u4e2a\u7aef\u70b9\u8fdf\u5230\u7684\u54cd\u5e94\uff1b\u5728\u641c\u7d22\u6846\u91cc\u6309\u56de\u8f66\u4e0d\u4f1a\u63d0\u4ea4\u8868\u5355\u3002\u6bcf\u4e00\u884c\u539f\u6709\u7684\u4e0b\u62c9\u9009\u62e9\u4fdd\u7559\uff1b\u590d\u7528 OpenCode \u5b57\u6bb5\u7684 MiniMax Code \u4f9b\u5e94\u5546\u8868\u5355\u4e5f\u6709\u540c\u6837\u7684\u9009\u62e9\u5668\u3002\uff08[#7515](https://github.com/farion1231/cc-switch/pull/7515)\uff0c\u4fee\u590d [#7423](https://github.com/farion1231/cc-switch/issues/7423)\uff09\r\n\r\n### \u65b0\u589e\u9884\u8bbe\r\n\r\nKimi Global \u4e0e Kimi For Coding Global\uff08[#7526](https://github.com/farion1231/cc-switch/pull/7526)\uff09\u3001FluxA Token Plan \u4e0e Soshow \u52a0\u5165 Claude Code\u3001Claude Desktop\u3001Codex\u3001Hermes\u3001OpenClaw\u3001OpenCode \u4e0e Pi \u4e03\u4e2a\u5e94\u7528\uff0c\u5176\u4e2d\u4e24\u6761 Kimi Global \u9884\u8bbe\u5bf9\u5e94 Kimi \u56fd\u9645\u7ad9\uff08kimi.ai\uff09\u3002Codex \u53e6\u65b0\u589e StepFun API\uff08\u56fd\u5185\u4e0e\u56fd\u9645\uff09\u3001\u767e\u5ea6\u5343\u5e06\uff08\u6309\u91cf\u4ed8\u8d39\uff09\u4e0e\u8baf\u98de Astron Coding Plan \u7684\u539f\u751f Responses \u9884\u8bbe\u3002\u5b58\u91cf\u4f9b\u5e94\u5546\u4e0d\u53d7\u5f71\u54cd\u3002\r\n\r\n### \u5176\u4ed6\u65b0\u589e\r\n\r\n- **\u4e94\u4e2a\u6a21\u578b\u8865\u4e0a\u5b9a\u4ef7**\uff1a`grok-4.7`\u3001`glm-5.3-flashx`\u3001`hy4-preview`\uff08\u6df7\u5143 Hy4 Preview\uff09\u3001`qwen3.8-2.4t-a95b` \u4e0e `qwen3.8-27b` \u6b64\u524d\u6ca1\u6709\u5b9a\u4ef7\u884c\uff0c\u8bf7\u6c42\u4e00\u5f8b\u6309 $0 \u5165\u8d26\u3002\u5347\u7ea7\u540e\u542f\u52a8\u65f6\u7684\u56de\u586b\u4f1a\u7ed9\u8fd9\u4e9b id \u4e0b\u5386\u53f2\u7684 $0 \u8bf7\u6c42\u8865\u4e0a\u8d39\u7528\u3002Grok 4.7 \u6309 20 \u4e07 token \u4ee5\u4e0b\u7684\u57fa\u7840\u6863\u8ba1\u4ef7\u3002\r\n- **\u5173\u4e8e\u5361\u7247\u7684 Star \u63d0\u793a**\uff1a\u300c\u8bbe\u7f6e \u2192 \u5173\u4e8e\u300d\u5361\u7247\u5728\u6807\u9898\u548c\u6309\u94ae\u4e4b\u95f4\u52a0\u4e86\u4e00\u884c GitHub Star \u63d0\u793a\uff0c\u70b9\u51fb\u6253\u5f00\u4ed3\u5e93\uff1bGitHub \u6309\u94ae\u79fb\u5230\u6309\u94ae\u884c\u6700\u524d\u9762\u3002\r\n\r\n---\r\n\r\n## \u53d8\u66f4\r\n\r\n### \u56fd\u5185 Codex \u9884\u8bbe\u6309\u5404\u5bb6 Responses \u6587\u6863\u5bf9\u9f50\r\n\r\n- **Kimi For Coding**\uff1a`kimi-for-coding` \u73b0\u5728\u7531 K2.8 Preview \u63d0\u4f9b\u670d\u52a1\uff0c\u76ee\u5f55\u884c\u6539\u540d\u4e3a\u300cKimi For Coding (K2.8 Preview)\u300d\uff0c\u4e0a\u4e0b\u6587\u7a97\u53e3\u4ece 262144 \u5347\u5230 1048576\uff0c\u58f0\u660e\u6587\u672c+\u56fe\u7247\u8f93\u5165\uff0c\u63a8\u7406\u6863\u4f4d\u4ece\u53ea\u6709 `high` \u6269\u4e3a `low` / `high` / `max`\uff08\u9ed8\u8ba4 `high`\uff09\u3002`kimi-for-coding-highspeed` \u4ecd\u662f 262144\u3001\u53ea\u6709 `high`\u3002\r\n- **DeepSeek**\uff1a\u9884\u8bbe\u9ed8\u8ba4\u6539\u7528 `deepseek-flash`\uff08V4.1 Flash\uff0c\u6587\u672c+\u56fe\u7247\uff09\uff0c\u4e0d\u518d\u7528\u65e7\u522b\u540d `deepseek-v4-flash`\uff1b`deepseek-v4-pro` \u884c\u58f0\u660e\u4e3a\u7eaf\u6587\u672c\uff0c\u4e24\u884c\u90fd\u4e0e\u5185\u7f6e\u7684 DeepSeek \u5b98\u65b9\u76ee\u5f55\u4e00\u81f4\u3002\u8fd8\u5728\u7528 `deepseek-v4-flash` \u7684\u5361\u7247\u7167\u5e38\u53ef\u7528\uff0c\u5382\u5546\u4f1a\u628a\u8fd9\u4e2a\u522b\u540d\u8def\u7531\u5230 `deepseek-flash`\u3002\r\n- **\u817e\u8baf\u6df7\u5143**\uff1a\u65b0\u589e `hy4-preview`\uff0896 \u4e07\u8f93\u5165\u3001\u7eaf\u6587\u672c\uff09\uff0c\u9ed8\u8ba4\u6a21\u578b\u4ecd\u662f `hy3`\u3002\r\n- **\u5343\u95eeAI\u5e73\u53f0\u4e0e QwenCloud \u6309\u91cf\u4ed8\u8d39**\uff1a\u65b0\u589e\u5f00\u6e90\u6743\u91cd\u7684 `qwen3.8-2.4t-a95b`\uff08\u7eaf\u6587\u672c\uff09\u4e0e `qwen3.8-27b`\uff08\u6587\u672c+\u56fe\u7247\uff09\u3002\r\n- **\u6ca1\u6709\u9884\u8bbe\u66f4\u6362\u534f\u8bae**\uff1a\u817e\u8baf Token Plan \u4f01\u4e1a\u7248\u7684\u56db\u6761\u9884\u8bbe\u4ecd\u8d70 Chat\uff0c\u56e0\u4e3a TokenHub \u6807\u660e Kimi K2.7 Code \u4e0d\u652f\u6301 Responses\uff0cDeepSeek V4 \u4e0e GLM-5.2 \u5728\u90a3\u91cc\u4e5f\u53ea\u662f\u670d\u52a1\u7aef\u8f6c\u6362\u6210 Chat\u3002\r\n\r\n### MiniMax \u56fd\u5185\u7ad9\u4e0e\u767e\u7075\u8fc1\u5230\u5f53\u524d\u5b98\u65b9\u57df\u540d\r\n\r\nMiniMax \u56fd\u5185\u9884\u8bbe\u5728\u4e03\u4e2a\u5e94\u7528\u91cc\u4ece `api.minimaxi.com` \u6539\u5230 `api.minimax.cn`\uff08Claude Code \u4e0e Claude Desktop \u7528 `/anthropic`\uff0cCodex\u3001Hermes\u3001OpenClaw\u3001OpenCode\u3001Pi \u7528 `/v1`\uff09\uff0c\u5b98\u7f51\u4e0e\u5bc6\u94a5\u94fe\u63a5\u6539\u5230 `platform.minimax.cn`\u3002Coding Plan \u7528\u91cf\u68c0\u6d4b\u540c\u65f6\u8ba4\u65b0\u65e7\u4e24\u4e2a\u57df\u540d\uff0c\u5e76\u6539\u4e3a\u6309\u4e3b\u673a\u540d\u9010\u6bb5\u5339\u914d\uff0c`api.minimax.cn.example.com` \u8fd9\u7c7b\u4eff\u5192\u4e3b\u673a\u4e0d\u518d\u8bef\u89e6\u53d1\u3002\u5728 Codex \u91cc\uff0c`minimax.cn` \u4e0e\u65e7\u57df\u540d\u4e00\u6837\u6309\u539f\u751f Responses \u5904\u7406\u3001\u4e00\u6837\u5173\u95ed `web_search`\u3002\r\n\r\n\u767e\u7075\u5728\u540c\u6837\u4e03\u4e2a\u5e94\u7528\u91cc\u4ece `api.tbox.cn` \u8fc1\u5230 `api.ant-ling.com`\u3002\u4ecd\u505c\u5728 `Ling-2.5-1T`\uff08\u5382\u5546\u6587\u6863\u5df2\u4e0d\u518d\u5217\u51fa\uff09\u7684\u516d\u4e2a\u5e94\u7528\u6539\u4e3a\u9ed8\u8ba4 `Ling-2.6-1T`\uff0c\u4e0e Codex \u4e00\u81f4\uff1b`Ling-2.6-1T` \u540c\u65f6\u767b\u8bb0\u4e3a\u7eaf\u6587\u672c\u6a21\u578b\uff0c\u89c1\u5347\u7ea7\u63d0\u9192\u3002\r\n\r\n### StepFun\u3001\u767e\u5ea6\u5343\u5e06\u4e0e\u8baf\u98de Astron \u7684 Responses \u7aef\u70b9\u5173\u95ed Codex \u7684 `web_search`\r\n\r\nCodex \u9ed8\u8ba4\u4f1a\u5e26\u4e0a\u6258\u7ba1\u7684 `web_search` \u5de5\u5177\uff0c\u4f46 StepFun \u7684 Responses API \u53ea\u63a5\u53d7 `function` \u5de5\u5177\uff0c\u5343\u5e06\u6309\u91cf\u4ed8\u8d39\u4e0e Astron \u7684 Responses \u6587\u6863\u91cc\u4e5f\u6ca1\u6709\u6258\u7ba1\u5de5\u5177\u3002`stepfun.com`\u3001`stepfun.ai`\u3001`qianfan.baidubce.com` \u4e0e `xf-yun.com` \u4e0a\u7684\u539f\u751f Responses \u5361\u7247\u73b0\u5728\u4f1a\u5728 `~/.codex/config.toml` \u5199\u5165 `web_search = \"disabled\"`\uff08\u5343\u5e06\u4e0e Astron \u662f\u9884\u9632\u6027\u5904\u7406\uff0c\u5c1a\u672a\u786e\u8ba4\u4f1a\u62d2\u6536\uff09\u3002\u8fd9\u4e9b\u57df\u540d\u4e0a\u4e5f\u6709 Chat \u4ea7\u54c1\uff08StepFun Step Plan\u3001\u5343\u5e06 Coding Plan / Token Plan\u3001Astron Chat\uff09\uff0c\u6240\u4ee5\u4e0d\u4f1a\u628a\u6574\u4e2a\u57df\u540d\u5f53\u6210\u539f\u751f Responses\uff0cChat \u5361\u7247\u7684 `web_search` \u8bbe\u7f6e\u4e0d\u53d7\u5f71\u54cd\u3002\r\n\r\n### \u5176\u4ed6\u9884\u8bbe\u7ef4\u62a4\r\n\r\n- SudoCode.chat \u7684 Claude Code\u3001Claude Desktop\u3001Codex \u4e0e Grok Build \u9884\u8bbe\u65b0\u589e\u5907\u7528\u7aef\u70b9 `api.sudorelay.com`\uff0c\u4f1a\u51fa\u73b0\u5728\u7aef\u70b9\u6d4b\u901f\u91cc\uff1b\u9ed8\u8ba4\u5730\u5740\u4ecd\u662f `api.sudocode.chat`\u3002\r\n- APIKEY.FUN \u5728\u4e5d\u4e2a\u5e94\u7528\u91cc\u7684\u5b98\u7f51\u3001\u6ce8\u518c\u94fe\u63a5\u4e0e Base URL \u4ece `apikey.fun` \u8fc1\u5230 `apikey.fan`\uff1bClaude Code\u3001Claude Desktop\u3001Codex\u3001Gemini \u4e0e Grok Build \u4fdd\u7559\u65e7\u5730\u5740\u4f5c\u4e3a\u5907\u7528\u7aef\u70b9\u3002\r\n\r\n---\r\n\r\n## \u4fee\u590d\r\n\r\n### Codex 0.154 \u8d77\u5e26 `additional_tools` \u7684\u8bf7\u6c42\u4e0d\u518d\u88ab Chat \u7f51\u5173 400\r\n\r\nCodex 0.154 \u8d77\u628a\u8bf7\u6c42\u7684\u989d\u5916\u5de5\u5177\uff08`functions` / `collaboration` \u6267\u884c\u547d\u540d\u7a7a\u95f4\u3001\u63d2\u4ef6\uff09\u653e\u5728\u4e00\u4e2a `additional_tools` \u8f93\u5165\u9879\u91cc\uff1a`{\"type\":\"additional_tools\",\"role\":\"developer\",\"tools\":[\u2026]}`\uff0c\u6709 `role` \u4f46\u6ca1\u6709 `content`\u3002Codex \u7684 Responses\u2192Chat \u8f6c\u6362\u5668\u628a\u6240\u6709\u5e26 `role` \u7684\u9879\u5f53\u6210\u6d88\u606f\uff0c\u5728 `messages[1]` \u751f\u6210 `{\"role\":\"system\",\"content\":null}`\uff0c\u4e25\u683c\u7684 Chat \u7f51\u5173\u62a5 `messages[1]: missing field \"content\"` \u540e\u62d2\u7edd\u6574\u6761\u8bf7\u6c42\uff1b\u8fd9\u4e9b\u5de5\u5177\u5728 Chat \u4e0e Anthropic \u4e24\u6761\u8f6c\u6362\u8def\u5f84\u4e0a\u4e5f\u90fd\u88ab\u6084\u6084\u4e22\u6389\u3002\u73b0\u5728\u6d88\u606f\u904d\u5386\u4f1a\u8df3\u8fc7\u8fd9\u4e2a\u8f7d\u4f53\uff0c\u5176\u4e2d\u7684\u5de5\u5177\u4e0e\u9876\u5c42 `tools` \u53bb\u91cd\u5408\u5e76\uff08\u540c\u540d\u4ee5\u9876\u5c42\u58f0\u660e\u4e3a\u51c6\uff09\uff0c\u547d\u540d\u7a7a\u95f4\u5c55\u5f00\uff08`functions` \u4e0b\u7684 `exec_command` \u53d8\u6210 `functions__exec_command`\uff09\uff0c\u54cd\u5e94\u4fa7\u518d\u628a\u540d\u5b57\u8fd8\u539f\u6210 Codex \u8ba4\u8bc6\u7684\u5f62\u5f0f\u3002\u4e0d\u5e26\u8f7d\u4f53\u7684\u8bf7\u6c42\uff0c\u8f6c\u6362\u7ed3\u679c\u4e0e\u4e4b\u524d\u9010\u5b57\u8282\u76f8\u540c\u3002\uff08[#7454](https://github.com/farion1231/cc-switch/pull/7454)\uff0c\u4fee\u590d [#7451](https://github.com/farion1231/cc-switch/issues/7451)\u3001[#6158](https://github.com/farion1231/cc-switch/issues/6158)\uff09\r\n\r\n### \u4e00\u5f20 `detail: \"original\"` \u7684\u56fe\u7247\u4e0d\u518d\u8ba9 Codex \u4f1a\u8bdd\u6c38\u4e45\u5931\u8d25\r\n\r\n\u6a21\u578b\u7684 Codex \u76ee\u5f55\u6761\u76ee\u58f0\u660e\u4e86 `supports_image_detail_original` \u65f6\uff0cCodex \u4f1a\u628a\u5de5\u5177\u8fd4\u56de\u7684\u56fe\u7247\uff08\u4f8b\u5982 `view_image` \u622a\u56fe\uff09\u6807\u6210 `detail: \"original\"`\uff0c\u8fd9\u4e2a\u503c\u53ea\u5728 Responses API \u91cc\u5408\u6cd5\u3002\u8f6c\u6362\u5230 Chat \u4e0a\u6e38\u65f6\uff0c\u5b83\u88ab\u539f\u6837\u62f7\u8fdb `image_url.detail`\uff0c\u4e25\u683c\u7684 OpenAI \u517c\u5bb9\u7f51\u5173\uff08\u65b9\u821f/\u8c46\u5305\u3001\u65e5\u65e5\u65b0\u3001GLM\u3001vLLM \u7b49\uff09\u5bf9\u6574\u6761\u8bf7\u6c42\u8fd4\u56de 400\u3002Codex \u6bcf\u8f6e\u90fd\u4f1a\u91cd\u653e\u5b8c\u6574\u5386\u53f2\uff0c\u6240\u4ee5\u4e00\u5f20\u56fe\u5c31\u8ba9\u8fd9\u4e2a\u4f1a\u8bdd\u6b64\u540e\u6bcf\u8f6e\u90fd\u5931\u8d25\uff0c\u7eaf\u6587\u672c\u56de\u5408\u4e5f\u4e0d\u4f8b\u5916\u3002\r\n\r\n\u4fee\u590d\u5206\u4e24\u5c42\uff1a\u4ee3\u7406\u5728 Chat \u56fe\u7247\u91cc\u628a `original` \u964d\u4e3a `auto`\uff08`auto`\u3001`low`\u3001`high` \u539f\u6837\u4fdd\u7559\uff09\uff0c\u6240\u4ee5\u5df2\u7ecf\u574f\u6389\u7684\u4f1a\u8bdd\uff0c\u4ee5\u53ca\u4e0d\u4f1a\u81ea\u884c\u4fee\u6b63\u5386\u53f2\u7684 Codex 0.155.0 \u4e4b\u524d\u7684\u7248\u672c\uff0c\u5347\u7ea7\u540e\u7acb\u5373\u6062\u590d\uff1b\u4e3a Chat \u8f6c\u6362\u751f\u6210\u7684 Codex \u76ee\u5f55\u4e00\u5f8b\u5199 `supports_image_detail_original: false`\uff0c\u4ece\u6e90\u5934\u8ba9 Codex \u4e0d\u518d\u53d1 `original`\u3002\u76f4\u63a5\u8d34\u8fdb\u5bf9\u8bdd\u7684\u56fe\u7247\u4ece\u6765\u6ca1\u6709\u53d7\u5f71\u54cd\u3002\uff08[#7476](https://github.com/farion1231/cc-switch/pull/7476)\uff0c\u4fee\u590d [#6495](https://github.com/farion1231/cc-switch/issues/6495)\u3001[#7458](https://github.com/farion1231/cc-switch/issues/7458)\uff09\r\n\r\n### \u7f16\u8f91\u6216\u5207\u8d70 Codex \u4f9b\u5e94\u5546\u4e0d\u518d\u6e05\u7a7a\u5df2\u4fdd\u5b58\u7684 API Key\r\n\r\n\u6709\u4e9b Codex \u4f9b\u5e94\u5546\u5728 `[model_providers.*]` \u8868\u91cc\u81ea\u5e26\u51ed\u636e\u6765\u6e90\uff08`env_key`\u3001`auth` / `aws` \u8868\uff0c\u6216 `http_headers` \u91cc\u7684 `Authorization`\uff09\u3002\u8fd9\u7c7b\u4f9b\u5e94\u5546\u4e0d\u4f1a\u5f80 `config.toml` \u6ce8\u5165 token\uff0c\u800c\u9ed8\u8ba4\u6a21\u5f0f\u6bcf\u6b21\u5207\u5230\u7b2c\u4e09\u65b9\u65f6\u90fd\u4f1a\u5220\u6389\u5171\u4eab\u7684 `~/.codex/auth.json`\uff0c\u6240\u4ee5 live \u5feb\u7167\u91cc\u7684 auth \u6c38\u8fdc\u662f\u7a7a\u7684\uff0c\u6570\u636e\u5e93\u91cc\u7684 `OPENAI_API_KEY` \u662f\u5bc6\u94a5\u552f\u4e00\u7684\u526f\u672c\u3002\u6709\u4e24\u6761\u8def\u5f84\u628a\u8fd9\u4e2a\u7a7a auth \u5f53\u6210\u4e86\u6743\u5a01\uff1a\u5f53\u524d\u4f9b\u5e94\u5546\u7684\u7f16\u8f91\u5bf9\u8bdd\u6846\u7528 live \u5feb\u7167\u586b\u8868\u5355\uff0c\u5207\u8d70\u65f6\u7684\u56de\u586b\u53c8\u628a live \u5feb\u7167\u5199\u56de\u6570\u636e\u5e93\u3002\u7ed3\u679c\u662f\u6253\u5f00\u7f16\u8f91\u5668\u539f\u6837\u4fdd\u5b58\uff0c\u6216\u8005\u53ea\u662f\u5207\u8d70\uff0c\u5bc6\u94a5\u5c31\u88ab\u6084\u6084\u62b9\u6389\uff1b\u968f\u540e\u7528\u91cf\u811a\u672c\u5bf9\u8bdd\u6846\u628a\u8fd9\u5f20\u6ca1\u6709\u5bc6\u94a5\u7684\u5361\u5f53\u6210\u5b98\u65b9\u8ba2\u9605\uff0c\u91cd\u7f6e\u4e86\u4fdd\u5b58\u7684\u811a\u672c\u3002\r\n\r\n\u73b0\u5728\u4e24\u5904\u90fd\u628a\u300c\u6ca1\u6709\u51ed\u636e\u7684 live auth\u300d\uff08`auth.json` \u4e0d\u5b58\u5728\uff0c\u6216\u53ea\u5269 `auth_mode` \u767b\u51fa\u6807\u8bb0\uff09\u89c6\u4e3a\u5b57\u6bb5\u7f3a\u5931\uff1a\u4fdd\u7559\u5df2\u5b58\u7684 auth\uff0c\u540c\u65f6\u7167\u5e38\u91c7\u96c6 live \u7684 `config.toml`\u3002live auth \u91cc\u6709\u5b9e\u9645\u51ed\u636e\u65f6\u4ecd\u4ee5\u5b83\u4e3a\u51c6\uff0c\u624b\u52a8\u4fee\u6539 `~/.codex/auth.json` \u4f9d\u7136\u6709\u6548\u3002\uff08[#7434](https://github.com/farion1231/cc-switch/pull/7434)\uff0c\u4fee\u590d [#7433](https://github.com/farion1231/cc-switch/issues/7433)\uff09\r\n\r\n### \u5220\u6389 ChatGPT \u8d26\u53f7\u540e\uff0c\u7ed1\u7740\u5b83\u7684 Codex \u5361\u7247\u53ef\u4ee5\u91cd\u65b0\u7ed1\u5b9a\u6216\u5207\u8d70\r\n\r\n\u5728\u8ba4\u8bc1\u4e2d\u5fc3\u5220\u6389\u6258\u7ba1\u7684 ChatGPT \u8d26\u53f7\u518d\u91cd\u65b0\u767b\u5f55\uff0c\u5373\u4f7f\u662f\u540c\u4e00\u4e2a ChatGPT \u7528\u6237\u548c\u5de5\u4f5c\u533a\uff0c\u4e5f\u4f1a\u751f\u6210\u65b0\u7684\u672c\u5730\u8d26\u53f7 id\u3002\u8fd8\u7ed1\u7740\u65e7 id \u7684 Codex \u5361\u7247\u6b64\u540e\u6bcf\u6b21\u5207\u6362\u8def\u7531\u3001\u5f00\u5173\u63a5\u7ba1\u3001\u542f\u52a8\u6062\u590d\u548c\u91cd\u65b0\u7ed1\u5b9a\u90fd\u62a5 `\u8d26\u53f7\u4e0d\u5b58\u5728: <id>`\uff0c\u7528\u6237\u65e2\u6362\u4e0d\u4e86\u4f9b\u5e94\u5546\uff0c\u4e5f\u6ca1\u6cd5\u5728\u8fd9\u5f20\u5361\u4e0a\u9009\u65b0\u8d26\u53f7\u3002\r\n\r\n\u73b0\u5728\u5207\u8d70\u65f6\u80fd\u533a\u5206\u300c\u8d26\u53f7\u5df2\u5220\u9664\u300d\u548c\u300c\u8d26\u53f7\u8fd8\u5728\u3001\u53ea\u662f live \u91cc\u6ca1\u6709\u5bf9\u5e94\u7684 token\u300d\uff1a\u5df2\u5220\u9664\u7684\u8d26\u53f7\u53ea\u91ca\u653e cc-switch \u7684\u5f52\u5c5e\u6807\u8bb0\uff0c\u4e0d\u52a8 `~/.codex/auth.json`\uff0c\u8fd9\u6837\u4e4b\u540e\u7528\u539f\u751f Codex CLI \u767b\u5f55\u7684\u540c\u4e00\u7528\u6237\u4e0d\u4f1a\u88ab\u5f53\u6210 cc-switch \u7ba1\u7406\u7684\u767b\u5f55\u5220\u6389\u3002\u53ea\u6709\u6301\u4e45\u5316\u7684 `codex_oauth_auth.json` \u6821\u9a8c\u901a\u8fc7\u540e\uff0c\u624d\u8ba4\u5b9a\u8d26\u53f7\u5df2\u5220\u9664\uff1b\u6587\u4ef6\u8bfb\u4e0d\u51fa\u3001\u683c\u5f0f\u4e0d\u5bf9\uff0c\u6216\u8d26\u53f7\u5176\u5b9e\u8fd8\u5728\u78c1\u76d8\u4e0a\u65f6\uff0c\u5207\u6362\u4e2d\u6b62\u3001live \u6587\u4ef6\u4fdd\u6301\u4e0d\u53d8\uff0c\u4e0d\u505a\u731c\u6d4b\u3002\u5361\u7247\u81ea\u5df1\u7684\u7ed1\u5b9a\u5931\u6548\u65f6\uff0c\u62a5\u9519\u4f1a\u63d0\u793a\u5728\u4f9b\u5e94\u5546\u5361\u7247\u4e0a\u70b9\u300c\u9009\u62e9\u8d26\u53f7\u300d\u91cd\u65b0\u7ed1\u5b9a\u3002\u4e0d\u4f1a\u81ea\u52a8\u91cd\u7ed1\u3002\uff08[#7395](https://github.com/farion1231/cc-switch/pull/7395)\uff0c\u4fee\u590d [#7392](https://github.com/farion1231/cc-switch/issues/7392)\uff09\r\n\r\n### \u6ca1\u5199\u63cf\u8ff0\u7684\u5de5\u5177\u4e0d\u518d\u4ee5 `null` \u53d1\u51fa\r\n\r\nClaude\u2192OpenAI Chat \u4e0e Claude\u2192Responses \u8f6c\u6362\u5668\u4f1a\u628a\u6bcf\u4e2a\u5de5\u5177\u7684 `description` \u539f\u6837\u62f7\u8fdb\u8bf7\u6c42\uff0c\u6ca1\u6709\u63cf\u8ff0\u7684\u5de5\u5177\u5c31\u53d8\u6210 `\"description\": null`\uff0c\u4e25\u683c\u7684 OpenAI \u517c\u5bb9\u4e0a\u6e38\u4ee5 400 `expected string, received null` \u62d2\u7edd\u6574\u8f6e\u3002Anthropic \u7684\u6258\u7ba1\u5de5\u5177\uff08\u5982 `web_search`\uff09\u6309\u5b9a\u4e49\u5c31\u6ca1\u6709\u63cf\u8ff0\uff0c\u6ca1\u5199\u63cf\u8ff0\u7684\u81ea\u5b9a\u4e49\u5de5\u5177\u548c MCP \u5de5\u5177\u4e5f\u4f1a\u89e6\u53d1\uff0c\u574f\u6389\u7684\u662f\u6574\u6761\u8bf7\u6c42\uff0c\u4e0d\u53ea\u662f\u90a3\u4e00\u4e2a\u5de5\u5177\u3002\u73b0\u5728\u7f3a\u5931\u6216\u663e\u5f0f\u4e3a `null` \u7684\u63cf\u8ff0\u4f1a\u76f4\u63a5\u7701\u7565\uff0c\u5176\u4ed6\u503c\u539f\u6837\u900f\u4f20\uff1b\u5b57\u6bb5\u4ecd\u6309 `name` \u2192 `description` \u2192 `parameters` \u7684\u987a\u5e8f\u5199\u5165\uff0c\u5e26\u63cf\u8ff0\u7684\u5de5\u5177\u5e8f\u5217\u5316\u7ed3\u679c\u4e0e\u4e4b\u524d\u9010\u5b57\u8282\u76f8\u540c\uff0c\u4e0d\u5f71\u54cd prompt cache\u3002Codex \u7684 Responses\u2192Chat \u8f6c\u6362\u5668\u5bf9\u51fd\u6570\u5de5\u5177\u6709\u540c\u6837\u7684\u95ee\u9898\uff0c\u4e00\u5e76\u4fee\u590d\uff08[#7378](https://github.com/farion1231/cc-switch/pull/7378)\uff09\u3002\uff08[#7319](https://github.com/farion1231/cc-switch/pull/7319)\uff0c\u4fee\u590d [#7303](https://github.com/farion1231/cc-switch/issues/7303)\uff09\r\n\r\n### Claude Code \u7684 auto mode \u7ecf GitHub Copilot \u53ef\u7528\r\n\r\nClaude Code \u7684 auto mode \u5206\u7c7b\u5668\u6bcf\u6b21\u5b89\u5168\u68c0\u67e5\u90fd\u4f1a\u53d1 `stop_sequences`\u3002\u7ecf GitHub Copilot \u65f6\uff0cAnthropic\u2192OpenAI Chat \u8f6c\u6362\u628a\u5b83\u6620\u5c04\u6210 `stop`\uff0c\u800c Copilot \u4e3a Claude \u6a21\u578b\u63d0\u4f9b\u7684 Chat Completions \u8def\u7531\u9047\u5230\u8fd9\u4e2a\u53c2\u6570\u5c31\u8fd4\u56de 400\uff0c\u4e8e\u662f\u5206\u7c7b\u5668\u6bcf\u6b21\u90fd\u5931\u8d25\uff0c\u666e\u901a\u5bf9\u8bdd\u5374\u6b63\u5e38\u3002\u73b0\u5728\u53ea\u5728\u4f9b\u5e94\u5546\u662f GitHub Copilot \u65f6\u53bb\u6389\u8f6c\u6362\u51fa\u7684 `stop`\uff0c\u5176\u4ed6 OpenAI \u517c\u5bb9\u4e0a\u6e38\uff08\u5982 OpenRouter\uff09\u7167\u5e38\u4fdd\u7559\u3002\uff08[#5404](https://github.com/farion1231/cc-switch/pull/5404)\uff0c\u4fee\u590d [#5175](https://github.com/farion1231/cc-switch/issues/5175)\uff09\r\n\r\n### `/effort` \u7684\u6863\u4f4d\u539f\u6837\u9001\u8fbe OpenAI \u4e0e Grok \u4e0a\u6e38\r\n\r\nClaude Code \u7684\u63a8\u7406\u5f3a\u5ea6\u8f6c\u6362\u6210 OpenAI \u683c\u5f0f\uff08Chat \u7684 `reasoning_effort`\u3001Responses \u7684 `reasoning.effort`\uff09\u65f6\u6709\u4e09\u5904\u7f3a\u53e3\uff0c\u73b0\u5728\u90fd\u8865\u4e0a\u4e86\uff1a\r\n\r\n- `/effort xhigh` \u53d1\u7684\u662f `output_config.effort: \"xhigh\"`\uff0c\u89e3\u6790\u5668\u4e0d\u8ba4\u8bc6\u8fd9\u4e2a\u503c\uff1b\u53c8\u56e0\u4e3a\u663e\u5f0f\u7684 `output_config.effort` \u4f1a\u5c4f\u853d `thinking` \u56de\u9000\uff0c\u7ed3\u679c\u4e00\u4e2a\u6863\u4f4d\u90fd\u6ca1\u53d1\u3002\u73b0\u5728 `xhigh` \u4e00\u4e00\u5bf9\u5e94\u3002\r\n- \u652f\u6301\u63a8\u7406\u7684\u6a21\u578b\u540d\u5355\u91cc\u53ea\u6709 `grok-4.5` \u7cfb\u5217\u548c `grok-build-*`\uff0c\u6620\u5c04\u5230 `grok-4.6` / `grok-4.6-build` \u7684 Claude \u6a21\u578b\u4e22\u6389\u4e86\u6240\u6709\u6863\u4f4d\uff0c\u5305\u62ec `max`\u3002\u73b0\u5728\u540d\u5355\u52a0\u5165\u4e86 `grok-4.6` \u4e0e `grok-4.6-*`\u3002\r\n- \u663e\u5f0f\u7684 `max` \u603b\u88ab\u964d\u6210 `xhigh`\u3002\u73b0\u5728\u5bf9\u652f\u6301\u72ec\u7acb max \u6863\u7684 `gpt-5.6`\u3001`gpt-5.6-sol`\u3001`gpt-5.6-terra`\u3001`gpt-5.6-luna` \u4e0e `gpt-6-astra` \u539f\u6837\u53d1\u9001 `max`\uff0c\u5176\u4ed6\u6a21\u578b\u4ecd\u56de\u843d\u5230 `xhigh`\u3002\r\n\r\n`low`\u3001`medium`\u3001`high` \u7684\u8bf7\u6c42\u4e0d\u53d8\u3002\uff08[#7318](https://github.com/farion1231/cc-switch/pull/7318)\u3001[#7531](https://github.com/farion1231/cc-switch/pull/7531)\uff0c\u4fee\u590d [#7314](https://github.com/farion1231/cc-switch/issues/7314)\u3001[#6197](https://github.com/farion1231/cc-switch/issues/6197)\u3001[#3389](https://github.com/farion1231/cc-switch/issues/3389)\u3001[#5367](https://github.com/farion1231/cc-switch/issues/5367)\uff09\r\n\r\n### DeepSeek V4 Pro \u6062\u590d\u9ad8\u5cf0\u6863\u5b9a\u4ef7\r\n\r\nv3.20.3 \u6839\u636e DeepSeek\u300c2026-09-14 \u8d77 V4 Pro \u8def\u7531\u5230 V4.1 Flash\u300d\u7684\u516c\u544a\uff0c\u63d0\u524d\u628a `deepseek-v4-pro` \u6539\u6210 Flash \u6863\u4ef7\u683c\uff08\u6bcf\u767e\u4e07 token $0.30 / $1.20\uff0c\u7f13\u5b58\u8bfb $0.006\uff09\u3002DeepSeek \u5728 2026-09-12 \u64a4\u56de\u4e86\u8fd9\u4efd\u516c\u544a\uff0cV4 Pro \u7167\u65e7\u6309\u539f\u4ef7\u8ba1\u8d39\uff0c\u4e8e\u662f V4 Pro \u7684\u8bf7\u6c42\u4e00\u76f4\u88ab\u7b97\u5f97\u8fdc\u4f4e\u4e8e\u5b9e\u9645\u8d39\u7528\u3002\u672c\u7248\u628a\u5b9a\u4ef7\u6539\u56de\u6bcf\u767e\u4e07 token \u8f93\u5165 $1.32\u3001\u8f93\u51fa $3.96\u3001\u7f13\u5b58\u8bfb $0.044\uff08\u9ad8\u5cf0\u6863\uff0c\u5373\u4eba\u6c11\u5e01 9 / 27 / 0.3 \u5143\uff09\u3002\u4fee\u590d\u53ea\u6539\u5199\u56db\u4e2a\u4ef7\u683c\u5217\u4ecd\u662f v3.20.3 \u5199\u5165\u503c\uff080.3 / 1.2 / 0.006 / 0\uff09\u7684\u884c\uff0c\u81ea\u5b9a\u4e49\u8fc7\u7684\u884c\u4e0d\u52a8\u3002`deepseek-v4-flash`\u3001`deepseek-flash` \u7b49 Flash \u7cfb\u5217 id \u4ecd\u6309 V4.1 Flash \u6863\u8ba1\u4ef7\u3002\r\n\r\n### \u63d0\u793a\u8bcd\u5217\u8868\u4f1a\u8bfb\u56de\u5916\u90e8\u5bf9 live \u6587\u4ef6\u7684\u4fee\u6539\r\n\r\n\u5728 CC Switch \u4e4b\u5916\u6539\u4e86\u5168\u5c40 `CLAUDE.md`\u3001`AGENTS.md` \u6216\u5176\u4ed6\u5e94\u7528\u7684 live \u63d0\u793a\u8bcd\u6587\u4ef6\u540e\uff0c\u63d0\u793a\u8bcd\u5217\u8868\u4e00\u76f4\u663e\u793a\u6570\u636e\u5e93\u91cc\u7684\u65e7\u5185\u5bb9\uff0c\u76f4\u5230\u91cd\u542f\u3002\u73b0\u5728\u52a0\u8f7d\u63d0\u793a\u8bcd\u5217\u8868\u65f6\u4f1a\u8bfb\u56de live \u6587\u4ef6\uff0c\u5185\u5bb9\u4e0d\u540c\u5c31\u66f4\u65b0\u5f53\u524d\u542f\u7528\u7684\u63d0\u793a\u8bcd\uff1b\u7a97\u53e3\u91cd\u65b0\u83b7\u5f97\u7126\u70b9\u65f6\uff0c\u6253\u5f00\u7740\u7684\u63d0\u793a\u8bcd\u9762\u677f\u4e5f\u4f1a\u5237\u65b0\uff08\u6b63\u5728\u7f16\u8f91\u3001\u786e\u8ba4\u6216\u5199\u5165\u65f6\u4f1a\u7b49\u5f85\uff09\u3002\u53ea\u5237\u65b0\u542f\u7528\u4e2d\u7684\u63d0\u793a\u8bcd\uff0c\u5176\u4ed6\u6a21\u677f\u4e0d\u52a8\uff1b\u6587\u4ef6\u7f3a\u5931\u3001\u8bfb\u4e0d\u51fa\u3001\u4e3a\u7a7a\u6216\u53ea\u6709\u7a7a\u767d\u65f6\u4fdd\u7559\u5df2\u5b58\u5185\u5bb9\uff1b\u540c\u6b65\u6216\u6062\u590d\u6b63\u5728\u8fdb\u884c\u65f6\u8df3\u8fc7\u5237\u65b0\u3002Pi \u4ecd\u4f7f\u7528\u5b83\u81ea\u5df1\u57fa\u4e8e `AGENTS.md` \u7684\u542f\u7528\u673a\u5236\uff0c\u4e0d\u5728\u6b64\u5217\u3002\uff08[#7194](https://github.com/farion1231/cc-switch/pull/7194)\uff09\r\n\r\n### Skills \u5b89\u88c5\uff1aid \u4e0e\u76ee\u5f55\u540d\u4e0d\u4e00\u81f4\u3001\u4ed3\u5e93\u6587\u4ef6\u8fc7\u591a\r\n\r\n- skills.sh \u628a\u6280\u80fd\u7684 `skillId` \u5f53\u4f5c\u76ee\u5f55\u540d\u4f20\u8fc7\u6765\uff0c\u4f46 id \u4e0d\u4e00\u5b9a\u7b49\u4e8e\u4ed3\u5e93\u91cc\u7684\u76ee\u5f55\u540d\u3002\u4f8b\u5982 `tencent/WeChatReading` \u5728 `skills/SKILL.md` \u53d1\u5e03 `name: weread-skills`\uff0c\u4e8e\u662f\u5b89\u88c5\u5931\u8d25\uff1b\u5c31\u7b97\u88c5\u4e0a\u4e86\uff0c\u66f4\u65b0\u68c0\u67e5\u4e5f\u53ea\u6309\u76ee\u5f55\u540d\u5339\u914d\uff0c\u627e\u4e0d\u5230\u5b83\u3002\u73b0\u5728\u67e5\u627e\u65f6\u5148\u8bd5\u663e\u5f0f\u8def\u5f84\u548c\u540c\u540d\u76ee\u5f55\uff0c\u518d\u63a5\u53d7\u5143\u6570\u636e `name` \u4e0e id \u76f8\u540c\u7684 `SKILL.md`\uff08\u5fc5\u987b\u552f\u4e00\uff1b\u6709\u591a\u4e2a\u76ee\u5f55\u58f0\u660e\u540c\u4e00\u4e2a\u540d\u5b57\u65f6\u62d2\u7edd\u5b89\u88c5\uff0c\u4e0d\u4f1a\u968f\u4fbf\u6311\u4e00\u4e2a\uff09\u3002\u66f4\u65b0\u68c0\u67e5\u4f18\u5148\u4f7f\u7528\u4fdd\u5b58\u7684\u6e90\u8def\u5f84\uff0c\u6280\u80fd\u5728\u4ed3\u5e93\u91cc\u632a\u4e86\u4f4d\u7f6e\u6216\u6539\u4e86\u540d\u4e5f\u80fd\u7ee7\u7eed\u66f4\u65b0\u3002\uff08[#6381](https://github.com/farion1231/cc-switch/pull/6381)\uff0c\u4fee\u590d [#6365](https://github.com/farion1231/cc-switch/issues/6365)\uff09\r\n- \u5b89\u88c5\u6280\u80fd\u4f1a\u4e0b\u8f7d\u6574\u4e2a GitHub \u4ed3\u5e93\u7684\u538b\u7f29\u5305\uff0c`hugohe3/ppt-master` \u8fd9\u79cd\u6709 13,248 \u4e2a\u6761\u76ee\u7684\u4ed3\u5e93\u4f1a\u649e\u4e0a 1 \u4e07\u4e2a\u6761\u76ee\u7684\u4e0a\u9650\uff0c\u62a5 `ARCHIVE_TOO_MANY_ENTRIES`\u3002\u8fdc\u7a0b\u538b\u7f29\u5305\u3001\u672c\u5730 ZIP \u5b89\u88c5\u4e0e WebDAV \u6062\u590d\u7684\u6761\u76ee\u4e0a\u9650\u90fd\u63d0\u9ad8\u5230 3 \u4e07\uff1b\u771f\u6b63\u7684\u9650\u5236\u4ecd\u662f 512 MiB \u7684\u89e3\u538b\u9884\u7b97\u3002\uff08[#7489](https://github.com/farion1231/cc-switch/pull/7489)\uff0c\u4fee\u590d [#7475](https://github.com/farion1231/cc-switch/issues/7475)\uff09\r\n\r\n### WSL \u4e0a\u7684 OpenCode \u76ee\u5f55\u4e5f\u80fd\u627e\u5230 OMO \u7edf\u4e00\u914d\u7f6e\r\n\r\nOpenCode \u914d\u7f6e\u76ee\u5f55\u6307\u5411 WSL\uff08`\\\\wsl.localhost\\<distro>\\home\\<user>\\.config\\opencode` \u6216 `\\\\wsl$\\\u2026`\uff09\u65f6\uff0cOMO 4.19.3 \u53ca\u4ee5\u540e\u7684\u7248\u672c\u628a\u7edf\u4e00\u914d\u7f6e\u653e\u5728 WSL \u4e00\u4fa7\u7684\u5bb6\u76ee\u5f55\uff08`~/.omo/omo.jsonc` \u6216 `omo.json`\uff09\u3002CC Switch \u53ea\u5728 Windows \u5bb6\u76ee\u5f55\u91cc\u627e\uff0c\u627e\u4e0d\u5230\u5c31\u6084\u6084\u9000\u56de\u5230 OMO \u5df2\u7ecf\u4e0d\u8bfb\u7684\u65e7\u63d2\u4ef6\u6587\u4ef6\uff08`oh-my-opencode.jsonc`\uff09\uff0c\u5207\u6362\u770b\u4f3c\u6210\u529f\uff0c\u5b9e\u9645\u6ca1\u6709\u751f\u6548\u3002\u73b0\u5728\u4f1a\u6839\u636e OpenCode \u76ee\u5f55\u7684 WSL \u8def\u5f84\u63a8\u51fa WSL \u5bb6\u76ee\u5f55\uff0c\u8bfb\u3001\u5199\u3001\u5220\u90fd\u4f18\u5148\u68c0\u67e5\u90a3\u91cc\uff1b\u4e24\u8fb9\u90fd\u6ca1\u6709\u7edf\u4e00\u914d\u7f6e\u65f6\uff0c\u4ecd\u9000\u56de\u65e7\u6587\u4ef6\u3002\uff08[#7550](https://github.com/farion1231/cc-switch/pull/7550)\uff0c\u4fee\u590d [#7363](https://github.com/farion1231/cc-switch/issues/7363)\uff09\r\n\r\n### Windows \u4e3b\u7a97\u53e3\u4ece\u5176\u4ed6\u5165\u53e3\u6253\u5f00\u65f6\u4fdd\u7559\u4efb\u52a1\u680f\u6309\u94ae\r\n\r\n\u9759\u9ed8\u542f\u52a8\u6216\u5173\u95ed\u5230\u6258\u76d8\u540e\uff0cWindows \u4e3b\u7a97\u53e3\u4f1a\u4ee5 `skip_taskbar(true)` \u9690\u85cf\uff0c\u800c\u53ea\u6709\u6258\u76d8\u7684\u300c\u6253\u5f00\u4e3b\u754c\u9762\u300d\u4f1a\u5728 `show()` \u4e4b\u524d\u91cd\u7f6e\u8fd9\u4e2a\u6807\u5fd7\u3002\u4ece\u522b\u7684\u5165\u53e3\u5524\u56de\u7a97\u53e3\u65f6\uff0c\u5b83\u6ca1\u6709\u4efb\u52a1\u680f\u6309\u94ae\uff0c\u4e00\u70b9\u6700\u5c0f\u5316\u5c31\u5f7b\u5e95\u627e\u4e0d\u5230\u4e86\u3002\u73b0\u5728\u8fd9\u4e9b\u5165\u53e3\u90fd\u4f1a\u5148\u8c03\u7528 `set_skip_taskbar(false)`\uff1a\u5df2\u5728\u8fd0\u884c\u65f6\u518d\u6b21\u4ece\u5feb\u6377\u65b9\u5f0f\u6216\u5f00\u59cb\u83dc\u5355\u542f\u52a8\u3001\u805a\u7126\u4e3b\u7a97\u53e3\u7684 `ccswitch://` deep link\u3001URL \u6253\u5f00\u4e8b\u4ef6\uff0c\u4ee5\u53ca\u7248\u672c\u4e0d\u5339\u914d\u65f6\u663e\u793a\u7684\u6570\u636e\u5e93\u6062\u590d\u754c\u9762\u3002\uff08[#6348](https://github.com/farion1231/cc-switch/pull/6348)\uff09\r\n\r\n### \u300c\u9690\u85cf AI \u7f72\u540d\u300d\u4e5f\u9690\u85cf Claude Code \u7684\u4f1a\u8bdd\u94fe\u63a5\r\n\r\nClaude Code \u4e3a\u7f51\u9875\u7248\u4e0e Remote Control \u4f1a\u8bdd\u521b\u5efa\u7684\u63d0\u4ea4\u548c PR \u4f1a\u5e26\u4e0a claude.ai \u7684\u4f1a\u8bdd\u94fe\u63a5\uff0c\u8fd9\u7531\u5355\u72ec\u7684 `attribution.sessionUrl` \u63a7\u5236\uff0c\u53ea\u6e05\u7a7a `commit` \u548c `pr` \u5df2\u7ecf\u85cf\u4e0d\u4f4f\u5168\u90e8\u7f72\u540d\u3002Claude \u7f16\u8f91\u5668\u7684\u300c\u9690\u85cf AI \u7f72\u540d\u300d\u5f00\u5173\u73b0\u5728\u5199\u5165 `attribution: {commit: \"\", pr: \"\", sessionUrl: false}`\uff0c\u4e09\u9879\u90fd\u6ee1\u8db3\u65f6\u624d\u663e\u793a\u4e3a\u5df2\u52fe\u9009\u3002\u53d6\u6d88\u52fe\u9009\u4ecd\u4f1a\u5220\u9664\u6574\u4e2a `attribution` \u5bf9\u8c61\u3002\uff08[#7053](https://github.com/farion1231/cc-switch/pull/7053)\uff09\r\n\r\n### \u5173\u4e8e\u9875\u7684\u7248\u672c\u63a2\u6d4b\uff1a\u4e0d\u518d\u4e0b\u8f7d\u6574\u4efd npm \u5143\u6570\u636e\uff0c\u4e5f\u4e0d\u518d\u628a Ubuntu \u7248\u672c\u5f53\u6210\u5de5\u5177\u7248\u672c\r\n\r\n- \u67e5\u8be2 npm \u5206\u53d1\u5de5\u5177\u7684\u6700\u65b0\u7248\u672c\u65f6\uff0c\u4e4b\u524d\u4e0b\u8f7d\u7684\u662f\u5b8c\u6574\u7684 npm packument\uff08Codex\u3001OpenCode\u3001OpenClaw \u8fd9\u7c7b\u53d1\u7248\u9891\u7e41\u7684\u5305\uff0c\u89e3\u538b\u540e\u6709 14\u201325 MB\uff09\uff0c\u53ea\u4e3a\u8bfb\u5176\u4e2d\u7684 `dist-tags`\uff1b\u800c\u4e14\u8fd9\u662f\u552f\u4e00\u6ca1\u6709\u8bbe 15 \u79d2\u8d85\u65f6\u7684\u63a2\u6d4b\uff0c\u4f1a\u9000\u56de\u5230\u5171\u4eab\u5ba2\u6237\u7aef\u7684 600 \u79d2\u3002\u6162\u7f51\u7edc\u4e0b\u5361\u7247\u4f1a\u505c\u5728\u300c\u52a0\u8f7d\u4e2d\u300d\u597d\u51e0\u5206\u949f\u3002\u73b0\u5728\u6539\u7528\u4e13\u95e8\u7684 `/-/package/{package}/dist-tags` \u7aef\u70b9\uff08\u54cd\u5e94\u53ea\u6709\u51e0\u5341\u5b57\u8282\u5230\u51e0 KB\uff09\uff0c\u5e76\u4f7f\u7528 15 \u79d2\u8d85\u65f6\uff1b\u8d85\u65f6\u3001\u7f51\u7edc\u9519\u8bef\u6216 404 \u65f6\u663e\u793a\u300c\u672a\u77e5\u300d\u3002\uff08[#7346](https://github.com/farion1231/cc-switch/pull/7346)\uff0c\u4fee\u590d [#7339](https://github.com/farion1231/cc-switch/issues/7339)\uff09\r\n- Windows \u4e0a\u63a2\u6d4b WSL \u91cc\u7684\u5de5\u5177\u65f6\uff0c\u4f1a\u901a\u8fc7\u767b\u5f55\u4ea4\u4e92\u5f0f shell \u6267\u884c `<tool> --version`\uff0c\u5e76\u53d6 stdout \u91cc\u7684\u7b2c\u4e00\u4e2a `x.y.z`\u3002Ubuntu \u6bcf\u5929\u7b2c\u4e00\u6b21\u767b\u5f55\u4f1a\u6253\u5370 MOTD\uff08\u300cWelcome to Ubuntu 24.04.4 LTS \u2026\u300d\uff09\uff0c\u4e8e\u662f Claude Code \u5361\u7247\u663e\u793a\u6210 `24.04.4`\u3002\u73b0\u5728\u5148\u6253\u5370\u4e00\u4e2a\u54e8\u5175\u5b57\u7b26\u4e32\u518d\u8fd0\u884c\u5de5\u5177\uff0c\u53ea\u89e3\u6790\u6700\u540e\u4e00\u4e2a\u54e8\u5175\u4e4b\u540e\u7684\u8f93\u51fa\u3002\uff08[#7348](https://github.com/farion1231/cc-switch/pull/7348)\uff0c\u4fee\u590d [#7347](https://github.com/farion1231/cc-switch/issues/7347)\uff09\r\n\r\n### \u667a\u8c31\u7684 Responses \u7aef\u70b9\u80fd\u83b7\u53d6\u6a21\u578b\u5217\u8868\r\n\r\n\u667a\u8c31\u7684 OpenAI Responses \u7aef\u70b9\uff08`https://open.bigmodel.cn/api/v1`\uff0c\u667a\u8c31 GLM Codex \u9884\u8bbe\u7684 Base URL\uff09\u8fd4\u56de\u7684 `/models` \u662f Codex \u8fdc\u7a0b\u76ee\u5f55\u7684\u683c\u5f0f\uff08`models[].slug`\uff09\uff0c\u800c\u4e0d\u662f OpenAI / Anthropic \u7684 `data[].id`\uff0c\u6240\u4ee5\u5728 Codex \u4f9b\u5e94\u5546\u8868\u5355\u91cc\u83b7\u53d6\u6a21\u578b\u603b\u662f\u7a7a\u7684\u3002\u73b0\u5728\u6ca1\u6709 `data` \u5b57\u6bb5\u65f6\u4f1a\u56de\u9000\u8bfb\u53d6 `models[].slug`\uff0c\u6709 `data` \u65f6\u884c\u4e3a\u4e0d\u53d8\u3002\uff08[#7330](https://github.com/farion1231/cc-switch/pull/7330)\uff09\r\n\r\n### AICodeWith \u7684 Codex \u65cf\u7aef\u70b9\u6539\u4e3a `/v1`\r\n\r\nAICodeWith \u7684 Responses \u7aef\u70b9\u662f `https://api.aicodewith.ai/v1`\uff0c\u5382\u5546\u535a\u5ba2\u91cc\u5199\u7684 `/chatgpt/v1` \u662f\u6587\u6863\u9519\u8bef\uff08\u5df2\u4e0e\u5382\u5546\u786e\u8ba4\uff09\u3002Codex \u9884\u8bbe\u4ee5\u53ca\u590d\u7528\u540c\u4e00\u7aef\u70b9\u7684 Hermes\u3001OpenClaw \u4e0e Pi \u9884\u8bbe\u90fd\u6539\u5230\u4e86 `/v1`\u3002\u5b58\u91cf\u5361\u7247\u9700\u8981\u624b\u52a8\u4fee\u6539\uff0c\u89c1\u5347\u7ea7\u63d0\u9192\u3002\r\n\r\n### Claude Desktop \u5728 DeepSeek V4 \u8def\u7531\u4e0a\u63d0\u4f9b 1M \u4e0a\u4e0b\u6587\r\n\r\nDeepSeek V4 \u5bb6\u65cf\u662f 1M \u4e0a\u4e0b\u6587\uff0c\u4f46\u56fa\u5b9a\u4f7f\u7528\u8fd9\u4e9b\u6a21\u578b\u7684 Claude Desktop \u9884\u8bbe\u6ca1\u6709\u5f00\u542f `supports1m`\uff0c\u6240\u4ee5 Claude Desktop \u7684\u6a21\u578b\u5217\u8868\u91cc\u4e00\u76f4\u6ca1\u6709 1M \u9009\u9879\u3002DeepSeek\uff08Sonnet / Opus \u7528 `deepseek-v4-pro`\uff0cHaiku \u7528 `deepseek-v4-flash`\uff09\u3001OpenCode Go\uff08`deepseek-v4-flash`\uff09\u4e0e\u767e\u5ea6\u5343\u5e06 Token Plan\uff08`deepseek-v4-pro`\uff09\u9884\u8bbe\u73b0\u5728\u90fd\u58f0\u660e\u4e86 1M\u3002`[1m]` \u540e\u7f00\u53ea\u5728 Claude Desktop \u672c\u5730\u8d77\u4f5c\u7528\uff0c\u53d1\u7ed9\u4f9b\u5e94\u5546\u7684\u5185\u5bb9\u4e0d\u53d8\u3002\r\n\r\n### \u5207\u6362\u5e94\u7528\u65f6\u4f9b\u5e94\u5546\u5217\u8868\u56de\u5230\u9876\u90e8\r\n\r\n\u4f9b\u5e94\u5546\u89c6\u56fe\u5728\u5207\u6362\u5e94\u7528\u65f6\u590d\u7528\u6eda\u52a8\u5bb9\u5668\uff0c\u53ea\u66ff\u6362\u91cc\u9762\u7684\u52a8\u753b\u5217\u8868\uff0c\u4e8e\u662f\u4e0a\u4e00\u4e2a\u5e94\u7528\u7684\u6eda\u52a8\u4f4d\u7f6e\u4f1a\u88ab\u5e26\u8fc7\u6765\uff1a\u4ece\u4e00\u4e2a\u6eda\u5230\u5e95\u90e8\u7684\u957f\u5217\u8868\u5207\u8d70\uff0c\u4e0b\u4e00\u4e2a\u5e94\u7528\u770b\u8d77\u6765\u53ef\u80fd\u50cf\u7a7a\u767d\u9875\u3002\u73b0\u5728\u5207\u6362\u5e94\u7528\u65f6\uff0c\u9875\u9762\u4e3b\u5bb9\u5668\u4e0e\u4f9b\u5e94\u5546\u5217\u8868\u5bb9\u5668\u90fd\u4f1a\u5728\u7ed8\u5236\u524d\u56de\u5230\u5de6\u4e0a\u89d2\u3002\uff08[#5211](https://github.com/farion1231/cc-switch/pull/5211)\uff09\r\n\r\n### \u754c\u9762\u7ec6\u8282\r\n\r\n- **\u4e0d\u518d\u663e\u793a\u8fc7\u671f\u7684\u7528\u91cf\u6863\u4f4d**\uff1a\u5173\u6389\u7528\u91cf\u811a\u672c\u6216\u5207\u5230\u5b98\u65b9\u8ba2\u9605\u6a21\u677f\u540e\uff0c\u4f9b\u5e94\u5546\u5361\u7247\u4e0d\u518d\u663e\u793a\u65e7\u811a\u672c\u7ed3\u679c\u91cc\u7684\u591a\u6863\u4f4d\u5c55\u5f00\u6309\u94ae\uff1b\u5b98\u65b9\u4f9b\u5e94\u5546\u5361\u7247\u540c\u7406\u3002\r\n- **\u5355\u8272\u9884\u8bbe\u56fe\u6807**\uff1a\u9884\u8bbe\u9009\u62e9\u5668\u91cc\u7684\u5355\u8272\u56fe\u6807\u6539\u7528\u524d\u666f\u8272\uff0c\u4e0e\u8868\u5355\u9884\u89c8\u548c\u4f9b\u5e94\u5546\u5361\u7247\u4e00\u81f4\uff089527CODE \u7b49\u56fe\u6807\u4e4b\u524d\u663e\u5f97\u504f\u7070\uff09\u3002\r\n- **Pi \u4f9b\u5e94\u5546\u56fe\u6807**\uff1a\u6ca1\u6709\u8bbe\u7f6e\u56fe\u6807\u7684 Pi \u4f9b\u5e94\u5546\u4e0d\u518d\u5b58\u6210 Pi \u7684\u5e94\u7528 logo\uff0c\u5361\u7247\u6539\u4e3a\u663e\u793a\u540d\u79f0\u9996\u5b57\u6bcd\uff0c\u4e0e\u5176\u4ed6\u5e94\u7528\u7684\u81ea\u5b9a\u4e49\u4f9b\u5e94\u5546\u4e00\u81f4\u3002\uff08[#6826](https://github.com/farion1231/cc-switch/pull/6826)\uff09\r\n- **\u7e41\u4f53\u4e2d\u6587\u7528\u8bcd**\uff1aPi \u8868\u5355\u7684\u91cd\u590d\u952e\u63d0\u793a\u6539\u7528\u4e0e\u5b57\u6bb5\u6807\u7b7e\u4e00\u81f4\u7684\u300c\u4f9b\u61c9\u5546\u8b58\u5225\u78bc\u300d\u3002\uff08[#7187](https://github.com/farion1231/cc-switch/pull/7187)\uff09\r\n\r\n---\r\n\r\n## \u5347\u7ea7\u63d0\u9192\r\n\r\n### \u672c\u7248\u542b\u6570\u636e\u5e93\u8fc1\u79fb\r\n\r\n`SCHEMA_VERSION` 18 \u2192 19\uff1a`mcp_servers` \u4e0e `skills` \u8868\u5404\u65b0\u589e\u4e00\u5217 `enabled_mcode`\uff0c\u9ed8\u8ba4\u5173\u95ed\u3002\u8fc1\u79fb\u5728\u9996\u6b21\u542f\u52a8\u65f6\u81ea\u52a8\u8fd0\u884c\u3002CC Switch \u4f1a\u5148\u5c1d\u8bd5\u5907\u4efd\u6570\u636e\u5e93\uff0c\u5907\u4efd\u653e\u5728 `~/.cc-switch/backups/`\uff08\u6587\u4ef6\u540d\u4ee5 `db_backup_` \u5f00\u5934\uff09\uff1b\u4f46\u5907\u4efd\u5931\u8d25\u53ea\u4f1a\u8bb0\u65e5\u5fd7\uff0c\u4e0d\u4f1a\u4e2d\u6b62\u5347\u7ea7\u3002\u8fd0\u884c\u8fc7\u672c\u7248\u4e4b\u540e\uff0cv3.20.3 \u53ca\u66f4\u65e9\u7684\u7248\u672c\u4f1a\u4ee5\u300c\u6570\u636e\u5e93\u7248\u672c\u8fc7\u65b0\u300d\u4e3a\u7531\u62d2\u7edd\u6253\u5f00\uff0c\u60f3\u964d\u7ea7\u53ea\u80fd\u6062\u590d\u5347\u7ea7\u524d\u7684\u5907\u4efd\u3002\u7a33\u59a5\u8d77\u89c1\uff0c\u5347\u7ea7\u524d\u5148\u9000\u51fa CC Switch\uff0c\u624b\u52a8\u590d\u5236\u4e00\u4efd\uff1a\r\n\r\n```bash\r\ncp ~/.cc-switch/cc-switch.db ~/cc-switch-before-v3.20.4.db\r\n```\r\n\r\nWindows \u4e0a\u9ed8\u8ba4\u5728 `%USERPROFILE%\\.cc-switch\\cc-switch.db`\u3002\u5982\u679c\u4f60\u5728\u8bbe\u7f6e\u91cc\u6539\u8fc7\u914d\u7f6e\u76ee\u5f55\uff0c\u6570\u636e\u5e93\u548c `backups/` \u90fd\u5728\u90a3\u4e2a\u76ee\u5f55\u4e0b\u3002\r\n\r\n### \u5e94\u7528\u5207\u6362\u680f\u9ed8\u8ba4\u51fa\u73b0 MiniMax Code\r\n\r\n\u8bbe\u7f6e\u65e9\u4e8e\u672c\u7248\u7684\u5b89\u88c5\u4e5f\u4f1a\u51fa\u73b0\u3002\u7528\u4e0d\u5230\u7684\u8bdd\uff0c\u53ef\u4ee5\u5728\u300c\u8bbe\u7f6e \u2192 \u4e3b\u9875\u9762\u663e\u793a\u300d\u91cc\u5173\u6389\u3002\r\n\r\n### \u5df2\u6709\u7684 MiniMax Code \u6570\u636e\u4f1a\u88ab\u81ea\u52a8\u63a5\u5165\r\n\r\n- `~/.minimax/config.yaml` \u91cc\u5df2\u6709\u7684\u81ea\u5b9a\u4e49\u4f9b\u5e94\u5546\uff0c\u4f1a\u5728\u7b2c\u4e00\u6b21\u6253\u5f00 MiniMax Code \u9875\u9762\u65f6\u5bfc\u5165\u3002\r\n- `~/.minimax/AGENTS.md` \u53ea\u6709\u5728\u6240\u6709\u5e94\u7528\u7684\u63d0\u793a\u8bcd\u5e93\u90fd\u8fd8\u662f\u7a7a\u7684\uff08\u5b9e\u9645\u4e0a\u5c31\u662f\u5168\u65b0\u5b89\u88c5\uff09\uff0c\u5e76\u4e14\u6587\u4ef6\u4e0d\u8d85\u8fc7 32 KiB \u65f6\uff0c\u624d\u4f1a\u5728\u542f\u52a8\u65f6\u5bfc\u5165\u3002\u5df2\u7ecf\u6709 Claude\u3001Codex \u7b49\u63d0\u793a\u8bcd\u7684\u5347\u7ea7\u7528\u6237\u4e0d\u4f1a\u81ea\u52a8\u5bfc\u5165\uff1b\u7b2c\u4e00\u6b21\u542f\u7528 MiniMax Code \u63d0\u793a\u8bcd\u65f6\uff0c\u6587\u4ef6\u5185\u5bb9\u4f1a\u5148\u5b58\u6210\u4e00\u6761\u5907\u4efd\u63d0\u793a\u8bcd\uff0c\u4e0d\u4f1a\u4e22\u3002\r\n- \u7b2c\u4e00\u6b21\u7528\u91cf\u540c\u6b65\u4f1a\u5bfc\u5165 `local_runtime_token_usage` \u91cc\u7684\u5168\u90e8\u5386\u53f2\uff0c\u770b\u677f\u7684 MiniMax Code \u5408\u8ba1\u4f1a\u7acb\u5373\u5305\u542b\u8fc7\u53bb\u7684\u7528\u91cf\u3002\r\n- \u5df2\u6709\u7684 MCP \u670d\u52a1\u5668\u548c Skills \u5bf9 MiniMax Code \u9ed8\u8ba4\u662f\u5173\u95ed\u7684\uff0c\u624b\u52a8\u6253\u5f00\u4e4b\u524d\uff0cCC Switch \u4e0d\u4f1a\u5f80 `~/.minimax` \u5199\u4efb\u4f55\u4e1c\u897f\u3002\r\n\r\n### MiniMax Code \u7684\u6570\u636e\u76ee\u5f55\u53ea\u8ba4\u73af\u5883\u53d8\u91cf\r\n\r\nCC Switch \u4ece\u81ea\u5df1\u7684\u73af\u5883\u53d8\u91cf\u91cc\u4f9d\u6b21\u8bfb\u53d6 `MINIMAX_DATA_DIR`\u3001`MAVIS_DATA_DIR`\uff0c\u90fd\u6ca1\u6709\u65f6\u4f7f\u7528 `~/.minimax`\u3002\u8bbe\u7f6e\u91cc\u6ca1\u6709\u76ee\u5f55\u8986\u76d6\u9009\u9879\uff1b\u5982\u679c MiniMax Code \u7528\u7684\u662f\u81ea\u5b9a\u4e49\u76ee\u5f55\uff0c\u542f\u52a8 CC Switch \u65f6\u4e5f\u8981\u5e26\u4e0a\u540c\u4e00\u4e2a\u73af\u5883\u53d8\u91cf\u3002\r\n\r\n### \u9ed8\u8ba4\u6a21\u578b\u8981\u5728 MiniMax Code \u91cc\u6539\r\n\r\n\u8981\u5220\u9664\u6216\u505c\u7528\u6b63\u88ab `defaultModel` / `defaultLightModel` \u5f15\u7528\u7684\u4f9b\u5e94\u5546\u6216\u6a21\u578b\uff0c\u8bf7\u5148\u5728 MiniMax Code \u91cc\u6362\u4e00\u4e2a\u9ed8\u8ba4\u6a21\u578b\u3002MiniMax Code \u6b63\u6301\u6709\u914d\u7f6e\u9501\u65f6\uff0c\u4fdd\u5b58\u4f1a\u5931\u8d25\u5e76\u63d0\u793a\u91cd\u8bd5\uff0c\u4e0d\u4f1a\u4e00\u76f4\u7b49\u5f85\u3002\r\n\r\n### \u7ed1\u5b9a\u5df2\u5220\u9664 ChatGPT \u8d26\u53f7\u7684 Codex \u5361\u7247\u9700\u8981\u624b\u52a8\u91cd\u7ed1\u4e00\u6b21\r\n\r\n\u4e0d\u4f1a\u81ea\u52a8\u91cd\u7ed1\uff1a\u5728\u5361\u7247\u4e0a\u70b9\u300c\u9009\u62e9\u8d26\u53f7\u300d\uff0c\u9009\u65b0\u7684\u767b\u5f55\u5373\u53ef\u3002\u91cd\u7ed1\u4e4b\u524d\uff0c\u8fd9\u5f20\u5361\u65e0\u6cd5\u5f00\u542f Codex \u63a5\u7ba1\uff1b\u5982\u679c\u4e0a\u6b21\u9000\u51fa\u65f6\u63a5\u7ba1\u662f\u5f00\u7740\u7684\uff0c\u542f\u52a8\u6062\u590d\u4f1a\u56e0\u7ed1\u5b9a\u68c0\u67e5\u5931\u8d25\u800c\u5173\u6389 Codex \u63a5\u7ba1\uff0c`~/.codex/auth.json` \u4e0d\u52a8\u3002\u91cd\u7ed1\u540e\u518d\u91cd\u65b0\u5f00\u542f\u63a5\u7ba1\u3002\uff08[#7395](https://github.com/farion1231/cc-switch/pull/7395)\uff09\r\n\r\n### \u5df2\u7ecf\u88ab\u6e05\u7a7a\u7684 Codex API Key \u4e0d\u4f1a\u81ea\u52a8\u6062\u590d\r\n\r\n\u4fee\u590d\u53ea\u9632\u6b62\u4ee5\u540e\u518d\u88ab\u6e05\u7a7a\u3002\u5982\u679c\u67d0\u4e2a Codex \u4f9b\u5e94\u5546\u7684\u5bc6\u94a5\u5df2\u7ecf\u5728\u4e4b\u524d\u7684\u7f16\u8f91\u6216\u5207\u6362\u4e2d\u4e22\u4e86\uff0c\u8bf7\u91cd\u65b0\u586b\u4e00\u6b21\uff1b\u7528\u91cf\u811a\u672c\u5982\u679c\u56e0\u6b64\u88ab\u91cd\u7f6e\uff0c\u4e5f\u9700\u8981\u91cd\u65b0\u914d\u7f6e\u3002\uff08[#7434](https://github.com/farion1231/cc-switch/pull/7434)\uff09\r\n\r\n### \u300c\u9690\u85cf AI \u7f72\u540d\u300d\u9700\u8981\u91cd\u65b0\u52fe\u9009\u4e00\u6b21\r\n\r\n\u5f00\u5173\u73b0\u5728\u8981\u6c42 `attribution.sessionUrl` \u4e5f\u4e3a `false` \u624d\u7b97\u5f00\u542f\uff0c\u6309\u65e7\u683c\u5f0f `{commit: \"\", pr: \"\"}` \u4fdd\u5b58\u7684\u914d\u7f6e\u5347\u7ea7\u540e\u4f1a\u663e\u793a\u4e3a\u672a\u52fe\u9009\u3002\u91cd\u65b0\u52fe\u9009\u4e00\u6b21\u5c31\u4f1a\u8865\u4e0a `sessionUrl: false`\uff0c\u5df2\u6709\u914d\u7f6e\u4e0d\u4f1a\u88ab\u81ea\u52a8\u6539\u5199\u3002\uff08[#7053](https://github.com/farion1231/cc-switch/pull/7053)\uff09\r\n\r\n### \u6253\u5f00\u63d0\u793a\u8bcd\u5217\u8868\u65f6\u4f1a\u91c7\u7528 live \u6587\u4ef6\u7684\u5916\u90e8\u4fee\u6539\r\n\r\n\u5982\u679c\u67d0\u4e2a\u5e94\u7528\u7684 live \u63d0\u793a\u8bcd\u6587\u4ef6\uff08`CLAUDE.md`\u3001`AGENTS.md` \u7b49\uff09\u4e0e\u542f\u7528\u4e2d\u7684\u63d0\u793a\u8bcd\u5185\u5bb9\u4e0d\u540c\u4e14\u4e0d\u4e3a\u7a7a\uff0c\u6253\u5f00\u63d0\u793a\u8bcd\u5217\u8868\u65f6\u4f1a\u7528\u6587\u4ef6\u5185\u5bb9\u8986\u76d6\u6570\u636e\u5e93\u91cc\u4fdd\u5b58\u7684\u5185\u5bb9\u3002\u975e\u542f\u7528\u7684\u6a21\u677f\u4e0d\u53d7\u5f71\u54cd\uff0cPi \u4e0d\u5728\u6b64\u5217\u3002\uff08[#7194](https://github.com/farion1231/cc-switch/pull/7194)\uff09\r\n\r\n### \u63a8\u7406\u5f3a\u5ea6\u6309\u4f60\u9009\u7684\u6863\u4f4d\u53d1\u9001\r\n\r\n`gpt-5.6`\u3001`gpt-5.6-sol`\u3001`gpt-5.6-terra`\u3001`gpt-5.6-luna` \u4e0e `gpt-6-astra` \u4e0a\u7684 `/effort max` \u73b0\u5728\u771f\u6b63\u8bf7\u6c42 `max` \u6863\uff08[#7531](https://github.com/farion1231/cc-switch/pull/7531)\uff09\uff1b`/effort xhigh`\uff0c\u4ee5\u53ca\u6620\u5c04\u5230 `grok-4.6` / `grok-4.6-*` \u7684\u6a21\u578b\u4e0a\u7684\u4efb\u4f55\u6863\u4f4d\uff0c\u73b0\u5728\u90fd\u4f1a\u53d1\u9001\u63a8\u7406\u5f3a\u5ea6\uff0c\u4e4b\u524d\u662f\u4ec0\u4e48\u90fd\u4e0d\u53d1\uff08[#7318](https://github.com/farion1231/cc-switch/pull/7318)\uff09\u3002\u63a8\u7406 token \u7528\u91cf\u548c\u5ef6\u8fdf\u53ef\u80fd\u968f\u4e4b\u4e0a\u5347\u3002\r\n\r\n### \u90e8\u5206\u7ecf\u8f6c\u6362\u7684\u8bf7\u6c42\u5347\u7ea7\u540e\u4f1a\u6709\u4e00\u6b21\u524d\u7f00\u7f13\u5b58\u672a\u547d\u4e2d\r\n\r\n\u6709\u4e24\u7c7b\u8bf7\u6c42\u5728\u5347\u7ea7\u540e\u5b57\u8282\u4f1a\u53d8\u4e00\u6b21\uff0c\u4e4b\u540e\u4fdd\u6301\u7a33\u5b9a\uff1a\u4e00\u662f\u5bbd\u677e\u7684 Chat \u6216 Anthropic \u4e0a\u6e38\u4e0a\u3001\u5e26 `additional_tools` \u8f7d\u4f53\u7684 Codex \u8bf7\u6c42\uff08[#7454](https://github.com/farion1231/cc-switch/pull/7454)\uff09\uff0c`content: null` \u7684 system \u6d88\u606f\u6d88\u5931\uff0c\u8f7d\u4f53\u91cc\u7684\u5de5\u5177\u5e76\u5165 `tools`\uff1b\u4e8c\u662f\u6b64\u524d\u63a5\u53d7 `\"description\": null` \u7684\u5bbd\u677e\u4e0a\u6e38\u4e0a\u3001\u542b\u65e0\u63cf\u8ff0\u5de5\u5177\u7684\u8bf7\u6c42\uff08[#7319](https://github.com/farion1231/cc-switch/pull/7319)\u3001[#7378](https://github.com/farion1231/cc-switch/pull/7378)\uff09\u3002\u5e26\u63cf\u8ff0\u7684\u5de5\u5177\u5e8f\u5217\u5316\u7ed3\u679c\u4e0d\u53d8\u3002\r\n\r\n### `Ling-2.6-1T` \u73b0\u5728\u6309\u7eaf\u6587\u672c\u6a21\u578b\u5904\u7406\r\n\r\n\u8fd9\u5bf9\u6240\u6709\u4f7f\u7528\u8fd9\u4e2a id \u7684\u4f9b\u5e94\u5546\u751f\u6548\uff0c\u4e0d\u53ea\u662f\u9884\u8bbe\uff1a\u5f00\u542f\u4ee3\u7406\u7684\u5a92\u4f53\u56de\u9000\u65f6\uff0c\u53d1\u7ed9\u5b83\u7684\u56fe\u7247\u4f1a\u5728\u8bf7\u6c42\u4e0a\u6e38\u4e4b\u524d\u66ff\u6362\u6210 `[Unsupported Image]` \u6807\u8bb0\u3002\r\n\r\n### Claude Desktop \u5728 Linux \u4e0a\u65e0\u9700\u8fc1\u79fb\r\n\r\n\u5207\u5230\u4e00\u4e2a Claude Desktop \u4f9b\u5e94\u5546\u5e76\u91cd\u542f Claude Desktop \u5373\u53ef\uff0c\u4e0e\u5176\u4ed6\u5e73\u53f0\u76f8\u540c\u3002\u5982\u679c\u4f60\u81ea\u5df1\u6784\u5efa\u7684 Flatpak \u6743\u9650\u6bd4\u81ea\u5e26\u6e05\u5355\u66f4\u7a84\uff0c\u9700\u8981\u6388\u4e88 `xdg-config/Claude` \u4e0e `xdg-config/Claude-3p` \u7684\u8bfb\u5199\u6743\u9650\uff0c\u4f8b\u5982\uff08\u628a\u6700\u540e\u7684 app id \u6362\u6210\u4f60\u81ea\u5df1\u6784\u5efa\u7684\uff09\uff1a\r\n\r\n```bash\r\nflatpak override --user --filesystem=xdg-config/Claude --filesystem=xdg-config/Claude-3p com.ccswitch.desktop\r\n```\r\n\r\n### \u65e7\u7684\u65e0\u56fe\u6807 Pi \u4f9b\u5e94\u5546\u4ecd\u663e\u793a Pi \u56fe\u6807\r\n\r\n\u53ea\u6709\u4ece\u73b0\u5728\u8d77\u4fdd\u5b58\u7684\u4f9b\u5e94\u5546\u624d\u4f1a\u6539\u4e3a\u663e\u793a\u540d\u79f0\u9996\u5b57\u6bcd\u3002\u60f3\u66f4\u65b0\u65e7\u5361\u7247\uff0c\u5728\u8868\u5355\u91cc\u6539\u4e00\u4e0b\u56fe\u6807\u5373\u53ef\u3002\uff08[#6826](https://github.com/farion1231/cc-switch/pull/6826)\uff09\r\n\r\n### \u9884\u8bbe\u6539\u52a8\u53ea\u5f71\u54cd\u65b0\u5efa\u7684\u4f9b\u5e94\u5546\r\n\r\n\u5b58\u91cf\u5361\u7247\u4fdd\u5b58\u7684\u662f\u521b\u5efa\u65f6\u7684\u5feb\u7167\u3002\u672c\u7248\u6d89\u53ca\uff1a\r\n\r\n- **MiniMax \u56fd\u5185\u7ad9**\uff1a\u5b58\u91cf\u5361\u7247\u4ecd\u5728 `api.minimaxi.com`\uff0c\u7528\u91cf\u68c0\u6d4b\u3001Codex \u539f\u751f Responses \u76ee\u5f55\u4e0e `web_search` \u5f00\u5173\u90fd\u8fd8\u8ba4\u8fd9\u4e2a\u57df\u540d\uff0c\u53ef\u4ee5\u7ee7\u7eed\u4f7f\u7528\u3002\r\n- **\u767e\u7075**\uff1a\u5b58\u91cf\u5361\u7247\u4fdd\u7559 `api.tbox.cn`\uff0cCodex \u4ee5\u5916\u7684\u5e94\u7528\u8fd8\u505c\u5728 `Ling-2.5-1T`\u3002\u7f16\u8f91 Base URL \u548c\u6a21\u578b\uff0c\u6216\u91cd\u65b0\u6dfb\u52a0\u9884\u8bbe\u3002\r\n- **AICodeWith**\uff1a\u628a\u5b58\u91cf\u7684 Codex\u3001Hermes\u3001OpenClaw \u4e0e Pi \u5361\u7247\u624b\u52a8\u6539\u6210 `https://api.aicodewith.ai/v1`\u3002\r\n- **APIKEY.FUN**\uff1a\u5b58\u91cf\u5361\u7247\u4fdd\u7559 `api.apikey.fun`\u3002\r\n- **SudoCode.chat \u7684\u5907\u7528\u7aef\u70b9 `api.sudorelay.com`**\uff1a\u53ea\u5199\u8fdb\u65b0\u5efa\u7684 Claude Code\u3001Claude Desktop\u3001Codex \u4e0e Grok Build \u5361\u7247\uff1b\u5b58\u91cf\u5361\u7247\u53ef\u4ee5\u5728\u7aef\u70b9\u6d4b\u901f\u91cc\u628a\u5b83\u6dfb\u52a0\u4e3a\u81ea\u5b9a\u4e49\u7aef\u70b9\u3002\r\n- **Codex \u6a21\u578b\u76ee\u5f55**\uff1aKimi For Coding \u7684 K2.8 Preview \u884c\uff081M \u7a97\u53e3\uff0c`low` / `high` / `max`\uff09\u3001DeepSeek \u7684 `deepseek-flash` \u9ed8\u8ba4\u503c\u4e0e\u7eaf\u6587\u672c\u7684 `deepseek-v4-pro` \u884c\u3001\u6df7\u5143\u7684 `hy4-preview`\uff0c\u4ee5\u53ca\u5343\u95ee\u7684\u5f00\u6e90\u6743\u91cd\u6a21\u578b\u884c\u3002\u5728\u5361\u7247\u7684\u6a21\u578b\u76ee\u5f55\u91cc\u624b\u52a8\u6dfb\u52a0\uff0c\u6216\u91cd\u65b0\u6dfb\u52a0\u9884\u8bbe\u3002\r\n- **Claude Desktop \u7684 1M \u9009\u9879**\uff08DeepSeek\u3001OpenCode Go\u3001\u767e\u5ea6\u5343\u5e06 Token Plan \u9884\u8bbe\uff09\uff1a\u5728\u4f9b\u5e94\u5546\u7f16\u8f91\u5668\u91cc\u7ed9\u5bf9\u5e94\u8def\u7531\u52fe\u9009\u300c\u58f0\u660e\u652f\u6301 1M\u300d\uff0c\u6216\u91cd\u65b0\u6dfb\u52a0\u9884\u8bbe\u3002\r\n- **Kimi \u56fd\u9645\u7ad9**\uff1a\u5b58\u91cf Kimi \u5361\u7247\u4ecd\u662f\u56fd\u5185\u57df\u540d\uff08`api.moonshot.cn` / `api.kimi.com`\uff09\uff0c\u56fd\u9645\u7ad9 kimi.ai \u7684\u5bc6\u94a5\u8bf7\u4f7f\u7528\u65b0\u7684 Kimi Global / Kimi For Coding Global \u9884\u8bbe\u3002\r\n\r\n### Codex \u76ee\u5f55\u7c7b\u4fee\u590d\u5728\u4e0b\u4e00\u6b21\u5207\u6362\u4f9b\u5e94\u5546\u65f6\u751f\u6548\r\n\r\n`config.toml` \u4e0e\u76ee\u5f55\u6587\u4ef6\u5728\u5207\u6362\u4f9b\u5e94\u5546\u65f6\u91cd\u65b0\u751f\u6210\u3002\u672c\u7248\u6d89\u53ca\uff1aChat \u4e0a\u6e38\u7684\u5361\u7247\u4e0d\u518d\u58f0\u660e `supports_image_detail_original`\uff08[#7476](https://github.com/farion1231/cc-switch/pull/7476)\uff09\uff1b`stepfun.com`\u3001`stepfun.ai`\u3001`qianfan.baidubce.com`\u3001`xf-yun.com` \u4e0e `minimax.cn` \u4e0a\u7684\u539f\u751f Responses \u5361\u7247\u5199\u5165 `web_search = \"disabled\"`\uff1b`minimax.cn` \u4e0a\u7684\u5361\u7247\u4f7f\u7528\u539f\u751f Responses \u76ee\u5f55\uff1b`Ling-2.6-1T` \u58f0\u660e\u4e3a\u7eaf\u6587\u672c\u3002\u5728\u53d7\u5f71\u54cd\u7684\u5361\u7247\u4e0a\u5207\u8d70\u518d\u5207\u56de\u4e00\u6b21\u5373\u53ef\u3002\u4ee3\u7406\u4fa7\u628a `original` \u964d\u4e3a `auto` \u662f\u7acb\u5373\u751f\u6548\u7684\uff0c\u5df2\u7ecf\u88ab\u622a\u56fe\u5f04\u574f\u7684\u4f1a\u8bdd\u4e5f\u4e0d\u9700\u8981\u624b\u52a8\u7f16\u8f91\u5386\u53f2\u3002\r\n\r\n### \u5b9a\u4ef7\r\n\r\n- \u4e94\u4e2a\u65b0\u5b9a\u4ef7\u884c\u4ee5 `INSERT OR IGNORE` \u5199\u5165\uff08\u4f60\u81ea\u5df1\u5df2\u7ecf\u52a0\u8fc7\u7684\u540c\u540d\u884c\u4f1a\u4fdd\u7559\uff09\uff0c\u542f\u52a8\u65f6\u7684\u56de\u586b\u4f1a\u7ed9\u8fd9\u4e9b id \u4e0b\u6b64\u524d\u6309 $0 \u8bb0\u5f55\u7684\u5386\u53f2\u8bf7\u6c42\u8865\u4e0a\u8d39\u7528\uff1b\u5df2\u6709\u975e\u96f6\u8d39\u7528\u7684\u884c\u4e0d\u53d8\u3002\r\n- `deepseek-v4-pro` \u7684\u4fee\u590d\u53ea\u5728\u8be5\u884c\u4ecd\u6070\u597d\u662f v3.20.3 \u5199\u5165\u7684 0.3 / 1.2 / 0.006 / 0 \u65f6\uff0c\u624d\u6539\u56de 1.32 / 3.96 / 0.044\uff1b\u81ea\u5b9a\u4e49\u8fc7\u7684\u884c\u4e0d\u52a8\uff0c\u4f46\u624b\u52a8\u8bbe\u6210\u6070\u597d\u8fd9\u51e0\u4e2a\u503c\u7684\u884c\u65e0\u6cd5\u533a\u5206\uff0c\u4e5f\u4f1a\u88ab\u91cd\u7f6e\u3002v3.20.3 \u671f\u95f4\u8bb0\u5f55\u7684 V4 Pro \u8d39\u7528_\u4e0d\u4f1a_\u91cd\u7b97\uff0c\u56e0\u4e3a\u56de\u586b\u53ea\u5904\u7406\u8d39\u7528\u4e3a $0 \u6216\u66f4\u4f4e\u3001\u4e14\u6709 token \u7528\u91cf\u7684\u884c\uff0c\u6240\u4ee5\u53ea\u6709\u5347\u7ea7\u4e4b\u540e\u7684\u8bf7\u6c42\u6309\u6062\u590d\u540e\u7684\u4ef7\u683c\u8ba1\u8d39\u3002\r\n- Grok 4.7 \u6309 20 \u4e07 token \u4ee5\u4e0b\u7684\u57fa\u7840\u6863\u8ba1\u4ef7\uff1bxAI \u5bf9 20 \u4e07 token \u53ca\u4ee5\u4e0a\u7684\u63d0\u793a\u6309\u53cc\u500d\uff08$4 / $12\uff09\u8ba1\u8d39\uff0c\u5b9a\u4ef7\u8868\u4e0d\u533a\u5206\u8fd9\u4e00\u6863\u3002\r\n\r\n---\r\n\r\n## \u98ce\u9669\u63d0\u793a\r\n\r\n### \u6cbf\u7528\u7684\u63d0\u793a\r\n\r\n**xAI Grok OAuth \u767b\u5f55**\uff1a\u590d\u7528\u5b98\u65b9 Grok CLI \u7684\u516c\u5f00 OAuth \u5ba2\u6237\u7aef\u8eab\u4efd\uff0c\u4f7f\u7528\u53ef\u80fd\u5bfc\u81f4\u8d26\u53f7\u88ab\u9650\u5236\u6216\u5c01\u7981\u2014\u2014\u8be6\u89c1 [v3.18.0 release notes](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/release-notes/v3.18.0-zh.md#\u98ce\u9669\u63d0\u793a)\u3002\r\n\r\n**Codex OAuth \u53cd\u5411\u4ee3\u7406**\uff1a\u4f7f\u7528 ChatGPT \u8ba2\u9605\u7684 Codex OAuth \u53cd\u4ee3\u53ef\u80fd\u8fdd\u53cd OpenAI \u670d\u52a1\u6761\u6b3e\uff0c\u8be6\u60c5\u89c1 [v3.13.0 release notes](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/release-notes/v3.13.0-zh.md#\ufe0f-\u98ce\u9669\u63d0\u793a)\u3002\r\n\r\n**SuperGrok \u914d\u989d\u67e5\u8be2**\uff1a\u4f9b\u5e94\u5546\u5361\u7247\u7684\u914d\u989d\u5c55\u793a\u4f9d\u8d56 grok.com \u7684\u975e\u516c\u5f00\u8ba1\u8d39\u7aef\u70b9\uff0cxAI \u8c03\u6574\u63a5\u53e3\u540e\u53ef\u80fd\u5931\u6548\u2014\u2014\u8be6\u89c1 [v3.19.0 release notes](https://github.com/farion1231/cc-switch/blob/v3.20.4/docs/release-notes/v3.19.0-zh.md#\u98ce\u9669\u63d0\u793a)\u3002\r\n\r\n**\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u8def\u7531**\uff1a\u901a\u8fc7 CC Switch \u672c\u5730\u4ee3\u7406\u628a Codex\u3001Claude Desktop \u6216 Grok Build \u7684\u8bf7\u6c42\u8f6c\u6362\u5e76\u8f6c\u53d1\u5230\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u65f6\uff0c\u5404\u4f9b\u5e94\u5546\u5bf9\u8ba1\u8d39\u3001\u5408\u89c4\u4e0e\u6570\u636e\u7559\u5b58\u7684\u7ea6\u675f\u4e0d\u540c\uff0c\u8bf7\u5728\u4f7f\u7528\u524d\u9605\u8bfb\u76ee\u6807\u4f9b\u5e94\u5546\u7684\u670d\u52a1\u6761\u6b3e\u3002\r\n\r\n\u7528\u6237\u542f\u7528\u4e0a\u8ff0\u529f\u80fd\u5373\u8868\u793a\u81ea\u884c\u627f\u62c5\u76f8\u5173\u98ce\u9669\u3002CC Switch \u4e0d\u5bf9\u56e0\u4f7f\u7528\u8fd9\u4e9b\u529f\u80fd\u800c\u5bfc\u81f4\u7684\u4efb\u4f55\u8d26\u53f7\u9650\u5236\u3001\u8b66\u544a\u6216\u670d\u52a1\u6682\u505c\u627f\u62c5\u8d23\u4efb\u3002\r\n\r\n---\r\n\r\n## \u81f4\u8c22\r\n\r\n\u672c\u7248 46 \u4e2a\u63d0\u4ea4\u91cc\u6709 28 \u4e2a\u6765\u81ea 22 \u4f4d\u5916\u90e8\u8d21\u732e\u8005\uff0c\u5176\u4e2d 11 \u4f4d\u662f\u9996\u6b21\u6295\u7a3f\u3002\r\n\r\n### \u4ee3\u7801\u8d21\u732e\r\n\r\n- \u611f\u8c22 @SaladDay\uff1aMiniMax Code \u63a5\u5165\uff08[#7383](https://github.com/farion1231/cc-switch/pull/7383)\uff09\uff0c\u4ee5\u53ca\u7ed1\u5b9a\u5df2\u5220\u9664 ChatGPT \u8d26\u53f7\u7684 Codex \u5361\u7247\u7684\u6062\u590d\uff08[#7395](https://github.com/farion1231/cc-switch/pull/7395)\uff0c\u4fee\u590d [#7392](https://github.com/farion1231/cc-switch/issues/7392)\uff09\u3002\r\n- \u611f\u8c22 @thisTom\uff1aMiniMax Code \u5220\u9664\u4f9b\u5e94\u5546\u540e\u7684\u5361\u7247\u5237\u65b0\uff08[#7578](https://github.com/farion1231/cc-switch/pull/7578)\uff09\u3002\r\n- \u611f\u8c22 @Railgun-wiki\uff1aClaude Desktop \u7b2c\u4e09\u65b9\u914d\u7f6e\u7684 Linux \u652f\u6301\uff08[#7331](https://github.com/farion1231/cc-switch/pull/7331)\uff0c\u4fee\u590d [#4855](https://github.com/farion1231/cc-switch/issues/4855)\uff09\uff0c\u9996\u6b21\u6295\u7a3f\uff1b@vianrina \u5728 [#7389](https://github.com/farion1231/cc-switch/pull/7389) \u63d0\u4ea4\u8fc7\u540c\u4e00\u529f\u80fd\uff0c\u5176\u4e2d\u6d4b\u8bd5\u95e8