,"label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:fbe5b0145e43a95dac39722da60144b7c6be431914b886bfe7cde0a2fa3136e8","download_count":9960,"created_at":"2026-10-13T15:35:32Z","updated_at":"2026-10-13T15:35:32Z"}],"body":"# CC Switch v4.0.11\n\n\u672c\u7248\u672c\u4e3a\u5e94\u7528\u589e\u52a0\u4e86\u5378\u8f7d\u529f\u80fd\uff0c\u73b0\u5728\u4f60\u53ef\u4ee5\u5728\u300c\u5e94\u7528\u300d\u9875\u5b89\u88c5\u3001\u66f4\u65b0\u3001\u5378\u8f7d\u7f16\u7a0b\u5e94\u7528\u4e86\u3002\u5378\u8f7d\u524d\u786e\u8ba4\u6846\u4f1a\u5217\u51fa\u8981\u5378\u8f7d\u7684\u5b89\u88c5\u8def\u5f84\u548c\u5c06\u6267\u884c\u7684\u547d\u4ee4\uff0c\u53ea\u5378\u8f7d\u80fd\u786e\u8ba4\u6765\u6e90\u7684\u5b89\u88c5\uff0c\u914d\u7f6e\u548c\u4f1a\u8bdd\u6570\u636e\u90fd\u4fdd\u7559\uff1b\u83dc\u5355\u91cc\u53e6\u6709\u6309\u5b89\u88c5\u65b9\u5f0f\u5217\u51fa\u7684\u624b\u52a8\u5378\u8f7d\u547d\u4ee4\u3002\u6dfb\u52a0\u5957\u9910\u7c7b\u4f9b\u5e94\u5546\uff08Kimi\u3001\u667a\u8c31\u3001MiniMax \u7b49\uff09\u65f6\uff0c\u6240\u6709\u5e94\u7528\u90fd\u4f1a\u9ed8\u8ba4\u5f00\u542f\u5957\u9910\u989d\u5ea6\u67e5\u8be2\uff0c\u4e0d\u518d\u53ea\u9650 Claude Code\uff0c\u4e00\u952e\u5bfc\u5165\u94fe\u63a5\u4e5f\u4e00\u6837\u3002Codex \u7528\u91cf\u7edf\u8ba1\u4fee\u4e86\u4e24\u4e2a\u95ee\u9898\uff1a\u5206\u53c9\u51fa\u6765\u7684\u4f1a\u8bdd\u4e0d\u518d\u6bcf\u5206\u949f\u6574\u4efd\u91cd\u8bfb\u4e00\u904d\uff0cCodex \u684c\u9762\u7248\u957f\u4f1a\u8bdd\u7ffb\u9875\u540e\u5206\u51fa\u7684\u5b50\u4ee3\u7406\u7528\u91cf\u4e5f\u80fd\u7edf\u8ba1\u4e86\u3002\u53e6\u5916\u4fee\u590d\u4e86 Windows \u4e0a CC Switch \u81ea\u52a8\u66f4\u65b0\u91cd\u542f\u540e\u5b89\u88c5\u3001\u5347\u7ea7\u5de5\u5177\u627e\u4e0d\u5230 npm\uff0c\u5168\u5c4f\u9875\u9762\u6253\u5f00\u65f6\u95ea\u70c1\uff0c\u4ee5\u53ca Skills \u548c MCP \u6279\u91cf\u5f00\u5173\u5168\u90e8\u5931\u8d25\u65f6\u4ecd\u63d0\u793a\u6210\u529f\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.11-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.11-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**\u300c\u5e94\u7528\u300d\u9875\u53ef\u4ee5\u5378\u8f7d\u5df2\u5b89\u88c5\u7684\u5de5\u5177\u3002** \u6bcf\u4e2a\u5df2\u5b89\u88c5\u7684\u5de5\u5177\u65c1\u8fb9\u591a\u4e86\u300c\u5378\u8f7d\u300d\u6309\u94ae\u3002\u70b9\u51fb\u540e\u5148\u68c0\u67e5\u5f53\u524d\u4f7f\u7528\u7684\u662f\u54ea\u4e00\u5904\u5b89\u88c5\uff0c\u786e\u8ba4\u6846\u91cc\u5217\u51fa\u5c06\u5378\u8f7d\u7684\u5b89\u88c5\u8def\u5f84\u548c\u5c06\u6267\u884c\u7684\u547d\u4ee4\uff0c\u786e\u8ba4\u540e\u624d\u6267\u884c\uff1b\u6267\u884c\u524d\u4f1a\u91cd\u65b0\u68c0\u67e5\u4e00\u904d\uff0c\u5b89\u88c5\u60c5\u51b5\u6709\u53d8\u5316\u5c31\u4e0d\u6267\u884c\u3002\u53ea\u5378\u8f7d\u80fd\u786e\u8ba4\u6765\u6e90\u7684\u5b89\u88c5\uff1a\n\n- \u7528 npm \u5168\u5c40\u5b89\u88c5\u7684\uff08\u6838\u5bf9\u5305\u540d\u548c\u5b89\u88c5\u524d\u7f00\uff09\uff1b\n- \u7528 Homebrew \u5b89\u88c5\u7684 Claude Code\u3001Codex\uff08cask\uff09\u548c Gemini CLI\u3001OpenCode\uff08formula\uff09\uff0c\u5176\u4ed6 Homebrew \u5305\u4e00\u5f8b\u4e0d\u78b0\uff1b\n- \u7528\u5b98\u65b9\u5b89\u88c5\u811a\u672c\u5b89\u88c5\u7684 Claude Code\u3001Codex\u3001Grok Build\u3001OpenCode\uff0c\u53ea\u5220\u9664\u5f53\u524d\u4f7f\u7528\u7684\u90a3\u4e2a\u53ef\u6267\u884c\u6587\u4ef6\u548c\u5b83\u7684\u542f\u52a8\u5165\u53e3\uff0c\u4e0d\u5220\u9664\u76ee\u5f55\uff0cClaude Code \u7684\u5176\u4ed6\u65e7\u7248\u672c\u4ecd\u4f1a\u4fdd\u7559\uff1b\n- Hermes \u8c03\u7528\u5b83\u81ea\u5df1\u7684 `hermes uninstall --yes`\uff1bOpenClaw \u5148\u6267\u884c\u5b98\u65b9\u547d\u4ee4\u5378\u8f7d Gateway \u670d\u52a1\uff0c\u6210\u529f\u540e\u518d\u5378\u8f7d CLI\u3002\n- Windows \u4e0a\u88c5\u5728 WSL \u91cc\u7684\u5de5\u5177\u4f1a\u5728\u5bf9\u5e94\u53d1\u884c\u7248\u5185\u5378\u8f7d\uff0c\u548c\u7248\u672c\u68c0\u6d4b\u7528\u540c\u4e00\u4e2a shell\uff0c\u6240\u4ee5\u7528 nvm \u4e4b\u7c7b\u88c5\u7684\u5de5\u5177\u4e5f\u80fd\u627e\u5230\u3002\n\n\u914d\u7f6e\u548c\u4f1a\u8bdd\u6570\u636e\u90fd\u4fdd\u7559\uff1b\u6709\u591a\u5904\u5b89\u88c5\u65f6\u53ea\u5378\u8f7d\u5f53\u524d\u4f7f\u7528\u7684\u90a3\u4e00\u5904\uff0c\u5176\u4ed6\u7684\u4fdd\u7559\u3002\u8ba4\u4e0d\u51fa\u6765\u6e90\u7684\u5b89\u88c5\u4e0d\u4f1a\u81ea\u52a8\u5378\u8f7d\uff0c\u4f1a\u63d0\u793a\u6539\u7528\u624b\u52a8\u547d\u4ee4\u3002\u300c\u5e94\u7528\u300d\u9875\u83dc\u5355\u91cc\u65b0\u589e\u300c\u624b\u52a8\u5378\u8f7d\u547d\u4ee4\u300d\uff0c\u6309\u5b89\u88c5\u65b9\u5f0f\uff08npm\u3001pnpm\u3001Bun\u3001Homebrew \u7b49\uff09\u548c\u8fd0\u884c\u73af\u5883\u5217\u51fa\u5404\u5de5\u5177\u7684\u5378\u8f7d\u547d\u4ee4\uff0c\u53ef\u4ee5\u590d\u5236\u5230\u7ec8\u7aef\u6267\u884c\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e StreamLake \u56fd\u5185\u7ad9\u3001AIComing\u3001SoruxGPT Coding Plan\u3001GrooRoute Pro\uff1b\u4fee\u6b63 StreamLake \u56fd\u9645\u7ad9 OpenCode\u3001OpenClaw\u3001Pi \u9884\u8bbe\u7684\u5730\u5740\uff1bAIGoCode \u6539\u7528\u65b0\u57df\u540d\u3002\n\n## \u6539\u8fdb\n\n**\u5957\u9910\u989d\u5ea6\u67e5\u8be2\u5728\u6240\u6709\u5e94\u7528\u91cc\u9ed8\u8ba4\u5f00\u542f\u3002** \u6dfb\u52a0\u5730\u5740\u5c5e\u4e8e\u5957\u9910\u7684\u4f9b\u5e94\u5546\uff08Kimi\u3001\u667a\u8c31\u3001MiniMax\u3001\u706b\u5c71\u5f15\u64ce\u3001OpenCode Go\u3001Command Code\uff09\u65f6\uff0c\u4ee5\u524d\u53ea\u6709 Claude Code \u9ed8\u8ba4\u5f00\u542f\u5957\u9910\u989d\u5ea6\u67e5\u8be2\uff0cCodex\u3001OpenCode\u3001Pi\u3001Hermes \u7b49\u5e94\u7528\u8981\u518d\u624b\u52a8\u6253\u5f00\u4e00\u6b21\u3002\u73b0\u5728\u6240\u6709\u5e94\u7528\u90fd\u9ed8\u8ba4\u5f00\u542f\u3002\u4e00\u952e\u5bfc\u5165\u94fe\u63a5\u4e5f\u4e00\u6837\uff1a\u94fe\u63a5\u6ca1\u5e26\u7528\u91cf\u67e5\u8be2\u811a\u672c\u3001\u5730\u5740\u5c5e\u4e8e\u5957\u9910\u65f6\uff0c\u5bfc\u5165\u540e\u9ed8\u8ba4\u5f00\u542f\uff0c\u786e\u8ba4\u6846\u91cc\u4f1a\u5199\u660e\u300c\u5957\u9910\u989d\u5ea6\uff1aKimi For Coding\u300d\u8fd9\u6837\u7684\u5957\u9910\u540d\uff1b\u94fe\u63a5\u5199\u4e86 `usageEnabled=false` \u65f6\u4ecd\u7136\u5173\u95ed\u3002ZenMux \u4ecd\u53ea\u5728 Claude Code \u91cc\u9ed8\u8ba4\u5f00\u542f\u3002\u5df2\u7ecf\u6dfb\u52a0\u7684\u4f9b\u5e94\u5546\u4e0d\u53d7\u5f71\u54cd\u3002\n\n**\u5168\u5c4f\u9875\u9762\u4e0d\u518d\u6de1\u5165\u6de1\u51fa\u3002** v4.0.10 \u53bb\u6389\u4e86\u6dfb\u52a0\u3001\u7f16\u8f91\u4f9b\u5e94\u5546\u9875\u9762\u7684\u6de1\u5165\u6de1\u51fa\uff0c\u4f46\u300c\u65b0\u589e\u5b9a\u4ef7\u300d\u300c\u914d\u7f6e\u7528\u91cf\u67e5\u8be2\u300d\u300c\u8bf7\u6c42\u5730\u5740\u7ba1\u7406\u300d\u3001\u7edf\u4e00\u4f9b\u5e94\u5546\u3001\u5de5\u4f5c\u533a\u6587\u4ef6\u7b49\u9875\u9762\u5728 Windows \u4e0a\u6253\u5f00\u65f6\u4ecd\u4f1a\u95ea\u4e00\u4e0b\u3002\u73b0\u5728\u6240\u6709\u5168\u5c4f\u9875\u9762\u90fd\u4e0d\u518d\u6de1\u5165\u6de1\u51fa\uff0cmacOS \u548c Linux \u4e0a\u4e5f\u4e00\u6837\uff1b\u6388\u6743\u4e2d\u5fc3\u4ece\u53f3\u4fa7\u6ed1\u5165\u7684\u52a8\u753b\u4fdd\u7559\u3002\u5de5\u4f5c\u533a\u6587\u4ef6\u548c\u6bcf\u65e5\u8bb0\u5fc6\u4f1a\u5728\u5185\u5bb9\u8bfb\u5b8c\u540e\u518d\u6253\u5f00\u7f16\u8f91\u9875\uff0c\u4e0d\u518d\u5148\u95ea\u51fa\u52a0\u8f7d\u9875\u3002\n\n## \u4fee\u590d\n\n- **Windows \u4e0a CC Switch \u81ea\u52a8\u66f4\u65b0\u91cd\u542f\u540e\uff0c\u5b89\u88c5\u3001\u5347\u7ea7\u5de5\u5177\u65f6\u627e\u4e0d\u5230 npm**\uff08[#8171](https://github.com/farion1231/cc-switch/issues/8171)\uff09\u3002\u5b89\u88c5\u5305\u66f4\u65b0\u540e\u81ea\u52a8\u91cd\u542f\u7684 CC Switch \u62ff\u4e0d\u5230\u5b8c\u6574\u7684\u7528\u6237 PATH\u3002\u7248\u672c\u68c0\u6d4b\u4ee5\u524d\u5df2\u7ecf\u4ece\u6ce8\u518c\u8868\u8865\u56de\u4e86 PATH\uff0c\u6240\u4ee5\u663e\u793a\u5de5\u5177\u5df2\u5b89\u88c5\uff1b\u4f46\u6267\u884c\u5b89\u88c5\u3001\u5347\u7ea7\u547d\u4ee4\u65f6\u7528\u7684\u4ecd\u662f\u6b8b\u7f3a\u7684 PATH\uff0c\u4e8e\u662f\u627e\u4e0d\u5230 npm\u3002\u73b0\u5728\u6267\u884c\u547d\u4ee4\u65f6\u4e5f\u7528\u8865\u5168\u540e\u7684 PATH\uff0c\u5378\u8f7d\u540c\u6837\u53d7\u76ca\u3002\n- **Codex \u5206\u53c9\u51fa\u6765\u7684\u4f1a\u8bdd\u6bcf\u5206\u949f\u88ab\u6574\u4efd\u91cd\u8bfb\u4e00\u904d**\uff08[#8217](https://github.com/farion1231/cc-switch/issues/8217)\u3001[#8209](https://github.com/farion1231/cc-switch/issues/8209)\uff09\u3002\u5b50\u4ee3\u7406\u4f1a\u8bdd\u3001\u300c\u5206\u652f\u5230\u65b0\u804a\u5929\u300d\u6216\u56de\u9000\u4ea7\u751f\u7684\u5206\u53c9\u4f1a\u8bdd\uff0c\u5982\u679c\u7236\u4f1a\u8bdd\u8fd8\u6ca1\u5199\u5230\u5206\u53c9\u65f6\u523b\uff0c\u7528\u91cf\u5bfc\u5165\u4f1a\u5148\u8df3\u8fc7\u3001\u7a0d\u540e\u518d\u8bd5\u3002\u4ece v3.18 \u8d77\uff0c\u6bcf 60 \u79d2\u4e00\u6b21\u7684\u540c\u6b65\u90fd\u4f1a\u628a\u8fd9\u4e9b\u4f1a\u8bdd\u6574\u4efd\u91cd\u65b0\u8bfb\u4e00\u904d\uff0c\u518d\u5728\u65e5\u5fd7\u91cc\u5199\u4e00\u6761\u8b66\u544a\uff1b\u5206\u53c9\u4f1a\u8bdd\u591a\u7684\u7528\u6237\u7d2f\u8ba1\u8bfb\u76d8\u53ef\u8fbe\u6570 TB\uff0c\u65e5\u5fd7\u5f88\u5feb\u6da8\u5230\u8f6e\u8f6c\u4e0a\u9650\u3002\u73b0\u5728\u4f1a\u8bb0\u4e0b\u5b50\u4f1a\u8bdd\u548c\u7236\u4f1a\u8bdd\u6587\u4ef6\u7684\u72b6\u6001\uff0c\u6587\u4ef6\u6ca1\u53d8\u5c31\u76f4\u63a5\u8df3\u8fc7\uff0c\u6709\u53d8\u5316\u624d\u91cd\u8bd5\u3002\u8ba1\u8d39\u89c4\u5219\u4e0d\u53d8\uff1a\u7236\u4f1a\u8bdd\u4e00\u76f4\u6ca1\u5199\u5230\u5206\u53c9\u65f6\u523b\uff08\u4f8b\u5982\u95f2\u7f6e\u5f88\u4e45\u4e4b\u540e\u624d\u5206\u53c9\uff09\u7684\u4f1a\u8bdd\uff0c\u7528\u91cf\u4ecd\u4e0d\u8ba1\u5165\uff0c\u8fd9\u4e2a\u53e3\u5f84\u8fd8\u5728\u8ba8\u8bba\u4e2d\uff08[#5687](https://github.com/farion1231/cc-switch/issues/5687)\uff09\u3002\n- **Codex \u684c\u9762\u7248\u957f\u4f1a\u8bdd\u7ffb\u9875\u540e\uff0c\u5206\u51fa\u7684\u5b50\u4ee3\u7406\u7528\u91cf\u5168\u90e8\u4e22\u5931**\uff08[#7084](https://github.com/farion1231/cc-switch/issues/7084)\u3001[#8210](https://github.com/farion1231/cc-switch/issues/8210)\uff09\u3002Codex \u684c\u9762\u7248\u628a\u957f\u4f1a\u8bdd\u5206\u9875\u4fdd\u5b58\uff0c\u7b2c\u4e00\u9875\u5199\u6ee1\u540e\u7eed\u5199\u5230\u65b0\u6587\u4ef6\uff0cCC Switch \u4ee5\u524d\u53ea\u627e\u5f97\u5230\u7b2c\u4e00\u9875\uff0c\u7ffb\u9875\u4e4b\u540e\u5206\u51fa\u7684\u5b50\u4ee3\u7406\u5c31\u4e00\u76f4\u88ab\u5224\u4e3a\u300c\u7236\u4f1a\u8bdd\u8fd8\u6ca1\u5199\u5230\u5206\u53c9\u65f6\u523b\u300d\uff0c\u7528\u91cf\u4ece v3.20.1 \u8d77\u4e00\u76f4\u6ca1\u7edf\u8ba1\u3002\u73b0\u5728\u4f1a\u628a\u540c\u4e00\u4f1a\u8bdd\u7684\u5404\u9875\u6309\u987a\u5e8f\u62fc\u8d77\u6765\u518d\u5224\u65ad\u3002\u8fd9\u4e9b\u5b50\u4ee3\u7406\u4f1a\u8bdd\u4ee5\u524d\u6ca1\u88ab\u5bfc\u5165\u8fc7\uff0c\u5347\u7ea7\u540e\u4e0b\u4e00\u8f6e\u540c\u6b65\u4f1a\u81ea\u52a8\u8865\u4e0a\uff0c\u53ea\u8981\u4f1a\u8bdd\u6587\u4ef6\u8fd8\u5728\u3002\u5206\u53c9\u7ebf\u7a0b\u81ea\u5df1\u7ffb\u9875\u4e4b\u540e\u7684\u7eed\u5199\u9875\u4ecd\u7136\u7edf\u8ba1\u4e0d\u5230\uff0c\u4f1a\u5728\u540e\u7eed\u7248\u672c\u5904\u7406\uff08[#8161](https://github.com/farion1231/cc-switch/issues/8161)\uff09\u3002\n- **Skills \u548c MCP \u6279\u91cf\u542f\u7528\u3001\u505c\u7528\u5168\u90e8\u5931\u8d25\u65f6\u4ecd\u63d0\u793a\u6210\u529f\u3002** \u73b0\u5728\u5168\u90e8\u5931\u8d25\u65f6\u663e\u793a\u7ea2\u8272\u9519\u8bef\u63d0\u793a\uff0c\u90e8\u5206\u5931\u8d25\u65f6\u663e\u793a\u8b66\u544a\uff1b\u64a4\u9500\u4e5f\u6309\u5b9e\u9645\u7ed3\u679c\u63d0\u793a\uff0c\u4e0d\u518d\u603b\u662f\u663e\u793a\u300c\u5df2\u64a4\u9500\u300d\u3002\n- **\u5de5\u4f5c\u533a\u7f16\u8f91\u5668\u53ef\u80fd\u628a\u4e0a\u4e00\u4e2a\u6587\u4ef6\u7684\u5185\u5bb9\u5b58\u8fdb\u5f53\u524d\u6587\u4ef6\u3002** \u6253\u5f00\u4e00\u4e2a\u6587\u4ef6\u518d\u5173\u6389\u3001\u63a5\u7740\u6253\u5f00\u53e6\u4e00\u4e2a\u6587\u4ef6\u65f6\uff0c\u5982\u679c\u540e\u8005\u8bfb\u53d6\u5931\u8d25\uff0c\u7f16\u8f91\u9875\u4f1a\u5728\u65b0\u6587\u4ef6\u540d\u4e0b\u7ee7\u7eed\u663e\u793a\u524d\u4e00\u4e2a\u6587\u4ef6\u7684\u5185\u5bb9\uff0c\u8fd9\u65f6\u70b9\u4fdd\u5b58\u5c31\u4f1a\u8986\u76d6\u65b0\u6587\u4ef6\u3002\u73b0\u5728\u8bfb\u53d6\u5931\u8d25\u4f1a\u56de\u5230\u6587\u4ef6\u5217\u8868\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n- Codex \u5b50\u4ee3\u7406\u7528\u91cf\u7684\u8865\u5bfc\u5728\u5347\u7ea7\u540e\u7684\u4e0b\u4e00\u8f6e\u540c\u6b65\u4e2d\u81ea\u52a8\u8fdb\u884c\uff0c\u53ea\u6d89\u53ca\u4ee5\u524d\u56e0\u4e3a\u7236\u4f1a\u8bdd\u5206\u9875\u800c\u4e00\u76f4\u8df3\u8fc7\u7684\u5b50\u4f1a\u8bdd\uff0c\u4e0d\u4f1a\u91cd\u590d\u8ba1\u5165\u5df2\u7ecf\u5bfc\u5165\u8fc7\u7684\u7528\u91cf\u3002\n- \u5957\u9910\u989d\u5ea6\u9ed8\u8ba4\u5f00\u542f\u53ea\u5f71\u54cd\u65b0\u6dfb\u52a0\u548c\u65b0\u5bfc\u5165\u7684\u4f9b\u5e94\u5546\u3002\u5df2\u6709\u7684\u4f9b\u5e94\u5546\u8981\u5f00\u542f\uff0c\u5728\u5361\u7247\u4e0a\u70b9\u300c\u914d\u7f6e\u7528\u91cf\u67e5\u8be2\u300d\u9009\u62e9 Token Plan \u6a21\u677f\u5373\u53ef\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @funkpopo\uff08\u300c\u5e94\u7528\u300d\u9875\u5378\u8f7d\u3001Windows \u81ea\u52a8\u66f4\u65b0\u540e\u627e\u4e0d\u5230 npm\uff09\u3001@NestorRay\uff08\u5168\u5c4f\u9875\u9762\u95ea\u70c1\u3001\u5de5\u4f5c\u533a\u7f16\u8f91\u5668\u8bfb\u53d6\uff09\u3001@Carl723000\uff08Codex \u5206\u53c9\u4f1a\u8bdd\u6bcf\u5206\u949f\u91cd\u8bfb\uff09\u3001@Lingbou\uff08Codex \u5206\u9875\u4f1a\u8bdd\u62fc\u63a5\uff0c\u5e76\u62a5\u544a\u4e86\u91cd\u8bfb\u544a\u8b66\u5237\u5c4f\u548c\u5206\u9875\u7d22\u5f15\u7f3a\u5931\uff09\u3001@jgwy\uff08\u6700\u65e9\u62a5\u544a\u5e76\u5b9e\u73b0\u4e86\u5206\u9875\u4f1a\u8bdd\u62fc\u63a5\uff09\u3001@xue-ding-e\uff08Skills \u6279\u91cf\u5f00\u5173\u5931\u8d25\u63d0\u793