","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:9e473f816b8ca14c025e6e913fbf489415bdc9f88acc0b34468415decc3fa1f3","download_count":8658,"created_at":"2026-10-15T16:32:14Z","updated_at":"2026-10-15T16:32:14Z"}],"body":"# CC Switch v4.0.13\n\n\u672c\u7248\u672c\u8ba9 Claude Desktop \u548c Claude Code\u3001Codex \u4e00\u6837\uff0c\u53ef\u4ee5\u5728\u9875\u9762\u9876\u90e8\u9009\u62e9\u76f4\u8fde\u3001\u8def\u7531\u3001\u805a\u5408\u4e09\u79cd\u6a21\u5f0f\uff1a\u8def\u7531\u6a21\u5f0f\u4e0b\u6a21\u578b\u5217\u8868\u8ddf\u7740\u8def\u7531\u90a3\u5bb6\u8d70\uff0c\u805a\u5408\u6a21\u5f0f\u4e0b\u53ef\u4ee5\u628a\u591a\u5bb6\u4f9b\u5e94\u5546\u7684\u6a21\u578b\u540c\u65f6\u653e\u8fdb Desktop \u7684\u6a21\u578b\u5217\u8868\u3002Codex \u65b0\u589e\u300c\u81ea\u52a8\u5ba1\u6279\u6a21\u578b\u300d\uff0c\u5f00\u4e86\u81ea\u52a8\u5ba1\u6279\uff08Approve for me\uff09\u7684\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u4e0d\u518d\u8bf7\u6c42\u4e00\u4e2a\u5927\u591a\u6570\u4e2d\u8f6c\u90fd\u6ca1\u6709\u7684\u6a21\u578b\u800c\u62a5 404\uff1b\u805a\u5408\u6a21\u5f0f\u4e0b\u8fd8\u53ef\u4ee5\u5355\u72ec\u6307\u5b9a\u5b50\u4ee3\u7406\u7528\u54ea\u4e2a\u6a21\u578b\u548c\u63a8\u7406\u5f3a\u5ea6\u3002\u5207\u56de\u76f4\u8fde\u524d\u6539\u4e3a\u5148\u5f39\u786e\u8ba4\u6846\uff0c\u5199\u660e\u4f1a\u8fde\u5230\u54ea\u5bb6\u3001\u6539\u54ea\u4e2a\u6587\u4ef6\u3002GPT \u7cfb\u5217\u6a21\u578b\u7684\u4e0a\u4e0b\u6587\u7a97\u53e3\u7edf\u4e00\u5c01\u9876 272K\uff0c\u4e0d\u518d\u56e0\u4e3a\u7a97\u53e3\u5199\u5927\u4e86\u800c\u8fdf\u8fdf\u4e0d\u538b\u7f29\u3001\u6700\u540e\u88ab\u4e0a\u6e38\u62d2\u7edd\u3002Windows \u4fbf\u643a\u7248\u7684\u66f4\u65b0\u6309\u94ae\u73b0\u5728\u76f4\u63a5\u4e0b\u8f7d\u5bf9\u5e94\u7684\u538b\u7f29\u5305\u3002Claude Code \u7684 Haiku \u6863\u4e5f\u80fd\u58f0\u660e 1M \u4e0a\u4e0b\u6587\uff0c\u6a21\u578b\u672c\u8eab\u662f 1M \u7a97\u53e3\u7684\u9884\u8bbe\u6539\u4e3a\u9ed8\u8ba4\u52fe\u4e0a 1M\u3002\u8fd8\u4fee\u590d\u4e86 Codex \u4fdd\u5b58\u914d\u7f6e\u65f6\u62a5\u300cduplicate key\u300d\u3001\u8def\u7531\u6a21\u5f0f\u4e0b Codex \u8fdc\u7a0b\u538b\u7f29\u5931\u6548\u3001\u88c5\u4e86\u5f88\u591a fnm \u7248\u672c\u65f6\u5207\u6362\u6a21\u5f0f\u5361\u4f4f\u51e0\u5206\u949f\u3001Windows 11 \u4e0a\u7a97\u53e3\u5361\u6b7b\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.13-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.13-ja.md)**\n\n---\n\n## \u65b0\u589e\n\n**Claude Desktop\uff1a\u76f4\u8fde\u3001\u8def\u7531\u3001\u805a\u5408\u4e09\u9009\u4e00\u3002** \u4ee5\u524d Claude Desktop \u7531\u6bcf\u5f20\u5361\u7247\u81ea\u5df1\u51b3\u5b9a\u662f\u76f4\u8fde\u8fd8\u662f\u8d70\u6a21\u578b\u6620\u5c04\uff0c\u8981\u4e0d\u8981\u542f\u52a8\u6620\u5c04\u670d\u52a1\u4e5f\u662f\u5355\u72ec\u7684\u5f00\u5173\u3002\u73b0\u5728\u5b83\u548c Claude Code\u3001Codex\u3001Gemini CLI\u3001Grok Build \u7528\u540c\u4e00\u5957\u6a21\u5f0f\u9762\u677f\uff0c\u5728\u9875\u9762\u9876\u90e8\u9009\u62e9\uff1a\n\n- **\u76f4\u8fde**\uff1a\u628a\u4f9b\u5e94\u5546\u7684\u5730\u5740\u548c Key \u76f4\u63a5\u5199\u8fdb Desktop \u7684\u914d\u7f6e\uff0c\u8bf7\u6c42\u4e0d\u7ecf\u8fc7 CC Switch\u3002\u9700\u8981\u6a21\u578b\u6620\u5c04\u7684\u5361\u7247\u4e0d\u80fd\u76f4\u8fde\uff0c\u4f1a\u63d0\u793a\u5148\u5f00\u59cb\u8def\u7531\u3002\n- **\u8def\u7531**\uff1aDesktop \u7684\u8bf7\u6c42\u7ecf\u672c\u673a CC Switch \u8f6c\u53d1\u7ed9\u8def\u7531\u90a3\u5bb6\uff0c\u6a21\u578b\u5217\u8868\u6362\u6210\u8def\u7531\u90a3\u5bb6\u6620\u5c04\u8868\u91cc\u7684\u6a21\u578b\u3002\u4e4b\u540e\u5207\u6362\u8def\u7531\u90a3\u5bb6\u65f6\uff0c\u53ea\u6709\u6a21\u578b\u5217\u8868\u53d8\u4e86\u624d\u4f1a\u6539\u5199 Desktop \u7684\u914d\u7f6e\u6587\u4ef6\u3002\n- **\u805a\u5408**\uff1a\u9ed8\u8ba4\u90a3\u5bb6\u7684\u6a21\u578b\u6392\u5728\u524d\u9762\uff0c\u5176\u4ed6\u52a0\u5165\u805a\u5408\u7684\u4f9b\u5e94\u5546\u7684\u6a21\u578b\u4ee5\u300c\u4f9b\u5e94\u5546 / \u6a21\u578b\u300d\u7684\u540d\u5b57\u4e00\u8d77\u51fa\u73b0\u5728 Desktop \u7684\u6a21\u578b\u5217\u8868\u91cc\uff0c\u9009\u54ea\u4e2a\u5c31\u53d1\u7ed9\u54ea\u5bb6\uff0c\u6700\u591a 200 \u4e2a\u3002\n\nDesktop \u53ea\u5728\u542f\u52a8\u65f6\u8bfb\u914d\u7f6e\uff0c\u6240\u4ee5\u6bcf\u6b21\u6362\u6a21\u5f0f\u3001\u6362\u8def\u7531\u90a3\u5bb6\u6216\u589e\u51cf\u805a\u5408\u6210\u5458\u4e4b\u540e\uff0c\u90fd\u8981\u91cd\u542f Desktop \u624d\u751f\u6548\uff0c\u754c\u9762\u4f1a\u9010\u4e00\u63d0\u793a\u3002Desktop \u7684\u8def\u7531\u6ca1\u6709\u6545\u969c\u8f6c\u79fb\uff1b\u9000\u51fa CC Switch \u65f6 Desktop \u7684\u914d\u7f6e\u4fdd\u6301\u4e0d\u53d8\uff0c\u8981\u7ee7\u7eed\u7528\u8def\u7531\u6216\u805a\u5408\uff0cCC Switch \u9700\u8981\u4fdd\u6301\u8fd0\u884c\u3002\u4ee5\u524d\u7528\u6a21\u578b\u6620\u5c04\u5361\u7684\uff0c\u5347\u7ea7\u540e\u4f1a\u81ea\u52a8\u8fdb\u5165\u8def\u7531\u6a21\u5f0f\uff0c\u89c1\u6587\u672b\u5347\u7ea7\u8bf4\u660e\u3002\n\n**Codex\uff1a\u81ea\u52a8\u5ba1\u6279\u53ef\u4ee5\u6362\u4e00\u4e2a\u6a21\u578b\u3002** Codex \u5f00\u4e86\u81ea\u52a8\u5ba1\u6279\uff08Approve for me\uff09\u540e\uff0c\u6bcf\u6b21\u6c99\u7bb1\u63d0\u6743\u90fd\u4f1a\u4ea4\u7ed9\u4e00\u4e2a\u5ba1\u6279\u6a21\u578b\u5224\u65ad\u80fd\u4e0d\u80fd\u653e\u884c\uff0c\u800c\u4e14\u53d1\u7ed9\u4e3b\u5bf9\u8bdd\u7684\u540c\u4e00\u5bb6\u3002\u7b2c\u4e09\u65b9\u5361\u7247\u4ee5\u524d\u6ca1\u6cd5\u9009\u8fd9\u4e2a\u6a21\u578b\uff1a\u6ca1\u6709\u6a21\u578b\u5217\u8868\u65f6\uff0cCodex \u4f1a\u5411\u4f9b\u5e94\u5546\u8bf7\u6c42\u5b98\u65b9\u7684 `codex-auto-review`\uff0c\u5927\u591a\u6570\u4e2d\u8f6c\u90fd\u4e0d\u8ba4\uff0c\u76f4\u63a5\u62a5 404\uff1b\u6709\u6a21\u578b\u5217\u8868\u65f6\u5219\u7531\u4e3b\u6a21\u578b\u81ea\u5df1\u5ba1\u6279\uff08[#8015](https://github.com/farion1231/cc-switch/issues/8015)\u3001[#5903](https://github.com/farion1231/cc-switch/issues/5903)\u3001[#3855](https://github.com/farion1231/cc-switch/issues/3855)\uff09\u3002\n\n- \u76f4\u8fde\u548c\u8def\u7531\uff1aCodex \u5361\u7247\u65b0\u589e\u300c\u81ea\u52a8\u5ba1\u6279\u6a21\u578b\u300d\uff0c\u53ef\u4ee5\u4ece\u8fd9\u5f20\u5361\u7684\u6a21\u578b\u5217\u8868\u91cc\u9009\u4e00\u4e2a\u3002\u5b98\u65b9\u5361\u7247\u4e0d\u663e\u793a\u8fd9\u4e00\u9879\uff1b\u5361\u7247\u6ca1\u6709\u6a21\u578b\u5217\u8868\u65f6\u8fd9\u4e00\u9879\u4e0d\u53ef\u9009\uff0c\u5e76\u8bf4\u660e\u539f\u56e0\u3002\n- \u805a\u5408\uff1a\u5728\u805a\u5408\u9875\u7b7e\u7684\u300c\u805a\u5408\u8bbe\u7f6e\u300d\u91cc\u9009\uff0c\u53ef\u4ee5\u9009\u805a\u5408\u91cc\u522b\u5bb6\u7684\u6a21\u578b\uff0c\u8ba9\u5ba1\u6279\u53d1\u7ed9\u53e6\u4e00\u5bb6\u4f9b\u5e94\u5546\u3002\n- \u6539\u5b8c\u9700\u8981\u91cd\u542f Codex\u3002\n\n**Codex \u805a\u5408\u6a21\u5f0f\uff1a\u5b50\u4ee3\u7406\u53ef\u4ee5\u7528\u5355\u72ec\u7684\u6a21\u578b\u3002** \u805a\u5408\u6a21\u5f0f\u4ee5\u524d\u4f1a\u53bb\u6389 `[agents]` \u91cc\u7684\u5b50\u4ee3\u7406\u6a21\u578b\uff0c\u5b50\u4ee3\u7406\u53ea\u80fd\u8ddf\u968f\u4e3b\u6a21\u578b\uff08[#8286](https://github.com/farion1231/cc-switch/issues/8286)\uff09\u3002\u73b0\u5728\u300c\u8ba9 Codex \u4f7f\u7528\u805a\u5408\u6a21\u5f0f\uff1f\u300d\u786e\u8ba4\u6846\u548c\u65b0\u7684\u300c\u805a\u5408\u8bbe\u7f6e\u300d\u91cc\u90fd\u53ef\u4ee5\u9009\u5b50\u4ee3\u7406\u6a21\u578b\u548c\u5b50\u4ee3\u7406\u63a8\u7406\u5f3a\u5ea6\u3002\u4e0d\u7528\u91cd\u542f Codex\uff0c\u65b0\u5f00\u7684\u5bf9\u8bdd\u5c31\u4f1a\u751f\u6548\u3002\u9009\u7684\u6a21\u578b\u5982\u679c\u5df2\u7ecf\u4e0d\u5728\u805a\u5408\u91cc\uff08\u6210\u5458\u88ab\u79fb\u9664\uff0c\u6216\u8005\u90a3\u5bb6\u6210\u4e86\u9ed8\u8ba4\uff09\uff0c\u5b50\u4ee3\u7406\u4f1a\u6682\u65f6\u8ddf\u968f\u4e3b\u6a21\u578b\uff0c\u52a0\u56de\u6765\u540e\u81ea\u52a8\u6062\u590d\u3002\n\n**Claude Code\uff1aHaiku \u6863\u4e5f\u80fd\u58f0\u660e 1M\u3002** \u4ee5\u524d\u300c\u6a21\u578b\u6620\u5c04\u300d\u91cc\u53ea\u6709 Sonnet\u3001Opus\u3001Fable \u548c\u5b50\u4ee3\u7406\u51e0\u884c\u80fd\u52fe\u300c\u58f0\u660e\u652f\u6301 1M\u300d\uff0c\u56e0\u4e3a\u8fc7\u53bb Haiku \u6a21\u578b\u90fd\u6ca1\u6709 1M \u7a97\u53e3\u3002\u73b0\u5728 Haiku \u6863\u5e38\u5e38\u6307\u5411\u7b2c\u4e09\u65b9\u6a21\u578b\uff0c\u800c Claude Code \u5bf9\u4e0d\u4ee5 `claude-` \u5f00\u5934\u7684\u6a21\u578b\u540d\u4e00\u5f8b\u6309 200K \u7a97\u53e3\u7b97\uff0c\u4e0d\u52fe\u5c31\u4f1a\u63d0\u524d\u538b\u7f29\u3002\u73b0\u5728\u6bcf\u4e00\u884c\u90fd\u80fd\u52fe 1M\u3002\u8def\u7531\u6a21\u5f0f\u4e0d\u53d7\u5f71\u54cd\uff1a\u8def\u7531\u7528\u7684 Haiku \u522b\u540d\u672c\u6765\u5c31\u6309 1M \u7b97\u3002\n\n**\u9884\u8bbe\uff1a** \u65b0\u589e TokenFactory\u3001Modelflare\u3002\n\n**Windows \u4fbf\u643a\u7248\uff1a\u66f4\u65b0\u6309\u94ae\u76f4\u63a5\u4e0b\u8f7d\u538b\u7f29\u5305\u3002** \u4fbf\u643a\u7248\u542f\u52a8\u65f6\u672c\u6765\u5c31\u4f1a\u68c0\u67e5\u66f4\u65b0\uff0c\u4f46\u70b9\u300c\u66f4\u65b0\u5230 vX\u300d\u53ea\u662f\u6253\u5f00\u53d1\u5e03\u9875\uff0c\u8981\u5728\u51e0\u5341\u4e2a\u6587\u4ef6\u91cc\u81ea\u5df1\u627e\u5bf9\u5e94\u7684\u538b\u7f29\u5305\uff08[#8300](https://github.com/farion1231/cc-switch/issues/8300)\uff09\u3002\u73b0\u5728\u4f1a\u76f4\u63a5\u4e0b\u8f7d\u4e0e\u5f53\u524d\u67b6\u6784\uff08x64 / ARM64\uff09\u5bf9\u5e94\u7684\u4fbf\u643a\u7248\u538b\u7f29\u5305\uff0c\u89e3\u538b\u540e\u8986\u76d6\u539f\u6765\u7684 `cc-switch.exe` \u5373\u53ef\uff1b\u914d\u7f6e\u548c\u6570\u636e\u4fdd\u5b58\u5728\u7528\u6237\u76ee\u5f55\u4e0b\u7684 `.cc-switch`\uff0c\u4e0d\u4f1a\u56e0\u8986\u76d6\u800c\u4e22\u5931\u3002\u4e3a\u4e86\u907f\u514d\u88ab\u6740\u6bd2\u8f6f\u4ef6\u62e6\u622a\uff0cCC Switch \u4e0d\u4f1a\u81ea\u5df1\u66ff\u6362\u81ea\u5df1\u7684\u7a0b\u5e8f\u6587\u4ef6\u3002\n\n## \u6539\u8fdb\n\n**\u5207\u56de\u76f4\u8fde\u524d\u5148\u786e\u8ba4\u3002** \u8fdb\u5165\u8def\u7531\u6216\u805a\u5408\u65f6\u672c\u6765\u5c31\u6709\u786e\u8ba4\u6846\uff0c\u5207\u56de\u76f4\u8fde\u5374\u662f\u70b9\u4e86\u7acb\u5373\u751f\u6548\uff0c\u53ea\u5728\u63d0\u793a\u91cc\u7ed9\u4e00\u4e2a\u5bb9\u6613\u9519\u8fc7\u7684\u300c\u64a4\u9500\u300d\u3002\u73b0\u5728\u300c\u56de\u5230\u76f4\u8fde\u300d\u6309\u94ae\u3001\u5361\u7247\u4e0a\u7684\u300c\u56de\u5230\u76f4\u8fde\u5e76\u4f7f\u7528\u300d\uff0c\u4ee5\u53ca\u8def\u7531\u670d\u52a1\u505c\u6b62\u65f6\u7684\u63d0\u793a\uff0c\u90fd\u4f1a\u5148\u5f39\u786e\u8ba4\u6846\uff0c\u5199\u660e\u5ba2\u6237\u7aef\u4f1a\u76f4\u63a5\u8fde\u63a5\u54ea\u5bb6\u3001\u54ea\u4e2a\u6587\u4ef6\u91cc\u7684\u5730\u5740\u548c\u5bc6\u94a5\u4f1a\u88ab\u6539\u56de\u53bb\uff1b\u4ece\u8def\u7531\u5207\u56de\u65f6\u8bf4\u660e\u8def\u7531\u76ee\u6807\u3001\u6545\u969c\u8f6c\u79fb\u961f\u5217\u548c\u8bbe\u7f6e\u90fd\u4f1a\u4fdd\u7559\uff0c\u4ece\u805a\u5408\u5207\u56de\u65f6\u8bf4\u660e\u54ea\u4e9b\u6a21\u578b\u4f1a\u4ece `/model` \u91cc\u6d88\u5931\u3002\u51fa\u9519\u76f4\u63a5\u663e\u793a\u5728\u786e\u8ba4\u6846\u91cc\uff0c\u300c\u64a4\u9500\u300d\u53bb\u6389\u4e86\u3002\n\n**Codex\uff1a\u300c\u805a\u5408\u6a21\u5f0f\u4e0b\u5b50 agent \u7528\u7ecf\u5178\u5de5\u5177\u300d\u9ed8\u8ba4\u6253\u5f00\u3002** \u4e3b\u4ee3\u7406\u548c\u5b50\u4ee3\u7406\u4e0d\u5728\u540c\u4e00\u5bb6\u65f6\uff0cCodex \u65b0\u7248\u7684\u5b50 agent \u5de5\u5177\u4f1a\u628a\u4efb\u52a1\u52a0\u5bc6\uff0c\u53ea\u6709\u4e3b\u4ee3\u7406\u90a3\u5bb6\u89e3\u5f97\u5f00\uff0c\u5b50\u4ee3\u7406\u6536\u4e0d\u5230\u4efb\u52a1\uff08[#8253](https://github.com/farion1231/cc-switch/issues/8253)\uff09\u3002\u8fd9\u4e2a\u5f00\u5173\u4ece\u8bbe\u7f6e\u9875\u632a\u8fdb\u300c\u805a\u5408\u8bbe\u7f6e\u300d\uff0c\u6539\u4e3a\u9ed8\u8ba4\u6253\u5f00\u3002\n\n**GPT \u6a21\u578b\u7684\u4e0a\u4e0b\u6587\u7a97\u53e3\u5c01\u9876 272K\u3002** models.dev \u4e0a GPT-5.6\u3001GPT-6 \u7cfb\u5217\u5199\u7684\u662f OpenAI API \u7684 105 \u4e07\u7a97\u53e3\uff0c\u4f46\u5f88\u591a\u4e2d\u8f6c\u662f\u7528 ChatGPT \u8ba2\u9605\u8f6c\u53d1\u7684\uff0c\u8ba2\u9605\u7684\u4e0a\u9650\u662f 272K\uff0c\u800c CC Switch \u4ece\u5730\u5740\u4e0a\u5206\u4e0d\u51fa\u662f\u54ea\u4e00\u79cd\u3002\u7a97\u53e3\u5199\u5927\u4e86\uff0c\u5ba2\u6237\u7aef\u4f1a\u4e00\u76f4\u4e0d\u538b\u7f29\uff0c\u76f4\u5230\u4e0a\u6e38\u62d2\u7edd\u8bf7\u6c42\u3001\u8fd9\u4e00\u8f6e\u76f4\u63a5\u5931\u8d25\uff1b\u5199\u5c0f\u4e86\u53ea\u662f\u65e9\u4e00\u70b9\u538b\u7f29\u3002\u73b0\u5728\u6dfb\u52a0\u4f9b\u5e94\u5546\u65f6\u81ea\u52a8\u8865\u5168\u7684 GPT \u7a97\u53e3\u4e00\u5f8b\u4e0d\u8d85\u8fc7 272K\uff0cHermes\u3001OpenClaw\u3001OpenCode\u3001Pi\u3001Codex \u9884\u8bbe\u91cc\u7684 GPT \u7a97\u53e3\u4e5f\u4e00\u8d77\u4e0b\u8c03\uff1bClaude Code \u91cc\u7528 ChatGPT \u8ba2\u9605\u7684\u300cCodex\u300d\u9884\u8bbe\u4ece 372K \u6539\u4e3a 272K\u3002\u6bd4 272K \u5c0f\u7684\u7a97\u53e3\u4e0d\u53d8\u3002\n\n**\u6a21\u578b\u672c\u8eab\u662f 1M \u7a97\u53e3\u7684\u9884\u8bbe\uff0c\u9ed8\u8ba4\u52fe\u4e0a 1M\u3002** Claude Code \u5bf9\u4e0d\u8ba4\u8bc6\u7684\u6a21\u578b\u540d\u6309 200K \u7a97\u53e3\u7b97\uff0cGLM-5.3\u3001Kimi K3\u3001DeepSeek V4\u3001Qwen3.8\u3001MiniMax-M3\u3001MiMo\u3001LongCat \u7b49 1M \u6a21\u578b\u7684 23 \u4e2a\u9884\u8bbe\u4ee5\u524d\u6ca1\u6709\u58f0\u660e\uff0c\u76f4\u8fde\u65f6\u5230 200K \u5de6\u53f3\u5c31\u5f00\u59cb\u81ea\u52a8\u538b\u7f29\u3002\u73b0\u5728\u8fd9\u4e9b\u9884\u8bbe\u91cc 1M \u6a21\u578b\u7684\u90a3\u51e0\u6863\u90fd\u9ed8\u8ba4\u52fe\u4e0a\u300c\u58f0\u660e\u652f\u6301 1M\u300d\uff1bKimi For Coding \u6709\u610f\u4fdd\u6301 256K \u7684\u538b\u7f29\u7a97\u53e3\uff0c\u4e0d\u53d8\u3002Claude Desktop \u91cc\u540c\u6837\u6a21\u578b\u7684 12 \u4e2a\u9884\u8bbe\uff0c\u4ee5\u53ca\u8f6c\u53d1 Claude Sonnet 5\u3001Opus 5 \u7684 50 \u4e2a\u9884\u8bbe\uff0c\u4e5f\u5728\u6a21\u578b\u5217\u8868\u91cc\u58f0\u660e 1M\uff1bClaude Haiku 4.x \u53ea\u6709 200K \u7a97\u53e3\uff0c\u4ee5\u524d\u88ab\u4e00\u4e9b\u9884\u8bbe\u8bef\u6807\u6210 1M\uff0c\u73b0\u5728\u6539\u6b63\u3002\n\n## \u4fee\u590d\n\n- **Codex \u4fdd\u5b58\u914d\u7f6e\u65f6\u62a5\u300cduplicate key custom in table model_providers\u300d**\uff08[#8271](https://github.com/farion1231/cc-switch/issues/8271)\uff09\u3002`config.toml` \u91cc\u4f9b\u5e94\u5546\u8868\u5934\u5e26\u5f15\u53f7\uff08`[model_providers.\"custom\"]`\uff09\u65f6\u8ba4\u4e0d\u51fa\u6765\uff0c\u4fdd\u5b58\u65f6\u53c8\u52a0\u4e86\u4e00\u5f20\u540c\u540d\u7684\u8868\u3002\u73b0\u5728\u53cc\u5f15\u53f7\u3001\u5355\u5f15\u53f7\u3001\u5e26\u7a7a\u683c\u7684\u5199\u6cd5\u90fd\u80fd\u8ba4\u51fa\u6765\u3002\n- **\u8def\u7531\u6216\u805a\u5408\u6a21\u5f0f\u4e0b\uff0cCodex \u7684\u8fdc\u7a0b\u538b\u7f29\u5931\u6548**\uff08[#8338](https://github.com/farion1231/cc-switch/issues/8338)\uff09\u3002\u8fdb\u5165\u8def\u7531\u6216\u805a\u5408\u3001\u4fdd\u5b58\u5f53\u524d\u4f9b\u5e94\u5546\u6216\u91cd\u542f CC Switch \u540e\uff0c\u4f9b\u5e94\u5546\u5f00\u7684\u8fdc\u7a0b\u538b\u7f29\u8bbe\u7f6e\u4f1a\u4e22\u6389\uff0cCodex \u6539\u7528\u672c\u5730\u6458\u8981\u538b\u7f29\uff0c\u5e26\u641c\u7d22\u8bb0\u5f55\u7684\u4f1a\u8bdd\u53ef\u80fd\u62a5 `response protection is unavailable`\u3002\u73b0\u5728\u4f1a\u4fdd\u7559\u8def\u7531\u90a3\u5bb6\u7684\u538b\u7f29\u8bbe\u7f6e\u3002\n- **\u7ecf\u8def\u7531\u8f6c\u6362 OpenAI Chat \u4e0a\u6e38\u65f6\uff0c\u56de\u590d\u7ed3\u675f\u540e\u8fd8\u53ef\u80fd\u518d\u6536\u5230\u4e00\u6761\u9519\u8bef**\uff08[#8281](https://github.com/farion1231/cc-switch/pull/8281)\uff09\u3002\u4e0a\u6e38\u53d1\u5b8c `[DONE]` \u540e\u65ad\u5f00\u8fde\u63a5\uff0cCC Switch \u4f1a\u5728\u6b63\u5e38\u7ed3\u675f\u4e4b\u540e\u518d\u8865\u4e00\u4e2a\u9519\u8bef\uff0c\u6216\u8005\u628a\u4e4b\u540e\u7684\u5185\u5bb9\u7ee7\u7eed\u8f6c\u53d1\u51fa\u53bb\u3002\u73b0\u5728\u6536\u5230 `[DONE]` \u5c31\u7ed3\u675f\u3002\n- **OpenCode \u4f1a\u8bdd\u7684\u8017\u65f6\u4e00\u76f4\u662f 0\u3001\u901