","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5826,"digest":"sha256:9807369cc2511f15732f740255cbc8dec2055a5b5694c3e0dd44a0cfa0a7b38a","download_count":12080,"created_at":"2026-10-12T16:38:24Z","updated_at":"2026-10-12T16:38:24Z"}],"body":"# CC Switch v4.0.10\n\n### 4.0 \u6b63\u5f0f\u7248\u7684\u7b2c\u516d\u4e2a\u4fee\u590d\u7248\u672c\n\n\u8fd9\u4e00\u7248\u7684\u91cd\u70b9\u662f\u4e00\u952e\u5bfc\u5165\u94fe\u63a5\uff08`ccswitch://` \u6df1\u5ea6\u94fe\u63a5\uff09\uff1aCC Switch \u6ca1\u5728\u8fd0\u884c\u65f6\u70b9\u94fe\u63a5\u4e0d\u4f1a\u518d\u4e22\uff1b\u94fe\u63a5\u53ef\u4ee5\u58f0\u660e\u63a5\u53e3\u683c\u5f0f\u3001\u5bfc\u5165 Pi \u4f9b\u5e94\u5546\u3001\u5e26\u4e0a\u7f51\u7ad9\u81ea\u5df1\u7684\u56fe\u6807\uff1bCodex \u548c Grok Build \u7684\u94fe\u63a5\u4fdd\u7559\u4f9b\u5e94\u5546\u81ea\u5e26\u7684\u914d\u7f6e\uff0c\u4e0d\u518d\u88ab\u6362\u6210\u56fa\u5b9a\u6a21\u677f\uff1b\u786e\u8ba4\u6846\u91cc\u53ef\u4ee5\u9009\u5bfc\u5165\u540e\u662f\u5426\u7acb\u5373\u5207\u6362\u3002\u540c\u65f6\u53d1\u5e03\u4e86\u4e2d\u3001\u82f1\u3001\u65e5\u4e09\u8bed\u7684\u7ad9\u957f\u63a5\u5165\u6307\u5357\u548c\u5728\u7ebf\u94fe\u63a5\u751f\u6210\u5668\u3002\u4f9b\u5e94\u5546\u56fe\u6807\u73b0\u5728\u53ef\u4ee5\u4e0a\u4f20\u672c\u5730\u56fe\u7247\uff0c\u5b58\u8fdb\u300c\u6211\u7684\u56fe\u6807\u300d\u540e\u6240\u6709\u4f9b\u5e94\u5546\u90fd\u80fd\u9009\u7528\uff1b\u7528\u91cf\u9875\u65b0\u589e\u9996\u5b57\u65f6\u95f4\uff0c\u6ca1\u5f00\u8def\u7531\u4e5f\u80fd\u6309\u4f1a\u8bdd\u65e5\u5fd7\u4f30\u7b97\u3002\u53e6\u5916\u4fee\u590d\u4e86\u8def\u7531\u6a21\u5f0f\u4e0b Claude Code \u7684 haiku \u6863\u8bf7\u6c42\u88ab\u8981\u6c42\u601d\u8003\u7684\u4e0a\u6e38\u62d2\u7edd\u3001v3.20 \u53ca\u66f4\u65e9\u7528\u5b98\u65b9\u8d26\u53f7\u8d70\u8def\u7531\u7559\u4e0b\u7684 Codex \u4f1a\u8bdd\u6253\u4e0d\u5f00\u3001Grok Build \u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u751f\u6210\u4e0d\u4e86\u4f1a\u8bdd\u6807\u9898\u7b49\u95ee\u9898\u30024.0 \u5b8c\u6574\u7684\u66f4\u65b0\u5185\u5bb9\u8bf7\u89c1 [v4.0 \u53d1\u5e03\u8bf4\u660e](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.4-zh.md)\u3002\n\n**[English \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.10-en.md) | [\u65e5\u672c\u8a9e\u7248 \u2192](https://github.com/farion1231/cc-switch/blob/main/docs/release-notes/v4.0.10-ja.md)**\n\n---\n\n## \u4e00\u952e\u5bfc\u5165\u94fe\u63a5\n\n### \u7528\u6237\u80fd\u611f\u53d7\u5230\u7684\u53d8\u5316\n\n- **CC Switch \u6ca1\u5728\u8fd0\u884c\u65f6\u70b9\u94fe\u63a5\uff0c\u4e0d\u4f1a\u518d\u4e22\u3002** \u4ee5\u524d\u5728 Windows \u548c Linux \u4e0a\uff0cCC Switch \u6ca1\u5f00\u7740\u65f6\u70b9\u4e00\u952e\u5bfc\u5165\u94fe\u63a5\uff0c\u5e94\u7528\u4f1a\u542f\u52a8\uff0c\u4f46\u5bfc\u5165\u786e\u8ba4\u6846\u4e0d\u51fa\u73b0\uff1b\u8f7b\u91cf\u6a21\u5f0f\u4e0b\u7a97\u53e3\u91cd\u5efa\u65f6\u4e5f\u4f1a\u4e22\u3002macOS \u4e0a\u540c\u4e00\u4e2a\u94fe\u63a5\u4f1a\u5f39\u4e24\u6b21\u786e\u8ba4\u6846\u3002\u73b0\u5728\u94fe\u63a5\u4f1a\u5148\u5b58\u4e0b\u6765\uff0c\u786e\u8ba4\u6846\u663e\u793a\u51fa\u6765\u4e4b\u540e\u624d\u7b97\u5904\u7406\u5b8c\uff0c\u4e2d\u9014\u88ab\u6253\u65ad\u4e5f\u4e0d\u4f1a\u4e22\uff0c\u540e\u5230\u7684\u65e7\u94fe\u63a5\u4e5f\u4e0d\u4f1a\u76d6\u6389\u65b0\u94fe\u63a5\u3002\n- **\u786e\u8ba4\u6846\u91cc\u53ef\u4ee5\u9009\u5bfc\u5165\u540e\u662f\u5426\u7acb\u5373\u5207\u6362\u3002** \u4f9b\u5e94\u5546\u94fe\u63a5\u7684\u786e\u8ba4\u6846\u65b0\u589e\u300c\u5bfc\u5165\u540e\u7acb\u5373\u5207\u6362\u5230\u8fd9\u4e2a\u4f9b\u5e94\u5546\u300d\u5f00\u5173\uff0c\u9ed8\u8ba4\u5173\u95ed\uff0c\u6253\u5f00\u65f6\u4f1a\u63d0\u793a\u5ba2\u6237\u7aef\u8bf7\u6c42\u5c06\u6539\u53d1\u5230\u94fe\u63a5\u91cc\u7684\u5730\u5740\u3002OpenCode\u3001OpenClaw\u3001Hermes\u3001MiniMax Code \u8fd9\u7c7b\u5171\u5b58\u5f0f\u5e94\u7528\u662f\u300c\u5bfc\u5165\u540e\u7acb\u5373\u6dfb\u52a0\u5230 OpenCode \u914d\u7f6e\u300d\u8fd9\u6837\u7684\u5f00\u5173\uff0cPi \u662f\u300c\u5bfc\u5165\u540e\u7acb\u5373\u5728 Pi \u4e2d\u542f\u7528\u300d\uff0c\u8fd9\u4e24\u7c7b\u9ed8\u8ba4\u6253\u5f00\uff1b\u63d0\u793a\u8bcd\u662f\u300c\u5bfc\u5165\u540e\u7acb\u5373\u542f\u7528\u300d\u3002\u94fe\u63a5\u91cc\u7684 `enabled` \u53ea\u51b3\u5b9a\u5f00\u5173\u7684\u521d\u59cb\u72b6\u6001\u3002\u5173\u6389\u5f00\u5173\u5c31\u53ea\u4fdd\u5b58\u4f9b\u5e94\u5546\uff0c\u4e0d\u6539\u5ba2\u6237\u7aef\u914d\u7f6e\uff0c\u5373\u4f7f\u8fd9\u662f\u8be5\u5e94\u7528\u7684\u7b2c\u4e00\u4e2a\u4f9b\u5e94\u5546\u3002\n- **\u5e26\u7528\u91cf\u67e5\u8be2\u811a\u672c\u7684\u94fe\u63a5\uff0c\u5bfc\u5165\u540e\u9ed8\u8ba4\u5f00\u542f\u7528\u91cf\u67e5\u8be2\u3002** \u7ad9\u957f\u5728\u94fe\u63a5\u91cc\u9644\u4e0a\u811a\u672c\uff0c\u5c31\u662f\u60f3\u8ba9\u4f60\u5bfc\u5165\u540e\u76f4\u63a5\u770b\u5230\u4f59\u989d\uff0c\u4ee5\u524d\u8fd8\u8981\u518d\u624b\u52a8\u6253\u5f00\u4e00\u6b21\u3002\u94fe\u63a5\u5199\u4e86 `usageEnabled=false` \u65f6\u4ecd\u7136\u5173\u95ed\uff1b\u4e0d\u5e26\u811a\u672c\u7684\u94fe\u63a5\u548c\u4ee5\u524d\u4e00\u6837\u3002\u811a\u672c\u5728\u6c99\u7bb1\u91cc\u8fd0\u884c\uff0c\u53ea\u80fd\u5411\u4f9b\u5e94\u5546\u5730\u5740\u7684\u540c\u6e90 HTTPS \u53d1\u4e00\u6b21\u8bf7\u6c42\uff0c\u786e\u8ba4\u6846\u91cc\u7167\u5e38\u5b8c\u6574\u663e\u793a\u811a\u672c\u5185\u5bb9\u3002\n- **Codex \u94fe\u63a5\u4fdd\u7559\u4f9b\u5e94\u5546\u81ea\u5e26\u7684\u914d\u7f6e\u3002** \u94fe\u63a5\u5e26\u5b8c\u6574 `config.toml` \u65f6\uff0c\u4ee5\u524d\u53ea\u53d6\u51fa Key\u3001\u5730\u5740\u548c\u6a21\u578b\uff0c\u518d\u5957\u8fdb\u56fa\u5b9a\u6a21\u677f\uff0c\u4f9b\u5e94\u5546\u7684\u8ba4\u8bc1\u65b9\u5f0f\u3001\u8bf7\u6c42\u5934\u3001WebSocket \u652f\u6301\u548c\u6a21\u578b\u76ee\u5f55\u5730\u5740\u90fd\u4f1a\u4e22\u3002\u73b0\u5728\u4fdd\u7559\u5176\u4e2d\u5c5e\u4e8e\u8fd9\u4e2a\u4f9b\u5e94\u5546\u7684\u90e8\u5206\uff1a\u8fde\u63a5\u548c\u8ba4\u8bc1\u5b57\u6bb5\u3001\u6a21\u578b\u3001\u63a8\u7406\u5f3a\u5ea6\u3001\u4e0a\u4e0b\u6587\u7a97\u53e3\u3001\u5b50\u4ee3\u7406\u6a21\u578b\u7b49\uff1b\u6a21\u578b\u76ee\u5f55\u5730\u5740\u53ea\u5728\u548c\u63a5\u53e3\u5730\u5740\u540c\u6e90\u65f6\u4fdd\u7559\uff0c\u56e0\u4e3a Codex \u62c9\u53d6\u5b83\u65f6\u4f1a\u5e26\u4e0a\u4f9b\u5e94\u5546\u7684\u51ed\u636e\u3002`[features]`\u3001MCP\u3001\u6743\u9650\u8fd9\u7c7b\u5168\u5c40\u8bbe\u7f6e\u4e0d\u5bfc\u5165\u3002\u4f1a\u8ba9 Codex \u6267\u884c\u547d\u4ee4\u6216\u8bfb\u53d6\u672c\u673a\u51ed\u636e\u7684\u4f9b\u5e94\u5546\u914d\u7f6e\uff08`auth`\u3001`aws`\u3001`gateway_oauth`\u3001`env_http_headers`\uff09\u6574\u6761\u62d2\u7edd\u3002\u4e0d\u5e26\u914d\u7f6e\u7684\u94fe\u63a5\u5bfc\u5165\u7ed3\u679c\u548c\u4ee5\u524d\u9010\u5b57\u4e00\u81f4\u3002\n- **Grok Build \u94fe\u63a5\u4fdd\u7559\u6a21\u578b\u914d\u7f6e\u3002** \u5e26 `config.toml` \u7684\u94fe\u63a5\u4ee5\u524d\u4e5f\u4f1a\u88ab\u6362\u6210\u56fa\u5b9a\u6a21\u677f\uff0c\u4e22\u6389\u663e\u793a\u540d\u3001\u8bf4\u660e\u3001\u63a5\u53e3\u7c7b\u578b\u548c\u4e0a\u4e0b\u6587\u7a97\u53e3\u3002\u73b0\u5728\u4fdd\u7559 `[models] default` \u6307\u5411\u7684\u90a3\u5f20\u6a21\u578b\u8868\uff0c\u5730\u5740\u3001Key \u548c\u6a21\u578b\u4ecd\u4ee5\u94fe\u63a5\u53c2\u6570\u4e3a\u51c6\uff1b\u7528\u5230 `auth_provider`\u3001`env_http_headers`\u3001`mtls_cert_dir` \u7684\u94fe\u63a5\u4f1a\u88ab\u62d2\u7edd\u3002\u4e00\u4e2a\u4f9b\u5e94\u5546\u5728 Grok Build \u91cc\u53ea\u5360\u4e00\u5f20\u8868\uff0c\u6240\u4ee5\u5176\u4ed6\u6a21\u578b\u8868\u4e0d\u5bfc\u5165\u3002\n- **\u4f1a\u88ab\u5c55\u5f00\u6267\u884c\u7684\u503c\u4e00\u5f8b\u62d2\u7edd\u3002** \u5171\u5b58\u5f0f\u5e94\u7528\u4f1a\u5c55\u5f00\u914d\u7f6e\u91cc\u7684\u4e00\u4e9b\u7279\u6b8a\u5199\u6cd5\uff1aPi \u91cc\u4ee5 `!` \u5f00\u5934\u7684\u503c\u4f1a\u88ab\u5f53\u6210\u547d\u4ee4\u6267\u884c\uff0c`$NAME` / `${NAME}` \u4f1a\u8bfb\u73af\u5883\u53d8\u91cf\uff1bOpenCode \u6709 `{env:}` / `{file:}`\uff1bOpenClaw \u548c Hermes \u6709 `${...}`\u3002\u94fe\u63a5\u91cc\u51fa\u73b0\u8fd9\u4e9b\u5199\u6cd5\u65f6\uff0c\u53ef\u80fd\u6267\u884c\u547d\u4ee4\uff0c\u6216\u8005\u628a\u672c\u673a\u7684\u5bc6\u94a5\u548c\u6587\u4ef6\u5185\u5bb9\u53d1\u5230\u94fe\u63a5\u91cc\u7684\u5730\u5740\u3002\u73b0\u5728\u89e3\u6790\u94fe\u63a5\u3001\u5408\u5e76\u914d\u7f6e\u548c\u751f\u6210\u4f9b\u5e94\u5546\u65f6\u90fd\u4f1a\u68c0\u67e5\uff0c\u53d1\u73b0\u5c31\u62d2\u7edd\u5bfc\u5165\u3002\n- **\u5176\u4ed6\uff1a** \u5e26 `configUrl` \u7684\u94fe\u63a5\u73b0\u5728\u4e00\u6253\u5f00\u5c31\u63d0\u793a\u4e0d\u652f\u6301\uff0c\u4e0d\u4f1a\u7b49\u4f60\u786e\u8ba4\u540e\u624d\u5931\u8d25\uff1b\u63d0\u793a\u8bcd\u94fe\u63a5\u652f\u6301 MiniMax Code\uff0cMCP \u94fe\u63a5\u652f\u6301 Pi \u548c MiniMax Code\uff1b\u5bfc\u5165\u4f9b\u5e94\u5546\u540e\u6258\u76d8\u83dc\u5355\u4f1a\u7acb\u5373\u5237\u65b0\u3002\n\n### \u7ad9\u957f\u80fd\u7528\u7684\u65b0\u53c2\u6570\n\n- **`apiFormat`\uff1a** \u4e00\u4e2a\u53c2\u6570\u58f0\u660e\u4e0a\u6e38\u7684\u63a5\u53e3\u683c\u5f0f\uff08`anthropic` / `openai_chat` / `openai_responses` / `gemini_native`\uff09\uff0cCC Switch \u4f1a\u6362\u6210\u5404\u5e94\u7528\u81ea\u5df1\u7684\u5b57\u6bb5\u3002Claude Code\u3001Codex\u3001Grok Build \u7684\u975e\u539f\u751f\u683c\u5f0f\u9700\u8981\u5f00\u542f\u672c\u5730\u8def\u7531\uff1b\u5e94\u7528\u4e0d\u652f\u6301\u7684\u7ec4\u5408\u5728\u89e3\u6790\u65f6\u5c31\u4f1a\u88ab\u62d2\u7edd\u3002\u4e0d\u5e26\u8fd9\u4e2a\u53c2\u6570\u7684\u94fe\u63a5\u884c\u4e3a\u4e0d\u53d8\u3002\n- **Pi \u4f9b\u5e94\u5546\u94fe\u63a5\uff1a** \u65b0\u589e\u652f\u6301\uff0c\u5bfc\u5165\u540e\u5199\u8fdb Pi \u7684 `models.json`\uff0c\u94fe\u63a5\u5fc5\u987b\u5e26\u6a21\u578b\u3002\n- **`iconUrl`\uff1a** \u586b\u7f51\u7ad9\u81ea\u5df1 logo \u7684 https \u5730\u5740\u3002\u786e\u8ba4\u6846\u6253\u5f00\u65f6\u5c31\u4e0b\u8f7d\u5e76\u663e\u793a\u5728\u9876\u90e8\uff0c\u5bfc\u5165\u540e\u4f5c\u4e3a\u5361\u7247\u7684\u81ea\u5b9a\u4e49\u56fe\u6807\uff1b\u4e0b\u8f7d\u5931\u8d25\u4e0d\u5f71\u54cd\u5bfc\u5165\uff0c\u5361\u7247\u9000\u56de\u5185\u7f6e\u56fe\u6807\u6216\u540d\u79f0\u9996\u5b57\u6bcd\u3002\u56fe\u7247\u4f1a\u91cd\u7ed8\u6210\u5c0f\u5c3a\u5bf8 PNG \u4fdd\u5b58\uff0c\u5730\u5740\u672c\u8eab\u4e0d\u4fdd\u5b58\u4e5f\u4e0d\u6e32\u67d3\u3002\u4e0b\u8f7d\u65f6\u53ea\u8fde\u516c\u7f51\u5730\u5740\uff0c\u5e76\u9501\u5b9a\u89e3\u6790\u7ed3\u679c\uff0c\u9632\u6b62\u7b2c\u4e8c\u6b21 DNS \u89e3\u6790\u6307\u5411\u522b\u5904\uff1b\u91cd\u5b9a\u5411\u9010\u8df3\u68c0\u67e5\uff0c\u6700\u591a 3 \u8df3\u3002\u4e0d\u8d70\u7cfb\u7edf\u4ee3\u7406\u3001\u4e0d\u5e26 Cookie\uff0c5 \u79d2\u8d85\u65f6\uff0c\u6700\u5927 256 KB\uff0c\u6587\u4ef6\u7c7b\u578b\u5fc5\u987b\u548c\u5185\u5bb9\u4e00\u81f4\u3002\n\n### \u7ad9\u957f\u63a5\u5165\u6307\u5357\u548c\u5728\u7ebf\u751f\u6210\u5668\n\n- **[\u7ad9\u957f\u63a5\u5165\u6307\u5357](https://github.com/farion1231/cc-switch/blob/main/docs/guides/deeplink-site-integration-guide-zh.md)**\uff08\u53e6\u6709 [English](https://github.com/farion1231/cc-switch/blob/main/docs/guides/deeplink-site-integration-guide-en.md)\u3001[\u65e5\u672c\u8a9e](https://github.com/farion1231/cc-switch/blob/main/docs/guides/deeplink-site-integration-guide-ja.md)\uff09\uff1a\u600e\u4e48\u751f\u6210\u94fe\u63a5\u3001\u600e\u4e48\u5728\u9875\u9762\u4e0a\u653e\u300c\u4e00\u952e\u5bfc\u5165\u300d\u6309\u94ae\uff08\u70b9\u6309\u94ae\u65f6\u518d\u5411\u540e\u7aef\u53d6\u94fe\u63a5\uff0cKey \u4e0d\u4f1a\u51fa\u73b0\u5728\u9875\u9762\u6e90\u7801\u91cc\uff09\u3001\u7528\u6237\u6ca1\u88c5 CC Switch \u65f6\u663e\u793a\u4ec0\u4e48\u3001\u600e\u4e48\u9644\u4e0a\u7528\u91cf\u67e5\u8be2\u811a\u672c\u3002\u7528 New API \u6216 Sub2API \u642d\u7684\u7ad9\uff0cKey \u5217\u8868\u91cc\u5df2\u7ecf\u81ea\u5e26\u300c\u5bfc\u5165\u5230 CC Switch\u300d\u6309\u94ae\uff1b\u533a\u522b\u662f New API \u7684\u94fe\u63a5\u4e0d\u5e26\u7528\u91cf\u67e5\u8be2\u811a\u672c\uff0c\u7528\u6237\u5bfc\u5165\u540e\u770b\u4e0d\u5230\u4f59\u989d\u3002\n- **[\u5728\u7ebf\u94fe\u63a5\u751f\u6210\u5668](https://ccswitch.io/deplink.html)**\uff1a\u4ece\u6d4b\u8bd5\u9875\u6539\u6210\u7ed9\u7ad9\u957f\u7528\u7684\u751f\u6210\u5668\uff0c\u5206\u4f9b\u5e94\u5546\u3001MCP\u3001\u63d0\u793a\u8bcd\u3001Skill \u56db\u7c7b\uff0c\u6309\u5e94\u7528\u5217\u51fa\u53ef\u9009\u7684 `apiFormat`\uff0c\u5185\u7f6e\u7528\u91cf\u811a\u672c\u6a21\u677f\uff0c\u586b `icon` / `iconUrl` \u65f6\u6309\u5e94\u7528\u5185\u540c\u6837\u7684\u89c4\u5219\u68c0\u67e5\u3002\u7528\u6237\u624b\u518c\u91cc\u539f\u6765\u7684\u751f\u6210\u5668\u94fe\u63a5\u6307\u5411\u4e00\u4e2a\u4ece\u6ca1\u5f00\u901a\u7684 GitHub Pages \u5730\u5740\uff0c\u6253\u5f00\u662f 404\uff0c\u73b0\u5728\u624b\u518c\u548c README \u90fd\u6539\u6307\u8fd9\u91cc\u3002\n\n## \u65b0\u589e\n\n**\u4f9b\u5e94\u5546\u56fe\u6807\u53ef\u4ee5\u4e0a\u4f20\u672c\u5730\u56fe\u7247\uff0c\u5b58\u8fdb\u300c\u6211\u7684\u56fe\u6807\u300d\u53cd\u590d\u4f7f\u7528\u3002** \u56fe\u6807\u9009\u62e9\u5668\u5206\u6210\u300c\u6211\u7684\u56fe\u6807\u300d\u548c\u300c\u5185\u7f6e\u56fe\u6807\u300d\u4e24\u7ec4\uff0c\u641c\u7d22\u6846\u540c\u65f6\u7b5b\u4e24\u7ec4\u3002\u70b9\u300c\u6211\u7684\u56fe\u6807\u300d\u7b2c\u4e00\u683c\u7684\u300c\u4e0a\u4f20\u300d\uff0c\u9009\u4e00\u5f20 PNG\u3001JPG\u3001WebP \u6216 SVG\uff08\u4e0d\u8d85\u8fc7 2 MB\uff09\uff0c\u8d77\u4e2a\u540d\u5b57\uff08\u9ed8\u8ba4\u662f\u6587\u4ef6\u540d\uff09\u5c31\u5b58\u8fdb\u300c\u6211\u7684\u56fe\u6807\u300d\u5e76\u7528\u5728\u5f53\u524d\u4f9b\u5e94\u5546\u4e0a\uff1b\u4ee5\u540e\u5176\u4ed6\u4f9b\u5e94\u5546\u3001\u5176\u4ed6\u5e94\u7528\u90fd\u80fd\u76f4\u63a5\u9009\uff0c\u4e0d\u7528\u518d\u4f20\u4e00\u6b21\uff0c\u91cd\u590d\u4e0a\u4f20\u540c\u4e00\u5f20\u56fe\u4f1a\u590d\u7528\u5df2\u6709\u7684\u90a3\u6761\u3002\u9f20\u6807\u79fb\u5230\u56fe\u6807\u4e0a\u53ef\u4ee5\u91cd\u547d\u540d\u6216\u5220\u9664\uff1b\u5361\u7247\u4fdd\u5b58\u7684\u662f\u56fe\u7247\u672c\u8eab\uff0c\u6240\u4ee5\u91cd\u547d\u540d\u3001\u5220\u9664\u90fd\u4e0d\u5f71\u54cd\u5df2\u7ecf\u5728\u7528\u5b83\u7684\u4f9b\u5e94\u5546\u3002\u56fe\u7247\u4f1a\u7f29\u6210 96\u00d796 \u7684 PNG\uff0c\u300c\u6211\u7684\u56fe\u6807\u300d\u548c\u4f9b\u5e94\u5546\u914d\u7f6e\u90fd\u968f\u4e91\u540c\u6b65\u5e26\u8d70\uff0c\u4e0d\u5728\u78c1\u76d8\u4e0a\u53e6\u5b58\u6587\u4ef6\uff1bSVG \u4f1a\u5148\u8f6c\u6210\u4f4d\u56fe\uff0c\u91cc\u9762\u7684\u811a\u672c\u548c\u5916\u90e8\u8bf7\u6c42\u90fd\u4e0d\u4f1a\u6267\u884c\uff0c\u539f\u59cb\u6587\u4ef6\u4e0d\u8fdb\u6570\u636e\u5e93\u3002\u4e00\u952e\u5bfc\u5165\u94fe\u63a5\u5e26\u6765\u7684\u7f51\u7ad9\u56fe\u6807\u4f1a\u4ee5\u300c\u5f53\u524d\u56fe\u6807\u300d\u663e\u793a\uff0c\u53ef\u4ee5\u5b58\u8fdb\u300c\u6211\u7684\u56fe\u6807\u300d\u3002\u9009\u62e9\u5668\u73b0\u5728\u70b9\u4e00\u4e0b\u56fe\u6807\u5c31\u9009\u597d\u5e76\u5173\u95ed\uff0c\u53bb\u6389\u56fe\u6807\u70b9\u641c\u7d22\u6846\u65c1\u7684\u300c\u6e05\u9664\u56fe\u6807\u300d\u3002\n\n**\u7528\u91cf\u9875\u663e\u793a\u9996\u5b57\u65f6\u95f4\u3002** \u8def\u7531\u670d\u52a1\u4e00\u76f4\u8bb0\u5f55\u9996\u5b57\u65f6\u95f4\uff0c\u4ee5\u524d\u53ea\u5728\u60ac\u505c\u63d0\u793a\u548c\u8bf7\u6c42\u8be6\u60c5\u91cc\u80fd\u770b\u5230\u3002\u73b0\u5728\u4f9b\u5e94\u5546\u7edf\u8ba1\u548c\u6a21\u578b\u7edf\u8ba1\u65b0\u589e\u300c\u9996\u5b57\u300d\u5217\uff0c\u53d6\u7ecf\u8def\u7531\u670d\u52a1\u7684\u6210\u529f\u6d41\u5f0f\u8bf7\u6c42\u7684\u4e2d\u4f4d\u6570\uff0c\u5076\u5c14\u6392\u961f\u3001\u51b7\u542f\u52a8\u7684\u6162\u8bf7\u6c42\u4e0d\u4f1a\u628a\u5b83\u62c9\u9ad8\uff1b\u8bf7\u6c42\u65e5\u5fd7\u5728\u300c\u901f\u5ea6\u300d\u540e\u9762\u4e5f\u52a0\u4e86\u300c\u9996\u5b57\u300d\u5217\u3002\u6ca1\u5f00\u8def\u7531\u65f6\uff0c\u6309\u4f1a\u8bdd\u65e5\u5fd7\u7684\u65f6\u95f4\u6233\u4f30\u7b97\uff0c\u5e26 \u2248 \u663e\u793a\uff1aClaude Code \u770b\u4ee5\u601d\u8003\u5f00\u5934\u7684\u56de\u590d\uff0cCodex \u770b\u8f83\u65b0\u7248\u672c\u5199\u5165\u7684\u65f6\u95f4\u6233\uff1b\u4ee5\u6b63\u6587\u6216\u5de5\u5177\u8c03\u7528\u5f00\u5934\u7684\u56de\u590d\u6ca1\u6709\u4f30\u7b97\u503c\u3002\u5347\u7ea7\u524d\u5bfc\u5165\u7684\u8bb0\u5f55\u4e0d\u8865\u7b97\u3002\n\n**\u7528\u91cf\u67e5\u8be2\u65b0\u589e Sub2API \u6a21\u677f\u3002** \u300c\u914d\u7f6e\u7528\u91cf\u67e5\u8be2\u300d\u7684\u6a21\u677f\u91cc\u65b0\u589e Sub2API\uff0c\u53ea\u9700\u8981\u4f9b\u5e94\u5546\u7684 Key \u548c\u5730\u5740\uff0c\u5730\u5740\u5e26\u4e0d\u5e26 `/v1` \u90fd\u884c\uff1b\u4f1a\u663e\u793a\u5957\u9910\u540d\uff0c\u989d\u5ea6\u4e0d\u9650\u7684\u8ba2\u9605\u4e0d\u518d\u663e\u793a\u6210\u8d1f\u4f59\u989d\u3002\n\n**\u65b0\u589e\u9884\u8bbe\uff1a** NekoCode\uff08Claude Code\u3001Claude Desktop\u3001Codex\u3001OpenCode\u3001OpenClaw\u3001Hermes\u3001Pi\uff0cMiniMax Code \u6cbf\u7528 Pi \u9884\u8bbe\uff09\u3002YYLX \u5728\u4e2d\u6587\u754c\u9762\u663e\u793a\u4e3a\u300c\u9c7c\u9c7c\u8fde\u7ebf\u300d\uff08\u7e41\u4f53\u4e2d\u6587\u4e3a\u300c\u9b5a\u9b5a\u9023\u7dda\u300d\uff09\u3002\n\n## \u4fee\u590d\n\n- **\u8def\u7531\u6a21\u5f0f\u4e0b Claude Code \u7684 haiku \u6863\u8bf7\u6c42\u88ab\u4e0a\u6e38\u62d2\u7edd**\uff08[#8118](https://github.com/farion1231/cc-switch/issues/8118)\uff09\u3002\u8def\u7531\u6a21\u5f0f\u5f80 `settings.json` \u91cc\u5199\u7684\u662f\u56fa\u5b9a\u7684\u6a21\u578b\u522b\u540d\uff0cClaude Code \u6309\u522b\u540d\u51b3\u5b9a\u600e\u4e48\u53d1\u601d\u8003\u53c2\u6570\u3002haiku \u6863\u4ee5\u524d\u5199\u7684\u662f `claude-haiku-4-5`\uff0cClaude Code \u8ba4\u4e3a\u8fd9\u4e2a\u6a21\u578b\u53ef\u4ee5\u5173\u601d\u8003\uff0c\u5c31\u53d1\u51fa\u5173\u95ed\u601d\u8003\u7684\u8bf7\u6c42\uff0c\u8981\u6c42\u5fc5\u987b\u5f00\u601d\u8003\u7684\u4e0a\u6e38\u4f1a\u76f4\u63a5\u62d2\u7edd\u3002\u73b0\u5728\u6539\u6210 `claude-haiku-5-5`\uff0c\u548c sonnet\u3001opus \u6863\u7684\u53d1\u6cd5\u4e00\u81f4\u3002\u8def\u7531\u672c\u8eab\u4ecd\u6309\u300chaiku\u300d\u5173\u952e\u8bcd\u6620\u5c04\uff0c\u9009\u5230\u54ea\u4e2a\u6a21\u578b\u4e0d\u53d8\u3002\n- **v3.20 \u53ca\u66f4\u65e9\u7528\u5b98\u65b9\u8d26\u53f7\u8d70\u8def\u7531\u7559\u4e0b\u7684 Codex \u4f1a\u8bdd\u6253\u4e0d\u5f00**\uff08[#7948](https://github.com/farion1231/cc-switch/issues/7948)\uff09\u3002v3.17 \u5230 v3.20 \u7528\u5b98\u65b9\u8d26\u53f7\u8d70\u672c\u5730\u8def\u7531\u65f6\uff0cCodex \u628a\u4f1a\u8bdd\u8bb0\u5728 `cc-switch-official` \u540d\u4e0b\uff1bv4.0 \u4e0d\u518d\u5199\u8fd9\u5f20\u8868\uff0cCodex \u6062\u590d\u8fd9\u4e9b\u4f1a\u8bdd\u65f6\u5c31\u4f1a\u62a5\u300cModel provider `cc-switch-official` not found\u300d\u3002\u73b0\u5728 CC Switch \u542f\u52a8\u65f6\u4f1a\u628a\u5b83\u4eec\u79fb\u56de Codex \u5185\u7f6e\u7684 `openai` \u5206\u7ec4\uff0c\u53ea\u6539\u4f1a\u8bdd\u8bb0\u5f55\uff0c\u4e0d\u78b0 `config.toml`\u3002\u8fd9\u4e9b\u4f1a\u8bdd\u672c\u6765\u5c31\u7528\u5b98\u65b9\u767b\u5f55\uff0cCodex \u4e5f\u4e00\u76f4\u628a\u5b83\u4eec\u5f53 OpenAI \u5904\u7406\uff0c\u79fb\u52a8\u540e\u884c\u4e3a\u4e0d\u53d8\u3002\n- **Grok Build \u7528\u7b2c\u4e09\u65b9\u4f9b\u5e94\u5546\u65f6\u751f\u6210\u4e0d\u4e86\u4f1a\u8bdd\u6807\u9898**\uff08[#7003](https://github.com/farion1231/cc-switch/issues/7003)\uff09\u3002\u6ca1\u8bbe `models.session_summary` \u65f6\uff0cGrok Build \u7528\u5185\u7f6e\u7684 `grok-4.6` \u751f\u6210\u6807\u9898\uff0c\u5374\u628a\u8bf7\u6c42\u53d1\u5230\u9ed8\u8ba4\u6a21\u578b\u8868\u7684\u5730\u5740\uff0c\u7b2c\u4e09\u65b9\u4e0a\u6e38\u4f1a\u62d2\u7edd\u3002\u73b0\u5728\u5207\u6362\u4f9b\u5e94\u5546\u65f6\uff0c`session_summary` \u5728\u6ca1\u8bbe\u6216\u6307\u5411 CC Switch \u5199\u7684\u8868\u65f6\u4f1a\u8ddf\u7740\u6307\u5411\u5f53\u524d\u4f9b\u5e94\u5546\uff0c\u5207\u56de\u5b98\u65b9\u8d26\u53f7\u65f6\u5220\u6389\uff1b\u4f60\u81ea\u5df1\u8bbe\u7684\u5185\u7f6e\u6a21\u578b\u6216\u81ea\u5df1\u7684\u8868\u4fdd\u6301\u4e0d\u52a8\u3002\n- **OpenRouter\u3001Novita \u4f59\u989d\u4e3a\u96f6\u65f6\u5361\u7247\u663e\u793a\u300c\u5957\u9910\u5df2\u8fc7\u671f\u300d**\uff08[#8148](https://github.com/farion1231/cc-switch/issues/8148)\uff09\u3002\u4f59\u989d\u4e3a\u96f6\u6216\u4e3a\u8d1f\u65f6\uff0cKey \u5176\u5b9e\u8fd8\u80fd\u7528\uff0c\u5361\u7247\u548c\u6258\u76d8\u5374\u663e\u793a\u5957\u9910\u5df2\u8fc7\u671f\u3002\u73b0\u5728\u663e\u793a\u300c\u4f59\u989d\u5df2\u7528\u5b8c\u300d\uff1b\u63a5\u53e3\u8fd4\u56de\u7f3a\u5931\u6216\u683c\u5f0f\u4e0d\u5bf9\u7684\u4f59\u989d\u65f6\u62a5\u9519\uff0c\u4e0d\u518d\u5f53\u6210\u96f6\u4f59\u989d\u3002\n- **Codex \u4e2d\u9014\u6362\u6a21\u578b\u540e\uff0c\u7528\u91cf\u8bb0\u5728\u4e86\u539f\u6765\u7684\u6a21\u578b\u4e0a\u3002** Codex \u5728\u7ebf\u7a0b\u8bbe\u7f6e\u91cc\u6362\u6a21\u578b\u65f6\uff0c\u65e5\u5fd7\u91cc\u4e0d\u4e00\u5b9a\u4f1a\u5199\u65b0\u7684\u8f6e\u6b21\u4e0a\u4e0b\u6587\uff0c\u7528\u91cf\u5bfc\u5165\u4ee5\u524d\u4f1a\u628a\u4e4b\u540e\u7684\u8bf7\u6c42\u8bb0\u5728\u4e0a\u4e00\u4e2a\u6a21\u578b\u540d\u4e0b\uff08\u6ca1\u6709\u66f4\u65e9\u8bb0\u5f55\u65f6\u8bb0\u6210 `unknown`\uff09\uff0c\u4ef7\u683c\u4e5f\u6309\u539f\u6a21\u578b\u7b97\u3002\u73b0\u5728\u4f1a\u8bfb\u53d6\u8fd9\u6761\u8bbe\u7f6e\u3002\u5df2\u7ecf\u5bfc\u5165\u7684\u8bb0\u5f55\u4e0d\u4f1a\u81ea\u52a8\u6539\u5199\uff0c\u6e90\u4f1a\u8bdd\u65e5\u5fd7\u8fd8\u5728\u7684\u8bdd\uff0c\u53ef\u4ee5\u5728\u7528\u91cf\u9875\u7684\u300c\u6570\u636e\u6765\u6e90\u300d\u91cc\u70b9\u300c\u91cd\u5efa Codex \u7528\u91cf\u300d\uff08\u91cd\u5efa\u524d\u4f1a\u81ea\u52a8\u5907\u4efd\u6570\u636e\u5e93\uff09\u3002\n- **\u5728\u8bbe\u7f6e\u91cc\u6539\u4e86\u914d\u7f6e\u76ee\u5f55\u3001\u8fd8\u6ca1\u70b9\u4fdd\u5b58\uff0c\u6539\u53e6\u4e00\u9879\u8bbe\u7f6e\u65f6\u76ee\u5f55\u4e5f\u88ab\u4fdd\u5b58\u4e86**\uff08[#7849](https://github.com/farion1231/cc-switch/issues/7849)\uff09\u3002\u5176\u4ed6\u8bbe\u7f6e\u81ea\u52a8\u4fdd\u5b58\u65f6\uff0c\u73b0\u5728\u53ea\u4f1a\u5e26\u4e0a\u5df2\u786e\u8ba4\u7684\u76ee\u5f55\uff1b\u88ab\u653e\u5f03\u7684\u8349\u7a3f\u4e5f\u4e0d\u4f1a\u518d\u7559\u5728\u8f93\u5165\u6846\u91cc\u3002\n- **Windows \u4e0a\u6253\u5f00\u6dfb\u52a0\u6216\u7f16\u8f91\u4f9b\u5e94\u5546\u9875\u9762\u65f6\u7a97\u53e3\u95ea\u4e00\u4e0b\u3002** v4.0.9 \u4fee\u4e86\u7f16\u8f91\u9875\u5148\u663e\u793a\u52a0\u8f7d\u9875\u7684\u95ee\u9898\uff0c\u4f46\u6574\u9875\u7684\u6de1\u5165\u6de1\u51fa\u5728 Windows \u4e0a\u4ecd\u4f1a\u95ea\u3002\u73b0\u5728\u8fd9\u4e24\u4e2a\u9875\u9762\u4e0d\u518d\u505a\u6de1\u5165\u6de1\u51fa\uff0c\u5176\u4ed6\u9875\u9762\u4e0d\u53d7\u5f71\u54cd\u3002\n- **Windows \u4e0a\u5220\u6389\u7684\u684c\u9762\u5feb\u6377\u65b9\u5f0f\uff0c\u6bcf\u6b21\u66f4\u65b0\u90fd\u4f1a\u88ab\u88c5\u56de\u6765\u3002** MSI \u5347\u7ea7\u4f1a\u5148\u5378\u8f7d\u65e7\u7248\u518d\u5b8c\u6574\u5b89\u88c5\u65b0\u7248\uff0c\u4ee5\u524d\u6bcf\u6b21\u90fd\u4f1a\u91cd\u65b0\u521b\u5efa\u684c\u9762\u5feb\u6377\u65b9\u5f0f\u3002\u73b0\u5728\u53ea\u5728\u5168\u65b0\u5b89\u88c5\u65f6\u521b\u5efa\uff1b\u5347\u7ea7\u65f6\u53ea\u6709\u539f\u6765\u7684\u5feb\u6377\u65b9\u5f0f\u8fd8\u5728\u624d\u4fdd\u7559\u3002\n\n**\u5176\u4ed6\uff1a** \u300c\u8fde\u63a5\u6a21\u5f0f\u300d\u7684\u8bf4\u660e\u6539\u4e3a\u5148\u8bb2\u6bcf\u79cd\u6a21\u5f0f\u7684\u957f\u5904\uff1a\u76f4\u8fde\u6700\u539f\u751f\uff0c\u8def\u7531\u53ef\u70ed\u5207\u6362\u4f9b\u5e94\u5546\u3001\u652f\u6301\u6545\u969c\u8f6c\u79fb\u548c\u683c\u5f0f\u8f6c\u6362\uff0c\u805a\u5408\u53ef\u5728\u5ba2\u6237\u7aef\u5185\u65e0\u7f1d\u5207\u6362\u591a\u5bb6\u6a21\u578b\u3002\u7528\u91cf\u9875\u7684\u6240\u6709\u8868\u683c\u5217\u7edf\u4e00\u5de6\u5bf9\u9f50\uff0c\u8bf7\u6c42\u65e5\u5fd7\u91cc\u4f9b\u5e94\u5546\u548c\u6a21\u578b\u4e24\u5217\u8ba9\u51fa\u4e00\u4e9b\u5bbd\u5ea6\u7ed9\u6570\u5b57\u5217\u3002\u65e5\u6587\u754c\u9762\u628a\u300c\u9ad8\u7d1a\u30aa\u30d7\u30b7\u30e7\u30f3\u300d\u6539\u4e3a\u300c\u8a73\u7d30\u30aa\u30d7\u30b7\u30e7\u30f3\u300d\u3002\n\n## \u5347\u7ea7\u8bf4\u660e\n\n**\u6570\u636e\u5e93\u7ed3\u6784\u6ca1\u6709\u53d8\u5316**\uff0c\u4ecd\u7136\u662f 20\u3002\n\n- \u5df2\u7ecf\u5728\u7528\u8def\u7531\u6a21\u5f0f\u7684 Claude Code\uff0c\u5347\u7ea7\u540e\u542f\u52a8 CC Switch \u65f6\u4f1a\u628a\u65b0\u7684 haiku \u522b\u540d\u5199\u8fdb `settings.json`\uff0c\u65b0\u5f00\u7684 Claude Code \u4f1a\u8bdd\u4f1a\u7528\u4e0a\u3002\n- Codex \u4f1a\u8bdd\u7684\u8fc1\u79fb\u5728 CC Switch \u542f\u52a8\u65f6\u81ea\u52a8\u8fdb\u884c\uff0c\u6bcf\u4e2a Codex \u914d\u7f6e\u76ee\u5f55\u53ea\u505a\u4e00\u6b21\uff0c\u6539\u52a8\u524d\u7684\u4f1a\u8bdd\u8bb0\u5f55\u5907\u4efd\u5728\u539f\u6709\u7684\u4f1a\u8bdd\u5206\u7ec4\u8fc1\u79fb\u5907\u4efd\u76ee\u5f55\u3002\u5982\u679c\u4f60\u624b\u52a8\u6062\u590d\u8fc7 `cc-switch-official` \u8868\u5e76\u4e14\u4ecd\u5728\u4f7f\u7528\uff0c\u8fd9\u6b21\u8fc1\u79fb\u4f1a\u8df3\u8fc7\u3002\n- \u65b0\u589e\u9884\u8bbe\u53ea\u5f71\u54cd\u65b0\u6dfb\u52a0\u7684\u4f9b\u5e94\u5546\u3002\n\n---\n\n## \u81f4\u8c22\n\n\u611f\u8c22 @funkpopo\uff08OpenRouter \u4f59\u989d\u4e3a\u96f6\u65f6\u663e\u793a\u5957\u9910\u5df2\u8fc7\u671f\u3001Codex \u4e2d\u9014\u6362\u6a21\u578b\u540e\u7528\u91cf\u8bb0\u9519\u6a21\u578b\uff09\u3001@hulkbig\uff08\u8bbe\u7f6e\u81ea\u52a8\u4fdd\u5b58\u65f6\u5e26\u4e0a\u672a\u786e\u8ba4\u7684\u76ee\u5f55\uff09\u3001@NestorRay\uff08Windows \u4e0a\u6253\u5f00\u4f9b\u5e94\u5546\u9875\u9762\u65f6\u7684\u95ea\u70c1\uff09\u7684\u8d21\u732e\u3002\n\n\u611f\u8c22 @hao-lin-lwh\u3001@desmonna\u3001@mossonli\u3001@enderzcx\u3001@nbcoming\u3001@liyangdeamo-svg\u3001@linhay\u3001@aofee \u62a5\u544a\u95ee\u9898\u3001\u63d0\u4f9b\u590d\u73b0\u4fe1\u606f\u548c\u5e2e\u5fd9\u9a8c\u8bc1\u3002\n\n\u5b8c\u6574\u7684\u6280\u672f\u7ec6\u8282\u8bf7\u89c1 [CHANGELOG](https://github.com/farion1231/cc-switch/blob/main/CHANGELOG.md)\u3002\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":11}
