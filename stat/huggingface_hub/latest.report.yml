{"id":406938648,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOE0mels4YQWQY","tag_name":"v2.2.0","target_commitish":"main","name":"[v2.2.0] `hf jobs stats` snapshots, download and `HfFileSystem` fixes","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-08T15:11:49Z","updated_at":"2026-10-08T15:12:08Z","published_at":"2026-10-08T14:54:20Z","assets":[],"body":"A small release this week, mostly bug fixes and quality-of-life improvements. `hf jobs stats` now returns right away instead of streaming forever, concurrent downloads reliably use `hf_xet`, and `HfFileSystem` caching is more predictable. Two behavior changes are listed under [Breaking changes](#-breaking-changes).\r\n\r\n## \ud83d\udcca `hf jobs stats` prints a snapshot by default\r\n\r\n`hf jobs stats` used to stream metrics until the job finished, so scripts and agents calling it on a running job hung until their own timeout. It now prints the latest sample of each job once and exits, like `hf jobs logs` and `hf spaces logs`. Use `-f/--follow` for the previous live view. Snapshot output also supports `--format json|agent|quiet`, which outputs the raw API metrics.\r\n\r\nOn the Python side, `HfApi.fetch_job_metrics` gets the same `follow` parameter as `fetch_job_logs`. It defaults to `False` and returns only the current sample. Pass `follow=True` to stream until the job completes.\r\n\r\n```bash\r\n>>> hf jobs stats 6ac3bd9afbc85ba6823a9ad4\r\nJOB ID                CPU % NUM CPU MEM % MEM USAGE      NET I/O         GPU UTIL % GPU MEM % GPU MEM USAGE\r\n--------------------- ----- ------- ----- -------------- --------------- ---------- --------- -------------\r\n6ac3bd9afbc85ba682... 0%    2.0     0.01% 1.0MB / 16.0GB 0.0bps / 0.0bps N/A        N/A       N/A\r\nHint: Use `hf jobs stats -f celinah/6ac3bd9afbc85ba6823a9ad4` to follow live stats.\r\n\r\n# Stream live stats until the job completes\r\n>>> hf jobs stats -f 6ac3bd9afbc85ba6823a9ad4\r\n```\r\n\r\n```python\r\n>>> from huggingface_hub import fetch_job_metrics\r\n>>> for metrics in fetch_job_metrics(job_id=job.id, follow=True):\r\n...     print(metrics)\r\n```\r\n\r\nOther Jobs fixes in this release: `hf jobs logs` and `hf spaces logs` without `-f` no longer hang while the job keeps printing, `hf jobs stats` no longer fails when one of the requested jobs has finished, and `hf jobs stats --json` prints `[]` when no job is running.\r\n\r\n- [CLI] Snapshot by default in hf jobs stats, add -f/--follow by @hanouticelina in #5090\r\n- [CLI] Fix empty hf jobs stats --json output with no running jobs by @hanouticelina in #5094\r\n- [Jobs] Fix no-follow logs hanging while the job keeps printing by @hanouticelina in #5092\r\n- [Jobs] Ignore 406 from metrics endpoint for finished jobs by @hanouticelina in #5091\r\n\r\n\ud83d\udcda **Documentation:** [Jobs guide](https://huggingface.co/docs/huggingface_hub/main/en/guides/jobs)\r\n\r\n## \u26a1 Concurrent downloads always use `hf_xet`\r\n\r\nIn a fresh process, the first concurrent `hf_hub_download` calls could read a placeholder version for `hf_xet` while another thread was still looking it up. Those calls treated `hf_xet` as missing and downloaded through the plain HTTP path. This mostly affected parallel downloads such as `snapshot_download`, where some of the files skipped Xet. The version lookup is now cached only once it is resolved, so every download sees the real value.\r\n\r\n- Fix race in `_get_version` that makes concurrent downloads skip hf_xet by @BramVanroy in #5102\r\n\r\n## \ud83d\udcc2 `HfFileSystem` cache fixes\r\n\r\nThree fixes to how `HfFileSystem` caches listings and missing paths:\r\n\r\n- `ls()` on a newly created empty bucket returns an empty list instead of raising `FileNotFoundError`.\r\n- Directory listings are now replaced in the cache instead of appended to. Before, `ls()` after `find()` or `ls(refresh=True)` could return duplicate entries, `refresh=True` kept deleted files, and listing a single bucket file cached it as the whole folder's listing.\r\n- `exists(path, refresh=True)` and `invalidate_cache(path)` now clear cached \"not found\" results. Before, a repo, branch or bucket created in the same process stayed missing until a full `invalidate_cache()`.\r\n\r\n```python\r\n>>> fs.exists(repo_id)\r\nFalse\r\n>>> api.create_repo(repo_id)\r\n>>> fs.exists(repo_id, refresh=True)  # was False before this release\r\nTrue\r\n```\r\n\r\n- [HfFileSystem] fix `ls()` on new empty bucket by @lhoestq in #5097\r\n- [HfFileSystem] Replace cached listings instead of appending to them by @ChihebBENCHEIKH1 in #5099\r\n- [HfFileSystem] Make refresh=True clear cached not-found results by @hanouticelina in #5106\r\n\r\n## \ud83d\udc94 Breaking changes\r\n\r\n- `hf jobs stats` and `HfApi.fetch_job_metrics` return a single snapshot by default instead of streaming until the job completes. Use `-f/--follow` or `follow=True` to keep the previous behavior. See the [section above](#-hf-jobs-stats-prints-a-snapshot-by-default) (#5090).\r\n- `load_torch_model` now raises `FileNotFoundError` instead of `ValueError` when the checkpoint path does not exist, and `model_index_to_eval_results` raises `ValueError` on an empty list (#5063).\r\n\r\n- [Bugfix] Fix wrong exception type and unbound variable guard by @vector15-05 in #5063\r\n\r\n## \ud83d\udda5\ufe0f CLI\r\n\r\n- [CLI] Don't glob-expand arguments on Windows by @hanouticelina in #5117. On Windows, quoted patterns such as `--exclude \".venv/**\"` or `--include \"*.json\"` were expanded into local file names before reaching the command. `hf download <repo> --include \"*.json\"` in a folder containing a `.json` file silently downloaded nothing.\r\n- [CLI] Read --env-file / --secrets-file as UTF-8 and strip the BOM by @hanouticelina in #5066\r\n- [CLI] Upload existing paths with glob characters as-is in hf upload by @Ganesh2325 in #5059\r\n\r\n## \ud83d\udd27 Other QoL improvements\r\n\r\n- [Download] Warn when allow/ignore patterns match no files in snapshot_download by @Ad1th in #5067\r\n- [Cache] Speed up delete_revisions with a set lookup by @hanouticelina in #5118. Planning `hf cache prune` / `hf cache rm` no longer scales quadratically with the number of files per revision.\r\n- [Setup] Install hf-xet on Windows ARM64 by @angt in #5074\r\n\r\n## \ud83d\udc1b Bug and typo fixes\r\n\r\n- [Download] Fix offline snapshot_download with a pinned revision by @ChihebBENCHEIKH1 in #5113\r\n- [Download] Consider port when following /resolve redirects by @assafvayner in #4942\r\n- [CommitScheduler] Fix race that skips the first scheduled push by @hanouticelina in #5086\r\n- [Repocard] Respect configured endpoint when validating cards by @Wauplin in #5069\r\n- Fix argument name in raise_text_generation_error docstring by @Sreekant13 in #5108\r\n\r\n## \ud83d\udcd6 Documentation\r\n\r\n- [Docs] Fix HTTP migration and async session references by @Yuilona in #5079\r\n- [Docs] Fix from_pretrained integration example by @Ayushdevo in #5105\r\n\r\n## \ud83c\udfd7\ufe0f Internal\r\n\r\n- Post-release: bump version to 2.2.0.dev0 by @huggingface-hub-bot[bot] in #5054\r\n- [CI] Split tests into api / transfer / inference suites by @Wauplin in #5042\r\n- [Tests] Always clean up staging repos and buckets created by tests by @Wauplin in #5057\r\n- [CI] Reduce flaky tests (jedi cache, read-after-write, fewer reruns) by @Wauplin in #5058\r\n- Bump doc-builder workflow pin by @paulinebm in #5087\r\n- Bump doc-builder main docs workflow pin by @paulinebm in #5093\r\n- [Tests] Wait for bucket listings after writes by @hanouticelina in #5095","mentions_count":14}
