{"id":427944082,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOE0mels4ZgeiS","tag_name":"v2.4.0","target_commitish":"main","name":"[v2.4.0] Copy files into Buckets with `HfFileSystem`, outdated CLI extension hints","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-29T15:29:20Z","updated_at":"2026-10-29T15:29:40Z","published_at":"2026-10-29T14:56:07Z","assets":[],"body":"## 🪣 Copy files into Buckets with `HfFileSystem`\r\n\r\n`HfFileSystem` raised `NotImplementedError` on any copy involving a Bucket. Copying into a Bucket now works from the same Bucket, from another Bucket, or from a model, dataset or Space repo. Files stored with Xet are copied on the Hub by hash, so nothing is downloaded. Other repo files are downloaded and then uploaded to the Bucket. fsspec moves a file by copying it and deleting the source, so `mv` and `rename` now work inside a Bucket too.\r\n\r\n```python\r\n>>> from huggingface_hub import hffs\r\n>>> hffs.cp_file(\"buckets/my-username/my-bucket/data/train.csv\", \"buckets/my-username/my-bucket/backup/train.csv\")\r\n>>> hffs.mv(\"buckets/my-username/my-bucket/data/tmp.csv\", \"buckets/my-username/my-bucket/data/final.csv\")\r\n>>> hffs.copy(\"buckets/my-username/my-bucket/data\", \"buckets/my-username/other-bucket/data\", recursive=True)\r\n>>> hffs.cp_file(\"datasets/my-username/my-dataset/train.parquet\", \"buckets/my-username/my-bucket/train.parquet\")\r\n```\r\n\r\nCopying from a Bucket to a repo is not supported yet.\r\n\r\n- [HfFileSystem] Support same-bucket file copies by @ankitkumartiwari-web in #5080\r\n\r\n## 🧩 See when a CLI extension is outdated\r\n\r\n`hf extensions list` only showed when each extension was installed, so there was no way to know that an update was available. It now has a `VERSION` column (the commit the extension was installed from) and a `LATEST` column, plus a hint naming the outdated extensions. Running an outdated extension also prints a hint, at most once a day. To stay within GitHub's rate limits, `hf` looks up the latest commit of each extension at most once a day. Set `HF_HUB_DISABLE_UPDATE_CHECK=1` to turn these checks off.\r\n\r\n<img width=\"1900\" height=\"760\" alt=\"hf extensions list showing the VERSION and LATEST columns and a hint for outdated extensions\" src=\"https://github.com/user-attachments/assets/df23dd4c-6346-41b4-82a5-e5c4046d3152\" />\r\n\r\n`hf extensions update` also repairs Python extensions that no longer start. After a Homebrew upgrade removed the Python an extension was installed with, running it failed with `dyld: Library not loaded`, and `hf extensions update` said it was already up to date. It now recreates the extension's virtual environment when its Python doesn't start, even if no newer commit exists.\r\n\r\n```console\r\n$ hf extensions update speedtest\r\nCreating virtualenv at: ~/.local/share/hf/extensions/hf-speedtest/venv\r\n✓ Extension updated\r\n```\r\n\r\n- [CLI] Show extension versions and hint when one is outdated by @hanouticelina in #5269\r\n- [CLI] Make hf extensions update repair broken Python extensions by @hanouticelina in #5270\r\n\r\n## 🔧 Other QoL improvements\r\n\r\n- Add auth hint to HfFileSystem \"repository not found\" error by @davanstrien in #5258. A private repo accessed without a token gave the same `(repository not found)` error as a typo in the repo name. The error now also tells you to check that you are authenticated.\r\n\r\n## 🐛 Bug and typo fixes\r\n\r\n- [Webhooks] Use \"discussion\" domain and default to all domains by @hanouticelina in #5263. `hf webhooks create` failed unless you passed `--domain repo`, and watching discussions was not possible because the accepted value was `discussions` instead of `discussion`. `create_webhook` now watches both domains when `domains` is omitted.\r\n- Validate filename against path traversal in try_to_load_from_cache by @bodapatisaikrishna in #5249. Filenames with `../` or absolute paths could resolve outside the cache folder. They are now rejected, as in `hf_hub_download`.\r\n- [HfFileSystem] Return file info from find(detail=True) on a file path by @ontdepart in #5246. It returned an empty dict, which broke datatrove readers pointing at a single `hf://` file.\r\n- [Cache] Skip local-dir metadata when verifying checksums by @alphasafal in #5257. `hf cache verify --local-dir` reported the `.cache/huggingface/` metadata as extra files, so `--fail-on-extra-files` failed on every clean download.\r\n- [CLI] Don't crash hf cache verify on Windows redirected stdout by @Sonica-B in #5255. When output was piped or redirected, `hf cache verify` crashed with `UnicodeEncodeError` instead of listing the files that failed verification.\r\n\r\n## 📖 Documentation\r\n\r\n- [Docs] Fix docstring examples that fail when copy-pasted by @tkr109 in #5238\r\n- [Docs] Await endpoint batch inference before pausing by @emrehangorgec in #5247\r\n- Docs: build English only, other languages are machine-translated by @mishig25 in #5276. The docs in other languages are now machine-translated from the English docs, in 11 languages.\r\n\r\n## 🏗️ Internal\r\n\r\n- Post-release: bump version to 2.4.0.dev0 by @huggingface-hub-bot[bot] in #5240\r\n- [Tests] Don't pin the avatar hash in OAuth test by @hanouticelina in #5241\r\n- [CI] Drop urllib3<2.0 test pin broken by vcrpy 9 by @hanouticelina in #5262\r\n- Bump the actions group with 7 updates by @dependabot[bot] in #5268\r\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":11}
