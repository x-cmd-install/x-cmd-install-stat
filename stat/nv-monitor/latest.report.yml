rsi8M4q_bIe","name":"nv-monitor-linux-amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":90312,"digest":"sha256:5012e49b2ebf0f8bd5e9677aab6798395a8142373b8263a85458bf410bbefd71","download_count":10,"created_at":"2026-11-07T16:39:18Z","updated_at":"2026-11-07T16:39:18Z"},{"id":721269274,"node_id":"RA_kwDORrsi8M4q_bIa","name":"nv-monitor-linux-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":145088,"digest":"sha256:8ece23a74686e5ba20ae62e356ba278c112275b297b36303907bb86b271b8bce","download_count":6,"created_at":"2026-11-07T16:39:18Z","updated_at":"2026-11-07T16:39:18Z"},{"id":721269276,"node_id":"RA_kwDORrsi8M4q_bIc","name":"nv-monitor-linux-arm64-legacy","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":83432,"digest":"sha256:0471463953c511289f4774c3ef82af7b6ea50a8a1e421e2d87f0b5ca34a126e7","download_count":2,"created_at":"2026-11-07T16:39:18Z","updated_at":"2026-11-07T16:39:18Z"}],"body":"## What's changed\n\n### Bug fixes\n\n- **Headless `peak_30m` metrics were always 0.** With `-n` (e.g. running as a systemd service), the 30-minute windowed peaks were never updated, so every `nv_*_peak_30m_*` Prometheus metric and `peak_30m_*` CSV column read 0. Peaks are now sampled in the headless loop as well, for both `-p` and `-l`. Thanks @gringus for reporting this (#42). (04efd02)\n- **TUI flickered on every refresh.** The screen was fully cleared on every frame. ncurses now only redraws what changed, which removes the flicker and cuts terminal output by about 80%. A full repaint still happens on resize, every 60s as a safety net, and on demand with the new **Ctrl-L** key. Thanks @meteoricfarm for the report and suggested fix (#43). (aee5cf1)\n\n**Full changelog:** https://github.com/wentbackward/nv-monitor/compare/v1.14.0...v1.15.0\n\n## Which binary should I download?\n\n| File | Use on |\n|------|--------|\n| `nv-monitor-linux-arm64` | Modern aarch64 Linux (Ubuntu 24.04+, glibc 2.39+). **DGX Spark.** |\n| `nv-monitor-linux-arm64-legacy` | Older aarch64 Linux (glibc 2.35+). **Jetson Orin / JetPack 5/6.** Also works on newer systems. |\n| `nv-monitor-linux-amd64` | x86_64 Linux with an NVIDIA GPU. |\n| `demo-load-linux-*` | Companion synthetic load generator for testing. Same platform rules as nv-monitor. |\n\nIf in doubt on arm64, pick `-legacy` — it works almost everywhere.\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
