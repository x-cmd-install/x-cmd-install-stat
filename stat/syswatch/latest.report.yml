zo","name":"syswatch-linux-armv5te-static.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1625368,"digest":"sha256:bbe4032ee018b18803c2320142094b587217fd1be245e87076d201892e4017a8","download_count":3,"created_at":"2026-11-03T10:09:35Z","updated_at":"2026-11-03T10:09:35Z"},{"id":705146080,"node_id":"RA_kwDOSSIHc84qB6zg","name":"syswatch-linux-x86_64-static.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1573087,"digest":"sha256:19226bf342dfc05aeddebd275207ab9c73942a57014e9b3ffc124f46bdfcdb3e","download_count":50,"created_at":"2026-11-03T10:09:35Z","updated_at":"2026-11-03T10:09:35Z"},{"id":705146087,"node_id":"RA_kwDOSSIHc84qB6zn","name":"syswatch-linux-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1597186,"digest":"sha256:6662756fd4ab40c695134a85885c796addafb8ba6f196295906764d5b656503a","download_count":27,"created_at":"2026-11-03T10:09:35Z","updated_at":"2026-11-03T10:09:35Z"},{"id":705146093,"node_id":"RA_kwDOSSIHc84qB6zt","name":"syswatch-macos-aarch64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1382140,"digest":"sha256:ca6492698cd56fa8bfd35f3b68a5661de626c2b6972563700791a735cf5e5290","download_count":72,"created_at":"2026-11-03T10:09:35Z","updated_at":"2026-11-03T10:09:36Z"},{"id":705146082,"node_id":"RA_kwDOSSIHc84qB6zi","name":"syswatch-macos-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1536530,"digest":"sha256:fe033fc6affe7c26fe7efb07a9ebbb417138de6a527dcf5af00779bc5fa95fa2","download_count":11,"created_at":"2026-11-03T10:09:35Z","updated_at":"2026-11-03T10:09:35Z"}],"body":"\n### Security\n\n- Recordings from `R` and `--record`, `S` snapshots and the config are now\n  created readable only by your user, with files at 0600 and directories at\n  0700. Recordings and snapshots contain every visible process's full\n  command line, and earlier versions created them under your umask, which\n  usually let other users read them. syswatch narrows its `sessions`, `ring`\n  and `snapshots` directories to 0700 the next time it writes to each one.\n  To protect files an earlier version wrote right away, run\n  `chmod -R go= ~/.local/share/syswatch` on Linux or\n  `chmod -R go= ~/Library/Application\\ Support/syswatch` on macOS,\n  and check any copies you keep elsewhere.\n- `S` always creates a new snapshot file and never opens an existing entry\n  at the same name. The config is saved through a temporary file and a\n  rename.\n- Startup no longer reads other processes' environment variables. A full\n  sysinfo refresh at startup read `/proc/<pid>/environ` for every readable\n  process and kept the values in memory, though syswatch never showed them.\n- zstd's decoders for pre-1.0 formats are no longer built into syswatch. No\n  version of syswatch wrote those formats.\n\n### Changed\n\n- The minimum supported Rust is now 1.89. `Cargo.toml` declares it, and CI\n  builds on it.\n- Updated dependencies, which clears the published advisories against\n  anyhow, tokio, zstd, zstd-safe and zstd-sys. Removed tokio, which nothing\n  used.\n- The published crate leaves out the demo GIFs. It is 259 KB, down from\n  6.1 MB.\n\n### Fixed\n\n- The Homebrew tap formula's test expected `syswatch --help` to exit 1. It\n  exits 0.\n- Dense no longer crashes in a terminal 3 to 8 rows tall, or on a key press\n  in one, which used to leave the terminal in raw mode (#39).\n- `--record` now flushes its current chunk and exits cleanly on SIGTERM\n  (`systemctl stop`) and SIGHUP, not only on Ctrl-C, and still ignores\n  SIGHUP under `nohup` (#41).\n\n### Release process\n\n- A release now stops before it builds anything unless its tag matches\n  `Cargo.toml`, this file has a section for it, the commit is on `main`, and\n  CI's Linux, macOS, release-guard, cargo-deny and MSRV jobs passed on that\n  commit. Windows CI still runs, but doesn't hold a release.\n- `scripts/release.sh X.Y.Z \"summary\"` makes the release commit and its tag.\n- A failed release can run again against the same tag:\n  `gh workflow run release.yml --ref main -f tag=vX.Y.Z`. A version that is\n  already on crates.io counts as published.\n- A tag with a hyphen, such as `v0.15.0-rc.1`, makes a GitHub pre-release.\n  It never goes to crates.io and never becomes the latest release. Only the\n  newest release updates the Homebrew tap.\n- Releases carry `SHA256SUMS`, and take their notes from this file.\n- Workflows are read-only by default, with every action pinned to a commit.\n  CI adds cargo-deny, an MSRV build and nextest, and Dependabot opens grouped\n  updates weekly. The Nix build has its own workflow and a `flake.lock`.\n\n"}
