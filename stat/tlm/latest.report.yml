ream","state":"uploaded","size":14080297,"digest":null,"download_count":43,"created_at":"2025-02-11T23:07:16Z","updated_at":"2025-02-11T23:07:22Z"},{"id":228308849,"node_id":"RA_kwDOLSTiVc4Nm7dx","name":"tlm_1.2_windows_amd64.exe","label":null,"uploader":{"login":"yusufcanb","id":9295668,"node_id":"MDQ6VXNlcjkyOTU2Njg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15109632,"digest":null,"download_count":227,"created_at":"2025-02-11T23:06:49Z","updated_at":"2025-02-11T23:06:56Z"},{"id":228308858,"node_id":"RA_kwDOLSTiVc4Nm7d6","name":"tlm_1.2_windows_arm64.exe","label":null,"uploader":{"login":"yusufcanb","id":9295668,"node_id":"MDQ6VXNlcjkyOTU2Njg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14307328,"digest":null,"download_count":26,"created_at":"2025-02-11T23:06:56Z","updated_at":"2025-02-11T23:07:01Z"}],"body":"# One-liner RAG has arrived in `tlm` v1.2! \ud83c\udf89\r\n\r\nVersion 1.2 of `tlm` introduces **one-liner Retrieval Augmented Generation (RAG)** with the new `tlm ask` command. This beta feature allows you to ask questions and get contextually relevant answers directly within your codebase and documentation.\r\n\r\nInspired by the [Repomix](https://github.com/yamadashy/repomix) project, `tlm ask` provides a similar context gathering mechanism, implemented efficiently in Go.  However, `tlm` goes a step further by bridging context retrieval with local and open-source LLM prompting, enabling security and privacy with the comfort of your terminal.\r\n\r\n**Key Features of `tlm ask`:**\r\n\r\n* **Instant Answers:** Get quick answers to direct questions using `tlm ask \"<prompt>\"`.\r\n* **Contextual Understanding:** Enhance answer accuracy by providing context. Use the `--context` flag and specify a directory for analysis, e.g., `tlm ask --context . \"<prompt>\"`.\r\n* **Granular Context Control:**  Further refine the context using `--include` and `--exclude` flags with file patterns. Target specific files or exclude irrelevant ones, e.g., `tlm ask --context . --include *.md \"<prompt>\"` or `tlm ask --context . --exclude **/*_test.go \"<prompt>\"`.\r\n\r\n**Example Usage:**\r\n\r\n* `tlm ask \"What is the main purpose of this function?\"`\r\n* `tlm ask --context ./src --include *.go \"How does authentication work?\"`\r\n* `tlm ask --context ./docs --include *.md --exclude README.md \"Summarize the key concepts.\"`\r\n* `tlm ask --interactive \"What are the dependencies?\"`\r\n\r\n![Ask](https://raw.githubusercontent.com/yusufcanb/tlm/refs/heads/release/1.2/assets/ask.gif)","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":2,"eyes":1}}
