## New Features\n- Raw body toggle (`w`) in the Request tab for form-encoded bodies \u2014 switches between parsed key/value view and the raw URL-encoded text\n- Line numbers in the response body panel\n- `q` keybinding to quit the application\n- Image rendering moved into the Body tab \u2014 images now display inline instead of in a separate tab\n\n### Improvements\n- Tab bar styled with bracket notation to match the request window title\n- Diagnostics tab and request list panel styling improvements\n- Method filtering and resource-type filtering in the request list\n- Data URLs truncated to a readable length in request list and details panel\n- Query parameters and fragments stripped from URLs in the request list\n- Filter logic inverted so no selection shows everything\n\n**Full Changelog**: https://github.com/nassendelft/har-viewer/compare/v1.1.0...v1.2.0"}
