d_at":"2026-11-07T15:09:39Z","updated_at":"2026-11-07T15:09:40Z"},{"id":721034406,"node_id":"RA_kwDOVeNBwM4q-hym","name":"graph-tui-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1156574,"digest":"sha256:079804fcadaac4a04d702992d33715c72eed493868d04c30acef601fac7aa0b5","download_count":1,"created_at":"2026-11-07T15:09:39Z","updated_at":"2026-11-07T15:09:40Z"},{"id":721038712,"node_id":"RA_kwDOVeNBwM4q-i14","name":"graph-tui-x86_64-unknown-linux-musl.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":109,"digest":"sha256:25d29756f4b26b05421a8758c6167af17d166c911a607a2bdcad6afb384209e7","download_count":1,"created_at":"2026-11-07T15:11:24Z","updated_at":"2026-11-07T15:11:24Z"},{"id":721038706,"node_id":"RA_kwDOVeNBwM4q-i1y","name":"graph-tui-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1211910,"digest":"sha256:bdcc296a95c85e25f88641a4316c7127773044e8d94d12510f27769a0ac6133e","download_count":2,"created_at":"2026-11-07T15:11:24Z","updated_at":"2026-11-07T15:11:25Z"}],"body":"`.gtui` format 10 (reads v1..v10). Crate 0.13.1.\n\n\n### Fixed\n\n- An edge between point nodes now leaves them in the direction its `from_side` asks for. Point nodes\n  have no port cell, so the plain L-shaped fallback used to ignore the declared side and picked\n  \"east then south\" whenever the next node in the chain suggested a horizontal approach. In\n  `examples/fun/dynasties.gtui` that made `南宋 -> 元` run east along `北宋 -> 南宋`'s row, so the two\n  edges overlapped and read as one line from `北宋` to `元`; it now drops out of `南宋` downward and\n  comes into `元` from the west. `uk-dynasties.gtui` loses a row of overlapping strokes the same way.\n\n- A manual waypoint (`via`) that makes the edge double back on the row or column it just\n  travelled is now skipped instead of drawn: such a point only adds a spur that ends in\n  mid-air. `hub -> leaf15` in `examples/limits/star40.gtui` used to come down to the shared\n  channel and climb back up, leaving a `│` tail under the leaf's `╯`; the elbow now reads\n  `╯` and the tail is gone. Waypoints that make progress are untouched, and no other\n  example changes.\n\n"}
