d_at":"2026-11-07T03:47:36Z","updated_at":"2026-11-07T03:47:36Z"},{"id":719514136,"node_id":"RA_kwDOVeNBwM4q4uoY","name":"graph-tui-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1152747,"digest":"sha256:c81f3ccd7d384aab22ef77b8a016a597cd4665c2eedb628c3c5686db67869b9e","download_count":1,"created_at":"2026-11-07T03:47:36Z","updated_at":"2026-11-07T03:47:37Z"},{"id":719517674,"node_id":"RA_kwDOVeNBwM4q4vfq","name":"graph-tui-x86_64-unknown-linux-musl.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":109,"digest":"sha256:2c6bc078904bc69753afe8d0f0770b796e41f2c10418e7729ab1ad0714b7069c","download_count":1,"created_at":"2026-11-07T03:49:08Z","updated_at":"2026-11-07T03:49:08Z"},{"id":719517676,"node_id":"RA_kwDOVeNBwM4q4vfs","name":"graph-tui-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1208651,"digest":"sha256:1a1af5dc85bca1b0050014a64143d88ef4a5ca545418bdb0ce897eddf172676a","download_count":2,"created_at":"2026-11-07T03:49:08Z","updated_at":"2026-11-07T03:49:08Z"}],"body":"`.gtui` format 10 (reads v1..v10). Crate 0.13.0.\n\n\n### Changed\n\n- In neighbour view (`E`) the selected edge pulses again: the overlay that lifts the highlighted\n  path above boxes and text used to repaint it in the plain edge colour, which wiped the pulse.\n- In neighbour view (`E`) the cursor only picks edges of the highlighted node: pointing at an edge\n  that merely passes through the same cell (or belongs to a neighbour) no longer selects it, so when\n  several edges share a cell the ones from the centre win. Clicking such an edge says \"E: only edges\n  of the centre\" instead of silently selecting it.\n- Neighbour view (`E`) now keeps the highlighted path visible: the lit edges are drawn once more\n  above boxes, text and labels, so a highlighted edge is not cut by the boxes it passes. Ports on a\n  highlighted neighbour keep the colour of their own edge and the neighbour's other ports (arrows\n  and `T`s of edges that are not lit) are dimmed, so `dbus.socket`'s 16 red arrowheads no longer\n  compete with the one blue one.\n- A `T` junction on a box border now uses the colour of the edge it belongs to, the same as the\n  arrowhead, instead of the box's border colour. The glyph is unchanged.\n- An edge that is short *relative to its boxes* (its length is no larger than the biggest box side,\n  both ends on `auto`) now picks its two sides from all 16 pairs, preferring ones that can run\n  straight. This only touches small boxes standing next to big ones (`systemd.gtui` moves one edge);\n  everything else keeps the ordinary rule, and explicit `from_side` / `to_side` opts out.\n- Ports are allocated by the **border's** capacity again, not by the text size: an 18-row box with a\n  one-line label has 16 cells down each side, so a side no longer collapses to a single anchor when\n  its label happens to be one line. A side with fewer than two cells that cannot hold its group\n  moves the whole group to a side that has room and also faces the other box; the surplus endpoints\n  otherwise move individually, choosing the side closest to the target instead of the next one\n  clockwise. This fixes `systemd.gtui` at 1:1: `basic.target` keeps 16 arrowheads down its full\n  right edge (instead of one plus four `v` on top, eight `^` on the bottom and a wrap around the\n  left) and `dbus.socket` the same on its left.\n- `layered` only forces a vertical side for adjacent ranks when the two boxes do not overlap\n  vertically; two boxes side by side that merely start at a different row keep their left/right\n  edges.\n- The last-resort route no longer draws a line that stops halfway: when the straight fallback is\n  blocked the edge draws nothing instead of leaving a dangling stroke.\n\n- When a side runs out of cells the endpoint that moves is now chosen by gain instead of by edge\n  order: plain lines move before arrowheads, and only the surplus count moves (a side with 16 cells\n  and 17 ends moves exactly one). A one-row `none` node keeps its single-cell sides and shares them\n  between plain lines rather than being pushed to the top or bottom.\n\n### Changed\n\n- Port and arrow ownership is now an explicit role model instead of \"whichever edge\n  last wrote the cell\": a cell's port role is either `Arrow` or `Line` (never both),\n  an arrowhead keeps a set of owning edges (`arrow_owners`) plus, per edge, the\n  strokes / ports / arrows it actually owns. Selection, the E-mode overlay and the\n  arrow colour no longer consult `edge_cells` (which stays as the hit-testing union).\n- Consequences:\n  - A plain connection end no longer takes a cell that an arrow end owns, so\n    selecting a forward edge (`dbus.service -> dbus.socket`) no longer shows an\n    arrowhead at its source (`<->`).\n  - Only arrows the selected edge owns are highlighted; foreign arrowheads along\n    the path (and at the picked edge's ports) keep their own colour.\n  - An arrowhead shared by several edges is highlighted for every owner.\n  - Routing treats other edges' ports/arrowheads as a soft obstacle (`+100`), so\n    lines prefer to route around them instead of crossing them.\n- Routes on `examples/real/systemd.gtui` shift (same arrow count and directions,\n  three more rows of detours); the dump is stable across runs.\n\n### Fixed\n\n- A text node (`style=none`) endpoint no longer loses the corner where its edge turns: the cell just\n  outside the port gets the hidden direction bit pointing back at the port, so the route draws\n  `╭ ─ ╮ ╰ ╯` instead of a bare `─`/`│`. The port cell itself (the text) is still never drawn on, and\n  a straight run stays straight. On `examples/fun/hongloumeng.gtui` three junctions gain their\n  corner (`╭───╯`, `贾蓉╮`, `╰秦可卿`); `systemd.gtui` is unchanged.\n\n- The cells a selected edge's ports open onto are now taken from what was actually drawn\n  (`Canvas::edge_out_cells`, recorded in `edge_full` / `path` / `edge_loop`), not from the port plan.\n  When a side is full the plan has no entry for that end and the drawing falls back to `pick_port`,\n  so a foreign arrowhead sitting on that cell was not suppressed: selecting\n  `dbus.service -> basic.target` still showed `multi-user.target -> dbus.service`'s `>` at its\n  source. It is hidden now, while the selected edge's own target arrowhead stays. The set is\n  assigned once after every layer is drawn instead of being cleared per layer.\n\n- A shared arrowhead now takes the colour of the edge that is currently active instead of the\n  colour of the first edge that claimed the cell: the picked edge wins, then the single lit edge in\n  neighbour view, then the first (visible) owner. In neighbour view on `fwupd.service`, the arrow\n  into `dbus.service` is drawn in the `fwupd` edge's colour rather than the first owner's red; when\n  several owners are lit at once the visible colour is kept (one cell, one colour). Applies to\n  arrows between text nodes, to arrows embedded in a box border, and leaves the ordinary picture\n  unchanged.\n\n- A port cell's **outside** cell now carries the same role as the port (`Arrow` / `Line`), so a\n  plain connection never starts on a cell an arrowhead is drawn in. `Canvas::outside_arrow` refuses\n  to draw an arrow on a cell that a line end already starts from, and the E-mode overlay no longer\n  repaints an arrow that `blit` hid for the selected edge. Selecting a forward edge\n  (`dbus.service -> dbus.socket`) therefore no longer shows a foreign `>` at its source, in either\n  state; the ordinary (unselected) picture is unchanged.\n\n- A one-line text target (`dbus.service` in `systemd.gtui`) has exactly one arrow cell on each of\n  its two usable sides, but four edges point into it. Once a side's arrow cell was taken, the port\n  planner had nothing left and returned no port, so the route reached the box without an arrowhead\n  (the `fwupd` and `wpa_supplicant` arrows were simply absent). Arrow ends now share the cell on\n  their side when nothing else is free: the glyph is drawn once, its ink and owner stay with the\n  first edge, and every sharing edge counts the cell as its own, so selecting any of them blinks it.\n- The E-mode overlay used to repaint an edge's line glyph over an arrowhead belonging to another lit\n  edge of the same centre, hiding the shared arrowhead again. Arrowheads stay on top there too.\n\n- The selected edge is now painted over every other edge, including the other edges that E mode\n  raises for the same centre. Before, in E mode the last drawn lit edge won the shared cells, so a\n  selected edge was interrupted exactly where a neighbour edge ran along the same row.\n\n- A port whose exit cell lied inside another box is no longer used: the edge (and its arrowhead)\n  used to be painted under that box, so the arrow simply was not there. The planner now switches\n  that endpoint to another side that has a way out (and overflow never lands on a covered cell).\n  On `systemd.gtui` `fwupd.service` and `wpa_supplicant.service` now enter `dbus.service` from the\n  right and the left with visible arrowheads (`dbus.service<` / `>dbus.service`).\n- An edge could disappear completely: the port chosen on its side had its first step inside\n  another box (two boxes overlap on screen), so the route had nowhere to go and the whole edge was\n  dropped. `pick_port` now skips a side whose exit cell is a box cell, and when a planned route\n  still fails the edge is re-planned once with both ends scanning the border instead of trusting\n  the plan. On `systemd.gtui` this brings back the two edges into `dbus.service` that were\n  invisible (all six of its neighbours now show their edge). The examples suite goes from ~44 s to\n  ~66 s because those edges are now routed instead of being dropped.\n- A cross cell keeps the colour of the shape you can see: the edge drawn first owns both the glyph\n  and the colour, and a later edge (even when its group is the one under the cursor) no longer\n  repaints that one cell in its own colour, which made a long red run look like it was cut by a\n  blue square. Raising an edge (selection / `E`) still recolours it as a whole.\n- An edge whose route cannot be found is no longer half drawn: the fallback used to return a single\n  cell while the caller still painted the port stub, the arrowhead and a one-cell vertical, leaving\n  a floating `^` under the box (visible on `basic.target` in `systemd.gtui`). A failed route now\n  draws nothing at all -- no stroke, no port, no arrowhead.\n- The route cache keyed documents by geometry only, so two documents with the same box rectangles\n  but different text could reuse each other's planned strokes (and their ports). Every document now\n  carries a process-wide id that is part of the key.\n\n"}
