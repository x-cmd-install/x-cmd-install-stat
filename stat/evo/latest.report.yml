A_kwDOR6bLtM4cpVep","name":"evo-hook-drain-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":242688,"digest":"sha256:5143db5108121fa72313a105c15cae775b34c5ff45eb20e3369433d28b210c77","download_count":17,"created_at":"2026-07-17T16:57:14Z","updated_at":"2026-07-17T16:57:14Z"},{"id":480597926,"node_id":"RA_kwDOR6bLtM4cpVem","name":"evo-hook-drain-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":221696,"digest":"sha256:5f4abf836aa6789c34c296a3cbb932f7994c50b90b0108f737630f38ea15d815","download_count":3,"created_at":"2026-07-17T16:57:14Z","updated_at":"2026-07-17T16:57:14Z"}],"body":"evo now runs on Kimi Code. From inside a Kimi session, point evo at a repo and it discovers what to optimize, builds the evaluation, and runs structured experiments in a loop, the same flow evo already supports on Claude Code, Codex, and Cursor.\n\n## Install\n\nKimi joins the host list:\n\n```\nuv tool install evo-hq-cli\nevo install kimi\n```\n\n`evo install kimi` drops the plugin into Kimi's plugin directory and registers it, so your next Kimi session picks up evo's skills, slash commands, and hooks. If the `kimi` binary isn't installed yet, get it first with `curl -fsSL https://code.kimi.com/install.sh | bash`.\n\n## What you get\n\n- `/evo:discover` and `/evo:optimize` as slash commands, plus the full evo skill set loaded in-session.\n- Parallel optimization subagents through Kimi's background Agent tool, so a round of experiments runs concurrently instead of one at a time.\n- Mid-run steering with `evo direct`: a directive you queue reaches the running orchestrator at the end of its current turn, so you can redirect a loop without stopping it.\n\nVerified end to end against Kimi Code 0.26.0: install, session registration, and directive delivery.\n\n**Full diff**: https://github.com/evo-hq/evo/compare/v0.7.0...v0.8.0\n"}
