{"id":412176760,"author":{"login":"jdefrancesco","id":782408,"node_id":"MDQ6VXNlcjc4MjQwOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOFncStM4YkVF4","tag_name":"v0.7.1","target_commitish":"master","name":"dskDitto v0.7.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-13T22:54:46Z","updated_at":"2026-10-13T22:55:07Z","published_at":"2026-10-13T22:55:07Z","assets":[],"body":"Adds Bash and Zsh command-line completion and reorganizes the CLI implementation.\n\n- Complete long flags, short aliases, hash/shell choices, and file/path arguments.\n- Generate scripts with `dskDitto --completion bash` or `dskDitto --completion zsh`.\n- Generate completion scripts before logging, profiling, or scanning starts.\n- Keep the shared flag registry in the refactored CLI so help and completion stay aligned.\n\nInstall the CLI/TUI:\n\n```sh\ngo install -ldflags=\"-s -w\" github.com/jdefrancesco/dskDitto/cmd/dskDitto@latest\n```\n\nInstall with GUI support:\n\n```sh\ngo install -tags gui -ldflags=\"-s -w\" github.com/jdefrancesco/dskDitto/cmd/dskDitto@latest\n```\n\nFor Zsh, load completion after compinit:\n\n```zsh\nsource <(dskDitto --completion zsh)\n```\n\nFor Bash:\n\n```bash\nsource <(dskDitto --completion bash)\n```\n\nValidation: all Go tests, the standard build, and its security scan passed.\n"}
