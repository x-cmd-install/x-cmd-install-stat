{"id":385322717,"author":{"login":"jdefrancesco","id":782408,"node_id":"MDQ6VXNlcjc4MjQwOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOFncStM4W947d","tag_name":"v0.6.3","target_commitish":"master","name":"dskDitto v0.6.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-09T07:54:47Z","updated_at":"2026-09-09T07:58:32Z","published_at":"2026-09-09T07:58:32Z","assets":[],"body":"Faster TUI startup on large scans:\n\n- Duplicate-group total sizes were previously recomputed via `os.Stat()` on every file when building the TUI view model, even though the size was already known from the scan. On scans of ~2M files this meant hundreds of thousands of blocking, single-threaded `stat()` syscalls before the TUI could render its first frame.\n- File sizes are now cached at scan time and reused when building duplicate-group summaries, falling back to a stat only when a size wasn't already known (currently just fuzzy-match groups).\n\nNo CLI/flag changes since v0.6.2."}
