e":"gorae-linux-arm64","label":null,"uploader":{"login":"Han8931","id":23087842,"node_id":"MDQ6VXNlcjIzMDg3ODQy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14287008,"digest":"sha256:a3ad4a0d7648c3956523c4cc44ec6cab64bbf10969929bb0675e4e35c1f7f687","download_count":1,"created_at":"2026-10-08T01:15:22Z","updated_at":"2026-10-08T01:15:26Z"},{"id":620307441,"node_id":"RA_kwDOQhzu984k-SPx","name":"gorae-windows-amd64.exe","label":null,"uploader":{"login":"Han8931","id":23087842,"node_id":"MDQ6VXNlcjIzMDg3ODQy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15475712,"digest":"sha256:e1fd372328ac39f6e534bd9902b09e6b8c16a05654df5dbb506adfc34d3830c2","download_count":1,"created_at":"2026-10-08T01:15:14Z","updated_at":"2026-10-08T01:15:22Z"}],"body":"### Metadata editing view (`e`)\r\n\r\n`e` now opens an editable field list in place of the file browser, styled like\r\nthe other panes. `Enter` edits the selected field inline, `Tab` saves and moves\r\nto the next, and `r`/`f`/`t` set the reading state and flags on the spot.\r\nChanges save as you make them, so `Esc` is always safe. `E` still hands every\r\nfield to `$EDITOR`.\r\n\r\n### Fixes\r\n\r\n- Saving metadata no longer clears Favorite and To-read.\r\n- The view's border and title no longer scroll away with its content.\r\n- The mouse wheel scrolls the view instead of the file list behind it.\r\n- Reading state, Favorite and To-read are now visible where they're edited.\r\n\r\nRelease binaries are built with `-buildvcs=false`, so their checksums no longer\r\ndepend on the build tree's state. `SHA256SUMS` is attached."}
