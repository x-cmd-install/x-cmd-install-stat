OQhzu984ksLnm","name":"gorae-linux-arm64","label":null,"uploader":{"login":"Han8931","id":23087842,"node_id":"MDQ6VXNlcjIzMDg3ODQy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14221472,"digest":"sha256:dcf92de6139a299cd665ed8135752eacea0fb700ae666683fc9743ffa02a9cef","download_count":1,"created_at":"2026-10-06T13:14:41Z","updated_at":"2026-10-06T13:14:55Z"}],"body":"## Browse\r\n\r\n- **Files pane tabs** \u2014 Library, Recent, Reading, To Read, Added, Unread, Read. Switch with `Tab` / `Shift+Tab` or `Left` / `Right`. Reading, Unread, and Read update as soon as `r` changes a paper's state, and Library remembers where you left it.\r\n- **The file list is a table** \u2014 State, to-read, Title, Author, Year, Added/Opened, Type \u2014 with a sortable header. Narrow panes drop the optional columns, and widths are measured so CJK titles stay aligned. `s n` sorts by name.\r\n- **A real directory tree** in the left pane, replacing the old parent listing. Focus it with `Ctrl+W` `h`/`l` or `,n`; `j`/`k` move, `l`/`h` expand and collapse, `Enter` opens. It starts folded so the table and preview get its width.\r\n- **Tag filtering** \u2014 tags are listed below the folders, each with a colour derived from its top-level segment, so `ml/nlp` and `ml/cv` read as one family. Select one to filter the Files pane; `h` clears it.\r\n\r\n## Trash\r\n\r\n- `D` now moves papers to a Trash under `meta_dir` instead of deleting them outright, snapshotting their metadata first.\r\n- `:trash` reports what's in it, `:trash restore [name]` puts items back with their tags and notes, and `:trash empty` clears it.\r\n- Deleting inside a tag, collection, or reading-state view removes the paper it stands for rather than the symlink representing it.\r\n\r\n## Look and feel\r\n\r\n- Key-hint bar above the status bar, showing continuations for pending prefixes (`g`, `s`, `y`, `,`).\r\n- Status-bar chips for mode, sort, and filter, with danger-coloured errors and a shortened directory path.\r\n- The delete confirmation is danger-styled and accepts only `y`.\r\n- The AI view uses palette-derived colours instead of hardcoded ones, with contrast-picked text on filled chips so light themes stay legible.\r\n- A launch splash screen, and the Files pane is now visually primary.\r\n\r\n## Command line\r\n\r\n- `Tab` completes command names, `:theme` arguments, and paths through one mechanism: it fills in whatever is unambiguous, then lists and cycles the remaining candidates \u2014 `Shift+Tab` goes back, `Enter` accepts. On an empty line it offers every command.\r\n"}
