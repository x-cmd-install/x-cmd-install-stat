_kwDOQhzu984dtTYu","name":"gorae-linux-arm64","label":null,"uploader":{"login":"Han8931","id":23087842,"node_id":"MDQ6VXNlcjIzMDg3ODQy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":13303970,"digest":"sha256:9081af28f6027a94665328b4a36ed4f70e8dd0e3f7ea5a9e93cbb7c57afeb44e","download_count":11,"created_at":"2026-08-02T00:57:43Z","updated_at":"2026-08-02T00:57:54Z"}],"body":"## New Features\r\n\r\n- **Talk about papers naturally** \u2014 multi-paper context with an agentic flow and resolver, so you can reference several papers in one conversation.\r\n- **Fuzzy /load box** \u2014 fuzzy-find with full content search, multi-line input, and a bottom-anchored status line; the library auto-indexes on startup.\r\n- **Multi-select in /load** \u2014 select multiple papers at once, with lf/ranger-style highlight bars.\r\n\r\n## UI & themes\r\n\r\n- Tree pane toggle and rebalanced folded pane widths.\r\n- Interactive theme chooser with better icons, contrast, and cursor visibility.\r\n- Reclaimed vertical space and made the Files pane visually primary.\r\n- New launch splash screen."}
