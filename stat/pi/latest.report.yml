0,"node_id":"RA_kwDOPbFNk84iX0XA","name":"pi-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43127308,"digest":"sha256:aec024c11a63e42b2447bf72fb031f755294a9babc0b03814dff506cfdb9d485","download_count":32,"created_at":"2026-09-20T11:06:49Z","updated_at":"2026-09-20T11:06:51Z"},{"id":576669072,"node_id":"RA_kwDOPbFNk84iX0WQ","name":"pi-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44493188,"digest":"sha256:b049d35a176fa5f4353d53ca90212320c031c9912b59efe95bb7985d52ed1507","download_count":658,"created_at":"2026-09-20T11:06:47Z","updated_at":"2026-09-20T11:06:50Z"},{"id":576669139,"node_id":"RA_kwDOPbFNk84iX0XT","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":823,"digest":"sha256:67556849b06045149b8c627f2ee61e76b81264dfa3db6f269ceda8c103f0a913","download_count":234,"created_at":"2026-09-20T11:06:50Z","updated_at":"2026-09-20T11:06:50Z"}],"body":"### New Features\n\n- **Meta Muse provider** \u2014 Sign in with Meta using `/login meta` or use `META_API_KEY` to access Muse Spark models. See [Meta (Muse subscription)](https://github.com/earendil-works/pi/blob/v0.86.1/packages/coding-agent/docs/providers.md#meta-muse-subscription).\n\n### Added\n\n- Added Meta (Muse subscription) login via `/login meta` with automatic Model API key refresh, plus `META_API_KEY` support ([#9096](https://github.com/earendil-works/pi/pull/9096) by [@xl0](https://github.com/xl0)).\n\n### Changed\n\n- Enabled Node's persistent compile cache before loading the bundled CLI runtime, reducing repeat launch time.\n\n### Fixed\n\n- Fixed `/bug` descriptions dropping line breaks from pasted diagnostics.\n- Fixed `/bug` hints appearing for user cancellations and retryable provider failures such as service unavailability.\n- Fixed clipboard copy failing in containers and WSL without WSLg by restoring the OSC 52 fallback when no display is available, and added a verified Windows clipboard backend for WSL ([#9688](https://github.com/earendil-works/pi/issues/9688)).\n- Fixed inherited z.ai `Prompt too long` errors not being recognized as context overflow ([#9805](https://github.com/earendil-works/pi/issues/9805)).\n- Fixed inherited Cerebras models advertising unsupported strict tool schemas, which caused HTTP 400 errors when strict and non-strict tools were mixed ([#9804](https://github.com/earendil-works/pi/pull/9804) by [@EdenGottlieb](https://github.com/EdenGottlieb)).\n","reactions":{"total_count":15,"+1":4,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":5,"rocket":0,"eyes":0}}
