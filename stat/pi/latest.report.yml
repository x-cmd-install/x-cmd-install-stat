731292706,"node_id":"RA_kwDOPbFNk84rlqQi","name":"pi-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":56616843,"digest":"sha256:e83404bc5a6003ac950683edd9b6cf499dac91ec890d8439a8c32528de534a77","download_count":105,"created_at":"2026-11-10T12:04:41Z","updated_at":"2026-11-10T12:04:43Z"},{"id":731292654,"node_id":"RA_kwDOPbFNk84rlqPu","name":"pi-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":61940631,"digest":"sha256:e6adb8cb8c84eca14391ad24b363de9d2be98a89ca3ba3fdee1fa4de32b7f2e8","download_count":4733,"created_at":"2026-11-10T12:04:39Z","updated_at":"2026-11-10T12:04:41Z"},{"id":731292756,"node_id":"RA_kwDOPbFNk84rlqRU","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":822,"digest":"sha256:81ae42dab12ec3ffbe0d2e067d82b9de6d11903792cdc3a442ae7500b1a16e2b","download_count":4930,"created_at":"2026-11-10T12:04:42Z","updated_at":"2026-11-10T12:04:42Z"}],"body":"### New Features\n\n- **Fork sessions whose folder is gone**: when a session's original folder was moved or deleted, you can now fork it into the current folder instead of only continuing, so later resumes no longer ask. See [Continue or switch sessions](https://github.com/earendil-works/pi/blob/v1.5.2/packages/coding-agent/docs/sessions.md#continue-or-switch-sessions).\n\n### Changed\n\n- When a session's working directory no longer exists, for example after the project folder was renamed, interactive mode now offers `Continue`, `Fork`, or `Cancel` instead of only continuing. `Continue` runs the session in the current directory without storing the choice, as before; `Fork` copies it into the current directory as a new session with a new ID, like `--fork`, so the next resume no longer asks. This applies at startup (`--session`, `--resume`), to `/resume`, to `/import`, and to `ctx.switchSession()` from extensions ([#11975](https://github.com/earendil-works/pi/pull/11975) by [@petrroll](https://github.com/petrroll), fixes [#11060](https://github.com/earendil-works/pi/issues/11060))\n\n### Fixed\n\n- Fixed `/import` of a session whose working directory no longer exists leaving a copy in the session directory, and continuing it leaving a second copy with the same ID (`s.jsonl` and `s-1.jsonl`); the failed copy is now removed ([#11975](https://github.com/earendil-works/pi/pull/11975) by [@petrroll](https://github.com/petrroll), fixes [#11060](https://github.com/earendil-works/pi/issues/11060))\n- Fixed Anthropic OAuth requests reporting an outdated Claude Code version\n","reactions":{"total_count":24,"+1":9,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":8,"rocket":0,"eyes":4}}
