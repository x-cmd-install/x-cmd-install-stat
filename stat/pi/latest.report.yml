node_id":"RA_kwDOPbFNk84klG3o","name":"pi-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43690354,"digest":"sha256:ca8a2f2687d2097d3f93ead151e943315a262cf499abe6635c09e293cced164d","download_count":28,"created_at":"2026-10-05T21:57:14Z","updated_at":"2026-10-05T21:57:16Z"},{"id":613707217,"node_id":"RA_kwDOPbFNk84klG3R","name":"pi-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":45055959,"digest":"sha256:6bdbfb7bac252eea36a0095e4b741c9d5784d5ba99146e2d76e9246dee409b58","download_count":367,"created_at":"2026-10-05T21:57:13Z","updated_at":"2026-10-05T21:57:15Z"},{"id":613707281,"node_id":"RA_kwDOPbFNk84klG4R","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":822,"digest":"sha256:16f1afa7aad9db65ca4811332fa13199e2c925f00631ce8fe338a3b32a970b84","download_count":276,"created_at":"2026-10-05T21:57:15Z","updated_at":"2026-10-05T21:57:15Z"}],"body":"### New Features\n\n- **Tool patterns and `--no-mcp`**: `--tools` and `--exclude-tools` accept `*` patterns, for example `--tools read,codemode,'mcp__radius__*'` keeps only one MCP server's tools. `--tools` now keeps MCP tools unless an entry starts with `mcp__`, and `--no-mcp` turns off MCP for one run. See [Tools](https://github.com/earendil-works/pi/blob/v1.0.4/packages/coding-agent/docs/cli.md#tools) and [MCP tools](https://github.com/earendil-works/pi/blob/v1.0.4/packages/coding-agent/docs/cli.md#mcp-tools).\n- **Codemode persists images**: `tools.read()` on an image file now gives back an image block that `image()` can show. See [Call tools](https://github.com/earendil-works/pi/blob/v1.0.4/packages/coding-agent/docs/codemode.md#call-tools).\n\n### Added\n\n- Added `*` patterns to `--tools` and `--exclude-tools`, for example `--tools read,codemode,'mcp__radius__*'`\n- Added `--no-mcp` to disable the built-in MCP support for one run\n\n### Fixed\n\n- Fixed syntax highlighting losing colors after the first line of multiline strings and comments in fenced code blocks ([#10143](https://github.com/earendil-works/pi/issues/10143))\n- Fixed codemode scripts not receiving images from `read`: `tools.read()` now resolves to an image block for image files, which `image()` shows ([#10251](https://github.com/earendil-works/pi/issues/10251))\n- Fixed MCP OAuth sign-in failing with `invalid_redirect_uri` on servers with OpenID Connect client registration, such as `mcp.modem.dev`: pi now registers as a native client ([#10493](https://github.com/earendil-works/pi/issues/10493))\n- Fixed `--tools` removing MCP tools, which left `pi --tools codemode` without any MCP servers. `--tools` now keeps MCP tools unless an entry starts with `mcp__`\n- Fixed MCP session shutdown returning while a server was still connecting, leaving its transport open until the server answered or timed out ([#10249](https://github.com/earendil-works/pi/issues/10249))\n- Fixed system prompt rules and the skills hint naming tools hidden by `prepareLoadout`. Hidden tools are left out of the rules, the skills hint names no tool when the file reader is hidden, and `codemode` shows each tool's prompt guidelines with its declaration; `ToolLoadout` gains `getPromptGuidelines()` ([#10343](https://github.com/earendil-works/pi/issues/10343))\n- Fixed Bedrock requests that fail with `The pending stream has been canceled` after a stalled HTTP/2 connection not being retried automatically ([#10379](https://github.com/earendil-works/pi/issues/10379))\n- Fixed codemode scripts that patch built-ins (for example `Array.prototype.toJSON = ...`) crashing pi and leaving the tool call unsettled. Built-ins are now frozen before the script runs, so such patches have no effect ([#10444](https://github.com/earendil-works/pi/issues/10444))\n","reactions":{"total_count":12,"+1":12,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
