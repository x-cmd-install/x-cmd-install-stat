586,"node_id":"RA_kwDOPbFNk84giDXS","name":"pi-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43556369,"digest":"sha256:b25e96fe64c9f41f75a924c0d36f395abb98d6c6fec0b78aaa0b86926f938bb4","download_count":89,"created_at":"2026-09-05T12:23:44Z","updated_at":"2026-09-05T12:23:46Z"},{"id":545797560,"node_id":"RA_kwDOPbFNk84giDW4","name":"pi-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":45009021,"digest":"sha256:002fa95b90d521245b9985d8f168caebc237ad56e7e30b319807dee1b2e17e1c","download_count":1644,"created_at":"2026-09-05T12:23:42Z","updated_at":"2026-09-05T12:23:44Z"},{"id":545797594,"node_id":"RA_kwDOPbFNk84giDXa","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":823,"digest":"sha256:0b70b2e422339b7a1277c3addb3705e1239d21ca1c20a17741a7b1c06d7526b0","download_count":585,"created_at":"2026-09-05T12:23:45Z","updated_at":"2026-09-05T12:23:45Z"}],"body":"### New Features\n\n- **GPT-6 Astra** \u2014 Available through OpenAI API keys and OpenAI Codex subscriptions. See [API Keys](https://github.com/earendil-works/pi/blob/v0.85.1/packages/coding-agent/docs/providers.md#api-keys) and [OpenAI Codex](https://github.com/earendil-works/pi/blob/v0.85.1/packages/coding-agent/docs/providers.md#openai-codex).\n\n### Added\n\n- Added GPT-6 Astra for OpenAI API keys and OpenAI Codex subscriptions.\n- Added five-times-faster mouse wheel scrolling while holding Alt in fullscreen mode ([#9166](https://github.com/earendil-works/pi/pull/9166) by [@xl0](https://github.com/xl0)).\n\n### Fixed\n\n- Fixed configurable save keybindings in the model and thinking selectors ([#9149](https://github.com/earendil-works/pi/pull/9149) by [@rwachtler](https://github.com/rwachtler)).\n- Fixed SDK import failures caused by unintentionally publishing internal experimental code and dependencies in 0.85.0. The experimental `client` and `experimental/plugin` subpaths and server/client commands are now source-only through `pi-test.sh`; the supported local SDK and stdio RPC API are unchanged ([#9132](https://github.com/earendil-works/pi/issues/9132)).\n- Fixed mouse hover changing selection and recentering autocomplete and settings lists, causing clicks to target a different item.\n- Fixed long prompt-cache requests for GPT-5.6+ Responses models to use `prompt_cache_options.ttl: \"30m\"` instead of `prompt_cache_retention: \"24h\"`.\n","reactions":{"total_count":45,"+1":15,"-1":0,"laugh":0,"hooray":14,"confused":0,"heart":13,"rocket":3,"eyes":0}}
