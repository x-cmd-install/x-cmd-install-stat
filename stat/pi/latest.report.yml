77,"node_id":"RA_kwDOPbFNk84isg3F","name":"pi-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43250108,"digest":"sha256:2e0d544999a765018ee5c2ff1a8b1a7e0f5d5b6b1e00b32d8c025d6c1dbcc833","download_count":32,"created_at":"2026-09-22T19:30:59Z","updated_at":"2026-09-22T19:31:00Z"},{"id":582094243,"node_id":"RA_kwDOPbFNk84isg2j","name":"pi-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44615504,"digest":"sha256:aab2ba67baf8ff97a52d05b62d88e9e65a840c6ea8fa1029a28d62d210d4e5fc","download_count":473,"created_at":"2026-09-22T19:30:57Z","updated_at":"2026-09-22T19:30:59Z"},{"id":582094296,"node_id":"RA_kwDOPbFNk84isg3Y","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":823,"digest":"sha256:c1a5779f9a47a7c490fc182091ae83795d673bb64d640374bb65a2ffd278e133","download_count":210,"created_at":"2026-09-22T19:31:00Z","updated_at":"2026-09-22T19:31:00Z"}],"body":"### New Features\n\n- **Latest frontier models** \u2014 Use Claude Opus 5.5, GPT-6 Sol, and GPT-6 Luna through supported providers, including GitHub Copilot. See [Choose a Model](https://github.com/earendil-works/pi/blob/v0.87.1/packages/coding-agent/docs/models.md#select-a-model).\n- **Grok 4.7 by default for xAI** \u2014 New xAI sessions now default to Grok 4.7. See [Provider Authentication](https://github.com/earendil-works/pi/blob/v0.87.1/packages/coding-agent/docs/providers.md#use-an-api-key-from-the-environment).\n\n### Added\n\n- Added inherited Claude Opus 5.5, GPT-6 Sol, and GPT-6 Luna support for GitHub Copilot.\n- Added inherited GPT-6 Sol and GPT-6 Luna support for OpenAI API keys and OpenAI Codex subscriptions.\n- Added inherited Claude Opus 5.5 support for Anthropic with adaptive thinking and a 1M context window.\n\n### Changed\n\n- Changed the default xAI model to Grok 4.7.\n\n### Fixed\n\n- Fixed split-turn compaction summaries being refused by Claude Fable 5.1 by clearly separating the conversation and using continuation-oriented instructions ([#9908](https://github.com/earendil-works/pi/pull/9908) by [@davidbrai](https://github.com/davidbrai)).\n- Fixed missing or invalid `--mode` values being silently ignored instead of reporting an error and exiting with a nonzero status ([#9045](https://github.com/earendil-works/pi/issues/9045)).\n- Fixed inherited image-only user messages being rejected by some OpenAI-compatible providers because they included an empty text part ([#9797](https://github.com/earendil-works/pi/issues/9797)).\n- Fixed inherited Anthropic OAuth requests reporting an outdated Claude Code version.\n","reactions":{"total_count":24,"+1":8,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":5,"rocket":6,"eyes":0}}
