mpatible APIs. See [Configure sampling by thinking level](https://github.com/earendil-works/pi/blob/v1.0.2/packages/coding-agent/docs/models.md#configure-sampling-by-thinking-level) ([#9776](https://github.com/earendil-works/pi/pull/9776) by [@mrexodia](https://github.com/mrexodia))\n","reactions":{"total_count":21,"+1":6,"-1":0,"laugh":2,"hooray":2,"confused":0,"heart":3,"rocket":6,"eyes":2}}
