"},{"id":747938567,"node_id":"RA_kwDOSpYsc84slKMH","name":"sdrtop-0.7.4-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":4347497,"digest":"sha256:e9f5e041f4ebdeae604b2036e7877461fbf5799138a67ebaa87869ed7d96884b","download_count":25,"created_at":"2026-11-14T15:41:09Z","updated_at":"2026-11-14T15:41:09Z"},{"id":747938568,"node_id":"RA_kwDOSpYsc84slKMI","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":401,"digest":"sha256:827a074517ab6791fb63ecefefb4f2f0408fd19315880a0718069ab60599d80d","download_count":13,"created_at":"2026-11-14T15:41:09Z","updated_at":"2026-11-14T15:41:09Z"}],"body":"**FT8 got a Lab of its own, and a decoder that now reads more than WSJT-X's deepest setting.**\r\n\r\nI recorded 22 minutes of a busy 20 m afternoon and gave the same samples to both. sdrtop read **1385** messages, WSJT-X 3.0.2 at its deepest setting **1365**. That's without guessing: WSJT-X fills in some messages from what a CQ usually says, sdrtop never does, so those are left out of its count. It also took **1.9 seconds** a cycle where WSJT-X took 5, and the decoder needs **under 10 MB**.\r\n\r\nOne recording, one band, so take it as a measurement and not a verdict. Every message only sdrtop read names stations WSJT-X heard elsewhere in the same recording.\r\n\r\n<table>\r\n  <tr>\r\n    <td colspan=\"2\"><img width=\"1416\" height=\"850\" alt=\"screenshot-2026-11-14_14-22-00-foot\" src=\"https://github.com/user-attachments/assets/01d94619-5a77-4176-8cd2-00e6d212b2ad\" />/td>\r\n  </tr>\r\n  <tr>\r\n    <td width=\"50%\"><img width=\"1600\" height=\"900\" alt=\"ft8-messages\" src=\"https://github.com/user-attachments/assets/4707d457-2ee8-49f5-9704-d55502d7c165\" /></td>\r\n    <td width=\"50%\"><img width=\"1600\" height=\"900\" alt=\"ft8-cost\" src=\"https://github.com/user-attachments/assets/c5bb945d-0ec9-4da7-9f32-47e4e5a60071\" /></td>\r\n  </tr>\r\n</table>\r\n\r\n## The FT8 Lab\r\n\r\nThree new views, `L` from World:\r\n\r\n- **Signal**: one decode up close, every symbol's tones, its track in frequency, its power.\r\n- **Band**: how far the band reaches and in which direction, SNR against distance, the hour.\r\n- **Receiver**: the clock as heard, the hour's sensitivity, what became of every candidate, the decoder's load.\r\n\r\n<table>\r\n  <tr>\r\n    <td width=\"50%\"><img width=\"1416\" height=\"850\" alt=\"screenshot-2026-11-14_09-47-10-foot\" src=\"https://github.com/user-attachments/assets/4dd90a66-2c43-4841-935e-d0dbc300c830\" /></td>\r\n    <td width=\"50%\"><img width=\"1416\" height=\"850\" alt=\"screenshot-2026-11-14_09-46-39-foot\" src=\"https://github.com/user-attachments/assets/c685dc74-4276-4bfb-aefb-723dbd21c52f\" /></td>\r\n  </tr>\r\n  <tr>\r\n    <td colspan=\"2\"><img width=\"1416\" height=\"850\" alt=\"screenshot-2026-11-14_09-46-21-foot\" src=\"https://github.com/user-attachments/assets/b112f0df-b296-4272-afae-a44eb5a0d821\" /></td>\r\n  </tr>\r\n</table>\r\n\r\n## How it got here\r\n\r\nIt started with speed: the decoder is **2.4 times faster** than in 0.7.3, with exactly the same decodes. Then I recorded those 22 minutes to put it next to WSJT-X, and the recording itself turned into the story of this release.\r\n\r\nWhile it was running, the map lit up with a station 13 373 km away: KX6AMS, a Marshall Islands call, which really exists. I was thrilled for a while. Its locator was in Antarctica, though, and WSJT-X had not heard it. It turned out to be a Dutch station's CQ, read a fraction of a tone off its place because a neighbour 8 dB stronger pulled the search over. sdrtop had made up a station and then subtracted it from a real one. That can't happen any more: a message found beside a much stronger one now waits until the stronger one is taken out.\r\n\r\n<img width=\"1440\" height=\"900\" alt=\"screenshot-2026-11-13_13-56-26-foot\" src=\"https://github.com/user-attachments/assets/d95864d4-cd0e-4714-bf02-88ec90be4657\" />\r\n\r\n\r\nThen the comparison. WSJT-X still read a few strong stations sdrtop didn't, and one of them had perfect sync and simply would not decode. Looked at symbol by symbol, its first ten symbols were still the CQ from the cycle before: the operator had clicked a caller two seconds into the transmission. sdrtop now reads a transmission like that again with its start, or its end, left out. That one idea found ten more messages, most of which WSJT-X missed too.\r\n\r\nAnd while I was watching all this, the screen said `feed broke 455×`. Recording to disk was cutting FT8 cycles. That's fixed too.\r\n\r\n## Also in this one\r\n\r\n- The FT8 CSV has four new columns at the end: `margin_min_db`, `held`, `floor_db_hz` and `unread`.\r\n\r\n---\r\n\r\n**Full Changelog**: https://github.com/musithang/sdrtop/compare/v0.7.3...v0.7.4\r\n"}
