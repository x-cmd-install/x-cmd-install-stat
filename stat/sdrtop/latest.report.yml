54Z"},{"id":792497680,"node_id":"RA_kwDOSpYsc84vPI4Q","name":"sdrtop-0.8.1-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":13471342,"digest":"sha256:ab345a250f23790cc8cbd2c9e8fe08e9011ad623e7488399d042e773166045cc","download_count":20,"created_at":"2026-11-25T17:39:53Z","updated_at":"2026-11-25T17:39:54Z"},{"id":792497677,"node_id":"RA_kwDOSpYsc84vPI4N","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":401,"digest":"sha256:98c0bd34d1997974f385c05fc3c3c1feef829b0496cdb9def0d7755cfddd2b13","download_count":13,"created_at":"2026-11-25T17:39:53Z","updated_at":"2026-11-25T17:39:53Z"}],"body":"monasd now serves the measurements over its API, records SigMF, writes the CSV exports and reopens the radio when it drops out. Config files carry over unchanged. One API key is renamed (see Changed).\r\n\r\n### Added\r\n\r\n- Readings over the API: `/v1/snapshot`, plus `/v1/spectrum`, `/v1/pager`, `/v1/ft8`, `/v1/net/band`, `/v1/net/census`, `/v1/net/ble`, `/v1/net/coded`, `/v1/net/bt`, `/v1/net/fer`, `/v1/net/wifi/survey`, `/v1/net/wifi/frames`, `/v1/net/wifi/airtime` (lists take `?since=N`). Each reading is a value or the reason it is missing; each group has a timestamp and a stale flag. `/v1/provenance` returns the export header fields.\r\n- SigMF recording over the API: `POST /v1/recording`, `POST /v1/recording/stop`, `GET /v1/recordings`, `GET /v1/recordings/{name}`. No paths from the network; samples are not served.\r\n- `POST /v1/export` writes the current mode's CSV files.\r\n- Radio reconnect: when the stream stops, monasd retries after 1, 2, 4, 8, 16 s, then every 30 s, restores the settings and sends an `outage` event.\r\n- `addresses` and `pager` commands, and `addresses`, `pager_masked`, `pager_mine` in `[monasd]`.\r\n- `lab_signal` mode (demodulator headless).\r\n- `user_docs/api.md`, generated from the source and checked by a test.\r\n- `packaging/monasd.service`, included in every tarball.\r\n- Proper `--help` for both programs (`-h` short, `--help` full); man pages use the same text.\r\n\r\n### Changed\r\n\r\n- **Breaking:** the engine's sample loss key is `monas` instead of `sdrtop`, in `/v1/health` `lost_samples` and in the `gap` event.\r\n- Files written by monasd or sdrtop name the writer: CSV header, SigMF `core:recorder` and `core:generator`.\r\n- README: \"powered by Monas\" badge; \"early development\" removed.\r\n\r\n### Fixed\r\n\r\n- Hardware Vitals showed `--` instead of a dash on a stopped radio.\r\n- Lab signal figures showed `NaN` instead of a dash.\r\n- Export headers outside NET and FT8 named a NET mode.\r\n- SDRplay: the timing bench could briefly show the previous delivery size.\r\n- Airspy R2/HF+ unplugged mid-stream leaked the run's threads (six per outage in monasd).\r\n- SigMF `core:description` always said \"recorded by sdrtop\".\r\n- A full disk during recording left an empty `.sigmf-meta.tmp`.\r\n\r\n**Full Changelog**: https://github.com/musithang/sdrtop/compare/v0.8.0...v0.8.1"}
