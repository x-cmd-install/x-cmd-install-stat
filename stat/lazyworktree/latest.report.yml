c8eab7a6497bfc220","download_count":3,"created_at":"2026-09-16T11:19:26Z","updated_at":"2026-09-16T11:19:27Z"},{"id":567811770,"node_id":"RA_kwDOQwJa6M4h2B66","name":"lazyworktree_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5630189,"digest":"sha256:583454fd4a2c9e0b709b8330ac8bd63dfa8706314cb09753248bff4a2e83f53c","download_count":3,"created_at":"2026-09-16T11:19:27Z","updated_at":"2026-09-16T11:19:27Z"}],"body":"This release adds PR and MR reviewer details directly to the Info pane, improves cleanup safety by automatically skipping worktrees with uncommitted changes, expands the random branch name generator, and fixes text pasting across modal inputs.\r\n\r\n<img width=\"2250\" height=\"378\" alt=\"image\" src=\"https://github.com/user-attachments/assets/f67406bc-bead-4c56-9cf3-4799db75f5a6\" />\r\n\r\n\r\n### Features\r\n\r\n- **PR/MR Reviewers in Info Pane**: Display reviewers who have submitted feedback on the selected PR/MR alongside their review verdict (approved, changes requested, or commented), bot indicators, and avatar badges. Reviewer display can be configured using `pr_reviewers: auto|never`.\r\n- **Safe Worktree Cleanup**: Interactive and non-interactive `cleanup` commands now skip worktrees containing uncommitted changes, untracked files, or dirty submodules to prevent data loss (#98). Skipped items and their reasons are reported in CLI summaries and `--json` output.\r\n- **Expanded Random Branch Names**: Expanded the curated dictionary of adjectives and nouns used for auto-generated branch names to over 58,000 safe combinations (#97).\r\n\r\n### Bug Fixes\r\n\r\n- **Pasting in Input Fields**: Fixed bracketed paste handling so pasted text correctly routes into focused text inputs in modal screens, search boxes, and filter fields.\r\n- **Quiet Fetch for Fork PRs**: Quietly handle initial branch fetch attempts when updating existing worktrees for fork PRs, avoiding spurious error messages before falling back to pull request references.\r\n\r\n### Maintenance\r\n\r\n- Redesigned the project documentation website and landing page with a clean, flat system-font layout.\r\n- Updated AI integration examples and scripts to reference `gemini-3.5-flash-lite` and `gemini-3.6-flash`.\r\n- Updated test coverage and fixed linter configuration syntax in `.golangci.yml`.\r\n\r\n### Dependencies\r\n\r\n- Upgraded `actions/setup-go` to `v7`.\r\n- Upgraded `alexellis/setup-arkade` to `v4`.\r\n- Updated Go dependencies including `charm.land/bubbles`, `charm.land/bubbletea`, and `charm.land/lipgloss`.\r\n"}
