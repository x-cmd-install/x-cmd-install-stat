42b368284978a78e6","download_count":0,"created_at":"2026-10-28T14:43:39Z","updated_at":"2026-10-28T14:43:39Z"},{"id":685296276,"node_id":"RA_kwDOQwJa6M4o2MqU","name":"lazyworktree_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5817373,"digest":"sha256:c4c9104e7a2138ba4a5d1117a3ddd87d406b6a72f8cbfb86cc97cbe099b4473b","download_count":0,"created_at":"2026-10-28T14:43:39Z","updated_at":"2026-10-28T14:43:40Z"}],"body":"This release introduces deeper integration with the Herdr multiplexer, enabling worktree creation directly within Herdr, automatic workspace grouping under repositories, and workspace cleanup on worktree deletion. It also improves existing branch and worktree handling when creating from issues, honors background settings for multiplexer sessions, and hardens test isolation.\r\n\r\n<img width=\"3804\" height=\"2098\" alt=\"image\" src=\"https://github.com/user-attachments/assets/eaeb2e3a-8d5e-4006-be81-635da6ae07ea\" />\r\n\r\n\r\n### Features\r\n\r\n- **Herdr Worktree Creation**: Added `use_herdr_for_workspace_create` and `herdr_workspace_create_layout` configuration options, allowing Herdr to create new worktrees as workspaces grouped under their repository across the CLI, TUI, and shell helpers.\r\n- **Herdr Repository Grouping**: Herdr workspaces now automatically nest under their parent repository in the sidebar via `herdr worktree open`. This can be toggled via the new `worktree_group` field on custom commands (defaults to `true`).\r\n- **Herdr Workspace Cleanup on Deletion**: Deleting worktrees through the TUI, `lazyworktree delete`, or `lazyworktree cleanup` now closes associated Herdr workspaces across all running sessions, while preserving the workspace hosting LazyWorktree itself.\r\n- **Cancel Setup Option**: The trust prompt for `.wt` files on new worktrees now includes a \"Cancel Setup\" option, which retains the worktree while skipping initialization commands and workspace layout execution.\r\n\r\n### Bug Fixes\r\n\r\n- **Issue Worktree & Branch Reuse**:\r\n  - Reused existing local branches when creating worktrees from issues (`--from-issue` / `-I`) instead of failing with a branch-already-exists error.\r\n  - Returned the existing worktree path directly when attempting to create a worktree for an issue that already has one.\r\n  - Detected when an attached issue worktree was deleted externally, prompting the user to run `git worktree prune`.\r\n  - Displayed a clear error indicating which worktree already checks out the branch when using `--no-workspace`.\r\n- **Multiplexer Integrations**:\r\n  - Respected `attach: false` configurations for tmux and Zellij when running through CLI `exec`, launching sessions in the background and printing attach instructions rather than attaching interactively.\r\n  - Displayed attach instructions in the TUI when launching background Zellij sessions configured with `new_tab`.\r\n  - Executed Herdr tab commands through temporary self-deleting scripts with `bash -l` to resolve quote rewriting and multi-line command issues in interactive shells.\r\n  - Closed Herdr workspaces associated with orphaned worktree directories removed during cleanup.\r\n- **Test Isolation**:\r\n  - Cleared Git repository environment variables during test suite runs to prevent tests invoked via Git hooks inside worktrees from altering the host repository.\r\n\r\n### Dependencies\r\n\r\n- Updated `github.com/charmbracelet/ultraviolet`.\r\n\r\n### Maintenance\r\n\r\n- Expanded test coverage for issue workflows, worktree hooks, and Herdr integrations.\r\n- Updated documentation for Herdr workspace management, CLI execution modes, and cleanup behavior.\r\n"}
