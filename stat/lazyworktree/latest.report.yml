96380b9c70f6c3c4d1","download_count":1,"created_at":"2026-09-21T13:13:36Z","updated_at":"2026-09-21T13:13:38Z"},{"id":579074067,"node_id":"RA_kwDOQwJa6M4ig_gT","name":"lazyworktree_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5719610,"digest":"sha256:7651567dc17cf0b2dc11bf179671a09b6516599addb55d36e775515dcaf255af","download_count":2,"created_at":"2026-09-21T13:13:36Z","updated_at":"2026-09-21T13:13:37Z"}],"body":"This release resolves an issue preventing Homebrew cask updates during automated releases, updates the Go toolchain to 1.26, and updates project dependencies.\n\n### Bug Fixes\n\n- Ensure Homebrew cask updates publish successfully during the release workflow by using an automation token with protected branch access and verifying the published version (#102).\n\n### Maintenance\n\n- Update Go version to 1.26.0.\n- Update release notes generation script to use the latest Gemini flash model endpoint.\n\n### Dependencies\n\n- Bump `github.com/urfave/cli/v3` to v3.13.0.\n- Bump project dependencies, including `testify`, `golang.org/x/sys`, and `golang.org/x/term`.\n"}
