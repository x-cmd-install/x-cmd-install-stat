  "body": "⚠️ If you're a package maintainer, please read the last section at the end.\r\n\r\n# Syntax Highlighting\r\n\r\nEdit v2 adds the **L**ightweight **S**yntax **H**ighlighter. It has a ~40kB footprint for a dozen languages plus runtime, barely grows with each language added, and runs at >100MB/s.\r\n\r\nThe highlighter is based on a simple programming language that combines regular expressions with explicit control flow. It's designed such that the runtime can be easily ported to other languages, including JavaScript.\r\n\r\n![Screenshot of Microsoft Edit with Syntax Highlighting](https://github.com/user-attachments/assets/041f5968-a82b-4cc4-8257-8ac2f65658d7)\r\n\r\nThe list of languages will surely grow over time, and contributions for widely used languages are very welcome.\r\nIf you're an experienced compiler developer, we'd greatly appreciate any advice and contributions to [the LSH compiler](https://github.com/microsoft/edit/tree/main/crates/lsh). If you're interested in ports of the runtime, please let us know!\r\n\r\nSee you in v3, with the introduction of a tiny CSS parser for UI theming.\r\n\r\n# Changes\r\n\r\n* Syntax highlighting (#753, #776, #777, #624, #795)<br>The whole LSH stack: compiler, runtime, integration, and initial language definitions. See above.<br>For path matching, we've written our own glob matcher (#743).\r\n* Preliminary support for `settings.json` (#742, #779)<br>For now, this is limited to `files.associations`, which lets you map file paths and extensions to languages for syntax highlighting. I expect v3 to be centered around configurability.\r\n* Find & Replace now supports capture groups (#222) (thanks @viyic!)<br>You can use `$1`, `$2`, etc. in the replacement string when regex mode is on.\r\n* You can move lines with Alt+Up/Down (#230) (thanks @juemrami!)\r\n* Tab and Shift+Tab indent and unindent multiple lines at once (#245) (thanks @liltrendi!)\r\n* Whitespace inside selections is now visible (#397) (thanks @pheonick!)\r\n* Pressing Ctrl+L selects the entire current line (#541) (thanks @recently-avoid-dyin!)\r\n* Opening a directory via the CLI drops you into the file picker (#577) (thanks @four-poetic-drew!)\r\n* Unsaved work is indicated with a ● in the terminal title (#523) (thanks @adamjoer!)\r\n* The file picker now uses natural sort for filenames (#763)<br>`file2.txt` sorts before `file10.txt`, as it should.\r\n\r\n# Bug Fixes\r\n\r\n* Invalid CLI arguments are properly rejected instead of silently ignored (#503) (thanks @spinualexandru!)\r\n* Fixed random Unicode text input corruption on \\*nix (#520) (thanks @manitofigh!)\r\n* Fixed a file truncation issue when writing Unicode files (#548)\r\n* Fixed undo grouping when backspacing (#590)\r\n* Fixed the alpha blending formula for colors (#594)<br>We were using `srgb_to_linear` on premultiplied colors, which is no bueno.\r\n* Scrolling and clicking have gone through a divorce (#603, #812, #819)<br>No more phantom selections when you just wanted to scroll.\r\n* Fixed UI colors with Terminal.app's new \"Clear Dark\" theme (#728)\r\n* Fixed multiple issues found under Linux (#706)<br>UTF-8 parsing for SGR mouse coordinates, `sighandler_t` warnings, GDB pretty printing.\r\n* Single-line files will now properly save as CRLF on Windows (#739) (thanks @UnnaturalTwilight!)\r\n* Fixed horizontal scrolling on macOS touchpads (#794) (thanks @barkure!)\r\n* You can now replace zero-width regex matches (e.g. `$`) (#815) (thanks @MihneaTeodorStoica!)\r\n* Accidentally pasting multiple lines into a single-line input field will not break the UI anymore (#818)\r\n* Fixed a crash when sorting directories on Linux without ICU being available (#823)\r\n\r\n# Smaller Changes\r\n\r\n* SIMD support for LoongArch (#539, #535, #551, #547, #602, #554) (thanks @heiher!)\r\n* We'll now automatically create parent directories on save (#738) (thanks @stescobedo92!)\r\n* Printing `--help` or `--version` no longer requires a TTY (#556, #810)\r\n* Fixed Ctrl modifier handling during mouse input (#604)\r\n* On Windows, `SetConsoleMode` failures now show a useful error message (#639)\r\n* The Windows application manifest compatibility section was fixed (#635)\r\n* Fixed a bug where the release announcement contained too much flavor\r\n* Toggling buttons in the search/replace dialog will not move focus around anymore (#821)\r\n\r\n# Build & Packaging\r\n\r\n* The ICU SONAME is configurable at build time via `EDIT_CFG_ICU*` (#495)<br>If this interests you, read the section at the end.\r\n* A devcontainer configuration was added (#496) (thanks @luisgizirian!)\r\n* A basic `snapcraft.yaml` was added for Snap package builds (#500) (thanks @aaronprisk!)\r\n* The `.desktop` file was improved (#560) (thanks @Nukleari!)\r\n* We added our own custom localization system (#591)<br>All translations live in `i18n/edit.toml` for now. The system allows us to dynamically add more languages over time.\r\n* A single-line Linux installer script was added (#628) (thanks @JaredTweed!)<br>See [our readme for more information](https://github.com/microsoft/edit#linux-build-from-source).\r\n* `clippy::ptr_as_ptr` lint was fixed (#730) (thanks @xtqqczze!)\r\n* Nightly Rust is no longer required (#761, #762, #764)<br>All nightly features have been replaced with our own, lovingly handcrafted unsafe code.\r\n\r\n# Localization, Internationalization, Documentation\r\n\r\nThis release adds 19 new languages, bringing the total to 30 (#596, #629, #634, #655, #663, #669, #688, #693).\r\nThanks go out to (in no particular order): @viyic, @VenusGirl, @mrFlamel, @MKAbuMattar, @OMouta, @miteigidesu, @bitigchi, @ebraminio, @omegahm, @xTacobaco, @marinac-dev, @marginal23326, @NandeMD, @msoltanov, @TotiTolvukall, @hidden-being, @peterblazejewicz, @schilive, @ioma8, @maikkundev, @webmaster442, @Erithax, @spinualexandru, @ronja-koistinen, and @KarpenkoY!\r\n\r\nOther documentation:\r\n* Updated the man page for 1.2.1 (#727) (thanks @polluks!)\r\n* Fixed the localization path in CONTRIBUTING.md (#601) (thanks @Packingdustry!)\r\n* Copyright year updated (#760) (thanks @ajm19826!)\r\n\r\n# Additional notes to Build & Packaging\r\n\r\nTo summarize the changes above:\r\n* Microsoft Edit now builds with stable Rust. However, Rust 1.93 or later is required.\r\n* The build system now supports SONAME overrides for ICU (primarily relevant on Linux). You can read more about it [at the end of our readme](https://github.com/microsoft/edit#notes-to-package-maintainers).\r\n\r\nFor instance, a build on Debian 13 (Trixie) may look like this:\r\n```sh\r\n# If permitted by your stability policies\r\n# and with rust-src installed:\r\nexport RUSTC_BOOTSTRAP=1\r\nexport EDIT_CFG_ICUUC_SONAME=libicuuc.so.76\r\nexport EDIT_CFG_ICUI18N_SONAME=libicui18n.so.76\r\nexport EDIT_CFG_ICU_RENAMING_VERSION=76\r\ncargo test -- --ignored\r\ncargo build --release --config .cargo/release.toml\r\n\r\n# Otherwise:\r\nexport EDIT_CFG_ICUUC_SONAME=libicuuc.so.76\r\nexport EDIT_CFG_ICUI18N_SONAME=libicui18n.so.76\r\nexport EDIT_CFG_ICU_RENAMING_VERSION=76\r\ncargo test -- --ignored\r\ncargo build --release\r\n```",
