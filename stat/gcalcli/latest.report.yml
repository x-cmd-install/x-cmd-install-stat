{"id":178480677,"author":{"login":"dbarnett","id":65244,"node_id":"MDQ6VXNlcjY1MjQ0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAD8P-c4Ko2Yl","tag_name":"v4.5.1","target_commitish":"main","name":"v4.5.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2024-10-04T04:31:56Z","updated_at":"2024-10-04T20:50:54Z","published_at":"2024-10-04T20:48:38Z","assets":[],"body":"## What's Changed\r\n* Fix gcalcli failing to run on python 3.10 if config file is present\r\n* Fix `config edit` when missing config dir blowing up with FileNotFoundError\r\n* Fix bizarre SSL recursion errors by moving truststore init earlier\r\n* Fix redundant \"Ignore and refresh\" prompt from `init`\r\n* Adjust \"when\" value parsing to handle YYYY-MM-DD consistently\r\n* Stop using brightblack color by default (UX problems on dark bg)\r\n\r\n\r\n**On PyPI**: https://pypi.org/project/gcalcli/4.5.1/\r\n**Release status**: #804\r\n**Full Changelog**: https://github.com/insanum/gcalcli/compare/v4.5.0...v4.5.1"}
