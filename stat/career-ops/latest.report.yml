{"id":422131125,"author":{"login":"career-ops-release[bot]","id":333437863,"node_id":"BOT_kgDOE9_bpw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR50T8s4ZKTW1","tag_name":"career-ops-v1.38.0","target_commitish":"115bc9873e3d43e23883f3c8f16436617facc62c","name":"career-ops v1.38.0: Five Thousand Strong","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-23T17:21:41Z","updated_at":"2026-10-23T17:37:11Z","published_at":"2026-10-23T17:34:18Z","assets":[{"id":669874682,"node_id":"RA_kwDOR50T8s4n7Xn6","name":"career-ops-sbom.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":611380,"digest":"sha256:f6eebb51d9ed6e59c21bf66de4780dbfd0fe8df24fe47928a77951cf25207f4b","download_count":30,"created_at":"2026-10-23T17:34:57Z","updated_at":"2026-10-23T17:34:57Z"}],"body":"<!-- co:release-notes:career-ops-v1.38.0 -->\nThis release is about not losing what you put in. Your CV, your PDF, your `portals.yml`, your tracker rows and your saved answers now survive interrupted writes, odd formatting and updates, and it comes from 48 people in one week, in the same days the career-ops Discord passed 5,000 members.\n\n## Highlights\n\n- **Updates that keep your files safe.** The list of what the updater owns now lives in its own manifest, read without importing, and an install on 1.37.0 updates through a bridge list. Tested before release from 1.37.0 and older installs: apply and rollback left the user files we checked byte-identical. (#5563 by @vliggio)\n- **Writes that cannot half-happen.** `cv.md`, `portals.yml` and the generated PDF are replaced atomically, and every core lock now uses one protocol. (#5552, #5389 by @vliggio)\n- **Batch, more in your hands.** `--company` limits a run to the companies you name, `--thin-action` decides what happens when no JD text could be fetched, and workers apply your dealbreakers and record a finished SKIP. (#5526, #5547 by @zhangruyi1993, #5493 by @mbrow190)\n- **More places to look.** Computrabajo and Magneto365 for Latin America (#2650 by @configurowebmax), Atlassian (#5497 by @kellymmcgrath), Dover (#5565 by @IaroslavMazur), Zoho Recruit career sites (#5345 by @ilyakanevskiy) and white-label SuccessFactors sites in `scan:full` (#5740 by @Schlaflied).\n- **Following up, with less to remember.** A duplicate check before you write a CV (#5735), take-home deadlines (#5736), interview invites read from an `.ics` file (#5744), all by @Schlaflied, and `tracker.mjs query --csv` for your spreadsheet (#5624 by @mbrow190).\n\n### Security\n\n- The web app's assisted apply could submit an application form when the text it typed contained a line break: line breaks are now removed from that text, and the fallback inserts it without pressing keys, so it no longer submits the form (GHSA-rm8h-2825-ww26, reported by @vliggio, #5770).\n\n## Updating\n\nRun `node update-system.mjs apply --confirm` in your career-ops folder. If you said no to the update prompt earlier, this is the same command.\n\n### Thank you\n\nThis release carries 300 pull requests from 48 people, 17 of them contributing for the first time.\n\n- @vliggio: #5347, #5351, #5355, #5389, #5390, #5481, #5483, #5487, #5488, #5489, #5491, #5492, #5501, #5502, #5503, #5504, #5505, #5506, #5507, #5508, #5537, #5538, #5540, #5542, #5549, #5550, #5551, #5552, #5553, #5556, #5563, #5576, #5578, #5579, #5580, #5582, #5583, #5584, #5591, #5592, #5593, #5594, #5595, #5596, #5597, #5598, #5599, #5600, #5601, #5602, #5603, #5604, #5605, #5606, #5607, #5608, #5609, #5635, #5636, #5637, #5638, #5639, #5640, #5641, #5642, #5643, #5644, #5646, #5647, #5648, #5649, #5650, #5651, #5652, #5654, #5656, #5657, #5658, #5661, #5665, #5670, #5671, #5673, #5676, #5679, #5681, #5682, #5683, #5692, #5693, #5695, #5696, #5697, #5699, #5701, #5702, #5704\n- @mbrow190: #5131, #5149, #5152, #5155, #5156, #5176, #5178, #5211, #5212, #5221, #5233, #5234, #5259, #5304, #5309, #5310, #5312, #5360, #5361, #5455, #5456, #5457, #5461, #5464, #5465, #5466, #5467, #5468, #5469, #5470, #5471, #5472, #5473, #5475, #5476, #5479, #5480, #5485, #5493, #5495, #5499, #5500, #5509, #5518, #5519, #5520, #5557, #5559, #5560, #5562, #5624, #5625\n- @ncoprod: #5004, #5037, #5038, #5039, #5042, #5088, #5089, #5090, #5091, #5271, #5272, #5273, #5274, #5275, #5276, #5277, #5436, #5437, #5438, #5439\n- @abankar1: #4968, #4981, #4984, #5370, #5371, #5372, #5373, #5378, #5379, #5380, #5381, #5382, #5383, #5384, #5385, #5386, #5402\n- @Schlaflied: #5409, #5411, #5417, #5430, #5447, #5450, #5452, #5516, #5735, #5736, #5740, #5744\n- @artemtrofymenko: #5349, #5353, #5365, #5387, #5517, #5522, #5566, #5567, #5618\n- @luochen211: #4646, #4866, #5293, #5341, #5342, #5343, #5668, #5672\n- @yuki-uix: #3923, #5245, #5356, #5422, #5431, #5484, #5490, #5530\n- @SulimanAbdulrazzaq: #5322, #5338, #5339, #5376, #5377, #5398, #5688\n- @zhangruyi1993 (first contribution): #5296, #5334, #5391, #5521, #5525, #5526, #5547\n- @rubicon: #5087, #5095, #5096, #5145, #5180, #5588\n- @roydonsequeira: #5350, #5428, #5533, #5535\n- @IaroslavMazur: #5539, #5541, #5565\n- @maxmilian: #5119, #5332, #5399\n- @tharun-37 (first contribution): #5362, #5451, #5453\n- @WJiangH: #2730, #2731, #2732\n- @Yoruxyv (first contribution): #5323, #5395, #5532\n- @Dakshx07 (first contribution): #5352, #5366\n- @DeryFerd (first contribution): #5524, #5574\n- @gunjanjaswal: #5572, #5612\n- @ilyakanevskiy: #5345, #5621\n- @RetroHazard (first contribution): #5289, #5333\n- @S3yon (first contribution): #5279, #5368\n- @vaishaldsouza: #5250, #5311\n- @vnk8071: #4727, #5367\n- @3nvyx (first contribution): #5375\n- @andrevandal (first contribution): #5401\n- @BigBrown10: #3442\n- @boo-chee (first contribution): #5617\n- @brianmgray: #3233\n- @configurowebmax: #2650\n- @cri