{"id":408748464,"author":{"login":"career-ops-release[bot]","id":333437863,"node_id":"BOT_kgDOE9_bpw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR50T8s4YXQGw","tag_name":"career-ops-v1.36.0","target_commitish":"26384e5348288189358c64bb859543671e19a916","name":"career-ops v1.36.0: Through the Filter","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-10T06:40:39Z","updated_at":"2026-10-10T06:59:14Z","published_at":"2026-10-10T06:53:08Z","assets":[{"id":627248181,"node_id":"RA_kwDOR50T8s4lYww1","name":"career-ops-sbom.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":611348,"digest":"sha256:3a23531bc611615078d11c1fd7de737c2c183d396a123fa3db29b0174e3412ce","download_count":101,"created_at":"2026-10-10T06:53:29Z","updated_at":"2026-10-10T06:53:30Z"}],"body":"<!-- co:release-notes:career-ops-v1.36.0 -->\nThis release is about getting through the filter: eight more places to find openings, and a CV that applicant tracking systems read the way you wrote it.\n\n### Highlights\n\n- **Eight new job sources.** ADP Workforce Now, Dayforce, Taleo and UKG Pro by @Schlaflied (#3729, #3734, #3743, #3733), JazzHR by @ilyakanevskiy (#4307), Gupy by @felipe-NR (#4550), startup.jobs by @phozzy (#4704) and PageUp by @williamchong (#4693). Eightfold boards now return their jobs instead of zero, by @kellymmcgrath (#4297).\n- **A CV the ATS reads correctly.** `pdf --ats` writes a plain ATS variant next to the styled CV, by @vliggio (#4909). `atsLint` checks a template against ATS rules kept as data in `templates/ats-rules.yml`, by @rubicon (#3900). A CV structure check by @euskode (#3472), a title-consistency check by @Schlaflied (#2678), and a flag for inflated scope verbs and unsourced adoption claims by @MannXo (#3784). Hyphenated terms like \"go-to-market\" no longer split across lines in the PDF, by @Kevin-Boyle (#4911).\n- **More markets.** A Singapore market mode by @jpelaez-23blocks (#4687), and `language.modes_dir` can now list several markets at once, by @Schlaflied (#3798).\n- **The web dashboard.** Local scheduled scans by @aselekoglu (#2628), Analytics progress and insights read from the core by @abankar1 (#4576), and assistant conversations that keep their earlier context by @luochen211 (#4495).\n- **Optional GDPR consent footer** for CVs (`{{CONSENT}}`), by @drawski (#4286).\n\nYour agent offers this update at the start of your next session. If it doesn't, run this once in your career-ops folder:\n\n```\nnode update-system.mjs apply --confirm\n```\n\nYour CV, profile, tracker and reports are not touched.\n\n### Thank you\n\nThis release carries 211 pull requests from 68 people, 20 of them contributing for the first time.\n\n- @vliggio: #3422, #3765, #3854, #3916, #4737, #4738, #4745, #4757, #4760, #4763, #4764, #4781, #4782, #4803, #4880, #4888, #4889, #4894, #4897, #4898, #4904, #4906, #4909\n- @luochen211: #4374, #4381, #4445, #4452, #4494, #4495, #4500, #4640, #4641, #4643, #4644, #4647, #4648, #4669, #4670, #4733, #4740, #4741, #4742, #4762, #4865, #4869\n- @Schlaflied: #2678, #3700, #3729, #3733, #3734, #3743, #3798, #3912, #4016, #4363, #4524, #4527, #4528, #4535, #4536, #4692, #4696, #4749, #4751, #4826\n- @rubicon: #3653, #3900, #3904, #3905, #4008, #4069, #4094, #4403, #4404, #4406, #4412, #4533, #4567, #4651, #4800, #4802\n- @abankar1: #3985, #3993, #4540, #4542, #4544, #4546, #4548, #4576, #4586, #4767\n- @artemtrofymenko: #4511, #4519, #4739, #4747, #4756, #4779, #4806, #4814, #4884, #4892\n- @ilyakanevskiy: #4307, #4569, #4613, #4633, #4711, #4714, #4778, #4790, #4804\n- @roydonsequeira (first contribution): #4725, #4726, #4755, #4761, #4771, #4810, #4833\n- @IaroslavMazur: #3304, #4195, #4321, #4666, #4671\n- @Kevin-Boyle: #4821, #4823, #4900, #4911\n- @maxmilian: #4563, #4699, #4815, #4863\n- @Wizarck: #3789, #4705, #4706, #4707\n- @felipe-NR: #4549, #4550, #4846\n- @KusalPabasara (first contribution): #4688, #4744, #4746\n- @MdRaf1: #4715, #4716, #4723\n- @pmgwee: #4338, #4473, #4701\n- @ronanime-arch: #4346, #4409, #4697\n- @williamchong: #4689, #4690, #4693\n- @AdilAzhariOmsan: #3522, #4638\n- @jpelaez-23blocks (first contribution): #4686, #4687\n- @kellymmcgrath: #4076, #4297\n- @miteshanshu (first contribution): #4728, #4807\n- @nikolaysm: #3716, #3947\n- @phozzy (first contribution): #4704, #4765\n- @sloemo01: #4333, #4341\n- @SulimanAbdulrazzaq: #4885, #4912\n- @Zoubeir23: #4214, #4557\n- @aselekoglu (first contribution): #2628\n- @badukucuk (first contribution): #4791\n- @Bekon0700: #4685\n- @brian8759 (first contribution): #4730\n- @davidnunez: #2739\n- @DennyHo0917 (first contribution): #4664\n- @drawski (first contribution): #4286\n- @egurnov: #4774\n- @euskode: #3472\n- @gunjanjaswal: #3191\n- @huiq777 (first contribution): #4678\n- @idontwannarock (first contribution): #4663\n- @jduffey1990: #4817\n- @MadhurJ10 (first contribution): #4812\n- @MannXo: #3784\n- @mbrow190: #4107\n- @mkriegl: #4617\n- @mrbese: #4703\n- @nikitacometa: #3834\n- @obielin: #4684\n- @peterbussch: #4428\n- @prasta1: #4851\n- @pwilinchery: #4302\n- @rahulnainala (first contribution): #4673\n- @readyagentsdev (first contribution): #4677\n- @SamanPandey-in: #4847\n- @samintisar: #4578\n- @santichausis: #4659\n- @scs0209 (first contribution): #4792\n- @sghanna (first contribution): #4770\n- @Shaamak: #3898\n- @sonukhobragade: #2760\n- @Souptik96: #4368\n- @SparshGarg999: #4088\n- @sundarshankar: #4102\n- @SunilKumarPradhan (first contribution): #4813\n- @tahakotil (first contribution): #4661\n- @TianHengZhuang: #4878\n- @WJiangH: #2690\n- @ybai08: #4672\n- @Yi-111-a (first contribution): #4635\n<!-- /co:release-notes -->\n\n## [1.36.0](https://github.com/career-ops-hq/career-ops/compare/career-ops-v1.35.0...career-ops-v1.36.0) (2026-10-10)\n\n\n### Features\n\n* **ci:** fail a PR while a dependency it names is still open ([#4403](https://github.com/career-ops-hq/career-ops/issues/4403)) ([71bb57d](https://github.com/career-ops-hq/career-ops/commit/71bb57df7a4f12eadf51ab0af4cf212912d49f7e))\n* **contacto:** surface saved internal-referral contacts before cold search ([#4692](https://github.com/career-ops-hq/career-ops/issues/4692)) ([3957d70](https://github.com/career-ops-hq/career-ops/commit/3957d70040c74424ee9477484059e05a53315537))\n* **contacts:** extract a recruiter/interviewer contact from a pasted reply ([#4363](https://github.com/career-ops-hq/career-ops/issues/4363)) ([1934b3e](https://github.com/career-ops-hq/career-ops/commit/1934b3e76af46173097a7eba4e6e5cde3468a8a9))\n* **cv-facts:** flag scope-verb inflation and unsourced adoption claims ([#3784](https://github.com/career-ops-hq/career-ops/issues/3784)) ([06f6452](https://github.com/career-ops-hq/career-ops/commit/06f6452d44877ccd923dc94722bc392315ea34b7))\n* **cv-templates:** add atsLint, with the ATS rules as data in templates/ats-rules.yml ([#3900](https://github.com/career-ops-hq/career-ops/issues/3900)) ([6f1a74e](https://github.com/career-ops-hq/career-ops/commit/6f1a74e8e37119f01a68a397187025e7dacc804a))\n* **cv:** add opt-in GDPR consent footer slot ({{CONSENT}}) ([#4286](https://github.com/career-ops-hq/career-ops/issues/4286)) ([5c0e765](https://github.com/career-ops-hq/career-ops/commit/5c0e76561eeb4a0256f5baf7ec487d43e814371d))\n* **dashboard:** open the job posting from the report viewer with `o` ([#4821](https://github.com/career-ops-hq/career-ops/issues/4821)) ([024f059](https://github.com/career-ops-hq/career-ops/commit/024f059c78b21c48cb61a03b5933de12f7f5b8c5))\n* **discover-ats:** flag resolved boards with very few postings ([#4869](https://github.com/career-ops-hq/career-ops/issues/4869)) ([8af2aef](https://github.com/career-ops-hq/career-ops/commit/8af2aefddf0b76e4da989c6473bd7232ca2b750e))\n* explain evidence confidence behind evaluation scores ([#4452](https://github.com/career-ops-hq/career-ops/issues/4452)) ([1a9a76b](https://github.com/career-ops-hq/career-ops/commit/1a9a76bc4730ef7ff0368f4034dda24c1ab83ede))\n* **gojobs:** add offline GO Jobs HTML import ([#4016](https://github.com/career-ops-hq/career-ops/issues/4016)) ([d35cf64](https://github.com/career-ops-hq/career-ops/commit/d35cf64daa16e86be9845fd6ab9a186097449d28))\n* **i18n:** report structural drift across translated modes ([#4643](https://github.com/career-ops-hq/career-ops/issues/4643)) ([a8a71f5](https://github.com/career-ops-hq/career-ops/commit/a8a71f51ab86cf4f28369ddb46460b179d715758))\n* **i18n:** support language.modes_dir as a list of declared markets ([#3798](https://github.com/career-ops-hq/career-ops/issues/3798)) ([d31a138](https://github.com/career-ops-hq/career-ops/commit/d31a138e8b3dc1971a43e15931623112c8a83246))\n* **liveness:** read Workday's 403 S22 as a withdrawn posting ([#4633](https://github.com/career-ops-hq/career-ops/issues/4633)) ([23a8ecf](https://github.com/career-ops-hq/career-ops/commit/23a8ecfafcdc0c644399a144d0f1998951a8a8ee))\n* **local-parser:** pass a parser's extra job fields through ([#3438](https://github.com/career-ops-hq/career-ops/issues/3438)) ([#4697](https://github.com/career-ops-hq/career-ops/issues/4697)) ([034ca77](https://github.com/career-ops-hq/career-ops/commit/034ca77013a6b2eb4fe6f76ea9ddbbd612c7f874))\n* **modes:** add Singapore market mode (modes/sg/) ([#4687](https://github.com/career-ops-hq/career-ops/issues/4687)) ([963d8bf](https://github.com/career-ops-hq/career-ops/commit/963d8bfe07711de537a1a748fe9bdafd028c27f6))\n* **oferta/apply:** surface fixed-term contract duration at apply time ([#4535](https://github.com/career-ops-hq/career-ops/issues/4535)) ([a156d4d](https://github.com/career-ops-hq/career-ops/commit/a156d4dfa18cbc3a10da6ebf2a3466ed57e681f8))\n* **patterns:** close the discard_reasons vocabulary ([#4549](https://github.com/career-ops-hq/career-ops/issues/4549)) ([f14202f](https://github.com/career-ops-hq/career-ops/commit/f14202f785970548be77644d9a77dc9502f9a313)), closes [#2785](https://github.com/career-ops-hq/career-ops/issues/2785)\n* **pdf:** add CV structure check; land as a warning per maintainer feedback ([#3472](https://github.com/career-ops-hq/career-ops/issues/3472)) ([f6d38b9](https://github.com/career-ops-hq/career-ops/commit/f6d38b9394ce4cce14094bb8f0c5dd55906c2c24))\n* **pdf:** opt-in `pdf --ats` emits an ATS variant alongside the styled CV ([#3853](https://github.com/career-ops-hq/career-ops/issues/3853)) ([#4909](https://github.com/career-ops-hq/career-ops/issues/4909)) ([72650c1](https://github.com/career-ops-hq/career-ops/commit/72650c1c47541d58b272c3384875910e359dd56f))\n* **providers:** add JazzHR zero-auth provider ([#4307](https://github.com/career-ops-hq/career-ops/issues/4307)) ([a18a644](https://github.com/career-ops-hq/career-ops/commit/a18a644d36c178822e1d5f23d16823b3cdeb9c71))\n* **providers:** add startup.jobs RSS provider ([#4704](https://github.com/career-ops-hq/career-ops/issues/4704)) ([b64b6c3](https://github.com/career-ops-hq/career-ops/commit/b64b6c32fc712437f576d3e9c856101ed12a81ca))\n* **providers:** capture the ATS-native posting and requisition ids ([#4076](https://github.com/career-ops-hq/career-ops/issues/4076)) ([6b4cd44](https://github.com/career-ops-hq/career-ops/commit/6b4cd4474a61b032c00237dd404ffbfae5bca584))\n* **providers:** eightfold reads PCSX tenants instead of returning zero jobs ([#4297](https://github.com/career-ops-hq/career-ops/issues/4297)) ([1601693](https://github.com/career-ops-hq/career-ops/commit/16016935574db46ebd7a2f7c8e27431ee100e358))\n* **providers:** PageUp \u2014 vendor-hosted careers sites ([#4693](https://github.com/career-ops-hq/career-ops/issues/4693)) ([9493bc8](https://github.com/career-ops-hq/career-ops/commit/9493bc8e33529ab8beb694ca2c6c1f7c02c4d228))\n* **registry:** check pins against published releases on a schedule (