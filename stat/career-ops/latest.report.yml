{"id":440749011,"author":{"login":"santifer","id":256850418,"node_id":"U_kgDOD0858g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR50T8s4aRUvT","tag_name":"career-ops-v1.40.0","target_commitish":"9170fed51af6894753a9f520074529d15e38a004","name":"career-ops v1.40.0: No Silent Drops","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-10T18:09:51Z","updated_at":"2026-11-10T18:29:20Z","published_at":"2026-11-10T18:29:03Z","assets":[{"id":732497198,"node_id":"RA_kwDOR50T8s4rqQUu","name":"career-ops-sbom.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":670311,"digest":"sha256:ca62f7ba00bbea5abbfb8bb5fe062ab0c44220c0019b8ea66ae1efbd16406ded","download_count":27,"created_at":"2026-11-10T18:29:20Z","updated_at":"2026-11-10T18:29:20Z"}],"body":"<!-- co:release-notes:career-ops-v1.40.0 -->\nThis release is about saying what career-ops did not read or did not keep. A board it read only in part is logged `partial` instead of `reachable`, a template tag the PDF renderer drops gets a warning, and a CV bullet whose verb drifted from the bullet you wrote is blocked.\n\n## Highlights\n\n- **A board read in part says so.** A board that career-ops could read only in part is now logged `partial`, not `reachable` (#6636), and boards that failed on a temporary error get one more try after the sweep (#6675), both by @kellymmcgrath. Before the headed-browser retry, the liveness check reads the site's robots.txt first (#6551 by @benbalter).\n- **Your CV, held to your own facts.** A generated bullet whose verb drifted from its source bullet is blocked (#6630 by @kellymmcgrath), structured facts are bound to the records they came from (#6016 by @luochen211), and a build with an unresolved `{{token}}` fails instead of printing it (#6408 by @sogav21). `cv-templates.mjs lint cv <name> --render` warns about what the renderer drops in silence, such as scripts and remote fonts (#5943 by @rubicon).\n- **Bring your tracker with you.** `import-tracker.mjs` imports the CSV export of another tracker (#6170), and the scan keeps a posting's close date and shows it in the pipeline (#6597), both by @mbrow190.\n- **One ask at a time.** career-ops asks for a GitHub star once, after your first report, and for the manifesto later, never in the same run. The asks that were spread across scan, doctor and update now live in one place (#6700).\n- **Twelve more places to look.** HiBob, HireHive and ALDI Nord (#6502, #6503, #6529 by @ilyakanevskiy), every Workable tenant through Workable's public XML feed (#6793 by @ilyakanevskiy), Polymer and Trakstar Hire (#6128, #6131 by @mbrow190), Tes (#6731 by @AdilAzhariOmsan), TurboHire (#6712 by @okeken), any employer's job sitemap (#6631 by @kellymmcgrath), Remote's own ATS (#6392 by @artemtrofymenko), ADP Recruiting Management (#6678 by @dgitman) and SEEK NZ (#6488 by @prateek942).\n\n## Updating\n\nRun `node update-system.mjs apply --confirm` in your career-ops folder. If you said no to the update prompt earlier, this is the same command.\n\n### Thank you\n\nThis release carries 239 pull requests from 58 people, 20 of them contributing for the first time.\n\n- @mbrow190: #5561, #6048, #6058, #6079, #6085, #6088, #6093, #6104, #6108, #6112, #6115, #6125, #6126, #6128, #6131, #6132, #6133, #6134, #6135, #6136, #6137, #6140, #6141, #6170, #6183, #6333, #6550, #6595, #6596, #6597, #6598, #6599, #6600, #6601, #6602, #6611, #6618, #6619, #6669, #6775, #6776, #6783, #6784\n- @vliggio: #6223, #6224, #6225, #6275, #6276, #6282, #6283, #6289, #6295, #6530, #6532, #6556, #6576, #6578, #6581, #6587, #6590, #6591, #6620, #6628, #6629, #6652, #6654, #6655, #6709, #6711, #6714, #6715, #6745, #6746, #6748, #6765, #6774, #6787, #6807, #6810\n- @abankar1: #5905, #6360, #6390, #6449, #6452, #6463, #6464, #6490, #6491, #6564, #6565, #6566, #6567, #6568, #6584, #6585, #6658, #6659, #6660, #6661, #6662, #6663, #6664, #6762, #6798, #6800\n- @dgitman: #6510, #6558, #6559, #6560, #6604, #6606, #6607, #6624, #6670, #6678, #6690, #6692\n- @ilyakanevskiy: #6467, #6502, #6503, #6529, #6573, #6575, #6580, #6582, #6790, #6793\n- @AdilAzhariOmsan: #6489, #6505, #6533, #6716, #6717, #6718, #6724, #6731\n- @artemtrofymenko: #6392, #6433, #6485, #6528, #6688, #6786\n- @kellymmcgrath: #6630, #6631, #6636, #6672, #6673, #6675\n- @DeryFerd: #6061, #6062, #6769, #6770, #6771\n- @okeken: #6657, #6710, #6712, #6735, #6812\n- @prabchevski (first contribution): #6483, #6484, #6496, #6501, #6506\n- @rubicon: #5934, #5943, #5945, #5961, #5962\n- @bercedev: #6419, #6548, #6616, #6617\n- @luochen211: #5675, #5729, #6016, #6730\n- @benbalter: #6546, #6551, #6552\n- @Codexnever: #6473, #6579, #6680\n- @ethanyandev (first contribution): #6571, #6572, #6577\n- @moelomda: #3948, #3950, #3951\n- @roydonsequeira: #6462, #6543, #6687\n- @AnkitParekh007: #6384, #6740\n- @dianziji (first contribution): #6458, #6656\n- @hakarrr (first contribution): #6728, #6739\n- @muhammadumer-waheed (first contribution): #6744, #6805\n- @ncoprod: #5512, #6022\n- @nessuarez: #6676, #6743\n- @prateek942: #6488, #6750\n- @Schlaflied: #6504, #6789\n- @sogav21: #6407, #6408\n- @tharun-37: #6588, #6759\n- @AayanWasti (first contribution): #6719\n- @Abhipatil0065: #6474\n- @briacSck: #2550\n- @CRIMSONHydra (first contribution): #6521\n- @Dakshx07: #6738\n- @darkpandawarrior: #6207\n- @elmaroun07-hub: #6169\n- @faramirezs: #6439\n- @Hamzaisadev (first contribution): #6804\n- @henrikdukefoss (first contribution): #6733\n- @ilmmg (first contribution): #6612\n- @Kedar-Khedkar (first contribution): #6593\n- @lilysttail (first contribution): #6679\n- @MannXo: #5985\n- @maxmilian: #6683\n- @MdRaf1: #6553\n- @monkey1wizard (first contribution): #6531\n- @phozzy: #6544\n- @PSA-Team-source (first contribution): #6500\n- @saintech (first contribution): #6363\n- @sarthakmhase2007-ctrl (first contribution): #6802\n- @silent-shadow11 (first contribution): #6801\n- @SulimanAbdulrazzaq: #5689\n- @Tanmay9223: #5804\n- @Vijaysir0hi: #6518\n- @vk211 (first contribution): #6726\n- @w21180239: #6481\n- @ZainnQureshii (first contribution): #6773\n- @zainulabideen041 (first contribution): #6594\n<!-- /co:release-notes -->\n\n## [1.40.0](https://github.com/career-ops-hq/career-ops/compare/career-ops-v1.39.0...career-ops-v1.40.0) (2026-11-10)\n\n\n### Features\n\n* ask once for a star after the first report, and for the manifesto later (never together) ([#6700](https://github.com/career-ops-hq/career-ops/issues/6700)) ([bd7ef1a](https://github.com/career-ops-hq/career-ops/commit/bd7ef1aa8e1c9b341ad3800f23d86e950e1860fd))\n* **cli:** Add Oh My Pi (omp) host support ([#5804](https://github.com/career-ops-hq/career-ops/issues/5804)) ([b273441](https://github.com/career-ops-hq/career-ops/commit/b273441036e8209a1ad125d4f800f09e22b55d3c))\n* **cv-facts:** block bullets whose verb drifted from their source bullet ([#1411](https://github.com/career-ops-hq/career-ops/issues/1411)) ([#6630](https://github.com/career-ops-hq/career-ops/issues/6630)) ([cb3e38c](https://github.com/career-ops-hq/career-ops/commit/cb3e38c7223ed3738e9ce4e044caf108ecc3c21b))\n* **cv-templates:** add renderLint, a warning for what the renderer silently drops ([#5943](https://github.com/career-ops-hq/career-ops/issues/5943)) ([40e0531](https://github.com/career-ops-hq/career-ops/commit/40e05312ba9b3dbfac92d1f52239f85882a12f62))\n* **expand:** list document names in the GitHub evidence step ([#5728](https://github.com/career-ops-hq/career-ops/issues/5728)) ([#5729](https://github.com/career-ops-hq/career-ops/issues/5729)) ([38892bd](https://github.com/career-ops-hq/career-ops/commit/38892bd24007daba02a592e7f7d2bf2cdaa0344f))\n* **i18n:** let i18n-drift fail CI with --fail-under ([#6771](https://github.com/career-ops-hq/career-ops/issues/6771)) ([c0d44f5](https://github.com/career-ops-hq/career-ops/commit/c0d44f5d3d5185880e0b006aafe0149f490ae095))\n* **intake:** snapshot committed sources and diff changed ones ([#6552](https://github.com/career-ops-hq/career-ops/issues/6552)) ([24a8b95](https://github.com/career-ops-hq/career-ops/commit/24a8b95d15b2badb5a851f67d946426441453c6b))\n* **linkedin:** add alert mail on the scan schedule ([#6112](https://github.com/career-ops-hq/career-ops/issues/6112)) ([51b16d3](https://github.com/career-ops-hq/career-ops/commit/51b16d38bc60e23898dc6b4577f748cb6dc6a264))\n* **liveness:** check robots.txt before the headed-browser retry ([#6551](https://github.com/career-ops-hq/career-ops/issues/6551)) ([1d74416](https://github.com/career-ops-hq/career-ops/commit/1d7441680087835631644a86c1b7dc80ee390c56)), closes [#5776](https://github.com/career-ops-hq/career-ops/issues/5776)\n* **oferta:** optional positioning_band beside the score ([#4720](https://github.com/career-ops-hq/career-ops/issues/4720)) ([#6789](https://github.com/career-ops-hq/career-ops/issues/6789)) ([d17680d](https://github.com/career-ops-hq/career-ops/commit/d17680d0a172085e212a62157ecb9f95fffe4576))\n* **oferta:** warn before an evaluation when the GitHub evidence is stale ([#5674](https://github.com/career-ops-hq/career-ops/issues/5674)) ([#5675](https://github.com/career-ops-hq/career-ops/issues/5675)) ([16d01ad](https://github.com/career-ops-hq/career-ops/commit/16d01ad0dae54bb4bde3f2f73e42239be82c2d5b))\n* **offer-prep:** contract-stage jurisdiction passes for agency licensing, classification and terminology ([#3641](https://github.com/career-ops-hq/career-ops/issues/3641)) ([#6504](https://github.com/career-ops-hq/career-ops/issues/6504)) ([b70bb8e](https://github.com/career-ops-hq/career-ops/commit/b70bb8e4e8d8ff17fc3bb69a0e7df067e1349f7e))\n* **pdf:** add an opt-in --strict-fact-check flag ([#6769](https://github.com/career-ops-hq/career-ops/issues/6769)) ([5e514db](https://github.com/car