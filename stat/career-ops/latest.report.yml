{"id":396009575,"author":{"login":"career-ops-release[bot]","id":333437863,"node_id":"BOT_kgDOE9_bpw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR50T8s4XmqBn","tag_name":"career-ops-v1.34.0","target_commitish":"de7f7fe8fe65852b9743bbdce94f0304101a749e","name":"career-ops v1.34.0: The Quiet Update","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-24T19:17:52Z","updated_at":"2026-09-24T19:58:00Z","published_at":"2026-09-24T19:26:12Z","assets":[{"id":586660723,"node_id":"RA_kwDOR50T8s4i97tz","name":"career-ops-sbom.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":606016,"digest":"sha256:6214f92072d7538b8f0355b8a43971a3220bcdc753d54cbba595119323ac9898","download_count":2,"created_at":"2026-09-24T19:26:33Z","updated_at":"2026-09-24T19:26:34Z"}],"body":"<!-- co:release-notes:career-ops-v1.34.0 -->\nThis is the first release since I started working on career-ops full time. The update prompt now shows up only when a new version is actually out. Until now, almost any change landing on `main` could trigger it, often every day. This release also carries work from 63 people, 43 of them contributing for the first time.\n\n### Highlights\n\n- **Update prompts only for new versions.** `update-system.mjs` installs the latest published release instead of `main`, `check` asks only when a newer release exists, and saying no lasts until the next version instead of forever. Tracking `main` stays available with `--channel main`. Built on @obielin's release resolution in #3845.\n- **Fewer live offers marked as closed.** Liveness now checks company pages with a Greenhouse `gh_jid`, SmartRecruiters, Arbeitsagentur and We Work Remotely through their public APIs (#4444), and a careers page that loads its ATS in an iframe is no longer read as a dead posting (#4439), both by @luochen211.\n- **Sharper scans.** Domain-level detection of aggregator reposts by @vaishaldsouza (#4263), an opt-in strict location filter that fails closed on empty locations by @Zoubeir23 (#4033), blacklist rows that can cover a whole domain (#4169), and a warning when a portal returns zero jobs without a single successful response (#4441), both by @luochen211.\n- **New sources.** A Python.org Jobs provider by @lasithadilshan (#4173), a generalist-world board provider by @ConnorCloze (#4100) and an explicit Personio tenant pin by @duathron (#4001), all three first contributions.\n\n### Updating\n\nYour agent offers this update at the start of your next session. If you declined an update prompt before, run this once to pick it up:\n\n```bash\nnode update-system.mjs apply --confirm\n```\n\nNew installs: `npx @santifer/career-ops init`.\n\n### Thank you\n\nThis release carries 112 pull requests from 63 people, 43 of them contributing for the first time.\n\n- @luochen211: #4168, #4169, #4308, #4369, #4370, #4371, #4372, #4373, #4377, #4378, #4438, #4439, #4440, #4441, #4442, #4443, #4444, #4451\n- @Zoubeir23: #4033, #4046, #4144, #4147, #4215, #4254, #4280, #4285\n- @rubicon: #3995, #4009, #4072, #4095, #4116, #4405, #4419\n- @abankar1: #3246, #3994, #3996, #4208\n- @maxmilian: #3925, #4028, #4074\n- @pmxlr8 (first contribution): #4270, #4283, #4305\n- @AdilAzhariOmsan: #4235, #4259\n- @ConnorCloze (first contribution): #4100, #4264\n- @duathron (first contribution): #3999, #4001\n- @ilyakanevskiy: #4238, #4252\n- @jaybarrett34 (first contribution): #4064, #4065\n- @jsmith7735 (first contribution): #4151, #4152\n- @prasta1 (first contribution): #4174, #4324\n- @rajatvarna (first contribution): #4145, #4146\n- @Schlaflied: #3638, #4096\n- @SulimanAbdulrazzaq (first contribution): #4240, #4288\n- @Tedion (first contribution): #4247, #4248\n- @TianHengZhuang (first contribution): #4244, #4376\n- @aohl1986-ohlcenter (first contribution): #4048\n- @aron-intframe (first contribution): #3944\n- @artemtrofymenko: #4284\n- @ashiwanikumar (first contribution): #4119\n- @ayushi-wq (first contribution): #3190\n- @BrianChung95 (first contribution): #4267\n- @c020627 (first contribution): #4041\n- @chshiv (first contribution): #4023\n- @coolchigi: #4194\n- @Duyanh090205 (first contribution): #3958\n- @eliador90: #3974\n- @evgenyponomarev (first contribution): #3814\n- @Fayaz-jani-git (first contribution): #2964\n- @felipe-NR: #4183\n- @glenelkin (first contribution): #3436\n- @harshkumar18-bzz (first contribution): #4293\n- @JarnDev (first contribution): #4191\n- @javimateo (first contribution): #4292\n- @jduffey1990 (first contribution): #4066\n- @JigarDPrajapati (first contribution): #4137\n- @kellymmcgrath: #4296\n- @L4XB (first contribution): #4142\n- @lasithadilshan (first contribution): #4173\n- @mbrow190: #4112\n- @mcgalleg (first contribution): #4132\n- @MicBun (first contribution): #3536\n- @mkriegl (first contribution): #4156\n- @Natchica (first contribution): #4291\n- @nikitacometa: #3926\n- @obielin: #3845\n- @peppe1337 (first contribution): #3954\n- @prateek942 (first contribution): #4239\n- @Rayan-and-beyond (first contribution): #4122\n- @rickvian (first contribution): #4282\n- @Rkrijn (first contribution): #4258\n- @sebastienfi: #4089\n- @sloemo01 (first contribution): #4331\n- @snuuym (first contribution): #4300\n- @TapiocaQAQ (first contribution): #4075\n- @tasmiarahmantanjin: #3161\n- @Thibaultjaigu (first contribution): #4030\n- @vaishaldsouza: #4263\n- @vliggio: #3906\n- @wajahathussain81 (first contribution): #2322\n- @ZxlDragonDoctor (first contribution): #4051\n<!-- /co:release-notes -->\n\n## [1.34.0](https://github.com/career-ops-hq/career-ops/compare/career-ops-v1.33.0...career-ops-v1.34.0) (2026-09-24)\n\n\n### Features\n\n* **cli:** add --help to cv-sync-check.mjs ([#4376](https://github.com/career-ops-hq/career-ops/issues/4376)) ([86a5cd3](https://github.com/career-ops-hq/career-ops/commit/86a5cd3300d5b826fd8b16f0b11101dc8dbeb8f3)), closes [#3565](https://github.com/career-ops-hq/career-ops/issues/3565)\n* **liveness:** check additional posting URLs through public APIs ([#4444](https://github.com/career-ops-hq/career-ops/issues/4444)) ([4bc53fc](https://github.com/career-ops-hq/career-ops/commit/4bc53fce68a89c420c0a68ec645ea6ad4523a4c7))\n* **providers:** add generalist-world board provider ([e85ff79](https://github.com/career-ops-hq/career-ops/commit/e85ff797ad7a0c3d97fd895072ad81cf44a0330a))\n* **providers:** add Python.org Jobs scanner provider ([24557b2](https://github.com/career-ops-hq/career-ops/commit/24557b2fbc713685b16071068601a61591eab319))\n* **providers:** support explicit personio tenant pin ([a639b15](https://github.com/career-ops-hq/career-ops/commit/a639b15404b042be03e71851dbd2a46ba0856b43))\n* **readme:** README v2 with a Sponsors section, welcoming SerpApi as sponsor ([6634b81](https://github.com/career-ops-hq/career-ops/commit/6634b81b2a57bd2bc1c1ec68df68d1ee1f98d2e4))\n* **scan:** add domain-level aggregator repost detection ([#4263](https://github.com/career-ops-hq/career-ops/issues/4263)) ([fe53d0b](https://github.com/career-ops-hq/career-ops/commit/fe53d0b6bfeb161e3c124b78e752708e9e77b0f9))\n* **scan:** opt-in location_filter.strict fails closed on empty locations ([#3276](https://github.com/career-ops-hq/career-ops/issues/3276)) ([#4033](https://github.com/career-ops-hq/career-ops/issues/4033)) ([98e62de](https://github.com/career-ops-hq/career-ops/commit/98e62de48483c61b06b8477cd7f63949d93e89c8))\n* **stats:** suggest portal pruning from observed history ([#4373](https://github.com/career-ops-hq/career-ops/issues/4373)) ([dbaffdf](https://github.com/career-ops-hq/career-ops/commit/dbaffdf46f7b3bfc5ae1ef807681960e30735102))\n* **update-system:** resolve to the latest release tag by default, not main ([#3845](https://github.com/career-ops-hq/career-ops/issues/3845)) ([ab18203](https://github.com/career-ops-hq/career-ops/commit/ab182031204794073beed66bee84da78e10c0517))\n\n\n### Bug Fixes\n\n* **agents:** stop quoting an injection example that blocks scanner-based hosts ([#4137](https://github.com/career-ops-hq/career-ops/issues/4137)) ([2f637a2](https://github.com/career-ops-hq/career-ops/commit/2f637a2a5d2279c96114ffe0826da80784d8f477))\n* align global score instructions across evaluation paths ([#4451](https://github.com/career-ops-hq/career-ops/issues/4451)) ([f0f1b8e](https://github.com/career-ops-hq/career-ops/commit/f0f1b8e961951708e2077137fb7c549d43c95e23))\n* **analyze-patterns:** an empty tracker is a new user, not a failed command ([727fae3](https://github.com/career-ops-hq/career-ops/commit/727fae3133f403b520f64ea370fb353fc9ed1c86))\n* **apply:** hand off Ashby submission to system browser ([#4443](https://github.com/career-ops-hq/career-ops/issues/4443)) ([41b212a](https://github.com/career-ops-hq/career-ops/commit/41b212a4646e6357f6af091cbb5eab4b3276bcbc))\n* **apply:** validate answers against live field limits ([#4442](https://github.com/career-ops-hq/career-ops/issues/4442)) ([77ec81b](https://github.com/career-ops-hq/career-ops/commit/77ec81bc71a003418ea00acd070020188c8779e7))\n* **ashby:** read the salary range from compensationTiers[].components[] ([#4331](https://github.com/career-ops-hq/career-ops/issues/4331)) ([71563c7](https://github.com/career-ops-hq/career-ops/commit/71563c71e333e65c0798cca4a2cc50147d6ad23a))\n* **audit-portals:** load providers/ from the checkout, not the data root ([#4240](https://github.com/career-ops-hq/career-ops/issues/4240)) ([88e2d93](https://github.com/career-ops-hq/career-ops/commit/88e2d93fefc170a180b8c444f0b04b49c3689b6a)), closes [#4171](https://github.com/career-ops-hq/career-ops/issues/4171)\n* **batch:** add adaptive rate-limit backoff ([#4370](https://github.com/career-ops-hq/career-ops/issues/4370)) ([0291477](https://github.com/career-ops-hq/career-ops/commit/029147719d5946fafdba7576cbb31dc869bccd82))\n* **batch:** escape ampersands in offer URLs ([d2cd237](https://github.com/career-ops-hq/career-ops/commit/d2cd23785a3364ab49d69481ecf8fd04e82f0c0a))\n* **batch:** give the worker a Windows-resolvable JD file path under Git Bash ([5d5729e](https://github.com/career-ops-hq/career-ops/commit/5d5729e4ccee258451c8a004a0084fcb51453d76))\n* **batch:** give the worker a Windows-resolvable JD file path under Git Bash ([d4ce630](https://github.com/career-ops-hq/career-ops/commit/d4ce63022162b515fcc1b99754a0f8b56bd2a475))\n* **batch:** parse scores locale-independently in batch-runner ([f24eac2](https://github.com/career-ops-hq/career-ops/commit/f24eac20c424aaaf11d038f9e00818ce6f6f631d))\n* **batch:** reject explicit zero offer limits ([#4308](https://github.com/career-ops-hq/career-ops/issues/4308)) ([455c006](https://github.com/career-ops-hq/career-ops/commit/455c006f826c2c276d695716b5395f93eb6b9750))\n* **batch:** require parent confirmation for delegated agency postings ([#4371](https://github.com/career-ops-hq/career-ops/issues/4371)) ([be0b54f](https://github.com/career-ops-hq/career-ops/commit/be0b54f35845d277aacf1cd87d83708c38590f4e))\n* **browser-extract:** normalize JSON-LD length comparison, reset stale title, accept IRI `@type` ([27c3325](https://github.com/career-ops-hq/career-ops/commit/27c3325230a0f677d03755c750a4912ed89d76c4))\n* **browser-extract:** read schema.org JobPosting when the DOM has no body ([5fefe46](https://github.com/career-ops-hq/career-ops/commit/5fefe460eb75084cccc4dac6cef0bdc4f3d5a146))\n* **browser-extract:** read schema.org JobPosting when the DOM has no body ([8b5c5be](https://github.com/career-ops-hq/career-ops/commit/8b5c5bee657c41f63abefd27f89405cb0bc47980))\n* **build-cv-html:** render each project bullets item as its own block ([#4300](https://github.com/career-ops-hq/career-ops/issues/4300)) ([39090cd](https://github.com/career-ops-hq/career-ops/commit/39090cdc703fe1c23824ba9d4c294e4a604c0332))\n* **ci:** check out base before runn