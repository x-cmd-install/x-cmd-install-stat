"2026-11-07T10:44:03Z"},{"id":720404534,"node_id":"RA_kwDOQqIp1M4q8IA2","name":"try-rs_1.7.13-1_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":480916,"digest":"sha256:cc6027369254f283669e7173251f766efb39bf73370c200a664c37aa4f1dcda1","download_count":3,"created_at":"2026-11-07T10:43:38Z","updated_at":"2026-11-07T10:43:38Z"}],"body":"This release improves shell safety, Windows compatibility, and workspace error handling.\n\n### Fixes\n\n- Treat workspace paths as literal data when generating navigation and editor commands, including apostrophes and other shell characters.\n- Keep shell navigation working with workspace options such as `--worktree` and panel visibility flags.\n- Preserve Unicode paths in Windows PowerShell 5.1 and restore the previous console encoding after capturing output.\n- Use literal paths in PowerShell so brackets in directory names are handled correctly.\n- Preserve Git worktree registration when renaming and moving workspaces. Run Git outside the affected directory to avoid Windows rename/delete locks.\n- Recognize repository names in Windows drive and UNC paths.\n- Fall back to the default workspace when the configured path list is empty.\n- Return a failure exit code when cloning fails, and restore terminal state after interface initialization errors.\n- Skip interactive shell setup prompts during non-interactive execution.\n\n### Validation\n\n- 222 automated tests passed on Linux.\n- 217 automated tests passed on Windows Server 2022 with MSVC, Windows PowerShell 5.1, PowerShell 7, and Nushell.\n- Opened and closed the TUI successfully in a real Windows console.\n- Windows CI now runs the test suite, including Nushell integration, instead of only checking compilation.\n- The release script now checks tests and pushes the release commit before publishing its tag.\n\n### After upgrading\n\nRegenerate your shell integration with `try-rs --setup <shell>` and restart your terminal to apply the updated wrappers. Supported values include `fish`, `bash`, `zsh`, `power-shell`, and `nu-shell`.\n\n[Full changelog](https://github.com/tassiovirginio/try-rs/compare/v1.7.12...v1.7.13)\n"}
