{"id":353581699,"author":{"login":"tenox7","id":8151602,"node_id":"MDQ6VXNlcjgxNTE2MDI=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCRf5_M4VEzqD","tag_name":"1.7.6","target_commitish":"master","name":"ttyplot 1.7.6","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-14T03:38:07Z","updated_at":"2026-07-14T05:19:17Z","published_at":"2026-07-14T05:19:17Z","assets":[],"body":"### New rendering modes\n- **braille line mode** (`-b`) \u2014 high-resolution 2\u00d74 dot plotting; two lines distinguished by color\n- **block / quadrant mode** (`-B`) \u2014 2\u00d72 block-element plotting, like `-b`\n- **fill** (`-f`) \u2014 fill the area under the line in braille/block mode (line 1)\n- **aalib ASCII-art mode** (`-A`) \u2014 experimental smooth ASCII line rendering, opt-in (`make AA=1`, requires aalib)\n- updated `dark` color scheme\n\n### Docs\n- expanded man page and README examples (stock-quote, memory-usage, etc.)\n\n### Build / CI fixes\n- Makefile: the opt-in aalib block now parses under **BSD make (bmake)** as well as GNU make (it used a GNU-only `ifdef`, which broke bmake builds)\n- `clang-format` the sources; misc lint\n\nRequires a wide-character `ncursesw`. For old operating systems without it, see the separate [1.4.1 legacy release](https://github.com/tenox7/ttyplot/releases/tag/1.4.1).\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
