{"id":359708447,"author":{"login":"0xNyk","id":93952610,"node_id":"U_kgDOBZmaYg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORPNUhM4VcLcf","tag_name":"v2.3.0","target_commitish":"main","name":"v2.3.0 \u2014 Dependency Security Patch, Toolchain Refresh & Locale Integrity","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-25T08:10:07Z","updated_at":"2026-07-25T08:10:11Z","published_at":"2026-07-25T08:10:11Z","assets":[],"body":"Mission Control 2.3.0 patches **13 known dependency vulnerabilities (8 high severity)** and is a recommended upgrade for all self-hosted operators \u2014 especially any instance exposed beyond localhost.\n\n## Security\n- **next 16.2.10 \u2192 16.2.11** \u2014 9 advisories including SSRF in Server Actions (GHSA-89xv-2m56-2m9x, GHSA-p9j2-gv94-2wf4), middleware/proxy bypass (GHSA-6gpp-xcg3-4w24), response cache confusion, and DoS\n- **sharp 0.34.5 \u2192 0.35.3** via bounded workspace override (GHSA-f88m-g3jw-g9cj, inherited libvips CVEs)\n- **brace-expansion** DoS patched on all three resolved major lines (GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg)\n- Transitive **postcss** forced to \u22658.5.18 (GHSA-r28c-9q8g-f849)\n\nNo Mission Control application code required security changes; the full protected quality gate passed unchanged on the patch series.\n\n## Added\n- `MC_DISABLE_RUNTIME_SCAN` environment flag to skip local CLI probing during runtime detection (#895)\n\n## Fixed\n- Locale parity restored across all 10 locales with a permanent guard test in the quality gate (#907); missing `calMode_day` translation (#894)\n\n## Changed\n- Test toolchain on current majors: vite 8, vitest 4, @vitejs/plugin-react 6 (#908) \u2014 production builds remain webpack\n\n## Upgrade\n1. Back up the database and runtime configuration\n2. Upgrade from the protected `v2.3.0` tag or corresponding immutable container digest\n3. No migrations; no configuration changes required\n\nFull notes: [docs/releases/2.3.0.md](https://github.com/builderz-labs/mission-control/blob/main/docs/releases/2.3.0.md) \u00b7 Changelog: [CHANGELOG.md](https://github.com/builderz-labs/mission-control/blob/main/CHANGELOG.md)"}
