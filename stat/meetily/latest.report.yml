T14:25:59Z","updated_at":"2026-11-13T14:26:02Z"},{"id":743944152,"node_id":"RA_kwDONif6fs4sV6_Y","name":"meetily_aarch64.app.tar.gz.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":404,"digest":"sha256:e40dae9da52654ad8de8a362d99c45242729acb059106dacb1bd4753dd2b1039","download_count":15,"created_at":"2026-11-13T14:26:02Z","updated_at":"2026-11-13T14:26:03Z"}],"body":"## What's Changed\r\n* fix(parakeet): download v3 from istupakov HF repo with Meetily user agent by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/805\r\n* feat(logging): persist bounded local diagnostics [skip ci] by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/755\r\n* fix(bundle): ship standard icon sizes in the Linux bundles by @passabilities in https://github.com/Zackriya-Solutions/meetily/pull/834\r\n* fix(linux): native PipeWire/PulseAudio capture and ALSA concurrency fixes by @loicfavory in https://github.com/Zackriya-Solutions/meetily/pull/822\r\n* fix(linux): identify audio devices by exact Pulse ID, separate from the label by @loicfavory in https://github.com/Zackriya-Solutions/meetily/pull/874\r\n* Add Linux packages to the release pipeline by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/893\r\n* feat(linux): add native system audio and harden recording device switching by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/882\r\n* docs: refresh agent guidance and contribution workflows by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/905\r\n* feat(linux): add native system audio and signed release packages by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/904\r\n* fix: polish v0.5.0 UI and resolve Linux capture backlog by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/909\r\n* Release v0.5.0: Linux support and recording reliability by @safvanatzack in https://github.com/Zackriya-Solutions/meetily/pull/907\r\n* fix: unblock v0.5.0 release builds (OpenSSL 4, Rust 1.100) by @sujithatzackriya in https://github.com/Zackriya-Solutions/meetily/pull/915\r\n* fix(ci): run validate-release on ubuntu-24.04 so minisign can be installed by @sujithatzackriya in https://github.com/Zackriya-Solutions/meetily/pull/916\r\n\r\n## Installation\r\n\r\n### Windows and macOS\r\n\r\n| Platform | Download Link | Instructions |\r\n|----------|---------------|-------------|\r\n| **Windows (x64)** | [.exe installer](https://github.com/Zackriya-Solutions/meetily/releases/download/v0.5.0/meetily_0.5.0_x64-setup.exe) | Download and run the installer |\r\n| **macOS (Apple Silicon)** | [.dmg installer](https://github.com/Zackriya-Solutions/meetily/releases/download/v0.5.0/meetily_0.5.0_aarch64.dmg) | Open the installer, drag **Meetily** to Applications, then open it from Applications |\r\n\r\n### Linux (recommended): one-line install\r\n\r\nRequires x86_64 Linux with glibc 2.35 or newer (.deb preferred, otherwise AppImage installed).\r\n\r\n```sh\r\ncurl -fsSL https://raw.githubusercontent.com/Zackriya-Solutions/meetily/main/scripts/install-linux.sh | sh\r\n```\r\n\r\n<details>\r\n<summary><b>Linux: installer options and manual installation</b></summary>\r\n\r\nPass options after `sh -s --`:\r\n\r\n```sh\r\n# Install the AppImage instead of the .deb\r\ncurl -fsSL https://raw.githubusercontent.com/Zackriya-Solutions/meetily/main/scripts/install-linux.sh | sh -s -- --appimage\r\n\r\n# Uninstall (keeps your meetings and settings unless you add --purge)\r\ncurl -fsSL https://raw.githubusercontent.com/Zackriya-Solutions/meetily/main/scripts/install-linux.sh | sh -s -- --uninstall\r\n```\r\n\r\nRun it with `--help` to see all options.\r\n\r\n#### Manual install (.deb / AppImage)\r\n\r\n| Package | Download Link | Instructions |\r\n|---------|---------------|--------------|\r\n| **.deb** (x64, Debian/Ubuntu-compatible) | [.deb package](https://github.com/Zackriya-Solutions/meetily/releases/download/v0.5.0/meetily_0.5.0_amd64.deb) | `sudo apt install ./meetily_0.5.0_amd64.deb`, or alternatively `sudo dpkg -i meetily_0.5.0_amd64.deb` |\r\n| **AppImage** (x64) | [AppImage](https://github.com/Zackriya-Solutions/meetily/releases/download/v0.5.0/meetily_0.5.0_amd64.AppImage) | `chmod +x meetily_0.5.0_amd64.AppImage`, then `./meetily_0.5.0_amd64.AppImage`. System dependencies still apply; see the [Linux guide](https://github.com/Zackriya-Solutions/meetily/blob/main/docs/building_in_linux.md) |\r\n\r\n</details>\r\n\r\n## New Contributors\r\n* @loicfavory made their first contribution in https://github.com/Zackriya-Solutions/meetily/pull/822\r\n\r\n**Full Changelog**: https://github.com/Zackriya-Solutions/meetily/compare/v0.4.1...v0.5.0","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":4}
