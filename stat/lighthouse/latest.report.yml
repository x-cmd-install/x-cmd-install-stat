ities for which classes of users should update particular components.\r\n\r\n|User Class |Beacon Node  | Validator Client|\r\n--- | --- | ---\r\n|Staking Users| Medium | Low |\r\n|Non-Staking Users| Medium |---|\r\n\r\n*See [Update Priorities](https://lighthouse-book.sigmaprime.io/installation_priorities.html) for more information about this table.*\r\n\r\n## Security Content\r\n\r\nThis section will be updated with security advisories as they are made public. We are not disclosing the security content of this release in order to give users time to upgrade.\r\n\r\n## Known Issues\r\n\r\nData column backfill can OOM, particularly on Gnosis chain. This is fixed in [v8.3.0-rc.0](https://github.com/sigp/lighthouse/releases/tag/v8.3.0-rc.0) and will be included in v8.3.0 shortly. We do not recommend re-syncing on v8.2.x unnecessarily, as this issue affects every prior release of Lighthouse as well.\r\n\r\n## All Changes\r\n\r\n- Release v8.2.3\r\n- Bump quinn\r\n- Cherry-pick lint fixes\r\n- Cherry Pick Update Docker builder to Debian Bookworm (#9984)\r\n- Cherry Pick Attempt to fix flaky fallback simulator test (#9908)\r\n- Cherry Pick Tolerate empty sync aggregates in the basic simulator (#9781)\r\n\r\n## Binaries\r\n\r\n[See pre-built binaries documentation.](https://lighthouse-book.sigmaprime.io/installation_binaries.html)\r\n\r\nThe binaries are signed with Sigma Prime's PGP key: `15E66D941F697E28F49381F426416DC3F30674B0`\r\n\r\n| System | Architecture | Binary | PGP Signature |\r\n|:---:|:---:|:---:|:---|\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/apple/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/apple\" ><img src=\"https://cdn.simpleicons.org/apple\" width=\"32\" alt=\"Apple logo\">  </picture> | aarch64 | [lighthouse-v8.2.3-aarch64-apple-darwin.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.2.3/lighthouse-v8.2.3-aarch64-apple-darwin.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.2.3/lighthouse-v8.2.3-aarch64-apple-darwin.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/linux/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/linux/black\" ><img src=\"https://cdn.simpleicons.org/linux\" width=\"32\" alt=\"Linux logo\"> </picture> | x86_64 | [lighthouse-v8.2.3-x86_64-unknown-linux-gnu.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.2.3/lighthouse-v8.2.3-x86_64-unknown-linux-gnu.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.2.3/lighthouse-v8.2.3-x86_64-unknown-linux-gnu.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/raspberrypi/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/raspberrypi/black\" > <img src=\"https://cdn.simpleicons.org/raspberrypi\" width=\"32\" alt=\"Raspberrypi logo\"> </picture> | aarch64 | [lighthouse-v8.2.3-aarch64-unknown-linux-gnu.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.2.3/lighthouse-v8.2.3-aarch64-unknown-linux-gnu.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.2.3/lighthouse-v8.2.3-aarch64-unknown-linux-gnu.tar.gz.asc) |\r\n| | | | |\r\n| **System** | **Option** | - | **Resource** |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/docker/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/docker/black\" > <img src=\"https://cdn.simpleicons.org/docker/black\" width=\"32\" alt=\"Docker logo\"></picture>  | Docker | [v8.2.3](https://hub.docker.com/r/sigp/lighthouse/tags?page=1&ordering=last_updated&name=v8.2.3) | [sigp/lighthouse](https://hub.docker.com/r/sigp/lighthouse) |\r\n"}
