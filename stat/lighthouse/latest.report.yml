ections).\r\n\r\nAs a reminder: all Hoodi users must upgrade to v8.3.x prior to Monday 26 Oct 2026. Please see v8.3.0's release notes for details if you are upgrading from v8.2.x:\r\n\r\n- https://github.com/sigp/lighthouse/releases/tag/v8.3.0\r\n\r\n## Update Priority\r\n\r\nThis table provides priorities for which classes of users should update particular components.\r\n\r\n|User Class |Beacon Node  | Validator Client|\r\n--- | --- | ---\r\n|Staking Users| High | High |\r\n|Non-Staking Users| Medium | --- |\r\n\r\n*See [Update Priorities](https://lighthouse-book.sigmaprime.io/installation_priorities.html) more information about this table.*\r\n\r\n## All Changes\r\n\r\n- Release v8.3.1\r\n- Fix CI audit failure (#10407)\r\n\r\n## Binaries\r\n\r\n[See pre-built binaries documentation.](https://lighthouse-book.sigmaprime.io/installation_binaries.html)\r\n\r\nThe binaries are signed with Sigma Prime's PGP key: `15E66D941F697E28F49381F426416DC3F30674B0`\r\n\r\n| System | Architecture | Binary | PGP Signature |\r\n|:---:|:---:|:---:|:---|\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/apple/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/apple\" ><img src=\"https://cdn.simpleicons.org/apple\" width=\"32\" alt=\"Apple logo\">  </picture> | aarch64 | [lighthouse-v8.3.1-aarch64-apple-darwin.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.3.1/lighthouse-v8.3.1-aarch64-apple-darwin.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.3.1/lighthouse-v8.3.1-aarch64-apple-darwin.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/linux/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/linux/black\" ><img src=\"https://cdn.simpleicons.org/linux\" width=\"32\" alt=\"Linux logo\"> </picture> | x86_64 | [lighthouse-v8.3.1-x86_64-unknow