lease does not contain a database schema migration or any breaking CLI changes.\r\n\r\nIf upgrading from a release prior to v8.2.1, please see release notes for v8.2.1 and v8.2.0:\r\n\r\n- https://github.com/sigp/lighthouse/releases/tag/v8.2.1\r\n- https://github.com/sigp/lighthouse/releases/tag/v8.2.0\r\n\r\n## Update Priority\r\n\r\nThis table provides priorities for which classes of users should update particular components.\r\n\r\n| User Class        | Beacon Node | Validator Client |\r\n|:------------------|:------------|:-----------------|\r\n| Staking Users     | High        | Low              |\r\n| Non-Staking Users | High        | ---              |\r\n\r\nSee [Update Priorities](https://lighthouse-book.sigmaprime.io/installation_priorities.html) for more information about this table.\r\n\r\n## Security Content\r\n\r\nThis section will be updated with security advisories as they are made public. We are not disclosing the security content of this release in order to give users time to upgrade.\r\n\r\n## Known Issues\r\n\r\nData column backfill can OOM, particularly on Gnosis chain. This is fixed on `unstable` and will be included in v8.3.0: https://github.com/sigp/lighthouse/pull/9665. We do not recommend re-syncing unnecessarily, as this issue affects every prior release of Lighthouse as well.\r\n\r\n## All Changes\r\n\r\n- Release v8.2.2\r\n- update deps\r\n\r\n## Binaries\r\n\r\n[See pre-built binaries documentation.](https://lighthouse-book.sigmaprime.io/installation_binaries.html)\r\n\r\nThe binaries are signed with Sigma Prime's PGP key: `15E66D941F697E28F49381F426416DC3F30674B0`\r\n\r\n| System | Architecture | Binary | PGP Signature |\r\n|:---:|:---:|:---:|:---|\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/apple/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/apple\" ><img src=\"https://cdn.simpleicons.org/apple\" width=\"32\" alt=\"Apple logo\">  </picture> | aarch64 | [lighthouse-v8.2.2-aarch64-apple-darwin.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.2.2/lighthouse-v8.2.2-aarch64-apple-darwin.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.2.2/lighthouse-v8.2.2-aarch64-apple-darwin.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/linux/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/linux/black\" ><img src=\"https://cdn.simpleicons.org/linux\" width=\"32\" alt=\"Linux logo\"> </picture> | x86_64 | [lighthouse-v8.2.2-x86_64-unknown-linux-gnu.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.2.2/lighthouse-v8.2.2-x86_64-unknown-linux-gnu.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.2.2/lighthouse-v8.2.2-x86_64-unknown-linux-gnu.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/raspberrypi/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/raspberrypi/black\" > <img src=\"https://cdn.simpleicons.org/raspberrypi\" width=\"32\" alt=\"Raspberrypi logo\"> </picture> | aarch64 | [lighthouse-v8.2.2-aarch64-unknown-linux-gnu.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.2.2/lighthouse-v8.2.2-aarch64-unknown-linux-gnu.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.2.2/lighthouse-v8.2.2-aarch64-unknown-linux-gnu.tar.gz.asc) |\r\n| | | | |\r\n| **System** | **Option** | - | **Resource** |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/docker/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/docker/black\" > <img src=\"https://cdn.simpleicons.org/docker/black\" width=\"32\" alt=\"Docker logo\"></picture>  | Docker | [v8.2.2](https://hub.docker.com/r/sigp/ligh