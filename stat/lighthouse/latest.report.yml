ease read the [v8.3.0 release notes](https://github.com/sigp/lighthouse/releases/tag/v8.3.0).\r\n\r\n## Update Priority\r\n\r\n| User Class        | Beacon Node | Validator Client |\r\n|:------------------|:------------|:-----------------|\r\n| Staking Users     | High        | Low              |\r\n| Non-Staking Users | High        | ---              |\r\n\r\n*See [Update Priorities](https://lighthouse-book.sigmaprime.io/installation_priorities.html) for more information about this table.*\r\n\r\n## Security Content\r\n\r\nLinks to security advisories will be provided here once network operators have had time to upgrade.\r\n\r\nYou can read a blog post about our handling of vulnerabilities here: https://sigmaprime.io/blog/bug-reports/\r\n\r\n## All Changes\r\n\r\n- Release v8.3.3\r\n- Update libp2p\r\n- Bump crypto-bigint\r\n- Build slasher tests as C17 to fix mdbx on GCC 15 (#10518)\r\n- Bump libz-sys to 1.1.31 (#10499)\r\n- Improve accuracy of is_infinity method\r\n- Fix commit hash not showing in release build (#10406)\r\n- Count inbound requests as active until their substream closes\r\n- reclaim timed-out inbound RPC substreams (#10486)\r\n- Use keys from state as well as pubkey cache\r\n\r\n## Binaries\r\n\r\n[See pre-built binaries documentation.](https://lighthouse-book.sigmaprime.io/installation_binaries.html)\r\n\r\nThe binaries are signed with Sigma Prime's PGP key: `15E66D941F697E28F49381F426416DC3F30674B0`\r\n\r\n| System | Architecture | Binary | PGP Signature |\r\n|:---:|:---:|:---:|:---|\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/apple/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/apple\" ><img src=\"https://cdn.simpleicons.org/apple\" width=\"32\" alt=\"Apple logo\">  </picture> | aarch64 | [lighthouse-v8.3.3-aarch64-apple-darwin.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.3.3/lighthouse-v8.3.3-aarch64-apple-darwin.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.3.3/lighthouse-v8.3.3-aarch64-apple-darwin.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/linux/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/linux/black\" ><img src=\"https://cdn.simpleicons.org/linux\" width=\"32\" alt=\"Linux logo\"> </picture> | x86_64 | [lighthouse-v8.3.3-x86_64-unknown-linux-gnu.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.3.3/lighthouse-v8.3.3-x86_64-unknown-linux-gnu.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.3.3/lighthouse-v8.3.3-x86_64-unknown-linux-gnu.tar.gz.asc) |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/raspberrypi/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/raspberrypi/black\" > <img src=\"https://cdn.simpleicons.org/raspberrypi\" width=\"32\" alt=\"Raspberrypi logo\"> </picture> | aarch64 | [lighthouse-v8.3.3-aarch64-unknown-linux-gnu.tar.gz](https://github.com/sigp/lighthouse/releases/download/v8.3.3/lighthouse-v8.3.3-aarch64-unknown-linux-gnu.tar.gz) | [PGP Signature](https://github.com/sigp/lighthouse/releases/download/v8.3.3/lighthouse-v8.3.3-aarch64-unknown-linux-gnu.tar.gz.asc) |\r\n| | | | |\r\n| **System** | **Option** | - | **Resource** |\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/docker/white\" > <source media=\"(prefers-color-scheme: light)\" srcset=\"https://cdn.simpleicons.org/docker/black\" > <img src=\"https://cdn.simpleicons.org/docker/black\" width=\"32\" alt=\"Docker logo\"></picture>  | Docker | [v8.3.3](https://hub.docker.com/r/sigp/lighthouse/tags?page=1&ordering=last_updated&name=v8.3.3) | [sigp/lighthouse](https://hub.docker.com/r/sigp/lighthouse) |\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"h