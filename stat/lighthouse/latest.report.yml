","updated_at":"2026-10-19T09:59:27Z"},{"id":655889926,"node_id":"RA_kwDOCFeAzc4nGBYG","name":"lighthouse-v8.3.0-aarch64-unknown-linux-gnu.tar.gz.asc","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":833,"digest":"sha256:b05aeea876cefb919be4b5086560d6236a43746524565d7e55151fb7750f49d0","download_count":10,"created_at":"2026-10-19T09:59:26Z","updated_at":"2026-10-19T09:59:26Z"},{"id":655889952,"node_id":"RA_kwDOCFeAzc4nGBYg","name":"lighthouse-v8.3.0-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":31360330,"digest":"sha256:686e076e23bc75ad592917c228a9c96558b2ac9a4cdaac99896f331fb7ae78f1","download_count":271,"created_at":"2026-10-19T09:59:26Z","updated_at":"2026-10-19T09:59:27Z"},{"id":655889927,"node_id":"RA_kwDOCFeAzc4nGBYH","name":"lighthouse-v8.3.0-x86_64-unknown-linux-gnu.tar.gz.asc","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":833,"digest":"sha256:97ed42c4636e82e453d0bb89e281af847984fdc2ee1a5d93bb2b57b94d8aeeba","download_count":57,"created_at":"2026-10-19T09:59:26Z","updated_at":"2026-10-19T09:59:26Z"}],"body":"## Summary\r\n\r\nLighthouse v8.3.0 is a **mainnet-ready release with support for the Gloas hard fork on Hoodi** :tada:. It also introduces the **Fast Confirmation Rule (FCR)**, enables partial data columns by default on all networks, and adds new builder configuration and validator features, along with security fixes and many other improvements since v8.2.3.\r\n\r\n**Hoodi operators must upgrade before 26 October 2026 at 17:42:48 UTC.** Update both the beacon node and validator client, together with a compatible execution client.\r\n\r\n**This release is suitable for mainnet, and we recommend that all mainnet users upgrade.** The Gloas fork is not yet scheduled on mainnet, so another release (v9.0.0) will be required for Gloas.\r\n\r\nThis release fixes several security issues. We will publish the details at a later date.\r\n\r\nIf you are upgrading from v8.2.x, please read the upgrade notes below. In particular:\r\n\r\n- The database is migrated automatically to **schema v32**.\r\n- Pre-built Linux binaries now require **glibc 2.34 or later** (e.g. Ubuntu 22.04, Debian 12, RHEL 9 or newer). Docker users are not affected.\r\n- Building from source now requires **Rust 1.91.0** or later and **`clang`**.\r\n- **Partial data columns** are now enabled by default on mainnet.\r\n\r\n## :polar_bear: Gloas on Hoodi\r\n\r\nThis release includes the fork epoch for Hoodi's **Gloas** upgrade, the consensus-layer half of **Glamsterdam**, paired with **Amsterdam** on the execution layer.\r\n\r\n| Network | Fork epoch | Fork slot | Activation time |\r\n|:--------|:-----------|:----------|:----------------|\r\n| Sepolia | 353024 | 11296768 | 6 October 2026, 13:53:36 UTC (activated) |\r\n| Hoodi | 132352 | 4235264 | **26 October 2026, 17:42:48 UTC** |\r\n| Mainnet | --- | --- | Not yet scheduled |\r\n\r\nSee the [Glamsterdam Hoodi announcement](https://blog.ethereum.org/en/2026/10/16/glamsterdam-hoodi-announcement) for compatible execution-client releases. The [Sepolia announcement](https://blog.ethereum.org/en/2026/09/17/glamsterdam-testnet-announcement) has the Sepolia details.\r\n\r\nGloas introduces **enshrined proposer-builder separation (ePBS)**. Lighthouse supports the associated block-production and builder workflows, including external builder bid selection, payload timeliness committee (PTC) duties, optimistic sync, and historical backfill.\r\n\r\nHoodi validators should review their builder configuration before the fork:\r\n\r\n- **External builders** are configured in `builder_definitions.yml` in the validator directory. This supports multiple builders, minimum bids, builder boost factors, and limits on trusted execution payments.\r\n- **Per-validator builder settings** can be managed through the keymanager API without restarting the validator client.\r\n- **Gas limits** follow the network's gas-limit schedule unless explicitly overridden. On Hoodi (as on Sepolia), the scheduled default becomes **200 million gas** at Gloas. Existing per-validator settings and an explicit `--gas-limit` take precedence. Mainnet has no gas-limit schedule, so its default remains 60 million.\r\n- **Builder circuit breaker**: After Gloas, the beacon node's builder circuit breaker counts blocks whose payloads were never revealed, rather than missed slots. A builder that fails to reveal its payload is also temporarily banned. The new `--builder-fallback-ban-slots` beacon node flag (default: 32) controls how long a ban lasts. See the [builder documentation](https://lighthouse-book.sigmaprime.io/advanced_builders.html) ([#10162](https://github.com/sigp/lighthouse/pull/10162)).\r\n\r\nSee the [builder configuration guide](https://lighthouse-book.sigmaprime.io/gloas_builder_config.html) for details. `builder_definitions.yml` only applies from the Gloas fork onwards. **Mainnet validators** using `mev-boost` via `--builder` do not need to change anything for this release.\r\n\r\nSince v8.3.0-rc.0, Gloas support has also gained:\r\n\r\n- **Web3Signer** compatibility: Gloas signing requests now follow `remote-signing-api` v1.4.0. Validators using Web3Signer must run **Web3Signer 26.9.0 or newer** before the fork ([#10207](https://github.com/sigp/lighthouse/pull/10207)).\r\n- Spec updates to consensus-specs `v1.7.0-beta.3` and `v1.7.0-beta.4` ([#10212](https://github.com/sigp/lighthouse/pull/10212), [#10307](https://github.com/sigp/lighthouse/pull/10307)).\r\n- Subscription to the next fork's gossip topics one epoch before the fork, for a smoother fork transition ([#10204](https://github.com/sigp/lighthouse/pull/10204)).\r\n- Fixes for PTC duties at the fork boundary, data-column pruning, and payload attribute preparation ([#10193](https://github.com/sigp/lighthouse/pull/10193), [#10286](https://github.com/sigp/lighthouse/pull/10286), [#10234](https://github.com/sigp/lighthouse/pull/10234)).\r\n- New standard Beacon API endpoints for Gloas (see the API changes below).\r\n\r\n## \u26a1 Fast Confirmation Rule\r\n\r\nLighthouse now supports the **Fast Confirmation Rule (FCR)**, which typically confirms blocks within **1\u20132 slots of the head** (12\u201324 seconds) under normal network conditions. Without FCR, confirmation takes about two epochs (~13 minutes).\r\n\r\nWhen enabled, Lighthouse supplies the FCR-confirmed execution block as the execution layer's `safe_block_hash`. Applications using the execution API's **`safe` block tag** therefore see confirmations much sooner. Ethereum's finalization process is unchanged. Unlike finality, fast confirmations rely on network synchrony assumptions, so applications that need the strongest guarantees should keep using the `finalized` tag.\r\n\r\nFCR is **disabled by default**. Enable it by adding the following flag to your beacon node:\r\n\r\n```text\r\n--enable-fast-confirmation\r\n```\r\n\r\n> [!IMPORTANT]\r\n> **We currently recommend enabling FCR only on non-validating beacon nodes**, such as nodes that serve RPC providers, wallets, bridges, indexers and other applications that read the `safe` block. FCR is a new feature, so please leave it disabled on beacon nodes that serve validators while we gain operational experience with it on mainnet.\r\n\r\nFCR works before and after Gloas and can be enabled independently of the fork.\r\n\r\nThis release also includes:\r\n\r\n- A `fast_confirmation` event on `/eth/v1/events`.\r\n- Prometheus metrics for confirmation delay, errors, and fallbacks, plus a Grafana dashboard in [lighthouse-metrics](https://github.com/sigp/lighthouse-metrics).\r\n- Persistence of confirmed roots across restarts, with restart behaviour updated to match the latest spec ([#10224](https://github.com/sigp/lighthouse/pull/10224)).\r\n\r\nSee the [Fast Confirmation Rule page in the Lighthouse Book](https://lighthouse-book.sigmaprime.io/advanced_fcr.html) for the expected logs, SSE events and metrics. The implementation is in [#8951](https://github.com/sigp/lighthouse/pull/8951) and [#10160](https://github.com/sigp/lighthouse/pull/10160).\r\n\r\n## \u26a0\ufe0f Upgrade Notes\r\n\r\n### \ud83d\udcbe Database schema upgrade\r\n\r\nThe beacon node automatically upgrades its database to **schema v32** on startup. This includes:\r\n\r\n- Fixes to light-client update storage.\r\n- Support for pruning finalized Gloas payload bodies.\r\n- A single tracker for the oldest stored blob and data-column data, which fixes pruning on freshly synced nodes ([#9957](https://github.com/sigp/lighthouse/pull/9957)).\r\n\r\nNodes running v8.3.0-rc.0 are migrated from schema v31 to v32 automatically.\r\n\r\nTo downgrade to **v8.2.x**, stop the beacon node and use the **v8.3.0 binary** to migrate the database back to **schema v29** before switching binaries. Downgrading is supported **only before Gloas**. It is not possible on Sepolia, and on Hoodi it is only possible before the fork. Follow the [database downgrade instructions](https://lighthouse-book.sigmaprime.io/advanced_database_migrations.html#how-to-apply-a-database-downgrade).\r\n\r\n### \ud83d\udc27 Linux binary requirements\r\n\r\nPre-built Linux binaries are now built natively on Debian Bookworm and require **glibc 2.34 or later** (previously 2.18) ([#10283](https://github.com/sigp/lighthouse/pull/10283)):\r\n\r\n- **Supported**: Ubuntu 22.04+, Debian 12+, RHEL 9+ and other distributions with glibc \u2265 2.34. Docker users are not affected.\r\n- **No longer supported by the pre-built binaries**: Ubuntu 20.04, Debian 11, RHEL 8 and other distributions with older glibc versions.\r\n\r\nYou can check your glibc version with `ldd --version`. Users on older distributions should switch to the [Docker image](https://hub.docker.com/r/sigp/lighthouse), [build from source](https://lighthouse-book.sigmaprime.io/installation_source.html), or upgrade their operating system.\r\n\r\n### \ud83e\udd80 Building from source\r\n\r\nIf you build Lighthouse from source:\r\n\r\n- The minimum supported Rust version (MSRV) is now **1.91.0** (previously 1.88.0). Update with `rustup update stable`.\r\n- **`clang`** is now required, as it is used to compile C++ dependencies. Install it with your package manager (e.g. `sudo apt install clang`) if it is not already present. See the [build-from-source instructions](https://lighthouse-book.sigmaprime.io/installation_source.html).\r\n\r\n### \ud83d\udcbb API changes\r\n\r\nUsers maintaining validator middleware, builder/relay infrastructure or API integrations should review these changes:\r\n\r\n- **Builder API**: Lighthouse no longer falls back to the deprecated `submitBlindedBlock` v1 endpoint, and now uses only `submitBlindedBlockV2` ([#10213](https://github.com/sigp/lighthouse/pull/10213)). Mainnet users of `mev-boost` or other builder sidecars should make sure they run an up-to-date release.\r\n- Gloas block production uses **`POST /eth/v4/validator/blocks/{slot}`**, with builder configuration in the request body and a required `include_payload` query parameter. The `Eth-Builder-Url` response header must be forwarded when publishing the block.\r\n- The non-standard `late_head` SSE event has been removed.\r\n- The `data_column_sidecar` SSE event no longer includes `kzg_commitments` or `versioned_hashes`.\r\n- The keymanager API's `GET /eth/v1/validator/{pubkey}/graffiti` returns a plain string instead of a hex-encoded string.\r\n- `GET /eth/v1/beacon/blobs/{block_id}` now returns blobs in the order of the block's KZG commitments, regardless of the order of the requested `versioned_hashes` ([#9944](https://github.com/sigp/lighthouse/pull/9944)).\r\n- New Gloas endpoints: `GET /eth/v1/beacon/proposer_preferences`, `GET /eth/v1/beacon/states/{state_id}/ptc`, `GET /eth/v1/beacon/states/{state_id}/builder_pending_withdrawals` and `GET /eth/v1/beacon/states/{state_id}/builder_pending_payments`. All of them support JSON and SSZ ([#10268](https://github.com/sigp/lighthouse/pull/10268), [#10256](https://github.com/sigp/lighthouse/pull/10256), [#10285](https://github.com/sigp/lighthouse/pull/10285)).\r\n- After Gloas, the `block` SSE event includes `builder_index` and `block_hash`, and the `payload_attributes` SSE event includes `safe_block_hash` and `finalized_block_hash` ([#10333](https://github.com/sigp/lighthouse/pull/10333), [#10244](https://github.com/sigp/lighthouse/pull/10244)).\r\n\r\n## \ud83e\udde9 Partial Data Columns\r\n\r\nPartial data columns are now **enabled by default on all networks**, including mainnet, following their deployment on Hoodi and Sepolia. Mainnet nodes upgrading from v8.2.x will start using them automatically.\r\n\r\nThis reduces data-column propagation bandwidth by using data already available from the execution client. This release also adds partial-column support for Gloas, and hardens validation of partial-column headers ([#10334](https://github.com/sigp/lighthouse/pull/10334)).\r\n\r\nTo opt out, use:\r\n\r\n```text\r\n--enable-partial-columns false\r\n```\r\n\r\nSee [#9896](https://github.com/sigp/lighthouse/pull/9896).\r\n\r\n## \ud83d\udda5\ufe0f CLI Changes\r\n\r\nThe following CLI flags were added or changed since v8.2.3. No flags were removed, so existing configurations continue to work.\r\n\r\n**Beacon node**\r\n\r\n- **Changed** `--builder-fallback-skips` and `--builder-fallback-skips-per-epoch`: After Gloas, these count blocks whose payloads were not revealed. External bids are then only used if the local build fails.\r\n\r\n**Validator client**\r\n\r\n- **New** `--stateless-block-production`: Publishes self-built Gloas payload envelopes through any configured beacon node ([#10036](https://github.com/sigp/lighthouse/pull/10036)).\r\n- **Changed** `--gas-limit`: If unset, the network's gas-limit schedule is used, falling back to 60,000,000. This makes no difference on mainnet.\r\n\r\n**Validator manager**\r\n\r\n- **New** `lighthouse validator_manager create --compounding`: Creates validators with `0x02` (compounding) withdrawal credentials ([#9702](https://github.com/sigp/lighthouse/pull/9702)).\r\n\r\n## Other Notable Changes\r\n\r\n- **Data column backfill OOM fixed**: Fixed the data column backfill memory blow-up listed as a known issue in v8.2.x, which particularly affected Gnosis chain. Excessive data-column requests and custody-backfill request accumulation are also fixed ([#9665](https://github.com/sigp/lighthouse/pull/9665), [#10048](https://github.com/sigp/lighthouse/pull/10048)).\r\n- **System CA certificates trusted again**: Outbound HTTPS connections (e.g. to Web3Signer, checkpoint sync servers or remote beacon nodes) once again trust certificate authorities installed in the system trust store, as well as the bundled public roots. This fixes a regression in v8.2.0 ([#10110](https://github.com/sigp/lighthouse/pull/10110)).\r\n- **Distributed validator aggregation fix**: Fixed a bug where the VC in `--distributed` mode with middleware such as Charon always sent `is_aggregator: false` in beacon committee subscriptions ([#9947](https://github.com/sigp/lighthouse/pull/9947)).\r\n- **Stateless Gloas block production**: The validator client's new `--stateless-block-production` flag allows a locally built payload envelope to be published through any configured beacon node, improving compatibility with fallback and distributed-validator setups ([#10036](https://github.com/sigp/lighthouse/pull/10036)).\r\n- **More timely validator messages**: Sync committee messages are signed on head events, and payload timeliness votes are published when payload data becomes available ([#9675](https://github.com/sigp/lighthouse/pull/9675), [#9434](https://github.com/sigp/lighthouse/pull/9434)).\r\n- **Sync and peer scoring fixes**: Fixed Gloas sync failing to resume after restart, and fixed honest peers being banned after a failed sync of the canonical chain. Peers that report a conflicting finalized root are now rejected ([#9940](https://github.com/sigp/lighthouse/pull/9940), [#10346](https://github.com/sigp/lighthouse/pull/10346), [#10288](https://github.com/sigp/lighthouse/pull/10288)).\r\n- **Light-client fixes**: Corrected update range queries and update streaming ([#9668](https://github.com/sigp/lighthouse/pull/9668), [#9643](https://github.com/sigp/lighthouse/pull/9643)).\r\n- **Gnosis proposer re-org fix**: Fixed rounding of the proposer re-org cutoff on networks with 5-second slots ([#10102](https://github.com/sigp/lighthouse/pull/10102)).\r\n- **ENR fork advertisement fix**: The ENR now advertises the correct `next_fork_version` when a BPO fork is scheduled before the next regular fork, so other clients can still discover Lighthouse peers during that window ([#10161](https://github.com/sigp/lighthouse/pull/10161)).\r\n- **`/lighthouse/nat` fix**: The discv5 NAT status is now reported correctly without first scraping the metrics endpoint ([#9303](https://github.com/sigp/lighthouse/pull/9303)).\r\n- **Mplex**: Mplex remains enabled by default. The removal announced in v8.2.0 has been postponed.\r\n- **Experimental execution proofs**: Experimental support for EIP-8025 execution proofs via `--proof-engine-endpoint` and `POST /eth/v1/beacon/execution_proofs`. Not intended for production use ([#10198](https://github.com/sigp/lighthouse/pull/10198), [#10210](https://github.com/sigp/lighthouse/pull/10210), [#10262](https://github.com/sigp/lighthouse/pull/10262)).\r\n\r\n## Known Issues\r\n\r\nThere is an incompatibility between LH v8.3.0 and Besu versions prior to 26.10.0. Regardless of network, Besu users must upgrade to Besu 26.10.0 prior to updating the Lighthouse BN. See https://github.com/sigp/lighthouse/issues/10186.\r\n\r\n## Update Priority\r\n\r\nThis table provides priorities for which classes of users should update particular components.\r\n\r\n| User Class | Beacon Node | Validator Client |\r\n|:-----------|:------------|:-----------------|\r\n| Staking Users (Hoodi & Sepolia) | **High** | **High** |\r\n| Non-Staking Users (Hoodi & Sepolia) | **High** | --- |\r\n| Staking Users (mainnet & other networks) | High | Medium |\r\n| Non-Staking Users (mainnet & other networks) | High | --- |\r\n\r\n*See [Update Priorities](https://lighthouse-book.sigmaprime.io/installation_priorities.html) for more information about this table.*\r\n\r\nHoodi users must update both the beacon node and validator client before the fork, together with their execution client. Mainnet users should prioritise updating the beacon node to receive the security fixes. Updating the validator client is recommended, especially for distributed-validator setups, but less urgent.\r\n\r\n## All Changes\r\n\r\n- Release v8.3.0\r\n- Update `zip` crate to fix CI audit failure (#10378)\r\n- Bump libp2p to patched version\r\n- Skip unslashable proposer slashings\r\n- Processor limits\r\n- Limit requests at request time instead of response time\r\n- Fix validator is not aggregator when VC is in DVT mode involving middleware (#9947)\r\n- Implement `GET beacon/proposer_preferences` endpoint (#10268)\r\n- Gloas builder circuit breaker (#10162)\r\n- Convert `network` and `lighthouse_network` tests to Spec (#10290)\r\n- fix(network): reject conflicting finalized roots at the same epoch (#10288)\r\n- Update `rustls` to fix CI (#10355)\r\n- Don't ban peers whose finalized root is in failed_chains (#10346)\r\n- Implement `builder_pending_withdrawals` and `builder_pending_payments` state getter endpoints (#10285)\r\n- Implement PTC state getter endpoint (#10256)\r\n- refactor(network): group peer_manager RPC protocol match arms (#10297)\r\n- Remove the Router and dispatch network events directly (#10122)\r\n- Drop PayloadVerificationStatus::is_optimistic (#10335)\r\n- Propagate error for ``import_execution_payload_envelope`` (#10332)\r\n- Add builder bid identity to the block event (#10333)\r\n- Limit commitments in partial data column header (#10334)\r\n- Reject future-slot blocks before writing to the `block_times_cache` (#10331)\r\n- Reject `SingleAttestation` with large index earlier (#10330)\r\n- Remove unused return value and rename `ingoing` to `incoming` in peer manager (#9973)\r\n- Build Linux binaries natively instead of with cross (#10283)\r\n- Validate the slot of Gloas RPC data columns against the bid (#10327)\r\n- Pass ChainSpec to get_proposer_head instead of three threshold args (#10324)\r\n- Prune Gloas data columns past withheld payloads and on abandoned forks (#10286)\r\n- Gloas spec v1.7.0-beta.4 (#10307)\r\n- Implement gossip verification of inclusion lists (#10182)\r\n- Use should_build_on_full when preparing Gloas payload attributes (#10234)\r\n- Schedule Gloas on Hoodi (#10304)\r\n- Fix proposer re-org cutoff rounding on 5s slots (#10102)\r\n- Propagate optimistic head errors (#10296)\r\n- Fix lcli http-sync --known-common-ancestor argument parsing (#10245)\r\n- Fix incorrect discv5 NAT status in /lighthouse/nat (#9303)\r\n- Enable Gloas in the simulator tests (#10292)\r\n- Move release builds to GitHub-hosted runners (#10282)\r\n- Gloas spec v1.7.0-beta.3 (#10212)\r\n- Tweak FCR restart logic to match latest spec (#10224)\r\n- Resolve the fork from the block slot when loading the http-sync cache (#10276)\r\n- Unify `BlobInfo` and `DataColumnInfo` into `DataInfo` (#9957)\r\n- Fix cross builds after cc bump (#10278)\r\n- Split `http_api` tests by preset (#10284)\r\n- Gloas progressive merkle proofs (#9790)\r\n- Fix empty BlocksByRoot responses during Gloas column publish (#9976)\r\n- Split `beacon_chain` tests by preset (#10246)\r\n- Add POST /eth/v1/beacon/execution_proofs (#10210)\r\n- Make the execution layer optional with proof engine (#10262)\r\n- Implement optional proofs with fork-choice optimistic (#10198)\r\n- update libp2p (#10229)\r\n- Add `safe_block_hash` and `finalized_block_hash` to Payload Attributes event (#10244)\r\n- Add inclusion_list_bits to ExecutionPayloadBid (#9729)\r\n- Align the EIP-8025 proof types and gossip rules with the spec (#10236)\r\n- Fix blob ordering when filtering blobs by versioned hash (#9944)\r\n- Fix PTC duties at the Gloas fork boundary (#10193)\r\n- Bump PTC SSE queue (#10239)\r\n- Split up EF tests to run each preset separately (#10237)\r\n- Fix Web3Signer Gloas request types for remote-signing-api v1.4.0 (#10207)\r\n- Revert the execution proof availability gate (#10233)\r\n- Add compile-time Spec alias and migrate types tests (#10158)\r\n- Add documentation for fast confirmation rule (#10183)\r\n- Use payload envelope summary in head snapshot and block production (#10187)\r\n- Remove deprecated builder `submitBlindedBlock` v1 (#10213)\r\n- Propagate beacon chain database read errors (#10217)\r\n- Subscribe to next fork topics an epoch early (#10204)\r\n- Fix nightly tests failing on phase0 and altair (#10200)\r\n- Trust the system CA store for outbound HTTPS (#10110)\r\n- Remove redundant todo (#10195)\r\n- Keep ENR next_fork_version at a BPO fork (#10161)\r\n- Add IL committee duties polling to the VC (#9799)\r\n- Simplify fork boilerplate (#10164)\r\n\r\n## Binaries\r\n\r\n[See pre-built binaries documentation.](https://lighthouse-book.sigmaprime.io/installation_binaries.html)\r\n\r\nThe binaries are signed with Sigma Prime's PGP key: `15E66D941F697E28F49381F426416DC3F30674B0`\r\n\r\n| System | Architecture | Binary | PGP Signature |\r\n|:---:|:---:|:---:|:---|\r\n| <picture> <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://cdn.simpleicons.org/apple/white\" > <source 