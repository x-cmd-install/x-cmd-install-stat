ow-body-style: Keep type assertions when adding a block body (#27978) (Yan Almeida)","reactions":{"total_count":8,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":6,"rocket":0,"eyes":0}}
