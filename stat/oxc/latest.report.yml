r file across type-aware diagnostics (#27462) (Max Schwenk)\n- 19c227d minifier: Use ident when checking specific id names (#27208) (Armano)\n\n### \ud83d\udcda Documentation\n\n- 98cc2b4 linter/plugins: Improve documentation for `firstCommentAtOrAfter` (#27538) (overlookmotel)\n- 3bb54f6 linter: Update stale comment (#27519) (overlookmotel)\n- 848a4e7 linter: Update fix metadata for tsgolint rules that already provide fixes (#27408) (Mikhail Baev)","reactions":{"total_count":8,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":5,"rocket":0,"eyes":0}}
