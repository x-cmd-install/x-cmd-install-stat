":"uploaded","size":16465862,"digest":"sha256:28e750b95bb4c260f3cad13a22c00392004bdb63d8650161dda51068db605ac1","download_count":1,"created_at":"2026-11-13T07:37:32Z","updated_at":"2026-11-13T07:37:33Z"}],"body":"## 🚀 Release v1.4.5\n\n### Added\n\n- **WinGet preparation**: Added initial Windows x64 portable manifests for the existing v1.4.4 release and a local validation, install/upgrade/uninstall, and upstream submission guide. The package is not yet published to WinGet ([#170](https://github.com/devnullvoid/pvetui/issues/170)).\n\n### Fixed\n\n- **Node guest counts**: Separate QEMU VM and LXC counts in node details, count templates separately from stopped guests, and match the source profile when node names repeat across grouped profiles. Unknown LXC states are no longer reported as stopped.\n\n- **SSH agent authentication**: Keep command-runner agent connections open until SSH authentication finishes, fixing handshake failures reporting a closed agent socket for direct and jump-host connections.\n\n- **Homebrew cask generation**: Generate the supported `postflight_steps` hook without obsolete RuboCop suppressions, preserving compatibility with current Homebrew validation ([#180](https://github.com/devnullvoid/pvetui/issues/180), [#182](https://github.com/devnullvoid/pvetui/issues/182)).\n\n- **Dependency CI**: Automatically run test, lint, and platform-build checks after CI commits a verified Nix dependency hash, with a final-commit status that stays pending until all checks finish, without manually reopening the PR. Fork PRs remain read-only ([#177](https://github.com/devnullvoid/pvetui/issues/177)).\n\n- **Guest shell targeting**: Keep context-menu Shell actions bound to the guest that opened the menu, preventing selection changes or filtered-list refreshes from redirecting SSH to another guest ([#174](https://github.com/devnullvoid/pvetui/issues/174)).\n\n- **Nix builds**: Updated the pinned Nix package set and aligned the build and development-shell toolchains with Go 1.26. Dependency hash updates now verify the rebuilt binary and fail on unexpected errors rather than reporting false success ([#172](https://github.com/devnullvoid/pvetui/issues/172)).\n\n"}
