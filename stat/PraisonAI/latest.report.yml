{"id":451643188,"author":{"login":"praisonai-triage-agent[bot]","id":272766704,"node_id":"BOT_kgDOEEIW8A","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOLinjCM4a64c0","tag_name":"v4.8.0","target_commitish":"main","name":"v4.8.0: Security hardening release","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-19T16:53:35Z","updated_at":"2026-11-19T17:05:57Z","published_at":"2026-11-19T16:53:42Z","assets":[{"id":768522557,"node_id":"RA_kwDOLinjCM4tzrk9","name":"PraisonAI-v4.8.0-linux-x64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2332808,"digest":"sha256:591354448c265cab78be177484987e66e68ac52232bcb7308da532d3ccbc5a2b","download_count":8,"created_at":"2026-11-19T17:04:20Z","updated_at":"2026-11-19T17:04:20Z"},{"id":768528547,"node_id":"RA_kwDOLinjCM4tztCj","name":"PraisonAI-v4.8.0-macos-apple-silicon.dmg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":2008302,"digest":"sha256:c60c7491ebb2d46fef1ca606c60797b266541f0027b14ea7598a0c5e8166d08e","download_count":2,"created_at":"2026-11-19T17:05:57Z","updated_at":"2026-11-19T17:05:57Z"},{"id":768518441,"node_id":"RA_kwDOLinjCM4tzqkp","name":"PraisonAI-v4.8.0-windows-x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":1487821,"digest":"sha256:04671e4fe82df13c2ca9679576845fca06f32189a6fa599fb65738bef1c56ec5","download_count":10,"created_at":"2026-11-19T17:03:01Z","updated_at":"2026-11-19T17:03:02Z"}],"body":"# Security hardening release\n\nThis release makes PraisonAI safer by default. Servers stay on your own machine unless you give them a token. Tools that read files, fetch URLs or run code now stay inside clear limits. A project you clone can no longer change your trust settings.\n\nMost users need to do nothing. If a change stops something you rely on, the [Migration](#migration) table names the setting that brings the old behaviour back.\n\n## Packages in this release\n\n| Package | Version |\n|---|---|\n| `praisonaiagents` (PyPI) | `1.8.0` |\n| `praisonai` (PyPI) | `4.8.0` |\n| `praisonai-code` (PyPI) | `0.2.0` |\n| `praisonai-bot` (PyPI) | `0.2.0` |\n| `praisonai-mcp` (PyPI) | `0.2.0` |\n| `praisonai-sandbox` (PyPI) | `0.2.0` |\n| `praisonai-browser` (PyPI) | `0.2.0` |\n| `praisonai-deploy` (PyPI) | `0.2.0` |\n| `praisonai-train` (PyPI) | `0.2.0` |\n| `praisonai` (npm) | 1.8.0, follows shortly |\n| PraisonAI Desktop | `4.8.0` |\n\nUpgrade with:\n\n```bash\npip install -U praisonai          # installs every Python package above\nnpm install praisonai@latest      # TypeScript SDK (1.8.0, follows shortly)\n```\n\n## Servers and binds\n\nOne rule now applies to every built-in server: it listens on `127.0.0.1` by default. A server that you open to the network needs a token.\n\n- Every network server binds `127.0.0.1` by default.\n- A non-loopback bind without a token refuses to start, with a message that names the setting to use. This covers `AgentServer`, the Jobs API, `praisonai serve agents/a2a/unified/openai`, `rag serve`, `registry serve`, `recipe serve`, AgentOS (Python and TypeScript, including `serve({ host })`), the call server, praisonai-browser remote mode, the TypeScript MCP server and the N8N listener.\n- `praisonai call --public` needs `CALL_SERVER_TOKEN`.\n- Webhook receivers without a signing secret stay on loopback. `HTTPApproval` on a public host needs `allowed_approvers`.\n- `A2A.serve()`, MCP over SSE and `launch()` still start on a public host, but print a generated token that every request must send.\n- A2A on loopback checks `PRAISONAI_LAUNCH_AUTH_TOKEN` when it is set. `/info` needs the token when one is set.\n- The dashboard and the replay viewer follow the same bind rule.\n- A Jobs API started with `uvicorn ...:create_app --factory` and no key answers only `/health`, unless `PRAISONAI_JOBS_BIND_HOST=127.0.0.1` says it is local.\n- Keyless local servers refuse requests from other websites (a foreign or `null` Origin) and requests with a non-local `Host`. If you use a reverse proxy, keep `Host: localhost` or set a key.\n- Request bodies are capped: 10 MB on the MCP HTTP-stream server and 25 MB on the gateway. Larger bodies get `413`.\n- Token checks use constant-time comparison.\n- The recipe server keeps bounded per-client rate-limit and metrics state.\n- On the MCP server, `tools/search` needs `tools:read`, and a method with no scope mapping needs `admin`.\n- The desktop engine answers only requests addressed to a local host name.\n\n## Gateway and bots\n\n- The local gateway refuses browser pages from other sites (HTTP and WebSocket) unless the origin is listed in `GATEWAY_ALLOWED_ORIGINS`.\n- With a scope policy, `/v1/*` and `/mcp` need the `write` scope, and `/api/pairing/pending` needs `pairing`.\n- With a scope policy, a session resumes only for the token that created it.\n- At most 1000 HTTP API sessions stay live. The oldest idle one is closed and can be resumed from the store.\n- On a gateway with a token, unauthenticated `/health` shows only the status.\n- People who cannot message a bot cannot press its buttons or run its slash commands.\n- With `admin_users` set, `/undo`, `/blueprint` and `/automations` are admin-only.\n- An email or AgentMail bot with no `allowed_users` and the default `unknown_user_policy` (`deny`) no longer answers unknown senders.\n- In a shared Slack channel, an unthreaded \"yes\" no longer counts as an approval when the bot cannot read thread replies. The request times out and is denied.\n- Bot daemon install refuses a config path that contains `\"`, `%` or a control character.\n- `session_search` returns only sessions of the current user, then of the current agent.\n\n## Outbound fetching\n\nTools that fetch a URL now use one shared check. It refuses private, loopback and cloud-metadata addresses, and pins the address it checked.\n\n- URL readers, fetch tools, document loaders, image `.save()`, the praisonai-code `image` command, MCP OAuth and OIDC metadata, remote instruction sources and bot inbound media refuse private and loopback addresses. Set `ALLOW_LOCAL_CRAWL=true` to fetch local services in development.\n- Webhooks to `100.64.0.0/10` are refused.\n- Bot media URLs written in IPv4-in-IPv6 form are refused.\n- MCP OAuth follows a metadata redirect through a plain-HTTP hop when the final document is HTTPS. (It used to refuse.)\n- crawl4ai crawls (optional `[crawl]` extra) stop browser requests to blocked addresses, and return an error instead of content when the final URL is blocked. Known limit: a browser redirect can still send one request to a blocked address before it is stopped; no response content is returned. If this matters, add network-level egress rules.\n- JIRA tools that use `JIRA_API_TOKEN` from the environment need `JIRA_URL`, and send the token only to that origin.\n- `OpenAPIToolset(spec_url=..., auth=...)` raises when the fetched spec names a server on another origin. Pass `base_url=` to choose the server.\n- Jobs webhooks open one connection per notification.\n\n## File paths\n\nFile tools now stay inside the folder you work in, unless you give them another root.\n\n- FastContext search tools, MCP file tools, the wrapper `list_files`, and the screenshot, crawl and dataset helpers stay inside the current directory unless given a root.\n- The `grep_search`, `glob_files` and `glob_directories` tools default to the current directory. `PRAISONAI_WORKSPACE` sets another root.\n- `multiedit(workspace_root=...)` may only narrow the current directory, not widen it.\n- Recipe registry names and versions, and action-orchestrator file steps, resolve only inside their own folder.\n- `FileTools.list_files` skips matches reached through a symlink that leaves the folder.\n- A project rule file's `@~/` import reads only Markdown files in your home folder. User-level rule files are unchanged.\n- Memory checkpoints skip, and restores refuse, paths outside the current directory.\n- Recipe `trace_name` values with `/`, `\\` or `..` are refused. The run still completes, without history.\n- Recipe bundles that contain links fail to install on a Python without the `tarfile` data filter.\n- Bot `send_message` attachments must be inside the agent workspace, the current directory or `allow_roots`.\n- Bot custom commands read `@file` only under the bot's current directory.\n- The CLI `SandboxExecutor` (BASIC and STRICT) refuses `../`, `~` and quoted paths into blocked folders, and paths outside `allowed_paths`. Absolute paths inside its run directory are allowed.\n\n## Project-file trust\n\nA project file is a file in the folder you run in, such as `.praisonai/config.yaml`, `praisonai.yaml`, or command and agent front matter. It may tune behaviour. It can no longer grant a capability. Those settings now count only from your user config (`~/.praisonai`), the environment or code.\n\n- MCP servers named in a project file start only if their command line is listed under `mcp.trusted_servers` in `~/.praisonai/config.yaml`.\n- An MCP `url` that is not a URL never starts a process.\n- A project file can no longer set the model endpoint or API key, open the project-plugin gate, turn on `!`cmd`` shell expansion, add `allow` permission rules, or send `${VAR}` values to an untrusted remote MCP server. Each ignored key logs a warning that names the user setting to use instead.\n- `PRAISONAI_ALLOW_LOCAL_TOOLS` alone no longer loads an included recipe's `tools.py` from outside the current directory. That needs `PRAISONAI_ALLOW_TEMPLATE_TOOLS=true`.\n- `create_tool_registry_with_overrides(tools_sources=...)` needs `PRAISONAI_ALLOW_TEMPLATE_TOOLS=true`.\n- CLI \"always allow\" and \"always deny\" choices now live in `$PRAISONAI_HOME/permissions/projects/<id>`. Old copies inside a project are ignored with a warning.\n\n## Approvals\n\n- Tools that send or act for you need approval by default: `send_email` and the other mail-sending tools, `send_message`, `ask_conversation`, mail drafts, archive and `create_inbox`, `schedule_*` changes, and `execute_code_with_tools`. In a terminal you are asked. With no way to ask, the call is denied. Bots with `auto_approve_tools` are unchanged.\n- A tool with the same name as one of these is gated the same way.\n- \"This session\" and \"always\" grants for tools other than shell and file tools cover the same arguments only.\n- A skill's `allowed-tools` pre-approves only low-risk tools.\n- `PolicyEngine(default_action=\"deny\")` denies resources that no rule matches. YAML `match:` rules match only their own resource.\n- MCP `allowed_tools` and `disabled_tools` also block at call time, not only in the tool list.\n- MCP tool output is marked as external content for the model.\n- Recipes whose list-form or `roles:` agents use a tool that is denied by default need it in `tools.allow`.\n- A deep-copied Agent asks for its own session approval.\n- `execute_code` always runs in the sandbox. The model no longer sees a `sandbox_mode` option.\n\n## Sandboxes and child environment\n\n- `SubprocessSandbox` raises `UnenforceablePolicyError` when asked for `allow_network=False` or `allow_file_write=False` (including `SecurityPolicy.strict()`), because it cannot enforce them. `SandboxConfig.subprocess()` now defaults to `allow_network=True`. Use the Docker or Sandlock backend to block network or writes.\n- With `allow_subprocess=False` (the default): `execute(language=\"bash\")` is refused; Python that imports `multiprocessing` or calls `os.fork`, `os.exec*` or `os.spawn*` is refused; a computed `importlib.import_module(name)` is refused when imports are restricted.\n- Sandbox commands that name a folder holding a blocked path (for example `ls ~` or `cd /etc`) are refused.\n- Sandbox `write_file` and `read_file` refuse `..` and any symlink.\n- `SandlockSandbox` stays offline unless `allow_network=True`. A `working_dir` outside the sandbox is refused. `SandboxConfig.native()` run from a home folder raises.\n- The CLI `SandboxExecutor` `network_isolated` mode refuses network tools. A non-empty `allowed_hosts` raises, because it cannot be enforced. CPU, file-size and memory limits now apply.\n- Shell commands and code run by the model (ShellTools, the CLI shell, the code tool `run_python`, and the TypeScript sandbox, CodeAgent and `shell` tool) get only a short list of environment variables, such as `PATH`, `HOME`, `LANG` and `TMPDIR`. Name others in `PRAISONAI_SHELL_ENV_ALLOWLIST`, or pass them with `env=`.\n\n## Input validation\n\n- TypeScript `NLPostgresClient.executeSQL` runs exactly one statement. With `readOnly`, it runs inside a read-only transaction. Tables outside the configured list are refused.\n- IMAP search terms that contain `\"` or `\\` are searched literally.\n- `get_plugin_template()` refuses multi-line values.\n- Invalid Couchbase names, identifiers that end in a newline, invalid SingleStore dimensions, a non-integer `limit` and non-numeric embeddings in several vector stores raise `ValueError`.\n- Deploy image references, file names, environment variable names and cloud CLI values are validated. GCP environment values that contain `,` are passed in gcloud's `^DELIM^` form.\n- Browser (CDP) selectors are passed as JSON string literals. Normal selectors work as before.\n- A tool name from the model resolves only to declared or registered tools.\n\n## Migration\n\nEvery new refusal or default, and the setting that adjusts it. \"Checked\" means the name was found in the release source.\n\n| You notice | What to do | Checked |\n|---|---|---|\n| A server refuses to start on `0.0.0.0` | Set its token: `ServerConfig(auth_token=...)` for `AgentServer`; `PRAISONAI_JOBS_API_KEY` for the Jobs API; `--api-key` or `PRAISONAI_SERVE_API_KEY` for `praisonai serve agents`; `--api-key` for `serve openai` and `rag serve`; `--token` (or `--read-only`) for `registry serve`; `auth: api-key` or `jwt` with a key for `recipe serve`; `AgentOSConfig(api_key=...)` or `PRAISONAI_AGENTOS_API_KEY` for AgentOS; `PRAISONAI_BROWSER_TOKEN` for praisonai-browser; `A2U_AUTH_TOKEN` for `serve a2u` | yes |\n| `praisonai call --public` refuses | Set `CALL_SERVER_TOKEN` | yes |\n| TypeScript MCP server or AgentOS refuses a public host | Set `authToken` or `PRAISONAI_MCP_AUTH_TOKEN` (MCP server); `apiKey` or `PRAISONAI_AGENTOS_API_KEY` (AgentOS); `{ token }` (N8N listener) | yes |\n| `A2A.serve()`, MCP SSE or `launch()` prints a token | Set your own: `A2A(auth_token=...)` or `PRAISONAI_LAUNCH_AUTH_TOKEN`; `MCP_SSE_AUTH_TOKEN` for MCP SSE | yes |\n| A2A on loopback asks for a token | Unset `PRAISONAI_LAUNCH_AUTH_TOKEN`, or send it | yes |\n| Webhook receiver stays on loopback | Set its signing secret: `TELEGRAM_WEBHOOK_SECRET`, `WHATSAPP_APP_SECRET`, `LINEAR_WEBHOOK_SECRET`, `AGENTMAIL_WEBHOOK_SECRET`, or `verify: {hmac: {secret: ...}}` for the webhook channel. `PRAISONAI_WEBHOOK_HOST=127.0.0.1` keeps a keyless dev setup local | yes |\n| `HTTPApproval(host=\"0.0.0.0\")` refuses | Pass `allowed_approvers=[...]` or set `HTTP_APPROVERS` | yes |\n| Jobs API (`--factory`) answers only `/health` | Set `PRAISONAI_JOBS_API_KEY`, or `PRAISONAI_JOBS_BIND_HOST=127.0.0.1` when it is local | yes |\n| Dashboard or replay viewer refuses a public host | Set its token (name to be confirmed in the final build) | no (change in progress) |\n| A local server returns `403` behind a reverse proxy or to a browser page | Keep `Host: localhost` in the proxy, or set the server's key | n/a |\n| Gateway refuses a browser page from another origin | Add the origin to `GATEWAY_ALLOWED_ORIGINS` | yes |\n| `413` for a large request | Raise `PRAISONAI_MAX_BODY_BYTES` (MCP HTTP stream; the gateway uses the larger of this and 25 MB) | yes |\n| Gateway session not found after 1000 live sessions | It was closed while idle; resume it from the store. No setting | n/a |\n| Gateway `403` on `/v1/*`, `/mcp` or pairing | Give the token the `write` or `pairing` scope | n/a |\n| Email or AgentMail bot ignores unknown senders | Set `allowed_users`, or `unknown_user_policy: allow` for an open inbox | yes |\n| A bot command is admin-only | Add the user to `admin_users` | yes |\n| Bot attachment refused | Move the file into the workspace, or add its folder to `allow_roots` | yes |\n| A fetch of a private or local address is refused | Set `ALLOW_LOCAL_CRAWL=true` (development only) | yes |\n| JIRA tool refuses a URL | Set `JIRA_URL` to your JIRA site | yes |\n| `OpenAPIToolset` raises about another origin | Pass `base_url=` | yes |\n| A file tool refuses a path outside the current directory | Pass a root: `workspace_root=` (FastContext, `multiedit`), or start in the right folder | yes |\n| `grep_search` or `glob_files` refuses a path | Set `PRAISONAI_WORKSPACE` to the root you want searched | name yes; new default in progress |\n| `SandboxExecutor` refuses a path | Add the folder to `allowed_paths` | yes |\n| Recipe bundle with links fails to install | Use a Python with the `tarfile` data filter (3.10.12+, 3.11.4+, 3.12+) | n/a |\n| A project's MCP server does not start | List its exact command line under `mcp.trusted_servers` in `~/.praisonai/config.yaml` (`PRAISONAI_MCP_TRUST` still works) | yes |\n| A project file's endpoint, key, plugin or shell setting is ignored | Set it in `~/.praisonai/config.yaml` or the environment: `OPENAI_BASE_URL` and your provider key; `PRAISONAI_ALLOW_PROJECT_PLUGINS=true`; `PRAISONAI_ALLOW_SHELL=true` | yes |\n| An included recipe's `tools.py` does not load | Set `PRAISONAI_ALLOW_TEMPLATE_TOOLS=true` | yes |\n| Old project \"always allow\" rules are ignored | Approve again once; the choice is saved under `$PRAISONAI_HOME` | yes |\n| `send_email`, `send_message` or `schedule_*` asks for approval | Approve when asked; for unattended agents pass `approval=True` (or a preset such as `approval=\"full\"`); for bots use `auto_approve_tools` | yes |\n| Unmatched resource denied by `PolicyEngine` | Add an `allow` rule, or use `default_action=\"allow\"` | yes |\n| A recipe tool is denied | Add it to `tools.allow` in the recipe | yes |\n| `UnenforceablePolicyError` from `SubprocessSandbox` | Use the Docker or Sandlock backend, or set `allow_network=True` / `allow_file_write=True` | yes |\n| `execute(language=\"bash\")` or a subprocess call is refused in the sandbox | Set `allow_subprocess=True` in the sandbox policy | yes |\n| Sandlock has no network | Set `allow_network=True` | yes |\n| `SandboxExecutor` raises on `allowed_hosts` | Remove `allowed_hosts`; use `network_isolated` or no isolation | yes |\n| A shell command or code run is missing an environment variable | Add its name to `PRAISONAI_SHELL_ENV_ALLOWLIST` (comma-separated), or pass `env=` | yes |\n| `executeSQL` refuses a statement | Send one statement per call; add the table to the configured table list | yes |\n| `ValueError` from a store, deploy value or plugin template | Fix the name, number or value that the message names | n/a |\n\n## Thanks\n\nThank you to everyone who reported issues privately. The people who reported the changes in this release are credited in the security advisory. We also thank these people, whose reports were confirmed and had already been fixed in earlier changes:\n\n@0xRomSec, @1491342590, @1diot9, @a25370, @Akokonunes, @aurlep, @baeseungwon1010, @Carbene, @chakrapani150, @dajiaohuang, @EddieMurphy89, @gn00295120, @highlightime, @manus-pi, @manus-use, @mohammedix88, @rajivraj, @rexpository, @superbot-helper, @Vancir\n","mentions_count":20}
