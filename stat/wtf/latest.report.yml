}],"body":"Welcome to the v0.51.0 release! In short, this release fixes a few small things by various contributors, some testing, and implements the beginnings of the name change from WTF to Tessera. See [this issue](https://github.com/wtfutil/wtf/issues/2186) for more info.\r\n\r\n## Notable Changes\r\n\r\n- Various fixes and added testing. Thanks to @Seanstoppable.\r\n- Binaries are now produced under the new name `tessera`. \r\n- Fix WTF starting Docker by accident. Thanks @toby-bro.\r\n- This might be the last minor release under the repository URL `github.com/wtfutil/wtf`. The project is moving to `github.com/linodians/tessera`. GitHub should hopefully redirect.\r\n\r\n## Changelog\r\n* 53be77a2e0be812f85822df0fd9a9c28fcc3242b Name change: ASCII-art (#2185)\r\n* 3a0915da9c8006662c197b56a8f8bae08700b2ee chore(deps): bump google.golang.org/api from 0.287.0 to 0.299.0 (#2168)\r\n* 83537bb00dea5b2bef0b5c0cc4edfbb45f096a77 chore(deps): bump go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp (#2183)\r\n* cb93be6918f516375d633b9664f6af5c2d79b385 chore(deps): bump google.golang.org/grpc from 1.83.1 to 1.83.2 (#2184)\r\n* 5c3eaa545f151729033024b8660f7d7fd90a95c7 Add [39m as a possible color reset code. (#2075)\r\n* 8a07a78fa5f478ac155edab761e19f6f5aebdf5f URLcheck: redact password in UI (#2072)\r\n* 0d70760f49a5cf193883dcb821789cdbbbba5eff docker: add pidFilePath to avoid waking a socket-activated daemon (#2176)\r\n* ccf48b128eed2b4179257d9c024cfca301025197 Fix Past() to properly calculate for all-day events (#2173)\r\n* 6cc83c729ff2eee915d4eae68781d7fcfde7e62c chore(deps): bump k8s.io/client-go from 0.36.2 to 0.36.3 (#2171)\r\n* 4eb74e9c9a876b5810d52aa6063978e822ccdcf4 chore(deps): bump code.cloudfoundry.org/bytefmt from 0.78.0 to 0.83.0 (#2172)\r\n* 37ee39f78d9d2f81f2f03900a7fa7355f9051589 chore(deps): bump github.com/digitalocean/godo from 1.197.0 to 1.202.0 (#2174)\r\n* 80410e7241721efc57436dfdcea3d672b20e9a39 chore(deps): bump github.com/shirou/gopsutil/v4 from 4.26.6 to 4.26.7 (#2175)\r\n* ffcb25ebcb3a2094c026e91ee75f332396100c4f chore(deps): bump google.golang.org/grpc from 1.82.1 to 1.83.1 (#2179)\r\n* 163f4aceb47a0e51a000b5bae8cd12a016127f12 Fix Jira issue key column width being hardcoded (#2178)\r\n* c6c261e0de936c2b6cedc50dd8da8afede742dcb fix(urlchecker): convert timeout value to time.Second (#2182)\r\n* bb838c1ccb0f0f3223690df44afdec663d622881 Add unit tests for modules/bargraph (100% coverage) (#2144)\r\n* a205f0010fe6de070303e4da68c5cad9ac044d9c Add unit tests for modules/system package (#2134)\r\n* 368382915ecd2cfb5625dfa090b68d974dd04fc9 Add unit tests for modules/textfile (#2132)\r\n* a1458235d09416b2631efa469f20cdd289fbf67e Fix Yahoo Finance module showing all zeroes (#2142)\r\n* b6f457b699f3d46d51f803a5cf5667b3775ff844 Add unit tests for modules/cmdrunner (0% -> 88% coverage) (#2136)\r\n* 35f1c5b736b4e67b4f6d389b08961eac3834ad5f fix: Ctrl+C now exits cleanly via os.Exit(0) (#2140)\r\n* 3eb3143ca3938fe18584e9a80715bc0f77daf339 Add unit tests for modules/ping and fix Windows ping failures (#2141)\r\n* 2c1c75f62adfd3faff8d62f20c4a4a26f8c77b1f Add unit tests for progress module (0% \u2192 100% coverage) (#2135)\r\n* 18c105a9cb5f0c8ba9e7d917b5568f3c1a92def4 chore(deps): bump google.golang.org/grpc from 1.81.1 to 1.82.1 (#2131)\r\n* a3920f81ff3d72f1ee4a6e485a7498ba1ede33d6 Increase feedreader module test coverage to 98.5% (#2122)\r\n* 5080c3852aef971962d3c9e179a787b84af68334 Fix football module: response body closed, invalid-league crash, unclear errors, and add test coverage (#2133)\r\n* 1106e5b58bde3b3965fc1bedf4038db0ac5d8017 cmdrunner: expand leading ~ in cmd, args, and workingDir (#2116)\r\n* 9cfe96200bd0d0c1c0111188062a3e8bec60859a Add unit tests for modules/mercurial (0% -> 72.3% coverage) (#2128)\r\n* 3ca62bdab3c65155bb6ea97d86b56a758833d00b Replace devto-api-go with inline HTTP client and add tests (#2126)\r\n* 342b41f3afc96b26a1c51a90204692f770f0f757 fix: prevent UI deadlock in GitHub widget (#2117)\r\n* 131d5ffb9392871e3ffb7b6f44ff19fad39ae01c feat: support WTF_CONFIG_DIR env var for hermetic test builds (#2129)\r\n* 4944afd31264571cb96884b15fb6538641108baf chore(deps): bump github.com/jedib0t/go-pretty/v6 from 6.8.2 to 6.8.3 (#2113)\r\n* f1fa41cb6efa8adaa867bbe63ea39d71f3e8e948 Upgrade go-github v32 to v89 and shurcooL/githubv4 (#2121)\r\n* 33decffb8976da460a9e37b30a8950f8ec5e92d3 chore(deps): bump golang.org/x/sync from 0.21.0 to 0.22.0 (#2107)\r\n* a34222df03a64fe54f5241c15cddeca1ce002632 Upgrade gopsutil from v2 to v4 (#2125)\r\n* 9c18021e3af55968551bdd4e95ab769f95d1bd46 Replace pkg/errors with fmt.Errorf from stdlib (#2109)\r\n* 515d61dc56b3ee1350922fd137fdb4cb4339b0cf fix: enable Windows compilation with platform-specific build tags (#2108)\r\n* ee40814e64bd9c9deffc5b1eead4232819f24e8f chore(deps): bump github.com/docker/docker-credential-helpers (#2093)\r\n* 68646df47716d3ae640518eb9730b0c706c2d598 chore(deps): bump github.com/gdamore/tcell/v2 from 2.13.9 to 2.13.10 (#2095)\r\n* 2ccdc12ee69f8a7fd2bfadce7b8a30d924f0d273 chore(deps): bump google.golang.org/api from 0.276.0 to 0.287.0 (#2096)\r\n* 3db67b23f97fc904cdce8c4ea2485d2edda24db6 chore(deps): bump github.com/Azure/azure-sdk-for-go/sdk/azidentity (#2097)\r\n* 9e8774c8222221584439495297b16c58160dcf16 chore(deps): bump github.com/jedib0t/go-pretty/v6 from 6.8.1 to 6.8.2 (#2098)\r\n* 7b8eb450276acb41f26b6cf0a341dceef46583ae Build Tessera binaries (#2099)\r\n\r\n","mentions_count":2}
