el":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":1057,"digest":"sha256:72e02114cb656d2122aa1cd85b73e976f5f0f659ef8dcb6d27903a0d0ccd1541","download_count":1,"created_at":"2026-10-09T16:21:13Z","updated_at":"2026-10-09T16:21:13Z"},{"id":625501453,"node_id":"RA_kwDORUMLD84lSGUN","name":"SHA256SUMS","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5074,"digest":"sha256:48596152d0d8857183674398cdc00cfed248b61eb9d3eea3369082374bdc57c6","download_count":524,"created_at":"2026-10-09T16:21:20Z","updated_at":"2026-10-09T16:21:20Z"},{"id":625501490,"node_id":"RA_kwDORUMLD84lSGUy","name":"SHA256SUMS.sig","label":"","uploader":{"login":"kenn-dist-update-bot[bot]","id":313427593,"node_id":"BOT_kgDOEq6GiQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:f5a6b52a4768988f607871c75d5d90d11cfdf2c3020ac72a3bf83384bb20dfcc","download_count":3,"created_at":"2026-10-09T16:21:21Z","updated_at":"2026-10-09T16:21:21Z"}],"body":"## New features\n\n- Choose Espa\u00f1ol in Settings. Browsers set to Spanish use it on first load.\n- Browse Junie CLI, OMO, and StepCode sessions with their usage and costs. Junie ingestion excludes tool calls and IDE-only conversations. If you previously used `PI_DIR` for OMO, remove that override to avoid indexing new sessions twice.\n- Read Antigravity conversations from plaintext transcripts when no session database exists, without a decryption key. These transcripts include reasoning and tool calls but no token usage or cost.\n- See commits, lines added and removed, and files changed on the dashboard for the selected dates. Load pull-request totals on demand after GitHub setup.\n- Switch the Activity timeline between concurrency, user-message frequency, and assistant-message frequency.\n- Compare user, assistant, and other message counts in the Analytics timeline with Absolute and Percent views. Other includes system entries and tool results.\n- See all prompt tokens in the Usage page's Total Input card, including cache reads and writes. The previous Input Tokens count is labeled Uncached Input.\n- Choose Smooth, Lines, or Bars for Cost Over Time. The chart remembers your choice, shows zero-spend days, and supports dragging to select a date range.\n- Follow tool errors, retries, switches, and recovery in a session's tool sequences panel. Each step links to its transcript call and shows available timing and evidence. Opening the panel adds no token charges.\n- Give Claude Code and Codex access to past conversations through native conversation-memory plugins. Session-start refresh and readiness diagnostics help identify missing setup or search coverage.\n- Install proactive conversation recall with `agentsview skills install`. The package guides agents to search relevant history, distinguish proposals from accepted decisions, and cite transcript evidence.\n- Approve or archive extracted entries in Recall, the collection of memories extracted from sessions. Review decisions survive later extraction changes.\n- Activate the first Recall collection before the initial backlog finishes, once a session is complete and usable entries exist. Recent sessions extract first, and later passes add to the active collection.\n- Extract Recall entries from several sessions at once by setting `concurrency` on an extraction server. The default remains 1.\n- Choose the default CLI for generated insights with `[insights] default_agent`. Leaving it unset keeps Claude as the default.\n- Replace selected ChatGPT or Claude.ai imports with `agentsview import --replace <session-id>`. The old transcript moves to Trash as a restorable copy, while the live session keeps its name and pins on matching messages.\n- Identify refused ChatGPT and Claude.ai imports by session ID and reason. CLI summaries separate changed history, shorter exports, trashed sessions, and temporary failures.\n- Use semantic and hybrid search on ClickHouse mirrors. Embeddings upload with `clickhouse push` when vector search is enabled; `--no-vectors` or `push_vectors = false` opts out.\n- Browse hosted raw-sync uploads after the server parses them into PostgreSQL sessions. This opt-in mode removes the need for a local SQLite archive or a separate `pg push`.\n- Upload existing sources in a finite, resumable run with `raw-sync backfill --run-id ID --provider NAME`. Start `raw-sync watch` after the run completes to upload later changes.\n- Inspect hosted uploads and parsing with `raw-sync server-status` and the raw-sync health API. Run `raw-sync clean-uploads` to expire upload sessions and remove orphaned temporary files without starting the server.\n- Serve AgentsView under a reverse-proxy subpath with `serve --base-path`. Keep `--public-url` origin-only.\n- Search several literal terms within one user/assistant exchange over MCP on SQLite and PostgreSQL. Narrow results by session, branch, project, agent, or date.\n- Read MCP search evidence from the same transcript revision, and continue reading messages beyond the previous 20,000-character limit. Revision checks report when the source changed.\n- Build clients for multiple machines with host keys and session titles in search results, batch session lookup, and optional source size and archive-update metadata.\n\n## Improvements\n\n- Load Activity, Usage, and Analytics reports faster on ClickHouse with lower memory use. Opened past-day reports survive restarts, and new pushes refresh only changed sessions where possible. Upgraded deployments need a push to complete new report data and access to `system.parts` for serving.\n- Load Tool Usage and Top Skills analytics faster on PostgreSQL, with less memory use on large archives.\n- Load dashboard metadata with less database work on large SQLite archives. The first writable startup builds an index before serving, so that startup takes longer.\n- Open Usage after a price update without waiting for a full cache rebuild. Only sessions using changed models rebuild, and rebuilding starts in the background. The first startup after upgrading rebuilds the usage cache once.\n- Sync and rebuild large archives with less retained transcript data and less repeated processing. Fresh archives defer the conversation export index until the first export, and full resync removes the redundant stored copy of message text.\n- Update Cursor IDE chats with less parsing and memory use. A database change reparses only chats whose saved documents changed.\n- Keep file watching responsive on large Antigravity installs by skipping generated directory trees. Windows watchers also use smaller change buffers, reducing memory use.\n- Build hourly `export day` and `export digest` reports faster, especially for long sessions.\n- See the current sync stage, subagent-repair counts, and notices when a sync waits for another operation. Refresh controls show elapsed query time and a live request timeline.\n- Load more Activity sessions as you scroll. New pages append to the table, and failed loads offer a retry.\n- See agent-provided session titles consistently, with user-chosen names taking precedence. First-message previews retain the user's actual prompt.\n- Read fuller Codebuff and Freebuff transcripts, including attachment markers, errors, and answers to agent questions. Nested agents appear as linked subagent sessions, and costs include every prompt's reported credits.\n- See OpenCode tool durations from dispatch to result, including permission waits. Calls without a dispatch timestamp retain an unknown duration.\n- Extract fewer Recall procedure entries from work an agent only proposed. Procedure extraction requires tool evidence in the relevant action window. Upgrading re-extracts existing sessions.\n- Keep Recall vector and hybrid queries available while extraction adds entries. The index may trail by 256 changes by default; hybrid search still finds newer entries by keyword.\n- Configure embedding endpoints with HTTPS for public IP addresses and without query strings. Builds leave documents pending when configuration, credentials, or server failures prevent embedding.\n- Sync remote hosts over HTTP. SSH sync is removed; configure each remote with a daemon URL and token. Existing archived sessions remain available.\n- Measure app opens, screen visits, core actions, and visible visit duration through the existing telemetry opt-out. Daily daemon activity counts at most once per installation per UTC day.\n- Diagnose desktop startup and database delays with logs that show backend port selection, readiness results, stalled database checkpoints, and connection or write-lock waits.\n\n## Bug fixes\n\n- Build from a fresh Go module cache without a missing-dependency error.\n- Re-import ChatGPT exports to append new messages, fill previously empty tool results, and restore truncated message text while preserving existing message IDs and pins.\n- Keep saved Claude.ai turns when a stale export contains fewer messages. Shorter exports are refused unless you explicitly request replacement.\n- View, search, and copy raw Codex and Grok tool inputs. Codex patch edits also appear in Recent Edits.\n- Keep both transcripts when Gemini CLI or Cursor files share a session ID, instead of letting one overwrite the other.\n- Read Claude subagent continuations saved under another parent session. Pi subagents in nested directories also appear and link to their parent when the recorded layout identifies it.\n- Keep Claude messages from other sessions out of human prompt counts and session-title selection. The transcript labels them \"Message from another session\".\n- Count workers launched by another agent as Subagents on Activity, rather than inflating the Interactive peak.\n- Price Codex cache writes at the cache-write rate and estimate auto-review costs using GPT-5.6 Luna rates. Offline reports and exports also include pricing for GPT-6 Astra, GPT-6 Sol, and GPT-6.1 Sol.\n- Retain reported costs when model filters contain spaces between model names or are blank on SQLite and PostgreSQL.\n- Count every message in term trends for time zones where daylight saving time skips local midnight.\n- Remove permanently deleted sessions from semantic search on the next embedding build. Sessions removed by sync and later imported again receive embeddings again.\n- Keep Cursor and Antigravity idle instead of repeatedly syncing unchanged SQLite databases.\n- Show Cursor IDE sessions on the date of their earliest timestamped message.\n- Update active Codex Desktop sessions on macOS within about 30 seconds, even without Codex history hints.\n- Start background serving on macOS without hanging on permission prompts for external volumes. Enable `scan_protected_paths = true` to include Git details from those locations.\n- Keep macOS file identities stable across reboots, avoiding repeated archive reparses. Upgrading performs one initial reparse and raw-source capture.\n- Apply session-provider changes made in Settings without restarting the daemon. Separate push-watch processes still require a restart.\n- Keep local sessions and reachable remotes syncing when another remote's hostname cannot resolve. Sync failures retain their actionable error details.\n- Keep Linux servers discoverable after clock corrections, and let Windows startup progress update while commands read it.\n- Detect same-size file replacements on Windows and sync Positron project changes when file timestamps stay the same.\n- Open the desktop app against an authenticated local daemon without a readiness timeout. The app also recovers after an observed backend outage while hidden and avoids stale startup errors during an in-app update.\n- Replace a served DuckDB mirror with `duckdb push` on Windows without stopping `duckdb serve`.\n- Load current SQLite-backed OpenClaw sessions and discover Hermes Agent sessions in the default Windows location.\n- Report incomplete Git and pull-request totals in `agentsview stats`, and wait beyond the former 30-second client timeout for slow results.\n- Count repositories once across clones and worktrees, and count each commit once while retaining work from diverged branches.\n- Clear the minimum-prompt filter by clicking its selected value again. Usage cards grow to contain wrapped text, and password-manager menus no longer cover typeahead search boxes.\n- Refuse writable archives when the build cannot load their existing FTS5 index, with an error that explains how to fix the executable.","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
