\r\n### User Guide\r\n[**User Guide**](https://github.com/kubernetes-sigs/kubefed/blob/master/docs/userguide.md)\r\n\r\n## New Contributors\r\n* @jonathanbeber made their first contribution in https://github.com/kubernetes-sigs/kubefed/pull/1499\r\n* @tehlers320 made their first contribution in https://github.com/kubernetes-sigs/kubefed/pull/1492\r\n\r\n**Full Changelog**: https://github.com/kubernetes-sigs/kubefed/compare/v0.9.1...v0.9.2","mentions_count":3}
