emSign\n  intermediates). They come in under `fastembed` → `hf-hub` → `ureq`, which\n  downloads the embedding model\n\n## Install patent 0.14.3\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/r14dd/patent/releases/download/v0.14.3/patent-installer.sh | sh\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install r14dd/patent/patent\n```\n\n## Download patent 0.14.3\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [patent-aarch64-apple-darwin.tar.xz](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-aarch64-apple-darwin.tar.xz.sha256) |\n| [patent-x86_64-pc-windows-msvc.zip](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-x86_64-pc-windows-msvc.zip.sha256) |\n| [patent-aarch64-unknown-linux-gnu.tar.xz](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [patent-x86_64-unknown-linux-gnu.tar.xz](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/r14dd/patent/releases/download/v0.14.3/patent-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n"}
