 Changelog**: https://github.com/docker/compose/compare/v5.6.0...v5.6.1","reactions":{"total_count":20,"+1":7,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":2,"rocket":2,"eyes":3}}
