"id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":60733,"digest":"sha256:c0f515b6df76eed70be06dc15654fba3bcf6b6f380c63c20dff993708fe025b5","download_count":45,"created_at":"2026-11-17T12:55:02Z","updated_at":"2026-11-17T12:55:02Z"},{"id":759067244,"node_id":"RA_kwDOAOWUd84tPnJs","name":"docker-compose-windows-x86_64.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":244569,"digest":"sha256:4d675e5cd8cc819be166d28d723fc0c7e631f66a08c1af49aecdfc5e689c2730","download_count":37,"created_at":"2026-11-17T12:55:02Z","updated_at":"2026-11-17T12:55:02Z"},{"id":759067196,"node_id":"RA_kwDOAOWUd84tPnI8","name":"docker-compose-windows-x86_64.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":91235,"digest":"sha256:4ba36bcb3c6ddef90b9aee5f93a0072efeb9f4789143b2f1440f0c231bce0196","download_count":87,"created_at":"2026-11-17T12:55:01Z","updated_at":"2026-11-17T12:55:02Z"}],"body":"## What's Changed\r\n\r\n> ℹ️ **Scheduled jobs are now supported.** A job is a one-shot unit of work declared in the top-level `jobs:` element of your Compose file, run on demand or on a schedule. \r\nScheduling needs **Docker Engine 29.10 or later with the jobs extension enabled** (it is off by default: `dockerd --extension-enable org.mobyproject.jobs.v0`). Manual jobs keep working on any engine, and projects that declare no jobs are unaffected.\r\n\r\n```yaml\r\nservices:\r\n  db:\r\n    image: postgres\r\njobs:\r\n  backup:\r\n    image: backup-tool\r\n    depends_on: [db]\r\n    triggers:\r\n      schedule:\r\n        - cron: \"0 3 * * *\"\r\n```\r\n\r\n> * `docker compose up` (or `create`) registers the scheduled jobs with the engine, which fires them on its own clock; `docker compose down` removes them. On an engine without jobs support, `up` refuses a project with scheduled jobs before creating anything.\r\n> * `docker compose run backup` triggers a job right away: its dependencies start first, its logs are streamed and its exit code is returned. On an engine without jobs support, it runs as a one-off service with a warning, as before.\r\n\r\n### ✨ Improvements\r\n\r\n**Jobs**\r\n* Jobs: add support for one-shot and scheduled `jobs` by @glours in https://github.com/docker/compose/pull/14155\r\n\r\n**Full Changelog**: https://github.com/docker/compose/compare/v5.7.2...v5.8.0\r\n","reactions":{"total_count":25,"+1":8,"-1":0,"laugh":2,"hooray":5,"confused":0,"heart":6,"rocket":2,"eyes":2},"mentions_count":1}
