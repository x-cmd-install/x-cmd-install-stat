nt":6,"created_at":"2026-10-30T22:24:01Z","updated_at":"2026-10-30T22:25:57Z"},{"id":693582570,"node_id":"RA_kwDOCQnI4s4pVzrq","name":"tritonserver_sdk-2.74.0+nv26.10-77056645-cu132-cp312-manylinux_2_34-x86_64.zip","label":null,"uploader":{"login":"mc-nv","id":99709299,"node_id":"U_kgDOBfFxcw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":457838981,"digest":"sha256:4e7c451dac46a1bbae243609c225f6547d74f386107bbe767065593d7682f2fd","download_count":7,"created_at":"2026-10-30T22:16:42Z","updated_at":"2026-10-30T22:18:58Z"},{"id":693565460,"node_id":"RA_kwDOCQnI4s4pVvgU","name":"v2.74.0_ubuntu2404.clients.tar.gz","label":null,"uploader":{"login":"mc-nv","id":99709299,"node_id":"U_kgDOBfFxcw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gzip","state":"uploaded","size":226810832,"digest":"sha256:40dd2c3804b175166d2e276d38488e4213c7ec766aaf88775a9595f2803f8936","download_count":5,"created_at":"2026-10-30T22:09:01Z","updated_at":"2026-10-30T22:10:39Z"}],"body":"<!--\r\n  # Copyright (c) 2025-2026, NVIDIA CORPORATION. All rights reserved.\r\n  #\r\n  # Redistribution and use in source and binary forms, with or without\r\n  # modification, are permitted provided that the following conditions\r\n  # are met:\r\n  #  * Redistributions of source code must retain the above copyright\r\n  #    notice, this list of conditions and the following disclaimer.\r\n  #  * Redistributions in binary form must reproduce the above copyright\r\n  #    notice, this list of conditions and the following disclaimer in the\r\n  #    documentation and/or other materials provided with the distribution.\r\n  #  * Neither the name of NVIDIA CORPORATION nor the names of its\r\n  #    contributors may be used to endorse or promote products derived\r\n  #    from this software without specific prior written permission.\r\n  #\r\n  # THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS ``AS IS'' AND ANY\r\n  # EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE\r\n  # IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR\r\n  # PURPOSE ARE DISCLAIMED.  IN NO EVENT SHALL THE COPYRIGHT OWNER OR\r\n  # CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL,\r\n  # EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO,\r\n  # PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR\r\n  # PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY\r\n  # OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT\r\n  # (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE\r\n  # OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.\r\n  -->\r\n# Triton Inference Server\r\n\r\n  The Triton Inference Server provides a cloud inferencing solution optimized for both CPUs and GPUs. The server provides an inference service via an HTTP or GRPC endpoint, allowing remote clients to request inferencing for any model being managed by the server. For edge deployments, Triton Server is also available as a shared library with an API that allows the full functionality of the server to be included directly in an application.\r\n\r\n<details>\r\n    <summary><h2>New Features and Improvements</h2></summary>\r\n\r\n* The S3 addressing style is now configurable.\r\n* Request cancellation is now checked before a request is dispatched to the backend, and before batch assembly in the TensorRT backend.\r\n* Tutorials: The Llava1.5 guide is deprecated in favor of the new Qwen2.5-VL guide for the TensorRT-LLM PyTorch backend. Note: this is a breaking change.\r\n* HTTP request buffers are now released after a request is rejected for exceeding the chunk limit.\r\n* `--http-max-input-size` is now enforced across nested parameters of generate requests.\r\n* SageMaker model URLs are now validated before path normalization.\r\n* Fixed copying of the cuBLAS libraries to the CUDA targets lib directory.\r\n* Relaxed the `openai` and `pydantic` pins to match vLLM requirements.\r\n* Tritonserver is now built on, and shipped on, the cuda-dl-base devel image.\r\n* Python backend: Restrictive permissions are now applied to shared memory, and GPU tensor allocation now falls back to host memory.\r\n* ONNX Runtime, OpenVINO, Python and TensorRT-LLM backends: Backend builds now require `TRITON_BUILD_CONTAINER` instead of synthesizing a `py3-min` image.\r\n* vLLM backend: Added support for vLLM >= 0.30, and prompts are now rendered before generation and encoding.\r\n* Triton CLI: The image fetch in the TRT-LLM preprocessing template is now bounded.\r\n\r\n\r\n\r\n</details>\r\n\r\n\r\n<details>\r\n  <summary><h2>Known Issues</h2></summary>\r\n\r\n* The Triton TensorRT-LLM Backend container image is not included in this release.\r\n* vLLM's v0 API and Ray are affected by vulnerabilities. Users should consider their own architecture and mitigation steps which may include but should not be limited to:\r\n  * Do not expose Ray executors and vLLM hosts to a network where any untrusted connections might reach the host.\r\n  * Ensure that only the other vLLM hosts are able to connect to the TCP port used for the XPUB socket. Note that the port used is random.\r\n* When using Valgrind or other leak detection tools on AGX-Thor or DGX-Spark systems, you might see memory leaks attributed to NvRmGpuLibOpen.\r\n* Valgrind or other memory leak detection tools may occasionally report leaks related to DCGM. These reports are intermittent and often disappear on retry.\r\n* CuPy has issues with the CUDA 13 Device API in multithreaded contexts. Avoid using tritonclient cuda_shared_memory APIs in multithreaded environments until fixed by CuPy.\r\n* TensorRT calibration cache may require size adjustment in some cases, which was observed for the IGX platform.\r\n* The core Python binding may incur an additional D2H and H2D copy if the backend and frontend both specify device memory to be used for response tensors.\r\n* A segmentation fault related to DCGM and NSCQ may be encountered during server shutdown on NVSwitch systems. A possible workaround for this issue is to disable the collection of GPU metrics `tritonserver --allow-gpu-metrics false ...`.\r\n* When using TensorRT models, if auto-complete configuration is disabled and `is_non_linear_format_io:true` for [reformat-free tensors](https://github.com/triton-inference-server/server/blob/r24.08/docs/user_guide/model_configuration.md#non-linear-io-formats) is not provided in the model configuration, the model may not load successfully.\r\n* When using Python models in [decoupled mode](https://github.com/triton-inference-server/python_backend/tree/main?tab=readme-ov-file#decoupled-mode), users need to ensure that the `ResponseSender` goes out of scope or is properly cleaned up before unloading the model to guarantee that the unloading process executes correctly.\r\n* Triton Inference Server with vLLM backend currently does not support running vLLM models with tensor parallelism sizes greater than 1 and the default \"distributed_executor_backend\" setting when using explicit model control mode. In attempt to load a vllm model (tp > 1) in explicit mode, users could potentially see failure at `initialize` step: `could not acquire lock for <_io.BufferedWriter name='<stdout>'> at interpreter shutdown, possibly due to daemon threads`. For the default model control mode, after server shutdown, vllm related sub-processes are not killed. Related vllm issue: https://github.com/vllm-project/vllm/issues/6766. Please specify \"distributed_executor_backend\":\"ray\" in the `model.json` when deploying vllm models with tensor parallelism > 1.\r\n* When loading models with file override, multiple model configuration files are not supported. Users must provide the model configuration by setting parameter `\"config\" : \"<JSON>\"` instead of custom configuration file in the following format: `\"file:configs/<model-config-name>.pbtxt\" : \"<base64-encoded-file-content>\"`.\r\n* TensorRT-LLM backend provides limited support of Triton extensions and features.\r\n* The TensorRT-LLM [backend](https://github.com/triton-inference-server/tensorrtllm_backend) may core dump on server shutdown. This impacts server teardown only and will not impact inferencing.\r\n* The Java CAPI is known to have intermittent segfaults.\r\n* Some systems which implement malloc() may not release memory back to the operating system right away causing a false memory leak. This can be mitigated by using a different malloc implementation. Tcmalloc and jemalloc are installed in the Triton container and can be [used by specifying the library in LD_PRELOAD](https://github.com/triton-inference-server/server/blob/r22.12/docs/user_guide/model_management.md). NVIDIA recommends experimenting with both tcmalloc and jemalloc to determine which one works better for your use case.\r\n* Auto-complete may cause an increase in server start time. To avoid a start time increase, users can provide the full model configuration and launch the server with `--disable-auto-complete-config`.\r\n* Auto-complete does not support PyTorch models due to lack of metadata in the model. It can only verify that the number of inputs and the input names matches what is specified in the model configuration. There is no model metadata about the number of outputs and datatypes. Related PyTorch bug: https://github.com/pytorch/pytorch/issues/38273\r\n* Triton Client PIP wheels for ARM SBSA are not available from PyPI and pip will install an incorrect Jetson version of Triton Client library for Arm SBSA. The correct client wheel file can be pulled directly from the Arm SBSA SDK image and manually installed.\r\n* Traced models in PyTorch seem to create overflows when int8 tensor values are transformed to int32 on the GPU. Refer to [pytorch/pytorch#66930](https://github.com/pytorch/pytorch/issues/66930) for more information.\r\n* Triton cannot retrieve GPU metrics with [MIG-enabled GPU devices](https://docs.nvidia.com/datacenter/tesla/mig-user-guide/index.html#supported-gpus).\r\n* Triton metrics might not work if the host machine is running a separate DCGM agent on bare-metal or in a container.\r\n\r\n</details>\r\n\r\n<details>\r\n  <summary><h2>Client Libraries and Examples</h2></summary>\r\n\r\nThe client libraries and examples are available in this release exclusively via the Ubuntu 24.04–based [NGC Container](https://ngc.nvidia.com/catalog/containers/nvidia:tritonserver/tags). The SDK container includes the client libraries and examples, Performance Analyzer, and Model Analyzer. See [Getting the Client Libraries](https://github.com/triton-inference-server/client/tree/r26.08#getting-the-client-libraries-and-examples) for more information.\r\n</details>\r\n\r\n<details>\r\n  <summary><h2>ManyLinux Assets (early access)</h2></summary>\r\n\r\nThis release was compiled with AlmaLinux 8.9 based out of `manylinux_2_34` and can be used on RHEL 9 and later versions.\r\nSee the included README.md for complete details about installation, verification, and support.\r\nThis release supports ensembles. Confirm CUDA, TensorRT, ONNX Runtime, PyTorch, and Python versions in the shipped README.md.\r\nSome optional backend features such as the PyTorch backend's TorchTRT extension are not currently supported.\r\n\r\n</details>\r\n\r\n\r\n"}
