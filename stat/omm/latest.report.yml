r\n- `catppuccin-mocha`\r\n- `dracula`\r\n- `github-dark`\r\n- `gruvbox-dark`\r\n- `monokai-classic`\r\n- `onedark`\r\n- `rose-pine-moon`\r\n- `tokyonight`\r\n- `xcode-dark`\r\n\r\nhttps://github.com/user-attachments/assets/deb1bf94-c050-492d-9304-1909f8935bb9\r\n\r\n## Added\r\n\r\n- Configure theme via --theme/OMM_THEME/config-file\r\n- Allow changing theme at runtime via the TUI\r\n- Allow duplicating tasks\r\n\r\n## Removed\r\n\r\n- Support for providing colors via the flags `--tl-color` and `--atl-color`"}
