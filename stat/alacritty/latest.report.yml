"2026-04-06T19:23:11Z"},{"id":390249306,"node_id":"RA_kwDOAxkop84XQrta","name":"alacritty.info","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5003,"digest":"sha256:6f2ef62b90b5977f8aaf9f8258e177a5fe3a2b5ef213054b8ebe04ef7a198db1","download_count":478,"created_at":"2026-04-06T19:23:14Z","updated_at":"2026-04-06T19:23:14Z"},{"id":390249223,"node_id":"RA_kwDOAxkop84XQrsH","name":"Alacritty.svg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17196,"digest":"sha256:647f43a9c766f81a4f6805fcebdc2d6a8dcb989abcc50be625abf2b99b9afddb","download_count":514,"created_at":"2026-04-06T19:23:04Z","updated_at":"2026-04-06T19:23:05Z"},{"id":390249293,"node_id":"RA_kwDOAxkop84XQrtN","name":"_alacritty","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11267,"digest":"sha256:197119d243b047f85e8718e25d582f547df99f4cbf7599cdc6c37d847a04a7aa","download_count":502,"created_at":"2026-04-06T19:23:12Z","updated_at":"2026-04-06T19:23:12Z"}],"body":"### Packaging\r\n\r\n- Fixed invalid logo SVG attributes\r\n- New `alacritty-escapes(7)` manpage\r\n- Removed broken flash capability from terminfo\r\n\r\n### Added\r\n\r\n- Ability to bind `WheelUp` and `WheelDown` in `mouse.bindings`\r\n- Support TOML 1.1 syntax\r\n- `window.resize_increments` support on Wayland\r\n\r\n### Changed\r\n\r\n- Don't highlight hints on hover when the mouse cursor is hidden\r\n- IME is disabled in Vi mode on X11\r\n- Require explicit tap to enable IME with touch input\r\n- Use built-in font for block elements symbols from `U+1FB82` to `U+1FB8B`\r\n\r\n### Fixed\r\n\r\n- Brief error popup when saving the config file with some editors\r\n- Subprocesses on OpenBSD now run with their CWD set to that of the shell's foreground process.\r\n- Crash when OpenGL context resets\r\n- Crash when committing text with some IMEs on macOS\r\n- Signal termination skipping resource cleanup","reactions":{"total_count":113,"+1":41,"-1":0,"laugh":0,"hooray":31,"confused":0,"heart":21,"rocket":17,"eyes":3}}
