{"id":391813082,"author":{"login":"dylan-conway","id":35280289,"node_id":"MDQ6VXNlcjM1MjgwMjg5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQFjJqM4XWpfa","tag_name":"v0.0.77","target_commitish":"main","name":"v0.0.77","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-18T20:54:45Z","updated_at":"2026-09-18T22:09:16Z","published_at":"2026-09-18T22:09:16Z","assets":[],"body":"## What's Changed\r\n* A `/` write root (Linux) or read root (macOS) no longer switches off the denies beneath it by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/533\r\n* perf: resolve the global npm root off the event loop by @sosukesuzuki in https://github.com/anthropics/sandbox-runtime/pull/550\r\n* linux: a re-applied read-deny tmpfs restores read-only, so the write deny above it wins by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/537\r\n* linux: pass an over-long bwrap profile through --args by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/504\r\n* macos: deny a path the library computed as a literal, not a pattern by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/542\r\n* linux: keep a masked file masked when it is a write path or listed through a symlinked directory by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/554\r\n* Linux: pin ancestor directories of deny binds against rename by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/514\r\n* linux: a read deny or credential mask on a symlinked allowRead target wins over the carve-out by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/555\r\n* config: reject a deny glob written with a trailing separator by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/536\r\n* linux: collapse read-deny globs to directories, and mount denies where paths resolve by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/503\r\n* linux: throw a typed error when the bubblewrap profile cannot be run by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/553\r\n* violations: sanitize forged attribution keys, and give the Linux monitor bwrap's write rules by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/535\r\n* linux: refuse at start-up when root lacks CAP_SETFCAP, and correct the capability docs by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/534\r\n* fix(build): drop the duplicate normalizePathForSandbox import in sandbox-manager by @dylan-conway in https://github.com/anthropics/sandbox-runtime/pull/562\r\n* linux: remove the deny mount point a killed process left on the host by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/524\r\n* Default write paths obey a read deny, and interior path spellings are canonicalised by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/506\r\n* cli: refuse an unusable control fd or settings file, and keep the fd out of the sandbox by @ronleizrowice-ant in https://github.com/anthropics/sandbox-runtime/pull/539\r\n* test(windows): fix five sources of failures in the Windows CI steps by @dylan-conway in https://github.com/anthropics/sandbox-runtime/pull/563\r\n* linux: walk a read-deny glob's directories once each, not once per name by @dylan-conway in https://github.com/anthropics/sandbox-runtime/pull/564\r\n* ci: run on Bun 1.4.2, and fix two tests it and a Linux timeout exposed by @dylan-conway in https://github.com/anthropics/sandbox-runtime/pull/565\r\n* perf(proxy): keep the TLS-terminate upstream connection alive per client connection by @dylan-conway in https://github.com/anthropics/sandbox-runtime/pull/561\r\n\r\n\r\n**Full Changelog**: https://github.com/anthropics/sandbox-runtime/compare/v0.0.76...v0.0.77","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":3}
