{"id":439771825,"author":{"login":"ig-ant","id":278458262,"node_id":"U_kgDOEJjvlg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQFjJqM4aNmKx","tag_name":"v0.0.82","target_commitish":"f7a0f19fd3b4437bcf808f9c18c1f73e9f1a9889","name":"v0.0.82","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-09T23:19:19Z","updated_at":"2026-11-09T23:38:47Z","published_at":"2026-11-09T23:38:47Z","assets":[],"body":"### Changed\r\n\r\n- **Windows: the profile read grant is narrower.** It now covers a built-in list of tool directories instead of the whole profile, and `initialize()` upgrades an older grant by itself. Tools only in `scoop`, `.local`, uv's folders or elsewhere under `.config` need adding with `srt-win profile grant --include`. (#767)\r\n- **`network.mitmProxy`:** a SOCKS connection to a `mitmProxy.domains` host now goes through the MITM socket, as an HTTP CONNECT already did, so a TLS client on it has to trust that proxy's CA. (#764)\r\n\r\n### New\r\n\r\n- **Windows: opt-in MXC BaseContainer backend.** Set `windows.backend: 'mxc'` and start commands with `SandboxManager.spawnSandboxed()`. Needs Node 24+ and the optional dependency `@microsoft/mxc-sdk`. MSYS2 programs, Git Bash included, don't run under it yet. (#766)\r\n\r\n### Fixed\r\n\r\n- The HTTP proxy logs only fixed fields of an upstream error, since a message or stack can carry credentials. (#766)\r\n- Windows error messages print the correct `npx @anthropic-ai/sandbox-runtime windows-install`. (#774)"}
