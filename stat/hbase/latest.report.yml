{"id":365932918,"author":{"login":"Apache9","id":4958168,"node_id":"MDQ6VXNlcjQ5NTgxNjg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOATKMAc4Vz7F2","tag_name":"rel/3.0.0","target_commitish":"master","name":"Apache HBase 3.0.0 is now available for download","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-05T04:56:56Z","updated_at":"2026-08-06T02:06:26Z","published_at":"2026-08-06T02:06:26Z","assets":[],"body":"The HBase team is happy to announce the immediate availability of HBase\r\n3.0.0.\r\n\r\nApache HBase\u2122 is an open-source, distributed, versioned, non-relational\r\ndatabase. Apache HBase gives you low latency random access to billions of rows\r\nwith millions of columns atop non-specialized hardware. To learn more about\r\nHBase, see https://hbase.apache.org/.\r\n\r\nHBase 3.0.0 is the first GA release for the 3.x release line, which includes\r\nroughly 5000+ resolved issues since 2.0.0.\r\n\r\nNotice that, starting from 3.0.0, we have moved up to JDK17. JDK8 and JDK11\r\nsupport have been dropped.\r\n\r\nNotable new features include:\r\n  Synchronous Replication\r\n  OpenTelemetry Tracing\r\n  Distributed MOB Compaction\r\n  Backup and Restore\r\n  Decouple region replication and general replication framework, and also\r\n    make region replication can work when SKIP_WAL is used\r\n  A new file system based replication peer storage\r\n  Use hbase table instead of zookeeper for tracking hbase replication queue\r\n\r\nFor other important changes:\r\n  We do not support hadoop 2.x any more\r\n  Move RSGroup balancer to core\r\n  Reimplement sync client on async client\r\n  CPEPs on shaded proto\r\n  Move the logging framework from log4j to log4j2\r\n  Yield SCP and TRSP to improve MTTR when restarting large cluster\r\n\r\nThe full list of issues and release notes can be found here:\r\n\r\nCHANGELOG: https://downloads.apache.org/hbase/3.0.0/CHANGES.md\r\nRELEASENOTES: https://downloads.apache.org/hbase/3.0.0/RELEASENOTES.md\r\n\r\nor via our issue tracker:\r\n\r\n  https://issues.apache.org/jira/projects/HBASE/versions/12353161\r\n\r\nTo download please follow the links and instructions on our website:\r\n\r\n  https://hbase.apache.org/downloads.html\r\n\r\nQuestions, comments, and problems are always welcome at:\r\n\r\n  dev@hbase.apache.org\r\n  user@hbase.apache.org\r\n  user-zh@hbase.apache.org\r\n\r\nThanks to all who contributed and made this release possible.\r\n\r\nCheers,\r\nThe HBase Dev Team","reactions":{"total_count":9,"+1":6,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0}}
