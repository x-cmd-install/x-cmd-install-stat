{"id":413856383,"author":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORQr9ws4YqvJ_","tag_name":"v2.4.8","target_commitish":"def77937d70cb544654bad1626ae7941311c9d78","name":"v2.4.8 - OrcaRouter Login and Settings","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-15T13:38:02Z","updated_at":"2026-10-15T13:42:45Z","published_at":"2026-10-15T13:42:45Z","assets":[{"id":643985221,"node_id":"RA_kwDORQr9ws4mYm9F","name":"llm-pid-tuner.exe","label":"","uploader":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":19522837,"digest":"sha256:6b600522f8e9e8348ce78d5380a435ca2f8a0d49c0acd568d8bc9bd0a8815781","download_count":7,"created_at":"2026-10-15T13:39:04Z","updated_at":"2026-10-15T13:39:08Z"},{"id":643985220,"node_id":"RA_kwDORQr9ws4mYm9E","name":"SHA256SUMS.txt","label":"","uploader":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":84,"digest":"sha256:fd4ea2181c85762ca88a6a1d22e1b5d64f7fb51143d4635e0a3ae17b88e91095","download_count":2,"created_at":"2026-10-15T13:39:04Z","updated_at":"2026-10-15T13:39:05Z"}],"body":"## v2.4.8 \u2014 OrcaRouter \u767b\u5f55\u4e0e\u8bbe\u7f6e\n\n\u672c\u6b21\u53d1\u5e03\u5305\u542b PR #50\uff0c\u5e76\u4fee\u590d\u53d1\u5e03\u68c0\u67e5\u4e2d\u53d1\u73b0\u7684\u767b\u5f55\u3001\u8bbe\u7f6e\u4fdd\u5b58\u53ca\u754c\u9762\u5361\u987f\u95ee\u9898\u3002\u5df2\u6709 OpenAI\u3001Claude \u548c\u5176\u4ed6 OpenAI \u517c\u5bb9\u63a5\u53e3\u7ee7\u7eed\u6cbf\u7528\u539f\u914d\u7f6e\u3002\n\n### \u66f4\u65b0\n\n- \u53ef\u9009 OrcaRouter \u63d0\u4f9b\u5546\uff1a\u652f\u6301\u5df2\u6709 API Key \u548c OAuth 2.0 + PKCE \u6d4f\u89c8\u5668\u767b\u5f55\uff0c\u590d\u7528\u73b0\u6709 OpenAI \u517c\u5bb9\u4f20\u8f93\u3002\n- \u8865\u9f50\u8bbe\u7f6e\u9875\u7684\u6388\u6743\u56de\u8c03\u3001\u5bc6\u94a5\u4ea4\u6362\u548c\u914d\u7f6e\u4fdd\u5b58\uff1b\u53d6\u6d88\u767b\u5f55\u6216\u6e05\u9664\u5bc6\u94a5\u540e\uff0c\u65e7\u8bf7\u6c42\u4e0d\u4f1a\u6062\u590d\u65e7\u51ed\u636e\u3002\n- \u6a21\u578b\u4ece\u76ee\u5f55\u9009\u62e9\u5e76\u4fdd\u5b58\uff0c\u91cd\u65b0\u6253\u5f00\u8bbe\u7f6e\u53ef\u6062\u590d\uff1b\u4fdd\u5b58\u7684\u63d0\u4f9b\u5546\u548c\u6a21\u578b\u5728\u4e0b\u4e00\u6b21\u8c03\u53c2\u4f1a\u8bdd\u751f\u6548\u3002\n- TUI \u6309 `o` \u6253\u5f00\u8bbe\u7f6e\uff0c\u6a21\u578b\u76ee\u5f55\u5728\u540e\u53f0\u52a0\u8f7d\uff1b\u7f51\u7edc\u6162\u65f6\u4ecd\u53ef\u5173\u95ed\u9762\u677f\u3002\n- EXE \u652f\u6301 `llm-pid-tuner.exe tune --orcarouter-settings`\uff0c\u4ee5\u53ca `--orcarouter-key`\u3001`--orcarouter-login`\u3001`--orcarouter-status`\u3001`--orcarouter-logout`\u3002\u65e0\u6d4f\u89c8\u5668\u65f6\u4f7f\u7528 `tune --orcarouter-login --orcarouter-flow B`\u3002\n- \u4fee\u590d\u9ed8\u8ba4 OrcaRouter \u5730\u5740\u7684\u8bca\u65ad\u68c0\u67e5\uff1b\u5bc6\u94a5\u88ab\u62d2\u7edd\u65f6\u7acb\u5373\u63d0\u793a\u91cd\u65b0\u8ba4\u8bc1\uff0c\u51cf\u5c11\u65e0\u6548\u91cd\u8bd5\u7b49\u5f85\u3002\n- \u914d\u7f6e\u901a\u8fc7\u4e34\u65f6\u6587\u4ef6\u539f\u5b50\u4fdd\u5b58\uff0c\u5199\u5165\u5931\u8d25\u4f1a\u56de\u6eda\u914d\u7f6e\u53d8\u66f4\u3002\n- \u5305\u542b\u4e0a\u4e2a\u7248\u672c\u4ee5\u6765\u7684\u5b9e\u9a8c\u6027 PLC Modbus \u6e90\u7801\u539f\u578b\u548c MIT \u8bb8\u53ef\u8bc1\u66f4\u65b0\u3002\n\n### \u9a8c\u8bc1\n\n- \u6784\u5efa\u73af\u5883\uff1a`C:\\Users\\Administrator\\conda-envs\\matlab310\\python.exe`\uff0cPython **3.10.20**\uff0cPyInstaller **6.19.0**\u3002\n- \u5b8c\u6574\u56de\u5f52\uff1a**453 passed, 13 subtests passed**\uff1b\u4fee\u6539\u6a21\u5757\u7684 Flake8 `F` / `E9` \u68c0\u67e5\u901a\u8fc7\u3002\n- \u672c\u5730\u6a21\u62df\u8ba4\u8bc1\u53ca\u63a8\u7406\u670d\u52a1\uff1a\u6388\u6743\u56de\u8c03 \u2192 \u5bc6\u94a5\u4ea4\u6362 \u2192 \u4fdd\u5b58 \u2192 \u9009\u62e9\u6a21\u578b \u2192 \u5b9e\u9645\u6d41\u5f0f HTTP \u8c03\u7528\u901a\u8fc7\uff1b\u8986\u76d6\u53d6\u6d88\u3001\u5199\u5165\u5931\u8d25\u3001401 \u5feb\u901f\u5931\u8d25\u3002\n- Textual \u5b9e\u9645\u4ea4\u4e92\uff1a\u5bc6\u94a5\u4fdd\u5b58\u3001\u6a21\u578b\u6062\u590d\u3001\u6253\u5f00/\u5173\u95ed\u8bbe\u7f6e\u3001\u6162\u7f51\u7edc\u4e0b\u9000\u51fa\u901a\u8fc7\u3002\n- \u53d1\u5e03 EXE\uff1a\u5e2e\u52a9\u3001\u51ed\u636e\u547d\u4ee4\u3001\u6d4f\u89c8\u5668\u8bbe\u7f6e\u9875\u3001\u6a21\u578b\u4fdd\u5b58\u540e\u91cd\u65b0\u52a0\u8f7d\uff0c\u4ee5\u53ca\u5b8c\u6574 Python \u4eff\u771f\u901a\u8fc7\u3002\n- \u53d1\u5e03 EXE + **MATLAB R2022b Update 10**\uff1a\u771f\u5b9e Simulink \u95ed\u73af\u6a21\u578b\u5b8c\u6210 201 \u4e2a\u91c7\u6837\u70b9\u3001PID \u5199\u5165\u548c\u4e00\u6b21\u5b8c\u6574\u8c03\u53c2\u6d41\u7a0b\uff1b\u6e90\u7801\u6865\u63a5\u53e6\u9a8c\u8bc1\u8fd0\u884c\u65f6\u76ee\u6807\u503c\u4ece 1.0 \u66f4\u65b0\u81f3 1.5\u3002\n- \u672a\u8fde\u63a5\u771f\u5b9e\u4e32\u53e3\u786c\u4ef6\uff1bOrcaRouter \u771f\u5b9e\u8d26\u53f7\u7684\u4eba\u5de5\u6388\u6743/\u64a4\u9500\u548c\u8ba1\u8d39\u63a5\u53e3\u672a\u5b9e\u6d4b\uff0c\u76f8\u5173\u81ea\u52a8\u5316\u4f7f\u7528\u672c\u5730\u6a21\u62df\u670d\u52a1\u3002\n\n### \u4e0b\u8f7d\u4e0e\u6821\u9a8c\n\n- Windows \u8d44\u4ea7\uff1a`llm-pid-tuner.exe`\uff0819,522,837 \u5b57\u8282\uff09\n- SHA256\uff1a`6b600522f8e9e8348ce78d5380a435ca2f8a0d49c0acd568d8bc9bd0a8815781`\n- \u6e90\u7801\u63d0\u4ea4\uff1a`def77937d70cb544654bad1626ae7941311c9d78`\n\n\u4fdd\u7559\u81ea\u5df1\u7684 `config.json` \u5373\u53ef\u5347\u7ea7\u3002\u4ec5\u4f7f\u7528\u5df2\u6709\u63d0\u4f9b\u5546\u65f6\uff0c\u65e0\u9700\u914d\u7f6e OrcaRouter\u3002\n\n---\n\nOptional OrcaRouter API-key/PKCE authentication now completes the full settings-to-inference flow. This release also fixes persisted model selection, background catalog loading, packaged CLI routing and immediate reauthentication feedback on HTTP 401. Existing provider configurations remain supported.\n\nBuilt with the MATLAB-compatible Python 3.10.20 environment; 453 tests and 13 subtests passed. The shipped EXE passed Python simulation and a real MATLAB R2022b Simulink tuning run. Real serial hardware and human approval/revocation with a live OrcaRouter account were not exercised.\n"}
