9762\u5de5\u4f5c\u53f0\n\n\u8fd9\u6b21\u66f4\u65b0\u5c06 PID \u8c03\u53c2\u5e26\u5230\u72ec\u7acb Windows \u684c\u9762\u7a97\u53e3\uff0c\u5305\u542b PR #52\u3001#53 \u548c #54\u3002\n\n![\u767d\u663c\u4e2d\u6587\u4e0e\u6697\u9ed1\u82f1\u6587\u754c\u9762](https://github.com/KINGSTON-115/llm-pid-tuner/releases/download/v2.5.0/desktop-preview.png)\n\n### \u66f4\u65b0\n\n- \u5b9e\u65f6\u54cd\u5e94\u3001\u76ee\u6807\u503c\u548c\u63a7\u5236\u8f93\u51fa\u66f2\u7ebf\uff0c\u914d\u5408 PID \u914d\u7f6e\u3001\u6307\u6807\u5361\u3001AI \u5206\u6790\u3001\u8f6e\u6b21\u8bb0\u5f55\u53ca\u8fd0\u884c\u65e5\u5fd7\u3002\n- **\u767d\u663c / \u6697\u9ed1 / \u8ddf\u968f\u7cfb\u7edf**\u4e09\u79cd\u5916\u89c2\uff1b**\u7b80\u4f53\u4e2d\u6587 / English** \u5168\u5c40\u5207\u6362\u5e76\u4fdd\u5b58\u504f\u597d\u3002\u8fd0\u884c\u4e2d\u5207\u6362\u4fdd\u7559\u66f2\u7ebf\u548c\u4f1a\u8bdd\u72b6\u6001\u3002\n- \u4fee\u590d\u767d\u663c\u6a21\u5f0f\u4e0b\u62c9\u9009\u9879\u6587\u5b57\u8fc7\u6d45\u3001\u770b\u4e0d\u6e05\u7684\u95ee\u9898\uff0c\u666e\u901a\u9879\u548c\u9009\u4e2d\u9879\u5747\u4f7f\u7528\u5f53\u524d\u4e3b\u9898\u7ed8\u5236\u3002\n- \u9ed8\u8ba4\u672c\u5730\u70ed\u7cfb\u7edf\u4eff\u771f\u548c\u79bb\u7ebf\u89c4\u5219\u4f53\u9a8c\uff0c**\u65e0\u9700 API Key\u3001\u786c\u4ef6\u6216 Python \u73af\u5883**\u5373\u53ef\u5f00\u59cb\u3002\n- \u652f\u6301\u6682\u505c\u3001\u7ee7\u7eed\u3001\u505c\u6b62\u3001\u8fd0\u884c\u65f6\u76ee\u6807\u503c\u8c03\u6574\uff0c\u5b8c\u6574 CSV / JSON \u5bfc\u51fa\uff1b\u590d\u7528\u539f\u6709 AI\u3001\u4e32\u53e3\u548c Simulink \u8c03\u53c2\u5f15\u64ce\u53ca\u53c2\u6570\u62a4\u680f\u3002\n- \u540c\u5305\u4fdd\u7559\u7ec8\u7aef\u542f\u52a8\u5668\uff0c\u652f\u6301 `--tui`\u3001`sim`\u3001`tune` \u53ca OrcaRouter \u767b\u5f55 / \u6a21\u578b\u8bbe\u7f6e\u547d\u4ee4\u3002\n\n### \u4e0b\u8f7d\u4e0e\u5347\u7ea7\n\n1. \u4e0b\u8f7d\u8d44\u4ea7 **`llm-pid-tuner-v2.5.0-windows-x64.zip`**\uff0c\u5b8c\u6574\u89e3\u538b\u5230\u53ef\u5199\u76ee\u5f55\u3002\n2. \u53cc\u51fb **`llm-pid-tuner-desktop.exe`**\u3002\u52a1\u5fc5\u4fdd\u7559\u540c\u76ee\u5f55\u7684 **`_internal`** \u6587\u4ef6\u5939\uff0c\u4e24\u4e2a EXE \u90fd\u4f9d\u8d56\u5b83\u3002\n3. \u4fdd\u6301\u201c\u672c\u5730\u70ed\u7cfb\u7edf\u4eff\u771f / \u79bb\u7ebf\u89c4\u5219\u4f53\u9a8c\u201d\uff0c\u70b9\u51fb\u201c\u5f00\u59cb\u8c03\u53c2\u201d\u5373\u53ef\u4f53\u9a8c\u3002AI \u4e0e\u8bbe\u5907\u914d\u7f6e\u5728\u201c\u8fde\u63a5\u8bbe\u7f6e\u201d\u4e2d\u586b\u5199\u3002\n4. \u4ece v2.4.x \u5347\u7ea7\u65f6\uff0c\u5c06\u81ea\u5df1\u7684 **`config.json`** \u590d\u5236\u5230\u65b0\u76ee\u5f55\u4ee5\u4fdd\u7559\u5bc6\u94a5\u53ca\u9ad8\u7ea7\u914d\u7f6e\uff1b\u53d1\u5e03\u5305\u4e0d\u5305\u542b\u4e2a\u4eba\u914d\u7f6e\u3002\n\n\u7ec8\u7aef\u793a\u4f8b\uff08\u5728\u89e3\u538b\u76ee\u5f55\u4e2d\u8fd0\u884c PowerShell\uff09\uff1a\n\n```powershell\n.\\llm-pid-tuner.exe --tui\n.\\llm-pid-tuner.exe sim\n.\\llm-pid-tuner.exe tune COM5\n.\\llm-pid-tuner.exe tune --orcarouter-settings\n```\n\n[\u4e2d\u6587\u684c\u9762\u6307\u5357](https://github.com/KINGSTON-115/llm-pid-tuner/blob/v2.5.0/docs/zh-CN/DESKTOP_GUIDE.md) \u00b7 [English guide](https://github.com/KINGSTON-115/llm-pid-tuner/blob/v2.5.0/docs/en-US/DESKTOP_GUIDE.md)\n\n### \u9a8c\u8bc1\u4e0e\u6821\u9a8c\n\n- \u5b8c\u6574\u56de\u5f52\uff1a**503 passed, 13 subtests passed**\uff1b\u684c\u9762\u4e0e\u6587\u6848\u4e13\u9879\uff1a**30 passed**\u3002\n- \u65b0\u589e\u56de\u5f52\u6d4b\u8bd5\u5148\u590d\u73b0\u539f\u9519\u8bef\uff0c\u518d\u68c0\u67e5\u771f\u5b9e\u5f39\u51fa\u5217\u8868\u7684\u666e\u901a / \u9009\u4e2d\u9879\u6587\u5b57\uff0c\u8986\u76d6\u4e24\u79cd\u8bed\u8a00\u3001\u53cd\u590d\u5207\u6362\u6df1\u6d45\u8272\u3001\u9f20\u6807\u4e0e\u952e\u76d8\u64cd\u4f5c\uff1b\u540c\u6837\u901a\u8fc7 Windows \u539f\u751f\u7a97\u53e3\u4e0e DPI \u7f29\u653e\u9a8c\u8bc1\u3002\n- \u65b0\u6784\u5efa\u7684\u684c\u9762 EXE \u901a\u8fc7\u6697\u9ed1\u82f1\u6587\u3001\u767d\u663c\u4e2d\u6587\u7a97\u53e3\u542f\u52a8\u3001\u539f\u751f\u6807\u9898\u680f\u53ca\u6b63\u5e38\u5173\u95ed\u68c0\u67e5\uff1b\u7ec8\u7aef\u542f\u52a8\u5668\u547d\u4ee4\u8def\u7531\u4e0e\u5e2e\u52a9\u68c0\u67e5\u901a\u8fc7\u3002\n- \u5305\u5185\u6a21\u5757\u4e0e\u6e90\u7801\u4e00\u81f4\uff0cQt \u4e2d\u6587\u7ffb\u8bd1\u6587\u4ef6\u9f50\u5168\uff1bZIP CRC \u68c0\u67e5\u901a\u8fc7\u3002\n- \u672c\u6b21\u672a\u8fde\u63a5\u771f\u5b9e\u4e32\u53e3\u786c\u4ef6\u3001\u8fd0\u884c\u771f\u5b9e MATLAB \u6a21\u578b\u6216\u8c03\u7528\u4ed8\u8d39\u6a21\u578b\u670d\u52a1\uff1b\u76f8\u5173\u81ea\u52a8\u5316\u4f7f\u7528 DEMO \u6216\u6d4b\u8bd5\u66ff\u8eab\u3002\n\nWindows ZIP\uff1a**70,270,294 \u5b57\u8282**\u3002SHA256\uff08\u53e6\u9644 `SHA256SUMS.txt`\uff09\uff1a\n\n```text\n0ea389978ff9048a5f9f075abd6966d80e328b31602cce46939c3f52a3bc81e1\n```\n\n\u6e90\u7801\u63d0\u4ea4\uff1a`6f6e9c4570f03ca22508c31409d9ac675c359d12`\u3002\u6784\u5efa\uff1aPython 3.10.20\u3001PyInstaller 6.19.0\u3001PySide6 6.10.2\u3002\n\n---\n\n## English\n\nv2.5.0 introduces the native Windows desktop workbench with live plots, PID controls, analysis/history, full CSV/JSON exports, Light/Dark/System appearance and global Chinese/English switching. Preferences persist and live switches preserve the active session. This release also fixes pale dropdown text in Light mode.\n\nDownload the **Windows x64 ZIP**, extract the **entire folder**, and open **`llm-pid-tuner-desktop.exe`**. Keep **`_internal`** beside both EXEs. The default local simulation with offline rules needs no API key, hardware or Python installation. Copy your existing `config.json` into the new folder to retain credentials and advanced settings. The included console launcher supports the commands shown above.\n\nFull regression: **503 tests and 13 subtests passed**. Native Windows popup/DPI and packaged startup/shutdown checks passed. Real serial hardware, actual MATLAB models and paid model services were not exercised in this release. Verify the ZIP using the SHA256 above or `SHA256SUMS.txt`.\n"}
