{"id":414616878,"author":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORQr9ws4Yto0u","tag_name":"v2.5.0","target_commitish":"6f6e9c4570f03ca22508c31409d9ac675c359d12","name":"v2.5.0 - Native Desktop Workbench","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-16T06:13:54Z","updated_at":"2026-10-16T06:19:23Z","published_at":"2026-10-16T06:19:23Z","assets":[{"id":646360209,"node_id":"RA_kwDORQr9ws4mhqyR","name":"desktop-preview.png","label":"","uploader":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"image/png","state":"uploaded","size":171370,"digest":"sha256:f0ba94a86528baef1b6c046399c16477effe081a14bb027320e9f96295e53fa6","download_count":115,"created_at":"2026-10-16T06:18:06Z","updated_at":"2026-10-16T06:18:07Z"},{"id":646360207,"node_id":"RA_kwDORQr9ws4mhqyP","name":"llm-pid-tuner-v2.5.0-windows-x64.zip","label":"","uploader":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":70270294,"digest":"sha256:0ea389978ff9048a5f9f075abd6966d80e328b31602cce46939c3f52a3bc81e1","download_count":68,"created_at":"2026-10-16T06:18:06Z","updated_at":"2026-10-16T06:18:28Z"},{"id":646360208,"node_id":"RA_kwDORQr9ws4mhqyQ","name":"SHA256SUMS.txt","label":"","uploader":{"login":"KINGSTON-115","id":141025356,"node_id":"U_kgDOCGfgTA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":104,"digest":"sha256:2ff500a2f4aafb8b593d6a32984028a693a38a6e8f0d5ec3554928fd7ab32edb","download_count":13,"created_at":"2026-10-16T06:18:06Z","updated_at":"2026-10-16T06:18:07Z"}],"body":"## v2.5.0 — 原生桌面工作台\n\n这次更新将 PID 调参带到独立 Windows 桌面窗口，包含 PR #52、#53 和 #54。\n\n![白昼中文与暗黑英文界面](https://github.com/KINGSTON-115/llm-pid-tuner/releases/download/v2.5.0/desktop-preview.png)\n\n### 更新\n\n- 实时响应、目标值和控制输出曲线，配合 PID 配置、指标卡、AI 分析、轮次记录及运行日志。\n- **白昼 / 暗黑 / 跟随系统**三种外观；**简体中文 / English** 全局切换并保存偏好。运行中切换保留曲线和会话状态。\n- 修复白昼模式下拉选项文字过浅、看不清的问题，普通项和选中项均使用当前主题绘制。\n- 默认本地热系统仿真和离线规则体验，**无需 API Key、硬件或 Python 环境**即可开始。\n- 支持暂停、继续、停止、运行时目标值调整，完整 CSV / JSON 导出；复用原有 AI、串口和 Simulink 调参引擎及参数护栏。\n- 同包保留终端启动器，支持 `--tui`、`sim`、`tune` 及 OrcaRouter 登录 / 模型设置命令。\n\n### 下载与升级\n\n1. 下载资产 **`llm-pid-tuner-v2.5.0-windows-x64.zip`**，完整解压到可写目录。\n2. 双击 **`llm-pid-tuner-desktop.exe`**。务必保留同目录的 **`_internal`** 文件夹，两个 EXE 都依赖它。\n3. 保持“本地热系统仿真 / 离线规则体验”，点击“开始调参”即可体验。AI 与设备配置在“连接设置”中填写。\n4. 从 v2.4.x 升级时，将自己的 **`config.json`** 复制到新目录以保留密钥及高级配置；发布包不包含个人配置。\n\n终端示例（在解压目录中运行 PowerShell）：\n\n```powershell\n.\\llm-pid-tuner.exe --tui\n.\\llm-pid-tuner.exe sim\n.\\llm-pid-tuner.exe tune COM5\n.\\llm-pid-tuner.exe tune --orcarouter-settings\n```\n\n[中文桌面指南](https://github.com/KINGSTON-115/llm-pid-tuner/blob/v2.5.0/docs/zh-CN/DESKTOP_GUIDE.md) · [English guide](https://github.com/KINGSTON-115/llm-pid-tuner/blob/v2.5.0/docs/en-US/DESKTOP_GUIDE.md)\n\n### 验证与校验\n\n- 完整回归：**503 passed, 13 subtests passed**；桌面与文案专项：**30 passed**。\n- 新增回归测试先复现原错误，再检查真实弹出列表的普通 / 选中项文字，覆盖两种语言、反复切换深浅色、鼠标与键盘操作；同样通过 Windows 原生窗口与 DPI 缩放验证。\n- 新构建的桌面 EXE 通过暗黑英文、白昼中文窗口启动、原生标题栏及正常关闭检查；终端启动器命令路由与帮助检查通过。\n- 包内模块与源码一致，Qt 中文翻译文件齐全；ZIP CRC 检查通过。\n- 本次未连接真实串口硬件、运行真实 MATLAB 模型或调用付费模型服务；相关自动化使用 DEMO 或测试替身。\n\nWindows ZIP：**70,270,294 字节**。SHA256（另附 `SHA256SUMS.txt`）：\n\n```text\n0ea389978ff9048a5f9f075abd6966d80e328b31602cce46939c3f52a3bc81e1\n```\n\n源码提交：`6f6e9c4570f03ca22508c31409d9ac675c359d12`。构建：Python 3.10.20、PyInstaller 6.19.0、PySide6 6.10.2。\n\n---\n\n## English\n\nv2.5.0 introduces the native Windows desktop workbench with live plots, PID controls, analysis/history, full CSV/JSON exports, Light/Dark/System appearance and global Chinese/English switching. Preferences persist and live switches preserve the active session. This release also fixes pale dropdown text in Light mode.\n\nDownload the **Windows x64 ZIP**, extract the **entire folder**, and open **`llm-pid-tuner-desktop.exe`**. Keep **`_internal`** beside both EXEs. The default local simulation with offline rules needs no API key, hardware or Python installation. Copy your existing `config.json` into the new folder to retain credentials and advanced settings. The included console launcher supports the commands shown above.\n\nFull regression: **503 tests and 13 subtests passed**. Native Windows popup/DPI and packaged startup/shutdown checks passed. Real serial hardware, actual MATLAB models and paid model services were not exercised in this release. Verify the ZIP using the SHA256 above or `SHA256SUMS.txt`.\n"}
