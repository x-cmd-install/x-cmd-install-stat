startswith and endswith by @56steve in https://github.com/kcl-lang/kcl/pull/2231\n* fix(runtime): return groups and handle unmatched groups in regex.findall by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2233\n* fix(runtime): count characters, not bytes, for str len, subscript and iteration by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2232\n* fix(runtime): return correct float results from math.log, log2 and log1p by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2237\n* fix(runtime): round half to even in round() and keep int results for ints by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2238\n* fix(runtime): compute int pow() and math.pow() exactly and check overflow by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2239\n* fix(runtime): stop units.to_n, to_u and to_m losing one unit to float division by @56steve in https://github.com/kcl-lang/kcl/pull/2243\n* fix(runtime): parse base 10 int() strings exactly and report invalid input by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2247\n* fix(runtime): reject NaN and out-of-range floats in int() instead of saturating by @NopeCharon in https://github.com/kcl-lang/kcl/pull/2248\n* perf(evaluator): free builtin call arguments and results after each call by @steeling in https://github.com/kcl-lang/kcl/pull/2249\n* perf(evaluator,runtime): drop per-lookup allocations in scope helpers and is_literal_type by @steeling in https://github.com/kcl-lang/kcl/pull/2250\n* fix(evaluator): restore panic info after runtime.catch catches an error by @steeling in https://github.com/kcl-lang/kcl/pull/2251\n* perf(runtime): read schema attributes without cloning the schema config by @steeling in https://github.com/kcl-lang/kcl/pull/2252\n* perf(runtime): cache compiled patterns in the regex module by @steeling in https://github.com/kcl-lang/kcl/pull/2254\n* perf(evaluator): skip recording schema instances nothing can read by @steeling in https://github.com/kcl-lang/kcl/pull/2257\n* feat: Export subcommand [--target=python] by @mihaigalos in https://github.com/kcl-lang/kcl/pull/2230\n* fix(runtime): split and rsplit on unicode whitespace when no separator is given by @56steve in https://github.com/kcl-lang/kcl/pull/2258\n* feat: Export subcommand [--target=golang] by @mihaigalos in https://github.com/kcl-lang/kcl/pull/2259\n* perf(evaluator): check typed list and dict values before copying them by @steeling in https://github.com/kcl-lang/kcl/pull/2253\n* perf(tools): add an eval-once mode to kcl test that evaluates the package once by @steeling in https://github.com/kcl-lang/kcl/pull/2256\n* feat: Export subcommand [--target=java] by @mihaigalos in https://github.com/kcl-lang/kcl/pull/2261\n* feat: Export subcommand [--target=typescript] by @mihaigalos in https://github.com/kcl-lang/kcl/pull/2262\n* perf(evaluator): skip the assignment copy of lambda locals when it is unobservable by @steeling in https://github.com/kcl-lang/kcl/pull/2255\n* chore(release): bump version to v0.13.3 by @Peefy in https://github.com/kcl-lang/kcl/pull/2263\n\n## New Contributors\n* @mihaigalos made their first contribution in https://github.com/kcl-lang/kcl/pull/2228\n* @NopeCharon made their first contribution in https://github.com/kcl-lang/kcl/pull/2233\n* @steeling made their first contribution in https://github.com/kcl-lang/kcl/pull/2249\n\n**Full Changelog**: https://github.com/kcl-lang/kcl/compare/v0.13.2...v0.13.3","mentions_count":5}
