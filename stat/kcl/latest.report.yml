y in https://github.com/kcl-lang/kcl/pull/2220\n* fix(lsp): keep completion on an attribute name typed before its `:` or `=` by @jul-m in https://github.com/kcl-lang/kcl/pull/2221\n* chore(release): bump version to v0.13.2 by @Peefy in https://github.com/kcl-lang/kcl/pull/2222\n* fix(runner): install the panic hook once instead of swapping it per run by @tobias-karlsson in https://github.com/kcl-lang/kcl/pull/2224\n* ci(release): update kcl-lsp Homebrew tap and Scoop manifest on release by @Peefy in https://github.com/kcl-lang/kcl/pull/2225\n* ci(release): use the org DEPLOY_TOKEN for tap updates by @Peefy in https://github.com/kcl-lang/kcl/pull/2226\n\n## New Contributors\n* @jul-m made their first contribution in https://github.com/kcl-lang/kcl/pull/2221\n* @tobias-karlsson made their first contribution in https://github.com/kcl-lang/kcl/pull/2224\n\n**Full Changelog**: https://github.com/kcl-lang/kcl/compare/v0.13.1...v0.13.2","mentions_count":3}
