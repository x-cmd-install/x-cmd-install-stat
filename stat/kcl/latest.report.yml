ta snapshot macro to document_symbol, semantic_token, formatting by @Peefy in https://github.com/kcl-lang/kcl/pull/2190\n* feat(runtime): add `duration` system package (#1907) by @Peefy in https://github.com/kcl-lang/kcl/pull/2192\n* fix(api): make ValidateCode, Rename and UpdateDependencies work on WASI/wasm32 by @Peefy in https://github.com/kcl-lang/kcl/pull/2203\n* feat(runtime): add path:ref syntax to file.read / file.readbase64 by @Peefy in https://github.com/kcl-lang/kcl/pull/2196\n* feat(api): add sourcemap_output to ExecProgramArgs for Source Map v3 requests by @Peefy in https://github.com/kcl-lang/kcl/pull/2204\n* fix(api): use a single service method registry for BuiltinService.ListMethod by @Peefy in https://github.com/kcl-lang/kcl/pull/2205\n* fix(lsp): wasm32 shim for Url::from_file_path / to_file_path by @robinbraemer in https://github.com/kcl-lang/kcl/pull/2207\n* fix(runtime): self-contained plugin stub on wasm32-unknown-unknown by @robinbraemer in https://github.com/kcl-lang/kcl/pull/2208\n* fix(parser): resolve external/internal packages correctly through WASI preopens on wasm32 by @robinbraemer in https://github.com/kcl-lang/kcl/pull/2206\n* feat(api): LoadPackage info fields, FormatTestReport and code generation RPCs by @Peefy in https://github.com/kcl-lang/kcl/pull/2209\n* feat(api): LoadPackage info fields, FormatTestReport and code generation RPCs by @Peefy in https://github.com/kcl-lang/kcl/pull/2210\n* fix(api): forward exec_args.work_dir in GetSchemaTypeMappingUnderPath by @Peefy in https://github.com/kcl-lang/kcl/pull/2211\n* fix(sema): a plain config key must not shadow an enclosing schema attr by @Peefy in https://github.com/kcl-lang/kcl/pull/2213\n* chore(release): bump workspace version to 0.13.1 by @Peefy in https://github.com/kcl-lang/kcl/pull/2214\n* ci(release): fix musl target install failing the cargo-zigbuild step by @Peefy in https://github.com/kcl-lang/kcl/pull/2215\n\n## New Contributors\n* @robinbraemer made their first contribution in https://github.com/kcl-lang/kcl/pull/2207\n\n**Full Changelog**: https://github.com/kcl-lang/kcl/compare/v0.13.0...v0.13.1","mentions_count":2}
