0\r\n* chore: add ubuntu arm runner to schedule workflow and trigger by main. by @liangyuanpeng in https://github.com/kcl-lang/kcl/pull/1842\r\n* ci: refactor kcl test scripts for different target os by @Peefy in https://github.com/kcl-lang/kcl/pull/1861\r\n* fix: handle error when lsp watch init failed by @He1pa in https://github.com/kcl-lang/kcl/pull/1866\r\n* chore: bump rust toolchain version to 1.84.1 by @Peefy in https://github.com/kcl-lang/kcl/pull/1875\r\n* fix: fix eval get val from schema lambda by @He1pa in https://github.com/kcl-lang/kcl/pull/1872\r\n* fix: fix init fs event watcher. by @He1pa in https://github.com/kcl-lang/kcl/pull/1881\r\n* feat: add opts for external deps for api validate by @zong-zhe in https://github.com/kcl-lang/kcl/pull/1885\r\n* fix: parse octet by @Peefy in https://github.com/kcl-lang/kcl/pull/1892\r\n* Base32 Module Integration for KCL Standard Library  by @gitatractivo in https://github.com/kcl-lang/kcl/pull/1883\r\n* Fix net spit and join functions by @johngmyers in https://github.com/kcl-lang/kcl/pull/1906\r\n* fix: fix `net.is_IP_in_CIDR` with IPv6 by @He1pa in https://github.com/kcl-lang/kcl/pull/1908\r\n* fix: net.parse_cidr support IPv6 by @johngmyers in https://github.com/kcl-lang/kcl/pull/1909\r\n* fix: fix `net.is_IP_in_CIDR` corner cases by @johngmyers in https://github.com/kcl-lang/kcl/pull/1913\r\n* Remove None-safety from various net functions by @johngmyers in https://github.com/kcl-lang/kcl/pull/1912\r\n* feat: add net.CIDR_subnet function by @johngmyers in https://github.com/kcl-lang/kcl/pull/1916\r\n* feat: add net.CIDR_subnets function by @johngmyers in https://github.com/kcl-lang/kcl/pull/1917\r\n* feat: add net.CIDR_host function by @johngmyers in https://github.com/kcl-lang/kcl/pull/1920\r\n* feat: add net.CIDR_netmask function by @johngmyers in https://github.com/kcl-lang/kcl/pull/1921\r\n* chore: bump version 0.11.2 by @zong-zhe in https://github.com/kcl-lang/kcl/pull/1922\r\n\r\n## New Contributors\r\n* @gitatractivo made their first contribution in https://github.com/kcl-lang/kcl/pull/1883\r\n* @johngmyers made their first contribution in https://github.com/kcl-lang/kcl/pull/1906\r\n\r\n**Full Changelog**: https://github.com/kcl-lang/kcl/compare/v0.11.1...v0.11.2","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
