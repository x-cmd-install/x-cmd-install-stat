\n* Fix: Ensure math.floor Returns an Integer Instead of a Float by @priyansh-saxena1 in https://github.com/kcl-lang/kcl/pull/1946\n* fix: enforce type checking for list of schema elements by @priyansh-saxena1 in https://github.com/kcl-lang/kcl/pull/1949\n* fix: invalid override spec error message by @Peefy in https://github.com/kcl-lang/kcl/pull/1951\n* perf: use rustc hash for the indexmap in the whole proj by @Peefy in https://github.com/kcl-lang/kcl/pull/1952\n* fix net to_ip4 and to_ip6 by @liangyuanpeng in https://github.com/kcl-lang/kcl/pull/1937\n* fix: rename ip16 to ip6 by @liangyuanpeng in https://github.com/kcl-lang/kcl/pull/1962\n* Docs: Be specific about UUID version by @jfharden in https://github.com/kcl-lang/kcl/pull/1996\n* Fix typos in language server documentation by @aliazlan4 in https://github.com/kcl-lang/kcl/pull/1994\n* fix: (lsp formatter) preserve trailing comments within collection exp\u2026 by @aliazlan4 in https://github.com/kcl-lang/kcl/pull/1993\n* fix: replace serde_yaml with serde_yaml_ng by @vlada-dudr in https://github.com/kcl-lang/kcl/pull/1987\n* chore: update Rust dependencies to latest compatible versions by @turner-hemmer in https://github.com/kcl-lang/kcl/pull/1997\n* chore: remove un-used vars and flags by @Peefy in https://github.com/kcl-lang/kcl/pull/1998\n* refactor: kcl api protobuf build by @Peefy in https://github.com/kcl-lang/kcl/pull/2001\n* chore(deps): bump quinn-proto from 0.11.3 to 0.11.13 in /kclvm/tools by @dependabot[bot] in https://github.com/kcl-lang/kcl/pull/2002\n* refactor: doc badges by @Peefy in https://github.com/kcl-lang/kcl/pull/2003\n* refactor: cargo workspace for the entire project by @Peefy in https://github.com/kcl-lang/kcl/pull/2004\n* chore: remove un-used compiler crate by @Peefy in https://github.com/kcl-lang/kcl/pull/2005\n* ci: kcl lib linux glibc 2.17 release by @Peefy in https://github.com/kcl-lang/kcl/pull/2006\n* refactor: rename kcl api function args and result by @Peefy in https://github.com/kcl-lang/kcl/pull/2007\n* chore: bump rust 1.91 and edition 2024 & fix all lint issues in compiler_base by @Peefy in https://github.com/kcl-lang/kcl/pull/2008\n* refactor: remove un-used runtime components by @Peefy in https://github.com/kcl-lang/kcl/pull/2009\n* fix: kcl code lint errors by @Peefy in https://github.com/kcl-lang/kcl/pull/2010\n* fix: wasm build issues by @Peefy in https://github.com/kcl-lang/kcl/pull/2011\n* fix: serde yaml 1.1 on and yes string value by @Peefy in https://github.com/kcl-lang/kcl/pull/2012\n* chore: use kcl cli downloads badge by @Peefy in https://github.com/kcl-lang/kcl/pull/2015\n* fix: kcl linux release in CI by @Peefy in https://github.com/kcl-lang/kcl/pull/2014\n* feat: add index signature for the KCL schema type API by @Peefy in https://github.com/kcl-lang/kcl/pull/2016\n* feat: add function type for the KCL schema type API by @Peefy in https://github.com/kcl-lang/kcl/pull/2017\n* fix: musl lib release by @Peefy in https://github.com/kcl-lang/kcl/pull/2019\n* fix: vet failed on lambda calling by @Peefy in https://github.com/kcl-lang/kcl/pull/2025\n* fix: lambda para wrong scope by @Peefy in https://github.com/kcl-lang/kcl/pull/2028\n* fix: lazy eval for the if stmt by @Peefy in https://github.com/kcl-lang/kcl/pull/2029\n* feat: parse file preserve symlink path by @Peefy in https://github.com/kcl-lang/kcl/pull/2030\n* fix: template exec yaml encode obj by @Peefy in https://github.com/kcl-lang/kcl/pull/2031\n* fix: json array literal stream output by @Peefy in https://github.com/kcl-lang/kcl/pull/2032\n* fix: schema parameters config set val eval by @Peefy in https://github.com/kcl-lang/kcl/pull/2033\n* fix: schema parameter validation by @Peefy in https://github.com/kcl-lang/kcl/pull/2035\n* fix: schema dup instances by @Peefy in https://github.com/kcl-lang/kcl/pull/2036\n* fix: option builtin func parameter types by @Peefy in https://github.com/kcl-lang/kcl/pull/2037\n* feat: lambda lazy eval in the schema internal scope by @Peefy in https://github.com/kcl-lang/kcl/pull/2038\n* fix: eval lambda forward reference by @Peefy in https://github.com/kcl-lang/kcl/pull/2039\n* fix: format style on 2 empty lines at EOF by @Peefy in https://github.com/kcl-lang/kcl/pull/2040\n* fix: config list parse by @Peefy in https://github.com/kcl-lang/kcl/pull/2044\n* feat(json): add merge function for RFC 7396 JSON Merge Patch by @Arpit529Srivastava in https://github.com/kcl-lang/kcl/pull/2045\n* fix: runtime int parse error by @Peefy in https://github.com/kcl-lang/kcl/pull/2055\n* feat: add selector expr parse in the quant expr target by @Peefy in https://github.com/kcl-lang/kcl/pull/2058\n* perf: sema resolver for source map and homogeneous schema array by @Peefy in https://github.com/kcl-lang/kcl/pull/2060\n* docs: add building and testing chapters (fixes #1935) by @DCchoudhury15 in https://github.com/kcl-lang/kcl/pull/2062\n* refactor: remove unwrap() calls in advanced resolver (#1166) by @jschoone in https://github.com/kcl-lang/kcl/pull/2064\n* Add Upbound to ADOPTERS.md by @ytsarev in https://github.com/kcl-lang/kcl/pull/2066\n* chore: fix compiler warnings by @johngmyers in https://github.com/kcl-lang/kcl/pull/2071\n* feat(builtin): add reduce function by @johngmyers in https://github.com/kcl-lang/kcl/pull/2070\n* fix(evaluator): update lazy scope cache when variable is reassigned by @johngmyers in https://github.com/kcl-lang/kcl/pull/2075\n* fix(evaluator): update lazy scope cache for += list assignment by @johngmyers in https://github.com/kcl-lang/kcl/pull/2077\n* fix(evaluator): ensure assign-by-value semantics for schema assignment by @Peefy in https://github.com/kcl-lang/kcl/pull/2081\n* feat(parser): support braces for lambda arguments and multiline support by @f4z3r in https://github.com/kcl-lang/kcl/pull/2082\n* feat(format): format lambda signatures based on line length by @f4z3r in https://github.com/kcl-lang/kcl/pull/2085\n* Update Cargo.toml for performance by @rtainaan in https://github.com/kcl-lang/kcl/pull/2088\n* perf(ast): use monotonic counter for AstIndex instead of Uuid::new_v4 by @rtainaan in https://github.com/kcl-lang/kcl/pull/2091\n* perf(runtime,evaluator): use SmolStr for dict and schema config keys by @rtainaan in https://github.com/kcl-lang/kcl/pull/2093\n* perf(runtime,sema): avoid per-call regex compile and quadratic scans in type-string helpers by @rtainaan in https://github.com/kcl-lang/kcl/pull/2092\n* perf(parser): cache path canonicalization and package resolution during load by @rtainaan in https://github.com/kcl-lang/kcl/pull/2094\n* perf(sema): cache parsed schema and rule doc strings during resolver run by @rtainaan in https://github.com/kcl-lang/kcl/pull/2095\n* fix(evaluator): keep reassigned globals order-independent in lazy scope by @rtainaan in https://github.com/kcl-lang/kcl/pull/2097\n* fix(evaluator): keep config keys literal when shadowed by a lambda param by @rtainaan in https://github.com/kcl-lang/kcl/pull/2096\n* Add is_IPv6 to net and validations to datetime by @31puneet in https://github.com/kcl-lang/kcl/pull/2098\n* fix(sema): prevent swallowed errors for unresolved schema expressions\u2026 by @DCchoudhury15 in https://github.com/kcl-lang/kcl/pull/2099\n* Adding multi-line string dedenting by @31puneet in https://github.com/kcl-lang/kcl/pull/2100\n* fix(evaluator): avoid recursive global aliases in evaluation by @f4z3r in https://github.com/kcl-lang/kcl/pull/2103\n* fix(driver): guard current_dir() panic on wasm32 (#2104) by @Viscous106 in https://github.com/kcl-lang/kcl/pull/2105\n* fix(runtime): release plugin dispatch lock before invoking handler to\u2026 by @Viscous106 in https://github.com/kcl-lang/kcl/pull/2106\n* Core implementation for dry-run formatting by @f4z3r in https://github.com/kcl-lang/kcl/pull/2108\n* chore: bump workspace version to 0.12.4 by @Peefy in https://github.com/kcl-lang/kcl/pull/2110\n* fix(lsp): perform inherited attribute lookup on schema resolution by @f4z3r in https://github.com/kcl-lang/kcl/pull/2111\n* fix(resolver): allow != operator on dicts, schemas, and lists by @f4z3r in https://github.com/kcl-lang/kcl/pull/2112\n* fix(runtime): avoid 2^d exponential walk in schema_check_attr_optional by @Peefy in https://github.com/kcl-lang/kcl/pull/2114\n* test(error-format): add C-API and stderr coverage for ExecProgramArgs.error_format by @Peefy in https://github.com/kcl-lang/kcl/pull/2115\n* test(evaluator): add regression tests for issue 1918 by @Peefy in https://github.com/kcl-lang/kcl/pull/2116\n* fix(evaluator): avoid usize underflow in lazy scope backtrack by @Peefy in https://github.com/kcl-lang/kcl/pull/2117\n* chore(evaluator): apply cargo fmt by @Peefy in https://github.com/kcl-lang/kcl/pull/2122\n* fix(vet): load sibling .k files when validating inside a kcl.mod package by @Peefy in https://github.com/kcl-lang/kcl/pull/2121\n* feat(fmt): honor .editorconfig for indentation (#1930) by @Peefy in https://github.com/kcl-lang/kcl/pull/2119\n* fix(lsp): respect .gitignore in workspace file watcher and surface MaxFilesWatch by @Peefy in https://github.com/kcl-lang/kcl/pull/2118\n* fix(evaluator): skip eager mixin application duplicated by lazy replay (#1772) by @Peefy in https://github.com/kcl-lang/kcl/pull/2120\n* fix(resolver): pre-scan top-level lambdas for forward reference type checking by @Peefy in https://github.com/kcl-lang/kcl/pull/2125\n* fix(evaluator, runtime): improve schema error locations (fixes #1898, #1845) by @Peefy in https://github.com/kcl-lang/kcl/pull/2128\n* fix(api): call malloc_trim(0) after exec_program on Linux glibc by @Peefy in https://github.com/kcl-lang/kcl/pull/2129\n* fix(evaluator): avoid double evaluation of forward-referenced top-level fields (fixes #1759) by @56steve in https://github.com/kcl-lang/kcl/pull/2131\n* fix(resolver): type-check config literals in list/dict schema attribute defaults (fixes #1737) by @56steve in https://github.com/kcl-lang/kcl/pull/2132\n* fix(parser): surface both pkg