nt":60,"created_at":"2026-09-22T17:51:05Z","updated_at":"2026-09-22T17:51:05Z"},{"id":581927502,"node_id":"RA_kwDOQLML6M4ir4JO","name":"Surge_0.12.2_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-zip-compressed","state":"uploaded","size":5895878,"digest":"sha256:b4d218b5520822f122d2804b63fa36bd7cdeeeece3ad9a8453dca23b0c32f955","download_count":14,"created_at":"2026-09-22T17:51:04Z","updated_at":"2026-09-22T17:51:05Z"},{"id":581927530,"node_id":"RA_kwDOQLML6M4ir4Jq","name":"themes.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-zip-compressed","state":"uploaded","size":2252,"digest":"sha256:9dee271e233d96d181f0d94dd31a89c379a3e046c163c825f4583c9bd4bfcf46","download_count":6,"created_at":"2026-09-22T17:51:05Z","updated_at":"2026-09-22T17:51:06Z"}],"body":"## What's Changed\n\n### Highlights\n\n- Added a convenient installer for systems without a package manager in [#647](https://github.com/SurgeDM/Surge/pull/647).\n- Introduced authoritative verified download progress and hardened the concurrent download completion lifecycle in [#633](https://github.com/SurgeDM/Surge/pull/633).\n- Added Chocolatey support for Windows in [#606](https://github.com/SurgeDM/Surge/pull/606).\n- Added an AppImage release artifact for Linux in [#618](https://github.com/SurgeDM/Surge/pull/618).\n- Added the category picker and related TUI refinements in [#637](https://github.com/SurgeDM/Surge/pull/637).\n\n### Fixes\n\n- Persist authenticated download headers across resume in [#664](https://github.com/SurgeDM/Surge/pull/664).\n- Prioritize physical completion over late pause requests and guard the scheduler completion boundary in [#648](https://github.com/SurgeDM/Surge/pull/648).\n- Finalize total size for completed unknown-length downloads in [#641](https://github.com/SurgeDM/Surge/pull/641).\n\n### Maintenance\n\n- Updated `go-humanize`, `x/net`, `x/sys`, `bubbles`, and `flock`.\n\n## New Contributor\n\n- [@hanthor](https://github.com/hanthor) made their first contribution in [#647](https://github.com/SurgeDM/Surge/pull/647).\n\n## Acknowledgements\n\n- Release automation powered by [GoReleaser Pro](https://goreleaser.com/pro/).\n- Development supported by a generous grant from [FOSS United](https://fossunited.org/).\n\n**Full Changelog:** https://github.com/SurgeDM/Surge/compare/v0.12.1...v0.12.2\n"}
