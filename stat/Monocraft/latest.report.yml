5,"node_id":"RA_kwDOHyKOn84TYh9r","name":"Monocraft-ttf.zip","label":null,"uploader":{"login":"IdreesInc","id":4875804,"node_id":"MDQ6VXNlcjQ4NzU4MDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1236744,"digest":"sha256:897faffbef8cc27fadd0d5aa51872ab5f908e22a89bb8fa5b191366025d503e0","download_count":14734,"created_at":"2025-12-06T18:00:20Z","updated_at":"2025-12-06T18:00:21Z"},{"id":325197680,"node_id":"RA_kwDOHyKOn84TYh9w","name":"Monocraft.ttc","label":null,"uploader":{"login":"IdreesInc","id":4875804,"node_id":"MDQ6VXNlcjQ4NzU4MDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5909252,"digest":"sha256:0ea1aea12f03d552a469fc017f19ea927b53bf9d21e60a41c5c476c3faf3c7f9","download_count":17825,"created_at":"2025-12-06T18:00:21Z","updated_at":"2025-12-06T18:00:23Z"}],"body":"Monocraft now has font hinting! That means that rendering on Windows and Linux should be significantly sharper and cleaner, especially at lower resolutions (or in the terminal). I've also fixed the NerdFonts packaging as there were reported issues of icons being put in the wrong code points. Alongside those fixes, I've bundled the complete NerdFonts set so you should have access to more icons than ever before! Lastly, I've added the `TODO:` and `NOTE:` ligatures used in [Miracode](https://github.com/IdreesInc/Miracode) because I've found them to be quite useful.\r\n\r\nPlease report if the type hinting improves or causes issues with rendering on Windows/Linux. I've done my best to test but I'd appreciate the feedback from other users as we all have different setups.\r\n\r\n### **Join the [Discord](https://discord.gg/uUtRgC8gd8) to help out and get support! We always need more beta testers!**\r\n\r\n_Note: This build has been updated (and retagged to stop upsetting Homebrew) as the previous build contained some issues with incorrect PANOSE values causing the font to render incorrectly in Microsoft software such as VSCode. This has been resolved. Hopefully._\r\n\r\n## What's Changed\r\n* Added `TODO: ...` and `NOTE: ...` ligatures\r\n* Fixed NerdFonts support (thanks @ryyHardy!)\r\n* Added complete NerdFonts icon set\r\n* Added build script to the repository\r\n* Updated builds to include different .ttf and .otf versions and weights\r\n* Customized PANOSE values so that Windows terminal recognizes the font as monospaced (thanks @PQL87!)\r\n\r\n**Full Changelog**: https://github.com/IdreesInc/Monocraft/compare/v4.1...v4.2.1","reactions":{"total_count":61,"+1":0,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":53,"rocket":1,"eyes":2},"mentions_count":2}
