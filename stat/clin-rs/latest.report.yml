432c73e135bebfcff8e2b80988c9d96a08982f9fa0a2","download_count":98,"created_at":"2026-09-03T21:18:13Z","updated_at":"2026-09-03T21:18:14Z"},{"id":543355681,"node_id":"RA_kwDORpAiR84gYvMh","name":"clin-rs_0.12.0-1_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":4327232,"digest":"sha256:710b31d90cbbbcc856a3334a35c60c22323cb3d6561da15b271c09321ea29837","download_count":3,"created_at":"2026-09-03T21:18:14Z","updated_at":"2026-09-03T21:18:14Z"},{"id":543355682,"node_id":"RA_kwDORpAiR84gYvMi","name":"clin-rs_0.12.0-1_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":3867476,"digest":"sha256:b92bcb313d4c368d1c89008012b1c45a1cd0691975aab2d8b87055a26ffb3350","download_count":4,"created_at":"2026-09-03T21:18:14Z","updated_at":"2026-09-03T21:18:14Z"},{"id":543355643,"node_id":"RA_kwDORpAiR84gYvL7","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1302,"digest":"sha256:2b5bb77d0b89ce34e65735ba4115c8a923158d145cce765ae08994a4f1059ae4","download_count":1,"created_at":"2026-09-03T21:18:12Z","updated_at":"2026-09-03T21:18:12Z"}],"body":"# WARNING\r\nIf you get a \"keybind preset is failed to parse: parse error\" after updating from the previous version, please check the #149 issue in order to see the fix. Unfortunately this a problem that can not be fixed since most of the code has been cleaned throughly for the plugin system. **So you have to reset your keybind files or delete them** so they regenerate properly. Sorry for the inconvenience, will be more careful about this in the future!\r\n\r\n# TLDR\r\nThis update is focused on structural changes and doesn't really bring any new feature but fixes some inconsistencies and small bugs through the app as well as cleaning up unnecessary methods and helpers from the version `v0.9.0` properly, removed some dependencies as well since only a small part from them were used, they've been replaced with simple helpers.\r\n\r\n# Changelog\r\n\r\nAll notable changes to clin are documented in this file.\r\n\r\n## [0.12.0] - 2026-09-03\r\n\r\n### CI\r\n\r\n- Applied fixes for clippy warnings\r\n- Fixed clippy warnings\r\n- Fmt fixes\r\n- Fixed a false positive\r\n\r\n### Changed\r\n\r\n- Deduplicate input dispatch and update missing docs\r\n- Trim over-engineering (drop dead deps and newtype wrappers)\r\n- Cut dead code and duplicated machinery\r\n- Remove dead code and consolidate shared helpers\r\n- Collapse over-engineered code paths (~2400 lines)\r\n- Cut dead code and collapse duplicated logic\r\n- Cleaned up general deadcode left from previous releas\r\n\r\n### Miscellaneous\r\n\r\n- Prune dead code and slim dependencies\r\n- Wrap binary with runtime dependencies\r\n- Include desktop files the package\r\n- Put devshell and package in separate files","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
