stay in sync when their files are renamed. (#287)\r\n - Vault catalog updates respect configured file extension overrides. (#288)\r\n - Collapsing a search result hides its child content matches. (#289)\r\n - Embedded Bases on canvases retain their loaded state when moved or resized and redraw when zooming stops. (#290)\r\n - Configured date formats retain their directives, and iCalendar components are validated after folded lines are rejoined. (#291)\r\n\r\n ### Changed\r\n\r\n - Migrated date and calendar handling off Chrono. (#291)\r\n - Simplified the README, linked to detailed guides, and updated the roadmap. (#238)\r\n - Updated runtime dependencies and CI actions.","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":1,"eyes":0}}
