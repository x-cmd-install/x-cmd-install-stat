":754308054,"node_id":"RA_kwDOP5rK3s4s9dPW","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:083828514203d55ed71f202955ee4d24a33014895547ea00f2f33ff00cf037ab","download_count":16,"created_at":"2026-11-16T09:52:41Z","updated_at":"2026-11-16T09:52:42Z"},{"id":754308056,"node_id":"RA_kwDOP5rK3s4s9dPY","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":63643136,"digest":"sha256:5cd759601928ca1a1c77d90fd9fe1c4b361f68926ba4c5325471cfe0cd368ec0","download_count":42,"created_at":"2026-11-16T09:52:41Z","updated_at":"2026-11-16T09:52:44Z"},{"id":754308053,"node_id":"RA_kwDOP5rK3s4s9dPV","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:ae57af0d63d5ce6d6b153a6ab3af5d331a95be5b521a4cf93300b4353f28e9e9","download_count":19,"created_at":"2026-11-16T09:52:41Z","updated_at":"2026-11-16T09:52:42Z"},{"id":754308060,"node_id":"RA_kwDOP5rK3s4s9dPc","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68731392,"digest":"sha256:c87edbb529b784ca76f0a5267141d51788b5ebb95eb97d57281b75233e42a9b5","download_count":194,"created_at":"2026-11-16T09:52:42Z","updated_at":"2026-11-16T09:52:44Z"},{"id":754308059,"node_id":"RA_kwDOP5rK3s4s9dPb","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:bc3499a6e84180233ff570889d4358a6ba662776ad1a1c18624b10c55d6238df","download_count":19,"created_at":"2026-11-16T09:52:41Z","updated_at":"2026-11-16T09:52:42Z"}],"body":"## Settings fix\r\n\r\n`insecure` and `http-insecure` are the same setting. So are `http-root-ca` and `http-root-cas`, and `grpc-root-ca` and `grpc-root-cas`. Settings stack: the request beats the file and the file beats the environment. That only worked when every layer used the same name.\r\n\r\nSay your `dev` environment turns certificate checks off, and one request turns them back on:\r\n\r\n```json\r\n{\r\n  \"dev\": {\r\n    \"settings.insecure\": \"true\"\r\n  }\r\n}\r\n```\r\n\r\n```http\r\n### Payments health\r\n# @name health\r\n# @setting http-insecure false\r\nGET https://localhost:8443/health\r\n```\r\n\r\nPrevious versions always let `insecure` win, wherever it was set. The certificate was never checked:\r\n\r\n```text\r\nName: health\r\nRequest: GET https://localhost:8443/health\r\nEnvironment: dev\r\nStatus: 200 OK\r\n```\r\n\r\nNow the request-level setting wins, and TLS verification fails as expected::\r\n\r\n```text\r\nErrors:\r\n  Request error:\r\n    error[tls]: request failed\r\n    perform request\r\n    ╰─> Get \"https://localhost:8443/health\"\r\n        ╰─> tls: failed to verify certificate\r\n            ╰─> x509: “localhost” certificate is not trusted\r\n```\r\n\r\nOther places that follow the order now:\r\n\r\n- `$shared` is the lowest layer. `\"settings.http-insecure\"` in an environment overrides `\"settings.insecure\"` in `$shared`.\r\n- An `@apply` patch sits above the request, and a `null` in it removes both names from the request.\r\n- SSE and WebSocket requests use the same rules.\r\n\r\nThe full layer order is on the [HTTP settings](https://resterm.app/docs/http-settings/) page.\r\n\r\n## Both names in one place\r\n\r\nWhen one layer sets both names, Resterm can't know which one you meant, so the request stops with exit code 26:\r\n\r\n```text\r\nerror[protocol]: http-insecure and insecure are the same setting. Use one of them.\r\n```\r\n\r\nBefore, `insecure` would win. The request still runs if a higher layer sets the value, or an `@apply` patch removes it. With grouped environments you'll get the same error when profiles from two groups each set one of the names. The `grpc-` pair only stops gRPC requests.\r\n\r\n## Variables in `proxy`\r\n\r\n```http\r\n# @setting proxy {{proxy.url}}\r\n```\r\n\r\nOlder versions didn't expand this and refused to send the request:\r\n\r\n```text\r\nerror[protocol]: invalid proxy \"{{proxy.url}}\" (use a URL such as http://host:8080)\r\n```\r\n\r\nVariables now work in request-level proxy settings, file defaults, and `settings.proxy` in environment files. If the variable isn't defined, nothing is sent and you get `expand proxy: undefined variable: proxy.url`.\r\n\r\n## Examples\r\n\r\nAll examples are now mirrored on the web: [resterm.app/examples](https://resterm.app/examples/)\r\n\r\n## Upgrading\r\n\r\n1. Look for files and environments that set both `insecure` and `http-insecure` in the same place, or both names of a root CA setting. Keep one.\r\n2. If a request starts failing TLS checks after the update, check its certificate or CA path. That check was being skipped before.\r\n\r\nComing from something older than 1.18.1? Read the [1.18.1](https://github.com/unkn0wn-root/resterm/releases/tag/v1.18.1) and [1.18.0](https://github.com/unkn0wn-root/resterm/releases/tag/v1.18.0) notes.\r\n"}
