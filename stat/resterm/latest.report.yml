81375785,"node_id":"RA_kwDOP5rK3s4onPgp","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:8c38fbb90419a22ef411511cce63916c661c7c53a8d32c27cfbadeb09e69d01a","download_count":2,"created_at":"2026-10-27T11:21:59Z","updated_at":"2026-10-27T11:22:00Z"},{"id":681375774,"node_id":"RA_kwDOP5rK3s4onPge","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":63468032,"digest":"sha256:d19b389799e383f94137e06c892622a379630f1b40956d2baad972f294811800","download_count":6,"created_at":"2026-10-27T11:21:59Z","updated_at":"2026-10-27T11:22:01Z"},{"id":681375781,"node_id":"RA_kwDOP5rK3s4onPgl","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:4e7725239c4a695a2067b8bcca322dd0e22c673e25c1c02f71b8062a7cc8e438","download_count":19,"created_at":"2026-10-27T11:21:59Z","updated_at":"2026-10-27T11:21:59Z"},{"id":681375784,"node_id":"RA_kwDOP5rK3s4onPgo","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68518400,"digest":"sha256:d35c86d543a6f7f4cce4e2f706a84a9bc4bfb9c6d10eaf4b5875fce1388e9284","download_count":40,"created_at":"2026-10-27T11:21:59Z","updated_at":"2026-10-27T11:22:01Z"},{"id":681375780,"node_id":"RA_kwDOP5rK3s4onPgk","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:ea5d668bf106a598c64c7bf21049e5ed5efbb5b9fb640c52d5ce1d451d9b0bd4","download_count":20,"created_at":"2026-10-27T11:21:59Z","updated_at":"2026-10-27T11:21:59Z"}],"body":"# v1.17.0\r\n\r\ngRPC requests can load their schema straight from `.proto` files, without server reflection or a compiled descriptor set. GraphQL subscriptions work over SSE and WebSocket.\r\n\r\n## gRPC with `.proto` files\r\n\r\nPoint `@grpc-proto` at your `.proto` files and Resterm compiles them when it sends the request, so there's no `protoc` step.\r\n\r\n```http\r\n### Say Hello\r\n# @grpc acme.v1.Greeter/SayHello\r\n# @grpc-proto ./proto/acme/v1/greeter.proto\r\n# @grpc-import-path ./proto\r\nGRPC {{grpc.host}}\r\n\r\n{\"name\": \"Ada\"}\r\n```\r\n\r\nHere `greeter.proto` imports `acme/v1/types.proto` from `proto/`. If a file doesn't compile, the error tells you where:\r\n\r\n```text\r\nerror[protocol]: compile proto files\r\n╰─> acme/v1/types.proto:6:3\r\n    ╰─> field acme.v1.Greeting.text: unknown type strng\r\n```\r\n\r\n- Without `@grpc-import-path`, the folder of each listed file is its import path. Add import paths when imports start from a root folder, as with `protoc -I`. Both directives can repeat, and paths can use `{{variables}}`.\r\n- The standard `google/protobuf/*.proto` files are built in. Others, such as `google/api/annotations.proto`, have to be on an import path.\r\n- Resterm reads the files on every send, so an edit to a `.proto` file applies to the next request without a restart.\r\n- proto2, proto3 and edition 2023 files work. Edition 2024 isn't supported yet.\r\n- A request can use `@grpc-proto` or `@grpc-descriptor`, but not both.\r\n- The navigator lists the `.proto` files your requests use, and completion after `@grpc-proto` suggests only `.proto` files. Explain shows each proto file and import path.\r\n- `resterm collection export` bundles the proto files together with every file they import.\r\n\r\nSee the [proto files docs](https://resterm.app/docs/grpc/#proto-files).\r\n\r\n## GraphQL subscriptions\r\n\r\n`@graphql` works with `@sse` and `@websocket`. `@operation`, `@query` and `@variables` behave the same as over HTTP.\r\n\r\n### Over SSE\r\n\r\n```http\r\n### Order events\r\n# @graphql\r\n# @operation OrderEvents\r\n# @sse duration=30s idle=10s\r\n# @assert stream.summary().reason == \"complete\"\r\nPOST {{graphql.endpoint}}\r\n\r\nsubscription OrderEvents($id: ID!) {\r\n  orderEvents(id: $id) { status }\r\n}\r\n\r\n# @variables\r\n{ \"id\": \"{{order.id}}\" }\r\n```\r\n\r\nThe query is sent like any other GraphQL request, in the body for POST or as query parameters for GET. The stream ends at the first `complete` event and the summary reason is `complete`. If the server closes the stream before that, the reason is `eof`. This is the distinct connections mode of GraphQL over SSE.\r\n\r\n### Over WebSocket\r\n\r\n```http\r\n### Order events over WebSocket\r\n# @graphql\r\n# @operation OrderEvents\r\n# @query < ./queries/order-events.graphql\r\n# @variables < ./queries/order-events.json\r\n# @websocket\r\nGET {{graphql.wsEndpoint}}\r\nAuthorization: Bearer {{token}}\r\n```\r\n\r\nResterm uses the `graphql-transport-ws` subprotocol. It sends `connection_init`, waits for `connection_ack`, subscribes and answers each `ping`. When the operation ends with `complete` or `error`, Resterm closes the socket with code 1000. `@ws` steps run after the subscription starts, so `# @ws wait 20s` keeps listening for up to 20 seconds.\r\n\r\nA GraphQL error doesn't fail the request, the same as over HTTP. Check for it with `@assert`. A message that breaks the protocol does fail it, with exit code 26. Here is the stream summary after a server sent a `next` message whose payload wasn't an object:\r\n\r\n```text\r\ncloseCode: 4400,\r\ncloseReason: \"server sent next without an object payload\",\r\nclosedBy: \"error\",\r\nerrorClass: \"protocol\",\r\n```\r\n\r\n- The request also fails if the server closes the socket before `connection_ack` (exit code 26), or if `idle` runs out before it arrives (exit code 20). After the ack, a close with any code, such as 4403, is a normal ending.\r\n- Only `graphql-transport-ws` is supported, not the older `subscriptions-transport-ws`. On a `@graphql` request, any other `subprotocols` value is a parse error.\r\n- `connection_init` has no payload, so send credentials in the request headers.\r\n- For a WebSocket request, Explain shows the `subscribe` message Resterm is going to send.\r\n\r\nSee [GraphQL subscriptions](https://resterm.app/docs/graphql/#subscriptions).\r\n\r\n## WebSocket\r\n\r\nThese changes apply to every WebSocket request, not only GraphQL ones.\r\n\r\n### Invalid handshakes fail\r\n\r\nIf the server accepts the upgrade with a subprotocol Resterm never offered, the request fails with exit code 26:\r\n\r\n```text\r\nerror[protocol]: dial websocket\r\n╰─> failed to WebSocket dial\r\n    ╰─> WebSocket protocol violation: unexpected Sec-WebSocket-Protocol from server: \"chat\"\r\n```\r\n\r\n### Closing\r\n\r\nAfter `@ws close` or the last step, Resterm waits up to 5 seconds for the server to answer the close, and anything that arrives in that time goes into the transcript. `closedBy` is `client`, and `closeCode` and `closeReason` are the ones Resterm sent, even when the server answers late, with its own code, or not at all.\r\n\r\n### Why a session ended\r\n\r\nIn the Stream tab, the row that ends a WebSocket session shows the reason, for example `idle timeout after 1s`.\r\n\r\n## Stricter request files\r\n\r\n### Workflows\r\n\r\nA line that starts a request also ends the workflow above it. That can be a request directive such as `@name`, a `>` script line or plain text. 1.16.1 dropped every `@step` after that line with a warning and ran a shorter workflow:\r\n\r\n```http\r\n# @workflow demo\r\n# @step First using=First\r\n# @name Oops\r\n# @step Last using=Last\r\n```\r\n\r\n```text\r\nWARN demo.http:4: @step is not valid in the current context and was ignored\r\nPASS WORKFLOW demo [1 passed, 0 failed, 0 skipped in 4.832666ms]\r\n  1. PASS First [200 OK in 3.744583ms]\r\n```\r\n\r\nIn 1.17.0 the file doesn't run:\r\n\r\n```text\r\nerror[parse]: @step is outside the workflow because @name on line 3 starts a request\r\n--> demo.http:4:3\r\n     |\r\n   4 | # @step Last using=Last\r\n     |   ^\r\n```\r\n\r\nThe same goes for `@if`, `@switch` and their branches. Blank lines and plain comments keep the workflow open.\r\n\r\nA workflow line with no `#`, like `@step Last using=Last`, used to become a file variable, and the step was gone without any warning. Now it fails with `@step has no comment marker. Write it as # @step`.\r\n\r\nSee the [workflows docs](https://resterm.app/docs/workflows/).\r\n\r\n### One protocol per request\r\n\r\n- `@grpc` and the other `@grpc-*` directives need a `GRPC` request line. On a `GET` line, 1.16.1 turned the request into a gRPC call that failed with `grpc target not specified`. On an SSE or WebSocket request it ignored them. The error is now `@grpc requires a GRPC request line`.\r\n- `@sse` together with `@websocket` or a `@ws` step is an error. Before, the request ran as a WebSocket.\r\n- `@graphql`, `@sse`, `@websocket` and `@ws` can't be used on a `GRPC` line. `@graphql` used to be ignored there, and `@sse` or `@websocket` sent an HTTP stream instead of the gRPC call.\r\n- Turning a protocol off, as in `@sse off`, never conflicts.\r\n\r\n### Options without a value\r\n\r\nIn most directives a bare key means `true`. For an option that expects a value, that was almost always a typo, so it's an error now and the caret points at the key:\r\n\r\n```text\r\nerror[parse]: @step option \"vars.token\" needs a value. Write it as vars.token=value\r\n--> login.http:2:25\r\n     |\r\n   2 | # @step Auth using=Auth vars.token\r\n     |                         ^\r\n```\r\n\r\nThe rule covers `@poll`, `@retry`, `@retry-backoff`, `@profile`, `@ssh`, `@k8s`, `@sse`, `@websocket`, `@workflow`, `@step`, `@if`, `@mock`, `@match` and `@expect`. Switches such as `compression` and `persist` still work without a value.\r\n\r\n### Better errors\r\n\r\n- A missing `@use` module says `module missing.rts not found` and points at the `@use` line.\r\n- A request that uses a broken shared `@ssh` profile says what's wrong with it, as in `ssh profile \"jump\" is invalid: line 1: @ssh global scope requires host`. Shared `@k8s` profiles with a repeated option work the same way, and every bad option on an `@ssh` or `@k8s` line is listed.\r\n- `@retry-backoff 1s` says `@retry-backoff must start with exponential(initial, max), got \"1s\"`.\r\n- A `@setting` or `@use` placed above `@workflow` gets the hint `Move it below @workflow to share it`.\r\n\r\n## Other fixes\r\n\r\n- Completion after `@websocket` offers `subprotocol` as well as `subprotocols`.\r\n- Parse warnings and errors are listed in line order.\r\n\r\n## Upgrading from 1.16.1\r\n\r\nSome files that used to run now stop with a parse error and exit code `2`. Check for these:\r\n\r\n1. In a workflow, a `@step`, `@if` or `@switch` after a line that starts a request, such as `@name` or plain text. Move the steps above that line. A workflow line without `#` fails too.\r\n2. `@grpc-*` directives on a request that isn't `GRPC`, `@sse` together with `@websocket` or `@ws`, and `@graphql`, `@sse`, `@websocket` or `@ws` on a `GRPC` line. Remove the directive that doesn't belong.\r\n3. A bare key for an option that takes a value, such as `vars.token` on `@step`, `subprotocols` on `@websocket` or `name` on `@mock`. Give it a value or delete it. A mock server with such a line won't start.\r\n4. `@graphql` with `@websocket` and a `subprotocols` value other than `graphql-transport-ws`.\r\n\r\nThese changed without a parse error:\r\n\r\n5. `@graphql` on an SSE or WebSocket request sends the operation instead of being dropped.\r\n6. A WebSocket upgrade with a subprotocol Resterm didn't offer fails with exit code `26`.\r\n7. After Resterm closes a WebSocket, `closedBy` is `client` even when the server answers late, with its own code, or never. Update asserts that expect `\"server\"`, `\"timeout\"` or `\"error\"` in those cases.\r\n8. Some messages changed: a missing `@use` module, invalid shared `@ssh` and `@k8s` profiles, `@retry-backoff`, and empty quotes on `@run` and `@grpc-metadata`. A missing module is a script error now, so a template that loads one exits with `24` instead of `25`. Update CI checks that match the old text.\r\n\r\n## Upgrading from 1.16.0 or earlier\r\n\r\nIf you're on **1.16.0** or earlier, also read the [1.16.1 release notes](https://github.com/unkn0wn-root/resterm/releases/tag/v1.16.1). macOS 12 is no longer supported, and some TLS-inspecting proxies drop HTTPS connections. The [1.16.0 notes](https://github.com/unkn0wn-root/resterm/releases/tag/v1.16.0) cover the RestermScript changes.\r\n"}
