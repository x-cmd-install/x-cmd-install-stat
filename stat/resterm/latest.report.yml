9125173,"node_id":"RA_kwDOP5rK3s4lf7A1","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:ec0a6611e40a68fa48055789170a72ac0eae13acd2c6e8a57a4d79d675785f6c","download_count":3,"created_at":"2026-10-10T22:15:58Z","updated_at":"2026-10-10T22:15:59Z"},{"id":629125160,"node_id":"RA_kwDOP5rK3s4lf7Ao","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":64562176,"digest":"sha256:fe29643a5f33fdcbe00d366b56fc04b1dab7d3cb22e2887e2dd37c9b3b1e4042","download_count":7,"created_at":"2026-10-10T22:15:58Z","updated_at":"2026-10-10T22:16:00Z"},{"id":629125168,"node_id":"RA_kwDOP5rK3s4lf7Aw","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:ff7167463d6f72b6149c4388a1779e72f1c925d6b3f873dd30b8db9029bd7e50","download_count":24,"created_at":"2026-10-10T22:15:58Z","updated_at":"2026-10-10T22:15:59Z"},{"id":629125170,"node_id":"RA_kwDOP5rK3s4lf7Ay","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":69362176,"digest":"sha256:eff8e882a2f5e6d2e035861aba49d2eaf859a95864180bdab050ea06ec8494b7","download_count":37,"created_at":"2026-10-10T22:15:58Z","updated_at":"2026-10-10T22:16:01Z"},{"id":629125171,"node_id":"RA_kwDOP5rK3s4lf7Az","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:ab71b5bdf4d9f1405481488464f567592b098bdc58bafc5226499e79d3f00e60","download_count":21,"created_at":"2026-10-10T22:15:58Z","updated_at":"2026-10-10T22:15:59Z"}],"body":"## v1.14.0\r\n\r\nFixed history backups that could delete an unrelated file and compaction that reported success without shrinking the database.\r\n\r\nIf you use the headless Go API, check the breaking changes below before upgrading.\r\n\r\n### History permissions\r\n\r\nOn macOS and Linux, `history.db` and its `-wal` and `-shm` files are created with `0600` permissions. New history and runner state directories use `0700`. History includes response bodies, so these files should only be readable by their owner.\r\n\r\nResterm removes group and other permissions from existing files when it opens them. It leaves the owner's permissions alone, including files you've made read-only.\r\n\r\nHistory exports, backups, and runner state saved with `--persist-globals` or `--persist-auth` get the same owner-only permissions. Runner state is written to a temporary file first, then renamed into place to avoid partial writes after a crash.\r\n\r\n### Backups\r\n\r\n`resterm history backup` writes through SQLite instead of deleting the destination first. This fixes backups made over a database another Resterm process has open, including targets with WAL files left after a crash. It waits up to 5 seconds if another process is writing to the target.\r\n\r\nThe destination gets owner-only permissions before any history is copied, even if the old backup had broader permissions.\r\n\r\nA non-SQLite file or a directory is refused and left alone. For example, trying to back up over a text file gives:\r\n\r\n```text\r\nerror[history]: backup history\r\n\u2570\u2500> cannot replace notes.txt because it is not a readable SQLite database. Remove it or pick another path\r\n```\r\n\r\nPrevious versions deleted that file and replaced it with the backup.\r\n\r\nThe command also refuses to overwrite the live history file through a symlink or, on macOS, a differently cased name such as `HISTORY.db`. In 1.13.3, that case mismatch could delete and replace the live database.\r\n\r\n### Compact\r\n\r\n`resterm history compact` shrinks the database before returning. Previously, the file stayed the same size until Resterm exited, which made the reported sizes wrong.\r\n\r\nIf another process is reading the database and prevents compaction from finishing, the command exits with `1`:\r\n\r\n```text\r\nerror[history]: checkpoint history db\r\n\u2570\u2500> another process is using the history db, so its file did not shrink. Try again later\r\n```\r\n\r\nMore in the [history command docs](https://resterm.app/docs/cli/history/).\r\n\r\n### Trace start times\r\n\r\nTrace summaries written to `traces/` with `--artifact-dir` include a `start` timestamp for each phase:\r\n\r\n```json\r\n{\r\n  \"kind\": \"connect\",\r\n  \"start\": \"2026-10-09T17:34:11.015+02:00\",\r\n  \"duration\": 20000000,\r\n  \"meta\": {}\r\n}\r\n```\r\n\r\nThe timestamps show phase order and gaps between phases. They're saved in history too. Older entries still display phases back to back.\r\n\r\nSee [Artifacts and persisted state](https://resterm.app/docs/cli/run/#artifacts-and-persisted-state).\r\n\r\n### Workflow and profile errors\r\n\r\nWhen a workflow or profile fails because of a child step or run, its JSON `failure` includes the child's `chain` and `frames`. You can find the source of the error in the parent result. This applies to both `resterm run --format json` and the headless API.\r\n\r\n### Headless Go API\r\n\r\nThe `headless` package shares more of its reporting behavior with `resterm run`:\r\n\r\n- `Result.EffectiveTarget` and `Step.EffectiveTarget` contain the URL reached after variable expansion and redirects.\r\n- `ErrorDetail` and `ScriptErrorDetail` include the CLI error text with file, line and column.\r\n- `Result.Warnings` includes script warnings.\r\n- Text and JUnit output include error class and file location.\r\n- `ParseFormat` returns `ErrUnknownFormat` for unrecognized names.\r\n\r\nYou can also read report JSON back into a `headless.Report`, including output from `resterm run --format json`:\r\n\r\n```go\r\n// data holds the output of resterm run --format json\r\nvar rep headless.Report\r\nif err := json.Unmarshal(data, &rep); err != nil {\r\n\tlog.Fatal(err)\r\n}\r\nfmt.Println(rep.Failed, rep.ExitCode(headless.ExitCodeDetailed))\r\n```\r\n\r\nDecoded durations have millisecond precision. `ErrorDetail` and `ScriptErrorDetail` remain empty because they aren't in the JSON.\r\n\r\n#### Breaking changes\r\n\r\nCheck these if you call the headless API from Go:\r\n\r\n1. A nil context, report or writer, or an unknown format, returns a `UsageError`. Use `errors.Is(err, headless.ErrNilContext)`; a direct `==` comparison no longer matches.\r\n2. Failed steps, profile runs outside warmup, and streams make their parent result fail. `Failed()`, `HasFailures()` and both exit code modes use the same rule, including for reports you construct yourself. `HasFailures()` is true exactly when the exit code is nonzero.\r\n3. Marshaling individual report types such as `Test`, `Trace` or `Failure` uses the same field names and millisecond durations as the full report:\r\n\r\n   ```text\r\n   1.13.3  {\"name\":\"status is 200\",\"passed\":true,\"elapsed\":1500000}\r\n   1.14.0  {\"name\":\"status is 200\",\"passed\":true,\"elapsedMs\":1}\r\n   ```\r\n\r\n   A struct embedding one of these types also inherits its `MarshalJSON` method.\r\n\r\nSee [Read the report](https://resterm.app/docs/headless/#read-the-report) and [Output and exit codes](https://resterm.app/docs/headless/#output-and-exit-codes).\r\n\r\n### Other fixes\r\n\r\n- History entries created in the same microsecond no longer overwrite each other. This caused lost entries on macOS due to its clock precision.\r\n- Workspace names containing `?` no longer send runner history to the wrong file. For example, `api?v2` previously wrote to `<config-dir>/runner/api`, which was readable by everyone. History goes to the workspace's state folder; the old file isn't moved.\r\n- Requests that end before their first trace phase finishes, including canceled requests, keep their trace budget and any breach in history.\r\n- Closing history while an entry is being written no longer crashes Resterm.\r\n\r\n### Upgrading from 1.13.2 or earlier\r\n\r\n[1.13.3](https://github.com/unkn0wn-root/resterm/releases/tag/v1.13.3) changed parsing for quoted options:\r\n\r\n- A whole option in quotes, such as `# @settings \"timeout=1s\"`, is treated as text and produces a warning.\r\n- `@auth` rejects a quoted field where it expects an option.\r\n- A trace budget written with `==`, such as `dns==50ms`, produces a warning instead of being silently ignored.\r\n"}
