":721762750,"node_id":"RA_kwDOP5rK3s4rBTm-","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:3ae0ef78f3898d2a491eaccfc9da5af0a855355d79c232e4296453f0f2672fc2","download_count":10,"created_at":"2026-11-07T19:52:23Z","updated_at":"2026-11-07T19:52:23Z"},{"id":721762776,"node_id":"RA_kwDOP5rK3s4rBTnY","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":63633408,"digest":"sha256:59fad2162bc753cdd3b05efd926a6229d46a59d19ca7e18537389cfcda9ffd3f","download_count":16,"created_at":"2026-11-07T19:52:23Z","updated_at":"2026-11-07T19:52:26Z"},{"id":721762745,"node_id":"RA_kwDOP5rK3s4rBTm5","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:295d5a796bbe10c106b522827cb83f18e1e4eb36284b9219bc2d1db271afbad0","download_count":19,"created_at":"2026-11-07T19:52:23Z","updated_at":"2026-11-07T19:52:23Z"},{"id":721762789,"node_id":"RA_kwDOP5rK3s4rBTnl","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68716544,"digest":"sha256:46478775414e3e94315e95ac489c221f92699367f2ab592f46106553a1a996b7","download_count":61,"created_at":"2026-11-07T19:52:23Z","updated_at":"2026-11-07T19:52:26Z"},{"id":721762788,"node_id":"RA_kwDOP5rK3s4rBTnk","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:52f6e891f40f1a1e62c6be358ecd1dad2ae15d8c996b111cc3a5ccc719b14875","download_count":19,"created_at":"2026-11-07T19:52:23Z","updated_at":"2026-11-07T19:52:23Z"}],"body":"# v1.18.0\r\n\r\nThis release fixes a few security issues, makes `collection --force` safer, and cleans up some smaller bugs and quirks.\r\n\r\nThe biggest change is how Resterm handles secrets. `resterm run` now masks them throughout its output, including values that weren't referenced through templates. History also masks secrets captured later in a session.\r\n\r\nThere's also a new `--response` flag for including responses in JSON reports, a skill for coding agents, and a change to OAuth handling so headless runs can no longer open a browser.\r\n\r\nI added the skill because I realized that most folks now use local LLMs or frontier models like Claude or Codex, so it should help your LLM work with Resterm.\r\n\r\n## Secret masking in `resterm run`\r\n\r\nIn previous versions, Resterm masked secrets referenced through templates like `{{api.key}}`. But if you put the same value directly in a URL, it could still appear in the report:\r\n\r\n```http\r\n# @file-secret api.key s3cr3t-token-value-123\r\n\r\n### Search\r\n# @name search\r\nGET http://localhost:3000/search?key=s3cr3t-token-value-123\r\n```\r\n\r\nThe output looked like this:\r\n\r\n```text\r\nPASS GET search [200 OK in 550.625µs]\r\n  Source Target: http://localhost:3000/search?key=s3cr3t-token-value-123\r\n  Effective Target: http://localhost:3000/search?key=•••\r\n```\r\n\r\nIn 1.18.0:\r\n\r\n```text\r\nPASS GET search [200 OK in 447.458µs]\r\n```\r\n\r\nThe target lines are only printed when they differ. Once both values are masked, there's no difference to show.\r\n\r\n- Secrets are masked with `•••` in text, JSON, and JUnit reports, stream transcripts, trace files, and errors. This also covers JSON `target` fields, JUnit test names, and the request list printed when a file contains multiple requests.\r\n- Masking uses all secrets known by the end of the run. If a later request captures a token as a secret, that value is also masked in earlier results.\r\n- Secrets declared with fewer than 4 characters produce a warning, since masking a short value might also replace unrelated text:\r\n\r\n```text\r\nWarnings:\r\n  secret \"pin\" is shorter than 4 characters, so reports may also mask the same word in unrelated text\r\n```\r\n\r\nJSON reports include this under `warnings`. The warning doesn't change the exit code.\r\n\r\nSee [run](https://resterm.app/docs/cli/run/) and [security](https://resterm.app/docs/security/).\r\n\r\n## Include responses in JSON reports\r\n\r\nYou can now use `--response` to include response data in the JSON report. It adds a `response` object to request results, including individual workflow, for-each, and compare steps.\r\n\r\n```bash\r\nresterm run --all --format json --response api.http\r\n```\r\n\r\nExample output:\r\n\r\n```json\r\n\"response\": {\r\n  \"headers\": {\r\n    \"Content-Type\": [\"application/json\"],\r\n    \"Set-Cookie\": [\"•••\"]\r\n  },\r\n  \"body\": \"{\\\"token\\\":\\\"•••\\\",\\\"user\\\":\\\"ada\\\"}\",\r\n  \"bodySize\": 47,\r\n  \"captures\": [\r\n    {\"scope\": \"file\", \"name\": \"auth.token\", \"value\": \"•••\", \"secret\": true}\r\n  ]\r\n}\r\n```\r\n\r\nResponses are masked before being written to the report.\r\n\r\n- Secret values, `-secret` captures, `Set-Cookie`, and sensitive headers such as `Authorization` and `X-API-Key` are replaced with `•••`.\r\n- Gzip bodies are decoded before masking. If Resterm can't decode a body, such as with `br` or invalid gzip data, the `body` field is omitted. Empty bodies are kept as `\"body\": \"\"`, along with their headers.\r\n- Bodies that aren't valid UTF-8 are base64-encoded and include `\"bodyEncoding\": \"base64\"`.\r\n- Masked bodies larger than 1 MiB are truncated to the first 1 MiB, with `\"bodyTruncated\": true`.\r\n- Skipped requests, profile runs, and requests without a response don't include a `response` field.\r\n\r\nThe flag only works with JSON output. Using it with another format exits with code 2:\r\n\r\n```text\r\nerror[unknown]: run: --response can only be combined with --format json\r\n```\r\n\r\nIf you're using Resterm as a Go package, the equivalent option is `Response.Enabled`.\r\n\r\nSee [run](https://resterm.app/docs/cli/run/) and [headless](https://resterm.app/docs/headless/).\r\n\r\n## History\r\n\r\nHistory now uses `•••` for masked values, matching the reports. Previously, it used `***` and only masked secrets known when an entry was saved. That meant a token captured later could still appear in an earlier history entry.\r\n\r\nHere's an example where `preview` receives a token before `login` captures it as a secret:\r\n\r\n```http\r\n### Preview\r\n# @name preview\r\nPOST http://localhost:3000/login\r\n\r\n### Login\r\n# @name login\r\n# @capture file-secret auth.token {{response.json.token}}\r\nPOST http://localhost:3000/login\r\n```\r\n\r\nPreviously, `resterm history export` could produce:\r\n\r\n```text\r\n{\"requestName\":\"login\",\"bodySnippet\":\"{\\\"token\\\":\\\"***\\\",\\\"user\\\":\\\"ada\\\"}\"}\r\n{\"requestName\":\"preview\",\"bodySnippet\":\"{\\\"token\\\":\\\"s3cr3t-token-value-123\\\",\\\"user\\\":\\\"ada\\\"}\"}\r\n```\r\n\r\nIn 1.18.0, both entries are masked:\r\n\r\n```text\r\n{\"requestName\":\"login\",\"bodySnippet\":\"{\\\"token\\\":\\\"•••\\\",\\\"user\\\":\\\"ada\\\"}\"}\r\n{\"requestName\":\"preview\",\"bodySnippet\":\"{\\\"token\\\":\\\"•••\\\",\\\"user\\\":\\\"ada\\\"}\"}\r\n```\r\n\r\nThis works in both the TUI and `resterm run --history`. When Resterm learns a new secret, it also masks that value in earlier entries from the same session or run.\r\n\r\nSee [history](https://resterm.app/docs/history/).\r\n\r\n## A skill for coding agents\r\n\r\nResterm doesn't have an MCP server or built-in AI features, but it now comes with a skill for coding agents such as Claude Code and Codex. The skill explains how to write Resterm request files, execute them with `resterm run`, and use JSON reports and exit codes to inspect the results. It also covers a few rules: don't launch the TUI, don't put secrets in request files, and don't try to recover masked values.\r\n\r\nYou can print the skill or install it directly:\r\n\r\n```bash\r\n# Print it\r\nresterm skill\r\n\r\n# Install it for Claude Code or Codex, for all projects\r\nresterm skill --agent claude\r\nresterm skill --agent codex\r\n\r\n# Or for one project\r\nresterm skill --dir .claude/skills\r\n```\r\n\r\n- `--agent claude` installs to `~/.claude/skills/resterm`, or `$CLAUDE_CONFIG_DIR/skills/resterm` if set.\r\n- `--agent codex` installs to `~/.agents/skills/resterm`. Gemini CLI and Copilot CLI can read skills from that location too.\r\n- The skill is bundled with the Resterm binary, so it always matches the installed version. Run the install command again after upgrading.\r\n- Installation only replaces an existing directory if it already contains the Resterm skill. Other directories named `resterm`, and symlinks, are left untouched. The command exits with 1 in those cases.\r\n\r\nYou can also install the skill without Resterm:\r\n\r\n```bash\r\nnpx skills add unkn0wn-root/resterm@v1.18.0\r\n```\r\n\r\nSee [skill](https://resterm.app/docs/cli/skill/).\r\n\r\n## Safer `collection --force`\r\n\r\nThere was a rather nasty issue with `collection --force`. When you passed `--force`, Resterm deleted whatever existed at `--out` before writing the new output. It didn't check whether the directory belonged to Resterm.\r\n\r\nFor example, suppose you had a `notes` directory containing `plan.md` and `todo.txt`:\r\n\r\n```text\r\n$ resterm collection export --workspace ws --out notes --force\r\nExported 2 files to notes\r\n```\r\n\r\nThe export would succeed, but your original files would be gone. Using `--out .` could do the same to an entire project directory.\r\n\r\nThat's fixed in this release. Resterm now refuses to replace directories it doesn't recognize as its own bundles:\r\n\r\n```text\r\nerror[unknown]: collection export: notes exists and is not a resterm bundle. Remove it or choose another path\r\n```\r\n\r\n- `export` and `unpack` only replace directories containing a bundle `manifest.json`. `pack` only replaces files. Symlinks are refused.\r\n- Resterm writes the new output beside the old one before swapping them. If something goes wrong, the old output is preserved, or the error tells you where the old output was kept.\r\n- Interrupting `export`, `pack`, or `unpack` with `Ctrl+C` or `SIGTERM` leaves either the original output or the complete replacement. The command exits with 130.\r\n- Interrupting `import` keeps the files already written and reports how many were imported. You can run it again with `--force` to finish.\r\n\r\nSee [collections](https://resterm.app/docs/collections/).\r\n\r\n## OAuth\r\n\r\n`resterm run` and the headless package no longer open a browser.\r\n\r\nPreviously, if a cached `authorization_code` token couldn't be refreshed, Resterm tried opening `auth_url` through the system's default opener. This could happen even when running in CI.\r\n\r\nNow the request fails instead:\r\n\r\n```text\r\nerror[auth]: oauth token refresh failed: 400 Bad Request\r\nfetch oauth token\r\n╰─> cannot fall back to browser login\r\n```\r\n\r\nThe exit code is 23. Browser-based login is still available in the TUI.\r\n\r\nTwo smaller fixes:\r\n\r\n- `auth_url` must use `http://` or `https://` and include a host. Previously, values such as `file:///etc/hosts` could be passed to the system opener. Invalid URLs now fail with `auth_url must use http or https` or `auth_url must contain a host`.\r\n- If a token refresh response doesn't contain a new `refresh_token`, Resterm keeps the existing one, as expected by RFC 6749. In older versions, the old token was discarded. With `--persist-auth`, this could cause the next refresh to fail with `headless oauth authorization_code requires a cached or refreshable token`.\r\n\r\nSee [authentication](https://resterm.app/docs/authentication/).\r\n\r\n## Cleaner error messages\r\n\r\nSome errors contain several problems, and Resterm wasn't formatting them properly. Line breaks could end up inside the error header, sometimes printed literally as `\\n`.\r\n\r\nFor example, running `resterm collection` without a subcommand produced:\r\n\r\n```text\r\nerror[unknown]: Usage: resterm collection <export|import|pack|unpack> [flags]\\n\\nSubcommands:\\n  export --workspace <dir> ...\r\n```\r\n\r\nNow the usage information goes to stderr, followed by a single-line error:\r\n\r\n```text\r\nUsage: resterm collection <export|import|pack|unpack> [flags]\r\n...\r\nerror[unknown]: collection: subcommand is required\r\n```\r\n\r\nThe same applies to `resterm history`.\r\n\r\nJoined errors also have cleaner headers. Individual problems still appear in the error tree, but the header puts them on one line, separated by `; `. This fixes formatting for invalid `@ssh` and `@k8s` profiles, SSH tunnel errors, and rejected `@auth` directives. Invalid `@mock` options are reported individually, and rejected `@auth` directives no longer show literal `\\n` characters in the TUI response pane.\r\n\r\n## TUI fixes\r\n\r\n- **Failed saves no longer destroy file contents.** In 1.17.2, saving to a full disk could truncate the file before the write failed, leaving it empty or incomplete. The file watcher could then treat that as an external change and reload the damaged contents into the editor, where undo couldn't recover the original text. Resterm now writes without truncating the file first and restores its original contents if the write fails. The editor keeps your text and marks the file as unsaved. Symlinks, hard links, ownership, and file permissions are preserved.\r\n- **Canceled requests no longer overwrite newer responses.** If a canceled request returned late, its response could replace the result of a newer request. That no longer happens.\r\n- **Cancellation is handled properly for workflows, compares, and profiles.** Sending another request now waits for the canceled run to stop, so results don't get mixed together. Loading an entry from history while a request is running no longer stops you from canceling it.\r\n\r\n## Documentation fixes\r\n\r\n- The [workflow](https://resterm.app/docs/workflows/) example now includes `# @name` for each request. Previously, it only used `###` headings, which don't actually name requests. As a result, `using=` couldn't find them.\r\n- The `@if` and `@case` examples now use request names. The docs also clarify that `run=` refers to the name defined by `@name`.\r\n- The docs clarify that `capture.strict` applies to template captures such as `{{response.json.token}}`. RTS captures still store an empty string, so use `@assert` if you need to check them.\r\n\r\n## Upgrading from 1.17.2\r\n\r\nMost existing request files should work without changes. If you have CI jobs or scripts that parse Resterm's output, there are a few differences to be aware of:\r\n\r\n1. History now uses `•••` instead of `***` when masking secrets, including in `history export`.\r\n2. Secrets written directly into requests are masked in text, JSON, and JUnit reports, as well as request lists. `Source Target` and `Effective Target` are omitted from text reports if they're identical after masking.\r\n3. `resterm run` no longer opens a browser. If an `authorization_code` token can't be refreshed, the request fails and the run exits with 23. Use the TUI for browser-based login, or choose a grant that doesn't require a browser.\r\n4. `collection export --force` and `unpack --force` refuse directories that aren't Resterm bundles. `pack --force` also refuses directories. These cases exit with 1 without modifying the existing output.\r\n5. Secrets declared with fewer than 4 characters produce a warning in reports.\r\n6. `resterm run --history` now writes history when the run finishes.\r\n7. `auth_url` must use `http://` or `https://`.\r\n8. `resterm skill` is now a command. If you have a request file named `skill`, run it with `resterm ./skill`.\r\n9. `resterm collection` and `resterm history` now print usage information to stderr, followed by a one-line error.\r\n10. Saving a file in the TUI now requires read access to that file.\r\n"}
