1180357,"node_id":"RA_kwDOP5rK3s4rlO1F","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:13c9145d0b7213a8c4893ac50beaba8466f00dd23de17430c9cf44e07071f05b","download_count":5,"created_at":"2026-11-10T11:24:22Z","updated_at":"2026-11-10T11:24:22Z"},{"id":731180326,"node_id":"RA_kwDOP5rK3s4rlO0m","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":63636480,"digest":"sha256:9a40f2416bdcfd05ea03cd798e26f65c69d999c0afb14a9413947680c83c3ef6","download_count":5,"created_at":"2026-11-10T11:24:21Z","updated_at":"2026-11-10T11:24:23Z"},{"id":731180334,"node_id":"RA_kwDOP5rK3s4rlO0u","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:031aced84701d2b64d224dc2329291493098410af62f1ec09a7da41e72640faf","download_count":20,"created_at":"2026-11-10T11:24:21Z","updated_at":"2026-11-10T11:24:21Z"},{"id":731180346,"node_id":"RA_kwDOP5rK3s4rlO06","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68720128,"digest":"sha256:39cf88d9f41287c2874b103ecf81ea105d2317254049e1a905c5e8dd4aa38cca","download_count":35,"created_at":"2026-11-10T11:24:21Z","updated_at":"2026-11-10T11:24:24Z"},{"id":731180343,"node_id":"RA_kwDOP5rK3s4rlO03","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:f4d24f5a937a6643330a2a60faa1d1dc2e503a9a2bed09c75078eb3515329ba8","download_count":19,"created_at":"2026-11-10T11:24:21Z","updated_at":"2026-11-10T11:24:22Z"}],"body":"# v1.18.1\r\n\r\nThis patch fixes gzip responses for requests that set their own `Accept-Encoding` header, and makes secret masking a bit faster.\r\n\r\n## Gzip with your own `Accept-Encoding`\r\n\r\nResterm only decoded gzip when it added `Accept-Encoding` itself. If the request set that header, the body stayed compressed, so `@assert`, captures, scripts and the response pane all got gzip bytes. Requests imported with `curl --compressed` set the header too.\r\n\r\n```http\r\n### Users\r\n# @name users\r\n# @assert response.json()[0].name == \"david\"\r\nGET http://localhost:3000/users\r\nAccept-Encoding: gzip\r\n```\r\n\r\nBefore 1.18.1, the check failed:\r\n\r\n```text\r\nFAIL GET users [users.http:3:24: invalid json]\r\n  Script Error:\r\n    error[script]: invalid json\r\n    --> users.http:3:24\r\n         |\r\n       3 | # @assert response.json()[0].name == \"david\"\r\n         |                        ^\r\n```\r\n\r\nNow it passes:\r\n\r\n```text\r\nPASS GET users [200 OK in 728.875µs]\r\n```\r\n\r\n- A gzip response is decoded whether Resterm or the request asked for it. The decoded response has no `Content-Encoding` or `Content-Length` header, the same as when Resterm asks for gzip itself.\r\n- Gzip that can't be decoded used to pass with the broken body. Now the request fails with exit 26:\r\n\r\n```text\r\nFAIL GET bad [read response body: invalid gzip header: gzip: invalid header]\r\n```\r\n\r\n- SSE streams are decoded as they arrive, so events, `byteCount` and `max-bytes` use the decoded data, not the compressed bytes. An event stream in an encoding Resterm can't decode, such as `br`, now fails with exit 26 instead of passing.\r\n- `br`, `deflate` and `206 Partial Content` bodies stay as they arrived.\r\n- `curl --compressed` imports now write `Accept-Encoding: gzip` instead of `gzip, deflate, br`, since Resterm can't decode the other two.\r\n- With `--response`, `bodySize` is the decoded size.\r\n\r\nSee [HTTP settings](https://resterm.app/docs/http-settings/) and [streaming](https://resterm.app/docs/streaming/).\r\n\r\n## Faster masking\r\n\r\nMasking secrets in JSON is faster. A 1 MiB JSON body now takes about 6 ms instead of 11 ms. This covers `--response` bodies, history, stream transcripts and trace files.\r\n\r\n## Upgrading\r\n\r\n1. Decoded gzip responses have no `Content-Encoding` or `Content-Length` header. Update checks that read them.\r\n2. Gzip that can't be decoded fails the request with exit 26. So does an event stream in another encoding, such as `br`.\r\n3. Requests imported with `curl --compressed` before 1.18.1 still ask for `gzip, deflate, br`. A `br` or `deflate` body is kept as it arrived, so change the header to `gzip`.\r\n\r\nIf you're upgrading from 1.17.2 or older, read the [1.18.0 notes](https://github.com/unkn0wn-root/resterm/releases/tag/v1.18.0).\r\n"}
