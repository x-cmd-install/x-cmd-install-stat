9855617,"node_id":"RA_kwDOP5rK3s4k8j8B","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:04e4db5bd4f18998dfcd000e6c83ac4891d88f16b7127562e97f67ccee9960ec","download_count":1,"created_at":"2026-10-07T21:25:31Z","updated_at":"2026-10-07T21:25:31Z"},{"id":619855618,"node_id":"RA_kwDOP5rK3s4k8j8C","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":64567808,"digest":"sha256:e68daeeb24e6e0aa4eb578d63a44db325f8846a11791734269834c58c08127a7","download_count":3,"created_at":"2026-10-07T21:25:31Z","updated_at":"2026-10-07T21:25:33Z"},{"id":619855613,"node_id":"RA_kwDOP5rK3s4k8j79","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:9d6935bf8568a6eb3f22c6aaa26bb019e0ee28d92630472fad46de6e3dde3e91","download_count":6,"created_at":"2026-10-07T21:25:31Z","updated_at":"2026-10-07T21:25:31Z"},{"id":619855633,"node_id":"RA_kwDOP5rK3s4k8j8R","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":69367808,"digest":"sha256:65b60aa7032358b177e15e116f4d340b0e72b52cecbc73accd91aed5cde09804","download_count":8,"created_at":"2026-10-07T21:25:31Z","updated_at":"2026-10-07T21:25:34Z"},{"id":619855632,"node_id":"RA_kwDOP5rK3s4k8j8Q","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:3964697cf42cd34868f90ff4c57515a2da4517f37be52e9b44f9b5bcdf40de48","download_count":6,"created_at":"2026-10-07T21:25:31Z","updated_at":"2026-10-07T21:25:31Z"}],"body":"## v1.13.2\r\n\r\nThis patch fixes ignored trace budgets, cookie API keys in OpenAPI imports, and condition handling for workflow loops. It also changes the usage error exit code for `init`, `collection`, and `history` from `1` to `2`.\r\n\r\n### Trace budgets\r\n\r\nCompletion used to suggest `request-headers<=` and `request-body<=`, but Resterm silently ignored those budgets. They now work.\r\n\r\nCompletion now suggests `request_headers<=` and `request_body<=`. The hyphenated names are still supported, so you don't need to edit existing files. Those budgets are now enforced, though, which means a run that previously passed may fail if it exceeds them.\r\n\r\nUnknown phases and options now produce a warning in both the editor and `resterm run`. For example, a typo in `dns`:\r\n\r\n```http\r\n### Health\r\n# @trace dsn<=50ms total<=400ms\r\nGET {{base.url}}/health\r\n```\r\n\r\n```text\r\nWarnings:\r\n  api.http:2: unknown @trace option \"dsn\"\r\n```\r\n\r\nSee the [tracing docs](https://resterm.app/docs/ui-tour/#timeline--tracing) for supported phase names and aliases.\r\n\r\n### OpenAPI imports\r\n\r\nAPI keys sent as cookies are now imported into the request's `Cookie` header, alongside any cookie parameters:\r\n\r\n```http\r\n### getMe\r\n# @name getMe\r\nGET {{baseUrl}}/me\r\nCookie: theme={{cookie_theme}}; session_id={{auth.apiKey}}\r\n```\r\n\r\nOlder imports generated `# @auth apikey cookie session_id {{auth.apiKey}}`, which failed when the request ran. Resterm now rejects that directive during parsing:\r\n\r\n```text\r\nerror[parse]: @auth apikey placement \"cookie\" is not supported. Use header or query\r\n```\r\n\r\nIf you have one of these imports, re-import the spec or replace the directive with a `Cookie` header.\r\n\r\nThe importer also avoids writing a parameter when the API key already occupies the same cookie, header, or query parameter. Previously, it could send a cookie key twice. Servers that read the first value could receive the parameter placeholder instead of the key.\r\n\r\nThe [import docs](https://resterm.app/docs/cli/import/) explain how OpenAPI security schemes map to Resterm requests.\r\n\r\n### Workflow conditions and loops\r\n\r\nYou can now combine `@when` or `@skip-if` with `@for-each` on a workflow step, in either order:\r\n\r\n```http\r\n# @workflow sync-users\r\n# @for-each json.file(\"_data/users.json\") as user\r\n# @skip-if user.disabled\r\n# @step Sync using=SyncUser\r\n```\r\n\r\nIn 1.13.0, this could fail with `@for-each must be followed by @step`.\r\n\r\nBoth directives above belong to the step. The condition is checked for each item and can use the loop variable. Disabled users are reported as skipped iterations; the remaining users are sent. If every user is disabled, the report still records each skipped iteration rather than a single skipped step.\r\n\r\nWhen `@for-each` belongs to the request instead, a condition above `@step` is checked once, before the loop's list is evaluated. A false `@when` or a true `@skip-if` skips the whole step. This lets a step condition guard a request loop whose data file may be missing.\r\n\r\nThat step condition cannot use the request's loop variable, because the variable is not set yet. It still fails with `undefined name`, but Resterm now adds help explaining why and where to move the condition.\r\n\r\nTo filter each item of a request loop, put the condition inside the request:\r\n\r\n```http\r\n# @workflow sync-users\r\n# @step Sync using=SyncUser\r\n\r\n### Sync user\r\n# @name SyncUser\r\n# @for-each json.file(\"_data/users.json\") as user\r\n# @skip-if user.disabled\r\nPOST {{base.url}}/users\r\n```\r\n\r\nHere, both directives belong to the request, so `user` is available when the condition runs. A step's own `@for-each` cannot be combined with a `@for-each` on the request it uses.\r\n\r\nParser errors are more useful here, too. A second `@when` or `@skip-if` before the same step now points to the first condition instead of saying `@when must be followed by @step`. A `@skip-if` left without a following step is now reported by its own name rather than as `@when`.\r\n\r\nSee the [workflow docs](https://resterm.app/docs/workflows/) for conditions and loops.\r\n\r\n### RestermScript errors\r\n\r\n`try` now preserves timeout, cancellation, and execution-limit aborts even when another error wraps them. These aborts stop evaluation instead of becoming an ordinary failed `try` result. Wrapped timeout and cancellation errors also retain their diagnostic classification and source location.\r\n\r\n### CLI exit codes\r\n\r\n`resterm init`, `resterm collection`, and `resterm history` now exit with `2` for invalid usage: missing flag values, unknown flags, extra arguments, unknown subcommands, or an unknown `init` template, as applicable.\r\n\r\nThese errors previously returned `1`. Other errors still return `1`, matching the convention used by `run`, `mock`, and `record`.\r\n\r\nIf your scripts check these commands for exit code `1`, update them to handle `2` for usage errors.\r\n\r\n### Documentation\r\n\r\nThe new [Headless Go API](https://resterm.app/docs/headless/) page shows how to run request files from Go.\r\n\r\nThe docs also cover previously missing details about OpenAPI security schemes, trace phase names, and exit codes for `init`, `collection`, `history`, and `mock`.\r\n\r\n### Upgrading from 1.12.1 or earlier\r\n\r\nA few changes from [1.13.0](https://github.com/unkn0wn-root/resterm/releases/tag/v1.13.0) are worth checking if you're skipping that release:\r\n\r\n- Digest authentication is available through `@auth digest`. The name `digest` is now reserved, so `@auth Digest <value>` no longer sends a custom header.\r\n- Resterm now sends the `Host` header you set on a request.\r\n- In detailed exit-code mode, `resterm run` returns `26` rather than `21` for malformed HTTP responses.\r\n- WebSocket transcripts now include server pings and pongs.\r\n"}
