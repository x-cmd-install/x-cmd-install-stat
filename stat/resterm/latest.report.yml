ated_at":"2026-09-25T08:00:50Z"},{"id":587854819,"node_id":"RA_kwDOP5rK3s4jCfPj","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:9cb437303775cfb797bf23534bd669be58984940d786a89f5636173db10d70eb","download_count":20,"created_at":"2026-09-25T08:00:48Z","updated_at":"2026-09-25T08:00:48Z"}],"body":"## v1.9.1\r\n\r\nThis patch fixes two bugs from 1.9.0. The Profile tab is now visible while a profile runs, and `vars.get` no longer returns template text when a `@const` has the same name.\r\n\r\nIf you have not updated yet, see the [1.9.0 release notes](https://github.com/unkn0wn-root/resterm/releases/tag/v1.9.0) for run variables, the Profile tab with comparison against the previous run, and `vars.get` returning the value sent with the request.\r\n\r\n## Fixed\r\n\r\n`vars.get` now returns the request value when a `@const` has the same name.\r\n\r\n```http\r\n# @const id fixed\r\n\r\n### Create order\r\n# @name create\r\n# @request id {{$uuid}}\r\nPOST https://example.com/orders\r\nX-Request-Id: {{= vars.get(\"id\") }}\r\n```\r\n\r\nIn v1.9.0, `vars.get(\"id\")` returned the literal text `{{$uuid}}`. Now it returns the generated UUID. The same applies to `@capture`, `@assert`, `@poll until=`, and `@retry-when`.\r\n\r\n`{{id}}` still resolves to `fixed`. Constants take precedence in templates, and `vars` never exposes them.\r\n\r\n- The Profile tab now shows live progress during a profile run. In v1.9.0, the sending indicator covered the tab until the run finished."}
