665152981,"node_id":"RA_kwDOP5rK3s4npW3V","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:0ce936db9d133e97217a102f851e7a9d2c30663a6025d621f91c8b6f4aec474b","download_count":2,"created_at":"2026-10-22T08:15:07Z","updated_at":"2026-10-22T08:15:08Z"},{"id":665152971,"node_id":"RA_kwDOP5rK3s4npW3L","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":62074368,"digest":"sha256:9c76db6d022febb8d969105e0e663bd0d9133b346ea3ea5f6f0afed506195982","download_count":11,"created_at":"2026-10-22T08:15:07Z","updated_at":"2026-10-22T08:15:09Z"},{"id":665152960,"node_id":"RA_kwDOP5rK3s4npW3A","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:d6e12ec0d8a4c3d4df83fc9d6c796239165249fe17306b463bf8ac0d2c061ca2","download_count":14,"created_at":"2026-10-22T08:15:07Z","updated_at":"2026-10-22T08:15:07Z"},{"id":665152979,"node_id":"RA_kwDOP5rK3s4npW3T","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":66963456,"digest":"sha256:c92e5804c00ea6b26d36c6794698716fd7c9a189b10f56d57de8be3112377576","download_count":50,"created_at":"2026-10-22T08:15:07Z","updated_at":"2026-10-22T08:15:10Z"},{"id":665152980,"node_id":"RA_kwDOP5rK3s4npW3U","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:ff337b8bf9d3b0257a0291fde19da9231e7af593a77bb9f0aa10b678ab7be318","download_count":14,"created_at":"2026-10-22T08:15:07Z","updated_at":"2026-10-22T08:15:08Z"}],"body":"# v1.16.1\r\n\r\nThis release moves resterm to Go 1.27.3.\r\n\r\n> **Important:** Please update. This release blocks certificates from a compromised certificate authority (eMudhra).\r\n\r\n## Compromised eMudhra certificates\r\n\r\nThe private keys of eight intermediate certificates from the certificate authority eMudhra were so weak that anyone could recover them from the public certificates. With those keys, anyone can issue a valid HTTPS certificate for any website. eMudhra has revoked the certificates, and browsers and operating systems are blocking them. ([CVE-2026-111943](https://go.dev/issue/82345), [Mozilla's write-up](https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/))\r\n\r\nresterm 1.16.1 rejects any certificate chain through these intermediates on every platform. resterm 1.16.0 can still accept them on systems whose certificate store doesn't block them yet.\r\n\r\n## Before you update\r\n\r\n**macOS 12 Monterey is no longer supported.** The macOS binaries need macOS 13 Ventura or newer. On macOS 12, do not run `resterm --update`, because it installs a binary your system does not support. Instead, build 1.16.1 with Go 1.26.10 or a newer 1.26 release, which has the same certificate fix:\r\n\r\n```sh\r\ngo install github.com/unkn0wn-root/resterm/cmd/resterm@v1.16.1\r\n```\r\n\r\nSome TLS-inspecting proxies may drop HTTPS connections. resterm now offers post-quantum (ML-DSA) signature algorithms when it opens a TLS connection. Some proxies and load balancers reset these connections. Reports so far name Palo Alto Prisma Access and F5 BIG-IP (golang/go#81199). If HTTPS requests fail with EOF or connection reset by peer after you update, build with Go 1.26.10.\r\n\r\nFixes\r\n\r\n- An SSE stream that stops at its size or event limit now closes its connection right away instead of reading on in the background.\r\n- Go security fixes for net/http, crypto/tls, net/textproto and html/template: CVE-2026-97031, CVE-2026-94440, CVE-2026-97032, CVE-2026-94439, CVE-2026-78663, CVE-2026-78669, CVE-2026-78660, CVE-2026-78667, CVE-2026-56866, CVE-2026-78659, CVE-2026-97030, CVE-2026-94448.\r\n\r\nOther changes\r\n\r\n- GODEBUG=tlsrsakex=1 and GODEBUG=tls3des=1 no longer turn RSA key exchange or 3DES back on for old servers."}
