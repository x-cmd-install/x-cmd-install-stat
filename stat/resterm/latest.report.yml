2333082,"node_id":"RA_kwDOP5rK3s4kf3Ya","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:ca2647f0ba3657822bf4a78cd0853e1b66904cbf4d78834b1f6d22250e1dcb91","download_count":3,"created_at":"2026-10-05T11:09:39Z","updated_at":"2026-10-05T11:09:39Z"},{"id":612333085,"node_id":"RA_kwDOP5rK3s4kf3Yd","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":64591872,"digest":"sha256:e751f80950920ecceed92cd9ebabd7d51f0a03c33d61497e9c6bd17db6038b5d","download_count":2,"created_at":"2026-10-05T11:09:39Z","updated_at":"2026-10-05T11:09:40Z"},{"id":612333084,"node_id":"RA_kwDOP5rK3s4kf3Yc","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:f50ccf1f71d607eeb0726b9a50613485345c8294c0bdf0fad10119695f967611","download_count":23,"created_at":"2026-10-05T11:09:39Z","updated_at":"2026-10-05T11:09:39Z"},{"id":612333091,"node_id":"RA_kwDOP5rK3s4kf3Yj","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":69390848,"digest":"sha256:8d8ab1af55645906e8cd628d8ea318d48356edad6fe84426c198f7a27c642a09","download_count":28,"created_at":"2026-10-05T11:09:39Z","updated_at":"2026-10-05T11:09:41Z"},{"id":612333087,"node_id":"RA_kwDOP5rK3s4kf3Yf","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:01c4ff9893e96e01ec9268e5cd41aeb7a498f5eda0ddf013e6f9bcfa6f81d35c","download_count":20,"created_at":"2026-10-05T11:09:39Z","updated_at":"2026-10-05T11:09:39Z"}],"body":"## v1.12.1\r\n\r\nThis patch fixes SSE parsing issues and a couple of stale cache problems in mocks and RestermScript modules.\r\n\r\nResterm now follows the [SSE specification](https://html.spec.whatwg.org/multipage/server-sent-events.html#event-stream-interpretation) more closely. Field values keep their whitespace, CR-only streams parse correctly, and BOMs, bare field names, and id values containing null are handled per spec.\r\n\r\n### If you're upgrading from 1.11.0 or older\r\n\r\n[1.12.0](https://github.com/unkn0wn-root/resterm/releases/tag/v1.12.0) changed how helpers such as `{{$uuid}}` behave in values written by pre-request scripts, `@apply`, and `@patch`. They're now treated as plain text.\r\n\r\nUse `vars.interpolate(\"{{$uuid}}\")` when you want a new interpolated value.\r\n\r\nResterm also warns when a script sends a placeholder literally, editor completion includes `vars.` methods, and JavaScript errors now point back to the relevant line in your request or script file.\r\n\r\n### SSE field values\r\n\r\nResterm now removes at most one space after a field's colon. Any remaining spaces or tabs are part of the value.\r\n\r\nBefore this fix, the indentation in this stream was lost:\r\n\r\n```text\r\ndata: {\r\ndata:   \"set\": 2,\r\ndata:   \"score\": \"6-4\"\r\ndata: }\r\n```\r\n\r\nIt now produces:\r\n\r\n```json\r\n{\r\n  \"set\": 2,\r\n  \"score\": \"6-4\"\r\n}\r\n```\r\n\r\nThe same parsing rule applies to `event`, `id`, and comments.\r\n\r\n### SSE lines and fields\r\n\r\n- CRLF, LF, and CR line endings are all supported. CR-only streams no longer get read as one long line.\r\n- A byte order mark before the first line is ignored.\r\n- A line without a colon is treated as a field with an empty value. A bare `data` line therefore adds an empty line to the event data.\r\n- An `id` containing a null character is ignored.\r\n\r\nThe [streaming docs](https://resterm.app/docs/streaming/) now describes how Resterm reads events and what gets written to the transcript. Comments, blocks with no data field, and unfinished blocks at connection close now behave the same as browser `EventSource`.\r\n\r\n### Fixed\r\n\r\n- `@sse idle` now resets whenever bytes arrive, even if they don't complete a line yet. This avoids `timeout:idle` on large events that are still being streamed.\r\n- Empty blocks, including blocks made up only of unknown fields, no longer count toward `max-event-bytes`.\r\n- `resterm mock --watch` and the TUI mock server now notice edits that keep the same file size and happen within two seconds of the previous write. For example, changing `200` to `201` no longer leaves the old response cached.\r\n- RestermScript modules loaded with `@use` get the same cache fix. Changes are picked up even when the file size stays the same, and `@use` without `as` no longer keeps a stale module name. If a recheck finds that the contents haven't changed, Resterm keeps the compiled module and its top-level state.\r\n\r\nThanks to @bensynapse for the fix to preserve whitespace in SSE field values in PR #448.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
