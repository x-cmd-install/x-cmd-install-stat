updated_at":"2026-10-02T20:50:10Z"},{"id":606467035,"node_id":"RA_kwDOP5rK3s4kJfPb","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:f9b35cb849cf956d7831a0e9ac6943e6320d85ac18897683c7b08cb324f65212","download_count":21,"created_at":"2026-10-02T20:50:08Z","updated_at":"2026-10-02T20:50:08Z"}],"body":"## v1.11.0\r\n\r\nThis release fixes two security issues where values from a server response could cause Resterm to send local files or secrets. It also changes how scripts and `@apply` handle templates, so some existing scripts will need updating. Other fixes cover resterm run, gRPC TLS, SSH tunnels, OAuth refresh, OpenAPI import, and resterm record.\r\n\r\n## Breaking security change: scripts and `@apply` no longer expand variable templates\r\n\r\nValues passed to `request.setHeader`, `setURL`, `setQueryParam`, `setBody`, and the other `set*` helpers are now data. Templates in them are not expanded. Only dynamic helpers such as `{{$uuid}}` are rendered.\r\n\r\n```http\r\n### Profile\r\n# @script pre-request\r\n> request.setHeader(\"Authorization\", \"Bearer {{api.token}}\");\r\nGET https://api.example.com/me\r\n```\r\n\r\nIn 1.10.3, this request sent the token. Now it sends the text `Bearer {{api.token}}`. Build the value from variables instead:\r\n\r\n```http\r\n# @script pre-request\r\n> request.setHeader(\"Authorization\", \"Bearer \" + vars.get(\"api.token\"));\r\n```\r\n\r\nThe same applies to `@apply` and `@patch`. A patch returns data, so `headers`, `query`, `body`, `auth`, and `vars` in it are not expanded:\r\n\r\n```text\r\n# @apply {headers: {\"Authorization\": \"Bearer {{api.token}}\"}}             sends {{api.token}} as text\r\n# @apply {headers: {\"Authorization\": \"Bearer \" + vars.get(\"api.token\")}}  sends the token\r\n```\r\n\r\n- An `@ path` line in a body set by `setBody` or `@apply {body: ...}` is sent as text. The file is not read.\r\n- A `{{= ... }}` expression read with `vars.get` and written back is sent as text. Compute the value in the script, or read it through a getter.\r\n- A token printed by `@auth command` is sent as printed, even when it contains `{{`.\r\n\r\nGetters now resolve variables and expressions before returning a value, so code that reads a value and writes it back keeps working:\r\n\r\n```http\r\n# @script pre-request\r\n> request.setURL(request.getURL() + \"?debug=1\");\r\nGET {{base}}/users\r\n```\r\n\r\n`request.getURL()` and `request.getHeader()` in JavaScript, and `request.url`, `request.headers`, `request.header()`, and `request.query` in RestermScript, now expand variables and `{{= ... }}` expressions. In 1.10.3, `request.getURL()` returned the text `{{base}}/users`.\r\n\r\n- Values set by the script itself are returned as written.\r\n- An undefined variable in the value is an error.\r\n- A helper written in the URL or a header, such as `{{$uuid}}`, stays as text in the getter, because each use makes a new value. Declare it with `@request` to read the value that is sent (see below).\r\n\r\n## Security fixes\r\n\r\n### Response values could read local files\r\n\r\nA value from a server, placed in a body with a template, could add an `@ path` include line:\r\n\r\n```http\r\n### Get note\r\n# @capture global note {{response.json.note}}\r\nGET https://api.example.com/note\r\n\r\n### Save note\r\nPOST https://api.example.com/save\r\nContent-Type: text/plain\r\n\r\n{{note}}\r\n```\r\n\r\nIf the server returned `\"note\": \"hi\\n@ /home/me/.ssh/id_rsa\"`, 1.10.3 read that file and sent its content in the body of `Save note`. Now only include lines written in the request file are read. A value placed by a template is sent as text.\r\n\r\nThe same happened when a script passed text with an `@ path` line to `request.setBody`.\r\n\r\n### Response values could expand secrets\r\n\r\nA script that copied a server value into the request also expanded templates in that value:\r\n\r\n```http\r\n### Next page\r\n# @script pre-request\r\n> request.setHeader(\"X-Next\", vars.global.get(\"next\"));\r\nGET https://api.example.com/next\r\n```\r\n\r\nIf the captured `next` was `{{api.token}}`, 1.10.3 sent the value of `api.token`. A name such as `{{AWS_SECRET_ACCESS_KEY}}` read the OS environment. Now the header is sent as `{{api.token}}`.\r\n\r\n### gRPC TLS settings were ignored\r\n\r\n```http\r\n### Health\r\n# @grpc grpc.health.v1.Health/Check\r\n# @setting grpc-root-cas ./certs/ca.pem\r\nGRPC api.internal:443\r\n```\r\n\r\nThe docs say any gRPC TLS setting turns on TLS. In 1.10.3, Resterm connected without TLS unless the request also had `@grpc-plaintext false`. This covered `grpc-root-cas`, `grpc-client-cert`, `grpc-client-key`, and `grpc-insecure`. If the server also accepted plaintext, metadata and `@auth` tokens were sent unencrypted.\r\n\r\nNow these settings turn on TLS. `@grpc-plaintext true` still forces plaintext.\r\n\r\n## Scripts read the values the request sends\r\n\r\nA helper in a declared value is now rendered once, when the request starts:\r\n\r\n```http\r\n### Create order\r\n# @request id {{$uuid}}\r\n# @script pre-request\r\n> request.setHeader(\"X-Script-Id\", vars.get(\"id\"));\r\nPOST https://api.example.com/orders\r\nX-Id: {{id}}\r\n```\r\n\r\nIn 1.10.3, `vars.get(\"id\")` returned the text `{{$uuid}}`, so the request sent two different UUIDs. Now `X-Id` and `X-Script-Id` are the same. `@run var` declarations read the same value too.\r\n\r\n- `trace` in `@capture` and `@assert` now belongs to the current response. In 1.10.3 it read the last traced response, so `trace.enabled()` was `true` on a request without `@trace` that ran after one with it.\r\n\r\n## resterm run\r\n\r\nCtrl-C now stops the run and still prints the report:\r\n\r\n```text\r\nFAIL GET slow [perform request: Get \"http://127.0.0.1:8080/slow\": interrupt signal received]\r\nSKIP GET next [skipped after cancel]\r\nSummary: total=2 passed=0 failed=1 skipped=1\r\n```\r\n\r\nThe exit code is `130`. In 1.10.3, the process ended with no output.\r\n\r\n- A request skipped by `@when` no longer stops `--fail-fast`. In 1.10.3, the rest of the run was skipped.\r\n- A skipped workflow step no longer fails the workflow. JSON reports show the reason in `skipReason`.\r\n- `@else fail=` and `@default fail=` count as assertion failures and exit `1`. In 1.10.3 they exited `3` (internal error).\r\n- An unknown environment in `@compare` fails before any request is sent and exits `2`. In 1.10.3, the requests above it were sent first, and the run exited `3`.\r\n- `-H` (`--headers`) works as the first flag. In 1.10.3, `resterm run -H api.http` printed the help. Only `-h`, `--help`, and `help` print help now.\r\n- Errors in `@assert` and `@capture` expressions point to the column in the file, not the column in the expression.\r\n\r\n## Exit codes and transports\r\n\r\n- gRPC certificate failures exit `22` (TLS). In 1.10.3 they exited `21` (network).\r\n- SSH tunnel failures, such as a refused connection or a rejected handshake, exit `27` (route). In 1.10.3 they were reported as network or unknown failures, and the error ended with an extra `use of closed network connection`.\r\n- On macOS, an untrusted HTTPS certificate exits `22`. A TLS alert from the server, such as `certificate required`, exits `22` too.\r\n- WebSocket results show the `ws://` or `wss://` URL. In 1.10.3, the effective URL showed `http://` or `https://`.\r\n\r\n## Auth, import, and record\r\n\r\n- OAuth refresh sends client credentials the same way as the first fetch. In 1.10.3, a client without `client_secret`, such as `authorization_code` with PKCE, sent `client_id` in the form on fetch, but a Basic header with an empty secret on refresh.\r\n- `# @auth oauth2 cache_key=myapi` takes `grant` and `client_auth` from the line that seeded the key. In 1.10.3, the short line always set `grant=client_credentials` and `client_auth=basic`.\r\n- Tokens saved by 1.10.x with `--persist-auth` are still found.\r\n- `--openapi-server-index` now applies to every request. In 1.10.3, the file's `baseUrl` used the chosen server, but each request set `baseUrl` back to the first server.\r\n- `resterm record` checks the `.http` or `.rest` extension before it starts. If the recorder cannot start, e.g., the port is busy, it no longer leaves an empty output file that blocks the next try.\r\n\r\n## SHA-512 in RestermScript\r\n\r\n`crypto.sha512(text)` and `crypto.hmacSha512(key, text)` return hex-encoded digests, the same as the SHA-256 helpers:\r\n\r\n```http\r\n### Signed\r\n# @rts pre-request\r\n> request.setHeader(\"X-Signature\", crypto.hmacSha512(vars.get(\"api.secret\"), request.url))\r\nGET https://api.example.com/orders\r\n```\r\n\r\n## Docs\r\n\r\n- Each docs topic now has its own page under `docs/`, the same pages as [resterm.app](https://resterm.app/docs/). `docs/resterm.md` links to the new pages.\r\n- The docs now clarify several requirements. `@auth apikey` needs the placement, the name, and the value. A second `@auth`, `@name`, `@poll`, `@retry`, or other single-value directive in a request is a parse error, not a warning. The JavaScript `response.body` is a property, not `body()`.\r\n\r\n## New contributors\r\n\r\nThanks @quelcom for adding SHA-512 and HMAC-SHA512 to RestermScript in #441.","mentions_count":1}
