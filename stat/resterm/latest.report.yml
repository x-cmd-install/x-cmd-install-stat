8367434,"node_id":"RA_kwDOP5rK3s4mpU1K","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:a20f7a0c9579221aab1663fe6940ed9bdf1b667922ec1c8b7ecddf233553bef7","download_count":1,"created_at":"2026-10-16T19:26:16Z","updated_at":"2026-10-16T19:26:16Z"},{"id":648367441,"node_id":"RA_kwDOP5rK3s4mpU1R","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":64647168,"digest":"sha256:39e0ca89e3163fca2187bd8a26589933345307970c6092c380d7a0b8f1029a14","download_count":9,"created_at":"2026-10-16T19:26:16Z","updated_at":"2026-10-16T19:26:19Z"},{"id":648367443,"node_id":"RA_kwDOP5rK3s4mpU1T","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:bba663e0c045bcebeb46b804a8c1358dda01968c7f176104604b652a67f46726","download_count":12,"created_at":"2026-10-16T19:26:16Z","updated_at":"2026-10-16T19:26:16Z"},{"id":648367446,"node_id":"RA_kwDOP5rK3s4mpU1W","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":69437952,"digest":"sha256:200eda5e2c2e432b3b344d9ee84451eaf505e59eb568d5a99d5daa4cdc6246fd","download_count":31,"created_at":"2026-10-16T19:26:16Z","updated_at":"2026-10-16T19:26:19Z"},{"id":648367448,"node_id":"RA_kwDOP5rK3s4mpU1Y","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:2dc42f8d6008dc169910ebe55c8d7becf475147196a24bdb6f16e06299838c38","download_count":12,"created_at":"2026-10-16T19:26:16Z","updated_at":"2026-10-16T19:26:16Z"}],"body":"## v1.15.0\r\n\r\nYou can now write response tests directly in RestermScript, without switching to JavaScript. There's also `json.equal` and `json.diff`, plus a couple of bug fixes.\r\n\r\n### RestermScript test blocks\r\n\r\nYou can use `@rts test` to validate responses in RestermScript. Call `t.error` to report a failure and continue checking, or `t.fatal` to stop the current block.\r\n\r\n```http\r\n### Orders\r\n# @name orders\r\n# @use ./validators.rts\r\n# @rts test \"orders are valid\"\r\n> {%\r\nfor let _, msg range validators.orders(response.json().orders) {\r\n  t.error(msg)\r\n}\r\n%}\r\nGET {{base.url}}/orders/bad\r\n```\r\n\r\n`validators.rts`:\r\n\r\n```rts\r\nmodule validators\r\n\r\nexport fn orders(list) {\r\n  let errs = []\r\n  for let _, o range list {\r\n    if o.total < 0 {\r\n      errs = rts.list.append(errs, \"order \" + str(o.id) + \": total \" + str(o.total) + \" is negative\")\r\n    }\r\n    if len(o.items) == 0 {\r\n      errs = rts.list.append(errs, \"order \" + str(o.id) + \": no items\")\r\n    }\r\n  }\r\n  return errs\r\n}\r\n```\r\n\r\n```text\r\nTests:\r\n  [FAIL] orders are valid - orders.http:7: order 1: total -5 is negative\r\n                            orders.http:7: order 3: no items (77.416\u00b5s)\r\n```\r\n\r\n- Each block produces one test result. Names are optional, but names containing spaces must be quoted. `# @script test lang=rts` does the same thing.\r\n- Test blocks can access `response`, `vars`, `env`, captures, and imported modules. They are read-only, though: `vars.set` and request modifications will fail. Use `@capture` if you need to save something.\r\n- Resterm runs `@assert` first, then RTS test blocks in file order, and finally JavaScript tests. An assertion failure won't prevent the other tests from running.\r\n- Runtime errors, such as accessing a field on `null` or calling `fail()`, fail the current block and show the file and line. The remaining blocks still run. `resterm run` exits with `1` for failed tests and `24` for script errors.\r\n- If an imported `@use` module can't load, Resterm reports the error once and marks all test blocks as failed.\r\n\r\nSee [`@rts`](https://resterm.app/docs/rts/directives/#rts) and [`t`](https://resterm.app/docs/rts/host-objects/#t) in the docs.\r\n\r\n### Comparing JSON\r\n\r\n`json.equal(a, b)` compares values recursively, including nested lists and dicts. You can also use it in `@assert`:\r\n\r\n```http\r\n# @assert json.equal(response.json().tags, [\"ops\", \"billing\"]) => \"tags changed\"\r\n```\r\n\r\n`json.diff(got, want)` gives you a message for each difference. You can pass those messages to `t.error` to report all mismatches at once:\r\n\r\n```http\r\n### User\r\n# @name user\r\n# @rts test \"matches fixture\"\r\n> {%\r\nlet want = {id: 7, name: \"Ada\", role: \"owner\", tags: [\"ops\", \"billing\"], active: true}\r\nfor let _, d range json.diff(response.json(), want) {\r\n  t.error(d)\r\n}\r\n%}\r\nGET {{base.url}}/users/7\r\n```\r\n\r\n```text\r\nTests:\r\n  [FAIL] matches fixture - users.http:7: $[\"display.name\"]: unexpected \"Ada L.\"\r\n                           users.http:7: $.role: got \"admin\", want \"owner\"\r\n                           users.http:7: $.tags[1]: missing, want \"billing\" (61.209\u00b5s)\r\n```\r\n\r\nResterm shows up to 100 differences, followed by a count of any remaining ones (for example, `and 3 more differences`). See the [JSON helpers docs](https://resterm.app/docs/rts/stdlib/#json-helpers).\r\n\r\n### One-line `{% %}` blocks\r\n\r\nSingle-line `{% %}` scripts work with RestermScript too:\r\n\r\n```http\r\n# @rts pre-request\r\n> {% request.setQueryParam(\"expand\", \"roles\") %}\r\n```\r\n\r\nIn 1.14.1 this failed with `dict key must be string or ident`.\r\n\r\n### JSON paths\r\n\r\nJSON paths behave the same way across `@capture`, stream captures, `response.json(path)`, `json.get`, `json.has`, mock responses and `@auth command` options.\r\n\r\n- Negative indexes count from the end everywhere. In 1.14.1, `response.json(\"items[-1].id\")` returned null in scripts.\r\n- Captures can read keys that contain a dot: `{{response.json[\"display.name\"]}}`. This used to capture an empty value.\r\n- A key with a space has to be quoted, for example `$[\"first name\"]`.\r\n- Stream paths can go deeper, as in `{{stream.events[0].json.id}}` for a gRPC stream. Field names in stream paths are case-sensitive.\r\n\r\nInvalid paths produce errors instead of silently returning unexpected values. For example, in 1.14.1, `items[*]` returned the entire list, so this assertion passed:\r\n\r\n```http\r\n# @assert len(json.get(response.json(), \"items[*]\")) == 3\r\n```\r\n\r\nIn 1.15.0, it fails with:\r\n\r\n```text\r\nerror[script]: json.get(value[, path]) invalid path \"items[*]\": invalid array index \"*\"\r\n--> items.http:4:23\r\n```\r\n\r\nThe same goes for captures. `{{response.json.items[*].id}}` fails even when `capture.strict` is off. With `capture.strict` on, a missing key says `key not found` instead of `segment not found`.\r\n\r\nSee the [captures docs](https://resterm.app/docs/captures/).\r\n\r\n### Canceling a run\r\n\r\nCtrl+C during tests counts as a cancellation, not a script error. The exit code is `130` instead of `24`.\r\n\r\n1.14.1:\r\n\r\n```text\r\nFAIL GET orders [test script 1: interrupt signal received]\r\n  Script Error:\r\n    error[script]: test script 1\r\n    \u2570\u2500> interrupt signal received\r\n```\r\n\r\n1.15.0:\r\n\r\n```text\r\nFAIL GET orders [interrupt signal received]\r\n  Error:\r\n    error[canceled]: interrupt signal received\r\n```\r\n\r\nA cancel before the request is sent, or during `@capture`, `@apply`, `@when` and pre-request scripts, shows `error[canceled]` too. In the TUI, a cancel during checks keeps the response and shows `Request canceled`.\r\n\r\nIf you use the headless API and cancel with a cause (`context.WithCancelCause` or `context.WithTimeoutCause`), the run is reported as canceled or timed out instead of a network or unknown error. This includes poll and retry waits.\r\n\r\n### Response check timeout\r\n\r\n`@assert` and RTS test blocks get their own full request timeout (`--timeout` or the request-specific setting), starting when response checks begin. Previously, HTTP assertions only had whatever time was left after the request, which could be almost nothing for slow responses. If the checks run out of time, the error says `response checks timed out after 30s` and blocks that haven't started are skipped.\r\n\r\nJavaScript tests keep their own time limit.\r\n\r\n### Script warnings\r\n\r\nResterm warns you about unsupported or unrecognized `@script` directives instead of silently ignoring them:\r\n\r\n```text\r\nWARN users.http:3: @script language \"python\" is not supported. Use js or rts\r\nWARN kind.http:3: @script kind \"check\" is not supported. Use pre-request or test\r\nWARN extra.http:3: @script ignores \"python\". Use lang=js or lang=rts to choose a language\r\nWARN opt.http:3: unknown @script option \"foo\"\r\n```\r\n\r\nThe first two are skipped and the last two run as JavaScript, as before. Warnings don't change the exit code.\r\n\r\n`@rts` is stricter about what follows it. A test name with spaces needs quotes, and unknown options such as `foo=1` are a parse error:\r\n\r\n```text\r\nerror[parse]: @rts test takes one name. Quote a name with spaces\r\n--> words.http:3:18\r\n     |\r\n   3 | # @rts test user shape\r\n     |                  ^\r\n```\r\n\r\n### Other fixes\r\n\r\n- Numbers are written in full when they turn into text. `str(1000000)`, `\"id=\" + 1000000`, `{{= 1000000 }}` and captures give `1000000` instead of `1e+06`. They follow `json.stringify`, so captures of very large or very small numbers, like `1e+21` or `1e-7`, changed too.\r\n- An error inside a `.rts` module shows the line from the module. Before, it showed the line with the same number from the `.http` file. When several test blocks fail, each error shows a line from its own file. If a file changed after its code was loaded, an error from the old code shows the line that ran.\r\n- `resterm run` and headless output show the failing line under errors from `@assert`, `@capture`, `@when`, `@apply` and templates, as the TUI already did. The TUI no longer prints these errors twice.\r\n- When an `@assert` and a JavaScript test both fail with errors, each error keeps its own file, line and stack. Before, they were merged into one `error[unknown]`.\r\n- Multi-line test messages line up in `resterm run` and the TUI.\r\n- `FAIL` rows in `--format text` and JUnit output stay on one line. Multi-line errors are joined with `; `.\r\n- Control characters in test names and messages are escaped, so a stray escape code can't mess up your terminal.\r\n- Workflow summaries stay on one line, and every line of a multi-line step message is indented. Profile failure reasons print on one line.\r\n- `str()` and `json.stringify` no longer hang on huge nested values. They fail with `string too long`.\r\n- The `LIVE` badge on the response tabs no longer disappears when the tab row is full.\r\n- Completion after `@rts` offers `test` as well. After `@script test` it offers only `lang=`.\r\n\r\n### Upgrading from 1.14.1\r\n\r\nIf you have existing request files or CI checks watch out for these changes:\r\n\r\n1. `{% %}` is no longer stripped from JavaScript in 2 cases - an included `.js` file wrapped in `{%` and `%}`, and a block where `{%` or `%}` shares a line with code across several `>` lines (`> {% a` ... `> b %}`). These fail with `SyntaxError: ... Unexpected token %`. For an included file, delete the braces. Inline, put `> {%` and `%}` on their own lines. One-line blocks like `> {% code %}` still work.\r\n2. Invalid JSON paths, such as `items[*]` or an unquoted key with a space, are errors in scripts and captures. Stream capture paths are case sensitive, so `{{stream.Kind}}` no longer matches `kind`.\r\n3. Unknown options after `@rts`, such as `foo=1`, stop the file from parsing and `resterm run` exits with `2`. 1.14.1 ignored them.\r\n4. Ctrl+C during checks exits with `130` instead of `24`, and a strict capture miss says `key not found` instead of `segment not found`. Update CI scripts that look for these.\r\n5. A module can't keep `vars`, `request`, `t` or other host objects for a later request. Using one fails with `vars belongs to an evaluation that has ended`. Save the value you need instead, for example `vars.get(\"token\")`.\r\n6. `@script test lang=rts` blocks were skipped without a warning in 1.14.1. In 1.15.0 they run.\r\n\r\n### Upgrading from 1.13.3 or earlier\r\n\r\nIf you're upgrading from **1.13.3** or earlier, there are a few changes in [1.14.0](https://github.com/unkn0wn-root/resterm/releases/tag/v1.14.0) worth checking:\r\n\r\n- On macOS and Linux, history files are now readable only by their owner (0600), and new directories use 0700. Existing history files have group and other permissions removed when opened.\r\n- resterm history backup no longer overwrites a file that isn't a SQLite database. Previous versions would delete it.\r\n- resterm history compact exits with 1 if another process prevents the database from shrinking.\r\n- The headless Go API has breaking changes to usage errors, failure rules, and JSON field names. If you use it from Go, read the release notes first.\r\n"}
