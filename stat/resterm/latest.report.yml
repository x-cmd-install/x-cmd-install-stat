3721094,"node_id":"RA_kwDOP5rK3s4lxdEG","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:8d3e67708274873726b65d322c38454233a6b4be90058f8837e9d6da0e18f8b5","download_count":1,"created_at":"2026-10-12T12:25:20Z","updated_at":"2026-10-12T12:25:20Z"},{"id":633721089,"node_id":"RA_kwDOP5rK3s4lxdEB","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":64592384,"digest":"sha256:6ebb91875aa25a8936b7aaa435c335360311ef7b85faebb627127537ca99a98d","download_count":2,"created_at":"2026-10-12T12:25:20Z","updated_at":"2026-10-12T12:25:22Z"},{"id":633721084,"node_id":"RA_kwDOP5rK3s4lxdD8","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:344d8235b5aab207bd4ee9ce50f62fd727d4d1bc1c4f3be5aa22a8e118defe15","download_count":20,"created_at":"2026-10-12T12:25:20Z","updated_at":"2026-10-12T12:25:20Z"},{"id":633721097,"node_id":"RA_kwDOP5rK3s4lxdEJ","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":69388800,"digest":"sha256:a68af7546db6393954f81311e7cb6191fce7c23c852ad383560d598963d5ce91","download_count":22,"created_at":"2026-10-12T12:25:20Z","updated_at":"2026-10-12T12:25:22Z"},{"id":633721099,"node_id":"RA_kwDOP5rK3s4lxdEL","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:e73d897c33367080bcefc481f97ec90505c3df017e77a494c8368467118b9eaa","download_count":22,"created_at":"2026-10-12T12:25:20Z","updated_at":"2026-10-12T12:25:21Z"}],"body":"## v1.14.1\r\n\r\nAn apostrophe in a comment could break a multi-line capture like this:\r\n\r\n```http\r\n### Get user\r\n# @name GetUser\r\n# @capture file user.id = (\r\n#   # the user's id\r\n#   response.json.id\r\n# )\r\nGET {{base.url}}/users/me\r\n```\r\n\r\nThe apostrophe in `user's` was mistaken for the start of a string. This mean that `response.json.id` never got rewritten to `response.json().id`, and the capture would fail with:\r\n\r\n```text\r\nerror[script]: member on non-object\r\n--> api.http:5:18\r\n```\r\n\r\nQuotes in comments are now ignored, so this capture works as expected. Quotes inside expressions are unaffected.\r\n\r\nThe same fix applies to the `@capture` warning for a double dot after json. A `response.json..id` inside a comment no longer triggers the warning, and an actual `response.json..id` in the expression is caught even if an earlier comment contains an apostrophe.\r\n\r\n### `response.json` outside captures\r\n\r\nThe response.json.id shorthand is only supported in `@capture`. Elsewhere, including `@assert`, `@when`, and `{{= ... }}`, json is a function and must be called.\r\n\r\nPreviously, using the shorthand in those contexts produced a generic member on non-object error. You will now get more useful error pointing what should've been done instead:\r\n\r\n```http\r\n### Health\r\n# @assert response.json.ok\r\nGET {{base.url}}/health\r\n```\r\n\r\n```text\r\nerror[script]: member on function response.json. Call it first\r\n```\r\n\r\nUse `response.json().ok` or `response.json(\"ok\")` instead. The same hint is shown for `last.json.id`.\r\n\r\nI've also updated the [captures docs](https://resterm.app/docs/captures/) and the [RestermScript docs](https://resterm.app/docs/rts/language/#indexing-and-member-access) to clarify where the shorthand works.\r\n\r\n### Workflow tab on light themes\r\n\r\nThe Workflow tab was hard to read with light themes because it used colors intended for dark backgrounds. The summary, step list, and selected step now use the same palette as the Profile tab. Step response bodies also use the theme's syntax highlighting, matching the main response pane. \r\n\r\nThese changes only affect themes tagged light. Dark themes are unchanged, apart from script errors in step test results now using the theme's error color, as they already do in the response pane.\r\n\r\nThanks @smxgit for fixing this!\r\n\r\n### Explain pane\r\n\r\nThe body in the final request section appeared directly below the headers, making it look like part of them. It now has its own `Body` heading, and rows are indented under their respective headings.\r\n\r\nBefore:\r\n\r\n```text\r\nDetails\r\nAuth: bearer\r\nHeaders\r\nContent-Type: application/json\r\n  {\"name\": \"ada\"}\r\nSteps\r\n\u2022 resolve vars\r\n```\r\n\r\nAfter:\r\n\r\n```text\r\nDetails\r\n  Auth: bearer\r\nHeaders\r\n  Content-Type: application/json\r\nBody\r\n  {\"name\": \"ada\"}\r\nSteps\r\n  \u2022 resolve vars\r\n```\r\n\r\nFor gRPC requests, the note showing where the message came from is also displayed under `Body`.\r\n\r\n### Upgrading from 1.13.3 or earlier\r\n\r\nIf you're upgrading from **1.13.3** or earlier, there are a few changes in [1.14.0](https://github.com/unkn0wn-root/resterm/releases/tag/v1.14.0) worth checking:\r\n\r\n- On macOS and Linux, history files are now readable only by their owner (0600), and new directories use 0700. Existing history files have group and other permissions removed when opened.\r\n- resterm history backup no longer overwrites a file that isn't a SQLite database. Previous versions would delete it.\r\n- resterm history compact exits with 1 if another process prevents the database from shrinking.\r\n- The headless Go API has breaking changes to usage errors, failure rules, and JSON field names. If you use it from Go, read the release notes first.\r\n","mentions_count":1}
