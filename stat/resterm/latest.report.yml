06467038,"node_id":"RA_kwDOP5rK3s4kJfPe","name":"resterm_Linux_x86_64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:1ba47597412a37eae7bbefb4b79b9e1fa6c9a696774b83f4230ca5fd44e385a2","download_count":1,"created_at":"2026-10-02T20:50:08Z","updated_at":"2026-10-02T20:50:08Z"},{"id":606467041,"node_id":"RA_kwDOP5rK3s4kJfPh","name":"resterm_Windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":64516096,"digest":"sha256:ea02eef3e300faa32bbdbfb65b4b1344d1d828e84ada535fb9e56db477f443b0","download_count":10,"created_at":"2026-10-02T20:50:08Z","updated_at":"2026-10-02T20:50:10Z"},{"id":606467044,"node_id":"RA_kwDOP5rK3s4kJfPk","name":"resterm_Windows_arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":92,"digest":"sha256:b038aef907d3652867f23c04e6fa0936a22f50be283c9d7a1214da570e7f0578","download_count":22,"created_at":"2026-10-02T20:50:08Z","updated_at":"2026-10-02T20:50:08Z"},{"id":606467036,"node_id":"RA_kwDOP5rK3s4kJfPc","name":"resterm_Windows_x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":69319680,"digest":"sha256:7cdec5bb50e9acdfa9b6c61dda126d03c310c1ab12b62f1f27328bc6f318a4d9","download_count":31,"created_at":"2026-10-02T20:50:08Z","updated_at":"2026-10-02T20:50:10Z"},{"id":606467035,"node_id":"RA_kwDOP5rK3s4kJfPb","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:f9b35cb849cf956d7831a0e9ac6943e6320d85ac18897683c7b08cb324f65212","download_count":22,"created_at":"2026-10-02T20:50:08Z","updated_at":"2026-10-02T20:50:08Z"}],"body":"## v1.11.0\r\n\r\nThis release prevents server response values from reading local files or expanding secrets, and fixes gRPC TLS settings that could leave connections unencrypted.\r\n\r\n**Compatibility change:** if you pass `{{api.token}}` to a script setter such as `request.setHeader`, Resterm now sends that text instead of the token. The same applies to `@apply` and `@patch`. Read the token with `vars.get(\"api.token\")` instead.\r\n\r\nIt also adds SHA-512 helpers and fixes CLI runs, transport errors, OAuth refresh, OpenAPI import, and recording.\r\n\r\n### Migration: build script values explicitly\r\n\r\nValues passed to `request.setHeader`, `setURL`, `setQueryParam`, `setBody`, and other `set*` helpers are now data. Variable templates and `{{= ... }}` expressions are sent as text. Only dynamic helpers such as `{{$uuid}}` are rendered.\r\n\r\nReplace template strings with explicit variable reads:\r\n\r\n```javascript\r\n// Before: sent the token in 1.10.3; now sends {{api.token}} as text.\r\nrequest.setHeader(\"Authorization\", \"Bearer {{api.token}}\");\r\n\r\n// Now: sends the token.\r\nrequest.setHeader(\"Authorization\", \"Bearer \" + vars.get(\"api.token\"));\r\n```\r\n\r\nThe same rule applies to `headers`, `query`, `body`, `auth`, and `vars` returned by `@apply` or `@patch`.\r\n\r\nRequest getters now resolve variables and `{{= ... }}` expressions before returning values. This covers JavaScript's `request.getURL()` and `request.getHeader()`, and RestermScript's `request.url`, `request.headers`, `request.header()`, and `request.query`. Reading a value and writing it back keeps working. Undefined references are errors and values written by scripts are returned as written.\r\n\r\nDynamic helpers in declared values are rendered once when the request starts, so scripts and `@run var` read the value the request sends. To share a UUID, declare `# @request id {{$uuid}}` and use `vars.get(\"id\")` and `{{id}}`. Helpers written directly in a URL or header stay as text in getters.\r\n\r\nA `{{= ... }}` expression read through `vars.get` and written back remains text: compute it in the script or read it through a request getter.\r\n\r\nSee [JavaScript script guidance](https://github.com/unkn0wn-root/resterm/blob/v1.11.0/docs/scripting.md#pre-request-scripts-script-pre-request) and [variable resolution](https://github.com/unkn0wn-root/resterm/blob/v1.11.0/docs/variables.md#variable-resolution-order) for details.\r\n\r\n### Security fixes\r\n\r\n- **Local file disclosure:** a body line such as `@ ./payload.txt` tells Resterm to read that file and send its contents. Previously, a server response could add such a line and make Resterm send a local file. Resterm now reads the file only when you write the `@ path` line directly in the body of your `.http` or `.rest` file. If the line comes from a variable or a script, Resterm sends the line as text without reading the file.\r\n- **Secret disclosure:** scripts copying server values into requests could expand templates such as `{{api.token}}` and send secrets. Those values are now treated as data.\r\n- **gRPC TLS:** `grpc-root-cas`, `grpc-client-cert`, `grpc-client-key`, and `grpc-insecure` now enable TLS. Previously, connections stayed plaintext unless `@grpc-plaintext false` was also set, potentially exposing metadata and auth tokens if the server accepted plaintext. Explicit `@grpc-plaintext true` still forces plaintext.\r\n\r\n### CLI runs and scripts\r\n\r\n- Ctrl-C stops the run, prints the report, skips remaining requests, and exits `130`.\r\n- Requests skipped by `@when` no longer trigger `--fail-fast`. Skipped workflow steps no longer fail the workflow; JSON reports include `skipReason`.\r\n- `@else fail=` and `@default fail=` count as assertion failures and exit `1`.\r\n- Unknown environments in `@compare` fail before any request is sent and exit `2`.\r\n- `-H` (`--headers`) works as the first flag. Only `-h`, `--help`, and `help` print help.\r\n\r\nErrors in `@assert` and `@capture` expressions now point to the column in the request file. Their `trace` object also belongs to the current response, rather than the last traced response.\r\n\r\n### Transports and exit codes\r\n\r\n- gRPC certificate failures, untrusted HTTPS certificates on macOS, and TLS alerts from servers exit `22` (TLS).\r\n- SSH tunnel failures exit `27` (route), without the extra `use of closed network connection` error.\r\n- WebSocket results retain the `ws://` or `wss://` effective URL.\r\n\r\n### Auth, import, and recording\r\n\r\n- OAuth refresh uses the same client authentication as the initial token fetch, including clients without a secret, such as authorization code with PKCE.\r\n- `@auth oauth2 cache_key=myapi` inherits `grant` and `client_auth` from the line that seeded the key.\r\n- Tokens saved by 1.10.x with `--persist-auth` remain available.\r\n- `--openapi-server-index` applies to every generated request.\r\n- `resterm record` validates the `.http` or `.rest` extension before starting. Failed startup, such as a busy port, no longer leaves an empty output file that blocks a retry.\r\n\r\n### SHA-512 and docs\r\n\r\nRestermScript adds `crypto.sha512(text)` and `crypto.hmacSha512(key, text)`, returning hex-encoded digests like the SHA-256 helpers.\r\n\r\nDocs now have one page per topic under `docs/`, matching [resterm.app](https://resterm.app/docs/). They clarify API-key auth requirements, parse errors for duplicate single-value directives, and JavaScript's `response.body` property. `docs/resterm.md` links to the new pages.\r\n\r\nThanks @quelcom for adding SHA-512 and HMAC-SHA512 in #441.\r\n","mentions_count":1}
