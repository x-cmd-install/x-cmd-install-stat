updated_at":"2026-10-01T07:21:07Z"},{"id":602688425,"node_id":"RA_kwDOP5rK3s4j7Eup","name":"resterm_Windows_x86_64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:d671bf07d677e572361b482390731daaed4fc2750b549b142f016f33c231b9b2","download_count":21,"created_at":"2026-10-01T07:21:04Z","updated_at":"2026-10-01T07:21:05Z"}],"body":"## v1.10.3\r\n\r\nThis patch moves the docs to [resterm.app](https://resterm.app). `:docs` and the `o` key in a help topic now open pages on the site instead of `docs/resterm.md` on GitHub.\r\n\r\n## If you are on 1.10.1 or older\r\n\r\n- [1.10.0](https://github.com/unkn0wn-root/resterm/releases/tag/v1.10.0) adds `cmd=` for command auth and named command auth with `use=`. Options with spaces around `=` and unknown `@auth command` options are now errors. The Headers tab has a one line summary and shows each repeated header on its own line.\r\n- [1.10.1](https://github.com/unkn0wn-root/resterm/releases/tag/v1.10.1) names a command auth definition with `name=`, as in `# @auth global command name=gh cmd=\"gh auth token\"`. A plain word after `command` is now an error, because in 1.10.0 it could turn off auth without an error.\r\n- [1.10.2](https://github.com/unkn0wn-root/resterm/releases/tag/v1.10.2) picks the file type for `g Shift+E` from the type, not the file name the server sent. Only known types open, and HTML, SVG, XML, and Markdown open as `.txt`.\r\n\r\n## Docs on resterm.app\r\n\r\n`:docs` opens the docs home. `:docs <topic>` opens the page for that topic:\r\n\r\n```text\r\n:docs             https://resterm.app/docs/\r\n:docs auth        https://resterm.app/docs/authentication/\r\n:docs commands    https://resterm.app/docs/ui-tour/#core-shortcuts\r\n```\r\n\r\n- The `o` key on a `:help` topic opens the same page.\r\n- Each topic has its own page. In 1.10.2, most topics opened a heading in the single `docs/resterm.md` file on GitHub.\r\n- `RESTERM.md` from `resterm init` links to `https://resterm.app/docs/`.\r\n\r\n## Changed\r\n\r\n- Docs links no longer match the build version. In 1.10.2, a release build opened the docs at its own tag, e.g., `blob/v1.10.2/docs resterm.md`. The site always shows the docs for the latest release."}
