t":"2026-07-13T22:32:10Z","updated_at":"2026-07-13T22:32:10Z"},{"id":475972593,"node_id":"RA_kwDODbWxfs4cXsPx","name":"jbang.zip.sha256","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":64,"digest":"sha256:a896e6128e0cb2f24544dbc40e847d54d522e8f283e743f60a959af49ae79757","download_count":8,"created_at":"2026-07-13T22:32:11Z","updated_at":"2026-07-13T22:32:11Z"},{"id":475972598,"node_id":"RA_kwDODbWxfs4cXsP2","name":"version.txt","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":7,"digest":"sha256:2796d189016b77d4285b777a392faefe1ec0e0ba65fdfbabd3d76677e247e3ca","download_count":209126,"created_at":"2026-07-13T22:32:11Z","updated_at":"2026-07-13T22:32:11Z"},{"id":475972601,"node_id":"RA_kwDODbWxfs4cXsP5","name":"version.txt.asc","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":216,"digest":"sha256:5379d8c9fac8a6d79f30f8fa73575f087f55e0140b8000b315e85bdec1e9ae3d","download_count":2,"created_at":"2026-07-13T22:32:11Z","updated_at":"2026-07-13T22:32:12Z"},{"id":475972603,"node_id":"RA_kwDODbWxfs4cXsP7","name":"version.txt.sha256","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":64,"digest":"sha256:8183f46899d36fa631843845f9ede0ac03d47686dc49d108c373759c019d91c7","download_count":3,"created_at":"2026-07-13T22:32:12Z","updated_at":"2026-07-13T22:32:12Z"}],"body":"\r\nA quick release to mainly fix two regressions in the Aesh move  + various fixes/cleanups.\r\n\r\n- **`--runtime-option` with space separator works again** \u2014 `--runtime-option -Dfoo=bar` was broken since 0.139.3, now fixed via aesh 3.16.5 (#2607)\r\n- **Comma-delimited deps in config restored** \u2014 `run.deps=a,b` in `jbang.properties` was passed as a single GAV instead of being split; fixed upstream in aesh 3.16.5 (#2607)\r\n- **Markdown scripts with main methods now build correctly** (#2592)\r\n- **Local artifacts loaded asynchronously** \u2014 faster startup when local deps are present (#2595)\r\n- **DomTrip-based POM parsing** \u2014 more robust and round-trip-safe POM handling (#2526)\r\n- **Quarkus version upgraded** to resolve JBoss Threads library warning (#2591)\r\n- **CVE-2025-67030 resolved** (#2476)\r\n\r\n### Refactoring\r\n\r\n- **`ExitException` moved out of `cli` package** \u2014 now lives in `dev.jbang` with factory methods (`ExitException.invalidInput(...)`, etc.) and exit code constants. Old constants in `BaseCommand` remain as deprecated delegates. This clears the path for a future `jbang-core` library split (#2602)\r\n\r\n### Dependency Updates\r\n\r\n- aesh \u2192 3.16.5\r\n- SLF4J \u2192 2.x\r\n- JUnit BOM \u2192 5.14.4\r\n- Hamcrest \u2192 3.0\r\n- Gradle \u2192 8.14.5\r\n- Java toolchain \u2192 21.0.11-tem\r\n- Maven/Gradle export wrappers updated\r\n\r\n\r\n## Changelog\r\n\r\n## \ud83d\udc1b Fixes\r\n- 57ebb47 fix: update aesh to 3.16.5 to fix --runtime-option space separator and comma-delimited deps from config (#2607)\r\n- d68dc18 fix: resolves mutation warning (#2545)\r\n- b92da09 fix(deps): update slf4j monorepo to v2 (#2500)\r\n- 14c4b29 fix: resolves CVE-2025-67030 (#2476)\r\n- c90c8a9 fix(deps): update dependency org.junit:junit-bom to v5.14.4 (#2489)\r\n- 7c80171 fix: upgrade Quarkus version to resolve JBoss Threads library warning\u2026 (#2591)\r\n- 1964736 fix: Use DomTrip for POM parsing (#2526)\r\n- 0bda4a3 fix: build markdown scripts with main methods (#2592)\r\n- 4d4158a fix: load local artifacts asynchronously (#2595)\r\n\r\n## \ud83d\udd04\ufe0f Changes\r\n- b3d1b30 refactor: move ExitException and exit codes out of cli package (#2602)\r\n\r\n## \ud83e\uddf0 Tasks\r\n- 0e06dcc chore(deps): update Java to 21.0.11-tem (#2604)\r\n- c90471d chore(deps): update Maven and Gradle wrappers used by jbang export {maven,gradle} (#2605)\r\n- e387b36 chore(deps): update plugin org.gradle.toolchains.foojay-resolver-convention to v1 (#2495)\r\n- e037c41 chore(deps): update hamcrest to version 3.0 (#2424)\r\n- 00c7476 chore(deps): update Gradle to 8.14.5 (#2470)\r\n- e56cbac chore(deps): update docker/login-action digest to c94ce9f (#2487)\r\n- 438550c chore(deps): update github/codeql-action digest to 99df26d (#2488)\r\n\r\n## \ud83d\udee0  Build\r\n- 3049c79 build: remove unused task-tree plugin (#2603)\r\n\r\n---\r\n- d56044d [minor] release\r\n\r\n\r\n## Contributors\r\nWe'd like to thank the following people for their contributions:\r\nArnab Nandy, GitHub, Max Rydahl Andersen, Mend Renovate, Tamas Cservenak, Werner Fouch\u00e9","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
