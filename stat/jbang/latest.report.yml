"updated_at":"2026-10-30T14:09:57Z"},{"id":692320340,"node_id":"RA_kwDODbWxfs4pQ_hU","name":"jbang.zip.sha256","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":64,"digest":"sha256:8909d3fee90ff08a532573948b7fe20e033362bb131672c70cc66d8a2315bab1","download_count":2,"created_at":"2026-10-30T14:09:57Z","updated_at":"2026-10-30T14:09:57Z"},{"id":692320367,"node_id":"RA_kwDODbWxfs4pQ_hv","name":"version.txt","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":7,"digest":"sha256:c62830c62172234306bd69d909bbed8ef8e8beff693c462f999ebffccadd43ee","download_count":1440,"created_at":"2026-10-30T14:09:58Z","updated_at":"2026-10-30T14:09:58Z"},{"id":692320406,"node_id":"RA_kwDODbWxfs4pQ_iW","name":"version.txt.asc","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":216,"digest":"sha256:d46016b2e3ae3b7b0916495f44db0911e0b3575810a3d00fb50361f940d49f09","download_count":1,"created_at":"2026-10-30T14:09:58Z","updated_at":"2026-10-30T14:09:59Z"},{"id":692320446,"node_id":"RA_kwDODbWxfs4pQ_i-","name":"version.txt.sha256","label":"","uploader":{"login":"maxandersen","id":54129,"node_id":"MDQ6VXNlcjU0MTI5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":64,"digest":"sha256:dce36b66453a21653bf196f32bca31d7d001a7a23ef3a1bcff9f10686820262c","download_count":2,"created_at":"2026-10-30T14:09:59Z","updated_at":"2026-10-30T14:09:59Z"}],"body":"## Unified version syntax for aliases\r\n\r\nYou've always been able to run a specific version of an alias - but *how* depended entirely on what the alias pointed at. A Maven GAV took a version one way, a git tag or branch another, a property placeholder another still. Three mechanisms, three mental models, and in some cases the catalog author had to set things up ahead of time for it to work at all.\r\n\r\nWith special effort and thanks to @wfouche we've managed to unify all of that behind a single syntax:\r\n\r\n```bash\r\njbang mytool:1.5.0@mycatalog\r\n```\r\n\r\nThat's it. The same `alias:version@catalog` form works whether the alias resolves to a Maven artifact, a GitHub/GitLab/Bitbucket URL, or a property-driven path - you no longer need to know how it's wired underneath.\r\n\r\nUnder the covers JBang looks at the alias's `script-ref` and applies the matching strategy, so the one syntax maps cleanly onto each mechanism:\r\n\r\n| What the alias points at | `script-ref` | `jbang mytool:2.0.0` resolves to |\r\n|---|---|---|\r\n| Maven artifact | `com.example:mytool:1.0.0` | `com.example:mytool:2.0.0` |\r\n| Maven artifact w/ classifier | `com.example:mytool:1.0.0:jar@dist` | `com.example:mytool:2.0.0:jar@dist` |\r\n| GitHub/GitLab/Bitbucket URL | `https://github.com/acme/mytool/blob/v1.0.0/Tool.java` | `.../blob/v2.0.0/Tool.java` |\r\n| Property placeholder | `io.quarkus:quarkus-cli:${jbang.app.version:3.0.0}` | `io.quarkus:quarkus-cli:2.0.0` |\r\n| Anything else | `tool.jar` | `tool.jar` unchanged - version still exposed to the script |\r\n\r\nFor the common cases the author does nothing special - Maven GAVs and git URLs just work, and the catalog format is unchanged and fully backward-compatible. When an author *does* want to adapt, they can expose a `${jbang.app.version}` placeholder in the `script-ref` with a default:\r\n\r\n```json\r\n{\r\n  \"aliases\": {\r\n    \"quarkus\": {\r\n      \"script-ref\": \"io.quarkus:quarkus-cli:${jbang.app.version:3.0.0}\"\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n`jbang quarkus@mycatalog` gives you 3.0.0, `jbang quarkus:3.15.1@mycatalog` gives you that one - same alias, no duplicated entries. And the requested version is always passed to the script as `-Djbang.app.version=<version>`, so even an alias that matches none of the patterns can read it and act on it itself:\r\n\r\n```java\r\nString version = System.getProperty(\"jbang.app.version\", \"dev\");\r\n```\r\n\r\nA few things worth knowing:\r\n\r\n- It's a selector, not a lock file - asking for a floating version or a git *branch* still resolves to whatever that ref points at today.\r\n- Applying a version through an alias *chain* is rejected - pin the final target directly.\r\n\r\nSo the everyday case - reproducing a bug report and checking the fix - becomes just:\r\n\r\n```bash\r\njbang mytool:1.4.0@mycatalog   # reproduce the report\r\njbang mytool:1.5.0@mycatalog   # verify the fix\r\n```\r\n\r\nSee the updated [Alias Catalogs](https://www.jbang.dev/documentation/guide/latest/alias_catalogs.html) guide for the full details.\r\n\r\nHave fun!\r\n\r\n## Changelog\r\n\r\n## 🚀 Features\r\n- a94fc61 feat: replace sdkman with mise (#2679)\r\n- 2d079dd feat: implement version pinning for JBang aliases (#2433)\r\n\r\n## 🐛 Fixes\r\n- 32082a2 fix(deps): upgrade JSpecify to 1.0.1 (#2681)\r\n- 7ba652f fix: suppress command typo warnings for resolved aliases (#2687)\r\n- cae3ad7 fix: support all versions of Groovy (#2664)\r\n\r\n## 🔄️ Changes\r\n- 867523c refactor: extract MainClassScanner deep module (#2669)\r\n\r\n## 🧰 Tasks\r\n- a891489 chore(deps): update github/codeql-action digest to 9b32540 (#2670)\r\n- 8e4518a chore(deps): update plugin com.diffplug.spotless to v8.10.4 (#2614)\r\n- fe95e4d chore(deps): upgrade Gradle to 8.14.6 (#2680)\r\n- 9ce399e chore: shorten fully-qualified type names via OpenRewrite (#2673)\r\n\r\n## 🛠  Build\r\n- 3520521 build: disable CodeRabbit review status message (#2686)\r\n\r\n## 📝 Documentation\r\n- 00e8621 docs: updating examples (#2665)\r\n\r\n---\r\n- b63ca59 [minor] release\r\n- a150c5b deps(mima): Upgrade to MIMA 3.0.0 (#2647)\r\n\r\n\r\n## Contributors\r\nWe'd like to thank the following people for their contributions:\r\nArnab Nandy, GitHub, MD. Mohiuddin ahmed, Max Rydahl Andersen, Mend Renovate, Tamas Cservenak, Werner Fouché, coderabbitai[bot]","mentions_count":1}
