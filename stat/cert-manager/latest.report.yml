{"id":361831037,"author":{"login":"jetstack-release-bot","id":60484088,"node_id":"MDQ6VXNlcjYwNDg0MDg4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBYCWqs4VkRp9","tag_name":"v1.21.1","target_commitish":"24e33194fb39488eff2bbf10c6dc640f407cad44","name":"v1.21.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-29T13:41:59Z","updated_at":"2026-07-29T15:36:11Z","published_at":"2026-07-29T15:36:11Z","assets":[{"id":494156318,"node_id":"RA_kwDOBYCWqs4ddDoe","name":"cert-manager.crds.yaml","label":"","uploader":{"login":"jetstack-release-bot","id":60484088,"node_id":"MDQ6VXNlcjYwNDg0MDg4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-yaml","state":"uploaded","size":997110,"digest":"sha256:a1383be02862dd2802e6810f19dd1f4784550f336ff4eb27788e842302f76977","download_count":560668,"created_at":"2026-07-29T14:45:59Z","updated_at":"2026-07-29T14:46:00Z"},{"id":494156333,"node_id":"RA_kwDOBYCWqs4ddDot","name":"cert-manager.yaml","label":"","uploader":{"login":"jetstack-release-bot","id":60484088,"node_id":"MDQ6VXNlcjYwNDg0MDg4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-yaml","state":"uploaded","size":1034400,"digest":"sha256:5f6a499b8c1857d57f560f536e0dcc830914b45c420899fe7ad0692c8624e408","download_count":445299,"created_at":"2026-07-29T14:46:00Z","updated_at":"2026-07-29T14:46:01Z"}],"body":"cert-manager is the easiest way to automatically manage certificates in Kubernetes and OpenShift clusters.\r\n\r\nv1.21.1 fixes a controller panic for Certificates with `spec.renewal.policy: Disabled`, a regression in 1.21.0 which caused log spam and dropped Secret informer events, Issuers and ClusterIssuers getting stuck at `Ready=False` (`InvalidSolver`) when a referenced ACME DNS-01 solver Secret is created after the Issuer, and the commented Gateway API example in the Helm chart values. It also updates several dependencies to fix reported security vulnerabilities.\r\n\r\nAll users should upgrade.\r\n\r\n## Changes by Kind\r\n\r\n### Bug or Regression\r\n\r\n- Avoid controller panic if a Certificate sets spec.renewal.policy=Disabled (#9038, @sklirg)\r\n- Fix Issuer/ClusterIssuer stuck at Ready=False/InvalidSolver after a missing ACME DNS-01 solver Secret is created (#9083, @SebTardif)\r\n- Fix log spam and dropped Secret informer events for non-cert-manager Secrets, caused by a generics regression introduced in 1.21.0. (#9037, @wallrj-cyberark)\r\n- Fixed the commented Gateway API config example in the Helm chart values to use `gatewayAPI.enabled` instead of the invalid `gatewayAPI.enable`. (#9012, @mateenali66)\r\n\r\n### Other (Cleanup or Flake)\r\n\r\n- Bump `golang.org/x/text` to v0.40.0 to fix a reported security vulnerability (#9039, @wallrj-cyberark)\r\n- Bump `google.golang.org/grpc` to v1.82.1 to fix a reported security vulnerability (#9063)\r\n- Bump `github.com/google/cel-go` to v0.29.0 to fix a reported security vulnerability (#9072)\r\n- Bump `go.opentelemetry.io/otel` to v1.44.0 to fix a reported security vulnerability (#9073)\r\n- Update distroless base images (#9000, #9025)\r\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":3,"eyes":0},"mentions_count":4}
