{"id":422266966,"author":{"login":"cert-manager-bot","id":165075012,"node_id":"U_kgDOCdbYRA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBYCWqs4ZK0hW","tag_name":"v1.21.3","target_commitish":"925c22283de556172d48d96a165dc2fa27f7a6ff","name":"v1.21.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-23T19:51:14Z","updated_at":"2026-10-23T20:47:13Z","published_at":"2026-10-23T20:47:13Z","assets":[{"id":670268626,"node_id":"RA_kwDOBYCWqs4n83zS","name":"cert-manager.crds.yaml","label":"","uploader":{"login":"cert-manager-bot","id":165075012,"node_id":"U_kgDOCdbYRA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-yaml","state":"uploaded","size":997536,"digest":"sha256:29810b2a84c8ee0731a79679ee1dfd7e93cd750eb0244542eec47fa8700f2749","download_count":13676,"created_at":"2026-10-23T20:10:05Z","updated_at":"2026-10-23T20:10:05Z"},{"id":670268685,"node_id":"RA_kwDOBYCWqs4n830N","name":"cert-manager.yaml","label":"","uploader":{"login":"cert-manager-bot","id":165075012,"node_id":"U_kgDOCdbYRA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-yaml","state":"uploaded","size":1034826,"digest":"sha256:c04a51295adda2b1a775146751f973e787190778c7f35180861d9678876e5c74","download_count":9145,"created_at":"2026-10-23T20:10:06Z","updated_at":"2026-10-23T20:10:06Z"}],"body":"cert-manager is the easiest way to automatically manage certificates in Kubernetes and OpenShift clusters.\n\nv1.21.3 removes trust in the compromised eMudhra CA (see [eMudhra Compromise](https://cert-manager.io/docs/trust/trust-manager/#emudhra-compromise)). The updated base images no longer include the \"emSign ECC Root CA - G3\" root certificate. Go 1.26.10 also makes `crypto/x509` reject certificate chains that pass through the compromised intermediates ([CVE-2026-111943](https://pkg.go.dev/vuln/GO-2026-6809)).\n\nIt also fixes an ACME ARI renewal loop, stops the controller copying a private key from a Secret that the Certificate does not own, and quotes the proxy values in the Helm chart. It updates Go and several dependencies to fix reported security vulnerabilities.\n\nAll users should upgrade.\n\n## Changes by Kind\n\n### Bug or Regression\n\n- Added `status.acme.ari.certID` to track issuance of new certs and re-fetch ARI from CA. This fixes a renewal loop where a stale ARI window from the previous certificate triggered repeated re-issuance until the CA rate limit was hit. (#9292, @hjoshi123)\n- Helm chart: quote the `http_proxy`, `https_proxy` and `no_proxy` values when rendering the controller Deployment env vars, so values like `*.example.com` no longer break the manifest. (#9407, @pujitha24)\n- The `requestmanager` and `issuing` controllers now only consume the Secret named by `status.nextPrivateKeySecretName` when it carries the `cert-manager.io/next-private-key` label and is owned by the Certificate, matching the invariant the `keymanager` controller already enforces. Previously a principal able to write the `certificates/status` subresource, but not to read Secrets, could name any Secret in the namespace and have its private key copied into `spec.secretName`. The `keymanager` controller no longer creates the next private key Secret under the name in `status.nextPrivateKeySecretName`. It always uses a generated name, records a `NotOwned` Warning event when the field names a Secret it does not own, and repoints the field at the Secret it owns rather than deleting that Secret when the two disagree. The Secret named by `spec.secretName` is never treated as a next private key Secret, even if `spec.secretTemplate` labels it as one. (#9368, @wallrj)\n\n### Other (Cleanup or Flake)\n\n- Upgrade Go to 1.26.9, fixing CVEs in the crypto/tls, net/http, net/textproto and html/template packages. (#9444, @wallrj-cyberark)\n- Upgrade Go to 1.26.10, fixing a CVE in the crypto/x509 package. (#9501, @wallrj-cyberark)\n- Bump `golang.org/x/net` to v0.60.0 to fix reported security vulnerabilities (#9451)\n- Bump `go.opentelemetry.io/otel/exporters/otlp/otlptrace` and `otlptracegrpc` to v1.45.0 to fix a reported security vulnerability (#9374, #9375)\n- Update distroless base images, removing the compromised \"emSign ECC Root CA - G3\" root certificate (#9351, #9414, #9493, #9495)\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":4}
