efd","download_count":2,"created_at":"2026-09-08T08:41:22Z","updated_at":"2026-09-08T08:41:23Z"},{"id":550171988,"node_id":"RA_kwDORpCz1s4gyvVU","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":183117728,"digest":"sha256:5cf01738e62d4e03075abe1bae6dd81cb4fc708e338032b854fbdd5e49da22dc","download_count":3214,"created_at":"2026-09-08T08:50:42Z","updated_at":"2026-09-08T08:50:46Z"},{"id":550171987,"node_id":"RA_kwDORpCz1s4gyvVT","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":185913,"digest":"sha256:596dfa55da86c87a6899d2bf704b06d4bf18b777511f9b88599d1b257129fc83","download_count":906,"created_at":"2026-09-08T08:50:42Z","updated_at":"2026-09-08T08:50:42Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\nPlease note: It usually takes 48\u201372 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!\n\n## Notable changes\n* Improved Codex chat UI is available when **Structured Chat** is enabled in Experimental settings, with inline file diffs, pane actions, clearer tool output, individual task stops, and structured mobile Codex chat.\n* GitHub Projects Roadmap views now render as timelines; the desktop also adds tab scrolling, narrower tabs, and refreshed notifications.\n* Faster workspace, renderer, editor, terminal, Git, and remote operations, alongside stronger SSH relay and Windows/WSL recovery.\n\n## Product experience\n\n### Workspaces & projects\n* Fix scope of workspace-creation-project tour target by @AmethystLiang in https://github.com/stablyai/orca/pull/18502\n* fix(worktrees): route managed worktree removal by resolved execution host by @nwparker in https://github.com/stablyai/orca/pull/18529\n* fix(worktrees): resolve the execution host at both worktree-create entry points by @nwparker in https://github.com/stablyai/orca/pull/18545\n* Keep the floating workspace above a working native chat pane by @brennanb2025 in https://github.com/stablyai/orca/pull/18692\n* fix(ui): unmount project selector before Add Project handoff by @Jinwoo-H in https://github.com/stablyai/orca/pull/18730\n* fix(sidebar): confirm filter reset before revealing active workspace by @nwparker in https://github.com/stablyai/orca/pull/18708\n* fix(sidebar): stop \u2318\u21e7\u2193 worktree navigation jumping to the first row by @nwparker in https://github.com/stablyai/orca/pull/18804\n* Stop evicted and expired worktree preparations by @nwparker in https://github.com/stablyai/orca/pull/18951\n* Let worktree creation proceed during stale preparation reclamation by @nwparker in https://github.com/stablyai/orca/pull/18967\n* feat(github-projects): render Roadmap project views as a timeline by @NaoyaTatetsu in https://github.com/stablyai/orca/pull/17795\n* fix(runtime): let a scoped worktree listing report the host it could not cover by @nwparker in https://github.com/stablyai/orca/pull/18645\n\n### Editor, browser & UI\n* Revert \"docs: add Ukrainian README translation\" by @OrcaWin in https://github.com/stablyai/orca/pull/18570\n* Revert \"docs: document localization workflow in AGENTS.md\" by @OrcaWin in https://github.com/stablyai/orca/pull/18571\n* Keep attention glyph knockout white when row is selected by @AmethystLiang in https://github.com/stablyai/orca/pull/18679\n* Add tab scrollbar by @AmethystLiang in https://github.com/stablyai/orca/pull/18526\n* Fix Smart create retaining a task checkout hash with Create more by @nwparker in https://github.com/stablyai/orca/pull/18727\n* fix(browser): match loading surfaces to the Orca theme by @Jinwoo-H in https://github.com/stablyai/orca/pull/18738\n* fix(browser): present Electron's own user agent so Cloudflare Turnstile clears by @Jinwoo-H in https://github.com/stablyai/orca/pull/18749\n* Reduce minimum tab width from 88px to 72px by @AmethystLiang in https://github.com/stablyai/orca/pull/18871\n* Fix favicon retention across same-origin navigations by @AmethystLiang in https://github.com/stablyai/orca/pull/18879\n* fix(ci): store vetted refs in a reftable so case-twin branches don't fail the fetch by @nwparker in https://github.com/stablyai/orca/pull/18970\n* Open open new link should not navigate away from current link by @AmethystLiang in https://github.com/stablyai/orca/pull/18873\n* Support updating existing draft releases when regenerating notes by @AmethystLiang in https://github.com/stablyai/orca/pull/19014\n* fix(source-control): stack Retry below the too-many-changes message by @nwparker in https://github.com/stablyai/orca/pull/19037\n* fix: show agent commands once without startup polling by @nwparker in https://github.com/stablyai/orca/pull/18729\n\n### Settings & localization\n* fix(settings): indent the Agent sleep \"Sleep after\" sub-setting by @brennanb2025 in https://github.com/stablyai/orca/pull/18379\n* fix(i18n): extract translateSearchKeyword calls so settings-search keywords reach en.json by @imgusev in https://github.com/stablyai/orca/pull/18040\n* fix(i18n): distinguish Duplicate from Copy in Simplified Chinese by @weibiansanjue in https://github.com/stablyai/orca/pull/18065\n* fix(i18n): localize remaining onboarding UI by @mors119 in https://github.com/stablyai/orca/pull/17992\n* fix(i18n): ship the onboarding integration capability strings in the boot catalog by @Jinwoo-H in https://github.com/stablyai/orca/pull/18539\n* feat(i18n): localize Orca Account settings and navigation to Korean by @hwantage in https://github.com/stablyai/orca/pull/15849\n* feat(i18n): add Frenc