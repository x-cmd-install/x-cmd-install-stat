523268a0c4f9d75a3dd96576016d8f4d40b6dbd9eb161e","download_count":3,"created_at":"2026-11-03T03:23:33Z","updated_at":"2026-11-03T03:23:34Z"},{"id":704135936,"node_id":"RA_kwDORpCz1s4p-EMA","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":208971240,"digest":"sha256:3dd91190662d65f72cf548a1d9d1e5ff7c6331690b4d5fbd5a9c7b8fd2f67c72","download_count":6375,"created_at":"2026-11-03T03:35:10Z","updated_at":"2026-11-03T03:35:18Z"},{"id":704135934,"node_id":"RA_kwDORpCz1s4p-EL-","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":209019,"digest":"sha256:15d683a247fe74a0c89ee9f7a4c54afba7d1fdf08ea341e6780ab051e828a6b3","download_count":1708,"created_at":"2026-11-03T03:35:10Z","updated_at":"2026-11-03T03:35:11Z"}],"body":"## Improved Chat UI, richer phone reviews & more ways to make Orca yours ✨\n\n- 🔄 **Continue after usage limits reset:** An optional setting resumes your chat automatically when its usage limit resets.\n- 📱 **Richer reviews on your phone:** Browse branch commits, jump between files in diffs, and read or add pull-request review comments alongside the code.\n- 🎨 **Make Orca yours:** Discover more themes, preview fonts in their own typefaces, and import Ghostty or Kitty configuration files.\n- 🧩 **More powerful plugins:** Build custom editors, live status items and panels, and connect plugins to agent prompts, launches and workspace actions.\n- 🤝 **Clearer agent activity:** Running workers stay visible after their coordinator finishes, with easier account switching and clearer hand-off cards.\n- ⚡ **Smoother everyday work:** Fewer unnecessary redraws and offscreen animations, more reliable saved replies, and fixes for workspaces, terminals and emulator previews.\n- 💬 **Improved Chat UI:** Choose Chat or CLI for each agent in Chat UI settings, keep drafts when continuing from a terminal, and see your selected permission mode clearly.\n\n## Highlights\n\n- **Chat UI:** Choose Chat or CLI for each agent directly in Chat UI settings. Permission choices stay visible, model and effort controls remain usable while options refresh, and focusing the composer keeps open overlays in place.\n- **Conversation continuity:** Keep unsent text when moving from a terminal into chat, and preserve received replies and tool results while saving is busy. Turn on automatic continuation to resume a chat after its usage limit resets.\n- **Phone source control:** Review each branch commit on its own page, jump between files, fold diff context, and read or add review comments alongside the code. The pull-request tab focuses on what blocks the merge, with clearer next actions and automatic refreshes.\n- **Themes & fonts:** Find GitHub, VS Code and catalog themes in the appearance controls. Preview each font in its own typeface, import Ghostty themes with light/dark pairs, and bring in Kitty configuration files too.\n- **Plugins:** Create custom editors that keep pending edits through saves and reloads, live status bar items, and component panels with a Box layout container. Hooks connect plugins to agent launches, prompts, tool calls, terminal sends and workspace creation; screenshot and testing tools help check the result.\n- **Agents & orchestration:** Running workers remain in the Agents list after their coordinator finishes. Hand-off cards make delegated work easier to follow, and Codex and Claude account switchers are simpler to use.\n- **Remote work & workspaces:** Preview remote HTML outside registered workspaces, find projects in stopped WSL distros after a restart, and see clearer Git progress. Child worktrees stay in the caller’s project, folder roots remain visible, and branch links open the current pull request.\n- **Responsiveness & reliability:** Offscreen animations pause, unrelated settings changes cause fewer diff redraws, and unused editor models are released. Terminal fixes prevent stray escape text, while emulator previews offer clearer connection and startup feedback.\n\n## Compatibility & upgrade notes\n\n- **Chat or CLI per agent:** Chat UI is out of Experimental. Shared launch controls are also available in Settings → Chat UI, so you can choose which surface each agent opens.\n- **Automatic continuation is optional:** Enable it if you want a usage-limited chat to continue automatically after the limit resets.\n- **Phone Send behavior:** The phone follows the paired desktop’s send setting. Update Orca Mobile as well as your desktop or server to get the mobile changes.\n- **Orchestration panel:** The experimental Orchestration panel is disabled while its app-wide lag is addressed. Orchestration commands continue to work.\n\n## Known issues\n\n**Saved chat storage:** Chat history can continue to use more disk space as conversations grow; automatic storage compaction is not included in this release.\n\n**Plugin command replacements:** A plugin replacing a built-in command can still finish after Orca has used the normal command instead, causing the action to happen twice.\n\n---\n\n## Product experience\n\n### Automations\n\n*Choose whether automation setup runs, and avoid launching a wake that was cancelled.*\n\n* Add run and skip setup choices to the automation CLI by @brennanb2025 in https://github.com/stablyai/orca/pull/36543\n* An automation wake skips an entry cleared mid-fire by @nwparker in https://github.com/stablyai/orca/pull/37206\n\n### Native chat\n\n*Choose Chat or CLI from Chat UI settings, keep drafts and replies intact, and use an optional automatic continuation after usage limits reset.*\n\n* Show split shortcut in pane header tooltip by @AmethystLiang in https://github.com/stablyai/orca/pull/36872\n* Show a card in the chat when its agent hands work to another agent by @brennanb2025 in https://github.com/stablyai/orca/pull/36848\n* Move chat readers to the newest saved step after a no-op save by @brennanb2025 in https://github.com/stablyai/orca/pull/37118\n* Keep every received reply and tool result when the journal save queue is busy by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37216\n* Keep OpenCode's default effort visible after a reply by @brennanb2025 in https://github.com/stablyai/orca/pull/37159\n* Keep the queue steer shortcut aligned with displayed messages by @brennanb2025 in https://github.com/stablyai/orca/pull/37166\n* Notification cards lift only for the chat input they would cover by @brennanb2025 in https://github.com/stablyai/orca/pull/37157\n* Chats follow an account switch for worker results too by @brennanb2025 in https://github.com/stablyai/orca/pull/37126\n* Chat UI roll out implementation by @AmethystLiang in https://github.com/stablyai/orca/pull/37222\n* Bound agent journal queue during startup by @AmethystLiang in https://github.com/stablyai/orca/pull/37247\n* Preserve typing during worktree chat handoff by @AmethystLiang in https://github.com/stablyai/orca/pull/37258\n* Continue in Chat UI opens the chat before closing the terminal, and stops a CLI still starting by @brennanb2025 in https://github.com/stablyai/orca/pull/37227\n* Open the goal composer from /goal in Claude and Grok chats by @brennanb2025 in https://github.com/stablyai/orca/pull/37212\n* Explain Hand Off when detected agents share the original usage limit by @brennanb2025 in https://github.com/stablyai/orca/pull/37148\n* Keep chat pickers usable while options recover by @brennanb2025 in https://github.com/stablyai/orca/pull/37168\n* Keep Session History open when a chat workspace was deleted by @brennanb2025 in https://github.com/stablyai/orca/pull/37200\n* Keep readable conversations out of Session History warnings by @brennanb2025 in https://github.com/stablyai/orca/pull/37211\n* Effort, speed and fast controls stay usable while the model list refreshes; dotted versions in id-derived model labels by @brennanb2025 in https://github.com/stablyai/orca/pull/36870\n* Keep Windows and Linux chat switching separate from worktree shortcuts by @brennanb2025 in https://github.com/stablyai/orca/pull/37199\n* Show agent sign-in notices before the first chat message by @brennanb2025 in https://github.com/stablyai/orca/pull/37191\n* Report missing saved conversations once by @brennanb2025 in https://github.com/stablyai/orca/pull/37189\n* Preserve bounded tool evidence in chat handoffs by @AmethystLiang in https://github.com/stablyai/orca/pull/36842\n* Rename Chat settings to Chat UI by @AmethystLiang in https://github.com/stablyai/orca/pull/36613\n* Launch an agent with a first prompt from its setup panel by @brennanb2025 in https://github.com/stablyai/orca/pull/36659\n* Continue chats automatically when a usage limit resets by @brennanb2025 in https://github.com/stablyai/orca/pull/36873\n* Show a terminal's unsent input in the chat composer and replace it on send by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36493\n* Full access Claude chats stop asking for approval by @brennanb2025 in https://github.com/stablyai/orca/pull/37246\n* Continue in Chat UI refuses before closing the terminal when another terminal runs the conversation by @brennanb2025 in https://github.com/stablyai/orca/pull/37397\n* Keep selected Codex permission mode visible by @AmethystLiang in https://github.com/stablyai/orca/pull/37419\n* Keep overlays open when focusing the chat composer by @AmethystLiang in https://github.com/stablyai/orca/pull/37403\n* Add shared launch controls to Chat UI settings by @brennanb2025 in https://github.com/stablyai/orca/pull/37607\n\n### Agents, integrations & orchestration\n\n*Keep workers visible after their coordinator finishes, switch accounts more clearly, and see the selected permission and effort choices.*\n\n* Say kept-open workers stay open, and hide no-action attention in worker-list by @Jinwoo-H in https://github.com/stablyai/orca/pull/36963\n* Use common link actions in the Agent Dashboard by @brennanb2025 in https://github.com/stablyai/orca/pull/36662\n* Show the retry command when worker_done times out on a frozen Orca by @Jinwoo-H in https://github.com/stablyai/orca/pull/37170\n* Keep running workers in the Agents list after their coordinator finishes by @brennanb2025 in https://github.com/stablyai/orca/pull/37219\n* Keep chat account view when location saving fails by @brennanb2025 in https://github.com/stablyai/orca/pull/37175\n* Keep Fast preferences independent of routing availability by @brennanb2025 in https://github.com/stablyai/orca/pull/37194\n* Keep Antigravity built-in skill files out of repositories by @brennanb2025 in https://github.com/stablyai/orca/pull/37167\n* Simplify and improve Codex and Claude account switchers by @AmethystLiang in https://github.com/stablyai/orca/pull/37255\n* Match OSC 7501 spec length limits and progress parsing by @nwparker in https://github.com/stablyai/orca/pull/37267\n* Show a GitLab MR's pipeline result even when it has no jobs by @brennanb2025 in https://github.com/stablyai/orca/pull/37177\n* Record a Claude terminal's process even when Orca saw Claude before its first hook by @brennanb2025 in https://github.com/stablyai/orca/pull/36825\n* Disable the lagging experimental orchestration panel by @brennanb2025 in https://github.com/stablyai/orca/pull/37527\n\n### SSH, managed servers & remote\n\n*Keep WSL projects and hosts discoverable across restarts, with clearer stopped-distro messages and safer server startup.*\n\n* Preview remote HTML outside registered workspaces by @guangyu-reflexio in https://github.com/stablyai/orca/pull/36791\n* Route hosted review operations to the owning host by @AmethystLiang in https://github.com/stablyai/orca/pull/36003\n* The Codex quota poll gates the distro it probes, not the default by @nwparker in https://github.com/stablyai/orca/pull/37043\n* Name the stopped distro, not its raw hold code, wherever a held terminal is shown by @nwparker in https://github.com/stablyai/orca/pull/37380\n* Land on the workspace view after a move's window reload by @nwparker in https://github.com/stablyai/orca/pull/37376\n* Offer the existing host when adding a folder from a distro that already runs as one by @nwparker in https://github.com/stablyai/orca/pull/37377\n* Say why to move projects in the WSL move dialog by @nwparker in https://github.com/stablyai/orca/pull/37390\n* Remove a freshly installed server that fails its start check by @nwparker in https://github.com/stablyai/orca/pull/37388\n* Keep the e2e fake WSL connector out of release builds by @nwparker in https://github.com/stablyai/orca/pull/37378\n* Show a penguin icon for WSL host rows and the stopped-distro notice by @nwparker in https://github.com/stablyai/orca/pull/37389\n* A stopped distro still lists all its projects after a restart by @nwparker in https://github.com/stablyai/orca/pull/37396\n\n### Phone\n\n*Review branch commits and pull requests with richer diffs, code comments and clearer next actions, and keep navigation and sending consistent with the desktop.*\n\n* Diff screen with jump to file, folded context and Stage/Viewed · next file by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36998\n* Stop clearing phone alerts that were never sent by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37095\n* Commits lists only this branch, and each commit opens its own page by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37050\n* GitHub review threads, viewed sync and line comments on the diff screen by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37073\n* Tapping a file on a commit opens it in the diff screen by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37113\n* One next-step bar under both Source Control tabs by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37104\n* Rebuild the pull request tab around what blocks the merge by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36999\n* PR tab refreshes itself, review threads show their code, bots get Ask agent to fix by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37023\n* Show the folder icon when a project image fails to load by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37202\n* Keep the image viewer's close button out of the iPhone Duo status column by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37203\n* Changes tab rows lead with the file name, discard moves to a swipe by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37214\n* One bottom action on the PR tab, and conflicts said once by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37231\n* Outline every text field at 3:1 with a focus ring, and drop the composer shadow by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37221\n* Keep Resolve and its feedback after the conflicts box went away by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37234\n* Give Tasks and Automations their own sections on Home by @brennanb2025 in https://github.com/stablyai/orca/pull/37218\n* Keep the keyboard open when a tab tap opens its details card by @brennanb2025 in https://github.com/stablyai/orca/pull/36866\n* Phone Automations keeps every automation it can read when a newer desktop sends unknown values by @brennanb2025 in https://github.com/stablyai/orca/pull/37169\n* Make phone Send follow the paired desktop setting by @brennanb2025 in https://github.com/stablyai/orca/pull/37315\n* Back from a session lands on its host's session list by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36956\n* Paint the chat transcript and tab strip scrollers opaque by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36905\n* Open each agent row's own tab from the workspace list by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37458\n\n### Workspaces, sidebar & tabs\n\n*Keep projects, tabs and task lists in the right place, with clearer Git progress and more dependable pull-request links.*\n\n* Cap tab widths with intrinsic CSS sizing by @AmethystLiang in https://github.com/stablyai/orca/pull/37131\n* Make the empty omnibox caret thicker and faster by @AmethystLiang in https://github.com/stablyai/orca/pull/36961\n* Keep child-worktree creation in the caller’s project by @brennanb2025 in https://github.com/stablyai/orca/pull/35787\n* Clarify Git operation status across workspaces by @AmethystLiang in https://github.com/stablyai/orca/pull/37093\n* Prevent activity previews over row controls by @AmethystLiang in https://github.com/stablyai/orca/pull/37154\n* Refresh sidebar activity when a native chat tab arrives after its status by @brennanb2025 in https://github.com/stablyai/orca/pull/37151\n* Compact issue & task rows in workspace hovercard by @nwparker in https://github.com/stablyai/orca/pull/37262\n* Keep the host pill outlined on the selected workspace card by @nwparker in https://github.com/stablyai/orca/pull/37294\n* Keep GitHub task assignees and rows current after dialog edits by @brennanb2025 in https://github.com/stablyai/orca/pull/34245\n* Open ordinary directories as folder projects by @brennanb2025 in https://github.com/stablyai/orca/pull/37232\n* Show draft and restricted GitHub Project items by @brennanb2025 in https://github.com/stablyai/orca/pull/37224\n* Continue Fix checks and project actions through setup confirmation by @brennanb2025 in https://github.com/stablyai/orca/pull/36539\n* Tasks source summary, repo link and Filters row follow the list's actual source by @brennanb2025 in https://github.com/stablyai/orca/pull/37226\n* A catalog answer sent before an add no longer drops the project that add made by @nwparker in https://github.com/stablyai/orca/pull/37384\n* Round project image icons on desktop to match mobile by @tianlrz in https://github.com/stablyai/orca/pull/37383\n* Keep folder project roots visible when hiding the default branch by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37444\n* Link a branch's open PR instead of a newer closed one by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37452\n\n### Editor, files & Markdown\n\n*Keep rich Markdown steady when returning from Find, show readable Git diffs, and make themes and fonts easier to discover and import.*\n\n* Keep rich Markdown in place when focus returns from Find by @brennanb2025 in https://github.com/stablyai/orca/pull/36781\n* Show encrypted and textconv files as text diffs, not binary by @hrithiksaini99 in https://github.com/stablyai/orca/pull/37105\n* Ship GitHub and VS Code themes, make themes discoverable in Appearance, and offer catalog themes in the pickers by @nwparker in https://github.com/stablyai/orca/pull/36828\n* Keep custom editor documents in step with accepted edits by @nwparker in https://github.com/stablyai/orca/pull/37277\n* Hand over pending custom-editor edits before closing or reloading by @nwparker in https://github.com/stablyai/orca/pull/37278\n* Let a custom editor require the desktop app's isolated frame by @nwparker in https://github.com/stablyai/orca/pull/37298\n* Orca.document.session() for custom editors by @nwparker in https://github.com/stablyai/orca/pull/37285\n* Keep Match Terminal's host pill label at 4.5:1 on its fill by @nwparker in https://github.com/stablyai/orca/pull/37309\n* Plugins: editor.save.before hook (format on save, or refuse the save) by @nwparker in https://github.com/stablyai/orca/pull/37347\n* Merge disk writes into a custom editor's unsaved edits by @nwparker in https://github.com/stablyai/orca/pull/37343\n* Ignored files in the explorer meet 4.5:1 in the built-in themes by @nwparker in https://github.com/stablyai/orca/pull/37355\n* Changed divider colors also paint workspace splits by @nwparker in https://github.com/stablyai/orca/pull/37342\n* List Windows fonts through Chromium instead of PowerShell and surface failures by @nwparker in https://github.com/stablyai/orca/pull/37369\n* Let the Ghostty import read a config file you pick by @nwparker in https://github.com/stablyai/orca/pull/37353\n* Delete imported terminal themes from the theme picker by @nwparker in https://github.com/stablyai/orca/pull/37356\n* Preview each font in its own typeface in font pickers by @Rayyan34 in https://github.com/stablyai/orca/pull/33254\n* Import Ghostty themes, including light/dark pairs, as per-mode terminal themes by @nwparker in https://github.com/stablyai/orca/pull/37368\n* Import Kitty configs through a shared terminal config import pipeline by @nwparker in https://github.com/stablyai/orca/pull/37375\n\n### Browser, skills & feedback\n\n*Open links from streamed pages in new tabs, and give plugins more ways to build editors, panels and agent workflows.*\n\n* Plugin shot --scenario: screenshot a check scenario without touching the live plugin by @nwparker in https://github.com/stablyai/orca/pull/37090\n* Open target=_blank links in Server (streamed) pages as new tabs by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37102\n* Stop the plugin update-review toast crashing the web client by @nwparker in https://github.com/stablyai/orca/pull/37152\n* Never print a catalog release entry that install would reject by @nwparker in https://github.com/stablyai/orca/pull/37264\n* Skip nested packages in dev folders and summarize blocked frame requests by @nwparker in https://github.com/stablyai/orca/pull/37300\n* Status bar items plugins can update live by @nwparker in https://github.com/stablyai/orca/pull/37291\n* Reject declared artifact paths whose case differs from the file by @nwparker in https://github.com/stablyai/orca/pull/37307\n* Hooks that can change or block terminal sends and workspace creation by @nwparker in https://github.com/stablyai/orca/pull/37287\n* Hooks for agent launches and prompts, plus plugin dev hook by @nwparker in https://github.com/stablyai/orca/pull/37295\n* Agent tool-call hooks (Claude Code can block or rewrite) by @nwparker in https://github.com/stablyai/orca/pull/37303\n* Check custom editors and test them with mockEditorHost by @nwparker in https://github.com/stablyai/orca/pull/37293\n* Plugin shot --editor to screenshot and drive custom editors by @nwparker in https://github.com/stablyai/orca/pull/37302\n* Workers can list and open workspaces, create and read terminals, launch agents by @nwparker in https://github.com/stablyai/orca/pull/37312\n* Workers can open files and run built-in actions by @nwparker in https://github.com/stablyai/orca/pull/37323\n* Commands[].replaces lets a mod take over a built-in action by @nwparker in https://github.com/stablyai/orca/pull/37316\n* Make the editor template the rich-editor recipe by @nwparker in https://github.com/stablyai/orca/pull/37349\n* Plugins: Box layout container for components panels (catalog 4) by @nwparker in https://github.com/stablyai/orca/pull/37420\n\n### Performance & reliability\n\n*Reduce unnecessary redraws and offscreen animations, release unused editor models, and improve terminal and emulator recovery.*\n\n* Show serve-sim's camera error instead of no active emulator by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37119\n* Show each device's OS version and disable unavailable simulators in the picker by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37122\n* Preserve iOS helpers when ps output overflows by @Misty-Star in https://github.com/stablyai/orca/pull/34913\n* Detect Android devices when only adb is installed by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37128\n* Type and paste into the Android emulator pane by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37139\n* Show a dead Android preview as Not connected with a working Connect by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37146\n* Report why an Android AVD failed to start instead of timing out after 3 minutes by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37137\n* List only the worktree's attached emulators, iOS and Android by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37127\n* Fix terminal sleep verification during inventory polls by @AmethystLiang in https://github.com/stablyai/orca/pull/37172\n* Stop the single-file diff viewer re-rendering on unrelated settings writes by @nwparker in https://github.com/stablyai/orca/pull/37150\n* Report when Xcode Device Hub blocks iOS simulator input instead of a silent ok by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37140\n* Compute collapsed sub-agent signal states in one pass by @nwparker in https://github.com/stablyai/orca/pull/37229\n* Detect foreground from the physical PTY owner by @brennanb2025 in https://github.com/stablyai/orca/pull/36342\n* Keep the running emulator when the tab reopens instead of switching to an iPhone by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37132\n* Stop agent spinners that are scrolled out of view by @nwparker in https://github.com/stablyai/orca/pull/37153\n* Tint the scrollbar thumb from the terminal foreground so it shows on light themes by @nwparker in https://github.com/stablyai/orca/pull/36583\n* One mode-2031 report per appearance flip, caught up on reconnect by @nwparker in https://github.com/stablyai/orca/pull/37163\n* Pause long-lived status animations offscreen and honor reduced motion by @nwparker in https://github.com/stablyai/orca/pull/37162\n* Stop the client-hosted page position loop when nothing changes by @nwparker in https://github.com/stablyai/orca/pull/37188\n* Release leaked Monaco diff models under tab groups and Changes mode by @OrcaWin in https://github.com/stablyai/orca/pull/37263\n* Bump xterm to 6.1.0-beta.336 and regenerate patches by @nwparker in https://github.com/stablyai/orca/pull/37266\n* Recognize Claude drafts with labelled input boxes and the default hidden cursor by @brennanb2025 in https://github.com/stablyai/orca/pull/37171\n* Keep read-only close errors from blocking agent launch and AppImage CLI setup by @brennanb2025 in https://github.com/stablyai/orca/pull/37155\n* Import the primary font-family from a repeated fallback list by @nwparker in https://github.com/stablyai/orca/pull/37292\n* Stop stray escape tails like \"2C\" printing after returning to a busy pane by @nwparker in https://github.com/stablyai/orca/pull/37269\n\n### Relay service\n\n*Give newly started reserve servers time to come online before treating them as unavailable.*\n\n* Dead-man boot grace for a freshly booted reserve cell by @nwparker in https://github.com/stablyai/orca/pull/37225\n\n### Reverted\n\n*Restore the earlier CI check arrangement.*\n\n* Revert \"ci: full checks on main pushes, changed-file lint on PRs, Slack alert when main breaks (#37282)\" by @nwparker in https://github.com/stablyai/orca/pull/37341\n\n### Tests, CI & maintenance\n\n*Maintain tests, build checks and internal organization; orchestration-panel work remains behind disabled switches and is unavailable in this release.*\n\n* Colocate relay assignment store and tests by @nwparker in https://github.com/stablyai/orca/pull/37098\n* Include cloud in the sparse checkout by @brennanb2025 in https://github.com/stablyai/orca/pull/36715\n* Remove 116 low-value tests by @OrcaWin in https://github.com/stablyai/orca/pull/37106\n* Group app-server transport and lifecycle owners by @nwparker in https://github.com/stablyai/orca/pull/37109\n* Group web bundle transfer owners by @nwparker in https://github.com/stablyai/orca/pull/37124\n* Group history replay and catch-up owners by @nwparker in https://github.com/stablyai/orca/pull/37133\n* Add a Risk section to the PR template by @brennanb2025 in https://github.com/stablyai/orca/pull/37101\n* Remove 462 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37138\n* Read who each agent works with: its m