2199b8b0d2c1ded98ca50e180fbe3056ce661a2709f90e3d","download_count":3,"created_at":"2026-10-05T23:28:29Z","updated_at":"2026-10-05T23:28:30Z"},{"id":613915276,"node_id":"RA_kwDORpCz1s4kl5qM","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":219859696,"digest":"sha256:d618239bc89429abb183b2832cc83d371b01e9b3fa296607f0073566d503a181","download_count":9358,"created_at":"2026-10-05T23:47:52Z","updated_at":"2026-10-05T23:47:58Z"},{"id":613915275,"node_id":"RA_kwDORpCz1s4kl5qL","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":211425,"digest":"sha256:74d8e8f7d8f046c3114f905055ee270a88a89efd02ef8d04e7d234e6d4191fe6","download_count":2734,"created_at":"2026-10-05T23:47:52Z","updated_at":"2026-10-05T23:47:53Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\nRemote Server is an experimental feature and may have bugs. Remote Server 2.0 is coming this week and will eliminate most of them.\n\n## The short version\n\n- **Security fix for Copilot:** When Orca marked a folder as trusted for GitHub Copilot, it could leave `~/.copilot/config.json` readable by other users on the same machine. That file can hold your Copilot login tokens. v1.4.219 and v1.4.220 did this on SSH hosts too, where other people often share the machine. The file is now owner-only after Orca writes to it. A file an older Orca already opened up is fixed the next time Orca adds a new folder to it.\n- **Codex on Windows uses your own `~/.codex`:** Codex in Orca now uses the same folder as Codex outside Orca, as it already did on macOS and Linux. If you only signed in inside Orca, that sign-in is copied over so you stay logged in. Codex may ask again to trust a folder or approve a command, and MCP servers you added only inside Orca need to be added again; a one-time message explains this. Codex terminals that were open before the update keep working on Orca's old folder, keep their Orca-only MCP servers, and no longer show a restart dialog.\n- **Codex workers:** `worker-start` now accepts `max` and `ultra` effort for Codex models Orca doesn't list yet, such as the gpt-6.x models, instead of refusing them.\n- **More agents and accounts:** Qoder conversations appear in session history and search, Orca can launch Qoder CLI China and Qwen Code, and GLM Coding Plans can be linked without ZCode. OpenCode and Devin can keep separate account profiles, Antigravity gets an Accounts card, and Antigravity IDE and 2.0 conversations can continue in a new CLI conversation.\n- **Native chat (experimental):** Workspaces on a paired Orca server open structured chats when chat is your default. OpenCode sessions can use Chat. A Claude subagent waiting on a permission prompt reads as waiting, and chat errors use plain wording without loading flashes or duplicate reports.\n- **Agent status and orchestration:** Codex's \"Implement this plan?\" menu and open agent questions now count as waiting on you, so sent text no longer lands on the menu. OMP 18.4 workers start, and an agent now uses Orca's own `orca` command even when shell startup files put an older global install first.\n- **Files, Markdown and search:** Semicolon-separated CSVs show as columns. Large Markdown previews load faster, Find in them opens faster, and oversized tables are readable. Typing with Find open no longer jumps the caret. Search finds the right files and tells you when it couldn't finish, and file updates recover after SSH reconnects or replaced folders.\n- **Workspaces and notifications:** Desktop notifications can be turned off per machine. A worktree delete that git can't finish stays listed so you can retry, and workspaces in WSL-runtime projects on `C:\\` can be deleted again. Create PR asks your agent to write the PR details on an already pushed branch, and Jira search accepts plain words.\n- **Updates and memory:** On macOS, Update & Restart no longer closes Orca and then waits forever on background Orca servers; Orca tells you what to close and lets you retry. Many fixes let Orca free memory held by closed tabs, previews, phone screens and idle caches.\n\n**Terminals you already had open:** Updating starts a new terminal background service. Terminals open before the update keep running on the previous one. New terminals use the new service and get this release's terminal fixes, including the `orca` command fix above, OpenCode and Devin account profiles, and agent detection and resume for jcode, Qoder CLI China, Qwen Code and Cursor.\n\n## Known issues\n\n**Windows on ARM:** The ARM64 package ships an x64 `orca.exe` command-line tool. Windows 11 on ARM runs it under emulation. Windows 10 on ARM can't run it, so the `orca` command does not work there (#24094).\n\n**OpenCode 2:** If you update from v1.4.219 or earlier, OpenCode 2 panes that were already running may show no status until you restart OpenCode in them. If you downgrade Orca after updating, duplicate OpenCode status plugins are left behind. After `opencode run` exits, its pane can keep showing \"Done\"; a fix is pending in #24472.\n\n**OpenCode workers:** On a busy machine, an OpenCode worker started with `orca orchestration worker-start`, or an OpenCode tab launched with a prompt, can occasionally leave its task sitting unsent in OpenCode's input box. Pressing Enter in that pane sends it. A fix (#25101) is on main and will ship in a later release.\n\n**Codex:** After you upgrade, Codex launches use Orca's managed Codex home until Codex approves Orca's new status hook. A resumed pane that uses `~/.codex` can pause for up to 30 seconds (#23552).\n\n**Claude folder trust:** Folder pre-trust is on by default (Settings \u2192 Agents \u2192 \"Trust the folder when Orca starts an agent\"). On Alpine WSL, Orca can't copy the file permissions it needs, so Claude shows its own trust prompt instead (#23744).\n\n---\n\n## Product experience\n\n### Codex & orchestration\n\n*Codex on Windows now runs on your own `~/.codex` without a restart prompt for terminals you already had open, Codex workers accept max and ultra effort on newer models, and orchestration recognizes Codex's plan menu, open agent questions and OMP 18.4.*\n\n* feat(codex): run Windows Codex on the real ~/.codex by @Jinwoo-H in https://github.com/stablyai/orca/pull/24356\n* fix(codex): keep Orca-only MCP servers when refreshing the retained shared home by @OrcaWin in https://github.com/stablyai/orca/pull/24983\n* feat(codex): tell Windows users once that Codex in Orca now shares ~/.codex by @OrcaWin in https://github.com/stablyai/orca/pull/24916\n* fix(codex): stop prompting a Codex restart when only its home changed by @OrcaWin in https://github.com/stablyai/orca/pull/25421\n* fix(codex): skip the hook trust RPC when Codex's session index is unreadable by @Jinwoo-H in https://github.com/stablyai/orca/pull/24604\n* fix: dismiss Codex account prompt and return focus to terminal by @nwparker in https://github.com/stablyai/orca/pull/24683\n* fix(orchestration): accept max and ultra effort for Codex models Orca does not list yet by @Jinwoo-H in https://github.com/stablyai/orca/pull/25375\n* fix(runtime): read Codex's 'Implement this plan?' menu as blocked by @Jinwoo-H in https://github.com/stablyai/orca/pull/24536\n* fix(runtime): report an open agent question as blocked to tui-idle waits by @Jinwoo-H in https://github.com/stablyai/orca/pull/24533\n* fix(runtime): settle Codex tui-idle waits on its hook done, leaving working rows to the rules by @Jinwoo-H in https://github.com/stablyai/orca/pull/24541\n* fix(runtime): make OMP 18.4 workers ready at the composer and keep stale-title clears display-only by @brennanb2025 in https://github.com/stablyai/orca/pull/24295\n* Wait for OpenCode worker input before the first dispatch by @nwparker in https://github.com/stablyai/orca/pull/24601\n* Resolve explicitly configured command aliases for workers by @nwparker in https://github.com/stablyai/orca/pull/24648\n* feat: live updates for agent state rules by @Jinwoo-H in https://github.com/stablyai/orca/pull/24387\n* Fix legacy worker recovery snapshot timing for rollback safety by @AmethystLiang in https://github.com/stablyai/orca/pull/25413\n* Reuse prepared statements for internal worker checks by @nwparker in https://github.com/stablyai/orca/pull/24573\n* fix(orchestration): avoid loading task descriptions during promotion by @OrcaWin in https://github.com/stablyai/orca/pull/24781\n* fix(codex): release full messages behind completed child previews by @OrcaWin in https://github.com/stablyai/orca/pull/24740\n\n### Native chat\n\n*Structured chats open on the paired Orca server that owns the workspace, a Claude subagent waiting on permission reads as waiting, OpenCode sessions can use Chat, and errors use plain wording without loading flashes.*\n\n* fix(native-chat): the desktop declares structured chat support to paired Orca servers by @brennanb2025 in https://github.com/stablyai/orca/pull/24204\n* feat(native-chat): open structured chats on the paired Orca server that owns the workspace by @brennanb2025 in https://github.com/stablyai/orca/pull/24205\n* feat(native-chat): a Claude subagent waiting on a permission prompt reads as waiting by @brennanb2025 in https://github.com/stablyai/orca/pull/22634\n* Support real OpenCode sessions in native Chat by @nwparker in https://github.com/stablyai/orca/pull/24647\n* Preserve OpenCode reasoning and recorded patches in native history by @nwparker in https://github.com/stablyai/orca/pull/24790\n* fix(native-chat): one ordered journal writer by @brennanb2025 in https://github.com/stablyai/orca/pull/24127\n* fix(native-chat): remove the \"still starting\" notice that flashed on chat launch by @brennanb2025 in https://github.com/stablyai/orca/pull/24564\n* fix(native-chat): no loading flash on open, one report for a failed start, no \"Not reported\" caption by @brennanb2025 in https://github.com/stablyai/orca/pull/24588\n* fix(native-chat): plain wording for chat errors and status rows by @brennanb2025 in https://github.com/stablyai/orca/pull/24594\n* Fix admission of later Claude question rows and real CLI verification by @nwparker in https://github.com/stablyai/orca/pull/25119\n* Classify native chat waiting messages once by @nwparker in https://github.com/stablyai/orca/pull/24771\n* Append subagent handoffs without recopying their message list by @nwparker in https://github.com/stablyai/orca/pull/24672\n* fix(claude): inspect child tool IDs without rebuilding their output by @OrcaWin in https://github.com/stablyai/orca/pull/24707\n* fix(journal): encode only the retained tool-output preview by @OrcaWin in https://github.com/stablyai/orca/pull/24696\n* fix(chat): encode only the retained prefix when streamed output overflows by @OrcaWin in https://github.com/stablyai/orca/pull/24799\n* fix(chat): let idle session readers release retired journal folds by @OrcaWin in https://github.com/stablyai/orca/pull/24842\n\n### Agents, accounts & integrations\n\n*Copilot's settings file stays private, Qoder, Qwen Code and GLM Coding Plans join the supported agents and accounts, OpenCode and Devin can keep separate account profiles, and Antigravity, Cursor, OpenCode and jcode integrations are more reliable.*\n\n* fix(agents): keep ~/.copilot/config.json owner-only when Orca trusts a folder by @brennanb2025 in https://github.com/stablyai/orca/pull/25087\n* Add Qoder session history and search by @nwparker in https://github.com/stablyai/orca/pull/24614\n* Register supervised Qoder China and Qwen Code by @nwparker in https://github.com/stablyai/orca/pull/24616\n* feat(accounts): link standalone GLM Coding Plans by @nwparker in https://github.com/stablyai/orca/pull/24618\n* Add host-owned OpenCode and Devin managed account profiles by @nwparker in https://github.com/stablyai/orca/pull/24636\n* Preserve saved account credentials after enrollment errors by @nwparker in https://github.com/stablyai/orca/pull/25059\n* Remove canonical account directories for uppercase registered IDs by @nwparker in https://github.com/stablyai/orca/pull/25126\n* Keep saved OpenCode Go keys in main-owned storage by @nwparker in https://github.com/stablyai/orca/pull/24615\n* fix(opencode-go): don't fall back to OPENCODE_API_KEY when the credential database is unreadable by @Jinwoo-H in https://github.com/stablyai/orca/pull/24605\n* Read OpenCode Go usage from the selected account by @nwparker in https://github.com/stablyai/orca/pull/24770\n* Add verified native Antigravity Accounts on the owning runtime by @nwparker in https://github.com/stablyai/orca/pull/24691\n* Continue Antigravity IDE and 2.0 history in new CLI conversations by @nwparker in https://github.com/stablyai/orca/pull/24692\n* fix(antigravity): bound Windows hook stdin on the owning runtime by @nwparker in https://github.com/stablyai/orca/pull/24622\n* fix(cursor): resume exact conversation after startup status replay by @nwparker in https://github.com/stablyai/orca/pull/24670\n* fix(cursor): show the primary model pool in compact usage by @nwparker in https://github.com/stablyai/orca/pull/24830\n* fix(opencode): read the binder's session store off the main thread; ship the reader worker in orcad by @Jinwoo-H in https://github.com/stablyai/orca/pull/24638\n* Select OpenCode plugin exports from the execution host version by @nwparker in https://github.com/stablyai/orca/pull/24662\n* fix(opencode): retry timed-out SSH plugin updates by @nwparker in https://github.com/stablyai/orca/pull/24666\n* fix(opencode): submit admitted native startup briefs without overwriting input by @nwparker in https://github.com/stablyai/orca/pull/24762\n* fix(opencode): keep overlay manifest cleanup inside owned directories by @nwparker in https://github.com/stablyai/orca/pull/24763\n* fix(opencode): finish status installation with invalid TUI settings by @nwparker in https://github.com/stablyai/orca/pull/25031\n* fix(opencode): keep shared-session TUI activity with its owning pane by @nwparker in https://github.com/stablyai/orca/pull/24962\n* Pass wrapped OpenCode run prompts as positional messages by @nwparker in https://github.com/stablyai/orca/pull/25001\n* Clean up retired OpenCode configuration copies safely by @nwparker in https://github.com/stablyai/orca/pull/25222\n* fix(jcode): harden Windows hooks and negotiate remote history by @nwparker in https://github.com/stablyai/orca/pull/24998\n* fix(jcode): report missing and outdated managed hooks by @NicholasTing in https://github.com/stablyai/orca/pull/25135\n\n### Terminal\n\n*Agents keep using Orca's own CLI after shell startup, OpenCode receives its editing shortcuts in terminal-first mode, a change to one tab no longer redraws every tab, and closed terminals release their memory.*\n\n* fix(daemon): bump the terminal daemon protocol to v40 by @Jinwoo-H in https://github.com/stablyai/orca/pull/25291\n* Keep Orca CLI first after shell startup by @nwparker in https://github.com/stablyai/orca/pull/25130\n* Let terminal-first mode defer OpenCode editing shortcuts by @nwparker in https://github.com/stablyai/orca/pull/24640\n* perf(tab-bar): a change to one tab no longer re-renders every tab by @AmoabaKelvin in https://github.com/stablyai/orca/pull/24261\n* Reuse terminal buffer cells during readiness scans by @nwparker in https://github.com/stablyai/orca/pull/25161\n* Cancel pending cursor updates when a terminal closes by @nwparker in https://github.com/stablyai/orca/pull/24566\n* fix(terminal): release retired status sources from the agent type cache by @OrcaWin in https://github.com/stablyai/orca/pull/24669\n* fix(terminal): release retired scrollback layouts from status routing by @OrcaWin in https://github.com/stablyai/orca/pull/24686\n* fix(terminal): release closed layouts while reveal frames are paused by @OrcaWin in https://github.com/stablyai/orca/pull/24721\n* fix(terminal): cancel viewport retries when panes close by @OrcaWin in https://github.com/stablyai/orca/pull/24745\n* Cancel terminal preview fit frames when the preview closes by @nwparker in https://github.com/stablyai/orca/pull/24712\n* Release terminal side effects after they have been delivered by @nwparker in https://github.com/stablyai/orca/pull/24548\n* Check daemon idle state without building discarded terminal inventories by @nwparker in https://github.com/stablyai/orca/pull/24749\n\n### SSH & remote hosts\n\n*File updates survive quick SSH reconnects, Git keeps SSH settings and review context, and search keeps working with older Orca servers.*\n\n* fix(files): keep watcher streams across SSH reconnect races by @nwparker in https://github.com/stablyai/orca/pull/24722\n* fix(git): preserve SSH review context and worktree ownership by @nwparker in https://github.com/stablyai/orca/pull/24945\n* fix(search): keep legacy host search and negotiate agent support by @nwparker in https://github.com/stablyai/orca/pull/25009\n* Preserve Windows SSH upload failures unless pwsh is missing by @nwparker in https://github.com/stablyai/orca/pull/25185\n* fix(ssh): keep terminal buffers out of failed workspace sync status by @OrcaWin in https://github.com/stablyai/orca/pull/24833\n* fix(ssh): release response chunks after the sink accepts them by @OrcaWin in https://github.com/stablyai/orca/pull/24719\n* Reuse event byte sizes when relay watchers notify several clients by @nwparker in https://github.com/stablyai/orca/pull/24558\n* Avoid cloning terminal agent owners twice in relay listings by @nwparker in https://github.com/stablyai/orca/pull/24713\n* fix(reconnect): release obsolete app state held by handle-gap watchers by @OrcaWin in https://github.com/stablyai/orca/pull/24815\n\n### Mobile app & paired clients\n\n*The phone stops leaving feeds and screens running after you leave them, uses less memory for pictures, files and terminal catch-up, and the Android APK links point to 0.0.52.*\n\n* fix(mobile): release notification and account streams from the transport by @brennanb2025 in https://github.com/stablyai/orca/pull/23032\n* Release waiting terminal output when a mobile subscription fails to start by @nwparker in https://github.com/stablyai/orca/pull/24547\n* fix(mobile): release callbacks retained by canceled streams by @OrcaWin in https://github.com/stablyai/orca/pull/24625\n* fix(mobile): release file previews after their tabs close by @OrcaWin in https://github.com/stablyai/orca/pull/24655\n* fix(clipboard): decode uploaded images without joining all chunks by @OrcaWin in https://github.com/stablyai/orca/pull/24653\n* fix(mobile): reduce base64 allocations for encrypted text frames by @OrcaWin in https://github.com/stablyai/orca/pull/24665\n* fix(mobile): merge terminal backlogs without rescanning growing strings by @OrcaWin in https://github.com/stablyai/orca/pull/24680\n* fix(files): release expired mobile path inventories while idle by @OrcaWin in https://github.com/stablyai/orca/pull/24694\n* fix(mobile): avoid backtick match arrays when editing Markdown by @OrcaWin in https://github.com/stablyai/orca/pull/24778\n* Delete unreturned clipboard cache files after a failed write by @nwparker in https://github.com/stablyai/orca/pull/24599\n* Avoid restarting error timers on closed mobile relay links by @nwparker in https://github.com/stablyai/orca/pull/24567\n* Avoid restarting error timers after mobile relay pairing closes by @nwparker in https://github.com/stablyai/orca/pull/24568\n* Skip new mobile toast work after feedback owner cleanup by @nwparker in https://github.com/stablyai/orca/pull/24759\n* Skip new legacy file inventories after mobile search cleanup by @nwparker in https://github.com/stablyai/orca/pull/24792\n* Skip unused image-size calculations in mobile web browser requests by @nwparker in https://github.com/stablyai/orca/pull/24941\n* Reuse the ancestor path while building mobile agent rows by @nwparker in https://github.com/stablyai/orca/pull/24539\n* Check each project repository once while filtering mobile cards by @nwparker in https://github.com/stablyai/orca/pull/24540\n* docs: update Android APK links to 0.0.52 by @AmethystLiang in https://github.com/stablyai/orca/pull/25107\n\n### Browser, notebooks & computer use\n\n*Browser tabs, screencasts, uploads and document previews hold less memory, and closing a notebook cancels a kernel that was still starting.*\n\n* fix(browser): avoid a redundant copy of live screencast images by @OrcaWin in https://github.com/stablyai/orca/pull/24851\n* fix(browser): avoid a redundant copy of document preview bytes by @OrcaWin in https://github.com/stablyai/orca/pull/24861\n* fix(browser): release upload buffers after native staging by @OrcaWin in https://github.com/stablyai/orca/pull/24869\n* fix(browser): release obsolete state during close replay by @OrcaWin in https://github.com/stablyai/orca/pull/24892\n* Stop copying every retained browser page before attachment by @nwparker in https://github.com/stablyai/orca/pull/24553\n* Skip renderer callbacks after their request has ended by @nwparker in https://github.com/stablyai/orca/pull/24631\n* Skip late browser grab toasts after their surface closes by @nwparker in https://github.com/stablyai/orca/pull/24727\n* fix(notebook): cancel kernel starts when the notebook closes by @OrcaWin in https://github.com/stablyai/orca/pull/24858\n* Avoid irrelevant scroll-action searches in Mac snapshots by @nwparker in https://github.com/stablyai/orca/pull/24731\n\n### Workspaces, sidebar & notifications\n\n*Desktop notifications can be turned off per machine, a worktree delete that git can't finish stays listed so you can retry, WSL-runtime projects on `C:\\` can be deleted, and child workspaces get a shortcut.*\n\n* Turn desktop notifications on or off per machine by @brennanb2025 in https://github.com/stablyai/orca/pull/24518\n* fix(worktrees): a worktree delete git fails partway stays listed and can be retried by @brennanb2025 in https://github.com/stablyai/orca/pull/23952\n* fix(filesystem): deleting a workspace no longer fails as 'outside allowed directories' in WSL-runtime C:\\ projects by @brennanb2025 in https://github.com/stablyai/orca/pull/24242\n* fix(worktrees): list a folder once when git reports it twice by @AmoabaKelvin in https://github.com/stablyai/orca/pull/24357\n* feat(sidebar): bindable shortcut to show or hide child workspaces by @mmarabel in https://github.com/stablyai/orca/pull/24165\n* Read project activity once while sorting the sidebar by @nwparker in https://github.com/stablyai/orca/pull/24549\n* Avoid Resource Manager renders when terminal removal leaves its inventory unchanged by @nwparker in https://github.com/stablyai/orca/pull/24806\n* fix(activity): release unrelated editor state during the Undo window by @OrcaWin in https://github.com/stablyai/orca/pull/24838\n* Prepare the Activity search query once per filtered list by @nwparker in https://github.com/stablyai/orca/pull/24701\n* Skip discarded Kanban pruning for an empty selection by @nwparker in https://github.com/stablyai/orca/pull/24782\n* chore(worktree): include create timing and spare outcome in the workspace create events by @brennanb2025 in https://github.com/stablyai/orca/pull/24483\n\n### Editor, files & source control\n\n*Semicolon CSVs show as columns, large Markdown previews and Find stay fast, search reports complete results, file watching recovers after folders are replaced, and Create PR writes PR details on an already pushed branch.*\n\n* feat(csv-viewer): detect semicolon-separated CSVs by @kbsali in https://github.com/stablyai/orca/pull/19894\n* Keep large Markdown previews responsive by @nwparker in https://github.com/stablyai/orca/pull/24880\n* Speed up large Markdown Find and render oversized tables by @nwparker in https://github.com/stablyai/orca/pull/24948\n* Remove Markdown parser patch and simplify preview processing by @nwparker in https://github.com/stablyai/orca/pull/24919\n* Fix Markdown Find editing without moving the caret or viewport by @nwparker in https://github.com/stablyai/orca/pull/25144\n* fix(markdown): reduce Find memory for ordinary text by @OrcaWin in https://github.com/stablyai/orca/pull/24635\n* Cancel review animations and timers when the Markdown preview closes by @nwparker in https://github.com/stablyai/orca/pull/24644\n* fix(editor): expire saved-file snapshots while the editor is idle by @OrcaWin in https://github.com/stablyai/orca/pull/24657\n* fix(editor): avoid newline match arrays when saving LF Markdown by @OrcaWin in https://github.com/stablyai/orca/pull/24795\n* fix(editor): release Markdown selection listeners after close by @OrcaWin in https://github.com/stablyai/orca/pull/24875\n* Reduce Markdown discovery output by filtering filenames at the source by @nwparker in https://github.com/stablyai/orca/pull/25148\n* Fix ripgrep result completeness, filename handling, and search errors by @nwparker in https://github.com/stablyai/orca/pull/25156\n* Avoid duplicate ripgrep scans for full file inventories by @nwparker in https://github.com/stablyai/orca/pull/23490\n* Avoid rebuilding visible file paths for single-row selection by @nwparker in https://github.com/stablyai/orca/pull/24743\n* fix(quick-open): release expired legacy file inventories while idle by @OrcaWin in https://github.com/stablyai/orca/pull/24805\n* fix(files): replace watcher subscriptions after native failure by @nwparker in https://github.com/stablyai/orca/pull/24723\n* fix(files): retry failed shallow directory watch replacement by @nwparker in https://github.com/stablyai/orca/pull/24724\n* fix(git): prevent duplicate watcher reconciliation pollers by @nwparker in https://github.com/stablyai/orca/pull/24725\n* fix(plugins): restore development watchers after folder replacement by @nwparker in https://github.com/stablyai/orca/pull/24726\n* fix(watchers): preserve directory identities when checking replacements by @nwparker in https://github.com/stablyai/orca/pull/24888\n* fix(cli): orca file open opens PDFs and other binaries like the File Explorer by @AmethystLiang in https://github.com/stablyai/orca/pull/24445\n* fix(source-control): generate PR details before Create PR on a ready branch by @AmoabaKelvin in https://github.com/stablyai/orca/pull/24215\n* fix(source-control): default Codex to GPT-5.6 Terra low by @BeamNawapat in https://github.com/stablyai/orca/pull/24495\n* fix(source-control): generate clean OpenCode messages locally and over SSH by @nwparker in https://github.com/stablyai/orca/pull/24613\n* fix(git): reduce queries and preserve data across execution hosts by @nwparker in https://github.com/stablyai/orca/pull/24602\n* perf(git): reuse queries and stop canceled catalog scans by @nwparker in https://github.com/stablyai/orca/pull/24923\n* Skip diff analysis after a result has been discarded by @nwparker in https://github.com/stablyai/orca/pull/24711\n* Cancel plugin retry timers when their fetch is replaced by @nwparker in https://github.com/stablyai/orca/pull/24700\n\n### Tasks, issues & automations\n\n*Jira search accepts plain words, fork issues stay in the repository you picked, unchanged work-item refreshes no longer make the app recheck everything, and closed Jira pages and automation rows release their memory.*\n\n* fix(jira): search plain text when task search input isn't JQL by @AmoabaKelvin in https://github.com/stablyai/orca/pull/22900\n* Keep fork issue details and edits in the selected repository by @nwparker in https://github.com/stablyai/orca/pull/24729\n* Skip store notifications when refreshed work items are unchanged by @nwparker in https://github.com/stablyai/orca/pull/24530\n* fix(jira): expire cached attachment images while idle by @OrcaWin in https://github.com/stablyai/orca/pull/24678\n* fix(jira): discard detail replies after closing an issue by @OrcaWin in https://github.com/stablyai/orca/pull/24835\n* fix(automations): release unused run output from dashboard rows by @OrcaWin in https://github.com/stablyai/orca/pull/24847\n\n### Session history\n\n*Saved agent conversations load and search with less memory, and a large history cache no longer pauses Orca.*\n\n* Bound AI Vault cache loading and keep atomic saves responsive by @nwparker in https://github.com/stablyai/orca/pull/24789\n* Reuse prepared reads while searching saved agent conversations by @nwparker in https://github.com/stablyai/orca/pull/24535\n* fix(ai-vault): bound transcript text before joining message blocks by @OrcaWin in https://github.com/stablyai/orca/pull/24659\n* fix(ai-vault): release expired host results while idle by @OrcaWin in https://github.com/stablyai/orca/pull/24766\n* Discard completed AI Vault cancellation IDs in the relay worker by @nwparker in https://github.com/stablyai/orca/pull/24820\n* Decode complete transcript lines without copying their bytes by @nwparker in https://github.com/stablyai/orca/pull/24546\n* Decode single-piece saved-session tails without copying them by @nwparker in https://github.com/stablyai/orca/pull/24632\n* refactor(ai-vault): delete the unused session-scanner worker thread by @Jinwoo-H in https://github.com/stablyai/orca/pull/24607\n\n### Updates & reliability\n\n*On macOS, Update & Restart no longer closes Orca and waits forever on background Orca servers, and idle updater and speech timers are released.*\n\n* fix(updater): keep macOS Orca open when background instances block updates by @OrcaWin in https://github.com/stablyai/orca/pull/24952\n* Release completed updater setup timers and callbacks by @nwparker in https://github.com/stablyai/orca/pull/24920\n* Clear unused speech worker timers after errors and exit by @nwparker in https://github.com/stablyai/orca/pull/24924\n\n### Relay service\n\n*Server-side cleanup for Orca's relay and push services.*\n\n* Release relay handshake timers when a host connection leaves by @nwparker in https://github.com/stablyai/orca/pull/24554\n* Reuse the parsed notification when leasing a push delivery by @nwparker in https://github.com/stablyai/orca/pull/24645\n\n### Tests, CI & maintenance\n\n*Release builds publish for patch releases cut from older code, CI spends less time on setup and waiting, and several flaky tests were fixed.*\n\n* ci(release): skip the orcad template for tags that predate it by @Jinwoo-H in https://github.com/stablyai/orca/pull/24872\n* ci(release): publish after a skipped orcad template by @Jinwoo-H in https://github.com/stablyai/orca/pull/24882\n* Move ARM Mac CI to macOS 15 before runner retirement by @nwparker in https://github.com/stablyai/orca/pull/24760\n* Allow cold node-pty setup on Windows ARM CI by @nwparker in https://github.com/stablyai/orca/pull/24997\n* Overlap ARM SSH setup and independent observation waits by @nwparker in https://github.com/stablyai/orca/pull/24714\n* Skip dependency installation for known headless build inputs by @nwparker in https://github.com/stablyai/orca/pull/24716\n* Avoid rescanning shared chunks in the plain Node build guard by @nwparker in https://github.com/stablyai/orca/pull/24717\n* Reuse discovered mobile chunks during static traversal by @nwparker in https://github.com/stablyai/orca/pull/24774\n* fix(ci): prevent concurrent pnpm refresh during mobile typechecks by @nwparker in https://github.com/stablyai/orca/pull/24776\n* Select the latest stable release tag in one pass by @nwparker in https://github.com/stablyai/orca/pull/24786\n* Reuse pnpm verification records in Alpine CI by @nwparker in https://github.com/stablyai/orca/pull/24817\n* Reduce scheduled CI cache warming to every six hours by @nwparker in https://github.com/stablyai/orca/pull/24881\n* Skip slower Windows root package-store restores in CI by @nwparker in https://github.com/stablyai/orca/pull/24885\n* Skip slower root package-store restores in Linux PR jobs by @nwparker in https://github.com/stablyai/orca/pull/24896\n* Skip slower root package-store restores in macOS PR jobs by @nwparker in https://github.com/stablyai/orca/pull/24908\n* Avoid repeated pnpm archive downloads in cache producers by @nwparker in https://github.com/stablyai/orca/pull/24927\n* Use the measured pnpm lookup policy automatically in hosted root CI by @nwparker in https://github.com/stablyai/orca/pull/24951\n* Reuse the headless detector compiler without installing full dependencies by @nwparker in https://github.com/stablyai/orca/pull/24895\n* Stop mocked renderer imports from qualifying headless CI by @nwparker in https://github.com/stablyai/orca/pull/24902\n* Overlap independent Linux headless runtime builds by @nwparker in https://github.com/stablyai/orca/pull/24910\n* Reuse faster Electron preparation for current Terminal Perf runs by @nwparker in https://github.com/stablyai/orca/pull/24968\n* Share PR preflight setup to reduce runner demand by @nwparker in https://github.com/stablyai/orca/pull/25150\n* Verify shared preflight selection and record full unit timings by @nwparker in https://github.com/stablyai/orca/pull/25239\n* Collect test-selection evidence when full unit tests fail by @nwparker in https://github.com/stablyai/orca/pull/24955\n* Cut CI time in store, Git contention and readiness tests by @nwparker in https://github.com/stablyai/orca/pull/25147\n* Reduce terminal test overhead while preserving full parity checks by @nwparker in https://github.com/stablyai/orca/pull/25151\n* Avoid repeated runtime imports and recovery fixture seeding in CI by @nwparker in https://github.com/stablyai/orca/pull/25155\n* Reduce unit test waits, byte comparisons and import overhead by @nwparker in https://github.com/stablyai/orca/pull/25187\n* Index discovered test files once durin