ca934d7e052d2d016a99d779d4ce8586866672c673b17579b919a7","download_count":11,"created_at":"2026-10-17T06:17:51Z","updated_at":"2026-10-17T06:17:52Z"},{"id":649825372,"node_id":"RA_kwDORpCz1s4mu4xc","name":"orca-v1.4.229-complete-changelog.md","label":"","uploader":{"login":"nwparker","id":4138956,"node_id":"MDQ6VXNlcjQxMzg5NTY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":203784,"digest":"sha256:b837dd5b5afe7859a1a2175c03461f160f67dc8bd719c364b7cf7b46a95518cd","download_count":35,"created_at":"2026-10-17T07:07:57Z","updated_at":"2026-10-17T07:07:57Z"},{"id":649798956,"node_id":"RA_kwDORpCz1s4muyUs","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":227899392,"digest":"sha256:fb759053a56ad019a2d52882abaf9c797e2adddf6f217a36f0b64505446d007d","download_count":27040,"created_at":"2026-10-17T06:53:01Z","updated_at":"2026-10-17T06:53:06Z"},{"id":649798958,"node_id":"RA_kwDORpCz1s4muyUu","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":218499,"digest":"sha256:6f256d0c349f42b7c2a3e6e51ece68304b0c05b037c87eed7d308e097a59997f","download_count":7101,"created_at":"2026-10-17T06:53:01Z","updated_at":"2026-10-17T06:53:01Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\n## The short version\n\n- **Native chat (experimental):** Review turn-by-turn edits inline, expand diagrams to pan and zoom, share chat visuals with a click, and see Claude goals and Codex context usage. Keyboard answers, an unread divider and Copy on Select make long conversations easier to navigate.\n- **Shared skills:** Shared-skill installation now supports 20 additional agents, with broader WSL discovery and the right install locations for tools such as Kiro, Qoder and CodeBuddy.\n- **Phone:** Workspace filters, grouping and sorting now follow the desktop\u2019s shared choices. Long-press for linked issues and notes, work with server workspaces and browser pages, or continue a supported chat in a new terminal conversation.\n- **SSH and remote terminals:** Reconnect fixes preserve split panes, paste order and managed-server project groups. Sleeping agents resume their conversations, and removing one machine\u2019s project leaves its same-path counterpart alone.\n- **Workspaces and everyday polish:** Open a website from Cmd/Ctrl+J, watch checkout progress as a worktree is created, and clean up workspaces with an explicit confirmation before stopping running agents.\n- **Jira planning:** Switch between issue lists and boards, focus on the current sprint, reuse saved JQL and Jira favourites, and start workspaces from desktop or phone. Your agents can read and update Jira tickets through the Orca CLI, too.\n\n## Known issues\n\n**Native chat (experimental):** Features that depend on a remote host are available when that host supports them. Update the host alongside Orca to get the latest capabilities.\n\n**The `orca` command on SSH hosts:** Existing hosts keep their saved Orca CLI control preference. To let agents there manage workspaces or control the desktop browser, turn on **Allow this host\u2019s orca CLI to control Orca** under Settings \u2192 SSH Hosts \u2192 edit the host \u2192 Advanced Connection.\n\n---\n\n## Product experience\n\n### Automations\n\n*Create and edit automations on SSH projects with older paired servers, and keep scheduled work attached to the right host.*\n\n* Stop offering Blank Terminal in agent-only pickers (automations) by @Jinwoo-H in https://github.com/stablyai/orca/pull/26961\n* Start server-run automations' agents through the launch executor by @brennanb2025 in https://github.com/stablyai/orca/pull/26820\n* Display valid multi-day automation schedules by @nwparker in https://github.com/stablyai/orca/pull/26850\n* Automation runs, CLI tabs and folder-workspace browser tabs follow the owner by @OrcaWin in https://github.com/stablyai/orca/pull/27246\n* Find folder-workspace targets on the Automations page by @OrcaWin in https://github.com/stablyai/orca/pull/27416\n* Stop offering Resume workspace for runs that never started an agent (STA-10103) by @Jinwoo-H in https://github.com/stablyai/orca/pull/28179\n* Format the jobs-file limit consistently by @nwparker in https://github.com/stablyai/orca/pull/28220\n* Remove Hermes automation support by @AmethystLiang in https://github.com/stablyai/orca/pull/28519\n* Sleep a finished run's terminal instead of closing it by @AmoabaKelvin in https://github.com/stablyai/orca/pull/28838\n* Run Now matches the managed server's setup after an SSH host moves by @nwparker in https://github.com/stablyai/orca/pull/29394\n* Page automations runs so a paired server's history fits its replies by @nwparker in https://github.com/stablyai/orca/pull/29446\n* Automations create/edit for an SSH project work against an older paired server by @nwparker in https://github.com/stablyai/orca/pull/29924\n\n### Native chat (experimental)\n\n*Review edits inline, expand diagrams, share visuals, follow Claude goals and Codex context usage, and keep long conversations easier to read and continue.*\n\n* Re-land Claude per-account folders (#24434, #26405) with the upgrade and proxy fixes by @Jinwoo-H in https://github.com/stablyai/orca/pull/26801\n* Save a new chat's first message during create by @brennanb2025 in https://github.com/stablyai/orca/pull/26332\n* A new Pi chat names the model it will run on its first frame by @brennanb2025 in https://github.com/stablyai/orca/pull/26821\n* Start orchestration workers as native chats for every agent that has native chat by @brennanb2025 in https://github.com/stablyai/orca/pull/26776\n* Highlight code blocks and shell commands by @AmoabaKelvin in https://github.com/stablyai/orca/pull/26343\n* Open a chat visual in its own tab instead of the sidebar by @brennanb2025 in https://github.com/stablyai/orca/pull/26728\n* Keep Chat UI users with a Terminal default on the terminal, with a chat mode switch in the upgrade tip by @brennanb2025 in https://github.com/stablyai/orca/pull/26915\n* Let a Codex chat stop a command it left running in the background by @brennanb2025 in https://github.com/stablyai/orca/pull/26780\n* Add \"Copy sign-in link instead\" for Claude accounts (STA-9912) by @Jinwoo-H in https://github.com/stablyai/orca/pull/26990\n* Every new-chat request opens its own chat by @brennanb2025 in https://github.com/stablyai/orca/pull/26782\n* Native chat: identify a paired device by its device id, never its credential by @brennanb2025 in https://github.com/stablyai/orca/pull/26777\n* Match model picker type to the options menu by @AmoabaKelvin in https://github.com/stablyai/orca/pull/26349\n* Every agent reports its learned default model once, when a chat starts by @brennanb2025 in https://github.com/stablyai/orca/pull/26982\n* Floating-workspace chats of every native-chat agent keep links in the folder they started in by @brennanb2025 in https://github.com/stablyai/orca/pull/26981\n* Keep select-all and copy in a chat from reaching the terminal underneath by @AmoabaKelvin in https://github.com/stablyai/orca/pull/26831\n* Accept sends through their own receipt by @brennanb2025 in https://github.com/stablyai/orca/pull/26672\n* Edit a queued message in place, even while a question is open by @brennanb2025 in https://github.com/stablyai/orca/pull/26886\n* Settle a reply cut off by a server restart by @brennanb2025 in https://github.com/stablyai/orca/pull/26460\n* Hide agent message controls while the turn runs by @AmoabaKelvin in https://github.com/stablyai/orca/pull/26404\n* Drop the redundant 'Waiting for your answer' line from queued cards by @brennanb2025 in https://github.com/stablyai/orca/pull/27073\n* Show attached files as filename pills in the composer by @AmoabaKelvin in https://github.com/stablyai/orca/pull/26409\n* Offer Codex Ultrafast as a speed choice by @brennanb2025 in https://github.com/stablyai/orca/pull/26962\n* Let a Codex chat stop a sub-agent from the background-tasks strip by @brennanb2025 in https://github.com/stablyai/orca/pull/27026\n* Lazy WSL tier for Claude, Grok and omp lookup by id by @OrcaWin in https://github.com/stablyai/orca/pull/27082\n* Resume a WSL session only in its own namespace, with a Linux Pi path by @OrcaWin in https://github.com/stablyai/orca/pull/27092\n* Retire the pending image bubble when the CLI records its path as text by @OrcaWin in https://github.com/stablyai/orca/pull/27095\n* Retire a first send's echo in transcript time, not this client's by @OrcaWin in https://github.com/stablyai/orca/pull/27099\n* Reduce memory used to count Codex usage and avoid partial totals by @nwparker in https://github.com/stablyai/orca/pull/26966\n* Update Claude usage without rereading the whole conversation by @nwparker in https://github.com/stablyai/orca/pull/26967\n* Give each animation a reduced-motion state by @AmoabaKelvin in https://github.com/stablyai/orca/pull/26276\n* Let a Grok chat list and stop the commands it left running in the background by @brennanb2025 in https://github.com/stablyai/orca/pull/27022\n* Preserve running subagent rows in long chats by @brennanb2025 in https://github.com/stablyai/orca/pull/26798\n* Honor inactive Claude account retry deadlines by @nwparker in https://github.com/stablyai/orca/pull/26936\n* Read ZCode conversations in their recorded order by @nwparker in https://github.com/stablyai/orca/pull/27142\n* Register a short PostCompact hook command by @vampik33 in https://github.com/stablyai/orca/pull/25211\n* 