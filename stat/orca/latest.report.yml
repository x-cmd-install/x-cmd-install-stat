f670631c422245aa404d0a77925202d3c740251c9fa21a95","download_count":5,"created_at":"2026-09-29T19:21:04Z","updated_at":"2026-09-29T19:21:05Z"},{"id":599056000,"node_id":"RA_kwDORpCz1s4jtN6A","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":202117848,"digest":"sha256:669fbc3bc4cebc231345b4e47d32cf3e206018691273001d54ea307521c2eabe","download_count":12106,"created_at":"2026-09-29T19:40:04Z","updated_at":"2026-09-29T19:40:09Z"},{"id":599056001,"node_id":"RA_kwDORpCz1s4jtN6B","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":206526,"digest":"sha256:3a8518cb1b2a2263997c0c7b3fc75a1125ad5f0f434dfd72ef2d992f98b7b133","download_count":3432,"created_at":"2026-09-29T19:40:05Z","updated_at":"2026-09-29T19:40:05Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\nThis patch is built from the September 27 daily build plus fixes picked from main. Pull requests that landed on main after that are not in this build.\n\n## The short version\n\n**Codex:** Codex workers start again on current Codex (0.158). Orca had been waiting for a welcome-screen label that Codex 0.158 removed, so every Codex worker timed out; Orca now recognizes Codex's empty input box instead. Starting a Codex worker with a model or reasoning effort no longer hangs either.\n\n**Codex tabs run on their own:** On Codex 0.157 and newer, every Codex tab in Orca shared one background server started by the first tab, so status and results were credited to the wrong tab and closing the first tab dropped all the others. Each Codex tab in an Orca terminal now runs its own server, so closing one no longer drops the others. New terminals opened after updating get this; terminals already open keep the old behavior until reopened. To keep the shared server, add `export ORCA_CODEX_ISOLATE=0` to your shell startup file. The trade-off of the default: Codex \"Run in background\", `codex agents`, and opening a session from the Codex desktop app or an IDE won't see sessions started in Orca, and many open tabs use more memory.\n\n**Status bar & workspace UI:** The status bar fits small screens: extra agents fold into a \"+N\" badge before status labels shrink to icons. Compact agent rows show unread emphasis, and activity threads from floating terminal agents open the right pane.\n\n**Remote & SSH:** SSH hosts that ask for a verification code or other multi-factor prompt are supported, remote file access follows repository ownership, and interrupted remote installs recover without deleting files still in use.\n\n**Editor & browser:** Solidity, Typst, and Twig files are highlighted, Markdown source survives rich-text edits, and browser tools fold into a menu on narrow screens.\n\n**Reliability:** Orchestration workers whose terminal can no longer be found are stopped properly instead of piling up, and many background tasks clean up after themselves when a window reloads or a request is cancelled.\n\n---\n\n## Product experience\n\n### Codex & orchestration\n\n*Codex workers start again on Codex 0.158, each Codex tab in an Orca terminal runs on its own, and stopping a worker reliably ends its process.*\n\n* fix(terminal): run Codex in Orca terminals without the shared background server by @Jinwoo-H in https://github.com/stablyai/orca/pull/23900\n* fix(daemon): roll Codex no-daemon shell launch into a fresh v37 daemon by @Jinwoo-H in https://github.com/stablyai/orca/pull/23907\n* fix(runtime): settle a quiet Codex composer as ready on every version by @Jinwoo-H in https://github.com/stablyai/orca/pull/23765\n* fix(runtime): read Codex readiness from the live screen by @Jinwoo-H in https://github.com/stablyai/orca/pull/23475\n* fix: await queued Codex trust preflight completion by @nwparker in https://github.com/stablyai/orca/pull/23148\n* fix(orchestration): reland process-incarnation reap for stale worker terminal handles by @brennanb2025 in https://github.com/stablyai/orca/pull/23583\n* fix(orchestration): deliver dispatch mail and replies to the current lead by @nwparker in https://github.com/stablyai/orca/pull/23325\n\n### Other agents & native chat\n\n*OpenCode, Hermes, Kimi, Grok, and Claude integrations handle edge cases more safely, and long questions in native chat can be expanded.*\n\n* fix: dispose OpenCode 2 hooks after prompt setup and cleanup failures by @nwparker in https://github.com/stablyai/orca/pull/23209\n* Respect disabled OpenCode variants and refresh WSL settings safely by @nwparker in https://github.com/stablyai/orca/pull/23328\n* Preserve Hermes YAML configuration during hook installation by @nwparker in https://github.com/stablyai/orca/pull/23324\n* fix(kimi): don't crash if config.toml is deleted mid-write by @nwparker in https://github.com/stablyai/orca/pull/23293\n* fix(grok): show zero usage for an explicit zero quota by @nwparker in https://github.com/stablyai/orca/pull/23321\n* fix(native-chat): let the \"Asked\" row unfold a long question by @brennanb2025 in https://github.com/stablyai/orca/pull/22941\n* fix(claude): release permission prompt abort listeners by @OrcaWin in https://github.com/stablyai/orca/pull/23195\n* perf(native-chat): release obsolete transcript viewers after reloads by @nwparker in https://github.com/stablyai/orca/pull/22982\n\n### Status bar, sidebar & activity\n\n*The status bar fits small screens, compact agent rows show unread state, and activity threads open floating terminal agents.*\n\n* fix(status-bar): fold agents into +N before status labels go icon-only by @AmethystLiang in https://github.com/stablyai/orca/pull/23689\n* fix(sidebar): show unread emphasis in compact agent rows by @nwparker in https://github.com/stablyai/orca/pull/23327\n* fix(sidebar): preserve list focus when selecting workspaces by @nwparker in https://github.com/stablyai/orca/pull/23320\n* feat(activity): reveal threads in floating terminal workspace by @AmethystLiang in https://github.com/stablyai/orca/pull/23239\n\n### Terminal\n\n*Git Bash is detected by its install layout, Japanese file links stay intact, and Windows terminals are more robust.*\n\n* fix(terminal): recognize a Git Bash launcher by its install layout by @nwparker in https://github.com/stablyai/orca/pull/23308\n* fix(terminal): retain Japanese middle dots and tildes in file links by @nwparker in https://github.com/stablyai/orca/pull/23322\n* fix(windows): preserve relocated terminals and native process scans by @OrcaWin in https://github.com/stablyai/orca/pull/22872\n* fix(windows): synchronize native terminal table lifetime by @OrcaWin in https://github.com/stablyai/orca/pull/23257\n* perf: cap shared-path scans and synchronize Windows PTY access by @nwparker in https://github.com/stablyai/orca/pull/23194\n* perf: preserve terminal previews across unrelated settings updates by @nwparker in https://github.com/stablyai/orca/pull/23099\n\n### Editor, search & files\n\n*Solidity, Typst, and Twig get syntax highlighting, Markdown source survives rich edits, and grouped search filters keep their commas.*\n\n* fix(editor): highlight Solidity files by @anajuliabit in https://github.com/stablyai/orca/pull/20928\n* feat(editor): highlight Typst files and diffs by @nwparker in https://github.com/stablyai/orca/pull/23323\n* fix(editor): highlight Twig templates in files and diffs by @nwparker in https://github.com/stablyai/orca/pull/23366\n* fix(editor): recognize all bundled Monaco language associations by @nwparker in https://github.com/stablyai/orca/pull/23371\n* fix(editor): preserve Markdown source across rich edits by @nwparker in https://github.com/stablyai/orca/pull/23280\n* fix(search): keep commas inside grouped file filters by @nwparker in https://github.com/stablyai/orca/pull/23319\n* fix: remove PDF export temp files after setup failures by @nwparker in https://github.com/stablyai/orca/pull/23130\n* perf: avoid rescanning partial notebook output frames by @nwparker in https://github.com/stablyai/orca/pull/23138\n\n### Browser\n\n*Browser tools fold into a menu on narrow screens, and addresses with explicit ports open correctly.*\n\n* Implement responsive toolbar overflow with tool folding by @AmethystLiang in https://github.com/stablyai/orca/pull/23265\n* fix(browser): open domains with explicit ports by @nwparker in https://github.com/stablyai/orca/pull/23318\n\n### Remote, SSH & WSL\n\n*SSH supports multi-factor (keyboard-interactive) sign-in, remote file access respects repository ownership, and remote installs recover cleanly.*\n\n* feat(ssh): support keyboard-interactive authentication (MFA) by @Chihen-Tai in https://github.com/stablyai/orca/pull/15588\n* Keep SSH terminals parked after their own workspace updates by @OrcaWin in https://github.com/stablyai/orca/pull/23193\n* fix: exclude canonical SSH roots from local file access by @nwparker in https://github.com/stablyai/orca/pull/23196\n* fix: honor canonical SSH ownership in worktree listings by @nwparker in https://github.com/stablyai/orca/pull/23198\n* fix: bind filesystem root grants to their repository owner by @nwparker in https://github.com/stablyai/orca/pull/23206\n* fix(ssh): preserve interrupted installation outcomes through retries by @OrcaWin in https://github.com/stablyai/orca/pull/23273\n* fix(ssh): recover abandoned caches without deleting live dependencies by @OrcaWin in https://github.com/stablyai/orca/pull/23281\n* fix(ssh): name the missing unzip when Bun archive extraction cannot start by @nwparker in https://github.com/stablyai/orca/pull/23298\n* Avoid store updates for unchanged SSH repository catalogs by @nwparker in https://github.com/stablyai/orca/pull/23034\n* fix(worktrees): clear orphan cleanup on BusyBox WSL distros by @nwparker in https://github.com/stablyai/orca/pull/23296\n* fix(projects): enrich git remote identity for runtime-addressed repo rows by @nwparker in https://github.com/stablyai/orca/pull/23300\n* fix(persistence): report a discarded cross-host repo update instead of failing silently by @nwparker in https://github.com/stablyai/orca/pull/23379\n\n### Source control & code review\n\n*Pull request and review lookups keep the newest result, and Gitea lookups refresh correctly.*\n\n* fix: refresh strict Gitea lookups and synchronize Windows PTY access by @nwparker in https://github.com/stablyai/orca/pull/23162\n* perf(github): coalesce stronger refreshes after pending requests by @nwparker in https://github.com/stablyai/orca/pull/22970\n* fix: preserve newer pull request lookup ownership by @nwparker in https://github.com/stablyai/orca/pull/23119\n* fix: preserve newer hosted review lookup ownership by @nwparker in https://github.com/stablyai/orca/pull/23126\n* fix: observe linked-issue failures during review generation by @nwparker in https://github.com/stablyai/orca/pull/23166\n* fix: retire stale review lookups after cache invalidation by @nwparker in https://github.com/stablyai/orca/pull/23182\n\n### Reliability & performance\n\n*Orca releases abandoned work, listeners, and streams after reloads or cancellations, and skips redundant scans and updates.*\n\n* perf(emulator): stop obsolete video streams after renderer reloads by @nwparker in https://github.com/stablyai/orca/pull/22967\n* perf(mobile): coalesce stalled connection log persistence by @nwparker in https://github.com/stablyai/orca/pull/22973\n* Cancel abandoned relay search work by @nwparker in https://github.com/stablyai/orca/pull/22997\n* perf(push): keep retention sweeps from overlapping without slowing the drain by @nwparker in https://github.com/stablyai/orca/pull/23001\n* perf(relay): release rejected first-frame connections [trade-off] by @nwparker in https://github.com/stablyai/orca/pull/23011\n* perf(relay): release canceled AI Vault startup requests by @nwparker in https://github.com/stablyai/orca/pull/23027\n* perf(history): coalesce tombstone directory rescans by @nwparker in https://github.com/stablyai/orca/pull/23031\n* Scope relay capacity checks to the requested cell by @nwparker in https://github.com/stablyai/orca/pull/23036\n* perf: avoid repeatedly encoding retained VM recipe output by @nwparker in https://github.com/stablyai/orca/pull/23048\n* fix: close abandoned PDF.js development asset streams by @nwparker in https://github.com/stablyai/orca/pull/23054\n* fix: release file watches when their renderer document ends by @nwparker in https://github.com/stablyai/orca/pull/23055\n* fix: close abandoned static web asset readers by @nwparker in https://github.com/stablyai/orca/pull/23062\n* fix: stop stale runtime event work after renderer cleanup by @nwparker in https://github.com/stablyai/orca/pull/23066\n* fix: release dictation session listeners when speech workers exit by @nwparker in https://github.com/stablyai/orca/pull/23077\n* perf: skip unused Linux accessibility child enumeration by @nwparker in https://github.com/stablyai/orca/pull/23085\n* perf: skip store notifications for unchanged project and folder catalogs by @nwparker in https://github.com/stablyai/orca/pull/23104\n* perf: skip macOS DNS probes for unrelated errors by @nwparker in https://github.com/stablyai/orca/pull/23121\n* perf: share pending plugin translation startup requests by @nwparker in https://github.com/stablyai/orca/pull/23133\n* perf: bound wildcard segment work in nested repository scans by @nwparker in https://github.com/stablyai/orca/pull/23149\n* fix(relay): release capacity wait abort listeners by @OrcaWin in https://github.com/stablyai/orca/pull/23188\n* fix(daemon): release terminal attach cancellation listeners by @OrcaWin in https://github.com/stablyai/orca/pull/23191\n\n### Internationalization (i18n)\n\n*Diff note wording is clearer.*\n\n* fix(i18n): clarify the recipient of diff notes by @OrcaWin in https://github.com/stablyai/orca/pull/23256\n\n### Tests, CI & maintenance\n\n*CI runs faster and more in parallel, formatting and packaging are tidied up, and a short-lived mouse Back/Forward shortcut change was reverted.*\n\n* Support mouse Back/Forward buttons in shortcuts by @nwparker in https://github.com/stablyai/orca/pull/23287\n* Revert \"Support mouse Back/Forward buttons in shortcuts\" by @AmethystLiang in https://github.com/stablyai/orca/pull/23350\n* fix(design-system): replace hand-rolled diff draft-card shadow with shadow-xs by @nwparker in https://github.com/stablyai/orca/pull/23307\n* fix(packaging): exclude root notes from app files by @nwparker in https://github.com/stablyai/orca/pull/23326\n* fix(homebrew): remove deprecated URL verification parameter by @nwparker in https://github.com/stablyai/orca/pull/23365\n* style: settle oxfmt 0.70 drift and stop formatting vendored licences by @nwparker in https://github.com/stablyai/orca/pull/23377\n* test: target writer timeouts and diagnose Bun startup stalls by @OrcaWin in https://github.com/stablyai/orca/pull/23267\n* fix(ci): preserve focused Playwright file selection by @OrcaWin in https://github.com/stablyai/orca/pull/23270\n* ci: shard SSH tests, remove duplicate runs, and warm Windows caches by @OrcaWin in https://github.com/stablyai/orca/pull/23286\n* ci: reuse test fixtures, native builds, and package images by @OrcaWin in https://github.com/stablyai/orca/pull/23291\n* ci: scope orcad smoke and parallelize Linux packages by @OrcaWin in https://github.com/stablyai/orca/pull/23314\n* ci: reuse mobile web route analysis and skip unrelated mobile tests by @OrcaWin in https://github.com/stablyai/orca/pull/23329\n* Reuse mobile recording compilation and refresh desktop CI timings by @OrcaWin in https://github.com/stablyai/orca/pull/23343\n* Run independent CI checks with native parallel Actions steps by @OrcaWin in https://github.com/stablyai/orca/pull/23351\n* ci: overlap package and security preparation and share localization parsing by @OrcaWin in https://github.com/stablyai/orca/pull/23364\n* ci: overlap shell, localization, and mobile route preparation by @OrcaWin in https://github.com/stablyai/orca/pull/23368\n* ci: use ARM unit runners, overlap web builds, and reuse verifier fixtures by @OrcaWin in https://github.com/stablyai/orca/pull/23376\n* ci: build independent Electron targets together for E2E by @OrcaWin in https://github.com/stablyai/orca/pull/23378\n* ci: compile the E2E CLI once for all consumers by @OrcaWin in https://github.com/stablyai/orca/pull/23384\n\n## New Contributors\n* @anajuliabit made their first contribution in https://github.com/stablyai/orca/pull/20928\n* @Chihen-Tai made their first contribution in https://github.com/stablyai/orca/pull/15588\n\n---\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.216...v1.4.217\n","reactions":{"total_count":7,"+1":1,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":7}
