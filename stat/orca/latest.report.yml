6bb68a5b79011838a7dac5dff98e1f8b56d2","download_count":1,"created_at":"2026-10-26T03:28:51Z","updated_at":"2026-10-26T03:28:52Z"},{"id":676919013,"node_id":"RA_kwDORpCz1s4oWPbl","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":202070480,"digest":"sha256:a63bbf18fa51d51805eb6581b766f8c0dd3a3418c62eb1f5094125173ab6b643","download_count":1873,"created_at":"2026-10-26T03:46:44Z","updated_at":"2026-10-26T03:46:50Z"},{"id":676919008,"node_id":"RA_kwDORpCz1s4oWPbg","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":202689,"digest":"sha256:fb3dd0447448ce198daa4deba8dcebbfe7a0af419dbcf46b5b48d1583efd76d0","download_count":509,"created_at":"2026-10-26T03:46:44Z","updated_at":"2026-10-26T03:46:45Z"}],"body":"## Chats and a browser that behave the way you expect 🧭\n\nThis release makes chats follow your agent settings, brings Chrome-style tools to the built-in browser, and helps SSH connections and managed servers recover. You’ll also find a chat font setting, live agent browsing, and steadier Hermes, Kimi, Kiro and Windows terminals.\n\n## The short version\n\n- **Chats that follow your settings:** New chats use each agent’s permission from Settings → Agents, renamed chats keep their names in Session History, and a chat won’t write a conversation a terminal is still running.\n- **A browser closer to Chrome:** Dock DevTools inside the pane, mute tabs playing sound, see a link’s URL on hover, and use Orca shortcuts and mouse back/forward inside pages.\n- **Watch agents browse:** A cursor and badge show where an agent is clicking or typing, chat jumps you to the page, and links from terminals and chat open beside their source.\n- **SSH with fewer dead ends:** Saved port forwards return after a restart and explain failures, certificate-only hosts connect through your system `ssh`, and managed servers update without closing terminals.\n- **Agents that start and resume reliably:** Hermes and Kimi panes resume after a restart, Kiro reports status on its V3 engine, and keys typed while an agent starts are kept as a draft.\n- **Polish where it counts:** Pick a font for chat, zoom with Cmd/Ctrl + `+` on non-US keyboards, open cloud-only files from macOS terminals, and get steadier Windows terminals and pasting.\n\n**Phone & web updates:** Phones no longer drop pieces of terminal output, and chat renames and each chat’s permission mode now show there. Session tabs also keep Working and Needs You for Windows agents that never set a title.\n\n## Compatibility & upgrade notes\n\n- **Fresh terminal host:** New terminals start on a fresh terminal host so this release’s terminal fixes apply. Terminals already open before you update keep running, and stay attached, on the previous host until you close them.\n- **Chat permissions:** Settings → Chat no longer has its own permission dropdown; set it per agent in Settings → Agents. Existing chats keep their saved permission, and a chat’s own permission menu changes only that chat.\n- **Conversations open in a terminal:** If a terminal might still be writing a conversation, its chat won’t send and asks you to quit the agent there or close that terminal. Closing that terminal lets the next send go through.\n- **Managed SSH servers:** **Update anyway** keeps running terminals going through the update. The offer to resume chats after a restart needs a server already running this release.\n- **OpenCode model picks:** OpenCode 2.0.14, 2.0.15, 2.0.17 and 2.0.18 leave the first message unsent when a model is picked, so Orca refuses model picks on those versions.\n\n---\n\n## Product experience\n\n### Native chat (experimental)\n\n*Chats share your agent settings, keep their names, and stay out of conversations a terminal is still writing.*\n\n* Start new chats with each agent’s permission setting from Settings → Agents, the same as terminals by @brennanb2025 in https://github.com/stablyai/orca/pull/32334\n* Never start a chat’s agent on a conversation a terminal is still writing, and keep restored panes from resuming a conversation an open chat holds by @brennanb2025 in https://github.com/stablyai/orca/pull/30930\n* Save chat renames as the chat’s name, so Session History, phones and other windows keep showing them after the tab closes by @brennanb2025 in https://github.com/stablyai/orca/pull/31602\n* Show turns made outside an OpenCode or Grok chat when the chat continues by @brennanb2025 in https://github.com/stablyai/orca/pull/31616\n* Offer to resume interrupted chats after a paired or managed server restarts or updates by @brennanb2025 in https://github.com/stablyai/orca/pull/28978\n* Add a custom font family setting for chat, with a preview and installed-font suggestions by @AmethystLiang in https://github.com/stablyai/orca/pull/33687\n* Retry a failed agent start before rejecting your message by @brennanb2025 in https://github.com/stablyai/orca/pull/33045\n* Keep goal text whose delivery is uncertain, and send each distinct goal control to the host by @brennanb2025 in https://github.com/stablyai/orca/pull/33022\n* Keep an idle Claude chat idle when a background task reports progress by @innocarpe in https://github.com/stablyai/orca/pull/22879\n* Fold Claude thinking-only transcript records into the reasoning section by @nwparker in https://github.com/stablyai/orca/pull/33344\n* Honour Claude Code’s rejected ANTHROPIC_API_KEY setting in chats by @nwparker in https://github.com/stablyai/orca/pull/33346\n* Keep long Pi replies with lots of thinking from stopping early by @nwparker in https://github.com/stablyai/orca/pull/33293\n* Reconnect an OMP chat when OMP drops its session by @nwparker in https://github.com/stablyai/orca/pull/33359\n* Keep a remembered effort for OMP models other than the running one in new chats by @nwparker in https://github.com/stablyai/orca/pull/33646\n* Stop refusing new Pi chats when a remembered effort is missing from the saved model list by @nwparker in https://github.com/stablyai/orca/pull/33637\n* Read WSL Claude transcripts through linked folders, so chats from Orca-managed Claude accounts load on mobile by @Kooooojun in https://github.com/stablyai/orca/pull/33172\n* Keep a resting Codex chat’s skills check from blocking worktree removal on Windows by @nwparker in https://github.com/stablyai/orca/pull/33569\n\n### Browser\n\n*Chrome-style DevTools, tab audio and link previews, plus a live view of agents using the browser.*\n\n* Dock DevTools inside the browser pane, with dock side, resizing and pop-out by @AmoabaKelvin in https://github.com/stablyai/orca/pull/33003\n* Show a speaker icon on browser tabs playing sound, with tab mute by @AmoabaKelvin in https://github.com/stablyai/orca/pull/32981\n* Show a hovered or focused link’s URL in a bubble at the bottom of the page by @AmoabaKelvin in https://github.com/stablyai/orca/pull/32978\n* Make Orca shortcuts, split focus and mouse back/forward buttons work inside web pages by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31859\n* Open browser links beside their source by @AmethystLiang in https://github.com/stablyai/orca/pull/32907\n* Show agent browsing live, with a jump to the page from chat by @AmoabaKelvin in https://github.com/stablyai/orca/pull/33075\n* Ask before sites use the local network by @AmoabaKelvin in https://github.com/stablyai/orca/pull/33399\n* Show bigger new tab tiles and a roomier workspace card by @AmoabaKelvin in https://github.com/stablyai/orca/pull/33178\n\n### Agent launch, status & accounts\n\n*Agents start on the first try, report the right status, resume in the right place, and keep the right account.*\n\n* Keep the permission pill inside Arguments and share the Permissions menu by @brennanb2025 in https://github.com/stablyai/orca/pull/32971\n* Skip Codex’s startup update prompt when Orca launches Codex by @nwparker in https://github.com/stablyai/orca/pull/33355\n* Keep keys typed into a starting agent pane as an unsubmitted draft by @nwparker in https://github.com/stablyai/orca/pull/33315\n* Press Enter again while a Windows Codex composer is still reading a long task by @nwparker in https://github.com/stablyai/orca/pull/33295\n* Press Enter again while DeepSeek Harness’s launchpad still holds the prompt by @nwparker in https://github.com/stablyai/orca/pull/33316\n* Make flagged `--command` agent launches wait for the agent’s screen to be ready by @nwparker in https://github.com/stablyai/orca/pull/33466\n* Deliver Devin launch prompts on its command line instead of typing them after start by @nwparker in https://github.com/stablyai/orca/pull/33349\n* Start a Claude worker on its composer when its terminal title is turned off by @nwparker in https://github.com/stablyai/orca/pull/33384\n* Pre-trust the folder for Kimi Code so its trust menu does not swallow the prompt by @nwparker in https://github.com/stablyai/orca/pull/33411\n* Refuse model picks on OpenCode 2.x releases that drop the startup prompt by @nwparker in https://github.com/stablyai/orca/pull/33436\n* Recognize Qwen Code launched through Node on Windows by @nwparker in https://github.com/stablyai/orca/pull/33461\n* Keep Codex from reading as idle while its plan menu is showing after its Stop hook by @nwparker in https://github.com/stablyai/orca/pull/33335\n* Let a settled screen clear a blocked-prompt state left over after the agent erased its dialog by @nwparker in https://github.com/stablyai/orca/pull/33485\n* Show Needs You while a Claude MCP elicitation dialog is open by @nwparker in https://github.com/stablyai/orca/pull/33517\n* Let a pane’s own agent reclaim its status from a nested agent’s hooks by @nwparker in https://github.com/stablyai/orca/pull/33572\n* Keep agent status on a terminal moved into a new tab after a restart by @nwparker in https://github.com/stablyai/orca/pull/33601\n* Stop an Antigravity subagent finishing from ending its parent’s turn by @nwparker in https://github.com/stablyai/orca/pull/33645\n* Keep Pi in-process subagent sessions from taking over the lead pane by @nwparker in https://github.com/stablyai/orca/pull/33595\n* Follow Claude sessions continued into a daemon job by @nwparker in https://github.com/stablyai/orca/pull/33605\n* Keep launch flags on a woken agent’s record so a restart restores them by @nwparker in https://github.com/stablyai/orca/pull/33523\n* Resume an agent from the folder it ran in, not the pane’s starting folder by @nwparker in https://github.com/stablyai/orca/pull/33527\n* Resume Hermes panes after a restart, on the pane’s own session by @nwparker in https://github.com/stablyai/orca/pull/33514\n* Keep a finished Hermes pane done when its background memory review calls tools by @nwparker in https://github.com/stablyai/orca/pull/33418\n* Use the Windows %LOCALAPPDATA%\\hermes home for Hermes hooks and session history by @nwparker in https://github.com/stablyai/orca/pull/33413\n* Recognize Hermes readiness and its installed launcher by @nwparker in https://github.com/stablyai/orca/pull/33606\n* Keep a resumed Kimi pane resumable across the next Orca restart by @nwparker in https://github.com/stablyai/orca/pull/33489\n* Report Kiro status on Kiro’s V3 engine, including the built-in default agent by @nwparker in https://github.com/stablyai/orca/pull/33660\n* Run the native Windows Claude hook for profile paths with spaces by @nwparker in https://github.com/stablyai/orca/pull/33364\n* Exit skipped Windows hook replays without waiting on input by @nwparker in https://github.com/stablyai/orca/pull/33470\n* Let the WSL hook relay run on the Orca server’s bundled Node by @nwparker in https://github.com/stablyai/orca/pull/33089\n* Show DeepSeek Harness rows for WSL terminals on Windows by @denchu-unagi in https://github.com/stablyai/orca/pull/31205\n* Start Claude Agent Teams teammates on headless Linux servers by @nwparker in https://github.com/stablyai/orca/pull/33389\n* Capture Git Bash agent environments with native Windows paths by @nwparker in https://github.com/stablyai/orca/pull/33619\n* Write folder trust into the managed Codex account home the launch uses by @nwparker in https://github.com/stablyai/orca/pull/33377\n* Apply global ~/.codex/rules in Orca-managed Codex homes by @nwparker in https://github.com/stablyai/orca/pull/33493\n* Migrate resumed Windows Codex sessions whose transcript path has a \\\\?\\ prefix by @nwparker in https://github.com/stablyai/orca/pull/33558\n* Index a new WSL Codex account home before bringing history into it by @nwparker in https://github.com/stablyai/orca/pull/33630\n* Read the sign-in link Codex prints on stderr when adding a Codex account by @nwparker in https://github.com/stablyai/orca/pull/29811\n* Keep the old Codex login until re-authentication finishes, and relabel swapped account homes by @nwparker in https://github.com/stablyai/orca/pull/33568\n* Keep the selected Antigravity account after agy refreshes its token by @nwparker in https://github.com/stablyai/orca/pull/33656\n* Resume Claude in the folder it was started in after an account-switch restart by @nwparker in https://github.com/stablyai/orca/pull/33659\n* Leave your node or python program alone after a Claude account switch by @adifsgaid in https://github.com/stablyai/orca/pull/30328\n* Share folders Claude created in an account folder before its first setup by @nwparker in https://github.com/stablyai/orca/pull/33479\n* Show an idle Claude account whose access token lapsed as waiting for Claude, not signed out by @nwparker in https://github.com/stablyai/orca/pull/33542\n* Show a Claude Enterprise seat’s monthly spend cap when it has no 5-hour or weekly window by @nwparker in https://github.com/stablyai/orca/pull/33655\n* Count fork-copied Codex token events once in usage by @nwparker in https://github.com/stablyai/orca/pull/33478\n* Show Codex usage while Codex’s session index is stuck rebuilding by @nwparker in https://github.com/stablyai/orca/pull/33636\n* Keep Codex automation and agent-created threads in Agent Session History by @nwparker in https://github.com/stablyai/orca/pull/33477\n* List Claude sessions stored under a CLAUDE_CONFIG_DIR set only in your login shell by @nwparker in https://github.com/stablyai/orca/pull/33506\n\n### Orchestration\n\n*Mail reaches workers when they can take it, and worker starts fail clearly instead of stalling.*\n\n* Let a new `orca orchestration check --wait` start while an old one is still waiting by @Jinwoo-H in https://github.com/stablyai/orca/pull/33013\n* Wake an agent for new mail even while it still holds an unacknowledged batch by @Jinwoo-H in https://github.com/stablyai/orca/pull/33639\n* Point idle headless terminals at their mail by @nwparker in https://github.com/stablyai/orca/pull/33258\n* Submit mail pointers to Cursor CLI instead of leaving them in the composer by @nwparker in https://github.com/stablyai/orca/pull/33347\n* Hold mail pointers while the agent shows an open dialog by @nwparker in https://github.com/stablyai/orca/pull/33366\n* Hold mail pointers while the composer has an unsent draft by @nwparker in https://github.com/stablyai/orca/pull/33429\n* Press Enter again when DeepSeek Harness’s launchpad refuses a worker’s first task by @nwparker in https://github.com/stablyai/orca/pull/33499\n* Start Antigravity workers in a terminal when its chat runtime isn’t installed by @nwparker in https://github.com/stablyai/orca/pull/33520\n* Fail a Codex worker’s dispatch when its session can’t reconnect by @nwparker in https://github.com/stablyai/orca/pull/33543\n* Let worker-start reuse an idle native-install Claude terminal by @nwparker in https://github.com/stablyai/orca/pull/33544\n* Paste CLI prompts as one block for every recognized agent, not just Claude and Codex by @nwparker in https://github.com/stablyai/orca/pull/33571\n\n### Terminals\n\n*A fresh terminal host, steadier Windows terminals, and history and folders that survive sleep, restarts and phones.*\n\n* Start new terminals on a fresh terminal host so this release’s terminal fixes apply by @Jinwoo-H in https://github.com/stablyai/orca/pull/33705\n* Respawn a Windows ConPTY pane that started without keyboard input by @nwparker in https://github.com/stablyai/orca/pull/33423\n* Keep a Windows terminal’s output-relay write error from stopping the terminal host by @nwparker in https://github.com/stablyai/orca/pull/33391\n* Send Ctrl+Enter to Claude Code on Windows in the form it understands by @nwparker in https://github.com/stablyai/orca/pull/33473\n* Preserve OpenCode Ctrl+Enter on Windows by @Pr1p in https://github.com/stablyai/orca/pull/33149\n* Keep Windows Codex multiline Ctrl+V and Edit > Paste as one draft by @nwparker in https://github.com/stablyai/orca/pull/33339\n* Keep restored history when ConPTY repaints after a resize by @nwparker in https://github.com/stablyai/orca/pull/33577\n* Apply the terminal host’s ConPTY resize rule in the window too by @nwparker in https://github.com/stablyai/orca/pull/33584\n* Send ESC d for Option+Forward-Delete on macOS by @nwparker in https://github.com/stablyai/orca/pull/33296\n* Let macOS terminal shells download cloud-only files by @Jinwoo-H in https://github.com/stablyai/orca/pull/33623\n* Show the stalled terminal host banner when the host is actually stalled by @Jinwoo-H in https://github.com/stablyai/orca/pull/33000\n* Bound folder permission checks while creating terminal sessions by @AmethystLiang in https://github.com/stablyai/orca/pull/33643\n* Clean up an agent’s leftover tools when closing a plain shell pane on macOS and Linux by @nwparker in https://github.com/stablyai/orca/pull/33317\n* Let agents run exit hooks before an immediate close force-quits them by @nwparker in https://github.com/stablyai/orca/pull/33367\n* Don’t resume an agent whose terminal is still running by @nwparker in https://github.com/stablyai/orca/pull/33380\n* Keep fish’s startup terminal reply out of the Codex composer by @nwparker in https://github.com/stablyai/orca/pull/33381\n* Wait for escape sequences to finish before resetting the cursor of an idle agent by @nwparker in https://github.com/stablyai/orca/pull/33616\n* Keep split color sequences intact during a quiet terminal restore by @nwparker in https://github.com/stablyai/orca/pull/33677\n* Stop false recovery warnings in running full-screen programs when pane sizing is slow by @nwparker in https://github.com/stablyai/orca/pull/33474\n* Confirm a live agent has exited before resetting its mouse modes by @nwparker in https://github.com/stablyai/orca/pull/33603\n* Start a woken pane’s new prompt on its own line when reattached by @nwparker in https://github.com/stablyai/orca/pull/33494\n* Let Kiro’s terminal relay release the shell-ready wait by @nwparker in https://github.com/stablyai/orca/pull/33495\n* Finish saving history before a shutdown’s connection can close by @nwparker in https://github.com/stablyai/orca/pull/33504\n* Keep desktop history when a hidden pane is revealed by @nwparker in https://github.com/stablyai/orca/pull/33534\n* Keep desktop terminal history after a phone opens the terminal by @nwparker in https://github.com/stablyai/orca/pull/33537\n* Wake a slept WSL pane on Windows in the folder its shell was in by @nwparker in https://github.com/stablyai/orca/pull/33398\n* Keep history and folder for a slept pane the relaunched app had not reopened yet by @nwparker in https://github.com/stablyai/orca/pull/33425\n* Keep the folder of a WSL pane a relaunched window reattached when it is slept by @nwparker in https://github.com/stablyai/orca/pull/33496\n* Reopen a slept agent whose tab is gone in a fresh tab instead of stranding it by @nwparker in https://github.com/stablyai/orca/pull/33598\n\n### SSH & remote servers\n\n*Port forwards that come back, more hosts that connect, and managed servers you can update without closing terminals.*\n\n* Bring saved SSH port forwards back after a restart that reconnects through the host’s Orca server by @nwparker in https://github.com/stablyai/orca/pull/33388\n* Show saved SSH port forwards that couldn’t start, with the reason, and let you remove them by @nwparker in https://github.com/stablyai/orca/pull/33450\n* Retry over system ssh when the built-in client shares no algorithm with the host by @nwparker in https://github.com/stablyai/orca/pull/33680\n* Add Update and Update anyway for a managed SSH server, keeping its running terminals by @nwparker in https://github.com/stablyai/orca/pull/33397\n* Move an SSH host onto its managed server even when a pane saved no terminal history by @nwparker in https://github.com/stablyai/orca/pull/33681\n* Explain that adding a project on a paired server’s SSH host isn’t supported yet by @nwparker in https://github.com/stablyai/orca/pull/33284\n* Drop a paired server’s old workspace rows when it relists them under new project ids by @nwparker in https://github.com/stablyai/orca/pull/33396\n* Keep one paired runtime’s updates from dropping another runtime’s terminals in a shared workspace by @nwparker in https://github.com/stablyai/orca/pull/33414\n* Fix `orca agent hooks` commands on headless Orca servers by @nwparker in https://github.com/stablyai/orca/pull/33700\n* Drive Android emulators from headless `orca serve` hosts by @nwparker in https://github.com/stablyai/orca/pull/33701\n\n### Workspaces, sidebar & everyday polish\n\n*Workspaces stay on the right branch and dialogs don’t get stuck, with quicker previews and tidier sidebar controls.*\n\n* Keep each same-path workspace copy on its own host’s branch by @nwparker in https://github.com/stablyai/orca/pull/33428\n* Start the agent when a workspace is opened during creation by @nwparker in https://github.com/stablyai/orca/pull/33562\n* Keep the create-worktree dialog from getting stuck on a stalled setup step by @OrcaWin in https://github.com/stablyai/orca/pull/33400\n* Explain the shallow-clone warning for keeping local main up to date, and let you stop the refresh by @OrcaWin in https://github.com/stablyai/orca/pull/33260\n* Keep the Jira Board view selected in Tasks after you leave the page by @kazuki-hanai in https://github.com/stablyai/orca/pull/30588\n* Keep the workspace hover card open behind link actions by @OrcaWin in https://github.com/stablyai/orca/pull/33409\n* Close the link chooser when you click elsewhere on a hover card by @nwparker in https://github.com/stablyai/orca/pull/33679\n* Show tab previews after 500 ms instead of 800 ms by @AmethystLiang in https://github.com/stablyai/orca/pull/33447\n* Keep the sidebar header buttons in place when switching to Activity by @AmethystLiang in https://github.com/stablyai/orca/pull/33648\n* Give the notification bell room for its status and count by @AmethystLiang in https://github.com/stablyai/orca/pull/33683\n* Make Cmd/Ctrl + zoom in on non-US keyboards by @AmoabaKelvin in https://github.com/stablyai/orca/pull/33014\n* Keep Orca CLI commands working in sandboxes that deny chmod by @nwparker in https://github.com/stablyai/orca/pull/33662\n\n### Phone & web\n\n*Phones keep every piece of terminal output and the right agent status, and explain what they can’t show.*\n\n* Stop phones losing pieces of terminal output by @nwparker in https://github.com/stablyai/orca/pull/33405\n* Keep Working and Needs You in a phone’s session tabs on Windows agents that never set a title by @nwparker in https://github.com/stablyai/orca/pull/33614\n* Explain why a file outside the workspace can’t be shown on the phone by @nwparker in https://github.com/stablyai/orca/pull/33341\n\n### Tests, builds & maintenance\n\n*Broader behavioral coverage with fewer low-value tests, faster local checks and dev setup, continued module organization, a repository-wide comment cleanup, and relay service improvements.*\n\n<details>\n<summary>All test, build and maintenance changes</summary>\n\n* Log the relay director’s zone and round-trip speed on each runtime line by @Jinwoo-H in https://github.com/stablyai/orca/pull/33372\n* Cap how many reserve relay cells a director outage sends to the database by @Jinwoo-H in https://github.com/stablyai/orca/pull/33415\n* Build the macOS terminal host on a patched Node runtime to recover stalled workers (reverted later in this release, apart from its stall telemetry) by @nwparker in https://github.com/stablyai/orca/pull/29133\n* Return the macOS terminal host to official Node, keeping stall telemetry by @Jinwoo-H in https://github.com/stablyai/orca/pull/33688\n* Clean up after the agent integration fixes by @nwparker in https://github.com/stablyai/orca/pull/33644\n* Repair main’s line limits and a stale test import by @brennanb2025 in https://github.com/stablyai/orca/pull/33675\n* Complete the repository-wide comment cleanup by @OrcaWin in https://github.com/stablyai/orca/pull/33249\n* Finish the launcher and configuration comment review by @OrcaWin in https://github.com/stablyai/orca/pull/33513\n* Fix suppressed lint violations instead of ignoring them by @OrcaWin in https://github.com/stablyai/orca/pull/33294\n* Split STYLEGUIDE.md into a core guide plus topic deep dives by @nwparker in https://github.com/stablyai/orca/pull/33402\n* Add component fixtures with headless screenshots for fast UI checks by @nwparker in https://github.com/stablyai/orca/pull/33406\n* Give coding agents TypeScript 7 code intelligence, with load-aware type checkers by @nwparker in https://github.com/stablyai/orca/pull/33408\n* Give each worktree its own pnpm dev profile, ports and seeded profiles by @nwparker in https://github.com/stablyai/orca/pull/33416\n* Skip mobile dev-client rebuilds when the native fingerprint