 queue header's label and its count by @brennanb2025 in https://github.com/stablyai/orca/pull/29268\n* Hosts install a managed runtime over RPC, and mark agents whose program Orca provides by @brennanb2025 in https://github.com/stablyai/orca/pull/29024\n* The app follows a host's managed runtime install state, shared by every surface by @brennanb2025 in https://github.com/stablyai/orca/pull/29048\n* Verify the actual CLI conversation during resume by @brennanb2025 in https://github.com/stablyai/orca/pull/29124\n* Idle cleanup and commands read the helpers the agent reported, not the capped status store by @brennanb2025 in https://github.com/stablyai/orca/pull/29905\n* One install row shows and drives a managed runtime install, for Settings and chat by @brennanb2025 in https://github.com/stablyai/orca/pull/29049\n\n### Agents, integrations & orchestration\n\n*Plan work in Jira with boards, saved filters and current-sprint views, find the right task, and keep agent launches and session status consistent across machines.*\n\n* Report Kiro agent status and list Kiro sessions in history by @w-felipe360 in https://github.com/stablyai/orca/pull/26695\n* Show the usage unit once in the status bar by @AmethystLiang in https://github.com/stablyai/orca/pull/26869\n* Start plain new-tab agent launches through the host's agent.launch by @brennanb2025 in https://github.com/stablyai/orca/pull/26489\n* One host-routed agent-detection entry point by @OrcaWin in https://github.com/stablyai/orca/pull/27054\n* Route the first-work branch rename by the repo's execution host by @OrcaWin in https://github.com/stablyai/orca/pull/27080\n* A session dropped on a pane edge splits the pane in paired-runtime workspaces by @OrcaWin in https://github.com/stablyai/orca/pull/27102\n* Throttle and background last-status.json writes by @nwparker in https://github.com/stablyai/orca/pull/26822\n* An old Windows or unknown-platform host asks to update instead of answering its default list by @OrcaWin in https://github.com/stablyai/orca/pull/27164\n* Exclude label groups from assignable labels by @nwparker in https://github.com/stablyai/orca/pull/26861\n* Show DeepSeek icon for observed Build sessions by @nwparker in https://github.com/stablyai/orca/pull/26863\n* Name Agent Dashboard column regions by @nwparker in https://github.com/stablyai/orca/pull/26865\n* One agent inventory per host and execution context by @OrcaWin in https://github.com/stablyai/orca/pull/27225\n* Review providers resolve the repo on its host by @OrcaWin in https://github.com/stablyai/orca/pull/27247\n* A server's late account result stays with that server by @OrcaWin in https://github.com/stablyai/orca/pull/27262\n* GitHub Projects boards read from the task page's source host by @OrcaWin in https://github.com/stablyai/orca/pull/27270\n* Keep Coding Plan credentials and quota tied to the selected account by @nwparker in https://github.com/stablyai/orca/pull/24674\n* Open ZCode sign-in in the existing setup terminal by @nwparker in https://github.com/stablyai/orca/pull/27321\n* Remove a rejected GLM key when restore fails by @parkavenue9639 in https://github.com/stablyai/orca/pull/24964\n* Stop feature branches from borrowing unrelated PRs by @nwparker in https://github.com/stablyai/orca/pull/27332\n* Avoid downloading unchanged paired-runtime session history by @nwparker in https://github.com/stablyai/orca/pull/27383\n* Keep nested models off parent panes by @nwparker in https://github.com/stablyai/orca/pull/26846\n* Session History: resume folder workspace chats in their own folder by @brennanb2025 in https://github.com/stablyai/orca/pull/27209\n* Account switchers and CLI cards follow the focused repo's host by @nwparker in https://github.com/stablyai/orca/pull/27687\n* Edit agent launch settings on the workspace host by @brennanb2025 in https://github.com/stablyai/orca/pull/26479\n* Launch agents in existing workspaces by @brennanb2025 in https://github.com/stablyai/orca/pull/27794\n* Register forward-slash Windows hook paths for Grok, Devin, ZCode and Antigravity by @OrcaWin in https://github.com/stablyai/orca/pull/27713\n* After a restart, an agent tab asks the terminal host what is running, never \"Couldn't confirm the agent started\" by @brennanb2025 in https://github.com/stablyai/orca/pull/28043\n* Cap Cursor's Retry-After at 24h and share one Retry-After parser by @Jinwoo-H in https://github.com/stablyai/orca/pull/28406\n* Host plans agent launches with the window's runtime rule and one runtime fact (C1) by @brennanb2025 in https://github.com/stablyai/orca/pull/27692\n* Stop retried failed worker starts from piling up live agents by @brennanb2025 in https://github.com/stablyai/orca/pull/27795\n* Show \"Network issue\" for any provider whose usage request fails on the network by @Jinwoo-H in https://github.com/stablyai/orca/pull/28415\n* Usage requests answer authenticated-proxy challenges on a cold start by @Jinwoo-H in https://github.com/stablyai/orca/pull/28411\n* Preserve open chat status when terminals close by @brennanb2025 in https://github.com/stablyai/orca/pull/28188\n* A focused WSL host shows and switches its distro's accounts by @nwparker in https://github.com/stablyai/orca/pull/28465\n* Launches a WSL host starts itself use the account selected for its distro by @nwparker in https://github.com/stablyai/orca/pull/28464\n* Add \"None\" agent option that opens only the setup script by @leog in https://github.com/stablyai/orca/pull/25617\n* Retire any restored agent row whose terminal died while Orca was closed (STA-10194) by @Jinwoo-H in https://github.com/stablyai/orca/pull/28475\n* Refresh Source Control only for the worktree whose git index changed by @Jinwoo-H in https://github.com/stablyai/orca/pull/26946\n* Open a server agent's notification on its server by @Jinwoo-H in https://github.com/stablyai/orca/pull/26518\n* Refuse an agent whose WSL runtime needs repair under its own code, in the settings page's words by @brennanb2025 