b191c9b904bd33dad0d78","download_count":18,"created_at":"2026-10-19T06:18:40Z","updated_at":"2026-10-19T06:18:41Z"},{"id":655438832,"node_id":"RA_kwDORpCz1s4nETPw","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":228117704,"digest":"sha256:553fc690739bff90f38a6542a82ed48c2b38eef3f48eb53bf575bc21af5a87c2","download_count":39707,"created_at":"2026-10-19T06:27:49Z","updated_at":"2026-10-19T06:27:58Z"},{"id":655438835,"node_id":"RA_kwDORpCz1s4nETPz","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":220312,"digest":"sha256:f4a12668b3f9f0da582cfb899d0b067b6841a033e2575e5fb201474fc726d522","download_count":11526,"created_at":"2026-10-19T06:27:49Z","updated_at":"2026-10-19T06:27:49Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\n## The short version\n\n- **Native chat (experimental):** Use Antigravity in chat, choose which agents open as chats, and install a missing agent from the chat itself. Paste copied files as attachments, queue images, and see clearer feedback while attachments and queue actions are pending.\n- **Accounts & agents:** After switching Claude accounts, restart running sessions on the new account. Remove downloaded agent runtimes from Settings, and edit or delete Linear comments through the Orca CLI.\n- **Phone:** Edit queued messages in place, follow tool runs with desktop-style cards, and see your conversation immediately when resuming from history. Landscape phones put session tabs in the top bar, and Tasks makes clear which desktop you\u2019re using.\n- **SSH & remote workspaces:** Disconnect stays disconnected, sleeping workspaces stay asleep, and closed tabs stay closed after reconnecting. Clearer server update and re-pairing messages help you recover a connection.\n- **Everyday polish:** Quick Command shortcuts follow the focused split, tab previews wait for the full hover delay, and file headers offer Reveal in Finder. Workspace cleanup better protects same-path projects on other machines.\n\n## Compatibility & upgrade notes\n\n**Native chat (experimental):** Some chat features require support from the remote host. Keep the host updated alongside Orca to use the latest capabilities.\n\n**The `orca` command on SSH hosts:** Existing hosts retain explicitly saved CLI control preferences; an unset preference is migrated to off. To allow commands on a connected SSH host to open and control this desktop\u2019s Orca browser tabs for that host\u2019s workspaces, enable **Allow this host\u2019s orca CLI to control Orca** under Settings \u2192 SSH Hosts \u2192 edit the host \u2192 Advanced Connection.\n\n---\n\n## Product experience\n\n### Native chat (experimental)\n\n*Choose which agents open as chats, use Antigravity, attach files and images more reliably, and see clearer queue, model and input-ownership feedback.*\n\n* Offer Install when a chat\u2019s host is missing the agent it needs by @brennanb2025 in https://github.com/stablyai/orca/pull/29051\n* Chat: dropped files hold Send until they're attached by @brennanb2025 in https://github.com/stablyai/orca/pull/29173\n* A queue action still on its way greys its controls, like the phone by @brennanb2025 in https://github.com/stablyai/orca/pull/29120\n* Image messages wait in the queue like text by @brennanb2025 in https://github.com/stablyai/orca/pull/28655\n* Chat: pasting a copied file attaches it, like dropping it by @brennanb2025 in https://github.com/stablyai/orca/pull/29089\n* Choose which agents open in native chat by @brennanb2025 in https://github.com/stablyai/orca/pull/29071\n* A sign-in prompt on an ACP agent's error output ends the start or turn signed out by @brennanb2025 in https://github.com/stablyai/orca/pull/28467\n* An agent can run each chat's own permission mode itself by @brennanb2025 in https://github.com/stablyai/orca/pull/28455\n* Hide Orca's chat-naming requests from Session History by @nwparker in https://github.com/stablyai/orca/pull/30029\n* A running Claude chat keeps its model when two Claude Code versions list differently by @brennanb2025 in https://github.com/stablyai/orca/pull/30022\n* Use Antigravity in native chat through its ACP server by @brennanb2025 in https://github.com/stablyai/orca/pull/28595\n* A refused steer leaves its turn as the chat's latest request by @brennanb2025 in https://github.com/stablyai/orca/pull/29907\n* A Codex chat is Working only while Codex holds the send by @brennanb2025 in https://github.com/stablyai/orca/pull/29922\n* Pause an agent's chat starts while its shared sign-in changes by @brennanb2025 in https://github.com/stablyai/orca/pull/28649\n* The queue button you pressed shows a working spinner by @brennanb2025 in https://github.com/stablyai/orca/pull/30010\n* Mark each attached image as [Image #N] where it sits in the prompt by @AmoabaKelvin in https://github.com/stablyai/orca/pull/28736\n* Keep a restored agent\u2019s status unconfirmed after 30 minutes instead of marking it done by @nwparker in https://github.com/stablyai/orca/pull/30186\n* Show why the chat composer is locked and offer Take back when a phone holds the input by @nwparker in https://github.com/stablyai/orca/pull/30199\n* Antigravity install: one clear message in the chat, with the message box staying in place by @brennanb2025 in https://github.com/stablyai/orca/pull/30001\n* Session History: the scan line under the search box no longer jumps during a refresh by @brennanb2025 in https://github.com/stablyai/orca/pull/30158\n* Sign in to Antigravity chats with the server\u2019s own Google sign-in by @brennanb2025 in https://github.com/stablyai/orca/pull/28650\n* Move a chat visual's Open and Share buttons above it by @AmoabaKelvin in https://github.com/stablyai/orca/pull/30356\n* A Claude chat keeps a model its CLI stopped listing by @brennanb2025 in https://github.com/stablyai/orca/pull/30436\n\n### Agents, integrations & accounts\n\n*Switch Claude accounts with a restart offer, manage downloaded runtimes, edit Linear comments, and keep terminal sessions and GitLab task searches reliable.*\n\n* Edit and delete Linear comments from the Orca CLI by @brennanb2025 in https://github.com/stablyai/orca/pull/30003\n* Remove a downloaded agent runtime from its Settings row by @brennanb2025 in https://github.com/stablyai/orca/pull/29140\n* Follow an Orca Claude account switch when the shell sets CLAUDE_CONFIG_DIR by @Jinwoo-H in https://github.com/stablyai/orca/pull/29890\n* Offer to restart running Claude sessions on the new account after a switch by @Jinwoo-H in https://github.com/stablyai/orca/pull/29898\n* Remove a downloaded agent runtime only after nothing on its host can still run it by @brennanb2025 in https://github.com/stablyai/orca/pull/29139\n* Let jcode's own client start its per-pane server by @brennanb2025 in https://github.com/stablyai/orca/pull/30257\n* Run the Antigravity usage check with agy's auto-update off by @OrcaWin in https://github.com/stablyai/orca/pull/30387\n* Quit no longer warns about terminals a paired Orca server keeps running by @nwparker in https://github.com/stablyai/orca/pull/30006\n* Resume a relaunched workspace's sleeping agents only when shown by @Jinwoo-H in https://github.com/stablyai/orca/pull/29459\n* One spawn step writes a terminal's pane identity for both ways Orca opens terminals by @brennanb2025 in https://github.com/stablyai/orca/pull/29884\n* Tell users once that the diff panel in a Claude pane is Claude's own by @AmoabaKelvin in https://github.com/stablyai/orca/pull/29818\n* Keep OMP prompt markers from ending an agent\u2019s turn so phone chat can find its session by @nwparker in https://github.com/stablyai/orca/pull/30273\n* Avoid duplicate snapshot replays after reveal by @nwparker in https://github.com/stablyai/orca/pull/30205\n* Keep OMP prompt markers from triggering unnecessary terminal repair by @nwparker in https://github.com/stablyai/orca/pull/30285\n* Limit concurrent GitLab project requests to keep task searches within the queue limit by @maxmilian in https://github.com/stablyai/orca/pull/30157\n\n### SSH, managed servers & remote\n\n*Keep disconnects, sleeping workspaces and closed tabs consistent, preserve workspace identity during server moves, and recover with clearer update and re-pairing guidance.*\n\n* Stop suggesting --host to listings that reject it by @nwparker in https://github.com/stablyai/orca/pull/30012\n* Explain why file open fails on a server with no app window by @nwparker in https://github.com/stablyai/orca/pull/30014\n* A host converted to its managed server keeps its workspaces' visit recency by @nwparker in https://github.com/stablyai/orca/pull/30015\n* Link a folder workspace the server kept when a re-created SSH host moves again (#27285) by @nwparker in https://github.com/stablyai/orca/pull/30017\n* A password SSH host waits for you at launch instead of prompting by @nwparker in https://github.com/stablyai/orca/pull/30025\n* Make the host's tab name the one source for CLI and desktop renames by @nwparker in https://github.com/stablyai/orca/pull/30037\n* A slept remote workspace stays asleep through terminal orphan recovery by @nwparker in https://github.com/stablyai/orca/pull/30118\n* A Disconnect stays disconnected, and Settings and the status bar agree by @nwparker in https://github.com/stablyai/orca/pull/30130\n* Orca serve on orcad serves the browser client and answers plain HTTP by @nwparker in https://github.com/stablyai/orca/pull/30120\n* A tab closed while a managed host is disconnected stays closed; deflake the shared-home spec by @nwparker in https://github.com/stablyai/orca/pull/30146\n* Paired clients see a folder-upgraded Git project under the host workspace id by @nwparker in https://github.com/stablyai/orca/pull/30190\n* Move the open workspace to the server's linked project when joining an existing server by @nwparker in https://github.com/stablyai/orca/pull/30189\n* Saved terminal history no longer blocks a host's move to its Orca server (#30126) by @nwparker in https://github.com/stablyai/orca/pull/30188\n* Say when a managed server may be behind this app, and retry a failed update once per launch by @nwparker in https://github.com/stablyai/orca/pull/30218\n* A late relay-era attach releases only its own viewer, never a successor's by @nwparker in https://github.com/stablyai/orca/pull/30219\n* Report a legacy relay host active once a day while it bridges terminals by @nwparker in https://github.com/stablyai/orca/pull/30229\n* SSH host management on a server without the desktop app says why it can't (D3) by @nwparker in https://github.com/stablyai/orca/pull/30242\n* A connection never redials a host the user disconnected before its teardown runs by @nwparker in https://github.com/stablyai/orca/pull/30245\n* Refuse a migration request too large for the host's sealed frame before sending it by @nwparker in https://github.com/stablyai/orca/pull/30249\n* Overlapping update checks never both try a host the first one just failed on by @nwparker in https://github.com/stablyai/orca/pull/30253\n* Show Re-pair required for revoked servers and let you re-pair in place by @nwparker in https://github.com/stablyai/orca/pull/30271\n\n### Phone\n\n*Edit queued messages in place, follow tool runs, resume conversations with their history visible, and navigate files, Tasks and landscape session tabs more smoothly.*\n\n* Edit queued messages in place by @brennanb2025 in https://github.com/stablyai/orca/pull/28646\n* One Working line in every chat; drop the floating 'Agent is working' pill by @brennanb2025 in https://github.com/stablyai/orca/pull/29972\n* The chat's Working line uses desktop's spinner by @brennanb2025 in https://github.com/stablyai/orca/pull/30008\n* Keep a headless host's chat tab through snapshot rebuilds by @nwparker in https://github.com/stablyai/orca/pull/30028\n* Prevent markdown and file tab reload and screen flicker on retap and revisit by @zhangxaochen in https://github.com/stablyai/orca/pull/30033\n* Show the update screen instead of native screens when the desktop has no page by @Jinwoo-H in https://github.com/stablyai/orca/pull/29956\n* Allow Markdown refresh during desktop tab snapshots by @nwparker in https://github.com/stablyai/orca/pull/30040\n* Draw the host Accounts screen from the desktop's page by @Jinwoo-H in https://github.com/stablyai/orca/pull/30020\n* Ask which desktop to open Tasks on when several are connected by @Jinwoo-H in https://github.com/stablyai/orca/pull/30048\n* Show which desktop the mobile Tasks screen is for by @Jinwoo-H in https://github.com/stablyai/orca/pull/30105\n* A compact phone queue: shorter header, a capped scrolling list, and an editor that fits the card by @brennanb2025 in https://github.com/stablyai/orca/pull/30016\n* Draw chat tool runs the way desktop does by @AmoabaKelvin in https://github.com/stablyai/orca/pull/30135\n* Render Source Control on the phone for large branches by @nwparker in https://github.com/stablyai/orca/pull/30215\n* A session resumed from the phone's history shows its conversation before the first new turn (#10923) by @nwparker in https://github.com/stablyai/orca/pull/30283\n* Break the transport and terminal-document import cycles, and gate cycles after mobile's install by @nwparker in https://github.com/stablyai/orca/pull/30290\n* Put the session tabs in the top bar on a landscape phone by @brennanb2025 in https://github.com/stablyai/orca/pull/29070\n\n### Workspaces, sidebar & tabs\n\n*Protect same-path workspaces on different machines, explain cross-host actions, keep shortcuts on the focused split, and make notices and tab previews steadier.*\n\n* Main produces per-workspace activity facts, checked against the window in dev and test by @Jinwoo-H in https://github.com/stablyai/orca/pull/29980\n* Stop the notice stack flickering under a resting mouse, and fit the force-delete button to its notice by @brennanb2025 in https://github.com/stablyai/orca/pull/29878\n* ResolveOwner refuses folder and project-group twins instead of guessing this computer by @nwparker in https://github.com/stablyai/orca/pull/30009\n* Main publishes desktop focus, pins, project and host order, and SSH/WSL host state, checked against the window in dev and test by @Jinwoo-H in https://github.com/stablyai/orca/pull/30018\n* Main keeps one live set of paired-server rows, checked against the window in dev and test by @Jinwoo-H in https://github.com/stablyai/orca/pull/30027\n* Main produces per-workspace PR facts, checked against the window in dev and test by @Jinwoo-H in https://github.com/stablyai/orca/pull/30026\n* Main keeps a registry of workspace creations in progress, checked against the window in dev and test by @Jinwoo-H in https://github.com/stablyai/orca/pull/30021\n* Ui.setCollapsed changes one section's collapse without undoing another device by @Jinwoo-H in https://github.com/stablyai/orca/pull/30044\n* Say so when a project cannot join a group on another host by @nwparker in https://github.com/stablyai/orca/pull/30127\n* Draw a project group once when two hosts publish it under one id by @nwparker in https://github.com/stablyai/orca/pull/30128\n* A host-scoped purge leaves a surviving twin's tabs and edits alone by @nwparker in https://github.com/stablyai/orca/pull/30030\n* Destructive host callers refuse an ambiguous owner instead of reading it as local by @nwparker in https://github.com/stablyai/orca/pull/30035\n* Fold getExplicitRuntimeEnvironmentIdForWorktree callers into resolveOwner by @nwparker in https://github.com/stablyai/orca/pull/30059\n* Confirm before sleeping a workspace that another host's copy shares by @nwparker in https://github.com/stablyai/orca/pull/30047\n* Shrink twin-removal teardown to the attributed close actions by @nwparker in https://github.com/stablyai/orca/pull/30060\n* Tighten the host-identity stack by @nwparker in https://github.com/stablyai/orca/pull/30124\n* Stop CLI-created worktrees flashing into a filtered sidebar by @nwparker in https://github.com/stablyai/orca/pull/30194\n* Say a Linear task-status skip was for a multi-host workspace by @nwparker in https://github.com/stablyai/orca/pull/30243\n* Apply Quick Command shortcuts and pane actions to the focused split by @AmethystLiang in https://github.com/stablyai/orca/pull/30258\n* Show when a paired server\u2019s access is revoked or an update is required by @nwparker in https://github.com/stablyai/orca/pull/30280\n* Wait for the full hover delay before showing each tab preview by @AmethystLiang in https://github.com/stablyai/orca/pull/30388\n\n### Editor, files & Markdown\n\n*Reveal files from their header menu and run notebook cells only when their workspace belongs to this computer.*\n\n* Reveal a file in Finder from its header menu by @nwparker in https://github.com/stablyai/orca/pull/30129\n* Run cells only when the resolved owner is this computer by @nwparker in https://github.com/stablyai/orca/pull/30187\n\n### Browser\n\n*Open hosting-provider websites from Cmd/Ctrl+J and clean up browser tabs on hosts without a browser engine.*\n\n* Let Cmd+J open hosting-provider domains like github.io by @AmethystLiang in https://github.com/stablyai/orca/pull/29989\n* A client-hosted ghost tab closes on a host with no browser engine by @nwparker in https://github.com/stablyai/orca/pull/30119\n\n### Performance & reliability\n\n*Retry failed shell PATH checks and speed up development typechecking with a pinned Bun dependency.*\n\n* Retry the shell PATH check and fall back when the shell cannot launch by @nwparker in https://github.com/stablyai/orca/pull/30204\n* Pin Bun as a devDependency and typecheck with it by @nwparker in https://github.com/stablyai/orca/pull/30149\n\n### Tests, CI & maintenance\n\n*Broader regression coverage, dependency updates and internal cleanup support the changes above. Work on host-owned layouts and sidebar state remains behind disabled build switches.*\n\n* Brand host-scoped worktree and repo keys for new code by @nwparker in https://github.com/stablyai/orca/pull/29990\n* Agree with main on main-made terminal tabs and sleeping-agent records (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/29967\n* Agree with main on first-group ids, tab order and the preview flag (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/29987\n* Record chat tab opens and closes in main (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30019\n* Record the chat pane the window picks in main (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30036\n* Open into the window's emptied pane beside a split branch in one layout command (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30039\n* Write no false preview flag on a new or promoted tab (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30041\n* Record simulator tab opens and closes in main (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30034\n* Put main's sidebar inputs behind the ORCA_SIDEBAR_INPUTS dark build switch by @Jinwoo-H in https://github.com/stablyai/orca/pull/30050\n* Main serves workspace icons as small data URLs for the phone (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30046\n* Floating editor files keep one id from open (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30109\n* Main keeps the list's time rules on one clock, checked against the window (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30104\n* Main's layout Loader keeps one pane per terminal on restore (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30110\n* Main records a Quick Command tab's label when the tab is created (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30112\n* Save-divergence detector: skip empty workspaces, see dropped tab-bar entries and kept pane trees (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30125\n* A background agent tab keeps its live title when another tab opens (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30131\n* Dark phone feed of the sidebar inputs (sidebarInputs.read) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30161\n* Pane titles stay layout: the window stops writing tab names as pane titles, and main loads them as the window does (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30136\n* Main's temporal owner reads the catalog the way the window does (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30166\n* Main produces this host's workspace rows, checked against the window (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30184\n* One placement helper for drawn tab opens (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30174\n* Main drops the layout of workspaces the catalog no longer validates (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30177\n* Reopening a file in its open tab sends the main process the changed file record (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30197\n* Main repairs a terminal stored in two panes once at startup (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30178\n* Main records when a workspace's default tabs were applied (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30176\n* Main keeps editor tabs under owned ids and in-place re-owns in step (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30206\n* Refuse a layout change on a workspace a WSL move has paused (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30198\n* Main routes folders by the window's host rule and never stops layout frames (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30201\n* Phone and old-client tab lists keep editor tabs under owned ids (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30216\n* One comparison-only worktreeIdentityKey replaces three key wrappers by @nwparker in https://github.com/stablyai/orca/pull/30217\n* One worktree path equality; the ipc copy folded WSL ext4 tails by @nwparker in https://github.com/stablyai/orca/pull/30227\n* The host that owns a workspace stamps its Recent and Smart keys (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30235\n* After a restart, the host clears sort tiers nothing backs any more (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30259\n* Drop the runtimeWorktreeIdsEqual alias; name the WSL hook relay gate for what it gates by @nwparker in https://github.com/stablyai/orca/pull/30264\n* Main routes a project registered on two machines to the same owner the window saves to (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30196\n* Window saves stop carrying tab and pane layout; main keeps its own (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/30282\n* The window's layout stream reconnects after a drop; a retried quit still sends resume records (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/or