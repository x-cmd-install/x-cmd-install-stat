8790ac8147","download_count":40304,"created_at":"2026-09-24T05:00:28Z","updated_at":"2026-09-24T05:00:37Z"},{"id":585184019,"node_id":"RA_kwDORpCz1s4i4TMT","name":"orca-macos-arm64.dmg.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":224341,"digest":"sha256:6dd07e9e790f6f0ab5ee313c16e97d924084677167aa64af2ed2700da052d186","download_count":9,"created_at":"2026-09-24T05:00:28Z","updated_at":"2026-09-24T05:00:29Z"},{"id":585179342,"node_id":"RA_kwDORpCz1s4i4SDO","name":"orca-macos-x64.dmg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":222845662,"digest":"sha256:94902ea8ae1338d1f72aff11c33df52b1b8e975026dfa022c63c20b6f0925698","download_count":35523,"created_at":"2026-09-24T04:57:36Z","updated_at":"2026-09-24T04:57:44Z"},{"id":585179343,"node_id":"RA_kwDORpCz1s4i4SDP","name":"orca-macos-x64.dmg.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":233307,"digest":"sha256:6b07a6445120543ba915058597f75aef77097b0edec36448fa3f6be4fed5055b","download_count":8,"created_at":"2026-09-24T04:57:36Z","updated_at":"2026-09-24T04:57:36Z"},{"id":585173650,"node_id":"RA_kwDORpCz1s4i4QqS","name":"orca-sourcemaps-v1.4.210.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":10557086,"digest":"sha256:d674633a3c30e2a3dfeba4f7dfa844dfa279caa1a382330197d0de116e5d83a2","download_count":12,"created_at":"2026-09-24T04:53:24Z","updated_at":"2026-09-24T04:53:25Z"},{"id":585222275,"node_id":"RA_kwDORpCz1s4i4ciD","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":191913280,"digest":"sha256:d041605b847ecd69ac9a25ed567990fab872509c1df5fdfabe0d934a705d7ced","download_count":27899,"created_at":"2026-09-24T05:24:28Z","updated_at":"2026-09-24T05:24:37Z"},{"id":585222272,"node_id":"RA_kwDORpCz1s4i4ciA","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":194344,"digest":"sha256:1e718bd5735aca82c5e054ec38fa9c850100c1ba556b897182d88a3a78d807ea","download_count":7853,"created_at":"2026-09-24T05:24:28Z","updated_at":"2026-09-24T05:24:29Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\n## The short version\n\n**Agents & chat:** Finished chats collapse to their answers, failed turns end instead of hanging, unread lights up when a structured chat finishes, and restart recovery stays in the status bar. Antigravity can run as a supervised worker, and terminal launches report back the pane they created.\n\n**Terminal, editor & workspaces:** Terminal theme choice overrides Ghostty colors, the Linux daemon survives service restarts and reaps cleanly, and macOS tells you how to fix folder access. Large artifact and conflict lists are virtualized, stale search listings are fixed, and Monaco failures stay contained.\n\n**Remote & reliability:** WSL guests keep the OpenCode agent variant, recreated SSH targets keep their generation floor, and same-cap relay waves clean up failed templates without touching the backend service.\n\n---\n\n## Product experience\n\n### Agents, chat & launches\n\n*Structured chats settle cleanly, launches carry their context, and workspace lists stay responsive.*\n\n* fix(sidebar): stop a workspace with a structured chat reading as asleep by @brennanb2025 in https://github.com/stablyai/orca/pull/22098\n* Fix stale listings when search query changes by @AmethystLiang in https://github.com/stablyai/orca/pull/22173\n* Virtualize artifacts list with reusable component by @AmethystLiang in https://github.com/stablyai/orca/pull/22061\n* Clear website annotations after successful delivery by @AmethystLiang in https://github.com/stablyai/orca/pull/22060\n* fix(native-chat): stop a subagent's output speaking for the agent that spawned it by @brennanb2025 in https://github.com/stablyai/orca/pull/21398\n* revert: defer subagent attribution until linkage refactor by @brennanb2025 in https://github.com/stablyai/orca/pull/22058\n* fix(native-chat): collapse a finished turn to its answer by @brennanb2025 in https://github.com/stablyai/orca/pull/22029\n* fix(native-chat): end a structured turn when the agent reports it failed by @brennanb2025 in https://github.com/stablyai/orca/pull/22047\n* feat(native-chat): light the unread indicators when a structured chat finishes by @brennanb2025 in https://github.com/stablyai/orca/pull/21924\n* fix(native-chat): navigate to open history sessions by @brennanb2025 in https://github.com/stablyai/orca/pull/21283\n* feat(native-chat): keep restart recovery available in status bar by @brennanb2025 in https://github.com/stablyai/orca/pull/21397\n* feat(agent-launch): carry the launch inputs the host cannot derive by @brennanb2025 in https://github.com/stablyai/orca/pull/22037\n* refactor(agent-launch): assemble host startup-plan inputs in one resolver by @brennanb2025 in https://github.com/stablyai/orca/pull/22082\n* feat(agent-launch): report the pane a terminal launch created by @brennanb2025 in https://github.com/stablyai/orca/pull/22108\n* refactor(floating-workspace): launch the default agent through the shared launcher by @brennanb2025 in https://github.com/stablyai/orca/pull/21390\n* feat: support Antigravity as supervised worker by @beattlekid in https://github.com/stablyai/orca/pull/21705\n\n### Usage reporting\n\n*Claude usage stays live and cost totals cover the newest models.*\n\n* fix(rate-limits): keep polling Claude usage for Fable accounts during live sessions by @Jinwoo-H in https://github.com/stablyai/orca/pull/22071\n* fix(usage): price GPT-6 Astra, and declare when the Codex cost total omits a model by @Jinwoo-H in https://github.com/stablyai/orca/pull/22073\n\n### Terminal\n\n*Theme choice wins, background services survive restarts, and latency numbers stay honest.*\n\n* fix(settings): make terminal theme selection override Ghostty colors by @nwparker in https://github.com/stablyai/orca/pull/22069\n* fix(daemon): escape the terminal daemon into its own systemd scope so a service restart no longer kills every live PTY by @LesleyMurfin in https://github.com/stablyai/orca/pull/19430\n* fix(macos): tell the user when Orca's terminal service can't read their folder, and walk them through the fix by @Jinwoo-H in https://github.com/stablyai/orca/pull/21923\n* fix(daemon): reap terminal descendants during shutdown by @OrcaWin in https://github.com/stablyai/orca/pull/22232\n* fix(linux): release orphaned processes when their owner exits by @OrcaWin in https://github.com/stablyai/orca/pull/22247\n* fix(perf): measure terminal latency with presented CI frames by @nwparker in https://github.com/stablyai/orca/pull/22096\n* fix(perf): calibrate report budgets without masking latency stalls by @nwparker in https://github.com/stablyai/orca/pull/22075\n\n### Editor, workspaces & source control\n\n*Updates download reliably, large artifact and conflict lists stay fast, and editor failures stay contained.*\n\n* fix(updater): send the gh token and cache the release picker's build list by @AmethystLiang in https://github.com/stablyai/orca/pull/21902\n* Lower filter chip contrast to indicate read-only status by @AmethystLiang in https://github.com/stablyai/orca/pull/21751\n* Refactor editor header file rename to breadcrumb morph UI by @AmethystLiang in https://github.com/stablyai/orca/pull/21265\n* fix(renderer): contain Monaco initialization failures by @OrcaWin in https://github.com/stablyai/orca/pull/21555\n* Virtualize large conflict file trees by @AmethystLiang in https://github.com/stablyai/orca/pull/21920\n* refactor: use generic VirtualizedList in conflict review by @AmethystLiang in https://github.com/stablyai/orca/pull/22092\n* fix(browser): notify state on offscreen page navigation commit by @AmethystLiang in https://github.com/stablyai/orca/pull/21703\n\n### Providers & assistants\n\n*OpenCode launches keep their variant and plugins across hosts.*\n\n* fix(opencode): support v2 plugins under the plain executable name by @nwparker in https://github.com/stablyai/orca/pull/22078\n* fix(wsl): preserve OpenCode agent variant in guest by @nwparker in https://github.com/stablyai/orca/pull/22089\n\n### Remote, SSH & relay\n\n*Recreated targets keep their floor and failed rollouts clean up after themselves.*\n\n* fix(ssh): keep the generation floor when a target is removed and recreated by @nwparker in https://github.com/stablyai/orca/pull/22146\n* fix(relay): keep the backend service out of the same-cap wave; the capacity role cannot update it by @Jinwoo-H in https://github.com/stablyai/orca/pull/22140\n* fix(relay): let a same-cap cell plan delete the deposed template a failed wave left behind by @Jinwoo-H in https://github.com/stablyai/orca/pull/22170\n\n### Mobile (OTA page)\n\n*The over-the-air page gains session routing, rich editing, dictation, capability checks, and keyboard and paint polish. Listed here for visibility only; the mobile app ships on its own release schedule.*\n\n* feat(mobile): register the session page route (OTA phase C, C7.7) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21977\n* refactor(mobile): the bridge host mount reads one args ref, and the handshake fact lives in the session (OTA phase C, audit item 3) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22080\n* fix(mobile): hold every hybrid shell switch on a neutral state while the flag is unresolved (OTA phase C, ruling 33.7) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22077\n* feat(mobile): the microphone owns the wake lock, and the stop reply carries the tail (OTA phase C, ruling 36) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22072\n* fix(mobile): declare externalLink on the two page routes that reach the protocol wall (OTA phase C follow-up) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22113\n* fix(mobile): two more table parsers hold a pipe in a cell (OTA phase C follow-up) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22114\n* fix(mobile): catch the diff-comments loader rejection at the effect (OTA phase C follow-up) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22111\n* feat(mobile): the rich Markdown editor mounts on the page (OTA phase C, C7.10 C2) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22099\n* fix(mobile): the Android audio engine forgets a stop issued while paused by @Jinwoo-H in https://github.com/stablyai/orca/pull/22132\n* fix(mobile): serialize a list the engine nested inside a paragraph (rich editor follow-up) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22145\n* fix(mobile): a same-build cache hit persists the fresh manifest (OTA phase D1) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22139\n* fix(mobile): a granted microphone tap launches no permission activity, and an aborted start says so by @Jinwoo-H in https://github.com/stablyai/orca/pull/22150\n* feat(mobile): the shell tells a page which optional capabilities it has (OTA phase D, C8.1) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22141\n* refactor(mobile): the host-scoping rewrite moves out of the terminal's HTML by @Jinwoo-H in https://github.com/stablyai/orca/pull/22172\n* fix(mobile): contain the older-history page's rejection at its own boundary, and re-record its family by @Jinwoo-H in https://github.com/stablyai/orca/pull/22179\n* fix(mobile): the catch-all carries a deep link's query, and reads a trailing rest-segment pattern (OTA phase D, C8 carry-forwards) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22180\n* fix(mobile): the page runs one Zod (OTA phase C, C6.5 follow-up) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22182\n* fix(mobile): write live-input text through a seam the page can honour by @Jinwoo-H in https://github.com/stablyai/orca/pull/22189\n* feat(mobile): one build-time switch picks native or OTA, default native (OTA phase E1) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22193\n* fix(mobile): the shell swaps the page's client identity so its terminal reaches init by @Jinwoo-H in https://github.com/stablyai/orca/pull/22201\n* build(mobile): key Metro's transform cache on the shell build kind by @Jinwoo-H in https://github.com/stablyai/orca/pull/22244\n* fix(mobile): the page stops writing, importing and requesting what it cannot use by @Jinwoo-H in https://github.com/stablyai/orca/pull/22241\n* fix(mobile): a refused dictation start says why by @Jinwoo-H in https://github.com/stablyai/orca/pull/22256\n* fix(mobile): a refused update serves the cached generation while the host is up by @Jinwoo-H in https://github.com/stablyai/orca/pull/22237\n* fix(mobile): the page's live input stays above the soft keyboard by @Jinwoo-H in https://github.com/stablyai/orca/pull/22252\n* fix(mobile): keep a painted frame under the page until its first paint by @Jinwoo-H in https://github.com/stablyai/orca/pull/22264\n* fix(mobile): the page never removes a host, and stops bundling push by @Jinwoo-H in https://github.com/stablyai/orca/pull/22283\n\n## New Contributors\n* @beattlekid made their first contribution in https://github.com/stablyai/orca/pull/21705\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.209...v1.4.210\n","reactions":{"total_count":11,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":11,"eyes":0},"mentions_count":7}
