i/orca/pull/38147\n* test: remove 280 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38157\n* test: remove 208 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38160\n* test: remove 189 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38169\n* test: remove 158 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38177\n* test: remove 152 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38182\n* Remove 249 low-value test cases and 10 whole suites by @OrcaWin in https://github.com/stablyai/orca/pull/38198\n* Remove 390 low-value test cases and 18 whole suites by @OrcaWin in https://github.com/stablyai/orca/pull/38209\n* Remove 230 low-value test cases and 19 whole suites by @OrcaWin in https://github.com/stablyai/orca/pull/38223\n\n## New Contributors\n\n* @davefano made their first contribution in https://github.com/stablyai/orca/pull/37557\n* @manuelmeurer made their first contribution in https://github.com/stablyai/orca/pull/38162\n* @King-Dylan made their first contribution in https://github.com/stablyai/orca/pull/37895\n* @rikbrown made their first contribution in https://github.com/stablyai/orca/pull/38180\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.248...v1.4.249\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":13}
