9494c2f22d6061e4253d2caf00bbaaa475","download_count":3,"created_at":"2026-10-25T03:24:35Z","updated_at":"2026-10-25T03:24:36Z"},{"id":674036562,"node_id":"RA_kwDORpCz1s4oLPtS","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":202163936,"digest":"sha256:868b7e54f412035f8e4ad73e842a8eda8919ee02b43a8b26a72aca44a5deefe6","download_count":1380,"created_at":"2026-10-25T04:00:20Z","updated_at":"2026-10-25T04:00:28Z"},{"id":674036561,"node_id":"RA_kwDORpCz1s4oLPtR","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":201605,"digest":"sha256:91a64bce6d9303d5e294fcb3ad0a9f86b6c63ec0031d683367f3d6d8daf23c73","download_count":315,"created_at":"2026-10-25T04:00:20Z","updated_at":"2026-10-25T04:00:20Z"}],"body":"## A more dependable workspace \ud83d\udc33\n\nThis release gives the built-in browser searchable history, makes agent activity easier to follow, and improves recovery across chats and remote terminals. You\u2019ll also find Lean and Zig syntax highlighting, support for larger quick-command collections, and a new `orca ports` command for finding your dev servers.\n\n## The short version\n\n- **Conversations that stay with you:** Claude chats now show turns made outside Orca. Retained messages return after reconnect without reopening the chat, and crash recovery no longer guesses that a sent message was undelivered.\n- **A browser with a better memory:** Search your browsing history, reopen pages, remove unwanted suggestions, and clear history with Undo. Pages can also use files you pick, save or drop through File System Access.\n- **Remote work with fewer interruptions:** Slow connections survive missed wake probes, reconnect notices explain what is happening, SSH terminals wait for sign-in, and new splits stay on the paired server.\n- **Agent status you can trust:** Completed Codex subagents stop showing as Working, running main tasks stay visible through `/side` conversations, and Codex MCP tools that require approval get an approval card.\n- **More room for your workflow:** Save more than 40 quick commands, find a worktree\u2019s detected dev-server ports with `orca ports`, and reclaim old dependency installs and build output from development worktrees.\n- **Polish where it counts:** Lean and Zig highlighting, clearer session-search excerpts, smoother Mac trackpad scrolling in terminal apps, and better protection for unmerged branches and worktrees shared between Windows and WSL.\n\n**Phone & web updates:** Updating Orca on the computer serving your phone or browser updates the served interface. This release also keeps running Codex tasks visible on paired and mobile views during `/side` conversations and fixes browser-picked or dropped chat attachments uploading to the paired server.\n\n## Compatibility & upgrade notes\n\n- **Native chat (experimental):** Update paired and SSH hosts alongside Orca for the latest chat, agent-status and launch fixes. Codex\u2019s new approval cards cover MCP tool approvals that do not require form fields; general MCP forms and URL-based verification are not supported by this change.\n- **Browser history:** Open **History** from the page menu, or use **Cmd+Y** on macOS and **Ctrl+H** on Linux and Windows. Search, remove individual entries, or clear the last hour, today or all time, with Undo for clearing.\n- **Detected ports:** `orca ports` supports workspace selection and JSON output on runtimes with host-scoped port scanning. Direct SSH hosts do not support detection yet; native folder workspaces require `--all` to list the host\u2019s listeners.\n- **Development cleanup:** Manual `pnpm reclaim-space` and automatic cleanup on development launches can reclaim ignored, untracked dependency installs and generated output in old sibling worktrees, using a default 30-day cutoff. Selected, invoking and excluded worktrees remain protected. Stop sibling apps, agents, installs, builds and tests before applying manual cleanup; reclaimed installs and output need reinstalling or rebuilding when used again.\n- **Terminal file links:** The earlier change to open a file link in the workspace where it was clicked was reverted in this release.\n\n---\n\n## Product experience\n\n### Native chat (experimental)\n\n*Catch up on conversations, reconnect without extra steps, and answer agent prompts with clearer controls.*\n\n* Show turns made outside Orca in an existing Claude chat by @brennanb2025 in https://github.com/stablyai/orca/pull/31615\n* Show retained chat messages after reconnect without reopening the chat by @brennanb2025 in https://github.com/stablyai/orca/pull/32255\n* Keep sent messages from being falsely marked undelivered after a crash, and stop scanning the transcript on every reopen by @brennanb2025 in https://github.com/stablyai/orca/pull/30580\n* Show approval cards for Codex MCP tools that require permission by @nwparker in https://github.com/stablyai/orca/pull/33310\n* Submit Claude question-preview answers with Enter by @nwparker in https://github.com/stablyai/orca/pull/33332\n* Match terminal pane split and close menus in chat by @brennanb2025 in https://github.com/stablyai/orca/pull/28969\n* Display unknown HTML tags as text instead of dropping them by @anmol0b in https://github.com/stablyai/orca/pull/30819\n* Alert the orchestration coordinator when a chat worker errors by @brennanb2025 in https://github.com/stablyai/orca/pull/31941\n* Deliver follow-ups to running Codex goals using the choices the goal inherits by @nwparker in https://github.com/stablyai/orca/pull/33300\n* Upload chat attachments picked or dropped in a web client to the paired server by @nwparker in https://github.com/stablyai/orca/pull/33060\n\n### Agent activity & integrations\n\n*See the task that is actually running, keep completed work settled, and launch agents with the right session and settings.*\n\n* Record Stop immediately and settle subagents when their exit is confirmed by @brennanb2025 in https://github.com/stablyai/orca/pull/28051\n* Clear stale Working status for completed Codex subagents by @nwparker in https://github.com/stablyai/orca/pull/32937\n* Show reference-origin icons and native-chat origins in the sidebar by @nwparker in https://github.com/stablyai/orca/pull/33049\n* Retain completion subtitles for paired workspaces by @innocarpe in https://github.com/stablyai/orca/pull/9930\n* Remove Claude teammates stopped with TaskStop from the sidebar by @davidgarciab in https://github.com/stablyai/orca/pull/32048\n* Keep agent questions visible when a stale program report says Working by @maxmilian in https://github.com/stablyai/orca/pull/32156\n* Preserve running-agent hook status through idle title repaints by @nwparker in https://github.com/stablyai/orca/pull/32195\n* Restart initial agent-detection probes when their results are invalidated by @nwparker in https://github.com/stablyai/orca/pull/32558\n* Keep Codex status tied to the main task through `/side` chats after restart by @nwparker in https://github.com/stablyai/orca/pull/33275\n* Keep a running Codex turn visible on paired and mobile views while `/side` is shown by @nwparker in https://github.com/stablyai/orca/pull/33308\n* Resume Claude panes whose environment scrubbing removed their pane identity by @nwparker in https://github.com/stablyai/orca/pull/33286\n* Find Antigravity\u2019s usage command in the same environment used to launch agents by @nwparker in https://github.com/stablyai/orca/pull/33289\n* Refresh OpenCode credential status after saving by @Pr1p in https://github.com/stablyai/orca/pull/33081\n* Read Kimi Code 2.x usage from its scoped OAuth configuration by @nwparker in https://github.com/stablyai/orca/pull/33290\n* Bound retries when generating an agent\u2019s first-work name by @nwparker in https://github.com/stablyai/orca/pull/33299\n* Prevent Claude agent-hook runs from creating phantom subagent rows by @nwparker in https://github.com/stablyai/orca/pull/33298\n* Accept OpenCode release ranges when selecting a launch-time model by @nwparker in https://github.com/stablyai/orca/pull/33307\n* Preserve concurrent edits during a remote Hermes reinstall by @Shy7777 in https://github.com/stablyai/orca/pull/20631\n* Keep a cold-restored terminal\u2019s agent session without showing an old Done status by @nwparker in https://github.com/stablyai/orca/pull/33302\n* Attribute shared Hermes gateway events to the correct session pane by @nwparker in https://github.com/stablyai/orca/pull/33288\n* Let branded Pi forks reach launch readiness by setting their initial session title by @thefrikidude in https://github.com/stablyai/orca/pull/28317\n* Preserve a fresh agent\u2019s chat identity when an older shell title arrives by @nwparker in https://github.com/stablyai/orca/pull/33306\n* Mark a Pi answer unread before the compaction that follows it by @mmarabel in https://github.com/stablyai/orca/pull/33272\n* Back off Antigravity usage reads that trigger browser sign-in by @nwparker in https://github.com/stablyai/orca/pull/33297\n* Let paired hosts plan terminal-agent launches from the composer by @nwparker in https://github.com/stablyai/orca/pull/32192\n\n### Browser\n\n*Find a page again, manage what appears in suggestions, and use web apps with local files more naturally.*\n\n* Add searchable browsing history, removable suggestions and Chrome-style Escape behavior in the address bar by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31846\n* Let pages use files picked, saved or dropped through File System Access by @AmoabaKelvin in https://github.com/stablyai/orca/pull/32970\n* Render dark-scheme documents on a dark canvas in previews by @AmoabaKelvin in https://github.com/stablyai/orca/pull/32975\n* Refresh browser profiles changed outside the window without a reload by @AmoabaKelvin in https://github.com/stablyai/orca/pull/32723\n* Keep a closed host page from lingering as a window-saved browser tab by @nwparker in https://github.com/stablyai/orca/pull/33266\n\n### Terminals & remote connections\n\n*Type, scroll, split and reconnect with fewer interruptions, while keeping sessions on the host where they belong.*\n\n* Wait for SSH sign-in before starting a terminal opened during authentication by @nwparker in https://github.com/stablyai/orca/pull/33072\n* Start a split on the paired server even when it follows immediately after opening a tab by @nwparker in https://github.com/stablyai/orca/pull/33078\n* Keep slow remote connections open when a wake probe is missed by @nwparker in https://github.com/stablyai/orca/pull/33071\n* Show one reconnect notice per server, explain the cause, and account for measured connection latency by @nwparker in https://github.com/stablyai/orca/pull/33095\n* Reattach remote panes on the host\u2019s next snapshot after a host-exit settlement by @nwparker in https://github.com/stablyai/orca/pull/33062\n* Remove an exited original pane on paired clients consistently with split panes by @nwparker in https://github.com/stablyai/orca/pull/33083\n* Record why remote connections closed in app diagnostics by @nwparker in https://github.com/stablyai/orca/pull/33094\n* Preserve terminal output and parsing order through resizes by @nwparker in https://github.com/stablyai/orca/pull/32750\n* Avoid republishing session tabs on every Codex thread-name spinner tick by @nwparker in https://github.com/stablyai/orca/pull/33291\n* Keep keys typed before a pane\u2019s terminal is ready by @nwparker in https://github.com/stablyai/orca/pull/33281\n* Keep Mac trackpad flicks continuous in full-screen terminal apps by @nwparker in https://github.com/stablyai/orca/pull/33313\n* Prevent \u201c104;255\u201d from leaking into agent prompts after a tab switch by @ivermin1123 in https://github.com/stablyai/orca/pull/31411\n* Recheck previously missing paths so terminal file links become clickable by @mmarabel in https://github.com/stablyai/orca/pull/6282\n* Prevent terminal creation from reviving tabs that were already closed by @nwparker in https://github.com/stablyai/orca/pull/32190\n* Restart shell panes in split agent tabs as shells by @nwparker in https://github.com/stablyai/orca/pull/32418\n* Report when a terminal has stopped accepting input instead of claiming delivery by @nwparker in https://github.com/stablyai/orca/pull/33269\n* Answer background terminal startup queries while the paired view is paused by @nwparker in https://github.com/stablyai/orca/pull/33273\n* Limit **Reconnect & Delete** to the selected SSH workspace by @nwparker in https://github.com/stablyai/orca/pull/33253\n* Move managed SSH tunnels away from saved local ports that cannot be bound by @nwparker in https://github.com/stablyai/orca/pull/33271\n* Match SSH conversion manifest signing to the host\u2019s parsing by @nwparker in https://github.com/stablyai/orca/pull/32369\n* Stop paired desktops from republishing mirrored editor tabs by @nwparker in https://github.com/stablyai/orca/pull/33259\n* Keep probed host capabilities available after host-status updates by @nwparker in https://github.com/stablyai/orca/pull/33263\n* Prevent a server liveness check from mistaking its own shell for the server by @nwparker in https://github.com/stablyai/orca/pull/33158\n* Allow different workspaces to sleep at the same time without failing by @nwparker in https://github.com/stablyai/orca/pull/33283\n* Add opt-in proxy connection reuse for system SSH on Windows by @nwparker in https://github.com/stablyai/orca/pull/33030\n* Start managed servers with a smaller V8 young generation by @nwparker in https://github.com/stablyai/orca/pull/31494\n* Respect both configured and cell-reported relay connection limits by @Jinwoo-H in https://github.com/stablyai/orca/pull/33039\n* Move relay hosts off an isolated cell while its replacement starts by @Jinwoo-H in https://github.com/stablyai/orca/pull/33312\n* Use a consistent numeric locale for POSIX agent-hook curl timeouts by @siddiqueirshad in https://github.com/stablyai/orca/pull/19600\n* Remove eager regex lookbehind from paired web routes for browser compatibility by @nwparker in https://github.com/stablyai/orca/pull/32906\n\n### Source control, workspaces & Windows / WSL\n\n*Keep project actions on the right host, protect branches and worktrees, and let cold WSL distributions finish starting.*\n\n* Recognize GitLab SSH-over-443 remotes by @lorenzozanee in https://github.com/stablyai/orca/pull/30998\n* Recognize Bitbucket remotes using ssh.bitbucket.org by @Pr1p in https://github.com/stablyai/orca/pull/31002\n* Preserve Source Control section collapse state by @just-zzp in https://github.com/stablyai/orca/pull/9405\n* Back off failed GitLab authentication probes by @1aifanatic in https://github.com/stablyai/orca/pull/26742\n* Hide stale merged PRs after the workspace HEAD changes by @xianjianlf2 in https://github.com/stablyai/orca/pull/7815\n* Protect worktrees created by the other Git installation on Windows or WSL from pruning by @nwparker in https://github.com/stablyai/orca/pull/33103\n* Include the registry addon when relocating the Windows daemon host by @nwparker in https://github.com/stablyai/orca/pull/32194\n* Retry Git reads after transient wsl.exe service errors during distro startup by @nwparker in https://github.com/stablyai/orca/pull/33145\n* Keep the worktree watcher from interrupting a cold WSL distro\u2019s boot by @nwparker in https://github.com/stablyai/orca/pull/33175\n* Avoid synchronous WSL home-directory probes at startup and premature termination of a booting distro by @nwparker in https://github.com/stablyai/orca/pull/33179\n* Preserve unmerged branches even when they have no net file changes by @nwparker in https://github.com/stablyai/orca/pull/32181\n* Use the paired server\u2019s own repository ID when an SSH row shares its path by @nwparker in https://github.com/stablyai/orca/pull/33257\n* Search and offer Linear issues from the same host in Create worktree by @nwparker in https://github.com/stablyai/orca/pull/33270\n* Remove flags that Kimi Code rejects from Source Control AI commands by @nwparker in https://github.com/stablyai/orca/pull/33285\n\n### Developer tools & everyday polish\n\n*Find running dev servers, keep larger command collections, and make the small interactions feel more considered.*\n\n* List a worktree\u2019s detected dev-server ports with `orca ports`, including workspace selection and JSON output by @nwparker in https://github.com/stablyai/orca/pull/33016\n* Explain that direct SSH hosts do not support port detection yet by @nwparker in https://github.com/stablyai/orca/pull/33055\n* Reclaim old dependency installs and generated output across sibling worktrees with manual cleanup by @nwparker in https://github.com/stablyai/orca/pull/32331\n* Include old worktree installs and generated output in automatic development cleanup by @nwparker in https://github.com/stablyai/orca/pull/33277\n* Save quick-command lists with more than 40 entries by @AmethystLiang in https://github.com/stablyai/orca/pull/32972\n* Keep long quick-command dropdowns responsive with virtualization by @AmethystLiang in https://github.com/stablyai/orca/pull/33218\n* Improve Resource Manager tab sizing and sort PTYs by workspace activity by @AmethystLiang in https://github.com/stablyai/orca/pull/33226\n* Keep search highlights visible in long session excerpts by @AmethystLiang in https://github.com/stablyai/orca/pull/33220\n* Enable Lean syntax highlighting by @febyeji in https://github.com/stablyai/orca/pull/31930\n* Highlight Zig source files and diffs by @nwparker in https://github.com/stablyai/orca/pull/32705\n* Group Copilot sessions under their workspace in AI Vault, using the original prompt as the title by @anmol0b in https://github.com/stablyai/orca/pull/31160\n* Preserve transient AI Vault panel state by @just-zzp in https://github.com/stablyai/orca/pull/9419\n* Restore focus after renaming a floating tab by @MimeLyc in https://github.com/stablyai/orca/pull/31510\n* Dismiss notifications without closing modal editors by @degisftw in https://github.com/stablyai/orca/pull/32065\n* Reveal full shortcut titles on hover by @hwantage in https://github.com/stablyai/orca/pull/16806\n* Accept normalized Markdown save confirmations from Linear by @Pr1p in https://github.com/stablyai/orca/pull/30076\n* Keep localized sidebar Send controls from overlapping by @hwantage in https://github.com/stablyai/orca/pull/18474\n* Report conflicts with shortcuts consumed first by the main process by @m-a-king in https://github.com/stablyai/orca/pull/10780\n* Show workspace names in the resume dialog while workspaces load by @brennanb2025 in https://github.com/stablyai/orca/pull/33038\n* Handle dashboard pop-out readiness while the window is hidden by @innocarpe in https://github.com/stablyai/orca/pull/24470\n* List a web client\u2019s paired server once in automations by @nwparker in https://github.com/stablyai/orca/pull/33019\n* Explain when headless terminal creation cannot find a workspace by @nwparker in https://github.com/stablyai/orca/pull/33264\n\n### Tests, builds & maintenance\n\n*Broader behavioral coverage across platforms, remote connections, persistence and mobile; fewer redundant tests; and continued module organization. Local affected-test runs also cache loaded dependencies.*\n\n<details>\n<summary>All test, build and maintenance changes</summary>\n\n* test: exercise real platform, provider, and spool boundaries by @OrcaWin in https://github.com/stablyai/orca/pull/33010\n* refactor: colocate remote runtime passthrough socket by @nwparker in https://github.com/stablyai/orca/pull/33009\n* test: strengthen hook lifecycle and transcript boundaries by @OrcaWin in https://github.com/stablyai/orca/pull/33015\n* test: remove workflow string checks and strengthen provider assertions by @OrcaWin in https://github.com/stablyai/orca/pull/33017\n* test: strengthen stateful assertions and remove redundant checks by @OrcaWin in https://github.com/stablyai/orca/pull/33020\n* refactor: colocate remote runtime error classification by @nwparker in https://github.com/stablyai/orca/pull/33024\n* test: strengthen hook, navigation, and release coverage by @OrcaWin in https://github.com/stablyai/orca/pull/33028\n* test: strengthen hook, release, and mobile transport coverage by @OrcaWin in https://github.com/stablyai/orca/pull/33031\n* refactor: colocate structured session cancellation contract by @nwparker in https://github.com/stablyai/orca/pull/33048\n* refactor: colocate remote runtime socket cleanup by @nwparker in https://github.com/stablyai/orca/pull/33051\n* refactor: colocate orcad migration tests and fixtures by @nwparker in https://github.com/stablyai/orca/pull/33054\n* test: expect legacy failure reads to reuse the published display by @nwparker in https://github.com/stablyai/orca/pull/33061\n* refactor: colocate persistence settings and automation tests by @nwparker in https://github.com/stablyai/orca/pull/33058\n* test: remove duplicate coverage and strengthen boundary assertions by @OrcaWin in https://github.com/stablyai/orca/pull/33047\n* Fix main lint: move native-chat adapter error classes into their own file by @brennanb2025 in https://github.com/stablyai/orca/pull/33046\n* test: consolidate UUID coverage and verify input boundaries by @OrcaWin in https://github.com/stablyai/orca/pull/33073\n* ci: use grep instead of rg in dependency audit prep by @nwparker in https://github.com/stablyai/orca/pull/33074\n* refactor: group Parcel watcher child process ownership by @nwparker in https://github.com/stablyai/orca/pull/33079\n* test(e2e): stop restarted serve hosts with SIGTERM so the PTY daemon survives by @nwparker in https://github.com/stablyai/orca/pull/33067\n* ci: fail when a checked-in test file has no runner by @nwparker in https://github.com/stablyai/orca/pull/33080\n* test: consolidate redundant checks and strengthen boundary coverage by @OrcaWin in https://github.com/stablyai/orca/pull/33082\n* test: consolidate duplicates and strengthen behavioral boundaries by @OrcaWin in https://github.com/stablyai/orca/pull/33088\n* test(chat): respect frame ownership after creation protection expires by @nwparker in https://github.com/stablyai/orca/pull/33091\n* test: consolidate image-send coverage and repair contract assertions by @OrcaWin in https://github.com/stablyai/orca/pull/33093\n* test: consolidate refusal cases and repair boundary coverage by @OrcaWin in https://github.com/stablyai/orca/pull/33098\n* refactor(renderer): group session tab activation and cancellation by @nwparker in https://github.com/stablyai/orca/pull/33100\n* test: remove duplicate mobile coverage and strengthen regression assertions by @OrcaWin in https://github.com/stablyai/orca/pull/33106\n* refactor(renderer): group GitHub task mutation owners by @nwparker in https://github.com/stablyai/orca/pull/33113\n* feat(telemetry): count Windows-drive WSL repos with WSL-made worktrees by @nwparker in https://github.com/stablyai/orca/pull/33104\n* test: trim redundant cases and repair session and hook assertions by @OrcaWin in https://github.com/stablyai/orca/pull/33121\n* refactor(renderer): group GitHub task read and refresh owners by @nwparker in https://github.com/stablyai/orca/pull/33127\n* test: remove redundant cases and strengthen session boundary coverage by @OrcaWin in https://github.com/stablyai/orca/pull/33129\n* test: trim duplicate assertions and repair restore and document coverage by @OrcaWin in https://github.com/stablyai/orca/pull/33133\n* test: trim duplicate search coverage and strengthen file and image