a4af8221fefe1358effaf2c8d7c20cde3582864cae8888b35e4ba32f9","download_count":22,"created_at":"2026-10-16T03:12:14Z","updated_at":"2026-10-16T03:12:15Z"},{"id":646008425,"node_id":"RA_kwDORpCz1s4mgU5p","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":222621768,"digest":"sha256:e601a2396b9824cf2cae1368dd55787b30715d9a8610ea500bd548a028ebe8c9","download_count":35671,"created_at":"2026-10-16T03:30:23Z","updated_at":"2026-10-16T03:30:31Z"},{"id":646008428,"node_id":"RA_kwDORpCz1s4mgU5s","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":214421,"digest":"sha256:b4fc94c2705f1f44af40bd03470225b9884741db24954d8d7207bd8ec2c1cb35","download_count":10195,"created_at":"2026-10-16T03:30:23Z","updated_at":"2026-10-16T03:30:23Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\n## The short version\n\n- **Native chats have their own permission mode.** Choose permissions for each new Claude or Codex chat from Settings \u2192 Chat \u2192 Behavior; existing chats keep the mode they were already using, and changing models no longer resets it.\n- **Native chat sessions are easier to continue.** You can resume large terminal conversations in a new native chat, recover chats whose only work ran in the background after a restart, and see every supported chat provider accurately in Session History.\n- **Claude accounts and Codex chat setup are smoother.** Claude accounts again use separate folders, the sign-in link can be copied, Codex chats require version 0.136.0 or later, and Codex Ultrafast is available as a speed choice.\n- **Browser automation gives your keyboard back reliably.** Agent browser commands target the intended page, and browser popups behave more like Chrome.\n- **Also:** worktree cleanup is safer, read macOS notifications disappear from Notification Center, long chats load better on phones, and cold session-history reads avoid unnecessary reindexing.\n\n---\n\n## Product experience\n\n### UI / workspace\n\n*Safer worktree cleanup, tidier macOS notifications and small translation cleanup.*\n* fix(worktrees): never delete a folder git no longer tracks by @brennanb2025 in https://github.com/stablyai/orca/pull/25075\n* fix(notifications): remove read macOS notifications from Notification Center by pane thread by @Jinwoo-H in https://github.com/stablyai/orca/pull/28425\n* fix(i18n): drop chat-mode keys removed from en.json in #28113 by @nwparker in https://github.com/stablyai/orca/pull/28131\n\n### Orchestration\n\n*Retries no longer leave failed worker starts piling up as live agents.*\n* fix(orchestration): stop retried failed worker starts from piling up live agents by @brennanb2025 in https://github.com/stablyai/orca/pull/27795\n\n### Agents / native chat\n\n*Each Claude and Codex chat keeps its own permission mode, chats are easier to resume and manage, Claude accounts return with safer sign-in, and chat settings and model handling are more consistent.*\n* feat(native-chat): each Claude/Codex chat gets its own permission mode by @brennanb2025 in https://github.com/stablyai/orca/pull/26116\n* fix(native-chat): chats from before permission modes keep the mode they were running with by @brennanb2025 in https://github.com/stablyai/orca/pull/28099\n* fix(native-chat): seed the chat permission default from Claude's and Codex's own arguments by @brennanb2025 in https://github.com/stablyai/orca/pull/28100\n* feat(settings): move Permissions for new chats into the Chat page's Behavior section by @brennanb2025 in https://github.com/stablyai/orca/pull/28212\n* fix(native-chat): store a chat's permission mode on its own, so a model pick can't reset it by @brennanb2025 in https://github.com/stablyai/orca/pull/28268\n* feat(native-chat): require Codex 0.136.0 for chats by @brennanb2025 in https://github.com/stablyai/orca/pull/26684\n* feat(native-chat): offer Codex Ultrafast as a speed choice by @brennanb2025 in https://github.com/stablyai/orca/pull/26962\n* Re-land Claude per-account folders (#24434, #26405) with the upgrade and proxy fixes by @Jinwoo-H in https://github.com/stablyai/orca/pull/26801\n* Add \"Copy sign-in link instead\" for Claude accounts (STA-9912) by @Jinwoo-H in https://github.com/stablyai/orca/pull/26990\n* fix(native-chat): offer resume after restart for chats whose only work was in the background by @brennanb2025 in https://github.com/stablyai/orca/pull/27167\n* fix(native-chat): resume large terminal conversations in a new native chat by @brennanb2025 in https://github.com/stablyai/orca/pull/29056\n* Terminal header button: Resume in New Native Chat replaces Show chat view by @brennanb2025 in https://github.com/stablyai/orca/pull/27184\n* fix(tab-bar): offer Resume in New Native Chat only while the tab's agent is running by @brennanb2025 in https://github.com/stablyai/orca/pull/27520\n* Session History shows OpenCode, Grok, OMP and Pi chats as chats and refuses a second terminal writer by @brennanb2025 in https://github.com/stablyai/orca/pull/27183\n* Session History: resume folder workspace chats in their own folder by @brennanb2025 in https://github.com/stablyai/orca/pull/27209\n* Resume dialog: show a finished resume as a result, not a picker by @brennanb2025 in https://github.com/stablyai/orca/pull/27732\n* Save a new chat's first message during create by @brennanb2025 in https://github.com/stablyai/orca/pull/26332\n* fix(native-chat): settle a reply cut off by a server restart by @brennanb2025 in https://github.com/stablyai/orca/pull/26460\n* Open a chat visual in its own tab instead of the sidebar by @brennanb2025 in https://github.com/stablyai/orca/pull/26728\n* Let a Codex chat stop a command it left running in the background by @brennanb2025 in https://github.com/stablyai/orca/pull/26780\n* fix(native-chat): preserve running subagent rows in long chats by @brennanb2025 in https://github.com/stablyai/orca/pull/26798\n* A new Pi chat names the model it will run on its first frame by @brennanb2025 in https://github.com/stablyai/orca/pull/26821\n* Keep Chat UI users with a Terminal default on the terminal, with a chat mode switch in the upgrade tip by @brennanb2025 in https://github.com/stablyai/orca/pull/26915\n* Floating-workspace chats of every native-chat agent keep links in the folder they started in by @brennanb2025 in https://github.com/stablyai/orca/pull/26981\n* Every agent reports its learned default model once, when a chat starts by @brennanb2025 in https://github.com/stablyai/orca/pull/26982\n* Let a Grok chat list and stop the commands it left running in the background by @brennanb2025 in https://github.com/stablyai/orca/pull/27022\n* Let a Codex chat stop a sub-agent from the background-tasks strip by @brennanb2025 in https://github.com/stablyai/orca/pull/27026\n* fix(native-chat): a new chat's model and effort pickers match their first frame before the agent starts by @brennanb2025 in https://github.com/stablyai/orca/pull/27031\n* Native chat: every agent launches through one composed launch path by @brennanb2025 in https://github.com/stablyai/orca/pull/27204\n* Edit agent launch settings on the workspace host by @brennanb2025 in https://github.com/stablyai/orca/pull/26479\n* One shared subagent tracker for Claude, Codex and Grok chat rows by @brennanb2025 in https://github.com/stablyai/orca/pull/27228\n* Native chat: read one saved row per subagent (part 1 of 2) by @brennanb2025 in https://github.com/stablyai/orca/pull/27914\n* feat(chat): host writes one saved row per subagent by @brennanb2025 in https://github.com/stablyai/orca/pull/27947\n* feat(settings): move Chat UI's chat settings from Experimental to the Chat page by @brennanb2025 in https://github.com/stablyai/orca/pull/28050\n* fix(tab-bar): native chat tabs show their recorded provider, not one guessed from the title by @brennanb2025 in https://github.com/stablyai/orca/pull/28082\n* Replace chat upgrade switch with primary Enable Now button by @nwparker in https://github.com/stablyai/orca/pull/28113\n* Make Enable Now the full-width action in the chat upgrade tip by @brennanb2025 in https://github.com/stablyai/orca/pull/28199\n\n### Remote server / SSH\n\n*Paired devices are identified by their device ID instead of a credential.*\n* native chat: identify a paired device by its device id, never its credential by @brennanb2025 in https://github.com/stablyai/orca/pull/26777\n\n### Browser\n\n*Popups follow Chrome\u2019s behavior more closely, while agent browser actions stay focused on the intended page and return the keyboard when they finish.*\n* Open links and window.open in Orca tabs the way Chrome does by @Jinwoo-H in https://github.com/stablyai/orca/pull/26976\n* Fix browser login popups and menu actions in native windows by @AmethystLiang in https://github.com/stablyai/orca/pull/28474\n* Auto-hide menu bar in web popups and re-layout when revealed by @AmethystLiang in https://github.com/stablyai/orca/pull/28388\n* fix(browser): agent bringToFront and activateTarget no longer take your keyboard (1/3) by @nwparker in https://github.com/stablyai/orca/pull/28452\n* fix(browser): agent keys and text go to the page, never into your terminal (2/3) by @nwparker in https://github.com/stablyai/orca/pull/28453\n* fix(browser): agent clicks give your keyboard back (3/3) by @nwparker in https://github.com/stablyai/orca/pull/28454\n* fix(browser): require a target for ambiguous keypress commands by @nwparker in https://github.com/stablyai/orca/pull/28221\n* fix(browser): refuse web pages on the agent-browser CDP proxy by @OrcaWin in https://github.com/stablyai/orca/pull/27415\n\n### GitHub / source control\n\n*AI commit messages now start from the same shell environment that chats use.*\n* Start AI commit messages from the same shell environment chats use by @Jinwoo-H in https://github.com/stablyai/orca/pull/26808\n\n### Performance\n\n*Windows notifications no longer freeze Orca, and cold session-history reads skip unchanged transcript reindexing.*\n* perf(notifications): stop every Windows notification from freezing Orca by @brennanb2025 in https://github.com/stablyai/orca/pull/27731\n* Skip reindexing unchanged transcripts on cold session list reads by @AmethystLiang in https://github.com/stablyai/orca/pull/28798\n\n### Mobile\n\n*Long chats preserve each update within its limit, remember the reader\u2019s place, and open every supported native-chat provider on the phone.*\n* fix(native-chat): load long chats on the phone by keeping every update within its limit by @Jinwoo-H in https://github.com/stablyai/orca/pull/28203\n* fix(mobile): keep the chat where the reader scrolled to by @AmoabaKelvin in https://github.com/stablyai/orca/pull/28413\n* fix(mobile): open Grok, OpenCode, OMP and Pi chats on the phone by @brennanb2025 in https://github.com/stablyai/orca/pull/27212\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.224...v1.4.227\n\n\n","reactions":{"total_count":26,"+1":0,"-1":0,"laugh":0,"hooray":17,"confused":0,"heart":9,"rocket":0,"eyes":0},"mentions_count":6}
