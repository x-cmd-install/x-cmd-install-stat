om/stablyai/orca/pull/31529\n* Sidebar: land the switch-on fixes from the flip branch on main, switch still off by @Jinwoo-H in https://github.com/stablyai/orca/pull/31466\n* Editor tabs main-first: the window asks main for every editor tab change and draws only main's update (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31438\n* Sidebar P2: main publishes without waiting on git, and every source announces its changes (inert) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31513\n* Main closes, renames, sleeps and starts new tabs' terminals itself, with or without a window (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31571\n* fix(sidebar): keep each host's activity, PR lane and retention apart for a same-id workspace (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31517\n* feat(sidebar): one lifecycle line per workspace in main, with in-progress hints (switch-gated) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31553\n* Layout groundwork (switched off): main starts and restores every pane, and the window only attaches and paints the host's history by @Jinwoo-H in https://github.com/stablyai/orca/pull/31567\n* Browser, chat and simulator tabs main-first: the window asks main for each change and draws only main's update (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31516\n* A phone keeps a desktop's untitled markdown tab read-only (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31667\n* Main titles agent tabs and applies phone tab moves itself, and tab moves name the tab they follow (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31812\n* Layout groundwork (switched off): main tells the window whether its start resumed a pane's agent, so the restored banner and reopen count come back by @Jinwoo-H in https://github.com/stablyai/orca/pull/31908\n* Layout-owner builds: a phone's tab move is always the server's own; no ghost editor tabs after restart by @Jinwoo-H in https://github.com/stablyai/orca/pull/31925\n* A paired desktop keeps the tabs it created in a server workspace drawn from the server's layout (switch-on builds only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31853\n* A browser tab opened in a server workspace drawn from the server's layout stays open (switch-on builds only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31898\n* A paired desktop's tab moves, splits, resizes, props and renames in a server workspace go to the server's layout (switch-on builds only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31714\n* A paired desktop's pane drag-out, handle-less split and default-tabs mark reach a server's own layout (dark, layout-owner build only; stacked on #31714) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31869\n* A phone's new terminal lands after the tab it names, and its split selects the moved tab as the window does (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31924\n* A server-hosted browser tab opened in a server workspace drawn from frames survives other changes to that workspace (switch-on builds only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/31920\n* A paired desktop hands its editor tabs to the server before drawing a server workspace from the server's layout (switch-on builds only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/32088\n* A chat started in a server workspace drawn from the server's layout stays where you opened it (switch-on builds only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/32003\n\n</details>\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.237...v1.4.238\n","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":1,"rocket":3,"eyes":0},"mentions_count":8}
