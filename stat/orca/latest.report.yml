achable by @nwparker in https://github.com/stablyai/orca/pull/31663\n* Keep desktop browser tabs that aren’t loaded visible and closable on the phone by @nwparker in https://github.com/stablyai/orca/pull/31665\n* Keep phone voice settings in the order you change them by @nwparker in https://github.com/stablyai/orca/pull/31691\n* Stop review notes on the phone disappearing, or coming back after you delete them by @nwparker in https://github.com/stablyai/orca/pull/31699\n* Clear terminal output on the phone only after the computer accepts Clear by @nwparker in https://github.com/stablyai/orca/pull/31703\n* Keep new browser typing on the phone when an earlier send fails by @nwparker in https://github.com/stablyai/orca/pull/31710\n* Release a closed browser pane’s pointer queue on the phone by @OrcaWin in https://github.com/stablyai/orca/pull/34825\n* Skip ranking file search results the phone no longer needs by @OrcaWin in https://github.com/stablyai/orca/pull/34837\n* Cap the phone’s file search cache after empty searches by @OrcaWin in https://github.com/stablyai/orca/pull/34841\n* Keep cached workspace rows for servers that fail to load on the phone by @OrcaWin in https://github.com/stablyai/orca/pull/34843\n* Keep the text size you pick while the phone app is still loading by @OrcaWin in https://github.com/stablyai/orca/pull/34846\n* Refuse to open PDFs from hidden pages on the phone by @OrcaWin in https://github.com/stablyai/orca/pull/34869\n* Drop outdated file preview reads and permission retries on the phone by @OrcaWin in https://github.com/stablyai/orca/pull/34872\n* Skip preparing diff replies the phone has abandoned by @OrcaWin in https://github.com/stablyai/orca/pull/34873\n* Release skill scans from old phone connections by @OrcaWin in https://github.com/stablyai/orca/pull/34949\n* Refresh custom shortcuts when you return to a session on the phone by @OrcaWin in https://github.com/stablyai/orca/pull/34951\n* Keep code, quotes and code blocks through rich 