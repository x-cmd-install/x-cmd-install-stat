33531\n* feat(wsl-host): a paired phone reaches the desktop's WSL host and never starts its distro (E6) by @nwparker in https://github.com/stablyai/orca/pull/33911\n* ci: run PR unit shards on free hosted ARM as 12 shards by @OrcaWin in https://github.com/stablyai/orca/pull/34906\n* chore(wsl): keep the Sleep folder and bridge-exit lines in the local trace by @nwparker in https://github.com/stablyai/orca/pull/35378\n* test: remove 17 low-value cases and seven suites by @OrcaWin in https://github.com/stablyai/orca/pull/35394\n* fix(wsl-mover): say a move waits for a project coming back, not another move by @nwparker in https://github.com/stablyai/orca/pull/35406\n* i18n(wsl-mover): translate the project mover into every UI language by @nwparker in https://github.com/stablyai/orca/pull/35414\n* refactor(shared): colocate native chat turn row attribution by @nwparker in https://github.com/stablyai/orca/pull/35425\n* fix(wsl-host): Start connects a stopped distro once and names it when it fails by @brennanb2025 in https://github.com/stablyai/orca/pull/35438\n* fix(wsl-mover): say when a refused undo left the host's terminals asleep by @nwparker in https://github.com/stablyai/orca/pull/35449\n* Update AGENTS.md by @nwparker in https://github.com/stablyai/orca/pull/35456\n* test(worktree): check concurrent create names, not which create reached Git first by @nwparker in https://github.com/stablyai/orca/pull/35457\n* refactor(runtime): move the durable prompt-delivery probe out of orca-runtime-get-status.ts by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35460\n* chore: format AGENTS.md so main's format check passes by @nwparker in https://github.com/stablyai/orca/pull/35464\n* i18n(wsl-mover): translate the undo-running refusal into every UI language by @nwparker in https://github.com/stablyai/orca/pull/35473\n* chore(mobile): bump to 0.0.60 and Android versionCode 24 by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35505\n* fix(scripts): show check:cha