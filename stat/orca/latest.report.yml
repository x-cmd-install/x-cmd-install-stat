ate":"uploaded","size":236261696,"digest":"sha256:20fdbd6ffaceb0a59e32c1bba0551d2b57684470fd5827d3f6d3c9d47afab08b","download_count":26030,"created_at":"2026-11-21T17:56:09Z","updated_at":"2026-11-21T17:56:17Z"},{"id":776396042,"node_id":"RA_kwDORpCz1s4uRt0K","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":240091,"digest":"sha256:8586c8d217e37437f8ca2ecc243929a57a7c52247289394a50033788b03c630d","download_count":5909,"created_at":"2026-11-21T17:56:09Z","updated_at":"2026-11-21T17:56:09Z"}],"body":"Following [1.4.268](https://github.com/stablyai/orca/releases/tag/v1.4.268), here is the next round of Orca. Bots learn eight more agents, and the phone app catches up with the desktop.\n\n## Bots on eight more agents, a fuller phone & a quieter Mac ✨\n\nBots can now run on Kiro, Kimi Code, Auggie, Gemini CLI, Kilo Code, MiMo Code, Droid and Goose, Chat opens more agents directly, and the phone app can answer, approve and set up almost everything the desktop can.\n\n- 🤖 **Run bots on more agents:** Bots can run on Kiro, Kimi Code, Auggie, Gemini CLI, Kilo Code, MiMo Code, Droid and Goose. Chat can open Kiro, Auggie and Goose too, and Kiro chats run your own hooks.\n- 📱 **Do more from your phone:** Answer an agent's questions and Google or Composio setup cards from its chat, review tool approvals and access requests in Needs you, manage an agent's tools and webhooks, start a new chat from +, and browse a group's threads and items. These need the matching mobile build.\n- 🔐 **Antigravity, your way:** Google account users can pick Orca's built-in Google sign-in or the agy agent, and agy has its own Sign in in Settings.\n- 💤 **A quieter Mac when idle:** Idle Mac terminals use less CPU, and Git work starts on the background process worker on macOS and Linux.\n- 🧭 **Clearer chats:** Older messages show calendar dates, Resume stands out in a paused queue, and Claude chats that settings block from Full access say so and pick the closest allowed mode.\n\n## About Orca Bots (Beta) <img src=\"https://raw.githubusercontent.com/stablyai/orca/main/src/shared/bot-mascots/A1.webp\" alt=\"Orca\" width=\"36\" height=\"36\" valign=\"middle\" />\n\nOrca Bots work like first-class teammates: they now run on many more agents, hand work to each other in group rooms, and send results you can actually open.\n\n- <img src=\"https://raw.githubusercontent.com/stablyai/orca/main/src/shared/bot-mascots/A1.webp\" alt=\"Orca\" width=\"28\" height=\"28\" valign=\"middle\" /> **Eight more agents behind your bots:** Kiro, Kimi Code, Auggie, Gemini CLI, Kilo Code, MiMo Code, Droid and Goose join the agents a bot can run on.\n- Links show progress while Bots publish them, and you can reject an access request right from its Give access dialog.\n- 🤝 **Hand-offs in group rooms:** When a bot names another member as @Name in its reply, that member picks up the turn.\n- 📎 **Results you can open:** Bots share a link, attach the file or give the content instead of a path on their own computer, and local paths in Slack messages become readable labels.\n- 🧩 **One skills folder per bot:** A bot's own skills live in one agent-neutral folder that every agent it runs on can use.\n\n## Coming soon\n\n- Antigravity bug fixes\n- More connectors\n- Easier moving of bots between different machines\n- More performance improvements\n- Fix bots stall issues under heavy task load\n- Improved PR review workflow\n- More plugin API\n- Sidebar UX improvements\n\n---\n\n## What's Changed\n\n### 🤖 Bots, connectors & access\n\n*Bots can run on Kiro, Kimi Code, Auggie, Gemini CLI, Kilo Code, MiMo Code, Droid and Goose, hand turns to each other with @Name in group rooms, and share results as links or attachments. Bot Settings rows fit on one line, connector icons match, and access requests can be rejected from their confirm.*\n\n* Never overwrite user Cursor/Hermes files; keep new-agent bots across a rollback by @OrcaWin in https://github.com/stablyai/orca/pull/45466\n* Quick replies bind to their question, bounded avatar sync, offscreen loop pause (1.4.267 scan slice G) by @OrcaWin in https://github.com/stablyai/orca/pull/45504\n* Stop generation when the requesting document ends by @OrcaWin in https://github.com/stablyai/orca/pull/45508\n* Let bots run on Kiro by @LDH1103 in https://github.com/stablyai/orca/pull/45533\n* One agent-neutral skills folder for a managed agent's own skills by @Jinwoo-H in https://github.com/stablyai/orca/pull/45822\n* A managed agent's @Name reply hands the turn to that member by @Jinwoo-H in https://github.com/stablyai/orca/pull/45845\n* Use 32 px avatars in the sidebar by @AmethystLiang in https://github.com/stablyai/orca/pull/45908\n* Explain missing provider details in historical runs by @AmethystLiang in https://github.com/stablyai/orca/pull/45910\n* Let bots run on Kimi Code by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45911\n* Let bots run on Auggie by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45963\n* Let bots run on Gemini CLI by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45985\n* Show progress while publishing or updating a link by @AmethystLiang in https://github.com/stablyai/orca/pull/45989\n* Deliver bot reports as links or attachments and redact local Slack paths by @AmethystLiang in https://github.com/stablyai/orca/pull/45991\n* Say Slack threads with an Orca chat keep that chat's agent by @brennanb2025 in https://github.com/stablyai/orca/pull/45992\n* Stopping a share never clears another agent's saved picks by @Jinwoo-H in https://github.com/stablyai/orca/pull/46004\n* Drop the orange outline from the item's asking message by @AmethystLiang in https://github.com/stablyai/orca/pull/46005\n* Let bots run on Kilo Code and MiMo Code by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46018\n* Draw every connector icon as one 20px bare mark by @AmethystLiang in https://github.com/stablyai/orca/pull/46031\n* Contract for a resuming usage-limit pause and an unconfirmed outcome by @Jinwoo-H in https://github.com/stablyai/orca/pull/46032\n* Let bots run on Droid by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46040\n* Reply rows can be owed to a continuation, and a stamped Slack turn never also sends its full end by @Jinwoo-H in https://github.com/stablyai/orca/pull/46044\n* Open the regular New bot dialog from a shared link by @AmethystLiang in https://github.com/stablyai/orca/pull/46049\n* Reject an access request from its Give access confirm by @AmethystLiang in https://github.com/stablyai/orca/pull/46051\n* One-line Bot Settings rows and an icon Share button by @AmethystLiang in https://github.com/stablyai/orca/pull/46052\n* Tell the thread when a merged quiet turn would drop its reply by @AmethystLiang in https://github.com/stablyai/orca/pull/46062\n* Let bots run on Goose by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46077\n* Warn that deleting a webhook also deletes its automation when nothing else starts it by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46085\n* Refuse create and connector offer cards from a bot group room by @nwparker in https://github.com/stablyai/orca/pull/46136\n* Write a bot's Kimi instructions only through real folders in its home by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46141\n* Step between runs with left/right arrows on the run page by @AmethystLiang in https://github.com/stablyai/orca/pull/46143\n* One-line recommended question option with a star by @AmethystLiang in https://github.com/stablyai/orca/pull/46157\n* Publish public artifact links only on an explicit owner request (STA-16885) by @OrcaWin in https://github.com/stablyai/orca/pull/46428\n\n### 💬 Native chat\n\n*Chat opens Kiro, Auggie and Goose, Kiro chats run your hooks, and @ finds bots by their full names. Older messages show dates, Resume stands out in a paused queue, and Claude chats explain when settings block Full access.*\n\n* Open Kiro in Chat over ACP by @LDH1103 in https://github.com/stablyai/orca/pull/39769\n* Claude chats set to Full access fall back to Approve for me or Ask when Claude's settings block it, and say so by @brennanb2025 in https://github.com/stablyai/orca/pull/45068\n* Let @ match a bot's full name with its spaces, so paired-server bots can be tagged by @AmethystLiang in https://github.com/stablyai/orca/pull/45834\n* Run Auggie in Chat over its ACP server by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45962\n* Show calendar dates on older messages and activity by @AmethystLiang in https://github.com/stablyai/orca/pull/46007\n* Run user hooks in Chat by @LDH1103 in https://github.com/stablyai/orca/pull/46030\n* Use one floating bot identity in Home and side chats by @AmethystLiang in https://github.com/stablyai/orca/pull/46034\n* Run Goose in Chat over its ACP server by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46039\n* Show the startup config warning once in native chat by @innocarpe in https://github.com/stablyai/orca/pull/46103\n* Drop the Jump to latest rim, raise its fill instead by @AmethystLiang in https://github.com/stablyai/orca/pull/46104\n* Show the changed-files card for Pi edit and write by @innocarpe in https://github.com/stablyai/orca/pull/46130\n* Make Resume stand out in the paused message queue by @AmethystLiang in https://github.com/stablyai/orca/pull/46145\n\n### 🧠 Agents, models & accounts\n\n*Antigravity users can choose between Orca's Google sign-in and agy, System default Claude usage stays on the right row, and Codex, Copilot, Cursor and OMP launch and notify more reliably.*\n\n* Stage a provider-aliased skill from its real folder when sharing by @Pr1p in https://github.com/stablyai/orca/pull/45966\n* Show host System default Claude usage while a saved account is selected by @innocarpe in https://github.com/stablyai/orca/pull/46002\n* Opening rule uses its own exclusive file and removes only unchanged bytes by @Jinwoo-H in https://github.com/stablyai/orca/pull/46028\n* Send no MCP servers when the OMP settings file can't be read by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46042\n* Keep an idle agent's session for its open pane past the 7-day status TTL by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46043\n* Show this turn's reply in Copilot terminal notifications, not the previous one by @nwparker in https://github.com/stablyai/orca/pull/46071\n* Keep System default Claude usage on its row after switching to a saved account by @nwparker in https://github.com/stablyai/orca/pull/46099\n* Pin Google's ACP server 1.5.2 by @nwparker in https://github.com/stablyai/orca/pull/46101\n* Read each Claude login once and show System default usage on the phone by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46119\n* Keep the server and Orca's sign-in; let Google-account users choose it, refuse chats without their credential, agy Sign in in Settings by @nwparker in https://github.com/stablyai/orca/pull/46125\n* Add the PowerShell call operator to a quoted Codex path in the startup image wrapper by @nwparker in https://github.com/stablyai/orca/pull/46153\n\n### 🤝 Workers & coordination\n\n*Ended workers open from the latest terminal list, and the coordinator hears when a worker's brief may not have been submitted.*\n\n* Open ended workers from the latest terminal inventory by @AmethystLiang in https://github.com/stablyai/orca/pull/45919\n* Tell the coordinator when a worker's brief may not have been submitted by @Jinwoo-H in https://github.com/stablyai/orca/pull/46155\n\n### 📱 Phone & mobile\n\n*Answer questions and setup cards from an agent's chat, gather approvals in Needs you, manage an agent's tools, webhooks and settings, start new chats from +, and browse a group's threads and items. These require a corresponding mobile build.*\n\n* Stop duplicate phone pushes from a desktop mirroring another host by @AmoabaKelvin in https://github.com/stablyai/orca/pull/43760\n* Ask card shows a spinner on the control that's sending, with haptics by @raymondmuller in https://github.com/stablyai/orca/pull/45922\n* Answer an agent's item questions in the chat answer card by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45923\n* Answer Google setup from the agent's chat on the phone by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45951\n* Gather tool approvals and access requests in Needs you by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45953\n* Manage an agent's webhooks from its settings by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45964\n* Next/previous item, photos in comments, and Retry for a comment that didn't send by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45984\n* Manage an agent's tools in its settings, with sign-in by pasting the address back by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46008\n* Show a new agent's setup steps and Try again in its Home Chat by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46011\n* Send a wait's run that couldn't start again from the chat by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46025\n* Start a new Home Chat or a side chat on any agent from + by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46037\n* Release a Google setup card's RPC client when its last card leaves by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46061\n* Show waiting workers, Claude's countdown and Open worker on a worker approval by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46067\n* Answer Composio setup and import cards from the agent's chat on the phone by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46072\n* The agent's Settings on the phone match the desktop's list and pages by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46087\n* Threads and a combined Items list in a group's room by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46093\n* Keep loading a session's tabs until the desktop has sent them by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46118\n* Hand a workspace to an agent from its long-press menu by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46134\n* Stop Home crashing with an update loop when a second Home opens over a hidden one by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46147\n* Keep a failed item comment with the host it was written on by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46148\n* Show who asked for access on the host row and open the request from its push by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46154\n\n### 🖥️ SSH, WSL & remote hosts\n\n*Bots on a paired server show the server name, and Google setup for a managed agent on a paired server works end to end.*\n\n* Show the server name in remote bot headers by @AmethystLiang in https://github.com/stablyai/orca/pull/45909\n* Google setup for a managed agent on a paired server works end to end by @Jinwoo-H in https://github.com/stablyai/orca/pull/45935\n\n### 🌐 Browser\n\n*WhatsApp Web loads, saved usernames fill when the password box can't, window.open keeps its opener, and downloads reuse an existing folder.*\n\n* Reuse an existing workspace browser download directory by @innocarpe in https://github.com/stablyai/orca/pull/45853\n* Drop the Orca token from the browser user agent so WhatsApp Web loads by @AmoabaKelvin in https://github.com/stablyai/orca/pull/45982\n* Keep window.opener for a clicked window.open(url, '_blank') by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46010\n* Fill a saved username when its password box is not fillable by @innocarpe in https://github.com/stablyai/orca/pull/46095\n\n### 🗂️ Workspaces, sidebar & tabs\n\n*Files and Agents reopen where they were, only the focused split underlines its active tab, and workspace creation and deletion are safer.*\n\n* Refuse to delete a different checkout at a removal leftover by @OrcaWin in https://github.com/stablyai/orca/pull/45506\n* Name --base-branch when no default base resolves by @innocarpe in https://github.com/stablyai/orca/pull/45986\n* Avoid parenting new workspaces under a home folder by @AmethystLiang in https://github.com/stablyai/orca/pull/46003\n* Reopen Files and Agents on what they showed instead of reloading by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46089\n* Underline only the focused split group's active tab by @AmethystLiang in https://github.com/stablyai/orca/pull/46156\n\n### ⌨️ Terminals\n\n*Idle Mac terminals use less CPU, and file links honor line numbers and ranges.*\n\n* Idle Mac terminals use less CPU by @brennanb2025 in https://github.com/stablyai/orca/pull/45713\n* Honor #L<line> and line ranges in OSC 8 file links by @bbingz in https://github.com/stablyai/orca/pull/46105\n\n### 📝 Editor & files\n\n*Filled-in PDF form values survive a failed later read.*\n\n* Keep filled-in PDF form values when a later range read fails by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46041\n\n### 🔀 Source control & integrations\n\n*Stage All works with shared links inside submodules, checks awaiting approval show as pending, and Jira shows the fresher status.*\n\n* Refreshed Jira status on open; Help links respect Settings discard by @OrcaWin in https://github.com/stablyai/orca/pull/45505\n* Keep Stage All working when a shared link lives inside a submodule by @Pr1p in https://github.com/stablyai/orca/pull/45988\n* Show checks awaiting approval as pending, not failed by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46069\n* Rerun Codex on its own default model when the forced default is unavailable by @nwparker in https://github.com/stablyai/orca/pull/46128\n\n### 🎨 Settings, plugins & languages\n\n*Plugin marketplace lists load from cache sooner and delayed-update lookups fall back before they stall.*\n\n* Resolve 1.4.267 scan findings R23-R27, R31, R32, R35, R36, R40 by @OrcaWin in https://github.com/stablyai/orca/pull/45503\n\n### ⚡ Performance & reliability\n\n*Git starts on the background process worker, Kiro chats skip extra status work, the CLI reports a sandbox-blocked runtime file plainly, and a failed background save is reported once.*\n\n* Start captured Git on the process worker on macOS and Linux by @brennanb2025 in https://github.com/stablyai/orca/pull/45031\n* Show a failed background save once, not twice, right after launch by @brennanb2025 in https://github.com/stablyai/orca/pull/45998\n* Report a denied orca-runtime.json read as runtime_access_denied on RPC paths by @innocarpe in https://github.com/stablyai/orca/pull/46035\n* Skip Orca's status hook work in Kiro chats by @AmoabaKelvin in https://github.com/stablyai/orca/pull/46111\n\n### 🛠️ Tests, CI & maintenance\n\n*Windows test fixes, release CI hardening, README updates and lint cleanup. No user-facing changes.*\n\n* Update pull request guidance. by @AmethystLiang in https://github.com/stablyai/orca/pull/42518\n* New bots hero and an Orca Bots feature row by @AmethystLiang in https://github.com/stablyai/orca/pull/45957\n* Make bot, skill and ACP tests pass on Windows hosts by @Pr1p in https://github.com/stablyai/orca/pull/45970\n* Make native-chat and journal tests pass on unelevated Windows by @Pr1p in https://github.com/stablyai/orca/pull/45976\n* Close topology stores before deleting their temp directories by @Pr1p in https://github.com/stablyai/orca/pull/46013\n* Bring orca-runtime-bots.ts back under max-lines by @Jinwoo-H in https://github.com/stablyai/orca/pull/46033\n* Update README downloads badge by @buf0-bot[bot] in https://github.com/stablyai/orca/pull/46050\n* Wait for SignPath artifacts to be listed before submitting by @AmethystLiang in https://github.com/stablyai/orca/pull/46070\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.268...v1.4.269\n\n\n\n\n\n","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":12}
