/pull/28049\n* Stop is saved before it acts, and a late or repeated Stop does nothing by @brennanb2025 in https://github.com/stablyai/orca/pull/27076\n* Show context usage in Codex chats by @AmoabaKelvin in https://github.com/stablyai/orca/pull/28084\n* Slash-menu command names no longer look oversized by @brennanb2025 in https://github.com/stablyai/orca/pull/28461\n* Copy the Codex TOML parser into packaged Orca by @nwparker in https://github.com/stablyai/orca/pull/28416\n* Combine model and options into one picker by @AmoabaKelvin in https://github.com/stablyai/orca/pull/27972\n* Phone Stop reaches a message the agent hasn't answered; unreadable task list reports unconfirmed by @brennanb2025 in https://github.com/stablyai/orca/pull/28243\n* A Claude model that's gone switches to the list's default when you send by @brennanb2025 in https://github.com/stablyai/orca/pull/27826\n* Store a chat's permission mode on its own, so a model pick can't reset it by @brennanb2025 in https://github.com/stablyai/orca/pull/28268\n* Pass the clock to a recorded option pick by @nwparker in https://github.com/stablyai/orca/pull/28571\n* Drop the duplicate now key left by crossing fixes by @nwparker in https://github.com/stablyai/orca/pull/28599\n* Questions an agent sends as permission requests are never auto-answered by @brennanb2025 in https://github.com/stablyai/orca/pull/28449\n* Resume in New Native Chat for OpenCode by @brennanb2025 in https://github.com/stablyai/orca/pull/28072\n* Native chat: a message stopped before the agent got it reaches the agent with your next send by @brennanb2025 in https://github.com/stablyai/orca/pull/27623\n* Native chat: record which agent run wrote each journal item (1/5, rebuild of #26867) by @brennanb2025 in https://github.com/stablyai/orca/pull/28092\n* Resume in New Native Chat for Pi by @brennanb2025 in https://github.com/stablyai/orca/pull/28080\n* Share a chat visual from the chat by @brennanb2025 in https://github.com/stablyai/orca/pull/2