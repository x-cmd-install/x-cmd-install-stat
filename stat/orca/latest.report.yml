31bf4c1feaee7d5728424da3d3936185e625487029218140c351","download_count":6,"created_at":"2026-11-04T23:40:05Z","updated_at":"2026-11-04T23:40:06Z"},{"id":711374547,"node_id":"RA_kwDORpCz1s4qZrbT","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":209333232,"digest":"sha256:a3754ff107fee27a90f9057b44a588773c42133c8b08be913eeea6aaad84fdf9","download_count":14293,"created_at":"2026-11-04T23:52:27Z","updated_at":"2026-11-04T23:52:34Z"},{"id":711374548,"node_id":"RA_kwDORpCz1s4qZrbU","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":210322,"digest":"sha256:6e0f54495d6545ddd0d499e68271c905b13ce0480e0d39c7c03f87a518b4d2d6","download_count":4076,"created_at":"2026-11-04T23:52:27Z","updated_at":"2026-11-04T23:52:27Z"}],"body":"## Easier setup, more control over chats & tidier workspaces ✨\n\n- 🎛️ **Choose Chat or Terminal from the start:** Onboarding now lets you pick Chat UI or Terminal, then choose an agent and install the skills for that setup.\n- 💬 **Keep control of conversations:** Preserve chat inputs through uncertain delivery and Stop, choose whether sending moves the scroll position, and decide when idle chat agents stop—or keep them running.\n- 🗂️ **Keep projects tidy:** Adding a project keeps discovered worktrees hidden, while create and clone handle symlinked parent folders consistently.\n- 📝 **Make reading and editing your own:** Set the default Markdown view, optionally insert a final newline on save, and adjust chat width from pane headers.\n- 📱 **A clearer phone Home:** The updated phone app separates Feed, Usage, Automations and Settings, shows more agent usage, and names recent conversations.\n- 🧩 **Small fixes across daily work:** Keep terminal scroll position on input, open file links in their workspace, render Mermaid in PR comments, and close floating browser splits from their own toolbar.\n\n## Highlights\n\n- **Setup & skills:** Pick Chat or Terminal during onboarding, use the updated agent picker and theme step, and install Chat skills for the selected provider on this computer. Empty newly added projects can open the chosen Chat agent when that route is supported.\n- **Chat behavior:** Inputs and queued follow-ups are retained through uncertain delivery and Stop. New settings control scroll position when sending and when idle chat agents stop. Loaded chat images stay visible across scrolling and workspace switches, and Pi compaction holds sends until it finishes.\n- **Agent choices:** Managed Claude accounts keep later `/model` and effort choices when the defaults have not changed. Claude fallback is shown without changing saved model choices; OpenCode effort follows the selected model, and Claude chat adds Ultracode effort.\n- **Projects & navigation:** Adding a project keeps discovered worktrees hidden. Project creation and cloning resolve symlinked parents consistently; manual workspace order and type-to-search in the new-workspace agent picker receive fixes.\n- **Editor & browser:** Choose the default Markdown view, enable Insert Final Newline on save, preserve chat HTML appearance in file previews, and close a floating browser split without closing the terminal beside it.\n- **Phone:** The updated app adds Home tabs, usage for more agents and conversation names in Jump back in. It also improves terminal input, effort controls, HTML previews and Android theme/navigation behavior.\n- **Automation & notifications:** Automations use the shared agent picker, accept Pi model/thinking arguments and refresh when projects change. Interrupted terminal automation runs are recorded as failed, acknowledged desktop alerts clear, and OpenCode completion notifications handle OSC 7501.\n\n## Compatibility & upgrade notes\n\n- **Existing setup choices:** The new onboarding choices use existing surface and agent preferences. This release does not reset everyone's default agent or switch every existing workspace to Chat. A workspace with existing tabs keeps them; the new-project Chat path depends on a supported runtime and agent.\n- **Chat settings:** Scroll-on-send and idle-agent stopping are configurable. Choose **Never** if you want idle chat agents to remain running; stopping an idle agent is separate from deleting the conversation.\n- **Managed Claude accounts:** Unchanged defaults stop overwriting later account choices after settings synchronization. This does not recover choices overwritten by an older build, and changed default keys still apply.\n- **Paired servers:** Improvements to paired-server file links use the new capability when available; older servers retain their existing path. There is no new minimum server version for the setup changes. GitHub issue limitations with older servers remain below.\n- **Phone changes:** Native phone UI and Android fixes require an updated Orca Mobile app as well as a compatible desktop or server. The mobile changes are included in Orca Mobile 0.0.64; updating desktop alone does not install a native phone release.\n- **Orchestration panel:** The experimental panel and its setting are temporarily disabled again. Orchestration messaging changes are separate from availability of that panel.\n\n## Known issues\n\n**Chat setup with no default agent:** With Chat UI enabled and the default agent cleared in Settings, Setup Guide's **Install skills** button can remain disabled without an explanation. Choose a default agent, such as Claude, before installing.\n\n**Shell history after a cold restart:** Some Mac shell panes can reopen without showing their previous output after a full app and terminal restart. This class of failure was also observed on v1.4.248; the cause remains unresolved. This release does not claim to fix it.\n\n**GitHub issues on older paired servers:** Opening an issue through a repository or URL can leave title, label and assignee editing unavailable. Phone issue Close/Reopen can also refuse an older server or intermediary. **Open on GitHub** remains available.\n\n**Saved chat storage & performance:** Live-history compaction remains paused, so storage can grow as conversations continue. This release does not claim to remove every source of chat stalls. Hook changes reduce subprocess work, but whole-app latency, CPU and heap improvements were not measured.\n\n**Long update delays:** With a 14- or 30-day delay, a release can leave the update feed before it becomes eligible. None and **Skip Delay Once** remain available.\n\n**Plugin command replacements:** A plugin replacing a built-in command can still finish after Orca has used the normal command instead, causing the action to happen twice.\n\n---\n\n## Product experience\n\n### Native chat\n\n*Keep inputs available through interrupted delivery, adjust chat behavior, and make conversations easier to read.*\n\n* Add chat width settings to pane headers by @AmethystLiang in https://github.com/stablyai/orca/pull/37753\n* Dismiss native chat link previews when opening links by @brennanb2025 in https://github.com/stablyai/orca/pull/37911\n* Keep question answers visible until delivery completes by @brennanb2025 in https://github.com/stablyai/orca/pull/37883\n* Fix OpenCode effort selection for the selected model by @brennanb2025 in https://github.com/stablyai/orca/pull/37950\n* Make links in chat questions clickable by @brennanb2025 in https://github.com/stablyai/orca/pull/37992\n* Add Ultracode to Claude chat effort by @brennanb2025 in https://github.com/stablyai/orca/pull/38010\n* Preserve chat inputs through uncertain delivery and Stop by @brennanb2025 in https://github.com/stablyai/orca/pull/32267\n* fix(native-chat): keep loaded chat images on screen across scroll and workspace switches by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38176\n* fix(pi): show compaction in chat and hold sends until it ends by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38191\n* feat(native-chat): add a setting to keep the scroll position when sending by @manuelmeurer in https://github.com/stablyai/orca/pull/38162\n* feat(native-chat): let users pick when idle chat agents stop, or never by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38202\n* Remove the New divider from Chat UI by @AmethystLiang in https://github.com/stablyai/orca/pull/38044\n\n### Agents & orchestration\n\n*Choose Chat or Terminal during setup, keep provider choices intact, and improve agent messages and status.*\n\n* fix(skills): rename computer use to orca-computer-use by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37659\n* Show orchestration message content without the agent envelope by @brennanb2025 in https://github.com/stablyai/orca/pull/37891\n* update chat ui intro by @AmethystLiang in https://github.com/stablyai/orca/pull/37924\n* fix(agent-hooks): preserve Antigravity ownership across nested hooks by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37955\n* fix(claude): reflect fallback without changing saved models by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37958\n* Keep orchestration notices in one-line expandable cards by @brennanb2025 in https://github.com/stablyai/orca/pull/37968\n* Increase Orchestration panel and tab contrast by @brennanb2025 in https://github.com/stablyai/orca/pull/37994\n* Clarify account switching and session restart prompts by @AmethystLiang in https://github.com/stablyai/orca/pull/38056\n* fix(orchestration): a worktree a paired client starts on a remote server is that client's by @Jinwoo-H in https://github.com/stablyai/orca/pull/38034\n* Deliver orchestration mail during active turns by @brennanb2025 in https://github.com/stablyai/orca/pull/38041\n* Remove redundant Show less buttons from agent cards by @brennanb2025 in https://github.com/stablyai/orca/pull/38074\n* Shrink orchestration message status backgrounds by @brennanb2025 in https://github.com/stablyai/orca/pull/38079\n* fix(ai-vault): show closed Antigravity chats in Agent Session History by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38203\n* fix(claude-accounts): keep /model and effort choices on managed Claude accounts by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38219\n* perf(agent-hooks): start 7 processes per Claude hook event instead of 17 by @rikbrown in https://github.com/stablyai/orca/pull/38180\n* fix(notifications): notify when an OpenCode turn finishes over OSC 7501 by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38222\n* Add Chat UI choice to onboarding by @AmethystLiang in https://github.com/stablyai/orca/pull/36204\n* feat(onboarding): theme step with color mode + optional theme carousel by @nwparker in https://github.com/stablyai/orca/pull/38021\n* fix(claude): keep \"Allow for this session\" rules out of settings files by @King-Dylan in https://github.com/stablyai/orca/pull/37895\n\n### Phone\n\n*Improve Home navigation, usage visibility, chat controls and terminal input in the updated phone app.*\n\n* fix(mobile): reopen workspace options at full width by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37919\n* fix(mobile): check the upstream status reply before Sync decides whether to push by @Jinwoo-H in https://github.com/stablyai/orca/pull/37912\n* Show failure Details in phone native chat by @brennanb2025 in https://github.com/stablyai/orca/pull/37643\n* Keep phone fork pull requests on their selected repository by @brennanb2025 in https://github.com/stablyai/orca/pull/36762\n* fix(mobile): type desktop replies from shared contracts and keep phone list facts beside the desktop row by @Jinwoo-H in https://github.com/stablyai/orca/pull/37917\n* fix(mobile): keep the Android nav bar in step with Orca's theme by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37989\n* Render HTML files in mobile previews by @AmethystLiang in https://github.com/stablyai/orca/pull/38042\n* feat(mobile): improve mobile terminal input by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37900\n* fix(mobile): make the app icon full-bleed so iOS masks it cleanly by @tianlrz in https://github.com/stablyai/orca/pull/37074\n* feat(mobile): show usage for every agent desktop tracks on the Accounts screen by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38187\n* feat(mobile): title Jump back in rows with the conversation name by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38194\n* fix(mobile): keep the effort control in one place for every model by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38200\n* feat(mobile): split Home into Feed, Usage, Automations and Settings tabs by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38206\n* fix(mobile): keep a new project's section collapsed on the phone by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38225\n* fix(mobile): address android auto quit by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38226\n* chore(mobile): bump to 0.0.64 and Android versionCode 28 by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38230\n\n### Source control, tasks & integrations\n\n*Keep GitHub task sources consistent and make checks and diagrams clearer.*\n\n* Keep GitHub Tasks source changes consistent by @brennanb2025 in https://github.com/stablyai/orca/pull/37387\n* Distinguish cancelled PR checks from failures by @brennanb2025 in https://github.com/stablyai/orca/pull/37789\n* fix(checks): render Mermaid diagrams in PR comments by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38215\n\n### Workspaces, sidebar & tabs\n\n*Keep project admission, workspace ordering and picker navigation consistent.*\n\n* fix(sidebar): stop the resize handle from covering the workspace list scrollbar by @OrcaWin in https://github.com/stablyai/orca/pull/37948\n* fix: respect manual workspace order around primary checkouts by @davefano in https://github.com/stablyai/orca/pull/37557\n* Keep folder workspace creation from flashing by @brennanb2025 in https://github.com/stablyai/orca/pull/38039\n* Restore type-to-search on the new-workspace agent picker and skip the emoji button on Tab by @nwparker in https://github.com/stablyai/orca/pull/38073\n* Keep the Split tip until the user splits or closes it by @brennanb2025 in https://github.com/stablyai/orca/pull/38097\n* fix(projects): refuse removing a project while one of its workspaces is being created by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38196\n* fix(sidebar): keep discovered worktrees hidden when adding a project by @brennanb2025 in https://github.com/stablyai/orca/pull/38208\n\n### Editor, files & browser\n\n*Add save and Markdown preferences, preserve HTML previews, and improve browser split behavior.*\n\n* feat(editor): add Insert Final Newline on save by @nwparker in https://github.com/stablyai/orca/pull/37786\n* fix(browser): an agent-set viewport wider than the pane scrolls instead of being cut off by @Jinwoo-H in https://github.com/stablyai/orca/pull/38005\n* fix(browser): a split tab create joins a browser pane already beside the caller by @Jinwoo-H in https://github.com/stablyai/orca/pull/38006\n* Preserve chat HTML appearance in file previews by @brennanb2025 in https://github.com/stablyai/orca/pull/37890\n* feat(editor): default Markdown view setting + right-click on the view switcher by @nwparker in https://github.com/stablyai/orca/pull/38106\n* fix(browser): keep local browser tabs when a mutually paired desktop echoes them back by @AmoabaKelvin in https://github.com/stablyai/orca/pull/38186\n* fix(floating-terminal): close a browser split from its own toolbar by @younghwan91 in https://github.com/stablyai/orca/pull/38175\n\n### Updates, terminals & remote work\n\n*Preserve terminal position and file-link context, and clarify notifications and update cards.*\n\n* Keep update cards above the status bar by @AmethystLiang in https://github.com/stablyai/orca/pull/37884\n* Keep terminal scroll position on input by @mvanhorn in https://github.com/stablyai/orca/pull/30889\n* fix(terminal): rename link popover row \"Open in this group\" to \"Open in new tab\" by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37920\n* fix(terminal): a local file link opens in the workspace it was clicked in by @nwparker in https://github.com/stablyai/orca/pull/37953\n* fix(terminal): a paired-server file link opens in the workspace it was clicked in by @nwparker in https://github.com/stablyai/orca/pull/38072\n* fix(notifications): clear acknowledged desktop alerts by @AmoabaKelvin in https://github.com/stablyai/orca/pull/37974\n* Use neutral styling for terminal resource limits by @AmethystLiang in https://github.com/stablyai/orca/pull/37999\n\n### Automations & plugins\n\n*Refresh automation lists, accept Pi arguments and report interrupted runs accurately.*\n\n* Record interrupted terminal automation runs as failed by @Jinwoo-H in https://github.com/stablyai/orca/pull/37962\n* Refresh automation lists when projects change by @Jinwoo-H in https://github.com/stablyai/orca/pull/37964\n* fix(automations): accept Pi model and thinking extra arguments by @Jinwoo-H in https://github.com/stablyai/orca/pull/38020\n* Use the shared agent picker for Automations by @brennanb2025 in https://github.com/stablyai/orca/pull/37941\n\n### Reverted\n\n*Temporarily remove the experimental Orchestration panel.*\n\n* Temporarily disable the orchestration panel and remove its setting by @brennanb2025 in https://github.com/stablyai/orca/pull/38045\n\n### Tests, CI & maintenance\n\n*Update dependencies and translations, organize internal owners, and maintain targeted checks and tests.*\n\n* Fix AI token translations by @AmethystLiang in https://github.com/stablyai/orca/pull/37876\n* test: remove 151 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37870\n* test: remove 96 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37882\n* test: remove 37 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37885\n* test: remove 74 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37887\n* test: remove 63 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37888\n* refactor(browser): group routing and client-host owners by @nwparker in https://github.com/stablyai/orca/pull/37872\n* improve app loading efficiency by @AmethystLiang in https://github.com/stablyai/orca/pull/37877\n* refactor: group browser lifecycle and extension owners by @nwparker in https://github.com/stablyai/orca/pull/37910\n* fix(deps): update Electron to 43.8.6 and resolve open security advisories by @nwparker in https://github.com/stablyai/orca/pull/37916\n* test: remove 11 low-value declarations and batch historical checkout fetches by @OrcaWin in https://github.com/stablyai/orca/pull/37894\n* test: remove 31 low-value declarations and three suites by @OrcaWin in https://github.com/stablyai/orca/pull/37947\n* refactor: group agent launch contracts and startup owners by @nwparker in https://github.com/stablyai/orca/pull/37915\n* Remove 35 low-value tests across build, mobile, and preload by @OrcaWin in https://github.com/stablyai/orca/pull/37956\n* Remove 30 low-value tests and an unused replay fixture by @OrcaWin in https://github.com/stablyai/orca/pull/37963\n* test: fix historical compatibility setup reliability by @brennanb2025 in https://github.com/stablyai/orca/pull/37905\n* Remove 44 low-value tests, including ten whole suites by @OrcaWin in https://github.com/stablyai/orca/pull/37969\n* test: remove 28 low-value tests and five suites by @OrcaWin in https://github.com/stablyai/orca/pull/37972\n* fix(i18n): translate recent desktop and mobile copy by @AmethystLiang in https://github.com/stablyai/orca/pull/37976\n* refactor: organize agent status and lifecycle owners by @nwparker in https://github.com/stablyai/orca/pull/37961\n* fix(i18n): correct Portuguese and Turkish copy by @AmethystLiang in https://github.com/stablyai/orca/pull/37988\n* test: remove 145 low-value tests and nine suites by @OrcaWin in https://github.com/stablyai/orca/pull/37982\n* test: remove 63 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37991\n* fix(deps): backport minimatch, glob, and deepmerge security fixes by @nwparker in https://github.com/stablyai/orca/pull/37981\n* test: remove 78 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/37997\n* test: remove 72 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38002\n* test: remove 228 low-value test declarations by @OrcaWin in https://github.com/stablyai/orca/pull/38004\n* docs(agents): default to no new tests and tighten the anti-pattern list by @nwparker in https://github.com/stablyai/orca/pull/37993\n* refactor: organize source-control contract owners by @nwparker in https://github.com/stablyai/orca/pull/37990\n* test: remove 454 low-value tests and copied benchmarks by @OrcaWin in https://github.com/stablyai/orca/pull/38014\n* refactor: organize terminal and runtime contract owners by @nwparker in https://github.com/stablyai/orca/pull/38011\n* fix(ci): place PR LoC table after ELI5 so link unfurls stay readable by @nwparker in https://github.com/stablyai/orca/pull/38025\n* refactor: organize workspace and remote runtime contract owners by @nwparker in https://github.com/stablyai/orca/pull/38018\n* refactor: organize Codex transport, trust and history owners by @nwparker in https://github.com/stablyai/orca/pull/38023\n* refactor: organize notebook, diff and check detail owners by @nwparker in https://github.com/st