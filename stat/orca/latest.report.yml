3f2aec1e651209de21a80f64fe35f776fff76b9ddd2fb693a19054112af13","download_count":17,"created_at":"2026-10-30T05:13:59Z","updated_at":"2026-10-30T05:14:00Z"},{"id":691057174,"node_id":"RA_kwDORpCz1s4pMLIW","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":207321160,"digest":"sha256:e1c96fd574878fa57257ca28cdf7298c586639153fb25ebe6253c47b1cb07803","download_count":41107,"created_at":"2026-10-30T05:32:47Z","updated_at":"2026-10-30T05:32:54Z"},{"id":691057177,"node_id":"RA_kwDORpCz1s4pMLIZ","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":207145,"digest":"sha256:cb6dd669fc7159e64d6f6e8efa3c32d18abd2d642a69130e01a747bc3a61d27d","download_count":10941,"created_at":"2026-10-30T05:32:47Z","updated_at":"2026-10-30T05:32:47Z"}],"body":"## A faster Orca, plugins & background computer use ⚡\n\n- ⚡ **A faster Orca:** Launch smoothly with hundreds of chats, with less lag as you type and switch tabs.\n- 🧩 **Customize Orca** with icon themes, syntax highlighting and custom editors.\n- 🖱️ **Keep working** while agents use Chrome, Blender and other Mac apps in the background.\n- 🎙️ **Dictate on your phone** and see your words as you speak.\n- 💬 **Try the new Chat UI:** Search for “Chat UI” in Settings to turn it on, then right-click a tab to switch live between Chat UI and TUI.\n\n## Highlights\n\n- **A faster Orca:** Fast app with hundreds of chats. Typing stays more responsive, and hidden chats do less work while you use other tabs.\n- **Plugins:** Add icon themes, syntax highlighting and custom editors from Settings → Plugins. Community publishing is coming soon, so you’ll be able to share your own plugins.\n- **Background computer use on Mac:** Let agents work in Chrome, Blender and other apps while you keep using your mouse and keyboard. Orca’s in-app browser already works in the background; now computer use does too. Some actions still need the app brought forward.\n- **Chats:** Enjoy a very polished Chat UI, send again after Stop, and preview links in chat. Search for “Chat UI” in Settings to turn it on, and right-click a tab to switch live between Chat UI and TUI.\n- **Terminals:** Set a running terminal limit for each computer in Settings → Terminal → Advanced.\n- **WSL:** Stopped distros stay stopped until you choose Start. Terminals remember their folder.\n- **Browser:** Press Cmd+Opt+B on Mac for a browser split. Send shorter annotation feedback, now with pasted images.\n- **Workspaces:** Your workspace name becomes its branch name again. Source Control actions get Model and Effort controls.\n- **Phone:** See dictation as you speak, and read clearer code, tables and diagrams.\n\n## Compatibility & upgrade notes\n\n- **New terminal host:** This release starts a fresh terminal host for new terminals. Terminals already open before the update keep running on the previous host and stay attached. The new running terminal limit setting needs the new host, and so do fixes such as the ble.sh startup fix and lighter process checks on macOS. Those apply to terminals you open after updating.\n- **Plugins are on by default:** Installing a plugin, including from an `orca://plugins` link, only opens a review screen first. Plugins that run code ask for your consent before they install, and once approved they run with full access to your computer.\n- **Running terminal limit:** The default now follows each computer: half of its system terminal limit, up to 4096, or 256 as before when Orca can’t read that limit. A value you set in Settings or with an environment variable takes priority. Raising or lowering it never closes running terminals. A remote server running an older Orca keeps working, but the limit can’t be changed there until it updates.\n- **Chat naming:** Chats are now named by their own agent and account by default. A naming agent, custom command or arguments you saved before keep working, and the naming agent choice moved under Advanced in Settings → Chat → Chat naming.\n- **Codex history across accounts:** A new switch, Settings → Agents → Share Codex history across accounts, is on by default and keeps today’s behavior. With it on, history from Orca’s managed accounts now also shows up in your own ~/.codex when you switch back to system default. Turning it off stops new sharing and removes nothing. On an SSH or WSL host running an older Orca, the switch stays disabled until that host updates.\n- **Codex on macOS and Linux:** Orca now starts Codex with its paste guess turned off, so prompts typed from a phone or another client send instead of staying in the composer. Real pastes still arrive as pastes.\n- **Computer use on a Mac:** Agents now act in the background by default. Agents can still ask for the old foreground mode with `--restore-window`, which drags into Chromium and Electron apps still need.\n- **Browser annotations:** Send and Copy now give agents a short summary per note. Check **Include page details** in the Send menu to get the old full output; the choice lasts for that browser pane.\n- **Workspace branch names:** A name you type for a new workspace is used as its branch again, even when Auto-rename branch from work is on. Auto-rename only replaces names Orca made up.\n- **Automations:** Agents started by an automation skip their CLI’s startup update prompt, so the prompt can’t swallow the task. Agents you start yourself are unchanged.\n- **Source Control actions:** Model and effort flags saved in an action’s Arguments move into the new Model and Effort controls when Orca loads; other Arguments stay as they are. A phone or remote server on an older Orca may launch these actions with a different model or effort until it updates.\n- **New shortcuts:** Cmd/Ctrl+Shift+X opens Plugins (outside text fields), and Cmd+Opt+B on macOS opens a browser tab in a split to the right. Cmd+Opt+B can be changed in Settings → Keyboard.\n- **Known limitation, downgrading:** If you go back to v1.4.244, custom model and effort choices on Source Control AI actions reset to the agent’s defaults, and updating again won’t bring them back.\n\n---\n\n## Product experience\n\n### Native chat\n\n*No more startup freeze with many chats, link previews, naming with the chat’s own agent, and a working Send after Stop.*\n\n* Show chats as Interrupted or Done at startup without reading their history, so Orca no longer freezes after launch with hundreds of chats by @brennanb2025 in https://github.com/stablyai/orca/pull/32146\n* Show hover cards for GitHub PR and issue links in chats by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35199\n* Show preview cards for web links in chats, never fetching private network addresses by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35221\n* Name each chat with its own agent and account by default, with other naming agents under Advanced by @brennanb2025 in https://github.com/stablyai/orca/pull/32106\n* Let the next message go through after Stop force-kills a chat’s agent by @brennanb2025 in https://github.com/stablyai/orca/pull/34653\n* Keep a huge unbroken paste from freezing a chat by @nwparker in https://github.com/stablyai/orca/pull/36031\n* Run launcher Commands like `op run -- codex` for every agent in chats by @brennanb2025 in https://github.com/stablyai/orca/pull/35592\n* Leave Claude plan mode when you approve a plan by @brennanb2025 in https://github.com/stablyai/orca/pull/34549\n* Resume a chat with a saved effort on Claude Code versions that predate --effort by @nwparker in https://github.com/stablyai/orca/pull/35878\n* Keep the model options a chat accepted in what it shows and sends by @brennanb2025 in https://github.com/stablyai/orca/pull/31208\n* Keep a chat’s option controls working while its model list refreshes by @brennanb2025 in https://github.com/stablyai/orca/pull/31927\n* Handle large pastes in chat goal mode by @brennanb2025 in https://github.com/stablyai/orca/pull/34654\n* Order queued chat turns without rescanning the transcript by @OrcaWin in https://github.com/stablyai/orca/pull/34945\n* Stop resting chats from delaying native command menus by @brennanb2025 in https://github.com/stablyai/orca/pull/35069\n* Recover from OpenCode failures in chats by @AmethystLiang in https://github.com/stablyai/orca/pull/35247\n* Keep models missing from a provider’s list available in chats by @brennanb2025 in https://github.com/stablyai/orca/pull/35266\n* Process image-heavy transcript runs once by @OrcaWin in https://github.com/stablyai/orca/pull/35572\n* Reopen an old tool run without jumping to a stale scroll position by @brennanb2025 in https://github.com/stablyai/orca/pull/35866\n* Stop re-rendering chat composer controls on every keystroke by @nwparker in https://github.com/stablyai/orca/pull/35913\n* Do less work for hidden chats and tab updates by @AmethystLiang in https://github.com/stablyai/orca/pull/36047\n* Keep the chat session record file within the file name length limit by @brennanb2025 in https://github.com/stablyai/orca/pull/36056\n* Make Settings permission menus match the chat permission picker by @brennanb2025 in https://github.com/stablyai/orca/pull/36104\n* Stop the saved chat status writer from remembering every closed chat by @brennanb2025 in https://github.com/stablyai/orca/pull/36105\n* Keep transcripts from re-rendering on status-only updates by @nwparker in https://github.com/stablyai/orca/pull/36141\n* Keep chats ended with Stop readable after downgrading to v1.4.244 by @brennanb2025 in https://github.com/stablyai/orca/pull/36142\n* Skip the WSL distro walk for chat transcripts on this computer by @nwparker in https://github.com/stablyai/orca/pull/36152\n\n### Plugins\n\n*Icon themes, syntax packs and custom editors, one Plugins list with one-step install, and quick access from the status bar.*\n\n* Plugin Alpha: icon themes, syntax packs and custom editors, one Plugins list with one-step install, and `orca://plugins` links by @nwparker in https://github.com/stablyai/orca/pull/35470\n* Open Plugins from a status bar button or Cmd/Ctrl+Shift+X by @AmethystLiang in https://github.com/stablyai/orca/pull/36153\n* Show one Plugins list with Installed badges, inline switches, install-state filters, category chips and plain wording about trusted code by @nwparker in https://github.com/stablyai/orca/pull/36100\n* Show the Plugins catalog in four columns with clear Show all and See all links by @nwparker in https://github.com/stablyai/orca/pull/35849\n* Make Try it apply the plugin instead of opening its page by @nwparker in https://github.com/stablyai/orca/pull/35846\n* Treat self-hosted plugin repository paths that differ in case as different repositories by @nwparker in https://github.com/stablyai/orca/pull/35640\n* Stop an update already in progress when you turn off plugin auto-update by @nwparker in https://github.com/stablyai/orca/pull/35642\n* Keep the Try it and Switch back toasts up long enough to click by @nwparker in https://github.com/stablyai/orca/pull/35650\n* Apply a one-mode theme visibly when you install it by @nwparker in https://github.com/stablyai/orca/pull/35674\n* Use one loader for plugin panels and editors, and keep suspended panels marked failed by @nwparker in https://github.com/stablyai/orca/pull/35680\n* Keep unsaved edits in plugin binary editors across renames, reloads and duplicate tabs by @nwparker in https://github.com/stablyai/orca/pull/35698\n* Load installed plugins whose minimum Orca version predates their fields by @nwparker in https://github.com/stablyai/orca/pull/35756\n* Keep plugin panels within the sidebar’s height by @AmethystLiang in https://github.com/stablyai/orca/pull/36085\n* Cap the plugin preview cache to the current version by @nwparker in https://github.com/stablyai/orca/pull/36089\n* Count plugin installs from Orca’s public catalogs by @nwparker in https://github.com/stablyai/orca/pull/36132\n* Reload the active icon theme after a plugin update by @nwparker in https://github.com/stablyai/orca/pull/36151\n\n### Browser\n\n*A browser split shortcut, shorter annotation feedback with pasted images, and SSH proxies that work in the browser.*\n\n* Open a browser tab in a split to the right with a shortcut (Cmd+Opt+B on macOS) by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35994\n* Send compact annotation feedback by default, with an Include page details checkbox for the full detail by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35990\n* Paste images into annotation comments and send them to the agent by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36004\n* Reach sites through the SSH host’s proxy in an SSH workspace’s browser by @nwparker in https://github.com/stablyai/orca/pull/36022\n* Keep your chosen default browser profile after a restart or update by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35991\n* Open Orca’s own buttons and links according to the open-links-in-Orca setting by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35992\n* Show the page’s viewport size while you resize a browser pane by @chucoding in https://github.com/stablyai/orca/pull/31145\n* Make Next.js Server Actions work through a worktree’s *.orca.localhost address by @promptprobe in https://github.com/stablyai/orca/pull/14562\n* Check Chrome Web Store redirects before following them by @OrcaWin in https://github.com/stablyai/orca/pull/35286\n* Contain malformed browser automation messages by @OrcaWin in https://github.com/stablyai/orca/pull/35291\n* Skip unused frame scans when checking site permissions by @OrcaWin in https://github.com/stablyai/orca/pull/35326\n* Reuse tab snapshots when listing tabs for extensions by @OrcaWin in https://github.com/stablyai/orca/pull/35327\n* Release startup data from abandoned extension native helpers by @OrcaWin in https://github.com/stablyai/orca/pull/35344\n* Avoid repeated cleanup scans of extension native helper ports by @OrcaWin in https://github.com/stablyai/orca/pull/35346\n* Cap copied header data from extension native helpers by @OrcaWin in https://github.com/stablyai/orca/pull/35359\n* Close extension popups that close themselves when they lose focus by @OrcaWin in https://github.com/stablyai/orca/pull/35360\n* Cap pending writes to extension native helpers by @OrcaWin in https://github.com/stablyai/orca/pull/35362\n* Release used buffers from extension native helpers by @OrcaWin in https://github.com/stablyai/orca/pull/35368\n* Skip converting outdated page snapshots by @OrcaWin in https://github.com/stablyai/orca/pull/35377\n* Load pages through a server set to “Server (streamed)” even when it can’t stream by @nwparker in https://github.com/stablyai/orca/pull/35381\n* Keep popups opened by a page in the same browser session by @OrcaWin in https://github.com/stablyai/orca/pull/35397\n* Close Find on a full page navigation in client-hosted browsers by @OrcaWin in https://github.com/stablyai/orca/pull/35692\n* Refuse a 21st page annotation with a visible limit instead of dropping the oldest by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35979\n* Print `orca console` and `orca network` entries in text mode and respect --limit by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35981\n* Give agent device and viewport `--mobile` settings touch input and a coarse pointer by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35982\n* Import a cookie file into a client-hosted browser under a remote server by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35989\n* Keep agent clicks on target when a page changes, with agent-browser 0.39.4 by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36007\n* Return `orca tab list` at once when a worktree has no saved browser tab by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36017\n* Preview HTML files over 512 KiB from paired hosts by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36021\n\n### Agent launch, status & accounts\n\n*Mac apps driven in the background, Codex history you can keep apart per account, and steadier Grok, Antigravity and Mobile Emulator support.*\n\n* Let agents drive macOS apps in the background by default, without moving your pointer or taking your focus by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36005\n* Report macOS computer use actions that changed nothing, read back wrong or hung by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36020\n* Return what changed after computer use actions, and add `get-app-state --query` by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36023\n* Stop relaunching the macOS permission helper on every status check, which made the mouse unusable when access was denied by @nwparker in https://github.com/stablyai/orca/pull/36028\n* Cap every macOS permission helper launch at one per 5 seconds by @nwparker in https://github.com/stablyai/orca/pull/36150\n* Add Settings → Agents → Share Codex history across accounts (on by default), and bring managed accounts’ Codex history into ~/.codex on system default by @nwparker in https://github.com/stablyai/orca/pull/34981\n* Start Codex on macOS and Linux without its paste guess, so prompts typed from remote clients send by @nwparker in https://github.com/stablyai/orca/pull/35975\n* Switch Antigravity accounts on Windows by @brennanb2025 in https://github.com/stablyai/orca/pull/34637\n* Stop an agent name mentioned in task text from taking over a pane by @brennanb2025 in https://github.com/stablyai/orca/pull/19309\n* Group Antigravity models and refresh their effort choices by @brennanb2025 in https://github.com/stablyai/orca/pull/34518\n* Bring back OMP commit messages and chat names by @brennanb2025 in https://github.com/stablyai/orca/pull/34644\n* Open conversation files from Session History instead of storage databases by @brennanb2025 in https://github.com/stablyai/orca/pull/35051\n* Resume Session History conversations for symlinked workspaces by @brennanb2025 in https://github.com/stablyai/orca/pull/35052\n* Finish Mobile Emulator gestures when the connection closes after the last point by @OrcaWin in https://github.com/stablyai/orca/pull/35329\n* Keep a Grok pane working when Esc or Ctrl+C doesn’t cancel its turn by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35417\n* Keep Grok’s background shells and subagents visible after a cancel by @AmoabaKelvin in https://github.com/stablyai/orca/pull/35495\n* Wait for complete scrcpy downloads in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35503\n* Wait for the requested Android virtual device to boot in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35536\n* Clear Orca’s own Codex “ready” title when the next turn starts by @brennanb2025 in https://github.com/stablyai/orca/pull/35547\n* Quote text sent to Android devices in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35561\n* Start scrcpy in the background for the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35566\n* Reset partial video frames when the Mobile Emulator reconnects by @OrcaWin in https://github.com/stablyai/orca/pull/35593\n* Run Android commands through Orca’s process host in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35599\n* Reuse device routing in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35616\n* Report Android app launch failures in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35623\n* Follow the Android video’s real size in the Mobile Emulator by @OrcaWin in https://github.com/stablyai/orca/pull/35635\n* Let your Mac sleep again when Orca quits after keeping it awake for agents by @OrcaWin in https://github.com/stablyai/orca/pull/35649\n* Use the shared default agent choice when launching from work items by @brennanb2025 in https://github.com/stablyai/orca/pull/35748\n* Avoid Claude workflow agent views that aren’t supported by @brennanb2025 in https://github.com/stablyai/orca/pull/35749\n* Load the bundled agent status rules without checking them again by @nwparker in https://github.com/stablyai/orca/pull/35768\n* Report an agent CLI that couldn’t start as missing, not as a failed start by @nwparker in https://github.com/stablyai/orca/pull/35770\n* Add to the session search index after a restart instead of rewriting large transcripts by @nwparker in https://github.com/stablyai/orca/pull/35941\n* Find the Codex CLI once per launch check, off the main thread on Windows by @nwparker in https://github.com/stablyai/orca/pull/35967\n* Resume AI Vault sessions for the operating system of the host that runs them by @nwparker in https://github.com/stablyai/orca/pull/35988\n* Quote resume commands for the host’s own operating system and shell by @nwparker in https://github.com/stablyai/orca/pull/35995\n* Skip bringing an app forward for accessibility clicks by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36006\n* Ignore a launcher’s own version when choosing Claude hook events by @brennanb2025 in https://github.com/stablyai/orca/pull/36119\n* Find retained Claude prompts’ turns in one pass during catch-up by @brennanb2025 in https://github.com/stablyai/orca/pull/36127\n\n### Orchestration & CLI\n\n*Messages between agents as cards, chat workers nested under their coordinator, and quieter automation launches.*\n\n* Show messages between agents as cards with the other agent’s status by @brennanb2025 in https://github.com/stablyai/orca/pull/34824\n* Say “coordinator” and “worker” on agent message cards by @brennanb2025 in https://github.com/stablyai/orca/pull/36168\n* Nest chat workers under the agent that started them in the workspace agent list by @brennanb2025 in https://github.com/stablyai/orca/pull/34601\n* Skip agent CLI update prompts for unattended automation launches by @Jinwoo-H in https://github.com/stablyai/orca/pull/36133\n* Include the provider’s error when a worker’s dispatch preamble is rejected by @Venius24 in https://github.com/stablyai/orca/pull/35791\n* Never register the bundled `orca` launcher as a link to itself by @Hotragn in https://github.com/stablyai/orca/pull/35371\n* Make `orca worktree rm` report whether the delete worked, not just that it was accepted by @nwparker in https://github.com/stablyai/orca/pull/35459\n* Stop the `orca` command that `orca serve` adds on Linux from hiding the GNOME screen reader, and remove it with the CLI by @nwparker in https://github.com/stablyai/orca/pull/35578\n* Let a host create workspaces for another owner’s automation run by @nwparker in https://github.com/stablyai/orca/pull/35978\n* Label workspaces a host creates with the desktop’s own automation run by @nwparker in https://github.com/stablyai/orca/pull/35986\n\n### Terminals\n\n*A per-computer running terminal limit, ble.sh prompts that no longer stall startup commands, and lighter process checks on macOS.*\n\n* Add Settings → Terminal → Advanced → Maximum running terminals, per computer, including connected remote computers by @brennanb2025 in https://github.com/stablyai/orca/pull/31396\n* Keep a sleeping conversation ready to resume when the running terminal limit is reached by @brennanb2025 in https://github.com/stablyai/orca/pull/35401\n* Send the shell-ready signal when ble.sh owns the bash prompt, so startup commands no longer wait 15 seconds by @nwparker in https://github.com/stablyai/orca/pull/36163\n* Tell you when keys typed before a remote terminal connected weren’t sent by @nwparker in https://github.com/stablyai/orca/pull/35581\n* Read the macOS process table inside Orca instead of starting `ps` on every check by @nwparker in https://github.com/stablyai/orca/pull/35987\n* Read folder reports from nushell correctly by @nwparker in https://github.com/stablyai/orca/pull/35596\n* Make terminal folder reports agree on spaces, control characters and % by @nwparker in https://github.com/stablyai/orca/pull/35606\n* Flash the editor tab a terminal file link opens by @AmethystLiang in https://github.com/stablyai/orca/pull/35656\n* Keep Orca’s own input and output handles out of every program it starts on Windows by @nwparker in https://github.com/stablyai/orca/pull/35678\n* Log a terminal exit no client heard by @nwparker in https://github.com/stablyai/orca/pull/35734\n* Stop link detection scanning back past rows that can’t continue a URL by @nwparker in https://github.com/stablyai/orca/pull/35767\n* Stop rereading the terminal size on every write once it matches by @nwparker in https://github.com/stablyai/orca/pull/35783\n* Drop a replaced program’s title and input modes when restoring a terminal by @nwparker in https://github.com/stablyai/orca/pull/35889\n* Judge how to reattach a live agent by the screen’s own title by @nwparker in https://github.com/stablyai/orca/pull/35920\n* Send typed keys to the terminal before updating activity by @AmethystLiang in https://github.com/stablyai/orca/pull/36008\n* Keep only timings in typing diagnostics by @AmethystLiang in https://github.com/stablyai/orca/pull/36088\n\n### SSH, WSL & remote servers\n\n*Stopped WSL distros that stay stopped, WSL terminals that reopen where you left them, and faster SSH sign-in and uploads.*\n\n* Show a Start card on restored WSL terminals whose distro is stopped, instead of starting the distro by @nwparker in https://github.com/stablyai/orca/pull/35813\n* Keep a stopped WSL distro’s worktrees in the sidebar and refresh them once it runs by @nwparker in https://github.com/stablyai/orca/pull/35733\n* Start a stopped WSL distro only when you switch to its workspace or expand a folder by @nwparker in https://github.com/stablyai/orca/pull/35867\n* Reopen restored WSL terminals in the folder you were in by @nwparker in https://github.com/stablyai/orca/pull/35385\n* Report the folder from fish shells in WSL terminals at every prompt by @nwparker in https://github.com/stablyai/orca/pull/35517\n* Report the folder from sh, dash and ash shells in WSL terminals at every prompt by @nwparker in https://github.com/stablyai/orca/pull/35597\n* Start fish shells older than 2.7 in WSL terminals instead of failing by @nwparker in https://github.com/stablyai/orca/pull/35579\n* Let a second desktop use an SSH host another desktop already set up by @nwparker in https://github.com/stablyai/orca/pull/35879\n* Don’t import an SSH config entry for a machine already in Orca by @nwparker in https://github.com/stablyai/orca/pull/35792\n* Upload folders to SSH hosts faster by overlapping small files by @OrcaWin in https://github.com/stablyai/orca/pull/35348\n* Sign in to SSH hosts faster by sending small packets right away by @OrcaWin in https://github.com/stablyai/orca/pull/35318\n* Load SSH support on first use instead of at startup by @nwparker in https://github.com/stablyai/orca/pull/35911\n* Keep a remote server’s browser helper listening only on that machine by @teamauresta in https://github.com/stablyai/orca/pull/31896\n* Cap queued data for slow relay connections by @OrcaWin in https://github.com/stablyai/orca/pull/35302\n* Read session history without starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35367\n* Keep account sync and usage previews from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35387\n* Keep background Git, GitHub and GitLab reads from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35410\n* Keep background startup checks and agent detection from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35411\n* Keep Settings checks for CLI status, repair, health and links from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35412\n* Keep background requests from phones, web and the CLI from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35430\n* Wait for an up-to-date list of running WSL distros before background steps, so a distro that is shutting down isn’t restarted by @nwparker in https://github.com/stablyai/orca/pull/35433\n* Check again before each Codex repair batch, so a stopped WSL distro stays stopped by @nwparker in https://github.com/stablyai/orca/pull/35448\n* Never bring back a device removed from a server’s device list when the list is saved by @nwparker in https://github.com/stablyai/orca/pull/35483\n* Skip a repeated startup check on a remote server whose machine hasn’t changed by @nwparker in https://github.com/stablyai/orca/pull/35484\n* Start a remote server’s terminal host sooner by @nwparker in https://github.com/stablyai/orca/pull/35486\n* Never hand a paired device the token of a child device that a save dropped by @nwparker in https://github.com/stablyai/orca/pull/35510\n* Harden a remote server’s startup check by @nwparker in https://github.com/stablyai/orca/pull/35513\n* Stop a device removed on disk from signing in at the next check by @nwparker in https://github.com/stablyai/orca/pull/35527\n* Issue a fresh token in the same sync for a child device a save dropped by @nwparker in https://github.com/stablyai/orca/pull/35533\n* Keep other paired devices signed in when a partly corrupt device list is set aside by @nwparker in https://github.com/stablyai/orca/pull/35539\n* Start a remote server slightly sooner by @nwparker in https://github.com/stablyai/orca/pull/35568\n* Reject malformed encrypted connection handshakes by @OrcaWin in https://github.com/stablyai/orca/pull/35583\n* Share a skill by starting only the stopped WSL distros that hold it by @nwparker in https://github.com/stablyai/orca/pull/35659\n* Never scan a WSL Codex history source in the background by @nwparker in https://github.com/stablyai/orca/pull/35677\n* Keep remote terminals’ screen state at the server’s live depth and cap waits for chat snapshots by @nwparker in https://github.com/stablyai/orca/pull/35679\n* Do a full Codex history scan after launches while history lives in WSL by @nwparker in https://github.com/stablyai/orca/pull/35703\n* Never start a stopped default WSL distro because gh or glab is missing on Windows by @nwparker in https://github.com/stablyai/orca/pull/35709\n* Start only the WSL distros not yet read when skill sharing retries by @nwparker in https://github.com/stablyai/orca/pull/35725\n* Close the gaps where session scanning could start a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35729\n* Don’t start a stopped WSL distro to read a repo’s default base branch by @nwparker in https://github.com/stablyai/orca/pull/35778\n* Release a remote server’s wake hold once its dropped launch is running by @nwparker in https://github.com/stablyai/orca/pull/35808\n* Use confirmed home folders for WSL transcript lookups, treat WSL deletes as your own action, and translate the carryover notice by @nwparker in https://github.com/stablyai/orca/pull/35810\n* Ask a paired host again for a default base branch it refused, and close a timing gap by @nwparker in https://github.com/stablyai/orca/pull/35812\n* Keep Codex WSL hook installs and checks from starting a stopped distro by @nwparker in https://github.com/stablyai/orca/pull/35827\n* Keep Settings issue command and path checks from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35829\n* Retry a watched WSL folder that fails while its distro is starting by @nwparker in https://github.com/stablyai/orca/pull/35845\n* Load Commits history from a stopped WSL distro only when you ask by @nwparker in https://github.com/stablyai/orca/pull/35854\n* Never start a stopped WSL distro for a scheduled automation run by @nwparker in https://github.com/stablyai/orca/pull/35857\n* Keep restored terminals’ environment setup from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35858\n* Say when Orca couldn’t check a held terminal’s WSL distro, instead of saying it stopped by @nwparker in https://github.com/stablyai/orca/pull/35860\n* Keep Orca’s background terminal starts from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35865\n* Fail a first WSL setup fast when the Node download gets no answer by @nwparker in https://github.com/stablyai/orca/pull/35869\n* Keep Source Control’s PR push target and Create PR checks from starting a stopped WSL distro by @nwparker in https://github.com/stablyai/orca/pull/35885\n* Hold restored WSL terminals before checking their folder, whichever way they start by @nwparker in https://github.com/stablyai/orca/pull/35895\n* Wake the explorer and Git status on a workspace switch only while the switch is recent by @nwparker in https://github.com/stablyai/orca/pull/35897\n* Never start a stopped WSL distro to check a folder workspace’s path by @nwparker in https://github.com/stablyai/orca/pull/35899\n* Fix issue command follow-ups: no-op saves, WSL Git repos and paired hosts by @nwparker in https://github.com/stablyai/orca/pull/35900\n* Keep the port scanner from resolving a stopped WSL distro’s workspace path by @nwparker in https://github.com/stablyai/orca/pull/35907\n* Explain held WSL terminals in a plain sentence, and start the terminals of a worktree you create yourself by @nwparker in https://github.com/stablyai/orca/pull/35935\n* Never start an automation’s startup terminal in a stopped WSL distro as if you started it by @nwparker in https://github.com/stablyai/orca/pull/35970\n* Hold Orca’s background WSL starts before the folder check, and let your own starts check a WSL folder by @nwparker in https://github.com/stablyai/orca/pull/35971\n* Read the list of running WSL distros once for a held start by @nwparker in https://github.com/stablyai/orca/pull/36077\n* Limit AI Vault’s WSL session carryover to the most recent scopes by @nwparker in https://github.com/stablyai/orca/pull/36090\n* Read a WSL distro’s drive mount folder once per start, including the default /mnt/ by @nwparker in https://github.com/stablyai/orca/pull/36097\n* Diagnose desktop clock drift for relay connections by @AmoabaKelvin in https://github.com/stablyai/orca/pull/36139\n* Prepare the environment for background WSL starts without waking the distro by @nwparker in https://github.com/stablyai/orca/pull/36149\n\n### Source control & integrations\n\n*Credentials kept out of Git errors, Model and Effort controls for Source Control actions, and fewer GitHub requests.*\n\n* Remove credentials from Git remote errors before showing them by @AmethystLiang in https://github.com/stablyai/orca/pull/36205\n* Give Source Control actions their own Model and Effort controls instead of flags in Arguments by @brennanb2025 in https://github.com/stablyai/orca/pull/34275\n* Keep same-repo PRs when origin uses a renamed repository’s old URL by @YiGeon in https://github.com/stablyai/orca/pull/35688\n* Skip Tasks requests for projects known to be hosted outside GitHub by @brennanb2025 in https://github.com/stablyai/orca/pull/34219\n* Center plain Project table cells and label the linked PR overflow by @brennanb2025 in https://github.com/stablyai/orca/pull/34532\n* Load PR conversations without duplicate GitHub requests by @OrcaWin in https://github.com/stablyai/orca/pull/34747\n* Combine PR participant and viewed-file requests by @OrcaWin in https://github.com/stablyai/orca/pull/34842\n* Reuse repository merge setting reads by @OrcaWin in https://github.com/stablyai/orca/pull/34848\n* Stop Linear writes once the action that started them ends by @brennanb2025 in https://github.com/stablyai/orca/pull/35020\n* Combine PR field and stack summary requests by @OrcaWin in https://github.com/stablyai/orca/pull/35295\n* Merge comments you post into the fetched PR comment history by @OrcaWin in https://github.com/stablyai/orca/pull/35306\n* Keep comment changes made meanwhile when resolving a PR thread fails by @OrcaWin in https://github.com/stablyai/orca/pull/35315\n* Keep your place while a newly created issue loads by @OrcaWin in https://github.com/stablyai/orca/pull/35351\n* Skip empty annotation reads for finished checks by @OrcaWin in https://github.com/stablyai/orca/pull/35524\n* Rename PRs without extra lookups by @OrcaWin in https://github.com/stablyai/orca/pull/35525\n* Reuse issue details from the open conversation by @OrcaWin in https://github.com/stablyai/orca/pull/35546\n* Reuse search counts and cursors across GitHub work item reads by @OrcaWin in https://github.com/stablyai/orca/pull/35552\n* Share repository assignee reads across task rows by @OrcaWin in https://github.com/stablyai/orca/pull/35564\n* Update PR reviewers without extra lookups by @OrcaWin in https://github.com/stablyai/orca/pull/35575\n* Roll back a failed review thread resolve across new commits on the PR by @OrcaWin in https://github.com/stablyai/orca/pull/35653\n* Ignore a second resolve on a review thread that is already resolving by @OrcaWin in https://github.com/stablyai/orca/pull/35655\n* Keep the details of a stale lease rejection in push errors by @AmethystLiang in https://github.com/stablyai/orca/pull/36027\n* Recognize colored stale lease rejections from Git by @AmethystLiang in https://github.com/stablyai/orca/pull/36041\n* Set up Jira project sorting once per sort by @Jinwoo-H in https://github.com/stablyai/orca/pull/36107\n* Check remote branches with one Git call instead of one per remote by @nwparker in https://github.com/stablyai/orca/pull/36156\n\n### Workspaces, sidebar & everyday polish\n\n*Typed workspace names as branches again, existing remote branches you can reopen, and many Markdown and editor fixes.*\n\n* Use the workspace name you type as its branch again by @nwparker in https://github.com/stablyai/orca/pull/35815\n* Open the existing remote branch you pick for a new workspace instead of making a new suffixed branch, on desktop, phone and remote hosts by @AmethystLiang in https://github.com/stablyai/orca/pull/34295\n* Stop keeping and rewriting about 2 MB of unused usage stats every few seconds while agents run by @nwparker in https://github.com/stablyai/orca/pull/35852\n* Show toasts above notification cards, and make the Codex ~/.codex notice a card by @nwparker in https://github.com/stablyai/orca/pull/36167\n* Remove Orca’s agent hooks and PATH entry when uninstalling on Windows by @nwparker in https://github.com/stablyai/orca/pull/35588\n* Keep agent hooks on Windows when an Orca install record names no install location by @nwparker in https://github.com/stablyai/orca/pull/35668\n* Stop Windows shortcut labels overflowing context menus by @nwparker in https://github.com/stablyai/orca/pull/35726\n* Show ⇧ for Shift in Windows and Linux shortcut labels by @nwparker in https://github.com/stablyai/orca/pull/35754\n* Highlight CMakeLists.txt as CMake by @nwparker in https://github.com/stablyai/orca/pull/35735\n* Highlight Justfile recipes, and HCL assignments on the phone by @OrcaWin in https://github.com/stablyai/orca/pull/35573\n* Keep agent rows in the sidebar ordered by when their session started, even after a long state history by @brennanb2025 in https://github.com/stablyai/orca/pull/14654\n* Release memory from oversized Markdown checks in the editor by @OrcaWin in https://github.com/stablyai/orca/pull/34798\n* Reuse folder connection checks across app state updates by @OrcaWin in https://github.com/stablyai/orca/pull/34800\n* Keep folds and horizontal scroll when you switch editor tabs by @OrcaWin in https://github.com/stablyai/orca/pull/34810\n* Keep restored reading positions separate for each file by @OrcaWin in https://github.com/stablyai/orca/pull/34816\n* Keep literal text when a citation paste falls back to plain text by @OrcaWin in https://github.com/stablyai/orca/pull/34827\n* Wait for a pause in typing before running Find in the editor by @OrcaWin in https://github.com/stablyai/orca/pull/34829\n* Accept large pastes in the editor before reading the clipboard by @OrcaWin in https://github.com/stablyai/orca/pull/34839\n* Stop idle TypeScript and JavaScript language workers separately by @OrcaWin in https://github.com/stablyai/orca/pull/34875\n* Skip repeated or abandoned syntax coloring of code excerpts by @OrcaWin in https://github.com/stablyai/orca/pull/34876\n* Open the source tab from a diff in Rich mode when Rich mode is on by @OrcaWin in https://github.com/stablyai/orca/pull/34898\n* Keep merge conflict navigation in the pane it belongs to by @OrcaWin in https://github.com/stablyai/orca/pull/34902\n* Cap how many closed editor contents Orca keeps track of by @OrcaWin in https://github.com/stablyai/orca/pull/34903\n* Cancel a paste when the file it targets changes by @OrcaWin in https://github.com/stablyai/orca/pull/34904\n* Handle file change events before reading, and share pane snapshots by @OrcaWin in https://github.com/stablyai/orca/pull/34920\n* Reuse the file snapshot when an editor opens by @OrcaWin in https://github.com/stablyai/orca/pull/34921\n* Copy gutter links from the file they belong to by @OrcaWin in https://github.com/stablyai/orca/pull/34922\n* Reuse line counts for unchanged review blocks by @OrcaWin in https://github.com/stablyai/orca/pull/34934\n* Keep notebook cell undo across cell and tab switches by @OrcaWin in https://github.com/stablyai/orca/pull/34952\n* Keep combining marks when replacing whole words by @OrcaWin in https://github.com/stablyai/orca/pull/34957\n* Keep review highlights in place after edits by @OrcaWin in https://github.com/stablyai/orca/pull/34963\n* Save delayed review notes only to the draft they belong to by @Orc