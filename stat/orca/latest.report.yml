dbf6ff7a0997c4223a030085e1f","download_count":21,"created_at":"2026-09-04T00:25:06Z","updated_at":"2026-09-04T00:25:07Z"},{"id":543567490,"node_id":"RA_kwDORpCz1s4gZi6C","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":181320808,"digest":"sha256:21c8a31448d1f6d0f5eee5a3a937adf05e140ff3d33679d166fc3dfbcc64f200","download_count":66955,"created_at":"2026-09-04T00:45:13Z","updated_at":"2026-09-04T00:45:18Z"},{"id":543567491,"node_id":"RA_kwDORpCz1s4gZi6D","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":183810,"digest":"sha256:670e7bf2a8fabf6760ddf3e736cd56de381cd88d5add4fe1a7c866eba20391ab","download_count":13902,"created_at":"2026-09-04T00:45:13Z","updated_at":"2026-09-04T00:45:13Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\nPlease note: It usually takes 48\u201372 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!\n\n## Notable changes\n* Faster worktree, renderer, editor, browser, terminal, and Git operations across local and remote workspaces.\n* More resilient agent sessions, native chat, SSH relay recovery, and Windows/WSL execution.\n* Expanded workspace, terminal, CLI, cloud, and cross-platform reliability improvements.\n\n## UI / workspaces\n* fix(task-page): restore behavior lost in the UI split by @nwparker in https://github.com/stablyai/orca/pull/17926\n* fix(renderer): restore behavior the UI split dropped by @nwparker in https://github.com/stablyai/orca/pull/18002\n* refactor(task-page): fold the task page into one provider-grouped tree by @nwparker in https://github.com/stablyai/orca/pull/18008\n* fix(palette): recompute quick-action availability when runtime status changes by @nwparker in https://github.com/stablyai/orca/pull/18027\n* feat(app): open Markdown files from the OS in the floating workspace by @nwparker in https://github.com/stablyai/orca/pull/17906\n* fix(review-notes): classify send failures and mirrored tabs by @Jinwoo-H in https://github.com/stablyai/orca/pull/18023\n* fix(github-project): sort and group empty field values last in both directions by @nwparker in https://github.com/stablyai/orca/pull/17921\n* perf(git-common): bound the fs-stat fan-out in the worktree pollers by @nwparker in https://github.com/stablyai/orca/pull/17839\n* fix(worktree): restore the stale-cleanup signal after the module split by @nwparker in https://github.com/stablyai/orca/pull/18058\n* perf(git): skip the sparse probe for worktree listings that never read it by @nwparker in https://github.com/stablyai/orca/pull/18050\n* fix(worktree): widen git-common watch on event-batch overflow by @nwparker in https://github.com/stablyai/orca/pull/17916\n* perf(worktree): fix the prepared-checkout hit rate and make misses visible by @nwparker in https://github.com/stablyai/orca/pull/17863\n* fix(session): stop two hosts sharing one workspace-session bucket by @nwparker in https://github.com/stablyai/orca/pull/17912\n* Prevent deleted workspace browser snapshot resurrection by @Jinwoo-H in https://github.com/stablyai/orca/pull/17779\n* perf(worktrees): gate worktree metadata hygiene on evidence, not on every listing by @nwparker in https://github.com/stablyai/orca/pull/18034\n* Auto-focus editor when opening new markdown file by @AmethystLiang in https://github.com/stablyai/orca/pull/18071\n* fix(automations): report an unverifiable process loss as lost, not failed by @nwparker in https://github.com/stablyai/orca/pull/17967\n* feat(editor): add Show Whitespace toggle option in diff viewer by @hwantage in https://github.com/stablyai/orca/pull/15120\n* perf(renderer): index worktree owner lookups instead of rescanning every workspace by @nwparker in https://github.com/stablyai/orca/pull/18130\n* Display favicons for browser website entries by @AmethystLiang in https://github.com/stablyai/orca/pull/18099\n* perf(editor,source-control): batch closed-tab model sweeps, drop 40 store subscriptions by @nwparker in https://github.com/stablyai/orca/pull/18144\n* perf(renderer): stop three always-mounted selectors rescanning the store on every write by @nwparker in https://github.com/stablyai/orca/pull/18136\n* perf(renderer): reconcile hydrated workspaces in one store write by @nwparker in https://github.com/stablyai/orca/pull/18150\n* test(editor): isolate prefix bleed in the batched model sweep, drop a dead export by @nwparker in https://github.com/stablyai/orca/pull/18240\n* perf(renderer): build useRef seeds once instead of every render by @nwparker in https://github.com/stablyai/orca/pull/18159\n* perf(renderer): drop react-markdown and the emoji catalog off the boot path (-371 KB eager JS) by @nwparker in https://github.com/stablyai/orca/pull/18149\n* perf(renderer): stop six timers from ticking behind a hidden window by @nwparker in https://github.com/stablyai/orca/pull/18134\n* perf(sidebar): stop re-allocating 423 workspace descriptors and 193 bucket projections per recompute by @nwparker in https://github.com/stablyai/orca/pull/18241\n* fix(worktrees): stop a resolved-worktree snapshot answering for repos it never saw by @nwparker in https://github.com/stablyai/orca/pull/18295\n* perf(file-explorer): stop rebuilding the whole visible tree twice per directory refresh by @nwparker in https://github.com/stablyai/orca/pull/18319\n* perf(browser-pane): share one rAF loop across client-hosted page overlays by @nwparker in https://github.com/stablyai/orca/pull/18313\n* fix(cleanup): route workspace cleanup by resolved exec