ces, and resume supported chats in a new CLI conversation.*\n\n* Size onboarding slides to the modal sheet on iPad by @Jinwoo-H in https://github.com/stablyai/orca/pull/26919\n* One host sidebar on iPad, with the page owning the host area by @Jinwoo-H in https://github.com/stablyai/orca/pull/26761\n* Keep chat drafts and the sidebar reachable on iPad by @brennanb2025 in https://github.com/stablyai/orca/pull/26096\n* Usage and account switching come from the paired server by @OrcaWin in https://github.com/stablyai/orca/pull/27135\n* Jira reaches the server by @OrcaWin in https://github.com/stablyai/orca/pull/27136\n* Keep tool results with the right command and reveal all results on mobile by @nwparker in https://github.com/stablyai/orca/pull/26968\n* Preselect LAN for a signed-out desktop by @OrcaWin in https://github.com/stablyai/orca/pull/27145\n* A new pairing scan supersedes a stale relay pairing journal by @OrcaWin in https://github.com/stablyai/orca/pull/27157\n* Agents for workspaces another runtime owns show why by @OrcaWin in https://github.com/stablyai/orca/pull/27196\n* The paired server is the web client's only host by @OrcaWin in https://github.com/stablyai/orca/pull/27266\n* Show SSH host health on the workspace row badge by @Jinwoo-H in https://github.com/stablyai/orca/pull/26415\n* Relay a paired phone's server-workspace requests through the desktop (hidden) by @Jinwoo-H in https://github.com/stablyai/orca/pull/26435\n* Let the desktop list its servers and their workspaces for the phone by @Jinwoo-H in https://github.com/stablyai/orca/pull/26442\n* Direct connections use v2 framing and never fall back once v2 is seen by @OrcaWin in https://github.com/stablyai/orca/pull/27473\n* Verified https pairing links; custom scheme carries no secret by @OrcaWin in https://github.com/stablyai/orca/pull/27475\n* Run focused checks for Mobile CI tool changes by @nwparker in https://github.com/stablyai/orca/pull/27532\n* Open Grok, OpenCode, OMP and Pi chats on the