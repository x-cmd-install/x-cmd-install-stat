/github.com/stablyai/orca/pull/28161\n* Run automated workspace setup in a dedicated Setup tab by @AmethystLiang in https://github.com/stablyai/orca/pull/29819\n* Show a PR found by Refresh, not \"already exists\" by @AmoabaKelvin in https://github.com/stablyai/orca/pull/29231\n* Paste CleanShot JPEG screenshots stored under the macOS PNG type by @AmoabaKelvin in https://github.com/stablyai/orca/pull/29685\n* Offer Force Delete with a plain warning when a checkout has submodules by @brennanb2025 in https://github.com/stablyai/orca/pull/28878\n* Remove close-button tooltip by @AmethystLiang in https://github.com/stablyai/orca/pull/29851\n* A manual folder-to-Git change proves the folder is the Git root first by @brennanb2025 in https://github.com/stablyai/orca/pull/29282\n* Compact the Space window layout by @nwparker in https://github.com/stablyai/orca/pull/29857\n* Catch up desktop chats from the newest page by @brennanb2025 in https://github.com/stablyai/orca/pull/29125\n* Never reclaim a create preparation another machine owns by @nwparker in https://github.com/stablyai/orca/pull/29957\n\n### Editor, files & Markdown\n\n*Keep files, previews and editor actions attached to the right workspace and machine.*\n\n* Allow paired-server files to drop into their own terminals by @nwparker in https://github.com/stablyai/orca/pull/26931\n* Orca file open and diff open name their owner by @OrcaWin in https://github.com/stablyai/orca/pull/27154\n* A paired-server link outside its workspace opens in the host workspace that holds it by @OrcaWin in https://github.com/stablyai/orca/pull/27226\n* Client drops on a remote composer upload through the import transaction by @OrcaWin in https://github.com/stablyai/orca/pull/27227\n* Links to this computer in a remote terminal open on the client with trusted provenance by @OrcaWin in https://github.com/stablyai/orca/pull/27234\n* A managed terminal links and opens a host file outside its workspace by @OrcaWin in https://github.com/stablyai/orca/pull/27364\n* Paste a macOS image copied beside its file URL by @benjaminb10 in https://github.com/stablyai/orca/pull/27346\n* Save editor-only host sessions during quit by @nwparker in https://github.com/stablyai/orca/pull/26848\n* Load authorized web fonts in HTML previews by @nwparker in https://github.com/stablyai/orca/pull/26849\n* Editor: Nim and Typst on the shared TextMate layer, so a long line can't freeze the window by @brennanb2025 in https://github.com/stablyai/orca/pull/26987\n* Share any HTML file from the editor and the remote preview by @brennanb2025 in https://github.com/stablyai/orca/pull/27608\n* Fix main CI failures in preview lint and history cleanup by @nwparker in https://github.com/stablyai/orca/pull/28108\n* Keep a pinned duplicate open on close and ignore setActiveFile for a missing file by @BearMett in https://github.com/stablyai/orca/pull/28120\n* Restrict secure files in-process instead of spawning icacls by @OrcaWin in https://github.com/stablyai/orca/pull/28135\n* Preserve valid terminal file links when another candidate fails by @nwparker in https://github.com/stablyai/orca/pull/28272\n* Never write through a dangling symlink by @brennanb2025 in https://github.com/stablyai/orca/pull/28385\n* Open files at a requested line and column by @nwparker in https://github.com/stablyai/orca/pull/28240\n* The host serves a chat's scratch folder as a file root by @brennanb2025 in https://github.com/stablyai/orca/pull/28397\n* Enter on a visited site's name opens the site, not a file by @AmethystLiang in https://github.com/stablyai/orca/pull/28804\n* Copy a file to the clipboard without a visible PowerShell window by @zanmlakar in https://github.com/stablyai/orca/pull/28781\n* A local worktree's tabs stay on this machine when its project is also on a paired server by @nwparker in https://github.com/stablyai/orca/pull/29403\n* Open large HTML, PDFs and images on a paired runtime by @nwparker in https://github.com/stablyai/orca/pull/29426\n\n### Browser, skills & feedback\n\n*Open typed websites from Cmd/Ctrl+J, share skills with more agents, and keep browser actions on the intended host.*\n\n* An absent editor or browser map is not a round-trip change by @OrcaWin in https://github.com/stablyai/orca/pull/27007\n* Keep browser tabs clickable after a drag that never starts by @Jinwoo-H in https://github.com/stablyai/orca/pull/26986\n* Return JPEG bytes for JPEG viewport screenshots by @nwparker in https://github.com/stablyai/orca/pull/26856\n* Say an SSH repo was not scanned instead of dropping it silently by @OrcaWin in https://github.com/stablyai/orca/pull/27261\n* Double-click in the address bar selects a word, like other browsers by @Jinwoo-H in https://github.com/stablyai/orca/pull/27371\n* Refuse web pages on the agent-browser CDP proxy by @OrcaWin in https://github.com/stablyai/orca/pull/27415\n* Judge official skill updates by ownership, not snapshot matching by @OrcaWin in https://github.com/stablyai/orca/pull/27603\n* End a page's mount admission whenever it leaves the store by @brennanb2025 in https://github.com/stablyai/orca/pull/27755\n* End a background page's mount admission after its first load by @brennanb2025 in https://github.com/stablyai/orca/pull/27754\n* Settle WSL tunnel reads so responses past 256 KiB complete by @OrcaWin in https://github.com/stablyai/orca/pull/27625\n* Annotation card and outline follow the picked element by @brennanb2025 in https://github.com/stablyai/orca/pull/27875\n* Use a minimize icon in the Update skills dialog by @nwparker in https://github.com/stablyai/orca/pull/28107\n* Collapse the annotation panel to one row by @AmoabaKelvin in https://github.com/stablyai/orca/pull/28138\n* Require a target for ambiguous keypress commands by @nwparker in https://github.com/stablyai/orca/pull/28221\n* Fix browser login popups and menu actions in native windows by @AmethystLiang in https://github.com/stablyai/orca/pull/28474\n* Agent bringToFront and activateTarget no longer take your keyboard (1/3) by @nwparker in https://github.com/stablyai/orca/pull/28452\n* Agent keys and text go to the page, never into your terminal (2/3) by @nwparker in https://github.com/stablyai/orca/pull/28453\n* Agent clicks give your keyboard back (3/3) by @nwparker in https://github.com/stablyai/orca/pull/28454\n* Force git messages to English so skill updates work in translated locales by @Jinwoo-H in https://github.com/stablyai/orca/pull/28994\n* Agent typing into a cross-site frame no longer borrows your keyboard by @nwparker in https://github.com/stablyai/orca/pull/29000\n* End downloads that are waiting for a manual resume Orca never offers by @brennanb2025 in https://github.com/stablyai/orca/pull/28936\n* Settle client-hosted download toasts after their page closes by @brennanb2025 in https://github.com/stablyai/orca/pull/28913\n* Derive skill discovery folders and home env overrides from the agent provider table by @Jinwoo-H in https://github.com/stablyai/orca/pull/29022\n* Share again under an existing skill bundle name as a new version by @Jinwoo-H in https://github.com/stablyai/orca/pull/29090\n* Install shared skills for 20 more agents and read every agent home in WSL by @Jinwoo-H in https://github.com/stablyai/orca/pull/29122\n* Group skill update checks by operating system by @nwparker in https://github.com/stablyai/orca/pull/29021\n* Managed SSH terminal links open in the Orca Browser again by @OrcaWin in https://github.com/stablyai/orca/pull/29215\n* Always allow leaving when a page asks to confirm by @AmoabaKelvin in https://github.com/stablyai/orca/pull/29142\n* Defer capture cleanup until streamed tabs finish closing by @OrcaWin in https://github.com/stablyai/orca/pull/29365\n* The remote browser tunnel goes through the server's outbound proxy by @nwparker in https://github.com/stablyai/orca/pull/29420\n* Closing a headless server's browser tab no longer crashes the server by @nwparker in https://github.com/stablyai/orca/pull/29480\n* List symlinked folders as folders in the remote Add Project browser by @nwparker in https://github.com/stablyai/orca/pull/29658\n* Let Cmd+J open typed websites in a new browser tab by @AmethystLiang in https://github.com/stablyai/orca/pull/29050\n\n### Performance & reliability\n\n*Reduce repeated status subscriptions and session-stream work, avoid blocking WSL checks, and make workspace creation and switching smoother.*\n\n* Send PTY output to main as raw bytes, not NDJSON by @outof-place in https://github.com/stablyai/orca/pull/27006\n* Keep per-source usage caches off the main thread by @outof-place in https://github.com/stablyai/orca/pull/26980\n* Resolve terminal names once per full process capture by @nwparker in https://github.com/stablyai/orca/pull/27146\n* Pipeline fresh transcript discovery with bounded I/O by @outof-place in https://github.com/stablyai/orca/pull/27009\n* Reduce terminal ANSI scanning work by @nwparker in https://github.com/stablyai/orca/pull/27344\n* Release startup allocations held by journal sentinel by @nwparker in https://github.com/stablyai/orca/pull/27342\n* Preserve Git scans when saving sort order by @nwparker in https://github.com/stablyai/orca/pull/27343\n* Skip unchanged lineage after sidebar order saves by @nwparker in https://github.com/stablyai/orca/pull/27384\n* Overlap Bun typechecking and skip redundant alias scans by @nwparker in https://github.com/stablyai/orca/pull/27382\n* Yield between bounded slices of terminal output ingest by @Jinwoo-H in https://github.com/stablyai/orca/pull/27578\n* Search Windows-drive projects with host ripgrep by @nwparker in https://github.com/stablyai/orca/pull/27690\n* Use Zod 4.6 validation and compile ACP updates by @nwparker in https://github.com/stablyai/orca/pull/27735\n* Stop leaving stuck lsof processes behind on a dead network mount by @brennanb2025 in https://github.com/stablyai/orca/pull/27729\n* Stop every Windows notification from freezing Orca by @brennanb2025 in https://github.com/stablyai/orca/pull/27731\n* Drop the extra PowerShell per hook event for Gemini, dsh, Kiro, Droid and Command Code by @OrcaWin in https://github.com/stablyai/orca/pull/27717\n* Run the Windows status hook as a direct .cmd, faster and UTF-8 safe by @OrcaWin in https://github.com/stablyai/orca/pull/27718\n* Check WSL working directories off the main thread by @OrcaWin in https://github.com/stablyai/orca/pull/27705\n* Run the Windows Claude hook as a signed native claude-hook.exe by @OrcaWin in https://github.com/stablyai/orca/pull/27719\n* Skip re-rendering unchanged worktree rows by @Jinwoo-H in https://github.com/stablyai/orca/pull/28058\n* Stop re-sending the worktree list to mobile pollers on every terminal chunk by @Jinwoo-H in https://github.com/stablyai/orca/pull/28062\n* Reuse verified Node and run the layout check with Bun by @nwparker in https://github.com/stablyai/orca/pull/28218\n* Pooled wsl.exe command loops and orcad compile cache on the WSL wake path (C4 follow-up) by @nwparker in https://github.com/stablyai/orca/pull/27923\n* Skip re-hashing unchanged orcad artifacts and guest Node runtime on the WSL wake path (C4c) by @nwparker in https://github.com/stablyai/orca/pull/27941\n* Stop a cancelled scan inside the file it is reading by @brennanb2025 in https://github.com/stablyai/orca/pull/27952\n* Read the composer's text and caret straight from the editor by @brennanb2025 in https://github.com/stablyai/orca/pull/28064\n* End a scan only when it stops making progress by @brennanb2025 in https://github.com/stablyai/orca/pull/28434\n* Keep a timed-out scan's finished transcripts by @brennanb2025 in https://github.com/stablyai/orca/pull/27937\n* Fetch the base while the host's create picks a name by @brennanb2025 in https://github.com/stablyai/orca/pull/26007\n* Share concurrent Codex title-index reads by @nwparker in https://github.com/stablyai/orca/pull/28497\n* Re-project only the written partition in the layout stream by @Jinwoo-H in https://github.com/stablyai/orca/pull/28845\n* Load structured agent adapters when the host starts by @nwparker in https://github.com/stablyai/orca/pull/29086\n* Release completed Windows pipe probe timers by @nwparker in https://github.com/stablyai/orca/pull/28560\n* A paired desktop gets only the tab that changed, not the whole workspace by @nwparker in https://github.com/stablyai/orca/pull/29319\n* A Smart-sort save on a paired host no longer refetches every repository or triggers the next save by @nwparker in https://github.com/stablyai/orca/pull/29333\n* A headless host ignores a remote pane's unchanged layout write by @nwparker in https://github.com/stablyai/orca/pull/29347\n* List a worktree's tabs over the ready shared socket, not a new one by @nwparker in https://github.com/stablyai/orca/pull/29360\n* Read a remote server's SSH target states three at a time by @nwparker in https://github.com/stablyai/orca/pull/29393\n* A parked web-mirror reveal reads its pane alongside the activation by @nwparker in https://github.com/stablyai/orca/pull/29472\n* Avoid dev reloads for excluded package files by @OrcaWin in https://github.com/stablyai/orca/pull/29481\n* Stop re-inspecting the setup-script prompt on every worktree revisit by @nwparker in https://github.com/stablyai/orca/pull/29514\n* Keep warm session streams for every worktree whose terminals stay mounted by @nwparker in https://github.com/stablyai/orca/pull/29516\n* Add an opt-in to skip main source maps during development by @OrcaWin in https://github.com/stablyai/orca/pull/29445\n* Avoid notification settings page imports during onboarding by @OrcaWin in https://github.com/stablyai/orca/pull/29570\n* Remove per-match quality array filtering by @nwparker in https://github.com/stablyai/orca/pull/29785\n* Reduce redundant sidebar agent status subscriptions by @OrcaWin in https://github.com/stablyai/orca/pull/29840\n* Flush send transactions without flushing every streamed revision by @brennanb2025 in https://github.com/stablyai/orca/pull/28966\n\n### Languages\n\n*Updated translations and more consistent labels across the app.*\n\n* Correct Korean Finder menu label by @nwparker in https://github.com/stablyai/orca/pull/26866\n* Correct Korean CI check translations by @abruption in https://github.com/stablyai/orca/pull/27367\n* Speed up import checks, localization extraction, and CI typechecking by @nwparker in https://github.com/stablyai/orca/pull/27727\n* Drop chat-mode keys removed from en.json in #28113 by @nwparker in https://github.com/stablyai/orca/pull/28131\n* Correct Korean Settings translations by @Jinwoo-H in https://github.com/stablyai/orca/pull/28183\n* Translate Settings help as whole sentences instead of fragments by @Jinwoo-H in https://github.com/stablyai/orca/pull/28185\n* Nest settings translation keys for language packs by @nwparker in https://github.com/stablyai/orca/pull/28251\n* Reuse import analysis and run localization coverage with Bun by @nwparker in https://github.com/stablyai/orca/pull/28463\n* Translate 259 new keys to es/fr/ja/ko/zh by @AmethystLiang in https://github.com/stablyai/orca/pull/28486\n* Correct literal-sense Japanese mistranslations by @sojiro-o in https://github.com/stablyai/orca/pull/28535\n* Drop setup-only keys and fix the default-tab test #28543 left red by @Jinwoo-H in https://github.com/stablyai/orca/pull/28603\n* Drop catalog strings left behind by the automation removal by @Jinwoo-H in https://github.com/stablyai/orca/pull/28810\n* Correct the Japanese label for the Cleaned browser identity by @sojiro-o in https://github.com/stablyai/orca/pull/28526\n* Use \u30af\u30ea\u30fc\u30f3\u30a2\u30c3\u30d7 in the Japanese VM cleanup stop dialog by @sojiro-o in https://github.com/stablyai/orca/pull/28533\n* Remove obsolete Hermes cron docs and translations by @AmethystLiang in https://github.com/stablyai/orca/pull/28877\n* Translate new keys to es/fr/ja/ko/zh (scan 2026-10-14) by @AmethystLiang in https://github.com/stablyai/orca/pull/28896\n* Refine release channel and chat input translations by @AmethystLiang in https://github.com/stablyai/orca/pull/29027\n* Translate new keys to es/fr/ja/ko/zh (scan 2026-10-15) by @AmethystLiang in https://github.com/stablyai/orca/pull/29281\n\n### Relay service\n\n*Connection routing, service recovery and relay operations receive reliability improvements.*\n\n* Pin staging c4 to image G for E-pre by @Jinwoo-H in https://github.com/stablyai/orca/pull/28854\n* Pin staging c1, c5, c6 and c7 to image G for E-pre by @Jinwoo-H in https://github.com/stablyai/orca/pull/28872\n* Split step-5 shadow compare and dry-run logs per cell by @Jinwoo-H in https://github.com/stablyai/orca/pull/28693\n* Watch a reserve cell and flip it back on the first step 5 stop rule by @Jinwoo-H in https://github.com/stablyai/orca/pull/28698\n* Log where the sticky lane's slot time goes, per pooled connection by @Jinwoo-H in https://github.com/stablyai/orca/pull/28908\n* Check clock skew on every cell production.tfvars declares by @zanmlakar in https://github.com/stablyai/orca/pull/28786\n* Destroy a pooled client whose session the server ended by @Jinwoo-H in https://github.com/stablyai/orca/pull/29573\n* One ask-wait clamp and no needless exports by @nwparker in https://github.com/stablyai/orca/pull/29835\n\nThe remaining changes are listed in the [complete release notes](https://github.com/stablyai/orca/releases/download/v1.4.229/orca-v1.4.229-complete-changelog.md), with every title and contributor credit.\n\n### Reverted\n\n*Reverts and follow-up corrections included in this release.*\n\n* Revert \"+\" new-tab agent launches to the window route (reverts #26489) by @brennanb2025 in https://github.com/stablyai/orca/pull/27173\n* Revert \"feat(mobile): verified https pairing links; custom scheme carries no secret\" (#27475) by @OrcaWin in https://github.com/stablyai/orca/pull/27693\n\n### Tests, CI & maintenance\n\n*Broader regression coverage, build and release fixes, and internal cleanup support the changes above.*\n\n* Move the pure workspace-list builder into src/shared/sidebar-list (no visible change) by @Jinwoo-H in https://github.com/stablyai/orca/pull/29906\n* Keep an editor tab Orca moved to its file's workspace across restart; record editor renames in main (dark) by @Jinwoo-H in https://github.com/stablyai/orca/pull/29930\n* Send a terminal tab's own changes to main first, from every caller (dark, layout-owner build only) by @Jinwoo-H in https://github.com/stablyai/orca/pull/29904\n* Move the sidebar's time rules into shared pure reducers by @Jinwoo-H in https://github.com/stablyai/orca/pull/29943\n* Golden for accented, mixed-case and numbered names by @Jinwoo-H in https://github.com/stablyai/orca/pull/29966\n* Wait for macOS build metadata after dispatch by @nwparker in https://github.com/stablyai/orca/pull/29974\n* Merge the Android APK download bump automatically by @Jinwoo-H in https://github.com/stablyai/orca/pull/29981\n* Allow tag cuts when main requires pull requests by @nwparker in https://github.com/stablyai/orca/pull/29985\n\nThe remaining changes are listed in the [complete release notes](https://github.com/stablyai/orca/releases/download/v1.4.229/orca-v1.4.229-complete-changelog.md), with every title and contributor credit.\n\n## New Contributors\n\n* @w-felipe360 made their first contribution in https://github.com/stablyai/orca/pull/26695\n* @outof-place made their first contribution in https://github.com/stablyai/orca/pull/27006\n* @fabricedge made their first contribution in https://github.com/stablyai/orca/pull/26881\n* @parkavenue9639 made their first contribution in https://github.com/stablyai/orca/pull/24964\n* @abruption made their first contribution in https://github.com/stablyai/orca/pull/27367\n* @f8team made their first contribution in https://github.com/stablyai/orca/pull/27374\n* @vampik33 made their first contribution in https://github.com/stablyai/orca/pull/25211\n* @benjaminb10 made their first contribution in https://github.com/stablyai/orca/pull/27346\n* @sergeytiron made their first contribution in https://github.com/stablyai/orca/pull/23459\n* @BearMett made their first contribution in https://github.com/stablyai/orca/pull/28120\n* @leog made their first contribution in https://github.com/stablyai/orca/pull/25617\n* @sojiro-o made their first contribution in https://github.com/stablyai/orca/pull/28535\n* @zanmlakar made their first contribution in https://github.com/stablyai/orca/pull/28781\n* @orchardprior made their first contribution in https://github.com/stablyai/orca/pull/29018\n* @Velm14 made their first contribution in https://github.com/stablyai/orca/pull/28023\n* @SungsooKwon made their first contribution in https://github.com/stablyai/orca/pull/29532\n\n---\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.227...v1.4.229\n\n","reactions":{"total_count":15,"+1":3,"-1":0,"laugh":2,"hooray":0,"confused":0,"heart":4,"rocket":6,"eyes":0},"mentions_count":23}
