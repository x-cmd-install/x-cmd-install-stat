ar delete by @brennanb2025 in https://github.com/stablyai/orca/pull/23593\n\n### SSH, managed servers & remote\n\n*Reconnect after sleep or a network drop, recover split panes without losing their siblings, resume sleeping agents, and preserve each machine\u2019s projects and running work.*\n\n* Show help before server startup by @nwparker in https://github.com/stablyai/orca/pull/26855\n* Start AI commit messages from the same shell environment chats use by @Jinwoo-H in https://github.com/stablyai/orca/pull/26808\n* Host registry stops minting client SSH hosts from a server's nested target by @OrcaWin in https://github.com/stablyai/orca/pull/26952\n* Folder workspaces can answer \"paired server\" by @OrcaWin in https://github.com/stablyai/orca/pull/26958\n* Keep MCP repository settings on their selected host by @nwparker in https://github.com/stablyai/orca/pull/26859\n* Extract subprocess handling into @orca/process-host by @nwparker in https://github.com/stablyai/orca/pull/26963\n* Keep a floating terminal floating when its cwd is inside a workspace by @OrcaWin in https://github.com/stablyai/orca/pull/27088\n* Bounded OpenClaw discovery; title filter when a host's search is off by @OrcaWin in https://github.com/stablyai/orca/pull/27089\n* A tab stream the host ends resubscribes on the retry backoff by @OrcaWin in https://github.com/stablyai/orca/pull/27098\n* Automatic tab activation no longer wakes a worktree the host put to sleep by @OrcaWin in https://github.com/stablyai/orca/pull/27081\n* A direct-SSH host republish no longer steals this view's tab selection by @OrcaWin in https://github.com/stablyai/orca/pull/27100\n* A restored terminal row is retired only by its own host PTY by @OrcaWin in https://github.com/stablyai/orca/pull/27101\n* Honor the OpenSSH DefaultShell on Windows SSH hosts running orcad by @OrcaWin in https://github.com/stablyai/orca/pull/27085\n* A returning paired publisher is repaired by an authoritative census by @OrcaWin in https://github.com/stablyai/orca/pull/27094\n* Implicit worktree selection is scoped to the caller's host by @OrcaWin in https://github.com/stablyai/orca/pull/27108\n* The unresolved-owner sentinel is never routable by @OrcaWin in https://github.com/stablyai/orca/pull/27111\n* Worktree create enforces the lineage host boundary by @OrcaWin in https://github.com/stablyai/orca/pull/27114\n* Every repo catalog uses the host-catalog fence by @OrcaWin in https://github.com/stablyai/orca/pull/27116\n* A terminal close commits in the session partition that holds the tab by @OrcaWin in https://github.com/stablyai/orca/pull/27119\n* Closing a tab is never a silent no-op by @OrcaWin in https://github.com/stablyai/orca/pull/27132\n* A server whose status answers is selectable while shared control connects by @OrcaWin in https://github.com/stablyai/orca/pull/27137\n* Speed up process-host import enforcement in CI by @nwparker in https://github.com/stablyai/orca/pull/27124\n* Advertise a key and fallback port the host can actually serve by @OrcaWin in https://github.com/stablyai/orca/pull/27158\n* OS open actions follow the file's owner, not the focused server by @OrcaWin in https://github.com/stablyai/orca/pull/27165\n* Deleting a project with live terminals warns and needs --force by @OrcaWin in https://github.com/stablyai/orca/pull/27172\n* Servers publish a host descriptor by @OrcaWin in https://github.com/stablyai/orca/pull/27193\n* Host-scoped port scan and stop on the server by @OrcaWin in https://github.com/stablyai/orca/pull/27188\n* Check the runtime source before sending by @OrcaWin in https://github.com/stablyai/orca/pull/27206\n* The host refuses a request meant for another runtime by @OrcaWin in https://github.com/stablyai/orca/pull/27224\n* Terminal IDs, agent rows and dashboard rows follow the owner by @OrcaWin in https://github.com/stablyai/orca/pull/27243\n* Dashboard terminal previews from the owning host by @OrcaWin in https://github.com/stablyai/orca/pull/27250\n* The ports