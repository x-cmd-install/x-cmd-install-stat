n https://github.com/stablyai/orca/pull/28451\n* Use favourite filters within their source site by @nwparker in https://github.com/stablyai/orca/pull/29037\n* Show linked workspaces in Has Workspace by matching the Jira login, not its label by @Jinwoo-H in https://github.com/stablyai/orca/pull/29201\n* Session History: show the scan's progress in a strip under the search box by @brennanb2025 in https://github.com/stablyai/orca/pull/28576\n* Keep collapsed sidebar agent cards steady when the child arrow appears by @nwparker in https://github.com/stablyai/orca/pull/29246\n* Session History: let a scan run until it finishes instead of stopping it after 130 s by @brennanb2025 in https://github.com/stablyai/orca/pull/29073\n* Stop nested reviews from collapsing Claude children by @nwparker in https://github.com/stablyai/orca/pull/29264\n* Resolve SSH host aliases for account binding by @orchardprior in https://github.com/stablyai/orca/pull/29018\n* Clear a Claude permission wait when its approved tool fails by @nwparker in https://github.com/stablyai/orca/pull/29387\n* Keep scan notices from burying the session list by @nwparker in https://github.com/stablyai/orca/pull/29392\n* Show usage from the host that owns the accounts by @nwparker in https://github.com/stablyai/orca/pull/29430\n* Removing a worktree drops its sleeping-agent records by @nwparker in https://github.com/stablyai/orca/pull/29449\n* Remote worker liveness reports exited when the host proves the agent gone by @nwparker in https://github.com/stablyai/orca/pull/29276\n* Quote resume commands for a Windows SSH host's own shell by @nwparker in https://github.com/stablyai/orca/pull/29409\n* Release a Claude permission wait that ended during an SSH disconnect by @nwparker in https://github.com/stablyai/orca/pull/29482\n* The wake sweep no longer forks sessions owned by a disconnected SSH pane or a stale-workspace record by @nwparker in https://github.com/stablyai/orca/pull/29454\n* A proven agent exit survives