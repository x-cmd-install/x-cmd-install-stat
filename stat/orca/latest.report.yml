once by @nwparker in https://github.com/stablyai/orca/pull/18893\n* perf(editor): reuse Markdown source blocks while positioning review notes by @nwparker in https://github.com/stablyai/orca/pull/18895\n* perf(editor): reuse live Markdown search matches across unrelated renders by @nwparker in https://github.com/stablyai/orca/pull/18903\n* perf(explorer): remove redundant dotfile path filter allocation by @nwparker in https://github.com/stablyai/orca/pull/18929\n* perf(browser): reuse decoded single-chunk upload buffers by @nwparker in https://github.com/stablyai/orca/pull/18960\n* perf(tabs): index saved tab order during hydration repair by @nwparker in https://github.com/stablyai/orca/pull/18964\n* perf(palette): reuse allowed quality arrays during matching by @nwparker in https://github.com/stablyai/orca/pull/18966\n* perf(renderer): gate the tab strip's worktree subscriptions and fix the orchestration batch's self-invalidating cache by @nwparker in https://github.com/stablyai/orca/pull/18428\n* perf(renderer): load the project-location and feedback dialogs on click by @nwparker in https://github.com/stablyai/orca/pull/18440\n* perf(renderer): narrow the App-root badge and terminal pty-set subscriptions by @nwparker in https://github.com/stablyai/orca/pull/18444\n* perf(worktree): remove redundant creation and terminal startup work by @nwparker in https://github.com/stablyai/orca/pull/18793\n* perf(worktrees): classify each worktree once, defer the SSH meta index, drop the conflict-path probe by @nwparker in https://github.com/stablyai/orca/pull/18433\n* perf(remote): read the repo catalog once per publish, not once per worktree by @nwparker in https://github.com/stablyai/orca/pull/18410\n* perf(ssh): coalesce concurrent git.listWorktrees reads by @nwparker in https://github.com/stablyai/orca/pull/18419\n* perf(worktree): skip remote probes with no possible result by @nwparker in https://github.com/stablyai/orca/pull/18821\n\n### Performance: terminal & remote\n* perf(orchestration): bound the worker terminal archive in linear time by @nwparker in https://github.com/stablyai/orca/pull/18622\n* perf(terminal): scan only new tail lines for the wait-blocked sentinel by @nwparker in https://github.com/stablyai/orca/pull/18437\n* perf(terminals): spend one inspection start on a whole cadence round by @nwparker in https://github.com/stablyai/orca/pull/18438\n* perf(terminal): stop copying every PTY chunk for two startup-error detectors by @nwparker in https://github.com/stablyai/orca/pull/18626\n* perf(terminal): use real event-loop yields between chunked writes by @nwparker in https://github.com/stablyai/orca/pull/18627\n* perf(terminal): skip the partial-escape-tail walk on ESC-free PTY chunks by @nwparker in https://github.com/stablyai/orca/pull/18748\n* perf(persistence): skip rewriting unchanged terminal scrollback snapshots by @nwparker in https://github.com/stablyai/orca/pull/18764\n* perf(terminal): cheap-tier process inspection for anchored local agent panes by @nwparker in https://github.com/stablyai/orca/pull/18780\n* perf(persistence): stop dead SSH leases pinning metadata, retire unreachable tombstones by @nwparker in https://github.com/stablyai/orca/pull/18430\n* perf(runtime): stop the expired-SSH-lease sweep from rescanning every tab layout by @nwparker in https://github.com/stablyai/orca/pull/18409\n* perf(relay): per-cell inventory locks, delta counters, and a pool statement timeout by @Jinwoo-H in https://github.com/stablyai/orca/pull/18722\n* perf(relay): bound the symlink directory probes a remote readDir fans out by @nwparker in https://github.com/stablyai/orca/pull/18752\n* perf(relay): drain fragmented frame buffers in linear time by @nwparker in https://github.com/stablyai/orca/pull/18891\n* perf(ssh): reuse and release relay startup buffers by @nwparker in https://github.com/stablyai/orca/pull/18953\n* perf(ssh): reuse streamed response idle timers by @nwparker in https://github.com/stablyai/orca/pull/18956\n* perf(terminal): gate the Command Code banner scan before building its scan windows by @nwparker in https://github.com/stablyai/orca/pull/18628\n* perf(terminals): let idle panes share one process-table capture instead of forking their own by @nwparker in https://github.com/stablyai/orca/pull/18742\n\n### Performance: core & infrastructure\n* perf(mobile): cancel direct probes when their owner stops by @nwparker in https://github.com/stablyai/orca/pull/18940\n* perf(speech): reuse the model download idle timer by @nwparker in https://github.com/stablyai/orca/pull/18945\n* perf(paths): guard the no-op regex passes on the path-comparison hot path by @nwparker in https://github.com/stablyai/orca/pull/18418\n* perf(images): probe raster headers instead of decoding whole payloads, memoize repo icon validation by @nwparker in https://github.com/stablyai/orca/pull/18421\n* perf(startup): stop the persistence startup milestone from timing its own details closure by @nwparker in https://github.com/stablyai/orca/pull/18439\n* perf(persistence): stop double-traversing the persisted session at load by @nwparker in https://github.com/stablyai/orca/pull/18458\n* perf(main): take the idle ownership poll off the main thread and batch pending marker probes by @nwparker in https://github.com/stablyai/orca/pull/18425\n* perf(ipc): build the filesystem allowed-root list once per authorization by @nwparker in https://github.com/stablyai/orca/pull/18423\n* perf(git): overlap the three independent submodule status reads by @nwparker in https://github.com/stablyai/orca/pull/18623\n* perf(ports): serve unchanged macOS listeners from remembered metadata by @nwparker in https://github.com/stablyai/orca/pull/18650\n* perf(persistence): stop the session write re-scanning and rebuilding unchanged state by @nwparker in https://github.com/stablyai/orca/pull/18739\n* perf(repos): avoid quadratic icon source scans by @nwparker in https://github.com/stablyai/orca/pull/18892\n* perf(watcher): sk