2d22a55b22e7e6d2ad282e22b6ad95acfe1e53a679fdc757e67d3f917ca","download_count":47,"created_at":"2026-10-07T01:46:16Z","updated_at":"2026-10-07T01:46:16Z"},{"id":617304264,"node_id":"RA_kwDORpCz1s4ky1DI","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":220129216,"digest":"sha256:337de1d3127d2f5b6def4d9e8708af4e1c1e9a6017f2ac326f5dd4ffd8cf30f2","download_count":37766,"created_at":"2026-10-07T02:16:25Z","updated_at":"2026-10-07T02:16:32Z"},{"id":617304265,"node_id":"RA_kwDORpCz1s4ky1DJ","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":211802,"digest":"sha256:207ef9ca61e1e1bae919c063dc01d065637a01946c04c2e2d9685992d0ab23d9","download_count":11483,"created_at":"2026-10-07T02:16:25Z","updated_at":"2026-10-07T02:16:25Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\n\nOrca Server 2.0 is coming soon, with improvements to make remote work more reliable. The current Remote Server remains experimental and may have bugs.\n\n## The short version\n\n- **OpenCode workers:** A worker started with `orca orchestration worker-start --agent opencode` no longer leaves its task sitting unsent in OpenCode's input box on a busy machine; Orca now waits until OpenCode can actually submit it. A worker can use a requested model without changing the default for your other launches, OpenCode 2.0.12 sends its first prompt on its own, and Orca's OpenCode plugin is installed where that terminal's OpenCode actually reads its settings.\n- **Sidebar and workspaces:** A remote computer you reveal in the sidebar no longer disappears again while Orca saves the setting. Dragging a workspace whose children are collapsed now moves it, dragging workspaces can no longer crash the sidebar, the delete dialog stops jumping while its checks load, and Create worktree closes right away while setup scripts are checked in the background.\n- **CSV files:** Large CSV files open without loading the whole file at once. You can resize columns, open links, edit cells, add or remove rows and columns, copy and paste ranges, and sort or filter, and column widths are remembered.\n- **Editor:** Tabs for files outside your projects no longer come back as \"Access denied\" after a restart. Files with the same path on different computers keep separate text and Undo history. Image pastes and large Markdown pastes land where you started them, and notebook cells pick up changes made on disk.\n- **Typing in Japanese, Chinese or Korean:** Pressing Enter to confirm text no longer also submits the field, creates the file, or sends the comment, across Orca.\n- **Native chat (experimental):** Opening a chat never deletes its history, even one saved by a newer Orca. Messages show \"Sending\u2026\" until the host confirms them and \"Not sent\" with the reason if delivery failed. Stop only marks the turn it actually stopped, a failed start no longer blocks new chats, the model list comes from the machine that runs the chat, and a reply cut off by a crash or quit reads as finished with one explanation.\n- **Agents and accounts:** The usage menu shows Claude usage credits, OpenCode Zen balance and Codex credits next to usage limits. Restart after switching Codex accounts resumes the same conversation instead of leaving a blank terminal. A saved model pick and a configured agent argument no longer send the same flag twice and stop the agent from starting, and Cursor usage reads the right account.\n- **Remote terminals:** Coming back to a remote tab running Claude Code no longer shows old shell output through Claude's screen.\n- **Jira:** You can pick the assignee when creating a Jira issue.\n\n## Known issues\n\n**Agent detection after updating:** If you update from v1.4.221, improvements to OpenCode, Pi, and Qoder detection take effect after the terminal background service restarts. Existing terminals keep running through the update.\n\n**Windows on ARM:** The ARM64 package ships an x64 `orca.exe` command-line tool. Windows 11 on ARM runs it under emulation. Windows 10 on ARM can't run it, so the `orca` command does not work there (#24094).\n\n**OpenCode 2:** If you update from v1.4.219 or earlier, OpenCode 2 panes that were already running may show no status until you restart OpenCode in them. If you downgrade Orca after updating, duplicate OpenCode status plugins are left behind. After `opencode run` exits, its pane can keep showing \"Done\"; a fix is pending in #24472.\n\n**Codex:** After you upgrade, Codex launches use Orca's managed Codex home until Codex approves Orca's new status hook. A resumed pane that uses `~/.codex` can pause for up to 30 seconds (#23552).\n\n**Claude folder trust:** Folder pre-trust is on by default (Settings \u2192 Agents \u2192 \"Trust the folder when Orca starts an agent\"). On Alpine WSL, Orca can't copy the file permissions it needs, so Claude shows its own trust prompt instead (#23744).\n\n---\n\n## Product experience\n\n### Codex & orchestration\n\n*OpenCode workers receive their task once OpenCode can submit it and can use their own model, long launch prompts from the phone are pasted once the agent is ready, and switching Codex accounts resumes the same conversation.*\n\n* fix(orchestration): give an OpenCode worker its task only once OpenCode can submit it by @OrcaWin in https://github.com/stablyai/orca/pull/25101\n* Validate OpenCode worker model preferences on the execution host by @nwparker in https://github.com/stablyai/orca/pull/24624\n* Keep OpenCode worker model selection separate from the default by @nwparker in https://github.com/stablyai/orca/pull/24768\n* feat(agent-launch): keep long prompts off the launch line and paste them after readiness (step 1 of 7) by @brennanb2025 in https://github.com/stablyai/orca/pull/24257\n* fix(codex): resume account switches without blanking the terminal by @nwparker in https://github.com/stablyai/orca/pull/25485\n\n### Native chat\n\n*Opening a chat never deletes its history, messages show whether they were sent, Stop and failed starts behave correctly, and the model list comes from the machine that runs the chat.*\n\n* fix(native-chat): never delete chat history on read; a chat Orca can't load says why once by @brennanb2025 in https://github.com/stablyai/orca/pull/24576\n* fix(native-chat): show \"Sending\u2026\" on a message until the host confirms it by @brennanb2025 in https://github.com/stablyai/orca/pull/24606\n* fix(native-chat): show a message Orca accepted and then failed to deliver as \"Not sent\" in the chat by @brennanb2025 in https://github.com/stablyai/orca/pull/24710\n* A resent chat message gets its recorded answer, never an early refusal or a made-up record by @brennanb2025 in https://github.com/stablyai/orca/pull/25158\n* fix(native-chat): a Stop binds only the turn it actually stopped by @brennanb2025 in https://github.com/stablyai/orca/pull/24864\n* fix(native-chat): start a new chat after an earlier start failed by @brennanb2025 in https://github.com/stablyai/orca/pull/24917\n* fix(native-chat): show a reply cut off by an Orca crash or quit like a finished turn, with one explanation by @brennanb2025 in https://github.com/stablyai/orca/pull/25043\n* fix(native-chat): a new structured chat's model list comes from the machine that runs it by @brennanb2025 in https://github.com/stablyai/orca/pull/25143\n* fix(native-chat): a chat's finished-turn alerts come from the host recorded on its tab, not its workspace id by @brennanb2025 in https://github.com/stablyai/orca/pull/25081\n\n### Agents, accounts & integrations\n\n*Credit balances appear next to usage limits, OpenCode gets its plugin and first prompt more reliably, agents no longer fail to start on duplicate flags, and Cursor usage reads the right account.*\n\n* Show provider credit balances alongside usage limits by @nwparker in https://github.com/stablyai/orca/pull/25408\n* Fix duplicate session option flags and preserve argument values by @AmethystLiang in https://github.com/stablyai/orca/pull/25382\n* fix(cursor): keep usage cookies on the resolved account by @nwparker in https://github.com/stablyai/orca/pull/25243\n* Submit initial OpenCode 2.0.12 prompts through the native startup plugin by @nwparker in https://github.com/stablyai/orca/pull/25428\n* Install OpenCode hooks in the terminal's config directory by @nwparker in https://github.com/stablyai/orca/pull/25296\n* Add repository OpenCode permission defaults by @nwparker in https://github.com/stablyai/orca/pull/25326\n* fix(opencode): keep detached services from invalidating the foreground terminal by @nwparker in https://github.com/stablyai/orca/pull/25378\n* Bound OpenCode history reads and repeated worker failures by @nwparker in https://github.com/stablyai/orca/pull/25292\n\n### Terminal\n\n*Remote tabs running Claude Code no longer show old output through its screen, and the card shown while your phone controls a terminal is simpler.*\n\n* fix(terminal): stop old output bleeding into Claude's screen when revisiting a remote tab by @Jinwoo-H in https://github.com/stablyai/orca/pull/24926\n* Simplify the phone-control and phone-size terminal dialogs by @Jinwoo-H in https://github.com/stablyai/orca/pull/25307\n\n### Mobile app & paired clients\n\n*Android chat scrolls without selecting words, working indicators keep turning, pinned workspaces follow the desktop setting, and the in-app Android download links point to 0.0.52.*\n\n* fix(mobile): stop Android from selecting words while the chat transcript scrolls by @chokolademilch7 in https://github.com/stablyai/orca/pull/22871\n* fix(mobile): keep the working rings turning on the OTA page by @Jinwoo-H in https://github.com/stablyai/orca/pull/25299\n* fix(mobile): honour the desktop pinned-worktree placement setting by @Jinwoo-H in https://github.com/stablyai/orca/pull/25301\n* Add shared workspace settings note and prevent filter modal expansion by @AmethystLiang in https://github.com/stablyai/orca/pull/25300\n* Update in-app Android APK links to mobile 0.0.52 by @brennanb2025 in https://github.com/stablyai/orca/pull/25168\n\n### Workspaces & sidebar\n\n*Revealed remote computers stay visible, workspaces with collapsed children can be reordered without crashes, the delete dialog stays steady, Create worktree no longer waits on script checks, and Activity previews stay short.*\n\n* fix(sidebar): preserve remote host visibility across stale UI updates by @nwparker in https://github.com/stablyai/orca/pull/25737\n* Fix reordering workspaces with collapsed children by @nwparker in https://github.com/stablyai/orca/pull/25302\n* Fix: settle sortEpoch in store to prevent React update depth exceeded by @AmethystLiang in https://github.com/stablyai/orca/pull/25313\n* Keep workspace deletion dialogs steady while changes load by @nwparker in https://github.com/stablyai/orca/pull/25321\n* fix: close worktree dialog before slow script checks by @nwparker in https://github.com/stablyai/orca/pull/25472\n* fix(activity): keep code blocks in row previews from rendering as scroll boxes by @Jinwoo-H in https://github.com/stablyai/orca/pull/25410\n\n### Input, settings & languages\n\n*Enter used to confirm Japanese, Chinese or Korean text no longer submits fields, keep-awake descriptions explain what each platform does with a closed lid, and terminal shell settings are translated.*\n\n* fix: prevent IME Enter from submitting text fields across Orca by @nwparker in https://github.com/stablyai/orca/pull/25480\n* fix(ui): restore IME Enter protection in workspace details by @setodeve in https://github.com/stablyai/orca/pull/24099\n* Update Caffeinate tooltip copy about MacBook lid behavior by @AmethystLiang in https://github.com/stablyai/orca/pull/23091\n* Clarify keep-awake tooltip behavior by platform by @AmethystLiang in https://github.com/stablyai/orca/pull/25323\n* Add translations for terminal shell settings by @AmethystLiang in https://github.com/stablyai/orca/pull/25418\n\n### Editor, files & search\n\n*Large CSVs open quickly and can be edited as a table, tabs for files outside your projects reopen after a restart, same-path files on different computers stay separate, pastes land where you started, and search previews hold less memory.*\n\n* Keep large CSV previews responsive and add column resizing and links by @nwparker in https://github.com/stablyai/orca/pull/25381\n* Edit CSV tables directly and remember column widths by @nwparker in https://github.com/stablyai/orca/pull/25442\n* fix(editor): restored tabs for files outside your projects no longer fail with Access denied by @brennanb2025 in https://github.com/stablyai/orca/pull/24489\n* Isolate code editor text and Undo history by execution host by @nwparker in https://github.com/stablyai/orca/pull/25174\n* Preserve image clipboard targets and content across editor changes by @nwparker in https://github.com/stablyai/orca/pull/25176\n* Keep large Markdown pastes at their original selection by @nwparker in https://github.com/stablyai/orca/pull/25177\n* Keep selected text navigation from rewriting document links by @nwparker in https://github.com/stablyai/orca/pull/25175\n* Reuse source-line calculations for Markdown review selections by @nwparker in https://github.com/stablyai/orca/pull/25173\n* Keep active notebook cells current after external reloads by @nwparker in https://github.com/stablyai/orca/pull/25172\n* Bound search preview memory and stop canceled SSH scans by @nwparker in https://github.com/stablyai/orca/pull/25303\n* Replace patched JSON parser with stream-json by @nwparker in https://github.com/stablyai/orca/pull/25202\n\n### Tasks & issues\n\n*You can pick the assignee when creating a Jira issue, and the paired web client handles a missing Jira status.*\n\n* feat(jira): pick the assignee when creating an issue \u2014 Automatic, me, or anyone by @kazuki-hanai in https://github.com/stablyai/orca/pull/24376\n* fix(jira): stop the paired web client crashing on a missing Jira status by @brennanb2025 in https://github.com/stablyai/orca/pull/25579\n\n### Relay service\n\n*Server-side capacity and cleanup work for Orca's relay service.*\n\n* feat(relay): declare Asia spare cell c34 as migration-only by @Jinwoo-H in https://github.com/stablyai/orca/pull/25336\n* chore(relay): move US cells c32 and c33 to the general same-cap list after promotion by @Jinwoo-H in https://github.com/stablyai/orca/pull/25367\n* fix(relay): skip the dead-cell sweep's host scan when no cell qualifies by @Jinwoo-H in https://github.com/stablyai/orca/pull/25350\n* fix(relay): prune released control-connection reservations in bounded batches by @Jinwoo-H in https://github.com/stablyai/orca/pull/25352\n* fix(relay): retain confirm results for a week and audit events for 90 days by @Jinwoo-H in https://github.com/stablyai/orca/pull/25353\n* refactor(relay): stop creating three tables nothing writes by @Jinwoo-H in https://github.com/stablyai/orca/pull/25354\n\n### Tests, CI & maintenance\n\n*PR checks spend less time on setup and on failing runs, contributor docs match the PR template, and code was reorganized with no change in behavior.*\n\n* Reduce avoidable work in PR checks and SSH test setup by @nwparker in https://github.com/stablyai/orca/pull/25309\n* Wait for PR preflight before admitting short required checks by @nwparker in https://github.com/stablyai/orca/pull/25317\n* Reduce repeated CI setup and overlap mobile typechecks by @nwparker in https://github.com/stablyai/orca/pull/25359\n* Reduce repeated terminal scans and unused Qoder test imports by @nwparker in https://github.com/stablyai/orca/pull/25425\n* fix(test): pass getInsertionRange in the image-insert access test by @Jinwoo-H in https://github.com/stablyai/orca/pull/25351\n* fix(test): give the image-insert store fakes an open-files list by @Jinwoo-H in https://github.com/stablyai/orca/pull/25357\n* test(linear): cover numeric-leading issue identifiers by @kenfdev in https://github.com/stablyai/orca/pull/10241\n* refactor(terminal): one commit module for terminal topology closes, with a boundary check by @Jinwoo-H in https://github.com/stablyai/orca/pull/25329\n* Group CSV editor code in its own folder by @nwparker in https://github.com/stablyai/orca/pull/25476\n* Remove completed SSH picker E2E plan by @kazooooo-ma in https://github.com/stablyai/orca/pull/24824\n* docs: align contributor guidance with the PR template by @pqminh27 in https://github.com/stablyai/orca/pull/25034\n## New Contributors\n* @chokolademilch7 made their first contribution in https://github.com/stablyai/orca/pull/22871\n* @setodeve made their first contribution in https://github.com/stablyai/orca/pull/24099\n* @kazuki-hanai made their first contribution in https://github.com/stablyai/orca/pull/24376\n* @kazooooo-ma made their first contribution in https://github.com/stablyai/orca/pull/24824\n* @pqminh27 made their first contribution in https://github.com/stablyai/orca/pull/25034\n\n---\n\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.221...v1.4.222\n\n\n","reactions":{"total_count":8,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":6,"eyes":0},"mentions_count":11}
