38cae946c5334d93d0d2","download_count":14,"created_at":"2026-09-20T22:11:01Z","updated_at":"2026-09-20T22:11:01Z"},{"id":577700049,"node_id":"RA_kwDORpCz1s4ibwDR","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":190055480,"digest":"sha256:49c1e91b65390e79ae3e519bba241dbc5277428b015fb98f61d434bf14d13faf","download_count":34549,"created_at":"2026-09-20T22:45:31Z","updated_at":"2026-09-20T22:45:37Z"},{"id":577700054,"node_id":"RA_kwDORpCz1s4ibwDW","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":194193,"digest":"sha256:03c604aea3bc01d12ef1447aa209c8f3829151edf499f944449743b960350583","download_count":10278,"created_at":"2026-09-20T22:45:31Z","updated_at":"2026-09-20T22:45:31Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\r\n\r\nPlease note: It usually takes 48\u201372 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!\r\n\r\n## The short version\r\n\r\n**Agents & chat:** Search your agent session history from the panel, across computers, and from `orca search`. **OpenCode 2** is also now supported. Native chat treats plans as plans, reconnects chats that were running when Orca restarted, and OMP can pick models on desktop and mobile. Source Control AI can generate with OMP.\r\n\r\n**Workspaces, editor & source control:** The compact branch picker is back in the composer, New Workspace can choose a base ref, and diffs can collapse unchanged regions. Review comments support multi-line ranges. Worktree create prefers Git first; WSL delete will not take the twin branch.\r\n\r\n**Terminal & remote:** Pick a default terminal shell, search with a match count and Cmd+F parity, and configure URL-click / middle-click. Windows terminals spawn as the shell you asked for. Usage scans for Claude, Codex and OpenCode now run on a worker thread.\r\n\r\n**Mobile:** Desktop can serve a mobile web bundle over the air. Tasks, files and agent history start moving onto that page shell, with clearer Back controls and a honest \u201chost unreachable\u201d state instead of an endless Connecting via Relay.\r\n\r\n---\r\n\r\n## Product experience\r\n\r\n### Workspaces, tabs & editor\r\n\r\n*The composer is compact again, diffs can hide the noise, and worktree create/delete is less likely to surprise you.*\r\n\r\n* feat(composer): restore compact branch picker UX by @nwparker in https://github.com/stablyai/orca/pull/21741\r\n* feat(composer): choose a base ref in the New Workspace composer by @Tkotm76 in https://github.com/stablyai/orca/pull/17250\r\n* feat(editor): add opt-in collapsed unchanged regions for file diffs by @dcieslak19973 in https://github.com/stablyai/orca/pull/11955\r\n* feat(diff-comments): add multi-line range selection with drag and keyboard by @AmethystLiang in https://github.com/stablyai/orca/pull/20959\r\n* fix(editor): keep long file paths distinguishable by @nwparker in https://github.com/stablyai/orca/pull/21631\r\n* fix(editor): preserve Markdown scroll after image layout by @nwparker in https://github.com/stablyai/orca/pull/20956\r\n* fix: highlight bash fences in Markdown source mode by @100space in https://github.com/stablyai/orca/pull/20592\r\n* fix(pdf): render CJK text with pdf.js resources by @OrcaWin in https://github.com/stablyai/orca/pull/21625\r\n* Close workspace board when selecting a sidebar worktree by @OrcaWin in https://github.com/stablyai/orca/pull/21737\r\n* fix(sidebar): keep the Projects filter when a project is added by @OrcaWin in https://github.com/stablyai/orca/pull/20987\r\n* fix(sidebar): distinguish sleeping workspaces in the new card style by @mmarabel in https://github.com/stablyai/orca/pull/21540\r\n* fix(sidebar): keep group headers visible when measured rows grow by @kiendle in https://github.com/stablyai/orca/pull/20883\r\n* Make selected dialog higher contrast by @AmethystLiang in https://github.com/stablyai/orca/pull/21718\r\n* feat(settings): confirm before stopping running terminals by @nwparker in https://github.com/stablyai/orca/pull/21569\r\n* fix(settings): keep integration connect dialog drafts on backdrop click by @AmethystLiang in https://github.com/stablyai/orca/pull/20932\r\n* fix(settings): preserve multiline proxy bypass rules by @AmethystLiang in https://github.com/stablyai/orca/pull/20957\r\n* fix(worktree-create): prioritize creation Git and defer background preparation by @Jinwoo-H in https://github.com/stablyai/orca/pull/20722\r\n* fix(worktree): keep a WSL checkout case so delete cannot take the twin branch by @nwparker in https://github.com/stablyai/orca/pull/20273\r\n* fix(worktree): ask the execution host whose home a remote delete would take by @nwparker in https://github.com/stablyai/orca/pull/19865\r\n* fix(worktrees): route unstamped local worktrees local in the two states #16841 still fails closed by @LesleyMurfin in https://github.com/stablyai/orca/pull/16829\r\n* fix(session): an emptied workspace still survives the reconnect merge by @nwparker in https://github.com/stablyai/orca/pull/19944\r\n\r\n### Source control & GitHub\r\n\r\n*OMP can generate review text, and GitHub Enterprise Managed User logins validate.*\r\n\r\n* feat(source-control-ai): support OMP generation by @nwparker in https://github.com/stablyai/orca/pull/20624\r\n* feat(github): bind projects to a specific gh account by @llevintza in https://github.com/stablyai/orca/pull/13664\r\n* fix(github): accept Enterprise Managed User logins in owner slug validation by @gon2gon2 in https://github.com/stablyai/orca/pull/20450\r\n* Show the Source Control AI CLI arguments box only where it actually works by @brennanb2025 in https://github.com/stablyai/orca/pull/21149\r\n\r\n### Browser\r\n\r\n*Viewport presets respect UI zoom, and screenshot markup works on client-hosted pages.*\r\n\r\n* Fix browser viewport presets incorrectly scaled by UI zoom by @AmethystLiang in https://github.com/stablyai/orca/pull/20962\r\n* fix(browser): enable screenshot markup on client-hosted pages by @yteruel31 in https://github.com/stablyai/orca/pull/19577\r\n* fix(browser): make the browser identity one process-wide choice by @brennanb2025 in https://github.com/stablyai/orca/pull/20767\r\n\r\n## Agents & workflow\r\n\r\n### Session search\r\n\r\n*Find past agent sessions in the history panel, on every computer, and from the CLI.*\r\n\r\n* feat(session-search): add panel search and opt-in consent by @Jinwoo-H in https://github.com/stablyai/orca/pull/20580\r\n* feat(session-history): add local search settings and index controls by @Jinwoo-H in https://github.com/stablyai/orca/pull/20582\r\n* feat(session-search): search every computer from the history panel by @Jinwoo-H in https://github.com/stablyai/orca/pull/20885\r\n* feat(session-search): merge all-computers search across hosts by @Jinwoo-H in https://github.com/stablyai/orca/pull/20670\r\n* feat(session-search): enable indexing on paired servers from a client by @Jinwoo-H in https://github.com/stablyai/orca/pull/20886\r\n* feat(settings): connected computers rows for session history indexing by @Jinwoo-H in https://github.com/stablyai/orca/pull/20887\r\n* feat(cli): orca search over the agent session index by @Jinwoo-H in https://github.com/stablyai/orca/pull/20514\r\n* feat(cli): show orca search now the settings toggle ships by @Jinwoo-H in https://github.com/stablyai/orca/pull/20677\r\n* fix(session-search): index OpenCode SQLite sessions by @Jinwoo-H in https://github.com/stablyai/orca/pull/20870\r\n* fix(ai-vault): index Codex agent replies whose content blocks are typed Text by @Jinwoo-H in https://github.com/stablyai/orca/pull/20763\r\n* fix(ai-vault): discover and parse Devin sessions on Windows by @lattenee in https://github.com/stablyai/orca/pull/21337\r\n* fix(ai-vault): say OpenCode-in-WSL is not searchable from Windows yet by @Jinwoo-H in https://github.com/stablyai/orca/pull/20971\r\n\r\n### Native chat, OMP & providers\r\n\r\n*OpenCode 2 beta, clearer plans and questions, and OMP that stays attached to the right pane and model.*\r\n\r\n* feat(agents): add OpenCode 2 beta support by @nwparker in https://github.com/stablyai/orca/pull/21418\r\n* feat(native-chat): render a proposed plan as a plan, not a generic approval by @brennanb2025 in https://github.com/stablyai/orca/pull/21090\r\n* fix(native-chat): replace the raw question tool row with an awaiting-input row by @brennanb2025 in https://github.com/stablyai/orca/pull/20724\r\n* Offer to reconnect native chats that were working when Orca restarted by @brennanb2025 in https://github.com/stablyai/orca/pull/21096\r\n* Native chat keeps scrolling to bottom by @AmethystLiang in https://github.com/stablyai/orca/pull/20898\r\n* fix(native-chat): deliver queued messages while the chat pane is hidden by @brennanb2025 in https://github.com/stablyai/orca/pull/20659\r\n* feat(omp): discover and switch native-chat models on desktop and mobile by @nwparker in https://github.com/stablyai/orca/pull/20612\r\n* fix(omp): start new tasks without auto-resuming old sessions by @nwparker in https://github.com/stablyai/orca/pull/20622\r\n* fix(omp): attach desktop and mobile images through file mentions by @nwparker in https://github.com/stablyai/orca/pull/21674\r\n* fix(omp): keep child sessions from reporting into the parent pane by @nwparker in https://github.com/stablyai/orca/pull/20611\r\n* fix(claude): single-own turn identity so Stop reaches a provider-opened turn by @brennanb2025 in https://github.com/stablyai/orca/pull/20794\r\n* fix(claude): judge Stop against the turn the journal published by @brennanb2025 in https://github.com/stablyai/orca/pull/20921\r\n* fix(pi): ignore idle utility dialogs in completion status by @nwparker in https://github.com/stablyai/orca/pull/21707\r\n* fix(pi): do not install extensions for disabled agents by @nwparker in https://github.com/stablyai/orca/pull/21711\r\n* feat(agent-launch): one executor for agent launches, exposed as agent.launch by @brennanb2025 in https://github.com/stablyai/orca/pull/19849\r\n\r\n### Terminal\r\n\r\n*Default shell, better find, images, and Windows terminals that actually are the shell you picked.*\r\n\r\n* feat(settings): choose the default terminal shell by @nwparker in https://github.com/stablyai/orca/pull/21085\r\n* feat(terminal): search match count + Cmd+F focus parity by @shaharmor in https://github.com/stablyai/orca/pull/9035\r\n* feat(terminal): configure URL click and middle-click behavior by @nwparker in https://github.com/stablyai/orca/pull/21438\r\n* feat(terminal): inline images via @xterm/addon-image by @OrcaWin in https://github.com/stablyai/orca/pull/19512\r\n* fix(terminal): let a runtime-created Windows terminal BE the requested shell by @nwparker in https://github.com/stablyai/orca/pull/20825\r\n* fix(terminal): align CJK IME preedit spacing by @nwparker in https://github.com/stablyai/orca/pull/19367\r\n* fix(terminal): clear stale agent identity after shell exit by @nwparker in https://github.com/stablyai/orca/pull/21714\r\n* fix(cli,relay): stop reading an unsignalable pid as a dead one by @nwparker in https://github.com/stablyai/orca/pull/20098\r\n\r\n### Mobile\r\n\r\n*Desktop can ship a mobile web bundle; tasks, files and history start rendering from that page.*\r\n\r\n* feat(mobile): native shell view serving a mobile web generation from a private origin by @Jinwoo-H in https://github.com/stablyai/orca/pull/21417\r\n* feat(mobile): serve the tasks screen from the page by @Jinwoo-H in https://github.com/stablyai/orca/pull/21694\r\n* feat(mobile): serve the files explorer and preview from the page by @Jinwoo-H in https://github.com/stablyai/orca/pull/21710\r\n* feat(mobile): render agent session history from the desktop's bundle by @Jinwoo-H in https://github.com/stablyai/orca/pull/21596\r\n* feat(mobile): clarify the notification opt-in screen by @Jinwoo-H in https://github.com/stablyai/orca/pull/20930\r\n* feat(mobile): say why a host is unreachable instead of \"Connecting via Relay\u2026\" by @Jinwoo-H in https://github.com/stablyai/orca/pull/21566\r\n* feat(mobile): answer native verbs on the shell, clipboard first by @Jinwoo-H in https://github.com/stablyai/orca/pull/21623\r\n\r\n## Quality & delivery\r\n\r\n*Nothing here changes what you see \u2014 it changes how smoothly Orca behaves under real workloads. Expanded below if you want the detail.*\r\n\r\n<details>\r\n<summary><b>Performance improvements</b></summary>\r\n\r\n*Usage scans for Claude, Codex and OpenCode now run on a worker thread (the move called out as upcoming in v1.4.205). Terminal output skips SGR and kitty scans on plain PTY text. Automations run history virtualizes large tables.*\r\n\r\n* perf(usage): run the Claude/Codex/OpenCode usage scans on a worker thread by @Jinwoo-H in https://github.com/stablyai/orca/pull/21114\r\n* perf(usage): resolve each cwd's worktree once per scan by @Jinwoo-H in https://github.com/stablyai/orca/pull/21130\r\n* perf(codex-usage): resume rollout scans at the last parsed byte by @Jinwoo-H in https://github.com/stablyai/orca/pull/21102\r\n* perf(terminal): skip background SGR scans without ESC by @nwparker in https://github.com/stablyai/orca/pull/21646\r\n* perf(terminal): skip kitty scans for plain PTY output by @nwparker in https://github.com/stablyai/orca/pull/21643\r\n* Virtualize automations run history table for large histories by @AmethystLiang in https://github.com/stablyai/orca/pull/20916\r\n* perf: always show project names and remove notification scans by @Jinwoo-H in https://github.com/stablyai/orca/pull/20931\r\n* Bound AI Vault transcript record assembly before allocation by @OrcaWin in https://github.com/stablyai/orca/pull/20963\r\n* fix(browser): bound CDP output for stalled clients by @OrcaWin in https://github.com/stablyai/orca/pull/20949\r\n* perf(renderer): stop one pane title update from scanning the global sleeping-record inventory by @Jinwoo-H in https://github.com/stablyai/orca/pull/21292\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Reliability, tests & delivery</b></summary>\r\n\r\n* fix(runtime): persist acknowledged terminal tab retirement by @OrcaWin in https://github.com/stablyai/orca/pull/21020\r\n* fix(runtime): reject stale inventory after PTY lifecycle changes by @OrcaWin in https://github.com/stablyai/orca/pull/21014\r\n* fix(daemon): pause producers when stream backlogs grow by @OrcaWin in https://github.com/stablyai/orca/pull/20947\r\n* fix(crash-reporting): stop periodic emitters from evicting the crash trail by @OrcaWin in https://github.com/stablyai/orca/pull/20639\r\n* fix(deps): update vulnerable transitive packages by @nwparker in https://github.com/stablyai/orca/pull/21652\r\n* Sort dev builds by timestamp instead of semver by @AmethystLiang in https://github.com/stablyai/orca/pull/21720\r\n\r\n</details>\r\n\r\n## New Contributors\r\n\r\n* @100space made their first contribution in https://github.com/stablyai/orca/pull/20592\r\n* @gon2gon2 made their first contribution in https://github.com/stablyai/orca/pull/20450\r\n* @Lucasfarg made their first contribution in https://github.com/stablyai/orca/pull/21194\r\n* @Tkotm76 made their first contribution in https://github.com/stablyai/orca/pull/17250\r\n* @KAPUIST made their first contribution in https://github.com/stablyai/orca/pull/21361\r\n* @llevintza made their first contribution in https://github.com/stablyai/orca/pull/13664\r\n* @yteruel31 made their first contribution in https://github.com/stablyai/orca/pull/19577\r\n* @fbartho made their first contribution in https://github.com/stablyai/orca/pull/20415\r\n* @lattenee made their first contribution in https://github.com/stablyai/orca/pull/21337\r\n\r\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.205...v1.4.206\r\n","reactions":{"total_count":18,"+1":0,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":1,"rocket":12,"eyes":0},"mentions_count":19}
