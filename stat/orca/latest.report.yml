da0afe8dafb665a817c0934884f2099826d2da878c2c0631bc496","download_count":10,"created_at":"2026-09-23T04:47:33Z","updated_at":"2026-09-23T04:47:34Z"},{"id":583047060,"node_id":"RA_kwDORpCz1s4iwJeU","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":190099376,"digest":"sha256:e3b44c471a7701c46f88ba0db02962cffd0ce0593d0f354b15a7f5567c6d4811","download_count":29101,"created_at":"2026-09-23T05:24:54Z","updated_at":"2026-09-23T05:25:00Z"},{"id":583047058,"node_id":"RA_kwDORpCz1s4iwJeS","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":194199,"digest":"sha256:a6ac2b88cc3739602fa07d6dc5a2b549145051a5c6e2869ddc3af399729d6ca6","download_count":8803,"created_at":"2026-09-23T05:24:54Z","updated_at":"2026-09-23T05:24:54Z"}],"body":"Thank you so much for using Orca and for your continued support! \u2764\ufe0f\r\n\r\n## The short version\r\n\r\n**Agents & chat:** Session search now shows the newest activity first, and launch prompts go straight to terminal agents. OpenCode, Claude, Pi, Antigravity and Devin launches are more reliable. Usage totals now price GPT-6, Opus 5.5 and Fable 5.1, and Codex usage no longer goes stale after a reset.\r\n\r\n**Terminal, editor & workspaces:** Drag selection holds steady during redraws, middle-click paste works in mouse-tracking TUIs, and remote panes keep their scrollback across restarts. PDF zoom sticks across tabs and restarts, the new-worktree dialog keeps its buttons in view while you scroll, and large artifact and conflict lists stay fast.\r\n\r\n**Remote & reliability:** WSL, SSH and Windows setups recover more cleanly, and relay rehomes and cell rollouts handle failures without taking a cell down.\r\n\r\n---\r\n\r\n## Product experience\r\n\r\n### Agents, chat & search\r\n\r\n*Search is easier to trust, agent launches are more direct, and large workspace lists stay responsive.*\r\n\r\n* feat(agent-launch): deliver a launch prompt to a terminal agent by @brennanb2025 in https://github.com/stablyai/orca/pull/21891\r\n* feat(session-search): sort search results by newest, and break relevance ties by recency by @Jinwoo-H in https://github.com/stablyai/orca/pull/21863\r\n* Virtualize artifacts list with reusable component by @AmethystLiang in https://github.com/stablyai/orca/pull/22061\r\n* Virtualize large conflict file trees by @AmethystLiang in https://github.com/stablyai/orca/pull/21920\r\n* refactor: use generic VirtualizedList in conflict review by @AmethystLiang in https://github.com/stablyai/orca/pull/22092\r\n* Fix stale listings when search query changes by @AmethystLiang in https://github.com/stablyai/orca/pull/22173\r\n* refactor(agent-status): drop two superseded Codex attention workarounds by @brennanb2025 in https://github.com/stablyai/orca/pull/21844\r\n* fix(native-chat): scope a tool row's hover reveal to that row by @brennanb2025 in https://github.com/stablyai/orca/pull/21918\r\n* Clear website annotations after successful delivery by @AmethystLiang in https://github.com/stablyai/orca/pull/22060\r\n\r\n### Usage reporting\r\n\r\n*Codex, OpenCode, and Claude cost totals are more complete and stay fresh.*\r\n\r\n* Fix stale Codex usage after reset by @OrcaWin in https://github.com/stablyai/orca/pull/21748\r\n* fix: read OpenCode Go usage from the console API by @innocarpe in https://github.com/stablyai/orca/pull/21462\r\n* fix(opencode): include cache read and write usage totals by @nwparker in https://github.com/stablyai/orca/pull/21886\r\n* fix(usage): price GPT-6 Astra, and declare when the Codex cost total omits a model by @Jinwoo-H in https://github.com/stablyai/orca/pull/22073\r\n* fix(usage): price GPT-6 Sol/Luna, Opus 5.5 and Fable 5.1, and correct GPT-5.6 rates by @Jinwoo-H in https://github.com/stablyai/orca/pull/22350\r\n\r\n### Terminal\r\n\r\n*Input, selection, paste, composed text, and remote scrollback are more consistent.*\r\n\r\n* fix(terminal): keep Pi input visible in open synchronized frames by @nwparker in https://github.com/stablyai/orca/pull/21708\r\n* fix(terminal): preserve Polish and Option-composed text in kitty panes by @nwparker in https://github.com/stablyai/orca/pull/21082\r\n* fix(terminal): keep drag selection stable during redraws by @nwparker (release-branch fix, see https://github.com/stablyai/orca/compare/v1.4.207...v1.4.209)\r\n* fix(terminal): arm native-paste suppression on middle-click in mouse-tracking TUIs by @buf0-bot in https://github.com/stablyai/orca/pull/21834\r\n* fix(terminal): let Shift+middle-click paste in mouse-tracking panes by @buf0-bot in https://github.com/stablyai/orca/pull/21858\r\n* feat(terminal): configure interactive Unix shell arguments by @nwparker in https://github.com/stablyai/orca/pull/21904\r\n* fix(terminal): persist a parked remote pane's scrollback across a hard restart (#21295) by @nwparker in https://github.com/stablyai/orca/pull/21367\r\n* fix(mobile): make OMP terminal momentum refresh-rate independent by @nwparker in https://github.com/stablyai/orca/pull/21687\r\n\r\n### Editor, workspaces & source control\r\n\r\n*PDF work, Markdown navigation, worktree dialogs, and source-control hover states are more consistent.*\r\n\r\n* fix(editor): persist PDF zoom across tabs and restarts by @Jinwoo-H in https://github.com/stablyai/orca/pull/21879\r\n* fix(editor): open plain details blocks in rich markdown mode by @SahilZ0810 in https://github.com/stablyai/orca/pull/19784\r\n* fix(editor): preserve Markdown preview when following wiki links by @SahilZ0810 in https://github.com/stablyai/orca/pull/19790\r\n* Keep new worktree dialog actions visible while scrolling by @nwparker in https://github.com/stablyai/orca/pull/21915\r\n* Consolidate source control tooltips to eliminate redundant hover text by @AmethystLiang in https://github.com/stablyai/orca/pull/21733\r\n* Fix Antigravity source-control model discovery and retired defaults by @nwparker in https://github.com/stablyai/orca/pull/21606\r\n\r\n### Providers & assistants\r\n\r\n*OpenCode, Claude, Pi, Antigravity, and Devin launches behave better.*\r\n\r\n* fix(opencode): preserve global config discovery by @nwparker in https://github.com/stablyai/orca/pull/21854\r\n* fix(opencode): attribute shared-server sessions to their panes by @werlang in https://github.com/stablyai/orca/pull/21577\r\n* fix(opencode): isolate v1/v2 plugins and preserve WSL config by @nwparker in https://github.com/stablyai/orca/pull/21900\r\n* fix(opencode): support v2 plugins under plain executable name by @nwparker (release-branch fix, see https://github.com/stablyai/orca/compare/v1.4.207...v1.4.209)\r\n* fix(opencode2): auto-submit quick command prompts by @nwparker (release-branch fix, see https://github.com/stablyai/orca/compare/v1.4.207...v1.4.209)\r\n* fix(claude): stream the provider history window by @nwparker in https://github.com/stablyai/orca/pull/21742\r\n* fix(claude): prefill continuation context for manual submission by @nwparker in https://github.com/stablyai/orca/pull/21912\r\n* fix(pi): keep panes working while async subagents run by @nwparker in https://github.com/stablyai/orca/pull/21882\r\n* fix(orchestration): line-settle delay for antigravity multiline paste by @seonghobae in https://github.com/stablyai/orca/pull/21665\r\n* fix(antigravity): recognize non-Gemini tui-idle prompts by @innocarpe in https://github.com/stablyai/orca/pull/21231\r\n* fix(devin): skip workspace trust for Orca launches by @nwparker in https://github.com/stablyai/orca/pull/21925\r\n\r\n### Remote, SSH, WSL & Windows\r\n\r\n*Guest materialization, profiles, rebuilds, and connection floors are more resilient.*\r\n\r\n* fix(wsl): await Pi and OMP guest relay materialization by @nwparker in https://github.com/stablyai/orca/pull/21721\r\n* fix(wsl): preserve OpenCode agent variant in guest by @nwparker (release-branch fix, see https://github.com/stablyai/orca/compare/v1.4.207...v1.4.209)\r\n* fix(worktree): recognise the Windows profile through WSL's drvfs view by @nwparker in https://github.com/stablyai/orca/pull/20051\r\n* fix(windows): prune the unpatched conpty prebuild by header, not host arch by @nwparker in https://github.com/stablyai/orca/pull/20048\r\n* fix(ssh): keep the generation floor when a target is removed and recreated by @nwparker in https://github.com/stablyai/orca/pull/22146\r\n* fix(remote-runtime): stop an unhydrated host graph from reading as a closed terminal by @nwparker in https://github.com/stablyai/orca/pull/21967\r\n* fix(rebuild): refuse to compile node-pty source that lacks the MSYS breakaway denial by @nwparker in https://github.com/stablyai/orca/pull/21968\r\n\r\n### Relay & reliability\r\n\r\n*Rehomes, cells, and same-cap rollouts recover more cleanly.*\r\n\r\n* fix(relay): abort rehomes whose host never arrived, without disabling the switch by @Jinwoo-H in https://github.com/stablyai/orca/pull/21813\r\n* fix(relay): let the rehome evidence parser read a line the director grew by @Jinwoo-H in https://github.com/stablyai/orca/pull/21823\r\n* fix(relay): stop a terminated checked-out PostgreSQL client from killing the cell by @Jinwoo-H in https://github.com/stablyai/orca/pull/21840\r\n* fix(relay): re-place hosts off a cell isolated for a roll by @Jinwoo-H in https://github.com/stablyai/orca/pull/21911\r\n* perf(relay): cut the cell LB drain to 60s and widen the same-cap batch to ten cells by @Jinwoo-H in https://github.com/stablyai/orca/pull/21848\r\n* fix(relay): land the cell backend drain and request logging inside the same-cap wave by @Jinwoo-H in https://github.com/stablyai/orca/pull/21860\r\n* fix(relay): bound the same-cap shadow gate in time and apply a resumed backend update by @Jinwoo-H in https://github.com/stablyai/orca/pull/21865\r\n* fix(memory): release stale session registries by @OrcaWin in https://github.com/stablyai/orca/pull/21734\r\n* fix(runtime): an outage is not a handle-gap verdict by @nwparker in https://github.com/stablyai/orca/pull/20059\r\n\r\n### Mobile (OTA page)\r\n\r\n*The over-the-air page gains screencasting, terminal, media, preview, diagram, dictation, and route support. Listed here for visibility only; the mobile app ships on its own release schedule.*\r\n\r\n* fix(mobile): measure the keyboard from visualViewport inside the page (OTA phase C, C4.2) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21735\r\n* feat(mobile): carry browser screencast frames over the bridge as base64 (OTA phase C, C6.1) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21758\r\n* feat(mobile): paint browser screencast frames through web siblings (OTA phase C, C6.2) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21754\r\n* feat(mobile): budget the browser pane's frames and put its inputs on the web seam (OTA phase C, C6.3+C6.4) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21760\r\n* feat(mobile): add the media verbs the page's pickers and paste will use (OTA phase C, C7.4) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21779\r\n* feat(mobile): take the session screen's inputs, links, clipboard and routers through the platform seams (OTA phase C, C7.2) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21790\r\n* feat(mobile): budget the terminal snapshot on serialized bytes and hold live output instead of ending the stream (OTA phase C, C7.3) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21785\r\n* feat(mobile): put the page's pickers, paste and editor fallbacks on the media verbs (OTA phase C, C7.6) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21795\r\n* fix(mobile): settle browser dialogs on the stream that reports them, map taps through the page scale, and sweep the frame budget on the real encoder (OTA phase C, C6.7) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21799\r\n* feat(mobile): mount the terminal document in the page over its own modules (OTA phase C, C7.5) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21809\r\n* feat(mobile): fire the page's haptics over the bridge notify (OTA phase C, C7.10 E) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21864\r\n* feat(mobile): render Mermaid diagrams on the page from one deferred engine artifact (OTA phase C, C7.10 B) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21871\r\n* feat(mobile): render the HTML preview on the page in a sealed srcdoc frame (OTA phase C, C7.10 A) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21862\r\n* feat(mobile): dictation on the OTA page over native audio verbs (Phase C, C7.10 PR D) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21905\r\n* feat(mobile): register the source-control and review page routes (OTA phase C, C4.4) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21957\r\n* feat(mobile): serve any manifest route through a [...page] catch-all (OTA phase C, C8) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21950\r\n* fix(mobile): keep an in-page hop local only when the session's grants cover it (OTA phase C, C2.9) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21723\r\n* fix(mobile): admit https: images on the web shell's CSP (OTA phase C, ruling 27) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21964\r\n* fix(mobile): four pre-existing rich Markdown editor defects (OTA phase C, C1 follow-up) by @Jinwoo-H in https://github.com/stablyai/orca/pull/22054\r\n* fix(mobile): restore query-string's named exports under the 9.5.1 override by @Jinwoo-H in https://github.com/stablyai/orca/pull/21727\r\n\r\n### Internationalization\r\n\r\n*Translated strings stay in sync with code changes.*\r\n\r\n* fix(i18n): regenerate the runtime catalog and localize the cookie example from #21462 by @Jinwoo-H in https://github.com/stablyai/orca/pull/21889\r\n* fix(i18n): regenerate the runtime-required catalog for the source-control tooltip key by @Jinwoo-H in https://github.com/stablyai/orca/pull/21942\r\n\r\n**Full Changelog**: https://github.com/stablyai/orca/compare/v1.4.207...v1.4.209\r\n\n","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":5,"eyes":0},"mentions_count":9}
