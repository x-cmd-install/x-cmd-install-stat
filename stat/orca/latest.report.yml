0fd015ae7e5dc","download_count":7,"created_at":"2026-10-23T21:21:16Z","updated_at":"2026-10-23T21:21:17Z"},{"id":670499016,"node_id":"RA_kwDORpCz1s4n9wDI","name":"orca-windows-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":201790688,"digest":"sha256:b70765a986c44de3fe7ff5a446903c36b4bd35fc4682b5bd553b414507332eeb","download_count":10351,"created_at":"2026-10-23T21:45:12Z","updated_at":"2026-10-23T21:45:19Z"},{"id":670499014,"node_id":"RA_kwDORpCz1s4n9wDG","name":"orca-windows-setup.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":201800,"digest":"sha256:8c39adfa3bb004a70beb0261bfd593eb81a82f600efbbf972ea9a443557a07a1","download_count":2301,"created_at":"2026-10-23T21:45:12Z","updated_at":"2026-10-23T21:45:13Z"}],"body":"## More connected work, safer edits \ud83d\udc33\n\nThis release makes it easier to move between agents, files, browsers and remote machines. Tabs of the same file now share unsaved edits, native chats pick up turns made elsewhere, and the phone gets more dependable terminal gestures and richer tab controls.\n\n## The short version\n\n- **Your edits stay together:** Tabs of the same file share unsaved text across workspaces. Conflict review sees that live text, workspace deletion lists unsaved files, and stale Markdown or notebook edits no longer overwrite newer work.\n- **Chats that keep up:** Codex and Pi show turns made outside the chat. Long pastes can become text attachments, Codex questions get answer cards, and OMP gains image sending and actionable plan-review cards.\n- **More control over agents:** Pick chat or terminal when creating a workspace, set that choice for your default agent, add Claude and Codex accounts on supported remote servers, and install shared skills for 11 more agents.\n- **A more capable browser:** A workspace-aware new tab, address-bar suggestions, remembered site permissions, per-site appearance and zoom, and page-loading progress on desktop and phone.\n- **A smoother phone experience:** See agent activity in tabs, rename with a double-tap, scroll back through earlier chat messages, select terminal text more naturally, and return to your terminal reading position after resuming.\n- **Better visibility and recovery:** Inspect local terminals in Resource Manager, use plain SSH when a host\u2019s move to an Orca server is blocked, and keep pairings through managed-server updates and recovery.\n- **Everyday polish:** Brazilian Portuguese, language selection during onboarding, searchable release builds, clearer history-scan progress, and **Resolve with AI** for paused merges, rebases and cherry-picks\u2014even after file conflicts are fixed.\n\n**Phone updates:** Updating Orca on the computer serving your phone updates the served interface. The new **Home \u2192 New Workspace** entry and native iOS dictation fixes require an updated native phone app; the home-screen entry ships with the next app build.\n\n## Compatibility & upgrade notes\n\n- **Remote accounts:** Update the paired server for the new Claude and Codex Add Account flow. Windows servers and older hosts retain the `orca account add` guidance. Credentials stay on the server; remote re-authentication of an existing account is outside this change.\n- **Native chat (experimental):** Update paired and SSH hosts alongside Orca for the latest chat fixes. Agent version checks now accept newer releases and prereleases that meet the required minimum; a known older version shows update guidance.\n- **Resource Manager:** The new PTYs view covers local terminals. Ending a terminal requires host support for verifying the selected session; older hosts refuse unchecked termination.\n- **HTML files:** Opening HTML in preview by default was reverted for this release.\n- **Experimental groundwork:** Layout-owner and sidebar changes listed below remain disabled. Connector configuration is off by default, and the new optional agent-write controls have no existing callers enabled.\n\n---\n\n## Product experience\n\n### Native chat (experimental)\n\n*Continue conversations across chat and terminal, answer agent questions, and share images and long prompts more easily.*\n\n* Show turns made outside Orca in an existing Codex chat by @brennanb2025 in https://github.com/stablyai/orca/pull/30883\n* Show turns made outside Orca in an existing Pi chat by @brennanb2025 in https://github.com/stablyai/orca/pull/31618\n* Attach long pastes as text files and flag oversized messages before sending by @brennanb2025 in https://github.com/stablyai/orca/pull/30398\n* Codex async questions show an answer card on desktop and phone by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31652\n* OMP's plan review shows as a plan card you can answer from desktop and mobile chat by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31635\n* Questions over 16 KB show their card with every option by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31632\n* OMP chats send images; an ACP agent's own startup answer decides by @brennanb2025 in https://github.com/stablyai/orca/pull/30910\n* Keep newer agent versions and eligible prereleases available for chat, with clear guidance when an installed version is too old by @brennanb2025 in https://github.com/stablyai/orca/pull/30393\n* Keep model choices coherent across Claude updates by @brennanb2025 in https://github.com/stablyai/orca/pull/30107\n* Typing fast after focus moves keeps keys in order by @brennanb2025 in https://github.com/stablyai/orca/pull/31203\n* Retire ghost queued continuation bubbles by @nwparker in https://github.com/stablyai/orca/pull/31479\n* Show a prompt hook's block as its own row for every agent by @brennanb2025 in https://github.com/stablyai/orca/pull/30898\n* A cancelled approval card closes even when the journal was briefly full by @brennanb2025 in https://github.com/stablyai/orca/pull/31735\n* Open inline images directly in preview dialog by @AmethystLiang in https://github.com/stablyai/orca/pull/31620\n* Handle inline image preview edge cases by @AmethystLiang in https://github.com/stablyai/orca/pull/31742\n* Set minimum width for native chat table cells by @AmethystLiang in https://github.com/stablyai/orca/pull/31848\n* Gate draft image ownership checks by local attachments by @AmethystLiang in https://github.com/stablyai/orca/pull/32098\n* Avoid repeated skill catalog scans while building the picker by @OrcaWin in https://github.com/stablyai/orca/pull/31936\n\n### Agents, accounts & skills\n\n*Choose chat or terminal when starting work, add accounts on a remote server, and install shared skills for more agents.*\n\n* Choose chat or terminal CLI in Create worktree, Create folder and continuation pickers by @brennanb2025 in https://github.com/stablyai/orca/pull/31189\n* Set the default agent to open as a chat or a terminal CLI by @brennanb2025 in https://github.com/stablyai/orca/pull/31590\n* Add Claude and Codex accounts on supported remote servers from a paired desktop by @nwparker in https://github.com/stablyai/orca/pull/31461\n* Restart WSL Claude panes after an account switch by @nwparker in https://github.com/stablyai/orca/pull/31945\n* Install shared skills for 11 more agents and stop Qoder listing skills twice by @Jinwoo-H in https://github.com/stablyai/orca/pull/31657\n* Preserve Cursor identity across imported Claude hooks by @nwparker in https://github.com/stablyai/orca/pull/31469\n* Renaming a terminal no longer hides its running agent by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31428\n* Route OMP question cards to terminal by @nwparker in https://github.com/stablyai/orca/pull/31440\n\n### Phone: tabs, chat & workspaces\n\n*Read earlier messages without losing your place, see agent activity in the tab strip, and keep workspace actions on the right computer.*\n\n* Tab strip shows terminal and chat agent state, reveals the next tab, renames on double-tap by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31372\n* Load earlier chat messages on scroll-up, keeping the reader's place by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31339\n* Phone terminal and chat tab names match the desktop by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31384\n* Closing the tab a phone shows returns it to the tab it viewed before by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31365\n* Keep closed terminal tabs from reappearing after quick closes by @nwparker in https://github.com/stablyai/orca/pull/31711\n* New Tab drawer reopens with its agents and refreshes them when desktop does by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31367\n* Keep a Codex chat on screen when Codex shows its idle title on a headless host by @nwparker in https://github.com/stablyai/orca/pull/31460\n* Floating-panel chats started from a phone show on the desktop by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31364\n* Mobile chat composer uses desktop's placeholder by @brennanb2025 in https://github.com/stablyai/orca/pull/31425\n* Attach Codex images when agent identity is missing by @nwparker in https://github.com/stablyai/orca/pull/31370\n* Refresh chat file suggestions when the desktop connection changes by @nwparker in https://github.com/stablyai/orca/pull/31702\n* Load the right agent history when you switch computers by @nwparker in https://github.com/stablyai/orca/pull/31695\n* Prepare Home\u2019s New Workspace drawer; the home-screen entry requires the next native phone app build by @Jinwoo-H in https://github.com/stablyai/orca/pull/31305\n* Open Create Workspace after source drawer closes by @nwparker in https://github.com/stablyai/orca/pull/31488\n* Detect New Workspace agents in the selected repo runtime by @nwparker in https://github.com/stablyai/orca/pull/31351\n* Load folder workspace agent presets on the correct host by @nwparker in https://github.com/stablyai/orca/pull/31442\n* Keep your setup-script choice when the repository list refreshes by @nwparker in https://github.com/stablyai/orca/pull/31694\n* Warn about agents that cannot wake on a windowless server only when the workspace has sleeping agents by @Jinwoo-H in https://github.com/stablyai/orca/pull/31607\n* Recover workspace features after temporary connection checks fail by @nwparker in https://github.com/stablyai/orca/pull/31480\n* Keep selected mobile options visible while locked by @AmethystLiang in https://github.com/stablyai/orca/pull/31628\n* Announce locked picker notice on iOS by @AmethystLiang in https://github.com/stablyai/orca/pull/31674\n\n### Phone: terminals, voice & touch\n\n*Select text more naturally, return to the same reading position, and keep scrolling, dictation and keyboard input dependable.*\n\n* Drag terminal selection with the long-press finger by @nwparker in https://github.com/stablyai/orca/pull/31433\n* Select Unicode words at rendered cell boundaries by @nwparker in https://github.com/stablyai/orca/pull/31434\n* Keep terminal scroll gestures from becoming taps by @nwparker in https://github.com/stablyai/orca/pull/31445\n* Preserve prompt taps after terminal scrolling by @nwparker in https://github.com/stablyai/orca/pull/31471\n* Start phone terminal scrolling without a timer delay by @nwparker in https://github.com/stablyai/orca/pull/31472\n* Retain terminal reading position after resume by @nwparker in https://github.com/stablyai/orca/pull/31661\n* Prevent stale terminal sizing and stream callbacks from affecting a newer phone session by @nwparker in https://github.com/stablyai/orca/pull/31432\n* Clear old touch gestures before replaying a terminal snapshot by @nwparker in https://github.com/stablyai/orca/pull/31437\n* Cancel stale shortcut list drags by @nwparker in https://github.com/stablyai/orca/pull/31436\n* Preserve native iOS dictation placeholders by @nwparker in https://github.com/stablyai/orca/pull/31356\n* Restore dictation after iOS audio interruptions by @nwparker in https://github.com/stablyai/orca/pull/31435\n* Mount sessions with saved preferences by @nwparker in https://github.com/stablyai/orca/pull/31443\n* Terminal settings show the saved \"When you leave the mobile app\" choice by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31361\n* Render offline Nerd Font symbols on first terminal display by @nwparker in https://github.com/stablyai/orca/pull/31446\n* Apply desktop terminal WebGL rendering fixes on phone by @nwparker in https://github.com/stablyai/orca/pull/31441\n* Fill the background below the final terminal row by @nwparker in https://github.com/stablyai/orca/pull/31474\n* Keep terminal wait feedback visible with a draft by @nwparker in https://github.com/stablyai/orca/pull/31658\n* Terminal Paste says why when nothing is pasted by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31640\n* Handle Android terminal keyboard chords in OTA sessions by @nwparker in https://github.com/stablyai/orca/pull/31666\n* Remember your latest choice for opening terminal links by @nwparker in https://github.com/stablyai/orca/pull/31689\n* Keep newer quick-command edits when an earlier save finishes by @nwparker in https://github.com/stablyai/orca/pull/31704\n\n### Phone: files, reviews & connections\n\n*Keep drafts with their files, preserve recent edits, and recover more clearly from connection and loading failures.*\n\n* Keep review-note drafts with the file they belong to by @nwparker in https://github.com/stablyai/orca/pull/31698\n* Keep generated commit messages in the workspace that requested them by @nwparker in https://github.com/stablyai/orca/pull/31709\n* Show Retry when a commit's changed files fail to load by @nwparker in https://github.com/stablyai/orca/pull/31706\n* Refresh open subfolders and keep deeply nested filenames visible by @nwparker in https://github.com/stablyai/orca/pull/31697\n* Keep a closed branch preview from reopening when loading finishes by @nwparker in https://github.com/stablyai/orca/pull/31707\n* Keep the notification switch from flipping back after you enable it by @nwparker in https://github.com/stablyai/orca/pull/31690\n* Stop a slow connection save from sending you back twice by @nwparker in https://github.com/stablyai/orca/pull/31692\n* Use port 443 for explicit WSS host edits by @nwparker in https://github.com/stablyai/orca/pull/31659\n* Distinguish delayed connection deadlines from unreachable hosts by @nwparker in https://github.com/stablyai/orca/pull/31478\n* Speed up phone diff-review note lookup by file path by @OrcaWin in https://github.com/stablyai/orca/pull/31943\n\n### Browser\n\n*Open a workspace-aware new tab, find sites from the address bar, and control permissions, appearance and zoom per site.*\n\n* New tab page with a workspace card and suggested sites by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31656\n* Chrome-style new tab and address bar suggestions by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31604\n* Allow/Block prompts for site permissions, remembered per site by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31158\n* Per-site appearance and zoom, from the page menu and Cmd/Ctrl +/-/0 by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31621\n* Show every page load, link clicks included, as a line along the address bar on desktop and mobile by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31597\n\n### Editor, files & source control\n\n*Share unsaved text across tabs of the same file, protect edits during saves and workspace removal, and get help with paused Git operations.*\n\n* Keep tabs of the same file in sync with one shared record of unsaved edits by @nwparker in https://github.com/stablyai/orca/pull/31974\n* Show a file\u2019s live unsaved text from any workspace in read-only conflict review by @nwparker in https://github.com/stablyai/orca/pull/31990\n* List unsaved files before deleting a workspace, and refuse removals that would lose them silently by @nwparker in https://github.com/stablyai/orca/pull/31641\n* Offer back unsaved edits when a workspace is removed without a prompt by @nwparker in https://github.com/stablyai/orca/pull/31738\n* Let saves finish safely and keep discarded text off disk after Don\u2019t Save by @nwparker in https://github.com/stablyai/orca/pull/31655\n* Stale delayed edits in notebook and rich Markdown views no longer overwrite newer text by @nwparker in https://github.com/stablyai/orca/pull/31760\n* Guard autosave, skip identical writes, and avoid autosaving non-UTF-8 files by @nwparker in https://github.com/stablyai/orca/pull/31768\n* Parse remote `.tsx` files correctly and keep their imports on the remote host by @nwparker in https://github.com/stablyai/orca/pull/31624\n* Combine untracked files into Changes by @AmethystLiang in https://github.com/stablyai/orca/pull/31831\n* Offer Resolve with AI for paused merge, rebase, and cherry-pick by @AmethystLiang in https://github.com/stablyai/orca/pull/28569\n* Polish explorer search layout and collapsible filters by @nwparker in https://github.com/stablyai/orca/pull/31825\n* Avoid repeated suffix scans for unfinished wiki links by @OrcaWin in https://github.com/stablyai/orca/pull/31934\n\n### Terminals, SSH & remote servers\n\n*Inspect local terminals in Resource Manager, reconnect more reliably, and keep remote pairing and account changes intact.*\n\n* Inspect local terminals in Resource Manager\u2019s PTYs view and end a selected terminal after host verification by @AmethystLiang in https://github.com/stablyai/orca/pull/31593\n* Every start in a deleted folder opens at the workspace root and says so by @brennanb2025 in https://github.com/stablyai/orca/pull/30747\n* Repaint desktop after phone fit ends by @nwparker in https://github.com/stablyai/orca/pull/31451\n* Repaint an idle full-screen program when a reconnect can't image its pane by @nwparker in https://github.com/stablyai/orca/pull/31482\n* Copy from remote Codex panes to the viewing device\u2019s clipboard by @nwparker in https://github.com/stablyai/orca/pull/31453\n* Fix terminal URLs split across padded output rows by @nwparker in https://github.com/stablyai/orca/pull/31713\n* Link a framed multi-row URL when an overlay shows through by @mmarabel in https://github.com/stablyai/orca/pull/21816\n* Settle a restored remote pane whose host session already exited by @nwparker in https://github.com/stablyai/orca/pull/31968\n* Set `ORCA_WORKSPACE_ID` in every terminal Orca starts by @Jinwoo-H in https://github.com/stablyai/orca/pull/31608\n* Set `ORCA_WORKSPACE_ID` in WSL terminals too by @Jinwoo-H in https://github.com/stablyai/orca/pull/31668\n* Keep desktop take-back from stale phone input by @nwparker in https://github.com/stablyai/orca/pull/31481\n* Release remote streams when the renderer reloads by @brennanb2025 in https://github.com/stablyai/orca/pull/29104\n* Share this host: only offer addresses the server actually answers (no dead IPv6 links) by @nwparker in https://github.com/stablyai/orca/pull/31447\n* A managed host's 'no desktop is sharing its browser' error names the browser routing setting too by @nwparker in https://github.com/stablyai/orca/pull/31444\n* Name what blocks an SSH host's move, and offer Move anyway in the terminal pane by @nwparker in https://github.com/stablyai/orca/pull/31638\n* Open a plain SSH terminal to a host whose move to its Orca server is blocked by @nwparker in https://github.com/stablyai/orca/pull/31716\n* Say what plain SSH is for beside its button, and polish the plain SSH window by @nwparker in https://github.com/stablyai/orca/pull/31732\n* Resolve repository SSH hosts consistently when routing runtime actions by @nwparker in https://github.com/stablyai/orca/pull/31630\n* Use consistent connect, Update and Force decisions for SSH and WSL servers by @nwparker in https://github.com/stablyai/orca/pull/31682\n* Keep the enrolled pairing across a managed server's update, rollback and recovery by @nwparker in https://github.com/stablyai/orca/pull/31684\n* Prove an unrecorded orcad by kernel identity before adopting it by @nwparker in https://github.com/stablyai/orca/pull/31685\n* Pair again from the distro when a WSL host refuses the enrolled token by @nwparker in https://github.com/stablyai/orca/pull/31745\n* Editing project groups no longer marks a moved host as changed by @nwparker in https://github.com/stablyai/orca/pull/31954\n* Stop floating terminal metadata from blocking SSH access links by @nwparker in https://github.com/stablyai/orca/pull/31963\n* Prevent new terminals during a server stop and protect rollback and restart transitions by @nwparker in https://github.com/stablyai/orca/pull/31418\n* Name a missing shared library when the pinned Node runtime can't start by @nwparker in https://github.com/stablyai/orca/pull/29829\n* Ship computer use with the server and say when it is unavailable by @nwparker in https://github.com/stablyai/orca/pull/31958\n* Stabilize remote host status bar during retries by @AmethystLiang in https://github.com/stablyai/orca/pull/32083\n* A workspace created on a paired server shows one set of default tabs when the same path exists on another host by @Jinwoo-H in https://github.com/stablyai/orca/pull/32080\n* Open the stdio bridge without re-probing the distro's platform by @nwparker in https://github.com/stablyai/orca/pull/31508\n* Keep the server bundle ASCII so V8 stores it at half the size by @nwparker in https://github.com/stablyai/orca/pull/31495\n* Avoid repeated scans while finding PR URL schemes in terminals by @OrcaWin in https://github.com/stablyai/orca/pull/31949\n\n### History, settings & everyday use\n\n*Search larger projects, follow history scans, choose your language during setup, and find release builds more easily.*\n\n* Project search works for projects with hundreds of worktrees by @Jinwoo-H in https://github.com/stablyai/orca/pull/31603\n* Pi and OMP keep their own agent on a transcript they both list by @AmoabaKelvin in https://github.com/stablyai/orca/pull/31377\n* Keep Session History checking totals fixed throughout a scan by @brennanb2025 in https://github.com/stablyai/orca/pull/30949\n* Show per-agent Session History reading progress by @brennanb2025 in https://github.com/stablyai/orca/pull/30954\n* Repair only the damaged parts of a profile instead of rolling back the whole profile by @brennanb2025 in https://github.com/stablyai/orca/pull/30931\n* Add search to the release build list by @AmethystLiang in https://github.com/stablyai/orca/pull/31678\n* Add Brazilian Portuguese UI localization by @AmethystLiang in https://github.com/stablyai/orca/pull/31627\n* Add onboarding language selection by @AmethystLiang in https://github.com/stablyai/orca/pull/31784\n* Preserve system language in both experiment cohorts by @AmethystLiang in https://github.com/stablyai/orca/pull/31810\n* Recover language selection after rejected catalog loads by @AmethystLiang in https://github.com/stablyai/orca/pull/31822\n* Restore localized editor safety copy by @AmethystLiang in https://github.com/stablyai/orca/pull/31259\n* Correct Korean sleep with descendants wording by @leo-yt-upstage in https://github.com/stablyai/orca/pull/31456\n* Clarify Japanese phone control and connection wording by @nwparker in https://github.com/stablyai/orca/pull/31467\n* Preserve runtime entries after removing untracked settings by @nwparker in https://github.com/stablyai/orca/pull/31852\n* Dim terminals and chats on the unfocused side like editors by @brennanb2025 in https://github.com/stablyai/orca/pull/28952\n* Remove directional tab-close actions and tracking by @AmethystLiang in https://github.com/stablyai/orca/pull/31599\n* A confirmed close of a pinned tab in a server workspace closes it instead of snapping back by @Jinwoo-H in https://github.com/stablyai/orca/pull/31791\n* Label re-sent held tab closes as replays by @nwparker in https://github.com/stablyai/orca/pull/31951\n* A worktree card fetches its Linear issue again only when the issue or its source changes by @brennanb2025 in https://github.com/stablyai/orca/pull/30904\n* Remove redundant host badges in every grouping by @nwparker in https://github.com/stablyai/orca/pull/31744\n* Honor \"only when desktop is away\" on headless orca serve by @nwparker in https://github.com/stablyai/orca/pull/31956\n* Reserve push database capacity so notification delivery can finish by @nwparker in https://github.com/stablyai/orca/pull/31955\n* Keep busy-device notification checks on their database index by @nwparker in https://github.com/stablyai/orca/pull/31899\n* Use database range indexes to bound push-notification retention work by @nwparker in https://github.com/stablyai/orca/pull/31921\n* Avoid decoding Qoder history records twice by @OrcaWin in https://github.com/stablyai/orca/pull/31938\n* Bound history scope-cache batch enumeration by @OrcaWin in https://github.com/stablyai/orca/pull/31950\n* Speed up session updates by indexing stable layout records by @OrcaWin in https://github.com/stablyai/orca/pull/31935\n* Limit buffered worker subprocess output without dropping bytes by @OrcaWin in https://github.com/stablyai/orca/pull/30698\n* Record a daily aggregate WSL usage snapshot on Windows by @nwparker in https://github.com/stablyai/orca/pull/31406\n\n### Tests, builds & maintenance\n\n*Release and security updates, plugin fixes, performance work, broader checks and continued module cleanup. The disabled groundwork below does not enable the new layout or sidebar behavior.*\n\n* HTML preview by default was added and then reverted for this release by @AmethystLiang in https://github.com/stablyai/orca/pull/31575 and https://github.com/stablyai/orca/pull/31893\n* fix(plugins): a development plugin reloads an edit saved while its watcher was starting by @nwparker in https://github.com/stablyai/orca/pull/31394\n* Prepare server template assembly alongside qualification by @nwparker in https://github.com/stablyai/orca/pull/31422\n* Reuse Windows server native prebuilds across app version bumps by @nwparker in https://github.com/stablyai/orca/pull/31450\n* refactor(renderer): read workspace records through typed selectors by @Jinwoo-H in https://github.com/stablyai/orca/pull/31462\n* fix(relay-ops): keep one stalled director instance from tripping the reserve watch's 503 rule by @Jinwoo-H in https://github.com/stablyai/orca/pull/31484\n* test(daemon): make real-socket backpressure assertion deterministic by @brennanb2025 in https://github.com/stablyai/orca/pull/31520\n* docs(mobile): clarify buffered terminal autocomplete scope by @nwparker in https://github.com/stablyai/orca/pull/31347\n* chore(ratchet): drop the stale owner-adapter focus seed and prune the baseline by @nwparker in https://github.com/stablyai/orca/pull/31625\n* refactor(ssh): delete SSH and orcad helpers nothing calls by @nwparker in https://github.com/stablyai/orca/pull/31629\n* refactor(orcad): share one unverifiable terminal census by @nwparker in https://github.com/stablyai/orca/pull/31633\n* chore(runtime): delete exports nothing reads by @nwparker in https://github.com/stablyai/orca/pull/31639\n* refactor(ssh): import SSH and orcad names from the modules that define them by @nwparker in https://github.com/stablyai/orca/pull/31642\n* refactor(execution-host): one resolver for the SSH target a repo row may dial by @nwparker in https://github.com/stablyai/orca/pull/31623\n* refactor(repo-host): one helper for the hosts registering a repo id by @nwparker in https://github.com/stablyai/orca/pull/31634\n* refactor(orcad): name the remote install helpers for what they install by @nwparker in https://github.com/stablyai