]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":74,"digest":"sha256:bd7bb0fc69b67632a97fd7c9a2cb4611fb43dc40bd074b6e0698a7f329583525","download_count":1,"created_at":"2026-11-10T15:10:10Z","updated_at":"2026-11-10T15:10:11Z"},{"id":731856186,"node_id":"RA_kwDOOtkEAs4rnz06","name":"ollama-client-0.15.0-chrome.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":23709958,"digest":"sha256:2f7d05403e386caa7c64d289127af9cd24caa691faa9ccea6c610c019b3c5b68","download_count":4,"created_at":"2026-11-10T15:10:10Z","updated_at":"2026-11-10T15:10:11Z"},{"id":731856179,"node_id":"RA_kwDOOtkEAs4rnz0z","name":"ollama-client-0.15.0-firefox.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24438576,"digest":"sha256:ca96ad30560afad49ebf34480bc82c4788f55c058f0fd71750b7d1feada3c86e","download_count":3,"created_at":"2026-11-10T15:10:10Z","updated_at":"2026-11-10T15:10:11Z"},{"id":731856184,"node_id":"RA_kwDOOtkEAs4rnz04","name":"ollama-client-0.15.0-sources.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4913443,"digest":"sha256:a20b3af51e577bbd90205eb80ab6ecb11d2cd8636e3b21e1f0e6c43047831db0","download_count":3,"created_at":"2026-11-10T15:10:10Z","updated_at":"2026-11-10T15:10:10Z"}],"body":"## What's Changed\n* chore: replace Biome with Oxlint, Oxfmt and shadcn lint by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/463\n* fix: resolve production dependency audit findings by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/465\n* Measure the browser agent honestly: scoring, trap tasks, readiness and live runs by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/466\n* Fix benchmark scoring, deadlines, and nightly evidence by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/467\n* Grade agent outcomes and stop reporting unchecked work as done by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/468\n* Keyboard access, safe resets and failure messages that say what to do by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/469\n* Guard local provider origins, keep short replies, and fix release blockers for 0.15.0-rc.1 by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/470\n* Fix rc validation findings: image errors, stream timings, embedding rebuild hang, accessibility by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/471\n* Open the side panel on the chat and poll only local catalogs by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/472\n* Add opt-in browser built-in AI chat by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/474\n* Ask once for read-only browsing, record committing clicks, and show values on approvals by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/475\n* Use real input for links and checkboxes, check completions harder, and keep long runs going by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/476\n* Long-task memory, loop catches and every-locale state words by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/478\n* Row-scoped clicks, kept sources and credit for finished work by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/479\n* Remove Oxlint suppression directives by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/480\n* Stop false completions, credit finished work and verify effects against the page by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/481\n* Discover missing Ollama cloud models and add web search by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/483\n* fix(chat): enforce privacy and source boundaries (R1–R5) by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/484\n* fix(persistence): batch stream writes and frame large payloads by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/485\n* Optimize vector storage and search paths by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/486\n* Bound agent state and reduce chat, upload, and model polling work by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/488\n* Speed up pre-push verification and balance E2E shards by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/487\n* Add retrieval benchmarks and correct eager bundle checks by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/489\n* Rewrite message image rows only when the images change by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/492\n* Abort PDF extraction and store each PDF's text once by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/491\n* Bound olc queue depth and wait by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/490\n* Load chat images only when shown, speed up base64, and stop deleting vectors when storage is full by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/493\n* Tell the side panel when the vector store is full and stop a storage write on every model listing by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/494\n* Skip the vector count for scoped searches by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/495\n* Read and select text inside embedded frames by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/496\n* Load the keyword index in the background search and stop it holding a second copy of every chunk by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/497\n* Store vectors as float32, rewrite saved ones in the background, and remove the HNSW index by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/498\n* Lift the 192MB backup and migration limit, compact the database after deletes, and trim streaming writes by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/499\n* Throttle agent panel snapshots and keep agent heartbeats to active runs by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/500\n* Stop options-page polling, gate selection overlay injection, and trim the side panel's startup code by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/501\n* Fix agent quick wins: stranded runs, status lists, observation gaps by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/502\n* Keep write watches until an effect settles and count unanswered writes by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/503\n* Name what a confirmed click did with an evidence code instead of matching its sentence by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/504\n* Match item names as record ids so B-2's row is not credited to B by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/505\n* Derive the wire target and DOM mutation list from their schemas; tie commands to families by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/506\n* Hold the release gate to the candidate's own build and scorer; compare nightly passes with an accepted baseline by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/507\n* Name icon-only controls and list controls the page marks but gives no role by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/508\n* Read embedded frames with the page unless the user asks otherwise; read heavy pages partially instead of failing by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/512\n* Cut the PR critical path: dead e2e waits, seven balanced shards, optional gates by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/513\n* Let a finished run complete: judge one-item answers, unchanged-others limits and quotes shared across outcomes by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/514\n* Merge the benchmark from a bundled file as soon as it ends; reserve shard 1's extras by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/515\n* Read roles from one list, mark cut page text exactly, tell a refused quote its page may have been left by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/516\n* Let correct runs complete and read every source by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/518\n* Fix the UI/UX audit: first-run recovery, destructive-action guards, IME, contrast and theming, one provider save model, agent approvals by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/521\n* feat(ui): simplify model picker and health by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/522\n* feat(model): clarify model picker toggles by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/523\n* Finish chat deletes in the background and refresh the panel's keyword index after background indexing by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/525\n* Release 0.15.0 into preview by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/524\n* Release 0.15.0 to main by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/527\n* Move per-model preferences out of sync storage and fix the effort slider by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/528\n* Fix selection overlay controls and improve panel workflows by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/529\n* Preserve model preferences during reset and backup recovery by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/531\n* Fix chat recovery and prevent deleted state from returning by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/532\n* Promote 0.15.0-rc.4 fixes from preview to main by @Shishir435 in https://github.com/Shishir435/ollama-client/pull/530\n\n\n**Full Changelog**: https://github.com/Shishir435/ollama-client/compare/0.14.0...0.15.0","mentions_count":1}
