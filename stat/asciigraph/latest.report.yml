1513,"node_id":"RA_kwDOCDRT9s4bDWCJ","name":"asciigraph_0.10.0_Windows_arm64.zip","label":null,"uploader":{"login":"guptarohit","id":7895001,"node_id":"MDQ6VXNlcjc4OTUwMDE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":850755,"digest":"sha256:842cff8ec1aa6c176e388d44743bdc6dafff3c6c99f178bd9a3cf4565a03c836","download_count":10,"created_at":"2026-06-21T17:55:16Z","updated_at":"2026-06-21T17:55:17Z"},{"id":453861506,"node_id":"RA_kwDOCDRT9s4bDWCC","name":"asciigraph_0.10.0_Windows_i386.zip","label":null,"uploader":{"login":"guptarohit","id":7895001,"node_id":"MDQ6VXNlcjc4OTUwMDE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":895457,"digest":"sha256:452ad98ab6f14e7b761ba31c7efd3a40a42147735a4cfa85575f7a386da5c205","download_count":6,"created_at":"2026-06-21T17:55:15Z","updated_at":"2026-06-21T17:55:16Z"},{"id":453861458,"node_id":"RA_kwDOCDRT9s4bDWBS","name":"asciigraph_0.10.0_Windows_x86_64.zip","label":null,"uploader":{"login":"guptarohit","id":7895001,"node_id":"MDQ6VXNlcjc4OTUwMDE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":924425,"digest":"sha256:17a4b5dc1f9af3332395363095a2702054c26b2db1d0fb31e55ad76c91860bbd","download_count":21,"created_at":"2026-06-21T17:55:10Z","updated_at":"2026-06-21T17:55:14Z"}],"body":"### Added\r\n\r\n- **Spectrum / heatmap gradient coloring** \u2014 color each point by its value (cool \u2192 warm) with `SeriesColorGradient`, the built-in `HeatmapSpectrum` palette, or your own stops (`-g` on the CLI). (#84)\r\n\r\n<img width=\"448\" height=\"500\" alt=\"realtime-redblue\" src=\"https://github.com/user-attachments/assets/f4e364f8-b4b1-42ac-8e4f-74616966d4e6\" />\r\n\r\n<details>\r\n<summary>command for above realtime plot</summary>\r\n\r\n```sh\r\n{ while true; do echo $((RANDOM % 100)); sleep 0.4; done; } | asciigraph -r -g cyan,magenta -w 60 -h 15\r\n```\r\n</details>\r\n\r\n- **Threshold coloring** \u2014 highlight points that breach a limit with `ColorAbove` / `ColorBelow` (or `-ca` / `-cb` on the CLI). Applies across all series and takes precedence over solid/gradient colors. (#85, closes #38)\r\n \r\n<img width=\"448\" height=\"223\" alt=\"threshold\" src=\"https://github.com/user-attachments/assets/d03e421a-accd-4a05-a11c-b465c9b69c6b\" />\r\n\r\n- **Flicker-free realtime mode** \u2014 new `ClearLines` redraws only the previous graph instead of wiping the whole screen, so `-r` no longer flickers and preserves any output above the chart. (#79, closes #44)"}
