{"id":384508636,"author":{"login":"cmang","id":261501,"node_id":"MDQ6VXNlcjI2MTUwMQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOARWzfM4W6yLc","tag_name":"0.30.0","target_commitish":"master","name":"Durdraw 0.30.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-08T07:00:55Z","updated_at":"2026-09-08T22:23:10Z","published_at":"2026-09-08T07:07:12Z","assets":[],"body":"0.30.0 changes:\r\n\r\nDurfetch:\r\n* Fastfetch support (Thanks @elijahlovold!)\r\n* New Durfetch option -a or --all to play all internal animations\r\n* New Durfetch option --list to list all internal animations\r\n* New Durfetch screens: linux-tux-fire, linux-tab, lunix, linux-plasma, arch-fire\r\n* Fixed: Mouse movement produces terminal garbage after exit (durfetch, durview), Formatting/cropping for some animations\r\n\r\nDurdraw:\r\n* Copy/paste animations, not just static frames\r\n* Demoscene-style effects and transitions (sine, plasma, fire, melt, fade in/out...)\r\n* Live theme switching menu, scans ~/.durdraw/themes/ for new files\r\n* New themes: CGA Days, CGA Nights, Laser Tag, Hot Dog Stand, Tokyo Night, Night Drive, Outrunnable, Forest, Orbit\r\n* Remember and auto-reload last used theme\r\n* Any valid JSON with Dur data can now be opened in Durdraw. (No more \"magic bytes\" headers). Better interoperability\r\n* Search/replace character under the cursor (similar to Replace Color)\r\n* Cursor Settings menu, for setting block/underscore/pipe cursor\r\n* New character set: Libvtescii by MC Fresher\r\n* Default undo states increased to 1000\r\n* Max FPS increased from 50 to 240\r\n* durdraw.desktop file and icon, for Linux desktops\r\n* 0xB800 (Endoom) and MS-DOS .COM file export\r\n* Jump to Shell menu option\r\n* Sixel Preview (high resolution) menu option\r\n* Stabilize terminal on ctrl-c\r\n* Open Examples menu item added\r\n* Version 8 file format corrects lines/columns (sizeY/sizeX) fields and rotated colorMap issue\r\n* Fixed: 256 color ANSI/.ANS file loading\r\n* Fixed: Cannot open hidden directories in file browser\r\n* Fixed: crash on startup when window is too short for menu\r\n* Other bug fixes and tweaks\r\n","reactions":{"total_count":7,"+1":3,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":1}
