16:45Z"},{"id":773534405,"node_id":"RA_kwDOBKDMsc4uGzLF","name":"kubectl-ktop_v0.7.3_windows_amd64.zip","label":"","uploader":{"login":"vladimirvivien","id":309126,"node_id":"MDQ6VXNlcjMwOTEyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14514029,"digest":"sha256:572d9677f50f858e0381caef411b2af51b348934bc97b9f2d3bef8a80dbf0827","download_count":0,"created_at":"2026-11-20T22:16:45Z","updated_at":"2026-11-20T22:16:46Z"},{"id":773534413,"node_id":"RA_kwDOBKDMsc4uGzLN","name":"kubectl-ktop_v0.7.3_windows_arm64.zip","label":"","uploader":{"login":"vladimirvivien","id":309126,"node_id":"MDQ6VXNlcjMwOTEyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12596352,"digest":"sha256:2e634d906e45dc22e9ee81f08aef7968b97be2a275dd46f2fdb6af3e638fb1a1","download_count":0,"created_at":"2026-11-20T22:16:45Z","updated_at":"2026-11-20T22:16:46Z"}],"body":"# ktop Release v0.7.3\n\n`ktop` v0.7.3 introduces the **Workloads** top-level page (`[2] Workloads`), providing real-time visibility into Deployments, StatefulSets, DaemonSets, and Jobs alongside a dedicated **Workload Detail** drill-down view, workload resource efficiency scoring (`EFF`), and `--page=workloads` startup support.\n\nThis release also upgrades the multi-page navigation chrome with a bordered `ui.TabFrame` container that renders zero-gap themed tab pills and right-aligned drill-down breadcrumbs along its top border, refines tab color contrast across Dark, Light, ANSI, and Monochrome themes, and streamlines `Tab` focus cycling on both Overview and Workloads pages.\n\n---\n\n## Detailed Changes by Category\n\n### 1. Workloads Informer Controller & Efficiency View Models (`k8s`, `views/model`)\n\n#### Dedicated Workload Informer Snapshot & Pod Ownership Resolution\n- **Problem / Context**: `ktop` previously surfaced cluster state through Nodes and Pods without aggregating controller-level workload health, replica status, job completion state, or pod-to-workload ownership chains.\n- **Technical Implementation**: Added `k8s/workloads_controller.go` and `views/model/workload_model.go` to watch `apps/v1` (`Deployment`, `StatefulSet`, `DaemonSet`, `ReplicaSet`) and `batch/v1` (`Job`) objects through Kubernetes shared informers, resolve owned pods via `OwnerReferences` (including `Deployment -> ReplicaSet -> Pod` indirection), and build immutable `model.WorkloadsSnapshot` updates. Added `ClientController.SetWorkloadsRefreshFunc` and deferred workload startup handling in `k8s/client_controller.go` so informer callbacks register reliably regardless of page initialization order. Extracted shared `GetEventsForObject` and workload object getters in `k8s/client_funcs.go`.\n- **APIs / Signatures**:\n  ```go\n  snap, err := client.Controller().GetWorkloadsSnapshot(ctx)\n  detail, err := client.Controller().GetWorkloadDetail(ctx, kind, namespace, name)\n  ```\n- **Behavioral Notes**: Workloads snapshots honor the active cluster namespace filter (`--namespace` or header `/` filter), expose per-kind summary counts (`model.WorkloadSummary`), and compute workload health statuses (`Healthy`, `Progressing`, `Degraded`, `Scaled to 0`, `Complete`, `Running`, `Failed`).\n\n#### Resource Request Efficiency Scoring (`EFF`)\n- **Problem / Context**: Operators inspecting controller fleets need a quick indicator of over-provisioned or unrequested CPU/memory allocations across owned pods.\n- **Technical Implementation**: Implemented `model.ComputeWorkloadEfficiency` in `views/model/workload_model.go` and `ui.FormatEfficiencyCell` in `ui/format.go` to compare live pod CPU/memory usage against pod requests and classify workloads into efficiency bands (`Optimal`, `Underutilized`, `Over-provisioned`, `No Requests`, `No Metrics`).\n- **Behavioral Notes**: Efficiency cells degrade gracefully when metrics are unavailable or pods omit resource requests, and use semantic theme colors (or plain text labels in `monochrome` / `$NO_COLOR` mode).\n\n---\n\n### 2. Workloads Page & Workload Detail View (`views/workloads`, `application`, `ui`)\n\n#### 2-Column Workloads Dashboard (`[2] Workloads`)\n- **Problem / Context**: Monitoring four workload controller types simultaneously requires balanced screen density without horizontal column overflow.\n- **Technical Implementation**: Added `views/workloads/page.go`, `views/workloads/summary.go`, and `views/workloads/table.go` implementing the `[2] Workloads` page registered in `application/tui/app.go`. The layout pairs a compact `Workload Summary` header with an equal 2-column × 2-row `tview.Grid` (`Deployments` and `DaemonSets` on the left; `StatefulSets` and `Jobs` on the right), column sorting (`<`/`>` or header hotkeys), inline filtering (`/`), and clipboard copy (`y`).\n- **Behavioral Notes**: `NAME` columns expand to use available width while compact metadata columns (`NS`, `READY`, `UP`, `AVAIL`, `AGE`, `EFF`, `STATUS`) stay tightly sized.\n\n#### Workload Detail Drill-Down & Cross-View Navigation\n- **Problem / Context**: Investigating an unhealthy or inefficient Deployment, StatefulSet, DaemonSet, or Job requires inspecting controller metadata, live resource sparklines, recent Kubernetes events, and owned pods in one view.\n- **Technical Implementation**: Added `views/workloads/detail.go` and `application.PageWorkloadDetail` routing in `application/navigation.go`, `application/page_registry.go`, and `application/app_ctrl.go`. Selecting any workload row (`Enter`) opens Workload Detail with controller metadata, labels/annotations, live CPU/Memory/Network/Disk sparklines, owned pods, and workload-scoped Kubernetes events. Pressing `Enter` on an owned pod drills further into Pod Detail and Container Logs with full breadcrumb tracking (`Workloads › deploy/<ns>/<name> › pod/<ns>/<pod>`) and `ESC` stack unwinding.\n- **Behavioral Notes**: Added `ui.WorkloadsContext` and `ui.WorkloadDetailContext` in `ui/footer_context.go`, workload status styling in `ui/theme.go`, and Workloads keybindings in `ui/help_modal.go`.\n\n---\n\n### 3. Bordered Tab Frame, Tab Theme Contrast & Navigation Polish (`ui`, `application`, `config`)\n\n#### Bordered `ui.TabFrame` Container with Top-Border Tabs and Breadcrumbs\n- **Problem / Context**: Top-level page tabs previously floated on a separate borderless row above the page panels, leaving no visual frame tying active page content to its selected tab.\n- **Technical Implementation**: Added `ui.TabFrame` in `ui/tab_bar.go` wrapping `p.pages` in `application/app_ui.go` inside a single-line bordered box (`Palette.BorderNormal`). Contiguous zero-gap tab pills render directly along the top border line on the left, while drill-down breadcrumbs render right-aligned on the same border row. Updated `ExtraLarge` panel height calculation in `views/overview/main_panel.go` for the frame borders.\n- **APIs / Signatures**:\n  ```go\n  frame := ui.NewTabFrame(pages)\n  frame.SetTabs([]ui.TabItem{\n      {ID: \"overview\", Title: \"Overview\", Key: '1'},\n      {ID: \"workloads\", Title: \"Workloads\", Key: '2'},\n  })\n  frame.SetActive(1)\n  frame.SetBreadcrumb(\"Workloads › deploy/default/api\")\n  ```\n- **Behavioral Notes**: `TabFrame` renders its outer frame with single-line borders while inner tables retain focus borders, and delegates `Focus`, `Blur`, `HasFocus`, `InputHandler`, and `MouseHandler` directly to the active page.\n\n#### Dedicated Active/Inactive Tab Palette Tokens & Streamlined Tab Cycling\n- **Technical Implementation**: Added `TabActiveFg`, `TabActiveBg`, `TabInactiveFg`, and `TabInactiveBg` tokens to `ui/theme/palette.go` and tuned Dark, Light, ANSI, and Monochrome presets in `ui/theme/builtins.go` for clear active/inactive separation and readability. Removed non-interactive Summary boxes (`Cluster Summary` and `Workload Summary`) from the `Tab` focus cycle in `views/overview/main_panel.go`, `views/workloads/page.go`, and `application/tui/app.go` so `Tab` cycles directly across interactive panels (`Header -> Nodes -> Pods` on Overview; `Header -> Deployments -> StatefulSets -> DaemonSets -> Jobs` on Workloads).\n\n#### Startup Page Configuration (`--page=workloads`) & Diverse Load Test Harness\n- **Technical Implementation**: Added `workloads` to `config.ValidPages` (`config/config.go`) and updated CLI flag help (`cmd/ktop.go`), allowing startup directly on Workloads via `ktop --page=workloads` or `ui.default_page: workloads` in `~/.ktop/config.yaml`. Expanded `hack/load-test/deploy-load.sh`, `hack/load-test/cleanup-load.sh`, and `hack/load-test/README.md` to provision diverse Deployments (including over-provisioned and scaled-to-zero examples), StatefulSets, DaemonSets, Jobs, and CronJobs for local verification.\n\n---\n\n## Upgrade & Compatibility Notes\n\n- **Backward Compatibility**: Fully backward compatible with existing `ktop` CLI invocations, `kubectl ktop` plugin usage, `--noui` JSON/JSONL output schemas, and `~/.ktop/config.yaml` configurations. Existing installations without `ui.default_page` continue opening on `overview`.\n- **Deprecations & Retractions**: None.\n- **Migration Actions**: None required.\n\n---\n\n## Workspace / Repository Metrics\n\n```text\n37 files changed, 5353 insertions(+), 473 deletions(-)\n```\n\n- **Documentation**:\n  - [User Guide — Workloads Page](https://github.com/vladimirvivien/ktop/blob/main/docs/guide.md)\n  - [CLI Reference — Display Options](https://github.com/vladimirvivien/ktop/blob/main/docs/cli.md)\n  - [Load Test Harness](https://github.com/vladimirvivien/ktop/blob/main/hack/load-test/README.md)\n"}
