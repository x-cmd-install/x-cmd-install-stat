ng active series from growing to 10,000 slots over extended uptime.\n* **Metadata & Stale Series Reclamation (`prom/storage.go`, `prom/controller.go`)**:\n  * Removed the unbounded `stringHandles` map and delegated `InternString` directly to `unique.Make(s).Value()` so interned strings for deleted pods, containers, and cgroup paths are eligible for garbage collection.\n  * Rebuilt `labelNames` and `labelValues` and compacted heavily shrunk per-metric series maps during `cleanupExpiredSamples`.\n  * Capped the periodic cleanup interval to at most 2 minutes so expired series are reclaimed promptly.\n* **Reduced Query Allocations (`prom/storage.go`)**: Added `QueryLatestPerSeries` for single-sample lookups and batch-allocated `MetricSample` slices in `QueryRangePerSeries`.\n\n### 2. Streaming Scrape Filtering & cAdvisor Cardinality Reduction (`prom/scraper.go`)\n\n* **Stream-Filtered Parsing**: `scrapeTarget` streams responses via `req.Stream` and filters Prometheus exposition lines against `DefaultMetricAllowlist` before invoking `expfmt.TextParser`, avoiding protobuf DTO allocation for non-allowlisted metric families.\n* **Bounded Node Concurrency**: `scrapeAllTargets` caps concurrent node scrapes at 6 to bound peak heap usage on multi-node clusters.\n* **cAdvisor Series Filtering**: Drops unqueried cAdvisor series during ingestion—including non-root/non-pod systemd and slice cgroups (`/system.slice/*`, `/kubepods.slice`), pause containers (`container=\"POD\"`), per-core pod CPU series, pod-level network series, and non-workload CFS/PSI series—while preserving all queried node (`id=\"/\"`, including cgroups v1 per-core CPU fallback) and pod/container series (including static-pod `container=\"\"` memory fallback).\n\n### 3. Refresh Allocation & Config Wiring Fixes (`metrics/prom`, `k8s`, `views/node`, `cmd`, `docs`)\n\n* **Latest-Sample Memory Lookups (`metrics/prom/prom_source.go`)**: `GetAllPodMetrics` and `queryLatestSumFiltered` use `QueryLatestPerSeries` for working-set memory instead of scanning 5-minute ranges on every 3-second pod refresh.\n* **Informer Read Without Deep Copy (`k8s/pods_controller.go`)**: `GetPodModels` reads node allocatable resources directly from the node informer lister without deep-copying full `Node` objects.\n* **Reusable Node Info Header (`views/node/detail.go`)**: Reuses a single `tview.TextView` in `drawInfoHeader` across refreshes.\n* **Config File Prometheus Settings (`cmd/ktop.go`)**: Applied `metrics.scrape_interval`, `metrics.retention`, `metrics.max_samples`, and `metrics.components` from `~/.ktop/config.yaml` when not overridden by CLI flags.\n* **Documentation (`docs/prometheus.md`, `docs/cli.md`)**: Updated default `--prometheus-scrape-interval` documentation to `5s` and added a Memory Tuning guide covering CLI flags, `~/.ktop/config.yaml`, `--ksm=off`, `--metrics-source=metrics-server`, and `GOMEMLIMIT`.\n\n---\n\n## Upgrade & Compatibility Notes\n\n* **Backward Compatibility**: Fully backward compatible with existing CLI flags, `kubectl ktop` plugin usage, `~/.ktop/config.yaml` files, and `--noui` JSON/JSONL output.\n* **Deprecations & Retractions**: None.\n* **Migration Actions**: None required. Existing `~/.ktop/config.yaml` files with `max_samples: 10000` benefit automatically from lazy ring-buffer allocation and retention-bounded per-series caps.\n\n---\n\n## Repository Metrics\n\n```text\n 14 files changed, 937 insertions(+), 200 deletions(-)\n```\n\n* **Documentation**:\n  * [Prometheus Integration & Memory Tuning](https://github.com/vladimirvivien/ktop/blob/main/docs/prometheus.md#tuning-memory-usage)\n  * [CLI Reference](https://github.com/vladimirvivien/ktop/blob/main/docs/cli.md)","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
