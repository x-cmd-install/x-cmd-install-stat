26-11-17T23:46:01Z"},{"id":761102823,"node_id":"RA_kwDOBKDMsc4tXYHn","name":"kubectl-ktop_v0.7.2_windows_amd64.zip","label":"","uploader":{"login":"vladimirvivien","id":309126,"node_id":"MDQ6VXNlcjMwOTEyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14388579,"digest":"sha256:6698761ee8b2c303bdb94957c9e5e596b4df61e8bd941aa6e214ba3ea28dde45","download_count":2,"created_at":"2026-11-17T23:46:01Z","updated_at":"2026-11-17T23:46:02Z"},{"id":761102759,"node_id":"RA_kwDOBKDMsc4tXYGn","name":"kubectl-ktop_v0.7.2_windows_arm64.zip","label":"","uploader":{"login":"vladimirvivien","id":309126,"node_id":"MDQ6VXNlcjMwOTEyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12497644,"digest":"sha256:11fef43361ffea4923a07d58f0d27387d92af0cb8554c18e745a57c81547233d","download_count":1,"created_at":"2026-11-17T23:46:00Z","updated_at":"2026-11-17T23:46:01Z"}],"body":"# ktop Release v0.7.2\n\n`ktop` v0.7.2 introduces the multi-page terminal UI navigation architecture, adding a theme-aware top-level tab bar (`ui.TabBar`) with drill-down breadcrumbs, a declarative page registry (`application.PageDescriptor` and `application.PageSession`), isolated per-page navigation stacks (`application.NavigationStack`), keyboard page-switching shortcuts (`1`–`9`, `[` and `]`), and startup page configuration via `--page` and `ui.default_page` in `~/.ktop/config.yaml`.\n\nTop-level pages maintain independent focus positions and drill-down histories across tab transitions while sharing cluster header namespace filtering, modal overlays, and Kubernetes informer lifecycles.\n\n---\n\n## Detailed Changes by Category\n\n### 1. Top-Level Tab Bar & Breadcrumb Navigation (`ui`)\n\n#### Theme-Aware Tab Bar and Right-Aligned Drill-Down Breadcrumbs\n* **Problem / Context**: `ktop` previously rendered a single unindexed page container without visible top-level tab indicators or hierarchical location trails when navigating across nested `Node`, `Pod`, and `Container` detail views.\n* **Implementation Details**: Added `ui.TabBar` and `ui.TabItem` in `ui/tab_bar.go` backed by a 1-row borderless `tview.Table` mounted directly beneath the cluster header in `application/app_ui.go` (removing the unmounted legacy page-button footer table and updating panel height calculations in `views/overview/main_panel.go`). Added `application.FormatBreadcrumb` in `application/navigation.go` to render active drill-down paths (`<Page> › node/<name> › pod/<ns>/<pod> › logs/<container>`).\n* **APIs / Signatures**:\n  ```go\n  tb := ui.NewTabBar()\n  tb.SetTabs([]ui.TabItem{\n      {ID: \"overview\", Title: \"Overview\", Key: '1'},\n  })\n  tb.SetActive(0)\n  tb.SetBreadcrumb(\"Overview › node/worker-1 › pod/default/api-0\")\n  ```\n* **Impact & Behavioral Notes**: Active tabs render with `Palette.HeaderFg` on `Palette.HeaderBg` (and `tcell.AttrReverse | tcell.AttrBold` with `tcell.ColorDefault` in `monochrome` and `$NO_COLOR` environments); inactive tabs and breadcrumbs render with `Palette.CanvasFg` on `Palette.CanvasBg`. Root-level pages omit redundant breadcrumb text and display trail segments only when drilled into detail views. Updated `ui.OverviewContext`, `ui.PageContext` (`ui/footer_context.go`), and `ui.HelpModal` (`ui/help_modal.go`) to display dynamic `[1-N] page` and `[ / ]` shortcuts.\n\n---\n\n### 2. Multi-Page Registry, Per-Page Navigation Stacks & Input Routing (`application`, `k8s`, `views`)\n\n#### Declarative Page Registry and Isolated Per-Page Sessions\n* **Problem / Context**: Focus management, `Tab`/`Shift+Tab` panel cycling, `ESC` back-navigation, modal focus restoration, and active detail lookups in `application/app_ctrl.go` previously indexed `app.pages[0]` directly and shared a single `NavigationStack` rooted at `PageOverview`.\n* **Implementation Details**: Added `application.PageDescriptor` and `application.PageSession` in `application/page_registry.go` (`RegisterPage`, `PageCount`, `ActivePageIndex`, `ActivePageID`, `FindPageIndex`, `SetInitialPage`, `SwitchToPageIndex`, `SwitchToPage`, `NextPage`, `PrevPage`) and `application.NewNavigationStackWithRoot` in `application/navigation.go`. Refactored `application/app_ctrl.go` to resolve focus, `EscapablePanel` state, `HelpModal` context, and `ESC` unwind transitions against the active `PageSession`, added `Application.SetDetailResetCallback` and `Application.AddNamespaceFilterListener`, added `DetailPanel.IsFilterEditing` in `views/container/detail.go`, and guarded `Controller.Start` in `k8s/client_controller.go` for idempotent informer startup across multiple registered pages.\n* **APIs / Signatures**:\n  ```go\n  app.RegisterPage(application.PageDescriptor{\n      ID:         \"overview\",\n      Title:      \"Overview\",\n      Key:        '1',\n      RootType:   application.PageOverview,\n      Panel:      overviewPage,\n      ChildNames: []string{\"summary\", \"nodes\", \"pods\"},\n  })\n  ```\n* **Impact & Behavioral Notes**: Pressing `1`–`9` switches directly to the corresponding registered page, and `[` / `]` cycles to the previous or next page with wrap-around. Switching away from a page preserves both its focused panel index and any open detail stack (`Node Detail`, `Pod Detail`, `Container Logs`), restoring them when switching back. When any filter input is active (cluster header namespace filter, table `/` filter, or container log filter), digit and bracket keys pass directly into the text input without triggering page switches.\n\n---\n\n### 3. CLI & Configuration (`cmd`, `config`, `application/tui`)\n\n#### Startup Page Flag (`--page`) and Persistent Default (`ui.default_page`)\n* **Problem / Context**: Operators had no CLI flag or configuration key to select or validate the initial top-level page at startup.\n* **Implementation Details**: Added `--page` in `cmd/ktop.go`, `InitialPage` on `tui.Options` in `application/tui/app.go`, and `UIConfig.DefaultPage` (`ui.default_page`), `config.ValidPages`, and `config.NormalizePage` in `config/config.go`.\n* **APIs / Signatures**:\n  ```bash\n  # Launch ktop on a specific top-level page\n  ktop --page=overview\n  ```\n  ```yaml\n  # ~/.ktop/config.yaml\n  ui:\n    theme: auto\n    color_mode: auto\n    default_page: overview\n  ```\n* **Impact & Behavioral Notes**: `--page` defaults to `overview` and overrides `ui.default_page` in `~/.ktop/config.yaml` for the current session. Unrecognized `--page` or `ui.default_page` values fail fast prior to cluster connection with exit code `2` (`ExitInvalidFlags`).\n\n---\n\n## Upgrade & Compatibility Notes\n\n* **Backward Compatibility**: Fully backward compatible with existing `ktop` CLI invocations, `kubectl ktop` plugin usage, `--noui` JSON/JSONL schemas, and `~/.ktop/config.yaml` files. Existing configurations without `ui.default_page` default automatically to `overview`.\n* **Deprecations & Retractions**: None.\n* **Migration Actions**: None required.\n\n---\n\n## Workspace / Repository Metrics\n\n```text\n 23 files changed, 1983 insertions(+), 438 deletions(-)\n```\n\n* **Documentation & Examples**:\n  * [CLI Reference — Display Options & Configuration (`docs/cli.md`)](https://github.com/vladimirvivien/ktop/blob/main/docs/cli.md#display-options-flags)\n  * [Project Overview & Quick Start (`README.md`)](https://github.com/vladimirvivien/ktop/blob/main/README.md)\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
