r.xz) | x64 Linux | [checksum](https://github.com/dhth/bmm/releases/download/v0.3.1/bmm-x86_64-unknown-linux-gnu.tar.xz.sha256) |\r\n| [bmm-x86_64-unknown-linux-musl.tar.xz](https://github.com/dhth/bmm/releases/download/v0.3.1/bmm-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/dhth/bmm/releases/download/v0.3.1/bmm-x86_64-unknown-linux-musl.tar.xz.sha256) |\r\n\r\n## Verifying GitHub Artifact Attestations\r\n\r\nThe artifacts in this release have attestations generated with GitHub Artifact Attestations. These can be verified by using the [GitHub CLI](https://cli.github.com/manual/gh_attestation_verify):\r\n```sh\r\ngh attestation verify <file-path of downloaded artifact> --repo dhth/bmm\r\n```\r\n\r\nYou can also download the attestation from [GitHub](https://github.com/dhth/bmm/attestations) and verify against that directly:\r\n```sh\r\ngh attestation verify <file-path of downloaded artifact> --bundle <file-path of downloaded attestation>\r\n```\r\n\r\n\r\n"}
