A_kwDOBxiHqc4n3hrb","name":"fselect-aarch64-mac.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3453936,"digest":"sha256:c63ea0e88ae1243922696b97e04a54bb41e5b454f36bafdea86102e47dc1c507","download_count":15,"created_at":"2026-10-23T11:07:15Z","updated_at":"2026-10-23T11:07:16Z"},{"id":668867368,"node_id":"RA_kwDOBxiHqc4n3hso","name":"fselect-x86_64-linux-musl.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4119290,"digest":"sha256:769f961c300fb790259fa8b6e54a09f2b4d661c7c4d8af1e1528bdaab6da45c1","download_count":90,"created_at":"2026-10-23T11:07:17Z","updated_at":"2026-10-23T11:07:18Z"},{"id":668866479,"node_id":"RA_kwDOBxiHqc4n3hev","name":"fselect-x86_64-linux.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4064074,"digest":"sha256:1eb4da3f5792d39cb8f3ae5aa858608170e8125000cb182403028c741ec8e3d5","download_count":48,"created_at":"2026-10-23T11:06:54Z","updated_at":"2026-10-23T11:06:54Z"},{"id":668876372,"node_id":"RA_kwDOBxiHqc4n3j5U","name":"fselect-x86_64-win.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3747140,"digest":"sha256:a6eeff2b7d55d44cb6974d387fb925aa16da0db1a4a280888640200ec7cda364","download_count":180,"created_at":"2026-10-23T11:11:06Z","updated_at":"2026-10-23T11:11:07Z"},{"id":668866241,"node_id":"RA_kwDOBxiHqc4n3hbB","name":"fselect_0.10.4-1_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2935996,"digest":"sha256:59ef62e308a1923e6fcc17b0e934e052945389b0aa8165c8e3f439c34159a845","download_count":17,"created_at":"2026-10-23T11:06:48Z","updated_at":"2026-10-23T11:06:49Z"}],"body":"### Added\r\n\r\n- `IS NULL` and `IS NOT NULL` operators.\r\n- `depth` field.\r\n- `CONTAINS_CYRILLIC` function; better Japanese text detection.\r\n- `STRPOS` function, split from `LOCATE`.\r\n- `rlike` as a regex operator alias.\r\n- Encrypted entries in zip archives; more fields available for archived files, with archive paths included in their values.\r\n- `include:` directives in `.hgignore` and `.dockerignore`.\r\n- Function argument counts and literals compared with typed expressions are checked when the query is parsed.\r\n- Integration test suite covering traversal, ignore files, formats, grouping, dates, archives and CLI flags.\r\n\r\n### Changed\r\n\r\n- Expressions carry static types; caches, sorting, grouping and aggregates work on typed values instead of rendered text.\r\n- `fsize` is numeric: it compares, groups, sorts and aggregates by byte count while printing the formatted size.\r\n- `CURRENT_DATE`, `NOW`, `DATE_ADD`, `DATE_SUB`, `FROM_UNIXTIME`, `LAST_DAY` and `DATE_TRUNC` return datetimes.\r\n- `LEAST` and `GREATEST` operate on strings as well as numbers.\r\n- `xattr()` returns values that are not UTF-8 as `0x..` hex instead of an empty string ([#187](https://github.com/jhspetersson/fselect/issues/187)).\r\n- Unknown columns in `GROUP BY` and `ORDER BY`, ungrouped columns in grouped queries, an empty `IN ()` and an incomplete `WHERE` clause are rejected.\r\n- A literal that can never match a typed expression (`length(name) > 'abc'`) is rejected before the search starts.\r\n- `LIKE ''` matches the empty string.\r\n- Bare words are treated as function calls only for functions that take no arguments.\r\n- Root aliases are case-insensitive; JSON column names are lowercase.\r\n- Search roots defined by subqueries inherit the root options of the parent query; a grouped subquery in `FROM` yields one entry per group.\r\n- Faster sorting, aggregates, subquery caching, BFS traversal with `LIMIT`, deferred evaluation of heavy columns.\r\n\r\n### Fixed\r\n\r\n- `GROUP BY` merged distinct values that render alike, such as sizes of 10,241 and 10,242 bytes both shown as `10.00KiB`.\r\n- Missing boolean values sorted as `false` instead of last.\r\n- `HAVING`, aggregate aliases and `MIN`/`MAX`/`COALESCE` corner cases.\r\n- Correlated subqueries: caching, nested contexts and the group values they see.\r\n- Symlink handling and ignore rules applied across symlinks.\r\n- SVG dimension detection, MP4 duration and `exif_alt` for negative altitudes.\r\n- Errors no longer break JSON and HTML output or the row count.\r\n- `--help` and `--version` after other arguments; paths containing whitespace; floating point literals and unary minus.\r\n- Windows: datetime formatting, Unix permission fields, extended attributes on musl builds.\r\n- Subquery `OFFSET` applied twice; depth calculation; path under symlinks.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
