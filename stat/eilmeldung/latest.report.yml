ated_at":"2026-09-02T06:26:04Z"},{"id":540730383,"node_id":"RA_kwDOQocK5c4gOuQP","name":"eilmeldung-x86_64-apple-darwin-1.8.1.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10869100,"digest":"sha256:c7387b767aed5f1b5b85649321cb8effcbda001df7018580d130091c91b191d0","download_count":4,"created_at":"2026-09-02T06:26:03Z","updated_at":"2026-09-02T06:26:03Z"},{"id":540730386,"node_id":"RA_kwDOQocK5c4gOuQS","name":"eilmeldung-x86_64-pc-windows-msvc-1.8.1.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":12482035,"digest":"sha256:20a68de34f4148b4032b58f42d4b65c665cb9a2f93a7c2291731491e71eab5b7","download_count":32,"created_at":"2026-09-02T06:26:03Z","updated_at":"2026-09-02T06:26:04Z"},{"id":540730384,"node_id":"RA_kwDOQocK5c4gOuQQ","name":"eilmeldung-x86_64-unknown-linux-musl-1.8.1.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15251789,"digest":"sha256:bb5fd863ca41e7c5893149601eeddfcc15805f2c83adc1a23b84d55e2cf0d095","download_count":149,"created_at":"2026-09-02T06:26:03Z","updated_at":"2026-09-02T06:26:04Z"}],"body":"# 1.8.1 - 2026-09-02\r\n\r\n- bugfixes \r\n  - eilmeldung does not output mouse dis-/enable code anymore when starting in CLI mode (thanks @Crandle for reporting)\r\n  - statically import (copy) base16-schemes from [tinted-theming](https://github.com/tinted-theming/schemes) (MIT license) instead of importing as a submodule\r\n\r\n# Release notes from 1.8.0\r\n\r\nThis release comes with *two new features*: your configuration file is now auto-reloaded while *eilmeldung* is running (see below) and...\r\n\r\n- ...\ud83c\udfa8\ud83c\udfa8\ud83c\udfa8 *themes for everyone*! \ud83c\udfa8\ud83c\udfa8\ud83c\udfa8\r\n  - *eilmeldung* now supports [Base16 Themes](https://github.com/chriskempson/base16)\r\n  - **all** the Base16 themes [Tinted Theming Project](https://github.com/tinted-theming/schemes) are directly available without any further configuration!\r\n  - want to try it out? Press `:` and enter `theme`, a *space* and then press *Tab* to cycle through all available themes:\r\n    <img width=\"640\" height=\"442\" alt=\"eilmeldung-themes\" src=\"https://github.com/user-attachments/assets/9051ad9d-e5de-42db-9609-0e7cfdac9017\" />\r\n    Press *enter* to choose a theme.\r\n  - found a nice theme? set the configuration option `theme.base16_theme = \"name-of-theme\"` to use the theme\r\n  - of course, you can also import custom themes and fine-tune everthing (see [Theme Configuration](docs/configuration.md#theme-configuration))\r\n  - and for you power-users out there, define key mappings for quickly changing themes:\r\n  ```toml\r\n  [input_config.mappings]\r\n  \"6\" = [\"theme catppuccin-frappe\"]\r\n  \"7\" = [\"theme catppuccin-latte\"]\r\n  \"8\" = [\"theme catppuccin-macchiato\"]\r\n  \"9\" = [\"theme catppuccin-mocha\"]\r\n\r\n  ```\r\n- *eilmeldung* now auto-reloads the configuration file when it has changed!\r\n  - use this to tweak your configuration!\r\n  - you can deactivate this behavior by setting `auto_reload_config` to `false`\r\n  - to manually reload the configuration run the command `reloadconfig` (press `:reloadconfig` and then enter) or press `Ctrl-r` (which simply maps to `reloadconfig`)\r\n- refactoring for better maintainability of *eilmeldung*\r\n- quality of life: no error message anymore if the thumbnail couldn't be downloaded\r\n- bugfixes\r\n  - when in distraction-free (zen) mode, mouse clicks are now handled correctly (thanks to @cornservant)\r\n  - handling of redrawing and clearing the terminal is now more reliable (implemented debouncing)\r\n","mentions_count":2}
