pm/pull/3487\n* docs(concepts): Fix `what-is-apm` file extension by @TyMick in https://github.com/microsoft/apm/pull/3461\n* Fix YAML syntax error in `docs-grounding-verifier` frontmatter by @TyMick in https://github.com/microsoft/apm/pull/3285\n* fix(triage): drop inaccessible grok-4.7 pin from scheduled Triage Panel by @danielmeppiel in https://github.com/microsoft/apm/pull/3515\n* fix(perf-scan): emit noop instead of opening an issue on clean scans by @danielmeppiel in https://github.com/microsoft/apm/pull/3516\n* docs(pr): require closing keyword for delivered issues, Refs for partial by @danielmeppiel in https://github.com/microsoft/apm/pull/3518\n* docs(lockfile-spec): show sha256:<hex> hash form APM writes by @danielmeppiel in https://github.com/microsoft/apm/pull/3519\n* docs(devcontainer): stop advertising the unpublished GHCR feature by @danielmeppiel in https://github.com/microsoft/apm/pull/3526\n* fix(install): keep the locked commit as the cached source pin by @abhishekacharya200 in https://github.com/microsoft/apm/pull/3407\n* fix(receipts): preserve macOS identity across remounts with downgrade-safe migration by @TyceHerrman in https://github.com/microsoft/apm/pull/3439\n* fix(codex): admit Codex CLI 0.163.0 or later for native registration by @danielmeppiel in https://github.com/microsoft/apm/pull/3529\n* fix(install): retry transient Windows denials at staged activation (#3386) by @danielmeppiel in https://github.com/microsoft/apm/pull/3530\n* fix(install): keep files deployed to other Claude/Hermes profiles by @xronos-i-am in https://github.com/microsoft/apm/pull/3424\n* fix(install): replay locked Git-semver tag for cached subdirectory deps by @danielmeppiel in https://github.com/microsoft/apm/pull/3527\n* fix(install): refuse unmatched skills: selection before any primitive writes by @danielmeppiel in https://github.com/microsoft/apm/pull/3538\n* fix(install): reconcile a targeted package's dropped transitive dependencies by @danielmeppiel in https://github.com/microsoft/apm/pull/3528\n* fix(git): pin autocrlf=false on the uncached fallback clone and checkout by @abhishekacharya200 in https://github.com/microsoft/apm/pull/3409\n* fix(compile): ignore generated context outputs in placement counting by @danielmeppiel in https://github.com/microsoft/apm/pull/3539\n* fix(mcp): deploy MCP servers from local-path Claude plugin dependencies by @danielmeppiel in https://github.com/microsoft/apm/pull/3540\n* fix(mcp): keep v0.1 registry server version in search and show by @danielmeppiel in https://github.com/microsoft/apm/pull/3549\n* fix(lifecycle): close HTTP response published during deadline grace join by @danielmeppiel in https://github.com/microsoft/apm/pull/3548\n* fix(install.ps1): report the full staged-binary failure output by @danielmeppiel in https://github.com/microsoft/apm/pull/3533\n* docs(prompts): note Copilot harness and CLI do not load prompt files by @danielmeppiel in https://github.com/microsoft/apm/pull/3550\n* fix(audit): recognize Copilot sessionStart prompt hooks by @danielmeppiel in https://github.com/microsoft/apm/pull/3542\n* fix(lifecycle): treat non-positive script timeouts as invalid by @danielmeppiel in https://github.com/microsoft/apm/pull/3544\n* fix(plugins): read flat-shape Claude plugin .mcp.json files by @danielmeppiel in https://github.com/microsoft/apm/pull/3541\n* fix(marketplace): verify commit-SHA refs in marketplace check by @danielmeppiel in https://github.com/microsoft/apm/pull/3543\n* fix(audit): replay git deps over their declared transport by @danielmeppiel in https://github.com/microsoft/apm/pull/3531\n* fix(install): do not treat an empty skill directory as an unmanaged collision by @MohammedAlkindi in https://github.com/microsoft/apm/pull/3449\n* fix(install): keep lockfile_version in sync after carrying resolved_tag by @danielmeppiel in https://github.com/microsoft/apm/pull/3536\n* fix(lockfile,compile): create apm.lock.yaml and compiled outputs with umask-derived mode by @danielmeppiel in https://github.com/microsoft/apm/pull/3547\n* fix(deps): honor PROXY_REGISTRY_ONLY in ref and semver enumeration by @pearlatvg in https://github.com/microsoft/apm/pull/3471\n* fix(lockfile): fail closed when apm.lock.yaml is a symlink by @danielmeppiel in https://github.com/microsoft/apm/pull/3532\n* fix(adapters): prepend docker run for options-only OCI packages (#3404) by @abhishekacharya200 in https://github.com/microsoft/apm/pull/3405\n* fix(mcp): preserve declared self-defined server names containing slashes by @bodapatisaikrishna in https://github.com/microsoft/apm/pull/3493\n* fix(codex): forward ${VAR} stdio env values with env_vars instead of writing them by @abhishekacharya200 in https://github.com/microsoft/apm/pull/3406\n* docs: install APM from Scoop's default main bucket (dead scoop-apm link) by @danielmeppiel in https://github.com/microsoft/apm/pull/3517\n* fix(install): preserve skills during cold replay without deployment receipts by @sergio-sisternes-epam in https://github.com/microsoft/apm/pull/3490\n* fix(uninstall): remove packages only from the selected Claude profile by @danielmeppiel in https://github.com/microsoft/apm/pull/3555\n* fix(tests): pin LF line endings in cached Codex source-pin fixture by @danielmeppiel in https://github.com/microsoft/apm/pull/3561\n* fix(tests): allow retained lifecycle lock in generated state-machine write set by @danielmeppiel in https://github.com/microsoft/apm/pull/3566\n* fix(arch): scope lockfile-read guard to the read-only resolver by @danielmeppiel in https://github.com/microsoft/apm/pull/3568\n* fix(ci): bypass unresolvable Azure apt mirror when installing fish and zsh by @danielmeppiel in https://github.com/microsoft/apm/pull/3570\n* fix(deps): lock transitive setuptools 84.1.0 (GHSA-xmj3-9gf7-h52w) by @danielmeppiel in https://github.com/microsoft/apm/pull/3563\n* fix(antigravity): emit native rule frontmatter (string globs, always_on trigger) by @danielmeppiel in https://github.com/microsoft/apm/pull/3546\n* chore: release v0.35.1 by @danielmeppiel in https://github.com/microsoft/apm/pull/3558\n\n## New Contributors\n* @TyMick made their first contribution in https://github.com/microsoft/apm/pull/3461\n* @TyceHerrman made their first contribution in https://github.com/microsoft/apm/pull/3439\n* @xronos-i-am made their first contribution in https://github.com/microsoft/apm/pull/3424\n* @pearlatvg made their first contribution in https://github.com/microsoft/apm/pull/3471\n\n**Full Changelog**: https://github.com/microsoft/apm/compare/v0.35.0...v0.35.1","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":9}
