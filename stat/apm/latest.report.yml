ttps://github.com/microsoft/apm/pull/3156\n* fix: keep Codex MCP identity outside native settings by @Pybsama in https://github.com/microsoft/apm/pull/3157\n* fix(cli): report only verified APM build revisions by @danielmeppiel in https://github.com/microsoft/apm/pull/3280\n* fix(hooks): admit and stage hook-only Git-path packages by @danielmeppiel in https://github.com/microsoft/apm/pull/3282\n* fix(hooks): type untyped flat command handlers for Claude by @Parth-Vasave in https://github.com/microsoft/apm/pull/3153\n* Fix native Agent Plugin audit replay for Copilot targets by @bodapatisaikrishna in https://github.com/microsoft/apm/pull/3257\n* test(audit): preserve OpenCode local-bundle lifecycle coverage by @danielmeppiel in https://github.com/microsoft/apm/pull/3292\n* fix(auth): recover private files after API throttling by @danielmeppiel in https://github.com/microsoft/apm/pull/3278\n* fix(audit): preserve Grok Cloud target identity and historical checks by @danielmeppiel in https://github.com/microsoft/apm/pull/3289\n* fix(codex): preserve complete compatibility bundles through native user installs by @danielmeppiel in https://github.com/microsoft/apm/pull/3294\n* fix(lockfile): diagnose merge conflicts without automatic recovery by @lachieh in https://github.com/microsoft/apm/pull/3028\n* fix(policy): resolve marketplace object-form deps in ref-consistency check (#3220) by @Fire162 in https://github.com/microsoft/apm/pull/3221\n* fix(install): verify local content in frozen mode by @dajiaohuang in https://github.com/microsoft/apm/pull/3236\n* fix(pack): preserve and relocate plugin hook resources by @danielmeppiel in https://github.com/microsoft/apm/pull/3301\n* fix(install): include required indirect dependencies in dry-run previews by @danielmeppiel in https://github.com/microsoft/apm/pull/3302\n* fix(install): restore cold frozen plugins with verified MCP declarations by @danielmeppiel in https://github.com/microsoft/apm/pull/3305\n* fix(install): preserve frozen lock bytes and recorded native-service ownership by @danielmeppiel in https://github.com/microsoft/apm/pull/3307\n* fix(audit): preserve project scope across native Windows path spellings by @danielmeppiel in https://github.com/microsoft/apm/pull/3316\n* fix(schema): propose corrected manifest 0.1.48 contract by @danielmeppiel in https://github.com/microsoft/apm/pull/3308\n* fix(triage): prefetch and bound scheduled sweep candidates by @danielmeppiel in https://github.com/microsoft/apm/pull/3277\n* fix(install): capture acquired manifest versions on first install by @danielmeppiel in https://github.com/microsoft/apm/pull/3311\n* fix(deps): support local single-file dependencies by @danielmeppiel in https://github.com/microsoft/apm/pull/3310\n* fix(skills): preserve shared assets and deployment ownership by @danielmeppiel in https://github.com/microsoft/apm/pull/3313\n* fix(opencode): render native MCP environment references by @leninworld in https://github.com/microsoft/apm/pull/3303\n* fix(mcp): preserve conflicting native connections and verify managed updates by @danielmeppiel in https://github.com/microsoft/apm/pull/3317\n* Fix [BUG] Missing kiro prompts primitive entry by @DBVamsi in https://github.com/microsoft/apm/pull/3263\n* fix(audit): respect intentional dependency MCP omissions by @danielmeppiel in https://github.com/microsoft/apm/pull/3304\n* fix(install): preflight selected skill plans before native deployment by @danielmeppiel in https://github.com/microsoft/apm/pull/3314\n* docs: make README manifest example installable by @venkatayedidavs in https://github.com/microsoft/apm/pull/3086\n* add(deps): support consumer-root source replacements by @danielmeppiel in https://github.com/microsoft/apm/pull/3309\n* fix: preserve Windows staging failures and recovery data by @danielmeppiel in https://github.com/microsoft/apm/pull/3318\n* fix(install): retire obsolete absent dependency claims after complete reintegration by @danielmeppiel in https://github.com/microsoft/apm/pull/3315\n* fix(install): persist replacement intent after the last dependency is removed by @danielmeppiel in https://github.com/microsoft/apm/pull/3328\n* fix(audit): fail closed when an explicit --policy cannot be loaded by @danielmeppiel in https://github.com/microsoft/apm/pull/3230\n* fix(ci): restore deterministic fixtures and marketplace replay by @danielmeppiel in https://github.com/microsoft/apm/pull/3325\n* fix(mcp): preserve verified ownership across lifecycle transitions by @danielmeppiel in https://github.com/microsoft/apm/pull/3329\n* fix(ci): use canonical skill results in orchestration fixtures by @danielmeppiel in https://github.com/microsoft/apm/pull/3336\n* fix(ci): align generated skill repair with explicit overwrite consent by @danielmeppiel in https://github.com/microsoft/apm/pull/3337\n* fix(tests): restore canonical fixture contracts for CI by @danielmeppiel in https://github.com/microsoft/apm/pull/3338\n* fix(ci): shard lifecycle smoke without weakening its gate by @danielmeppiel in https://github.com/microsoft/apm/pull/3345\n* fix(install): preserve unchanged manifest requests by @danielmeppiel in https://github.com/microsoft/apm/pull/3346\n* fix(ci): isolate ratchet and scaling execution budgets by @danielmeppiel in https://github.com/microsoft/apm/pull/3347\n* fix(tests): restore MCP and update-plan CI contracts by @danielmeppiel in https://github.com/microsoft/apm/pull/3343\n* fix(install): retain trustworthy rendered skill receipts by @danielmeppiel in https://github.com/microsoft/apm/pull/3344\n* fix(tests): await parallel cache consumers before assertions by @danielmeppiel in https://github.com/microsoft/apm/pull/3352\n* fix(tests): align full-route fixtures with canonical receipt contracts by @danielmeppiel in https://github.com/microsoft/apm/pull/3353\n* chore: release v0.35.0 by @danielmeppiel in https://github.com/microsoft/apm/pull/3355\n* fix(ci): budget macOS ARM full release integration by @danielmeppiel 