urien in https://github.com/microsoft/apm/pull/3060\n* fix(cursor): comma-joined bare globs/description in .mdc frontmatter by @YGuyomar in https://github.com/microsoft/apm/pull/3011\n* fix(runtime): reject HTTP errors and bound Codex download retries by @danielmeppiel in https://github.com/microsoft/apm/pull/3111\n* fix(mcp): drop previous-transport keys on Claude server redeclaration by @edenfunf in https://github.com/microsoft/apm/pull/3041\n* fix(mcp): write env-sourced MCP headers into Codex's runtime fields by @edenfunf in https://github.com/microsoft/apm/pull/3042\n* fix(windows): resolve git.exe via shutil.which path= (PATHEXT) by @rwinkelman in https://github.com/microsoft/apm/pull/3092\n* fix(compile): discover Claude dependency memory at arbitrary installed depth by @vyrnsynx in https://github.com/microsoft/apm/pull/2952\n* fix(opencode): preserve explicit MCP enabled values by @dajiaohuang in https://github.com/microsoft/apm/pull/3102\n* fix(marketplace): resolve version tags from package remote by @modelpath-dev in https://github.com/microsoft/apm/pull/3044\n* fix(auth): preserve GitHub MCP runtime references by @dajiaohuang in https://github.com/microsoft/apm/pull/3103\n* fix(install): deploy skills through home directory aliases by @danielmeppiel in https://github.com/microsoft/apm/pull/2876\n* fix(compile): deduplicate global Claude instructions safely by @danielmeppiel in https://github.com/microsoft/apm/pull/3119\n* fix(cursor): preserve native MCP references and authored static values by @danielmeppiel in https://github.com/microsoft/apm/pull/3116\n* fix(audit): bound the deploy-tree hidden-Unicode walk to primitive directories by @lkshrk in https://github.com/microsoft/apm/pull/2962\n* docs(security): clarify insecure transport policy by @WilliamK112 in https://github.com/microsoft/apm/pull/2910\n* docs(install): correct --global local .apm/ deployment claim by @tillig in https://github.com/microsoft/apm/pull/2769\n* fix(copilot): keep Copilot modular instructions split at user-scope since supported - reverts #1619 by @kilianpaquier in https://github.com/microsoft/apm/pull/2317\n* feat(cli): add `apm auth` for git host credentials (#2788) by @sergio-sisternes-epam in https://github.com/microsoft/apm/pull/3134\n* fix(ci): restore green main CI across unit, integration and mutation lanes by @danielmeppiel in https://github.com/microsoft/apm/pull/3142\n* docs: clarify context availability after cloning by @danielmeppiel in https://github.com/microsoft/apm/pull/3144\n* chore: release v0.33.0 by @danielmeppiel in https://github.com/microsoft/apm/pull/3152\n\n## New Contributors\n* @pavelvodrazka-etnetera made their first contribution in https://github.com/microsoft/apm/pull/2918\n* @uurien made their first contribution in https://github.com/microsoft/apm/pull/3060\n* @YGuyomar made their first contribution in https://github.com/microsoft/apm/pull/3011\n* @rwinkelman made their first contribution in https://github.com/microsoft/apm/pull/3092\n* @vyrnsynx made their first contribution in https://github.com/microsoft/apm/pull/2952\n* @modelpath-dev made their first contribution in https://github.com/microsoft/apm/pull/3044\n* @kilianpaquier made their first contribution in https://github.com/microsoft/apm/pull/2317\n\n**Full Changelog**: https://github.com/microsoft/apm/compare/v0.32.0...v0.33.0","mentions_count":14}
