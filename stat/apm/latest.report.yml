efused install --mcp leaves apm.yml and .github untouched (#4759) by @danielmeppiel in https://github.com/microsoft/apm/pull/4803\n* fix(audit): name merged hook config entries matching a withheld package's hook by @danielmeppiel in https://github.com/microsoft/apm/pull/4798\n* test: patch the az bearer provider once per threaded test; track it as leakable state by @danielmeppiel in https://github.com/microsoft/apm/pull/4831\n* fix(uninstall): repair kept lock rows the way install records them (#4804) by @danielmeppiel in https://github.com/microsoft/apm/pull/4811\n* ci(perf): base-vs-new journey benchmarks on hosted runners (CPU + counts, off the shared host) by @danielmeppiel in https://github.com/microsoft/apm/pull/4834\n* fix(install): retire a native Claude plugin when apm.yml drops claude (#4744) by @danielmeppiel in https://github.com/microsoft/apm/pull/4751\n* fix(pack): refuse a Claude dependency whose installed copy is missing (#4755) by @danielmeppiel in https://github.com/microsoft/apm/pull/4824\n* test(lifecycle): observe project-scope native plugin roots and declarations (#4808) by @danielmeppiel in https://github.com/microsoft/apm/pull/4843\n* fix(native): refuse a user .gitattributes that converts byte-pinned plugin roots (#4809) by @danielmeppiel in https://github.com/microsoft/apm/pull/4842\n* fix(lockfile): parse the on-disk lockfile once on a no-op write by @danielmeppiel in https://github.com/microsoft/apm/pull/4835\n* [0.38] fix(install): install -g records user-root primitives in the user lockfile (#3772) by @danielmeppiel in https://github.com/microsoft/apm/pull/4684\n* feat(policy): apply manifest.content_types.allow to resolved packages by @danielmeppiel in https://github.com/microsoft/apm/pull/4838\n* fix(uninstall): name the executable kinds a gate retirement removes (#4567) by @danielmeppiel in https://github.com/microsoft/apm/pull/4662\n* fix(prune): preview gate-retired native plugins in --dry-run and stop on a gate check error (#4754) by @danielmeppiel in https://github.com/microsoft/apm/pull/4845\n* fix(uninstall): resolve repaired parents by exact lock key for virtual siblings (#4823) by @danielmeppiel in https://github.com/microsoft/apm/pull/4848\n* test(benchmarks): count console singleton work instead of timing it (#4857) by @danielmeppiel in https://github.com/microsoft/apm/pull/4865\n* [0.38] docs(install): name the binding a remembered receipt write needs (#4428) by @danielmeppiel in https://github.com/microsoft/apm/pull/4822\n* fix(install): lockless MCP evidence follow-ups (#4801) by @danielmeppiel in https://github.com/microsoft/apm/pull/4818\n* revert: #4802 path CheckRoot (zero measured gain on the CI bench) by @danielmeppiel in https://github.com/microsoft/apm/pull/4855\n* ci: gate rule H4, a PR closing a known-cell issue must flip the cell by @danielmeppiel in https://github.com/microsoft/apm/pull/4856\n* docs(policy): user-scope org policy is still absent in 0.38; #3703 targets 0.39 by @danielmeppiel in https://github.com/microsoft/apm/pull/4806\n* fix(lint): keep deployment_ledger.py under the 2100-line guard (main red) by @danielmeppiel in https://github.com/microsoft/apm/pull/4878\n* test: pre-load install.audit_replay so run_replay patches cannot leak (MAIN-RED FIX, #4876) by @danielmeppiel in https://github.com/microsoft/apm/pull/4884\n* ci(perf-bench): macOS and Windows runners (OS request key; Job Object CPU accounting) by @danielmeppiel in https://github.com/microsoft/apm/pull/4869\n* test(lifecycle): user-scope Claude hook reads its plugin manifest (#2824) by @danielmeppiel in https://github.com/microsoft/apm/pull/4840\n* [0.38] fix(pack): honour a package's own targets: exclusion when its cache is missing (#4850) by @danielmeppiel in https://github.com/microsoft/apm/pull/4858\n* fix(uninstall): derive kept rows' parent, depth and dev status graph-wide (#4833) by @danielmeppiel in https://github.com/microsoft/apm/pull/4870\n* [0.38] fix(install): first upgrade adopts a migrated skill dir for a target sharing it (#4813) by @danielmeppiel in https://github.com/microsoft/apm/pull/4868\n* test(lifecycle): J08/J09 follow #4005 (Claude instructions converge on AGENTS.md) by @danielmeppiel in https://github.com/microsoft/apm/pull/4915\n* ci(windows): wait for the owned profile to unload in the native symlink gate by @danielmeppiel in https://github.com/microsoft/apm/pull/4906\n* fix(audit): audit --ci accepts a clean install -g of a user-root agent with a context link (#4832) by @danielmeppiel in https://github.com/microsoft/apm/pull/4880\n* fix(mcp): announce kept MCP entries on every install path (#4861) by @danielmeppiel in https://github.com/microsoft/apm/pull/4908\n* fix(install): keep a drift edit of the project's own local outputs (#4873) by @danielmeppiel in https://github.com/microsoft/apm/pull/4892\n* test(perf-bench): journey-hunt harness: outdated/prune/audit-ci, enterprise fixtures, RTT wall and profiles by @danielmeppiel in https://github.com/microsoft/apm/pull/4907\n* fix(approve): refuse a still-denied bundle approve before writing (#4933) by @danielmeppiel in https://github.com/microsoft/apm/pull/4934\n* fix(install): keep edited hook, canvas and LSP outputs like any managed file (#4626) by @danielmeppiel in https://github.com/microsoft/apm/pull/4678\n* fix(uninstall): refuse a still-needed local dependency before any write (#4882) by @danielmeppiel in https://github.com/microsoft/apm/pull/4890\n* fix(install): name the unfetchable locked package under --frozen (#4909) by @danielmeppiel in https://github.com/microsoft/apm/pull/4912\n* chore: release v0.38.1 by @danielmeppiel in https://github.com/microsoft/apm/pull/4926\n\n\n**Full Changelog**: https://github.com/microsoft/apm/compare/v0.38.0...v0.38.1","mentions_count":1}
