act tests by @danielmeppiel in https://github.com/microsoft/apm/pull/2880\n* fix(codeql): remediate eleven sensitive-data alerts by @danielmeppiel with @Copilot in https://github.com/microsoft/apm/pull/2742\n* Fix skills subset installs for manifestless Git collections by @danielmeppiel with @Copilot in https://github.com/microsoft/apm/pull/2891\n* test: restore complete architecture guard mutation coverage by @danielmeppiel with @Copilot in https://github.com/microsoft/apm/pull/2892\n* fix(registry): exact version selectors must match published build metadata by @nadav-y in https://github.com/microsoft/apm/pull/2894\n* fix(install): fail loudly when a package deploys to no target (closes #2796) by @danielmeppiel in https://github.com/microsoft/apm/pull/2806\n* docs: Add WinGet method installation by @Gijsreyn in https://github.com/microsoft/apm/pull/2520\n* fix(deps): preserve GitLab sparse-fetch transport by @danielmeppiel in https://github.com/microsoft/apm/pull/2939\n* feat(init): onboard existing local packages without rewriting source by @danielmeppiel in https://github.com/microsoft/apm/pull/2937\n* docs: establish issue-first contribution and governance policy by @danielmeppiel in https://github.com/microsoft/apm/pull/2954\n* fix(triage): make automated recommendations advisory by @danielmeppiel in https://github.com/microsoft/apm/pull/2956\n* docs: define issue-backed roadmap and release planning by @danielmeppiel in https://github.com/microsoft/apm/pull/2959\n* fix(governance): require human scope and add neutral eligibility evidence by @danielmeppiel in https://github.com/microsoft/apm/pull/2964\n* fix(git-env): skip the HTTP header probe for non-HTTP effective URLs by @arnaudoisel in https://github.com/microsoft/apm/pull/2906\n* docs: publish the active issue-backed roadmap by @danielmeppiel in https://github.com/microsoft/apm/pull/2988\n* fix(uninstall): preserve unmanaged skills with an empty inventory by @mfroembgen in https://github.com/microsoft/apm