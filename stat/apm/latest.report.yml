pm/pull/3564\n* fix(git): pin core.symlinks=true so package hashes match across platforms by @danielmeppiel in https://github.com/microsoft/apm/pull/3545\n* feat(preflight): gate agent pushes and PRs on a local preflight receipt by @danielmeppiel in https://github.com/microsoft/apm/pull/3580\n* perf(deps): sweep raw CDN across marker probes before any anonymous Contents API call by @ShaoLOWu in https://github.com/microsoft/apm/pull/3348\n* fix(install): resolve transitive deps from the manifest this run installs by @adityaanikam in https://github.com/microsoft/apm/pull/3571\n* docs(producer): explain same-repository branch inheritance by @danielmeppiel in https://github.com/microsoft/apm/pull/3591\n* fix(ci): restore Windows post-merge suite after #3564 by @danielmeppiel in https://github.com/microsoft/apm/pull/3592\n* fix(claude): keep ${VAR} references in project .mcp.json by @Aaryan-Dadu in https://github.com/microsoft/apm/pull/3377\n* fix(build): lower the Linux binary glibc floor to 2.28 by @eraow in https://github.com/microsoft/apm/pull/3553\n* fix(deps): report the proxy archive rejection instead of a later HTTP 404 by @MohammedAlkindi in https://github.com/microsoft/apm/pull/3375\n* Revert preflight-gate hook (#3580): local preflights overload multi-agent hosts by @danielmeppiel in https://github.com/microsoft/apm/pull/3598\n* fix(cursor): deploy user-scope instructions to ~/.cursor/rules by @yahavi in https://github.com/microsoft/apm/pull/2506\n* fix(marketplace): pin plugins to a source sha by @abhishekacharya200 in https://github.com/microsoft/apm/pull/3534\n* fix(hooks): type untyped flat command handlers for Codex by @Parth-Vasave in https://github.com/microsoft/apm/pull/3385\n* feat(mcp): write native OpenCode 2 entries under mcp.servers by @RamsesJM in https://github.com/microsoft/apm/pull/3414\n* feat(auth): auth-first opt-out and TLS config inheritance for github.com (#2545) by @rgarciapariente in https://github.com/microsoft/apm/pull/2999\n* chore!: require Python 3.11 or newer (0.36.0) by @danielmeppiel in https://github.com/microsoft/apm/pull/3589\n* fix(lifecycle): keep pinned HTTP egress when only NO_PROXY is set by @bodapatisaikrishna in https://github.com/microsoft/apm/pull/3575\n* docs(adopters): list EPAM as an adopter by @sergio-sisternes-epam in https://github.com/microsoft/apm/pull/3607\n* docs(reference): add openclaw to experimental flags table by @MohammedAlkindi in https://github.com/microsoft/apm/pull/3366\n* feat(cli): add export-patch command to export local spec edits as upstream patches by @edenfunf in https://github.com/microsoft/apm/pull/2162\n* perf(compile): remove redundant work from instruction placement by @sekosen in https://github.com/microsoft/apm/pull/3379\n* feat(compile): fire a pre-compile lifecycle event before reading sources by @Ryangr0 in https://github.com/microsoft/apm/pull/3596\n* fix(mcp): name the searched registry and explain registry choice on a miss by @VedanthB in https://github.com/microsoft/apm/pull/2803\n* refactor(tests): remove test smells in unit tests by @victtorqueiroz in https://github.com/microsoft/apm/pull/3451\n* refactor(marketplace): extract ref propagation helper by @WilliamK112 in https://github.com/microsoft/apm/pull/1992\n* fix(install): omit author from auto-bootstrapped apm.yml by @danielmeppiel in https://github.com/microsoft/apm/pull/3630\n* fix(git): materialize package links from Git objects on every host by @danielmeppiel in https://github.com/microsoft/apm/pull/3603\n* docs(governance): roadmap pillars, epics and accepted-issue Horizon default by @danielmeppiel in https://github.com/microsoft/apm/pull/3632\n* test(install): assert one targeted install reconciles a dropped dependency by @danielmeppiel in https://github.com/microsoft/apm/pull/3635\n* feat(cli): derive apm mcp install forwarded options from apm install by @danielmeppiel in https://github.com/microsoft/apm/pull/3633\n* fix(hooks): anchor POSIX user-scope hook commands to $HOME by @Bronyal-lzx in https://github.com/microsoft/apm/pull/2944\n* test(marketplace): cover registered ref install flow by @abhinavgautam01 in https://github.com/microsoft/apm/pull/1994\n* fix(registry): keep pre-releases out of stable semver ranges by @danielmeppiel in https://github.com/microsoft/apm/pull/3601\n* fix(dashboard): allowlist URL schemes in rendered markdown by @danielmeppiel in https://github.com/microsoft/apm/pull/3637\n* chore(devcontainer): retire the unpublished Dev Container Feature by @danielmeppiel in https://github.com/microsoft/apm/pull/3642\n* fix(audit): replay root .apm hooks that record no local files by @danielmeppiel in https://github.com/microsoft/apm/pull/3600\n* fix(deps): invalidate the manifest parse cache when apm.yml is rewritten, so re-downloads re-stamp by @McNultyyy in https://github.com/microsoft/apm/pull/2627\n* fix(bundle): keep a directory source package out of the bundle path by @danielmeppiel in https://github.com/microsoft/apm/pull/3604\n* fix(update): adopt unchanged locked skills when receipts are missing by @danielmeppiel in https://github.com/microsoft/apm/pull/3638\n* feat(marketplace): add package category option by @WilliamK112 in https://github.com/microsoft/apm/pull/2637\n* docs(governance): use validated filters for the Epics and Enterprise views by @danielmeppiel in https://github.com/microsoft/apm/pull/3639\n* chore(triage): migrate automation from theme/* to pillar/* labels by @danielmeppiel in https://github.com/microsoft/apm/pull/3636\n* refactor(cleanup): remove dead workflow package and deps aggregator by @danielmeppiel in https://github.com/microsoft/apm/pull/3644\n* [codex] Port universal applyTo to Cursor alwaysApply by @WilliamK112 in https://github.com/microsoft/apm/pull/2030\n* feat(view): add read-only `apm view --file PATH` reverse provenance by @danielmeppiel in https://github.com/microsoft/apm/pull/3608\n* feat(autopilot): accept issues with a declared scope by @sergio-sisternes-epam in https://github.com/microsoft/apm/pull/3105\n* fix(deps): agree with prune on bundled skills after repo-to-subdirectory switch by @danielmeppiel in https://github.com/microsoft/apm/pull/3612\n* fix(cli): derive consistency-checker surface from apm --help and fit root summaries by @danielmeppiel in https://github.com/microsoft/apm/pull/3643\n* fix(pack): use the apm.yml version in the bundled plugin.json by @abhishekacharya200 in https://github.com/microsoft/apm/pull/3408\n* feat(init): add metadata flags for non-interactive project setup by @atulya-singh in https://github.com/microsoft/apm/pull/2231\n* fix: match TLS failure hint to the selected trust mode by @aryansk in https://github.com/microsoft/apm/pull/2602\n* fix(cache): clone SSH-declared non-GitHub deps over SSH in the persistent cache by @danielmeppiel in https://github.com/microsoft/apm/pull/3640\n* fix(codex): resolve package-relative links in converted agent instructions by @danielmeppiel in https://github.com/microsoft/apm/pull/3611\n* docs(agents): document per-harness model values workarounds by @danielmeppiel in https://github.com/microsoft/apm/pull/3645\n* fix(cache): retry incomplete promisor checkouts with credentials (#3071) by @danielmeppiel in https://github.com/microsoft/apm/pull/3602\n* feat(install): carry the source licence with subdirectory packages by @danielmeppiel in https://github.com/microsoft/apm/pull/3646\n* fix(cli): shorten apm view summary so root help is not truncated by @danielmeppiel in https://github.com/microsoft/apm/pull/3651\n* fix(git): pin core.eol=lf so text=auto package hashes match across platforms by @danielmeppiel in https://github.com/microsoft/apm/pull/3599\n* Add Grupo Universal to adopters by @gthen95 in https://github.com/microsoft/apm/pull/3647\n* fix(codex): warn on Claude model ids in compiled Codex agents (supersedes #3481, closes #3477) by @danielmeppiel in https://github.com/microsoft/apm/pull/3650\n* feat(policy): walk GitLab subgroups for org policy discovery (#2753) by @rrazvd in https://github.com/microsoft/apm/pull/2933\n* fix(policy): judge the declared constraint, accept package release tags (supersedes #3381) by @danielmeppiel in https://github.com/microsoft/apm/pull/3652\n* fix(scope): make APM_HOME the single root for APM-owned user state by @danielmeppiel in https://github.com/microsoft/apm/pull/3614\n* feat(marketplace): load live local catalogs directly from apm.yml by @Nadeesha-D-Shalom in https://github.com/microsoft/apm/pull/3367\n* fix(install): decode Git output as UTF-8 regardless of Windows locale by @danielmeppiel in https://github.com/microsoft/apm/pull/3626\n* fix(autopilot): align worker and PR body contracts by @sergio-sisternes-epam in https://github.com/microsoft/apm/pull/3419\n* fix(install): name native target files a failed install leaves on disk by @danielmeppiel in https://github.com/microsoft/apm/pull/3641\n* feat(hooks)!: retire filename hook routing with safe migration by @danielmeppiel in https://github.com/microsoft/apm/pull/3613\n* feat(policy): host-qualified dependency allow/deny patterns by @danielmeppiel in https://github.com/microsoft/apm/pull/3606\n* fix(targets): honor CODEX_HOME for Codex user-scope writes (supersedes #3491, closes #3483) by @danielmeppiel in https://github.com/microsoft/apm/pull/3653\n* fix(git): check out out-of-cone link targets with Git's own checkout by @danielmeppiel in https://github.com/microsoft/apm/pull/3673\n* feat(marketplace): select a catalog in a repo with marketplace add --path by @danielmeppiel in https://github.com/microsoft/apm/pull/3628\n* fix(tests): use an OS-absolute APM_HOME in the scripts log path test by @danielmeppiel in https://github.com/microsoft/apm/pull/3707\n* fix(build): keep the host libgcc_s out of the Linux arm64 binary by @danielmeppiel in https://github.com/microsoft/apm/pull/3708\n* feat(marketplace): declare marketplaces in the user manifest, reconciled by apm install -g by @danielmeppiel in https://github.com/microsoft/apm/pull/3610\n* fix: 0.36.0 red-team regression sweep (export-patch, view --file, lockfile symlink, audit replay, targeted install, MCP cleanup) by @danielmeppiel in https://github.com/microsoft/apm/pull/3672\n* fix: 0.36.0 red-team round 2 (MCP config safety, user-file collisions, graph reconciliation, approvals, manifest corner cases) by @danielmeppiel in https://github.com/microsoft/apm/pull/3709\n* fix: 0.36.0 hardening of trust boundaries for credentials, deploy destinations, bundles and MCP consent by @danielmeppiel in https://github.com/microsoft/apm/pull/3716\n* fix(install): bundle installs for compile-only targets pass audit; skip Codex Markdown agents (#3705, #3706) by @danielmeppiel in https://github.com/microsoft/apm/pull/3717\n* test(lifecycle): validate command-line packages without the github.com API (#3649) by @danielmeppiel in https://github.com/microsoft/apm/pull/3719\n* fix(tests): restore release-gate lanes for 0.36.0 by @danielmeppiel in https://github.com/microsoft/apm/pull/3723\n* Update ADOPTERS.md by @pewpewpotato in https://github.com/microsoft/apm/pull/3755\n* docs(adopters): add Supermodular by @ricardofiel in https://github.com/microsoft/apm/pull/3757\n* chore: release v0.36.0 by @danielmeppiel in https://github.com/microsoft/apm/pull/3759\n* fix(tests): restore arm64 integration lanes for 0.36.0 by @danielmeppiel in https://github.com/microsoft/apm/pull/3766\n* chore: move internal agents to Claude Opus 5.5 by @danielmeppiel in https://github.com/microsoft/apm/pull/3780\n* ci(release): shard Linux integration, slim macOS, promote verified tags by @danielmeppiel in https://github.com/microsoft/apm/pull/3771\n* docs: teach your agent APM with the apm-guide package by @danielmeppiel in https://github.com/microsoft/apm/pull/3776\n* fix(tests): compare exact spellings in the case-sensitive fake reader by @danielmeppiel in https://github.com/microsoft/apm/pull/3787\n\n## New Contributors\n* @ShaoLOWu made their first contribution in http