piel in https://github.com/microsoft/apm/pull/3793\n* fix(init): stop defaulting scaffolded plugin licenses to MIT by @danielmeppiel in https://github.com/microsoft/apm/pull/3799\n* fix(mcp): render remote transports per harness and heal retired shapes by @danielmeppiel in https://github.com/microsoft/apm/pull/3789\n* fix(registry): follow redirects only within the configured registry origin by @danielmeppiel in https://github.com/microsoft/apm/pull/3785\n* fix(audit): audit --ci after update -g no longer demands empty ~/.apm/apm_modules by @danielmeppiel in https://github.com/microsoft/apm/pull/3797\n* fix(deps): parse repository names ending in .git characters by @danielmeppiel in https://github.com/microsoft/apm/pull/3767\n* test(mcp): make removal-failure injection platform-independent by @danielmeppiel in https://github.com/microsoft/apm/pull/3804\n* fix(targets): one owner for harness user roots; honor COPILOT_HOME (#3745) by @danielmeppiel in https://github.com/microsoft/apm/pull/3782\n* fix(policy): judge compilation-target on the canonical target set by @danielmeppiel in https://github.com/microsoft/apm/pull/3774\n* fix(integration): render, then adopt for every agent writer (#3722) by @MohammedAlkindi in https://github.com/microsoft/apm/pull/3743\n* fix(auth): route every Azure DevOps egress through one auth chain owner by @danielmeppiel in https://github.com/microsoft/apm/pull/3790\n* fix(lsp): OpenCode LSP target; refuse the LSP capability gap before any write (#3727) by @gideruette in https://github.com/microsoft/apm/pull/3730\n* test(targets): use platform-absolute user-root paths in tests by @danielmeppiel in https://github.com/microsoft/apm/pull/3815\n* chore(docs-index): cover every docs page in the corpus map by @danielmeppiel in https://github.com/microsoft/apm/pull/3802\n* fix(docs-site): stop redirecting the live auth and migration pages by @danielmeppiel in https://github.com/microsoft/apm/pull/3803\n* docs(cli-reference): fix drifted flags, exit codes, anchors and sample output by @danielmeppiel in https://github.com/microsoft/apm/pull/3805\n* docs(consumer): fix phantom commands, wrong example package and stale outputs by @danielmeppiel in https://github.com/microsoft/apm/pull/3806\n* docs(enterprise): correct code-execution, baseline-count and policy-key claims by @danielmeppiel in https://github.com/microsoft/apm/pull/3809\n* docs(concepts): describe compile and user-scope deploys as the CLI does them by @danielmeppiel in https://github.com/microsoft/apm/pull/3810\n* docs(integrations): fix target removal recipe, MCP paths and check names by @danielmeppiel in https://github.com/microsoft/apm/pull/3811\n* docs(troubleshooting): quote real error messages and fix wrong remediations by @danielmeppiel in https://github.com/microsoft/apm/pull/3812\n* refactor(targets): route every manifest target reader through one owner by @danielmeppiel in https://github.com/microsoft/apm/pull/3791\n* fix(hermes): keep cwd, transport sse and extra keys in Hermes MCP config by @danielmeppiel in https://github.com/microsoft/apm/pull/3807\n* fix(uninstall): keep surviving bundles' skills: selection (#3760) by @danielmeppiel in https://github.com/microsoft/apm/pull/3784\n* fix(deps): merge diamond skill and target selections through one owner (#3735) by @danielmeppiel in https://github.com/microsoft/apm/pull/3786\n* arch(auth): guard authenticated HTTP egress and credential headers by @danielmeppiel in https://github.com/microsoft/apm/pull/3823\n* test(deps): keep git lookup env in GitLab routing tests by @danielmeppiel in https://github.com/microsoft/apm/pull/3828\n* chore: release v0.36.1 by @danielmeppiel in https://github.com/microsoft/apm/pull/3827\n\n## New Contributors\n* @gideruette made their first contribution in https://github.com/microsoft/apm/pull/3730\n\n**Full Changelog**: https://github.com/microsoft/apm/compare/v0.36.0...v0.36.1","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
