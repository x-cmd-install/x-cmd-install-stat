ploaded","size":5987270,"digest":null,"download_count":21,"created_at":"2024-08-02T16:42:38Z","updated_at":"2024-08-02T16:42:39Z"},{"id":183485870,"node_id":"RA_kwDOLnOhHM4K78Wu","name":"prs_1.0.0_darwin_arm64.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5654089,"digest":null,"download_count":198,"created_at":"2024-08-02T16:42:39Z","updated_at":"2024-08-02T16:42:40Z"},{"id":183485867,"node_id":"RA_kwDOLnOhHM4K78Wr","name":"prs_1.0.0_linux_386.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5441999,"digest":null,"download_count":11,"created_at":"2024-08-02T16:42:38Z","updated_at":"2024-08-02T16:42:39Z"},{"id":183485865,"node_id":"RA_kwDOLnOhHM4K78Wp","name":"prs_1.0.0_linux_amd64.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5887038,"digest":null,"download_count":513,"created_at":"2024-08-02T16:42:38Z","updated_at":"2024-08-02T16:42:39Z"},{"id":183485866,"node_id":"RA_kwDOLnOhHM4K78Wq","name":"prs_1.0.0_linux_arm64.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5415510,"digest":null,"download_count":11,"created_at":"2024-08-02T16:42:38Z","updated_at":"2024-08-02T16:42:39Z"}],"body":"prs `v1.0.0` \ud83d\ude80\r\n\r\nThe biggest feature in this release is the ability to search for pull requests based on a query (eg. `type:pr repo:neovim/neovim state:open label:lua linked:issue`).\r\n\r\nThere is also the addition of the \"PR Details View\", which shows a bunch of information related to a PR, eg. metadata, description, issues referenced, files changed, commits, comments, etc.\r\n\r\nAll Changes \r\n---\r\n\r\n- \ud83c\udd95 - a new feature\r\n- \ud83d\udd04 - change in behavior\r\n- \u274c - removal of a functionality\r\n\r\n---\r\n\r\n- \ud83c\udd95 Searching PRs based on user provided queries (called **\"query mode\"**)\r\n- \ud83c\udd95 \"PR Details view\"\r\n\t<img width=\"1920\" alt=\"prs-4\" src=\"https://github.com/user-attachments/assets/a63525de-0a73-4e16-af37-29478c0cebe8\">\r\n\t<img width=\"1920\" alt=\"prs-6\" src=\"https://github.com/user-attachments/assets/01eb6026-1ee0-491f-a491-2f1193c31846\">\r\n- \ud83d\udd04 Better rendering of review comments and diffs\r\n- \ud83d\udd04 Better navigation for review comments view\r\n- \ud83d\udd04 Better configuration management (run `prs --help` for details)\r\n- \ud83c\udd95 Layout resizing on terminal window changes\r\n- \u274c `--mode=author` (can be done via prs -q `type:pr author:@me state:open`)\r\n- \u274c `--mode=reviewer` (can be done via prs -q `type:pr user-review-requested:@me state:open`)\r\n- \u274c `diff-pager` as a configuration property from the config file (this can be done via `GH_PAGER='blah' prs`)\r\n\r\n## Changelog\r\n* 7fed553f84808d553a96be61a53995bb53d028b7 build: dependency upgrades\r\n* f6554b7d920c9cecc34db37f450efadf30dee8a5 build: upgrade to go 1.22.5\r\n* 21e895332706b2e7b332ef35a852a78a5171cdb0 chore(deps): bump github.com/charmbracelet/bubbletea from 0.26.5 to 0.26.6 (#2)\r\n* 54512b605ddf4ef7c9986346cd705d46dfe55a55 chore: remove cosign.pub\r\n* 216a78b0bd4fc57130aeb67f50881c0d934eccf4 feat: add pr details pane (#8)\r\n* 2d71d5699e80add9baa81fe9299a480873729de5 feat: allow filtering via user provided query (#7)\r\n* c90200b37751b4cce4f296ac58d3b0532f6a61a7 feat: better config management (#11)\r\n* 3f1fb4bffa95ec8774e60f2f55cb9e86420843e1 feat: diffs render in color (#6)\r\n* 08f12a04e5b53c5a155d8e88ecb6d475397dd56b feat: lists react to terminal window resizing\r\n* 106ffaa641cee330ac488df5cafa30cc54d016cf fix: hidden pr status in list\r\n* ebdaab5736ceff52fb0faeb0c469f9948afbcafa refactor: remove styles from model; cleanup\r\n\r\n"}
