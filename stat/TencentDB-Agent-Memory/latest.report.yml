{"id":424329902,"author":{"login":"YUAN1GUI","id":42606224,"node_id":"MDQ6VXNlcjQyNjA2MjI0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR7zWt84ZSsKu","tag_name":"v2.0.3","target_commitish":"feat/server_team","name":"v2.0.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-26T11:36:37Z","updated_at":"2026-10-26T14:09:03Z","published_at":"2026-10-26T14:09:03Z","assets":[],"body":"## [2.0.3] - 2026-10-26\r\n\r\nv2.0.3 发布，相比 v2.0.3-beta.1 新增会话默认绑定与 Wiki 富文档，并把未单独配置超时的上游等待时间从 10 分钟改为 1 小时。同时修复 DeepSeek Harness 辅助接口、历史记忆时间格式、安装脚本、面板交互、Knowledge 启动，以及代理在 Redis 中断后不能自行恢复的问题。\r\n\r\n> **产品定位**：让 Agent 的经验、文档、代码沉淀成可复用资产，让下一位 Agent\r\n> 直接读档。详见 [README_CN.md](./README_CN.md)。\r\n\r\n### 🔁 会话默认绑定\r\n\r\n- 用户可为自己保存 Team、Agent、Task 的默认组合。新会话会直接使用该组合，不再每次弹出选择\r\n- 未设置时仍走原来的选择流程；默认组合失效时自动回到原流程，并说明原因\r\n- 可在会话中锁定或解锁该默认组合，避免后续会话被意外改掉\r\n\r\n### 📄 Wiki 富文档\r\n\r\n- Wiki 新增 Word、Excel、PowerPoint、PDF 等富文档的导入、预览和内容抽取\r\n- 原有 Markdown、文本和 HTML 导入保持可用；修复 Markdown 粘贴在部分情况下导入失败的问题\r\n\r\n### ⏱️ 长回复不再被提前截断\r\n\r\n- 未单独配置超时时，上游等待时间由 10 分钟改为 1 小时；已填写 `forwardTimeoutMs` 的配置保持不变\r\n- 流式回复连续 60 秒没有新内容时只记录告警，不再因此中断\r\n\r\n### 🐛 修复\r\n\r\n- 修复 DeepSeek Harness 的 token 计数、embeddings 等辅助接口返回 404 的问题\r\n- 修复部分历史记忆因时间格式异常而无法生成 L1 记忆的问题\r\n- 修复 macOS 上一键安装脚本遇到中文标点时退出的问题\r\n- 修复面板拖拽结束后鼠标样式和文本选择未恢复的问题\r\n- 修复面板标签页关闭键无法用键盘激活的问题\r\n- 修复生成的 User Key 复制失败时没有提示的问题\r\n- 修复 Knowledge 服务因 OpenTelemetry 依赖版本漂移而无法启动的问题\r\n- 修复代理在 Redis 中断后不能自行恢复、必须重启进程的问题。短暂中断仍短暂排队；时间稍长则立即降级，不把请求拖住"}
