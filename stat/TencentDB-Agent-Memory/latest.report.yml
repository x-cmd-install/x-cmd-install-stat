{"id":407841951,"author":{"login":"Maxwell-Code07","id":95488710,"node_id":"U_kgDOBbEKxg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR7zWt84YTyyf","tag_name":"v2.0.2","target_commitish":"feat/server_team","name":"v2.0.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-09T07:39:57Z","updated_at":"2026-10-09T11:19:45Z","published_at":"2026-10-09T11:19:45Z","assets":[],"body":"## [2.0.2] - 2026-10-09\r\n\r\n> **\u4ea7\u54c1\u5b9a\u4f4d**\uff1a\u8ba9 Agent \u7684\u7ecf\u9a8c\u3001\u6587\u6863\u3001\u4ee3\u7801\u6c89\u6dc0\u6210\u53ef\u590d\u7528\u8d44\u4ea7\uff0c\u8ba9\u4e0b\u4e00\u4f4d Agent\r\n> \u76f4\u63a5\u8bfb\u6863\u3002\u8be6\u89c1 [README_CN.md](./README_CN.md)\u3002\r\n\r\n### \ud83d\uddc4\ufe0f \u5b58\u50a8\u540e\u7aef\u53ef\u6269\u5c55 \u00b7 \u652f\u6301 MongoDB\r\n\r\n\u56e2\u961f\u8bb0\u5fc6\u4e0d\u518d\u7ed1\u5b9a\u5355\u4e00\u6570\u636e\u5e95\u5ea7\uff0cMongoDB \u540e\u7aef\u80fd\u529b\u8fdb\u4e00\u6b65\u8865\u5168\uff1a\r\n\r\n- \u65b0\u589e memory-prompt \u4e0e generation-ref \u4e24\u7c7b\u5b58\u50a8\uff0c\u8986\u76d6\u66f4\u591a\u8bb0\u5fc6\u6570\u636e\u7ed3\u6784\r\n- \u4e00\u952e\u5165\u53e3 `./start-all-mongo.sh` \u4f1a\u628a `STORE_MODE` \u6301\u4e45\u5316\u5199\u5165 `.env`\uff0c\u540e\u7eed\u542f\u52a8\r\n  \u4fdd\u6301\u540c\u4e00\u540e\u7aef\uff0c\u4e0d\u518d\u6bcf\u6b21\u91cd\u590d\u914d\u7f6e\r\n- \u4fee\u590d\u7d22\u5f15\u51b2\u7a81\u573a\u666f\u7684\u81ea\u6108\u80fd\u529b\uff0c\u91cd\u590d\u7684\u9ed8\u8ba4/\u62bd\u53d6\u8bb0\u5f55\u4e0d\u518d\u5bfc\u81f4\u542f\u52a8\u62a5\u9519\r\n\r\n### \ud83d\udd00 \u66f4\u591a\u5ba2\u6237\u7aef\u63a5\u5165\r\n\r\n- **OpenCode** \u65b0\u589e\u5b98\u65b9 Memory adapter \u914d\u7f6e\u5305\uff08\u542b `opencode.json` \u4e0e\u63a5\u5165\u6587\u6863\uff09\uff0c\u6309\u8bf4\u660e\u914d\u7f6e\u5373\u53ef\u63a5\u5165\uff0c\u65e0\u9700\u7f16\u5199\u63d2\u4ef6\u4ee3\u7801\r\n- **OpenCode** \u652f\u6301 2.0 \u7684 v2 provider \u914d\u7f6e\u7ed3\u6784\uff0c\u65b0\u7248\u5ba2\u6237\u7aef\u53ef\u76f4\u63a5\u590d\u7528\u5b98\u65b9 `opencode.v2.json`\r\n- **DeepSeek Harness** \u65b0\u589e dsh \u684c\u9762\u7aef\u9002\u914d\uff0c\u914d\u7f6e\u65b9\u5f0f\u53ef\u53c2\u8003 `./agents/dsh/README.md` \u4e2d 1.6 \u7684\u90e8\u5206\r\n- \u65b0\u589e **Pi** \u5ba2\u6237\u7aef\u63a5\u5165\uff08\u7c7b\u4f3c Codex \u7684 AI Agent \u5ba2\u6237\u7aef\uff0c\u8d70 OpenAI Chat \u534f\u8bae\uff09\r\n\r\n### \ud83e\udde0 \u5916\u90e8\u6e90\u5bfc\u5165\uff08Wiki / \u4ee3\u7801 / \u4efb\u52a1\uff09\r\n\r\n- \u65b0\u589e\u4ece\u5916\u90e8\u4efb\u52a1\u7ba1\u7406\u7cfb\u7edf\u5bfc\u5165 Task \u7684\u80fd\u529b\uff0c\u4efb\u52a1\u5361\u7247\u76f4\u63a5\u5c55\u793a\u6765\u6e90\u3001\u652f\u6301 ID \u590d\u5236\u4e0e\u5206\u9875\r\n- \u65b0\u589e\u5916\u90e8\u4ee3\u7801\u6e90\uff08\u79c1\u6709\u4ed3\uff09\u6ce8\u518c\u4e0e\u51ed\u636e\u9694\u79bb\uff0c\u5404\u56e2\u961f\u6301\u6709\u72ec\u7acb\u51ed\u636e\u3001\u4e92\u4e0d\u53ef\u89c1\r\n- \u65b0\u589e Wiki \u5916\u90e8\u6765\u6e90\u5bfc\u5165\uff0c\u4e0e\u4ee3\u7801\u6e90\u3001\u4efb\u52a1\u6e90\u4e00\u8d77\u8865\u9f50\u5916\u90e8\u8d44\u4ea7\u5bfc\u5165\u94fe\u8def\r\n\r\n### \ud83e\uddf0 \u6280\u80fd\uff08Skill\uff09\u4f53\u9a8c\u4f18\u5316\r\n\r\n- \u51b7\u542f\u52a8\u6279\u91cf\u6280\u80fd\u62bd\u53d6\u65b0\u589e\u4e25\u683c\u6a21\u5f0f\uff0c\u62bd\u53d6\u8d28\u91cf\u66f4\u53ef\u63a7\r\n- \u6280\u80fd\u62bd\u53d6\u81ea\u52a8\u8ddf\u968f\u7528\u6237\u8bed\u8a00\uff0c\u751f\u6210\u5185\u5bb9\u66f4\u8d34\u5408\u4f7f\u7528\u4e60\u60ef\r\n- \u6280\u80fd\u5217\u8868\u652f\u6301\u6309\u4f7f\u7528\u6d3b\u8dc3\u5ea6\u6392\u5e8f\uff0c\u9ad8\u9891\u6280\u80fd\u66f4\u5bb9\u6613\u88ab\u627e\u5230\r\n\r\n### \ud83c\udf9b\ufe0f Memory Hub \u9762\u677f\r\n\r\n- \u4efb\u52a1\u5361\u7247\u652f\u6301\u6765\u6e90\u5c55\u793a\u3001ID \u590d\u5236\u4e0e\u5206\u9875\u4f18\u5316\uff0c\u6279\u91cf\u5bfc\u5165\u4ea4\u4e92\u66f4\u987a\u7545\r\n- \u624b\u52a8\u5237\u65b0\u65f6\u81ea\u52a8\u91cd\u7f6e\u65f6\u95f4\u7b5b\u9009\uff0c\u65b0\u4ea7\u751f\u7684\u8bb0\u5fc6\u80fd\u5373\u65f6\u770b\u5230\r\n\r\n### \ud83d\udd04 \u4f1a\u8bdd\u4e0e\u63a5\u5165\u4f53\u9a8c\r\n\r\n- \u4f1a\u8bdd\u5f15\u5bfc\u5728\u66f4\u591a\u5ba2\u6237\u7aef\u4e0b\u66f4\u7a33\u5b9a\uff1a\u81ea\u52a8\u9009\u4e2d\u552f\u4e00 Agent\u3001\u8d44\u4ea7\u786e\u8ba4\u66f4\u7cbe\u51c6\u3001\u9884\u8bbe\u5931\u8d25\u65f6\r\n  \u81ea\u52a8\u7ed5\u8fc7\u800c\u975e\u5361\u4f4f\r\n- \u4fee\u590d WorkBuddy \u5e76\u884c\u5b50\u4ee3\u7406\u53cd\u590d\u5f39\u7a97\u7684\u95ee\u9898\uff0c\u4f1a\u8bdd\u5f52\u4e00\u66f4\u7a33\u5065\r\n- \u4fee\u590d\u591a\u79cd\u5ba2\u6237\u7aef\u4e0b\u8bb0\u5fc6\u547d\u4ee4\u3001\u5de5\u5177\u7ed3\u679c\u6c61\u67d3\u3001\u5386\u53f2\u6d88\u606f\u91cd\u590d\u7b49\u5f71\u54cd\u4f53\u9a8c\u7684\u95ee\u9898\r\n\r\n### \ud83d\udc1b \u4fee\u590d\r\n\r\n- \u4fee\u590d\u65e0 embedding \u573a\u666f\u4e0b BM25 \u53ec\u56de\u5f02\u5e38\u3001L0 \u5de5\u5177\u7ed3\u679c\u6c61\u67d3\u4e0e\u539f\u6587\u5c55\u793a\u95ee\u9898\r\n- \u4fee\u590d\u8bb0\u5fc6\u53ec\u56de\u4e3a\u7a7a\u3001\u5386\u53f2\u6d88\u606f\u91cd\u590d\u3001\u591a\u56e2\u961f\u5207\u6362\u5217\u8868\u622a\u65ad\u7b49\u95ee\u9898\r\n- \u4fee\u590d Claude Code \u7684 AGENTS.md \u6307\u4ee4\u4e22\u5931\u7b49\u95ee\u9898\r\n- \u4fee\u590d\u90e8\u7f72\u811a\u672c\u5728\u90e8\u5206\u73af\u5883\u4e0b\u7684\u517c\u5bb9\u6027\u95ee\u9898\r\n\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
