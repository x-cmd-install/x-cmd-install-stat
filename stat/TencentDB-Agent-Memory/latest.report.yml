{"id":376256490,"author":{"login":"Maxwell-Code07","id":95488710,"node_id":"U_kgDOBbEKxg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR7zWt84WbTfq","tag_name":"v2.0.1","target_commitish":"feat/server_team","name":"v2.0.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-25T03:24:07Z","updated_at":"2026-08-25T08:37:36Z","published_at":"2026-08-25T08:37:36Z","assets":[],"body":"## [2.0.1] - 2026-08-25\r\n\r\n> **\u4ea7\u54c1\u5b9a\u4f4d**\uff1a\u8ba9 Agent \u7684\u7ecf\u9a8c\u3001\u6587\u6863\u3001\u4ee3\u7801\u6c89\u6dc0\u6210\u53ef\u590d\u7528\u8d44\u4ea7\uff0c\u8ba9\u4e0b\u4e00\u4f4d Agent\r\n> \u76f4\u63a5\u8bfb\u6863\u3002\u8be6\u89c1 [README_CN.md](./README_CN.md)\u3002\r\n\r\n### \ud83d\ude80 \u652f\u6301\u66f4\u591a Agent \u5ba2\u6237\u7aef\r\n\r\n\u73b0\u5728\u65e0\u8bba\u4f60\u7528\u54ea\u6b3e coding agent\uff0c\u90fd\u80fd\u76f4\u63a5\u6302\u4e0a\u56e2\u961f\u8bb0\u5fc6\uff1a\r\n\r\n- \u65b0\u589e **OpenCode** \u5ba2\u6237\u7aef\u63a5\u5165\r\n- \u65b0\u589e **DeepSeek Harness (dsh)** \u63a5\u5165 \u2014\u2014 DeepSeek \u5b98\u65b9 agent harness \u7684\r\n  Web UI \u4f1a\u8bdd\u53ef\u76f4\u63a5\u63a5\u5165 Proxy\uff0c\u81ea\u52a8\u83b7\u5f97\u56e2\u961f\u8bb0\u5fc6 / skill / \u77e5\u8bc6\u6ce8\u5165\r\n- \u65b0\u589e **Codex CLI** \u63a5\u5165\r\n- \u65b0\u589e **WorkBuddy** \u5ba2\u6237\u7aef\u63a5\u5165\uff0c\u5f00\u7bb1\u5373\u7528\r\n- \u591a\u6b3e\u5ba2\u6237\u7aef\u7684\u9996\u6b21\u5f15\u5bfc\u4e0e\u91cd\u7f6e\u4f53\u9a8c\u4fdd\u6301\u4e00\u81f4\uff0c\u5207\u6362\u66f4\u987a\u7545\r\n\r\n### \ud83e\udd16 \u4f1a\u8bdd\u5185\u76f4\u63a5\u4e0b\u6307\u4ee4\r\n\r\n\u4e0d\u7528\u5207\u5230\u9762\u677f\uff0c\u5728\u5bf9\u8bdd\u91cc\u5c31\u80fd\u5b8c\u6210\u5e38\u7528\u64cd\u4f5c\uff1a\r\n\r\n- \u4f1a\u8bdd\u4e2d\u9014\u4e00\u952e\u91cd\u7f6e\u7ed1\u5b9a\uff08\u6362\u56e2\u961f / \u6362 Agent / \u6362\u4efb\u52a1\uff09\r\n- \u5bf9\u8bdd\u5185\u76f4\u63a5\u521b\u5efa / \u66f4\u65b0\u4efb\u52a1\r\n- \u6307\u4ee4\u54cd\u5e94\u66f4\u5feb\uff0c\u51cf\u5c11\u7b49\u5f85\r\n\r\n### \ud83e\udde0 \u51b7\u542f\u52a8\u5f00\u7bb1\u5373\u7528\r\n\r\n- \u521b\u5efa\u56e2\u961f\u6216\u7528\u6237\u5373\u81ea\u52a8\u751f\u6210\u9ed8\u8ba4 Agent\uff0c\u65e0\u9700\u624b\u5de5\u914d\u7f6e\r\n- \u7ba1\u7406\u5458\u53ef\u81ea\u5b9a\u4e49\u9ed8\u8ba4 Agent \u6a21\u677f\uff0c\u65b0\u7528\u6237\u51b7\u542f\u52a8\u81ea\u52a8\u5957\u7528\r\n- \u652f\u6301\u4ece IDE \u91cc\u5df2\u6709\u7684 Agent \u4e00\u952e\u5bfc\u5165\u8d44\u4ea7\uff0c\u5feb\u901f\u8d77\u6b65\r\n- \u63a5\u5165\u540e\u9ed8\u8ba4\u7ed1\u5b9a\u4efb\u52a1\uff0c\u5373\u5f00\u5373\u7528\r\n\r\n### \ud83d\udd04 \u4f1a\u8bdd\u7ed1\u5b9a\u66f4\u7a33\u5b9a\r\n\r\n- \u4f1a\u8bdd\u7ed1\u5b9a\u6301\u4e45\u5316\u4fdd\u5b58\uff0c\u91cd\u542f\u4e0d\u4e22\u5931\r\n- \u5207\u6362 Agent \u540e\u8bb0\u5fc6\u4e0e\u6280\u80fd\u6b63\u786e\u8ddf\u968f\u5207\u6362\uff0c\u4e0d\u518d\u4e32\u573a\r\n- \u4fee\u590d\u90e8\u5206\u5ba2\u6237\u7aef\u5386\u53f2\u56de\u653e\u88ab\u8bef\u5224\u7684\u95ee\u9898\r\n\r\n### \ud83e\uddf0 \u6280\u80fd\uff08Skill\uff09\u4f53\u9a8c\u5347\u7ea7\r\n\r\n- \u4f1a\u8bdd\u91cc\u65b0\u5efa\u7684\u6280\u80fd\u7acb\u5373\u53ef\u88ab\u68c0\u7d22\u5230\uff0c\u4e0d\u518d\u6709\"\u641c\u7d22\u76f2\u533a\"\r\n- \u6062\u590d\u6280\u80fd ID \u7684\u5c55\u793a\u4e0e\u4e00\u952e\u590d\u5236\r\n- \u6280\u80fd\u652f\u6301\u5728\u7ebf\u7f16\u8f91\r\n- \u65b0\u589e\u63a5\u5165\u5411\u5bfc\u6280\u80fd\uff1a\u8ddf\u7740\u5f15\u5bfc\u4e00\u6b65\u6b65\u914d\u7f6e\uff0c\u6216\u4e00\u6761\u547d\u4ee4\u81ea\u52a8\u5b8c\u6210 Proxy \u63a5\u5165\r\n\r\n### \ud83c\udf9b\ufe0f Memory Hub \u9762\u677f\r\n\r\n- \u5168\u65b0\u767b\u5f55\u9875\uff0c\u52a0\u5165\u70b9\u9635\u6ce2\u7eb9\u52a8\u6548\r\n- \u56e2\u961f\u7f16\u8f91 / \u5220\u9664\u5165\u53e3\u6574\u5408\u5230\u56e2\u961f\u5207\u6362\u5668\uff0c\u64cd\u4f5c\u66f4\u987a\u624b\u3001\u4fee\u590d\u5207\u6362\u5f02\u5e38\r\n- \u7ba1\u7406\u5458\u521b\u5efa\u8d26\u53f7\u65f6\u53ef\u81ea\u5b9a\u4e49 User_Key\r\n- \u65b0\u589e\u5bf9\u8bdd\u8bb0\u5fc6\u641c\u7d22\uff1a\u8de8\u4f1a\u8bdd\u7684\u8bed\u4e49\u4e0e\u5173\u952e\u5b57\u68c0\u7d22\uff0c\u6309\u6743\u9650\u7cbe\u786e\u63a7\u5236\u53ef\u89c1\u8303\u56f4\uff1b\r\n  \u652f\u6301\u5bf9\u5355\u5c42\u8bb0\u5fc6\u76f4\u63a5\u8986\u76d6\u4fee\u6539\r\n- \u8d44\u4ea7 ID \u76f4\u63a5\u5c55\u793a\u5e76\u53ef\u590d\u5236\uff1b\u5217\u8868\u5b8c\u6574\u52a0\u8f7d\uff0c\u4fee\u590d\u5206\u9875\u622a\u65ad\u663e\u793a\u4e0d\u5168\u7684\u95ee\u9898\r\n\r\n### \u2699\ufe0f \u4e00\u952e\u90e8\u7f72\u589e\u5f3a\r\n\r\n- \u542f\u52a8\u811a\u672c\u652f\u6301\u4ea4\u4e92\u5f0f\u914d\u7f6e\uff0c\u81ea\u52a8\u9884\u68c0 LLM \u901a\u8def\u4e0e\u7aef\u53e3\u5360\u7528\uff0c\u907f\u514d\u90e8\u7f72\u8e29\u5751\r\n- \u5ba2\u6237\u7aef\u63a5\u5165\u5730\u5740\u4e00\u952e\u590d\u5236\uff0c\u5355\u673a\u90e8\u7f72\u4e0b\u81ea\u52a8\u89e3\u6790\u4e3a\u5bbf\u4e3b\u673a\u5730\u5740\uff0c\u5916\u90e8\u5ba2\u6237\u7aef\u53ef\u76f4\u63a5\u8fde\u63a5\r\n\r\n### \u26a1 \u6027\u80fd\u4f18\u5316\r\n\r\n- \u77e5\u8bc6\u5e93\u5217\u8868\u52a0\u8f7d\u63d0\u901f\uff0c\u5e38\u7528\u8def\u5f84\u66f4\u5feb\u54cd\u5e94\r\n- Wiki \u9875\u9762\u5e76\u53d1\u6784\u5efa\uff0c\u5355\u9875\u5931\u8d25\u81ea\u52a8\u91cd\u8bd5\uff0c\u5927\u6279\u91cf\u6587\u6863\u5bfc\u5165\u65f6\u95f4\u5927\u5e45\u7f29\u77ed\r\n\r\n### \ud83d\udcda \u6587\u6863\r\n\r\n- \u6309\u5ba2\u6237\u7aef\u62c6\u5206\u72ec\u7acb\u63a5\u5165\u6587\u6863\uff0c\u5404 agent \u5404\u6709\u4e00\u4efd\u6e05\u6670\u7684\u63a5\u5165\u6307\u5357\r\n- \u65b0\u589e\u9762\u677f\u4e0e API \u4f7f\u7528\u6587\u6863\r\n- \u8865\u5145\u82f1\u6587\u9762\u677f\u622a\u56fe\u4e0e README \u66f4\u65b0\r\n\r\n### \ud83d\udc1b \u4fee\u590d\r\n\r\n- \u4fee\u590d\u591a Agent \u573a\u666f\u4e0b\u8bb0\u5fc6\u68c0\u7d22\u4e3a\u7a7a\u7684\u95ee\u9898\r\n- \u4fee\u590d\u8d44\u4ea7\u89e3\u7ed1\u4e0d\u751f\u6548\u3001\u8d44\u4ea7\u8f83\u591a\u65f6\u8bb0\u5fc6 tab \u4e22\u5931\u7684\u95ee\u9898\r\n- \u4fee\u590d\u5bfc\u5165\u5386\u53f2\u4f1a\u8bdd\u65f6\u95f4\u9519\u4e71\uff0c\u6062\u590d\u539f\u59cb\u65f6\u95f4\u7ebf\r\n- \u4fee\u590d\u7f16\u8f91\u573a\u666f\u65f6\u90e8\u5206\u5185\u5bb9\u88ab\u91cd\u590d\u5c55\u5f00\u7684\u95ee\u9898\r\n- \u4fee\u590d macOS \u4e0b\u90e8\u7f72\u811a\u672c\u7684\u517c\u5bb9\u6027\u95ee\u9898\r\n- \u4fee\u590d\u4f9d\u8d56\u7f3a\u5931\u5bfc\u81f4\u7684\u5b89\u88c5\u62a5\u9519\r\n- \u4fee\u590d\u90e8\u5206\u5ba2\u6237\u7aef\u9996\u6b21\u5f15\u5bfc\u8868\u5355\u5728\u8001\u7248\u672c\u4e0a\u7684\u517c\u5bb9\u6027\u95ee\u9898\r\n- \u65b0\u589e\u6e05\u7a7a\u5bf9\u8bdd\u8bb0\u5fc6\u529f\u80fd\uff0c\u652f\u6301\u6279\u91cf\u5220\u9664","reactions":{"total_count":10,"+1":5,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":2,"rocket":1,"eyes":0}}
