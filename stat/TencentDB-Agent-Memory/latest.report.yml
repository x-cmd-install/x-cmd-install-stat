{"id":411564910,"author":{"login":"Maxwell-Code07","id":95488710,"node_id":"U_kgDOBbEKxg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR7zWt84Yh_tu","tag_name":"v2.0.3-beta.1","target_commitish":"feat/server_team","name":"v2.0.3-beta.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-13T07:37:05Z","updated_at":"2026-10-13T10:43:52Z","published_at":"2026-10-13T10:43:52Z","assets":[],"body":"## [2.0.3-beta.1] - 2026-10-13\r\n\r\nv2.0.3-beta.1 \u53d1\u5e03\uff0c\u76f8\u6bd4 v2.0.2 \u65b0\u589e\u53ef\u63d2\u62d4\u7684\u51b3\u7b56\u670d\u52a1\u3001\u6280\u80fd\u6309\u9700\u9009\u62e9\u4e0e\u4f1a\u8bdd\u8f68\u8ff9\r\n\u8bb0\u5f55\u80fd\u529b\uff0c\u5e76\u8865\u9f50\u4ee3\u7801\u77e5\u8bc6\u5e93\u7684 SSH \u514b\u9686\u4e0e\u53ef\u89c2\u6d4b\u6027\u4fe1\u606f\u3002\u4ee5\u4e0a\u65b0\u80fd\u529b\u5747\u9ed8\u8ba4\u5173\u95ed\uff0c\r\n\u65e7\u914d\u7f6e\u65e0\u9700\u4fee\u6539\u3001\u884c\u4e3a\u4e0e\u4e4b\u524d\u4fdd\u6301\u4e00\u81f4\u3002\r\n\r\n> **\u4ea7\u54c1\u5b9a\u4f4d**\uff1a\u8ba9 Agent \u7684\u7ecf\u9a8c\u3001\u6587\u6863\u3001\u4ee3\u7801\u6c89\u6dc0\u6210\u53ef\u590d\u7528\u8d44\u4ea7\uff0c\u8ba9\u4e0b\u4e00\u4f4d Agent\r\n> \u76f4\u63a5\u8bfb\u6863\u3002\u8be6\u89c1 [README_CN.md](./README_CN.md)\u3002\r\n\r\n### \ud83e\udde9 \u53ef\u63d2\u62d4\u51b3\u7b56\u670d\u52a1\uff08\u9ed8\u8ba4\u5173\u95ed\uff09\r\n\r\nSkill \u9009\u62e9\u4e0e Memory L3 \u66f4\u65b0\u5224\u5b9a\u7edf\u4e00\u6536\u655b\u5230\u51b3\u7b56\u670d\u52a1\uff0c\u53ef\u7075\u6d3b\u66ff\u6362\u51b3\u7b56\u6765\u6e90\uff1a\r\n\r\n- \u901a\u8fc7\u7edf\u4e00\u7684\u51b3\u7b56\u670d\u52a1\u63a5\u53e3\u8c03\u7528\uff0c\u5185\u7f6e JEV\uff0c\u4e5f\u53ef\u63a5\u5165\u5176\u4ed6 decision API\r\n- \u914d\u7f6e\u7528 `provider` \u6307\u5b9a\uff08\u9ed8\u8ba4 `jev`\uff09\uff0c\u65e7\u914d\u7f6e\u65e0\u9700\u4fee\u6539\r\n- \u9ed8\u8ba4\u4e0d\u8c03\u7528 JEV\uff0c\u884c\u4e3a\u4e0e\u4e4b\u524d\u4e00\u81f4\uff1b\u5f00\u542f\u540e\u5373\u4f7f\u51b3\u7b56\u670d\u52a1\u8c03\u7528\u5931\u8d25\uff0c\r\n  \u4e5f\u4e0d\u5f71\u54cd\u6b63\u5e38\u5bf9\u8bdd\u4e0e\u8bb0\u5fc6\u5199\u5165\r\n\r\n### \ud83e\uddf0 \u6280\u80fd\uff08Skill\uff09\u6309\u9700\u9009\u62e9\uff08\u9ed8\u8ba4\u5173\u95ed\uff09\r\n\r\n- \u5f00\u542f\u540e\u7531 Proxy \u6bcf\u8f6e\u81ea\u52a8\u9009\u51fa\u5408\u9002\u7684\u6280\u80fd\uff0c\u901a\u8fc7\u4e00\u6b21\u5ba2\u6237\u7aef\u5de5\u5177\u8c03\u7528\u52a0\u8f7d\r\n- \u4e0d\u518d\u5411\u7cfb\u7edf\u63d0\u793a\u8bcd\u6ce8\u5165\u5b8c\u6574\u6280\u80fd\u76ee\u5f55\uff0c\u51cf\u5c11\u63d0\u793a\u8bcd\u5f00\u9500\r\n\r\n### \ud83d\udcfc \u4f1a\u8bdd\u8f68\u8ff9\u8bb0\u5f55\r\n\r\n- Proxy \u5728\u6bcf\u8f6e\u5bf9\u8bdd\u7ed3\u675f\u540e\uff0c\u628a\u53d1\u5f80\u4e0a\u6e38\u7684\u6d88\u606f\u4e0e\u6a21\u578b\u56de\u590d\u8bb0\u5f55\u5230 MemoryCore\r\n  \uff08\u65b0\u589e `/v3/session/add`\uff0c\u5199\u5165\u672c\u5730\u5b58\u50a8\uff09\r\n- \u968f `tdai.enabled` \u5f00\u542f\r\n\r\n### \ud83e\udde0 \u4ee3\u7801\u77e5\u8bc6\u5e93\r\n\r\n- \u79c1\u6709\u4ee3\u7801\u4ed3\u652f\u6301 SSH \u514b\u9686\uff08\u542b\u975e 22 \u7aef\u53e3\uff09\uff0c\u5728\u9762\u677f\u83b7\u53d6 SSH \u516c\u94a5\u540e\u5373\u53ef\u5efa\u56fe\r\n\r\n### \ud83d\udcc8 \u53ef\u89c2\u6d4b\u6027\r\n\r\n- `/health` \u65b0\u589e `ftsAvailable`\uff0c\u4fbf\u4e8e\u6392\u67e5 BM25 \u5173\u952e\u8bcd\u53ec\u56de\u4e0d\u53ef\u7528\u7684\u95ee\u9898\r\n- LLM \u8c03\u7528\u5931\u8d25\u65e5\u5fd7\u8865\u5145\u72b6\u6001\u7801\u3001URL \u4e0e\u54cd\u5e94\u5185\u5bb9\r\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
