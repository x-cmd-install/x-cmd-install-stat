ip","state":"uploaded","size":4519505,"digest":null,"download_count":10,"created_at":"2025-04-16T08:21:59Z","updated_at":"2025-04-16T08:22:00Z"},{"id":246845299,"node_id":"RA_kwDOLb3Pms4Oto9z","name":"cueitup_1.0.0_darwin_arm64.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4252647,"digest":null,"download_count":65,"created_at":"2025-04-16T08:21:59Z","updated_at":"2025-04-16T08:22:00Z"},{"id":246845301,"node_id":"RA_kwDOLb3Pms4Oto91","name":"cueitup_1.0.0_linux_amd64.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4438940,"digest":null,"download_count":373,"created_at":"2025-04-16T08:21:59Z","updated_at":"2025-04-16T08:21:59Z"},{"id":246845302,"node_id":"RA_kwDOLb3Pms4Oto92","name":"cueitup_1.0.0_linux_arm64.tar.gz","label":"","uploader":{"login":"dhth","id":13575379,"node_id":"MDQ6VXNlcjEzNTc1Mzc5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4084443,"digest":null,"download_count":5,"created_at":"2025-04-16T08:21:59Z","updated_at":"2025-04-16T08:21:59Z"}],"body":"v1.0.0\r\n===\r\n\r\nThis release brings a few major additions to `cueitup`, including some breaking changes to the CLI interface.\r\n\r\n### Added\r\n\r\n- Add support for profiles\r\n  ```yaml\r\n  profiles:\r\n      # a name for a profile; you refer to it when running cueitup\r\n    - name: profile-a #\r\n\r\n      # the SQS queue URL\r\n      queue_url: https://sqs.eu-central-1.amazonaws.com/000000000000/queue-a\r\n\r\n      # use this to leverage a profile contained in the shared AWS config and credentials files\r\n      # https://docs.aws.amazon.com/sdkref/latest/guide/file-format.html\r\n      aws_config_source: profile:local-profile\r\n\r\n      # the format of the message body; possible values: [json, none]\r\n      format: json\r\n\r\n    - name: profile-b\r\n      queue_url: https://sqs.eu-central-1.amazonaws.com/000000000000/queue-b\r\n      aws_config_source: env\r\n      format: none\r\n\r\n    - name: profile-c\r\n      queue_url: https://sqs.eu-central-1.amazonaws.com/000000000000/queue-c\r\n      aws_config_source: env\r\n      format: json\r\n\r\n      # to only show the contents of a nested object\r\n      subset_key: Message\r\n\r\n      # cueitup will display this key value pair as \"context\" in its list\r\n      context_key: aggregateId\r\n  ```\r\n- Add web interface\r\n  <video src=\"https://github.com/user-attachments/assets/e11e2d02-c5a4-4379-b6f2-ee498094e122\"></video>\r\n- Allow multiple sources for AWS config\r\n\r\n### Changed\r\n\r\n- Show error (if any) in message details pane\r\n  ![](https://github.com/user-attachments/assets/99ebfacb-fcf5-4045-b8a3-c248fb808e13)\r\n- Change path for persisting messages\r\n\r\n### Removed\r\n\r\n- Ability to filter for messages with a specific context value\r\n\r\n\r\n## Changelog\r\n* b7b0b39de20bd810b15d4d0b3ce1fbb77924d7a4 build: upgrade dependencies (#49)\r\n* bb6f44bc017fff16e0ea678dd416fc9693c398eb build: upgrade go and deps (#35)\r\n* 26afbe006e6f781cd4f954d061612a1a3b908115 chore(fe): set dev flag to false\r\n* e3d7cf4439f8412682087d4f0c0cf8747879d895 chore: change path for saving messages (#42)\r\n* 6885afda1747ecdab6d136e218ae1f2e54e4922e chore: improve error message for config source (#48)\r\n* b66b8362920ac2a2def5ae7ceea0c283ccc2392d feat!: add support for profiles (#36)\r\n* 9cb0ee22858f2527e8311d98ca8f1c8047c67598 feat!: add web interface (#37)\r\n* 2486ea2c6d29376f5e99813cf33314de9239d83e feat: add command for validating config (#47)\r\n* d25bbcd8ad4e9b14d5106773f84edfda7abe2c64 feat: add flag to tui for showing message count (#41)\r\n* 0d563aef3ac5f3df2a946d21dc1e737d6c60a3ca feat: allow multiple sources for aws config (#39)\r\n* e899767f58ef8ca31708d190227878e57e86fcf7 feat: show error in message details pane (#40)\r\n\r\n"}
