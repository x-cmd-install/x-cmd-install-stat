{"id":379214290,"author":{"login":"mrdaemon","id":461308,"node_id":"MDQ6VXNlcjQ2MTMwOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYeHI84WmlnS","tag_name":"v3.0.1","target_commitish":"main","name":"3.0.1 - Bugfix Release","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-08-29T21:42:04Z","updated_at":"2026-08-30T07:51:25Z","published_at":"2026-08-30T07:48:38Z","assets":[],"body":"_Exosphere: A simple CLI and TUI driven application that offers patch reporting for remote unix systems_\r\n\r\nA few minor edge case bugfixes, and documentation improvements that were long overdue and missed the window for 3.0.\r\n\r\nThe [CLI Command Reference](https://exosphere.readthedocs.io/en/stable/command_reference.html) section of the documentation, in particular, has been overhauled and looks much nicer now.\r\n\r\nSome minor refactoring of internals were also performed to improve code quality and internal API robustness.\r\n\r\nAs always, the latest version is available [on PyPI](https://pypi.org/project/exosphere-cli/), and you can update by following the [instructions in the documentation](https://exosphere.readthedocs.io/en/stable/installation.html#updating-exosphere).\r\n\r\n## Bug Fixes\r\n\r\n- Fixed issue during TUI app initialization where debug logs would be discarded and warnings would fail to display correctly.\r\n- Fixed Issue where `SystemError: buffer overflow` was encountered during CLI tasks on Python 3.14 in some specific circumstances, due to an upstream Fabric bug.\r\n- Exception system should now consistently report authentication failures within user facing UI elements, instead of sometimes showing the generic Paramiko message \"Private key file is encrypted\".\r\n\r\n## Documentation\r\n\r\n- Refresh README to cover 3.0+ project structure\r\n- Fix multiple grammar, structure and rendering issues\r\n- Update the Documentation index to be in sync with the README\r\n- Document cache file locking mechanics in the [appropriate section](https://exosphere.readthedocs.io/en/stable/cachefile.html#cache-locking-concurrent-instances)\r\n- Fix issue with CLI Command Reference linking to wrong section anchors for subcommands sharing a name\r\n- Improve presentation of string literal boxes throughout the documentation\r\n- Overhaul visual structure of the [CLI Command Reference](https://exosphere.readthedocs.io/en/stable/command_reference.html) section.\r\n\r\n\r\n## What's Changed\r\n* Docs: Fix minor grammar and render nits by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/336\r\n* Migrate codebase to ruff 0.16+ by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/361\r\n* Fix bug resulting in SystemError during CLI operations on Python 3.14 by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/362\r\n* Update uv-build requirement from <0.12.0,>=0.7.19 to >=0.7.19,<0.13.0 by @dependabot[bot] in https://github.com/mrdaemon/exosphere/pull/354\r\n* Docs: Refresh documentation post 3.0 release by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/365\r\n* Move general exception handling to Host object by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/366\r\n\r\n**Full Changelog**: https://github.com/mrdaemon/exosphere/compare/v3.0.0...v3.0.1","mentions_count":2}
