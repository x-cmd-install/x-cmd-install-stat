{"id":413197755,"author":{"login":"mrdaemon","id":461308,"node_id":"MDQ6VXNlcjQ2MTMwOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOYeHI84YoOW7","tag_name":"v3.0.3","target_commitish":"main","name":"3.0.3 - Bugfix Release and Python 3.15 Support","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-10-14T21:07:21Z","updated_at":"2026-10-14T21:27:05Z","published_at":"2026-10-14T21:25:30Z","assets":[],"body":"_Exosphere: A simple CLI and TUI driven application that offers patch reporting for remote unix systems_\r\n\r\nContains minor, optional changes surrounding dependencies compatibility, support for Python 3.15 and an edge case fix for the `--version` flags from the CLI.\r\n\r\n## Features\r\n\r\n- Python 3.15 support\r\n\r\n## Bug Fixes\r\n\r\n- Explicitly handle CLI exit codes to prevent future breakage due to library changes\r\n- `--version/-V` now only skips initialization when used as a root argument. Using it after a subcommand now correctly gets a standard error and help output.\r\n\r\n## Dependency Changes\r\n\r\n- Floor raised for Pydantic on Python 3.15 (pydantic 0.14, pydantic-core 0.50). Unchanged on 3.13 and 3.14.\r\n- Cyclopts ceiling set to < 6.0.0\r\n\r\n## What's Changed\r\n\r\n* Wrap CLI entry point for exit code handling by @mrdaemon https://github.com/mrdaemon/exosphere/pull/395\r\n* CLI: Fix fast-path for version flags by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/396\r\n* Python 3.15 Support by @mrdaemon in https://github.com/mrdaemon/exosphere/pull/397\r\n\r\n**Full Changelog**: https://github.com/mrdaemon/exosphere/compare/v3.0.2...v3.0.3","mentions_count":1}
