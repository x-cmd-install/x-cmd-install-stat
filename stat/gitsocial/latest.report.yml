6136f1648f73f45a977b64b74b8 Site: drop a carried tag's old link and count when its pair changes\n* 461b0b38fd5b10a0b86ed0a01206d7cc54990af2 Site: publish a range document for each tag, read it on the tag page\n* 4aa811be32b0eafba927538681a4dd1608d3ad88 Site: read small pack indexes whole, probe packs by recent hits\n* a7996cd863c06b090e1768db2d1adb30e7156acf Site: walk compare and tag ranges newest first, as git rev-list does\n* 739ddcdbbcf9776542f78d44cb85eb99a7a22c8c Tests: replace real repositories and people with placeholders\n* 79a672485154b0c1951d1c53f21ee547d7b23034 Site: publish tag dates, authors and counts, order tags by date\n* b29b680f0d72dd95ff4a6341b9b2a0f5f1559bb6 Site: highlight Milestones or Sprints on their detail pages\n* 1470596134a1d056170c600794bf0b5c0743d632 Docs: apply ASD-STE100, one term per concept\n* 37db63d8053c9a4f956398c7ffb0fa65e82c6a5e Specs: one word per concept, define terms at first use\n* b77f5fc966b348417fbb36870560782c76067da1 Style: follow ASD-STE100 with terms from specs, RFC 2119 and git\n* aa967e8c5316f0fa87bd370d9119546d39a951f0 Site: show an adopted copy's original time and source on the detail\n* bfb81ba85832aab3439b2c938757d99b5fd2ef40 Check: skip the gate for a push of gitmsg data branches alone\n* f70f9bac249abc7653b38fa39cc1fb2c865b2595 Review: adopt a registered fork's pull request on a change or on demand\n* a014426f977ef2a953cdbe37006b9414f8ec2327 PM: adopt a registered fork's issue, on its first change or on demand\n* 5cce66f19734e8eac943f9702f7bd8eaa7d54d41 Protocol: place adopts among the core header fields\n* 93d1c4d0dc5a44fc92ab32f74b798a4f56103967 Specs: add `adopts` field to core\n* 4a8ab68ae0e56dade2657218bf46b7721debc9e8 Site: count sprints and typed items the way their lists show them\n* 6f86eb6aa6041e789b2c3c08a6d559710145dadf Site: count open work in the app's sidebar, lists open on Open\n* c148b700cf320926ec791d10bdfc418e08490c5d Site: size the card head glyph to its subject\n* dbabdbc5366a5cd11789d513dc7966ca53854da1 Site: fold the home landing into one collapsible code section\n* 65778327c2646b8e43ca0eb73ccceea1e2556eda Site: adjust text, table and code colors, card subjects, mono tracking\n* 2e82ca27d099264f36e9ab25dc3821e5e3c4534f Docs: fold STATIC-SITE-DESIGN.md into a shorter STATIC-SITE.md\n* 416e2b343f497498d55411ac1b6d6570cd0cf0ba Site: stop coloring bash command names from Prism's fixed list\n* 50bb9c1f6eae6a39dd8a2258d248f2d250b100cb Check: leave gitmsg refs out of the pushed ranges\n* 74a58db08643a97859eebf7537d49c527591dec3 Remote: default the put content type from the key's extension\n* 7d885e4b31746d8c1581b7c250b3837d5578b2ad Site: apply the favicon to the app's own header\n* b4dba1991a2d648b2f15d7efd036e6858a6ec33e Docs: clean up README.md, add CONTRIBUTING.md\n* 1bea4df7d39a2cd7e7e66d8fbac640a4a4e76d48 Site: favicon accepts a bucket key or URL, dropping data: URI support\n* d7319bccd33f21101cb96b9630318ee206d42fe5 Site: adjust colors, markdown header paddings\n* c614927d6928820486e6a2453ff3f7a0edf8953f Site: adjust colors, use purple instead teal for links\n* b621b384795027dff69bde4a02d04728fd7b8363 Site: code block padding, card subjects and item list rows in mono, etc\n\n"}
