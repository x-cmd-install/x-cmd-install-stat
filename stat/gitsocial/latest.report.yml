8f8acc16a71711066b259b88cfd Release: source the credential .env from the release driver itself\n* 3ac9b463edbeccb52cd3e4a1c371160b1790afa7 Testing: isolate the suite from the environment a push's own pre-push gate inherits\n* 4ac19acfc1673b014735b8de7a9e2c6e085b2344 Locals3: confine request keys to the bucket root and XML-escape listed keys\n* 285c5cd556d26cccabfb3eefe446e57fcf1c16bc Testing: cover the local S3 server and the thin-client fetch processors\n* 1d949dcd1d5b549e2ffe84e41abd4b51a3311fd7 Git: strip repo-redirecting env vars from test git invocations, cover the ambient GIT_DIR redirect with a regression test\n* 811229427c22d88bc38b4aca29426151b81154b4 TUI: size the cache and site-config columns from the content pane\n* 160b1671d21451939b6a1d81f24cdc0a9cde753a Search: group PRs by label, reviewer and base again, and cover the untested half of the package\n* bf19306de221d78f61413bb07caea568e59c2aa2 Testing: seed memo, fork and proposal data into the TUI fixture and assert on rendered content\n* 2ef11af041c25d8e06ec58c6c0bceed0336903f7 TUI: fix the nil-pointer crash on proposal accept and decline\n* 434b60d065d961f24100bdbe462459fa81ee183c TUI: truncate nav child labels so a long one cannot push the panel border past the terminal\n* 6a3e478ee8071b0fc40e00f3c516ef3ba932f36f Testing: add the gh exec seam and cover the import pipeline end to end\n* 47bac91f6d01785dc1dc814d17c580184cb0bdda Import: sync edit fields onto canonical rows so imported closed items do not read back as open\n* f4124e8feee717a82b062b839628e942b45a4c10 PM: derive parent and root inside CreateIssue and UpdateIssue so every caller writes the spec's hierarchy form\n* 9bd5949032cfd5e6c97b695286d9b54a3145f501 Testing: cover migrations, identity, merge/rebase, PM links and SBOM behind one shared fixture helper\n* 9627f244b341c36256c08b9be0e3f1220693f495 Trailers: parse the footer past git's trailing newline; ref rows only for commit refs\n* e0cfaf799679626966c9222ee6c8b59ca2255fa7 RPC: register the review version methods and a social.search alias; docs keybindings honors --json\n* bcf30d9a40d314493d6ab554b6d10ffe2b795ff1 Testing: align documentation with behavior\n* be95fbf7fe810cab208d6fdca2f58f2601643c66 Testing: fix the site battery's CSS drift guards\n* 60cb7731998713b9d94a65f6f74295839d91b887 Testing: add scripts/check.sh gate, tracked pre-push hook, and statement-weighted coverage report\n* e69cd1ea22ffa49c0b534e897d72aacd7978f2a1 Static site: use app's sidebar and recent-activity chrome for static pages\n\n"}
