d1bd26c803e2a63a792aa2bd4724 Cache: give the two-opener schema test an existing cache\n* 2ee0705afd63a87aa706762f4b4eb9d8e4d17f85 Docs: squash by revertable unit, one agent and one reader per file\n* d45640a4037aee8c36c6886fc0af402480a5394b Site: list the header fields of an item on its page\n* 15f7cf7dcc8d200347e4468d7bebe73a0cafa483 Site: link the refs, URLs and branches of a page body\n* f3d120ad687093f4486d58c3b3a20c61609c7ebf Site: resolve a branchless commit route by hash\n* 1f5b1d11f89654e8f8c9761dbaa83aafbd7f0505 Site: link the fields of each detail and card in the app\n* dc776d02a8cf6c418a11708046b659296c0eaa68 Site: add the assignee and reviewer search facets\n* bcf9316b449dfeb6dce38838ce5dc3daca253eaf TUI: link the fields of each detail view and card\n* dd550a599fa83304b48b90977df81ae8a551111f TUI: open a tag, a list and each marked anchor from a detail card\n* c1b0e6cda46f69d0291194157b26bc0b732cde83 Protocol: one ref and mention grammar for the TUI, the page and the app\n* 1981740e7e7dd10c0aa021cb625774f19269da41 Search: read assignee, reviewer and label as inline facets\n* b9737955c8690f6d911dea1e7e17205048512d5a Site: raise the per-file diff cap to 20,000 lines\n* d3bd6b75bfe3e2e9cbc0f4bb7688d103a6ba8041 Site: start every file row of a diff collapsed\n* 91786a1bc98fb3c071347e1da9e215d5ad86284c Site: a spinner holds the Files changed slot while it loads\n* f600fb071c57d18e7f2e773be4d72ca9593c55ab Site: fill the detail sections in the order of the page\n* e19eeee75876dce3e77f85e9df280a5bfde44330 Cache: apply each schema in one transaction\n* 9e0dec6d749a2781134bfffe494509af7db71075 CLI: carry --cache-dir to the remote helper\n* 40cf0e79caa705ac389e4e6f311c327a488e5fdc Site: list and diff fork pull requests in the app\n* 74d7dc4d848eae1021f50ee205236e05fef41252 Site: read a pack under a registered base\n* 6965d59f5e0af510187c294eaead2ba328e4acc8 Site: the forkPullRequests key, the lock and the push report\n* fd8b4fe94b32a2ea68225461059fb0eb21474910 Site: write the fork pull request area\n* 38cec24bef61e64189e9145b32e2cacc20cf4f88 Review: fetch the open heads of fork pull requests with the fork\n* 373854b7e12471ed557dadac7c9cc6dd87e26cc2 Review: collapse an adopted original under a state filter\n* 18efc5a759023fccfc0fcf1cacf39da44c1cc225 Site: show the files changed on a pull request page\n* b0957727bc5421301f85a8e74ce2c95ff0d815ed Site: expand the merge head through the merged head ref\n* 9a3956f420d3a26e953b6983f2b5cf9c901d2fa0 Site: the Changes section follows the version picker\n* 08b11414e7669bae360a0fe34d8bd9ec722918dc Site: expand a short sha from the pack indexes\n* fa88b5c4f3913a1ef0e26cfcaf5df70ae9467e48 Review: keep the merge head at refs/gitmsg/review/merged/<hash>\n* 1d7b7b1f911409529f6689047925d2e87bdc0f88 Review: specify the merged head ref\n* d2fd2e6d84856ce1760539b188acca49cda6530d Timeline: show the actions taken on items\n* 1b70d3052211f754be3a8a9a06b7eaf27e69a9ab CLI: force the serve pushes, run no hook, print full step lines\n\n"}
