1cf6853bd741748eeb62948e6b4 Deps: update brotli to 1.2.7 for GO-2026-6888\n* 150c73c0a0375c4b0bd22ec8e328aa7b012c1ecd Release: ship gitsocial one time in the darwin zip\n* 3eb241e39ec5cc47ee2adfaefd61244af6a11e90 Fetch: keep the auto-fetch on when the TUI has no input\n* d8d5b0957d0c5b86bfb263b0d9a62fed30987526 Notifications: send each event once from a state row per event\n* fb89361a11863d8b1a2006348c273f8dd436ef44 Notifications: take a state change from the action of the edit\n* 37dc571966d40d4c30999d6a91aac05900b060f4 Fetch: allow a 5 second auto-fetch interval with a 1.25 back-off\n* 0bbdb183923449e2c44b52ecc17c873705a99c94 Notifications: select the tmux window of the TUI on a macOS click\n* fc7302740cd4a5ea62c20d7da91be6775a020e41 Notifications: select the tmux window of the TUI on a Linux click\n* cf107d07d5d95d7fcaaf86cba5184719a5084e8d Notifications: select the Konsole tab on a KDE Plasma click\n* a9ca9a3f400b4f1012ff4db793e09f9b7f5f91b6 Notifications: select the GNOME Terminal tab on a Linux click\n* 22e1d28cb9dc40fc393550087df85b6c0d0325ba Notifications: bring the terminal to the front on a Linux click\n* 8790d6757a5903e8bf461292bbc162b941a6d34a Notifications: give a Linux click to the TUI or the site over D-Bus\n* e8182197360f08df8edebdea732296d1485fb151 Notifications: select the terminal tab of the TUI on a click\n* e1941446ce2d842b96c7d43dd078bf0a27989e43 Notifications: open a clicked TUI message in the TUI that sent it\n* 1691f61479cce493a8179b1418623fafd154a8b5 Site: show browser notifications through a service worker\n* 83f9f3b832f898b993c3d4bd2509f32de15a21d9 Site: poll for notifications from a background tab too\n* 101dcca79ddee212018e6390a195fb02d95470bb Signing: record that Notification Center keeps the first icon\n* c6980f3c36e9d35fbcad08a8d27f25211d223809 Serve: fetch on start and on the auto-fetch interval\n* 09ea5de03d4c471cb7d63777d2e266792fdedb14 Site: show new items as browser notifications from an open tab\n* c5c0695e1f9f2578aedef3cce6d1ff921c379553 Site: add the notification bell and its permission panel\n* 3cff7dee8a219207fde40c61913f3e8c862a8dff Notifications: pin the message text of both carriers to one fixture\n* 2e84457e08f1e9534acc7ded96dfbc7f7180f9bf Site: regenerate the shape goldens for the minimal sidebar\n* 178c73a97379c82a5629f1aa6495617f6bc35c79 Install: place GitSocial.app on macOS\n* ef5b5b321478196f6f3c355cc01802fa2caaf6a8 Release: ship GitSocial.app with the notifier in the darwin zip\n* f168a64058fa2197253673e1147298416f36673e Notifications: post each new item to the notifications.webhook URL\n* cae25ccbe04d8292e96ed3df7c4acd103634583f Notifications: name GitSocial on a Windows toast and open the item\n* 6f493f04e6585fb2c976dc9599570370fcc8e371 Notifications: open the item on a click of a Linux message\n* aa47d2ac8faa50b61c62a5a9734838cb204561da Notifications: post on macOS through GitSocial.app with a click\n* 5d37eddeaa4494e282a86697dc21f65bf5fbd509 Notifications: give each message the URL of its item\n* 2c81d73af541dc74e827a8c28f728afbb08e97ec Notifications: send a desktop message for new unread items on fetch\n* f5120d31a9e478e612f4ce93e73c1d42db9848be Tests: give the guarded board flows the kanban columns they count\n* 5a8c3147ee91b32eb63e4a5cd29c660d721a9034 Site: one history entry per navigation, re-drive the route on pop\n* 3c8e7fc5f390a39aa5e647c0c9b5c38c3a606592 Docs: add WHY-GITSOCIAL and link it from the README\n* 7513c60049b1ef495342befc41889e08cfa63332 PM: make minimal the default framework across CLI, TUI and site\n* 0cb00f2e97453be269ed99d9a0d4d1f381e52c57 Site: show the served page as the first view of its own entry\n* 3e0d5ecddd5d0455d61fb5b3f49d4d36c8b84a47 Site: link a reference to a root item to its page\n* eb5cd72ae04740ce74cd452e8426451df7363e2b Site: mark an empty list page noindex\n* dc4081abcf1001d3de0a93e6bad1c61fdb15305c Site: keep the served title on a page entry\n* dc19d60e8a099d3c634ad5155444b28945132272 Site: link documents and files to their pages\n* 65ee47a9133efd670d5df09b06387200476cdc00 Site: show the page URL of a document and link documents to their pages\n* b977e8ab74832d7ab9f88f02b9bb7523c9039338 Site: join a relative link from the directory of its document\n* fc771f402f9b6c4c9f331bcc2797cd66d5159d4f Site: author pictures in the avatar circle\n* a24e33303d204e5adf2d89a7c88e5a3947a24f80 Import: move the dry-run count of executePM into countPM\n* 53c6aed62aa9a5c1ed64e1737f975294fbfc70ac Update README.md\n\n"}
