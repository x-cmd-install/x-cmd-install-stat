{"id":356010117,"author":{"login":"QuLogic","id":302469,"node_id":"MDQ6VXNlcjMwMjQ2OQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOABUios4VOEiF","tag_name":"v3.11.1","target_commitish":"main","name":"REL: v3.11.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-17T22:10:33Z","updated_at":"2026-07-18T03:45:29Z","published_at":"2026-07-18T03:45:29Z","assets":[],"body":"This is the first bugfix release of the 3.11.x series.\r\n\r\nThis release contains several bug-fixes and adjustments:\r\n\r\n- Fix tight layout of multiple subplots with `sharey=True`\r\n- Fix `NoNorm` cursor formatting for `uint8` images\r\n- Fix occasional misalignment in reported mouse position (also fix a bug with canvas height)\r\n- Fix clipped Axis labels on 3D plots with tight layout\r\n- Fix inverted Axis on 3D plots\r\n- Fix restoring 'auto' aspect in 3D axes after switching from 'equal'\r\n- Fix missing glyphs when subsetting Type 1 fonts in PDF\r\n- Fix oversized embedding of Type 42 fonts in PDF/PostScript files\r\n\r\nAs well as several documentation and typing improvements and corrections.","reactions":{"total_count":7,"+1":7,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
