{"id":334321378,"author":{"login":"RobertoPrevato","id":2576032,"node_id":"MDQ6VXNlcjI1NzYwMzI=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCXZn8M4T7Vbi","tag_name":"v2.6.3","target_commitish":"main","name":"v2.6.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-06-04T12:23:03Z","updated_at":"2026-06-04T12:25:45Z","published_at":"2026-06-04T12:25:45Z","assets":[],"body":"- Fix [#673](https://github.com/Neoteroi/BlackSheep/issues/673): `JWTOpenIDTokensHandler.authenticate` was discarding the `Identity` returned by the inner `auth_handler`, causing `request.identity` to always be empty. Also fixes the refresh token not being attached to the identity when a refresh token header is present.\r\n- Fix [#675](https://github.com/Neoteroi/BlackSheep/issues/675): fix `OverflowError` when serving large files inefficiently; `get_chunks` in `scribe.pyx` used a C `int` loop variable that overflows for responses larger than ~2 GB. Changed to `Py_ssize_t`.\r\n- Fix potential `OverflowError` in `cookies.pyx`: `Cookie.max_age` and the local variable in `parse_cookie` were declared as C `int`; changed to `long long`.\r\n- Fix [#674](https://github.com/Neoteroi/BlackSheep/issues/674): OpenAPI generator crashed with `AttributeError` when a handler returned `AsyncIterable[ServerSentEvent]` (or any `collections.abc` async-iterable generic). `_try_get_schema_for_generic` now skips types whose origin has no `__parameters__`.\r\n- Feature [#679](https://github.com/Neoteroi/BlackSheep/issues/679): add `on_response` async callback to `serve_files()` and `serve_files_dynamic()`. The callback receives `(request, response)` and can mutate the response in-place (e.g. inject a dynamic `Content-Security-Policy` header). It is called for every response produced by the static file handler.\r\n- Fix [#643](https://github.com/Neoteroi/BlackSheep/issues/643): `use_authorization()` no longer overrides exception handlers that the user has already registered for `UnauthorizedError`, `ForbiddenError`, `AuthenticateChallenge`, or `RateLimitExceededError`. Framework defaults are now installed via `setdefault` so user-defined handlers win regardless of registration order; by @jbbqqf.\r\n\r\n","reactions":{"total_count":3,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
