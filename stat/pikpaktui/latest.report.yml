03Z"},{"id":793065460,"node_id":"RA_kwDORNfGD84vRTf0","name":"pikpaktui-x86_64-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5065748,"digest":"sha256:dcc7ec70c6460f30dd170043b3982ff56a0643cb7a9e38eef335a418b4f85649","download_count":4,"created_at":"2026-11-25T20:39:02Z","updated_at":"2026-11-25T20:39:03Z"},{"id":793065468,"node_id":"RA_kwDORNfGD84vRTf8","name":"sha256sums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":777,"digest":"sha256:8f251e3979969bf66d4b4214b85bd31246b40ad38ef312cf0efaf6207c6941e9","download_count":7,"created_at":"2026-11-25T20:39:02Z","updated_at":"2026-11-25T20:39:03Z"}],"body":"## Indexed filename search\n\nAndroid clients can read the account’s last complete filename index offline, then refresh it through the same incremental sync used for folder statistics. The JNI API returns the total match count and globally sorted pages of up to 300 entries. It supports filename, size, creation time, modification time, content modification time and file type.\n\nCLI and TUI users keep their existing filename index when upgrading from v0.0.67. Android fills in the additional metadata on its next synchronization. A failed refresh preserves the previous snapshot.\n\n[Android JNI API v1](https://github.com/Bengerthelorf/pikpaktui/blob/v0.0.68/android/README.md#searching-the-persistent-index)\n\n## Changelog\n\n**Full Changelog**: https://github.com/Bengerthelorf/pikpaktui/compare/v0.0.67...v0.0.68\n\n### Changes since v0.0.67:\n\n#### Features\n- feat: expose incremental filename search to Android clients (ef2df13)\n\n<details><summary>Maintenance</summary>\n\n- chore: bump version to 0.0.68 (71b62d1)\n\n</details>\n\n\n## Download\nChoose the appropriate binary for your platform:\n- **Linux x86_64**: pikpaktui-x86_64-linux.tar.gz (statically linked)\n- **Linux ARM64**: pikpaktui-aarch64-linux.tar.gz (statically linked)\n- **macOS Intel**: pikpaktui-x86_64-macos.tar.gz\n- **macOS Apple Silicon**: pikpaktui-aarch64-macos.tar.gz\n- **Windows x86_64**: pikpaktui-x86_64-windows.zip\n- **Windows ARM64**: pikpaktui-aarch64-windows.zip\n- **Android arm64 JNI API v1**: pikpaktui-android-arm64-v8a-api1.so\n- **FreeBSD x86_64**: pikpaktui-x86_64-freebsd.tar.gz\n"}
