3153,"node_id":"RA_kwDORNfGD84ndfoR","name":"sha256sums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":675,"digest":"sha256:b614f2d83a5de2f5ef1222408c7cab6f71266e6b7be23d7addf1ed3f27a6c1e9","download_count":9,"created_at":"2026-10-21T09:48:23Z","updated_at":"2026-10-21T09:48:24Z"}],"body":"## Fixes\n\n- Fix `pikpaktui update` downloading GitHub asset metadata instead of the actual checksum manifest and release archive. Both downloads now request `application/octet-stream`.\n- Keep SHA-256 verification mandatory before replacing the executable, and add regression tests for both download paths.\n\n## Upgrading\n\nIf your installed version reports `sha256sums.txt has no entry`, its updater still contains the old download logic. Upgrade once through Homebrew:\n\n```sh\nbrew update\nbrew upgrade Bengerthelorf/tap/pikpaktui\n```\n\nAlternatively, install the appropriate archive from this release after verifying it against `sha256sums.txt`, or use `cargo install pikpaktui --version 0.0.61 --locked --force`.\n\n## Validation\n\n319 tests passed, with strict Clippy and formatting checks. A controlled upgrade using the official checksum manifest and archive verified checksum validation, extraction, and executable replacement.\n\n[Full changelog: v0.0.60 to v0.0.61](https://github.com/Bengerthelorf/pikpaktui/compare/v0.0.60...v0.0.61)\n"}
