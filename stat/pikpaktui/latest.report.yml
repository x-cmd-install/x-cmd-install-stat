404866,"node_id":"RA_kwDORNfGD84nqUXC","name":"sha256sums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":675,"digest":"sha256:83dd20a973207877a33a27779b4fc29070f1467ba4f48655ee9e0b8f30994d3b","download_count":12,"created_at":"2026-10-22T09:53:34Z","updated_at":"2026-10-22T09:53:35Z"}],"body":"## Responsive TUI\n\n- Prepare image resizing, terminal image encoding, and syntax highlighting on background workers. Reuse cached assets and loading indicators while preparation is in progress.\n- Keep navigation responsive by limiting background-result processing per frame and prioritizing the selected preview over speculative work.\n- Run uploads in the background with progress, cooperative cancellation, and a return to browsing. Press `U` to reopen upload progress and `x` to request cancellation.\n- Complete local paths and run clipboard helpers asynchronously, with stale-result checks and helper timeouts.\n- Add scrolling to text previews, clearer loading/empty/error states, retry feedback, and quit protection for pending writes and transfers.\n- Update the English, Simplified Chinese, and Traditional Chinese TUI documentation.\n- Remove an obsolete test wrapper that triggered the Windows strict warning check.\n\n## Validation\n\n336 local unit tests passed, alongside strict Clippy, formatting, a release build, rendered UI checks, and input responsiveness tests. Linux and Windows CI and all seven release builds passed.\n\nThe `v0.0.62` tag stopped at CI validation and has no published package. This release contains all changes since `v0.0.61`.\n\n**Full changelog:** https://github.com/Bengerthelorf/pikpaktui/compare/v0.0.61...v0.0.63\n\n## Downloads\n\n- [macOS Apple Silicon](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-aarch64-macos.tar.gz)\n- [macOS Intel](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-x86_64-macos.tar.gz)\n- [Linux x86_64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-x86_64-linux.tar.gz)\n- [Linux ARM64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-aarch64-linux.tar.gz)\n- [Windows x86_64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-x86_64-windows.zip)\n- [Windows ARM64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-aarch64-windows.zip)\n- [FreeBSD x86_64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/pikpaktui-x86_64-freebsd.tar.gz)\n- [SHA-256 checksums](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.63/sha256sums.txt)\n"}
