65892,"node_id":"RA_kwDORNfGD84lCUqE","name":"sha256sums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":675,"digest":"sha256:99218a14603219cec20dd59786ac6fd80421bc36ae2f4c988bdfcc43b8735d64","download_count":13,"created_at":"2026-10-08T09:32:13Z","updated_at":"2026-10-08T09:32:13Z"}],"body":"## Highlights\n\n- Configurable TUI columns adapt to the terminal, with adjacent folder previews and inline media thumbnails.\n- Thumbnail placeholders keep filenames and row heights stable while images load or fail. Display size and server thumbnail resolution have separate settings.\n- Play Video now includes a quality dropdown. Set a default quality in Playback Settings or choose a version for one playback; unavailable versions show their reason.\n- Original playback uses the permitted original-media link returned by PikPak, matching the web client's external-player behavior, and no longer rejects a stream solely because its first response is slow.\n- Stale background responses cannot replace a newly opened or closed view. Partial or pending cloud operations retain unconfirmed cart items and report completion explicitly.\n- Upload hashing, completion checks, list pagination and credential refresh follow the verified web protocol behavior.\n- Configuration and TUI documentation are updated in English, Simplified Chinese and Traditional Chinese.\n\n## Validation\n\n317 local tests passed, along with strict Clippy, formatting and packaged-source checks. Release binaries are built by GitHub Actions for Linux, macOS, Windows and FreeBSD.\n\n[Full changelog: v0.0.58 \u2192 v0.0.60](https://github.com/Bengerthelorf/pikpaktui/compare/v0.0.58...v0.0.60)\n\n## Downloads\n\n- [Linux x86_64 (static)](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-x86_64-linux.tar.gz)\n- [Linux ARM64 (static)](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-aarch64-linux.tar.gz)\n- [macOS Intel](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-x86_64-macos.tar.gz)\n- [macOS Apple Silicon](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-aarch64-macos.tar.gz)\n- [Windows x86_64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-x86_64-windows.zip)\n- [Windows ARM64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-aarch64-windows.zip)\n- [FreeBSD x86_64](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/pikpaktui-x86_64-freebsd.tar.gz)\n- [SHA-256 checksums](https://github.com/Bengerthelorf/pikpaktui/releases/download/v0.0.60/sha256sums.txt)\n"}
