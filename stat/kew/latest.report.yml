emoved-paths.txt","label":null,"uploader":{"login":"ravachol","id":9517715,"node_id":"MDQ6VXNlcjk1MTc3MTU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":3301,"digest":"sha256:55ee680f2f223e8ad7a8fe4896200c0d594e4560a5c9a211e23cf0d2c0fcd4c9","download_count":1,"created_at":"2026-10-22T23:22:23Z","updated_at":"2026-10-22T23:22:24Z"},{"id":667376051,"node_id":"RA_kwDOJkBsTc4nx1mz","name":"verify-tags.sh","label":null,"uploader":{"login":"ravachol","id":9517715,"node_id":"MDQ6VXNlcjk1MTc3MTU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/x-shellscript","state":"uploaded","size":2569,"digest":"sha256:86295d70338c493c201f8a12a73a7e5af78f8d2dea0834c015bd0fc27e52726a","download_count":1,"created_at":"2026-10-22T23:22:17Z","updated_at":"2026-10-22T23:22:17Z"}],"body":"## kew 4.4.1\r\n\r\n- Fixes termux package not running. By @ravachol.\r\n\r\nTO PACKAGE MAINTAINERS:\r\n\r\nAfter releasing v4.4.1 I rewrote the git history with git filter-repo --invert-paths to remove large binary files that had been deleted long ago plus two animated gifs in the readme which I also deleted. These files made a fresh clone ~265 MB. It is now ~16 MB. The kew binary is ~1MB so having git download 265x seemed unreasonable to me. The issue for this cleanup is also the most upvoted one we've ever had.\r\n\r\nAll commit hashes from the first affected commit onward changed, including release tags. I\u2019m sorry if I surprised anyone.\r\n\r\nWhat was removed: only the paths listed in removed-paths.txt, mostly images (gifs and screenshots) and the website/ and pages/ directories. \r\n\r\nNo source files were touched. Commit authors, dates and messages are unchanged.\r\n\r\nHow to verify: with a clone of the old history, run verify-tags.sh (attached) in a clone of the new one. For every release tag it checks that the new tree is identical to the old one except for the files on the list, and that nothing was added or modified. Output from my run is in verify-output.txt, including old \u2192 new commit hashes for every tag.\r\n\r\nstable-musl is a floating tag that has always moved, and it isn\u2019t part of the comparison.\r\n\r\nThe old history is attached to the v4.4.1 release as a bundle. You can also still get the old history by running: git fetch origin 1cec5794b16a0f5b6957b3a466dc4918c20312c9, but this might be garbage collected at some point.\r\n\r\nIn short, to verify, run these commands:\r\n\r\nchmod +x verify-tags.sh\r\n./verify-tags.sh /path/to/your/old/kew removed-paths.txt stable-musl\r\n\r\nIt should say ok on each line and then problems: 0.","mentions_count":1}
