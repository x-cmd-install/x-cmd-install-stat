d6a934","download_count":13,"created_at":"2026-10-08T16:33:51Z","updated_at":"2026-10-08T16:33:53Z"},{"id":622380070,"node_id":"RA_kwDODKC0ec4lGMQm","name":"rpi-imager_2.0.12-1_source.buildinfo","label":null,"uploader":{"login":"tdewey-rpi","id":146750643,"node_id":"U_kgDOCL88sw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":9239,"digest":"sha256:28697af4fbd57325febab17548874cce9f70ac7c9cf89dc04cb149153d5757e8","download_count":7,"created_at":"2026-10-08T16:33:53Z","updated_at":"2026-10-08T16:33:53Z"},{"id":622380086,"node_id":"RA_kwDODKC0ec4lGMQ2","name":"rpi-imager_2.0.12-1_source.changes","label":null,"uploader":{"login":"tdewey-rpi","id":146750643,"node_id":"U_kgDOCL88sw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":8812,"digest":"sha256:6b9670a28465d2c5474ff17064f22a2e567477ed0b11d9fd59a4742dadf6df47","download_count":7,"created_at":"2026-10-08T16:33:53Z","updated_at":"2026-10-08T16:33:54Z"},{"id":622380163,"node_id":"RA_kwDODKC0ec4lGMSD","name":"rpi-imager_2.0.12.orig.tar.xz","label":null,"uploader":{"login":"tdewey-rpi","id":146750643,"node_id":"U_kgDOCL88sw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":5635184,"digest":"sha256:7010d7453b0ecfa1ef01546c9f651ec1eec66d7a3f1abf1fb4400ecbdbc66b39","download_count":13,"created_at":"2026-10-08T16:33:55Z","updated_at":"2026-10-08T16:33:55Z"},{"id":622380636,"node_id":"RA_kwDODKC0ec4lGMZc","name":"SHA256SUMS","label":null,"uploader":{"login":"tdewey-rpi","id":146750643,"node_id":"U_kgDOCL88sw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2485,"digest":"sha256:53b318c4ce1f6c1e1a59168dc00531e2d548827a7aa2ba5fcae9bd869fe80f7e","download_count":17,"created_at":"2026-10-08T16:34:01Z","updated_at":"2026-10-08T16:34:02Z"}],"body":"## What's changed\r\n  * Embedded (Raspberry Pi network installer):\r\n    - See a network that comes up late. Imager cached \"offline\" and only the\r\n      netlink monitor cleared it, which embedded mode never started, so a PHY\r\n      slow to negotiate (the Pi 5 Rev 1.2's MXL86110) was still down at the\r\n      first poll and the installer never saw a network at all.\r\n    - Wait for a usable address, not just a link, before fetching the OS list:\r\n      a link is up before DHCP answers, and the old check took a link-local\r\n      169.254 address for an IP.\r\n    - Hold the fetch back while the clock reads earlier than the source Imager\r\n      was built from. With no time service and no RTC battery a board boots at\r\n      1970, and every certificate is then not yet valid. The installer image\r\n      now sets the clock from downloads.raspberrypi.com before Imager starts.\r\n    - Try a failed first OS list fetch again after 30 seconds. Embedded has no\r\n      Retry button and stops polling once the network looks ready, so a fetch\r\n      made a moment too early was the only one there would be.\r\n    - Sign in to Raspberry Pi Connect with a code: a QR code, the address to\r\n      visit on any device and the short code, then wait for approval. The\r\n      browser sign-in cannot run without a browser or the rpi-imager:// scheme.\r\n    - Import SSH public keys from a GitHub username, since there is no\r\n      clipboard or file picker to bring a key in any other way. Unknown users,\r\n      accounts with no keys, network failures and replies that are not a key\r\n      list (a captive portal's page) are each reported and add nothing.\r\n    - Make the Done screen's Reboot button reboot. It ran /sbin/reboot, which\r\n      the installer image does not have, and ignored the failure.\r\n    - Fit the UI to its design canvas instead of the panel's DPI, so it is\r\n      laid out the same on every display.\r\n  * Raspberry Pi Connect:\r\n    - Write the access token from the device-code sign-in as rpi-connect's\r\n      state.json for the configured user. It is already signed in, and written\r\n      as auth.key it would be ignored. Auth keys still go to auth.key.\r\n    - Enable rpi-connect's units where `systemctl --user enable` puts them:\r\n      the sign-in path and wayvnc are wanted by rpi-connect.service, not by\r\n      paths.target and default.target, so is-enabled reports them correctly.\r\n    - Keep the step configured when its token has been spent.\r\n  * OS Customisation:\r\n    - Store and write the Wi-Fi passphrase rather than a PBKDF2-derived key.\r\n      A derived key cannot negotiate WPA3/SAE, so NetworkManager fell back to\r\n      WPA2 or failed on SAE-only networks. A key saved by an earlier version is\r\n      dropped from the settings file; a 64-hex raw key is still accepted.\r\n    - Escape the passphrase for NetworkManager's keyfile where imager_custom\r\n      writes it unescaped: a backslash or a leading space was lost on load.\r\n    - Write UTF-8 into cloud-init YAML as characters, not escapes.\r\n  * Write reliability:\r\n    - A cancelled write no longer reports success: a cancel during\r\n      customisation showed the done screen for a half-written device.\r\n    - Refuse a short download, and a truncated .img.xz -- the format every\r\n      Raspberry Pi image ships in -- instead of writing part of an image and\r\n      calling it a success. Size an image by its content, not its name.\r\n    - Stop an abandoned or timed-out write touching the caller's buffer or a\r\n      descriptor closed under it, and keep a failed write's errno; a failed\r\n      final flush no longer calls std::terminate().\r\n    - Linux: write sequentially at the logical cursor, reap io_uring\r\n      completions while waiting for a buffer slot, and wait for the partition\r\n      node before mounting after a format. Recycle ring buffer slots by\r\n      identity, and let the direct-I/O reopen fall back to a shared handle.\r\n    - Run the post-write eject in the background with live status; on macOS,\r\n      give slow drives time to flush, unmount off the main thread, skip queued\r\n      writes once cancelled and wait for pending writes before cleanup.\r\n    - Windows: record why a write failed, clear stale error codes, and detach\r\n      a virtual disk instead of ejecting its media.\r\n    - Trim a preallocated cache file to what was written, and replace the\r\n      cache file rather than following a link planted at its path.\r\n  * Security (elevated runs):\r\n    - Create the settings file as the invoking user, and reclaim ownership\r\n      without following links: root could be led to create it anywhere a\r\n      symlinked settings directory pointed, then hand it to the user.\r\n    - Read SSH keys and write exports as the invoking user, register the URI\r\n      handler as the user, keep trusted caches root-owned, and restore the\r\n      user's HOME under sudo and pkexec.\r\n    - Bound the sizes, lifetimes and inputs the write path trusts; refuse\r\n      malformed FAT, EEPROM and STP structures; on macOS, sign only a SHA-256\r\n      digest.\r\n  * Compute Module (rpiboot / fastboot):\r\n    - Follow the fastboot gadget through the bootstrap handover, so a board\r\n      part-way through it is not shown as an unrelated device; serve recovery\r\n      files the way recovery.bin asks for them.\r\n    - Report a bootstrap that failed and a flash that stopped part way; tell a\r\n      transport failure from a device denial; check for cancel between erase\r\n      stages.\r\n  * Interface and localisation:\r\n    - Describe internal eMMC as eMMC, not as an SD card reader, which invited\r\n      overwriting an eMMC system drive (#1658).\r\n    - Load the regional translation for a regional locale: Brazilian\r\n      Portuguese and Traditional Chinese never loaded (#1572). Match each\r\n      system language in turn, and translate the remaining Spanish strings.\r\n    - Share one label/field grid across the customisation steps, use the\r\n      width a resized window offers, elide rather than clip combo box text,\r\n      let footer buttons shrink for longer translations, and keep write\r\n      errors visible.\r\n    - Make nested step controls reachable by keyboard, keep the OS selection\r\n      across a list refresh, order a local OS list as its manifest does, and\r\n      set the window icon on Linux.\r\n  * Windows:\r\n    - Generate secure boot keys with CNG and drop OpenSSL; build boot.img in\r\n      process rather than through diskpart; installer improvements.\r\n  * Build / packaging:\r\n    - Move to Qt 6.11.2, carrying the qtbase fix for a fontconfig crash that\r\n      segfaulted the AppImage on some systems (#1756). Qt patches now fail the\r\n      build when they do not apply. Build testlib into every Qt.\r\n    - Extract the Qt source without restoring ownership, which the rootless\r\n      release chroots cannot do; fix the CLI-only build's missing include.\r\n    - Bundle the xcb helper libraries in AppImages, drop the stale libfuse2\r\n      dependency, and compress the macOS DMG without deprecated verbs.\r\n    - Vendor Nayuki's qrcodegen (MIT) for the Connect sign-in QR code.\r\n  * Testing:\r\n    - A test suite across the write path, extraction, FAT, rpiboot, fastboot,\r\n      the CLI, the QML wizard (QuickTest) and Windows, with opt-in coverage and\r\n      sanitiser builds. ThreadSanitizer runs found and fixed data races in the\r\n      CA bundle lookup, the icon fetcher and the drive list poll thread.\r\n\r\n## PRs\r\n* Ensure necessary submodule tags are fetched by @roliver-rpi in https://github.com/raspberrypi/rpi-imager/pull/1698\r\n* Translate remaining Spanish strings in Imager by @amah853 in https://github.com/raspberrypi/rpi-imager/pull/1626\r\n* fix(zstd): test the content-size sentinels by name by @elibosley in https://github.com/raspberrypi/rpi-imager/pull/1701\r\n* fastboot: tell a transport failure apart from a device denial by @elibosley in https://github.com/raspberrypi/rpi-imager/pull/1702\r\n* fix(io): let the direct-I/O reopen degrade to a shared handle by @elibosley in https://github.com/raspberrypi/rpi-imager/pull/1703\r\n* fix: a cancelled write no longer reports success by @elibosley in https://github.com/raspberrypi/rpi-imager/pull/1704\r\n* fix(linux): wait for the partition node before the post-format mount by @elibosley in https://github.com/raspberrypi/rpi-imager/pull/1705\r\n* feat(gui): run the post-write eject in the background with live status by @elibosley in https://github.com/raspberrypi/rpi-imager/pull/1685\r\n* 2.0.11.2: Prune bogus libfuse2 dependency by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1712\r\n* fix(locale): line up the localisation fields in one grid by @4RH1T3CT0R7 in https://github.com/raspberrypi/rpi-imager/pull/1714\r\n* Fixup 'long' translations by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1716\r\n* fix(windows): Show installer location page, check if known location is good before use by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1715\r\n* 2.0.12: Embedded mode scaling, Linux small-buffer async IO handling by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1717\r\n* Improve Windows installer by @bovirus in https://github.com/raspberrypi/rpi-imager/pull/1722\r\n* packaging: bundle the xcb helper libraries in AppImages by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1723\r\n* Dev/roliver/timeout hazards and coverage by @roliver-rpi in https://github.com/raspberrypi/rpi-imager/pull/1724\r\n* 2.0.12: Coverage grinding, bugfixes by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1730\r\n* Fix local manifest sorting for URL-encoded filenames by @phattmatt in https://github.com/raspberrypi/rpi-imager/pull/1728\r\n* 2.0.12: Fuzzing, TSAN & hardening by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1738\r\n* fix(customisation): write UTF-8 into cloud-init YAML as characters by @4RH1T3CT0R7 in https://github.com/raspberrypi/rpi-imager/pull/1745\r\n* Improve regional translation support by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1746\r\n* fix(drivelist): name internal eMMC as eMMC, not an SD card reader by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1750\r\n* Fix macOS crash when cancelling an SD card write by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1751\r\n* Replace the cache file instead of following links at its path by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1758\r\n* Do elevated file work in the user's home as the user by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1759\r\n* fix(fetch): distinguish URL normalisation from redirects by @yuefdev in https://github.com/raspberrypi/rpi-imager/pull/1737\r\n* fix(linux): reap io_uring completions while waiting for a ring buffer slot by @yuefdev in https://github.com/raspberrypi/rpi-imager/pull/1732\r\n* Turn picked file urls into paths, and build folder urls from paths by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1761\r\n* Hand back an elevated run's leftovers before ImageWriter starts by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1762\r\n* 2.0.12: macOS: cancelled write handling. by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1763\r\n* Set the window icon on Linux, resolved through PlatformQuirks by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1764\r\n* Move to Qt 6.11.2, carrying the fontconfig crash fix by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1765\r\n* Build testlib into every Qt by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1766\r\n* Fix three data races found by ThreadSanitizer by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1767\r\n* Fix the CLI-only build and Qt 6.11.2 extraction in the release chroots by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1769\r\n* Embedded: see a late link, wait for an address and a believable clock, retry the first OS list by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1768\r\n* Embedded: SSH keys from GitHub, a Reboot that reboots, and Connect sign-in with a phone by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1770\r\n* Store and write the Wi-Fi passphrase, not a derived PSK by @tdewey-rpi in https://github.com/raspberrypi/rpi-imager/pull/1747\r\n\r\n## New Contributors\r\n* @roliver-rpi made their first contribution in https://github.com/raspberrypi/rpi-imager/pull/1698\r\n* @amah853 made their first contribution in https://github.com/raspberrypi/rpi-imager/pull/1626\r\n* @phattmatt made their first contribution in https://github.com/raspberrypi/rpi-imager/pull/1728\r\n* @yuefdev made their first contribution in https://github.com/raspberrypi/rpi-imager/pull/1737\r\n\r\n**Full Changelog**: https://github.com/raspberrypi/rpi-imager/compare/v2.0.11.1...v2.0.12","reactions":{"total_count":12,"+1":5,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":3,"rocket":3,"eyes":0},"mentions_count":8}
