uploaded","size":30049807,"digest":"sha256:9008de778f83ccae01c0d92b0e9ea3f1708e912941bd22cfd2205052f9ef0c71","download_count":29,"created_at":"2026-10-13T17:20:41Z","updated_at":"2026-10-13T17:20:43Z"},{"id":637728830,"node_id":"RA_kwDOAKqaj84mAvg-","name":"hugo_withdeploy_0.168.0_linux-amd64.deb","label":"","uploader":{"login":"bep","id":394382,"node_id":"MDQ6VXNlcjM5NDM4Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":31362922,"digest":"sha256:277c142551b79ed0c83e94463e7d5ab2823d6a47609007b2d0466bb13984a532","download_count":45,"created_at":"2026-10-13T17:20:46Z","updated_at":"2026-10-13T17:20:48Z"},{"id":637728642,"node_id":"RA_kwDOAKqaj84mAveC","name":"hugo_withdeploy_0.168.0_linux-amd64.tar.gz","label":"","uploader":{"login":"bep","id":394382,"node_id":"MDQ6VXNlcjM5NDM4Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":30049807,"digest":"sha256:9008de778f83ccae01c0d92b0e9ea3f1708e912941bd22cfd2205052f9ef0c71","download_count":78,"created_at":"2026-10-13T17:20:41Z","updated_at":"2026-10-13T17:20:42Z"},{"id":637728841,"node_id":"RA_kwDOAKqaj84mAvhJ","name":"hugo_withdeploy_0.168.0_linux-arm64.deb","label":"","uploader":{"login":"bep","id":394382,"node_id":"MDQ6VXNlcjM5NDM4Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":28760856,"digest":"sha256:f33b4f334a00149aa7684bfec08e6b3e48063adfebf1580bd280531bb3eaed53","download_count":26,"created_at":"2026-10-13T17:20:47Z","updated_at":"2026-10-13T17:20:48Z"},{"id":637728656,"node_id":"RA_kwDOAKqaj84mAveQ","name":"hugo_withdeploy_0.168.0_linux-arm64.tar.gz","label":"","uploader":{"login":"bep","id":394382,"node_id":"MDQ6VXNlcjM5NDM4Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":27544426,"digest":"sha256:d3ef1453f6ec758e1248c72234fc2a5d54ad507502fee27a82eb48cfc588f986","download_count":27,"created_at":"2026-10-13T17:20:41Z","updated_at":"2026-10-13T17:20:43Z"},{"id":637728766,"node_id":"RA_kwDOAKqaj84mAvf-","name":"hugo_withdeploy_0.168.0_windows-amd64.zip","label":"","uploader":{"login":"bep","id":394382,"node_id":"MDQ6VXNlcjM5NDM4Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":31903923,"digest":"sha256:c6db5f4ae8a3a2117798c503dce4f54090fb736c316b0591500a495ae646a686","download_count":99,"created_at":"2026-10-13T17:20:44Z","updated_at":"2026-10-13T17:20:46Z"}],"body":"## Notable new features\r\n\r\n* New [`imaging.firstFrameOnly`](https://gohugo.io/configuration/imaging/#firstframeonly) option (and a matching processing flag) to only decode/encode the first frame of animated images. Hugo now also only decodes the first frame when the target format doesn't support animation, and fails early with an informative error if processing all frames would exceed the WASM memory limit.\r\n* New [`FrameCount`](https://gohugo.io/methods/resource/framecount/) method on images, e.g. to check if an image is animated.\r\n* [`site.Language`](https://gohugo.io/methods/site/language/) now has `Translate` and `Format*` methods, so you can e.g. range over `site.Languages` and translate into each language.\r\n* New `charset` option for [`js.Build`](https://gohugo.io/functions/js/build/) and [`css.Build`](https://gohugo.io/functions/css/build/).\r\n* Basic support for the OSC 7501 program status (working/done/idle/error) in terminals that support it, alongside the existing OSC 9;4 progress.\r\n\r\n## Security fixes\r\n\r\nThis release is built with Go 1.27.2, which includes [15 security fixes](https://seclists.org/oss-sec/2026/q4/101). The most relevant for Hugo are:\r\n\r\n* Two `html/template` escaping fixes, which also apply to Hugo's fork of the package: [CVE-2026-94448](https://github.com/golang/go/issues/81821) (context tracking not reset on consecutive expressions in JS template literals) and [CVE-2026-97030](https://github.com/golang/go/issues/81823) (`yield` not recognized as a regexp preceder keyword). Both could lead to incorrect escaping of inline JavaScript.\r\n* Several `net/http` fixes (HTTP/2 server crash and memory exhaustion, connection desynchronization, unbounded `Range` header parsing), relevant for `hugo server` and remote resources. The corresponding HTTP/2 fixes are also included via the upgrade of `golang.org/x/net` to v0.61.0.\r\n* [CVE-2026-56857](https://github.com/golang/go/issues/81739): `os.Root.Mkdir(All)` could follow junctions out of the root on Windows.\r\n\r\nAlso:\r\n\r\n* `github.com/tdewolff/minify` is upgraded to v2.24.19, which fixes [GHSA-3ppm-p7r9-c5w3](https://github.com/tdewolff/minify/releases/tag/v2.24.18): `</script>` (and `<!--`) inside inline scripts was not properly escaped (case-insensitively) when minifying JS in HTML.\r\n* Hugo now ignores `module.replacements` defined in themes; only the project can define replacements.\r\n\r\n## Changes\r\n\r\n* Fix PAGE.IsNode warning in jsonify 0732eadd @bep #15420 \r\n* hugolib: Fix rebuild when content is also mounted as assets ac62c804 @taekop #12838 \r\n* Fix deprecation issues in tests be8ffd62 @bep \r\n* circleci: Update config.yml to version 2.1 285d0efc @bep \r\n* warpc: Upgrade libavif, AOM, dav1d versions c94bdf92 @bep \r\n* warpc: Upgrade to javy 9.1.0 63fb71ca @bep \r\n* warpc: Upgrade to wasi-sdk-34 2f2f33b2 @bep \r\n* ci: Drop extended build tag on Windows tests 53aae446 @bep \r\n* Add imaging.firstFrameOnly and some animation performance improvements 13ee7e97 @bep #15433 \r\n* js, css: Add charset option to js.Build and css.Build 0688a8cd @bep #15435 \r\n* Add ImageResource.FrameCount c9f6e4d4 @bep #15430 \r\n* Add Translate and Format* methods to Language df8badea @bep #7844 \r\n* Add basic support for OSC 7501 program status d1024ae6 @bep #15425 \r\n* modules: Ignore module.replacements defined in themes 6883b55a @bep \r\n* Upgrade to Go 1.27.2 f44c355e @bep #15427 \r\n* ci: Add temporary workaround for staticcheck vs Go 1.27.2 46123a60 @bep \r\n* transform/metainject: Inject Hugo generator tag last in <head> 31f5395d @toddy15 \r\n* Make tests run on GOARCH 386 6b3ba3a7 @bep #15403 \r\n* Update vulnerability reporting instructions ec69d0e6 @bep \r\n\r\n## Dependency Updates\r\n\r\n* build(deps): bump golang.org/x/image from 0.46.0 to 0.47.0 2bbad501 @dependabot[bot] \r\n* build(deps): bump golang.org/x/mod from 0.41.0 to 0.42.0 030619b4 @dependabot[bot] \r\n* build(deps): bump golang.org/x/net from 0.59.0 to 0.61.0 13ef7079 @dependabot[bot] \r\n* build(deps): bump github.com/bits-and-blooms/bitset 846b1d74 @dependabot[bot] \r\n* build(deps): bump github.com/tdewolff/minify/v2 from 2.24.17 to 2.24.19 16441d2f @dependabot[bot] \r\n\r\n## Build Setup\r\n\r\n* snap: Update base to core26 8c88da37 @jmooring \r\n\r\n\r\n","reactions":{"total_count":15,"+1":3,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":4,"rocket":3,"eyes":0},"mentions_count":5}
