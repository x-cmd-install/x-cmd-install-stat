{"id":273736451,"author":{"login":"noraj","id":16578570,"node_id":"MDQ6VXNlcjE2NTc4NTcw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFZGD84QUOMD","tag_name":"v4.0.0","target_commitish":"master","name":"v4.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-01-01T22:06:54Z","updated_at":"2026-01-01T22:28:28Z","published_at":"2026-01-01T22:28:28Z","assets":[],"body":"## Highlights\r\n\r\n- 🍾 **Reached 675 hash types supported**\r\n- 📈 34 new hash types\r\n- ☑️ Many enhancements (add JtR or HC ref/id, better description, fixes) and better detection\r\n- 💎 Ruby 4.0 support\r\n\r\n## [Changelog](https://github.com/noraj/haiti/blob/master/docs/CHANGELOG.md#400)\r\n\r\n- **Breaking changes**:\r\n  - **Drop** Ruby 3.1 support, [EOL since 26/03/2025](https://www.ruby-lang.org/en/downloads/branches/) and no longer supported by minitest 6.x.x\r\n- **Additions**:\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. / Argon2d KDF / without keyfile [#220][#220]\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. / Argon2d KDF / with keyfile\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. / Argon2id KDF / without keyfile\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. / Argon2id KDF / with keyfile\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. / AES-KDF / without keyfile\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. / AES-KDF / with keyfile\r\n  - KeePass 2 (KDBX 3) / AES 256 enc. / AES-KDF / without keyfile\r\n  - KeePass 2 (KDBX 3) / Twofish 256 enc. / AES-KDF / without keyfile\r\n  - KeePass 2 (KDBX 3) / ChaCha20 256 enc. / AES-KDF / without keyfile\r\n  - Apache Shiro 1 SHA-512 [#215][#215]\r\n  - AS/400 DES [#222][#222]\r\n  - AS/400 SSHA1 [#222][#222]\r\n  - Blockchain, My Wallet, Legacy Wallets [#223][#223]\r\n  - Blockchain, My Wallet, Second Password (SHA256) [#223][#223]\r\n  - Blockchain, My Wallet, V2 [#223][#223]\r\n  - Blockchain, My Wallet [#223][#223]\r\n  - Cisco-ISE Hashed Password (SHA256) [#224][#224]\r\n  - sm3crypt, SM3 (Unix) [#225][#225]\r\n  - BLAKE2-256($salt.$pass) (blake2b) [#226][#226]\r\n  - BLAKE2-256($pass.$salt) (blake2b) [#226][#226]\r\n  - sha224(sha1($pass))\r\n  - bcrypt(HMAC-SHA256($pass)) / bcryptsha256 v2 [#227][#227]\r\n  - bcrypt(sha256($pass)) / bcryptsha256 [#227][#227]\r\n  - md5($salt1.$pass.$salt2) [#227][#227]\r\n  - md5($salt1.sha1($salt2.$pass)) [#227][#227]\r\n  - md5($salt1.strtoupper(md5($salt2.$pass))) [#227][#227]\r\n  - md5(md5($pass.$salt)) [#227][#227]\r\n  - md5(md5($salt).md5(md5($pass))) [#227][#227]\r\n  - md5(md5(md5($pass)).$salt) [#227][#227]\r\n  - md5(md5(md5($pass.$salt1)).$salt2) [#227][#227]\r\n  - md5(sha1($pass.$salt)) [#227][#227]\r\n  - md5(sha1($salt.$pass)) [#227][#227]\r\n  - md5(sha1(md5($pass))) [#227][#227]\r\n  - sha256(sha256($pass.$salt)) [#227][#227]\r\n  - sha512(sha512_bin($pass).$salt) [#227][#227]\r\n- **Enhancements**:\r\n  - OpenSSH private key\r\n    - Fix Regexp for large key size (reported by [lap1nou][lap1nou] on [#217][#217])\r\n  - BigCrypt\r\n    - Better description\r\n    - Add samples\r\n    - Fix available JtR format\r\n  - KeePass 2 (KDBX 4) / AES-Twofish-ChaCha20 256 enc. (Argon2d KDF & Argon2id KDF)\r\n    - Add HC support\r\n    - More precise regexp\r\n  - SAP CODVN H (PWDSALTEDHASH) iSSHA-512\r\n    - Add HC support\r\n  - BLAKE2-256 (blake2b) [#226][#226]\r\n    - Add HC support\r\n  - MD6-256\r\n    - Add HC support\r\n  - sha224($pass.$salt)\r\n    - Add HC support\r\n    - Fix regexp for salt\r\n  - sha224($salt.$pass)\r\n    - Add HC support\r\n  - sha224(sha224($pass))\r\n    - Add HC support\r\n  - md5($salt.md5($pass).$salt) [#227][#227]\r\n    - Add HC support\r\n    - Add sample\r\n  - md5(md5(md5($pass).$salt1).$salt2) [#227][#227]\r\n    - Add HC support\r\n    - Add sample\r\n  - sha512(sha512($pass).$salt) [#227][#227]\r\n    - Add HC support\r\n    - Add sample\r\n- **Chore**:\r\n  - Add support for Ruby 4.0\r\n\r\n[#217]:https://github.com/noraj/haiti/pull/217\r\n[lap1nou]:https://github.com/lap1nou\r\n[#215]:https://github.com/noraj/haiti/issues/215\r\n[#220]:https://github.com/noraj/haiti/issues/220\r\n[#222]:https://github.com/noraj/haiti/issues/222\r\n[#223]:https://github.com/noraj/haiti/issues/223\r\n[#224]:https://github.com/noraj/haiti/issues/224\r\n[#225]:https://github.com/noraj/haiti/issues/225\r\n[#226]:https://github.com/noraj/haiti/issues/226\r\n[#227]:https://github.com/noraj/haiti/issues/227\r\n\r\n## Media\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":1}}
