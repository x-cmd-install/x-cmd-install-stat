vas, jsPDF) are pinned to specific versions on jsdelivr with Subresource Integrity hashes and `crossorigin=\\\"anonymous\\\"`, so generated diagrams are tamper-resistant against CDN compromise\n\n## How to install\n\n1. Download `architecture-diagram.zip` from the assets below\n2. Go to [claude.ai](https://claude.ai) \u2192 **Customize \u2192 Skills**\n3. Click **+** \u2192 **+ Create skill** \u2192 **Upload a skill** and pick the zip\n4. Toggle the skill on","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
