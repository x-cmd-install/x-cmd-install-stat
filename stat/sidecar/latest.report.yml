ay omit Origin; refuse a terminal over the cap with 4429\n* 13adafdc6a0e39d666e18a6f280b8540cff78dd7 fix(uiapi): bound keepalive exemptions and cancel stalled streams\n* cf643397d72580e58c65d5c7b95d236590734cc0 fix(uiapi): compare the tailnet host allowlist case-insensitively\n* f3d875fbf97f6ddd326cdb329fe702da6a6b6886 fix(uiapi): describe served HEAD methods in OpenAPI\n* 1d724594b3ccc9e7c34f9d9588f60d8112588e85 fix(uiapi): forbid cross-site framing of the static UI\n* c742d7ca65913384932dc15b5f762b793ecee896 fix(uiapi): include evicted session streams in sign-out\n* f7c4b061a27fe9bffe3094f4c444417e803a40e9 fix(uiapi): interrupt event writes on credential revocation\n* ab98ee4ff3db07bccb656177c3071144a334a0e1 fix(uiapi): isolate fixture server authority from real state\n* cb23a7cf5ce57b9a17c45a4b82681c72a8da8aee fix(uiapi): keep catalog event observation free of state writes\n* 611c062d34ce05968a91dddae96f3812b2bc129e fix(uiapi): keepalive excuses a pong missed behind a blocked inbound pump\n* 87f34c46ccf2d89ff2da913a5e3c92933be68af9 fix(uiapi): only Authorization: Bearer with a token may omit Origin\n* 6ed8182850f6fa6da4da87a1e32c5c77c481d355 fix(uiapi): origin-bound bearer sessions, WebSocket keepalive and per-client limits\n* 0bc44e6230e7bcc68496c41b1167a286dfe0377d fix(uiapi): paired origins need their own token on the tailnet listener\n* 7c8382c72cea85284ccb48f67024d680331a2786 fix(uiapi): preserve layout planner refusal item verdicts\n* 07e3c1741b0eab636ffb6c199bcf895810fd711d fix(uiapi): preserve shutdown close when keepalive exits\n* d1794a752dffca1a4fa6a6eea47657d6e5cab943 fix(uiapi): re-pairing an origin closes the old token's streams\n* f8c3c0ac7732dc9e9463d9c6f798a9caba63c0a7 fix(uiapi): reject fixtures exceeding the byte limit\n* 7d3649b741a61614890f62b1012ab5368882d085 fix(uiapi): reject stale and replaced worktree roots\n* 1da9cf0d2f6d40a07b7e5000c44f2797d6ec301a fix(uiapi): reject tickets authorized before session revocation\n* 1d6c64df148ea7dd1a877