ions and refresh rebuilt UI roots\n* 046fcad272f670a0d2e8b0a4216891e310acd018 Preserve config recovery and privacy in UI service setup\n* 00bc85effa14db7d5b0be0621eee3ea7e2a0d54c Preserve opaque viewer attachments and disambiguate origin panes\n* ac3bbcf59a139debb54b278fa7c12ef7b43d00cb Preserve tree directory errors and distinguish layout storage failures\n* a7bfa97d3bcc33df90ac0f4257e00e92be982c64 Project managed shells into their durable owning worktree\n* ff0e5746efc07e9927fbf82bd0216211037291ed Purge browser bearers after eviction and revocation\n* feb4f238705365358892e3d678ef0b7bcab8e01e Refuse malformed UTF-8 before decoding viewer layouts\n* 3e06d748b3c277e2363c3e91a69531f206c62894 Refuse missing content watch targets beneath escaping symlinks\n* 70beb8763c47fb7dda6c1165899ea5621b44da8b Require browser key proof for memory-only session bearers\n* d207cfdc4f9c01d8871574f60cbf6130c107d7f1 Resolve diff parents to commit ids before they reach git\n* 9de675c48abfd8fecf8bde68cf61595cf53ff9ee Simplify UI service setup and document custom Sidecar clients\n* 5975e93102c5ac40b3e4f05072c9eb1e55810950 Synchronize blocked persistence and load-sensitive proof fixtures\n* 19a946158a2c647c6fb9d2fd7b53a282a3004db0 Verify shell sockets and preserve legacy workspace fallback\n* 590d92bfcacfe6b4dfe7a5edfe6e92594523b437 Verify the loopback startup deadline at the CLI boundary\n* 7ce83e4501acef880beec27875cf65bcc2f609d1 deps: tasks v1.19.0\n* d129b87b45940bfe2414c0f8ec148ba4859fda28 feat(api): manage per-user services and restart on binary replacement\n* cebb198775cb8844f1515175a1b2f60080b3b5f0 feat(api): reserve service listeners across binary restarts\n* dd85281f311b3c6aa1ce1eafa1b5de58ab27537d feat(mobile): arbitrate presence and deliver negotiated v1 terminals\n* 37a49a45b26d2b5e966ab52305b6e2785c2f485d feat(mobileproto): define negotiated terminal v1 contract and fixtures\n* b432a31e15b7e497cf3a3001699a4e9baeb095a1 feat(mobileproto): pin the reset reason vocabulary\n* 308447dc47e64c8fd0f4a470c06298d5899af414 feat(ui-api): serve project workspaces and guarded operations\n* 6d851fc21479cf7e0e718ce09d86a1a85017f401 feat(uiapi): generate public schemas and serve deterministic fixtures\n* 4cbb8c00a163c10cd1977ad54c6eaa81a4f11c75 feat(uiapi): integrate events spec and catalog owner paths\n* 5cb45d029725fe73e3d9c63ab289f870a4234425 feat(uiapi): push Sessions, attention and terminal events\n* c8f58e1b90ab8ba5fa1debec0cb8347d192175f5 feat(uiapi): relay agent pane requests to the focused API viewer\n* 5653c34b93833de95d9666c4341434bf072225e1 feat(uiapi): revoke browser sessions without restarting the server\n* c07b783dce182eeb9fa65c2c669fee85832fc195 feat(uiapi): revoke paired origin terminals and unused tickets\n* 3cc2f4f4620033c8a90c8d01065cde168b554ce0 feat(uiapi): sidecar api serve with guarded listeners, pairing and terminal WebSocket\n* 1db6671c8d5444d27aa5945c4baae0b248649a19 fix(agent): preserve literal arguments after terminator (td-66d7e3)\n* 441e4882a9c49484e73911a929cf75eb58599033 fix(agentcontrol): observe provider exits between startup polls\n* 3eecc67d14fb71f7c44be4fc8cc7c7211a8e10c4 fix(agents): isolate Codex launches and refuse conflicting caller identity\n* 7a026d0f0bc4ac3c1aeca8042c9890daafb68f26 fix(api): candidate refresh reads current shell reservations\n* fd0958be18b771b5c362d1fe49ec5c0601cac390 fix(api): project reads ignore TUI instance count; hub lookup failures retry\n* 1f6154a2a174c9e8979d1ffdec983886af8620e8 fix(api): project routes accept the project key or its name (td-778992)\n* 8ae95c03305f7fde0515106181dc8b57dec188b2 fix(api): re-derive worktree candidates per request from a fresh pane listing\n* 86b6cbff4d472cafc5968882b03c74cd5c95fb65 fix(api): refuse service installation beside undiscovered foreground servers\n* b0f5d9c1564823ace84ae147cee115fd10847a08 fix(api): reinstalling a running service waits for launchd to release it\n* 8dbf290fd4bad10a0f844a29b925b6e096a26659 fix(api): review fixes for workspace hub rows, owner refusals and the activation probe (td-8893e8)\n* f9bb517b2f335cad28025fe5b438df5abebad605 fix(api): saved layouts accept hub-scoped terminal identities\n* b09b3b890f9c47c77002aa38f3b4dd3fc57c7be5 fix(api): share collected catalog data, never authorization state\n* 8c056ecd1d7c8a25f352797ec629996c7dee7434 fix(api): the launchd service starts and reports itself on current macOS\n* b63073d26934c9b3b05c7eff91321ead3944bb1e fix(api): validate activated socket family and stream type\n* 4c5ef8e97e2d410bb7dac20159ca93312cd3a530 fix(api): workspace terminals attach through the hub like /sessions rows\n* 341214203586288c405e88e06ba4998164e2cb80 fix(apiservice): keep only owner-controlled PATH entries in the service\n* 63ebe48c2129a086268b8f8785c58d02427f0e47 fix(apiservice): use the com.haplab.sidecar.api label, matching the app's bundle namespace\n* 4cd705875de1c0b6a73c782d08e031113dc188d8 fix(cli): an unfocused API viewer no longer blocks the remote lease relay\n* 9ac6bb2aecc939a49f31d618d2434a991c8decad fix(cli): keep caller files absolute for an unrooted destination\n* be7892f4bcd23fe360b8acc7a12418a2088db92d fix(cli): resolve existing relative open files from the caller\n* 957f73ac8fdca9bff29c4e21a97408204a98cf3f fix(content): preserve Git-quoted diff file paths\n* bc9ec34426580f80c6df52a97fb4a70859ef70f2 fix(mobile): a foreign resize ends the wait for an expected geometry\n* dfdb6293aa0b3e75ea6959efa0b106591dfc4edc fix(mobile): bound the one-shot sessions query's backend setup\n* 03312c1e3fee023af4c4c59df2835d12a01cb65c fix(mobile): end the reseed when a capture's target is gone\n* cb4043517fa5469530f376df26f9b0d2fb8d3892 fix(mobile): normalize server paste boundaries and line endings\n* 6ae0f3136cc95e765b96a3135c1dbfe0ccf3a201 fix(mobile): reseed after a capture failure; a failed release keeps its sequence\n* 49b9335b643cd3591505b7867745ce52893cf4a7 fix(mobile): revalidate capture failures independently of dead transport\n* 7b1b5486bbf1eca60e21d16ca4ed237c1c