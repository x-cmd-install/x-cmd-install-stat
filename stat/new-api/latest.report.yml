DOKr-Pws4g0CmC","name":"new-api-arm64-v1.0.0-rc.36","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":125894921,"digest":"sha256:a08ebbbf64a5ae5c6f125fc74d78caf318856be18ca25bd587880f22c92f13b8","download_count":49,"created_at":"2026-09-08T13:01:51Z","updated_at":"2026-09-08T13:01:56Z"},{"id":550512869,"node_id":"RA_kwDOKr-Pws4g0Cjl","name":"new-api-macos-v1.0.0-rc.36","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":153217106,"digest":"sha256:179b4d5962947a8926bd2b102e50511b6e699f9bc0d734e27e51e828f8ba5e9a","download_count":91,"created_at":"2026-09-08T13:01:45Z","updated_at":"2026-09-08T13:01:51Z"},{"id":550513025,"node_id":"RA_kwDOKr-Pws4g0CmB","name":"new-api-v1.0.0-rc.36","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129888521,"digest":"sha256:5d9b254721c205f4f442848a4af5b58617a8c0ee090366732cfff90455e957f3","download_count":329,"created_at":"2026-09-08T13:01:51Z","updated_at":"2026-09-08T13:01:56Z"},{"id":550515478,"node_id":"RA_kwDOKr-Pws4g0DMW","name":"new-api-v1.0.0-rc.36.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":131968000,"digest":"sha256:fac81f1bcaa654857c59e94c705dc2bf9e3c82c101fc863c80449c182e7df371","download_count":632,"created_at":"2026-09-08T13:03:24Z","updated_at":"2026-09-08T13:03:30Z"}],"body":"> [!IMPORTANT]\r\n> **Task Plugins & Pricing / \u4efb\u52a1\u63d2\u4ef6\u4e0e\u5b9a\u4ef7**\r\n>\r\n> \u672c\u7248\u672c\u5b8c\u5584\u4efb\u52a1\u63d2\u4ef6\u4e0e\u63d2\u4ef6\u5e02\u573a\uff1a\u63d2\u4ef6\u56fe\u6807\u3001\u63d2\u4ef6\u5b98\u7f51\u3001\u63d2\u4ef6\u5143\u6570\u636e\u4e0e\u80fd\u529b\uff0c\u521b\u5efa\u6e20\u9053\u65f6\u53ef\u5e26\u51fa\u5bf9\u5e94\u63d2\u4ef6\u4fe1\u606f\u3002\u540c\u65f6\u6539\u8fdb\u6a21\u578b\u7ba1\u7406\u3001\u76ee\u5f55\u5c55\u793a\u4e0e\u5e7f\u573a\u5c55\u793a\u3001\u5b9a\u4ef7\u914d\u7f6e\uff0c\u4ee5\u53ca API \u5bc6\u94a5\u4e0e\u7528\u6237\u989d\u5ea6\u3001\u4f7f\u7528\u65e5\u5fd7\u3001\u5151\u6362\u7801\u3002\u5b9a\u4ef7\u8d27\u5e01\u53ef\u5207\u6362\u4e3a\u7ad9\u70b9\u8d27\u5e01\u4ee5\u4fbf\u5f55\u5165\u548c\u67e5\u770b\uff0c\u989d\u5ea6\u4ecd\u6309\u7f8e\u5143\u6263\u8d39\u3002\r\n>\r\n> This release improves Task Plugins and the Marketplace: Plugin icon, Plugin website, Plugin metadata, and Capabilities, plus matching plugin info when creating a Channel. It also improves Model management, Catalog visibility, Model square visibility, Pricing Configuration, Quota on API Keys and users, Usage Logs, and Redemption Codes. Pricing currency can switch to Site currency for entry and review; Quota is still deducted in USD.\r\n\r\n> [!WARNING]\r\n> **Experimental Plugin System / \u5b9e\u9a8c\u6027\u63d2\u4ef6\u7cfb\u7edf**\r\n>\r\n> \u81ea v1.0.0-rc.27 \u8d77\u5f15\u5165\u7684\u5b9e\u9a8c\u6027\u63d2\u4ef6\u7cfb\u7edf\u4ecd\u5904\u4e8e\u6d4b\u8bd5\u9636\u6bb5\uff0c\u5e76\u6d89\u53ca\u8f83\u5927\u7684\u67b6\u6784\u8c03\u6574\u3002\u5982\u9047\u95ee\u9898\uff0c\u8bf7\u53ca\u65f6\u53cd\u9988\u3002\r\n>\r\n> \u4ece v1.0.0-rc.26 \u6216\u66f4\u65e9\u7248\u672c\u5347\u7ea7\u7684\u7528\u6237\uff0c**\u5fc5\u987b\u91cd\u65b0\u914d\u7f6e\u6240\u6709\u89c6\u9891\u6a21\u578b\u4ef7\u683c**\uff1b\u5df2\u5b8c\u6210\u8be5\u914d\u7f6e\u7684\u7528\u6237\u65e0\u9700\u91cd\u590d\u64cd\u4f5c\u3002**\u672c\u7248\u672c\u4ecd\u4e0d\u63a8\u8350\u7528\u4e8e\u751f\u4ea7\u73af\u5883\u3002**\r\n>\r\n> The experimental plugin system introduced in v1.0.0-rc.27 remains under testing and includes major architectural changes. Please report any issues promptly.\r\n>\r\n> Users upgrading from v1.0.0-rc.26 or earlier **must reconfigure all video model prices**. Users who have already completed this step do not need to repeat it. **This release is still not recommended for production use.**\r\n\r\n## New Features\r\n\r\n* Improved Task Plugins and the Marketplace: Plugin metadata, Plugin website, Plugin icon (including optional `icon.svg` / `icon.png`), integrity checks, Capabilities, and clearer install/update flows.\r\n* Improved Channel setup for Task Plugins so a new Channel picks up the matching Plugin icon and Plugin metadata.\r\n* Added Site currency in Pricing Configuration. Display and conversion use the site exchange rate; stored prices remain in USD.\r\n* Improved Model management, pricing display, Catalog visibility, and Model square visibility. Channel-configured models appear without creating catalog metadata first. The Model square can show Pricing by condition, usage prices, and visibility reasons.\r\n* Added a searchable Group filter on Usage Logs. Suggestions come from the current view; historical Group names can still be typed in.\r\n* Refined the Usage Logs mobile layout so filters and quick actions stay available.\r\n* Refined Quota display on API Keys and users: Remaining quota and used amounts, progress bars, Group ratio badges, and activity timestamps. Full API Keys are resolved only for explicit copy or chat actions.\r\n* Added confirmed batch deletion for Redemption Codes, plus an optional Save as a file step (TXT / Markdown) after creation.\r\n\r\n## Fixes and Improvements\r\n\r\n* Show desktop API Keys Remaining quota and used amounts side by side, with more room and consistent cell spacing. Mobile stacked labels are unchanged.\r\n* Unified table cells and Quota details across list pages.\r\n\r\n---\r\n\r\n**Full Changelog**: [v1.0.0-rc.35...v1.0.0-rc.36](https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.35...v1.0.0-rc.36)","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
