40","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":134545673,"digest":"sha256:8689cc98471806eb03093849abdcfe974e582b85571b44da0d1816b21b360227","download_count":156,"created_at":"2026-09-21T15:15:53Z","updated_at":"2026-09-21T15:15:58Z"},{"id":579286353,"node_id":"RA_kwDOKr-Pws4ihzVR","name":"new-api-macos-v1.0.0-rc.40","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":162232162,"digest":"sha256:2e376fb08c5a6384fa03c34c317cbae9c1cd06256290659727f4cc5c779572ec","download_count":138,"created_at":"2026-09-21T15:16:13Z","updated_at":"2026-09-21T15:16:20Z"},{"id":579285784,"node_id":"RA_kwDOKr-Pws4ihzMY","name":"new-api-v1.0.0-rc.40","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":138670345,"digest":"sha256:a5fd598cc77e26ab2709305049fdd5fbbff722111be79f0ad89a493c3e094529","download_count":680,"created_at":"2026-09-21T15:15:53Z","updated_at":"2026-09-21T15:15:58Z"},{"id":579287152,"node_id":"RA_kwDOKr-Pws4ihzhw","name":"new-api-v1.0.0-rc.40.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":140763648,"digest":"sha256:dfc0c3803f49f667bde64eb87047b5cc8f5d1fbd061dd8a59acd3dc387e8f4c8","download_count":1247,"created_at":"2026-09-21T15:16:42Z","updated_at":"2026-09-21T15:16:47Z"}],"body":"> [!IMPORTANT]\r\n> **Task Plugins / \u4efb\u52a1\u63d2\u4ef6**\r\n>\r\n> \u4efb\u52a1\u63d2\u4ef6\u6e90\u7801\u4e0a\u9650\u63d0\u9ad8\u5230 8 MiB\uff0c\u66f4\u5927\u7684\u63d2\u4ef6\u53ef\u4ee5\u6b63\u5e38\u4e0a\u4f20\u548c\u4fdd\u5b58\u3002\r\n> \u4e0a\u6e38\u63d0\u4ea4\u8fd4\u56de 201 / 202 \u7b49\u6210\u529f\u72b6\u6001\u65f6\uff0c\u4efb\u52a1\u4f1a\u6b63\u5e38\u7ee7\u7eed\uff0c\u4e0d\u518d\u88ab\u5f53\u6210\u5931\u8d25\u3002\r\n>\r\n> \u5b9a\u4ef7\u914d\u7f6e\u5728\u4efb\u52a1\u63d2\u4ef6\u6536\u7a84\u53ef\u9009\u9879\u540e\uff0c\u4ecd\u53ef\u7f16\u8f91\u5269\u4e0b\u7684\u6863\u4f4d\u548c\u4ef7\u683c\uff0c\u4e0d\u4f1a\u6574\u8868\u6253\u4e0d\u5f00\u3002\r\n> Claude / Responses \u91cc\u5de5\u5177\u7ed3\u679c\u4e2d\u7684\u56fe\u7247\u4f1a\u6309\u56fe\u7247\u9001\u7ed9\u4e0a\u6e38\uff0c\u4e0d\u518d\u5f53\u6210\u6587\u672c\u3002\r\n>\r\n> Task Plugin source uploads now allow up to 8 MiB, so larger plugins can be saved.\r\n> A 2xx upstream submit status such as 201 / 202 is accepted, so the task continues instead of failing.\r\n>\r\n> Pricing Configuration stays editable after a Task Plugin narrows its options; remaining tiers keep their prices.\r\n> Images in Claude / Responses tool results are sent upstream as images, not as text.\r\n\r\n## New Features\r\n\r\n* Raised the Task Plugin source upload limit to 8 MiB. After upload, Activate now is available.\r\n* Accept any 2xx upstream status on task submission, including 201 Created and 202 Accepted ([#7478](https://github.com/QuantumNous/new-api/issues/7478)).\r\n\r\n## Fixes and Improvements\r\n\r\n* Keep Pricing Configuration editable after a Task Plugin drops enum values. Unreachable branches are skipped; remaining prices are preserved.\r\n* Send Claude `tool_result` images and Responses tool-output media upstream as images, not as text ([#7512](https://github.com/QuantumNous/new-api/issues/7512), [#7510](https://github.com/QuantumNous/new-api/issues/7510)).\r\n* Keep upstream metadata in Alibaba OpenAI Images render ([#7507](https://github.com/QuantumNous/new-api/issues/7507)).\r\n* Resolve safe constants in plugin metadata previews. Isolate theme preferences in local storage. Include provider icons in Windows builds.\r\n\r\n---\r\n\r\n## What's Changed\r\n* test(billing): fix websocket rejection refund test after pre-consume dropped output estimation by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7491\r\n* fix(plugins/alibaba): keep upstream metadata in openai_image render by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7507\r\n* fix(relayconvert): Responses\u2192Chat \u5de5\u5177\u8f93\u51fa\u56fe\u7247\u6539\u4e3a\u63d0\u5347\u5230\u540e\u7eed user \u6d88\u606f by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7510\r\n* fix(relayconvert): Claude tool_result \u56fe\u7247\u63d0\u5347\u5230 user \u6d88\u606f\uff1bChat\u2192Responses \u6d41\u8865\u9f50 reasoning part \u4e8b\u4ef6\u5e76\u6309\u6bb5\u5207\u5206 item by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7512\r\n\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.39...v1.0.0-rc.40","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":2}
