4","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132186377,"digest":"sha256:4ac2f82ff4cfbcf85d1b24459be92fd75fda9c01fb0601d7c45e344e365cdca4","download_count":141,"created_at":"2026-10-12T13:42:11Z","updated_at":"2026-10-12T13:42:17Z"},{"id":633905813,"node_id":"RA_kwDOKr-Pws4lyKKV","name":"new-api-macos-v1.0.0-rc.44","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":159847122,"digest":"sha256:f5227b4516434e2b38f7677b172f8cfe7e2ca9f8c60c348ad33799813411a889","download_count":138,"created_at":"2026-10-12T13:41:53Z","updated_at":"2026-10-12T13:42:01Z"},{"id":633906401,"node_id":"RA_kwDOKr-Pws4lyKTh","name":"new-api-v1.0.0-rc.44","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":136376585,"digest":"sha256:d16189ecc6f0597c05e33e5e7ab8ee02e8ad2cc5085a9475f83b4793966a2d96","download_count":940,"created_at":"2026-10-12T13:42:11Z","updated_at":"2026-10-12T13:42:16Z"},{"id":633908401,"node_id":"RA_kwDOKr-Pws4lyKyx","name":"new-api-v1.0.0-rc.44.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":138245632,"digest":"sha256:e5a2ac5059ff4e487bc3fe25378123740b510a0fd62c3bd9b735ba8182f212f3","download_count":1212,"created_at":"2026-10-12T13:43:04Z","updated_at":"2026-10-12T13:43:09Z"}],"body":"> [!IMPORTANT]\r\n> **v1 Coming Soon & Log Export / v1 \u5373\u5c06\u53d1\u5e03\u4e0e\u65e5\u5fd7\u5bfc\u51fa**\r\n>\r\n> v1 \u6b63\u5f0f\u7248\u5373\u5c06\u53d1\u5e03\uff0c\u73b0\u5728\u662f\u6700\u540e\u51e0\u4e2a RC \u7248\u672c\u3002\r\n>\r\n> \u4f7f\u7528\u65e5\u5fd7\u652f\u6301\u5bfc\u51fa CSV\u3002\u53ef\u4ee5\u5728\u65e5\u5fd7\u7ef4\u62a4\u91cc\u8bbe\u7f6e\u662f\u5426\u5141\u8bb8\u7528\u6237\u5bfc\u51fa\uff0c\u4ee5\u53ca\u65e5\u5fd7\u6700\u957f\u65f6\u95f4\u8303\u56f4\uff0c\u9ed8\u8ba4 365 \u5929\u3002\u666e\u901a\u7528\u6237\u7684\u65e5\u5fd7\u67e5\u8be2\u3001\u5bfc\u51fa\u548c\u6570\u636e\u770b\u677f\u90fd\u6309\u8fd9\u4e2a\u8303\u56f4\u9650\u5236\u3002\r\n>\r\n> \u6e38\u4e50\u573a\u7684\u6570\u636e\u6309\u8d26\u53f7\u5206\u5f00\u4fdd\u5b58\uff0c\u5347\u7ea7\u540e\u4e4b\u524d\u7684\u804a\u5929\u8bb0\u5f55\u4f1a\u6e05\u7a7a\u4e00\u6b21\u3002\r\n>\r\n> Claude \u8bf7\u6c42\u6309\u6a21\u578b\u652f\u6301\u7684\u6863\u4f4d\u53d1\u9001\u601d\u8003\u5f3a\u5ea6\u3002\u53d1\u7ed9 Gemini \u7684\u5de5\u5177\u548c\u7ed3\u6784\u5316\u8f93\u51fa\u4fdd\u7559\u5b8c\u6574\u7684 JSON Schema\u3002\r\n>\r\n> v1 is coming soon. These are the last few release candidates.\r\n>\r\n> Usage logs can be exported as CSV. In Log Maintenance you can choose whether users may export and set the longest log time range, 365 days by default. Regular users' log searches, exports, and dashboard charts all follow that range.\r\n>\r\n> Playground data is stored per account. Earlier Playground history is cleared once after the upgrade.\r\n>\r\n> Claude requests get the thinking effort each model accepts. Tools and structured output sent to Gemini keep their full JSON Schema.\r\n\r\n## New Features\r\n\r\n* The usage log page has an Export button next to Search. It downloads the current view, with the page's filters and a chosen time range, as a CSV file in the viewer's language. Users export their own logs, and administrators in the all-users view export every user's logs. Each user runs one export at a time, across tabs and, with Redis, across nodes ([#7774](https://github.com/QuantumNous/new-api/issues/7774)).\r\n* Log Maintenance adds Allow users to export logs (on by default) and Longest log time range (days) (365 by default). Regular users' log searches had no limit before. Their searches, exports, and dashboard usage and traffic charts now share this range. The page is split into Log recording, Log search and export, history log cleanup, and server log management.\r\n* Date and time pickers, including the date range filter on log pages, work down to the second.\r\n\r\n## Fixes and Improvements\r\n\r\n* Known Claude models get the nearest thinking effort they accept, and none when they accept none. This fixes 400s on Opus 4.5 with `max` or `xhigh`, on Sonnet 4.5 and Haiku 4.5, and when a model suffix or modifier turns thinking off. Native Claude requests without a suffix or modifier pass through as sent.\r\n* Claude Haiku 5.5 uses adaptive thinking with medium effort by default. Converted requests drop `temperature`, `top_p`, and `top_k` for it. Gemini 2.5 Pro gets a 32768 thinking budget for `xhigh` and `max`.\r\n* Tools and structured output sent to Gemini keep `const`, `oneOf`, `$ref`, `$defs`, type arrays, and non-string enums. A schema that Gemini's typed Schema can hold is sent as before, and any other schema goes in `parametersJsonSchema` or `responseJsonSchema`. Models set to Gemini API v1 get a cleaned schema and a conversion warning ([#7455](https://github.com/QuantumNous/new-api/issues/7455), [#7704](https://github.com/QuantumNous/new-api/issues/7704)).\r\n* Responses images sent to Chat Completions upstreams use the object form of `image_url`, so vLLM and strict gateways accept Codex screenshots and tool images ([#7578](https://github.com/QuantumNous/new-api/issues/7578)).\r\n* Chat streams converted to Claude Messages keep answer text that arrives in the same chunk as the last reasoning token ([#7664](https://github.com/QuantumNous/new-api/issues/7664)). Claude Messages converted to Chat Completions keep assistant text next to tool calls ([#6871](https://github.com/QuantumNous/new-api/issues/6871)).\r\n* Claude requests forward `thinking.block_binding` and every `anthropic-beta` header value. This fixes \"The block is bound to a different conversation\" in multi-turn conversations whose system prompt or tools change ([#7732](https://github.com/QuantumNous/new-api/issues/7732)).\r\n* Responses WebSocket sessions send a close frame when the server ends them, so Codex sees a normal close ([#7642](https://github.com/QuantumNous/new-api/issues/7642)).\r\n* Without Redis, model rate-limit 429s carry the same error message and log line as with Redis ([#7721](https://github.com/QuantumNous/new-api/issues/7721)).\r\n* The console reloads once when a page's code fails to load, and the error page shows a status code only when there is one ([#7634](https://github.com/QuantumNous/new-api/issues/7634)).\r\n* The wallet, security, and OAuth callback pages and the user binding dialog load much less JavaScript. Linux DO bindings show the Linux DO logo.\r\n* Date pickers and relative times follow the interface language ([#7654](https://github.com/QuantumNous/new-api/issues/7654)).\r\n* The model square shows the latest 24 hourly status samples within 7 days, with no gaps. Expression model cards show the cache read price ([#7757](https://github.com/QuantumNous/new-api/issues/7757)).\r\n* Usage log previews keep the recorded billing tiers ([#7763](https://github.com/QuantumNous/new-api/issues/7763)), and task settlement logs show tiered billing ([#7446](https://github.com/QuantumNous/new-api/issues/7446)).\r\n* Pricing conversion accepts model metadata that declares endpoints as an array ([#7724](https://github.com/QuantumNous/new-api/issues/7724)). Root can manage pricing while the model square is disabled ([#7761](https://github.com/QuantumNous/new-api/issues/7761)).\r\n* Performance metrics count streams that finished before the client disconnected ([#7638](https://github.com/QuantumNous/new-api/issues/7638)).\r\n* The Sign in button on password login stays clickable and shows the legal consent warning ([#7771](https://github.com/QuantumNous/new-api/issues/7771)).\r\n* The Auto font uses the browser's sans-serif again. Meta Muse Spark models show the Meta icon ([#7734](https://github.com/QuantumNous/new-api/issues/7734)), and billing source icons line up on mobile ([#7760](https://github.com/QuantumNous/new-api/issues/7760)).\r\n* Dependency updates, including Electron 41.\r\n\r\n---\r\n\r\n## What's Changed\r\n* fix(gemini): OpenAI \u5de5\u5177\u53c2\u6570\u8f6c\u6362\u4e22\u5f03\u975e\u5b57\u7b26\u4e32 enum\uff0c\u4fee\u590d\u5e03\u5c14\u679a\u4e3e\u81f4\u4e0a\u6e38 400 by @zhaoruizhe81 in https://github.com/QuantumNous/new-api/pull/7729\r\n* fix(web): map Meta Muse Spark models to Meta icon by @i-richardwang in https://github.com/QuantumNous/new-api/pull/7734\r\n* fix(web): show cache read price on expression model cards by @i-richardwang in https://github.com/QuantumNous/new-api/pull/7757\r\n* fix(metrics): count completed streams after context cancellation by @jimmyleocn in https://github.com/QuantumNous/new-api/pull/7638\r\n* fix(logs): vertically align billing source icons on mobile by @seefs001 in https://github.com/QuantumNous/new-api/pull/7760\r\n* fix: mark task settlement logs with is_task for tiered billing display by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7446\r\n* fix(pricing): allow root access when the square is disabled by @seefs001 in https://github.com/QuantumNous/new-api/pull/7761\r\n* fix(relaykit): preserve assistant text with tool calls by @enwaiax in https://github.com/QuantumNous/new-api/pull/6871\r\n* fix(web): preserve recorded billing tiers in usage log previews by @seefs001 in https://github.com/QuantumNous/new-api/pull/7763\r\n* chore(web): bump @lobehub/icons to 5.22.0 by @i-richardwang in https://github.com/QuantumNous/new-api/pull/7764\r\n* fix(pricing): accept declared endpoint arrays in pricing conversion by @JohnUncle in https://github.com/QuantumNous/new-api/pull/7724\r\n* fix(ci): stabilize checks and configure Bun dependency updates by @seefs001 in https://github.com/QuantumNous/new-api/pull/7765\r\n* fix(auth): show legal consent warning on password login by @seefs001 in https://github.com/QuantumNous/new-api/pull/7771\r\n* fix(claude): forward thinking.block_binding and every anthropic-beta value by @RedwindA in https://github.com/QuantumNous/new-api/pull/7732\r\n* chore(deps-dev): bump @xmldom/xmldom from 0.8.13 to 0.8.15 in /electron by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7187\r\n* build(deps): bump yace from 1.1.0 to 1.1.1 in /web by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7770\r\n* build(deps): bump stream-markdown-parser from 1.1.3 to 1.2.18 in /web by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7769\r\n* build(deps-dev): bump @tanstack/router-plugin from 1.168.23 to 1.168.42 in /web by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7768\r\n* build(deps-dev): bump oxfmt from 0.57.0 to 0.72.0 in /web by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7766\r\n* chore(deps-dev): bump electron from 39.8.10 to 41.10.6 in /electron by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7625\r\n* chore(deps-dev): bump fast-uri from 3.1.5 to 3.1.7 in /electron by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7169\r\n* chore(deps): bump github.com/gorilla/websocket from 1.5.0 to 1.5.3 by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7001\r\n* chore(deps): bump ai from 7.0.31 to 7.0.136 in /web by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7767\r\n* chore(deps-dev): bump brace-expansion from 1.1.16 to 1.1.21 in /electron by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7623\r\n* chore(deps-dev): bump js-yaml from 4.3.1 to 4.3.2 in /electron by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7327\r\n* chore(deps-dev): bump undici from 6.28.0 to 6.29.0 in /electron by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7624\r\n* feat(logs): export usage logs from the common log page by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7774\r\n\r\n## New Contributors\r\n* @zhaoruizhe81 made their first contribution in https://github.com/QuantumNous/new-api/pull/7729\r\n* @i-richardwang made their first contribution in https://github.com/QuantumNous/new-api/pull/7734\r\n* @JohnUncle made their first contribution in https://github.com/QuantumNous/new-api/pull/7724\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.43...v1.0.0-rc.44","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":10}
