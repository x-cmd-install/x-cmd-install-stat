me":"new-api-arm64-v1.0.0-rc.39","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":134545673,"digest":"sha256:f9d006b42f248f97eedeaf5b4e37b623f6503bf02a048d9be1e82f4ed47e893a","download_count":21,"created_at":"2026-09-20T14:27:42Z","updated_at":"2026-09-20T14:27:47Z"},{"id":576956833,"node_id":"RA_kwDOKr-Pws4iY6mh","name":"new-api-macos-v1.0.0-rc.39","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":162198402,"digest":"sha256:09a84c1d34c7c6113a61b72deb814bd4642231ba9e2edcac0c1ed08aa7e6ed9d","download_count":28,"created_at":"2026-09-20T14:28:38Z","updated_at":"2026-09-20T14:28:47Z"},{"id":576955344,"node_id":"RA_kwDOKr-Pws4iY6PQ","name":"new-api-v1.0.0-rc.39","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":138645769,"digest":"sha256:c2d488fcb612964a8a9ceb61612f27349b65abde9467098963edd1041b6651fd","download_count":75,"created_at":"2026-09-20T14:27:42Z","updated_at":"2026-09-20T14:27:48Z"},{"id":576957505,"node_id":"RA_kwDOKr-Pws4iY6xB","name":"new-api-v1.0.0-rc.39.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":128360960,"digest":"sha256:cbfeb7590d0819c85da051cfbd50e9284dcd7818f31051727af1a9946136fda5","download_count":163,"created_at":"2026-09-20T14:29:05Z","updated_at":"2026-09-20T14:29:09Z"}],"body":"> [!IMPORTANT]\r\n> **Task Plugins & Quota Settings / \u4efb\u52a1\u63d2\u4ef6\u4e0e\u989d\u5ea6\u8bbe\u7f6e**\r\n>\r\n> \u4efb\u52a1\u63d2\u4ef6\u73b0\u5df2\u517c\u5bb9 OpenAI Images\uff1a\r\n> \u53ef\u627f\u63a5 `/v1/images/generations` \u548c `/v1/images/edits`\u3002\r\n> \u8bf7\u6c42\u5185\u63d0\u4ea4\u4efb\u52a1\u5e76\u7b49\u5f85\u5b8c\u6210\u540e\uff0c\u6309 OpenAI \u56fe\u7247\u683c\u5f0f\u8fd4\u56de\u3002\r\n> \u963f\u91cc\u4e91\u767e\u70bc\u4e07\u76f8\u56fe\u7247\u6a21\u578b\u6539\u8d70\u4efb\u52a1\u63d2\u4ef6\uff1b\u8c46\u5305 Seedream \u56fe\u7247\u751f\u6210\u5df2\u63a5\u5165\u3002\r\n>\r\n> New API \u6e20\u9053\u53ef\u7ed1\u5b9a\u591a\u4e2a\u4e0a\u6e38\u4efb\u52a1\u63d2\u4ef6\uff0c\u7528\u4e8e\u5bf9\u63a5\u53e6\u4e00\u5957\u7f51\u5173\u91cc\u7684\u591a\u4e2a\u4efb\u52a1\u63d2\u4ef6\u3002\r\n> \u6e20\u9053\u7684\u6a21\u578b\u91cd\u5b9a\u5411\u66f4\u6e05\u6670\uff0c\u5e94\u7528\u4e0a\u6e38\u6a21\u578b\u53d8\u66f4\u524d\u53ef\u5148\u9884\u89c8\u3002\r\n>\r\n> \u989d\u5ea6\u8bbe\u7f6e\u53ef\u914d\u7f6e\u94b1\u5305\u514d\u9884\u6263\u95e8\u69db\u548c\u8f93\u5165\u9884\u6263\u500d\u7387\uff0c\u4f59\u989d\u8db3\u591f\u65f6\u8df3\u8fc7\u9884\u6263\u3002\r\n>\r\n> Task Plugins now serve OpenAI Images:\r\n> `/v1/images/generations` and `/v1/images/edits`.\r\n> The host submits the task, waits inside the request, and returns an OpenAI image response.\r\n> Unclaimed models still use the existing image relay.\r\n> Alibaba Bailian Wanxiang image models now go through Task Plugins.\r\n> Doubao Seedream image generation is added.\r\n>\r\n> A New API Channel can bind multiple Upstream task plugins, for another gateway that hosts several Task Plugins.\r\n> Model Mapping is clearer, and upstream model changes can be previewed before apply.\r\n>\r\n> Quota Settings add Wallet pre-consume bypass threshold, and Input pre-consume multiplier.\r\n> High enough balances skip pre-consume.\r\n\r\n## New Features\r\n\r\n* Task Plugins can serve OpenAI Images (`/v1/images/generations`, `/v1/images/edits`).\r\n  Bailian Wanxiang image models now go through the Alibaba Task Plugin.\r\n  Doubao Seedream image generation is added.\r\n* New API Channels can bind multiple Upstream task plugins.\r\n* Quota Settings: Wallet pre-consume bypass threshold (USD) and Input pre-consume multiplier.\r\n* Model management Sync metadata supports bulk field selection.\r\n* API Keys can show and copy the Default API address / Current domain.\r\n* Group configuration supports drag sorting and a clearer editor.\r\n* Usage Logs show billing source and task artifacts for Task Plugin image work.\r\n  Async tasks record performance metrics when they reach a terminal status.\r\n\r\n## Fixes and Improvements\r\n\r\n* Seedance and Wan Task Plugins price only the resolutions each model actually offers.\r\n  Unsupported resolutions are rejected at submit.\r\n* Preview upstream model changes before applying them.\r\n  Model Mapping controls are simpler.\r\n* Display conditional task billing prices more reliably.\r\n  Accept fractional Group ratios and tool prices.\r\n  Limit pricing inputs to four decimal places ([#7453](https://github.com/QuantumNous/new-api/issues/7453)).\r\n* Derive Response model mismatch from model names ([#7464](https://github.com/QuantumNous/new-api/issues/7464)).\r\n  Restore compact cost bubbles and hide funding-source labels when Subscription is not in use ([#7450](https://github.com/QuantumNous/new-api/issues/7450), [#7451](https://github.com/QuantumNous/new-api/issues/7451)).\r\n* Forward `reasoning_effort` to Zhipu ([#7124](https://github.com/QuantumNous/new-api/issues/7124)).\r\n  Keep mobile dialog actions on screen.\r\n  Start linked-account verification from the provider button.\r\n\r\n---\r\n\r\n## What's Changed\r\n* fix: forward reasoning_effort to zhipu upstream by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7124\r\n* perf: avoid repeated Claude tool-name lookups by @Cylion-bot in https://github.com/QuantumNous/new-api/pull/7447\r\n* fix: hide source labels when subscriptions are not in play by @seefs001 in https://github.com/QuantumNous/new-api/pull/7450\r\n* refactor(log): \u6062\u590d\u8d39\u7528\u6c14\u6ce1\u5e76\u7528\u56fe\u6807\u533a\u5206\u8ba2\u9605\u6765\u6e90 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7451\r\n* fix(web): \u4fee\u590d\u5c0f\u6570\u8f93\u5165\u9650\u5236\u548c\u65e5\u5fd7\u5206\u7ec4\u9009\u9879\u672a\u906e\u6321\u7684\u95ee\u9898 by @zuiho-kai in https://github.com/QuantumNous/new-api/pull/7453\r\n* fix(log): derive response model mismatch from names stored flag by @seefs001 in https://github.com/QuantumNous/new-api/pull/7464\r\n* feat: record perf metrics when async tasks reach terminal status by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7481\r\n\r\n## New Contributors\r\n* @Cylion-bot made their first contribution in https://github.com/QuantumNous/new-api/pull/7447\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.38...v1.0.0-rc.39","mentions_count":5}
