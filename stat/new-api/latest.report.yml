1","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132382985,"digest":"sha256:11d4febd8ce8b4d7ece85cfbc6cf0990854c2c5a5376cbe11b376126fd19f020","download_count":182,"created_at":"2026-09-30T13:11:46Z","updated_at":"2026-09-30T13:11:51Z"},{"id":600951737,"node_id":"RA_kwDOKr-Pws4j0cu5","name":"new-api-macos-v1.0.0-rc.41","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":159519090,"digest":"sha256:273b555c06cf0eddd53de2dc2621e91ebaf1cf8fa399412a665c3a2555d5eb40","download_count":144,"created_at":"2026-09-30T13:09:05Z","updated_at":"2026-09-30T13:09:13Z"},{"id":600957087,"node_id":"RA_kwDOKr-Pws4j0eCf","name":"new-api-v1.0.0-rc.41","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":136450313,"digest":"sha256:c04e83d17bbaf8fa7c2f8b6ef0cc06ff754eba0f89b51ac34ed7875877308aed","download_count":931,"created_at":"2026-09-30T13:11:46Z","updated_at":"2026-09-30T13:11:52Z"},{"id":600956067,"node_id":"RA_kwDOKr-Pws4j0dyj","name":"new-api-v1.0.0-rc.41.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":138500608,"digest":"sha256:e95b9cbd3acf431a4d570c01b7575af0626cd08278d7fa88fc73d6fd2199a11b","download_count":1676,"created_at":"2026-09-30T13:11:12Z","updated_at":"2026-09-30T13:11:16Z"}],"body":"> [!IMPORTANT]\r\n> **Access Tokens & Task Plugins / \u8bbf\u95ee\u4ee4\u724c\u4e0e\u4efb\u52a1\u63d2\u4ef6**\r\n>\r\n> \u5b89\u5168\u4e0e\u8bbf\u95ee\u91cc\u7684\u5355\u4e2a\u9762\u677f\u8bbf\u95ee\u4ee4\u724c\uff0c\u6539\u4e3a\u6700\u591a 20 \u4e2a\u5177\u540d\u8bbf\u95ee\u4ee4\u724c\u3002\u521b\u5efa\u65f6\u53ea\u663e\u793a\u4e00\u6b21\uff0c\u9ed8\u8ba4 30 \u5929\u8fc7\u671f\uff1b\u4f5c\u7528\u57df\u6309\u672c\u4eba\u5df2\u6709\u6743\u9650\u52fe\u9009\u3002\u5347\u7ea7\u540e\u65e7\u7248\u4ee4\u724c\u8fd8\u80fd\u518d\u7528 30 \u5929\uff0c\u4e4b\u540e\u4f1a\u88ab\u62d2\u7edd\uff0c\u4e14\u4e0d\u80fd\u91cd\u65b0\u751f\u6210\uff0c\u8bf7\u5728\u5230\u671f\u524d\u6362\u6210\u65b0\u4ee4\u724c\u3002\r\n>\r\n> \u7ba1\u7406\u5458\u7ba1\u7406\u7528\u6237\u65f6\uff0c\u5220\u9664\u3001\u6539\u72b6\u6001\u6216\u89d2\u8272\u3001\u8bbe\u7f6e\u5bc6\u7801\u6216\u6743\u9650\u3001\u521b\u5efa\u7ba1\u7406\u5458\u3001\u91cd\u7f6e\u901a\u884c\u5bc6\u94a5\u3001\u5173\u95ed\u4e24\u6b65\u9a8c\u8bc1\u3001\u6e05\u9664\u7ed1\u5b9a\uff0c\u90fd\u9700\u8981\u4e00\u6b21\u6027\u6821\u9a8c\u3002\u989d\u5ea6\u8c03\u6574\uff0c\u4ee5\u53ca\u4fee\u6539\u663e\u793a\u540d\u3001\u5206\u7ec4\u3001\u5907\u6ce8\uff0c\u4e0d\u9700\u8981\u3002\r\n>\r\n> \u4efb\u52a1\u63d2\u4ef6\u6539\u7531 moejs \u8fd0\u884c\uff0c\u6027\u80fd\u5927\u5e45\u63d0\u5347\uff0c\u63d2\u4ef6\u63a5\u53e3\u4e0d\u53d8\u3002\r\n>\r\n> \u8c46\u5305 Seedream \u56fe\u7247\u6539\u8d70\u4efb\u52a1\u63d2\u4ef6\u7684 OpenAI Images\uff08`/v1/images/generations`\u3001`/v1/images/edits`\uff09\u3002\u65b0\u589e Seedream 5.0 Flash\uff1b\u5404\u6a21\u578b\u6309\u81ea\u5df1\u7684\u6863\u4f4d\u8ba1\u4ef7\u3002\u4efb\u52a1\u63d2\u4ef6\u6536\u7a84\u7528\u91cf\u9879\u4e4b\u540e\uff0c\u5df2\u4fdd\u5b58\u7684\u4ef7\u683c\u4ecd\u53ef\u7f16\u8f91\u3002\r\n>\r\n> Security & Access replaces the single dashboard Access Token with up to 20 named Access tokens. A token is shown once at creation, expires in 30 days by default, and its Scopes stay within what the owner can already do. The Legacy token keeps working for 30 days after the upgrade, then it is rejected and cannot be regenerated. Replace it before then.\r\n>\r\n> Admin user management now requires a single-use verification for delete, status or role changes, password or Permissions, creating an admin, resetting a Passkey, disabling 2FA, and clearing a binding. Quota adjustments, and edits to display name, Group, or remark, do not.\r\n>\r\n> Task Plugins now run on moejs, with a large performance improvement. \r\n>\r\n> Doubao Seedream images now go through the Task Plugin OpenAI Images paths (`/v1/images/generations`, `/v1/images/edits`). Seedream 5.0 Flash is added, and each model is priced on its own tiers. Prices saved before a Task Plugin narrows its usage facts stay editable.\r\n\r\n## New Features\r\n\r\n* Replaced the single dashboard Access Token with up to 20 named Access tokens on Security & Access. Tokens are shown once, use Scopes, and expire after 30 days by default.\r\n* Access tokens can be renamed without verification. Changing Permissions requires a single-use proof bound to that token.\r\n* Moved Task Plugins to moejs, with a large performance improvement. The plugin API is unchanged.\r\n* Added Seedream 5.0 Flash, and price each Seedream model on its own tiers. Seedream images are served through the Task Plugin OpenAI Images protocol.\r\n* Highlight differing values when comparing source price expressions ([#7543](https://github.com/QuantumNous/new-api/issues/7543)).\r\n* Added a Refresh button on the Channels table.\r\n\r\n## Fixes and Improvements\r\n\r\n* Keep Pricing Configuration editable after a usage profile drops facts. Remaining prices stay in place.\r\n* Keep Responses custom tools when converting to Chat Completions, so tools such as `exec` and `apply_patch` are no longer dropped.\r\n* Preserve Claude auto-mode safeguards and per-message `output_config` ([#7598](https://github.com/QuantumNous/new-api/issues/7598), [#7561](https://github.com/QuantumNous/new-api/issues/7561)).\r\n* Preserve the Responses WebSocket setting when saving a Channel ([#7468](https://github.com/QuantumNous/new-api/issues/7468)).\r\n* Revalidate Marketplace downloads so a republished plugin source does not fail the integrity check from a stale cache.\r\n* Reject non-standard roles when creating a user.\r\n* Release binaries now embed the real version instead of `v0.0.0` ([#7536](https://github.com/QuantumNous/new-api/issues/7536)).\r\n\r\n## What's Changed\r\n* test(billing): fix websocket rejection refund test after pre-consume dropped output estimation by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7491\r\n* fix(plugins/alibaba): keep upstream metadata in openai_image render by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7507\r\n* fix(relayconvert): Responses\u2192Chat \u5de5\u5177\u8f93\u51fa\u56fe\u7247\u6539\u4e3a\u63d0\u5347\u5230\u540e\u7eed user \u6d88\u606f by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7510\r\n* fix(relayconvert): Claude tool_result \u56fe\u7247\u63d0\u5347\u5230 user \u6d88\u606f\uff1bChat\u2192Responses \u6d41\u8865\u9f50 reasoning part \u4e8b\u4ef6\u5e76\u6309\u6bb5\u5207\u5206 item by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7512\r\n* fix(logs): keep model badge text readable and compact by @Yorick-Ryu in https://github.com/QuantumNous/new-api/pull/7504\r\n* fix: move force operation into confirm slot so plugin-in-use dialog has one cancel button by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7528\r\n* fix(web): keep text selection when opening a model pricing row for editing by @RedwindA in https://github.com/QuantumNous/new-api/pull/7403\r\n* fix(ci): align ldflags -X package path with module path so release binaries embed the real version by @mslchy in https://github.com/QuantumNous/new-api/pull/7536\r\n* fix: match current price column width to source columns so expressions wrap alike by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7542\r\n* feat: highlight differing values in source price expressions by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7543\r\n* style(playground): add break-all to playground input by @LauZzL in https://github.com/QuantumNous/new-api/pull/6600\r\n* fix(channel): preserve Responses WebSocket setting on save by @zenor0 in https://github.com/QuantumNous/new-api/pull/7468\r\n* fix(claude): preserve per-message output_config in Claude messages by @Zane-0x5a in https://github.com/QuantumNous/new-api/pull/7561\r\n* fix(claude): preserve auto mode safeguards in native requests by @seefs001 in https://github.com/QuantumNous/new-api/pull/7598\r\n\r\n## New Contributors\r\n* @Yorick-Ryu made their first contribution in https://github.com/QuantumNous/new-api/pull/7504\r\n* @mslchy made their first contribution in https://github.com/QuantumNous/new-api/pull/7536\r\n* @LauZzL made their first contribution in https://github.com/QuantumNous/new-api/pull/6600\r\n* @zenor0 made their first contribution in https://github.com/QuantumNous/new-api/pull/7468\r\n* @Zane-0x5a made their first contribution in https://github.com/QuantumNous/new-api/pull/7561\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.39...v1.0.0-rc.41","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":9}
