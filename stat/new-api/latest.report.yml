","name":"new-api-arm64-v1.0.0-rc.35","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":125698313,"digest":"sha256:5e33ffb9e5009fb7bcb01678f34186fe30c440f0f1a0a6cce8396836828dd76f","download_count":16,"created_at":"2026-09-07T14:45:44Z","updated_at":"2026-09-07T14:45:49Z"},{"id":548935713,"node_id":"RA_kwDOKr-Pws4guBgh","name":"new-api-macos-v1.0.0-rc.35","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":152963666,"digest":"sha256:708ccecd9b9bd96a611d1838deacbbb7c83915afa5b1b5589d3c368045efdac1","download_count":9,"created_at":"2026-09-07T14:45:58Z","updated_at":"2026-09-07T14:46:04Z"},{"id":548935471,"node_id":"RA_kwDOKr-Pws4guBcv","name":"new-api-v1.0.0-rc.35","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129659145,"digest":"sha256:1b89de08b598bd9d06e2933a1f6b9d555e87a88c418ad85190babcea07bb46e7","download_count":66,"created_at":"2026-09-07T14:45:43Z","updated_at":"2026-09-07T14:45:48Z"},{"id":548937407,"node_id":"RA_kwDOKr-Pws4guB6_","name":"new-api-v1.0.0-rc.35.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":131741696,"digest":"sha256:e754d19be63a60fb2fb4f0fa7366596448ce8d5c1485564a27bfccc23c941dd8","download_count":127,"created_at":"2026-09-07T14:47:18Z","updated_at":"2026-09-07T14:47:23Z"}],"body":"> [!IMPORTANT]\r\n> **Task Plugin Controls / \u4efb\u52a1\u63d2\u4ef6\u63a7\u5236\u7b80\u5316**\r\n>\r\n> \u4efb\u52a1\u63d2\u4ef6\u73b0\u5728\u53ea\u6709\u4e24\u5c42\u5f00\u5173\uff1a\u603b\u5f00\u5173\u4e0e\u6bcf\u4e2a\u63d2\u4ef6\u81ea\u5df1\u7684\u5f00\u5173\u3002\u5173\u95ed\u67d0\u4e2a\u63d2\u4ef6\u540e\uff0c\u4e0d\u4f1a\u518d\u56de\u9000\u5230\u540c\u540d\u5185\u7f6e\u63d2\u4ef6\uff0c\u540c\u540d\u6a21\u578b\u4e5f\u4e0d\u4f1a\u518d\u7ee7\u7eed\u7531\u5185\u7f6e\u63d2\u4ef6\u5904\u7406\u3002\u5185\u7f6e\u63d2\u4ef6\u4f1a\u6309\u8bf7\u6c42\u4e2d\u7684\u6a21\u578b\u540d\u56de\u663e\uff08\u9075\u5faa\u6a21\u578b\u91cd\u5b9a\u5411\uff09\uff0c\u800c\u4e0d\u662f\u4e0a\u6e38\u771f\u5b9e ID\u3002\r\n>\r\n> Task plugins now have two control layers only: the master switch and each plugin\u2019s own toggle. Disabling a plugin no longer falls back to a same-name built-in plugin, so same-name models are no longer still handled by the built-in plugin. Built-in plugins echo the requested model name (honoring model redirects) instead of the upstream model ID.\r\n\r\n> [!WARNING]\r\n> **Experimental Plugin System / \u5b9e\u9a8c\u6027\u63d2\u4ef6\u7cfb\u7edf**\r\n>\r\n> \u81ea v1.0.0-rc.27 \u8d77\u5f15\u5165\u7684\u5b9e\u9a8c\u6027\u63d2\u4ef6\u7cfb\u7edf\u4ecd\u5904\u4e8e\u6d4b\u8bd5\u9636\u6bb5\uff0c\u5e76\u6d89\u53ca\u8f83\u5927\u7684\u67b6\u6784\u8c03\u6574\u3002\u5982\u9047\u95ee\u9898\uff0c\u8bf7\u53ca\u65f6\u53cd\u9988\u3002\r\n>\r\n> \u4ece v1.0.0-rc.26 \u6216\u66f4\u65e9\u7248\u672c\u5347\u7ea7\u7684\u7528\u6237\uff0c**\u5fc5\u987b\u91cd\u65b0\u914d\u7f6e\u6240\u6709\u89c6\u9891\u6a21\u578b\u4ef7\u683c**\uff1b\u5df2\u5b8c\u6210\u8be5\u914d\u7f6e\u7684\u7528\u6237\u65e0\u9700\u91cd\u590d\u64cd\u4f5c\u3002**\u672c\u7248\u672c\u4ecd\u4e0d\u63a8\u8350\u7528\u4e8e\u751f\u4ea7\u73af\u5883\u3002**\r\n>\r\n> The experimental plugin system introduced in v1.0.0-rc.27 remains under testing and includes major architectural changes. Please report any issues promptly.\r\n>\r\n> Users upgrading from v1.0.0-rc.26 or earlier **must reconfigure all video model prices**. Users who have already completed this step do not need to repeat it. **This release is still not recommended for production use.**\r\n\r\n## New Features\r\n\r\n* Added Alibaba Bailian `wan3.0-video` and `wan3.0-video-prime` all-in-one video models, with DashScope media, resolution/ratio, duration rules, and billing ratios.\r\n* Supported wan3.0 smart duration (`duration` / `seconds` = `-1`): submit `-1` upstream, pre-consume 30 seconds, then settle from actual usage. Other Wan models reject this marker instead of silently defaulting to 5 seconds.\r\n* Added `kimi-k3` to the Moonshot model list.\r\n\r\n## Fixes and Improvements\r\n\r\n* Preserved Kimi K3 mid-conversation tool-loading messages, so dynamic tools are no longer dropped during relay and `tool_choice=required` no longer fails for missing `tools` ([#7235](https://github.com/QuantumNous/new-api/issues/7235)).\r\n* Made wan3.0 convert and billing follow the redirected upstream model, reject unknown sizes, restore the image-only guard for text-to-video models, and forward ratio/audio in native passthrough ([#7240](https://github.com/QuantumNous/new-api/issues/7240)).\r\n* Made the SunoAPI built-in honor model redirects and fixed lyrics/music rendering. Bumped sunoapi to 1.0.2.\r\n* Replaced the model-card health strip\u2019s last-three-bucket rates with an hourly series, so empty hours stay gray and the 24-slot bar can show a full day.\r\n* Portaled Combobox and Select popups into drawer content so they stay clickable inside modal drawers.\r\n* Switched the pricing card grid (and its skeleton) to three columns at the `xl` breakpoint.\r\n* Routed `common` and `relaykit` JSON helpers through a host-injectable codec so the JSON engine can be swapped in one place.\r\n\r\n---\r\n\r\n**Full Changelog**: [v1.0.0-rc.34...v1.0.0-rc.35](https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.34...v1.0.0-rc.35)"}
