,"label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":131006729,"digest":"sha256:cdebd40fba5c4f1777f43bfb8244a026edba9cecfe07ab1c9c70dec4e91c9f01","download_count":28,"created_at":"2026-10-08T10:10:39Z","updated_at":"2026-10-08T10:10:44Z"},{"id":621453836,"node_id":"RA_kwDOKr-Pws4lCqIM","name":"new-api-macos-v1.0.0-rc.42","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":158609874,"digest":"sha256:1201e0d4c1bad6ab49d48d37db6244dacdb0acf52219767c354fad6948ce79c6","download_count":29,"created_at":"2026-10-08T10:11:07Z","updated_at":"2026-10-08T10:11:14Z"},{"id":621452861,"node_id":"RA_kwDOKr-Pws4lCp49","name":"new-api-v1.0.0-rc.42","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":135155977,"digest":"sha256:4f0a66eaab026056f5e4271c68c26d7a8ea89b34f0a5d3c4a8c2c5d347d34dc6","download_count":165,"created_at":"2026-10-08T10:10:39Z","updated_at":"2026-10-08T10:10:46Z"},{"id":621458980,"node_id":"RA_kwDOKr-Pws4lCrYk","name":"new-api-v1.0.0-rc.42.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":137027072,"digest":"sha256:68ee7231128c62aaad20a0beeb5dd9cd06464f6e36ce7af1a043e52b766f1a4b","download_count":239,"created_at":"2026-10-08T10:13:35Z","updated_at":"2026-10-08T10:13:40Z"}],"body":"> [!IMPORTANT]\r\n> **Search Billing & Task Plugins / \u641c\u7d22\u8ba1\u8d39\u4e0e\u4efb\u52a1\u63d2\u4ef6**\r\n>\r\n> \u91cd\u505a\u4e86\u641c\u7d22\u51fd\u6570\u8ba1\u8d39\u3002\u6e20\u9053\u53ef\u4ee5\u6309\u4e0a\u6e38\u81ea\u5df1\u7684\u65b9\u5f0f\u8fdb\u884c\u7f51\u7edc\u641c\u7d22\uff0c\u5e76\u6309\u4e0a\u6e38\u56de\u62a5\u7684\u641c\u7d22\u6b21\u6570\u8ba1\u8d39\u3002\r\n>\r\n> \u4efb\u52a1\u63d2\u4ef6\u6027\u80fd\u5927\u5e45\u63d0\u5347\u3002\u652f\u6301\u63d2\u4ef6\u51b3\u5b9a\u662f\u5426\u4fdd\u7559 JSON \u5b57\u6bb5\u987a\u5e8f\uff0c\u58f0\u660e `json-order@1` \u5373\u53ef\uff1b\u5176\u4ed6\u63d2\u4ef6\u884c\u4e3a\u4e0d\u53d8\u3002\r\n>\r\n> \u9ad8\u7ea7\u81ea\u5b9a\u4e49\u6e20\u9053\u53ef\u4ee5\u628a Claude Messages \u548c Gemini \u8f6c\u5230 OpenAI Responses\u3002\r\n>\r\n>\u65b0\u589e xAI Grok Imagine \u89c6\u9891\u4efb\u52a1\u63d2\u4ef6\u3002\r\n>\r\n> Search-function billing has been reworked. Channels can encode Web search for their upstream and settle from the search counts the vendor reports.\r\n>\r\n> Task Plugins are substantially faster. A plugin that must keep the client\u2019s JSON field order can declare `json-order@1`. Other plugins are unchanged.\r\n>\r\n> Advanced Custom channels can convert Claude Messages and Gemini to OpenAI Responses. An xAI Grok Imagine video Task Plugin is added.\r\n\r\n## New Features\r\n\r\n* Reworked search-function billing, including per-Channel Web search encoding and vendor-reported search counts.\r\n* Advanced Custom channels can convert Claude Messages and Gemini generateContent to OpenAI Responses.\r\n* Moonshot Channels forward `/v1/responses` unchanged. Kimi currently serves `kimi-k3` on that path.\r\n* Added the xAI Grok Imagine video Task Plugin: `grok-imagine-video`, `grok-imagine-video-1.5`, and `grok-imagine-video-1.5-lite`.\r\n* Advanced parameter overrides support Regex conditions ([#7698](https://github.com/QuantumNous/new-api/issues/7698)).\r\n* Users can be filtered by User Group.\r\n* Task Plugins that declare `json-order@1` keep the client\u2019s JSON field order through to the upstream.\r\n\r\n## Fixes and Improvements\r\n\r\n* Task Plugin requests are substantially faster, including passthrough submissions.\r\n* Token counting is much faster, including long text without punctuation.\r\n* Gemini stream usage is no longer multiplied by the number of frames ([#7687](https://github.com/QuantumNous/new-api/issues/7687)).\r\n* Responses tool-output images are sent to Gemini as images, not as text. Claude Opus 5.5 defaults to medium effort when the client sets none.\r\n* Responses custom tools such as `exec` and `apply_patch` are kept on Claude and Gemini upstreams ([#7636](https://github.com/QuantumNous/new-api/issues/7636)).\r\n* Turning off the Thinking Suffix Adapter now also leaves effort suffixes such as `-high` unchanged.\r\n* Completed image generations still bill when the Responses request later fails or is cancelled.\r\n* Frontend build files no longer count against the page rate limit, so a cold load does not return 429 for the next session on the same IP.\r\n* `gpt-6-sol` and `gpt-6-luna` use `max_completion_tokens` ([#7559](https://github.com/QuantumNous/new-api/issues/7559)).\r\n* System Settings are hidden from non-root admins ([#7513](https://github.com/QuantumNous/new-api/issues/7513)).\r\n* Fixed a blank Channels page on OriginOS 6. Fixed rounded clipping of Group names on API Keys ([#7645](https://github.com/QuantumNous/new-api/issues/7645)).\r\n\r\n---\r\n\r\n## What's Changed\r\n* fix: isolate TLS configs across HTTP transports by @seefs001 in https://github.com/QuantumNous/new-api/pull/7627\r\n* fix: use max_completion_tokens for gpt-6-sol and gpt-6-luna by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7559\r\n* fix(web): Add class to wrap the long strings at auto-disable status tooltip content in channel manage page by @makisekuris in https://github.com/QuantumNous/new-api/pull/7604\r\n* fix(web): hide system settings from non-root admins by @jimmyleocn in https://github.com/QuantumNous/new-api/pull/7513\r\n* fix(i18n): keep cached zhTW interface code stable across page loads by @yenchieh in https://github.com/QuantumNous/new-api/pull/7139\r\n* fix(web): correct translations, chart ordering, and font loading by @seefs001 in https://github.com/QuantumNous/new-api/pull/7628\r\n* fix(relayconvert): keep Responses custom tools on Claude and Gemini upstreams by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7636\r\n* fix(keys): prevent rounded clipping of group names by @jimmyleocn in https://github.com/QuantumNous/new-api/pull/7645\r\n* fix(relaykit): Gemini stream token details, Responses tool-output media on Gemini, Opus 5.5 default effort by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7687\r\n* feat(relay): web search encoding per channel and vendor-reported search billing by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7690\r\n* feat: support regex conditions in advanced parameter overrides by @seefs001 in https://github.com/QuantumNous/new-api/pull/7698\r\n\r\n## New Contributors\r\n* @makisekuris made their first contribution in https://github.com/QuantumNous/new-api/pull/7604\r\n* @yenchieh made their first contribution in https://github.com/QuantumNous/new-api/pull/7139\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.41...v1.0.0-rc.42","mentions_count":6}
