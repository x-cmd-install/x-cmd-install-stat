","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132382985,"digest":"sha256:8d3e836cb38f48e248f815cb3f361d54043606a41d1ebdd3be2531f03c9a84d4","download_count":97,"created_at":"2026-10-17T15:42:34Z","updated_at":"2026-10-17T15:42:39Z"},{"id":650850332,"node_id":"RA_kwDOKr-Pws4myzAc","name":"new-api-macos-v1.0.0-rc.45","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":160121410,"digest":"sha256:984ac0e0152fba973a46c5040656f3bc8070e0473adeb0926d9c50aaca728aa6","download_count":87,"created_at":"2026-10-17T15:43:18Z","updated_at":"2026-10-17T15:43:30Z"},{"id":650848483,"node_id":"RA_kwDOKr-Pws4myyjj","name":"new-api-v1.0.0-rc.45","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":136601865,"digest":"sha256:0eb9bcda72b25f840226d2493f2ef1074471fa511298213bca89672add7ceee9","download_count":265,"created_at":"2026-10-17T15:42:34Z","updated_at":"2026-10-17T15:42:40Z"},{"id":650851472,"node_id":"RA_kwDOKr-Pws4myzSQ","name":"new-api-v1.0.0-rc.45.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":138455552,"digest":"sha256:e076b9769275eb1bbc1f67734b414ed8dde4627ee4d3d6c9d3986cac79e43fa6","download_count":406,"created_at":"2026-10-17T15:43:45Z","updated_at":"2026-10-17T15:43:50Z"}],"body":"> [!IMPORTANT]\r\n> v1 \u6b63\u5f0f\u7248\u5373\u5c06\u53d1\u5e03\uff0c\u73b0\u5728\u662f\u6700\u540e\u51e0\u4e2a RC \u7248\u672c\u3002\u65b0\u589e DeepSeek V4.1 Flash\u3001Search \u548c Fetch\uff0c\u901a\u77e5\u5206\u5f00\u5f00\u5173\uff0c\u4ee5\u53ca\u62d6\u52a8\u6392\u5217\u6e20\u9053\u4f18\u5148\u7ea7\u7684\u529f\u80fd\u3002\r\n>\r\n> \u654f\u611f\u8bcd\u8fc7\u6ee4\u9ed8\u8ba4\u5173\u7740\u3002\u4ee5\u524d\u586b\u8fc7\u654f\u611f\u8bcd\u3001\u4f46\u6ca1\u4fdd\u5b58\u8fc7\u8fd9\u4e2a\u5f00\u5173\u7684\uff0c\u5347\u7ea7\u540e\u5230\u300c\u8bf7\u6c42\u68c0\u67e5\u300d\u91cc\u6253\u5f00\u3002\r\n>\r\n> v1 is coming soon. These are the last few release candidates. Added DeepSeek V4.1 Flash, Search and Fetch, separate notification switches, and dragging to set channel priority.\r\n>\r\n> Sensitive word filtering is off by default. If you filled in a word list and never saved the switch, turn it on under Request checks after upgrading.\r\n\r\n## \u4e2d\u6587\r\n\r\n* **DeepSeek**\uff1a\u65b0\u589e DeepSeek V4.1 Flash\uff08deepseek-flash\uff09\u548c deepseek-v4-pro \u7684\u652f\u6301\uff0c\u540e\u9762\u53ef\u4ee5\u52a0 -none\u3001-low\u3001-max\uff0c`@thinking` \u548c `@effort` \u4e5f\u80fd\u7528\u3002\u65b0\u589e Search \u548c Fetch\uff0c\u5730\u5740\u662f /v1/tools/search \u548c /v1/tools/fetch\u3002Claude Code \u548c Codex \u8ba9 DeepSeek \u53bb\u641c\u7d22\u3001\u6253\u5f00\u7f51\u9875\u65f6\uff0c\u6309\u6b21\u6570\u8ba1\u8d39\uff0c\u6bcf 1000 \u6b21 0.75 \u7f8e\u5143\u3002\r\n* **\u901a\u77e5**\uff1a\u65b0\u589e\u6309\u79cd\u7c7b\u5f00\u5173\u901a\u77e5\u7684\u529f\u80fd\uff0c\u4f59\u989d\u4e0d\u8db3\u63d0\u9192\u9ed8\u8ba4\u5f00\u7740\u3002\u9a8c\u8bc1\u7801\u3001\u91cd\u7f6e\u5bc6\u7801\u3001\u7ed1\u5b9a\u90ae\u7bb1\uff0c\u770b SMTP \u6709\u6ca1\u6709\u914d\u597d\u3002\u4f59\u989d\u4f4e\u4e8e\u4f60\u8bbe\u7684\u6570\u65f6\u63d0\u9192\u4e00\u6b21\uff0c\u5145\u56de\u53bb\u4e4b\u540e\uff0c\u4e0b\u6b21\u518d\u4f4e\u624d\u4f1a\u518d\u63d0\u9192\u3002\r\n* **\u6e20\u9053**\uff1a\u65b0\u589e\u62d6\u52a8\u8c03\u6574\u6e20\u9053\u4f18\u5148\u7ea7\u7684\u529f\u80fd\uff0c\u5728\u6e20\u9053\u5217\u8868\u6253\u5f00\u300c\u62d6\u62fd\u6a21\u5f0f\u300d\u3002\u65b0\u589e New API \u6e20\u9053\u67e5\u8be2\u4e0a\u6e38\u4f59\u989d\u7684\u529f\u80fd\uff0c\u4e5f\u53ef\u4ee5\u7ed1\u5b9a\u6d77\u87ba\u3001Vidu \u548c Veo\u3002\u65b0\u589e\u4ee4\u724c\u300c\u5141\u8bb8\u67e5\u8be2\u7528\u6237\u989d\u5ea6\u300d\uff0c\u65b0\u5efa\u7684\u9ed8\u8ba4\u5f00\u7740\uff0c\u4ee5\u524d\u5efa\u7684\u8fd8\u662f\u5173\u7684\u3002\r\n* **\u9650\u6d41\u548c\u8ba1\u8d39**\uff1a\u4fee\u590d\u5206\u7ec4\u9650\u6d41\u7b97\u5230\u4e00\u8d77\u7684\u95ee\u9898\uff0c\u67d0\u4e2a\u5206\u7ec4\u81ea\u5df1\u8bbe\u4e86\u9650\u6d41\uff0c\u5c31\u6309\u8fd9\u4e2a\u5206\u7ec4\u7684\u6b21\u6570\u7b97\u3002\u4fee\u590d Vidu \u6536\u8d39\u548c\u5b9e\u9645\u751f\u6210\u5bf9\u4e0d\u4e0a\u7684\u95ee\u9898\uff0c\u6309\u5b83\u5b9e\u9645\u751f\u6210\u7684\u6a21\u578b\u3001\u65f6\u957f\u548c\u5206\u8fa8\u7387\u8ba1\u8d39\u3002\u4fee\u590d Claude \u6d41\u5f0f\u628a\u4e0a\u6e38\u62a5\u7684 0 \u4e22\u6389\u7684\u95ee\u9898\uff0c\u62a5\u4e86 0 \u5c31\u6309 0 \u7b97\u3002\u63d0\u793a\u8bcd\u5168\u5728\u7f13\u5b58\u91cc\u65f6\uff0c\u6309\u8bfb\u7f13\u5b58\u7684\u4ef7\u683c\u8ba1\u8d39\u3002\r\n* **\u62a5\u9519**\uff1a\u4fee\u590d\u8bf7\u6c42\u5185\u5bb9\u8bfb\u5931\u8d25\u65f6\u770b\u4e0d\u51fa\u539f\u56e0\u7684\u95ee\u9898\u3002\u4e0a\u6e38\u62a5\u9519\u91cc\uff0c\u4f60\u586b\u7684\u5730\u5740\u3001IP \u548c\u5bc6\u94a5\u4f1a\u88ab\u85cf\u8d77\u6765\uff0c\u6587\u6863\u94fe\u63a5\u548c\u90ae\u7bb1\u8fd8\u770b\u5f97\u5230\u3002\r\n* **\u5176\u4ed6**\uff1a\u65b0\u589e Sub2API \u67e5\u8be2\u4f59\u989d\u7684\u529f\u80fd\u3002\u65b0\u589e AWS \u7684 Mantle\uff08Messages API\uff09\uff0c\u5df2\u7ecf\u5728\u7528\u7684\u8fd8\u662f InvokeModel\u3002\u65b0\u589e Vertex \u7528 API Key \u65f6\u586b\u5199\u9879\u76ee ID \u7684\u529f\u80fd\u3002\u4efb\u52a1\u63d2\u4ef6\u8fd9\u4e00\u7248\u66f4\u5feb\u3002\r\n* **\u4fee\u590d**\uff1a\u4fee\u590d Vertex \u7684 us\u3001eu \u8bbf\u95ee\u5730\u5740\u9519\u8bef\u7684\u95ee\u9898\u3002\u4fee\u590d\u5bb9\u5668\u91cc\u8fc7\u8f7d\u4fdd\u62a4\u770b\u9519 CPU \u548c\u5185\u5b58\u7684\u95ee\u9898\uff0c\u770b\u7684\u662f\u5bb9\u5668\u81ea\u5df1\u7684\uff0c\u8fde\u7eed\u5927\u7ea6 15 \u79d2\u90fd\u8fc7\u9ad8\u624d\u4f1a\u62d2\u7edd\u8bf7\u6c42\u3002\r\n\r\n## English\r\n\r\n* **DeepSeek**: Added deepseek-flash and deepseek-v4-pro. You can add -none, -low, or -max, and `@thinking` and `@effort` work too. Added Search and Fetch at /v1/tools/search and /v1/tools/fetch. When Claude Code or Codex has DeepSeek search or open a page, that is charged per request, $0.75 per 1,000.\r\n* **Notifications**: Added a switch for each kind of notification. The low balance reminder starts on. Verification codes, password resets, and email binding go out when SMTP is set up. You get one reminder when the balance goes below the number you set, and another the next time it does, after a top-up.\r\n* **Channels**: Added dragging to change channel priority. Turn on Drag mode in the channel list. Added upstream balance checks for New API channels, which can also bind Hailuo, Vidu, and Veo. Added Allow querying user quota on tokens. New tokens start with it on. Older tokens stay off.\r\n* **Rate limits and billing**: Fixed group rate limits being counted together. A group with its own limit is counted on its own. Fixed Vidu charges that did not match the video it generated. The charge uses the model, duration, and resolution it actually made. Fixed Claude streams dropping a 0 from the upstream. A reported 0 stays 0. When the whole prompt is cached, the charge is the cache-read price.\r\n* **Errors**: Fixed request failures that hid the real reason the body could not be read. If it is too large, the response is 413. In an upstream error, the address, IP, and key you entered are hidden. Documentation links and email addresses stay visible.\r\n* **Also**: Added balance checks for Sub2API channels. Added Mantle (Messages API) for AWS channels. Ones already in use stay on InvokeModel. Added a project ID field for Vertex API Key mode. Task plugins are faster in this release.\r\n* **Fixes**: Fixed wrong Vertex addresses for the us and eu regions. Fixed overload protection in containers reading the wrong CPU and memory. It uses the container's own, and turns requests away only after they stay too high for about 15 seconds.\r\n\r\n---\r\n\r\n## What's Changed\r\n* feat(ui): show newly added pricing groups at the top by @seefs001 in https://github.com/QuantumNous/new-api/pull/7782\r\n* feat(channel): support Sub2API balance queries by @AdoreJc in https://github.com/QuantumNous/new-api/pull/7749\r\n* fix: disable sensitive word filtering by default and clear list by @seefs001 in https://github.com/QuantumNous/new-api/pull/7814\r\n* fix(vertex): pass project_id in API Key mode to avoid 404 on official endpoints by @xiaoyuyu6420 in https://github.com/QuantumNous/new-api/pull/6330\r\n* fix(web): sort pricing models by input, output and per-request price by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7813\r\n* fix(claude): preserve explicit zero usage and cache-only billing by @paopaoandlingyia in https://github.com/QuantumNous/new-api/pull/7816\r\n* fix(relay): mask only the custom upstream address in error messages by @RedwindA in https://github.com/QuantumNous/new-api/pull/7822\r\n* fix(playground): support the reasoning field in chat responses by @seefs001 in https://github.com/QuantumNous/new-api/pull/7831\r\n* fix(dashboard): draw flow chart labels in the theme text color by @RedwindA in https://github.com/QuantumNous/new-api/pull/7821\r\n* fix(relaykit): emit summary on reasoning items announced without one by @rjchien728 in https://github.com/QuantumNous/new-api/pull/7833\r\n* fix(middleware): \u8fc7\u8f7d\u54e8\u5175\u6539\u7528\u5bb9\u5668\u53e3\u5f84\u5e76\u52a0\u5165\u8fde\u7eed\u6027\u4e0e\u65b0\u9c9c\u5ea6\u5224\u5b9a by @ax2 in https://github.com/QuantumNous/new-api/pull/7317\r\n* fix(relayconvert): \u4fdd\u7559 Chat/Claude \u2192 Responses \u8f6c\u6362\u4e2d input_image \u7684 detail \u5b57\u6bb5 by @sicnuyudidi in https://github.com/QuantumNous/new-api/pull/7855\r\n* fix(web): \u8865\u5168\u65e5\u5fd7\u9875\u6a21\u578b\u5382\u5546\u89c4\u5219\uff08Cloudflare clef\u3001NVIDIA \u5bb6\u65cf\uff09 by @xuu1998 in https://github.com/QuantumNous/new-api/pull/7840\r\n* fix(web): apply theme before first paint to avoid light flash and Dark Reader misdetection by @RedwindA in https://github.com/QuantumNous/new-api/pull/7571\r\n* fix: align model card summary with status bar hours by @feitianbubu in https://github.com/QuantumNous/new-api/pull/7847\r\n* feat(notify): turn each kind of notification on or off by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7868\r\n* feat(deepseek): support V4.1 Flash, the Search and Fetch APIs, and @ reasoning modifiers by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7867\r\n\r\n## New Contributors\r\n* @AdoreJc made their first contribution in https://github.com/QuantumNous/new-api/pull/7749\r\n* @xiaoyuyu6420 made their first contribution in https://github.com/QuantumNous/new-api/pull/6330\r\n* @paopaoandlingyia made their first contribution in https://github.com/QuantumNous/new-api/pull/7816\r\n* @rjchien728 made their first contribution in https://github.com/QuantumNous/new-api/pull/7833\r\n* @sicnuyudidi made their first contribution in https://github.com/QuantumNous/new-api/pull/7855\r\n* @xuu1998 made their first contribution in https://github.com/QuantumNous/new-api/pull/7840\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.44...v1.0.0-rc.45","reactions":{"total_count":5,"+1":2,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":11}
