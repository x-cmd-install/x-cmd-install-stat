el":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132514057,"digest":"sha256:e2165695862c9cd624c28d07f6365be667ef8821e2fa9e141e94be1e14de7ec6","download_count":77,"created_at":"2026-10-21T16:29:58Z","updated_at":"2026-10-21T16:30:04Z"},{"id":663119659,"node_id":"RA_kwDOKr-Pws4nhmcr","name":"new-api-macos-v1.0.0-rc.46","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":160278146,"digest":"sha256:12191843bba29f42b00cde67e40a81e440135f768532ecfe4507c0f6ce764459","download_count":87,"created_at":"2026-10-21T16:30:20Z","updated_at":"2026-10-21T16:30:27Z"},{"id":663118495,"node_id":"RA_kwDOKr-Pws4nhmKf","name":"new-api-v1.0.0-rc.46","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":136720649,"digest":"sha256:9a18f76273c715a1d343e6a802271d627765134c3dc9ea5dc21a1ab9e612e371","download_count":419,"created_at":"2026-10-21T16:29:58Z","updated_at":"2026-10-21T16:30:04Z"},{"id":663121966,"node_id":"RA_kwDOKr-Pws4nhnAu","name":"new-api-v1.0.0-rc.46.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":138594816,"digest":"sha256:209aa301046c84a3186bbe98431c497a9b2aa2bfb7812d2913073a6f714b1b03","download_count":544,"created_at":"2026-10-21T16:31:10Z","updated_at":"2026-10-21T16:31:16Z"}],"body":"> [!IMPORTANT]\r\n> \u4fee\u590d CVE-2026-111943\uff0c\u8bf7\u5c3d\u5feb\u5347\u7ea7\u3002\u8fd9\u4e00\u7248\u7528 Go 1.26.10\u3002Go \u6821\u9a8c\u8bc1\u4e66\u65f6\uff0c\u4f1a\u62d2\u7edd\u4e00\u5c0f\u6279\u5df2\u7ecf\u4e0d\u518d\u53ef\u4fe1\u7684\u4e2d\u95f4\u8bc1\u4e66\u3002\u7528\u6e90\u7801\u7f16\u8bd1\u7684\uff0cGo \u4e5f\u8981\u6362\u6210 1.26.10\u3002\r\n>\r\n> Fixes CVE-2026-111943. Please upgrade soon. This release runs on Go 1.26.10. When Go checks a certificate, it rejects a small set of intermediate certificates that are no longer trusted. Builds from source need Go 1.26.10 too.\r\n\r\n## \u4e2d\u6587\r\n\r\n* **\u5b89\u5168**\uff1a\u4fee\u590d CVE-2026-111943\u3002\u8fd0\u884c\u65f6\u6539\u4e3a Go 1.26.10\uff0c\u6821\u9a8c\u8bc1\u4e66\u65f6\u4f1a\u62d2\u7edd\u4e00\u5c0f\u6279\u5df2\u7ecf\u4e0d\u518d\u53ef\u4fe1\u7684\u4e2d\u95f4\u8bc1\u4e66\u3002\r\n* **\u90ae\u4ef6**\uff1a\u65b0\u589e\u7528 Resend \u53d1\u90ae\u4ef6\u7684\u529f\u80fd\uff0c\u53ef\u4ee5\u4ee3\u66ff SMTP\u3002\u53d1\u4ef6\u5730\u5740\u548c\u53d1\u4ef6\u4eba\u540d\u79f0\u5355\u72ec\u586b\u3002\r\n* **\u6570\u636e\u770b\u677f**\uff1a\u65b0\u589e\u7f13\u5b58\u7528\u91cf\u7684\u663e\u793a\uff0c\u548c\u603b token \u653e\u5728\u4e00\u8d77\u3002\r\n* **\u5411\u91cf**\uff1a\u65b0\u589e\u963f\u91cc\u4e91\u767e\u70bc\u591a\u6a21\u6001\u5411\u91cf\u6a21\u578b qwen3-vl-embedding \u7684\u652f\u6301\uff0c\u540c\u7cfb\u5217\u7684\u89c6\u89c9\u5411\u91cf\u6a21\u578b\u4e5f\u8d70\u8fd9\u4e2a\u63a5\u53e3\u3002\r\n* **\u4efb\u52a1**\uff1a\u4fee\u590d\u4efb\u52a1\u6362\u6e20\u9053\u91cd\u8bd5\u65f6\u8fd8\u6309\u4e0a\u4e00\u6b21\u4ef7\u683c\u8ba1\u8d39\u7684\u95ee\u9898\u3002\u66f4\u8d35\u7684\u6e20\u9053\u4f1a\u5148\u8865\u9884\u6263\uff0c\u4f59\u989d\u4e0d\u591f\u5c31\u4e0d\u4f1a\u53d1\u51fa\u53bb\u3002\u4fee\u590d\u4efb\u52a1\u63d0\u4ea4\u548c\u8f6e\u8be2\u6ca1\u7528\u4e0a\u300c\u8bf7\u6c42\u5934\u8986\u76d6\u300d\u7684\u95ee\u9898\u3002\u4fee\u590d\u8f6e\u8be2\u8df3\u5230\u522b\u7684\u5730\u5740\u65f6\u5bc6\u94a5\u8ddf\u7740\u8fc7\u53bb\u7684\u95ee\u9898\u3002\r\n* **\u6e20\u9053**\uff1a\u4fee\u590d\u53ef\u7075\u4e0d\u63a5\u53d7\u5355\u4e2a\u5bc6\u94a5\u7684\u95ee\u9898\u3002\u63d2\u4ef6 1.1.1\uff0c\u4e0d\u5e26\u7ad6\u7ebf\u7684\u5bc6\u94a5\u53ef\u4ee5\u76f4\u63a5\u7528\u3002\u4fee\u590d DeepSeek \u7f8e\u5143\u4f59\u989d\u662f 0\u3001\u4eba\u6c11\u5e01\u6709\u94b1\u65f6\uff0c\u4f59\u989d\u663e\u793a\u6210 0 \u7684\u95ee\u9898\u3002\r\n* **\u4fee\u590d**\uff1a\u4fee\u590d\u901a\u77e5\u9650\u6d41\u6bcf\u5230\u6574\u70b9\u5c31\u91cd\u65b0\u8ba1\u6570\u7684\u95ee\u9898\uff0c\u8d85\u8fc7 60 \u5206\u949f\u4e5f\u6309\u4f60\u8bbe\u7684\u65f6\u957f\u7b97\u3002\u4fee\u590d Claude \u6d41\u5f0f\u8bf7\u6c42\u5728\u51c6\u5907\u548c\u91cd\u8bd5\u671f\u95f4\u65ad\u5f00\u7684\u95ee\u9898\u3002\u4fee\u590d\u8fde\u7eed\u7684\u52a9\u624b\u6d88\u606f\u5408\u5e76\u540e\u4e22\u6389\u5de5\u5177\u8c03\u7528\u3001Claude \u62a5\u9519\u7684\u95ee\u9898\u3002\u4fee\u590d Redis \u6e05\u6389\u811a\u672c\u540e\u9650\u6d41\u5931\u6548\u7684\u95ee\u9898\u3002\u53d1\u7ed9 Gemini \u7684\u5411\u91cf\u8bf7\u6c42\u91cc\u5e26\u4e86\u56fe\u7247\u6216\u89c6\u9891\u65f6\uff0c\u4f1a\u76f4\u63a5\u62d2\u7edd\uff0c\u4e0d\u518d\u8ba1\u8d39\u3002\r\n\r\n## English\r\n\r\n* **Security**: Fixed CVE-2026-111943 by moving to Go 1.26.10. Certificate checks reject a small set of intermediate certificates that are no longer trusted.\r\n* **Email**: Added Resend for sending mail, in place of SMTP. The sender address and sender name are set on their own.\r\n* **Dashboard**: Added cache usage next to the total token count.\r\n* **Embeddings**: Added Alibaba Bailian multimodal embeddings, starting with qwen3-vl-embedding. The other vision embedding models on Bailian use the same endpoint.\r\n* **Tasks**: Fixed a retry on another channel still using the previous price. A more expensive channel reserves the difference first, and is not called when the balance cannot cover it. Fixed task submission and polling ignoring Request Header Override. Fixed polling redirects carrying the key to another address.\r\n* **Channels**: Fixed Kling rejecting a single key. Plugin 1.1.1 accepts a key with no vertical bar. Fixed DeepSeek balance showing 0 when the USD wallet is 0 and the CNY wallet has money.\r\n* **Fixes**: Fixed notification rate limits resetting at each hour, so a window longer than 60 minutes lasts for the time you set. Fixed Claude streams dropping during preparation and retries. Fixed merged assistant messages dropping tool calls, which made Claude reject the request. Fixed rate limiting after Redis flushed its scripts. An embedding sent to Gemini with an image or video is rejected and not billed.\r\n\r\n---\r\n\r\n## What's Changed\r\n* fix(notify): keep notification limit window from resetting every hour by @RedwindA in https://github.com/QuantumNous/new-api/pull/7877\r\n* fix(audit): add composite index for audit log ordering by @stl25 in https://github.com/QuantumNous/new-api/pull/7874\r\n* fix(relay): Claude \u6d41\u5f0f\u8bf7\u6c42\u5728\u51c6\u5907\u548c\u91cd\u8bd5\u671f\u95f4\u6301\u7eed\u4fdd\u6d3b by @mameikagou in https://github.com/QuantumNous/new-api/pull/7857\r\n* feat(email): \u6dfb\u52a0 resend \u90ae\u4ef6\u670d\u52a1\u5546\u63a5\u53e3 by @imysen in https://github.com/QuantumNous/new-api/pull/7880\r\n* feat(dashboard): show cache usage alongside total tokens by @seefs001 in https://github.com/QuantumNous/new-api/pull/7773\r\n* fix(task): \u4fee\u590d\u4efb\u52a1\u63d0\u4ea4\u4e0e\u8f6e\u8be2\u7684\u8bf7\u6c42\u5934\u8986\u76d6 by @qinhanlei in https://github.com/QuantumNous/new-api/pull/7918\r\n* feat: \u652f\u6301\u963f\u91cc\u591a\u6a21\u6001\u5411\u91cf\u5316\u6a21\u578bqwen3-vl-embedding by @feitianbubu in https://github.com/QuantumNous/new-api/pull/5179\r\n* fix(relaykit): keep tool calls when merging adjacent assistant messages for Claude by @rjchien728 in https://github.com/QuantumNous/new-api/pull/7921\r\n* fix(kling): \u652f\u6301\u5355 API Key by @ZIYUT in https://github.com/QuantumNous/new-api/pull/7897\r\n* fix(limiter): recover redis script after flush(#6412) by @BradleyZhang in https://github.com/QuantumNous/new-api/pull/6486\r\n* fix: fall back to CNY when the DeepSeek USD wallet is zero by @brushax in https://github.com/QuantumNous/new-api/pull/7917\r\n* chore(deps): bump github.com/klauspost/compress from 1.18.3 to 1.18.7 by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7931\r\n* chore(deps-dev): bump vitest from 4.1.10 to 5.0.4 in /web by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/7838\r\n* fix: upgrade Go to 1.26.10 for CVE-2026-111943 by @seefs001 in https://github.com/QuantumNous/new-api/pull/7942\r\n\r\n## New Contributors\r\n* @stl25 made their first contribution in https://github.com/QuantumNous/new-api/pull/7874\r\n* @mameikagou made their first contribution in https://github.com/QuantumNous/new-api/pull/7857\r\n* @imysen made their first contribution in https://github.com/QuantumNous/new-api/pull/7880\r\n* @qinhanlei made their first contribution in https://github.com/QuantumNous/new-api/pull/7918\r\n* @ZIYUT made their first contribution in https://github.com/QuantumNous/new-api/pull/7897\r\n* @BradleyZhang made their first contribution in https://github.com/QuantumNous/new-api/pull/6486\r\n* @brushax made their first contribution in https://github.com/QuantumNous/new-api/pull/7917\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.45...v1.0.0-rc.46","reactions":{"total_count":8,"+1":3,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":12}
