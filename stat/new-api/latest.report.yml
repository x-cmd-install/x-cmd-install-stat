Pws4iJafy","name":"new-api-arm64-v1.0.0-rc.38","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":127336713,"digest":"sha256:05b83410aa43f99bf40b74cc8c686980733905cfe6576b388af2d9da48e36c7a","download_count":46,"created_at":"2026-09-18T15:23:21Z","updated_at":"2026-09-18T15:23:25Z"},{"id":572894451,"node_id":"RA_kwDOKr-Pws4iJazz","name":"new-api-macos-v1.0.0-rc.38","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":154931154,"digest":"sha256:f9670e8c244d93a3c6cc26c981fbb1a2a72e34943a9dc60f52de44595a49e1f0","download_count":48,"created_at":"2026-09-18T15:24:04Z","updated_at":"2026-09-18T15:24:11Z"},{"id":572893169,"node_id":"RA_kwDOKr-Pws4iJafx","name":"new-api-v1.0.0-rc.38","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":131436809,"digest":"sha256:87aef2a18fc453f4082342a1a3bc1da1080b31790648c26d050d7b032505dac1","download_count":296,"created_at":"2026-09-18T15:23:21Z","updated_at":"2026-09-18T15:23:25Z"},{"id":572897276,"node_id":"RA_kwDOKr-Pws4iJbf8","name":"new-api-v1.0.0-rc.38.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":133522944,"digest":"sha256:e36a6c4ba10624f5b0d7ed495e199bcd779aae25ead71458a9e5aed73c6a4536","download_count":350,"created_at":"2026-09-18T15:25:33Z","updated_at":"2026-09-18T15:25:39Z"}],"body":"> [!IMPORTANT]\r\n> **Request Policies & Channels / \u8bf7\u6c42\u7b56\u7565\u4e0e\u6e20\u9053**\r\n>\r\n> \u7cfb\u7edf\u8bbe\u7f6e\u65b0\u589e\u8bf7\u6c42\u7b56\u7565\uff1a\u96c6\u4e2d\u914d\u7f6e\u8bf7\u6c42\u68c0\u67e5\u3001\u4f1a\u8bdd\u4e0e\u91cd\u8bd5\u3001\u6e20\u9053\u5065\u5eb7\uff0c\u5e76\u5728\u4f7f\u7528\u65e5\u5fd7\u4e2d\u7559\u4e0b\u7b56\u7565\u51b3\u7b56\u8bb0\u5f55\u3002\r\n>\r\n> \u6e20\u9053\u521b\u5efa\u4e0e\u7f16\u8f91\u8865\u5145\u5feb\u6377\u9009\u9879\u3001\u900f\u4f20\u8bf4\u660e\uff0c\u4ee5\u53ca\u6a21\u578b\u91cd\u5b9a\u5411\u5de5\u4f5c\u53f0\u3002\u9ad8\u7ea7\u81ea\u5b9a\u4e49\u6e20\u9053\u53ef\u6309\u8def\u5f84\u5355\u72ec\u5f00\u542f\u900f\u4f20\u3002\u65b0\u589e vLLM\u3001SGLang \u6e20\u9053\uff1bOllama \u6e20\u9053\u53ef\u6309\u6e20\u9053\u5f00\u542f OpenAI \u517c\u5bb9\u5bf9\u8bdd\u3002\r\n>\r\n> \u6e20\u9053\u53ef\u5f00\u542f Responses WebSocket\u3002\u9ad8\u7ea7\u81ea\u5b9a\u4e49\u3001Sub2API\u3001New API \u6e20\u9053\u5728\u5f00\u5173\u6253\u5f00\u540e\u53ef\u7528\uff1b\u9ad8\u7ea7\u81ea\u5b9a\u4e49\u4ec5\u7528\u4e8e\u65e0\u8f6c\u6362\u7684 `/v1/responses`\u3002\r\n>\r\n> System Settings now includes Request policies: Request checks, Sessions and retries, and Channel health, with policy decision records on Usage Logs.\r\n>\r\n> Channel create and edit add Quick options, Pass-through guidance, and a Model Mapping workbench. Advanced Custom channels can enable Pass-through per path. vLLM and SGLang channels are added. Ollama channels can enable OpenAI-compatible chat per Channel.\r\n>\r\n> Channels can enable Responses WebSocket. Advanced Custom, Sub2API, and New API channels can use it when the toggle is on. Advanced Custom only uses converter-free `/v1/responses` paths.\r\n\r\n> [!WARNING]\r\n> **Experimental Plugin System / \u5b9e\u9a8c\u6027\u63d2\u4ef6\u7cfb\u7edf**\r\n>\r\n> \u81ea v1.0.0-rc.27 \u8d77\u5f15\u5165\u7684\u5b9e\u9a8c\u6027\u63d2\u4ef6\u7cfb\u7edf\u4ecd\u5904\u4e8e\u6d4b\u8bd5\u9636\u6bb5\uff0c\u5e76\u6d89\u53ca\u8f83\u5927\u7684\u67b6\u6784\u8c03\u6574\u3002\u5982\u9047\u95ee\u9898\uff0c\u8bf7\u53ca\u65f6\u53cd\u9988\u3002\r\n>\r\n> \u4ece v1.0.0-rc.26 \u6216\u66f4\u65e9\u7248\u672c\u5347\u7ea7\u7684\u7528\u6237\uff0c**\u5fc5\u987b\u91cd\u65b0\u914d\u7f6e\u6240\u6709\u89c6\u9891\u6a21\u578b\u4ef7\u683c**\uff1b\u5df2\u5b8c\u6210\u8be5\u914d\u7f6e\u7684\u7528\u6237\u65e0\u9700\u91cd\u590d\u64cd\u4f5c\u3002**\u672c\u7248\u672c\u4ecd\u4e0d\u63a8\u8350\u7528\u4e8e\u751f\u4ea7\u73af\u5883\u3002**\r\n>\r\n> The experimental plugin system introduced in v1.0.0-rc.27 remains under testing and includes major architectural changes. Please report any issues promptly.\r\n>\r\n> Users upgrading from v1.0.0-rc.26 or earlier **must reconfigure all video model prices**. Users who have already completed this step do not need to repeat it. **This release is still not recommended for production use.**\r\n\r\n## New Features\r\n\r\n* Added Request policies in System Settings: Request checks, Sessions and retries, and Channel health, with policy decision records on Usage Logs.\r\n* Added Responses WebSocket relay, with a per-Channel toggle. Advanced Custom, Sub2API, and New API channels can use it when enabled; Advanced Custom only uses converter-free `/v1/responses`.\r\n* Added a Model Mapping workbench, Quick options, and Pass-through controls in the Channel editor. Advanced Custom channels can enable Pass-through per path.\r\n* Added vLLM and SGLang channels. Ollama channels can enable OpenAI-compatible chat per Channel.\r\n* Added filtered task history and cleanup in System Info.\r\n* Show subscription deductions on Usage Logs, and flag Response model mismatch when the upstream model differs.\r\n\r\n## Fixes and Improvements\r\n\r\n* Interrupted Responses streams no longer settle at zero and refund the whole pre-consume Quota; estimated usage is billed unless upstream reported an explicit failure ([#7427](https://github.com/QuantumNous/new-api/issues/7427)).\r\n* Count Images by payload for Quota, and map image output token details into image-output billing ([#7410](https://github.com/QuantumNous/new-api/issues/7410)).\r\n* Hailuo / MiniMax Task Plugins bill only the dimensions each model family supports.\r\n* Reserve model rate-limit slots and judge success by the response outcome, not HTTP status alone.\r\n* Hide Task Plugin keys from the public no-Channel 503, while keeping plugin context for operators ([#7414](https://github.com/QuantumNous/new-api/issues/7414)).\r\n* Reject Gemini `:countTokens` as an unknown path instead of treating it as generateContent ([#7388](https://github.com/QuantumNous/new-api/issues/7388)).\r\n* Request stream usage on every cross-protocol conversion to OpenAI chat ([#7389](https://github.com/QuantumNous/new-api/issues/7389)).\r\n* Preserve Ollama tool calls from the final stream frame ([#7376](https://github.com/QuantumNous/new-api/issues/7376)).\r\n* Restore saved compatible Passkey domains; fix DeepSeek Channel balance fetch ([#6814](https://github.com/QuantumNous/new-api/issues/6814)); accept mixed-case audio extensions ([#7321](https://github.com/QuantumNous/new-api/issues/7321)).\r\n* Handle legacy database constraints and scoped authorization policies on upgrade.\r\n\r\n---\r\n\r\n## What's Changed\r\n* test(web): stabilize flaky frontend suite timeouts and motion visibility races by @RedwindA in https://github.com/QuantumNous/new-api/pull/7367\r\n* fix: unify model provider detection and add Wan icon by @seefs001 in https://github.com/QuantumNous/new-api/pull/7373\r\n* fix(dashboard): align weekly default range with available preset by @jimmyleocn in https://github.com/QuantumNous/new-api/pull/7355\r\n* fix(web): prevent combobox dropdowns opening on dialog autofocus by @RedwindA in https://github.com/QuantumNous/new-api/pull/7365\r\n* fix(audio): case-insensitive file extension in GetAudioDuration by @chiliec in https://github.com/QuantumNous/new-api/pull/7321\r\n* fix(pricing): keep model status bar spacing uniform by @jimmyleocn in https://github.com/QuantumNous/new-api/pull/7284\r\n* Add Responses WebSocket relay support by @KoSukeWork in https://github.com/QuantumNous/new-api/pull/5062\r\n* feat: vllm channel && sglang channel by @seefs001 in https://github.com/QuantumNous/new-api/pull/7332\r\n* fix(pricing): \u4fee\u590d\u6392\u5e8f\u83dc\u5355\u6253\u5f00\u65f6\u5bfc\u822a\u680f\u6a2a\u5411\u4f4d\u79fb by @jimmyleocn in https://github.com/QuantumNous/new-api/pull/7145\r\n* fix(ollama): preserve tool calls from final stream frame | \u4fdd\u7559\u6d41\u5f0f\u672b\u5c3e\u5e27\u7684 tool calls by @zcxads666 in https://github.com/QuantumNous/new-api/pull/7376\r\n* feat(channel): \u4fee\u590d\u83b7\u53d6DeepSeek\u4f59\u989d\u9519\u8bef by @sszj987-crypto in https://github.com/QuantumNous/new-api/pull/6814\r\n* feat(rate-limit): optimize in-memory limiter allocation and cleanup by @sszj987-crypto in https://github.com/QuantumNous/new-api/pull/6807\r\n* feat(ollama): add per-channel OpenAI-compatible chat switch by @seefs001 in https://github.com/QuantumNous/new-api/pull/7382\r\n* fix(gemini): accept case-insensitive thinkingLevel  by @seefs001 in https://github.com/QuantumNous/new-api/pull/7387\r\n* fix(gemini): reject :countTokens as an unknown route  by @seefs001 in https://github.com/QuantumNous/new-api/pull/7388\r\n* fix(relay): request stream usage on every cross-protocol conversion by @seefs001 in https://github.com/QuantumNous/new-api/pull/7389\r\n* feat: per-route pass-through for advanced custom channels by @seefs001 in https://github.com/QuantumNous/new-api/pull/7386\r\n* fix(middleware): \u9690\u85cf\u65e0\u53ef\u7528\u6e20\u9053\u9519\u8bef\u4e2d\u7684\u4efb\u52a1\u63d2\u4ef6\u6807\u8bc6 by @blackdm666 in https://github.com/QuantumNous/new-api/pull/7414\r\n* docs(github): tighten issue and PR templates for pass-through by @seefs001 in https://github.com/QuantumNous/new-api/pull/7438\r\n* refactor: show subscription deductions and improve cost display by @seefs001 in https://github.com/QuantumNous/new-api/pull/7272\r\n* feat(log): flag upstream response model mismatches by @seefs001 in https://github.com/QuantumNous/new-api/pull/7418\r\n* fix(relay): \u5c06 Images \u7684 output_tokens_details \u6620\u5c04\u5230 img_o by @sxhstc in https://github.com/QuantumNous/new-api/pull/7410\r\n* fix(responses): estimate usage for streams cut before terminal usage by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7427\r\n* doc: fix issue template by @seefs001 in https://github.com/QuantumNous/new-api/pull/7441\r\n\r\n## New Contributors\r\n* @chiliec made their first contribution in https://github.com/QuantumNous/new-api/pull/7321\r\n* @KoSukeWork made their first contribution in https://github.com/QuantumNous/new-api/pull/5062\r\n* @sszj987-crypto made their first contribution in https://github.com/QuantumNous/new-api/pull/6814\r\n* @blackdm666 made their first contribution in https://github.com/QuantumNous/new-api/pull/7414\r\n* @sxhstc made their first contribution in https://github.com/QuantumNous/new-api/pull/7410\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.37...v1.0.0-rc.38","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":10}
