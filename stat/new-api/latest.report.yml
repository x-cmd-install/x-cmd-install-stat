3","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":131399945,"digest":"sha256:37138d5c6e0753fe39e77ee7f46193b08e4082c408fd34a17d75305ceed7e5ca","download_count":58,"created_at":"2026-10-10T06:10:58Z","updated_at":"2026-10-10T06:11:03Z"},{"id":627171627,"node_id":"RA_kwDOKr-Pws4lYeEr","name":"new-api-macos-v1.0.0-rc.43","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":159001154,"digest":"sha256:da32c77c87738d54cf53f1bfa2604d707ce0b0a04d2b3083df2c933bc5205a04","download_count":87,"created_at":"2026-10-10T06:11:51Z","updated_at":"2026-10-10T06:11:58Z"},{"id":627170110,"node_id":"RA_kwDOKr-Pws4lYds-","name":"new-api-v1.0.0-rc.43","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":135557385,"digest":"sha256:f0eb38aeaf4ee2da71ecba83503b3a9bdce51b3fb21df518ad8c07e38ac28c20","download_count":345,"created_at":"2026-10-10T06:10:58Z","updated_at":"2026-10-10T06:11:03Z"},{"id":627172900,"node_id":"RA_kwDOKr-Pws4lYeYk","name":"new-api-v1.0.0-rc.43.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":137426944,"digest":"sha256:3719f505ad805ab7b565a73acb18259cd1b2bed3a91d33a162b77124fe139748","download_count":524,"created_at":"2026-10-10T06:12:35Z","updated_at":"2026-10-10T06:12:40Z"}],"body":"> [!IMPORTANT]\r\n> \u5b8c\u5584\u4e86 i18n\uff0c\u63a7\u5236\u53f0\u3001API \u9519\u8bef\u3001\u90ae\u4ef6\u3001\u901a\u77e5\u548c\u670d\u52a1\u5668\u65e5\u5fd7\u90fd\u652f\u6301\u591a\u8bed\u8a00\u3002\u4f7f\u7528 DEFAULT_LANGUAGE \u73af\u5883\u53d8\u91cf\u8bbe\u7f6e\u9ed8\u8ba4\u8bed\u8a00\uff0c\u4e0d\u8bbe\u7f6e\u65f6\u4e3a\u82f1\u6587\u3002\r\n>\r\n> \u6e20\u9053\u65b0\u589e\u201c\u5ffd\u7565\u4e0a\u6e38\u8bc1\u4e66\u6821\u9a8c\u201d\u5f00\u5173\uff0c\u53ef\u4ee5\u8fde\u63a5\u4f7f\u7528\u81ea\u7b7e\u8bc1\u4e66\u7684\u4e0a\u6e38\u3002\r\n>\r\n> \u4efb\u52a1\u63d2\u4ef6\u65b0\u589e utils.fetch\uff0c\u53ef\u4ee5\u8bfb\u53d6\u4e0a\u6e38\u6570\u636e\u3002\r\n>\r\n> \u8c46\u5305 Seedance 1.5 Pro\u30012.x \u548c\u4e07\u76f8 3.0 \u652f\u6301\u4f20 -1 \u81ea\u52a8\u9009\u62e9\u65f6\u957f\uff0c\u6309\u4e0a\u6e38\u56de\u62a5\u7684\u65f6\u957f\u8ba1\u8d39\u3002\r\n>\r\n> Improved i18n. Console messages, API errors, emails, notifications, and server logs are now multilingual. Set the default language with the DEFAULT_LANGUAGE environment variable. It defaults to English.\r\n>\r\n> Channels have a new Skip Upstream TLS Verification switch for upstreams that use self-signed certificates.\r\n>\r\n> Task plugins can read upstream data with the new utils.fetch.\r\n>\r\n> Doubao Seedance 1.5 Pro and 2.x, and Wan 3.0, accept -1 to pick the video duration automatically and bill the duration the upstream reports.\r\n\r\n## New Features\r\n\r\n- Improved i18n. The web console shows API messages and log entries in all seven interface languages. The backend translates errors for AI clients, emails, and notifications into English, Simplified Chinese, or Traditional Chinese, using the account language first and then the request's Accept-Language header. Log entries written before this release keep their original text.\r\n- `DEFAULT_LANGUAGE` (`en`, `zh-CN`, or `zh-TW`) sets the default language of backend messages and server logs. It defaults to `en`.\r\n- Skip Upstream TLS Verification is under the HTTP settings of each channel. It covers the channel's relay requests, Responses and Realtime WebSocket, task submission and polling, plugin fetches, balance, usage, and model-list queries, and media proxied through the channel. Codex OAuth refresh and Vertex or plugin service-account tokens still verify certificates.\r\n- Task plugins can call `utils.fetch` in the submit, query, and content-download hooks. It reaches the channel Base URL and the additional request domains the plugin declares, and the upload dialog lists those domains. The [Task Plugin API v1](https://github.com/QuantumNous/new-api/blob/v1.0.0-rc.43/docs/plugin-api/v1.md) document lists the hooks and limits.\r\n- Plugins can call `utils.json.clone` and export `parseSubmitEventDelta` with no capability declaration. Plugins that declare `json-clone@1` or `submit-sse-delta@1` keep loading.\r\n- Doubao 1.3.0 and Alibaba Bailian 1.4.2 accept a duration of `-1` for Seedance 1.5 Pro and 2.x and for Wan 3.0. The request reserves the model's longest duration (12 seconds for Seedance 1.5 Pro, 15 for 2.0, 30 for 2.5 and Wan 3.0) and bills the duration the upstream reports. A JSON duration on `/v1/videos` now reaches Ark, and Wan 3.0 smart duration works on `/v1/video/generations`. (#7700)\r\n\r\n## Fixes and Improvements\r\n\r\n- Responses input converted for Claude and Gemini drops assistant text that comes after the last user message or tool result, and records a `trailing_assistant_omitted` warning. Codex sends such input when it retries a stream that failed after a reply finished. Claude 4.6 and later, Gemini 3.6 Flash, and Gemini 3.5 Flash-Lite and later rejected it with a 400. Chat Completions and Claude Messages requests keep their prefill.\r\n- xAI Grok Imagine 1.1.0 bills video edits and extensions at the output resolution. The output keeps the input video's resolution up to 720p. The plugin reads the output file header and bills 480p when the shorter side is 480 pixels or less. It bills 720p otherwise, and when the header cannot be read.\r\n- Hailuo 1.2.1 downloads MiniMax v1 videos through the file retrieve link. Those downloads returned 410 before. (#7709)\r\n- Multipart task submissions send the Content-Type of the rebuilt body, so the boundary matches the body the upstream receives. (#7655)\r\n\r\n---\r\n\r\n## What's Changed\r\n* fix(task-plugin): set multipart content type for upstream requests by @LauZzL in https://github.com/QuantumNous/new-api/pull/7655\r\n* feat(i18n): translate web console messages in the frontend and AI-client errors in the backend by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/7712\r\n\r\n\r\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.42...v1.0.0-rc.43","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
