l":"","uploader":{"login":"buf-release-bot[bot]","id":116301919,"node_id":"BOT_kgDOBu6gXw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":21273600,"digest":"sha256:f7fb9c9dc7585cff3c3444500ffe0d15397dcda5c0b12da5c27db00a52d8bc37","download_count":7,"created_at":"2026-10-14T17:27:36Z","updated_at":"2026-10-14T17:27:37Z"},{"id":641111940,"node_id":"RA_kwDODKn4M84mNpeE","name":"protoc-gen-buf-lint-Windows-x86_64.exe","label":"","uploader":{"login":"buf-release-bot[bot]","id":116301919,"node_id":"BOT_kgDOBu6gXw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":22728704,"digest":"sha256:dcde0acd4dfc7a4e2b1c438ceb9927a7f4ad23d3eadd6194771fb949e98401f4","download_count":9,"created_at":"2026-10-14T17:27:37Z","updated_at":"2026-10-14T17:27:38Z"},{"id":641111960,"node_id":"RA_kwDODKn4M84mNpeY","name":"sha256.txt","label":"","uploader":{"login":"buf-release-bot[bot]","id":116301919,"node_id":"BOT_kgDOBu6gXw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":5312,"digest":"sha256:ca4df0bbe2327eaaca4eda4035b49164b2a7fd47f42345bfa4a126b4c28f1efb","download_count":3479,"created_at":"2026-10-14T17:27:37Z","updated_at":"2026-10-14T17:27:38Z"},{"id":641111967,"node_id":"RA_kwDODKn4M84mNpef","name":"sha256.txt.minisig","label":"","uploader":{"login":"buf-release-bot[bot]","id":116301919,"node_id":"BOT_kgDOBu6gXw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":302,"digest":"sha256:54460d01ab84b2de20760ae70eb6d16d9625f21901ff85f03ef9e2b2b657124f","download_count":2316,"created_at":"2026-10-14T17:27:37Z","updated_at":"2026-10-14T17:27:38Z"}],"body":"- Improve the performance of the `PROTOVALIDATE` lint rule, which is now up to 3x faster\r\n  and allocates less memory on modules using `cel` rules or `example` values.\r\n- Send the module name of each file to check plugins, which is available as\r\n  `FileDescriptor.ModuleName()` in bufplugin-go v0.11.0 and later.\r\n- Update `buf curl` to automatically use HTTP/2 prior knowledge for `http` URLs when server\r\n  reflection, the gRPC protocol, or a bidirectional streaming method is used, since all of these\r\n  require HTTP/2. The `--http2-prior-knowledge` flag is no longer required in these cases.\r\n- Add `--stdin-filepath` flag to `buf format`, which reads a single `.proto` file from\r\n  stdin and writes the formatted result to stdout. The path is not read from disk, and is\r\n  only used to report parse errors and diffs.\r\n- Fix `buf convert` panic when converting images that contain files without a `syntax`\r\n  declaration or with unused imports.\r\n- Fix `buf generate` with `strategy: directory` and `include_imports: true` adding imports\r\n  to the `CodeGeneratorRequest` of the directory that imports them. Imports are now split\r\n  by directory into their own requests, the same as non-imports.\r\n- Fix configuration files silently accepting unquoted values that start with `!`, such as\r\n  `ignore: [!foo/bar.proto]`. Previously they parsed as empty strings, now they rejected\r\n  with an error.\r\n- Fix lint comment ignores on proto2 `group` fields being ignored.\r\n- Update the LSP to support named generation templates such as `buf.go.gen.yaml` and\r\n  `buf.gen.go.yaml`.\r\n- Improve the `buf curl` error message for methods that accept a single request message.\r\n- Add `--config` flag to `buf lsp serve` to use a `buf.yaml` file or data in place of\r\n  discovering `buf.yaml` files. Workspaces are resolved from the editor's root folder.\r\n- Deduplicate remote input fetches within a single command invocation, so that multiple\r\n  `inputs` in a `buf.gen.yaml` that resolve to the same archive, git repository, or image\r\n  are fetched once instead of once per input.\r\n- Fix intermittent concurrent map write crash when compiling Editions files.\r\n- Fix Edition 2024 handling of enum value features, `STRICT` default symbol visibility, and\r\n  source locations of `export`/`local` types."}
