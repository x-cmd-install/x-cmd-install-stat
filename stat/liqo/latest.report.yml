nt_type":"raw","state":"uploaded","size":82558464,"digest":"sha256:7475aa68b06486ef1f988a2453203f54ec17d9a5d5a7ead04b1200597974ef1f","download_count":6,"created_at":"2026-10-30T19:09:46Z","updated_at":"2026-10-30T19:09:49Z"},{"id":693131019,"node_id":"RA_kwDOD5pjNc4pUFcL","name":"liqoctl-windows-amd64.tar.gz","label":"","uploader":{"login":"adamjensenbot","id":60964052,"node_id":"MDQ6VXNlcjYwOTY0MDUy","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":24382650,"digest":"sha256:b446c1a48706e3ce79f62773756add55befbbd24072d56c2924d9bf05e115161","download_count":8,"created_at":"2026-10-30T19:09:43Z","updated_at":"2026-10-30T19:09:46Z"}],"body":"<!-- Release notes generated using configuration in .github/release.yml at v1.3.0 -->\r\n\r\n## What's Changed\r\n### :rocket: New Features\r\n* [Networking] added histogram metrics for gateways latency by @cheina97 in https://github.com/liqotech/liqo/pull/3314\r\n* feat: set affinity and nodeSelector to wg gateway templates by @fra98 in https://github.com/liqotech/liqo/pull/3324\r\n* feat: access API server from remote through EndpointSlices by @fra98 in https://github.com/liqotech/liqo/pull/3318\r\n* [Networking] avoid conntrack for geneve traffic by @cheina97 in https://github.com/liqotech/liqo/pull/3286\r\n* feat: update gateways when template changes by @cheina97 in https://github.com/liqotech/liqo/pull/3326\r\n* [VIrtualKubelet] virtualkubelet net configuration as flag by @cheina97 in https://github.com/liqotech/liqo/pull/3332\r\n* feat(authentication): allow disabling the built-in default ResourceSlice class by @thisiskazem in https://github.com/liqotech/liqo/pull/3319\r\n* feat: handle creation and configuration of multiple WireGuard tunnels by @MircoBarone in https://github.com/liqotech/liqo/pull/3226\r\n* [Networking] Geneve tunnel conncheck by @cheina97 in https://github.com/liqotech/liqo/pull/3277\r\n* feat: add extraArgs and pod annotations support for gateway templates by @varnastadeus in https://github.com/liqotech/liqo/pull/3349\r\n* [Liqoctl] peer multi-virtual-node by @cheina97 in https://github.com/liqotech/liqo/pull/3275\r\n* [Networking] FirewallConfigurationBinding by @cheina97 in https://github.com/liqotech/liqo/pull/3290\r\n* [Networking] RouteConfigurationBinding by @cheina97 in https://github.com/liqotech/liqo/pull/3353\r\n* add ECMP support for <remote-cluster-id>-gw-ext RouteConfiguration by @MircoBarone in https://github.com/liqotech/liqo/pull/3291\r\n* feat: add watch for network config in shadowendpointslice controller by @Franc-Zar in https://github.com/liqotech/liqo/pull/3329\r\n* feat(offloading): dynamically update virtualkubelet deployments by @fra98 in https://github.com/liqotech/liqo/pull/3374\r\n* feat(authentication): allow the provider to resolve the ResourceSlice class when unspecified by @thisiskazem in https://github.com/liqotech/liqo/pull/3348\r\n### :bug: Bug Fixes\r\n* fix: delete stale ip masquerade firewallconfigurations by @fra98 in https://github.com/liqotech/liqo/pull/3316\r\n* fix: disable apiserver proxy IP when liqo-proxy disabled by @fra98 in https://github.com/liqotech/liqo/pull/3317\r\n* fix: serve stub OpenAPI documents from metric-agent by @kariya-mitsuru in https://github.com/liqotech/liqo/pull/3282\r\n* [VK] Add type=virtual-kubelet label to Liqo virtual nodes by @claudiolor in https://github.com/liqotech/liqo/pull/3325\r\n* fix: report latency metrics directly from the origin container by @varnastadeus in https://github.com/liqotech/liqo/pull/3347\r\n* fix: fetch rules/routes once during routeconfiguration reconcile by @varnastadeus in https://github.com/liqotech/liqo/pull/3352\r\n* fix: genevetunnel conncheck ping remote ip by @fra98 in https://github.com/liqotech/liqo/pull/3359\r\n* fix: restore deepcopy file generation by @claudiolor in https://github.com/liqotech/liqo/pull/3365\r\n* fix: log only on geneve tunnel creation by @claudiolor in https://github.com/liqotech/liqo/pull/3369\r\n* fix(vk): filter only offloaded pods on VK stats/summary by @fra98 in https://github.com/liqotech/liqo/pull/3379\r\n* fix(metric-agent): set APIResourceList.APIVersion to v1 by @broshell in https://github.com/liqotech/liqo/pull/3372\r\n* fix: rework webhook certificates by @claudiolor in https://github.com/liqotech/liqo/pull/3343\r\n* fix(virtual-kubelet): use webhook auth/authz by @fra98 in https://github.com/liqotech/liqo/pull/3380\r\n* perf(metric-agent): optimize CPU and memory usage with cache by @fra98 in https://github.com/liqotech/liqo/pull/3381\r\n* fix: consolidate gw-ext rules by @varnastadeus in https://github.com/liqotech/liqo/pull/3357\r\n* fix(internal-network): keep pod route ownership on IP reuse by @cheina97 in https://github.com/liqotech/liqo/pull/3409\r\n* fix: remove default from FW config wildcard value by @claudiolor in https://github.com/liqotech/liqo/pull/3394\r\n* fix: arm32 integers comparison checks by @fra98 in https://github.com/liqotech/liqo/pull/3422\r\n### :broom: Code Refactoring\r\n* refactor: disable statefult app test by @cheina97 in https://github.com/liqotech/liqo/pull/3354\r\n* refactor: gw-ext reuse constants by @fra98 in https://github.com/liqotech/liqo/pull/3386\r\n### :truck: Dependencies Management\r\n* chore: bump google.golang.org/grpc from 1.72.2 to 1.83.2 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3228\r\n* chore: bump github.com/jackc/pgx/v5 from 5.7.1 to 5.9.2 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3267\r\n* chore: bump alpine to 3.24.2 by @fra98 in https://github.com/liqotech/liqo/pull/3404\r\n* chore: bump go version to 1.27.2 by @fra98 in https://github.com/liqotech/liqo/pull/3403\r\n* chore: bump urllib3 from 2.6.3 to 2.8.0 in /docs by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3396\r\n* chore: bump github.com/containerd/containerd from 1.7.29 to 1.7.36 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3400\r\n* chore: bump helm.sh/helm/v3 from 3.16.2 to 3.20.2 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3252\r\n* chore: bump oras.land/oras-go/v2 from 2.6.0 to 2.6.2 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3405\r\n* chore: bump github.com/go-git/go-git/v5 from 5.17.0 to 5.19.2 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3402\r\n* chore: bump github.com/google/cel-go from 0.26.0 to 0.29.0 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3401\r\n* chore: bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.69.0 to 1.97.3 by @dependabot[bot] in https://github.com/liqotech/liqo/pull/3248\r\n* chore: bump go to 1.27.3 by @fra98 in https://github.com/liqotech/liqo/pull/3411\r\n* chore: bump alpine to 3.24.3 by @fra98 in https://github.com/liqotech/liqo/pull/3414\r\n### Other Changes\r\n* Revert \"feat: RouteConfigurationBinding\" by @fra98 in https://github.com/liqotech/liqo/pull/3360\r\n* Create SECURITY.md by @frisso in https://github.com/liqotech/liqo/pull/3406\r\n\r\n## New Contributors\r\n* @varnastadeus made their first contribution in https://github.com/liqotech/liqo/pull/3347\r\n* @Franc-Zar made their first contribution in https://github.com/liqotech/liqo/pull/3329\r\n* @broshell made their first contribution in https://github.com/liqotech/liqo/pull/3372\r\n\r\n**Full Changelog**: https://github.com/liqotech/liqo/compare/v1.2.0...v1.3.0","mentions_count":11}
