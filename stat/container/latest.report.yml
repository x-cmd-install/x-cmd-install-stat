n\r\n\r\n\u2328\ufe0f denotes breaking CLI changes.\r\n\r\n\ud83d\udc69\u200d\ud83d\udcbb denotes breaking API changes.\r\n\r\n- Security\r\n  - [GHSA-vgrw-36j7-r93w](https://github.com/apple/containerization/security/advisories/GHSA-vgrw-36j7-r93w) - Pulling an image by digest does not verify that the registry returned the pinned digest\r\n  - [GHSA-fqxg-rrf3-358v](https://github.com/apple/container/security/advisories/GHSA-fqxg-rrf3-358v) - `container build` may serve files outside the build context when a symlink is swapped during a read\r\n- Core\r\n  - [`container commit` command](https://github.com/apple/container/issues/1399)\r\n- Networking\r\n  - [DNS aliases for containers](https://github.com/apple/container/issues/457)\r\n- Build\r\n  - [`container build` and `container builder` are now CLI plugins](https://github.com/apple/container/pull/2298)\r\n- Kubernetes\r\n  - [Multi-worker `container k8s` clusters](https://github.com/apple/container/pull/2276)\r\n\r\n## What's Changed\r\n* Stop importing Testing from ContainerTestSupport by @Hashim1999164 in https://github.com/apple/container/pull/2118\r\n* [container]: add commit command by @saehejkang in https://github.com/apple/container/pull/1762\r\n* Fix k8s list grouping for dual-role control-plane nodes by @Hokila in https://github.com/apple/container/pull/2315\r\n* K8s plugin: support no CNI on create by @katiewasnothere in https://github.com/apple/container/pull/2277\r\n* Remove machine user extension points, update machine docs. by @jglogan in https://github.com/apple/container/pull/2322\r\n* Document build and test targets, and make local test runs self-contained by default (.test-data) by @michaelzhang114 in https://github.com/apple/container/pull/2288\r\n* Skip unreadable entries in image list by @Hokila in https://github.com/apple/container/pull/2157\r\n* Fix coverage generation target by @noah-thor in https://github.com/apple/container/pull/2353\r\n* Fix `container system status` false negative under a Seatbelt sandbox. by @renlord in https://github.com/apple/container/pull/2316\r\n* Add support for multi node k8s clusters by @katiewasnothere in https://github.com/apple/container/pull/2276\r\n* Add a SWIFT_CONFIGURATION_EXTRA hook for extra swift build flags by @noah-thor in https://github.com/apple/container/pull/2354\r\n* Fix container k8s examples in command-reference by @katiewasnothere in https://github.com/apple/container/pull/2355\r\n* Correct coverage scope for unit tests by @noah-thor in https://github.com/apple/container/pull/2356\r\n* Extract `container build` and `container builder` as a CLI plugin by @JaewonHur in https://github.com/apple/container/pull/2298\r\n* CLI test: sync disk after file remove and before clean. by @jglogan in https://github.com/apple/container/pull/2366\r\n* Extract ContainerBuild logic into a library by @JaewonHur in https://github.com/apple/container/pull/2370\r\n* Fix `container image load` for sparse images. by @jglogan in https://github.com/apple/container/pull/2385\r\n* K8s image load fix fqn tagging by @katiewasnothere in https://github.com/apple/container/pull/2384\r\n* Fix built image loading, create command output, and help text in the Kubernetes plugin by @dkovba in https://github.com/apple/container/pull/2369\r\n* Fix minor issues in K8s plugin by @JaewonHur in https://github.com/apple/container/pull/2372\r\n* Use a custom entrypoint script for k8s container nodes by @katiewasnothere in https://github.com/apple/container/pull/2289\r\n* Add DNS aliases and subtree aliases for container network attachments by @jglogan in https://github.com/apple/container/pull/2390\r\n* ci: bump the github-actions group with 2 updates by @dependabot[bot] in https://github.com/apple/container/pull/2391\r\n* Update container-builder-shim to 0.13.2. by @jglogan in https://github.com/apple/container/pull/2394\r\n* Treat a missing log file as empty in container logs by @bryanmosley in https://github.com/apple/container/pull/2393\r\n* Fix container log following when the log is empty by @i098 in https://github.com/apple/container/pull/2377\r\n* Bump to use containerization 0.51.0 by @adityaramani in https://github.com/apple/container/pull/2396\r\n* Fix the cluster delete command when node containers are missing by @dkovba in https://github.com/apple/container/pull/2397\r\n* Update to latest containerization dependency 0.52.0 by @katiewasnothere in https://github.com/apple/container/pull/2407\r\n* Build context fix, bump to containerization 0.52.1. by @jglogan in https://github.com/apple/container/pull/2415\r\n\r\n## New Contributors\r\n* @Hashim1999164 made their first contribution in https://github.com/apple/container/pull/2118\r\n* @Hokila made their first contribution in https://github.com/apple/container/pull/2315\r\n* @michaelzhang114 made their first contribution in https://github.com/apple/container/pull/2288\r\n* @renlord made their first contribution in https://github.com/apple/container/pull/2316\r\n* @bryanmosley made their first contribution in https://github.com/apple/container/pull/2393\r\n* @i098 made their first contribution in https://github.com/apple/container/pull/2377\r\n\r\n**Full Changelog**: https://github.com/apple/container/compare/1.5.0...1.6.0","reactions":{"total_count":25,"+1":10,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":5,"rocket":7,"eyes":0},"mentions_count":14}
