lepresence-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":33208093,"digest":"sha256:308a55034e17de4864c142fbb30b6383b63732b95bfaa591ea23a325daaa0767","download_count":304,"created_at":"2026-08-02T16:36:54Z","updated_at":"2026-08-02T16:36:55Z"},{"id":499075120,"node_id":"RA_kwDOBPF2Q84dv0gw","name":"telepresence-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":29845112,"digest":"sha256:cb50804e1910400000729614a444e4153238061cfbe940514ce185d557582a5f","download_count":43,"created_at":"2026-08-02T16:36:50Z","updated_at":"2026-08-02T16:36:54Z"}],"body":"## Official Release Artifacts\n\n### Installers (with root daemon as a system service)\nThese installers include the option to run the root daemon as a system service, eliminating the need for elevated privileges when using Telepresence.\n\n| Platform | Architecture | Package |\n|----------|--------------|---------|\n| Linux (Debian/Ubuntu) | amd64 | [telepresence-linux-amd64.deb](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-linux-amd64.deb) |\n| Linux (Debian/Ubuntu) | arm64 | [telepresence-linux-arm64.deb](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-linux-arm64.deb) |\n| Linux (Fedora/RHEL) | amd64 | [telepresence-linux-amd64.rpm](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-linux-amd64.rpm) |\n| Linux (Fedora/RHEL) | arm64 | [telepresence-linux-arm64.rpm](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-linux-arm64.rpm) |\n| macOS | amd64 | [telepresence-darwin-amd64.pkg](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-darwin-amd64.pkg) |\n| macOS | arm64 | [telepresence-darwin-arm64.pkg](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-darwin-arm64.pkg) |\n| Windows | amd64 | [telepresence-windows-amd64-setup.exe](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-windows-amd64-setup.exe) |\n| Windows | arm64 | *Not available \u2014 WinFSP and SSHFS-Win installers lack arm64 versions. Use the zip file below.* |\n\n### Standalone Binaries\nStandalone binaries for manual installation. The root daemon runs on-demand with elevated privileges.\n\n| Platform | Architecture | Binary |\n|----------|--------------|--------|\n| Linux | amd64 | [telepresence-linux-amd64](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-linux-amd64) |\n| Linux | arm64 | [telepresence-linux-arm64](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-linux-arm64) |\n| macOS | amd64 | [telepresence-darwin-amd64](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-darwin-amd64) |\n| macOS | arm64 | [telepresence-darwin-arm64](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-darwin-arm64) |\n| Windows | amd64 | [telepresence-windows-amd64.zip](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-windows-amd64.zip) |\n| Windows | arm64 | [telepresence-windows-arm64.zip](https://github.com/telepresenceio/telepresence/releases/download/v2.31.2/telepresence-windows-arm64.zip) |\n\n### Helm Chart\n   - \ud83d\udce6 [Telepresence Helm Chart](https://artifacthub.io/packages/helm/telepresence-oss/telepresence-oss/2.31.2)\n\nFor more information, visit our [installation docs](https://www.telepresence.io/docs/quick-start)."}
