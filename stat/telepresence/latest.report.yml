elepresence/releases/download/v2.32.0/telepresence-linux-arm64.deb) |\n| Linux (Fedora/RHEL) | amd64 | [telepresence-linux-amd64.rpm](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-linux-amd64.rpm) |\n| Linux (Fedora/RHEL) | arm64 | [telepresence-linux-arm64.rpm](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-linux-arm64.rpm) |\n| macOS | amd64 | [telepresence-darwin-amd64.pkg](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-darwin-amd64.pkg) |\n| macOS | arm64 | [telepresence-darwin-arm64.pkg](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-darwin-arm64.pkg) |\n| Windows | amd64 | [telepresence-windows-amd64.msi](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-windows-amd64.msi) |\n| Windows | arm64 | [telepresence-windows-arm64.msi](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-windows-arm64.msi) |\n\n### Standalone Binaries\nStandalone binaries for manual installation. The root daemon runs on-demand with elevated privileges.\n\n| Platform | Architecture | Binary |\n|----------|--------------|--------|\n| Linux | amd64 | [telepresence-linux-amd64](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-linux-amd64) |\n| Linux | arm64 | [telepresence-linux-arm64](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-linux-arm64) |\n| macOS | amd64 | [telepresence-darwin-amd64](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-darwin-amd64) |\n| macOS | arm64 | [telepresence-darwin-arm64](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-darwin-arm64) |\n| Windows | amd64 | [telepresence-windows-amd64.zip](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-windows-amd64.zip) |\n| Windows | arm64 | [telepresence-windows-arm64.zip](https://github.com/telepresenceio/telepresence/releases/download/v2.32.0/telepresence-windows-arm64.zip) |\n\n### Helm Chart\n   - \ud83d\udce6 [Telepresence Helm Chart](https://artifacthub.io/packages/helm/telepresence-oss/telepresence-oss/2.32.0)\n\n### Code signing\nFree code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). See the [code signing policy](https://github.com/telepresenceio/telepresence#code-signing-policy).\n\nFor more information, visit our [installation docs](https://www.telepresence.io/docs/quick-start)."}
