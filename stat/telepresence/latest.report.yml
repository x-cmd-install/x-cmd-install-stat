nceio/telepresence/releases/download/v2.34.0/telepresence-windows-amd64.zip) |\n| Windows | arm64 | [telepresence-windows-arm64.zip](https://github.com/telepresenceio/telepresence/releases/download/v2.34.0/telepresence-windows-arm64.zip) |\n\n### Helm Chart\n   - 📦 [Telepresence Helm Chart](https://artifacthub.io/packages/helm/telepresence-oss/telepresence-oss/2.34.0)\n\n### Code signing\nWindows binaries and installers are Authenticode-signed by Tada AB through Azure Artifact Signing. See the [code signing policy](https://github.com/telepresenceio/telepresence#code-signing-policy).\n\nFor more information, visit our [installation docs](https://www.telepresence.io/docs/quick-start)."}
