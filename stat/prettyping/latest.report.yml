{"id":221087090,"author":{"login":"denilsonsa","id":121676,"node_id":"MDQ6VXNlcjEyMTY3Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAf5yc84NLYVy","tag_name":"v1.1.0","target_commitish":"master","name":"v1.1.0 - less than a decade after the previous release","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-05-26T20:55:33Z","updated_at":"2025-05-26T21:13:38Z","published_at":"2025-05-26T21:13:38Z","assets":[],"body":"## What's Changed\r\n\r\n* The special handling of the `-6` parameter has been dropped. Instead, it is now being passed to the `ping` binary, which should just work on any \"modern\" version of ping. https://github.com/denilsonsa/prettyping/pull/27\r\n* New parameters `--[no]globalstats` and `--[no]recentstats` to toggle each of the two statistics lines.\r\n* Better handling in case `--last <n>` receives a number less than 1. In such case, the recent statistics will be dropped.\r\n* The `--help` output has been widened to 84 characters, to fit the new parameters and their description. If you're stuck with 80-char limit, I'm sorry. If you have a strong opinion about the 80-char limit, please suggest a solution for the help text.","reactions":{"total_count":11,"+1":3,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":7,"rocket":0,"eyes":0}}
