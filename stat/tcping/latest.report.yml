printing the IP address twice when the given target is an IP address itself\r\n- fix: add missing comma separator in no-color statistics output in [376](https://github.com/pouriyajamshidi/tcping/issues/376) thanks to @clarabennettdev\r\n- fix: version typo resulting in erroneous update message raised in [313](https://github.com/pouriyajamshidi/tcping/issues/313)\r\n- build: bump Golang base image to `1.26.3-alpine3.23`\r\n- documents: fix typo in the Chinese README in [386](https://github.com/pouriyajamshidi/tcping/pull/386) thanks to @peeweep\r\n- documents: clarify the difference between static and dynamic binaries in README raised in [357](https://github.com/pouriyajamshidi/tcping/issues/357)\r\n\r\nCompiled with **Go 1.26.3**\r\n\r\n\r\n## SHA256 SUMS\r\n\r\ntcping-freebsd-amd64-static.tar.gz: ab3f20b04327d0bdd00faa274a1dc0c5dbf1eec6d84f8b52e56d353dcd381924  \r\ntcping-freebsd-amd64-dynamic.tar.gz: 1cc5373ddcc5855bafa7ad0313ca0bc390c9aecd91149b7d74a372643c9f6e6c  \r\ntcping-freebsd-arm64-static.tar.gz: 47269ac42025a927565afc914be10020c8933546d08d86adbbcf4a6e2fd0233b  \r\ntcping-freebsd-arm64-dynamic.tar.gz: a4ae662ac742e5ff915987a1855518dcec5be8dde186cb56d2bb54e3a4e3eb93  \r\n\r\ntcping-linux-amd64-static.tar.gz: f88d660ec6d59b1295a229f89c41ce0c8d5df7a3c1e9a1e4f6016deba43ba569  \r\ntcping-linux-amd64-dynamic.tar.gz: 13bb55ad630fc6dc29afe9a70da7948ada22871552d10600220bdc06e254fb47  \r\ntcping-linux-arm64-static.tar.gz: 4439f4d11c71675a174573acf0016fe9f8a5a3ccd406cec0f6a563b0446f44d5  \r\ntcping-linux-arm64-dynamic.tar.gz: e7669a2dd7487170eab263fd35038877e7a5405edd3be6f0bdc0b9e1b5873c3a  \r\n\r\ntcping-darwin-amd64-static.tar.gz: ad8ba6a1de400c3f50ec997f42a9565e048ee3260b30840654489963908662de  \r\ntcping-darwin-amd64-dynamic.tar.gz: 5c2640318546ae51c042cd5389b2aee3d9edfc739894a39dd8ea9251ef4ba6a7  \r\ntcping-darwin-arm64-static.tar.gz: 7eed612e549a2c53412d74abf3ac860742e4e7f889cb46fd554e6b96df66d765  \r\ntcping-darwin-arm64-dynamic.tar.gz: 854be6e27767e25c79848f5