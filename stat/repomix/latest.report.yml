{"id":437999641,"author":{"login":"yamadashy","id":5019072,"node_id":"MDQ6VXNlcjUwMTkwNzI=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOMVwZR84aG1gZ","tag_name":"v1.19.0","target_commitish":"20cc7837e9a72e646c7dbfeeb20dbf7b6f5ea12d","name":"v1.19.0","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-11-08T02:59:59Z","updated_at":"2026-11-08T03:08:40Z","published_at":"2026-11-08T03:04:45Z","assets":[],"body":"This release moves the MCP server to SDK v2 with live progress and cancellation, makes `--compress` output far more accurate, and brings a big round of bug fixes from first-time contributors!\n\n## What's New 🚀\n\n### MCP Server on SDK v2 and the 2026-07-28 Protocol (#1952, #1954)\n\nThe MCP server now runs on the MCP TypeScript SDK v2. Clients that support the 2026-07-28 protocol negotiate it automatically, and existing clients work as before.\n\n- The server exits cleanly when the client closes stdin, so no `repomix --mcp` processes are left behind.\n- The install pulls in about half as many packages (171 to 84), since the v1 SDK brought HTTP transport dependencies such as Express that the stdio-only server never used.\n\nFor client authors: tool schemas now declare JSON Schema 2020-12 (bodies unchanged), and validation errors no longer start with `MCP error -32602: `.\n\n### MCP: Progress and Cancellation for Long-Running Packs (#1955, #1958)\n\n`pack_codebase`, `pack_remote_repository` and `generate_skill` now send `notifications/progress` when the client passes a `progressToken`, so long packs show live status, and clients that reset their timeout on progress no longer cut them off. In `--sandbox` mode, messages carry only the stage name, never a host path.\n\nCancelling a call or disconnecting now stops the pack and cleans up its partial output.\n\n## Improvements ⚡\n\n### More Accurate `--compress` Output (#2003)\n\nGolden tests for every supported language exposed a set of bugs, now fixed:\n\n- Code from function bodies no longer leaks into the output as if it were a declaration.\n- Duplicate lines are removed.\n- Declarations that were silently dropped are kept, such as C/C++ `typedef` and `#define`, C# and Java fields, Rust struct fields, Ruby `attr_*` calls and CSS at-rules.\n\nOutput changes for C, C++, C#, CSS, Dart, Go, Java, JavaScript/TypeScript, Ruby, Rust, Swift and Vue. If you rely on `--compress` in a pipeline, expect a diff from v1.18.\n\n### Skill Generation: Better Tech-Stack Detection (#1995)\n\n`--skill-generate` now reads dependencies from Gradle Kotlin DSL (`build.gradle.kts`) and from the PEP 621 and Poetry forms of `pyproject.toml`.\n\n### Warning When a Remote URL Path Is Ignored (#1980, #1984, #433)\n\nA URL like `https://github.com/owner/repo/tree/main/src/shared` packed the whole repository and silently dropped the path. Repomix now warns and suggests an `--include` pattern:\n\n```\nThe path \"src/shared\" in the remote URL is ignored, and the whole repository will be packed.\nTo pack only that path, add: --include \"src/shared/**\"\n```\n\n## Bug Fixes 🐛\n\n### Ignore Patterns Ending in a Wildcard Now Exclude Files (#1963, #1876, #320)\n\nPatterns such as `**/npm-debug.log*` and `**/repomix-output.*` only excluded directory contents, so files like `npm-debug.log.1` and `docs/repomix-output.xml` slipped into the output. They are now excluded. Nothing that was excluded before becomes included.\n\n### `.git/info/exclude` Follows Git's Matching Rules (#1871, #1870)\n\nA slash-free pattern such as `secret.txt` now matches at any depth, as in Git, so `sub/secret.txt` is no longer packed.\n\nSpecial thanks to @sxh313 for this contribution! 🎉\n\n### Negated Custom Ignore Patterns No Longer Invert (#1975, #400)\n\n`!main.ts` in `ignore.customPatterns` or `--ignore` excluded `main.ts` instead of re-including it. Negated patterns are now skipped with a warning until proper support lands (#400).\n\n### Split Output Files No Longer Packed into the Next Run (#1921, #1920)\n\nWith `--split-output`, files like `repomix-output.1.xml` from a previous run are no longer picked up as input.\n\nSpecial thanks to @lorenzozanee for their first contribution! 🎉\n\n### `--remove-comments` Keeps URLs in CSS, SCSS, Less, Vue and Svelte (#1912, #1965, #1911)\n\n`url(http://example.com/logo.png)` was cut to `url(http:` because `//` was treated as a comment. Each language now uses its own comment rules, and Vue and Svelte files are handled per `<script>`, `<style>` and markup section.\n\nSpecial thanks to @plox-sumit for their first contribution! 🎉\n\n### Non-ASCII File Names in Git Logs and Diffs (#1940, #1979)\n\nNames like `日本語.txt` no longer appear as `\"\\346\\227\\245...\"` in git logs and diffs, and `output.git.sortByChanges` now sorts these files correctly.\n\nSpecial thanks to @feiiiiii5 for their first contribution! 🎉\n\n### `--token-count-tree 0` Shows the Full Tree (#1941)\n\nIt printed nothing before; it now shows every file.\n\nSpecial thanks to @feiiiiii5 for this contribution! 🎉\n\n### Nested `--stdin` Paths on Windows (#1922)\n\nPiping paths such as `src/(routes)/page[1].ts` into `repomix --stdin` on Windows packed only root-level files. Nested paths now match.\n\nSpecial thanks to @lux-liang for their first contribution! 🎉\n\n### Fatal Errors Visible Under `--quiet` and `--stdout` (#1875, #1874)\n\nA failed pack under `--quiet` or `--stdout` exited with code 1 and printed nothing. The error now goes to stderr.\n\nSpecial thanks to @sxh313 for this contribution! 🎉\n\n### MCP Server Fixes (#1867, #1866, #1865, #1864, #1869, #1868)\n\n- `--mcp --verbose` no longer writes diagnostics to stdout, where clients read them as protocol frames. (#1867)\n- Error logging is no longer silenced for the rest of the session after a `generate_skill` or `pack_remote_repository` call. (#1865)\n- `grep_repomix_output` now formats context like `grep -C` and handles very large outputs. (#1869)\n\nSpecial thanks to @sxh313 for their first contribution! 🎉\n\n## Security Hardening 🔒\n\n### MCP `pack_codebase` Always Runs the Secret Scan (#1960)\n\nA `repomix.config.json` in the packed directory could turn off the secret scan for MCP packs with `security.enableSecurityCheck: false`. The scan now always runs for MCP packs; plain CLI runs still follow the config file.\n\n## Documentation 📚\n\nThe MCP docs now state that without `--sandbox`, `pack_codebase` trusts the `repomix.config.*` in the directory it packs, just like running the CLI there. Use `--sandbox` when your assistant may pack untrusted directories, such as cloned third-party repositories. (#1961)\n\nSee [MCP Server: Sandbox Mode](https://repomix.com/guide/mcp-server#sandbox-mode) and [Why a config file is code](https://repomix.com/guide/security#why-a-config-file-is-code).\n\n## How to Update\n\n```bash\nnpm update -g repomix\n```\n\n---\n\nAs always, if you have any issues or suggestions, please let us know on GitHub issues or our [Discord community](https://discord.gg/wNYzTwZFku).\n","mentions_count":5}
