la-2.13.18.tgz","label":"","uploader":{"login":"scala-jenkins","id":1563693,"node_id":"MDQ6VXNlcjE1NjM2OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":22683424,"digest":"sha256:1834d09fd5c78ec77e9a933ab76c724280a8ec9595a332a6112823787a9ac3e6","download_count":20073,"created_at":"2025-11-17T09:35:29Z","updated_at":"2025-11-17T09:35:30Z"},{"id":317382229,"node_id":"RA_kwDOACwUcs4S6t5V","name":"scala-2.13.18.zip","label":"","uploader":{"login":"scala-jenkins","id":1563693,"node_id":"MDQ6VXNlcjE1NjM2OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":22720670,"digest":"sha256:9c90562f29b0a316e269474d6752bc8ec45b1cabf61d5401d7ca50407b3a9d2b","download_count":21467,"created_at":"2025-11-17T09:35:28Z","updated_at":"2025-11-17T09:35:29Z"},{"id":317382265,"node_id":"RA_kwDOACwUcs4S6t55","name":"scala-docs-2.13.18.tgz","label":"","uploader":{"login":"scala-jenkins","id":1563693,"node_id":"MDQ6VXNlcjE1NjM2OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":114205748,"digest":"sha256:b24e9ce22c4c5a6c317a5a416132f29eea43dfd5391d5e7b90ddc12e267bcd1c","download_count":127,"created_at":"2025-11-17T09:35:33Z","updated_at":"2025-11-17T09:35:36Z"},{"id":317382287,"node_id":"RA_kwDOACwUcs4S6t6P","name":"scala-docs-2.13.18.txz","label":"","uploader":{"login":"scala-jenkins","id":1563693,"node_id":"MDQ6VXNlcjE1NjM2OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":59076256,"digest":"sha256:c6820cfdaeb45386bd4d26f9cca899d907c2795ab5d32a5f5b40a714f415c4f5","download_count":222,"created_at":"2025-11-17T09:35:37Z","updated_at":"2025-11-17T09:35:39Z"},{"id":317382251,"node_id":"RA_kwDOACwUcs4S6t5r","name":"scala-docs-2.13.18.zip","label":"","uploader":{"login":"scala-jenkins","id":1563693,"node_id":"MDQ6VXNlcjE1NjM2OTM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":117840818,"digest":"sha256:fd10589f5db5bd1be01693534b80c9f70e401ffe5356b13804c60ad99426b469","download_count":608,"created_at":"2025-11-17T09:35:31Z","updated_at":"2025-11-17T09:35:33Z"}],"body":"The Scala team at Akka is pleased to announce Scala 2.13.18.\r\n\r\nThis release fixes several regressions from 2.13.17. It is compatible with JDKs 8 to 26.\r\n\r\nThe following are highlights of this release:\r\n\r\n### Restore traditional behavior when passing a `null` array to a varargs method in Scala 3\r\n\r\nWhen passing an array as \"sequence argument\" to a varargs method, `method(arg: _*)`, the array is converted to a `Seq`.\r\n\r\nIn Scala 3 (the syntax is `method(arg*)`), this conversion is done by the `ScalaRunTime.wrapXArray` methods.\r\nThese methods were simplified in 2.13.17, which changed the semantics of a `method((null: Array[T])*)` invocation.\r\n\r\n[#11165](https://github.com/scala/scala/pull/11165) restores the previous `null` handling semantics.\r\n\r\n### Fixes for false positive warnings\r\n\r\n* [#11162](https://github.com/scala/scala/pull/11162) reverts `-Xlint:infer-any` to the behavior of 2.13.16.\r\n  The lint was extended in 2.13.17 to warn whenever `Nothing` is inferred for a higher-kinded type parameter `T[_]`.\r\n  The new warning showed up in many projects: often as a false positive, but even the \"true\" positive warning was considered unhelpful / spurious in real-world use cases.\r\n* Fix false positive unused warning for private val used in annotation [#11149](https://github.com/scala/scala/pull/11149)\r\n* Fix false positive `-Xlint:universal-methods` warning in synthetic code [#11159](https://github.com/scala/scala/pull/11159)\r\n\r\n### JDK 26 support\r\n\r\n* Compiling on Java 26 is now supported [#11179](https://github.com/scala/scala/pull/11179)\r\n\r\n### New `@uncheckedOverride` annotation\r\n\r\nThe new `@uncheckedOverride` annotation is equivalent to the `override` keyword, except that it allows to override nothing. This is useful when cross-building: a method may override or not, depending on the version of some dependency. [#11179](https://github.com/scala/scala/pull/11179)\r\n\r\n### GPG key change\r\n\r\nThis release is signed with a different GPG key than previous Scala 2 releases. The new key is the [same one used by Scala 3](https://keyserver.ubuntu.com/pks/lookup?search=0x2A5E8B338438CAC7033F9D8FB8A045C0A6EC398E&fingerprint=on&op=index) (`2A5E 8B33 8438 CAC7 033F 9D8F B8A0 45C0 A6EC 398E`). [#11158](https://github.com/scala/scala/pull/11158)\r\n\r\n### Other notable changes\r\n\r\n* On Java 25+, `sbt run` now detects main methods that are non-static, non-public or without parameter list [#11137](https://github.com/scala/scala/pull/11137)\r\n* Regression fix: 2.13.17 was accidentally dropping certain annotations [#11173](https://github.com/scala/scala/pull/11173)\r\n* Deprecate the `-Xmain-class` compiler flag [#11156](https://github.com/scala/scala/pull/11156)\r\n\r\n### More changes\r\n\r\nFor the complete 2.13.18 change lists, see [all merged PRs](https://github.com/scala/scala/pulls?q=is%3Amerged+-label%3Ainternal+milestone%3A2.13.18) and [all closed bugs](https://github.com/scala/bug/issues?utf8=%E2%9C%93&q=is%3Aclosed+milestone%3A2.13.18).\r\n\r\n## Compatibility\r\n\r\nAs usual for our minor releases, Scala 2.13.18 is [binary-compatible](https://docs.scala-lang.org/overviews/core/binary-compatibility-of-scala-releases.html) with the whole Scala 2.13 series.\r\n\r\nUpgrading from 2.12? Enable `-Xmigration` while upgrading to request migration advice from the compiler.\r\n\r\n## Contributors\r\n\r\nA big thank you to everyone who's helped improve Scala by reporting bugs, improving our documentation, spreading kindness in discussions around Scala, and submitting and reviewing pull requests! You are all magnificent.\r\n\r\nThis release was brought to you by 8 contributors, according to `git shortlog -sn --no-merges @ ^v2.13.17 ^2.12.x`. Thank you Lukas Rytz, A. P. Marki, Scala Steward, Seth Tisue, NthPortal, Evgeny Vereshchagin, Kenji Yoshida, Philippus Baalman.\r\n\r\nThanks to [Akka](https://akka.io) for their continued sponsorship of the Scala 2 team’s efforts. Akka offers commercial support for Scala.\r\n\r\n## Scala 2.13 notes\r\n\r\nThe [release notes for Scala 2.13.0](https://github.com/scala/scala/releases/v2.13.0) have important information applicable to the whole 2.13 series.\r\n\r\n## Obtaining Scala\r\n\r\nScala releases are available through a variety of channels, including (but not limited to):\r\n\r\n* Bump the `using scala` setting in your Scala-CLI project\r\n* Bump the `scalaVersion` setting in your sbt or Mill project\r\n* Download a distribution from [scala-lang.org](https://scala-lang.org/download/2.13.18.html)\r\n* Obtain JARs via [Maven Central](https://search.maven.org/search?q=g:org.scala-lang%20AND%20v:2.13.18)\r\n","reactions":{"total_count":10,"+1":6,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":1,"eyes":0}}
