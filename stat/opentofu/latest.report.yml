026-09-30T13:43:08Z","updated_at":"2026-09-30T13:43:08Z"},{"id":601022882,"node_id":"RA_kwDOKH8k2s4j0uGi","name":"tofu_1.13.0_windows_arm64.zip.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:41f1b391aa81e90273471583a8fc58f3f6d39b0f060f310538d25755a02eb85f","download_count":3,"created_at":"2026-09-30T13:43:08Z","updated_at":"2026-09-30T13:43:08Z"}],"body":"# OpenTofu 1.13.0\r\n\r\nWe're proud to announce that OpenTofu 1.13.0 is now officially available! \ud83c\udf89\r\n\r\n## Highlights\r\n\r\n### Windows on ARM64 is now a supported platform\r\n\r\nStarting with OpenTofu v1.13.0 we are now offering official packages targeting Windows on the ARM64 (also known as \"aarch64\") CPU architecture.\r\n\r\n### Reducing unknowns during planning\r\n\r\nOpenTofu v1.13 introduces a number of new functions that are all intended to allow module authors to give OpenTofu additional hints about what they know to be true even though OpenTofu cannot infer it automatically.\r\n\r\n### Linting Experiment\r\n\r\nOpenTofu v1.13 includes some very early work towards built-in \"linting\" features in OpenTofu, although we are hoping to eventually incorporate other similar needs such as policy enforcement into a single comprehensive feature.\r\n\r\n### Symbol Libraries Experiment\r\n\r\nWe're considering a new kind of artifact called a \"Symbol Library\", which is a reusable collection of values, functions, and type aliases that can be imported from all of the same source types that are already supported for modules.\r\n\r\n## Compatibility Notes\r\n\r\n- `base64gzip` produces results that are equivalent but _not_ byte-for-byte identical to previous versions, this is due to a required golang version upgrade\r\n- WinRM is no longer supported for provisioners\r\n- macOS: Requires macOS 13 Ventura or later\r\n- OpenTofu v1.13 will be the last series that includes official releases for 32 bit CPUs\r\n\r\n## Reference\r\n\r\n- [Full Changelog](https://github.com/opentofu/opentofu/blob/v1.13/CHANGELOG.md)\r\n- [Blog Post](https://opentofu.org/blog/opentofu-1-13-0)\r\n\r\nThank you for your continued support and testing of the OpenTofu project!","reactions":{"total_count":8,"+1":1,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":1,"rocket":1,"eyes":0}}
