created_at":"2026-10-09T15:43:22Z","updated_at":"2026-10-09T15:43:22Z"},{"id":625399154,"node_id":"RA_kwDOAPphoM4lRtVy","name":"nvim-macos-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":9844257,"digest":"sha256:481424f1dbc85f637d57e47d27d042aa9c883e5a4fe9ee64fc4ee9573b221998","download_count":4560,"created_at":"2026-10-09T15:43:22Z","updated_at":"2026-10-09T15:43:22Z"},{"id":625399238,"node_id":"RA_kwDOAPphoM4lRtXG","name":"nvim-win-arm64.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":13017148,"digest":"sha256:02cd0d617da680f76b503b5b636d36c75c38a3fbd05147ab0d2810f2dec13840","download_count":2525,"created_at":"2026-10-09T15:43:23Z","updated_at":"2026-10-09T15:43:24Z"},{"id":625399250,"node_id":"RA_kwDOAPphoM4lRtXS","name":"nvim-win-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":13188877,"digest":"sha256:2e58d259ffcc6145e5112ea02330126c6b57da09087bb9265fb2fa9aa10b485c","download_count":863,"created_at":"2026-10-09T15:43:23Z","updated_at":"2026-10-09T15:43:24Z"},{"id":625399224,"node_id":"RA_kwDOAPphoM4lRtW4","name":"nvim-win64.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":12460092,"digest":"sha256:72ec7df85655528952e086858ca6b3add8498f60977108ba8e7f3ede34a7cca5","download_count":49309,"created_at":"2026-10-09T15:43:23Z","updated_at":"2026-10-09T15:43:24Z"},{"id":625399221,"node_id":"RA_kwDOAPphoM4lRtW1","name":"nvim-win64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12624741,"digest":"sha256:4e12b7103b601ffc8f25954b4da100f339faa73dccb69a5b135e897fa3d893ed","download_count":24863,"created_at":"2026-10-09T15:43:23Z","updated_at":"2026-10-09T15:43:24Z"}],"body":"```\r\nNVIM v0.12.6\r\nBuild type: Release\r\nLuaJIT 2.1.1774638290\r\n```\r\n\r\n## Release notes\r\n\r\n- [Changelog](https://github.com/neovim/neovim/commit/779c36969e31080503be2dfccbcc3f999e289606) (fixes + features)\r\n- [News](./runtime/doc/news.txt) (`:help news` in Nvim)\r\n\r\n## Install\r\n\r\n### Windows\r\n\r\n#### Zip\r\n\r\n1. Download **nvim-win64.zip** (or **nvim-win-arm64.zip** for ARM)\r\n2. Extract the zip\r\n3. Run `nvim.exe` in your terminal\r\n\r\n#### MSI\r\n\r\n1. Download **nvim-win64.msi** (or **nvim-win-arm64.msi** for ARM)\r\n2. Run the MSI\r\n3. Run `nvim.exe` in your terminal\r\n\r\nNote: On Windows \"Server\" you may need to [install `vcruntime*.dll`](https://neovim.io/doc/install/#windows).\r\n\r\n### macOS (x86_64)\r\n\r\n1. Download **nvim-macos-x86_64.tar.gz**\r\n2. Run `xattr -c ./nvim-macos-x86_64.tar.gz` (to avoid \"unknown developer\" warning)\r\n3. Extract: `tar xzvf nvim-macos-x86_64.tar.gz`\r\n4. Run `./nvim-macos-x86_64/bin/nvim`\r\n\r\n### macOS (arm64)\r\n\r\n1. Download **nvim-macos-arm64.tar.gz**\r\n2. Run `xattr -c ./nvim-macos-arm64.tar.gz` (to avoid \"unknown developer\" warning)\r\n3. Extract: `tar xzvf nvim-macos-arm64.tar.gz`\r\n4. Run `./nvim-macos-arm64/bin/nvim`\r\n\r\n### Linux (x86_64)\r\n\r\nIf your system does not have the required glibc version, try the (unsupported) [builds for older glibc](https://github.com/neovim/neovim-releases).\r\n\r\n#### AppImage\r\n\r\n1. Download **nvim-linux-x86_64.appimage**\r\n2. Run `chmod u+x nvim-linux-x86_64.appimage && ./nvim-linux-x86_64.appimage`\r\n   - If your system does not have FUSE you can [extract the appimage](https://github.com/AppImage/AppImageKit/wiki/FUSE#type-2-appimage):\r\n     ```bash\r\n     ./nvim-linux-x86_64.appimage --appimage-extract\r\n     ./squashfs-root/usr/bin/nvim\r\n     ```\r\n\r\n#### Tarball\r\n\r\n1. Download **nvim-linux-x86_64.tar.gz**\r\n2. Extract: `tar xzvf nvim-linux-x86_64.tar.gz`\r\n3. Run `./nvim-linux-x86_64/bin/nvim`\r\n\r\n### Linux (arm64)\r\n\r\n#### AppImage\r\n\r\n1. Download **nvim-linux-arm64.appimage**\r\n2. Run `chmod u+x nvim-linux-arm64.appimage && ./nvim-linux-arm64.appimage`\r\n   - If your system does not have FUSE you can [extract the appimage](https://github.com/AppImage/AppImageKit/wiki/FUSE#type-2-appimage):\r\n     ```bash\r\n     ./nvim-linux-arm64.appimage --appimage-extract\r\n     ./squashfs-root/usr/bin/nvim\r\n     ```\r\n\r\n#### Tarball\r\n\r\n1. Download **nvim-linux-arm64.tar.gz**\r\n2. Extract: `tar xzvf nvim-linux-arm64.tar.gz`\r\n3. Run `./nvim-linux-arm64/bin/nvim`\r\n\r\n### Other\r\n\r\n- Install by [package manager](https://github.com/neovim/neovim/blob/master/INSTALL.md#install-from-package)\r\n","reactions":{"total_count":64,"+1":27,"-1":0,"laugh":0,"hooray":21,"confused":0,"heart":4,"rocket":11,"eyes":1}}
