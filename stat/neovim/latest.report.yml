eated_at":"2026-08-23T18:27:11Z","updated_at":"2026-08-23T18:27:12Z"},{"id":526503740,"node_id":"RA_kwDOAPphoM4fYc88","name":"nvim-macos-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":9843608,"digest":"sha256:81f4518622cb059b450ee2e498c6a1082a222f6bd89589de5bbcf0c6a68aa3fd","download_count":2661,"created_at":"2026-08-23T18:27:11Z","updated_at":"2026-08-23T18:27:12Z"},{"id":526503771,"node_id":"RA_kwDOAPphoM4fYc9b","name":"nvim-win-arm64.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":12832828,"digest":"sha256:2dbd0c41b7462f6c48fe750cea456ad500b534bfe9af9e95295ab715ce6ec417","download_count":1568,"created_at":"2026-08-23T18:27:12Z","updated_at":"2026-08-23T18:27:13Z"},{"id":526503772,"node_id":"RA_kwDOAPphoM4fYc9c","name":"nvim-win-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":13004160,"digest":"sha256:f5a2f7ee4603e0185ed5c3e6dc9db762499426baf1c6613a487da5b5e126ae55","download_count":790,"created_at":"2026-08-23T18:27:12Z","updated_at":"2026-08-23T18:27:13Z"},{"id":526503769,"node_id":"RA_kwDOAPphoM4fYc9Z","name":"nvim-win64.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":12460092,"digest":"sha256:bcc9fedb87e696e76fae7494d9c2e184026f8ff0c6d0bf830acdb2277b5bad3f","download_count":34802,"created_at":"2026-08-23T18:27:12Z","updated_at":"2026-08-23T18:27:13Z"},{"id":526503770,"node_id":"RA_kwDOAPphoM4fYc9a","name":"nvim-win64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12623588,"digest":"sha256:de8625ba8cf65ebf40eb80a388ba1ec8e9c15b30218821e2c639119b05920de1","download_count":16843,"created_at":"2026-08-23T18:27:12Z","updated_at":"2026-08-23T18:27:13Z"}],"body":"```\r\nNVIM v0.12.5\r\nBuild type: Release\r\nLuaJIT 2.1.1774638290\r\n```\r\n\r\n## Release notes\r\n\r\n- [Changelog](https://github.com/neovim/neovim/commit/5885a30e1e1225349079e7a1c4a3848aa8e43e42) (fixes + features)\r\n- [News](./runtime/doc/news.txt) (`:help news` in Nvim)\r\n\r\n## Install\r\n\r\n### Windows\r\n\r\n#### Zip\r\n\r\n1. Download **nvim-win64.zip** (or **nvim-win-arm64.zip** for ARM)\r\n2. Extract the zip\r\n3. Run `nvim.exe` in your terminal\r\n\r\n#### MSI\r\n\r\n1. Download **nvim-win64.msi** (or **nvim-win-arm64.msi** for ARM)\r\n2. Run the MSI\r\n3. Run `nvim.exe` in your terminal\r\n\r\nNote: On Windows \"Server\" you may need to [install `vcruntime*.dll`](https://neovim.io/doc/install/#windows).\r\n\r\n### macOS (x86_64)\r\n\r\n1. Download **nvim-macos-x86_64.tar.gz**\r\n2. Run `xattr -c ./nvim-macos-x86_64.tar.gz` (to avoid \"unknown developer\" warning)\r\n3. Extract: `tar xzvf nvim-macos-x86_64.tar.gz`\r\n4. Run `./nvim-macos-x86_64/bin/nvim`\r\n\r\n### macOS (arm64)\r\n\r\n1. Download **nvim-macos-arm64.tar.gz**\r\n2. Run `xattr -c ./nvim-macos-arm64.tar.gz` (to avoid \"unknown developer\" warning)\r\n3. Extract: `tar xzvf nvim-macos-arm64.tar.gz`\r\n4. Run `./nvim-macos-arm64/bin/nvim`\r\n\r\n### Linux (x86_64)\r\n\r\nIf your system does not have the required glibc version, try the (unsupported) [builds for older glibc](https://github.com/neovim/neovim-releases).\r\n\r\n#### AppImage\r\n\r\n1. Download **nvim-linux-x86_64.appimage**\r\n2. Run `chmod u+x nvim-linux-x86_64.appimage && ./nvim-linux-x86_64.appimage`\r\n   - If your system does not have FUSE you can [extract the appimage](https://github.com/AppImage/AppImageKit/wiki/FUSE#type-2-appimage):\r\n     ```bash\r\n     ./nvim-linux-x86_64.appimage --appimage-extract\r\n     ./squashfs-root/usr/bin/nvim\r\n     ```\r\n\r\n#### Tarball\r\n\r\n1. Download **nvim-linux-x86_64.tar.gz**\r\n2. Extract: `tar xzvf nvim-linux-x86_64.tar.gz`\r\n3. Run `./nvim-linux-x86_64/bin/nvim`\r\n\r\n### Linux (arm64)\r\n\r\n#### AppImage\r\n\r\n1. Download **nvim-linux-arm64.appimage**\r\n2. Run `chmod u+x nvim-linux-arm64.appimage && ./nvim-linux-arm64.appimage`\r\n   - If your system does not have FUSE you can [extract the appimage](https://github.com/AppImage/AppImageKit/wiki/FUSE#type-2-appimage):\r\n     ```bash\r\n     ./nvim-linux-arm64.appimage --appimage-extract\r\n     ./squashfs-root/usr/bin/nvim\r\n     ```\r\n\r\n#### Tarball\r\n\r\n1. Download **nvim-linux-arm64.tar.gz**\r\n2. Extract: `tar xzvf nvim-linux-arm64.tar.gz`\r\n3. Run `./nvim-linux-arm64/bin/nvim`\r\n\r\n### Other\r\n\r\n- Install by [package manager](https://github.com/neovim/neovim/blob/master/INSTALL.md#install-from-package)\r\n","reactions":{"total_count":69,"+1":21,"-1":0,"laugh":0,"hooray":31,"confused":0,"heart":9,"rocket":8,"eyes":0}}
