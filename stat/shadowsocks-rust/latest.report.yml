399a6520a9d53ea1be4b6965394b16c07fb2f7533735a12acdf78c99713","download_count":230,"created_at":"2026-08-26T23:17:57Z","updated_at":"2026-08-26T23:17:58Z"},{"id":531449939,"node_id":"RA_kwDOAYFMYc4frUhT","name":"shadowsocks-v1.25.0.x86_64-unknown-linux-musl.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":13943548,"digest":"sha256:8439bf43c324b0fc273e663d0b1f8926fd8f666cbd1e0fd59b35096f0e778e92","download_count":1721,"created_at":"2026-08-26T22:57:36Z","updated_at":"2026-08-26T22:57:37Z"},{"id":531449938,"node_id":"RA_kwDOAYFMYc4frUhS","name":"shadowsocks-v1.25.0.x86_64-unknown-linux-musl.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":119,"digest":"sha256:d278c2e4fddbd770201db7f320f51245befec43cfffe2846e3d942fd76e74a2f","download_count":323,"created_at":"2026-08-26T22:57:36Z","updated_at":"2026-08-26T22:57:37Z"},{"id":531450398,"node_id":"RA_kwDOAYFMYc4frUoe","name":"shadowsocks-v1.25.0.x86_64-unknown-netbsd.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":13291228,"digest":"sha256:e75b97505c0256268edda3054f4df33acb1dc132b9fa3ec17749993230c844a7","download_count":16,"created_at":"2026-08-26T22:58:17Z","updated_at":"2026-08-26T22:58:17Z"},{"id":531450397,"node_id":"RA_kwDOAYFMYc4frUod","name":"shadowsocks-v1.25.0.x86_64-unknown-netbsd.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":115,"digest":"sha256:40cfa96d6ae34f2becf39551ad0cf0aa7e30cb2b3d005258b2234a7f3065830c","download_count":12,"created_at":"2026-08-26T22:58:17Z","updated_at":"2026-08-26T22:58:17Z"}],"body":"## Breaking Changes\r\n\r\n- MSRV bumps to v1.91, required by `smoltcp` v0.13\r\n- `refactor(service)!: rework outbound proxy chain into a unified client`. The outbound proxy architecture has been completely reworked into a single self-contained module `net::outbound`, exposing `OutboundProxyClient`, `OutboundProxyStream`, `Socks5Auth`, `HttpProxyAuth` and a `TcpDialer` trait.\r\n  - `crate::net::outbound_proxy` \u2014 removed; use `crate::net::OutboundProxyClient`\r\n  - `crate::net::http_connect::HttpConnectClient` \u2014 moved to `crate::net::HttpConnectClient` (only available with the `local-http` feature)\r\n  - `crate::net::Socks5TcpClient` (the chain-mixing wrapper) \u2014 split: the pure SOCKS5 client is now `crate::local::socks::client::socks5::Socks5TcpClient`; the in-band negotiator is `crate::net::Socks5Negotiator`\r\n  - `crate::local::net::tcp::outbound_proxy` \u2014 removed\r\n  - `ServiceContext::outbound_proxies()` \u2014 replaced by `outbound_client()` returning `Option<&Arc<OutboundProxyClient>>`\r\n- `create_inbound_udp_socket` public function signature changed, added `allow_fragmentation` parameter\r\n- `inbound_udp_allow_fragmentation` new configuration option split from `outbound_udp_allow_fragmentation`, which now only controls outbound sockets. The inbound (listener) UDP sockets default to disabling IP fragmentation (`false`).\r\n\r\n## Features\r\n\r\n- #2106 Allow chaining `ssserver` to another SOCKS5/HTTP/HTTPS proxy\r\n- #2109 Expose `user_key()` on `CryptoStream` and `ProxyServerStream`, lets callers identify which multi-user identity was authenticated after an AEAD-2022 handshake\r\n- EIH (Extended Identity Header) support\r\n- #1994 `local-http`: Support HTTP Basic auth\r\n- `service`: Outbound UDP relay through SOCKS5-only chains. UDP traffic can now be relayed through proxy chains when all hops are SOCKS5. Chains containing HTTP/HTTPS hops will emit a startup warning and UDP traffic will bypass the chain.\r\n- Optimized `socket2::Socket` with `socket2::SockRef`\r\n\r\n## Bug Fixes\r\n\r\n- Allow fragmentation for inbound UDP replies\r\n- RUSTSEC-2026-0258, RUSTSEC-2026-0204, RUSTSEC-2026-0185, RUSTSEC-2026-0119, RUSTSEC-2026-0104, RUSTSEC-2026-0099\r\n- `net`: Make UDP batch configs match the BSD module routing for tvOS/watchOS\r\n- #2100 Native build error on arm64\r\n- `shadowsocks-service`: Fixed build without `local-http` feature\r\n- #2062 `http`: Add `is_ready` method and enhance connection checks\r\n- #2097 Unify alpine base version in Docker images\r\n- #2093 `PingBalancer`: Remove unnecessary double checks\r\n- `netbsd`: Cross-compilation fixes with `getentropy` shim and passthrough `RUSTFLAGS` syntax\r\n\r\n## Miscellaneous\r\n\r\n- `shadowsocks-crypto` upgraded to v0.8.0\r\n- `smoltcp` upgraded to v0.14\r\n- Upgraded various dependencies\r\n\r\n## What's Changed\r\n* chore(deps): update actions/upload-artifact action to v6 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2056\r\n* fix(deps): update rust crate reqwest to 0.13 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2058\r\n* chore: clippy fix by @AaronChen0 in https://github.com/shadowsocks/shadowsocks-rust/pull/2059\r\n* fix(http): add is_ready method and enhance connection checks by @arloor in https://github.com/shadowsocks/shadowsocks-rust/pull/2062\r\n* fix(deps): update rust crate nix to 0.31 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2066\r\n* chore(deps): update rust crate time to v0.3.46 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2067\r\n* chore(deps): update rust crate clap to v4.5.57 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2071\r\n* chore(deps): update rust crate regex to v1.12.3 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2072\r\n* chore: fix a warning by @AaronChen0 in https://github.com/shadowsocks/shadowsocks-rust/pull/2076\r\n* chore: fix typos by @AaronChen0 in https://github.com/shadowsocks/shadowsocks-rust/pull/2075\r\n* fix(deps): update rust crate rand to 0.10 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2074\r\n* chore(deps): update actions/upload-artifact action to v7 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2079\r\n* chore(deps): bump quinn-proto from 0.11.13 to 0.11.14 in the cargo group across 1 directory by @dependabot[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2080\r\n* chore(deps): update rust crate libc to v0.2.183 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2085\r\n* chore(deps): update rust crate socket2 to v0.6.3 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2086\r\n* chore(deps): update rust crate tracing-subscriber to v0.3.23 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2087\r\n* chore(deps): update rust crate tun to v0.8.6 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2088\r\n* chore(deps): update rust crate clap to v4.6.0 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2089\r\n* chore(deps): update rust crate ipnet to v2.12.0 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2090\r\n* chore(deps): update rust crate tokio to v1.50.0 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2091\r\n* chore(deps): update rust docker tag to v1.94.0 by @renovate[bot] in https://github.com/shadowsocks/shadowsocks-rust/pull/2092\r\n* chore(deps): update docker/build-push-action action to v7 by @renovate[bot] in https://github.com/s