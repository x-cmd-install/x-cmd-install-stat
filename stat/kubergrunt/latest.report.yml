{"id":434666588,"author":{"login":"ryehowell","id":86266251,"node_id":"MDQ6VXNlcjg2MjY2MjUx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCdzBcc4Z6Hxc","tag_name":"v0.19.1","target_commitish":"main","name":"v0.19.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T22:43:05Z","updated_at":"2026-11-05T01:39:26Z","published_at":"2026-11-05T01:39:26Z","assets":[],"body":"## Description\r\n\r\nThis is the final release of `kubergrunt`. There are no new features or commands. After this release, the repository will be archived and Gruntwork will no longer ship new features, bug fixes, or security patches.\r\n\r\nThis release adds the archival notice to the README and bundles the pending dependency updates that landed on `main` since `v0.19.0`.\r\n\r\n**What this means:**\r\n- Existing releases and binaries remain available on this Releases page.\r\n- The source remains available to browse and fork under the existing license.\r\n- Issues and pull requests will no longer be reviewed or accepted.\r\n\r\nThe EKS gaps this tool originally filled (kubectl auth, AMI rollouts, core add-on syncing, leftover security group/ENI cleanup, OIDC thumbprints) are now covered by native tooling such as `aws eks update-kubeconfig` / `aws eks get-token`, EKS Managed Node Groups, EKS Add-ons, `eksctl`, and the AWS Terraform provider. Recent releases of `terraform-aws-eks` and `terraform-aws-service-catalog` no longer depend on `kubergrunt`.\r\n\r\nThank you to everyone who used it, filed issues, contributed PRs, or trusted it to keep clusters running.\r\n\r\n### Dependency updates\r\n- Bump [github.com/hashicorp/go-getter](https://github.com/hashicorp/go-getter) from 1.7.9 to 1.8.6.\r\n- Bump [github.com/moby/spdystream](https://github.com/moby/spdystream) from 0.2.0 to 0.5.1.\r\n- Bump [golang.org/x/net](https://github.com/golang/net) from 0.52.0 to 0.55.0.\r\n- Bump [golang.org/x/crypto](https://github.com/golang/crypto) from 0.51.0 to 0.52.0.\r\n- Bump [google.golang.org/grpc](https://github.com/grpc/grpc-go) from 1.79.3 to 1.83.1.\r\n\r\n## Related Links\r\n- https://github.com/gruntwork-io/kubergrunt/pull/270\r\n- https://github.com/gruntwork-io/kubergrunt/pull/268\r\n- https://github.com/gruntwork-io/kubergrunt/pull/269\r\n- https://github.com/gruntwork-io/kubergrunt/pull/275\r\n- https://github.com/gruntwork-io/kubergrunt/pull/276\r\n- https://github.com/gruntwork-io/kubergrunt/pull/277\r\n- https://github.com/gruntwork-io/kubergrunt/pull/279"}
