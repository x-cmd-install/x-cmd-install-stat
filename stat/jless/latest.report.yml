{"id":112432869,"author":{"login":"PaulJuliusMartinez","id":3301004,"node_id":"MDQ6VXNlcjMzMDEwMDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOFYWjXs4Gs5bl","tag_name":"v0.9.0","target_commitish":"main","name":"v0.9.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2023-07-17T02:12:03Z","updated_at":"2023-07-17T03:08:42Z","published_at":"2023-07-17T02:51:34Z","assets":[{"id":117306820,"node_id":"RA_kwDOFYWjXs4G_fXE","name":"jless-v0.9.0-aarch64-apple-darwin.zip","label":null,"uploader":{"login":"PaulJuliusMartinez","id":3301004,"node_id":"MDQ6VXNlcjMzMDEwMDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1141884,"digest":null,"download_count":4763,"created_at":"2023-07-17T02:38:53Z","updated_at":"2023-07-17T02:38:54Z"},{"id":117306823,"node_id":"RA_kwDOFYWjXs4G_fXH","name":"jless-v0.9.0-x86_64-apple-darwin.zip","label":null,"uploader":{"login":"PaulJuliusMartinez","id":3301004,"node_id":"MDQ6VXNlcjMzMDEwMDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1002244,"digest":null,"download_count":4865,"created_at":"2023-07-17T02:38:55Z","updated_at":"2023-07-17T02:38:56Z"},{"id":117306822,"node_id":"RA_kwDOFYWjXs4G_fXG","name":"jless-v0.9.0-x86_64-unknown-linux-gnu.zip","label":null,"uploader":{"login":"PaulJuliusMartinez","id":3301004,"node_id":"MDQ6VXNlcjMzMDEwMDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1136617,"digest":null,"download_count":99395,"created_at":"2023-07-17T02:38:54Z","updated_at":"2023-07-17T02:38:55Z"}],"body":"The newest version of jless ships with a handful of new helpful features:\r\n- A `ys` command to copy unescaped string literals to the clipboard\r\n- A family of printing `p` commands, analogous to the `y` commands, that print simply content to the screen. Useful for viewing long string values, or if the clipboard functionality isn't working\r\n- Line numbers! Both absolute and relative\r\n- `C` and `E` commands, analogous to the existing `c` and `e` commands, for deeply collapsing/expanding values\r\n\r\n### Full list of changes\r\n\r\n#### New features\r\n- A new command `ys` will copy unescaped string literals to the clipboard. Control characters remain escaped.\r\n- The length of Arrays and size of Objects is now shown before the container previews, e.g., (`foo: (3) [\"apple\", \"banana\", \"cherry\"]`)\r\n- Add a new family of \"print\" commands, that nearly map to the existing copy commands, that will simply print a value to the screen. This is useful for viewing the entirety of long string values all at once, or if the clipboard functionality is not working; mouse-tracking will be temporarily disabled, allowing you to use your terminal's native clipboard capabilities to select and copy the desired text.\r\n- Support showing line numbers, both absolute and/or relative. Absolute line numbers refer to what line number a given node would appear on if the document were pretty printed. This means there are discontinuities when in data mode because closing brackets and braces aren't displayed. Relative line numbers show how far a line is relative to the currently focused line. The behavior of the various combinations of these settings matches vim: when using just relative line numbers alone, the focused line will show `0`, but when both flags are enabled the focused line will show its absolute line number.\r\n  - Absolute line numbers are enabled by default, but not relative line numbers. These can be enabled/disabled/re-enabled via command line flags `--line-numbers`, `--no-line-numbers`, `--relative-line-numbers` and `--no-relative-line-numbers`, or via the short flags `-n`, `-N`, `-r`, and `-R` respectively.\r\n  - These settings can also be modified while jless is running. Entering `:set number`/`:set relativenumber` will enable these settings, `:set nonumber`/`:set norelativenumber` will disable them, and `:set number!`/`:set relativenumber!` will toggle them, matching vim's behavior.\r\n  - There is not yet support for a jless config file, so if you would like relative line numbers by default, it is recommended to set up an alias: `alias jless=jless --line-numbers --relative-line-numbers`.\r\n- You can jump to an exact line number using `<count>g` or `<count>G`. When using `<count>g` (lowercase 'g'), if the desired line number is hidden inside of a collapsed container, the last visible line number before the desired one will be focused. When using `<count>G` (uppercase 'G'), all the ancestors of the desired line will be expanded to ensure it is visible.\r\n- Add `C` and `E` commands, analogous to the existing `c` and `e` commands, to deeply collapse/expand a node and all its siblings.\r\n\r\n#### Improvements\r\n- In data mode, when a array element is focused, the highlighting on the index label (e.g., \"[8]\") is now inverted. Additionally, a '\u25b6' is always displayed next to the currently focused line, even if the focused node is a primitive. Together these changes should make it more clear which line is focused, especially when the terminal's current style doesn't support dimming (`ESC [ 2 m`).\r\n- When using the `c` and `e` commands (and the new `C` and `E` commands), the focused row will stay at the same spot on the screen. (Previously jless would try to keep the same row visible at the top of the screen, which didn't make sense.)\r\n\r\n#### Bug fixes\r\n- Scrolling with the mouse will now move the viewing window, rather than the cursor.\r\n- When searching, jless will do a better job jumping to the first match after the cursor; previously if a user started a search while focused on the opening of a Object or Array, any matches inside that container were initially skipped over.\r\n- When jumping to a search match that is inside a collapsed container, search matches will continue to be highlighted after expanding the container.\r\n- [Issue #71](https://github.com/PaulJuliusMartinez/jless/issues/71)/[PR #98](https://github.com/PaulJuliusMartinez/jless/pull/98): jless will return a non-zero exit code if it fails to parse the input.\r\n\r\n#### Other notes\r\n- The minimum supported Rust version has been updated to 1.67.\r\n- jless now re-renders the screen by emitting \"clear line\" escape codes (`ESC [ 2 K`) for each line, instead of a single \"clear screen\" escape code (`ESC [ 2 J`), in the hopes of reducing flicking when scrolling.\r\n","reactions":{"total_count":24,"+1":7,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":7,"rocket":5,"eyes":0}}
