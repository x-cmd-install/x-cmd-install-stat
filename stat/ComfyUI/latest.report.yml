onymous in https://github.com/Comfy-Org/ComfyUI/pull/15656\r\n* [Partner Nodes] feat(x-comfy-credits): remove custom price extractor logic by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15655\r\n* Allow regular single image Empty Latent Image node to be used with H3. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15677\r\n* [Partner Nodes] chore(Kling): remove kling-v2 image model by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15676\r\n* Forward node class attributes into schema for dataset nodes by @christian-byrne in https://github.com/Comfy-Org/ComfyUI/pull/15683\r\n* [Partner Nodes] feat(FishAudio): implement basic nodes by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15612\r\n* [Partner Nodes] feat(ByteDance): add 1080p resolution to Seedance 2.5 by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15684\r\n* Update workflow templates to v0.11.43 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/15690\r\n* Support per-token video and audio latent noise masks on MiniMax-H3 by @drozbay in https://github.com/Comfy-Org/ComfyUI/pull/15375\r\n* Add support for taeh3. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15695\r\n* feat(minimax): support prompt embeddings by @silveroxides in https://github.com/Comfy-Org/ComfyUI/pull/15697\r\n* Keep temp-directory assets visible while their files exist by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/15510\r\n* Prs/ace graphs by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/15698\r\n* Drop the duplicate first image from the Qwen-Image-Layered blueprint by @christian-byrne in https://github.com/Comfy-Org/ComfyUI/pull/15364\r\n* Add friendly errors to the dynamic vram safetensors loader. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15722\r\n* Fix missing asset preview URLs outside input and output by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/15509\r\n* [Partner Nodes] Add Gemini 3.7 Flash to the Gemini text node text node by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15688\r\n* Limit Windows multi-GPU visibility (CORE-391) by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/15737\r\n* [Partner Nodes] chore(Prune): rename Ideogram P-Image node by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15751\r\n* [Partner Nodes] feat(Bytedance): add new Seedream node with Fast Mode widget by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15750\r\n* [Partner Nodes] feat(BFL): add Flux Video Upscale node by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15753\r\n* Update workflow templates to v0.11.44 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/15754\r\n* ci: add Notify on Merge dispatch workflow by @luke-mino-altherr in https://github.com/Comfy-Org/ComfyUI/pull/15568\r\n* Support HDR video saving, AV1 codec, mkv and webm. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15741\r\n* Add HDR color space options to h264 codec in Save Video node. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15764\r\n* fix: fail CLA allowlist step on API errors by @alexisrolland in https://github.com/Comfy-Org/ComfyUI/pull/15792\r\n* feat: Support Pixal3d and TRELLIS2 (CORE-278) (CORE-199) (CORE-236) (CORE-312) by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/14718\r\n* Increase trellis2 memory factor a bit. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15796\r\n* [Partner Nodes] feat(ByteDance): add vCube Video Enhance node by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15755\r\n* Minimax-H3: Add missing special tokens by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/15808\r\n* Add colorspace option and change bit_depth to a combo on CreateVideo. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15810\r\n* Default Windows to the first CUDA device by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/15813\r\n* feat: Support Sam3d-body (CORE-35) by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/14370\r\n* Increase minimum pyav version. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15827\r\n* [Partner Nodes] feat(Wan): add Wan 3.0 video generation nodes by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15843\r\n* [Partner Nodes] feat(Meshy): add Meshy-7 support by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15807\r\n* Update workflow templates to v0.11.46 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/15864\r\n* Mark Compare Image node as not experimental anymore by @alexisrolland in https://github.com/Comfy-Org/ComfyUI/pull/15868\r\n* Fix default database path for custom user directory by @Constantine1916 in https://github.com/Comfy-Org/ComfyUI/pull/14539\r\n* Python 3.10 will be EOL soon, please upgrade. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/15874\r\n* [Partner Nodes] chore(Tripo): remove retired Refine node and v2.0 model version by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15851\r\n* comfy-aimdo 0.4.15 by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/15886\r\n* [Partner Nodes] feat(Pixverse): add Pixverse V6 model support by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/15880\r\n* Update workflow templates to v0.11.48 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/15888\r\n\r\n## New Contributors\r\n* @Constantine1916 made their first contribution in https://github.com/Comfy-Org/ComfyUI/pull/14539\r\n\r\n**Full Changelog**: https://github.com/Comfy-Org/ComfyUI/compare/v0.33.0...v0.34.0","reactions":{"total_count":58,"+1":43,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":10,"rocket":3,"eyes":2},"mentions_count":13}
