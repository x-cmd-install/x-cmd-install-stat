t":"2026-09-29T19:25:58Z"},{"id":599056866,"node_id":"RA_kwDOIygeJs4jtOHi","name":"ComfyUI_windows_portable_nvidia_cu126.7z","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-7z-compressed","state":"uploaded","size":1886111296,"digest":"sha256:bd3bd7e3ce0068d8bc58fe46c912c360dd510f9bcfd0c5029d4906e6e6fbc677","download_count":3008,"created_at":"2026-09-29T19:40:31Z","updated_at":"2026-09-29T19:42:14Z"}],"body":"## What's Changed\r\n* Improve qwen 2.1 KV cache location logic by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/16429\r\n* Compile Qwen Image 2.1 transformer blocks by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/16430\r\n* Allow model files to contain which attention should be used for each block. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16419\r\n* JsonExtractString can now handle JSON with prefix and/or suffix. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16439\r\n* Remove torchaudio dependency. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16457\r\n* Cuda graphs + memory compiler on ace step 1.5 autoregressive model. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16461\r\n* Blend H3 VAE tiles against composited neighbours by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16436\r\n* Fast disk detection to all model loaders. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16425\r\n* [Partner Nodes] feat(Tencent): add Hunyuan Image 3.5 text-to-image and edit nodes by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16462\r\n* Update workflow templates to v0.11.68 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16466\r\n* TextGenerate: Add system_prompt input and separate thinking output (CORE-460) by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16442\r\n* MiniMax-H3: Support Fun-Controlnet-Union 2.0 (CORE-462) by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16471\r\n* Fix MiniMax-H3 VAE rms_rope crash on offloaded qk_norm_scale by @chelsealong in https://github.com/Comfy-Org/ComfyUI/pull/16485\r\n* Port some optimizations to flux model family. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16488\r\n* [Partner Nodes] feat(Quiver): add Arrow 2 models with reasoning effort widget by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16478\r\n* [Partner Nodes] feat(Anthropic): add Claude Opus 5.5 to the Claude node by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16479\r\n* [Partner Nodes] feat(Recraft): add Recraft V4.1 Flash to the V4 text-to-image node by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16501\r\n* Update workflow templates to v0.11.69 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16503\r\n* Fix ImageUpscaleWithModel crashing on RGBA images by @chelsealong in https://github.com/Comfy-Org/ComfyUI/pull/16500\r\n* Take the SQLite write lock up front for asset scan and output-registration writes by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16480\r\n* Move file reads out of the remaining asset write transactions by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16486\r\n* feat: ming-image support by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16482\r\n* Fix saving/loading ming image model breaking detection. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16514\r\n* Lower memory usage and .comfy_attention support for lumina family models. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16515\r\n* [Partner Nodes] feat(OpenAI): add GPT-6 Sol and Luna models by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16520\r\n* [Partner Nodes] feat(ByteDance): add Seedream 5.0 Flash by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16522\r\n* fix(assets): harden the asset catalogue's failure paths by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16393\r\n* Add missing RDNA2 arches to list. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16537\r\n* feat(npu): support async weight offload streams by @Big2Wheel in https://github.com/Comfy-Org/ComfyUI/pull/16057\r\n* Small fix: skip unnecessary work. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16540\r\n* Fix Qwen VL image preprocessing crash on 4-channel (RGBA) input by @chelsealong in https://github.com/Comfy-Org/ComfyUI/pull/16548\r\n* [Partner Nodes] feat(ByteDance): add Seedance 2.5 Draft mode by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16529\r\n* Update workflow templates to v0.11.70 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16557\r\n* Add HDR LogC3 and ACEScct to Convert Color Space node. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16541\r\n* Fix HDR output issue with negative values in Convert Image Color Space. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16565\r\n* Update sheetsage2 abc creation from upstream yue code. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16569\r\n* perf(assets): replace pathlib prefix checks in the asset scan by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16543\r\n* Mention some ComfyUI optimization details in README. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16576\r\n* Support tiny VAE for Qwen-Image 2.1 by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16552\r\n* feat: Support ID-V2V Wan 2.1/VACE based model (CORE-426) by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/15139\r\n* Fix potential regression with previous PR. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16596\r\n* [Partner Nodes] chore(Sora): remove deprecated Sora nodes by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16609\r\n* Clamp Qwen Image 2.1 fp16 activations in place by @dcbert in https://github.com/Comfy-Org/ComfyUI/pull/16608\r\n* Add comfy_attention and AttentionTensorContainer to a few models. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16595\r\n* Speedup Yue2 AR by @rattus128 in https://github.com/Comfy-Org/ComfyUI/pull/16626\r\n* Searching \"kitchen\" now returns the attention node. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16632\r\n* Support Qwen-Image 2.1 union fun controlnet by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16519\r\n* Update comfy-kitchen package version to 0.2.36 by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16635\r\n* Optimize Seedvr2 by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16530\r\n* Support w6a8 quantization format by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16483\r\n* Fixes for last PR. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16637\r\n* fix(db): wait briefly for the database lock at startup by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16602\r\n* fix(assets): Start without the assets packages; --enable-assets reports what is missing and runs with assets disabled by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16580\r\n* perf(assets): keep the UI responsive during asset scans and rescan output by listing folders by @synap5e in https://github.com/Comfy-Org/ComfyUI/pull/16546\r\n* Speedup generation on qwen3.5/3.8 with long contexts. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16638\r\n* Avoid unnecessary write. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16639\r\n* Update codeowners. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16655\r\n\r\n## New Contributors\r\n* @Big2Wheel made their first contribution in https://github.com/Comfy-Org/ComfyUI/pull/16057\r\n* @dcbert made their first contribution in https://github.com/Comfy-Org/ComfyUI/pull/16608\r\n\r\n**Full Changelog**: https://github.com/Comfy-Org/ComfyUI/compare/v0.37.0...v0.38.0","r