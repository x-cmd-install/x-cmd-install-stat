r the pos embed precision of SheetSage2 to match upstream. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16395\r\n* [Partner Nodes] feat(client): send Idempotency-Key on partner-proxy calls and collect replays by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16220\r\n* Bump comfyui-frontend-package to 1.53.6 by @comfy-pr-bot in https://github.com/Comfy-Org/ComfyUI/pull/16386\r\n* Fix ace step VAE decode crashing on non bf16 GPUs. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16405\r\n* feat: Qwen-image 2.1 support (CORE-423) by @kijai in https://github.com/Comfy-Org/ComfyUI/pull/16400\r\n* Update embedded docs to v0.5.12 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16396\r\n* Lower wan peak vram when using comfy kitchen attention. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16418\r\n* Update workflow templates to v0.11.65 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16423\r\n* Add a way to disable fast disk for debugging. by @comfyanonymous in https://github.com/Comfy-Org/ComfyUI/pull/16424\r\n* Update workflow templates to v0.11.66 by @comfyui-wiki in https://github.com/Comfy-Org/ComfyUI/pull/16426\r\n* [Partner Nodes] feat(Meshy): add Meshy 7.1 support by @bigcat88 in https://github.com/Comfy-Org/ComfyUI/pull/16412\r\n* Fix MiniMax Music 3 producing noise with CUDA graphs enabled. by @RaynoldVanHeyningen in https://github.com/Comfy-Org/ComfyUI/pull/16428\r\n\r\n## New Contributors\r\n* @RaynoldVanHeyningen made their first contribution in https://github.com/Comfy-Org/ComfyUI/pull/16428\r\n\r\n**Full Changelog**: https://github.com/Comfy-Org/ComfyUI/compare/v0.36.0...v0.37.0","reactions":{"total_count":26,"+1":16,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":8,"rocket":0,"eyes":1},"mentions_count":8}
