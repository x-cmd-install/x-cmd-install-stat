5,"node_id":"RA_kwDOTAi-3M4bvenn","name":"macvision-darwin-x64.tar.xz.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":10327,"digest":"sha256:65aa124b502b6483b28195e08bd2d8d55d99bd5a0a8bb98af41fc0379f79d823","download_count":0,"created_at":"2026-07-03T13:18:03Z","updated_at":"2026-07-03T13:18:03Z"},{"id":465431715,"node_id":"RA_kwDOTAi-3M4bveyj","name":"multiple.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":23171,"digest":"sha256:1f0d164331218dd9f5a348d116b0eca3d303a87723463175a755baf4b5373b20","download_count":1,"created_at":"2026-07-03T13:19:01Z","updated_at":"2026-07-03T13:19:02Z"},{"id":465431014,"node_id":"RA_kwDOTAi-3M4bvenm","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":371,"digest":"sha256:1becd64803b1987876b26ac2465cc4478d28392c331a2137ca02628f27a7ae05","download_count":7,"created_at":"2026-07-03T13:18:03Z","updated_at":"2026-07-03T13:18:03Z"},{"id":465431019,"node_id":"RA_kwDOTAi-3M4bvenr","name":"SHA256SUMS.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":10327,"digest":"sha256:a5124622105b3e0a69d3b4547e0973202030ad78f58675ee062b82e142709495","download_count":0,"created_at":"2026-07-03T13:18:03Z","updated_at":"2026-07-03T13:18:03Z"}],"body":"## What's new in v0.2.0\n\n### Full Apple Vision surface\n\nFive new subcommands that wrap Apple's built-in Vision framework \u2014 no model downloads, all on-device:\n\n- `face-landmarks <image>` \u2014 13 landmark region groups per face (eyes, eyebrows, nose, lips, pupils, contour)\n- `pose <image>` \u2014 18-joint body pose skeleton (nose, neck, shoulders, elbows, wrists, hips, knees, ankles)\n- `humans <image>` \u2014 full-body rectangle detection\n- `annotate <image> \"keyword\"` \u2014 OCR keyword find + draw red boxes; `--precision character` enables per-character bbox (dual Vision request + Y-clustering)\n- `infer <model> <image>` \u2014 CoreML model runner, downloads from GitHub Release on first use\n\n### `salient` \u2014 major upgrades\n\nFour overlay styles (was 1):\n- `--overlay` (default): 5-band topographic contours (red\u2192yellow\u2192green\u2192cyan\u2192blue)\n- `--overlay-red`: red heatmap on faded original (eye-grabbing)\n- `--overlay-jet`: full 5-segment Jet colormap (academic standard)\n- `--overlay-bw`: B&W background + colormap (paper-style)\n\nSmart crop to social-media presets:\n- `--crop` \u2014 find saliency bbox, output cropped image\n- `--size square|story|reel|wide|linkedin-cover|twitter-header|yt-thumb|ig-landscape|ig-portrait|avatar|avatar-2x|pinterest`\n- Or custom WxH like `--size 1080x1080`\n\nOCR text inside saliency:\n- `--ocr` returns only texts overlapping the salient region\n- Useful for \"extract the text from the part of the image the user is looking at\"\n\n### `ocr` \u2014 TSV default, multiple output flavors\n\n- Default is TSV: `text\\tconfidence\\tbbox\\tnorm\\tcenter\\tcenter_norm` \u2014 pipes cleanly into spreadsheets/tools\n- `--text` \u2014 one text per line\n- `--lines` \u2014 grouped by visual lines (configurable tolerance via `--tolerance`)\n- `--json` \u2014 full JSON with all info\n\n### `ocr` \u2014 agent-facing workflow\n\n```sh\n# Read text from a screenshot \u2014 straight into an LLM\nmacvision ocr shot.png --tsv\n\n# Get the words (no boxes)\nmacvision ocr shot.png --text | head\n\n# Group by visual lines\nmacvision ocr shot.png --lines\n```\n\n### `classify` \u2014 animal-species specialization\n\n- `--animals` uses `VNRecognizeAnimalsRequest` (Apple's animal detector): cat/dog/bird/etc.\n\n### README + tldr \u2014 agent-focused\n\nEach subcommand's `--help` has a `tldr:` block with agent-style examples. Root `macvision --help` lists top-level agent workflows:\n\n```sh\nmacvision classify photo.jpg --top 5        # what's in this photo?\nmacvision ocr shot.png --tsv                # read a screenshot for an LLM\nmacvision detect shot.png --ocr --lang ...  # full screenshot dump\nmacvision face-landmarks portrait.jpg       # detect face features\nmacvision pose runner.jpg                   # body pose skeleton\nmacvision annotate doc.png X-CMD --output marked.png  # mark all \"X-CMD\" mentions\nmacvision salient photo.jpg --crop --size story     # smart-thumb for social\nmacvision doctor                            # check Vision capabilities\n```\n\n19 tests pass; CI green (build-and-test, license/cla).\n\n**Full Changelog**: https://github.com/ljh-sh/macvision/compare/v0.1.4...v0.2.0\n"}
