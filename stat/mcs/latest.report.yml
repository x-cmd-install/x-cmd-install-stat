ulders","id":430114,"node_id":"MDQ6VXNlcjQzMDExNA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/java-archive","state":"uploaded","size":1303727,"digest":"sha256:7a88478556337cd3bf4d75746acd9cfe5cb9cfdccd6056f10aec7e6b32bd6c2b","download_count":3,"created_at":"2026-08-19T08:07:11Z","updated_at":"2026-08-19T08:07:11Z"}],"body":"## Changelog\r\n\r\n## \ud83d\ude80 Features\r\n- [060ce88](https://github.com/mthmulders/mcs/commits/060ce88) Deprecate shorthand invocation mode, closes [#765](https://github.com/mthmulders/mcs/issues/765)\r\n- [9e7262b](https://github.com/mthmulders/mcs/commits/9e7262b) add --copy flag to copy single-result coordinates to clipboard, closes [#756](https://github.com/mthmulders/mcs/issues/756)\r\n\r\n## \ud83e\uddea Tests\r\n- [e056c7d](https://github.com/mthmulders/mcs/commits/e056c7d) Fail flaky IT for the right reason\r\n\r\n## \ud83e\uddf0 Tasks\r\n- [ed37393](https://github.com/mthmulders/mcs/commits/ed37393) **release**: prepare release v0.11.0\r\n- [7b4d95c](https://github.com/mthmulders/mcs/commits/7b4d95c) Bump it.mulders.stryker:pit-dashboard-reporter (#775), closes [#775](https://github.com/mthmulders/mcs/issues/775)\r\n- [4ec7b62](https://github.com/mthmulders/mcs/commits/4ec7b62) Bump org.graalvm.buildtools:native-maven-plugin (#774), closes [#774](https://github.com/mthmulders/mcs/issues/774)\r\n- [2a05b34](https://github.com/mthmulders/mcs/commits/2a05b34) Bump org.pitest:pitest-maven (#773), closes [#773](https://github.com/mthmulders/mcs/issues/773)\r\n- [f037e37](https://github.com/mthmulders/mcs/commits/f037e37) Bump the production-dependencies-patch-updates group across 1 directory with 4 updates (#772), closes [#772](https://github.com/mthmulders/mcs/issues/772)\r\n- [8092fcf](https://github.com/mthmulders/mcs/commits/8092fcf) Bump the development-dependencies group across 1 directory with 2 updates (#767), closes [#767](https://github.com/mthmulders/mcs/issues/767)\r\n- [12289d3](https://github.com/mthmulders/mcs/commits/12289d3) Bump the github-actions group across 1 directory with 2 updates (#768), closes [#768](https://github.com/mthmulders/mcs/issues/768)\r\n- [0f6e331](https://github.com/mthmulders/mcs/commits/0f6e331) Bump com.diffplug.spotless:spotless-maven-plugin (#766), closes [#766](https://github.com/mthmulders/mcs/issues/766)\r\n- [8f40fc2](https://github.com/mthmulders/mcs/commits/8f40fc2) **deps**: Specify GitHub actions update interval explicitly\r\n- [960f2a4](https://github.com/mthmulders/mcs/commits/960f2a4) **deps**: Create groups of Dependabot pull requests\r\n- [916ad67](https://github.com/mthmulders/mcs/commits/916ad67) Bump version number\r\n- [207c5e1](https://github.com/mthmulders/mcs/commits/207c5e1) **release**: prepare for next development iteration\r\n\r\n## \ud83d\udcdd Documentation\r\n- [ef48111](https://github.com/mthmulders/mcs/commits/ef48111) add dmbuzink as a contributor for test (#763), closes [#763](https://github.com/mthmulders/mcs/issues/763)\r\n\r\n---\r\n- [7528c47](https://github.com/mthmulders/mcs/commits/7528c47) Add initial security policy details\r\n- [460a0ca](https://github.com/mthmulders/mcs/commits/460a0ca) Update 'Contributing' section in README, dropping Gitpod\r\n- [106939e](https://github.com/mthmulders/mcs/commits/106939e) Update intro text for contributors page\r\n- [035642c](https://github.com/mthmulders/mcs/commits/035642c) Add reproducible builds badge\r\n\r\n\r\n## Contributors\r\nWe'd like to thank the following people for their contributions:\r\n* [Usman Shaikh](https://github.com/shaikhu)\r\n* [Damian Buzink](https://github.com/dmbuzink)"}
