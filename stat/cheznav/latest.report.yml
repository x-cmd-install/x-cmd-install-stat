{"id":339477897,"author":{"login":"djetelina","id":6594163,"node_id":"MDQ6VXNlcjY1OTQxNjM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR4PYzs4UPAWJ","tag_name":"v0.3.0","target_commitish":"main","name":"v.0.3.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-06-15T10:45:47Z","updated_at":"2026-06-15T10:48:02Z","published_at":"2026-06-15T10:48:02Z","assets":[],"body":"## Added\r\n\r\n- Auto-detect Textual theme from GTK settings (TEXTUAL_THEME env, GTK_THEME env, gtk-4.0/gtk-3.0 settings.ini)\r\n- Prefix matching for Catppuccin and Rose Pine GTK theme variants\r\n- New --chezmoi-config PATH CLI option to run cheznav with a custom chezmoi config file\r\n\r\n##Changed\r\n\r\n- All hardcoded colors replaced with theme-aware variables for cross-theme support\r\n- Unified background color across header, tabs, and tree panes\r\n\r\n## Fixed\r\n\r\n- Vim-style j/k keys now navigate the trees (advertised in the help screen but never bound)\r\n- Help screen keybindings corrected (directory expand/collapse is Space, and \u2190/\u2192 switch panes)\r\n- `d` (diff) no longer just flickers when no pager is configured \u2014 falls back to a blocking pager (less -R, or more where less is unavailable) so the diff is actually shown (https://github.com/djetelina/cheznav/issues/3)\r\n- Help screen \"Diff View\" section corrected to describe the actual d shortcut (the in-app pane view it described never existed)"}
