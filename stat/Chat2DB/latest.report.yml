ee4d3edf1b221c61429e8ca9","download_count":8,"created_at":"2026-09-10T15:04:01Z","updated_at":"2026-09-10T15:04:15Z"},{"id":555232729,"node_id":"RA_kwDOJx09RM4hGC3Z","name":"Chat2DB-Community-5.3.6-x86_64.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":393136880,"digest":"sha256:d8c36fb9e132d1f56edc7afd9daef1b335fce52fdb42ab7814cf3a9a2efe289a","download_count":26,"created_at":"2026-09-10T15:04:02Z","updated_at":"2026-09-10T15:04:14Z"},{"id":555232736,"node_id":"RA_kwDOJx09RM4hGC3g","name":"Chat2DB-Community-5.3.6.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":425151921,"digest":"sha256:1486b2139b8bc857db1faeb6adf6d3fbe0bf9a42ff43eddaa59ca7acee98fbe6","download_count":50,"created_at":"2026-09-10T15:04:02Z","updated_at":"2026-09-10T15:04:14Z"},{"id":555232741,"node_id":"RA_kwDOJx09RM4hGC3l","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":906,"digest":"sha256:17c83ad32d9dbebabc79f388923dc94ccb4f93d5ff6be5b147696a5d83f5e61f","download_count":7,"created_at":"2026-09-10T15:04:02Z","updated_at":"2026-09-10T15:04:02Z"}],"body":"Chat2DB Community 5.3.6 adds import preview and mapping, flexible CSV settings, MySQL transaction inspection, and execution-history filters, while improving table browsing, database compatibility, and desktop reliability.\n\n## Added (4)\n\n* CSV and Excel imports now offer data preview and column mapping on Web and Desktop, with field skipping and validation for duplicate mappings and missing required columns by @Aias00 and @openai0229 in [PR #2652](https://github.com/OtterMind/Chat2DB/pull/2652) and [PR #2887](https://github.com/OtterMind/Chat2DB/pull/2887).\n* CSV imports support encoding, delimiter, text qualifier, and escape settings, header and data row ranges, empty-value handling, and date, time, and decimal formats by @Aias00 in [PR #2653](https://github.com/OtterMind/Chat2DB/pull/2653).\n* MySQL 5.7 and 8.0 users can inspect active InnoDB transactions, duration, SQL, lock waits, and blocking connections, then open a console to inspect a related connection; unavailable metadata and insufficient privileges are explained explicitly by @Aias00 in [PR #2636](https://github.com/OtterMind/Chat2DB/pull/2636).\n* Execution history can now be filtered by datasource, database, and schema, with SQL keyword search by @HandSonic in [PR #2696](https://github.com/OtterMind/Chat2DB/pull/2696).\n\n## Improved (5)\n\n* Copying table structure or data now shows an editable target-name confirmation and preserves the entered name on failure. Copy and truncate operations also handle special table names without double quoting by @openai0229 in [PR #2880](https://github.com/OtterMind/Chat2DB/pull/2880).\n* Large text and JSON/JSONB cells use compact previews with full values loaded on demand, reducing large result-page loading failures. JSON formatting and compression also preserve value-inspector actions and reset the view to the start by @openai0229 in [PR #2882](https://github.com/OtterMind/Chat2DB/pull/2882).\n* Workspace sidebars resize more smoothly while editor bounds stay aligned, and tabs and enabled watermarks use the theme accent when no custom datasource color is set by @openai0229 in [PR #2870](https://github.com/OtterMind/Chat2DB/pull/2870).\n* Database, schema, and result-filter lists support horizontal scrolling for long values, keep short lists aligned, and show scrollbars only when needed by @openai0229 in [PR #2878](https://github.com/OtterMind/Chat2DB/pull/2878) and [PR #2881](https://github.com/OtterMind/Chat2DB/pull/2881).\n* Built-in JDBC drivers can be downloaded again even when drivers are already installed. Concurrent downloads publish complete files safely, and background downloads no longer prevent application exit by @openai0229 and @HandSonic in [PR #2883](https://github.com/OtterMind/Chat2DB/pull/2883) and [PR #2687](https://github.com/OtterMind/Chat2DB/pull/2687).\n\n## Fixed (18)\n\n* Invalid WHERE or ORDER BY expressions no longer remove the table's filter editors or its last successful result; correcting or clearing the expression allows browsing to recover by @openai0229 in [PR #2899](https://github.com/OtterMind/Chat2DB/pull/2899).\n* Editing multiple result rows no longer inherits current-statement execution options that caused saves to fail on MySQL connections with multi-statement execution disabled by @openai0229 in [PR #2877](https://github.com/OtterMind/Chat2DB/pull/2877).\n* Repeated datasource saves no longer create duplicate connections, failed moves preserve the displayed tree, and creating a datasource inside a group expands and locates the new connection by @openai0229 in [PR #2891](https://github.com/OtterMind/Chat2DB/pull/2891) and [PR #2901](https://github.com/OtterMind/Chat2DB/pull/2901).\n* Tree refreshes preserve hidden-node settings during overlapping refresh and hide operations, and a failed refresh after a successful datasource save is no longer reported as a failed save by @HandSonic in [PR #2743](https://github.com/OtterMind/Chat2DB/pull/2743).\n* JSON and SQL files uploaded in Community Web can be submitted for import correctly by @Aias00 in [PR #2652](https://github.com/OtterMind/Chat2DB/pull/2652).\n* SQL Server pagination recognizes only top-level ORDER BY clauses, and index metadata and generated DDL preserve ASC/DESC sort direction by @HandSonic in [PR #2694](https://github.com/OtterMind/Chat2DB/pull/2694) and [PR #2686](https://github.com/OtterMind/Chat2DB/pull/2686).\n* Kingbase table DDL export works with catalog variants that lack expected information-schema columns and preserves identity, generated-column, enum, and default-value definitions by @openai0229 in [PR #2879](https://github.com/OtterMind/Chat2DB/pull/2879).\n* Switching ClickHouse databases handles spaces, Unicode, and special characters without corrupting the JDBC URL by @HandSonic in [PR #2692](https://github.com/OtterMind/Chat2DB/pull/2692).\n* DB2 procedure, function, and view definitions and related DDL exports no longer fail because JDBC queries contain trailing statement terminators by @HandSonic in [PR #2738](https://github.com/OtterMind/Chat2DB/pull/2738).\n* Changing a Redis key to no expiration now clears its previous TTL by @HandSonic in [PR #2689](https://github.com/OtterMind/Chat2DB/pull/2689).\n* Switching database accounts quickly no longer displays grants returned for a previously selected account by @HandSonic in [PR #2691](https://github.com/OtterMind/Chat2DB/pull/2691).\n* Duplicate desktop launches activate the existing window, and file or protocol requests are retained during concurrent startup and exit handling by @openai0229 in [PR #2875](https://github.com/OtterMind/Chat2DB/pull/2875).\n* AI chat restores table and view suggestions on explicit @ input, supports keyboard and mouse selection, and ignores stale suggestion responses by @openai0229 in [PR #2888](https://github.com/OtterMind/Chat2DB/pull/2888).\n* Long custom-model connection-test errors stay inside a scrollable dialog instead of overflowing the page by @haizhi03 in [PR #2873](https://github.com/OtterMind/Chat2DB/pull/2873).\n* Dashboard refresh controls leave the loading state when a refresh fails by @HandSonic in [PR #2688](https://github.com/OtterMind/Chat2DB/pull/2688).\n* Interrupted task deletions can resume cleanup on application startup without deleting a newer export that reuses the original filename by @HandSonic in [PR #2742](https://github.com/OtterMind/Chat2DB/pull/2742).\n* SSH connection-error logs no longer include passwords, private-key passphrases, or key-file fields by @Aias00 in [PR #2471](https://github.com/OtterMind/Chat2DB/pull/2471).\n* The connection-close API now requires POST /api/connection/close with a JSON request body instead of GET query parameters. API clients that call this endpoint must update their requests by @HandSonic in [PR #2679](https://github.com/OtterMind/Chat2DB/pull/2679).\n\n**Full Changelog**: https://github.com/OtterMind/Chat2DB/compare/v5.3.5...v5.3.6\n","mentions_count":4}
