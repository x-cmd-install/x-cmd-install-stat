and locate the OtterMind SQLX CLI from Settings, import the connections Chat2DB already stores, and see the Skill command an agent needs; credentials go to the child process on stdin and are never written to disk, the renderer or the logs. by @openai0229 in #2959\n\n## Optimization (1)\n\n1. **Complete large values for view, copy and export**: JSON / LONGTEXT / BLOB values are completed from a snapshot captured while the query runs, so the grid, every copy format (cell, selection, `INSERT` / `UPDATE` / `WHERE`, IN Values, TSV, Markdown) and exports return the full content even when there is no primary key to re-query; the captured content is freed when the result is discarded or when it expires. by @openai0229 in #2972\n\n## Fixed (2)\n\n1. **KingbaseES procedure list**: procedures come from `sys_catalog.sys_proc` instead of the JDBC driver query that failed with `operator does not exist: boolean || oid`, covering V8R3 and V8R6+. by @openai0229 in #2956\n2. **Table data tabs no longer re-browse on every switch**: switching tabs no longer re-issues the request and resets to page 1, a failed first page offers a retry, and a layout change keeps the pane's active tab. by @openai0229 in #2961\n\n**Full Changelog**: https://github.com/OtterMind/Chat2DB/compare/v5.3.7...v5.3.8\n","mentions_count":1}
