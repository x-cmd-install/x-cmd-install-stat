efe4d59618733723f82d08c","download_count":81,"created_at":"2026-09-02T13:15:59Z","updated_at":"2026-09-02T13:16:15Z"},{"id":541201069,"node_id":"RA_kwDOJx09RM4gQhKt","name":"Chat2DB-Community-5.3.5-x86_64.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":392983857,"digest":"sha256:359900aa581f66a34490ef22c2469bef9199d6cac22b783e9f53d1418a593d93","download_count":33,"created_at":"2026-09-02T13:15:59Z","updated_at":"2026-09-02T13:16:15Z"},{"id":541201070,"node_id":"RA_kwDOJx09RM4gQhKu","name":"Chat2DB-Community-5.3.5.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":425004465,"digest":"sha256:53e2aabbd46e1fc59bf80f71fd2aaf74b124ae6b8c7258e456ed7c8135c8e856","download_count":203,"created_at":"2026-09-02T13:15:59Z","updated_at":"2026-09-02T13:16:18Z"},{"id":541201084,"node_id":"RA_kwDOJx09RM4gQhK8","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":906,"digest":"sha256:3cd89339ea538c7f7048f29873361b4a2bb6e28159f6486a55559f5f302657a8","download_count":15,"created_at":"2026-09-02T13:16:01Z","updated_at":"2026-09-02T13:16:01Z"}],"body":"Chat2DB Community 5.3.5 adds AI conversation navigation and new database-specific capabilities, while making large result sets, workspace navigation, local files, and desktop sessions more reliable.\n\n## Added (4)\n\n* AI chat sessions can now be renamed from both chat surfaces, and the message navigation rail jumps directly to earlier user prompts by @openai0229 in [PR #2849](https://github.com/OtterMind/Chat2DB/pull/2849).\n* DM now supports real execution plans for both typed `EXPLAIN` statements and the Explain action by @haizhi03 in [PR #2771](https://github.com/OtterMind/Chat2DB/pull/2771).\n* Import and export execution logs now show live task progress and completion state by @openai0229 in [PR #2857](https://github.com/OtterMind/Chat2DB/pull/2857).\n* MySQL users can view and change index visibility on 8.0+, and column visibility on 8.0.23+, directly from the table editor by @Aias00 in [PR #2606](https://github.com/OtterMind/Chat2DB/pull/2606) and [PR #2607](https://github.com/OtterMind/Chat2DB/pull/2607).\n\n## Improved (8)\n\n* SQL result page sizes above 1,000 can be configured and preserved across execution and pagination, with reliable large-page loading on Web and Desktop by @openai0229 in [PR #2750](https://github.com/OtterMind/Chat2DB/pull/2750), [PR #2756](https://github.com/OtterMind/Chat2DB/pull/2756), [PR #2761](https://github.com/OtterMind/Chat2DB/pull/2761), and [PR #2766](https://github.com/OtterMind/Chat2DB/pull/2766).\n* Long result values stay compact by default, while manually resizing a row reveals the complete wrapped value without unbounded table rendering by @openai0229 in [PR #2752](https://github.com/OtterMind/Chat2DB/pull/2752), [PR #2754](https://github.com/OtterMind/Chat2DB/pull/2754), and [PR #2863](https://github.com/OtterMind/Chat2DB/pull/2863).\n* Datasource tree search preserves its query, expansion, selection, and refresh state until explicitly closed; clicked matches locate the real node and long names scroll horizontally by @openai0229 in [PR #2751](https://github.com/OtterMind/Chat2DB/pull/2751), [PR #2755](https://github.com/OtterMind/Chat2DB/pull/2755), [PR #2758](https://github.com/OtterMind/Chat2DB/pull/2758), and [PR #2787](https://github.com/OtterMind/Chat2DB/pull/2787).\n* Workspace tabs now locate the active header, scroll smoothly with mouse and trackpad input, preserve editor, result, and terminal state across pane splits, and render the first terminal tab correctly by @openai0229 in [PR #2753](https://github.com/OtterMind/Chat2DB/pull/2753), [PR #2759](https://github.com/OtterMind/Chat2DB/pull/2759), [PR #2760](https://github.com/OtterMind/Chat2DB/pull/2760), [PR #2775](https://github.com/OtterMind/Chat2DB/pull/2775), and [PR #2789](https://github.com/OtterMind/Chat2DB/pull/2789).\n* Datasource identity colors and editor watermarks are easier to distinguish, environment IDs map correctly, and workspace headers align consistently by @openai0229 in [PR #2749](https://github.com/OtterMind/Chat2DB/pull/2749), [PR #2763](https://github.com/OtterMind/Chat2DB/pull/2763), [PR #2854](https://github.com/OtterMind/Chat2DB/pull/2854), [PR #2859](https://github.com/OtterMind/Chat2DB/pull/2859), and [PR #2860](https://github.com/OtterMind/Chat2DB/pull/2860).\n* Redis key details can now be opened by clicking anywhere on a selectable key row by @openai0229 in [PR #2853](https://github.com/OtterMind/Chat2DB/pull/2853).\n* MySQL autocomplete avoids full-script parsing for ordinary large SQL and large `IN` lists, while retaining the existing parser for complex routines and ambiguous input by @openai0229 in [PR #2865](https://github.com/OtterMind/Chat2DB/pull/2865).\n* The integrated terminal now falls back through available platform shells when the preferred shell cannot start by @liushikuan63 in [PR #2737](https://github.com/OtterMind/Chat2DB/pull/2737).\n\n## Fixed (11)\n\n* Sorting, filtering, refreshing, and paging now update the active result instead of opening extra result sets; result edit actions and `Cmd/Ctrl+S` also commit the active cell correctly by @openai0229 in [PR #2868](https://github.com/OtterMind/Chat2DB/pull/2868).\n* Choosing Save while closing an unnamed SQL draft no longer leaves the naming dialog blocked behind the close confirmation by @openai0229 in [PR #2736](https://github.com/OtterMind/Chat2DB/pull/2736).\n* Local SQL and Markdown saves are serialized and use the latest path and encoding metadata; close, rename, delete, shortcut, and exit operations wait for pending writes by @openai0229 in [PR #2861](https://github.com/OtterMind/Chat2DB/pull/2861).\n* Large local-file contents are no longer copied into browser local storage, preventing quota failures while preserving restoration from disk by @openai0229 in [PR #2866](https://github.com/OtterMind/Chat2DB/pull/2866).\n* Community Web JDBC driver upload, download, save, and delete workflows work again with bounded, expiry-managed staged files by @openai0229 in [PR #2787](https://github.com/OtterMind/Chat2DB/pull/2787).\n* Desktop close, restart, and update operations now wait for editor save handling with a native fallback, while task polling runs only when needed. The unreliable manual task-cancel action and API have been removed by @openai0229 in [PR #2776](https://github.com/OtterMind/Chat2DB/pull/2776).\n* Bundled SQL syntax plugins now load reliably in desktop runtimes without classloader incompatibility errors by @openai0229 in [PR #2773](https://github.com/OtterMind/Chat2DB/pull/2773).\n* AI model configuration is now written atomically to avoid corruption or API-key loss during interrupted writes by @Aias00 in [PR #2512](https://github.com/OtterMind/Chat2DB/pull/2512).\n* Result search now matches visible custom-rendered column names as well as cell values by @openai0229 in [PR #2851](https://github.com/OtterMind/Chat2DB/pull/2851).\n* Hive namespaces now appear as database nodes, and metadata loading tolerates JDBC drivers that do not implement `getURL()` by @openai0229 in [PR #2855](https://github.com/OtterMind/Chat2DB/pull/2855).\n* Dynamic datasource forms now localize common connection fields and authentication options, while preserving unknown custom labels as fallback text by @openai0229 in [PR #2864](https://github.com/OtterMind/Chat2DB/pull/2864).\n\n## New Contributors\n\n* @liushikuan63 made their first contribution in [PR #2737](https://github.com/OtterMind/Chat2DB/pull/2737).\n\n**Full Changelog**: https://github.com/OtterMind/Chat2DB/compare/v5.3.4...v5.3.5\n","mentions_count":4}
