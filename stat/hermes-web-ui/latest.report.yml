3001\u5378\u8f7d\u548c\u53cd\u5411\u4ee3\u7406\u5165\u53e3\uff0c\u65b0\u589e\u9690\u79c1\u653f\u7b56\u5165\u53e3\u5e76\u66f4\u65b0\u5b58\u5728\u6f0f\u6d1e\u7684\u4f9d\u8d56 (#3466)\n- \u65b0\u589e M5Stack Cardputer-Adv \u5c40\u57df\u7f51\u56fa\u4ef6\u5f00\u53d1\u9884\u89c8\uff0c\u652f\u6301\u6587\u5b57\u4e0e\u77ed\u8bed\u97f3\u804a\u5929\uff0c\u4f9b\u5df2\u6709\u517c\u5bb9\u5206\u533a\u5e03\u5c40\u7684\u8bbe\u5907\u624b\u52a8\u5347\u7ea7 (#3451)\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.38`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8986\u76d6 12 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3472)\u3002\n\n## What's Changed\n\n* fix(chat): authorize attachment runs against their resolved profile by @widechaos in https://github.com/EKKOLearnAI/ekko-studio/pull/3439\n* feat(esp32-s3): add M5Stack Cardputer-Adv LAN firmware preview by @thursdaycapital in https://github.com/EKKOLearnAI/ekko-studio/pull/3451\n* [codex] make Model API panel fill available width by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3450\n* [codex] fix DSH ACP 0.2.1-rc.2 turn persistence compatibility by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3452\n* feat(models): import providers through desktop and web links by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3438\n* fix: use system proxy by default for browser profiles by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3455\n* [codex] add JEV matching and verification to Ekko Computer Use by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3463\n* [codex] add cloud Model API access, key controls and Agent usage by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3440\n* [codex] add desktop device switching and retire LAN pairing by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3464\n* [codex] wait for device Close button before native pointer test by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3468\n* fix(tos): remediate review lifecycle and package compliance findings by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3466\n* Add automatic API mode and match namespaced model IDs by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3469\n* chore: prepare Studio 0.7.38 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3472\n\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.37...v0.7.38\n","mentions_count":4}
