)\n\n## What's Changed\n* [codex] add authenticated direct App transport with relay fallback by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3290\n* [codex] bind P2P sockets to uplinks and publish Docker UDP ports by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3292\n* [codex] unify model metadata and pricing resolution by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3298\n* [codex] forward App context endpoints and shared reasoning metadata by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3299\n* [codex] match custom model IDs by final path segment by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3300\n* [codex] preserve selected theme style on reload by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3302\n* [codex] fix P2P STUN resolution under fake-IP DNS by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3303\n* [codex] prepare Studio 0.7.31 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3305\n\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.30...v0.7.31","mentions_count":1}
