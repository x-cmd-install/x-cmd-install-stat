/ekko-studio/pull/3121\n* Fix App share management and add scoped session settings permissions by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3122\n* fix: correct shared session metadata and hide revoked invitations by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3123\n* fix: restore Android task notification progress by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3127\n* fix: authorize shared context limits with model permissions by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3128\n* feat: add shared single-chat voice permission by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3129\n* fix(push): enable notification content previews by default by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3131\n* [coding-agents] apply Studio context windows and compaction thresholds by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3134\n* [codex] fix Android and iOS notifications showing the first Agent reply by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3135\n* [codex] Label auxiliary and ensemble models as Hermes settings by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3138\n* fix(settings): default new session push on and retain saved preferences by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3133\n* [codex] Filter model settings by page-selected Profile by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3142\n* feat(push): orchestrate iOS Live Activities by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3111\n* fix: preserve generated titles for attachment messages by @lorenzozanee in https://github.com/EKKOLearnAI/ekko-studio/pull/3132\n* Hide social push entries and disable automatic social notifications by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3146\n* [codex] Prepare repository links for ekko-studio rename by @EKKOLearnAI in https://g