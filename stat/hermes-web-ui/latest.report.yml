)\n- \u4fee\u590d Linux \u684c\u9762\u7aef\u5f00\u673a\u81ea\u542f\uff0c\u5e76\u5b8c\u5584\u684c\u9762\u542f\u52a8\u5931\u8d25\u65f6\u7684\u9519\u8bef\u63d0\u793a\u4e0e\u8bca\u65ad\u4fe1\u606f (#3307\u3001#3308)\n- \u79fb\u9664\u7fa4\u804a\u4e2d\u5df2\u8fc7\u65f6\u7684\u5347\u7ea7\u63d0\u793a (#3306)\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.32`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8865\u9f50 11 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3323)\n\n## What's Changed\n* [codex] remove group chat upgrade notice by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3306\n* [codex] make Linux Open at Login register desktop autostart by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3307\n* [codex] preserve desktop backend startup errors by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3308\n* [codex] add desktop screenshots, platform support and global shortcuts by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3312\n* [codex] persist workspace history and favorites by account by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3317\n* [coding-agent] request stream usage from Chat Completions providers by @WenhuaXia in https://github.com/EKKOLearnAI/ekko-studio/pull/3314\n* [codex] isolate desktop screenshot failures by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3318\n* [codex] remember the last Agent selected for new chats by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3320\n* [codex] fix Hermes run state recovery and finalization by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3321\n* [codex] prepare Studio 0.7.32 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3323\n\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.31...v0.7.32","mentions_count":2}
