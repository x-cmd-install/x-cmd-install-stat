ze":350,"digest":"sha256:440bb528b723fbf54448c4f6799dad9aa4388e5053aef596cae4c2a17c93a214","download_count":327,"created_at":"2026-11-03T05:26:12Z","updated_at":"2026-11-03T05:26:13Z"}],"body":"# Ekko Studio 0.8.14 更新日志\n\n日期：2026-11-03\n\n1. 修复 Bot 任务纠正后另开对话的问题：直接用自然语言修改目标或做法，由所属 Bot 判断并在原任务、Agent、工作区和执行对话中继续，保留原有历史与适用约束 (#3656)\n2. 纠正任务时先停止旧工作、关联验收及旧结果处理，再按最新完整要求继续；停止失败保留请求重试，支持重启恢复，连续纠正以最新要求为准，过期排队输入和结果不再干扰新方向 (#3656)\n3. 兼容原目标的补充仍在同一对话按顺序排队，明确停止会取消待执行的纠正请求；启用验收的任务保留验收标准和预设，并为新要求重新验收 (#3656)\n4. 任务纠正期间保持聊天历史和输入框，显示正在停止及错误状态；过期请求被拒绝时保留草稿，已保存的纠正请求避免被普通队列操作误删 (#3656)\n\n范围：`v0.8.13`（`5c82de204e1babc460c2cd18b0cfedc7658d0de6`）→ `1f4d0080673052760056056448686d8f6e316ab2`。仅含已合并 PR #3656；区间无独立回滚提交。\n\n桌面 Hermes runtime 沿用 0.22.5，源码固定 v0.22.5 / bf0203a794a07aac3ff764972ab9087baa4e4f4e。Android 与 MCU 不在本轮范围。\n"}
