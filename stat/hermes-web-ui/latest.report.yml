tate":"uploaded","size":350,"digest":"sha256:c6d46c957b4a6ff65e93b0c1791b3afd8b638bd0da66cab25f43a6941ae4cd7b","download_count":5277,"created_at":"2026-10-23T11:33:34Z","updated_at":"2026-10-23T11:33:35Z"}],"body":"## \u66f4\u65b0\u91cd\u70b9\n\n- \u65b0\u589e\u8de8\u8f6e\u6b21\u4f1a\u8bdd\u4efb\u52a1\u8bb0\u5f55\uff0cAgent \u53ef\u6301\u7eed\u8ddf\u8fdb\u7528\u6237\u76ee\u6807\u5e76\u4fdd\u5b58\u5b8c\u6210\u4f9d\u636e (#3499)\n- \u65b0\u589e\u4f1a\u8bdd\u4efb\u52a1\u62bd\u5c49\uff0c\u53ef\u8df3\u8f6c\u5230\u5173\u8054\u5bf9\u8bdd\uff1b\u5b8c\u5584\u79fb\u52a8\u7aef\u5217\u8868\u3001\u4efb\u52a1\u8be6\u60c5\u4e0e\u4f1a\u8bdd\u540d\u79f0\uff0c\u51cf\u5c11\u7410\u788e\u4efb\u52a1\u8bb0\u5f55 (#3501\u3001#3509\u3001#3510)\n- \u8fdc\u7a0b Studio \u7684 Agent \u53ef\u5728\u684c\u9762\u7aef\u660e\u786e\u6388\u6743\u540e\u4f7f\u7528\u672c\u673a\u5185\u7f6e\u6d4f\u89c8\u5668\uff0c\u652f\u6301\u968f\u65f6\u505c\u6b62\u5171\u4eab (#3478)\n- \u8d26\u53f7\u4e3b\u9898\u5feb\u6377\u5207\u6362\u65b0\u589e\u8ddf\u968f\u7cfb\u7edf\u6a21\u5f0f\uff1b\u7edf\u4e00\u62bd\u5c49\u7684\u9876\u90e8\u95f4\u8ddd\u3001\u4e3b\u9898\u80cc\u666f\u4e0e\u76f4\u89d2\u6837\u5f0f (#3496\u3001#3475)\n- \u7fa4\u804a\u7a7a\u72b6\u6001\u5c55\u793a\u5168\u90e8 Agent\uff0c\u5e76\u9002\u914d\u4e0d\u540c\u7a97\u53e3\u5bbd\u5ea6 (#3471)\n- Ekko \u9ed8\u8ba4\u63a8\u7406\u5f3a\u5ea6\u8c03\u6574\u4e3a\u65e0\uff0c\u7edf\u4e00\u5355\u804a\u3001\u7fa4\u804a\u548c\u5de5\u4f5c\u6d41\u4e2d\u7684 Agent \u6807\u7b7e (#3488)\n- \u4fee\u590d\u505c\u6b62\u540e\u601d\u8003\u6307\u793a\u5668\u4e0d\u6d88\u5931\uff0c\u4ee5\u53ca\u5de5\u5177\u7ed3\u679c\u622a\u65ad\u65f6\u4e2d\u6587\u6216\u8868\u60c5\u635f\u574f\u3001\u8bf7\u6c42\u5931\u8d25\u7684\u95ee\u9898 (#3473\u3001#3457\u3001#3460)\n- \u670d\u52a1\u5546\u5bfc\u5165\u94fe\u63a5\u652f\u6301\u81ea\u52a8 API \u6a21\u5f0f\uff1bJEV \u517c\u5bb9\u5e26\u7248\u672c\u524d\u7f00\u53ca\u5b8c\u6574\u63a5\u53e3\u5730\u5740\uff0c\u5e76\u533a\u5206\u63a5\u53e3\u7f3a\u5931\u4e0e\u6a21\u578b\u9519\u8bef (#3494\u3001#3493\u3001#3491)\n- \u684c\u9762\u622a\u56fe\u7f3a\u5c11\u5f55\u5c4f\u6743\u9650\u65f6\u53ef\u76f4\u63a5\u524d\u5f80\u7cfb\u7edf\u8bbe\u7f6e\u6388\u6743\uff0c\u907f\u514d\u963b\u585e\u5f0f\u5f39\u7a97 (#3492)\n- \u4fee\u590d Windows ARM64 \u539f\u751f Hermes \u8fd0\u884c\u65f6\u6784\u5efa\u4e2d\u7684\u4f9d\u8d56\u4e0e\u7ec8\u7aef\u517c\u5bb9\u95ee\u9898 (#3429)\n- \u505c\u6b62\u63d0\u4f9b TerraMaster TOS \u4e13\u7528\u5b89\u88c5\u5305\u4e0e\u81ea\u52a8\u6784\u5efa\u652f\u6301 (#3503)\n- \u4f1a\u8bdd\u4efb\u52a1\u65b0\u589e\u521b\u5efa\u4e0e\u5b8c\u6210 Webhook \u4e8b\u4ef6\uff0c\u652f\u6301\u5206\u522b\u8ba2\u9605\uff0c\u5e76\u6309\u5185\u5bb9\u5f00\u5173\u63a7\u5236\u4efb\u52a1\u6807\u9898\u3001\u6458\u8981\u548c\u5b8c\u6210\u4f9d\u636e\u7684\u53d1\u9001 (#3512)\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.39`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8986\u76d6 12 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3511)\u3002\n\n## What's Changed\n* Show all agent avatars in responsive group chat empty states by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3471\n* Stop the thinking indicator after abort completion by @widechaos in https://github.com/EKKOLearnAI/ekko-studio/pull/3473\n* [codex] keep drawers below the header with themed backgrounds and square corners by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3475\n* fix(chat): preserve surrogate pairs when truncating tool results by @widechaos in https://github.com/EKKOLearnAI/ekko-studio/pull/3457\n* fix(agent): cut tool results on character boundaries instead of UTF-16 halves by @fxqq in https://github.com/EKKOLearnAI/ekko-studio/pull/3460\n* fix(app-relay): log every auth rejection instead of failing silently by @kosmo888 in https://github.com/EKKOLearnAI/ekko-studio/pull/3487\n* fix: default Ekko reasoning to none and unify agent labels by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3488\n* fix: pin CI and Docker Node.js to 24.22.1 by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3489\n* feat(browser): allow remote Studio agents to use consented Desktop browser by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3478\n* support auto API mode in provider import links by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3494\n* [codex] accept full JEV provider endpoint URLs by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3493\n* fix(jev): report missing endpoints as address errors (#3490) by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3491\n* [codex] route command approvals through Studio by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3495\n* fix(desktop): offer screenshot permission authorization without a blocking dialog by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3492\n* feat(theme): add follow-system mode to account theme shortcut by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3496\n* feat: track session goals across turns with native and MCP tools by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3499\n* chore: discontinue TerraMaster TOS packaging support by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3503\n* feat: add a session task drawer with chat turn navigation by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3501\n* revert: roll back Codex app-server approval integration (#3495) by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3505\n* fix: stabilize task links and polish mobile task lists by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3509\n* fix: reduce task noise and resolve untitled session names by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3510\n* [codex] fix native Windows ARM64 Hermes runtime builds by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3429\n* chore: prepare Studio 0.7.39 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3511\n* feat: send webhooks when session tasks are created or completed by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3512\n\n## New Contributors\n* @fxqq made their first contribution in https://github.com/EKKOLearnAI/ekko-studio/pull/3460\n* @kosmo888 made their first contribution in https://github.com/EKKOLearnAI/ekko-studio/pull/3487\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.38...v0.7.39","mentions_count":5}
