ize":827,"digest":"sha256:657b26eb9aef049d4cfde1e606ecbc9d5d9fca6f03e30b5144c35d900a25b09f","download_count":335,"created_at":"2026-10-10T02:59:54Z","updated_at":"2026-10-10T02:59:54Z"},{"id":626826044,"node_id":"RA_kwDOR_sfj84lXJs8","name":"latest.yml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":350,"digest":"sha256:dd6f83b692033959636a2c54368cf402e8453760b37b959183ee598b48fdc26d","download_count":483,"created_at":"2026-10-10T02:50:09Z","updated_at":"2026-10-10T02:50:09Z"}],"body":"## \u66f4\u65b0\u91cd\u70b9\n\n- \u65b0\u5efa\u804a\u5929\u6539\u4e3a\u54cd\u5e94\u5f0f\u9875\u9762\uff0c\u4f7f\u7528 Agent \u5361\u7247\u9009\u62e9\u52a9\u624b\uff0c\u5e76\u590d\u7528\u804a\u5929\u8f93\u5165\u6846\u4e0e\u4f1a\u8bdd\u8bbe\u7f6e (#3333)\n- \u65b0\u5efa\u804a\u5929\u8bb0\u4f4f\u4e0a\u6b21\u4f7f\u7528\u7684\u6a21\u578b\u3001\u5de5\u4f5c\u76ee\u5f55\u3001\u542f\u52a8\u65b9\u5f0f\u548c\u63a8\u7406\u9009\u9879\uff0c\u65b9\u4fbf\u8fde\u7eed\u521b\u5efa\u4f1a\u8bdd (#3333)\n- Agent \u5361\u7247\u65b0\u589e\u91d1\u8272\u8fb9\u6846\u4e0e\u7389\u8272\u6d41\u5149\uff0c\u5e76\u7edf\u4e00\u5404\u5e73\u53f0\u5361\u7247\u5185\u90e8\u52a8\u753b\u7684\u901f\u5ea6 (#3336\u3001#3344)\n- \u4fee\u590d Agent \u5361\u7247\u5faa\u73af\u5207\u6362\u65f6\u7684\u7f29\u653e\u8df3\u53d8\uff0c\u4ee5\u53ca\u9f20\u6807\u5728\u5217\u8868\u5916\u91ca\u653e\u540e\u4ecd\u4f1a\u62d6\u52a8\u7684\u95ee\u9898 (#3335\u3001#3340)\n- \u4fee\u590d\u957f\u6570\u5b57\u3001\u7b26\u53f7\u6216\u7a7a\u767d\u6587\u672c\u5bfc\u81f4 Token \u8ba1\u7b97\u5361\u987f\u3001\u804a\u5929\u65e0\u54cd\u5e94\u7684\u95ee\u9898 (#3325)\n- \u5b8c\u5584\u4e0a\u4e0b\u6587\u7528\u91cf\u4f30\u7b97\u4e0e\u81ea\u52a8\u538b\u7f29\uff0c\u8ba1\u5165\u5de5\u5177\u8c03\u7528\u548c\u6a21\u578b\u5b9e\u9645\u7528\u91cf\uff0c\u4fee\u590d\u5de5\u5177\u7ec4\u8de8\u538b\u7f29\u8fb9\u754c\u65f6\u65e0\u6cd5\u538b\u7f29\u7684\u95ee\u9898 (#3329)\n- \u4fee\u590d\u7f16\u7a0b Agent \u56e0\u4f9d\u8d56\u8f93\u51fa\u8c03\u8bd5\u65e5\u5fd7\u800c\u4e2d\u65ad\u804a\u5929\u7684\u95ee\u9898\uff0c\u63d0\u9ad8 DSH \u548c\u5176\u4ed6 ACP Agent \u7684\u517c\u5bb9\u6027 (#3327)\n- \u4fee\u590d\u4e0d\u540c Hermes \u5185\u6838\u7248\u672c\u4e0b\u6f84\u6e05\u95ee\u9898\u4e0e\u56de\u7b54\u56de\u8c03\u7684\u517c\u5bb9\u6027\u95ee\u9898 (#3330)\n- \u624b\u673a\u7f51\u9875\u7aef\u4fa7\u8fb9\u680f\u4e0e App \u4fdd\u6301\u4e00\u81f4\uff0c\u5bbd\u5ea6\u91c7\u7528\u5c4f\u5e55\u7684 90%\u3001\u6700\u5927 380px\uff0c\u6539\u5584\u8f83\u5bbd\u5c4f\u5e55\u4e0a\u7684\u663e\u793a (#3346)\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.33`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8865\u9f50 11 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3345)\n\n## What's Changed\n* fix(tokens): guard quadratic BPE for digit/symbol/whitespace runs by @WenhuaXia in https://github.com/EKKOLearnAI/ekko-studio/pull/3325\n* fix Hermes clarify callbacks across kernel versions by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3330\n* [codex] replace new-chat drawer with responsive Agent cards by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3333\n* [codex] fix Agent card scaling at click loop boundaries by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3335\n* [codex] add gold and jade foil to Agent cards by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3336\n* fix(coding-agents): tolerate dependency stdout noise on ACP pipes by @WenhuaXia in https://github.com/EKKOLearnAI/ekko-studio/pull/3327\n* fix(chat-run): count tool_calls and real usage in bridge context estimate by @chloeassistant in https://github.com/EKKOLearnAI/ekko-studio/pull/3329\n* [codex] stop Agent cards dragging after mouse release outside the list by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3340\n* [codex] keep new-chat card interior animations at a consistent speed by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3344\n* chore: prepare Studio 0.7.33 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3345\n* [codex] match mobile sidebar width to App by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3346\n\n## New Contributors\n* @chloeassistant made their first contribution in https://github.com/EKKOLearnAI/ekko-studio/pull/3329\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.32...v0.7.33\n","mentions_count":3}
