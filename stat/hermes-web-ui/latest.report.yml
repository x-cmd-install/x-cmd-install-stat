u90e8\u7528\u91cf (#3433)\n- \u684c\u9762\u7aef Ekko \u65b0\u589e Computer Use\uff0c\u652f\u6301\u67e5\u770b\u548c\u64cd\u4f5c\u672c\u673a\u5e94\u7528\uff0c\u5e76\u63d0\u4f9b macOS \u6743\u9650\u6307\u5f15\u53ca\u6388\u6743\u63d0\u9192 (#3411\u3001#3427)\n- \u5355\u804a\u548c\u7fa4\u804a\u652f\u6301\u591a\u9009\u6d88\u606f\u590d\u5236\u4e0e\u5220\u9664\uff0c\u4fdd\u62a4\u8fdb\u884c\u4e2d\u7684\u4efb\u52a1\u548c\u7fa4\u804a\u6458\u8981\uff0c\u5e76\u7b80\u5316\u6d88\u606f\u64cd\u4f5c\u5de5\u5177\u680f (#3422\u3001#3423\u3001#3425)\n- \u804a\u5929\u3001\u7fa4\u804a\u548c\u5de5\u4f5c\u6d41\u4fa7\u680f\u652f\u6301\u62d6\u62fd\u8c03\u6574\u5bbd\u5ea6\uff0c\u5e76\u9650\u5236\u6700\u5c0f\u548c\u6700\u5927\u5c3a\u5bf8 (#3408)\n- \u7f16\u7a0b Agent \u7684\u63a5\u53e3\u6a21\u5f0f\u8ddf\u968f Provider \u914d\u7f6e\uff0c\u4fee\u590d Responses \u63a8\u7406\u5f3a\u5ea6\u4f20\u9012\u548c\u8de8\u6a21\u578b\u601d\u8003\u5386\u53f2\u517c\u5bb9\u6027 (#3430\u3001#3416\u3001#3432)\n- \u4fee\u590d\u804a\u5929\u505c\u6b62\u3001\u961f\u5217\u64a4\u56de\u3001\u5de5\u5177\u5ba1\u6279\u7ed3\u679c\u548c\u7fa4\u804a\u8ba1\u5212\u9274\u6743\uff0c\u907f\u514d\u5e76\u53d1\u4f1a\u8bdd\u8bef\u663e\u793a\u5176\u4ed6\u4f1a\u8bdd\u7684\u5de5\u4f5c\u533a\u6539\u52a8 (#3404\u3001#3409\u3001#3414\u3001#3415)\n- \u4fee\u590d\u684c\u9762\u7aef Electron \u73af\u5883\u4e2d\u7684 Node \u4ee3\u7801\u6267\u884c\u6a21\u5f0f (#3412)\n- \u6e05\u9664 Claude OAuth \u767b\u5f55\u65f6\u540c\u6b65\u79fb\u9664\u5404 Profile \u7ba1\u7406\u7684\u51ed\u636e\uff0c\u907f\u514d\u6b8b\u7559\u767b\u5f55\u72b6\u6001 (#3442)\n- \u65b0\u589e Windows ARM64 \u684c\u9762\u5b89\u88c5\u5305\u6784\u5efa\u652f\u6301 (#3428)\n- \u4fee\u590d TOS 7 \u5168\u65b0\u5b89\u88c5\u3001\u5165\u53e3\u8def\u5f84\u548c\u670d\u52a1\u91cd\u542f\u7b56\u7565\uff0c\u51cf\u5c11\u5bf9\u4e3b\u673a\u73af\u5883\u53ca\u9884\u5efa\u7528\u6237\u7684\u4f9d\u8d56 (#3413\u3001#3431)\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.37`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8986\u76d6 12 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3445)\u3002\n\n\n## What's Changed\n* [codex] make Studio sidebars resizable within width limits by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3408\n* [codex] fix expired-token failures in Hermes group task plans by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3409\n* [codex] fix verified access-control, runtime and chat issues by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3404\n* [codex] fix chat protocol, queue recall and workspace overlap regressions by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3414\n* [codex] add native desktop Computer Use to Ekko Agent by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3411\n* [codex] forward scoped reasoning effort to Responses upstreams by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3416\n* fix: run Node code_exec children in Node mode under Electron by @250100901 in https://github.com/EKKOLearnAI/ekko-studio/pull/3412\n* fix: expose successful tool approval scope to the model by @250100901 in https://github.com/EKKOLearnAI/ekko-studio/pull/3415\n* [codex] Add chat message multi-select deletion and native desktop menus by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3422\n* [codex] Add group chat multi-select deletion with summary protection by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3423\n* [codex] Simplify chat selection toolbars to neutral icons by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3425\n* [codex] fix TOS review C21 portal route and S05 restart policy by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3413\n* [codex] fix macOS Computer Use Dock icon and add permission guidance by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3427\n* Add Windows ARM64 desktop packaging by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3428\n* Fix Ekko encrypted reasoning replay after model switches by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3432\n* [codex] fix TOS installation dependencies and service account creation by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3431\n* [codex] derive coding agent API modes from Providers by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3430\n* [codex] expose account-wide model Responses API and settings by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3433\n* fix: clear all profile-managed Claude OAuth credentials by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3442\n* [codex] prepare Studio 0.7.37 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3445\n\n## New Contributors\n* @250100901 made their first contribution in https://github.com/EKKOLearnAI/ekko-studio/pull/3412\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.36...v0.7.37","mentions_count":3}
