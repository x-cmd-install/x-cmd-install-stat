:837,"digest":"sha256:96ccac618b9ef198f2527cbe311c6554609c8052d8bbf09b9ff3aaa46f7d9d02","download_count":5139,"created_at":"2026-09-06T05:13:19Z","updated_at":"2026-09-06T05:13:19Z"},{"id":546760640,"node_id":"RA_kwDOR_sfj84glufA","name":"latest.yml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":354,"digest":"sha256:ee1d34ec8199b13924ccd6f711b84bf87d691d815ce4ca708739f397f26598f6","download_count":12396,"created_at":"2026-09-06T05:06:42Z","updated_at":"2026-09-06T05:06:43Z"}],"body":"## \u66f4\u65b0\u5185\u5bb9\n\n- \u65b0\u589e OpenCode Coding Agent\uff0c\u652f\u6301\u4f1a\u8bdd\u7eed\u63a5\u3001\u6d41\u5f0f\u5de5\u5177\u8c03\u7528\u3001\u914d\u7f6e\u3001\u8bb0\u5fc6\u3001Skills\u3001\u5de5\u4f5c\u6d41\u548c\u7fa4\u804a (#2890)\n- \u7fa4\u804a\u73b0\u5728\u652f\u6301\u901a\u8fc7\u4e91\u7aef\u4e2d\u7ee7\u8fde\u63a5\u8fdc\u7a0b Agent\uff0c\u6539\u5584\u6d41\u5f0f\u8f93\u51fa\u987a\u5e8f\u3001\u65ad\u7ebf\u91cd\u8fde\u3001\u6458\u8981\u6062\u590d\u4e0e\u5206\u4eab\u56fe\u7247\u8bbf\u95ee\uff0c\u5e76\u7edf\u4e00\u5de5\u5177\u6298\u53e0\u548c\u79fb\u52a8\u7aef\u5e03\u5c40 (#2927)\n- \u65b0\u589e\u624b\u673a\u5355\u6b21\u5b9a\u4f4d\u3001\u65e5\u5386\u4e0e\u63d0\u9192\u4e8b\u9879\u80fd\u529b\uff1b\u654f\u611f\u64cd\u4f5c\u9700\u7528\u6237\u786e\u8ba4\uff0c\u5220\u9664\u64cd\u4f5c\u7ed1\u5b9a\u5df2\u786e\u8ba4\u7684\u5177\u4f53\u6761\u76ee\uff0c\u5e76\u5b8c\u5584\u6388\u6743\u8d85\u65f6\u4e0e\u8bf7\u6c42\u6765\u6e90\u6821\u9a8c (#2820, #2926)\n- \u7edf\u4e00\u4f1a\u8bdd\u64cd\u4f5c\u83dc\u5355\uff0c\u652f\u6301\u79fb\u52a8\u4f1a\u8bdd\u65f6\u65b0\u5efa\u5206\u7c7b\uff0c\u5237\u65b0\u540e\u4fdd\u7559\u5206\u7c7b\u6298\u53e0\u72b6\u6001\uff0c\u5e76\u65b0\u589e Ctrl/Cmd + , \u6253\u5f00\u8bbe\u7f6e\u7684\u5feb\u6377\u952e (#2887, #2896, #2910, #2912)\n- \u652f\u6301\u53d1\u9001\u524d\u9884\u89c8\u5df2\u4e0a\u4f20\u56fe\u7247\u3001\u9884\u89c8\u4ee3\u7801\u6837\u5f0f\u7684\u672c\u5730\u6587\u4ef6\u94fe\u63a5\u4e0e\u5de5\u4f5c\u533a Markdown\uff0c\u5e76\u4f18\u5316\u6d88\u606f\u5f15\u7528\u3001\u6062\u590d\u56de\u590d\u7bad\u5934 (#2885, #2893, #2903, #2908)\n- Runtime \u4e0b\u8f7d\u8f6e\u8be2\u73b0\u5728\u4ec5\u5bf9\u8d85\u7ea7\u7ba1\u7406\u5458\u6309\u9700\u8fd0\u884c\uff1bWindows \u89e3\u538b\u91c7\u7528\u72ec\u7acb\u76ee\u5f55\u5e76\u5728\u7cfb\u7edf tar \u4e0d\u53ef\u7528\u65f6\u56de\u9000\u5230 Node tar\uff0c\u540c\u65f6\u4fee\u590d\u5206\u79bb\u5f0f Hermes Runtime \u7684 Bridge MCP \u5bfc\u5165 (#2925)\n- Coding Agent \u73b0\u5728\u4f1a\u9694\u79bb\u542f\u52a8\u5931\u8d25\u7684 MCP Runtime \u5e76\u6e05\u7406\u5df2\u79fb\u9664\u7684\u670d\u52a1\uff1bStudio \u7ba1\u7406\u7684 MCP \u542f\u52a8\u5668\u660e\u786e\u4f7f\u7528 Node \u6a21\u5f0f\uff0c\u907f\u514d Electron \u8bef\u5f00\u684c\u9762\u7a97\u53e3 (#2888, #2920)\n- Ekko \u73b0\u5728\u53ef\u4ece\u91cd\u590d\u5de5\u5177\u5931\u8d25\u4e2d\u6062\u590d\uff0c\u6539\u5584\u5de5\u5177\u91cd\u8bd5\u4e0e\u5931\u8d25\u5904\u7406 (#2891)\n- \u4fee\u590d\u7a7a\u73af\u5883\u53d8\u91cf\u503c\u8de8\u884c\u8bfb\u53d6\u7684\u95ee\u9898\uff0c\u907f\u514d\u4e0b\u4e00\u884c\u914d\u7f6e\u88ab\u8bef\u5f53\u4f5c\u6a21\u578b\u5730\u5740\u6216\u5bc6\u94a5 (#2884)\n- \u5e94\u7528\u4e0b\u8f7d\u9875\u65b0\u589e\u8d2d\u4e70\u5165\u53e3\uff0c\u5e76\u6839\u636e\u7248\u672c\u6e05\u5355\u4e2d\u7684\u8bbf\u95ee\u6a21\u5f0f\u663e\u793a (#2895)\n\n## What's Changed\n* [coding-agents] isolate failed MCP runtimes and clean up removed servers by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2888\n* fix(ekko): recover from repeated tool failures by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2891\n* feat: add purchase CTA to app download view by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2895\n* fix: preview uploaded images before sending by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2885\n* feat: create categories from the session move menu by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2887\n* fix(chat): use quote icon for message references by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2893\n* feat: add one-time mobile location requests by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2820\n* fix: preserve session category collapse during refresh by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2896\n* feat: add OpenCode coding agent support by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2890\n* Support cloud transport for remote group Agents by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2901\n* fix: update OpenCode icon across Studio by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2902\n* fix: support split Runtime MCP modules in Agent Bridge by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2900\n* fix(runtime): use isolated extraction on Windows by @HML-G in https://github.com/EKKOLearnAI/hermes-studio/pull/2897\n* fix(chat): restore reply arrow for message references by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2903\n* fix(group-chat): preserve remote Agent events and restore summary state by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2904\n* Batch remote group Agent output with ordered acknowledgements by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2911\n* fix: show published Agent images to shared group guests by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2915\n* fix: isolate group Agent connections and restore room membership by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2916\n* fix(desktop): prevent managed MCP launches from reopening Studio by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2917\n* fix(chat): preview code-styled local file links by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2907\n* fix(files): render Markdown in workspace previews by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2908\n* [codex] add Cmd/Ctrl+, settings shortcut by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2910\n* feat(chat): consolidate session actions into a menu by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2912\n* chore(harness): require Node mode for Studio-managed MCP launches by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2920\n* fix(server): stop env parser regex from crossing lines on empty values by @victorwu657 in https://github.com/EKKOLearnAI/hermes-studio/pull/2884\n* fix: stop idle Runtime polling and restrict it to super admins by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2925\n* feat: consolidate mobile calendar and reminder consent support by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2926\n* [codex] align group chat tool folding and mobile layout with single chat by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2927\n* chore: prepare 0.7.18 release by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2930\n\n## New Contributors\n* @Undertone0809 made their first contribution in https://github.com/EKKOLearnAI/hermes-studio/pull/2887\n* @HML-G made their first contribution in https://github.com/EKKOLearnAI/hermes-studio/pull/2897\n* @victorwu657 made their first contribution in https://github.com/EKKOLearnAI/hermes-studio/pull/2884\n\n**Full Changelog**: https://github.com/EKKOLearnAI/hermes-studio/compare/v0.7.17...v0.7.18","mentions_count":5}
