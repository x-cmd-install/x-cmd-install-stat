4fdd\u7559\u6587\u4ef6\u8def\u5f84\u4e2d\u7684\u9996\u5c3e\u7a7a\u683c (#3396)\u3002\n- \u4fee\u590d\u5e26\u7248\u672c\u6807\u8bb0\u7684 Hermes Runtime \u6253\u5305\u517c\u5bb9\u6027 (#3400)\u3002\n- \u65b0\u589e\u968f\u7248\u672c\u53d1\u5e03\u81ea\u52a8\u6784\u5efa\u548c\u6821\u9a8c TOS 7 x86_64 \u6d4b\u8bd5\u5b89\u88c5\u5305\u7684\u6d41\u7a0b (#3397)\u3002\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.36`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8986\u76d6 12 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3399)\u3002\n\n## What's Changed\n* [codex] honor model visibility and warn about large catalogs by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3392\n* [codex] add search to visible model management by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3393\n* [codex] move new-chat category picker into composer toolbar by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3389\n* [codex] add live theme customization and portable theme presets by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3394\n* [codex] build TOS 7 packages automatically on release publication by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3397\n* [codex] fix workflow drawers and chat message themes by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3398\n* [codex] complete Windows drive-root workspace handling without trimming file paths by @wtj-0527 in https://github.com/EKKOLearnAI/ekko-studio/pull/3396\n* [codex] package Hermes releases with install-stamp version identity by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3400\n* [codex] prepare 0.7.36 with 30 MB animated wallpapers by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3399\n* [codex] load full provider model catalogs on demand by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3401\n\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.35...v0.7.36\n","mentions_count":2}
