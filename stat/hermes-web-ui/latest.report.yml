811\u652f\u6301\u65e0\u7559\u767d\u6298\u53e0\uff0c\u4fdd\u7559\u6587\u4ef6\u4e0e\u76ee\u5f55\u72b6\u6001 (#2947, #2965)\n- \u684c\u9762\u7aef\u53ef\u9009\u62e9\u5728\u5185\u7f6e\u6216\u7cfb\u7edf\u6d4f\u89c8\u5668\u6253\u5f00\u7f51\u9875\u94fe\u63a5\uff0c\u5185\u7f6e\u6d4f\u89c8\u5668\u9762\u677f\u7acb\u5373\u5c55\u5f00\uff0c\u65e0\u9700\u7b49\u5f85\u9875\u9762\u52a0\u8f7d\u5b8c\u6210 (#2928, #2956)\n- \u6d4f\u89c8\u5668\u6807\u6ce8\u652f\u6301\u9010\u9879\u5220\u9664\u548c\u64a4\u9500\uff0c\u5e76\u4fee\u590d\u5173\u95ed\u6807\u7b7e\u9875\u6216\u6e05\u7406\u6807\u6ce8\u65f6\u7684\u5f02\u5e38 (#2949, #2944)\n- \u6717\u8bfb\u8df3\u8fc7\u9690\u85cf\u601d\u8003\u5185\u5bb9\u5e76\u4fdd\u7559\u8d1f\u53f7\u3001\u767e\u5206\u53f7\u7b49\u8bed\u4e49\u7b26\u53f7\uff1b\u8c46\u5305 TTS \u652f\u6301 0.5\u20132 \u500d\u8bed\u901f\u5e76\u540c\u6b65\u5f53\u524d\u914d\u7f6e (#2945, #2950, #2978)\n- \u6062\u590d Hermes \u4e0e Ekko \u6280\u80fd\u5217\u8868\u9ed8\u8ba4\u663e\u793a\u7684\u542f\u7528\u548c\u7981\u7528\u5f00\u5173 (#2933)\n- \u914d\u5408\u65b0\u7248 App\uff0c\u65b0\u589e\u804a\u5929\u5ba1\u6279\u3001\u6f84\u6e05\u3001\u4efb\u52a1\u7ed3\u675f\u3001\u7fa4\u804a Agent \u56de\u590d\u548c\u5de5\u4f5c\u6d41\u5b8c\u6210\u6216\u5931\u8d25\u7684\u524d\u53f0\u901a\u77e5\uff0c\u5e76\u4fee\u590d\u65ad\u8fde\u540e\u7684\u4e2d\u7ee7\u6e05\u7406 (#2940, #2946)\n- \u914d\u5408\u65b0\u7248 App\uff0c\u4f1a\u8bdd\u5206\u7c7b\u652f\u6301\u72ec\u7acb\u5206\u9875\u52a0\u8f7d\uff0c\u5e76\u6b63\u786e\u8fd4\u56de\u7f6e\u9876\u7b5b\u9009\u7ed3\u679c\u4e0e\u5206\u7c7b\u603b\u6570 (#2977, #2982)\n- \u5355\u804a\u4e2d\u7ecf\u7528\u6237\u786e\u8ba4\u53ef\u53ea\u8bfb\u83b7\u53d6 iOS \u6b65\u6570\u3001\u7761\u7720\u3001\u5fc3\u7387\u7b49\u5065\u5eb7\u6570\u636e\uff1b\u9700\u517c\u5bb9\u7248\u672c App\uff0c\u6682\u4e0d\u652f\u6301 Android (#2972)\n- \u65b0\u589e Studio \u516c\u544a\u5f39\u7a97\uff0c\u4ec5\u5c55\u793a\u6700\u65b0\u516c\u544a\u5e76\u8bb0\u4f4f\u5173\u95ed\u72b6\u6001\uff0c\u83b7\u53d6\u5931\u8d25\u4e0d\u5f71\u54cd\u4f7f\u7528 (#2989)\n- \u4fee\u590d Codex \u591a\u884c\u914d\u7f6e\u548c Hook \u8868\u7684\u4fdd\u7559\u95ee\u9898\u3001\u91cd\u542f\u914d\u7f6e\u8fc7\u65e9\u8d85\u65f6\uff0c\u4ee5\u53ca Docker \u53ef\u9009\u8865\u4e01\u5931\u8d25\u963b\u585e\u542f\u52a8\u7684\u95ee\u9898 (#2951, #2960, #2969)\n- \u52a0\u5165 Agent \u81ea\u52a8\u66f4\u65b0\u7b56\u7565\u57fa\u7840\u4ee3\u7801\uff1b\u5c1a\u672a\u63a5\u5165\u754c\u9762\u6216\u540e\u53f0\u66f4\u65b0\uff0c\u4e0d\u4f1a\u81ea\u52a8\u5347\u7ea7 Agent (#2923)\n\n## What's Changed\n* feat(desktop): configure Markdown link opening target by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2928\n* Add OpenCode Free provider and keyless Coding Agent proxy by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2932\n* fix: restore skill enable switches by default by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2933\n* feat: add host-scoped Agent update policy foundation by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2923\n* feat: consolidated chat, group and workflow App notification events by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2940\n* fix(desktop): guard browser debugger cleanup by @avatar0813 in https://github.com/EKKOLearnAI/hermes-studio/pull/2944\n* fix(tts): preserve semantic symbols in speech text by @avatar0813 in https://github.com/EKKOLearnAI/hermes-studio/pull/2945\n* fix(desktop): allow deleting and undoing browser annotations by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2949\n* fix: close App relay bridges without requiring acknowledgements by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2946\n* fix(chat): preview file links at referenced lines by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2947\n* fix(chat): skip hidden thinking in speech by @avatar0813 in https://github.com/EKKOLearnAI/hermes-studio/pull/2950\n* feat(ekko): persist task plans and show live progress in chat by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2952\n* feat: rebrand Studio as Ekko Studio and migrate MCP names by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2966\n* [codex] fix MCP-triggered Desktop restart loops and orphaned Web UI startup by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2931\n* fix(profiles): honor bridge timeout on restart by @avatar0813 in https://github.com/EKKOLearnAI/hermes-studio/pull/2951\n* fix(desktop): reveal embedded browser panel before link load by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2956\n* [codex] support per-category session pagination for the App by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2977\n* fix(tts): add Doubao speed control with profile settings sync by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2978\n* fix(docker): keep optional Hermes patches from blocking startup by @lorenzozanee in https://github.com/EKKOLearnAI/hermes-studio/pull/2960\n* fix(chat): keep sidebar working while delegated tasks run by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2961\n* feat(files): add gapless workspace tree collapse by @Undertone0809 in https://github.com/EKKOLearnAI/hermes-studio/pull/2965\n* fix(codex): \u6b63\u786e\u4fdd\u7559\u591a\u884c\u9876\u5c42 TOML \u914d\u7f6e\u503c by @x1051445024 in https://github.com/EKKOLearnAI/hermes-studio/pull/2969\n* fix(desktop): preserve existing profile across Ekko Studio rename by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2979\n* feat(branding): unify Ekko CLI and domains, round desktop icons by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2980\n* style(desktop): reduce Windows icon corner radius to 16% by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2981\n* fix: return total session counts for category pagination by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2982\n* fix(desktop): preserve MCP and Windows startup after Ekko rename by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2988\n* feat: add latest-announcement dialog to Studio by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2989\n* docs: align repository descriptions with Ekko Studio by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2992\n* docs: refresh README with current Ekko Studio screenshots by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2994\n* feat: add mobile health data agent bridge by @wtj-0527 in https://github.com/EKKOLearnAI/hermes-studio/pull/2972\n* fix: send OpenCode session headers from Studio providers by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2996\n* docs: add localized Studio 0.7.19 changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/2998\n* chore: bump Studio and desktop to 0.7.19 by @EKKOLearnAI in https://github.com/EKKOLearnAI/hermes-studio/pull/3000\n\n## New Contributors\n* @avatar0813 made their first contribution in https://github.com/EKKOLearnAI/hermes-studio/pull/2944\n\n**Full Changelog**: https://github.com/EKKOLearnAI/hermes-studio/compare/v0.7.18...v0.7.19\n","mentions_count":6}
