69cdbc04ca8524e85002ecb169af06ee1ff69ff67095dbef3833efab7458c","download_count":1409,"created_at":"2026-10-12T13:53:07Z","updated_at":"2026-10-12T13:53:07Z"},{"id":633911552,"node_id":"RA_kwDOR_sfj84lyLkA","name":"latest.yml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":350,"digest":"sha256:ad2c2923fcce6c50344f614cf0779fec13a2adb40e19bd660bb7102e4db2e86e","download_count":1924,"created_at":"2026-10-12T13:44:19Z","updated_at":"2026-10-12T13:44:19Z"}],"body":"## \u66f4\u65b0\u91cd\u70b9\n\n- \u7f16\u7a0b Agent \u652f\u6301\u5728\u804a\u5929\u3001\u7fa4\u804a\u548c\u5de5\u4f5c\u6d41\u4e2d\u9009\u62e9\u539f\u751f\u6a21\u578b\u4e0e\u63a8\u7406\u5f3a\u5ea6\uff0c\u5e76\u8bb0\u4f4f\u5df2\u9009\u914d\u7f6e (#3354\u3001#3360)\n- \u7edf\u4e00\u6a21\u578b\u9009\u62e9\u5f39\u7a97\uff0c\u6309\u670d\u52a1\u5546\u548c\u6a21\u578b\u5206\u680f\u6d4f\u89c8\uff0c\u6539\u5584\u641c\u7d22\u3001\u6eda\u52a8\u4e0e\u5c0f\u5c4f\u663e\u793a (#3355)\n- \u7528\u91cf\u6982\u89c8\u65b0\u589e\u8d26\u53f7\u548c Profile \u7b5b\u9009\uff0c\u5c55\u793a\u6a21\u578b\u4e0e Agent \u7528\u91cf\u5206\u5e03\uff0c\u5e76\u6539\u5584\u79fb\u52a8\u7aef\u5e03\u5c40 (#3363)\n- \u4fee\u590d\u8d39\u7528\u3001Token \u548c\u767e\u5206\u6bd4\u663e\u793a\u7cbe\u5ea6\uff0c\u4ee5\u53ca\u6eda\u52a8\u65f6\u95f4\u8303\u56f4\u5185\u8d8b\u52bf\u56fe\u4e0e\u6c47\u603b\u6570\u503c\u4e0d\u4e00\u81f4\u7684\u95ee\u9898 (#3373)\n- \u684c\u9762\u7aef\u65b0\u589e\u8fdc\u7a0b\u670d\u52a1\u5668\u6a21\u5f0f\uff0c\u53ef\u8fde\u63a5\u81ea\u884c\u90e8\u7f72\u7684 Web UI\uff0c\u65e0\u9700\u542f\u52a8\u672c\u5730\u670d\u52a1\u4e0e\u5185\u6838 (#3366)\n- \u4fee\u590d Agent \u5361\u7247\u7684\u9f20\u6807\u6eda\u8f6e\u5207\u6362\uff0c\u5e76\u6539\u5584\u5217\u8868\u8fb9\u7f18\u6e10\u9690\u6548\u679c (#3351)\n- \u4fee\u590d\u6a21\u578b\u8f93\u51fa\u672a\u95ed\u5408\u7684\u601d\u8003\u6807\u7b7e\u65f6\uff0c\u601d\u8003\u5185\u5bb9\u6df7\u5165\u804a\u5929\u6b63\u6587\u7684\u95ee\u9898 (#3365)\n- \u4fee\u590d\u4f1a\u8bdd\u5206\u7c7b\u5b50\u83dc\u5355\u5185\u5bb9\u8fc7\u591a\u65f6\u65e0\u6cd5\u6eda\u52a8\u7684\u95ee\u9898 (#3374)\n- \u4fee\u590d\u5185\u7f6e MCP \u8fde\u63a5\u7ee7\u627f\u65e0\u5173\u9274\u6743 Token \u5bfc\u81f4\u7684\u8fde\u63a5\u95ee\u9898 (#3359)\n- \u4fee\u590d\u81ea\u5b9a\u4e49\u670d\u52a1\u5546\u6a21\u578b\u53d1\u73b0\u4fe1\u606f\u88ab\u8bef\u62a5\u4e3a\u672a\u77e5\u914d\u7f6e\uff0c\u5e76\u51cf\u5c11\u91cd\u590d\u8b66\u544a (#3375)\n- Studio \u4e0e\u684c\u9762\u7aef\u7248\u672c\u540c\u6b65\u66f4\u65b0\u4e3a `0.7.34`\uff0c\u524d\u7aef\u66f4\u65b0\u65e5\u5fd7\u8986\u76d6 11 \u79cd\u8bed\u8a00\u5e76\u4fdd\u7559\u6700\u8fd1\u4e09\u4e2a\u7248\u672c (#3376)\n\n## What's Changed\n* docs: refresh v0.7.33 README and product screenshots by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3350\n* [codex] support Agent card wheel scrolling and transparent edge fades by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3351\n* [coding-agents] expose native model discovery through one API by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3354\n* [codex] unify Studio model selection in fixed-height dialogs by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3355\n* fix(mcp): prevent stale inherited tokens in managed transports by @widechaos in https://github.com/EKKOLearnAI/ekko-studio/pull/3359\n* [coding-agents] select native models across chat, groups and workflows by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3360\n* [usage] add account and Profile filters to the overview dashboard by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3363\n* [usage] fix formatting precision and rolling-window chart totals by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3373\n* fix(chat): keep leading unclosed thinking out of replies by @widechaos in https://github.com/EKKOLearnAI/ekko-studio/pull/3365\n* fix(chat): keep category submenus scrollable by @widechaos in https://github.com/EKKOLearnAI/ekko-studio/pull/3374\n* [desktop] add remote server mode for externally deployed Web UI by @onlymykazari in https://github.com/EKKOLearnAI/ekko-studio/pull/3366\n* [codex] accept discovered model markers and deduplicate provider warnings by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3375\n* chore: prepare Studio 0.7.34 with localized changelog by @EKKOLearnAI in https://github.com/EKKOLearnAI/ekko-studio/pull/3376\n\n## New Contributors\n* @widechaos made their first contribution in https://github.com/EKKOLearnAI/ekko-studio/pull/3359\n* @onlymykazari made their first contribution in https://github.com/EKKOLearnAI/ekko-studio/pull/3366\n\n**Full Changelog**: https://github.com/EKKOLearnAI/ekko-studio/compare/v0.7.33...v0.7.34","mentions_count":3}
