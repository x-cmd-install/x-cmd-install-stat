1c54d65d2135f13c68278be12034e6b3e))\n\n### \ud83d\ude9c Refactor\n\n- Replace format! with concat! for string literals ([#83](https://github.com/orhun/flawz/issues/83)) - ([46f74ed](https://github.com/orhun/flawz/commit/46f74ede0177dda0f9e15856b97c581381fe90f7))\n\n### \u2699\ufe0f Miscellaneous Tasks\n\n- *(theme)* Add `catppuccin` theme ([#90](https://github.com/orhun/flawz/issues/90)) - ([92bd253](https://github.com/orhun/flawz/commit/92bd25343cc7cc554a0b206065e4ba1d297e7b30))\n- Update outdated references and Rust edition - ([5dfa582](https://github.com/orhun/flawz/commit/5dfa582e737719b259ee050deefc4b3d429dde97))\n- Ignore typo - ([3b24a29](https://github.com/orhun/flawz/commit/3b24a29367dc4dbd7ecb526d51c94732b9e6722e))\n- Bump dependencies - ([8d62f70](https://github.com/orhun/flawz/commit/8d62f70c5d5a6689920204791d3f9af4079f902a))\n\n## Install flawz 0.4.1\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-installer.ps1 | iex\"\n```\n\n## Download flawz 0.4.1\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [flawz-aarch64-apple-darwin.tar.xz](https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-aarch64-apple-darwin.tar.xz.sha256) |\n| [flawz-x86_64-apple-darwin.tar.xz](https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-x86_64-apple-darwin.tar.xz.sha256) |\n| [flawz-x86_64-pc-windows-msvc.zip](https://github.com/orhun/flawz/releases/download/v0.4.1/flawz-x86_64-pc-windows-msvc.zip)