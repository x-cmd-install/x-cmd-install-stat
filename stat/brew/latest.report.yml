m API metadata by @p-linnane in https://github.com/Homebrew/brew/pull/24302\r\n* Match newlines in tap path regex by @p-linnane in https://github.com/Homebrew/brew/pull/24303\r\n* Warn when the upstream remote isn't `origin` by @HaraldNordgren in https://github.com/Homebrew/brew/pull/24299\r\n* Treat archive filenames literally by @p-linnane in https://github.com/Homebrew/brew/pull/24305\r\n* Keep patches in stable blocks during bumps by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24307\r\n* cask/audit: reject new casks requiring Rosetta by @bevanjkay in https://github.com/Homebrew/brew/pull/24309\r\n* generate-cask-ci-matrix: skip signing on macOS 15 by @bevanjkay in https://github.com/Homebrew/brew/pull/24312\r\n* Fix ZIP volume label specs on macOS 27 by @p-linnane in https://github.com/Homebrew/brew/pull/24313\r\n* Don't flag newer CLT releases as outdated by @p-linnane in https://github.com/Homebrew/brew/pull/24314\r\n* info: remove stale `installed_as_dependency` TODO by @hyuraku in https://github.com/Homebrew/brew/pull/24318\r\n* bundle cleanup: report failed removals by @edel67 in https://github.com/Homebrew/brew/pull/24289\r\n* Require `zap` stanzas in new casks by @bevanjkay in https://github.com/Homebrew/brew/pull/24315\r\n* Prefill `app` and `zap` in `brew create --cask` by @bevanjkay in https://github.com/Homebrew/brew/pull/24316\r\n* Skip unavailable MacPorts website links by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24326\r\n* Sign temporary keg copies before restoring them by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24325\r\n* Bump portable-ruby to 4.0.8 by @brew-commit-app[bot] in https://github.com/Homebrew/brew/pull/24323\r\n* Warn about Git sandbox configuration failures by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24329\r\n* formula: deuniversalize the keg being installed by @zbeekman in https://github.com/Homebrew/brew/pull/24327\r\n* Bump portable-ruby to 4.0.9 by @brew-commit-app[bot] in https://