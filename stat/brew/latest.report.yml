n alias by @hyuraku in https://github.com/Homebrew/brew/pull/24636\r\n* Explain disk image filesystem mount failures by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24643\r\n* Avoid Python lookups for non-PyPI autobumps by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24641\r\n* Compute disk usage without Pathname#find by @krehel in https://github.com/Homebrew/brew/pull/24629\r\n* GithubLatest, GithubReleses: use GraphQL API for basic checks by @samford in https://github.com/Homebrew/brew/pull/24388\r\n* cleanup: test untrusted cache handling by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24634\r\n* Clear cached Caskroom group after specs by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24640\r\n* List commands without building every parser by @krehel in https://github.com/Homebrew/brew/pull/24626\r\n* Speed up brew uses by loading fewer formulae by @krehel in https://github.com/Homebrew/brew/pull/24625\r\n* Build description caches from API data by @krehel in https://github.com/Homebrew/brew/pull/24627\r\n* Reduce RuboCop ABC size to 195 by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24642\r\n* Add Homebrew/SingleUseMethod cop by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24635\r\n* Inline single use methods in commands by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24646\r\n* Inline single use methods in cops and utils by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24648\r\n* Include casks in tap autobump workflow by @wu21-web in https://github.com/Homebrew/brew/pull/24644\r\n* formula_pin: pin kegs under an alias or old name by @hyuraku in https://github.com/Homebrew/brew/pull/24655\r\n* Skip GitHub keychain lookups outside macOS by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24656\r\n* Clean up broken libexec symlinks by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24654\r\n* Inline single use methods in core classes by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24649\r\n* Verify Sigstore bundles without vendored gems by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24645\r\n* Bump portable-ruby to 4.0.9_1 by @brew-commit-app[bot] in https://github.com/Homebrew/brew/pull/24657\r\n* Recommend CLT 26.6 on Apple silicon Tahoe by @p-linnane in https://github.com/Homebrew/brew/pull/24662\r\n* Simplify Homebrew/SingleUseMethod cop by @dduugg in https://github.com/Homebrew/brew/pull/24650\r\n* install, reinstall, upgrade: show the same plan details by @HaraldNordgren in https://github.com/Homebrew/brew/pull/24661\r\n* Load the cask cache in `brew create` by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24666\r\n* Keep prefix libexec optional during cleanup by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24667\r\n* cmd/fetch: fix `--all-platforms` flag with platform-specific casks by @botantony in https://github.com/Homebrew/brew/pull/24659\r\n* Add the simple type assertion cop by @MikeMcQuaid in https://github.com/Homebrew/brew/pull/24668\r\n* patch: hide `patch` output unless verbose by @HaraldNordgren in https://github.com/Homebrew/brew/pull/24679\r\n* Bump portable-ruby to 4.0.10 by @brew-commit-app[bot] in https://github.com/Homebrew/brew/pull/24682\r\n\r\n## New Contributors\r\n* @adrum made their first contribution in https://github.com/Homebrew/brew/pull/24622\r\n* @wu21-web made their first contribution in https://github.com/Homebrew/brew/pull/24644\r\n\r\n**Full Changelog**: https://github.com/Homebrew/brew/compare/7.0.14...7.0.15","reactions":{"total_count":12,"+1":7,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":4,"eyes":0},"mentions_count":12}
