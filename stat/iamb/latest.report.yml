A_kwDOF9b6p84iVSc7","name":"iamb-x86_64-unknown-linux-musl-deb.zip","label":null,"uploader":{"login":"ulyssa","id":71818175,"node_id":"MDQ6VXNlcjcxODE4MTc1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21964008,"digest":"sha256:80c5f39035fd9e95f9855834ff3d644b46f62c7c70aa478b8f361e4a0fd93464","download_count":23,"created_at":"2026-09-20T03:17:15Z","updated_at":"2026-09-20T03:17:16Z"},{"id":576005974,"node_id":"RA_kwDOF9b6p84iVSdW","name":"iamb-x86_64-unknown-linux-musl-rpm.zip","label":null,"uploader":{"login":"ulyssa","id":71818175,"node_id":"MDQ6VXNlcjcxODE4MTc1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":23621908,"digest":"sha256:9e10abb69954ff62a98fa26fb9931a00a639affa27afa0b4495ad09bac2fcf2a","download_count":7,"created_at":"2026-09-20T03:17:16Z","updated_at":"2026-09-20T03:17:17Z"}],"body":"# Features / Improvements \u2728\r\n\r\n- Open `:members` in the same window by default ([#458])\r\n- Render image previews lazily ([#464])\r\n- Support generating shell-completions using `clap_complete` ([#489])\r\n- Support basic sticker viewing ([#502])\r\n- Open Matrix URIs on the command line and support user mentions ([#508])\r\n- MSC4027: Display image reactions ([#518])\r\n- Improve completions ([#520])\r\n- Add config option `set_window_title` ([#528])\r\n- Support login via a configured password file ([#558])\r\n- Support disabling SSL verification ([#565])\r\n- Add `:mentions` window and hopefully finally fix unreads ([#579])\r\n- Support placing encryption indicator in room title instead of prompt ([#581])\r\n- Add configurable cursor shape via `settings.terminal.cursor_shape` ([#587])\r\n- Support media captions ([#592])\r\n- Store event cache in `~/.cache/iamb` ([#596])\r\n- Support manually marking rooms as unread ([#603])\r\n- Improve verifications ([#605])\r\n- Add `input_prompt` configuration option for overriding message bar prompt ([#610])\r\n- Add option to show sender name in extra line ([#613])\r\n- Accessibility: Specify position of invisible/custom cursor ([#614])\r\n- Add `default_split` tunable to control `<C-W>f` split direction ([#620])\r\n- Send messages asynchronously using the SDK's send queue ([#627])\r\n- Allow explicitly controlling when extended keypresses are enabled ([#632])\r\n- Support running room commands in `:members` window and room lists ([#633])\r\n- Show manually marked unread rooms in `:unreads` ([#637])\r\n- Add `\"server\"` field for sorting room lists ([#638])\r\n- Display user's room role in `:members` list ([#639])\r\n- Add support for SOCKS and HTTPS proxying ([#640])\r\n- Support configuring when read marker updates are triggered ([#641])\r\n- Add `default_markup` for configuring message parsing ([#643])\r\n- Image Preview improvements ([#653])\r\n- Support setting per-room user display names ([#654])\r\n- Support upgrading rooms and following tombstone information ([#656])\r\n- Add support for room knocking ([#658])\r\n- Add support for updating user profile information ([#662])\r\n- Add `CursorShape::Auto` ([#665])\r\n- Add ignorecase setting ([#669])\r\n- Support using room aliases and DMs with `:space child set` ([#672])\r\n- Add a `:room access` command for managing join rules ([#673])\r\n- Support room aliases for `:room access set restricted` ([#674])\r\n- Don't force user to join room on `:space child set` ([#675])\r\n- Allow user's to specify a default register for editing ([#683])\r\n- Support implicit read receipts ([#691])\r\n- Use a broken link callback to simplify matrix.to links ([#693])\r\n- Add `default_via` to always tell homeserver how to resolve a room ([#694])\r\n- Support opening location messages with :open ([#695])\r\n- Add `:invites` list ([#703])\r\n- Send read receipts instantly ([#704])\r\n- Add `:verify recover` to verify with a recovery key ([#706])\r\n- Unify the the room list representation ([#708])\r\n- Show a trackbar between the last-read and first-new message ([#709])\r\n- Handle invalid `matrix.to` URLs that look like mentions ([#712])\r\n- Make `:room version upgrade` use `++creator` for additional creators ([#714])\r\n- Support user-defined command aliases ([#715])\r\n\r\n# Documentation / README updates \ud83d\udcda\r\n\r\n- Add several missing options to the `iamb(5)` manual page ([#580])\r\n- Mention `conda-forge` package in README ([#604])\r\n- Fix: Rename `location` to `indicator_location` in example config ([#635])\r\n- Document how to build size-optimized binaries in the README ([#644])\r\n- Document options for user sorting ([#659])\r\n- Fix documentation reference to `settings.users` ([#668])\r\n- Document `:room history` commands in iamb(1) ([#671])\r\n- Clean up minor manual page issues ([#713])\r\n\r\n# Bug Fixes \ud83d\udc1e\r\n\r\n- Show newest edit of messages even after application restart ([#445])\r\n- Show placeholder if replied to message is not loaded and strip fallback reply ([#474])\r\n- Don't wrap messages without `formatted_body` in middle of word ([#486])\r\n- Handle ambiguous display names conforming to spec ([#515])\r\n- Search plaintext body for links to open as fallback ([#573])\r\n- Pretty-print error on application exit ([#595])\r\n- Fix replies for messages in threads ([#648])\r\n- Fix wording of client creation error ([#649])\r\n- Truncate usernames by grapheme instead of word boundaries ([#651])\r\n- Don't consider left users for username disambiguation ([#655])\r\n- Force room names to be fetched in the background when none are cached ([#657])\r\n- Fix crash from value underflow while rendering timeline ([#661])\r\n- Fix image preview position for narrow windows ([#666])\r\n- Use `SlicedProtocol` to render images that are partially off-screen ([#667])\r\n- Fix message bar broken display when :editor yields an empty buffer ([#680])\r\n- Use ASCII characters for encryption status indicators ([#684])\r\n- Remove double tear down of alternate screen ([#687])\r\n- Disable terminal alt screen before opening the external editor ([#688])\r\n- Respect default register setting in scrollback window ([#697])\r\n- Expand '~' and env variables in `:upload` argument ([#702])\r\n- Show intermediate window instead of blocking on `:join` request ([#711])\r\n- Update `:open` and `:download` to also expand `~` ([#716])\r\n- Ensure aliases are registered in definition order ([#718])\r\n- Ensure `gf` goes to room ([#719])\r\n- Simplify implicit receipt tracking and retry failed updates ([#720])\r\n\r\n# Building / Housekeeping \ud83e\uddf9\r\n\r\n- Simplify room creation by using SDK helpers ([#593])\r\n- Improve logging rotation and change default level to `WARN` ([#594])\r\n- Fix build on rustc `1.94.0` ([#599])\r\n- Fix `broken-string-escape` warning when using stricter `.nix` parsers ([#601])\r\n- chore: Update dependencies ([#602])\r\n- Bump MSRV to 1.92 ([#607])\r\n- Fix mdoc(7) warnings in docs/iamb.5 ([#621])\r\n- Update dependencies ([#625])\r\n- Flake improvements ([#630])\r\n- Add shell completions to flake output ([#631])\r\n- Update to use Rust 2024 Edition ([#642])\r\n- Update `Cargo.toml` to `0.0.12-alpha.1` ([#645])\r\n- Workaround `cargo-generate-rpm` issue with pre-release versions ([#646])\r\n- Refactor sticker and image preview ([#652])\r\n- Update `Cargo.toml` to `0.0.12-alpha.2` ([#663])\r\n- Update modalkit{,-ratatui} and ratatui{,-image} ([#664])\r\n- Cleanup imports and create prelude ([#681])\r\n- Fix `cargo doc` warning ([#685])\r\n- Remove `settings.image_preview.lazy_load` and always enable it ([#689])\r\n- Update dependencies ([#699])\r\n\r\n# Contributors \ud83d\ude4f\r\n\r\nMany thanks to @azizsayfiddin, @codegax, @demaledetti, @hanzpo, @kaizoplant, @karazajac, @litlighilit, @maskjelly, @Neo-Oli, @Nightchicken, @pavelzw, @stevenpollack, @TayfurYldz, @TianHengZhuang, @titaniumtraveler, @VAWVAW, @xsa-dev, and @zivarah for their contributions for their release!\r\n\r\n[#445]: https://github.com/ulyssa/iamb/pull/445\r\n[#458]: https://github.com/ulyssa/iamb/pull/458\r\n[#464]: https://github.com/ulyssa/iamb/pull/464\r\n[#474]: https://github.com/ulyssa/iamb/pull/474\r\n[#486]: https://github.com/ulyssa/iamb/pull/486\r\n[#489]: https://github.com/ulyssa/iamb/pull/489\r\n[#502]: https://github.com/ulyssa/iamb/pull/502\r\n[#508]: https://github.com/ulyssa/iamb/pull/508\r\n[#515]: https://github.com/ulyssa/iamb/pull/515\r\n[#518]: https://github.com/ulyssa/iamb/pull/518\r\n[#520]: https://github.com/ulyssa/iamb/pull/520\r\n[#528]: https://github.com/ulyssa/iamb/pull/528\r\n[#558]: https://github.com/ulyssa/iamb/pull/558\r\n[#565]: https://github.com/ulyssa/iamb/pull/565\r\n[#573]: https://github.com/ulyssa/iamb/pull/573\r\n[#579]: https://github.com/ulyssa/iamb/pull/579\r\n[#580]: https://github.com/ulyssa/iamb/pull/580\r\n[#581]: https://github.com/ulyssa/iamb/pull/581\r\n[#587]: https://github.com/ulyssa/iamb/pull/587\r\n[#592]: https://github.com/ulyssa/iamb/pull/592\r\n[#593]: https://github.com/ulyssa/iamb/pull/593\r\n[#594]: https://github.com/ulyssa/iamb/pull/594\r\n[#595]: https://github.com/ulyssa/iamb/pull/595\r\n[#596]: https://github.com/ulyssa/iamb/pull/596\r\n[#599]: https://github.com/ulyssa/iamb/pull/599\r\n[#601]: https://github.com/ulyssa/iamb/pull/601\r\n[#602]: https://github.com/ulyssa/iamb/pull/602\r\n[#603]: https://github.com/ulyssa/iamb/pull/603\r\n[#604]: https://github.com/ulyssa/iamb/pull/604\r\n[#605]: https://github.com/ulyssa/iamb/pull/605\r\n[#607]: https://github.com/ulyssa/iamb/pull/607\r\n[#610]: https://github.com/ulyssa/iamb/pull/610\r\n[#613]: https://github.com/ulyssa/iamb/pull/613\r\n[#614]: https://github.com/ulyssa/iamb/pull/614\r\n[#620]: https://github.com/ulyssa/iamb/pull/620\r\n[#621]: https://github.com/ulyssa/iamb/pull/621\r\n[#625]: https://github.com/ulyssa/iamb/pull/625\r\n[#627]: https://github.com/ulyssa/iamb/pull/627\r\n[#630]: https://github.com/ulyssa/i