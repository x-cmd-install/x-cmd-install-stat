ew_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1830,"digest":"sha256:d2efbdfba953fee2c80f6a35bc8549b8e057780d81f7a895b6fcfd94ba33c5b8","download_count":20,"created_at":"2026-09-10T18:05:04Z","updated_at":"2026-09-10T18:05:04Z"},{"id":555530820,"node_id":"RA_kwDOHy0Bzc4hHLpE","name":"source.tar.gz","label":"","uploader":{"login":"astral-automations-bot[bot]","id":305554984,"node_id":"BOT_kgDOEjZmKA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":13601132,"digest":"sha256:c2e3564246e58954e13d7ca19d56db424de4d2ed7c07108713ff9c5f686e9b9e","download_count":54,"created_at":"2026-09-10T18:05:04Z","updated_at":"2026-09-10T18:05:05Z"},{"id":555530823,"node_id":"RA_kwDOHy0Bzc4hHLpH","name":"source.tar.gz.sha256","label":"","uploader":{"login":"astral-automations-bot[bot]","id":305554984,"node_id":"BOT_kgDOEjZmKA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:445a195f787ddac25148fc530d8047322f00d30684b8e7a8e36c514cb3dcfb97","download_count":40,"created_at":"2026-09-10T18:05:04Z","updated_at":"2026-09-10T18:05:04Z"}],"body":"## Release Notes\n\nReleased on 2026-09-10.\n\n### Preview features\n\n- \\[`ruff`\\] Add rule for default values on method receivers (`RUF077`) ([#26700](https://github.com/astral-sh/ruff/pull/26700))\n- \\[`ruff`\\] Recognize `re.prefixmatch` (`RUF039`, `RUF055`) ([#28311](https://github.com/astral-sh/ruff/pull/28311))\n\n### Bug fixes\n\n- Alternate nested quotes inside format spec interpolations ([#28259](https://github.com/astral-sh/ruff/pull/28259))\n- \\[`flake8-implicit-str-concat`\\] Mark fix unsafe when it creates a docstring (`ISC003`) ([#27981](https://github.com/astral-sh/ruff/pull/27981))\n- \\[`flake8-tidy-imports`\\] Skip fixes for multi-member imports (`TID254`) ([#26584](https://github.com/astral-sh/ruff/pull/26584))\n- \\[`pylint`\\] Gate `ImportCycleError` on Python 3.15 (`PLW0133`) ([#28310](https://github.com/astral-sh/ruff/pull/28310))\n\n### Rule changes\n\n- Correct `D211` and `D203` rule conflict diagnostic ([#28444](https://github.com/astral-sh/ruff/pull/28444))\n- Recognize `slice` and `frozendict` generics ([#28477](https://github.com/astral-sh/ruff/pull/28477))\n- Stop defining `__cached__` for Python 3.15 ([#28476](https://github.com/astral-sh/ruff/pull/28476))\n- \\[`pyupgrade`\\] Stop recommending removed `typing.no_type_check_decorator` (`UP035`) ([#28475](https://github.com/astral-sh/ruff/pull/28475))\n\n### Performance\n\n- Reuse parser name lookups when interning ([#28399](https://github.com/astral-sh/ruff/pull/28399))\n- Speed up inherited configuration resolution ([#28299](https://github.com/astral-sh/ruff/pull/28299))\n\n### Documentation\n\n- Fix `line-length` path in `--config` example ([#28392](https://github.com/astral-sh/ruff/pull/28392))\n- Remove the \"Who\u2019s Using Ruff?\" list ([#28455](https://github.com/astral-sh/ruff/pull/28455))\n\n### Other changes\n\n- Embed archive checksums in the shell installer ([#28281](https://github.com/astral-sh/ruff/pull/28281))\n\n### Contributors\n\n- [@The-Compiler](https://github.com/The-Compiler)\n- [@mdiniz97](https://github.com/mdiniz97)\n- [@zsol](https://github.com/zsol)\n- [@gorewilliams](https://github.com/gorewilliams)\n- [@RafaelJohn9](https://github.com/RafaelJohn9)\n- [@qatcod](https://github.com/qatcod)\n- [@zanieb](https://github.com/zanieb)\n- [@MichaReiser](https://github.com/MichaReiser)\n- [@ntBre](https://github.com/ntBre)\n- [@charliermarsh](https://github.com/charliermarsh)\n- [@nightt5879](https://github.com/nightt5879)\n- [@jonathandung](https://github.com/jonathandung)\n- [@jogo-openai](https://github.com/jogo-openai)\n\n## Install ruff 0.16.7\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-installer.ps1 | iex\"\n```\n\n## Download ruff 0.16.7\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [ruff-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-aarch64-apple-darwin.tar.gz.sha256) |\n| [ruff-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-x86_64-apple-darwin.tar.gz.sha256) |\n| [ruff-aarch64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-aarch64-pc-windows-msvc.zip.sha256) |\n| [ruff-i686-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-i686-pc-windows-msvc.zip.sha256) |\n| [ruff-x86_64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-x86_64-pc-windows-msvc.zip.sha256) |\n| [ruff-aarch64-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.7/ruff-aarch64-unknown-linux-gnu