:"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1830,"digest":"sha256:16ea152f8c5354268c004966adaed9653bc8da16378a618141cec6d08368c9f6","download_count":3581,"created_at":"2026-11-19T15:57:33Z","updated_at":"2026-11-19T15:57:33Z"},{"id":768307399,"node_id":"RA_kwDOHy0Bzc4ty3DH","name":"source.tar.gz","label":"","uploader":{"login":"astral-automations-bot[bot]","id":305554984,"node_id":"BOT_kgDOEjZmKA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":14950076,"digest":"sha256:0378ef60356caaad7b84653691a5d57a1d8b57fd59d173cfc27b0fd4a91a13f3","download_count":66,"created_at":"2026-11-19T15:57:33Z","updated_at":"2026-11-19T15:57:35Z"},{"id":768307397,"node_id":"RA_kwDOHy0Bzc4ty3DF","name":"source.tar.gz.sha256","label":"","uploader":{"login":"astral-automations-bot[bot]","id":305554984,"node_id":"BOT_kgDOEjZmKA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:db683b28eca0eb767314634553f3307c1adf57626718084c300da0e9b14c25f8","download_count":69,"created_at":"2026-11-19T15:57:33Z","updated_at":"2026-11-19T15:57:34Z"}],"body":"## Release Notes\n\nReleased on 2026-11-19.\n\n### Preview features\n\n- \\[`flake8-type-checking`\\] Add a fix for `runtime-string-union` (`TC010`) ([#15635](https://github.com/astral-sh/ruff/pull/15635))\n\n### Bug fixes\n\n- Fix handling of parenthesized duplicate items (`B033`, `RUF068`) ([#30493](https://github.com/astral-sh/ruff/pull/30493))\n- \\[`pyflakes`\\] Fix false negative when a name is assigned more than once (`F823`) ([#30524](https://github.com/astral-sh/ruff/pull/30524))\n- \\[`pylint`\\] Avoid false positive when collection is modified in loop (`PLR1733`, `PLR1736`) ([#30466](https://github.com/astral-sh/ruff/pull/30466))\n- \\[`ruff`\\] Avoid syntax error in `useless-finally` fix for inline `try` bodies (`RUF072`) ([#30349](https://github.com/astral-sh/ruff/pull/30349))\n- Treat relative imports from `.__future__` as ordinary imports ([#30260](https://github.com/astral-sh/ruff/pull/30260))\n\n### Rule changes\n\n- \\[`flake8-simplify`\\] Avoid redundant `bool` wrappers in `SIM208` fixes ([#30457](https://github.com/astral-sh/ruff/pull/30457))\n- \\[`pyflakes`\\] Ignore `__traceback_hide__` in `unused-variable` (`F841`) ([#29600](https://github.com/astral-sh/ruff/pull/29600))\n\n### Performance\n\n- Decode in-memory notebooks directly from their source string ([#30385](https://github.com/astral-sh/ruff/pull/30385))\n- Short-circuit exact qualified-name checks ([#30058](https://github.com/astral-sh/ruff/pull/30058))\n- Stream JSON diagnostics to the output writer ([#30384](https://github.com/astral-sh/ruff/pull/30384))\n\n### Documentation\n\n- Fix the multiline string example in Known Deviations from Black ([#30447](https://github.com/astral-sh/ruff/pull/30447))\n- Include the category in individual rule documentation pages ([#30503](https://github.com/astral-sh/ruff/pull/30503))\n\n### Other changes\n\n- Update Rust toolchain to 1.100 and MSRV to 1.98 ([#30416](https://github.com/astral-sh/ruff/pull/30416))\n\n### Contributors\n\n- [@pseudo-usama](https://github.com/pseudo-usama)\n- [@G26karthik](https://github.com/G26karthik)\n- [@MichaReiser](https://github.com/MichaReiser)\n- [@apathydevil](https://github.com/apathydevil)\n- [@Shivansh-S17](https://github.com/Shivansh-S17)\n- [@charliermarsh](https://github.com/charliermarsh)\n- [@ntBre](https://github.com/ntBre)\n- [@anujdas](https://github.com/anujdas)\n- [@chammika](https://github.com/chammika)\n- [@imryanthedev](https://github.com/imryanthedev)\n- [@Daverball](https://github.com/Daverball)\n\n## Install ruff 0.17.6\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-installer.ps1 | iex\"\n```\n\n## Download ruff 0.17.6\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [ruff-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-aarch64-apple-darwin.tar.gz.sha256) |\n| [ruff-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-x86_64-apple-darwin.tar.gz.sha256) |\n| [ruff-aarch64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-aarch64-pc-windows-msvc.zip.sha256) |\n| [ruff-i686-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-i686-pc-windows-msvc.zip.sha256) |\n| [ruff-x86_64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-x86_64-pc-windows-msvc.zip.sha256) |\n| [ruff-aarch64-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.6/ruff-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [ruff-i686-unk