ions (`PERF401`, `PERF403`) ([#29366](https://github.com/astral-sh/ruff/pull/29366))\n\n### Rule changes\n\n- Treat more `collections` and `weakref` containers as mutable ([#29213](https://github.com/astral-sh/ruff/pull/29213))\n\n### Documentation\n\n- \\[`flake8-import-conventions`\\] Update default and example `aliases` ([#29333](https://github.com/astral-sh/ruff/pull/29333))\n\n### Contributors\n\n- [@fixfon](https://github.com/fixfon)\n- [@mmaxjr](https://github.com/mmaxjr)\n- [@joshuavetos](https://github.com/joshuavetos)\n- [@nekomario28](https://github.com/nekomario28)\n- [@ntBre](https://github.com/ntBre)\n- [@shan3520](https://github.com/shan3520)\n\n## Install ruff 0.17.1\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-installer.ps1 | iex\"\n```\n\n## Download ruff 0.17.1\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [ruff-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-aarch64-apple-darwin.tar.gz.sha256) |\n| [ruff-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-x86_64-apple-darwin.tar.gz.sha256) |\n| [ruff-aarch64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.17.1/ruff-aarch64-pc-windows-msvc.zip.sha256) |