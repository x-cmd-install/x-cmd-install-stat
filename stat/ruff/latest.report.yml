ser_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1830,"digest":"sha256:c66e3b6d11787f73e8775ea8eb6c583a7e12893703d9917e3f67c4da6386387c","download_count":28,"created_at":"2026-09-16T15:56:20Z","updated_at":"2026-09-16T15:56:21Z"},{"id":568294533,"node_id":"RA_kwDOHy0Bzc4h33yF","name":"source.tar.gz","label":"","uploader":{"login":"astral-automations-bot[bot]","id":305554984,"node_id":"BOT_kgDOEjZmKA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":13695015,"digest":"sha256:e30ff9dffc204ba22ea2f3b8dd85d718fd1f49d547101f974186192155967015","download_count":31,"created_at":"2026-09-16T15:56:21Z","updated_at":"2026-09-16T15:56:21Z"},{"id":568294545,"node_id":"RA_kwDOHy0Bzc4h33yR","name":"source.tar.gz.sha256","label":"","uploader":{"login":"astral-automations-bot[bot]","id":305554984,"node_id":"BOT_kgDOEjZmKA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:6055fa1c887b80c56afe9dbfdaa7ebc3cf5ed6ac8b50db63c0afcac7f9c5eaeb","download_count":60,"created_at":"2026-09-16T15:56:21Z","updated_at":"2026-09-16T15:56:21Z"}],"body":"## Release Notes\n\nReleased on 2026-09-16.\n\n### Bug fixes\n\n- Visit functional `TypedDict` keyword arguments correctly ([#28584](https://github.com/astral-sh/ruff/pull/28584))\n- \\[`flake8-simplify`\\] Detect nested `async with` under sync parent (`SIM117`) ([#27821](https://github.com/astral-sh/ruff/pull/27821))\n- \\[`flake8-simplify`\\] Preserve operand order in `SIM109` fix ([#27824](https://github.com/astral-sh/ruff/pull/27824))\n- \\[`pyupgrade`\\] Preserve required parentheses in multiline `UP040` fixes ([#28164](https://github.com/astral-sh/ruff/pull/28164))\n- \\[`pyupgrade`\\] Skip `TypeVarTuple` and `ParamSpec` conversions with bounds or constraints (`UP040`, `UP046`, `UP047`) ([#28505](https://github.com/astral-sh/ruff/pull/28505))\n\n### Rule changes\n\n- Add support for `__lazy_modules__` ([#28459](https://github.com/astral-sh/ruff/pull/28459))\n- Recognize PEP-728 `TypedDict` class keywords ([#28533](https://github.com/astral-sh/ruff/pull/28533))\n- Recognize quoted types in `typing.TypeForm` ([#28507](https://github.com/astral-sh/ruff/pull/28507))\n- Support conditional assignment to `__lazy_modules__` ([#28491](https://github.com/astral-sh/ruff/pull/28491))\n- \\[`flake8-type-checking`\\] Prefer lazy imports over `TYPE_CHECKING` on Python 3.15 and later (`TC001`, `TC002`, `TC003`) ([#28541](https://github.com/astral-sh/ruff/pull/28541))\n- \\[`pyupgrade`\\] Make the fix for `UP040` always unsafe ([#28526](https://github.com/astral-sh/ruff/pull/28526))\n- \\[`pyupgrade`\\] Stop recommending deprecated `ByteString` aliases (`UP035`) ([#28498](https://github.com/astral-sh/ruff/pull/28498))\n- \\[`ruff`, `flake8-use-pathlib`\\] Recognize the `parent_mode` argument (`RUF064`, `PTH103`) ([#28528](https://github.com/astral-sh/ruff/pull/28528))\n- \\[`ruff`\\] Detect `\\Z` in `pytest.raises()` match patterns (`RUF043`) ([#28598](https://github.com/astral-sh/ruff/pull/28598))\n\n### CLI\n\n- Use rule name and code in formatter incompatibility warnings ([#28571](https://github.com/astral-sh/ruff/pull/28571))\n\n### Configuration\n\n- \\[`flake8-tidy-imports`\\] Add `extend-banned-api` ([#28644](https://github.com/astral-sh/ruff/pull/28644))\n\n### Contributors\n\n- [@VedantMadane](https://github.com/VedantMadane)\n- [@alzeph](https://github.com/alzeph)\n- [@charliermarsh](https://github.com/charliermarsh)\n- [@fredrikblau](https://github.com/fredrikblau)\n- [@ntBre](https://github.com/ntBre)\n- [@zsol](https://github.com/zsol)\n- [@Aniket-a14](https://github.com/Aniket-a14)\n- [@r-b-1](https://github.com/r-b-1)\n\n## Install ruff 0.16.8\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-installer.ps1 | iex\"\n```\n\n## Download ruff 0.16.8\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [ruff-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-aarch64-apple-darwin.tar.gz.sha256) |\n| [ruff-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-x86_64-apple-darwin.tar.gz.sha256) |\n| [ruff-aarch64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-aarch64-pc-windows-msvc.zip.sha256) |\n| [ruff-i686-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-i686-pc-windows-msvc.zip.sha256) |\n| [ruff-x86_64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-x86_64-pc-windows-msvc.zip.sha256) |\n| [ruff-aarch64-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.8/ruff-aarch64-unknown-linux-g