digest":"sha256:6694a132cac4bde94b08fa0ea1b24e58bd5553e01ec11965faf9d78140a7f79c","download_count":31,"created_at":"2026-09-03T17:20:11Z","updated_at":"2026-09-03T17:20:11Z"},{"id":543094487,"node_id":"RA_kwDOHy0Bzc4gXvbX","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":13480803,"digest":"sha256:cc00971afa1067767a81b55b53ba54bcf35f747f990a5e146236c407590dff97","download_count":69,"created_at":"2026-09-03T17:20:11Z","updated_at":"2026-09-03T17:20:12Z"},{"id":543094495,"node_id":"RA_kwDOHy0Bzc4gXvbf","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:6694a132cac4bde94b08fa0ea1b24e58bd5553e01ec11965faf9d78140a7f79c","download_count":77,"created_at":"2026-09-03T17:20:12Z","updated_at":"2026-09-03T17:20:12Z"}],"body":"## Release Notes\n\nReleased on 2026-09-03.\n\n### Preview features\n\n- Move `pytest-fixture-autouse` to the `restriction` category ([#28219](https://github.com/astral-sh/ruff/pull/28219))\n- \\[`flake8-pytest-style`\\] Add an autofix for `PT020` ([#27993](https://github.com/astral-sh/ruff/pull/27993))\n- \\[`flake8-tidy-imports`\\] Prevent fix loop between `TID254` and `TID255` ([#28262](https://github.com/astral-sh/ruff/pull/28262))\n- \\[`isort`\\] Exclude pragma comments from line length calculation (`I001`) ([#27313](https://github.com/astral-sh/ruff/pull/27313))\n\n### Bug fixes\n\n- Validate unary expressions when parsing ([#28233](https://github.com/astral-sh/ruff/pull/28233))\n- \\[`flake8-async`, `pylint`\\] Recognize `builtins.open` (`ASYNC230`, `PLW1514`) ([#28021](https://github.com/astral-sh/ruff/pull/28021))\n- \\[`flake8-bugbear`\\] Fix panic on `match` subjects (`B031`) ([#27781](https://github.com/astral-sh/ruff/pull/27781))\n- \\[`flake8-datetimez`\\] Reject `tzinfo=None` for `datetime` bounds (`DTZ901`) ([#28022](https://github.com/astral-sh/ruff/pull/28022))\n- \\[`flake8-pytest-style`\\] Avoid duplicate `PT017` diagnostics ([#27918](https://github.com/astral-sh/ruff/pull/27918))\n- \\[`ruff`\\] Remove `lint.external` hint for Ruff-specific suppressions (`RUF102`) ([#27923](https://github.com/astral-sh/ruff/pull/27923))\n\n### Rule changes\n\n- \\[`flake8-use-pathlib`\\] Add display-only fix for `os.listdir` (`PTH208`) ([#28027](https://github.com/astral-sh/ruff/pull/28027))\n\n### Documentation\n\n- Add another example and glob reference for `lint.per-file-ignores` ([#28106](https://github.com/astral-sh/ruff/pull/28106))\n- Add duplicate work guidance ([#28229](https://github.com/astral-sh/ruff/pull/28229))\n- \\[`flake8-async`\\] Document thread offloading (`ASYNC240`) ([#28008](https://github.com/astral-sh/ruff/pull/28008))\n- \\[`pyupgrade`\\] Clarify default `encoding` argument handling (`UP012`) ([#27315](https://github.com/astral-sh/ruff/pull/27315))\n\n### Other changes\n\n- Allow unary plus in match patterns on Python 3.15 ([#28231](https://github.com/astral-sh/ruff/pull/28231))\n\n### Contributors\n\n- [@flying-sheep](https://github.com/flying-sheep)\n- [@pikammmmm](https://github.com/pikammmmm)\n- [@fly1d](https://github.com/fly1d)\n- [@waterWang](https://github.com/waterWang)\n- [@Pierre-Sassoulas](https://github.com/Pierre-Sassoulas)\n- [@ntBre](https://github.com/ntBre)\n- [@jelle-openai](https://github.com/jelle-openai)\n- [@ericbuehl](https://github.com/ericbuehl)\n- [@tjkuson](https://github.com/tjkuson)\n- [@AbhinavMir](https://github.com/AbhinavMir)\n- [@Whning0513](https://github.com/Whning0513)\n- [@chirizxc](https://github.com/chirizxc)\n\n## Install ruff 0.16.6\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-installer.ps1 | iex\"\n```\n\n## Download ruff 0.16.6\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [ruff-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-aarch64-apple-darwin.tar.gz.sha256) |\n| [ruff-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-x86_64-apple-darwin.tar.gz.sha256) |\n| [ruff-aarch64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-aarch64-pc-windows-msvc.zip.sha256) |\n| [ruff-i686-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-i686-pc-windows-msvc.zip.sha256) |\n| [ruff-x86_64-pc-windows-msvc.zip](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-x86_64-pc-windows-msvc.zip.sha256) |\n| [ruff-aarch64-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/ruff/releases/download/0.16.6/ruff-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://releases.astral.sh/github/ruff/releases/download