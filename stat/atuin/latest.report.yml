loaded","size":81,"digest":"sha256:ef991ee671cd0a11d8ffecf939ded51b26569c498959abaa160a6f6e8bc7b793","download_count":9,"created_at":"2026-11-10T02:35:32Z","updated_at":"2026-11-10T02:35:32Z"}],"body":"## Release Notes\n\n### Bug Fixes\n\n- *(api)* Move to the fixed cowboy, cowlib and grpc_server\n- *(copilot)* Register the hook as exec/args so PowerShell can run it ([#4634](https://github.com/atuinsh/atuin/issues/4634))\n- *(daemon)* Close inherited fds before autostarting, fixing indefinite pty-proxy hang on shell exit ([#4668](https://github.com/atuinsh/atuin/issues/4668))\n- *(daemon)* Don't manage the socket with launchd ([#4669](https://github.com/atuinsh/atuin/issues/4669))\n- *(deps)* Bump rmcp for three advisories, and hold the SQLite one until sqlx allows the fix ([#4690](https://github.com/atuinsh/atuin/issues/4690))\n- *(setup)* Don't warn about uninstalled harnesses ([#4680](https://github.com/atuinsh/atuin/issues/4680))\n- *(threads)* Capture Claude Code shell edits' diffs, and keep the patch of a write that names atuin key ([#4670](https://github.com/atuinsh/atuin/issues/4670))\n- *(threads)* Fix mislabeling of omp child transcripts as Pi ([#4694](https://github.com/atuinsh/atuin/issues/4694))\n- Include workaround for buggy VTE versions ([#4679](https://github.com/atuinsh/atuin/issues/4679))\n\n\n### Features\n\n- *(search)* Support jj workspace filters ([#4457](https://github.com/atuinsh/atuin/issues/4457))\n- *(setup)* Sharper capture and search labels, and give sync its own section ([#4659](https://github.com/atuinsh/atuin/issues/4659))\n\n\n### Miscellaneous Tasks\n\n- Add \"Writing style\" section to AGENTS.md ([#4675](https://github.com/atuinsh/atuin/issues/4675))\n- Prefer `cfg!()` over `#[cfg()]` in AGENTS.md ([#4676](https://github.com/atuinsh/atuin/issues/4676))\n- Prefer `let _ = ...` over `_ = ...` in AGENTS.md ([#4678](https://github.com/atuinsh/atuin/issues/4678))\n\n\n### Refactor\n\n- *(deps)* Bump hyper-util from 0.1.20 to 0.1.21 ([#4626](https://github.com/atuinsh/atuin/issues/4626))\n- *(deps)* Bump unicode-normalization from 0.1.25 to 0.1.26 ([#4686](https://github.com/atuinsh/atuin/issues/4686))\n\n\n### Build\n\n- *(atuin)* Make octavo a default feature, still off at runtime ([#4693](https://github.com/atuinsh/atuin/issues/4693))\n- *(release)* Compile octavo into release artifacts, still off by default ([#4671](https://github.com/atuinsh/atuin/issues/4671))\n\n# atuin 18.24.6\n\n## Install atuin 18.24.6\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-installer.ps1 | iex\"\n```\n\n## Download atuin 18.24.6\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [atuin-aarch64-apple-darwin.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-aarch64-apple-darwin.tar.gz.sha256) |\n| [atuin-x86_64-apple-darwin.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-apple-darwin.tar.gz.sha256) |\n| [atuin-x86_64-pc-windows-msvc.zip](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-pc-windows-msvc.zip.sha256) |\n| [atuin-x86_64-pc-windows-msvc.msi](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-pc-windows-msvc.msi) | x64 Windows | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-pc-windows-msvc.msi.sha256) |\n| [atuin-aarch64-unknown-linux-gnu.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [atuin-x86_64-unknown-linux-gnu.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-unknown-linux-gnu.tar.gz) | x64 Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [atuin-aarch64-unknown-linux-musl.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-aarch64-unknown-linux-musl.tar.gz) | ARM64 MUSL Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-aarch64-unknown-linux-musl.tar.gz.sha256) |\n| [atuin-x86_64-unknown-linux-musl.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-unknown-linux-musl.tar.gz) | x64 MUSL Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-x86_64-unknown-linux-musl.tar.gz.sha256) |\n\n## Verifying GitHub Artifact Attestations\n\nThe artifacts in this release have attestations generated with GitHub Artifact Attestations. These can be verified by using the [GitHub CLI](https://cli.github.com/manual/gh_attestation_verify):\n```sh\ngh attestation verify <file-path of downloaded artifact> --repo atuinsh/atuin\n```\n\nYou can also download the attestation from [GitHub](https://github.com/atuinsh/atuin/attestations) and verify against that directly:\n```sh\ngh attestation verify <file-path of downloaded artifact> --bundle <file-path of downloaded attestation>\n```\n\n# atuin-server 18.24.6\n\n## Install atuin-server 18.24.6\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/atuinsh/atuin/releases/download/v18.24.6/atuin-server-installer.sh | sh\n```