ded","size":81,"digest":"sha256:ce7794d3fe9eb48ea29563bca94e53ad31779d8ca96e5e621856b314ebf459e4","download_count":8,"created_at":"2026-10-30T01:57:11Z","updated_at":"2026-10-30T01:57:11Z"}],"body":"## Release Notes\n\n### Bug Fixes\n\n- *(ai-session)* Keep the objective of an opencode /goal ([#4599](https://github.com/atuinsh/atuin/issues/4599))\n- *(hooks)* Honour CLAUDE_CONFIG_DIR when installing Claude Code hooks ([#4597](https://github.com/atuinsh/atuin/issues/4597))\n- *(threads)* Open pi and omp sessions on the agent's default model ([#4598](https://github.com/atuinsh/atuin/issues/4598))\n- *(threads)* Take `claude` and `claude-code` alike wherever a harness is named ([#4602](https://github.com/atuinsh/atuin/issues/4602))\n- *(threads)* Restore a non-diverged session with no row before its parent ([#4604](https://github.com/atuinsh/atuin/issues/4604))\n\n\n### Features\n\n- *(cli)* Spooky atuin ([#4605](https://github.com/atuinsh/atuin/issues/4605))\n- *(threads)* Capture, search and resume GitHub Copilot CLI sessions ([#4567](https://github.com/atuinsh/atuin/issues/4567))\n- *(threads)* Capture Copilot subagents as child sessions ([#4568](https://github.com/atuinsh/atuin/issues/4568))\n- *(threads)* Write Copilot sessions: restore, catch up, switch, fork, continue ([#4580](https://github.com/atuinsh/atuin/issues/4580))\n- *(threads)* Name the recording host in threads JSON and atuin info ([#4600](https://github.com/atuinsh/atuin/issues/4600))\n- *(server)* Add support for X-Forwarded-For ([#4595](https://github.com/atuinsh/atuin/issues/4595))\n\n# atuin 18.24.4\n\n## Install atuin 18.24.4\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-installer.ps1 | iex\"\n```\n\n## Download atuin 18.24.4\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [atuin-aarch64-apple-darwin.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-aarch64-apple-darwin.tar.gz.sha256) |\n| [atuin-x86_64-apple-darwin.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-apple-darwin.tar.gz.sha256) |\n| [atuin-x86_64-pc-windows-msvc.zip](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-pc-windows-msvc.zip.sha256) |\n| [atuin-x86_64-pc-windows-msvc.msi](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-pc-windows-msvc.msi) | x64 Windows | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-pc-windows-msvc.msi.sha256) |\n| [atuin-aarch64-unknown-linux-gnu.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [atuin-x86_64-unknown-linux-gnu.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-unknown-linux-gnu.tar.gz) | x64 Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [atuin-aarch64-unknown-linux-musl.tar.gz](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-aarch64-unknown-linux-musl.tar.gz) | ARM64 MUSL Linux | [checksum](https://github.com/atuinsh/atuin/releases/download/v18.24.4/atuin-aarch64-unknown-linux-musl.tar