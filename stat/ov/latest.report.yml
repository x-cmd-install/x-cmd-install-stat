inuation (`\u21b5`), and truncation (`\u2026`) markers.\r\n- Added an action to suppress search-result highlighting while preserving the active search.\r\n  - Search highlighting is restored when search navigation resumes.\r\n  - The default key binding is `Ctrl+Alt+u`.\r\n \r\n## Improvements and Fixes\r\n\r\n- Improved word wrapping for long words and multi-line content.\r\n- Improved marker rendering at content boundaries and with narrow terminals.\r\n- Fixed cache invalidation when changing line-number settings in word-wrap mode.\r\n- Improved searching through long and unloaded lines.\r\n- Fixed search highlighting for case-insensitive and quoted-field searches.\r\n- Improved CSV delimiter handling, including delimiters inside quoted fields.\r\n- Fixed alignment and column-width detection for escaped and irregular input.\r\n- Fixed fractional line navigation and section-related write operations.\r\n- Improved terminal width detection and close-operation handling.\r\n\r\n## Compatibility Notes\r\n\r\n- Building from source now requires Go 1.26 or later.\r\n\r\n## Dependencies\r\n\r\n- Updated tcell to v3.5.0.\r\n- Updated clipboard, compression, and related dependencies.\r\n\r\n## New Contributors\r\n\r\n* @VXNCXNX made their first contribution in https://github.com/noborus/ov/pull/1152\r\n* @sabarish-vm made their first contribution in https://github.com/noborus/ov/pull/1181\r\n\r\nThanks for the issue.\r\n\r\n* @stderr-to-devnull https://github.com/noborus/ov/issues/1146\r\n* @danielyli https://github.com/noborus/ov/issues/1164\r\n\r\n**Full Changelog**: https://github.com/noborus/ov/compare/v0.54.0...v0.55.0","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":4}
