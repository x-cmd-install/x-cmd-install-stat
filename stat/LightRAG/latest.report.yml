{"id":446049732,"author":{"login":"danielaskdd","id":36760595,"node_id":"MDQ6VXNlcjM2NzYwNTk1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM6XxNM4ali3E","tag_name":"v1.5.8rc1","target_commitish":"main","name":"v1.5.8rc1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-15T11:14:36Z","updated_at":"2026-11-15T13:03:37Z","published_at":"2026-11-15T13:03:37Z","assets":[],"body":"## Important Notes\r\n\r\n> v1.5.8rc1 is a release candidate. Please test it on a copy of your data before upgrading production.\r\n\r\n### Highlights\r\n\r\n**1. Configuration storage: LightRAG now remembers which embedding model built your vectors**\r\n\r\nIn earlier releases, changing `EMBEDDING_MODEL` or `EMBEDDING_DIM` on an existing deployment failed silently. Depending on the backend, LightRAG either kept the old vectors and returned wrong neighbours, or opened a new, empty vector container (Milvus / Qdrant / PostgreSQL) and served a knowledge graph with no vectors at all.\r\n\r\nv1.5.8 adds a **configuration storage**. It is a small KV namespace (`config`) that holds each workspace's **embedding baselines**: for every vector target (entities, relationships, chunks), the embedding space its vectors were written in. Startup checks the baselines against the current embedding configuration. If the space has changed, the server **refuses to start** and names the target and the way out, instead of serving bad results.\r\n\r\n* **Backends:** `JsonKVStorage`, `PGKVStorage`, `MongoKVStorage` and `OpenSearchKVStorage`, selected with `LIGHTRAG_CONFIG_STORAGE`. Left unset, it follows `LIGHTRAG_KV_STORAGE`, so most deployments need no new setting. `RedisKVStorage` is not admitted, so Redis deployments default to `JsonKVStorage`, with a startup warning.\r\n* **No preparation needed.** On the first start of v1.5.8, an existing deployment records its baselines on its own. A baseline is recorded only on evidence: an **adoption probe** re-embeds a few stored records (up to 8 per target) and compares them with the stored vectors, or the container is confirmed empty. A probe that cannot run (for example, the embedding service is down) records nothing and is retried on the next start.\r\n* **Deployment anchor.** The first start also binds the deployment to the configuration container it opened, in `WORKING_DIR/config_storage_anchor.json` (backend type + container UUID). Every later start refuses a container of another type or another UUID. A changed `LIGHTRAG_KV_STORAGE`, a different database or a replaced volume therefore no longer silently moves your configuration.\r\n* **New offline tools:**\r\n  * `lightrag-rebuild-vdb` re-embeds a workspace with the current model and records the new baselines. This is the way out after an intentional model change.\r\n  * `lightrag-migrate-config` moves the configuration storage to a backend of another type, for example from JSON files to PostgreSQL.\r\n  * `lightrag-clear-storage` clears a workspace offline, configuration records included.\r\n* **Several servers, one `WORKING_DIR`:** supported when each server has its own `WORKSPACE` and port. A second server on the **same** workspace is refused where the filesystem supports file locks.\r\n\r\nFor more information, see:\r\n\r\n- [`docs/LightRAG-API-Server.md`](https://github.com/HKUDS/LightRAG/blob/main/docs/LightRAG-API-Server.md): *Configuration Storage Migration Between Backend Types*\r\n- [`lightrag/tools/README_REBUILD_VDB.md`](https://github.com/HKUDS/LightRAG/blob/main/lightrag/tools/README_REBUILD_VDB.md), [`README_MIGRATE_CONFIG.md`](https://github.com/HKUDS/LightRAG/blob/main/lightrag/tools/README_MIGRATE_CONFIG.md), [`README_CLEAR_STORAGE.md`](https://github.com/HKUDS/LightRAG/blob/main/lightrag/tools/README_CLEAR_STORAGE.md)\r\n- [`docs/design/ConfigurationStorageDesign.md`](https://github.com/HKUDS/LightRAG/blob/main/docs/design/ConfigurationStorageDesign.md): the design overview\r\n\r\n**2. Safer graph writes and document deletion**\r\n\r\n* Manual graph edits (create / edit / delete / merge entities and relations, `insert_custom_kg`) are now serialized against each other and against the ingestion pipeline on `NetworkXStorage`.\r\n* Commit ordering for entity/relation create, edit, merge and rename was reworked to prevent data loss when an operation is interrupted.\r\n* Interrupted document deletions are visible and retryable.\r\n* New `lightrag-repair-chunk-tracking` tool removes orphan chunk-tracking rows left behind by an interrupted deletion.\r\n\r\n**3. PostgreSQL storage defaults**\r\n\r\nThe setup wizard now generates PostgreSQL from the official `pgvector/pgvector` image and offers `PGTableGraphStorage` (plain tables, no Apache AGE) for the graph. `PGGraphStorage` (AGE) and the Redis storages (`RedisKVStorage`, `RedisDocStatusStorage`) are **deprecated**. They keep working and log a warning at startup.\r\n\r\n**4. Security hardening and new provider**\r\n\r\n* The Ollama-compatible `/api/*` routes are protected by `LIGHTRAG_API_KEY` (see *Breaking Changes*).\r\n* PDF extraction runs pypdf in a resource-limited child process.\r\n* Streamed error lines no longer echo raw provider exception text.\r\n* New `openai_responses` LLM binding for the OpenAI Responses API.\r\n\r\n### Breaking Changes\r\n\r\n* **Python 3.11 or later is required.** Python 3.10 is no longer supported. The Docker images (Python 3.12) are not affected.\r\n* **Changing the embedding model on an existing workspace now refuses startup**, where it used to serve wrong or empty results. Either restore the previous `EMBEDDING_MODEL` / `EMBEDDING_DIM`, or run `lightrag-rebuild-vdb` to re-embed with the new model.\r\n* **Changing `LIGHTRAG_KV_STORAGE` after the first v1.5.8 start is refused** while `LIGHTRAG_CONFIG_STORAGE` is unset, because the configuration storage would silently move with it. Either set `LIGHTRAG_CONFIG_STORAGE` to the anchored backend explicitly, or move the configuration with `lightrag-migrate-config`.\r\n* **Ollama routes require the API key.** When `LIGHTRAG_API_KEY` is set and `WHITELIST_PATHS` is unset, `/api/*` requests without the key now get HTTP 403. In Open WebUI, the `lightrag:latest` model disappears from the list. Fix: enter the key as the API key of the Ollama connection (sent as `Authorization: Bearer <key>`), or set `WHITELIST_PATHS=/health,/api/*` to keep the old behaviour.\r\n* **`POST /documents/clear_cache` is removed.** Use `DELETE /documents?clear_llm_cache=true` instead. Clearing the LLM cache now happens together with the destructive clear.\r\n* **Workspace names starting with `$` are reserved.** The server used to serve `WORKSPACE=$team` as `_team`. Set `WORKSPACE=_team` (the name your data is already stored under), and no data moves.\r\n\r\n### Upgrade Notes\r\n\r\n1. **Back up first, then stop every old instance before starting v1.5.8.** That includes all workers, servers sharing the storage, and maintenance tools. The first start creates the configuration container and binds the anchor. Do not do a rolling upgrade that leaves an old writer running.\r\n2. **`WORKING_DIR` must persist, even if every storage is a database.** It now holds `config_storage_anchor.json`, and for JSON configuration also `<workspace>/kv_workspace_config.json`. In Docker, keep it on a mounted volume. In Helm, keep `persistence.enabled: true`. An ephemeral `WORKING_DIR` loses the anchor and the JSON configuration on every restart. Include it in your backups.\r\n3. **The embedding service must be reachable during the first start**, so the adoption probe can record the baselines. Check the startup log for a `WARNING` that a baseline could not be established. If the start refuses with an embedding-space mismatch, your stored vectors do not match the configured model: fix the configuration, or run `lightrag-rebuild-vdb`.\r\n4. **Redis users:** with `LIGHTRAG_KV_STORAGE=RedisKVStorage`, the configuration storage defaults to JSON files in `WORKING_DIR` (see note 2). Redis storage is deprecated; plan a move to PostgreSQL.\r\n5. **`PGGraphStorage` users:** your deployment keeps working, and the wizard keeps the AGE-enabled image for it. To leave AGE, migrate the graph first (`python -m lightrag.tools.migrate_graph_storage --apply`, no re-indexing needed), then switch to `PGTableGraphStorage` and the pgvector image.\r\n6. **Optional:** to keep the configuration in your database instead of JSON files, run `lightrag-migrate-config --target-backend PGKVStorage` (or `MongoKVStorage` / `OpenSearchKVStorage`) with every server stopped. Then set `LIGHTRAG_CONFIG_STORAGE` to that backend.\r\n7. **To start over with a new embedding model**, use `lightrag-clear-storage` rather than deleting files by hand. If you do delete files by hand, also remove `kv_workspace_config.json` and `config_storage_anchor.json`. Otherwise the recorded baseline refuses the new model.\r\n8. **`TOKEN_SECRET`** should be a random value of at least 32 bytes (for example, `openssl rand -hex 32`). The upgraded PyJWT warns about shorter secrets.\r\n9. **Streamed error messages are generic.** A failure in the middle of a stream on `/query/stream`, `/api/generate` or `/api/chat` now reads `Internal server error (error_id: …)`, and no longer contains the LLM provider's exception text. The stream format is unchanged. Look up the details in the server log by that `error_id`. A client that parsed provider error text from the stream (for example, to detect rate limits) needs to be updated.\r\n\r\n## What's New\r\n\r\n* Add optional kg_extraction_validator hook before merge by @yzxcj797 in https://github.com/HKUDS/LightRAG/pull/3700\r\n* feat(storage): add offline chunk tracking repair tool (#3838 R4) by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3859\r\n* feat(api): add delete_parsed_files flag to DELETE /documents by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3851\r\n* feat(k8s): document the single-instance constraint and add a StatefulSet workload switch by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3893\r\n* feat(storage): serialize admin graph writes against each other and the pipeline (#3899) by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3901\r\n* perf(opensearch): refresh the KV index only where a search reads it by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3927\r\n* ♻️ refactor(api): fold the LLM cache clear into the destructive clear by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3926\r\n* perf(mongo): batch edge lookups and index edge endpoints by @AdalbertoDam in https://github.com/HKUDS/LightRAG/pull/3908\r\n* feat: select installed custom chunkers at server startup by @er-s-an in https://github.com/HKUDS/LightRAG/pull/3869\r\n* Add vector-space provenance and embedding-space refusal handling by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3986\r\n* feat(opensearch): refuse an index built by another embedding model, and stay droppable when refusing by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3987\r\n* feat(vdb): embedding-space provenance for MongoDB, FAISS and Nano by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3988\r\n* fix(vdb): a changed embedding space is a typed refusal on Milvus, Qdrant and PostgreSQL by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3989\r\n* feat(config): record each workspace's embedding baselines in a configuration storage by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4011\r\n* refactor(config): configuration storage as its own category, retiring the reserved workspace by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4025\r\n* feat(tools): add lightrag-clear-storage, an offline workspace clear by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4039\r\n* feat(config): anchor each deployment to its configuration container's identity (1/3) by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4065\r\n* feat(tools): lightrag-migrate-config, cross-type offline configuration migration (2/3) by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4066\r\n* feat(setup): report and validate the configuration storage anchor; document it (3/3) by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4067\r\n* chore(storage): warn at startup that Redis storage is deprecated by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4120\r\n* feat(llm): add openai_responses binding for the OpenAI Responses API by @YashvantHange in https://github.com/HKUDS/LightRAG/pull/3701\r\n* feat(parser): allow the docling VLM pipeline via env by @lottshin in https://github.com/HKUDS/LightRAG/pull/4346\r\n* perf(redis): count doc statuses from the sidecar instead of a full scan by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4401\r\n* feat(config): per-workspace JSON configuration snapshots with a root anchor by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4107\r\n* feat: default PostgreSQL to pgvector, deprecate PGGraphStorage (kept for deployments already on it); guide Step 1 covers the configuration storage by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/4409\r\n\r\n## What's Changed\r\n\r\n* fix(anthropic): mark token-limited responses by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3800\r\n* docs: add Indonesian README by @Yoruxyv in https://github.com/HKUDS/LightRAG/pull/3799\r\n* fix(hf): avoid caching truncated responses by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3803\r\n* fix(cache): include system prompt in query cache key by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3802\r\n* docs: slim AGENTS.md by moving four long contracts into dedicated documents by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3814\r\n* chore(deps): bump react-router-dom from 7.18.2 to 7.18.3 in /lightrag_webui in the react group by @dependabot[bot] in https://github.com/HKUDS/LightRAG/pull/3807\r\n* chore(deps): bump lucide-react from 1.33.0 to 1.34.0 in /lightrag_webui in the ui-components group by @dependabot[bot] in https://github.com/HKUDS/LightRAG/pull/3808\r\n* chore(deps-dev): bump the build-tools group in /lightrag_webui with 5 updates by @dependabot[bot] in https://github.com/HKUDS/LightRAG/pull/3809\r\n* chore(deps): bump the content-rendering group across 1 directory with 2 updates by @dependabot[bot] in https://github.com/HKUDS/LightRAG/pull/3810\r\n* chore(deps): bump the frontend-minor-patch group across 1 directory with 5 updates by @dependabot[bot] in https://github.com/HKUDS/LightRAG/pull/3815\r\n* fix(chunker): bound V's sentence-embedding requests by item count by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3816\r\n* fix(webui): confirm document deletion by reading the pipeline level by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3818\r\n* test(utils): cover normalize_rerank_result by @loseintwilight in https://github.com/HKUDS/LightRAG/pull/3813\r\n* fix(lmdeploy): handle truncated responses by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3824\r\n* fix: correct copy-pasted help text for --summary-length-recommended by @simpleqt in https://github.com/HKUDS/LightRAG/pull/3821\r\n* fix: correct typos in operator-visible query logs and comments by @simpleqt in https://github.com/HKUDS/LightRAG/pull/3822\r\n* fix: repair broken relative links in k8s deploy guides and workspace test README by @simpleqt in https://github.com/HKUDS/LightRAG/pull/3819\r\n* Clarify Neo4j URI scheme selection and troubleshooting by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3829\r\n* fix(opensearch): refuse to attach to another workspace's indexes by @danielaskdd in https://github.com/HKUDS/LightRAG/pull/3828\r\n* fix(bedrock): track token usage by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3832\r\n* fix(anthropic): track token usage by @Shizoqua in https://github.com/HKUDS/LightRAG/pull/3825\r\n* fix: align stale docstring parameter names with actual signatures by @simpleqt i