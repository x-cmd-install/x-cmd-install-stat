:"2026-11-11T08:41:16Z"}],"body":"This release includes a major addition in Zellij: Zellij is now also a desktop terminal. To run it: `zellij terminal`. It works on linux, mac and windows.\r\n\r\n**Nothing changes for the normal multiplexer** - Zellij can still run inside another terminal. Both sessions are the same and can be shared.\r\n\r\nPackagers, please see: https://github.com/zellij-org/zellij/blob/main/docs/PACKAGING_DESKTOP.md\r\n\r\nFor a walkthrough of the new features, please see: http://zellij.dev/news/terminal-inbox-session-previews/\r\n\r\nNote: The musl builds do not include the Zellij terminal, please use the gnu builds instead if you want access to it.\r\n\r\nPlease see the CHANGELOG for full details including some breaking changes for plugin developers: https://github.com/zellij-org/zellij/blob/main/CHANGELOG.md\r\n\r\n## Please Support the Zellij Developer ❤️\r\n\r\nZellij is a labor of love and is provided free and open-source to anyone who wishes to use it. Zellij will never display ads or collect your data.\r\n\r\n**In recent months, venture capital supported firms have been moving into this space and using their funding and influence to take it over. Zellij is a community funded project and cannot compete on its own. Now, more than ever, I can use your financial support to help me keep developing this project.**\r\n\r\nTo help sustain the project, please consider a recurring donation so that the developer can pay their bills: [https://github.com/sponsors/imsnif](https://github.com/sponsors/imsnif)","reactions":{"total_count":51,"+1":10,"-1":0,"laugh":0,"hooray":18,"confused":0,"heart":16,"rocket":6,"eyes":1}}
