_count":0,"created_at":"2026-10-25T08:46:09Z","updated_at":"2026-10-25T08:46:09Z"},{"id":674538518,"node_id":"RA_kwDOLznf2c4oNKQW","name":"packemon_Linux_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6358128,"digest":"sha256:37802af1d8e43f5b381633b1ef5c2144720aa5a837790df38b32f87424fd4cc3","download_count":0,"created_at":"2026-10-25T08:46:09Z","updated_at":"2026-10-25T08:46:09Z"}],"body":"## What's Changed\r\n@cluster2600 has fixed a lot of bugs for us🎉! Thank you!\r\n\r\n* Fix failing tests and run go test in CI by @cluster2600 in https://github.com/ddddddO/packemon/pull/296\r\n* Fix panics when showing packet details in Monitor by @cluster2600 in https://github.com/ddddddO/packemon/pull/290\r\n* Fix checksum calculation and IPv4 fragment offset encoding by @cluster2600 in https://github.com/ddddddO/packemon/pull/291\r\n* Fix offset of ICMPv6 Router Solicitation options by @cluster2600 in https://github.com/ddddddO/packemon/pull/292\r\n* Skip nil links in tc.Close and return close errors by @cluster2600 in https://github.com/ddddddO/packemon/pull/294\r\n* Receive frames up to 65536 bytes on Linux by @cluster2600 in https://github.com/ddddddO/packemon/pull/293\r\n* Filter IPv6 frames in TLSv1.2 custom impl for IPv6 on mac/win by @cluster2600 in https://github.com/ddddddO/packemon/pull/295\r\n* Fix/auto calcu by @ddddddO in https://github.com/ddddddO/packemon/pull/300\r\n\r\n\r\n**Full Changelog**: https://github.com/ddddddO/packemon/compare/v1.8.33...v1.8.34","mentions_count":2}
