r.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6014409,"digest":"sha256:b17143631ccd4381705c9e118dd675b209e40ceda4ab6de196a9d7edf558e714","download_count":36,"created_at":"2026-10-06T21:26:27Z","updated_at":"2026-10-06T21:26:28Z"},{"id":616677575,"node_id":"RA_kwDOCN71Oc4kwcDH","name":"onefetch_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":4789700,"digest":"sha256:cba1e74cc8360acbade4e7678f67b02e77c5f428a340568359778a7f65233126","download_count":10,"created_at":"2026-10-06T21:15:02Z","updated_at":"2026-10-06T21:15:03Z"}],"body":"<!-- Release notes generated using configuration in .github/release.yml at main -->\r\n\r\n## What's Changed\r\n\r\n### Breaking Changes\r\nJSON/YAML output (`-o json`, `-o yaml`) now contains raw values instead of display text:\r\n* `creationDate` and `lastChange` are always ISO 8601 timestamps (`\"2018-09-14T18:51:00Z\"`). Previously they were relative text (`\"8 years ago\"`) unless `--iso-time` was passed.\r\n* `repoSize` is a number of bytes (`2161012`) instead of formatted text (`\"2.06 MiB\"`).\r\n* `dependencies` is replaced by `numberOfDependencies` (number) and `manifestType` (`\"Cargo\"`, `\"Npm\"`, `\"PyProject\"`, or `null` when there is no manifest).\r\n\r\n`onefetch-manifest` crate: `ManifestType` has a new `PyProject` variant.\r\n\r\n###  Security Fix\r\n* Fix terminal escape sequence injection through repository data ([CVE-2026-100866](https://www.cve.org/CVERecord?id=CVE-2026-100866)) By @carfeii in https://github.com/o2sh/onefetch/pull/1829\r\n\r\n### New Features\r\n* Add pyproject.toml manifest support (PEP 621) by @ChrisJr404 in https://github.com/o2sh/onefetch/pull/1842\r\n* Update Elixir colors to the official brand color by @georgeguimaraes in https://github.com/o2sh/onefetch/pull/1868\r\n\r\n### Bug Fixes\r\n* Use the default remote for the repository URL by @o2sh in https://github.com/o2sh/onefetch/pull/1873\r\n* Exit with clear error message when repository uses reftable by @Jorge-Polanco-Roque in https://github.com/o2sh/onefetch/pull/1853\r\n\r\n### Chores\r\n* Separate repository info building from styling by @o2sh in https://github.com/o2sh/onefetch/pull/1880\r\n\r\n### CI / CD\r\n* Remove manual homebrew release in favor brew bot auto bump by @o2sh in https://github.com/o2sh/onefetch/commit/81c49b8b1a5cdc52ed0bd14cf6d59a01c4a326fe\r\n\r\n## New Contributors\r\n* @Jorge-Polanco-Roque made their first contribution in https://github.com/o2sh/onefetch/pull/1853\r\n* @georgeguimaraes made their first contribution in https://github.com/o2sh/onefetch/pull/1868\r\n* @ChrisJr404 made their first contribution in https://github.com/o2sh/onefetch/pull/1842\r\n* @carfeii made their first contribution in https://github.com/o2sh/onefetch/pull/1829\r\n\r\n**Full Changelog**: https://github.com/o2sh/onefetch/compare/2.28.1...3.0.0","mentions_count":5}
