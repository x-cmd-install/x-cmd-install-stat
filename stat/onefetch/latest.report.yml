ar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5898455,"digest":"sha256:3b900747d75195fbfdc04cdd6c8f858d72918c67cba178526f26d68ab69f9653","download_count":53,"created_at":"2026-11-21T20:07:10Z","updated_at":"2026-11-21T20:07:10Z"},{"id":776729926,"node_id":"RA_kwDOCN71Oc4uS_VG","name":"onefetch_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":4701080,"digest":"sha256:d707b3cfeb401d670a3d6535e4c456e17d6d95151af4abfed7d330eafeaa907f","download_count":15,"created_at":"2026-11-21T20:07:05Z","updated_at":"2026-11-21T20:07:06Z"}],"body":"## What's Changed\r\n\r\n### Breaking Changes\r\n\r\n- `--no-bots` is replaced by `--ignore-author <REGEX>`. To ignore bots like before, use `--ignore-author '\\[bot\\]'` in https://github.com/o2sh/onefetch/pull/1920\r\n- `--type` is renamed to `--language-types` (`-T` still works) in https://github.com/o2sh/onefetch/pull/1917\r\n- `--exclude` no longer hides files from Churn in https://github.com/o2sh/onefetch/pull/1927\r\n\r\n### New Features\r\n\r\n- Save your options in a config file at `~/.config/onefetch/config.jsonc` in https://github.com/o2sh/onefetch/pull/1917\r\n- Co-authors from `Co-authored-by` trailers now count in Authors and Contributors in https://github.com/o2sh/onefetch/pull/1907\r\n- Add Twig language support in https://github.com/o2sh/onefetch/pull/1928\r\n\r\n### Bug Fixes\r\n\r\n- Ignored authors no longer affect the Created and Last change dates in https://github.com/o2sh/onefetch/pull/1922\r\n\r\n**Full Changelog**: https://github.com/o2sh/onefetch/compare/3.1.0...3.2.0"}
