pe":"application/vnd.android.package-archive","state":"uploaded","size":10049048,"digest":"sha256:4b5c264698ec28d617559fc1ecd98f17839a2a7cf66787cfbdeedae40fe1551d","download_count":21,"created_at":"2026-09-09T09:50:45Z","updated_at":"2026-09-09T09:50:46Z"},{"id":552473035,"node_id":"RA_kwDOHru5Hc4g7hHL","name":"vhs_0.12.0_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":10337183,"digest":"sha256:a56a84dad6bc957422307b96a5c5633636b84d1c7927167f0dab2fb85d5512f2","download_count":7,"created_at":"2026-09-09T09:50:45Z","updated_at":"2026-09-09T09:50:46Z"}],"body":"# Rows \u2019n\u2019 Calls + Some Fixes\r\n\r\nThis release has a nice quality-of-life feature and some bugfixes. Let's check it out.\r\n\r\n## New! `Rows` and `Cols` \r\n\r\nNow you can set the output size the 1980s way: using rows and columns. This is an alternative to using pixels.\r\n\r\n```vhs\r\nOutput examples/settings/columns.gif\r\n\r\nSet Height 400\r\nSet Columns 30\r\nSet FontSize 32\r\n\r\n# A count from 1 to 30, one digit per column, touches the left and\r\n# right edges of the frame exactly with no wrap: 30 columns.\r\nHide\r\nType \"clear; echo 123456789012345678901234567890\"\r\nShow\r\n\r\nSleep 1s\r\nEnter\r\n\r\nSleep 2s\r\n```\r\n\r\n<img src=\"https://media.githubusercontent.com/media/charmbracelet/vhs/main/examples/settings/columns.gif\" width=\"600\">\r\n\r\nSpecial thanks to star contributor and longtime community member @DaltonSW for the feature.\r\n\r\n## Fixed\r\n\r\n* VHS action: fixed in [v2.1.1](https://github.com/charmbracelet/vhs-action/releases/tag/v2.1.1). Make sure to check that out with this VHS version (`v0.12.0`)!\r\n* Windows command console non longer hangs. Enjoy a hang free Windows VHS experience!\r\n\r\nThat's all for now, \r\n\r\nBest of luck,\r\nCharm XX \u2600\ufe0f\r\n\r\n## Changelog\r\n### New!\r\n* f48d79b482296f40b857d555d535d0dc43a70cb0: feat(cli): assume .tape extension in filename arg if omitted (#654) (@DaltonSW)\r\n* f0761c04f6096baf43d8a39f008fe31c0c5c55da: feat: rows/cols for axises (#763) (@DaltonSW)\r\n### Fixed\r\n* 42f1776e6dce45ef3d711118ba799e1cbd385e00: fix(windows): chrome process idle no rendering (#781) (@andrinoff)\r\n* 3294be00fcc19a8f16c3eff994bc0d985cc508db: fix: bump go to 1.26.7 (#784) (@andrinoff)\r\n### Docs\r\n* 0a2c15eab702062a2044816729ba2c356ab47687: docs: fix README grammar (@rohan436)\r\n### Other stuff\r\n* 3546c13f022f7db55fd949b430439bf6af463734: ci: sync dependabot config (#776) (@charmcli)\r\n* 6f0c046e6bcaeada9749e08367b745b5c5cbfd3d: ci: sync golangci-lint config (#723) (@github-actions[bot])\r\n* db96d7374f7d7a3774f69a43f4fcc5c5a1fd74e3: v0.12.0 (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/vhs/releases/download/v0.12.0/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/vhs/releases/download/v0.12.0/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/vhs/releases/download/v0.12.0/checksums.txt'\r\nwget 'https://github.com/charmbracelet/vhs/releases/download/v0.12.0/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":9,"+1":2,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":3,"rocket":0,"eyes":2},"mentions_count":4}
