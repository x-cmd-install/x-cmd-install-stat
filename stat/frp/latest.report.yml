"label":"","uploader":{"login":"fatedier","id":7346661,"node_id":"MDQ6VXNlcjczNDY2NjE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14152383,"digest":"sha256:b90074b2b6a1d792a7a40f085ac6d276bcab2d1bc60201f8a86ca53ce65ce821","download_count":2812,"created_at":"2026-10-14T09:52:43Z","updated_at":"2026-10-14T09:52:44Z"},{"id":639945057,"node_id":"RA_kwDOAuI0Q84mJMlh","name":"frp_0.71.1_windows_arm64.zip","label":"","uploader":{"login":"fatedier","id":7346661,"node_id":"MDQ6VXNlcjczNDY2NjE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12387794,"digest":"sha256:6c25afb4058f7708937db7064836fec593e941de0e6c2c255982335a9b16d370","download_count":191,"created_at":"2026-10-14T09:52:39Z","updated_at":"2026-10-14T09:52:39Z"},{"id":639945062,"node_id":"RA_kwDOAuI0Q84mJMlm","name":"frp_sha256_checksums.txt","label":"","uploader":{"login":"fatedier","id":7346661,"node_id":"MDQ6VXNlcjczNDY2NjE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1645,"digest":"sha256:1f501ae59dffd4db6039d33dacbb23e2625fe44d188fe1ce456466e3386918ff","download_count":614,"created_at":"2026-10-14T09:52:39Z","updated_at":"2026-10-14T09:52:39Z"}],"body":"## Improvements\n\n* Building frp from source now requires Go 1.26.0 or later.\n\n## Fixes\n\n* Updated dependencies to fix SSH tunnel gateway channel deadlocks and panics caused by malformed challenges from NTLM-authenticated HTTP proxies.\n* Fixed VirtualNet routing issues during reconnection and shutdown, and excessive retries after repeated connection failures.\n* Health checks now reset the failure count after success, so `healthCheck.maxFailed` applies to consecutive failures.\n* Fixed control connections getting stuck after message write failures, which could block reconnection.\n* Fixed incorrect daily traffic statistics around daylight-saving transitions and skipped local midnights.\n* Fixed early-data loss in HTTP virtual-host CONNECT tunnels. Requests with a positive content length or transfer encoding now return HTTP 400.\n* Fixed work connections remaining open when server-side bandwidth limiting is enabled for TCP, HTTP, and UDP proxies.\n\n","reactions":{"total_count":5,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
