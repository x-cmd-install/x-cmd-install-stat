/github.com/tdewolff/minify/commit/3d77a26786d8f77a664c4da964ebe0c3067372a0)\r\n- [JS: empty string literal is falsy in conditions,](https://github.com/tdewolff/minify/commit/706a2f6529752c87778aaf717e87ed5756b22b7c) [fixes](https://github.com/tdewolff/minify/commit/706a2f6529752c87778aaf717e87ed5756b22b7c) https://github.com/tdewolff/minify/issues/1065\r\n- [JS: keep Math.trunc(x) instead of x|0,](https://github.com/tdewolff/minify/commit/d77f359ba25503c246a87db254d4dbcfc974a29d) [fixes](https://github.com/tdewolff/minify/commit/d77f359ba25503c246a87db254d4dbcfc974a29d) https://github.com/tdewolff/minify/issues/1077\r\n- [JS: only drop a true/false right operand of && and || when the left side is a boolean, fixes https://github.com/tdewolff/minify/issues/1066](https://github.com/tdewolff/minify/commit/a6aefc75c776fd437f223324b7b83d988616b7f0)\r\n- [JS: keep a backslash escaped when decoding \\u005c and \\u{5c},](https://github.com/tdewolff/minify/commit/f7e15edece2012949f070202784ea7f9ad3d2523) [fixes](https://github.com/tdewolff/minify/commit/f7e15edece2012949f070202784ea7f9ad3d2523) https://github.com/tdewolff/minify/issues/1071\r\n- [JS: drop return when removing a trailing undefined from a comma list, fixes https://github.com/tdewolff/minify/issues/1070](https://github.com/tdewolff/minify/commit/095f793de7dd30393489a010a548c15d4754838a)\r\n- [JS: follow linked variables when checking let/const destructuring dependencies, fixes https://github.com/tdewolff/minify/issues/1068](https://github.com/tdewolff/minify/commit/bf8e15e22347a8c632a56abd55a62427ea3cafe3)\r\n- [JS: keep import attributes (with clause) of import and export statements, fixes https://github.com/tdewolff/minify/issues/786](https://github.com/tdewolff/minify/commit/13905c73d4b3eee50bb225b05311efb1072d8568)\r\n- [JS: keep var destructuring after the variables it reads,](https://github.com/tdewolff/minify/commit/d09fd9dfd1053c9a3bc4233630097c4db3334337) [fixes](https://github.com/tdewolff/minify/commit/d09fd9dfd1053c9a3bc4233630097c4db3334337) https://github.com/tdewolff/minify/issues/1067\r\n- [JS: keep Math.sqrt(x) unless x is a number literal, and skip Math rewrites with spread args](https://github.com/tdewolff/minify/commit/14302a6316df2ab0fdcace984da0d4c026316788)\r\n- [CSS: collapse whitespace in custom property values,](https://github.com/tdewolff/minify/commit/34fa1c012ed3cc584d11703f8a8c209e6a469f2a) [fixes](https://github.com/tdewolff/minify/commit/34fa1c012ed3cc584d11703f8a8c209e6a469f2a) https://github.com/tdewolff/minify/issues/740\r\n- [JS: keep Math.abs(x) instead of x<0?-x:x](https://github.com/tdewolff/minify/commit/d7784f80d4467fd1ab29517dec465d75a7894d8b)\r\n- [JS: fix member access on grouped number literals](https://github.com/tdewolff/minify/commit/e7e6f2bbd2e2f62500c79246dda01a9cbbae22b3)\r\n- [HTML: fix passing escape-html for any script tag, regardless whether content type is set\r\n](https://github.com/tdewolff/minify/commit/615396c79bb0de04213f9d62945b729d464ed3d0)\r\n\r\nThanks to @bardrop and @max-moser for the PRs!","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
