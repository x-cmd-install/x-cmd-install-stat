ownload_count":136,"created_at":"2026-11-20T13:36:18Z","updated_at":"2026-11-20T13:36:20Z"},{"id":771956904,"node_id":"RA_kwDOCEU65s4uAyCo","name":"duckdb-static-libs-windows-arm64.tar.gz","label":"","uploader":{"login":"hannes","id":227792,"node_id":"MDQ6VXNlcjIyNzc5Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":48952888,"digest":"sha256:e4804c699d6d1d693e0e42c6af4cd0ec7ab9617bc05609acde3aa3ebf252c652","download_count":87,"created_at":"2026-11-20T13:36:21Z","updated_at":"2026-11-20T13:36:24Z"},{"id":771957062,"node_id":"RA_kwDOCEU65s4uAyFG","name":"duckdb-static-libs-windows-mingw.tar.gz","label":"","uploader":{"login":"hannes","id":227792,"node_id":"MDQ6VXNlcjIyNzc5Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":35649717,"digest":"sha256:99a432db9e0edca8ddde279747f3dbd56605492f5a5d7eca879525a4c68f772c","download_count":32,"created_at":"2026-11-20T13:36:24Z","updated_at":"2026-11-20T13:36:26Z"},{"id":771957177,"node_id":"RA_kwDOCEU65s4uAyG5","name":"libduckdb-src.zip","label":"","uploader":{"login":"hannes","id":227792,"node_id":"MDQ6VXNlcjIyNzc5Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":185183,"digest":"sha256:22627d9f8fb1c49c3374db8b8c4d8e2ffd186720057ba58aad1a7aaaf78c98f4","download_count":64,"created_at":"2026-11-20T13:36:26Z","updated_at":"2026-11-20T13:36:27Z"}],"body":"This is a bug fix release for various issues discovered after we released v2.0.0.\r\n\r\nPlease also refer to the announcement blog post: https://duckdb.org/2026/11/20/announcing-duckdb-201.html\r\n\r\n## What's Changed\r\n* Merge Rust extension CI groups by @smvv in https://github.com/duckdb/duckdb/pull/27600\r\n* Print the profiler's trailing blank line through the renderer's print sink by @h4nsmuller in https://github.com/duckdb/duckdb/pull/27604\r\n* Fix StagedUpload.yml by @lnkuiper in https://github.com/duckdb/duckdb/pull/27610\r\n* Fix StagedUpload.yml by @lnkuiper in https://github.com/duckdb/duckdb/pull/27612\r\n* Run more release checks on non-main branch by @smvv in https://github.com/duckdb/duckdb/pull/27548\r\n* Fix appending chunks larger than the vector size that need a cast by @iremcaginyurtturk in https://github.com/duckdb/duckdb/pull/27665\r\n* Backport labeled fixes to v2.0-cyanoptera by @smvv in https://github.com/duckdb/duckdb/pull/27684\r\n* Compare ANY and ALL of ARRAY(SELECT ...) against the elements of the list by @Robinho-MR in https://github.com/duckdb/duckdb/pull/27781\r\n* Parquet writer: keep a column's min/max in RETURN_STATS when a row group holds only NULLs for it by @h4nsmuller in https://github.com/duckdb/duckdb/pull/27875\r\n* Add casts from TIMESTAMPTZ_NS to TIMESTAMP by @kdmodii in https://github.com/duckdb/duckdb/pull/27928\r\n* Add a parquet_can_have_nan setting as the default for the can_have_nan option by @kdmodii in https://github.com/duckdb/duckdb/pull/27969\r\n* [v2.0-cyanoptera] Backport labeled fixes through #27935 by @smvv in https://github.com/duckdb/duckdb/pull/27965\r\n* [AUTOMATED_EDIT] Add v2.0.1 to version_map.json by @maiadegraaf in https://github.com/duckdb/duckdb/pull/28020\r\n* [v2.0-cyanoptera] Backport merged labeled fixes by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28072\r\n* Treat error() as non-volatile when deciding duplicate elimination in decorrelation by @EtgarDev in https://github.com/duckdb/duckdb/pull/28125\r\n* Cyanoptera revert unmerged by @carlopi in https://github.com/duckdb/duckdb/pull/28247\r\n* [v2.0-cyanoptera] Backport #28129: free a segment's buffer once its data is copied into a partial block by @ywelsch in https://github.com/duckdb/duckdb/pull/28139\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (2) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28290\r\n* Keep the incoming join order as a candidate in greedy join ordering by @DinosL in https://github.com/duckdb/duckdb/pull/28362\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (3) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28396\r\n* Link Wasm extensions against vcpkg_installed/${VCPKG_TARGET_TRIPLET}, on cyanoptera by @carlopi in https://github.com/duckdb/duckdb/pull/28545\r\n* Bump aws to c2f2568 (name + resolve callbacks for both resource types), on cyanoptera by @carlopi in https://github.com/duckdb/duckdb/pull/28519\r\n* [Testing] Fix problems with error logging for certain error paths by @Tishj in https://github.com/duckdb/duckdb/pull/28577\r\n* [v2.0-cyanoptera] Backport #27943: size partitioned COPY batches from the written columns by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28589\r\n* Look up the columns of a multi-file scan by name through an index when reading their statistics by @h4nsmuller in https://github.com/duckdb/duckdb/pull/28638\r\n* Update Postgres, MySQL and SQLite (2.0.1) by @staticlibs in https://github.com/duckdb/duckdb/pull/28575\r\n* [v2.0-cyanoptera] Bump avro to b7b157f50dd0 by @autograaf in https://github.com/duckdb/duckdb/pull/28657\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (4) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28602\r\n* Backport 28373 28427 by @Tmonster in https://github.com/duckdb/duckdb/pull/28733\r\n* bump iceberg and glue by @Tmonster in https://github.com/duckdb/duckdb/pull/28459\r\n* [v2.0-cyanoptera] Bump spatial by @autograaf in https://github.com/duckdb/duckdb/pull/28644\r\n* chore: pin delta, unity_catalog and azure for the v2.0.1 patch release by @benfleis in https://github.com/duckdb/duckdb/pull/28699\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (5) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28710\r\n* [v2.0-cyanoptera] Bump vortex to 89091fc7 and enable it on Windows by @autograaf in https://github.com/duckdb/duckdb/pull/28705\r\n* [Secrets] Redact the `refresh_info` in safe mode by @Tishj in https://github.com/duckdb/duckdb/pull/28679\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (6) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28746\r\n* reenable iceberg tests by @Tmonster in https://github.com/duckdb/duckdb/pull/28762\r\n* CREATE EXTENSION REPOSITORY <host>: the host names its repository (#28719) by @carlopi in https://github.com/duckdb/duckdb/pull/28805\r\n* [v2.0] Backport Vortex build fix by @lnkuiper in https://github.com/duckdb/duckdb/pull/28868\r\n* [v2.0] Bump httpfs for S3 throttling and per-file credentials by @lnkuiper in https://github.com/duckdb/duckdb/pull/28863\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (7) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28812\r\n* [v2.0-cyanoptera] Fix preparation and Summary runner selection by @smvv in https://github.com/duckdb/duckdb/pull/28919\r\n* Bump avro, remove wasm patch by @carlopi in https://github.com/duckdb/duckdb/pull/28911\r\n* Bump aws, remove patches, fixup autoload, build for wasm, on cyanoptera by @carlopi in https://github.com/duckdb/duckdb/pull/28854\r\n* List glue and legacy_parser among the default extensions, let glue autoload (backport #28820) by @carlopi in https://github.com/duckdb/duckdb/pull/28918\r\n* Bump glue, remove patch, and enable for wasm, on cyanoptera by @carlopi in https://github.com/duckdb/duckdb/pull/28855\r\n* Keep the loaded-copy extension test path under Windows MAX_PATH (#28783) by @carlopi in https://github.com/duckdb/duckdb/pull/28921\r\n* Bump azure to bf93a0a by @benomatic42 in https://github.com/duckdb/duckdb/pull/28816\r\n* [v2.0-cyanoptera] Bump Quack and remove upstreamed patch by @sebastiaan-dev in https://github.com/duckdb/duckdb/pull/28964\r\n* [v2.0-cyanoptera] Backport merged labeled fixes (8) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/28978\r\n* bump glue by @Tmonster in https://github.com/duckdb/duckdb/pull/28980\r\n* chore: update Sirius loader revision by @mbrobbel in https://github.com/duckdb/duckdb/pull/28835\r\n* Revert \"Refuse CREATE SECRET when enable_external_access is false\" by @Robinho-MR in https://github.com/duckdb/duckdb/pull/29007\r\n* Bump ducklake to latest v2.0-cyanoptera by @autograaf in https://github.com/duckdb/duckdb/pull/28959\r\n* [v2.0] Preserve row mappings in runtime filters by @lnkuiper in https://github.com/duckdb/duckdb/pull/29019\r\n* [v2.0-cyanoptera] Bump fts and iceberg by @maiadegraaf in https://github.com/duckdb/duckdb/pull/28975\r\n* [v2.0] Bump aws, remove patch, fix external resources naming by @carlopi in https://github.com/duckdb/duckdb/pull/29026\r\n* [v2.0] Bump mysql to e04d8eef94c94e70c5d5663895610b1bb475d506 by @carlopi in https://github.com/duckdb/duckdb/pull/29028\r\n* [v2.0] Bump aws by @carlopi in https://github.com/duckdb/duckdb/pull/29046\r\n* [v2.0-cyanoptera] External resource type dotted (#28996, with #28749) by @Robinho-MR in https://github.com/duckdb/duckdb/pull/29056\r\n* [v2.0-cyanoptera] Install LLVM 22 for the Windows ARM64 build by @Robinho-MR in https://github.com/duckdb/duckdb/pull/29064\r\n* [v2.0] Export only the entrypoint from C API loadable extensions by @Robinho-MR in https://github.com/duckdb/duckdb/pull/29057\r\n\r\n**Full Changelog**: https://github.com/duckdb/duckdb/compare/v2.0.0...v2.0.1","reactions":{"total_count":31,"+1":14,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":4,"rocket":7,"eyes":0},"mentions_count":19}
