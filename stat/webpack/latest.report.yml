ebpack's own JavaScript parser. (by [@alexander-akait](https://github.com/alexander-akait) in [#22042](https://github.com/webpack/webpack/pull/22042))\n\n- Name HTML chunks after their tags' urls, drop the JS copy, type `text/html`. (by [@alexander-akait](https://github.com/alexander-akait) in [#22008](https://github.com/webpack/webpack/pull/22008))"}
