":15895937,"digest":"sha256:9ddcf12e6a70c73525783a7db31b7261a612215e47dcedec2e94d72260aa2648","download_count":82,"created_at":"2026-11-22T01:52:20Z","updated_at":"2026-11-22T01:52:21Z"},{"id":777520841,"node_id":"RA_kwDOQ1mH3c4uWAbJ","name":"headroom_ai-0.45.0.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":3645403,"digest":"sha256:98702fcc5dae57592d71166aed035b2269e1875863febfca8a2a1fae8bae8e9d","download_count":38,"created_at":"2026-11-22T01:52:22Z","updated_at":"2026-11-22T01:52:22Z"}],"body":"## [0.45.0](https://github.com/headroomlabs-ai/headroom/compare/v0.44.0...v0.45.0) (2026-11-22)\n\n\n### Features\n\n* **opencode:** add repeatable --extra-model flag for custom wrap-time models ([#2364](https://github.com/headroomlabs-ai/headroom/issues/2364)) ([66e0086](https://github.com/headroomlabs-ai/headroom/commit/66e0086952d4b311c9fe9b489fbd12d1d270fcde))\n* **savings:** book modelled output savings per request, as a token and dollar range ([#4878](https://github.com/headroomlabs-ai/headroom/issues/4878)) ([00436a8](https://github.com/headroomlabs-ai/headroom/commit/00436a8b11b69f19e280ba0ce3f54f50094e4a5e))\n* **shaper:** let an extension replace a level's steering text; default to L3 ([#4877](https://github.com/headroomlabs-ai/headroom/issues/4877)) ([a3afd43](https://github.com/headroomlabs-ai/headroom/commit/a3afd43e0cbd3ed4b2186419bcc8ac447d110e39))\n* **telemetry:** split beacon sessions by harness, model and day ([#4881](https://github.com/headroomlabs-ai/headroom/issues/4881)) ([ac932eb](https://github.com/headroomlabs-ai/headroom/commit/ac932eb7c43156e94088d21e6c1edf3dc14b233b))\n* **tray:** opt-in system tray icon with savings counter, dashboard and update alert ([#4726](https://github.com/headroomlabs-ai/headroom/issues/4726)) ([e9301f3](https://github.com/headroomlabs-ai/headroom/commit/e9301f34c1296c1f1290ed590fe02cbfd991e3c1))\n\n\n### Bug Fixes\n\n* **benchmarks:** drop the duplicate protect_recent=0 table from the proof harness ([#4754](https://github.com/headroomlabs-ai/headroom/issues/4754)) ([a385ea8](https://github.com/headroomlabs-ai/headroom/commit/a385ea8e60a14c1511d82b21d518421af35deab2))\n* **benchmarks:** refuse a dirty or non-git --worktree in codemode_ab ([#4736](https://github.com/headroomlabs-ai/headroom/issues/4736)) ([6b7b635](https://github.com/headroomlabs-ai/headroom/commit/6b7b6358d526a833631798ea1b073e941775d89f))\n* **binaries:** ignore tool binaries found via the current directory ([#4838](https://github.com/headroomlabs-ai/headroom/issues/4838)) ([7a0f15f](https://github.com/headroomlabs-ai/headroom/commit/7a0f15f563d8a74e5496435c9f61fba9d72f3a0b))\n* **cache:** exclude cold starts from TTL hit evidence ([#4728](https://github.com/headroomlabs-ai/headroom/issues/4728)) ([93df7ae](https://github.com/headroomlabs-ai/headroom/commit/93df7ae4f725da790823084dca0a8ab6467bfcfe))\n* **cache:** preserve complete CCR hashes across restarts ([#4820](https://github.com/headroomlabs-ai/headroom/issues/4820)) ([e27f0d9](https://github.com/headroomlabs-ai/headroom/commit/e27f0d96cc3032d5f2c510ac97545553b867a697))\n* **cache:** replay every parallel tool result ([#4818](https://github.com/headroomlabs-ai/headroom/issues/4818)) ([973c12d](https://github.com/headroomlabs-ai/headroom/commit/973c12d2af9cc6a9b021516d0c92edee12c10ecb))\n* **cache:** scope learned TTL cache to its source file ([#4727](https://github.com/headroomlabs-ai/headroom/issues/4727)) ([acb58a0](https://github.com/headroomlabs-ai/headroom/commit/acb58a0c00c9972abb7044b6ff3aa1b4cfed8e64))\n* **ccr:** send batch continuations to the upstream the batch was submitted to ([#4848](https://github.com/headroomlabs-ai/headroom/issues/4848)) ([5f82080](https://github.com/headroomlabs-ai/headroom/commit/5f82080329b41fa5dd556ed9c873d7d313f1a4f0))\n* **ci:** keep alert rule and location out of the public CodeQL triage issue ([#4863](https://github.com/headroomlabs-ai/headroom/issues/4863)) ([047aadd](https://github.com/headroomlabs-ai/headroom/commit/047aadde868d38e27b5d6bc2d99dd21362fa0d53))\n* **ci:** verify installer provenance in build workflows ([#4677](https://github.com/headroomlabs-ai/headroom/issues/4677)) ([b235bc2](https://github.com/headroomlabs-ai/headroom/commit/b235bc2d27f0b15b2c5a364f853d52ab0b3ea003))\n* **compression:** bound the JSON-block and truncation-banner scans ([#4845](https://github.com/headroomlabs-ai/headroom/issues/4845)) ([bae62bc](https://github.com/headroomlabs-ai/headroom/commit/bae62bc87ba593df74f6a6109dc2317ba71b3216))\n* **compress:** stop adding markers the caller did not ask for ([#4678](https://github.com/headroomlabs-ai/headroom/issues/4678)) ([c21b081](https://github.com/headroomlabs-ai/headroom/commit/c21b0813bd1b041b1e3ca1d55a07a9498e61f181))\n* **content-router:** keep list-form tool_result text blocks on separate lines ([#4739](https://github.com/headroomlabs-ai/headroom/issues/4739)) ([f4e3ad4](https://github.com/headroomlabs-ai/headroom/commit/f4e3ad4b1168755ccb27bd151b684ee65cf2d86f))\n* **content-router:** protect cache_control markers nested in tool_result content ([#4898](https://github.com/headroomlabs-ai/headroom/issues/4898)) ([18067b1](https://github.com/headroomlabs-ai/headroom/commit/18067b1d19f6606bae3b4d6b50efeeaa48dc477e))\n* **copilot:** keep new VS Code chats on the Local harness so they reach the proxy ([#4899](https://github.com/headroomlabs-ai/headroom/issues/4899)) ([0d203db](https://github.com/headroomlabs-ai/headroom/commit/0d203db6b814e62773bb08aa79f0c036ab9323af))\n* **deps:** move the wrap E2E harness to npm 12.2.2 and drop the fixed audit exceptions ([#4778](https://github.com/headroomlabs-ai/headroom/issues/4778)) ([f6fbac3](https://github.com/headroomlabs-ai/headroom/commit/f6fbac3a4975f62a296656fb15f1d3e72270c445))\n* **deps:** patch quinn-udp, rustix and opentelemetry-api advisories ([#4835](https://github.com/headroomlabs-ai/headroom/issues/4835)) ([0368a87](https://github.com/headroomlabs-ai/headroom/commit/0368a872cdd5064b39888e13847200ff562ac192))\n* **examples:** keep the macos launchagent running when reinstall is declined ([#4734](https://github.com/headroomlabs-ai/headroom/issues/4734)) ([02a2b56](https://github.com/headroomlabs-ai/headroom/commit/02a2b568d4526724c3d8a0a098c7fb601c6c9fbe))\n* **examples:** validate the macos launchagent port as plain decimal ([#4733](https://github.com/headroomlabs-ai/headroom/issues/4733)) ([a91c48a](https://github.com/headroomlabs-ai/headroom/commit/a91c48a3a4f89bd3892b5db9d08c0697e1a356ca))\n* **gemini:** apply the request rate limit to Cloud Code and countTokens ([#4862](https://github.com/headroomlabs-ai/headroom/issues/4862)) ([c2292ed](https://github.com/headroomlabs-ai/headroom/commit/c2292ed0c64679e4a67cccb096a93873c940032c))\n* **kompress:** honour toin_read_only in the Kompress CCR store ([#4895](https://github.com/headroomlabs-ai/headroom/issues/4895)) ([8da7e17](https://github.com/headroomlabs-ai/headroom/commit/8da7e17e4e1c3636031fd9ee25cb061a317419c9))\n* **learn:** only fold real linked worktrees into their main checkout ([#4839](https://github.com/headroomlabs-ai/headroom/issues/4839)) ([d2fb350](https://github.com/headroomlabs-ai/headroom/commit/d2fb350a3445d860e86f52739b5adfb24e73666c))\n* **learn:** render non-string Bash commands without raising ([#4826](https://github.com/headroomlabs-ai/headroom/issues/4826)) ([cfdeb1c](https://github.com/headroomlabs-ai/headroom/commit/cfdeb1c4667edb1caa923bf0b8cfa4fd994c5c76))\n* **lossless:** never grep-fold Go, nginx, klog or access-log timestamps ([#4901](https://github.com/headroomlabs-ai/headroom/issues/4901)) ([cf32846](https://github.com/headroomlabs-ai/headroom/commit/cf3284675eade1f4cee3358932d9c2f72562253f))\n* **lossless:** never grep-fold Ruby Logger timestamps ([#4907](https://github.com