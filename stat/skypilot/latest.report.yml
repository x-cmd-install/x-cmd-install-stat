{"id":393375357,"author":{"login":"Michaelvll","id":6753189,"node_id":"MDQ6VXNlcjY3NTMxODk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOF41eh84Xcm59","tag_name":"v0.14.0rc1","target_commitish":"50b6c29da15bdeb7bdfd7540b0bb595f9661f2f0","name":"Release v0.14.0rc1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-22T00:19:47Z","updated_at":"2026-09-23T00:43:54Z","published_at":"2026-09-22T23:35:09Z","assets":[],"body":"## SkyPilot v0.14.0rc1\r\n\r\nGet it now with:\r\n\r\n```bash\r\nuv pip install \"skypilot>=0.14.0rc1\"\r\n```\r\n\r\n---\r\n\r\n## What's Changed\r\n* [Kubernetes] Display actual pod resource requests when they diverge from the resource spec by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10214\r\n* [Jobs] Reset transient job-status-check window after recovery by @spiffaz in https://github.com/skypilot-org/skypilot/pull/10156\r\n* [Dashboard] Restyle the YAML editor's search panel by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10208\r\n* [Dashboard] Fix top-bar logo vertical alignment by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10207\r\n* [Jobs] Fail jobs terminally when their pool no longer exists by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10203\r\n* [Kubernetes] Fail provisioning on persistent volume mount failures instead of hanging by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10218\r\n* [Test] okta smoke: don't gate login success on the in-app dashboard redirect by @zpoint in https://github.com/skypilot-org/skypilot/pull/10188\r\n* [Dashboard] Make the settings config editor card plugin-replaceable by @ishankaul1 in https://github.com/skypilot-org/skypilot/pull/10158\r\n* [Dashboard] Use dark circular favicon for better tab visibility by @hopechong in https://github.com/skypilot-org/skypilot/pull/10215\r\n* [Dashboard] Rework infra page: unified table, per-GPU-type summary, responsive by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10067\r\n* [Test] Cover more documented env vars in managed jobs env smoke test by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10224\r\n* [Kubernetes] Don't install conda by default and remove it from K8s images by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10132\r\n* [Core] Handle missing Git during commit metadata collection by @edmsimplicio in https://github.com/skypilot-org/skypilot/pull/10230\r\n* [RunPod] Label account SSH keys with the SkyPilot user by @ciprianf in https://github.com/skypilot-org/skypilot/pull/9975\r\n* [Core] debug-dump: bound controller SSH work + add best-effort overall deadline by @claude[bot] in https://github.com/skypilot-org/skypilot/pull/10161\r\n* [Nebius] Keep personal pricing fetch failures out of CLI output by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10222\r\n* [Test] Add golden snapshot tests for kubernetes-ray.yml.j2 rendering by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10226\r\n* [Test] Poll for STOPPED after sky stop in test_resize by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10217\r\n* [Test] Pin zone in skyserve auto_restart.yaml so replica termination finds the instance by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10216\r\n* [Kubernetes] Surface which node a terminated cluster lost by @SeungjinYang in https://github.com/skypilot-org/skypilot/pull/10233\r\n* [Docs] Trim redundant optimization section from Overview; link SkyPilot Platform by @concretevitamin in https://github.com/skypilot-org/skypilot/pull/10235\r\n* [Docs] Update logo to official brand assets by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10238\r\n* [Test] Add smoke test for k8s accelerator node-affinity scheduling constraint by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10225\r\n* [Test] Add managed jobs smoke test for pod_config targeting the ray-node container by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10223\r\n* [Dashboard] Use new brand favicon by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10237\r\n* [Metrics] Stop cluster-label stamping from stalling the metrics server by @rohansonecha in https://github.com/skypilot-org/skypilot/pull/10240\r\n* [Test] Fix apiserver-start-stop smoke test setup on bare cloud VMs by @zpoint in https://github.com/skypilot-org/skypilot/pull/10242\r\n* [Test] Drop conda-version guard from test_custom_default_conda_env by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10244\r\n* [Core] Guard source ~/.bashrc against a missing ~/.bashrc by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10245\r\n* [Jobs] Retry transient cluster-status errors in controller monitor loop by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10040\r\n* [Core] Restore the config override in `replace_skypilot_config` when the body raises by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10236\r\n* [LLM] slime example: pin image to known-good nightly tag by @ishankaul1 in https://github.com/skypilot-org/skypilot/pull/10249\r\n* [Test] Pin failed-mount escalation smoke test to a single Kubernetes context by @MadhavJivrajani in https://github.com/skypilot-org/skypilot/pull/10248\r\n* [Core] PostgresLock: run advisory-lock statements in autocommit mode by @MadhavJivrajani in https://github.com/skypilot-org/skypilot/pull/10251\r\n* [Server] Park launch as WAITING on cluster lock contention instead of blocking a worker by @aylei in https://github.com/skypilot-org/skypilot/pull/10210\r\n* [Core] Surface resolved active_workspace to admin policies by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10241\r\n* [API] Support running multiple isolated local API servers on one machine by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10213\r\n* [Core] Compute Kubernetes accelerator node affinity in Python by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10232\r\n* [Nebius] Wait for instance termination before deleting the cluster security group by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10220\r\n* [Jobs] Collapse repeated job-status polls in the controller log by @SeungjinYang in https://github.com/skypilot-org/skypilot/pull/10255\r\n* [k8s] Do not count queue-gated (Kueue admission) time against provision_timeout by @MadhavJivrajani in https://github.com/skypilot-org/skypilot/pull/10252\r\n* [Server] Fail /api/get definitively for requests interrupted by a server restart by @aylei in https://github.com/skypilot-org/skypilot/pull/10257\r\n* [Launcher] Fix multi-node rank crash on multi-NIC / hostNetwork K8s n\u2026 by @yash170106065 in https://github.com/skypilot-org/skypilot/pull/9924\r\n* Update Together AI references in installation guide by @pavneeta in https://github.com/skypilot-org/skypilot/pull/10260\r\n* [Jobs] Include exit code and log pointer in RECOVERING event for user-job failure restarts by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10256\r\n* [Dashboard] Infra table: unify data cell color across columns by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10267\r\n* Update docstr for `resolved_config` by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10270\r\n* [GCP] Support federated credentials for GCS COPY by @samuelv8 in https://github.com/skypilot-org/skypilot/pull/10212\r\n* [Nebius] Pin nebius SDK below 0.4 by @zpoint in https://github.com/skypilot-org/skypilot/pull/10280\r\n* [Server] Validate and parameterize request-status queries by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10273\r\n* [Kubernetes] Bound pod wait-loop polls with a request timeout by @aylei in https://github.com/skypilot-org/skypilot/pull/10272\r\n* [LLM] slime example: offload optimizer state to host RAM by default by @ishankaul1 in https://github.com/skypilot-org/skypilot/pull/10269\r\n* [Slurm] Fix node info aggregation for multi-cluster setups by @liuxu623 in https://github.com/skypilot-org/skypilot/pull/10284\r\n* [Core] Clamp open-files (nofile) limit raise to the attainable hard limit by @claude[bot] in https://github.com/skypilot-org/skypilot/pull/10263\r\n* [Server] Park jobs-controller launches on cluster lock contention too by @lloyd-brown in https://github.com/skypilot-org/skypilot/pull/10291\r\n* [API] Export metrics for the on-demand request thread executor by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10287\r\n* [Slurm] Enrich node info with CPU/memory allocation and sampled usage by @rohansonecha in https://github.com/skypilot-org/skypilot/pull/10293\r\n* [Jobs] Release log-tail threads when the client disconnects by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10290\r\n* [Dashboard] Persist rows-per-page for the cluster jobs and pools tables by @zpoint in https://github.com/skypilot-org/skypilot/pull/10279\r\n* [Test] Fix test_minimal job numbering on Slurm by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10298\r\n* [Server] Return the executor slot when the monitor thread fails to start by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10300\r\n* [Server] Make debug dump creation admin-only by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10277\r\n* [Test] Pin stale-pod-cleanup kubectl to the cluster's landed context by @zpoint in https://github.com/skypilot-org/skypilot/pull/10302\r\n* [k8s] Keep the spinner updating while pods await queue admission by @zpoint in https://github.com/skypilot-org/skypilot/pull/10305\r\n* [Analytics] Add analytics to gain insights to usage by @hopechong in https://github.com/skypilot-org/skypilot/pull/10266\r\n* [Slurm] Fix leaked allocation when terminating a cluster with a running task by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10296\r\n* [Slurm] Unset step-scoped SLURM_* env before running user scripts by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10309\r\n* [Slurm] Submit jobs as authenticated users by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10294\r\n* [Slurm] Add SlurmClient.get_all_jobs_info() for per-node job attribution by @rohansonecha in https://github.com/skypilot-org/skypilot/pull/10306\r\n* [Dashboard] Break Slurm clusters down by partition on the Infra page by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10317\r\n* [Dashboard] Show CPU-only Slurm clusters on the Infra page by @aylei in https://github.com/skypilot-org/skypilot/pull/10318\r\n* [Slurm] Use node AllocTRES for GPU availability accounting by @liuxu623 in https://github.com/skypilot-org/skypilot/pull/10285\r\n* [API] Give auth its own thread executor so streams cannot starve it by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10313\r\n* [Nebius] Unpin nebius SDK now that 0.4.3 is loop-aware by @zpoint in https://github.com/skypilot-org/skypilot/pull/10320\r\n* [Slurm] Stop the multi-node run-done barrier from failing completed jobs by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10321\r\n* [Test] Stop the auth-pool test from spawning 128 threads by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10322\r\n* [Core] Optionally route the state DB through a transaction pooler by @aylei in https://github.com/skypilot-org/skypilot/pull/10301\r\n* [Dashboard] Add filtering to the volumes page by @stephenkevn in https://github.com/skypilot-org/skypilot/pull/10316\r\n* [Slurm] Make multi-cluster node info aggregation actually best-effort by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10289\r\n* [Slurm] Keep unreachable Slurm clusters listed on the Infra page by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10329\r\n* [Jobs] Fail deterministic task-prep errors fast instead of retrying them by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10326\r\n* [Server] Scope request-listing body to the request owner by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10278\r\n* Fix/k8s bootstrap package manager agnostic by @trevanth24 in https://github.com/skypilot-org/skypilot/pull/10077\r\n* [Client] Fix `sky api logs` traceback on 4xx from /api/stream by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10341\r\n* [Jobs] Fix managed job crash on empty imagePullSecrets in task config by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10325\r\n* [Core] Read-only visibility of private workspaces for non-members by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10228\r\n* [Test] Classify /slurm_cluster_names as read in workspace-access guard by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10343\r\n* [Core] Add plugin hook for task-overrideable config keys by @kevinmingtarja in https://github.com/skypilot-org/skypilot/pull/10339\r\n* [Test] Stop smoke-test teardowns from skipping cleanup on failure by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10342\r\n* [Jobs] Add inter_connection knob for JobGroups: require or skip in-group networking by @ishankaul1 in https://github.com/skypilot-org/skypilot/pull/10297\r\n* [Jobs] Review fixes for inter_connection: networking hardening, terminal errors, admin-policy header preservation by @ishankaul1 in https://github.com/skypilot-org/skypilot/pull/10330\r\n* [Server] Scope request-tracking endpoints to the calling user by @DanielZhangQD in https://github.com/skypilot-org/skypilot/pull/10274\r\n* [API] Measure /api/get latency broken out by request name by @aylei in https://github.com/skypilot-org/skypilot/pull/10349\r\n* [Nebius] Add SkyPilot user-agent prefix by @complynx in https://github.com/skypilot-org/skypilot/pull/10345\r\n* [Core] Add lease-based leader 