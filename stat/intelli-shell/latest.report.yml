ad_count":0,"created_at":"2026-10-28T05:31:12Z","updated_at":"2026-10-28T05:31:13Z"},{"id":683950526,"node_id":"RA_kwDOIz-KvM4oxEG-","name":"intelli-shell-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11575157,"digest":"sha256:d00f5702cd54be455f988688c3d388ed4a50591cefecdfc1e4e01767255911ef","download_count":0,"created_at":"2026-10-28T05:32:13Z","updated_at":"2026-10-28T05:32:14Z"}],"body":"This release strengthens runtime stability across the CLI, restores exact alias search behavior when filters are active, and improves configuration documentation reliability.\r\n\r\n### Improvements\r\n\r\n- **Zero-Panic Runtime Reliability**: Hardened error handling across all core application routines, replacing unhandled panics with structured error propagation for a much more resilient CLI experience.\r\n- **Optimized Regex Evaluation**: Transitioned pattern matching to compile-time validated regular expressions.\r\n\r\n### Bug Fixes\r\n\r\n- **Filtered Alias Resolution**: Fixed a regression introduced in v3.4.6 where applying category or default filters (such as `user_only`) inadvertently disabled exact alias matches. Exact alias searches now correctly match within active category and source filters.\r\n\r\n### Documentation\r\n\r\n- **Anchor-Based Documentation Consistency**: Transitioned configuration documentation to named section anchors, ensuring sample snippets stay synchronized with default configuration files across releases without broken references."}
