ad_count":9,"created_at":"2026-10-08T11:47:31Z","updated_at":"2026-10-08T11:47:32Z"},{"id":621675065,"node_id":"RA_kwDOIz-KvM4lDgI5","name":"intelli-shell-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11565466,"digest":"sha256:046a4faa64060a11380db9a769205fdbe321eae7ea6785afc8908e5e281fb149","download_count":1,"created_at":"2026-10-08T11:47:00Z","updated_at":"2026-10-08T11:47:00Z"}],"body":"This release introduces customizable shell integration hotkeys and list navigation shortcuts, alongside important fixes for inline terminal resizing, search filtering, and process execution lifecycle management.\r\n\r\n### Features\r\n\r\n- **Configurable Shell Hotkeys**: You can now customize shell integration shortcuts via a dedicated `[hotkeys]` section in your configuration file. Keybindings for searching, bookmarking, variable management, and AI fix are dynamically templated across Bash, Zsh, Fish, Nushell, and PowerShell.\r\n- **Configurable List Navigation**: Keybindings for list traversal (`list_up`, `list_down`, `page_up`, `page_down`) are now fully configurable, allowing you to tailor list navigation to your preferred modal or arrow-less key layouts.\r\n\r\n### Improvements\r\n\r\n- **Reliable Process Cancellation**: Long-running or detached commands that redirect standard streams (such as `/dev/null`) now respond immediately to cancellation signals, preventing terminal hangs when canceling tasks.\r\n- **Resilient TLDR Synchronization**: The `tldr` cache update mechanism now automatically recovers and tracks remote branches if the local repository enters a detached or missing branch state.\r\n- **Compound Command Safety**: Destructive command detection now properly recognizes `&` background delimiters, ensuring dangerous operations inside background statements are flagged correctly.\r\n- **Preserved JSON Import Metadata**: Importing bookmarks from JSON files now reliably retains and persists all associated tags and filters.\r\n\r\n### Bug Fixes\r\n\r\n- **Inline Viewport Resizing**: Resizing terminal windows while running in inline mode now properly recalculates rendering boundaries, preventing the TUI from clipping or being pushed off-screen.\r\n- **Filtered Alias Searches**: The fast-path alias search now respects active category, tag, and source filters instead of returning unfiltered exact matches.\r\n- **Fuzzy Search Parser Stability**: Fixed search input parsing to ignore unclosed or incomplete exact match markers while typing, preventing erratic empty result lists.\r\n\r\n### Update Considerations\r\n\r\n- **Shell Reload Required**: Because shell integration scripts now dynamically template configured hotkeys, you must restart your active terminal sessions or re-source your shell configuration files after upgrading.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
