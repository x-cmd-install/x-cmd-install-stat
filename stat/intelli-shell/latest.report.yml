load_count":28,"created_at":"2026-11-10T17:44:32Z","updated_at":"2026-11-10T17:44:33Z"},{"id":732360384,"node_id":"RA_kwDOIz-KvM4rpu7A","name":"intelli-shell-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11574031,"digest":"sha256:b5fe4b522c4739a6deae67a572b39b9a4d55690b183b4288462126c3e8db1fcb","download_count":10,"created_at":"2026-11-10T17:43:14Z","updated_at":"2026-11-10T17:43:15Z"}],"body":"This patch release fixes a test suite failure on macOS and resolves a shell integration parsing error in Fish.\r\n\r\n### Improvements\r\n\r\n- **macOS Test Suite Compatibility**: Updated `test_default_config` to correctly account for the platform-specific `keyboard_enhancement` default on macOS, ensuring tests pass successfully during Nix Darwin builds and local macOS test runs.\r\n\r\n### Bug Fixes\r\n\r\n- **Fish Shell Integration Parsing**: Fixed startup parse and tokenization errors (`Invalid token '\\c$char'`) when sourcing the integration script in Fish.\r\n\r\n### Update Considerations\r\n\r\n- **Fish Shell Users**: If you use Fish shell, please restart your terminal or re-source your configuration to load the updated integration script."}
