download_count":255,"created_at":"2026-06-26T10:12:11Z","updated_at":"2026-06-26T10:12:12Z"},{"id":458531376,"node_id":"RA_kwDOIz-KvM4bVKIw","name":"intelli-shell-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":12096599,"digest":"sha256:b5fac76d6f4b81fd2ff155ab0bf83ed7e571bf6e87d916d4dea4b1e02979dfd4","download_count":77,"created_at":"2026-06-26T10:12:10Z","updated_at":"2026-06-26T10:12:11Z"}],"body":"This patch release addresses a keybinding regression affecting PowerShell integration on Windows environments.\r\n\r\n### Bug Fixes\r\n\r\n- **PowerShell Keybinding on Windows:** Restored the default search keybinding for PowerShell on Windows back to `Ctrl+Spacebar`. A recent update inadvertently changed this to `Ctrl+space`, which caused compatibility issues as PSReadLine on Windows specifically expects `Ctrl+Spacebar`. The `Ctrl+D2` workaround for Linux environments remains preserved and unaffected."}
