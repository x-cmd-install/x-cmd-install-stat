nload_count":3,"created_at":"2026-09-12T18:47:44Z","updated_at":"2026-09-12T18:47:51Z"},{"id":559769716,"node_id":"RA_kwDOQk_qI84hXWh0","name":"vibe-linux-aarch64-2.25.4.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":67730064,"digest":"sha256:bf2a42408ff688c5954f902997778b547d975174a1f33896ac81ba67adf2e18a","download_count":5,"created_at":"2026-09-12T18:47:44Z","updated_at":"2026-09-12T18:47:50Z"},{"id":559769717,"node_id":"RA_kwDOQk_qI84hXWh1","name":"vibe-linux-x86_64-2.25.4.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":71343335,"digest":"sha256:e5ab34e542f033527a218b7462114b2dae100ea5ee0a878f2e015c45e1f2f38b","download_count":6,"created_at":"2026-09-12T18:47:44Z","updated_at":"2026-09-12T18:47:50Z"},{"id":559769722,"node_id":"RA_kwDOQk_qI84hXWh6","name":"vibe-windows-x86_64-2.25.4.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":59894420,"digest":"sha256:9d3133a2c4171b1c6bd2148af33440a66c91432c3b679310265feb873586683d","download_count":3,"created_at":"2026-09-12T18:47:44Z","updated_at":"2026-09-12T18:47:51Z"}],"body":"### Fixed\n\n- Connector discovery excludes raw HTTP connectors that do not support MCP tools.\n- A single invalid connector no longer prevents the rest of your connectors from loading; an individual tool with an oversized schema is dropped on its own, and accounts over the connector cap keep a bounded catalog instead of loading none.\n- Automatic session titles use the active model on custom Mistral endpoints.\n- Smart-approve now appears in the Vibe Desktop mode picker when enabled via its rollout, and a background refresh no longer drops it.\n- ACP clients (Zed/JetBrains) always list the active mode, so a session can never get stuck on a mode missing from its own list.\n- Smart-approve now escalates to a confirmation prompt when a risky action is requested again, instead of only blocking it, and shows the reason it is asking.\n- Auto-approved calls no longer read as warnings: the reason smart-approve let a call run is shown as a note rather than a warning.\n- `@` file mentions now resolve against every workspace root, including `--add-dir` ones.\n- A `@` mention outside the workspace no longer rejects the whole message; it stays plain text and the read tool can still ask for it.\n- `--add-dir` no longer drops the working directory from the file tools' workspace roots.\n- Shell permission checks now require approval for risky syntax and command options that could bypass workspace and denylist controls (CVE-2026-87984, CVE-2026-87985, CVE-2026-87986, CVE-2026-87987, and residual CVE-2026-87988 variants).\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
