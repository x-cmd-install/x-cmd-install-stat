9a7e394a0e1364c18cd0359d63273298","download_count":5,"created_at":"2026-11-05T15:56:30Z","updated_at":"2026-11-05T15:56:48Z"},{"id":713945568,"node_id":"RA_kwDOBL4Qb84qjfHg","name":"duck-src-9.6.0.46406.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":32194736,"digest":"sha256:658875337df34d0fb90b08086e1192972c6316cfc99f3d2f7f135e5b324e1f20","download_count":2,"created_at":"2026-11-05T15:56:30Z","updated_at":"2026-11-05T15:56:34Z"},{"id":713945560,"node_id":"RA_kwDOBL4Qb84qjfHY","name":"duck_9.6.0.46406_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":110921096,"digest":"sha256:b76f3fefdd0756b08e7e3015f46273a73f5cf78bc9f0d83c7d0d6e7e90ea6ca6","download_count":11,"created_at":"2026-11-05T15:56:30Z","updated_at":"2026-11-05T15:56:44Z"},{"id":713945550,"node_id":"RA_kwDOBL4Qb84qjfHO","name":"duck_9.6.0.46406_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":112194574,"digest":"sha256:65eb5250aef00d5c0eab1927dc76fb7385a3ee51816d2dba43d9875c75169481","download_count":2,"created_at":"2026-11-05T15:56:30Z","updated_at":"2026-11-05T15:56:44Z"}],"body":"<!-- Release notes generated using configuration in .github/release.yml at release-9-6-0 -->\n\n## What's Changed\n### 🪵 Changes\n* Always return executable permission when running on Windows. by @ylangisc in https://github.com/iterate-ch/cyberduck/pull/15858\n* Fix #15817 by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15818\n* Review OCS extensions by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15840\n* Include checksum in property key to save resumable file upload URL. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15856\n* Review disk share pooling by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15859\n* Fix #15841. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15878\n* Disable lock support using property in connection profile. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15860\n* Parse domain an username from input by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15873\n* Only share context in subsequent logical requests by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15868\n* Use OCS Capabilities API by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15876\n* Update CTERA README.md. by @chenkins in https://github.com/iterate-ch/cyberduck/pull/15805\n* Review resume support in Upload feature by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15894\n* Register all custom schemes in connection profiles. Fix #15901. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15904\n* Throw any background failure found in stack. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15909\n* Throw failure when file already exists. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15908\n* Fix #15621. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15911\n* Do not set NTLM domain from environment by default by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15914\n* Fix #15915. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15916\n* This reverts commit 52a702c1. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15919\n* Allow caller to evaluate cause of reachability failure. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15917\n* Add command line option for moving files.  by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15871\n* Disable redirect handling as otherwise we might get redirected to log… by @ylangisc in https://github.com/iterate-ch/cyberduck/pull/15933\n* Map IllegalArgumentException to BackgroundException by @AliveDevil in https://github.com/iterate-ch/cyberduck/pull/15934\n* Make sure to store cookies from a successful login only. by @ylangisc in https://github.com/iterate-ch/cyberduck/pull/15932\n* Attempt to load public key when available by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15254\n* Revised fix for #15841. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15951\n* Timestamp set on in custom WebDAV properties only have second precision. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15955\n* Fix #15962. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15963\n* Update response in transfer status with actual set timestamp with pre… by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15957\n* Port WinForms TransferForm to WPF by @AliveDevil in https://github.com/iterate-ch/cyberduck/pull/15912\n* Fix #15137 by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15138\n* Cover \"long term retention.txt\" in CteraAttributesFinderFeatureTest. by @chenkins in https://github.com/iterate-ch/cyberduck/pull/15961\n* Preset domain and username from environment on Windows by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15954\n* Fix 404 retrieving versions by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15978\n* Remove plate on taskbar by @AliveDevil in https://github.com/iterate-ch/cyberduck/pull/15972\n* Fix ctera touch preflight. by @chenkins in https://github.com/iterate-ch/cyberduck/pull/15956\n* Skip setting timestamps for volumes when not supported. by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15981\n* Rewrite Azure Storage protocol implementation by @dkocher in https://github.com/iterate-ch/cyberduck/pull/15985\n* Fix request URI