","name":"eksctl_Windows_amd64.zip.sbom.json","label":"","uploader":{"login":"eksctl-bot","id":53547694,"node_id":"MDQ6VXNlcjUzNTQ3Njk0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":412466,"digest":"sha256:d16750667548bec84153ff94e8026d4c73d9d4f1df008ad84101efbf43a6febe","download_count":16,"created_at":"2026-10-02T21:14:46Z","updated_at":"2026-10-02T21:14:47Z"},{"id":606503112,"node_id":"RA_kwDOCATpKM4kJoDI","name":"eksctl_Windows_arm64.zip","label":"","uploader":{"login":"eksctl-bot","id":53547694,"node_id":"MDQ6VXNlcjUzNTQ3Njk0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":33487073,"digest":"sha256:1cdba24089625b2dc2adb34dbe5c5b9ea57799be24365d98a54b6a563f0f02e6","download_count":78,"created_at":"2026-10-02T21:14:43Z","updated_at":"2026-10-02T21:14:45Z"},{"id":606503165,"node_id":"RA_kwDOCATpKM4kJoD9","name":"eksctl_Windows_arm64.zip.sbom.json","label":"","uploader":{"login":"eksctl-bot","id":53547694,"node_id":"MDQ6VXNlcjUzNTQ3Njk0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":412466,"digest":"sha256:07da3890d812fa46fe43530cc0e70ef288732b699973b0dff1d90ba004df0b31","download_count":2,"created_at":"2026-10-02T21:14:45Z","updated_at":"2026-10-02T21:14:46Z"}],"body":"# Release v0.231.0\n\n## \ud83d\ude80 Features\n\n- Add connectionTracking support to nodegroup config (#8872)\n- Add TerminatedPodGcThreshold to control plane component config (#8853)\n- Add support for vpc.controlPlaneOnPrivateSubnets (#8793)\n\n## \ud83c\udfaf Improvements\n\n- chore: harden addon warning logging and empty drain (#8869)\n- ci: harden the release pipeline \u2014 isolate EKSCTLBOT\\_TOKEN, sign releases, publish SBOMs (#8863)\n- ci: pass workflow inputs to run steps via env vars (#8860)\n\n## \ud83d\udc1b Bug Fixes\n\n- fix: resolve latest addon version before pod identity lookup (#8867)\n- chore: harden addon warning logging and empty drain (#8869)\n- fix: use interruptionQueue Helm value for Karpenter >= v0.33.0 (#8844)\n- Grant ec2:DescribeSecurityGroups to the IPv6 VPC CNI role (#8837)\n\n## \ud83e\uddf0 Maintenance\n\n- ci: harden the release pipeline \u2014 isolate EKSCTLBOT\\_TOKEN, sign releases, publish SBOMs (#8863)\n- ci: pass workflow inputs to run steps via env vars (#8860)\n- Update ec2-info (#8854)\n- Update coredns (#8842)\n- Update coredns (#8841)\n- Update nvidia-device-plugin to v0.20.0 (#8840)\n\n## \ud83d\udcdd Documentation\n\n- docs: explain addon version differences (#8868)\n\n## Acknowledgments\n\nThe eksctl maintainers would like to sincerely thank @atharvaHJoshi, @chithreshazad, @guessi, @gustavodiaz7722, @sapphirew, @warren830, @chithresha and @michaelbeaumont.\n\n\n","mentions_count":8}
