enance\n\n- Fix/integration test failures (#8926)\n- Update coredns (#8883)\n- Remove go.mod replace pins and apply blocked dependency updates (#8918)\n- test: disable self-registration on the identity provider test's Cognito user pool (#8914)\n\n## Acknowledgments\n\nThe eksctl maintainers would like to sincerely thank @DerekFrank, @jupdec, @knottnt, @kprahulraj, @naclonts, @sapphirew, @siddharthkhialani, @michaelbeaumont, @rhaowang and Siddharth Khialani.\n\n","mentions_count":9}
