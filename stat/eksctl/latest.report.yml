trol plane component config support (#8821)\n- Add support for BottlerocketFips AMI family in managed nodegroups (#8778)\n\n## \ud83c\udfaf Improvements\n\n- Make vpc-cni and kube-proxy optional when creating IPv6 clusters (#8790)\n\n## \ud83d\udc1b Bug Fixes\n\n- Grant ec2:DescribeSubnets to the IPv6 VPC CNI role (#8835)\n- Bump oras-go to 2.6.2 to resolve five open advisories (#8829)\n\n## \ud83e\uddf0 Maintenance\n\n- Update aws-node to v1.23.0 (#8832)\n- Update coredns (#8833)\n- Update ec2-info (#8723)\n- Update coredns (#8724)\n- Update aws-node to v1.22.4 (#8747)\n- Update nvidia-device-plugin to v0.19.3 (#8722)\n\n## Acknowledgments\n\nThe eksctl maintainers would like to sincerely thank @41ks, @amdonov, @chithreshazad, @gustavodiaz7722, @chithresha and @michaelbeaumont.\n\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
