T15:59:47Z"},{"id":755469775,"node_id":"RA_kwDON4OD8c4tB43P","name":"excel_mcp_server-2.3.2.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":425716,"digest":"sha256:e613f8c3e7557c575227403becc747f8fb55cd3f480a9e7407569dc2c37ccb96","download_count":4,"created_at":"2026-11-16T15:59:47Z","updated_at":"2026-11-16T15:59:47Z"}],"body":"### Fixed\n\n- A conditional format or data validation rule with several ranges keeps its formula pointing at\n  the right cells when rows or columns are inserted or deleted more than once (#265).\n- A table loaded from Power Query keeps its query table part when the workbook is saved.\n  Without it Excel could not open the file (#264).\n- Inserting, deleting or resizing the columns of a table loaded from Power Query keeps its\n  query table part and its data range in step with the table, as Excel does, so the file still\n  opens and refreshes. A copied sheet gets a plain table with the same data, since Excel's copy\n  would also duplicate the query itself.\n\n"}
