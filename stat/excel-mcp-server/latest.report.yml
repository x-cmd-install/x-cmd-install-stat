6-11-09T18:56:15Z","updated_at":"2026-11-09T18:56:15Z"},{"id":728592203,"node_id":"RA_kwDON4OD8c4rbW9L","name":"excel_mcp_server-2.3.0.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":422027,"digest":"sha256:337fd1a85543893788c190a8ab328292a1c18e27440b63be25147829caaa8204","download_count":7,"created_at":"2026-11-09T18:56:15Z","updated_at":"2026-11-09T18:56:15Z"}],"body":"\nThe formula calculator now covers 479 Excel functions (from about 366): statistical\ndistributions, regression, database, engineering, complex-number, securities and LAMBDA helper\nfunctions, checked against more than 25,000 results recorded in Excel 16. Every tool was\nexercised with damaged workbooks and hostile arguments, and every crash that turned up was fixed.\n\n### Added\n\n- The calculator computes `BASE`, `DECIMAL`, `FACTDOUBLE`, `COMBINA`, `PERMUTATIONA`,\n  `MULTINOMIAL`, `SERIESSUM`, `ARABIC`, `ROMAN` (all five forms), `ASINH`, `ACOSH`, `ATANH`,\n  `ACOT`, `ACOTH`, `COT`, `COTH`, `CSC`, `CSCH`, `SEC`, `SECH`, `GAMMA`, `GAMMALN`,\n  `GAMMALN.PRECISE`, `ERF`, `ERF.PRECISE`, `ERFC`, `ERFC.PRECISE`, `GAUSS`, `PHI`, `FISHER`,\n  `FISHERINV`, `DELTA`, `GESTEP`, `CEILING.PRECISE`, `FLOOR.PRECISE`, `ISO.CEILING`, the\n  conversions between binary, octal, decimal and hexadecimal (`BIN2DEC`, `DEC2HEX`, ...),\n  `BITAND`, `BITOR`, `BITXOR`, `BITLSHIFT`, `BITRSHIFT`, `MMULT`, `MDETERM`, `MINVERSE`,\n  `MUNIT`, `TRANSPOSE`, `TOCOL`, `TOROW`, `WRAPROWS`, `WRAPCOLS`, `EXPAND`, `TEXTBEFORE`,\n  `TEXTAFTER`, `TEXTSPLIT`, `VALUETOTEXT`, `ARRAYTOTEXT`, `ISREF`, `ISFORMULA`, `FORMULATEXT`,\n  `SHEET`, `SHEETS`, `AREAS`, `ADDRESS`, and the older names `NORMDIST`, `NORMINV`, `NORMSDIST`,\n  `NORMSINV`, `POISSON`, `EXPONDIST`, `BINOMDIST`, `CONFIDENCE` and `COVAR`. The range\n  intersection operator (a space) is calculated.\n- `TEXT` and the number formats of exported files support sections with conditions, colours,\n  scientific notation, fractions, elapsed time (`[h]:mm`), the text section, General, and the\n  1900 calendar's day 0 and 29 February.\n- The calculator computes the probability distributions with their inverses (`BETA.DIST`,\n  `BETA.INV`, `CHISQ.DIST`, `CHISQ.DIST.RT`, `CHISQ.INV`, `CHISQ.INV.RT`, `CHISQ.TEST`,\n  `F.DIST`, `F.DIST.RT`, `F.INV`, `F.INV.RT`, `F.TEST`, `T.DIST`, `T.DIST.2T`, `T.DIST.RT`,\n  `T.INV`, `T.INV.2T`, `T.TEST`, `GAMMA.DIST`, `GAMMA.INV`, `WEIBULL.DIST`, `LOGNORM.DIST`,\n  `LOGNORM.INV`, `HYPGEOM.DIST`, `NEGBINOM.DIST`, `BINOM.INV`, `BINOM.DIST.RANGE`,\n  `CONFIDENCE.T`, `Z.TEST`, `PROB`, and the older `BETADIST`, `BETAINV`, `CHIDIST`, `CHIINV`,\n  `CHITEST`, `FDIST`, `FINV`, `FTEST`, `TDIST`, `TINV`, `TTEST`, `GAMMADIST`, `GAMMAINV`,\n  `WEIBULL`, `LOGNORMDIST`, `LOGINV`, `HYPGEOMDIST`, `NEGBINOMDIST`, `CRITBINOM`, `ZTEST`),\n  regression (`LINEST` and `LOGEST` with statistics, several variables and Excel's removal of\n  repeated columns; `TREND` and `GROWTH` with several variables), `FREQUENCY`, `MODE.MULT`,\n  `SKEW.P`, `TRIMMEAN`, `STEYX`, `STDEVA`, `STDEVPA`, `VARA`, `VARPA`, `ECMA.CEILING`, and the\n  twelve database functions (`DSUM`, `DAVERAGE`, `DCOUNT`, `DCOUNTA`, `DGET`, `DMAX`, `DMIN`,\n  `DPRODUCT`, `DSTDEV`, `DSTDEVP`, `DVAR`, `DVARP`) with AND across a row, OR across rows,\n  wildcards, comparison operators and computed criteria.\n- The calculator computes the complex-number functions (`COMPLEX`, `IMREAL`, `IMAGINARY`,\n  `IMABS`, `IMARGUMENT`, `IMCONJUGATE`, `IMSUM`, `IMSUB`, `IMPRODUCT`, `IMDIV`, `IMPOWER`,\n  `IMSQRT`, `IMEXP`, `IMLN`, `IMLOG10`, `IMLOG2` and the trigonometric and hyperbolic\n  functions `IMSIN` to `IMCSCH`), `CONVERT` (every unit and prefix Excel has), `BESSELI`,\n  `BESSELJ`, `BESSELK`, `BESSELY` and `ENCODEURL`.\n- The calculator computes `ACCRINT`, `ACCRINTM`, `PRICEMAT`, `YIELDMAT`, `ODDFPRICE`,\n  `ODDFYIELD`, `ODDLPRICE`, `ODDLYIELD`, `AMORLINC` and `AMORDEGRC`, and `LAMBDA` with `BYROW`,\n  `BYCOL`, `MAP`, `REDUCE`, `SCAN`, `MAKEARRAY` and `ISOMITTED`, also for a LAMBDA called by the\n  name a `LET` gave it. `COUPDAYS` on an actual basis now follows Excel at month-end maturities\n  (found by bisecting 11,500 recorded settlements) and `YIELD` and the other bond functions at\n  month-ends; where Excel's result cannot be reproduced (`ACCRINT` and the odd-coupon\n  functions with coupon dates at the end of a month, `ACCRINT` counted from the first interest\n  date on an actual basis, the statistics of a perfect `LINEST` fit, which are rounding noise in\n  Excel) the cell is left uncalculated and listed, never guessed.\n- `tests/fixtures/formula_golden.json` records more than 25,000 formulas from Excel 16 for the\n  calculator to match.\n\n### Fixed\n\n- `ENCODEURL`, `FILTERXML`, `WEBSERVICE`, `FORECAST.ETS.CONFINT`, `FORECAST.ETS.SEASONALITY`,\n  `FORECAST.ETS.STAT`, `STOCKHISTORY`, `IMAGE`, `FIELDVALUE` and the complex-number functions\n  `IMCOSH`, `IMCOT`, `IMCSC`, `IMCSCH`, `IMSEC`, `IMSECH`, `IMSINH` and `IMTAN` were stored\n  without the prefix Excel needs and showed `#NAME?` when the file was opened. A LAMBDA called\n  by the name a `LET` gave it (`f(5)`) is stored with the prefix too.\n- `YIELD` in the last coupon period counted the days to maturity from the coupon period, not\n  from the dates, so it differed from Excel at the end of a month on a 30/360 basis.\n- `COUNTIF` and the functions that share its criteria compared `\"<=TRUE\"` as text.\n- `function_arguments.json` lists the argument counts of the functions added above.\n- `goal_seek` also limits the total calculation across its iterations (5 million cell\n  calculations) and stops with a clear error, where each iteration was limited alone.\n- Number formats over 255 characters (Excel's limit) and formats that need more digits than the\n  calculator holds are left uncalculated instead of failing with \"Unexpected error\" in\n  `TEXT`, `FIXED`, `DOLLAR`, `export_csv` and PivotTable subtotal captions, and a hostile\n  format can no longer make every caption tens of kilobytes long.\n- `import_csv` counted delimiters inside quotes when refusing a line with too many cells; only\n  field separators count now.\n- `trace_formula` with `evaluate` steps through a run of operators (`=A1+A2+...`, up to\n  Excel's 8,192 characters) in a loop, instead of refusing a formula more than 150 levels deep:\n  nesting is bounded by the 64 levels the parser already accepts.\n- `describe_sheet` lists at most 200 entries of each list and cuts a note at 1,000 characters;\n  `more` counts what was left out.\n- A damaged sheet part (XML that is not well formed, a corrupt compressed part, a cell style\n  that does not exist) is reported as an unreadable workbook, not \"Unexpected error\", by\n  `describe_workbook`, `read_range`, `find_cells`, `export_csv`, `goal_seek` and the others\n  that read sheets while streaming them.\n- A workbook file opened by a tool that then failed to read it is closed again at once.\n- `insert_rows_or_columns` and `delete_rows_or_columns` refuse rows or columns past Excel's last\n  before saving, instead of failing after the file was written; inserting rows or columns next\n  to a cell without a format no longer fails.\n- `goal_seek` and `trace_formula` on a workbook without worksheets give a clear error.\n- Numbers typed in a formula or coerced from text keep their first 15 digits, as in Excel\n  (`=GCD(9007199254740993,3)` is 3). Multiplication, division and `^` give 0 for a result below\n  the smallest normal double; addition, subtraction and most functions keep it. A stored\n  number that small, or too large for a double, is read as Excel reads it.\n- `MATCH`, `XMATCH`, `VLOOKUP`, `HLOOKUP`, `LOOKUP` and `XLOOKUP` follow Excel's bisection on\n  unsorted data and data of mixed types, treat a blank lookup value as Excel does, and take\n  every search mode. `ROWS`, `COLUMNS` and `INDEX` know the true size of a whole row or\n  column, and `INDEX` returns a reference. An undefined name is `#NAME?`.\n- `SUBTOTAL` and `AGGREGATE` count manually hidden rows and leave out rows hidden by a filter\n  (any hidden row of a sheet with an active filter). `DATEDIF` gives `\"MD\"`, `\"YD\"` and\n  `#NUM!` for an unknown unit as Excel does. `PRICE`, `YIELD`, `DURATION` and `MDURATION`\n  with month-end maturities and Actual/Actual are calculated. `VDB` over fractional periods\n  is calculated where the result is certain. `ROW` and `COLUMN` of a name and of whole rows.\n- `YEAR`, `MONTH`, `DAY`, `WEEKDAY`, `HOUR`, `DAYS` and friends follow Excel for serial\n  numbers 0, 60 and 2958465 and give `#NUM!` beyond them; `MOD` of tiny divisors, `SMALL`\n  and `LARGE` with k below 1, `AND`/`OR`/`XOR` with typed-in text, `VALUE(TRUE)`, and the\n  text of numbers beyond 15 digits (rounded, not cut) match Excel. Text that Excel could read\n  as a date or time is left uncalculated rather than guessed.\n- Arithmetic that overflows a double now gives `#NUM!` as in Excel instead of an uncalculated\n  cell or a wrong value. Whole numbers stored in cells are calculated as doubles, so a chain like\n  `=A1^A1^...` with `A1` holding 3 no longer builds a huge exact integer. `COMBIN`, `PERMUT`,\n  `CEILING`, `FLOOR`, `MROUND`, `QUOTIENT`, `SINH` and `COSH` return `#NUM!` when the result is\n  too large, and the calculator reproduces Excel's other limits: `MOD` with a quotient from\n  1.1259E12 on, `SIN`/`COS`/`TAN` from 2^27 on, `GCD` and `LCM` beyond 2^53, `COMBIN` and `PERMUT`\n  from 2^31-1 on, and a negative base raised to a whole number of 2^32-1 or more. `ROUND` and\n  `TRUNC` of a number with more than 28 digits no longer fail.\n\n"}
