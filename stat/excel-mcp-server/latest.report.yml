10:51:26Z"},{"id":786793546,"node_id":"RA_kwDON4OD8c4u5YRK","name":"excel_mcp_server-2.3.5.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":430920,"digest":"sha256:d70274008fea3418508506d0e713807ef84ffc7c14219d4e6f4c668d636f225e","download_count":4,"created_at":"2026-11-24T10:51:26Z","updated_at":"2026-11-24T10:51:26Z"}],"body":"\n### Security\n\n- `import_workbook` stored two kinds of external-data content that it should refuse: Power Query\n  queries (`DataMashup` parts, which can be binary) and XML parts that start with more than 64\n  bytes of whitespace, which the upload scan took for binary data and did not check, so a\n  padded data connection was stored. The scan now parses every part and refuses Power Query\n  parts (GHSA-rqj5-pgwc-mwjx, reported by @nikhilagrawalsf).\n\n### Fixed\n\n- Text that Excel reads as a time of day, such as `5 PM`, `5 a` or `5:30 p`, is no longer\n  converted to `#VALUE!`: the calculator now leaves formulas that turn such text into a number\n  uncalculated, as it does for date text. The pattern for it ended in a backspace character instead\n  of a word boundary and missed the one-letter forms (#277, reported and fixed by @kayaal34).\n\n","mentions_count":2}
