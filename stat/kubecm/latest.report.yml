"2026-11-05T01:35:24Z"},{"id":711626299,"node_id":"RA_kwDOC9JNaM4qao47","name":"kubecm_v0.36.0_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":16061788,"digest":"sha256:4b1886760b68c35b2a25a981b0fc2ab3310843e20af6bfed2c6f5abdcfb58b4a","download_count":10,"created_at":"2026-11-05T01:35:22Z","updated_at":"2026-11-05T01:35:24Z"}],"body":"## Upgrade notes\n\nBuilding from source now requires **Go 1.25.0 or newer**. The project's mise configuration pins Go 1.25.14 and the validation tools used by CI.\n\n## What's Changed\n\n- **Restore `--context-name` overrides.** Importing a context with `--context-name dev-85` now saves it as `dev-85`, instead of prepending the name to the original context. This fixes the regression introduced in v0.35.0 for file and standard-input imports. Existing collision handling is preserved. [#1207](https://github.com/sunny0826/kubecm/pull/1207)\n- **Consolidate dependency updates.** Update Kubernetes client-go, api and apimachinery to v0.35.2; Azure identity to v1.13.1; Azure Container Service v4 to v4.8.0; Tencent Cloud common to v1.3.51; `golang.org/x/crypto` to v0.52.0; and `golang.org/x/net` to v0.55.0. The Kubernetes dependency graph also upgrades gorilla/websocket beyond v1.5.3. [#1208](https://github.com/sunny0826/kubecm/pull/1208)\n- **Make dependency validation reproducible.** Pin development tools with mise, update Kubernetes test APIs, remove live GitHub-release dependencies from unit tests, and add package race tests, module consistency checks, and workflow validation to CI. [#1208](https://github.com/sunny0826/kubecm/pull/1208)\n- **Improve integration-test reliability.** Reuse existing Kind cluster configurations for range-deletion fixtures while retaining real-cluster integration coverage. [#1207](https://github.com/sunny0826/kubecm/pull/1207)\n- Fix the README Star History chart. [#1199](https://github.com/sunny0826/kubecm/pull/1199)\n- Refresh CI and release actions, including checkout, coverage reporting, and Homebrew formula updates.\n\n**Full Changelog**: https://github.com/sunny0826/kubecm/compare/v0.35.1...v0.36.0\n"}
