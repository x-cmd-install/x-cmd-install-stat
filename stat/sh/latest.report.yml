ws_amd64.exe","label":null,"uploader":{"login":"mvdan","id":3576549,"node_id":"MDQ6VXNlcjM1NzY1NDk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":3801600,"digest":"sha256:13629ce28442ca80b6b5a819f7574ab39e1c28c6e26734ca816c9714e04851df","download_count":968,"created_at":"2026-09-06T15:02:11Z","updated_at":"2026-09-06T15:02:13Z"}],"body":"- **syntax**\r\n  - Fix the indentation of heredocs nested inside command substitutions - #1403\r\n  - Keep literal tabs in `<<-` heredoc bodies rather than replacing them with spaces\r\n  - Don't indent heredocs without dashes nested in `<<-` ones, whose output no longer parsed\r\n  - Zsh: don't drop the prefix in short forms like `$#\"$foo\"` and `$+\"$foo\"` - #1405\r\n- **interp**\r\n  - Fix the build on 32-bit FreeBSD and NetBSD\r\n- **expand**\r\n  - Don't let escaped characters such as `\\*` act as glob metacharacters\r\n- **pattern**\r\n  - Treat unclosed extended operator groups like `@(a` as literals, avoiding a panic\r\n\r\nConsider [becoming a sponsor](https://github.com/sponsors/mvdan) if you benefit from the work that went into this release!\r\n\r\nBinaries built on `go version go1.27.1 linux/amd64` with:\r\n\r\n\tCGO_ENABLED=0 go build -trimpath -ldflags=\"-w -s\"","reactions":{"total_count":5,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0}}
