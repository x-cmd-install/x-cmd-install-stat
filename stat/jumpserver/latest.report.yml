:"quick_start.sh","label":"","uploader":{"login":"fit2bot","id":68588906,"node_id":"MDQ6VXNlcjY4NTg4OTA2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-shellscript","state":"uploaded","size":2473,"digest":"sha256:d69dd74d95d5998bac34a240e13130becd931bc687dfb1fb45830bc0e4cd1e15","download_count":1139,"created_at":"2026-10-20T10:58:46Z","updated_at":"2026-10-20T10:58:46Z"}],"body":"## Improvements\r\n\r\n- Update background task records to omit original args and kwargs at creation, reducing unnecessary parameter persistence\r\n- Strengthen persistent write protection for databases and Redis in high availability deployments across container restarts, recreation, and failure recovery\r\n- Improve redeployment completion checks to tolerate normal replication lag, and refine switchover waits and recovery coordination to reduce false failure detection\r\n\r\n## Bug Fixes\r\n\r\n- Validate Access Token format while preserving fallback compatibility with other Bearer Token authentication methods\r\n- Fix NLA configuration and RDP service refresh during Tinker applet host deployment, checking Group Policy and disabling listener NLA before installation, then verifying the configuration afterward; stop deployment with clear guidance when Group Policy requires NLA\r\n- Fix race conditions involving role callbacks, operation locks, and file synchronization acknowledgments during switchover, automatic rejoin, and startup recovery [JumpServer EE]\r\n- Improve MySQL/MariaDB replication position handling and crash recovery, and fix a race condition in PostgreSQL replication slot cleanup during standby rebuilds [JumpServer EE]\r\n- Fix local administrator credential recovery and health checks during MySQL/MariaDB maintenance, avoiding the use of peer credentials or stale application passwords [JumpServer EE]","reactions":{"total_count":5,"+1":1,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":0}}
