art.sh","label":null,"uploader":{"login":"baijiangjie","id":32935519,"node_id":"MDQ6VXNlcjMyOTM1NTE5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/x-sh","state":"uploaded","size":2456,"digest":"sha256:1fd428212c3b14083b70460cb7e9987c73aef49d54c947c072ad71cc3ec9242b","download_count":3193,"created_at":"2026-09-17T09:52:20Z","updated_at":"2026-09-17T09:52:22Z"}],"body":"## \u2728JumpServer v5.0.0 is now available! \u2728\r\n\r\nJumpServer began as an open source bastion host project in 2014. Through more than a decade of steady growth and continuous iteration, we have kept improving asset connectivity, access control, and operations auditing. The release of JumpServer v5.0 in 2026 marks the start of a new chapter.\r\n\r\nJumpServer v5.0 introduces a refreshed native client with a unified entry point for SSH, RDP, Kubernetes, database, and RemoteApp assets, alongside split views, a file workspace, a script library, and SFTP Server connections. New AI-assisted features include command recommendations, real-time operation risk alerts, and automated audit reports, helping teams work more efficiently and review operations more easily. The updated KoKo TUI makes it easier to find assets, choose accounts and protocols, and switch between sessions from an SSH terminal.\r\n\r\n<img width=\"775\" height=\"655\" alt=\"image\" src=\"https://github.com/user-attachments/assets/5cf932ad-5674-4296-b57a-a9190a7c220a\" />\r\n","reactions":{"total_count":193,"+1":39,"-1":0,"laugh":30,"hooray":33,"confused":0,"heart":31,"rocket":30,"eyes":30}}
