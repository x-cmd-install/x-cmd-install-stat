INrj","name":"quick_start.sh","label":"","uploader":{"login":"fit2bot","id":68588906,"node_id":"MDQ6VXNlcjY4NTg4OTA2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-shellscript","state":"uploaded","size":1929,"digest":"sha256:aef659901945c4a2536c791c0c2d6b1692dba433ae8fdc089b9a5e025a9c8072","download_count":2604,"created_at":"2026-08-20T12:51:18Z","updated_at":"2026-08-20T12:51:18Z"}],"body":"## What\u2019s new\r\n\r\n- Added the KOTL component to provide visualized operations and maintenance for JumpServer itself\r\n- Consolidated Magnus service ports, with automatic protocol detection based on incoming connection traffic\r\n- Added account policy support for file transfers, with enhanced account selection, permission validation, and anomalous asset confirmation\r\n- Added SMTP support for system CAs, custom CAs, and optional certificate verification\r\n- Introduced clipboard access control for graphical sessions, primarily RDP and VNC connections\r\n- Custom platform supports automated tasks, such as web asset change password\r\n\r\n## Improvements\r\n\r\n- Improved resource selection and data-loading performance for many-to-many fields in forms\r\n- Enhanced the search and filtering experience at the top of resource lists\r\n- Refined the interaction design for bulk-edit forms and bulk resource selection\r\n- Improved query performance for ticket-related APIs, reducing the number of SQL statements executed\r\n- Refined the API OPTIONS response structure by returning query metadata such as filters, ordering, and search as dedicated top-level fields\r\n- Simplified the user creation page by removing unique-name validation, allowing duplicate display names\r\n- Upgraded the Chen SQL parser\r\n- Enhanced Chen\u2019s parsing of PostgreSQL column type changes, including ALTER COLUMN TYPE, SET DATA TYPE, COLLATE, and USING\r\n- Added configurable timing parameters for user account and authorization expiration emails\r\n- Enhanced Chen\u2019s support for the Oracle SQL dialect\r\n- Upgraded the Huawei Cloud OBS SDK to 3.26.2 for improved object storage compatibility\r\n- Added FusionCompute user type configuration, supporting local users, domain users, and API integration users\r\n- Added support for creating custom ticket workflows and configuring CC recipients\r\n- Improved automation task logging\r\n- Optimized password-change credential push performance for automation tasks\r\n- Added su_from account support for network switches\r\n- Added global configuration options for user preferences\r\n- Improved the stability of rzsz file transfers in Koko\r\n- Updated password reset emails to display both the user\u2019s name and login username\r\n- Enhanced dependency checks when deleting organizations, including warnings for account template dependencies\r\n- Upgraded the Ansible Executor image to Python 3.14 and added the required AWS SDK dependencies\r\n- Enhanced the NEC VNC Proxy to support connections to macOS assets\r\n- Refined clipboard access control in Koko Web Terminal\r\n- Extended command storage support to Elasticsearch 9\r\n\r\n## Bug fixes\r\n\r\n- OAuth2 client authorization callbacks no longer generate Grant operation logs\r\n- Prevented errors caused by improper null-value handling when unbinding UKey serial numbers\r\n- Corrected an issue where -- line comments in Chen SQL could inadvertently comment out subsequent fields or expressions after formatting\r\n- Added proper handling for Oracle pagination syntax, including FETCH FIRST ... ROW ONLY and OFFSET ... ROW\r\n- Prevented Chen from incorrectly splitting Oracle SQL without semicolon delimiters into multiple statements\r\n- Resolved Chen connection failures affecting certain MySQL databases with Public Key Retrieval restrictions\r\n- Restored compatibility with LDAP services that prohibit anonymous queries\r\n- Addressed configuration test and access failures affecting certain S3-compatible object storage services\r\n- Eliminated collation conflicts when querying resource activity logs in certain database environments\r\n- Ensured database connections are properly released by LDAP worker threads, preventing connection errors\r\n- Guarded against timestamp processing errors caused by empty querysets during audit command cleanup\r\n- Restored authorization node search functionality in Job Center\r\n- Corrected database parameter passing in the PostgreSQL Ping module\r\n- Resolved Koko login failures when accessing Ubuntu assets through su_from accounts","reactions":{"total_count":30,"+1":6,"-1":0,"laugh":5,"hooray":5,"confused":0,"heart":5,"rocket":5,"eyes":4}}
