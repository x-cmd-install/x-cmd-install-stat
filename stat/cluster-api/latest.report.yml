ody":"## 👌 Kubernetes version support\r\n\r\n- Management Cluster: v1.33.x -> v1.37.x\r\n- Workload Cluster: v1.31.x -> v1.37.x\r\n\r\n[More information about version support can be found here](https://cluster-api.sigs.k8s.io/reference/versions.html)\r\n\r\n## Changes since v1.14.3\r\n## :chart_with_upwards_trend: Overview\r\n- 13 new commits merged\r\n- 5 bugs fixed 🐛\r\n\r\n## :bug: Bug Fixes\r\n- Cluster: Also set cluster-name label even if BeforeClusterCreate hook is blocking (#14326)\r\n- Cluster: Fix ControlPlaneInitialized reason when the control plane does not exist (#14437)\r\n- clusterctl: Fix clusterctl listing of resources whose kind ends in List (#14358)\r\n- KCP: Support KCP in-place updates when coredns and kube-proxy phases are skipped (#14364)\r\n- Machine: Stop checking kubelet version against an empty version (#14414)\r\n\r\n## :seedling: Others\r\n- CI: Fallback to alternate locations for Trivy DB (#14411)\r\n- ClusterCache: Reject file-based credentials in kubeconfigs (#14434)\r\n- clusterctl: Bump cert-manager to v1.21.3 (#14440)\r\n- Dependency: Bump corefile-migration to v1.0.36 (#14418)\r\n- Dependency: Bump go to 1.26.10 (#14393)\r\n- e2e: Pin kind binary version and download exact version (#14338)\r\n- Security: Bump go to 1.26.9 and dependencies for security (#14361)\r\n- Security: Fix typo in trivy DB mirror (#14448)\r\n\r\n## Dependencies\r\n\r\n### Added\r\n_Nothing has changed._\r\n\r\n### Changed\r\n- github.com/coredns/corefile-migration: [v1.0.35 → v1.0.36](https://github.com/coredns/corefile-migration/compare/v1.0.35...v1.0.36)\r\n- golang.org/x/crypto: v0.56.0 → v0.57.0\r\n- golang.org/x/mod: v0.38.0 → v0.41.0\r\n- golang.org/x/net: v0.58.0 → v0.60.0\r\n- golang.org/x/sync: v0.22.0 → v0.23.0\r\n- golang.org/x/sys: v0.47.0 → v0.48.0\r\n- golang.org/x/telemetry: 49f421f → a038080\r\n- golang.org/x/term: v0.45.0 → v0.46.0\r\n- golang.org/x/text: v0.41.0 → v0.42.0\r\n- golang.org/x/tools: v0.48.0 → v0.49.0\r\n\r\n### Removed\r\n_Nothing has changed._\r\n\r\n_Thanks to all our contributors!_ 😊\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
