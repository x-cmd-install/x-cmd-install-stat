# \ud83d\udc4c Kubernetes version support\r\n\r\n- Management Cluster: v1.33.x -> v1.37.x\r\n- Workload Cluster: v1.31.x -> v1.37.x\r\n\r\n[More information about version support can be found here](https://cluster-api.sigs.k8s.io/reference/versions.html)\r\n\r\n## Changes since v1.14.2\r\n## :chart_with_upwards_trend: Overview\r\n- 16 new commits merged\r\n- 6 bugs fixed \ud83d\udc1b\r\n\r\n## :bug: Bug Fixes\r\n- CI: Bump machine to `highcpu-32` (#14225)\r\n- Cluster: Also set cluster-name label on Clusters without ClusterClass (#14310)\r\n- KCP: Fix race in KCP proxy DialContext (#14278)\r\n- KCP: Try to match etcd member to machine being deleted by KCP (#14263)\r\n- Machine/MachineSet: Gracefully handle not-found when resolving owner references (#14250)\r\n- Misc: Implement support for multiNamespaceInformer in controller util consistency store (#14290)\r\n\r\n## :seedling: Others\r\n- CI: Add verify for downloaded binaries (#14275)\r\n- CI: Improve Kubernetes version resolution (#14276)\r\n- clusterctl: Bump cert-manager to v1.21.2 (#14238)\r\n- Dependency: Bump grpc to 1.83.2 to address security advisories (#14243)\r\n- Dependency: Update Otel version to v1.45.0 (#14315)\r\n- e2e: Extend e2e tests to detect double rollouts (#14279)\r\n- Runtime SDK: Improve discovery (#14261)\r\n- Testing: Fix flaky TestReconcileControlPlane by reading the Cluster with the API reader (#14300)\r\n- Testing: Restore apiVersionGetter after unit tests (#14255)\r\n\r\n:book: Additionally, there has been 1 contribution to our documentation and book. (#14228) \r\n\r\n## Dependencies\r\n\r\n### Added\r\n_Nothing has changed._\r\n\r\n### Changed\r\n- github.com/grpc-ecosystem/grpc-gateway/v2: [v2.28.0 \u2192 v2.29.0](https://github.com/grpc-ecosystem/grpc-gateway/compare/v2.28.0...v2.29.0)\r\n- go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc: v1.43.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/otel/exporters/otlp/otlptrace: v1.43.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/otel/metric: v1.44.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/otel/sdk/metric: v1.44.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/otel/sdk: v1.44.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/otel/trace: v1.44.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/otel: v1.44.0 \u2192 v1.45.0\r\n- go.opentelemetry.io/proto/otlp: v1.10.0 \u2192 v1.11.0\r\n- golang.org/x/net: v0.57.0 \u2192 v0.58.0\r\n- google.golang.org/genproto/googleapis/api: 3dc84a4 \u2192 6ac0973\r\n- google.golang.org/genproto/googleapis/rpc: 3dc84a4 \u2192 6ac0973\r\n- google.golang.org/grpc: v1.83.1 \u2192 v1.83.2\r\n\r\n### Removed\r\n_Nothing has changed._\r\n\r\n_Thanks to all our contributors!_ \ud83d\ude0a\r\n"}
