Z"},{"id":701311331,"node_id":"RA_kwDORilTHc4pzSlj","name":"elio-1.15.0-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8286251,"digest":"sha256:068f486964901b7dc159f0d7e46783f7053732d1ed6322edb2ff8cf1eb0dfe72","download_count":219,"created_at":"2026-11-02T10:09:21Z","updated_at":"2026-11-02T10:09:22Z"},{"id":701311326,"node_id":"RA_kwDORilTHc4pzSle","name":"elio_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":6335136,"digest":"sha256:6f9b369c47313a73884e1feb88123d444b3838f5cd9f8fb1d940c2bcaf099c8f","download_count":19,"created_at":"2026-11-02T10:09:21Z","updated_at":"2026-11-02T10:09:22Z"},{"id":701311375,"node_id":"RA_kwDORilTHc4pzSmP","name":"elio_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":5638832,"digest":"sha256:1f152859c80d07bbcf558b8da8d77fea3e044cff778c04d3cdc4d9cf62a3cf2d","download_count":8,"created_at":"2026-11-02T10:09:22Z","updated_at":"2026-11-02T10:09:23Z"}],"body":"### Added\n\n- Added native cross-platform item clipboard support through the Copy to Clipboard overlay (i → Item), allowing files and folders to be copied between elio and other desktop applications.\n- Added item pasting from the system clipboard via the terminal's paste shortcut and the configurable `paste_item` action (`Ctrl+v` by default).\n- Added clipboard text pasting to text-entry overlays via `paste_item`.\n- Added Trash support on Windows through the system drive's Recycle Bin. ([#355])\n- Added an item details overlay, opened with `i` or `Alt+Enter` by default.\n- Added `[focused_entry] reversed` to render focused file-browser entries with a reversed focus surface based on their effective name color. ([#328])\n\n### Changed\n\n- Changed `Ctrl+c` from cancel/clear selection to the configurable `copy_item` action, which copies items to the system clipboard.\n- Made clear selection and cancel configurable through the `clear_selection` and `cancel` actions, both bound to Esc by default.\n- Renamed the `copy_path` keybinding to `copy_to_clipboard`; `copy_path` remains accepted for existing configs.\n- Made Trash, Delete, and Restore popup scrollbars match the style of the rest of the scrollbars.\n- Made scrollbars draggable.\n\n### Fixed\n\n- Fixed the FileChooser portal closing when an app's remembered folder has been deleted. ([#375])\n- Fixed transparent file-browser indicator colors rendering as the terminal default color; `none` now hides the indicator while preserving the focused entry surface.\n\n","reactions":{"total_count":17,"+1":6,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":3,"rocket":2,"eyes":2}}
