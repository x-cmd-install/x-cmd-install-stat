58a446e23ae3789bb98d1662599c54b4ca492c3","download_count":30,"created_at":"2026-11-24T16:08:59Z","updated_at":"2026-11-24T16:08:59Z"},{"id":787879094,"node_id":"RA_kwDOAUP-J84u9hS2","name":"kubo_v0.43.2_windows-arm64.zip","label":"","uploader":{"login":"dennis-tra","id":11836793,"node_id":"MDQ6VXNlcjExODM2Nzkz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":39386801,"digest":"sha256:7607e6f884fe4d4a4e2ebf8c76b58ca8ddb9c3b1cb84dddc29a799f7b99c4266","download_count":19,"created_at":"2026-11-24T16:09:12Z","updated_at":"2026-11-24T16:09:23Z"},{"id":787879093,"node_id":"RA_kwDOAUP-J84u9hS1","name":"kubo_v0.43.2_windows-arm64.zip.cid","label":"","uploader":{"login":"dennis-tra","id":11836793,"node_id":"MDQ6VXNlcjExODM2Nzkz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":60,"digest":"sha256:a852e263e1e4f3e1b2bc88c087619b7f00e16b3192a7e3a3f735c58bd9f53dc6","download_count":10,"created_at":"2026-11-24T16:09:12Z","updated_at":"2026-11-24T16:09:12Z"},{"id":787879092,"node_id":"RA_kwDOAUP-J84u9hS0","name":"kubo_v0.43.2_windows-arm64.zip.sha512","label":"","uploader":{"login":"dennis-tra","id":11836793,"node_id":"MDQ6VXNlcjExODM2Nzkz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":161,"digest":"sha256:9fe7eec3e497dc31aea290d739325c3ad19934d11b63efeb0567407b222c059c","download_count":18,"created_at":"2026-11-24T16:09:12Z","updated_at":"2026-11-24T16:09:12Z"}],"body":"This is a bugfix release.\r\n\r\n### 🚒 Nodes no longer stop accepting inbound connections\r\n\r\n**Problem:** A node that accepts inbound connections could stop taking new peers after it had run for a while.\r\n\r\n**Reason:** If an inbound connection closed after its security handshake but before libp2p passed it to the node, the [resource manager](https://github.com/ipfs/kubo/blob/master/docs/libp2p-resource-management.md) kept the connection and file descriptor reservations for it. No socket stayed open, but these reservations added up until they filled `System.ConnsInbound`. From then on the node refused every new inbound connection, even when only a few connections were live. AutoNAT also started to report the node's addresses as unreachable, because the dial-backs were refused too. On busy public nodes this leaked thousands of reservations per day, and the default limit filled within hours to days. A restart cleared the reservations, but they built up again.\r\n\r\n**Fix:** [go-libp2p v0.52.0](https://github.com/libp2p/go-libp2p/releases/tag/v0.52.0) fixes the leak ([libp2p/go-libp2p#3564](https://github.com/libp2p/go-libp2p/issues/3564)).\r\n\r\nIf you raised `System.ConnsInbound` in `libp2p-resource-limit-overrides.json` or scheduled restarts to work around this, you can remove those changes after you upgrade.\r\n\r\n#### 📦️ Dependency updates\r\n\r\n- update `go-libp2p` to [0.52.0](https://github.com/libp2p/go-libp2p/releases/tag/0.52.0)\r\n\r\n### 📝 Changelog\r\n\r\n<details><summary>Full Changelog</summary>\r\n\r\n- github.com/ipfs/kubo:\r\n  - test(migrations): wait for migration before temp file check\r\n  - test(mfs): use random content in timeout test\r\n  - fix: v0.43.2 changelog highlights\r\n  - Merge branch 'release' into release-v0.43.2\r\n  - chore: update v0.43.2 changelog and contributors\r\n  - chore: bump version to v0.43.2\r\n- github.com/libp2p/go-libp2p (v0.49.0 -> v0.52.0):\r\n  - Release v0.52.0 ([libp2p/go-libp2p#3579](https://github.com/libp2p/go-libp2p/pull/3579))\r\n  - fix(upgrader): release scope of conns closed before Accept ([libp2p/go-libp2p#3568](https://github.com/libp2p/go-libp2p/pull/3568))\r\n  - Release v0.51.0\r\n  - chore: fix missing links error\r\n  - Release v0.50.0\r\n  - fix(http/auth): reject oversized opaque (#3540) ([libp2p/go-libp2p#3540](https://github.com/libp2p/go-libp2p/pull/3540))\r\n  - chore: upgrade quic-go to v0.62.0 and webtransport-go to v0.13.0 (#3541) ([libp2p/go-libp2p#3541](https://github.com/libp2p/go-libp2p/pull/3541))\r\n  - refactor: require go1.26 and apply go modernizers (#3536) ([libp2p/go-libp2p#3536](https://github.com/libp2p/go-libp2p/pull/3536))\r\n  - fix(holepunch): initialize timeout before registering notifiee (#3529) ([libp2p/go-libp2p#3529](https://github.com/libp2p/go-libp2p/pull/3529))\r\n  - test(basichost): add a stress test for reachability logic (#3533) ([libp2p/go-libp2p#3533](https://github.com/libp2p/go-libp2p/pull/3533))\r\n\r\n</details>\r\n\r\nSee [v0.43.0](https://github.com/ipfs/kubo/releases/tag/v0.43.0) and [v0.43.1](https://github.com/ipfs/kubo/releases/tag/v0.43.1) for full list of changes since v0.42.x.\r\n\r\n### 👨‍👩‍👧‍👦 Contributors\r\n\r\n| Contributor | Commits | Lines ± | Files Changed |\r\n|-------------|---------|---------|---------------|\r\n| [@gammazero](https://github.com/gammazero) | 2 | +208/-308 | 54 |\r\n| [@dennis-tra](https://github.com/dennis-tra) | 6 | +182/-111 | 6 |\r\n| [@yashksaini-coder](https://github.com/yashksaini-coder) | 2 | +227/-46 | 6 |\r\n| [@sukunrt](https://github.com/sukunrt) | 5 | +253/-13 | 9 |\r\n| [@MarcoPolo](https://github.com/MarcoPolo) | 1 | +73/-0 | 3 |\r\n| [@Tristan-Wilson](https://github.com/Tristan-Wilson) | 1 | +9/-9 | 2 |\r\n| [@bismuth01](https://github.com/bismuth01) | 1 | +3/-6 | 1 |\r\n","reactions":{"total_count":12,"+1":3,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":3,"rocket":3,"eyes":0}}
