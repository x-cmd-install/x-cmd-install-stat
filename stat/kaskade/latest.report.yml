 `kaskade` user (UID `10001`) on `python:3.14-slim` ([#153](https://github.com/sauljabin/kaskade/pull/153)). Mounted config files must be readable by UID `10001` on Linux, or run the container with `--user \"$(id -u):$(id -g)\"`.\n\n### Dependencies\n\n- **deps:** Bump the github-actions group with 3 updates ([#154](https://github.com/sauljabin/kaskade/pull/154)) ([d91e01b](https://github.com/sauljabin/kaskade/commit/d91e01b57d1fdc82465292af40978d59fb5ad914))\n- **deps:** Label Dependabot pull requests with dependencies only ([#160](https://github.com/sauljabin/kaskade/pull/160)) ([e1cafc2](https://github.com/sauljabin/kaskade/commit/e1cafc2c2c106284791f96aef1c31fef8fa258d3))\n- **deps:** Cap textual below 9 ([#172](https://github.com/sauljabin/kaskade/pull/172)) ([483b1e2](https://github.com/sauljabin/kaskade/commit/483b1e20addd93a9644465a377fdfa876226c4fe))\n\n### Fixes\n\n- **cli:** Stop printing the Authlib deprecation warning on every command ([#162](https://github.com/sauljabin/kaskade/pull/162)) ([da6ae5a](https://github.com/sauljabin/kaskade/commit/da6ae5a3c391c874423e2d6aeac90948d996fd92))\n- **admin:** Stop reporting programming errors as unavailable metrics ([#166](https://github.com/sauljabin/kaskade/pull/166)) ([c764bc7](https://github.com/sauljabin/kaskade/commit/c764bc7535266096429da244e940b058b1427b02))\n- **consumer:** Rebuild the consumer off the UI thread when filters change ([#169](https://github.com/sauljabin/kaskade/pull/169)) ([20b7a0b](https://github.com/sauljabin/kaskade/commit/20b7a0be5a6d6b467f9be830d67bc7ec1ba2115e))\n- **admin:** Hide consumer groups the principal cannot describe ([#173](https://github.com/sauljabin/kaskade/pull/173)) ([22c62eb](https://github.com/sauljabin/kaskade/commit/22c62ebf6eae2a34ed1495d337fd4f1191afae0d))\n- **site:** Draw box-drawing glyphs as paths and redraw the social preview ([#175](https://github.com/sauljabin/kaskade/pull/175)) ([bb709bb](https://github.com/sauljabin/kaskade/commit/bb709bb62af5a60f738ed4990828d4d7881529ba))\n\n### Documentation\n\n- **usage:** Suggest an optional ksk shell alias ([#167](https://github.com/sauljabin/kaskade/pull/167)) ([0024cb3](https://github.com/sauljabin/kaskade/commit/0024cb3ec245d93a375ecd0a59b80bf0cf8ad38e))\n- **usage:** Drop the unused cluster Describe ACL for admin ([#168](https://github.com/sauljabin/kaskade/pull/168)) ([8460cb2](https://github.com/sauljabin/kaskade/commit/8460cb2077728a315dbbad2ac25083ee72a4993d))\n- **usage:** Drop the ksk naming rationale ([#174](https://github.com/sauljabin/kaskade/pull/174)) ([c80c8cd](https://github.com/sauljabin/kaskade/commit/c80c8cd982decd6c169dfcfb441811353bcdffed))\n\n\n**Full Changelog:** [v5.0.1...v5.0.2](https://github.com/sauljabin/kaskade/compare/v5.0.1...v5.0.2)\n\n"}
