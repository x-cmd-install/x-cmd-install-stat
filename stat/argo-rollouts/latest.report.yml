-27T15:36:23Z"}],"body":"## [v1.10.0](https://github.com/argoproj/argo-rollouts/compare/v1.10.0-rc1...v1.10.0) (2026-08-05)\r\n\r\n### Fix\r\n\r\n* guard empty Values in injected anti-affinity check (cherry-pick [#4832](https://github.com/argoproj/argo-rollouts/issues/4832) for 1.10) ([#4917](https://github.com/argoproj/argo-rollouts/issues/4917))\r\n* uprade pnpm for sbom (cherry-pick [#4821](https://github.com/argoproj/argo-rollouts/issues/4821) for 1.10) ([#4830](https://github.com/argoproj/argo-rollouts/issues/4830))\r\n* **controller:** skip unnecessary ephemeral metadata pod listing (cherry-pick [#4951](https://github.com/argoproj/argo-rollouts/issues/4951) for 1.10) ([#4952](https://github.com/argoproj/argo-rollouts/issues/4952))\r\n* **controller:** sync desired-replicas annotation during abort scale-\u2026 ([#4919](https://github.com/argoproj/argo-rollouts/issues/4919))\r\n* **controller:** log the underlying error when newRolloutContext returns nil (cherry-pick [#4850](https://github.com/argoproj/argo-rollouts/issues/4850) for 1.10) ([#4906](https://github.com/argoproj/argo-rollouts/issues/4906))\r\n* **controller:** select namespace-support notification controller via self-service flag (cherry-pick [#4851](https://github.com/argoproj/argo-rollouts/issues/4851) for 1.10) ([#4866](https://github.com/argoproj/argo-rollouts/issues/4866))\r\n* **controller:** Downgrade log level for unconfigured notification triggers. Fixes [#3459](https://github.com/argoproj/argo-rollouts/issues/3459) (cherry-pick [#4833](https://github.com/argoproj/argo-rollouts/issues/4833) for 1.10) ([#4849](https://github.com/argoproj/argo-rollouts/issues/4849))\r\n* **controller:** prevent panic when notifications write Unstructured \u2026 (cherry-pick [#4844](https://github.com/argoproj/argo-rollouts/issues/4844) for 1.10) ([#4846](https://github.com/argoproj/argo-rollouts/issues/4846))\r\n* **controller:** deepcopy ALB status updates. Fixes [#3673](https://github.com/argoproj/argo-rollouts/issues/3673), [#4184](https://github.com/argoproj/argo-rollouts/issues/4184) (cherry-pick [#4780](https://github.com/argoproj/argo-rollouts/issues/4780) for 1.10) ([#4916](https://github.com/argoproj/argo-rollouts/issues/4916))\r\n* **experiments:** add API fallback when ReplicaSet lister is stale on AlreadyExists ([#4842](https://github.com/argoproj/argo-rollouts/issues/4842)) (cherry-pick [#4855](https://github.com/argoproj/argo-rollouts/issues/4855) for 1.10) ([#4870](https://github.com/argoproj/argo-rollouts/issues/4870))\r\n\r\n### Test\r\n\r\n* fixed flaky test close channel (cherry-pick [#4908](https://github.com/argoproj/argo-rollouts/issues/4908) for 1.10) ([#4909](https://github.com/argoproj/argo-rollouts/issues/4909))\r\n* fix flaky unit test TestListWithWatch (cherry-pick [#4905](https://github.com/argoproj/argo-rollouts/issues/4905) for 1.10) ([#4907](https://github.com/argoproj/argo-rollouts/issues/4907))"}
