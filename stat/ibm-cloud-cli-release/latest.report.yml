{"id":378589359,"author":{"login":"steveclay","id":10873292,"node_id":"MDQ6VXNlcjEwODczMjky","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBEDbBs4WkNCv","tag_name":"v2.47.0","target_commitish":"master","name":"v2.47.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-22T18:19:08Z","updated_at":"2026-08-28T16:16:53Z","published_at":"2026-08-28T16:16:53Z","assets":[],"body":"## Installers\r\n\r\n[Mac OS X 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0.pkg)\r\n[Mac OS X M1/ARM](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_arm64.pkg)\u00a0\r\n[Windows 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_amd64.exe)\r\n[Windows 32 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_386.exe)\r\n[Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_amd64.tar.gz)\r\n[Linux 64 bit ARM](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_arm64.tar.gz) \r\n[Linux 32 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_386.tar.gz)\r\n[Power Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_ppc64le.tar.gz)\r\n[System/390 Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/IBM_Cloud_CLI_2.47.0_s390x.tar.gz)\r\n\r\n## Binaries\r\n\r\n[Mac OS X 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_macos.tgz)\r\n[Mac OS X M1/ARM](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_macos_arm64.tgz) \r\n[Windows 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_windows_amd64.zip)\r\n[Windows 32 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_windows_386.zip)\r\n[Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_linux_amd64.tgz)\r\n[Linux 64 bit ARM](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_linux_arm64.tgz) \r\n[Linux 32 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_linux_386.tgz)\r\n[Power Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_linux_ppc64le.tgz)\r\n[System/390 Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.47.0/binaries/IBM_Cloud_CLI_2.47.0_linux_s390x.tgz)\r\n\r\nTo verify installed binaries, please see [here](https://github.com/IBM-Cloud/ibm-cloud-cli-release/wiki/Verify-Binaries)\r\n\r\n### Note for Windows users: \r\n\r\nWith this release a new certificate has been used for signing. On Windows, there may be a pop-up message `Windows protected your PC` that requires clicking `More info` and `Run anyway`. This is until Microsoft Defender sees sufficient installations with the new certificate that it accepts the reputation of the binary as [documented by Microsoft here](https://learn.microsoft.com/en-us/windows/apps/package-and-deploy/smartscreen-reputation).\r\n\r\n## Change logs\r\n\r\n## Commands Changed\r\n- `plugin validate` is improved to better handle flag enums and multi-line usage sections\r\n\r\n## Bug Fixes\r\n- `iam activity-report-create` command corrects inconsistent handling of the `--type` flag and provides deterministic output\r\n- `iam trusted-profile-rule-create` / `trusted-profile-link-create` document additional `--cr-type` settings in the help text\r\n\r\n## Other Changes\r\n- Golang version 1.27.0\r\n- IBM Cloud CLI SDK version 1.13.0\r\n- IBM Cloud Dev plug-in version 3.5.7 (for open source vulnerability updates)\r\n"}
