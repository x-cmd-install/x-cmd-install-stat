9.0_windows_386.zip)\r\n[Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.49.0/binaries/IBM_Cloud_CLI_2.49.0_linux_amd64.tgz)\r\n[Linux 64 bit ARM](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.49.0/binaries/IBM_Cloud_CLI_2.49.0_linux_arm64.tgz) \r\n[Linux 32 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.49.0/binaries/IBM_Cloud_CLI_2.49.0_linux_386.tgz)\r\n[Power Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.49.0/binaries/IBM_Cloud_CLI_2.49.0_linux_ppc64le.tgz)\r\n[System/390 Linux 64 bit](https://download.clis.cloud.ibm.com/ibm-cloud-cli-dn/2.49.0/binaries/IBM_Cloud_CLI_2.49.0_linux_s390x.tgz)\r\n\r\nTo verify installed binaries, please see [here](https://github.com/IBM-Cloud/ibm-cloud-cli-release/wiki/Verify-Binaries)\r\n\r\n## Change logs\r\n\r\n## New Commands\r\n- `billing focus-report` adds a billing report in the [FOCUS format](https://focus.finops.org/)\r\n\r\n## Commands Changed\r\n- `iam account-settings` displays Account Invite Domain information\r\n- `iam account-settings-update` adds `--restrict-user-invitations-domains`, `--restrict-user-invitations-realm`, `--restrict-user-list-visibility`, and `--unset-restrict-user-invitations` to manage the Account Invite Domain settings\r\n\r\n## Bug Fixes\r\n- Windows version displays commands in help messages without the path\r\n\r\n## Other Changes\r\n- Golang version 1.27.3\r\n- IBM Cloud SDK version 1.14.1\r\n- IBM Cloud Dev plug-in version 3.5.10 (for open source vulnerability updates)"}
