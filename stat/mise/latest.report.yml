ed release, and Homebrew tap formulae can pour bottles and download from private GitHub releases. This release also fixes `http:` checksum verification, shims for `path:` versions, `mise unuse -g` with split global configs, Windows Server Core startup, and several task, bootstrap and Java issues.\n\n## Added\n\n### Bootstrap\n\n- **MacPorts package manager.** On macOS, you can declare ports in `[bootstrap.packages]` with the `macports:` prefix and install or remove them with `mise bootstrap`. mise finds `port` on `PATH` or at `/opt/local/bin/port`, and runs installs, upgrades and removals through the existing sudo handling. It never runs `port selfupdate` and does not install MacPorts itself. Version pins are checked against the active port but can't be installed. Unprefixed keys don't use MacPorts unless you add it to `system_packages.prefer`. [#15862](https://github.com/jdx/mise/pull/15862) (@jdx, @snuxoll)\n\n  ```toml\n  [bootstrap.packages]\n  \"macports:ripgrep\" = \"latest\"\n  \"macports:bc\" = { state = \"absent\" }\n  ```\n\n- **Update mise before tools.** Both options are opt-in and the defaults are unchanged. [#15897](https://github.com/jdx/mise/pull/15897) (@jdx)\n  - `mise bootstrap --self-update` updates mise, then runs the same bootstrap again with the new binary. If the update fails, nothing is applied. The flag is ignored with `--dry-run` and for subcommands.\n  - `tool_update.self_update_first = true` makes each automatic tool update pass check for and install a newer mise first. This requires `self_update.auto`. If the mise update fails, tools are skipped until the next interval and `mise doctor` shows the error. It is skipped in CI, in offline modes and for mise installed by a package manager.\n\n  ```toml\n  [settings]\n  self_update.auto = true\n  tool_update.self_update_first = true\n  ```\n\n### Homebrew taps (system packages)\n\n- Formulae from third-party taps now pour the bottles the tap declares in its `bottle do` block instead of always building from source. Only a bottle for the exact host tag or `all` is used. Formulae with `post_install` or `pour_bottle?` restrictions still build from source. [#15893](https://github.com/jdx/mise/pull/15893) (@jdx)\n- Tap formulae that use a custom download strategy to fetch GitHub release assets, usually from a private repo, can now be installed. mise doesn't run the Ruby strategy. It downloads the asset through the GitHub API with your configured GitHub credentials (`MISE_GITHUB_TOKEN`, `github.credential_command`, and so on) and checks its sha256. This works for both source builds and bottles. Other custom strategies are still rejected. [#15898](https://github.com/jdx/mise/pull/15898) (@jdx)\n- Source builds now support `virtualenv_install_with_resources` from Homebrew's `Language::Python::Virtualenv`. mise verifies each resource against its sha256 and installs it into a venv in the keg's `libexec`, then links the formula's console scripts into `bin`. [#15896](https://github.com/jdx/mise/pull/15896) (@jdx)\n\n### Tools\n\n- **`version_order = \"published_at\"`** makes `latest` follow the release that was published most recently, even when its version number is lower. This is useful for repos that ship both stable and prerelease builds, where GitHub doesn't always list releases in publication order. `mise latest`, `mise upgrade` and `auto_update` all use this order. It works with github, gitlab and forgejo tools. [#15860](https://github.com/jdx/mise/pull/15860) (@jdx)\n\n  ```toml\n  [tools]\n  \"github:openai/codex\" = { version = \"latest\", prerelease = true, version_prefix = \"rust-v\", version_order = \"published_at\" }\n  ```\n\n- **`exclude-newer = false` on a PyPI index.** It turns off the `minimum_release_age` cutoff for packages from that index only. Use it for indexes that don't serve upload times, such as GitLab's PEP 503 index. Previously, uv filtered out every release from those indexes. `false` is the only accepted value. [#15885](https://github.com/jdx/mise/pull/15885) (@jdx)\n\n  ```toml\n  indexes = [{ name = \"private\", url = \"<index-url>\", explicit = true, exclude-newer = false }]\n  ```\n\n- New registry shorthand `rtk-proxy` for the proxy daemon that ships in `rtk-ai/rtk` releases. Note that the proxy is licensed separately (BUSL-1.1). [#15915](https://github.com/jdx/mise/pull/15915) (@jdx)\n\n### Tasks\n\n- **`if_pool` on task locks.** With `if_pool = true`, a task takes the lock only on machines whose `task.lock_pools` declares that name. On other machines it runs without the lock. It also works with `count`. [#15917](https://github.com/jdx/mise/pull/15917) (@jdx)\n\n  ```toml\n  [tasks.benchmarks]\n  lock = { name = \"xcode\", if_pool = true }\n  ```\n\n### Dotfiles and GitHub tokens\n\n- **`history.allow_secret_values`.** This global-only setting (also `MISE_HISTORY_ALLOW_SECRET_VALUES`) lists specific values that the dotfile history secret scan ignores, such as `\"ctx7_api_key\"`. A listed placeholder no longer blocks history sync. The same key with another value, or a real token on the same line, is still refused, and the rest of the scan stays on. [#15864](https://github.com/jdx/mise/pull/15864) (@jdx)\n- When `gh` keeps its token in the system keyring, `mise token github` now prints a hint on stderr that suggests a `credential_command` using `gh auth token`. Stdout and `--raw` output are unchanged. [#15868](https://github.com/jdx/mise/pull/15868) (@jdx, @FalkWoldmann)\n\n## Fixed\n\n### Installs and tools\n\n- `http:` tools with `checksum_url` now verify the download against the published checksum when installing, and record that checksum in `mise.lock`. Previously the checksum was used only by `mise lock`, so a wrong download could install without an error. A mismatch or an unresolvable checksum now fails the install. An explicit `checksum` or lockfile entry still takes precedence. [#15908](https://github.com/jdx/mise/pull/15908) (@jdx)\n- `mise reshim` now creates shims for tools whose version is `path:...`. Previously a shim-based shell reported `command not found` even though `mise which` found the tool. [#15866](https://github.com/jdx/mise/pull/15866) (@jdx)\n- Archives that contain absolute symlinks to files inside the same archive (for example osquery's `/opt/...` links) install again. mise rewrites those links as relative links. Links to paths outside the archive are still refused. [#15857](https://github.com/jdx/mise/pull/15857) (@jdx, @bendrucker)\n- A non-root `mise install` no longer fails with `failed to rebuild runtime symlinks` when a tool is installed only in another user's read-only shared or system installs directory. [#15858](https://github.com/jdx/mise/pull/15858) (@jdx)\n- `gem:` tools keep working after a Ruby patch upgrade when one of their dependencies was installed only in the old Ruby's gem directory. mise now copies those dependencies into the tool's own install. [#15907](https://github.com/jdx/mise/pull/15907) (@jdx)\n- `mise upgrade` now detects new commits for npm git sources that track HEAD, so `--prune` removes the old commit. Previously, commit SHAs were compared as version strings. [#15905](https://github.com/jdx/mise/pull/15905) (@jdx)\n- `.sdkmanrc` Temurin versions with a fourth segment now install. Hotfix versions such as `26.0.2.1+1-tem` and regular releases such as `21.0.13.0+9-tem` now map to the matching catalog builds. [#15877](https://github.com/jdx/mise/pull/15877), [#15906](https://github.com/jdx/mise/pull/15906) (@jdx)\n- `mise oci push` now rewrites both lines of uv's long-path launcher in `pypi:` tool layers. Previously, images built in CI could fail with `.../.mise-uv/.venv/bin/python: not found`. Layers cached from earlier pushes are not reused. [#15879](https://github.com/jdx/mise/pull/15879) (@jdx)\n\n### Windows\n\n- `mise.exe` and `mise-shim.exe` now link the C runtime statically, so they start on Windows Server Core images without the VC++ redistributable. Previously they exited silently with `0xC0000135`. [#15852](https://github.com/jdx/mise/pull/15852) (@jdx)\n- `mise activate bash` in Git Bash now produces valid `PATH` entries when mise was installed with Scoop and runs through the Scoop shim. [#15863](https://github.com/jdx/mise/pull/15863) (@jdx)\n\n### Config and CLI\n\n- `mise unuse -g` now removes a tool from every global config file that declares it, including files written through `settings.write_targets.tools`. Previously it edited only `config.toml` and did nothing for tools declared elsewhere. `unuse` also warns when none of the given tools are declared, instead of exiting silently. [#15884](https://github.com/jdx/mise/pull/15884) (@jdx, @theblop)\n- `enable_tools` and `disable_tools` (and `MISE_ENABLE_TOOLS`/`MISE_DISABLE_TOOLS`) now accept the same legacy names as `[tools]`, such as `nodejs`, `golang`, `dotnet-core` and `core:` prefixes. [#15880](https://github.com/jdx/mise/pull/15880) (@jdx, @mfroembgen)\n- Commands such as `mise install` no longer warn about ignored global-only settings in tracked configs from other folders, because those settings never apply to the current folder. The warning still appears inside the folder that owns the config. [#15919](https://github.com/jdx/mise/pull/15919) (@jdx, @owpac)\n- Tera deprecation warnings now name the config file that uses the deprecated helper. [#15927](https://github.com/jdx/mise/pull/15927) (@jdx, @Thomascountz)\n- `mise doctor` no longer crashes when an asdf or vfox plugin repo has no commits. It shows the plugin as `(unknown)`, and plugin install or update now reports an error in this case instead of panicking. [#15850](https://github.com/jdx/mise/pull/15850) (@jdx, @xanathar)\n\n### Tasks and deps\n\n- A bare `depends` name in a monorepo task now falls back to a global task when the project has no task with that name. `depends = [\"::name\"]` now gives a clearer error. [#15851](https://github.com/jdx/mise/pull/15851) (@jdx)\n- Tasks with `cache.command_inputs` no longer fail with `command output pipes did not close within 10s` on heavily loaded machines. [#15916](https://github.com/jdx/mise/pull/15916) (@jdx, @brodienguyen)\n- With `rust` configured, `mise run` now checks each toolchain's rustup state once per run instead of twice. [#15878](https://github.com/jdx/mise/pull/15878) (@jdx)\n- `mise deps` now marks the `uv` provider stale when a workspace member's `pyproject.toml` changes. It also marks the `pnpm` provider stale when `pnpm-workspace.yaml` or a member's `package.json` changes. An explicit `sources` list still replaces the defaults. [#15918](https://github.com/jdx/mise/pull/15918), [#15926](https://github.com/jdx/mise/pull/15926) (@jdx)\n\n### Bootstrap and system packages\n\n- `mise bootstrap` now runs a monorepo root's `bootstrap` task (`//:bootstrap`). Previously it was skipped. [#15853](https://github.com/jdx/mise/pull/15853) (@jdx)\n- If no remote environment is set with `mise_env` or `--remote-env`, `mise bootstrap remote` now lets the host's miserc choose its config environments. Previously it forced an empty `MISE_ENV`. An explicit `mise_env = []` still selects none. [#15865](https://github.com/jdx/mise/pull/15865) (@jdx, @Guria)\n- `mise bootstrap --dry-run` now previews dotfiles declared by a conf.d config that a `mode = \"template\"` dotfile renders. The preview only renders templates that don't need commands, environment variables, file reads or secrets. [#15861](https://github.com/jdx/mise/pull/15861) (@jdx)\n- A cask that can't be resolved, such as one from a tap that returns 404, is now reported as `error` on its own line. Other packages are still checked and applied, and the command exits non-zero at the end. Previously the whole status check or bootstrap stopped. [#15909](https://github.com/jdx/mise/pull/15909) (@jdx)\n- `mise bootstrap packages prune` now keeps the runtime dependencies (including indirect ones) of the formulae you declared, so it no longer removes libraries they link against. [#15890](https://github.com/jdx/mise/pull/15890) (@jdx)\n- Casks from third-party taps that use `command_wrapper` now install. Previously they failed with an unsupported DSL error, which also broke the cask check in `mise doctor`. [#15891](https://github.com/jdx/mise/pull/15891) (@jdx)\n- mise can now infer the version of a tap formula whose archive name has no dots, such as `LUFA-210130.tar.gz` or a date. [#15892](https://github.com/jdx/mise/pull/15892) (@jdx)\n- When a `[dotfiles]` merge key has no `/<id>` segment, the error now says so and suggests the corrected key. [#15859](https://github.com/jdx/mise/pull/15859) (@jdx)\n\n## Documentation\n\n- The guide for authors of settings plugins moved into the Writing plugins docs. [#15846](https://github.com/jdx/mise/pull/15846) (@jdx, @syhol)\n\n**Full Changelog**: https://github.com/jdx/mise/compare/v2026.11.10...v2026.11.11\n\n## 💚 Sponsor mise\n\nmise is built and maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.\n\nIf mise saves you or your team time, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep mise fast, free, and independent.\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":12}
