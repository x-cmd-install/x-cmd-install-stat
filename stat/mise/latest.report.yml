node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:17a3438189cec0c094c5862385b5546acb70d3c2157789654b7c4fe24d079b35","download_count":53988,"created_at":"2026-10-11T09:59:30Z","updated_at":"2026-10-11T09:59:30Z"},{"id":630388886,"node_id":"RA_kwDOIvux3s4lkviW","name":"SHASUMS512.asc","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":7021,"digest":"sha256:81fb7aaca703bc29eafeb26c7f0cb86971ba927c371cbd8cb890e1ac7005cf93","download_count":22,"created_at":"2026-10-11T09:59:30Z","updated_at":"2026-10-11T09:59:30Z"},{"id":630388907,"node_id":"RA_kwDOIvux3s4lkvir","name":"SHASUMS512.txt","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":6139,"digest":"sha256:538ae71cfc670ca0919af073e6367aa35ea2de50d432dff86f496ba9bf20fb4e","download_count":23,"created_at":"2026-10-11T09:59:30Z","updated_at":"2026-10-11T09:59:30Z"},{"id":630388919,"node_id":"RA_kwDOIvux3s4lkvi3","name":"SHASUMS512.txt.minisig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:d4a6727da3ba7c3817f735b0fdc848b385cfa6f8a5fb0748e6261266a3d288e7","download_count":19,"created_at":"2026-10-11T09:59:30Z","updated_at":"2026-10-11T09:59:31Z"},{"id":630389743,"node_id":"RA_kwDOIvux3s4lkvvv","name":"v2026.10.8.tar.gz.sig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:2e836e17aff8cd8f4101d9696e32e3d6ce50a4a8d98fbc9e3926441df2e8fbad","download_count":19,"created_at":"2026-10-11T09:59:55Z","updated_at":"2026-10-11T09:59:55Z"}],"body":"Each tool's install directory now has a `global` link that follows your global config, which gives IDEs a path that doesn't change when you switch versions. This release also retries downloads whose response body drops partway through, fixes lockfile checks for release tags that contain `@`, and stops dotfiles history from rewriting files that haven't changed.\n\n## Added\n\n- **`global` runtime symlink.** Each tool's install directory now has a `global` link to the version your global and system config select. Programs that can't run mise, such as IDEs, can point at this path and follow `mise use -g` changes. [#14271](https://github.com/jdx/mise/pull/14271)\n\n  ```text\n  ~/.local/share/mise/installs/maven/\n  \u251c\u2500\u2500 3.9.13/\n  \u251c\u2500\u2500 3.9.16/\n  \u2514\u2500\u2500 global -> ./3.9.16\n  ```\n\n  The link is updated along with the other runtime symlinks (`latest`, `3`, ...), for example after `mise use -g`, `mise install` and `mise upgrade`. Project config and `MISE_*_VERSION` don't change it. If no global config selects the tool, mise removes the link. A real directory named `global` is left alone. The link is always on, and no setting turns it off.\n\n## Fixed\n\n- HTTP requests now retry, up to `http_retries`, when the response body drops partway through. Before, only the request and headers were retried, so a version list or release page cut off mid-transfer failed with `error decoding response body`. This applies to text, JSON and byte requests, and to version lists read with `version_regex`. [#14253](https://github.com/jdx/mise/pull/14253) (@JamBalaya56562)\n- `mise install` no longer rejects lockfile entries whose release tag contains `@`, such as `cli@0.46.0`. `mise lock` writes these tags percent-encoded (`cli%400.46.0`), and the locked-URL check read that as version `400.46.0`. Re-running `mise lock` couldn't fix it. [#14252](https://github.com/jdx/mise/pull/14252)\n- Dotfiles history index rebuilds now skip checkpoint metadata files whose contents haven't changed. On large histories, rebuilds used to rewrite every file, which caused minutes of disk writes and made `mise dot save` fail with `another history operation is running`. [#14249](https://github.com/jdx/mise/pull/14249)\n- The JSON schema now accepts `outputs = { auto = false }` on tasks, so editors and linters such as tombi and Taplo no longer flag it. mise's behavior is unchanged: `auto = false` means the same as leaving `outputs` unset. [#14265](https://github.com/jdx/mise/pull/14265) (@JamBalaya56562)\n\n## Documentation\n\n- The dotfiles docs now open with a recommended setup, and the modes-and-keys reference table has been reorganized into three readable columns. [#14267](https://github.com/jdx/mise/pull/14267)\n\n## Registry\n\n- New aqua packages: [`runxhq/runx`](https://github.com/runxhq/runx) and [`takumin/passt-bin`](https://github.com/takumin/passt-bin).\n\n**Full Changelog**: https://github.com/jdx/mise/compare/v2026.10.7...v2026.10.8\n\n## \ud83d\udc9a Sponsor mise\n\nmise is built and maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.\n\nIf mise saves you or your team time, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep mise fast, free, and independent.\n","reactions":{"total_count":4,"+1":3,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
