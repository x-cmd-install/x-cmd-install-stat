abel":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:a9bb864d0f839e9c90a1fa267f2e9761aa75178078cf05b093802fc8073943dd","download_count":7765,"created_at":"2026-10-16T18:11:53Z","updated_at":"2026-10-16T18:11:53Z"},{"id":648171822,"node_id":"RA_kwDOIvux3s4molEu","name":"SHASUMS512.asc","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":7057,"digest":"sha256:26ef58615c9e6cdd1e1bf85b1be45a8f4a0820bf527e1e556fe017f3a98de94c","download_count":8,"created_at":"2026-10-16T18:11:53Z","updated_at":"2026-10-16T18:11:53Z"},{"id":648171821,"node_id":"RA_kwDOIvux3s4molEt","name":"SHASUMS512.txt","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":6175,"digest":"sha256:59640642eaada758551657e9c978f5eb0f7466b35d610f93e8ec143170d9a4b9","download_count":12,"created_at":"2026-10-16T18:11:53Z","updated_at":"2026-10-16T18:11:53Z"},{"id":648171849,"node_id":"RA_kwDOIvux3s4molFJ","name":"SHASUMS512.txt.minisig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:7f4926929ab3f379d91a25aba61a64f8f557b88aa8480eb2e1a350600395da5f","download_count":10,"created_at":"2026-10-16T18:11:54Z","updated_at":"2026-10-16T18:11:54Z"},{"id":648172929,"node_id":"RA_kwDOIvux3s4molWB","name":"v2026.10.12.tar.gz.sig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:e65eafb9d2bedc63da78bd27a75ba7dc80da4986667d64df5f86f112536d8b41","download_count":5,"created_at":"2026-10-16T18:12:19Z","updated_at":"2026-10-16T18:12:19Z"}],"body":"PyPI and pipx tools can now choose their own Python runtime, the workspace graph can read Gradle multi-module builds, and `env._.file` can search parent directories. When mise-versions is having an outage, GitHub lookups now retry on `api.github.com`, and `_.source` scripts no longer pick up `~/.bashrc` when mise is launched from an editor.\n\n## Added\n\n- **Per-tool Python for `pypi:` tools.** Set `python` to a minor series or an exact version, and mise installs that runtime and passes it to uv or pipx for that tool only. The runtime stays private to the tool and does not become your shell's default Python. `mise lock` records the selected Python with the tool, and `mise prune` keeps any runtime that a retained tool environment still uses. You can't combine `python` with `--python`/`-p` in `uvx_args` or `pipx_args`. Tools that don't set `python` behave as before. [#14479](https://github.com/jdx/mise/pull/14479) (@jdx)\n\n  ```toml\n  [tools]\n  \"pypi:black\" = { version = \"latest\", python = \"3.12\" }\n  \"pypi:ruff\" = { version = \"latest\", python = \"3.12.12\" }\n  ```\n\n  If you change a tool's `python`, mise installs a new environment instead of reusing the old one. If that install fails, the previous working environment is left untouched. [#14504](https://github.com/jdx/mise/pull/14504) (@jdx)\n\n- **Gradle workspace discovery.** `mise tasks graph` and `mise run --affected` now find projects listed by `include` in `settings.gradle` or `settings.gradle.kts`, using Groovy or Kotlin syntax. Project IDs follow Gradle paths: `:app` becomes `gradle::app`, and the root project is `gradle::`. Literal `project(\":lib\")` references in a project's top-level `dependencies {}` block become graph edges. mise reads the scripts as text and never runs Gradle. If an `include` is computed or conditional, a `projectDir` isn't a plain `file(\"...\")` literal, or both settings files exist, mise reports an error that points to `[monorepo.projects.\"gradle:...\"]` overrides. Editing the settings script marks every Gradle project as affected. Based on a prototype by @Jarvvski. [#14512](https://github.com/jdx/mise/pull/14512) (@jdx)\n\n- **`find_up` for `env._.file`.** With `find_up = true`, mise looks for a relative path in the current directory and in every parent, so a global config can load each project's `.env` files. Files load from the root down, so values in closer files win. The default is `false`, and the option has no effect on absolute paths. [#14497](https://github.com/jdx/mise/pull/14497) (@jdx)\n\n  ```toml\n  # ~/.config/mise/config.toml\n  [env]\n  _.file = [\n    { path = \".env\", find_up = true },\n    { path = \".env.local\", find_up = true },\n  ]\n  ```\n\n- **Detect git-rewritten files in `watch_files` hooks.** mise sets `MISE_WATCH_FILES_GIT_REWRITTEN=1` when every changed file was last written before git's most recent HEAD move (checkout, pull, rebase). Commits don't count as HEAD moves. Hooks such as format-on-edit can use this to skip files the user didn't edit. `git stash pop`/`apply` don't move HEAD, so mise doesn't detect them. [#14511](https://github.com/jdx/mise/pull/14511) (@jdx)\n\n  ```toml\n  [[watch_files]]\n  patterns = [\"**/*.go\"]\n  run = '[ -n \"$MISE_WATCH_FILES_GIT_REWRITTEN\" ] || { IFS=:; hk fix $MISE_WATCH_FILES_MODIFIED; }'\n  ```\n\n- **`.tera` sources inferred for dotfile group templates.** A `mode = \"template\"` entry in `[dotfile_groups]` no longer needs a `source` just to point at a `.tera` file. If the exact path doesn't exist, mise falls back to the same path with `.tera` added. An explicit `source` still takes precedence, and the `.tera` file is not also deployed under its suffixed name. [#14502](https://github.com/jdx/mise/pull/14502) (@jdx)\n\n- **`mise lock` warns about unsupported platforms.** If you name platforms with `lockfile_platforms` or `mise lock --platform`, mise prints a warning for each tool version that has no build for one of them, for example `apko@0.30.0 is not available for windows-x64; it will not install there`. The default platform set still only logs this at debug level, and the exit status is unchanged. [#14500](https://github.com/jdx/mise/pull/14500) (@jdx)\n\n- Registry: added `martin` (`github:maplibre/martin`). [#14488](https://github.com/jdx/mise/pull/14488) (@ivan-ivkovic, @jdx)\n\n## Fixed\n\n- **GitHub lookups survive mise-versions outages.** If mise-versions times out, drops the connection, or returns `429` or `5xx`, mise now retries the lookup on `api.github.com`, using your GitHub token if one is set. This covers releases, tags, repository contents, attestations and `self-update`. A `404`, `403` or empty answer from mise-versions is still trusted and not retried, so normal use doesn't spend GitHub's anonymous rate limit. If both sources fail, the error shows both failures, and a previously cached version list is still used. [#14501](https://github.com/jdx/mise/pull/14501) (@jdx)\n- **`_.source` no longer loads `~/.bashrc`.** When mise's stdin was a socket and `SHLVL` was unset, which happens when an editor extension such as the VS Code mise extension starts it, bash sourced `~/.bashrc` before the script. That leaked variables into the environment and could drop the script's `PATH` entries. The script now runs with `--norc`. [#14487](https://github.com/jdx/mise/pull/14487) (@pikeas)\n- **Each version entry uses its own options.** When a tool listed several versions, options set only on the first entry leaked into the later ones. For example, `prerelease = true` on a `latest` entry made a separate `\"1\"` entry resolve to a prerelease. [#14476](https://github.com/jdx/mise/pull/14476) (@JamBalaya56562, @risu729)\n- **Project overrides now work when a workspace provider fails.** Previously, if a provider couldn't read its manifest (for example, a malformed `go.work`), `mise tasks graph` and `mise run --affected` failed for the whole repo. Declaring a project in that provider's namespace under `[monorepo.projects]` now replaces the provider's output and clears its error. Providers with no declared projects still fail loudly. [#14508](https://github.com/jdx/mise/pull/14508) (@jdx)\n\n## Documentation\n\n- Explained why `mise activate` keeps shims on `PATH` [#14493](https://github.com/jdx/mise/pull/14493) (@jdx), and clarified the platform-specific mise cache paths for CI [#14506](https://github.com/jdx/mise/pull/14506) (@zeitlinger).\n\n**Full Changelog**: https://github.com/jdx/mise/compare/v2026.10.11...v2026.10.12\n\n## \ud83d\udc9a Sponsor mise\n\nmise is built and maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.\n\nIf mise saves you or your team time, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep mise fast, free, and independent.\n","reactions":{"total_count":4,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":7}
