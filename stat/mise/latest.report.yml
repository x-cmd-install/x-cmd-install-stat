mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:3b337b1fa1679fd6f8f4e8ff639cbd4a62cc61a47372107d3f29f580ea2975a5","download_count":17460,"created_at":"2026-10-05T10:29:10Z","updated_at":"2026-10-05T10:29:10Z"},{"id":612239947,"node_id":"RA_kwDOIvux3s4kfgpL","name":"SHASUMS512.asc","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":7021,"digest":"sha256:dd849791eb509bb69d417cecd32832da695accdc622a153c1ca08fcff1725337","download_count":30,"created_at":"2026-10-05T10:29:10Z","updated_at":"2026-10-05T10:29:10Z"},{"id":612239946,"node_id":"RA_kwDOIvux3s4kfgpK","name":"SHASUMS512.txt","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":6139,"digest":"sha256:b3a669aa1d8be5138e5312d69e01dbc90390fcc4898d7173784c8308966532c4","download_count":31,"created_at":"2026-10-05T10:29:10Z","updated_at":"2026-10-05T10:29:10Z"},{"id":612239963,"node_id":"RA_kwDOIvux3s4kfgpb","name":"SHASUMS512.txt.minisig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:4bc2c740c958a436318336e25f92b4c4dacb3165296a9897faa1e92964c5785d","download_count":14,"created_at":"2026-10-05T10:29:11Z","updated_at":"2026-10-05T10:29:11Z"},{"id":612241280,"node_id":"RA_kwDOIvux3s4kfg-A","name":"v2026.10.3.tar.gz.sig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:6c33ba405ca51d17d0cccc2fb0bc5d1b071d682ec4bacd1eb0cba7c3cbbe34b2","download_count":14,"created_at":"2026-10-05T10:29:45Z","updated_at":"2026-10-05T10:29:45Z"}],"body":"This release adds dotfile groups for Stow-style dotfiles repositories, templated `[bootstrap.compose]` values, and custom labels for task confirm prompts. Secret values no longer get copied into `__MISE_DIFF`/`__MISE_SESSION` or written to the env cache. It also fixes dotenv `${VAR}` expansion, `mise x tool@latest` reporting other tools as missing, and Ruby source builds ignoring `depends` tools.\n\n## Added\n\n- **Dotfile groups.** You can now declare a directory tree as a group with `[dotfile_groups.<name>]`, using one directory per app or machine role like GNU Stow. mise walks the group's `root` and deploys each file to the same path under `target` (default `~`), so you don't have to list files one by one. A machine picks which groups to apply with `[bootstrap] dotfile_groups`. If that list isn't set, every group applies. [#13945](https://github.com/jdx/mise/pull/13945)\n\n  ```toml\n  [dotfile_groups.home]\n  root = \"home\"            # relative to dotfiles.root\n  dot_prefix = true        # dot-config/ deploys as .config/\n  exclude = [\"README.md\"]\n\n  [dotfile_groups.home.entries]\n  \"~/.config/kitty\" = { mode = \"symlink\" }                            # link this directory whole\n  \"~/.gitconfig\" = { source = \"git/config.tmpl\", mode = \"template\" }\n\n  [bootstrap]\n  dotfile_groups = [\"home\", \"zsh\"]\n  ```\n\n  - Groups support `mode` (`symlink-each` by default, or `copy` or `symlink`), `exclude`, `dot_prefix`, `manifest` and `relative`. A `[dotfile_groups.<name>.entries]` table uses the same syntax as `[dotfiles]` and removes those paths from the walk, so you can link a directory whole, render a template, or mark a file `absent`.\n  - If two selected groups write the same file, `apply` and `status` fail before anything is written, and the error names both groups.\n  - mise records what each group deployed under `$MISE_STATE_DIR/dotfiles/groups/`. `mise dot status` shows files that no active entry deploys any more as `orphaned`. `mise dot apply --prune` removes them after asking you, and `mise dot unapply --group <name>` removes one group's files even after the group is gone from config. mise only removes links that still point at their source and copies that still match what it wrote, unless you pass `--force`.\n  - `mise dot add` and `mise dot edit` put files under a group's target into that group's root, and both accept `--group` when more than one group could match.\n  - `mise oci build` does not include group trees.\n- **Templates in `[bootstrap.compose]`.** Every string field in a Compose project, including `project_dir`, `files`, `env_files`, `command` and `depends_on`, is now rendered as a Tera template in the context of the config that declares it. Shared configs can use `{{ config_root }}`, `{{ vars.* }}` or `{{ env.* }}` instead of hardcoded absolute paths. `exec()` isn't allowed in these templates. [#13938](https://github.com/jdx/mise/pull/13938)\n\n  ```toml\n  [bootstrap.compose.mempalace]\n  project_dir = \"{{ config_root }}/mempalace\"\n  files = [\"compose.yaml\"]\n  env_files = [\".env\"]\n  ```\n\n- **Custom labels for task `confirm` prompts.** The object form of `confirm` now accepts `yes` and `no` labels, which support the same templates as `message`. `default` is now optional and still defaults to `yes`. Piped answers still take `y`/`n`, and `--yes` still skips the prompt. [#13944](https://github.com/jdx/mise/pull/13944)\n\n  ```toml\n  [tasks.deploy]\n  confirm = { message = \"Deploy to production?\", yes = \"Deploy\", no = \"Cancel\", default = \"no\" }\n  run = \"deploy.sh\"\n  ```\n\n## Fixed\n\n- **Dotenv `${VAR}` expansion checks the file's own values first.** Before, `${VAR}` in a dotenv file read the process environment first. With `mise activate` exporting another `.env`, a reference could expand against the shell instead of an earlier line in the same file. Now the file's own earlier assignments come first, then values already loaded (with `expand = true`) or the process environment. The `${VAR:-default}`, `${VAR:+alt}` and `${VAR:?message}` forms now work too. When the `env_file` setting hits a syntax error, mise keeps the assignments it read before the error and shows one warning for the file. [#13946](https://github.com/jdx/mise/pull/13946)\n- **`mise x tool@latest` no longer reports other tools as missing.** Passing any `@latest` argument used to resolve every configured tool against its newest release and ignore the lockfile, so tools that were installed and locked showed up as `missing`. Now only the tools named on the command line resolve to latest. [#13943](https://github.com/jdx/mise/pull/13943)\n- **Ruby source builds can see `depends` tools.** ruby-build now gets the declared dependencies on `PATH`. For example, JRuby builds use a mise-managed `java` instead of the system JDK. PATH stays the same when no dependencies are declared. [#13942](https://github.com/jdx/mise/pull/13942) by @seuros\n\n## Security\n\n- **No extra plaintext copies of secrets.** [#13950](https://github.com/jdx/mise/pull/13950)\n  - **Shell state:** `__MISE_DIFF` and `__MISE_SESSION` are passed to every child process. They now store a `blake3:` digest of each value mise sets instead of the value itself. The previous (`old`) values are still stored in plain text because mise needs them to restore the environment. These are plain hashes, not keyed ones, so a low-entropy value could be brute-forced from its digest.\n  - **Env cache:** mise no longer writes environments that contain secrets to the env cache. This covers `age` values (also when used through `[vars]`), sops-encrypted `_.file` entries, any directive with `redact = true`, and env modules that return `cacheable = false`. Before, a non-tool module's `cacheable = false` was ignored.\n  - **Env module `redact`:** a `redact` setting on an env module, such as `_.my-plugin = { redact = false }`, now overrides the plugin's own preference. Before, it was ignored. A non-boolean value is now a config error.\n  - **`mise x -- fish`:** env values no longer go in fish's command-line arguments, where `ps` could read them. `--deny-env` now applies there too.\n  - **Upgrading:** shells started with an older mise still restore their environment correctly. mise rewrites their state in the new format at the next prompt.\n\n## Registry\n\n- Added `jactionlint` (`github:jdx/jactionlint`), a maintained fork of actionlint with upstream fixes and new checks. `actionlint` is now deprecated, with a message pointing to `jactionlint`. Existing `actionlint` installs keep working. [#13960](https://github.com/jdx/mise/pull/13960)\n\n## Documentation\n\n- The installation guide shows how to pin the packslip bootstrapper while letting mise install the latest release. The Docker cookbook has a new multi-stage Debian example with a digest-pinned packslip image. [#13935](https://github.com/jdx/mise/pull/13935)\n\n**Full Changelog**: https://github.com/jdx/mise/compare/vfox-v2026.10.2...v2026.10.3\n\n## \ud83d\udc9a Sponsor mise\n\nmise is built and maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.\n\nIf mise saves you or your team time, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep mise fast, free, and independent.\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
