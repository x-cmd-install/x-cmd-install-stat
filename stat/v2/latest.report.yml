l":null,"uploader":{"login":"fguillot","id":323546,"node_id":"MDQ6VXNlcjMyMzU0Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6498796,"digest":"sha256:513e2cc7c061bbef9315565dfd85d1672ad1ce052e74ea7df2f836e5090595e7","download_count":11,"created_at":"2026-11-02T04:28:18Z","updated_at":"2026-11-02T04:28:19Z"},{"id":700505181,"node_id":"RA_kwDOBqNIoM4pwNxd","name":"miniflux_2.3.5_riscv64.deb","label":null,"uploader":{"login":"fguillot","id":323546,"node_id":"MDQ6VXNlcjMyMzU0Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6915764,"digest":"sha256:aef0d9fd05429957b3f6f4653d40063d6f562806a928a964129bbe9af033502b","download_count":9,"created_at":"2026-11-02T04:28:16Z","updated_at":"2026-11-02T04:28:18Z"}],"body":"\r\n### New features\r\n\r\n- Added OpenID Connect admin role mapping: set `OAUTH2_ADMIN_GROUP` and `OAUTH2_GROUP_CLAIM` to grant or revoke the admin role at login based on the user's groups. The group claim is read from the user info response or the ID token, and `OAUTH2_ADDITIONAL_SCOPES` can request extra scopes from the provider.\r\n- Allowed WebAuthn/Passkeys as the only login method when `DISABLE_LOCAL_AUTH` is enabled. Register at least one passkey while another authentication method is still available before turning off local authentication.\r\n- Added a `force` parameter to the feed refresh API endpoint (`PUT /v1/feeds/{id}/refresh?force=true`) to bypass the HTTP cache and reprocess existing entries, matching the forced refresh in the web UI. The Go client gains `ForceRefreshFeed`.\r\n- Rejected invalid CSS selectors when saving rewrite and scraper rules, instead of silently ignoring them.\r\n- Moved the username, password, OAuth2 account linking, and passkey settings to a dedicated **Authentication** page under Settings.\r\n\r\n### Performance improvements\r\n\r\n- Stopped creating database web sessions for anonymous visitors, crawlers, media proxy requests, and other public pages that don't need one. Logged-out language and theme preferences are now kept in a cookie, and anonymous sessions are removed after 24 hours, which keeps the `web_sessions` table from growing with thousands of unused rows.\r\n\r\n### Security\r\n\r\n- Required the current password before setting a new one on the Authentication page.\r\n- Signed out other sessions when a password is changed, from the web UI, the API, or the `-reset-password` command. The current session gets a new identifier so a copied cookie stops working.\r\n- Prevented administrators from editing their own account through the user management page, which bypassed the current password check.\r\n- Restricted feed cookies to the feed's own website, so they are no longer sent to third-party hosts when scraping articles, fetching icons, or discovering feeds.\r\n- Blocked 6to4 and IPv4-compatible IPv6 addresses that could bypass the server-side request forgery filter.\r\n- Stopped caching shared entry pages in public caches and removed the CSRF token from them.\r\n- Took the client IP from the right side of `X-Forwarded-For`, skipping addresses in `TRUSTED_REVERSE_PROXY_NETWORKS`, so clients can no longer spoof the IP recorded in logs and sessions. **If you chain several reverse proxies (e.g. Cloudflare in front of nginx), add the networks of every proxy to `TRUSTED_REVERSE_PROXY_NETWORKS`.**\r\n- Stopped logging malformed Google Reader authentication tokens.\r\n- Hardened the GitHub Actions workflows and added provenance and SBOM attestations to Docker images.\r\n\r\n### Bug fixes\r\n\r\n- Fixed the Fever API toggling the starred state when saving or unsaving an entry that was already in that state.\r\n- Fixed the Fever API marking all entries as read, including newer ones, while ignoring the `before` timestamp.\r\n- Fixed the Fever API returning an arbitrary set of entries for some item requests, which could cause clients to miss entries.\r\n- Fixed a crash in the Google Reader API caused by an unknown stream type.\r\n- Matched category titles case-insensitively, fixing \"category not found\" errors with Google Reader labels and duplicate categories created by OPML imports.\r\n- Parsed RFC 3339 dates with a lower-case `t` or `z`.\r\n- Accepted JSON feeds that start with a UTF-8 byte order mark.\r\n- Validated the username format when renaming a user, not only at creation.\r\n\r\n### Localization\r\n\r\n- Updated Polish (`pl_PL`) translations.\r\n- Fixed raw translation keys shown instead of messages for invalid usernames, invalid proxy URLs, unparsable HTML pages, and the tag entry count.\r\n\r\n### Documentation\r\n\r\n- Reviewed the man page for accuracy and readability, documenting option combinations checked at startup, media proxy modes, and systemd socket activation.\r\n\r\n### Dependencies\r\n\r\n- Updated several Go modules and GitHub Actions dependencies.\r\n\r\n---\r\n\r\nAs always, thank you to all contributors who helped improve Miniflux in this release.\r\n","reactions":{"total_count":12,"+1":5,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":5,"rocket":0,"eyes":0}}
