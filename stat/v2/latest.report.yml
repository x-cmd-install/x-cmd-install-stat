ull,"uploader":{"login":"fguillot","id":323546,"node_id":"MDQ6VXNlcjMyMzU0Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6419836,"digest":"sha256:43fbcb52d7048a82396f5bb4222753268aa62294e44d5dbf986e6ddc8ebbcc17","download_count":6,"created_at":"2026-10-20T01:06:30Z","updated_at":"2026-10-20T01:06:31Z"},{"id":657888948,"node_id":"RA_kwDOBqNIoM4nNpa0","name":"miniflux_2.3.4_riscv64.deb","label":null,"uploader":{"login":"fguillot","id":323546,"node_id":"MDQ6VXNlcjMyMzU0Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6833828,"digest":"sha256:8c58025c05fdfb8d250583e2321354339a6763be23c619e66dba1c222095d4e3","download_count":6,"created_at":"2026-10-20T01:06:31Z","updated_at":"2026-10-20T01:06:32Z"}],"body":"\r\n### New features\r\n\r\n- Added Gotify push notification support.\r\n- Added Steam scraper rules.\r\n- Added validation with helpful error messages when saving rewrite rules.\r\n\r\n### Performance improvements\r\n\r\n- Reduced database storage used by enclosure and entry indexes.\r\n- Reduced memory used by internal data structures.\r\n\r\n### Security\r\n\r\n- Blocked reserved IP address ranges to further protect against server-side request forgery.\r\n- Hardened WebAuthn redirects against open-redirect attacks, including redirect URLs containing surrounding whitespace.\r\n- Prevented per-feed proxy URLs from bypassing private-network restrictions by default. **Set `FETCHER_ALLOW_PRIVATE_FEED_PROXY=1` to retain access to private per-feed proxies.**\r\n- Enforced `DISABLE_LOCAL_AUTH` for API password authentication and password changes; API clients must use an API key when local authentication is disabled.\r\n- Rejected Google Reader authentication tokens when no password is configured.\r\n- Restricted embedded iframe URLs to web schemes and tightened YouTube hostname validation.\r\n\r\n### Bug fixes\r\n\r\n- Added timeouts to the ACME challenge listener.\r\n- Fixed response compression negotiation to consistently prefer the server's configured encoding order.\r\n- Improved Karakeep errors when saving an entry fails by reporting the HTTP status.\r\n- Returned to the first unread page when marking entries as read leaves the current feed or category page empty.\r\n- Restored support for proxies configured through `HTTP_PROXY` or `HTTPS_PROXY`, including across redirects.\r\n- Returned a validation error instead of crashing when creating or importing feeds for users without a category.\r\n- Preserved the requested redirect after passkey login.\r\n- Increased the Google Reader item-ID limit to 10,000.\r\n- Returned a bad-request response instead of crashing on POST requests to static asset paths.\r\n- Improved accessibility by adding descriptive names to documentation links.\r\n- Improved error logging and responses for failed database existence checks and shared-entry lookups.\r\n\r\n### Localization\r\n\r\n- Updated Polish (`pl_PL`) translations.\r\n\r\n### Documentation\r\n\r\n- Clarified the Unix socket permissions used with `LISTEN_ADDR`.\r\n\r\n### Dependencies\r\n\r\n- Updated several Go modules and GitHub Actions dependencies.\r\n\r\n---\r\n\r\nAs always, thank you to all contributors who helped improve Miniflux in this release.\r\n","reactions":{"total_count":8,"+1":5,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":0}}
