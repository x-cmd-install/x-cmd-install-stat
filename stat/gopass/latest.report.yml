4_SHA256SUMS","label":"","uploader":{"login":"gopass-releaser","id":77737534,"node_id":"MDQ6VXNlcjc3NzM3NTM0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4312,"digest":"sha256:f61fdc94991ab37be573a4d216744ab2770b48f181753e73ad4bd81ca0323d21","download_count":366,"created_at":"2026-10-10T09:01:04Z","updated_at":"2026-10-10T09:01:04Z"},{"id":627495073,"node_id":"RA_kwDOBM-8gs4lZtCh","name":"gopass_1.17.4_SHA256SUMS.sig","label":"","uploader":{"login":"gopass-releaser","id":77737534,"node_id":"MDQ6VXNlcjc3NzM3NTM0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":659,"digest":"sha256:e04a1bb3e1a6ed8a962b8fa1765a13ddae593f8618e35c7691ebc4c073bf94c2","download_count":19,"created_at":"2026-10-10T09:01:04Z","updated_at":"2026-10-10T09:01:04Z"},{"id":627495076,"node_id":"RA_kwDOBM-8gs4lZtCk","name":"gopass_1.17.4_SHA256SUMS.sigstore.json","label":"","uploader":{"login":"gopass-releaser","id":77737534,"node_id":"MDQ6VXNlcjc3NzM3NTM0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":10287,"digest":"sha256:bd0cdba71c79b136a69f4ecbaa74e239dc44f99d41154181807a59a74e815be9","download_count":244,"created_at":"2026-10-10T09:01:04Z","updated_at":"2026-10-10T09:01:04Z"}],"body":"## [1.17.4] - 2026-10-10\n\n### Added\n\n- age: Add `hello` capability negotiation to the age agent protocol (#3624)\n- age: Report the time left until auto-lock in `gopass age agent status`\n- age: add hello capability negotiation to the age agent (#3634)\n- age: log received identities via out.Secret (#3630) (#3625)\n- age: report auto-lock countdown in `age agent status` (#3656)\n- age: support hardware-backed keyring unlocking (#3648) (#3644)\n- secret-service: add Linux Secret Service daemon (#3434) (#3607)\n- show: Add `show.password` config option to display only the password by default (#3621)\n- show: add show.password config option (#3621) (#3623)\n\n### Fixed\n\n- Mitigate path-traversal gap in Store.Link (#3649)\n- Remove capslock (#3647)\n- age-agent: redact sensitive protocol lines from debug logs (#3625) (#3508)\n- age: cache unlocked SSH identities in agent (#3646)\n- age: honor preferred identity order during decryption (#3643) (#3632)\n- age: prevent agent panic when decrypting plugin identities (#3633)\n- ls: Hide template-only folders from flat listing (#3650)\n- msi: add install dir to user PATH (#3588) (#3622)\n\n### Security\n\n- fs: reject symlinked store entries escaping the store root (#3654)\n\n\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
