:"RA_kwDOLTetx84ltd93","name":"Seelen.UI_2.8.9_x64-setup-fixed.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":257553456,"digest":"sha256:ad0167217bf18fd5559cac28d6630385a502b937053e5b3925264102553d9d44","download_count":13,"created_at":"2026-10-12T04:38:32Z","updated_at":"2026-10-12T04:38:42Z"},{"id":632676154,"node_id":"RA_kwDOLTetx84ltd86","name":"Seelen.UI_2.8.9_x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":48567008,"digest":"sha256:1d5a1f30036aed027503eb4d6f2bfdf70a37b9d5a259d35efc4e22731c6bccd1","download_count":154,"created_at":"2026-10-12T04:38:29Z","updated_at":"2026-10-12T04:38:32Z"}],"body":"### features\n\n- apps menu search now includes Windows Settings pages and Control Panel items, localized to the system language and\n  indexed from Windows itself, with a new `settings:` filter.\n\n### enhancements\n\n- do not disturb can now be toggled from the notifications widget without opening Windows settings.\n\n### fix\n\n- tray icons pinned in the toolbar not updating their image when the app changes it.\n- dock icons including windows from other monitors when unpinned items visibility is set to \"On Monitor\".\n- some dock pins not working as expected.\n- apps menu showing duplicated items caused by same lnk file at system and user folders.\n- external links (resources, news, etc.) not opening on the browser.\n- tray icon menus opening at the wrong position when the cursor is on a monitor at the left or above the primary one.\n- Task Manager tray icon not shown, and warnings logged for its hidden icons.\n- hidden tray icons becoming visible when their app updates them without changing their state.\n- tray icons of apps running as another user or elevated (e.g. Sunshine) not shown.\n- single color tray icons (e.g. USB connected) shown always white, they are now tinted to follow the theme.\n- toolbar long text overflow.\n- \"Pin to Dock\" missing on the apps menu context menu, and not working for any app.\n- pinning an app already present on the dock adding it again instead of pinning the existing item.\n\n## What's Changed\n* build(deps): bump quick-xml from 0.38.4 to 0.42.0 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1900\n* build(deps): bump @tauri-apps/api from 2.12.0 to 2.12.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1901\n* build(deps-dev): bump @types/node from 25.9.8 to 25.9.9 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1903\n* build(deps): bump uuid from 1.26.0 to 1.27.0 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1898\n* build(deps): bump @preact/signals from 2.11.2 to 2.11.3 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1897\n* build(deps): bump @tauri-apps/cli from 2.12.0 to 2.12.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1899\n* build(deps-dev): bump lefthook from 2.1.14 to 2.1.16 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1902\n* build(deps-dev): bump proxy-addr from 2.0.7 to 2.0.8 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1904\n* feat(apps-menu): add a setting to choose the view shown when opening by @z1pp090 in https://github.com/eythaann/Seelen-UI/pull/1884\n* fix(i18n): correct Spanish dock strings by @z1pp090 in https://github.com/eythaann/Seelen-UI/pull/1895\n\n\n**Full Changelog**: https://github.com/eythaann/Seelen-UI/compare/v2.8.8...v2.8.9","mentions_count":2}
