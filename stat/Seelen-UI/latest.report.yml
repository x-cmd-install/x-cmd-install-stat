16T13:19:28Z","updated_at":"2026-11-16T13:19:31Z"}],"body":"### features\n\n- cli: `slu quit` and `slu restart` commands to gracefully close or restart Seelen UI.\n- dock: live window previews (paused on performance mode, static snapshots are shown instead).\n- dock: hovering an open app shows its window previews without stealing the focus.\n\n### enhancements\n\n- close popup if triggered and already shown.\n- add network adapters to network popup.\n- widgets: popups can be triggered by hover (`TriggerSource`), they don't take focus and hide on cursor out.\n- network popup: Wi-Fi networks already known by the system are shown instantly while the scan runs in background.\n\n### fix\n\n- adding several wallpapers at once only keeping one of them.\n- apps spawning behind windows when launched from dock.\n- explorer crashing on Windows 10 when the dock is enabled, caused by the native taskbar being hidden in an endless\n  loop.\n- network popup not scanning Wi-Fi networks on first open or when opened by hover.\n\n## What's Changed\n* fix translation by @Sekai-Moeru in https://github.com/eythaann/Seelen-UI/pull/1954\n* fix(positioning): don't cloak Firefox windows while animating by @z1pp090 in https://github.com/eythaann/Seelen-UI/pull/1912\n* fix(apps-menu): fix keyboard activation by @v01d-gh in https://github.com/eythaann/Seelen-UI/pull/1975\n* build(deps-dev): bump qs from 6.16.0 to 6.17.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1976\n* build(deps-dev): bump antd from 6.6.5 to 6.7.0 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1950\n* build(deps-dev): bump follow-redirects from 1.16.1 to 1.16.3 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1960\n* build(deps-dev): bump fast-uri from 3.1.7 to 3.1.9 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1946\n* build(deps): bump react-router from 8.4.0 to 8.5.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1948\n* build(deps): bump encoding_rs from 0.8.35 to 0.8.44 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1949\n* build(deps-dev): bump svelte-check from 4.7.6 to 4.7.8 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1933\n* build(deps): bump rust-i18n from 4.2.1 to 4.2.4 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1932\n* build(deps): bump serde_with from 3.16.1 to 3.24.0 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1701\n* build(deps): bump sha2 from 0.10.9 to 0.11.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1937\n* build(deps-dev): bump toml from 4.3.0 to 5.0.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1945\n* fix(weg): stop hiding the native taskbar in a loop by @thd2020 in https://github.com/eythaann/Seelen-UI/pull/1969\n* feat(weg): add live window previews by @Young-skyyy in https://github.com/eythaann/Seelen-UI/pull/1984\n\n## New Contributors\n* @Sekai-Moeru made their first contribution in https://github.com/eythaann/Seelen-UI/pull/1954\n* @v01d-gh made their first contribution in https://github.com/eythaann/Seelen-UI/pull/1975\n* @thd2020 made their first contribution in https://github.com/eythaann/Seelen-UI/pull/1969\n* @Young-skyyy made their first contribution in https://github.com/eythaann/Seelen-UI/pull/1984\n\n**Full Changelog**: https://github.com/eythaann/Seelen-UI/compare/v2.8.10...v2.8.11","reactions":{"total_count":8,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":6,"rocket":1,"eyes":0},"mentions_count":6}
