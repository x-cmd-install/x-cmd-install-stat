50Z","updated_at":"2026-09-18T01:22:52Z"}],"body":"### enhancements\n\n- customizable toolbar items transitions (in/out).\n- customizable dock items transitions (in/out).\n- detailed information of WLAN when devtools enabled.\n- detailed information of bluetooth when devtools enabled.\n\n### fix\n\n- dock and toolbar edge triggering on high DPI displays.\n- duplicated dock items briefly appearing (and then disappearing) for open, unpinned apps on multi-monitor setups.\n- WLAN networks and Bluetooth devices not being scanned automatically after turning their radio back on.\n- bluetooth popup scanning indicator/scanning showing while the popup was unfocused instead of while it was open.\n- dock/toolabr behind windows after exiting fullscreen mode.\n\n## What's Changed\n* fix(state): avoid temp-file race in atomic_write_file with multiple monitors by @z1pp090 in https://github.com/eythaann/Seelen-UI/pull/1813\n* feat(ui): smooth entrance/exit transitions and drag overlay alignment for dock & toolbar by @malashkadev in https://github.com/eythaann/Seelen-UI/pull/1809\n* build(deps-dev): bump react-i18next from 17.0.11 to 17.0.14 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1816\n* build(deps-dev): bump @types/node from 25.9.5 to 25.9.6 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1817\n* build(deps): bump @preact/signals from 2.11.1 to 2.11.2 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1815\n* build(deps-dev): bump antd from 6.6.2 to 6.6.3 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1818\n* build(deps-dev): bump @types/react-dom from 19.2.4 to 19.3.0 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1819\n\n## New Contributors\n* @malashkadev made their first contribution in https://github.com/eythaann/Seelen-UI/pull/1809\n\n**Full Changelog**: https://github.com/eythaann/Seelen-UI/compare/v2.8.5...v2.8.6","reactions":{"total_count":8,"+1":3,"-1":0,"laugh":0,"hooray":0,"