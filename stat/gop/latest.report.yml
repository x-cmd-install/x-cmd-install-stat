:59Z","updated_at":"2026-11-20T04:05:00Z"}],"body":"## What's Changed\r\n\r\nfeature [auto closure](https://github.com/goplus/xgo/issues/2818):\r\n* autoclosure (#2818) by @xushiwei in https://github.com/goplus/xgo/pull/2826\r\n* cl: autoclosure errmsg by @xushiwei in https://github.com/goplus/xgo/pull/2827\r\n\r\nfeature [auto lambda](https://github.com/goplus/xgo/issues/2828):\r\n* parser,printer: Auto Lambda by @xushiwei in https://github.com/goplus/xgo/pull/2829\r\n* cl,build: Auto Lambda by @xushiwei in https://github.com/goplus/xgo/pull/2830\r\n* ast: rename LambdaExpr => ArrowExpr, LambdaExpr2 => LambdaExpr by @xushiwei in https://github.com/goplus/xgo/pull/2831\r\n* parser: autolambda bugfix by @xushiwei in https://github.com/goplus/xgo/pull/2833\r\n* format: support loading autolambda info from gox.mod by @xushiwei in https://github.com/goplus/xgo/pull/2836\r\n* cl: compileLambdaExpr with gogen.AutoLambdaCategory; gogen update from upstream by @xushiwei in https://github.com/goplus/xgo/pull/2839\r\n\r\nfeature [for loop](https://github.com/goplus/xgo/issues/2841):\r\n* cl: mv for range / for phrase test cases to cl/_testxgo by @xushiwei in https://github.com/goplus/xgo/pull/2838\r\n* cl: rm support for obj.XGo_Enum(func(...)) by @xushiwei in https://github.com/goplus/xgo/pull/2842\r\n* doc/for.md: The for Statement by @xushiwei in https://github.com/goplus/xgo/pull/2843\r\n* doc/docs.md: for loop by @xushiwei in https://github.com/goplus/xgo/pull/2844\r\n* fix(printer): handle for-phrase statements before expressions by @aofei in https://github.com/goplus/xgo/pull/2898\r\n\r\nfeature [class fields](https://github.com/goplus/xgo/issues/2514)\r\n* parser,cl: mv 'multiple top-level var declarations in classfile' error from parser to cl by @xushiwei in https://github.com/goplus/xgo/pull/2822\r\n* parser,cl: var declarations in classfile must be declared before functions by @xushiwei in https://github.com/goplus/xgo/pull/2823\r\n* cl: class fields declaration must be declared before functions by @xushiwei in https://github.com/goplus/xgo/pull/2824\r\n* parser: comments for fnExists & classFields by @xushiwei in https://github.com/goplus/xgo/pull/2825\r\n\r\n\r\nchanges:\r\n* go 1.25; mod: golang.org/x/net v0.57.0 by @xushiwei in https://github.com/goplus/xgo/pull/2832\r\n* xgo fmt: ignore Go files by default; chore: xgo fmt XGo source files by @xushiwei in https://github.com/goplus/xgo/pull/2837\r\n* test for Go1.27 by @visualfc in https://github.com/goplus/xgo/pull/2851\r\n* mod: github.com/goplus/lib v0.5.1 by @xushiwei in https://github.com/goplus/xgo/pull/2853\r\n* mod: github.com/goplus/gogen v1.24.1 by @xushiwei in https://github.com/goplus/xgo/pull/2857\r\n* mod: github.com/goplus/gogen v1.24.7; github.com/goplus/lib v0.5.3 by @xushiwei in https://github.com/goplus/xgo/pull/2862\r\n* mod: github.com/goplus/lib v0.5.4 by @xushiwei in https://github.com/goplus/xgo/pull/2863\r\n* mod: upgrade gogen to v1.24.8 by @go-wyvern in https://github.com/goplus/xgo/pull/2864\r\n* tool: fix nil pointer panic in checkGopDeps when compilation fails (#2861) by @fennoai[bot] in https://github.com/goplus/xgo/pull/2865\r\n* tool: preserve classfile requires in xgo mod tidy (#2175) by @fennoai[bot] in https://github.com/goplus/xgo/pull/2879\r\n* mod: github.com/goplus/gogen v1.26.3 by @xushiwei in https://github.com/goplus/xgo/pull/2885\r\n* cmd: use go1.27 by @xushiwei in https://github.com/goplus/xgo/pull/2893\r\n* fix(cl): skip absent expression type information by @aofei in https://github.com/goplus/xgo/pull/2903\r\n* fix(parser): preserve unnamed generic tuple fields by @aofei in https://github.com/goplus/xgo/pull/2901\r\n* docs: rename CLAUDE.md to AGENTS.md by @aofei in https://github.com/goplus/xgo/pull/2900\r\n* fix(cl): preserve class types after initializer errors by @aofei in https://github.com/goplus/xgo/pull/2897\r\n* fix(cl): report positioned errors for recursive type aliases by @aofei in https://github.com/goplus/xgo/pull/2902\r\n* docs: document shared XGo tooling conventions by @aofei in https://github.com/goplus/xgo/pull/2899\r\n* fix(cl): recognize aliases in decorator callbacks by @aofei in https://github.com/goplus/xgo/pull/2905\r\n* release: use go1.27 by @xushiwei in https://github.com/goplus/xgo/pull/2907\r\n* retract v1.7.6 by @xushiwei in https://github.com/goplus/xgo/pull/2908\r\n* fix(cl): support parenthesized assignment targets by @aofei in https://github.com/goplus/xgo/pull/2912\r\n\r\ndeps:\r\n* build(deps): bump github.com/qiniu/x 1.19.3 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2886\r\n* build(deps): bump github.com/goplus/mod 0.22.1 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2868\r\n* build(deps): bump github.com/goplus/lib 0.7.1 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2891\r\n* build(deps): bump github.com/goplus/gogen 1.26.6 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2892\r\n* build(deps): bump github.com/goplus/cobra 1.10.8 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2855\r\n* build(deps): bump the go-deps group across 2 directories with 2 updates by @dependabot[bot] in https://github.com/goplus/xgo/pull/2909\r\n* build(deps): bump github.com/goplus/lib from 0.7.1 to 0.7.2 in the go-deps group across 1 directory by @dependabot[bot] in https://github.com/goplus/xgo/pull/2913\r\n\r\nci & tools:\r\n* fix(ci): build release binaries from the cmd module by @MeteorsLiu in https://github.com/goplus/xgo/pull/2910\r\n* build(deps): bump docker/login-action 4.8.0 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2896\r\n\r\n## New Contributors\r\n* @MeteorsLiu made their first contribution in https://github.com/goplus/xgo/pull/2910\r\n\r\n**Full Changelog**: https://github.com/goplus/xgo/compare/v1.7.5...v1.8.0\r\n","reactions":{"total_count":8,"+1":3,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":7}
