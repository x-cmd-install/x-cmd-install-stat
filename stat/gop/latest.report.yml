":"2026-07-22T02:10:22Z","updated_at":"2026-07-22T02:10:23Z"}],"body":"## What's Changed\r\n\r\nfeature [enum type](https://github.com/goplus/xgo/issues/2751):\r\n* cl compileType: support enum type decl in func by @xushiwei in https://github.com/goplus/xgo/pull/2782\r\n* cl loadConsts: if not untyped, convert value to the enum type by @xushiwei in https://github.com/goplus/xgo/pull/2784\r\n* cl: allow same names across different enum types (#2787) by @xushiwei in https://github.com/goplus/xgo/pull/2790\r\n\r\nfeature [static member](https://github.com/goplus/xgo/issues/2513):\r\n* ast: add ValueSpec.HasStatic (#2513) by @xushiwei in https://github.com/goplus/xgo/pull/2785\r\n* ast: mv methods by @xushiwei in https://github.com/goplus/xgo/pull/2789\r\n* feat(syntax): add static value declarations by @KurodaKayn in https://github.com/goplus/xgo/pull/2783\r\n* parser: static member refactor by @xushiwei in https://github.com/goplus/xgo/pull/2793\r\n* parser: TestErrType, TestErrStaticMember by @xushiwei in https://github.com/goplus/xgo/pull/2794\r\n* parser: TestErrStaticMember add cases by @xushiwei in https://github.com/goplus/xgo/pull/2795\r\n\r\nfeature [function decorator](https://github.com/goplus/xgo/issues/2797):\r\n* cl: implement Phase 2 semantic support for function decorators by @fennoai[bot] in https://github.com/goplus/xgo/pull/2801\r\n* syntax: Phase 1 - Grammar Definition for Function Decorators by @fennoai[bot] in https://github.com/goplus/xgo/pull/2799\r\n\r\nfeature [flat mode for XGo class framework](https://github.com/goplus/xgo/issues/2802):\r\n* cl genClassProjectMain fix (flat): narg = 2 by @xushiwei in https://github.com/goplus/xgo/pull/2805\r\n* cl: implement flat mode for XGo class framework by @fennoai[bot] in https://github.com/goplus/xgo/pull/2804\r\n\r\ndocuments:\r\n* doc: class framework (refactor) by @xushiwei in https://github.com/goplus/xgo/pull/2796\r\n* doc/classfile: details by @xushiwei in https://github.com/goplus/xgo/pull/2800\r\n* README: rm Report Card by @xushiwei in https://github.com/goplus/xgo/pull/2811\r\n\r\nchanges:\r\n* fix: handle XGo AST extension nodes consistently by @aofei in https://github.com/goplus/xgo/pull/2806\r\n* cl: resolve embedded work class names in class field initializers by @fennoai[bot] in https://github.com/goplus/xgo/pull/2817\r\n\r\ndeps:\r\n* build(deps): bump github.com/goplus/mod 0.20.3 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2786\r\n* build(deps): bump github.com/goplus/gogen 1.23.5 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2807\r\n\r\nci & tools:\r\n* build(deps): bump actions/setup-go from 6 to 7 by @dependabot[bot] in https://github.com/goplus/xgo/pull/2813\r\n\r\n## New Contributors\r\n* @KurodaKayn made their first contribution in https://github.com/goplus/xgo/pull/2783\r\n\r\n**Full Changelog**: https://github.com/goplus/xgo/compare/v1.7.3...v1.7.5","reactions":{"total_count":11,"+1":4,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":1,"rocket":3,"eyes":0},"mentions_count":5}
