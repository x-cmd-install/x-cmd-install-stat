","name":"cc-connect-v1.5.0-linux-arm64.tar.gz","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":15153292,"digest":"sha256:360916e64c81714b4b295905b7aa95a62d3b5bfba0fb306f29a4560224d07ca3","download_count":324,"created_at":"2026-08-16T15:06:29Z","updated_at":"2026-08-16T15:06:44Z"},{"id":516928683,"node_id":"RA_kwDORa0x384ez7Sr","name":"cc-connect-v1.5.0-windows-amd64.zip","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16915371,"digest":"sha256:1d0fdeffa6118ab0a942a3c3918930685bd7d4caef5d7311b0d8f605fad95763","download_count":5582,"created_at":"2026-08-16T15:06:29Z","updated_at":"2026-08-16T15:06:44Z"},{"id":516928842,"node_id":"RA_kwDORa0x384ez7VK","name":"cc-connect-v1.5.0-windows-arm64.zip","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15220471,"digest":"sha256:5626d04b61b795b4a7a546adc955d043bb2be7e1f9c342e9b6cb3348ec5273fe","download_count":114,"created_at":"2026-08-16T15:06:43Z","updated_at":"2026-08-16T15:06:46Z"},{"id":516928873,"node_id":"RA_kwDORa0x384ez7Vp","name":"checksums.txt","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1208,"digest":"sha256:3c6d6a97a9532a3d04d2678e8fb27680dc9d0ffa7ac6284e86689effa20214a5","download_count":744,"created_at":"2026-08-16T15:06:45Z","updated_at":"2026-08-16T15:06:46Z"}],"body":"## What's Changed\n\nFirst stable release of the v1.5.0 series since v1.4.1. Stabilizes v1.5.0-beta.1 \u2192 beta.5 (~93 commits) with production-validated P1 stability fixes (#1693 fixing #1686).\n\nIf you have been running any `1.5.0-beta.*` in production, **upgrading to v1.5.0 is recommended** \u2014 same runtime as beta.5 with stable versioning and npm `@latest`.\n\n### New Features\n\n- **New platforms** \u2014 Tencent Yuanbao Bot API (#1445); **cloud_web** self-hosted IM gateway (#1282); **Google Chat** (#1424); **WPS Agentspace** (#1439); **Tuitui** (#849)\n- **New agent** \u2014 **Reasonix** HTTP serve API adapter (#1281)\n- **Feishu hardening** \u2014 topic workspace isolation (#1551); quoted file on-demand download (#1588); first thread mention bootstrap (#1627); cross-type image batch flush (#1693)\n- **Agent ecosystem** \u2014 Kimi Code CLI native dialect (#1564); Pi v0.84.0 toolcall_end + willRetry (#1674, #1597); codex `/model` gpt-5.x visibility (#1546); Claude Code session title fallback (#1549)\n- **Pi & permissions** \u2014 RPC mode (#1440); permission mode env injection (#1637); `agent_session_idle_timeout_mins` (#1338)\n\n### Fixed\n\n- **#1686 P1-A** \u2014 `/restart` no longer crashes daemon when platform adapter panics during post-restart notification (#1693)\n- **#1686 P1-B** \u2014 Rapid image + text within `image_batch_window_ms` no longer drops the buffered image (#1693)\n- **#1686 P1-C** \u2014 Long background turns no longer killed by stale idle-close timer (#1693)\n- **Weixin send budget** \u2014 `sendmessage ret=-2` fails fast per-account (#1643)\n- Core stability \u2014 idle close race fixes; attachment filename collision prevention; code fence split integrity (#1630, #1557)\n\n### Breaking Changes\n\nNone. All new config options are optional with safe defaults. v1.4.1 configs upgrade as-is.\n\n**Full Changelog**: https://github.com/chenhg5/cc-connect/compare/v1.4.1...v1.5.0\n"}
