name":"cc-connect-v1.5.3-linux-arm64.tar.gz","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":15714779,"digest":"sha256:b08104a83fd005abd00c3b5f745ef0b7690d5a61f2711b49b0a1703815ce9e18","download_count":32,"created_at":"2026-11-20T13:04:33Z","updated_at":"2026-11-20T13:04:44Z"},{"id":771857851,"node_id":"RA_kwDORa0x384uAZ27","name":"cc-connect-v1.5.3-windows-amd64.zip","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17534716,"digest":"sha256:311b2e92a0301c2bdbbdf49e506fe7ed866554279b9088b03ecb526f020cda0b","download_count":270,"created_at":"2026-11-20T13:04:33Z","updated_at":"2026-11-20T13:04:47Z"},{"id":771858570,"node_id":"RA_kwDORa0x384uAaCK","name":"cc-connect-v1.5.3-windows-arm64.zip","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15789493,"digest":"sha256:a2354055b7a2fd6882db5af7e501fbc29a38200fc3c0c4a668d4e0ec4ef0d56b","download_count":27,"created_at":"2026-11-20T13:04:46Z","updated_at":"2026-11-20T13:04:49Z"},{"id":771858669,"node_id":"RA_kwDORa0x384uAaDt","name":"checksums.txt","label":"","uploader":{"login":"chenhg5","id":4344486,"node_id":"MDQ6VXNlcjQzNDQ0ODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1208,"digest":"sha256:9166888f0754c4eff8c7dc1ed2eaf98b523511e693aacd2e9c7ca47836aa52f7","download_count":87,"created_at":"2026-11-20T13:04:48Z","updated_at":"2026-11-20T13:04:48Z"}],"body":"## What's Changed\n\nStable release since **v1.5.2**, promoting **v1.5.3-beta.2** (`8f442161`) unchanged. It rolls up **65 merged pull requests** — 53 feature and fix changes, plus docs, tests and refactors — with the bulk of the work on Feishu cards and attachments, provider presets, and agent model and command handling.\n\nUpgrading to v1.5.3 is recommended: every new option is optional and defaults to off.\n\n### How this release was validated\n\n- Unit, regression, performance and blackbox tests in CI on this commit.\n- Release QA (`go test -race`, blackbox smoke) on the exact commit.\n- Live Feishu channel smoke (Claude Code + Codex) on the release binary.\n- Promoted from v1.5.3-beta.2 after its beta period and maintainer approval.\n\n### New Features\n\n- **Feishu:** Key tool parameters are shown in cards (#1944)\n- **Feishu:** Plain text and image bursts can optionally be coalesced (#2022)\n- **Feishu:** Lifecycle tracking through AsyncRecoverablePlatform (#1198)\n- **Feishu:** Group reply-all is scoped to configured chats (#1976)\n- **Feishu:** Streaming is configurable (#1956)\n- **Feishu:** Messages that mention other users are skipped (#2012)\n- **Cursor:** Falls back to local chat history (#2255)\n- **Cursor:** /memory is persisted in the project AGENTS.md (#2245)\n- **Cursor:** An optional instructions file is reloaded on every turn (#2095)\n- **Claude Code:** The CLI's applied effort is shown in the reply footer (#2252)\n- **Codex:** Named app-server permission profiles are supported (#2151)\n- **ACP:** A compact command, context usage and form elicitation bridge (#1933)\n- **ACP:** Model discovery and live switching via configOptions (#1935)\n- **OpenCode:** Skill directories are exposed via SkillProvider (#1873)\n- **Telegram:** Dice messages are forwarded to the agent as text (#2254)\n- **Telegram:** Telegram Bot API 10.x native rich messages are supported (#1985)\n- **WeCom:** Interactive card sending and callback feedback (#1645)\n- **Slack:** An optional base_url overrides the Slack Web API root (#2178)\n- **MiniMax:** M3.1 Flash is the default model (#1192)\n- **Providers:** Runcrate provider preset (#2144)\n- **Providers:** Opper provider preset (#2125)\n- **Providers:** CloudGPU provider preset (#2166)\n\n### Fixed\n\n**Core and sessions**\n- HTML tags written inside inline code are escaped (#2282)\n- Splitting a message reserves its closing code fence (#2117)\n\n**Claude Code**\n- Session transcript lines over 256KB are read in /list and /history (#2192)\n- The /model fallback list includes claude-fable-5 and follows the rolling fable alias (#1755, #1642)\n\n**Feishu**\n- Askq and permission card clicks are accepted only from the requester (#2281)\n- The card answer is no longer echoed as a second chat message (#2290)\n- Replies to bot menu events use the correct receive_id (#2259)\n- Reply cards are filled and table columns are sized by content (#2235)\n- Forwarded attachments are downloaded through the outer message (#2239)\n- Post attachments from quotes, merge-forwards and failed downloads are surfaced (#1923)\n- URLs in quoted interactive cards are preserved (#2142)\n- The chat scope is checked before allow_from when a message arrives (#2223)\n- Name lookups are bounded, so a hung request cannot hold a message (#2018)\n- Silent WebSocket connections are recovered (#2120)\n- The SDK logger respects the application log level (#2150)\n- Progress card panels stay collapsed while a turn is running (#2199)\n\n**Other platforms**\n- **Discord:** AskUserQuestion option clicks are forwarded to the engine (#2219)\n- **MAX:** Only private-dialog chats are cached for callback routing (#2284)\n- **Slack:** base_url validation is tightened, a base_url secret is never echoed in a validation error, and base_url is displayed the same way in errors and logs (#2247, #2242, #2234)\n- **Slack:** Edited @mentions are ignored instead of re-running the agent (#1579)\n- **WPS Xiezuo:** style_content is parsed in rich text messages (#2198)\n- **WeCom:** The required task_id is sent on button_interaction cards (#2283)\n- **WeCom:** Quoted files are named and unavailable attachments are marked (#2225)\n\n**Other agents**\n- **Cursor:** Invented models are no longer listed when CLI discovery fails (#2094)\n- **Pi:** Custom providers are merged into the model list and reasoning efforts are model-aware (#1872)\n\n**Daemon, config and install**\n- **Config:** Enabling multi-workspace mode from the dashboard no longer breaks startup, closing the issue reported in v1.5.2 (#2266)\n- **Daemon:** launchd owns the restart transaction (#2286)\n\n### Other Changes\n\n- **i18n:** Russian translations read more clearly (#2101)\n\n### Behavior changes worth knowing\n\n- **MiniMax default model (#1192):** M3.1 Flash is now the default MiniMax model. Pass a model explicitly if you relied on the previous default.\n- **Feishu group reply-all (#1976):** reply-all now only applies to the chats you configure; other group chats are not answered.\n- **Feishu mentions of other users (#2012):** messages that mention another user are skipped instead of being answered.\n- **Feishu card clicks (#2281):** askq and permission cards can only be clicked by the user who raised the request.\n- **Slack edited mentions (#1579):** editing an @mention no longer re-runs the agent.\n\n### Breaking Changes\n\nNone. All new options are optional with safe defaults.\n\n### Contributors\n\nThanks to the **35 external contributors** who landed 62 changes in this release, and to the cc-connect team. 🎉\n\n@qvictl @ClaudieShannon @rumata-estor @openviking-superagent @daysai @Niko-Wu @bujueyunjian @gpYang @luyao10282 @RC-JYDDS @timmyagentic @yanyan1115 @adao-max @AhooraZen @BoYanZh @cloudgpuapp @deepziyu @DMianZhi @Felixkw12 @happyTonakai @heydryft @jojofran @M1racleShih @Matthew-Laplace @octo-patch @rainyMorning2 @RyoKusnadi @ShengLin1001 @shexiaobin @SunflowersLwtech @TongLing916 @vuyiv @WhyTan00 @xuli500177 @Yee-chen\n\n**Full Changelog**: https://github.com/chenhg5/cc-connect/compare/v1.5.2...v1.5.3\n","mentions_count":35}
