dp/numbat/pull/848\r\n* Fix binom for negative integer n by @upuddu in https://github.com/sharkdp/numbat/pull/870\r\n* Fix infinite recursion for bin(inf), hex(NaN), etc. by @amogusussy in https://github.com/sharkdp/numbat/pull/853\r\n* Fix Unix timestamp conversion precision by @arturict in https://github.com/sharkdp/numbat/pull/872\r\n* Fix simplification of nested derived units by @sharkdp in https://github.com/sharkdp/numbat/pull/884\r\n* Resolve unit names in the callable position of a call by @Peacanduck in https://github.com/sharkdp/numbat/pull/880\r\n* Fix unit simplification picking unrelated unit when the value is very small by @Saphereye in https://github.com/sharkdp/numbat/pull/877\r\n\r\n## New Contributors\r\n* @solson made their first contribution in https://github.com/sharkdp/numbat/pull/840\r\n* @upuddu made their first contribution in https://github.com/sharkdp/numbat/pull/870\r\n* @amogusussy made their first contribution in https://github.com/sharkdp/numbat/pull/853\r\n* @arturict made their first contribution in https://github.com/sharkdp/numbat/pull/872\r\n* @Peacanduck made their first contribution in https://github.com/sharkdp/numbat/pull/880\r\n* @Saphereye made their first contribution in https://github.com/sharkdp/numbat/pull/877\r\n\r\n**Full Changelog**: https://github.com/sharkdp/numbat/compare/v1.23.0...v1.24.0","reactions":{"total_count":5,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":7}
