00:07:06Z"},{"id":777292207,"node_id":"RA_kwDOOpAIvs4uVImv","name":"windows_mcp-0.9.0.tar.gz.publish.attestation","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":9412,"digest":"sha256:abcf207d6baaf482d509092d4e08a24e305ab3628332d3cb77dae7fd24b8c278","download_count":10,"created_at":"2026-11-22T00:07:06Z","updated_at":"2026-11-22T00:07:06Z"}],"body":"## What's Changed\n* fix(tree): skip windows that close during a capture instead of retrying them by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/609\n* fix(screenshot): add the capture origin to the image-to-screen conversion by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/613\n* fix(input): check that every MultiEdit text is a string before typing by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/612\n* fix(tree): sleep each window retry delay once instead of twice by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/610\n* chore(deps): bump joserfc from 1.7.5 to 1.7.6 by @dependabot[bot] in https://github.com/CursorTouch/Windows-MCP/pull/611\n* chore(deps): bump the all-dependencies group across 1 directory with 7 updates by @dependabot[bot] in https://github.com/CursorTouch/Windows-MCP/pull/604\n* fix(cli): ignore case in --exclude-tools and --tools, reject unknown names by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/617\n* chore(deps): bump opentelemetry-api from 1.45.1 to 1.45.2 by @dependabot[bot] in https://github.com/CursorTouch/Windows-MCP/pull/621\n* chore(deps): bump dnspython from 2.9.0 to 2.9.2 by @dependabot[bot] in https://github.com/CursorTouch/Windows-MCP/pull/620\n* chore(deps): bump the all-dependencies group with 3 updates by @dependabot[bot] in https://github.com/CursorTouch/Windows-MCP/pull/619\n* chore(deps): bump soupsieve from 2.10 to 4.0 by @dependabot[bot] in https://github.com/CursorTouch/Windows-MCP/pull/618\n* fix(snapshot): escape line breaks in UI tree names and values by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/615\n* fix(snapshot): stop listing edit fields scrolled out of view at (0,0) by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/616\n* fix(snapshot): list a browser's own controls in the UI tree by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/614\n* fix(snapshot): reject booleans as display indices by @CJstate in https://github.com/CursorTouch/Windows-MCP/pull/625\n* fix(tools): keep readable stderr lines preceding CLIXML output by @CJstate in https://github.com/CursorTouch/Windows-MCP/pull/624\n* fix(desktop): keep borderless and custom-frame windows in get_windows (#623) by @kings-avathar54 in https://github.com/CursorTouch/Windows-MCP/pull/627\n* fix(desktop): restore the indentation get_windows lost in #627 by @cyppe in https://github.com/CursorTouch/Windows-MCP/pull/630\n* perf(control): stop polling while idle (idle CPU 3.4% → ~0.2%) by @HeeyunCho in https://github.com/CursorTouch/Windows-MCP/pull/628\n* feat: fit the server to Claude Code and Claude Desktop by @HeeyunCho in https://github.com/CursorTouch/Windows-MCP/pull/629\n* fix(screenshot): release the last screenshot and idle dxcam cameras by @HeeyunCho in https://github.com/CursorTouch/Windows-MCP/pull/633\n* perf(flash): draw the capture glow as cached edge strips faded by constant alpha by @HeeyunCho in https://github.com/CursorTouch/Windows-MCP/pull/632\n* fix(clipboard): retry OpenClipboard while another process holds the clipboard by @FaberVi in https://github.com/CursorTouch/Windows-MCP/pull/527\n* fix(app): resize the window in front when App resize gets no name by @tanishqbaweja in https://github.com/CursorTouch/Windows-MCP/pull/634\n* fix(snapshot): show each element's label in the UI tree by @tanishqbaweja in https:/