{"id":416263251,"author":{"login":"litellm-dispatcher[bot]","id":279779857,"node_id":"BOT_kgDOEK0aEQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKALCgc4Yz6xT","tag_name":"v1.106.0","target_commitish":"main","name":"v1.106.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-18T03:22:41Z","updated_at":"2026-10-18T05:53:32Z","published_at":"2026-10-18T05:53:32Z","assets":[],"body":"## Verify Docker Image Signature\n\nAll LiteLLM Docker images are signed with [cosign](https://docs.sigstore.dev/cosign/overview/). Every release is signed with the same key introduced in [commit `0112e53`](https://github.com/BerriAI/litellm/commit/0112e53046018d726492c814b3644b7d376029d0).\n\n**Verify using the pinned commit hash (recommended):**\n\nA commit hash is cryptographically immutable, so this is the strongest way to ensure you are using the original signing key:\n\n```bash\ncosign verify \\\n  --key https://raw.githubusercontent.com/BerriAI/litellm/0112e53046018d726492c814b3644b7d376029d0/cosign.pub \\\n  ghcr.io/berriai/litellm:v1.106.0\n```\n\n**Verify using the release tag (convenience):**\n\nTags are protected in this repository and resolve to the same key. This option is easier to read but relies on tag protection rules:\n\n```bash\ncosign verify \\\n  --key https://raw.githubusercontent.com/BerriAI/litellm/v1.106.0/cosign.pub \\\n  ghcr.io/berriai/litellm:v1.106.0\n```\n\nExpected output:\n\n```\nThe following checks were performed on each of these signatures:\n  - The cosign claims were validated\n  - The signatures were verified against the specified public key\n```\n\n---\n## What's Changed\n* test(mcp): fire MCP client test deadlines on conditions instead of wall-clock time by @devin-ai-integration[bot] in https://github.com/BerriAI/litellm/pull/44166\n* fix(cost-map): add OpenAI TTS and GPT-5.x deprecation dates by @devin-ai-integration[bot] in https://github.com/BerriAI/litellm/pull/44175\n* fix