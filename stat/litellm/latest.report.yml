{"id":386467344,"author":{"login":"yuneng-berri","id":264297931,"node_id":"U_kgDOD8Ddyw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKALCgc4XCQYQ","tag_name":"v1.100.1","target_commitish":"litellm_internal_staging","name":"v1.100.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-10T01:10:35Z","updated_at":"2026-09-10T16:58:02Z","published_at":"2026-09-10T16:58:02Z","assets":[],"body":"## Verify Docker Image Signature\n\nAll LiteLLM Docker images are signed with [cosign](https://docs.sigstore.dev/cosign/overview/). Every release is signed with the same key introduced in [commit `0112e53`](https://github.com/BerriAI/litellm/commit/0112e53046018d726492c814b3644b7d376029d0).\n\n**Verify using the pinned commit hash (recommended):**\n\nA commit hash is cryptographically immutable, so this is the strongest way to ensure you are using the original signing key:\n\n```bash\ncosign verify \\\n  --key https://raw.githubusercontent.com/BerriAI/litellm/0112e53046018d726492c814b3644b7d376029d0/cosign.pub \\\n  ghcr.io/berriai/litellm:v1.100.1\n```\n\n**Verify using the release tag (convenience):**\n\nTags are protected in this repository and resolve to the same key. This option is easier to read but relies on tag protection rules:\n\n```bash\ncosign verify \\\n  --key https://raw.githubusercontent.com/BerriAI/litellm/v1.100.1/cosign.pub \\\n  ghcr.io/berriai/litellm:v1.100.1\n```\n\nExpected output:\n\n```\nThe following checks were performed on each of these signatures:\n  - The cosign claims were validated\n  - The signatures were verified against the specified public key\n```\n\n---\n## What's Changed\n* chore(release): backport #39568 and #39572 to stable/1.100.x and cut 1.100.1 by @devin-ai-integration[bot] in https://github.com/BerriAI/litellm/pull/40176\n* fix(router): backport #39491 to stable/1.100.x so retry breadcrumbs stop retaining every earlier request by @devin-ai-integration[bot] in https://github.com/BerriAI/litellm/pull/40455\n* revert: drop the spend attribution backports from stable/1.100.x by @devin-ai-integration[bot] in https://github.com/BerriAI/litellm/pull/40495\n\n\n**Full Changelog**: https://github.com/BerriAI/litellm/compare/v1.100.0...v1.100.1\n","mentions_count":1}
