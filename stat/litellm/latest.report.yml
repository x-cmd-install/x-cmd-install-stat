{"id":409579782,"author":{"login":"litellm-dispatcher[bot]","id":279779857,"node_id":"BOT_kgDOEK0aEQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKALCgc4YabEG","tag_name":"v1.105.0","target_commitish":"main","name":"v1.105.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-11T06:05:35Z","updated_at":"2026-10-11T09:53:26Z","published_at":"2026-10-11T09:53:26Z","assets":[],"body":"## Verify Docker Image Signature\n\nAll LiteLLM Docker images are signed with [cosign](https://docs.sigstore.dev/cosign/overview/). Every release is signed with the same key introduced in [commit `0112e53`](https://github.com/BerriAI/litellm/commit/0112e53046018d726492c814b3644b7d376029d0).\n\n**Verify using the pinned commit hash (recommended):**\n\nA commit hash is cryptographically immutable, so this is the strongest way to ensure you are using the original signing key:\n\n```bash\ncosign verify \\\n  --key https://raw.githubusercontent.com/BerriAI/litellm/0112e53046018d726492c814b3644b7d376029d0/cosign.pub \\\n  ghcr.io/berriai/litellm:v1.105.0\n```\n\n**Verify using the release tag (convenience):**\n\nTags are protected in this repository and resolve to the same key. This option is easier to read but relies on tag protection rules:\n\n```bash\ncosign verify \\\n  --key https://raw.githubusercontent.com/BerriAI/litellm/v1.105.0/cosign.pub \\\n  ghcr.io/berriai/litellm:v1.105.0\n```\n\nExpected output:\n\n```\nThe following checks were performed on each of these signatures:\n  - The cosign claims were validated\n  - The signatures were verified against the specified public key\n```\n\n---\n## What's Changed\n* feat(mcp): share compatibility-aware result conversion across tool surfaces by @devin-ai-integration[bot] in https://github.com/BerriAI/litellm/pull/43089\n* fix(caching): propagate auth cache invalidation over Redis Cluster via a node-level pub/sub client by @devin-ai-integration[bot] in https://github.com/B