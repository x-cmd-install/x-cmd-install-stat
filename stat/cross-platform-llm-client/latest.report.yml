{"id":433802091,"author":{"login":"orailnoor","id":34442749,"node_id":"MDQ6VXNlcjM0NDQyNzQ5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOSMYFpc4Z20tr","tag_name":"1.0.7-cluster","target_commitish":"b12a87118c1c05ccc617539d1b9dbfe94dcfc99c","name":"PrivateLM","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-31T10:33:49Z","updated_at":"2026-11-04T11:03:27Z","published_at":"2026-11-04T10:54:44Z","assets":[{"id":709186192,"node_id":"RA_kwDOSMYFpc4qRVKQ","name":"PrivateLM-1.0.7.apk","label":null,"uploader":{"login":"orailnoor","id":34442749,"node_id":"MDQ6VXNlcjM0NDQyNzQ5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":142020078,"digest":"sha256:2a5a70db468920494d23d62c6ba180b1ebf63014596229e998a2630786715556","download_count":2415,"created_at":"2026-11-04T11:02:39Z","updated_at":"2026-11-04T11:03:16Z"}],"body":"## PrivateLM\r\n\r\nRun one big AI model across several phones and iPads on the same Wi-Fi, then use it from your PC through an OpenAI-compatible API.\r\n\r\n### Download\r\n- **PrivateLM-1.0.7-cluster-test.apk**: universal, works on all Android phones\r\n\r\n### New\r\n- **Phone Cluster** (Settings → Phone Cluster)\r\n  - Pick one **Android phone as the master**: it loads the model and runs the chat.\r\n  - Other Android phones, iPhones and iPads join as **workers** by scanning a QR code.\r\n  - The model is split by each device's free memory and speed, so faster devices hold more of it.\r\n  - Wi-Fi stays awake while the cluster runs, and Samsung phones no longer slow the worker down in the background.\r\n  - If a worker drops off, the master finds it again.\r\n- **Server**\r\n  - Turn the model on your phones into an OpenAI-compatible API on your Wi-Fi, protected by an API key.\r\n  - Works with AnythingLLM, VS Code + Continue, and other OpenAI-compatible apps.\r\n- More models in the catalogue, plus crash fixes.\r\n\r\n### Tips\r\n- Keep all devices on the same Wi-Fi with their screens on.\r\n- Use your most powerful Android phone as the master.\r\n- Expect around 4–5 tokens/sec for a 26B model on four devices.\r\n\r\niPhone and iPad worker support is in the iOS app.\r\n","reactions":{"total_count":21,"+1":11,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":1,"rocket":5,"eyes":1}}
