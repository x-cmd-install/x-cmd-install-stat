13:25:57Z"},{"id":633863122,"node_id":"RA_kwDOSMYFpc4lx_vS","name":"app-x86_64-release.apk","label":"","uploader":{"login":"techjarves","id":54399984,"node_id":"MDQ6VXNlcjU0Mzk5OTg0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":48879735,"digest":"sha256:1e12005e5be6b2c57512462fbcdb7e26f9364d566b65ccbfe8032c671e92c3f1","download_count":51,"created_at":"2026-10-12T13:24:32Z","updated_at":"2026-10-12T13:25:22Z"}],"body":"## PrivateLM 1.0.7\n\nUpdates now install over 1.0.6 directly, with no uninstall needed.\n\n### Which APK?\n- **app-arm64-v8a-release.apk**: almost all modern Android phones\n- **app-armeabi-v7a-release.apk**: older or 32-bit phones\n- **app-x86_64-release.apk**: emulators and x86 devices\n- **app-universal-release.apk**: works everywhere (larger)\n\n### New\n- **In-app updates**: PrivateLM checks GitHub for new releases. When one is available, it shows the release notes and downloads the right APK for your phone, then opens the installer. You can also check manually in **Settings → App updates**, or turn the automatic check off there.\n- **New Models screen**:\n  - **My models**: your downloaded models, grouped by Chat, Vision and Image, each with a Load button.\n  - **Browse**: the catalogue, with a Recommended row and type filters.\n  - **Cloud**: online providers.\n  - Model names are cleaner, the quant is shown as detail, and each model family has a colour avatar.\n- **Import from folder**: pick a folder and choose which model files to copy in. Vision files come along with their models. Single-file import is still there.\n- **Simpler Settings**: short grouped lists (General, Chat, Performance, About). Each section opens its own page.\n\n### Fixes\n- Model rows no longer stay highlighted after a tap.\n"}
