1-02T15:58:49Z","updated_at":"2026-11-02T15:58:55Z"},{"id":702306274,"node_id":"RA_kwDOHUWeMM4p3Ffi","name":"ntr_openbsd_armv7","label":"","uploader":{"login":"tsosunchia","id":59512455,"node_id":"MDQ6VXNlcjU5NTEyNDU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14024985,"digest":"sha256:403664b1a1f031d76df7a5189b243248634af10eaec6149650294dcd07173914","download_count":5,"created_at":"2026-11-02T15:58:49Z","updated_at":"2026-11-02T15:58:55Z"},{"id":717630853,"node_id":"RA_kwDOHUWeMM4qxi2F","name":"ntr_windows_386.exe","label":"","uploader":{"login":"tsosunchia","id":59512455,"node_id":"MDQ6VXNlcjU5NTEyNDU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14453648,"digest":"sha256:df940fac3c095d3f069462648f9e491a9d68af0850a2d198124bc2b333fe5e1f","download_count":38,"created_at":"2026-11-06T15:39:44Z","updated_at":"2026-11-06T15:39:50Z"},{"id":717631175,"node_id":"RA_kwDOHUWeMM4qxi7H","name":"ntr_windows_amd64.exe","label":"","uploader":{"login":"tsosunchia","id":59512455,"node_id":"MDQ6VXNlcjU5NTEyNDU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15317904,"digest":"sha256:cb55fbc4bf5964c5e61d2d16f0bc514fa98955ebe2efa1109b9fc9b5af9a2bce","download_count":65,"created_at":"2026-11-06T15:39:52Z","updated_at":"2026-11-06T15:39:58Z"},{"id":717631449,"node_id":"RA_kwDOHUWeMM4qxi_Z","name":"ntr_windows_arm64.exe","label":"","uploader":{"login":"tsosunchia","id":59512455,"node_id":"MDQ6VXNlcjU5NTEyNDU1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14007184,"digest":"sha256:de4f0dc01766846607c523e095163a6dd2e9fe928a53fd2b9d5d2fb73758196d","download_count":30,"created_at":"2026-11-06T15:40:00Z","updated_at":"2026-11-06T15:40:05Z"}],"body":"## What's Changed\r\n\r\n* 修复 iTerm2 选字时 MTR TUI 旧画面堆叠的问题：实时与回放统一按行更新变化内容，避免连续刷新写入滚动历史，并改善窗口缩放、残行清理和 Unicode 显示 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/257\r\n* 修复 MTR 探测错误直接写入 stderr 导致交互画面错乱的问题：错误统一显示在 TUI 标题区，暂停时也能更新；收到成功响应或重置统计后清除提示\r\n* 修复 Windows ARM64 默认 IPv6 探测报错：ICMP、TCP、UDP 在 Traffic Class 为零时跳过系统不支持的 socket 设置，解决 `set IPv6 Traffic Class 0: not implemented on windows/arm64` by @KexyBiscuit in https://github.com/nxtrace/NTrace-dev/pull/260\r\n* 升级至 Go 1.27.3，正式发布、CI 和性能脚本统一使用 Go 默认 JSON 后端，移除 `GOEXPERIMENT=nojsonv2` 固定配置；继续使用 `encoding/json` v1 API\r\n* 改进 CI 专项验收调度：按改动路径选择检查，手动运行或无法读取差异时执行完整验收，保留基础测试、race 和跨平台构建 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/258\r\n* 更新依赖：`go-runewidth v0.0.31`、MCP Go SDK `v1.8.0`、`quic-go v0.64.1`、`table v1.4.1`、`gjson v1.20.0`、`x/net v0.61.0` 等\r\n\r\n额外的：  \r\nMTR 实时与回放画面按终端宽高显示，窗口较小时可放大查看更多跳；保存报告和会话录制仍保留完整统计。  \r\nWindows ARM64 的修复仅跳过零值 Traffic Class 设置，不代表支持非零 `--tos`；非零设置失败时仍会返回错误。  \r\n源码构建需要 Go 1.27.3+。对齐正式发布时使用默认 JSON 后端，无需再设置 `GOEXPERIMENT=nojsonv2`；macOS 最低支持版本仍为 13.0。  \r\n\r\n**Full Changelog**: https://github.com/nxtrace/NTrace-core/compare/v1.7.5...v1.7.6","mentions_count":2}
