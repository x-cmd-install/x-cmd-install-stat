:33:51Z","updated_at":"2026-10-11T08:33:55Z"}],"body":"## What's Changed\r\n\r\n* \u65b0\u589e `-k/--traceroute`\uff0c\u53ef\u663e\u5f0f\u9009\u62e9\u4f20\u7edf traceroute\uff1b`nexttrace-tiny` \u65b0\u589e\u53ef\u9009 MTR TUI\u3001\u62a5\u544a\u548c RAW \u6a21\u5f0f by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/229\r\n* \u4e09\u4e2a flavor \u5747\u652f\u6301 MTR JSON\uff1a`--mtr --json` \u8f93\u51fa NDJSON\uff0c`-r/-w --json` \u8f93\u51fa\u6700\u7ec8\u62a5\u544a by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/230\r\n* \u65b0\u589e MTR \u4f1a\u8bdd\u5f55\u5236\u4e0e\u79bb\u7ebf\u56de\u653e\uff1b\u5f55\u5236\u53ef\u4e0e TUI\u3001\u62a5\u544a\u3001RAW\u3001JSON \u8f93\u51fa\u914d\u5408\uff0c\u56de\u653e\u4e0d\u53d1\u8d77\u63a2\u6d4b by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/237\r\n* \u6269\u5c55 MTR \u7edf\u8ba1\u5217\uff0c\u65b0\u589e\u51e0\u4f55\u5747\u503c\u4e0e\u6296\u52a8\u6307\u6807\uff1b\u652f\u6301\u81ea\u5b9a\u4e49\u5217\u3001TUI \u5217\u7f16\u8f91\uff0c\u4ee5\u53ca\u5c06\u5f53\u524d\u7edf\u8ba1\u4fdd\u5b58\u4e3a TXT\u3001JSON \u6216 HTML \u62a5\u544a by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/231, https://github.com/nxtrace/NTrace-dev/pull/239, https://github.com/nxtrace/NTrace-dev/pull/240\r\n* \u65b0\u589e `--doctor` \u73af\u5883\u81ea\u68c0\uff0c\u5728\u4e0d\u53d1\u9001\u63a2\u6d4b\u5305\u7684\u60c5\u51b5\u4e0b\u62a5\u544a\u76ee\u6807\u89e3\u6790\u3001\u6e90\u5730\u5740\u9009\u62e9\u3001\u8def\u7531\u9884\u6d4b\u548c\u540e\u7aef\u521d\u59cb\u5316\u7ed3\u679c by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/232\r\n* \u65b0\u589e Linux `--fwmark`\uff0c\u4e3a\u672c\u5730 traceroute \u548c MTR \u63a2\u6d4b\u8bbe\u7f6e\u7b56\u7565\u8def\u7531\u6807\u8bb0\uff1b\u7cfb\u7edf\u8def\u7531\u89c4\u5219\u4ecd\u7531\u7528\u6237\u914d\u7f6e by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/233\r\n* \u52a0\u5f3a deploy/MCP \u8bf7\u6c42\u9650\u5236\uff1a\u9650\u5236\u63a2\u6d4b\u53c2\u6570\u548c\u767b\u5f55\u6b63\u6587\u5927\u5c0f\uff0c\u5e76\u8bbe\u7f6e HTTP \u8bfb\u53d6\u4e0e\u7a7a\u95f2\u8fde\u63a5\u8d85\u65f6 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/228\r\n* \u4fee\u590d MTR \u4e0e WebUI \u5bf9\u96f6 RTT \u6210\u529f\u54cd\u5e94\u7684\u7edf\u8ba1\u548c\u663e\u793a\u95ee\u9898\r\n* \u4fee\u6b63 `--tos` \u7b56\u7565\u8def\u7531\u9009\u6e90\u4e0e\u914d\u7f6e\u5931\u8d25\u5904\u7406\uff0c\u5e76\u6539\u8fdb\u6293\u5305\u8fc7\u6ee4\uff0c\u907f\u514d\u65e0\u5173 TOS \u6d41\u91cf\u6df7\u5165 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/236, https://github.com/nxtrace/NTrace-dev/pull/238\r\n* \u6539\u8fdb Geo HTTP \u8fde\u63a5\u4e0e\u7f13\u5b58\u590d\u7528\u3001DN42 GeoFeed \u524d\u7f00\u67e5\u8be2\u548c MTR \u805a\u5408\u5feb\u7167\u5904\u7406\uff0c\u964d\u4f4e\u91cd\u590d\u67e5\u627e\u4e0e\u70ed\u8def\u5f84\u5f00\u9500 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/218, https://github.com/nxtrace/NTrace-dev/pull/219, https://github.com/nxtrace/NTrace-dev/pull/220, https://github.com/nxtrace/NTrace-dev/pull/221\r\n* \u5347\u7ea7\u81f3 Go 1.27.1\uff0cmacOS \u53d1\u5e03\u6784\u5efa\u6700\u4f4e\u7248\u672c\u63d0\u9ad8\u81f3 13.0\uff1b\u66f4\u65b0 `quic-go`\u3001`go-runewidth`\u3001`miekg/dns`\u3001`testify` \u7b49\u4f9d\u8d56 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/216\r\n\r\n\u989d\u5916\u7684\uff1a  \r\n\u672c\u7248\u672c\u5c1a\u672a\u5207\u6362 `nexttrace` \u548c `nexttrace-tiny` \u7684\u9ed8\u8ba4\u6a21\u5f0f\uff0c\u9ed8\u8ba4\u4ecd\u4e3a\u4f20\u7edf traceroute\u3002\u4f9d\u8d56\u4f20\u7edf RAW \u8f93\u51fa\u7684\u8c03\u7528\u53ef\u4f7f\u7528 `--traceroute --raw`\uff1b\u672a\u6765\u9ed8\u8ba4\u6a21\u5f0f\u5207\u6362\u5c06\u53e6\u884c\u516c\u544a\u3002  \r\nMTR TUI \u548c `--mtr --raw` \u672a\u6307\u5b9a `-q` \u65f6\u6301\u7eed\u8fd0\u884c\uff1breport/wide \u6a21\u5f0f\uff08\u5305\u62ec\u4e0e `--raw` \u7ec4\u5408\uff09\u9ed8\u8ba4\u6bcf\u8df3\u63a2\u6d4b 10 \u6b21\u3002\u81ea\u52a8\u5316\u8c03\u7528\u8bf7\u663e\u5f0f\u8bbe\u7f6e `-q`\u3002  \r\nLinux `--fwmark` \u4ec5\u9002\u7528\u4e8e\u672c\u5730 traceroute/MTR\uff0cNextTrace \u4e0d\u4f1a\u4fee\u6539\u7cfb\u7edf\u8def\u7531\u89c4\u5219\uff1b\u8bbe\u7f6e\u6807\u8bb0\u9700\u8981\u76f8\u5e94 Linux capability\u3002  \r\nmacOS \u6700\u4f4e\u652f\u6301\u7248\u672c\u4e3a 13.0\u3002\u6e90\u7801\u6784\u5efa\u9700\u8981 Go 1.27.1+\uff1b\u5bf9\u9f50\u6b63\u5f0f\u53d1\u5e03\u6784\u5efa\u65f6\u4f7f\u7528 `GOEXPERIMENT=nojsonv2`\u3002  \r\n\r\n**Full Changelog**: https://github.com/nxtrace/NTrace-core/compare/v1.7.3...v1.7.4","mentions_count":1}
