eated_at":"2026-08-26T22:29:29Z","updated_at":"2026-08-26T22:29:36Z"}],"body":"## What's Changed\r\n\r\n* \u65b0\u589e traceroute \u7ec8\u6b62\u539f\u56e0\uff1a\u6839\u636e ICMPv4 / ICMPv6\u3001TCP\u3001UDP \u7684\u5b9e\u9645\u54cd\u5e94\u8bed\u4e49\u533a\u5206 `destination_reached`\u3001`unreachable` \u548c `max_hops`\uff0c\u4e0d\u518d\u901a\u8fc7\u54cd\u5e94 IP \u662f\u5426\u7b49\u4e8e\u76ee\u6807 IP \u5224\u65ad\u7ec8\u70b9 by @EveCat29 in https://github.com/nxtrace/NTrace-dev/pull/205\r\n* \u4fee\u590d\u7a33\u5b9a\u6536\u5230\u4e0d\u53ef\u8fbe\u54cd\u5e94\u540e\u4ecd\u7ee7\u7eed\u63a2\u6d4b\u66f4\u9ad8 TTL \u7684\u95ee\u9898\uff1b\u540c\u4e00 TTL \u5b58\u5728 transit \u54cd\u5e94\u65f6\u4f1a\u7ee7\u7eed\u63a2\u6d4b\uff0c\u907f\u514d ECMP \u8def\u5f84\u8bef\u7ec8\u6b62 by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/209\r\n* \u65b0\u589e\u6807\u51c6 ICMP unreachable marker\uff0c\u5305\u62ec `!N`\u3001`!H`\u3001`!P`\u3001`!F`\u3001`!X` \u7b49\uff1b\u5206\u7247 MTU \u672a\u77e5\u65f6\u4ec5\u8f93\u51fa `!F`\r\n* \u666e\u901a\u7ec8\u7aef\u8f93\u51fa\u548c Fast Trace \u65b0\u589e `Trace Stopped` \u7ec8\u6b62\u8bf4\u660e\uff1b`--output` / `--output-default` \u4f1a\u540c\u6b65\u5199\u5165\u65e0 ANSI \u7684\u7eaf\u6587\u672c\u539f\u56e0\r\n* CLI JSON \u65b0\u589e\u53ef\u9009 `StopReason`\uff0c\u5305\u542b `hop`\u3001`reason`\u3001`responses`\u3001`markers`\uff1bclassic / raw / JSON \u4e0d\u8ffd\u52a0\u6587\u672c footer\uff0c\u4fdd\u6301\u673a\u5668\u53ef\u8bfb\u8f93\u51fa\u517c\u5bb9\r\n* Web\u3001REST\u3001WebSocket \u548c MCP \u65b0\u589e\u7ed3\u6784\u5316 `stop_reason`\uff1bMTR report / raw \u65b0\u589e `path_end`\uff0c\u9010 probe \u8bb0\u5f55\u53ef\u643a\u5e26 `response`\r\n* MTR \u6539\u4e3a\u6839\u636e\u54cd\u5e94\u8bc1\u636e\u7ef4\u62a4\u8def\u5f84\u8fb9\u754c\uff1b\u65e0\u9650\u8fd0\u884c\u65f6 unreachable \u8fb9\u754c\u53ef\u88ab\u540e\u7eed transit \u54cd\u5e94\u91cd\u65b0\u6253\u5f00\uff0c\u6709\u9650\u8fd0\u884c\u4ee5\u6700\u7ec8 `path_end` \u4e3a\u51c6\r\n* MTR TUI\u3001report \u548c WebUI \u4f1a\u5c06 unreachable marker \u663e\u793a\u5728\u5bf9\u5e94 Host \u65c1\uff0c\u5e76\u6309\u8bed\u4e49\u7ec8\u70b9\u8fc7\u6ee4\u66f4\u9ad8 TTL \u7684\u9648\u65e7\u8bb0\u5f55\r\n* \u660e\u786e\u591a\u8f93\u51fa\u6a21\u5f0f\u4f18\u5148\u7ea7\uff1a`--json` > `--table` > `--classic` > `--raw` > `--output` > \u5b9e\u65f6\u8f93\u51fa\uff1b\u65e5\u5fd7\u8f93\u51fa\u88ab\u8986\u76d6\u65f6\u4f1a\u901a\u8fc7 stderr \u63d0\u793a\u4e14\u4e0d\u521b\u5efa\u65e0\u6548\u6587\u4ef6\r\n* \u5c06\u5b98\u65b9 GeoIP \u6570\u636e\u6e90\u7edf\u4e00\u547d\u540d\u4e3a `NextTrace API`\uff0c\u673a\u5668\u53ef\u8bfb `data_provider` \u89c4\u8303\u503c\u7edf\u4e00\u4e3a `NextTrace-API`\uff1b\u7ee7\u7eed\u517c\u5bb9\u5927\u5c0f\u5199\u4e0d\u654f\u611f\u7684 `LeoMoeAPI` / `LeoMoe` \u8f93\u5165\u522b\u540d by @tsosunchia in https://github.com/nxtrace/NTrace-dev/pull/208\r\n* \u4fee\u590d\u914d\u7f6e NextTrace API v4 token \u540e\u90e8\u5206\u670d\u52a1\u8bf7\u6c42\u4ecd\u521d\u59cb\u5316 v3 WebSocket \u8fde\u63a5\u7684\u95ee\u9898\r\n* \u66f4\u65b0\u4f9d\u8d56\uff1a`github.com/modelcontextprotocol/go-sdk` 1.7.0\u3001`github.com/stretchr/testify` 1.12.0\u3001`golang.org/x/mod` 0.40.0\u3001`golang.org/x/net` 0.58.0 \u7b49\r\n\r\n\u989d\u5916\u7684\uff1a  \r\n\u672c\u7248\u672c\u91cd\u70b9\u8c03\u6574 traceroute / MTR \u7684\u8def\u5f84\u7ec8\u6b62\u5224\u65ad\u3002\u7a0b\u5e8f\u4e0d\u518d\u901a\u8fc7\u6700\u540e\u4e00\u4e2a\u54cd\u5e94\u5730\u5740\u662f\u5426\u7b49\u4e8e\u76ee\u6807\u5730\u5740\u63a8\u65ad\u662f\u5426\u5230\u8fbe\u7ec8\u70b9\uff0c\u800c\u662f\u4f7f\u7528\u534f\u8bae\u54cd\u5e94\u8bed\u4e49\u3002  \r\n\u4f9d\u8d56\u7ed3\u6784\u5316\u8f93\u51fa\u7684\u7a0b\u5e8f\u5e94\u4f18\u5148\u8bfb\u53d6 traceroute \u7684 `stop_reason` / `StopReason` \u548c MTR \u7684 `path_end`\u3002  \r\nMTR raw stdout \u4ecd\u4fdd\u6301\u56fa\u5b9a 12 \u5217\uff0c\u4e0d\u53ef\u8fbe\u8fb9\u754c\u8bca\u65ad\u5199\u5165 stderr\u3002  \r\n\u65e7\u7684 `LeoMoeAPI` / `LeoMoe` provider \u8f93\u5165\u4ecd\u7136\u6709\u6548\uff0c\u4f46\u8f93\u51fa\u5df2\u7edf\u4e00\u4e3a `NextTrace-API`\u3002\r\n\r\n**Full Changelog**: https://github.com/nxtrace/NTrace-core/compare/v1.7.2...v1.7.3","mentions_count":2}
