d":"RA_kwDOABYSSs4ou_p1","name":"virtualenv.pyz.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":10570,"digest":"sha256:3ac6ba477f8eb56c5d2d59961e54b8deda75da4b436f8b69fc3beb5b7c2c35c8","download_count":3,"created_at":"2026-10-28T01:13:32Z","updated_at":"2026-10-28T01:13:32Z"},{"id":683408020,"node_id":"RA_kwDOABYSSs4ou_qU","name":"virtualenv.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":91303,"digest":"sha256:b0d7f0083cf796e5724bcc25b5f185aea87548d8acf8d255ed8cd41fd156326b","download_count":0,"created_at":"2026-10-28T01:13:33Z","updated_at":"2026-10-28T01:13:33Z"}],"body":"<a name=\"release-21-15-1-fixed\"></a>\n\n### Bug fixes\n\n- Keep the name of a seeded `console_scripts` entry that contains digits but does not end in a version, such as `python3-config` or `2to3`, instead of truncating it at the first digit; `python3-config` overwrote the environment's `python` executable ([#3451](https://github.com/pypa/virtualenv/pull/3451)) by @JingHao-Leon and @gaborbernat.\n- Copy the content of a symlinked directory when a tree is copied into an environment, instead of dropping it ([#3454](https://github.com/pypa/virtualenv/pull/3454)) by @JingHao-Leon and @gaborbernat.\n- Count each `-v`, `-q`, `-p` and `--try-first-with` option once instead of once per internal parsing pass, so `Session.verbosity` is 3 rather than 9 for a single `-v` ([#3457](https://github.com/pypa/virtualenv/pull/3457)) by @darrenhuai and @gaborbernat.\n- Copy the seed packages instead of failing when `VIRTUALENV_SYMLINK_APP_DATA` or `symlink_app_data` in the config file turns on symlink seeding on a host that cannot create symlinks, such as Windows without the symlink privilege ([#3465](https://github.com/pypa/virtualenv/pull/3465)) by @darrenhuai and @gaborbernat.\n- Run the interpreter that collects the target debug information (`-vv` output and `Creator.debug`) without `PYTHONPATH` and with the environment passed to `cli_run`, so the reported `sys.path` no longer lists the caller's `PYTHONPATH` entries ([#3474](https://github.com/pypa/virtualenv/pull/3474)) by @RaphaelFakhri and @gaborbernat.\n\n### New Contributors\n\n- @JingHao-Leon made their first contribution in https://github.com/pypa/virtualenv/pull/3454\n- @RaphaelFakhri made their first contribution in https://github.com/pypa/virtualenv/pull/3474\n- @FliegendeWurst made their first contribution in https://github.com/pypa/virtualenv/pull/3468\n\n[PyPI release](https://pypi.org/project/virtualenv/21.15.1/)\n\n[Full Changelog](https://github.com/pypa/virtualenv/compare/21.15.0...21.15.1)\n","mentions_count":5}
