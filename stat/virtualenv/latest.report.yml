tualenv.pyz.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":10482,"digest":"sha256:ab057c1338557659f0146ad2d733e033cd5c0e55b8a8ab13e350d1c91ced5d95","download_count":3,"created_at":"2026-09-23T03:09:42Z","updated_at":"2026-09-23T03:09:42Z"},{"id":582836041,"node_id":"RA_kwDOABYSSs4ivV9J","name":"virtualenv.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":89663,"digest":"sha256:89dd93bd96932aec07d5200d8e2c69236edcfb165debaa888b9dadd7902d4d72","download_count":2,"created_at":"2026-09-23T03:09:42Z","updated_at":"2026-09-23T03:09:42Z"}],"body":"<!-- Release notes generated using configuration in .github/release.yaml at 21.11.0 -->\n\n## What's Changed\n* ci(pre-release): disable the uv cache by @gaborbernat in https://github.com/pypa/virtualenv/pull/3288\n* ci: pass expressions to run scripts via env by @gaborbernat in https://github.com/pypa/virtualenv/pull/3292\n* ci(release): audit egress in build and publish by @gaborbernat in https://github.com/pypa/virtualenv/pull/3289\n* \ud83d\udcdd docs: define maintainer roles and access by @gaborbernat in https://github.com/pypa/virtualenv/pull/3290\n* ci: resolve zizmor auditor findings by @gaborbernat in https://github.com/pypa/virtualenv/pull/3297\n* ci(pre-commit): freeze hook revs to commit SHAs by @gaborbernat in https://github.com/pypa/virtualenv/pull/3298\n* docs: link docs and pyvideo over https by @gaborbernat in https://github.com/pypa/virtualenv/pull/3300\n* docs(development): add a one-year roadmap by @gaborbernat in https://github.com/pypa/virtualenv/pull/3304\n* \ud83d\udc1b fix(seed): fail closed when PyPI digest is unknown by @gaborbernat in https://github.com/pypa/virtualenv/pull/3302\n* \u2728 feat(release): publish SBOMs as release assets by @gaborbernat in https://github.com/pypa/virtualenv/pull/3299\n* docs(security): describe the project under the CRA by @gaborbernat in https://github.com/pypa/virtualenv/pull/3295\n* docs(template): name the trust boundary crossed by @gaborbernat in https://github.com/pypa/virtualenv/pull/3296\n* \u267b\ufe0f refactor(sbom): type the SPDX renderer by @gaborbernat in https://github.com/pypa/virtualenv/pull/3307\n* \u2728 feat(zipapp): publish an SBOM for the zipapp by @gaborbernat in https://github.com/pypa/virtualenv/pull/3310\n* \ud83d\udc77 ci(check): pin test tool downloads and bump them weekly by @gaborbernat in https://github.com/pypa/virtualenv/pull/3293\n* \ud83d\udcdd docs: explain what a release publishes and how to verify it by @gaborbernat in https://github.com/pypa/virtualenv/pull/3305\n* \ud83d\udc77 ci(release): verify the zipapp served by bootstrap.pypa.io by @gaborbernat in https://github.com/pypa/virtualenv/pull/3309\n* \ud83d\udc77 ci(release): mint app tokens instead of a PAT by @gaborbernat in https://github.com/pypa/virtualenv/pull/3301\n* \ud83d\udcdd docs(security): add threat model and assurance case by @gaborbernat in https://github.com/pypa/virtualenv/pull/3294\n* \ud83d\udc1b fix(zipapp): bundle wheels pinned by a PEP 751 lock by @gaborbernat in https://github.com/pypa/virtualenv/pull/3306\n* \ud83d\udcdd docs(security): sync threat model with merged fixes by @gaborbernat in https://github.com/pypa/virtualenv/pull/3312\n* \ud83d\udc1b fix(sbom): keep the build machine out of the SBOMs by @gaborbernat in https://github.com/pypa/virtualenv/pull/3311\n\n\n**Full Changelog**: https://github.com/pypa/virtualenv/compare/21.10.0...21.11.0","mentions_count":1}
