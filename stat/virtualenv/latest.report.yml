d":"RA_kwDOABYSSs4pULAg","name":"virtualenv.pyz.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":10770,"digest":"sha256:76c58a3ae1df36064f47f98cf3a676443f4c8a38551e8ba2db255c3fbb0820f1","download_count":1,"created_at":"2026-10-30T19:18:41Z","updated_at":"2026-10-30T19:18:41Z"},{"id":693153859,"node_id":"RA_kwDOABYSSs4pULBD","name":"virtualenv.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":91303,"digest":"sha256:35b2914530688fed66cd2f5f8b49fac7e45a87f8fc5ad83693c858d1e92e320c","download_count":1,"created_at":"2026-10-30T19:18:42Z","updated_at":"2026-10-30T19:18:42Z"}],"body":"<a name=\"release-21-15-2-fixed\"></a>\n\n### Bug fixes\n\n- Build the default application data folder only when no folder was given through `--app-data`, `VIRTUALENV_APP_DATA` or the configuration file, so `--read-only-app-data` with an explicit folder works when the default folder is missing, and writable runs stop creating an unused one. Folders from `VIRTUALENV_APP_DATA` and the configuration file now get the same checks as `--app-data` ([#3488](https://github.com/pypa/virtualenv/pull/3488)) by @darrenhuai and @gaborbernat.\n- Build the seed wheel image in a staging folder and move it into place only once it is complete, so an extraction that fails part way, for example on a full disk, after a killed process or on a path over the Windows length limit, no longer leaves a partial image that later runs seed as a pip without `METADATA`, `RECORD` or `INSTALLER` ([#3487](https://github.com/pypa/virtualenv/pull/3487)) by @darrenhuai and @gaborbernat.\n- Make `-p`/`--python` and `--try-first-with` replace the interpreters set by `VIRTUALENV_PYTHON`, `VIRTUALENV_TRY_FIRST_WITH` or the configuration file instead of being merged with them, so the configured interpreter no longer wins over the one asked for and a `-p` that finds nothing fails instead of falling back to it. Try several `VIRTUALENV_PYTHON` values in the order given rather than starting with the second ([#3494](https://github.com/pypa/virtualenv/pull/3494)) by @darrenhuai and @gaborbernat.\n- On Windows, re-create an environment in place when its copied interpreter files, such as `python.exe`, or its seeded packages are read-only, instead of failing with `PermissionError` ([#3492](https://github.com/pypa/virtualenv/pull/3492)) by @darrenhuai and @gaborbernat.\n- Reject an empty or whitespace-only destination. An empty one, and on Windows one made only of spaces, resolved to the current directory, so an unset `VENV` in `virtualenv --clear \"$VENV\"` deleted the working directory. Pass `.` to create the environment in the current directory ([#3491](https://github.com/pypa/virtualenv/pull/3491)) by @darrenhuai and @gaborbernat.\n- Restore the default prompt in `deactivate.bat` when `PROMPT` was undefined at activation, instead of leaving the environment name in front of it ([#3489](https://github.com/pypa/virtualenv/pull/3489)) by @darrenhuai.\n- Undefine `PATH` again in `deactivate.bat` when it was undefined at activation, instead of leaving the environment's `Scripts` folder on it, and stop a second `activate.bat` from adding that folder twice ([#3493](https://github.com/pypa/virtualenv/pull/3493)) by @darrenhuai and @gaborbernat.\n\n[PyPI release](https://pypi.org/project/virtualenv/21.15.2/)\n\n[Full Changelog](https://github.com/pypa/virtualenv/compare/21.15.1...21.15.2)\n","mentions_count":2}
