4Z"},{"id":392589094,"node_id":"RA_kwDOMZqJ2M4XZm8m","name":"gowall-arm64-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":13354755,"digest":"sha256:9820acf5dfeb717353fd227619fa84a81fb2b3ed633d5d749a33908a7cef46cb","download_count":24,"created_at":"2026-04-09T18:36:37Z","updated_at":"2026-04-09T18:36:38Z"},{"id":392589115,"node_id":"RA_kwDOMZqJ2M4XZm87","name":"gowall-arm64-windows.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":13285953,"digest":"sha256:1ad9e55237c15b3774795948b8eda39f397fcfe79da16051681a7c7c65ccac97","download_count":48,"created_at":"2026-04-09T18:36:40Z","updated_at":"2026-04-09T18:36:41Z"}],"body":"1) `Big Features` \u2757 \u2757 \r\n- `gowall bg`  now has access to models for removing the background of an image. [CPU-ONLY] for now. See [documentation](https://achno.github.io/gowall-docs/more_Image_processing/removeBackground) \r\n\r\n\t `u2net` (relatively fast,low resources) -> generally does very good.\r\n\t  `bria-rmbg` (slow, high resources) -> extremely good. \r\n\t  Also added `--bg-color` flag to replace the removed background with any color instead of only transparency.\r\n\r\n  onnx runtime only supports CUDA-12 and support will be added in a future release for GPU acceleration, i will also check out AMD ROCm.\r\n\r\n\tThe folders/path for `onnx` can be configured in `~/.config/gowall/config.yml`. This also allows NixOS users to bypass the `NixOS cant run dynamically linked executables` by downloading onnx runtime themselves and simply pointing the `.so` library to gowall by the config. If you downloaded bg removal models before you could also simply point their folder path to gowall to avoid making gowall re-download them. \r\n\r\n- The other big feature is all the color theory utilities (`gowall color ...`) that have been added in this update that help you in generating the colors needed for a custom theme\r\n\r\n   I have added a guide on how you can use them to create your custom theme [here](https://achno.github.io/gowall-docs/color/theme). Use custom themes,    stop relying on the default catppuccin,gruvbox etc.. output.\r\n\r\n<br>  \r\n\r\n\r\n2) `Features`\r\n\r\n- Improved the replace specific color feature `gowall convert img.png -r \"#EA6254,#F9E2AF,20\"`, making the replacement much smoother by changing the threshold,normalizing it and blending colors see differences [here](https://achno.github.io/gowall-docs/conversions/replaceColor#new-algorithm)\r\n- `Avif` image format support! You can now easily do everything you did with the other formats with avif. `gowall convert img.avif -t catppuccin` or `gowall convert img.png --output img.avif`\r\n- `gowall compress` now has a new `lossyavif` method where you can tweak the quality and speed to your liking to compress avif images. [here](https://achno.github.io/gowall-docs/compression)\r\n\r\n- `gowall effects tilt` command added, it makes really nice 3D isometric tilt/rotate effect to your image. Previously you would have needed something like GIMP to achieve this.  Documentation [here](https://achno.github.io/gowall-docs/effects/tilt)\r\n- `gowall stack` command added, Stack images in any way you want by specifying a grid (ex. 3x3) or horizontally or vertically, seperate them with a border of your color and pixel size. Documentation [here](https://achno.github.io/gowall-docs/more_Image_processing/stack)\r\n- Added a `--radius -r flag` in the border command so now you can add rounded borders to your image: \r\nExample :  `gowall draw border ~/Pictures/Unixporn/rice/1.png  -c #ffffff -r 30 -b 3`. Documentation [here](https://achno.github.io/gowall-docs/more_Image_processing/draw)\r\n- Added `gowall resize`. Guess what it does lol. Batch resizing icons to 32x32 is useful for me. Documentation [here](https://achno.github.io/gowall-docs/more_Image_processing/resize) <--\r\n- Enabled preview support for gifs in the kitty terminal\r\n\r\n\r\n<br>  \r\n\r\n3) `Quality Features`\r\n\r\n- added `--preview` true/false global flag for all commands, that overrides \t`EnableImagePreviewing` from `config.yml`, closes #73 [here](https://achno.github.io/gowall-docs/global_flags)\r\n- added `--yes` global flag which allows you to auto accept any `y/n` confirmation prompts, very useful for automation since the first time you download gowall and it wants to download lets say a model it requires confirmation, but with this you can skip it. \r\n\r\n\t```\r\n\t# Example (skips 2 confirmations for the onnx runtime & u2net model)\r\n\tgowall bg ~/Pictures/hollow-knight.jpg  --yes\r\n\t```\r\n\tCloses #84  [here](https://achno.github.io/gowall-docs/global_flags)\r\n\r\n- added `ayu` theme and all its variants, closes #77\r\n\r\n\r\n<br>  \r\n\r\n4) `Bug Fixes`\r\n\r\n- Fixed `gowall -w` `Could not fetch wallpaper of the day: there wasn't a top wallpaper today :( check later` error that was happening because gowall couldn't verify a challenge to prove that its not scraping content.\r\n- Fixed 429 rate limit that got returned by `gowall -w` on MacOS closes #81\r\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":0,"eyes":0}}
