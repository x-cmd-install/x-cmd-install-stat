:26:38Z"},{"id":640790115,"node_id":"RA_kwDOAi1mvs4mMa5j","name":"doctl-2.0.0-windows-386.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22753843,"digest":"sha256:7003422c3c4ea498eeb8cc46ef8733fa75bfba9816e0f39a3c67915dbbbb4ef0","download_count":90,"created_at":"2026-10-14T15:26:33Z","updated_at":"2026-10-14T15:26:34Z"},{"id":640790234,"node_id":"RA_kwDOAi1mvs4mMa7a","name":"doctl-2.0.0-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":23691100,"digest":"sha256:519fca5d4d99c7d2d7ca6771b6ac2a50a872436f40639acdcddd2412b73d1311","download_count":1425,"created_at":"2026-10-14T15:26:35Z","updated_at":"2026-10-14T15:26:37Z"},{"id":640790250,"node_id":"RA_kwDOAi1mvs4mMa7q","name":"doctl-2.0.0-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21538039,"digest":"sha256:3355ac8f5fcd487a2c75f8703f1cf180c53d4a7cf32eea2444c413fee83432a5","download_count":77,"created_at":"2026-10-14T15:26:35Z","updated_at":"2026-10-14T15:26:37Z"}],"body":"**What's Changed:**\r\n\r\n**Cleaner terminal experience**\r\n- doctl now understands your terminal better — colour, width, and plain text when you’re piping or running in CI — so output stays readable whether you’re in a terminal or a script.\r\n\r\n**Clearer flag errors**\r\n- Missing or invalid flags are caught before the API is called, with plain-language messages and hints on what to fix.\r\n\r\n**Better waiting on long operations**\r\n- Commands that use --wait share one consistent progress style. There’s a timeout (default 30 minutes) so a wait can’t hang forever, and failed operations are reported as failures. Progress goes to stderr so piping still works.\r\n\r\n**Welcome when you run doctl**\r\n- Running doctl with no arguments shows a short welcome: version, account, team, context, and a few next steps — plus a note if a newer version is available. Use doctl --help for the full command list.\r\n\r\n**Safer auth config**\r\n- auth switch and auth remove no longer rewrite your whole config file. Environment tokens are no longer accidentally saved to disk.\r\nIf you’ve used doctl in CI with DIGITALOCEAN_ACCESS_TOKEN set, check your config file and rotate the token if it was saved there.\r\n\r\n**Masked secrets by default**\r\n- Secret values and database passwords (including those inside connection strings) are masked in terminal output. Pass --show to reveal them. In CI, values are still returned unmasked so scripts keep working without the flag.\r\n\r\n**Clearer errors**\r\n- Failures now show a short title, why it failed, status when relevant, and a next step when one helps. Request IDs are included when the API provides them. Typos in nested commands (for example under compute) now exit with an error instead of looking like success.\r\n\r\n**Styled help**\r\n- --help uses a consistent, easier-to-scan layout across commands, with examples highlighted.\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
