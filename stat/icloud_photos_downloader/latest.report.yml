{"id":434430455,"author":{"login":"boredazfcuk","id":14807258,"node_id":"MDQ6VXNlcjE0ODA3MjU4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOA4DTZc4Z5OH3","tag_name":"v1.33.0","target_commitish":"master","name":"v1.33.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-03T21:28:47Z","updated_at":"2026-11-04T20:41:18Z","published_at":"2026-11-04T20:41:18Z","assets":[],"body":"## What's Changed\r\n* ci: move macOS jobs to macos-15 and actions to Node 24 by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1395\r\n* fix(deps): bump certifi to 2026.10.23 for GHSA-6q48-6c7w-9gw2 by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1396\r\n* feat: support Python 3.14, drop 3.10 by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1397\r\n* ci: cancel superseded runs, add job timeouts, generate test locales instead of installing locales-all by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1398\r\n* fix: warn instead of crashing when --use-os-locale can't use the system locale by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1401\r\n* ci: run the npm/npx compatibility tests for Arm on Arm runners by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1402\r\n* ci: batch the Linux compatibility tests (376 → 73 jobs), move to ubuntu-24.04 by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1399\r\n* fix: only delete from iCloud with --keep-icloud-recent-days when the photo is present locally by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1403\r\n* build(deps): update dependencies, including urllib3 2 by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1404\r\n* fix: don't let undecodable XMP metadata stop the download run by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1405\r\n* fix: skip a locked or unavailable keyring instead of crashing login by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1406\r\n* build: support Python 3.15 and build binaries and Docker images with it by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1407\r\n* Report a login error instead of KeyError: 'dsInfo' when the session is invalid by @Kernel-Hunter in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1382\r\n* fix: retry library indexing state check before failing (#1387) by @sithikaf in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1388\r\n* feat: add --adp-web-access for Advanced Data Protection accounts by @Mehdi-Leqsiouer in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1392\r\n* fix: yield every asset when several share one master by @helinwang in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1394\r\n* fix: warn when iCloud never confirms ADP web access, list --adp-web-access as experimental by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1408\r\n* test: cover skipping an asset whose master record is missing by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1409\r\n* fix: warn when --keep-icloud-recent-days is combined with --recent or --until-found by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1410\r\n* fix: include time zone data so icloud/icloudpd run without a system tz database by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1411\r\n* docs: document the Linux binary variants and the Alpine 3.20+ minimum for musl by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1412\r\n* ci: fix false failures in the compatibility report, add tzlc table to notes by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1413\r\n* fix: build the macOS binaries for Intel and Apple Silicon by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1414\r\n* fix: treat JPEG XL and other unknown image types as photos, not videos by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1415\r\n* fix: don't crash the icloud tool on a locked or unavailable keyring by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1416\r\n* Propagate exit code from the icloudpd executable by @Kernel-Hunter in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1380\r\n* Reject --skip-created-before later than --skip-created-after by @Kernel-Hunter in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1381\r\n* fix: trigger the 2FA push in the icloud tool by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1417\r\n* fix: RFC 5322 Date header in the 2FA expiry email by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1418\r\n* fix: --auto-delete uses the file match policy and filename cleaner by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1421\r\n* fix: keep the name-id7 suffix on adjusted and alternative files by @jterpstra1 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1419\r\n* Skip XMP sidecars when only printing filenames by @victorwon2001 in https://github.com/icloud-photos-downloader/icloud_photos_downloader/pull/1374\r\n* feat: sign in with a security key (FIDO) by @spinnerich in https://github.com/icloud-photos-downloader/icloud_p