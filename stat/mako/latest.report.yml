{"id":394113303,"author":{"login":"sqla-tester","id":8250554,"node_id":"MDQ6VXNlcjgyNTA1NTQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCX3SNs4XfbEX","tag_name":"rel_1_4_3","target_commitish":"main","name":"1.4.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-22T20:53:48Z","updated_at":"2026-09-22T20:54:36Z","published_at":"2026-09-22T20:54:36Z","assets":[],"body":"\n# 1.4.3\n\nReleased: Tue Sep 22 2026\n## bug\n\n\n-   **[bug] [tests]** Fixed regression caused in 1.4.2 where tests added to the suite were\n    unable to run directly on Windows, due to posix mechanics: the tests force\n    `os.path` to `posixpath`, whereas\n    `TemplateLookup.get_template()` converts the configured directory\n    using `os.path.sep`.  These tests are now skipped on that platform,\n    where the traversal check is instead exercised against `ntpath`\n    natively.\n    \n    References: [#441](https://github.com/sqlalchemy/mako/issues/441)\n"}
