57:26Z","updated_at":"2026-09-14T01:57:27Z"},{"id":562338328,"node_id":"RA_kwDOQxRn384hhJoY","name":"gifgrep_0.4.2_linux_arm64.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":104,"digest":"sha256:41a4aa9f22cd2f7ff68093ccbf4cccfb194181883a3904afcc91b806f412ae08","download_count":1,"created_at":"2026-09-14T01:57:26Z","updated_at":"2026-09-14T01:57:27Z"}],"body":"**Highlights:** TUI selection, Escape, and download handling are fixed; API keys never leak into transport errors.\n\n- TUI: keep selection visible in small terminals, show the serving provider after fallback, and isolate saved/prefetched files by asset URL so reveal cannot open an unrelated download.\n- TUI: exit on closed input, handle standalone Escape, and cancel background downloads when replacing results or quitting.\n- Search: keep API keys and queries out of transport errors, and return failure when buffered stdout cannot be written.\n- Extraction: use the complete GIF, include every frame when requested, reject invalid timestamps, and validate image/sheet dimensions before allocation (40-million-pixel sheet limit).\n- Docs: correct search formats, thumbnail flags and protocol help, optional JSON fields, and terminal preview behavior; keep the generated site in sync.\n- Compatibility: source builds now require Go 1.26, the oldest maintained Go line, for the updated terminal/system dependencies; prebuilt binary usage is unchanged.\n- Dependencies: update x/term to 0.46.0, x/sys to 0.48.0, and Playwright to 1.63.0; test Linux/macOS, the minimum Go line, race detection, built CLI commands, and generated docs in CI.\n"}
