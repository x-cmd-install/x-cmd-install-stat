ux-arm64.sha256sum","label":null,"uploader":{"login":"stmcginnis","id":3922475,"node_id":"MDQ6VXNlcjM5MjI0NzU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":83,"digest":"sha256:bd011d3df2a96add8327677e09eea29ab018671b4098de4fb08c463bdcbf5d92","download_count":3369,"created_at":"2026-08-26T21:54:51Z","updated_at":"2026-08-26T21:54:51Z"},{"id":531396499,"node_id":"RA_kwDOCNqhD84frHeT","name":"kind-windows-amd64","label":null,"uploader":{"login":"stmcginnis","id":3922475,"node_id":"MDQ6VXNlcjM5MjI0NzU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":10844160,"digest":"sha256:4b22adaa135368c5a465d56bbd8e520cbea87272a06ca00b6078e7b81515c9fc","download_count":6798,"created_at":"2026-08-26T21:54:51Z","updated_at":"2026-08-26T21:54:52Z"},{"id":531396506,"node_id":"RA_kwDOCNqhD84frHea","name":"kind-windows-amd64.sha256sum","label":null,"uploader":{"login":"stmcginnis","id":3922475,"node_id":"MDQ6VXNlcjM5MjI0NzU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":85,"digest":"sha256:f68110eec971ce989190b5f11353455a6b7e2cf36aab2f4e5313dd08b6e1231e","download_count":1246,"created_at":"2026-08-26T21:54:52Z","updated_at":"2026-08-26T21:54:53Z"}],"body":"This release contains critical dependency updates, bug fixes, and defaults to Kubernetes 1.36.1.\r\n\r\n# Breaking Changes\r\n\r\nThe default node image is now  `kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5`.\r\n\r\n# New Features\r\n\r\n* Assorted dependency updates.\r\n\r\nImages pre-built for this release:\r\n\r\n* v1.37.0: `kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5`\r\n* v1.36.4: `kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed`\r\n* v1.35.8: `kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0`\r\n* v1.34.11: `kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d`\r\n\r\n**NOTE**: You *must* use the `@sha256` digest to guarantee an image built for this release, until such a time as we switch to a different tagging scheme. Even then we will highly encourage digest pinning for security and reproducibility reasons.\r\n\r\nSee also:\r\n\r\n* https://kind.sigs.k8s.io/docs/user/quick-start/#creating-a-cluster\r\n* https://kind.sigs.k8s.io/docs/user/quick-start/#building-images\r\n\r\nNOTE: These node images support amd64 and arm64, both of our supported platforms. **You must use the same platform as your host,** for more context see [#2718](https://github.com/kubernetes-sigs/kind/issues/2718)\r\n\r\n# Fixes\r\n\r\n* Respect Docker client proxy config for docker nodes. (#4192)\r\n* Preserve external load balancer CDS/LDS configuration across container restarts. (#4195)\r\n* Improve local-path-provisioner helperPod tolerations. (#4210)\r\n* Assorted documentation fixes and improvements.\r\n\r\n# Contributors\r\n\r\nCommitters for this release:\r\n* @antoineco\r\n* @BenTheElder\r\n* @christian-heusel\r\n* @erichorwath\r\n* @immanuwell\r\n* @jboero\r\n* @k8s-ci-robot\r\n* @liggitt\r\n* @null\r\n* @popsiclelmlm\r\n* @sestegra\r\n* @stmcginnis\r\n* @tom1299\r\n\r\nWe'd also like to thank everyone who touched the codebase, filed issues, and helped the community!","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":13}
