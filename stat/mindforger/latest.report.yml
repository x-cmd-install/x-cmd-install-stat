T21:36:04Z","updated_at":"2026-09-26T21:36:48Z"},{"id":591507876,"node_id":"RA_kwDOBt-Aos4jQbGk","name":"mindforger_2.5.0_tarball.tgz","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-compressed-tar","state":"uploaded","size":21845391,"digest":"sha256:172c3a0a3f2cecdf8ddfefacc573187aa9fc7f5d3eb8ce698a3dbc79a1925aaf","download_count":5,"created_at":"2026-09-26T21:36:48Z","updated_at":"2026-09-26T21:36:56Z"},{"id":591508058,"node_id":"RA_kwDOBt-Aos4jQbJa","name":"windows-installer-mindforger-2.5.0.exe","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":94201329,"digest":"sha256:3cb3fc8c441578d59cafea43f51faa654e40d565f137f5b5fdcc959d21568315","download_count":35,"created_at":"2026-09-26T21:36:56Z","updated_at":"2026-09-26T21:37:23Z"}],"body":"<img width=\"1958\" height=\"1281\" alt=\"Screenshot from 2026-09-26 23-18-50\" src=\"https://github.com/user-attachments/assets/e8c6dcbb-8705-45a6-a222-a1b62760f4fe\" />\r\n\r\nThis **minor** [MindForger](https://www.mindforger.com/) release brings rewrite of associations lookup and visualization, new status bar w/ `ADLMSTW` diodes and new Debian PPA.\r\n\r\n* **Mind inspired features**\r\n    * 3rd generation of the Notebook/Notes associations - [Best Matching 25](https://en.wikipedia.org/wiki/Okapi_BM25) based associations algorithm (BM25; evolution of BoW; TF-IDF + normalization which prevents long(er) docs from winning): Notes are matched by whole words (e.g. \"art\" no longer matches \"start\"), rare words weigh more than common ones (TF-IDF), long Notes no longer win just because of their length, Notes sharing tags w/ the current Note/Notebook are associated and the associations are computed ~2x faster.\r\n    * Association score is shown visually as a meter and the precise score is newly shown in the tooltip only.\r\n* **Status bar**\r\n    * Status bar indicators (\"diodes\") in the lower right corner of the main window - a capsule w/ autolinking (A), diagrams (D), live spell check (L), math (M), source code syntax highlighting (S), thinking (T) and Wingman availability (W) segments.\r\n* **Distributions**\r\n    * MindForger is newly provided for Debian 13 Trixie in addition to Debian 12 Bookworm (Debian 11 Bullseye, 10 Buster and 9 Stretch PPAs are kept, but frozen) at https://www.mindforger.com/debian-ppa/        \r\n    * Debian PPA signing key self-signatures were refreshed from SHA-1 to SHA-512 (the key fingerprint is unchanged) as Debian Trixie apt rejects keys w/ SHA-1 self-signatures - please DO re-import the key from https://www.mindforger.com/gpgpubkey.txt    \r\n* **Fixes**\r\n    * Autolinking, thinking and math are stable enough so that they are newly enabled by default after fresh MindForger installation.\r\n\r\n---\r\n\r\n[Ubuntu PPA](https://launchpad.net/~ultradvorka/+archive/ubuntu/productivity/+packages) | [Debian PPA](http://mindforger.com/debian-ppa/) | [Windows nightly builds](https://ci.appveyor.com/project/dvorka/mindforger/build/artifacts)\r\n\r\n[![Download MindForger](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/mindforger/files/2.5.0/)"}
