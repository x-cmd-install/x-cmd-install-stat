,{"id":543095303,"node_id":"RA_kwDOBt-Aos4gXvoH","name":"windows-installer-mindforger-2.1.0-ff388a4.exe","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":92451987,"digest":"sha256:f1267d8d778eb8aeb18e31a594274e5f956f58e60b4943617b46059ab5b9fee3","download_count":53,"created_at":"2026-09-03T17:20:54Z","updated_at":"2026-09-03T17:21:22Z"}],"body":"<img width=\"1929\" height=\"1224\" alt=\"Screenshot from 2026-09-03 19-03-19\" src=\"https://github.com/user-attachments/assets/576f02f9-76cc-458c-b7b8-3a7808e1521d\" />\r\n\r\nThis **minor** [MindForger](https://www.mindforger.com/) release brings improved autolinking, **Snap** distribution, new local **large language models** providers, various fixes and small enhancements:\r\n\r\n* **Autolinking**\r\n    * Manual links are newly rendered in a different color than\r\n      autolinker created links.\r\n* **Snap**\r\n    * Install MindForger either from the [snapcraft.io](https://snapcraft.io/mindforger) (strict confinement) or by downloading the `.snap` (classic confinement).\r\n* **Wingman**:\r\n    * Added Ollama as local LLM provider (privacy) and OpenRouter as new remote LLM provider (100s of SOTA models).    \r\n* **Fixes and enhancements**:\r\n    * Check various [minor fixes](https://github.com/dvorka/mindforger/blob/dev/2.1.0/Changelog) and [enhancements](https://github.com/dvorka/mindforger/blob/dev/2.1.0/Changelog).\r\n\r\n---\r\n\r\n[Ubuntu PPA](https://launchpad.net/~ultradvorka/+archive/ubuntu/productivity/+packages) | [Debian PPA](http://mindforger.com/debian/) | [Windows nightly builds](https://ci.appveyor.com/project/dvorka/mindforger/build/artifacts)\r\n\r\n\r\n[![Download MindForger](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/mindforger/files/2.1.0/Snap%2C%20Autolinking%20colorization%20and%20Wingman%20source%20code.zip/download)"}
