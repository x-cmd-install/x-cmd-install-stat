26-10-28T11:55:13Z"},{"id":684842519,"node_id":"RA_kwDOAtASYM4o0d4X","name":"conan-2.34.0-windows-i686.zip","label":"","uploader":{"login":"conan-release[bot]","id":219083861,"node_id":"BOT_kgDODQ70VQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":13920801,"digest":"sha256:e452cf9db22b16940a8ea472d606ae0a60fb0b60bd542b9351352911663baa69","download_count":11,"created_at":"2026-10-28T11:55:10Z","updated_at":"2026-10-28T11:55:11Z"},{"id":684842805,"node_id":"RA_kwDOAtASYM4o0d81","name":"conan-2.34.0-windows-x86_64-installer.exe","label":"","uploader":{"login":"conan-release[bot]","id":219083861,"node_id":"BOT_kgDODQ70VQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":15310084,"digest":"sha256:d161e18eda229ebd5bc86435580c64296c93fa4cd1d03cca455280bb30754fa7","download_count":761,"created_at":"2026-10-28T11:55:16Z","updated_at":"2026-10-28T11:55:17Z"},{"id":684842720,"node_id":"RA_kwDOAtASYM4o0d7g","name":"conan-2.34.0-windows-x86_64.zip","label":"","uploader":{"login":"conan-release[bot]","id":219083861,"node_id":"BOT_kgDODQ70VQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15695787,"digest":"sha256:4e8c75dfb5f9913fe3eec6c0c982986f13041eae6e8c3b116268489b21951232","download_count":401,"created_at":"2026-10-28T11:55:14Z","updated_at":"2026-10-28T11:55:15Z"}],"body":"- Feature: Define `/MP` in `CMakeToolchain` for `clang-cl` with Visual Studio generators (`ClangCL` toolset), like `msvc`. (https://github.com/conan-io/conan/pull/20439)\n- Feature: Reduce local cache sqlite3 DB calls (33% fewer for regular installs with cached packages). (https://github.com/conan-io/conan/pull/20434)\n- Feature: Simplify the build step terminal output, removing duplicated package references. (https://github.com/conan-io/conan/pull/20426)\n- Feature: Add ``CMAKE_PREFIX_PATH`` as fallback to ``CMakeConfigDeps`` for cases beyond the ``<pkg>_DIR`` variable. (https://github.com/conan-io/conan/pull/20420). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4569)\n- Feature: Pass original URLs to backup source remotes in the `X-Conan-Origin-Urls` header. (https://github.com/conan-io/conan/pull/20385). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4564)\n- Feature: Update `conan new bazel_lib` and `conan new bazel_exe` templates to Bazel 7. (https://github.com/conan-io/conan/pull/20367). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4565)\n- Feature: Add a ``command_alias.conf`` file to define command aliases and shortcuts without writing a custom command. (https://github.com/conan-io/conan/pull/20365)\n- Feature: Support the new CPS ``dyld_requires`` (CMake>=4.4) for transitive shared libraries on Linux. (https://github.com/conan-io/conan/pull/20362)\n- Feature: Add `cmake_file_names` dict property to `CMakeConfigDeps` to generate several CMake CONFIG files per package. (https://github.com/conan-io/conan/pull/20298). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4568)\n- Feature: Add an optional `components` argument to `aggregated_components()` to aggregate only the given components. (https://github.com/conan-io/conan/pull/20298). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4568)\n- Feature: Always generate ``.ps1`` environment launchers, alongside the ``.bat``/``.sh`` ones, for the consumer, editables and ``test_package``. (https://github.com/conan-io/conan/pull/19649). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4573)\n- Fix: Clarify in the ``PackagesList.items()`` docstring that it only returns revision-specific information. (https://github.com/conan-io/conan/pull/20432)\n- Fix: Add docstrings to the ``PkgReference`` class of the Python API. (https://github.com/conan-io/conan/pull/20431). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4570)\n- Fix: Remove the legacy warning about ConanCenter being frozen for Conan 1 clients. (https://github.com/conan-io/conan/pull/20425)\n- Fix: Remove the ``python-dateutil`` dependency for Python>=3.11. (https://github.com/conan-io/conan/pull/20419)\n- Fix: Resolve ``LocalAPI.editable_add`` relative ``output_folder`` against the ``cwd`` argument. (https://github.com/conan-io/conan/pull/20416)\n- Fix: Make ``conan cache clean --backup-sources`` only clean the backup sources of the selected recipes. (https://github.com/conan-io/conan/pull/20415)\n- Fix: Allow several negated patterns, and mixing them with inclusions, in remote ``--allowed-packages``. (https://github.com/conan-io/conan/pull/20412)\n- Fix: Avoid a ``VirtualRunEnv`` generation crash with ``win_bash=True`` when cross-building from Linux to Windows. (https://github.com/conan-io/conan/pull/20407)\n- Fix: Correct Python API docstrings for ``ListAPI``, ``CacheAPI`` and other subapis that did not match their behavior. (https://github.com/conan-io/conan/pull/20405)\n- Fix: Correct the ``ListAPI.latest_recipe_revision`` docstring, as it always raises if the reference is not found. (https://github.com/conan-io/conan/pull/20400)\n- Fix: Report a proper error for non-integer ``--lru`` time values. (https://github.com/conan-io/conan/pull/20399)\n- Fix: Avoid duplicating `tools.build:sharedlinkflags` from `conf` in `BazelToolchain`. (https://github.com/conan-io/conan/pull/20390)\n- Fix: Join multiple SBOM license expressions with ``AND`` to comply with the CycloneDX standard. (https://github.com/conan-io/conan/pull/20382)\n- Fix: Allow running `conan remote logout` for disabled remotes. (https://github.com/conan-io/conan/pull/20381)\n- Fix: Replace stale ``CONAN_RUNTIME_LIB_DIRS`` entries in ``CMakeConfigDeps`` when installing a new package revision. (https://github.com/conan-io/conan/pull/20378)\n- Fix: Raise an error for ``--requires=pkg/version@_``, an undocumented and unsupported Conan 1 legacy syntax. (https://github.com/conan-io/conan/pull/20371)\n- Fix: Remove Conan 1.X legacy ``alias`` (undocumented and unsupported) code. (https://github.com/conan-io/conan/pull/20370)\n- Fix: Make the ``workspace`` experimental warning skippable with ``core:skip_warnings``. (https://github.com/conan-io/conan/pull/20369)\n- Fix: Add deprecation warnings for Bazel 6 support in the `BazelDeps` generator. (https://github.com/conan-io/conan/pull/20367). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4565)\n- Fix: Filter ``CMakeConfigDeps`` target data based on require traits, aligned with ``CMakeDeps``. (https://github.com/conan-io/conan/pull/20277). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4572)\n- Fix: ``tools.env.virtualenv:powershell`` no longer replaces the ``.bat``/``.sh`` launchers. ``self.run()`` only uses ``.ps1`` launchers when this conf is defined. (https://github.com/conan-io/conan/pull/19649). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4573)\n- Bugfix: Avoid accumulating variables when calling `GnuToolchain._environment` several times. (https://github.com/conan-io/conan/pull/20446)\n- Bugfix: Avoid internal ``rmdir`` failures when removing Windows folders with read-only permissions. (https://github.com/conan-io/conan/pull/20440)\n- Bugfix: Do not install host profile ``[tool_requires]`` in ``conan install`` with only ``--tool-requires`` arguments. (https://github.com/conan-io/conan/pull/20422). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4571)\n- Bugfix: Do not remove pre-existing recipe revisions in ``ReportAPI.diff``. (https://github.com/conan-io/conan/pull/20417)\n- Bugfix: Make ``AuditAPI.auth_provider`` receive a provider name instead of a provider object, as documented. (https://github.com/conan-io/conan/pull/20414)\n- Bugfix: Do not write `--dynamic_mode=off` in `BazelToolchain` when the recipe has no `shared` option. (https://github.com/conan-io/conan/pull/20390)\n- Bugfix: Avoid random ``dictionary changed size during iteration`` errors in uploads with ``core.upload:parallel``. (https://github.com/conan-io/conan/pull/20389)\n- Bugfix: Avoid HTTP header cross-pollution between consecutive calls to the backup sources server. (https://github.com/conan-io/conan/pull/20386)\n- Bugfix: Use ``tools.microsoft.msbuild:max_cpu_count`` for the ``-m`` argument in ``CMakeToolchain`` Visual Studio presets. (https://github.com/conan-io/conan/pull/20360)\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":0,"rocket":0,"eyes":0}}
