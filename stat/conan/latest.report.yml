9-29T15:14:12Z"},{"id":598514442,"node_id":"RA_kwDOAtASYM4jrJsK","name":"conan-2.33.0-windows-i686.zip","label":"","uploader":{"login":"conan-release[bot]","id":219083861,"node_id":"BOT_kgDODQ70VQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14193447,"digest":"sha256:85f46e3444328a283a03503cd3252c1bf103888badefa7fc573e25d38d071a8a","download_count":15,"created_at":"2026-09-29T15:14:08Z","updated_at":"2026-09-29T15:14:10Z"},{"id":598514767,"node_id":"RA_kwDOAtASYM4jrJxP","name":"conan-2.33.0-windows-x86_64-installer.exe","label":"","uploader":{"login":"conan-release[bot]","id":219083861,"node_id":"BOT_kgDODQ70VQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":15577724,"digest":"sha256:4cd6c4c519664a7432e2696f9068fe2b5d89f2000a5ece429afd1760fdefb4c7","download_count":395,"created_at":"2026-09-29T15:14:17Z","updated_at":"2026-09-29T15:14:18Z"},{"id":598514651,"node_id":"RA_kwDOAtASYM4jrJvb","name":"conan-2.33.0-windows-x86_64.zip","label":"","uploader":{"login":"conan-release[bot]","id":219083861,"node_id":"BOT_kgDODQ70VQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15963666,"digest":"sha256:39aa6b6d1bf8d92cb40e0f9afcaa7ad7a7467e729c6f8e76cf621f140516d2c5","download_count":142,"created_at":"2026-09-29T15:14:14Z","updated_at":"2026-09-29T15:14:15Z"}],"body":"- Feature: Support for CPS components configurations. (https://github.com/conan-io/conan/pull/20354)\r\n- Feature: Use extra_info to provide CPEs to the component. (https://github.com/conan-io/conan/pull/20353)\r\n- Feature: Download recipe and package metadata in parallel with regular files instead of after them. (https://github.com/conan-io/conan/pull/20351)\r\n- Feature: Add `core.net.http:trust_store` conf to verify HTTPS certs against the OS trust store. (https://github.com/conan-io/conan/pull/20343). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4551)\r\n- Feature: New remotes ``force_auth`` capability. (https://github.com/conan-io/conan/pull/20341). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4550)\r\n- Feature: Add `copy_config_files` to the `[runner]` profile to copy extra host config files into Docker runners. (https://github.com/conan-io/conan/pull/20332). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4549)\r\n- Feature: Support Clang 23. (https://github.com/conan-io/conan/pull/20330)\r\n- Feature: Support Apple OS 27.0. (https://github.com/conan-io/conan/pull/20330)\r\n- Feature: `CMakeConfigDeps.get_cmake_file_name` returns a dict object instead of a string. (https://github.com/conan-io/conan/pull/20300)\r\n- Feature: Allow ``cpp_info.sources``-only packages in CMakeConfigDeps. (https://github.com/conan-io/conan/pull/20297). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4547)\r\n- Fix: Remove support for Python 3.7, EOL since 2024. (https://github.com/conan-io/conan/pull/20357)\r\n- Fix: Error messages inside the `source()`, `generate()` and `package()` steps missing the package reference. (https://github.com/conan-io/conan/pull/20348)\r\n- Fix: Add support for ``CMakeConfigDeps`` for ``cpp_info.objects`` imported object libraries. (https://github.com/conan-io/conan/pull/20347)\r\n- Fix: Do not force ``DebuggerFlavor`` from generated prop files in MsBuildDeps, it's already the default. (https://github.com/conan-io/conan/pull/20340)\r\n- Fix: Only spawn ``min(threads, download_count)`` threads in parallel downloads. (https://github.com/conan-io/conan/pull/20335)\r\n- Fix: Split skipped binaries summary per host/build/test group. (https://github.com/conan-io/conan/pull/20326)\r\n- Fix: Avoid ``CMakeDeps`` generating empty generator expressions, improving performance. (https://github.com/conan-io/conan/pull/20322)\r\n- Fix: Propagate errors from a `.bat` script called by another `.bat` script. (https://github.com/conan-io/conan/pull/20317)\r\n- Fix: Prioritize host and visible nodes in workspace monolithic builds when ambiguity arises. (https://github.com/conan-io/conan/pull/20305). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4546)\r\n- Fix: Implements the `find_package` verbosity level in CMakeConfigDeps. (https://github.com/conan-io/conan/pull/20275)\r\n- Fix: Do not inject a full lockfile due to ``export`` operations. (https://github.com/conan-io/conan/pull/19404)\r\n- Bugfix: Fix `conan graph build-order --update` ignoring the `--update` flag. (https://github.com/conan-io/conan/pull/20356)\r\n- Bugfix: Consider a server revision found via ``--update`` as latest, even if its ``prev`` isn't latest locally. (https://github.com/conan-io/conan/pull/20336)\r\n- Bugfix: Correct computation of ``options`` in the ``conan graph build-order`` command. (https://github.com/conan-io/conan/pull/20331)\r\n- Bugfix: `QbsDeps` dependency names now match `pkg_config_name`/`qbs_file_name`. (https://github.com/conan-io/conan/pull/20329)\r\n- Bugfix: Avoid reporting the cached username when authentication was attempted with a different user. (https://github.com/conan-io/conan/pull/20316)\r\n- Bugfix: Limit propagation of ``cpp_info.sources`` from ``INTERFACE_SOURCES`` to only direct dependencies. (https://github.com/conan-io/conan/pull/20297). Docs: [:page_with_curl:](https://github.com/conan-io/docs/pull/4547)\r\n","reactions":{"total_count":5,"+1":3,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
