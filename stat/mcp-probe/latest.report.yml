9b28fd019e","download_count":64,"created_at":"2025-06-30T06:18:07Z","updated_at":"2025-06-30T06:18:08Z"},{"id":268550602,"node_id":"RA_kwDOO-sf2c4QAcHK","name":"mcp-probe-x86_64-pc-windows-msvc.zip.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":173,"digest":"sha256:b614c58d16913961c8eda625c4d71b22878062c23698e46b5acd33fa57398e64","download_count":5,"created_at":"2025-06-30T06:18:07Z","updated_at":"2025-06-30T06:18:07Z"},{"id":268550277,"node_id":"RA_kwDOO-sf2c4QAcCF","name":"mcp-probe-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":3717840,"digest":"sha256:e26fcc5684a1b1c869f2e1d4f2ac1f077efdc7f3f3772860b17154b71561555c","download_count":600,"created_at":"2025-06-30T06:15:57Z","updated_at":"2025-06-30T06:15:57Z"},{"id":268550276,"node_id":"RA_kwDOO-sf2c4QAcCE","name":"mcp-probe-x86_64-unknown-linux-gnu.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":108,"digest":"sha256:b90fd518fb26264d67c09dee6c448b77c4f4dd641b657c3dab14c0d8c9a03ceb","download_count":21,"created_at":"2025-06-30T06:15:57Z","updated_at":"2025-06-30T06:15:57Z"}],"body":"## \ud83d\ude80 MCP Probe v0.3.0\n\nA powerful terminal-based debugger and CLI tool for Model Context Protocol (MCP) servers.\n\n### \ud83d\udce6 Installation Options\n\n#### \ud83d\udce5 Binary Downloads\nDownload the pre-built binary for your platform from the assets below.\n\n#### \ud83c\udf7a Homebrew (macOS/Linux)\n```bash\nbrew install conikeec/tap/mcp-probe\n```\n\n#### \ud83c\udf10 Curl Install (Linux/macOS)\n```bash\ncurl -fsSL https://raw.githubusercontent.com/conikeec/mcp-probe/main/install.sh | bash\n```\n\n#### \ud83d\udce6 Cargo Install\n```bash\ncargo install mcp-cli\n```\n\n### \u2728 What's New\n\nSee [CHANGELOG.md](https://github.com/conikeec/mcp-probe/blob/main/CHANGELOG.md) for detailed changes.\n\n### \ud83d\udd27 Usage\n\n```bash\n# Debug an MCP server via HTTP\nmcp-probe debug --http-sse http://localhost:3000/sse\n\n# Debug via stdio\nmcp-probe debug --stdio python -- -m my_mcp_server\n\n# Export capabilities\nmcp-probe export --http-sse http://localhost:3000/sse --format json\n```\n\n### \ud83d\udee1\ufe0f Verification\n\nAll binaries are signed and can be verified using:\n```bash\n# macOS\ncodesign -dv --verbose=4 mcp-probe\n\n# All platforms - check SHA256\nsha256sum mcp-probe\n```\n\n---\n**\ud83c\udfaf Making MCP protocol debugging as intuitive as it should be.**\n"}
