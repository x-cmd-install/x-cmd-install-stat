":639428976,"node_id":"RA_kwDOEk4abc4mHOlw","name":"cloudlist_1.5.0_windows_386.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":38473057,"digest":"sha256:5871351009c63c1a4761514635175f0e7da33b277069d3f54c8be72fbfc35f7a","download_count":1,"created_at":"2026-10-14T06:08:57Z","updated_at":"2026-10-14T06:09:01Z"},{"id":639428982,"node_id":"RA_kwDOEk4abc4mHOl2","name":"cloudlist_1.5.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41185225,"digest":"sha256:7274df531df7627b0b5914cdf5c9db95906ac1c5ab838f0eda1d6ac59b8bd671","download_count":7,"created_at":"2026-10-14T06:08:57Z","updated_at":"2026-10-14T06:09:01Z"}],"body":"### New Feature\n\n- Added OVH DNS provider by @ysokolovsky in https://github.com/projectdiscovery/cloudlist/pull/696\n- Added AWS org discovery and account exclusion by @girish-cheedala in https://github.com/projectdiscovery/cloudlist/pull/735\n- Added GCP project exclusion by @girish-cheedala in https://github.com/projectdiscovery/cloudlist/pull/746\n- Added Cloudflare credential verification without a full resource fetch by @mkrs2404 in https://github.com/projectdiscovery/cloudlist/pull/741\n- Added AWS keyless authentication (IRSA / instance profile) by @hsagnik in https://github.com/projectdiscovery/cloudlist/pull/751\n- Added `exclude_services` filter by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/753\n- Added AWS Elastic IPs by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/777\n- Added AWS RDS endpoints by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/778\n- Added AWS ElastiCache endpoints by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/786\n- Added Azure Service Fabric clusters by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/779\n- Added Azure managed database endpoints by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/780\n- Added GCP addresses and forwarding rules by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/781\n- Added Hetzner load balancers, floating and primary IPs by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/782\n- Added Scaleway flexible IPs, load balancers, serverless and Kapsule by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/783\n- Added Alibaba SLB, ALB, EIP and ACK by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/784\n- Added OpenStack floating IPs and load balancers by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/785\n- Added DigitalOcean reserved IPs, load balancers and DOKS by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/787\n- Added Linode NodeBalancers, IPs and LKE by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/788\n- Added `-auto-discovery` mode to discover AWS, GCP, Azure and Kubernetes from environment credentials by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/796\n\n### Bug Fixes\n\n- Fixed GCP to list only the configured `project_ids` by @srivathsan-srinivasan in https://github.com/projectdiscovery/cloudlist/pull/719\n- Fixed GCP large org discovery failing silently on rate limits by @girish-cheedala in https://github.com/projectdiscovery/cloudlist/pull/736\n- Fixed GCP org-level discovery when no projects are listed by @knakul853 in https://github.com/projectdiscovery/cloudlist/pull/737\n- Fixed AWS verify to check all accounts and retry role assumption by @girish-cheedala in https://github.com/projectdiscovery/cloudlist/pull/739\n- Fixed AWS ALB nil pointer panic by @knakul853 in https://github.com/projectdiscovery/cloudlist/pull/743\n- Fixed nil AWS ALB entries by @cyn8 in https://github.com/projectdiscovery/cloudlist/pull/758\n- Fixed missing prefix when listing Cloud Run resources by @mkrs2404 in https://github.com/projectdiscovery/cloudlist/pull/748\n- Fixed Linode instance IPv6 addresses being dropped by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/790\n- Fixed Scaleway instance listing panic on the second page by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/792\n- Fixed Alibaba listing only the first page of instances by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/794\n\n### Other Changes\n\n- Published Docker images with GoReleaser by @dwisiswant0 in https://github.com/projectdiscovery/cloudlist/pull/764\n- Fixed Alibaba ACK test on Go 1.26 by @dogancanbakir in https://github.com/projectdiscovery/cloudlist/pull/799\n- Ran all package tests in CI by @Mzack9999 in https://github.com/projectdiscovery/cloudlist/commit/c114154\n\n### New Contributors\n\n- @ysokolovsky made their first contribution in https://github.com/projectdiscovery/cloudlist/pull/696\n- @srivathsan-srinivasan made their first contribution in https://github.com/projectdiscovery/cloudlist/pull/719\n- @girish-cheedala made their first contribution in https://github.com/projectdiscovery/cloudlist/pull/735\n- @hsagnik made their first contribution in https://github.com/projectdiscovery/cloudlist/pull/751\n- @cyn8 made their first contribution in https://github.com/projectdiscovery/cloudlist/pull/758\n\n**Full Changelog**: https://github.com/projectdiscovery/cloudlist/compare/v1.4.0...v1.5.0\n","mentions_count":10}
