":613198506,"node_id":"RA_kwDOB_zxBs4kjKqq","name":"lazygit_0.66.0_windows_32-bit.zip","label":"","uploader":{"login":"stefanhaller","id":1225667,"node_id":"MDQ6VXNlcjEyMjU2Njc=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7144798,"digest":"sha256:ed067613bef886f3c28daa2170fa24e58db4719de04fd7b14afa29d95f17b015","download_count":114,"created_at":"2026-10-05T17:17:43Z","updated_at":"2026-10-05T17:17:43Z"},{"id":613198547,"node_id":"RA_kwDOB_zxBs4kjKrT","name":"lazygit_0.66.0_windows_arm64.zip","label":"","uploader":{"login":"stefanhaller","id":1225667,"node_id":"MDQ6VXNlcjEyMjU2Njc=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6666593,"digest":"sha256:53be33b36dc83b32aff317e317c7b34495ab8c15d4360db7ba56b12b05e7d157","download_count":79,"created_at":"2026-10-05T17:17:43Z","updated_at":"2026-10-05T17:17:44Z"},{"id":613198441,"node_id":"RA_kwDOB_zxBs4kjKpp","name":"lazygit_0.66.0_windows_x86_64.zip","label":"","uploader":{"login":"stefanhaller","id":1225667,"node_id":"MDQ6VXNlcjEyMjU2Njc=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7477418,"digest":"sha256:ed8fab4af7b8bac474084e976214a96569dea841c9f9b293502b83d8c3163e4b","download_count":3465,"created_at":"2026-10-05T17:17:42Z","updated_at":"2026-10-05T17:17:42Z"}],"body":"<!-- Release notes generated using configuration in .github/release.yml at v0.66.0 -->\r\n\r\nThis is by far the biggest release since I took over maintainership from Jesse, and some of the changes deserve a bit more explanation than usual.\r\n\r\n- **Staging hunks is now done directly from the main view.**\r\n\r\n  There used to be a separate staging panel that you had to enter if you wanted to stage individual diff hunks; it was limited to one file at a time, and showed the raw git diff rather than the configured diff renderer. This is gone; the main view now has a selection when you focus it, and you can act on the selected hunk or line directly there:\r\n  - press space to stage a hunk or range of lines\r\n  - navigate to the next/previous hunk with `<right>`/`<left>`, or the next/previous file with `n`/`N`\r\n  - press `e` to jump to the editor on the selected line\r\n  - press `d` to discard a hunk.\r\n\r\n  Many other enhancements were added to this new interactive diff view:\r\n  - alt-click a line to jump to that line in the diff view (this works even when a popup panel is showing above it, e.g. the commit message editor)\r\n  - press `<ctrl-g>` to see a menu with all the files in the diff, to quickly jump to one of them\r\n  - the files in the diffstat below the commit message are clickable hyperlinks that take you to the clicked file in the diff, like the `<ctrl-g>` menu does\r\n  - when changing the diff context using `{`/`}`, or when toggling the \"ignore whitespace\" option (`<ctrl-w`), the scroll position is preserved\r\n\r\n  If you use a [custom diff renderer](https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md), all of this works with the renderer's output, as long as it supports the new OSC protocol that was introduced for this. Delta and Diff-so-fancy already do, so if you use one of these, be sure to update them to the latest version. There is support for difftastic too, but it hasn't been accepted upstream, so you'll have to build it yourself from [this PR](https://github.com/Wilfred/difftastic/pull/1014). If you use any other diff renderer, please file an issue so that we can add support for it.\r\n\r\n- **Better support for stacked branches.**\r\n\r\n  - You can now push or force-push all branches of a stack at once, simply by pushing the topmost one. Lazygit will ask you if you want to push the others as well.\r\n  - Same for pulling: if a branch stack was rebased by someone else, you can pull the topmost branch and lazygit will ask you if you want to pull the other branches in the stack too, without checking them out.\r\n  - Branches of a stack are now listed in order in the branches panel. When rebasing a stack it is common for all branch tips to get the same committer date, in which case git sorts them alphabetically, which is confusing. We now have extra logic to preserve the stack order in this case.\r\n  - Unrelated to stacks (but common to show up in that case): when a branch diverges from its upstream (you see `\u21933\u21915`) it was impossible to tell whether that was because you rebased or rewrote the branch, in which case you want to force push, or because someone else rebased the branch, in which case you want to pull it. Lazygit can now distinguish these cases, and will show the `\u21933\u21915` in a dimmer yellow in the latter case. What's more, in this latter case you can \"pull\" the branch without checking it out by pressing `f`, like you already could for branches showing `\u21937`.\r\n\r\n- **Dark and light themes.**\r\n\r\n  Lazygit now determines whether your terminal has a dark or light background, and can use different color themes for each; it can also switch between the two dynamically if your terminal does. You can also pass this information on to your diff renderer if you use one that needs it, by using the new `{{colorScheme}}` template variable in the renderer command.\r\n\r\n- **Better rendering of the commit graph.**\r\n\r\n  Since the commit graph uses box drawing characters it could only be an approximation; some graph topologies can't be rendered faithfully this way. We now make use of branch drawing characters if the terminal supports them, which solves this problem and also looks better; see #6077 for details.\r\n\r\n\r\n## All changes in detail\r\n### Features \u2728\r\n* Stage, unstage and discard changes directly from the focused main view by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6035\r\n### Enhancements \ud83d\udd25\r\n* Improve the Recent Repos menu by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6016\r\n* List stacked branches in stack order by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6024\r\n* Improve the randomly picked author colors by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6062\r\n* Allow telling diff renderers whether the terminal is dark or light by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6063\r\n* Add dark and light color themes by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6065\r\n* Push all branches of a rebased branch stack at once by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6045\r\n* Use `f` to \"fast-forward\" branches whose upstream branch was rewritten by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6067\r\n* Auto-forward branches even if checked out in another worktree by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6069\r\n* Offer to pull all branches in a stack when pulling the topmost one by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6070\r\n* Delete or push multiple tags at once by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6071\r\n* Make shift-backspace do the same as backspace in editors by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6078\r\n* Improve the rendering of the commit graph for terminals that support it by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6077\r\n* Select, navigate and edit diff lines in the focused main view by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6031\r\n* Keep your scroll position in the diff when the diff is rendered again by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6032\r\n* Copy the selected diff lines from the focused main view by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6034\r\n* Build custom patches directly from a commit's diff by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6039\r\n* Remove the staging and patch-building panels by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6040\r\n* Alt- or shift-click a diff line to open it in your editor by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6041\r\n* Open the selected diff line in the branch's pull request by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6042\r\n* Jump to a file of the diff from a menu by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6043\r\n* Link the file names in a diffstat to where each file's diff begins by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6044\r\n* Keep copied commits when switching to another worktree or repo by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6090\r\n### Fixes \ud83d\udd27\r\n* Fix the Commits panel's column widths when scrolling during interactive rebase or bisect by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6022\r\n* Keep the outer folder selected when a folder path in the files panel splits up by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6037\r\n* Avoid showing pull request icons with a delay on startup even though they are cached by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6049\r\n* Fix drawing git's diff stat after switching screen modes by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6087\r\n* Fix wrong main view content in rare edge case situations by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6089\r\n* Fix the rule below a pull request's header being rendered with the wrong width by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6091\r\n### Maintenance \u2699\ufe0f\r\n* Remove codespell again by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6028\r\n* Add gopls to the nix dev shell by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6047\r\n* Render diffs without a PTY on Windows by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6025\r\n* Work out which file and line a row of a diff belongs to by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6026\r\n* Support diff renderers that emit OSC 1717 diff line metadata by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6029\r\n* Always show a file's staged changes in the \"secondary\" context by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6033\r\n### Docs \ud83d\udcd6\r\n* Change the demo gifs to videos and update them for the newly added features by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6073\r\n### I18n \ud83c\udf0e\r\n* Update translations from Crowdin by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6092\r\n\r\n\r\n**Full Changelog**: https://github.com/jesseduffield/lazygit/compare/v0.65.1...v0.66.0\r\n\r\n","reactions":{"total_count":128,"+1":25,"-1":0,"laugh":0,"hooray":38,"confused":0,"heart":43,"rocket":22,"eyes":0},"mentions_count":1}
