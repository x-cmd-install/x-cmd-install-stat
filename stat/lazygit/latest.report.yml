0.66.0).\r\n\r\n<!-- Release notes generated using configuration in .github/release.yml at v0.66.1 -->\r\n\r\n## The changes in detail\r\n### Enhancements \ud83d\udd25\r\n* Allow scrolling the diff view horizontally when gui.wrapLinesInDiffView is off by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6109\r\n* Show the diff view's narrow selection bar on the right edge too by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6105\r\n### Fixes \ud83d\udd27\r\n* Fix staging diff hunks when the diff.mnemonic git config is true by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6099\r\n* Show errors for unresolvable diff lines by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6100\r\n* Fix double-width characters in the last column drawing over the view's frame by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6106\r\n* Fix search match highlighting when a custom patch is active by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6107\r\n* Open files of a branch's diff from the worktree that has it checked out by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6104\r\n* Don't log the diff renderer probe in the command log by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6112\r\n\r\n\r\n**Full Changelog**: https://github.com/jesseduffield/lazygit/compare/v0.66.0...v0.66.1\r\n\r\n","reactions":{"total_count":30,"+1":8,"-1":0,"laugh":0,"hooray":8,"confused":0,"heart":7,"rocket":7,"eyes":0},"mentions_count":1}
