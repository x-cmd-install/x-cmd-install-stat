anhaller in https://github.com/jesseduffield/lazygit/pull/6123\n* Exit gracefully when a repo or worktree gets deleted from under lazygit by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6129\n* Fix \"Jump to File\" menu showing only half of the entries, in some rare cases by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6136\n### Maintenance \u2699\ufe0f\n* Restore the terminal more reliably after a panic by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6124\n* Bump github.com/xo/terminfo from 1.0.0 to 1.2.0 by @dependabot[bot] in https://github.com/jesseduffield/lazygit/pull/6053\n* Bump go version to 1.26 by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6137\n* Bump golang.org/x/sys from 0.47.0 to 0.49.0 by @dependabot[bot] in https://github.com/jesseduffield/lazygit/pull/6125\n* Bump golang.org/x/sync from 0.22.0 to 0.24.0 by @dependabot[bot] in https://github.com/jesseduffield/lazygit/pull/6127\n* Bump github.com/cli/go-gh/v2 from 2.13.0 to 2.16.2 by @dependabot[bot] in https://github.com/jesseduffield/lazygit/pull/6128\n* Bump github.com/gdamore/tcell/v3 from 3.5.0 to 3.6.0 by @dependabot[bot] in https://github.com/jesseduffield/lazygit/pull/6126\n### Performance Improvements \ud83d\udcca\n* Improve performance with very long diffs by @stefanhaller in https://github.com/jesseduffield/lazygit/pull/6121\n\n\n**Full Changelog**: https://github.com/jesseduffield/lazygit/compare/v0.66.1...v0.66.2\n\n","reactions":{"total_count":21,"+1":8,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":6,"rocket":5,"eyes":0},"mentions_count":2}
