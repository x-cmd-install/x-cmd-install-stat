2977138,"node_id":"RA_kwDOAOn4X84s4YTy","name":"ocrmypdf-17.14.2.tar.gz.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":10890,"digest":"sha256:efc10b8df000cd5e1a35ae428050913c5a47ed7d9b1086b0d73cc94017f0113c","download_count":11,"created_at":"2026-11-16T01:20:40Z","updated_at":"2026-11-16T01:20:40Z"}],"body":"**Fixes**\n\n- Fixed RapidOCR missing thin characters such as `<` and misreading digits\n  on pages rasterized at well above `--rapidocr-max-side-len`, as happens with\n  `--redo-ocr`, which rasterizes at 400 dpi. RapidOCR shrank such pages with\n  interpolation that skips the pixels between its samples, breaking up thin\n  strokes. OCRmyPDF now shrinks them itself with a Lanczos filter first. On\n  one scanned assay table, the text layer kept 222 of 229 printed `<` signs,\n  up from 163."}
