{"id":394041276,"author":{"login":"adamwg","id":414574,"node_id":"MDQ6VXNlcjQxNDU3NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCNCQAM4XfJe8","tag_name":"v2.4.2","target_commitish":"main","name":"v2.4.2","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-09-22T18:41:35Z","updated_at":"2026-09-22T19:11:31Z","published_at":"2026-09-22T19:11:31Z","assets":[],"body":"`v2.4.2` is a patch release scoped to fixing issues reported by users of Crossplane `v2.4` and fixing security related issues in Crossplane and its dependencies.\r\n\r\n## \ud83c\udf89 Highlights\r\n\r\n* Fixed a bug where ownership of `ServiceAccount`s was not correctly transferred to newly active package revisions (#7838). Fixed in #7839 and backported in #7852.\r\n\r\n## What's Changed\r\n* [Backport release-2.4] fix: demote old revision controller ownerReference for SA by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7852\r\n* chore(deps): update module go.opentelemetry.io/otel/exporters/otlp/otlptrace to v1.45.0 [security] (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7847\r\n* [Backport release-2.4] fix: fail closed when a claim cannot list its XRD by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7862\r\n* Bump crossplane-runtime dependency to v2.4.2 by @adamwg in https://github.com/crossplane/crossplane/pull/7863\r\n\r\n\r\n**Full Changelog**: https://github.com/crossplane/crossplane/compare/v2.4.1...v2.4.2","mentions_count":1}
