{"id":420911838,"author":{"login":"lsviben","id":46844730,"node_id":"MDQ6VXNlcjQ2ODQ0NzMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCNCQAM4ZFpre","tag_name":"v2.4.3","target_commitish":"main","name":"v2.4.3","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-10-22T13:45:38Z","updated_at":"2026-10-22T15:50:21Z","published_at":"2026-10-22T15:50:21Z","assets":[],"body":"`v2.4.3` is a patch release scoped to fixing issues reported by users of Crossplane `v2.4` and fixing security related issues in Crossplane and its dependencies.\n\n# 🎉 Highlights\n\n* **Distrust of compromised eMudhra intermediate CAs:** Bumps the Go toolchain to `1.26.10`, whose `crypto/x509` rejects the compromised eMudhra intermediate certificates (CVE-2026-111943), and removes the `AAA Certificate Services` and `emSign ECC Root CA - G3` roots they chain to from the image's CA bundle (#7957).\n* **Truncated package downloads are no longer cached:** A package download that failed partway could be cached as a valid but truncated `package.yaml`. The package revision then recorded only some of its objects, reported `Healthy=True`, and the provider's RBAC was rendered from the short list, so the provider could crash-loop. Truncated downloads are now discarded. Fixed via `crossplane-runtime` `v2.4.3` (#7961), originally crossplane/crossplane-runtime#1189.\n* **`Usage` no longer rewrites the in-use label on every reconcile:** A leftover ownership check meant the used resource was updated on every reconcile of every `Usage`/`ClusterUsage`, causing needless API writes. Backported in #7877, originally fixed in #7860.\n* **XR scale RBAC:** Users with `crossplane-edit` or `crossplane-admin` access can now `kubectl scale` XRs and claims whose XRD serves the scale subresource; previously they got `Forbidden`. Backported in #7934, originally fixed in #7922.\n* **Dependency security updates:** A combined set of vulnerable dependency updates (#7915) to pick up upstream CVE fixes. Also refreshes the lock file (#7894, #7909).\n\n## What's Changed\n* [Backport release-2.4] e2e: Use xpkg.upbound.io for private package pull test by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7873\n* [Backport release-2.4] fix: stop rewriting the in-use label on every Usage reconcile by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7877\n* chore(deps): lock file maintenance (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7894\n* chore(deps): update vulnerable dependencies [security] (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7915\n* chore(deps): lock file maintenance (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7909\n* [release-2.4] build(deps): bump Go to 1.26.9 [security] by @lsviben in https://github.com/crossplane/crossplane/pull/7951\n* [release-2.4] build(deps): bump Go to 1.26.10 and distrust compromised eMudhra roots [security] by @lsviben in https://github.com/crossplane/crossplane/pull/7957\n* [Backport release-2.4] allow users with crossplane-edit and crossplane-admin access to scale XRs that serve it by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7934\n* [release-2.4] chore(deps): bump crossplane-runtime to v2.4.3 by @lsviben in https://github.com/crossplane/crossplane/pull/7961\n\n\n**Full Changelog**: https://github.com/crossplane/crossplane/compare/v2.4.2...v2.4.3\n","mentions_count":1}
