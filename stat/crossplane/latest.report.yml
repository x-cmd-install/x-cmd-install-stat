{"id":389054390,"author":{"login":"phisco","id":5697904,"node_id":"MDQ6VXNlcjU2OTc5MDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCNCQAM4XMH-2","tag_name":"v2.4.1","target_commitish":"main","name":"v2.4.1","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-09-15T10:06:06Z","updated_at":"2026-09-15T17:16:10Z","published_at":"2026-09-15T17:16:10Z","assets":[],"body":"`v2.4.1` is a patch release scoped to fixing issues reported by users of Crossplane `v2.4` and fixing security related issues in Crossplane and its dependencies.\n\n# \ud83c\udf89 Highlights\n\n* **Package revisions now take control of established objects from the revision they replace:** An outgoing package revision could fail to relinquish control of the package's CRDs, leaving the incoming revision permanently unhealthy with `cannot establish control of object`. The provider's pod would never be created, so that provider could do no work without manual intervention by someone either deleting the stale revision or editing the CRD's owner reference by hand. Package revisions now directly take control from the revision they replace, so the hand-off succeeds without any intervention. Backported in #7821, originally fixed in #7733.\n* **Dependency security updates:** Bumps the Go toolchain to `1.26.7` (#7803), `google.golang.org/grpc` to `v1.83.2` (#7800, #7826), and `golang.org/x/crypto` to `v0.56.0` (#7810) to pick up upstream CVE fixes \u2014 including the gRPC advisory [GHSA-2v4p-qf9q-27wj](https://github.com/grpc/grpc-go/security/advisories/GHSA-2v4p-qf9q-27wj). Also bumps `github.com/crossplane/crossplane/apis/v2` to `v2.4.0` (#7780) and refreshes the lock file (#7779).\n\n## What's Changed\n* chore(deps): lock file maintenance (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7779\n* fix(deps): update module github.com/crossplane/crossplane/apis/v2 to v2.4.0 (release-2.4) by @phisco in https://github.com/crossplane/crossplane/pull/7780\n* fix(deps): update module google.golang.org/grpc to v1.83.1 [security] (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7800\n* [Backport release-2.4] Bump go to 1.26 by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7803\n* chore(deps): update module golang.org/x/crypto to v0.56.0 [security] (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7810\n* [Backport release-2.4] fix(pkg): take control of established objects from replaced revisions by @github-actions[bot] in https://github.com/crossplane/crossplane/pull/7821\n* fix(deps): update module google.golang.org/grpc to v1.83.2 [security] (release-2.4) by @crossplane-renovate[bot] in https://github.com/crossplane/crossplane/pull/7826\n\n\n**Full Changelog**: https://github.com/crossplane/crossplane/compare/v2.4.0...v2.4.1\n\n","mentions_count":1}
