#363](https://github.com/stern/stern/pull/363)) 7e59e4e (Abhishek Pareek)\r\n* fix: honor klog -stderrthreshold even when -logtostderr is true ([#364](https://github.com/stern/stern/pull/364)) 8e4ece3 (Pierluigi Lenoci)\r\n* Update dependencies for Kubernetes 1.36 ([#365](https://github.com/stern/stern/pull/365)) 6761a78 (Takashi Kusumi)","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0}}
