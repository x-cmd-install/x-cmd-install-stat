public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":117223006,"digest":"sha256:4df180336d9774ab63eeb86b99935e697967018962bbba876e67f2932fd05dff","download_count":229,"created_at":"2026-11-10T17:54:52Z","updated_at":"2026-11-10T17:54:55Z"},{"id":732430386,"node_id":"RA_kwDOKxH29M4rqAAy","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2026,"digest":"sha256:4c8d6f071015818871e5deb4d101d2ff0af96e771fb691d7d4b849b3afe53862","download_count":315,"created_at":"2026-11-10T18:07:35Z","updated_at":"2026-11-10T18:07:35Z"},{"id":732430504,"node_id":"RA_kwDOKxH29M4rqACo","name":"SHA512SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":3306,"digest":"sha256:e939230bbb8cd99731328a3c1be4c4f1a9e2f7c3eb52174e9019890a3d5b70e0","download_count":10,"created_at":"2026-11-10T18:07:37Z","updated_at":"2026-11-10T18:07:37Z"}],"body":"## Upgrade notes\n\n- Complete the upgrade from 1.0.4 on every node before adding or removing pools, or retrying a decommission operation.\n- While 1.0.4 and 1.0.5 nodes coexist, DELETE requests handled by new nodes may temporarily return HTTP 503. Retry them after all nodes are upgraded. The compatibility check verified existing data integrity and DELETE recovery after the upgrade.\n\n<!-- rustfs-generated-release-notes: managed; remove this marker before manual edits -->\n## Known issue on macOS\n\nThe macOS archive can display an extra `1.0.5-preview.1` line because both tags identify the same source commit. This affects version text and may affect update notifications. The archive source, startup, Console and S3 read/write/delete checks were verified. This minor issue is tracked for 1.0.6; the new candidate pipeline explicitly stamps the final product version.\n\n## What's Changed\n* fix(scanner): treat replication status writebacks as status-class hints by @reatang in https://github.com/rustfs/rustfs/pull/8509\n* fix(s3): preserve catalog lock failures at the error boundary by @houseme in https://github.com/rustfs/rustfs/pull/8550\n* chore(deps): refresh Rustls and TAR parser test crates by @houseme in https://github.com/rustfs/rustfs/pull/8547\n* fix(s3): align raw disk-full failures with capacity refusals by @houseme in https://github.com/rustfs/rustfs/pull/8553\n* feat(iam): support wildcard in IAM policy resources by @alpbeysir in https://github.com/rustfs/rustfs/pull/8555\n* test(e2e): wait for heal control before deep heal after restart by @overtrue in https://github.com/rustfs/rustfs/pull/8554\n* feat(s3): support conditional bulk deletes by @cxymds in https://github.com/rustfs/rustfs/pull/8535\n* fix(ecstore): retain pool metadata repair ownership by @houseme in https://github.com/rustfs/rustfs/pull/8552\n* fix(scanner): use observational leases for incomplete snapshots by @houseme in https://github.com/rustfs/rustfs/pull/8561\n* fix(scanner): clear transient cycle recovery on follower lock contention by @RamakrishnaChilaka in https://github.com/rustfs/rustfs/pull/8566\n* fix(data-usage): retain complete totals when a set is missing by @marshawcoco in https://github.com/rustfs/rustfs/pull/8558\n* fix(s3): make an unsupported delete participant retryable and explain it by @overtrue in https://github.com/rustfs/rustfs/pull/8574\n* fix(replication): skip the replica ETag audit for encrypted sources by @overtrue in https://github.com/rustfs/rustfs/pull/8573\n* fix(ecstore): box the transition payload of CurrentDeleteGeneration by @overtrue in https://github.com/rustfs/rustfs/pull/8581\n* fix(scanner): persist partial progress after budget cancellation by @houseme in https://github.com/rustfs/rustfs/pull/8578\n* test(replication): cover SSE-S3 replicas on ETag-computing targets by @reatang in https://github.com/rustfs/rustfs/pull/8583\n* fix(ecstore): quiet routine admin info timing logs by @houseme in https://github.com/rustfs/rustfs/pull/8584\n* fix(ecstore): merge migrated copies across inline layouts by @cxymds in https://github.com/rustfs/rustfs/pull/8588\n* fix(rpc): clarify stale epoch rejection diagnostics by @houseme in https://github.com/rustfs/rustfs/pull/8585\n* feat(diagnostics): port read attribution to main by @houseme in https://github.com/rustfs/rustfs/pull/8579\n* fix(multipart): retain commits and reclaim verified orphan staging by @cxymds in https://github.com/rustfs/rustfs/pull/8571\n* fix(rebalance): wait for readiness and admit peer workers by @cxymds in https://github.com/rustfs/rustfs/pull/8570\n* test(e2e): gate the rc.5 baseline restarts on drive re-admission by @reatang in https://github.com/rustfs/rustfs/pull/8595\n* test(e2e): send the quota batch delete in verbose mode by @overtrue in https://github.com/rustfs/rustfs/pull/8589\n* fix(ci): stop PRs for sync conflicts by @overtrue in https://github.com/rustfs/rustfs/pull/8598\n* test(s3-select): fix schema reference field ordering by @houseme in https://github.com/rustfs/rustfs/pull/8599\n* chore(deps): refresh workspace dependencies by @houseme in https://github.com/rustfs/rustfs/pull/8597\n* sync: merge main 2026-10-15 (conflicts) by @houseme in https://github.com/rustfs/rustfs/pull/8557\n* fix(ecstore): unify bounded delete recovery across upgrades by @houseme in https://github.com/rustfs/rustfs/pull/8594\n* fix(lifecycle): read exact object versions after writes by @cxymds in https://github.com/rustfs/rustfs/pull/8601\n* feat(scanner): decouple bucket walkers from disk count by @reatang in https://github.com/rustfs/rustfs/pull/8539\n* fix(heal): recover replacements after pool removal by @cxymds in https://github.com/rustfs/rustfs/pull/8600\n* fix(quot