-10T06:28:35Z"}],"body":"## What's Changed\n* feat: respect profile Entry mode when syncing the Claude App config by @diogomcd in https://github.com/musistudio/claude-code-router/pull/1720\n* fix: invalidate Claude gateway model discovery cache when the profile allowlist changes by @diogomcd in https://github.com/musistudio/claude-code-router/pull/1711\n* fix: skip session affinity body fields for Codex Responses upstreams by @diogomcd in https://github.com/musistudio/claude-code-router/pull/1715\n* fix(gateway): pair dispatchers with bundled undici fetch on undici major mismatch (Node >= 25) by @krajcik in https://github.com/musistudio/claude-code-router/pull/1699\n* feat(ui): edit extraBody and extraHeaders from Advanced settings by @songkuan-zheng in https://github.com/musistudio/claude-code-router/pull/1682\n* feat: allow explicit context window overrides for local Codex providers by @diogomcd in https://github.com/musistudio/claude-code-router/pull/1718\n* fix(gateway): opt OpenAI Responses tools out of implicit strict mode by @gtapps in https://github.com/musistudio/claude-code-router/pull/1723\n* fix: preserve coworkEgressAllowedHosts when rewriting Claude App config by @BetterAndBetterII in https://github.com/musistudio/claude-code-router/pull/1736\n* fix(ui): \u4fee\u590d\u8d26\u6237\u4f59\u989d\u7f51\u683c\u884c\u6570\u8d85\u9650\u5bfc\u81f4\u7684\u5361\u7247\u88c1\u5207 by @Pgooone in https://github.com/musistudio/claude-code-router/pull/1742\n\n## New Contributors\n* @krajcik made their first contribution in https://github.com/musistudio/claude-code-router/pull/1699\n* @gtapps made their first contribution in https://github.com/musistudio/claude-code-router/pull/1723\n* @BetterAndBetterII made their first contribution in https://github.com/musistudio/claude-code-router/pull/1736\n* @Pgooone made their first contribution in https://github.com/musistudio/claude-code-router/pull/1742\n\n**Full Changelog**: https://github.com/musistudio/claude-code-router/compare/v3.0.22...v3.1.0","mentions_count":6}
