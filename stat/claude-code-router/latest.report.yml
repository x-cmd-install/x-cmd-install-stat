20:21Z"}],"body":"## What's Changed\n* fix(gateway): surface per-attempt failure details in aggregate error messages by @zeal-up in https://github.com/musistudio/claude-code-router/pull/1773\n* fix(gateway): raise and make configurable the core config-acceptance timeout by @fszcd in https://github.com/musistudio/claude-code-router/pull/1794\n* fix(usage): price routed models instead of rule aliases (#1787) by @cpruijsen in https://github.com/musistudio/claude-code-router/pull/1790\n* feat(opencode): add first-class OpenCode Go local import by @Aser-Osama in https://github.com/musistudio/claude-code-router/pull/1786\n* fix(cli): accept --daemon on start and serve commands by @syf2211 in https://github.com/musistudio/claude-code-router/pull/1782\n* fix(usage): attribute client-visible provider-prefixed response models to the bare model by @zeal-up in https://github.com/musistudio/claude-code-router/pull/1774\n* chore(tsconfig): drop baseUrl so the configs survive TypeScript 7 by @ntdatt812 in https://github.com/musistudio/claude-code-router/pull/1764\n* fix(docker): include log body worker in UI build by @deymosh in https://github.com/musistudio/claude-code-router/pull/1770\n* fix(tsconfig): give the node project inputs it can actually have by @ntdatt812 in https://github.com/musistudio/claude-code-router/pull/1771\n\n## New Contributors\n* @zeal-up made their first contribution in https://github.com/musistudio/claude-code-router/pull/1773\n* @fszcd made their first contribution in https://github.com/musistudio/claude-code-router/pull/1794\n* @cpruijsen made their first contribution in https://github.com/musistudio/claude-code-router/pull/1790\n* @Aser-Osama made their first contribution in https://github.com/musistudio/claude-code-router/pull/1786\n* @syf2211 made their first contribution in https://github.com/musistudio/claude-code-router/pull/1782\n* @ntdatt812 made their first contribution in https://github.com/musistudio/claude-code-router/pull/1764\n* @deymosh made their first contribution in https://github.com/musistudio/claude-code-router/pull/1770\n\n**Full Changelog**: https://github.com/musistudio/claude-code-router/compare/v3.1.0...v3.1.1","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":7}
