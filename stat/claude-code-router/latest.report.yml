:48:31Z"}],"body":"## Highlights\n\n- Rebuild the bundled model catalog and publish it to [models.ccrdesk.top](https://models.ccrdesk.top/models.json). The catalog refreshes from the CDN at startup and hourly, with bundled and cached data available offline.\n- Improve routing script token estimation, gateway restart recovery, and raw trace delivery.\n- Fix Codex session affinity, protocol-specific provider aliases, and upstream streaming resets.\n- Add the Y-API provider preset and bound OpenRouter catalog requests with a timeout.\n\n## What's Changed\n* fix(gateway): propagate upstream stream resets instead of crashing the core by @Louayzouaoui1 in https://github.com/musistudio/claude-code-router/pull/1858\n* fix(core): send session_id header for Codex Responses prompt cache affinity by @uta-a in https://github.com/musistudio/claude-code-router/pull/1866\n* fix: stop raw-trace sync from clobbering gateway response headers by @Burlesque1 in https://github.com/musistudio/claude-code-router/pull/1865\n* fix(providers): bound OpenRouter provider-catalog fetches with a timeout by @pacocartones in https://github.com/musistudio/claude-code-router/pull/1756\n* docs: add Parallel Search ToolHub setup example by @georgeatparallel in https://github.com/musistudio/claude-code-router/pull/1758\n* fix(providers): keep custom base paths ending in /models by @ronicayu in https://github.com/musistudio/claude-code-router/pull/1834\n* fix(gateway): preserve protocol selection for provider aliases by @zhi1ong in https://github.com/musistudio/claude-code-router/pull/1847\n* feat(providers): add Y-API preset by @jiweiyeah in https://github.com/musistudio/claude-code-router/pull/1849\n\n## New Contributors\n* @Louayzouaoui1 made their first contribution in https://github.com/musistudio/claude-code-router/pull/1858\n* @uta-a made their first contribution in https://github.com/musistudio/claude-code-router/pull/1866\n* @georgeatparallel made their first contribution in https://github.com/musistudio/claude-code-router/pull/1758\n* @ronicayu made their first contribution in https://github.com/musistudio/claude-code-router/pull/1834\n* @zhi1ong made their first contribution in https://github.com/musistudio/claude-code-router/pull/1847\n* @jiweiyeah made their first contribution in https://github.com/musistudio/claude-code-router/pull/1849\n\n**Full Changelog**: https://github.com/musistudio/claude-code-router/compare/v3.1.2...v3.1.3\n","mentions_count":8}
