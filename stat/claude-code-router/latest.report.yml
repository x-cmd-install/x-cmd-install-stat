1-21T10:07:46Z"}],"body":"## v3.1.6\n\n- View CCR provider usage in the Codex desktop app.\n- Enable native image generation and editing in Codex profiles and select a model from a configured Images API provider. CCR displays the native preview once and adapts requests for Grok Imagine.\n- Fix signed Node runtime discovery in current macOS Codex app layouts.\n\n### Downloads\n\n| Platform | Installer |\n| --- | --- |\n| Windows x64 | [EXE](https://github.com/musistudio/claude-code-router/releases/download/v3.1.6/Claude-Code-Router_3.1.6.exe) |\n| Linux x64 | [AppImage](https://github.com/musistudio/claude-code-router/releases/download/v3.1.6/Claude-Code-Router_3.1.6.AppImage) |\n| macOS Apple Silicon | [DMG](https://github.com/musistudio/claude-code-router/releases/download/v3.1.6/Claude-Code-Router_3.1.6-mac-Apple-Silicon-arm64.dmg) |\n| macOS Intel | [DMG](https://github.com/musistudio/claude-code-router/releases/download/v3.1.6/Claude-Code-Router_3.1.6-mac-Intel-x64.dmg) |\n\nPull the Docker image for AMD64 or ARM64.\n\n```sh\ndocker pull musistudio/claude-code-router:3.1.6\n```\n\nReleased by @musistudio in [PR #1986](https://github.com/musistudio/claude-code-router/pull/1986).\n\n[Compare v3.1.5 and v3.1.6](https://github.com/musistudio/claude-code-router/compare/v3.1.5...v3.1.6)\n","mentions_count":1}
