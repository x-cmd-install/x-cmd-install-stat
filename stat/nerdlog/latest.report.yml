4,"created_at":"2026-09-26T09:51:54Z","updated_at":"2026-09-26T09:51:54Z"},{"id":590391816,"node_id":"RA_kwDOOcw9iM4jMKoI","name":"nerdlog_1.12.0_windows_arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":33543,"digest":"sha256:924588f9cb60158639b751c03e55fd63960af5b96c7e5e274131eca400f26aae","download_count":1,"created_at":"2026-09-26T09:51:55Z","updated_at":"2026-09-26T09:51:55Z"},{"id":590391767,"node_id":"RA_kwDOOcw9iM4jMKnX","name":"nerdlog_1.12.0_windows_i386.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3015191,"digest":"sha256:ba08d2ba8e1ca2524fb717ee5c68bf4e0230c9f21b43e35f901c0030da2db266","download_count":12,"created_at":"2026-09-26T09:51:53Z","updated_at":"2026-09-26T09:51:54Z"},{"id":590391813,"node_id":"RA_kwDOOcw9iM4jMKoF","name":"nerdlog_1.12.0_windows_i386.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":33516,"digest":"sha256:9ff985188797622b52a82f026e693a6cb97c1071766aeb4de86bf6f4a8b95579","download_count":1,"created_at":"2026-09-26T09:51:55Z","updated_at":"2026-09-26T09:51:55Z"}],"body":"## [1.12.0](https://github.com/dimonomid/nerdlog/compare/v1.11.0...v1.12.0) (2026-09-26)\n\n\n### Features\n\nBetter support for log files with anomalies (malformed and/or reordered logs):\n\n* Still show available logs when some parsing failed ([0cd875f](https://github.com/dimonomid/nerdlog/commit/0cd875fa34420cbba4179eefe639c144de1489fb))\n* Don't add malformed timestamps to log indexes, so that time-based query remains functional ([7893e7b](https://github.com/dimonomid/nerdlog/commit/7893e7bebc4a97e42f0f92298482d50e6a38129e))\n* Show malformed log records instead of dropping them ([5e6e160](https://github.com/dimonomid/nerdlog/commit/5e6e1604f8f36bc046c0a0a8e9a767edcfbfc726))\n* Show original timestamps for out-of-order log records, and color them by severity ([b63a6e1](https://github.com/dimonomid/nerdlog/commit/b63a6e1bde182f9a7d4d562fa7b5d2f1b7fd635f), [7452596](https://github.com/dimonomid/nerdlog/commit/74525966f943c34d8b73677a133f8d92c5a5e13d))\n\nGeneral improvements:\n\n* Add logfile and loglineno fields, so that it's clear where the particular log message comes from ([b387a23](https://github.com/dimonomid/nerdlog/commit/b387a2353a98d949c70246188c243e05cb9c3e77))\n* add Vim-style search to the logs table, still experimental ([45ec78d](https://github.com/dimonomid/nerdlog/commit/45ec78d0ba5f4d508061f3761fd94b8320a4d01a))\n* Add more query debugging info, mainly useful for nerdlog development only ([6050e84](https://github.com/dimonomid/nerdlog/commit/6050e84107d5b173e8e32d6ce5a575df83654f85))\n\n### Bug Fixes\n\n* **UI:** Preserve table viewport across vertical movement ([e7f0af7](https://github.com/dimonomid/nerdlog/commit/e7f0af71653c84bd11ba2063bc9cd0fa9e05b8f9))\n* **UI:** Fix colors for status line messages ([c4820d9](https://github.com/dimonomid/nerdlog/commit/c4820d928aa305ae05dc8e5c7e35dcaee0de03bd))"}
