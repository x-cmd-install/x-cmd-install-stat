{"id":391542330,"author":{"login":"mawilk90","id":253913078,"node_id":"U_kgDODyJn9g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBZOVac4XVnY6","tag_name":"v5.69.0","target_commitish":"main","name":"v5.69.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-18T14:29:42Z","updated_at":"2026-09-18T14:52:37Z","published_at":"2026-09-18T14:52:31Z","assets":[],"body":"<!-- Release notes generated using configuration in .github/release.yml at main -->\r\n\r\nBuilt from Linode API spec: [20260917](https://github.com/linode/linode-api-openapi/releases/tag/release-20260917)\r\n\r\n## What's Changed\r\n### \ud83d\udc1b Bug Fixes\r\n* Parser fix for unknown nested-list objects by @mawilk90 in https://github.com/linode/linode-cli/pull/920\r\n* Fix several issues with oneof responses by @ezilber-akamai in https://github.com/linode/linode-cli/pull/924\r\n* Fixed bug causing deeply nested object lists to be improperly displayed by @ezilber-akamai in https://github.com/linode/linode-cli/pull/925\r\n### \ud83d\ude80 New Features\r\n* Add integration tests for Reserved IP for IPv4 by @mawilk90 in https://github.com/linode/linode-cli/pull/886\r\n* Add integration tests for Configurable VPC top-level IPv4 Prefixes by @mawilk90 in https://github.com/linode/linode-cli/pull/905\r\n* Add integration tests for RDMA interfaces by @mawilk90 in https://github.com/linode/linode-cli/pull/908\r\n### \ud83d\udca1 Improvements\r\n* Add `AGENTS.md` files by @zliang-akamai in https://github.com/linode/linode-cli/pull/912\r\n* Enhance security of kubeconfig file permission by @yec-akamai in https://github.com/linode/linode-cli/pull/919\r\n* Update OCI publish workflow auth to OIDC by @zliang-akamai in https://github.com/linode/linode-cli/pull/918\r\n### \ud83e\uddea Testing Improvements\r\n* Remove unsupported parameters from test_interface_settings_update by @zliang-akamai in https://github.com/linode/linode-cli/pull/900\r\n* Support CFW protocol \"ALL\" / numeric by @psnoch-akamai in https://github.com/linode/linode-cli/pull/917\r\n* Refactor and fixes of integration tests by @mawilk90 in https://github.com/linode/linode-cli/pull/909\r\n### \u2699\ufe0f Repo/CI Improvements\r\n* Add security release label by @zliang-akamai in https://github.com/linode/linode-cli/pull/907\r\n* Add community contribution and hotfix labels by @zliang-akamai in https://github.com/linode/linode-cli/pull/910\r\n* Fix GitHub Actions script injection vulnerabilities by @zliang-akamai in https://github.com/linode/linode-cli/pull/906\r\n* Add merge readiness check by @mawilk90 in https://github.com/linode/linode-cli/pull/911\r\n### \ud83d\udcd6 Documentation\r\n* Update README install instructions to use pipx by @CodeBySayak in https://github.com/linode/linode-cli/pull/877\r\n### \ud83d\udce6 Dependency Updates\r\n* build(deps): bump docker/setup-qemu-action from 4.0.0 to 4.1.0 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/897\r\n* build(deps): bump pypa/gh-action-pypi-publish from 1.13.0 to 1.14.0 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/899\r\n* build(deps): bump docker/login-action from 4.0.0 to 4.2.0 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/898\r\n* build(deps): bump actions/checkout from 6 to 7 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/904\r\n* build(deps): bump softprops/action-gh-release from 2.5.0 to 3.0.1 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/902\r\n* build(deps): bump actions/github-script from 8 to 9 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/884\r\n* build(deps): bump actions/dependency-review-action from 4 to 5 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/903\r\n* build(deps): bump pypa/gh-action-pypi-publish from 1.14.0 to 1.14.2 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/915\r\n* build(deps): bump actions/setup-python from 6 to 7 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/913\r\n* build(deps): bump Andrew-Chen-Wang/github-wiki-action from 5.0.3 to 5.0.6 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/875\r\n* build(deps): bump slackapi/slack-github-action from 3 to 4 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/923\r\n* build(deps): bump softprops/action-gh-release from 3.0.1 to 3.0.3 by @dependabot[bot] in https://github.com/linode/linode-cli/pull/922\r\n\r\n## New Contributors\r\n* @CodeBySayak made their first contribution in https://github.com/linode/linode-cli/pull/877\r\n\r\n**Full Changelog**: https://github.com/linode/linode-cli/compare/v5.68.0...v5.69.0","mentions_count":7}
