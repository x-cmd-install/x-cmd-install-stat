{"id":321962686,"author":{"login":"201Harsh","id":160850571,"node_id":"U_kgDOCZZiiw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOSYd4PM4TMMK-","tag_name":"v1.1.1","target_commitish":"main","name":"IRIS-MINI Neural Core v1.1.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-05-13T14:41:39Z","updated_at":"2026-05-13T15:51:44Z","published_at":"2026-05-13T15:51:44Z","assets":[{"id":419414119,"node_id":"RA_kwDOSYd4PM4Y_8Bn","name":"iris-mini-1.1.1.tgz","label":null,"uploader":{"login":"201Harsh","id":160850571,"node_id":"U_kgDOCZZiiw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-compressed","state":"uploaded","size":739119,"digest":"sha256:af40e74d0dacd3d7583ac61705f84081ce820a60c74bd37eec35f1f4779ad062","download_count":25,"created_at":"2026-05-13T15:51:16Z","updated_at":"2026-05-13T15:51:41Z"}],"body":"# \ud83c\udf1f IRIS-MINI Neural Core - v1.1.1\r\n\r\nWe are thrilled to announce the official release of **IRIS-MINI v1.1.1**. This update brings major stability improvements to the CLI Core, ensuring flawless execution across global environments and silencing backend telemetry for a pristine terminal experience.\r\n\r\n## \ud83d\ude80 What's New & Improved\r\n\r\n* **Absolute Pathing Engine:** Completely overhauled the Express server routing. The UI now resolves perfectly regardless of where the CLI is executed globally.\r\n* **The Silence Protocol:** Integrated strict Node.js hook interceptors. All internal V8 deprecation warnings (DEP0205) and Vite dev-logs are now completely masked in production.\r\n* **Express v5 Compatibility:** Updated routing wildcard logic (`/.*/`) to comply with the new `path-to-regexp` strictness in Express 5.1.0.\r\n* **Terminal UX Enhancements:** Added an explicit `Ctrl + C` exit command indicator to the boot banner for better user control.\r\n\r\n## \ud83d\udce6 Installation Instructions\r\n\r\nThere are two ways to install this release. \r\n\r\n### Option 1: The NPM Registry (Recommended)\r\nFor the fastest and easiest installation, pull directly from the global registry:\r\n```bash\r\nnpm install -g iris-mini@1.1.1\r\n```"}
