4)\r\n\r\n### Performance\r\n- `screens`: defer import of screens [74cc95c](https://github.com/NSPC911/rovr/commit/) [2a3e3c4](https://github.com/NSPC911/rovr/commit/74cc95ce7a94517a064bd83a6c8be5611d4e139b)\r\n- `themes`: defer registering all themes except selected [775317d](https://github.com/NSPC911/rovr/commit/2a3e3c4355b8efedee59efc882bdfc271b0cb5b9)\r\n\r\n## Installation\r\n### uv\r\n```shell\r\nuv tool install rovr\r\n```\r\n### 'native' executables\r\nWindows systems:\r\n```pwsh\r\nInvoke-Expression (Invoke-WebRequest \"https://nspc911.github.io/rovr/install.ps1\")\r\n```\r\nNon-Windows systems:\r\n```sh\r\ncurl -fsSL https://nspc911.github.io/rovr/install.sh | bash\r\n```\r\n- The executables are from action run [35086050558](\r\nhttps://github.com/NSPC911/rovr/actions/runs/35086050558)\r\n\r\n### SHA256\r\n| Binary | Hash |\r\n| ------ | ---- |\r\n| rovr-linux-arm64-nuitka.zip | `sha256:89E1C0954F372F2A0336317D6D95BA6C58BEF3BD5B99BFCB8DD63F514CEECF10` |\r\n| rovr-linux-x64-nuitka.zip | `sha256:C799A6AFB9F668DD7F759F77F4CD1C54546900793D947B30AE2FC71651208BB9` |\r\n| rovr-macos-arm64-nuitka.zip | `sha256:7C40552D34368259F26BD6FADDBA293356B5864055E1668917C8DE13AB4B1C8C` |\r\n| rovr-macos-x64-nuitka.zip | `sha256:30B758D89A8C7BE4F7CAF7FDC16CEA757C4E0F88096B1C73C0FFC34E59EDD657` |\r\n| rovr-windows-arm-nuitka.zip | `sha256:51B68729DB936DE79B8581DFCCAF80EC73818474BEAF6C7A865936E1EF93CE67` |\r\n| rovr-windows-x64-nuitka.zip | `sha256:8B0282EAAC63B3A3E379A68C0D3396F9FD706CBF2D736B47E4AF9799F205A49D` |\r\n"}
