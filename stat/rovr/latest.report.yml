.zip","label":null,"uploader":{"login":"NSPC911","id":87571998,"node_id":"MDQ6VXNlcjg3NTcxOTk4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21166844,"digest":"sha256:18e50d25785d14e2d1df09a82c440e52f70fec647df61dc4baf6f015a279f39c","download_count":15,"created_at":"2026-10-01T10:57:10Z","updated_at":"2026-10-01T10:57:13Z"},{"id":603054417,"node_id":"RA_kwDOOt_Kh84j8eFR","name":"rovr-windows-arm-nuitka.zip","label":null,"uploader":{"login":"NSPC911","id":87571998,"node_id":"MDQ6VXNlcjg3NTcxOTk4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16593073,"digest":"sha256:bb538295568a037cd8d36948ffeb2adb68cccf254f013568bece43fe786cf9d4","download_count":14,"created_at":"2026-10-01T10:56:48Z","updated_at":"2026-10-01T10:57:10Z"},{"id":603052635,"node_id":"RA_kwDOOt_Kh84j8dpb","name":"rovr-windows-x64-nuitka.zip","label":null,"uploader":{"login":"NSPC911","id":87571998,"node_id":"MDQ6VXNlcjg3NTcxOTk4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21859894,"digest":"sha256:ed3a43d57ada5eb2a03961d7e218802fd466482d8daf940537d7e23e6f4a3fec","download_count":30,"created_at":"2026-10-01T10:55:41Z","updated_at":"2026-10-01T10:56:48Z"}],"body":"Hello everyone, surprisingly this isn't a bump in minor version, there weren't any breaking changes this time round, but 0.11.0 will take quite a bit more time\r\n\r\nrovr is a stylish, batteries-included terminal file manager that aims to be easy to switch to.\r\n\r\nThis will be rovr's latest release for the next 2 months. No new commits will be made for the next 1.5 months as I want to focus on my studies. As such, rovr is not participating in [Hacktober 2026](https://hacktoberfest.com).\r\n\r\nNow that that is out of the way, let's get started!\r\n\r\n## Notable changes\r\n### Add configurable extra mouse keys\r\n<sub>This feature only exists on a small number of Terminal Emulators</sub>\r\n\r\nThis is a new part of rovr's new keybind system that lets you configure what each mouse key (aside from left click, middle click and right click) does. You can do so by targeting it in the same way as a keybind\r\n\r\n```toml\r\n[filelist]\r\n\"mouse4\" = \"hist_previous\"\r\n\"mouse5\" = \"hist_next\"\r\n```\r\n\r\nKeep in mind, this does allow chording to exist, so you could define an action like\r\n```toml\r\n[filelist]\r\n\"mouse4\".p = \"toggle_pin\"\r\n5.\"mouse5\" = \"cursor(-5)\"\r\n```\r\nBut I would advise against it, as it would just be very awkward for you.\r\n\r\nSimple video of me showcasing it (trust me that I'm using the mouse buttons and not keys)\r\n\r\n\r\nhttps://github.com/user-attachments/assets/da60872d-82f0-4506-8ef8-ef62ecfc7b5d\r\n\r\n### IPC Control\r\nThis **opt-in feature** lets you control rovr via an IPC bridge.\r\n\r\nUnder the hood, it is a WebSocket that listens to events and takes actions on it. For now, there is a limited set of actions that you can run, with its documentation available at https://nspc911.github.io/rovr/features/ipc\r\n\r\nrovr now comes with two new flags\r\n```sh\r\nrovr --ipc <action>  # sends action to rovr based on the active shell's ROVR_IPC_PID\r\nrovr --ipc-to <PID> <action>  # sends action to specified pid\r\n```\r\n\r\nFor now, the supported actions are\r\n```sh\r\ncd <path>\r\nclipboard copy/cut <path1> ... [--selection {keep,add,replace}]\r\nclipboard list\r\nclipboard paste\r\ntab list\r\ntab new <path> [--focus]\r\ntab focus <id>\r\ntab close <id>\r\ntab history [<id>]\r\nquit [--no-cd]\r\nsuspend\r\nlist-instances\r\nask <message>\r\ninput <message>\r\nnotify <message> [--title TITLE] [--severity {information,warning,error}] [--markup] [--timeout TIMEOUT]\r\n```\r\n\r\nYou can see what the output of each command is in the documentation above.\r\n\r\nhttps://github.com/user-attachments/assets/71ea2110-8d18-45b0-89bf-de51005fbb7a\r\n\r\n\r\n### Handle circular bulk renames nicely\r\n\r\nI was quite surprised when I found out yazi doesn't handle this as well.\r\n\r\nA circular bulk rename is when a 'deadlock' like this happens\r\n```\r\nfile1 -> file2\r\nfile2 -> file1\r\n```\r\nwithout renaming file1 to file2, file2 cannot be renamed to file1, its a sort of a deadlock, which is immediately caught by most programs. Not rovr now! It can smartly handle such deadlocks only when necessary to save time fixing the issues.\r\n\r\n\r\nhttps://github.com/user-attachments/assets/6c171183-ab69-4d18-8e5f-4227712ebf09\r\n\r\n### Use imagemagick for unsupported images\r\nI found out that [Pillow](https://pillow.readthedocs.io/en/stable) doesn't support `.jxl` files, and my day was ruined, so here is compensation for that.\r\n```toml\r\n[plugins.magick]\r\nenabled = true\r\n# on certain os-es, `convert` is still a thing, use\r\n# that if `magick` is unavailable\r\nexecutable = \"magick\"\r\n```\r\n\r\nhttps://github.com/user-attachments/assets/730951b8-e56d-4107-95f4-407beb30ac70\r\n\r\nmagick is automatically used if PIL raises any errors, so don't worry on needing to update your `[settings.preview_rules]`\r\n\r\n### Narrow preview types using extensions\r\nCertain files like `.svgz` (the main reason for this) is considered a gzipped file, not a svg-type file. This lets you narrow preview types using a file extension\r\n\r\nFor example\r\n```toml\r\n[settings.preview_rules.\"application/(x-)?gzip\"]\r\ndefault = \"archive\"\r\nextensions = { svgz = \"resvg\" }\r\n```\r\nIn this case, a typical `gzip` file will open with rovr's archive handler. If the extension is `svgz` though, it will use the resvg previewer, letting you handle both cases easily\r\n\r\n### Render control characters using control pictures\r\nFor some reason, Linux allows `\\u0000` - `\\u002F` as file names, but those become invisible, and also break rendering if `CR` or `LF` is used.\r\nrovr now, as far as possible, handles cases where such a character is used, and renders them using the [Control Pictures](https://en.wikipedia.org/wiki/Control_Pictures) part of unicode\r\n\r\nSome fun screenshots:\r\n<img width=\"190\" height=\"84\" alt=\"image\" src=\"https://github.com/user-attachments/assets/01c79031-c853-434b-94d9-caef1ef9ac66\" />\r\n<img width=\"473\" height=\"66\" alt=\"image\" src=\"https://github.com/user-attachments/assets/36bedba0-a5a2-4cfd-afea-afc737c88a60\" />\r\n<img width=\"521\" height=\"103\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3ca10c3a-8b76-4b00-8f6e-a2dff01fd2b0\" />\r\n\r\nKeep in mind, this is purely visual, the character is not replaced in the file system or inputs, it's merely a form of modifying the rendering of such a character to let you know such a character exists.\r\n\r\nYou could also change the icon like normal\r\n```toml\r\n[[icons.files]]\r\npattern = \"\\n\"\r\nicon = \"n\"\r\ncolor = \"red\"\r\n```\r\nwill still target the file properly\r\n\r\n<img width=\"172\" height=\"52\" alt=\"image\" src=\"https://github.com/user-attachments/assets/bd6a77b6-d02d-476a-8aaf-5de178c3f7a1\" />\r\n\r\n## Fixes\r\n### Fix birthtime not working on linux\r\nI didn't realise at time of the commit where `st_birthtime` on linux doesn't exist, my apologies, this fixes that problem with a custom handler using `statx` lib and `ctypes`.\r\n\r\n<img width=\"547\" height=\"103\" alt=\"image\" src=\"https://github.com/user-attachments/assets/c8c437ca-85e0-4683-9076-cd083393e4b7\" />\r\n\r\nyipee!\r\n\r\n### Handle backslashes on windows\r\nLong overdue fix as well, a stupid decision on my part to force `/` on Windows when most apps use `\\`, uhhh\r\nAnyways, you can type `C:/Users/p/hi\\bye\\folder` and it will expand to `C:/Users/p/hi/bye/folder`\r\n\r\n### FileList fixes\r\n#### exit implicit select mode if no options are selected\r\nThis is a fix to ensure `ctrl+a` or `ctrl+r` unselecting all options will result in exiting select mode if `allow_auto_select_mode` is enabled and select mode is entered via any select-mode-specific keybinds\r\n\r\n#### restore scrolled position after switch\r\nAnother QOL fix, rovr used to not care about the scroll position when saving the tabs' state, this fixes it to save the scroll position, restoring to where you were.\r\n\r\n<details>\r\n<summary><h3>Full Changelog</h3></summary>\r\n\r\n### Added\r\n- `app`: extra mouse keys [#361](https://github.com/NSPC911/rovr/pull/361)\r\n- `app`: add optional opt-in ipc control [#358](https://github.com/NSPC911/rovr/pull/358)\r\n- `bulkrename`: handle circular renames nicely [32975bb](https://github.com/NSPC911/rovr/commit/32975bb81c57775230fa43d3975da56f4d3f5be1)\r\n- `resvg`: add configurable options [#366](https://github.com/NSPC911/rovr/pull/366)\r\n- `preview`: allow using extensions to narrow previewer further [#365](https://github.com/NSPC911/rovr/pull/365)\r\n- `keys`: resolve actions with parents [877671d](https://github.com/NSPC911/rovr/commit/877671d4f453ecfa864c588cd814215c34052152)\r\n- `keys`: notify if action is invalid [1ba8f23](https://github.com/NSPC911/rovr/commit/1ba8f23d2ef40a45d6470582419b541094f8c432)\r\n- `rg+fd`: use threads for faster searching [a2b9f96](https://github.com/NSPC911/rovr/commit/a2b9f96985758ea7c6760bc110c89a7b7a3b66e6)\r\n- `preview`: use imagemagick for unsupported images [#367](https://github.com/NSPC911/rovr/pull/367)\r\n- `filelist`: add invert selections [e6cfdea](https://github.com/NSPC911/rovr/commit/e6cfdeabd0cedbc2abf17e45c0ea3f21d282a844) [08c3a9f](https://github.com/NSPC911/rovr/commit/08c3a9f88d47748babc97629ce9e7bc4d678b573)\r\n- `filelist`: restore scrolled position after switch [5ac7fed](https://github.com/NSPC911/rovr/commit/5ac7fed7f2fc5ec36049bbe5fe00c7479327903a)\r\n- `lists`: show control images in items [#368](https://github.com/NSPC911/rovr/pull/368)\r\n\r\n\r\n### Fixed\r\n- `shell`: actually expand command [cb7f705](https://github.com/NSPC911/rovr/commit/cb7f705b604bbc5610fd70b78a747b317880ba34)\r\n- `firstlaunch`: tweak options and styles a bit [8671c9f](https://github.com/NSPC911/rovr/commit/8671c9ff0a77dea90c648eca90ac89f1b63b7cfc)\r\n- `pathinput`: handle backslashes on windows [5d1e1db](https://github.com/NSPC911/rovr/commit/5d1e1db2cc1e77dddca0a309f66cb5155b8b6a3b)\r\n- `filelist`: exit implicit select mode if no options are selected [50d7ce1](https://github.com/NSPC911/rovr/commit/50d7ce17eda9c3a779689947c82e4c3c553dc7b8)\r\n- `cd`: set focuson if target is a file [5352b73](https://github.com/NSPC911/rovr/commit/5352b735831d471ad27b8ed3220114beaf180bac) [0c005f7](https://github.com/NSPC911/rovr/commit/0c005f7986041533ceb93e02dcd1cb31a63e87e2)\r\n- `config`: make `preview_rules.*.extensions` not required [90fc9dd](https://github.com/NSPC911/rovr/commit/90fc9dd7222f40e044447f75058139e5761e61e7)\r\n- `path`: use custom statx to get birthtime on linux [064fd89](https://github.com/NSPC911/rovr/commit/064fd89ababdf53d86405f48fbbe132fe7b32eb0)\r\n- `preview`: specifically handle qoi [2227ab9](https://github.com/NSPC911/rovr/commit/2227ab982c7a7a098a0233d5d656a879fde089fc)\r\n- `cache`: check `in_preview_loc` properly [fa5cc76](https://github.com/NSPC911/rovr/commit/fa5cc76fe7ba01d7b28fd5aa564f7dac843894d0)\r\n- `path`: check consume key [5c6bb71](https://github.com/NSPC911/rovr/commit/5c6bb717494bd27d836e319180ce8c2441a3b2ea)\r\n\r\n\r\n### Performance\r\n- `dnd`: lazy import drag image stuff [d4bd463](https://github.com/NSPC911/rovr/commit/d4bd46382fb9a8cb8353ffbdce37a3fdf797f752)\r\n- `dnd`: remove nerd font from repo [89d4eca](https://github.com/NSPC911/rovr/commit/89d4eca7459e6d86eb88f78a66e5ceeaeb38731a)\r\n- `screens`: lazy load some modules [c478c70](https://github.com/NSPC911/rovr/commit/c478c700c333ed6f072bbbb66934454b83846594)\r\n- `app`: pre-setup initial breakpoint classes [b5d373f](https://github.com/NSPC911/rovr/commit/b5d373faaa2630472aa53bb4b5e18d4a1898c958)\r\n- `app`: suppress eager theme refresh [6033857](https://github.com/NSPC911/rovr/commit/60338570b6388e8af24f57f681dd7429fbf1117f)\r\n- `app`: refresh on second resume [c1794d4](https://github.com/NSPC911/rovr/commit/c1794d47529edfbac89267df953c2c58efd6c84e)\r\n\r\n</details>\r\n\r\n## Installation\r\n### uv\r\n```shell\r\nuv tool install rovr\r\n```\r\n### 'native' executables\r\nWindows systems:\r\n```pwsh\r\nInvoke-Expression (Invoke-WebRequest \"https://nspc911.github.io/rovr/install.ps1\")\r\n```\r\nNon-Windows systems:\r\n```sh\r\ncurl -fsSL https://nspc911.github.io/rovr/install.sh | bash\r\n```\r\n- The executables are from action run [36850225475](https://github.com/NSPC911/rovr/actions/runs/36850225475)\r\n\r\n### SHA256\r\n| Binary | Hash |\r\n| ------ | ---- |\r\n| rovr-linux-arm64-nuitka.zip | `sha256:FD2839F6E0239AC6568C1CE283D1BBE6111CA89AF35547AFA54FA91E11F30F3D` |\r\n| rovr-linux-x64-nuitka.zip | `sha256:99052713401A2E734A7CFA9977B6F5EACEB0987E88CA71D36A944F57B75D3FB5` |\r\n| rovr-macos-arm64-nuitka.zip | `sha256:9550EC249C622CABAEAA9C87EC3AC4C62D0CE3299076EB663229106C6C8E6B95` |\r\n| rovr-macos-x64-nuitka.zip | `sha256:18E50D25785D14E2D1DF09A82C440E52F70FEC647DF61DC4BAF6F015A279F39C` |\r\n| rovr-windows-arm-nuitka.zip | `sha256:BB538295568A037CD8D36948FFEB2ADB68CCCF254F013568BECE43FE786CF9D4` |\r\n| rovr-windows-x64-nuitka.zip | `sha256:ED3A43D57ADA5EB2A03961D7E218802FD466482D8DAF940537D7E23E6F4A3FEC` |"}
