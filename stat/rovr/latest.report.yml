ip","label":null,"uploader":{"login":"NSPC911","id":87571998,"node_id":"MDQ6VXNlcjg3NTcxOTk4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22521813,"digest":"sha256:cf3c30ec3b7ef1acb0c5ebe5100b29d38e87bbc7e59e6ea4d6b8618846e33821","download_count":0,"created_at":"2026-09-10T13:29:50Z","updated_at":"2026-09-10T13:29:55Z"},{"id":555076833,"node_id":"RA_kwDOOt_Kh84hFczh","name":"rovr-windows-arm-nuitka.zip","label":null,"uploader":{"login":"NSPC911","id":87571998,"node_id":"MDQ6VXNlcjg3NTcxOTk4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17937808,"digest":"sha256:db88d4a8f47f394c332c5eea2b28f2332ded967a3807aba8c756d812b5b2d81b","download_count":0,"created_at":"2026-09-10T13:29:05Z","updated_at":"2026-09-10T13:29:50Z"},{"id":555074695,"node_id":"RA_kwDOOt_Kh84hFcSH","name":"rovr-windows-x64-nuitka.zip","label":null,"uploader":{"login":"NSPC911","id":87571998,"node_id":"MDQ6VXNlcjg3NTcxOTk4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":23212619,"digest":"sha256:1d66c74f3bed3ea848dc983650b85a24b06bb3ad1430a71eb68ef0726c37f185","download_count":2,"created_at":"2026-09-10T13:27:48Z","updated_at":"2026-09-10T13:29:05Z"}],"body":"What a lovely day it is to release v0.10.2\r\n\r\nrovr is a stylish, batteries-included terminal file manager. There have been some improvements from the previous release (1 breaking change lie before), so let's get started!\r\n\r\n## Notable changes\r\n\r\n### New keybind system\r\n\r\nThis is the highlight of 0.10.2. Previously, configs followed the `action = [<keys>]` syntax, which made it much harder to expand on it for key chords and custom actions with descriptions.\r\n\r\nFor example, in the previous config\r\n```toml\r\n[keybinds]\r\n\"quit\" = [\"q\", \"ctrl+q\"]\r\n```\r\nbut now, with the new system, it would look like\r\n```toml\r\n[global]\r\n\"q\" = { action = \"quit\", desc = \"Quit\" }\r\n\"ctrl+q\" = \"quit\"\r\n```\r\n\r\nThis system also takes advantage of Textual's action syntax, so certain actions can take in extra arguments. For example, `quit` can take an optional boolean to denote whether to write to `--cwd-file` used for `cd-on-quit`\r\n```toml\r\n[global]\r\n\"q\" = { action = \"quit\", desc = \"Quit\" }\r\n\"Q\" = { action = \"quit(False)\", desc = \"Quit without cding\" }\r\n```\r\n\r\nThis new system will not be forced, but new configs generated will follow this system. Backwards compatibility will only exist for this version until v0.11.0 is released, so please migrate asap! For more info, check out https://nspc911.github.io/rovr/reference/keybindings\r\n\r\n### Key chords\r\nKey chords are defined in a similar way\r\n```toml\r\n[global]\r\nq.u.i.t = \"quit\"\r\n```\r\nin the above example, pressing <kbd>q</kbd> -> <kbd>u</kbd> -> <kbd>i</kbd> -> <kbd>t</kbd> would then quit the app. You can also set custom descriptions for each chord\r\n```toml\r\n[global]\r\nq.u.i.t = \"quit\"\r\nq.desc = \"press u + i + t\"\r\nq.u.desc = \"press i + t\"\r\nq.u.i.desc = \"just press t!\"\r\n```\r\nyou can also define them as a table\r\n\r\nkey chords are now the default method for pseudo chords like the extra copy menu and sort order popup. if you want them back, they are still available as actions\r\n```toml\r\n[file_list]\r\n\"Y\" = { action = \"copy.open_popup\", desc = \"Open the copy menu\" }\r\n\",\" = { action = \"sort_order.open_popup\", desc = \"Open the sort menu\" }\r\n```\r\n\r\nkey chords are defined under the `#key_chord` selector if you want to theme it\r\n\r\n### Previews\r\n\r\nPreviews have gotten a major improvement!\r\n\r\n#### Cached Previews\r\nPreviews are now cached! This means SVG previews and PDF previews load much faster after the first load. Eager loading is still not done; it is cached only when explicitly previewed.\r\n\r\nPreviews are stored in a temporary directory being wiped after a restart, or explicitly using `rovr --clear-cache`\r\n\r\nhttps://github.com/user-attachments/assets/7963ec46-fee1-4da8-8ca1-7afcf4b8d813\r\n\r\n#### Scrollable Text Previews\r\nFor those without [bat(1)](https://github.com/sharkdp/bat), now is the best time to consider so!\r\n\r\nWithout bat, rovr displays up to 256kb (default), which can be scrolled through. With bat, you can scroll through the entire document, though it takes a bit of time to render, especially large files.\r\n- Under the hood, rovr splits a file into 256 line chunks and hands it of to bat to render, before using a custom parser to convert it into a renderable format. The chunking will take some time, especially on, say, a 1GB text file\r\n\r\nhttps://github.com/user-attachments/assets/a6b2038a-1808-4d3c-b821-56fe49197f22\r\n\r\n### Scrollbars\r\nrovr's scrollbars are now on the border! This will free up a bit of space, though the original scrollbar's space cant be properly used up for now\r\n\r\n### Configurable app titles\r\nAs promised in the previous release, the app title is now configurable! The default is `rovr @ %ncwd`, you can take a look at supported expansions at https://nspc911.github.io/rovr/features/context-menu/#command-expansions\r\n\r\n## Breaking Changes\r\n`settings.allow_tab_nav` is removed; the new keybind handler lets you rebind the key to something else of your choice\r\n\r\n<details>\r\n<summary><h3>Full Changelog</h3></summary\r\n<p>\r\n\r\n### Added\r\n\r\n- `preview`: add scrollable text previews [#344](https://github.com/NSPC911/rovr/pull/344) [16bf04d](https://github.com/NSPC911/rovr/commit/16bf04d8a6fdeeebb1c8c05a9d14d1946c7d9123)\r\n- `preview`: add cached previews [#339](https://github.com/NSPC911/rovr/pull/339) [3e48e47](https://github.com/NSPC911/rovr/commit/3e48e472c8093f3f7c7a321531391e0694bae4da) [e43633f](https://github.com/NSPC911/rovr/commit/e43633f22c938a31fc4f068f54d149918dc207b9)\r\n- `keys`: add chord keys [#341](https://github.com/NSPC911/rovr/pull/341) [4c9ae02](https://github.com/NSPC911/rovr/commit/4c9ae028381a8d6917a13f3311241c04d76ab038)\r\n- `themes`: add extraterrestrial themes [#343](https://github.com/NSPC911/rovr/pull/343) [39f596c](https://github.com/NSPC911/rovr/commit/39f596c4bdf00f6bd00060d3409cf31518659659)\r\n- `copy`: allow copying general text [de8eb5d](https://github.com/NSPC911/rovr/commit/de8eb5d0cc5ec6b56e3946b4da24789e92c2c8ee)\r\n- `keys`: add `cd-no-quit` [b6cbd37](https://github.com/NSPC911/rovr/commit/b6cbd375502880e3060579f0951a5805db821278) [1ddbd50](https://github.com/NSPC911/rovr/commit/1ddbd50bf7cfd089c95b4e0fff96e853583fe803)\r\n- `metadata`: add birthtime [ea358a2](https://github.com/NSPC911/rovr/commit/ea358a2855da244868b3f5e7e606a28480006ab7)\r\n- `shellexec`: store the last command run [940485a](https://github.com/NSPC911/rovr/commit/940485a0f90d73905eff9925ed34a439e58e5e89)\r\n- `app`: make the app title configurable [912bb30](https://github.com/NSPC911/rovr/commit/912bb30761d68b7bec156d7592798c6d110adacd) [4e8b758](4e8b758f24a8e0cfff56430fd76c76660e7b2537)\r\n- `contextmenu`: add follow link option [#351](https://github.com/NSPC911/rovr/pull/351) [#353](https://github.com/NSPC911/rovr/pull/353)\r\n- `keys`: have tab and shift+tab keys set by default [473e5f3](https://github.com/NSPC911/rovr/commit/473e5f30e6aafedc2c47de0dacb0029f5694a09a)\r\n- `keys`: add another context for buttons [17598cb](https://github.com/NSPC911/rovr/commit/17598cb7c3c5ffbb123eb67ab4897d2d56171fb5)\r\n- `keys`: make nav wrapping optional [bd8abdf](https://github.com/NSPC911/rovr/commit/bd8abdf925cca6511b45af5436874efe959876d4)\r\n\r\n### Changed\r\n\r\n- `ui`: arrange scrollbars on container borders [#345](https://github.com/NSPC911/rovr/pull/345) [532cda1](https://github.com/NSPC911/rovr/commit/532cda16ee6edd500cee46c76e71fec3ecfe86e3)\r\n\r\n### Fixed\r\n\r\n- `input`: increase the hit size of modal input groups [53fe05b](https://github.com/NSPC911/rovr/commit/53fe05b5965ab66a02f097b19a55f6a8fce69a3c)\r\n- `themes`: resolve variables properly and update variable contexts [34bc91a](https://github.com/NSPC911/rovr/commit/34bc91a02f68bd7d8196d0db3807c571d25c72b5) [e27e7e0](https://github.com/NSPC911/rovr/commit/e27e7e0efd3504110291d3265097674229bde23f)\r\n- `filelist`: handle recursive links [f5e5ca9](https://github.com/NSPC911/rovr/commit/f5e5ca97f10af8bb3c70f8e7755c05ece6d7852a)\r\n- `process`: refresh error state properly [4438c06](https://github.com/NSPC911/rovr/commit/4438c06cd0017386e6643ff082cfcb0ec72d7be4)\r\n- `app`: handle paste and show-key checks properly [1a430b3](https://github.com/NSPC911/rovr/commit/1a430b31cb1f33b10307ffa799f561b08ec910b2) [839741b](https://github.com/NSPC911/rovr/commit/839741b7fd5b5b82d6b4c24f93f620e171a213fd)\r\n- `app`: reject Kitty modifier-only keys [eb4ffd2](https://github.com/NSPC911/rovr/commit/eb4ffd26ca78dac1ee171ae4808b7900d1154ab1)\r\n- `preview`: fix scrolling, borders, missing border titles, and crashes [c34c59e](https://github.com/NSPC911/rovr/commit/c34c59e700beb1a066a5d6c4ef2688182d20cfc8) [17eeb44](https://github.com/NSPC911/rovr/commit/17eeb4451d5f173e9f6b80eed62b98118eedff9a) [76f522f](https://github.com/NSPC911/rovr/commit/76f522fce2228184005f7ff777553c2e1202c068) [a3a87de](https://github.com/NSPC911/rovr/commit/a3a87defeb3cd85fba4deb82ce8e6ae8fe912412)\r\n- `pins`: handle a deadlock [0c730fb](https://github.com/NSPC911/rovr/commit/0c730fb40ca4943ebb614917a54c154778acffd3)\r\n- `process`: address a possible thread-safety issue [db29a3c](https://github.com/NSPC911/rovr/commit/db29a3c03f79d5600c52a64e3770fb72b96196d2) [f6485c9](https://github.com/NSPC911/rovr/commit/f6485c9b6298c21ab4aa17a4556b76877ec4cc4c)\r\n- `keys`: handle certain keys properly in new handler [e7b7c4a](https://github.com/NSPC911/rovr/commit/e7b7c4aae80459bcef1a64e6b751a67f16323fa3)\r\n- `shellexec`: do not color an empty border [f8d1653](https://github.com/NSPC911/rovr/commit/f8d165323e4db986da227d4a463ea235b31e8e94)\r\n- `app`: arm the timer after logs are done [17c3dcb](https://github.com/NSPC911/rovr/commit/17c3dcb7b228d6f735d208693ed23d439ed90cf5)\r\n- `buttons`: consistent colors [#352](https://github.com/NSPC911/rovr/pull/352)\r\n- `preview`: add fallback title for special files [#350](https://github.com/NSPC911/rovr/pull/350) [256437e](https://github.com/NSPC911/rovr/commit/256437ed712c3509418136e5dd0ede43e6a2df7b)\r\n- `image`: capture tgp responses in zellij only [68e54c0](https://github.com/NSPC911/rovr/commit/68e54c07db67f14fc54167dfbda9cc93eb9e5d35)\r\n- `firstlaunch`: check for batcat on debian [8c47233](https://github.com/NSPC911/rovr/commit/8c4723377a42a497f500b146f93cb1fb382cec4b) [d16d09e](https://github.com/NSPC911/rovr/commit/d16d09e67ddfe1edd8a1c1a7d669d1482b4e304a)\r\n- `preview`: handle ansi changes properly [ebc5daa](https://github.com/NSPC911/rovr/commit/ebc5daaea51393f97e57035bd85bdfcb50e47240)\r\n- `filelist`: hist_previous no longer goes up tree [9b7085f](https://github.com/NSPC911/rovr/commit/9b7085f645844b5b25222aa78735ca946284d1f3)\r\n- `input`: properly handle kitty modifiers [9baf4d3](https://github.com/NSPC911/rovr/commit/9baf4d3687d77632958a54c7ec93d2ed243b72bf)\r\n- `keys`: make global be lesser priority [4d4700e](https://github.com/NSPC911/rovr/commit/4d4700ec3540d39fe047d9417af193ecedc3168c)\r\n- `preview`: properly update debounced preview [21c3041](https://github.com/NSPC911/rovr/commit/21c3041b796f36e7ef4c4dd28bccf7cd38d7174a)\r\n- `filelist`: fix race condition [f384f9a](https://github.com/NSPC911/rovr/commit/f384f9a7129f9d58f377c04c4fa5f6b54eb2fa85)\r\n- `workers`: add explicit groups [8f09ab3](https://github.com/NSPC911/rovr/commit/8f09ab3411840503eda9756d6fc48f6d0ec88227)\r\n- `archive`: disable strict timestamps [87a5334](https://github.com/NSPC911/rovr/commit/87a5334f9212d3abb46611fa6c5154a8129f56db)\r\n\r\n### Performance\r\n\r\n- `preview`: use pickle instead of markup [e46e03d](https://github.com/NSPC911/rovr/commit/e46e03d3af446f1c4130499f5aa7d34e6b157aef)\r\n- `config`: store the schema validator in binary form [ba33239](https://github.com/NSPC911/rovr/commit/ba33239001493a4a37c7a6088fecc2c2fc6e8c94)\r\n- `filelist`: optimize scrolling? [4eeb7c7](https://github.com/NSPC911/rovr/commit/4eeb7c7157e956259bc730b9da579eede6ca87e5)\r\n- `app`: keep a single persistent worker for drive refresh [a46a885](https://github.com/NSPC911/rovr/commit/a46a885942902131cbb42d689f3026d0875a6c03) [e06cc5e](https://github.com/NSPC911/rovr/commit/e06cc5e014ea68ccf571a31c77b90eccefe66401)\r\n\r\n### Build\r\n\r\n- `nuitka`: improve compiled resource handling [9ae9cf9](https://github.com/NSPC911/rovr/commit/9ae9cf9968fb97a637c36ef75522e51e5878dd7c) [823d95f](https://github.com/NSPC911/rovr/commit/823d95f84f0e2e7f80e0108bb70981064c2ff092)\r\n\r\n### Refactor\r\n\r\n- `keys`: replace the keybind handler [#338](https://github.com/NSPC911/rovr/pull/338) [0d3fae3](https://github.com/NSPC911/rovr/commit/0d3fae319b8f26ea7725b28c49c16cbf2b3007ae)\r\n  - Not a BREAKING change yet, but it will be.\r\n- rename rovr variables to match their usage [8e822c2](https://github.com/NSPC911/rovr/commit/8e822c24dddd2e4f3e96a83d9a9955eda5a13e5d)\r\n  - Internal breaking change, you might want to clean up state files\r\n\r\n</p>\r\n</details>\r\n\r\n## Installation\r\n### uv\r\n```shell\r\nuv tool install rovr\r\n```\r\n### 'native' executables\r\nWindows systems:\r\n```pwsh\r\nInvoke-Expression (Invoke-WebRequest \"https://nspc911.github.io/rovr/install.ps1\")\r\n```\r\nNon-Windows systems:\r\n```sh\r\ncurl -fsSL https://nspc911.github.io/rovr/install.sh | bash\r\n```\r\n- The executables are from action run [34466857145](\r\nhttps://github.com/NSPC911/rovr/actions/runs/34466857145)\r\n\r\n### SHA256\r\n| Binary | Hash |\r\n| ------ | ---- |\r\n| rovr-linux-arm64-nuitka.zip | `sha256:84B7B17771F8BAD69E7B2DA132E6CB30EAFFA2D77E598A9498F7DE337BE53776` |\r\n| rovr-linux-x64-nuitka.zip | `sha256:0A22E710B1077FBF234B59C2C5F9E97FA33389F24EDEF07BE5A32A690B03B1EC` |\r\n| rovr-macos-arm64-nuitka.zip | `sha256:76EB7002F8B71919C889A7D2104887121CA3DD39C7E3D130ADD1E8626DD174B4` |\r\n| rovr-macos-x64-nuitka.zip | `sha256:CF3C30EC3B7EF1ACB0C5EBE5100B29D38E87BBC7E59E6EA4D6B8618846E33821` |\r\n| rovr-windows-arm-nuitka.zip | `sha256:DB88D4A8F47F394C332C5EEA2B28F2332DED967A3807ABA8C756D812B5B2D81B` |\r\n| rovr-windows-x64-nuitka.zip | `sha256:1D66C74F3BED3EA848DC983650B85A24B06BB3AD1430A71EB68EF0726C37F185` |\r\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
