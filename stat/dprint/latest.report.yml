abe684fe32868d1959f7fad4ccbc2996a393d639bbb6634668fa08dc49","download_count":2871,"created_at":"2026-09-29T16:22:30Z","updated_at":"2026-09-29T16:22:31Z"},{"id":598660530,"node_id":"RA_kwDOC3PEAc4jrtWy","name":"dprint-x86_64-unknown-linux-musl.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":10717923,"digest":"sha256:06c2a239a1214d5f9e76c364cadbd0ffaee710fdb516ca6448b08860364db6e2","download_count":152,"created_at":"2026-09-29T16:22:30Z","updated_at":"2026-09-29T16:22:32Z"},{"id":598660529,"node_id":"RA_kwDOC3PEAc4jrtWx","name":"SHASUMS256.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1634,"digest":"sha256:11259eaf0ccb77babdd2a383292ca8e551b195d7a77b28bbbbb392b85ea35f9a","download_count":43,"created_at":"2026-09-29T16:22:30Z","updated_at":"2026-09-29T16:22:31Z"}],"body":"## Changes\r\n\r\n* fix(BREAKING): make `--config` file patterns relative to the config file's directory (#1257)\r\n* feat(BREAKING): evaluate associations and override files in order where the last match wins (#1258)\r\n* feat: add plugins with `dprint init` when a config file already exists (#1241)\r\n* feat: additive plugins (#1249)\r\n* feat: always pre-select a json plugin with `dprint init` (#1252)\r\n* feat: support `neverPreselect` in the plugin info file (#1253)\r\n* fix(development): harden range markers in specs (#1256)\r\n\r\nThis release features a breaking change for glob patterns in config files specified with `--config <file-path>`. Previously in this case, the patterns would be relative to the cwd, but this was bad because it would cause things to work in unexpected ways based on what the cwd is (fragile). See #1257 for workarounds and please open an issue if this really breaks you and I'll try to come up with a solution. Remote configs will continue to work like before where the patterns are relative to the cwd.\r\n\r\n## Install\r\n\r\nRun `dprint upgrade` or see https://dprint.dev/install/\r\n\r\n## Verification\r\n\r\nThese artifacts have [build provenance attestations](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds).\r\nVerify a download with the [GitHub CLI](https://cli.github.com/):\r\n\r\n```shell\r\ngh attestation verify dprint-x86_64-unknown-linux-gnu.zip --repo dprint/dprint\r\n```\r\n\r\n## Checksums\r\n\r\n|Artifact|SHA-256 Checksum|\r\n|:--|:--|\r\n|dprint-x86_64-apple-darwin.zip|47e0c48127c9ac306bc66c4af0c3146ef41bd008c5eccc956691c09e2661f077|\r\n|dprint-aarch64-apple-darwin.zip|06a7ea017e4d7da296f8a44fabb2f3d6ffafa91bbd5fddd4830bdc418bacb46d|\r\n|dprint-x86_64-pc-windows-msvc.zip|6ab827fba525918670ff666edb5fc50917157c803c9abdc463131f75b5df0840|\r\n|dprint-x86_64-pc-windows-msvc-installer.exe|9ce61595a0c55dfe56dfa6fa9f9dfb7e1bf4fa1953734c2dcda95805a5558157|\r\n|dprint-aarch64-pc-windows-msvc.zip|de86d320f0753f8803ef957baec766be18858e4021ddcf2d0584142a8ace1bae|\r\n|dprint-x86_64-unknown-linux-gnu.zip|3047dcabe684fe32868d1959f7fad4ccbc2996a393d639bbb6634668fa08dc49|\r\n|dprint-x86_64-unknown-linux-musl.zip|06c2a239a1214d5f9e76c364cadbd0ffaee710fdb516ca6448b08860364db6e2|\r\n|dprint-aarch64-unknown-linux-gnu.zip|f161161399b5ef62b3b68570ea1df24d16687adfbb88c125c8c4355e5780c407|\r\n|dprint-aarch64-unknown-linux-musl.zip|c74dd4f48dd9b8d6d595acfb238dd32ede67bdf792e8c6e2b8760cdaff9d80fb|\r\n|dprint-riscv64gc-unknown-linux-gnu.zip|81b2e4138324b1bb78bafc13e72d8073e001c7164a579ede11128534ec41bfe4|\r\n|dprint-loongarch64-unknown-linux-gnu.zip|3c7771c4026c2769c0d77675caa4a426d025e7403e6c911d51a3f36385c8f1a4|\r\n|dprint-loongarch64-unknown-linux-musl.zip|76aa022f97