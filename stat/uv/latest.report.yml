uploaded","size":102,"digest":"sha256:079214ae40c2484996a47d9a73b3d885d10275b72829f2efd85ae9b6a6ebee9e","download_count":1582,"created_at":"2026-11-17T09:57:53Z","updated_at":"2026-11-17T09:57:54Z"}],"body":"## Release Notes\n\nReleased on 2026-11-17.\n\n### Preview features\n\n- Support PEP 832 `.venv` redirect files for project environments ([#21822](https://github.com/astral-sh/uv/pull/21822))\n- Add the `http2-keep-alive` preview feature to close unresponsive HTTP/2 connections with active requests ([#23236](https://github.com/astral-sh/uv/pull/23236))\n\n### Performance\n\n- Reduce lockfile size and speed up reads by factoring repeated conditions in environment markers ([#23184](https://github.com/astral-sh/uv/pull/23184))\n\n### Bug fixes\n\n- Reject wheels advertised by an index under a different package name ([#23261](https://github.com/astral-sh/uv/pull/23261))\n- Fix `uv lock --locked` rejecting lockfiles with equivalent platform markers written in different forms ([#23185](https://github.com/astral-sh/uv/pull/23185))\n- Correctly quote environment marker values that contain apostrophes ([#23185](https://github.com/astral-sh/uv/pull/23185))\n- Report which musl interpreter failed to return a readable version ([#23213](https://github.com/astral-sh/uv/pull/23213))\n\n### Other changes\n\n- Raise the minimum supported Rust version to 1.98 ([#23263](https://github.com/astral-sh/uv/pull/23263))\n\n## Install uv 0.13.9\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-installer.ps1 | iex\"\n```\n\n## Download uv 0.13.9\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [uv-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-aarch64-apple-darwin.tar.gz.sha256) |\n| [uv-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-x86_64-apple-darwin.tar.gz.sha256) |\n| [uv-aarch64-pc-windows-msvc.zip](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-aarch64-pc-windows-msvc.zip.sha256) |\n| [uv-i686-pc-windows-msvc.zip](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-i686-pc-windows-msvc.zip.sha256) |\n| [uv-x86_64-pc-windows-msvc.zip](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-x86_64-pc-windows-msvc.zip.sha256) |\n| [uv-aarch64-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-aarch64-unknown-linux-gnu.tar.gz) | ARM64 Linux | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [uv-i686-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-i686-unknown-linux-gnu.tar.gz) | x86 Linux | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-i686-unknown-linux-gnu.tar.gz.sha256) |\n| [uv-powerpc64le-unknown-linux-gnu.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.13.9/uv-powerpc64le-unknown-linux-gnu.tar.gz) | PPC64LE Linux | [checksum](https://releases.astral.sh/github/uv/releases/download/0.13.