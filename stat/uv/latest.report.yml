"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":102,"digest":"sha256:21b4d437f4a4c780c361abb636e9fd1922a3e4a9545773210d6835df85545935","download_count":275,"created_at":"2026-09-10T19:27:22Z","updated_at":"2026-09-10T19:27:22Z"}],"body":"## Release Notes\n\nReleased on 2026-09-10.\n\n### Python\n\n- Add GraalPy 3.13.0 ([#21431](https://github.com/astral-sh/uv/pull/21431))\n\n### Enhancements\n\n- Verify hashes when downloading PEP 658 metadata sidecars ([#21563](https://github.com/astral-sh/uv/pull/21563))\n\n### Preview features\n\n- Respect `ty` exclusions when `uv check` automatically selects members of a virtual workspace ([#21555](https://github.com/astral-sh/uv/pull/21555))\n\n### Performance\n\n- Avoid full wheel downloads during resolution by reusing supported hashes from direct URL fragments when metadata is available separately ([#21279](https://github.com/astral-sh/uv/pull/21279))\n\n### Bug fixes\n\n- Edit Windows entry-point launcher resources in memory to support Nano Server and reduce antivirus contention ([#18713](https://github.com/astral-sh/uv/pull/18713))\n- Prefer `core-metadata` over legacy aliases in JSON index responses ([#21563](https://github.com/astral-sh/uv/pull/21563))\n\n## Install uv 0.12.13\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/uv/releases/download/0.12.13/uv-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/uv/releases/download/0.12.13/uv-installer.ps1 | iex\"\n```\n\n## Download uv 0.12.13\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [uv-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.12.13/uv-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/uv