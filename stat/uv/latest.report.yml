ated_at":"2026-09-15T02:19:28Z","updated_at":"2026-09-15T02:19:28Z"},{"id":564686594,"node_id":"RA_kwDOKbIFZc4hqG8C","name":"uv-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"astral-releases-bot[bot]","id":328004183,"node_id":"BOT_kgDOE4zyVw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":19355592,"digest":"sha256:18ef5c3888ae59828cb13f38d57e9389b8173ecc719eff163bfafc74b38f5936","download_count":305560,"created_at":"2026-09-15T02:19:28Z","updated_at":"2026-09-15T02:19:29Z"},{"id":564686597,"node_id":"RA_kwDOKbIFZc4hqG8F","name":"uv-x86_64-unknown-linux-gnu.tar.gz.sha256","label":"","uploader":{"login":"astral-releases-bot[bot]","id":328004183,"node_id":"BOT_kgDOE4zyVw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":101,"digest":"sha256:90023404825025b5ff73abc8274cf11b038f458e5d8c13459505b863ad3d11de","download_count":202,"created_at":"2026-09-15T02:19:28Z","updated_at":"2026-09-15T02:19:28Z"},{"id":564686600,"node_id":"RA_kwDOKbIFZc4hqG8I","name":"uv-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"astral-releases-bot[bot]","id":328004183,"node_id":"BOT_kgDOE4zyVw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22189054,"digest":"sha256:df163630683e5a2106d3320e2a448fde8eda5e7b9b47f617c5c332769728e735","download_count":558,"created_at":"2026-09-15T02:19:28Z","updated_at":"2026-09-15T02:19:29Z"},{"id":564686602,"node_id":"RA_kwDOKbIFZc4hqG8K","name":"uv-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"astral-releases-bot[bot]","id":328004183,"node_id":"BOT_kgDOE4zyVw","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":102,"digest":"sha256:bd62645abf0f5f16abd6ef8025d4daf3f842e407622d7a63a69d9629859923ec","download_count":82,"created_at":"2026-09-15T02:19:28Z","updated_at":"2026-09-15T02:19:29Z"}],"body":"## Release Notes\n\nReleased on 2026-09-15.\n\nPackage-operation errors now use uv's standard diagnostics, with consistent hints and compact, labeled cause chains. ([#17110](https://github.com/astral-sh/uv/pull/17110), [#21599](https://github.com/astral-sh/uv/pull/21599), [#21603](https://github.com/astral-sh/uv/pull/21603))\n\nPackage-operation exit codes now reflect the underlying cause: expected failures return 1, while recognized operational and internal failures return 2. ([#17110](https://github.com/astral-sh/uv/pull/17110))\n\n### Enhancements\n\n- Resume interrupted downloads with HTTP Range requests when supported ([#21570](https://github.com/astral-sh/uv/pull/21570))\n- Show underlying causes and hints in user warnings ([#21565](https://github.com/astral-sh/uv/pull/21565))\n- Show resolver hints for failed `uv tool upgrade` operations ([#21566](https://github.com/astral-sh/uv/pull/21566))\n\n### Preview features\n\n- Export multiple dependency selections from a shared lockfile in one `uv export --batch` invocation with the `batch-export` preview feature ([#21618](https://github.com/astral-sh/uv/pull/21618))\n\n### Performance\n\n- Speed up dependency resolution from local wheelhouses by reading wheel metadata in a single blocking task ([#21619](https://github.com/astral-sh/uv/pull/21619))\n- Speed up cold resolution against large package indexes by parsing Simple API responses in bounded background workers ([#21593](https://github.com/astral-sh/uv/pull/21593))\n- Speed up warm-cache resolution by decoding fresh HTTP cache entries in the cache-read task ([#21621](https://github.com/astral-sh/uv/pull/21621))\n\n### Bug fixes\n\n- Select releases that satisfy `required-environments` within each resolver fork instead of combining incompatible wheel coverage across forks ([#21672](https://github.com/astral-sh/uv/pull/21672))\n- Install packages with paths longer than `MAX_PATH` on Windows systems without long-path support enabled ([#21625](https://github.com/astral-sh/uv/pull/21625))\n- Prevent `uv python install` from overwriting valid unmanaged Python symlinks with relative targets on Unix ([#21639](https://github.com/astral-sh/uv/pull/21639))\n- Redact credentials and signatures from missing-path-segment URL errors ([#21616](https://github.com/astral-sh/uv/pull/21616))\n- Avoid exceeding the configured retry budget when cached HTTP responses fail revalidation ([#21640](https://github.com/astral-sh/uv/pull/21640))\n- Prefer `bin/python` over `bin/python3` when discovering interpreters in Unix environments ([#21559](https://github.com/astral-sh/uv/pull/21559))\n- Suppress managed-Python fallback warnings under `--quiet` ([#21565](https://github.com/astral-sh/uv/pull/21565))\n- Keep failed `uv tool upgrade` errors visible with `-q` while suppressing them with `-qq` ([#21566](https://github.com/astral-sh/uv/pull/21566))\n\n## Install uv 0.12.14\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://releases.astral.sh/github/uv/releases/download/0.12.14/uv-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://releases.astral.sh/github/uv/releases/download/0.12.14/uv-installer.ps1 | iex\"\n```\n\n## Download uv 0.12.14\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [uv-aarch64-apple-darwin.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.12.14/uv-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://releases.astral.sh/github/uv/releases/download/0.12.14/uv-aarch64-apple-darwin.tar.gz.sha256) |\n| [uv-x86_64-apple-darwin.tar.gz](https://releases.astral.sh/github/uv/releases/download/0.12.14/uv-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://releases.astral.sh