9624916ed4fc6f0","download_count":0,"created_at":"2026-10-02T05:45:16Z","updated_at":"2026-10-02T05:45:17Z"},{"id":604958573,"node_id":"RA_kwDODWfT1M4kDu9t","name":"WasmEdge-plugin-wasm_bpf-0.17.2-manylinux_2_28_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":284247,"digest":"sha256:5ef3df6e3eabb785fc90940ab71d0d05d6a97d1cc0c045f0a0367024db468b4e","download_count":0,"created_at":"2026-10-02T06:16:45Z","updated_at":"2026-10-02T06:16:45Z"},{"id":604912488,"node_id":"RA_kwDODWfT1M4kDjto","name":"WasmEdge-plugin-wasm_bpf-0.17.2-ubuntu20.04_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":279429,"digest":"sha256:58e886716334e67eb44fafd677f54e9058afdf4e41f8899d59c0dd29c54df7ac","download_count":0,"created_at":"2026-10-02T05:47:16Z","updated_at":"2026-10-02T05:47:16Z"}],"body":"### 0.17.2 (2026-10-02)\r\n\r\nFeatures:\r\n\r\n* [CMake]\r\n  * Used the system blake3 library when it is available, and fell back to the vendored copy otherwise. (#5339)\r\n    * Set `-DCMAKE_DISABLE_FIND_PACKAGE_blake3=ON` to force the vendored copy.\r\n* [WASI-NN]\r\n  * Upgraded the llama.cpp dependency of the GGML backend to v0.4.1. (#5188, #5356)\r\n    * Added the `load-mode` metadata (`auto`, `none`, `mmap`, `mlock`, `mmap+mlock`, or `dio`), and mapped the legacy `use-mmap` and `use-mlock` metadata onto it.\r\n\r\nFixed issues:\r\n\r\n* [Loader]\r\n  * Loaded the native shared-library WASM only in the AOT run mode. (#5292)\r\n  * Bound-checked the symbol offsets of the AOT custom sections. (#5255)\r\n  * Checked the size bound before allocating the read buffer, so that a crafted length no longer allocates gigabytes before the loading fails. (#5325)\r\n* [Validator]\r\n  * Checked the declarations of every member of a recursive type before matching the sub types against their super types, which overflowed the stack on the cyclic super types. (#5389)\r\n* [Executor]\r\n  * Erased the exception payload on `catch_all` and `catch_all_ref` in the interpreter. (#5202)\r\n  * Dropped the stale `try_table` handlers at branch time, which caused an out-of-bounds write. (#5252)\r\n  * Corrected the `return_call` continuation of the tail calls into the host functions. (#5286)\r\n  * Typed the null values of the abstract reference type locals with the bottom type, which corrected `ref.test` and `ref.cast` on them against the nullable concrete types. (#5347)\r\n  * Trapped with the new `CallStackExhausted` error (`0x041B`) when the interpreter stack exceeds 8 MiB, instead of growing until the process runs out of memory. (#5377)\r\n* [AOT]\r\n  * Bound-checked the memory64 loads and stores. (#5282)\r\n* [LLVM]\r\n  * Mapped the `Os` and `Oz` optimization levels to `O2` with the size attributes on LLVM 23, whose default pass pipeline no longer supports them. (#5328)\r\n  * Kept the temporary values of the runtime calls in the entry block, so that the GC instructions, the `call_indirect` and `call_ref` fallbacks, and the `i8x16.swizzle` fallback in a loop no longer exhaust the native stack in the AOT and JIT modes. (#5379)\r\n* [Component Model]\r\n  * Grew the component index space on the exports to match the validator. (#5256)\r\n* [WASI]\r\n  * Copied the whole IPv6 address in `sock_connect` on Windows, which copied only the first 4 bytes. (#4860)\r\n  * Enforced the read-only preopen rights, and attenuated the rights of the child descriptors to the ones that their parent can pass on. (#5340)\r\n  * Validated the guest output buffer bounds of `sock_getaddrinfo` before writing the resolver results. (#5344)\r\n  * Skipped `epoll_wait` in `poll_oneoff` on Linux when no event is subscribed. (#5364)\r\n  * Corrected the `poll_oneoff` timeouts and the `select` error handling on Windows. (#5365)\r\n  * Mapped the Windows socket and `getaddrinfo` errors to the matching WASI error codes, so that the refused, reset, and timed-out connections are no longer reported as `ENOSYS`, and read a zero `SO_ERROR` as success. (#5373, #5392)\r\n* [WASI-NN]\r\n  * Validated the metadata of the GGML and BitNet backends, and rejected the values which overflow the fixed-size buffers or make llama.cpp throw or abort, such as `tensor-split`, `batch-size`, `ubatch-size`, `n-cpu-moe`, `cache-type-k`, `cache-type-v`, `pooling-type`, `mirostat`, `threads`, and `threads-batch`. (#4916, #5356)\r\n  * Applied the metadata atomically in the GGML and BitNet backends, so that a rejected option rolls back the whole metadata object. (#4916, #5356)\r\n  * Applied the `embd-normalize` metadata in the GGML and BitNet backends, and the load-time `threads-batch` metadata in the GGML backend, which had no effect before. (#4916, #5356)\r\n  * Rebuilt the MoE tensor overrides of the GGML backend on every metadata pass, so that the later `cpu-moe` and `n-cpu-moe` changes take effect. (#5356)\r\n  * Preserved the other load-mode flag when only one of the legacy `use-mmap` and `use-mlock` metadata is updated in the GGML backend. (#5188)\r\n  * Rejected the prompts which the tokenizer cannot decode with `InvalidArgument` in the GGML and BitNet backends, instead of terminating the process. (#4916)\r\n  * Replaced the hardcoded output size of the RPC `get_output` and `get_output_single` with the guest buffer size, which is bounded to 16 MiB. (#5031)\r\n  * Pinned the OpenVINO CPU inference precision to f32, so that the results no longer depend on the host CPU. (#5348)\r\n* [Plugin]\r\n  * Required OpenCV 5 for the `wasmedge_opencvmini` plug-in, and limited its CI and release builds to macOS arm64. (#5280)\r\n* [Common]\r\n  * Corrected the display strings and the comments in `enum.inc`. (#5241)\r\n* [Misc]\r\n  * Added the missing `PropComponent` in the driver fuzzer. (#5035)\r\n  * Made the sources compile as C++20. (#5338)\r\n\r\nCI:\r\n\r\n* Moved the IWYU scan to LLVM 22 with IWYU 0.26. (#5335)\r\n* Bumped lineguard to 0.2.0, and corrected its ignore patterns. (#5336)\r\n* Upgraded the Debian static build to Bookworm. (#5333)\r\n* Covered the system blake3 path in the Debian Testing job. (#5339)\r\n* Gated the macOS test step on the matrix `tests` flag, so that the release builds without the tests no longer run `ctest`. (#5353)\r\n* [dependabot]\r\n  * ci(dependabot): bump github/codeql-action from 4.36.2 to 4.38.2 (#5127, #5130, #5155, #5156, #5190, #5193, #5219, #5220, #5249, #5251, #5273, #5274, #5289, #5291, #5307, #5308, #5321, #5322, #5351, #5352, #5367, #5369, #5384, #5385)\r\n  * ci(dependabot): bump step-security/harden-runner from 2.19.4 to 2.21.1 (#5157, #5275, #5290, #5334)\r\n  * ci(dependabot): bump cachix/install-nix-action from 31.10.6 to 31.11.1 (#5158, #5191, #5288)\r\n  * ci(dependabot): bump dorny/paths-filter from 4.0.1 to 4.0.3 (#5129, #5272)\r\n  * ci(dependabot): bump actions/labeler from 6.1.0 to 7.0.0 (#5154, #5221)\r\n  * ci(dependabot): bump docker/login-action from 4.4.0 to 4.6.0 (#5217, #5247)\r\n  * ci(dependabot): bump docker/setup-buildx-action from 4.2.0 to 4.3.0 (#5306)\r\n  * ci(dependabot): bump actions/checkout from 7.0.0 to 7.0.1 (#5218)\r\n  * ci(dependabot): bump actions/setup-python from 6.3.0 to 7.0.0 (#5192)\r\n  * ci(dependabot): bump codecov/codecov-action from 7.0.0 to 7.1.1 (#5370)\r\n  * ci(dependabot): bump vedantmgoyal9/winget-releaser from 7bd472b to a8fff44 (#5248, #5368)\r\n  * ci(dependabot): bump the docker group with 3 updates (#5126, #5366)\r\n\r\nThank all the contributors who made this release possible!\r\n\r\nAbdelrahman Emad, Anusha Murthy, Arthur Chan, Lia, Manar Elhabbal, Shen-Ta Hsieh(BestSteve), Yi-Ying He, hydai\r\n\r\nIf you want to build from source, please use WasmEdge-0.17.2-src.tar.gz instead of the zip or tarball provided by GitHub directly.\r\n"}
