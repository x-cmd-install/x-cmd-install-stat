{"id":401306776,"author":{"login":"manzt","id":24403730,"node_id":"MDQ6VXNlcjI0NDAzNzMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKHF8zM4X63SY","tag_name":"0.25.1","target_commitish":"main","name":"0.25.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-01T20:57:15Z","updated_at":"2026-10-01T21:17:52Z","published_at":"2026-10-01T21:17:52Z","assets":[],"body":"## \u2728 Enhancements\r\n* Make local agent pairing easier to discover (#10946)\r\n* Update LLM model catalog (#11002)\r\n* Add `expand_outputs` as an argument to `ctx.edit_cell` and `ctx.create_cell` (#10974)\r\n* Record cache entries in a per-notebook manifest (#10838)\r\n* Marimo `cache size` (#10837)\r\n* Marimo `cache dir` (#10836)\r\n\r\n## \ud83d\udc1b Bug fixes\r\n* Keep getpass responses out of saved console output (#11043)\r\n* Reject invalid code mode cell names (#11032)\r\n* Align and unshrink mo.ui.radio button when option label wraps (#11031)\r\n* Harden sandbox environment selection (#11026)\r\n* Send origin referrer on cross-origin requests from notebook pages (#11015)\r\n* Keep sandbox package managers fixed in install alerts (#10983)\r\n* Render dotted chart columns when data falls back to CSV (#10856)\r\n* Fix plotly hover text rendering issue (#10988)\r\n* Avoid repeated Docker prompt for sandboxed URL edits (#10984)\r\n* Make the kernel SIGINT handler reentrancy-safe (#10975)\r\n* Secure language server websocket listeners (#10979)\r\n* Change tokenization to allow trailing comments (#10981)\r\n* UI fix for SFTP (and a fsspec plugin for ssh) (#10977)\r\n* Ensure partial cell config update preserves existing values (#10971)\r\n\r\n## \ud83d\udcda Documentation\r\n* Add huggingface/drive to remote storage (#10959)\r\n* Normalize styles from katex bump (#10995)\r\n* Add Whisper sandbox example (#10994)\r\n* Fix quickstart anchors in Spanish and Chinese READMEs (#10989)\r\n* Security clarification on pyproject.toml (#10986)\r\n* Add ffmpeg pixi example for blog post (#10993)\r\n\r\n## \ud83d\udcdd Other changes\r\n* Fix suboptimal assignment in cell-matching Hungarian algorithm (#10654) (f15c5ff)\r\n\r\n## Contributors\r\nThanks to all our community and contributors who made this release possible: @dmadisetti, @kirangadhave, @koaning, @Light2Dark, @manzt, @marthacryan, @mscolnick, @peter-gy, @sadov, @ZainnQureshii\r\n\r\n**Full Changelog**: https://github.com/marimo-team/marimo/compare/0.25.0...0.25.1","reactions":{"total_count":17,"+1":7,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":4,"rocket":2,"eyes":0},"mentions_count":10}
