{"id":417621462,"author":{"login":"manzt","id":24403730,"node_id":"MDQ6VXNlcjI0NDAzNzMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKHF8zM4Y5GXW","tag_name":"0.25.2","target_commitish":"main","name":"0.25.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-19T20:06:20Z","updated_at":"2026-10-19T20:14:12Z","published_at":"2026-10-19T20:13:24Z","assets":[],"body":"This release focuses on bug fixes and adds support for Python 3.15 as well as GeoJSON and GeoParquet downloads for geographic data.\r\n\r\n## \u2b50\ufe0f Highlights\r\n\r\n### Python 3.15 support\r\n\r\nmarimo now supports Python 3.15! Create and run reactive notebooks with the latest Python release. [#11128](https://github.com/marimo-team/marimo/pull/11128)\r\n\r\n<p align=\"center\">\r\n\r\n<img width=\"750\" alt=\"image\" src=\"https://github.com/user-attachments/assets/5601c7e6-17c3-4f22-9d87-747cf4dfea7c\" />\r\n\r\n</p>\r\n\r\n### Export geographic data\r\n\r\nGeospatial dataframes (GeoPandas, Arrow, and DuckDB geometry) can now be downloaded as GeoJSON or GeoParquet, alongside the existing CSV, JSON, and Parquet options. Also works with `mo.ui.table` and `mo.ui.dataframe`.\r\n\r\n\r\n<p align=\"center\">\r\n\r\n<img width=\"750\" alt=\"image\" src=\"https://github.com/user-attachments/assets/89680697-6928-4c01-af4c-23d15ea1e1fa\" />\r\n\r\n</p>\r\n\r\n## \ud83d\udea8 Breaking changes\r\n\r\nmarimo previously attempted to switch matplotlib, Plotly, Bokeh, and HoloViews to a dark theme when the notebook was dark, but the results were often unexpected, especially in saved figures. Plots now use the plotting library\u2019s own settings. If you want dark plots, please set the theme explicitly in your notebook. ([#11147](https://github.com/marimo-team/marimo/pull/11147))\r\n\r\n## \u2728 Enhancements\r\n\r\n* Add support for Python 3.15. [#11128](https://github.com/marimo-team/marimo/pull/11128)\r\n* Add **Expand all outputs** and **Clamp all outputs** actions. ([#11045](https://github.com/marimo-team/marimo/pull/11045))\r\n* Navigate directories with breadcrumbs in `mo.ui.file_browser`. ([#11044](https://github.com/marimo-team/marimo/pull/11044))\r\n* Show consistent startup progress for regular notebooks and sandboxes. ([#11085](https://github.com/marimo-team/marimo/pull/11085))\r\n* Build offline WebAssembly exports using Pyodide and PyPI package mirrors. ([#11017](https://github.com/marimo-team/marimo/pull/11017))\r\n* Add GeoJSON and GeoParquet exports for geographic tables and dataframes. ([#11063](https://github.com/marimo-team/marimo/pull/11063), [#11116](https://github.com/marimo-team/marimo/pull/11116), [#11129](https://github.com/marimo-team/marimo/pull/11129), [#11169](https://github.com/marimo-team/marimo/pull/11169))\r\n* Improve Python highlighting inside Markdown LaTeX. ([#11281](https://github.com/marimo-team/marimo/pull/11281))\r\n* Update the LLM model catalog. ([#11100](https://github.com/marimo-team/marimo/pull/11100), [#11183](https://github.com/marimo-team/marimo/pull/11183))\r\n\r\n## \ud83d\udc1b Bug fixes\r\n\r\n* Keep exact `mo.ui.number` values instead of rounding them to the step size. ([#11287](https://github.com/marimo-team/marimo/pull/11287))\r\n* Accept datetime inputs in date widgets. ([#11289](https://github.com/marimo-team/marimo/pull/11289))\r\n* Select the first dropdown option when `allow_select_none=False` and no value is supplied. ([#11238](https://github.com/marimo-team/marimo/pull/11238))\r\n* Preserve all rows when sorting tables with unequal-length columns. ([#11197](https://github.com/marimo-team/marimo/pull/11197))\r\n* Preserve dates when grouping table charts by hour. ([#11078](https://github.com/marimo-team/marimo/pull/11078))\r\n* Export complete geometry text. ([#11012](https://github.com/marimo-team/marimo/pull/11012))\r\n* Restore Polars text-to-date/time conversion and preserve empty rows when exploding columns. ([#11135](https://github.com/marimo-team/marimo/pull/11135), [#11158](https://github.com/marimo-team/marimo/pull/11158))\r\n* Retry SQLAlchemy schema inference when Polars conversion fails. ([#11282](https://github.com/marimo-team/marimo/pull/11282))\r\n* Correct SQL error locations around Unicode and multiline interpolations, and preserve definitions around comments. ([#11151](https://github.com/marimo-team/marimo/pull/11151), [#11159](https://github.com/marimo-team/marimo/pull/11159), [#11187](https://github.com/marimo-team/marimo/pull/11187), [#11224](https://github.com/marimo-team/marimo/pull/11224), [#11137](https://github.com/marimo-team/marimo/pull/11137))\r\n* Use current, unexecuted editor text for language-server completion and diagnostics. ([#11186](https://github.com/marimo-team/marimo/pull/11186))\r\n* Improve inline completion responsiveness. ([#11288](https://github.com/marimo-team/marimo/pull/11288))\r\n* Run pending dependencies when an agent edits and runs cells, and preserve edited source on subsequent runs. ([#11115](https://github.com/marimo-team/marimo/pull/11115), [#11121](https://github.com/marimo-team/marimo/pull/11121))\r\n* Attach screenshots to the active notebook session and preserve child-cell traceback context. ([#11049](https://github.com/marimo-team/marimo/pull/11049), [#11035](https://github.com/marimo-team/marimo/pull/11035))\r\n* Allow deletion of old chat history and require pydantic-ai 2.34.0 for reasoning history. ([#11249](https://github.com/marimo-team/marimo/pull/11249), [#11153](https://github.com/marimo-team/marimo/pull/11153))\r\n* Let AI chat inspect captured screenshots as images. ([#11107](https://github.com/marimo-team/marimo/pull/11107))\r\n* Preserve optional chat and plugin fields after the Zod upgrade. ([#11114](https://github.com/marimo-team/marimo/pull/11114))\r\n* Keep version constraints when installing WebAssembly notebook dependencies and skip lockfile pins for offline exports. ([#10871](https://github.com/marimo-team/marimo/pull/10871), [#11104](https://github.com/marimo-team/marimo/pull/11104))\r\n* Load Loro's WebAssembly module asynchronously in production builds. ([#11117](https://github.com/marimo-team/marimo/pull/11117))\r\n* Avoid marking cells stale again after they reran during a module reload. ([#10912](https://github.com/marimo-team/marimo/pull/10912))\r\n* Fix persistent-cache hashing for PyArrow values with non-numeric columns. ([#11084](https://github.com/marimo-team/marimo/pull/11084))\r\n* Accept `pathlib.Path` in `mo.audio` and `mo.video`; avoid division by zero for silent audio. ([#11262](https://github.com/marimo-team/marimo/pull/11262), [#11101](https://github.com/marimo-team/marimo/pull/11101))\r\n* Improve accessible labels for text inputs, sliders, date widgets, and table pagination. ([#11149](https://github.com/marimo-team/marimo/pull/11149), [#11231](https://github.com/marimo-team/marimo/pull/11231), [#11067](https://github.com/marimo-team/marimo/pull/11067), [#11134](https://github.com/marimo-team/marimo/pull/11134))\r\n* Preserve stylesheet base URLs in shadow roots and underscores in docstring code spans. ([#10746](https://github.com/marimo-team/marimo/pull/10746), [#11285](https://github.com/marimo-team/marimo/pull/11285))\r\n* Fix `marimo check --strict --format json` and CLI output with non-encodable characters. ([#11076](https://github.com/marimo-team/marimo/pull/11076), [#11079](https://github.com/marimo-team/marimo/pull/11079))\r\n* Preserve typed console input when pressing Enter. ([#11047](https://github.com/marimo-team/marimo/pull/11047))\r\n* Fix schema generation losing branded identifiers inside lists on Python 3.10. [#11320](https://github.com/marimo-team/marimo/pull/11320)\r\n\r\n## \ud83d\udcda Documentation\r\n\r\n* Sync the Simplified Chinese, Japanese, and Spanish READMEs with English. ([#11230](https://github.com/marimo-team/marimo/pull/11230))\r\n* Refresh documentation screenshots and recordings. ([#11284](https://github.com/marimo-team/marimo/pull/11284))\r\n* Remove an unused parameter from the completion docstring. ([#10896](https://github.com/marimo-team/marimo/pull/10896))\r\n\r\n## \ud83d\udd2c Preview features\r\n\r\n* Keep `marimo pair` connected to notebook across browser reloads. ([#11013](https://github.com/marimo-team/marimo/pull/11013))\r\n* Gate host integration behind `MARIMO_ENABLE_HOST` ([#11302](https://github.com/marimo-team/marimo/pull/11302))\r\n* Add `version` to documents and cells ([#11317](https://github.com/marimo-team/marimo/pull/11317))\r\n* Make the document a value and the notebook its owner ([#11293](https://github.com/marimo-team/marimo/pull/11293))\r\n* Remove execution policy from host document state ([#11292](https://github.com/marimo-team/marimo/pull/11292))\r\n* Save notebook documents through the host ([#11265](https://github.com/marimo-team/marimo/pull/11265))\r\n* Edit notebook documents through the host ([#11264](https://github.com/marimo-team/marimo/pull/11264))\r\n* Apply conditional edits to notebook documents ([#11263](https://github.com/marimo-team/marimo/pull/11263))\r\n* Derive whether a result is current from the host stream ([#11277](https://github.com/marimo-team/marimo/pull/11277))\r\n* Publish a document's analysis as it becomes available ([#11256](https://github.com/marimo-team/marimo/pull/11256))\r\n* Name a document's notebook with `notebook_id` ([#11255](https://github.com/marimo-team/marimo/pull/11255))\r\n* Keep execution policy out of document state ([#11252](https://github.com/marimo-team/marimo/pull/11252))\r\n* Serve a notebook's document from `marimo edit` without a kernel ([#11217](https://github.com/marimo-team/marimo/pull/11217))\r\n* Give notebooks a sink instead of a private stream ([#11243](https://github.com/marimo-team/marimo/pull/11243))\r\n* Keep current results on the notebook and run history on the host ([#11235](https://github.com/marimo-team/marimo/pull/11235))\r\n* Misc host protocol fixes ([#11222](https://github.com/marimo-team/marimo/pull/11222))\r\n* Identify host attachments and emit unstable events ([#11213](https://github.com/marimo-team/marimo/pull/11213))\r\n* Apply runtime reports only to the runtime they name ([#11206](https://github.com/marimo-team/marimo/pull/11206))\r\n* Define custom notebook events in the host protocol ([#11215](https://github.com/marimo-team/marimo/pull/11215))\r\n* Model client identity on host attachments ([#11214](https://github.com/marimo-team/marimo/pull/11214))\r\n* Deliver a command's events after its backend call ([#11205](https://github.com/marimo-team/marimo/pull/11205))\r\n* Expire completed host request receipts ([#11189](https://github.com/marimo-team/marimo/pull/11189))\r\n* Retain host results by execution lifetime ([#11188](https://github.com/marimo-team/marimo/pull/11188))\r\n* Serve the host protocol from `marimo edit` ([#11180](https://github.com/marimo-team/marimo/pull/11180))\r\n* Add `marimo._core`, a model of a host's notebooks and runtimes ([#11179](https://github.com/marimo-team/marimo/pull/11179))\r\n* Allow secondary consumers during session startup ([#11178](https://github.com/marimo-team/marimo/pull/11178))\r\n\r\n## \ud83d\udcdd Other changes\r\n\r\n* Update frontend dependencies, including React Aria, Radix, CodeMirror, and DOMPurify. ([#11047](https://github.com/marimo-team/marimo/pull/11047), [#10549](https://github.com/marimo-team/marimo/pull/10549), [#10325](https://github.com/marimo-team/marimo/pull/10325), [#11133](https://github.com/marimo-team/marimo/pull/11133), [#11061](https://github.com/marimo-team/marimo/pull/11061))\r\n* Remove matplotlib and NumPy version pins from the plots tutorial. ([#11156](https://github.com/marimo-team/marimo/pull/11156))\r\n\r\n## Contributors\r\n\r\nThanks to all our community and contributors who made this release possible: @akshayka, @almazafa, @cdeil, @darshjoshi, @DG47, @dmadisetti, @kirangadhave, @lcnbr, @Light2Dark, @ljchang, @manzt, @marthacryan, @mohansree14, @mscolnick, @namupta-max, @NiklasvonM, @peter-gy, @rajveer3x, @Sealdot, @tkuhemiya, @Yaqoubj, @yuee3, @Ziwen-Lii\r\n\r\nSpecial thanks to our first time contributors!\r\n- @almazafa\r\n- @cdeil\r\n- @darshjoshi\r\n- @DG47\r\n- @lcnbr\r\n- @mohansree14\r\n- @namupta-max\r\n- @NiklasvonM\r\n- @rajveer3x\r\n- @Sealdot\r\n- @tkuhemiya\r\n- @Yaqoubj\r\n- @yuee3\r\n- @Ziwen-Lii\r\n\r\n**Full Changelog**: https://github.com/marimo-team/marimo/compare/0.25.1...0.25.2","reactions":{"total_count":8,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":3,"eyes":0},"mentions_count":23}
