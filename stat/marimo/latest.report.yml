{"id":395049520,"author":{"login":"manzt","id":24403730,"node_id":"MDQ6VXNlcjI0NDAzNzMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKHF8zM4Xi_ow","tag_name":"0.25.0","target_commitish":"main","name":"0.25.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-23T21:44:15Z","updated_at":"2026-09-23T22:07:09Z","published_at":"2026-09-23T21:57:18Z","assets":[],"body":"This release reworks sandboxing to improve correctness, recovery, and consistency, and adds [Pixi](https://pixi.prefix.dev/latest/) as a new sandbox backend.\r\n\r\n**We expect most users to be able to upgrade without making changes.** Existing sandbox commands continue to work, but the underlying environment lifecycle has changed substantially and could affect some workflows.\r\n\r\nThis release also adds portable WebAssembly exports, persistent expanded outputs, and many fixes across the editor and runtime.\r\n\r\n## \u2b50\ufe0f Highlights\r\n\r\n\r\n### Pixi-powered notebook sandboxes\r\n\r\nmarimo sandboxes now support [Pixi](https://pixi.prefix.dev/), bringing Conda packages, native libraries, and non-Python runtimes into notebook environments.\r\n\r\n[uv](https://docs.astral.sh/uv/) remains the default; use `--sandbox=pixi` to opt in.\r\n\r\n```sh\r\n# uv remains the default\r\nuvx marimo edit --sandbox notebook.py\r\n\r\n# Use Pixi\r\npixi exec marimo edit --sandbox=pixi notebook.py\r\n```\r\n\r\nPixi-backed notebooks can combine packages from PyPI and Conda in the notebook\u2019s inline configuration:\r\n\r\n```py\r\n# /// script\r\n# dependencies = [\"marimo\"]\r\n#\r\n# [tool.pixi.workspace]\r\n# channels = [\"conda-forge\"]\r\n#\r\n# [tool.pixi.dependencies]\r\n# r-base = \"*\"\r\n# rpy2 = \"*\"\r\n# ///\r\n```\r\n\r\nFor example, this configuration carries everything needed to use R from Python.  [Learn more about Pixi sandboxes](https://docs.marimo.io/guides/package_management/sandboxes/#pixi-sandboxes).\r\n\r\n### A revamped sandbox lifecycle\r\n\r\nAs part of the new sandbox architecture, the marimo editor now starts separately from notebook kernels. Sandboxed notebooks open faster because the editor no longer waits for uv or Pixi to prepare the environment and start the kernel.\r\n\r\nThe [Packages panel](https://docs.marimo.io/guides/package_management/) shows that work as it happens. If setup fails, you can now _edit_ the notebook manifest and retry without restarting marimo.\r\n\r\n<p align=\"center\">\r\n<img width=\"700\" alt=\"sandbox-recovery\" src=\"https://github.com/user-attachments/assets/84370f95-2074-4bce-9963-ab8eccd428f3\" />\r\n</p>\r\n\r\n[Read the sandbox guide](https://docs.marimo.io/guides/package_management/sandboxes/) to learn more.\r\n\r\n### Keep cell outputs expanded\r\n\r\nOne of our most-requested features is here: expanded cell outputs can now be saved as part of the notebook.\r\n\r\nWhen you select **Expand Cell Output**, marimo records the preference on the cell:\r\n\r\n```py\r\n@app.cell(expand_output=True)\r\ndef _():\r\n    ...\r\n```\r\n\r\nThe output remains expanded when you reopen or share the notebook. Selecting **Clamp Cell Output** restores the default behavior.\r\n\r\nThis was also one of the first contributions from our newest team member, @marthacryan!\r\n\r\n\r\n### Portable WebAssembly exports\r\n\r\nInteractive **WebAssembly notebooks can now be exported as a single HTML file** that opens directly in a browser, or as a self-contained bundle for serving without an internet connection:\r\n\r\n```bash\r\nmarimo export html-wasm notebook.py --single-file -o notebook.html\r\nmarimo export html-wasm notebook.py --offline -o dist/\r\n```\r\n\r\n[Read the WebAssembly export guide](https://docs.marimo.io/guides/exporting/webassembly_html/).\r\n\r\n\r\n## \u2728 Enhancements\r\n\r\n* Rebuild sandbox execution around one environment per notebook ([#10728](https://github.com/marimo-team/marimo/pull/10728))\r\n* Run notebook sandboxes with Pixi ([#10697](https://github.com/marimo-team/marimo/pull/10697))\r\n* Show sandbox context in the Packages panel ([#10729](https://github.com/marimo-team/marimo/pull/10729))\r\n* Unify sandbox execution and asynchronous startup ([#10821](https://github.com/marimo-team/marimo/pull/10821))\r\n* Add sandbox startup and recovery UI ([#10822](https://github.com/marimo-team/marimo/pull/10822))\r\n* Keep sandbox setup separate from installed packages ([#10944](https://github.com/marimo-team/marimo/pull/10944))\r\n* Add `expand_output` cell decorator ([#10911](https://github.com/marimo-team/marimo/pull/10911))\r\n* Add Lens to the optional dependency dialog ([#10950](https://github.com/marimo-team/marimo/pull/10950))\r\n* Add Studio and Lens CLI tips ([#10873](https://github.com/marimo-team/marimo/pull/10873))\r\n* Create self-contained WebAssembly export bundles for offline use ([#10879](https://github.com/marimo-team/marimo/pull/10879))\r\n* Support single-file WebAssembly exports ([#10878](https://github.com/marimo-team/marimo/pull/10878))\r\n* Include marimo-lens in recommended dependencies ([#10897](https://github.com/marimo-team/marimo/pull/10897))\r\n* Open the issue-report modal from the error fallback ([#10875](https://github.com/marimo-team/marimo/pull/10875))\r\n* Replace the JSON viewer to remove MUI and Emotion ([#10865](https://github.com/marimo-team/marimo/pull/10865))\r\n* Automatically mount Lens when installed ([#10814](https://github.com/marimo-team/marimo/pull/10814))\r\n* Update the LLM model catalog ([#10828](https://github.com/marimo-team/marimo/pull/10828))\r\n* Allow accordion items to start expanded ([#10824](https://github.com/marimo-team/marimo/pull/10824))\r\n* Default new SQL cells to an available connection ([#10826](https://github.com/marimo-team/marimo/pull/10826))\r\n\r\n## \ud83d\udc1b Bug fixes\r\n\r\n* Recover the file browser after cached output resets ([#10862](https://github.com/marimo-team/marimo/pull/10862))\r\n* Improve missing-backend errors and sandbox startup cleanup ([#10954](https://github.com/marimo-team/marimo/pull/10954))\r\n* Refresh the FastAPI example ([#10945](https://github.com/marimo-team/marimo/pull/10945))\r\n* Disable thinking for inline autocomplete ([#10890](https://github.com/marimo-team/marimo/pull/10890))\r\n* Collapse all sections when nested heading ranges share an end cell ([#10923](https://github.com/marimo-team/marimo/pull/10923))\r\n* Wait for initialization before starting sessions ([#10927](https://github.com/marimo-team/marimo/pull/10927))\r\n* Preserve local images in HTML and PDF exports ([#10938](https://github.com/marimo-team/marimo/pull/10938))\r\n* Expand home directories in custom CSS paths ([#10829](https://github.com/marimo-team/marimo/pull/10829))\r\n* Strip quotes and whitespace from `%env` values in ipynb conversion ([#10904](https://github.com/marimo-team/marimo/pull/10904))\r\n* Preserve cell-toolbar keyboard activation ([#10827](https://github.com/marimo-team/marimo/pull/10827))\r\n* Selectively prune modules under pytest ([#10908](https://github.com/marimo-team/marimo/pull/10908))\r\n* Defer browser discovery until a cell uses `webbrowser` ([#10887](https://github.com/marimo-team/marimo/pull/10887))\r\n* Fix expanded output in `image_compare` ([#10907](https://github.com/marimo-team/marimo/pull/10907))\r\n* Send stable conversation headers to OpenCode Go ([#10895](https://github.com/marimo-team/marimo/pull/10895))\r\n* Stop sandbox export children reliably on termination ([#10891](https://github.com/marimo-team/marimo/pull/10891))\r\n* Count nulls correctly in boolean column statistics ([#10866](https://github.com/marimo-team/marimo/pull/10866))\r\n* Resolve notebook paths when running cells with pytest ([#10864](https://github.com/marimo-team/marimo/pull/10864))\r\n* Fall back to CSV for Altair charts without pyarrow ([#10855](https://github.com/marimo-team/marimo/pull/10855))\r\n* Render display math nested in list-item continuations ([#10785](https://github.com/marimo-team/marimo/pull/10785))\r\n* Prevent console crashes when input prompts are interrupted ([#10854](https://github.com/marimo-team/marimo/pull/10854))\r\n* Recover from prompt submission failures ([#10818](https://github.com/marimo-team/marimo/pull/10818))\r\n* Render multiline tooltips with normalized line endings ([#10850](https://github.com/marimo-team/marimo/pull/10850))\r\n* Support multiline text in `data-tooltip` attributes ([#10851](https://github.com/marimo-team/marimo/pull/10851))\r\n* Initialize terminal dimensions before shell startup ([#10830](https://github.com/marimo-team/marimo/pull/10830))\r\n* Truncate long column names in the columns menu ([#10831](https://github.com/marimo-team/marimo/pull/10831))\r\n* Run async notebooks from inside a running event loop ([#10505](https://github.com/marimo-team/marimo/pull/10505))\r\n* Fix Codex marimo pair skill detection ([#10671](https://github.com/marimo-team/marimo/pull/10671))\r\n* Run notebook sandboxes from uv script environments ([#10696](https://github.com/marimo-team/marimo/pull/10696))\r\n* Centralize uv and PEP 723 operations ([#10695](https://github.com/marimo-team/marimo/pull/10695))\r\n\r\n## \ud83d\udcda Documentation\r\n\r\n* Reframe package management docs around projects and sandboxes ([#10940](https://github.com/marimo-team/marimo/pull/10940))\r\n* Explain `.env` resolution when there is no `pyproject.toml` ([#10583](https://github.com/marimo-team/marimo/pull/10583))\r\n* Add more videos to the documentation ([#10623](https://github.com/marimo-team/marimo/pull/10623))\r\n* Stop the docs font size from scaling up on wide screens ([#10914](https://github.com/marimo-team/marimo/pull/10914))\r\n* Fix dependency installation in island payloads ([#10832](https://github.com/marimo-team/marimo/pull/10832))\r\n\r\n## \ud83d\udd2c Preview features\r\n\r\n* Add an agent-facing CLI for live notebook sessions ([#10777](https://github.com/marimo-team/marimo/pull/10777))\r\n* Add opt-in CLI prompts for agent pairing ([#10889](https://github.com/marimo-team/marimo/pull/10889))\r\n\r\n## \ud83d\udcdd Other changes\r\n\r\n* Surface when the workspace file scan is truncated ([#10550](https://github.com/marimo-team/marimo/pull/10550))\r\n* Allow Jedi 0.20.0 ([#10863](https://github.com/marimo-team/marimo/pull/10863))\r\n* Update pre-commit hooks ([#10707](https://github.com/marimo-team/marimo/pull/10707))\r\n* Update npm non-major dependencies ([#10714](https://github.com/marimo-team/marimo/pull/10714))\r\n\r\n## Contributors\r\n\r\nThanks to all our community and contributors who made this release possible: @akshayka, @atul2387, @boydgreenfield, @Chinmayrawat15, @cspipaon, @dangooddd, @DevPranjal, @dmadisetti, @julio4, @kirangadhave, @koaning, @Light2Dark, @manzt, @marthacryan, @mscolnick, @NoiceHax, @Oscar-Williams, @peter-gy, @phobson, @SergeyAxiomatic\r\n\r\nAnd especially to our new contributors:\r\n\r\n* @atul2387 made their first contribution in https://github.com/marimo-team/marimo/pull/10886\r\n* @boydgreenfield made their first contribution in https://github.com/marimo-team/marimo/pull/10866\r\n* @cspipaon made their first contribution in https://github.com/marimo-team/marimo/pull/10923\r\n* @dangooddd made their first contribution in https://github.com/marimo-team/marimo/pull/10829\r\n* @DevPranjal made their first contribution in https://github.com/marimo-team/marimo/pull/10583\r\n* @julio4 made their first contribution in https://github.com/marimo-team/marimo/pull/10818\r\n* @marthacryan made their first contribution in https://github.com/marimo-team/marimo/pull/10907\r\n* @NoiceHax made their first contribution in https://github.com/marimo-team/marimo/pull/10550\r\n* @Oscar-Williams made their first contribution in https://github.com/marimo-team/marimo/pull/10904\r\n* @phobson made their first contribution in https://github.com/marimo-team/marimo/pull/10945\r\n* @SergeyAxiomatic made their first contribution in https://github.com/marimo-team/marimo/pull/10785\r\n\r\n**Full Changelog**: https://github.com/marimo-team/marimo/compare/0.24.2...0.25.0\r\n","reactions":{"total_count":17,"+1":0,"-1":0,"laugh":0,"hooray":10,"confused":0,"heart":2,"rocket":5,"eyes":0},"mentions_count":20}
