54669,"node_id":"RA_kwDOCCLnUc4lUlyt","name":"tinygo0.43.0.linux-arm.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":178462897,"digest":"sha256:eba7787907302359853aadc7b30cf3995fc034e41f6a5e1d980f3087a8f7f78c","download_count":23,"created_at":"2026-10-09T20:55:08Z","updated_at":"2026-10-09T20:55:15Z"},{"id":626154673,"node_id":"RA_kwDOCCLnUc4lUlyx","name":"tinygo0.43.0.linux-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":181590263,"digest":"sha256:a2165b9f46aff9a895a0abed54aedffab1e93317a387c6c2e9dd839425527cbd","download_count":560,"created_at":"2026-10-09T20:55:08Z","updated_at":"2026-10-09T20:55:13Z"},{"id":626154830,"node_id":"RA_kwDOCCLnUc4lUl1O","name":"tinygo0.43.0.windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":178885387,"digest":"sha256:6239718f1a6a6abebc8a3e28aa4e639ef57e90c232dccf3a6aa0433492378c1a","download_count":524,"created_at":"2026-10-09T20:55:13Z","updated_at":"2026-10-09T20:55:18Z"},{"id":626154838,"node_id":"RA_kwDOCCLnUc4lUl1W","name":"tinygo_0.43.0_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":187174188,"digest":"sha256:1c78087d6eed75d7fd33655daf760604a060fd7c54343b6041011a7d489f4992","download_count":1288,"created_at":"2026-10-09T20:55:13Z","updated_at":"2026-10-09T20:55:19Z"},{"id":626154845,"node_id":"RA_kwDOCCLnUc4lUl1d","name":"tinygo_0.43.0_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":179165408,"digest":"sha256:444ab2632550c73354c523e5a5cf7571910f37319a2291468ebfbe16b3a91e6c","download_count":33,"created_at":"2026-10-09T20:55:14Z","updated_at":"2026-10-09T20:55:18Z"},{"id":626154884,"node_id":"RA_kwDOCCLnUc4lUl2E","name":"tinygo_0.43.0_armhf.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":176075448,"digest":"sha256:f5f84e5666acbef83ce9f630c4304f7e7226815c821bf1ef66f79f90e20f7fef","download_count":28,"created_at":"2026-10-09T20:55:15Z","updated_at":"2026-10-09T20:55:19Z"}],"body":"In our latest release, we have over 160 commits to our main repo, with a major focus on Go compatibility and correctness. The runtime now supports synctest, NumGoroutine, and panic recovery on Xtensa and on WebAssembly without exceptions. The testing package adds parallel tests, AllocsPerRun, and B.SetParallelism, and reflect adds NewAt, Slice3, SetCap, and FieldByIndexErr. The GC now uses precise layouts and scans globals precisely on all platforms, and the new -trimpath flag gives you reproducible builds. On the hardware side, there is I2S audio for ESP32 and nRF52, USB mass storage on nRF52840, USB CDC for Teensy 4.x, PWM on ESP32, and many I2C fixes for the ESP32 family. There is also the new ESP32-H2 chip, and new boards like the Waveshare RP2040-PiZero and RP2350-PiZero and the Pimoroni Tufty 2350.\r\n\r\n* **general**\r\n  - all: update picolibc to latest main, enable freopen, and remove stale workarounds (#5570)\r\n  - main: give the program access to stdin on `tinygo run` (#5706)\r\n  - binaryen: update to version 133 (#5732)\r\n  - drop \"devel \" version prefix handling due to Go 1.25 changed version reporting (#5735)\r\n* **compiler**\r\n  - compiler: support panic recovery without exceptions, and reuse Asyncify panic catchers (#5550)\r\n  - compiler: reduce Asyncify catcher stack usage (#5550)\r\n  - compiler: skip unwinding for safe calls (#5550)\r\n  - compiler: conservatively handle new SSA instructions (#5550)\r\n  - compiler: implement go:cgo_import_dynamic and lower Darwin cgo import trampolines (#5604, #5612)\r\n  - compiler: optimize non-blocking single-case selects (#5500)\r\n  - compiler: optimize large array comparisons (#5752)\r\n  - compiler: avoid byte slice copies in string equality and ordered string comparisons (#5765, #5773)\r\n  - compiler: reject impossible slice allocations (#5752)\r\n  - compiler: bound aggregate call signatures (#5625)\r\n  - compiler: fix 64-bit sin and cos on AVR (#5570)\r\n  - compiler: add debug info to synthetic wrapper functions (#5747)\r\n  - compiler: make equal-position member ordering deterministic (#5711)\r\n  - compiler, reflect: preserve runtime type identity (#5825)\r\n  - builder: add -trimpath support, and make trimmed builds reproducible (#5711)\r\n* **core**\r\n  - reflect: implement NewAt, Slice3, SetCap, and FieldByIndexErr (#5812, #5813, #5815)\r\n  - reflect: fix the map iterator state (#5814)\r\n  - reflect: fix Elem for named multi-pointer types (#5718)\r\n  - reflect: format invalid values (#5716)\r\n  - reflect: do not mark zero values read-only (#5725)\r\n  - sync: hand the RWMutex over instead of a re-test of the reader count (#5697)\r\n  - crypto/rand: implement Text (#5720)\r\n  - crypto/tls: return Conn from dial functions (#5726)\r\n  - testing: implement parallel tests, and report the parallel test state (#5715)\r\n  - testing: implement AllocsPerRun and B.SetParallelism (#5772, #5731)\r\n  - testing: run benchmark cleanup functions (#5713)\r\n  - testing: order verbose subtest results (#5715)\r\n  - runtime/debug: populate BuildInfo so ReadBuildInfo works (#5592)\r\n  - runtime/debug: add SetTraceback compatibility stub (#5719)\r\n  - runtime, runtime/pprof: add Func.Entry and goroutine labels (#5646)\r\n  - internal/abi: add PC-line table magic values (#5771)\r\n  - builder: add debug info to runtime.initAll (#5746)\r\n  - builder: trim Clang builtin header paths and omit C command lines from trimmed debug info (#5711)\r\n  - loader: precompute recorded source directories (#5711)\r\n  - interp: resize ptrtoint and inttoptr results (#5745)\r\n  - interp: evaluate fastrand without the global RNG state (#5722)\r\n  - transform: root every input of a tracked phi in a loop (#5751)\r\n  - transform: follow phi inputs only through phis that can repeat (#5762)\r\n  - transform: track escapes through nested aggregate results (#5776)\r\n  - transform: reuse GC stack slots for repeated pointer tracking (#5766)\r\n* **runtime**\r\n  - implement synctest (#5649)\r\n  - implement NumGoroutine (#5728)\r\n  - support panic recovery on Xtensa (#5653)\r\n  - preserve the Wasm panic traceback (#5550)\r\n  - classify standard panic messages (#5739)\r\n  - add a weak.Pointer.Value compatibility shim (#5714)\r\n  - report the configured Go root (#5717)\r\n  - yield the thread in Gosched on the threads scheduler (#5764)\r\n  - exit coroutines before resuming callers, and release completed Asyncify stacks (#5550, #5738)\r\n  - block signal_recv on targets without signal delivery (#5620)\r\n  - avoid heap allocations for plain errors, in printitf, in runGC, and while stopping the world (#5480, #5721, #5729, #5730)\r\n  - gc: require explicit GC layouts, and precisely scan globals on all platforms (#5575)\r\n  - gc: use precise layouts with Boehm GC, eagerly mark Boehm global roots, and reduce typed allocation overhead (#5575, #5686)\r\n  - gc: fix multicore RISC-V GC synchronization (#5682)\r\n  - cgo: preserve malloc allocations until free (#5575)\r\n  - wasm: keep one pending scheduler wakeup instead of leaking a timer chain (#5622)\r\n  - cores: add a secondary core startup barrier (#5737)\r\n  - xtensa: jump indirectly to longjmp (#5677)\r\n* **machine**\r\n  - usb/msc: add USB mass storage support on nRF52840 (#5794)\r\n  - usb/msc: read the block device outside the USB interrupt (#5808)\r\n  - usb/msc: reset the MSC state when the host sets the configuration (#5809)\r\n  - usb/msc: fix stalls and split writes at raw blocks (#5794)\r\n  - usb/msc: send the CSW when an OUT command fails (#5817)\r\n  - usb/cdc: send a ZLP when TX ends on a full packet (#5795)\r\n  - nrf52840: fix USB endpoint 3 and EasyDMA ownership, and clear EPDATASTATUS before the EPDATA handlers run (#5794)\r\n  - nrf52xxx: add I2S support (#5786)\r\n  - nrf: stop the RNG after each read (#5851)\r\n  - esp32xx: add I2S support (#5787)\r\n  - esp32: add PWM support using the LEDC peripheral (#5669)\r\n  - esp32xx: share the LEDC channels and fix SetInverting (#5669)\r\n  - esp32xx: fix PWM above 78 kHz and lost duty updates (#5790)\r\n  - esp32xx: fix I2C commands, FIFO reset, and the last byte read, and clear the bus with a GPIO STOP when configuring (#5774, #5783)\r\n  - esp32: fix I2C timeouts on larger transfers (#5674)\r\n  - esp32: route GPIO pin interrupts to the PRO CPU (#5688)\r\n  - esp32: handle the alloca exception (#5689)\r\n  - esp32: avoid sync.Once during startup (#5653)\r\n  - esp32c6: add default UART0 pins, and move the UART interrupt off CPU interrupt 7 (#5755, #5756)\r\n  - mimxrt1062: add USB device (CDC) support for Teensy 4.x (#5691)\r\n  - rp2: use blocking FIFO writes for multicore handshakes, and check FIFO_ST.VLD in the SIO FIFO interrupt handler (#5709, #5723)\r\n  - rp2040: avoid XIP hangs during flash operations with scheduler=cores (#5411)\r\n  - rp2350: pause the other core during flash operations with scheduler=cores (#5806)\r\n  - rp2350: set ACTLR.EXTEXCLALL on each core (#5708)\r\n  - nrf: fix a missed RTC wakeup (#5832)\r\n  - mimxrt1062: use Normal memory attributes for ITCM and DTCM (#5690)\r\n  - esp32xx: make the timer tick period a per-chip constant (#5749)\r\n* **targets**\r\n  - add ESP32-H2 support and the ESP32-H2-DevKitM-1 board (#5750)\r\n  - add Waveshare RP2040-PiZero (#5675)\r\n  - add Waveshare RP2350-PiZero (#5670)\r\n  - add Pimoroni Tufty 2350 (#5658)\r\n  - nrf52840: use an 8 KB default stack (#5816)\r\n  - esp32: add Bluetooth controller ROM symbols and reserve its memory (#5689)\r\n  - esp32: align the heap to 16 bytes on the esp32 family (#5789)\r\n  - esp32c6: align .rodata to its flash offset (#5755)\r\n* **examples**\r\n  - add the i2s-tone example with esp32xx pins (#5786, #5787)\r\n  - docs: remove ASD-STE100, just tell coding tools to keep it simple and direct (#5753)\r\n* **build/test**\r\n  - ci: build the compiler image on a prebuilt LLVM image (#5671)\r\n  - ci: split assert-test-linux and the macOS jobs so they run at the same time (#5664, #5666)\r\n  - ci: share LLVM setup steps, and include Xtensa in size comparisons (#5654)\r\n  - ci: update Wasmtime to 48.0.2 LTS (#5741)\r\n  - make: allow updating LLVM sources, and avoid fetching the available LLVM revision (#5672, #5685)\r\n  - make: test bytes, slices, strings, iter, go/printer, and net/netip on hosted platforms (#5727, #5738, #5752, #5769)\r\n  - make: enable recovered wasm package tests, and run the slowest stdlib tests with -short (#5550, #5663)\r\n  - builder: add a representative binary size test (#5770)\r\n  - test: run panic recovery on ESP32 QEMU (#5653)\r\n  - testdata: add regression tests for GC roots across loop phis and aggregate escapes (#5751, #5776)\r\n","reactions":{"total_count":20,"+1":0,"-1":0,"laugh":0,"hooray":17,"confused":0,"heart":0,"rocket":3,"eyes":0}}
