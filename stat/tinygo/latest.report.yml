237495,"node_id":"RA_kwDOCCLnUc4oyKK3","name":"tinygo0.44.0.linux-arm.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":179783026,"digest":"sha256:ab26ffd5752e77afe0e66f815e53e2b88b27c05d247b4ace21e26f534859acef","download_count":56,"created_at":"2026-10-28T07:45:23Z","updated_at":"2026-10-28T07:45:34Z"},{"id":684237489,"node_id":"RA_kwDOCCLnUc4oyKKx","name":"tinygo0.44.0.linux-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":182920807,"digest":"sha256:48cece9e1e886a176caad0918182d90f8348ad3084774e6239f42e5e11e40990","download_count":794,"created_at":"2026-10-28T07:45:23Z","updated_at":"2026-10-28T07:45:34Z"},{"id":684237991,"node_id":"RA_kwDOCCLnUc4oyKSn","name":"tinygo0.44.0.windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":180259399,"digest":"sha256:b2c1672260a7c81e239bb5febb9ee114be752416c0a584b913a361001e7bd03b","download_count":845,"created_at":"2026-10-28T07:45:33Z","updated_at":"2026-10-28T07:45:41Z"},{"id":684238041,"node_id":"RA_kwDOCCLnUc4oyKTZ","name":"tinygo_0.44.0_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":188650296,"digest":"sha256:8810b20d88236a1353e35641a6a56df1720a7db97006aacc2c6656a3bb090b74","download_count":2759,"created_at":"2026-10-28T07:45:34Z","updated_at":"2026-10-28T07:45:43Z"},{"id":684238067,"node_id":"RA_kwDOCCLnUc4oyKTz","name":"tinygo_0.44.0_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":180536890,"digest":"sha256:c2addff1430c7066fc11900e93ee8d6dd14fce343a7b0e1d72da0509a58766ff","download_count":99,"created_at":"2026-10-28T07:45:35Z","updated_at":"2026-10-28T07:45:43Z"},{"id":684238073,"node_id":"RA_kwDOCCLnUc4oyKT5","name":"tinygo_0.44.0_armhf.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":177416758,"digest":"sha256:c01715a45a353958c773e892dd919670a60627b9d0e833d002583372c13f558d","download_count":70,"created_at":"2026-10-28T07:45:35Z","updated_at":"2026-10-28T07:45:43Z"}],"body":"Mere weeks after our previous release, this new version brings massive performance boosts, improvements in toolchain support, and lots of new hardware. TinyGo now builds against LLVM 23 and drops support for LLVM versions below 15. The interp package now runs more of your program's initialization at compile time so startup is smaller and faster. The compiler skips slice bounds checks that cannot fail and avoids more byte slice copies in string comparisons. On the hardware side, the cores scheduler now supports the ESP32-S3 and adds core affinity for both it and the RP2040/RP2350. The ESP32-S3 also gets USB-OTG device support and flash BlockDevice support, and ESP32-S3 and ESP32-C3 can now boot images with large flash segments. There are also many I2C, SPI, and USB fixes for ESP32, RP2, and SAMD. New boards include the Arduino Uno R4 Minima and WiFi, the NUCLEO-F401RE, and the M5Stack StampFly.\r\n\r\n* **general**\r\n  - drop support for LLVM versions below 15 (#5925)\r\n  - add LLVM 23 build support (#5782)\r\n  - main: do not erase the entire flash when flashing esp32 (#5971)\r\n  - main: update to espflasher 0.9.2 (#6000)\r\n  - main: preserve Windows paths in linker flags (#6032)\r\n  - main: make tinygo fix useful for TinyGo sources (#5992)\r\n  - compileopts: add -panic-unwind=none (#5982)\r\n  - compileopts: fix build tag order (#5782)\r\n  - loader: split CGO_*FLAGS environment variables the same way as the go command (#6022)\r\n  - loader: preserve the working directory in go list (#5914)\r\n  - all: use newer Go library functions and language features, and remove Go version checks that are always true (#5906, #6038)\r\n  - all: check out testdata with LF line endings on all platforms (#5872)\r\n  - tools: migrate to Go tool directives (#5881)\r\n  - lib: update macos-minimal-sdk to v0.1.2 (#5870, #5976)\r\n* **compiler**\r\n  - compiler: support long struct tags (#5854)\r\n  - compiler: prevent compile time functions leaking into run time (#5887)\r\n  - compiler: report errors for misused pragmas (#5936, #5894)\r\n  - compiler: avoid byte slice copies in mixed string comparisons, and when a load or string slice is compared (#5784, #5937)\r\n  - compiler: compare range loop index unsigned (#5999)\r\n  - compiler: skip slice bounds checks that cannot fail (#5997)\r\n  - compiler: fix the element size check in make for 32-bit targets (#6004)\r\n  - compiler: build programs that start goroutines from either branch of an if (#6016)\r\n  - compiler: report only panicking binary operations as unwinding (#5986)\r\n  - cgo: apply target-specific #cgo flags, preserve preprocessor and C++ build flags, and order CGo flags like the go command (#5976)\r\n  - cgo: accept unsigned as an alias for uint (#5976)\r\n  - cgo: emit one AST comment per pragma (#5895)\r\n  - cgo: handle LLVM 23 predefined type sugar (#5782)\r\n  - builder: add AEABI unaligned read/write helpers to compiler-rt (#5988)\r\n  - builder: link package modules with a single Linker (#5979)\r\n  - builder: free go/ssa and the program module before linking (#6020)\r\n* **core**\r\n  - reflect: implement Value.SetPointer (#5875)\r\n  - reflect: convert VisibleFields field types (#5890)\r\n  - reflect: fix FieldByIndex for empty indexes and non-struct roots (#5893)\r\n  - reflect: distinguish interface and slice cycle visits (#5868)\r\n  - reflectlite: use less stack when reading struct fields (#5884)\r\n  - testing: implement B.Loop, give benchmarks a context, and fix ReportMetric (#5831)\r\n  - os, internal/poll: never return a negative count from Read, Write, ReadAt, WriteAt or a wasip1 FD (#5900)\r\n  - os: avoid startup work for unused temporary files (#5973)\r\n  - syscall: report unsupported WASI ownership changes (#5867)\r\n  - syscall: split an environment entry at its first '=' on js (#5886)\r\n  - interp: evaluate memset, private atomic operations, map lookups, interface hashing, and deferred initialization at compile time (#5903)\r\n  - interp: handle llvm.ctlz (#5963)\r\n  - interp: stop pointer-derived integers from becoming zero (#5965)\r\n  - interp: keep partial loads independent of buffers owned by a caller's memory view (#5905)\r\n  - interp: keep memcpy results out of the global state when an initializer is reverted (#5904)\r\n  - interp: limit each value to its own bytes in toLLVMValue (#5826)\r\n  - interp: say why a rollback happened, and only print instructions of errors that leave interp (#5989, #5935, #5985)\r\n  - transform: keep allocations on the stack when they flow through a select (#5891)\r\n* **runtime**\r\n  - add core affinity for the cores scheduler (#5873)\r\n  - hand the clock to a waiting core before running a task (#5919)\r\n  - deliver signals under the threads scheduler when blocked on I/O (#5530)\r\n  - ignore blank fields when comparing structs in interfaces (#5880)\r\n  - report allocation counts in MemStats with the boehm collector (#5939)\r\n  - run finalizers with Boehm GC, including interior finalizers (#5791)\r\n  - scan only the live part of asyncify stacks (#5930)\r\n  - remove go:nobounds where it has no effect (#6007)\r\n  - wasm: round sleepTicks up to a whole millisecond (#5818)\r\n  - riscv-qemu: clear stale timer wakeups (#5873)\r\n  - rp2: fix scheduler lock starvation in schedulerUnlockAndWait (#5940)\r\n  - esp32c3, esp32c6, esp32h2: register the timer alarm handler (#6052)\r\n* **machine**\r\n  - esp32s3: add support for the cores scheduler, and fix two context bugs in the interrupt handler (#5910)\r\n  - esp32s3: add USB-OTG device support (#6000)\r\n  - esp32s3: add flash BlockDevice support (#5934)\r\n  - esp32s3: always route SPI pins through the GPIO matrix (#5920)\r\n  - esp32xx: let machine.Flash write past 2 MB (#6003)\r\n  - esp32xx: wait for the I2C bus to be free before a transaction (#5978)\r\n  - esp32xx: add WASM simulator support for the StampFly and ESP32-C3 SuperMini (#5921, #5918)\r\n  - esp32: do not allocate on each I2C transaction (#5922)\r\n  - esp32c6: fix an ADC hang by initializing the APB_SARADC and Modem/ADC peripheral (#5668)\r\n  - stm32: add STM32F401 support (#5597)\r\n  - ra4m1: add SCI UART driver (#6015)\r\n  - rp2: keep PLL calculations out of startup (#5837)\r\n  - rp2: make random number reads safe across cores (#5964)\r\n  - rp2: stop SPI1 transmit from restarting SPI0 DMA, and report SPI DMA bus errors (#6010, #6012)\r\n  - atsamd21, atsamd51: handle USB TX complete together with RX complete (#6024)\r\n  - usb/cdc: resume TX after the host configures the device again (#6000)\r\n* **targets**\r\n  - add Arduino Uno R4 Minima and Arduino Uno R4 WiFi (#5734)\r\n  - add NUCLEO-F401RE (#5597)\r\n  - add M5Stack StampFly (#5921)\r\n  - esp32s3, esp32c3: boot images with large flash segments (#6001, #6017)\r\n  - esp32s3: map all code and keep flash data clear of the image footer (#5934)\r\n  - use full 2MiB flash on Waveshare RP2040-Zero, and correct flash sizes for six RP2040 boards (#5970, #5977)\r\n  - hold BOOT0 low when flashing arduino-uno-q (#6040)\r\n  - arduino-uno-r4-wifi: document the bossac requirement (#6006)\r\n  - tools: handle Renesas SVD quirks (#5734)\r\n* **build/test**\r\n  - ci: build linux arm and arm64 releases on arm runners (#5995)\r\n  - ci: build against Homebrew LLVM 23 on macOS, test LLVM 16, 20, 21, and 22 there, and link and run a program in the homebrew-install job (#5968, #5923, #6018)\r\n  - ci: move macOS arm64 runners to macos-15, and run only the smoke tests on the intel macOS runner (#5899, #5924)\r\n  - ci: run all test packages on Windows and macOS (#5879)\r\n  - ci: reject coding tool attributions in PRs and commits (#5869)\r\n  - build: link wasm-opt with mimalloc on Linux (#5980)\r\n  - make: use per-package standard library test options, and test stack-heavy packages and ML-DSA (#5824, #5855, #5866)\r\n  - builder: add size tests for startup work removed by interp, and match them to the CLI interpreter limit (#5983, #5975, #5915)\r\n  - tests/wasm: stop at once when headless Chrome does not start (#6021)\r\n  - tests: count string comparison allocations with any garbage collector (#5938)\r\n  - loader, interp, transform: fix test setup for module context, absolute paths, and fixture discovery (#5853, #5871, #5913, #5916)\r\n","reactions":{"total_count":13,"+1":3,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":0,"rocket":3,"eyes":0}}
