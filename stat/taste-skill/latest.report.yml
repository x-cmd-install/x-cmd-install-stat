{"id":434590576,"author":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORUQ5b84Z51Nw","tag_name":"v2.5.0","target_commitish":"822e0b9d872e10deb931afad2c6c2bd943cf4c7b","name":"tasteskill v2.5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T23:40:44Z","updated_at":"2026-11-04T23:41:47Z","published_at":"2026-11-04T23:41:47Z","assets":[],"body":"A complete rebuild of `design-taste-frontend` around professional company websites at the figma.com and x.ai bar. The install name did not change.\n\n- **One page system:** every build starts from the same starter. The hero fills the first screen, one section per screen, equal left and right edges.\n- **Effects only where they fit:** shader grounds, scroll moments and big scenes only on software, tech and gaming pages. Cafes, shops, hotels and services get real photographs and no effects.\n- **Real product UI:** 19 HTML UI fragments (chat, diff review, terminal, pipeline board, voice and more), and a software page shows its product in one app window.\n- **Real photographs and icons:** vetted Unsplash and Wikimedia Commons frames by trade, no captions, one footer credit line; real brand icons, never drawn.\n- **No two pages alike:** the hero layout, palette, type pairing and ground are dealt at random.\n- **A product is always shown, and big:** with no photographs it is rendered from a spec of its parts, and the colour buttons change the picture.\n- **Checked in a real browser:** over 100 checks at 1440, 1024, 768 and 390. A page with a FAIL is not done.\n- **Installs anywhere:** Node 22+ and Chrome, Edge or Chromium, no API keys. On Windows `install.sh` makes a real link.\n\nEverything else is in the [changelog](https://github.com/Leonxlnx/taste-skill/blob/main/CHANGELOG.md).\n\n```bash\nnpx skills add https://github.com/Leonxlnx/taste-skill --skill \"design-taste-frontend\"\n```\n\nClaude Code plugin users: `/plugin update`. Codex plugin users: start a new session after `codex plugin add taste-skill@taste-skill`.\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
