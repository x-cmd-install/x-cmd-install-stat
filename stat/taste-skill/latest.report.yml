{"id":417820313,"author":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORUQ5b84Y526Z","tag_name":"v2.1.3","target_commitish":"63aba5f43b5056758b15bbe7d683da8c86a7a7ad","name":"tasteskill v2.1.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-19T22:16:44Z","updated_at":"2026-10-19T22:33:29Z","published_at":"2026-10-19T22:33:29Z","assets":[],"body":"One repo, one skill. `design-taste-frontend` itself is unchanged; this release cleans up the repo around it ([#153](https://github.com/Leonxlnx/taste-skill/issues/153), [#155](https://github.com/Leonxlnx/taste-skill/pull/155)).\n\n**The other skills moved to repos of their own and kept their install names:**\n\n- The classic styles and earlier versions (`high-end-visual-design`, `minimalist-ui`, `industrial-brutalist-ui`, `gpt-taste`, `stitch-design-taste`, `design-taste-frontend-v1`, `design-taste-frontend-v2-experimental`) are in **[Leonxlnx/taste-skill-classics](https://github.com/Leonxlnx/taste-skill-classics)**.\n- The image-generation skills (`imagegen-frontend-web`, `imagegen-frontend-mobile`, `brandkit`, `image-to-code`) are in **[Leonxlnx/imagegen-skills](https://github.com/Leonxlnx/imagegen-skills)**.\n- `redesign-existing-projects` is part of `design-taste-frontend`.\n\nInstalled a classic skill from this repo before? Install it from its new home under the same name:\n\n```bash\nnpx skills add https://github.com/Leonxlnx/taste-skill-classics --skill \"high-end-visual-design\"\n```\n\nClaude Code plugin users: `taste-skill@taste-skill` is unchanged. The classics plugin now has its own marketplace: `/plugin marketplace add Leonxlnx/taste-skill-classics`.\n\nAlso in this release:\n\n- A cleaner README, with a wordmark instead of the banner and a TasteCode banner that reads well in dark mode.\n- Old research notes, `llms.txt`, `skill.sh` and unused images are removed.\n- The Codex plugin now loads only `design-taste-frontend`.\n\nThanks to @code5717 for the nudge in #153.\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
