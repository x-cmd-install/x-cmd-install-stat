{"id":416765620,"author":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORUQ5b84Y11a0","tag_name":"v2.1.1","target_commitish":"main","name":"tasteskill v2.1.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-18T23:12:11Z","updated_at":"2026-10-18T23:13:35Z","published_at":"2026-10-18T23:13:35Z","assets":[],"body":"One skill to reach for. Installing taste-skill no longer means an agent might pick an older skill for the job.\n\n## Install or upgrade\n\n```bash\nnpx skills add https://github.com/Leonxlnx/taste-skill --skill \"design-taste-frontend\"\n```\n\n## What changed\n\n- **The classic skills are opt-in.** soft, minimalist, brutalist, gpt-taste, Stitch, v1 and v2-experimental run only when you call them by name (`/high-end-visual-design` in Claude Code, `$minimalist-ui` in Codex). An agent never picks one by itself.\n- **Redesigns are part of taste-skill.** It records the existing page in a real browser first, keeps the stack, the content and everything that works, then changes type, colour, the frame, states and stock components in that order, and proves it with before-and-after screenshots. `redesign-existing-projects` is retired.\n- **Image generation has its own repo:** [Leonxlnx/imagegen-skills](https://github.com/Leonxlnx/imagegen-skills) (`imagegen-frontend-web`, `imagegen-frontend-mobile`, `brandkit`, `image-to-code`), same install names.\n- **`full-output-enforcement` is removed.**\n- **Claude Code plugins:** `taste-skill@taste-skill` now carries only the default skill; the classics are `taste-skill-classics@taste-skill`.\n\nFull notes: [CHANGELOG.md](https://github.com/Leonxlnx/taste-skill/blob/main/CHANGELOG.md)\n"}
