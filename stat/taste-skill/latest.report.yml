{"id":412059990,"author":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORUQ5b84Yj4lW","tag_name":"v2.0.0","target_commitish":"main","name":"tasteskill v2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-13T21:04:56Z","updated_at":"2026-10-13T21:05:17Z","published_at":"2026-10-13T21:05:17Z","assets":[{"id":638107260,"node_id":"RA_kwDORUQ5b84mCL58","name":"tasteskill-v2-launch-film.mp4","label":"Launch film (64 s)","uploader":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"video/mp4","state":"uploaded","size":20713727,"digest":"sha256:3cd9674e3e4d895c375c0509549a1ceb41d6c1a0f8ebe7c8fd5298cd0119ca45","download_count":96,"created_at":"2026-10-13T20:01:16Z","updated_at":"2026-10-13T20:01:19Z"},{"id":638107261,"node_id":"RA_kwDORUQ5b84mCL59","name":"tasteskill-v2-poster.png","label":"Poster","uploader":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"image/png","state":"uploaded","size":189181,"digest":"sha256:08e4d24ee8067cc6d8f80ef9452d81deaabb00eb8e3d0c89e9b6e22939805212","download_count":28,"created_at":"2026-10-13T20:01:16Z","updated_at":"2026-10-13T20:01:17Z"}],"body":"tasteskill v2 is a new default skill, not an edit of the old one. It gives a coding agent an art direction, real pictures and a way to check its own work in a real browser.\n\n## Install or upgrade\n\n```bash\nnpx skills add https://github.com/Leonxlnx/taste-skill --skill \"design-taste-frontend\"\n```\n\nThe install name did not change. Needs Node 22+ and Chrome, Edge or Chromium. Installs nothing, uses no API keys.\n\n## What is new\n\n- **A library instead of adjectives.** Built from a study of 247 curated sites: 20 directions, 48 hero compositions, 172 section layouts, 44 type systems, 56 palettes.\n- **A script deals the direction.** `scripts/draw.mjs` deals three directions; the agent picks the one that can carry something only this client has.\n- **Real pictures.** `scripts/assets.mjs` finds photographs, maps and footage of the subject's world in open collections, downloads them and records the credits.\n- **A real-browser inspector.** `scripts/inspect.mjs` opens the page at 1440, 768 and 390 px and fails it on eyebrow labels, hairlines, gradients, resting shadows, headlines over two lines, empty screens and covered text.\n- **A look-and-fix loop.** The agent critiques its own screenshots and fixes the top three problems, up to three rounds.\n\nAcross four test briefs built with and without the skill: 37 small labels and 249 hairline rules without it, none with it; no photographs without it, 48 with it.\n\n## Also in this release\n\n- Codex can install the collection as a plugin (`codex plugin marketplace add Leonxlnx/taste-skill`).\n- The previous default stays available as `design-taste-frontend-v2-experimental`, and the original as `design-taste-frontend-v1`.\n- README rewritten around v2, with before/after examples.\n\nFull notes: [CHANGELOG.md](https://github.com/Leonxlnx/taste-skill/blob/main/CHANGELOG.md)\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
