{"id":423046682,"author":{"login":"Leonxlnx","id":219127460,"node_id":"U_kgDODQ-epA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORUQ5b84ZNy4a","tag_name":"v2.1.5","target_commitish":"main","name":"tasteskill v2.1.5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-24T23:42:19Z","updated_at":"2026-10-24T23:44:17Z","published_at":"2026-10-24T23:44:17Z","assets":[],"body":"Fixes from the community. Thanks to everyone who reported and sent them.\n\n- **Safe text in charts and split headings** (#160, #169, thanks @jcastilla89 and @Pablolakotek): `charts.js` and the `Stage.split` fallback escape the text they insert, so a label or heading from user data can no longer inject markup.\n- **No lost screenshots when two widths share a class** (#162, #165, thanks @nosawavey-spec and @ketpatil77).\n- **Keyboard and accessible names** (#170, thanks @MrBinnacle): every control works from the keyboard and has an accessible name.\n- **The italic faces load** (#161, fix from #166, thanks @nosawavey-spec and @ketpatil77): Boska, Erode and Sentient request their italic weight.\n- **`edge-text` no longer fails ellipsised lines** (#156, thanks @shoctroper).\n- **Inspect the production build** (#171, thanks @lilozzy): the Gate says so, and the inspector warns when it is looking at a dev server.\n- **The redraw rule names its third reason** (#163, thanks @Tsury).\n- CI also checks that every text file is clean UTF-8.\n\n```bash\nnpx skills add https://github.com/Leonxlnx/taste-skill --skill \"design-taste-frontend\"\n```\n\nClaude Code plugin users: `/plugin update`.\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":8}
