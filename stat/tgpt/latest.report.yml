ownload_count":3,"created_at":"2026-11-12T12:01:11Z","updated_at":"2026-11-12T12:01:15Z"},{"id":739321473,"node_id":"RA_kwDOJX6IYs4sESaB","name":"tgpt-openbsd-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15139101,"digest":"sha256:e4be0f35b614529657533757e40cf0022d02439159d6ab8e3e4d23cf0a1e2661","download_count":3,"created_at":"2026-11-12T12:01:11Z","updated_at":"2026-11-12T12:01:14Z"},{"id":739321467,"node_id":"RA_kwDOJX6IYs4sESZ7","name":"tgpt-openbsd-i386","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15122715,"digest":"sha256:1a7655df18969f16af1715c304232ce2323c74be2cd36ba695f369bee87e01c6","download_count":3,"created_at":"2026-11-12T12:01:11Z","updated_at":"2026-11-12T12:01:14Z"},{"id":739321466,"node_id":"RA_kwDOJX6IYs4sESZ6","name":"tgpt-openbsd-i386-softfloat","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15167771,"digest":"sha256:5e65cf039ae08a16e7dcdb08012b464234e022ad1263d2d2f897e8f53f6fd552","download_count":3,"created_at":"2026-11-12T12:01:11Z","updated_at":"2026-11-12T12:01:14Z"}],"body":"## Changelog\r\n\r\n### New AI Providers\r\n- **API Route (`apiroute`)**: Added OpenAI-compatible gateway support with tool calling (default model `gpt-5.5`; supports `API_ROUTE_API_KEY`, `API_ROUTE_MODEL`, `API_ROUTE_URL`, `API_ROUTE_BASE_URL`).\r\n- **DemonRoute (`demonroute`)**: Added OpenAI-compatible provider (`https://api.demonroute.com/v1`) with tool calling.\r\n- **Runcrate (`runcrate`)**: Added OpenAI-compatible provider (`https://api.runcrate.ai/v1`) with tool calling (default model `deepseek-ai/DeepSeek-V4.1-Flash`; supports `RUNCRATE_API_KEY`, `RUNCRATE_MODEL`, `RUNCRATE_URL`, `RUNCRATE_BASE_URL`).\r\n- **Obscurify.ai (`obscurifyai`)**: Added OpenAI-compatible provider (`https://obscurify.ai/v1`) with tool calling (default model `deepseek/deepseek-v4-flash`; supports `OBSCURIFY_API_KEY`, `OBSCURIFY_MODEL`, `OBSCURIFY_URL`, `OBSCURIFY_BASE_URL`).\r\n\r\n### New Web Search Providers & Built-in Tools\r\nAdded opt-in choices for `--search-provider` / `SEARCH_PROVIDER` and corresponding built-in tools (documented in `SEARCH_SETUP.md`):\r\n- **Keenable (`keenable` / `web_search_keenable`)**: Works without an API key.\r\n- **Sofya (`sofya` / `web_search_sofya`)**: Uses `SOFYA_API_KEY`.\r\n- **Parallel (`parallel` / `web_search_parallel`)**: Works without an API key via anonymous Search MCP, with idle connection cleanup forwarding.\r\n- **SpecStream (`specstream` / `web_search_specstream`)**: Uses `SPECSTREAM_API_KEY`.\r\n\r\n### Bug Fixes & Improvements\r\n- **OpenCode provider**: Fixed it.\r\n- **Gemini provider**: Replaced the shut-down `gemini-2.0-flash` default model with `gemini-3.6-flash`.\r\n- **DeepSeek Web provider**: Fixed output truncation at both the beginning (handling `SET` events on `fragments` and response paths) and end of streams (increased `bufio.Scanner` buffer limit to 1 MiB in `src/helper/helper.go`).\r\n- **SSE stream parsing**: Stopped dropping chunks whose generated text contains `\"data: \"` across `deepseek`, `gemini`, `groq`, `minimax`, `openai`, `opencode`, `pollinations`, and `koboldai` (and prevented panics on `\"data:\"` without a space in `koboldai`).\r\n- **Sampling parameters (`--temperature`, `--top_p`)**: Restored forwarding of `--temperature`, `--top_p`, `TGPT_TEMPERATURE`, and `TGPT_TOP_P` across OpenAI-compatible providers, `obscurifyai`, `pollinations`, `ollamacloud`, and `koboldai`.\r\n- **MiniMax provider**: Included `tools` in chat completion requests.\r\n- **CLI `--tools` / `-t` flag parsing**: Normalized `-t <tool_list>` / `--tools <tool_list>` arguments so subsequent flags (e.g., `-t web_search_exa -i`) continue to parse properly.\r\n- **Windows `glob` tool**: Switched matching from `filepath.Match` to `path.Match` so `*` and `?` do not match across `/` directory boundaries on Windows.\r\n- **Piped stdin & error output**: Preserved newlines between piped stdin lines (up to 1 MiB per line) and wrote non-interactive HTTP error bodies to `stderr` instead of `stdout`.\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
