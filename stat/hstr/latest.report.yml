45.x86_64.rpm","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":53421,"digest":"sha256:7fb2a5e7ce2a5ab69795f8c0b67c429f6d9eca4701bd8cb511148a5d5f848986","download_count":3,"created_at":"2026-11-04T15:36:39Z","updated_at":"2026-11-04T15:36:39Z"},{"id":710001813,"node_id":"RA_kwDOAOMCWM4qUcSV","name":"hstr-3.3.0-bin-64b.tgz","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-compressed-tar","state":"uploaded","size":27623,"digest":"sha256:d3484278c0ee51d8626778c16a02c5c2f0c132736744ab234214175855f51241","download_count":4,"created_at":"2026-11-04T15:36:39Z","updated_at":"2026-11-04T15:36:40Z"},{"id":710001831,"node_id":"RA_kwDOAOMCWM4qUcSn","name":"hstr-3.3.0-tarball.tgz","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-compressed-tar","state":"uploaded","size":182064,"digest":"sha256:2e030cb0575d57d7d4010602b9bbaa1e7362c11ad349b109f823fad30c69dd10","download_count":52,"created_at":"2026-11-04T15:36:40Z","updated_at":"2026-11-04T15:36:40Z"},{"id":710001862,"node_id":"RA_kwDOAOMCWM4qUcTG","name":"hstr_3.3.0-1_amd64.deb","label":null,"uploader":{"login":"dvorka","id":2090143,"node_id":"MDQ6VXNlcjIwOTAxNDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":33836,"digest":"sha256:fda7c3b34682d2b74e0f496a0b25f523abbc3f9ffcdf93e4200b29f60ed65317","download_count":15,"created_at":"2026-11-04T15:36:40Z","updated_at":"2026-11-04T15:36:41Z"}],"body":"This minor HSTR release brings:\r\n\r\n- Fixed truncation of bash history file by HSTR configuration\r\n  (--show-configuration) - history size (bash HISTSIZE and HISTFILESIZE,\r\n  zsh HISTSIZE and SAVEHIST) is only increased, never decreased and\r\n  unlimited sizes are kept, also for very large values and in UTF-8\r\n  locales - thanks to @awcator\r\n- Fixed HSTR bash configuration with set -u (nounset) - unset\r\n  HISTFILESIZE and PROMPT_COMMAND no longer cause errors\r\n- Fixed TIOCSTI detection diagnostics printed to stdout - they were\r\n  appended to ~/.bashrc by --show-configuration run without a terminal\r\n  (scripts, containers) - and leaked /dev/tty file descriptor\r\n- Fixed man page rendering of the bash and zsh configuration (missing\r\n  hstrnotiocsti function body and Ctrl-r key bindings)\r\n- Added HSTR_HISTFILE environment variable with history file to be used\r\n  by HSTR instead of HISTFILE e.g. global history shared by shells with\r\n  per-shell history files - thanks to @xobes\r\n- Fixed leading space in case of empty HSTR prompt\r\n  (indent kept for non-empty prompts) - thanks to @roshal\r\n- Fixed favorites corruption and crash on empty selection\r\n- Fixed out of bounds selection access with prompt at the bottom\r\n  (PgUp/PgDn, regexp highlighting) and stale cursor after backspace\r\n- Fixed duplicate favorites when adding an existing favorite\r\n- Fixed memory leak and misleading deletion count on favorite removal\r\n- Fixed memory leak on deletion of a command from history\r\n- Fixed search pattern buffer overflow on very wide terminals and garbage\r\n  characters in the pattern after pressing unhandled special keys\r\n- Fixed prompt and search pattern with multibyte/wide characters (e.g. \"❯ \"\r\n  in HSTR_PROMPT, UTF-8 or CJK pattern): cursor position, backspace,\r\n  elided history rows and highlighting of matches - thanks to\r\n  Lukáš Brabec (@lbrabec)\r\n- Fixed memory corruption on backspace and history row eliding on very\r\n  narrow terminals\r\n- Fixed Zsh history with non-ASCII characters (e.g. \"čeština\") which was\r\n  shown, searched and inserted to the prompt in Zsh metafied encoding,\r\n  and deletion of Zsh history entries with long command duration\r\n- Added Stonking Stingray Ubuntu version support at Launchpad.\r\n- Added GitHub actions workflows to build tarball, .deb, and .rpm distros.\r\n- Fixed build on Linux distributions without ncursesw/curses.h header\r\n  (e.g. Arch Linux) - thanks to Kipras Melnikovas (@kiprasmel)\r\n\r\nBig up to @awcator @xobes @lbrabec @kipresmel  @Smoothieewastaken and @roshal for their contributions!\r\n\r\n---\r\n\r\n**Full Changelog**: https://github.com/dvorka/hstr/compare/v3.2...v.3.3\r\n\r\n* enh(TUI): 🌟 remove leading space in the HSTR promt row when the prompt is empty/\"\" by @roshal in https://github.com/dvorka/hstr/pull/567\r\n* fix(favorites): 🐞 fixing NPE crash on favorites manipulation #470 by @dvorka in https://github.com/dvorka/hstr/pull/553\r\n* fix(build): 🐞 fixing build on Linux distributions w/o ncursesw/cursesh (e.g. Arch Linux) #345 by @dvorka in https://github.com/dvorka/hstr/pull/568\r\n* feat(history): ✨ adding HSTR_HISTFILE which enables per-shell history file #547 by @dvorka in https://github.com/dvorka/hstr/pull/569\r\n* fix(history): 🐞 fixing user's Bash/Zsh history truncation in case it is set above HSTR's BP values #563 by @dvorka in https://github.com/dvorka/hstr/pull/571\r\n* fixed typos from doc\\USER-DOCUMENTATION.md by @Smoothieewastaken in https://github.com/dvorka/hstr/pull/502\r\n* fix(wide): 🐞 fixing wide characters handling end to end #533 by @dvorka in https://github.com/dvorka/hstr/pull/570\r\n\n\n[![Download HSTR](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/hstr/files/v.3.3/)","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":7}
