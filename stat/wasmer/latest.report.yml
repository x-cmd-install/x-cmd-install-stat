ated_at":"2026-08-31T15:58:39Z"},{"id":538205721,"node_id":"RA_kwDOCRgRGs4gFF4Z","name":"wasmer-windows.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.microsoft.portable-executable","state":"uploaded","size":114914489,"digest":"sha256:6f8c4fefc67508b03242005397147fea11bcb787aada214507e61aff68d38172","download_count":424,"created_at":"2026-08-31T15:57:47Z","updated_at":"2026-08-31T15:57:51Z"}],"body":"> [!IMPORTANT]\r\n> For packaging purposes, use the provided `wasmer-full-source.tar.xz`, which includes all required submodules.\r\n\r\nThis release includes:\r\n- A WASIX import preparation hook.\r\n- General N-API improvements, including guest heap growth through the store.\r\n- A maximum output-size budget for Singlepass.\r\n- An updated static `MemoryStyle` API, now requiring an 8 GiB memory mapping.\r\n\r\nSee full list of changes in the [CHANGELOG](https://github.com/wasmerio/wasmer/blob/main/CHANGELOG.md#740---31082026)\r\n\r\nInstall this version of wasmer:\r\n\r\n```sh\r\ncurl https://get.wasmer.io -sSfL | sh -s \"v7.4.0\"\r\n```","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
