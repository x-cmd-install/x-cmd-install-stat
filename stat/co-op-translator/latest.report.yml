{"id":438299375,"author":{"login":"skytin1004","id":99078115,"node_id":"U_kgDOBefP4w","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOMz8RKM4aH-rv","tag_name":"v0.24.0","target_commitish":"ae61ab7918ba6654352b45fad35cea2d42370e3b","name":"v0.24.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-08T14:28:40Z","updated_at":"2026-11-08T14:29:15Z","published_at":"2026-11-08T14:29:15Z","assets":[],"body":"## Highlights\n\n- Temporarily marks Manipuri (`mni`, Meitei Mayek) translation as unsupported because current model deployments can return English or Latin transliteration while still reporting success.\n- Excludes `mni` from `all` translation runs and supported-language discovery.\n- Rejects explicit `mni` requests before provider checks or model calls across the CLI and public APIs.\n- Preserves existing `translations/mni` output-directory handling, so prior files are not reclassified as source content.\n- Updates English and localized language-table documentation to remove the unavailable translation link.\n\nManipuri support will be re-evaluated after future model updates and restored once Meitei Mayek script-quality checks pass reliably.\n\n## Verification\n\n- CI passed on Python 3.11, 3.12, 3.13, and 3.14.\n- CodeQL, CLA, requirements, and GitHub Pages artifact checks passed.\n- Local test suite: 590 passed (excluding tests that require live API credentials).\n- Documentation: 827 routes and 68,800 local article links validated.\n- The 0.24.0 source distribution and wheel were built, installed in isolation, and confirmed to report version `0.24.0`.\n\n## What's Changed\n\n- Core: Mark Manipuri translation as temporarily unsupported by @skytin1004 in #583\n- Build: Bump version to 0.24.0 by @skytin1004 in #584\n\n**Full Changelog**: https://github.com/Azure/co-op-translator/compare/v0.23.3...v0.24.0\n","mentions_count":1}
