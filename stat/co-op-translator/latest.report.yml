{"id":420679346,"author":{"login":"skytin1004","id":99078115,"node_id":"U_kgDOBefP4w","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOMz8RKM4ZEw6y","tag_name":"v0.23.2","target_commitish":"main","name":"Co-op Translator 0.23.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-22T12:04:42Z","updated_at":"2026-10-22T12:13:09Z","published_at":"2026-10-22T12:13:09Z","assets":[],"body":"## Highlights\r\n\r\n- Fixed translation failures caused by valid inline-code placeholder reordering in languages such as Simplified Chinese.\r\n- The validator now permits reordering only within the same plain-text line when the exact placeholder multiset is preserved.\r\n- Markdown structure safeguards remain strict for tables, links, emphasis, math, grouping, code blocks, and cross-line movement.\r\n- Diagnostics now identify the first unsafe source line and protected token, making failures easier to trace.\r\n\r\nThis fixes the production `zh-CN` `CHANGELOG.md` case without relying on progressively smaller chunks or switching models.\r\n\r\n## Dependency updates\r\n\r\n- Pillow 12.3.0 → 13.0.0\r\n- MCP 1.29.1 → 1.30.0\r\n- multidict 6.7.1 → 6.9.1\r\n\r\n## What's Changed\r\n\r\n- Core: Allow safe inline-code placeholder reordering by @skytin1004 in https://github.com/Azure/co-op-translator/pull/572\r\n- Build(deps): Bump pillow from 12.3.0 to 13.0.0 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/571\r\n- Build(deps): Bump multidict from 6.7.1 to 6.9.1 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/565\r\n- Build(deps): Bump mcp from 1.29.1 to 1.30.0 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/569\r\n- Build: Bump version to 0.23.2 by @skytin1004 in https://github.com/Azure/co-op-translator/pull/574\r\n\r\n**Full Changelog**: https://github.com/Azure/co-op-translator/compare/v0.23.1...v0.23.2","mentions_count":2}
