{"id":379009126,"author":{"login":"skytin1004","id":99078115,"node_id":"U_kgDOBefP4w","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOMz8RKM4Wlzhm","tag_name":"v0.20.1","target_commitish":"main","name":"v0.20.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-29T13:03:15Z","updated_at":"2026-08-29T14:26:43Z","published_at":"2026-08-29T14:26:43Z","assets":[],"body":"## Co-op Translator v0.20.1\r\n\r\nThis patch release improves Markdown translation reliability, makes dry runs credential-free across every interface, and strengthens dependency and CI reproducibility.\r\n\r\n### Highlights\r\n\r\n- Preserved Markdown URL destinations during translation, including inline links, reference links, images, autolinks, and supported HTML attributes.\r\n- Prevented Markdown tables from breaking when they span multiple translation chunks.\r\n- Made dry runs credential-free and write-free across the CLI, Python API, and MCP.\r\n- Pinned third-party GitHub Actions to immutable full-length commit SHAs.\r\n- Improved Python 3.12 installation compatibility and synchronized Poetry and pip dependency manifests.\r\n\r\n### Markdown Reliability\r\n\r\n- URL destinations are now protected before content is sent to the translation provider.\r\n- Link query parameters, fragments, image paths, and file paths are preserved during rewriting.\r\n- Markdown syntax is identified using `markdown-it-py` without rendering the parsed document back to Markdown.\r\n- Placeholder validation detects missing, duplicated, or modified protected destinations.\r\n- Translated chunks are reassembled without inserting extra newlines that could terminate tables.\r\n- Agent-assisted Markdown translation uses the same URL protection behavior.\r\n\r\n### Credential-Free Dry Runs\r\n\r\nDry runs no longer require LLM or Vision provider credentials.\r\n\r\nThis behavior is supported across:\r\n\r\n- CLI `--dry-run`\r\n- Python API project translation\r\n- MCP `run_translation`\r\n\r\nDry runs now:\r\n\r\n- Skip provider initialization and connectivity checks.\r\n- Avoid writing translations, metadata, logs, or NDJSON event files.\r\n- Avoid confirmation prompts when estimating `all` or `--update` operations.\r\n- Reject `--fix --dry-run`, which cannot produce an accurate low-confidence retranslation estimate.\r\n\r\n### Build, Security, and Dependencies\r\n\r\n- Pinned third-party GitHub Actions to immutable commit SHAs.\r\n- Disabled repository-managed Dependabot version-update PRs after completing the current maintenance batch.\r\n- Added CI coverage that verifies provider-independent tests without dummy credentials.\r\n- Added a Python 3.12 requirements installation and compatibility check.\r\n- Synchronized direct runtime and development dependencies across `pyproject.toml`, `requirements.txt`, and `requirements-dev.txt`.\r\n- Updated `markdown-it-py`, `cryptography`, `Pillow`, `aiohttp`, `python-dotenv`, MCP, AnyIO, and other maintained dependencies.\r\n- Updated GitHub Actions used for checkout, Python setup, Pages deployment, Docker Buildx, and QEMU.\r\n\r\n### Documentation\r\n\r\n- Fixed broken links in the documentation quickstart section.\r\n\r\n### Compatibility\r\n\r\nNo breaking changes are expected. Existing CLI commands, Python API calls, and MCP tools continue to work.\r\n\r\n### Validation\r\n\r\nThis release was validated with:\r\n\r\n- 354 passing tests on the final combined codebase.\r\n- CI coverage on Python 3.10, 3.11, and 3.12.\r\n- A clean Python 3.12 requirements installation and dependency compatibility check.\r\n- Real-provider Markdown translation through the CLI and Python API.\r\n- MCP stdio initialization, tool discovery, and real-provider translation.\r\n- URL and inline-code preservation checks.\r\n- Azure OpenAI and Azure AI Vision connectivity checks.\r\n- Ruff, Black, Poetry lock validation, CodeQL, and workflow checks.\r\n\r\n## What's Changed\r\n\r\n* Build(deps): Bump asttokens from 2.4.1 to 3.0.1 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/482\r\n* Build(deps): Bump charset-normalizer from 3.4.1 to 3.4.9 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/497\r\n* Build(deps): Bump psutil from 5.9.8 to 7.2.2 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/496\r\n* Build(deps): Bump mcp from 1.27.0 to 1.28.1 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/498\r\n* Build(deps): Bump anyio from 4.4.0 to 4.14.2 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/500\r\n* Build(deps): Bump kiwisolver from 1.4.8 to 1.5.0 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/499\r\n* Core: Prevent Markdown tables from breaking across translation chunks by @skytin1004 in https://github.com/Azure/co-op-translator/pull/508\r\n* Build(deps): Bump cryptography from 48.0.1 to 50.0.0 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/507\r\n* Build: Restore default Dependabot pull request limits by @skytin1004 in https://github.com/Azure/co-op-translator/pull/512\r\n* Build: Disable Dependabot version updates by @skytin1004 in https://github.com/Azure/co-op-translator/pull/515\r\n* Build(deps): Bump pillow from 12.2.0 to 12.3.0 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/484\r\n* Build(deps): Bump aiohttp from 3.14.1 to 3.14.3 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/506\r\n* Build(deps): Bump python-dotenv from 1.0.1 to 1.2.3 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/514\r\n* Build(deps): Bump actions/checkout from 4 to 7 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/479\r\n* Build(deps): Bump actions/setup-python from 5 to 7 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/513\r\n* Build(deps): Bump actions/deploy-pages from 4 to 5 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/480\r\n* Build(deps): Bump docker/build-push-action from 6 to 7 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/477\r\n* Update links in quickstart section to markdown files by @hyoshioka0128 in https://github.com/Azure/co-op-translator/pull/510\r\n* Build(deps): Bump markdown-it-py from 3.0.0 to 4.2.0 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/487\r\n* Build(deps): Bump docker/setup-qemu-action from 3 to 4 by @dependabot[bot] in https://github.com/Azure/co-op-translator/pull/478\r\n* Pin GitHub Actions to full-length commit SHAs by @danfiedler-msft in https://github.com/Azure/co-op-translator/pull/516\r\n* Core: Preserve Markdown URLs during translation by @skytin1004 in https://github.com/Azure/co-op-translator/pull/509\r\n* Build: Make provider tests environment-independent by @skytin1004 in https://github.com/Azure/co-op-translator/pull/517\r\n* Core: Make dry-run credential-free across all interfaces by @skytin1004 in https://github.com/Azure/co-op-translator/pull/518\r\n* Build: Synchronize runtime dependency manifests by @skytin1004 in https://github.com/Azure/co-op-translator/pull/519\r\n* Build: Bump version to 0.20.1 by @skytin1004 in https://github.com/Azure/co-op-translator/pull/520\r\n\r\n## New Contributors\r\n\r\n* @danfiedler-msft made their first contribution in https://github.com/Azure/co-op-translator/pull/516\r\n\r\n**Full Changelog**: https://github.com/Azure/co-op-translator/compare/v0.20.0...v0.20.1","mentions_count":4}
