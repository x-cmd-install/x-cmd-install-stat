d_at":"2026-09-04T02:44:25Z"},{"id":543679640,"node_id":"RA_kwDOIwoHZc4gZ-SY","name":"copa_0.15.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9443653,"digest":"sha256:2444b6109c6164beef980641ec5f2813bc42b1703add6dd73591ace23051ca8f","download_count":67,"created_at":"2026-09-04T02:44:24Z","updated_at":"2026-09-04T02:44:25Z"},{"id":543679675,"node_id":"RA_kwDOIwoHZc4gZ-S7","name":"copa_0.15.0_linux_arm64.tar.gz.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":215402,"digest":"sha256:28bba5df75310ce90e98428b7cb74cdffe58494da92232897a185d274ce37c1e","download_count":5,"created_at":"2026-09-04T02:44:25Z","updated_at":"2026-09-04T02:44:25Z"}],"body":"Copacetic v0.15.0 expands support for minimal and application-centric workloads, led by Ubuntu Chiseled image patching and experimental Helm chart-aware patching. This release also adds SLES 16 support and includes substantial correctness, reproducibility, and performance improvements.\n\n## \u2728 Highlights\n\n### Ubuntu Chiseled image patching\n\nCopa can now patch both common Ubuntu Chiseled image layouts:\n\n- Apt-less images that retain a full `/var/lib/dpkg/status` support targeted updates from scanner reports and comprehensive updates without a report. Copa applies updates through external Ubuntu tooling while preserving the full-status representation; the final image does not gain `/var/lib/dpkg/status.d`, apt, dpkg, BusyBox, or a shell.\n- Native images containing `/var/lib/chisel/manifest.wall` support comprehensive re-cuts of their selected Chisel slices. Copa validates the manifest and resulting filesystem, preserves paths not owned by the original manifest and unaffected platform descriptors, rejects downgrades, and records the resolved Chisel release as OCI provenance.\n\nNative Chisel release selection can be inferred from `/etc/os-release` or overridden with `--chisel-release`. The CLI and bulk mode accept a named release, local release directory, or pinned HTTPS Git source; the BuildKit frontend accepts a named release or a supplied local build context and rejects Git URLs.\n\nSee the [Ubuntu Chiseled image documentation](https://project-copacetic.github.io/copacetic/website/chiseled-images) and [#1667](https://github.com/project-copacetic/copacetic/pull/1667).\n\n### Experimental Helm chart-aware patching\n\nThe experimental chart mode renders a Helm chart with its default values, discovers images from supported Kubernetes workload locations, patches those images, and publishes a self-contained wrapper chart containing the patched image overrides. Patched images remain in their original repositories in single-chart mode; bulk `PatchConfig` supports a separate image target registry and explicit value-path overrides where automatic resolution is ambiguous.\n\nChart mode requires the Helm CLI, `COPA_EXPERIMENTAL=1`, `--push`, and credentials that can push both the patched images and wrapper chart.\n\nSee the [bulk and Helm chart patching documentation](https://project-copacetic.github.io/copacetic/website/bulk-image-patching) and [#1547](https://github.com/project-copacetic/copacetic/pull/1547).\n\n### SLES 16 support\n\nCopa now supports SLES 16 BCI images and recognizes the SQLite RPM database used by SLES 16 alongside the existing NDB and Berkeley DB formats. Multi-platform fixtures and package-manager coverage were added for the new release.\n\nSee [#1621](https://github.com/project-copacetic/copacetic/pull/1621).\n\n## \ud83d\udc1b Patching correctness and reliability\n\n- **Local image resolution** \u2014 Docker and Podman inspection is preferred before registry fallback, improving support for local-only images and avoiding unnecessary remote lookups. ([#1614](https://github.com/project-copacetic/copacetic/pull/1614))\n- **Reliable RPM repatching** \u2014 successive updates now compute changes from the current patched state, preventing stale files from being reintroduced. ([#1589](https://github.com/project-copacetic/copacetic/pull/1589))\n- **Bounded image inspection** \u2014 media-type discovery now honors patch cancellation and timeout contexts instead of allowing daemon or registry calls to block indefinitely. ([#1587](https://github.com/project-copacetic/copacetic/pull/1587))\n- **Platform and VEX correctness** \u2014 platform discovery no longer panics on descriptors without platform metadata, and generated OpenVEX documents now include the required vulnerability name field for schema compliance. ([#1672](https://github.com/project-copacetic/copacetic/pull/1672))\n\n## \ud83e\uddea Application-level Go patching\n\nExperimental Go patching is more reliable and reproducible:\n\n- `go mod tidy -e` allows CVE-relevant updates to proceed when an upstream project has unrelated module-graph problems. ([#1602](https://github.com/project-copacetic/copacetic/pull/1602))\n- Pre-modules major-version dependencies such as `github.com/docker/docker` receive the required `+incompatible` suffix. ([#1682](https://github.com/project-copacetic/copacetic/pull/1682))\n- Copa skips stale scanner fixes that would downgrade or reinstall an equal Go dependency and avoids claiming those skipped findings as remediated in VEX output. ([#1683](https://github.com/project-copacetic/copacetic/pull/1683))\n- Go update lists, generated `go.mod` requirements, and rebuild steps are emitted deterministically. ([#1680](https://github.com/project-copacetic/copacetic/pull/1680))\n\n## \u26a1 Performance and maintenance\n\nVEX generation, VEX file output, tar hardlink rewriting, BuildKit progress forwarding, and terminal progress bookkeeping now use substantially fewer allocations and less CPU in large workloads. ([#1639](https://github.com/project-copacetic/copacetic/pull/1639))\n\nThe release also updates BuildKit to 0.31.1 ([#1675](https://github.com/project-copacetic/copacetic/pull/1675)), containerd to 2.2.5 ([#1631](https://github.com/project-copacetic/copacetic/pull/1631)), Go to 1.25.13 ([#1673](https://github.com/project-copacetic/copacetic/pull/1673)), and gRPC to 1.83.1 ([#1694](https://github.com/project-copacetic/copacetic/pull/1694)), while expanding unit, integration, and end-to-end coverage across patching paths.\n\n## \u26a0\ufe0f Important usage notes\n\n- Native `manifest.wall` Chiseled images currently support comprehensive patching only; do not pass a vulnerability report. Trivy does not yet inventory packages from `manifest.wall`.\n- Updating an apt-less full-status Chiseled image installs content from complete `.deb` archives and can add dependency packages or package-owned files that were not present in the original image. Maintainer scripts and dpkg triggers are disabled, lifecycle-package updates such as `dpkg`, `apt`, or `bash` are rejected, and the resulting filesystem and application should be validated before deployment.\n- Initial native Chisel support resolves public Ubuntu archives only. Ubuntu Pro, ESM, FIPS, private mirrors, and authenticated archives are not forwarded.\n- Native Chisel patching does not support `linux/arm/v6`.\n- Helm chart-aware patching remains experimental. Single-chart mode has no custom values-file input, so it discovers only images visible in the default render and supported workload shapes. Digest-pinned images and ambiguous value paths are rejected rather than silently publishing unsafe overrides.\n\n## \ud83d\udce6 Install or upgrade\n\nSee the [installation guide](https://project-copacetic.github.io/copacetic/website/installation). Release assets include Linux and macOS archives for amd64 and arm64, checksums, and SBOMs.\n\n## \ud83d\ude4c Contributors\n\nThank you to @AruneshDwivedi, @SAY-5, @ashnamehrotra, @cwayne18, @jpinz, @omercnet, @robert-cronin, @sozercan, @y4ney, and everyone who tested, reviewed, documented, and reported issues for this release.\n\n## \ud83d\udccb Full changelog\n\n**All changes since v0.14.0:** https://github.com/project-copacetic/copacetic/compare/v0.14.0...v0.15.0\n\nThe v0.14.1 and v0.14.2 patch fixes are also included in v0.15.0; see the [v0.14.1](https://github.com/project-copacetic/copacetic/releases/tag/v0.14.1) and [v0.14.2](https://github.com/project-copacetic/copacetic/releases/tag/v0.14.2) release notes.\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":9}
