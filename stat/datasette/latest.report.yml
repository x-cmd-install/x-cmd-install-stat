{"id":386701554,"author":{"login":"simonw","id":9599,"node_id":"MDQ6VXNlcjk1OTk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBm6k_c4XDJjy","tag_name":"0.65.4","target_commitish":"0.65.x","name":"0.65.4","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-10T23:49:34Z","updated_at":"2026-09-11T00:06:55Z","published_at":"2026-09-11T00:06:55Z","assets":[],"body":"This release includes security fixes for permissions, SQL construction and caching, backported to the stable 0.65.x branch.\r\n\r\nSee [1.0a39](https://docs.datasette.io/en/latest/changelog.html#v1-0-a39) for the full set of security fixes and other improvements in the 1.0 alpha series.\r\n\r\nThe Datasette blog [has more details on these releases](https://datasette.io/blog/2026/september-security-releases/).\r\n\r\nSome of the security fixes include:\r\n\r\n- Table and view permission checks now take SQLite's case-insensitive names into account. See [Controlling access to specific tables and views](https://docs.datasette.io/en/stable/authentication.html#authentication-permissions-table).  \r\n- Table filters using `?_through=` require permission to view the intermediate table.  \r\n- Fixed SQL identifier escaping for primary-key column names from untrusted database schemas, including row lookups and pagination.  \r\n- Full-text search index detection now uses parameterized SQL and treats wildcard characters in table names literally.  \r\n- Private and personalized dynamic responses now use `Cache-Control: private, no-store`. Anonymous dynamic responses vary by `Cookie` and `Authorization`.  \r\n- SQLite extension loading is disabled after extensions supplied using `--load-extension` have been loaded.\r\n\r\n### Other improvements and fixes\r\n\r\n- Backported the non-blocking write task ID fixes from [#2861](https://github.com/simonw/datasette/issues/2861) by [Zain Dana Harper (HarperZ9)](https://github.com/HarperZ9). `execute_write_fn(block=False)` now returns a unique UUID for each call, including when `num_sql_threads=0`.","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
