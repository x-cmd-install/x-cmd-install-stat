{"id":8810573,"author":{"login":"regebro","id":820596,"node_id":"MDQ6VXNlcjgyMDU5Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"MDc6UmVsZWFzZTg4MTA1NzM=","tag_name":"0.8.2","target_commitish":"release-0.8","name":"0.8.2 - Release for PyPI upload","draft":false,"immutable":false,"prerelease":false,"created_at":"2017-12-07T11:01:17Z","updated_at":"2017-12-07T11:04:11Z","published_at":"2017-12-07T11:04:11Z","assets":[],"body":"This is a minor release to fix the upload to PyPI.\r\n\r\nChanges since 0.7:\r\n\r\n- Add option -M/--meta to add or update document metadata during conversion\r\n- Add option -I/--input-filter-name to specify input format (Martijn van de Streek)\r\n- Added setup.py to support standard Python installs, like pip, etc.\r\n- Dropped support for OpenOffice 3.3 and 3.4\r\n- Fix for Python 3 to read binary data from stdin (Carlos Noguera)\r\n- Fix for password protected files (Marijn Ophorst)\r\n- Make -F switch working for user-defined fields (Belegnar)\r\n"}
