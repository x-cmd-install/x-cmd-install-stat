c4W07_6","name":"cy_1.12.0_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9722372,"digest":"sha256:6b3dc30cb53ecf72fe78d34f56d19af2303e056632a2eaf265b9058268f1ed42","download_count":145,"created_at":"2026-03-27T15:57:12Z","updated_at":"2026-03-27T15:57:13Z"}],"body":"- Layout `pane` node renamed to `view`\n- Pane zooming: hit `ctrl+a z` to zoom in on a pane in a layout\n- Many copy mode features:\n    - Visual line and visual block selection\n    - Vim's `zt`, `zb`, `zz` scrolling commands\n    - `ctrl+y`/`ctrl+e` line scrolling\n- Styled and colored underline support\n- New API functions: [`(cmd/execute)`](https://cfoust.github.io/cy/api#cmdexecute), [`(cmd/wait)`](https://cfoust.github.io/cy/api#cmdwait), [`(tree/id)`](https://cfoust.github.io/cy/api#treeid), [`(cy/version)`](https://cfoust.github.io/cy/api#cyversion)\n- New `:meta` property for layout nodes\n- Update Janet to 1.40.1\n- Fix: `(input/find)` no longer recalculates column sizes on every render\n- Fix: tabs `inactive-fg` not applied correctly\n- Fix: params now passed to replay opened with mousewheel\n- Other miscellaneous fixes and performance improvements"}
