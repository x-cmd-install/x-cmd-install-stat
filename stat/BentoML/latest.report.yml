{"id":422252033,"author":{"login":"saschwanbeck","id":1526841,"node_id":"MDQ6VXNlcjE1MjY4NDE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCqr3Ec4ZKw4B","tag_name":"v1.4.40","target_commitish":"0aa1aea52b63b82100ff93675eff25f6428fb841","name":"v1.4.40","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-23T17:46:52Z","updated_at":"2026-10-23T19:51:33Z","published_at":"2026-10-23T19:51:33Z","assets":[],"body":"## Security: eMudhra intermediate CA compromise\n\n- **\\`certifi>=2026.10.19\\`** is now required. It drops trust in the compromised eMudhra/emSign CAs.\n- Generated Dockerfiles and local \\`bentoml build\\` install **\\`uv==0.13.4\\` with \\`--require-hashes\\`** whenever uv is missing or older (uv < 0.13.4 bundles the compromised CAs). pip 26.2.2 is used where supported. (#5757)\n\n**Action for users:** run \\`bentoml build\\` again with 1.4.40, then redeploy, so your bento image picks up the fixed certifi and uv.\n\n## Also in this release\n\n- Agent skills for creating BentoML projects and for deploying to Kubernetes and EC2 (#5705, #5683)\n- Windows tar symlink extraction and fastai CI dependency resolution fix (#5689)\n- Docs and CI updates (#5710, #5715, #5741, #5702, #5758, #5759, #5760)\n\n**Full Changelog**: https://github.com/bentoml/BentoML/compare/v1.4.39...v1.4.40"}
