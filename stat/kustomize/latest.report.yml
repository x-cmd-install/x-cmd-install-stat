at":"2026-09-30T12:55:58Z","updated_at":"2026-09-30T12:55:58Z"},{"id":600925244,"node_id":"RA_kwDOB-5y6s4j0WQ8","name":"kustomize_v5.8.2_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5281833,"digest":"sha256:a78b380ee56c49db82213d31965eb50626ecec2b835abea0524471ff8effb653","download_count":135,"created_at":"2026-09-30T12:55:58Z","updated_at":"2026-09-30T12:55:58Z"},{"id":600925246,"node_id":"RA_kwDOB-5y6s4j0WQ-","name":"kustomize_v5.8.2_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4699748,"digest":"sha256:3b3b945b6a2168eb3961bde67a142ad9f01ef9ae8417152b1c0058c7bbe5a599","download_count":22,"created_at":"2026-09-30T12:55:58Z","updated_at":"2026-09-30T12:55:59Z"}],"body":"## Introduction\r\n\r\nIn this release, we implemented refactoring to update dependencies and add new features.\r\n\r\nThis release adds the `kustomize edit add configuration` and `kustomize edit remove component` commands. #6037 #6083\r\nThe built-in OpenAPI schema is now loaded from a pre-compiled bundle embedded in the binary. #6190\r\nThe schema itself is still based on Kubernetes v1.21.2, so the output of `kustomize build` is not expected to change. If you notice any difference, please file an issue.\r\n\r\n## Feature\r\n#6037: feat: add support for 'kustomize edit add configuration' command\r\n#6083: Add kustomize edit remove component command\r\n\r\n## fix\r\n#6263: fix: report an error when the fetched openapi schema is not JSON\r\n\r\n## Dependencies\r\n#6075: update go 1.25.7\r\n#6078: bump go-git and x/crypt\r\n#6085: update otel lib to v1.40.0\r\n#6134: drop 'go-spew' dependencies and update dependencies\r\n#6138: bump k8s.io/kube-openapi, drop github.com/mailru/easyjson\r\n#6186: bump/go v1.26.5\r\n#6187: update vuln dependencies at 2026/07\r\n#6236: chore: bump stretch/testify pkg to remove old yaml dependencies\r\n#6248: build(deps): bump golang.org/x/text from 0.38.0 to 0.41.0\r\n#6249: build(deps): bump go.yaml.in/yaml/v2 from 2.4.2 to 2.4.4\r\n#6251: build(deps): bump github.com/go-errors/errors from 1.4.2 to 1.5.1\r\n#6254: build(deps): bump github.com/google/gnostic-models from 0.7.0 to 0.7.1\r\n#6255: build(deps): bump google.golang.org/protobuf from 1.36.11 to 1.36.12\r\n#6256: build(deps): bump golang.org/x/sys from 0.45.0 to 0.47.0\r\n#6266: build(deps): bump golang.org/x/text from 0.41.0 to 0.42.0\r\n#6267: build(deps): bump golang.org/x/sys from 0.47.0 to 0.48.0\r\n#6273: bump go-git, kin-openapi and k8s.io\r\n\r\n## chore\r\n#6190: chore: refactor read scheme to openapi from kubernetes api definition\r\n#6274: build: use the golangci-lint v2 with release binary\r\n#6305: Update kyaml to v0.21.2\r\n#6306: Update cmd/config to v0.21.2\r\n#6307: Update api to v0.21.2"}
