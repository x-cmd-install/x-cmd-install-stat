{"id":388471140,"author":{"login":"DietrichGebert","id":137048761,"node_id":"U_kgDOCCsyuQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOS4HNr84XJ5lk","tag_name":"v4.10.0","target_commitish":"main","name":"v4.10.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-14T14:33:33Z","updated_at":"2026-09-14T14:38:57Z","published_at":"2026-09-14T14:38:56Z","assets":[],"body":"Two new homes for Ponytail. The headline: native Cursor support through `hooks.json`, with a `scripts/cursor-hooks.js install` that merges into your existing Cursor hooks file and leaves everything else in it alone. Also new: a Grok Build skills adapter, VS Code Copilot is finally detected correctly (no more Claude Code statusline nudge there), and the Claude.ai marketplace validator accepts the plugin again.\n\n## What's Changed\n* fix: drop commandWindows from hooks.json for Claude.ai marketplace validation (#593) by @prayag0one4 in https://github.com/DietrichGebert/ponytail/pull/601\n* fix: detect VS Code Copilot via CLAUDE_PLUGIN_ROOT fallback (#528) by @krishrathi1 in https://github.com/DietrichGebert/ponytail/pull/579\n* feat: add Grok Build native skills adapter (revive #561) by @p-clements in https://github.com/DietrichGebert/ponytail/pull/661\n* docs: add Trendshift badge to READMEs by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/801\n* docs: add Trendshift monthly ranking badge by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/802\n* docs: put daily, weekly and monthly Trendshift badges in one row by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/803\n* docs: Built with Ponytail, Retriever by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/830\n* feat: add native Cursor hooks via hooks.json (#817) by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/869\n\n## New Contributors\n* @prayag0one4 made their first contribution in https://github.com/DietrichGebert/ponytail/pull/601\n* @p-clements made their first contribution in https://github.com/DietrichGebert/ponytail/pull/661\n\n**Full Changelog**: https://github.com/DietrichGebert/ponytail/compare/v4.9.0...v4.10.0\n","reactions":{"total_count":27,"+1":0,"-1":0,"laugh":0,"hooray":23,"confused":0,"heart":0,"rocket":4,"eyes":0},"mentions_count":4}
