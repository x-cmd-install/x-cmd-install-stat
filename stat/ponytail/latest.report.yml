{"id":407037118,"author":{"login":"DietrichGebert","id":137048761,"node_id":"U_kgDOCCsyuQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOS4HNr84YQuS-","tag_name":"v5.1.0","target_commitish":"main","name":"v5.1.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-08T16:19:38Z","updated_at":"2026-10-08T16:20:18Z","published_at":"2026-10-08T16:20:18Z","assets":[],"body":"Ponytail no longer writes its name into your code. Deliberate shortcuts are now marked with a neutral comment, `shortcut: <the limit>, <when to upgrade>`, and `/ponytail-debt` still finds the old `ponytail:` ones, so nothing in your ledger gets lost. Want another word, or none at all? Say so in your project's CLAUDE.md or AGENTS.md and run `/ponytail-debt <your word>`.\n\nMeasured against 5.0.0 before shipping: same number of markers, same pass rate, same cost.\n\n\n## What's Changed\n* feat: neutral shortcut: marker instead of the ponytail: brand in code comments by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1068\n* chore: release v5.1.0 by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1069\n\n\n**Full Changelog**: https://github.com/DietrichGebert/ponytail/compare/v5.0.0...v5.1.0","reactions":{"total_count":32,"+1":14,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":18,"rocket":0,"eyes":0},"mentions_count":1}
