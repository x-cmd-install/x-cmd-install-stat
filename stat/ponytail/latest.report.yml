{"id":427423589,"author":{"login":"DietrichGebert","id":137048761,"node_id":"U_kgDOCCsyuQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOS4HNr84Zefdl","tag_name":"v5.3.3","target_commitish":"main","name":"v5.3.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-29T03:04:54Z","updated_at":"2026-10-29T03:11:08Z","published_at":"2026-10-29T03:11:08Z","assets":[],"body":"This one cleans up the band. On Team, Enterprise and managed machines the warning on your first prompt is gone, and the band shows your model and session name again. In VS Code it stays on one line, other plugins' commands no longer print under ponytail's name, and the noisy \"duplicate?\" hint is gone.\n\n\n## What's Changed\n* fix(band): show the level again after /clear and /resume by @timofeevAV in https://github.com/DietrichGebert/ponytail/pull/1161\n* fix(map): raise the git ls-files buffer so large repos keep tracked files by @HyperionBurn in https://github.com/DietrichGebert/ponytail/pull/1156\n* ci: run agentic benchmark selftest in test workflow by @ml-lubich in https://github.com/DietrichGebert/ponytail/pull/1154\n* docs: clarify Cursor mode state scope by @Boulea7 in https://github.com/DietrichGebert/ponytail/pull/1135\n* fix(codex): small composer icon instead of the 554 KB logo by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1164\n* fix(hooks): 15 s hook timeout so a slow node start on Windows keeps its output by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1165\n* fix(hooks): give the codebase map 3 s so a slow Windows start keeps it by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1166\n* fix(bench): wait for the killed todo server before the workdir cleanup by @devohmycode in https://github.com/DietrichGebert/ponytail/pull/1116\n* fix(band): find the transcript without a classic hook by @trhinehart-attentive in https://github.com/DietrichGebert/ponytail/pull/1242\n* fix(band): watch only /clear, /resume and /branch, so other plugins' output is not labelled ponytail by @ph3on1x in https://github.com/DietrichGebert/ponytail/pull/1291\n* fix(band): size the row to bodyColumns only in the terminal by @lelmarir in https://github.com/DietrichGebert/ponytail/pull/1302\n* fix(band): drop the duplicate? hint, count only project files, tighter details view by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1305\n* chore: release v5.3.3 by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1307\n\n## New Contributors\n* @timofeevAV made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1161\n* @HyperionBurn made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1156\n* @ml-lubich made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1154\n* @trhinehart-attentive made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1242\n* @ph3on1x made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1291\n* @lelmarir made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1302\n\n**Full Changelog**: https://github.com/DietrichGebert/ponytail/compare/v5.3.2...v5.3.3","reactions":{"total_count":5,"+1":3,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":9}
