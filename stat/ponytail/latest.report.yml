{"id":404026710,"author":{"login":"DietrichGebert","id":137048761,"node_id":"U_kgDOCCsyuQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOS4HNr84YFPVW","tag_name":"v4.13.0","target_commitish":"main","name":"v4.13.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-05T18:50:57Z","updated_at":"2026-10-05T18:54:45Z","published_at":"2026-10-05T18:54:43Z","assets":[],"body":"This release is mostly about ponytail staying at the level you set. Switching levels on Codex now delivers the new level's rules, each project keeps its own mode, off really means off, and the statusline badge survives plugin updates. Kimi Code joins as a new host, the README now also comes in Spanish, Korean, Simplified Chinese and Japanese, and ZCode support is dropped.\n\n## What's Changed\n* fix(hooks): preserve mode on invalid arguments by @l2yujw in https://github.com/DietrichGebert/ponytail/pull/677\n* fix(hooks): don't emit a second JSON object on Qoder report-only /pon\u2026 by @adiraj66132 in https://github.com/DietrichGebert/ponytail/pull/617\n* fix(qoder): persist off mode across prompts by @l2yujw in https://github.com/DietrichGebert/ponytail/pull/676\n* fix(hooks): silence off-mode SessionStart by @connerohnesorge in https://github.com/DietrichGebert/ponytail/pull/687\n* Normalize default-mode parsing and add regression test by @thb-hash in https://github.com/DietrichGebert/ponytail/pull/716\n* Fix Codex Ponytail mode instructions by @nainbaloch in https://github.com/DietrichGebert/ponytail/pull/932\n* docs: use the namespaced $ponytail:<skill> form for Codex by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1035\n* fix: avoid deleting similarly named statuslines by @Yananix in https://github.com/DietrichGebert/ponytail/pull/848\n* fix(uninstall): remove statusline nudge flag by @l2yujw in https://github.com/DietrichGebert/ponytail/pull/680\n* fix(uninstall): remove the mode flag from every host state dir by @Soumyadip2003-AI in https://github.com/DietrichGebert/ponytail/pull/788\n* fix(pi): expand the skill aliases and forward their arguments by @FourWindff in https://github.com/DietrichGebert/ponytail/pull/942\n* fix(pi-extension): clear disabled footer status by @ben-reitz in https://github.com/DietrichGebert/ponytail/pull/850\n* fix(pi): restore branch mode after /tree navigation by @ghdtjdwn in https://github.com/DietrichGebert/ponytail/pull/828\n* test(pi): expect the cleared status in the session_tree test by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1038\n* docs: add Oh My Pi (omp) install and uninstall instructions by @Kabir-Sidhu in https://github.com/DietrichGebert/ponytail/pull/931\n* fix: resolve silent deactivation, probe timeout, and stdin swallowing by @umran666 in https://github.com/DietrichGebert/ponytail/pull/636\n* fix(qoder): expand ${QODER_PLUGIN_ROOT} in plugin hook commands by @lingbin in https://github.com/DietrichGebert/ponytail/pull/598\n* fix(hermes): reject review as a default mode by @Iams4kura in https://github.com/DietrichGebert/ponytail/pull/700\n* fix(hermes): honor default-mode config with a UTF-8 BOM by @kapelame in https://github.com/DietrichGebert/ponytail/pull/873\n* test(hermes): isolate the Python helper from the developer's ponytail config by @TonyWu2333 in https://github.com/DietrichGebert/ponytail/pull/1025\n* fix: identify Node built-in imports by @Zethu5 in https://github.com/DietrichGebert/ponytail/pull/775\n* chore: drop unused assets and pi-extension tests from the npm package by @EckiTannenweg in https://github.com/DietrichGebert/ponytail/pull/939\n* fix(hooks): prevent project mode state collisions by @Vaishnavi220506 in https://github.com/DietrichGebert/ponytail/pull/1037\n* fix(statusline): point the badge at a copy that survives plugin updates by @phant0um in https://github.com/DietrichGebert/ponytail/pull/1033\n* docs(install): document opencode plugin add for OpenCode 2 by @amn