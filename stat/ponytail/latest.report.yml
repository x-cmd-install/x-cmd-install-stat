{"id":411161955,"author":{"login":"DietrichGebert","id":137048761,"node_id":"U_kgDOCCsyuQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOS4HNr84YgdVj","tag_name":"v5.2.0","target_commitish":"main","name":"v5.2.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-13T01:46:20Z","updated_at":"2026-10-13T01:48:47Z","published_at":"2026-10-13T01:48:47Z","assets":[],"body":"Mostly fixes for the level you pick. It now survives context compaction instead of falling back to the default, and on macOS the hooks can no longer lose their output, so the ruleset always arrives.\n\nAlso in here: the Cursor installer leaves hooks.json files it doesn't understand alone and no longer removes your own hooks with a similar name, OpenCode doesn't get stuck in review anymore and supports `/ponytail default`, pi completes `/ponytail` arguments, and OMP starts new sessions at the default level. Thanks to everyone who sent fixes!\n\n\n## What's Changed\n* fix(bench): a crashed cell no longer crashes the run summary by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1110\n* docs: manual Hermes install until Hermes fixes its plugin.json check by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1111\n* feat(pi-extension): autocomplete /ponytail arguments by @ruttybob in https://github.com/DietrichGebert/ponytail/pull/1080\n* fix(hooks): write hook output synchronously so process.exit cannot drop it by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1112\n* fix: preserve invalid Cursor hook configurations during install by @ac1982 in https://github.com/DietrichGebert/ponytail/pull/1059\n* fix(cursor-hooks): preserve similarly named user hooks by @LurigeLars in https://github.com/DietrichGebert/ponytail/pull/1052\n* fix(qoder): honor QODER_CONFIG_DIR for mode state by @Vaishnavi220506 in https://github.com/DietrichGebert/ponytail/pull/1057\n* fix: keep the live ponytail level across context compaction by @devohmycode in https://github.com/DietrichGebert/ponytail/pull/1074\n* fix(opencode): never save review as a level, support /ponytail default by @manuvarghese456-collab in https://github.com/DietrichGebert/ponytail/pull/1103\n* fix(pi): restore the session's mode after OMP session switches by @andrebrait in https://github.com/DietrichGebert/ponytail/pull/1050\n* chore(hermes): drop the unreachable review mode by @manuvarghese456-collab in https://github.com/DietrichGebert/ponytail/pull/1105\n* fix(uninstall): remove the OpenCode mode flag by @manuvarghese456-collab in https://github.com/DietrichGebert/ponytail/pull/1104\n* test: compare the statusline copy path JSON-escaped in hooks.test.js by @Bettinho179 in https://github.com/DietrichGebert/ponytail/pull/1046\n* chore: release v5.2.0 by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1113\n\n## New Contributors\n* @ruttybob made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1080\n* @ac1982 made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1059\n* @LurigeLars made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1052\n* @devohmycode made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1074\n* @manuvarghese456-collab made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1103\n* @andrebrait made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1050\n* @Bettinho179 made their first contribution in https://github.com/DietrichGebert/ponytail/pull/1046\n\n**Full Changelog**: https://github.com/DietrichGebert/ponytail/compare/v5.1.1...v5.2.0","reactions":{"total_count":14,"+1":10,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":9}
