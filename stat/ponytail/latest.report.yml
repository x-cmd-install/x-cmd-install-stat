{"id":406394111,"author":{"login":"DietrichGebert","id":137048761,"node_id":"U_kgDOCCsyuQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOS4HNr84YORT_","tag_name":"v5.0.0","target_commitish":"main","name":"v5.0.0: Ponytail 5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-08T03:51:18Z","updated_at":"2026-10-08T03:51:52Z","published_at":"2026-10-08T03:51:52Z","assets":[],"body":"Ponytail 5 is rebuilt from the ground up: new rules, a new review, a new audit.\n\n- **Rules:** rewritten and about half as long. The goal is the smallest complete change: before it writes, the agent maps everything the change must reach (callers, tests, config) and what it could break. Every reply ends with what it skipped or did not check, and any risk.\n- **Codebase map:** at session start the agent gets a short map of what already exists in the repo, so it reuses before it writes.\n- **`/ponytail-review`:** rebuilt as a full review: bugs, security, real load, missing tests, speed, and what to cut. It reads the code the change touches, not just the diff. Each finding says what the code does, what goes wrong, how to fix it, and what happens if you skip it.\n- **`/ponytail-audit`:** the same checks for the whole repo, ranked, with what to fix first.\n\nAgainst the same agent without the skill (Claude Code, Opus 5.5, 39 tasks including a real FastAPI + React repo, 5 runs each): -53% code, -41% time, -26% cost, -45% output tokens, and 98% of risky logic ships with a test (without: 68%). Method and limits: [benchmarks/results/2026-10-07-agentic.md](https://github.com/DietrichGebert/ponytail/blob/main/benchmarks/results/2026-10-07-agentic.md).\n\n\n## What's Changed\n* chore: remove unused ballast found in the repo inventory by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1042\n* chore: move translations, CONTRIBUTING and .env.example out of the repo root by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1044\n* feat: Ponytail 5, rebuilt rules, review and audit by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1061\n* chore: release v5.0.0 by @DietrichGebert in https://github.com/DietrichGebert/ponytail/pull/1062\n\n\n**Full Changelog**: https://github.com/DietrichGebert/ponytail/compare/v4.13.0...v5.0.0","reactions":{"total_count":8,"+1":7,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
