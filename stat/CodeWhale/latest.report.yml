t_type":"application/zip","state":"uploaded","size":126431032,"digest":"sha256:2fc17556513d99356a4c9c43ed8b831dbd3a64de4eb8950582d78fce601cad3a","download_count":17,"created_at":"2026-11-22T12:11:01Z","updated_at":"2026-11-22T12:11:20Z"},{"id":778949766,"node_id":"RA_kwDOQ9AYz84ubdSG","name":"codewhale-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":152362496,"digest":"sha256:971c44131afeb68d9db5b20ae3234a4ad210d924e421d777ae5f1f1dea0198e0","download_count":11,"created_at":"2026-11-22T12:11:02Z","updated_at":"2026-11-22T12:11:22Z"},{"id":778949737,"node_id":"RA_kwDOQ9AYz84ubdRp","name":"codewhale-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":126435565,"digest":"sha256:a07a3fa60943a66148b541fb24e14d065dd49efd50480b6d8a65672546ae490d","download_count":12,"created_at":"2026-11-22T12:11:01Z","updated_at":"2026-11-22T12:11:18Z"},{"id":778949740,"node_id":"RA_kwDOQ9AYz84ubdRs","name":"codewhale-windows-x64-portable.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":135866034,"digest":"sha256:452f2d0ef24dc5ff1f6b3ca65a87e72e8c2c2b6ffa0ca8f4ee790d72f379882e","download_count":91,"created_at":"2026-11-22T12:11:01Z","updated_at":"2026-11-22T12:11:21Z"},{"id":778949734,"node_id":"RA_kwDOQ9AYz84ubdRm","name":"codewhale-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":191641600,"digest":"sha256:6fb1a5a3a236aa0a4dadbf76c08ba59824aa978acd11ea89f5bb726631451d3d","download_count":237,"created_at":"2026-11-22T12:11:01Z","updated_at":"2026-11-22T12:11:23Z"},{"id":778949741,"node_id":"RA_kwDOQ9AYz84ubdRt","name":"codewhale-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":135870559,"digest":"sha256:b11f3a144dd7c422114a5aaa99ab58493500f690f7e1c6a0ee199da850e4ef76","download_count":26,"created_at":"2026-11-22T12:11:01Z","updated_at":"2026-11-22T12:11:20Z"},{"id":778949735,"node_id":"RA_kwDOQ9AYz84ubdRn","name":"codewhale.bat","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":196,"digest":"sha256:1c330fc3ca5530438d6d787951faf00893af4e5fa4b5326f0c167ee974790d16","download_count":11,"created_at":"2026-11-22T12:11:01Z","updated_at":"2026-11-22T12:11:02Z"},{"id":778949769,"node_id":"RA_kwDOQ9AYz84ubdSJ","name":"CodeWhaleSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":67473195,"digest":"sha256:5c9ca323d98c630a3ace7a1fc010ae6b5a6e0bb488ffec59b9870f9c74712c69","download_count":16,"created_at":"2026-11-22T12:11:02Z","updated_at":"2026-11-22T12:11:11Z"}],"body":"## What's in v0.10.3\n\n\nCodewhale v0.10.3 brings a unified Plugins surface with Creator mode (`[features] plugin_creator`) and unmodified DeepSeek Harness (`@deepseek-ai/dsh-*`) plugin compatibility, an upgraded Auto-Review guardian with workspace boundaries, soft rules, sub-agent return review, and one-use retry approvals, and a single `Shift+Tab` permission dial defaulting to Accept Edits (`Ask → Accept Edits → Plan → Auto-Review → Full Access`). It moves the ACP server and external-agent sessions (including Qwen Code and GitHub Copilot CLI) onto the official Agent Client Protocol SDK, publishes native signed HarmonyOS ARM64 release assets, adds a verified signed model-and-provider registry channel alongside unified model-ID resolution and managed `/v1/models` pricing, updates design tokens to `5.4.0` with a docked single-line approval strip, folded turn activity, live working-row light sweeps and 13 hex-lattice dot-whale forms, adds `claude-org` billing auth, `show_data` transcript charts, `codewhale sessions migrate`, DeepSeek Chatbot web search and speech tools, receipted self-updates and `codewhale uninstall`, and lands reliability, CJK/Unicode, Windows, and sandbox security fixes.\n\n## Install\n\n### Recommended — official GitHub release\n\nNew macOS/Linux install (checksummed binaries from this release):\n\n```bash\ncurl -fsSL https://codewhale.net/install.sh | CODEWHALE_VERSION=\"v0.10.3\" sh\n\"$HOME/.local/bin/codewhale\" --version\n```\n\nFor Windows, use the matching installer or archive below. For an existing\ndirect install, run `codewhale update`; it prints the executable path and\nkeeps newer builds. If the install directory is occupied by a different build,\nuse the fresh-directory migration in [the installation guide](https://github.com/codewhale-hq/CodeWhale/blob/main/docs/INSTALL.md).\n\n### Secondary packaging — npm and Cargo\n\n```bash\nnpm install -g codewhale\n# or build from source\ncargo install codewhale-cli --locked\n```\n\nThe wrapper downloads the matched `codewhale` and `codew` command assets\nfrom this Release. Both contain the same compiled runtime.\n\n### Docker / GHCR\n\n```bash\ndocker run --rm -it \\\n  -e DEEPSEEK_API_KEY=\"$DEEPSEEK_API_KEY\" \\\n  -v codewhale-home:/home/codewhale/.codewhale \\\n  ghcr.io/codewhale-hq/codewhale:v0.10.3\n```\n\nThe image exposes the same runtime as both `codewhale` and `codew`. The\n`latest` tag is also updated on release.\n\n### Cargo (Linux / macOS)\n\n```bash\ncargo install codewhale-cli --locked\n```\n\nThe Cargo package installs `codewhale`. Cargo cannot create a second command\nalias from one binary target; users who want the shorter spelling can add a\n`codew` symlink to that installed executable. The npm, Homebrew, archive,\nshell-installer, and container channels install both command names directly.\n\n### Manual download — platform archives (recommended)\n\nEach archive below contains the same runtime under the `codewhale` and\n`codew` command names, plus an install script:\n\n| Platform | Archive | Install script |\n|---|---|---|\n| Linux x64 | `codewhale-linux-x64.tar.gz` | `install.sh` |\n| Linux ARM64 | `codewhale-linux-arm64.tar.gz` | `install.sh` |\n| Android ARM64 (Termux) | `codewhale-android-arm64.tar.gz` | `install.sh` |\n| HarmonyOS ARM64 (native) | `codewhale-ohos-arm64.tar.gz` | `install.sh` |\n| macOS x64 | `codewhale-macos-x64.tar.gz` | `install.sh` |\n| macOS ARM | `codewhale-macos-arm64.tar.gz` | `install.sh` |\n| Windows x64 (installer) | `CodeWhaleSetup.exe` | NSIS setup |\n| Windows x64 | `codewhale-windows-x64.zip` | `install.bat` |\n| Windows x64 (portable) | `codewhale-windows-x64-portable.zip` | — |\n| Windows ARM64 | `codewhale-windows-arm64.zip` | `install.bat` |\n| Windows ARM64 (portable) | `codewhale-windows-arm64-portable.zip` | — |\n\n**Unix (Linux / macOS):**\n```bash\ntar xzf codewhale-<platform>.tar.gz\ncd codewhale-<platform>\n./install.sh\n```\n\n**Windows:**\n- For the installer path, run `CodeWhaleSetup.exe`; it installs\n  `codewhale.exe`, `codew.exe`, and `codewhale.bat` under\n  `%LOCALAPPDATA%\\Programs\\CodeWhale\\bin`, adds that directory to the\n  current-user PATH, and creates a Start Menu shortcut that prefers\n  Windows Terminal (`wt.exe`) when it is installed.\n- Extract the archive for your machine: `codewhale-windows-x64.zip` or\n  `codewhale-windows-arm64.zip`\n- Double-click `codewhale.bat` (not the raw `.exe`) to launch\n- Run `install.bat` to copy the binaries and launcher to `%USERPROFILE%\\bin`\n- Add `%USERPROFILE%\\bin` to your PATH\n\nThe **portable** Windows archive skips the install script — extract and run `codewhale.bat` from any directory. The NSIS installer is currently unsigned and may trigger Windows SmartScreen until a signing certificate is wired into the release pipeline.\n\nEach platform also has **bare, unarchived** `codewhale-<platform>` and\n`codew-<platform>` assets. The seven `codewhale-tui-<platform>` filenames\nattached to v0.9.5 are byte-identical compatibility copies used only to let\nalready-installed v0.9.4 clients discover and cross this single-binary\ntransition; current installers do not expose a third runtime. The legacy npm\npackage `deepseek-tui` is deprecated and is not republished. For migration\nfrom v0.8.x legacy binary names, see `docs/REBRAND.md`.\n\n### Verify (recommended)\n\nDownload the checksum manifests from this Release and verify:\n\n```bash\n# Linux — archive bundles\nsha256sum -c codewhale-bundles-sha256.txt --ignore-missing\n\n# Linux — individual binaries\nsha256sum -c codewhale-artifacts-sha256.txt --ignore-missing\n\n# macOS\nshasum -a 256 -c codewhale-bundles-sha256.txt --ignore-missing\nshasum -a 256 -c codewhale-artifacts-sha256.txt --ignore-missing\n```\n\n<details>\n\n<summary>Full release notes</summary>\n\nThe full notes exceed GitHub's release-description limit. Read the [complete changelog for v0.10.3](https://github.com/codewhale-hq/CodeWhale/blob/v0.10.3/CHANGELOG.md).\n\n</details>\n\n\n## Contributors\n\n- **[@knowhycodata](https://github.com/knowhycodata)** — added the LLMTR gateway descriptor and provider documentation ([#7450](https://github.com/codewhale-hq/Codewhale/pull/7450)).\n\n- **[@swf1996120](https://github.com/swf1996120)** — reported that the PR review prompt discouraged checking callers with the available source tools ([issue 7435](https://github.com/codewhale-hq/Codewhale/issues/7435)).\n- **[@NieZhuZhu](https://github.com/NieZhuZhu)** — hardened shell-command policy expansion: classified local read-only deferred tools as safe for Auto-Review ([#7431](https://github.com/codewhale-hq/CodeWhale/pull/7431)), scanned bounded AWK and sed programs for embedded shell commands ([#7430](https://github.com/codewhale-hq/CodeWhale/pull/7430)), kept each command's stdin source under group redirection and `numactl --strict` ([#7429](https://github.com/codewhale-hq/CodeWhale/pull/7429)), failed closed on dynamically resolved flag and verb names ([#7427](https://github.com/codewhale-hq/CodeWhale/pull/7427)), modeled additional tmux execution verbs within a shared work budget ([#7428](https://github.com/codewhale-hq/CodeWhale/pull/7428)), modeled the `oc`, `vagrant`, `op`, `opam` and `helm` launchers ([#7425](https://github.com/codewhale-hq/CodeWhale/pull/7425)), and propagated the dynamic flag-word bit through `nix` and launcher flags ([#7424](https://github.com/codewhale-hq/CodeWhale/pull/7424)).\n- **[@BX166](https://github.com/BX166)** — clarified the AICraft provider setup for mainland China and international users ([#7421](https://github.com/codewhale-hq/CodeWhale/pull/7421)).\n- **[@donglovejava](https://github.com/donglovejava)** — covered large raw and bracketed terminal paste, individual chunk flushes, and the Enter-key append path, fixed fallback tool-call IDs in streaming chat completions, and preserved usage records when compacting diagnostic receipts ([#7422](https://github.com/codewhale-hq/CodeWhale/pull/7422), [#7423](https://github.com/codewhale-hq/CodeWhale/pull/7423), [#7444](https://github.com/codewhale-hq/CodeWhale/pull/7444), [#7449](https://github.com/codewhale-hq/CodeWhale/pull/7449)).\n- **[@gabsferreira](https://github.com/gabsferreira)** added the SearchApi web search provider ([#7410](https://github.com/codewhale-hq/Codewhale/pull/7410)).\n- **[@cmdcorp6534](https://github.com/cmdcorp6534)** — reported the Chinese input-method candidate window appearing away from the field being typed into ([#2323](https://github.com/codewhale-hq/Codewhale/issues/2323)).\n- **[@Asteria1028](https://github.com/Asteria1028)** — reported pasted clipboard images piling up with no way to remove them ([#7221](https://github.com/codewhale-hq/Codewhale/issues/7221)).\n- **[@zhuowp](https://github.com/zhuowp)** (git author `z27014`) — added bounded HTTP rate-limit recovery and corrected retry deadlines, quota guidance and recovery receipts ([#7220](https://github.com/codewhale-hq/Codewhale/pull/7220)). Allowed an optional host policy on model HTTP clients ([#7251](https://github.com/codewhale-hq/Codewhale/pull/7251)).\n- **[@printf033](https://github.com/printf033)** — enabled exclusive rename on Android so Fleet publication does not fall back to SELinux-denied hard links (`fbe9f24ee`).\n- **[@liuyy2](https://github.com/liuyy2)** — diagnosed case-sensitive model selection collisions in the provider picker ([#7214](https://github.com/codewhale-hq/Codewhale/issues/7214)).\n- **[@isaacs](https://github.com/isaacs)** — upstream minimatch preprocessing and glob cancellation fixes reused in compatible web build dependency backports.\n- **[@Gabriel-Degret](https://github.com/Gabriel-Degret)** — reported that a hosted output limit truncated reasoning on a custom endpoint ([#7179](https://github.com/codewhale-hq/Codewhale/issues/7179)), and measured background shell idle wakeups ([#6728](https://github.com/codewhale-hq/Codewhale/issues/6728)).\n- **[@soarkit](https://github.com/soarkit)** — reported that `/patch-undo` ignored `turn_id` and undid the latest turn ([#7216](https://github.com/codewhale-hq/Codewhale/issues/7216)), and traced named-turn undo reading the history twice ([#7355](https://github.com/codewhale-hq/Codewhale/issues/7355)).\n- **[@mickey1204](https://github.com/mickey1204)** — reported ChatGPT sign-in failing token verification on Windows after a successful browser sign-in, with clock and endpoint checks that narrowed it to local verification ([#7203](https://github.com/codewhale-hq/Codewhale/issues/7203)).\n- **[@Felixkw12](https://github.com/Felixkw12)** — added Opper as a bundled provider ([#7131](https://github.com/codewhale-hq/Codewhale/pull/7131)).\n- **[@7jrxt42BxFZo4iAnN4CX](https://github.com/7jrxt42BxFZo4iAnN4CX)** — per-scope instruction budgets with visible truncation ([#7086](https://github.com/codewhale-hq/Codewhale/pull/7086), [#6526](https://github.com/codewhale-hq/Codewhale/issues/6526)), durability and repeated-goal measurements ([#6555](https://github.com/codewhale-hq/Codewhale/issues/6555), [#7172](https://github.com/codewhale-hq/Codewhale/issues/7172)), and provider-failure log analysis ([#7328](https://github.com/codewhale-hq/Codewhale/issues/7328)).\n- **[@Lstarsky0](https://github.com/Lstarsky0)** — kept the `/diff` pager's place across a resize ([#7087](https://github.com/codewhale-hq/Codewhale/pull/7087)), said \"Goal cleared.\" only when there was a goal ([#7089](https://github.com/codewhale-hq/Codewhale/pull/7089)), and stopped printing an unpriced session cost as `$0.0000` in `/status` ([#7090](https://github.com/codewhale-hq/Codewhale/pull/7090)), kept Normal-mode keys out of the draft on terminals without bracketed paste ([#7126](https://github.com/codewhale-hq/Codewhale/pull/7126)) and let shifted keys such as `G` reach Normal mode ([#7130](https://github.com/codewhale-hq/Codewhale/pull/7130)), kept the quote rail on every wrapped row of a blockquote ([#7144](https://github.com/codewhale-hq/Codewhale/pull/7144)), kept a nested list paragraph's indent ([#7146](https://github.com/codewhale-hq/Codewhale/pull/7146)), rendered `~~~` fences as code ([#7156](https://github.com/codewhale-hq/Codewhale/pull/7156)), left 