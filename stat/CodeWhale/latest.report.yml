ale-hq/Codewhale/pull/7267)), and kept Markdown character references literal in code and argv ([#7192](https://github.com/codewhale-hq/Codewhale/pull/7192)).\n- **[@gaord](https://github.com/gaord)** — a running turn's cost and context in the Runtime ([#7074](https://github.com/codewhale-hq/Codewhale/pull/7074)) forks that measure the history they carry ([#7147](https://github.com/codewhale-hq/Codewhale/pull/7147)), and private state on a HarmonyOS mount that cannot express ownership ([#7168](https://github.com/codewhale-hq/Codewhale/pull/7168)). Capped WeCom reply chunks by UTF-8 bytes ([#7209](https://github.com/codewhale-hq/Codewhale/pull/7209)). Accepted media and voice messages on the WeCom bridge ([#7212](https://github.com/codewhale-hq/Codewhale/pull/7212)). Steered a running turn from the WeCom bridge ([#7211](https://github.com/codewhale-hq/Codewhale/pull/7211)). Surfaced WeCom API error details in bridge replies ([#7208](https://github.com/codewhale-hq/Codewhale/pull/7208)) and rotated WeCom stream replies before the ten-minute expiry ([#7210](https://github.com/codewhale-hq/Codewhale/pull/7210)); both were harvested with the original commits kept. Stopped provider timeouts reporting \"after 0ns\" ([#7253](https://github.com/codewhale-hq/Codewhale/pull/7253)), exposed read-only `/system`, `/tokens` and `/cost` builtins over the Runtime API ([#7277](https://github.com/codewhale-hq/Codewhale/pull/7277)), and carried reviewed session memory and hygiene guidance into sub-agents ([#7359](https://github.com/codewhale-hq/Codewhale/pull/7359)).\n- **[@luochen211](https://github.com/luochen211)** — one form per term in the Simplified Chinese pack ([#7150](https://github.com/codewhale-hq/Codewhale/pull/7150)) and dropped blanket dead-code allows in fleet alerts and the pet worker ([#7149](https://github.com/codewhale-hq/Codewhale/pull/7149)). Added a Chinese provider setup page ([#7266](https://github.com/codewhale-hq/Codewhale/pull/7266)) and translated the Receipts ([#7264](https://github.com/codewhale-hq/Codewhale/pull/7264)), Claude plugin compatibility ([#7263](https://github.com/codewhale-hq/Codewhale/pull/7263)) and GitHub review bot ([#7265](https://github.com/codewhale-hq/Codewhale/pull/7265)) pages; fixed CJK column widths, slash-command whitespace, negative retry delays, linear-time search globs, short patch hunk headers, `env -S` script shebangs, timeline summaries, non-ASCII RLM context names, single-pass HTML entity decoding, worktree rename status, skill archive wrapper detection, declarative workflow keyword checks, escape stripping, zh-Hans `/router` and `/status` alignment, blank env-var alias fallback, crash-safe session index newlines, non-ASCII diff paths, CJK secret redaction, mid-call MCP/LSP server requests, IDN network rules, rebound command deny rules, and CJK session-title character counts ([#7269](https://github.com/codewhale-hq/Codewhale/pull/7269), [#7273](https://github.com/codewhale-hq/Codewhale/pull/7273), [#7275](https://github.com/codewhale-hq/Codewhale/pull/7275), [#7276](https://github.com/codewhale-hq/Codewhale/pull/7276), [#7287](https://github.com/codewhale-hq/Codewhale/pull/7287)–[#7291](https://github.com/codewhale-hq/Codewhale/pull/7291), [#7310](https://github.com/codewhale-hq/Codewhale/pull/7310)–[#7322](https://github.com/codewhale-hq/Codewhale/pull/7322)), and translated the last English tool labels, `/help`, `/diff`, composer and `/status` catalog text in every locale pack ([#7367](https://github.com/codewhale-hq/Codewhale/pull/7367)).\n- **[@gannp](https://github.com/gannp)** — reported vLLM effort values that ignored the local model template and fixed it with a reviewed template registry ([#7124](https://github.com/codewhale-hq/Codewhale/issues/7124), [#7125](https://github.com/codewhale-hq/Codewhale/pull/7125)).\n- **[Sh1Zuku / @SparkofSpike](https://github.com/SparkofSpike)** — resolved a relocated state root before session-side state opens ([#7097](https://github.com/codewhale-hq/Codewhale/pull/7097)) and made a goal pause to ask instead of inventing the answer ([#7175](https://github.com/codewhale-hq/Codewhale/pull/7175)), and gave the model a way back into the transcript compaction replaced ([#7173](https://github.com/codewhale-hq/Codewhale/pull/7173)). Also preserved journal history when a provisional input receives its Engine metadata ([#7180](https://github.com/codewhale-hq/Codewhale/pull/7180)). Added the bare DeepSeek V4.1 Flash catalog entry ([#7183](https://github.com/codewhale-hq/Codewhale/pull/7183)). Stopped a home-directory workspace from refusing its own state ([#7207](https://github.com/codewhale-hq/Codewhale/pull/7207)), preserved exact-first model selection ([#7214](https://github.com/codewhale-hq/Codewhale/issues/7214)), reported proxy diagnostic privacy ([#7233](https://github.com/codewhale-hq/Codewhale/issues/7233)), surfaced worktree-side rename sources in Runtime git routes ([#7325](https://github.com/codewhale-hq/Codewhale/pull/7325)), and selected `reasoning_effort` for DeepSeek models behind OpenAI-compatible gateways ([#7349](https://github.com/codewhale-hq/Codewhale/pull/7349)).\n- **[@ddlw](https://github.com/ddlw)** — repaired main for the 0.10.3 batch: clippy `-D warnings` across protocol, runtime, util and tui (boxed review and MCP-add payloads, scoped dead-code expectations, cfg-gated platform test helpers), rustfmt, split extension-host imports, the provider-registry identity check, Windows-stable DSH receipt bytes, and the first-party marketplace receipt ([#7108](https://github.com/codewhale-hq/Codewhale/pull/7108), [#7109](https://github.com/codewhale-hq/Codewhale/pull/7109)).\n- **[@laozidabo](https://github.com/laozidabo)** — localized `/diff` feedback ([#7101](https://github.com/codewhale-hq/Codewhale/pull/7101)), flushed queued saves before signal exit ([#7122](https://github.com/codewhale-hq/Codewhale/pull/7122)) and kept `/rc` start failures visible ([#7127](https://github.com/codewhale-hq/Codewhale/pull/7127)), logged redacted provider failure causes ([#7353](https://github.com/codewhale-hq/Codewhale/pull/7353)), stopped named-turn undo from rereading the session history ([#7362](https://github.com/codewhale-hq/Codewhale/pull/7362)), and rolled back partial file-scoped undo restores from the safety snapshot ([#7366](https://github.com/codewhale-hq/Codewhale/pull/7366)).\n- **[Boyce / @Aboysky](https://github.com/Aboysky)** — refreshed the README translation source stamps ([#7104](https://github.com/codewhale-hq/Codewhale/pull/7104)) and localized `/undo` feedback ([#7121](https://github.com/codewhale-hq/Codewhale/pull/7121)), formatted context-window labels and UTF-8 REPL output limits ([#7295](https://github.com/codewhale-hq/Codewhale/pull/7295), [#7296](https://github.com/codewhale-hq/Codewhale/pull/7296)), and added GitHub Copilot CLI to the external ACP agent registry ([#7326](https://github.com/codewhale-hq/Codewhale/pull/7326), [#7279](https://github.com/codewhale-hq/Codewhale/issues/7279)).\n- **[@Ricardo-M-L](https://github.com/Ricardo-M-L)** — opened `.tsx` documents with the `typescriptreact` language ID ([#7140](https://github.com/codewhale-hq/Codewhale/pull/7140)), preserved multiline XML tool arguments ([#7341](https://github.com/codewhale-hq/Codewhale/pull/7341)), and kept CLI argument assignments literal in the fallback tool-call parser ([#7342](https://github.com/codewhale-hq/Codewhale/pull/7342)).\n- **[@M-Maciej](https://github.com/M-Maciej)** — reported answerless output-limit stops in long Fleet proofs ([#6990](https://github.com/codewhale-hq/Codewhale/issues/6990)).\n- **[@asto18089](https://github.com/asto18089)** — diagnosed the NoNewPrivs child-matrix failure on hardened containers ([#7021](https://github.com/codewhale-hq/Codewhale/issues/7021)). Dropped the false sandbox claim from the `fetch_url` description ([#7222](https://github.com/codewhale-hq/Codewhale/pull/7222)) and limited nested-repository discovery to the sub-agent worktree anchor ([#7224](https://github.com/codewhale-hq/Codewhale/pull/7224)). Accepted absolute in-workspace paths in sub-agent write claims ([#7227](https://github.com/codewhale-hq/Codewhale/pull/7227)). Repaired pre-0.10.0 topology checkpoint placement on session restore ([#7229](https://github.com/codewhale-hq/Codewhale/pull/7229)). Pointed the `verify` description at the Run tool instead of a retired name ([#7223](https://github.com/codewhale-hq/Codewhale/pull/7223)). Swept stale mode-jump and rail copy from the non-English packs ([#7225](https://github.com/codewhale-hq/Codewhale/pull/7225)), accepted absolute image paths that resolve inside the workspace ([#7226](https://github.com/codewhale-hq/Codewhale/pull/7226)) and reported follow-up delivery truthfully ([#7228](https://github.com/codewhale-hq/Codewhale/pull/7228)); all three were harvested with the original commits kept. Paused the durable task wall clock while an answerable prompt waits ([#7230](https://github.com/codewhale-hq/Codewhale/pull/7230)).\n- **[@Statter](https://github.com/Statter)** — reported black-on-black text on terminals that do not report their background ([#7043](https://github.com/codewhale-hq/Codewhale/issues/7043)).\n- **[@eugenicum](https://github.com/eugenicum)** — asked for a visible Full Access flag for `serve --acp` ([#6992](https://github.com/codewhale-hq/Codewhale/issues/6992)).\n- **[@luestr](https://github.com/luestr)** — reported file and conversation rollback diverging ([#6970](https://github.com/codewhale-hq/Codewhale/issues/6970)), the Linux multiline send key ([#7093](https://github.com/codewhale-hq/Codewhale/issues/7093)) and session export guidance ([#6996](https://github.com/codewhale-hq/Codewhale/issues/6996)).\n- **[@ychu824](https://github.com/ychu824)** — reported every Anthropic request failing with a 400 once `tool_search` added a tool whose name contains a dot, such as `web.run` ([#7252](https://github.com/codewhale-hq/Codewhale/issues/7252)).\n- **[@MannXo](https://github.com/MannXo)** — added Qwen Code to the external agent registry so an installed Qwen Code CLI runs as a session over ACP ([#7293](https://github.com/codewhale-hq/Codewhale/pull/7293)).\n- **[@SamhandsomeLee](https://github.com/SamhandsomeLee)** — drove Responses request, URL and stream behavior from one checked dialect profile table ([#7261](https://github.com/codewhale-hq/Codewhale/pull/7261)).\n- **[@Gyuke](https://github.com/Gyuke)** — kept the exact named custom route in the web client's new-thread provider picker so models load and threads start on the route chosen ([#7352](https://github.com/codewhale-hq/Codewhale/pull/7352)).\n- **[@vshulcz](https://github.com/vshulcz)** — documented a hybrid Claude bundle that installs declaratively with `/plugin install` and keeps its lifecycle hooks in `config.toml` ([#7346](https://github.com/codewhale-hq/Codewhale/pull/7346)).\n- **[@deosiree](https://github.com/deosiree)** — bounded the terminal's wait for the session snapshot at turn end so a newly started turn no longer freezes the UI, and exposed request transmission in terminal provider errors ([#7360](https://github.com/codewhale-hq/Codewhale/pull/7360), [#7448](https://github.com/codewhale-hq/CodeWhale/pull/7448)).\n- **[@ruanchaves](https://github.com/ruanchaves)** — kept MCP tools whose optional parameters carry a Pydantic `default: null` in Moonshot (Kimi) requests instead of dropping them ([#7364](https://github.com/codewhale-hq/Codewhale/pull/7364)).\n\nSee [CHANGELOG.md](https://github.com/codewhale-hq/CodeWhale/blob/main/CHANGELOG.md) for full notes and [docs/CHANGELOG_ARCHIVE.md](https://github.com/codewhale-hq/CodeWhale/blob/main/docs/CHANGELOG_ARCHIVE.md) for older releases.\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
