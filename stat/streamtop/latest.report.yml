:7,"created_at":"2026-11-10T10:16:41Z","updated_at":"2026-11-10T10:16:41Z"},{"id":730978224,"node_id":"RA_kwDOUD3FGM4rkdew","name":"streamtop-x86_64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":6516293,"digest":"sha256:e390f772eb50f7745c3eade519b851dd79f3431a3d0a611f2256e998c7fdd1f5","download_count":2,"created_at":"2026-11-10T10:16:41Z","updated_at":"2026-11-10T10:16:42Z"},{"id":730978232,"node_id":"RA_kwDOUD3FGM4rkde4","name":"streamtop-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5657541,"digest":"sha256:ce9b83e3cd6f431905ea7de460d9e9ba44531f817ad33e41ac99dafb7ea1ef6f","download_count":4,"created_at":"2026-11-10T10:16:41Z","updated_at":"2026-11-10T10:16:42Z"},{"id":730978235,"node_id":"RA_kwDOUD3FGM4rkde7","name":"streamtop-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":6959999,"digest":"sha256:4cf390ca11bdff5aa69d0f5e83a3951abd21a91776ecbeec26e889b109e1477e","download_count":2,"created_at":"2026-11-10T10:16:41Z","updated_at":"2026-11-10T10:16:42Z"},{"id":730978229,"node_id":"RA_kwDOUD3FGM4rkde1","name":"streamtop-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":7308300,"digest":"sha256:5f133c9dcc2c5ced985a61d2f9a1389ac1442d58c3d63fe83546a89f5a2c4806","download_count":2,"created_at":"2026-11-10T10:16:41Z","updated_at":"2026-11-10T10:16:42Z"}],"body":"# streamtop v1.8.0\n\n### Added\n\n- Multi-stream grid. `streamtop URL1 URL2`, `streamtop --grid URL...`, or `streamtop --agent CONFIG --grid` shows each stream as a tile with status, bitrate, segment latency, and alarm counts. Arrow keys or `hjkl` move, Enter opens the existing single-stream dashboard, and `q` or Esc there returns to the grid. An 80x24 terminal shows a small page and scrolls.\n- Opt-in evidence bundles. `--evidence-dir DIR` (or `evidence_dir` in the profile or agent config) writes a timestamped directory when a stall, continuity-counter error, or other alarm fires. The bundle keeps the last few manifests and segment request metadata (status, timings, redacted headers). `--evidence-segments N` also saves the downloaded bytes, capped per segment and in total. A minimum interval, a dump count, and a byte ceiling (default 32 MiB, hard maximum 1 GiB) stop a burst of alarms from filling the disk.\n\n### Fixed\n\n- `--otel-endpoint` and the agent `otel_endpoint` now export on the dashboard, grid, agent, Prometheus, and budget pollers. Spans were buffered and never flushed on those long-running paths.\n- Agent configs with a duplicate stream id or an empty URL are rejected.\n- `--agent` no longer ignores `--summary`, `--audit`, `--vod`, `--compare`, `--multi-cdn`, `--export`, or `--prometheus`.\n- Passing URLs together with `--agent` is an error. The config file is the stream list.\n- Error text redacts query tokens and userinfo in manifest, segment, VOD, LL-HLS, DoH, and multi-CDN failures.\n- Evidence bundles redact query tokens on relative playlist URIs (`seg.ts?token=...`), not only on absolute http URLs.\n- `streamtop check --output` help matches the table format, which still prints the table and writes JSON.\n\n### Changed\n\n- The winget installer manifest depends on `Microsoft.VCRedist.2015+.x64`. The Windows build imports `VCRUNTIME140.dll`, so a portable winget install gets that runtime.\n\n\n## Install\n\n```bash\ncargo install streamtop --version 1.8.0\n```\n\nGitHub Release binaries attached below.\n"}
