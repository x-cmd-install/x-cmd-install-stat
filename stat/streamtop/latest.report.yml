3:14:47Z"},{"id":686658801,"node_id":"RA_kwDOUD3FGM4o7ZTx","name":"streamtop-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5892005,"digest":"sha256:73d1b706ae569ecd5de31fa327497f39e5b6ab07e1cc06c2d34dbeeb8d1d9359","download_count":1,"created_at":"2026-10-28T23:14:46Z","updated_at":"2026-10-28T23:14:47Z"},{"id":686658796,"node_id":"RA_kwDOUD3FGM4o7ZTs","name":"streamtop-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":7236527,"digest":"sha256:17fa0e7d07f5c46b8bdba24c4a9d979755dd465c30505bdc3dea7825b6ddf2f1","download_count":3,"created_at":"2026-10-28T23:14:46Z","updated_at":"2026-10-28T23:14:47Z"}],"body":"# streamtop v1.5.4\n\n### Fixed\n\n- ABR panel shows manifest vs wire mismatch rows even when the ladder has no warnings\n- Cycling preset log filters with `f` clears an active regex filter, so the preset is the filter actually applied. The log title says `filter` or `regex` to match\n- Event log and compare panes show a waiting or no-match line instead of an empty box\n- Compare pane truncation stays within the column width (a single ellipsis character instead of three dots)\n- Toast width counts characters instead of bytes\n- Help overlay and README describe `F` as clearing any log filter\n\n### Changed\n\n- Semver-compatible lockfile updates (backtrace, brotli, pest, rustix, unicode-width, xattr). oxideav-core stays at 0.1.41 because 0.1.42 needs Rust 1.95\n- GitHub Action pins refreshed (rust-cache v2.9.3, setup-python v7.1.0, docker/login-action v4.7.0, taiki-e/install-action v2.88.0)\n- README: install and first run command under the demo, Terminal Trove badge links to the streamtop page\n- AUR `PKGBUILD` declares `glibc` and `gcc-libs` runtime dependencies\n\n\n## Install\n\n```bash\ncargo install streamtop --version 1.5.4\n```\n\nGitHub Release binaries attached below.\n"}
