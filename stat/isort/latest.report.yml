,"uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":11007,"digest":"sha256:856673847934aa068641a33be50643ff50886e065b3520d149bc0d5e88f4736a","download_count":1,"created_at":"2026-09-28T19:20:37Z","updated_at":"2026-09-28T19:20:37Z"}],"body":"## :beetle: Fixes\r\n\r\n* Preserve blank lines before comment-only sections by @fzlzjerry in https://github.com/PyCQA/isort/pull/2655\r\n* Preserve trailing-comma layout when sorting reexports by @PSR94 in https://github.com/PyCQA/isort/pull/2605\r\n* fix: treat EOF on stdin as 'quit' in --interactive prompt by @Eljees in https://github.com/PyCQA/isort/pull/2653\r\n* Fix multi_line_output=10 emitting unparsable code around trailing comments by @dylanpulver in https://github.com/PyCQA/isort/pull/2651\r\n* Stop configuration discovery at Git worktree boundaries by @vzer200 in https://github.com/PyCQA/isort/pull/2654\r\n* fix: preserve trailing comments when sorting literals by @Manny7717 in https://github.com/PyCQA/isort/pull/2647\r\n* Preserve LF stdin output on Windows by @AleksZyro in https://github.com/PyCQA/isort/pull/2616\r\n* Handle star imports better when using parenthesis by @DanielNoord in https://github.com/PyCQA/isort/pull/2665\r\n* Sort unwrapped lines in force_sort_within_sections by @DanielNoord in https://github.com/PyCQA/isort/pull/2667\r\n* Preserve file line endings when sorting reexports by @vyrnsynx in https://github.com/PyCQA/isort/pull/2669\r\n* Fix float_to_top hoisting indented semicolon imports by @Pajimo in https://github.com/PyCQA/isort/pull/2671\r\n* Preserve CRLF blank lines during float-to-top preprocessing by @hansu650 in https://github.com/PyCQA/isort/pull/2683\r\n* mypy: type-check tests and use pathlib fixtures by @DanielNoord in https://github.com/PyCQA/isort/pull/2685\r\n\r\n## Other changes\r\n\r\n* Fix codecov build reports by @DanielNoord in https://github.com/PyCQA/isort/pull/2666\r\n* Refactors in `process` by @DanielNoord in https://github.com/PyCQA/isort/pull/2677\r\n* Core developers revision by @staticdev in https://github.com/PyCQA/isort/pull/2691\r\n\r\n**Full Changelog**: https://github.com/PyCQA/isort/compare/9.0.1...9.0.2","mentions_count":12}
