pe":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":8332728,"digest":"sha256:1df1a65344f8d7ad4a062cfe65bb23bd7f33239e3069794f87cd926d4308add3","download_count":3,"created_at":"2026-11-12T02:15:57Z","updated_at":"2026-11-12T02:15:58Z"}],"body":"## Security\n\n* [GHSA-cfgx-mprf-xh64](https://github.com/goreleaser/nfpm/security/advisories/GHSA-cfgx-mprf-xh64): Reserved metadata name collision leads to supply chain attack with root code execution and package identity spoofing\n* [GHSA-839m-5qhj-w4rm](https://github.com/goreleaser/nfpm/security/advisories/GHSA-839m-5qhj-w4rm): Incorrect escaping in SRPM spec results in Arbitrary Code Execution\n\n## Changelog\n### New Features\n* 62f72a6783dc2b2781a9ee0c47f2d0de05770121: feat(msix): default publisher from the signing certificate or vendor (#1135) (@djgilcrease)\n* edf35527203670398264204fdafb775ea9c11b9b: feat(rpm): add script_requires to require script interpreters (#1151) (@zehome)\n* c953fe3995c3b305d5e9c23c33bb47b4e145bc8d: feat: add msi support (#1097) (@djgilcrease)\n### Bug fixes\n* ff7e8cd218eb61318a3378c4d275d1d947ad7cd9: fix(apk): Use the configured mtime for install scripts (#1169) (@somaz94)\n* 1dc3fccc6e11632579905d0108d3b616e80ac684: fix(ci): allow unsigned RPM acceptance fixtures (#1175) (@caarlos0)\n* d2d7180294d4d68938e364bc9b4c92480be6026d: fix(ci): create generated update PRs with app token (#1176) (@caarlos0)\n### Dependency updates\n* 93d5ad163ae34ac03b1f24407a3b673b8a120030: fix(deps): bump alpine from 3.24.2 to 3.24.3 (#1166) (@dependabot[bot])\n* 582a7510d57278b1b54cded2718de00c6c81135a: fix(deps): bump alpine from 3.24.2 to 3.24.3 in /testdata/acceptance (#1167) (@dependabot[bot])\n### Build process updates\n* 37cd27d337af038a8a40b84eedbab648f768f1fb: ci(deps): bump the actions group with 5 updates (#1159) (@dependabot[bot])\n* 688098943e97f7e8374ace60322f22f5cce8f806: ci(deps): bump the actions group with 6 updates (#1162) (@dependabot[bot])\n* 9b57a4e1742795da6c8a35ce73abd119838a40b2: ci(deps): bump the actions group with 6 updates (#1165) (@dependabot[bot])\n* eee2bc94ca1bbfdaf4f12c29ef962fc4ed613565: ci(deps): bump the actions group with 6 updates (#1173) (@dependabot[bot])\n* 44ea002d6394aed93d4695d05add27915d6ba65d: ci: combine generation workflows and use GitHub App identity (#1180) (@caarlos0)\n### Other work\n* f01bd4039fd9997376836fb80ada8c69b23b6c4f: Merge commit from fork (@caarlos0)\n* 7fd9e9b8a57311155e93a1994891b9f71ca665fd: Merge commit from fork (@caarlos0)\n* b06214cfe8178e852566020aed2f4a4e3230f154: docs: align sponsors page with goreleaser's (#1163) (@caarlos0)\n* 3871eb339fbaf87dd214a57d4930d660107f1af5: docs: update Go and Hextra (#1172) (@caarlos0)\n* 92ea769fdc2bdb13690dea86a2a73271f8c3d151: docs: update cmd docs (#1177) (@goreleaser[bot])\n\n**Full Changelog**: https://github.com/goreleaser/nfpm/compare/v2.48.0...v2.49.0\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* nFPM is a satellite project from GoReleaser. [Check it out](https://goreleaser.com)!\n* Find examples and commented usage of all options in our [website](https://nfpm.goreleaser.com/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6) and [Twitter](https://twitter.com/goreleaser)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>","mentions_count":6}
