:"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":7541249,"digest":"sha256:77d2931dd7437d506b25b336b50d87244871c3f5e585418b2873473e3c593a22","download_count":2,"created_at":"2026-10-12T18:33:32Z","updated_at":"2026-10-12T18:33:32Z"}],"body":"## Changelog\n### New Features\n* 6d713625670ecbac5fe97b041204cbe42cbbfdf2: feat(arch): map ppc64 and ppc64le to Arch Linux POWER names (#1138) (@abemedia)\n* f42c9510c89f6052a044457538e4e2c662a6b8d2: feat: Add \"force_implicit_dirs\" to dir/tree. (#948) (@volkadav)\n* e1c7b33e10143cfcd43cfb467a570894596f4ace: feat: replace rpmpack with a more complete implementation (#1104) (@djgilcrease)\n### Security updates\n* 84adf13b39dc39201c9bff117e1549caa7019543: sec(deps): bump golang.org/x/ (#1157) (@caarlos0)\n### Bug fixes\n* c42462355e5209488787a8eec00a2bc98d45c462: fix(apk): normalize file modes before writing tar headers (#1113) (@ychampion)\n* a72ab8f3ac34368071812c9a796c830eaaee469f: fix(ci): Separate PR checks from queue acceptance tests (#1158) (@caarlos0)\n* 93cf82dd375cddb0c2b39609eccf0aef9e61ef3a: fix(ipk): normalize file modes before writing tar headers (#1145) (@yunaremaia)\n* ae346b54a3142aa993cbfd3202cfd6236caa8822: fix(rpm): emit ISA-qualified self provide (#1141) (@djgilcrease)\n* d20c0c9937ed37ff34fedf155468a739baa59cf1: fix(rpm): escape % in generated SRPM spec so scriptlets survive rebuild (#1109) (@caarlos0)\n* 60154f160df7af2b2b405c7bf0fde93292909cb7: fix(rpm): set file colors on executable ELF files (#1155) (@caarlos0)\n* c2b09957b40d5f4391d46b05263b199ad0370dca: fix: Include optional dependencies in Arch packages (#1131) (@fredrikblau)\n* db22372bfbddb6b2968ff71e9c25e6bb1a2355c2: fix: add context to deb and rpm errors (#1088) (@otjdiepluong)\n* 5ec5501425dc2cd4ff41b783095cff3e74ed2ebe: fix: don't panic in Config.Get on an empty override clause (#1114) (@arpitjain099)\n* ce81cb64a9e1d5abb252ee7a05e8ea897f4ee32d: fix: update to go-msix v1.0.0 (#1105) (@djgilcrease)\n### Dependency updates\n* 9da52b452d229bc65d872273a1c598e02b6ef4c2: fix(deps): bump alpine from 3.24.0 to 3.24.1 (#1101) (@dependabot[bot])\n* 6e553ae9843798642d3de64957f4d9ba2f0a9aaa: fix(deps): bump alpine from 3.24.0 to 3.24.1 in /testdata/acceptance (#1102) (@dependabot[bot])\n* 551ed7880ba2dcd1101234f5d451826311c9284c: fix(deps): bump alpine from 3.24.1 to 3.24.2 (#1143) (@dependabot[bot])\n* f65c6cb7a4779d982e69947fd6d1f347b0c1d97c: fix(deps): bump alpine from 3.24.1 to 3.24.2 in /testdata/acceptance (#1144) (@dependabot[bot])\n* 886e9296b3ba2cf71fb185f9e7c1df1e6e52aaf1: fix(deps): bump fedora from 40 to 44 in /testdata/acceptance (#1084) (@dependabot[bot])\n### Build process updates\n* b55fa4da53b6100d70276f26778034f768ece26a: ci(deps): bump actions/checkout from 6.0.3 to 7.0.0 in the actions group (#1100) (@dependabot[bot])\n* bda9b3f9650b92c5e5aee63009b15f38b4311dfe: ci(deps): bump docker/setup-qemu-action in the actions group (#1134) (@dependabot[bot])\n* 2263872eee22aabe44a86e3a0d16e8e01fe12816: ci(deps): bump the actions group across 1 directory with 9 updates (#1120) (@dependabot[bot])\n* 3ab9e89ab895ea8ba47690dd14304017dff55997: ci(deps): bump the actions group with 2 updates (#1107) (@dependabot[bot])\n* e788e822ccd700d8e6089c1041cb309201639399: ci(deps): bump the actions group with 4 updates (#1126) (@dependabot[bot])\n* 42066c26933f91e8c5f90d6742b156e40db9c442: ci(deps): bump the actions group with 4 updates (#1137) (@dependabot[bot])\n* 9215c15b82fb843e047a7685a2c45df45a7fcb62: ci(deps): bump the actions group with 5 updates (#1121) (@dependabot[bot])\n* bec8ffcdcabbf954933491129bad89e39a67163a: ci(deps): bump the actions group with 5 updates (#1130) (@dependabot[bot])\n* 2c05c9e1a5cb7150520a92edf0f2bc9bfbc2d672: ci(deps): bump the actions group with 5 updates (#1148) (@dependabot[bot])\n* 8ce4a3a1026f24d145071d148a04b1362f9f4f6c: ci(deps): bump the actions group with 6 updates (#1115) (@dependabot[bot])\n* c6abdbaa8b2ff40dcba6e4ec76545038cf264422: ci(deps): bump the actions group with 6 updates (#1128) (@dependabot[bot])\n* a32b89262e05e2574d82493c9fae378f6b7f00b7: ci(deps): bump the actions group with 6 updates (#1132) (@dependabot[bot])\n* 962cc403408c60b44486ae7a7ca7728652cdebf4: ci(deps): bump the actions group with 7 updates (#1139) (@dependabot[bot])\n* 61117664ffea9fa95d8a2ce59e318a6fb34a90d5: ci(deps): bump the actions group with 9 updates (#1111) (@dependabot[bot])\n* b935cc66813b70180524d6c69ab559957f3a18a5: ci: Enable merge queue checks (@caarlos0)\n* eb39b13687a3c7ffb857e3316074b01dff400997: ci: remove ruleguard (@caarlos0)\n* 70b7cb842063dd0da4e552297e2ee28fe3f3454f: ci: remove workflow dispatch (@caarlos0)\n### Other work\n* 5794bbd723306c63e0464b5d66787c677f7e234b: docs: update cmd docs (@caarlos0)\n* 4b020524fb3dd922065c6366826435ce771453d8: docs: update cmd docs (@caarlos0)\n* b3fc46b36452a66c73aaee8ab50714f224bf58ed: test(rpm): Stabilize default compression comparison (#1156) (@caarlos0)\n\n**Full Changelog**: https://github.com/goreleaser/nfpm/compare/v2.47.0...v2.48.0\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* nFPM is a satellite project from GoReleaser. [Check it out](https://goreleaser.com)!\n* Find examples and commented usage of all options in our [website](https://nfpm.goreleaser.com/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6) and [Twitter](https://twitter.com/goreleaser)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>\n\n","mentions_count":10}
