linux-v1.6.0-arm64.tar.gz","label":null,"uploader":{"login":"yorukot","id":107802416,"node_id":"U_kgDOBmzvMA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gzip","state":"uploaded","size":12358649,"digest":"sha256:2e8150dab1a139e3a081bd74a9c775155e8d0241c34ae3f8d30817a3df1b8f06","download_count":2131,"created_at":"2026-06-07T17:51:15Z","updated_at":"2026-06-07T17:51:17Z"},{"id":441063615,"node_id":"RA_kwDOLil1MM4aShi_","name":"superfile-v1.6.0-checksums.txt","label":null,"uploader":{"login":"yorukot","id":107802416,"node_id":"U_kgDOBmzvMA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":612,"digest":"sha256:1d49b8cfb7996b0b4bdc9be3d36105705bdf15427a7f1c90840a2a2380e5fcd8","download_count":643,"created_at":"2026-06-07T17:51:07Z","updated_at":"2026-06-07T17:51:09Z"},{"id":441063664,"node_id":"RA_kwDOLil1MM4aShjw","name":"superfile-windows-v1.6.0-amd64.zip","label":null,"uploader":{"login":"yorukot","id":107802416,"node_id":"U_kgDOBmzvMA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":13743007,"digest":"sha256:4264a84d38c5d13804960a5da9ea8dedb8a00439e2612d6b8a28699836ed0143","download_count":10437,"created_at":"2026-06-07T17:51:13Z","updated_at":"2026-06-07T17:51:15Z"},{"id":441063644,"node_id":"RA_kwDOLil1MM4aShjc","name":"superfile-windows-v1.6.0-arm64.zip","label":null,"uploader":{"login":"yorukot","id":107802416,"node_id":"U_kgDOBmzvMA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12541266,"digest":"sha256:981fa1e5cd38fe35de34badaa041be689506e3bc6ac75de30c34e4ac8e7f17aa","download_count":810,"created_at":"2026-06-07T17:51:09Z","updated_at":"2026-06-07T17:51:13Z"}],"body":"This release focuses on preview reliability, richer file metadata, configurable sidebar behavior, and a refreshed website and logo design, alongside navigation improvements, better error messages, refactoring, dependency updates, and bug fixes.\r\n\r\n## Install:\r\n[**Click me to know how to install**](https://github.com/yorukot/superfile?tab=readme-ov-file#installation)\r\n\r\n## Highlights\r\n- Improved image and file preview reliability through the Bubble Tea v2 migration. Thanks @lazysegtree for the implementation\r\n- New website & logo design. Thanks @elvisdragonmao for the implementation\r\n- Added richer file metadata, including binary architecture detection for ELF/PE/Mach-O, Linux attributes, and file type byte support in the permissions column. Thanks @barsaskn, @xelavopelk, and @booth-w for the implementation\r\n- Sidebar sections can now be configured for visibility and ordering. Thanks @Mjoyufull for the implementation\r\n- Improved file operation error messages for delete, paste, and file text preview failures. Thanks @xelavopelk for the implementation\r\n- Added `split_file_panel` key function and navigation improvements for file panels. Thanks @robert-zaremba, @xelavopelk, and @padda78 for the implementation\r\n\r\n## New Contributors\r\n* @padda78 made their first contribution in https://github.com/yorukot/superfile/pull/1316\r\n* @moriT958 made their first contribution in https://github.com/yorukot/superfile/pull/1318\r\n* @Mjoyufull made their first contribution in https://github.com/yorukot/superfile/pull/1323\r\n* @moabeat-berlin made their first contribution in https://github.com/yorukot/superfile/pull/1327\r\n* @barsaskn made their first contribution in https://github.com/yorukot/superfile/pull/1328\r\n* @robert-zaremba made their first contribution in https://github.com/yorukot/superfile/pull/1344\r\n* @nil957 made their first contribution in https://github.com/yorukot/superfile/pull/1386\r\n* @dsvetoslavov made their first contribution in https://github.com/yorukot/superfile/pull/1384\r\n* @mehexi made their first contribution in https://github.com/yorukot/superfile/pull/1387\r\n* @jirka-grunt made their first contribution in https://github.com/yorukot/superfile/pull/1399\r\n* @elvisdragonmao made their first contribution in https://github.com/yorukot/superfile/pull/1423\r\n* @pikammmmm made their first contribution in https://github.com/yorukot/superfile/pull/1427\r\n* @NouemanKHAL made their first contribution in https://github.com/yorukot/superfile/pull/1465\r\n\r\n## Detailed Change Summary\r\n\r\n<details><summary>Details</summary>\r\n<p>\r\n\r\n#### Update\r\n- Add configuration options for sidebar section visibility and ordering by @Mjoyufull in https://github.com/yorukot/superfile/pull/1323\r\n- Add binary architecture detection for ELF, PE, and Mach-O by @barsaskn in https://github.com/yorukot/superfile/pull/1328\r\n- Add `--debug-info` flag by @barsaskn in https://github.com/yorukot/superfile/pull/1332\r\n- Focus on current directory when navigating to parent directory in a file panel by @xelavopelk in https://github.com/yorukot/superfile/pull/1340\r\n- Add `split_file_panel` key function by @robert-zaremba in https://github.com/yorukot/superfile/pull/1344\r\n- Refresh file metadata when focusing metadata panel by @xelavopelk in https://github.com/yorukot/superfile/pull/1372\r\n- Add Desktop directory to well-known directories by @nil957 in https://github.com/yorukot/superfile/pull/1386\r\n- Add support for PostScript files by @jirka-grunt in https://github.com/yorukot/superfile/pull/1399\r\n- Bubble Tea v2 migration by @lazysegtree in https://github.com/yorukot/superfile/pull/1406\r\n- Add detailed delete operation error messages by @xelavopelk in https://github.com/yorukot/superfile/pull/1408\r\n- Add file type byte to permissions column by @booth-w in https://github.com/yorukot/superfile/pull/1410\r\n- New website & logo design by @elvisdragonmao in https://github.com/yorukot/superfile/pull/1423\r\n- Add Linux attributes to metadata by @xelavopelk in https://github.com/yorukot/superfile/pull/1432\r\n- Add more informative file text preview error messages by @xelavopelk in https://github.com/yorukot/superfile/pull/1436\r\n\r\n#### Bug Fix\r\n- Resolve Nix build failure by @Frost-Phoenix in https://github.com/yorukot/superfile/pull/1298\r\n- Prune inaccessible items from clipboard before pasting by @lazysegtree in https://github.com/yorukot/superfile/pull/1300\r\n- Correct cursor position when jumping back to parent directories by @padda78 in https://github.com/yorukot/superfile/pull/1316\r\n- Move toggle dot files to FileModel and force re-render on toggle by @lazysegtree in https://github.com/yorukot/superfile/pull/1324\r\n- Update xz to v0.5.15 to enable cross-compilation again by @moabeat-berlin in https://github.com/yorukot/superfile/pull/1327\r\n- Prevent crash due to invalid theme by @lazysegtree in https://github.com/yorukot/superfile/pull/1355\r\n- Prevent panic from zero-value Renderer usage by @Simpaqt in https://github.com/yorukot/superfile/pull/1358\r\n- Remove panic statements in production code by @lazysegtree in https://github.com/yorukot/superfile/pull/1359\r\n- Allow `natural_sort` as sort option by @majiayu000 in https://github.com/yorukot/superfile/pull/1237\r\n- Disable interactive commands in shell mode on Darwin/Linux by @lazysegtree in https://github.com/yorukot/superfile/pull/1364\r\n- Fix multi-column header misalignment by @xelavopelk in https://github.com/yorukot/superfile/pull/1362\r\n- Remove two fractional digits for small byte-sized files by @xelavopelk in https://github.com/yorukot/superfile/pull/1370\r\n- Resolve Nix build failure by @Frost-Phoenix in https://github.com/yorukot/superfile/pull/1373\r\n- Disable broken Nix check phase by @Frost-Phoenix in https://github.com/yorukot/superfile/pull/1374\r\n- Reword `--help` for `fch` by @booth-w in https://github.com/yorukot/superfile/pull/1391\r\n- Fix Natural sort selection by @xelavopelk in https://github.com/yorukot/superfile/pull/1413\r\n- Change `FormatFileSize` to use configured units by @booth-w in https://github.com/yorukot/superfile/pull/1419\r\n- Make `ioReqCnt` thread-safe by @xelavopelk in https://github.com/yorukot/superfile/pull/1420\r\n- Process files in deterministic order by @xelavopelk in https://github.com/yorukot/superfile/pull/1421\r\n- Add detailed paste operation error messages by @xelavopelk in https://github.com/yorukot/superfile/pull/1431\r\n\r\n#### Optimization\r\n- Refactor Sort Modal into a separate package by @lazysegtree in https://github.com/yorukot/superfile/pull/1325\r\n- Refactor Help Menu Modal into a separate package by @lazysegtree in https://github.com/yorukot/superfile/pull/1335\r\n- Refactor utils package to pkg by @lazysegtree in https://github.com/yorukot/superfile/pull/1365\r\n\r\n#### Documentation\r\n- Add JetBrains logo by @lazysegtree in https://github.com/yorukot/superfile/pull/1292\r\n- Grammar corrections in README and remove redundant site link by @AnshumanNeon in https://github.com/yorukot/superfile/pull/1302\r\n- Add special thanks page by @yorukot in https://github.com/yorukot/superfile/pull/1317\r\n- Add missing fields to Vim-like superfile hotkeys by @moriT958 in https://github.com/yorukot/superfile/pull/1318\r\n- Add download badges to README by @lazysegtree in https://github.com/yorukot/superfile/pull/1404\r\n- Fix `behviour` -> `behaviour` typo in tmux.md by @pikammmmm in https://github.com/yorukot/superfile/pull/1427\r\n- Update core contributor page by @elvisdragonmao in https://github.com/yorukot/superfile/pull/1429\r\n- Add notice page and fix tutorial page discussion issue by @yorukot in https://github.com/yorukot/superfile/pull/1433\r\n- Fix broken demo GIF path by @NouemanKHAL in https://github.com/yorukot/superfile/pull/1465\r\n\r\n#### Dependencies\r\n- Update dependency astro to v5.16.9 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1294\r\n- Update module golang.org/x/image to v0.35.0 by @renovate[bot] in https://githu