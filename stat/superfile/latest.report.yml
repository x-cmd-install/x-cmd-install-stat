Update dependency starlight-giscus to ^0.9.0 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1396\r\n- Update module github.com/pelletier/go-toml/v2 to v2.3.0 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1400\r\n- Update module golift.io/xtractr to v0.3.1 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1401\r\n- Update module github.com/alecthomas/chroma/v2 to v2.24.0 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1418\r\n- Update module github.com/charmbracelet/x/ansi to v0.11.7 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1426\r\n- Update module github.com/pelletier/go-toml/v2 to v2.3.1 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1430\r\n- Update module github.com/alecthomas/chroma/v2 to v2.24.1 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1447\r\n- Update module golang.org/x/text to v0.37.0 by @renovate[bot] in https://github.com/yorukot/superfile/pull/1450\r\n\r\n#### Misc\r\n- Update tracking code by @yorukot in https://github.com/yorukot/superfile/pull/1301\r\n- Add sidebar section layout test by @dsvetoslavov in https://github.com/yorukot/superfile/pull/1384\r\n- Fix incomplete test coverage in navigation_test.go by @mehexi in https://github.com/yorukot/superfile/pull/1387\r\n- Add new workflow for PR auto-labeling by @yorukot in https://github.com/yorukot/superfile/pull/1398\r\n- Fix GitHub auto-labeling workflow by @yorukot in https://github.com/yorukot/superfile/pull/1405\r\n- Update GitHub Actions workflow triggers and permissions by @yorukot in https://github.com/yorukot/superfile/pull/1424\r\n- Add tests for modal error messages by @xelavopelk in https://github.com/yorukot/superfile/pull/1435\r\n- Update workflow configuration by @yorukot in https://github.com/yorukot/superfile/pull/1451\r\n\r\n</p>\r\n</details>\r\n\r\n**Full Changelog**: https://github.com/yorukot/superfile/compare/v1.5.0...v1.6.0","reactions":{"total_count":30,"+1":1