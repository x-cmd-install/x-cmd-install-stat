{"id":431334261,"author":{"login":"wolo-lab","id":274205925,"node_id":"U_kgDOEFgM5Q","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOk6zdc4ZtaN1","tag_name":"v2.7.0","target_commitish":"main","name":"v2.7.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-02T08:20:23Z","updated_at":"2026-11-02T10:37:02Z","published_at":"2026-11-02T10:37:02Z","assets":[],"body":"## Highlights\r\n\r\nv2.7.0 adds Anthropic Claude as a first-party model, search-gated tool discovery for large tool catalogs, an experimental classifier API for workflow routing, and a per-invocation budget on model calls. It also switches telemetry to the OpenTelemetry GenAI semantic conventions by default, which is a breaking change for anyone consuming ADK traces.\r\n\r\n* **Anthropic Claude models** (experimental): `model/anthropicmodel` implements `model.LLM` over the Anthropic Messages API and Vertex AI, with streaming, tool calling, image and PDF input, extended and adaptive thinking, structured output and prompt caching. See `examples/anthropic`. (#1866)\r\n* **Search-gated tool discovery**: `tool/toolsearch` wraps any `tool.Toolset` so the model starts with a `search_tools` tool plus a configured core set, and the tools it finds are declared from the next model step on. This keeps a large MCP catalog out of every request. See `examples/toolsearch`. (#1734, #1735)\r\n* **Classifiers** (experimental): `exp/classifier` defines a `Classifier` that answers typed Choice, Binary and Score questions with probabilities. It ships with a client for TypeSafe's Jev decision models (`exp/classifier/typesafe`), an `LLMClassifier` backed by any `model.LLM`, and a workflow `Node` that routes on the answer, matching adk-python's `ClassifierNode`. (#2003, #2005, #2035)\r\n* **Model-call budget**: `RunConfig.MaxLLMCalls` bounds the model calls one invocation may make, 500 by default, and ends the run with `agent.ErrLLMCallsLimitExceeded` when the budget is spent. Matches adk-python's `max_llm_calls`. This changes behavior for existing users, see below. (#1412)\r\n* **Telemetry**: traces follow OpenTelemetry GenAI semantic conventions v2 by default, as adk-python does. This is breaking for telemetry consumers, see below. (#1635)\r\n* **OpenAI-compatible models**: images and files in `InlineData` and `FileData` parts are sent on both the Responses and Chat Completions endpoints (#1543). A response schema title that is not a valid format name falls back to `adk_response` instead of a 400 from the API (#1912). A `GenerateContentConfig` field that a newer genai adds is refused with `ErrUnsupportedConfigField` instead of being dropped silently (#1922).\r\n* **Gemini built-in tools**: `geminitool.GoogleMaps`, `geminitool.UrlContext` and `geminitool.EnterpriseWebSearch`. (#2026)\r\n* **MCP**: with `Config.Auth` set, each user gets their own MCP session, so servers that bind a session to the user who opened it stop answering other users with 403 (#1755). MCP HTTP requests identify ADK in `User-Agent` and `X-Goog-Api-Client`, as model calls already do (#1862).\r\n* **Auth fix**: credentials from `auth.ADC()` and `auth.ServiceAccount()` failed every token mint with `context canceled` on local gcloud ADC and impersonated service accounts. Services on GCE or with a key file were not affected. (#1904)\r\n* **Tool auth groundwork**: `tool/toolauth` adds adk-python's auth data model and wire format for `adk_request_credential`, so requests, replies and credential keys agree with adk-python and ADK Web. Nothing uses it yet. (#2032)\r\n* **Reliability**:\r\n  * Workflow joins resume with completed predecessors restored instead of rerunning them. (#1572)\r\n  * `LoopAgent` stops on context cancellation. `WithAgentTimeout` and `WithAgentCancel` work on tool and callback contexts instead of returning nil. (#1810, #1604)\r\n  * Artifacts saved in agent and model callbacks are recorded in `ArtifactDelta`. `OutputKey` is saved when a before-agent callback short-circuits. (#1878, #1800, #1963)\r\n  * Optional instruction placeholders such as `{key?}` and `{artifact.name?}` surface infrastructure errors instead of rendering an empty string. This changes behavior, see below. (#1748)\r\n  * Vertex AI sessions persist live transcriptions. In-memory memory search skips thought parts. (#1964, #1975)\r\n  * Streaming function tools preserve consumer panics. `agenttool` keeps code-execution output in sub-agent results. Running an agent without `Run` returns an error instead of doing nothing. (#1961, #1860, #1850)\r\n  * `launcher.Config.TelemetryOptions` honors `WithOtelToCloud`. Live reconnect matches close code 1008 by type, not by error text. (#1968, #1993)\r\n* **CLI**: `adkgo deploy agentengine --mem_deploy` no longer defaults Memory Bank to gemini-2.5-flash, which Vertex AI stopped serving to new projects. Memory Bank applies its own default model unless `--mem_model` is set. (#1902)\r\n* **Agent Analytics plugin** (`plugin/agentanalytics`, its own module and tag): aligned with adk-python's schema and event vocabulary, with rich session, HITL, A2A and workflow events, GCS offloading of multimodal content, opt-in exactly-once delivery, drop statistics, hierarchical span ids with latency and time-to-first-token, and 25 pre-built per-event BigQuery views. (#1786, #1787, #1788, #1789, #1790, #1791 and follow-up fixes)\r\n\r\n### Breaking changes\r\n\r\n* **Telemetry schema**: ADK now emits the OpenTelemetry GenAI semantic conventions v2. The legacy log events are replaced by one `gen_ai.client.inference.operation.details` event per model call, message content on spans is a structured value rather than a JSON string, `execute_tool` records arguments and results only when span content capture is on (under `gen_ai.tool.call.*`), and an LLM-agent root gets a new `invoke_workflow` parent span. Set `ADK_TELEMETRY_SCHEMA_VERSION_OPT_IN=otel_semconv_1_36` to restore the previous format, supported until at least March 31, 2027. (#1635)\r\n* **Model calls are capped at 500 per invocation**: a run that makes more than 500 model calls now ends with an error wrapping `agent.ErrLLMCallsLimitExceeded`. Raise the cap with `RunConfig.MaxLLMCalls` or `ADK_MAX_LLM_CALLS`, or set `MaxLLMCalls` to `-1` for no limit. Unlike adk-python, `0` means the default, not unlimited. (#1412)\r\n* **Optional instruction placeholders propagate errors**: `{key?}` and `{artifact.name?}` render empty only when the key or artifact is missing (`session.ErrStateKeyNotExist`, `fs.ErrNotExist`). Any other error from the session or artifact service now fails the run. A custom `artifact.Service` must wrap `fs.ErrNotExist` for missing files, and an `agenttool` sub-agent with an optional artifact placeholder now errors when the root runner has no artifact service. (#1748)\r\n* **Go 1.26.10 is required**: `go.mod` moves from 1.26.6 to 1.26.10. (#1916)\r\n* **Agent Analytics plugin defaults**: the default table name is `agent_events` instead of `events`, existing tables are upgraded additively on startup unless `DisableSchemaUpgrade` is set, the per-event views are created on startup unless `DisableCreateViews` is set, and granular event types (`STATE_DELTA`, `AGENT_TRANSFER`, `HITL_*`, `NODE_OUTPUT`, …) replace the generic `EVENT` row. These apply when the plugin module is next tagged, not to the core `v2.7.0` tag. (#1786, #1788, #1791)\r\n\r\nSmaller behavior changes:\r\n\r\n* `geminitool.GoogleSearch` returns an error on a non-Gemini model, and on a Gemini 1.x model combined with other tools. (#2026)\r\n* `launcher`: passing `telemetry.WithOtelToCloud(true)` in `TelemetryOptions` now exports to Google Cloud and needs credentials at startup, where it used to start with export silently off. (#1968)\r\n* `openaimodel`: a config field added by a genai release newer than v1.74.0 is refused with `ErrUnsupportedConfigField`. Configs valid today are unaffected. (#1922)\r\n* `mcptoolset` with `Config.Auth` opens one session per distinct credential, closes sessions idle for 10 minutes, and caps the pool at 64. Without `Auth` nothing changes. (#1755)\r\n* `LoopAgent` yields the context error once and stops when its context is cancelled, where it used to keep looping if no pass yielded an event. (#1810)\r\n* An agent callback that saves an artifact and returns nil now yields one event carrying the `ArtifactDelta`, where it yielded none. (#1878)\r\n* The in-memory memory service no longer stores or matches thought parts, and an event with only thought text is not stored. (#1975)\r\n* Deprecated: `artifact.SaveRequest.Version`. `Save` has never read it. (#1985)\r\n\r\n<details>\r\n<summary>All changes</summary>\r\n\r\n## What's Changed\r\n* feat(tool): add search-gated tool discovery by @wolo-lab in https://github.com/google/adk-go/pull/1734\r\n* docs(examples/toolsearch): add a tool search sample by @wolo-lab in https://github.com/google/adk-go/pull/1735\r\n* fix(agent): report an error when an agent without Run is run by @wolo-lab in https://github.com/google/adk-go/pull/1850\r\n* docs(artifact): fix service references in doc comments by @ktsoator in https://github.com/google/adk-go/pull/1775\r\n* feat(agentanalytics): align schema, event vocabulary, redaction, and core contract with adk-python by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1786\r\n* fix(loopagent): stop on context cancellation by @anzal1 in https://github.com/google/adk-go/pull/1810\r\n* feat(runner): bound model calls per invocation with RunConfig.MaxLLMCalls by @venkat-uk in https://github.com/google/adk-go/pull/1412\r\n* fix(llminternal): prevent silent context degradation by propagating systemic state failures by @karthik-0306 in https://github.com/google/adk-go/pull/1748\r\n* test(model/gemini): pin the last citation and accepting AutomaticContinuation by @baptmont in https://github.com/google/adk-go/pull/1825\r\n* test(llminternal): match isResumable's doc and test table to the errors it sees by @harshitwandhare in https://github.com/google/adk-go/pull/1750\r\n* docs(loopagent): say the context is checked before each pass by @anzal1 in https://github.com/google/adk-go/pull/1861\r\n* refactor(workflow): remove redundant goroutine in scheduleRetry by @moodbased in https://github.com/google/adk-go/pull/1849\r\n* docs(compaction): list the GenerateContentConfig fields the summarizer uses by @karolpiotrowicz in https://github.com/google/adk-go/pull/1828\r\n* fix(agenttool): preserve code output in sub-agent results by @ktsoator in https://github.com/google/adk-go/pull/1860\r\n* feat(mcptoolset): identify ADK in the User-Agent of MCP HTTP requests by @wolo-lab in https://github.com/google/adk-go/pull/1862\r\n* fix(mcptoolset): stop using context.Background() in connectionRefresher.Close by @wolo-lab in https://github.com/google/adk-go/pull/1844\r\n* feat(model/openaimodel): support image/file input via genai InlineData/FileData parts by @tonydzi in https://github.com/google/adk-go/pull/1543\r\n* feat(agentanalytics): add concurrency-safe trace manager, latency_ms, and streaming TTFT by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1787\r\n* fix(llminternal): record model callback artifact saves on the event by @Vivek1106-04 in https://github.com/google/adk-go/pull/1800\r\n* fix(agent): record artifact-only deltas from before/after agent callbacks by @anzal1 in https://github.com/google/adk-go/pull/1878\r\n* fix(workflow): restore completed predecessors when resuming joins by @lucky798213 in https://github.com/google/adk-go/pull/1572\r\n* fix(agent): make WithAgentTimeout work on tool and callback contexts by @jaideeppyne in https://github.com/google/adk-go/pull/1604\r\n* test(model/gemini): pin that MAX_TOKENS after CONTINUATION is not resumed by @beiryu in https://github.com/google/adk-go/pull/1872\r\n* chore(deps): bump the go-minor-patch group with 2 updates by @dependabot[bot] in https://github.com/google/adk-go/pull/1901\r\n* chore(deps): bump golang.org/x/net to v0.60.0 in agentanalytics by @wojtas000 in https://github.com/google/adk-go/pull/1908\r\n* feat(telemetry)!: default to experimental GenAI semconv, with ADK_TELEMETRY_SCHEMA_VERSION_OPT_IN=otel_semconv_1_36 rollback by @RKest in https://github.com/google/adk-go/pull/1635\r\n* fix(adkgo/deploy): stop defaulting Memory Bank to gemini-2.5-flash by @wojtas000 in https://github.com/google/adk-go/pull/1902\r\n* feat(agentanalytics): emit rich session/HITL/A2A/workflow events and classify tool_origin by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1788\r\n* Upgrading go to 1.26.10 by @kdroste-google in https://github.com/google/adk-go/pull/1916\r\n* fix(agentanalytics): redact credentials when a value ends in a key name by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1863\r\n* feat(agentanalytics): add race-free GCS multimodal offloading and ObjectRef support by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1789\r\n* chore(v2): update Go version requirements in documentation by @ktsoator in https://github.com/google/adk-go/pull/1926\r\n* fix(agentanalytics): preserve live spans when tasks resume by @jabrailkhalil in https://github.com/google/adk-go/pull/1910\r\n* fix(agentanalytics): never mark workflow agents taskDelegated by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1935\r\n* feat(agentanalytics): pause GCS uploads after batch timeout and preserve run-end flush budget by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1936\r\n* feat(agentanalytics): add DropStats, ExactlyOnceDelivery, and schema setup hardening by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1790\r\n* fix(agentanalytics): preserve invocation spans for late callbacks by @jabrailkhalil in https://github.com/google/adk-go/pull/1911\r\n* fix(agentanalytics): ExactlyOnceDelivery and DropStats follow-ups from #1790 by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1943\r\n* feat(agentanalytics): add pre-built per-event BigQuery analytics views by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1791\r\n* chore(deps): bump the go-minor-patch group with 3 updates by @dependabot[bot] in https://github.com/google/adk-go/pull/1969\r\n* fix(agentanalytics): log a deferred GCS retry only when it is requeued by @leilei3167 in https://github.com/google/adk-go/pull/1941\r\n* fix(session/vertexai): persist live transcriptions by @DisturbedCrow in https://github.com/google/adk-go/pull/1964\r\n* fix(agentanalytics): pause stalled run-end uploads across batches by @ktsoator in https://github.com/google/adk-go/pull/1947\r\n* fix(llmagent): save output_key when a before-agent callback short-circuits by @anzal1 in https://github.com/google/adk-go/pull/1963\r\n* fix(functiontool): preserve streaming consumer panics by @jabrailkhalil in https://github.com/google/adk-go/pull/1961\r\n* fix(launcher): honor WithOtelToCloud in launcher.Config.TelemetryOptions by @Saurav-Gupta-9741 in https://github.com/google/adk-go/pull/1968\r\n* fix(memory): skip thought parts in in-memory search and preloaded memories by @Vivek1106-04 in https://github.com/google/adk-go/pull/1975\r\n* chore(deps): bump the go_modules group across 1 directory with 2 updates by @dependabot[bot] in https://github.com/google/adk-go/pull/1934\r\n* fix(auth): keep the init context alive so token sources can refresh by @wojtas000 in https://github.com/google/adk-go/pull/1904\r\n* fix(openaimodel): use adk_response when the schema title is not a valid format name by @wojtas000 in https://github.com/google/adk-go/pull/1912\r\n* fix(openaimodel): refuse config fields genai adds before they are supported by @wojtas000 in https://github.com/google/adk-go/pull/1922\r\n* fix(ci): stop every CI run from building with an empty Go cache by @baptmont in https://github.com/google/adk-go/pull/1972\r\n* fix(agentanalytics): report the right terminal row in more failure cases by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1952\r\n* feat(model/anthropicmodel): add Anthropic Claude model support by @ScottMansfield in https://github.com/google/adk-go/pull/1866\r\n* docs(artifact): deprecate SaveRequest.Version by @wojtas000 in https://github.com/google/adk-go/pull/1985\r\n* fix(agentanalytics): cap deferred retry upload budget and pause on shorter run-end stalls by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1955\r\n* fix(llminternal): match close code 1008 by type in isResumable by @wojtas000 in https://github.com/google/adk-go/pull/1993\r\n* fix(agentanalytics): tidy span bookkeeping, comments and tests by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1953\r\n* fix(agentanalytics): release deferred upload reservations on append or Close panic by @haiyuan-eng-google in https://github.com/google/adk-go/pull/1954\r\n* fix(mcptoolset): give each user its own MCP session with Config.Auth by @Vivek1106-04 in https://github.com/google/adk-go/pull/1755\r\n* feat(exp): add classifier interface and TypeSafe Jev decision model client by @rafal-glowinski in https://github.com/google/adk-go/pull/2003\r\n* Added google_maps, url_contex + gemini guards by @kdroste-google in https://github.com/google/adk-go/pull/2026\r\n* feat(exp): add workflow routing Node for classifiers by @rafal-glowinski in https://github.com/google/adk-go/pull/2005\r\n* feat(exp): add LLMClassifier backed by model.LLM by @rafal-glowinski in https://github.com/google/adk-go/pull/2035\r\n* feat(toolauth): add adk-python's auth data model and wire format by @jjsasha63 in https://github.com/google/adk-go/pull/2032\r\n* Update version.go by @baptmont in https://github.com/google/adk-go/pull/2031\r\n\r\n## New Contributors\r\n* @haiyuan-eng-google made their first contribution in https://github.com/google/adk-go/pull/1786\r\n* @venkat-uk made their first contribution in https://github.com/google/adk-go/pull/1412\r\n* @tonydzi made their first contribution in https://github.com/google/adk-go/pull/1543\r\n* @jaideeppyne made their first contribution in https://github.com/google/adk-go/pull/1604\r\n* @beiryu made their first contribution in https://github.com/google/adk-go/pull/1872\r\n* @DisturbedCrow made their first contribution in https://github.com/google/adk-go/pull/1964\r\n* @Saurav-Gupta-9741 made their first contribution in https://github.com/google/adk-go/pull/1968\r\n* @ScottMansfield made their first contribution in https://github.com/google/adk-go/pull/1866\r\n* @rafal-glowinski made their first contribution in https://github.com/google/adk-go/pull/2003\r\n\r\n</details>\r\n\r\n**Full Changelog**: https://github.com/google/adk-go/compare/v2.6.0...v2.7.0\r\n\r\n## New Contributors\r\n* @haiyuan-eng-google made their first contribution in https://github.com/google/adk-go/pull/1786\r\n* @venkat-uk made their first contribution in https://github.com/google/adk-go/pull/1412\r\n* @tonydzi made their first contribution in https://github.com/google/adk-go/pull/1543\r\n* @jaideeppyne made their first contribution in https://github.com/google/adk-go/pull/1604\r\n* @beiryu made their first contribution in https://github.com/google/adk-go/pull/1872\r\n* @DisturbedCrow made their first contribution in https://github.com/google/adk-go/pull/1964\r\n* @Saurav-Gupta-9741 made their first contribution in https://github.com/google/adk-go/pull/1968\r\n* @ScottMansfield made their first contribution in https://github.com/google/adk-go/pull/1866\r\n* @rafal-glowinski made their first contribution in https://github.com/google/adk-go/pull/2003\r\n\r\n","mentions_count":26}
