in https://github.com/google/adk-go/pull/1470\r\n* fix(model/openaimodel): source the streamed function name from output_item.added by @dependabot[bot] in https://github.com/google/adk-go/pull/1616\r\n* fix(adkrest): refuse DNS-rebinding hosts and cross-origin browsers by @jjsasha63 in https://github.com/google/adk-go/pull/1615\r\n* fix(web): bind web server to loopback by default by @AARUSHGAUR in https://github.com/google/adk-go/pull/1456\r\n* fix: map response finish reasons to semantic conventions by @mikemikimike in https://github.com/google/adk-go/pull/1474\r\n* fix(model/openaimodel): give property-less objects the strict-schema keys by @wojtas000 in https://github.com/google/adk-go/pull/1614\r\n* fix(launcher): declare the web bind address to the REST server by @jjsasha63 in https://github.com/google/adk-go/pull/1623\r\n* fix(llminternal): bound RunLive's reconnect loop by @jjsasha63 in https://github.com/google/adk-go/pull/1621\r\n* fix(tool): apply WithConfirmation to streaming tools by @jjsasha63 in https://github.com/google/adk-go/pull/1596\r\n* fix(adkgo/deploy): use a long timeout for Agent Engine op.Wait by @nuthalapativarun in https://github.com/google/adk-go/pull/1590\r\n* fix(functiontool): wrap non-map results only when they can be marshaled by @Trainingcqy in https://github.com/google/adk-go/pull/1586\r\n* fix(agent): keep the invocation when WithICDelta returns nil by @wolo-lab in https://github.com/google/adk-go/pull/1521\r\n* ci: require a linked issue, and document stale pull request takeover by @jjsasha63 in https://github.com/google/adk-go/pull/1593\r\n* fix(model/openaimodel): stop replaying prior-turn reasoning to the API by @hanorik in https://github.com/google/adk-go/pull/1395\r\n* feat(agent): recover the invocation identity from a plain context by @wolo-lab in https://github.com/google/adk-go/pull/1522\r\n* fix(exampletool): skip example injection when the invocation has no user content by @rishabhsai in https://github.com/google/adk-go/pull/1573\r\n* fix(workflow): stop yielding after consumer exits by @cruvie in https://github.com/google/adk-go/pull/1550\r\n* fix(adkrest): declare UTF-8 charset on the SSE content type by @baptmont in https://github.com/google/adk-go/pull/1629\r\n* test(launcher/web): bind the exact server address in bind-failure tests by @Vivek1106-04 in https://github.com/google/adk-go/pull/1638\r\n* feat(authn): add a Google OIDC authenticator by @herdiyana256 in https://github.com/google/adk-go/pull/1636\r\n* test(authn): pin the audience a Google OIDC authenticator enforces by @wolo-lab in https://github.com/google/adk-go/pull/1646\r\n* fix(loadartifactstool): stop double-wrapping the artifact load error by @rishabhsai in https://github.com/google/adk-go/pull/1574\r\n* fix(llminternal): build arrays when assembling streamed function call arguments by @ashrodan in https://github.com/google/adk-go/pull/1630\r\n* feat(auth/gcp): add GCP credential provider by @wolo-lab in https://github.com/google/adk-go/pull/1173\r\n* chore(deps): bump the go-minor-patch group with 4 updates by @dependabot[bot] in https://github.com/google/adk-go/pull/1653\r\n* fix(launcher): pin the webui-before-api order, and clarify the adk-web pin by @jjsasha63 in https://github.com/google/adk-go/pull/1536\r\n* fix(adkrest): gate the agent graph routes behind IncludeDebugAPI by @jjsasha63 in https://github.com/google/adk-go/pull/1534\r\n* fix: skip nil responses in generateContent by @koriyoshi2041 in https://github.com/google/adk-go/pull/630\r\n* fix(adkrest,web): limit request body size to mitigate memory-exhaustion DoS by @AARUSHGAUR in https://github.com/google/adk-go/pull/1457\r\n* feat(auth): add CredentialStore and cache GCP credentials by @wolo-lab in https://github.com/google/adk-go/pull/1174\r\n* fix: preserve orphan response content during rearrangement by @ktsoator in https://github.com/google/adk-go/pull/1564\r\n* test(auth): make arm() force a sweep on a coarse clock by @harshitwandhare in https://github.com/google/adk-go/pull/1668\r\n* fix(llminternal): drop unanswered function calls from request contents by @QuentinBisson in https://github.com/google/adk-go/pull/1669\r\n* docs(session/database): document that AutoMigrate must run on every startup by @wolo-lab in https://github.com/google/adk-go/pull/1670\r\n* fix(agenttool): share artifacts with parent agents by @ktsoator in https://github.com/google/adk-go/pull/1654\r\n* refactor(llmagent): give State.IncludeContents an internal type by @jjsasha63 in https://github.com/google/adk-go/pull/1462\r\n* fix(auth/gcp): pin the default builder's context, and correct its comments by @wolo-lab in https://github.com/google/adk-go/pull/1647\r\n* fix(adkrest): limit /run_live WebSocket message size by @prasanna8585 in https://github.com/google/adk-go/pull/1664\r\n* feat(artifact): guarantee artifact version metadata by @yiaany in https://github.com/google/adk-go/pull/1440\r\n* docs(session): clarify that state prefixes do not compose by @indurireddy-TF in https://github.com/google/adk-go/pull/1674\r\n* fix(session/database): persist input and output transcriptions by @Vivek1106-04 in https://github.com/google/adk-go/pull/1662\r\n* feat(openaimodel): support the Chat Completions API by @wojtas000 in https://github.com/google/adk-go/pull/1642\r\n* refactor(openaimodel): split Chat Completions and Responses endpoints into sub-packages by @wojtas000 in https://github.com/google/adk-go/pull/1643\r\n* test: keep model registry and llminternal logging tests repeatable by @Vivek1106-04 in https://github.com/google/adk-go/pull/1657\r\n* chore(version): bump the tagged version constant to 2.5.0 by @wolo-lab in https://github.com/google/adk-go/pull/1677\r\n* fix(agentengine): base64-encode []byte fields instead of failing thei\u2026 by @rizukijr in https://github.com/google/adk-go/pull/1387\r\n* feat: Add daily time partitioning to BigQuery event logging table by @vasilyl in https://github.com/google/adk-go/pull/1377\r\n\r\n#### Breaking changes\r\n\r\n* **Session tables gain two columns** ([#1662](https://github.com/google/adk-go/pull/1662)): `session/database` now stores live-audio input and output transcriptions, in two new nullable columns on the `events` table. `DatabaseSessionService` never creates or alters tables on its own, so call `database.AutoMigrate` on every startup. A database that is not migrated fails to write events once this release is deployed. If you manage the schema by hand, add `input_transcription` and `output_transcription` before you deploy. See [Sessions: DatabaseSessionService](https://google.github.io/adk-docs/sessions/session/).\r\n* **`adk web` listens on loopback by default** ([#1456](https://github.com/google/adk-go/pull/1456)): the web launcher binds `127.0.0.1` instead of every interface. Pass `-host 0.0.0.0` to restore the old behavior. You need that flag inside a container and whenever another machine must reach the server. Dockerfiles generated by `adkgo deploy` already pass it. A Dockerfile you wrote yourself needs it added.\r\n* **Cross-origin browser requests are refused** ([#1615](https://github.com/google/adk-go/pull/1615), [#1623](https://github.com/google/adk-go/pull/1623)): the REST server and the `/run_live` WebSocket now answer 403 to a browser whose `Origin` is neither the server's own nor the one given in `-webui_address`. On a loopback bind they also answer 403 to a request whose `Host` is not a loopback name, which blocks DNS-rebinding attacks. Non-browser clients and same-origin pages are unaffected. If you serve the UI from another origin, set `-webui_address` to it. If you embed `adkrest.NewServer` behind a reverse proxy on the same machine, add the proxy's origin to the new `ServerConfig.AllowedOrigins`. `'*'` turns the checks off.\r\n* **Request size limits** ([#1457](https://github.com/google/adk-go/pull/1457), [#1664](https://github.com/google/adk-go/pull/1664)): the REST server and every route behind the web launcher, including the Pub/Sub and Eventarc triggers, reject request bodies over 10 MiB with HTTP 400. Raise the limit with `-max_request_body_size`, `launcher.Config.MaxPayloadSize` or `adkrest.ServerConfig.MaxPayloadSize`. `/run_live` closes the connection on any single WebSocket message over 16 MiB. That limit is not configurable.\r\n* **Agent graph routes require the debug API** ([#1534](https://github.com/google/adk-go/pull/1534)): `build_graph` and `build_graph_image` return the agent tree and every tool it can call, so they are now registered only when `IncludeDebugAPI` is set. Pass `-include_debug_api` to the `api` sublauncher if you use the agent graph view in ADK Web.\r\n* **`gcp.Client.RetrieveCredential` returns `*gcp.Retrieval`** ([#1174](https://github.com/google/adk-go/pull/1174)): it used to return `auth.Credential`. The new struct carries the credential together with its expiry. Read `.Credential` for the old value. Code that only uses `gcp.NewProvider` is unaffected.\r\n* **`artifact.SaveRequest` is no longer comparable** ([#1440](https://github.com/google/adk-go/pull/1440)): the new `CustomMetadata map[string]any` field means `SaveRequest` values can no longer be compared with `==`, used as map keys, or passed where a `comparable` type parameter is required.\r\n\r\nA few changes alter what agents send or report without affecting most setups:\r\n\r\n* **Telemetry values:** `gen_ai.usage.input_tokens` now includes tool-use prompt tokens, so calls that use Google Search, Maps or code execution report higher input counts, matching what Gemini bills ([#1525](https://github.com/google/adk-go/pull/1525)). `gen_ai.response.finish_reasons` carries semantic-convention values such as `stop` and `length` instead of `STOP` and `MAX_TOKENS` ([#1474](https://github.com/google/adk-go/pull/1474)).\r\n* **Request history:** a function call with an ID and no function response is no longer sent to the model ([#1669](https://github.com/google/adk-go/pull/1669)). Long-running tool calls are kept.\r\n* **`openaimodel` tools:** function tools are always sent with `strict: false`. Tools whose schema used to qualify for strict validation now get best-effort validation instead ([#1389](https://github.com/google/adk-go/pull/1389)).\r\n* **Stored events:** stored events no longer keep `temp:` state keys in the in-memory and Vertex AI session services ([#1356](https://github.com/google/adk-go/pull/1356), [#1514](https://github.com/google/adk-go/pull/1514)). This restores the documented behavior.\r\n\r\n\r\n## New Contributors\r\n* @dhakad22klx made their first contribution in https://github.com/google/adk-go/pull/1556\r\n* @somuai made their first contribution in https://github.com/google/adk-go/pull/1510\r\n* @leilei3167 made their first contribution in https://github.com/google/adk-go/pull/1494\r\n* @peterkarabinovic made their first contribution in https://github.com/google/adk-go/pull/1525\r\n* @jordigilh made their first contribution in https://github.com/google/adk-go/pull/1356\r\n* @AARUSHGAUR made their first contribution in https://github.com/google/adk-go/pull/1456\r\n* @rishabhsai made their first contribution in https://github.com/google/adk-go/pull/1573\r\n* @Vivek1106-04 made their first contribution in https://github.com/google/adk-go/pull/1638\r\n* @ashrodan made their first contribution in https://github.com/google/adk-go/pull/1630\r\n* @QuentinBisson made their first contribution in https://github.com/google/adk-go/pull/1669\r\n* @yiaany made their first contribution in https://github.com/google/adk-go/pull/1440\r\n* @rizukijr made their first contribution in https://github.com/google/adk-go/pull/1387\r\n\r\n**Full Changelog**: https://github.com/google/adk-go/compare/v2.4.0...v2.5.0","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":31}
