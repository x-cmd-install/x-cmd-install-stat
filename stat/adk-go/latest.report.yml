{"id":387092869,"author":{"login":"wolo-lab","id":274205925,"node_id":"U_kgDOEFgM5Q","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOk6zdc4XEpGF","tag_name":"v2.4.0","target_commitish":"main","name":"v2.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-11T14:01:05Z","updated_at":"2026-09-11T14:14:31Z","published_at":"2026-09-11T14:14:31Z","assets":[],"body":"## What's Changed\r\n* fix: pin a fetched agent card's interface URL(s) to the origin it was fetched from by @prasanna8585 in https://github.com/google/adk-go/pull/1418\r\n* feat(session/database): add NewSessionServiceFromDB constructor by @nuthalapativarun in https://github.com/google/adk-go/pull/724\r\n* fix(openaimodel): support optional function call output IDs by @ktsoator in https://github.com/google/adk-go/pull/1449\r\n* fix(workflow): normalize unordered set keywords in schema comparison by @winklemad in https://github.com/google/adk-go/pull/1138\r\n* fix: prevent saving non-text events to state by @tanghaowillow in https://github.com/google/adk-go/pull/1061\r\n* fix: resolve 'TODO: last event is not final' error in streaming mode \u2026 by @mahendrarathore1742 in https://github.com/google/adk-go/pull/638\r\n* chore(deps): bump google.golang.org/grpc from 1.82.1 to 1.83.1 in /plugin/agentanalytics in the go_modules group across 1 directory by @dependabot[bot] in https://github.com/google/adk-go/pull/1468\r\n* ci: Release automation with release-please by @wojtas000 in https://github.com/google/adk-go/pull/1398\r\n* fix(remoteagent/v2): run after-callbacks on aggregated artifact events by @PratikDhanave in https://github.com/google/adk-go/pull/1206\r\n* docs(agent): explain why runAfterAgentCallbacks does not end the invocation by @jjsasha63 in https://github.com/google/adk-go/pull/1461\r\n* fix(mcptoolset): allow valid empty text tool responses (#1352) by @chill-czar in https://github.com/google/adk-go/pull/1353\r\n* fix(cmd/launcher/web): initialize telemetry before starting HTTP server (#1350) by @chill-czar in https://github.com/google/adk-go/pull/1351\r\n* fix(workflow): make ParallelWorker fail-fast actually stop new dispatch under maxConcurrency by @AmirF194 in https://github.com/google/adk-go/pull/1239\r\n* fix(openaimodel): preserve caller-owned JSON schemas by @ktsoator in https://github.com/google/adk-go/pull/1451\r\n* fix(mcptoolset): report non-text-only tool results instead of dropping them by @jjsasha63 in https://github.com/google/adk-go/pull/1473\r\n* fix: agenttool SkipSummarization terminates parent agent loop by @rsd-darshan in https://github.com/google/adk-go/pull/908\r\n* ci: run the Go workflow on every pull request by @wolo-lab in https://github.com/google/adk-go/pull/1445\r\n* fix(session): report a missing session as session.ErrNotFound by @jjsasha63 in https://github.com/google/adk-go/pull/1458\r\n* fix(adkrest): serve the endpoints the ADK web UI actually calls by @jjsasha63 in https://github.com/google/adk-go/pull/1459\r\n* fix(launcher/web): default the artifact and memory services, and serve the UI correctly by @jjsasha63 in https://github.com/google/adk-go/pull/1460\r\n* ci: ask for a linked issue or a description on new PRs by @jjsasha63 in https://github.com/google/adk-go/pull/1480\r\n* ci: automate v1 backports from the v1-needed label by @baptmont in https://github.com/google/adk-go/pull/1327\r\n* docs: ask the two PR-template questions that catch the most defects by @karolpiotrowicz in https://github.com/google/adk-go/pull/1506\r\n* docs(examples): update launcher documentation by @ktsoator in https://github.com/google/adk-go/pull/1496\r\n* fix(runner): stop nil event loops after cancellation by @wmh123wmh1 in https://github.com/google/adk-go/pull/1479\r\n* fix(llmagent): resolve agent mode per placement instead of mutating the shared agent by @wolo-lab in https://github.com/google/adk-go/pull/1267\r\n* fix(workflow): suppress retries while draining by @cruvie in https://github.com/google/adk-go/pull/1512\r\n* chore(deps): bump the go-minor-patch group with 12 updates by @dependabot[bot] in https://github.com/google/adk-go/pull/1517\r\n* fix(auth): keep the consent URI out of ConsentRequiredError's message by @wolo-lab in https://github.com/google/adk-go/pull/1519\r\n* fix(openaimodel): preserve refusals and completed stream content by @ktsoator in https://github.com/google/adk-go/pull/1467\r\n* docs: state the pre-PR checks that reviews keep catching by @karolpiotrowicz in https://github.com/google/adk-go/pull/1492\r\n* fix(memory): rank and limit search results with non-ASCII substring matching by @ktsoator in https://github.com/google/adk-go/pull/1528\r\n* fix(model/openaimodel): correct finish reason, logprobs and tool calls when a stream ends by @hanorik in https://github.com/google/adk-go/pull/1373\r\n* fix(backport): stop re-posting the conflict comment on every run by @baptmont in https://github.com/google/adk-go/pull/1530\r\n* fix(mcptoolset): render non-text unstructured tool results by @ktsoator in https://github.com/google/adk-go/pull/1401\r\n* fix: ignore stale function responses by @gustafvh in https://github.com/google/adk-go/pull/766\r\n* fix(model/openaimodel): surface server-side response failures by @hanorik in https://github.com/google/adk-go/pull/1359\r\n* fix(model/openaimodel): account for every generation config field by @hanorik in https://github.com/google/adk-go/pull/1392\r\n* docs: fix contributing links in PR template by @keeltrace in https://github.com/google/adk-go/pull/1545\r\n* fix: validate deploy CLI values embedded in generated Dockerfile content by @herdiyana256 in https://github.com/google/adk-go/pull/1240\r\n* docs: add a self-review gate and the conventions reviews keep repeating by @wolo-lab in https://github.com/google/adk-go/pull/1558\r\n* fix(session): snapshot events under read lock in database and vertexa\u2026 by @lucky798213 in https://github.com/google/adk-go/pull/1559\r\n* fix(examples): validate generated image responses by @ktsoator in https://github.com/google/adk-go/pull/1478\r\n* fix(auth/gcp): keep caller identifiers out of service error text by @wolo-lab in https://github.com/google/adk-go/pull/1520\r\n* feat(adkrest): add authentication and authorization to the REST API by @kdroste-google in https://github.com/google/adk-go/pull/1561\r\n* fix(llminternal): keep a late tool completion as the final content by @jjsasha63 in https://github.com/google/adk-go/pull/1428\r\n* test(adkrest/models): add EventActions field mapping coverage by @nuthalapativarun in https://github.com/google/adk-go/pull/726\r\n* test(adkrest): add RunLiveHandler WebSocket integration coverage by @wmh123wmh1 in https://github.com/google/adk-go/pull/1453\r\n* fix(agentanalytics): drain the aborted write stream to recover the append status by @Trainingcqy in https://github.com/google/adk-go/pull/1318\r\n* fix(artifact/gcsartifact): return the gs:// form as CanonicalURI by @baptmont in https://github.com/google/adk-go/pull/1563\r\n* cleanup: update Loader documentation and add interface checks by @hyangah in https://github.com/google/adk-go/pull/651\r\n* chore(version): bump the tagged version constant to 2.4.0 by @wolo-lab in https://github.com/google/adk-go/pull/1570\r\n\r\n## New Contributors\r\n* @tanghaowillow made their first contribution in https://github.com/google/adk-go/pull/1061\r\n* @mahendrarathore1742 made their first contribution in https://github.com/google/adk-go/pull/638\r\n* @AmirF194 made their first contribution in https://github.com/google/adk-go/pull/1239\r\n* @rsd-darshan made their first contribution in https://github.com/google/adk-go/pull/908\r\n* @wmh123wmh1 made their first contribution in https://github.com/google/adk-go/pull/1479\r\n* @cruvie made their first contribution in https://github.com/google/adk-go/pull/1512\r\n* @keeltrace made their first contribution in https://github.com/google/adk-go/pull/1545\r\n* @herdiyana