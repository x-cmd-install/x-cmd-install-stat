ogle/adk-go/pull/1721\r\n* fix(server/triggers): honor MaxConcurrentRuns in PubSubController by @PratikDhanave in https://github.com/google/adk-go/pull/1720\r\n* chore(lint): forbid process-wide logging in library code by @jjsasha63 in https://github.com/google/adk-go/pull/1649\r\n* fix(sequentialagent): serialize live completion tool injection by @jabrailkhalil in https://github.com/google/adk-go/pull/1722\r\n* fix(llminternal): leave ${var} and \\{var} placeholders literal by @Vivek1106-04 in https://github.com/google/adk-go/pull/1682\r\n* docs(memory): fix stale \"string\" wording on MemoryEntry.Timestamp by @PratikDhanave in https://github.com/google/adk-go/pull/1745\r\n* test(agentanalytics): cover the retry that opens a fresh stream by @Trainingcqy in https://github.com/google/adk-go/pull/1527\r\n* fix(vertexai): preserve ExecutableCode and CodeExecutionResult in session storage by @karthik-0306 in https://github.com/google/adk-go/pull/1729\r\n* test(examples): cover image precedence and empty results by @ktsoator in https://github.com/google/adk-go/pull/1567\r\n* fix(model/gemini): preserve empty text on thought-signature parts by @adilalperenciftci in https://github.com/google/adk-go/pull/1639\r\n* feat(mcptoolset): forward request-scoped metadata to MCP tool calls by @jjsasha63 in https://github.com/google/adk-go/pull/1429\r\n* fix(workflowagents): stop loop and sequential agents on sub-agent error by @Vivek1106-04 in https://github.com/google/adk-go/pull/1684\r\n* fix(adkrest): render nested workflow clusters in graph images by @leilei3167 in https://github.com/google/adk-go/pull/1724\r\n* fix(adkrest): bound /run_live messages, dead peers and concurrent sessions by @jjsasha63 in https://github.com/google/adk-go/pull/1648\r\n* test(vertexai): keep RPC replay independent of external network by @Ultronen in https://github.com/google/adk-go/pull/1548\r\n* fix(memory): normalize punctuation in in-memory search by @tejas5038 in https://github.com/google/adk-go/