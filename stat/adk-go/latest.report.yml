lemetry 0.21 by @jadams-positron in https://github.com/google/adk-go/pull/1335\r\n* chore(deps): bump the go-minor-patch group across 1 directory with 11 updates by @dependabot[bot] in https://github.com/google/adk-go/pull/1338\r\n* refactor: finalize streamed responses with complete metadata and unified turn completion logic by @hanorik in https://github.com/google/adk-go/pull/1355\r\n* fix: reject tool confirmations resumed from non-agent-authored events by @prasanna8585 in https://github.com/google/adk-go/pull/1357\r\n* fix(adka2a): mark emitted tasks with the ADK A2A extension by @baptmont in https://github.com/google/adk-go/pull/1246\r\n* fix(adkrest): decode chunked create-session request bodies by @jesseedcp in https://github.com/google/adk-go/pull/1307\r\n* feat(auth/gcp): add credentials-service REST client by @wolo-lab in https://github.com/google/adk-go/pull/1149\r\n* fix(llminternal): read streaming mode from RunConfig to avoid nil deref by @rootkiller6788 in https://github.com/google/adk-go/pull/1336\r\n* fix(llm): ignore sibling branches for current turn by @vivekjm in https://github.com/google/adk-go/pull/1367\r\n* fix(llmagent): scope -httprecord directives so one cassette re-records alone by @chethanuk in https://github.com/google/adk-go/pull/1362\r\n* fix(llminternal): reject tool confirmations with conflicting requests by @kdroste-google in https://github.com/google/adk-go/pull/1369\r\n* fix: only first artifact delta from multiple tool calls is being kept by @mgmcintyre in https://github.com/google/adk-go/pull/474\r\n* docs: Explain adka2a handler wiring by @Haihan-Jiang in https://github.com/google/adk-go/pull/893\r\n* docs(examples/agentregistry): add discovery and capability-binding samples by @wolo-lab in https://github.com/google/adk-go/pull/1266\r\n* docs(examples/agentregistry): add an A2A publish-and-resolve sample by @wolo-lab in https://github.com/google/adk-go/pull/1271\r\n* chore(deps): bump the go-minor-patch group with 4 updates by 