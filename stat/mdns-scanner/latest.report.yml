pe":"application/x-gtar","state":"uploaded","size":6249617,"digest":"sha256:09282358dd32c5988d461664649adcc6ea9b20c20454df567d6766e30e2e31be","download_count":1,"created_at":"2026-10-29T17:18:54Z","updated_at":"2026-10-29T17:18:55Z"},{"id":689309860,"node_id":"RA_kwDOOYmpSM4pFgik","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:a81e3bc5c1ba15a2e4cce2557e65b392fd9bd321f51029b038b88f452d7a12d0","download_count":0,"created_at":"2026-10-29T17:18:54Z","updated_at":"2026-10-29T17:18:55Z"}],"body":"## Release Notes\n\n### Dependencies\n\n- Raise the minimum supported Rust version to 1.95.0 and update `parking_lot` to 0.13.0, `aes` to 0.9.3, and `uuid` to 1.29.0.\n- Refresh `Cargo.lock`, including `zip` 9.1.3, `lzma-rust2` 0.23.0, and `typed-path` 0.13.0.\n- Update the `tempfile` dependency on `getrandom` to 0.4.3.\n- Update `rustls`/`rustls-webpki`/`ctutils`/`webpki-root-certs` to fix various vulnerabilities ([#329](https://github.com/CramBL/mdns-scanner/pull/329))\n- `ratatui-textarea`: 0.9.2 → 0.9.3 ([#329](https://github.com/CramBL/mdns-scanner/pull/329))\n- `dns-lookup`: 4.0.1 → 4.0.2 ([#329](https://github.com/CramBL/mdns-scanner/pull/329))\n- `insta`: 1.48.0 → 1.49.0 ([#329](https://github.com/CramBL/mdns-scanner/pull/329))\n- `tokio`: 1.53.1 → 1.54.1 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n- `axoupdater`: 0.10.2 → 0.10.3 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n- `smallvec`: 1.16.2 → 1.16.3 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n- `proptest`: 1.11.0 → 1.12.0 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n- `rstest`: 0.27.0 → 0.28.0 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n- `arboard`: 3.6.1 → 3.7.0 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n- `zip`: 8.6.0 → 9.0.5 ([#332](https://github.com/CramBL/mdns-scanner/pull/332))\n\n## Install mdns-scanner 1.0.2\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install CramBL/tap/mdns-scanner\n```\n\n## Download mdns-scanner 1.0.2\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [mdns-scanner-aarch64-apple-darwin.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-aarch64-apple-darwin.tar.gz.sha256) |\n| [mdns-scanner-x86_64-apple-darwin.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-x86_64-apple-darwin.tar.gz.sha256) |\n| [mdns-scanner-aarch64-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-aarch64-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-i686-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.2/mdns-scanner-i686-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-x86_64-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scann