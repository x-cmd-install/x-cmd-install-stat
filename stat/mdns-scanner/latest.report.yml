t_type":"application/x-gtar","state":"uploaded","size":6243948,"digest":"sha256:5c393607cb4b55c83ee7dc6b28184ab6e54489e7aac8f87470d94313bc96a1e1","download_count":0,"created_at":"2026-08-16T18:45:06Z","updated_at":"2026-08-16T18:45:06Z"},{"id":517107423,"node_id":"RA_kwDOOYmpSM4e0m7f","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:6a1d8b58f8912346c51e40e1cf57141f08a859afa9077e046b5c7f10e7d97c7e","download_count":0,"created_at":"2026-08-16T18:45:06Z","updated_at":"2026-08-16T18:45:06Z"}],"body":"## Release Notes\n\n### Added\n\n- Port scanning of the host selected in the table: choose from the standard port ranges or a custom list, optionally check the multicast DNS port. Each host keeps its last result, shown in the info popup.\n- A dedicated port-scan thread count, separate from the network scan, defaulting to `dynamic` or a fixed value from 1-8192.\n\n### Dependencies\n\n- Run `cargo update` (fixes [RUSTSEC-2026-0253](https://osv.dev/vulnerability/RUSTSEC-2026-0253))\n- `tokio`: 1.53.0 \u2192 1.53.1 ([#284](https://github.com/CramBL/mdns-scanner/pull/284))\n- `toml`: 1.1.2+spec-1.1.0 \u2192 1.1.3+spec-1.1.0 ([#284](https://github.com/CramBL/mdns-scanner/pull/284))\n- `toml_edit`: 0.25.12+spec-1.1.0 \u2192 0.25.13+spec-1.1.0 ([#284](https://github.com/CramBL/mdns-scanner/pull/284))\n- `thiserror`: 2.0.18 \u2192 2.0.19 ([#284](https://github.com/CramBL/mdns-scanner/pull/284))\n- `clap`: 4.6.2 \u2192 4.6.4 ([#284](https://github.com/CramBL/mdns-scanner/pull/284))\n\n## Install mdns-scanner 0.28.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install CramBL/tap/mdns-scanner\n```\n\n## Download mdns-scanner 0.28.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [mdns-scanner-aarch64-apple-darwin.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-aarch64-apple-darwin.tar.gz.sha256) |\n| [mdns-scanner-x86_64-apple-darwin.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-x86_64-apple-darwin.tar.gz.sha256) |\n| [mdns-scanner-aarch64-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-aarch64-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-i686-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-i686-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-x86_64-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-x86_64-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-powerpc64-unknown-linux-gnu.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v0.28.0/mdns-scanner-powerpc64-