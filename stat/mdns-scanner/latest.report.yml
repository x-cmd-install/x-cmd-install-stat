e":"application/x-gtar","state":"uploaded","size":6247320,"digest":"sha256:715bf5d4d727fd52b8eedd35a6e7f1172935e9904be8971eda8591bcf3e25a54","download_count":0,"created_at":"2026-09-24T09:48:51Z","updated_at":"2026-09-24T09:48:51Z"},{"id":585640610,"node_id":"RA_kwDOOYmpSM4i6Cqi","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:c59453eec7ffd849c59593fbaafe5edf2e5cb4214acc4ba26d2f556441417b6a","download_count":0,"created_at":"2026-09-24T09:48:51Z","updated_at":"2026-09-24T09:48:51Z"}],"body":"## Release Notes\n\nMDNS Scanner now runs on Android (Termux), see the [readme installation section for details](https://github.com/CramBL/mdns-scanner#on-android-with-termux)\n\n### Added\n\n- `ui.emojis` config option to turn off all emojis in the UI.\n- Clipboard support is now optional and off by default on Android/Termux, where it can't build anyway.\n- Enable the `wayland-data-protocol` feature on `arboard` which will attempt to initialize the clipboard under Wayland if `WAYLAND_DISPLAY` is set.\n\n### Dependencies\n\n- `hickory-proto`: 0.26.1 -> 0.26.3\n- `tikv-jemallocator`: 0.6.1 \u2192 0.7.1\n- Migrate from `tui-textarea` to `ratatui-textarea` and update from `0.7.0` to `0.9.2`\n\n## Install mdns-scanner 1.0.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install CramBL/tap/mdns-scanner\n```\n\n## Download mdns-scanner 1.0.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [mdns-scanner-aarch64-apple-darwin.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-aarch64-apple-darwin.tar.gz.sha256) |\n| [mdns-scanner-x86_64-apple-darwin.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-x86_64-apple-darwin.tar.gz) | Intel macOS | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-x86_64-apple-darwin.tar.gz.sha256) |\n| [mdns-scanner-aarch64-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-aarch64-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-i686-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-i686-pc-windows-msvc.zip) | x86 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-i686-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-x86_64-pc-windows-msvc.zip](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-x86_64-pc-windows-msvc.zip.sha256) |\n| [mdns-scanner-powerpc64-unknown-linux-gnu.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-powerpc64-unknown-linux-gnu.tar.gz) | PPC64 Linux | [checksum](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-powerpc64-unknown-linux-gnu.tar.gz.sha256) |\n| [mdns-scanner-powerpc64le-unknown-linux-gnu.tar.gz](https://github.com/CramBL/mdns-scanner/releases/download/v1.0.0/mdns-scanner-pow