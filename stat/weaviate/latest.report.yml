5e3ff00f6bd164b97","download_count":8,"created_at":"2026-10-13T06:37:38Z","updated_at":"2026-10-13T06:37:40Z"},{"id":636143411,"node_id":"RA_kwDOA0hXpc4l6scz","name":"weaviate-v1.40.1-linux-arm64.tar.gz.md5","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":33,"digest":"sha256:6622161dee1e85cf53b07bda0efdcdb2064579f054a38b41650810f78b9cce62","download_count":2,"created_at":"2026-10-13T06:37:41Z","updated_at":"2026-10-13T06:37:42Z"},{"id":636143449,"node_id":"RA_kwDOA0hXpc4l6sdZ","name":"weaviate-v1.40.1-linux-arm64.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":65,"digest":"sha256:0252fcb16327a460c7f6df5961efbac20ae236d920c0702c11d1ee22443387fe","download_count":2,"created_at":"2026-10-13T06:37:42Z","updated_at":"2026-10-13T06:37:43Z"}],"body":"## Breaking Changes\r\nnone\r\n\r\n## New Features\r\nnone\r\n\r\n## Fixes\r\n* Return 500, not 'already exists', when checking an object ID fails by @dirkkul in https://github.com/weaviate/weaviate/pull/13472\r\n* queue: replay a failed queue batch on the queue's next turn instead of blocking the workers by @asdine in https://github.com/weaviate/weaviate/pull/13454\r\n* Read backup objects into one buffer sized from the object length by @dirkkul in https://github.com/weaviate/weaviate/pull/13473\r\n* Fan out dedupe checkpoint planning across classes and expire abandoned checkpoints by @jeroiraz in https://github.com/weaviate/weaviate/pull/13363\r\n* shard: refuse multi-vector writes on indexes without multi-vector support by @asdine in https://github.com/weaviate/weaviate/pull/13464\r\n* hnsw: detect bootstrap in entrypoint enhausted scenario by @trengrj in https://github.com/weaviate/weaviate/pull/13480\r\n* Decode only what incremental backups read from base backup metadata by @dirkkul in https://github.com/weaviate/weaviate/pull/13475\r\n* Fix zlib to a version unaffected by CVE-2026-85091 by @dirkkul in https://github.com/weaviate/weaviate/pull/13482\r\n* Release a shard from the shard status gauge when it is torn down by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13476\r\n* Ci cache fixes by @dirkkul in https://github.com/weaviate/weaviate/pull/13486\r\n* Stop the drop-vector task loading a shard an unload released by @dirkkul in https://github.com/weaviate/weaviate/pull/13478\r\n* chore(lint): bump golangci-lint to v2.14.0 and pin the swagger-script install by @g-despot in https://github.com/weaviate/weaviate/pull/13495\r\n* fix(lsmkv): don't wait forever on shutdown for a memtable a failed flush left behind by @antas-marcin in https://github.com/weaviate/weaviate/pull/13387\r\n* queue: recover from unreadable and corrupt chunks without leaving them counted by @asdine in https://github.com/weaviate/weaviate/pull/13487\r\n* Stop schema updates loading a shard an unload released by @dirkkul in https://github.com/weaviate/weaviate/pull/13494\r\n* fix(backups): carry built-in role assignments with the user snapshot by @tsmith023 in https://github.com/weaviate/weaviate/pull/13481\r\n* Stop metrics and backup resume loading a shard an unload released by @dirkkul in https://github.com/weaviate/weaviate/pull/13502\r\n* queue: fix flaky tests that race the running scheduler by @asdine in https://github.com/weaviate/weaviate/pull/13504\r\n* test(concurrency): count only the goroutines a budget test starts by @aliszka in https://github.com/weaviate/weaviate/pull/13497\r\n* prepare release v1.39.11 by @moogacs in https://github.com/weaviate/weaviate/pull/13503\r\n* Update golang.org/x/net to fix CVE-2026-78663 etc by @dirkkul in https://github.com/weaviate/weaviate/pull/13509\r\n* perf: improve reindex vector dimensions at startup by @antas-marcin in https://github.com/weaviate/weaviate/pull/13190\r\n* fix(schema): never drop a live class that differs from an orphan only by case by @moogacs in https://github.com/weaviate/weaviate/pull/13513\r\n\r\n\r\n**Full Changelog**: https://github.com/weaviate/weaviate/compare/v1.40.0...v1.40.1","mentions_count":10}
