nt":8,"created_at":"2026-10-07T07:00:41Z","updated_at":"2026-10-07T07:00:43Z"},{"id":617871242,"node_id":"RA_kwDOA0hXpc4k0_eK","name":"weaviate-v1.40.0-linux-arm64.tar.gz.md5","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":33,"digest":"sha256:b5c4e1f452dbadb781a95f2e830b73df1f1f077500939df92c31af4e549cbdef","download_count":1,"created_at":"2026-10-07T07:00:44Z","updated_at":"2026-10-07T07:00:45Z"},{"id":617871292,"node_id":"RA_kwDOA0hXpc4k0_e8","name":"weaviate-v1.40.0-linux-arm64.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":65,"digest":"sha256:b3fd6cdae8f0d796d38563adf45c81dffee9fa82bd9359907d13c55ad954058a","download_count":1,"created_at":"2026-10-07T07:00:45Z","updated_at":"2026-10-07T07:00:46Z"}],"body":"## Breaking Changes\r\n\r\n*none*\r\n\r\n## Namespaces (GA)\r\n*Namespaces add control-plane and data isolation between users on a shared cluster.*\r\n\r\n* Namespaces: Gate tenant actions by @dirkkul in https://github.com/weaviate/weaviate/pull/12513\r\n* Namespaces: Add plumbing for namespace exister by @dirkkul in https://github.com/weaviate/weaviate/pull/12541\r\n* Pin replacement replicas to a namespace's home node by @dirkkul in https://github.com/weaviate/weaviate/pull/12554\r\n* Namespaces: Effective-suspended derivation + shard-materialization guards by @dirkkul in https://github.com/weaviate/weaviate/pull/12464\r\n* Namespaces: Add support for knowing which shards should be (un)loaded on suspend/resume by @dirkkul in https://github.com/weaviate/weaviate/pull/13123\r\n* Namespaces: Fix issues around references by @dirkkul in https://github.com/weaviate/weaviate/pull/13304\r\n* Make namespaces a feature requiring license by @dirkkul in https://github.com/weaviate/weaviate/pull/13298\r\n\r\n## Alter Schema - Drop vector index (GA)\r\n*Support for dropping inverted indices from existing properties, allowing users to reclaim disk space by removing indices that are no longer needed, with RBAC integration and multi-tenancy support.*\r\n\r\n* feat(drop-vector-index): resume interrupted strips from the recorded pending set by @antas-marcin in https://github.com/weaviate/weaviate/pull/12442\r\n* test(drop-vector-index): retry the write after a leader kill instead of failing on the rejoin blip by @antas-marcin in https://github.com/weaviate/weaviate/pull/12678\r\n* fix(drop-vector-index): remove the muvera bucket of a dropped multi-vector index by @antas-marcin in https://github.com/weaviate/weaviate/pull/12718\r\n* fix(drop-vector-index): remove hfresh directory and buckets when the index is dropped by @antas-marcin in https://github.com/weaviate/weaviate/pull/12720\r\n* fix(drop-vector-index): clear the dynamic upgrade verdict on the cold-tenant path by @antas-marcin in https://github.com/weaviate/weaviate/pull/12754\r\n* ci(drop-vector-index): split the cluster and async-indexing jobs in two by @antas-marcin in https://github.com/weaviate/weaviate/pull/12773\r\n* ci(drop-vector-index): always run drop vector index e2e tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/12910\r\n* fix(drop-vector-index): clear the dropped vector's dimension rows by @antas-marcin in https://github.com/weaviate/weaviate/pull/12918\r\n* feat(drop-vector-index): enable the drop vector index endpoint by default by @antas-marcin in https://github.com/weaviate/weaviate/pull/13071\r\n\r\n## Alter Schema - Reindex property (Preview)\r\n*Adds support for changing property's index types.*\r\n\r\n* chore(reindex): remove unreachable reindex and shard symbols by @etiennedi in https://github.com/weaviate/weaviate/pull/12708\r\n* chore: remove the /debug/index/rebuild/inverted* routes and the machinery only they could reach by @etiennedi in https://github.com/weaviate/weaviate/pull/12706\r\n* Delete the unreachable reindex restart-recovery path (OnBeforeLsmInit) by @etiennedi in https://github.com/weaviate/weaviate/pull/12704\r\n* Refuse property names that collide with migration directories by @etiennedi in https://github.com/weaviate/weaviate/pull/12873\r\n* fix(reindex): only checkpoint reindex progress once the data is durable by @etiennedi in https://github.com/weaviate/weaviate/pull/12877\r\n* fix(reindex): RAFT-numbered directories stop a restart reporting success on an unbuilt index by @etiennedi in https://github.com/weaviate/weaviate/pull/12888\r\n* reindex: durable migration record (part 1/2, inert) by @etiennedi in https://github.com/weaviate/weaviate/pull/12847\r\n* feat: node-level query admission control (P1b) by @etiennedi in https://github.com/weaviate/weaviate/pull/12078\r\n* fix(reindex): enable-rangeable becomes a semantic migration by @etiennedi in https://github.com/weaviate/weaviate/pull/12700\r\n* fix(reindex): index writes that land in a semantic migration's swap window by @etiennedi in https://github.com/weaviate/weaviate/pull/13001\r\n\r\n## HFresh\r\n*Extensive improvements including numerous performance optimizations reducing memory usage, disk writes, and allocations.*\r\n\r\n* perf(hfresh): parallelize rescoring with budget-aware workers by @asdine in https://github.com/weaviate/weaviate/pull/12487\r\n* perf(hfresh): read rescore vectors through one bucket view with pooled buffers by @asdine in https://github.com/weaviate/weaviate/pull/12490\r\n* perf(hfresh): warm the version map in the background at startup by @asdine in https://github.com/weaviate/weaviate/pull/12504\r\n* fix(hfresh): hold the posting lock during version map warmup by @asdine in https://github.com/weaviate/weaviate/pull/12612\r\n* fix(hfresh): decode centroid codes with the right quantizer in split/merge reassignment by @asdine in https://github.com/weaviate/weaviate/pull/12795\r\n* feat(hfresh): debug endpoint to reassign all vectors in place by @asdine in https://github.com/weaviate/weaviate/pull/12820\r\n* feat(hfresh): cluster posting splits on full-precision vectors by @asdine in https://github.com/weaviate/weaviate/pull/12863\r\n* perf(hfresh): fetch split vectors through a single bucket view by @asdine in https://github.com/weaviate/weaviate/pull/12875\r\n* fix(hfresh): resolve buckets per operation instead of caching them by @antas-marcin in https://github.com/weaviate/weaviate/pull/12887\r\n* config: remove the dead HFreshEnabled flag by @asdine in https://github.com/weaviate/weaviate/pull/12907\r\n* feat(debug): make shard optional for HFresh reassignment by @asdine in https://github.com/weaviate/weaviate/pull/13043\r\n* fix(hfresh): filtered search results depended on posting probe order by @abdelr in https://github.com/weaviate/weaviate/pull/13121\r\n* hfresh: count postings and shared buckets in the usage report by @asdine in https://github.com/weaviate/weaviate/pull/13214\r\n* debug: allow the debug vector rebuild on HFresh by @asdine in https://github.com/weaviate/weaviate/pull/13257\r\n\r\n## HFresh MUVERA\r\n\r\n* HFresh MUVERA: Decouple Routing and Rerank Budgets by @abdelr in https://github.com/weaviate/weaviate/pull/11785\r\n\r\n## Deduplicated Backups\r\n\r\n* Add opt-in dedupeReplicas backups: archive converged shards once, fan restore out to every replica by @jeroiraz in https://github.com/weaviate/weaviate/pull/12815\r\n* backup: dedupe unloaded shards from their persisted hashtree root by @jeroiraz in https://github.com/weaviate/weaviate/pull/13105\r\n* Gate deduplicated backups on a Weaviate license key by @jeroiraz in https://github.com/weaviate/weaviate/pull/13359\r\n\r\n## Search REST API\r\n*Adds dedicated REST API for performing search queries.*\r\n\r\n* feat(rest): hybrid search endpoint (REST Search API 2/4) by @g-despot in https://github.com/weaviate/weaviate/pull/12246\r\n* feat(rest): near-object search endpoint (REST Search API 3/4) by @g-despot in https://github.com/weaviate/weaviate/pull/12248\r\n* feat(rest): aggregate counts endpoint (REST Search API 4/4) by @g-despot in https://github.com/weaviate/weaviate/pull/12249\r\n* feat(rest): structured reference selection (returnReferences) by @g-despot in https://github.com/weaviate/weaviate/pull/12424\r\n* feat(rest): drop the experimental search flag, harden the family for default-on by @g-despot in https://github.com/weaviate/weaviate/pull/13067\r\n* backport: drop the experimental search flag, harden the family for default-on (#13067) by @g-despot in https://github.com/weaviate/weaviate/pull/13233\r\n* rest search: add the near-vector endpoint by @g-despot in https://github.com/weaviate/weaviate/pull/13265\r\n\r\n## RQ4\r\n*4Bit Rotational Quantization.*\r\n\r\n* RQ4 centered quantization by @trengrj in https://github.com/weaviate/weaviate/pull/12502\r\n\r\n## Async replication\r\n*Async replication optimizations and fixes.*\r\n\r\n* async replication: resolve replicas locally, never implicitly activate a tenant by @jeroiraz in https://github.com/weaviate/weaviate/pull/12256\r\n* test(replication): wait for shard readiness after restart across read_repair suite by @jeroiraz in https://github.com/weaviate/weaviate/pull/12466\r\n* perf(async-repl): size hashbeat digest buffers by set count, not leaf count by @jeroiraz in https://github.com/weaviate/weaviate/pull/12481\r\n* perf(async-repl): carry byte-ID digests end-to-end on the compare pipeline by @jeroiraz in https://github.com/weaviate/weaviate/pull/12710\r\n* perf(async-replication): gate hashbeat debug logging behind level check by @jeroiraz in https://github.com/weaviate/weaviate/pull/12760\r\n* perf(async-replication): size prefilter chunk map by input, release dispatch buckets every pass by @jeroiraz in https://github.com/weaviate/weaviate/pull/12759\r\n* perf(async-replication): batch root pre-filter across classes per target node by @jeroiraz in https://github.com/weaviate/weaviate/pull/12765\r\n* perf(asyncrep): prune the scheduler due-count scan via the heap invariant by @jeroiraz in https://github.com/weaviate/weaviate/pull/12929\r\n* perf(asyncrep): reuse per-worker request assembly in root-prefilter clients by @jeroiraz in https://github.com/weaviate/weaviate/pull/12939\r\n* async replication: arm the hashtree init write gate at scan start by @jeroiraz in https://github.com/weaviate/weaviate/pull/13191\r\n* async replication: retry a panicking hashtree init attempt and gate hashbeat on readiness by @jeroiraz in https://github.com/weaviate/weaviate/pull/13202\r\n* hashtree: never trust a persisted snapshot with no object store behind it by @jeroiraz in https://github.com/weaviate/weaviate/pull/13164\r\n* async replication: drain on a reuse-safe latch instead of a shared WaitGroup by @jeroiraz in https://github.com/weaviate/weaviate/pull/13201\r\n\r\n## Replica movement hardening & semi-automated namespace cluster rebalancing\r\n\r\n* refactor(replication): pin shards through writableShard and introduce replicaPreparer interface by @moogacs in https://github.com/weaviate/weaviate/pull/12427\r\n* feat(rplc-mvmnt): add automated cleanup of stale replica movement operations by @tsmith023 in https://github.com/weaviate/weaviate/pull/12426\r\n* perf(replication): cap zstd encoder concurrency and window in shared encoders by @jeroiraz in https://github.com/weaviate/weaviate/pull/12761\r\n* feat(repl): fix concurrent map write race in replicated writes by @tsmith023 in https://github.com/weaviate/weaviate/pull/12730\r\n* Commit replicated puts on object copies to unrace the broadcast marshal by @jeroiraz in https://github.com/weaviate/weaviate/pull/12828\r\n* Fix replica movement to be enable-able via runtime config by @tsmith023 in https://github.com/weaviate/weaviate/pull/13064\r\n\r\n## Backup reliability improvements\r\n\r\n* Backups: never store a partially written chunk by @dirkkul in https://github.com/weaviate/weaviate/pull/12463\r\n* feat(backups): introduce `includeRoles` to backup/restore process by @tsmith023 in https://github.com/weaviate/weaviate/pull/12322\r\n* Backup-gcs: add opt-in gRPC transport by @dirkkul in https://github.com/weaviate/weaviate/pull/12447\r\n* fix(backup): serve a failed backup's reason from the participant status by @etiennedi in https://github.com/weaviate/weaviate/pull/12548\r\n* Include GEO HNSW index in backups by @dirkkul in https://github.com/weaviate/weaviate/pull/12584\r\n* Backup index.db from inactive dynamic tenants by @dirkkul in https://github.com/weaviate/weaviate/pull/12724\r\n* fix(restore): route backup restore of RBAC roles and dynamic users through RAFT by @tsmith023 in https://github.com/weaviate/weaviate/pull/12660\r\n* Back up collections concurrently through one shared worker pool by @dirkkul in https://github.com/weaviate/weaviate/pull/12790\r\n* backup-gcs: default to the gRPC transport by @dirkkul in https://github.com/weaviate/weaviate/pull/12824\r\n* fix(backup): missed include wildcards are a no-op for users/roles, an error for classes by @tsmith023 in https://github.com/weaviate/weaviate/pull/13027\r\n* gh-12658 exclude LSM scratch files from the offload-s3 shard upload by @bharadwaj-pendyala in https://github.com/weaviate/weaviate/pull/12884\r\n* Remove fsync from CopyFile, which only writes backup copies by @dirkkul in https://github.com/weaviate/weaviate/pull/13079\r\n* backup: report logical PreCompressionSizeBytes for replica-deduped backups by @jeroiraz in https://github.com/weaviate/weaviate/pull/13090\r\n* backup: publish CANCELED only after the cancel descriptor is durable by @jeroiraz in https://github.com/weaviate/weaviate/pull/13098\r\n* fix(backup): poll participant status with exponential backoff during commit by @antas-marcin in https://github.com/weaviate/weaviate/pull/13266\r\n* Stop backup endpoints from exposing collections the caller cannot access by @dirkkul in https://github.com/weaviate/weaviate/pull/13274\r\n* Add a read_backups permission action by @spiros-spiros in https://github.com/weaviate/weaviate/pull/13433\r\n\r\n## Modules & Integrations\r\n\r\n* fix(modules): skip vectorizing named vectors whose index is mid-drop by @jfrancoa in https://github.com/weaviate/weaviate/pull/12498\r\n* fix(modules): don't panic when a batch has objects with no vectorizable properties by @antas-marcin in https://github.com/weaviate/weaviate/pull/12617\r\n* feat(generative-digitalocean): add DigitalOcean generative module by @antas-marcin in https://github.com/weaviate/weaviate/pull/12786\r\n* feat(generative-meta): add Meta AI generative module by @antas-marcin in https://github.com/weaviate/weaviate/pull/12839\r\n* test(generative-aws): remove Cohere's Command-R models from tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/12841\r\n* modules(rest): remove /v1/modules endpoint and contextionary extension/concept handlers by @antas-marcin in https://github.com/weaviate/weaviate/pull/13083\r\n* refactor(config): retire DEFAULT_VECTORIZER_MODULE, default legacy vectorizer to none by @antas-marcin in https://github.com/weaviate/weaviate/pull/13232\r\n* fix(multi2vec-google): route gemini-embedding-2 on Vertex AI to global :embedContent by @antas-marcin in https://github.com/weaviate/weaviate/pull/13340\r\n* fix(generative-digitalocean): add env var support and model list validation by @antas-marcin in https://github.com/weaviate/weaviate/pull/13392\r\n* fix(modules): read a fractional json.Number in float module settings by @jfrancoa in https://github.com/weaviate/weaviate/pull/13403\r\n* test(generative-aws): update Anthropic test models by @antas-marcin in https://github.com/weaviate/weaviate/pull/13348\r\n* Let modules decide which settings can change on an existing collection by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13346\r\n\r\n## Usage metrics improvements\r\n\r\n* test(usage): wait for storage to settle instead of relaxing the assertions by @antas-marcin in https://github.com/weaviate/weaviate/pull/12635\r\n* fix(usage): skip dropped named vectors when computing cold shard usage by @antas-marcin in https://github.com/weaviate/weaviate/pull/12681\r\n* fix(usage): report legacy vector alongside named vectors in usage metrics by @antas-marcin in https://github.com/weaviate/weaviate/pull/12682\r\n* Add MUVERA specific usage calculations by @trengrj in https://github.com/weaviate/weaviate/pull/12294\r\n* Align returns for HOT and COLD tenants from usage module by @dirkkul in https://github.com/weaviate/weaviate/pull/12712\r\n* test(usage): settle the reactivated shard before taking the drop-vector baseline by @antas-marcin in https://github.com/weaviate/weaviate/pull/12721\r\n* Skip vanished files and directories instead of failing shard usage by @dirkkul in https://github.com/weaviate/weaviate/pull/12832\r\n* Fix shard loaded and unloaded metrics by @dirkkul in https://github.com/weaviate/weaviate/pull/12827\r\n* Cache object count for lazy shards by @dirkkul in https://github.com/weaviate/weaviate/pull/12835\r\n* Add weaviate_shards, a shard count by state and eager or lazy loading by @dirkkul in https://github.com/weaviate/weaviate/pull/12831\r\n\r\n## Vector Index Schema Update\r\n\r\n* chore: bake vector index identity into its logger by @asdine in https://github.com/weaviate/weaviate/pull/12919\r\n* chore: extend vector index logger identity to hnsw's children and the queue by @asdine in https://github.com/weaviate/weaviate/pull/12922\r\n* chore: pin the on-disk vector index layout by @asdine in https://github.com/weaviate/weaviate/pull/12923\r\n* flat: derive flat index storage names from the physical ID by @asdine in https://github.com/weaviate/weaviate/pull/12924\r\n* dynamic: Derive dynamic index storage names and state key from the physical ID by @asdine in https://github.com/weaviate/weaviate/pull/12925\r\n* hnsw: derive hnsw compressed bucket names from the physical ID by @asdine in https://github.com/weaviate/weaviate/pull/12932\r\n* hfresh: derive hfresh index storage names and centroid ID from the physical ID by @asdine in https://github.com/weaviate/weaviate/pull/12928\r\n* hnsw: hnsw takes object-vector extraction from the shard and never prefills a centroid graph from objects by @asdine in https://github.com/weaviate/weaviate/pull/12933\r\n* shard: vector indexes and queues live in one slots type by @asdine in https://github.com/weaviate/weaviate/pull/12965\r\n* shard: request paths hold a lease on the vector index by @asdine in https://github.com/weaviate/weaviate/pull/12970\r\n* shard: maintenance and debug paths hold a lease on the vector index by @asdine in https://github.com/weaviate/weaviate/pull/12975\r\n* shard: the unleased vector index accessors go by @asdine in https://github.com/weaviate/weaviate/pull/12976\r\n* shardmeta: add Namespace.Update and ForEach by @asdine in https://github.com/weaviate/weaviate/pull/12993\r\n* shard: add the vectorIndexMapping type by @asdine in https://github.com/weaviate/weaviate/pull/12994\r\n* shard: open index.db for every shard, add the vector index storage probe and sync by @asdine in https://github.com/weaviate/weaviate/pull/12998\r\n* shard: startup reads and writes the vector index mapping by @asdine in https://github.com/weaviate/weaviate/pull/13015\r\n* shard: rebuild a ready index whose storage is missing instead of refusing the load by @asdine in https://github.com/weaviate/weaviate/pull/13087\r\n* shard: a vector added to a running shard is recorded, and a colliding one refused by @asdine in https://github.com/weaviate/weaviate/pull/13030\r\n* queue: release the chunk writer buffer once a chunk is promoted by @asdine in https://github.com/weaviate/weaviate/pull/13126\r\n* shard: a replica snapshot carries index.db by @asdine in https://github.com/weaviate/weaviate/pull/13128\r\n* shard: a replica snapshot carries index.db, so a moved dynamic index keeps its upgrade (v1.38) by @asdine in https://github.com/weaviate/weaviate/pull/13130\r\n* shard mapping: durable vector index deletion through the mapping record by @asdine in https://github.com/weaviate/weaviate/pull/13116\r\n* shard: refuse a write whose vector index is missing before storing the object by @asdine in https://github.com/weaviate/weaviate/pull/13305\r\n* shard: the drop sweep reaches a cold tenant through its lazy loader by @asdine in https://github.com/weaviate/weaviate/pull/13316\r\n* shard: fix vectorQueueSize and cold shard loading on the shards status endpoint by @asdine in https://github.com/weaviate/weaviate/pull/13349\r\n\r\n## Performance & Optimization\r\n\r\n* Refresh the memory monitor while shards are read-only by @dirkkul in https://github.com/weaviate/weaviate/pull/12468\r\n* Use direct map acces for shard movement teardown by @dirkkul in https://github.com/weaviate/weaviate/pull/12467\r\n* Remove the unused shardReindexerV3 scheduler by @etiennedi in https://github.com/weaviate/weaviate/pull/12478\r\n* Pool zstd encoders in backups by @dirkkul in https://github.com/weaviate/weaviate/pull/12477\r\n* lsmkv: stop CheckExpectedStrategy from heap-allocating its variadic slice by @dirkkul in https://github.com/weaviate/weaviate/pull/12494\r\n* Read the dimensions bucket once per usage sweep by @dirkkul in https://github.com/weaviate/weaviate/pull/12503\r\n* Report the tenant's pre-freeze status on an aborted freeze by @dirkkul in https://github.com/weaviate/weaviate/pull/12508\r\n* Unmarshal namespace snapshot outside of lock by @dirkkul in https://github.com/weaviate/weaviate/pull/12506\r\n* Size the roaringsetrange pread read buffer from the segment payload by @dirkkul in https://github.com/weaviate/weaviate/pull/12499\r\n* Keep the geo vector cache across deletion cycles by @dirkkul in https://github.com/weaviate/weaviate/pull/12557\r\n* Keep error type through the objects manager by @dirkkul in https://github.com/weaviate/weaviate/pull/12510\r\n* Read only the geo property when resolving a coordinate by @dirkkul in https://github.com/weaviate/weaviate/pull/12564\r\n* shard: don't mark the shard read-only during UpdateVectorIndexConfig by @amourao in https://github.com/weaviate/weaviate/pull/11788\r\n* perf(lsmkv): targeted replace scan with newest-wins visibility by @amourao in https://github.com/weaviate/weaviate/pull/12396\r\n* Keep the parked pread buffer on sequential replace cursor scans by @jeroiraz in https://github.com/weaviate/weaviate/pull/12571\r\n* Complete updateIndexTenants when one tenant fails by @dirkkul in https://github.com/weaviate/weaviate/pull/12507\r\n* Drop per-cycle allocations from the idle compaction path by @dirkkul in https://github.com/weaviate/weaviate/pull/12561\r\n* perf(lsmkv): read targeted-scan ranges straight from the file by @amourao in https://github.com/weaviate/weaviate/pull/12592\r\n* Parse replace nodes without allocating by @dirkkul in https://github.com/weaviate/weaviate/pull/12558\r\n* Treat a non-positive vector cache maxSize as unbounded by @dirkkul in https://github.com/weaviate/weaviate/pull/12586\r\n* Concurrently prefill geo caches using exinsg prefiller by @dirkkul in https://github.com/weaviate/weaviate/pull/12583\r\n* feat(rest): bm25 keyword search endpoint (REST Search API 1/4) by @g-despot in https://github.com/weaviate/weaviate/pull/12245\r\n* Hybrid Aggregation: Apply the filter to the BM25 search by @dirkkul in https://github.com/weaviate/weaviate/pull/12622\r\n* Wait for the local schema before writes that resolve an index by name by @dirkkul in https://github.com/weaviate/weaviate/pull/12587\r\n* feat(auto-schema): create a \"default\" named vector instead of a legacy one by @antas-marcin in https://github.com/weaviate/weaviate/pull/12620\r\n* Report every shard failure during index reconcile by @dirkkul in https://github.com/weaviate/weaviate/pull/12639\r\n* Usage: Make cold tenants report the same data as hot tenants by @dirkkul in https://github.com/weaviate/weaviate/pull/12628\r\n* perf(lsmkv): bound digest-RPC memtable snapshots to the requested key range by @jeroiraz in https://github.com/weaviate/weaviate/pull/12665\r\n* perf(async-repl): negotiate binary digest encoding on the gRPC HashTreeLevel RPC by @jeroiraz in https://github.com/weaviate/weaviate/pull/12666\r\n* Resource scan: Dont load lazy shards and set newly loaded shards to ReadOnly too by @dirkkul in https://github.com/weaviate/weaviate/pull/12674\r\n* perf(router): avoid full shard-list copy on single-shard routing plans by @jeroiraz in https://github.com/weaviate/weaviate/pull/12762\r\n* Make the resource scanner's shard status check-and-set atomic by @dirkkul in https://github.com/weaviate/weaviate/pull/12703\r\n* Put both cron jobs on one shared registration helper by @dirkkul in https://github.com/weaviate/weaviate/pull/12758\r\n* Backport: drain in-flight references before drop tears the shard store down by @jfrancoa in https://github.com/weaviate/weaviate/pull/12797\r\n* Stop retrying a shard unload once its collection is closing by @dirkkul in https://github.com/weaviate/weaviate/pull/12779\r\n* feat(users): export/import endpoints for db user API-key hashes by @tsmith023 in https://github.com/weaviate/weaviate/pull/12782\r\n* Silence expected recovered-panic noise in async replication scheduler unit tests by @jeroiraz in https://github.com/weaviate/weaviate/pull/12808\r\n* Remove find-duplicates workflow when new issues are created. by @jfrancoa in https://github.com/weaviate/weaviate/pull/12801\r\n* mcp: refuse GET with 405 and run the streamable server stateless by @g-despot in https://github.com/weaviate/weaviate/pull/12789\r\n* Stop holding the collection map lock while counting objects on disk by @dirkkul in https://github.com/weaviate/weaviate/pull/12825\r\n* Finish the startup shard warmup after a shard fails to load by @dirkkul in https://github.com/weaviate/weaviate/pull/1283