unt":28,"created_at":"2026-09-22T14:58:41Z","updated_at":"2026-09-22T14:58:43Z"},{"id":581626810,"node_id":"RA_kwDOA0hXpc4iquu6","name":"weaviate-v1.39.6-linux-arm64.tar.gz.md5","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":33,"digest":"sha256:875554276d418566b8f9812d314758251477676d79c6025555dc02bf439710ba","download_count":2,"created_at":"2026-09-22T14:58:44Z","updated_at":"2026-09-22T14:58:44Z"},{"id":581626837,"node_id":"RA_kwDOA0hXpc4iquvV","name":"weaviate-v1.39.6-linux-arm64.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":65,"digest":"sha256:2d5482ff9ea99e9acbab0845c8dcd0f0f7c1b828620e3a55558dfcdc852a2b6b","download_count":2,"created_at":"2026-09-22T14:58:44Z","updated_at":"2026-09-22T14:58:45Z"}],"body":"## Breaking Changes \r\n*none*\r\n\r\n## New Features\r\n*none*\r\n\r\n## Fixes\r\n* ci: run adapters/repos/db/integrationslowtest as its own integration job by @antas-marcin in https://github.com/weaviate/weaviate/pull/13065\r\n* Couple authz/use listing bugfixes by @dirkkul in https://github.com/weaviate/weaviate/pull/13069\r\n* Remove fsync from CopyFile, which only writes backup copies by @dirkkul in https://github.com/weaviate/weaviate/pull/13079\r\n* Drop permanent copy of sharding state from memory by @dirkkul in https://github.com/weaviate/weaviate/pull/13078\r\n* Replace WEAVIATE_LICENSE env toggle with LICENSE_KEY form check by @etiennedi in https://github.com/weaviate/weaviate/pull/13081\r\n* Add LICENSE_KEY_FILE as an alternative to LICENSE_KEY by @etiennedi in https://github.com/weaviate/weaviate/pull/13089\r\n* modules(rest): remove /v1/modules endpoint and contextionary extension/concept handlers by @antas-marcin in https://github.com/weaviate/weaviate/pull/13083\r\n* add Weaviate Embeddings rate limit by @augustas1 in https://github.com/weaviate/weaviate/pull/13059\r\n* backport: fix(db): locks usage (#12525)(#12082) by @moogacs in https://github.com/weaviate/weaviate/pull/13100\r\n* ci(workflows): run only docker build, unit, integration and codecov jobs on branch pushes by @antas-marcin in https://github.com/weaviate/weaviate/pull/13111\r\n* List db users and their roles from the node's local state by @dirkkul in https://github.com/weaviate/weaviate/pull/13084\r\n* Use fewer syscalls and less memory to list an inactive shard for backup by @dirkkul in https://github.com/weaviate/weaviate/pull/13082\r\n* perf(roaringset): stream the memtable flush and compact the bitmaps it writes by @aliszka in https://github.com/weaviate/weaviate/pull/13038\r\n* fix(roaringset-pr2): measure a memtable's size as the heap its tree holds by @aliszka in https://github.com/weaviate/weaviate/pull/13039\r\n* perf(roaringset-pr3): allocate a key's additions or deletions only when written by @aliszka in https://github.com/weaviate/weaviate/pull/13040\r\n* test(inverted): order the ContainsAll early-exit tests instead of racing them by @aliszka in https://github.com/weaviate/weaviate/pull/13042\r\n* Retry user lists in multi-node tests until the users show up by @dirkkul in https://github.com/weaviate/weaviate/pull/13114\r\n* Reduce allocations in compactor logs by @dirkkul in https://github.com/weaviate/weaviate/pull/13109\r\n* ci(acceptance): split fast-group-3 into grpc-only and new fast-group-6 by @antas-marcin in https://github.com/weaviate/weaviate/pull/13120\r\n* Stop fetching bucket metadata before every chunk in backup-gcs by @dirkkul in https://github.com/weaviate/weaviate/pull/13125\r\n* queue: release the chunk writer buffer once a chunk is promoted by @asdine in https://github.com/weaviate/weaviate/pull/13126\r\n* shard: a replica snapshot carries index.db, so a moved dynamic index keeps its upgrade (v1.38) by @asdine in https://github.com/weaviate/weaviate/pull/13130\r\n* Reduce allocations in HNSW snapshots by @dirkkul in https://github.com/weaviate/weaviate/pull/13110\r\n* test(db): move hybrid offsets and vector index queue tests to integrationslowtest, cut drop-vector tests to 50 objects by @antas-marcin in https://github.com/weaviate/weaviate/pull/13134\r\n* perf(roaringsetrange): walk the memtable once per worker instead of once per bit by @aliszka in https://github.com/weaviate/weaviate/pull/13138\r\n* Opt/roaringsetrange direct flush by @aliszka in https://github.com/weaviate/weaviate/pull/13139\r\n* Close a shard's counter and version files when it shuts down or loads by @dirkkul in https://github.com/weaviate/weaviate/pull/13096\r\n* fix(queryadmission): deflake TestFIFOWakeOnRelease by @asdine in https://github.com/weaviate/weaviate/pull/13147\r\n* Remove unique objects IDs from RBAC checks by @dirkkul in https://github.com/weaviate/weaviate/pull/10688\r\n* hnsw compactor: stop logging no-op decisions every idle cycle by @asdine in https://github.com/weaviate/weaviate/pull/13156\r\n* perf(lsmkv): skip per-segment probe timing unless debug logging is enabled by @antas-marcin in https://github.com/weaviate/weaviate/pull/13159\r\n* test(go-client): replace text2vec-contextionary with text2vec-model2vec by @antas-marcin in https://github.com/weaviate/weaviate/pull/13155\r\n* test(acceptance): replace text2vec-contextionary with text2vec-model2vec in docker-compose tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/13167\r\n* feat(config): name the properties that keep a rangeable index in memory by @aliszka in https://github.com/weaviate/weaviate/pull/13163\r\n* backport: hnsw: shrink vertex from 48 to 24 bytes per node by @asdine in https://github.com/weaviate/weaviate/pull/13176\r\n* perf(lsmkv): remove per-write overhead allocations from the map write path by @antas-marcin i