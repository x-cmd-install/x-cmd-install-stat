13793\r\n* fix(lsmkv): meter pread reads of the reusable replace cursor by @antas-marcin in https://github.com/weaviate/weaviate/pull/13784\r\n* replication: allow async replication while a node is in maintenance mode by @jeroiraz in https://github.com/weaviate/weaviate/pull/13869\r\n* reindex: swap each tenant once its own replicas are ready by @etiennedi in https://github.com/weaviate/weaviate/pull/13716\r\n* Allow hfresh with multi-vector vectorizers; MUVERA implied and required for hfresh multi-vectors (stable/v1.40) by @rlmanrique in https://github.com/weaviate/weaviate/pull/13883\r\n* Return an error body with the GET /v1/tasks 403 by @etiennedi in https://github.com/weaviate/weaviate/pull/13891\r\n* reindex: speed up shard lookups at 1M tenants from ~45 hours to ~0.02 s per phase by @etiennedi in https://github.com/weaviate/weaviate/pull/13874\r\n* reindex: test that a failed reindex can never be reported as finished by @etiennedi in https://github.com/weaviate/weaviate/pull/13893\r\n* reindex: remove reindex overhead from tenant loads when no reindex ever ran by @etiennedi in https://github.com/weaviate/weaviate/pull/13895\r\n* Speed up object listing by ~50% by decoding properties without reflection by @dirkkul in https://github.com/weaviate/weaviate/pull/13898\r\n* reindex: fix a write-loss bug when nodes restart mid-reindex by @etiennedi in https://github.com/weaviate/weaviate/pull/13755\r\n* fix(db): keep the shards status endpoint up while a replica is down by @moogacs in https://github.com/weaviate/weaviate/pull/13886\r\n* reindex: fix reindex failures when a tenant or collection is deleted or deactivated during submit by @etiennedi in https://github.com/weaviate/weaviate/pull/13885\r\n* fix(drop-vector-index): finalize a deletion-resolved drop through a verify-only round by @antas-marcin in https://github.com/weaviate/weaviate/pull/13918\r\n* test: drop the small hnsw cache case from the dynamic upgrade tests by @trengrj in https://github.com/weaviate/weaviate/pull/13926\r\n* hfresh: repair postings left without a centroid after a crash by @asdine in https://github.com/weaviate/weaviate/pull/13915\r\n* hnsw: keep compression across a reset of an empty index by @asdine in https://github.com/weaviate/weaviate/pull/13929\r\n* reindex: allow resubmitting a partial reindex without making finished tenants HOT by @etiennedi in https://github.com/weaviate/weaviate/pull/13884\r\n* fix(drop-vector-index): count only stripped shards when a deleted tenant resolves a failed cleanup round by @antas-marcin in https://github.com/weaviate/weaviate/pull/13916\r\n* perf(aggregator): read unfiltered object scans through one reader per segment by @antas-marcin in https://github.com/weaviate/weaviate/pull/13666\r\n* perf(aggregator): aggregate all object-read properties in one objects bucket scan by @antas-marcin in https://github.com/weaviate/weaviate/pull/13667\r\n* perf(aggregator): run shard aggregations in parallel by @antas-marcin in https://github.com/weaviate/weaviate/pull/13754\r\n* perf(aggregator): spread shard aggregations across replica nodes by @antas-marcin in https://github.com/weaviate/weaviate/pull/13797\r\n* perf(aggregator): count text values without tracking occurrences unless topOccurrences is requested by @antas-marcin in https://github.com/weaviate/weaviate/pull/13802\r\n* perf(aggregator): count array values from the property length index by @antas-marcin in https://github.com/weaviate/weaviate/pull/13803\r\n* fix(grpc-web): bound Search and Aggregate requests by the server write timeout by @antas-marcin in https://github.com/weaviate/weaviate/pull/13805\r\n* perf(aggregator): admit shard aggregations through query admission and retry remote ones once by @antas-marcin in https://github.com/weaviate/weaviate/pull/13882\r\n* fix(backups): keep target dynamic-user role assignments on roles-only restores by @tsmith023 in https://github.com/weaviate/weaviate/pull/13813\r\n* Speed up the slowest vector integration tests by @trengrj in https://github.com/weaviate/weaviate/pull/13941\r\n* dynamic: fix flaky TestUpgrade_InProgressUntilCompressed by @asdine in https://github.com/weaviate/weaviate/pull/13943\r\n* fix(graphql): build where filters on the collection behind an alias by @aliszka in https://github.com/weaviate/weaviate/pull/13952\r\n* [fix] Docker/latest tag review by @databyjp in https://github.com/weaviate/weaviate/pull/13828\r\n\r\n\r\n**Full Changelog**: https://github.com/weaviate/weaviate/compare/v1.40.5...v1.40.6","mentions_count":12}
