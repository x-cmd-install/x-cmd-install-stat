ader's FSM before it judges proposes by @moogacs in https://github.com/weaviate/weaviate/pull/12915\r\n* fix(nodes): authz logic on `v1/nodes?output=minimal` when caller has `verbose` perms by @tsmith023 in https://github.com/weaviate/weaviate/pull/12981\r\n* feat: node-level query admission control (P1b) by @etiennedi in https://github.com/weaviate/weaviate/pull/12078\r\n* fix(reindex): enable-rangeable becomes a semantic migration by @etiennedi in https://github.com/weaviate/weaviate/pull/12700\r\n* Add Weaviate license and license switch by @etiennedi in https://github.com/weaviate/weaviate/pull/12796\r\n* Pre-compile regexp for role validation by @dirkkul in https://github.com/weaviate/weaviate/pull/13003\r\n* fix(queue): create chunk files with O_EXCL to prevent same-microsecond name collision by @abdelr in https://github.com/weaviate/weaviate/pull/12880\r\n* fix(backup): missed include wildcards are a no-op for users/roles, an error for classes by @tsmith023 in https://github.com/weaviate/weaviate/pull/13027\r\n* fix(hnsw): preserve isolated nodes during compaction by @asdine in https://github.com/weaviate/weaviate/pull/13033\r\n* fix(hfresh): recover orphaned postings through reassign-all by @asdine in https://github.com/weaviate/weaviate/pull/13035\r\n* fix(lsmkv): remove symlink tracing when listing backup files by @tsmith023 in https://github.com/weaviate/weaviate/pull/13032\r\n* feat(debug): make shard optional for HFresh reassignment by @asdine in https://github.com/weaviate/weaviate/pull/13043\r\n\r\n\r\n**Full Changelog**: https://github.com/weaviate/weaviate/compare/v1.39.3...v1.39.4","mentions_count":8}
