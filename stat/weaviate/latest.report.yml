1:13:03Z","updated_at":"2026-10-05T11:13:06Z"},{"id":612341196,"node_id":"RA_kwDOA0hXpc4kf5XM","name":"weaviate-v1.39.9-linux-arm64.tar.gz.md5","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":33,"digest":"sha256:39d957811152042547d475f5a485c30f7c17a05c80aa184f680724d9889c29b7","download_count":2,"created_at":"2026-10-05T11:13:06Z","updated_at":"2026-10-05T11:13:07Z"},{"id":612341226,"node_id":"RA_kwDOA0hXpc4kf5Xq","name":"weaviate-v1.39.9-linux-arm64.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":65,"digest":"sha256:e5b1b5c3192ccbc55a50c3aad5ad4c04e72161f13fededb8a274c48df572f30d","download_count":2,"created_at":"2026-10-05T11:13:07Z","updated_at":"2026-10-05T11:13:07Z"}],"body":"## Breaking Changes \r\n*none*\r\n\r\n## New Features\r\n*none*\r\n\r\n## Fixes\r\n* fix(backups): allow backups without collections by @tsmith023 in https://github.com/weaviate/weaviate/pull/13250\r\n* fix(errors): recover a panic from every way an error group runs a callback by @aliszka in https://github.com/weaviate/weaviate/pull/13016\r\n* perf(lsmkv): replay a large write-ahead log as a run of segments by @aliszka in https://github.com/weaviate/weaviate/pull/13198\r\n* fix(object-ttl): stop delete goroutines from reading a map the sweep still writes by @aliszka in https://github.com/weaviate/weaviate/pull/13279\r\n* refactor(errors): make the error group wrapper's errgroup a private field by @aliszka in https://github.com/weaviate/weaviate/pull/13386\r\n* fix(object-ttl): keep an aborted deletion's slot reserved until it finishes by @aliszka in https://github.com/weaviate/weaviate/pull/13282\r\n* fix(lsmkv): read active memtable under flush lock in flush cycle by @antas-marcin in https://github.com/weaviate/weaviate/pull/13374\r\n* hotfix: skip reindex recovery scan at startup when RUNTIME_REINDEX_ENABLED is off by @etiennedi in https://github.com/weaviate/weaviate/pull/13390\r\n* raft: start a single-node cluster without waiting for multi-node timeouts by @asdine in https://github.com/weaviate/weaviate/pull/13384\r\n* fix(object-ttl): report a recovered panic in a delete or abort goroutine by @aliszka in https://github.com/weaviate/weaviate/pull/13307\r\n* hnsw: never load a node ID far beyond the shard's document-ID counter by @asdine in https://github.com/weaviate/weaviate/pull/13377\r\n* fix(generative-digitalocean): add env var support and model list validation by @antas-marcin in https://github.com/weaviate/weaviate/pull/13392\r\n* fix(aggregator): stop a scan whose caller has gone by @moogacs in https://github.com/weaviate/weaviate/pull/13401\r\n* Write export parquet blob columns without page header statistics by @dirkkul in https://github.com/weaviate/weaviate/pull/13393\r\n\r\n\r\n**Full Changelog**: https://github.com/weaviate/weaviate/compare/v1.39.8...v1.39.9","mentions_count":7}
