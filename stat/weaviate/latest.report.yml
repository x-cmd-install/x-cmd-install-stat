TCH by @ColtonRobak in https://github.com/weaviate/weaviate/pull/13345\r\n* Fix two db user bugs by @dirkkul in https://github.com/weaviate/weaviate/pull/13356\r\n* fix(backups): allow backups without collections by @tsmith023 in https://github.com/weaviate/weaviate/pull/13250\r\n* fix(errors): recover a panic from every way an error group runs a callback by @aliszka in https://github.com/weaviate/weaviate/pull/13016\r\n* fix(object-ttl): stop delete goroutines from reading a map the sweep still writes by @aliszka in https://github.com/weaviate/weaviate/pull/13279\r\n* fix(object-ttl): keep an aborted deletion's slot reserved until it finishes by @aliszka in https://github.com/weaviate/weaviate/pull/13282\r\n* fix(lsmkv): read active memtable under flush lock in flush cycle by @antas-marcin in https://github.com/weaviate/weaviate/pull/13374\r\n* hotfix: skip reindex recovery scan at startup when RUNTIME_REINDEX_ENABLED is off by @etiennedi in https://github.com/weaviate/weaviate/pull/13390\r\n* fix(object-ttl): report a recovered panic in a delete or abort goroutine by @aliszka in https://github.com/weaviate/weaviate/pull/13307\r\n* fix(aggregator): stop a scan whose caller has gone by @moogacs in https://github.com/weaviate/weaviate/pull/13401\r\n* fix(object-ttl): stop a panicking shard delete from ending a collection's sweep by @aliszka in https://github.com/weaviate/weaviate/pull/13308\r\n* Authz bugfix sweep by @dirkkul in https://github.com/weaviate/weaviate/pull/13324\r\n* fix(object-ttl): stop sweeping a shard or tenant whose delete makes no progress by @aliszka in https://github.com/weaviate/weaviate/pull/13381\r\n* Fix flaky namespace test by @dirkkul in https://github.com/weaviate/weaviate/pull/13436\r\n* fix(hnsw): O(M) fast path for backlinks into all-zero-distance neighbor lists (v1.38) by @abdelr in https://github.com/weaviate/weaviate/pull/13395\r\n* fix(lsmkv): move bucket registration along on replace and rename by @antas-marcin in https://github.com/weaviate/weaviate/pull/13375\r\n* fix(db): delete only the dropped shard's index checkpoints by @antas-marcin in https://github.com/weaviate/weaviate/pull/13388\r\n* fix(lsmkv): keep bucket unchanged when RenameBucket fails on disk by @antas-marcin in https://github.com/weaviate/weaviate/pull/13453\r\n\r\n## Observability\r\n\r\n* Keep a per-namespace collection count and report it as a metric by @dirkkul in https://github.com/weaviate/weaviate/pull/12772\r\n* feat(metrics): tracking of requested consistency level in all API requests by @tsmith023 in https://github.com/weaviate/weaviate/pull/13338\r\n* feat(monitoring): add `collection_namespace` label to usage metrics by @tsmith023 in https://github.com/weaviate/weaviate/pull/12833\r\n* metric(cluster): label leader-query failures by @moogacs in https://github.com/weaviate/weaviate/pull/13353\r\n\r\n## Refactoring & Code Quality\r\n\r\n* docs(backup): mark the non-hardlink backup fallback as deprecated (removed in v1.40) by @etiennedi in https://github.com/weaviate/weaviate/pull/12469\r\n* Remove TestReadSnapshotBufferAllocation which was flaky by @dirkkul in https://github.com/weaviate/weaviate/pull/12493\r\n* refactor(db): pin change capture through withShardForChangeLog and introduce shardChangeLogger interface by @moogacs in https://github.com/weaviate/weaviate/pull/12496\r\n* refactor(db): pin object writes through withShardForWrite and introduce shardWriter interface by @moogacs in https://github.com/weaviate/weaviate/pull/12495\r\n* Testcontainer endpoint + docstring fixes by @dirkkul in https://github.com/weaviate/weaviate/pull/12540\r\n* Update CONTRIBUTING.md with new guidelines and links by @spiros-spiros in https://github.com/weaviate/weaviate/pull/12568\r\n* refact(schema): introduce DeleteClassFromDB & HasFrozenTenants encapsulation by @moogacs in https://github.com/weaviate/weaviate/pull/12596\r\n* Add Weaviate license and license switch by @etiennedi in https://github.com/weaviate/weaviate/pull/12796\r\n* refactor(schema): read shard status from the indexer, not the RAFT schema by @moogacs in https://github.com/weaviate/weaviate/pull/13004\r\n* refactor(schema): drop the mirror schemaReader interfaces by @moogacs in https://github.com/weaviate/weaviate/pull/13006\r\n* refact(modules): use SchemaGetter and remove interface duplicate by @moogacs in https://github.com/weaviate/weaviate/pull/13018\r\n* Trim claude.md to save context by @dirkkul in https://github.com/weaviate/weaviate/pull/13057\r\n* Docs links on out-of-memory-mappings errors (logs and API) by @g-despot in https://github.com/weaviate/weaviate/pull/12738\r\n* Replace WEAVIATE_LICENSE env toggle with LICENSE_KEY form check by @etiennedi in https://github.com/weaviate/weaviate/pull/13081\r\n* Add LICENSE_KEY_FILE as an alternative to LICENSE_KEY by @etiennedi in https://github.com/weaviate/weaviate/pull/13089\r\n* refactor(test): start the shared acceptance server by default and skip it only for own-cluster suites by @antas-marcin in https://github.com/weaviate/weaviate/pull/13251\r\n* Trim whitespace around LICENSE_KEY before checking the key by @dirkkul in https://github.com/weaviate/weaviate/pull/13258\r\n* Expose license state via /v1/meta, metrics, and startup log by @etiennedi in https://github.com/weaviate/weaviate/pull/13092\r\n* Update wl license text per legal (M3.5) by @etiennedi in https://github.com/weaviate/weaviate/pull/13360\r\n* refactor(errors): make the error group wrapper's errgroup a private field by @aliszka in https://github.com/weaviate/weaviate/pull/13386\r\n* Gate wl/ code behind a license decision made outside wl/ by @jeroiraz in https://github.com/weaviate/weaviate/pull/13434\r\n* license: guard wl types and hard-coded licensed mode outside gates by @jeroiraz in https://github.com/weaviate/weaviate/pull/13435\r\n\r\n## Testing\r\n\r\n* fix(tools): adapt qa_pr.sh log fetch to gh >= 2.97 escape-sequence guard by @antas-marcin in https://github.com/weaviate/weaviate/pull/12462\r\n* test(python): pin weaviate-client python dependency to 4.23 version by @antas-marcin in https://github.com/weaviate/weaviate/pull/12908\r\n* test: switch minio/minio image to cgr.dev/chainguard/minio by @antas-marcin in https://github.com/weaviate/weaviate/pull/13052\r\n* test: release the queue lease before dropping the vector index by @asdine in https://github.com/weaviate/weaviate/pull/13085\r\n* test(db): move hybrid offsets and vector index queue tests to integrationslowtest, cut drop-vector tests to 50 objects by @antas-marcin in https://github.com/weaviate/weaviate/pull/13134\r\n* test(go-client): replace text2vec-contextionary with text2vec-model2vec by @antas-marcin in https://github.com/weaviate/weaviate/pull/13155\r\n* test(acceptance): replace text2vec-contextionary with text2vec-model2vec in docker-compose tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/13167\r\n* test(acceptance): replace text2vec-contextionary with text2vec-model2vec in testcontainers tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/13199\r\n* test(lsmkv): stop the flush cycle before Shutdown in the threshold tests by @aliszka in https://github.com/weaviate/weaviate/pull/13332\r\n* test: retry class node status and replication READY polls in replica movement happy paths by @jeroiraz in https://github.com/weaviate/weaviate/pull/13463\r\n\r\n## CI/CD & Infrastructure\r\n\r\n* chore: update Weaviate version to v1.40.0-dev by @antas-marcin in https://github.com/weaviate/weaviate/pull/12483\r\n* ci: upgrade modules light and modules api runners to ubicloud-standard-4 by @antas-marcin in https://github.com/weaviate/weaviate/pull/12776\r\n* chore(Dockerfile): remove unnecessary comments by @antas-marcin in https://github.com/weaviate/weaviate/pull/12803\r\n* chore(gen-code-from-swagger.sh): add code formatting step by @antas-marcin in https://github.com/weaviate/weaviate/pull/12814\r\n* ci: remove multinode-restart-a reindex pipeline by @antas-marcin in https://github.com/weaviate/weaviate/pull/12895\r\n* ci: remove the windows acceptance job and stop building windows binaries by @asdine in https://github.com/weaviate/weaviate/pull/13066\r\n* ci: run adapters/repos/db/integrationslowtest as its own integration job by @antas-marcin in https://github.com/weaviate/weaviate/pull/13065\r\n* ci(workflows): run only docker build, unit, integration and codecov jobs on branch pushes by @antas-marcin in https://github.com/weaviate/weaviate/pull/13111\r\n* ci(acceptance): split fast-group-3 into grpc-only and new fast-group-6 by @antas-marcin in https://github.com/weaviate/weaviate/pull/13120\r\n* test(replication): split async replication acceptance tests into two CI groups by @antas-marcin in https://github.com/weaviate/weaviate/pull/13234\r\n* test(replication): reduce replica-slow acceptance test suite time by @antas-marcin in https://github.com/weaviate/weaviate/pull/13245\r\n* test(acceptance): start the shared server only for suites that use it and reuse it for single-node tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/13244\r\n* test(db): speed up the slowest integration tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/13263\r\n* test(acceptance): cut fast-group-3 test time by half by @antas-marcin in https://github.com/weaviate/weaviate/pull/13264\r\n* fix(ci): reduce number of articles ingested in `TestGRPC_Batching` by @tsmith023 in https://github.com/weaviate/weaviate/pull/13259\r\n* test(acceptance): cut fast-group-5 test time by over a third by @antas-marcin in https://github.com/weaviate/weaviate/pull/13268\r\n\r\n## Security\r\n\r\n* security(docker): pin minimum openssl version so cached builds pull CVE fixes by @antas-marcin in https://github.com/weaviate/weaviate/pull/12799\r\n* security: restrict Google module apiEndpoint, region and location to Google API hosts by @antas-marcin in https://github.com/weaviate/weaviate/pull/12961\r\n\r\n## Dependencies\r\n\