ps://github.com/weaviate/weaviate/pull/12940\r\n* perf(aggregation-pr7): reuse one property map for all objects a scan worker reads by @aliszka in https://github.com/weaviate/weaviate/pull/12941\r\n* perf(inverted): call ctx.Err() directly instead of the ctxExpired helper by @aliszka in https://github.com/weaviate/weaviate/pull/12943\r\n* backport: stop reading memberlist node fields outside the event callbacks by @jeroiraz in https://github.com/weaviate/weaviate/pull/12947\r\n* perf: cache node host:port resolution behind membership events by @jeroiraz in https://github.com/weaviate/weaviate/pull/12946\r\n* Repeating startup banner by @g-despot in https://github.com/weaviate/weaviate/pull/12912\r\n* chore(dynamic-shard): convert log to warn instead of info by @moogacs in https://github.com/weaviate/weaviate/pull/12974\r\n* test(db): install a test's log hook before the index starts its goroutines by @asdine in https://github.com/weaviate/weaviate/pull/12978\r\n* perf(db): skip the startup shard-size sweep when lazy loading is set explicitly by @moogacs in https://github.com/weaviate/weaviate/pull/12979\r\n* perf(contains-pr11): fold a batched Contains filter across workers by @aliszka in https://github.com/weaviate/weaviate/pull/12901\r\n* New feature: adaptive and efficient filtered HNSW search with PathSeer by @lizhiyuell in https://github.com/weaviate/weaviate/pull/12137\r\n* Pre-compile regexp for role validation by @dirkkul in https://github.com/weaviate/weaviate/pull/13003\r\n* shard: drops delete the vector index mapping record by @asdine in https://github.com/weaviate/weaviate/pull/13007\r\n* Publish generated gRPC stubs as a standalone module by @bevzzz in https://github.com/weaviate/weaviate/pull/12747\r\n* feat(index): report UNAVAILABLE status for shards whose status could not be retrieved by @bevzzz in https://github.com/weaviate/weaviate/pull/12757\r\n* Return 403 from verbose /v1/nodes to callers denied minimal output by @dirkkul in https://github.co