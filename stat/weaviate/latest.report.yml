d0618b525a444699bf","download_count":6,"created_at":"2026-09-07T13:52:35Z","updated_at":"2026-09-07T13:52:38Z"},{"id":548864903,"node_id":"RA_kwDOA0hXpc4gtwOH","name":"weaviate-v1.39.3-linux-arm64.tar.gz.md5","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":33,"digest":"sha256:75be484a287e1f0eb30bdc8294c6d776868a6841d3d5e232f8291044264f0b88","download_count":2,"created_at":"2026-09-07T13:52:38Z","updated_at":"2026-09-07T13:52:38Z"},{"id":548864927,"node_id":"RA_kwDOA0hXpc4gtwOf","name":"weaviate-v1.39.3-linux-arm64.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":65,"digest":"sha256:8159418086afd3d38adaf08a345be16da85e06471fb23ccdc67f45fae7b73ff2","download_count":2,"created_at":"2026-09-07T13:52:39Z","updated_at":"2026-09-07T13:52:39Z"}],"body":"## Breaking Changes \r\n*none*\r\n\r\n## New Features\r\n*none*\r\n\r\n## Fixes\r\n* fix: respect named-vector source_properties when re-vectorizing on update by @g-despot in https://github.com/weaviate/weaviate/pull/11789\r\n* Silence expected recovered-panic noise in async replication scheduler unit tests by @jeroiraz in https://github.com/weaviate/weaviate/pull/12808\r\n* fix(hfresh): decode centroid codes with the right quantizer in split/merge reassignment by @asdine in https://github.com/weaviate/weaviate/pull/12795\r\n* chore(gen-code-from-swagger.sh): add code formatting step by @antas-marcin in https://github.com/weaviate/weaviate/pull/12814\r\n* mcp: refuse GET with 405 and run the streamable server stateless by @g-despot in https://github.com/weaviate/weaviate/pull/12789\r\n* fix(kmeans): compute FitBalanced centers from the balanced membership by @abdelr in https://github.com/weaviate/weaviate/pull/12804\r\n* feat(rest): structured reference selection (returnReferences) by @g-despot in https://github.com/weaviate/weaviate/pull/12424\r\n* Back up collections concurrently through one shared worker pool by @dirkkul in https://github.com/weaviate/weaviate/pull/12790\r\n* Stop holding the collection map lock while counting objects on disk by @dirkkul in https://github.com/weaviate/weaviate/pull/12825\r\n* feat(hfresh): debug endpoint to reassign all vectors in place by @asdine in https://github.com/weaviate/weaviate/pull/12820\r\n* Fix count aggregation over shards, and resolve its routing plan once by @dirkkul in https://github.com/weaviate/weaviate/pull/12791\r\n* RQ4 centered quantization by @trengrj in https://github.com/weaviate/weaviate/pull/12502\r\n* Skip vanished files and directories instead of failing shard usage by @dirkkul in https://github.com/weaviate/weaviate/pull/12832\r\n* Fix shard loaded and unloaded metrics by @dirkkul in https://github.com/weaviate/weaviate/pull/12827\r\n* Cache object count for lazy shards by @dirkkul in https://github.com/weaviate/weaviate/pull/12835\r\n* Add weaviate_shards, a shard count by state and eager or lazy loading by @dirkkul in https://github.com/weaviate/weaviate/pull/12831\r\n* Finish the startup shard warmup after a shard fails to load by @dirkkul in https://github.com/weaviate/weaviate/pull/12837\r\n* feat(generative-meta): add Meta AI generative module by @antas-marcin in https://github.com/weaviate/weaviate/pull/12839\r\n* test(generative-aws): remove Cohere's Command-R models from tests by @antas-marcin in https://github.com/weaviate/weaviate/pull/12841\r\n* Disable background lazy tenant loading for small tenants by @dirkkul in https://github.com/weaviate/weaviate/pull/12834\r\n* fix(lsmkv): give test SegmentGroups a logger to stop slow-read nil panic by @antas-marcin in https://github.com/weaviate/weaviate/pull/12843\r\n* Run every row of the object authorization tables by @dirkkul in https://github.com/weaviate/weaviate/pull/12840\r\n* security(deps): bump golang.org/x/crypto dependency to 0.55.0 by @antas-marcin in https://github.com/weaviate/weaviate/pull/12851\r\n* perf(inverted): cut batched Contains extraction allocations and faster segment-index reads by @aliszka in https://github.com/weaviate/weaviate/pull/12436\r\n* lsmkv, inverted: read a batch of roaring set rows through one batch reader by @aliszka in https://github.com/weaviate/weaviate/pull/12530\r\n* Shut down test indexes so background flush cannot race TempDir cleanup by @jeroiraz in https://github.com/weaviate/weaviate/pull/12858\r\n* inverted: hold the batched Contains keys as a sorted slab by @aliszka in https://github.com/weaviate/weaviate/pull/12614\r\n* lsmkv: read the batched Contains keys from a memtable a window at a time by @aliszka in https://github.com/weaviate/weaviate/pull/12701\r\n* fix(kmeans): replace FitBalanced's post-hoc balancing with in-loop size-constrained assignment by @asdine in https://github.com/weaviate/weaviate/pull/12854\r\n* feat(hfresh): cluster posting splits on full-precision vectors by @asdine in https://github.com/weaviate/weaviate/pull/12863\r\n* Refuse property names that collide with migration directories by @etiennedi in https://github.com/weaviate/weaviate/pull/12873\r\n* perf(hfresh): fetch split vectors through a single bucket view by @asdine in https://github.com/weaviate/weaviate/pull/12875\r\n* fix(reindex): only checkpoint reindex progress once the data is durable by @etiennedi in https://github.com/weaviate/weaviate/pull/12877\r\n* security: bump google gRPC dependencies by @antas-marcin in https://github.com/weaviate/weaviate/pull/12897\r\n* test(cluster): fix snapshot-restore flake racing the cluster-ID commit by @moogacs in https://github.com/weaviate/weaviate/pull/12902\r\n* ci: remove multinode-restart-a reindex pipeline by @antas-marcin in https://github.com/weaviate/weaviate/pull/12895\r