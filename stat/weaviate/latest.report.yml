viate/pull/13184\r\n* [v1.38] hnsw: dedup ACORN entrypoint (backport #13121, fixes #656) by @abdelr in https://github.com/weaviate/weaviate/pull/13211\r\n* hnsw: one heap object per node by embedding the connections in the vertex by @asdine in https://github.com/weaviate/weaviate/pull/13179\r\n* compactv2: merge empty .sorted files instead of leaking one per backup by @asdine in https://github.com/weaviate/weaviate/pull/13206\r\n* Speed up the wait-group linter from ~100s to under a second by @dirkkul in https://github.com/weaviate/weaviate/pull/13236\r\n* Stop a permission denial from rewriting the user's group names by @dirkkul in https://github.com/weaviate/weaviate/pull/13235\r\n* Delete dead AddLinksAtLevel by @dirkkul in https://github.com/weaviate/weaviate/pull/13239\r\n* Summarize storage lookup timings in every slow-query log line by @dirkkul in https://github.com/weaviate/weaviate/pull/13124\r\n* perf(roaringsetrange): build compaction nodes into one reused buffer by @aliszka in https://github.com/weaviate/weaviate/pull/13154\r\n* Expose the batch-delete cap in the gRPC BatchDeleteReply by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13103\r\n* Cap the filtered batch delete resolve at QUERY_MAXIMUM_RESULTS by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13104\r\n* Resolve filter and batch-delete doc ids in parallel by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13106\r\n* Answer 422 or 404 for an invalid class name instead of 500 or 403 by @dirkkul in https://github.com/weaviate/weaviate/pull/13260\r\n* perf(refcache): index cacher jobs by identifier to avoid quadratic lookup by @antas-marcin in https://github.com/weaviate/weaviate/pull/13267\r\n* debug: allow the debug vector rebuild on geo indexes by @asdine in https://github.com/weaviate/weaviate/pull/13261\r\n* Batch delete follow-ups: rate-limit unreadable-row warning, fix limit<=0 description by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13254\r\n* Skip re-indexing unchanged text on update and keep len() filters current by @byronvoorbach in https://github.com/weaviate/weaviate/pull/13288\r\n* Delete WAL files with less than 4 bytes by @dirkkul in https://github.com/weaviate/weaviate/pull/13297\r\n* db: vector index queue logs under its index's identity only by @asdine in https://github.com/weaviate/weaviate/pull/13301\r\n* hnsw: never apply garbage from a corrupt compacted commit log segment by @asdine in https://github.com/weaviate/weaviate/pull/13300\r\n* feat: shard self-recovery (snapshot + log-replay rejoin) by @jeroiraz in https://github.com/weaviate/weaviate/pull/11768\r\n* Validate input for authz handlers by @dirkkul in https://github.com/weaviate/weaviate/pull/13294\r\n* perf(lsmkv): replay a large write-ahead log as a run of segments by @aliszka in https://github.com/weaviate/weaviate/pull/13198\r\n* raft: start a single-node cluster without waiting for multi-node timeouts by @asdine in https://github.com/weaviate/weaviate/pull/13384\r\n* hnsw: never load a node ID far beyond the shard's document-ID counter by @asdine in https://github.com/weaviate/weaviate/pull/13377\r\n* Write export parquet blob columns without page header statistics by @dirkkul in https://github.com/weaviate/weaviate/pull/13393\r\n* End export Parquet row groups at 32 MiB to bound writer memory by @dirkkul in https://github.com/weaviate/weaviate/pull/13423\r\n* Leave the cluster and close the database even if HTTP shutdown times out by @dirkkul in https://github.com/weaviate/weaviate/pull/13310\r\n* Add a config-bound built-in metadata reader role by @spiros-spiros in https://github.com/weaviate/weaviate/pull/13432\r\n* queue(geo): 24KB chunks bound geo batches to ~1000 points by @abdelr in https://github.com/weaviate/weaviate/pull/13394\r\n* queue: remove ASYNC_INDEXING_BATCH_SIZE by @asdine in https://github.com/weaviate/weaviate/pull/13459\r\n* Start a new export Parquet file once the open one reaches 1 GiB by @dir