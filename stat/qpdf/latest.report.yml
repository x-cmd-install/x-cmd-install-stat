me":"vcpkg.zip","label":"","uploader":{"login":"jberkenbilt","id":997128,"node_id":"MDQ6VXNlcjk5NzEyOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":195951195,"digest":"sha256:82005252fee032135d07c85ad7626a38f26fb253c1e098d1d185f315bea15ebb","download_count":393,"created_at":"2026-09-27T00:01:33Z","updated_at":"2026-09-27T00:01:39Z"}],"body":"This is qpdf version 12.4.2. In addition to a few small bug fixes, this release features two significant improvements: inclusion of several new binary platform releases and substantial improvements to linearization. We now include official release binaries for MacOS (intel and arm64), Windows arm64, and Linux aarch64 (arm64) both as an AppImage and as stand-alone binaries. For linearization, for certain types of files, qpdf is vastly more memory efficient (we've seen 30× improvements in some cases) and slightly faster. Also, there are a few small fixes to linearization object ordering, so linearized output may differ for some rare files relative to previous releases.\n\nFor a full list of changes from previous releases, please see the [release notes](https://qpdf.readthedocs.io/en/stable/release-notes.html). See also [README-what-to-download](./README-what-to-download.md) for details about the available source and binary distributions.\n\nThis release was signed by ejb@ql.org.\n","reactions":{"total_count":22,"+1":9,"-1":0,"laugh":2,"hooray":4,"confused":0,"heart":4,"rocket":3,"eyes":0}}
