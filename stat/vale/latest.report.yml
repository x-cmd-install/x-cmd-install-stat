22T20:43:22Z"}],"body":"## Changelog\r\n* d7a379da fix: A percent-encoded link target no longer drops a later alert\r\n* d59ad842 fix: A `.tsx` file is parsed with the TSX grammar\r\n* cafff9f9 fix: A phrase in a rule matches across a line wrap\r\n* f41c1eda fix: Compile the spelling exception pattern once per vocabulary\r\n* 4f013daf feat: Find `vale.ini` in a project's `.config` directory\r\n* 9f822e9d docs: Add FLOSS\r\n* a7817766 fix: A tag inside a link's text no longer crashes `scope: link`\r\n* 8e88d55a test: Guard the casing-and-code scenario on rst2html\r\n* 10744bd6 fix: A wrapped list item or blockquote is placed by runs, not by searching for its text\r\n* b41932c5 fix: A doc-comment mask drops only an alert whose match lies inside it\r\n* 91041463 fix: An alert in a comment is placed by what extraction took off its line\r\n* 1a84507d fix: A `sequence` match holding inline markup is placed through the block's runs\r\n* 3d89b9e4 fix: An `occurrence` message's count fills `%s` as well as `%d`\r\n* a07aa34c fix: `.mjs`, `.cjs`, `.mts`, and `.cts` are JavaScript and TypeScript, and a mapped file's grammar comes from the format it is read as\r\n* 82f20fc2 fix(lint): take the tree-sitter grammar from a [formats] mapping when the extension has none (#1204)\r\n* 61cb142a fix: AsciiDoc cross-references without text render as empty links\r\n* cfb21a4c fix: MDX elements that span lines no longer lose later alerts, and a list that takes a non-item no longer panics\r\n* a0fc3a96 fix: MDX reads JSX inside expressions, escapes in attributes, and multiline template literals\r\n* b5b8e429 fix: An unreadable document no longer stops the run, and a package's dropped styles are named\r\n* 25270feb fix: `Vocab` works in `[*]`, and `Vocab = NONE` clears inherited vocabularies\r\n* fce33f19 feat: Spelling alerts say when a word is a casing mistake or looks like code\r\n* fb4f161f fix: Vale.Terms finds terms that start or end with punctuation, like `C++` and `.NET`\r\n* 775511b8 feat: YAML vocabularies, and affix flags in vocabularies and rules\r\n* c8fcacf2 feat: The default dictionary knows common technical vocabulary\r\n* 2b345462 docs: remove studio\r\n* c74f4da2 docs: Remove DO\r\n\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
