d":"RA_kwDOBNRFV84gTJQe","name":"vale_3.20.0_macOS_64-bit.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11725558,"digest":"sha256:8d51cbe9ca6274fade890fc943b30dc564071dcb8fd8814abce2d0dca37fbba7","download_count":75,"created_at":"2026-09-02T23:27:03Z","updated_at":"2026-09-02T23:27:04Z"},{"id":541889565,"node_id":"RA_kwDOBNRFV84gTJQd","name":"vale_3.20.0_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11300418,"digest":"sha256:6b32df1a7d7b2ab01c07c1c4dd5fd84d775ac7a8f4101084cb5cc7df76bdc65e","download_count":1807,"created_at":"2026-09-02T23:27:03Z","updated_at":"2026-09-02T23:27:04Z"},{"id":541889574,"node_id":"RA_kwDOBNRFV84gTJQm","name":"vale_3.20.0_Windows_64-bit.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12000344,"digest":"sha256:189b3511813a428f08a2be0d7692e50dd6e90dd81b2f8e04dbfbfe42cafd9980","download_count":2370,"created_at":"2026-09-02T23:27:04Z","updated_at":"2026-09-02T23:27:05Z"},{"id":541889571,"node_id":"RA_kwDOBNRFV84gTJQj","name":"vale_3.20.0_Windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":11142283,"digest":"sha256:397cf247252f205145c991b339031a39d02d947d97ac48e6516bb62118ed411f","download_count":27,"created_at":"2026-09-02T23:27:04Z","updated_at":"2026-09-02T23:27:04Z"}],"body":"Vale 3.20.0 ships a set of features aimed at style *authoring* at library scale. [Std](https://vale.sh/blog/std), the new standard library, is built on all three and walks through each; [Voices](https://vale.sh/blog/voices) is the first package to consume them.\r\n\r\n## A rule can extend another rule\r\n\r\nAn `extends` value containing a dot names a rule rather than a check: the new rule starts from that rule's full definition and lays its own keys on top. Two styles can share one carefully built pattern and disagree only about message, level, or a handful of entries:\r\n\r\n```yaml\r\n# styles/House/OxfordComma.yml\r\nextends: Std.Punctuation.OxfordComma\r\nmessage: 'Serial comma, always.'\r\nlevel: error\r\n```\r\n\r\nThree lines, your name on the alert, the parent's machinery underneath \u2014 including every false-positive guard it ever gains. The parent has to be present on the `StylesPath`, not enabled: inheritance is a file reference, and `vale sync` is what puts the file there. A child can itself be extended, up to ten rules deep. The one thing you can't extend is a `Vale.*` built-in, which is generated at runtime and has no file.\r\n\r\nA bare key replaces the parent's value outright. Lists and maps also take overlay edits:\r\n\r\n```yaml\r\nextends: Direct.Hedging\r\nmessage: \"We don't hedge.\"\r\ntokens+:\r\n  - perhaps the best answer is\r\ntokens-:\r\n  - one could argue\r\n```\r\n\r\n`key+` appends to a parent list, or merges into a parent map with the child's entries winning; `key-` removes entries by their source text, or the named keys from a map. Removing something the parent doesn't have is a compile error, on purpose: if upstream renames an entry your child was removing, you hear about it when the rule compiles instead of diverging silently. Writing both `key` and `key+` in one file is refused.\r\n\r\nA directory whose name starts with `_` or `.` is skipped at load time but stays visible to `extends`, so a pattern shared by several rules can live in one file without itself becoming a rule. A fragment is validated as the chain's root, so it must carry a `message` \u2014 even one no alert will show.\r\n\r\nDocs: [Extending another rule](https://docs.vale.sh/topics/styles#extending-another-rule)\r\n\r\n## Nested rule directories\r\n\r\nA style can organize its rules in subdirectories, and the path joins the name: `Std/Grammar/PassiveVoice.yml` is `Std.Grammar.PassiveVoice` everywhere a rule name goes \u2014 alerts, configuration, in-text comments, filters, and `extends`. There is no depth limit, and directories prefixed with `.` or `_` are inert, so drafts and shared fragments can sit inside a style without loading.\r\n\r\nDocs: [Nested directories](https://docs.vale.sh/topics/styles#nested-directories)\r\n\r\n## Tune a rule's scalars from configuration\r\n\r\nA bracketed key overrides one scalar on a rule you have enabled, keeping the rule's identity:\r\n\r\n```ini\r\n[*.md]\r\nBasedOnStyles = Std\r\n\r\nStd.Readability.SentenceLength = error\r\nStd.Readability.SentenceLength[max] = 30\r\n```\r\n\r\nThe word in brackets is the key as it appears in the rule's YAML, so any scalar a rule declares is a dial. Values coerce at compile time, and an unknown parameter fails the rule's compilation rather than being silently dropped. Structural fields \u2014 `tokens`, `swap`, `message` \u2014 are refused with a pointer at extending the rule in a style, which is what authoring is for; `[level]` is refused because the classic `Style.Rule = error` syntax already says that.\r\n\r\nDocs: [Parameters](https://docs.vale.sh/keys/basedonstyles#parameters)\r\n\r\n## Changelog\r\n\r\n* fdc4cc75 fix: report an occurrence shortfall at the scope that fell short\r\n* d978056e feat: add an apply mode to vale fix\r\n* 58392ffd fix: honor comment directives at any indent\r\n* fcd23e65 feat: report per-check alert counts under `--counts`\r\n* 2545b006 docs: add contributor license agreement and PR comments\r\n* 9972e93d docs: add AI-Assisted Contributions\r\n* 33f473d1 ix: mask an inline element in SkippedScopes instead of dropping it\r\n* 03e45ee9 feat(spell): honor Hunspell BREAK rules\r\n* 29e67d2e fix(config): keep escaped commas in TokenIgnores and BlockIgnores\r\n* 71b13ca6 fix(spell): narrow COMPOUNDMIN inside its range check\r\n* 8bd83b5b chore: bump golang.org/x/crypto to v0.55.0\r\n* af123f48 feat: tune a rule's scalars from configuration\r\n* 05875a93 feat: a rule can extend another rule\r\n* 6d97c2de feat: nested rule directories, and test cases in-source\r\n* 5d338235 feat: satisfy negated sequence tokens at boundaries; add region exceptions\r\n* e9caf5f1 Satisfy negated sequence tokens at sentence boundaries\r\n* c62d75f6 fix: parse a compound stanza at a fixed width, not the target's (#1159)\r\n* 6d22b96f refactor: other org refs\r\n* 3f26c989 refactor: migrate org\r\n* b8560d8f fix: read a self-closing tag as the boundary it is (#1157)\r\n"}
