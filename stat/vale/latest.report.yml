id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":8404030,"digest":"sha256:69149ba66c874d155837af986459f5534c2debdb305928bb73730f71471d3ca3","download_count":2,"created_at":"2026-11-12T19:24:29Z","updated_at":"2026-11-12T19:24:30Z"},{"id":740781617,"node_id":"RA_kwDOBNRFV84sJ24x","name":"vale_3.27.0_Windows_64-bit.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":10920398,"digest":"sha256:26e61cc58ac4180866d068dc2325d2625560c8cc518de7e7b5523211a5ab0cbc","download_count":68,"created_at":"2026-11-12T19:24:29Z","updated_at":"2026-11-12T19:24:30Z"},{"id":740781619,"node_id":"RA_kwDOBNRFV84sJ24z","name":"vale_3.27.0_Windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":9945423,"digest":"sha256:61fcda27c55f14c89b35b00c19cc5bef896142707adbfbaf194ed020f8516a35","download_count":5,"created_at":"2026-11-12T19:24:29Z","updated_at":"2026-11-12T19:24:30Z"}],"body":"## French, German, and Spanish\r\n\r\nVale now lints French, German, and Spanish in the language itself. Set `Lang` and run `vale sync` to download its model:\r\n\r\n```ini\r\n[*.md]\r\nLang = fr\r\n```\r\n\r\nSentences are split and words are tagged with a model for that language, so `sequence` rules can match on `upos:` tags. `spelling` reads the language's own dictionary from `config/dictionaries`, and sentence-case rules keep the words the language capitalizes, such as German nouns. More languages are available; `vale sync` reports any that have no model.\r\n\r\n## Source-code grammars\r\n\r\nTree-sitter grammars are now WebAssembly modules that `vale sync` installs, and the release binaries no longer need CGo.\r\n\r\n**If you lint source code, run `vale sync` after upgrading.** A `[*.go]` section gets the Go grammar automatically; `Grammars = go, python` (or `ALL`, or `NONE`) overrides that.\r\n\r\n## Also\r\n\r\n- `vale ls-metrics` takes several paths or a directory.\r\n- Rules scoped to `sentence` or `paragraph` now run on code comments.\r\n- A hard line break no longer joins a nested list to the item above it (#1225).\r\n\r\n\r\n\r\n## Changelog\r\n* 4ce91ef2 fix: Ignore the zig cache\"\r\n* de2efa27 fix: Name the dictionary directory the same way everywhere\r\n* 05abbafb fix: let a hard line break keep a nested list separate (#1226)\r\n* 916d7b41 fix: Run sentence-scoped rules on code comments\r\n* ad4b34e2 feat: The English-built checks follow Lang\r\n* 80b2ac8a fix: Lang in [*], and a grammar the cache can't take\r\n* 39454242 feat: Sync the grammars the sections imply\r\n* b2d7c28a chore: Bump prose to v3.3.0\r\n* 7efb3942 feat: A vale_nocode build without the grammar runtime\r\n* 66bbb85a ci: Put DITA-OT on the Windows PATH\r\n* 49bd113b chore: Pin prose to the branch head\r\n* aa756dab chore: Bump prose for the new English tagger\r\n* 466210d2 fix: Download the grammar sources before building\r\n* 0c03fed1 feat: Run tree-sitter grammars as WebAssembly\r\n* cb0fdf54 feat: Run tree-sitter grammars as WebAssembly\r\n* de56bd44 chore: Build with Go 1.27.3\r\n* 7d7de145 feat: Let ls-metrics take several paths\r\n* 04b464cf fix: Give Asciidoctor.js a JavaScript converter\r\n* f0b930c0 feat: Download language models on sync\r\n* 3385243d feat: Lint a file in the language its configuration names\r\n* 628a7877 chore: Bump prose\r\n* e6c7f754 test: Correct three expected alert positions\r\n* 0d9e8023 fix: A match in text the converter rewrote is placed where it is\r\n* 9b7e4caa fix: An undefined Sphinx substitution is skipped, not read as prose\r\n* 9e606e9a fix: A sentence-case rule accepts an acronym\r\n\r\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
