,"gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10030497,"digest":"sha256:01b670fa2a49fabb00b1e9bbf98041d38c9b3de62a0763ed4910863bbc14372d","download_count":62,"created_at":"2026-11-26T14:20:15Z","updated_at":"2026-11-26T14:20:16Z"},{"id":796243660,"node_id":"RA_kwDOBNRFV84vdbbM","name":"vale_3.29.0_wasm_min.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6322970,"digest":"sha256:9f4d7f9c1d082f81cd2a0ba4a2bc8cba30cda133f65e2410bd5017d59bbc14d6","download_count":2,"created_at":"2026-11-26T14:20:14Z","updated_at":"2026-11-26T14:20:15Z"},{"id":796243672,"node_id":"RA_kwDOBNRFV84vdbbY","name":"vale_3.29.0_Windows_64-bit.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12370014,"digest":"sha256:5977efcb833248b69c870759c74d368cdaf8845103ac59b986cad1467affc1a0","download_count":193,"created_at":"2026-11-26T14:20:14Z","updated_at":"2026-11-26T14:20:16Z"},{"id":796243665,"node_id":"RA_kwDOBNRFV84vdbbR","name":"vale_3.29.0_Windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":11241638,"digest":"sha256:139641ed5ef31b6a4b05b93570aa1be4246e64816c55fe20724abd07821d2c7c","download_count":11,"created_at":"2026-11-26T14:20:14Z","updated_at":"2026-11-26T14:20:15Z"}],"body":"- **LaTeX.** Vale now lints `.tex` files. It reads the source without running TeX, so a document that doesn't compile still lints. Math, citations, references, and verbatim text are treated as code; sections, captions, footnotes, list items, and table cells are prose.\r\n- **Typst, built in.** typst2vast is now embedded, so Typst files need nothing else installed.\r\n- **`IgnoredPaths`.** A new `.vale.ini` key for paths that are never linted, even when named on the command line.\r\n- **Pinned packages.** A package can be pinned to its archive's digest.\r\n- **`.yaml` rules.** Rules load from `.yaml` files as well as `.yml` (#1232, thanks @seragAhmed).\r\n\r\n![A Markdown page, a Go file, and a YAML file sketched as bars, with the prose lit, the code and markup dark, and one alert in each at its exact position.](https://vale.sh/blog/og/spelling.png)\r\n\r\n### [Spell checking is a parsing problem](https://vale.sh/blog/spelling)\r\n\r\nVale reads the format before it checks the spelling, so in fifteen markup formats, six programming languages, and three data formats, its output is the misspellings in your prose and nothing else. What that gets you, how fast it is, and how to bring a technical vocabulary along.\r\n\r\n## Changelog\r\n* 74aa23a8 feat: Add IgnoredPaths\r\n* 68c67051 ci: Link a release's blog post\r\n* 6388481b fix: Read math shorthands and place rewritten words in LaTeX\r\n* f2dbb55a chore: Accept 'Kato' in the vocabulary\r\n* 7d3f82a0 chore: Embed typst2vast v0.2.0\r\n* 33e310d7 docs: Credit the author in the README\r\n* c99e68eb chore: Drop typst2vast from the image\r\n* 99ccbb22 feat: Read Typst with an embedded typst2vast\r\n* 7a948db5 feat: Lint LaTeX\r\n* 159a4a83 feat: Pin a package to its archive's digest\r\n* 4579d16d fix: Load a grammar once when files of its language are linted at once\r\n* 3f9b7383 fix: Compare a wrapped phrase as one line against its swap\r\n* 1f9bf383 chore: Bump prose to v3.3.3\r\n* 237289e4 fix: Anchor the list-number pattern so a version isn't one\r\n* 74987670 fix: Skip character classes when finding a substitution key's lookarounds\r\n* d02e8204 fix: Fill in a substitution's capture groups when its key has a lookbehind\r\n* f5624b9e fix: Anchor a doc() selection without claiming its text is contiguous\r\n* 6d048b18 fix: Place a doc() match in its element, not at an earlier copy\r\n* d5eaeab7 fix: Read Rust block comments, and a Python module docstring after comments\r\n* 4967fc21 fix: Match a large vocabulary, and load it and dictionaries faster\r\n* d84e96d2 fix: Match a large vocabulary instead of failing on it\r\n* 5b368766 chore: Name both rule paths when a parent is missing\r\n* c96964f4 test: Skip the View order test without views\r\n* 40507c48 feat: load rules from `.yaml` files as well as `.yml` (#1232)\r\n* 8eb84cd8 fix: Pick a file's View by section order, the later one winning\r\n* 4a6c9a58 chore: Update prose to v3.3.2 (#1234)\r\n* c198c5de chore: Update regexp2 to v2.5.7\r\n* 6142ce3f perf: Derive a pattern's prefilter on first use\r\n* 5d484ac7 perf: Split a rule's tokens when one is anchored\r\n* ba32aaf2 fix: A raw-text tag in prose no longer swallows the rest of the document\r\n* d4e80232 perf: Anchor sequences on their rarest token, and filter on lookarounds\r\n* 9cbdd4df perf: One memo lookup per block, and remember sequence rules\r\n* 56ccf62e build: Add vale_nodict to leave out the default dictionary\r\n* a2843f6a ci: Leave e2e out of the minimal-tags test run\r\n* fbab1cca fix: Stop IgnoredClasses growing with every HTML file\r\n* 313d1a82 fix: sync a package whose archive root differs from its name\r\n* 1ea3e6b7 chore: buld wasm\r\n* 2b9161a4 perf: Find a rule's literals in one pass\r\n* 4b67a3f5 test: Expect write-good 0.5.0 messages\r\n* bab1513b perf: Smaller wasm build and faster rule matching\r\n* 02e3ca8e build: Strip and pack the grammar modules\r\n","mentions_count":1}
