ode_id":"RA_kwDOPBmB5s4giaRH","name":"semantica-0.6.8.tar.gz.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":11372,"digest":"sha256:3d621c7f01f94b2e9bc44f877b4dedda5c7221d2c9617b91b6c4f40592dcd480","download_count":4,"created_at":"2026-09-05T14:00:59Z","updated_at":"2026-09-05T14:00:59Z"}],"body":"# Semantica v0.6.8\n\n**Released:** 2026-09-05\n**Tag:** [`v0.6.8`](https://github.com/semantica-agi/semantica/releases/tag/v0.6.8) \u00b7 **Compare:** [`v0.6.7...v0.6.8`](https://github.com/semantica-agi/semantica/compare/v0.6.7...v0.6.8) \u00b7 **PyPI:** [semantica 0.6.8](https://pypi.org/project/semantica/0.6.8/)\n\n## Highlights\n\n**Every release from here on is cryptographically signed** \u2014 the build now runs SLSA build-provenance attestation plus Sigstore signing, and `.sigstore.json` bundles ship alongside the wheel/sdist on every GitHub Release, closing the OpenSSF Scorecard Signed-Releases gap. This is also the release that actually exercises that pipeline for the first time: it surfaced a latent bug where the Sigstore output broke PyPI publishing, now fixed by running publish before signing writes into `dist/`.\n\nShips: real vector-store **enumeration** (`scan_vectors()`/`iter_vectors()`) across FAISS, SQLiteVec, PgVector, Qdrant, Weaviate, Pinecone, and Milvus, making `semantica store migrate` functional between backends for the first time; first-class **`Anthropic`, `Gemini`, `Ollama`, `DeepSeek`, and `Novita`** LLM provider wrappers in `semantica.llms`; a deterministic, CI-friendly **ontology quality gate**; first-class **Google ADK** integration; a **Salesforce ingestor**; `ErasureCoordinator` (completing the erasure workflow `purge_node()` only started, so a purged entity no longer survives verbatim in `AgentMemory` or as an embedding); and Explorer's read-only Markdown viewer becoming a full **editor** for live `ContextGraph` nodes and host-supplied `AgentMemory` items.\n\nAlso fixes: 35 correctness bugs (Python 3.9 install breakage, FAISS save/load metadata loss, `semantica ingest`'s silent no-op against a configured graph store, MCP persistence, Explorer graph rendering, ontology property-collision handling, and more) and closes 12 Dependabot `aiohttp` alerts, 5 HIGH-severity Trivy container findings, and 2 npm advisories \u2014 see [CHANGELOG.md](CHANGELOG.md) for the full breakdown.\n\n## What's Changed\n\n- [#1231](https://github.com/semantica-agi/semantica/pull/1231) \u00b7 [`56d9e9a8`](https://github.com/semantica-agi/semantica/commit/56d9e9a8579bb44e5645fa28401fb6e0b4dc0685) \u00b7 fix(ontology): coalesce normalized property collisions \u00b7 @T1mn\r\n- [#1241](https://github.com/semantica-agi/semantica/pull/1241) \u00b7 [`5376f046`](https://github.com/semantica-agi/semantica/commit/5376f046ca7cbae23d108d4395457e1415b91002) \u00b7 fix(explorer): dedupe temporal snapshot requests and apply latest-wins \u00b7 @ALDRIN121\r\n- [#1236](https://github.com/semantica-agi/semantica/pull/1236) \u00b7 [`da642f12`](https://github.com/semantica-agi/semantica/commit/da642f12fa221b31c046f472d1ccb895a5f6168f) \u00b7 fix(export): @vocab mints into the shipped ns# namespace \u00b7 @pkupt\r\n- [#1041](https://github.com/semantica-agi/semantica/pull/1041) \u00b7 [`d3183d0a`](https://github.com/semantica-agi/semantica/commit/d3183d0ab3c30606a654855557d63404dbbb1385) \u00b7 feat(explorer): add deterministic rendering E2E example and test (#1037) \u00b7 @alexsmolya\r\n- [#1240](https://github.com/semantica-agi/semantica/pull/1240) \u00b7 [`4bf525d4`](https://github.com/semantica-agi/semantica/commit/4bf525d409657cdf750584407ee0188211420d15) \u00b7 feat(ingest): add production-ready Salesforce ingestor \u00b7 @Sameer6305\r\n- [#1024](https://github.com/semantica-agi/semantica/pull/1024) \u00b7 [`85d6ccd0`](https://github.com/sem