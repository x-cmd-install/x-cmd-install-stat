de_id":"RA_kwDOPBmB5s4ipPO7","name":"semantica-0.7.0.tar.gz.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":11106,"digest":"sha256:61f33516f09f30ae0886829efdba8eca67969c8285bfab2addad1febc6fb2d35","download_count":2,"created_at":"2026-09-22T11:18:02Z","updated_at":"2026-09-22T11:18:02Z"}],"body":"# Semantica v0.7.0\n\n**Released:** 2026-09-22\n**Tag:** [`v0.7.0`](https://github.com/semantica-agi/semantica/releases/tag/v0.7.0) \u00b7 **Compare:** [`v0.6.8...v0.7.0`](https://github.com/semantica-agi/semantica/compare/v0.6.8...v0.7.0) \u00b7 **PyPI:** [semantica 0.7.0](https://pypi.org/project/semantica/0.7.0/)\n\n## Highlights\n\n**Core install is now 4x lighter** \u2014 direct dependencies dropped from 44 to 22 packages, with heavy ML/NLP, visualization, document-parsing, and ingestion libraries (`torch`, `spacy`, `sentence-transformers`, `matplotlib`, `faiss-cpu`, `python-docx`, and more) moved into granular optional extras; `pip install \"semantica[all]\"` keeps the previous fully-bundled behavior. This is also the first release requiring **Python 3.10+** (3.8/3.9 dropped, 3.14 not yet supported), with a committed `uv.lock` for reproducible dev installs.\n\nShips: **Hierarchical Community GraphRAG** (multi-level Louvain/Leiden community detection, LLM-summarized community reports, and global Map-Reduce + DRIFT hybrid search); six new data connectors \u2014 **BigQuery, Amazon Redshift, Power BI, Apache Airflow**, plus line-delimited JSON ingestion; **schema-guided extraction** (`SchemaValidator` + `bootstrap_schema`); **source-aware truth maintenance** with corroboration-based **trust tiers** for graph facts; a **persistent SQLite backend** for `ExtractionCache`; new MCP **semantic retrieval tools** (`store_document`/`retrieve_context`/`update_document`/`remove_document`); and `SPARQLReasoner.execute_query` running real queries instead of a no-op.\n\nAlso fixes 40+ correctness bugs (in-memory vector-ID reuse corrupting live vectors, FAISS/Qdrant/Milvus vector-store gaps, Explorer temporal-scrubber and ontology-linking bugs, CLI commands calling nonexistent APIs, and more) and closes a Neptune credential-logging leak, a pip-audit CVE-alias matching gap, and unpatched `chromadb`/`json-repair` CVEs via removing the `crewai` extra \u2014 see [CHANGELOG.md](CHANGELOG.md) for the full breakdown.\n\n**Breaking changes:** `Entity.confidence` is now `Optional[float]` (was `float = 1.0`); `PolicyEngine.check_compliance` now raises `ProcessingError` instead of returning `False` for unevaluable rules; the `dev` extra is replaced by a PEP 735 dependency group (`pip install -e . --group dev`); `semantica[crewai]` no longer installs `crewai` automatically; Python 3.8/3.9 are no longer supported.\n\n## What's Changed\n\n- [#1473](https://github.com/semantica-agi/semantica/pull/1473) \u00b7 [`a5994497`](https://github.com/semantica-agi/semantica/commit/a59944971e8114e6a5da2e486b798720daa02985) \u00b7 fix: correct production env var to SEMANTICA_API_KEY (fixes #1429) \u00b7 @v01dst\n- [#1455](https://github.com/semantica-agi/semantica/pull/1455) \u00b7 [`ce0ae1cb`](https://github.com/semantica-agi/semantica/commit/ce0ae1cb88a0a157110a9f78f32ff3de69da3f4b) \u00b7 refactor(context): expose public temporal normalizer \u00b7 @Saket7002\n- [#1381](https://github.com/semantica-agi/semantica/pull/1381) \u00b7 [`754fe5fd`](https://github.com/semantica-agi/semantica/commit/754fe5fdd74d53be2ad070e2b17d307c52cc2a89) \u00b7 fix(context): deep-copy store results in ErasureReceipt.to_dict() \u00b7 @BinarySpecter\n- [#1465](https://github.com/semantica-agi/semantica/pull/1465) \u00b7 [`ebd659a9`](https://github.com/semantica-agi/semantica/commit/ebd659a9c0fd6babaa3048b3e8f99470cfe9dad3) \u00b7 Closes #1351: [BUG] semantica ingest reports \"\u2713 Ingested\" bu