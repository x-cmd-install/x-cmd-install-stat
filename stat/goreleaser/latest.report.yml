ix: dockers_v2 reports the image config digest (#7181) (@Zak4sad)\n### Other work\n* 048a5869ad3201ed1a684cf187e71e2be328bd6d: chore: auto-update generated files (#7152) (@goreleaserbot)\n* 827aa03e0935655ec4217f50a4dbc33f621b6a5c: chore: auto-update generated files (#7159) (@goreleaserbot)\n* ff8de3d6c38984ba20ea48e13b54d0767f123d64: chore: auto-update generated files (#7165) (@goreleaserbot)\n* 27ef66dec8ba76280b449310b4fdaa64d09299c0: chore: auto-update generated files (#7166) (@goreleaserbot)\n* a9d676f69ac8cb5d3bcb38abb2b7987fd4e1f2b8: chore: auto-update generated files (#7172) (@goreleaserbot)\n* 38962f0f6e5967fd9cef228ce56d64314ac33d50: chore: auto-update generated files (#7183) (@goreleaserbot)\n\n**Full Changelog**: https://github.com/goreleaser/goreleaser/compare/v2.18.2...v2.18.3\n\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of some **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/), get a [Pro License](https://goreleaser.com/pro) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* Find examples and commented usage of all options in our [website](https://goreleaser.com/intro/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6), [Twitter](https://twitter.com/goreleaser), and [Telegram](https://t.me/goreleasernews)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>\n\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":7}
