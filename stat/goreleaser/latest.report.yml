"type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":28483806,"digest":"sha256:d230d6def8b6059b277d472a2790501516b429ffe83b91469daad8b7736b8a5d","download_count":272,"created_at":"2026-11-12T14:02:54Z","updated_at":"2026-11-12T14:02:55Z"},{"id":739709897,"node_id":"RA_kwDOBJgEXs4sFxPJ","name":"goreleaser_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":549446,"digest":"sha256:c92017069632bebe4880bb5c06fefabe58dc0508363f3f91cd5ad191c01b24c3","download_count":5,"created_at":"2026-11-12T14:03:13Z","updated_at":"2026-11-12T14:03:14Z"}],"body":"\n## Announcement\n\nRead the official announcement: [Announcing GoReleaser v2.20](https://goreleaser.com/blog/goreleaser-v2.20/).\n\n\n## Changelog\n### Security updates\n* 84f5ed6689a1a2b4112f1085d96cf6a6ddb11a5e: sec: redact Git publication and SBOM credentials (#7303) (@caarlos0)\n### Bug fixes\n* b6d7c4e4cb095d80c903b1ce66f02db69597cff0: fix(checksums): do not fail split checksums without artifacts (#7306) (@David-Uka)\n* 2a662ce09e733ca040ddc3029c428becef4b273d: fix(redact): avoid empty writes for buffered secret prefixes (#7301) (@David-Uka and @caarlos0)\n* 89fdc4036bb6133a08518369bf1ce760281c5dab: fix(telegram): use an HTML-escaped default message with parse_mode HTML (#7285) (@pcbeingused333 and @caarlos0)\n### Other work\n* fb186216f22b0dce0c9e95ee190a15dc5734afc5: chore(deps): update Go to 1.27.4 (#7296) (@caarlos0)\n* 33e401312a58d063e6e086dc54737db10d83a0bf: chore: auto-update generated files (#7297) (@goreleaserbot)\n* 6eedb82fdcb9f6a40d7e065e4c249ac2bc00f50b: chore: auto-update generated files (#7302) (@goreleaser[bot])\n\n**Full Changelog**: https://github.com/goreleaser/goreleaser/compare/v2.20.1...v2.20.2\n\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of some **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/), get a [Pro License](https://goreleaser.com/pro) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* Find examples and commented usage of all options in our [website](https://goreleaser.com/intro/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6), [Twitter](https://twitter.com/goreleaser), and [Telegram](https://t.me/goreleasernews)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>\n\n\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
