"gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":28456217,"digest":"sha256:b84ce9966dc8313edb935846431123b8a9d249eb7140a44783a1a45a5addcf5d","download_count":355,"created_at":"2026-11-11T01:40:28Z","updated_at":"2026-11-11T01:40:29Z"},{"id":733689684,"node_id":"RA_kwDOBJgEXs4ruzdU","name":"goreleaser_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":549023,"digest":"sha256:4017a31d00c4f1fc34659e01aabfe4ac5873ec0f90fa66a4eeb3d681faf5fdad","download_count":5,"created_at":"2026-11-11T01:40:43Z","updated_at":"2026-11-11T01:40:43Z"}],"body":"\n## Announcement\n\nRead the official announcement: [Announcing GoReleaser v2.20](https://goreleaser.com/blog/goreleaser-v2.20/).\n\n\n## Changelog\n### Security updates\n* 0b1b1fff41ab7113cdb6858ac45a1cf7f9bebc92: sec(git): redact URL credentials from diagnostics (#7294) (@caarlos0) ([GHSA-7qv4-9g3j-wvq8](https://github.com/goreleaser/goreleaser/security/advisories/GHSA-7qv4-9g3j-wvq8))\n* 9a037e1fd427402b52c117f0de38614972b909bb: sec(srpm): reject RPM macros in package versions (#7295) (@caarlos0) ([GHSA-rjp9-h7gp-wr7q](https://github.com/goreleaser/goreleaser/security/advisories/GHSA-rjp9-h7gp-wr7q))\n* fb9617b200efc33bb7fa63b5a2c005949fc5d566: sec: redact hook and chocolatey secrets from logs (#7293) (@caarlos0) ([GHSA-gvxm-cvj4-qwvp](https://github.com/goreleaser/goreleaser/security/advisories/GHSA-gvxm-cvj4-qwvp))\n### Bug fixes\n* 0946e5ed0111de64e577d16f6802e755c956e366: fix(aur): install every binary of the archive in the default package (#7284) (@lbarrosby)\n* 79c8d685b968bb083c73c2ed72ac8ede54d2192d: fix(client): defer SSH private-key expansion until publishing (#7273) (@caarlos0)\n* e46cd64808b1fde7d770b2ec64b80f052560c943: fix(docs): remove duplicate prebuilt redirects (@caarlos0)\n* 5f422b18d5245cbece678da34eefdb542e0a08f6: fix(ko): accept '..' as main path (#7279) (@mrueg)\n* a8f1c1ec8f3991588f8c41abf22eb5c80aeb740c: fix(ko): prefer remote base images and don't cache failed lookups (#7275) (@mrueg)\n* 3432e8d530ceeabf38edf26b5399006baad9f4e2: fix(mcp): retry publish when package version is not yet visible (#7283) (@santhiprakash)\n* 119f88f695dc34e4b6f04c34e22005955d5675f8: refactor(ko): simplify template handling (#7277) (@mrueg)\n### Documentation updates\n* 3286c23e755afa57959c32dda751a8b169736d97: docs: .ArtifactPath is not always an absolute path (#7289) (@ZainnQureshii)\n### Other work\n* ed8efe6a52def7b44443e0779021c3439b24ca5b: chore: auto-update generated files (#7274) (@goreleaserbot)\n\n**Full Changelog**: https://github.com/goreleaser/goreleaser/compare/v2.20.0...v2.20.1\n\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of some **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/), get a [Pro License](https://goreleaser.com/pro) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* Find examples and commented usage of all options in our [website](https://goreleaser.com/intro/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6), [Twitter](https://twitter.com/goreleaser), and [Telegram](https://t.me/goreleasernews)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>\n\n\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
