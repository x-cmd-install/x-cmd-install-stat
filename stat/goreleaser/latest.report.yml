:41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":28709166,"digest":"sha256:ef69177888fd7f4048a101f3cca8cc62a56b05b246201798fca5214304ba693d","download_count":1643,"created_at":"2026-11-20T04:31:00Z","updated_at":"2026-11-20T04:31:03Z"},{"id":770450567,"node_id":"RA_kwDOBJgEXs4t7CSH","name":"goreleaser_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":544439,"digest":"sha256:7909ff45d4c8b39536dd8d9fada470ef0b71e95f525bc8e8c9b18aa33a21c689","download_count":77,"created_at":"2026-11-20T04:31:17Z","updated_at":"2026-11-20T04:31:17Z"}],"body":"\n## Announcement\n\nRead the official announcement: [Announcing GoReleaser v2.20](https://goreleaser.com/blog/goreleaser-v2.20/).\n\n\n## Security\n\n* [GHSA-qx28-5g8c-9fw6](https://github.com/goreleaser/goreleaser/security/advisories/GHSA-qx28-5g8c-9fw6): the snapshot version was embedded unescaped in generated Homebrew and AUR package files, which could lead to code execution when loaded. Affects `>= 2.0.0, <= 2.20.2`; fixed in v2.20.3. Upgrade to v2.20.3 or later.\n\n## Changelog\n### Bug fixes\n* b2f1f2a3e93c30a0dda5907a222af91800241033: fix(archive): use the base name of the binary in formats: [binary] (#7320) (@lbarrosby)\n* 2cc6ec6c65db7e226f6bb1903e222df713e7ad6f: fix(aur): install a binary built in a subdirectory into /usr/bin (#7315) (@lbarrosby)\n* e60500110e1d63ef59f7d9c5f24919207f5cc3b2: fix(aur): only emit license in PKGBUILD when set (#7328) (@santhiprakash)\n* 8303feff5d161620e5798a6167fe680d3cb658ad: fix(ci): use GitHub App identity for generated commits (#7314) (@caarlos0)\n* adce72b330bfdc34b44b2b780f192c08202a9253: fix(deno): expose Go arch in the .Arch template field (#7322) (@amalsaidov)\n* 7b3d46c747bf6c8465810b02a70689fedf134cc7: fix(gitea): do not duplicate release assets on reruns (#7329) (@a3ylf)\n* 57bef7b78baaeeb6f15456c425f7debd75bd2d4c: fix(nix): add arm archives without goarm to the url and sha maps (#7323) (@ArnabDutta01)\n### Documentation updates\n* 336e935653f55c515240b4b10768ba7bf1d06c43: docs(ko): explain that KO_DOCKER_REPO replaces the repositories (#7327) (@mrueg)\n### Other work\n* 6d90a8a1121cb8ee0607ae729abdea3b318baf5d: Merge commit from fork (@caarlos0)\n* 8128d878e4130d223a65287924daf6baa9005f1d: chore: auto-update generated files (#7309) (@goreleaser[bot])\n* 79d734e59b7e75d7e95911767a47ca4870e179e4: chore: auto-update generated files (#7313) (@goreleaser[bot])\n* ca9ab1d96b7770e2c1a746dc63bbc97abde57bef: chore: auto-update generated files (#7321) (@goreleaser[bot])\n* 9fe2d2b83ab82ee7be291118ca0d99cb2e48f0b7: chore: auto-update generated files (#7330) (@goreleaser[bot])\n* 27688b0bca601098a0c8de49391f14628f9d2715: chore: auto-update generated files (#7331) (@goreleaser[bot])\n* a6edafaafe0fd15a4725e917beac26305ba67738: perf(ko): copy images to secondary repositories with a single pusher (#7324) (@mrueg)\n\n**Full Changelog**: https://github.com/goreleaser/goreleaser/compare/v2.20.2...v2.20.3\n\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of some **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/), get a [Pro License](https://goreleaser.com/pro) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* Find examples and commented usage of all options in our [website](https://goreleaser.com/intro/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6), [Twitter](https://twitter.com/goreleaser), and [Telegram](https://t.me/goreleasernews)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>\n\n\n\n","mentions_count":8}
