de_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27240249,"digest":"sha256:dbb3112f619c4827311b726b3c98047bce69af1ecee99984d55d450c04c471fc","download_count":1167,"created_at":"2026-09-05T22:23:13Z","updated_at":"2026-09-05T22:23:15Z"},{"id":546377354,"node_id":"RA_kwDOBJgEXs4gkQ6K","name":"goreleaser_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":550631,"digest":"sha256:052217f02e75e607cd8a77f2c04288aff76e27881bf1c2115f7eb9f6be1323d2","download_count":35,"created_at":"2026-09-05T22:23:27Z","updated_at":"2026-09-05T22:23:28Z"}],"body":"\n## Announcement\n\nRead the official announcement: [Announcing GoReleaser v2.18](https://goreleaser.com/blog/goreleaser-v2.18/).\n\n\n## Changelog\n### Security updates\n* 628c889d7f2a34066649833be419fdb9abe01174: sec(deps): bump golang.org/x/crypto and golang.org/x/mod (#6872) (@caarlos0)\n### Bug fixes\n* e38e2fdbaccdbcca5829666567c13f194d126112: fix(archive): report stripped binary paths (#6820) (@davicbtoliveira)\n* 315a4fdf835630e29c96d90460dfc74d67895c68: fix(aursources): clarify error and document source.enabled requirement (#6816) (@0jaspahwa)\n* b7f12392a12d8f07a27a81682f1dabe4ee1fac8d: fix(cask): deprecate url.verified (#6871) (@caarlos0)\n* 2c613deb92c0404d6f79bd4a5361ec45696deb13: fix(chocolatey): a skipped chocolatey entry stops the ones after it (#6853) (@hktitof)\n* 33cc3630f87fb3dd96fc2958bb756d9bbe1d18f3: fix(client): apply the commit config per command (#6852) (@caarlos0)\n* db7a1e6c6dcef3b64bd04e600ee89be6e5ca5c47: fix(client): stop TestGitLabRateLimitRetryAfter racing the clock (#6846) (@caarlos0)\n* c8126aff2a412d91eced253b993369091b47f264: fix(cmd): drop setup's unused return value (#6845) (@caarlos0)\n* d9510181e0e999536de2a3ac2d1e8afb146bb3aa: fix(docker): only use wheels of the configured ids (#6860) (@caarlos0)\n* 0a6f83e9a575f15d09cefb633a27f0f8a2f95390: fix(git): report repository detection errors (#6869) (@caarlos0)\n* edcfdec377860163720d03ac186f5ea523950167: fix(gitlab): own the retries, and honor replace_existing_artifacts (#6843) (@caarlos0)\n* f5edd7395693c0c6b501dc722d445d2e86af854d: fix(gomod): don't read the module path from stderr (#6864) (@caarlos0)\n* 35051e4a552b0e8ab8e93a7088aeb9eea745a15e: fix(sign): warn when the signer writes no file, fail in v3 (#6842) (@caarlos0)\n* e1a1e9c12120d168c27259cd5b3bad4ed8c8f67c: fix: map every 32-bit ARM variant to Termux's \"arm\" (#6857) (@dylanpulver)\n### Documentation updates\n* e5730eb35fe8c009da1351b54f4cb4770b3c64fe: docs: fix broken commands, dead links, and inaccurate options (#6841) (@caarlos0)\n### Other work\n* 8afe0bbaf7b981e5f526fb93364856aae30a2236: chore: auto-update generated files (#6811) (@goreleaserbot)\n* c1493d33a25b3b9c971f0c1ed9362375beeaaf48: chore: auto-update generated files (#6812) (@goreleaserbot)\n* 329444276458e817b2a26e61d839bbf690f32746: chore: auto-update generated files (#6861) (@goreleaserbot)\n* 6e408712b39222ebd7ac5a8dadd628852617bbb5: chore: update to Go 1.27.1 (#6859) (@caarlos0)\n* 4181c4f2bab6e2359bfd4dd97d2827d7e973c33f: perf(git): ask git once (#6850) (@caarlos0)\n* dcbe1176a0bec459682ca299dbc9fcb17477571e: perf(node): faster dist extraction, and stop leaking it into TMPDIR (#6844) (@caarlos0)\n* 36e43dd08f724956b188af2f6f3bcfd5efd355ec: perf: skip needless docker probes; make the ko registry test hermetic (#6827) (@caarlos0)\n\n**Full Changelog**: https://github.com/goreleaser/goreleaser/compare/v2.18.0...v2.18.1\n\n\n## Helping out\n\nThis release is only possible thanks to **all** the support of some **awesome people**!\n\nWant to be one of them?\nYou can [sponsor](https://goreleaser.com/sponsors/), get a [Pro License](https://goreleaser.com/pro) or [contribute with code](https://goreleaser.com/contributing).\n\n## Where to go next?\n\n* Find examples and commented usage of all options in our [website](https://goreleaser.com/intro/).\n* Reach out on [Discord](https://discord.gg/RGEBtg8vQ6), [Twitter](https://twitter.com/goreleaser), and [Telegram](https://t.me/goreleasernews)!\n\n<a href=\"https://goreleaser.com\"><img src=\"https://raw.githubusercontent.com/goreleaser/artwork/master/opencollective-header.png\" with=\"100%\" alt=\"GoReleaser logo\"></a>\n\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
