_kwDOAOsFPM4qW3x6","name":"firebase-tools-win.exe","label":"","uploader":{"login":"google-oss-bot","id":26440463,"node_id":"MDQ6VXNlcjI2NDQwNDYz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":254464946,"digest":"sha256:d3c9e09c6a7bb84f5de7ade36c56c7852b767870ad0723c43d30f7b97495ad8d","download_count":640,"created_at":"2026-11-04T19:23:26Z","updated_at":"2026-11-04T19:23:37Z"}],"body":"- Fixed high query latency on Linux in Data Connect PGlite emulator by enabling TCP_NODELAY on sockets. (#11402)\r\n- Fixed the emulators startup message showing 127.0.0.1 for the Emulator UI and Hub when they listen on 0.0.0.0; it now also prints the address they listen on. (#6222)\r\n- Fixed an issue on Windows where starting Java-based emulators (Firestore, Database, Pub/Sub, Storage) could open extra console windows or leave orphaned `java.exe` processes running after exit (#3871, #11261).\r\n- Updated the Crashlytics MCP `get_report` tool to dynamically validate report names via `listReports` and support optional time `granularity`"}
