_kwDOAOsFPM4r8v1A","name":"firebase-tools-win.exe","label":"","uploader":{"login":"google-oss-bot","id":26440463,"node_id":"MDQ6VXNlcjI2NDQwNDYz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":256731137,"digest":"sha256:44538ccd4be079bd46819aa052f747d19284547e238260d300f34b52a5ae0007","download_count":606,"created_at":"2026-11-11T23:53:46Z","updated_at":"2026-11-11T23:53:56Z"}],"body":"- Fixed Hosting commands failing when unable to ensure the Firebase Hosting API is enabled, logging a warning instead. (#11335)\r\n- Updated `firebase init hosting` and `firebase init hosting:github` to ensure the Firebase Hosting API is enabled during setup.\r\n- Added an optional `filterExpression` parameter to the Crashlytics MCP `list_events` tool to filter by custom keys.\r\n- Fixed Crashlytics filter validation rejecting web app version names without a build number.\r\n- Improved Auth emulator startup time by compiling validation schemas lazily. (#11176)\r\n- Updated the Firebase SQL Connect local toolkit to v3.4.26, which includes the following changes:\r\n  - Internal improvements and bug fixes.\r\n- Fixed the emulators startup message showing 127.0.0.1 for the Emulator UI and Hub when they listen on 0.0.0.0; it now also prints the address they listen on. (#6222)\r\n- Fixed a race condition across a second boundary during `accounts:signUp` in the Auth emulator where `validSince` could exceed `auth_time`. (#11413)\r\n- Added local machine config persistence to `appcheck:debugtokens:create`, `--local` support to `appcheck:debugtokens:list`, and `appcheck:debugtokens:prune` to clean up stale local debug tokens.\r\n- Fixed `database:import` failing with an unhandled promise rejection when a batch write fails.\r\n- Fixed emulator crashes when a Firestore rules reload or emulator HTTP handler throws."}
