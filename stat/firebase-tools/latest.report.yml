_kwDOAOsFPM4j4X6M","name":"firebase-tools-win.exe","label":"","uploader":{"login":"google-oss-bot","id":26440463,"node_id":"MDQ6VXNlcjI2NDQwNDYz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":259879821,"digest":"sha256:18dfac42a0110c8e7cf6a84a12320ce2913ef8b7b7afed9c860e3c78c41a5373","download_count":162,"created_at":"2026-09-30T23:11:56Z","updated_at":"2026-09-30T23:12:08Z"}],"body":"- Improved error message when billing is not enabled\r\n- Fixed a crash in `setEnqueuer` when deploying Cloud Tasks functions whose IAM policy has no bindings (#11184).\r\n- Updated dependencies to address security vulnerabilities, including `protobufjs`, `tar`, `@grpc/grpc-js`, `express`, `undici`, `hono`, `tmp`, and `form-data`.\r\n- Updated the Firebase SQL Connect local toolkit to v3.4.22, which includes the following changes:\r\n  - [fixed] Disallow using the GraphQL root operation type names (`Query`, `Mutation`, `Subscription`) as `@table` or `@view` types.\r\n- Added an optional step to configure Crashlytics email alerts during `crashlytics:onboard:web`.\r\n- Fixed `404` errors during `crashlytics:sourcemap:upload` when re-uploading a source map with the same obfuscated file path across different app versions"}
