{"id":372177944,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBO3GJs4WLvwY","tag_name":"v0.16.0","target_commitish":"main","name":"Version v0.16.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-18T07:51:34Z","updated_at":"2026-08-18T08:05:52Z","published_at":"2026-08-18T08:00:09Z","assets":[{"id":519135002,"node_id":"RA_kwDOBO3GJs4e8V8a","name":"papis-0.16.0-py3-none-any.whl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":314481,"digest":"sha256:174f639439a552b79a8fa3cf5e217beb433cd265b08dd7bedb020eb4df8cee83","download_count":7,"created_at":"2026-08-18T08:00:08Z","updated_at":"2026-08-18T08:00:08Z"},{"id":519135001,"node_id":"RA_kwDOBO3GJs4e8V8Z","name":"papis-0.16.0.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1323148,"digest":"sha256:a7ce419077bf50bd1db14618c0be971f325a0f331632d4729d5acf8239053c74","download_count":5,"created_at":"2026-08-18T08:00:08Z","updated_at":"2026-08-18T08:00:08Z"}],"body":"## Dependency Changes\r\n\r\n* Switched from [`pyparsing`](https://github.com/pyparsing/pyparsing) to [Lark](https://lark-parser.readthedocs.io) for query parsing.\r\n* Removed the [`isbnlib`](https://github.com/xlcnd/isbnlib) dependency. The library itself has not been maintained in a while. The new ISBN functionality is built-in with no additional dependencies. The supported services are (no plugins are supported): `goob`, `openl`, and `wiki`.\r\n\r\n## Features\r\n\r\n### Major: SQLite database backend ([#1007](https://github.com/papis/papis/pull/1007))\r\n\r\nPapis added a new database backend based on the built-in `sqlite3` database as an alternative to the `papis` backend (based on `pickle`) and the `whoosh` backend.\r\n\r\nThis new backend works similarly to the `whoosh` backend. To use it, you need to\r\n\r\n1. Set `database-backend = sqlite` in your configuration file (globally or per-library).\r\n2. Tinker with [sqlite](https://papis.readthedocs.io/en/latest/configuration.html#confval-sqlite-schema-fields) to add more fields you'd like to query.\r\n\r\nFrom preliminary testing, this backend seems to be quite fast, both for searching and caching. A quick benchmark on a library with about 2000 documents (and a query that returns about 15), the default `papis` backend gives\r\n```\r\n> hyperfine --warmup 3 -- 'papis list --all QUERY'\r\nBenchmark 1: papis list --all QUERY\r\n  Time (mean \u00b1 \u03c3):     322.8 ms \u00b1  20.8 ms    [User: 290.3 ms, System: 31.0 ms]\r\n  Range (min \u2026 max):   308.5 ms \u2026 379.1 ms    10 runs\r\n```\r\nand the `sqlite` backend gives\r\n```\r\nBenchmark 1: papis list --all QUERY\r\n  Time (mean \u00b1 \u03c3):      97.4 ms \u00b1  11.4 ms    [User: 81.1 ms, System: 15.3 ms]\r\n  Range (min \u2026 max):    79.7 ms \u2026 115.2 ms    27 runs\r\n```\r\n\r\nSee the [documentation](https://papis.readthedocs.io/en/latest/database_structure.html#sqlite-backend) for additional information and usage examples. In particular, regex support for this backend is rather limited.\r\n\r\n### Major: Improve query syntax ([#1165](https://github.com/papis/papis/pull/1165))\r\n\r\nHistorically, the query syntax when using `database-backend = papis` has been limited to using strings and key-value pairs. The new version gets it closer to that of the other backends, by adding support for `AND`, `OR` and `NOT` boolean operators, as well as grouping using parentheses. This allows constructing complex queries for searching your libraries.\r\n\r\nIt generally looks as expected:\r\n```bash\r\n# find documents with either one of the two authors\r\npapis open 'author:einstein OR author:bohr'\r\n# find papers referencing physics, but not Einstein\r\npapis open 'physics NOT author:einstein'\r\n# find Einstein's paper from some years\r\npapis open 'author:einstein AND (year:1905 OR year:1915)'\r\n# use regex to match the beginning of a title\r\npapis open 'title:^Quantum'\r\n```\r\n\r\nNote that this new query syntax still uses the [`match-format`](https://papis.readthedocs.io/en/latest/configuration.html#confval-match-format) configuration setting for free-form terms in the query (i.e. ones not using a `key:value` format).\r\n\r\n### Major: Improve `mv` command ([#1104](https://github.com/papis/papis/pull/1104)) and remove `rename` ([#1196](https://github.com/papis/papis/pull/1196))\r\n\r\nThe `mv` command has been completely rewritten with many new features (see the [docs](https://papis.readthedocs.io/en/latest/commands/mv.html)). It now works similarly to the Unix `mv` command for moving document folders:\r\n\r\n- if the target folder already exists, the document's folder is moved *into* it (e.g. `papis mv --to existing-folder query` places the document at `existing-folder/<doc-folder>`);\r\n- if the target does not exist, the document is renamed to that name. \r\n\r\nWhen no target folder is given, it defaults to the [`add-folder-name`](https://papis.readthedocs.io/en/latest/configuration.html#confval-add-folder-name) pattern, which means `papis mv query` now does everything that `papis rename` used to do. The new `--to` flag also accepts formatting patterns (e.g. `papis mv --to \"{doc[year]}\" query`). The command can now move documents between libraries by specifying a target library.\r\n\r\nThe new command performs pre-flight checks on all planned moves before touching any files. Issues such as duplicate target paths, nesting a document inside another document's folder, or missing source folders are warned about upfront. The user can abort, skip problematic moves, or fix collisions interactively. A new `--batch` flag allows skipping all interactive prompts.\r\n\r\n### Minor: `papis update` can rename files ([1108](https://github.com/papis/papis/pull/1108))\r\n\r\nThe `papis update` command has been reworked quite extensively and has some new interesting functionality (see the [docs](https://papis.readthedocs.io/en/latest/commands/update.html)). First,\r\nupdating document files will also rename these files on disk. For example, running\r\n```bash\r\npapis update --set files 0:my-new-file.pdf QUERY\r\n```\r\nwill change the first file in the document to `my-new-file.pdf` and rename it on disk from its previous name. This also applies to `notes` in the document.\r\n\r\nSecond, we can also reset certain values to their defaults (as defined in the configuration file). For example, to update some document references according to `ref-format`, use\r\n```bash\r\npapis update --all --reset ref QUERY\r\n```\r\nfor a bulk operation. This can also be applied to `author`, `files`, and `notes`.\r\n\r\n## Other noteworthy features\r\n\r\n- Vendored parts from `isbnlib` ([#1102](https://github.com/papis/papis/pull/1102)).\r\n- Add a CSV exporter ([#1172](https://github.com/papis/papis/pull/1172)).\r\n- Match directories to libraries if possible ([#1179](https://github.com/papis/papis/pull/1179)).\r\n- Remove undocumented `dirs` option (only allow one `dir` per library) ([#1182](https://github.com/papis/papis/pull/1182)). \r\n- Do not add \"empty\" values into the document ([#1192](https://github.com/papis/papis/pull/1192)).\r\n- Move `papis doctor` checks to `papis.doctor` ([#1200](https://github.com/papis/papis/pull/1200)).\r\n- Derive `author_list` from a flat `author` when creating a new document ([#1202](https://github.com/papis/papis/issues/1202)).\r\n- Improve error reporting from git failures ([#1204](https://github.com/papis/papis/pull/1204)).\r\n- Add a downloader for [NBER](https://www.nber.org/) working papers ([#1218](https://github.com/papis/papis/pull/1218)).\r\n\r\n## Bug Fixes\r\n\r\n- Better matching initials in `string-cleaner` doctor check ([#1134](https://github.com/papis/papis/pull/1134)).\r\n- The YAML exporter now starts each document with an explicit `---` marker, so that `papis export --format yaml --append` produces a valid multi-document file ([#1038](https://github.com/papis/papis/issues/1038)).\r\n- Detect `article-number` in more journals ([#1152](https://github.com/papis/papis/pull/1152)).\r\n- Fix database caching with multiple libraries ([#1195](https://github.com/papis/papis/pull/1195)).\r\n- Fix crash in `papis add` when a given file path contains spaces (the DOI importer no longer tries to resolve local paths on doi.org) ([#1201](https://github.com/papis/papis/issues/1201)).\r\n- Skip local paths when matching DOIs ([#1203](https://github.com/papis/papis/pull/1203)).\r\n- Fix extra separators when joining single-name authors ([#1229](https://github.com/papis/papis/pull/1229)).","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
