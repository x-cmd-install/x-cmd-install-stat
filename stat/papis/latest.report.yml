ors ([#988](https://github.com/papis/papis/pull/998)).\n* Handle errors from the editor in `papis add --edit` ([1211](https://github.com/papis/papis/pull/1211)).\n* Fix saving in wrong citation file ([#1215](https://github.com/papis/papis/pull/1215)).\n* Fix CSL export for some styles ([#1231](https://github.com/papis/papis/pull/1231)).\n"}
