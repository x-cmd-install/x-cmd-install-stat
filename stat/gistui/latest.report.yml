 pin baseline rules across upload, download, create, diff, and restore by @akunzai in https://github.com/akunzai/gistui/pull/468\n* Tell which side of a pin changed from a two-sided sync baseline by @akunzai in https://github.com/akunzai/gistui/pull/470\n* Fetch a gist file's exact content, without an added final newline by @akunzai in https://github.com/akunzai/gistui/pull/472\n* Default a pin's missing gist_filename to the local file name by @akunzai in https://github.com/akunzai/gistui/pull/474\n* Clear the screen history when a gist create fails by @akunzai in https://github.com/akunzai/gistui/pull/480\n* Say why a gist can't be created from a non-UTF-8 file name by @akunzai in https://github.com/akunzai/gistui/pull/481\n* Keep a gist change's screen until it finishes, and stop pretending to cancel it by @akunzai in https://github.com/akunzai/gistui/pull/482\n* Keep the upload redact buffer private, and fix launching editors on Windows by @akunzai in https://github.com/akunzai/gistui/pull/483\n* Give the settings one preferences struct and one field list by @akunzai in https://github.com/akunzai/gistui/pull/485\n* Edit config.toml in place instead of rewriting it by @akunzai in https://github.com/akunzai/gistui/pull/486\n### \ud83d\udcda Documentation\n* docs: require a description when creating a version milestone by @akunzai in https://github.com/akunzai/gistui/pull/458\n* Add a light/dark theme toggle to the landing page by @akunzai in https://github.com/akunzai/gistui/pull/459\n\n\n**Full Changelog**: https://github.com/akunzai/gistui/compare/v0.21.0...v0.22.0","mentions_count":1}
