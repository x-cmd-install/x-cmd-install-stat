ent scratch dirs colliding on one temp path by @akunzai in https://github.com/akunzai/gistui/pull/442\n* fix: normalize CRLF/CR line endings before diffing by @akunzai in https://github.com/akunzai/gistui/pull/455\n### \ud83d\udcda Documentation\n* docs: upgrade self-reflection to tiered model and move design doc to docs/agents by @akunzai in https://github.com/akunzai/gistui/pull/437\n* docs: align Prevent Recurrence and Claude compatibility in AGENTS.md by @akunzai in https://github.com/akunzai/gistui/pull/439\n* docs: add agent verification and pull request conventions by @akunzai in https://github.com/akunzai/gistui/pull/440\n* Expand issue tracker conventions and settle the PR title rule by @akunzai in https://github.com/akunzai/gistui/pull/441\n* Standardize agent pointers and restore verification guarantee by @akunzai in https://github.com/akunzai/gistui/pull/444\n* Standardize path pointers across agent docs and doc comments by @akunzai in https://github.com/akunzai/gistui/pull/445\n* Record capture UI locale and drop CLAUDE.md by @akunzai in https://github.com/akunzai/gistui/pull/452\n### \u2b06\ufe0f Dependencies\n* chore: bump toml from 1.1.4+spec-1.1.0 to 1.1.5+spec-1.1.0 by @dependabot[bot] in https://github.com/akunzai/gistui/pull/438\n* chore: bump dirs from 6.0.0 to 7.0.0 by @dependabot[bot] in https://github.com/akunzai/gistui/pull/448\n* chore: bump ureq from 3.4.0 to 3.4.1 by @dependabot[bot] in https://github.com/akunzai/gistui/pull/449\n* chore: bump toml from 1.1.5+spec-1.1.0 to 1.1.6+spec-1.1.0 by @dependabot[bot] in https://github.com/akunzai/gistui/pull/450\n* chore: bump clap from 4.6.6 to 4.6.7 by @dependabot[bot] in https://github.com/akunzai/gistui/pull/453\n* chore: bump ureq from 3.4.1 to 3.4.2 by @dependabot[bot] in https://github.com/akunzai/gistui/pull/454\n### \ud83e\uddf0 Maintenance\n* Restore the rule against PII in pull request attachments by @akunzai in https://github.com/akunzai/gistui/pull/443\n* fix(docs): drop affected paths from the PR technical trailer, add lessons learned by @akunzai in https://github.com/akunzai/gistui/pull/446\n* fix(docs): actually commit the native template change by @akunzai in https://github.com/akunzai/gistui/pull/447\n* docs(pull-request): warn about Mermaid path-param and newline gotchas by @akunzai in https://github.com/akunzai/gistui/pull/451\n\n\n**Full Changelog**: https://github.com/akunzai/gistui/compare/v0.20.0...v0.21.0","mentions_count":2}
