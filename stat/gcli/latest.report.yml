{"id":430663850,"author":{"login":"herrhotzenplotz","id":34663024,"node_id":"MDQ6VXNlcjM0NjYzMDI0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOGLyhHc4Zq2iq","tag_name":"v2.14.0","target_commitish":"releases/2.14","name":"Version 2.14.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-01T15:09:02Z","updated_at":"2026-11-01T15:15:37Z","published_at":"2026-11-01T15:15:37Z","assets":[],"body":"I am pleased to announce version 2.14.0 of gcli.\n\nBelow you can find the changelog for this version.\n\nTarballs can be downloaded from\n\n\thttps://herrhotzenplotz.de/gcli/releases/gcli-2.14.0/\n\nPlease note that I do not support the auto-generated release tarballs\nfrom GitHub and Gitlab.\n\nA big thank you for all the bug reports and suggestions!\n\nPlease test and report bugs!\n\n## Community and discussions\n\n - Join the IRC: #gcli on Libera.Chat\n - Or post to the mailing list: ~herrhotzenplotz/gcli-disuss@lists.sr.ht\n\n# Changelog\n\n## Fixed\n\n- A few issues regarding 32-bit platforms have been fixed in the table printing code.\n\n  Reported-by: Simon Richter\n\n- The configure script now sends both an xtrace and various messages to config.log.\n\n  When configure fails, one can inspect this log file to check for obvious errors and failures of commands.\n\n  Requested-by: Simon Richter\n\n## Added\n\n- The `repos` subcommand now has an action `view` to show the README of a given repository.\n\n  This action is currently only implemented for GitLab and GitHub, Gitea/Forgejo support is planned.\n\n  Suggested by: Dmitry Atamanov <https://github.com/data-man>\n\n- The gcli user configuration file now supports environment variable value expansion:\n\n  ```\n  defaults {\n      \teditor = env:EDITOR\n  }\n  ```\n\n  There are plans to add command expansion as well.\n\n  Suggested by: Sandro Santilli\n\n## Changed\n\n- Actions on subcommands that do not print anything to stdout now do not cause empty lines to be printed when they are chained in a subcommand. E.g.:\n\n  ```\n  $ gcli issues -i 42 labels add foobar milestone 123456\n  ```\n\n  This would previously have printed an empty line, now it doesn't anymore.\n"}
