{"id":365669921,"author":{"login":"herrhotzenplotz","id":34663024,"node_id":"MDQ6VXNlcjM0NjYzMDI0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOGLyhHc4Vy64h","tag_name":"v2.13.0","target_commitish":"releases/2.13","name":"Version 2.13.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-05T16:33:13Z","updated_at":"2026-08-05T16:35:46Z","published_at":"2026-08-05T16:35:46Z","assets":[],"body":"# Version 2.13.0\n\nI am pleased to announce version 2.13.0 of gcli.\n\nBelow you can find the changelog for this version.\n\nTarballs can be downloaded from\n\n\thttps://herrhotzenplotz.de/gcli/releases/gcli-2.13.0/\n\nAuto-generated release tarballs from GitHub and Gitlab are **unsupported**!\n\nA big thank you for all the bug reports and suggestions!\n\nPlease test and report bugs!\n\n## IMPORTANT NOTE FOR PACKAGERS\n\nPlease review the configure options and dependencies!\n\nThe configure script emits warnings in the summary.\n\ngcli's test suite does NOT depend on Kyua and ATF-C anymore and uses Perl.\nPlease verify that the test suite is actually enabled.\nIt depends on TAP::Harness (>= 3.48) which comes with recent Perl ootb.\nThe configure scripts tests for this and enables the test suite only if the requirements are met to prevent random test failures.\n\n## Community and discussions\n\n - Join the IRC: #gcli on Libera.Chat\n - Or post to the mailing list: ~herrhotzenplotz/gcli-discuss@lists.sr.ht\n\n## Changelog\n\n### Fixed\n\n- Parsing of integer arguments on the CLI have been fixed\n\n  Specifically, this concerns the following edge cases where:\n\n  - `-n <count>` was truncated due to conversion to long integers\n  - `-i <id>` caused an arithmetic overflow due to converting a negative integer to an unsigned integer\n\n  This only occured when the user provided such illegal values and thus caused the bug.\n\n  Reported-by: Sulev-Madis Silber\n\n- A crash that occured when trying to print a non-existant Bugzilla attachment has been fixed\n\n  Reported-by: Sulev-Madis Silber\n\n- The manual page `gcli-status(1)` has been fixed and was updated to reflect the current behaviour\n\n- A crash when creating a repo on GitHub without specifying a description has been fixed.\n\n  Reported-by: Sandro Santilli\n\n- Modifying labels attached to issues and pull requests on Gitea has been fixed\n\n  Previously this silently failed.\n\n  Reported-by: Michael Niedermayer\n\n### Added\n\n- The `attachments` subcommand gained support for creating Bugzilla attachments as well as marking them as obsolete\n\n- A new manual page `gcli-attachments(1)` has been added documenting the options of this subcommand.\n\n  The `gcli(1)` manual page has been updated and references the new manual page as well.\n\n- It is now possible to search for repositories via the `gcli repos` subcommand.\n\n  Search keywords are taken as is after the subcommand:\n\n\tgcli repos foo bar baz\n\n  This would search for `foo bar baz`.\n\n  Suggested by: Dmitry Atamanov <https://github.com/data-man>\n\n### Changed\n\n- `gcli labels` now includes inherited labels from the organisation for Gitea\n\n- When performing actions on a repository via `gcli repos` it is now mandatory to specify both the owner and the repository name via `-o` and `-r` respectively.\n"}
