f255e6f1fb582025cc8040449eb2ee2ddf81609a27b8d3ef166947cd93267d72","download_count":13,"created_at":"2026-09-21T13:49:31Z","updated_at":"2026-09-21T13:49:33Z"}],"body":"# 4.26.0\r\n\r\nYou can now create/delete sections on the fly.\r\nPress <kbd>ctrl+s</kbd> to enter the \"section mode\" and then either <kbd>n</kbd> to create a new section or <kbd>x</kbd> to delete it.\r\nThis makes doing ad-hoc quering much more ergonomic.\r\n\r\n---\r\n\r\nTo update run:\r\n```bash\r\ngh extension upgrade dash\r\n```\r\n\r\n## Changelog\r\n### New Features\r\n* c6dfbc17edfdbf1060fc06efe6aabb34f6a725f0: feat: ability to add/delete scratch sections (#962) (@dlvhdr)\r\n* 7e140818c139633c4700d55a35947f6b948d6902: feat: make header smaller (#960) (@dlvhdr)\r\n### Documentation updates\r\n* 4ea7c39fbe4d12dbbd66398253fbd81b61073e06: docs(enhance): repo mode (#944) (@dlvhdr)\r\n### Other work\r\n* 292be713279b177a0e2f9b344149fec11a94241e: ci: remove dependabot (#935) (@dlvhdr)\r\n\r\n---\r\n\r\nIf you enjoy `dash`, consider [making a donation](https://www.gh-dash.dev/donating) \u2764\ufe0f\r\n\r\nHave questions? Join our [Discord community](https://discord.gg/SXNXp9NctV)!\r\n\r\n<br />\r\n\r\n<a  class=\"underline: none;\" href=\"https://gh-dash.dev\">\r\n  <picture>\r\n    <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://gh-dash.dev/logo.png\">\r\n    <img alt=\"DASH Logo\" width=\"600\" src=\"https://gh-dash.dev/logo-light.png\">\r\n  </picture>\r\n</a>\r\n\r\n","mentions_count":1}
