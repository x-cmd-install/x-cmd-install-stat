":"2026-09-23T01:59:40Z"},{"id":582728223,"node_id":"RA_kwDOQsAlPs4iu7of","name":"dotstate-aarch64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":65,"digest":"sha256:fd7885819c9e92ef75ac6be2031031118eb0adfa3535c7cdc60aa5abc78f2139","download_count":0,"created_at":"2026-09-23T01:59:39Z","updated_at":"2026-09-23T01:59:39Z"},{"id":582726124,"node_id":"RA_kwDOQsAlPs4iu7Hs","name":"dotstate-x86_64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":8254387,"digest":"sha256:e26cbc8d46d94ca53bae9744dd02f34ceac833bfea7f52ccc842b939cb953716","download_count":1,"created_at":"2026-09-23T01:58:05Z","updated_at":"2026-09-23T01:58:06Z"},{"id":582726123,"node_id":"RA_kwDOQsAlPs4iu7Hr","name":"dotstate-x86_64-apple-darwin.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":65,"digest":"sha256:9e432b33c8d551d61259fb82a6824aad7f60cc65ae30ee4e1cdc6cd37839ddd3","download_count":0,"created_at":"2026-09-23T01:58:05Z","updated_at":"2026-09-23T01:58:05Z"},{"id":582728027,"node_id":"RA_kwDOQsAlPs4iu7lb","name":"dotstate-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9708844,"digest":"sha256:310e06346f365defe69f8fc9207563618a27fc91bf5cfae276003a6c602fa506","download_count":6,"created_at":"2026-09-23T01:59:31Z","updated_at":"2026-09-23T01:59:32Z"},{"id":582728028,"node_id":"RA_kwDOQsAlPs4iu7lc","name":"dotstate-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":65,"digest":"sha256:fedc3c28829b1a9aa66d5af6f3b7917f32be3657b0aef5fccd25734a2bd3cd47","download_count":0,"created_at":"2026-09-23T01:59:31Z","updated_at":"2026-09-23T01:59:31Z"}],"body":"**Full Changelog**: https://github.com/serkanyersen/dotstate/compare/v0.4.0...v0.4.1\r\n\r\n## [0.4.1] - 2026-09-22\r\n\r\n### Added\r\n\r\n- **CLI**: `dotstate --skill` prints a built-in agent skill (SKILL.md) that teaches AI agents DotState's concepts and commands. `dotstate --skill --install` installs it to `~/.claude/skills/dotstate/`.\r\n- **CLI**: `add` and `remove` accept `-y/--yes` to skip the confirmation prompt.\r\n- **Omarchy**: `dotstate omarchy --install` adds DotState to the Omarchy app launcher with an icon and a floating window. It supports both Omarchy 3 (`hyprland.conf`) and Omarchy 4 Quattro (`hyprland.lua`). `--uninstall` removes everything it added.\r\n\r\n### Changed\r\n\r\n- **Dependencies**: `dirs` 6 -> 7 (#58). Require ratatui 0.30.2 and replace the deprecated `Cell::set_skip` with `set_diff_option`, which was failing CI under `-D warnings`.\r\n- **Build**: `Cargo.lock` is now committed, so CI and `cargo install --locked` build with pinned dependency versions.\r\n\r\n### Fixed\r\n\r\n- **Doctor**: Report tracked symlinks whose storage file is missing (#59). Doctor used to compare only the recorded link path, so a dangling `~/.bashrc` showed as healthy. It now follows each link and lists the broken files as errors.\r\n- **Sync**: Fixed sync reliability with the git rebase workflow. Sync no longer fails with \"conflicts prevent checkout\" when the local branch is ahead of the remote, a failed rebase no longer leaves the storage repo on a detached HEAD, and sync no longer creates empty \"Update dotfiles\" commits.\r\n\r\n---\r\n\r\n## [0.4.0] - 2026-05-30\r\n\r\n### Added\r\n\r\n- **Git**: Support for repositories using the SHA-256 object format (#35). DotState previously failed to open them with \"unknown object format sha256\". Enabled via git2 0.21's experimental `unstable-sha256` feature; SHA-256 hashing is routed through thread-safe vendored OpenSSL (`https` feature). When you add a local SHA-256 repo during setup, a confirmation popup warns that support is experimental and asks you to confirm before proceeding, and `doctor` flags already-configured SHA-256 repos.\r\n\r\n### Changed\r\n\r\n- **Dependencies**: Upgraded `git2` from 0.20 to 0.21. Adapted to its API changes (`Remote::url`, `Reference::name`, and `StatusEntry::path` now return `Result` instead of `Option`).\r\n"}
