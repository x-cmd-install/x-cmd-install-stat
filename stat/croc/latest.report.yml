ommand by @Kernel-Hunter in https://github.com/schollz/croc/pull/1434\r\n* fix: return an error for a bad --throttleUpload and apply large limits exactly by @Kernel-Hunter in https://github.com/schollz/croc/pull/1435\r\n* build(deps): bump docker/login-action from 4.6.0 to 4.8.0 by @dependabot[bot] in https://github.com/schollz/croc/pull/1433\r\n* fix: include the digit 9 in GenerateRandomPin by @Kernel-Hunter in https://github.com/schollz/croc/pull/1438\r\n* fix: match --git ignore patterns against relative paths by @b84330808 in https://github.com/schollz/croc/pull/1437\r\n* chore: update deps by @schollz in https://github.com/schollz/croc/pull/1439\r\n* docs: add CrocApp to the community desktop apps by @bakirgdev in https://github.com/schollz/croc/pull/1440\r\n* ci: setup-go with go-version-file by @zdiff in https://github.com/schollz/croc/pull/1442\r\n* fix: preserve received empty file permissions by @pcbeingused333 in https://github.com/schollz/croc/pull/1444\r\n* feat: count received bundle bytes in TotalSent by @bakirgdev in https://github.com/schollz/croc/pull/1427\r\n* feat: add Prompt option for library users by @bakirgdev in https://github.com/schollz/croc/pull/1449\r\n* fix: skip NTFS junctions when sending a folder by @b84330808 in https://github.com/schollz/croc/pull/1450\r\n* fix: align web tests with send files label by @schollz in https://github.com/schollz/croc/pull/1451\r\n\r\n## New Contributors\r\n* @Kernel-Hunter made their first contribution in https://github.com/schollz/croc/pull/1434\r\n* @b84330808 made their first contribution in https://github.com/schollz/croc/pull/1437\r\n* @bakirgdev made their first contribution in https://github.com/schollz/croc/pull/1440\r\n* @pcbeingused333 made their first contribution in https://github.com/schollz/croc/pull/1444\r\n\r\n**Full Changelog**: https://github.com/schollz/croc/compare/v11.6.5...v11.6.6","reactions":{"total_count":8,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":1,"e