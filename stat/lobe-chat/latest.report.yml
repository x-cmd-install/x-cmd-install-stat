{"id":416207782,"author":{"login":"lobe-tsukumo[bot]","id":331164965,"node_id":"BOT_kgDOE70tJQ","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJlox884YztOm","tag_name":"v2.2.20","target_commitish":"49204982cab98bfa2f2fb6831a34d5018a2af6be","name":"\ud83d\ude80 Release v2.2.20","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-18T03:11:49Z","updated_at":"2026-10-18T03:18:40Z","published_at":"2026-10-18T03:18:40Z","assets":[],"body":"## \ud83d\udce6 Release v2.2.20\n\nThis release was automatically published from PR #21078.\n\n### Changes\nSee PR description: https://github.com/lobehub/lobehub/pull/21078\n\n### Commit Message\n# \ud83d\ude80 LobeHub Release (20261018)\n\n**Release Date:** October 18, 2026  \n**Since v2.2.19:** 419 merged PRs \u00b7 14 contributors\n\n> Agents now reach further across your devices, and the app opens faster. Topics, documents and device data load from local copies first, and server runs can use models that only exist on your device.\n\n---\n\n## \u2728 Highlights\n\n- **Goals with batch rollout** \u2014 A goal stays a draft until you start it, and a Goal can roll out one repeated task in batches. Each batch stops at a decision gate for the owner to review. (#20840, #20704, #20917, #20833)\n- **Widgets & dashboards** \u2014 Home and project dashboards, an agent widget tool, chat previews, and new `lh widget` / `lh dashboard` commands. (#20421, #20771)\n- **LLM relay to your device** \u2014 Server-side runs, preset tasks, model lists and Ollama downloads can now use models that are only available in your browser tab or desktop app. (#20453, #20454, #20455, #20456, #20457)\n- **Remote terminals & device maintenance** \u2014 Open interactive shells on connected devices from the web, and update or restart CLI daemons from device settings. (#20600, #20527, #20528)\n- **Local-first loading** \u2014 Topics, agent documents, devices, git status and home recents load from local replicas first, so pages show content before the network responds. (#20449, #20869, #20838, #20841, #20851)\n- **Agent document folders** \u2014 Folders, batch moves, documents as parents, and sorting by name, created or modified time. (#20761, #20926)\n- **Memory from your materials** \u2014 Memory can extract rules from pasted text, files, documents and conversations. (#20266)\n- **Fork from a reply** \u2014 Start a new topic from any assistant message. (#20610)\n\n---\n\n## \ud83c\udfd7\ufe0f Core Agent & Architecture\n\n- Sub-agents run through the parent's executor, and `afterToolCall` controls can gate tool results. (#20446, #20297)\n- Skills selected in the composer or CLI are injected on server runs. Adding an agent installs the Market skills it references. (#20961, #21059)\n- Agent-to-agent messages now show which agent sent them. (#20548)\n- Fewer repeated device and Market lookups on each send, and project sends appear right away. (#20465, #20897, #20628)\n\n## \ud83d\udcf1 Platforms / Integrations\n\n- **Heterogeneous agents:** DeepSeek Harness adapter. Codex app-server can run on connected devices (behind Labs). Codex user messages can be edited and resent. Codex and Pi can use any tool-capable LobeHub model. Droid and OpenCode support server-default models. (#18333, #20820, #20467, #20612, #20965, #20963)\n- **Desktop:** Bundled Computer Use app on macOS, guided macOS privacy permissions, Dock menu with running topics, tab drag with pin/unpin, and instant topic switching. (#20780, #20932, #20635, #20650, #21001)\n- **Models:** Claude Haiku 5.5, fal H3 Max and Seedance 2.5 video. (#20517, #20210)\n- **OpenAPI:** Async IM channel and push-token REST resources. (#20440)\n\n## \ud83d\udda5\ufe0f CLI & User Experience\n\n- Tasks: archiving, creating tasks from Kanban columns, and creating or searching tasks from the command menu. (#20990, #21020, #21000, #21002)\n- Sidebar topics can be grouped by device, time, status or agent within a project. (#20811, #20592, #20715)\n- Projects can have a logo, and the trash can be filtered by project. (#20641, #20739)\n- `lh connect --auv` offers Computer Use, and `lh connect service install` accepts `--workspace`. (#20983, #20818)\n- Settings search ranks results better and handles IME input. (#20620)\n\n## \ud83d\udd12 Security & Reliability\n\n- **Security:** Desktop can require security updates and checks the first launch of Canary builds. Credentials are collected through a secure form. nodemailer is updated to ^9.1.1. (#20168, #20469, #20338)\n- **Reliability:** OAuth no longer goes through email validation, and replicas ignore hydrates and errors that arrive late. (#20545, #20754)\n\n---\n\n## \ud83d\udc65 Contributors\n\nHuge thanks to **14 contributors** who shipped **419 merged PRs** this cycle.\n\n@mise42 \u00b7 @0genlab \u00b7 @arvinxx \u00b7 @tjx666 \u00b7 @Rdmclin2 \u00b7 @Innei \u00b7 @Neko \u00b7 @AmAzing129 \u00b7 @ImSingee \u00b7 @LiJian \u00b7 @MarioJames \u00b7 @cy948 \u00b7 @sudongyuer \u00b7 @lobehub-coder\n\nPlus renovate[bot] for maintenance.\n\n---\n\n**Full Changelog**: v2.2.19...release/weekly-20261018\n\n","mentions_count":14}
