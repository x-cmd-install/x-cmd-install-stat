ac5dd74ede510b31d6b9690769d1a6268cf058cc825f72","download_count":6557,"created_at":"2026-09-03T16:30:17Z","updated_at":"2026-09-03T16:30:17Z"}],"body":"### About\r\n\r\njj is a Git-compatible version control system that is both simple and powerful. See\r\nthe [installation instructions](https://docs.jj-vcs.dev/v0.45.1/install-and-setup/) to get started.\r\n\r\n### Release highlights\r\n\r\nThis release fixes an error that prevented the new jj-core crate from being\r\npublished. See the [release notes for v0.45.0](https://github.com/jj-vcs/jj/releases/tag/v0.45.0) for more changes since v0.44.0.\r\n\r\n### Fixed bugs\r\n\r\n* Building without `Cargo.lock` (e.g. `cargo install jj-cli`) works again\r\n  after all versions of the `bisync` crate, a transitive dependency of gix,\r\n  were yanked.\r\n\r\n* Signatures on commits in SHA-256 Git repositories are now stored under the\r\n  `gpgsig-sha256` header, as Git does, so Git recognizes them as signed and\r\n  jj can read them back.\r\n\r\n### Contributors\r\n\r\nThanks to the people who made this release happen! This list includes the contributors to v0.45.0.\r\n\r\n* Aaron Bies (@slerpyyy)\r\n* aaronabbott (@aabmass)\r\n* Alexander Chen (@alexuser)\r\n* Austin Seipp (@thoughtpolice)\r\n* Baptiste Girardeau (@baptiste0928)\r\n* Caleb White (@calebdw)\r\n* Daniel Danner (@dnnr)\r\n* David Rieber (@drieber)\r\n* Ga\u00ebtan Lehmann (@glehmann)\r\n* Gasper Stukelj (@mirkomartn)\r\n* hexbinoct (@hexbinoct)\r\n* Joseph Lou (@josephlou5)\r\n* Keane Nguyen (@keanemind)\r\n* LOG (@logarithmone1128)\r\n* Martin von Zweigbergk (@martinvonz)\r\n* OlshaMB (@OlshaMB)\r\n* Philip Metzger (@PhilipMetzger)\r\n* Priyanka Mandloi (@pmandloi28)\r\n* Remo Senekowitsch (@senekor)\r\n* Riccardo Mazzarini (@noib3)\r\n* Scott Sudharsan (@scott2000)\r\n* sofia (@badp)\r\n* Stephen Jennings (@jennings)\r\n* Vaghinak Vardanyan (@vaghinak-vardanyan)\r\n* Vincent Ging Ho Yim (@cenviity)\r\n* Wang Yuantao (@0WD0)\r\n* Yuya Nishihara (@yuja)","reactions":{"total_count":15,"+1":2,"-1":0,"laugh":2,"hooray":7,"confused":0,"heart":2,"rocket":0,"eyes":2},"mentions_count":27}
