"2026-10-07T21:33:24Z"},{"id":619862952,"node_id":"RA_kwDOEzi53M4k8luo","name":"jj-v0.46.0-docs-html.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1975128,"digest":"sha256:b1ab31eaf8bee3ee2bec92c1c1c420b073d184b8f102d460f6994c07439a1fa2","download_count":7,"created_at":"2026-10-07T21:28:51Z","updated_at":"2026-10-07T21:28:52Z"},{"id":619877508,"node_id":"RA_kwDOEzi53M4k8pSE","name":"jj-v0.46.0-x86_64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":10721091,"digest":"sha256:10d941de276c7c5074ef5d395312813b4575f4ce92cb9c0b05738efb90bd3b60","download_count":8,"created_at":"2026-10-07T21:36:03Z","updated_at":"2026-10-07T21:36:04Z"},{"id":619879226,"node_id":"RA_kwDOEzi53M4k8ps6","name":"jj-v0.46.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":10233241,"digest":"sha256:c42316b10df04611bc65029a18bcb2d92636edddb6871d511f7bb4233e999b83","download_count":155,"created_at":"2026-10-07T21:36:45Z","updated_at":"2026-10-07T21:36:46Z"},{"id":619869961,"node_id":"RA_kwDOEzi53M4k8ncJ","name":"jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":11110358,"digest":"sha256:fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08","download_count":286,"created_at":"2026-10-07T21:32:21Z","updated_at":"2026-10-07T21:32:22Z"}],"body":"### About\r\n\r\njj is a Git-compatible version control system that is both simple and powerful. See\r\nthe [installation instructions](https://docs.jj-vcs.dev/v0.46.0/install-and-setup/) to get started.\r\n\r\n### Release highlights\r\n\r\n* Jujutsu can now colocate workspaces besides the default one by creating Git\r\n  worktrees. Use `jj workspace add --[no-]colocate` and the setting\r\n  `git.colocate` to control this.\r\n\r\n### Breaking changes\r\n\r\n* The minimum supported `git` command version is now 2.42.0, up from 2.41.0.\r\n  `jj workspace add` uses `git worktree add --orphan`, which was added in\r\n  2.42.0.\r\n\r\n* The minimum supported Rust version (MSRV) is now 1.97.1.\r\n\r\n* `jj bisect run` now runs some consistency checks before proceeding to bisect.\r\n  This helps ensure that the command can tell good and bad revisions apart,\r\n  and that the working copy does go from bad to good over the provided revset.\r\n  Use the new flag `--trust-endpoints` to disable these checks.\r\n\r\n* `jj split` now opens a single editor session to edit descriptions for the\r\n  split commits.\r\n\r\n* `jj undo` and `jj redo` now refuse to undo/redo an operation that was\r\n  performed in another workspace. Use `--allow-cross-workspace` to undo/redo\r\n  it anyway.\r\n\r\n* `jj workspace list`/`root` no longer omit unreachable paths. All recorded\r\n  paths are now shown, with warnings displayed in `jj workspace root`.\r\n\r\n* The `List.get()`, `.first()`, and `.last()` template functions now return\r\n  `Option<T>` instead of throwing an error on out-of-bounds access.\r\n\r\n### New features\r\n\r\n* `jj workspace add` supports `--colocate`/`--no-colocate` flags to control\r\n  whether a Git worktree is created alongside the workspace. The default\r\n  colocates when the current workspace is colocated and the `git.colocate`\r\n  config is `true`. `jj workspace forget` removes the corresponding Git\r\n  worktree when one exists.\r\n\r\n* `jj git colocation status`/`enable`/`disable` now work on child\r\n  workspaces. `status` correctly reports colocation state and includes\r\n  the workspace name. `enable` creates a Git worktree and `disable`\r\n  removes it, allowing colocation to be toggled after workspace\r\n  creation.\r\n\r\n* `jj workspace remove` removes a workspace and its directory from disk. The\r\n  working-copy state is snapshotted into a commit before removal.\r\n\r\n* Added commands `jj file edit` and `jj file delete` for editing files in any\r\n  revision without needing to change the working copy.\r\n\r\n* `jj git push` now supports pushing to multiple remotes at the same time.\r\n  This can be configured via `git.push` set to a string pattern\r\n  or array of string patterns, or with the repeatable `--remote` flag,\r\n  which also accepts string patterns.\r\n\r\n* The default target revisions for `jj git push` can now be configured via\r\n  `revsets.git-push`.\r\n\r\n* Added the `TreeEntry.normal_value()` template method and the `TreeValue` type\r\n  to access resolved tree values, formatted as their full object IDs, including\r\n  Git submodule commit IDs.\r\n\r\n* Diff hunk headers now include nearby source symbols for many common\r\n  programming and markup languages.\r\n\r\n* `fix.tools.<name>.line-range-args` (replaces `line-range-arg`) is an array of\r\n  string template args to pass to the fix tool. This is more flexible in cases\r\n  where you need to pass multiple arguments to the tool, such as separate args\r\n  for the range start and range end.\r\n\r\n* `jj run` now uses the sparse patterns from the workspace it's run from.\r\n  Use the `--sparse-patterns` option to control this behavior (evaluated\r\n  per each `jj run` invocation).\r\n\r\n* `jj util diff <path1> <path2>` to compare files on disk.\r\n\r\n* Aliases now support setting `aliases.<name>.enabled = false`, which will\r\n  disable them. This can be used to disable built-in aliases or disable aliases\r\n  in later layers (such as repo config files).\r\n\r\n* `ui.editor` now supports `$path` and `$line` substitution variables. Example:\r\n  `ui.editor = [\"emacs\", \"+$line\", \"$path\"]`\r\n\r\n* `fill` template function now supports an additional named parameter\r\n  `break_words`, that allows specifying if the template should break words\r\n  longer than `width` passed in the input to ensure no words overflow the\r\n  specified width.\r\n\r\n* The `json()` template function now supports map literals: `json({'key' =>\r\n  value})`\r\n\r\n* The hunk headers of `diff.color-words.conflict = \"pair\"` now include the\r\n  conflict labels of the compared terms.\r\n\r\n### Fixed bugs\r\n\r\n* On Windows, `jj` no longer hangs when a subprocess needs to prompt the user,\r\n  such as `ssh` asking for a key passphrase or for confirmation of an unknown\r\n  host key. Subprocesses started from a terminal now inherit its console, rather\r\n  than being given an invisible one by `CREATE_NO_WINDOW` for the prompt to\r\n  disappear into.\r\n  [#6745](https://github.com/jj-vcs/jj/issues/6745)\r\n  [#8547](https://github.com/jj-vcs/jj/issues/8547)\r\n\r\n* On Windows, `jj git colocation enable` and `jj git colocation disable` no\r\n  longer fail with \"Access is denied (os error 5)\" when the Git repository\r\n  contains pack files.\r\n  [#8661](https://github.com/jj-vcs/jj/issues/8661)\r\n\r\n* `jj undo` of `jj workspace forget` now correctly preserves the workspace's\r\n  recorded path. Previously the path metadata was lost, leaving the workspace\r\n  in a broken state after undo.\r\n  [#9991](https://github.com/jj-vcs/jj/issues/9991)\r\n\r\n* `at_operation()` can now be used with operations that are not ancestors of\r\n  the current operation (e.g. sibling operations created by concurrent\r\n  commands). Previously, evaluating such expressions failed if they resolved\r\n  to commits missing from the current operation's index.\r\n\r\n* `.gitignore` files are now respected even if they aren't materialized in the\r\n  working copy because they are excluded by the sparse patterns. Previously,\r\n  ignored files could become tracked in a sparse working copy.\r\n  [#2289](https://github.com/jj-vcs/jj/issues/2289)\r\n\r\n* In-tree ignore files (`.gitignore`) are no longer read through symlinks,\r\n  matching `git` behavior. Such files are now silently skipped instead of having\r\n  their symlink target applied. `$GIT_DIR/info/exclude` and `core.excludesFile`\r\n  are unaffected and still follow symlinks, as `git` does.\r\n  [#7161](https://github.com/jj-vcs/jj/issues/7161)\r\n\r\n* `jj workspace list` templates are now labeled with `workspace name`,\r\n  `workspace root`, etc.\r\n\r\n### Contributors\r\n\r\nThanks to the people who made this release happen!\r\n\r\n* Aaron Bies (@slerpyyy)\r\n* Austin Seipp (@thoughtpolice)\r\n* Bartok9 (@Bartok9)\r\n* Brice Figureau (@masterzen)\r\n* Bryan O'Sullivan (@bos)\r\n* Caleb White (@calebdw)\r\n* David Rieber (@drieber)\r\n* Farid Zakaria (@fzakaria)\r\n* Gabriel Goller (@kaffarell)\r\n* Gasper Stukelj (@mirkomartn)\r\n* Jakub Stasiak (@jstasiak)\r\n* JamBalaya56562 (@JamBalaya56562)\r\n* Joseph Lou (@josephlou5)\r\n* Karnajeet Gosavi (@kg290)\r\n* LOG (@logarithmone1128)\r\n* Martin von Zweigbergk (@martinvonz)\r\n* Matt Stark (@matts1)\r\n* Mustafa Officewala (@genericusername2709)\r\n* pederbe (@pederbe)\r\n* Philip Metzger (@PhilipMetzger)\r\n* Pro (@twistedfall)\r\n* Remo Senekowitsch (@senekor)\r\n* Sami Hiltunen (@SamiHiltunen)\r\n* sofia (@badp)\r\n* Stephen Jennings (@jennings)\r\n* Vincent Ging Ho Yim (@cenviity)\r\n* xtqqczze (@xtqqczze)\r\n* Yannik Sander (@ysndr)\r\n* Yuya Nishihara (@yuja)","reactions":{"total_count":15,"+1":5,"-1":0,"laugh":0,"hooray":8,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":29}
