c9ebcad7","download_count":43994,"created_at":"2026-11-05T00:40:39Z","updated_at":"2026-11-05T00:40:39Z"}],"body":"This release fixes a dependency error that broke Linux builds in the 0.47.0\r\nrelease.\r\n\r\n### About\r\n\r\njj is a Git-compatible version control system that is both simple and powerful.\r\nSee the [installation instructions](https://docs.jj-vcs.dev/v0.47.1/install-and-setup/) to get started.\r\n\r\n### Deprecations\r\n\r\n* The `git.sign-on-push` boolean option is deprecated in favor of the\r\n  `revsets.git-sign-on-push` revset. The default value is `none()`. If\r\n  `git.sign-on-push` was previously set to `true`, it will be migrated to\r\n  `revsets.git-sign-on-push = \"~signed() & mine()\"`.\r\n\r\n### New features\r\n\r\n* New `revsets.git-sign-on-push` config option containing the revset of\r\n  commits to be signed when `jj git push` is run. It replaces the\r\n  `git.sign-on-push` boolean option.\r\n\r\n### Contributors\r\n\r\nThanks to the people who made this release happen!\r\n\r\n* Philippe Daouadi (@blastrock)\r\n","reactions":{"total_count":24,"+1":8,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":7,"rocket":2,"eyes":1},"mentions_count":1}
