":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":2527,"digest":"sha256:7ac865fdb2d656f32641b4cc3f5c3b75a5afaa20e4a1c3b704df7d71dd2e0470","download_count":450,"created_at":"2026-11-07T12:03:58Z","updated_at":"2026-11-07T12:03:58Z"},{"id":720591006,"node_id":"RA_kwDOANKv9s4q81ie","name":"fzf_0.75.0_loong64.deb","label":"","uploader":{"login":"junegunn","id":700826,"node_id":"MDQ6VXNlcjcwMDgyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2221334,"digest":"sha256:395d47a5bd67708f39bb1eb129411efd57b5833f5bc2054b75a563bb28e8b1a6","download_count":19,"created_at":"2026-11-07T12:03:04Z","updated_at":"2026-11-07T12:03:05Z"},{"id":720590989,"node_id":"RA_kwDOANKv9s4q81iN","name":"fzf_0.75.0_ppc64le.deb","label":"","uploader":{"login":"junegunn","id":700826,"node_id":"MDQ6VXNlcjcwMDgyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2141090,"digest":"sha256:8de928029c1d3a66a98150d63c75cead95dfd61ff7807127fafef3b575a515f8","download_count":17,"created_at":"2026-11-07T12:03:04Z","updated_at":"2026-11-07T12:03:04Z"},{"id":720591007,"node_id":"RA_kwDOANKv9s4q81if","name":"fzf_0.75.0_riscv64.deb","label":"","uploader":{"login":"junegunn","id":700826,"node_id":"MDQ6VXNlcjcwMDgyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2181938,"digest":"sha256:0b02f6eb0f2c58edd486e0a28e0214d1eed5c015d851bdaacbf3cdc956c0e128","download_count":19,"created_at":"2026-11-07T12:03:04Z","updated_at":"2026-11-07T12:03:05Z"},{"id":720590952,"node_id":"RA_kwDOANKv9s4q81ho","name":"fzf_0.75.0_s390x.deb","label":"","uploader":{"login":"junegunn","id":700826,"node_id":"MDQ6VXNlcjcwMDgyNg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2229946,"digest":"sha256:6f65a58ead7336ecbc899944adf77b25b868df7804adad72b1c28b2f19b7f5d2","download_count":17,"created_at":"2026-11-07T12:03:03Z","updated_at":"2026-11-07T12:03:03Z"}],"body":"- Added `{change,transform,bg-transform}-info-command` actions (#4951) (@casperdcl)\n  ```sh\n  seq 100 | fzf --info-command 'echo \"mode: A | $FZF_INFO\"' \\\n                --bind 'ctrl-a:change-info-command:echo \"mode: A | $FZF_INFO\"' \\\n                --bind 'ctrl-b:change-info-command:echo \"mode: B | $FZF_INFO\"'\n  ```\n- `transform-nth` and `transform-with-nth` (and their `bg-` variants) no longer split the output at `|`\n    - Only `change-nth` and `change-with-nth` rotate through `|`-separated values\n    - Fixed the bound command being replaced with the output. e.g. With `transform-nth(echo '1|2')`, the next key press ran `2|1` as a shell command.\n    - A `--with-nth` template in the output can now contain `|`. e.g. `{2}|{1}` was cut to `{2}`.\n- `change-nth` and `transform-nth` now handle empty and invalid values the same way as `change-with-nth` and `transform-with-nth`\n    - An empty value restores the default `--nth`. Previously, `change-nth()` and an empty `transform-nth` output searched all fields. Use `change-nth(..)` for that.\n    - A non-empty invalid value is ignored. Previously, it restored the default `--nth`.\n- `change-nth` and `change-with-nth` now apply the value after the current one in the `|`-separated list\n    - A value equal to the current one is skipped, e.g. the first value when it is the initial `--nth`\n    - Invalid values in the list are skipped\n    - The rotation follows the current value even when another binding changed it, or when the action is printed by `transform` (unless the list contains the same value more than once)\n    - You can list the values in their natural order, starting with the initial one\n      ```sh\n      # Previously, you would have to write:\n      ls -al | fzf --with-nth .. --bind 'space:change-with-nth:1|2|..'\n\n      # Now you can write:\n      ls -al | fzf --with-nth .. --bind 'space:change-with-nth:..|1|2'\n      ```\n- Fixed `--no-sort` being ignored in filter mode with `--sync`, `--tac`, or `--bench` (#4940) (@NavpreetSSidhu)\n- Fixed `--walker=follow` skipping a symlink in one `--walker-root` when its target is an ancestor of another root (#4944) (@mabunemeh)\n- Fixed data races in the preview and the search result cache (#4947)\n- Fixed O(n^2) action parsing in `--listen`. A single ~1 MB request could block the server for ~30 s (@zachariah-mithani, AploSec)\n- Windows\n    - Fixed `--with-shell` on Windows not detecting cmd, PowerShell, and pwsh, which made fzf quote commands and entries for a POSIX shell (#4936) (@vimkim)\n        - e.g. With `--with-shell \"cmd.exe /d /c\"`, `--preview '\"C:\\Program Files\\nu\\bin\\nu.exe\" --version'` failed\n    - Added `.msi` installers for amd64 and arm64, also offered through winget (#4943) (@meop)\n        - The portable package runs fzf through a symlink in the WinGet Links folder, which an administrator's SSH session refuses to follow\n        - The MSI installs `fzf.exe` under Program Files and adds it to the system PATH\n        - `winget upgrade` keeps an existing portable install. To switch to the MSI, run `winget uninstall junegunn.fzf` and `winget install junegunn.fzf`.\n- Vim plugin\n    - Fixed garbage text on screen in Neovim with `set title` when the fzf command contains ANSI escape sequences (#4941)\n- nushell\n    - The completion integration now requires nushell 0.116.1 or above, where an interactive completer can take the terminal through the `@interactive` attribute (#4934) (@sim590)\n\n","reactions":{"total_count":40,"+1":19,"-1":0,"laugh":2,"hooray":6,"confused":0,"heart":6,"rocket":5,"eyes":2},"mentions_count":7}
