## What's Changed\n* Save preferences and JSON results atomically by @lance0 in https://github.com/lance0/xfr/pull/246\n* Bound stalled Prometheus HTTP connections by @lance0 in https://github.com/lance0/xfr/pull/250\n* Reorganize documentation around a short README by @lance0 in https://github.com/lance0/xfr/pull/251\n* Open the README demo on a populated TUI by @lance0 in https://github.com/lance0/xfr/pull/252\n* Bound hostname resolution with --connect-timeout by @lance0 in https://github.com/lance0/xfr/pull/254\n* Reject ignored client options and write CSV for --csv -o by @lance0 in https://github.com/lance0/xfr/pull/255\n* Stop setting SO_REUSEADDR on ephemeral UDP data sockets by @lance0 in https://github.com/lance0/xfr/pull/256\n* Fix Ctrl-C in client Settings and server TUI by @lance0 in https://github.com/lance0/xfr/pull/245\n* Improve TUI text readability across themes by @lance0 in https://github.com/lance0/xfr/pull/247\n* Explain and lock overridden update-check settings by @lance0 in https://github.com/lance0/xfr/pull/248\n* Keep TUIs readable and help accessible in small terminals by @lance0 in https://github.com/lance0/xfr/pull/249\n* Make the native Windows CI job informational by @lance0 in https://github.com/lance0/xfr/pull/257\n* True up docs after the ttl-parity batch by @lance0 in https://github.com/lance0/xfr/pull/258\n* Reduce allocations in TUI help and server tables by @lance0 in https://github.com/lance0/xfr/pull/259\n* Write Push Gateway metrics directly into the payload buffer by @lance0 in https://github.com/lance0/xfr/pull/260\n* Remove temporary vectors from interval aggregation by @lance0 in https://github.com/lance0/xfr/pull/261\n* Batch allocation cleanup in plain and CSV reporting by @lance0 in https://github.com/lance0/xfr/pull/262\n* Pre-release fixes for 0.12.0 by @lance0 in https://github.com/lance0/xfr/pull/263\n* Fix CLI rough edges before 0.12.0 by @lance0 in https://github.com/lance0/xfr/pull/264\n* Fix TUI rough edges before 0.12.0 by @lance0 in https://github.com/lance0/xfr/pull/265\n* Make the TCP send loop yield so every stream carries data by @lance0 in https://github.com/lance0/xfr/pull/267\n* Close QUIC connections explicitly at test end and on server shutdown by @lance0 in https://github.com/lance0/xfr/pull/266\n* Retire per-test Prometheus series after 16 finished tests by @lance0 in https://github.com/lance0/xfr/pull/268\n\n\n**Full Changelog**: https://github.com/lance0/xfr/compare/v0.11.0...v0.12.0","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
