":1,"created_at":"2026-09-24T03:17:46Z","updated_at":"2026-09-24T03:17:48Z"},{"id":585054775,"node_id":"RA_kwDORZ9jAc4i3zo3","name":"CliRelay_0.5.5_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":16497218,"digest":"sha256:f6b9f1523e24cb859c5977716ed4380928d6620d08a1685543ef6c7db7811fca","download_count":2,"created_at":"2026-09-24T03:17:46Z","updated_at":"2026-09-24T03:17:48Z"},{"id":585054780,"node_id":"RA_kwDORZ9jAc4i3zo8","name":"CliRelay_0.5.5_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15144301,"digest":"sha256:6badf942dbaf48793bc0696c1742763778e40b3898d84a566c3069ea69e81256","download_count":1,"created_at":"2026-09-24T03:17:46Z","updated_at":"2026-09-24T03:17:48Z"},{"id":585054814,"node_id":"RA_kwDORZ9jAc4i3zpe","name":"CliRelay_0.5.5_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16840966,"digest":"sha256:04c93f69d9c01c158efd18033f6348921e47e3bf55265f6c296bd818224ebca9","download_count":1,"created_at":"2026-09-24T03:17:48Z","updated_at":"2026-09-24T03:17:49Z"},{"id":585054810,"node_id":"RA_kwDORZ9jAc4i3zpa","name":"CliRelay_0.5.5_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15271640,"digest":"sha256:56201034b99468d5fe5f945a36fab74554fe4987c85519d803f186ee8f559915","download_count":1,"created_at":"2026-09-24T03:17:48Z","updated_at":"2026-09-24T03:17:49Z"}],"body":"# v0.5.5 - WebSocket Quota Enforcement, Example Keys Retired, Legacy Portal Passwords Locked, and Codex Tool Bridge Opt-In\n\n> **Security release.** Self-hosted instances should upgrade. Read the [Upgrade Notes](#upgrade-notes) first: example client keys stop authenticating, and some legacy portal accounts are locked until an admin issues a password.\n\n## Highlights\n\n### 1. Quota limits now apply to Responses WebSocket turns\n* **What was wrong:** `GET /v1/responses` and `GET /backend-api/codex/responses` upgrade to the Responses WebSocket. Each `response.create` turn on that connection reaches the executor and spends upstream quota just like a `POST /v1/responses`, but WebSocket turns went through no quota check.\n* **The handshake:** it is now refused with the same 429/503 a POST gets when a budget is already exhausted: daily requests, total quota, lifetime, daily and period spending.\n* **Every turn:** each turn passes the full POST checks before it reaches the executor, including RPM, TPM and the concurrency cap. A refused turn gets an error event carrying the same status, error and `X-CliRelay-Quota-*` headers, and the connection stays open for the next turn.\n* **Shared logic:** POST and WebSocket now use one admission path. POST responses are unchanged byte for byte, and a contract test pins every refusal branch.\n* **Found while verifying #1045.** Thanks to @kta1kri for the report.\n\n### 2. The model gate covers every accepted WebSocket upgrade\n* **What was wrong:** the model-restriction middleware recognised WebSocket upgrades with a narrower check than the upgrader applies.\n* **The fix:** it now uses the upgrader's own check, shared with the quota middleware. `allowed-models`, models disabled in the catalog and channel-group allow lists hold on every accepted upgrade.\n\n### 3. The example client API keys are no longer active\n* **What was wrong:** `config.example.yaml` has shipped three active client keys (`your-api-key-1`..`3`) since v0.1.0. A fresh Docker Compose install copied that file, and the first start imported the keys into the database as `api-key-1`..`api-key-3`.\n* **Template:** the `api-keys` entries are now a commented-out example. A fresh install ships no client key and rejects client requests until one is created in the panel.\n* **Rejected everywhere:** the three example values never import and never authenticate, whether they come from `config.yaml` or the database. They get the same `401 Invalid API key` as an unknown key. Public usage lookups refuse them as well.\n* **Startup warning:** a `security warning` at startup lists enabled database keys that still hold an example value. Rows are not deleted automatically.\n* **Thanks** to @gaizaor for the lead in #404.\n\n### 4. Portal accounts still on the legacy backfill password are locked\n* **What was wrong:** from v0.4.13 through v0.5.1, the one-shot API key \u2192 end-user backfill gave every account the same initial password from the published source and did not require a change. v0.5.3 fixed that for new databases. Accounts already created were left as they were.\n* **The fix:** a one-time pass at startup locks the accounts from that batch whose password was never changed. They get a random password nobody knows, `must_change_password`, and revoked sessions. It costs at most one bcrypt comparison on first boot.\n* **Traffic is unaffected:** API key traffic does not depend on the portal password, so requests through these accounts' keys continue. The startup log names every locked account.\n\n### 5. Codex tool bridge is now opt-in per provider\n* **What was wrong:** every tool-carrying request sent to an OpenAI-compatible upstream had eleven extra tool definitions appended, the Codex Desktop Computer Use functions and `mcp__node_repl__js`. This happened whether or not the caller declared them.\n* **The fix:** requests now carry exactly the tools the caller declared. `openai-compatibility` and `opencode-go-api-key` entries gain `codex-tool-bridge` (default `false`) for operators who want those definitions for Codex Desktop. Providers without the setting are never bridged.\n* **Thanks** to @Android-Login-Analysis for the precise report (#1041).\n\n### 6. Responses and tool-choice fixes\n* **Claude \u2192 Responses streaming:** `response.output_text.done`, `response.content_part.done` and `response.output_item.done` now carry the closing block's text. Codex CLI and pi take the reply from `output_item.done`, so Claude models behind `/v1/responses` came back empty. Thanks to @RUIIIOVO for the report and the reference implementation (#1053), credited as co-author.\n* **`tool_choice: none`:** it now survives Claude \u2192 OpenAI, OpenAI \u2192 Claude and Responses \u2192 Claude with tools kept. Previously it was forced to, or silently became, `auto`. The Responses named choice `{\"type\":\"function\",\"name\":\"x\"}` also reaches Claude with its name. This is step 1 of #1042. Thanks to @Android-Login-Analysis.\n\n---\n\n## Detailed Changes\n\n### Backend CliRelay\n- **fix(quota)**: apply the POST quota checks to Responses WebSocket turns; the model gate covers every accepted WebSocket upgrade (#1084).\n- **fix(auth)**: stop shipping and accepting the example client API keys; refuse them in public usage lookups (#1082).\n- **fix(enduser)**: lock portal accounts still holding the legacy backfill password (#1083).\n- **fix(executor)**: make the Codex tool bridge a per-provider opt-in (#1081).\n- **fix(translator)**: carry block text in Claude \u2192 Responses done events (#1079).\n- **fix(translator)**: stop `tool_choice` `\"none\"` from becoming `auto`; read the Responses named choice (#1080).\n\n## Upgrade Notes\n* **Example keys:** clients still sending `your-api-key-1`..`3` get `401` after upgrading.\n  1. Create a key on the API Keys page of the panel (`/manage`).\n  2. Move the clients to it.\n  3. Delete the old `api-key-N` entries. The startup warning lists them.\n\n  An existing `config.yaml` is not rewritten, but the example values in it are never imported or accepted.\n* **Legacy portal accounts:** accounts locked by the one-time pass need a password issued through the end-user password reset before their owners can sign in. Their keys keep working.\n  * Check `last_login_at` on the listed accounts. If anyone other than the owner signed in before the upgrade, rotate that account's keys.\n* **WebSocket quotas:** keys with limits that use the Responses WebSocket (for example Codex CLI) are now held to those limits.\n  * A handshake on an exhausted budget returns `429`.\n  * A refused turn gets an error event.\n* **Codex tool bridge:** operators who rely on the Computer Use / Browser definitions for Codex Desktop must set `codex-tool-bridge: true` on the `openai-compatibility` or `opencode-go-api-key` entries that serve it.\n  * The panel does not know this field yet. Saving those providers from the panel turns it back off, so set it in `config.yaml` or through the management API `PATCH`.\n* **Also worth checking:** list your client keys (`GET /v0/management/api-key-entries`) and remove any you do not recognise.\n\n<details>\n<summary>\u4e2d\u6587\u8bf4\u660e\uff08\u70b9\u51fb\u5c55\u5f00\uff09</summary>\n\n# v0.5.5 - WebSocket \u914d\u989d\u751f\u6548\u3001\u793a\u4f8b Key \u5931\u6548\u3001\u9057\u7559\u95e8\u6237\u5bc6\u7801\u9501\u5b9a\u4e0e Codex \u5de5\u5177\u6865\u63a5\u6539\u4e3a\u6309\u9700\u5f00\u542f\n\n> **\u5b89\u5168\u66f4\u65b0\u3002** \u81ea\u6258\u7ba1\u5b9e\u4f8b\u8bf7\u5c3d\u5feb\u5347\u7ea7\u3002\u5347\u7ea7\u524d\u8bf7\u5148\u9605\u8bfb\u4e0b\u65b9\"\u5347\u7ea7\u63d0\u793a\"\uff1a\u793a\u4f8b\u5ba2\u6237\u7aef Key \u5c06\u65e0\u6cd5\u518d\u9274\u6743\uff0c\u90e8\u5206\u9057\u7559\u95e8\u6237\u8d26\u53f7\u9700\u8981\u7ba1\u7406\u5458\u91cd\u65b0\u53d1\u653e\u5bc6\u7801\u3002\n\n## \u6838\u5fc3\u66f4\u65b0\u4eae\u70b9\n\n### 1. Responses WebSocket \u8f6e\u6b21\u5f00\u59cb\u6267\u884c\u914d\u989d\u9650\u5236\n* **\u95ee\u9898**\uff1a`GET /v1/responses` \u4e0e `GET /backend-api/codex/responses` \u662f Responses WebSocket \u7684\u5347\u7ea7\u5165\u53e3\u3002\u8fde\u63a5\u91cc\u7684\u6bcf\u4e00\u8f6e `response.create` \u90fd\u4f1a\u8c03\u7528\u6267\u884c\u5668\u3001\u6d88\u8017\u4e0a\u6e38\u989d\u5ea6\uff0c\u4e0e `POST /v1/responses` \u5b8c\u5168\u4e00\u6837\uff0c\u4f46\u6b64\u524d WebSocket \u8f6e\u6b21\u4e0d\u7ecf\u8fc7\u4efb\u4f55\u914d\u989d\u68c0\u67e5\u3002\n* **\u63e1\u624b**\uff1a\u989d\u5ea6\u5df2\u8017\u5c3d\u65f6\uff08\u6bcf\u65e5\u8bf7\u6c42\u6570\u3001\u603b\u989d\u5ea6\u3001\u7d2f\u8ba1/\u6bcf\u65e5/\u5468\u671f\u6d88\u8d39\uff09\uff0c\u63e1\u624b\u8fd4\u56de\u4e0e POST \u76f8\u540c\u7684 429/503\u3002\n* **\u6bcf\u4e00\u8f6e**\uff1a\u8c03\u7528\u6267\u884c\u5668\u4e4b\u524d\u6267\u884c\u5b8c\u6574\u7684 POST \u68c0\u67e5\uff08\u542b RPM\u3001TPM\u3001\u5e76\u53d1\u4e0a\u9650\uff09\u3002\u88ab\u62d2\u7684\u8f6e\u6b21\u6536\u5230\u5e26\u76f8\u540c\u72b6\u6001\u7801\u3001\u9519\u8bef\u5bf9\u8c61\u548c `X-CliRelay-Quota-*` \u5934\u7684\u9519\u8bef\u4e8b\u4ef6\uff0c\u8fde\u63a5\u4fdd\u6301\u53ef\u7528\u3002\n* **\u540c\u4e00\u5957\u903b\u8f91**\uff1aPOST \u4e0e WebSocket \u5171\u7528\u540c\u4e00\u5957\u51c6\u5165\u903b\u8f91\uff0cPOST \u7684\u54cd\u5e94\u9010\u5b57\u8282\u4e0d\u53d8\uff0c\u6709\u5951\u7ea6\u6d4b\u8bd5\u9501\u5b9a\u5168\u90e8\u62d2\u7edd\u5206\u652f\u3002\n* \u6b64\u95ee\u9898\u5728\u6838\u67e5 #1045 \u65f6\u53d1\u73b0\uff0c\u611f\u8c22 @kta1kri \u7684\u62a5\u544a\u3002\n\n### 2. \u6a21\u578b\u95e8\u7981\u8986\u76d6\u6240\u6709\u88ab\u63a5\u53d7\u7684 WebSocket \u5347\u7ea7\n* **\u95ee\u9898**\uff1a\u6a21\u578b\u9650\u5236\u4e2d\u95f4\u4ef6\u5224\u65ad WebSocket \u5347\u7ea7\u7528\u7684\u6761\u4ef6\u6bd4\u5347\u7ea7\u5668\u66f4\u7a84\u3002\n* **\u4fee\u590d**\uff1a\u73b0\u5728\u4e0e\u914d\u989d\u4e2d\u95f4\u4ef6\u5171\u7528\u5347\u7ea7\u5668\u7684\u540c\u4e00\u5224\u5b9a\u3002`allowed-models`\u3001\u6a21\u578b\u76ee\u5f55\u7981\u7528\u3001\u6e20\u9053\u5206\u7ec4\u767d\u540d\u5355\u5728\u6bcf\u4e2a\u88ab\u63a5\u53d7\u7684\u5347\u7ea7\u4e0a\u90fd\u751f\u6548\u3002\n\n### 3. \u4ed3\u5e93\u793a\u4f8b\u5ba2\u6237\u7aef Key \u4e0d\u518d\u751f\u6548\n* **\u95ee\u9898**\uff1a`config.example.yaml` \u4ece v0.1.0 \u8d77\u5e26\u6709\u4e09\u4e2a\u751f\u6548\u7684\u5ba2\u6237\u7aef Key\uff08`your-api-key-1`..`3`\uff09\u3002Docker Compose \u5168\u65b0\u90e8\u7f72\u4f1a\u590d\u5236\u8be5\u6587\u4ef6\uff0c\u9996\u6b21\u542f\u52a8\u65f6\u628a\u5b83\u4eec\u5bfc\u5165\u6570\u636e\u5e93\uff0c\u547d\u540d\u4e3a `api-key-1`..`api-key-3`\u3002\n* **\u6a21\u677f**\uff1a`api-keys` \u6539\u4e3a\u6ce8\u91ca\u6389\u7684\u793a\u4f8b\u3002\u5168\u65b0\u90e8\u7f72\u4e0d\u518d\u5e26\u4efb\u4f55\u5ba2\u6237\u7aef Key\uff0c\u5728\u9762\u677f\u521b\u5efa Key \u4e4b\u524d\u62d2\u7edd\u6240\u6709\u5ba2\u6237\u7aef\u8bf7\u6c42\u3002\n* **\u4e00\u5f8b\u62d2\u7edd**\uff1a\u8fd9\u4e09\u4e2a\u793a\u4f8b\u503c\u4e0d\u518d\u5bfc\u5165\u3001\u4e5f\u4e0d\u518d\u80fd\u9274\u6743\uff0c\u65e0\u8bba\u6765\u81ea `config.yaml` \u8fd8\u662f\u6570\u636e\u5e93\uff0c\u8fd4\u56de\u4e0e\u672a\u77e5 Key \u76f8\u540c\u7684 `401 Invalid API key`\u3002\u516c\u5f00\u7528\u91cf\u67e5\u8be2\u540c\u6837\u62d2\u7edd\u3002\n* **\u542f\u52a8\u544a\u8b66**\uff1a\u542f\u52a8\u65f6\u4ee5 `security warning` \u5217\u51fa\u6570\u636e\u5e93\u4e2d\u4ecd\u542f\u7528\u7684\u793a\u4f8b Key\uff0c\u4e0d\u4f1a\u81ea\u52a8\u5220\u9664\u3002\n* \u611f\u8c22 @gaizaor \u5728 #404 \u63d0\u4f9b\u7684\u7ebf\u7d22\u3002\n\n### 4. \u9501\u5b9a\u4ecd\u4f7f\u7528\u9057\u7559 backfill \u521d\u59cb\u5bc6\u7801\u7684\u95e8\u6237\u8d26\u53f7\n* **\u95ee\u9898**\uff1av0.4.13 \u81f3 v0.5.1 \u671f\u95f4\uff0cAPI Key \u2192 \u7ec8\u7aef\u7528\u6237\u7684\u4e00\u6b21\u6027 backfill \u7ed9\u6bcf\u4e2a\u8d26\u53f7\u8bbe\u7f6e\u4e86\u516c\u5f00\u6e90\u7801\u4e2d\u7684\u540c\u4e00\u4e2a\u521d\u59cb\u5bc6\u7801\uff0c\u4e14\u4e0d\u5f3a\u5236\u4fee\u6539\u3002v0.5.3 \u4fee\u590d\u4e86\u65b0\u5e93\u7684\u60c5\u51b5\uff0c\u5df2\u521b\u5efa\u7684\u8d26\u53f7\u6ca1\u6709\u8865\u6551\u3002\n* **\u4fee\u590d**\uff1a\u542f\u52a8\u65f6\u4e00\u6b21\u6027\u9501\u5b9a\u8fd9\u4e00\u6279\u4e2d\u4ece\u672a\u6539\u8fc7\u5bc6\u7801\u7684\u8d26\u53f7\uff1a\u8bbe\u4e3a\u65e0\u4eba\u77e5\u6653\u7684\u968f\u673a\u5bc6\u7801\uff0c\u6807\u8bb0\u5fc5\u987b\u6539\u5bc6\uff0c\u5e76\u540a\u9500\u4f1a\u8bdd\u3002\u9996\u6b21\u542f\u52a8\u6700\u591a\u4e00\u6b21 bcrypt \u6bd4\u5bf9\u3002\n* **\u4e0d\u5f71\u54cd\u4e1a\u52a1\u8c03\u7528**\uff1aAPI Key \u8c03\u7528\u4e0d\u4f9d\u8d56\u95e8\u6237\u5bc6\u7801\uff0c\u8fd9\u4e9b\u8d26\u53f7\u540d\u4e0b Key \u7684\u8bf7\u6c42\u7167\u5e38\u53ef\u7528\u3002\u542f\u52a8\u65e5\u5fd7\u4f1a\u5217\u51fa\u88ab\u9501\u5b9a\u7684\u8d26\u53f7\u3002\n\n### 5. Codex \u5de5\u5177\u6865\u63a5\u6539\u4e3a\u6309\u6e20\u9053\u663e\u5f0f\u5f00\u542f\n* **\u95ee\u9898**\uff1a\u53d1\u5f80 OpenAI \u517c\u5bb9\u4e0a\u6e38\u3001\u4e14\u5e26\u5de5\u5177\u7684\u8bf7\u6c42\uff0c\u6b64\u524d\u90fd\u4f1a\u88ab\u8ffd\u52a0 11 \u4e2a\u5de5\u5177\u5b9a\u4e49\uff08Codex Desktop \u7684 Computer Use \u51fd\u6570\u4e0e `mcp__node_repl__js`\uff09\uff0c\u65e0\u8bba\u8c03\u7528\u65b9\u662f\u5426\u58f0\u660e\u3002\n* **\u4fee\u590d**\uff1a\u73b0\u5728\u8bf7\u6c42\u53ea\u643a\u5e26\u8c03\u7528\u65b9\u58f0\u660e\u7684\u5de5\u5177\u3002`openai-compatibility` \u4e0e `opencode-go-api-key` \u6761\u76ee\u65b0\u589e `codex-tool-bridge`\uff08\u9ed8\u8ba4 `false`\uff09\uff0c\u9700\u8981\u4e3a Codex Desktop \u63d0\u4f9b\u8fd9\u4e9b\u5b9a\u4e49\u7684\u8fd0\u8425\u8005\u53ef\u6309\u6761\u76ee\u5f00\u542f\u3002\u6ca1\u6709\u8be5\u914d\u7f6e\u9879\u7684\u6e20\u9053\u4e00\u5f8b\u4e0d\u6ce8\u5165\u3002\n* \u611f\u8c22 @Android-Login-Analysis \u7684\u8be6\u7ec6\u62a5\u544a\uff08#1041\uff09\u3002\n\n### 6. Responses \u4e0e\u5de5\u5177\u9009\u62e9\u4fee\u590d\n* **Claude \u2192 Responses \u6d41\u5f0f**\uff1a`response.output_text.done`\u3001`response.content_part.done`\u3001`response.output_item.done` \u73b0\u5728\u643a\u5e26\u5f53\u524d\u5757\u7684\u6587\u672c\u3002Codex CLI \u4e0e pi \u4ee5 `output_item.done` \u4e3a\u6700\u7ec8\u56de\u590d\uff0c\u6b64\u524d\u7ecf `/v1/responses` \u8c03\u7528 Claude \u6a21\u578b\u4f1a\u5f97\u5230\u7a7a\u56de\u590d\u3002\u611f\u8c22 @RUIIIOVO \u7684\u62a5\u544a\u4e0e\u53c2\u8003\u5b9e\u73b0\uff08#1053\uff09\uff0c\u5df2\u5217\u4e3a\u5171\u540c\u4f5c\u8005\u3002\n* **`tool_choice: none`**\uff1a\u5728 Claude \u2192 OpenAI\u3001OpenAI \u2192 Claude\u3001Responses \u2192 Claude \u4e0a\u6b63\u786e\u4fdd\u7559\uff0c\u4e14\u4fdd\u7559\u5de5\u5177\u5b9a\u4e49\uff1b\u6b64\u524d\u4f1a\u88ab\u5f3a\u5236\u6216\u9759\u9ed8\u53d8\u6210 `auto`\u3002Responses \u7684\u5177\u540d\u9009\u62e9 `{\"type\":\"function\",\"name\":\"x\"}` \u4e5f\u80fd\u5e26\u7740\u540d\u5b57\u5230\u8fbe Claude\u3002\u8fd9\u662f #1042 \u7684\u7b2c\u4e00\u6b65\uff0c\u611f\u8c22 @Android-Login-Analysis\u3002\n\n---\n\n## \u8be6\u7ec6\u6539\u52a8\u8bb0\u5f55\n\n### \u540e\u7aef CliRelay\n- **fix(quota)**\uff1aResponses WebSocket \u8f6e\u6b21\u6267\u884c\u4e0e POST \u76f8\u540c\u7684\u914d\u989d\u68c0\u67e5\uff1b\u6a21\u578b\u95e8\u7981\u8986\u76d6\u6240\u6709\u88ab\u63a5\u53d7\u7684 WebSocket \u5347\u7ea7\uff08#1084\uff09\u3002\n- **fix(auth)**\uff1a\u4e0d\u518d\u53d1\u653e\u4e5f\u4e0d\u518d\u63a5\u53d7\u793a\u4f8b\u5ba2\u6237\u7aef Key\uff0c\u516c\u5f00\u7528\u91cf\u67e5\u8be2\u540c\u6837\u62d2\u7edd\uff08#1082\uff09\u3002\n- **fix(enduser)**\uff1a\u9501\u5b9a\u4ecd\u4f7f\u7528\u9057\u7559 backfill \u521d\u59cb\u5bc6\u7801\u7684\u95e8\u6237\u8d26\u53f7\uff08#1083\uff09\u3002\n- **fix(executor)**\uff1aCodex \u5de5\u5177\u6865\u63a5\u6539\u4e3a\u6309\u6e20\u9053\u663e\u5f0f\u5f00\u542f\uff08#1081\uff09\u3002\n- **fix(translator)**\uff1aClaude \u2192 Responses \u7684 done \u4e8b\u4ef6\u643a\u5e26\u5757\u6587\u672c\uff08#1079\uff09\u3002\n- **fix(translator)**\uff1a`tool_choice` \u7684 `\"none\"` \u4e0d\u518d\u53d8\u6210 `auto`\uff0c\u5e76\u8bfb\u53d6 Responses \u5177\u540d\u9009\u62e9\uff08#1080\uff09\u3002\n\n## \u5347\u7ea7\u63d0\u793a\n* **\u793a\u4f8b Key**\uff1a\u4ecd\u5728\u4f7f\u7528 `your-api-key-1`..`3` \u7684\u5ba2\u6237\u7aef\u5347\u7ea7\u540e\u4f1a\u6536\u5230 `401`\u3002\n  1. \u5728\u9762\u677f\uff08`/manage`\uff09\u7684 API \u5bc6\u94a5\u9875\u521b\u5efa\u65b0 Key\u3002\n  2. \u628a\u5ba2\u6237\u7aef\u5207\u6362\u5230\u65b0 Key\u3002\n  3. \u5220\u9664\u65e7\u7684 `api-key-N` \u6761\u76ee\uff0c\u542f\u52a8\u544a\u8b66\u4f1a\u5217\u51fa\u5b83\u4eec\u3002\n\n  \u5df2\u6709\u7684 `config.yaml` \u4e0d\u4f1a\u88ab\u6539\u5199\uff0c\u4f46\u5176\u4e2d\u7684\u793a\u4f8b\u503c\u4e0d\u4f1a\u88ab\u5bfc\u5165\u6216\u63a5\u53d7\u3002\n* **\u9057\u7559\u95e8\u6237\u8d26\u53f7**\uff1a\u88ab\u4e00\u6b21\u6027\u4fee\u590d\u9501\u5b9a\u7684\u8d26\u53f7\uff0c\u9700\u8981\u7ba1\u7406\u5458\u901a\u8fc7\u7ec8\u7aef\u7528\u6237\"\u91cd\u7f6e\u5bc6\u7801\"\u53d1\u653e\u51ed\u636e\uff0c\u5176\u6240\u6709\u8005\u624d\u80fd\u518d\u6b21\u767b\u5f55\uff1b\u540d\u4e0b Key \u7167\u5e38\u53ef\u7528\u3002\n  * \u8bf7\u68c0\u67e5\u88ab\u5217\u51fa\u8d26\u53f7\u7684 `last_login_at`\uff1a\u5982\u679c\u5347\u7ea7\u524d\u6709\u975e\u672c\u4eba\u767b\u5f55\uff0c\u8bf7\u8f6e\u6362\u8be5\u8d26\u53f7\u540d\u4e0b\u7684 Key\u3002\n* **WebSocket \u914d\u989d**\uff1a\u6709\u9650\u989d\u3001\u4e14\u901a\u8fc7 Responses WebSocket \u4f7f\u7528\u7684 Key\uff08\u4f8b\u5982 Codex CLI\uff09\u73b0\u5728\u4f1a\u53d7\u5230\u9650\u989d\u7ea6\u675f\u3002\n  * \u989d\u5ea6\u8017\u5c3d\u65f6\u63e1\u624b\u8fd4\u56de `429`\u3002\n  * \u88ab\u62d2\u7684\u8f6e\u6b21\u6536\u5230\u9519\u8bef\u4e8b\u4ef6\u3002\n* **Codex \u5de5\u5177\u6865\u63a5**\uff1a\u4f9d\u8d56 Codex Desktop \u7684 Computer Use / Browser \u63d2\u4ef6\u7684\u8fd0\u8425\u8005\uff0c\u9700\u8981\u5728\u5bf9\u5e94\u7684 `openai-compatibility` \u6216 `opencode-go-api-key` \u6761\u76ee\u4e0a\u8bbe\u7f6e `codex-tool-bridge: true`\u3002\n  * \u9762\u677f\u6682\u4e0d\u8bc6\u522b\u8be5\u5b57\u6bb5\uff0c\u5728\u9762\u677f\u4fdd\u5b58\u8fd9\u4e9b\u6e20\u9053\u4f1a\u628a\u5b83\u91cd\u7f6e\u4e3a\u5173\u95ed\uff0c\u8bf7\u901a\u8fc7 `config.yaml` \u6216\u7ba1\u7406 API `PATCH` \u8bbe\u7f6e\u3002\n* **\u987a\u5e26\u81ea\u67e5**\uff1a\u7528 `GET /v0/management/api-key-entries` \u5217\u51fa\u5ba2\u6237\u7aef Key\uff0c\u5220\u9664\u4e0d\u8ba4\u8bc6\u7684\u6761\u76ee\u3002\n\n</details>\n\nMulti-arch binaries and the Docker image are published to GitHub Releases and GHCR. There is no panel release this time; codeProxy v0.5.3 remains current.\n","mentions_count":4}
