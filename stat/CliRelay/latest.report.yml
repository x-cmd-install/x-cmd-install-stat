t":2,"created_at":"2026-10-11T22:19:30Z","updated_at":"2026-10-11T22:19:31Z"},{"id":631954152,"node_id":"RA_kwDORZ9jAc4lqtro","name":"CliRelay_0.5.9_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":17185423,"digest":"sha256:7857144a3b6c0136f5c297b59271a364a2baed3833b5929f898578716c4e1ddc","download_count":10,"created_at":"2026-10-11T22:19:28Z","updated_at":"2026-10-11T22:19:30Z"},{"id":631954155,"node_id":"RA_kwDORZ9jAc4lqtrr","name":"CliRelay_0.5.9_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15773109,"digest":"sha256:bad8ff183c98cbb6c1678067b451565cf449ad2f2d4907e6a7c4f39c27a3821c","download_count":3,"created_at":"2026-10-11T22:19:28Z","updated_at":"2026-10-11T22:19:30Z"},{"id":631954154,"node_id":"RA_kwDORZ9jAc4lqtrq","name":"CliRelay_0.5.9_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17545306,"digest":"sha256:f8a97413cd35aac16eb577e950bac6c0999ee20c90fbf155f6e356580b1ff3de","download_count":14,"created_at":"2026-10-11T22:19:28Z","updated_at":"2026-10-11T22:19:30Z"},{"id":631954153,"node_id":"RA_kwDORZ9jAc4lqtrp","name":"CliRelay_0.5.9_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15906930,"digest":"sha256:0e7b71a066b99fbd29192a6f46fc8fb1bd8a71d0ddb390a92aa536f09dcb73bf","download_count":3,"created_at":"2026-10-11T22:19:28Z","updated_at":"2026-10-11T22:19:30Z"}],"body":"# v0.5.9 - Gemini Images on /v1/images, config.yaml Saves That Stop Losing Settings, and Codex Models That Survive Restarts\n\n> Pair it with **codeProxy v0.6.2**, which adds the Gemini image pickers and shows why a config.yaml save was rejected. Either upgrade order works; see [Upgrade Notes](#upgrade-notes). **`PUT /v0/management/config.yaml` now rejects saves it used to accept and then silently lose**, so scripts that write config.yaml should read the Upgrade Notes first.\n\n## Highlights\n\n### 1. Antigravity's Gemini image model on `/v1/images` and the console\n* **What was wrong:** `gemini-3.1-flash-image` on Antigravity already returned pictures through the chat endpoints, but nothing on the images side could reach it. `/v1/images/*`, the console's image page and the model probe listed only gpt-image, Grok and MiniMax, and the Antigravity executor did not understand an images request.\n* **What's new:**\n  * `/v1/images/generations` and `/v1/images/edits` serve Gemini image models while an Antigravity credential offers them. A model Antigravity publishes later needs no code change.\n  * `aspect_ratio` and `image_size` map onto Gemini's image settings: the fourteen ratios upstream accepts (`1:1` to `21:9`) and the `512` / `1K` / `2K` / `4K` tiers. A `WIDTHxHEIGHT` size maps to the nearest ratio and tier, so existing clients keep working.\n  * Ratios are sent in upstream's own spelling. `21:9` used to be reduced to `7:3`, which upstream rejects (#1148).\n  * Reference images can be uploaded or sent as base64 data URIs. Remote URLs are not fetched, and masks are refused.\n  * Responses report the real `output_format` (Gemini returns JPEG), the pixel `size` and token `usage`. A request that returns no image (a safety block, a text-only answer) fails as an invalid request, so the account is not cooled down.\n  * The chat endpoints are unchanged.\n\n### 2. config.yaml saves no longer report success while losing settings\n* **What was wrong:** `PUT /v0/management/config.yaml` answered `200 {\"ok\": true}` in two cases where the change then existed nowhere:\n  * The runtime settings a save spelled out (`proxy-url`, `debug`, `request-retry`, `payload` and others) were stored one key at a time, after the file was written. A key that failed to store was only logged. The reload then stripped it from the file and restored the old stored value.\n  * The sections the database owns (`routing`, `proxy-pool`, `api-keys`, `api-key-entries`, `api-key-permission-profiles`) were written to the file, then dropped or overridden by the stored value. Hand-typed API keys even worked as keys of that one node until its next start.\n* **The fix:**\n  * Runtime settings are stored first, in one transaction. If that fails, nothing changes and the save is rejected with `409 config_version_conflict` or with a `500` that gives the cause.\n  * A save that would change a database-owned section is rejected with `422 config_yaml_database_owned_sections` before anything is stored or written. The message names each section and the page where it is edited: Channel Groups, Outbound Proxies, API Keys or Portal Account Permissions. A copy of the stored value still passes, as do the published example keys and sections the database does not hold yet.\n  * Once the database holds API keys, a reload drops `api-keys` / `api-key-entries` from config.yaml, so hand-typed keys no longer act as keys of one node only.\n  * Only hand-typed YAML is affected. The panel's dedicated pages use their own endpoints.\n\n### 3. Codex model lists survive restarts\n* **What was wrong:** on 2026-10-11 a deploy restarted production, and for half an hour Codex clients got `502 unknown provider for model gpt-6.1-sol`. The live model list was kept only in memory, and fetching it again failed. The fetch looked up each credential's `proxy_id` in the system tenant's proxy pool instead of the credential's own tenant, and the system pool still pointed at retired proxy endpoints.\n* **The fix:**\n  * Every model list fetched from upstream is saved to `provider-model-lists.json` in the state directory and restored at startup, before the first registration pass. A restored list keeps routing until a newer answer replaces it.\n  * Model discovery (Codex manifests, and the per-credential lists for Antigravity, xAI and Kimi) uses the credential's tenant configuration, so `proxy_id` resolves in that tenant's pool, as chat requests already did.\n\n### 4. Antigravity: long agent sessions and malformed function calls\nContributed by @testAccountDeltas (#1143, #1139) and @RUIIIOVO (#1145). Thank you both.\n* **Sessions past one million tokens:** Antigravity accumulates a conversation on its side per session id. Once a long tool loop passed 1,048,576 tokens, every request in that session failed with `400 \u2026 exceeds the maximum number of tokens`, and the conversation was stuck. The executor now retries on a new session id, at most twice per request, without using up a capacity retry. Sessions below the limit keep their prefix-cache hits. Each new turn starts on the original session again and switches after one quick 400.\n* **`MALFORMED_FUNCTION_CALL`:** Gemini sometimes plans a tool call, fails to emit it, and ends the turn after only thinking. Clients took that as a finished turn, so agents stopped halfway through a task. The executor now asks again, at most twice, while nothing but thinking has been sent. A streaming client still sees one response with one ending. Once text or a tool call has gone out, the answer stands.\n\n### 5. Panel probes work in tenants whose default group excludes the model\n* **What was wrong:** the image console, the video console and the model test pick an account the same way API traffic does. A model excluded from the tenant's `default` channel group failed with `model_not_allowed_by_channel_group`, and accounts marked `exclude-from-default` could not be probed at all.\n* **The fix:** these three probes may use any account of the tenant. API traffic is unchanged.\n\n---\n\n## Detailed Changes\n\n### Backend CliRelay\n- **feat(images)**: serve Antigravity Gemini image models on `/v1/images` and the console (#1147).\n- **fix(images)**: send Gemini aspect ratios in the spelling upstream accepts (#1148).\n- **fix(management)**: let panel probes use any credential of the tenant (#1149).\n- **fix(model-discovery)**: keep upstream model lists across restarts and fetch them through the tenant's proxy (#1150).\n- **fix(management)**: reject config.yaml saves whose runtime settings fail to store (#1151).\n- **fix(management)**: reject config.yaml saves that change database-owned sections (#1152).\n- **test(management)**: pin the reason carried by `{\"error\": \"<code>\", \"message\": \"<reason>\"}` bodies, which codeProxy v0.6.2 now shows (#1153).\n- **fix(antigravity)**: rotate the session id at the per-session 1M-token limit (#1143 and #1139, by @testAccountDeltas) and ask again when Gemini ends a turn with `MALFORMED_FUNCTION_CALL` (#1145, by @RUIIIOVO). Landed together in #1154, which keeps the re-request on the rotated session and adds executor tests.\n\n## Upgrade Notes\n* **Scripts that write config.yaml** (`PUT /v0/management/config.yaml`):\n  * A save can now fail where it used to return 200: `409 config_version_conflict`, `422 config_yaml_database_owned_sections`, or `500` with the cause. A failed save changes nothing, so retry it, or edit the named sections where the message says.\n  * Change routing, proxy pools and API keys through their own management endpoints, not by writing them into config.yaml.\n* **Either upgrade order works:**\n  * codeProxy v0.6.2 on an older backend shows no Gemini image pickers; everything else in it works.\n  * Older panels keep working on v0.5.9. Their size picker still drives Gemini image models, but some rejected saves show only an error code such as `invalid_config`.\n  * CliRelay pulls the latest codeProxy release on its own, roughly every three hours.\n* **New state file:** `provider-model-lists.json` in the state directory. It is written atomically, so blue-green slots on one host can share it.\n* **No changes required:** there are no configuration or database schema changes.\n\n<details>\n<summary>\u4e2d\u6587\u8bf4\u660e\uff08\u70b9\u51fb\u5c55\u5f00\uff09</summary>\n\n# v0.5.9 - /v1/images \u652f\u6301 Gemini \u751f\u56fe\u3001config.yaml \u4fdd\u5b58\u4e0d\u518d\u6084\u6084\u4e22\u8bbe\u7f6e\u3001Codex \u6a21\u578b\u6e05\u5355\u91cd\u542f\u4e0d\u4e22\n\n> \u8bf7\u4e0e **codeProxy v0.6.2** \u642d\u914d\uff1a\u65b0\u9762\u677f\u589e\u52a0\u4e86 Gemini \u751f\u56fe\u7684\u6bd4\u4f8b\u548c\u5206\u8fa8\u7387\u6863\u4f4d\uff0c\u5e76\u4f1a\u663e\u793a config.yaml \u4fdd\u5b58\u88ab\u62d2\u7edd\u7684\u539f\u56e0\u3002\u524d\u540e\u7aef\u8c01\u5148\u5347\u7ea7\u90fd\u53ef\u4ee5\uff0c\u8be6\u89c1\u5347\u7ea7\u63d0\u793a\u3002**`PUT /v0/management/config.yaml` \u73b0\u5728\u4f1a\u62d2\u7edd\u4ee5\u524d\u63a5\u53d7\u3001\u968f\u540e\u5374\u6084\u6084\u4e22\u6389\u7684\u4fdd\u5b58**\uff0c\u5199 config.yaml \u7684\u811a\u672c\u8bf7\u5148\u770b\u5347\u7ea7\u63d0\u793a\u3002\n\n## \u6838\u5fc3\u66f4\u65b0\n\n### 1. `/v1/images` \u548c\u63a7\u5236\u53f0\u652f\u6301 Antigravity \u7684 Gemini \u751f\u56fe\u6a21\u578b\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1aAntigravity \u4e0a\u7684 `gemini-3.1-flash-image` \u5df2\u7ecf\u80fd\u901a\u8fc7\u5bf9\u8bdd\u63a5\u53e3\u8fd4\u56de\u56fe\u7247\uff0c\u4f46\u751f\u56fe\u8fd9\u8fb9\u90fd\u7528\u4e0d\u4e86\u5b83\u3002`/v1/images/*`\u3001\u63a7\u5236\u53f0\u7684\u751f\u56fe\u9875\u548c\u6a21\u578b\u6d4b\u8bd5\u53ea\u5217\u51fa gpt-image\u3001Grok \u548c MiniMax\uff0cAntigravity \u6267\u884c\u5668\u4e5f\u4e0d\u8ba4\u8bc6\u751f\u56fe\u8bf7\u6c42\u3002\n* **\u65b0\u589e**\uff1a\n  * Antigravity \u8d26\u53f7\u63d0\u4f9b Gemini \u751f\u56fe\u6a21\u578b\u65f6\uff0c`/v1/images/generations` \u548c `/v1/images/edits` \u5c31\u80fd\u8c03\u7528\u5b83\u4eec\u3002Antigravity \u4ee5\u540e\u53d1\u5e03\u7684\u65b0\u6a21\u578b\u4e0d\u9700\u8981\u6539\u4ee3\u7801\u3002\n  * `aspect_ratio` \u548c `image_size` \u5bf9\u5e94 Gemini \u7684\u56fe\u7247\u53c2\u6570\uff1a\u4e0a\u6e38\u63a5\u53d7\u7684 14 \u79cd\u6bd4\u4f8b\uff08`1:1` \u5230 `21:9`\uff09\u548c `512` / `1K` / `2K` / `4K` \u56db\u6863\u3002\u4f20 `WIDTHxHEIGHT` \u5c3a\u5bf8\u65f6\u4f1a\u6362\u7b97\u6210\u6700\u63a5\u8fd1\u7684\u6bd4\u4f8b\u548c\u6863\u4f4d\uff0c\u539f\u6709\u5ba2\u6237\u7aef\u7167\u5e38\u53ef\u7528\u3002\n  * \u6bd4\u4f8b\u6309\u4e0a\u6e38\u81ea\u5df1\u7684\u5199\u6cd5\u53d1\u9001\u3002\u539f\u6765 `21:9` \u4f1a\u88ab\u7ea6\u5206\u6210 `7:3`\uff0c\u4e0a\u6e38\u4e0d\u8ba4\uff08#1148\uff09\u3002\n  * \u53c2\u8003\u56fe\u53ef\u4ee5\u4e0a\u4f20\uff0c\u4e5f\u53ef\u4ee5\u7528 base64 data URI\u3002\u4e0d\u6293\u53d6\u8fdc\u7a0b URL\uff0c\u4e0d\u652f\u6301\u8499\u7248\u3002\n  * \u54cd\u5e94\u91cc\u5e26\u771f\u5b9e\u7684 `output_format`\uff08Gemini \u8fd4\u56de JPEG\uff09\u3001\u50cf\u7d20 `size` \u548c token `usage`\u3002\u6ca1\u6709\u8fd4\u56de\u56fe\u7247\u7684\u8bf7\u6c42\uff08\u88ab\u5b89\u5168\u7b56\u7565\u62e6\u622a\u3001\u53ea\u8fd4\u56de\u4e86\u6587\u5b57\uff09\u6309\u65e0\u6548\u8bf7\u6c42\u5904\u7406\uff0c\u4e0d\u4f1a\u8ba9\u8d26\u53f7\u8fdb\u5165\u51b7\u5374\u3002\n  * \u5bf9\u8bdd\u63a5\u53e3\u6ca1\u6709\u4efb\u4f55\u53d8\u5316\u3002\n\n### 2. config.yaml \u4fdd\u5b58\u4e0d\u518d\u4e00\u8fb9\u62a5\u6210\u529f\u3001\u4e00\u8fb9\u4e22\u8bbe\u7f6e\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a`PUT /v0/management/config.yaml` \u5728\u4e24\u79cd\u60c5\u51b5\u4e0b\u8fd4\u56de `200 {\"ok\": true}`\uff0c\u6539\u52a8\u5374\u54ea\u91cc\u90fd\u6ca1\u7559\u4e0b\uff1a\n  * YAML \u91cc\u5199\u51fa\u7684\u8fd0\u884c\u65f6\u8bbe\u7f6e\uff08`proxy-url`\u3001`debug`\u3001`request-retry`\u3001`payload` \u7b49\uff09\u662f\u5728\u5199\u5b8c\u6587\u4ef6\u4e4b\u540e\u9010\u4e2a\u5b58\u8fdb\u6570\u636e\u5e93\u7684\u3002\u67d0\u4e2a\u952e\u5b58\u5931\u8d25\u53ea\u8bb0\u65e5\u5fd7\uff1b\u968f\u540e\u7684\u91cd\u8f7d\u628a\u5b83\u4ece\u6587\u4ef6\u91cc\u5220\u6389\uff0c\u518d\u5957\u56de\u6570\u636e\u5e93\u91cc\u7684\u65e7\u503c\u3002\n  * \u7531\u6570\u636e\u5e93\u7ba1\u7406\u7684\u6bb5\uff08`routing`\u3001`proxy-pool`\u3001`api-keys`\u3001`api-key-entries`\u3001`api-key-permission-profiles`\uff09\u88ab\u5199\u8fdb\u6587\u4ef6\u540e\uff0c\u53c8\u88ab\u5220\u6389\u6216\u88ab\u6570\u636e\u5e93\u91cc\u7684\u503c\u8986\u76d6\u3002\u624b\u5199\u8fdb\u53bb\u7684 API Key \u751a\u81f3\u4f1a\u5728\u90a3\u4e00\u4e2a\u8282\u70b9\u4e0a\u751f\u6548\uff0c\u76f4\u5230\u5b83\u4e0b\u6b21\u91cd\u542f\u3002\n* **\u4fee\u590d**\uff1a\n  * \u5148\u5b58\u8fd0\u884c\u65f6\u8bbe\u7f6e\uff0c\u5e76\u4e14\u653e\u5728\u4e00\u4e2a\u4e8b\u52a1\u91cc\u3002\u5b58\u5931\u8d25\u65f6\u4ec0\u4e48\u90fd\u4e0d\u6539\uff0c\u4fdd\u5b58\u88ab\u62d2\u7edd\uff0c\u8fd4\u56de `409 config_version_conflict`\uff0c\u6216\u8005\u9644\u5e26\u539f\u56e0\u7684 `500`\u3002\n  * \u4f1a\u6539\u52a8\u6570\u636e\u5e93\u7ba1\u7406\u6bb5\u7684\u4fdd\u5b58\uff0c\u5728\u5b58\u50a8\u548c\u5199\u6587\u4ef6\u4e4b\u524d\u5c31\u4ee5 `422 config_yaml_database_owned_sections` \u62d2\u7edd\u3002\u63d0\u793a\u91cc\u4f1a\u5217\u51fa\u6bcf\u4e2a\u6bb5\uff0c\u4ee5\u53ca\u5e94\u8be5\u53bb\u54ea\u4e2a\u9875\u9762\u4fee\u6539\uff1a\u6e20\u9053\u5206\u7ec4\u3001\u51fa\u7ad9\u4ee3\u7406\u3001API Keys \u6216\u95e8\u6237\u8d26\u53f7\u6743\u9650\u3002\u4e0e\u6570\u636e\u5e93\u4e2d\u73b0\u6709\u503c\u76f8\u540c\u7684\u5185\u5bb9\u7167\u5e38\u901a\u8fc7\uff0c\u5b98\u65b9\u793a\u4f8b Key \u548c\u6570\u636e\u5e93\u91cc\u8fd8\u6ca1\u6709\u7684\u6bb5\u4e5f\u7167\u5e38\u901a\u8fc7\u3002\n  * \u6570\u636e\u5e93\u91cc\u5df2\u6709 API Key \u540e\uff0c\u91cd\u8f7d\u65f6\u4f1a\u4ece config.yaml \u4e2d\u53bb\u6389 `api-keys` / `api-key-entries`\uff0c\u624b\u5199\u7684 Key \u4e0d\u4f1a\u518d\u53ea\u5728\u5355\u4e2a\u8282\u70b9\u4e0a\u751f\u6548\u3002\n  * \u53ea\u5f71\u54cd\u624b\u5199\u7684 YAML\uff0c\u9762\u677f\u7684\u4e13\u7528\u9875\u9762\u8d70\u5404\u81ea\u7684\u63a5\u53e3\u3002\n\n### 3. Codex \u6a21\u578b\u6e05\u5355\u91cd\u542f\u540e\u4e0d\u518d\u4e22\u5931\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a2026-10-11 \u4e00\u6b21\u90e8\u7f72\u91cd\u542f\u4e86\u751f\u4ea7\u670d\u52a1\uff0c\u4e4b\u540e\u534a\u5c0f\u65f6 Codex \u5ba2\u6237\u7aef\u4e00\u76f4\u6536\u5230 `502 unknown provider for model gpt-6.1-sol`\u3002\u5b9e\u65f6\u6a21\u578b\u6e05\u5355\u53ea\u5b58\u5728\u5185\u5b58\u91cc\uff0c\u91cd\u65b0\u62c9\u53d6\u53c8\u5931\u8d25\u4e86\uff1a\u62c9\u53d6\u65f6\u6309\u7cfb\u7edf\u79df\u6237\u7684\u4ee3\u7406\u6c60\u53bb\u89e3\u6790\u8d26\u53f7\u7684 `proxy_id`\uff0c\u800c\u4e0d\u662f\u8d26\u53f7\u6240\u5c5e\u79df\u6237\u7684\u4ee3\u7406\u6c60\uff0c\u800c\u7cfb\u7edf\u79df\u6237\u7684\u4ee3\u7406\u6c60\u4ecd\u6307\u5411\u5df2\u7ecf\u4e0b\u7ebf\u7684\u4ee3\u7406\u5730\u5740\u3002\n* **\u4fee\u590d**\uff1a\n  * \u6bcf\u6b21\u4ece\u4e0a\u6e38\u62c9\u5230\u7684\u6a21\u578b\u6e05\u5355\u90fd\u4f1a\u5b58\u5230\u72b6\u6001\u76ee\u5f55\u4e0b\u7684 `provider-model-lists.json`\uff0c\u542f\u52a8\u65f6\u5728\u7b2c\u4e00\u6b21\u6ce8\u518c\u524d\u6062\u590d\u3002\u6062\u590d\u7684\u6e05\u5355\u4f1a\u4e00\u76f4\u53c2\u4e0e\u8def\u7531\uff0c\u76f4\u5230\u88ab\u66f4\u65b0\u7684\u7ed3\u679c\u66ff\u6362\u3002\n  * \u6a21\u578b\u53d1\u73b0\uff08Codex \u6e05\u5355\uff0c\u4ee5\u53ca Antigravity\u3001xAI\u3001Kimi \u7684\u6309\u8d26\u53f7\u6e05\u5355\uff09\u6539\u7528\u8d26\u53f7\u6240\u5c5e\u79df\u6237\u7684\u914d\u7f6e\uff0c`proxy_id` \u5728\u8be5\u79df\u6237\u81ea\u5df1\u7684\u4ee3\u7406\u6c60\u91cc\u89e3\u6790\uff0c\u4e0e\u5bf9\u8bdd\u8bf7\u6c42\u4fdd\u6301\u4e00\u81f4\u3002\n\n### 4. Antigravity\uff1a\u957f Agent \u4f1a\u8bdd\u4e0e MALFORMED_FUNCTION_CALL\n\u7531 @testAccountDeltas\uff08#1143\u3001#1139\uff09\u548c @RUIIIOVO\uff08#1145\uff09\u8d21\u732e\uff0c\u611f\u8c22\u4e24\u4f4d\u3002\n* **\u4f1a\u8bdd\u8d85\u8fc7\u4e00\u767e\u4e07 token**\uff1aAntigravity \u4f1a\u6309 session id \u5728\u4e0a\u6e38\u7d2f\u79ef\u6574\u6bb5\u5bf9\u8bdd\u3002\u957f\u65f6\u95f4\u7684\u5de5\u5177\u5faa\u73af\u4e00\u65e6\u8d85\u8fc7 1,048,576 token\uff0c\u8fd9\u4e2a\u4f1a\u8bdd\u7684\u6bcf\u4e2a\u8bf7\u6c42\u90fd\u4f1a\u8fd4\u56de `400 \u2026 exceeds the maximum number of tokens`\uff0c\u5bf9\u8bdd\u5c31\u5361\u4f4f\u4e86\u3002\u73b0\u5728\u6267\u884c\u5668\u4f1a\u6362\u4e00\u4e2a\u65b0\u7684 session id \u91cd\u8bd5\uff0c\u6bcf\u4e2a\u8bf7\u6c42\u6700\u591a\u6362\u4e24\u6b21\uff0c\u4e0d\u5360\u7528\u5bb9\u91cf\u91cd\u8bd5\u7684\u6b21\u6570\u3002\u6ca1\u8d85\u8fc7\u4e0a\u9650\u7684\u4f1a\u8bdd\u7167\u5e38\u547d\u4e2d\u524d\u7f00\u7f13\u5b58\u3002\u6bcf\u4e00\u8f6e\u65b0\u7684\u5bf9\u8bdd\u4ecd\u4f1a\u5148\u7528\u539f\u6765\u7684\u4f1a\u8bdd\uff0c\u78b0\u5230\u4e00\u6b21\u5f88\u5feb\u8fd4\u56de\u7684 400 \u540e\u518d\u5207\u6362\u3002\n* **`MALFORMED_FUNCTION_CALL`**\uff1aGemini \u6709\u65f6\u8ba1\u5212\u8c03\u7528\u5de5\u5177\u5374\u6ca1\u6709\u53d1\u51fa\u8c03\u7528\uff0c\u53ea\u8f93\u51fa\u4e86\u601d\u8003\u5c31\u7ed3\u675f\u4e86\u8fd9\u4e00\u8f6e\u3002\u5ba2\u6237\u7aef\u4f1a\u628a\u5b83\u5f53\u4f5c\u6b63\u5e38\u7ed3\u675f\uff0cAgent \u5c31\u505c\u5728\u534a\u9014\u3002\u73b0\u5728\u53ea\u8981\u8fd8\u6ca1\u53d1\u51fa\u601d\u8003\u4ee5\u5916\u7684\u5185\u5bb9\uff0c\u6267\u884c\u5668\u5c31\u4f1a\u91cd\u65b0\u8bf7\u6c42\uff0c\u6700\u591a\u4e24\u6b21\u3002\u6d41\u5f0f\u5ba2\u6237\u7aef\u770b\u5230\u7684\u4ecd\u662f\u4e00\u4e2a\u54cd\u5e94\u3001\u4e00\u6b21\u7ed3\u675f\uff1b\u4e00\u65e6\u5df2\u7ecf\u53d1\u51fa\u6587\u5b57\u6216\u5de5\u5177\u8c03\u7528\uff0c\u5c31\u4fdd\u7559\u8fd9\u6b21\u56de\u7b54\u3002\n\n### 5. \u9ed8\u8ba4\u5206\u7ec4\u6392\u9664\u4e86\u67d0\u4e2a\u6a21\u578b\u65f6\uff0c\u9762\u677f\u6d4b\u8bd5\u7167\u5e38\u53ef\u7528\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a\u751f\u56fe\u63a7\u5236\u53f0\u3001\u89c6\u9891\u63a7\u5236\u53f0\u548c\u6a21\u578b\u6d4b\u8bd5\u9009\u8d26\u53f7\u7684\u65b9\u5f0f\u4e0e API \u8bf7\u6c42\u76f8\u540c\u3002\u88ab\u79df\u6237 `default` \u6e20\u9053\u5206\u7ec4\u6392\u9664\u7684\u6a21\u578b\u4f1a\u62a5 `model_not_allowed_by_channel_group`\uff0c\u6807\u4e86 `exclude-from-default` \u7684\u8d26\u53f7\u5219\u5b8c\u5168\u6d4b\u4e0d\u4e86\u3002\n* **\u4fee\u590d**\uff1a\u8fd9\u4e09\u5904\u9762\u677f\u6d4b\u8bd5\u53ef\u4ee5\u4f7f\u7528\u79df\u6237\u91cc\u7684\u4efb\u610f\u8d26\u53f7\uff0cAPI \u8bf7\u6c42\u4e0d\u53d7\u5f71\u54cd\u3002\n\n---\n\n## \u8be6\u7ec6\u6539\u52a8\n\n### \u540e\u7aef CliRelay\n- **feat(images)**\uff1a`/v1/images` \u548c\u63a7\u5236\u53f0\u652f\u6301 Antigravity \u7684 Gemini \u751f\u56fe\u6a21\u578b\uff08#1147\uff09\u3002\n- **fix(images)**\uff1aGemini \u6bd4\u4f8b\u6309\u4e0a\u6e38\u63a5\u53d7\u7684\u5199\u6cd5\u53d1\u9001\uff08#1148\uff09\u3002\n- **fix(management)**\uff1a\u9762\u677f\u6d4b\u8bd5\u53ef\u4ee5\u4f7f\u7528\u79df\u6237\u91cc\u7684\u4efb\u610f\u8d26\u53f7\uff08#1149\uff09\u3002\n- **fix(model-discovery)**\uff1a\u4e0a\u6e38\u6a21\u578b\u6e05\u5355\u91cd\u542f\u540e\u4e0d\u4e22\u5931\uff0c\u5e76\u901a\u8fc7\u8d26\u53f7\u6240\u5c5e\u79df\u6237\u7684\u4ee3\u7406\u62c9\u53d6\uff08#1150\uff09\u3002\n- **fix(management)**\uff1a\u8fd0\u884c\u65f6\u8bbe\u7f6e\u5b58\u50a8\u5931\u8d25\u65f6\u62d2\u7edd config.yaml \u4fdd\u5b58\uff08#1151\uff09\u3002\n- **fix(management)**\uff1a\u62d2\u7edd\u6539\u52a8\u6570\u636e\u5e93\u7ba1\u7406\u6bb5\u7684 config.yaml \u4fdd\u5b58\uff08#1152\uff09\u3002\n- **test(management)**\uff1a\u7528\u6d4b\u8bd5\u56fa\u5b9a `{\"error\": \"<\u4ee3\u7801>\", \"message\": \"<\u539f\u56e0>\"}` \u9519\u8bef\u4f53\u91cc\u7684\u539f\u56e0\uff0ccodeProxy v0.6.2 \u4f1a\u663e\u793a\u8fd9\u4e2a\u539f\u56e0\uff08#1153\uff09\u3002\n- **fix(antigravity)**\uff1a\u4f1a\u8bdd\u8fbe\u5230 1M token \u4e0a\u9650\u65f6\u8f6e\u6362 session id\uff08#1143\u3001#1139\uff0c\u4f5c\u8005 @testAccountDeltas\uff09\uff0cGemini \u4ee5 `MALFORMED_FUNCTION_CALL` \u7ed3\u675f\u65f6\u91cd\u65b0\u8bf7\u6c42\uff08#1145\uff0c\u4f5c\u8005 @RUIIIOVO\uff09\u3002\u4e24\u8005\u5728 #1154 \u4e2d\u4e00\u8d77\u5408\u5165\uff0c#1154 \u8fd8\u8ba9\u91cd\u65b0\u8bf7\u6c42\u4fdd\u6301\u5728\u8f6e\u6362\u540e\u7684\u4f1a\u8bdd\u4e0a\uff0c\u5e76\u8865\u5145\u4e86\u6267\u884c\u5668\u6d4b\u8bd5\u3002\n\n## \u5347\u7ea7\u63d0\u793a\n* **\u5199 config.yaml \u7684\u811a\u672c**\uff08`PUT /v0/management/config.yaml`\uff09\uff1a\n  * \u4ee5\u524d\u8fd4\u56de 200 \u7684\u4fdd\u5b58\u73b0\u5728\u53ef\u80fd\u5931\u8d25\uff1a`409 config_version_conflict`\u3001`422 config_yaml_database_owned_sections`\uff0c\u6216\u9644\u5e26\u539f\u56e0\u7684 `500`\u3002\u5931\u8d25\u7684\u4fdd\u5b58\u4e0d\u4f1a\u6539\u52a8\u4efb\u4f55\u5185\u5bb9\uff0c\u53ef\u4ee5\u91cd\u8bd5\uff0c\u6216\u6309\u63d0\u793a\u53bb\u5bf9\u5e94\u7684\u5730\u65b9\u4fee\u6539\u3002\n  * \u8def\u7531\u3001\u4ee3\u7406\u6c60\u548c API Key \u8bf7\u901a\u8fc7\u5404\u81ea\u7684\u7ba1\u7406\u63a5\u53e3\u4fee\u6539\uff0c\u4e0d\u8981\u5199\u8fdb config.yaml\u3002\n* **\u524d\u540e\u7aef\u8c01\u5148\u5347\u7ea7\u90fd\u53ef\u4ee5**\uff1a\n  * codeProxy v0.6.2 \u8dd1\u5728\u65e7\u540e\u7aef\u4e0a\u65f6\u4e0d\u663e\u793a Gemini \u751f\u56fe\u7684\u6bd4\u4f8b\u548c\u6863\u4f4d\uff0c\u5176\u4f59\u529f\u80fd\u90fd\u53ef\u4ee5\u7528\u3002\n  * \u65e7\u9762\u677f\u5728 v0.5.9 \u4e0a\u7167\u5e38\u53ef\u7528\u3002\u5b83\u7684\u5c3a\u5bf8\u9009\u62e9\u4ecd\u80fd\u9a71\u52a8 Gemini \u751f\u56fe\u6a21\u578b\uff0c\u53ea\u662f\u90e8\u5206\u88ab\u62d2\u7edd\u7684\u4fdd\u5b58\u53ea\u663e\u793a `invalid_config` \u8fd9\u6837\u7684\u9519\u8bef\u4ee3\u7801\u3002\n  * CliRelay \u5927\u7ea6\u6bcf\u4e09\u5c0f\u65f6\u4f1a\u81ea\u52a8\u62c9\u53d6 codeProxy \u7684\u6700\u65b0\u7248\u672c\u3002\n* **\u65b0\u7684\u72b6\u6001\u6587\u4ef6**\uff1a\u72b6\u6001\u76ee\u5f55\u4e0b\u7684 `provider-model-lists.json`\u3002\u5b83\u4ee5\u539f\u5b50\u65b9\u5f0f\u5199\u5165\uff0c\u540c\u4e00\u53f0\u673a\u5668\u4e0a\u7684\u84dd\u7eff\u4e24\u4e2a\u5b9e\u4f8b\u53ef\u4ee5\u5171\u7528\u3002\n* **\u65e0\u9700\u6539\u52a8**\uff1a\u914d\u7f6e\u548c\u6570\u636e\u5e93\u7ed3\u6784\u90fd\u6ca1\u6709\u53d8\u5316\u3002\n\n</details>\n\nMulti-arch binaries and the Docker image are published to GitHub Releases and GHCR. Released together with codeProxy v0.6.2.\n","mentions_count":2}
