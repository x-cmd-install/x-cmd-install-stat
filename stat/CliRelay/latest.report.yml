4\u53d6\u6309 IP \u9650\u6d41\u3001\u6309\u8d26\u53f7\u9650\u6d41\u548c\u51b7\u5374\u9636\u68af\u4e09\u8005\u4e2d\u6700\u957f\u7684\u4e00\u4e2a\u3002\n  * `login_rate_limited` \u548c `login_cooldown` \u54cd\u5e94\u9664\u4e86 `Retry-After` \u5934\uff0c\u54cd\u5e94\u4f53\u91cc\u4e5f\u5e26 `details.retry_after_seconds`\u3002\n\n### 3. \u5230 chatgpt.com \u7684 HTTP/2 \u7a7a\u95f2\u8fde\u63a5\u4e0d\u518d\u5806\u79ef\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a\u6709\u7528\u6237\u53cd\u9988\uff0c\u4e00\u4e2a relay \u5230 `chatgpt.com:443` \u6709 373 \u6761\u8fde\u63a5\uff0c\u90fd\u5df2\u5b58\u5728\u597d\u51e0\u4e2a\u5c0f\u65f6\uff0c\u6bcf\u6761\u6bcf\u5c0f\u65f6\u5355\u5411\u53ea\u6536\u53d1\u7ea6 4.7 kB\u3002\u751f\u4ea7\u73af\u5883\u4e5f\u4e00\u6837\uff1a\u90e8\u7f72 3.5 \u5c0f\u65f6\u540e\u5df2\u6709 218 \u6761\u8fd9\u6837\u7684\u8fde\u63a5\u3002\u539f\u56e0\u662f\u4e24\u4e2a\u95ee\u9898\u53e0\u52a0\uff1a\n  * Codex \u989d\u5ea6\u63a2\u6d4b\u6bcf\u6b21\u8c03\u7528\u90fd\u65b0\u5efa\u4e00\u4e2a\u5e26\u6307\u7eb9\u7684\u4f20\u8f93\u5c42\uff0c\u4e5f\u5c31\u65b0\u5efa\u4e00\u6761 HTTP/2 \u8fde\u63a5\uff0c\u7528\u5b8c\u5c31\u4e22\u4e0b\u4e0d\u7ba1\u3002`account-status-refresh` \u9ed8\u8ba4\u5f00\u542f\uff0c\u6bcf 15 \u5206\u949f\u63a2\u6d4b\u4e00\u904d\u6240\u6709 Codex \u8d26\u53f7\uff0c\u6240\u4ee5\u6bcf\u8f6e\u6bcf\u4e2a\u8d26\u53f7\u6cc4\u6f0f\u4e00\u6761\u8fde\u63a5\uff0c\u6709\u91cd\u7f6e\u989d\u5ea6\u7684\u8d26\u53f7\u6cc4\u6f0f\u4e24\u6761\u3002\n  * v0.5.7 \u52a0\u5165\u7684\u5065\u5eb7\u68c0\u67e5 PING \u6ca1\u6709\u914d\u7a7a\u95f2\u8d85\u65f6\u3002PING \u8ba9\u8fd9\u4e9b\u88ab\u4e22\u5f03\u7684\u8fde\u63a5\u4e00\u76f4\u6709\u6d41\u91cf\uff0c\u6240\u4ee5\u6c38\u8fdc\u6ca1\u6709\u4eba\u53bb\u5173\u95ed\u5b83\u4eec\u3002\n* **\u4fee\u590d**\uff1a\n  * \u4e24\u4e2a\u81ea\u7ba1\u7684 HTTP/2 \u4f20\u8f93\u5c42\uff08Anthropic \u7528\u7684\u548c TLS \u6307\u7eb9\u63d0\u4f9b\u5546\u7528\u7684\uff09\u90fd\u4f1a\u5173\u95ed 90 \u79d2\u5185\u6ca1\u6709\u627f\u8f7d\u8bf7\u6c