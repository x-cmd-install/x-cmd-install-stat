71\u54cd\u3002\n\n## \u8be6\u7ec6\u6539\u52a8\n- **chore(deps)**\uff1a\u5347\u7ea7\u5230 Go 1.26.9 \u548c `golang.org/x/net` v0.60.0\uff0c\u4fee\u590d GO-2026-6603 \u81f3 GO-2026-6617\uff1bDocker \u6784\u5efa\u955c\u50cf\u6539\u4e3a `golang:1.26.9-alpine`\uff08#1141\uff09\u3002\n- **fix(auth)**\uff1a\u767b\u5f55\u9501\u5b9a\u524d\u7ed9\u51fa\u9884\u8b66\u5e76\u8bf4\u660e\u9501\u5b9a\u65f6\u957f\uff0c\u7ba1\u7406\u7aef\u4e0e\u95e8\u6237\u5171\u7528\u540c\u4e00\u5957\u51b7\u5374\u9636\u68af\uff08#1136\uff09\u3002\n- **fix(http2)**\uff1a\u4fee\u590d\u88ab PING \u4fdd\u6d3b\u7684\u7a7a\u95f2\u8fde\u63a5\u5728 chatgpt.com \u4e0a\u5806\u79ef\uff1a\u4e3a\u81ea\u7ba1 HTTP/2 \u4f20\u8f93\u5c42\u52a0\u7a7a\u95f2\u8d85\u65f6\uff0c\u7f13\u5b58\u7ba1\u7406\u7aef\u6307\u7eb9\u4f20\u8f93\u5c42\uff0c\u8fde\u63a5\u7f13\u5b58\u6539\u6309 `host:port` \u533a\u5206\uff08#1137\uff09\u3002\n- **fix(api-call)**\uff1a\u7f3a\u5c11 auth_index \u6216\u5339\u914d\u4e0d\u5230\u51ed\u636e\u65f6\u62d2\u7edd `$TOKEN$` \u8bf7\u6c42\u5934\uff08#1138\uff09\u3002\n- **feat(menus)**\uff1a\u5728\u300c\u7cfb\u7edf\u8bbe\u7f6e\u300d\u4e0b\u65b0\u589e\u5916\u89c2\u9875\uff08#1134\uff09\uff0c\u53d1\u5e03\u524d\u968f\u9762\u677f\u628a\u8bbe\u7f6e\u79fb\u5230\u9876\u680f\u6309\u94ae\u800c\u64a4\u56de\uff08#1135\uff09\u3002\u5982\u679c\u5f00\u53d1\u7248\u672c\u5199\u5165\u8fc7\u8be5\u83dc\u5355\u9879\uff0c\u542f\u52a8\u65f6\u4f1a\u5220\u9664\uff1b\u4ece v0.5.7 \u5347\u7ea7\u4e0d\u4f1a\u6539\u53d8\u83dc\u5355\u3002\n\n## \u5347\u7ea7\u63d0\u793a\n* **\u5b89\u5168**\uff1a\u672c\u7248\u4fee\u590d\u4e86 Go \u548c `golang.org/x/net` \u4e2d\u7684 11 \u4e2a\u6f0f\u6d1e\uff0c\u5373\u4f7f\u7528\u4e0d\u5230\u5176\u4ed6\u6539\u52a8\u4e5f\u5efa\u8bae\u5347\u7ea7\u3002\n* **\u524d\u540e\u7aef\u8c01\u5148\u5347\u7ea7\u90fd\u53ef\u4ee5**\uff1a\n  * \u65e9\u4e8e codeProxy v0.6.1 \u7684\u9762\u677f\u4e0d\u663e\u793a\u5269\u4f59\u6b21\u6570\uff0c\u4e5f\u6ca1\u6709\u5012\u8ba1\u65f6\uff1b\u5176\u7ba1\u7406\u7aef\u767b\u5f55\u5728