state":"uploaded","size":15710991,"digest":"sha256:012a7eb0b4930764b49d74ba8b9741e4010b43c825aaf8f29aefd90cbf139824","download_count":1,"created_at":"2026-09-30T02:07:16Z","updated_at":"2026-09-30T02:07:17Z"}],"body":"# v0.5.6 - \u591a\u8282\u70b9\u96c6\u7fa4\u3001\u6eda\u52a8\u53d1\u5e03\u4e0e Codex \u65b0\u6a21\u578b\u5373\u65f6\u53ef\u7528 / Multi-node Cluster, Rolling Deploys, and Live Codex Models\n\n## \u6838\u5fc3\u66f4\u65b0\u4eae\u70b9 / Highlights\n\n### 1. Codex \u65b0\u6a21\u578b\u4e0d\u7528\u518d\u7b49\u4e00\u6b21\u53d1\u7248 / New Codex models work without a release\n* **\u8bf7\u6c42\u5e26\u4e0a\u5f53\u524d\u5b98\u65b9 CLI \u7248\u672c**\uff1aChatGPT \u4f1a\u6309\u5ba2\u6237\u7aef\u7248\u672c\u62d2\u7edd\u6a21\u578b\u3002`gpt-6.1-sol` \u5728 `codex_cli_rs/0.149.1` \u548c\u6e05\u5355\u91cc\u5199\u7684 `0.153.0` \u4e0a\u90fd\u4f1a\u88ab\u62d2\uff0c\u5f53\u524d\u7a33\u5b9a\u7248 `0.159.1` \u53ef\u4ee5\u901a\u8fc7\u3002\u8bf7\u6c42\u73b0\u5728\u4f7f\u7528\u5b98\u65b9 Codex CLI \u7684\u6700\u65b0\u7a33\u5b9a\u7248\u672c\uff1b\u7248\u672c\u6e90\u6682\u65f6\u4e0d\u53ef\u7528\u65f6\uff0c\u9000\u56de\u5230\u5df2\u7ecf\u9a8c\u8bc1\u80fd\u8fc7\u95e8\u7684\u7248\u672c\uff0c\u6709\u66f4\u65b0\u7684\u7248\u672c\u4f1a\u81ea\u52a8\u8ddf\u4e0a\u3002\n* **\u6839\u76ee\u5f55\u6e20\u9053\u81ea\u52a8\u5e26\u4e0a\u65b0\u6a21\u578b**\uff1a\u9ed8\u8ba4\u6e20\u9053\u7ec4\u7684\u5141\u8bb8\u5217\u8868\u4e0d\u518d\u6321\u4f4f Codex \u521a\u521a\u53d1\u73b0\u7684\u6a21\u578b\u3002\u6a21\u578b\u5e7f\u573a\u4e0d\u7528\u518d\u53bb\u6839\u76ee\u5f55\u6e20\u9053\u624b\u52a8\u52fe\u9009\u3002\u5df2\u7ecf\u6392\u9664\u7684\u6a21\u578b\u4ecd\u7136\u6392\u9664\uff0c\u5176\u5b83\u6e20\u9053\u7ec4\u4fdd\u6301\u539f\u6765\u7684\u56fa\u5b9a\u540d\u5355\u3002\n\n### 2. \u591a\u8282\u70b9\u96c6\u7fa4 / Multi-node cluster\n* **\u5171\u4eab\u8fd0\u884c\u65f6\u72b6\u6001**\uff1a\u51ed\u8bc1\u3001\u914d\u7f6e\u3001\u8def\u7531\u3001\u4f1a\u8bdd\u4eb2\u548c\u3001\u8d26\u53f7\u5e76\u53d1\u3001API Key \u4e0e\u7ec8\u7aef\u7528\u6237\u9650\u989d\u3001\u51b7\u5374\u3001\u767b\u5f55\u8282\u6d41\u53ef\u4ee5\u8de8\u8282\u70b9\u5171\u4eab\u3002\n* **\u8282\u70b9\u8eab\u4efd\u4e0e\u5c31\u7eea**\uff1a\u8fdb\u7a0b\u5e26\u4e0a\u8282\u70b9\u8eab\u4efd\uff0c`/readyz` \u80fd\u533a\u5206\u672c\u8282\u70b9\u548c\u96c6\u7fa4\u3002\u7528\u91cf\u65e5\u5fd7\u5728\u6570\u636e\u5e93\u4e2d\u65ad\u65f6\u4ecd\u4f1a\u7559\u4e0b\uff0c\u914d\u989d\u5728\u6700\u8fd1\u4e00\u6b21\u7528\u91cf\u8bfb\u6570\u4e0a\u7ee7\u7eed\u653e\u884c\u3002\n* **DNS \u4e0e\u51fa\u53e3**\uff1a`clirelay-dnswatch` \u6309\u8282\u70b9\u5065\u5eb7\u548c\u51fa\u53e3\u63a2\u6d4b\u8c03\u6574\u8bb0\u5f55\uff0c\u907f\u514d\u628a\u6d41\u91cf\u5207\u5230\u51fa\u4e0d\u4e86\u7f51\u7684\u8282\u70b9\u3002\n* **\u5907\u4efd**\uff1aPostgreSQL \u57fa\u7840\u5907\u4efd\u3001WAL \u5f52\u6863\uff0c\u4ee5\u53ca\u6bcf\u5468\u6062\u590d\u6f14\u7ec3\u3002\n\n### 3. \u53d1\u5e03\u6539\u4e3a\u5355\u5b9e\u4f8b\u66ff\u6362 / Deploys replace the one live process\n* **\u4e0d\u518d\u53e6\u8d77\u7b2c\u4e8c\u4e2a\u69fd**\uff1a\u540c\u4e00\u53f0\u673a\u5668\u4e0a\u7684\u7b2c\u4e8c\u4e2a\u8fdb\u7a0b\u4f1a\u62a2\u540c\u4e00\u4e2a\u96c6\u7fa4\u8282\u70b9\u8eab\u4efd\u3002\u53d1\u5e03\u73b0\u5728\u66ff\u6362 nginx \u6b63\u5728\u8f6c\u53d1\u7684\u90a3\u4e00\u4e2a\u8fdb\u7a0b\uff0c\u5931\u8d25\u65f6\u628a\u4e0a\u4e00\u4efd\u4e8c\u8fdb\u5236\u6362\u56de\u53bb\u3002\n* **\u591a\u8282\u70b9\u4ecd\u9010\u53f0\u6eda\u52a8**\uff1a\u4e00\u53f0\u5065\u5eb7\u4e4b\u540e\u624d\u7ee7\u7eed\u4e0b\u4e00\u53f0\uff0c\u5e76\u652f\u6301\u7ecf\u8df3\u677f\u673a\u8fde\u63a5\u3002\n\n---\n\n## \u8be6\u7ec6\u6539\u52a8\u8bb0\u5f55 / Detailed Changes\n\n### \u540e\u7aef CliRelay\n- **fix(codex)**\uff1a\u8bf7\u6c42\u4f7f\u7528\u5f53\u524d\u5b98\u65b9 CLI \u7248\u672c\uff1b\u9ed8\u8ba4\u6e20\u9053\u7ec4\u81ea\u52a8\u63a5\u7eb3 Codex \u53d1\u73b0\u7684\u65b0\u6a21\u578b\uff08#1109\uff09\u3002\n- **feat(cluster)**\uff1aPostgreSQL \u534f\u8c03\u5668\u3001Redis \u5171\u4eab\u72b6\u6001\u3001\u8de8\u8282\u70b9\u9650\u989d / \u4f1a\u8bdd / \u51b7\u5374 / \u914d\u7f6e / \u51ed\u8bc1\uff08#1092\u2013#1099\uff09\u3002\n- **feat(deploy)**\uff1a\u9010\u8282\u70b9\u6eda\u52a8\u53d1\u5e03\u3001\u8282\u70b9\u81ea\u5df1\u7684\u8d44\u6e90\u9650\u5236\u3001\u53ef\u9009\u8df3\u677f\u673a\uff08#1094\u3001#1098\uff09\u3002\n- **feat(egress)**\uff1a`/readyz/egress`\uff0cDNS \u4f18\u5148\u9009\u62e9\u51fa\u53e3\u6b63\u5e38\u7684\u8282\u70b9\uff08#1100\uff09\u3002\n- **feat(cluster)**\uff1a\u57fa\u7840\u5907\u4efd\u3001WAL \u4e0e\u6bcf\u5468\u6062\u590d\u6f14\u7ec3\uff08#1107\uff09\u3002\n- **fix(update)**\uff1a\u66f4\u65b0\u5668\u7f3a\u5931\u65f6\u8fd4\u56de 503 \u800c\u4e0d\u662f 502\uff08#1106\uff09\u3002\n- **fix(cluster)**\uff1a\u964d\u7ea7\u8282\u70b9\u91cd\u65b0\u52a0\u5165\u65f6\u4e0d\u518d\u62d6\u4f4f\u6574\u4e2a\u96c6\u7fa4\uff1b\u84dd\u7eff\u7ee7\u4efb\u8005\u4fdd\u7559\u539f\u8282\u70b9\u7684\u6210\u5458\u884c\uff08#1099\u3001#1105\uff09\u3002\n\n## \u5347\u7ea7\u63d0\u793a / Upgrade Notes\n* \u5355\u8282\u70b9\u90e8\u7f72\u4f1a\u66ff\u6362\u5f53\u524d\u6b63\u5728\u670d\u52a1\u7684\u8fdb\u7a0b\uff0c\u5207\u6362\u671f\u95f4\u6709\u77ed\u6682\u4e2d\u65ad\uff0c\u4e0d\u518d\u5e76\u884c\u542f\u52a8\u7b2c\u4e8c\u4e2a\u69fd\u3002\n* \u96c6\u7fa4\u6a21\u5f0f\u9700\u8981\u6309 `deploy/cluster` \u7684\u8bf4\u660e\u51c6\u5907 PostgreSQL\u3001Redis \u548c\u8282\u70b9\u8eab\u4efd\u3002\u6ca1\u6253\u5f00\u96c6\u7fa4\u914d\u7f6e\u7684\u5355\u8282\u70b9\u884c\u4e3a\u4e0e\u539f\u6765\u4e00\u81f4\uff0c\u53ea\u662f\u53d1\u5e03\u65b9\u5f0f\u6539\u6210\u5355\u5b9e\u4f8b\u66ff\u6362\u3002\n* \u9762\u677f\u8bf7\u642d\u914d codeProxy **v0.5.4**\u3002\n\n\u672a\u8fdb\u5165\u672c\u6b21\u53d1\u7248\u3001\u4ecd\u5f00\u5728 `dev` \u4e0a\u7684 PR\uff1a#1108\u3001#1104\u3001#1101\u3001#1086\u3001#1085\u3002\n"}
