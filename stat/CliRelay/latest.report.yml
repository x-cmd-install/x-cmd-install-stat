8:40:15Z","updated_at":"2026-10-07T18:40:16Z"},{"id":619491960,"node_id":"RA_kwDORZ9jAc4k7LJ4","name":"CliRelay_0.5.7_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":17107566,"digest":"sha256:4a2cf25ce5636ee9b07438a8106239098290c0346b7e978f8167018490697d32","download_count":0,"created_at":"2026-10-07T18:40:13Z","updated_at":"2026-10-07T18:40:14Z"},{"id":619491967,"node_id":"RA_kwDORZ9jAc4k7LJ_","name":"CliRelay_0.5.7_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15698472,"digest":"sha256:a7e85a92bc713fc5b3e4fdd6fca0d876c8fb8124bff2548eee4c78be9f375c6f","download_count":0,"created_at":"2026-10-07T18:40:13Z","updated_at":"2026-10-07T18:40:14Z"},{"id":619491955,"node_id":"RA_kwDORZ9jAc4k7LJz","name":"CliRelay_0.5.7_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17450568,"digest":"sha256:e1370affc8705c646ba392f1385b26750e091e40ce32e9914f65f74f2d067f61","download_count":0,"created_at":"2026-10-07T18:40:13Z","updated_at":"2026-10-07T18:40:14Z"},{"id":619491954,"node_id":"RA_kwDORZ9jAc4k7LJy","name":"CliRelay_0.5.7_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15838630,"digest":"sha256:d7dbc8fe02bcf5974f5aae35a3dc4fb1ad2184448000ca6b18f73bc17a522b7b","download_count":0,"created_at":"2026-10-07T18:40:13Z","updated_at":"2026-10-07T18:40:14Z"}],"body":"# v0.5.7 - Monitor Center API, Credential Imports, and Faster Recovery From Dead Connections\n\n> Pair this release with **codeProxy v0.6.0**. The redesigned panel's monitor center, guided \"Add AI account\" dialog and credential imports use the endpoints added here. Upgrade the backend first; see [Upgrade Notes](#upgrade-notes).\n\n## Highlights\n\n### 1. Monitor center endpoints\n* **What was missing:** the monitor page could only read `/usage/chart-data`: request counts, a success rate and token totals. There were no latency percentiles, first-token times, failure sources, rankings or live traffic.\n* **Overview:** `GET /v0/management/usage/monitor/overview`.\n  * Ranges `1h`, `6h`, `24h`, `today`, `7d`, `14d` and `30d`, filterable by portal user or API key, model and channel.\n  * Totals compared with the previous period of equal length, and continuous zero-filled series.\n  * Latency and first-token P50 / P90 / P95 / P99 / max / avg with a histogram.\n  * Model, channel and portal-user rankings with sparklines, a weekday \u00d7 hour heatmap, the consumer \u2192 model \u2192 channel flow, and recent failures.\n* **Realtime:** `GET /v0/management/usage/monitor/realtime` covers the last hour per minute, current and peak RPM / TPM, and a five-minute window. It is cheap enough to poll every 15 seconds.\n* **Built to stay cheap:**\n  * Totals, series, rankings, heatmap and flows read the rollup buckets, so they cover the whole history.\n  * Percentiles read request details only inside their retention window, and the response says where coverage starts.\n  * A section that fails is logged and returned empty instead of failing the page.\n  * Both endpoints are tenant-scoped and need `monitor.read`.\n* **Timezone label:** services started without `TZ` reported their zone as `Local`. The label is now the IANA name, or the UTC offset (`UTC+08:00`) when the zone has no name. Bucket edges are unchanged.\n\n### 2. Add AI accounts from credentials you already hold\n* **What's new:** besides the browser and device sign-ins, an account can now be added from a credential you hold. CliRelay exchanges it for the same tokens a browser login would mint and saves the account under the caller's tenant. Four imports are supported:\n  * a claude.ai session cookie;\n  * an OpenAI / Codex CLI refresh token;\n  * a Google / Antigravity refresh token;\n  * a Grok web SSO cookie.\n* **Errors that say what went wrong:**\n  * A bad credential returns `422`. It is never `401`, which the panel would read as its own session expiring.\n  * A Cloudflare challenge returns `502` and is reported as an egress problem rather than a bad credential. A timeout returns `504`.\n  * Secrets an upstream echoes back are masked in the message.\n* The permission is `auth_files.oauth`, the same as for OAuth sign-in.\n\n### 3. OAuth sign-ins report how they finish\n* **What was wrong:** the panel only received a URL and a state, so it showed one generic \"paste the callback URL\" box for every provider, including device-code providers where there is nothing to paste. A login that had expired, or that had been replaced by a newer one, also read as `{\"status\":\"ok\"}`, which the panel showed as success.\n* **The fix:**\n  * The `*-auth-url` endpoints now return `flow` (`redirect`, `code` or `device`), `expires_at`, and for device logins `user_code`, `verification_uri` and `expires_in`.\n  * Claude accepts `?callback_mode=code`. Anthropic's own code page is then used, so a remote panel never sends the browser to a localhost forwarder.\n  * Expired and superseded logins are reported as such. Late callbacks get `409` with `oauth_login_expired` or `oauth_login_superseded`, on a single node and in cluster mode.\n\n### 4. Dead HTTP/2 connections are detected in about 45 seconds instead of about 15 minutes\n* **What was wrong:** the fingerprinted transports, for Anthropic and the TLS-fingerprinted providers, reuse one HTTP/2 connection per host. A connection that had silently died still looked usable. A request written onto it was retransmitted until the kernel gave up, roughly 15 minutes on Linux, while the client waited. This was observed in production against Anthropic.\n* **The fix:** both transports now ping a connection that has been idle for 30 seconds. If no reply arrives within 15 seconds, the connection is closed and the next request redials.\n* **Thanks** to @RUIIIOVO for the diagnosis and the fix (#1085).\n\n### 5. Images returned by tools stay images\n* **What was wrong:** when a tool returned an image, such as a screenshot or a rendered chart, every request translator turned it into text. A single 1.9 MB screenshot became about 2.47 million text tokens and failed with `prompt is too long` or an upstream 400.\n* **The fix:** a shared tool-result parser keeps images as image parts across the OpenAI Chat, Responses, Claude and Gemini translators, including mixed text-and-image results. A guard logs a warning if a large `data:image/` payload ever leaks into text again.\n* **Thanks** to @RUIIIOVO (#1086).\n\n### 6. Claude keeps its reasoning through `/v1/responses`\n* **What was wrong:** with a Claude model behind `/v1/responses`, follow-up turns lost the chain of thought. Thinking signatures were dropped on the way out, and replayed reasoning items were dropped on the way in.\n* **The fix:** signatures are captured and emitted, replayed reasoning is accepted, and the order of reasoning, tool and function output is preserved in streamed and non-streamed responses.\n* **Thanks** to @RUIIIOVO (#1104).\n\n### 7. Claude Sonnet 5.5\n* `claude-sonnet-5-5` is in the model registry, with a 1M context window and 128k output.\n* It is also in the Command Code fallback list and has Bedrock mappings.\n* The default Claude Code fingerprint version is now `2.1.284`, the first version that offers the model.\n* **Thanks** to @RUIIIOVO (#1108).\n\n### 8. Startup no longer waits for upstream model lists\n* **What was wrong:** on 2026-09-25 a node that had lost its route to the residential proxies needed more than 200 seconds before its HTTP listener came up. Startup fetched each credential's model list one after another.\n* **The fix:** credentials register immediately from their saved model lists, and live lists refresh in the background. Model removals are persisted, and concurrent registrations can no longer overwrite each other.\n\n### 9. Grok CLI 1.0.46\n* `cli-chat-proxy.grok.com` rejects client versions below 1.0.13. The default xAI fingerprint and the account-status probes now advertise `1.0.46`, from one shared constant.\n* **Thanks** to @lovinrain (#1124).\n\n---\n\n## Detailed Changes\n\n### Backend CliRelay\n- **feat(usage)**: monitor center overview and realtime endpoints (#1129).\n- **fix(usage)**: label the monitor timezone by its UTC offset when Go only calls it \"Local\" (#1130).\n- **feat(oauth)**: add accounts from held credentials, not just by signing in (#1128).\n- **feat(oauth)**: tell the panel how each login finishes (#1127).\n- **fix(http2)**: detect dead pooled connections instead of waiting on the kernel (#1085, landed through #1125).\n- **fix(translator)**: preserve tool-result images across translators (#1120, from #1086 and #1116).\n- **fix(translator)**: preserve Claude Responses reasoning and output ordering (#1121, from #1104 and #1117).\n- **feat(registry)**: Claude Sonnet 5.5, Claude Code fingerprint 2.1.284, Bedrock mappings (#1112, from #1108).\n- **fix(startup)**: register credentials without waiting on upstream model listings; persist removals and guard registration races (#1118, from #1101 and #1115).\n- **fix(xai)**: advertise Grok CLI 1.0.46 to cli-chat-proxy and on billing probes (#1124, #1126).\n- **docs(readme)**: rewrite README and README_CN around the redesigned panel, with new screenshots (#1131).\n\n## Upgrade Notes\n* **Upgrade the backend before the panel.** CliRelay pulls the latest codeProxy release on its own, roughly every three hours.\n  * Backends older than v0.5.7 still work with panel v0.6.0, in a compatibility mode: the monitor center shows the daily view, and credential imports ask you to update the backend.\n* **Claude Code version:** client User-Agents older than Claude Code 2.1.284 are replaced with the canonical one, as introduced in #1050. Update local Claude Code installs if you rely on the client's own User-Agent.\n* **No changes required:** there are no configuration or database changes.\n\n<details>\n<summary>\u4e2d\u6587\u8bf4\u660e\uff08\u70b9\u51fb\u5c55\u5f00\uff09</summary>\n\n# v0.5.7 - \u76d1\u63a7\u4e2d\u5fc3\u63a5\u53e3\u3001\u51ed\u636e\u5bfc\u5165\uff0c\u4ee5\u53ca\u66f4\u5feb\u8bc6\u522b\u5931\u6548\u8fde\u63a5\n\n> \u672c\u7248\u9700\u4e0e **codeProxy v0.6.0** \u642d\u914d\u3002\u65b0\u7248\u9762\u677f\u7684\u76d1\u63a7\u4e2d\u5fc3\u3001\u5f15\u5bfc\u5f0f\u300c\u6dfb\u52a0 AI \u8d26\u53f7\u300d\u548c\u51ed\u636e\u5bfc\u5165\u90fd\u4f9d\u8d56\u8fd9\u91cc\u65b0\u589e\u7684\u63a5\u53e3\u3002\u8bf7\u5148\u5347\u7ea7\u540e\u7aef\uff0c\u8be6\u89c1\u4e0b\u65b9\u5347\u7ea7\u63d0\u793a\u3002\n\n## \u6838\u5fc3\u66f4\u65b0\n\n### 1. \u76d1\u63a7\u4e2d\u5fc3\u63a5\u53e3\n* **\u539f\u6765\u7f3a\u4ec0\u4e48**\uff1a\u76d1\u63a7\u9875\u53ea\u80fd\u8bfb `/usage/chart-data`\uff0c\u53ea\u6709\u8bf7\u6c42\u6570\u3001\u6210\u529f\u7387\u548c token \u603b\u91cf\u3002\u770b\u4e0d\u5230\u5ef6\u8fdf\u5206\u4f4d\u3001\u9996 token \u65f6\u95f4\u3001\u5931\u8d25\u6765\u6e90\u548c\u6392\u884c\uff0c\u4e5f\u6ca1\u6709\u5b9e\u65f6\u6d41\u91cf\u3002\n* **\u6982\u89c8\u63a5\u53e3** `GET /v0/management/usage/monitor/overview`\uff1a\n  * \u65f6\u95f4\u8303\u56f4 `1h`\u3001`6h`\u3001`24h`\u3001`today`\u3001`7d`\u3001`14d`\u3001`30d`\uff0c\u53ef\u6309\u95e8\u6237\u7528\u6237\u6216 API Key\u3001\u6a21\u578b\u3001\u6e20\u9053\u8fc7\u6ee4\u3002\n  * \u6c47\u603b\u503c\u4e0e\u4e0a\u4e00\u4e2a\u7b49\u957f\u5468\u671f\u5bf9\u6bd4\uff0c\u65f6\u95f4\u5e8f\u5217\u8fde\u7eed\u8865\u96f6\u3002\n  * \u5ef6\u8fdf\u548c\u9996 token \u7684 P50 / P90 / P95 / P99 / \u6700\u5927 / \u5e73\u5747\uff0c\u9644\u76f4\u65b9\u56fe\u3002\n  * \u6a21\u578b\u3001\u6e20\u9053\u3001\u95e8\u6237\u7528\u6237\u6392\u884c\uff08\u5e26\u8ff7\u4f60\u8d8b\u52bf\uff09\uff0c\u661f\u671f \u00d7 \u5c0f\u65f6\u70ed\u529b\u56fe\uff0c\u7528\u6237 \u2192 \u6a21\u578b \u2192 \u6e20\u9053\u6d41\u5411\uff0c\u4ee5\u53ca\u6700\u8fd1\u5931\u8d25\u3002\n* **\u5b9e\u65f6\u63a5\u53e3** `GET /v0/management/usage/monitor/realtime`\uff1a\u6700\u8fd1\u4e00\u5c0f\u65f6\u9010\u5206\u949f\u6570\u636e\uff0c\u5f53\u524d\u4e0e\u5cf0\u503c RPM / TPM\uff0c\u4ee5\u53ca\u4e94\u5206\u949f\u7a97\u53e3\uff0c\u5f00\u9500\u5c0f\u5230\u53ef\u4ee5 15 \u79d2\u8f6e\u8be2\u4e00\u6b21\u3002\n* **\u63a7\u5236\u5f00\u9500**\uff1a\n  * \u6c47\u603b\u3001\u5e8f\u5217\u3001\u6392\u884c\u3001\u70ed\u529b\u56fe\u548c\u6d41\u5411\u8bfb\u9884\u805a\u5408\u6876\uff0c\u8986\u76d6\u5168\u90e8\u5386\u53f2\u3002\n  * \u5206\u4f4d\u6570\u53ea\u8bfb\u4fdd\u7559\u671f\u5185\u7684\u8bf7\u6c42\u8be6\u60c5\uff0c\u5e76\u8fd4\u56de\u8986\u76d6\u8d77\u70b9\u3002\n  * \u67d0\u4e00\u90e8\u5206\u51fa\u9519\u53ea\u8bb0\u65e5\u5fd7\u3001\u8fd4\u56de\u7a7a\uff0c\u4e0d\u4f1a\u62d6\u57ae\u6574\u9875\u3002\n  * \u4e24\u4e2a\u63a5\u53e3\u90fd\u6309\u79df\u6237\u9694\u79bb\uff0c\u9700\u8981 `monitor.read` \u6743\u9650\u3002\n* **\u65f6\u533a\u6807\u7b7e**\uff1a\u6ca1\u6709\u8bbe\u7f6e `TZ` \u7684\u670d\u52a1\u539f\u6765\u628a\u65f6\u533a\u663e\u793a\u4e3a `Local`\uff0c\u73b0\u5728\u663e\u793a IANA \u540d\u79f0\uff0c\u6ca1\u6709\u540d\u79f0\u65f6\u663e\u793a UTC \u504f\u79fb\uff08\u5982 `UTC+08:00`\uff09\u3002\u5206\u6876\u8fb9\u754c\u4e0d\u53d8\u3002\n\n### 2. \u7528\u5df2\u6709\u51ed\u636e\u6dfb\u52a0 AI \u8d26\u53f7\n* **\u65b0\u589e**\uff1a\u9664\u4e86\u6d4f\u89c8\u5668\u767b\u5f55\u548c\u8bbe\u5907\u7801\u767b\u5f55\uff0c\u73b0\u5728\u4e5f\u53ef\u4ee5\u76f4\u63a5\u7528\u624b\u4e0a\u5df2\u6709\u7684\u51ed\u636e\u6dfb\u52a0\u8d26\u53f7\u3002CliRelay \u4f1a\u628a\u5b83\u6362\u6210\u4e0e\u6d4f\u89c8\u5668\u767b\u5f55\u76f8\u540c\u7684\u4ee4\u724c\uff0c\u4fdd\u5b58\u5728\u8c03\u7528\u8005\u7684\u79df\u6237\u4e0b\u3002\u652f\u6301\u56db\u79cd\uff1a\n  * claude.ai \u4f1a\u8bdd Cookie\uff1b\n  * OpenAI / Codex CLI \u7684 refresh token\uff1b\n  * Google / Antigravity \u7684 refresh token\uff1b\n  * Grok \u7f51\u9875 SSO Cookie\u3002\n* **\u9519\u8bef\u8bf4\u5f97\u6e05\u695a**\uff1a\n  * \u51ed\u636e\u65e0\u6548\u8fd4\u56de `422`\uff0c\u4e0d\u4f1a\u662f `401`\uff0c\u5426\u5219\u9762\u677f\u4f1a\u8bef\u4ee5\u4e3a\u81ea\u5df1\u7684\u767b\u5f55\u8fc7\u671f\u4e86\u3002\n  * \u9047\u5230 Cloudflare \u6311\u6218\u8fd4\u56de `502`\uff0c\u6309\u51fa\u53e3\u95ee\u9898\u62a5\u544a\uff0c\u4e0d\u7b97\u51ed\u636e\u9519\u8bef\uff1b\u8d85\u65f6\u8fd4\u56de `504`\u3002\n  * \u4e0a\u6e38\u56de\u663e\u7684\u5bc6\u94a5\u5728\u9519\u8bef\u4fe1\u606f\u91cc\u4f1a\u88ab\u6253\u7801\u3002\n* \u6743\u9650\u6cbf\u7528 OAuth \u767b\u5f55\u7684 `auth_files.oauth`\u3002\n\n### 3. OAuth \u767b\u5f55\u4f1a\u8bf4\u660e\u600e\u4e48\u5b8c\u6210\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a\u9762\u677f\u53ea\u62ff\u5230 URL \u548c state\uff0c\u6240\u4ee5\u6240\u6709\u63d0\u4f9b\u5546\u90fd\u663e\u793a\u540c\u4e00\u4e2a\u300c\u7c98\u8d34\u56de\u8c03\u5730\u5740\u300d\u8f93\u5165\u6846\uff0c\u8fde\u8bbe\u5907\u7801\u767b\u5f55\u8fd9\u79cd\u6839\u672c\u6ca1\u4e1c\u897f\u53ef\u8d34\u7684\u4e5f\u4e00\u6837\u3002\u5df2\u8fc7\u671f\u6216\u5df2\u88ab\u65b0\u767b\u5f55\u53d6\u4ee3\u7684\u4f1a\u8bdd\u4f1a\u8fd4\u56de `{\"status\":\"ok\"}`\uff0c\u9762\u677f\u5c31\u5f53\u6210\u767b\u5f55\u6210\u529f\u3002\n* **\u4fee\u590d**\uff1a\n  * `*-auth-url` \u63a5\u53e3\u73b0\u5728\u8fd4\u56de `flow`\uff08`redirect`\u3001`code` \u6216 `device`\uff09\u548c `expires_at`\uff1b\u8bbe\u5907\u7801\u767b\u5f55\u53e6\u5916\u8fd4\u56de `user_code`\u3001`verification_uri` \u548c `expires_in`\u3002\n  * Claude \u652f\u6301 `?callback_mode=code`\uff0c\u6539\u7528 Anthropic \u5b98\u65b9\u7684\u6388\u6743\u7801\u9875\u9762\uff0c\u8fdc\u7a0b\u9762\u677f\u4e0d\u4f1a\u518d\u628a\u6d4f\u89c8\u5668\u5e26\u5230\u6253\u4e0d\u5f00\u7684 localhost \u8f6c\u53d1\u9875\u3002\n  * \u8fc7\u671f\u548c\u88ab\u53d6\u4ee3\u7684\u767b\u5f55\u4f1a\u5982\u5b9e\u62a5\u544a\u3002\u8fdf\u5230\u7684\u56de\u8c03\u8fd4\u56de `409`\uff0c\u9644 `oauth_login_expired` \u6216 `oauth_login_superseded`\uff0c\u5355\u8282\u70b9\u548c\u96c6\u7fa4\u6a21\u5f0f\u4e00\u81f4\u3002\n\n### 4. \u5931\u6548\u7684 HTTP/2 \u8fde\u63a5\u7ea6 45 \u79d2\u5c31\u80fd\u8bc6\u522b\uff0c\u4e0d\u518d\u6302\u7ea6 15 \u5206\u949f\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a\u5e26\u6307\u7eb9\u7684\u4f20\u8f93\u5c42\uff08Anthropic \u53ca\u4f7f\u7528 TLS \u6307\u7eb9\u7684\u63d0\u4f9b\u5546\uff09\u5bf9\u6bcf\u4e2a\u4e3b\u673a\u590d\u7528\u4e00\u6761 HTTP/2 \u8fde\u63a5\u3002\u8fde\u63a5\u6084\u6084\u65ad\u5f00\u540e\u4ecd\u7136\u663e\u793a\u53ef\u7528\uff0c\u8bf7\u6c42\u5199\u8fdb\u53bb\u4f1a\u4e00\u76f4\u91cd\u4f20\uff0c\u76f4\u5230\u5185\u6838\u653e\u5f03\uff08Linux \u4e0a\u7ea6 15 \u5206\u949f\uff09\uff0c\u671f\u95f4\u5ba2\u6237\u7aef\u4e00\u76f4\u5728\u7b49\u3002\u751f\u4ea7\u73af\u5883\u91cc\u5bf9 Anthropic \u9047\u5230\u8fc7\u3002\n* **\u4fee\u590d**\uff1a\u4e24\u79cd\u4f20\u8f93\u5c42\u90fd\u4f1a\u5bf9\u7a7a\u95f2 30 \u79d2\u7684\u8fde\u63a5\u53d1 PING\uff0c15 \u79d2\u5185\u6ca1\u6709\u56de\u5e94\u5c31\u5173\u95ed\u8fde\u63a5\uff0c\u4e0b\u4e00\u4e2a\u8bf7\u6c42\u91cd\u65b0\u5efa\u8fde\u3002\n* **\u611f\u8c22** @RUIIIOVO \u7684\u5b9a\u4f4d\u548c\u4fee\u590d\uff08#1085\uff09\u3002\n\n### 5. \u5de5\u5177\u8fd4\u56de\u7684\u56fe\u7247\u4fdd\u6301\u4e3a\u56fe\u7247\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a\u5de5\u5177\u8fd4\u56de\u56fe\u7247\uff08\u622a\u56fe\u3001\u6e32\u67d3\u51fa\u7684\u56fe\u8868\uff09\u65f6\uff0c\u5404\u8bf7\u6c42\u8f6c\u6362\u5668\u90fd\u628a\u5b83\u8f6c\u6210\u4e86\u6587\u672c\u3002\u4e00\u5f20 1.9 MB \u7684\u622a\u56fe\u4f1a\u53d8\u6210\u