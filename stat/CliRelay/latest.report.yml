t":"2026-11-07T13:25:16Z"},{"id":720780452,"node_id":"RA_kwDORZ9jAc4q9jyk","name":"CliRelay_0.6.0_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":22352440,"digest":"sha256:56a859047cfdcd423073dfa4400a7f2592e9089d264bed092ff06492503b192d","download_count":7,"created_at":"2026-11-07T13:25:13Z","updated_at":"2026-11-07T13:25:14Z"},{"id":720780453,"node_id":"RA_kwDORZ9jAc4q9jyl","name":"CliRelay_0.6.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":20349327,"digest":"sha256:f42f5a6de6dc966e4a172405ae5cbd61780637cd450953fb9d05f12cc9d7afaf","download_count":1,"created_at":"2026-11-07T13:25:13Z","updated_at":"2026-11-07T13:25:14Z"},{"id":720780451,"node_id":"RA_kwDORZ9jAc4q9jyj","name":"CliRelay_0.6.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22836157,"digest":"sha256:1e1dd11d87499dd7ca041d02b98c49502b433d45d33c9c8d03f8f42f976a8f5c","download_count":2,"created_at":"2026-11-07T13:25:13Z","updated_at":"2026-11-07T13:25:14Z"},{"id":720780449,"node_id":"RA_kwDORZ9jAc4q9jyh","name":"CliRelay_0.6.0_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20481583,"digest":"sha256:5acdd2df75d39d498ea12b4f3613962e39668b482187ead94c038215c54a0b94","download_count":1,"created_at":"2026-11-07T13:25:13Z","updated_at":"2026-11-07T13:25:14Z"}],"body":"# v0.6.0 - Privacy Masking, Per-Model Quotas, Virtual Models, and Alerts\n\n> The largest release since v0.5.0: 52 pull requests since v0.5.9. Pair it with **codeProxy v0.7.0** and update the panel first. **Back up your database before upgrading:** one migration permanently masks the client API keys stored in the request log. See [Upgrade Notes](#upgrade-notes).\n\n## Highlights\n\n### 1. Privacy masking\n* Sensitive values are replaced with placeholders before a request leaves CliRelay, and the reply gets the real values back. Upstream providers and third-party relays see only the placeholders. The masking engine is ported from magpie (#1235).\n* Per-tenant settings, portal access, masking records and their management APIs (#1237). Only the tenant admin decides what is masked (#1239, #1240).\n* Outbound secret masking per tenant, with the secrets restored in replies (#1229).\n\n### 2. Sensitive-word guard\n* Words and RE2 rules that block, replace or log. They are layered platform → tenant → key, with scan scopes (#1219). Portal accounts can keep their own words (#1232, #1233).\n* Moderation now covers tool output, history and respelled keywords, and scans the newest input (#1203). Platform-shared channels apply the credential owner's profile (#1199).\n\n### 3. Per-model quotas and model routes\n* Per-model quotas, windowed request and token limits, and model routes for accounts, permission templates and keys (#1168).\n* Requests in flight count against a key's budgets (#1215).\n\n### 4. Routing and scheduling\n* **Virtual models:** one model name that falls back across channel groups (#1223).\n* **Route simulation:** see where a request would go, stage by stage and credential by credential (#1220). Each request also records its route trace, and the requests in flight can be listed (#1221).\n* **Streams fail over before the first byte by default.** There is also a first-token timeout and an opt-in, bounded busy wait (#1214).\n* **Quota spending:** quota that a reset is about to wipe out is spent first (#1217). Channel groups can follow upstream models (#1198).\n* **Cooldowns:**\n  * they follow upstream retry hints, Codex 401s are told apart, and a single model can be retried right away (#1209);\n  * each channel and account can override cooling (#1195);\n  * OpenAI-compatible upstreams' `Retry-After` on 429 is honoured (#1193).\n\n### 5. Operations\n* Quota, account and spending alerts with chat or webhook delivery, plus pool capacity (#1224).\n* A loop guard that stops repeated replies and tool-call loops. It stays off until a tenant or key opts in (#1222).\n* Prometheus metrics on `/metrics` (#1212), and dry runs of payload rules on a sample body (#1218).\n* Deploys no longer cut off in-flight requests: the new build starts in the idle slot and the old one drains before it stops (#1169). The single-node setup gets an offsite database backup and a watchdog that only checks the active slot (#1200).\n\n### 6. Tenancy and accounts\n* The system tenant's proxies and AI accounts can be shared with other tenants (#1157).\n* Warmups stay inside the caller's tenant, and a shared platform account doesn't reveal whose it is (#1227).\n* CliRelay counts copies of a tenant's accounts that other tenants hold (#1230).\n* CC Switch import presets for OpenCode, OpenClaw and Hermes, each with an explicit Codex context window (#1158, #1159). Codex accounts can use the Ultrafast tier (#1180).\n\n### 7. Protocol fixes\n* **Codex:**\n  * live quota windows, the Chat cache key, zstd request bodies, and recovery of reasoning ciphertext (#1210);\n  * only an explicit imagegen call pins the image tool, and image calls carry no effort (#1241);\n  * the Responses WebSocket lets Codex send only what each turn adds (#1242).\n* **Claude:**\n  * requests are shaped for each model's request surface (#1204);\n  * unpaired `tool_use` / `tool_result` blocks are repaired before sending (#1205);\n  * Opus 4.7 and later get adaptive thinking (#1197);\n  * prefixing tools no longer copies the request repeatedly (#1178).\n* **Across protocols:**\n  * errors are answered in the client's protocol shape (#1206);\n  * every client gets its own stop reason, and `response.incomplete` is passed on (#1207);\n  * structured output is carried across protocols, Claude clients get streamed tool arguments, and tool_use ids they can't parse are encoded (#1213);\n  * every upstream's cache counters are billed, cooldowns go by failure class, and Claude tool history is repaired (#1228).\n* **Other:** Antigravity array tool schemas get their missing `items` (#1160), and a refresh-token exchange outlives its caller (#1201).\n* **Usage:**\n  * only cache reads count as hits, and sessions are kept past content retention (#1211);\n  * generation speed is measured after the first token (#1236).\n\n### 8. Security\n* The request log no longer stores or returns plaintext client API keys. Existing rows are masked by a one-way migration (#1202).\n* Credentials are scrubbed from request logs before they are stored (#1208).\n* Dependencies are patched for GO-2026-6888 (brotli 1.2.7) and GO-2026-6865 (klauspost/compress 1.20.2) (#1244).\n\n---\n\n## Detailed Changes\n\n### Backend CliRelay\n- **feat(privacy-mask / privacy-masking)**: magpie's masking engine with per-sender scopes (#1235); settings, portal users, records and their APIs (#1237).\n- **refactor(privacy-masking)**: only the tenant decides what is masked (#1239); drop the settings fields kept for the old panel (#1240).\n- **feat(moderation)**: mask outbound secrets per tenant and restore them in replies (#1229). **fix(moderation)**: cover tool output, history and respelled keywords (#1203); use the credential owner's profile on platform-shared channels (#1199).\n- **feat(contentmoderation / word-guard)**: sensitive-word guard (#1219); portal accounts' own words (#1232, #1233).\n- **feat(access-policy)**: per-model quotas, windowed limits and model routes (#1168). **feat(quota)**: count requests in flight against a key's budgets (#1215).\n- **feat(routing)**: virtual models (#1223); route simulation (#1220); route traces and requests in flight (#1221); channel groups follow upstream models (#1198).\n- **feat(stream)**: fail over before the first byte by default, first-token timeout, bounded busy wait (#1214).\n- **feat(scheduling)**: spend the quota a reset is about to wipe out first (#1217).\n- **feat(cooldown / cooling)**: follow upstream retry hints, split Codex 401s, retry one model now (#1209); per-channel and per-account override (#1195). **fix(openai-compat)**: honour Retry-After on 429 (#1193).\n- **feat(alerts)**: quota, account and spending alerts, and pool capacity (#1224).\n- **feat(loopguard)**: stop repeated replies and tool-call loops (#1222).\n- **feat(observability)**: Prometheus metrics on `/metrics` (#1212). **feat(payload)**: dry-run payload rules (#1218).\n- **feat(tenancy)**: share the system tenant's proxies and AI accounts (#1157). **fix(tenant)**: keep warmups in the caller's tenant (#1227). **feat(auth-files)**: count copies held by other tenants (#1230).\n- **feat(ccswitch)**: OpenCode, OpenClaw and Hermes presets (#1158); explicit Codex context window (#1159).\n- **feat(codex)**: Ultrafast tier (#1180); live quota windows, Chat cache key, zstd bodies, reasoning ciphertext recovery (#1210). **fix(codex)**: image tool pinning and effort (#1241). **fix(responses-ws)**: send only what each turn adds (#1242).\n- **fix(claude)**: per-model request surface (#1204); repair unpaired tool blocks (#1205). **fix(thinking)**: adaptive thinking for Opus 4.7+ (#1197). **perf**: avoid repeated request copies when prefixing Claude tools (#1178).\n- **fix(api)**: errors in the client's protocol shape (#1206). **fix(translator)**: per-client stop reasons, pass on `response.incomplete` (#1207). **fix**: structured output across protocols, streamed tool arguments, encoded tool_use ids (#1213); cache counters, cooldown by failure class, Claude tool history (#1228).\n- **fix(antigravity)**: fill missing `items` on array tool schemas (#1160). **fix(auth)**: let a refresh-token exchange outlive its caller (#1201).\n- **fix(usage)**: stop storing and returning plaintext client API keys (#1202); count only cache reads as hits (#1211). **fix(usage, logging)**: scrub credentials from request logs (#1208). **fix(monitor)**: generation speed after the first token (#1236).\n- **fix(deploy)**: stop cutting off in-flight requests on every deploy (#1169). **feat(ops)**: offsite backup and an active-slot watchdog (#1200).\n- **fix(deps)**: patch reachable compression vulnerabilities (#1244). **test(usage)**: pin the legacy-rollup migration test to its own clock (#1245).\n\n## Upgrade Notes\n* **Back up the database first.** The new migrations run on start:\n  * access policy (#1168) and shared resources (#1157);\n  * cache columns (#1211) and generation-speed columns (#1236).\n* **The request log's client keys are masked for good (#1202).** Starting about 10 minutes after the first start, a background job masks `request_logs.api_key` in batches, and the change cannot be undone. Export anything you still need from those rows before upgrading.\n* **Older usage rows:** rows written before this release show the cache hit rate as unknown and the generation speed as \"—\", because the new columns were not recorded for them.\n* **Update the panel first, to codeProxy v0.7.0.** Self-hosted panels pull the latest release about every three hours. Until then, avoid saving permission templates: the v0.6.2 panel sends the whole template and does not know the new per-model rules and routes.\n* **Streams now fail over before the first byte by default (#1214).** The first-token timeout and the busy wait are configured per channel group.\n* **Features that do nothing until configured:** the loop guard, alerts, virtual models and privacy masking stay inactive until a tenant or key turns them on. Privacy masking stores its placeholder key in plain text unless the server has a master key configured in its `.env`; the settings page shows which applies.\n\n<details>\n<summary>中文说明（点击展开）</summary>\n\n# v0.6.0 - 隐私脱敏、按模型配额、虚拟模型与告警\n\n> v0.5.0 以来最大的一个版本：v0.5.9 之后合入了 52 个 PR。请搭配 **codeProxy v0.7.0**，并先更新面板。**升级前请先备份数据库**：有一个迁移会永久遮掩请求日志里保存的客户端 API Key。详见升级提示。\n\n## 核心更新\n\n### 1. 隐私脱敏\n* 请求离开 CliRelay 前，敏感值会被换成占位符，回复再换回原值；上游厂商和第三方中转只看到占位符。脱敏引擎移植自 magpie（#1235）。\n* 租户级设置、门户访问、脱敏记录及其管理接口（#1237）；遮什么只由租户管理员决定（#1239、#1240）。\n* 按租户对出站密钥脱敏，并在回复中还原（#1229）。\n\n### 2. 敏感词守卫\n* 支持拦截、替换、记录三种处理和 RE2 规则，按平台 → 租户 → Key 分层，可设扫描范围（#1219）；门户账号可以保留自己的敏感词（#1232、#1233）。\n* 内容审核覆盖工具输出、历史消息和变体写法的关键词，并扫描最新的输入（#1203）；平台共享渠道按凭据所有者的配置审核（#1199）。\n\n### 3. 按模型的配额与路由\n* 账号、权限模板和 Key 支持按模型配额、时间窗内的请求数和 token 上限，以及模型路由（#1168）。\n* 进行中的请求计入 Key 的预算（#1215）。\n\n### 4. 路由与调度\n* **虚拟模型：** 一个模型名可以在多个渠道分组之间回退（#1223）。\n* **路由模拟：** 按阶段、按凭据看一个请求会走到哪里（#1220）；每个请求都会记录路由轨迹，还能列出进行中的请求（#1221）。\n* **流式请求默认在首字节之前故障转移**，另有首字超时和可选的有界忙等（#1214）。\n* **额度使用：** 优先花掉即将被重置清零的额度（#1217）；渠道分组可以跟随上游模型（#1198）。\n* **冷却：**\n  * 跟随上游的重试提示，区分 Codex 的 401，并可立即重试单个模型（#1209）；\n  * 渠道和账号可以单独覆盖冷却设置（#1195）；\n  * OpenAI 兼容上游 429 时遵循 `Retry-After`（#1193）。\n\n### 5. 运维\n* 额度、账号、花费告警，可推送到聊天工具或 webhook，附池容量（#1224）。\n* 循环保护：拦下重复回复和工具调用循环，租户或 Key 开启后才生效（#1222）。\n* `/metrics` 输出 Prometheus 指标（#1212）；payload 规则可以拿示例请求体试跑（#1218）。\n* 部署不再切断进行中的请求：新版本先起在空闲的 slot，旧 slot 排空后才停（#1169）；单机部署新增异地数据库备份，看门狗只检查当前在服务的 slot（#1200）。\n\n### 6. 租户与账号\n* 系统租户的代理和 AI 账号可以共享给其他租户（#1157）。\n* 预热只在调用方所在租户内进行，共享的平台账号不暴露归属（#1227）。\n* 统计本租户的账号被其他租户导入的副本数（#1230）。\n* CC Switch 新增 OpenCode、OpenClaw、Hermes 导入预设，并为 Codex 显式指定上下文窗口（#1158、#1159）；Codex 账号支持 Ultrafast 档位（#1180）。\n\n### 7. 协议修复\n* **Codex：**\n  * 实时额度窗口、Chat 缓存键、zstd 请求体、推理密文恢复（#1210）；\n  * 只有显式的 imagegen 调用才会固定图像工具，生图调用不再带 effort（#1241）；\n  * Responses WebSocket 每轮只发送新增内容（#1242）。\n* **Claude：**\n  * 请求按各模型的请求形态整理（#1204）；\n  * 发送前修复不成对的 `tool_use` / `tool_result`（#1205）；\n  * Opus 4.7 及以后使用 adaptive thinking（#1197）；\n  * 给工具加前缀时不再反复复制请求（#1178）。\n* **跨协议：**\n  * 错误按客户端的协议格式返回（#1206）；\n  * 每种客户端拿到各自的停止原因，`response.incomplete` 会被转发（#1207）；\n  * 结构化输出跨协议保留，向 Claude 客户端流式发送工具参数，并编码它无法解析的 tool_use id（#1213）；\n  * 所有上游的缓存计数都计费，冷却按失败类型区分，修复 Claude 工具历史（#1228）。\n* **其他：** Antigravity 数组类型的工具 schema 补全缺失的 `items`（#1160）；refresh token 交换不再随调用方取消（#1201）。\n* **用量：**\n  * 只有缓存读取才算命中，会话在内容保留期之后仍保留（#1211）；\n  * 生成速度按首字之后计算（#1236）。\n\n### 8. 安全\n* 请求日志不再保存、也不再返回明文客户端 API Key；已有记录由单向迁移遮掩（#1202）。\n* 请求日志在保存前清除其中的凭据（#1208）。\n* 修复依赖漏洞 GO-2026-6888（brotli 1.2.7）和 GO-2026-6865（klauspost/compress 1.20.2）（#1244）。\n\n## 升级提示\n* **先备份数据库。** 以下迁移会在启动时执行：\n  * 访问策略（#1168）、共享资源（#1157）；\n  * 缓存列（#1211）、生成速度列（#1236）。\n* **请求日志里的客户端 Key 会被永久遮掩（#1202）。** 首次启动约 10 分钟后，后台任务会分批遮掩 `request_logs.api_key`，无法撤销。如果还需要这些记录里的内容，请在升级前导出。\n* **旧用量记录：** 升级前写入的记录，缓存命中率显示为未知，生成速度显示「—」，因为当时没有记录新增的列。\n* **先把面板更新到 codeProxy v0.7.0。** 自托管实例大约每三小时拉取一次最新面板；在此之前不要保存权限模板：v0.6.2 面板会整份提交模板，而它不认识新增的按模型规则和路由。\n* **流式请求默认在首字节之前故障转移（#1214）。** 首字超时和忙等按渠道分组配置。\n* **需要配置后才生效的功能：** 循环保护、告警、虚拟模型和隐私脱敏，在租户或 Key 开启之前都不起作用。隐私脱敏的占位符密钥，在服务器的 `.env` 里没有配置主密钥时以明文存库；设置页会显示当前是哪种情况。\n\n</details>\n\nMulti-arch binaries and the Docker image are published to GitHub Releases and GHCR. Released together with codeProxy v0.7.0.\n"}
