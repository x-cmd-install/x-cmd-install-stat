be37d4205b6051924591d5c99540c08e182f65d","download_count":1,"created_at":"2026-09-14T01:53:36Z","updated_at":"2026-09-14T01:53:37Z"}],"body":"# v0.5.2 - \u6a21\u578b\u591a\u6a21\u6001\u63a2\u6d4b\u3001Antigravity \u601d\u8003\u91cd\u653e\u4e0e\u8d26\u53f7\u5e76\u53d1\u961f\u5217 / Modality Probing, Antigravity Thinking Replay and Concurrency Queue\n\n## \u6838\u5fc3\u66f4\u65b0\u4eae\u70b9 / Highlights\n\n### 1. \u6a21\u578b\u63a2\u6d4b\u6a21\u6001\u5851\u5f62\u4e0e Codex \u56fe\u50cf\u6a21\u578b\u9009\u62e9 / Modality Probe and Codex Image Carrier\n* **\u63a2\u6d4b\u534f\u8bae\u6309\u6a21\u6001\u5851\u5f62**\uff1a\u652f\u6301\u4e3a\u804a\u5929\u3001\u6587\u751f\u56fe\u3001\u6587\u751f\u89c6\u9891\u3001\u97f3\u9891\u53ca\u5d4c\u5165\u6a21\u6001\u5206\u522b\u5851\u5f62\u6d4b\u8bd5\u63a2\u9488\uff0c\u8fd4\u56de\u8bf7\u6c42\u8be6\u60c5\u3001\u7aef\u70b9\u4e0e\u51ed\u636e\u6eaf\u6e90\u3002\n* **Codex \u539f\u751f\u56fe\u50cf\u751f\u6210\u6ce8\u518c\u4e0e\u8def\u7531**\uff1a\u65b0\u589e GPT Image 2.5 \u56fe\u50cf\u6a21\u578b\u5bf9\uff0c\u5f00\u653e\u516c\u5171\u6587\u751f\u56fe\u63a5\u53e3\uff0c\u652f\u6301\u5728\u8d26\u53f7\u7ea7\u663e\u5f0f\u7ed1\u5b9a\u56fe\u50cf\u6a21\u578b\u8f7d\u4f53\u3002\n* **\u591a\u79df\u6237\u6a21\u6001\u79cd\u5b50\u8865\u5168**\uff1a\u81ea\u52a8\u5c06\u56fe\u50cf\u4e0e\u89c6\u9891\u6a21\u578b\u8865\u586b\u81f3\u5404\u79df\u6237\u6a21\u578b\u5e93\uff0c\u4fee\u590d PostgreSQL \u73af\u5883\u4e0b\u7684\u6267\u884c\u517c\u5bb9\u6027\u3002\n\n### 2. Antigravity \u601d\u8003\u91cd\u653e\u4e0e\u4e0a\u9650\u4fdd\u62a4 / Antigravity Thinking Replay and Ceiling Guard\n* **\u5bb6\u65cf\u7ea7\u601d\u8003\u91cd\u653e\u9002\u914d**\uff1a\u9488\u5bf9\u4e0d\u540c\u4e0a\u6e38\u6a21\u578b\u5bb6\u65cf\uff08\u5982 Gemini / Claude\uff09\u9075\u5b88\u5404\u81ea\u7684\u601d\u8003\u91cd\u653e\u89c4\u5219\uff0c\u907f\u514d\u975e\u6cd5\u601d\u7ef4\u94fe\u683c\u5f0f\u5bfc\u81f4\u4e0a\u6e38\u62d2\u7edd\u3002\n* **Claude \u8f93\u51fa Token \u786c\u4e0a\u9650\u622a\u65ad**\uff1a\u5c06 Claude \u6a21\u578b\u7684 `maxOutputTokens` \u9650\u5236\u5728\u4e0a\u6e38\u63a5\u53d7\u7684\u6700\u5927\u5b89\u5168\u8303\u56f4\u5185\uff0c\u675c\u7edd\u6ea2\u51fa\u62d2\u7edd\u3002\n\n### 3. \u8d26\u53f7\u5e76\u53d1\u961f\u5217\u4e0e\u5bc6\u7801\u9632\u9501\u6b7b / Saturated Account Concurrency Queue and Account Safety\n* **\u9971\u548c\u8d26\u53f7\u5e76\u53d1\u8bf7\u6c42\u6392\u961f**\uff1a\u8d26\u53f7\u5e76\u53d1\u5360\u6ee1\u65f6\u81ea\u52a8\u5c06\u8bf7\u6c42\u653e\u5165\u6392\u961f\u7b49\u5f85\uff0c\u800c\u975e\u76f4\u63a5\u8fd4\u56de\u5931\u8d25\uff0c\u63d0\u5347\u9ad8\u5e76\u53d1\u4e0b\u7684\u8bf7\u6c42\u6210\u529f\u7387\u3002\n* **\u5bc6\u7801\u91cd\u7f6e\u9632\u9501\u6b7b\u4e0e\u8be6\u7ec6\u6821\u9a8c\u89c4\u5219**\uff1a\u91cd\u7f6e\u5bc6\u7801\u65f6\u4e0d\u518d\u610f\u5916\u89e6\u53d1\u9632\u7206\u7834\u9501\u5b9a\uff1b\u5f53\u5bc6\u7801\u88ab\u7b56\u7565\u62d2\u7edd\u65f6\uff0c\u660e\u786e\u8fd4\u56de\u5177\u4f53\u8fdd\u53cd\u7684\u89c4\u5219\u8bf4\u660e\u3002\n* **5 \u5c0f\u65f6\u989d\u5ea6\u7a97\u53e3\u91cd\u7f6e\u951a\u5b9a**\uff1a\u5468\u671f\u7528\u91cf\u7ed3\u7b97\u51c6\u786e\u951a\u5b9a 5 \u5c0f\u65f6\u91cd\u7f6e\u7a97\u53e3\uff0c\u79fb\u9664\u4e0d\u5fc5\u8981\u7684\u9884\u6d4b\u9884\u70ed\u95e8\u7981\u3002\n\n---\n\n## \u8be6\u7ec6\u6539\u52a8\u8bb0\u5f55 / Detailed Changes\n\n### \u540e\u7aef CliRelay\n- **feat(models,codex)**\uff1a\u6309\u6a21\u6001\u5851\u5f62\u6a21\u578b\u63a2\u6d4b\u534f\u8bae\uff0c\u652f\u6301\u8d26\u53f7\u7ea7\u56fe\u50cf\u6a21\u578b\u9009\u62e9\u4e0e\u7ba1\u7406\u7aef\u94fe\u8def\u6eaf\u6e90\uff08#1028\uff09\u3002\n- **fix(antigravity)**\uff1a\u6309\u5404\u6a21\u578b\u5bb6\u65cf\u89c4\u5219\u91cd\u653e\u601d\u7ef4\u94fe\uff08thinking\uff09\uff0c\u907f\u514d\u534f\u8bae\u4e0d\u517c\u5bb9\u62a5\u9519\uff08#1026\uff09\u3002\n- **fix(antigravity)**\uff1a\u5c06 Claude \u6a21\u578b `maxOutputTokens` \u622a\u65ad\u5728\u4e0a\u6e38\u4e0a\u9650\u5185\uff08#1025\uff09\u3002\n- **fix(portal,identity)**\uff1a\u907f\u514d\u5bc6\u7801\u91cd\u7f6e\u9501\u5b9a\u7528\u6237\uff0c\u51c6\u786e\u6307\u51fa\u62d2\u7edd\u5bc6\u7801\u8fdd\u53cd\u7684\u7b56\u7565\u9879\uff08#1024\uff09\u3002\n- **fix(codex)**\uff1a\u6253\u901a\u56fe\u50cf\u6a21\u578b\u8def\u7531\u4e0e carrier \u89e3\u6790\uff0c\u6ce8\u518c GPT Image 2.5 \u5e76\u5f00\u653e images \u7aef\u70b9\uff08#1017, #1018, #1021\uff09\u3002\n- **fix(modelconfig)**\uff1a\u4e3a\u6240\u6709\u79df\u6237\u81ea\u52a8\u79cd\u5b50\u5316\u56fe\u50cf\u548c\u89c6\u9891\u6a21\u578b\uff0c\u4fee\u590d PG \u6267\u884c\u95ee\u9898\uff08#1019, #1020\uff09\u3002\n- **feat(auth)**\uff1a\u8d26\u53f7\u8fbe\u5230\u6700\u5927\u5e76\u53d1\u65f6\u8fdb\u5165\u6392\u961f\u673a\u5236\uff0c\u907f\u514d\u76f4\u63a5\u62a5\u9519\u5931\u8d25\uff08#1016\uff09\u3002\n- **feat(quota)**\uff1a\u951a\u5b9a 5 \u5c0f\u65f6\u989d\u5ea6\u6d88\u8d39\u7a97\u53e3\u5e76\u79fb\u9664\u65e7\u7248\u9884\u70ed\u62e6\u622a\uff08#1013, #1014\uff09\u3002\n\n\u672c\u6b21\u66f4\u65b0\u4e0e\u524d\u7aef codeProxy v0.5.1 \u534f\u540c\u53d1\u5e03\u3002\u4e8c\u8fdb\u5236\u4ea7\u7269\u4e0e\u591a\u67b6\u6784\u5bb9\u5668\u955c\u50cf\u5df2\u5b8c\u6210\u6784\u5efa\u5e76\u53d1\u5e03\u81f3 GHCR\u3002\n"}
