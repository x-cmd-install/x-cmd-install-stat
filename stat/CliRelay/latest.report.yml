6-09-08T01:38:23Z"},{"id":549679849,"node_id":"RA_kwDORZ9jAc4gw3Lp","name":"CliRelay_0.5.1_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":16375265,"digest":"sha256:f120f115ca3fe0399afaecf040a534bb1a8770a508edc0d21592a0ce58cbb2fd","download_count":7,"created_at":"2026-09-08T01:38:23Z","updated_at":"2026-09-08T01:38:24Z"},{"id":549679835,"node_id":"RA_kwDORZ9jAc4gw3Lb","name":"CliRelay_0.5.1_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15027194,"digest":"sha256:cb263f270fc35f3569a8f1f1712225521feae9ae3bb9b3be9a7834292791cd60","download_count":2,"created_at":"2026-09-08T01:38:21Z","updated_at":"2026-09-08T01:38:22Z"},{"id":549679845,"node_id":"RA_kwDORZ9jAc4gw3Ll","name":"CliRelay_0.5.1_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16721358,"digest":"sha256:18be81fb70dadff6254944653469b3be7657f3f715af011cdb15e1bed87cf5f2","download_count":7,"created_at":"2026-09-08T01:38:23Z","updated_at":"2026-09-08T01:38:24Z"},{"id":549679834,"node_id":"RA_kwDORZ9jAc4gw3La","name":"CliRelay_0.5.1_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15154282,"digest":"sha256:174c3239be6162888a8b3eb6e71f652ed6e0d9efbd365ba28f2fd91fddc7ff22","download_count":2,"created_at":"2026-09-08T01:38:21Z","updated_at":"2026-09-08T01:38:22Z"}],"body":"# v0.5.1 - Codex \u539f\u751f\u7f51\u9875\u641c\u7d22\u4fee\u590d / Native Codex Web Search Fix\n\n## \u6838\u5fc3\u66f4\u65b0\u4eae\u70b9 / Highlights\n\n### 1. \u63a5\u901a Codex \u539f\u751f\u7f51\u9875\u641c\u7d22 / Native Codex Web Search\n\n* **\u4fee\u590d\u641c\u7d22 404**\uff1aCodex CLI \u548c Desktop \u7684\u539f\u751f\u7f51\u9875\u641c\u7d22\u8bf7\u6c42\u53ef\u4ee5\u4f7f\u7528\u72ec\u7acb\u641c\u7d22\u63a5\u53e3\uff0c\u652f\u6301\u6807\u51c6\u8def\u5f84\u548c\u6e20\u9053\u5206\u7ec4\u8def\u5f84\u3002\n* **\u641c\u7d22\u5185\u5bb9\u5b8c\u6574\u4fdd\u7559**\uff1a\u4fdd\u7559\u641c\u7d22\u547d\u4ee4\u3001\u8bbe\u7f6e\u548c\u7ed3\u679c\uff0c\u907f\u514d\u804a\u5929\u534f\u8bae\u8f6c\u6362\u52a0\u5165\u4e0a\u6e38\u4e0d\u652f\u6301\u7684\u5b57\u6bb5\u3002\n\n### 2. \u641c\u7d22\u51ed\u636e\u4e0e\u6743\u9650 / Search Credentials and Permissions\n\n* **\u6309\u80fd\u529b\u9009\u62e9\u51ed\u636e**\uff1a\u652f\u6301 Codex OAuth\uff1bAPI key \u4e0a\u6e38\u9700\u8981\u663e\u5f0f\u8bbe\u7f6e `alpha-search: true` \u548c `base-url`\uff0c\u5f00\u5173\u652f\u6301\u4fdd\u5b58\u53ca\u70ed\u66f4\u65b0\u3002\n* **\u6cbf\u7528\u73b0\u6709\u6743\u9650**\uff1a\u641c\u7d22\u7ee7\u7eed\u9075\u5b88\u79df\u6237\u3001\u6a21\u578b\u3001\u6e20\u9053\u548c\u5ba2\u6237\u7aef\u9650\u5236\uff0c\u6ca1\u6709\u53ef\u7528\u641c\u7d22\u51ed\u636e\u65f6\u8fd4\u56de\u660e\u786e\u9519\u8bef\u3002\n\n---\n\n## \u8be6\u7ec6\u6539\u52a8\u8bb0\u5f55 / Detailed Changes\n\n### \u540e\u7aef CliRelay\n\n- **fix(codex)**\uff1a\u63a5\u5165\u72ec\u7acb `POST /v1/alpha/search` \u534f\u8bae\uff0c\u4fdd\u7559\u6a21\u578b\u522b\u540d\u3001\u8bf7\u6c42\u53d6\u6d88\u3001\u9519\u8bef\u548c\u7528\u91cf\u8bb0\u5f55\uff1b\u79fb\u9664\u9876\u5c42 `prompt_cache_key` \u4e0e `prompt_cache_retention`\u3002\n- **fix(identity)**\uff1a\u4fee\u590d\u540e\u53f0\u65e7\u5feb\u7167\u8986\u76d6\u65b0\u5b66\u4e60\u6307\u7eb9\u7684\u7ade\u6001\uff0c\u907f\u514d\u8fde\u7eed\u8bf7\u6c42\u610f\u5916\u5207\u56de\u9ed8\u8ba4\u5ba2\u6237\u7aef\u6307\u7eb9\u3002\n- **fix(config)**\uff1a\u8865\u9f50\u641c\u7d22\u80fd\u529b\u5f00\u5173\u7684 YAML\u3001\u7ba1\u7406\u63a5\u53e3\u3001\u6301\u4e45\u5316\u548c\u70ed\u66f4\u65b0\uff0cAPI key \u9ed8\u8ba4\u5173\u95ed\u641c\u7d22\u80fd\u529b\u3002\n\n\u672c\u6b21\u4ec5\u66f4\u65b0\u540e\u7aef\uff0c\u7ba1\u7406\u9762\u677f\u7ee7\u7eed\u4f7f\u7528 v0.5.0\u3002\u8bf7\u6c42\u5fc5\u987b\u5305\u542b `model`\uff0c\u4e0d\u652f\u6301\u6d41\u5f0f\u641c\u7d22\uff1bAPI key \u4e0a\u6e38\u9700\u8981\u81ea\u884c\u63d0\u4f9b\u5bf9\u5e94\u641c\u7d22\u534f\u8bae\u3002\u56de\u5f52\u9a8c\u8bc1\u4f7f\u7528\u672c\u5730 HTTP \u670d\u52a1\u548c\u6a21\u62df OAuth \u4f20\u8f93\uff0c\u672a\u4f7f\u7528\u771f\u5b9e\u5b98\u65b9\u8d26\u53f7\u5b9e\u6d4b\u641c\u7d22\u3002\n\nFixes #994 via #1009.\n"}
