0180019f3c80be929ac2e1a39b907f85c0a1016c46d7768ac3efdfa3","download_count":1,"created_at":"2026-09-21T16:13:35Z","updated_at":"2026-09-21T16:13:36Z"}],"body":"# v0.5.3 - \u4e0a\u6e38\u54cd\u5e94\u6a21\u578b\u8bb0\u5f55\u3001\u6a21\u578b\u7981\u7528\u5f3a\u5316\u4e0e\u8c03\u5ea6\u7a97\u53e3\u91cd\u7f6e\u6298\u6263 / Upstream Response Model Recording, Model Disable Enforcement and Reset-Aware Quota Discount\n\n## \u6838\u5fc3\u66f4\u65b0\u4eae\u70b9 / Highlights\n\n### 1. \u4e0a\u6e38\u54cd\u5e94\u6a21\u578b\u6eaf\u6e90\u4e0e\u900f\u660e\u5ba1\u8ba1 / Upstream Response Model Tracking\n* **\u771f\u5b9e\u8fd4\u56de\u6a21\u578b\u8bb0\u5f55**\uff1a\u5b8c\u6574\u8bb0\u5f55\u4e0a\u6e38\u5728\u54cd\u5e94\u4f53\u4e2d\u58f0\u660e\u7684\u771f\u5b9e\u6a21\u578b\u540d\u79f0\uff08`response_model`\uff09\uff0c\u5e76\u5728\u8bf7\u6c42\u65e5\u5fd7\u4e2d\u4e0e\u8bf7\u6c42\u6a21\u578b\u5bf9\u6bd4\u5448\u73b0\u3002\n* **\u6a21\u578b\u964d\u7ea7\u4e0e\u66ff\u6362\u900f\u660e\u5316**\uff1a\u5f53\u4e0a\u6e38\u5b9e\u9645\u8fd4\u56de\u6a21\u578b\u4e0e\u5ba2\u6237\u7aef\u8bf7\u6c42\u6a21\u578b\u4e0d\u4e00\u81f4\u65f6\uff0c\u5728\u65e5\u5fd7\u5206\u6790\u4e0e\u76d1\u63a7\u9762\u677f\u4e2d\u81ea\u52a8\u6807\u8bc6\u5dee\u5f02\uff0c\u4fbf\u4e8e\u5feb\u901f\u5ba1\u8ba1\u6e20\u9053\u964d\u7ea7\u884c\u4e3a\u3002\n\n### 2. \u6a21\u578b\u7981\u7528\u5168\u94fe\u8def\u751f\u6548\u4e0e\u76ee\u5f55\u9694\u79bb / Model Disable Enforcement and Catalog Isolation\n* **\u7981\u7528\u72b6\u6001\u5168\u94fe\u8def\u62e6\u622a**\uff1a\u5f7b\u5e95\u6253\u901a\u6a21\u578b\u76ee\u5f55\u4e2d\u7684\u7981\u7528\u5f00\u5173\uff08disable toggle\uff09\uff0c\u5bf9\u5e38\u89c4\u63a8\u7406\u3001Gemini \u539f\u751f URL \u7aef\u70b9\u53ca WebSocket \u8def\u5f84\u5747\u4e25\u683c\u751f\u6548\u3002\n* **\u7ba1\u7406\u7aef\u76ee\u5f55\u4e0e\u516c\u5171\u76ee\u5f55\u5206\u6d41**\uff1a\u7ba1\u7406\u7aef\u8fd0\u7ef4\u754c\u9762\u4fdd\u7559\u5df2\u7981\u7528\u6a21\u578b\u7684\u5c55\u793a\u4e0e\u914d\u7f6e\u5165\u53e3\uff0c\u800c\u9762\u5411\u5916\u90e8\u5ba2\u6237\u7aef\u53ca\u79df\u6237\u7684\u516c\u5f00\u6a21\u578b\u5217\u8868\u81ea\u52a8\u8fc7\u6ee4\u5df2\u7981\u7528\u6a21\u578b\u3002\n\n### 3. \u989d\u5ea6\u91cd\u7f6e\u6298\u6263\u8c03\u5ea6\u4e0e\u5ba2\u6237\u7aef\u517c\u5bb9 / Reset-Aware Quota Discount & Client Compatibility\n* **\u989d\u5ea6\u7a97\u53e3\u91cd\u7f6e\u611f\u77e5\u8c03\u5ea6**\uff1a`LeastLoadSelector` \u667a\u80fd\u7ed3\u5408\u8d26\u53f7\u989d\u5ea6\u7a97\u53e3\u7684\u5269\u4f59\u91cd\u7f6e\u65f6\u95f4\u8ba1\u7b97\u60e9\u7f5a\u7cfb\u6570\uff0c\u4e34\u8fd1\u91cd\u7f6e\u5468\u671f\uff086h/48h \u68af\u5ea6\uff09\u65f6\u81ea\u52a8\u964d\u4f4e\u8d1f\u8377\u60e9\u7f5a\uff0c\u91ca\u653e\u5373\u5c06\u5237\u65b0\u7684\u914d\u989d\uff0c\u907f\u514d\u989d\u5ea6\u6d6a\u8d39\u3002\n* **Pi \u4e0e Codex CLI \u8def\u7531\u517c\u5bb9**\uff1a\u76f4\u63a5\u4ece\u6839\u8def\u5f84\u4e3a Codex CLI \u4e0e Pi \u7684 CLIProxyAPI Provider \u63d0\u4f9b\u7aef\u70b9\u517c\u5bb9\u4e0e\u5ba2\u6237\u7aef\u4e13\u5c5e\u6a21\u578b\u76ee\u5f55\u9002\u914d\u3002\n* **Claude Fable 5.1 \u652f\u6301\u4e0e\u6307\u7eb9\u95e8\u7981\u5347\u7ea7**\uff1a\u6a21\u578b\u5e93\u6b63\u5f0f\u5f15\u5165 Claude Fable 5.1 \u4ee3\u9645\u6a21\u578b\uff1b\u63d0\u5347 Claude Code \u6307\u7eb9\u95e8\u7981\u57fa\u7ebf\u5e76\u9002\u914d\u7b26\u5408\u8981\u6c42\u7684\u5ba2\u6237\u7aef User-Agent\u3002\n* **Antigravity \u8de8\u8282\u70b9\u91cd\u8bd5\u4e0e\u9519\u8bef\u89e3\u7801**\uff1a\u5f53\u906d\u9047\u5730\u533a\u9650\u5236\uff08location-gated\uff09\u65f6\u81ea\u52a8\u8de8\u8282\u70b9\u91cd\u8bd5\u5e76\u8bbe\u4e0a\u9650\uff0c\u6b63\u786e\u89e3\u7801\u4e0a\u6e38\u538b\u7f29\u9519\u8bef\u54cd\u5e94\u4f53\u3002\n\n---\n\n## \u8be6\u7ec6\u6539\u52a8\u8bb0\u5f55 / Detailed Changes\n\n### \u540e\u7aef CliRelay\n- **feat(usage)**\uff1a\u5728\u8bf7\u6c42\u65e5\u5fd7\u4e2d\u8bb0\u5f55\u4e0a\u6e38\u5728\u54cd\u5e94\u4e2d\u58f0\u660e\u7684\u771f\u5b9e\u6a21\u578b\uff0c\u4e0e\u8bf7\u6c42\u6a21\u578b\u505a\u6bd4\u5bf9\u8bb0\u5f55\uff08#1056\uff09\u3002\n- **fix(models)**\uff1a\u4fee\u590d\u6a21\u578b\u76ee\u5f55\u7981\u7528\u5f00\u5173\u672a\u5728\u8fd0\u884c\u65f6\u5168\u9762\u751f\u6548\u7684\u95ee\u9898\uff0c\u8986\u76d6 Gemini \u539f\u751f\u4e0e WebSocket \u8def\u7531\uff0c\u5e76\u5728\u516c\u5171\u7aef\u70b9\u4e2d\u6b63\u786e\u8fc7\u6ee4\uff08#1047, #1057\uff09\u3002\n- **feat(api)**\uff1a\u5728 Relay \u6839\u8def\u5f84\u4e3a Codex CLI \u4e0e Pi \u5ba2\u6237\u7aef\u63d0\u4f9b\u7aef\u70b9\u4e0e\u76ee\u5f55\u517c\u5bb9\uff08#1048, #1057\uff09\u3002\n- **feat(registry)**\uff1a\u5728\u6a21\u578b\u5e93\u4e2d\u6ce8\u518c Claude Fable 5.1 \u4ee3\u9645\u6a21\u578b\uff08#1049, #1057\uff09\u3002\n- **fix(claude)**\uff1a\u5347\u7ea7 Claude Code \u6307\u7eb9\u57fa\u7ebf\uff0c\u652f\u6301\u5408\u89c4\u5ba2\u6237\u7aef UA\uff08#1050, #1057\uff09\u3002\n- **fix(antigravity)**\uff1a\u5bf9\u906d\u9047\u5730\u533a\u9650\u5236\u7684\u8bf7\u6c42\u5728\u4e0b\u4e00\u4e2a\u53ef\u7528\u8282\u70b9\u91cd\u8bd5\uff08\u6700\u591a 2 \u6b21\uff09\uff08#1051, #1057\uff09\u3002\n- **fix(claude)**\uff1a\u6b63\u786e\u89e3\u538b\u4e0a\u6e38\u538b\u7f29\u7684\u9519\u8bef\u54cd\u5e94\u4f53\uff0c\u907f\u514d\u9519\u8bef\u4fe1\u606f\u622a\u65ad\u635f\u574f\uff08#1052, #1057\uff09\u3002\n- **feat(scheduling)**\uff1a\u5f15\u5165\u57fa\u4e8e\u91cd\u7f6e\u7a97\u53e3\u65f6\u95f4\u7684\u914d\u989d\u6298\u6263\u673a\u5236\uff0c\u6700\u5927\u5316\u5229\u7528\u5373\u5c06\u5237\u65b0\u7684\u914d\u989d\uff08#1055, #1057\uff09\u3002\n- **fix(antigravity)**\uff1a\u5355\u914d\u989d\u6c60\u8017\u5c3d\u4e0d\u518d\u5bfc\u81f4\u6574\u4e2a\u8d26\u53f7\u6807\u8bb0\u4e0d\u53ef\u7528\uff08#1046\uff09\u3002\n\n\u672c\u6b21\u66f4\u65b0\u4e0e\u524d\u7aef codeProxy v0.5.2 \u534f\u540c\u53d1\u5e03\u3002\u591a\u67b6\u6784\u4e8c\u8fdb\u5236\u5305\u4e0e Docker \u955c\u50cf\u5df2\u53d1\u5e03\u81f3 GitHub Release \u4e0e GHCR\u3002\n"}
