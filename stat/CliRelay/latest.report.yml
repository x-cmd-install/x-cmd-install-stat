-10-09T16:20:09Z","updated_at":"2026-10-09T16:20:10Z"},{"id":625496996,"node_id":"RA_kwDORZ9jAc4lSFOk","name":"CliRelay_0.5.8_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":17133868,"digest":"sha256:7774b1bc82ab13a12956473f35b7c376fd1316328a65c1467f67a6aee7d7a6d9","download_count":2,"created_at":"2026-10-09T16:20:08Z","updated_at":"2026-10-09T16:20:09Z"},{"id":625496997,"node_id":"RA_kwDORZ9jAc4lSFOl","name":"CliRelay_0.5.8_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15728323,"digest":"sha256:63edc12a60ffd56ffdc12940528bb1aa2ef39c3c72d9ceca65a59635c71ed187","download_count":3,"created_at":"2026-10-09T16:20:08Z","updated_at":"2026-10-09T16:20:09Z"},{"id":625496995,"node_id":"RA_kwDORZ9jAc4lSFOj","name":"CliRelay_0.5.8_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17485408,"digest":"sha256:e79f71bb8ebb68c9fb7ca4ba5f8e6dae3b6bb8c5cbef3f3b2f889b6d85f7fa9d","download_count":3,"created_at":"2026-10-09T16:20:08Z","updated_at":"2026-10-09T16:20:09Z"},{"id":625496994,"node_id":"RA_kwDORZ9jAc4lSFOi","name":"CliRelay_0.5.8_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":15860244,"digest":"sha256:05c9e114a0e4b108dbedb79a421550bca8836243bbfb657a4c4284629ec4d995","download_count":4,"created_at":"2026-10-09T16:20:08Z","updated_at":"2026-10-09T16:20:09Z"}],"body":"# v0.5.8 - Go Security Update, Sign-in Lockout Warnings, and No More Idle HTTP/2 Connection Pile-ups\n\n> **This release fixes eleven Go standard library and `golang.org/x/net` vulnerabilities; upgrade promptly.** Pair it with **codeProxy v0.6.1**, whose sign-in forms use the fields added here to show the attempts left and to count a lock down. Either upgrade order works; see [Upgrade Notes](#upgrade-notes).\n\n## Highlights\n\n### 1. Go 1.26.9 security update\n* **What was wrong:** v0.5.7 was built with Go 1.26.6 and `golang.org/x/net` v0.57.0. govulncheck now reports eleven vulnerabilities, GO-2026-6603 to GO-2026-6617, that CliRelay's code can reach:\n  * **HTTP/2 server:** a crash from an HPACK encoder race, memory exhaustion from trailer headers, excessive CPU from repeated window changes, and a flow-control accounting error;\n  * **HTTP/2 client:** malformed framing-related headers were accepted;\n  * **HTTP/1:** connections could fall out of sync after a CONNECT response, on the server and on the client;\n  * **Header parsing:** `Range` headers had no size limit, and MIME header parsing could bypass its memory limit;\n  * **`crypto/tls`:** malformed ECH extension references were not rejected;\n  * **Windows only:** `os.Root` directory creation could follow junctions out of the root.\n* **The fix:**\n  * Builds use Go 1.26.9 and `golang.org/x/net` v0.60.0, and govulncheck reports no vulnerabilities that the code reaches.\n  * The Docker image built its updater binary with Go 1.26.1; it now uses 1.26.9 as well.\n* **Upgrade promptly:** CliRelay is both an HTTP server and an HTTP/2 client.\n\n### 2. Sign-in warns before it locks, and says how long a lock lasts\n* **What was wrong:** users were locked out of sign-in without warning and then given the wrong explanation, so they kept guessing.\n  * The admin sign-in locked on the third wrong password, without saying so.\n  * During that lock, wrong passwords still got \"invalid credentials\". Only the correct password got `account_locked`, which the panel shows as \"This account is disabled or locked. Contact your tenant administrator.\" In production, an administrator typed the correct password during a lock, read that message, and gave up for an hour and a half.\n  * Neither the admin nor the portal sign-in said how many attempts were left. The failure that tripped a lock looked like one more wrong password.\n  * Throttle rejections carried the wait only in the `Retry-After` header, which the panel does not read.\n* **The fix:**\n  * The admin panel and the portal now share one cooldown ladder:\n\n    | Failures | Lock |\n    |---|---|\n    | 5 | 1 minute |\n    | 10 | 5 minutes |\n    | 15 | 15 minutes |\n    | 20 | 30 minutes |\n    | 25, and every 5th after | 60 minutes |\n\n    The count restarts after 15 minutes without a failure. There is no permanent lock. The admin panel's first lock moves from 3 failures to 5, matching the portal.\n  * The admin sign-in checks the lock before it checks the password. A sign-in during a lock gets `429 login_cooldown`, whatever password is typed. `account_locked` now means only a lock set by an administrator.\n  * A wrong password that does not trip a lock gets `401 invalid_credentials` with `details.remaining_attempts`. For an ordinary run of mistypes the number is the same whether or not the username exists, so it does not reveal which accounts exist.\n  * The wrong password that trips a lock gets `429`, with the longest of the per-IP, per-account and cooldown waits.\n  * `login_rate_limited` and `login_cooldown` responses carry `details.retry_after_seconds` in the body, as well as the `Retry-After` header.\n\n### 3. Idle HTTP/2 connections to chatgpt.com no longer pile up\n* **What was wrong:** a user reported 373 connections from one relay to `chatgpt.com:443`. They were hours old, and each was exchanging only about 4.7 kB an hour in each direction. Production showed the same: 218 such connections 3.5 hours after a deploy. Two problems combined:\n  * The Codex quota probe built a new fingerprinted transport on every call, and with it a new HTTP/2 connection, which it then abandoned. `account-status-refresh` is on by default and probes every Codex account every 15 minutes. Each round therefore leaked one connection per account, and two for accounts with reset credits.\n  * The health-check pings added in v0.5.7 had no idle timeout. Because pings kept the abandoned connections busy, nothing ever closed them.\n* **The fix:**\n  * Both self-managed HTTP/2 transports, for Anthropic and for the TLS-fingerprinted providers, close a connection that has carried no requests for 90 seconds. This applies however the connection was orphaned. The ping health check is unchanged.\n  * The management fingerprint transport is now cached per egress, so probes through the same egress share one connection. The cache key includes the CA bundle, so a rotated bundle is still picked up.\n  * Connections are cached by `host:port` instead of by host, so a request for one port can never reuse a connection to another.\n\n### 4. `api-call` no longer sends a literal `$TOKEN$` upstream\n* **What was wrong:** `POST /v0/management/api-call` replaces `$TOKEN$` in request headers with the token of the credential chosen by `auth_index`. If the index was missing, stale or from another tenant, the header was sent upstream unchanged as `Authorization: Bearer $TOKEN$`. The upstream's 401 came back wrapped in a 200, and the panel showed the credential as expired. Operators then tried a re-login that could not help.\n* **The fix:** a request with a `$TOKEN$` placeholder is now rejected before anything is sent upstream:\n  * with no `auth_index`: `400 missing auth index`;\n  * with an index that matches no credential in the tenant: `400 auth not found for index`.\n\n  Requests without the placeholder are unaffected.\n\n---\n\n## Detailed Changes\n\n### Backend CliRelay\n- **chore(deps)**: Go 1.26.9 and `golang.org/x/net` v0.60.0 for GO-2026-6603 to GO-2026-6617. The Docker build image moves to `golang:1.26.9-alpine` (#1141).\n- **fix(auth)**: warn before sign-in lockouts and report how long they last, with one cooldown ladder for the admin panel and the portal (#1136).\n- **fix(http2)**: stop idle connections that pings keep alive from piling up on chatgpt.com. Adds an idle timeout to the self-managed HTTP/2 transports, caches the management fingerprint transport, and keys the connection cache by `host:port` (#1137).\n- **fix(api-call)**: refuse `$TOKEN$` headers when the auth index is missing or matches nothing (#1138).\n- **feat(menus)**: an Appearance page under System settings (#1134), retired before release when the panel moved the settings to a header button (#1135). Startup removes the menu row if a development build added it. Upgrading from v0.5.7 leaves the menus unchanged.\n\n## Upgrade Notes\n* **Security:** this release fixes eleven Go and `golang.org/x/net` vulnerabilities. Upgrade even if you do not need the other changes.\n* **Either upgrade order works:**\n  * Panels older than codeProxy v0.6.1 show neither the attempts left nor a countdown. Their admin sign-in shows a lock as \"Too many login attempts, please try again later\".\n  * Panel v0.6.1 on a backend older than v0.5.8 falls back to its previous sign-in messages.\n  * CliRelay pulls the latest codeProxy release on its own, roughly every three hours.\n* **Admin sign-in behaviour changes:**\n  * The first lock now comes on the 5th wrong password, not the 3rd.\n  * During a lock, even the correct password gets `429 login_cooldown`, not `401 account_locked`. Scripts that sign in to the management API and treat `account_locked` as a temporary lock should handle `429` instead, and wait `details.retry_after_seconds` (or `Retry-After`).\n* **api-call:** a `$TOKEN$` request must now carry a valid `auth_index`. Without one it gets `400`, instead of being forwarded with the literal placeholder.\n* **No changes required:** there are no configuration or database schema changes.\n\n<details>\n<summary>\u4e2d\u6587\u8bf4\u660e\uff08\u70b9\u51fb\u5c55\u5f00\uff09</summary>\n\n# v0.5.8 - Go \u5b89\u5168\u66f4\u65b0\u3001\u767b\u5f55\u9501\u5b9a\u524d\u9884\u8b66\u3001HTTP/2 \u7a7a\u95f2\u8fde\u63a5\u4e0d\u518d\u5806\u79ef\n\n> **\u672c\u7248\u4fee\u590d\u4e86 Go \u6807\u51c6\u5e93\u548c `golang.org/x/net` \u4e2d\u7684 11 \u4e2a\u6f0f\u6d1e\uff0c\u8bf7\u5c3d\u5feb\u5347\u7ea7\u3002** \u8bf7\u4e0e **codeProxy v0.6.1** \u642d\u914d\uff0c\u65b0\u9762\u677f\u7684\u767b\u5f55\u8868\u5355\u4f1a\u7528\u8fd9\u91cc\u65b0\u589e\u7684\u5b57\u6bb5\u663e\u793a\u5269\u4f59\u5c1d\u8bd5\u6b21\u6570\u548c\u9501\u5b9a\u5012\u8ba1\u65f6\u3002\u524d\u540e\u7aef\u8c01\u5148\u5347\u7ea7\u90fd\u53ef\u4ee5\uff0c\u8be6\u89c1\u4e0b\u65b9\u5347\u7ea7\u63d0\u793a\u3002\n\n## \u6838\u5fc3\u66f4\u65b0\n\n### 1. Go 1.26.9 \u5b89\u5168\u66f4\u65b0\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1av0.5.7 \u4f7f\u7528 Go 1.26.6 \u548c `golang.org/x/net` v0.57.0 \u6784\u5efa\u3002govulncheck \u73b0\u5728\u62a5\u544a\u4e86 11 \u4e2a CliRelay \u4ee3\u7801\u80fd\u89e6\u8fbe\u7684\u6f0f\u6d1e\uff08GO-2026-6603 \u81f3 GO-2026-6617\uff09\uff1a\n  * **HTTP/2 \u670d\u52a1\u7aef**\uff1aHPACK \u7f16\u7801\u5668\u7ade\u4e89\u5bfc\u81f4\u5d29\u6e83\u3001Trailer \u5934\u5bfc\u81f4\u5185\u5b58\u8017\u5c3d\u3001\u53cd\u590d\u4fee\u6539\u7a97\u53e3\u5bfc\u81f4 CPU \u5360\u7528\u8fc7\u9ad8\uff0c\u4ee5\u53ca\u6d41\u91cf\u63a7\u5236\u8bb0\u8d26\u9519\u8bef\uff1b\n  * **HTTP/2 \u5ba2\u6237\u7aef**\uff1a\u4f1a\u63a5\u53d7\u7578\u5f62\u7684\u5206\u5e27\u76f8\u5173\u5934\uff1b\n  * **HTTP/1**\uff1aCONNECT \u54cd\u5e94\u4e4b\u540e\uff0c\u670d\u52a1\u7aef\u548c\u5ba2\u6237\u7aef\u7684\u8fde\u63a5\u90fd\u53ef\u80fd\u5931\u53bb\u540c\u6b65\uff1b\n  * **\u5934\u90e8\u89e3\u6790**\uff1a`Range` \u5934\u6ca1\u6709\u5927\u5c0f\u9650\u5236\uff0c\u89e3\u6790 MIME \u5934\u65f6\u53ef\u4ee5\u7ed5\u8fc7\u5185\u5b58\u9650\u5236\uff1b\n  * **`crypto/tls`**\uff1a\u6ca1\u6709\u62d2\u7edd\u7578\u5f62\u7684 ECH \u6269\u5c55\u5f15\u7528\uff1b\n  * **\u4ec5 Windows**\uff1a`os.Root` \u521b\u5efa\u76ee\u5f55\u65f6\u53ef\u80fd\u6cbf\u7740 junction \u8df3\u51fa\u6839\u76ee\u5f55\u3002\n* **\u4fee\u590d**\uff1a\n  * \u6784\u5efa\u6539\u7528 Go 1.26.9 \u548c `golang.org/x/net` v0.60.0\uff0cgovulncheck \u4e0d\u518d\u62a5\u544a\u4ee3\u7801\u80fd\u89e6\u8fbe\u7684\u6f0f\u6d1e\u3002\n  * Docker \u955c\u50cf\u4e2d\u7684 updater \u539f\u6765\u7528 Go 1.26.1 \u7f16\u8bd1\uff0c\u73b0\u5728\u540c\u6837\u6539\u7528 1.26.9\u3002\n* **\u8bf7\u5c3d\u5feb\u5347\u7ea7**\uff1aCliRelay \u65e2\u662f HTTP \u670d\u52a1\u7aef\uff0c\u4e5f\u662f HTTP/2 \u5ba2\u6237\u7aef\u3002\n\n### 2. \u767b\u5f55\u5728\u9501\u5b9a\u524d\u7ed9\u51fa\u9884\u8b66\uff0c\u9501\u5b9a\u540e\u8bf4\u660e\u8fd8\u8981\u591a\u4e45\n* **\u539f\u6765\u7684\u95ee\u9898**\uff1a\u7528\u6237\u5728\u6ca1\u6709\u4efb\u4f55\u9884\u8b66\u7684\u60c5\u51b5\u4e0b\u88ab\u9501\u5728\u767b\u5f55\u4e4b\u5916\uff0c\u4e4b\u540e\u770b\u5230\u7684\u63d0\u793a\u8fd8\u662f\u9519\u7684\uff0c\u53ea\u80fd\u4e00\u76f4\u731c\u3002\n  * \u7ba1\u7406\u7aef\u767b\u5f55\u5728\u7b2c 3 \u6b21\u8f93\u9519\u65f6\u5c31\u9501\u5b9a\u4e86\uff0c\u754c\u9762\u4e0a\u6ca1\u6709\u4efb\u4f55\u63d0\u793a\u3002\n  * \u9501\u5b9a\u671f\u95f4\uff0c\u8f93\u9519\u7684\u5bc6\u7801\u4ecd\u7136\u8fd4\u56de\u300c\u7528\u6237\u540d\u6216\u5bc6\u7801\u9519\u8bef\u300d\uff1b\u53ea\u6709\u8f93\u5bf9\u7684\u5bc6\u7801\u624d\u8fd4\u56de `account_locked`\uff0c\u9762\u677f\u628a\u5b83\u663e\u793a\u4e3a\u300c\u5f53\u524d\u8d26\u53f7\u5df2\u88ab\u7981\u7528\u6216\u9501\u5b9a\uff0c\u8bf7\u8054\u7cfb\u79df\u6237\u7ba1\u7406\u5458\u300d\u3002\u751f\u4ea7\u73af\u5883\u91cc\u6709\u7ba1\u7406\u5458\u5728\u9501\u5b9a\u671f\u95f4\u8f93\u5165\u4e86\u6b63\u786e\u5bc6\u7801\uff0c\u770b\u5230\u8fd9\u6761\u63d0\u793a\u540e\u653e\u5f03\u4e86\u4e00\u4e2a\u534a\u5c0f\u65f6\u3002