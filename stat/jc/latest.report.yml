"id":690161399,"node_id":"RA_kwDODNbRf84pIwb3","name":"jc-1.26.2.msi","label":null,"uploader":{"login":"kellyjonbrazil","id":24423665,"node_id":"MDQ6VXNlcjI0NDIzNjY1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11762176,"digest":"sha256:788d5c54af03c4ef010f5aa557012df51330dc36fa607d01b8fef3ac14071ef3","download_count":39,"created_at":"2026-10-29T22:51:46Z","updated_at":"2026-10-29T22:51:54Z"},{"id":690169618,"node_id":"RA_kwDODNbRf84pIycS","name":"jc_1.26.2-1_amd64.deb","label":null,"uploader":{"login":"kellyjonbrazil","id":24423665,"node_id":"MDQ6VXNlcjI0NDIzNjY1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11304996,"digest":"sha256:6e862a83038da2b7e72e23683303f568b356ec9cb7a86e760f0c69e304f9581d","download_count":10,"created_at":"2026-10-29T22:55:09Z","updated_at":"2026-10-29T22:55:18Z"},{"id":690169868,"node_id":"RA_kwDODNbRf84pIygM","name":"jc_1.26.2-1_arm64.deb","label":null,"uploader":{"login":"kellyjonbrazil","id":24423665,"node_id":"MDQ6VXNlcjI0NDIzNjY1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":11166554,"digest":"sha256:f8f74f7196a7a43f8fe8a3837054868c75bec6a3d7eab1fbf71e53112bd12f80","download_count":6,"created_at":"2026-10-29T22:55:18Z","updated_at":"2026-10-29T22:55:25Z"}],"body":"Note: this release changes the output schema of some parsers:\r\n  `x509-cert`/`x509-csr`/`x509-crl`, `proc-net-packet`, `proc-pid-fdinfo`, `ssh-conf`, `iw-scan`, `ping-s`, `proc-pid-numa-maps`, `plist`, and `ifconfig`. Please see the parsers' documentation for the updated schemas.\r\n\r\nNote: the Windows .msi and .zip now include the python 3.14 runtime. The\r\n  executable file is now significantly smaller.\r\n\r\n- Enhance many parsers to avoid slow parsing of long or unusual field values,\r\n  including `cef`, `syslog`, `who`, `iptables`, `nftables`, `mount`, `ss`,\r\n  `ping`, `traceroute`, `ifconfig`, and the `/proc` file parsers\r\n- Enhance table parsers to use less time and memory on wide or ragged tables\r\n- Enhance `yaml`, `plist`, and `xml` parsers to stop with an error when shared\r\n  references or DTD attribute defaults would make the output extremely large\r\n- Fix many parsers to split lines only on LF and CRLF line endings so other\r\n  line-break characters inside a field no longer split a record. This also\r\n  applies to `--slurp` and line slicing\r\n- Fix several parsers to split fields only on spaces and tabs, and enhance the\r\n  `netrc` parser to support quoted values, escapes, comments, and the `user`\r\n  keyword\r\n- Fix several parsers where text inside a value could be mistaken for a new\r\n  record, section, or field (e.g. `rpm-qi`, `pacman`, `cbt`, `http-headers`)\r\n- Fix `dig`, `host`, `rpm-qi`, and `iftop` parsers where data from one record\r\n  could carry into later records\r\n- Fix \"magic\" syntax and `/proc` file input to pass line endings to the parser\r\n  unchanged, matching `STDIN` input\r\n- Fix streaming parsers to read `STDIN` as UTF-8 lines split on LF and CRLF on\r\n  all platforms. Invalid UTF-8 bytes are now shown as escapes instead of\r\n  stopping the parser, even with `-qq`\r\n- Fix several streaming parsers to handle CRLF line endings and blank input\r\n  when used as a python library. Library usage examples now use `split('\\n')`\r\n- Fix `proc` parser to report an error instead of empty output for input that\r\n  is not a recognized `/proc` file\r\n- Fix many parsers where a header-like, keyword-like or separator-like value\r\n  changed how later lines were read (e.g. `arp`, `host`, `iptables`,\r\n  `iwconfig`, `blkid`, `crontab`, `http-headers`, `netstat`, `asciitable`)\r\n- Fix many parsers to keep field values exactly as printed: file names with\r\n  spaces or \" -> \" (`ls`, `stat`, `dir`), quoted or escaped values (`cef`,\r\n  `syslog`, `clf`, `findmnt`, `mount`, `nftables`), git C-quoted paths, ping\r\n  replies, `ss` unix sockets, and `iftop` port-less flows\r\n- Fix `sparse_table_parse` based parsers (`df`, `lsblk`, ...) to align columns\r\n  by display width and keep cell text intact\r\n- Fix `proc` parser to identify `/proc/net/packet` on 64-bit kernels and\r\n  `/proc/net/protocols` on current kernels\r\n- Fix `iostat`, `mpstat`, `pidstat` and their streaming parsers to reject rows\r\n  that do not fit the header\r\n- Fix CLI to escape C1 control characters in JSON output and control\r\n  characters in warning and error messages\r\n- Fix `-M` to replace a `_jc_meta` field found in the parsed data\r\n- Enhance several parsers to avoid repeated scans of long input (e.g.\r\n  `dmidecode`, `ics`, `crontab`, `cef`, `apachectl`, `netstat`, `asciitable`)\r\n- `proc-net-packet` now returns a list of all rows (previously only the first\r\n  row, as an object)\r\n- Fix `x509-crl` parser to convert every CRL in PEM files with more than one\r\n  CRL. The output is now a list of CRL objects (like `x509-cert`), even for\r\n  one CRL. This is a schema change\r\n- Fix `ssh-conf` parser so `remoteforward` and `dynamicforward` are arrays\r\n  of strings (schema change), and add `rekeylimit_bytes`,\r\n  `rekeylimit_seconds` and `controlpersist_seconds`\r\n- Fix `proc-pid-fdinfo` parser to convert octal `flags`/`settime flags` and\r\n  hex inotify `wd`, and to output every lock, epoll target, inotify watch and\r\n  fanotify mark. This is a breaking schema change: `flags` values change,\r\n  `lock`, `epoll` and `inotify` are now lists, and fanotify marks are in a\r\n  `fanotify.marks` list\r\n- Fix `proc-pid-numa-maps` parser so `address` is always a string (all-digit\r\n  addresses such as `00400000` were converted to integers)\r\n- Add `proc-net-udp` parser for `/proc/net/udp` and `/proc/net/udp6`\r\n- Add GeneralName type keys (`*_general_names`, `*_type`) to the `x509-cert`,\r\n  `x509-csr` and `x509-crl` parsers so DNS, email, URI, IP and other names can\r\n  be told apart\r\n- Fix `ifconfig` parser to read BSD and macOS `flags` and `nd6_options` as\r\n  hexadecimal, as `ifconfig` prints them (e.g. `flags=8843` is now `34883`).\r\n  Linux `flags` values are unchanged\r\n- Fix many parsers to split lines only on LF and CRLF (all line-oriented\r\n  parsers except `ping`)\r\n- Fix `iw-scan` parser so a header line from one BSS no longer prefixes the\r\n  keys of the following BSS records. Keys like `config_methods_freq` and\r\n  `bss_load_signal` are now `freq` and `signal_dbm`\r\n- Fix `ping-s` parser to use the integer `response_bytes` field for BSD IPv6\r\n  replies and BSD error records (previously a string `bytes` field, or\r\n  `sent_bytes` for IPv6 errors)\r\n- Fix `ping` and `ping-s` parsers to read the FreeBSD 13+ `ping -6` header\r\n- Fix `ss` parser so the detail lines printed by `-e`, `-i` and `-m` no\r\n  longer create extra records\r\n- Fix `host`, `df`, `rpm-qi`, `pkg-index-deb`, `apt-cache-show` and\r\n  `proc-pid-mountinfo` edge cases (two SOA lines, whitespace-only rows,\r\n  repeated normalized field names, `unbindable` optional field)","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
