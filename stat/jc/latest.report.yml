4:04Z"},{"id":451615429,"node_id":"RA_kwDODNbRf84a6xrF","name":"jc-1.25.7.msi","label":null,"uploader":{"login":"kellyjonbrazil","id":24423665,"node_id":"MDQ6VXNlcjI0NDIzNjY1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":21340160,"digest":"sha256:14efbaa4f72f5c73b15ccd8c0095905aef864ec513c85452dc59f95ea48cbeae","download_count":142,"created_at":"2026-06-18T22:02:11Z","updated_at":"2026-06-18T22:02:13Z"},{"id":451539805,"node_id":"RA_kwDODNbRf84a6fNd","name":"jc_1.25.7-1_arm64.deb","label":null,"uploader":{"login":"kellyjonbrazil","id":24423665,"node_id":"MDQ6VXNlcjI0NDIzNjY1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":28355008,"digest":"sha256:ef19911f6f21867c4cc4e5a34c39e88f419641dcce610712c21f1f6e009c1fc7","download_count":65,"created_at":"2026-06-18T20:06:34Z","updated_at":"2026-06-18T20:07:01Z"},{"id":460711337,"node_id":"RA_kwDODNbRf84bdeWp","name":"jc_1.25.7-2_amd64.deb","label":null,"uploader":{"login":"kellyjonbrazil","id":24423665,"node_id":"MDQ6VXNlcjI0NDIzNjY1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":26945020,"digest":"sha256:82ed1738ea031d2cc5674816351654ff907087ab061579b680f10c70d2720379","download_count":275,"created_at":"2026-06-29T03:01:33Z","updated_at":"2026-06-29T03:01:56Z"}],"body":">Note: I am now using Rosetta to build x86_64 binaries for macOS since my Intel mac finally died\r\n\r\n- Add `csv-ih`, `tsv`, and `tsv-ih` file parsers for CSV files without headers,\r\n  TSV files, and TSV files without headers. Note that these are standard and\r\n  not streaming parsers so the entire CSV/TSV will be loaded into memory. For\r\n  lazy loading equivalents, see below.\r\n- Add `csv-ih-s`, `tsv-s`, and `tsv-ih-s` streaming file parsers for CSV files\r\n  without headers, TSV files, and TSV files without headers. These streaming\r\n  parsers will lazily load the data into memory and may be more suitable for\r\n  extremely large files.\r\n- Add `typeset` and `declare` Bash internal command parser to convert variables\r\n  simple arrays, and associative arrays along with object metadata\r\n- Enhance `pip-show` command parser to add `-f` show files support\r\n- Enhance `rsync` and `rsync-s` parsers to add `--stats` or `--info=stats[1-3]` fields\r\n- Fix `certbot` command parser to allow parsing of named certs\r\n- Fix `dir` command parser for incorrect stripping of the `D:` drive letter\r\n- Fix `hashsum` command parser to correctly parse the `mode` indicator\r\n- Fix `ifconfig` command parser for incorrect stripping of leading zeros in some hex numbers\r\n- Fix `iptables` command parser when Target is blank and verbose output is used\r\n- Fix `lsattr` command parser for filenames with spaces (newlines in filenames are\r\n  still not supported)\r\n- Fix `proc-pid-smaps` proc parser when unknown VmFlags are output\r\n- Fix `jc.utils.timestamp` function and tests for behavior change in python 3.15\r\n- Fix `ufw` command parser to support rule logging. A new boolean `log` field is introduced","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0}}
