onfine Split Video file reads by @erichare in https://github.com/langflow-ai/langflow/pull/15336\n* fix(auth): replace Passlib with bcrypt on release-1.12.4 by @erichare in https://github.com/langflow-ai/langflow/pull/15368\n* fix(api): fail closed on unowned v1 build jobs by @erichare in https://github.com/langflow-ai/langflow/pull/15335\n* fix: enforce admin policy for assistant execution by @erichare in https://github.com/langflow-ai/langflow/pull/15337\n* fix(lfx): skip unsupported files when errors are silent by @erichare in https://github.com/langflow-ai/langflow/pull/15329\n* fix: scope chat memory operations to flow and owner by @erichare in https://github.com/langflow-ai/langflow/pull/15346\n* fix: validate public flows after group expansion by @erichare in https://github.com/langflow-ai/langflow/pull/15342\n* fix(tracing): isolate tracer startup failures on 1.12.4 by @erichare in https://github.com/langflow-ai/langflow/pull/15364\n* fix(amazon): correct S3 uploader strategy and file inputs on 1.12.4 by @erichare in https://github.com/langflow-ai/langflow/pull/15366\n* fix(ssrf): pin direct Requests helper connections by @erichare in https://github.com/langflow-ai/langflow/pull/15340\n* fix: validate database connector bootstrap targets by @erichare in https://github.com/langflow-ai/langflow/pull/15332\n* fix: allow administrator-scoped database TLS files by @erichare in https://github.com/langflow-ai/langflow/pull/15405\n* fix: reject ambiguous Couchbase IPv4 seed prefixes by @erichare in https://github.com/langflow-ai/langflow/pull/15406\n* fix(frontend): keep model picked during a model refresh by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15367\n* fix(lfx): stop flow loads from resetting settings by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15372\n* fix: block known pickle deserializers in generated components by @erichare in https://github.com/langflow-ai/langflow/pull/15345\n* fix(security): protect Bing Search URL from run tweaks by @erichare in https://github.com/langflow-ai/langflow/pull/15330\n* fix: restrict Celery broker messages to JSON by @erichare in https://github.com/langflow-ai/langflow/pull/15344\n* fix(mcp): reject direct Node runtime options in stdio configs by @erichare in https://github.com/langflow-ai/langflow/pull/15338\n* fix(files): sanitize batch archive entry names by @erichare in https://github.com/langflow-ai/langflow/pull/15339\n* fix(agents): show iteration limit notice after text by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15369\n* fix(watsonx): validate credentials with a regional model by @erichare in https://github.com/langflow-ai/langflow/pull/15353\n* fix: hide stored flow credentials from shared readers by @erichare in https://github.com/langflow-ai/langflow/pull/15343\n* fix(deps): 1.12.4 dependency upgrades by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/15427\n* fix: surface credential decryption failures at the default log level by @erichare in https://github.com/langflow-ai/langflow/pull/15434\n* fix(knowledge-bases): keep ingested chunks within Chunk Size when a separator is set by @erichare in https://github.com/langflow-ai/langflow/pull/15421\n* fix(authz): allow only one role per user per assignment scope by @erichare in https://github.com/langflow-ai/langflow/pull/15426\n* fix(schema): sanitize underscore-prefixed field names in create_input_schema_from_json_schema by @TINGyu123644 in https://github.com/langflow-ai/langflow/pull/15411\n* fix(lfx): keep table markdown proportional to data by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15370\n* fix(lfx): apply Chat Output clean data to single tables by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15420\n* fix(lfx): reject inputs shadowed by component methods by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15373\n* fix(authz): reject unknown result and actor_type filters on the audit query by @tarciorodrigues in https://github.com/langflow-ai/langflow/pull/15424\n* fix(release): scope the bundle PyPI guard to the build's lfx line by @erichare in https://github.com/langflow-ai/langflow/pull/15437\n* fix(authz): reject role assignments for inactive users by @erichare in https://github.com/langflow-ai/langflow/pull/15453\n* fix(frontend): keep flow lock saved during node update by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15439\n### \ud83d\udcdd Documentation Updates\n* docs: custom component and local DB hardening by @mendonk in https://github.com/langflow-ai/langflow/pull/15431\n### \u2705 Tests\n* test: give TestPerformIngestionTask its own database by @erichare in https://github.com/langflow-ai/langflow/pull/15423\n\n## New Contributors\n* @premtiwari508 made their first contribution in https://github.com/langflow-ai/langflow/pull/15362\n* @TINGyu123644 made their first contribution in https://github.com/langflow-ai/langflow/pull/15411\n\n**Full Changelog**: https://github.com/langflow-ai/langflow/compare/v1.12.3...v1.12.4","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":7}
