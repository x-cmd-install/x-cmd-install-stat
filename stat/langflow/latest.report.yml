i in https://github.com/langflow-ai/langflow/pull/15007\n* fix(migrations): stop double-prefixing CHECK constraint names under the naming convention by @erichare in https://github.com/langflow-ai/langflow/pull/15009\n* fix(db): give the flow_version CHECK constraint one name across create paths by @erichare in https://github.com/langflow-ai/langflow/pull/15010\n* fix(deps): remove DiskCache and patch ML vulnerabilities by @erichare in https://github.com/langflow-ai/langflow/pull/15019\n* fix: allow vectorizing multiple knowledge base columns by @erichare in https://github.com/langflow-ai/langflow/pull/15016\n* fix(ci): start patch-release RCs at rc0 when the SDK is unchanged by @erichare in https://github.com/langflow-ai/langflow/pull/15022\n* fix(assistant): restore Ollama support in the Langflow Assistant by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15005\n* fix(tasks): stop awaiting Celery's synchronous revoke result by @erichare in https://github.com/langflow-ai/langflow/pull/15026\n* fix(frontend): keep auto-login auth when the session probe answers late by @erichare in https://github.com/langflow-ai/langflow/pull/15028\n* fix(graph): keep Component.stop() branches inactive while a sibling completes by @erichare in https://github.com/langflow-ai/langflow/pull/15029\n* fix(knowledge): honour Vectorize/Identifier flags typed into the column table by @erichare in https://github.com/langflow-ai/langflow/pull/15030\n* fix(lfx): percent-encode \"/\" in database connection passwords by @viktoravelino in https://github.com/langflow-ai/langflow/pull/15032\n* fix(components): read Guardrails AI-check replies via BaseMessage.text by @erichare in https://github.com/langflow-ai/langflow/pull/15042\n* fix(api): stop 500 responses from echoing response-validation input by @erichare in https://github.com/langflow-ai/langflow/pull/15041\n* fix(responses): stream failed agent tool calls as function_call items by @erichare in https://github.com/langflow-ai/langflow/pull/15031\n* fix(api): report missing flows and versions during concurrent deletes by @erichare in https://github.com/langflow-ai/langflow/pull/15065\n* fix(assistant): validate component params before applying any of them by @viktoravelino in https://github.com/langflow-ai/langflow/pull/15036\n* fix(lfx): accept double-encoded Google service account keys by @viktoravelino in https://github.com/langflow-ai/langflow/pull/15064\n* fix(components): inject loop item into every fan-out branch by @gingeekrishna in https://github.com/langflow-ai/langflow/pull/14965\n* fix(deps): override shell-quote and websocket-driver in docs/ to patched versions by @boazgarty in https://github.com/langflow-ai/langflow/pull/15015\n* fix(api): bound message-history reads to stop editor freeze on flows with large chat history by @AhsanAkhlaq in https://github.com/langflow-ai/langflow/pull/15051\n* fix(assistant): preserve dependent choices and token limit resets by @Simonzhaohui in https://github.com/langflow-ai/langflow/pull/15001\n* fix: db session commit before response by @Jkavia in https://github.com/langflow-ai/langflow/pull/15078\n* fix(api): index message history and handle nullable text by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15076\n* fix(responses): stream the final message when no tokens were streamed by @erichare in https://github.com/langflow-ai/langflow/pull/15080\n* fix: allow concurrent flow version attachments on PostgreSQL by @erichare in https://github.com/langflow-ai/langflow/pull/15086\n* fix: warn when restricted workflows substitute saved component code by @erichare in https://github.com/langflow-ai/langflow/pull/15090\n* fix(lfx): close temp file before deleting failed cloud downloads by @viktoravelino in https://github.com/langflow-ai/langflow/pull/15074\n* fix(jobs): atomically claim expired HITL pauses by @olayinkaadelakun in https://github.com/langflow-ai/langflow/pull/15096\n### \ud83d\udcdd Documentation Updates\n* docs: updates to guardrails component and legacy by @mendonk in https://github.com/langflow-ai/langflow/pull/15073\n### \ud83d\udee0 Maintenance Tasks\n* refactor(deps): migrate initial LangChain Community integrations by @erichare in https://github.com/langflow-ai/langflow/pull/15020\n* chore: 1.12.2 dep upgrade by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/15075\n\n## New Contributors\n* @breken-ai made their first contribution in https://github.com/langflow-ai/langflow/pull/15007\n* @boazgarty made their first contribution in https://github.com/langflow-ai/langflow/pull/15015\n* @AhsanAkhlaq made their first contribution in https://github.com/langflow-ai/langflow/pull/15051\n\n**Full Changelog**: https://github.com/langflow-ai/langflow/compare/v1.12.1...v1.12.2","reactions":{"total_count":8,"+1":7,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":13}
