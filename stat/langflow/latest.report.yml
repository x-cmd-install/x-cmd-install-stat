 @erichare in https://github.com/langflow-ai/langflow/pull/15974\r\n* fix(security): isolate MCP batch login and request state by @erichare in https://github.com/langflow-ai/langflow/pull/15978\r\n* fix: secure quickstart PostgreSQL configuration by @erichare in https://github.com/langflow-ai/langflow/pull/15979\r\n* fix(auth): restrict external resolver credentials by @erichare in https://github.com/langflow-ai/langflow/pull/15980\r\n* fix: require OAuth attestation for Slack workspace routing by @erichare in https://github.com/langflow-ai/langflow/pull/15981\r\n* fix: separate user and flow storage namespaces by @erichare in https://github.com/langflow-ai/langflow/pull/15982\r\n* fix: fence stale listener delivery across trigger replicas by @erichare in https://github.com/langflow-ai/langflow/pull/15942\r\n* fix(agentic): check implicit calls in component definitions by @erichare in https://github.com/langflow-ai/langflow/pull/15943\r\n* fix(models): validate unified model credential destinations by @erichare in https://github.com/langflow-ai/langflow/pull/15944\r\n* fix(mcp): validate final shell arguments after headers by @erichare in https://github.com/langflow-ai/langflow/pull/15946\r\n* fix(python): require isolation for untrusted global imports by @erichare in https://github.com/langflow-ai/langflow/pull/15945\r\n* fix: stop listeners when background consent is withdrawn by @erichare in https://github.com/langflow-ai/langflow/pull/16012\r\n* fix(security): pin agentic MCP calls to the backend listener by @erichare in https://github.com/langflow-ai/langflow/pull/16044\r\n* fix(logging): redact credentials from query strings by @erichare in https://github.com/langflow-ai/langflow/pull/16042\r\n* fix(security): validate component connection targets by @erichare in https://github.com/langflow-ai/langflow/pull/16043\r\n* fix(security): block runtime readers in generated components by @erichare in https://github.com/langflow-ai/langflow/pull/16040\r\n* fix(security): enforce MCP HTTP destination policy by @erichare in https://github.com/langflow-ai/langflow/pull/16041\r\n* fix(security): block shipped inspect re-export bypasses by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/16048\r\n* fix: preserve SSO triggers during migration replay by @erichare in https://github.com/langflow-ai/langflow/pull/16058\r\n* fix: block assistant expression evaluation bypasses by @erichare in https://github.com/langflow-ai/langflow/pull/16055\r\n* fix: absorb image dependency CVE workarounds for 1.13.1 by @erichare in https://github.com/langflow-ai/langflow/pull/16121\r\n* fix(deps): dependency upgrades for 1.13.1 by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/16131\r\n### 📝 Documentation Updates\r\n* docs: clarify autologin behavior in install and quickstart by @mendonk in https://github.com/langflow-ai/langflow/pull/15968\r\n### 🛠 Maintenance Tasks\r\n* build: remove the unused MCP Fetch development dependency by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/15585\r\n### ✅ Tests\r\n* test(audio): cover packaged worklet playback and startup failures by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/15584\r\n* test(mcp): cover safe authenticated global and project tool listings by @erichare in https://github.com/langflow-ai/langflow/pull/16047\r\n* test(a2a): cover safe agent-card discovery after owner deactivation by @erichare in https://github.com/langflow-ai/langflow/pull/16045\r\n* test(mcp): cover component policy before tool input preprocessing by @erichare in https://github.com/langflow-ai/langflow/pull/16046\r\n\r\n\r\n**Full Changelog**: https://github.com/langflow-ai/langflow/compare/v1.13.0...v1.13.1","mentions_count":3}
