ber lookup components by @sarveshpatil-plivo in https://github.com/langflow-ai/langflow/pull/14396\n* feat(integrations): add lfx connection resolution contract by @erichare in https://github.com/langflow-ai/langflow/pull/14919\n* feat(integrations): load bundle capability manifests by @erichare in https://github.com/langflow-ai/langflow/pull/14920\n* feat(bundles): add Serply search extension bundle by @googio in https://github.com/langflow-ai/langflow/pull/14626\n* feat(integrations): add persistent connection API by @erichare in https://github.com/langflow-ai/langflow/pull/14921\n* feat(api): add enterprise pre-creation hook registry for projects, users and roles by @erichare in https://github.com/langflow-ai/langflow/pull/14959\n* feat: add Figranium bundle by @erichare in https://github.com/langflow-ai/langflow/pull/15058\n* feat(integrations): broker delegated OAuth connections by @erichare in https://github.com/langflow-ai/langflow/pull/14935\n* feat(integrations): resolve connections per execution principal across entry points by @erichare in https://github.com/langflow-ai/langflow/pull/14946\n* feat(integrations): govern integration providers and actions through the shared policy bundle by @erichare in https://github.com/langflow-ai/langflow/pull/14947\n* feat(mcp): pinned action-to-tool mode with a typed incompatible-tool error by @erichare in https://github.com/langflow-ai/langflow/pull/14948\n* feat(lfx-google): Google Workspace actions on managed connections by @erichare in https://github.com/langflow-ai/langflow/pull/14950\n* feat(integrations): add Microsoft and Slack connection-backed bundles by @erichare in https://github.com/langflow-ai/langflow/pull/14952\n* feat(frontend): render connection_ref fields with a connection picker (INT-8) by @erichare in https://github.com/langflow-ai/langflow/pull/15165\n* feat(api): list OAuth registrations a caller may authorize (INT-8) by @erichare in https://github.com/langflow-ai/langflow/pull/15166\n* feat(integrations): GA validation for dedicated integrations (INT-14 / LE-2472) by @erichare in https://github.com/langflow-ai/langflow/pull/15167\n* feat(triggers): trigger entity, event ledger, and the triggers API (TRG-2 part 1) by @erichare in https://github.com/langflow-ai/langflow/pull/14956\n* feat(triggers): leased dispatcher, retries, dead-lettering, and the executing identity (TRG-2 part 2) by @erichare in https://github.com/langflow-ai/langflow/pull/14957\n* feat(triggers): base trigger component, the schedule trigger, and flow-save reconciliation (TRG-2 part 3) by @erichare in https://github.com/langflow-ai/langflow/pull/14958\n* feat(bundles): add Serping API search extension bundle by @musabgultekin in https://github.com/langflow-ai/langflow/pull/15221\n* feat(triggers): the langflow listeners process, connection leases, and packaging (TRG-3) by @erichare in https://github.com/langflow-ai/langflow/pull/15233\n* feat(triggers): signed push ingress, inbound webhook trigger, and subscription renewal by @erichare in https://github.com/langflow-ai/langflow/pull/15234\n* feat(telemetry): report the database engine in the version event by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15106\n* feat(triggers): Slack message and reaction triggers on the Events API and Socket Mode by @erichare in https://github.com/langflow-ai/langflow/pull/15333\n* feat(frontend): drop a bundle's own name from its components' palette labels by @erichare in https://github.com/langflow-ai/langflow/pull/15390\n* feat(i18n): add Korean (ko) locale for the UI and component descriptions by @pjw81226 in https://github.com/langflow-ai/langflow/pull/15312\n* feat(jobs): opt-in retention for terminal jobs by @erichare in https://github.com/langflow-ai/langflow/pull/15316\n* feat: multi-user editing safety by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/14903\n* feat(triggers): add Microsoft and Google source events by @erichare in https://github.com/langflow-ai/langflow/pull/15396\n* feat(deployments): add atomic replacement and snapshots (LE-2717) by @jordanrfrazier in https://github.com/langflow-ai/langflow/pull/15313\n* feat: background execution job metrics for 1.13 by @erichare in https://github.com/langflow-ai/langflow/pull/15314\n* feat(kb): write precomputed vectors to a knowledge base without re-embedding by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15098\n* feat(files): add relocate-files to copy uploaded file bytes into S3 by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15240\n* feat(db): add a command to convert a SQLite database to Postgres by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15111\n* feat: replace local Chroma knowledge bases with SQLite by @erichare in https://github.com/langflow-ai/langflow/pull/15509\n* feat(kb): add relocate-kb to move knowledge base vectors between backends by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15099\n* feat(cli): add check-integrity to report where an instance disagrees with itself by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15324\n* feat(deployments): declare required model providers and models in deploy artifacts by @Jkavia in https://github.com/langflow-ai/langflow/pull/15548\n* feat(cli): add --json output to convert-sqlite-to-postgres by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15524\n* feat(cli): add migration-preflight to refuse a migration that cannot succeed by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15327\n* feat(cli): add --json output to relocate-files and check the bucket first by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15525\n* feat(i18n): translate the remaining backend strings to Korean by @pjw81226 in https://github.com/langflow-ai/langflow/pull/15435\n* feat: Add Enterprise navigation seams by @deon-sanchez in https://github.com/langflow-ai/langflow/pull/15467\n* feat: application audit log for flows and projects by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15082\n* feat(kb): add --json output to relocate-kb and keep stored content out of errors by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15527\n* feat: add GDPR data subject erase and requests by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15470\n* feat(api): run migration commands as child processes that outlive a request by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15580\n* feat(api): add a write pause for instance migration by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15562\n* feat(cli): add --json output to check-integrity and migration-preflight by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15574\n* feat(authz): add per-resource access exceptions by @olayinkaadelakun in https://github.com/langflow-ai/langflow/pull/15133\n* feat: route product telemetry through Segment by @vjgit96 in https://github.com/langflow-ai/langflow/pull/15616\n* feat(cli): accept the target's Langflow version in migration-preflight by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15575\n* feat(api): run the migration source checks from superuser endpoints by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15576\n* feat(frontend): add a guided Settings > Migration page for superusers by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15577\n* feat(api): pause and resume changes from the migration endpoints by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15601\n* feat(api): test and save the destination of a migration by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15602\n* feat(api): confirm the secret key reached the new instance by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15603\n* feat(api): back up an instance before its migration by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15604\n* feat(flow-versions): keep versions an extension marks as retained by @jordanrfrazier in https://github.com/langflow-ai/langflow/pull/15638\n* feat(frontend): add the destinations step to the migration page by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15606\n* feat(frontend): add the secret key step to the migration page by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15607\n* feat(frontend): add the pause step to the migration page by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15608\n* feat(frontend): add the backup step to the migration page by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15609\n* feat(api): run the database copy from the migration endpoints by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15610\n* feat(api): run the knowledge base and file copies from the migration endpoints by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15611\n* feat(api): record what the admin decides about a migration copy by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15612\n* feat(api): count a migration copy only for the destination it was made to by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15613\n* feat(frontend): add the database copy to the migration page by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15621\n* feat(frontend): add the knowledge base and file copies to the migration page by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15622\n* feat(frontend): let an admin decide what a migration copy asks by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15623\n* feat(frontend): show what a migration pause is still waiting for by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15629\n* feat: let the migration page check the copy and start the new instance by @ogabrielluiz in https://github.com/langflow-ai/langflow/pull/15679\n* feat(flow-versions): let a deploy record a version without pruning by @jordanrfrazier in https://github.com/langflow-ai/langflow/pull/15722\n* feat(deployments): declare and provision what a flow's MCP servers need by @Jkavia in https://github.com/langflow-ai/langflow/pull/15668\n* feat(mrscraper): consolidate bundle into Account, Scraper API, and Web Search by @ai-mrscraper in https://github.com/langflow-ai/langflow/pull/15769\n* feat(frontend): add header logo seam for brand overrides by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15399\n* feat: Add secondary navigation customization seams by @deon-sanchez in https://github.com/langflow-ai/langflow/pull/15741\n### 🐛 Bug Fixes\n* fix(tests): match the publish PATCH by body before opening the shareable playground by @erichare in https://github.com/langflow-ai/langflow/pull/14907\n* fix(admin): harden conflict and prune handling by @erichare in https://github.com/langflow-ai/langflow/pull/14923\n* fix: explain missing Enterprise directory support in admin CLI by @erichare in https://github.com/langflow-ai/langflow/pull/14974\n* fix(variables): import environment globals for every user at startup by @IlyasIsHere in https://github.com/langflow-ai/langflow/pull/14990\n* fix(api): stop 422 responses from echoing submitted values by @erichare in https://github.com/langflow-ai/langflow/pull/15038\n* fix(lfx): import Graph/Vertex at runtime so Flow as Tool can build by @erichare in https://github.com/langflow-ai/langflow/pull/15046\n* fix(agentics): deprecate components whose SDK can't be installed by @erichare in https://github.com/langflow-ai/langflow/pull/15045\n* fix(api): publish administration endpoints in OpenAPI by @erichare in https://github.com/langflow-ai/langflow/pull/15079\n* fix(authz): delete a user's role assignments when the user is deleted & Adds the missing ORM cascade; SQLite never enforces the declared FK CASCADE. by @olayinkaadelakun in https://github.com/langflow-ai/langflow/pull/15124\n* fix(users): enforce case-insensitive username uniqueness by @olayinkaadelakun in https://github.com/langflow-ai/langflow/pull/15123\n* fix(slack): map caller-fault errors to invalid-request and prove headless token identity by @erichare in https://github.com/langflow-ai/langflow/pull/15146\n* fix(flows): own a flow by its project when created in a foreign project by @erichare in https://github.com/langflow-ai/langflow/pull/15170\n* fix(integrations): give connection metadata reads their own rate-limit bucket (INT-14-04) by @erichare in https://github.com/langflow-ai/langflow/pull/15174\n* fix(frontend): mount a tab panel per trigger on the Connections page by @erichare in https://github.com/langflow-ai/langflow/pull/15176\n* fix(frontend): keep other users' connections out of a superuser's Mine tab by @erichare in https://github.com/langflow-ai/langflow/pull/15182\n* fix(google): deprecate Google Search API ahead of the CSE JSON API shutdown by @erichare in https://github.com/langflow-ai/langflow/pull/15183\n* fix(frontend): restore the auth store user from the session probe by @erichare in https://github.com/langflow-ai/langflow/pull/15181\n* fix(integrations): address INT-8 Enterprise QA findings (Gmail errors, auth reload, rate limits, picker, re-authorize) by @erichare in https://github.com/langflow-ai/langflow/pull/15184\n* fix(frontend): resolve legacy replacement hints for extension-bundle components by @erichare in https://github.com/langflow-ai/langflow/pull/15185\n* fix: point legacy components' replacement hints at current categories by @erichare in https://github.com/langflow-ai/langflow/pull/15186\n* fix(frontend): refresh the connections list when OAuth consent lands by @erichare in https://github.com/langflow-ai/langflow/pull/15187\n* fix(api-key): consult a deployment policy wherever a key is minted by @erichare in https://github.com/langflow-ai/langflow/pull/15247\n* fix(connections): validate handles and improve settings usability by @erichare in https://github.com/langflow-ai/langflow/pull/1526