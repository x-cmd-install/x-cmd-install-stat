entials from management responses by @erichare in https://github.com/langflow-ai/langflow/pull/15529\n* fix(a2a): enforce authenticated execution policy by @erichare in https://github.com/langflow-ai/langflow/pull/15530\n* fix(security): restrict built-in code execution to administrators by @erichare in https://github.com/langflow-ai/langflow/pull/15531\n* fix(security): confine stored chat attachments to authorized storage by @erichare in https://github.com/langflow-ai/langflow/pull/15532\n* fix(deps): upgrade vulnerable dependencies for 1.12.5 by @Adam-Aghili in https://github.com/langflow-ai/langflow/pull/15505\n* fix(lfx): stop Data addition from mutating the left operand's lists by @viktoravelino in https://github.com/langflow-ai/langflow/pull/15514\n* fix(mcp): replace a pooled session whose server died by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15469\n* fix(memory): preserve cancelled ingestion status on release-1.12.5 by @erichare in https://github.com/langflow-ai/langflow/pull/15554\n* fix(lfx): match numeric columns in the Filter equals operators by @MohammadHijjawi97 in https://github.com/langflow-ai/langflow/pull/15486\n* fix(api): bound the session list returned by /monitor/messages/sessions by @AhsanAkhlaq in https://github.com/langflow-ai/langflow/pull/15466\n* fix(lfx): skip the markdown delimiter row in Text to DataFrame by @MohammadHijjawi97 in https://github.com/langflow-ai/langflow/pull/15485\n* fix(tools): disambiguate duplicate tool names by @Cristhianzl in https://github.com/langflow-ai/langflow/pull/15556\n* fix(mcp): resolve tool arguments from configured values by @erichare in https://github.com/langflow-ai/langflow/pull/15565\n* fix: preserve source columns when merging tables by @LimbC-C in https://github.com/langflow-ai/langflow/pull/15543\n* fix(playground): keep new chats out of older sessions now that the session list is capped by @viktoravelino in https://github.com/langflow-ai/langflow/pull/15581\n\n## New Contributors\n* @MohammadHijjawi97 made their first contribution in https://github.com/langflow-ai/langflow/pull/15486\n* @LimbC-C made their first contribution in https://github.com/langflow-ai/langflow/pull/15543\n\n**Full Changelog**: https://github.com/langflow-ai/langflow/compare/v1.12.4...v1.12.5","mentions_count":7}
