{"id":322539960,"author":{"login":"cobanov","id":29142615,"node_id":"MDQ6VXNlcjI5MTQyNjE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOLjfS2c4TOZG4","tag_name":"v0.2.0","target_commitish":"main","name":"v0.2.0 - Modernization release","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-05-14T13:02:36Z","updated_at":"2026-05-14T13:03:41Z","published_at":"2026-05-14T13:03:41Z","assets":[],"body":"First release of the modernized `websum` package.\n\n## Install\n\n```bash\npip install 'websum[ollama]'      # local Ollama backend\npip install 'websum[openai]'      # OpenAI backend\npip install 'websum[ui,ollama]'   # with Gradio UI\npip install 'websum[all]'         # everything\n```\n\n## Highlights\n\n- New typed, importable Python API: `Summarizer`, `SummarizerConfig`, `LLMBackend` Protocol.\n- Pluggable LLM backends: built-in `OllamaBackend` and `OpenAIBackend`, custom backends via Protocol.\n- Modern Typer-based CLI: `websum summarize | translate | ui`.\n- Gradio UI moved behind the `ui` extra (lazy import).\n- `src/` layout, PEP 561 `py.typed`, strict mypy, ruff lint+format.\n- GitHub Actions CI across Python 3.10-3.13, PyPI trusted publishing.\n\n## Breaking changes\n\nThe 0.1.x scripts under `app/` are gone. Project renamed from `easy-web-summarizer` to `websum`. See the migration table in [README](https://github.com/cobanov/websum#migration-from-01x) and full notes in [CHANGELOG](https://github.com/cobanov/websum/blob/main/CHANGELOG.md).\n\n## Links\n\n- PyPI: https://pypi.org/project/websum/0.2.0/\n- Source: https://github.com/cobanov/websum"}
