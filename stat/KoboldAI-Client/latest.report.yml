{"id":171356568,"author":{"login":"henk717","id":7526774,"node_id":"MDQ6VXNlcjc1MjY3NzQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOFa6d_84KNrGY","tag_name":"dummy","target_commitish":"main","name":"Looking for our latest KoboldAI product?","draft":false,"immutable":false,"prerelease":false,"created_at":"2024-07-24T09:39:12Z","updated_at":"2024-08-21T21:06:00Z","published_at":"2024-08-21T20:59:42Z","assets":[],"body":"At the time of writing this post the current official KoboldAI branch is outdated and behind in model support.\r\nWant to run the latest models? Want to avoid large downloads and installations?\r\n**Check out [KoboldCpp](https://koboldai.org/cpp), our GGUF based solution.**\r\n\r\nNeed a model for KoboldCpp?\r\n1. [Go to Huggingface and look for GGUF models](https://huggingface.co/models?search=gguf) if you want the GGUF for a specific model search for a part of the name of your model followed by GGUF to find GGUF releases.\r\n2. Go the files tab and pick the file size that best fits your hardware, Q4_K_S is a good balance.\r\n3. Click the small download icon right to the filename to download your GGUF.\r\n4. Load the GGUF in KoboldCpp, you can now use the AI.\r\n\r\nKoboldCpp is available for Windows, Linux and ARM MacOS\r\n\r\n(Files attached below are automatically posted by Github and do not work, please use[ the link above](https://koboldai.org/cpp) to obtain the release).","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
