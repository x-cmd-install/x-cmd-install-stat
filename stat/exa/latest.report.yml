_admin":false},"content_type":"application/zip","state":"uploaded","size":726433,"digest":null,"download_count":127707,"created_at":"2021-04-12T22:31:52Z","updated_at":"2021-04-12T22:31:53Z"},{"id":34895442,"node_id":"MDEyOlJlbGVhc2VBc3NldDM0ODk1NDQy","name":"exa-macos-x86_64-v0.10.1.zip","label":null,"uploader":{"login":"ogham","id":503760,"node_id":"MDQ6VXNlcjUwMzc2MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":627486,"digest":null,"download_count":23733,"created_at":"2021-04-12T22:31:53Z","updated_at":"2021-04-12T22:31:54Z"},{"id":34895444,"node_id":"MDEyOlJlbGVhc2VBc3NldDM0ODk1NDQ0","name":"exa-vendored-source-v0.10.1.zip","label":null,"uploader":{"login":"ogham","id":503760,"node_id":"MDQ6VXNlcjUwMzc2MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21896045,"digest":null,"download_count":2032,"created_at":"2021-04-12T22:31:54Z","updated_at":"2021-04-12T22:32:13Z"}],"body":"A small patch release (exa's first!) to fix a couple of issues (and to demonstrate a quicker release pace).\r\n\r\n### Additions\r\n\r\n_(No new features)_\r\n\r\n### Changes\r\n\r\n- Change the way the \"ignored\" status is aggregated for directories, so directories containing ignored files no longer look like the directory itself is ignored ([bd4f144](https://github.com/ogham/exa/commit/bd4f1448846d1f49f537ad12e2946e0e5280f163))\r\n- Change the icon for TeX files to a \"T\" ([e3e776a](https://github.com/ogham/exa/commit/e3e776a1fa6cb0949f4223e75f86ceff5b1ac075))\r\n- Display the classification character (such as `/` for directories) at the end of symlink targets ([dbd11d3](https://github.com/ogham/exa/commit/dbd11d38042284cc890fdd91760c2f93b65e8553))\r\n- Display more helpful error messages when a number in a command-line option or environment variable fails to be parsed ([550f2d2](https://github.com/ogham/exa/commit/550f2d29c2c4e7e1326df4cdcccb7d47d2e81cd5))\r\n\r\n### Fixes\r\n\r\n- Fix thousand separators not being displayed in file sizes ([7a4cde7](https://github.com/ogham/exa/commit/7a4cde75ebeb166edf4f026ef485f1c54b7375b8))\r\n- Fix `$EXA_GRID_ROWS` displaying the wrong size table in certain situations ([c729e22](https://github.com/ogham/exa/commit/c729e226da0a4696ccee47d62f6627a406d07f6f))\r\n- Fix month name not following locale when a file's date is in the current year ([3a8005c](https://github.com/ogham/exa/commit/3a8005c8404c28701f3c6cabf3883d2d946ff01f))\r\n\r\n### Contributors\r\n\r\nThanks again to ariasuni.","reactions":{"total_count":48,"+1":30,"-1":0,"laugh":0,"hooray":14,"confused":0,"heart":0,"rocket":4,"eyes":0}}
