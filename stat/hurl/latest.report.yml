,{"id":681974495,"node_id":"RA_kwDOEUzCHc4ophrf","name":"hurl_8.1.0_arm64.deb.sha256","label":"","uploader":{"login":"hurl-bot","id":117728909,"node_id":"U_kgDOBwRmjQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":65,"digest":"sha256:7397a58446c5f966431db8bfccbf4fcb70204bdb95453d0a28d8bb12ab91bb5a","download_count":6,"created_at":"2026-10-27T15:18:08Z","updated_at":"2026-10-27T15:18:08Z"}],"body":"[8.1.0 (2026-10-27)](https://github.com/Orange-OpenSource/hurl/blob/master/CHANGELOG.md#8.1.0)\r\n========================================================================================================================\r\n\r\nThanks to\r\n[@BillyLiou](https://github.com/BillyLiou),\r\n[@Thomasdezeeuw](https://github.com/Thomasdezeeuw),\r\n[@eyupcanakman](https://github.com/eyupcanakman),\r\n[@fubar-coder](https://github.com/fubar-coder),\r\n[@ptwales](https://github.com/ptwales),\r\n[@jgarte](https://github.com/jgarte),\r\n[@brenordv](https://github.com/brenordv),\r\n[@linkdd](https://github.com/linkdd),\r\n[@jkellz-dev](https://github.com/jkellz-dev),\r\n[@josh-coderpad](https://github.com/josh-coderpad),\r\n[@qrn12580](https://github.com/qrn12580),\r\n[@1diot9](https://github.com/1diot9),\r\n[@Hama1cco](https://github.com/Hama1cco),\r\n\r\nEnhancements:\r\n\r\n* Add --no-header option to remove specific HTTP header [#4884](https://github.com/Orange-OpenSource/hurl/issues/4884)\r\n* Add --fail-with-body option to output response body when there are errors [#4776](https://github.com/Orange-OpenSource/hurl/issues/4776)\r\n* Add no jsonpath coercion option [#5077](https://github.com/Orange-OpenSource/hurl/issues/5077)\r\n* Add --proxy-header option to send header exclusively to a proxy [#3944](https://github.com/Orange-OpenSource/hurl/issues/3944)\r\n* Add --http2-prior-knowledge command line option to use HTTP/2 without HTTP/1.1 Upgrade [#5126](https://github.com/Orange-OpenSource/hurl/issues/5126)\r\n* Re-export Input struct from hurl_core to hurl [#5128](https://github.com/Orange-OpenSource/hurl/issues/5128)\r\n* Add Sublime Text syntax highlighting [#5298](https://github.com/Orange-OpenSource/hurl/issues/5298)\r\n* Add --tls-max option [#3713](https://github.com/Orange-OpenSource/hurl/issues/3713)\r\n* Skip suggestion fo very long keyword [#5360](https://github.com/Orange-OpenSource/hurl/issues/5360)\r\n* Add --tls-min option to set the minimum allowed TLS version [#5335](https://github.com/Orange-OpenSource/hurl/issues/5335)\r\n* Add Hurl config file [#3629](https://github.com/Orange-OpenSource/hurl/issues/3629)\r\n\r\n\r\nBugs Fixed:\r\n\r\n* Fix misleading error message for not-equal predicate [#2841](https://github.com/Orange-OpenSource/hurl/issues/2841)\r\n* Fix variable option values starting with a number or boolean [#5028](https://github.com/Orange-OpenSource/hurl/issues/5028)\r\n* Fix recorded headers when connecting to proxy with CONNECT [#5091](https://github.com/Orange-OpenSource/hurl/issues/5091)\r\n* Fix Hurl debug curl command when request binary body contains NUL char [#5141](https://github.com/Orange-OpenSource/hurl/issues/5141)\r\n* Don't fail build on Windows if file icon is not reachable [#5207](https://github.com/Orange-OpenSource/hurl/issues/5207)\r\n* Fix parsing exponent in JSONPath expr [#5342](https://github.com/Orange-OpenSource/hurl/issues/5342)\r\n* Add explicit nesting limit to JSONPath expression parsing [#5350](https://github.com/Orange-OpenSource/hurl/issues/5350)\r\n* Fix hurlfmt panic when importing curl commands without a URL [#5354](https://github.com/Orange-OpenSource/hurl/issues/5354)\r\n* Fix crash when receiving non UTF-8 server cookie [#5356](https://github.com/Orange-OpenSource/hurl/issues/5356)\r\n* Fix crash for bad `@cookie_storage_set` comment (experimental feature) [#5348](https://github.com/Orange-OpenSource/hurl/issues/5348)\r\n* Parse finite float in JSONPath [#5330](https://github.com/Orange-OpenSource/hurl/issues/5330)\r\n* Escape curl command from --curl option and --verbose log [#5374](https://github.com/Orange-OpenSource/hurl/issues/5374)\r\n\r\n\r\nSecurity Issues Fixed:\r\n\r\n* Fix CVE-2026-63481 stripping cookie from Cookies section when redirecting to a different host [#5118](https://github.com/Orange-OpenSource/hurl/issues/5118)\r\n* Fix escaping headers values in HTML report [#5228](https://github.com/Orange-OpenSource/hurl/issues/5228)\r\n* Fix symlinks escaping file root [#5289](https://github.com/Orange-OpenSource/hurl/issues/5289)\r\n* Fix credentials leaking using --header and following redirection [#5310](https://github.com/Orange-OpenSource/hurl/issues/5310)\r\n* Add explicit nesting limit to JSON Body parsing [#5317](https://github.com/Orange-OpenSource/hurl/issues/5317)\r\n* Fix escaping capture name in HTML report [#5346](https://github.com/Orange-OpenSource/hurl/issues/5346)\r\n\r\n\r\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":3,"eyes":0}}
