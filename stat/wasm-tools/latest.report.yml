n* Implement cm64 handling for `thread.new-indirect` by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2733\n* Limit types in `rec` groups in components by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2726\n* Improve handling of `exact` functions in components by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2729\n* Fix some edge case behavior of btree collections by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2751\n* Fix subtyping of globals in components by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2750\n* Fix type checks in components w.r.t. kebab-names by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2752\n* Increase the maximum number of tables by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2756\n* Fix some minor issues with components and named imports by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2753\n* Fix a panic validating components & resources by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2754\n* Fix a panic when processing an invalid component by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2757\n* Fix an exponential algorithm validating components by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2755\n* Fix some minor issues with incremental-parse fuzzer by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2759\n* Disallow `borrow` types in `task.return` immediates by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2761\n* Scope the debug-only arity-tracking a bit more by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2758\n* OperatorValidator: reduce debug state used to check arity by @keithw in https://github.com/bytecodealliance/wasm-tools/pull/2762\n* Revert \"feat(wit-parser): Add support for a custom WIT package `deps` path (#2677)\" by @celarye in https://github.com/bytecodealliance/wasm-tools/pull/2764\n* wasmparser: share the function subtyping check by @Lstarsky0 in https://github.com/bytecodealliance/wasm-tools/pull/2765\n* Make `component target` semver compatible by @chenyan2002 in https://github.com/bytecodealliance/wasm-tools/pull/2763\n* Keep track of more type depth in wit-smith by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2769\n* Remove `explicit_resources` maps by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2760\n* Rename `versionsuffix` to `version-suffix` in the text format by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2770\n* Release wasm-tools 1.262.0 by @github-actions[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2771\n\n\n**Full Changelog**: https://github.com/bytecodealliance/wasm-tools/compare/v1.261.0...v1.262.0","mentions_count":5}
