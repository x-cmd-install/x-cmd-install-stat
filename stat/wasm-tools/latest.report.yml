"created_at":"2026-10-30T20:30:30Z","updated_at":"2026-10-30T20:30:31Z"},{"id":693335323,"node_id":"RA_kwDOD9Ayn84pU3Ub","name":"wasm-tools-1.263.0-x86_64-macos.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":5657377,"digest":"sha256:909061aba8c069aeed8cb0933e50973a9c8e869bbd6a7819176b49871a338424","download_count":17,"created_at":"2026-10-30T20:30:30Z","updated_at":"2026-10-30T20:30:31Z"},{"id":693335327,"node_id":"RA_kwDOD9Ayn84pU3Uf","name":"wasm-tools-1.263.0-x86_64-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":6357446,"digest":"sha256:b9bf473d8c676f7590b98a12d81b43ad88b2eec5233795a861874c606fce1f81","download_count":11,"created_at":"2026-10-30T20:30:30Z","updated_at":"2026-10-30T20:30:31Z"},{"id":693335326,"node_id":"RA_kwDOD9Ayn84pU3Ue","name":"wasm-tools-1.263.0-x86_64-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4715259,"digest":"sha256:0803df158b4dbea6b029d11f4206c414f432f0447af91542817061e4f0bd912e","download_count":38,"created_at":"2026-10-30T20:30:30Z","updated_at":"2026-10-30T20:30:31Z"}],"body":"## What's Changed\n* Bump arbitrary from 1.4.2 to 1.5.0 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2772\n* mutate: Remove `eq-associates` rewrite rules by @tamaroning in https://github.com/bytecodealliance/wasm-tools/pull/2776\n* wit-parser: reject @external-id where it isn't supported by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2781\n* mutate: Remove algebric rewrites that breaks semantics by @tamaroning in https://github.com/bytecodealliance/wasm-tools/pull/2774\n* wast: support map values by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2784\n* wasm-wave: return an error instead of panicking on unsupported values by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2778\n* Expose the types within a `ModuleType` by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2786\n* wast: accept import/export attributes in any order by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2780\n* Update spec test suite by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2787\n* wasm-wave: support the component model map type by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2782\n* Bump wit-bindgen from 0.62.0 to 0.63.0 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2788\n* mutate: Don't reorder, drop or duplicate effectful operands by @tamaroning in https://github.com/bytecodealliance/wasm-tools/pull/2775\n* Move recursion in `wasmprinter` to the heap by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2790\n* Reject handles in the value types of maps by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2791\n* Plumb wasm features through reencoding/printing by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2797\n* Implement the acquire-release-atomics proposal by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2799\n* wasmprinter: fix outer aliases that print unparsable or shadowed identifiers by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2795\n* wast: parse core rec groups in component and instance types by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2798\n* Implement the multibyte-array-access proposal by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2800\n* wit-parser: fix panics decoding WIT from components by @jrandolf in https://github.com/bytecodealliance/wasm-tools/pull/2794\n* Bump wasmtime from 49.0.1 to 50.0.0 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2801\n* wasm-wave: require commas between record/flag/map entries per the grammar by @willemschots in https://github.com/bytecodealliance/wasm-tools/pull/2802\n* Release wasm-tools 1.263.0 by @github-actions[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2803\n\n## New Contributors\n* @tamaroning made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2776\n* @jrandolf made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2781\n* @willemschots made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2802\n\n**Full Changelog**: https://github.com/bytecodealliance/wasm-tools/compare/v1.262.0...v1.263.0","mentions_count":5}
