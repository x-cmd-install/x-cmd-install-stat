41\n* wasm-encoder: add `ComponentBuilder::start()` by @zacharywhitley in https://github.com/bytecodealliance/wasm-tools/pull/2657\n* fix: validate linker intrinsic function signatures by @RanaPriyansh in https://github.com/bytecodealliance/wasm-tools/pull/2646\n* Fix handling of names of fields in the text format by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2651\n* Don't emit a second `name` section by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2659\n* Update extended-name-section proposal implementation by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2658\n* Implement canonical interface names in wit-component by @chenyan2002 in https://github.com/bytecodealliance/wasm-tools/pull/2622\n* wasm-mutate: add export mutator by @GtechGovind in https://github.com/bytecodealliance/wasm-tools/pull/2639\n* wasmparser: Increase `MAX_WASM_INSTANCES` to `4_096` by @noobHappylife in https://github.com/bytecodealliance/wasm-tools/pull/2661\n* wasm-encoder: add ComponentBuilder::instantiate_exports by @zacharywhitley in https://github.com/bytecodealliance/wasm-tools/pull/2655\n* Try out dependabot on this repo by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2662\n* Fix parsing empty compact import encoding groups by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2664\n* Fix an invalid mutation with a tag section by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2665\n* Support multiple supertypes in everything but validation by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2652\n* Update spec test suite submodule by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2667\n* Implement validation of custom sections by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2668\n* Remove unused dependencies from workspace by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2669\n* feat: add `{stream,future}.forward` canon builtins by @rvolosatovs in https://github.com/bytecodealliance/wasm-tools/pull/2614\n* Fix `wasm-tools component new` for page-size-1 memory by @chenyan2002 in https://github.com/bytecodealliance/wasm-tools/pull/2666\n* Add getter and setter support by @bvisness in https://github.com/bytecodealliance/wasm-tools/pull/2660\n* Rename seq_cst/acq_rel in the text format by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2673\n* fix(canonical-names): disallow encoding multiple exports with the same name by @chenyan2002 in https://github.com/bytecodealliance/wasm-tools/pull/2672\n* Update wit-bindgen dep to 0.62.0 by @tschneidereit in https://github.com/bytecodealliance/wasm-tools/pull/2675\n* Remove some permissive error messages in spec tests by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2676\n* feat(wit-parser): Add support for a custom WIT package `deps` path by @celarye in https://github.com/bytecodealliance/wasm-tools/pull/2677\n* Reuse some wasm-encoder encoding in `wast` by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2674\n* Don't duplicate instruction encodings in `wast` by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2679\n* fix: disallow empty records and flags by @asteurer in https://github.com/bytecodealliance/wasm-tools/pull/2680\n* wasm-wave: Parse flags in declaration order and accept `%` labels by @Lstarsky0 in https://github.com/bytecodealliance/wasm-tools/pull/2678\n* Fix a validation-time panic in component type remapping by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2684\n* Fix `br_on_cast{,_fail}` accepting continuation types by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2683\n* Fix unbounded recursion parsing component types by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2686\n* Fix typechecking async intrinsics with memory64 by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2691\n* Fix type-checking table64 imports by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2692\n* wit-parser: disallow empty tuples by @youdie006 in https://github.com/bytecodealliance/wasm-tools/pull/2694\n* Fix a missing validation of `future.write` by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2690\n* Copy some metadata files from Wasmtime by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2696\n* Fix index space confusion with custom descriptors by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2682\n* Fix allocating type ids beyond wasmparser's implementation limit by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2687\n* Shift component type depth limit to catch more cases by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2685\n* Fix a debug assert firing with multiple supertypes by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2689\n* Add support for new dylink/linking subsections by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2697\n* Fix long validation of `array.new-fixed` in unreachable code by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2688\n* Validate canonical name split and some refactoring by @chenyan2002 in https://github.com/bytecodealliance/wasm-tools/pull/2693\n* Check the type of `__wasm_call_ctors` and `__wasm_apply_data_relocs` by @Lstarsky0 in https://github.com/bytecodealliance/wasm-tools/pull/2699\n* wasm-wave: Fix worst case quadratic parsing of flags by @lann in https://github.com/bytecodealliance/wasm-tools/pull/2700\n* Try to fix dependabot configuration by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2701\n* Bump actions/configure-pages from 5 to 6 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2703\n* Bump actions/upload-pages-artifact from 3 to 5 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2702\n* Bump actions/deploy-pages from 4 to 5 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2704\n* Bump actions/checkout from 6 to 7 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2706\n* Bump actions/upload-artifact from 4 to 7 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2705\n* Bump wasmtime from 48.0.1 to 49.0.1 by @dependabot[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2709\n* Release wasm-tools 1.260.0 by @github-actions[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2711\n\n## New Contributors\n* @dishmaker made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2653\n* @GtechGovind made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2641\n* @zacharywhitley made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2657\n* @RanaPriyansh made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2646\n* @noobHappylife made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2661\n* @celarye made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2677\n* @asteurer made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2680\n* @youdie006 made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2694\n* @dependabot[bot] made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2703\n\n**Full Changelog**: https://github.com/bytecodealliance/wasm-tools/compare/v1.259.0...v1.260.0","mentions_count":16}
