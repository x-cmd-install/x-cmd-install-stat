ttps://github.com/bytecodealliance/wasm-tools/pull/2625\n* Add compact import generation in wasm-smith by @chacailline in https://github.com/bytecodealliance/wasm-tools/pull/2627\n* Drop hyphens when testing equality of kebab names by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2626\n* Enable wide-arithmetic by default in wasm-smith by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2628\n* Validate the size of defined component types by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2624\n* Update Wasmtime used in testing/fuzzing by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2629\n* Fix text format outer aliases from recent refactor by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2631\n* Remove `cancellable` immediate from component model intrinsics by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2630\n* Start requiring \"strict\" indices in the text format by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2633\n* Enable the `cm-implements` and `cm-map` features by default by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2634\n* Clamp sizes of element segments in wasm-smith by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2632\n* Fix wit-smith generating huge types by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2636\n* Fix disallow_traps in wasm-smith with custom page sizes by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2635\n* Resolve Cargo warnings on nightly by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2642\n* Return an error instead of panicking on fixed-length-list size overflow by @zikk090 in https://github.com/bytecodealliance/wasm-tools/pull/2643\n* Try to improve performance of `deinline_import_export` by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2647\n* Document a non-obvious method argument by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2645\n* wasm-wave: Clean up syntax docs by @lann in https://github.com/bytecodealliance/wasm-tools/pull/2644\n* Update dependency major tracks by @alexcrichton in https://github.com/bytecodealliance/wasm-tools/pull/2649\n* Release wasm-tools 1.259.0 by @github-actions[bot] in https://github.com/bytecodealliance/wasm-tools/pull/2650\n\n## New Contributors\n* @chacailline made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2627\n* @zikk090 made their first contribution in https://github.com/bytecodealliance/wasm-tools/pull/2643\n\n**Full Changelog**: https://github.com/bytecodealliance/wasm-tools/compare/v1.258.0...v1.259.0","mentions_count":4}
