  "body": "The fixes of the week!\r\n\r\nNeovide will always be free and open-source.\r\n\r\n[Sponsorship](https://github.com/sponsors/neovide) is highly appreciated.\r\n\r\n## What's Changed\r\n\r\n### Bug Fixes\r\n* fix: handle nvim-initiated too-large resizes by @CGamesPlay in https://github.com/neovide/neovide/pull/3439\r\n* fix: stop retrying invalid fallback entries on shape-cache misses by @falcucci in https://github.com/neovide/neovide/pull/3468\r\n* ui2: don't let resize restore hidden grids by @falcucci in https://github.com/neovide/neovide/pull/3476\r\n* fix: keypad * mapping (use NumpadMultiply instead of NumpadStar) by @pvxx in https://github.com/neovide/neovide/pull/3477\r\n\r\n### Docs\r\n* docs: update tracy dependency instructions by @falcucci in https://github.com/neovide/neovide/pull/3472\r\n\r\n## New Contributors\r\n* @pvxx made their first contribution in https://github.com/neovide/neovide/pull/3477\r\n\r\n**Full Changelog**: https://github.com/neovide/neovide/compare/0.16.1...0.16.2",
