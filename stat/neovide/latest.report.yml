dy":"### Neovim 0.12+ is now required\r\n\r\nhey there everyone! from now on, we have decided to raise the minimum neovim version to 0.12+ in #3588. this also applies when using WSL or connecting to a remote neovim server. If you need an older neovim version, use an earlier Neovide release that supports it.\r\n\r\n## Features\r\n\r\n- feat: support neovim :connect by @falcucci in https://github.com/neovide/neovide/pull/3614\r\n- macOS: add a custom native Editors window switcher by @falcucci in https://github.com/neovide/neovide/pull/3527\r\n- macos: add split-aware scrollbars at both outer window padding by @falcucci in https://github.com/neovide/neovide/pull/3589\r\n- handoff: Add neovim-bin and neovim arguments by @CGamesPlay in https://github.com/neovide/neovide/pull/3440\r\n- feat: settings for menu shortcuts on macOS by @vapourismo in https://github.com/neovide/neovide/pull/3481\r\n- macos: add system window proxy icon support by @falcucci in https://github.com/neovide/neovide/pull/3494\r\n- add startup-message capture settings by @falcucci in https://github.com/neovide/neovide/pull/3517\r\n- handle neovim bufwrite progress events by @falcucci in https://github.com/neovide/neovide/pull/3546\r\n\r\n## Bug Fixes\r\n\r\n- fix: panicking on zero-height grids by @falcucci in https://github.com/neovide/neovide/pull/3487\r\n- fix: track reasonable cmdline modes and reset springs on immediate cursor moves by @falcucci in https://github.com/neovide/neovide/pull/3484\r\n- fix: avoid fullscreen on new tab windows if already set by @falcucci in https://github.com/neovide/neovide/pull/3496\r\n- fix event loop CPU spin without deadline by @falcucci in https://github.com/neovide/neovide/pull/3503\r\n- fix: surface startup errors before first grid - 0.12+ only by @falcucci in https://github.com/neovide/neovide/pull/3504\r\n- windows: fix overlapped pipe read crash by @windexlight in https://github.com/neovide/neovide/pull/3505\r\n- fix: parsing neovim api function parameters by @onion108 in https://github.com/neovide/neovide/pull/3530\r\n- fix: ignore unrelated config directory events by @fzlzjerry in https://github.com/neovide/neovide/pull/3545\r\n- fix: render COLRv1 fonts on Linux by @fzlzjerry in https://github.com/neovide/neovide/pull/3544\r\n- bridge: handle quit callbacks without an exit code by @falcucci in https://github.com/neovide/neovide/pull/3583\r\n- fix: harden neovim restart handling by @BreezeDelegate in https://github.com/neovide/neovide/pull/3552\r\n- fix: preserve Windows file drop paths by @BreezeDelegate in https://github.com/neovide/neovide/pull/3553\r\n- fix: preserve channel properties across :restart by @falcucci in https://github.com/neovide/neovide/pull/3591\r\n- fix: request activation for wayland focus commands by @falcucci in https://github.com/neovide/neovide/pull/3592\r\n- fix --wayland-app-id option by @falcucci in https://github.com/neovide/neovide/pull/3594\r\n- fix: avoid startup crashes when configured fonts are missing by @falcucci in https://github.com/neovide/neovide/pull/3595\r\n- fix: keep grid contents when win_pos reports a stale window size by @SirVer in https://github.com/neovide/neovide/pull/3612\r\n\r\n## Performance and visual polish\r\n\r\n- Cursor Polish by @Kethku in https://github.com/neovide/neovide/pull/3543\r\n- batch wheel scrolls by @falcucci in https://github.com/neovide/neovide/pull/3562\r\n- fill fractional bottom edge backgrounds by @falcucci in https://github.com/neovide/neovide/pull/3572\r\n\r\n## Documentation\r\n\r\n- update homebrew installation docs. by @falcucci in https://github.com/neovide/neovide/pull/3582\r\n- docs: add new :NeovideHelp as immediate forward by @falcucci in https://github.com/neovide/neovide/pull/3587\r\n- fix(docs): escape / in autocmd pattern by @pilgrimlyieu in https://github.com/neovide/neovide/pull/3570\r\n- docs: add macos opt-in system scrollbars by @falcucci in https://github.com/neovide/neovide/pull/3610\r\n\r\n## Refactoring\r\n\r\n- moving platform window wrapper to sub-mod by @falcucci in https://github.com/neovide/neovide/pull/3600\r\n- moving and creating window platform setup sub-mods by @falcucci in https://github.com/neovide/neovide/pull/3602\r\n- moving macos window/settings into window platform sub-mods by @falcucci in https://github.com/neovide/neovide/pull/3603\r\n- moving macos platform scrollbar to window wrapper by @falcucci in https://github.com/neovide/neovide/pull/3604\r\n- moving macos switcher to window wrapper by @falcucci in https://github.com/neovide/neovide/pull/3605\r\n- moving platform root into sub-mods by @falcucci in https://github.com/neovide/neovide/pull/3606\r\n- moving platform application into sub-mods by @falcucci in https://github.com/neovide/neovide/pull/3607\r\n- macos: fix unnecessary wrapper imports and some cleanup by @falcucci in https://github.com/neovide/neovide/pull/3608\r\n- wrapper: stop referencing the parent mod on specific cases. by @falcucci in https://github.com/neovide/neovide/pull/3609\r\n- chore: move error_handling.rs => errors/mod.rs by @falcucci in https://github.com/neovide/neovide/pull/3611\r\n\r\n## Build and maintenance\r\n\r\n- fix clippy warnings after new rust stable version by @falcucci in https://github.com/neovide/neovide/pull/3485\r\n- chore: update rust edition to 2024 by @falcucci in https://github.com/neovide/neovide/pull/3489\r\n- bump skia-safe to 0.97 by @falcucci in https://github.com/neovide/neovide/pull/3501\r\n- bump skia-safe to 0.97.2 by @falcucci in https://github.com/neovide/neovide/pull/3510\r\n- ci: fix AppImage updates for nightly builds by @mareklangiewicz in https://github.com/neovide/neovide/pull/3535\r\n- swap the drained vector out using std::mem::take by @falcucci in https://github.com/neovide/neovide/pull/3559\r\n- profile scroll command pressure without tracy fibers by @falcucci in https://github.com/neovide/neovide/pull/3561\r\n- bump skia-safe to 0.99.0 by @falcucci in https://github.com/neovide/neovide/pull/3560\r\n- fix clippy errors from derive-new crate by @falcucci in https://github.com/neovide/neovide/pull/3584\r\n- macso: fix entitlements with audio-input access by @falcucci in https://github.com/neovide/neovide/pull/3585\r\n- macos: fix YAML sign formatting by @falcucci in https://github.com/neovide/neovide/pull/3586\r\n- experimental: bump rust nightly for better fmt and features by @falcucci in https://github.com/neovide/neovide/pull/3597\r\n- bump skia-safe 0.156.0 by @falcucci in https://github.com/neovide/neovide/pull/3615\r\n- chore: automatic draft release by @falcucci in https://github.com/neovide/neovide/pull/3558\r\n\r\n## New Contributors\r\n\r\n- @vapourismo made their first contribution in https://github.com/neovide/neovide/pull/3481\r\n- @windexlight made their first contribution in https://github.com/neovide/neovide/pull/3505\r\n- @onion108 made their first contribution in https://github.com/neovide/neovide/pull/3530\r\n- @mareklangiewicz made their first contribution in https://github.com/neovide/neovide/pull/3535\r\n- @fzlzjerry made their first contribution in https://github.com/neovide/neovide/pull/3545\r\n- @dajiaohuang made their first contribution in https://github.com/neovide/neovide/pull/3566\r\n- @BreezeDelegate made their first contribution in https://github.com/neovide/neovide/pull/3552\r\n- @pilgrimlyieu made their first contribution in https://github.com/neovide/neovide/pull/3570\r\n- @SirVer made their first contribution in https://github.com/neovide/neovide/pull/3612\r\n\r\nFull Changelog: https://github.com/neovide/neovide/compare/0.16.2...0.17.0\r\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":12}
