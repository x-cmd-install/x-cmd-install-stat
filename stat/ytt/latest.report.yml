LuFM4eo3jt","name":"ytt-linux-riscv64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":16493138,"digest":"sha256:32aa25be4f624d202059d82890f986ef96100ce7b031b17e3d5ce3298094cc25","download_count":6,"created_at":"2026-08-14T06:24:16Z","updated_at":"2026-08-14T06:24:17Z"},{"id":514029801,"node_id":"RA_kwDOClLuFM4eo3jp","name":"ytt-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":18252288,"digest":"sha256:7ca5bc2c8f7f854ac88d2e66c9ffd4a13439597fc2c32b342691e46a488318eb","download_count":370,"created_at":"2026-08-14T06:24:15Z","updated_at":"2026-08-14T06:24:17Z"},{"id":514029784,"node_id":"RA_kwDOClLuFM4eo3jY","name":"ytt-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":16788992,"digest":"sha256:270f4446e8aefe6c73e5ac1901f60eb325213a9ba4d654c66bc028a1ec6056f8","download_count":21,"created_at":"2026-08-14T06:24:14Z","updated_at":"2026-08-14T06:24:15Z"}],"body":"<details>\r\n\r\n<summary><h2>Installation and signature verification</h2></summary>\r\n\r\n### Installation\r\n\r\n#### By downloading binary from the release\r\n\r\nFor instance, if you are using Linux on an AMD64 architecture:\r\n```shell\r\n# Download the binary\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.2/ytt-linux-amd64\r\n\r\n# Move the binary in to your PATH\r\nmv kapp-linux-amd64 /usr/local/bin/ytt\r\n\r\n# Make the binary executable\r\nchmod +x /usr/local/bin/ytt\r\n```\r\n\r\n#### Via Homebrew (macOS or Linux)\r\n```shell\r\n$ brew tap carvel-dev/carvel\r\n$ brew install ytt\r\n$ ytt version  \r\n```\r\n\r\n### Verify checksums file signature\r\n\r\nThe checksums file provided within the artifacts attached to this release is signed using [Cosign](https://docs.sigstore.dev/cosign/overview/) with GitHub OIDC(Refer [this](https://docs.sigstore.dev/system_config/installation/) page for cosign installation). To validate the signature of this file, run the following commands:\r\n\r\n```shell\r\n# Download the checksums file, certificate and signature\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.2/checksums.txt\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.2/checksums.txt.pem\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.2/checksums.txt.sig\r\n\r\n# Verify the checksums file\r\ncosign verify-blob checksums.txt \\\r\n  --certificate checksums.txt.pem \\\r\n  --signature checksums.txt.sig \\\r\n  --certificate-identity-regexp=https://github.com/carvel-dev \\\r\n  --certificate-oidc-issuer=https://token.actions.githubusercontent.com\r\n```\r\n\r\n### Verify binary integrity\r\n\r\nTo verify the integrity of the downloaded binary, you can utilize the checksums file after having validated its signature.\r\n```shell\r\n# Verify the binary using the checksums file\r\nsha256sum -c checksums.txt --ignore-missing\r\n```\r\n</details>\r\n\r\n## What's Changed\r\n* Bump go to v1.26.3 by @sameerforge in https://github.com/carvel-dev/ytt/pull/988\r\n* Bump OSS components github.com/hashicorp/go-version to v1.7.0 and github.com/BurntSuhi/toml to v1.5.0 by @G-Gobi in https://github.com/carvel-dev/ytt/pull/993\r\n* Reduce allocation size when emitting yaml by @emh-jump in https://github.com/carvel-dev/ytt/pull/995\r\n* Allow md5.sum() to run under strict FIPS 140-3 enforcement by @sameerforge in https://github.com/carvel-dev/ytt/pull/1001\r\n\r\n## New Contributors\r\n* @G-Gobi made their first contribution in https://github.com/carvel-dev/ytt/pull/993\r\n\r\n**Full Changelog**: https://github.com/carvel-dev/ytt/compare/v0.55.1...v0.55.2\r\n\r\n\r\n# :open_file_folder: Files Checksum\r\n \r\n ```\r\n270f4446e8aefe6c73e5ac1901f60eb325213a9ba4d654c66bc028a1ec6056f8  ./ytt-windows-arm64.exe\r\n7ca5bc2c8f7f854ac88d2e66c9ffd4a13439597fc2c32b342691e46a488318eb  ./ytt-windows-amd64.exe\r\n32aa25be4f624d202059d82890f986ef96100ce7b031b17e3d5ce3298094cc25  ./ytt-linux-riscv64\r\n6b09566cd9cbe90050c8685889aa1eef050c3f1168809df2486062e8a3ed1ec0  ./ytt-linux-arm64\r\n512cc21193d3b0ce307b6e8db6ba8d40831f16e02526e1c753416456ea4319af  ./ytt-linux-amd64\r\n4a61ebc3cace9ed6c1f2d4cc7285589e85c58869d96bc36cb0d09987ec14fcd1  ./ytt-darwin-arm64\r\nb7b8435cd5cca719b933b0bc846a0f872bd2ed0c68fa9b74ec8369bef2ac0987  ./ytt-darwin-amd64\r\n```","mentions_count":3}
