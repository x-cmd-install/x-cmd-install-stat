```\r\n\r\n#### Via Homebrew (macOS or Linux)\r\n```shell\r\n$ brew tap carvel-dev/carvel\r\n$ brew install ytt\r\n$ ytt version  \r\n```\r\n\r\n### Verify checksums file signature\r\n\r\nThe checksums file provided within the artifacts attached to this release is signed using [Cosign](https://docs.sigstore.dev/cosign/overview/) with GitHub OIDC(Refer [this](https://docs.sigstore.dev/system_config/installation/) page for cosign installation). To validate the signature of this file, run the following commands:\r\n\r\n```shell\r\n# Download the checksums file, certificate and signature\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.56.0/checksums.txt\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.56.0/checksums.txt.pem\r\ncurl -LO https://github.com/carvel-dev/ytt/releases/download/v0.56.0/checksums.txt.sig\r\n\r\n# Verify the checksums file\r\ncosign verify-blob checksums.txt \\\r\n  --certificate checksums.txt.pem \\\r\n  --signature checksums.txt.sig \\\r\n  --certificate-identity-regexp=https://github.com/carvel-dev \\\r\n  --certificate-oidc-issuer=https://token.actions.githubusercontent.com\r\n```\r\n\r\n### Verify binary integrity\r\n\r\nTo verify the integrity of the downloaded binary, you can utilize the checksums file after having validated its signature.\r\n```shell\r\n# Verify the binary using the checksums file\r\nsha256sum -c checksums.txt --ignore-missing\r\n```\r\n</details>\r\n\r\n## Changelog\r\n* f5a96fc Accept a string for overlay/match by= on documents\r\n* 052cd45 Allow a comment after a value, map key or annotation arguments\r\n* 6d95755 Allow template.replace() to reuse the placeholder's map key\r\n* 7e9e280 End a stripped comment at a carriage return too\r\n* acb2cfc Fix panic when appending a document with no other documents\r\n* 944ac04 Keep the new error message inside the line length limit\r\n* 3f12edd Merge pull request #1014 from arpitjain099/fix/report-uninvoked-function-as-error\r\n* 8758229 Merge pull request #1017 from vsolano9/fix/668-inline-comment-after-value\r\n* 5f59118 Merge pull request #1019 from Thanatos9404/fix-replace-map-item-same-key\r\n* 147d3b0 Merge pull request #1020 from Yash121l/fix/overlay-append-empty-docset\r\n* 734fa95 Merge pull request #1022 from MaxFreedomPollard/fix/overlay-doc-match-by-string\r\n* 54abccb Merge pull request #1023 from praveenrewar/chore/bump-go-1.27.4\r\n* 3d2f8dc Report an uninvoked function as an error instead of panicking\r\n* a2c1afe Split the comment stripper to satisfy the linter\r\n\r\n# :open_file_folder: Files Checksum\r\n \r\n ```\r\n3beab0170d8bb5ec9734a5e2d9ebce3e14f6ec61556a2a29bef867ced66b61dd  ./ytt-darwin-amd64\r\n8ef36098e7543e229de84edd773870ac24f0f73ac1d24aa372a165f53a63e59d  ./ytt-darwin-arm64\r\nb6dd3ed8774c98e17f0e6d5d50486ab796b455d4068cc2dde761e78694303300  ./ytt-linux-amd64\r\n291f93782a09e18157ba43e17476c2644477fae0e81277452a25ff545f47fbb1  ./ytt-linux-arm64\r\n0f19a319ade9c6983f1cf8f0423caf0ec87c50b5a4a9bf7a91206779bcf169b6  ./ytt-windows-amd64.exe\r\n```"}
