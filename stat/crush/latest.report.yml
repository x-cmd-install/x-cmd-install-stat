,"gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":300905,"digest":"sha256:748885d71af96056c7c670db13ddeb6316781db7485e5100de0f859c7f44d59e","download_count":10,"created_at":"2026-11-26T15:56:37Z","updated_at":"2026-11-26T15:56:37Z"},{"id":796620780,"node_id":"RA_kwDOOt6mSM4ve3fs","name":"crush_0.103.0_Windows_i386.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":30040322,"digest":"sha256:e86c6f73ae20cf78cf8d49e25459c67286112d8ddebb3a98b619cc129d7ab1f7","download_count":22,"created_at":"2026-11-26T15:56:20Z","updated_at":"2026-11-26T15:56:27Z"},{"id":796621646,"node_id":"RA_kwDOOt6mSM4ve3tO","name":"crush_0.103.0_Windows_i386.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":300352,"digest":"sha256:81660bb5d7c67d4b5f09d00f67b18452f53f9f567556f4a0bc56e7995e0700dd","download_count":10,"created_at":"2026-11-26T15:56:35Z","updated_at":"2026-11-26T15:56:35Z"},{"id":796620783,"node_id":"RA_kwDOOt6mSM4ve3fv","name":"crush_0.103.0_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":31595192,"digest":"sha256:e5845ae5cc160c7ea47c33fd96035d5361246db9efb2ed7a22ea6c1cfe718753","download_count":304,"created_at":"2026-11-26T15:56:20Z","updated_at":"2026-11-26T15:56:27Z"},{"id":796621704,"node_id":"RA_kwDOOt6mSM4ve3uI","name":"crush_0.103.0_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":303009,"digest":"sha256:347e833091937305e0fdd4b539224e626409e0f14191981d0b77751616a0804b","download_count":10,"created_at":"2026-11-26T15:56:36Z","updated_at":"2026-11-26T15:56:36Z"},{"id":796621234,"node_id":"RA_kwDOOt6mSM4ve3my","name":"crush_0.103.0_x86.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":30433866,"digest":"sha256:f83df3bf895afb86e27c9a9160d199571418a61fb6ef803004fc2c9d57d7165f","download_count":10,"created_at":"2026-11-26T15:56:28Z","updated_at":"2026-11-26T15:56:35Z"},{"id":796621235,"node_id":"RA_kwDOOt6mSM4ve3mz","name":"crush_0.103.0_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":32554250,"digest":"sha256:75b2798db05c529d7fc9b30365f5d175e9ca1ef18d56e8aa1d56c71a73dd31bb","download_count":11,"created_at":"2026-11-26T15:56:28Z","updated_at":"2026-11-26T15:56:35Z"}],"body":"# Client/server, OSC 7511, Turtle 🐢 \r\n\r\nLots of new stuff in this one, plus a ton of fixes. Read on!\r\n\r\n## Second life 🛟 \r\n\r\n<img width=\"1000\" alt=\"Rex demo\" src=\"https://github.com/user-attachments/assets/6c0aed7f-7a2e-40be-884b-2ecab27f482d\" />\r\n\r\nTerminals that support the Program Resume Protocol (OSC 7577), such as [Rex](https://www.superlogical.com/rex), can now bring Crush back after they restart, whether from an update, a crash, or a reboot. You'll land in the same session, in the same project folder. If you started Crush with a custom data folder or server, those come back too.\r\n\r\n## Client/Server Mode, Now in Your Config\r\n\r\nClient/server mode has had a lot of fixes over the last few releases, and now it's ready to release. Turn it on as an experimental feature:\r\n\r\n```bash\r\n# crushrc\r\noption experimental client-server true\r\noption experimental server-ready-timeout 30\r\noption experimental server-idle-timeout 60\r\noption experimental server-detach-grace 10\r\n```\r\n\r\nOr in JSON:\r\n\r\n```json\r\n\"options\": {\r\n  \"experimental\": {\r\n    \"client_server\": true\r\n  }\r\n}\r\n```\r\n\r\nRead more on this [here](https://github.com/charmbracelet/crush/tree/main/docs/server)!\r\n\r\n## Watch Commands Run\r\n\r\n<img width=\"1000\" alt=\"Live output\" src=\"https://github.com/user-attachments/assets/7feb2660-fcd9-4750-99b5-1c020aec9e9a\" />\r\n\r\nNow Bash output streams into the chat while the command runs, and switches to the final result when it's done. Thanks @KunoDLK!\r\n\r\n## Change Your Mind Mid-Run\r\n\r\n<img width=\"1000\" alt=\"Switch model demo\" src=\"https://github.com/user-attachments/assets/949fa43a-43a0-4378-9207-675d8b24776b\" />\r\n\r\nYou can now switch the model and the reasoning effort while the agent is working, without waiting for it to finish!\r\n\r\n## Turtle Core Utilities 🐢 \r\n\r\nCrush's built-in core utilities now come from [`charm.land/turtle`](https://github.com/charmbracelet/turtle), our new implementation. You choose how they're used with an setting:\r\n\r\n```bash\r\n# crushrc\r\noption coreutils turtle # always use turtle\r\noption coreutils system # prefer system tools, fall back to turtle\r\noption coreutils auto   # turtle on Windows, system elsewhere\r\noption coreutils off    # turn it off entirely\r\n```\r\n\r\n## Security\r\n\r\nIn client/server mode, the server returned each workspace's full environment, API keys and tokens included, to any client that listed workspaces. Workspace responses now leave the environment out. Clients still send it when creating a workspace, so tools and shells run with the right variables. If you've used client/server mode, we recommend upgrading. (#4391)\r\n\r\n\r\nThere is so much more, read below 👇🏻 \r\n\r\nHave a wonderful week,\r\nCharm XX 🌞 \r\n\r\n## Changelog\r\n### New!\r\n* cff500642bbafdb8b290108bf60f3592ec993861: feat(mcp): cap large tool output and fix doc link (#4436) (@andrinoff)\r\n* 4971300bbf9e3ad6363dff9436818536b711c29e: feat(server): add to config as \"experemental\" feature (#4324) (@andrinoff)\r\n* ee51fe87bb306a945bf9057edf94f5574b192fd2: feat(ui): show bash and job output live while commands run (#4276) (@KunoDLK)\r\n* 3d00da85c17004fecc68a5f6d0c5a854aee336ba: feat: allow to change the model and reasoning during a run (#4325) (@andrinoff)\r\n* fb464363ff54e2dae6286b6ede8096fb51946d74: feat: integrate `charm.land/turtle` core utilities (#4423) (@andreynering)\r\n* f79634b5f58b9f6e7682841ff6a7ca30a8846745: feat: program resume protocol (OSC 7577) (#4434) (@andrinoff)\r\n### Fixed\r\n* 47b41662f55591ab8d9c226447d384204f5cd447: fix(cmd): let crush session follow the client_server config option (#4415) (@andrinoff)\r\n* 963ec056279666c5f6acedcdfdd43557dffbbfb1: fix(cmd): make --host connect to the server and read sessions there (#4394) (@andrinoff)\r\n* b9ffb038d96e8495744fc36be7297763147bf796: fix(cmd): resolve relative --host and --prompt paths before using --cwd (#4417) (@andrinoff)\r\n* aba74b50c09d5487444a899cabeda44e16d1d90f: fix(cmd): show the workspace creation error once instead of twice (#4395) (@andrinoff)\r\n* 9a8b845337752b0a2c5df14d64aff2be9b1fa79d: fix(cmd): stop commands hanging on exit when the server stops answering (#4408) (@andrinoff)\r\n* b21ff3f723153820f9e7bd87aaa6b2886576e2b2: fix(cmd): stop crush logout from starting a server in local mode (#4413) (@andrinoff)\r\n* 56a64e41bace4425d8989bf54d1962dd750eeed8: fix(cmd): warn about the permission mode a project really runs in (#4416) (@andrinoff)\r\n* 7fa693e9373197be757fad530ca9b24634789e99: fix(config): make crushrc exports reach Crush and stop expanding values twice (@taciturnaxolotl)\r\n* d638d3b6bfb798862fcd8ae018ede748f0e8b5b9: fix(mcp): keep MCP servers running after the call that started them (#4407) (@andrinoff)\r\n* a787a05d887dcfea72a04fff3b9e3a4bd08c5000: fix(run): print the whole answer in crush run (#4270) (@AnyCPU)\r\n* b0c450b84d547778eae4dea4c222ca8e6f031380: fix(server): keep --prompt overrides when a client reconnects (#4404) (@andrinoff)\r\n* 04293685f90be381d456573817f9483ff9d88674: fix(server): keep a server started with crush server running for other builds (#4410) (@andrinoff)\r\n* b63cdbdf7763b7a5aee9813f80c3d33f2d2b4ac7: fix(server): keep a session's usage and summary when a client saves it (#4402) (@andrinoff)\r\n* 76f74e4c50378ac94f5af69b1b23653543adee3c: fix(server): keep plan mode in step across windows on a project (#4418) (@andrinoff)\r\n* 66ef12162c80982ae58702629ba98375ae13d818: fix(server): resume a run waiting for re-login once the user signs in (#4403) (@andrinoff)\r\n* 56372273e41fa91181b1006ce1e680d6efd31321: fix(server): send file history with its timestamps to clients (#4405) (@andrinoff)\r\n* 56e0bda307564a9adbfac6b03beaef3e51a8187d: fix(server): show global skill and MCP toggles in every window (#4409) (@andrinoff)\r\n* 6e54ac296b159b282433193d2dd21db51b0f2365: fix(server): stop a new window from getting other sessions' prompts (#4406) (@andrinoff)\r\n* 27aeb6cae5bb4d08a17d2e3a0f308b93f2b1cb53: fix(server): stop clients warning about other clients' session switches (#4401) (@andrinoff)\r\n* e596bad90522445cbf473fae3d4baa0bfc9a9fb3: fix(server): stop crush server from leaking the env (#4391) (@andrinoff)\r\n* 18bc386b4578a2002980d1e854fb7a512655b4f2: fix(server): title sessions started with a ! command in client/server mode (#4411) (@andrinoff)\r\n* 8fa8bb17a9051638f288593fc49c668af859bdd0: fix(ui): keep an open permission dialog when its request is sent again (#4414) (@andrinoff)\r\n* 26094109f0c2f57c159305e8b0a9eed655f2ce87: fix(ui): list the quit shortcut once on the project setup screen (#4400) (@andrinoff)\r\n* d9a3849810ca3c367848f04ca114a9d0bef27c88: fix(ui): show ! commands run from another window on the same session (#4412) (@andrinoff)\r\n* aaf1eeb522343d45dcfe79cd682a64449f0a1c7d: fix: allow for session improvements (#4318) (@andrinoff)\r\n### Docs\r\n* 70a46fbd8f77fac9b2a5f910f88a685766481d2a: docs: add the client / server mode specs (#4322) (@andrinoff)\r\n* 535dad0ba50cd57e46a17907a76cb861081e1244: docs: move the channels out of the README (#4421) (@andrinoff)\r\n### Other stuff\r\n* 07f4baf0ef02269b8efbf3c5f4d3720d104dd592: Fix/bash process cleanup (#4339) (@janearc)\r\n* 6ce1491d406974f3610cf755b27ab1096451feb4: chore(nix): update nixpkgs so the dev shell's linter can read Go 1.27 packages (#4366) (@taciturnaxolotl)\r\n* f84f6c619da6e346e72e095ed00cd79a50bb2d65: chore: add a `.taskrc.yml` (@andreynering)\r\n* 603a22ae1eea6baa65d25b411195074bd72f6131: ci(labeler): label on a schedule instead of pull_request_target (@taciturnaxolotl)\r\n* 11cc53e9d0599bf4d475ef14a2202f3ff2b24ca7: server: keep explicit servers and their workspaces alive (#4352) (@meowgorithm)\r\n* db8e2efc4ecbf48a2b43facbdb3ba0055190401d: server: only log source in debug mode, with a short path (@meowgorithm)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/crush/releases/download/v0.103.0/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/crush/releases/download/v0.103.0/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/crush/releases/download/v0.103.0/checksums.txt'\r\nwget 'https://github.com/charmbracelet/crush/releases/download/v0.103.0/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity-regexp '^https://github.com/charmbracelet/crush/\\.github/workflows/(release|nightly)\\.yml@' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n","reactions":{"total_count":3,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":7}
