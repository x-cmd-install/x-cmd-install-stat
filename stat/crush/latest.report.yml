r_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":297716,"digest":"sha256:0cf1097231cd6bb0a2b04c27e30a3d9c3959561b4fd4b429673dafb4f061b7e9","download_count":9,"created_at":"2026-09-21T16:22:00Z","updated_at":"2026-09-21T16:22:00Z"},{"id":579403124,"node_id":"RA_kwDOOt6mSM4iiP10","name":"crush_0.96.1_x86.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":25406406,"digest":"sha256:900e1a1c23b95ff6e81f46acd58897723874dd52f785fb2411832ad1ec43493b","download_count":26,"created_at":"2026-09-21T16:21:57Z","updated_at":"2026-09-21T16:21:58Z"},{"id":579403129,"node_id":"RA_kwDOOt6mSM4iiP15","name":"crush_0.96.1_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":27186823,"digest":"sha256:b5afadca5d40290dcbfec0816f07c2b7f787438f59909de0b82380453fd082bc","download_count":31,"created_at":"2026-09-21T16:21:57Z","updated_at":"2026-09-21T16:21:58Z"}],"body":"# Quick little theme API adjustment\r\n\r\nHey! ICYMI [we released support for themes](https://github.com/charmbracelet/crush/releases/tag/v0.96.0) a few hours ago. Before they get too widely adopted, we\u2019re making one small breaking API change to the names of keys.:\r\n\r\n`insert_bg` -> `insert_code_bg`\r\n`delete_bg` -> `delete_code_bg`\r\n\r\nThis is what it looks like in code:\r\n\r\n```jsonc\r\n{\r\n  // ...\r\n  \"diff_insert_fg\": \"#629657\",\r\n  \"diff_insert_code_bg\": \"#2d3431\",\r\n  \"diff_insert_gutter_bg\": \"#282d2c\",\r\n  \"diff_delete_fg\": \"#a45c59\",\r\n  \"diff_delete_code_bg\": \"#33272d\",\r\n  \"diff_delete_gutter_bg\": \"#2a232a\",\r\n  // ...\r\n}\r\n```\r\n\r\nSee ya!\r\nCharm \ud83c\udfb8\r\n\r\n## Changelog\r\n### Other stuff\r\n* 56abdfa7f1fa2cbe1e073f553bc10b06598046f9: themes: prefix diff theme keys with diff_ (@meowgorithm)\r\n* a88b5735ff056b52eee8d30121b85c8a8ca79601: themes: small adjustments to the key names in the theme API (@meowgorithm)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/crush/releases/download/v0.96.1/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/crush/releases/download/v0.96.1/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/crush/releases/download/v0.96.1/checksums.txt'\r\nwget 'https://github.com/charmbracelet/crush/releases/download/v0.96.1/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
