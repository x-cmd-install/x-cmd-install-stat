ithub-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":306809,"digest":"sha256:5d254c47e2024046099df19364444c0ccb4d2803b7d73fa529701ce262a2bc82","download_count":13,"created_at":"2026-11-19T17:30:01Z","updated_at":"2026-11-19T17:30:01Z"},{"id":768604524,"node_id":"RA_kwDOOt6mSM4tz_ls","name":"crush_0.102.0_x86.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":29351949,"digest":"sha256:4099496a205f7c12a611f65bc949adb910e780c2980a619be5fc575e7af75852","download_count":24,"created_at":"2026-11-19T17:29:52Z","updated_at":"2026-11-19T17:29:59Z"},{"id":768604538,"node_id":"RA_kwDOOt6mSM4tz_l6","name":"crush_0.102.0_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":31299282,"digest":"sha256:2dfff52c8542b81e5ba24d8304f996538cc0c02941a2c5d62ddc38e96459b486","download_count":32,"created_at":"2026-11-19T17:29:52Z","updated_at":"2026-11-19T17:29:59Z"},{"id":768615244,"node_id":"RA_kwDOOt6mSM4t0CNM","name":"packslip.sigstore.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":28386,"digest":"sha256:1f6fc5c644c5bd381b99797d7872c304dfde888f16b17ae49d9dfe8f6cc6184f","download_count":22,"created_at":"2026-11-19T17:33:32Z","updated_at":"2026-11-19T17:33:33Z"}],"body":"# Channels, custom prompts and server hardening\r\n\r\nThere's so much good stuff in this release and we're really proud of _all_ of it. Read on for more.\r\n\r\n## BYO Prompts\r\n\r\nAt last, you can replace the system prompts with…whatever you want. And not just the main agent but prompts for subagents, planning, compaction, session titles and `crush init`:\r\n\r\n```bash\r\noption prompt coder ~/.config/crush/prompts/coder.md.tpl\r\noption prompt summary prompts/summary.md\r\n```\r\n\r\nYou can set prompt in the global config, override per project in local config, or override the prompt with `--prompt name=path`.\r\n\r\nFor more on prompts, see [the docs](https://github.com/charmbracelet/crush/blob/main/docs/config/README.md#option-prompt).\r\n\r\n## Riding in the Night \r\n\r\nCrush now ships with a Knight Rider-inspired KITT theme courtesy @cdancy. Rosé Pine Classic, Moon and Dawn are now available, too.\r\n\r\n<p><img width=\"730\" height=\"528\" alt=\"image\" src=\"https://github.com/user-attachments/assets/2c139b67-92a3-4600-9278-761c813699ed\" /></p>\r\n\r\n## Nerd out with Nerd Fonts \r\n\r\nAt last, nerd fonts! Support is detected automatically, so they'll never break your terminal, too! Crush now uses their icons, LSP status and Git included. Note that if you're running Crush over SSH you'll need to enable Nerd fonts `option ui nerd-fonts true`.\r\n\r\n```bash\r\n# Hate nerd fonts? You can turn 'em off, too.\r\noption ui nerd-fonts false\r\n```\r\n\r\n## Channels\r\n\r\n[Channels](https://code.claude.com/docs/en/channels-reference) are an experimental MCP feature from Claude, now available in Crush thanks to the fine work of @joestump. In short, channels allow MCP servers to push events into your session as they happen.\r\n\r\n```bash\r\ncrush --channels server:webhook --channels server:signal\r\n```\r\n\r\nOr turn one on permanently in your `crushrc`:\r\n\r\n```bash\r\n# crushrc\r\nmcp add webhook \\\r\n    --type http \\\r\n    --url https://example.com/mcp \\\r\n    --channel true\r\n```\r\n\r\nCrush uses the same protocol as [Claude Channels](https://code.claude.com/docs/en/channels-reference), so existing channel servers should just work™.\r\n\r\n## Server Hardening\r\n\r\nClient-server mode is now now sturdier than ever. It's now more secure and has a ton of small improvements, correctness fixes, nad bugfixes, especially on Windows.\r\n\r\n## And So Much More\r\n\r\n- Sysadmin mode is no longer one <kbd>shift+tab</kbd> past yolo.\r\n- Queued prompts show up in the pill the moment you submit them.\r\n- The model can use `sudo`, so you can approve with Touch ID.\r\n- Content refusals are retried automatically.\r\n- Sessions that Claude kept rejecting work again.\r\n- Ollama models that can't call tools no longer show up in the model list.\r\n- Commands that leave child processes behind no longer hang.\r\n- Timers tick together, and running tool timers keep going until the tool replies.\r\n- Switching themes no longer re-renders the whole conversation.\r\n- Deleting a session keeps your place in the list.\r\n- Replayed messages keep their whitespace, and plan cards line up properly.\r\n\r\nGood luck,\r\nCharm XX 🌤️ \r\n\r\n## Changelog\r\n### New!\r\n* 01780cc0384227b90071a8bbf26559410b748efc: feat(lsp): Automatically use nerd font for LSP status (#4334) (@BrunoKrugel)\r\n* 60c5457b31fa4f0ad253f7e9bc463ce3ef3390e2: feat(ui): Claude Channels TUI (#3347) (@joestump-agent)\r\n* 0a3d1127ea3475c7ef028c37ff62e78f107d74c9: feat(ui): show a queued prompt in the pill as soon as it is submitted (#4307) (@taciturnaxolotl)\r\n* d43bf2ca22ec34203a446b99b2a7f2e35686b206: feat: add a built-in `kitt` theme (#4279) (@cdancy)\r\n* 498c44fe67a1c14326ba1063c8ba41eb8605595c: feat: add custom prompt paths (#4141) (@andrinoff)\r\n* 0d7895cf664328df3c1fd69038258ecebc09a46c: feat: automatic nerd font detection (#4006) (@andrinoff)\r\n### Fixed\r\n* 72979db97f35259c6c8d709da140e910cf320f36: fix(agent): let the model use sudo so Touch ID and other PAM approvals work (@taciturnaxolotl)\r\n* 945be07f5138dc5916f1de80cc10743a1944a816: fix(agent): report a session busy while a sub-agent or accepted run holds it (#3921) (@taciturnaxolotl)\r\n* f64fe8e582b1f0537d8c8f79b389e8b692478f2e: fix(agent): retry content refusals (@taciturnaxolotl)\r\n* 4eb49b9eac36c541d8a1f1ffad500efc0ddeeed7: fix(agent): send one result per tool call so Claude accepts the session (@taciturnaxolotl)\r\n* 66435196da3b87d97c46de1cadd16e0c6a3525d7: fix(discover): leave out Ollama models that can't call tools (#4327) (@janearc)\r\n* 2923a2f0ee21e91f1a2377b221c84632e23ef0fc: fix(server): arm idle shutdown as soon as the server is listening (@andrinoff)\r\n* 2a8a475f8390e1138db17c741297c8a9d553a182: fix(server): auto-approve permissions for crush run's session (@andrinoff)\r\n* 6808c854778ccf83e1403e034e17051856c9372d: fix(server): block dns rebinding and cross-site tcp requests (@andrinoff)\r\n* b54beb6b302032cc0872da189f517af937c0907d: fix(server): bound client shutdown on an unresponsive server (#4170) (@andrinoff)\r\n* a8aa8374215f560bbbbf0ae94daf3b002de7ff34: fix(server): bound the spawn lock wait and honor cancellation (@andrinoff)\r\n* 369d8e81bd7de65d45c285c0bf3996b1afef4f8a: fix(server): cancel a run when the last client viewing it leaves (#4167) (@andrinoff)\r\n* 57489c0cd6f52f8358ca54038f1c288ffcce2a3b: fix(server): cancel crush run's own question batch by id (@andrinoff)\r\n* 1b1bf12825add62f6d25c45097699625a2e2f3fc: fix(server): cancel in-flight requests on graceful shutdown (@andrinoff)\r\n* 18b362bca6878134fa396450926f925f284b302a: fix(server): cancel the server run when crush run is interrupted (@andrinoff)\r\n* 77e81541a16c2c8e5907553e4f0953d4bfa4ba00: fix(server): carry the provider ID in reauthentication events (#4277) (@gulagala001)\r\n* affd1072c1549c748dda3809df9eebe83ba3a58d: fix(server): decode mcp and replace_symbol permission params (@andrinoff)\r\n* 5d0e06dfffe87919009eb1196a47b7e9949ce826: fix(server): dedupe workspaces and db by directory identity (@andrinoff)\r\n* ac835acbe679bde3a107f7299b905b716b2f053b: fix(server): detect git repos in the workspace dir, not the server cwd (@andrinoff)\r\n* f386b376bde3a6e6a3d3142f3e05b0017f66d939: fix(server): end event streams that fell behind so clients resync (@andrinoff)\r\n* 844565df082c0be163b8468a55e0cb4ccc51af4a: fix(server): escape uri metacharacters in sqlite dsn paths (@andrinoff)\r\n* b03632b9f5b24eaf7c90e80323e6b8773a267047: fix(server): exit 128+signal number instead of always 130 (@andrinoff)\r\n* 2a8be1654b4c5315aa026a06db00df94ad7f95d4: fix(server): fail crush run when the server drops or cancels the run (@andrinoff)\r\n* d59e3249b780a7ebfb7a73075f80bba825447b6e: fix(server): ignore sighup during graceful shutdown (@andrinoff)\r\n* 46461fb000323fa9a28400f3dcb63bf374525a6d: fix(server): keep clients out of the server's log file (#4169) (@andrinoff)\r\n* f338539c2af4f59d893a5922b18d0eae9ef83841: fix(server): keep the previous server's crash log on respawn (@andrinoff)\r\n* 629cec3a014a49bb74bf5e8ce8d66fe551084f26: fix(server): keep the shared agent coordinator when clients join (@andrinoff)\r\n* 7336e3e28815e096643b1e58fa5747eb8fd868aa: fix(server): kill only a workspace's own shells on teardown (@andrinoff)\r\n* aa68b2c993b9170155a353a969a2c2e68d2b5c8f: fix(server): lock one byte on windows to keep owner info readable (@andrinoff)\r\n* 97ec3f5abd7dc33d18d14fd186ba90728a582485: fix(server): lock projects.json across processes (@andrinoff)\r\n* 1524f7fe47488baa53610054a22c9ad6a03a602c: fix(server): make concurrent pubsub broker shutdown idempotent (#4166) (@andrinoff)\r\n* 0ed6dcf187dfcf0d7ac81260cb3c3f524087e9f2: fix(server): never share the default server address between users (@andrinoff)\r\n* 3c8a53b84211157ca6498728be36986ab9882c2e: fix(server): only unlink the socket this server bound (@andrinoff)\r\n* a8f0ec03712d4ec21c1c6a78b1616778dca98a70: fix(server): probe the named pipe instead of stat'ing it (@andrinoff)\r\n* 328d4813e9f925749918e3871081d82c41a49ba3: fix(server): reap a detached server that exits before its client (@andrinoff)\r\n* 8ec14d7d429c943eecbfb0f37d7333a6502e1e11: fix(server): refuse a server socket or pipe owned by another user (@andrinoff)\r\n* 28216adad3073525f9c8b6b5dd3668dcac50a5d5: fix(server): register projects opened through the server (@andrinoff)\r\n* b6619e864c165eacb90a9b61ad3fece62725df84: fix(server): replace exiting servers on named pipes and tcp (@andrinoff)\r\n* 4eadcd5e9299ed735e9424e4c0245414cbb833e1: fix(server): resolve a relative --cwd before sending it to the server (@andrinoff)\r\n* 9eb90c9fbdc9cc56d5c126b31ce55bc8825131cc: fix(server): resolve relative unix --host before changing into --cwd (@andrinoff)\r\n* 9ef4f2caf2278f16639db45aec604ca18f653355: fix(server): respawn a dead server from the client reconnect loop (@andrinoff)\r\n* ba10a00d56270d01b72c672759a97b6a94945e69: fix(server): restore plan mode on workspace recovery (@andrinoff)\r\n* 4bbe1fa53f57ea6b0ab7b210f872483e65e456d0: fix(server): restrict server socket and pipe to their owner (@andrinoff)\r\n* 98395d107c71e234a48cdee72aa7b25283f1b753: fix(server): retry workspace creation over a fresh connection (@andrinoff)\r\n* b8c53abdabbbf3258a36a0d47726a2f34ebe6d16: fix(server): route question answers and cancels by batch id (@andrinoff)\r\n* a8f32529c2472c4022d0400071f5cf65083e31bf: fix(server): run config command substitution in the workspace dir (#4171) (@andrinoff)\r\n* 6bb53fdaec181995ef74fcdb410dea1767ae5f70: fix(server): run the detached server from the per-host server dir (@andrinoff)\r\n* 6bf461983ef738492d865aba4101f3172cbf392c: fix(server): serialize permission prompts per top-level session (@andrinoff)\r\n* 48d74fe533d86a7acc29d48810256f86ac39d8ac: fix(server): serialize stale socket recovery and bind across processes (@andrinoff)\r\n* 97e8d180ea53b42de82d8a2f6907e535c48b9ebc: fix(server): show version mismatch warnings on the client (@andrinoff)\r\n* e952fa1271345b08e1ed4ed84d907989d691c84b: fix(server): skip unknown message part types from newer servers (@andrinoff)\r\n* 1770bd4181d1d690b834bf9884397fab7d935ddd: fix(server): spawn the windows server with a hidden console (@andrinoff)\r\n* bb9914d947c6750bc74d33d8e6ef914df08e7c76: fix(server): start stdio MCP servers in the workspace directory (@andrinoff)\r\n* 2d3f1f1cd37221151baa283c1554b86f3763465d: fix(server): start windows server outside the client's job (@andrinoff)\r\n* 9114879c79fbdec009e89f2b987fd92ea310633c: fix(server): stop boundary walk at repo root spelled in another case (#4168) (@andrinoff)\r\n* 69f401c6910a1886ec04a982233a445efaf3e49e: fix(server): stop crush run on SIGTERM and SIGHUP (@andrinoff)\r\n* 096aa9c4c8a6c32c3d6ec5fea9fe04a516464084: fix(server): stop workspace teardown from closing other workspaces' MCP (@andrinoff)\r\n* 9654903969ed33633a489426e018e4d13c12b036: fix(server): store file reads relative to the workspace dir (@andrinoff)\r\n* ff2a581aade7f7408ea18d323233f6afc2ed3343: fix(server): time out the version check on a hung server (@andrinoff)\r\n* 81d6c2a5b55de90c23a5ffee52e9070b38284f44: fix(server): wait for a slow-starting spawned server (@andrinoff)\r\n* 6f2026cfa48f1391091211d47ac65668782447c8: fix(server): wait for in-flight workspace teardowns on shutdown (@andrinoff)\r\n* ca19cdbebdf6ffddfd6c5940f417bed5baaf4599: fix(server): wait for self-shutdown to finish before exiting (@andrinoff)\r\n* fc177075e872b705f45ac19bfebc107f64b22a58: fix(sessions): keep the deleted slot in view instead of jumping to top (#3770) (@taciturnaxolotl)\r\n* f15dff1166f3aa6ab781918cf92afa6e6b162f2a: fix(ui): align plan card borders with screen cell widths (#4321) (@remote-controlled-man)\r\n* 0f9de6aa3273e851f8ab47f358b849c0d06f0a14: fix(ui): keep a running tool's timer ticking until it replies (#4303) (@taciturnaxolotl)\r\n* b6b6544a4f5f5ada808e1fb05f7b9e182b5fabaf: fix(ui): keep sysadmin mode out of the shift+tab cycle (@taciturnaxolotl)\r\n* d05fb53413749b1e6519e63e4634b7bdebf93fdf: fix: preserve replayed message