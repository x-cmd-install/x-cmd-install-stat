c","site_admin":false},"content_type":"application/json","state":"uploaded","size":297716,"digest":"sha256:b7079ac58af9b003c57fd593e3a7538a470385de6573a137febdec4a0adf96f3","download_count":4,"created_at":"2026-09-14T13:11:43Z","updated_at":"2026-09-14T13:11:43Z"},{"id":563424849,"node_id":"RA_kwDOOt6mSM4hlS5R","name":"crush_0.94.2_x86.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":25296063,"digest":"sha256:81617afdb96992433b571695bfdbdad82e6f44b4606d2cba2b9caebdfc4c49b6","download_count":5,"created_at":"2026-09-14T13:11:39Z","updated_at":"2026-09-14T13:11:41Z"},{"id":563424857,"node_id":"RA_kwDOOt6mSM4hlS5Z","name":"crush_0.94.2_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":26996409,"digest":"sha256:26b2b03d421f71c9f0937feecc0554b94f8d2d1ac62e7913384acccb89087ea7","download_count":5,"created_at":"2026-09-14T13:11:39Z","updated_at":"2026-09-14T13:11:42Z"}],"body":"## Lil\u2019 OpenAI-Compatible Protocol Fix\r\n\r\nThis is a hot little mini patch to fix a regression in OpenAI-compatible endpoints that could occur when turns were stopped partway through. This regression happened because we were _furiously_ making improvements for the DeepSeek V4.X Flash series that you all cannot seem to get enough of!\r\n\r\nThanks also to the very patient @teddytennant who fixed a small bug around turning home dirs into ~s.\r\n\r\nxoxo,\r\nCharm\r\n\r\n## Changelog\r\n\r\n* 6f670995436a0bab99e3fdddd0eebc5c52c39072: fix(home): require path boundary when shortening or expanding ~ (#3552) (@teddytennant)\r\n* 066f4444d086aeac877ec0a67eb2a3d56fedde27: openaicompat: bump fantasy to fix regression around reasoning-only turns (@meowgorithm)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/crush/releases/download/v0.94.2/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/crush/releases/download/v0.94.2/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/crush/releases/download/v0.94.2/checksums.txt'\r\nwget 'https://github.com/charmbracelet/crush/releases/download/v0.94.2/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
