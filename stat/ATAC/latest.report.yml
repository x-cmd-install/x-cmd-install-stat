st":"sha256:fb8f2794e0c80c9557875f924e64de40b4866df8040672412915c245e5cc2f63","download_count":97,"created_at":"2026-10-11T22:15:41Z","updated_at":"2026-10-11T22:15:42Z"},{"id":631948142,"node_id":"RA_kwDOLOYOkc4lqsNu","name":"atac-v0.24.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":8178280,"digest":"sha256:cc9561783c82b317c1e2781c164fd46b65cd65db610cc2e67b39ab63d76014d1","download_count":25,"created_at":"2026-10-11T22:16:19Z","updated_at":"2026-10-11T22:16:20Z"}],"body":"Hello, this update has been possible mainly thanks to the huge work of @helenkwok !!!\r\nI have some ideas of new features in mind\r\n\r\n## Added\r\n\r\n- \ud83e\udd9f | **Added MQTT requests** @helenkwok \r\n  - <img width=\"1080\" height=\"590\" alt=\"mqtt\" src=\"https://github.com/user-attachments/assets/51af9e7d-05bd-459f-9738-545fcbf785c6\" />\r\n  - Supports MQTT v3.1.1, v5, clean sessions, client IDs, QoS, many topic subscriptions and many more!!\r\n  - You need to add the new MQTT section to your theme files (you can straight copy the websocket section). E.g.:\r\n```toml\r\n[MQTT]\r\n    [MQTT.connection_status]\r\n    connected = \"Green\"\r\n    disconnected = \"Red\"\r\n\r\n    [MQTT.messages]\r\n    server_foreground_color = \"Blue\"\r\n    server_background_color = \"DarkGray\"\r\n    you_background_color = \"DarkGray\"\r\n    details_color = \"DarkGray\"\r\n```\r\n- \ud83d\udd0e | **Added QUERY HTTP method** @eshad \r\n  - You need to add the new QUERY HTTP method entry to your theme files. E.g.:\r\n```toml\r\n[HTTP]\r\n    [HTTP.methods]\r\n    GET = \"Green\"\r\n    POST = \"Yellow\"\r\n    QUERY = \"LightMagenta\"\r\n    ...\r\n```\r\n## Improved\r\n\r\n- Updated dependencies\r\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
