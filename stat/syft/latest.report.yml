thub-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26959230,"digest":"sha256:f9c0596d79d0e99eacb3f1e3ffca37ca22e7cdc809b1463cdfec77798939bd09","download_count":149,"created_at":"2026-09-17T14:38:12Z","updated_at":"2026-09-17T14:38:14Z"}],"body":"### Added Features\n\n- passthrough-exact-format copies matching syft-json input unchanged [PR [#5279](https://github.com/anchore/syft/pull/5279) @juanjsebgarcia]\n\n### Bug Fixes\n\n- bound what a compressed kernel module expands to [PR [#5294](https://github.com/anchore/syft/pull/5294) @wagoodman]\n- bound the decompressed members of a .deb archive [PR [#5293](https://github.com/anchore/syft/pull/5293) @wagoodman]\n- alpm mtree gzip unbounded processing [PR [#5292](https://github.com/anchore/syft/pull/5292) @wagoodman]\n- graalvm unbounded allocation [PR [#5291](https://github.com/anchore/syft/pull/5291) @wagoodman]\n- harden .NET PE/ELF parsing against malformed binaries [PR [#5267](https://github.com/anchore/syft/pull/5267) @wagoodman]\n- bound allocations from UPX-packed binary headers [PR [#5195](https://github.com/anchore/syft/pull/5195) @wagoodman]\n- Syft rpm-db-cataloger reports stale libssh version from a single-layer Rocky Linux 10 image [Issue [#5247](https://github.com/anchore/syft/issues/5247)]\n- java-archive-cataloger returns unknown ver for uber-jars [Issue [#5163](https://github.com/anchore/syft/issues/5163)] [PR [#5164](https://github.com/anchore/syft/pull/5164) @rezmoss]\n\n### Dependencies\n\n52 dependency changes (52 updated). 6 vulnerabilities remediated.\n\n**\ud83d\udfe2 Remediated (6)**\n\n- [GHSA-2v4p-qf9q-27wj](https://github.com/advisories/GHSA-2v4p-qf9q-27wj) (High) \u2014 google.golang.org/grpc\n- [GHSA-7jxh-36q5-gcqv](https://github.com/advisories/GHSA-7jxh-36q5-gcqv) (Medium) \u2014 github.com/containerd/containerd/v2\n- [GHSA-qc2q-p7wx-3px3](h