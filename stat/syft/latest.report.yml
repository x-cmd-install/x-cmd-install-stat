m90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289228,"digest":"sha256:a21883fb9c54552a7d4086f1997b954a583536136ef9e65f501cdb9a0ba4653d","download_count":37,"created_at":"2026-10-01T20:54:27Z","updated_at":"2026-10-01T20:54:27Z"},{"id":604117608,"node_id":"RA_kwDOD5-7oc4kAhpo","name":"syft_1.54.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":29834852,"digest":"sha256:77f4b472779058e819eec9a054753a5071a996aaa40db31a290f8b256748593f","download_count":2535,"created_at":"2026-10-01T20:54:23Z","updated_at":"2026-10-01T20:54:26Z"},{"id":604117680,"node_id":"RA_kwDOD5-7oc4kAhqw","name":"syft_1.54.0_windows_arm64.sbom","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":289230,"digest":"sha256:8128d111728a677ae8bf140dbc923ff9a8d11b1223b5f6861b9cca8f9cb49ef7","download_count":11,"created_at":"2026-10-01T20:54:27Z","updated_at":"2026-10-01T20:54:27Z"},{"id":604117592,"node_id":"RA_kwDOD5-7oc4kAhpY","name":"syft_1.54.0_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26827648,"digest":"sha256:0fdfa61470a69b99ace491df1fd7ef9803439c15d4d3d19a0bcb139d8b9fba4e","download_count":162,"created_at":"2026-10-01T20:54:23Z","updated_at":"2026-10-01T20:54:26Z"}],"body":"### Added Features\n\n- report the perl interpreter as a cpan package [PR [#5132](https://github.com/anchore/syft/pull/5132) @wagoodman]\n- Add package cataloger for perl ecosystem [Issue [#1906](https://github.com/anchore/syft/issues/1906)] [PR [#5131](https://github.com/anchore/syft/pull/5131) @wagoodman]\n- Analyze with Non-Daemon podman [Issue [#1173](https://github.com/anchore/syft/issues/1173)]\n\n### Bug Fixes\n\n- write a name for the root package when the source has none [PR [#5349](https://github.com/anchore/syft/pull/5349) @DrVelvetFog]\n- match opensource.org license URLs across SPDX URL forms [PR [#5361](https://github.com/anchore/syft/pull/5361) @willmurphyscode]\n- Account for malformed GGUF and safetensors parameter counts [PR [#5343](https://github.com/anchore/syft/pull/5343) @wagoodman]\n- don't panic on a root file without a supplier or null entries [PR [#5326](https://github.com/anchore/syft/pull/5326) @DrVelvetFog]\n- do not panic on a stack.yaml rev pin [PR [#5310](https://github.com/anchore/syft/pull/5310) @arpitjain099]\n- report scanner errors and raise the line cap in metadata parsers [PR [#5353](https://github.com/anchore/syft/pull/5353) @wagoodman]\n- Harden cataloger parsers against truncated input (do not panic) [PR [#5355](https://github.com/anchore/syft/pull/5355) @wagoodman]\n- bound CPE candidate generation for pathological package metadata [PR [#5356](https://github.com/anchore/syft/pull/5356) @wagoodman]\n- account for UPX's loader padding when unpacking Go binaries [PR [#5347](https://github.com/anchore/syft/pull/5347) @huuyafwww]\n- handle malformed GGUF headers without panicking [PR [#5345](https://github.com/anchore/syft/pull/5345) @wagoodman]\n- bound model companion file reads and validate their contents [PR [#5344](https://github.com/anchore/syft/pull/5344) @wagoodman]\n- don't fail the whole SBOM when a cataloger panics on one file [PR [#5342](https://github.com/anchore/syft/pull/5342) @wagoodman]\n- release package collection lock in Ubuntu ESM detection [PR [#5336](https://github.com/anchore/syft/pull/5336) @sverrirsig]\n- render TUI log lines on their own rows, with colors and a small header [PR [#5324](https://github.com/anchore/syft/pull/5324) @wagoodman]\n- uv.lock: dependents are linked to every locked version of a dependency [Issue [#5340](https://github.com/anchore/syft/issues/5340)] [PR [#5351](https://github.com/anchore/syft/pull/5351) @devtechedge]\n- java-archive-cataloger maps Apache Groovy 4+ (org.apache.groovy) to obsolete org.codehaus.groovy [Issue [#5311](https://github.com/anchore/syft/issues/5311)] [PR [#5313](https://github.com/anchore/syft/pull/5313) @texasich]\n- Support traefik binary various versions [Issue [#4980](https://github.com/anchore/syft/issues/4980)] [PR [#5281](https://github.com/anchore/syft/pull/5281) @mayanksekhar]\n- File Digests Remain at Zero, No Hashes Available Despite .syft.yaml Settings Should Support [Issue [#5325](https://github.com/anchore/syft/issues/5325)] [PR [#5341](https://github.com/anchore/syft/pull/5341) @wagoodman]\n- not showing expat CVEs from syft generated sbom [Issue [#4771](https://github.com/anchore/syft/issues/4771)] [PR [#5259](https://github.com/anchore/syft/pull/5259) @KR-Ravindra]\n- PHP extensions are cataloged as upstream products using the PHP version [Issue [#5014](https://github.com/anchore/syft/issues/5014)] [PR [#5102](https://github.com/anchore/syft/pull/5102) @pujitha24]\n- Panic during scanning with gguf-cataloger/safetensors-cataloger [Issue [#5327](https://github.com/anchore/syft/issues/5327)] [PR [#5328](https://github.com/anchore/syft/pull/5328) @tk1475]\n- github-actions cataloger emits an invalid PURL for docker:// use statements [Issue [#5299](https://github.com/anchore/syft/issues/5299)] [PR [#5302](https://github.com/anchore/syft/pull/5302) @yunaremaia]\n- Crash when running syft on a directory that is the root file system of a Yocto build [Issue [#5320](https://github.com/anchore/syft/issues/5320)] [PR [#5321](https://github.com/anchore/syft/pull/5321) @somaz94]\n- Invalid PURLs when cataloging instrumentation classes/jars [Issue [#2596](https://github.com/anchore/syft/issues/2596)]\n\n### Dependencies\n\n79 dependency changes (48 updated, 28 added, 3 removed). 2 vulnerabilities remediated.\n\n**\ud83d\udfe2 Remediated (2)**\n\n- [GHSA-8wmf-6v46-5gfg](https://github.com/advisories/GHSA-8wmf-6v46-5gfg) (Low) \u2014 go.opentelemetry.io/otel/sdk\n- [GHSA-pg57-6jwg-q645](https://github.com/advisories/GHSA-pg57-6jwg-q645) (Medium) \u2014 github.com/containerd/containerd/v2\n\n**Toolchains (1)**\n\n- Go minimum version: `1.26.3` \u2192 `1.26.8`\n\n<details>\n<summary>Updated (48 packages)</summary>\n\n- github.com/Microsoft/hcsshim `v0.15.0-rc.1` \u2192 `v0.15.0-rc.4`\n- github.com/anchore/bubbly `v0.2.1` \u2192 `v0.2.2`\n- github.com/anchore/go-logger `v0.1.1` \u2192 `v0.2.0`\n- github.com/anchore/stereoscope `v0.3.2` \u2192 `v0.3.3`\n- github.com/bmatcuk/doublestar/v4 `v4.10.0` \u2192 `v4.10.2`\n- github.com/containerd/containerd/api `v1.11.1` \u2192 `v1.12.0`\n- github.com/containerd/containerd/v2 `v2.3.5` \u2192 `v2.4.1` **(\ud83d\udfe2 remediated [GHSA-pg57-6jwg-q645](https://github.com/advisories/GHSA-pg57-6jwg-q645))**\n- github.com/containerd/log `v0.1.0` \u2192 `v0.2.0`\n- github.com/containerd/ttrpc `v1.2.8` \u2192 `v1.2.9`\n- github.com/containerd/typeurl/v2 `v2.2.3` \u2192 `v2.3.0`\n- github.com/cyphar/filepath-securejoin `v0.6.1` \u2192 `v0.7.0`\n- github.com/docker/cli `v29.8.0+incompatible` \u2192 `v29.8.1+incompatible`\n- github.com/docker/docker-credential-helpers `v0.9.5` \u2192 `v0.9.8`\n- github.com/dustin/go-humanize `v1.0.1` \u2192 `v1.1.0`\n- github.com/erofs/go-erofs `v0.3.0` \u2192 `v0.3.1`\n- github.com/felixge/httpsnoop `v1.0.4` \u2192 `v1.1.0`\n- github.com/fsnotify/fsnotify `v1.9.0` \u2192 `v1.10.1`\n- github.com/go-jose/go-jose/v4 `v4.1.4` \u2192 `v4.1.5`\n- github.com/go-logr/logr `v1.4.3` \u2192 `v1.4.4`\n- github.com/hashicorp/hcl/v2 `v2.24.0` \u2192 `v2.25.0`\n- github.com/magiconair/properties `v1.18.11` \u2192 `v1.18.12`\n- github.com/matt