login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26882769,"digest":"sha256:fa735ee4c25b90b93d6795a15b90d6a0bae78eb5ad7d3d4591b3c10faa3463ad","download_count":469,"created_at":"2026-08-27T17:01:10Z","updated_at":"2026-08-27T17:01:13Z"}],"body":"### Bug Fixes\n\n- detect multi-arch ingress-nginx [PR [#5179](https://github.com/anchore/syft/pull/5179) @CAOShurong]\n- keep the epoch when parsing RPM manifest packages [PR [#5201](https://github.com/anchore/syft/pull/5201) @sueun-dev]\n- correct Apache Derby group ID in purl generation [PR [#5090](https://github.com/anchore/syft/pull/5090) @Ankush-Pathak]\n- move image hardlink handling upstream during image indexing [PR [#5196](https://github.com/anchore/syft/pull/5196) @wagoodman]\n- keep epoch-pinned requirements in the SBOM [PR [#5161](https://github.com/anchore/syft/pull/5161) @sueun-dev]\n- Prevent unnecessary allocations when parsing compressed ELF sections [PR [#5187](https://github.com/anchore/syft/pull/5187) @wagoodman]\n- honor the io.ReaderAt contract in readerAtAdapter [PR [#5186](https://github.com/anchore/syft/pull/5186) @wagoodman]\n- Support grafana binary various version [Issue [#5059](https://github.com/anchore/syft/issues/5059)] [PR [#5213](https://github.com/anchore/syft/pull/5213) @pujitha24]\n- Excluded paths are still scanned and cause syft to crash [Issue [#3258](https://github.com/anchore/syft/issues/3258)]\n- Dotnet: Incorrect relationship graph in case of using package locks [Issue [#5125](https://github.com/anchore/syft/issues/5125)] [PR [#5143](https://github.com/anchore/syft/pull/5143) @pujitha24]\n- Survive indexing not accessible files [Issue [#3286](https://github.com/anchore/syft/issues/3286)] [PR [#5170](https://github.com/anchore/syft/pull/5170) @addielaruee]\n- CPE target_sw not being set consistency for Rust crates [Issue [#3956](https://github.com/anchore/syft/issues/3956)] [PR [#5167](https://github.com/anchore/syft/pull/5167) @Xenira]\n- panic: nil pointer dereference in squashfs.(*File).Read when scanning snap (regression from 1.44.0) [Issue [#4989](https://github.com/anchore/syft/issues/4989)] [PR [#5119](https://github.com/anchore/syft/pull/5119) @kzantow]\n- golang remote license search attempts to resolve stdlib modules [Issue [#3149](https://github.com/anchore/syft/issues/3149)] [PR [#5192](https://github.com/anchore/syft/pull/5192) @luantaraschi]\n\n### Additional Changes\n\n- gzip binary classifier reports false-positive GNU gzip from BusyBox multicall binary via applet symlink [Issue [#5171](https://github.com/anchore/syft/issues/5171)] [PR [#5202](https://github.com/anchore/syft/pull/5202) @spiffcs]\n- pnpm v5 lockfile: underscore peer-dep suffixes are not stripped from package versions [Issue [#5174](https://github.com/anchore/syft/issues/5174)] [PR [#5175](https://github.com/anchore/syft/pull/5175) @codeAnqiang-ma]\n- pnpm cataloger reads only the first YAML document: SBOM contains pnpm's own binaries and no project dependencies [Issue [#5168](https://github.com/anchore/syft/issues/5168)] [PR [#5188](https://github.com/anchore/syft/pull/5188) @hamodywe]\n\n### Dependencies\n\n72 dependency changes (70 updated, 1 added, 1 removed). 3 vulnerabilities remediated.\n\n**\ud83d\udfe2 Remediated (3)**\n\n- [GO-2026-5158](https://github.com/open-telemetry/opentelemetry-go/security/advisories/GHSA-5wrp-cwcj-q835) (Medium) \u2014 go.opentelemetry.io/otel\n- [GO-2026-6179](https://go.dev/issue/80744) (High) \u2014 golang.org/x/mod\n- [GO-2026-6180](https://go.dev/issue/80745) (High) \u2014 golang.org/x/mod\n\n<details>\n<summary>Updated (70 packages)</summary>\n\n- cel.dev/expr `v0.25.1` \u2192 `v0.25.2`\n- cloud.google.com/go/auth `v0.18.2` \u2192 `v0.22.0`\n- cloud.google.com/go/iam `v1.5.3` \u2192 `v1.11.0`\n- cloud.google.com/go/logging `v1.13.1` \u2192 `v1.18.0`\n- cloud.google