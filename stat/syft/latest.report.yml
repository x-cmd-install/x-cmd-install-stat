yer squashes only when a scan reads them [PR [#5492](https://github.com/anchore/syft/pull/5492) @wagoodman]\r\n\r\n### Bug Fixes\r\n\r\n- do not generate CPEs for msrc-kb packages [PR [#5510](https://github.com/anchore/syft/pull/5510) @juanjsebgarcia]\r\n- Fix truncated pre-release versions in Go binaries' ldflags [PR [#5422](https://github.com/anchore/syft/pull/5422) @LemonCondor]\r\n- generate NVD-style terraform_provider CPEs for terraform lock packages [PR [#5261](https://github.com/anchore/syft/pull/5261) @timols]\r\n- OpenSSL-only SHA-256 fallback aborts installation [Issue [#5520](https://github.com/anchore/syft/issues/5520)] [PR [#5521](https://github.com/anchore/syft/pull/5521) @pujitha24]\r\n\r\n### Dependencies\r\n\r\n1 dependency change (1 updated).\r\n\r\n<details>\r\n<summary>Updated (1 package)</summary>\r\n\r\n- github.com/anchore/stereoscope `v0.4.0` → `v0.4.1`\r\n</details>\r\n\r\n**[(Full Changelog)](https://github.com/anchore/syft/compare/v1.56.0...v1.57.0)**\r\n\r\n","mentions_count":6}
