"updated_at":"2026-09-14T15:49:55Z"},{"id":563706067,"node_id":"RA_kwDOCBPQbs4hmXjT","name":"sha256sum-arm64.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":365,"digest":"sha256:73dd3f1de6d122a3f808f05ae1136754ec714784703fe65a7904319fda86ca33","download_count":10903,"created_at":"2026-09-14T15:49:56Z","updated_at":"2026-09-14T15:49:56Z"}],"body":"<!-- v1.37.0+k3s1 -->\r\n\r\nThis release updates Kubernetes to v1.37.0, and fixes a number of issues.\r\n\r\nFor more details on what's new, see the [Kubernetes release notes](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md#changelog-since-v1360).\r\n\r\n## Changes since v1.36.3+k3s1:\r\n\r\n* Bump mirrored-pause to 3.10.2 [(#14339)](https://github.com/k3s-io/k3s/pull/14339)\r\n* Build(deps): bump the action-deps group with 14 updates [(#14394)](https://github.com/k3s-io/k3s/pull/14394)\r\n* Bump dynamiclistener for atomic write fix [(#14382)](https://github.com/k3s-io/k3s/pull/14382)\r\n* Bump helm-controller/klipper-helm [(#14403)](https://github.com/k3s-io/k3s/pull/14403)\r\n* Simplify WriteSubnetFile cleanup and make atomic [(#14405)](https://github.com/k3s-io/k3s/pull/14405)\r\n* Fix typo in snapshot prune event [(#14410)](https://github.com/k3s-io/k3s/pull/14410)\r\n* Bump rancher/mirrored-coredns-coredns image version [(#14415)](https://github.com/k3s-io/k3s/pull/14415)\r\n* Add updatecli manifest to bump Kubernetes across multiple release branches [(#14402)](https://github.com/k3s-io/k3s/pull/14402)\r\n* Bump metrics-server to v0.9.0 [(#14416)](https://github.com/k3s-io/k3s/pull/14416)\r\n* Updatecli: relax metrics-server semver filter et al. [(#14429)](https://github.com/k3s-io/k3s/pull/14429)\r\n* Updatecli: add missing requiredEnv [(#14434)](https://github.com/k3s-io/k3s/pull/14434)\r\n* Bump helm-controller and klipper-helm for `--force-conflicts` support [(#14446)](https://github.com/k3s-io/k3s/pull/14446)\r\n* Bump k3s-io/kubernetes and Go references [(#14457)](https://github.com/k3s-io/k3s/pull/14457)\r\n* Bump etcd to v3.6.14 [(#14460)](https://github.com/k3s-io/k3s/pull/14460)\r\n* Fix production builds always enabling Go coverage instrumentation [(#14465)](https://github.com/k3s-io/k3s/pull/14465)\r\n* Feat: support custom kubeconfig name [(#14440)](https://github.com/k3s-io/k3s/pull/14440)\r\n  * Added `--write-kubeconfig-name` server flag to set the name for cluster, user and context in generated kubeconfig.\r\n* Require node password informer sync before using cache [(#14459)](https://github.com/k3s-io/k3s/pull/14459)\r\n* Bump helm-controller and klipper-helm [(#14474)](https://github.com/k3s-io/k3s/pull/14474)\r\n* Enable unit tests [(#14480)](https://github.com/k3s-io/k3s/pull/14480)\r\n* Fix: change sles to use slemicro rpms instead of microos [(#14472)](https://github.com/k3s-io/k3s/pull/14472)\r\n* Tests: make rootless uidmap install robust against stale apt cache [(#14490)](https://github.com/k3s-io/k3s/pull/14490)\r\n* Update stable channel to v1.36.3+k3s1 [(#14492)](https://github.com/k3s-io/k3s/pull/14492)\r\n* Etcd client locking [(#14488)](https://github.com/k3s-io/k3s/pull/14488)\r\n* Tests: Install rke2-multus-crd chart for multus e2e test [(#14489)](https://github.com/k3s-io/k3s/pull/14489)\r\n* Filter large untemplated issues [(#14435)](https://github.com/k3s-io/k3s/pull/14435)\r\n* Fix typo in spegel deferred store comment [(#14485)](https://github.com/k3s-io/k3s/pull/14485)\r\n* Make explicit where coredns customizations should be made [(#14503)](https://github.com/k3s-io/k3s/pull/14503)\r\n* Bump docker version in CI to 29 [(#14506)](https://github.com/k3s-io/k3s/pull/14506)\r\n* Don't retag images for a registry they are already hosted by [(#14484)](https://github.com/k3s-io/k3s/pull/14484)\r\n  * Fixed an issue where airgap image imports could fail with an \"already exists\" error, or accumulate duplicate image tags on every restart, when system-default-registry matched the registry the images were already tagged for.\r\n* Tidy dockerfile and build stages [(#14511)](https://github.com/k3s-io/k3s/pull/14511)\r\n* Add advertise-address to SANs before generating apiserver cert [(#14516)](https://github.com/k3s-io/k3s/pull/14516)\r\n  * Fixed the apiserver serving certificate not including the value of --advertise-address in its subject alternative names.\r\n* Bump Local Path Provisioner version [(#14496)](https://github.com/k3s-io/k3s/pull/14496)\r\n* Bump containerd to v2.3.4-k3s1.36 [(#14510)](https://github.com/k3s-io/k3s/pull/14510)\r\n* Bump kine to v0.16.4 for nats replay fix [(#14521)](https://github.com/k3s-io/k3s/pull/14521)\r\n* Feat: Add Project Bluefin to adopters list [(#14549)](https://github.com/k3s-io/k3s/pull/14549)\r\n* Bump k8s to v1.37 [(#14509)](https://github.com/k3s-io/k3s/pull/14509)\r\n* Bump Traefik and bundle gateway-api crds [(#14573)](https://github.com/k3s-io/k3s/pull/14573)\r\n* Bump rancher/mirrored-coredns-coredns image version [(#14577)](https://github.com/k3s-io/k3s/pull/14577)\r\n* Bump critools to v1.37 [(#14579)](https://github.com/k3s-io/k3s/pull/14579)\r\n* Bump gateway-api-crd version 3, which includes the keep annotation [(#14586)](https://github.com/k3s-io/k3s/pull/14586)\r\n* Bump Traefik to v3.7.13 [(#14606)](https://github.com/k3s-io/k3s/pull/14606)\r\n* Bump google.golang.org/grpc to v1.83.2 for CVE-2026-84445 [(#14614)](https://github.com/k3s-io/k3s/pull/14614)\r\n* Bump google.golang.org/grpc to v1.83.2, not v1.82.2 [(#14619)](https://github.com/k3s-io/k3s/pull/14619)\r\n\r\n## Embedded Component Versions\r\n| Component | Version |\r\n|---|---|\r\n| Kubernetes | [v1.37.0](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md#v1370) |\r\n| Kine | [v0.17.0](https://github.com/k3s-io/kine/releases/tag/v0.17.0) |\r\n| SQLite | [3.53.4](https://sqlite.org/releaselog/3_53_4.html) |\r\n| Etcd | [v3.7.1-k3s1](https://github.com/k3s-io/etcd/releases/tag/v3.7.1-k3s1) |\r\n| Containerd | [v2.3.4-k3s1](https://github.com/k3s-io/containerd/releases/tag/v2.3.4-k3s1) |\r\n| Runc | [v1.4.2](https://github.com/opencontainers/runc/releases/tag/v1.4.2) |\r\n| Flannel | [v0.28.4](https://github.com/flannel-io/flannel/releases/tag/v0.28.4) | \r\n| Metrics-server | [v0.9.0](https://github.com/kubernetes-sigs/metrics-server/releases/tag/v0.9.0) |\r\n| Traefik | [v3.7.13](https://github.com/traefik/traefik/releases/tag/v3.7.13) |\r\n| CoreDNS | [v1.14.7](https://github.com/coredns/coredns/releases/tag/v1.14.7) | \r\n| Helm-controller | [v0.17.7](https://github.com/k3s-io/helm-controller/releases/tag/v0.17.7) |\r\n| Local-path-provisioner | [v0.0.37](https://github.com/rancher/local-path-provisioner/releases/tag/v0.0.37) |\r\n\r\n## Helpful Links\r\nAs always, we welcome and appreciate feedback from our community of users. Please feel free to:\r\n- [Open issues here](https://github.com/rancher/k3s/issues/new/choose)\r\n- [Join our Slack channel](https://slack.rancher.io/)\r\n- [Check out our documentation](https://rancher.com/docs/k3s/latest/en/) for guidance on how to get started or to dive deep into K3s.\r\n- [Read how you can contribute here](https://github.com/rancher/k3s/blob/master/CONTRIBUTING.md)\r\n"}
