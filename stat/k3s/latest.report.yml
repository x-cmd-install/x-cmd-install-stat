ated_at":"2026-09-30T16:10:37Z"},{"id":601316123,"node_id":"RA_kwDOCBPQbs4j11sb","name":"sha256sum-arm64.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":365,"digest":"sha256:ee88154ce94ab9f0da15c88a12360ebcf27f9070462ac7567ba474bc3e0f7e6c","download_count":4958,"created_at":"2026-09-30T16:10:37Z","updated_at":"2026-09-30T16:10:37Z"}],"body":"<!-- v1.37.1+k3s1 -->\r\n\r\nThis release updates Kubernetes to v1.37.1, and fixes a number of issues.\r\n\r\nFor more details on what's new, see the [Kubernetes release notes](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md#changelog-since-v1370).\r\n\r\n## Changes since v1.37.0+k3s1:\r\n\r\n* Backports for 2026-09 [(#14631)](https://github.com/k3s-io/k3s/pull/14631)\r\n  * Fix restore from compressed etcd snapshot #14528\r\n  * Enable seccomp in riscv64 builds #14529\r\n  * Use ginkgo CLI to run tests #14531\r\n  * Bump k3s-io/api to v0.2.0 #14570\r\n  * Servicelb multiple lbpools #14547\r\n  * Close minio.Object after read #14580\r\n  * Bump k3s-io/apis again #14589\r\n  * Fix --flannel-cni-conf not reaching the embedded flannel #14598\r\n  * Check-config: suppress colors when stdout is not a terminal #14595\r\n  * Fix deploy controller not re-applying manifests when mtime is pinned to the epoch #14568\r\n  * Bump etcd to v3.7.1-k3s3 for nonblocking logging support #14628\r\n  * Bump kine to v0.17.1 #14627\r\n* Bump helm-controller [(#14684)](https://github.com/k3s-io/k3s/pull/14684)\r\n* Bump k3s-io/kubernetes and Go references [(#14695)](https://github.com/k3s-io/k3s/pull/14695)\r\n* Bump cadvisor to v0.60.5-k3s1 [(#14698)](https://github.com/k3s-io/k3s/pull/14698)\r\n* Reject anonymous access to supervisor router (spegel/pprof/metrics) [(#14701)](https://github.com/k3s-io/k3s/pull/14701)\r\n* Improve CA hash validation [(#14705)](https://github.com/k3s-io/k3s/pull/14705)\r\n\r\n## Embedded Component Versions\r\n| Component | Version |\r\n|---|---|\r\n| Kubernetes | [v1.37.1](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md#v1371) |\r\n| Kine | [v0.17.1](https://github.com/k3s-io/kine/releases/tag/v0.17.1) |\r\n| SQLite | [3.53.4](https://sqlite.org/releaselog/3_53_4.html) |\r\n| Etcd | [v3.7.1-k3s3](https://github.com/k3s-io/etcd/releases/tag/v3.7.1-k3s3) |\r\n| Containerd | [v2.3.4-k3s1](https://github.com/k3s-io/containerd/releases/tag/v2.3.4-k3s1) |\r\n| Runc | [v1.4.2](https://github.com/opencontainers/runc/releases/tag/v1.4.2) |\r\n| Flannel | [v0.28.4](https://github.com/flannel-io/flannel/releases/tag/v0.28.4) | \r\n| Metrics-server | [v0.9.0](https://github.com/kubernetes-sigs/metrics-server/releases/tag/v0.9.0) |\r\n| Traefik | [v3.7.13](https://github.com/traefik/traefik/releases/tag/v3.7.13) |\r\n| CoreDNS | [v1.14.7](https://github.com/coredns/coredns/releases/tag/v1.14.7) | \r\n| Helm-controller | [v0.17.9](https://github.com/k3s-io/helm-controller/releases/tag/v0.17.9) |\r\n| Local-path-provisioner | [v0.0.37](https://github.com/rancher/local-path-provisioner/releases/tag/v0.0.37) |\r\n\r\n## Helpful Links\r\nAs always, we welcome and appreciate feedback from our community of users. Please feel free to:\r\n- [Open issues here](https://github.com/rancher/k3s/issues/new/choose)\r\n- [Join our Slack channel](https://slack.rancher.io/)\r\n- [Check out our documentation](https://rancher.com/docs/k3s/latest/en/) for guidance on how to get started or to dive deep into K3s.\r\n- [Read how you can contribute here](https://github.com/rancher/k3s/blob/master/CONTRIBUTING.md)\r\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
