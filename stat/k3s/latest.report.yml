54Z","updated_at":"2026-08-27T15:53:54Z"},{"id":532523523,"node_id":"RA_kwDOCBPQbs4fvaoD","name":"sha256sum-arm64.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":365,"digest":"sha256:6ee9239eed8ec870f356a882758dc0a8ba06a97b3f3c0b5ba61231980e521058","download_count":22898,"created_at":"2026-08-27T15:53:54Z","updated_at":"2026-08-27T15:53:55Z"}],"body":"<!-- v1.36.4+k3s1 -->\r\n> [!WARNING]\r\n> This release upgrades Traefik chart to v40.x which includes a breaking change for the ingress-nginx migration: the provider name changes from `kubernetesIngressNginx` to `kubernetesIngressNGINX`. Check https://github.com/traefik/traefik-helm-chart/releases/tag/v40.0.0 for more details\r\n\r\nThis release updates Kubernetes to v1.36.4, and fixes a number of issues.\r\n\r\nFor more details on what's new, see the [Kubernetes release notes](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.36.md#changelog-since-v1363).\r\n\r\n## Changes since v1.36.3+k3s1:\r\n\r\n* Backport tests changes [(#14517)](https://github.com/k3s-io/k3s/pull/14517)\r\n* Bump Local Path Provisioner version [(#14498)](https://github.com/k3s-io/k3s/pull/14498)\r\n* Bump containerd to v2.3.4-k3s1.36 [(#14512)](https://github.com/k3s-io/k3s/pull/14512)\r\n* Backports for 2026-08 [(#14522)](https://github.com/k3s-io/k3s/pull/14522)\r\n* Update to v1.36.4-k3s1 and Go 1.26.7 [(#14545)](https://github.com/k3s-io/k3s/pull/14545)\r\n\r\n## Embedded Component Versions\r\n| Component | Version |\r\n|---|---|\r\n| Kubernetes | [v1.36.4](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.36.md#v1364) |\r\n| Kine | [v0.16.4](https://github.com/k3s-io/kine/releases/tag/v0.16.4) |\r\n| SQLite | [3.53.4](https://sqlite.org/releaselog/3_53_4.html) |\r\n| Etcd | [v3.6.14-k3s1](https://github.com/k3s-io/etcd/releases/tag/v3.6.14-k3s1) |\r\n| Containerd | [v2.3.4-k3s1.36](https://github.com/k3s-io/containerd/releases/tag/v2.3.4-k3s1.36) |\r\n| Runc | [v1.4.2](https://github.com/opencontainers/runc/releases/tag/v1.4.2) |\r\n| Flannel | [v0.28.4](https://github.com/flannel-io/flannel/releases/tag/v0.28.4) | \r\n| Metrics-server | [v0.9.0](https://github.com/kubernetes-sigs/metrics-server/releases/tag/v0.9.0) |\r\n| Traefik | [v3.7.8](https://github.com/traefik/traefik/releases/tag/v3.7.8) |\r\n| CoreDNS | [v1.14.6](https://github.com/coredns/coredns/releases/tag/v1.14.6) | \r\n| Helm-controller | [v0.17.7](https://github.com/k3s-io/helm-controller/releases/tag/v0.17.7) |\r\n| Local-path-provisioner | [v0.0.37](https://github.com/rancher/local-path-provisioner/releases/tag/v0.0.37) |\r\n\r\n## Helpful Links\r\nAs always, we welcome and appreciate feedback from our community of users. Please feel free to:\r\n- [Open issues here](https://github.com/rancher/k3s/issues/new/choose)\r\n- [Join our Slack channel](https://slack.rancher.io/)\r\n- [Check out our documentation](https://rancher.com/docs/k3s/latest/en/) for guidance on how to get started or to dive deep into K3s.\r\n- [Read how you can contribute here](https://github.com/rancher/k3s/blob/master/CONTRIBUTING.md)\r\n"}
