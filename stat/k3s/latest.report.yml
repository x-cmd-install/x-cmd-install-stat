,"updated_at":"2026-11-03T17:32:35Z"},{"id":706480484,"node_id":"RA_kwDOCBPQbs4qHAlk","name":"sha256sum-arm64.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":365,"digest":"sha256:b017cfc151c92e30530c7d1830048ee5afabe53a4520ae513d584b7b2c2ee564","download_count":9225,"created_at":"2026-11-03T17:32:35Z","updated_at":"2026-11-03T17:32:35Z"}],"body":"<!-- v1.37.2+k3s1 -->\r\n\r\nThis release updates Kubernetes to v1.37.2, and fixes a number of issues.\r\n\r\nFor more details on what's new, see the [Kubernetes release notes](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md#changelog-since-v1371).\r\n\r\n## Changes since v1.37.1+k3s1:\r\n\r\n* Add gateway-api-crd to help [(#14727)](https://github.com/k3s-io/k3s/pull/14727)\r\n* Run snapshotrestore test entries in parallel [(#14733)](https://github.com/k3s-io/k3s/pull/14733)\r\n* Deps: bump containerd to v2.3.6 [(#14744)](https://github.com/k3s-io/k3s/pull/14744)\r\n* Bump Traefik to v3.7.14 and gateway-api to 1.6.2 [(#14757)](https://github.com/k3s-io/k3s/pull/14757)\r\n* Bump gateway-api to 1.6.3 [(#14769)](https://github.com/k3s-io/k3s/pull/14769)\r\n* Bump K3s-root version to v0.15.3 [(#14782)](https://github.com/k3s-io/k3s/pull/14782)\r\n* Bump flannel to v0.28.10 [(#14796)](https://github.com/k3s-io/k3s/pull/14796)\r\n* Bump containerd to v2.3.7 [(#14805)](https://github.com/k3s-io/k3s/pull/14805)\r\n* Update kube-roter to v2.11.1 [(#14762)](https://github.com/k3s-io/k3s/pull/14762)\r\n* Remove unused replace directives [(#14821)](https://github.com/k3s-io/k3s/pull/14821)\r\n* Bump Klipper Helm and Helm Controller version [(#14814)](https://github.com/k3s-io/k3s/pull/14814)\r\n* Backports for 2026-10 [(#14825)](https://github.com/k3s-io/k3s/pull/14825)\r\n  * Prevent systemd restart loop when no default route is present by waiting 60 seconds for default route to appear #14527\r\n  * Exclude kms-providers from apiserver readiness check #14635\r\n  * Clarify etcd local vs S3 snapshot retention flag help #14716\r\n  * Update ServiceLB status when node addresses change #14550\r\n  * Omit default SA key flags when service-account-signing-endpoint is set #14719\r\n  * Fix local-path PV deletion with SELinux enforcing #14740\r\n  * Feature/14562 etcd snapshot restrictions #14678\r\n  * Report image list read errors when pre-pulling images #14732\r\n  * Migrate CI from docker to GHCR #14603\r\n  * Fix etcd member removal when etcd is disabled on an existing server #14801\r\n  * Docker tests: add gateway-api test #14802\r\n  * Fix goroutine leak in the proxy #14811\r\n  * Make etcdsnapshot restrictions integration test respect the test lock #14820\r\n* Bump rancher/mirrored-library-traefik image version [(#14833)](https://github.com/k3s-io/k3s/pull/14833)\r\n* Bump Klipper Helm and Helm Controller version [(#14874)](https://github.com/k3s-io/k3s/pull/14874)\r\n* Pin runners to ubuntu-24.04 [(#14918)](https://github.com/k3s-io/k3s/pull/14918)\r\n* Bump k3s-io/kubernetes and Go references [(#14925)](https://github.com/k3s-io/k3s/pull/14925)\r\n* Bump x/net and pass `golang.org/x/` replacements through when building bundled binaries [(#14935)](https://github.com/k3s-io/k3s/pull/14935)\r\n\r\n## Embedded Component Versions\r\n| Component | Version |\r\n|---|---|\r\n| Kubernetes | [v1.37.2](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md#v1372) |\r\n| Kine | [v0.17.1](https://github.com/k3s-io/kine/releases/tag/v0.17.1) |\r\n| SQLite | [3.53.4](https://sqlite.org/releaselog/3_53_4.html) |\r\n| Etcd | [v3.7.1-k3s3](https://github.com/k3s-io/etcd/releases/tag/v3.7.1-k3s3) |\r\n| Containerd | [v2.3.7-k3s1](https://github.com/k3s-io/containerd/releases/tag/v2.3.7-k3s1) |\r\n| Runc | [v1.4.2](https://github.com/opencontainers/runc/releases/tag/v1.4.2) |\r\n| Flannel | [v0.28.10](https://github.com/flannel-io/flannel/releases/tag/v0.28.10) | \r\n| Metrics-server | [v0.9.0](https://github.com/kubernetes-sigs/metrics-server/releases/tag/v0.9.0) |\r\n| Traefik | [v3.7.15](https://github.com/traefik/traefik/releases/tag/v3.7.15) |\r\n| CoreDNS | [v1.14.7](https://github.com/coredns/coredns/releases/tag/v1.14.7) | \r\n| Helm-controller | [v0.17.9](https://github.com/k3s-io/helm-controller/releases/tag/v0.17.9) |\r\n| Local-path-provisioner | [v0.0.37](https://github.com/rancher/local-path-provisioner/releases/tag/v0.0.37) |\r\n| Kubernetes Gateway API CRD| [1.6.301](https://github.com/k3s-io/k3s-charts/blob/main/assets/gateway-api-crd/gateway-api-crd-1.6.301.tgz) |\r\n\r\n## Helpful Links\r\nAs always, we welcome and appreciate feedback from our community of users. Please feel free to:\r\n- [Open issues here](https://github.com/rancher/k3s/issues/new/choose)\r\n- [Join our Slack channel](https://slack.rancher.io/)\r\n- [Check out our documentation](https://rancher.com/docs/k3s/latest/en/) for guidance on how to get started or to dive deep into K3s.\r\n- [Read how you can contribute here](https://github.com/rancher/k3s/blob/master/CONTRIBUTING.md)\r\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
