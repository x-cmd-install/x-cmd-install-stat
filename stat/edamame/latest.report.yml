Terminal 1.22.\n\n### Fixed\n\n- On native Windows, the capabilities notice and `--doctor` no longer warn about Unicode, or the keyboard (in Windows Terminal).\n- `--doctor` reports an absent `TERM` or `COLORTERM` as `unset` rather than `unknown`.\n- Vim: each command is its own undo step, so `x` `x` no longer undoes as one.\n- Vim: `O` on a list's first item opens a new item above it instead of a plain line.\n- Vim: a counted paste too large to build (over 64 MiB) is refused instead of exhausting memory.\n- Vim: a paste that spans lines renumbers the ordered list it lands in.\n- One undo now reverts an edit together with the list renumbering it caused.\n- Links open on more Linux desktops when `xdg-open` fails.\n\n### Security\n\nUpdated dependencies to include these fixes:\n\n- Fixed security flaws in the math renderer that a crafted formula in a document could trigger (RUSTSEC-2026-0381, RUSTSEC-2026-0382).\n- Fixed a flaw in HTML export's sanitizer that could let crafted raw HTML in a document through into the exported file.\n- Fixed a TLS flaw in the connection used for remote images and the update check.\n- Fixed flaws in the Markdown parser that let a crafted document make parsing very slow, freezing the editor.\n\n## Install edamame 0.1.7\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-installer.sh | sh\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install mijowi/tap/edamame\n```\n\n## Download edamame 0.1.7\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [edamame-aarch64-apple-darwin.tar.xz](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-aarch64-apple-darwin.tar.xz.sha256) |\n| [edamame-x86_64-apple-darwin.tar.xz](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-apple-darwin.tar.xz.sha256) |\n| [edamame-x86_64-pc-windows-msvc.zip](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-pc-windows-msvc.zip.sha256) |\n| [edamame-aarch64-unknown-linux-gnu.tar.xz](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [edamame-x86_64-unknown-linux-gnu.tar.xz](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [edamame-x86_64-unknown-linux-musl.tar.xz](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/mijowi/edamame/releases/download/v0.1.7/edamame-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n\n"}
