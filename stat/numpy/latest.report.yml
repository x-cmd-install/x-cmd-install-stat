the usual bug and maintenance work, there are a number of\r\nStringDType related fixes for problems discovered during the ongoing string\r\nwork in the main branch.\r\n\r\nThis release supports Python versions 3.12-3.15\r\n\r\n## Changes\r\n\r\n- Casting a fixed-width byte string array (`np.bytes_`) to `StringDType`\r\n  now raises `TypeError` when the bytes are not valid UTF-8. Previously the\r\n  invalid bytes were stored as-is and later caused undefined behavior in\r\n  string operations.\r\n\r\n  ([gh-32296](https://github.com/numpy/numpy/pull/32296))\r\n\r\n- `MaskedArray._fill_value` would become stale when ufuncs that change dtype\r\n  left the result holding a fill_value typed for the old dtype. The mismatch\r\n  was silent until something later called `_check_fill_value`, such as\r\n  `.view()`, and then a `TypeError` would be raised. Now, when the copied\r\n  fill_value is no longer valid for the new dtype, fall back to the\r\n  default fill_value for that dtype instead of propagating the stale value.\r\n  This may raise a `ComplexWarning` if the fill_value is complex and the\r\n  new dtype is real.\r\n\r\n  ([gh-32423](https://github.com/numpy/numpy/pull/32423))\r\n\r\n## Contributors\r\n\r\nA total of 9 people contributed to this release. People with a \\\"+\\\" by their\r\nnames contributed a patch for the first time.\r\n\r\n- Charles Harris\r\n- Iason Krommydas\r\n- James Davies +\r\n- Joren Hammudoglu\r\n- Maanas Arora\r\n- Matti Picus\r\n- Nathan Goldbaum\r\n- Shikhar Goel +\r\n- Yeonho Kim +\r\n\r\n## Pull requests merged\r\n\r\nA total of 27 pull requests were merged for this release.\r\n\r\n- [#32235](https://github.com/numpy/numpy/pull/32235): MAINT: Prepare 2.5.x for further development\r\n- [#32289](https://github.com/numpy/numpy/pull/32289): BUG: raise ValueError when reading into record array with references\\...\r\n- [#32290](https://github.com/numpy/numpy/pull/32290): BUG: avoid uninitialized memory access / NULL-pointer deref in\\...\r\n- [#32291](https://github.com/numpy/numpy/pull/32291): TYP: fix `np.random.{get,set}_bit_generator` implicit re-exports\\...\r\n- [#32292](https://github.com/numpy/numpy/pull/32292): BUG: don\\'t assume strides are a multiple of itemsize in stringdtype\\...\r\n- [#32293](https://github.com/numpy/numpy/pull/32293): CI: fix ccache CC override, add CXX in mac Conda CI (#32285)\r\n- [#32303](https://github.com/numpy/numpy/pull/32303): BUG: Fix ref leak in [convert_from_type]{#convert_from_type} for custom scalar types\\...\r\n- [#32304](https://github.com/numpy/numpy/pull/32304): BUG: fix a number of issues around iterators and StringDType\\...\r\n- [#32326](https://github.com/numpy/numpy/pull/32326): TST: avoid allocating huge tuple of arrays in concatenate test\\...\r\n- [#32338](https://github.com/numpy/numpy/pull/32338): BUG: avoid possible UB in \\'safe\\' multiplication helpers (#32294)\r\n- [#32339](https://github.com/numpy/numpy/pull/32339): MAINT: use `PyObject_` functions instead of raw `PyArray_ ones` (#32331)\r\n- [#32378](https://github.com/numpy/numpy/pull/32378): BUG: validate UTF-8 and harden StringDType bounds handling (#32296)\r\n- [#32380](https://github.com/numpy/numpy/pull/32380): BUG: fix two error handling mistakes in stringdtype replace loop\\...\r\n- [#32381](https://github.com/numpy/numpy/pull/32381): BUG: fix visibility annotations for functions in StringDType\\...\r\n- [#32384](https://github.com/numpy/numpy/pull/32384): MAINT: Update ml_dtypes pin to 8/21/2026.\r\n- [#32385](https://github.com/numpy/numpy/pull/32385): MAINT: Update numpy/\\_core/src/umath/svml\r\n- [#32410](https://github.com/numpy/numpy/pull/32410): MAINT: skip failing cython limited API tests on Cython 3.3.0\\...\r\n- [#32427](https://github.com/numpy/numpy/pull/32427): BUG: close duplicated file descriptor if fdopen fails (#32386)\r\n- [#32428](https://github.com/numpy/numpy/pull/32428): MAINT: add missing space in warning and error messages (#32405)\r\n- [#32430](https://github.com/numpy/numpy/pull/32430): BUG: fix error handling in StringDType to fixed-width bytes case\\...\r\n- [#32441](https://github.com/numpy/numpy/pull/32441): MAINT: Only run nightly BLAS tests on main.\r\n- [#32471](https://github.com/numpy/numpy/pull/32471): BUG: fix memory leak in StringDType creation error path (#32470)\r\n- [#32477](https://github.com/numpy/numpy/pull/32477): BUG: fix stale fill_value after ufuncs change MaskedArray dtype\\...\r\n- [#32478](https://github.com/numpy/numpy/pull/32478): MAINT: exit deadlock tests quickly on slow hardware (#32466)\r\n- [#32481](https://github.com/numpy/numpy/pull/32481): BUG: Backport StringDType byteorder fixes\r\n- [#32506](https://github.com/numpy/numpy/pull/32506): DOC: use static scipy doc site for intershpinx (#32503)\r\n- [#32509](https://github.com/numpy/numpy/pull/32509): BUG: fix crash in ufunc.resolve_dtypes with a Python scalar type\\...\r\n","reactions":{"total_count":17,"+1":5,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":7,"rocket":1,"eyes":1}}
