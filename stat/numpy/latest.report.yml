 2.5.3\r\nrelease. Highlights are:\r\n\r\n- Many typing fixes and improvements,\r\n- A workaround for the MSVC 19.51 bug, see below.\r\n\r\nThis release supports Python versions 3.12-3.15.\r\n\r\n## Improvements\r\n\r\n- `numpy.linalg.svd` and `numpy.linalg.lstsq` now raise for inputs containing\r\n  infinities instead of returning garbage results.\r\n\r\n- Fixed hangs in `numpy.linalg.svd` and `numpy.linalg.lstsq` for certain inputs\r\n  containing infinities for recent versions of some LAPACK implementations.\r\n\r\n- `numpy.linalg.cond` now handles non-finite inputs more consistently.\r\n\r\n([gh-32593](https://github.com/numpy/numpy/pull/32593))\r\n\r\n### StringDType hashing with NaN sentinels\r\n\r\n`StringDType` instances with equivalent floating-point NaN sentinels now\r\nhave equal hashes. Previously, distinct NaN objects could produce equal\r\ndtype instances with different hashes, causing dictionary lookups and set\r\ndeduplication to fail.\r\n\r\n([gh-32563](https://github.com/numpy/numpy/pull/32563))\r\n\r\n## Changes\r\n\r\n### `MaskedArray` resets a fill_value that cannot be represented in a new dtype\r\n\r\nA fill_value copied from a source array is now reset to the default fill_value\r\nfor the new dtype when it cannot be represented in that dtype. Previously the\r\ncopied value could be stale: ufuncs that change dtype left the result holding a\r\nfill_value typed for the old dtype, which raised a `TypeError` only when\r\nsomething later validated it (such as `.view()`), and a floating point\r\nfill_value that overflows an integer dtype was kept as an out-of-range value\r\ntogether with a `RuntimeWarning`. Both now fall back to the default,\r\nincluding when a masked array is passed to `MaskedArray` with a different\r\n`dtype`. A fill_value given explicitly by the user is still validated and\r\nraises as before. This can now raise a `ComplexWarning` if the fill_value is\r\ncomplex and the new dtype is real.\r\n\r\n([gh-32508](https://github.com/numpy/numpy/pull/32508))\r\n([gh-32562](https://github.com/numpy/numpy/pull/32562))\r\n\r\n## Contributors\r\n\r\nA total of 9 people contributed to this release. People with a \\\"+\\\" by their\r\nnames contributed a patch for the first time.\r\n\r\n- Aniket Singh Yadav\r\n- Bhuvansh Kataria +\r\n- Charles Harris\r\n- Iason Krommydas\r\n- Joren Hammudoglu\r\n- Lazizbek Ergashev +\r\n- Nathan Goldbaum\r\n- Sebastian Berg\r\n- Yeonho Kim\r\n\r\n## Pull requests merged\r\n\r\nA total of 17 pull requests were merged for this release.\r\n\r\n- [#32520](https://github.com/numpy/numpy/pull/32520): MAINT: Prepare 2.5.x for further development\r\n- [#32557](https://github.com/numpy/numpy/pull/32557): BUG: Reset an unrepresentable fill_value on a dtype change (#32508)\r\n- [#32565](https://github.com/numpy/numpy/pull/32565): BLD: work around MSVC 19.51 bug (#32561)\r\n- [#32600](https://github.com/numpy/numpy/pull/32600): BUG: fix np.strings.replace truncating old/new to a\\'s\r\n- [#32707](https://github.com/numpy/numpy/pull/32707): BUG: fix [ureduce]{#ureduce} reshape when a kept axis has size 0 (#32536)\r\n- [#32709](https://github.com/numpy/numpy/pull/32709): BUG: fix two possible crashes in the ufunc.accumulate implementation\\...\r\n- [#32710](https://github.com/numpy/numpy/pull/32710): BUG: Reset an inherited fill_value in MaskedArray.\\_\\_new\\_\\_ as\\...\r\n- [#32711](https://github.com/numpy/numpy/pull/32711): ENH: Improvements and fixes for stringdtype hashing (#32563)\r\n- [#32713](https://github.com/numpy/numpy/pull/32713): CI: increase ppc64le timeout to match other timeouts (#32583)\r\n- [#32718](https://github.com/numpy/numpy/pull/32718): BUG: fix memory leak in legacy ArrayMethod wrapper code\r\n- [#32719](https://github.com/numpy/numpy/pull/32719): BUG: check for non-finite input before calling gesdd/gelsd and\\...\r\n- [#32738](https://github.com/numpy/numpy/pull/32738): BUG: fix segfault in as_arrays() on self-referencing pyscalars\r\n- [#32741](https://github.com/numpy/numpy/pull/32741): TYP: Various typing improvements.\r\n- [#32791](https://github.com/numpy/numpy/pull/32791): BUG: Fix canonicalization/promotion of nested subarray types\\...\r\n- [#32888](https://github.com/numpy/numpy/pull/32888): MAINT: Update vendored-meson to match main.\r\n- [#32904](https://github.com/numpy/numpy/pull/32904): TYP: Backport a number of typing updates.\r\n- [#32956](https://github.com/numpy/numpy/pull/32956): TYP: Various typing fixes and improvements.\r\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":3,"rocket":1,"eyes":0}}
