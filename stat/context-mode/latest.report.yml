{"id":445408728,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORWiFDM4ajGXY","tag_name":"v2.2.0","target_commitish":"main","name":"v2.2.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-14T15:54:12Z","updated_at":"2026-11-14T15:54:28Z","published_at":"2026-11-14T15:54:28Z","assets":[{"id":747976173,"node_id":"RA_kwDORWiFDM4slTXt","name":"context-mode.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1485869,"digest":"sha256:f8d84cc4cc3ec483317ba0c1c859faa732a8cac8adf53fd6c568a261db2ab7cf","download_count":14,"created_at":"2026-11-14T15:54:27Z","updated_at":"2026-11-14T15:54:28Z"}],"body":"### Features\n- feat: OMP (oh-my-pi) is the 11th supported agent (ADR-0026, #1332)\n- feat: ADR-0023 omp row, PRD and TECH-SPEC 11 agents, 01-contracts and 12-plugins name OMP, intake reads OMP (OMP M8)\n- feat: docs/install/omp.md with OMP's own verbs, omp in NATIVE_HOSTS, 11 agents in install docs and README (OMP M8)\n- feat: ci.yml OMP 18.20.0 from its own install script on 3 OS, omp --version gate, OMP e2e cases step (OMP M7c)\n- feat: omp row decodes the Pi payload with agent omp, rows say omp (OMP M7a)\n- feat: ctx_upgrade on OMP prints omp plugin upgrade, writes no host config, one plugin root per package (OMP M6b)\n- feat: doctor names OMP, reads the OMP plugin store, prints OMP verbs and host-limit info (OMP M6a)\n- feat: setup merges and uninstall drops context-mode in OMP disabledServers when OMP imports it (OMP M5)\n- feat: issue forms, intake, CI step name and windows-hosts list omp as the 11th agent (OMP M4b)\n- feat: package.json omp key and omp/index.js wrapper (OMP M4b)\n- feat: omp is the 11th AgentId with a Pi-shaped table row (OMP M4a)\n- feat: all 9 ctx_* tools register with loadMode essential (OMP M3)\n- feat: OMP reads contextMode.excludeTools from api.pi.settings per call (OMP M2c)\n- feat: turn once per prompt, OMP registers tools at load (OMP M2b)\n- feat: shared Pi factory takes the agent id from its entry, env never selects OMP (OMP M2a)\n- feat: array systemPrompt keeps every OMP block, payload last, once (OMP M1)\n\n### Fixes\n- fix(ci): the OMP fire block runs in its own test file so the VS Code setup check keeps its 10 s MCP timer (D-OMP-CI-3, #1332)\n- fix(ci): OMP CI on main, windows-hosts installs OMP; GP3 omp driver uses stdin (D-OMP-CI-2, #1332)\n- fix(ci): windows-hosts job installs OMP with its own script; GP3 omp driver reads steps on stdin (D-OMP-CI-2)\n- fix: safeFetch sends user-agent and accept on every request, a refused fetch names the host (#1380)\n- fix: readme-stats writes the README counts line from stats.json (D-README-COUNTS-1)\n- fix: readme-stats job rebases before its push, so README counts update daily (D-README-STATS-PUSH-1)\n- fix: gemini doctor checks an installed extension from disk when the list fails (#1378)\n- fix: doctor names the gemini list error for an installed extension (#1378)\n- fix: doctor names a missing pinned codex hook or server path (#1376)\n- fix: setup uses the codex plugin route when it runs from the plugin cache (#1376)\n- fix: runProcess reads the pipes once more before an exit-drain cut (D-R59-D5-DRAIN-1)\n- fix: a tools: mcp__<server>__* or mcp__<server> entry grants that server's ctx tools, so the subagent gets case A (#1374)\n- fix: copilot-cli and vscode hook command starts with bare node on Windows so pwsh -Command parses it (#1375)\n- fix(e2e): hook runner builds the child env from an allowlist, not the runner's process.env (D-E2E-HOST-ENV-1)\n- fix(sandbox): a PATH candidate stat cannot read is skipped, lookup failures are named, D11 names a language it cannot resolve (#1373)\n\n### Performance\n- perf: doctor reads the omp plugin list once (OMP P5)\n\n### Who gets this\n\nOne version on both channels: the release commit on main (GitHub) and npm.\n\n| Agent | Channel | Update with |\n|---|---|---|\n| Claude Code | GitHub | `claude plugin update context-mode@context-mode` |\n| Codex | GitHub, npm for the one-time hook trust step | `codex plugin marketplace upgrade context-mode` |\n| Gemini CLI | GitHub | `gemini extensions update context-mode` |\n| Qwen Code | GitHub | `qwen extensions update context-mode` |\n| Copilot CLI | npm | `context-mode upgrade` |\n| VS Code (Copilot) | npm | `context-mode upgrade` |\n| Kiro | npm | `context-mode upgrade` |\n| ZCode | GitHub | `zcode plugins update context-mode@context-mode` |\n| Pi | npm | `pi update --extensions` |\n| OpenCode | npm | `opencode plugin update` |\n| OMP | npm | `omp plugin upgrade context-mode` |","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":3,"eyes":0}}
