ps): bump lipgloss to v2.0.6 (#1011) (@andrinoff)\r\n\r\n### Other stuff\r\n* 7f75d0e5296c2c4baafc5109cf2b1de3491c2cf5: chore(v3): prepare v3 (#1009) (@andrinoff)\r\n* 1a13810c340b8833627eecf08c100c3b39c71f31: chore: bump bubbletea to v2 (#1002) (@andrinoff)\r\n* e5cb757278216f84400466a47c987f56ea2de5c4: chore: govulncheck bumps (#1004) (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/glow/releases/download/v3.0.0/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/glow/releases/download/v3.0.0/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/glow/releases/download/v3.0.0/checksums.txt'\r\nwget 'https://github.com/charmbracelet/glow/releases/download/v3.0.0/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","reactions":{"total_count":32,"+1":10,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":15,"rocket":6,"eyes":0},"mentions_count":2}
