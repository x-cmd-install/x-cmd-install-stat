{"id":348961690,"author":{"login":"tony","id":26336,"node_id":"MDQ6VXNlcjI2MzM2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAL0uWs4UzLua","tag_name":"v1.74.0","target_commitish":"master","name":"v1.74.0 - Improved docs, tmux 3.7a and 3.7b support","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-04T13:45:40Z","updated_at":"2026-07-04T13:54:47Z","published_at":"2026-07-04T13:54:47Z","assets":[],"body":"tmuxp 1.74.0 pairs a libtmux upgrade with a documentation overhaul. It bumps libtmux to 0.61.0 \u2014 hardening tmux 3.7 patch-line support \u2014 and teaches `tmuxp debug-info` to report the exact tmux patch release (`3.7a`/`3.7b`) instead of the numeric-normalized version. The docs also gain theme-aware inline diagrams and a concept-first rewrite that leads with what each feature is before its configuration.\r\n\r\n## Highlights\r\n\r\n### libtmux 0.61.0\r\n\r\nThe libtmux floor moves from `~=0.60.0` to `~=0.61.0`, hardening tmux 3.7 patch-line support. libtmux's `Pane.break_pane()` now keeps tmux's own default window name on tmux 3.7a/3.7b instead of forcing `libtmux`, and a new `get_version_str()` helper exposes the raw tmux version string. tmux 3.2a\u20133.6 are unaffected.\r\n\r\n### `tmuxp debug-info` reports the exact tmux patch release\r\n\r\n`tmuxp debug-info` now shows tmux's full version, keeping the point-release letter (for example `3.7a`) that was previously normalized away to `3.7`. Because tmux patch releases can differ in behavior, the precise release is what a bug report needs.\r\n\r\n### Themed diagrams across the docs\r\n\r\nDiagrams now render as theme-aware inline graphics that follow the site's light/dark palette and code styling, replacing the old static ASCII art. The workspace-builders guide gains a load \u2192 build \u2192 attach flow diagram, and the examples page shows each pane example as a faithful tmux window layout.\r\n\r\n### Concept-first documentation pass\r\n\r\nThe docs now open with what each feature *is* before its configuration, in a consistent second-person voice, with advanced and Python-only material marked opt-in. New diagrams trace the plugin hook lifecycle, the CLI request flow, the workspace hierarchy, and what `tmuxp load` does inside an existing session.\r\n\r\n### Development\r\n\r\nThe build-time mermaid diagram renderer, previously bundled with the docs, now comes from the reusable `sphinx-gp-mermaid` package. Rendered output is unchanged.\r\n\r\n## What's Changed\r\n* Docs: build-time mermaid + tmux-layout diagram rendering by @tony in https://github.com/tmux-python/tmuxp/pull/1071\r\n* docs: voice-guide compliance pass, diagrams, and fixes by @tony in https://github.com/tmux-python/tmuxp/pull/1072\r\n* Docs: consume sphinx-gp-mermaid, drop the vendored renderer by @tony in https://github.com/tmux-python/tmuxp/pull/1073\r\n* libtmux 0.61.0 by @tony in https://github.com/tmux-python/tmuxp/pull/1074\r\n\r\n**Full Changelog**: https://github.com/tmux-python/tmuxp/compare/v1.73.0...v1.74.","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":1,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
