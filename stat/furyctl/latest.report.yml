64.tar.gz","label":"","uploader":{"login":"SIGHUP-C-3PO","id":88768683,"node_id":"MDQ6VXNlcjg4NzY4Njgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":16916361,"digest":"sha256:8a1cd10749651cc636542779bddcb94672f8d2e54724fcda2b8cb7bd48ba8e86","download_count":211,"created_at":"2026-10-23T08:42:31Z","updated_at":"2026-10-23T08:42:33Z"},{"id":668516918,"node_id":"RA_kwDOCW8i4s4n2MI2","name":"furyctl-linux-arm64.tar.gz","label":"","uploader":{"login":"SIGHUP-C-3PO","id":88768683,"node_id":"MDQ6VXNlcjg4NzY4Njgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15266300,"digest":"sha256:fee89ba693ddc6a5a5a09acbd895fb11342c619437d92deb33d41e640bf3d8e4","download_count":1,"created_at":"2026-10-23T08:42:31Z","updated_at":"2026-10-23T08:42:33Z"}],"body":"# furyctl release v0.36.1\n\nWelcome to the latest release of `furyctl` maintained by SIGHUP by ReeVo team.\n\n## New features 🌟\n\n### All kinds\n\n- [[#808](https://github.com/sighupio/furyctl/pull/808)] When a tool that furyctl runs fails, the error now starts with the cause, for example each Ansible host that failed or does not answer, then gives the command and the last lines of its output. furyctl saves the full output to a text file in `.furyctl/logs` and gives its path. Before this release, the error repeated the name of the command and gave its full output, and the cause was difficult to find in it.\n\n## Bug fixes 🐞\n\n### OnPremises and Immutable\n\nUpdates the upgrade paths for backported versions that were incomplete in v0.36.0:\n  - `1.34.2-1.34.3` for OnPremises\n  - `1.35.1-1.35.2` for OnPremises and Immutable\n\nThe upgrade paths to SD v1.36 were correct.\n\n"}
