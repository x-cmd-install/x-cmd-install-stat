64.tar.gz","label":"","uploader":{"login":"SIGHUP-C-3PO","id":88768683,"node_id":"MDQ6VXNlcjg4NzY4Njgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":16993997,"digest":"sha256:231683fc295435fd4ae15b26ebf193c35aa78f62ecef274544cc504f9800118d","download_count":7,"created_at":"2026-11-26T14:21:39Z","updated_at":"2026-11-26T14:21:41Z"},{"id":796249126,"node_id":"RA_kwDOCW8i4s4vdcwm","name":"furyctl-linux-arm64.tar.gz","label":"","uploader":{"login":"SIGHUP-C-3PO","id":88768683,"node_id":"MDQ6VXNlcjg4NzY4Njgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15340435,"digest":"sha256:13421c548bf4283082c7342adb702d123a2b67c5d9777e5aa7cd33e7a0229b73","download_count":2,"created_at":"2026-11-26T14:21:39Z","updated_at":"2026-11-26T14:21:41Z"}],"body":"# furyctl release v0.36.2\n\nWelcome to the latest release of `furyctl` maintained by SIGHUP by ReeVo team.\n\n## New features 🌟\n\n### All kinds\n\n- [[#825](https://github.com/sighupio/furyctl/pull/825)] Adds support for SD v1.36.1, with the upgrade paths `1.36.0-1.36.1` and `1.35.2-1.36.1` for all kinds.\n- [[#812](https://github.com/sighupio/furyctl/pull/812)] `apply`, `delete cluster`, `serve` and `renew` now report their status to the terminal: the phase, the progress, a prompt that waits for an answer, and the result. A terminal with OSC 7501 support (for example Rex) shows the status on the tab, and the result stays after furyctl stops. A terminal with OSC 9;4 support (for example iTerm2, Ghostty, Windows Terminal, or the VS Code terminal with `${progress}` in its tab title) shows a progress bar. Other terminals ignore the sequences, and furyctl sends none with `--no-tty` or when the output is not a terminal.\n- [[#829](https://github.com/sighupio/furyctl/pull/829)] `get upgrade-paths` now shows a link to the release of each target version, a possible path to the latest version and the next step, instead of the list of versions.\n\n### Immutable\n\n- [[#820](https://github.com/sighupio/furyctl/pull/820)] `get cluster-info` now shows the Flatcar version and the kernel version of the nodes. If the nodes run different versions, for example during an upgrade, the command shows all of them.\n- [[#819](https://github.com/sighupio/furyctl/pull/819)] `delete cluster` now works for the Immutable kind. It deletes the plugins and the distribution, then erases the partition table of the install disk of every node; `--phase` runs a single phase.\n\n## Bug fixes 🐞\n\n### All kinds\n\n- [[#817](https://github.com/sighupio/furyctl/pull/817)] A dry run no longer leaves a copy of the configuration file, with its inlined secrets if any, in the temporary folder.\n\n"}
