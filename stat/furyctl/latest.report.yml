d64.tar.gz","label":"","uploader":{"login":"SIGHUP-C-3PO","id":88768683,"node_id":"MDQ6VXNlcjg4NzY4Njgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":21873003,"digest":"sha256:6f3f0974d25aa342b3dc0108493d9863091de47d82dcdc253ad505502a5d0b41","download_count":711,"created_at":"2026-08-03T11:15:32Z","updated_at":"2026-08-03T11:15:33Z"},{"id":499966190,"node_id":"RA_kwDOCW8i4s4dzODu","name":"furyctl-linux-arm64.tar.gz","label":"","uploader":{"login":"SIGHUP-C-3PO","id":88768683,"node_id":"MDQ6VXNlcjg4NzY4Njgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":19572374,"digest":"sha256:5fe9f7ad38934c059c1a9fb04e7e735e516e754e10d25d4b390da3d471e88033","download_count":1,"created_at":"2026-08-03T11:15:32Z","updated_at":"2026-08-03T11:15:33Z"}],"body":"# furyctl release v0.35.1\n\nWelcome to the latest release of `furyctl` maintained by SIGHUP by ReeVo team.\n\nThis release includes a series of bug fixes and new features for the recently introduced Immutable kind and a fix for EKSCluster. It also adds support for SIGHUP Distribution v1.35.1.\n\n## New features \ud83c\udf1f\n\n- [[#696](https://github.com/sighupio/furyctl/pull/696)] Immutable: show a dynamic table for the nodes provisioning phase instead of single line logs, so the user does not need to mentally track the status of the nodes.\n- [[#710](https://github.com/sighupio/furyctl/pull/710)] Immutable: add support for `furyctl dump template` command.\n- [[#725](https://github.com/sighupio/furyctl/pull/725)] Immutable: validate nodes have one and only one role and that all nodes are managed by furyctl.\n- [[#736](https://github.com/sighupio/furyctl/pull/736)] EKSCluster: furyctl now patches distribution v1.35.0 to include the fix from [distribution/#580](https://github.com/sighupio/distribution/pull/580).\n\n## Bug fixes \ud83d\udc1e\n\n- [[#695](https://github.com/sighupio/furyctl/pull/695)] Immutable: fixed a panic that may occur if the user pressed ENTER to while waiting the nodes to be provisioned and a node sent a status update in the 5 seconds shutdown window.\n- [[#697](https://github.com/sighupio/furyctl/pull/697)] EKSCluster: `openvpn` is now validated as a dependency whenever a VPN is configured (not only with `--vpn-auto-connect`), failing fast with a clear error instead of a silent furyagent retry loop; `--vpn-auto-connect` without a configured VPN is now rejected up front.\n- [[#728](https://github.com/sighupio/furyctl/pull/728)] Immutable: sysext packages that pin a `sha256` in the manifest are now verified against it right after download; packages without a pin keep the previous behaviour.\n- [[#730](https://github.com/sighupio/furyctl/pull/730)] Immutable: `diff` command does not fail any more when no phase (`-p | --phase`) is specified.\n- [[#732](https://github.com/sighupio/furyctl/pull/732)] Immutable: fixed `furyctl renew certificates` that was failing while rendering the cluster inventory file.\n\n## Breaking Changes \ud83d\udc94\n\nNone\n\n\n"}
