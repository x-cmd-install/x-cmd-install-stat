inux)\n```bash\nbrew tap benbjohnson/litestream\nbrew install litestream\n```\n\n### Debian/Ubuntu\nDownload the `.deb` file for your architecture and install:\n```bash\nsudo dpkg -i litestream-*.deb\n```\n\n### RPM-based systems\nDownload the `.rpm` file for your architecture and install:\n```bash\nsudo rpm -i litestream-*.rpm\n```\n\n### Binary installation\nDownload the appropriate archive for your platform, extract, and move to your PATH.\n\n## VFS Extension (Experimental)\n\nSQLite loadable extensions for read-only access to Litestream replicas are available for supported platforms:\n\n| Platform | File |\n|----------|------|\n| Linux x86_64 | `litestream-vfs-v0.5.18-linux-amd64.tar.gz` |\n| Linux ARM64 | `litestream-vfs-v0.5.18-linux-arm64.tar.gz` |\n| macOS Intel | `litestream-vfs-v0.5.18-darwin-amd64.tar.gz` |\n| macOS Apple Silicon | `litestream-vfs-v0.5.18-darwin-arm64.tar.gz` |\n\nInstall via package managers:\n```bash\npip install litestream-vfs    # Python\nnpm install litestream-vfs    # Node.js\ngem install litestream-vfs    # Ruby\n```\n\n## Changelog\n* daf7646a3760f3df5de6099586fff4ea76609888 [metrics] expose replica validation results (#1535)\n* 3b911591668be6dcf39c0ae70d828d65a1453b27 chore(deps): bump grpc to v1.83.1 (#1533)\n* b052aadc9f3cddcf33e08147ab2438e90e862f31 chore(deps): bump otel to v1.45.0 for govulncheck (#1553)\n* 4ed7a308f6271ebfd2b0a6e4b70b03011a37e4a3 chore(deps): bump x/crypto for govulncheck (#1496)\n* 3569ce09249944e8ade104d391effe4d1587cb5b chore(deps): bump x/crypto to v0.56.0 for govulncheck (#1507)\n* 6a71ccd9ad2bea0c4dc19bc274a8dc64c9b0fafa docs(contributing): give the soak command a timeout it can pass under (#1517)\n* e393ab4fbaa67ad33e5c7e739144c507ddf9227a feat(s3): add Neon Object Storage provider auto-detection (#1582)\n* ffd4feaf68bcb839ff636282913ff7d748e47169 fix(abs): read the endpoint from a replica URL (#1566)\n* 53fc7d679e8cc5a81597a6d57fcda53f7a8c5e16 fix(abs): tolerate a download without Content-Length (#1565)\n* 25b569f13e902801f554c1f9ea2c7407e7e6ed88 fix(ci): build MinIO test image from upstream source (#1554)\n* e8128fd1a7069f10c3cbe9f38b6750f53b8e7893 fix(ci): pass -replica-clients to the integration test jobs (#1575)\n* 9fae1350700bca063bb31fbb5699266815947bc1 fix(ci): pin MinIO server and client images on Quay (#1526)\n* 7766bf1cda1f1fa3e9d4d4fffe928270b374ab2c fix(ci): retain nightly failure details with null step conclusions (#1583)\n* 79540333b833799f2ad15ad6c914b47d4ddae50a fix(ci): write MinIO build cache only from main (#1556)\n* 0ba305013391fc3d0f6e0d0025f866154a6302f5 fix(config): reject snapshot retention shorter than interval (#1471)\n* eedda9f0f14712d41084982d1de3669190ccc61e fix(db): cache LTX pages for checkpoint verification (#1584)\n* f282d0ef6815570235ca09ecbb53e81568acc5e7 fix(db): keep read lock alive after caller context is cancelled (#1579)\n* 6620cc3c36ab1806b3bacfeb452254484e2ab338 fix(db): read the whole WAL when the last-page check fails (#1547)\n* 9b378766de99ffff54fe13f37b3c4b49ec1d9676 fix(deps): bump Go toolchain to 1.26.10 for GO-2026-6809 (#1598)\n* 56a5617e5778248704751dbccc1863cb51dfd95c fix(deps): bump x/net and Go toolchain for govulncheck (#1573)\n* 59ba89e9f9499c0f7de4366af4b82216194525ed fix(dir-watch): detect a database recreated after a failed close (#1597)\n* e5de39cd11dce7262a5c11d6150ffb0d43f9d86f fix(gs): abort uploads when source reader fails (#1480)\n* bc91f744a4f5271381a8d53c102121a4232845e5 fix(gs): preserve authentication after init (#1602)\n* 93ba3cd76804d767095fc64475b4d1786b39d6a7 fix(internal): skip directory sync on Windows (#1548)\n* 5acb9ddb14941d6ac0e6f5179d5401f5fd49f978 fix(metrics): delete per-database series on close (#1571)\n* 61c06f806260aaa44897f8f0add13138e439f7cb fix(packaging): omit Homebrew sample config (#1413)\n* c3085f174b02b47cecf9dee3f4fc7cc37ca243c7 fix(python): use version-independent wheel tags (#1519)\n* 716acc52ee804b2b198309d126f1315fae3c94b7 fix(replica): bound each LTX stream read so a silent connection cannot hang a restore (#1528)\n* 24ead772b436b6d8b3746300484a8e1ca8be97d1 fix(replica): honor LTX file seek contract (#1461)\n* 899a804f180104736f16034ed41c34ad4e83e7bc fix(replica): reconcile resumable reader recovery (#1500)\n* 1be2782b642111afbb9fb06d6ea10a211e6a0b84 fix(replica): wrap ctx error on cancelled reopen (#1504)\n* 9f3af35a71e0763815cdf6ad2d3667aea41f9f75 fix(replicate): bound shutdown when SFTP stalls (#1590)\n* 0eee9c64c9c368d854e685a4eb6b49c1c4fc0788 fix(restore): accept checksum-tracked LTX (#1470)\n* 065b32a49e2ace330a7f90dac0bf1acc77b7262f fix(restore): deprecate ineffective parallelism flag (#1588)\n* 057d39564c75ebd67ba042410a7ffa05ad4c242d fix(restore): replan after replica files disappear (#1585)\n* fb9c163bb2dc877a1b121bff20f9e4bdeeebec96 fix(restore): resume follow mode when saved TXID is ahead of latest s… (#1385)\n* 10681452fcc8d582993057fc98d83afec9637c90 fix(s3): add opt-in PutObject checksums (#1610)\n* 9a4ffed3ec67ed1ff690f736b90d7928c27bb224 fix(s3): detect providers with endpoint ports (#1525)\n* 3cd52a2b04b78ed770af73462fc6044d1034e6f7 fix(s3): retry throttling with bounded backoff (#1609)\n* d114c6a1e85e36e3fc34031a6d23d011cda065dd fix(server): cancel abandoned sync requests (#1589)\n* fac80924d33fc82957dc7a4c4c42f5530e0a6a34 fix(sftp): fsync LTX files before renaming them into place (#1574)\n* 703a7aa93356b7bc64854a7b8b5fdb8818560e1c fix(store): skip idle compaction without listing the replica (#1564)\n* d42408d51059b2a3f438daab08583d199488f524 fix(store): stop monitors before closing databases (#1530)\n* 2cad11abcc7d1039680e26ff5e0e6b2c17c81e5d fix(vfs): discard stale replica poll results (#1595)\n* fd72802bc885fb535152f9a899ab6ce274d47ed3 fix(vfs): fix litestream_time() to update with new LTX files (#1455)\n* beb4a494fc988b1d16ec51b99dbec85a05159721 fix(vfs): recover straddling L1 polls (#1478)\n* 2a2689bc71784b68c69560bc793dea14af70b0d5 fix(vfs): return SQLITE_OK from the auto-extension for non-VFS connections (#1506)\n* bcf029e7f22a6c7c027d13c1bcd05b252cd6b53d fix(vfs): scope synced TXIDs to each replica (#1549)\n* bd4a2eb872ae8bf4cbef13dc9b087bc3f18466be fix(webdav): read LTX header timestamps for timestamp-based restore (#1576)\n* 88de494bb19c2b9851efdb9efe7352d33aa5860e fix: log context errors from replica clients while monitors are running (#1572)\n* b088b575ac7c957fb4f0b9af4c0c1e824109322e fix: prevent metric counter panics on clock regressions (#1494)\n* d8b24e85b641e913e9076bf8dc7cc1443f1252c8 perf(restore): open every restore-plan file concurrently (#1568)\n* 4b39bea65facbe704ec60f0d23796eec087ae1da test(cli): drain usage capture pipe (#1557)\n* c2ea2b2e4a96f0e97e869fe3b244bf0e7463095f test(db): stabilize delayed checkpoint (#1498)\n* 51417c6fd654981f8fed4c56dc96e3f4dc4a0cf9 test(integration): give load deadline headroom (#1505)\n* 8e0e270731b033dc758f2343e693a22c6494d803 test(store): wait for initial replication (#1596)\n* a2c5808dee2484d0c54c01c9e0d0cde5383a03c5 test(vfs): make load checks CPU independent (#1594)\n* 077db77ea83b2b72468d270b1e11a24e74ed03b9 test(vfs): synchronize active reader polling (#1593)\n\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
