ew (macOS and Linux)\n```bash\nbrew tap benbjohnson/litestream\nbrew install litestream\n```\n\n### Debian/Ubuntu\nDownload the `.deb` file for your architecture and install:\n```bash\nsudo dpkg -i litestream-*.deb\n```\n\n### RPM-based systems\nDownload the `.rpm` file for your architecture and install:\n```bash\nsudo rpm -i litestream-*.rpm\n```\n\n### Binary installation\nDownload the appropriate archive for your platform, extract, and move to your PATH.\n\n## VFS Extension (Experimental)\n\nSQLite loadable extensions for read-only access to Litestream replicas are available for supported platforms:\n\n| Platform | File |\n|----------|------|\n| Linux x86_64 | `litestream-vfs-v0.5.17-linux-amd64.tar.gz` |\n| Linux ARM64 | `litestream-vfs-v0.5.17-linux-arm64.tar.gz` |\n| macOS Intel | `litestream-vfs-v0.5.17-darwin-amd64.tar.gz` |\n| macOS Apple Silicon | `litestream-vfs-v0.5.17-darwin-arm64.tar.gz` |\n\nInstall via package managers:\n```bash\npip install litestream-vfs    # Python\nnpm install litestream-vfs    # Node.js\ngem install litestream-vfs    # Ruby\n```\n\n## Changelog\n* 102d2dd6291c3725dc3ba1d0339a72c3aeb2ed99 Log the resolved repica type when unknown (#1466)\n* 923d7c16de6cd4fbe7c143aeeba735c235268dce chore(deps): bump Go toolchain to 1.25.13 (#1434)\n* 3b468c9fe335d7bae033ba54eaac7f7df339d9df chore(deps): bump Go toolchain to 1.25.14 (#1476)\n* 69e918dc523bf67e8c0c631cb37dbe3c6287ccc0 config: reject duplicate dbs[].path at load (#1452)\n* ec542d57f4283c66f0118c97b5ae0f05b6919873 docs(readme): document internal lock table (#1438)\n* 534d8fbca5842262349ed51d92d3be9f503c5c58 docs(retention): explain snapshot floor (#1437)\n* 25ac743d2f559ac9efa3dae5b501cf79e553801d feat(vfs): thread-safe config registry for per-database VFS configuration (#1157)\n* 0c961ff1265bac8eb48398a5ebd99caa1e3b4010 fix(ci): always report test summary (#1474)\n* 63225f17ccbb8dedfb26d03f7d3d07e74c6cf69f fix(config): accept l0-retention: 0 as disabled (#1425)\n* 62297c3fe603310961e3ad71fe4c1c1cef483b81 fix(deps): remove release-blocking SQLite WAL-reset corruption exposure (#1436)\n* 8ff85b11bed8af66dc4eb23c765e46142ff14283 fix(logging): downgrade replica sync messages from INFO to DEBUG (#1207)\n* 0cce014a9a33905fb84de92e61bf51c65c0b87d1 fix(replica): return an error for a truncated page index (#1431)\n* 4250ef2e682d3547f6a4396d6f506126bac4a5c2 fix(restore): correctly restore v3 wal segments that exceed 4GB (#1442)\n* 97d2dfa513a37dd6ac0e1521962a88d479be5e07 fix(restore): retry through provider throttle responses (#1433)\n* a89a7c87e5486e3a5fb8d2877333602a9a989449 fix(restore): sort v3 WAL offsets safely (#1448)\n* ccd326c175b583b5e82893a6078f06dcef5fba3f fix(s3): allow disabling accept encoding signing (#1439)\n* ad10a1df7104639bdb95fca93f1750ad301e563e fix(s3): tune Tigris multipart upload defaults (#1482)\n\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
