xvC","name":"libsodium-1.0.22.tar.bz2.minisig","label":null,"uploader":{"login":"jedisct1","id":124872,"node_id":"MDQ6VXNlcjEyNDg3Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":319,"digest":"sha256:0bc2622a58ceea2d079c5fcc6a6e6d22bcad8c911a36b77a70354000711ab412","download_count":56,"created_at":"2026-04-10T10:03:47Z","updated_at":"2026-04-10T10:03:47Z"},{"id":393157580,"node_id":"RA_kwDOAHWnt84XbxvM","name":"libsodium-1.0.22.tar.gz","label":null,"uploader":{"login":"jedisct1","id":124872,"node_id":"MDQ6VXNlcjEyNDg3Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gzip","state":"uploaded","size":2008529,"digest":"sha256:adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349","download_count":67774,"created_at":"2026-04-10T10:03:47Z","updated_at":"2026-04-10T10:03:48Z"},{"id":393157583,"node_id":"RA_kwDOAHWnt84XbxvP","name":"libsodium-1.0.22.tar.gz.minisig","label":null,"uploader":{"login":"jedisct1","id":124872,"node_id":"MDQ6VXNlcjEyNDg3Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":318,"digest":"sha256:c0186d6cf8c9c2ec5c6dbb6d4ff4f701e5592376490e8ad97a4ceeecabbff0f3","download_count":238,"created_at":"2026-04-10T10:03:48Z","updated_at":"2026-04-10T10:03:48Z"},{"id":393157584,"node_id":"RA_kwDOAHWnt84XbxvQ","name":"libsodium-1.0.22.tar.gz.sig","label":null,"uploader":{"login":"jedisct1","id":124872,"node_id":"MDQ6VXNlcjEyNDg3Mg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":594,"digest":"sha256:350191b0a5545158716e0e52f249c1511e203972edd61a7a2fec3d03653ea8a7","download_count":75,"created_at":"2026-04-10T10:03:48Z","updated_at":"2026-04-10T10:03:48Z"}],"body":"## Version 1.0.22\r\n\r\n  This point release includes all the changes from 1.0.21-stable, plus:\r\n - Post-quantum key encapsulation is now available. ML-KEM768, the\r\nNIST-standardized lattice-based KEM, is accessible through the\r\n`crypto_kem_mlkem768_*()` functions.\r\n - X-Wing, a hybrid KEM combining ML-KEM768 with X25519 for protection\r\nagainst both classical and quantum adversaries, is available through the\r\n`crypto_kem_*()` functions. X-Wing is the recommended KEM for most\r\napplications.\r\n - SHA-3 hash functions are now available as `crypto_hash_sha3256_*()`\r\nand `crypto_hash_sha3512_*()`, with both one-shot and streaming APIs.\r\n\r\n## Version 1.0.21-stable\r\n\r\n - Performance: NEON optimizations for Argon2 on ARM platforms.\r\n - Performance: SHA3 (Keccak1600) now leverages ARM SHA3 instructions when\r\navailable on ARM platforms.\r\n - Performance: WebAssembly SIMD implementations of Argon2 have been added.\r\n - Emscripten: LTO is now disabled. With Emscripten 4, LTO produced\r\nWebAssembly modules with functions that ran significantly slower than\r\nwithout it.\r\n - Emscripten: a new option allows compilation with SIMD support.\r\n - Emscripten: native ESM module generation is now supported.\r\n - JavaScript sumo builds now allow up to 80 MiB memory usage, so that\r\n`crypto_pwhash` with the interactive settings can be used in pure\r\nJavaScript, not just WebAssembly.\r\n - XOF state alignment has been relaxed.\r\n - `crypto_core_keccak1600_state` has been added.\r\n - Export missing `crypto_ipcrypt_nd_keygen()` helper function.\r\n - `crypto_auth_hmacsha256_init` and `crypto_auth_hmacsha512_init` now\r\naccept NULL key pointers (with a zero key length), for consistency with\r\nother `_init` functions.\r\n - apple-xcframework: headers are now in a Clibsodium subdirectory\r\nto prevent module.modulemap collisions with other xcframeworks.\r\n - Fixed compilation with GCC on aarch64 and gcc 4.x.\r\n - On aarch64, aes256-gcm is now enabled even when not using clang,\r\nincluding MSVC.\r\n - Added compatibility with Visual Studio 2026 when toolsets do not\r\ndefine PlatformToolsetVersion.\r\n - Libsodium can be directly used as a dependency in a Zig project.\r\n - Performance of MSVC builds has been improved.","reactions":{"total_count":16,"+1":6,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":10,"rocket":0,"eyes":0}}
