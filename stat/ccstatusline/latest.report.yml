 Timer widgets by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/768\n* fix(usage): drop the 5-hour forecast once the block is at its limit by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/766\n* feat(terminal): take the width from Claude Code's COLUMNS and remove the Terminal Width options by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/765\n* feat(cache-timer): add a short time toggle and drop the clock notation by @ddelange in https://github.com/sirmalloc/ccstatusline/pull/592\n* feat: support CCSTATUSLINE_CONTEXT_WINDOW_SIZE env override by @lmello in https://github.com/sirmalloc/ccstatusline/pull/352\n* fix: use env override and settings for usable context ratio calculation by @ErnestHysa in https://github.com/sirmalloc/ccstatusline/pull/407\n* fix(output): keep Nerd Font icons two cells wide in Ghostty and kitty by @aliassar in https://github.com/sirmalloc/ccstatusline/pull/801\n* feat(widgets): add Zed as an IDE link mode by @AllenReder in https://github.com/sirmalloc/ccstatusline/pull/800\n* chore(deps-dev): bump the dev-dependencies group with 3 updates by @dependabot[bot] in https://github.com/sirmalloc/ccstatusline/pull/795\n* feat(context-bar): add a thin line display mode by @Yongzhaooo in https://github.com/sirmalloc/ccstatusline/pull/794\n* fix(reset-timer): show the block's reset time in timestamp mode by @effectustasi in https://github.com/sirmalloc/ccstatusline/pull/792\n* fix(git): preserve grapheme clusters in fish-style abbreviations by @wozhenbang2004 in https://github.com/sirmalloc/ccstatusline/pull/790\n* fix(tui): put the space back in the delete-line confirmation heading by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/787\n* test(tui): wait for each key's effect in the line and color editor tests by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/788\n* fix(separators): clear colors a new Color Level can't show, and invert left glyphs entered by hex by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/786\n* fix(tui): show the whole value when text goes in at the start of the Custom Command and Link editors by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/785\n* fix(tui): keep the Main Menu highlight on Ctrl+S and draw the preview at the configured Color Level by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/784\n* fix(cache): stop the terminal width and custom command caches leaking temp files by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/783\n* fix: reset timer locales at UTC, Gregorian dates, es-ES AM/PM, and two picker fixes by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/782\n* fix: hide tput charset escapes, recognize colon-form colors, print tabs as one space by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/781\n* fix(tui): Escape in Import Preview, and menus that forget their row after a sub-screen by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/780\n* fix(config): don't migrate a version-less settings.json with later settings as v1 by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/779\n* feat(tui): pick 256-color colors from a grid in Edit Colors by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/778\n* fix(git-review): key the render's PR cache by the branch's own name by @effectustasi in https://github.com/sirmalloc/ccstatusline/pull/791\n* fix(powerline): keep the Custom theme when Powerline is enabled again by @effectustasi in https://github.com/sirmalloc/ccstatusline/pull/793\n* refactor(widgets): consolidate the progress-bar widgets' duplicated code by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/810\n* refactor: small cleanups to the font install, auto-align loop, GUID and root dir widgets by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/809\n* fix: keep emoji whole in two text editors and in TUI rows, and align wide padding by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/808\n* fix: open Configure Status Line before an install, and sync hooks only from the config the status line loads by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/807\n* fix(update): Check for Updates deadline, proxy, self-managed version and re-check by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/806\n* fix(git-remote): link plain-HTTP remotes over http by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/802\n* fix(cwd): fish style keeps emoji and UNC roots, and (s)egments applies in fish mode by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/803\n* fix(install): find programs on PATH without which, and count a symlinked PATH dir once by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/804\n* fix: report Uninstall and Refresh Interval failures when Claude's settings.json can't be changed by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/805\n* feat: add an Extra Usage Today widget by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/811\n* feat(thinking-effort): optional brackets and per-level colors by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/777\n* fix(usage): show a newer usage API percent in a session left idle by @eric-engberg in https://github.com/sirmalloc/ccstatusline/pull/767\n\n## New Contributors\n* @lmello made their first contribution in https://github.com/sirmalloc/ccstatusline/pull/352\n* @ErnestHysa made their first contribution in https://github.com/sirmalloc/ccstatusline/pull/407\n* @aliassar made their first contribution in https://github.com/sirmalloc/ccstatusline/pull/801\n* @AllenReder made their first contribution in https://github.com/sirmalloc/ccstatusline/pull/800\n* @Yongzhaooo made their first contribution in https://github.com/sirmalloc/ccstatusline/pull/794\n\n**Full Changelog**: https://github.com/sirmalloc/cc