loaded","size":1836,"digest":"sha256:a34cd39482f352a7c545f691d950fd1095f9ce90b81dbe29ee401c09d8ec8d24","download_count":0,"created_at":"2026-10-08T02:42:26Z","updated_at":"2026-10-08T02:42:26Z"},{"id":620512581,"node_id":"RA_kwDOFWxNYc4k_EVF","name":"validation-evidence-v53.5.0.zip","label":"","uploader":{"login":"corest","id":1071648,"node_id":"MDQ6VXNlcjEwNzE2NDg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":759307,"digest":"sha256:f8c90182b3e2aac602d2e9bd7421ae85e09787a3dbd445606fb8b36a8e85266e","download_count":0,"created_at":"2026-10-08T02:42:27Z","updated_at":"2026-10-08T02:42:27Z"},{"id":619051416,"node_id":"RA_kwDOFWxNYc4k5fmY","name":"version.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":8,"digest":"sha256:b323dc7b2456b7ca23842e20fcf67cb6d8861fa640a680949ea8b36e4e36137f","download_count":23,"created_at":"2026-10-07T15:24:25Z","updated_at":"2026-10-07T15:24:25Z"}],"body":"# Kubeshark release v53.5.0 (10-07-2026)\n\n## Release Highlights\n\n> **Breaking change for installs that set `demoModeEnabled`.** The chart value is gone. API gating\n> is now decided by `tap.auth.enabled` alone, and what an unauthenticated visitor may do is decided\n> by `tap.auth.defaultRole` (chart default `kubeshark-admin`). Previously one switch answered three\n> unrelated questions \u2014 whether the Hub gates its API, whether the dashboard must log in to fetch a\n> licence key, and which product features exist \u2014 so a default install rendered `AUTH_ENABLED=true`\n> purely to make the cloud login reachable. Anyone setting `demoModeEnabled` must move to\n> `tap.auth.defaultRole` before upgrading.\n\nKubeshark 53.5.0 finishes separating **authentication from licensing and from feature gating**, the\nlast piece of the permissions work that 53.3.0 began and 53.4.0 carried. Beyond that it is a\nreliability release for **long-running capture**: a stalled snapshot download can no longer keep raw\ncapture paused, the capture DB no longer accumulates pcap for flows that never produce an entry and\nnow reports its own size, UI streams get bounded headroom for short writer pauses, and a fan-out bug\nthat silently stopped delivery to every connection after the first filter miss is fixed. Snapshot\nstorage gains **S3-compatible endpoints** and the **GCS provider is back**.\n\n## New Features\n\n- **S3-compatible snapshot storage** \u2014 snapshot storage accepts a custom endpoint and path-style\n  addressing, so MinIO, StorageGRID and other S3-compatible backends work without pretending to be\n  AWS. An unparseable `SNAPSHOT_AWS_FORCE_PATH_STYLE` is now rejected at startup rather than\n  silently treated as false, and the chart exposes both options\n- **GCS snapshot storage restored** \u2014 the Google Cloud Storage snapshot provider is available again\n- **Prometheus Operator ServiceMonitor** \u2014 opt-in `ServiceMonitor` for Hub metrics, off by default\n- **Extra objects in the chart** \u2014 `tap.extraObjects` renders arbitrary additional manifests with\n  the release, for resources that have to be installed alongside Kubeshark\n- **Capture DB size metrics** \u2014 the worker exposes capture DB size on `:49100/metrics`, so growth\n  against the configured limit is visible instead of inferred\n- **eBPF hooks split into best-effort and optional** \u2014 the tracer distinguishes hooks that may fail\n  without degrading capture from those that must attach, which is what makes a partially supported\n  kernel report accurately rather than failing wholesale\n\n## Improvements\n\n- **Bounded UI stream headroom** \u2014 UI streams tolerate short writer pauses instead of dropping, with\n  stream writer time and queue pressure now profiled\n- **Go 1.27** \u2014 the Hub builds on Go 1.27\n- **Rate-limited prune visibility** \u2014 the capture DB prune reports what it is doing at a level the\n  worker actually logs, so a DB growing against its limit is diagnosable from the worker's own output\n- **Numeric semantic version comparison** \u2014 the CLI compares versions numerically rather than\n  lexically, so 53.10.0 is no longer considered older than 53.9.0\n- **Recreate strategy for a local-snapshots Hub** \u2014 when `tap.snapshots.local.storageClass` is set,\n  the Hub Deployment switches to `Recreate`. With the default `RollingUpdate` an upgrade deadlocked\n  on the ReadWriteOnce snapshots PVC, which the new pod could not attach while the old pod held it,\n  and Helm reported success anyway\n\n## Bug Fixes\n\n- **A stalled snapshot download kept raw capture paused** \u2014 snapshot download writes are now\n  bounded and the tar producer is released whenever the download stream ends early, so a client that\n  stops reading no longer leaves raw capture paused indefinitely\n- **Pcap written for flows that never emitted an entry** \u2014 pcap chunks and the base entry share a\n  key range, but only the base entry writes the time index the prune walks, and the two were gated\n  differently. The capture DB therefore accumulated chunks the prune could never reclaim\n- **Fan-out stopped after the first filter miss** \u2014 `WriteEventToConns` used a bare return on a\n  filter miss or a `kfl.Apply` error, ending delivery for every connection later in map iteration\n  order. Randomised iteration made it present as intermittent missing traffic\n- **Free-tier capabilities lost on the unlicensed pass-through** \u2014 capabilities are restored on the\n  unlicensed free-tier path\n- **403 request loops on licence denial** \u2014 two frontend polls kept firing after the Hub began\n  returning 403, filling the console and hammering the Hub\n- **Licence-issue dialog trapped the UI** \u2014 the dialog is dismissible and Settings stays usable\n  during a licence error, so a licence problem no longer blocks the one screen that can fix it\n- **Demo restrictions driven by capabilities** \u2014 the dashboard separates the Descope session from API\n  gating, rather than inferring both from one flag\n\n## Infrastructure & Dependencies\n\n- **golang.org/x/crypto to v0.55.0** (CVE-2026-56854) \u2014 an indirect dependency, and the flaw is in\n  `x/crypto/ssh` which the Hub does not use, so this cleared a build gate rather than a runtime\n  exposure\n- **api2 and the tracer submodule realigned to master HEAD** in the worker\n- **CI runner disk freed before the image build** in the Hub, after the arm64 race-build cell\n  exhausted the runner's disk and silently froze every multi-arch tag\n- **Slack invite refreshed** in the contributing guide\n\n## Validation\n\nTested version: 53.5.0. Result: **pass**. Every required scenario ran against the published chart\nand images, every case passed, and every performance comparison held. The one remaining gap carries\nan unexpired waiver.\n\n- Functional \u2014 **pass**, 7/7 scenarios:\n  [run 37663621541](https://github.com/kubeshark/perfshark/actions/runs/37663621541).\n- Performance \u2014 **pass**, 10/10 scenarios with every baseline comparison passing:\n  [run 37678360561](https://github.com/kubeshark/perfshark/actions/runs/37678360561).\n- Two-hour soak \u2014 **pass**, comparison passing:\n  [run 37704720398](https://github.com/kubeshark/perfshark/actions/runs/37704720398).\n- [Full validation report](https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/release-report.html),\n  with the machine-readable\n  [release-report.json](https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/release-report.json)\n  and the downloaded results in\n  [validation-evidence-v53.5.0.zip](https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/validation-evidence-v53.5.0.zip).\n- Exceptions: `POST /license/remove` is not machine-verified, because removing a licence needs a\n  Descope owner session token and refresh token that a throwaway CI cluster cannot obtain. Waived to\n  2026-12-04 and exercised by hand against a real tenant.\n\nAll three runs installed the published artifacts \u2014 chart 53.5.0 with Hub `0532936678f8`, worker\n`1f3e121224f8` and front `e0cd93ef4923` \u2014 confirmed from each report's provenance rather than from\nthe inputs the runs were given.\n\nSee [Benchmark Methodology](https://docs.kubeshark.com/en/benchmark_methodology) for the Hub\nstreaming benchmark setup, measurements and limitations. It covers the synthetic streaming\nbenchmark, not the functional suite.\n\n## Patches\n\n> Patches to this release will be listed here.\n\n## Download Kubeshark for your platform\n\n**Mac** (x86-64/Intel)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/kubeshark_darwin_amd64 && chmod 755 kubeshark\n```\n\n**Mac** (AArch64/Apple M1 silicon)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/kubeshark_darwin_arm64 && chmod 755 kubeshark\n```\n\n**Linux** (x86-64)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/kubeshark_linux_amd64 && chmod 755 kubeshark\n```\n\n**Linux** (AArch64)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/kubeshark_linux_arm64 && chmod 755 kubeshark\n```\n\n**Windows** (x86-64)\n```\ncurl -LO https://github.com/kubeshark/kubeshark/releases/download/v53.5.0/kubeshark.exe\n```\n\n### Checksums\nSHA256 checksums available for compiled binaries.\nRun `shasum -a 256 -c kubeshark_OS_ARCH.sha256` to verify.\n\n\n\n"}
