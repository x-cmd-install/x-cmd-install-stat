state":"uploaded","size":3473,"digest":"sha256:5a0243703a4da695fd8b94e7cbdb0594fbb860f02ca42266dcf8c319518387b2","download_count":2,"created_at":"2026-10-21T18:16:03Z","updated_at":"2026-10-21T18:16:03Z"},{"id":663386000,"node_id":"RA_kwDOFWxNYc4nineQ","name":"validation-evidence-v53.6.0.zip","label":"","uploader":{"login":"corest","id":1071648,"node_id":"MDQ6VXNlcjEwNzE2NDg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":524654,"digest":"sha256:edf1b011bb1e054e8dcd30e4b053ec014a1166dd6bab062fc4979c20e8db592d","download_count":4,"created_at":"2026-10-21T18:16:03Z","updated_at":"2026-10-21T18:16:03Z"},{"id":661822938,"node_id":"RA_kwDOFWxNYc4ncp3a","name":"version.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":8,"digest":"sha256:539e4c5b7226e8480a51cdd4207dcd7a8cd4e99ff5340238b5dc6daf2dde8cf8","download_count":41,"created_at":"2026-10-21T08:18:26Z","updated_at":"2026-10-21T08:18:26Z"}],"body":"# Kubeshark release v53.6.0 (10-21-2026)\n\n## Release Highlights\n\nCloud snapshots now work against S3-compatible stores signed by a private CA, a `trace` log level\nmakes authorization and snapshot failures diagnosable without a debugger, and three long-standing\nworker and Hub noise sources are gone.\n\n## New Features\n\n- **Skip TLS verification for the snapshot S3 endpoint** \u2014 `tap.snapshots.cloud.s3.insecureSkipVerify`\n  lets the Hub talk to an S3-compatible endpoint whose certificate is signed by a private CA, which\n  previously failed the startup bucket check and left cloud snapshots unavailable. It applies only\n  to the S3 endpoint, not to the STS call, and is off by default\n- **`trace` log level** \u2014 `logLevel: trace` is accepted by the Hub, the worker and the dissector.\n  Previously it fell through to the default and silently became `warning`, less output than asked\n  for. The Hub also passes its log level to the dissection jobs it spawns, which used to run at their\n  own default regardless\n- **Authorization and snapshot diagnostics** \u2014 every authorization denial (REST, MCP and\n  Connect-RPC) now logs the route, the required capability, the resolved role and the effective\n  capability set, and the OIDC pipeline logs discovery, the login round trip, token verification and\n  role resolution step by step. Snapshot creation records what was requested, what each worker\n  returned, and separates the three previously identical \"no PCAP files found\" causes. The\n  per-request narrative sits at `trace`; actionable outcomes are at `warn`\n\n## Improvements\n\n- **Raw capture retry reporting** \u2014 a worker that exhausts its raw capture retries is reported once\n  at error, naming the cause, instead of each retried attempt being reported and the exhaustion\n  itself going unlogged\n- **MCP `list_api_calls` honours `snapshot_id` and `dissection_id` on the GET endpoint** \u2014 a\n  snapshot query no longer falls through to the live worker stores and returns current traffic in\n  place of the snapshot's dissection results\n- **Benign stream ends are no longer errors** \u2014 a normally closed gRPC stream between Hub and\n  worker, or a client that disconnects from a read stream, is classified as a routine end rather\n  than reported as a fault, in all four stream paths\n- **Discarded base entries are counted** \u2014 the worker keeps a counter of dropped base entries and\n  logs the syscall reconnect at a level that reaches the pod logs\n\n## Bug Fixes\n\n- **Empty entries from the syscall dissector were stored and broadcast** \u2014 the syscall dissector\n  returned a base entry it never populated. The store rejected it, logging an error that blamed the\n  store, and the empty entry was still sent to live consumers. Such entries are now dropped before\n  they reach the store or the stream\n- **Tracer restart leaked a file descriptor in the worker** \u2014 the syscall event socket was never\n  closed before redialling after the tracer restarted, and the routine `EOF` on that socket was\n  logged as an error\n\n## Infrastructure & Dependencies\n\n- **Go 1.27.2** in the Hub image\n- **api2 realigned** in the Hub and the worker to the stream-end classifier\n- **tracer submodule** advanced to accept the `trace` log level\n\n## Validation\n\nTested version: 53.6.0. Result: **pass**. The functional suite, the performance suite and the\ntwo-hour soak all ran against the published chart and images, every case passed, and every\nperformance comparison held against its committed baseline. The one remaining gap carries an\nunexpired waiver.\n\n| Suite | Result | What it covers |\n| --- | --- | --- |\n| Functional | pass, 7/7 scenarios | Protocol dissection, KFL filters, raw L4 capture, snapshot export, TLS decryption, resilience and licence enforcement |\n| Performance | pass, 10/10 scenarios | Hub aggregation and delivery from Small to XL, scale-up and scale-down, steady-state stability, and snapshot cost under load |\n| Two-hour soak | pass | Sustained delivery over two hours, watching memory growth, goroutine drift and delivery loss |\n\nOver the soak window the Hub held 214Mi resident at 0.00 %/min growth with no restarts, delivering\n36.0M entries at 4,991 entries/s.\n\n**[Read the validation report](https://perfshark-data.s3.amazonaws.com/reports/releases/v53.6.0/release-report.html)** in\nyour browser. The same report is attached to this release for keeping:\n[release-report.html](https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/release-report.html),\n[release-report.json](https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/release-report.json)\nfor machines, and\n[validation-evidence-v53.6.0.zip](https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/validation-evidence-v53.6.0.zip)\nfor the underlying per-scenario results.\n\nExceptions: `POST /license/remove` is not machine-verified, because removing a licence needs a\nDescope owner session token and refresh token that a disposable test cluster cannot obtain. It is\nexercised by hand against a real tenant, and the waiver is recorded in the report with an expiry.\n\nTwo earlier functional runs of the same artifacts each failed one case and were re-run: one on\nPostgreSQL dissection and one on snapshot export modes, both short-burst capture cases in a\nfreshly created namespace, with clean component logs in the failing window. The suite passed in\nfull on the run reported here.\n\nAll three runs installed the artifacts published here \u2014 chart 53.6.0 with Hub `90486bf3b22d`,\nworker `3fc84ec4b50c` and front `7e5bb967176e` \u2014 confirmed from each report's recorded provenance\nrather than from the inputs the runs were given.\n\nMethod and limitations are documented in\n[Benchmark Methodology](https://docs.kubeshark.com/en/benchmark_methodology) and the\n[Hub streaming benchmarks](https://docs.kubeshark.com/en/performance_benchmark). The streaming\nbenchmark measures Hub aggregation and delivery of prepared entries; it does not measure worker\npacket capture, TLS decryption, L7 dissection or browser rendering, which the functional suite\ncovers separately.\n\n## Patches\n\n> Patches to this release will be listed here.\n\n## Download Kubeshark for your platform\n\n**Mac** (x86-64/Intel)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/kubeshark_darwin_amd64 && chmod 755 kubeshark\n```\n\n**Mac** (AArch64/Apple M1 silicon)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/kubeshark_darwin_arm64 && chmod 755 kubeshark\n```\n\n**Linux** (x86-64)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/kubeshark_linux_amd64 && chmod 755 kubeshark\n```\n\n**Linux** (AArch64)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/kubeshark_linux_arm64 && chmod 755 kubeshark\n```\n\n**Windows** (x86-64)\n```\ncurl -LO https://github.com/kubeshark/kubeshark/releases/download/v53.6.0/kubeshark.exe\n```\n\n### Checksums\nSHA256 checksums available for compiled binaries.\nRun `shasum -a 256 -c kubeshark_OS_ARCH.sha256` to verify.\n"}
