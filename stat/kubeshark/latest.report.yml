ot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":88,"digest":"sha256:b9ca75b6c9fd009f27f6b88c196e7c4a5ced46f8cc046fbd9fc5247b3ff0fd34","download_count":5,"created_at":"2026-08-13T20:09:33Z","updated_at":"2026-08-13T20:09:34Z"},{"id":513459556,"node_id":"RA_kwDOFWxNYc4emsVk","name":"README.md","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":993,"digest":"sha256:8461190ae3c00001b7ff297be0da33445ae5daf2d383d0f2fec5e05c7979cc0b","download_count":3,"created_at":"2026-08-13T20:10:06Z","updated_at":"2026-08-13T20:10:07Z"},{"id":513459220,"node_id":"RA_kwDOFWxNYc4emsQU","name":"version.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":8,"digest":"sha256:37a97f59bf496ac7478aac9b0c2de25e6e736a6a9a6b365ea9c9660765d14851","download_count":874,"created_at":"2026-08-13T20:09:33Z","updated_at":"2026-08-13T20:09:33Z"}],"body":"# Kubeshark release v53.4.0 (08-13-2026)\n\n## Release Highlights\n\n> **Breaking change for SSO users.** The permissions refactor replaces the per-role action-flag\n> schema. The `AUTH_ROLES` env and flags such as `canDownloadPCAP` and `scriptingPermissions` are\n> gone, replaced by `tap.auth.roles` (a closed `capabilities` vocabulary plus a `namespaces` scope),\n> `tap.auth.groupMapping`, `tap.auth.rolesClaim` and `tap.auth.defaultRole` (chart default\n> `kubeshark-viewer`). Role names beginning with `kubeshark-` are reserved. Existing `tap.auth.*`\n> values must be migrated before upgrading.\n\nKubeshark 53.4.0 completes the **gated-Hub authentication** initiative end to end: the Hub now\nenforces authentication on its APIs, and the CLI, Helm chart, worker and tracer all present a real\ncredential to it. It lands the **unified permissions model** (capabilities and features, roles and\nSSO group mapping, capability-gated UI) begun in 53.3.0, and it patches **two MCP input-handling\nvulnerabilities**. Alongside that, this release is heavily weighted toward **high-throughput live\ncapture**: batched UI streaming, cached resolver history that removes an OOM, conditional GETs on\nworker and tracer hub fetches, parallelized snapshot collection, and visible reporting of dropped\ntraffic instead of silent loss.\n\n## Security\n\n- **MCP `start_kubeshark` argument injection (high)** \u2014 a caller-supplied `pod_regex` could be\n  parsed as a flag rather than as the positional pod regex, allowing deployment arguments to be\n  redirected, including the image registry. The regex is now appended after a literal `--`\n  end-of-options separator so cobra always treats it as positional. Affects `>= 53.1.0, < 53.4.0`.\n  [GHSA-8vf2-hxg5-crqh](https://github.com/kubeshark/kubeshark/security/advisories/GHSA-8vf2-hxg5-crqh)\n  (CVSS 7.2, CWE-88)\n- **MCP `download_file` unvalidated destination (medium)** \u2014 the caller-supplied `dest` is now\n  resolved through `secureDownloadDest` and confined to a base directory (the working directory by\n  default, relocatable with `KUBESHARK_MCP_DOWNLOAD_DIR`); a `dest` resolving outside the base is\n  rejected, and Hub API `path` values containing `..` segments are refused. Affects\n  `>= 53.1.0, < 53.4.0`.\n  [GHSA-gj7r-p794-hhq5](https://github.com/kubeshark/kubeshark/security/advisories/GHSA-gj7r-p794-hhq5)\n  (CVSS 5.3, CWE-22)\n- **Build-cache credential leakage** \u2014 the worker build cache no longer carries credentials or\n  private source, and the front build cache no longer carries the Sentry auth token or sourcemaps.\n  Both caches moved to private ECR rather than public Docker Hub\n- **CodeQL analysis** added to the CLI repository\n- **cilium bumped to v1.17.14** (CVE-2026-49445) in the hub\n\nBoth MCP issues were reported by **novice-22** (Urim) via private coordinated disclosure. Thanks.\n\n## New Features\n\n- **Gated Hub authentication** \u2014 the Hub enforces authentication on its APIs via an `internalauth`\n  gate. The CLI mints a short-lived `kubeshark-cli` ServiceAccount token through the kube\n  TokenRequest API (audience `kubeshark-hub`) and presents it as `X-Kubeshark-Authorization`, with\n  authorization bounded by Kubernetes RBAC over who may create that token. It falls back to the\n  existing `License-Key` where minting is not possible, and to anonymous when `AUTH_ENABLED` is off\n- **Worker and tracer credentials** \u2014 the worker DaemonSet projects a `kubeshark-hub`-audience\n  ServiceAccount token onto both the sniffer and tracer containers, so `/resolver/history` and\n  `/pods/{targeted,all}` keep working against a gated Hub instead of returning 401 and rendering\n  all traffic as unresolved\n- **MCP token lifecycle** \u2014 proxy mode re-mints the Hub token before expiry (5m margin, 30s failure\n  throttle), so a long-running `kubeshark mcp` no longer silently 401s at the token TTL. Headless\n  `--url` mode takes an explicit `--token` / `KUBESHARK_HUB_TOKEN` and reports a clear\n  \"token expired or invalid\" message on 401 rather than an opaque API error\n- **Unified permissions model** \u2014 hub-side capabilities and features model, chart-side\n  `tap.auth.roles` with a closed capability vocabulary and namespace globbing, and a\n  capability-gated frontend with a new **Identity & Access** modal\n- **CLI access control** \u2014 `tap.auth.cli.enabled` with a `subjects` allowlist controls who may use\n  the CLI against a gated Hub, backed by a `kubeshark-cli` ServiceAccount and token-minter Role\n- **L7 data boundaries in the history picker** \u2014 `HistoryRangePicker` queries L7 data boundaries\n  over the SnapshotManagement Connect RPC\n\n## Improvements\n\n- **Resolver history caching** \u2014 the marshalled `/resolver/history` payload is cached, fixing an\n  out-of-memory condition under live capture\n- **Conditional GETs on hub fetches** \u2014 worker and tracer use ETag / 304 and trimmed retries when\n  polling `/resolver/history` and `/pods/*`, cutting redundant transfer of a multi-megabyte payload\n  on every sync cycle\n- **Batched UI streaming** \u2014 the hub batches entries per `UIStreamEvent` send and the frontend\n  handles batched entries, reducing per-entry overhead on the UI stream\n- **Dropped traffic is now visible** \u2014 the hub emits streamed and dropped counts in the UI\n  heartbeat and the traffic viewer surfaces dropped live traffic at high throughput, instead of\n  dropping silently\n- **Parallel snapshot collection** \u2014 per-node worker copy runs in parallel and reports a new\n  `partially_completed` status, which the snapshots view renders with a warning colour\n- **Slow-consumer logging** \u2014 the drop log is rate-limited to a periodic summary rather than one\n  line per drop\n- **Raw capture byte accounting** \u2014 the tracer tracks monotonic ingested bytes per writer, the\n  worker reports them, and the hub counts them in `pcap_ingestion_bytes`\n- **Dissection telemetry** \u2014 dissection status and last toggle timestamp are now reported\n- **Reduced Sentry noise** \u2014 transient worker connect failures, worker filter RPC errors, client\n  disconnects on UI stream sends and several HUB-prefixed issues are downgraded from error to warn\n  or suppressed\n\n## Bug Fixes\n\n- **Worker to hub 401s with stock values** \u2014 the worker DaemonSet gated its hub token on\n  `tap.auth.enabled` alone while the hub derived `AUTH_ENABLED` from `cloudLicenseEnabled`,\n  `demoModeEnabled` and `tap.auth.enabled`. Since `cloudLicenseEnabled` defaults to true, stock\n  values produced a hub demanding a token the workers never received. Both now consume a single\n  `kubeshark.authEnabled` helper so they cannot drift again (#1954)\n- **Tracer container missing the hub token** \u2014 the tracer polls `/pods/all` and `/pods/targeted`\n  every sync cycle but only the sniffer container received the env var and mount\n- **Watcher label selector typo** \u2014 `kubehq` corrected to `kubeshark` on re-add\n- **KFL filter evaluation failures** \u2014 `applyK8sFilter` demotes a kfl2 evaluation failure to debug\n  and fails open rather than dropping traffic\n- **Identity labels for non-namespaced endpoints** \u2014 `unresolved` replaced with meaningful identity\n  labels in both hub and frontend\n- **Frontend polling after auth loss** \u2014 `useHubHealth` stops polling on 401 instead of cascading\n  further 401s\n- **Out-of-scope snapshot rows** \u2014 Download and Export PCAP are disabled for rows outside the\n  permitted scope\n- **Demo mode** \u2014 the \"logged as\" indicator is disabled\n- **Raw capture restart** \u2014 `Manager.StartCapturing` is idempotent for the same id, and a spurious\n  \"cgroupv2 handler is closed\" warning is fixed\n- **Pod-inventory route naming** \u2014 the misleading `public` naming on the pod-inventory routes is\n  corrected, since those routes are not public\n- **`kubeshark console`** \u2014 marked as under refactoring and exits early rather than failing\n  obscurely; it has been broken since the scripting-log stream moved from the `/scripts/logs`\n  WebSocket to the `ScriptLogsDashboard` Connect RPC\n\n## Infrastructure & Dependencies\n\n- **Dependency sweep** \u2014 critical and high Dependabot alerts cleared across CLI, worker, hub and\n  tracer; high-severity E2E dependency alerts fixed in the hub\n- **Dependency trackers** for api2 and kfl2 added to worker, hub and front\n- **api2 and kfl2 pins** bumped to master\n- **tracer submodule reference gate** added to the worker, plus a submodule bump to tracer2 master\n  for hub authentication\n- **Front base image packages** upgraded at build time\n- **Release tooling** \u2014 the auto-tag workflow was removed and `make release-tag` is idempotent, so\n  tagging master is now an explicit step\n- **MCP registry** \u2014 required top-level `owner` field added to `marketplace.json`\n- **security-audit skill** \u2014 tool-to-section mapping corrected\n\n## Patches\n\n> When new patch releases are published, they will be automatically added and listed in this section.\n\n### v53.4.1 (08-20-2026)\n\n- **Fix empty dashboard without a license** \u2014 An unlicensed deployment resolved no capabilities for anonymous sessions, so the capability gates introduced in v53.4.0 denied the base-entries, snapshot and live-stream calls the dashboard depends on. The free tier now streams traffic up to its entry cap instead of rendering an empty API stream\n- **Fix missing events across dashboard clients** \u2014 The hub's fan-out loop stopped delivering to every remaining client after the first one whose filter did not match, which surfaced as nondeterministic gaps in the API stream when more than one dashboard was open\n\n## Download Kubeshark for your platform\n\n**Mac** (x86-64/Intel)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.4.0/kubeshark_darwin_amd64 && chmod 755 kubeshark\n```\n\n**Mac** (AArch64/Apple M1 silicon)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.4.0/kubeshark_darwin_arm64 && chmod 755 kubeshark\n```\n\n**Linux** (x86-64)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.4.0/kubeshark_linux_amd64 && chmod 755 kubeshark\n```\n\n**Linux** (AArch64)\n```\ncurl -Lo kubeshark https://github.com/kubeshark/kubeshark/releases/download/v53.4.0/kubeshark_linux_arm64 && chmod 755 kubeshark\n```\n\n**Windows** (x86-64)\n```\ncurl -LO https://github.com/kubeshark/kubeshark/releases/download/v53.4.0/kubeshark.exe\n```\n\n### Checksums\nSHA256 checksums available for compiled binaries.\nRun `shasum -a 256 -c kubeshark_OS_ARCH.sha256` to verify.\n\n"}
