{"id":391194781,"author":{"login":"wanghe-fit2cloud","id":46734380,"node_id":"MDQ6VXNlcjQ2NzM0Mzgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHrwnHM4XUSid","tag_name":"v2.3.1","target_commitish":"dev-v2","name":"v2.3.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-17T07:46:06Z","updated_at":"2026-09-18T03:26:40Z","published_at":"2026-09-18T03:26:40Z","assets":[],"body":"## \u2728 New Features / \u65b0\u589e\u529f\u80fd\r\n\r\n* Agents: Added support for setting a maximum reply length for models in OpenClaw / OpenClaw \u652f\u6301\u8bbe\u7f6e\u6a21\u578b\u56de\u590d\u957f\u5ea6\u4e0a\u9650 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13818\r\n* Models: Added a Qwen3.8-Flash-Next model deployment template for dual RTX Pro 5000 GPUs / \u65b0\u589e\u9002\u914d\u53cc RTX Pro 5000 \u663e\u5361\u7684 Qwen3.8-Flash-Next \u6a21\u578b\u90e8\u7f72\u6a21\u677f by @zhengkunwang223\r\n* File Browser: Added support for using the filename provided by the server in remote downloads and improved error handling / \u8fdc\u7a0b\u4e0b\u8f7d\u652f\u6301\u4f7f\u7528\u670d\u52a1\u5668\u63d0\u4f9b\u7684\u6587\u4ef6\u540d\u5e76\u4f18\u5316\u5f02\u5e38\u5904\u7406 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13808\r\n* Toolbox: Added panel main service diagnostics and performance data collection to process management / \u8fdb\u7a0b\u7ba1\u7406\u65b0\u589e\u9762\u677f\u4e3b\u670d\u52a1\u8bca\u65ad\u4e0e\u6027\u80fd\u6570\u636e\u91c7\u96c6\u529f\u80fd by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13852\r\n\r\n## \u2699\ufe0f Enhancements / \u529f\u80fd\u4f18\u5316\r\n\r\n* Containers: Improved container network forwarding checks and error messages / \u5b8c\u5584\u5bb9\u5668\u7f51\u7edc\u8f6c\u53d1\u68c0\u67e5\u4e0e\u5f02\u5e38\u63d0\u793a by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13820\r\n* Containers: Improved the theme display and text layout of container details / \u4f18\u5316\u5bb9\u5668\u8be6\u60c5\u7684\u4e3b\u9898\u663e\u793a\u4e0e\u6587\u5b57\u6392\u7248 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13849\r\n* Firewall: Optimized the firewall startup, restart, and rule synchronization flows / \u4f18\u5316\u9632\u706b\u5899\u542f\u52a8\u3001\u91cd\u542f\u53ca\u89c4\u5219\u540c\u6b65\u6d41\u7a0b by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13809\r\n* Firewall: Optimized port whitelist management, rule recovery, and protection logic / \u4f18\u5316\u7aef\u53e3\u767d\u540d\u5355\u7ba1\u7406\u53ca\u89c4\u5219\u6062\u590d\u4e0e\u4fdd\u62a4\u903b\u8f91 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13826\r\n* Firewall: Improved loading and deletion speed for large rule sets and added support for queued background deletion / \u63d0\u5347\u5927\u91cf\u89c4\u5219\u7684\u52a0\u8f7d\u4e0e\u5220\u9664\u901f\u5ea6\u5e76\u652f\u6301\u540e\u53f0\u6392\u961f\u5220\u9664 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13829\r\n\r\n## \ud83d\udee0\ufe0f Bug Fixes / \u95ee\u9898\u4fee\u590d\r\n\r\n* Websites: Fixed the issue where related settings could not be saved after enabling Brotli compression in OpenResty / \u4fee\u590d\u4e86 OpenResty \u542f\u7528 Brotli \u538b\u7f29\u540e\u65e0\u6cd5\u4fdd\u5b58\u76f8\u5173\u8bbe\u7f6e\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13822\r\n* Terminal: Fixed interference between the terminal shortcut and terminal page sessions / \u4fee\u590d\u4e86\u7ec8\u7aef\u5feb\u6377\u5165\u53e3\u4e0e\u7ec8\u7aef\u9875\u9762\u4f1a\u8bdd\u76f8\u4e92\u5e72\u6270\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13810\r\n* Virtual Machine Management: Fixed forced deletion failures when virtual machine names contain special characters / \u4fee\u590d\u4e86\u865a\u62df\u673a\u540d\u79f0\u5305\u542b\u7279\u6b8a\u5b57\u7b26\u65f6\u65e0\u6cd5\u5f3a\u5236\u5220\u9664\u7684\u95ee\u9898 by @ssongliu\r\n* Panel Settings: Fixed excessive CPU usage when accessing the panel with a large authorized IP range / \u4fee\u590d\u4e86\u6388\u6743 IP \u8303\u56f4\u8f83\u5927\u65f6\u8bbf\u95ee\u9762\u677f\u5bfc\u81f4 CPU \u5360\u7528\u8fc7\u9ad8\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13851\r\n","reactions":{"total_count":13,"+1":3,"-1":0,"laugh":2,"hooray":2,"confused":0,"heart":2,"rocket":2,"eyes":2},"mentions_count":3}
