{"id":441430994,"author":{"login":"wanghe-fit2cloud","id":46734380,"node_id":"MDQ6VXNlcjQ2NzM0Mzgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHrwnHM4aT7PS","tag_name":"v2.5.0","target_commitish":"dev-v2","name":"v2.5.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-11T05:50:59Z","updated_at":"2026-11-11T08:51:39Z","published_at":"2026-11-11T08:51:39Z","assets":[],"body":"[English](#en-v2.5.0) | [中文](#cn-v2.5.0)\r\n\r\n<h3 id=\"en-v2.5.0\">New Features</h3>\r\n\r\n* Overview: Added GPU status views and vLLM token throughput monitoring by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14251、https://github.com/1Panel-dev/1Panel/pull/14325\r\n* Overview: Added support for multiple directory shortcuts by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14132\r\n* Models: Completely rebuilt GPU management by @ssongliu、@wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/14322、https://github.com/1Panel-dev/1Panel/pull/14348\r\n* Models: Completely rebuilt vLLM management by @ssongliu、@wanghe-fit2cloud\r\n* Models: Completely rebuilt model services by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14306、https://github.com/1Panel-dev/1Panel/pull/14282、https://github.com/1Panel-dev/1Panel/pull/14317\r\n* Agents: Added support for DeepSeek Harness and OctoP by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14138\r\n* MCP Management: Added 1Panel MCP service management by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14189、https://github.com/1Panel-dev/1Panel/pull/14229\r\n* Websites: Added reverse proxy timeout configuration in performance tuning by @Kadxy in https://github.com/1Panel-dev/1Panel/pull/14313\r\n* Certificates: Added support for pushing issued certificates to multiple local directories at once by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14137\r\n* Certificates: Added support for importing self-signed root certificates by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14148\r\n* Containers: Added support for batch file uploads to container directories by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14133\r\n* Containers: Added container image update detection and status indicators by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14246\r\n* Containers: Added support for batch upgrades in the container list by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14231\r\n* Containers: Added support for searching remote images on Docker Hub by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14271\r\n* Containers: Added a switch for NVIDIA GPU runtime configuration by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14331\r\n* Virtual Machines: Added virtual machine management support for Community Edition users by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14279\r\n* Cron: Added support for setting the User-Agent header in URL access tasks by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14368\r\n* Multi-Node: Added support for installing and upgrading nodes using existing installation packages by @ssongliu\r\n* Ops Report: Added operations report support for Professional Edition users by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14365\r\n* Resource Sync: Added support for synchronizing PHP extension templates across nodes by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14299\r\n\r\n### Enhancements\r\n\r\n* App Store: Added support for including child nodes in local app synchronization by @zhengkunwang223\r\n* App Store: Added independent configuration and enable/disable controls for the image prefix by @zhengkunwang223\r\n* App Store: Reduced resource requests during App Store synchronization by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14248\r\n* Agents: Updated the MiniMax Flash model list and default configuration by @octo-patch in https://github.com/1Panel-dev/1Panel/pull/14136\r\n* Agents: Updated the default DeepSeek model name by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14146\r\n* Websites: Improved status messages for Brotli settings that have not yet taken effect by @Kadxy in https://github.com/1Panel-dev/1Panel/pull/14285\r\n* Runtime: Updates now wait for image pulls to finish before stopping existing containers by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14202\r\n* Database: Unified database username and password validation rules by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14216\r\n* Containers: Added sorting by creation time and restored the default order when sorting is cleared by @woolsen in https://github.com/1Panel-dev/1Panel/pull/14141、https://github.com/1Panel-dev/1Panel/pull/14140\r\n* Containers: Reduced prolonged loading of the container list by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14156\r\n* File Browser: Improved Esc key and cancel handling during file renaming by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14352\r\n* File Browser: Strengthened source validation for sensitive file operations and source tracking in history records by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14344\r\n* Terminal: Improved border display for terminal shortcuts in dark mode by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14224\r\n* Multi-Node: Improved SFTP upload speed between nodes by @ssongliu\r\n* Multi-Node: Extended the retry period for node data synchronization by @ssongliu\r\n* Interface Settings: Unified task log and deletion confirmation dialogs by @ssongliu、@xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14212、https://github.com/1Panel-dev/1Panel/pull/14243\r\n* Interface Settings: Updated the Enterprise Edition login page background by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14252\r\n* Log Audit: Improved client IP logging and login information retention when using trusted proxies by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14343\r\n* Panel Settings: Added support for deleting revoked API keys by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14235\r\n* Panel Settings: Improved certificate validation for backup storage and HTTPS proxies with support for custom CA certificates by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14338\r\n* System: Standardized table tooltips to appear below the corresponding content by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/14329\r\n* System: Increased the maximum number of items per page and improved responsive table layouts by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14370\r\n* System: Strengthened access restrictions on expired sessions and credential use by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14346\r\n* System: Improved TLS certificate validation for external resource requests by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14336\r\n* System: Upgraded Markdown and HTML parsing dependencies by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14340、https://github.com/1Panel-dev/1Panel/pull/14339\r\n\r\n### Bug Fixes\r\n\r\n* App Store: Fixed numeric passwords starting with \"+\" or \"-0\" being altered during app installation or parameter changes by @RaphaelFakhri in https://github.com/1Panel-dev/1Panel/pull/14180\r\n* App Store: Fixed environment variable values being altered during app upgrades by @Dev-next-gen in https://github.com/1Panel-dev/1Panel/pull/14264\r\n* App Store: Fixed apps being unable to upgrade from unlisted versions by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14280\r\n* App Store: Fixed app icon redirect errors when accessing through a node proxy by @zhengkunwang223\r\n* App Store: Fixed app resource cache refresh errors and incorrect PHP runtime version options by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14185\r\n* Agents: Fixed missing module errors and QR codes not appearing during Hermes WeChat channel setup by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14197\r\n* Agents: Fixed Feishu plugin compatibility issues after OpenClaw upgrades while preserving legacy Feishu configuration by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14214\r\n* Websites: Fixed PHP runtime changes not being synchronized to subsites by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14166\r\n* Runtime: Fixed runtime project terminals reporting missing containers and failing to connect by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14142\r\n* Database: Fixed management tool links not using the app's custom web access URL by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14369\r\n* Containers: Fixed search filters being lost when returning to the list after editing a container by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14134、https://github.com/1Panel-dev/1Panel/pull/14320\r\n* Containers: Fixed log cleanup failures for app instance names containing uppercase letters by @RaphaelFakhri、@xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14292、https://github.com/1Panel-dev/1Panel/pull/14353\r\n* File Browser: Fixed file renaming directly overwriting existing files with the same name by @woolsen in https://github.com/1Panel-dev/1Panel/pull/14168\r\n* File Browser: Fixed downloaded files potentially being saved outside the selected directory by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14345\r\n* File Browser: Fixed argument injection in tar compression commands by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14335\r\n* Terminal: Fixed automatically generated terminal keys not displaying correctly after adding a node and SSH passwords still being required to connect by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14359\r\n* Cron: Fixed script library synchronization using an outdated resource cache by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14268\r\n* WAF: Fixed errors when opening website settings and basic APIs being blocked on Community Edition child nodes by @zhengkunwang223\r\n* Website Monitoring: Fixed request log statistics errors by @zhengkunwang223\r\n* Log Audit: Fixed operation logs showing resource IDs instead of names when switching website PHP versions or deleting PHP runtimes by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14173\r\n* Panel Settings: Fixed panel access failures after re-enabling the security entrance by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14364\r\n* Panel Settings: Fixed backup account searches by name by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14375\r\n* System: Fixed password changes through 1pctl not following password complexity settings by @woolsen in https://github.com/1Panel-dev/1Panel/pull/14169\r\n* System: Fixed time synchronization moving the system clock back by one hour during the repeated time period after daylight saving time ends by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14363\r\n\r\n<h3 id=\"cn-v2.5.0\">新增功能</h3>\r\n\r\n* 【概览】新增 GPU 状态视图与 vLLM Token 吞吐量监控 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14251、https://github.com/1Panel-dev/1Panel/pull/14325\r\n* 【概览】支持添加多个快捷目录 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14132\r\n* 【模型】全面重构 GPU 管理 by @ssongliu、@wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/14322、https://github.com/1Panel-dev/1Panel/pull/14348\r\n* 【模型】全面重构 vLLM 管理 by @ssongliu、@wanghe-fit2cloud\r\n* 【模型】全面重构模型服务 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14306、https://github.com/1Panel-dev/1Panel/pull/14282、https://github.com/1Panel-dev/1Panel/pull/14317\r\n* 【智能体】新增 DeepSeek Harness 和 OctoP 支持 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14138\r\n* 【MCP 管理】新增 1Panel MCP 服务管理功能 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14189、https://github.com/1Panel-dev/1Panel/pull/14229\r\n* 【网站】支持在性能调整中配置反向代理超时时间 by @Kadxy in https://github.com/1Panel-dev/1Panel/pull/14313\r\n* 【证书】证书申请后支持一次推送到多个本地目录 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14137\r\n* 【证书】支持导入自签根证书 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14148\r\n* 【容器】容器目录支持批量上传文件 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14133\r\n* 【容器】新增容器镜像更新检测与状态提示 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14246\r\n* 【容器】容器列表支持批量升级 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14231\r\n* 【容器】支持搜索 Docker Hub 远程镜像 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14271\r\n* 【容器】新增 NVIDIA GPU 运行时配置开关 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14331\r\n* 【虚拟机】社区版用户支持虚拟机管理功能 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14279\r\n* 【计划任务】访问 URL 任务支持设置 User-Agent 请求头 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14368\r\n* 【多机管理】支持使用已有安装包进行节点安装与升级 by @ssongliu\r\n* 【运维报表】专业版用户支持运维报表功能 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14365\r\n* 【资源同步】支持跨节点同步 PHP 扩展模板 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14299\r\n\r\n### 功能优化\r\n\r\n* 【应用商店】本地应用同步支持联动子节点 by @zhengkunwang223\r\n* 【应用商店】支持独立配置与启停镜像前缀 by @zhengkunwang223\r\n* 【应用商店】减少应用商店同步时的资源请求 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14248\r\n* 【智能体】更新 MiniMax Flash 模型列表与默认配置 by @octo-patch in https://github.com/1Panel-dev/1Panel/pull/14136\r\n* 【智能体】更新 DeepSeek 默认模型名称 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14146\r\n* 【网站】优化 Brotli 配置尚未生效时的状态提示 by @Kadxy in https://github.com/1Panel-dev/1Panel/pull/14285\r\n* 【运行环境】更新时待镜像拉取完成后再停止原有容器 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14202\r\n* 【数据库】统一数据库账号与密码校验规则 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14216\r\n* 【容器】支持按创建时间排序并在清除后恢复默认顺序 by @woolsen in https://github.com/1Panel-dev/1Panel/pull/14141、https://github.com/1Panel-dev/1Panel/pull/14140\r\n* 【容器】缓解容器列表长时间处于加载状态的问题 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14156\r\n* 【文件】完善文件重命名时 Esc 与取消操作的处理 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14352\r\n* 【文件】加强敏感文件操作来源校验与历史记录来源追踪 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14344\r\n* 【终端】优化深色模式下终端快捷入口的边框显示 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14224\r\n* 【多机管理】优化节点间 SFTP 上传速度 by @ssongliu\r\n* 【多机管理】延长节点数据同步的重试时间 by @ssongliu\r\n* 【界面设置】统一任务日志与删除确认弹窗 by @ssongliu、@xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14212、https://github.com/1Panel-dev/1Panel/pull/14243\r\n* 【界面设置】更新企业版登录页背景 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14252\r\n* 【日志审计】完善可信代理场景下的客户端 IP 记录与登录信息留存 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14343\r\n* 【面板设置】支持删除已撤销的 API Key by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14235\r\n* 【面板设置】完善备份存储与 HTTPS 代理证书校验并支持自定义 CA 证书 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14338\r\n* 【系统】统一将表格提示框显示在对应内容下方 by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/14329\r\n* 【系统】提高列表每页条数上限并优化表格响应式布局 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14370\r\n* 【系统】加强过期会话与凭据使用的访问限制 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14346\r\n* 【系统】完善外部资源请求的 TLS 证书校验 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14336\r\n* 【系统】升级 Markdown 与 HTML 解析依赖 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14340、https://github.com/1Panel-dev/1Panel/pull/14339\r\n\r\n### 问题修复\r\n\r\n* 【应用商店】修复了以“+”或“-0”开头的数值型密码在安装或修改应用参数时被改写的问题 by @RaphaelFakhri in https://github.com/1Panel-dev/1Panel/pull/14180\r\n* 【应用商店】修复了升级应用时环境变量值被改写的问题 by @Dev-next-gen in https://github.com/1Panel-dev/1Panel/pull/14264\r\n* 【应用商店】修复了已下架版本的应用无法升级的问题 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14280\r\n* 【应用商店】修复了通过节点代理访问时应用图标重定向异常的问题 by @zhengkunwang223\r\n* 【应用商店】修复了应用资源