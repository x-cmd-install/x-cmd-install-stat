{"id":388304254,"author":{"login":"wanghe-fit2cloud","id":46734380,"node_id":"MDQ6VXNlcjQ2NzM0Mzgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHrwnHM4XJQ1-","tag_name":"v2.3.0","target_commitish":"dev-v2","name":"v2.3.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-14T09:36:23Z","updated_at":"2026-09-15T01:48:17Z","published_at":"2026-09-14T10:14:44Z","assets":[],"body":"## \u2728 New Features / \u65b0\u589e\u529f\u80fd\r\n\r\n* Models: Added llmman as a local model provider for model accounts / \u6a21\u578b\u8d26\u53f7\u65b0\u589e llmman \u672c\u5730\u6a21\u578b\u4f9b\u5e94\u5546\u652f\u6301 by @ericcurtin in https://github.com/1Panel-dev/1Panel/pull/13717\r\n* Models: Added DashScope text-to-image API support for custom model accounts / \u81ea\u5b9a\u4e49\u6a21\u578b\u8d26\u53f7\u65b0\u589e DashScope \u6587\u751f\u56fe API \u652f\u6301 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13664\r\n* Models: Added GB10 images for deploying DeepSeek V4 Flash Vision Exp with vLLM / vLLM \u65b0\u589e\u652f\u6301 DeepSeek V4 Flash Vision Exp \u6a21\u578b\u90e8\u7f72\u7684 GB10 \u955c\u50cf by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13647\r\n* Models: Added an Ascend Qwen3.6-35B-A3B model startup template for vLLM / vLLM \u65b0\u589e\u6607\u817e Qwen3.6-35B-A3B \u6a21\u578b\u542f\u52a8\u6a21\u677f by @zhengkunwang223\r\n* Models: Added support for selecting Ascend device IDs in vLLM / vLLM \u652f\u6301\u6307\u5b9a\u6607\u817e\u8bbe\u5907\u7f16\u53f7 by @zhengkunwang223\r\n* GPU Monitoring: Added support for Ascend 910B, AMD, and more accelerator devices / \u65b0\u589e\u6607\u817e 910B \u4ee5\u53ca AMD \u7b49\u66f4\u591a\u82af\u7247\u8bbe\u5907\u652f\u6301 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13579\r\n* Websites: Added automatic compression activation when the OpenResty Brotli module is enabled and improved Gzip defaults / OpenResty \u542f\u7528 Brotli \u6a21\u5757\u65f6\u81ea\u52a8\u5f00\u542f\u538b\u7f29\u5e76\u4f18\u5316 Gzip \u9ed8\u8ba4\u914d\u7f6e by @Snrat in https://github.com/1Panel-dev/1Panel/pull/13639\r\n* Runtime: Added support for bulk environment variable imports / \u652f\u6301\u6279\u91cf\u5bfc\u5165\u73af\u5883\u53d8\u91cf by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13727\r\n* Runtime: Added support for changing the version of installed runtimes / \u652f\u6301\u5207\u6362\u5df2\u5b89\u88c5\u8fd0\u884c\u73af\u5883\u7248\u672c by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13730\r\n* Firewall: Rebuilt firewall management / \u91cd\u6784\u9632\u706b\u5899\u7ba1\u7406\u529f\u80fd by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13628\r\n* Terminal: Added support for preserving SSH sessions and recovering them after disconnections / \u652f\u6301 SSH \u4f1a\u8bdd\u4fdd\u7559\u4e0e\u65ad\u7ebf\u6062\u590d by @HynoR in https://github.com/1Panel-dev/1Panel/pull/13707, by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13736\r\n* Terminal: Added a shortcut in the bottom-right corner of the page with visibility controlled in terminal settings / \u65b0\u589e\u9875\u9762\u53f3\u4e0b\u89d2\u5feb\u6377\u5165\u53e3\u5e76\u652f\u6301\u5728\u7ec8\u7aef\u8bbe\u7f6e\u4e2d\u63a7\u5236\u663e\u793a by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13772\r\n* Virtual Machine Management: Added virtual machine management to Professional Edition / \u4e13\u4e1a\u7248\u65b0\u589e\u865a\u62df\u673a\u7ba1\u7406\u529f\u80fd by @ssongliu\r\n* Panel Settings: Added custom webhook support for alert notifications / \u544a\u8b66\u901a\u77e5\u652f\u6301\u81ea\u5b9a\u4e49 Webhook by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13685\r\n* Panel Settings: Added support for preserving page sessions in menu tabs / \u83dc\u5355\u6807\u7b7e\u9875\u652f\u6301\u4fdd\u6301\u9875\u9762\u4f1a\u8bdd by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13698\r\n\r\n## \u2699\ufe0f Enhancements / \u529f\u80fd\u4f18\u5316\r\n\r\n* App Store: Optimized the app upgrade workflow / \u4f18\u5316\u5e94\u7528\u5347\u7ea7\u6d41\u7a0b by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13549\r\n* Certificates: Improved key usage configuration for self-signed certificates / \u4f18\u5316\u81ea\u7b7e\u540d\u8bc1\u4e66\u7684\u5bc6\u94a5\u7528\u9014\u914d\u7f6e by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13771\r\n* Containers: Changed the default container list order to sort by name / \u5bb9\u5668\u5217\u8868\u9ed8\u8ba4\u6309\u540d\u79f0\u6392\u5e8f by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13770\r\n* Containers: Improved logging for container startup failures / \u5b8c\u5584\u5bb9\u5668\u542f\u52a8\u5931\u8d25\u65f6\u7684\u65e5\u5fd7\u8bb0\u5f55 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13618\r\n* System: Optimized mobile page layouts and file editing / \u4f18\u5316\u79fb\u52a8\u7aef\u9875\u9762\u5e03\u5c40\u4e0e\u6587\u4ef6\u7f16\u8f91\u4f53\u9a8c by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13739\r\n* System: Optimized footer navigation display / \u4f18\u5316\u9875\u811a\u5bfc\u822a\u5c55\u793a by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13642\r\n* File Browser: Improved timeout retries and status prompts for file uploads and cross-node transfers / \u4f18\u5316\u6587\u4ef6\u4e0a\u4f20\u4e0e\u8de8\u8282\u70b9\u4f20\u8f93\u7684\u8d85\u65f6\u91cd\u8bd5\u548c\u72b6\u6001\u63d0\u793a by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13746\r\n* File Browser: Improved progress display and error handling for remote downloads / \u4f18\u5316\u8fdc\u7a0b\u4e0b\u8f7d\u7684\u8fdb\u5ea6\u5c55\u793a\u4e0e\u5f02\u5e38\u5904\u7406 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13734\r\n* File Browser: Improved filename compatibility and path validation for ZIP extraction / \u4f18\u5316 ZIP \u89e3\u538b\u7684\u6587\u4ef6\u540d\u517c\u5bb9\u6027\u4e0e\u8def\u5f84\u6821\u9a8c by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13733\r\n* APP: Improved connection QR code generation and error messages / \u4f18\u5316\u8fde\u63a5\u4e8c\u7ef4\u7801\u751f\u6210\u4e0e\u5f02\u5e38\u63d0\u793a by @lan-yonghui\r\n* Multi-Node: Improved prompts for node version mismatches / \u5b8c\u5584\u8282\u70b9\u7248\u672c\u4e0d\u4e00\u81f4\u65f6\u7684\u63d0\u793a by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13691\r\n* Multi-Node: Improved authentication for node communication / \u5b8c\u5584\u8282\u70b9\u901a\u4fe1\u8eab\u4efd\u6821\u9a8c by @ssongliu\r\n* Interface Settings: Optimized saving and resetting panel appearance settings / \u4f18\u5316\u9762\u677f\u5916\u89c2\u7684\u4fdd\u5b58\u4e0e\u91cd\u7f6e\u6d41\u7a0b by @lan-yonghui\r\n* Panel Settings: Improved parent-child visibility handling for hidden menus / \u4f18\u5316\u9690\u85cf\u83dc\u5355\u7684\u7236\u5b50\u7ea7\u663e\u793a\u8054\u52a8 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13681\r\n* System: Displayed backup upload records in reverse chronological order / \u5907\u4efd\u4e0a\u4f20\u8bb0\u5f55\u6309\u65f6\u95f4\u5012\u5e8f\u5c55\u793a by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13770\r\n\r\n## \ud83d\udee0\ufe0f Bug Fixes / \u95ee\u9898\u4fee\u590d\r\n\r\n* Overview: Fixed inaccurate disk usage statistics when device aliases are used / \u4fee\u590d\u4e86\u4f7f\u7528\u8bbe\u5907\u522b\u540d\u65f6\u78c1\u76d8\u4f7f\u7528\u91cf\u7edf\u8ba1\u4e0d\u51c6\u786e\u7684\u95ee\u9898 by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/13570\r\n* App Store: Fixed image pull errors when upgrading OpenList / \u4fee\u590d\u4e86 OpenList \u5347\u7ea7\u65f6\u955c\u50cf\u62c9\u53d6\u5f02\u5e38\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13776\r\n* Agents: Fixed installation failures for OpenClaw extension channel plugins in some scenarios / \u4fee\u590d\u4e86\u90e8\u5206\u573a\u666f\u4e0b OpenClaw \u6269\u5c55\u6e20\u9053\u63d2\u4ef6\u5b89\u88c5\u5931\u8d25\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13782\r\n* Models: Fixed validation failures for b.ai model accounts / \u4fee\u590d\u4e86 b.ai \u6a21\u578b\u8d26\u53f7\u9a8c\u8bc1\u5931\u8d25\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13712\r\n* Websites: Fixed an issue where default document names containing underscores or hyphens could not be saved / \u4fee\u590d\u4e86\u9ed8\u8ba4\u6587\u6863\u540d\u79f0\u5305\u542b\u4e0b\u5212\u7ebf\u6216\u8fde\u5b57\u7b26\u65f6\u65e0\u6cd5\u4fdd\u5b58\u7684\u95ee\u9898 by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/13551\r\n* Websites: Fixed SSL port conflicts when creating websites / \u4fee\u590d\u4e86\u521b\u5efa\u7f51\u7ad9\u65f6 SSL \u7aef\u53e3\u51b2\u7a81\u7684\u95ee\u9898 by @A-Words in https://github.com/1Panel-dev/1Panel/pull/13720\r\n* Certificates: Fixed self-signed certificates not being issued by the selected CA / \u4fee\u590d\u4e86\u81ea\u7b7e\u540d\u8bc1\u4e66\u672a\u4f7f\u7528\u6240\u9009 CA \u7b7e\u53d1\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13728\r\n* Containers: Fixed loss of Compose configuration after deployment failures / \u4fee\u590d\u4e86\u7f16\u6392\u90e8\u7f72\u5931\u8d25\u540e\u914d\u7f6e\u4e22\u5931\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13603\r\n* Containers: Fixed duplicate entries in container port mappings / \u4fee\u590d\u4e86\u5bb9\u5668\u7aef\u53e3\u6620\u5c04\u91cd\u590d\u663e\u793a\u7684\u95ee\u9898 by @igophper in https://github.com/1Panel-dev/1Panel/pull/13663\r\n* Containers: Fixed missing authentication when pulling images again from private registries / \u4fee\u590d\u4e86\u91cd\u65b0\u62c9\u53d6\u79c1\u6709\u4ed3\u5e93\u955c\u50cf\u65f6\u672a\u4f7f\u7528\u8ba4\u8bc1\u4fe1\u606f\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13690\r\n* Containers: Fixed changes to IP allocation methods after container upgrades or recreation / \u4fee\u590d\u4e86\u5bb9\u5668\u5347\u7ea7\u6216\u91cd\u5efa\u540e IP \u5206\u914d\u65b9\u5f0f\u53d1\u751f\u53d8\u5316\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13738\r\n* Containers: Fixed disk usage statistics timing out in some scenarios / \u4fee\u590d\u4e86\u90e8\u5206\u573a\u666f\u4e0b\u78c1\u76d8\u5360\u7528\u7edf\u8ba1\u8d85\u65f6\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13695\r\n* System: Fixed version information not updating after uninstalling and reinstalling while retaining data / \u4fee\u590d\u4e86\u4fdd\u7559\u6570\u636e\u5378\u8f7d\u91cd\u88c5\u540e\u7248\u672c\u4fe1\u606f\u672a\u66f4\u65b0\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13601\r\n* System: Fixed table selections being unexpectedly cleared when clicking table content / \u4fee\u590d\u4e86\u70b9\u51fb\u8868\u683c\u5185\u5bb9\u65f6\u610f\u5916\u53d6\u6d88\u9009\u4e2d\u72b6\u6001\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13752\r\n* File Browser: Fixed file loss when copying or moving large directories / \u4fee\u590d\u4e86\u590d\u5236\u6216\u79fb\u52a8\u5927\u578b\u76ee\u5f55\u65f6\u6587\u4ef6\u4e22\u5931\u7684\u95ee\u9898 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13524\r\n* File Browser: Fixed a potential bypass of rate limits on public file shares / \u4fee\u590d\u4e86\u516c\u5f00\u6587\u4ef6\u5206\u4eab\u8bbf\u95ee\u9891\u7387\u9650\u5236\u53ef\u80fd\u88ab\u7ed5\u8fc7\u7684\u95ee\u9898, reported by @mbanyamer and fixed by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13632\r\n* Cron: Fixed scheduled task timeouts accepting values other than positive integers / \u4fee\u590d\u4e86\u4efb\u52a1\u8d85\u65f6\u65f6\u95f4\u5141\u8bb8\u586b\u5199\u975e\u6b63\u6574\u6570\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13706\r\n* Toolbox: Fixed antivirus scan timeout settings not taking effect / \u4fee\u590d\u4e86\u75c5\u6bd2\u626b\u63cf\u8d85\u65f6\u65f6\u95f4\u914d\u7f6e\u672a\u751f\u6548\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13619\r\n* Multi-Node: Fixed node status not updating promptly after a successful health check / \u4fee\u590d\u4e86\u8282\u70b9\u5065\u5eb7\u68c0\u67e5\u901a\u8fc7\u540e\u72b6\u6001\u672a\u53ca\u65f6\u66f4\u65b0\u7684\u95ee\u9898 by @ssongliu\r\n* Multi-Node: Fixed forwarding errors for real-time node connections such as terminals / \u4fee\u590d\u4e86\u8282\u70b9\u7ec8\u7aef\u7b49\u5b9e\u65f6\u8fde\u63a5\u8f6c\u53d1\u5f02\u5e38\u7684\u95ee\u9898 by @ssongliu\r\n* Interface Settings: Fixed panel appearance settings being reset when a license is unbound or expires / \u4fee\u590d\u4e86\u8bb8\u53ef\u8bc1\u89e3\u7ed1\u6216\u5230\u671f\u540e\u9762\u677f\u5916\u89c2\u8bbe\u7f6e\u88ab\u91cd\u7f6e\u7684\u95ee\u9898 by @ssongliu\r\n* Log Audit: Fixed inaccurate correlation between SSH login and disconnect records / \u4fee\u590d\u4e86 SSH \u767b\u5f55\u4e0e\u65ad\u5f00\u8bb0\u5f55\u5173\u8054\u4e0d\u51c6\u786e\u7684\u95ee\u9898 by @JayLee-sre in https://github.com/1Panel-dev/1Panel/pull/13669, by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13705\r\n* Panel Settings: Fixed allowed IP validation errors when accessing the panel through trusted proxies / \u4fee\u590d\u4e86\u901a\u8fc7\u53ef\u4fe1\u4ee3\u7406\u8bbf\u95ee\u65f6\u6388\u6743 IP \u6821\u9a8c\u5f02\u5e38\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13608\r\n* Panel Settings: Fixed documentation source settings not taking effect promptly / \u4fee\u590d\u4e86\u6587\u6863\u6e90\u8bbe\u7f6e\u672a\u53ca\u65f6\u751f\u6548\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13599\r\n* Panel Settings: Fixed menus disappearing after switching service regions / \u4fee\u590d\u4e86\u5207\u6362\u670d\u52a1\u5730\u533a\u540e\u83dc\u5355\u4e22\u5931\u7684\u95ee\u9898 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13602\r\n","reactions":{"total_count":10,"+1":3,"-1":0,"laugh":2,"hooray":2,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":11}
