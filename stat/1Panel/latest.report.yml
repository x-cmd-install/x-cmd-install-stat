{"id":418105305,"author":{"login":"wanghe-fit2cloud","id":46734380,"node_id":"MDQ6VXNlcjQ2NzM0Mzgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHrwnHM4Y68fZ","tag_name":"v2.4.0","target_commitish":"dev-v2","name":"v2.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-19T09:54:05Z","updated_at":"2026-10-20T07:16:06Z","published_at":"2026-10-20T07:16:06Z","assets":[],"body":"[English](#en-v2.4.0) | [\u4e2d\u6587](#cn-v2.4.0)\r\n\r\n<h3 id=\"en-v2.4.0\">New Features</h3>\r\n\r\n* Models: Added vLLM monitoring with real-time metrics, request analysis charts, and history by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13942\r\n* Certificates: Added Netcup as a DNS provider by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14038\r\n* Containers: Added support for uploading local files when importing images by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14025\r\n* Monitor: Added monitoring data export by @CNCoreSteb in https://github.com/1Panel-dev/1Panel/pull/13875\r\n* Firewall: Added an IPv6 support switch, along with rule reset backup and startup restore by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13998\r\n* Cron: Added success alerts for scheduled tasks and improved alert content by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13919\r\n* Virtual Machine Management: Added Windows VirtIO driver installation guidance by @ssongliu\r\n* Virtual Machine Management: Added VM disk management and offline expansion by @ssongliu\r\n\r\n### Enhancements\r\n\r\n* Overview: Optimized disk information collection and query performance by @CNCoreSteb in https://github.com/1Panel-dev/1Panel/pull/13971\r\n* Overview: Optimized default chart styles and theme adaptation on the homepage by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14101\r\n* Agents: Optimized the Hermes Agent version upgrade logic by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14079\r\n* Models: Improved vLLM monitoring with real-time metrics, historical request statistics, and page layout by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14109\r\n* GPU Monitoring: Improved native monitoring for GPU, NPU, and XPU by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13939\r\n* Websites: Adjusted the order of certificate and private key fields when uploading certificates by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14022\r\n* Certificates: Certificate requests now default to the key algorithm of the ACME account by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14023\r\n* Certificates: Improved the certificate deletion flow, with delete-and-revoke support for ACME certificates by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14024\r\n* Database: Redis remote database terminals now run as background tasks by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14012\r\n* Containers: Improved log output when pulling images by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/13990\r\n* Containers: Improved container log text by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14066\r\n* Monitor: Optimized monitoring queries and charts for large time ranges by @CNCoreSteb in https://github.com/1Panel-dev/1Panel/pull/13874\r\n* Firewall: Improved compatibility handling for imported firewalld rules by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14046\r\n* Terminal: Improved terminal session detach and grace period expiry handling by @HynoR in https://github.com/1Panel-dev/1Panel/pull/14127\r\n* Cron: Script library interactive column now shows Yes/No text by @Kadxy in https://github.com/1Panel-dev/1Panel/pull/14099\r\n* Virtual Machine Management: Added VNC keyboard controls and macvtap network mode, and improved network configuration descriptions by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13996\r\n* Virtual Machine Management: Added support for managing VMs through node agents and improved error messages by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14007\r\n* Interface Settings: Improved user information and node switching entries in the bottom navigation by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14021\r\n* Log Audit: Improved operation log content for firewall and port forwarding operations by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14076\r\n* Panel Settings: Optimized SFTP backup upload speed by @4kercc in https://github.com/1Panel-dev/1Panel/pull/13976\r\n* Panel Settings: Improved database file handling during snapshot recovery and upgrades by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14043\r\n* Panel Settings: Improved log text for alert configuration by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14086\r\n* System: Improved search and pagination state persistence on list pages by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/13992\r\n\r\n### Bug Fixes\r\n\r\n* Overview: Fixed inaccurate monitoring rate calculations on the homepage by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14033\r\n* App Store: Fixed backup and restore handling errors during AI Gateway application upgrades by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14072\r\n* Models: Fixed a stuck vLLM startup state blocking subsequent operations by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/14017\r\n* Websites: Fixed existing files being cleared when the target directory already exists during website creation by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14042\r\n* Runtime: Fixed operation logs showing resource IDs instead of names by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/13989\r\n* Containers: Fixed protected networks being deleted during network cleanup, leaving containers unable to start by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14009\r\n* Containers: Fixed relative path handling and multi-file project saving issues for Compose by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14062\r\n* File Browser: Fixed layout jitter when closing file tabs by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/14013\r\n* Firewall: Fixed read-only APIs being unavailable in demo mode by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13914\r\n* Firewall: Fixed IPv6 RA protection rules being overwritten and legacy system compatibility issues by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14015\r\n* Firewall: Fixed incorrect Fail2Ban rule priority after binding iptables chains by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14039\r\n* Firewall: Fixed panel port whitelist not being synchronized when a node starts by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14080\r\n* Firewall: Fixed access whitelist not being ready before firewall startup by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14114\r\n* SSH: Fixed incomplete validation for imported key pairs by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13991\r\n* Multi-Node: Fixed context switching errors after deleting the current node by @ssongliu\r\n* Virtual Machine Management: Fixed task timeout cleanup failures and command groups not terminating by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14008\r\n* Virtual Machine Management: Fixed incorrect VM autostart configuration and unprotected orphan disk chains by @ssongliu\r\n* Virtual Machine Management: Fixed login state being invalidated on node access errors by @ssongliu\r\n* Virtual Machine Management: Fixed owned snapshot chains not being cleaned up when deleting VMs by @ssongliu\r\n* Panel Settings: Fixed local logins still triggering SSH login alerts by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13920\r\n* Panel Settings: Fixed Webhook response judgment errors and improved configuration and testing experience by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/14077\r\n* Panel Settings: Fixed repeated page refreshes after unbinding the current node license by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/14064\r\n* System: Fixed selected items being cleared after scheduled list refreshes by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/13993\r\n* System: Fixed release notes failing to load in some scenarios by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13943\r\n* System: Fixed incomplete WebSocket origin validation by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13953\r\n* System: Fixed the built-in Default group name being translated by @Kadxy in https://github.com/1Panel-dev/1Panel/pull/14100\r\n\r\n<h3 id=\"cn-v2.4.0\">\u65b0\u589e\u529f\u80fd</h3>\r\n\r\n* \u3010\u6a21\u578b\u3011\u65b0\u589e vLLM \u76d1\u63a7\uff0c\u652f\u6301\u5b9e\u65f6\u6307\u6807\u3001\u8bf7\u6c42\u5206\u6790\u56fe\u8868\u4e0e\u5386\u53f2\u8bb0\u5f55 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13942\r\n* \u3010\u8bc1\u4e66\u3011DNS \u8d26\u53f7\u65b0\u589e Netcup \u670d\u52a1\u5546 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14038\r\n* \u3010\u5bb9\u5668\u3011\u955c\u50cf\u5bfc\u5165\u652f\u6301\u76f4\u63a5\u4e0a\u4f20\u672c\u5730\u6587\u4ef6 by @xiaomeinvG in https://github.com/1Panel-dev/1Panel/pull/14025\r\n* \u3010\u76d1\u63a7\u3011\u65b0\u589e\u76d1\u63a7\u6570\u636e\u5bfc\u51fa\u529f\u80fd by @CNCoreSteb in https://github.com/1Panel-dev/1Panel/pull/13875\r\n* \u3010\u9632\u706b\u5899\u3011\u65b0\u589e IPv6 \u652f\u6301\u5f00\u5173\uff0c\u5e76\u652f\u6301\u89c4\u5219\u91cd\u7f6e\u5907\u4efd\u4e0e\u542f\u52a8\u6062\u590d by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13998\r\n* \u3010\u8ba1\u5212\u4efb\u52a1\u3011\u65b0\u589e\u8ba1\u5212\u4efb\u52a1\u6267\u884c\u6210\u529f\u544a\u8b66\u5e76\u5b8c\u5584\u544a\u8b66\u5185\u5bb9 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13919\r\n* \u3010