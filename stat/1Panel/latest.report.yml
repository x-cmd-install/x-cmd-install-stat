{"id":395299544,"author":{"login":"wanghe-fit2cloud","id":46734380,"node_id":"MDQ6VXNlcjQ2NzM0Mzgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHrwnHM4Xj8rY","tag_name":"v2.3.2","target_commitish":"dev-v2","name":"v2.3.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-24T02:18:01Z","updated_at":"2026-09-24T03:42:39Z","published_at":"2026-09-24T03:42:39Z","assets":[],"body":"[English](#en-v2.3.2) | [\u4e2d\u6587](#cn-v2.3.2)\r\n\r\n<h3 id=\"en-v2.3.2\">New Features</h3>\r\n\r\n* Panel Settings: Added support for creating multiple API keys by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13872\r\n* Virtual Machine Management: Added support for mounting multiple CD-ROM ISO images by @ssongliu\r\n\r\n### Enhancements\r\n\r\n* Overview: Improved logging for disk command failures by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13889\r\n* File Browser: Improved task messages for file copy, move, compress, and decompress by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13885\r\n* Firewall: Optimized firewall state reads and batch verification logic by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13881\r\n* System: Removed the minimum upgrade backup copies limit by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13907\r\n\r\n### Bug Fixes\r\n\r\n* Models: Fixed the Ollama page failing to open properly in some scenarios by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13855\r\n* Models: Fixed vLLM uninstall failures in some scenarios by @zhengkunwang223\r\n* App Store: Fixed application upgrade failures in some scenarios by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13888\r\n* Websites: Fixed incorrect priority between HTTP-to-HTTPS redirects and website redirects by @A-Words in https://github.com/1Panel-dev/1Panel/pull/13847\r\n* Certificates: Fixed auto-renewing certificates still triggering expiry alerts by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13895\r\n* File Browser: Fixed file rename failures in some scenarios by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13891\r\n* Firewall: Fixed IPv6 forwarding being disrupted by RA by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13882\r\n* Firewall: Fixed incomplete batch operation and task logs by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13886\r\n* Firewall: Fixed incorrect reporting of port allowances and whitelist synchronization by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13892\r\n* Firewall: Fixed rule synchronization failures in some firewalld scenarios by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13896\r\n* Log Audit: Fixed SSH login logs not being displayed in the server timezone by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/13869\r\n* Virtual Machine Management: Fixed abnormal display of some virtual machine states and the inability to wake sleeping virtual machines by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13890\r\n* Virtual Machine Management: Fixed incorrect CPU topology settings for virtual machines by @ssongliu\r\n\r\n<h3 id=\"cn-v2.3.2\">\u65b0\u589e\u529f\u80fd</h3>\r\n\r\n* \u3010\u9762\u677f\u8bbe\u7f6e\u3011\u652f\u6301\u521b\u5efa\u591a\u4e2a API Key by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13872\r\n* \u3010\u865a\u62df\u673a\u7ba1\u7406\u3011\u652f\u6301\u6302\u8f7d\u591a\u4e2a CD-ROM ISO \u955c\u50cf by @ssongliu\r\n\r\n### \u529f\u80fd\u4f18\u5316\r\n\r\n* \u3010\u6982\u89c8\u3011\u5b8c\u5584\u78c1\u76d8\u547d\u4ee4\u6267\u884c\u5931\u8d25\u65f6\u7684\u65e5\u5fd7\u8bb0\u5f55 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13889\r\n* \u3010\u6587\u4ef6\u3011\u5b8c\u5584\u6587\u4ef6\u590d\u5236\u3001\u79fb\u52a8\u3001\u538b\u7f29\u548c\u89e3\u538b\u4efb\u52a1\u7684\u6d88\u606f\u63d0\u793a by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13885\r\n* \u3010\u9632\u706b\u5899\u3011\u4f18\u5316\u9632\u706b\u5899\u72b6\u6001\u8bfb\u53d6\u53ca\u6279\u91cf\u6821\u9a8c\u903b\u8f91 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13881\r\n* \u3010\u7cfb\u7edf\u3011\u79fb\u9664\u6700\u4f4e\u5347\u7ea7\u5907\u4efd\u526f\u672c\u6570\u9650\u5236 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13907\r\n\r\n### \u95ee\u9898\u4fee\u590d\r\n\r\n* \u3010\u6a21\u578b\u3011\u4fee\u590d\u4e86\u90e8\u5206\u573a\u666f\u4e0b Ollama \u9875\u9762\u65e0\u6cd5\u6b63\u5e38\u6253\u5f00\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13855\r\n* \u3010\u6a21\u578b\u3011\u4fee\u590d\u4e86\u90e8\u5206\u573a\u666f\u4e0b vLLM \u5378\u8f7d\u5931\u8d25\u7684\u95ee\u9898 by @zhengkunwang223\r\n* \u3010\u5e94\u7528\u5546\u5e97\u3011\u4fee\u590d\u4e86\u90e8\u5206\u573a\u666f\u4e0b\u5e94\u7528\u5347\u7ea7\u5931\u8d25\u7684\u95ee\u9898 by @zhengkunwang223 in https://github.com/1Panel-dev/1Panel/pull/13888\r\n* \u3010\u7f51\u7ad9\u3011\u4fee\u590d\u4e86 HTTP \u8df3\u8f6c HTTPS \u4e0e\u7f51\u7ad9\u91cd\u5b9a\u5411\u4f18\u5148\u7ea7\u5f02\u5e38\u7684\u95ee\u9898 by @A-Words in https://github.com/1Panel-dev/1Panel/pull/13847\r\n* \u3010\u8bc1\u4e66\u3011\u4fee\u590d\u4e86\u81ea\u52a8\u7eed\u7b7e\u8bc1\u4e66\u4ecd\u89e6\u53d1\u5230\u671f\u544a\u8b66\u7684\u95ee\u9898 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13895\r\n* \u3010\u6587\u4ef6\u3011\u4fee\u590d\u4e86\u6587\u4ef6\u91cd\u547d\u540d\u64cd\u4f5c\u5728\u90e8\u5206\u573a\u666f\u4e0b\u5f02\u5e38\u7684\u95ee\u9898 by @lan-yonghui in https://github.com/1Panel-dev/1Panel/pull/13891\r\n* \u3010\u9632\u706b\u5899\u3011\u4fee\u590d\u4e86 IPv6 \u8f6c\u53d1\u53d7 RA \u5e72\u6270\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13882\r\n* \u3010\u9632\u706b\u5899\u3011\u4fee\u590d\u4e86\u6279\u91cf\u64cd\u4f5c\u4e0e\u4efb\u52a1\u65e5\u5fd7\u663e\u793a\u4e0d\u5b8c\u6574\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13886\r\n* \u3010\u9632\u706b\u5899\u3011\u4fee\u590d\u4e86\u7aef\u53e3\u653e\u884c\u4e0e\u767d\u540d\u5355\u540c\u6b65\u4e0a\u62a5\u5f02\u5e38\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13892\r\n* \u3010\u9632\u706b\u5899\u3011\u4fee\u590d\u4e86 firewalld \u73af\u5883\u4e0b\u90e8\u5206\u573a\u666f\u89c4\u5219\u540c\u6b65\u5f02\u5e38\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13896\r\n* \u3010\u65e5\u5fd7\u5ba1\u8ba1\u3011\u4fee\u590d\u4e86 SSH \u767b\u5f55\u65e5\u5fd7\u672a\u6309\u670d\u52a1\u5668\u65f6\u533a\u663e\u793a\u7684\u95ee\u9898 by @wanghe-fit2cloud in https://github.com/1Panel-dev/1Panel/pull/13869\r\n* \u3010\u865a\u62df\u673a\u7ba1\u7406\u3011\u4fee\u590d\u4e86\u90e8\u5206\u865a\u62df\u673a\u72b6\u6001\u663e\u793a\u5f02\u5e38\u53ca\u4f11\u7720\u865a\u62df\u673a\u65e0\u6cd5\u5524\u9192\u7684\u95ee\u9898 by @ssongliu in https://github.com/1Panel-dev/1Panel/pull/13890\r\n* \u3010\u865a\u62df\u673a\u7ba1\u7406\u3011\u4fee\u590d\u4e86\u865a\u62df\u673a CPU \u62d3\u6251\u8bbe\u7f6e\u4e0d\u6b63\u786e\u7684\u95ee\u9898 by @ssongliu\r\n","reactions":{"total_count":12,"+1":2,"-1":0,"laugh":2,"hooray":2,"confused":0,"heart":2,"rocket":2,"eyes":2},"mentions_count":5}
