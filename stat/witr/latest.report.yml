 @CJstate in https://github.com/pranshuparmar/witr/pull/239\n* fix(proc): stop ancestry at recycled parent PIDs by @aoright in https://github.com/pranshuparmar/witr/pull/226\n* fix(build): replace the symlinked root main.go with a real entry point by @CJstate in https://github.com/pranshuparmar/witr/pull/242\n* feat: v0.3.4 Main PR by @pranshuparmar in https://github.com/pranshuparmar/witr/pull/243\n\n## New Contributors\n* @abyworkings-coder made their first contribution in https://github.com/pranshuparmar/witr/pull/217\n* @Sharma-IT made their first contribution in https://github.com/pranshuparmar/witr/pull/221\n* @OVELYB made their first contribution in https://github.com/pranshuparmar/witr/pull/211\n* @shuvamk made their first contribution in https://github.com/pranshuparmar/witr/pull/218\n* @NgoQuocViet2001 made their first contribution in https://github.com/pranshuparmar/witr/pull/231\n* @xuxiaowei-com-cn made their first contribution in https://github.com/pranshuparmar/witr/pull/234\n* @chiliec made their first contribution in https://github.com/pranshuparmar/witr/pull/238\n* @CJstate made their first contribution in https://github.com/pranshuparmar/witr/pull/239\n* @aoright made their first contribution in https://github.com/pranshuparmar/witr/pull/226\n\n**Full Changelog**: https://github.com/pranshuparmar/witr/compare/v0.3.3...v0.3.4\n\n","reactions":{"total_count":6,"+1":3,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":10}
