.com/mvanhorn/last30days-skill/pull/1270\n* fix(youtube): drop out-of-window videos on recent topics by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1266\n* fix(github): keep pinned repos whose newest release predates the window by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1264\n* chore(release): bump version to 3.28.0 by @github-actions[bot] in https://github.com/mvanhorn/last30days-skill/pull/1272\n\n\n**Full Changelog**: https://github.com/mvanhorn/last30days-skill/compare/v3.27.3...v3.28.0","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
