skill/pull/1243\n* fix: contain Windows Bird/X subprocess trees in job objects by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1245\n* fix: classify blocked Reddit discovery listings by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1247\n* fix: backfill thin YouTube search results by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1248\n* fix: report denied X browser cookie access by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1249\n* fix(skill): stop reports from ending with a trailing Sources list by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1250\n* chore(release): bump version to 3.27.2 by @github-actions[bot] in https://github.com/mvanhorn/last30days-skill/pull/1251\n\n## New Contributors\n* @Tivonsico made their first contribution in https://github.com/mvanhorn/last30days-skill/pull/1240\n* @jayhemnani9910 made their first contribution in https://github.com/mvanhorn/last30days-skill/pull/1195\n* @Bhumika-1432006 made their first contribution in https://github.com/mvanhorn/last30days-skill/pull/1234\n\n**Full Changelog**: https://github.com/mvanhorn/last30days-skill/compare/v3.27.1...v3.27.2","mentions_count":7}
