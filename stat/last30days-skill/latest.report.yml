3:24Z"},{"id":573356267,"node_id":"RA_kwDOQ__jdM4iLLjr","name":"last30days.skill","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15229192,"digest":"sha256:6898acd89e326fde42827d971b5fe0aa5ed19633c31f31c73f7f5d95eb4832ec","download_count":299,"created_at":"2026-09-18T20:03:24Z","updated_at":"2026-09-18T20:03:25Z"}],"body":"## What's Changed\n* fix(env): treat unsubstituted config templates as unconfigured by @SomSamantray in https://github.com/mvanhorn/last30days-skill/pull/1126\n* test(backends): isolate the grok off-PATH probe from the real filesystem by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1123\n* fix(release): bring mcp/manifest.json into the version lockstep by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1122\n* fix(env): strip trailing inline comments from unquoted .env values by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1121\n* Added: Docs option: quick first run for /last30days by @Nikhil433-dell in https://github.com/mvanhorn/last30days-skill/pull/832\n* fix: entity-miss demotion is inert on topics without a distinctive entity by @terry-li-hm in https://github.com/mvanhorn/last30days-skill/pull/888\n* fix: accept an API root in *_BASE_URL overrides by @Opgeek-1 in https://github.com/mvanhorn/last30days-skill/pull/918\n* fix(setup): surface ScrapeCreators /profile 5xx instead of already-linked by @arimu1 in https://github.com/mvanhorn/last30days-skill/pull/925\n* LinkedIn source: honor the date window, follow the cursor, and signal partial results by @jasonericsiegel in https://github.com/mvanhorn/last30days-skill/pull/939\n* fix(arxiv): preserve adapter-valid papers during normalization by @dpersek in https://github.com/mvanhorn/last30days-skill/pull/947\n* docs: correct HERMES_SETUP.md install path (scanner blocks --force) by @technicianofthesacred in https://github.com/mvanhorn/last30days-skill/pull/962\n* fix(github): strip wrapped search qualifiers from topics (#952) by @SomSamantray in https://github.com/mvanhorn/last30days-skill/pull/970\n* fix(doctor): retry rate-limited probes instead of reporting a false outage by @obbax in https://github.com/mvanhorn/last30days-skill/pull/971\n* fix(grok): decode CLI stdout as UTF-8, not the OS locale codec by @SNChicago in https://github.com/mvanhorn/last30days-skill/pull/1025\n* fix(xurl): recognize the ~/.xurl/auth.yml directory layout by @SomSamantray in https://github.com/mvanhorn/last30days-skill/pull/1027\n* chore: normalize line endings to LF via .gitattributes by @zmzhong1 in https://github.com/mvanhorn/last30days-skill/pull/1032\n* fix(transcribe): send the skill User-Agent in _post_audio so Groq's Cloudflare edge stops returning 403 (#983) by @terry-li-hm in https://github.com/mvanhorn/last30days-skill/pull/1036\n* fix(github): bound qualifier-only topic fragments in errors and logs so fanout cannot spam them (#954) by @terry-li-hm in https://github.com/mvanhorn/last30days-skill/pull/1039\n* fix(instagram): unwrap user reels media envelopes by @Tethys0 in https://github.com/mvanhorn/last30days-skill/pull/1042\n* fix(grok): parse CLI JSON output so X search is not empty (#1051) by @hnshah in https://github.com/mvanhorn/last30days-skill/pull/1057\n* fix(cookies): anchor Safari cookie host matching to the domain by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1118\n* fix(reddit): clamp engagement before log10 so downvoted posts don't crash ranking by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1119\n* fix(verify): run the pytest suite instead of unittest discover by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1120\n* fix(github): qualifier-only or empty topics are clean no-results, not ERROR (#953) by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1130\n* docs(credit): attribute #953 fix to Terry Li (@terry-li-hm) via #1041/#1130 by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1131\n* feat(meta-ads): opt-in Meta Ad Library source for a brand's live paid creative by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1138\n* fix(tests): make the both-mode outcome fixture date relative by @dzivkovi in https://github.com/mvanhorn/last30days-skill/pull/1127\n* chore(tests): strip credential-shaped env vars so the suite is hermetic by @dzivkovi in https://github.com/mvanhorn/last30days-skill/pull/1128\n* fix(competitors): refuse a comparison headed by a competitor when the main topic fails by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1117\n* fix(http): redact app passwords and session JWTs from recorded fixtures by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1115\n* fix(rerank): stop scraped content from closing the untrusted-content fence by @iliaal in https://github.com/mvanhorn/last30days-skill/pull/1114\n* fix(render): collapse and defang scraped titles so they cannot forge engine sentinels by @olliedigital in https://github.com/mvanhorn/last30days-skill/pull/1056\n* feat(hooks): add LAST30DAYS_QUIET to quiet the SessionStart status hook by @dnorth123 in https://github.com/mvanhorn/last30days-skill/pull/958\n* fix(hooks): stop running last30days on every session start by @tmchow in https://github.com/mvanhorn/last30days-skill/pull/1142\n* chore(deps): bump trufflesecurity/trufflehog from 3.97.1 to 3.97.4 by @dependabot[bot] in https://github.com/mvanhorn/last30days-skill/pull/1132\n* chore(deps): bump astral-sh/setup-uv from 9.0.0 to 10.0.1 by @dependabot[bot] in https://github.com/mvanhorn/last30days-skill/pull/1046\n* chore(deps-dev): bump towncrier from 25.8.0 to 26.9.0 by @dependabot[bot] in https://github.com/mvanhorn/last30days-skill/pull/1133\n* chore(deps): bump github.com/mark3labs/mcp-go from 0.57.0 to 1.0.0 in /mcp by @dependabot[bot] in 