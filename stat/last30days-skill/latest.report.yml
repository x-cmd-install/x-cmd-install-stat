3Z"},{"id":620621876,"node_id":"RA_kwDOQ__jdM4k_fA0","name":"last30days.skill","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15270354,"digest":"sha256:61b6142aefb7f1c70df4b252ca16439bbcd5c9c1931e5ad290c0b43610fcea18","download_count":10,"created_at":"2026-10-08T03:39:12Z","updated_at":"2026-10-08T03:39:14Z"}],"body":"## Highlights\n\nPatch for the v3.27.0 Grok Bot native X launch, from a smoke test on Grok Bot. (#1237)\n\n- The month's most-engaged on-topic X posts now reach the report. Host-fetched X holds half its slots for its biggest posts that name the topic, so the popular pass's big posts no longer lose to fresher low-engagement ones. Off-topic viral posts never take those slots, and posts from the handles you name are never pushed out.\n- The footer's X line now says where X came from: \"via Grok Bot X\" or \"via X connector\".\n- The Grok Bot X recipe gives discovered authors only topic-word searches and uses the engine's UTC date for the window.\n\nUpdate: `grok plugin update last30days`, `claude plugin update last30days`, or re-run `npx skills add mvanhorn/last30days-skill -g -y`.\n\n## What's Changed\n* fix(x): keep the month's most-engaged Grok Bot X posts in the report by @mvanhorn in https://github.com/mvanhorn/last30days-skill/pull/1237\n* chore(release): bump version to 3.27.1 by @github-actions[bot] in https://github.com/mvanhorn/last30days-skill/pull/1239\n\n\n**Full Changelog**: https://github.com/mvanhorn/last30days-skill/compare/v3.27.0...v3.27.1\n","mentions_count":1}
