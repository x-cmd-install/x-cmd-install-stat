d7767b291c47ff52c678df4329e0384142e15bdd0ae2845","download_count":2,"created_at":"2026-09-21T15:24:28Z","updated_at":"2026-09-21T15:24:29Z"}],"body":"## What's Changed\n* docs(skill): sync the docs skill's openapi.json to v0.10.0 by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4362\n* feat(api): attachment filenames for store-owned banks by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4360\n* fix(attachments): never reclaim attachments for a store-owned bank by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4363\n* fix(retain): guard concise prompt examples by @koriyoshi2041 in https://github.com/vectorize-io/hindsight/pull/4284\n* fix(memory-defense): redact Hindsight Cloud API keys by @cdbartholomew in https://github.com/vectorize-io/hindsight/pull/4276\n* fix(oauth): do not fail the store lock when the store cannot be written by @LoneExile in https://github.com/vectorize-io/hindsight/pull/4286\n* blog: Onboarding an Engineer vs. Onboarding an Agent by @benfrank241 in https://github.com/vectorize-io/hindsight/pull/4100\n* fix(coding-agents): take Codex user turns from UserMessage events by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4377\n* fix(reranker): release the MLX buffer cache after each jina-mlx batch by @w-seok in https://github.com/vectorize-io/hindsight/pull/4305\n* fix(coding-agents): read transcripts whole so append survives past 32MB by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4388\n* chore(skills): add ship-it skill by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4390\n* fix(api): report `deleted_count` from the bulk memories delete by @1jeffchristensen in https://github.com/vectorize-io/hindsight/pull/4312\n* fix(api): keep a converted file's reference on a store-owned bank's document by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4367\n* fix(reflect): honour configured recall budgets and bound tool token asks (#4239) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4290\n* fix(storage): delete a bank's stored files with it, and scope file keys to the tenant by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4376\n* fix(embed): pin the probe's decode instead of taking the locale's by @L4XB in https://github.com/vectorize-io/hindsight/pull/4347\n* fix(memory-defense): avoid redacting technical numbers as credit cards by @kyletser in https://github.com/vectorize-io/hindsight/pull/4333\n* feat(python-client): add task-local retain suspension by @roli-lpci in https://github.com/vectorize-io/hindsight/pull/4285\n* fix(api): fail fast when the listen port is unavailable, before engine init by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4386\n* fix(api): async-submit RetainContext parity \u2014 document_id and attachments (#4373) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4394\n* feat: configurable default trigger for new knowledge pages by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4393\n* fix(engine): serialize same-bank cleanup before document locks by @r266-tech in https://github.com/vectorize-io/hindsight/pull/4339\n* feat(control-plane): lighter recall and reflect option forms, with help on every option by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4397\n* feat(admin): hindsight-admin rename-bank \u2014 change a bank's id in place by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4392\n* fix(banks): cap new bank ids at 192 bytes and refuse control characters by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4395\n* fix(coding-agents): capture background git stderr by @kyletser in https://github.com/vectorize-io/hindsight/pull/4334\n* chore(coding-agents): track stable OpenCode 2 packages by @oliver-mee in https://github.com/vectorize-io/hindsight/pull/4351\n* test(client): exempt suspend_retains from the async-twin contract by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4402\n* docs(embeddings): the input cap is counted in Hindsight's tokens, not the provider's by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4399\n* fix(coding-agents): preserve distinct non-ASCII document titles by @Shy7777 in https://github.com/vectorize-io/hindsight/pull/4330\n* fix(coding-agents): drop the hardcoded 20s cap on the automatic reflect by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4401\n* fix(extensions): drop per-request tenant state from the shared ExtensionContext by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4400\n* fix(coding-agents): resolve the auto-update version check through npm by @Sanderhoff-alt in https://github.com/vectorize-io/hindsight/pull/4385\n* fix(recall): search pg_search queries as pruned word terms, not the raw sentence (#4313) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4403\n* fix(recall): anchor the default temporal window on UTC, not the server clock by @ebarkhordar in https://github.com/vectorize-io/hindsight/pull/4356\n* fix(engine): lock the observation sweep's rows in id order so re-ingest cannot deadlock a delete by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4407\n* test(recall): give the hub-traversal test random-prefixed unit ids by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4405\n* docs(claude): refine architecture inventory, test setup, and providers by @Sanderhoff-alt in https://github.com/vectorize-io/hindsight/pull/4383\n* fix(retain): state the language rule as a mapping, not a detection step; add a retain-language eval by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4410\n* fix(coding-agents): tell dsh users to start new sessions after install by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4413\n* fix(control-plane): serve the UI when bound to a loopback address by @snevesgraca-nwmo in https://github.com/vectorize-io/hindsight/pull/4379\n* fix(engine): close the remaining delete/re-ingest deadlocks from #4251 by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4414\n* fix(recall): cache and reuse observation source memory IDs across pipeline by @Sanderhoff-alt in https://github.com/vectorize-io/hindsight/pull/4370\n* fix(mental-models): keep a page's current state when a refresh brings older events by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4427\n* fix(retain): keep non-English facts in their own script by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4432\n* fix(extensions): give the operation validator the engine's ExtensionContext by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4433\n* fix(coding-agents): pre-create host-owned harness diagnostics by @heyallencao in https://github.com/vectorize-io/hindsight/pull/4430\n* feat(coding-agents): autoInject \u2014 choose reflect, pages or recall for the first-prompt injection by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4415\n* feat(system-evals): replace the in-repo LoComo/LongMemEval runners with AMB by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4429\n* fix(coding-agents): deliver the companion skill on the plugin-manager route by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4439\n* fix(codex): preserve rollout event timestamps by @carlosrve in https://github.com/vectorize-io/hindsight/pull/4425\n* fix(openclaw): read the transcript session_end does not carry by @L4XB in https://github.com/vectorize-io/hindsight/pull/4348\n* fix(openclaw): expose knowledge tool payloads as details for Code Mode by @L4XB in https://github.com/vectorize-io/hindsight/pull/4310\n* fix(codex): support current custom tool calls by @carlosrve in https://github.com/vectorize-io/hindsight/pull/4426\n* blog: Stop Growing Your System Prompt by @benfrank241 in https://github.com/vectorize-io/hindsight/pull/4099\n* feat(transfer): unified bank transfer API (export/import) with a documented scope by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4431\n* fix(anthropic): stop the uncapped-caller default truncating long output (#4437) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4440\n* blog: What It Takes to Put a Screenshot in an Agent's Memory by @benfrank241 in https://github.com/vectorize-io/hindsight/pull/4454\n* test(multilingual): give the language-preservation retries a budget that matches the model by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4447\n* feat(openclaw): per-agent bank mapping (agentBankMap) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4446\n* fix(client): cancel capacity-retry backoff on abort by @Tosko4 in https://github.com/vectorize-io/hindsight/pull/4448\n* fix(openclaw): forward recall deadlines to the client transport by @Tosko4 in https://github.com/vectorize-io/hindsight/pull/4449\n* fix(openclaw): invalidate recall work across service generations by @Tosko4 in https://github.com/vectorize-io/hindsight/pull/4450\n* feat(transfer): clone a bank in one API call by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4444\n* fix(api): 404 recall for a bank that was never created (#4442) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4465\n* fix(api): 0 disables the recall query token cap by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4475\n* fix(migrations): scope the vector-index lookup to one relation by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4472\n* fix(transfer): build the bank archive off the event loop and outside the read transaction by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4474\n* feat(coding-agents): per-page knowledge-page config (pages) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/4467\n* ci(core-llm): run the 