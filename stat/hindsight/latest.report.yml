8eb","download_count":7,"created_at":"2026-11-24T14:20:16Z","updated_at":"2026-11-24T14:20:16Z"},{"id":787489189,"node_id":"RA_kwDOQMFwdc4u8CGl","name":"vectorize-io-hindsight-control-plane-1.3.0.tgz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":29291193,"digest":"sha256:3dab68671409f89fa77364ee928588235e3bf7358418878c65d1d8e72c1c73f4","download_count":8,"created_at":"2026-11-24T14:20:16Z","updated_at":"2026-11-24T14:20:17Z"}],"body":"## What's Changed\n* docs: changelog for v1.2.3 by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6714\n* fix(release): slim image no longer overwrites :latest by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6728\n* feat(mcp): per-bank MCP server instructions in the initialize response by @cdbartholomew in https://github.com/vectorize-io/hindsight/pull/6712\n* docs: replace retired Claude Code plugin text and dead integration link in blog and guides by @chrislatimer in https://github.com/vectorize-io/hindsight/pull/6716\n* fix(knowledge): bound the work of cutting a video, and drop files that fail for good by @cdbartholomew in https://github.com/vectorize-io/hindsight/pull/6711\n* Point 2 OpenCode blog posts to the Hindsight Coding Agents plugin (retired OpenCode install lines) by @chrislatimer in https://github.com/vectorize-io/hindsight/pull/6718\n* fix(knowledge): a table is never one oversized passage, and staged passages move inside the command timeout by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6710\n* perf(retain): don't hold a pool connection while entity resolution scores names by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6733\n* fix(kb): text search finds the passage, not only the document by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6704\n* fix(knowledge): an Office file queued behind one that kills the converter is retried alone by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6734\n* fix(knowledge): the server kills its biggest worker before the container runs out of memory by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6735\n* fix(knowledge): an Office worker converts every file with one converter by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6736\n* fix(llm): repair malformed JSON from the raw text, not the newline-escaped copy by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6737\n* test(system-evals): the knowledge edge-case sample moves to hindsight-datasets by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6741\n* feat(kb): a knowledge search can skip the reranker (enable_reranking: false) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6739\n* fix(knowledge): a cut-off video is not refused for its header's length, and an unknown codec fails at once by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6738\n* fix(knowledge): a spreadsheet declaring millions of cells is read cell by cell by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6740\n* fix(llm): share LLM slots fairly across tenants, banks and documents by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6742\n* perf(kb): time knowledge search by part, and let its vector searches use the bank's index by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6747\n* fix(kb): a PDF page is its own document in the rerank; drop the page regex rules by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6746\n* fix(knowledge): PDF calls queued when the pool is killed are retried, not cancelled by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6757\n* docs(blog): point the BEAM SOTA post to the Coding Agents integration page by @chrislatimer in https://github.com/vectorize-io/hindsight/pull/6715\n* Enable knowledge banks by default by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6676\n* fix(transfer): refuse to export a bank that does not exist by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6781\n* chore(scripts): generate-openapi.sh no longer builds the docs site by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6782\n* fix(retain): an oversized append to a JSON conversation no longer re-extracts the whole document by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6784\n* refactor(knowledge-banks): typed control-plane routes on the generated SDK by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6786\n* feat(kb): knowledge-bank search waits in a bounded queue and stops when the caller hangs up by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6790\n* feat(knowledge): server default for knowledge-bank reranking (HINDSIGHT_API_KB_ENABLE_RERANKING) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6789\n* fix(kb): no /banks/{bank_id} endpoint serves a knowledge bank; knowledge banks get their own job endpoints by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6791\n* fix(python-client): find the tag_groups union from the request field, not a generator-chosen name by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6794\n* fix(tracing): export cached input under the semconv cache-read key by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6796\n* fix(retain): keep a fact's first-retained date when its document is re-extracted by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6799\n* fix(decision-model): treat a 422 context-limit refusal as a window overflow by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6797\n* fix: kb system-test operation helpers and stale spec on main by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6800\n* feat(cli): knowledge bank commands (hindsight kb) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6793\n* feat(mcp): knowledge-bank tools over MCP, with /mcp/kb/{bank_id}/ for one knowledge bank by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6801\n* docs(knowledge-banks): CLI example for the Settings section by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6804\n* fix(docker): keep the 600s HF download timeout out of the runtime image by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6803\n* fix(reflect): a delta reply that runs to the output cap is sampled once more (#6265) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6798\n* docs(knowledge-banks): high-level overview, search params like recall, FAQ entry by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6805\n* fix(retain): coerce numeric entities to strings instead of crashing the chunk by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6808\n* fix(retain): an old replace retried after a newer one no longer rolls the document back (#6763) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6807\n* fix(llm): prompts no longer tell the model to leave out fields strict schema requires (#6752) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6806\n* fix(api): retry the OpenAI embeddings startup probe on 429 (#6709) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6810\n* fix(embed): concurrent profile merges no longer drop the database URL (#6485) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6809\n* fix(mental-models): keep the structured output when a refresh fails by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6812\n* fix(docs): drop the FAQ's /next link that breaks the production docs build by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6820\n* fix(mcp): an allowlist naming no built-in tool registers no built-ins by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6815\n* feat(clients): knowledge-bank methods on the Python and TypeScript wrappers by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6816\n* fix(llm): read Mistral's typed content blocks as text instead of crashing by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6813\n* fix(migrations): keep extension schemas we cannot relocate on the migration search_path by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6825\n* fix(mental-models): a rate-limited refresh step neither pauses the model nor costs it a search (#6674) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6823\n* perf(oracle): watermark index, batched link inserts, set-wise observation expansion, shared cursors (#6586, #6587, #6592, #6771) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6822\n* fix(ci): flaky tests and CI 429s — umbrella for 10 issues by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6824\n* fix(reflect): let HINDSIGHT_API_LLM_STRICT_SCHEMA_REFLECT take the tool turns off the grammar by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6817\n* feat(llm): add antigravity provider driving Google's agy CLI by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6830\n* refactor(decision): one decision engine for recall, triage, reflect, page refresh and the typesafe reranker by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6834\n* fix(timezone): show memory times in the bank's timezone to consolidation, reflect and the tree (#6441) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6835\n* test(system): knowledge-search context story explains its own failure (#6792) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6837\n* feat(memory-defense): let a sensitive_data rule exclude individual patterns by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6838\n* fix(transfer): let history and attachment entries pass 4 GB in a bank export (#6745) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6839\n* feat(claude-code): per-operation reasoning effort and an apiKeyHelper settings file by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6840\n* feat(recall): make the recency weight configurable with HINDSIGHT_API_RECENCY_ALPHA (#6579) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6836\n* fix(llm): a content_filter block is a content-policy refusal in every provider (#6503) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6841\n* Keep knowledge banks out of the memory-bank list's store-ordered page by @benfrank241 in https://github.com/vectorize-io/hindsight/pull/6842\n* fix(documents): a tag update no longer deadlocks with invalidating one of its memories by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6846\n* fix: two flaky tests and the evals runner key check by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6849\n* fix(mental-models): send the operation schema on the retraction pass too by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6851\n* fix(system-evals): stale fake server broke test_target; run the runner's unit tests in CI by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6854\n* fix(api): trim an oversized list limit to the endpoint's cap by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6852\n* fix(api): create the bank on a first directive instead of a raw FK 500 by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6859\n* fix(mental-models): a page whose every cited fact is gone is rebuilt, not kept (#6764) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6861\n* fix(control-plane): knowledge-bank UI polish — file-name titles, rendered Original tab, one constellation label per document, clearer upload dialog by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6860\n* fix(mental-models): delta refresh removes a deleted memory's claims reliably (#6447, #6855) by @nicoloboschi in https://github.com/vectorize-io/hindsight/pull/6847\n\n\n**Full Changelog**: https://github.com/vectorize-io/hindsight/compare/v1.2.3...v1.3.0","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":4}
