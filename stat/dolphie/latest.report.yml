{"id":388921903,"author":{"login":"charles-001","id":13244625,"node_id":"MDQ6VXNlcjEzMjQ0NjI1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOH8BJyM4XLnov","tag_name":"6.18.0","target_commitish":"main","name":"6.18.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-15T06:49:47Z","updated_at":"2026-09-15T06:50:20Z","published_at":"2026-09-15T06:50:20Z","assets":[],"body":"## Bug Fixes\n\n- **Disk IOPS counted once**: `Disk_Read` and `Disk_Write` sum the block devices that carry a mounted filesystem, each IO counted once. psutil's total counts an IO at a RAID or LVM device and again at each member under it, and adds every loop device, so on a RAID10 host with an LVM root it reported about five times the real write IOPS, and the multiple depended on the storage layout. On a platform whose counter names do not match its mount table, such as macOS, the total is used as before.\n- **Network throughput counted once**: `Network_Up` and `Network_Down` leave out loopback and any interface with a master (a bond or bridge member), whose bytes the master counts again. A bonded host reported twice its real throughput.\n- **CPU measured per instance**: `CPU_Percent` is computed from `psutil.cpu_times()` readings held on the Dolphie instance, with psutil's own arithmetic. `psutil.cpu_percent` keeps its baseline per thread, and a poll can run on any thread of the worker pool, so with a replicas worker or a second tab each thread measured a different window and started at 0. The first poll records no CPU value instead of psutil's meaningless 0, which readers of the raw sample plotted after every restart.\n- **No CPU smoothing**: A reading of 0 or 100 is kept as read. The extreme-value smoothing that replaced them with a recent mean hid a pegged host.\n\n## Testing\n\n- Tests cover stacked storage, the macOS counter fallback, bonded NICs, and CPU arithmetic on Linux, Windows, and macOS `cpu_times` tuples.\n\n## Dependency Updates\n\nNo dependency changes in this release.\n"}
