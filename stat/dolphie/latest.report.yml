{"id":388710580,"author":{"login":"charles-001","id":13244625,"node_id":"MDQ6VXNlcjEzMjQ0NjI1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOH8BJyM4XK0C0","tag_name":"6.17.1","target_commitish":"main","name":"6.17.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-15T01:35:05Z","updated_at":"2026-09-15T01:35:33Z","published_at":"2026-09-14T21:01:09Z","assets":[],"body":"## New Features\n\n- **Workload and Throughput graphs**: Dolphie now fetches the connection, slow query, select, sort, InnoDB row, network, InnoDB I/O, row lock, deadlock, and change buffer counters every poll and graphs them in new Workload and Throughput tabs. The Locks tab always shows, with row lock waits, average wait time, and lock failures, and the Disk I/O tab gains an InnoDB operations graph.\n- **Graph titles and controls**: Each graph is titled in a shared tab and its series controls sit in the graph's own cell.\n- **Data directory usage**: System utilization records `Datadir_Total`, `Datadir_Used`, and `Datadir_Mount`, read once per data directory at its mount point. Usage is left out when the data directory is not on the host Dolphie runs on.\n\n## Replay\n\n- **Row summaries** (`--replay-summary`, `replay_summary` in the config): The daemon stores a compact summary next to each row: every metric's latest value, status values, system utilization, lock states, replication state, and the age of the oldest thread. Dolphie rebuilds the graph window from summaries on a backward seek, and other tools draw timelines from `COALESCE(summary, data)` without decoding whole rows. About a kilobyte per row.\n- **Replay file layout documented**: The README now describes the SQLite tables, the compression dictionary, the summary contract, and the rules for reading a live file from another tool. A test keeps the README and the `SUMMARY_*` constants in step.\n- **WAL mode**: The daemon writes its file in WAL mode with `synchronous=NORMAL`: one fsync per checkpoint instead of four per poll, and a reader inside a query never blocks the daemon's commit. The WAL is checkpointed every 4 MB and truncated after each retention purge. Past a 64 MB WAL that a pinned reader keeps from checkpointing, the daemon pauses recording until the reader lets go, so disk use is bounded by retention plus the cap.\n- **Clean stops**: The daemon closes the replay file on SIGTERM and waits for a poll in flight, so `systemctl stop` is a clean stop. A stopped daemon's file is switched back to rollback-journal mode, so it opens read-only with no `-shm` from any directory and any SQLite version, including Jammy's 3.37.2. The daemon warns once when it recovers a `-wal` from an unclean stop and when the filesystem refuses WAL mode.\n- **UTC row timestamps**: Rows are stamped in UTC, so a file reads the same on any host and a DST change never steps the timeline back an hour. Each row also records `replay_polling_interval`, the seconds since the previous poll, so a reader can take its own rates. Files written before 6.17 hold the host's local time.\n- **Smaller rows**: Rows compress at zstd level 9, 7% smaller than before, and summaries join the prefix dictionary, which makes them 15% smaller again.\n- **Schema rotation keeps its sidecars straight**: The old file is closed before a schema change renames it, so its WAL sidecars do not end up under the new file's name.\n\n## Bug Fixes\n\n- **Replay file picker**: Load a Replay File lists only SQLite databases, so the `-wal` and `-shm` a recording daemon keeps beside `daemon.db` stay out of the list. A file the user cannot read is skipped instead of failing on open.\n- **Rate baseline after a failed poll**: The per-second rate baseline moves only after a poll that reached the metrics, so a poll that failed no longer produces a rate spike on the next one.\n- **Quieter daemon log**: The retention purge and the immutable-open fallback no longer log at INFO on every run.\n\n## Testing\n\n- Daemon replay integration tests cover WAL recovery, the pinned-reader cap, the SIGTERM close, and the summary column. Playback tests hold a key in a stalled CI loop without turning it into taps or a mid-scrub render. The snapshot report is uploaded when panel snapshots fail.\n\n## Dependency Updates\n\nNo dependency changes in this release.\n\n"}
