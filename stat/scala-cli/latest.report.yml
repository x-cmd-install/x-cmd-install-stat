3075,"digest":"sha256:5c71a9e2d664927f8f4d899d60066ed914c9f2507c71dce28070e42c76bf3955","download_count":3,"created_at":"2026-10-07T06:50:20Z","updated_at":"2026-10-07T06:50:22Z"},{"id":617850884,"node_id":"RA_kwDOFdFBRM4k06gE","name":"scala-cli-x86_64-pc-win32-sdk.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41790502,"digest":"sha256:046918fdd6380c11166305c6f77d3074ebce9d056da1bcef3ce03822a021ac3d","download_count":2,"created_at":"2026-10-07T06:50:22Z","updated_at":"2026-10-07T06:50:24Z"},{"id":617850935,"node_id":"RA_kwDOFdFBRM4k06g3","name":"scala-cli-x86_64-pc-win32.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":45772800,"digest":"sha256:ea6a62c25c620ea302c0d33518547c26f876c637b47871bd0535bfa622350f84","download_count":23,"created_at":"2026-10-07T06:50:25Z","updated_at":"2026-10-07T06:50:27Z"},{"id":617851024,"node_id":"RA_kwDOFdFBRM4k06iQ","name":"scala-cli-x86_64-pc-win32.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43050388,"digest":"sha256:1ba8bc04e4bf5a83b069b55aa7e42e4dd917e3ffe5740da0c2e39ee6bbe90455","download_count":278,"created_at":"2026-10-07T06:50:27Z","updated_at":"2026-10-07T06:50:29Z"},{"id":617851157,"node_id":"RA_kwDOFdFBRM4k06kV","name":"scala-cli.jar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":128470321,"digest":"sha256:1ec9f3f906d4cad5ef603cb5fef1561f98beb678c5c8f4a157004aa5ad1dcc91","download_count":17,"created_at":"2026-10-07T06:50:30Z","updated_at":"2026-10-07T06:50:35Z"},{"id":617851374,"node_id":"RA_kwDOFdFBRM4k06nu","name":"vc_redist.x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18731856,"digest":"sha256:843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c","download_count":0,"created_at":"2026-10-07T06:50:35Z","updated_at":"2026-10-07T06:50:36Z"}],"body":"This release is the biggest internal overhaul of Scala CLI in a while. Scala CLI itself is now built with Scala 3 Next, rather than the 3.3 LTS. At the time of this release that means Scala 3.9.0, with the main modules additionally cross-compiled and tested against the Scala 3.10 RCs (currently 3.10.0-RC3).\r\n\r\nFrom now on, Scala CLI will keep being built with the latest Scala Next version, except for the few modules which are locked to an LTS series, as they're consumed by other tools or loaded on the user's class path:\r\n\r\n| Module                  | Scala version                       | Why                                                                                                |\r\n|-------------------------|-------------------------------------|----------------------------------------------------------------------------------------------------|\r\n| most modules            | Scala 3 Next (currently 3.9.0)      | they're only ever used internally, by Scala CLI itself                                             |\r\n| `runner`, `test-runner` | 3.3 LTS (with `-Yfuture-lazy-vals`) | they're loaded on the user's class path, so they stay at 3.3 until it reaches its EOL              |\r\n| `specification-level`   | 3.3 LTS (with `-Yfuture-lazy-vals`) | it's a dependency for other tools, so it stays at 3.3 until it reaches its EOL                     |\r\n| `config`                | 3.3 LTS (with `-Yfuture-lazy-vals`) | it's a dependency of other tools (i.e. `coursier`); it will be bumped to 3.9 LTS in Scala CLI 1.19 |\r\n\r\nThe modules which stayed at Scala 3.3 LTS are now compiled with the `-Yfuture-lazy-vals` compiler option (and an explicit bytecode target: Java 11 for `runner` and `test-runner`, Java 17 for the rest). This makes their `lazy val`s use the newer implementation, which doesn't rely on `sun.misc.Unsafe`, unlike the legacy one. As a result, they can be used on JDK 24+ without issues, such as the `sun.misc.Unsafe` deprecation warnings (which will become errors on future JDKs).\r\n\r\n```scala title=jdk-demo/LazyHello.scala\r\n//> using jvm 25\r\nobject LazyHello:\r\n  lazy val greeting: String = s\"Hello from JDK ${Runtime.version.feature}!\"\r\n  def main(args: Array[String]): Unit = println(greeting)\r\n```\r\n\r\n```bash\r\nscala-cli run jdk-demo\r\n# Hello from JDK 25!\r\n```\r\n\r\nOther noteworthy changes tied to this:\r\n- **The JVM launcher of Scala CLI now requires Java 17 or newer.** Support for launching Scala CLI with JDK 11 to 16\r\n  (which used to be handled by downloading JDK 17 and re-launching the CLI with it) has been dropped. Note that this\r\n  only concerns the JVM running Scala CLI itself: the native launchers are not affected, and your code can still be\r\n  compiled for and run with older JVMs (i.e. with `--jvm 11` or `--jvm 8`).\r\n- **The using directives parser now lives in the Scala 3 compiler repository.** Scala CLI's own `directives-parser`\r\n  module has been replaced with the `org.scala-lang::scala3-directives-parser` artifact, so the `//> using` directive\r\n  syntax is now parsed by the very same code that's maintained alongside the compiler.\r\n- The sources have been migrated to newer Scala 3 syntax, where applicable.\r\n- [`scala-cli-signing`](https://github.com/VirtusLab/scala-cli-signing),\r\n  [`java-class-name`](https://github.com/VirtusLab/java-class-name) and\r\n  [`scala-js-cli`](https://github.com/VirtusLab/scala-js-cli) have also been re-built with Scala 3.9 for the purpose\r\n  of this release.\r\n\r\nAdded by [@Gedochao](https://github.com/Gedochao) in [#4466](https://github.com/VirtusLab/scala-cli/pull/4466), [#4489](https://github.com/VirtusLab/scala-cli/pull/4489) and [#4508](https://github.com/VirtusLab/scala-cli/pull/4508)\r\n\r\n### Documentation website redesign\r\nThe Scala CLI website has been redesigned - now with a refreshed home page, installation page and documentation layout, as well as a better search experience.\r\n\r\nAdded by [@cyp3rius](https://github.com/cyp3rius) in [#4522](https://github.com/VirtusLab/scala-cli/pull/4522)\r\n\r\n### `fix` sub-command improvements\r\nThe `fix` sub-command received a number of improvements in this release.\r\n\r\n#### Deprecated comma separators get removed from using directives\r\nA new built-in rule removes the deprecated comma separators from using directives (it can be turned off with `--enable-comma-separators-removal=false`).\r\n\r\n#### Directive aliases are retained\r\n`fix` used to rewrite the directives it moved to `project.scala` with their canonical names (i.e. `//> using dep` would become `//> using dependency`). The aliases are now retained.\r\n\r\n#### `--check` works for built-in rules, and reports what fails\r\n`--check` used to only be supported by the `scalafix` rules. It now works for built-in rules as well, printing a diff of what would have been changed, rather than changing anything.\r\n\r\n```scala title=fix-demo/Main.scala\r\n//> using dep com.lihaoyi::os-lib:0.11.4, com.lihaoyi::pprint:0.9.0\r\nobject Main extends App:\r\n  pprint.pprintln(os.pwd.last)\r\n```\r\n\r\n```scala title=fix-demo/Utils.scala\r\n//> using dep com.lihaoyi::upickle:4.1.0\r\nobject Utils\r\n```\r\n\r\n```bash run-fail\r\nscala-cli fix fix-demo --power --check\r\n```\r\n\r\n```text\r\nRunning built-in rules...\r\n--- project.scala\r\n+++ <expected fix>\r\n@@ -1,1 +1,2 @@\r\n-\r\n+// Main\r\n+//> using dep com.lihaoyi::os-lib:0.11.4 com.lihaoyi::pprint:0.9.0 com.lihaoyi::upickle:4.1.0\r\n--- Main.scala\r\n+++ <expected fix>\r\n@@ -1,3 +1,2 @@\r\n-//> using dep com.lihaoyi::os-lib:0.11.4, com.lihaoyi::pprint:0.9.0\r\n object Main extends App:\r\n   pprint.pprintln(os.pwd.last)\r\n--- Utils.scala\r\n+++ <expected fix>\r\n@@ -1,2 +1,1 @@\r\n-//> using dep com.lihaoyi::upickle:4.1.0\r\n object Utils\r\nbuilt-in rules failed.\r\n```\r\n\r\n<!-- Expected:\r\n+++ <expected fix>\r\n+//> using dep com.lihaoyi::os-lib:0.11.4 com.lihaoyi::pprint:0.9.0 com.lihaoyi::upickle:4.1.0\r\nbuilt-in rules failed.\r\n-->\r\n\r\nRunning without `--check` applies the changes: the commas get removed and the `dep` alias is kept.\r\n\r\n```bash\r\nscala-cli fix fix-demo --power\r\ncat fix-demo/project.scala\r\n# // Main\r\n# //> using dep com.lihaoyi::os-lib:0.11.4 com.lihaoyi::pprint:0.9.0 com.lihaoyi::upickle:4.1.0\r\n```\r\n\r\n<!-- Expected:\r\n//> using dep com.lihaoyi::os-lib:0.11.4 com.lihaoyi::pprint:0.9.0 com.lihaoyi::upickle:4.1.0\r\n-->\r\n\r\n#### Pass a custom `scalafix` version with `--scalafix-version`, excluded sources are respected\r\nThe `scalafix` version used under the hood can now be overridden with the `--scalafix-version` option. Additionally, `scalafix` rules are now only run on the project's sources, so they respect the `//> using exclude` directive (rather than scanning the whole directory).\r\n\r\n```text title=lint-demo/.scalafix.conf\r\nrules = [\r\n  DisableSyntax\r\n]\r\nDisableSyntax.noVars = true\r\n```\r\n\r\n```scala title=lint-demo/project.scala\r\n//> using exclude legacy\r\n```\r\n\r\n```scala title=lint-demo/Counter.scala\r\nobject Counter:\r\n  val count = 0\r\n```\r\n\r\n```scala title=lint-demo/legacy/Legacy.scala\r\nobject Legacy:\r\n  var count = 0 // excluded, so not linted\r\n```\r\n\r\n```bash\r\nscala-cli fix lint-demo --power --enable-built-in=false --scalafix-version 0.14.8 --check\r\n```\r\n\r\nAdded by [@warcholjakub](https://github.com/warcholjakub) in [#4486](https://github.com/VirtusLab/scala-cli/pull/4486), [#4491](https://github.com/VirtusLab/scala-cli/pull/4491), [#4492](https://github.com/VirtusLab/scala-cli/pull/4492), [#4501](https://github.com/VirtusLab/scala-cli/pull/4501), [#4503](https://github.com/VirtusLab/scala-cli/pull/4503) and [#4504](https://github.com/VirtusLab/scala-cli/pull/4504)\r\n\r\n### Better support for virtual Java inputs\r\nScala CLI uses [`java-class-name`](https://github.com/VirtusLab/java-class-name) to figure out the name of the public class of Java sources which don't come from a file (and so don't have a file name): Java snippets passed with `--java-snippet`, Java sources piped through standard input and Java code blocks in Markdown inputs.\r\nBumping it to 0.2.0 fixes a number of issues with those:\r\n- public `enum`s and `record`s with primitive components used to crash `java-class-name`;\r\n- package-private classes used to be treated as public in sources with a `package` clause;\r\n- [JEP 512](https://openjdk.org/jeps/512) compact source files (with unnamed top-level `main` methods) are now\r\n  better supported.\r\n\r\n```bash\r\necho 'public enum Color { RED, GREEN; public static void main(String[] args) { System.out.println(GREEN); } }' | scala-cli run _.java\r\n# GREEN\r\n```\r\n\r\n<!-- Expected:\r\nGREEN\r\n-->\r\n\r\n```bash\r\nscala-cli run --java-snippet 'public record Point(int x, int y) { public static void main(String[] args) { System.out.println(new Point(1, 2)); } }'\r\n# Point[x=1, y=2]\r\n```\r\n\r\n<!-- Expected:\r\nPoint[x=1, y=2]\r\n-->\r\n\r\n```bash\r\nscala-cli run --java-snippet 'package demo;\r\nclass Helper { static String greet() { return \"Hello from a package-private helper!\"; } }\r\npublic class Main { public static void main(String[] args) { System.out.println(Helper.greet()); } }'\r\n# Hello from a package-private helper!\r\n```\r\n\r\n<!-- Expected:\r\nHello from a package-private helper!\r\n-->\r\n\r\n```bash\r\nscala-cli run --jvm 25 --java-snippet 'void main() { System.out.println(\"Hello from a JEP 512 compact source snippet!\"); }'\r\n# Hello from a JEP 512 compact source snippet!\r\n```\r\n\r\n<!-- Expected:\r\nHello from a JEP 512 compact source snippet!\r\n-->\r\n\r\nFixed by [@Gedochao](https://github.com/Gedochao) in [#4521](https://github.com/VirtusLab/scala-cli/pull/4521)\r\n\r\n### Features\r\n* feat: support scalaOrganization for forked Scala toolchains by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4479\r\n* feat: support --check for built-in rules in fix by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4486\r\n* feat: report what fails fix --check for built-in rules by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4491\r\n* feat: add --scalafix-version option to fix by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4503\r\n* feat: remove deprecated comma separators from directives in fix by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4504\r\n\r\n### Fixes\r\n* Support newer `esVersion` strings; hard error on unknown `esVersion` by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4482\r\n* fix: make fix respect excluded sources when running scalafix by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4492\r\n* fix: retain directive aliases in `fix` by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4501\r\n\r\n### Compatibility\r\n* Temporarily pin `config` to legacy 3.3 LTS with `-Yfuture-lazy-vals` by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4489\r\n* Run tests for Java 27 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4485\r\n* refactor how ES version is validated by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4484\r\n\r\n### Documentation\r\n* Redesign website: Docusaurus 3, TypeScript, Tailwind, LLM entry points by @cyp3rius in https://github.com/VirtusLab/scala-cli/pull/4522\r\n* Backport #4522 to `main` by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4524\r\n\r\n### Build and internal changes\r\n* Add `.gitattributes` to recognize `.mill` files as Scala by @xuwei-k in https://github.com/VirtusLab/scala-cli/pull/4483\r\n* fix: `fix` tests not working on Windows by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4502\r\n* fix: make `all test directives get extracted` test pass on Windows by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4510\r\n* test: sources generated under .scala-build are not linted by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4493\r\n* refactor: misc flaky test fixes by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4490\r\n* Temporarily label Scala 2 nightlies' tests as flaky by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4527\r\n* Ignore JVM log lines in exact-stdout integration test assertions by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4528\r\n\r\n### Updates\r\n* Update scala-cli.sh launcher for 1.17.1 by @github-actions[bot] in https://github.com/VirtusLab/scala-cli/pull/4480\r\n* Build Scala CLI with Scala 3 Next by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4466\r\n* Bump the npm-dependencies group in /website with 4 updates by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4488\r\n* Bump image-size from 2.0.2 to 2.0.4 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4505\r\n* Bump Scala 3 Next RC to 3.10.0-RC3 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4508\r\n* Update windows-jni-utils to 0.4.0 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4497\r\n* Update jsoniter-scala-core, ... to 2.41.2 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4507\r\n* Update dependency to 0.3.3 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4496\r\n* Update `scala-cli-signing` to 0.4.0 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4500\r\n* Update slf4j-nop to 2.0.20 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4499\r\n* Update sbt to 2.0.9 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4498\r\n* Bump undici from 7.29.0 to 7.30.0 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4513\r\n* Bump sass from 1.104.1 to 1.105.0 in /website in the npm-dependencies group by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4511\r\n* Update scala-packager, scala-packager-cli to 0.3.0 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4512\r\n* Update guava to 33.7.2-jre by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4517\r\n* Bump `coursier` to 2.1.26 (was 2.1.25-M26) by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4520\r\n* Bump fast-uri from 3.1.7 to 3.1.8 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4525\r\n* Bump brace-expansion from 1.1.18 to 1.1.21 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4526\r\n* Bump `java-class-name` to 0.2.0 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4521\r\n\r\n## New Contributors\r\n* @xuwei-k made their first contribution in https://github.com/VirtusLab/scala-cli/pull/4483\r\n* @cyp3rius made their first contribution in https://github.com/VirtusLab/scala-cli/pull/4522\r\n\r\n**Full Changelog**: https://github.com/VirtusLab/scala-cli/compare/v1.17.1...v1.18.0\r\n","mentions_count":6}
