66760,"digest":"sha256:c68149c787830647fbaadc295e48bcbe34314bf721c3b630e5e44a2b0ecd45ca","download_count":2,"created_at":"2026-09-17T15:33:55Z","updated_at":"2026-09-17T15:33:57Z"},{"id":570545866,"node_id":"RA_kwDOFdFBRM4iAdbK","name":"scala-cli-x86_64-pc-win32-sdk.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":42833805,"digest":"sha256:f8e5a928d4aea03627ede0a6baf4e8d3b1401ec91883326528ffa1f6896b3c3b","download_count":3,"created_at":"2026-09-17T15:33:58Z","updated_at":"2026-09-17T15:33:59Z"},{"id":570545934,"node_id":"RA_kwDOFdFBRM4iAdcO","name":"scala-cli-x86_64-pc-win32.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":46841856,"digest":"sha256:bdba38f48d6db3ab29f6c80c2c1039ba1e8bf85e50bc91400819d137edb90bb8","download_count":34,"created_at":"2026-09-17T15:34:00Z","updated_at":"2026-09-17T15:34:02Z"},{"id":570546002,"node_id":"RA_kwDOFdFBRM4iAddS","name":"scala-cli-x86_64-pc-win32.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44106267,"digest":"sha256:01dbcabdccfc9b18d4c82b2b2093fd3d4dbcf66ffa9d2f735b906cf29dc6bd6c","download_count":264,"created_at":"2026-09-17T15:34:02Z","updated_at":"2026-09-17T15:34:05Z"},{"id":570546077,"node_id":"RA_kwDOFdFBRM4iAded","name":"scala-cli.jar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":126194961,"digest":"sha256:c7e60b3bcd060335371989508998965be158b7ffbb262e2281abac5479f85da7","download_count":27,"created_at":"2026-09-17T15:34:05Z","updated_at":"2026-09-17T15:34:10Z"},{"id":570546277,"node_id":"RA_kwDOFdFBRM4iAdhl","name":"vc_redist.x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18731856,"digest":"sha256:843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c","download_count":0,"created_at":"2026-09-17T15:34:10Z","updated_at":"2026-09-17T15:34:12Z"}],"body":"### Java 8+ support in the pure Java test runner\r\nProjects with no Scala on the class path are handled by a dedicated, pure Java test runner. It used to be compiled for\r\nJava 17, which made it impossible to run such tests on an older JVM. It is now compiled for Java 8, so the whole\r\nJava 8+ range is supported again.\r\n\r\n```java title=java-tests/test/MyTests.java\r\n//> using test.dep junit:junit:4.13.2\r\n//> using test.dep com.novocode:junit-interface:0.11\r\nimport org.junit.Test;\r\nimport static org.junit.Assert.assertEquals;\r\n\r\npublic class MyTests {\r\n  @Test\r\n  public void addition() {\r\n    assertEquals(4, 2 + 2);\r\n    System.out.println(\"Tested on Java \" + System.getProperty(\"java.version\") + \", no Scala needed!\");\r\n  }\r\n}\r\n```\r\n\r\n```bash\r\nscala-cli test java-tests --jvm 8\r\n# Tested on Java 1.8.0_492, no Scala needed!\r\n```\r\n\r\nPreviously, the very same invocation would have died while loading the test runner itself:\r\n\r\n```text\r\nException in thread \"main\" java.lang.UnsupportedClassVersionError: scala/build/testrunner/JavaDynamicTestRunner has been compiled by a more recent version of the Java Runtime (class file version 61.0), this version of the Java Runtime only recognizes class file versions up to 52.0\r\n```\r\n\r\nNote: Support for JDK <17 will likely be gradually deprecated, but running tests with Java 8+ is likely to be kept long-term for the sake of backwards compatibility.\r\n\r\nFixed by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4473\r\n\r\n### Fixes\r\n* Support Java 8+ with Scala CLI's pure Java test runner by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4473\r\n\r\n### Build and internal changes\r\n* Re-enable `scalafix` for Scala 3.10+ by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4455\r\n* Fix coursier wrapper tests by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4474\r\n\r\n### Updates\r\n* Bump colord from 2.9.3 to 2.10.0 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4460\r\n* Update scala-cli.sh launcher for 1.17.0 by @github-actions[bot] in https://github.com/VirtusLab/scala-cli/pull/4458\r\n* Bump js-yaml from 4.3.1 to 4.3.2 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4463\r\n* Bump joi from 17.13.4 to 17.13.7 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4462\r\n* Bump svgo from 3.3.4 to 3.3.5 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4461\r\n* Bump announced Scala Next RC to 3.10.0-RC1 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4457\r\n* Update org.eclipse.jgit to 7.8.0.202609011348-r by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4459\r\n* Bump Scala Next RC to 3.10.0-RC2 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4464\r\n* Bump the npm-dependencies group in /website with 4 updates by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4469\r\n* Bump announced Scala Next RC to 3.10.0-RC2 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4470\r\n* Update semanticdb-shared_2.13 to 4.17.4 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4468\r\n* Bump Mill to 1.1.9 (was 1.1.7) by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4472\r\n* Bump `scalafix` to 0.14.9 (was 0.14.8) and re-enable `fix` sub-command tests for Scala 3.10+ by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4471\r\n* Bump `scala-cli-signing` to 0.3.1 & bcpkix-jdk18on to 1.86 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4475\r\n\r\n**Full Changelog**: https://github.com/VirtusLab/scala-cli/compare/v1.17.0...v1.17.1\r\n","mentions_count":3}
