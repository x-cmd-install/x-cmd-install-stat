216361,"digest":"sha256:37682f14143ca3732e87bb13e2f6b456f098c122422ab93a096f9bf5c485b13f","download_count":1,"created_at":"2026-09-08T18:29:54Z","updated_at":"2026-09-08T18:29:56Z"},{"id":551060815,"node_id":"RA_kwDOFdFBRM4g2IVP","name":"scala-cli-x86_64-pc-win32-sdk.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":42976276,"digest":"sha256:9d209ab7068c2177c30dd7f1fcc3dd600b79b1e9506b27df95a1a5a51a32c37a","download_count":3,"created_at":"2026-09-08T18:29:56Z","updated_at":"2026-09-08T18:29:58Z"},{"id":551060863,"node_id":"RA_kwDOFdFBRM4g2IV_","name":"scala-cli-x86_64-pc-win32.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":46989312,"digest":"sha256:de4df407ea7c94692fca01ee78dc1a195e0889e9c225f74e01ff00f502d37f8f","download_count":32,"created_at":"2026-09-08T18:29:58Z","updated_at":"2026-09-08T18:29:59Z"},{"id":551060932,"node_id":"RA_kwDOFdFBRM4g2IXE","name":"scala-cli-x86_64-pc-win32.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44262281,"digest":"sha256:32142503e100d2daa09066d862a79cb1b2e305a0c239f0d8c585e2cd1407244f","download_count":251,"created_at":"2026-09-08T18:30:00Z","updated_at":"2026-09-08T18:30:02Z"},{"id":551060999,"node_id":"RA_kwDOFdFBRM4g2IYH","name":"scala-cli.jar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":127892109,"digest":"sha256:1283c6238eb9f881ef0aa034fd0aee705204b7106985e208ce8e914eaf7157fc","download_count":8,"created_at":"2026-09-08T18:30:02Z","updated_at":"2026-09-08T18:30:06Z"},{"id":551061117,"node_id":"RA_kwDOFdFBRM4g2IZ9","name":"vc_redist.x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18731856,"digest":"sha256:843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c","download_count":1,"created_at":"2026-09-08T18:30:06Z","updated_at":"2026-09-08T18:30:07Z"}],"body":"### Changed defaults to Scala 3.9.0 LTS & `lts` tags now point at the 3.9 LTS series\r\nScala 3.9.0 is both the new default Scala version and the first in line of the new Long Term Support series, so the `lts` version tags\r\n(as passed to `-S` / `--scala-version` or the `//> using scala` directive) now resolve to 3.9 rather than 3.3.\r\nAdditionally, `<prefix>.lts` tags are now recognised for any supported LTS series, which lets you pin the older 3.3 LTS\r\nexplicitly.\r\n\r\n| Tag                                          | Before          | After           |\r\n|----------------------------------------------|-----------------|-----------------|\r\n| `lts`, `3.lts`                               | 3.3.8           | 3.9.0           |\r\n| `lts.rc`, `3.lts.rc`                         | latest 3.3 RC   | latest 3.9 RC   |\r\n| `lts.nightly`, `3.lts.nightly`               | 3.3 nightly     | 3.9 nightly     |\r\n| `3.3.lts`, `3.3.lts.rc`, `3.3.lts.nightly`   | not recognised  | the 3.3 series  |\r\n| `3.9.lts`, `3.9.lts.rc`, `3.9.lts.nightly`   | not recognised  | the 3.9 series  |\r\n| `3.7.lts` (and other non-LTS `<prefix>.lts`) | not recognised  | not recognised  |\r\n\r\n```bash\r\nscala-cli -e 'println(scala.util.Properties.versionNumberString)' -S lts\r\n# Compiling project (Scala 3.9.0, JVM (25))\r\n# Compiled project (Scala 3.9.0, JVM (25))\r\n# 3.9.0\r\n```\r\n\r\n```bash\r\nscala-cli -e 'println(dotty.tools.dotc.config.Properties.simpleVersionString)' -S 3.3.lts --with-compiler\r\n# Compiling project (Scala 3.3.8, JVM (25))\r\n# Compiled project (Scala 3.3.8, JVM (25))\r\n# 3.3.8\r\n```\r\n\r\nAdded by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4442 and https://github.com/VirtusLab/scala-cli/pull/4443\r\n\r\n### JEP 512 flexible main methods\r\nScala CLI now recognises and launches [JEP 512](https://openjdk.org/jeps/512) main methods when targeting the JVM:\r\n`static` or instance `main` methods, with or without a `String` array parameter, and regardless of whether they are\r\n`public`. This requires JDK 25 or newer (or JDK 21+ with the `--enable-preview` Java option), and works for both Scala and Java sources.\r\n\r\n```scala title=HelloJep512.scala\r\n//> using jvm 25\r\nclass HelloJep512:\r\n  def main(): Unit = println(\"Hello from a JEP 512 instance main!\")\r\n```\r\n\r\n```bash\r\nscala-cli run HelloJep512.scala\r\n# Hello from a JEP 512 instance main!\r\n```\r\n\r\nOn JDK 21 through 24 the same code runs as long as preview features are enabled:\r\n\r\n```scala compile\r\n//> using jvm 21\r\n//> using javaOpt --enable-preview\r\nclass HelloJep512:\r\n  def main(): Unit = println(\"Hello on JDK 21 preview\")\r\n```\r\n\r\nSuch main methods are also detected when inherited from a Java class or interface:\r\n\r\n```java title=java-demo/Greeter.java\r\n//> using jvm 25\r\npublic abstract class Greeter {\r\n  void main() {\r\n    System.out.println(\"Hello from an inherited JEP 512 instance main!\");\r\n  }\r\n}\r\n```\r\n\r\n```java title=java-demo/HelloJava.java\r\npublic class HelloJava extends Greeter {}\r\n```\r\n\r\n```bash\r\nscala-cli run java-demo --main-class HelloJava\r\n# Hello from an inherited JEP 512 instance main!\r\n```\r\n\r\nOn older JDKs detection still happens, so instead of a bare `No main class found` you now get an actionable message:\r\n\r\n```text\r\n[error]  No main class found\r\nClass Hello declares a main method that requires JDK 25 or newer (JEP 512); the current JVM is 17.\r\n```\r\n\r\nNote: the default `package` bootstrap launcher cannot launch JEP 512 main methods as of yet, use `--assembly` or `--library`\r\ninstead. Scala.js and Scala Native are not supported for those, either.\r\n\r\nAdded by @Gedochao and @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4418, https://github.com/VirtusLab/scala-cli/pull/4425, https://github.com/VirtusLab/scala-cli/pull/4424 and https://github.com/VirtusLab/scala-cli/pull/4430\r\n\r\n### Individual files as resources\r\nIt is now possible to pass individual files (and not only directories) as resources via the `--resource` command line option and the `//> using resource`. A file passed this way lands at the root of the class path under its own name.\r\n\r\n```text title=greeting.txt\r\nHello from an individual resource file!\r\n```\r\n\r\n```scala title=ReadResource.scala\r\nobject ReadResource:\r\n  def main(args: Array[String]): Unit =\r\n    val stream = getClass.getClassLoader.getResourceAsStream(\"greeting.txt\")\r\n    println(scala.io.Source.fromInputStream(stream).mkString.trim)\r\n```\r\n\r\n```bash\r\nscala-cli run ReadResource.scala --resource greeting.txt\r\n# Hello from an individual resource file!\r\n```\r\n\r\n<!-- Expected:\r\nHello from an individual resource file!\r\n-->\r\n\r\nNote that a single file can now also be passed to the old `--resource-dir` option and `//> using resourceDir` directive.\r\n\r\n```bash\r\nscala-cli run ReadResource.scala --resource-dir greeting.txt\r\n# Hello from an individual resource file!\r\n```\r\n\r\n<!-- Expected:\r\nHello from an individual resource file!\r\n-->\r\n\r\nAdded by [@Gedochao](https://github.com/Gedochao) in [#4428](https://github.com/VirtusLab/scala-cli/pull/4428)\r\n\r\n### Library JARs from `-d` destinations ending with `.jar`\r\nWhen the destination passed to `-d` / `--compilation-output` ends with `.jar`, Scala CLI now packages the compilation\r\nresults as a library JAR (the same contents as `package --library`) rather than writing class files into a directory\r\nof that name. This mirrors `scalac -d out.jar`, so it does not require `--power`.\r\n\r\n```scala title=Greeter.scala\r\nobject Greeter:\r\n  def greeting: String = \"Hello from a packaged library JAR!\"\r\n```\r\n\r\n```bash\r\nscala-cli compile Greeter.scala -d greeter.jar\r\nscala-cli -e 'println(Greeter.greeting)' --extra-jars greeter.jar\r\n```\r\n\r\n<!-- Expected:\r\nHello from a packaged library JAR!\r\n-->\r\n\r\nAdded by [@Gedochao](https://github.com/Gedochao) in [#4426](https://github.com/VirtusLab/scala-cli/pull/4426)\r\n\r\n### The `//> using exclude` directive in `.sc` scripts\r\nThe `//> using exclude` directive used to be accepted only in the `project.scala` configuration file. It can now live\r\nin any `.sc` script instead \u2014 still in just one place per project, so it stays unambiguous. When both a `project.scala`\r\nand scripts declare excludes, the outermost `project.scala` wins.\r\n\r\n```scala title=script-demo/broken.scala\r\nthis is not valid Scala at all\r\n```\r\n\r\n```scala title=script-demo/hello.sc\r\n//> using exclude broken.scala\r\nprintln(\"Hello from a script declaring an exclude directive!\")\r\n```\r\n\r\n```bash\r\nscala-cli run script-demo\r\n```\r\n\r\n<!-- Expected:\r\nHello from a script declaring an exclude directive!\r\n-->\r\n\r\nAdded by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4429 and https://github.com/VirtusLab/scala-cli/pull/4437\r\n\r\n### Features\r\n* Support JEP 512 flexible main methods on JDK 25+ / JDK21+ with `--enable-preview` by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4418\r\n* Auto detect user-created main methods in classes named with the `*$_` suffix by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4424\r\n* Package `--library` JAR files when `-d` is set to a `*.jar` path by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4426\r\n* Allow the `//> using exclude` directive in an `.sc` script rather than just `project.scala` (but still only one place) by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4429\r\n* fix: non-public main detection (JEP 512) by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4430\r\n* Add support for passing individual files as resources by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4428\r\n* Auto detect main methods inherited from Java sources (including JEP 512 ones) by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4425\r\n* Switch `lts` tags to Scala 3.9 series by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4443\r\n\r\n### Fixes\r\n* fix: reject malformed toolkit coordinates by @warcholjakub in https://github.com/VirtusLab/scala-cli/pull/4427\r\n* Strip -scalajs from scaladoc invocation by @halotukozak in https://github.com/VirtusLab/scala-cli/pull/4431\r\n* Revert #4431 & add gated test for Scala 3.6.3+ by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4435\r\n* Make exclude order prefer outermost project.scala by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4437\r\n* Fix REPL on JDK 24+ for Scala versions with split JLine modules by @lrytz in https://github.com/VirtusLab/scala-cli/pull/4436\r\n\r\n### Build and internal changes\r\n* Maintenance/agents tests by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4414\r\n* Split CI down into smaller workflows by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4420\r\n\r\n### Updates\r\n* Bump the npm-dependencies group in /website with 5 updates by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4408\r\n* Update jsoup to 1.23.1 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4409\r\n* Update scala-cli.sh launcher for 1.16.0 by @github-actions[bot] in https://github.com/VirtusLab/scala-cli/pull/4407\r\n* Bump undici from 7.28.0 to 7.29.0 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4411\r\n* Bump fast-uri from 3.1.4 to 3.1.5 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4412\r\n* Bump brace-expansion from 1.1.16 to 1.1.18 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4413\r\n* Update jsoniter-scala-core, ... to 2.40.1 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4415\r\n* Update sbt to 2.0.5 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4416\r\n* Update munit to 1.3.5 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4417\r\n* Bump Scala 3 Next RC to 3.9.0-RC5 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4419\r\n* Bump js-yaml from 4.3.0 to 4.3.1 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4421\r\n* Bump nanoid from 3.3.16 to 3.3.18 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4423\r\n* Update sloth-core to 0.1.0-M2 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4422\r\n* Update jimfs to 1.3.2 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4433\r\n* Update guava to 33.7.1-jre by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4432\r\n* Update Scala 3 Next RC to 3.9.0-RC6 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4434\r\n* Update bloop-rifle_2.13 to 2.1.2 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4438\r\n* Bump the npm-dependencies group in /website with 2 updates by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4439\r\n* Update jsoup to 1.23.2 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4440\r\n* Bump Scala 3 Next to 3.9.0 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4442\r\n* Bump Scala Next RC to 3.10.0-RC1 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4444\r\n* Bump fast-uri from 3.1.5 to 3.1.7 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4446\r\n* Bump browserslist from 4.28.1 to 4.28.8 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4447\r\n* Update announced Scala 3 Next to 3.9.0 by @scala-steward in #4450\r\n* Update metaconfig-typesafe-config to 0.18.8 by @scala-steward in #4451\r\n* Update munit to 1.3.6 by @scala-steward in #4452\r\n* Update scalafix-interfaces to 0.14.8 by @scala-steward in #4454\r\n\r\n## New Contributors\r\n* @warcholjakub made their first contribution in https://github.com/VirtusLab/scala-cli/pull/4427\r\n* @halotukozak made their first contribution in https://github.com/VirtusLab/scala-cli/pull/4431\r\n* @lrytz made their first contribution in https://github.com/VirtusLab/scala-cli/pull/4436\r\n\r\n**Full Changelog**: https://github.com/VirtusLab/scala-cli/compare/v1.16.0...v1.17.0\r\n\r\n","mentions_count":6}
