pplication/zip","state":"uploaded","size":127813874,"digest":"sha256:65236210c1d657164a7a143f220e0b4b6130d3a4d52b03ad832c7c69896dc8ce","download_count":1985,"created_at":"2026-08-03T20:43:14Z","updated_at":"2026-08-03T20:43:17Z"},{"id":500520103,"node_id":"RA_kwDOFdFBRM4d1VSn","name":"vc_redist.x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18731856,"digest":"sha256:843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c","download_count":6,"created_at":"2026-08-03T20:43:18Z","updated_at":"2026-08-03T20:43:19Z"}],"body":"### Script wrappers backtick `$` identifiers\r\nScala 3.9+ warns that identifiers containing `$` are reserved for internal compiler use. Script wrappers historically\r\nused names such as `hello$_`, `args$` and `args$set`. Scala CLI now wraps those names in backticks across all script\r\nwrappers, so `.sc` scripts keep working cleanly on Scala 3.9 and newer.\r\n\r\n```bash\r\nscala-cli -e 'println(\"No more $ warnings in 3.9!\")' -S 3.9.0-RC4\r\n```\r\n\r\nAdded by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4378\r\n\r\n### Sloth support (experimental \u26a1\ufe0f)\r\nScala CLI can now use [Sloth](https://github.com/VirtusLab/sloth) to patch Scala 3.0\u20133.7.x lazy val bytecode for\r\ncompatibility with recent JDKs. Libraries built with older Scala 3 releases still rely on the terminally deprecated\r\n`sun.misc.Unsafe` lazy val implementation, which produces warnings on JDK 24+ and may fail on future JDKs \u2014 even when\r\nyour own sources already target Scala 3.8+.\r\n\r\nEnable Sloth with `--sloth` / `//> using sloth` to post-process classpath bytecode, or `--sloth-agent` /\r\n`//> using slothAgent` to attach Sloth as a Java agent (for example when running tests).\r\n\r\n```scala title=HelloSloth.scala\r\n\r\nobject HelloSloth:\r\n  lazy val greeting: String = \"Hello from Sloth!\"\r\n  def main(args: Array[String]): Unit = println(greeting)\r\n```\r\n\r\n```bash\r\nscala-cli --power HelloSloth.scala --sloth -S 3.3 --jvm 25\r\n```\r\n\r\nAdded by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4348\r\n\r\n### Features\r\n* Add `sloth` support by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4348\r\n\r\n### Fixes\r\n* Wrap all names containing `$` reserved character in backticks for all script wrappers by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4378\r\n* Only prepend snapshot repos for `*-SNAPSHOT` Bloop versions by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4393\r\n* Exclude `*.asc` signature files from checksums by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4403\r\n\r\n### Documentation changes\r\n* Fix typo in readme CI badge link by @SolalPirelli in https://github.com/VirtusLab/scala-cli/pull/4357\r\n\r\n### Build and internal changes\r\n* Migrate integration tests off the stale `com.spotify:docker-client` to `com.github.docker-java:docker-java*` by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4364\r\n* Add anti-regression tests for #4339 by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4376\r\n* Make sure launcher download job steps are named appropriately on the CI by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4382\r\n* Add a `[test_skip]` override for the CI by @Gedochao in https://github.com/VirtusLab/scala-cli/pull/4385\r\n\r\n### Updates\r\n* Bump @algolia/client-search from 5.55.0 to 5.55.1 in /website in the npm-dependencies group by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4355\r\n* Update scala-cli.sh launcher for 1.15.0 by @github-actions[bot] in https://github.com/VirtusLab/scala-cli/pull/4356\r\n* Update jsoniter-scala-core, ... to 2.38.17 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4358\r\n* Update sbt to 2.0.1 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4360\r\n* Update semanticdb-shared_2.13 to 4.17.1 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4359\r\n* Update scalafmt-cli_2.13, scalafmt-core to 3.11.3 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4371\r\n* Update jsoniter-scala-core, ... to 2.39.1 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4365\r\n* Update bloop-rifle_2.13 to 2.1.1 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4362\r\n* Update munit to 1.3.4 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4367\r\n* Bump the npm-dependencies group in /website with 5 updates by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4372\r\n* Bump js-yaml from 4.1.1 to 4.3.0 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4373\r\n* Update semanticdb-shared_2.13 to 4.17.2 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4369\r\n* Bump websocket-driver from 0.7.4 to 0.7.5 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4377\r\n* Update bcpkix-jdk18on to 1.85 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4379\r\n* Update metaconfig-typesafe-config to 0.18.7 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4380\r\n* Update scalafmt-cli_2.13, scalafmt-core to 3.11.4 by @scala-steward in https://github.com/VirtusLab/scala-cli/pull/4381\r\n* Bump @algolia/client-search from 5.55.2 to 5.56.0 in /website in the npm-dependencies group by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4387\r\n* Bump brace-expansion from 1.1.13 to 1.1.16 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4389\r\n* Bump shell-quote from 1.8.4 to 1.10.0 in /website by @dependabot[bot] in https://github.com/VirtusLab/scala-cli/pull/4390\r\n* Bump body-parser from 1.20.5 to 1.20.6 in /website by @dependabot[bot] in https://github.co