n":false},"content_type":"application/zip","state":"uploaded","size":7865386,"digest":"sha256:bf40586f9eb37d65f1519346be5db445009322f090d9b74d1d5f4727efe50acc","download_count":3,"created_at":"2026-10-04T14:04:50Z","updated_at":"2026-10-04T14:04:51Z"},{"id":609954969,"node_id":"RA_kwDOKVnRZM4kWyyZ","name":"basalt-0.13.0-x86_64-pc-windows-gnu.zip.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":176,"digest":"sha256:5d27fe638c67d896f5164cdce73f73465f58157bf4fcdb603de76a40a3e0996e","download_count":4,"created_at":"2026-10-04T14:04:50Z","updated_at":"2026-10-04T14:04:50Z"},{"id":609954968,"node_id":"RA_kwDOKVnRZM4kWyyY","name":"basalt-0.13.0-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3699527,"digest":"sha256:9b97117349c4df05bf42467a94c225c0babdce2e6776291ec4ac603b15dced66","download_count":19,"created_at":"2026-10-04T14:04:50Z","updated_at":"2026-10-04T14:04:51Z"},{"id":609954971,"node_id":"RA_kwDOKVnRZM4kWyyb","name":"basalt-0.13.0-x86_64-pc-windows-msvc.zip.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":177,"digest":"sha256:0f31e3950287b589f6ee3ceaa39eb4c9a66ebe06f8b0d4cf908fc21c76f1ca14","download_count":6,"created_at":"2026-10-04T14:04:50Z","updated_at":"2026-10-04T14:04:50Z"},{"id":609954992,"node_id":"RA_kwDOKVnRZM4kWyyw","name":"basalt-0.13.0-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":4330514,"digest":"sha256:975e540eba4bef766dd7a728e643731f833ed2149e6068fa1bee5756c7f541af","download_count":66,"created_at":"2026-10-04T14:04:51Z","updated_at":"2026-10-04T14:04:51Z"},{"id":609954991,"node_id":"RA_kwDOKVnRZM4kWyyv","name":"basalt-0.13.0-x86_64-unknown-linux-gnu.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":112,"digest":"sha256:df6a4d4072d3946701ef2db1cbb7555d0f61b15530e054d01c1ef5fe73f3afe0","download_count":7,"created_at":"2026-10-04T14:04:51Z","updated_at":"2026-10-04T14:04:51Z"},{"id":609954994,"node_id":"RA_kwDOKVnRZM4kWyyy","name":"basalt-0.13.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":4463391,"digest":"sha256:1d2328ce2d239db80776cd1920e2d5372570d429b74c7d1ca82d9cb84453b1d8","download_count":14,"created_at":"2026-10-04T14:04:51Z","updated_at":"2026-10-04T14:04:51Z"},{"id":609955003,"node_id":"RA_kwDOKVnRZM4kWyy7","name":"basalt-0.13.0-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:a4f250b541cc24b0fb084e4e089988d5670866b8e5436f52592b28ba5672ae91","download_count":4,"created_at":"2026-10-04T14:04:51Z","updated_at":"2026-10-04T14:04:51Z"}],"body":"https://github.com/user-attachments/assets/d300642b-33d1-4067-b490-6c61bb8a70fc\r\n\r\n### Added\r\n\r\n- [7f3e7c3](https://github.com/erikjuhani/basalt/commit/7f3e7c3ec46026672c2f74fc9f59daf62c245cbb) Move note editor cursor by whole lines, add gj/gk for screen rows by @erikjuhani\r\n\r\n> j/k now move by whole soft-wrapped lines, matching Vim. On the first line,\r\n> k goes to line start; on the last line, j goes to line end. New gj/gk\r\n> motions move by single visible rows. Screen movement drives half-page\r\n> scroll and jump-to-top so the viewport tracks rows.\r\n>\r\n> Wrap continuation is derived from a typed VirtualSpan::WrapMarker span\r\n> produced only by render, replacing the stored wrap_continuation flag.\r\n\r\n- [18bc817](https://github.com/erikjuhani/basalt/commit/18bc8171481d8d16b59983ead37b05ba1202ca12) Make note editor line wrapping configurable by @erikjuhani\r\n\r\n> Wrapping suits prose, but tables and code read better unwrapped. Add a\r\n> `wrap` toggle (default on); when off, a long line pans horizontally like\r\n> code lines already do.\r\n\r\n- [8832bc4](https://github.com/erikjuhani/basalt/commit/8832bc4691fd491d8caf50b689d64229a10fd865) Highlight the cursor's line in the note editor by @erikjuhani\r\n\r\n> Tracking the cursor across wrapped rows is hard. Tint the whole logical\r\n> line instead, in read and edit mode, replacing the heavier read-mode\r\n> reverse bar. The `line-highlight` theme key sets the colour or turns it off.\r\n\r\n- [459d9bd](https://github.com/erikjuhani/basalt/commit/459d9bdb0f69fabb216b72e32a3c929daf1f136c) Follow the link under the cursor with gx by @erikjuhani\r\n\r\n> Add a note editor action that resolves whatever link sits under the\r\n> cursor. A wiki link travels to its note, creating the note first when it\r\n> does not exist yet. A bare URL or a [label](url) markdown link opens in\r\n> the platform browser.\r\n>\r\n> A single pure scan (motion::link_at) classifies the cursor position into\r\n> a LinkTarget, which app.rs resolves against the vault (new\r\n> Vault::find_note) or hands to a cross-platform opener (command::open_url).\r\n>\r\n> Bound to gx in the vim config and to enter and gd in the default config.\r\n\r\n- [2954f5a](https://github.com/erikjuhani/basalt/commit/2954f5a99994f71476f9d6c26e72e334111b653e) Add a configurable line-number gutter to the note editor by @erikjuhani\r\n\r\n> Show line numbers while editing a note. The `line_numbers` config\r\n> accepts \"absolute\", \"relative\", or \"off\" (default \"absolute\").\r\n\r\n- [3f6b8e2](https://github.com/erikjuhani/basalt/commit/3f6b8e2492db7c4f0ee1f8106c161b425fba5147) Add single-file mode for opening a markdown file by @erikjuhani\r\n\r\n> Pass a file path to open one markdown file without a vault:\r\n>\r\n> ```\r\n> basalt path/to/note.md\r\n> ```\r\n>\r\n> The file opens in a focused view with only the note editor and the\r\n> outline. This view has no explorer pane, and the focus cycle wraps\r\n> between the editor and the outline. Basalt creates the file if it does\r\n> not exist, and a file path takes precedence over any configured vault.\r\n> Opening a vault from the selector switches back to the vault view.\r\n>\r\n> Documented the mode in the Files and Folders and Installation pages, and\r\n> added a VHS tape to showcase it.\r\n\r\n- [07c6c34](https://github.com/erikjuhani/basalt/commit/07c6c34f8df2aa309b6ef45ccd7f1f71c76dbff9) Add syntax highlighting to fenced code blocks by @erikjuhani\r\n\r\n> Fenced code blocks that name a language now get token colours. The\r\n> language is the first word of the info string, as a name or a file\r\n> extension. The highlighting comes from tree-sitter with the highlight\r\n> queries of ten grammars: Rust, TOML, JSON, Bash, JavaScript,\r\n> TypeScript, Python, Go, YAML and C. A fence without a known language\r\n> renders as plain code, as before.\r\n>\r\n> Every theme gets a [syntax] table with a colour for keywords, strings,\r\n> comments, functions, types and constants. The bundled themes set the\r\n> six colours to fit their palette.\r\n>\r\n> In edit mode the cursor's line keeps its colours while it shows the\r\n> raw text, and a run of adjacent code lines is parsed once per\r\n> keystroke. In read view the tokens of each block are cached by\r\n> language and text, so an unchanged block is not parsed again on the\r\n> next layout pass.\r\n\r\n- [9ab21ae](https://github.com/erikjuhani/basalt/commit/9ab21ae865533218ff6ec254aff2d0935ebe86c7) Tag the active READ line with a gutter marker and doc motions by @erikjuhani\r\n\r\n> READ mode now marks the active line with a slim left-gutter symbol (the\r\n> new `read_cursor` glyph) on top of the line-highlight tint, instead of\r\n> relying on the tint alone. It also respects the `gg`/`G` document\r\n> motions, and Esc or Shift+R leave READ back to the source edit view.\r\n\r\n- [188281d](https://github.com/erikjuhani/basalt/commit/188281d9d5997e952005fd9f06477c4f0e5c0766) Add fuzzy full-text search across vault notes\r\n\r\n> Open a search modal that fuzzy-matches note content line by line with\r\n> frizbee. Ranking runs in two phases: score every line cheaply, then\r\n> compute highlight indices for the top results only.\r\n>\r\n> The index builds in the background in batches, so results stream in\r\n> while indexing runs instead of waiting for the whole vault. Reads and\r\n> line splitting run in parallel with rayon. Selecting a result opens the\r\n> note at the matched line and column.\r\n>\r\n> Move the word and character motions into a shared crate::motion module\r\n> so the search input reuses them for query editing.\r\n\r\n- [56ff6ff](https://github.com/erikjuhani/basalt/commit/56ff6ff704f8ce2df9a9ad5eb28b66e618ed665c) Restore Obsidian's open tabs and write tab state back to workspace.json by @erikjuhani\r\n\r\n> Vault::workspace() already reads active and lastOpenFiles. Add the main\r\n> split/tabs/leaf layout tree, so Workspace exposes the notes open as tabs\r\n> and which one is active, in tab order. Add Vault::save_workspace to\r\n> write tabs back to workspace.json; only the fields Basalt understands\r\n> are touched, so sidebars, other panes and anything else in the file are\r\n> left as they were.\r\n>\r\n> Read the vault's .obsidian/workspace.json on open and restore every tab\r\n> Obsidian had open, in the same order, with the active one focused. Only\r\n> the active tab loads its note; the rest stay pending and load lazily on\r\n> first focus, or sooner if a background pass reaches them first, so a\r\n> vault with many open tabs opens as fast as one with a single note. Tabs\r\n> also write back: opening or closing a note, switching tabs and switching\r\n> vaults update workspace.json so Obsidian shows the same tabs next time\r\n> it opens the vault.\r\n>\r\n> This does not merge with changes Obsidian makes to the same vault while\r\n> Basalt is running. Whichever one saves last wins, so keep them pointed\r\n> at the same vault one at a time.\r\n>\r\n> workspace.json is a file Obsidian also owns, and a bug in the write path\r\n> could corrupt it, so tabs.sync in config.toml controls it: \"off\" to not\r\n> touch the file at all, \"read\" (default) to only read tabs from it, or\r\n> \"write\" to also write tab changes back, which is experimental. Tabs\r\n> themselves stay available either way.\r\n>\r\n> Closes #292\r\n\r\n### Breaking\r\n\r\n- [f4cd7f2](https://github.com/erikjuhani/basalt/commit/f4cd7f2ade6fcf62a8fe1e5ecb0a4c561de15df8) Nest editor settings under the [note_editor] table by @erikjuhani\r\n\r\n> Group the editor settings under the `[note_editor]` TOML table:\r\n> `experimental` (was `experimental_editor`), `vim_mode`, and the new\r\n> `default_mode` (\"read\" or \"edit\") that picks the view a note opens in.\r\n> Edit needs the experimental editor; without it the note opens in Read.\r\n> The runtime Config stays flat; only the parsed TOML shape nests.\r\n>\r\n> The top-level `experimental_editor` and `vim_mode` keys no longer take\r\n> effect and must move under `[note_editor]`.\r\n\r\n### Changed\r\n\r\n- [27bdefa](https://github.com/erikjuhani/basalt/commit/27bdefa3cc2b7d98380ec4577f29d45ecb25029e) Memoize note layout instead of rebuilding it every frame by @erikjuhani\r\n\r\n> The editor built the whole layout document on every frame and cloned the\r\n> result twice to draw a single screen. This slowed down the editing\r\n> experience considerably.\r\n>\r\n> By caching the layout on a cache struct of its inputs and skipping the\r\n> rebuild when nothing changed, and by cloning only the visible rows. Idle\r\n> and scroll frames drop by around ~50ms.\r\n>\r\n> Also borrow content in render_node instead of cloning it per block.\r\n\r\n- [cb6ea18](https://github.com/erikjuhani/basalt/commit/cb6ea1804e85360357d4d41a30c1ff5a065bb22c) Use the real terminal cursor for text editing by @erikjuhani\r\n\r\n> Replace the painted reversed-cell cursor in the note editor and the input\r\n> modal with the terminal's own cursor, placed via the frame. The editor keeps\r\n> its full-line highlight in read view; edit view exposes a screen position that\r\n> the app sets on the frame.\r\n>\r\n> Shape the cursor to the focused mode: a narrow bar while inserting text, a\r\n> block otherwise. Show it only for the focused component, and restore the\r\n> terminal's default shape on exit.\r\n\r\n- [8e0fa5a](https://github.com/erikjuhani/basalt/commit/8e0fa5aa5243b23f5b4050b2925c5fba15a17098) Make blank lines between blocks editable in edit mode by @erikjuhani\r\n\r\n> Blocks now tile the document: each block's editable span runs from its\r\n> start to the next block's start, so the preceding block owns the blank\r\n> lines that follow it. The cursor can rest on and edit those blanks,\r\n> which previously fell in an unreachable gap between block source ranges.\r\n\r\n- [529e607](https://github.com/erikjuhani/basalt/commit/529e607780bd01b72ff221e863e98add3910a189) Default note titles to the script font style by @erikjuhani\r\n\r\n> The note title derived from a filename rendered in Blackboard Bold\r\n> (double-struck) in the unicode and nerd-font presets. The default is now\r\n> the script style, which reads as a more title-like hand and matches the\r\n> h5/h6 heading styling that already uses it.\r\n\r\n- [c451756](https://github.com/erikjuhani/basalt/commit/c45175690bb9bbca1140d24e4d091713200502bf) Preload syntax highlighting grammars in the background at startup by @erikjuhani\r\n\r\n> Compiling every language grammar takes long enough to stall a note's\r\n> first layout. Start that compile in the background as soon as Basalt\r\n> starts, instead of blocking whichever note happens to need it first.\r\n>\r\n> A note laid out before the compile finishes renders its code blocks\r\n> plain and picks up highlighting on its next layout.\r\n\r\n### Fixed\r\n\r\n- [28429e2](https://github.com/erikjuhani/basalt/commit/28429e2440fca596a1470fe6caca9bf424a1ad03) Match title text to the symbol preset by @erikjuhani\r\n\r\n> The `\u22c5\ud835\udd6d\ud835\udd86\ud835\udd98\ud835\udd86\ud835\udd91\ud835\udd99\u22c5` title was hardcoded in the header and the splash modal,\r\n> so an `ascii` preset still emitted the dot operator and Fraktur-bold\r\n> glyphs on terminals that cannot render them. Both sites now branch on\r\n> the preset and fall back to plain `Basalt` when it is `Ascii`, while\r\n> unicode and nerd-font presets keep the stylized form.","mentions_count":1}
