{"id":316727783,"author":{"login":"nhmall","id":9643004,"node_id":"MDQ6VXNlcjk2NDMwMDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAtY4Ss4S4OHn","tag_name":"NetHack-5.0.0_Released","target_commitish":"NetHack-5.0","name":"Release build of NetHack 5.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-05-02T16:47:25Z","updated_at":"2026-05-02T17:17:36Z","published_at":"2026-05-02T17:17:36Z","assets":[],"body":"The NetHack devteam is announcing the release of NetHack 5.0.0 on\r\nMay 2, 2026\r\n\r\nNetHack 5.0 is an enhancement to the dungeon exploration game NetHack,\r\nwhich is a distant descendent of Rogue and Hack, and a direct descendent\r\nof NetHack 3.6.\r\n\r\nNetHack 5.0.0 is a release of NetHack. As a .0 version, there may be\r\nsome bugs encountered. Constructive suggestions, GitHub pull requests,\r\nand bugreports are all welcome and encouraged.\r\n\r\nAlong with the game improvements and bug fixes, NetHack 5.0 strives to\r\nmake some general architectural improvements to the game or to its\r\nbuilding process. Among them, 5.0:\r\n\r\n *  Has its source code compliant with the C99 standard.\r\n\r\n *  Removes barriers to building NetHack on one platform and operating\r\n    system, for later execution on another (possibly quite different)\r\n    platform and/or operating system. That capability is generally known\r\n    as \"cross-compiling.\"\r\n    See the file \"Cross-compiling\" in the top-level folder for more\r\n    information on that.\r\n\r\n *  The build-time \"yacc and lex\"-based level compiler, the\r\n    \"yacc and lex\"-based dungeon compiler, and the quest text file\r\n    processing previously done by NetHack's \"makedefs\" utility, have\r\n    been replaced with Lua text alternatives that are loaded and\r\n    processed by the game during play.\r\n\r\nA list of over 3100 fixes and changes can be found in the game's sources\r\nin the file doc/fixes5-0-0.txt. The text in there was written for the\r\ndevelopment team's own use and is provided \"as is\". Some entries might\r\nbe considered \"spoilers\", particularly in the \"new features\" section.\r\n\r\nExisting saved games and bones files will not work with NetHack 5.0.0.\r\n\r\nChecksums (sha256) of binaries that you have downloaded from nethack.org\r\ncan be verified on Windows platforms using:\r\n    certUtil -hashfile nethack-500-win-x64.zip SHA256\r\nor\r\n    certUtil -hashfile nethack-500-win-arm64.zip SHA256\r\n\r\nThe following command can be used on most platforms to help confirm the\r\nlocation of various files that NetHack may use:\r\n    nethack --showpaths\r\n\r\nAs with all releases of the game, we appreciate your feedback. Please\r\nsubmit any bugs using the problem report form. Also, please check the\r\n\"known bugs\" list before you log a problem - somebody else may have\r\nalready found it.\r\n\r\nHappy NetHacking!","reactions":{"total_count":86,"+1":22,"-1":0,"laugh":0,"hooray":37,"confused":0,"heart":17,"rocket":5,"eyes":5}}
