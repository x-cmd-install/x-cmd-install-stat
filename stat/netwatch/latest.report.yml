d8","download_count":14,"created_at":"2026-11-03T20:29:50Z","updated_at":"2026-11-03T20:29:51Z"}],"body":"## What's Changed\n* docs: re-record the Dense demo on NetWatch 0.39.0, on a darker background by @matthart1983 in https://github.com/matthart1983/netwatch/pull/158\n* fix(dpi): classify a TLS ClientHello that spans TCP segments by @matthart1983 in https://github.com/matthart1983/netwatch/pull/159\n* release: publish the Linux tarballs under their -static names too by @matthart1983 in https://github.com/matthart1983/netwatch/pull/163\n* build(deps): bump the actions group with 2 updates by @dependabot[bot] in https://github.com/matthart1983/netwatch/pull/162\n* build(deps): bump signal-hook from 0.3.18 to 0.4.5 by @dependabot[bot] in https://github.com/matthart1983/netwatch/pull/161\n* deps: hold unicode-width at 0.2.2; tokio, uuid, brotli, webpki-roots by @matthart1983 in https://github.com/matthart1983/netwatch/pull/164\n* docs: link the Github Awesome video from the README by @matthart1983 in https://github.com/matthart1983/netwatch/pull/166\n* docs: re-record the dense demo in diskwatch's palette by @matthart1983 in https://github.com/matthart1983/netwatch/pull/168\n* fix(graph): keep graphs readable on the default theme by @matthart1983 in https://github.com/matthart1983/netwatch/pull/169\n* refactor(resolver): remove the 0.30 journal rollback and harden recovery by @matthart1983 in https://github.com/matthart1983/netwatch/pull/170\n* feat: publish a JSON Schema for each stable output by @matthart1983 in https://github.com/matthart1983/netwatch/pull/171\n* feat: settle the config and CLI contract for the freeze by @matthart1983 in https://github.com/matthart1983/netwatch/pull/173\n* docs: write down what 1.0 promises, and hold it in place by @matthart1983 in https://github.com/matthart1983/netwatch/pull/174\n* fix: read config, policy and egress baseline as bounded regular files by @matthart1983 in https://github.com/matthart1983/netwatch/pull/175\n* fix(tui): exit as soon as q is pressed, not a refresh tick later by @matthart1983 in https://github.com/matthart1983/netwatch/pull/176\n* docs: publish the 0.40 performance numbers by @matthart1983 in https://github.com/matthart1983/netwatch/pull/177\n* docs(changelog): file the 0.40 entries under the right headings by @matthart1983 in https://github.com/matthart1983/netwatch/pull/178\n\n\n**Full Changelog**: https://github.com/matthart1983/netwatch/compare/v0.39.0...v0.40.0","reactions":{"total_count":6,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":2}
