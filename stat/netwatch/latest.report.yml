983 in https://github.com/matthart1983/netwatch/pull/73\n* feat(ui): honour NO_COLOR by @matthart1983 in https://github.com/matthart1983/netwatch/pull/74\n* feat(ui): name a refused capture and its fix on the Dashboard by @matthart1983 in https://github.com/matthart1983/netwatch/pull/77\n* docs: document the CLI surface, FreeBSD and draft platform tiers by @matthart1983 in https://github.com/matthart1983/netwatch/pull/78\n* fix(diagnose): mark the IPv6 experiment Unsupported off Linux (P28) by @matthart1983 in https://github.com/matthart1983/netwatch/pull/79\n* feat(diagnose): mark uncontracted rules beta; exit 1 only with --include-beta (P23) by @matthart1983 in https://github.com/matthart1983/netwatch/pull/80\n* test: coverage-guided fuzzing of the network parsers, in CI by @matthart1983 in https://github.com/matthart1983/netwatch/pull/82\n* ci: pin every action to a commit SHA; read-only tokens by default by @matthart1983 in https://github.com/matthart1983/netwatch/pull/83\n* ci: declare rust-version 1.95 and check it in CI by @matthart1983 in https://github.com/matthart1983/netwatch/pull/84\n* deps: nix 0.31, brotli 9, maxminddb 0.32, toml_edit 0.25, cargo update by @matthart1983 in https://github.com/matthart1983/netwatch/pull/91\n* ci: nextest with flaky-test reporting; Tier 3 jobs stop gating releases by @matthart1983 in https://github.com/matthart1983/netwatch/pull/92\n* release: attach and attest a CycloneDX SBOM; attest the GHCR image by @matthart1983 in https://github.com/matthart1983/netwatch/pull/93\n* ci: verify the Npcap SDK by SHA-256, not by npcap.com's TLS by @matthart1983 in https://github.com/matthart1983/netwatch/pull/95\n* fix typo in README.md by @andrenaP in https://github.com/matthart1983/netwatch/pull/96\n* 0.37: cargo auditable release binaries; pcap golden replay test by @matthart1983 in https://github.com/matthart1983/netwatch/pull/97\n\n## New Contributors\n* @andrenaP made their first contribution in https://github.com/matthart1983/netwatch/pull/96\n\n**Full Changelog**: https://github.com/matthart1983/netwatch/compare/v0.35.4...v0.37.0","reactions":{"total_count":5,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":2}
