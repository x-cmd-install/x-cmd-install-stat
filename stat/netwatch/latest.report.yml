ections from IP Helper, with locale-independent TCP state by @matthart1983 in https://github.com/matthart1983/netwatch/pull/103\n* feat(windows): DNS, gateway, default route and counters from IP Helper by @matthart1983 in https://github.com/matthart1983/netwatch/pull/104\n* fix(windows): ping and traceroute through the ICMP API (roadmap 5, 7) by @matthart1983 in https://github.com/matthart1983/netwatch/pull/107\n* feat(export): annotated PCAPNG export with a frozen preview by @matthart1983 in https://github.com/matthart1983/netwatch/pull/109\n* deps: ratatui 0.30, crossterm 0.29 and unicode-width 0.2 by @matthart1983 in https://github.com/matthart1983/netwatch/pull/117\n* nix: pull version from cargo.toml and fix build by @kashw2 in https://github.com/matthart1983/netwatch/pull/105\n* ci(windows): fail on English command-output matches; drop dead English fallbacks by @matthart1983 in https://github.com/matthart1983/netwatch/pull/118\n* fix: IPv6 connections join their capture streams; [addr]:port everywhere by @matthart1983 in https://github.com/matthart1983/netwatch/pull/119\n* ci: build the Nix flake; list its systems by @matthart1983 in https://github.com/matthart1983/netwatch/pull/120\n* build(deps): bump the actions group across 1 directory with 13 updates by @dependabot[bot] in https://github.com/matthart1983/netwatch/pull/116\n* nix: add versionCheckHook; optimise nix workflow by @kashw2 in https://github.com/matthart1983/netwatch/pull/129\n* release: prepare NetWatch 0.38.0 by @matthart1983 in https://github.com/matthart1983/netwatch/pull/128\n\n## New Contributors\n* @kashw2 made their first contribution in https://github.com/matthart1983/netwatch/pull/105\n* @dependabot[bot] made their first contribution in https://github.com/matthart1983/netwatch/pull/116\n\n**Full Changelog**: https://github.com/matthart1983/netwatch/compare/v0.37.0...v0.38.0","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
