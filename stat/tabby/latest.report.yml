disabled \u2014 a malicious or compromised SSH server could otherwise reach the local SSH agent unsolicited in https://github.com/Eugeny/tabby/commit/b091dc51\r\n\r\n# Changes\r\n\r\n* Allow per-profile custom SSH $TERM by @H-TTTTT in https://github.com/Eugeny/tabby/pull/11480\r\n* Add insert-new-line hotkey by @justtal in https://github.com/Eugeny/tabby/pull/11346\r\n* Add searchable vault feature for saved connections by @xhatt in https://github.com/Eugeny/tabby/pull/11121\r\n* Add long-press repeat for Enter key and retain search queries by @bluekani in https://github.com/Eugeny/tabby/pull/11389\r\n* Add Hotkey to toggle Option/Meta key on Mac based Systems by @theredcmdcraft in https://github.com/Eugeny/tabby/pull/11385\r\n* Added basic MRU tab switching #9961 by @aparfenov2 in https://github.com/Eugeny/tabby/pull/11311\r\n\r\n# Fixes\r\n\r\n* fix(core): save tab recovery state before disabling it on close by @uadhran in https://github.com/Eugeny/tabby/pull/11621\r\n* fix(ssh): parse X11 display specs without a screen number by @uadhran in https://github.com/Eugeny/tabby/pull/11620\r\n* fix: do not hide docked window while a native dialog is open by @uadhran in https://github.com/Eugeny/tabby/pull/11622\r\n* fix: show persistent activity indicator on background tab when bell fires by @uadhran in https://github.com/Eugeny/tabby/pull/11292\r\n* fix(terminal): reset terminal modes on connectable session destroy by @uadhran in https://github.com/Eugeny/tabby/pull/11423\r\n* fix(cli): CLI subcommands crash in v1.0.235 by @bluekani in https://github.com/Eugeny/tabby/pull/11513\r\n* Default value of host changed from null to empty string by @ianaflous in https://github.com/Eugeny/tabby/pull/11558\r\n* fix(ssh): import hosts without explicit HostName by @VALLIS-NERIA in https://github.com/Eugeny/tabby/pull/11598\r\n* Fix Sogou IME commit when pressing Shift on Windows by @hymsk in https://github.com/Eugeny/tabby/pull/11650\r\n* Fix Windows-only plugin install failures via broken postinstall/prepare scripts by @Blauschirm in https://github.com/Eugeny/tabby/pull/11525\r\n* fix(local): only accept directories as the session CWD by @werner-balonius in https://github.com/Eugeny/tabby/pull/11592\r\n* fix(ssh): try agent auth before disk publickey for imported profiles by @uadhran in https://github.com/Eugeny/tabby/pull/11357\r\n* Fix window title not syncing with renamed tabs by @H-TTTTT in https://github.com/Eugeny/tabby/pull/11494\r\n* Flash taskbar/dock icon when the terminal bell rings by @Yahiro025 in https://github.com/Eugeny/tabby/pull/11651\r\n* fix(electron): guard window opacity and traffic-light IPC against closed windows by @fxd0h in https://github.com/Eugeny/tabby/pull/11524\r\n* fix: add output encoding in releaseNotesTab.component.ts by @anupamme in https://github.com/Eugeny/tabby/pull/11535\r\n* fix(build): remove unused dependencies and deprecated webpack loaders by @bluekani in https://github.com/Eugeny/tabby/pull/11386\r\n* fix(ssh): surface SFTP upload errors by @chill-DA in https://github.com/Eugeny/tabby/pull/11640\r\n* fix(terminal): fix Clear terminal hotkey action in PowerShell and Clink by @bluekani in https://github.com/Eugeny/tabby/pull/11405\r\n* fix: release terminal resources on close by @nbb2025 in https://github.com/Eugeny/tabby/pull/11586\r\n* fix(local): resolve guest cwd against the shell's fsBase before validating by @vjandrea in https://github.com/Eugeny/tabby/pull/11625\r\n* fix(serial): fix serial quickConnect not working by @bluekani in https://github.com/Eugeny/tabby/pull/11384\r\n* fix(terminal): refresh profile defaults on reconnect #9834 by @AngKernel in https://github.com/Eugeny/tabby/pull/11486\r\n* feat(ssh): option to reopen duplicated/restored tabs in the last working directory by @singhible in https://github.com/Eugeny/tabby/pull/11502\r\n* fix: avoid unnecessary GPU initialization on startup by @chvrs12 in https://github.com/Eugeny/tabby/pull/11673\r\n* fix: make local file links clickable by @xnne-bot in https://github.com/Eugeny/tabby/pull/11666\r\n* fix: invalid version fallback in pluginManager.service.ts by @anupamme in https://github.com/Eugeny/tabby/pull/11675\r\n* fix(terminal): allow Fcitx5 to handle punctuation by @jairw955 in https://github.com/Eugeny/tabby/pull/11500\r\n* Fix WSL sessions not starting in home directory on newer Windows builds by @sykuang in https://github.com/Eugeny/tabby/pull/11663\r\n* Fix PowerShell 7 (pwsh) detection for Microsoft Store/MSIX installs by @sykuang in https://github.com/Eugeny/tabby/pull/11654\r\n* fix(UAC): fix \"Unknown verb -- 'inject '\" error in CMD(clink) by @bluekani in https://github.com/Eugeny/tabby/pull/11367\r\n* fix profile proxy usage by @Eugeny in https://github.com/Eugeny/tabby/commit/4d01477a\r\n\r\n## New Contributors\r\n* @VALLIS-NERIA made their first contribution in https://github.com/Eugeny/tabby/pull/11598\r\n* @hymsk made their first contribution in https://github.com/Eugeny/tabby/pull/11650\r\n* @Blauschirm made their first contribution in https://github.com/Eugeny/tabby/pull/11525\r\n* @werner-balonius made their first contribution in https://github.com/Eugeny/tabby/pull/11592\r\n* @H-TTTTT made their first contribution in https://github.com/Eugeny/tabby/pull/11494\r\n* @Yahiro025 made their first contribution in https://github.com/Eugeny/tabby/pull/11651\r\n* @fxd0h made their first contribution in https://github.com/Eugeny/tabby/pull/11524\r\n* @anupamme made their first contribution in https://github.com/Eugeny/tabby/pull/11535\r\n* @chill-DA made their first contribution in https://github.com/Eugeny/tabby/pull/11640\r\n* @nbb2025 made their first contribution in https://github.com/Eugeny/tabby/pull/11586\r\n* @vjandrea made their first contribution in https://github.com/Eugeny/tabby/pull/11625\r\n* @justtal made their first contribution in https://github.com/Eugeny/tabby/pull/11346\r\n* @AngKernel made their first contribution in https://github.com/Eugeny/tabby/pull/11486\r\n* @xhatt made their first contribution in https://github.com/Eugeny/tabby/pull/11121\r\n* @singhible made their first contribution in https://github.com/Eugeny/tabby/pull/11502\r\n* @chvrs12 made their first contribution in https://github.com/Eugeny/tabby/pull/11673\r\n* @xnne-bot made their first contribution in https://github.com/Eugeny/tabby/pull/11666\r\n* @jairw955 made their first contribution in https://github.com/Eugeny/tabby/pull/11500\r\n* @sykuang made their first contribution in https://github.com/Eugeny/tabby/pull/11663\r\n* @theredcmdcraft made their first contribution in https://github.com/Eugeny/tabby/pull/11385\r\n* @aparfenov2 made their first contribution in https://github.com/Eugeny/tabby/pull/11311\r\n\r\n**Full Changelog**: https://github.com/Eugeny/tabby/compare/v1.0.235...v1.0.236","reactions":{"total_count":22,"+1":12,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":6,"rocket":0,"eyes":0},"mentions_count":25}
