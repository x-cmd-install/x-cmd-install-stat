481\r\n* Add custom labels for individual split panes by @liewstar in https://github.com/Eugeny/tabby/pull/11613\r\n\r\n# Fixes\r\n\r\n* ssh: fix session sometimes not ending when remote shell exits by @anseltaft in https://github.com/Eugeny/tabby/pull/11692\r\n* Fix chained public key and keyboard-interactive authentication by @cofedish in https://github.com/Eugeny/tabby/pull/11492\r\n* fix(ssh): allow blank passwords in profile and keychain auth by @uadhran in https://github.com/Eugeny/tabby/pull/11358\r\n* fix(ssh): prevent port forwarding messages from polluting terminal output by @osm1892 in https://github.com/Eugeny/tabby/pull/11664\r\n* fix: honour vault passphrase remember duration and clarify unlock modal by @uadhran in https://github.com/Eugeny/tabby/pull/11342\r\n* fix(local): restore mouse scrolling in Windows TUIs by @liewstar in https://github.com/Eugeny/tabby/pull/11614\r\n* fixed #11705 - gate fcitx fix on keydown by @Eugeny in https://github.com/Eugeny/tabby/commit/93a360b5\r\n\r\n## New Contributors\r\n* @anseltaft made their first contribution in https://github.com/Eugeny/tabby/pull/11692\r\n* @cofedish made their first contribution in https://github.com/Eugeny/tabby/pull/11492\r\n* @liewstar made their first contribution in https://github.com/Eugeny/tabby/pull/11613\r\n\r\n**Full Changelog**: https://github.com/Eugeny/tabby/compare/v1.0.236...v1.0.237","reactions":{"total_count":13,"+1":4,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":6,"rocket":0,"eyes":0},"mentions_count":7}
