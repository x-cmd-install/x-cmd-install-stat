in https://github.com/Eugeny/tabby/pull/11765\r\n\r\n# Fixes\r\n\r\n* fix(terminal): unbounded O(n\u00b2) output buffer for tabs that were never focused by @meanaverage in https://github.com/Eugeny/tabby/pull/11722\r\n* fix(terminal): every closed tab leaks its terminal (WebGL cursor blink timer never disposed) by @meanaverage in https://github.com/Eugeny/tabby/pull/11720\r\n* fix(terminal): closed sessions leak via PTY IPC listeners (destroy() re-entrancy) by @meanaverage in https://github.com/Eugeny/tabby/pull/11719\r\n* fix(terminal): send current terminal size in the deferred initial resize by @anseltaft in https://github.com/Eugeny/tabby/pull/11760\r\n* fix(terminal): don't steal focus from modal dialog inputs by @siparker in https://github.com/Eugeny/tabby/pull/11745\r\n* fix(core): don't fire a hotkey twice for one keystroke by @bptrsn in https://github.com/Eugeny/tabby/pull/11769\r\n* fix(app): keep the window draggable by its tab bar while a dialog is open by @meanaverage in https://github.com/Eugeny/tabby/pull/11766\r\n* fix(ssh): pass PuTTY (.ppk) private keys to WinSCP without converting them by @manjotsc in https://github.com/Eugeny/tabby/pull/11767\r\n\r\n## New Contributors\r\n* @meanaverage made their first contribution in https://github.com/Eugeny/tabby/pull/11719\r\n* @siparker made their first contribution in https://github.com/Eugeny/tabby/pull/11745\r\n* @manjotsc made their first contribution in https://github.com/Eugeny/tabby/pull/11767\r\n* @bptrsn made their first contribution in https://github.com/Eugeny/tabby/pull/11769\r\n\r\n**Full Changelog**: https://github.com/Eugeny/tabby/compare/v1.0.237...v1.0.238","reactions":{"total_count":16,"+1":8,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":5,"rocket":0,"eyes":0},"mentions_count":5}
