build\n>\n> Everything else attached below is unaffected. See the\n> assets for what is actually here.\n\n## Changelog\n\nFeatures\n- pwa: auto-update banner when a newer build ships (742ff6f)\n- pwa: show the build timestamp in settings, in UTC (c954987)\n\nBug Fixes\n- ci: re-fetch the annotated tag before reading the release notes (3df4c37)\n- deps: refresh the workspace and clear every open advisory (ef0ca9b)\n- models: stop concurrent model fetches racing over one .part file (a53f3c5)\n- justify: calculate CJK layout using terminal display width (b869b4b)\n- justify: handle Unicode widths safely in narrow layouts (c7ec551)\n- justify: correct tab width and strengthen Unicode mutation coverage (b671c55)\n- justify: keep long continuation words within column width (0d8bcaf)\n- ci: restore workspace and native PR checks (b16dcf7)\n\nMiscellaneous Tasks\n- pwa: reword the support-the-project blurb (b935247)\n- tools: cap incremental build caches at 4 GB (6c936f3)\n\nRefactor\n- retire the hygg-pdf-extract and hygg-cff-parser forks (11902e3)\n\nDocumentation\n- docker: correct how the GHCR page sources license and README (2ef8107)\n- readme: drop the Star History section (f051130)\n- record the advisories this tree carries knowingly (9f10d53)\n- fix broken links and bump pinned versions to 0.1.26 (3c7e0b8)\n\nStyling\n- pwa: rewrap an install.rs doc comment to satisfy rustfmt (9621648)\n- pwa: add 8px gap below the account create/sign-in tabs (423370e)\n\nTesting\n- justify: cover Unicode-related formatter paths completely (6a414ae)\n- justify: add bounded Unicode property tests (0b055d4)\n- justify: gate scoped mutation scores for Unicode and TOC (3dc0f75)\n\nCI\n- pre-install libimobiledevice for the iOS build (ba5e1c2)\n- stop the weekly scheduled runs on ci, docker and native-apps (c408d71)\n- release: ship the Windows desktop app as a portable zip (73c50eb)\n\n\n"}
