729662fcfcc03dbd043abf4a976d21c966678378017ca3cfbfb29d9fe","download_count":10,"created_at":"2026-07-17T18:24:06Z","updated_at":"2026-07-17T18:24:06Z"}],"body":"Prebuilt downloads are below \u2014 or `cargo install hygg` for the CLI,\nand the web app needs no download: https://kruseio.github.io/hygg/\n\nWhat the assets are, which one you want, and how to verify them:\nhttps://github.com/kruseio/hygg/blob/0.1.26/docs/pages/release.md\n\n> [!WARNING]\n> Some builds did not complete for this tag, so this release\n> is missing part or all of:\n> - iOS simulator build\n>\n> Everything else attached below is unaffected. See the\n> assets for what is actually here.\n\n## Changelog\n\nFeatures\n- pwa: faithful GitHub Star button, left of the Sync action (100de9a)\n- pages: continuously deploy main to a /main channel (ba713c8)\n- server: claim the data directory, and refuse a stranger's (5dc2bab)\n- pwa: move the sync action beside the import button (d7dbba6)\n- tools: derive the version, the changelog and the tag from the commits (a61a974)\n- shared: signup and commerce wire DTOs (667c388)\n- server: POST /api/v1/signup and a public web-session seam (76ff83a)\n- pwa: streamlined signup, sign-in and a dormant subscribe flow (31789a9)\n\nBug Fixes\n- pages: make the <base> injector robust to Trunk dropping <head> (71a5c33)\n- pages: SPA deep-link routing + service-worker deploy isolation (f719af3)\n\nMiscellaneous Tasks\n- drop hygg-saas leftovers and correct stale docs (b6fa9d5)\n\nDocumentation\n- add a Responsible AI page (aad190a)\n\n"}
