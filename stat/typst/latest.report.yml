ed_at":"2026-07-17T11:18:41Z","updated_at":"2026-07-17T11:18:43Z"},{"id":480303335,"node_id":"RA_kwDODI8QW84coNjn","name":"typst-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22463684,"digest":"sha256:19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736","download_count":50459,"created_at":"2026-07-17T11:22:42Z","updated_at":"2026-07-17T11:22:43Z"},{"id":480300761,"node_id":"RA_kwDODI8QW84coM7Z","name":"typst-x86_64-unknown-linux-musl.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":17462992,"digest":"sha256:a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c","download_count":354511,"created_at":"2026-07-17T11:19:35Z","updated_at":"2026-07-17T11:19:36Z"}],"body":"[View changelog with links into the documentation on typst.app/docs](https://typst.app/docs/changelog/0.15.1/)\r\n\r\n## Library\r\n\r\n### Text\r\n\r\n-   Updated New Computer Modern fonts to version 8.1.1, fixing a bug where the regular weight of the math font was still using the old calligraphic letterforms that were supposed to live in stylistic set 6\r\n\r\n### Math\r\n\r\n-   Fixed a regression where alignment points did not work correctly when placed within `lr` / matched delimiters\r\n-   Fixed a regression where `op` elements could be vertically misaligned\r\n\r\n### Layout\r\n\r\n-   Fixed a bug where gaps could appear in multi-page lists with `number-align` / `marker-align` set to an alignment with a vertical component\r\n\r\n## Export\r\n\r\n### SVG\r\n\r\n-   Fixed that inline SVGs resulting from `html.frame` elements did not respect pretty printing\r\n\r\n### Bundle\r\n\r\n-   In the watch server, the automatic selection of appropriate `Content-Type` headers based on file extensions was expanded to include more commonly used file types (e.g. `json` files)\r\n-   The error for PNG/SVG documents with multiple pages is now only raised if it persists until the final document iteration\r\n\r\n## Command Line Interface\r\n\r\n-   The `typst eval` subcommand will now exit with code 1 when the provided expression fails to evaluate\r\n\r\n## Contributors\r\n\r\nThanks to everyone who contributed to this release: @Marcono1234, @mkorje, @DevlinNul, @Hyperrick, @Lege19, @cady-b, @e345ee, @saecki.","reactions":{"total_count":64,"+1":17,"-1":0,"laugh":0,"hooray":11,"confused":0,"heart":27,"rocket":7,"eyes":2},"mentions_count":8}
