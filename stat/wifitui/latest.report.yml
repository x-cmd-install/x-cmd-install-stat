ix for #171 \r\n\r\n## What's Changed\r\n* wifi/iwd: Fix iwd backend to use actual D-Bus API by @xdamman in https://github.com/shazow/wifitui/pull/174\r\n* Check NetworkManager availability, add backend fallback and tests by @shazow in https://github.com/shazow/wifitui/pull/173\r\n* tests: Reuse sleep durations and make configurable by @shazow in https://github.com/shazow/wifitui/pull/168\r\n\r\n## New Contributors\r\n* @xdamman made their first contribution in https://github.com/shazow/wifitui/pull/174\r\n\r\n**Full Changelog**: https://github.com/shazow/wifitui/compare/v0.12.0...v0.13.0","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":2}
