{"id":340923358,"author":{"login":"parvardegr","id":9450866,"node_id":"MDQ6VXNlcjk0NTA4NjY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOIItkds4UUhPe","tag_name":"v1.4.0","target_commitish":"main","name":"v1.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-06-17T16:48:58Z","updated_at":"2026-06-17T16:50:59Z","published_at":"2026-06-17T16:50:59Z","assets":[],"body":"## easy-sharing v1.4.0 \ud83d\ude80\r\n\r\nThe biggest update yet \u2014 share *more*, with *less* fuss.\r\n\r\n### \u2728 Highlights\r\n- **It just works.** We now pick the right Wi-Fi address automatically (no more \"the QR scans but the page won't load\" on Docker/VPN/WSL machines). Stuck? Use `--interface` or open `/qr` in a browser with `--open`.\r\n- **Send a pile, not a file.** Receiving now takes **multiple files at once** with **drag-and-drop**.\r\n- **Grab a whole folder in one tap** with the new \"Download as `.zip`\" button.\r\n- **Clipboard, both ways.** Shared clipboard text opens with a one-tap **Copy** button \u2014 and you can now **send a note or link from your phone back to your terminal**.\r\n- **Private in one flag.** `--secure` = a secret link + an auto-generated password + HTTPS. (And `-S` now creates its own certificate \u2014 no more `-C`/`-K` setup.)\r\n- **Self-destructing shares.** `--once` stops after the first transfer; `--timeout 10m` stops on a timer.\r\n\r\n### \ud83d\udd12 Safer by default\r\nUploads can't escape the shared folder or overwrite your files, secret links stay out of logs, and an unprotected share now warns you.\r\n"}
