ce by @vlasky in https://github.com/micahkepe/jsongrep/pull/47\r\n* fix(parser): reject /regex/ queries cleanly; make [usize::MAX] well-defined by @vlasky in https://github.com/micahkepe/jsongrep/pull/41\r\n* fix(cli): read input as bytes; fall back from mmap for non-regular files by @vlasky in https://github.com/micahkepe/jsongrep/pull/42\r\n* fix(dfa): cap state count during determinization (bounded compilation) by @vlasky in https://github.com/micahkepe/jsongrep/pull/43\r\n* fix(cli): make --porcelain honest - force colors off, imply --compact by @vlasky in https://github.com/micahkepe/jsongrep/pull/48\r\n* feat(cli): -r/--raw-output prints matched strings unquoted (jq -r) by @vlasky in https://github.com/micahkepe/jsongrep/pull/44\r\n* ci: test on macOS/Windows, add MSRV job, cache, full-target clippy, doc gate by @vlasky in https://github.com/micahkepe/jsongrep/pull/56\r\n* ci(release): gate cargo publish on tests and binary builds; pin actions by SHA by @vlasky in https://github.com/micahkepe/jsongrep/pull/57\r\n* fix(ast): keep '.' separator where omitting it changes query meaning by @vlasky in https://github.com/micahkepe/jsongrep/pull/53\r\n* perf(output): skip unused path strings and stop formatting on broken pipe by @vlasky in https://github.com/micahkepe/jsongrep/pull/38\r\n* perf(dfa): eliminate per-key allocations on the document-walk hot path by @vlasky in https://github.com/micahkepe/jsongrep/pull/35\r\n* feat(cli): -e/--exit-status and -q/--quiet with grep exit codes by @vlasky in https://github.com/micahkepe/jsongrep/pull/45\r\n* perf(cli): parse JSONL per line instead of building a synthetic array string by @vlasky in https://github.com/micahkepe/jsongrep/pull/37\r\n* fix(grammar): accept chained array accesses like foo[0][1] by @vlasky in https://github.com/micahkepe/jsongrep/pull/52\r\n* fix(parser): decode UTF-16 surrogate pairs in quoted fields by @vlasky in https://github.com/micahkepe/jsongrep/pull/51\r\n* feat(cli): multiple file arguments, file headings, -l/--files-with-matches by @vlasky in https://github.com/micahkepe/jsongrep/pull/49\r\n* fix(ast): parenthesize modified display operands that need it by @vlasky in https://github.com/micahkepe/jsongrep/pull/54\r\n* perf(dfa): rework subset construction around bitsets and a label-symbol table by @vlasky in https://github.com/micahkepe/jsongrep/pull/36\r\n* fix(ast): elide empty subqueries in sequence display by @vlasky in https://github.com/micahkepe/jsongrep/pull/58\r\n* perf(dfa): visitor-based traversal with early exit, find_limited, -m/--max-count by @vlasky in https://github.com/micahkepe/jsongrep/pull/39\r\n* test: add property-based suite for parse, DFA build, and display by @vlasky in https://github.com/micahkepe/jsongrep/pull/59\r\n* feat(cli): `--glob` + `--files` options by @micahkepe in https://github.com/micahkepe/jsongrep/pull/60\r\n\r\n## New Contributors\r\n* @vlasky made their first contribution in https://github.com/micahkepe/jsongrep/pull/40\r\n\r\n**Full Changelog**: https://github.com/micahkepe/jsongrep/compare/v0.9.0...v0.10.0","mentions_count":2}
