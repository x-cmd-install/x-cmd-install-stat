{"id":386979968,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOeox5c4XENiA","tag_name":"v0.35.0","target_commitish":"main","name":"Release v0.35.0","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-09-11T11:14:34Z","updated_at":"2026-09-11T15:52:12Z","published_at":"2026-09-11T11:16:32Z","assets":[],"body":"## What's Changed\r\n* fix(server): stop a dropped capability listing from killing the client by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/301\r\n* fix(client): forward structuredContent when a tool sends no text by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/309\r\n* fix(streaming): stop a failed chunk from silently emptying the response by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/310\r\n* chore(deps): bump any-llm-sdk to 1.27.2 by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/312\r\n* fix: tool calls and stream errors against cloud providers by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/313\r\n* chore(deps): bump typer from 0.27.1 to 0.27.2 by @dependabot[bot] in https://github.com/jonigl/mcp-client-for-ollama/pull/308\r\n* docs: add logging information for ollmcp in README files by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/315\r\n* fix(streaming): close the response stream when a silent run is aborted by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/316\r\n* fix(streaming): don't print the thinking header for whitespace-only reasoning by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/317\r\n* feat: add /new command and group alternate command names in autocomplete by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/318\r\n* chore(release): bump version to 0.35.0 by @jonigl in https://github.com/jonigl/mcp-client-for-ollama/pull/319\r\n\