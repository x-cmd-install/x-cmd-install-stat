pull/6381\r\n* feat(mongodb): migrate CLI namespace from v1alpha1 to stable v1 API by @jremy42 in https://github.com/scaleway/scaleway-cli/pull/6298\r\n* chore(core): migrate the lb, mcp and mnq namespaces to go-vcr.v4 by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6386\r\n* chore(deps): bump github.com/moby/buildkit from 0.33.0 to 0.33.1 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6384\r\n* chore(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.113.4 to 1.114.0 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6385\r\n* fix(search): rename resource type datalab by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6371\r\n* fix(rdb): improve engine autocompletion by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6390\r\n* feat: add support for default version for redis create and autocomplete by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6383\r\n* fix(alias): fix panic with empty aliases by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6392\r\n* chore(deps): bump github.com/moby/moby/client from 0.6.0 to 0.6.1 by @dependabot[bot] in https://github.com/scaleway/scaleway-cli/pull/6394\r\n* chore: avoid using internal as a file name by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6396\r\n* feat(devcontainers): mise trust and install on start, read-only mount configuration by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6399\r\n* chore(core): migrate redis, registry, secret, test and webhosting to go-vcr-.v4 by @elwinar in https://github.com/scaleway/scaleway-cli/pull/6389\r\n* chore(account): remove deprecated code on ValidateAuthenticationCodeSignUpResponse message by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6388\r\n* feat(mongodb): add project_id when listing node types by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6398\r\n* docs(mongodb): add descriptions to the EndpointSpec