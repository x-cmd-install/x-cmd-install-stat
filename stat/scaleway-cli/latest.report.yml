type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":57123328,"digest":"sha256:3e427e2c950600e31e2d736f356d16a6ed833ec0c6dc1e2894e95671dc0d1eb5","download_count":17,"created_at":"2026-11-23T14:32:46Z","updated_at":"2026-11-23T14:32:48Z"},{"id":783276947,"node_id":"RA_kwDOAfEQr84ur9uT","name":"scaleway-cli_2.67.0_windows_amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":60647424,"digest":"sha256:ef9554afba20397fecdb551c3544019ba07ebbb3e722e00e583bebd550fcf799","download_count":55,"created_at":"2026-11-23T14:32:46Z","updated_at":"2026-11-23T14:32:49Z"},{"id":783276464,"node_id":"RA_kwDOAfEQr84ur9mw","name":"scaleway-cli_2.67.0_windows_arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":54870016,"digest":"sha256:b0b139cd2e0dfe4b23e1f1f94dfb0ce953093ca95493d7cafa6febfc2c94dad3","download_count":20,"created_at":"2026-11-23T14:32:39Z","updated_at":"2026-11-23T14:32:41Z"},{"id":783277499,"node_id":"RA_kwDOAfEQr84ur927","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1706,"digest":"sha256:49182423f8b91b26c6c600add877ab5eca327636c1d17827b577cdff98f3b5df","download_count":645,"created_at":"2026-11-23T14:32:56Z","updated_at":"2026-11-23T14:32:56Z"}],"body":"[**v2.66.2 → v2.67.0**](https://github.com/scaleway/scaleway-cli/compare/v2.66.2...v2.67.0) · Nov 23, 2026 · 5 commits\r\n\r\n## Table of Contents\r\n\r\n- [Audit trail](#audit-trail)\r\n  - [Magic-link authentication events](#magic-link-authentication-events)\r\n- [Bug fixes](#bug-fixes)\r\n- [Contributors](#contributors)\r\n- [Internal and tooling](#internal-and-tooling)\r\n\r\n---\r\n\r\n## Audit trail\r\n\r\n### Magic-link authentication events\r\n\r\nAudit Trail now recognizes sign-ins done through a magic link (the passwordless email login). Authentication events for those sessions report the `magic_link` authentication method, and a failed magic-link attempt records `invalid_magic_link` as its failure reason — so security tooling can tell magic-link logins apart from password, passkey and SSO logins without guessing. The new values appear in the JSON output of the audit event listing:\r\n\r\n```sh\r\nscw audit-trail event list -o json\r\n```\r\n\r\nLook for `\"method\": \"magic_link\"` on sign-in events and `\"failure_reason\": \"invalid_magic_link\"` on the failed attempts.\r\n\r\n[#6834](https://github.com/scaleway/scaleway-cli/pull/6834) · [commit 0aaf13a](https://github.com/scaleway/scaleway-cli/commit/0aaf13a55a8f861a1cc2f6eaf8b930756d120703)\r\n\r\n## Bug fixes\r\n\r\n- **mcp**: `scw mcp server serve` with `transport=streamable-http` bound its server to `:8080` on **all network interfaces**, exposing any AI agent pointed at the machine to a live CLI. The default address is now `localhost:8080`, so the server only listens on the loopback interface unless you pass an explicit `address=`.\r\n\r\n```sh\r\nscw mcp server serve transport=streamable-http\r\n```\r\n\r\n[#6839](https://github.com/scaleway/scaleway-cli/pull/6839) · [commit 2d6ba04](https://github.com/scaleway/scaleway-cli/commit/2d6ba04a4ec7c75c0d00b9b054ce41ab16807429)\r\n\r\n- **mcp**: the MCP server registered tools that could **leak credentials** to the agent calling them. Commands that reveal the secret key (`scw info` with `show-secret=true`, `scw k8s kubeconfig get`, `scw k8s execcredentials`), forward it to a remote node over SSH (`scw k8s pool add-external-node`), drop into an interactive console (`scw instance server console`) or embed write tokens (`scw cockpit config get`) are now excluded from the tools the server exposes.\r\n\r\n[#6840](https://github.com/scaleway/scaleway-cli/pull/6840) · [commit 47f98f8](https://github.com/scaleway/scaleway-cli/commit/47f98f86720fe7d6b9edd1726e1c1529966cabe2)\r\n\r\n## Contributors\r\n\r\nThanks to everyone who contributed to this release:\r\n\r\n- [@elwinar](https://github.com/elwinar)\r\n- [@remyleone](https://github.com/remyleone)\r\n\r\n## Internal and tooling\r\n\r\n- Internal changes are not listed individually: JSON serialization migrated to the standard library's `encoding/json/v2`, plus release-notes tooling work.\r\n"}
