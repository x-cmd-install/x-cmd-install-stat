)\r\n\r\n## What's Changed\r\n\r\n### Feat\r\n\r\n* feat(audit-trail): improve visualization by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6521\r\n* feat(k8s): add pool private network by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6524\r\n* feat(instance): add support for `it-mil-2` and `it-mil-3` by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6526\r\n* feat(autoscaling): add support for `it-mil-1`, `it-mil-2` and `it-mil-3`  by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6527\r\n* feat(kafka): add support for `volume-size-bytes` in update by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6528\r\n* feat: migrate scw redis cluster connect to use connect by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6496\r\n* feat(instance): add support for listing ip with `server` and `detached` by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6536\r\n* feat(instance): enable SG on pnics by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6539\r\n* feat(ipam): add new lb_ip resource  by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6560\r\n* feat(baremetal): add commitment on servers by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6578\r\n* feat: improve visualisation for scw billing charge list by @remyleone in https://github.com/scaleway/scaleway-cli/pull/6566\r\n* feat(autocomplete): use profile flag in completion by @yfodil in https://github.com/scaleway/scaleway-cli/pull/6588\r\n* feat(instance): migrate server-type commands to v2 by @Mia-Cross in https://github.com/scaleway/scaleway-cli/pull/6491\r\n* feat(object): add support for 's3-endpoint' to bucket cmds by @pypaut in https://github.com/scaleway/scaleway-cli/pull/5636\r\n* feat(interlink): expose dedicated connection commands in the CLI by @scaleway-bot in https://github.com/scaleway/scaleway-cli/pull/6614\r\n* feat(webhosting): update database name an