r/oh-my-posh/commit/e2024d26d90e8f554e4d91c2a532416a949e170e))","reactions":{"total_count":7,"+1":3,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":0}}
