5c0bad5681d4f38d3c4f2a88a7b9724ca7ae9417e3408953f1044e0a23b0","download_count":12,"created_at":"2026-09-01T08:40:14Z","updated_at":"2026-09-01T08:40:15Z"},{"id":539254410,"node_id":"RA_kwDOBMdURM4gJF6K","name":"critest-v1.37.0-windows-amd64.tar.gz.sha256","label":"","uploader":{"login":"saschagrunert","id":695473,"node_id":"MDQ6VXNlcjY5NTQ3Mw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":65,"digest":"sha256:2d29561ec138ba96466adb3ebf25b4a47f90ec7a9b7c422dcbbf00e24144b882","download_count":11,"created_at":"2026-09-01T08:40:13Z","updated_at":"2026-09-01T08:40:13Z"},{"id":539254392,"node_id":"RA_kwDOBMdURM4gJF54","name":"critest-v1.37.0-windows-amd64.tar.gz.sha512","label":"","uploader":{"login":"saschagrunert","id":695473,"node_id":"MDQ6VXNlcjY5NTQ3Mw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":129,"digest":"sha256:3d5b7ad245b1b2f884d4622348cb3be039e3e263d86935a198120961365dd788","download_count":11,"created_at":"2026-09-01T08:40:12Z","updated_at":"2026-09-01T08:40:13Z"}],"body":"## Changes by Kind\n\n### Feature\n\n- Add --max-retries flag for crictl connection retry with exponential backoff (default: 3). (#2108, @saschagrunert)\n- An NRI test case for StopPodSandbox. (#2104, @SergeyKanzhelev)\n- Basic test in critest for container-related NRI callbacks. (#2118, @SergeyKanzhelev)\n- NRI test in critest to ensure that Stop event will be sent for container that exited by itself. (#2125, @SergeyKanzhelev)\n- New cirtest to verify NRI callbacks during Pod sandbox stop API call handling (#2126, @SergeyKanzhelev)\n- New critest conformance tests for image volumes. (#2039, @SergeyKanzhelev)\n- Opentelemetry tracing will have a root span for each execution that combines together all gRPC calls crictl makes to runttime during execution (#1992, @SergeyKanzhelev)\n- Test Synchronize config and race conditions (#2137, @SergeyKanzhelev)\n- The critest now allow to validate the NRI callbacks sequence and node lifecycle in relation with the CRI API. (#2071, @SergeyKanzhelev)\n\n### Bug or Regression\n\n- Crictl now describes container environment variable values as plain strings in the output of `crictl create jsonschema --container` and `crictl run jsonschema --container`, instead of incorrectly advertising them as base64 encoded. (#2154, @locker95)\n- Crictl: Fix inspect command's name and namespace filters being silently ignored. (#2142, @saschagrunert)\n- Fix `crictl update --oom-score-adj` flag being silently ignored, fix panic in `crictl logs --previous` with extensionless log paths, and fix misleading TLS streaming error message. (#2160, @saschagrunert)\n\n### Other (Cleanup or Flake)\n\n- Crictl: Invalid regex patterns for name and namespace filters now return a clear error instead of silently matching nothing. (#2141, @saschagrunert)\n- Crictl: The `create` and `run` commands now support `CRICTL_CREDS`/`CRICTL_AUTH` environment variables and the `-u` alias for `--username`, aligning them with `pull`. (#2100, @saschagrunert)\n\n### Uncategorized\n\n- Tests on NRI plugin failure in CreateContainer and RunPodSandbox. (#2136, @SergeyKanzhelev)\n\n## Dependencies\n\n### Added\n- cloud.google.com/go/auth: v0.18.2\n- github.com/apapsch/go-jsonmerge/v2: [v2.0.0](https://github.com/apapsch/go-jsonmerge/tree/v2.0.0)\n- github.com/brianvoe/gofakeit/v7: [v7.12.1](https://github.com/brianvoe/gofakeit/tree/v7.12.1)\n- github.com/containerd/log: [v0.1.0](https://github.com/containerd/log/tree/v0.1.0)\n- github.com/containerd/nri: [v0.12.2](https://github.com/containerd/nri/tree/v0.12.2)\n- github.com/containerd/ttrpc: [v1.2.7](https://github.com/containerd/ttrpc/tree/v1.2.7)\n- github.com/go-openapi/analysis: [v0.25.5](https://github.com/go-openapi/analysis/tree/v0.25.5)\n- github.com/go-openapi/errors: [v0.22.8](https://github.com/go-openapi/errors/tree/v0.22.8)\n- github.com/go-openapi/loads: [v0.25.0](https://github.com/go-openapi/loads/tree/v0.25.0)\n- github.com/go-openapi/runtime/server-middleware: [v0.30.0](https://github.com/go-openapi/runtime/tree/server-middleware/v0.30.0)\n- github.com/go-openapi/runtime: [v0.33.0](https://github.com/go-openapi/runtime/tree/v0.33.0)\n- github.com/go-openapi/spec: [v0.22.9](https://github.com/go-openapi/spec/tree/v0.22.9)\n- github.com/go-openapi/strfmt: [v0.27.0](https://github.com/go-openapi/strfmt/tree/v0.27.0)\n- github.com/go-openapi/swag/cmdutils: [v0.28.0](https://github.com/go-openapi/swag/tree/cmdutils/v0.28.0)\n- github.com/go-openapi/swag/conv: [v0.28.0](https://github.com/go-openapi/swag/tree/conv/v0.28.0)\n- github.com/go-openapi/swag/fileutils: [v0.28.0](https://github.com/go-openapi/swag/tree/fileutils/v0.28.0)\n- github.com/go-openapi/swag/jsonutils: [v0.28.0](https://github.com/go-openapi/swag/tree/jsonutils/v0.28.0)\n- github.com/go-openapi/swag/loading: [v0.28.0](https://github.com/go-openapi/swag/tree/loading/v0.28.0)\n- github.com/go-openapi/swag/mangling: [v0.28.0](https://github.com/go-openapi/swag/tree/mangling/v0.28.0)\n- github.com/go-openapi/swag/netutils: [v0.28.0](https://github.com/go-openapi/swag/tree/netutils/v0.28.0)\n- github.com/go-openapi/swag/pools: [v0.28.0](https://github.com/go-openapi/swag/tree/pools/v0.28.0)\n- github.com/go-openapi/swag/stringutils: [v0.28.0](https://github.com/go-openapi/swag/tree/stringutils/v0.28.0)\n- github.com/go-openapi/swag/typeutils: [v0.28.0](https://github.com/go-openapi/swag/tree/typeutils/v0.28.0)\n- github.com/go-openapi/swag/yamlutils: [v0.28.0](https://github.com/go-openapi/swag/tree/yamlutils/v0.28.0)\n- github.com/go-openapi/validate: [v0.26.1](https://github.com/go-openapi/validate/tree/v0.26.1)\n- github.com/go-viper/mapstructure/v2: [v2.5.0](https://github.com/go-viper/mapstructure/tree/v2.5.0)\n- github.com/gogo/protobuf: [v1.3.2](https://github.com/gogo/protobuf/tree/v1.3.2)\n- github.com/google/s2a-go: [v0.1.9](https://git