e_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":112,"digest":"sha256:58d36a60c844f5e297ced184bf579dbf877b809d9327f062f86c236b982c9b8f","download_count":2,"created_at":"2026-11-03T13:13:26Z","updated_at":"2026-11-03T13:13:26Z"},{"id":705664043,"node_id":"RA_kwDORj5l3c4qD5Qr","name":"h5i-websec-v0.5.3-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3236156,"digest":"sha256:905b03004dea804efcfd6b489c65ffb47cb23a07ae3ae13b45fd5f99dba87510","download_count":2,"created_at":"2026-11-03T13:13:26Z","updated_at":"2026-11-03T13:13:26Z"},{"id":705664056,"node_id":"RA_kwDORj5l3c4qD5Q4","name":"h5i-websec-v0.5.3-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":117,"digest":"sha256:d351ffbe9112523443337d2397cd6cb82fd4dede590dc6d094077d8fab55adc3","download_count":2,"created_at":"2026-11-03T13:13:26Z","updated_at":"2026-11-03T13:13:26Z"}],"body":"## Install\n\nOne binary. `h5i` unifies web development, formal verification\nwith Lean 4, and red-teaming around a composable Rust framework.\n\n**Linux / macOS:**\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.3/h5i-v0.5.3-<TARGET>.tar.gz | tar -xz\nsudo mv h5i /usr/local/bin/\n```\n\n**Windows:** download the `.zip`, extract `h5i.exe`, and add it to your `PATH`.\n\n### The browser\n\n```bash\nh5i browser open https://example.com\nh5i browser snapshot\nh5i browser requests     # what it asked for, and what was refused\nh5i browser audit        # the whole session, afterwards\n```\n\nA session is Chromium, driven through\n[agent-browser](https://github.com/vercel-labs/agent-browser)\n(`npm install -g agent-browser`), and captured at a proxy this\nbinary runs: every request is policy-checked and written down\nbefore it moves.\n\n### The websec workbench\n\n`h5i-websec` is a separate archive, and installing it is a\ndeliberate act:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.3/h5i-websec-v0.5.3-<TARGET>.tar.gz | tar -xz\nh5i plugin install websec --from ./h5i-websec\n```\n\nIt holds no privilege of its own: every verb runs the `h5i browser`\nverbs a person would type, through the same policy, budget and\nreceipts.\n\n### The recon ledger\n\n`h5i-recon` is the other plugin, and it arrives the same way:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.3/h5i-recon-v0.5.3-<TARGET>.tar.gz | tar -xz\nh5i plugin install recon --from ./h5i-recon\n```\n\nIt records what a target exposes, where each candidate came from,\nand which stored message confirmed it. Discovery only: a URL read\nout of a bundle stays a candidate until a request answers for it,\nand nothing here is called a vulnerability.\n\n### Security regression tests\n\n`h5i-test` replays repository-owned attack flows and hands their\nevidence to repository-owned external oracles:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.3/h5i-test-v0.5.3-<TARGET>.tar.gz | tar -xz\nh5i plugin install test --from ./h5i-test\nh5i test .h5i-tests/tests --target http://localhost:3000\n```\n\nIt writes JSON and JUnit. OpenAPI coverage is report-only unless\n`--min-coverage` is explicitly supplied.\n\nEvery request it makes is checked against an allowlist — every\nrequest and every redirect hop — and written to the log before any\nbytes move. A request that is not in `h5i browser requests` did not\nhappen. What a box adds, with `--in`, is that the record gains a\nwitness outside the browser; on a bare host that part is not\nclaimed.\n\n### Available targets\n\n| Target | Platform |\n|--------|---------|\n| `x86_64-unknown-linux-musl` | Linux x86_64 (static, glibc-free) |\n| `aarch64-unknown-linux-musl` | Linux arm64 (static, glibc-free) |\n| `aarch64-apple-darwin` | macOS Apple Silicon (arm64) |\n| `x86_64-pc-windows-msvc` | Windows x86_64 |\n\nIntel Macs have no published build: Rosetta 2 translates x86_64 to\narm64, not the reverse, so the `aarch64-apple-darwin` archive will\nnot run there. Build from source instead:\n`cargo install --git https://github.com/h5i-dev/h5i`\n\nEach archive is accompanied by a `.sha256` checksum file.\n\n\n## What's Changed\n* h5i-app-schema: Lean lemmas for u32 columns by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/769\n* h5i-app-pg: verified TLS to PostgreSQL (feature `tls`) by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/770\n* bump h5i-app to 0.5.2 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/771\n* App/range reads by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/773\n* add the download counter script by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/772\n* Add files via upload by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/774\n* h5i-app reads: range comparisons (>=, <) on integer columns by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/775\n* bump up to 0.5.3 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/776\n\n\n**Full Changelog**: https://github.com/h5i-dev/h5i/compare/v0.5.2...v0.5.3","mentions_count":1}
