e_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":112,"digest":"sha256:fd457db5fef4404b7a02e1c622630a68989c87dcd8180a10afe9359caac6c3e8","download_count":1,"created_at":"2026-10-29T19:30:53Z","updated_at":"2026-10-29T19:30:53Z"},{"id":689667953,"node_id":"RA_kwDORj5l3c4pG39x","name":"h5i-websec-v0.5.2-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3236524,"digest":"sha256:e51c2a2bc6564a9e8d352816395ccb63a568cb1fcb8483a4cdd1f20dd635d405","download_count":1,"created_at":"2026-10-29T19:30:53Z","updated_at":"2026-10-29T19:30:53Z"},{"id":689667944,"node_id":"RA_kwDORj5l3c4pG39o","name":"h5i-websec-v0.5.2-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":117,"digest":"sha256:1dac28271622030c476dd44cf9ca8b5084070d1ebf91c10c03fbecc453ab1945","download_count":1,"created_at":"2026-10-29T19:30:53Z","updated_at":"2026-10-29T19:30:53Z"}],"body":"## Install\n\nOne binary. `h5i` unifies web development, formal verification\nwith Lean 4, and red-teaming around a composable Rust framework.\n\n**Linux / macOS:**\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.2/h5i-v0.5.2-<TARGET>.tar.gz | tar -xz\nsudo mv h5i /usr/local/bin/\n```\n\n**Windows:** download the `.zip`, extract `h5i.exe`, and add it to your `PATH`.\n\n### The browser\n\n```bash\nh5i browser open https://example.com\nh5i browser snapshot\nh5i browser requests     # what it asked for, and what was refused\nh5i browser audit        # the whole session, afterwards\n```\n\nA session is Chromium, driven through\n[agent-browser](https://github.com/vercel-labs/agent-browser)\n(`npm install -g agent-browser`), and captured at a proxy this\nbinary runs: every request is policy-checked and written down\nbefore it moves.\n\n### The websec workbench\n\n`h5i-websec` is a separate archive, and installing it is a\ndeliberate act:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.2/h5i-websec-v0.5.2-<TARGET>.tar.gz | tar -xz\nh5i plugin install websec --from ./h5i-websec\n```\n\nIt holds no privilege of its own: every verb runs the `h5i browser`\nverbs a person would type, through the same policy, budget and\nreceipts.\n\n### The recon ledger\n\n`h5i-recon` is the other plugin, and it arrives the same way:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.2/h5i-recon-v0.5.2-<TARGET>.tar.gz | tar -xz\nh5i plugin install recon --from ./h5i-recon\n```\n\nIt records what a target exposes, where each candidate came from,\nand which stored message confirmed it. Discovery only: a URL read\nout of a bundle stays a candidate until a request answers for it,\nand nothing here is called a vulnerability.\n\n### Security regression tests\n\n`h5i-test` replays repository-owned attack flows and hands their\nevidence to repository-owned external oracles:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.2/h5i-test-v0.5.2-<TARGET>.tar.gz | tar -xz\nh5i plugin install test --from ./h5i-test\nh5i test .h5i-tests/tests --target http://localhost:3000\n```\n\nIt writes JSON and JUnit. OpenAPI coverage is report-only unless\n`--min-coverage` is explicitly supplied.\n\nEvery request it makes is checked against an allowlist — every\nrequest and every redirect hop — and written to the log before any\nbytes move. A request that is not in `h5i browser requests` did not\nhappen. What a box adds, with `--in`, is that the record gains a\nwitness outside the browser; on a bare host that part is not\nclaimed.\n\n### Available targets\n\n| Target | Platform |\n|--------|---------|\n| `x86_64-unknown-linux-musl` | Linux x86_64 (static, glibc-free) |\n| `aarch64-unknown-linux-musl` | Linux arm64 (static, glibc-free) |\n| `aarch64-apple-darwin` | macOS Apple Silicon (arm64) |\n| `x86_64-pc-windows-msvc` | Windows x86_64 |\n\nIntel Macs have no published build: Rosetta 2 translates x86_64 to\narm64, not the reverse, so the `aarch64-apple-darwin` archive will\nnot run there. Build from source instead:\n`cargo install --git https://github.com/h5i-dev/h5i`\n\nEach archive is accompanied by a `.sha256` checksum file.\n\n\n## What's Changed\n* Koukyosyumei patch 1 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/749\n* Koukyosyumei patch 1 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/750\n* improve docs by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/751\n* Improve slide by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/752\n* Koukyosyumei patch 1 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/753\n* Expand demo proof story and clarify testing captions by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/754\n* Decouple CUDA runtime from tutorial kernels by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/755\n* Refresh contributor and security docs by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/756\n* Bump up to v0.1.3 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/757\n* Update README.md by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/758\n* Improve docs SEO and Rust verification guide by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/759\n* Improve skill by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/760\n* Clarify formal verification case in pitch deck by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/761\n* describe plugins in top-level help by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/763\n* update traction numbers by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/766\n* Pre proved auth by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/762\n* Update README.md by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/767\n* Saturate HmacAuth token expiry and test the authenticator by @hiroki-abe-58 in https://github.com/h5i-dev/h5i/pull/764\n* h5i-app-pg: refuse mixed-case schema names in with_schema by @hiroki-abe-58 in https://github.com/h5i-dev/h5i/pull/765\n* bump h5i to v0.5.2 and h5i-app to 0.1.4 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/768\n\n## New Contributors\n* @hiroki-abe-58 made their first contribution in https://github.com/h5i-dev/h5i/pull/764\n\n**Full Changelog**: https://github.com/h5i-dev/h5i/compare/v0.5.1...v0.5.2","mentions_count":2}
