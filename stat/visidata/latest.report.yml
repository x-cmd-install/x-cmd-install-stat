{"id":427053445,"author":{"login":"saulbert","id":262750122,"node_id":"U_kgDOD6k_qg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBEu2Gc4ZdFGF","tag_name":"v3.5","target_commitish":"develop","name":"v3.5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-27T18:49:51Z","updated_at":"2026-10-28T20:20:45Z","published_at":"2026-10-28T20:20:45Z","assets":[{"id":685976762,"node_id":"RA_kwDOBEu2Gc4o4yy6","name":"man.md","label":"","uploader":{"login":"saulbert","id":262750122,"node_id":"U_kgDOD6k_qg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/markdown; charset=utf-8","state":"uploaded","size":148748,"digest":"sha256:c961da54cac24134933d51c1864ab0f28d933da3a02f5edcb7a4b0164237d450","download_count":3,"created_at":"2026-10-28T18:43:05Z","updated_at":"2026-10-28T18:43:05Z"}],"body":"# v3.5\r\n\r\nv3.5 is mostly a fix-and-polish release after the big v3.4.  We burned down the open issues backlog, and out of that came a rebuilt PostgreSQL loader, a new native DuckDB loader, and three security fixes.\r\n\r\n## Security fixes\r\n\r\nNine people reported three security issues in VisiData (eight of them found the same zip slip):\r\n\r\n- **pandas**: `.pickle` files are no longer loaded unless the new `pandas_allow_pickle` option is set (default off).  Unpickling runs arbitrary code from the file, so opening an untrusted `.pickle` could execute it.  CVE pending, reported by @Santoshkumarpuppala.\r\n- **unzip_http**: refuse zip members whose path resolves outside the extraction directory (Zip Slip).  CVE-2026-41958, reported by @MaxFreedomPollard, and independently by @robsherw of Cisco Talos and six others.  Also fixed in [unzip-http](https://github.com/saulpw/unzip-http) 0.8.\r\n- **eml**: `gx` refuses attachment filenames that resolve outside the extraction directory (path traversal).  CVE-2026-42532, reported by @robsherw of Cisco Talos.\r\n\r\nYou should upgrade if you open files from sources you don't trust.\r\n\r\n## Data changes\r\n\r\n- Dict and list cells now save as JSON by default in text formats. (#2944)\r\n- On the Describe sheet, all null forms count as one distinct value. (#3223)\r\n\r\n## Interface changes\r\n\r\n- **Join** type `concat` matches columns by position and keeps the first sheet's column names (and type as before).  Use `append` to match by name. (#3208)\r\n- **Macros** record literal `{braces}` safely (f-strings and regexes no longer turn into parameters), and `{{ }}` escapes braces in parameterized macros. (#2785)\r\n- **Command line args** are now added in order @midichef (#3225)\r\n- **Options**: reading an undefined option warns and returns None, instead of raising.\r\n\r\n## New commands\r\n\r\n- `set-envvar` to record environment changes for replay (for e.g. $LC_ALL reproducibility). (#3195)\r\n- `addcol-incr-key`, like `addcol-incr` but increment restarts at each change in key columns\r\n- `select-col-duplicates` to select duplicate cells in one column @midichef\r\n- `resize-col-max-all` and `resize-cols-max-all` to resize columns looking at all rows (#2780)\r\n- `syscopy-sql` (#2393)\r\n- `undo-redo-input` (`zU`) undoes the last change and reruns it with its input prefilled, for e.g. fixing a typo in a long expression. (#3031)\r\n- `llm-query-sheet` and `llm-query-selected` send rows as one query to an Anthropic LLM; stream replies into the sheet (#2947)\r\n\r\n## Highlighted features\r\n\r\n- **PostgreSQL loader overhaul**: open a table directly with `postgres://host/dbname/tablename`, run `exec-sql`/`edit-sql`, and browse large tables that load lazily and stream rows.  Connection details come from libpq (via `$PGUSER`, `$PGHOST`, `~/.pgpass`, etc).  Tables are readonly for now; write support is deferred to a later release. (#282 #586 #727 #2989)\r\n- **Native DuckDB loader** for `.duckdb` files, including saver. (#3035 #3237)\r\n- **Decimal type**: `type-decimal` parses currency and `(1,234.50)` accounting negatives and keeps the source precision.  Unbound by default; bind it to `$` to try it. (#2396)\r\n- **Command-server client**: include the `vdx` script to interact with a live `vd` command-server (LLMs can drive vd now too!)\r\n- **.vds format**: several improvements to VisiData's own save format\r\n\r\n## Spit and Polish\r\n\r\n- **Hidden columns** keep their width across hide/unhide; sheet edge requires extra `go-right` before stepping into hidden columns. (#3214 #3215)\r\n- **Better wide-character support**: fix terminal display issues with emoji and wide characters, and also better wrapping for same. (#2416 #2685)\r\n- **Archives**: members decompress by suffix, nested tars open, and `zEnter` opens a member as a chosen filetype. (#3212)\r\n- **macOS**: respect `XDG_DATA_HOME`/`XDG_STATE_HOME` on macOS\r\n\r\nThanks to @midichef for many bugfixes and reviews, and to @VXNCXNX, @danielwe, @chutzimir, @mpr1255, @horizonbymuneeb, @chiliec, @dacodas, @maxfain, and @khughitt for their contributions.\r\n\r\nPlease see the [CHANGELOG](https://github.com/saulpw/visidata/blob/v3.5/CHANGELOG.md) for the full list of changes.\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":13}
