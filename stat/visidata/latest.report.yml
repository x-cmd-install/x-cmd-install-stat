{"id":347239219,"author":{"login":"saulpw","id":236498,"node_id":"MDQ6VXNlcjIzNjQ5OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBEu2Gc4UsnMz","tag_name":"v3.4","target_commitish":"develop","name":"v3.4","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-07-01T04:58:39Z","updated_at":"2026-10-17T22:45:00Z","published_at":"2026-07-01T05:09:42Z","assets":[{"id":651805517,"node_id":"RA_kwDOBEu2Gc4m2cNN","name":"man.md","label":"","uploader":{"login":"saulbert","id":262750122,"node_id":"U_kgDOD6k_qg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/markdown; charset=utf-8","state":"uploaded","size":144693,"digest":"sha256:e221208673bf93312bb1d2aa1c3e446d49ae37072e5d3ff8af72340613c021c4","download_count":11,"created_at":"2026-10-17T22:45:00Z","updated_at":"2026-10-17T22:45:00Z"}],"body":"# v3.4\r\n\r\nIt's been the better part of a year since v3.3, and v3.4 is a big one: new features across the board, a thorough pass on markup rendering, and dozens of bugfixes.\r\n\r\nHighlights:\r\n\r\n- **Search highlighting** (`hlsearch`): every match for `/` and `g/` is now highlighted in place; toggle with `options.highlight_search`. (#2861)\r\n- **Human-readable keys everywhere**: the \"prettykeys\" overhaul means all bindings display with readable names (`Ctrl+Up`, `Alt+d`, …) in help, menus, and status. (#2594)\r\n- **Smarter `-f`**: filetype now separated between input and output, with `-f` for the input filetype, and `-of` for the output filetype, which supports compound `format+compression` types like `json+gz`; an explicit `-f` also overrides URL-scheme dispatch.\r\n- **Define your own commands** in-session: `define-command <longname> <execstr>`, with `currow.<ColName>` available to read the cursor row's values. (#655)\r\n- **Save edited options** straight to your config with `z Ctrl+S`. (#2206)\r\n- **Split-pane file preview** on the DirSheet. (#3024)\r\n- **Customizable cell-editing keys** via `vd.editCellBindings`. (#2986)\r\n- **Jump to any sheet by name** with `jump-sheet` (with tab-completion).\r\n- **Change displayed float precision** with `setcol-precision` (`Alt+-`/`Alt++`/`g%`).\r\n- **Drop into an interactive `$SHELL`** with `exec-shell`.\r\n- **Aggregation bar** showing aggregate totals. (#2209 #2995)\r\n- **Fuzzy input-history palette**. (#2684)\r\n- **Macros** now support keystroke bindings and input parameters. (#2784 #2785)\r\n- **Smarter SQLite `exec-sql`**: named queries, types, and edit-sql. (#2136 #3020)\r\n- **GeoParquet** support: decode WKB geometry and plot it.\r\n- **vdsql improvements**: multi-schema browsing (#2027) and SQL shown in the sidebar (#2200).\r\n- **S3** recursive directory listing and anonymous-mode access.\r\n- **Better HTML tables**: handle interspersed th/td and rowspan. (#1346 #1308)\r\n- **CSV** now skips blank lines. (#3085)\r\n- New **adwaita** light and dark themes. (#3006)\r\n- An embedded **ptipython** REPL. (#2736)\r\n- A **command server** for scripting VisiData.\r\n- Experimental: **vdaw**, a transcript-based audio editor.\r\n- Experimental: an **llm** plugin to analyze columns with Anthropic Claude. (#2947)\r\n- Experimental: **search_geo**, bbox-overlap helpers for STAC catalogs.\r\n\r\nThanks to @midichef for a huge share of the bugfixes and improvements in this release, and to everyone who contributed: @daviewales, @meestahp, @pequiste, @maxim-uvarov-ai-assistant, @terencelaurent, @mplattner, @weichm, @iamleot, @ilyagr, @haoyeau, @rsmirnov90, @egwynn, @Tjorbenn, @Jonathan-Haddock, @leimgruberf, @justin2004, @tabibeyal, and @Jaredy899.\r\n\r\nAnd thanks to Anthropic for providing @saulbert with tokens these past few months as part of their open source program; we shipped several features we wouldn't have been able to do otherwise.\r\n\r\nPlease see the [CHANGELOG](https://github.com/saulpw/visidata/blob/v3.4/CHANGELOG.md) for the full list of changes.","reactions":{"total_count":7,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":6,"rocket":0,"eyes":0},"mentions_count":20}
