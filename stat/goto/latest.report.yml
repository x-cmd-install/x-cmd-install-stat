},{"id":752182382,"node_id":"RA_kwDOKiMZ0s4s1WRu","name":"goto_1.7.0_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3838824,"digest":"sha256:268df0a48bc5593b34e35db16b3d4b93ad75d10b08d2a68f758e410a56b064ea","download_count":15,"created_at":"2026-11-15T20:01:10Z","updated_at":"2026-11-15T20:01:10Z"},{"id":752182384,"node_id":"RA_kwDOKiMZ0s4s1WRw","name":"goto_1.7.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3507544,"digest":"sha256:748f3d560003b574ec70353623362eb95ceac5f435532dfdf4f31a869cda4ca2","download_count":1,"created_at":"2026-11-15T20:01:10Z","updated_at":"2026-11-15T20:01:10Z"},{"id":752182435,"node_id":"RA_kwDOKiMZ0s4s1WSj","name":"goto_1.7.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3987587,"digest":"sha256:992cccc13988b6d5c2d98c8e43d0c2b41610c24b48fee3137fef07c58e31afd5","download_count":1,"created_at":"2026-11-15T20:01:11Z","updated_at":"2026-11-15T20:01:11Z"},{"id":752182378,"node_id":"RA_kwDOKiMZ0s4s1WRq","name":"goto_1.7.0_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3596805,"digest":"sha256:3d1c3bca5e1780a60dd0e959c840b9cc79d431a3f512ee7f40cfd43f4ce7ca86","download_count":1,"created_at":"2026-11-15T20:01:10Z","updated_at":"2026-11-15T20:01:10Z"}],"body":"## What's changed ##\r\n\r\nSSH sessions now run inside the application, with a status line that shows the group, host, and alias, and selected text copied to the clipboard. The group list opens on startup when groups exist, and you can select hosts with the mouse or move between host editor fields with Ctrl+j and Ctrl+k.\r\n\r\n### Improvements ###\r\n\r\n* Render SSH sessions inside the application instead of an external terminal [[details](https://github.com/grafviktor/goto/issues/152)].\r\n* Show the group, host, and alias in the SSH status line, and copy selected text to the clipboard [[details](https://github.com/grafviktor/goto/issues/155)].\r\n* Open the group list on startup when at least one group is defined, and restore the last selected group [[details](https://github.com/grafviktor/goto/issues/104)].\r\n* Add mouse support for selecting hosts, groups, and host editor fields; double-click a host to connect [[details](https://github.com/grafviktor/goto/issues/135)].\r\n* Add Ctrl+j and Ctrl+k shortcuts for moving between host editor fields [[details](https://github.com/grafviktor/goto/issues/92)].\r\n\r\n## Notes ##\r\n\r\n* The embedded terminal is enabled by default, so SSH sessions now run inside the application. Text selected with the mouse is copied to the OS clipboard automatically. Hold Shift to use the system selection instead. To fallback to system terminal, run `gg -d embedded_terminal`.\r\n* On startup, if there is at least one group of hosts in your storage, the list of groups is shown.\r\n* Mouse support in the host list, group list, and host editor is experimental and limited. It is disabled by default; enable it with `gg -e mouse`. Not all terminal types support mouse events.\r\n\r\n## Breaking changes ##\r\n\r\nThe state file key `selected` was renamed to `selected_host_index` in `state.yaml`. After the upgrade, the previously selected host is not pre-selected on the first application run. Subsequent runs work as expected. You do not need to do anything.\r\n\r\n<hr/>\r\n\r\n**Full Changelog**: https://github.com/grafviktor/goto/compare/v1.6.1...v1.7.0"}
