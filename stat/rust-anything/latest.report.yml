ated_at":"2026-11-26T02:12:45Z"},{"id":793968707,"node_id":"RA_kwDOVwVmZM4vUwBD","name":"rust-anything-v5.0.1-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6018740,"digest":"sha256:74e55f10af699551dc4b30372ac22b75f3bea7d603afc1ce194cfa12e31e7593","download_count":294,"created_at":"2026-11-26T02:12:44Z","updated_at":"2026-11-26T02:12:45Z"},{"id":793968736,"node_id":"RA_kwDOVwVmZM4vUwBg","name":"rust-anything-v5.0.1-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":6671276,"digest":"sha256:faad2232f171c6a3a2f6d5c1b4c2f838d2db70d8a9cb1073c11323cff07b717d","download_count":143,"created_at":"2026-11-26T02:12:45Z","updated_at":"2026-11-26T02:12:46Z"},{"id":793968710,"node_id":"RA_kwDOVwVmZM4vUwBG","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":582,"digest":"sha256:dae1786619cd719b1552371c9b24d59464931593da525920410af31b2989517d","download_count":150,"created_at":"2026-11-26T02:12:44Z","updated_at":"2026-11-26T02:12:45Z"}],"body":"\n- rust-anything is now dual licensed under MIT OR Apache-2.0, the usual license for Rust projects. You\n  can keep using it under MIT exactly as before; Apache-2.0 adds an explicit patent grant. `LICENSE` is\n  now `LICENSE-MIT`, next to a new `LICENSE-APACHE`, and both ship in the crate, the npm package and\n  the release archives.\n- `map` counts units, not crates, in its first line: one unit bridged twice (napi and wasm, or a\n  second `bridge --out`) reads `1 of 1 unit has a Rust port` instead of `2 of 2 units have`. The\n  Ports table still lists every crate (#609 by @Aadithya-kl).\n- `fuzz --time` given a negative or non-finite value says\n  `` `--time` must be 0 or more seconds (0 runs one round), not -1 `` instead of\n  `` `--time` takes seconds ``, and `--time -1` (with a space) gets the same message instead of clap's\n  `unexpected argument '-1' found`. The MCP `fuzz` tool's `time` says the same (#612).\n- `bridge --as-json Q` stops before writing anything when no export declares `Q` as a type\n  parameter, with ``--as-json `Q` is not a type parameter of `src/math.ts` (type parameters: T)``\n  (or \"it has none\"), instead of ignoring the name and leaving the generic export in TS, as\n  `--keep` already does for unknown exports (#608).\n\n","mentions_count":1}
