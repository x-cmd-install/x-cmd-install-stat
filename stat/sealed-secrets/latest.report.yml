t_type":"application/pgp-signature","state":"uploaded","size":96,"digest":"sha256:b6a8e825c71df1bbf8d4df6c661a5204c6b26879df03f5d72ad2f68c2430168a","download_count":52,"created_at":"2026-08-20T08:53:21Z","updated_at":"2026-08-20T08:53:21Z"}],"body":"## v0.39.1 (2026-08-20T08:45:45Z)\r\n\r\nNew v0.39.1 release!\r\n\r\n## Changelog\r\n* 83387fc915c4197b09c893c911c6a1ce80d9927e Bump Golang to 1.26.6 (#2028)\r\n* e81bbe43bdd4eb99fb68958a51ea23fbfe96dbef Bump Golang to 1.26.7 (#2029)\r\n* 08bbee246d74a638d53f3d8018033ec0c41f3586 Bump github.com/onsi/ginkgo/v2 from 2.32.0 to 2.32.1 (#2027)\r\n* 74d25c0d05ae7b24f38e55490ef4eb5d1cd98bd3 Bump golang.org/x/crypto from 0.54.0 to 0.55.0 (#2026)\r\n* aeb6bfb5e6cff5fc0606e1372121243cd26a676d Release carvel package 2.19.2 (#2024)\r\n* af17f829e4647765d5c576837261bf44863c96cc Release notes 0.39.1 (#2030)\r\n* 070ad1668aae4399d6b4fc09c8adc8a566dbf65c test(controller): fix flaky TestReadKey RSA key comparison (#2021)\r\n\r\n## Installation Instructions\r\n\r\n### Cluster-side\r\n\r\nInstall the SealedSecret CRD and server-side controller into the `kube-system` namespace:\r\n\r\n```sh\r\nkubectl apply -f https://github.com/bitnami/sealed-secrets/releases/download/v0.39.1/controller.yaml\r\n```\r\n\r\n### Client-side\r\n\r\nInstall the client-side tool into `/usr/local/bin/`:\r\n\r\n**Linux x86_64:**\r\n```sh\r\ncurl -OL \"https://github.com/bitnami/sealed-secrets/releases/download/v0.39.1/kubeseal-0.39.1-linux-amd64.tar.gz\"\r\ntar -xvzf kubeseal-0.39.1-linux-amd64.tar.gz kubeseal\r\nsudo install -m 755 kubeseal /usr/local/bin/kubeseal\r\n```\r\n\r\n**macOS:**\r\nThe `kubeseal` client is available on [homebrew](https://formulae.brew.sh/formula/kubeseal):\r\n\r\n```sh\r\nbrew install kubeseal\r\n```\r\n\r\n**MacPorts:**\r\n\r\nThe `kubeseal` client is available on [MacPorts](https://ports.macports.org/port/kubeseal/summary):\r\n\r\n```sh\r\nport install kubeseal\r\n```\r\n\r\n#### Nixpkgs\r\n\r\nThe `kubeseal` client is available on [Nixpkgs](https://search.nixos.org/packages?channel=unstable&show=kubeseal&from=0&size=50&sort=relevance&type=packages&query=kubeseal): (**DISCLAIMER**: Not maintained by bitnami)\r\n\r\n```sh\r\nnix-env -iA nixpkgs.kubeseal\r\n```\r\n\r\n**Other OS/Arch:**\r\nBinaries for other OS/arch combinations are attached to this release below.\r\n\r\nIf you just want the latest client tool, it can be installed into\r\n`$GOPATH/bin` with:\r\n\r\n```sh\r\ngo install github.com/bitnami/sealed-secrets/cmd/kubeseal@main\r\n```\r\n\r\nYou can specify a release tag or a commit SHA instead of `main`.\r\n\r\nThe `go install` command will place the `kubeseal` binary at `$GOPATH/bin`:\r\n\r\n```sh\r\n$(go env GOPATH)/bin/kubeseal\r\n```\r\n\r\n## Release Notes\r\n\r\nPlease read the [RELEASE_NOTES](https://github.com/bitnami/sealed-secrets/blob/main/RELEASE-NOTES.md) which contain among other things important information for those upgrading from previous releases.\r\n## Thanks!\r\n\r\n"}
