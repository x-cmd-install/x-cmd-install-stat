re","state":"uploaded","size":96,"digest":"sha256:10f13ceb772a58066e1e101ab95dae1fd8cebccf765fae9a04687968ba6a29b1","download_count":1,"created_at":"2026-09-10T16:10:27Z","updated_at":"2026-09-10T16:10:27Z"}],"body":"## v0.40.0 (2026-09-10T16:02:19Z)\n\nNew v0.40.0 release!\n\n## Changelog\n* 90293948e17bc0b5c7ef158e6c6a8b0a085675ec Add imports to force vendoring required codegen tools (#2020)\n* 641cd0191afbb3c807e1eb2099186ea4c2b2caa5 Bump Golang to 1.26.8 (#2050)\n* 20925c92ae52fde1620b1c75c73a7244029de499 Bump distroless/static from `9197324` to `f2ea270` in /docker (#2038)\n* 2937d2b6d52cca1b1e26dac4fcc999adcdc575bd Bump github.com/onsi/gomega from 1.42.1 to 1.43.0 (#2044)\n* 78f5131019b7f3720e8aab5f136b52f78a6d6353 Bump github.com/prometheus/client_model from 0.6.2 to 0.6.3 (#2047)\n* 0b606aeec3c4f7bf9b1fcb15afa13040df0d5250 Bump golang.org/x/crypto from 0.55.0 to 0.56.0 (#2048)\n* ecc92389cbc756882d40e38df745dba9452b98ec Bump k8s.io/api from 0.36.3 to 0.36.4 (#2037)\n* 2b184ce5b729d357fc3c5f4e288de8f1e44aca0f Bump k8s.io/client-go from 0.36.3 to 0.36.4 (#2039)\n* 5552a014e769e6232f351135e6e6cc2bdaa10304 Bump k8s.io/client-go from 0.36.4 to 0.37.0 (#2041)\n* b8609f7399e81d342da8e5df0a7799cd07a3ed1a Bump k8s.io/code-generator from 0.36.3 to 0.36.4 (#2036)\n* eddf8c225c1eed4fe2f00d00af54645362c7559c Bump k8s.io/code-generator from 0.36.4 to 0.37.0 (#2042)\n* 54c805dbf4ab7fae87cce28648da252e8c69347f Enable encryptedData to be omitted by setting key to null in template (#1871)\n* e27ce45b1626b9d398eb325e447a8de8be79f9cc Release carvel package 2.19.3 (#2032)\n* 7117727b801514f4c6e3b2cd23cdb74b81f57a86 Release notes 0.40.0 (#2052)\n* 32171b69d6e7e088f177a288b359739aa776c465 [Security] Stop /v1/rotate from acting as a decryption oracle (#2049)\n\n## Installation Instructions\n\n### Cluster-side\n\nInstall the SealedSecret CRD and server-side controller into the `kube-system` namespace:\n\n```sh\nkubectl apply -f https://github.com/bitnami/sealed-secrets/releases/download/v0.40.0/controller.yaml\n```\n\n### Client-side\n\nInstall the client-side tool into `/usr/local/bin/`:\n\n**Linux x86_64:**\n```sh\ncurl -OL \"https://github.com/bitnami/sealed-secrets/releases/download/v0.40.0/kubeseal-0.40.0-linux-amd64.tar.gz\"\ntar -xvzf kubeseal-0.40.0-linux-amd64.tar.gz kubeseal\nsudo install -m 755 kubeseal /usr/local/bin/kubeseal\n```\n\n**macOS:**\nThe `kubeseal` client is available on [homebrew](https://formulae.brew.sh/formula/kubeseal):\n\n```sh\nbrew install kubeseal\n```\n\n**MacPorts:**\n\nThe `kubeseal` client is available on [MacPorts](https://ports.macports.org/port/kubeseal/summary):\n\n```sh\nport install kubeseal\n```\n\n#### Nixpkgs\n\nThe `kubeseal` client is available on [Nixpkgs](https://search.nixos.org/packages?channel=unstable&show=kubeseal&from=0&size=50&sort=relevance&type=packages&query=kubeseal): (**DISCLAIMER**: Not maintained by bitnami)\n\n```sh\nnix-env -iA nixpkgs.kubeseal\n```\n\n**Other OS/Arch:**\nBinaries for other OS/arch combinations are attached to this release below.\n\nIf you just want the latest client tool, it can be installed into\n`$GOPATH/bin` with:\n\n```sh\ngo install github.com/bitnami/sealed-secrets/cmd/kubeseal@main\n```\n\nYou can specify a release tag or a commit SHA instead of `main`.\n\nThe `go install` command will place the `kubeseal` binary at `$GOPATH/bin`:\n\n```sh\n$(go env GOPATH)/bin/kubeseal\n```\n\n## Release Notes\n\nPlease read the [RELEASE_NOTES](https://github.com/bitnami/sealed-secrets/blob/main/RELEASE-NOTES.md) which contain among other things important information for those upgrading from previous releases.\n## Thanks!\n\n"}
