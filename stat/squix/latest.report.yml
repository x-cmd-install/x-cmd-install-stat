at":"2026-09-22T16:20:35Z","updated_at":"2026-09-22T16:20:36Z"},{"id":581771284,"node_id":"RA_kwDOP-IZ2s4irSAU","name":"squix-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":106679808,"digest":"sha256:d1a03315c7d534eb179ec2e67021ef668f80df73d7f544118b946d405b1f788b","download_count":3,"created_at":"2026-09-22T16:20:35Z","updated_at":"2026-09-22T16:20:38Z"}],"body":"## What's Changed\r\n* feat(build): add negative build flags to compile squix without a set of database drivers by @eduardofuncao in https://github.com/eduardofuncao/squix/pull/91\r\n\r\nOn this and next releases, each squix version will also build the lite and minimal versions for each os/arch combination:\r\n- lite version excludes oracle, snowflake and duckdb drivers, with the bianary size at around ~20mb\r\n- minimal version excludes every driver except for postgres, mysql and sqlite, with the binary size at around ~10mb\r\n\r\nTo build squix excluding any combination of db drivers, use negative tags, for example:\r\n```bash\r\ngo build --tags nopostgres,nosqlite,noduckdb -o squix ./cmd/squix\r\n```\r\n\r\nTo build squix using the nix flake, it is now possible to target lite or minimal version as well\r\n```bash\r\nnix build .#lite\r\n# or\r\nnix build .#minimal\r\n```\r\n\r\n**Full Changelog**: https://github.com/eduardofuncao/squix/compare/v0.5.3-beta...v0.5.4-beta","mentions_count":1}
