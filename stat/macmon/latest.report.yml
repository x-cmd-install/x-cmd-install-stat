{"id":446244076,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOMKBR7c4amSTs","tag_name":"v0.12.0","target_commitish":"main","name":"v0.12.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-15T17:43:48Z","updated_at":"2026-11-15T17:45:58Z","published_at":"2026-11-15T17:45:58Z","assets":[{"id":751810424,"node_id":"RA_kwDOMKBR7c4sz7d4","name":"macmon-v0.12.0-aarch64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":997233,"digest":"sha256:cd5a701f8537072aee93eba686bc582897bd00d826f62146b32c8a8d2654641a","download_count":606,"created_at":"2026-11-15T17:45:57Z","updated_at":"2026-11-15T17:45:58Z"}],"body":"### Breaking Changes\n\n- `all_power` now covers the whole chip, memory included, so it reads higher on most Macs; it is deprecated in favor of the new `chip_power`, which has the same value. `gpu_ram_power` is deprecated too (#117, by @homm)\n- `pipe` and `/json` round floats to six decimal places (#140, by @corneliusroemer-agent)\n\n### Features\n\n- Added `chip_power` for the whole chip, `dcs_power` for the memory controller and `media_power` for the video encoder and image processor on M6, in JSON and Prometheus (#117, by @homm)\n- Added `dc_in_power`, the power from the adapter, and `display_power`, the built-in display's backlight, where the Mac reports them (#118, by @homm)\n- Added `disk_read`, `disk_write`, `net_in`, `net_out` (bytes per second), `uptime`, `battery_percent`, `battery_charging` and `battery_plugged` to JSON and Prometheus (#129)\n- Added `gpu_mem_alloc` and `gpu_mem_in_use`, GPU memory in bytes, to JSON and Prometheus (#134, by @unlikelyzero)\n- New fields are in `Metrics` of the Rust library too, `Option` where a Mac may not report them\n- Added the command line to the process list: arguments after the name, `cmd:` in the filter and a `cmd` row in the `i` overlay (#127)\n- Added `port:` to the process filter, to find the process with a local TCP or UDP port (#128)\n- Added a cursor to the filter field, with word moves and deletes as in a shell (#130)\n- Added `Sampler::get_metrics_now` for library users that run their own timer; the TUI interval now goes down to 100 ms (#115, by @homm)\n- Added fallback power and temperature sources from mactop, used only when the current ones read nothing, in case Apple breaks them as it did on macOS 27 (#142)\n\n### Fixes\n\n- Fixed `cpu_temp_avg` reading a few degrees low and rare GPU temperatures around 5 °C (#142)\n- `sys_power` on desktops falls back to the adapter power when the system total reads 0, as reported on Mac Studio (#142)\n- Fixed the TUI under `sudo` saving settings through paths the user controls; as root it now keeps them for the session only (#138, by @chodorenko)\n- Fixed `macmon serve` running out of threads or hanging on idle connections: at most 32 at once, with a 5 s timeout (#137, by @chodorenko)\n- The process list uses about half the CPU it did (#131), and the TUI draws metrics and processes in one frame (#116, by @homm)\n\n**Full Changelog**: https://github.com/vladkens/macmon/compare/v0.11.0...v0.12.0","reactions":{"total_count":9,"+1":2,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":2,"rocket":2,"eyes":1},"mentions_count":4}
