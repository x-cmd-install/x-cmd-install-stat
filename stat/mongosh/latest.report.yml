\n- **cli-repl**: Collect telemetry only for sessions with a terminal and agentic (MONGOSH-3794, #2879)\n- Add support for RunCommandCursor in ShellOutputLine and formatOutput (MONGOSH-2483, #2864)\n- **testing**: Use -latest crypt_shared for alpha server tests (MONGOSH-3752, #2871)\n\n\n## Bug Fixes\n\n- **deps**: Bump dependencies, fix `.snyk` (#2885)\n\n\n\nSee an overview of all solved issues [in Jira](https://jira.mongodb.org/issues/?jql=project%20%3D%20MONGOSH%20AND%20fixVersion%20%3D%202.14.0)"}
