pendencies\n* Bump golang.org/x/net from 0.33.0 to 0.36.0 in the go_modules group by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/511\n* Bump google.golang.org/protobuf from 1.36.5 to 1.36.6 by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/515\n* Bump golang.org/x/net from 0.36.0 to 0.38.0 in the go_modules group by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/517\n* Bump golang.org/x/oauth2 from 0.14.0 to 0.27.0 in the go_modules group by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/520\n* Bump google.golang.org/protobuf from 1.36.6 to 1.36.7 by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/525\n* Bump google.golang.org/protobuf from 1.36.7 to 1.36.8 by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/527\n* Bump google.golang.org/protobuf from 1.36.8 to 1.36.10 by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/535\n* Bump github.com/jhump/protoreflect from 1.17.0 to 1.18.0 by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/545\n* Bump golang.org/x/net from 0.49.0 to 0.55.0 in the go_modules group across 1 directory by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/569\n* Bump google.golang.org/protobuf from 1.36.11 to 1.36.12 by @dependabot[bot] in https://github.com/fullstorydev/grpcurl/pull/576\n### Changes\n* snap by @PietroPasotti in https://github.com/fullstorydev/grpcurl/pull/512\n* Set GOWORK=off and GOPATHS=-trimpath when building by @gpassini in https://github.com/fullstorydev/grpcurl/pull/513\n* Restore Unix socket support by @zhyuri in https://github.com/fullstorydev/grpcurl/pull/498\n* Snap: strict confinement, stable grade and docs by @PietroPasotti in https://github.com/fullstorydev/grpcurl/pull/514\n* test: Update TLS error checks for Go 1.25 compatibility by @mikelolasagasti in https://github.com/fullstorydev/grpcurl/pull/522\n* feat: add arm snap build by @PietroPasotti in https://github.com/fullstorydev/grpcurl/pull/534\n* refactor: use slices.Contains to simplify code by @vastonus in https://github.com/fullstorydev/grpcurl/pull/536\n* refactor: use strings.Builder to improve performance by @rifeplight in https://github.com/fullstorydev/grpcurl/pull/537\n* update lead version to Go 1.25 by @dragonsinth in https://github.com/fullstorydev/grpcurl/pull/543\n* Add Windows Arm64 release by @kpreisser in https://github.com/fullstorydev/grpcurl/pull/542\n* refactor: remove obsolete // +build tag by @cuoguojida in https://github.com/fullstorydev/grpcurl/pull/560\n* Bump google.golang.org/grpc to v1.79.3 (CVE-2026-33186 + 3 transitive CVEs) by @shreyas-sriram in https://github.com/fullstorydev/grpcurl/pull/559\n* Bump google.golang.org/grpc from 1.66.2 to 1.80.0 by @olegbonar in https://github.com/fullstorydev/grpcurl/pull/556\n* Add support for TLS 1.3 by @bcleenders in https://github.com/fullstorydev/grpcurl/pull/564\n* Fast-fail on connection errors by @bcleenders in https://github.com/fullstorydev/grpcurl/pull/567\n* fix xds credentials being silently ignored by @erikjoh in https://github.com/fullstorydev/grpcurl/pull/566\n* docs: fix typo \"foor\" -> \"foo\" in README example by @maxtaran2010 in https://github.com/fullstorydev/grpcurl/pull/571\n* Fix flaky TLS test by waiting for dial outcome before closing connection by @bcleenders in https://github.com/fullstorydev/grpcurl/pull/572\n* Fix path traversal attack in `-proto-out-dir` by @bcleenders in https://github.com/fullstorydev/grpcurl/pull/573\n* remove old SA1019 lint:ignore by @dragonsinth in https://github.com/fullstorydev/grpcurl/pull/574\n* go mod update by @dragonsinth in https://github.com/fullstorydev/grpcurl/pull/578\n* remove old SA1019 lint:ignore by @dragonsinth in https://github.com/fullstorydev/grpcurl/pull/577\n* fix: preserve wrapped request and descriptor errors by @ginavalent in https://github.com/fullstorydev/grpcurl/pull/579\n* update release to cut and upload via gh actions by @SamKirsch10 in https://github.com/fullstorydev/grpcurl/pull/580\n\n## New Contributors\n* @PietroPasotti made their first contribution in https://github.com/fullstorydev/grpcurl/pull/512\n* @zhyuri made their first contribution in https://github.com/fullstorydev/grpcurl/pull/498\n* @mikelolasagasti made their first contribution in https://github.com/fullstorydev/grpcurl/pull/522\n* @vastonus made their first contribution in https://github.com/fullstorydev/grpcurl/pull/536\n* @rifeplight made their first contribution in https://github.com/fullstorydev/grpcurl/pull/537\n* @kpreisser made their first contribution in https://github.com/fullstorydev/grpcurl/pull/542\n* @cuoguojida made their first contribution in https://github.com/fullstorydev/grpcurl/pull/560\n* @shreyas-sriram made their first contribution in https://github.com/fullstorydev/grpcurl/pull/559\n* @olegbonar made their first contribution in https://github.com/fullstorydev/grpcurl/pull/556\n* @bcleenders made their first contribution in https://github.com/fullstorydev/grpcurl/pull/564\n* @maxtaran2010 made their first contribution in https://github.com/fullstorydev/grpcurl/pull/571\n* @ginavalent made their first contribution in https://github.com/fullstorydev/grpcurl/pull/579\n* @SamKirsch10 made their first contribution in https://github.com/fullstorydev/grpcurl/pull/580\n\n**Full Changelog**: https://github.com/fullstorydev/grpcurl/compare/v1.9.3...v1.9.4\n\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":17}
