\n\r\nPreviously only a change of the manager policy was detected, so changing e.g. `reservedSystemCPUs` or `reservedMemory`, or\r\na change of the CPU/NUMA topology of the machine, left kubelet unable to start until the state file was removed manually.\r\n\r\nOnly the rendered `KubeletConfiguration` (`machine.kubelet.extraConfig`) is checked: the resource manager settings passed as kubelet\r\ncommand line flags via `machine.kubelet.extraArgs` (e.g. `--cpu-manager-policy`, `--reserved-cpus`) are not taken into account.\r\n\r\n\r\n### Component Updates\r\n\r\nLinux: 6.18.54\r\ncontainerd: 2.3.6\r\nrunc: 1.5.2\r\nKubernetes: 1.37.1\r\n\r\nTalos is built with Go 1.26.8.\r\n\r\n\r\n### Contributors\r\n\r\n* Andrey Smirnov\r\n* Jarrad S\r\n* Noel Georgi\r\n* Joakim Nohlg\u00e5rd\r\n* Karthik Chowdary\r\n* Loki San\r\n\r\n### Changes\r\n<details><summary>20 commits</summary>\r\n<p>\r\n\r\n* siderolabs/talos@f513c7358 release(v1.14.2): prepare release\r\n* siderolabs/talos@114c70ae3 feat: update Kubernetes default to 1.37.1\r\n* siderolabs/talos@00a53e13d feat: update containerd to 2.3.6\r\n* siderolabs/talos@305ced360 test: fix the md-boot pipeline\r\n* siderolabs/talos@540a427c3 docs: clarify the KMS endpoint scheme\r\n* siderolabs/talos@f53a00050 fix: drop devices from the last observed generation if they are gone\r\n* siderolabs/talos@a015f8176 feat: handle the change in kubelet's CPU and memory policies\r\n* siderolabs/talos@c792fa485 fix: perform stricter validation of hostnames/search domains\r\n* siderolabs/talos@3137edfb0 fix: handle correctly routes without outlinkname set\r\n* siderolabs/talos@e966b131d chore: clean up unused settings in LVM reconcile controllers\r\n* siderolabs/talos@da3b328db fix: do not disclose pre-shared Wireguard key in LinkStatus\r\n* siderolabs/talos@80fd649d1 fix: retry transient LVM reconciliation failures\r\n* siderolabs/talos@98b3cb51e feat: add macsec module\r\n* siderolabs/talos@949b85fa7 fix: preserve hostname under Docker (in container mode)\r\n* siderolabs/talos@ad65799ab fix: handle Akamai/Linode metadata without IPv6\r\n* siderolabs/talos@2e87819aa docs: clarify admission control and flannel config docs\r\n* siderolabs/talos@a9422412d test: fix the aws-arm64 test\r\n* siderolabs/talos@c7e25249d fix: use correct conditions on CRI <> sandboxd dependency\r\n* siderolabs/talos@5a78c3fc3 fix: extend the USB settle code for more code paths\r\n* siderolabs/talos@a8ac3ca50 feat: sync pkgs/tools\r\n</p>\r\n</details>\r\n\r\n### Changes from siderolabs/pkgs\r\n<details><summary>12 commits</summary>\r\n<p>\r\n\r\n* siderolabs/pkgs@6c312e4 fix: add a patch to fix booting on Apple hardware\r\n* siderolabs/pkgs@e1a76c7 feat: update Linux to 6.18.54, runc to 1.5.2\r\n* siderolabs/pkgs@3f054f6 feat: enable CONFIG_CRYPTO_ECC, CONFIG_CRYPTO_ECDH on arm64 to match amd64\r\n* siderolabs/pkgs@cc717ed feat: enable CONFIG_BLK_WBT\r\n* siderolabs/pkgs@cc32ceb feat: update containerd to 2.3.6\r\n* siderolabs/pkgs@b9f707f feat: update Linux to 6.18.53\r\n* siderolabs/pkgs@cf70858 fix: add missing sboms for swtpm\r\n* siderolabs/pkgs@7f22731 feat: enable CONFIG_MACSEC in the kernel\r\n* siderolabs/pkgs@3e199fb feat: add swtpm\r\n* siderolabs/pkgs@31af1a6 feat: update DRBD & Linux firmware\r\n* siderolabs/pkgs@612628d feat: update Linux to 6.18.52\r\n* siderolabs/pkgs@ed28ebb chore: sync tools with release-1.14\r\n</p>\r\n</details>\r\n\r\n### Changes from siderolabs/tools\r\n<details><summary>1 commit</summary>\r\n<p>\r\n\r\n* siderolabs/tools@9776960 feat: update pcre to 10.48\r\n</p>\r\n</details>\r\n\r\n### Dependency Changes\r\n\r\n* **github.com/containerd/containerd/v2**        v2.3.5 -> v2.3.6\r\n* **github.com/siderolabs/pkgs**                 v1.14.0-25-gf694e1b -> v1.14.0-37-g6c312e4\r\n* **github.com/siderolabs/talos/pkg/machinery**  v1.14.1 -> v1.14.2\r\n* **github.com/siderolabs/tools**                v1.14.0-7-ga404efb -> v1.14.0-8-g9776960\r\n* **k8s.io/api**                                 v0.37.0 -> v0.37.1\r\n* **k8s.io/apiextensions-apiserver**             v0.37.0 -> v0.37.1\r\n* **k8s.io/apimachinery**                        v0.37.0 -> v0.37.1\r\n* **k8s.io/apiserver**                           v0.37.0 -> v0.37.1\r\n* **k8s.io/client-go**                           v0.37.0 -> v0.37.1\r\n* **k8s.io/component-base**                      v0.37.0 -> v0.37.1\r\n* **k8s.io/kube-proxy**                          v0.37.0 -> v0.37.1\r\n* **k8s.io/kube-scheduler**                      v0.37.0 -> v0.37.1\r\n* **k8s.io/kubectl**                             v0.37.0 -> v0.37.1\r\n* **k8s.io/kubelet**                             v0.37.0 -> v0.37.1\r\n* **k8s.io/pod-security-admission**              v0.37.0 -> v0.37.1\r\n* **k8s.io/utils**                               cf1189d6abe3 **_new_**\r\n\r\nPrevious release can be found at [v1.14.1](https://github.com/siderolabs/talos/releases/tag/v1.14.1)\r\n\r\n## Images\r\n\r\n```\r\nghcr.io/siderolabs/flannel:0.28.9\r\nregistry.k8s.io/coredns/coredns:v1.14.7\r\nregistry.k8s.io/etcd:3.7.1\r\nregistry.k8s.io/pause:3.10.2\r\nregistry.k8s.io/kube-apiserver:v1.37.1\r\nregistry.k8s.io/kube-controller-manager:v1.37.1\r\nregistry.k8s.io/kube-scheduler:v1.37.1\r\nregistry.k8s.io/kube-proxy:v1.37.1\r\nghcr.io/siderolabs/kubelet:v1.37.1\r\nregistry.k8s.io/networking/kube-network-policies:v1.1.1\r\nghcr.io/siderolabs/installer-base:v1.14.2\r\nghcr.io/siderolabs/imager:v1.14.2\r\nghcr.io/siderolabs/talos:v1.14.2\r\nghcr.io/siderolabs/talosctl-all:v1.14.2\r\nghcr.io/siderolabs/overlays:v1.14.2\r\nghcr.io/siderolabs/extensions:v1.14.2\r\n```\r\n\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0}}
