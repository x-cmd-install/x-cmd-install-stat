98282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":10008,"digest":"sha256:2ca7e67c7b134f0b1ea21a44ce8d48cdbfbfecb3afaa32ec3f571e3da5345c61","download_count":4,"created_at":"2026-10-26T14:49:15Z","updated_at":"2026-10-26T14:49:16Z"},{"id":678470951,"node_id":"RA_kwDOBoYXVM4ocKUn","name":"vmlinuz-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19124736,"digest":"sha256:fe4579c2872ff16f0fc52ba98a363ef114851ef720f7084496f5fbbe52bd0e41","download_count":3,"created_at":"2026-10-26T14:49:15Z","updated_at":"2026-10-26T14:49:17Z"},{"id":678470929,"node_id":"RA_kwDOBoYXVM4ocKUR","name":"vmlinuz-arm64.bundle","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":10098,"digest":"sha256:743b4c81a2f61bcb0a7e6e9ab7d405c66282fe5d2f412f7a8b2dc5d8a49c6cf0","download_count":2,"created_at":"2026-10-26T14:49:15Z","updated_at":"2026-10-26T14:49:16Z"}],"body":"## [Talos 1.14.5](https://github.com/siderolabs/talos/releases/tag/v1.14.5) (2026-10-26)\r\n\r\nWelcome to the v1.14.5 release of Talos!\r\n\r\n\r\n\r\nPlease try out the release binaries and report any issues at\r\nhttps://github.com/siderolabs/talos/issues.\r\n\r\n### On-demand Kernel Module Loading\r\n\r\nThe kernel can once again ask Talos to load a module on demand (`request_module()`), e.g. when a driver loads a helper module while probing a device,\r\nor when DRBD loads its transport module.\r\nTalos handles the kernel's `modprobe` usermode helper call and loads the module (shipped with Talos or a system extension) by the requested name,\r\napplying the parameters from `KernelModuleConfig` if the module is listed in the machine config.\r\nSuch modules no longer need to be listed in the machine config, and the order of the listed modules is not important.\r\n\r\nRequests via subsystem aliases (e.g. `fs-*`, `net-pf-*`, `crypto-*`), which userspace can trigger via mounts, sockets, etc., are refused,\r\nso on-demand loading can't be used to load arbitrary modules from workloads.\r\nThe outcome of each request is logged to the kernel log (`talosctl dmesg`).\r\n\r\n\r\n### Component Updates\r\n\r\nLinux: 6.18.58\r\netcd: 3.7.3\r\n\r\nTalos is built with Go 1.26.10.\r\n\r\n\r\n### Contributors\r\n\r\n* Andrey Smirnov\r\n* Mateusz Urbanek\r\n* immanuwell\r\n* Daniel Chaplin\r\n* Erwan Leboucher\r\n* Kyle Tse\r\n* Michał Małyska\r\n* Nicolas Brainez\r\n* Orzelius\r\n* sasha-sup\r\n\r\n### Changes\r\n<details><summary>25 commits</summary>\r\n<p>\r\n\r\n* siderolabs/talos@dad8d3edf release(v1.14.5): prepare release\r\n* siderolabs/talos@2f97b6a4b test: verify on-demand kernel module loading end-to-end\r\n* siderolabs/talos@c35fd8cef feat: load kernel modules on demand via the modprobe usermode helper\r\n* siderolabs/talos@bf34a0ebb feat: add EDAC_10NM kernel module\r\n* siderolabs/talos@25c16761c fix: race with platform accessing metadata volumes\r\n* siderolabs/talos@b88cda936 feat: update etcd to 3.7.3\r\n* siderolabs/talos@34d408094 fix: pull images over HTTP/1.1\r\n* siderolabs/talos@2dc3686b1 fix: preserve project quotas on temporary growfs mounts\r\n* siderolabs/talos@bffcf9b48 fix: correctly pass hostname to the proxy in gRPC dial\r\n* siderolabs/talos@6b3ea905b fix: preserve rejected edits in talosctl edit\r\n* siderolabs/talos@b6e5fa2e2 feat: implement RAID1 (md-raid) support in BIOS mode\r\n* siderolabs/talos@fb2b077b5 fix: ignore netlink recoverable errors in watchers\r\n* siderolabs/talos@2f7efe81b fix: skip kexec when the kernel finds no free memory region\r\n* siderolabs/talos@d6488456b fix: provide proper concurrency for health checks\r\n* siderolabs/talos@03075319b fix: preserve omitted CEL expressions when patching configs\r\n* siderolabs/talos@aca5abc16 fix: skip EFI boot entries that cannot be decoded\r\n* siderolabs/talos@9c69456c9 fix: read VMware guestinfo with SecureBoot enabled\r\n* siderolabs/talos@6c6fec7d5 fix: parse EFI load options with an empty description\r\n* siderolabs/talos@e0002327b fix: route pod CIDRs matching the KubeSpan ULA purpose byte\r\n* siderolabs/talos@449f82d46 fix: wait for inactive MD arrays before volume discovery\r\n* siderolabs/talos@824b0f976 test: reproduce degraded md boot array reboot\r\n* siderolabs/talos@ce2fa4132 fix: high cpu usage by the bridge keepalive dummy qemu vm\r\n* siderolabs/talos@51eda9a51 chore: add qemu-ip-family integration suite\r\n* siderolabs/talos@e700de0c0 feat: update Linux 6.18.58, Go 1.26.10\r\n* siderolabs/talos@3fb46c378 release(v1.14.4): prepare release\r\n</p>\r\n</details>\r\n\r\n### Changes since v1.14.4\r\n<details><summary>24 commits</summary>\r\n<p>\r\n\r\n* siderolabs/talos@dad8d3edf release(v1.14.5): prepare release\r\n* siderolabs/talos@2f97b6a4b test: verify on-demand kernel module loading end-to-end\r\n* siderolabs/talos@c35fd8cef feat: load kernel modules on demand via the modprobe usermode helper\r\n* siderolabs/talos@bf34a0ebb feat: add EDAC_10NM kernel module\r\n* siderolabs/talos@25c16761c fix: race with platform accessing metadata volumes\r\n* siderolabs/talos@b88cda936 feat: update etcd to 3.7.3\r\n* siderolabs/talos@34d408094 fix: pull images over HTTP/1.1\r\n* siderolabs/talos@2dc3686b1 fix: preserve project quotas on temporary growfs mounts\r\n* siderolabs/talos@bffcf9b48 fix: correctly pass hostname to the proxy in gRPC dial\r\n* siderolabs/talos@6b3ea905b fix: preserve rejected edits in talosctl edit\r\n* siderolabs/talos@b6e5fa2e2 feat: implement RAID1 (md-raid) support in BIOS mode\r\n* siderolabs/talos@fb2b077b5 fix: ignore netlink recoverable errors in watchers\r\n* siderolabs/talos@2f7efe81b fix: skip kexec when the kernel finds no free memory region\r\n* siderolabs/talos@d6488456b fix: provide proper concurrency for health checks\r\n* siderolabs/talos@03075319b fix: preserve omitted CEL expressions when patching configs\r\n* siderolabs/talos@aca5abc16 fix: skip EFI boot entries that cannot be decoded\r\n* siderolabs/talos@9c69456c9 fix: read VMware guestinfo with SecureBoot enabled\r\n* siderolabs/talos@6c6fec7d5 fix: parse EFI load options with an empty description\r\n* siderolabs/talos@e0002327b fix: route pod CIDRs matching the KubeSpan ULA purpose byte\r\n* siderolabs/talos@449f82d46 fix: wait for inactive MD arrays before volume discovery\r\n* siderolabs/talos@824b0f976 test: reproduce degraded md boot array reboot\r\n* siderolabs/talos@ce2fa4132 fix: high cpu usage by the bridge keepalive dummy qemu vm\r\n* siderolabs/talos@51eda9a51 chore: add qemu-ip-family integration suite\r\n* siderolabs/talos@e700de0c0 feat: update Linux 6.18.58, Go 1.26.10\r\n</p>\r\n</details>\r\n\r\n### Changes from siderolabs/pkgs\r\n<details><summary>6 commits</summary>\r\n<p>\r\n\r\n* siderolabs/pkgs@f4bda77 feat: update Linux to 6.18.58\r\n* siderolabs/pkgs@a068a03 feat: enable EDAC_10NM kernel option\r\n* siderolabs/pkgs@ec11950 fix: restore ACPI power button\r\n* siderolabs/pkgs@42b6fe2 feat: update tools/toolchain\r\n* siderolabs/pkgs@2ec10eb chore: update DRBD compat\r\n* siderolabs/pkgs@643b731 feat: update Linux to 6.18.57\r\n</p>\r\n</details>\r\n\r\n### Changes from siderolabs/tools\r\n<details><summary>2 commits</summary>\r\n<p>\r\n\r\n* siderolabs/tools@8dad45e feat: update ca-certificates to 2026-10-20\r\n* siderolabs/tools@c6b3f5c chore: update the toolchain\r\n</p>\r\n</details>\r\n\r\n### Dependency Changes\r\n\r\n* **github.com/siderolabs/pkgs**                 v1.14.0-42-g5fa47d1 -> v1.14.0-48-gf4bda77\r\n* **github.com/siderolabs/talos/pkg/machinery**  v1.14.3 -> v1.14.5\r\n* **github.com/siderolabs/tools**                v1.14.0-9-g6b71647 -> v1.14.0-11-g8dad45e\r\n* **go.etcd.io/etcd/api/v3**                     v3.7.2 -> v3.7.3\r\n* **go.etcd.io/etcd/client/pkg/v3**              v3.7.2 -> v3.7.3\r\n* **go.etcd.io/etcd/client/v3**                  v3.7.2 -> v3.7.3\r\n* **go.etcd.io/etcd/etcdutl/v3**                 v3.7.2 -> v3.7.3\r\n* **golang.org/x/net**                           v0.60.0 -> v0.61.0\r\n* **golang.org/x/sync**                          v0.23.0 -> v0.24.0\r\n* **golang.org/x/sys**                           v0.48.0 -> v0.49.0\r\n* **golang.org/x/term**                          v0.46.0 -> v0.47.0\r\n* **golang.org/x/text**                          v0.42.0 -> v0.43.0\r\n\r\nPrevious release can be found at [v1.14.3](https://github.com/siderolabs/talos/releases/tag/v1.14.3)\r\n\r\n## Images\r\n\r\n```\r\nghcr.io/siderolabs/flannel:0.28.9\r\nregistry.k8s.io/coredns/coredns:v1.14.7\r\nregistry.k8s.io/etcd:v3.7.3\r\nregistry.k8s.io/pause:3.10.2\r\nregistry.k8s.io/kube-apiserver:v1.37.1\r\nregistry.k8s.io/kube-controller-manager:v1.37.1\r\nregistry.k8s.io/kube-scheduler:v1.37.1\r\nregistry.k8s.io/kube-proxy:v1.37.1\r\nghcr.io/siderolabs/kubelet:v1.37.1\r\nregistry.k8s.io/networking/kube-network-policies:v1.1.2\r\nghcr.io/siderolabs/installer-base:v1.14.5\r\nghcr.io/siderolabs/imager:v1.14.5\r\nghcr.io/siderolabs/talos:v1.14.5\r\nghcr.io/siderolabs/talosctl-all:v1.14.5\r\nghcr.io/siderolabs/overlays:v1.14.5\r\nghcr.io/siderolabs/extensions:v1.14.5\r\n```\r\n\r\n"}
