{"id":255663513,"author":{"login":"Davidy22","id":872968,"node_id":"MDQ6VXNlcjg3Mjk2OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAEIexM4PPR2Z","tag_name":"3.10.1","target_commitish":"master","name":"3.10.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-09-05T10:55:08Z","updated_at":"2025-10-20T05:36:20Z","published_at":"2025-10-20T05:36:20Z","assets":[],"body":"Quite a while has passed since the last release, and a fair few changes have been made so it's about time for another release.\r\n\r\n## What's Changed\r\n* Correction of minor typos for Russian localization by @dimuska139 in https://github.com/Guake/guake/pull/2194\r\n* Enable the use of AyatanaAppIndicator by @EbonJaeger in https://github.com/Guake/guake/pull/2200\r\n* Prevent the use of non-image files as a background image (replaces #2206) by @0scvr in https://github.com/Guake/guake/pull/2207\r\n* Allow splitting with specified size using --split-vertical or --split-horizontal by @welhoilija in https://github.com/Guake/guake/pull/2208\r\n* docs: update website URLs, use https:// by @ulidtko in https://github.com/Guake/guake/pull/2239\r\n* chore: update hu language \ud83c\udded\ud83c\uddfa by @Swiftyhu in https://github.com/Guake/guake/pull/2240\r\n* Remove underlines from quick-open targets when quick-open disabled by @chrhansk in https://github.com/Guake/guake/pull/2235\r\n* Makefile: ensure that schema source files are in place before schema recompilation occurs by @jayaddison in https://github.com/Guake/guake/pull/2257\r\n* Fix save content with newer Vte by @smith-doug in https://github.com/Guake/guake/pull/2218\r\n* Updates to CI by @Davidy22 in https://github.com/Guake/guake/pull/2272\r\n* Fix window position drift during visibility toggles by @xai in https://github.com/Guake/guake/pull/2290\r\n\r\n## New Contributors\r\n* @dimuska139 made their first contribution in https://github.com/Guake/guake/pull/2194\r\n* @EbonJaeger made their first contribution in https://github.com/Guake/guake/pull/2200\r\n* @0scvr made their first contribution in https://github.com/Guake/guake/pull/2207\r\n* @welhoilija made their first contribution in https://github.com/Guake/guake/pull/2208\r\n* @Swiftyhu made their first contribution in https://github.com/Guake/guake/pull/2240\r\n* @chrhansk made their first contribution in https://github.com/Guake/guake/pull/2235\r\n* @jayaddison made their first contribution in https://github.com/Guake/guake/pull/2257\r\n* @smith-doug made their first contribution in https://github.com/Guake/guake/pull/2218\r\n* @xai made their first contribution in https://github.com/Guake/guake/pull/2290\r\n\r\n**Full Changelog**: https://github.com/Guake/guake/compare/3.10...3.10.1","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":7,"rocket":0,"eyes":0},"mentions_count":11}
