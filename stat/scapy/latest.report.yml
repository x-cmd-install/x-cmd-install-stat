{"id":401973165,"author":{"login":"gpotter2","id":10530980,"node_id":"MDQ6VXNlcjEwNTMwOTgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOApfmNs4X9Z-t","tag_name":"v2.8.0","target_commitish":"master","name":"v2.8.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-02T16:14:41Z","updated_at":"2026-10-02T16:20:37Z","published_at":"2026-10-02T16:19:58Z","assets":[],"body":"*Hi everyone. This release is a bit different, as it is heavily focused on security fixes as we are clearing our backlog of AI-Assisted reports. We have also clarified the guidelines around AI, contributions and security reports. To contributors, feel free to reach out if you haven't heard back from us in a whilte !*\r\n\r\n# Deprecation notice\r\n\r\n- This major version will be **the last to support Python 3.7 and 3.8**. While this was initially planned for 2.7.0, support was extended because of how used those versions still were. They have been EoL for more than 2 years, and we highly encourage remaining users to upgrade.\r\n\r\n### A note about contributing guidelines\r\n\r\nWe have clarified our CONTRIBUTING and SECURITY guidelines. This notably includes some new guidance related to the use of AI, and some instructions regarding the submission of security issues. We encourage contributors to take a moment to read the updated versions.\r\n\r\n### Security\r\n\r\nScapy has taken part in `OpenAI + Trail of Bits` collab's initiative called [\"Patch the Planet\"](https://openai.com/index/patch-the-planet/). As part of this initiative, we have received a free security coverage of our code overseen by [KernelClint](https://github.com/KernelClint) (Trail of Bits) and multiple OpenAI agents. This has led to the discovery of around 130+ bugs, among which were 54 issues that could be considered related to security, with various degrees of severity. You can find a partial list on https://github.com/secdev/scapy/security/advisories and [here](https://github.com/secdev/scapy/pulls?q=is%3Apr+state%3Amerged+author%3Akernelclint) but <ins>**please bear in mind that some reports have been written entirely by AI**</ins>.\r\n\r\nAfter analysis, we have marked 5 vulnerabilities with a \"High\" level of impact, which justify an immediate upgrade to `2.8.0`, or backporting if packaged by downstream repositories:\r\n- [Patch the Planet: arbitrary read of on-disk files while parsing TLS packets](https://github.com/secdev/scapy/security/advisories/GHSA-g94r-m85q-4mpj)\r\n- [Patch the Planet: out-of-band read while receiving packets through libpcap](https://github.com/secdev/scapy/security/advisories/GHSA-c547-xwrv-q9jm)\r\n- [Patch the Planet: A malicious SMB directory entry makes recursive downloads overwrite arbitrary local files](https://github.com/secdev/scapy/security/advisories/GHSA-7vg7-7f47-97qf)\r\n- [Patch the Planet: SMB server mishandling of share case insensitivity leads to default folder always being served](https://github.com/secdev/scapy/security/advisories/GHSA-72w4-gq3w-rrpp)\r\n- [Patch the Planet: A zero-width NetFlow template keeps `NetflowSession` running forever](https://github.com/secdev/scapy/security/advisories/GHSA-f6x2-gmgm-25p8)\r\n\r\nThe other issues have been triaged as \"Moderate\" or \"Low\" and don't justify immediate action from users or downstream package maintainers (those include crashes, issues in various protocol implementations, automatons and answering machines, mis-implementations of protocols like our TLS stack, etc. but nothing that leads to a potential compromission of the host machine).\r\n\r\nWe would like to thank again `OpenAI` and `Trail of Bits` (and in particular @KernelClint) for this opportunity and the time spent on this project.\r\n\r\n# Changelog\r\n\r\n- **Windows protocols**:\r\n  - Kerberos: IAKERB support, WinSSP, KDC pinning, S4U+FAST fix, NTLM MIC server-side check\r\n  - SMB: various SMB2 fixes, new `smbclient()` features\r\n  - DCE/RPC: fragmentation fixes, proper client auth denial, context commit fixes\r\n  - NTLM/SPNEGO/WinSSP: late fallback mechanism, encryption support, doc fixes\r\n  - **[new]** registry abstraction layer for [MS-RRP] RPC\r\n  - [MS-NRTP] fix\r\n- **Automotive related changes**: \r\n  - Added SAE J1939 support\r\n  - Added standalone UDS/KWP/OBD/GMLAN packets\r\n  - Improved CAN/ISO-TP soft-socket robustness\r\n  - Added configurable busy-response retries in automotive scanners\r\n- Work has begun to clean up the remaining compatibility code that allowed the transition from Python 2.\r\n- Minor security fixes (the full list is available in the Security tab):\r\n  - RADIUS: verify Message-Authenticator\r\n  - fwdmachine: verify upstream TLS certs, correct TLS server context\r\n  - tls/sslv2: stricter security handling\r\n  - Several fuzzing-found crash fixes (HSRP, Bluetooth, Kerberos)\r\n  - Bound/robustness fixes across pcap, pcapng, ISOTP, TCP reassembly, BGP, IPv6, HTTP, DNS, LDAP, modbus parsing\r\n- **Bluetooth**:\r\n  - Many new vendor-specific command modules (Realtek, Barrot, Intel, Espressif, CSR, Zephyr)\r\n  - Fixed link-layer byte order, normalized field naming\r\n  - New HCI event handler registration mechanism\r\n- **New protocols/contrib**:\r\n  - DICOM support\r\n  - CBOR implementation (fields + packets)\r\n  - SAE J1939 protocol + soft socket\r\n  - PTP protocol\r\n  - MySQL classic protocol\r\n- **802.11**: added HE Operation, HT Operation, EHT Operation, and Radio Measurement elements\r\n- **Performance**: minor improvements to packet dissection/build speed, reduced unnecessary copying in reassembly paths (netbios, pcapng, HTTP/2, LDAP, ISOTP, TFTP)\r\n- **DNS**: EDNS0 padding option, client-subnet fixes, off-by-four fix\r\n- IGMP: full rework, merged implementations\r\n- Misc fixes: TCP MD5 option calculation, BPF error reporting, FreeBSD 32-bit BPF support, hexdiff bounds check","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":0,"eyes":0},"mentions_count":1}
