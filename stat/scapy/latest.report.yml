{"id":272948076,"author":{"login":"gpotter2","id":10530980,"node_id":"MDQ6VXNlcjEwNTMwOTgw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOApfmNs4QRNts","tag_name":"v2.7.0","target_commitish":"master","name":"v2.7.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-12-26T21:46:10Z","updated_at":"2025-12-27T15:14:19Z","published_at":"2025-12-26T22:01:47Z","assets":[],"body":"*Hi everyone & Merry Christmas ! This release brings many new features, bug fixes and cleanups. If you encounter any issues when trying it out, please submit bug reports !*\r\n\r\n### Deprecation notice\r\n\r\n- This version will be **the last to support Python 3.7 and 3.8**. (PEP639 will require a new license format starting in 2026, which isn't supported in the latest version of setuptools available on those older versions of Python.)\r\n\r\n# Changelog\r\n\r\n- **[new]** **_ForwardMachine_**: a new Scapy feature allowing to create a scriptable multi-clients, multi-destination TCP forwarder. It can edit packets on the fly, redirect them to another server, perform TLS interception and more. More details [here](https://scapy.readthedocs.io/en/latest/advanced_usage/fwdmachine.html)\r\n\r\n<p align=\"center\">\r\n<img width=\"562\" height=\"256\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/dc0e6701-adbe-4247-8f8b-2c2621c3d4f6\" />\r\n</p>\r\n\r\n- **Windows protocols**:\r\n  - Implementation details in [this paper](https://www.sstic.org/media/SSTIC2025/SSTIC-actes/l_outillage_reseau_windows_une_affaire_d_implement/SSTIC2025-Article-l_outillage_reseau_windows_une_affaire_d_implementation-potter.pdf)\r\n  - SMB:\r\n    - client improvements ([doc](https://scapy.readthedocs.io/en/latest/layers/smb.html#high-level-smbclient))\r\n    - server improvements ([doc](https://scapy.readthedocs.io/en/latest/layers/smb.html#high-level-smbserver))\r\n    - add support for encryption\r\n    - add support for requiring signature\r\n  - Kerberos:\r\n    - FAST support\r\n    - PKINIT support\r\n    - DMSA support\r\n    - many improvements to Ticketer++ (see demo below)\r\n    - many bug fixes & improvements\r\n  - SSPs:\r\n    - SPNEGOSSP was re-written for clarity & now enforces proper mechListMIC rules\r\n    - NTLMSSP and KerberosSSP were improved. Support for KB5068222 changes. Better error handling.\r\n    - NeglogonSSP now supports Kerberos secure channel (Windows 2025+)\r\n  - **[new]** .NET Remoting layer ([MS-NRTP])\r\n  - LDAP: many improvements to the client\r\n  - **[new]** graphical LDAP client \"ldaphero\"\r\n  - DCE/RPC\r\n    - better handling of contexts\r\n    - better handling of fragmentation\r\n    - See https://github.com/gpotter2/scapy-rpc for the MIDL -> Scapy compiler\r\n  - **[new]** DCOM is now supported\r\n- **[removal]** `scapy -s` has been removed.\r\n- TLS:\r\n  - Parsing of CSR structures is now implemented (PKCS#10 and CMC variants)\r\n  - Big refactor of the TLS utils to parse certificates, CSRs, keys and manipulate them. See [examples in the documentation](https://scapy.readthedocs.io/en/latest/api/scapy.layers.tls.cert.html)\r\n  - New `CertTree` class to act as a certificate store one can check a certificate against.\r\n  - better handling of NSS KeyLog for TLS 1.3 decryption\r\n  - doc improvements\r\n  - more structures are implemented\r\n- bluetooth:\r\n  - MANY new payloads (EIR, BTLE, HCI_MON ...)\r\n  - display of vendor IDs\r\n  - many other bug fixes & improvements !\r\n- **[new]** `radiusd()`: a small RADIUS server (CHAP / MS-CHAPv2)\r\n- **[new]** `nbns_request`: perform a Netbios discovery\r\n- **[fixed]** Scapy was not loading properly on 32bits *BSD plateforms\r\n- ISAKMP / IKEv2: more supported payloads\r\n- **[major doc changes]** the \"Advanced\" section of the documentation [was split](https://scapy.readthedocs.io/en/latest/advanced_usage/index.html)\r\n- [darwin/osx] support TUN interfaces in `TunTapInterface`\r\n- automaton:\r\n  - **[new]** `spawn()`, allowing to serve automatons on a port\r\n  - support for sessions (e.g. `TCPSession`)\r\n  - many more fixes and performance improvements (unclosed file descriptors could lead to memory leaks)\r\n- HTTP:\r\n  - server/client improvements\r\n  - support custom headers\r\n  - support for GSSAPI authentication with channel binding\r\n  - session improvements\r\n  - Added EOF condition to the `HTTP_Server` state `SERVE`.\r\n  - and more\r\n- DNS:\r\n  - improve [`dnsd()`](https://scapy.readthedocs.io/en/latest/api/scapy.layers.dns.html#scapy.layers.dns.DNS_am) relay mode\r\n  - fix a bug with (de)compression that could occur in certain cases\r\n  - **[fixed]** [`dns_resolve`](https://scapy.readthedocs.io/en/latest/api/scapy.layers.dns.html#scapy.layers.dns.dns_resolve) now properly fallbacks on TCP when packets are too big\r\n- TFTP: improvements of the interface selection in the client/server automatons\r\n- pcapng: support of multiple comments, fixes to bound checks\r\n- **[fixed]** defragment6 was not working in some cases\r\n- improve handling of newer _IPython_ versions, fix some deprecation warnings\r\n- improve handling of newer _cryptography_ versions, fix some deprecation warnings\r\n- BGP: support reassembly with TCPSession\r\n- NTP: various fixes, big refactor of the layer\r\n- **[fixed]** AsyncSniffer stop() failed in some cases\r\n- l2: improvements to `arping()` on interfaces with no IP addresses\r\n- Defaulted `sr1` to `threaded=False`\r\n- Improved error handling in `L2Socket.close()` by adding `ValueError`.\r\n- **new protocols**:\r\n  - PSP\r\n- many other bug fixes to: STUN, 6Lowpan, DHCPv6\r\n\r\n### Automotive Layers\r\n\r\n* DoIP:\r\n  * **[new]** Added version field for DoIP and DoIP sockets.\r\n  * Adjusted `hashret` handling in DoIP.\r\n*UDS:\r\n  * **[new]** Added additional argument for `UDS_DSCEnumerator`.\r\n  * **[new]** Added software reset function for the UDS scanner.\r\n  * Fixed answer function for `UDS_HSFZSocket`.\r\n* ISOTP / Automotive Scanning:\r\n  * **[new]** Added FD support for `isotpscan`.\r\n  * **[new]** Added CAN-FD support for `ISOTPScan`.\r\n*HSFZ:\r\n  * Improved incorrect tester field naming.\r\n  * Added addressing information to `incorrect_tester_address` packets.\r\n  * Improved alive-check dissection.\r\n  * Corrected acknowledgment transfer packet structure.\r\n  * Ensured vehicle identification string is only parsed when non-zero length.\r\n  * Updated HSFZ with more detailed dissection logic.\r\n*UDS / GMLAN / AutomotiveScanner:\r\n  * Various updates and improvements across UDS, GMLAN, and AutomotiveScanner modules.\r\n*ISO-TP:\r\n  * Enhanced ISO-TP soft socket implementation.\r\n  * Improved `SOMEIP.fragment()` behavior.\r\n\r\n<details>\r\n\r\n<summary>\r\n\r\n## Video demos (click here)\r\n\r\n</summary>\r\n\r\n- **Ticketer++**: a module to manipulate Kerberos tickets. [documentation](https://scapy.readthedocs.io/en/latest/layers/kerberos.html#ticketer-module)\r\n\r\nhttps://github.com/user-attachments/assets/e422d731-b070-4e2c-b7ef-b243b2936888\r\n\r\n- **LdapH\u00e9ro**: a module that implements a graphical LDAP client [documentation](https://scapy.readthedocs.io/en/latest/layers/ldap.html#ldaphero)\r\n\r\nhttps://github.com/user-attachments/assets/af061bc4-2c63-4ea0-813b-7990497b0c55\r\n\r\n- **smbclient**: a SMB client (both interactive or programmable) [documentation](https://scapy.readthedocs.io/en/latest/layers/smb.html#high-level-smbclient)\r\n\r\nhttps://github.com/user-attachments/assets/c66d67f1-3ed6-43bf-af74-f62ed8435ee0\r\n\r\n- **smbserver**: [documentation](https://scapy.readthedocs.io/en/latest/layers/smb.html#high-level-smbserver)\r\n\r\nhttps://github.com/user-attachments/assets/e2bc0b82-4c94-4323-a133-c30098a473af\r\n\r\n</details>","reactions":{"total_count":11,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":10,"rocket":0,"eyes":0}}
