all bug, a sync that could never catch up, and problems on OpenCode 2 and Pi.\n\n### Windows\n\n- `caveman off --all` left the Caveman Blocks hook in Claude Code's settings, and every `caveman setup` added another copy. Blocks v0.1.0-rc.5 installs its binary as `.exe`, recognises the entries rc.4 wrote, and replaces them on the next `caveman setup`.\n- An npm `.cmd` shim that forwards to a native `.exe` launches again.\n- Hook child processes no longer flash a console window.\n\n### Sync\n\n- `caveman sync` uploads a large backlog of local spans in batches. Before, a store over the 16 MiB import cap failed with \"Request body exceeds configured limit\" on every retry.\n- The `ExperimentalWarning: SQLite` line is gone.\n- Known issue: the practice-findings part of `caveman sync` still reports \"Request rejected\". That is a Caveman Cloud bug and needs no CLI update once Cloud is fixed.\n\n### OpenCode\n\n- On OpenCode 2, a subagent spawn reset the mode for every session, undoing \"stop caveman\" and `/ultracave`. Subagent sessions no longer touch the mode.\n- The \"provider is not routed\" warning reads where a provider actually sends requests.\n\n### Pi\n\n- `caveman wrap pi` after `caveman enable pi` loaded the extension twice and Pi exited 1.\n- Routing a model no longer resets the thinking level (`--thinking high` stayed only until session start).\n- Works with Pi 1.1+ custom-message turns.\n- `@caveman-ai/pi` 0.3.1: the npm package now reads Caveman 4's config and port.\n\n### Claude Code and Codex\n\n- The prompt hook gives up after 2 seconds when the host sends no complete payload, like the other hooks.\n- Blocks honors `CLAUDE_CONFIG_DIR` and `CODEX_HOME`; it used to write the hook into `~/.claude` regardless.\n- `caveman status` no longer says \"account refresh offline\" after signing in to a different account.\n\n### Smaller fixes\n\n- Proxy: one key sent in both auth headers keeps its bearer; a Termux-built proxy is recognised as Caveman's own.\n- Memory: longer retry on SQLite contention.\n- `/caveman-compress` asks for a file path instead of improvising on pasted text, and says that the file goes to your model provider.\n- Tested agent pins moved to current Claude Code, Codex, OpenCode, Gemini, Kilo and Qwen releases.\n\n### Versions\n\n- `@caveman-ai/cli` 4.0.0 \u2192 4.0.1, binaries `bin-v4.0.0` \u2192 `bin-v4.0.1`, `@caveman-ai/pi` 0.3.0 \u2192 0.3.1, Blocks v0.1.0-rc.4 \u2192 v0.1.0-rc.5.\n\n### Companion releases\n\n- [Signed binaries, module index and container: `bin-v4.0.1`](https://github.com/JuliusBrussee/caveman/releases/tag/bin-v4.0.1)\n- [npm CLI: `@caveman-ai/cli@4.0.1`](https://www.npmjs.com/package/@caveman-ai/cli/v/4.0.1)\n- [npm Pi extension: `@caveman-ai/pi@0.3.1`](https://www.npmjs.com/package/@caveman-ai/pi/v/0.3.1)\n","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":6,"rocket":0,"eyes":0}}
