taller, plugins, skills, and local runtime.\n\n### Cache-safe compression and runtime\n\n- Keep previous compression decisions stable across a conversation, including decisions to send raw bytes. Cache-prefix checks record caveman-caused changes in local request telemetry and `caveman status`.\n- Pass through rate-limit responses with `Retry-After`; pin accepted raw retries to their conversation lineage.\n- Build the proxy and engine with tree-sitter support for TypeScript, JavaScript, Python, Rust, Java, C, and C++ in the six-platform binary matrix. The container remains a pure-Go build.\n- Route bare `/v1/models` by request protocol, support CCR on filesystems without hard links, and compress supported JUnit, pytest, and Jest reports.\n- Route Pi's ChatGPT OAuth traffic through the subscription proxy, including zstd request decoding. Tool-result compression requires a recoverable handle.\n\n### Native installs, hooks, and skills\n\n- Native Claude and Codex installs include the three voice skills. Disabling native routing keeps those skills available and disables every configured Claude profile.\n- Subagents inherit their session's mode. Headless `claude -p` and Agent SDK sessions start with the voice off.\n- Record session stats at SessionEnd, with project-scoped session lookup.\n- Add or extend always-on integration for Codex, Cursor, Copilot CLI, Antigravity CLI, and Grok Build; add CodeBuddy Code installation.\n- Install OpenCode cavecrew agents as subagents and warn when an active provider bypasses the proxy.\n- Move the standalone installer from `bin/` to `installer/` for enterprise marketplace compatibility; improve Windows command-shim handling and agent detection.\n- Refine voice rules for diff-first answers, questions, comments, and hookless status reporting.\n\n### Compression, evaluation, and extension\n\n- Add standalone OpenCode and OpenAI-compatible providers to `caveman-compress`, provider-specific model selection, and protected `nocompress` regions.\n- Record evaluation usage, add a deterministic fidelity suite, support language-specific prompt sets, and retain partial results after interrupted runs. Existing published style measurements remain labeled with their original rules and methods.\n- Browser extension 1.3.0 improves rich-editor snapshots and send-control discovery. Browser-store publication is separate from this GitHub release.\n\n### Companion releases\n\n- [Signed binaries and container: `bin-v2.1.0`](https://github.com/JuliusBrussee/caveman/releases/tag/bin-v2.1.0).\n- [npm CLI: `@caveman-ai/cli@2.1.0`](https://www.npmjs.com/package/@caveman-ai/cli/v/2.1.0).\n- [npm Pi extension: `@caveman-ai/pi@0.3.0`](https://www.npmjs.com/package/@caveman-ai/pi/v/0.3.0), including the Apache-2.0 license transition and LICENSE/NOTICE files from the unpublished 0.2.0 version.\n- [npm TypeScript middleware: `@caveman-ai/middleware@1.0.1`](https://www.npmjs.com/package/@caveman-ai/middleware/v/1.0.1), supporting tested Anthropic SDK versions through 0.131.0.\n\nAll four companion releases are published through the repository's signed-tag workflows. All 36 runtime binaries download anonymously; their checksum manifest and release identity are signed. The container signature is verified against the exact release workflow identity. npm packages carry GitHub Actions provenance. Platform integration tests, local cache checks, and release artifacts do not establish customer savings or production outcomes.\n\n[Published CLI smoke passed on macOS ARM, Linux x64 and Windows x64](https://github.com/JuliusBrussee/caveman/actions/runs/37733741067): clean npm installation, signed companion setup, wrapper endpoint injection in record mode, compression with byte-exact retrieval, and isolated npm uninstall preserving unrelated configuration.\n\nFull changes: https://github.com/JuliusBrussee/caveman/compare/v3.1.0...v3.2.0\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":1,"rocket":0,"eyes":0}}
