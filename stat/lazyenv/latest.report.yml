id":793425861,"node_id":"RA_kwDORhmiwc4vSrfF","name":"lazyenv_1.0.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2710856,"digest":"sha256:f9aee0661e61b6de79164d8246572a8155c9a0f68ab75669d5b5161aaa7b4bc8","download_count":3,"created_at":"2026-11-25T22:41:01Z","updated_at":"2026-11-25T22:41:02Z"},{"id":793425817,"node_id":"RA_kwDORhmiwc4vSreZ","name":"lazyenv_1.0.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3110216,"digest":"sha256:65f45937373a7a2c7f68cfa64dfe547897e8229b58503a5ab3da6ba28d25bccd","download_count":5,"created_at":"2026-11-25T22:41:00Z","updated_at":"2026-11-25T22:41:01Z"}],"body":"## Changelog\n### Features\n* 6fbc001da3d96a426fef560712c6abfea9ed2cb8: docs(features): describe absolute summary paths, the double-quote upgrade on save and the grouped reorder's sort (@lazynop)\n* e203a486cb4e39e98063e2b2ee36997d783babe1: docs(features): state that a save writes LF line endings and no BOM (#103) (@lazynop)\n* 8303f906e9f1c24318063a716bfe61968fb76b12: feat(just): show the failed assertions in just mutant's output and keep every run's output (#106) (@lazynop)\n* 84e1cde855c1c98240111690e750245dd630d1fe: feat(tools): refuse a comment baseline raise unless -allow-raise (@lazynop)\n* 58f7a0ebafcc4a9d0a9447eb2e15e2ecd39541aa: feat(tui): move a page or to either end with PgUp/PgDn and Home/End (#65) (@lazynop)\n* d82f7face8fabdeb2efa1db6c2e74ff72d9fddb6: feat(tui): page and jump through the compare file picker with PgUp/PgDn and Home/End (@lazynop)\n* d73b314fb50ea7234c97753a70b6f3bd138c62f0: feat(tui): page and jump through the help with PgUp/PgDn and Home/End (@lazynop)\n* 23d27b6c86b61146038a6e5e265604bcefa839de: feat(tui): show a notice in place of the screens below a 60x10 terminal (@lazynop)\n### Bug Fixes\n* 5d57a0b2665aed3d1a5dbdf75487ea7e74fd9712: fix(cli): report a rejected config file in --show-config and exit 1 (#47) (@lazynop)\n* 589e794c0b35ebf218cc6c8079a8574c5a4913ed: fix(config): name the config file once in its errors and show it on the error screen (@lazynop)\n* deb31c11baa8aec095a054fd9fbb89bb0cf70d93: fix(docstest): skip fenced code blocks in CodeSpans (@lazynop)\n* e72d049333b63fe5fa6ede206758d00c83826aff: fix(model): recompute duplicate flags on rename, add and delete (@lazynop)\n* da5678d34e832eb22a90a89b0c910f2cfce3a5ff: fix(model): recompute the placeholder flag of a changed value (@lazynop)\n* 4c86776cfe9bc19f08148bc303f4283ce11eeb3f: fix(model): revive a key deleted this session when a var is renamed onto it (@lazynop)\n* d1c253f23655d6be8632ba0b2d525459856296a7: fix(parser): keep an unquoted value with a tab unquoted on save (#93) (@lazynop)\n* c30528f861c7d3c40b1a24373626ef2fe0cf6b74: fix(parser): stop an empty .env from gaining a blank first line on save (@lazynop)\n* 95531cc7da5ee7f66247b9e2c372e227795f17e4: fix(tools): treat every //word:word comment as a directive in commentlint (@lazynop)\n* 4ea49f1c2b5d6f9ac7e0fe5f600f9676b8baad8f: fix(tui): apply show-secrets when the startup scan finds no file (@lazynop)\n* 45566e9cc7f4f960cd5936829c888405f31358bd: fix(tui): bound theme preview clicks and honour mouse-scroll-lines (@lazynop)\n* fdb4479e678f5216a655d666c7fe29799d1714b8: fix(tui): call pointer-receiver methods before the return that reads their receiver (#105) (@lazynop)\n* c56c83aa0ea5c9851544eae6a1f042611b64d3fd: fix(tui): call pointer-receiver methods on fields before the return that reads their owner (#110) (@lazynop)\n* 182c92c9ae90a643708230a4f514dece99d9cc13: fix(tui): cancel the compare picker with q and Ctrl+C (@lazynop)\n* 17a01f1a9b28bd812e667bce0dafd94c20828692: fix(tui): check .gitignore with paths relative to where git runs (@lazynop)\n* 6368084afc21853c2c42f01569d24c5864b8723c: fix(tui): count a duplicate from the source's bytes on disk (@lazynop)\n* e54610a502088dc723548d11ca48e95611767f5b: fix(tui): cut a config path too long for the error screen (@lazynop)\n* 63e8f03a1777dd4ce538271571bb26f2d66d2a55: fix(tui): cut a long search's query so the no-matches note keeps its closing quote (@lazynop)\n* 381f344e5af9798d33b57cd84019565e3a223107: fix(tui): cut long file names and group labels to keep their row (@lazynop)\n* 77301954a9cc60611b3cb29005b3fb4c66d42846: fix(tui): cut the var list's note to its one row (@lazynop)\n* 2b238b85b63f8905685b6019e3e09970d99b3de1: fix(tui): explain the replacement glyph for invalid bytes and C1 controls (@lazynop)\n* b0015ffef1c942416786b8d8b7ff2cb39052ab18: fix(tui): fill the terminal width in the theme preview (@lazynop)\n* dd3a7aada127c4fe9ab04dd9b20dbcd3240b5f15: fix(tui): fit the empty file list's note to the panel's minimum width (@lazynop)\n* 7900b39650c62c6956a0f44176f06b78376dc937: fix(tui): flatten control characters in file names wherever they are drawn (@lazynop)\n* ab8f40029cea06ba532cbd9539545db74cb87c0b: fix(tui): group the help screen's keys by the screen they work in (@lazynop)\n* af14fa5cb9227dc838812ecf69ad6f90e9da159d: fix(tui): ignore clicks outside the rows a list draws (@lazynop)\n* 93c07cb9dd71373190120530b11687da60557a82: fix(tui): indent wrapped help rows under their description (@lazynop)\n* 940e4b774acf254d8441e94a8b171f91a18d05b5: fix(tui): keep the active file while the wheel scrolls the compare picker (@lazynop)\n* 694d2e83264eacb64041c15320cba988e04d29a9: fix(tui): keep the config error screen inside the terminal (@lazynop)\n* 0352780628403757480eea52fe1b0a3513eb00de: fix(tui): keep the help screen open on a mouse click (@lazynop)\n* 1ea35c8c8af531b5b792ee63eb2e9eb890dc9362: fix(tui): keep the help's top row in place when the width changes (@lazynop)\n* d13fde3f52426ef357e2d51396ac271850c29246: fix(tui): keep the matrix cursor on its key when the rows re-sort (@lazynop)\n* 7b010fc767547fb16f7950e2978bce7583043eb5: fix(tui): keep the status bar's file info whole on one row when the bar wraps (@lazynop)\n* 957f5c1cc3b9deb612c7e12dde753b975cb714a0: fix(tui): keep the variables panel's minimum beside a wide file list (@lazynop)\n* 376ef5c7e72b66de93f14be7cfbad1a7cadf2790: fix(tui): list a reorder in the session summary (@lazynop)\n* c8bdeda46b295b053e5283aecb7f9663c44c15f1: fix(tui): list each panel-switch key under the panel it works in (@lazynop)\n* bd989a1bff1db2649fddc5309c670806b88c9ef2: fix(tui): list the compare and matrix glyphs and the paging keys in the help (@lazynop)\n* ae4a87d40d1585db1ea315ce2425d3a2510dcc6a: fix(tui): list the control-character stand-ins in the help (@lazynop)\n* 6d2a5c599fcc6c2312aca69749ffe066fea8c6f6: fix(tui): list the deleted vars when no var is left to show (@lazynop)\n* f1c30225dd6caa8ded9fe3060f6531b3e6209abf: fix(tui): measure non-ASCII file names in display columns in the file list and matrix (#61) (@lazynop)\n* 85ec9de67c02e377db7b7d2bdb18f4876cf6cdf3: fix(tui): name q and j/k in the help footer (@lazynop)\n* afcb3d202bd450904d5057f470c446990bce6828: fix(tui): name q in the compare picker's hint (@lazynop)\n* c86286614c93e8331bf06a2509ef5dafbf861d4e: fix(tui): name the mouse wheel in the help only with the mouse on (@lazynop)\n* 06e6f164e464021ab7e5e069102d18ffdfcf4629: fix(tui): name the wheel in the help only while it scrolls (@lazynop)\n* 6301dcf1a7db0c5eaa7e4cf780033d3e87492496: fix(tui): one config error per line on the error screen (@lazynop)\n* fc9d52eaaa4eb5e23d86af8d3ecfaac0fa6bbe63: fix(tui): raise a negative --file-list-width to the minimum instead of going auto (@lazynop)\n* 3427de810ddb267f01e2235cf48b15c203e0c85a: fix(tui): read git check-ignore paths NUL-separated so quoted names match (@lazynop)\n* 6cf7a1ee8aa4ee33f74b112867491b350a3131ab: fix(tui): refuse to edit a v