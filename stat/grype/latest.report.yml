zantow]\n- render TUI log lines on their own rows, with colors and a small header [PR [#3735](https://github.com/anchore/grype/pull/3735) @wagoodman]\n- `match.dpkg.using-cpes` (and `match.rpm.using-cpes`) is accepted but has no effect [Issue [#3746](https://github.com/anchore/grype/issues/3746)] [PR [#3747](https://github.com/anchore/grype/pull/3747) @amitschendel]\n- embedded spaces in bin location breaks install.sh [Issue [#2809](https://github.com/anchore/grype/issues/2809)] [PR [#3738](https://github.com/anchore/grype/pull/3738) @bIackr0se]\n- False positives: --add-cpes-if-none maps tomcat-embed-el to apache:tomcat CPE [Issue [#3730](https://github.com/anchore/grype/issues/3730)]\n- `match.rpm.using-cpes` has no effect [Issue [#3752](https://github.com/anchore/grype/issues/3752)] [PR [#3753](https://github.com/anchore/grype/pull/3753) @amitschendel]\n- Import metadata digest is not in the expected format [Issue [#3388](https://github.com/anchore/grype/issues/3388)]\n- Issue Pulling DB update [Issue [#3586](https://github.com/anchore/grype/issues/3586)]\n\n### Dependencies\n\n88 dependency changes (59 updated, 27 added, 2 removed). 2 vulnerabilities remediated.\n\n**\ud83d\udfe2 Remediated (2)**\n\n- [GHSA-8wmf-6v46-5gfg](https://github.com/advisories/GHSA-8wmf-6v46-5gfg) (Low) \u2014 go.opentelemetry.io/otel/exporters/otlp/otlptrace, go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp, go.opentelemetry.io/otel/sdk\n- [GHSA-pg57-6jwg-q645](https://github.com/advisories/GHSA-pg57-6jwg-q645) (Medium) \u2014 github.com/containerd/containerd/v2\n\n**Toolchains (1)**\n\n- Go minimum version: `1.26.3` \u2192 `1.26.8`\n\n<details>\n<summary>Updated (59 packages)</summary>\n\n- github.com/Microsoft/hcsshim `v0.15.0-rc.1` \u2192 `v0.15.0-rc.4`\n- github.com/anchore/bubbly `v0.2.1` \u2192 `v0.2.2`\n- github.com/anchore/go-logger `v0.1.1` \u2192 `v0.2.0`\n- github.com/anchore/go-rpmdb `v0.2.0` \u2192 `v0.2.1`\n- github.com/anchore/stereoscope `v0.3.2` \u2192 `