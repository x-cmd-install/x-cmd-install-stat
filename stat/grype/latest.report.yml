ithub.com/anchore/grype/pull/3904) @wils0ns]\n\n### Dependencies\n\n14 dependency changes (13 updated, 1 added). 1 vulnerability remediated.\n\n**🟢 Remediated (1)**\n\n- [GHSA-q7gw-24fr-5p69](https://github.com/advisories/GHSA-q7gw-24fr-5p69) (Medium) — go.opentelemetry.io/otel/sdk, go.opentelemetry.io/otel/trace\n\n**Toolchains (1)**\n\n- Go minimum version: `1.26.8` → `1.26.10`\n\n<details>\n<summary>Updated (13 packages)</summary>\n\n- github.com/anchore/stereoscope `v0.4.1` → `v0.4.2`\n- github.com/anchore/syft `v1.57.1` → `v1.57.2`\n- github.com/cloudflare/circl `v1.6.3` → `v1.6.5`\n- github.com/docker/cli `v29.9.2+incompatible` → `v29.9.3+incompatible`\n- github.com/gocsaf/csaf/v3 `v3.5.1` → `v3.7.1`\n- github.com/shopspring/decimal `v1.4.0` → `v1.6.0`\n- go.opentelemetry.io/otel `v1.46.0` → `v1.47.0`\n- go.opentelemetry.io/otel/metric `v1.46.0` → `v1.47.0`\n- go.opentelemetry.io/otel/metric/x `v0.68.0` → `v0.69.0`\n- go.opentelemetry.io/otel/sdk `v1.46.0` → `v1.47.0` **(🟢 remediated [GHSA-q7gw-24fr-5p69](https://github.com/advisories/GHSA-q7gw-24fr-5p69))**\n- go.opentelemetry.io/otel/sdk/metric `v1.46.0` → `v1.47.0`\n- go.opentelemetry.io/otel/trace `v1.46.0` → `v1.47.0` **(🟢 remediated [GHSA-q7gw-24fr-5p69](https://github.com/advisories/GHSA-q7gw-24fr-5p69))**\n- modernc.org/sqlite `v1.61.0` → `v1.61.1`\n</details>\n\n<details>\n<summary>Added (1 package)</summary>\n\n- go.opentelemetry.io/otel/log `v1.47.0`\n</details>\n\n**[(Full Changelog)](https://github.com/anchore/grype/compare/v0.121.3...v0.122.0)**\n\n","mentions_count":6}
