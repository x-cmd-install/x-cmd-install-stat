Licensing: copyright owner missing, needed for Debian packaging [Issue [#3501](https://github.com/anchore/grype/issues/3501)]\n\n### Bug Fixes\n\n- fixes typo in cpe example input for cpe-direct scan [PR [#3679](https://github.com/anchore/grype/pull/3679) @zhill]\n- `--by-cve`: which advisory record survives the merge varies between runs [Issue [#3630](https://github.com/anchore/grype/issues/3630)]\n\n### Additional Changes\n\n- OpenVEX transformer drops the namespace from Go module PURLs [Issue [#3680](https://github.com/anchore/grype/issues/3680)] [PR [#3683](https://github.com/anchore/grype/pull/3683) @arpitjain099]\n- Docs missing for include-aliases [Issue [#3663](https://github.com/anchore/grype/issues/3663)] [PR [#3671](https://github.com/anchore/grype/pull/3671) @dev-rehaann]\n\n### Dependencies\n\n54 dependency changes (54 updated). 6 vulnerabilities remediated.\n\n**\ud83d\udfe2 Remediated (6)**\n\n- [GHSA-2v4p-qf9q-27wj](https://github.com/advisories/GHSA-2v4p-qf9q-27wj) (High) \u2014 google.golang.org/grpc\n- [GHSA-7jxh-36q5-gcqv](https://github.com/advisories/GHSA-7jxh-36q5-gcqv) (Medium) \u2014 github.com/containerd/containerd/v2\n- [GHSA-qc2q-p7wx-3px3](https://github.com/advisories/GHSA-qc2q-p7wx-3px3) (Medium) \u2014 google.golang.org/grpc\n- [GHSA-vp52-pcj8-j9qc](https://github.com/advisories/GHSA-vp52-pcj8-j9qc) (High) \u2014 google.golang.org/grpc\n- [GO-2026-6354](https://go.dev/issue/81316) (High) \u2014 golang.org/x/crypto\n- [GO-2026-6355](https://go.dev/issue/81317) (High) \u2014 golang.org/x/crypto\n\n<details>\n<summary>Updated (54 packages)</summary>\n\n- cloud.google.com/go/auth `v0.22.0` \u2192 `v0.23.2`\n- cloud.google.com/go/iam `v1.11.0` \u2192 `v1.12.0`\n- cloud.google.com/go/logging `v1.18.0` \u2192 `v1.19.0`\n- cloud.google.com/go/monitoring `v1.29.0` \u2192 `v1.30.0`\n- cloud.google.com/go/storage `v1.64.0` \u2192 `v1.65.1`\n- github.com/CycloneDX/cyclonedx-go `v0.11.0` \u2192 `v0.12.0`\n- github.com/anchore/go-sync `v0.1.1` \u21