:"uploaded","size":31266561,"digest":"sha256:767ac2d7a257d88077d586933c74cc579da11a39e9fb4f24116241edf7c12127","download_count":7,"created_at":"2026-10-19T20:32:48Z","updated_at":"2026-10-19T20:32:50Z"},{"id":657365419,"node_id":"RA_kwDOD-rsp84nLpmr","name":"grype_0.121.0_linux_s390x.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":31361226,"digest":"sha256:7de96bb81004c3d8f2f1181b1b8a291490af5f21b190e293aabe9430f433dcad","download_count":30,"created_at":"2026-10-19T20:32:45Z","updated_at":"2026-10-19T20:32:47Z"},{"id":657365506,"node_id":"RA_kwDOD-rsp84nLpoC","name":"grype_0.121.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":31387635,"digest":"sha256:f867bbdc14bd8b0d99b3fc47d839af07480a540072b16896373a8ba32b76f588","download_count":3851,"created_at":"2026-10-19T20:32:48Z","updated_at":"2026-10-19T20:32:50Z"}],"body":"### Added Features\n\n- OS End of life warnings should account for SupportEnd date from the distro release information [Issue [#3230](https://github.com/anchore/grype/issues/3230)] [PR [#3787](https://github.com/anchore/grype/pull/3787) @tomersein]\n- Licensing: copyright owner missing, needed for Debian packaging [Issue [#3501](https://github.com/anchore/grype/issues/3501)] [PR [#3791](https://github.com/anchore/grype/pull/3791) @wagoodman]\n\n### Bug Fixes\n\n- fix(db-build) allow configuring sqlite cache size at db build time [PR [#3814](https://github.com/anchore/grype/pull/3814) @willmurphyscode]\n- Carry AlmaLinux fix dates onto replaced RHEL matches [PR [#3773](https://github.com/anchore/grype/pull/3773) @wagoodman]\n- carry fix availability through extended support fix merging [PR [#3809](https://github.com/anchore/grype/pull/3809) @bot190]\n- upgrade to golang.org/x/net v0.61.0 [PR [#3802](https://github.com/anchore/grype/pull/3802) @westonsteimel]\n- Swift Package Manager packages miss GitHub Swift advisories (searched by identity, not repository path) [Issue [#3795](https://github.com/anchore/grype/issues/3795)] [PR [#3713](https://github.com/anchore/grype/pull/3713) @az-catch]\n\n### Additional Changes\n\n- bump go-make module and action together [PR [#3793](https://github.com/anchore/grype/pull/3793) @wagoodman]\n\n### Dependencies\n\n50 dependency changes (47 updated, 1 added, 2 removed). 5 vulnerabilities remediated.\n\n**🟢 Remediated (5)**\n\n- [GO-2026-6603](https://go.dev/cl/847185) (High) — golang.org/x/net\n- [GO-2026-6610](https://go.dev/cl/835145) (High) — golang.org/x/net\n- [GO-2026-6611](https://go.dev/cl/847186) (High) — golang.org/x/net\n- [GO-2026-6612](https://go.dev/cl/847187) (Critical) — golang.org/x/net\n- [GO-2026-6617](https://go.dev/cl/847188) (High) — golang.org/x/net\n\n<details>\n<summary>Updated (47 packages)</summary>\n\n- cloud.google.com/go/auth `v0.23.2` → `v0.23.3`\n- cloud.google.com/go/compute/metadata `v0.9.0` → `v0.9.1`\n- cloud.google.com/go/storage `v1.65.1` → `v1.68.0`\n- github.com/GoogleCloudPlatform/opentelemetry-operations-go/detectors/gcp `v1.33.0` → `v1.34.0`\n- github.com/anchore/syft `v1.54.1` → `v1.55.0`\n- github.com/aws/aws-sdk-go-v2 `v1.44.0` → `v1.47.1`\n- github.com/aws/aws-sdk-go-v2/config `v1.32.40` → `v1.33.6`\n- github.com/aws/aws-sdk-go-v2/credentials `v1.19.39` → `v1.20.6`\n- github.com/aws/aws-sdk-go-v2/feature/ec2/imds `v1.18.40` → `v1.20.1`\n- github.com/aws/aws-sdk-go-v2/internal/configsources `v1.4.40` → `v1.5.4`\n- github.com/aws/aws-sdk-go-v2/internal/endpoints/v2 `v2.7.40` → `v2.8.4`\n- github.com/aws/aws-sdk-go-v2/internal/v4a `v1.4.41` → `v1.5.4`\n- github.com/aws/aws-sdk-go-v2/service/internal/checksum `v1.10.0` → `v1.11.5`\n- github.c