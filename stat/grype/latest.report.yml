uploaded","size":31364632,"digest":"sha256:6129c83c9f03accd7ecfc5cfaf88e7d31021067e65a101c78c1d97f03660b68e","download_count":8,"created_at":"2026-11-02T17:29:50Z","updated_at":"2026-11-02T17:29:52Z"},{"id":702581218,"node_id":"RA_kwDOD-rsp84p4Ini","name":"grype_0.121.1_linux_s390x.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":31480111,"digest":"sha256:f18a2c715f35d840b20155e65d5b7968ce9f2530fdb17b9edadfebf6eba2a39e","download_count":38,"created_at":"2026-11-02T17:29:47Z","updated_at":"2026-11-02T17:29:48Z"},{"id":702581331,"node_id":"RA_kwDOD-rsp84p4IpT","name":"grype_0.121.1_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":31544299,"digest":"sha256:37f7b1b9c7d93a74174c5619ee16b321fc135670509f234235fdf2dc5f2c0852","download_count":1787,"created_at":"2026-11-02T17:29:48Z","updated_at":"2026-11-02T17:29:50Z"}],"body":"### Bug Fixes\n\n- extract the quality gate debug artifact outside the checkout [PR [#3875](https://github.com/anchore/grype/pull/3875) @wagoodman]\n- incorrect constraint for versionless purls in openvex [PR [#3874](https://github.com/anchore/grype/pull/3874) @kzantow]\n- report additional version-range records for a package [PR [#3782](https://github.com/anchore/grype/pull/3782) @jspilman]\n- report a package's vulnerability as added or removed only when its affected record set changes [PR [#3784](https://github.com/anchore/grype/pull/3784) @jspilman]\n- report the lowest overlapping AlmaLinux fix [PR [#3783](https://github.com/anchore/grype/pull/3783) @jspilman]\n- report fix date and kind changes under the package [PR [#3781](https://github.com/anchore/grype/pull/3781) @jspilman]\n- label db diff databases in the order they were provided [PR [#3816](https://github.com/anchore/grype/pull/3816) @bot190]\n- time out stalled db diff downloads [PR [#3858](https://github.com/anchore/grype/pull/3858) @wagoodman]\n- only remove db diff directories that grype created [PR [#3828](https://github.com/anchore/grype/pull/3828) @wagoodman]\n- make db diff --packages and --vulns include only what was requested [PR [#3815](https://github.com/anchore/grype/pull/3815) @bot190]\n\n### Performance\n\n- index ignore rules by vulnerability ID [PR [#3817](https://github.com/anchore/grype/pull/3817) @juanjsebgarcia]\n- speed up db diff and reduce its memory and temp disk use [PR [#3813](https://github.com/anchore/grype/pull/3813) @bot190]\n\n### Additional Changes\n\n- grype 0.119.0 allocates without bound on a CycloneDX machine-learning-model component with no purl and no CPE [Issue [#3767](https://github.com/anchore/grype/issues/3767)]\n- add a directory for grype-specific match labels [PR [#3849](https://github.com/anchore/grype/pull/3849) @wagoodman]\n- let go-make own the go version and move images to debian13 [PR [#3840](https://github.com/anchore/grype/pull/3840) @wagoodman]\n\n### Dependencies\n\n41 dependency changes (39 updated, 1 added, 1 removed). 1 vulnerability remediated.\n\n**🟢 Remediated (1)**\n\n- [GHSA-mgcc-cww5-fp2q](https://github.com/advisories/GHSA-mgcc-cww5-fp2q) (High) — github.com/go-jose/go-jose/v4\n\n<details>\n<summary>Updated (39 packages)</summary>\n\n- github.com/Microsoft/go-winio `v0.6.3-0.ad3df93` → `v0.6.3-0.f19d971`\n- github.com/ProtonMail/go-crypto `v1.4.1` → `v1.5.2`\n- github.com/anchore/clio `v0.1.1` → `v0.1.2`\n- github.com/anchore/stereoscope `v0.3.4` → `v0.4.0`\n- github.com/anchore/syft `v1.55.0` → `v1.56.0`\n- github.com/bmatcuk/doublestar/v4 `v4.10.2` → `v4.10.3`\n- github.com/containerd/containerd/v2 `v2.4.1` → `v2.4.2`\n- github.com/containerd/stargz-snapshotter/estargz `v0.18.2` → `v0.19.0