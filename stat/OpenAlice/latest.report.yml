2f17091870c9fd1bf98dcce6c","download_count":3,"created_at":"2026-09-10T18:08:02Z","updated_at":"2026-09-10T18:08:20Z"},{"id":555535823,"node_id":"RA_kwDORTPY3s4hHM3P","name":"OpenAlice.Setup.0.93.0.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":258557,"digest":"sha256:58cded1e9e70d4fc952abf9a5c3a205ec7ec812d0e988dd54069b5d5f820ff1b","download_count":3,"created_at":"2026-09-10T18:08:02Z","updated_at":"2026-09-10T18:08:03Z"},{"id":555535850,"node_id":"RA_kwDORTPY3s4hHM3q","name":"PKGBUILD","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2341,"digest":"sha256:5bcd2a72901180b1984ed18d42dff2c47506655c8dcd22915ad12180b9ba0f0c","download_count":4,"created_at":"2026-09-10T18:08:02Z","updated_at":"2026-09-10T18:08:03Z"}],"body":"# Changelog\n\nAll notable changes to OpenAlice will be documented in this file.\n\n## [0.93.0] - 2026-09-10\n\n### \u2699\ufe0f CI\n\n- Allow Windows Broker Pack build to finish\n## [0.93.0-beta] - 2026-09-10\n\n### \ud83d\udc1b Bug Fixes\n\n- **alpaca**: Support crypto trading and read-only options research\n- Bind dev upgrades to runtime and broker content\n- **ui**: Build connector protocol before UI and demo\n- **ui**: Baseline initial activity snapshot before showing toasts\n- **gui**: Display user prose without reparsing markup\n- **gui**: Preview message images in a dialog\n\n### \ud83d\udcda Documentation\n\n- Record inbox markdown unification plan\n\n### \ud83d\ude80 Features\n\n- **harness**: Merge Skill upgrades and guide conflict resolution\n- **skills**: Document reply files and clarify Inbox delivery\n- **inbox**: Unify markdown file references across readers\n- **inbox**: Render file blocks and bounded inline images\n- **desktop**: Integrate macOS window controls into app headers\n- **desktop**: Integrate Windows native window controls\n- **chat**: Choose TUI or GUI when starting a session\n- **gui**: Consume streamed workspace file references\n\n"}
