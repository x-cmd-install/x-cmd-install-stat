c55fd6812c5dc9d13f8183ab","download_count":1,"created_at":"2026-09-09T19:24:40Z","updated_at":"2026-09-09T19:24:58Z"},{"id":553419736,"node_id":"RA_kwDORTPY3s4g_IPY","name":"OpenAlice.Setup.0.92.1.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":258471,"digest":"sha256:3304546a1fff49b975b2159ce91075ec924e5665d433183a0b535d8dfd140487","download_count":1,"created_at":"2026-09-09T19:24:40Z","updated_at":"2026-09-09T19:24:40Z"},{"id":553419788,"node_id":"RA_kwDORTPY3s4g_IQM","name":"PKGBUILD","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2341,"digest":"sha256:4bd6af648fdd146dbd537c5bc6f86f3a48243aa8640f940adcfae9992631c4a5","download_count":2,"created_at":"2026-09-09T19:24:40Z","updated_at":"2026-09-09T19:24:40Z"}],"body":"# Changelog\n\nAll notable changes to OpenAlice will be documented in this file.\n\n## [0.92.1-beta.2] - 2026-09-09\n\n### \ud83d\udc1b Bug Fixes\n\n- **alpaca**: Bundle SDK closure for compiled runtime loading\n- **runtime**: Resolve external broker packages in standalone builds\n## [0.92.1-beta.1] - 2026-09-09\n\n### \ud83d\udc1b Bug Fixes\n\n- **workspaces**: Let headless claude runs write in their own Workspace\n- **issues**: Recruit fresh owners for comment replies\n- **workspaces**: Unify full-access agent launch policies\n- Allow Alice Skill upgrades during active sessions\n- Preserve Telegram turn activity and automated no-reply semantics\n- Remove fixed five-minute Issue reply timeout\n- **uta**: Read hyperliquid balances from the clearinghouse that holds them\n- Use English sticker meanings for agent skills\n- Guide agents to send at most one sticker per reply\n- Preserve inline media order in connector replies\n- Preserve injected CLI PATH in Codex shell tools\n- Retain injected CLI precedence in Cursor shell snapshots\n- **uta**: Make Hyperliquid balance routing authoritative\n- **workspaces**: Hand interactive sessions to issue dispatch\n\n### \ud83d\udcda Documentation\n\n- Credit eutialia and retain current launch policy\n- Keep contributor credit in the existing table\n\n### \ud83d\ude80 Features\n\n- Expose scheduled Issue run and retry through alice CLI\n- Let connectors interpret reply directives and send workspace files\n- **connector**: Resolve path references into native reply media\n- Add project sticker packs and optional Chat projection\n- **news**: Add configurable RSSHub presets for Chinese news\n## [0.92.1-beta] - 2026-09-08\n\n### \ud83d\udc1b Bug Fixes\n\n- Keep RSS and website adapters optional in research guidance\n- Align bar time bounds and interval consumption\n- **market**: Repair cross-asset discovery and paginated broker history\n- **market**: Avoid misdiagnosing provider socket closures\n- **ui**: Clarify Eastmoney equity identity and chart hierarchy\n- **ui**: Move market watchlist action beside asset name\n\n### \ud83d\udd27 Refactoring\n\n- **ui**: Group market navigation by news assets and boards\n\n### \ud83d\ude80 Features\n\n- Expose Project CLI and raw market bars\n\n### \ud83e\uddea Testing\n\n- Check CLI transport diagnostics on stderr\n\n"}
