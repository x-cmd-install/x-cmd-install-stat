":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2341,"digest":"sha256:e0f0b0146874a2ca1d351441ff5a1c85967fd479559ebd6ed3f11dfeafc582c9","download_count":3,"created_at":"2026-09-20T05:26:59Z","updated_at":"2026-09-20T05:26:59Z"}],"body":"# Changelog\n\nAll notable changes to OpenAlice will be documented in this file.\n\n## [0.94.0] - 2026-09-20\n\n### \ud83d\udc1b Bug Fixes\n\n- **release**: Allow newly introduced broker pack platforms\n## [0.94.0-beta.2] - 2026-09-20\n\n### \ud83d\udc1b Bug Fixes\n\n- **ui**: Retain harness initialization progress across navigation\n- **windows**: Stabilize runtime shell probes\n- **runtime**: Synchronize Guardian port probe cleanup\n- **install**: Decode byte[] download bodies in the Windows installer\n- Discover models from configured AI access\n- Expose API account setup in runtime access menus\n- Register OMP account models and connect remote terminals\n\n### \ud83d\udcda Documentation\n\n- Add harness initialization progress screenshots\n- Remove harness initialization screenshots\n## [0.94.0-beta] - 2026-09-19\n\n### \ud83d\udc1b Bug Fixes\n\n- **connector**: Preserve Telegram updates and expose startup stages\n- **connector**: Use native AbortController instead of bundled polyfill\n- **cli**: Enforce remote profile contracts and align guidance\n- Keep Windows companion content size stable\n- **release**: Publish Linux arm64 broker packs\n- Resize companion by renderer content on Windows\n\n### \ud83d\udd27 Refactoring\n\n- **cli**: Align remote commands with machine targets\n- **remote**: Retire official Docker deployment and use runtime capabilities\n\n### \ud83e\uddea Testing\n\n- Align dev smoke with healthy runtime discovery\n\n"}
