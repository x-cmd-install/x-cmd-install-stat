24bf1396f77b8bb87b769cc9","download_count":2,"created_at":"2026-09-08T09:13:51Z","updated_at":"2026-09-08T09:14:16Z"},{"id":550202279,"node_id":"RA_kwDORTPY3s4gy2un","name":"OpenAlice.Setup.0.92.0.exe.blockmap","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":245926,"digest":"sha256:597b4c792a023b88cacd34c91adaff69441e73a8a8ff35908ade8141c02c50e4","download_count":2,"created_at":"2026-09-08T09:13:51Z","updated_at":"2026-09-08T09:13:52Z"},{"id":550202311,"node_id":"RA_kwDORTPY3s4gy2vH","name":"PKGBUILD","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2341,"digest":"sha256:c39e5f9be042030861612dc00fa75f3e35a7991e681dede38f09edad71384582","download_count":3,"created_at":"2026-09-08T09:13:51Z","updated_at":"2026-09-08T09:13:52Z"}],"body":"# Changelog\n\nAll notable changes to OpenAlice will be documented in this file.\n\n## [0.92.0-beta.1] - 2026-09-08\n\n### \ud83d\udc1b Bug Fixes\n\n- **release**: Isolate npm bootstrap and sync accepted 0.91.1\n- **release**: Accept exact npm 12 integrity response\n- **release**: Scope replay runner context to selection step\n- **release**: Grant candidate reader permission to desktop caller\n- **news**: Restore selection from the focused tab\n- **web-session**: Align Codex wire enums and request shapes with the real app-server; settle rejected prompts\n- **workspaces**: Preserve resumed sessions and support text answers\n- **workspaces**: Launch Grok ACP with agent-scoped flags\n- **workspaces**: Align web sessions with native runtime protocols\n- Remove calculator from the workspace CLI\n- Remove fixed trade simulation from workspace CLI\n- Give Skill reader siblings distinct React keys\n\n### \ud83d\udcda Documentation\n\n- **release**: Record 0.91.1 public channel acceptance\n- **plan**: Define release pipeline efficiency work\n- **plan**: Record measured neutral input savings and replay rejection\n- **plan**: Track hosted real CLI benchmark\n- **plan**: Distinguish measured CLI compute savings from first-artifact latency\n- **release**: Record successful three-platform rehearsal timings\n- **release**: Record verified same-byte cross-verifier replay\n- **release**: Consolidate acceptance audit and Mac reuse evidence\n- **release**: Finalize measured recovery acceptance and residual risks\n- **release**: Retire accepted pipeline efficiency plan\n- Close verified project workspace setup plan\n- Describe the Web conversation surface owner contract\n\n### \ud83d\udd27 Refactoring\n\n- **ui**: Consolidate workspace and automation navigation\n- **release**: Isolate platform acceptance dependencies\n- **release**: Parallelize source acceptance and share CLI inputs\n- **ui**: Simplify navigation and session entry\n- **ui**: Clarify Market sidebar hierarchy and disclosures\n\n### \ud83d\ude80 Features\n\n- **release**: Bind candidate acceptance to artifact identity\n- **release**: Verify desktop candidates at acceptance and publication\n- **release**: Select preserved candidates by trusted run identity\n- **release**: Replay selected desktop acceptance without rebuilding\n- **release**: Reuse same-source desktop candidates through publication gates\n- **release**: Select trusted verifier code independently of product source\n- **news**: Restore layered timeline reading and Market navigation\n- **onboarding**: Prepare selected workspaces for new AliceProjects\n- **workspaces**: Generalize WebPi host into multi-wire WebSessionHost\n- **ui**: Present any web-capable runtime in the Web conversation surface\n- Browse workspace skills and live CLI contracts\n- Distinguish workspace sources from runtime mirrors\n- **workspaces**: Version Alice Harness injection independently\n- **ui**: Distinguish Alice Harness and Workspace capability ownership\n- Manage Project Skill distribution with independent Workspace preferences\n- Manage Skill prototypes and scoped Workspace copies\n- Show injected Skill versions in a compact Workspace view\n\n### \ud83e\uddea Testing\n\n- **release**: Benchmark real CLI rebuild and shared-input consumers\n- **release**: Rehearse real desktop pipelines without publication authority\n- **release**: Enable isolated cross-verifier desktop rehearsal\n- **release**: Reject product relabelling at final staging\n\n"}
