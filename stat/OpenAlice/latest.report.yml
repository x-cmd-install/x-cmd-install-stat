type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2341,"digest":"sha256:6e99f1e8cbe0f25e762ee027305d038f61adbf166c70f9e1fb1c86e8d55812aa","download_count":2,"created_at":"2026-09-24T16:22:34Z","updated_at":"2026-09-24T16:22:34Z"}],"body":"# Changelog\n\nAll notable changes to OpenAlice will be documented in this file.\n\n## [0.94.1] - 2026-09-24\n\n### \ud83d\udc1b Bug Fixes\n\n- **desktop**: Wait for packaged workspace shell readiness\n- **desktop**: Use shell marker for packaged readiness\n- **workspaces**: Serialize registry writes\n- **desktop**: Keep cleanup failure out of upgrade gate\n\n### \ud83e\uddea Testing\n\n- **desktop**: Wait for workspace setup in upgrade smoke\n## [0.94.1-beta.2] - 2026-09-24\n\n### \ud83d\udc1b Bug Fixes\n\n- **ui**: Explain background Session occupancy with task details\n- **ui**: Align running disclosure with Session rows\n- **ui**: Animate running indicator and trail disclosure chevron\n- **ui**: Clarify background Session group hierarchy\n- **ui**: Remove redundant Session disconnect menu\n- **guardian**: Bridge dev system proxy to children\n- **guardian**: Prefer HTTPS system proxy\n- **guardian**: Support explicit server proxy fallback\n\n### \ud83d\ude80 Features\n\n- **ui**: Inspect running background Sessions from sidebar dialogs\n- **ui**: Add Session details and clarify delete versus archive\n- **cli**: Add switchable local web relay for backend connections\n- Manage remote Machines from General settings\n## [0.94.1-beta] - 2026-09-20\n\n### \ud83d\udc1b Bug Fixes\n\n- **ui**: Expose session controls and identify Inbox senders\n- **ui**: Move GUI runtime identity into session header\n\n### \ud83d\udd27 Refactoring\n\n- **ai**: Bind model discovery to provider instances\n- **ui**: Share Start and GUI conversation page layout\n\n### \ud83d\ude80 Features\n\n- Persist provider model catalogs with background refresh\n- **ai-providers**: Refresh bundled model presets\n- **ai**: Carry provider model capabilities through shared resolution\n- **ai**: Unify native runtime model discovery through providers\n- **ui**: Soften chat starters and bridge session startup\n\n"}
