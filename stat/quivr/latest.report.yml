5f017225b0a079ae0fcaa60b9b","download_count":2,"created_at":"2026-11-16T15:52:11Z","updated_at":"2026-11-16T15:52:12Z"},{"id":755443029,"node_id":"RA_kwDOJibVLc4tByVV","name":"quivr-tei.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":2848567,"digest":"sha256:b214637bed3946b14e8bfff2a6a862113cf3afd34565f2700442561f99f88ce7","download_count":2,"created_at":"2026-11-16T15:52:11Z","updated_at":"2026-11-16T15:52:12Z"},{"id":755443033,"node_id":"RA_kwDOJibVLc4tByVZ","name":"quivr-web.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":2935416,"digest":"sha256:5d0ba598c8f92895da4d577b016ad699adb433700f2a62c22205541004b69424","download_count":2,"created_at":"2026-11-16T15:52:11Z","updated_at":"2026-11-16T15:52:12Z"},{"id":755443050,"node_id":"RA_kwDOJibVLc4tByVq","name":"quivr.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":115294,"digest":"sha256:5b4364b7362a85d0037b60ff5c81d25d0c48bd17ecf9c08e4d5f50eab7bbe997","download_count":2,"created_at":"2026-11-16T15:52:12Z","updated_at":"2026-11-16T15:52:12Z"}],"body":"## Quivr 2.0.3\n\n2.0.3 is a security and fix release. It changes no API, no configuration and no stored data. Upgrade any 2.0.x installation to it.\n\n### Security fixes\n\n- **Go 1.27.4** builds every Quivr binary and image (GO-2026-6859, in `net/http`).\n- **PostgreSQL 17.12** replaces 17.11 in the database image. It ships zlib 1.4 (CVE-2026-4738). This is a PostgreSQL minor release: the data on disk stays as it is.\n- **SeaweedFS**, which stores original files, gets zlib 1.4 (CVE-2026-4738) and brotli v1.2.7 (GO-2026-6888).\n\n### Fixed\n\n- **Forms in the demo work over plain HTTP.**\n  - **Before:** on an address other than HTTPS or localhost, adding a source, adding a text, creating an alert or editing a connector failed with « crypto.randomUUID is not a function ». Browsers offer that function only on secure pages.\n  - **Now:** the demo makes its keys another way when the browser lacks it.\n- **The demo's alerts use the alerts plugin version Quivr ships.** Before, a deployment with no setting asked for an older version, and the engine refused every alert as « not installed ».\n\n### Upgrade from 2.0.x\n\nDeploy the 2.0.3 images, or the 2.0.3 compose bundle attached to this release for a single machine. Restarting the database container on PostgreSQL 17.12 needs no dump or migration. The search database and Quivr's data stay as they are.\n\nThe release images are signed and carry SBOMs, as described in [Security of Quivr releases](https://docs.quivr.thevibecompany.co/run-quivr/security).\n\n---\n\n## [2.0.3](https://github.com/The-Vibe-Company/quivr/compare/v2.0.2...v2.0.3) (2026-11-16)\n\n\n### Bug Fixes\n\n* **demo:** make idempotency keys without crypto.randomUUID over plain HTTP ([#3991](https://github.com/The-Vibe-Company/quivr/issues/3991)) ([890b968](https://github.com/The-Vibe-Company/quivr/commit/890b9689ca5a8b8a422be7017aa29522a259fe5f))\n* **demo:** pin alerts to the plugin version the core serves ([#3980](https://github.com/The-Vibe-Company/quivr/issues/3980)) ([25e4edf](https://github.com/The-Vibe-Company/quivr/commit/25e4edf083c0fcd115ee952a048444de646604fd))\n* **images:** build on Go 1.27.4 and patch zlib and brotli in Postgres and SeaweedFS ([#3992](https://github.com/The-Vibe-Company/quivr/issues/3992)) ([b29e919](https://github.com/The-Vibe-Company/quivr/commit/b29e91957dfa9f12720478f344f628ea922d0101))\n\n"}
