-20T19:29:03Z"}],"body":"## Quick Start\r\n\r\n### Non-HA:\r\n\r\n```shell\r\nkubectl create namespace argocd\r\nkubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml\r\n```\r\n\r\n### HA:\r\n\r\n```shell\r\nkubectl create namespace argocd\r\nkubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/ha/install.yaml\r\n```\r\n\r\n## Release Signatures and Provenance\r\n\r\nAll Argo CD container images are signed by cosign.  A Provenance is generated for container images and CLI binaries which meet the SLSA Level 3 specifications. See the [documentation](https://argo-cd.readthedocs.io/en/stable/operator-manual/signed-release-assets) on how to verify.\r\n\r\n## Release Notes Blog Post\r\nFor a detailed breakdown of the key changes and improvements in this release, check out the [official blog post](https://blog.argoproj.io/argo-cd-v3-5-release-candidate-02b1fbf7b419)\r\n\r\n## Upgrading\r\n\r\nIf upgrading from a different minor version, be sure to read the [upgrading](https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/) documentation.\r\n\r\n## Changelog\r\n### Bug fixes\r\n* f62e0c6ae135accd040a7bd2f1031c3a9def3f60: fix(grpc): a workaround to fix SRV _grpclb._tcp SRV lookups (#29989) (cherry-pick #30084 for 3.5) (#30170) (@argo-cd-cherry-pick-bot[bot])\r\n* d98924dfc0c88fe60302dd57259d6a52c7ff81df: fix: restore SSH repository fetch through a SOCKS5 proxy  (cherry-pick #30238 for 3.5) (#30246) (@argo-cd-cherry-pick-bot[bot])\r\n* d575730dffdf260ab15a73a810a4edfdd8b2dd48: fix: server-side diff reports fields removed by other managers as diffs (cherry-pick #30206 for 3.5) (#30229) (@argo-cd-cherry-pick-bot[bot])\r\n### Dependency updates\r\n* cad84a82c63c51e0e025d5c7770fdc1795c51880: chore(deps): bump dompurify for release-3.5 (#30176) (@ranakan19)\r\n* 940d00e1ff3d1adf5d0cc2d53e679bd58e8c3185: chore(deps): update group golang to v1.26.10 (release-3.5) (#30305) (@argoproj-renovate[bot])\r\n### Other work\r\n* c2b1e3017e2cec86b122172e861dcd026453ae44: chore: bump version to 3.5.6 on release-3.5 branch (#30319) (@github-actions[bot])\r\n\r\n**Full Changelog**: https://github.com/argoproj/argo-cd/compare/v3.5.5...v3.5.6\r\n\r\n<a href=\"https://argoproj.github.io/cd/\"><img src=\"https://raw.githubusercontent.com/argoproj/argo-site/master/content/pages/cd/gitops-cd.png\" width=\"25%\" ></a>\r\n\r\n","mentions_count":1}
