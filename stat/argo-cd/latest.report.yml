,{"id":616646338,"node_id":"RA_kwDOBzS60s4kwUbC","name":"argocd-sbom.intoto.jsonl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":23243,"digest":"sha256:374d5fcc704f96625a6a36248365e13355d22eb4cc3c85f2a4354606a60d8826","download_count":24,"created_at":"2026-10-06T20:59:22Z","updated_at":"2026-10-06T20:59:22Z"},{"id":616636982,"node_id":"RA_kwDOBzS60s4kwSI2","name":"argocd-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":251980800,"digest":"sha256:f5c7e60f30328821dfe66ca74733f924581c8656752a0480a616e56cb1f4f98c","download_count":601,"created_at":"2026-10-06T20:55:17Z","updated_at":"2026-10-06T20:55:28Z"},{"id":616636998,"node_id":"RA_kwDOBzS60s4kwSJG","name":"cli_checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":605,"digest":"sha256:caf843fc521048b361c1e3d30d235feeb4d8b4c1209382293d38bae61a435564","download_count":1175,"created_at":"2026-10-06T20:55:18Z","updated_at":"2026-10-06T20:55:18Z"},{"id":616644103,"node_id":"RA_kwDOBzS60s4kwT4H","name":"sbom.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":134535,"digest":"sha256:354622feca20dc93f87c017c687e021641b80d317427a512b1bf87f980daf391","download_count":22,"created_at":"2026-10-06T20:58:24Z","updated_at":"2026-10-06T20:58:24Z"}],"body":"## Quick Start\n\n### Non-HA:\n\n```shell\nkubectl create namespace argocd\nkubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/install.yaml\n```\n\n### HA:\n\n```shell\nkubectl create namespace argocd\nkubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/ha/install.yaml\n```\n\n## Release Signatures and Provenance\n\nAll Argo CD container images are signed by cosign.  A Provenance is generated for container images and CLI binaries which meet the SLSA Level 3 specifications. See the [documentation](https://argo-cd.readthedocs.io/en/stable/operator-manual/signed-release-assets) on how to verify.\n\n## Release Notes Blog Post\nFor a detailed breakdown of the key changes and improvements in this release, check out the [official blog post](https://blog.argoproj.io/argo-cd-v3-0-release-candidate-a0b933f4e58f)\n\n## Upgrading\n\nIf upgrading from a different minor version, be sure to read the [upgrading](https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/) documentation.\n\n## Changelog\n### Security fixes\n\n* CRITICAL: A Kustomize remote ref can run commands in the repo-server ([GHSA-9v9p-x54c-58gc](https://github.com/argoproj/argo-cd/security/advisories/GHSA-9v9p-x54c-58gc))\n* CRITICAL: A Kustomize Helm config home can run commands in the repo-server ([GHSA-fw5c-w8rc-j7fx](https://github.com/argoproj/argo-cd/security/advisories/GHSA-fw5c-w8rc-j7fx))\n* CRITICAL: A Jsonnet import can read files from the repo-server ([GHSA-m3vr-7329-44ww](https://github.com/argoproj/argo-cd/security/advisories/GHSA-m3vr-7329-44ww))\n* CRITICAL: AppProject restrictions bypassed by PreDelete/PostDelete resource hooks ([GHSA-fmxq-cgp8-87wp](https://github.com/argoproj/argo-cd/security/advisories/GHSA-fmxq-cgp8-87wp), CVE-2026-77459)\n* HIGH: Login failure rate limit can be bypassed via concurrent requests ([GHSA-4439-h7jw-5cjj](https://github.com/argoproj/argo-cd/security/advisories/GHSA-4439-h7jw-5cjj), CVE-2025-61560)\n* HIGH: Command injection via a repository proxy URL on SSH Git repositories ([GHSA-j6cw-g6p4-7hch](https://github.com/argoproj/argo-cd/security/advisories/GHSA-j6cw-g6p4-7hch), CVE-2026-55797)\n* MODERATE: Extension proxy RBAC ignores application namespace when applications-in-any-namespace is enabled ([GHSA-g3ff-q88g-chrj](https://github.com/argoproj/argo-cd/security/advisories/GHSA-g3ff-q88g-chrj))\n* MODERATE: An oversized OCI manifest can exhaust repo-server memory ([GHSA-w996-f2wq-x9c6](https://github.com/argoproj/argo-cd/security/advisories/GHSA-w996-f2wq-x9c6))\n\n### Potentially-breaking changes\n\n* Kustomize builds that render Helm charts no longer honor `helmGlobals.configHome`. Ordinary `http`, `https`, and `oci` chart repositories still work. Builds that depended on a Helm plugin registered from that directory will not ([GHSA-fw5c-w8rc-j7fx](https://github.com/argoproj/argo-cd/security/advisories/GHSA-fw5c-w8rc-j7fx)).\n* An OCI manifest larger than 4 MiB is now rejected ([GHSA-w996-f2wq-x9c6](https://github.com/argoproj/argo-cd/security/advisories/GHSA-w996-f2wq-x9c6)).\n\n### Features\n* f37dc0c742724e1b5f2393839a24d9664f31ede7: feat(server): log username on login attempts (cherry-pick #29841 for 3.5) (#29861) (@argo-cd-cherry-pick-bot[bot])\n### Bug fixes\n* 5c8aa4620c0a606e9fe5e03a07e3dcaabe81fbe6: fix(cmp): clean up tgz stream temporary directories (#29148) (cherry-pick #29156 for 3.5) (#29773) (@argo-cd-cherry-pick-bot[bot])\n* 7f0a05834b05103d69d7c150e1ee36541b314696: fix(security): coordinated security fixes (release-3.5) (#30038) (@crenshaw-dev)\n* 482c71a558b3001e028316232fe2f86c25becb09: fix(ui): manifest viewer jumpiness (#29691) (cherry pick 3.5) (#29725) (@crenshaw-dev)\n* 1f8100a3db64fdc520b768c5606b6fca4e4ad09c: fix: cherry-pick #29737 (release-3.5) (#29749) (@blakepettersson)\n* 9886fc1363e92a517b811375505317912cdb82b9: fix: use ObjectMeta in session login test (release-3.5) (#29919) (@crenshaw-dev)\n### Other work\n* a9d0b9684a6470741a9ee61a05d4f70eb76c85d6: fix(manifest-generate-paths): do not report changes on cache miss without path updates (cherry-pick #29442 for 3.5) (#29849) (@argo-cd-cherry-pick-bot[bot])\n* fc2d94d906db9e0a4650e7936036022cc9fe232d: fix(repo-server): cherry-pick health check timeout resulting in CrashLoopBackOff to release-3.5 branch (#29901) (@aali309)\n* f0de0be59114d7eb3bfb3b4c2793b65ba013ad1f: test(flaky): accept connection reset by peer as valid mTLS rejection (cherry-pick #28367 for 3.5) (#29850) (@argo-cd-cherry-pick-bot[bot])\n\n**Full Changelog**: https://github.com/argoproj/argo-cd/compare/v3.5.3...v3.5.4\n\n<a href=\"https://argoproj.github.io/cd/\"><img src=\"https://raw.githubusercontent.com/argoproj/argo-site/master/content/pages/cd/gitops-cd.png\" width=\"25%\" ></a>\n\n\n","mentions_count":3}
