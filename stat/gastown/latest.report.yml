-06-06T17:17:51Z"},{"id":440322358,"node_id":"RA_kwDOQpbhqM4aPsk2","name":"gastown_1.2.1_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14039707,"digest":"sha256:da0b24860f227f31405c67540af539fee5d06b9fda93b674b7b87ff2a0bcd4d6","download_count":186,"created_at":"2026-06-06T17:17:51Z","updated_at":"2026-06-06T17:17:52Z"}],"body":"## Gas Town v1.2.1\n\nPre-compiled binaries for Linux, macOS (Intel & Apple Silicon), and Windows.\n\n### Installation\n\n**Homebrew (macOS/Linux):**\n```bash\nbrew install gastown\n```\n\n**npm (Node.js):**\n```bash\nnpm install -g @gastown/gt\n```\n\n**Manual Install:**\nDownload the appropriate binary for your platform below, extract it, and place it in your PATH.\n\n## Changelog\n### Features\n* 59edd7151e95edae2598887b22ae0f097ca873b3 feat(daemon): per-bead cargo target clean hook (hq-x0v7v)\n* 5e31df81f66b847774a41a6aef0672720d9a385c feat(witness): detect polecats stuck at startup without heartbeat (gt-uk7)\n### Bug Fixes\n* 64ad5ed95ea071e99a22eaa537d5d199072aee11 Revert \"fix: clean standalone formula wisp on hook failure\"\n* 9d47611db25b78080d4da95b5ae72d64e6f4e388 Revert \"fix: complete opencode agent logging adapter (gt-gh-3833)\"\n* d16118249cc967f331169afc02e150aa94bbddd8 Revert \"fix: parse OpenCode step-finish usage (gt-gh-3833)\"\n* e34cf5a20ebe80df5f03169c1ff85c27f49d78f9 fix(daemon): clean legacy tmux sockets on startup\n* bf1ec5d49408c63c4c64ef0a8fad5066974d8871 fix(daemon): distinguish Claude usage limits from real crashes (hq-j6hur.4.1, gh#3398)\n* 306d142f097387b90ce2e3a8fe0e8c9338a8cd60 fix(daemon): prevent BD_ACTOR=daemon from leaking into polecat sessions (pa-xyr)\n* a395fed84bf28e75904ba338573606de13931465 fix(daemon): set BD_DOLT_AUTO_COMMIT=off for read-only bd subprocesses (hq-j6hur.4.3, gh#3596)\n* a3a2c3e2d809c52e6c457f069b93ac8cd6aae95e fix(diskspace): include APFS purgeable space in available bytes on macOS (#3854)\n* 4fc8b6d9534c07784c2290eb6addf838737cb473 fix(doctor): add boot as managed hooks target; detect rig-root stale settings (#3852)\n* 84da0495171877219f9e0153b035acd9e5c14ab9 fix(doctor): rig-config-sync accepts prefix-named Dolt DB (gt-5hd2)\n* 2eafac9784301e6a8832a8fa32df9143a17c236a fix(dolt): disable auto-gc + stuck-agent-dog null-guards (extracted from #3831)\n* 1ad4e663653a17d6247cb2e9800a6137d49593e2 fix(dolt): set server time_zone to UTC after start (hq-57jr8)\n* 2ea89d56eeb34aa8cb4dae1ce2769028bded71a7 fix(done): auto-rebase polecat branch onto target before push (gh#3400)\n* 36ff5ea1a8cd94f8736b2886124e6fbe6d69fff0 fix(done): close workflow step beads on DEFERRED exit\n* 085d158140b6638ccf0f814db29415b19c5e2064 fix(escalate): pass description via stdin to bd create (#3890)\n* dffc189139a43db0ee2f90fc76435edda63ebb7d fix(formula): infer rig from workspace instead of hardcoding gastown\n* 3b76db830f691d858928e6a50fad5a3de8b5e089 fix(formula): pass --no-convoy when slinging convoy legs and workflow steps\n* 7e1e183943a129fc4864589779d06b017078683c fix(gt): socket-first Dolt DSN across internal commands (wa-d6f)\n* c1fd5a5210b309405cb7a406c2396fc4fb2346bd fix(handoff): merge full agent preset env into respawn command\n* 8bb2c216b785e5a99442b0d1a33c068f17dc73e7 fix(hooks): seed Claude autonomous settings (#3000)\n* 34c51dbd5169a70fd37d461dfa82054d43c31cf1 fix(hooks): seed Claude autonomous settings (#3000)\n* d381a35c260fd93d2ec9730ba6b5cfc20a9cf6ad fix(init): run hooks sync + create hooks-base.json during rig/pool init\n* ca2bfd142186eae86a395a9416ab2358b113070b fix(lint): correct misspelled behavior comment\n* 109bb12280b80bd285549e60d2f8a9c3d9ff5784 fix(lint): correct misspelling behaviour\u2192behavior in polecat manager\n* e7949128fc7a2205cea54d0c5d557f4f7226caba fix(mail): infer reply-to from inbox to clear reply-reminders (gt-zzob)\n* 112866f12a51590e798146eebb4397238e3a9423 fix(mq): propagate remote branch deletion errors in post-merge (gh#3868)\n* 3c3b292b40486c6c89648b2b196e11784d54f2a5 fix(polecat): kill session during worktree repair (#3961)\n* 2ca7d2b193c640f3555ac2fbfdd71462d8b34d38 fix(polecat): use SetAgentStateWithRetry in pool-init to close MVCC race\n* 2e2cdc9f9d93f22fb2dc39fb1bbdd3c0992765ba fix(prime): bound external tool injection\n* 72928c8da845de638434c3071f8adbab194bc784 fix(reaper): raise open-wisp alert threshold 500\u2192800 (hq-57jr8)\n* 5237e5c4f5a6362011d7c61bd76e013475578c9d fix(refinery): strip stray merge-conflict markers from .gitignore\n* 387942b44893cc3e6431cba0767e97e2e7b1223f fix(refinery): unbreak TOML escaping in consolidation-failure-handler (hq-j6hur.3.7)\n* 3d7d88b68efadd4bee6e98a9098977be9610f80e fix(release): age-gate npm self-update\n* 0cbcb58ab4244a2bf3a19eb585a1ffbabbbfde83 fix(rig): detect dead tmux panes in status and start\n* 41c2917138612e0fbcf1448e52a34273e73c1ea8 fix(rig): drop correct orphan Dolt DB on rig init (gh#3562, hq-j6hur.4.2)\n* cb4352c43bff69e514579e03c657c3c6b28a8fb8 fix(shell): make repo add-offer opt-in and stop it nagging every prompt\n* 5010f11c038d4f0d18b38295d98a20c3aba6eb63 fix(sling): allow standalone formula slinging in deferred dispatch mode (gh#3917)\n* cfbdf3c228c2c3892a3c472c1ca043ccecd1992b fix(test): update TestBuildBdInitArgs assertion for --force flag (gt-hfg5)\n* 9f4f6ba21aae5ec54bac644969bbc905e877c94d fix(web): prevent duplicate ready sling submissions\n* 9bd54ed61d68dd0ae3b63dd7722b0057a43797c8 fix(web): serialize convoy fetch breaker retries (gt-gh-3117)\n* 56fe0de5ad0f4c2a55d992a5e8f3caea94cfecc7 fix: auto-save uncommitted implementation work (gt-mn3u-env-leak-fix, gt-pvx safety net)\n* e4347f83840c817c73e7a708709dad96307b8ee3 fix: auto-save uncommitted implementation work (gt-pvx safety net)\n* 47a4e2064ab70e78d9a91a3c90c98eb4d7ed23d2 fix: auto-save uncommitted implementation work (gt-pvx safety net)\n* bd17e0baee569fb2cb8