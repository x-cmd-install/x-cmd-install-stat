{"id":454174836,"author":{"login":"gregpr07","id":36313686,"node_id":"MDQ6VXNlcjM2MzEzNjg2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDONIn9t84bEih0","tag_name":"1.0.8","target_commitish":"753d629d76eb2b670f4cf467f3355bbe750f6845","name":"browser-use 1.0.8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-22T03:30:22Z","updated_at":"2026-11-22T03:30:41Z","published_at":"2026-11-22T03:30:41Z","assets":[],"body":"`pip install 'browser-use==1.0.8'`\n\n- The judge asks as one more turn of the run, so the provider reads the run from its cache instead of billing the trace again. It returns the same verdict fields, gotchas included (#6457).\n- No API key over SSH or on a headless machine: the run prints a link and a code to approve on any device, then continues (#6427).\n- DeepSeek and Qwen in thinking mode: when the model refuses the forced final call at the step limit, the agent asks again without forcing, so the run returns its answer (#6453).\n- `bu.type` never prints a password field's value (#6455).\n- `Browser(cdp_url=...)` attaches the one page already open instead of a new blank tab (#6456).\n- Browser Use gateway calls reserve credit for 16,384 output tokens instead of 32,768, so small balances are not refused mid-run (#6461).\n\nPRs: https://github.com/browser-use/browser-use/pull/6489, https://github.com/browser-use/browser-use/pull/6504\n"}
