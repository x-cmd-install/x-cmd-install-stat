902\r\n* Update dorny/paths-filter action to v4.0.2 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2904\r\n* Update module golang.org/x/net to v0.55.0 [SECURITY] by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2907\r\n* Update module golang.org/x/crypto to v0.52.0 [SECURITY] by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2906\r\n* Update module github.com/containers/ocicrypt to v1.3.1 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2905\r\n* Use `go.yaml.in/yaml/v3` instead of `gopkg.in/yaml.v3` by @mtrmac in https://github.com/podman-container-tools/skopeo/pull/2908\r\n* Update module golang.org/x/term to v0.45.0 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2909\r\n* Add support for manifest list signature removal and sparse manifest list stripping by @aguidirh in https://github.com/podman-container-tools/skopeo/pull/2892\r\n* Update module go.podman.io/common to v0.68.1 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2910\r\n* ci: make the automation release renovate managed by @Luap99 in https://github.com/podman-container-tools/skopeo/pull/2911\r\n* Update dependency podman-container-tools/automation to v20260707 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2920\r\n* Update actions/setup-go action to v7 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2921\r\n* fix issue_pr_lock.yml workflow and do not run cronjobs at midnight by @Luap99 in https://github.com/podman-container-tools/skopeo/pull/2925\r\n* Update actions/checkout action to v7.0.1 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2926\r\n* Update module github.com/containers/ocicrypt to v1.3.2 by @renovate[bot] in https://github.com/podman-container-tools/skopeo/pull/2927\r\n* Update dependency podman-container-tools/automation to v20260722 by @renovate[bo