s4c_Gq_","name":"kdash-windows.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6494483,"digest":"sha256:0a67aa5658c10117918b5782a4563d2f1ed9466165d889e1541a31461abb1291","download_count":141,"created_at":"2026-07-22T18:53:01Z","updated_at":"2026-07-22T18:53:02Z"}],"body":"### Fixed\n\n- Selecting a namespace after filtering now jumps to the highlighted namespace instead of the first one in the unfiltered list. [#551](https://github.com/kdash-rs/kdash/issues/551)\n- Updated the Kubernetes client to kube 4.2.0, so relative paths in a kubeconfig `exec` credential command now resolve against the kubeconfig location. [#541](https://github.com/kdash-rs/kdash/issues/541)\n\n### Changed\n\n- Updated dependencies: anyhow, async-trait, clap, regex, and serde-saphyr to their latest patch versions.\n\n### Contributors\n\nThanks to @mrpbennett for reporting the namespace filter bug (#551) and @Moulick for reporting the kubeconfig relative path issue (#541).\n\n**Full Changelog**: https://github.com/kdash-rs/kdash/compare/v2.1.0...v2.1.1\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
