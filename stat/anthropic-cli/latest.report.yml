LA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":13618915,"digest":"sha256:ab323257e0287e874458b5ccd5aef0c4a9d92fcd02c687559503589d94211f49","download_count":18,"created_at":"2026-11-10T17:52:50Z","updated_at":"2026-11-10T17:52:52Z"},{"id":732386650,"node_id":"RA_kwDOQ_Z4Gc4rp1Va","name":"ant_2.9.0_windows_amd64.zip","label":"","uploader":{"login":"anthropic-sdk-publisher[bot]","id":275188780,"node_id":"BOT_kgDOEGcMLA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14262219,"digest":"sha256:6ff884fd3b1aa60558cd6536271548c27c7617b857cef93adc6dc113097f3b0c","download_count":134,"created_at":"2026-11-10T17:52:49Z","updated_at":"2026-11-10T17:52:50Z"},{"id":732386641,"node_id":"RA_kwDOQ_Z4Gc4rp1VR","name":"ant_2.9.0_windows_arm64.zip","label":"","uploader":{"login":"anthropic-sdk-publisher[bot]","id":275188780,"node_id":"BOT_kgDOEGcMLA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12954735,"digest":"sha256:12ea50f67c888a7afbcb98ffe61405a7ba2ab0c6f81ad27c82e2694d6265843d","download_count":22,"created_at":"2026-11-10T17:52:49Z","updated_at":"2026-11-10T17:52:49Z"}],"body":"### Features\n\n* **api:** add reply_mode to Claude Tag Slack channel settings\n* **client:** read OpenTelemetry baggage from the BAGGAGE environment variable\n\n  While tracing is on, API requests send the value of `BAGGAGE` in the `baggage` header, the same way they continue the trace in `TRACEPARENT`.\n\n\n### Bug Fixes\n\n* **auth:** revoke tokens on the server at ant auth logout\n* **cli:** stop the JSON explorer crashing in a very short terminal or on an empty list\n\n\n### Chores\n\n* bump go sdk to v2.9.0\n* **docs:** clarify plugin delete and skill name conflict descriptions\n* **docs:** clarify when to omit user_profile_id on external keys\n* **docs:** note that Claude Tag settings accept self-hosted runner pools\n\n\n### Documentation\n\n* **examples:** show multiagent when creating a Managed Agents agent"}
