80,"node_id":"BOT_kgDOEGcMLA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":13648653,"digest":"sha256:ab95302d0a4c993d1c024515e96aaaaf4ac1d5ebe63567524fc1023b51e95814","download_count":40,"created_at":"2026-11-16T17:21:03Z","updated_at":"2026-11-16T17:21:04Z"},{"id":755733470,"node_id":"RA_kwDOQ_Z4Gc4tC5Pe","name":"ant_2.10.0_windows_amd64.zip","label":"","uploader":{"login":"anthropic-sdk-publisher[bot]","id":275188780,"node_id":"BOT_kgDOEGcMLA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14297201,"digest":"sha256:96a482741004b7541849a4e0734f074f0ca823c1b8956d188a47b89306e06f4f","download_count":218,"created_at":"2026-11-16T17:21:02Z","updated_at":"2026-11-16T17:21:03Z"},{"id":755733461,"node_id":"RA_kwDOQ_Z4Gc4tC5PV","name":"ant_2.10.0_windows_arm64.zip","label":"","uploader":{"login":"anthropic-sdk-publisher[bot]","id":275188780,"node_id":"BOT_kgDOEGcMLA","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":12989543,"digest":"sha256:298d4eed0c8cf6a6f69f45a176b0957708288e1f70b2060b06966c4f93ee1121","download_count":22,"created_at":"2026-11-16T17:21:02Z","updated_at":"2026-11-16T17:21:03Z"}],"body":"### Features\n\n* **api:** add Update Bundle, which sets a Claude Tag Bundle's instructions, and return instructions on Bundle\n* **api:** let the CLI fill Claude Tag bundle and target IDs from output\n\n\n### Bug Fixes\n\n* **sessions:** keep the viewer's one-time link out of the browser opener's arguments\n\n  `ant beta:sessions connect --web` now opens a temporary file that only you can read, and that file sends the browser on to the viewer. If the browser shows an error instead, because it can't read the temp directory, paste the link printed in the terminal into it.\n\n\n### Chores\n\n* bump go sdk to v2.10.0\n* **docs:** add an example value for the workspace name\n* **docs:** clarify which workspaces an external key can be attached to\n* **docs:** say when organization_id is required on plugin reads"}
