ar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9149533,"digest":"sha256:f37dc9b570535beaa5ccfdeb2630411783c33f8d22cf5d10d102e73937078cc1","download_count":1,"created_at":"2026-09-27T19:17:14Z","updated_at":"2026-09-27T19:17:14Z"},{"id":593591890,"node_id":"RA_kwDOPrEI7s4jYX5S","name":"tuios_0.8.0_Openbsd_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9473570,"digest":"sha256:119f9bf4cafdbca4488f0102269174988364744f18d2fcd4827b8a8f9d738fd9","download_count":1,"created_at":"2026-09-27T19:17:11Z","updated_at":"2026-09-27T19:17:12Z"},{"id":593591930,"node_id":"RA_kwDOPrEI7s4jYX56","name":"tuios_0.8.0_Openbsd_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10028483,"digest":"sha256:33f661fd0ac5190f37fe7e903e57871b5331487c892e34b72a98cd95dcb8d339","download_count":1,"created_at":"2026-09-27T19:17:13Z","updated_at":"2026-09-27T19:17:14Z"},{"id":593591893,"node_id":"RA_kwDOPrEI7s4jYX5V","name":"tuios_0.8.0_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9788626,"digest":"sha256:3d8f2ef3ff5b84da9113225f8bc391f744931e18290fd30dd7d41d8a3cdc9ab5","download_count":5,"created_at":"2026-09-27T19:17:11Z","updated_at":"2026-09-27T19:17:12Z"},{"id":593591972,"node_id":"RA_kwDOPrEI7s4jYX6k","name":"tuios_0.8.0_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10169572,"digest":"sha256:38d095b412d33af76b0fd4ed9156ca56f93e89684b76e422772ca624da465448","download_count":66,"created_at":"2026-09-27T19:17:15Z","updated_at":"2026-09-27T19:17:15Z"}],"body":"tuios 0.8.0 is the largest release so far: about 2,400 commits since v0.7.0. tuios now tracks the coding agents running in your panes and shows you what each one is doing. It also reaches sessions on your other machines, keeps sessions across restarts, and has a reworked look with new defaults.\n\nBefore you upgrade, read [Breaking changes and migration](#breaking-changes-and-migration). The daemon protocol changed, so a running v0.7.0 daemon has to be stopped.\n\nTry it in the browser first at **[tuios.dev/learn](https://tuios.dev/learn)**. The full list is at [tuios.dev/releases](https://tuios.dev/releases).\n\n\nhttps://github.com/user-attachments/assets/09cd3741-ef29-4fb5-948c-610b43a18250\n\n\n## Watch\n\nThirteen short clips, narrated by Tilly. Click one to play it, or watch them all with captions on the [release page](https://tuios.dev/releases/v0-8-0).\n\n| | |\n|---|---|\n| [![Agents and the Inbox](https://tuios.dev/releases/v0.8.0/agents.jpg)](https://tuios.dev/releases/v0.8.0/agents.mp4)<br>**Agents and the Inbox** | [![Agent mail](https://tuios.dev/releases/v0.8.0/mail.jpg)](https://tuios.dev/releases/v0.8.0/mail.mp4)<br>**Agent mail** |\n| [![Fan out across worktrees](https://tuios.dev/releases/v0.8.0/fan.jpg)](https://tuios.dev/releases/v0.8.0/fan.mp4)<br>**Fan out across worktrees** | [![Tiling](https://tuios.dev/releases/v0.8.0/tiling.jpg)](https://tuios.dev/releases/v0.8.0/tiling.mp4)<br>**Tiling** |\n| [![Layouts](https://tuios.dev/releases/v0.8.0/layouts.jpg)](https://tuios.dev/releases/v0.8.0/layouts.mp4)<br>**Layouts** | [![Session rail](https://tuios.dev/releases/v0.8.0/rail.jpg)](https://tuios.dev/releases/v0.8.0/rail.mp4)<br>**Session rail** |\n| [![Launcher](https://tuios.dev/releases/v0.8.0/launcher.jpg)](https://tuios.dev/releases/v0.8.0/launcher.mp4)<br>**Launcher** | [![Keybindings](https://tuios.dev/releases/v0.8.0/keybinds.jpg)](https://tuios.dev/releases/v0.8.0/keybinds.mp4)<br>**Keybindings** |\n| [![Themes](https://tuios.dev/releases/v0.8.0/themes.jpg)](https://tuios.dev/releases/v0.8.0/themes.mp4)<br>**Themes** | [![Spotlight](https://tuios.dev/releases/v0.8.0/spotlight.jpg)](https://tuios.dev/releases/v0.8.0/spotlight.mp4)<br>**Spotlight** |\n| [![Screen saver](https://tuios.dev/releases/v0.8.0/screensaver.jpg)](https://tuios.dev/releases/v0.8.0/screensaver.mp4)<br>**Screen saver** | [![Screenshots](https://tuios.dev/releases/v0.8.0/screenshot.jpg)](https://tuios.dev/releases/v0.8.0/screenshot.mp4)<br>**Screenshots** |\n| [![Control protocol](https://tuios.dev/releases/v0.8.0/control.jpg)](https://tuios.dev/releases/v0.8.0/control.mp4)<br>**Control protocol** |   |\n\n## Install\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.8.0\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.8.0\n```\n\n- **Archives.** Each archive holds the binary, README and LICENSE.\n  - `tuios_*` and `tuios-web_*` are the pure Go builds.\n  - `tuios-ghostty_*` is `tuios` linked against libghostty-vt, for Linux and Windows on amd64 and arm64. The macOS archives follow in a later release. See [the VT backends](https://github.com/Gaurav-Gosain/tuios/blob/main/docs/ghostty-vt.md).\n  - `checksums.txt` lists the sha256 of every archive, and the install script now checks it.\n- **Updating.** A binary installed by the script or from an archive updates with `tuios update`. `tuios update --check` only reports.\n- **Building from source** needs Go 1.26.6 or newer. v0.7.0 needed Go 1.25.8.\n\n## Agents\n\ntuios can now tell which coding agents are running in your panes, whether each is working, waiting for you, done or errored, and it lets you answer them without switching panes. Guide: [Agents](https://tuios.dev/docs/agents).\n\n- **Agent state.** Each agent pane shows its state in the window title and as a row on the session rail. tuios recognises 23 agent CLIs by their process and screen.\n- **Integrations.** `tuios integration install` wires 18 harnesses to report their own state and conversation id. They include Claude Code, Codex, Gemini CLI, opencode, Kilo, Amp, Pi, Copilot, Cursor Agent and Qwen Code.\n  - `tuios integration status` and `tuios doctor agents` show what is installed and what is out of date.\n  - Crush reports state through herdr's pane protocol with no install step (`[agents] herdr_protocol`).\n- **Inbox** ([docs](https://tuios.dev/docs/agent-inbox)). `Ctrl+B i` opens it, `Ctrl+B o` jumps to the oldest item, and `tuios list-attention` prints it from a shell.\n  - It lists everything waiting for you, in every session and on every machine: approvals, questions, mail, errors and finished turns.\n  - You can answer a prompt from the Inbox without attaching (`tuios peek-prompt`, `tuios respond`).\n- **Approvals and risk rules.** With `[agents.approvals]`, permission requests from Claude Code, opencode, Kilo and Qwen Code wait in the Inbox and take one key to answer.\n  - Risky commands, such as `rm -rf`, take two presses to allow. The rules are built in, and you can add your own with `[[agents.approvals.risk.rule]]`.\n- **Review and compare.** `Ctrl+B v` or `tuios review` shows what an agent changed against its base: syntax highlighted, in a unified or split view.\n  - You can leave line notes and send them back to the agent (`review note`, `review send`).\n- **Fleets.** `tuios fan N \"prompt\"` starts one prompt in several agents, each in its own git worktree, and harnesses can be mixed. Docs: [worktrees](https://tuios.dev/docs/worktrees).\n  - `fan compare`, `fan verify` and `fan keep` pick a winner.\n  - Selectors such as `group:fan/retry needs:you` address a whole group.\n- **Start and queue.**\n  - `tuios start-agent` opens a helper beside you.\n  - `--protocol acp|codex` runs a helper headless over ACP or the Codex app-server, shown as a transcript.\n  - `tuios queue` leaves a prompt that is typed when the agent comes to rest.\n- **Rich rail rows.** A rail row shows the agent's model, context use and cost from `tuios integration install claude-code --statusline`, an away recap, and `tuios agent-log`.\n  - Agent chrome stays hidden until tuios sees an agent.\n- **Agents talking to agents** ([docs](https://tuios.dev/docs/agent-messaging)).\n  - `tuios send-agent-message`, `ask-agent` and `ask-human` let agents message each other and ask you questions. Your replies are marked verified.\n  - `tuios stash` keeps files for the session.\n  - `tuios subscribe` streams events.\n- **Pane grants.** `read`, `write`, `fan`, `respond` and `admin` limit what a pane's process may do through tuios.\n  - Give a helper less with `--grants`.\n  - Set `[agents.permissions] mode = \"strict\"` to limit panes by default.\n- **MCP server.** `tuios mcp` serves the same surface as MCP tools. It is read-only and held to the agent's own session unless you pass `--write` or `--scope all`.\n  - `tuios integration install --mcp` registers it with Claude Code, Codex, Gemini CLI and opencode.\n- **tmux shim.** `tuios tmux-shim -- claude` runs tools that drive tmux, such as Claude Code agent teams, and opens their panes as tuios panes. See [TMUX_SHIM.md](https://github.com/Gaurav-Gosain/tuios/blob/main/docs/TMUX_SHIM.md).\n- **Agent skill.** `tuios --skill` prints the guide an agent in a pane reads to drive tuios. `tuios --skill TOPIC` prints one topic of it.\n- **Resume.** After a daemon restart, the Inbox offers to resume each agent conversation that was running. The command is `tuios resume-agent`, and `daemon.resume_agents` sets whether it asks, resumes on its own, or does neither.\n- **Hooks.** A `[hooks]` table runs shell commands on ten events, including `after-agent-state` ([docs](https://tuios.dev/docs/hooks)).\n\n## Sessions and hosts\n\n- **Daemon by default.** On a fresh install a bare `tuios` is daemon-backed and tiled.\n  - `--standalone` or `TUIOS_NO_DAEMON=1` runs without the daemon.\n  - If the daemon cannot start, tuios falls back to a standalone session.\n- **Resurrection.** Sessions come back after a daemon restart, a crash or a reboot, with fresh shells in their saved directories. On macOS too, the working directory is now restored. Commands: `tuios resurrect` (or `restore`) and `tuios daemon --no-restore`. Docs: [sessions](https://tuios.dev/docs/sessions).\n- **Other machines** ([docs](https://tuios.dev/docs/remote-hosts)).\n  - `tuios hosts add` names a machine reached over ssh, and `tuios hosts tailnet` lists a Tailscale tailnet.\n  - `tuios attach --host`, `-s HOST:SESSION` and `new-window --host` run sessions and panes there. `tuios new --global` holds panes from several machines.\n  - Agents run on other machines with `fan --host` and `start-agent -s HOST:SESSION`. Their Inbox items show here, and `tuios worktree pull` brings their work back.\n  - Each machine's `[hosts]` policy says what the others may do there.\n- **Focus.** tuios tracks whether each attached terminal has focus, and `session-info` shows it as `host_focus`.\n- **`tuios update`** replaces a binary installed by the script or from an archive, after checking it against `checksums.txt`. It moves `tuios-web` along with `tuios`.\n  - A binary installed by Homebrew, the AUR, Nix or `go install` is left alone, and the command prints the right upgrade command instead.\n- **Also new:** `tuios popup` (a floating pane that closes when its command exits), `tuios run`, and `tuios attach` starting the daemon itself.\n\n## Look and feel\n\n- **New defaults.** The session rail is on, on the right, 24 columns wide. The dock and window titles are on top, zoom takes 95% of the screen, a pane takes typing on a double click, and the scrollbar has a track. See [how to get the old looks](#new-appearance-defaults).\n- **Backgrounds.** `appearance.background` can paint the cells that have no background of their own, with `theme` or a `#RRGGBB` colour. Per-surface keys cover panes, the desktop, window chrome, the dock and the rail. See [configuration](https://tuios.dev/docs/configuration).\n- **Colour depths.** The chrome is designed separately for truecolor, 256 colours and 16 colours. At 16 colours it uses your terminal's own palette. See [themes](https://tuios.dev/docs/themes).\n- **Light themes.** Dialogs, the scrim, the rail and the dock stay readable on a light theme.\n  - tuios asks your terminal for its colours, passes them on to programs that ask (OSC 4, 10 and 11), and follows its light and dark switch.\n- **Settings search.** The settings page (`Ctrl+B ,`) searches every tab. The command palette also reaches a setting by name.\n- **Palette and which-key.** The command palette lists commands under category headers. The which-key popup lays out the prefix chords in sections and columns.\n- **Motion.** `appearance.motion` takes `none`, `basic` or `full`.\n  - `basic` keeps window slides and zoom.\n  - `full` adds fades, the working shimmer and confetti.\n  - `--no-animations` sets `none` for one run.\n- **Modal dim.** The screen behind an open panel is dimmed by `appearance.modal_dim` percent (default 30, `0` is off).\n- **Glyphs.** `appearance.glyphs` picks the characters the chrome is drawn with. A non-UTF-8 locale gets ASCII on its own, and `tuios list-glyphs` explains the choice. See [GLYPHS.md](https://github.com/Gaurav-Gosain/tuios/blob/main/docs/GLYPHS.md).\n- **Window controls** are macOS-style dots on the left on a fresh install.\n\n## Terminal emulation\n\n- **libghostty-vt backend.** tuios can now use libghostty-vt as its terminal emulator. The `tuios-ghostty_*` archives and `scripts/install.sh` use it, and `tuios --version` names the backend.\n- **Conformance.** A conformance corpus now covers the pure Go emulator. NEL, DECALN, DECOM homing, DECSTR, SCORC, DECRQSS, mode 47, DECSED and DECSEL, HPB and VPB, ED 3 and insert mode were added or fixed.\n- **Home and End** follow DECCKM like the arrow keys, which fixes them in zsh ([#193](https://github.com/Gaurav-Gosain/tuios/issues/193)).\n- **Unicode.** Grapheme clusters stay whole across writes, REP repeats the whole cluster, and the width tables are tested against the Unicode data files.\n- **Kitty graphics.**\n  - Unicode placeholders and the animation protocol work.\n  - Covered images are cropped exactly, and `kitten icat` draws.\n  - Graphics memory per pane is bounded.\n- **Fixes.** Right-margin wrap, lost accents, OSC 8 links, and 8-bit C1 controls inside strings.\n\n## Performance and size\n\n- **Idle.** An idle session schedules no timer renders and sends no bytes to its clients.\n- **Rehydration.** Switching workspace sends only the scrollback rows the client does not have yet, about 95% fewer bytes.\n- **Binary size.** The binary is about twice the size of v0.7.0, because of everything above.\n  - Size work brought it back down from 26.7 MB: `tuios` for linux/amd64 is now about 25 MB, and about 24 MB for darwin/arm64.\n  - `scripts/binary-size.sh` sets a budget, and CI fails a change that goes over it.\n  - To stay small, tailscale is no longer linked in: the tailnet is read through `tailscale status --json`.\n- **Measurements** are in [docs/perf.md](https://github.com/Gaurav-Gosain/tuios/blob/main/docs/perf.md).\n\n## Security hardening\n\n- **`tuios ssh` requires a public key.** It reads `~/.config/tuios/authorized_keys`, falling back to `~/.ssh/authorized_keys`. It refuses a non-loopback bind with no keys unless you pass `--no-auth`. Before, it accepted every connection.\n- **`tuios-web`** needs `--cert` and `--key`, `--auto-tls`, or an explicit `--insecure` to serve a LAN address. A settings change from the web client applies to that session only and does not rewrite your config file. See [web](https://tuios.dev/docs/web).\n- **Daemon socket.** The socket directory must be a real directory, owned by you and closed to others. Debug logs are created 0600.\n- **The daemon protocol** bounds message sizes and nesting before decoding them.\n- **Acting as the person.** A process inside a pane cannot act as you: it cannot give verified answers or read your mail. Pane grants limit everything else it may do.\n- **Downloads are verified.** `tuios update` and the install script check every download against the release's `checksums.txt`.\n\n## Learn tuios\n\n[tuios.dev/learn](https://tuios.dev/learn) is a guided tour of the real tuios, compiled to WebAssembly, with a practice shell in every pane. Nothing is installed, and no server is involved.\n\n## Breaking changes and migration\n\n### Stop the old daemon\n\nThe client and the daemon speak protocol 3 now, and a v0.7.0 daemon cannot serve a v0.8.0 client. After upgrading, run:\n\n```bash\ntuios kill-server\n```\n\nThe v0.7.0 daemon saves nothing to disk, so its running sessions end. From v0.8.0 on, sessions are saved and come back after a restart.\n\n### New appearance defaults\n\nA config file that sets one of these keys keeps its value. A key it does not set takes the new default. The first-run file that v0.7.0 wrote names `dockbar_position`, so most upgraded installs keep the dock at the bottom.\n\n| Option | v0.8.0 default | For the old look |\n|---|---|---|\n| `appearance.sidebar.enabled` | `true` | `false` |\n| `appearance.sidebar.position` | `right` | `left` |\n| `appearance.sidebar.width` | `24` | `28` |\n| `appearance.dockbar_position` | `top` | `bottom` |\n| `appearance.window_title_position` | `top` | `bottom` |\n| `appearance.zoom_size` | `95` | `100` |\n| `appearance.click_to_type` | `double` | `single` |\n| `appearance.scrollbar.style` | `track` | `thin` |\n\nYou can set each one in `config.toml`, in the settings page, or with `tuios set-config`, for example `tuios set-config dockbar_position bottom` in a running session.\n\n`startup.daemon` and `startup.tiled` are now on for a fresh install. A config file with no `[startup]` table stays standalone and floating.\n\n### `animations_enabled` is replaced by `appearance.motion`\n\n`animations_enabled = false` is read as `motion = \"none\"`, and `true` as the default, `full`. The old key is dropped the next time the config is saved, and `set-config` still accepts it.\n\n### Other changes\n\n- **Interface flags on subcommands.** Flags such as `--theme` and `--show-keys` are refused by commands that draw no interface. Only `tuios`, `attach`, `new` and `ssh` take them. For example, `tuios config path --theme dracula` now fails with \"Unknown flag\".\n- **Keybindings.**\n  - `Ctrl+B Esc` leaves prefix mode instead of detaching; `Ctrl+B d` detaches. A config that bound `esc` to `prefix_detach` is migrated.\n  - `Ctrl+B ,` opens settings. Rename is `Ctrl+B r`.\n  - Snap to a corner moved to `Ctrl+B L 1` to `4`.\n  - The `nav_*` and `extend_*` actions were removed.\n- **Integrations.** An integration installed by an earlier build is reported as out of date by `tuios integration status` and `tuios doctor agents` until you run `tuios integration install <harness>` again. Approvals for Claude Code and Qwen Code need the current version.\n- **`TUIOS_SOCKET`.** A `TUIOS_SOCKET` that names no live daemon is refused, and the error says what to do. The variable only reports the daemon a pane belongs to; it never chose one. To run a separate daemon, set `XDG_RUNTIME_DIR` and `XDG_STATE_HOME`.\n- **Alerts and focus.** With `notifications.agent.suppress_focused` (on by default), the alert and the `after-agent-state` hook for the pane you are looking at are held while any attached terminal has focus, or has not reported focus. When every attached terminal has lost focus, the alert fires.\n- **`-w` resolution.** `-w` resolves a full id first, then a window index, then an exact name, then a unique id prefix. Before, an id prefix won over a name, so a pane named `db` could resolve to another pane whose id started with `db`.\n- **Home and End** send SS3 sequences (`ESC O H`, `ESC O F`) when the application turns on cursor key mode (DECCKM), as the arrow keys already did.\n- **TERM for detached sessions.** A session made by a command without a terminal, such as `tuios new --detach` from a script, CI or an agent, gives its panes a real `TERM` (`xterm-256color`) instead of `dumb`.\n- **`tuios update` needs curl.** It downloads with `curl`, and without it the command stops and names the releases page. A release without `checksums.txt` is refused.\n- **`tuios ls`** exits 3 when no daemon is running, and lists the sessions saved on disk.\n- **No tmux variables in panes.** Panes no longer inherit `TMUX` or `TMUX_PANE`.\n\n## Contributors\n\nThank you to everyone who sent a pull request for this release:\n\n- @SebaWag: zen mode ([#121](https://github.com/Gaurav-Gosain/tuios/pull/121)), dock workspace tab labels ([#122](https://github.com/Gaurav-Gosain/tuios/pull/122)), the Nix package fix ([#131](https://github.com/Gaurav-Gosain/tuios/pull/131)), resolved colours in capture-pane ([#136](https://github.com/Gaurav-Gosain/tuios/pull/136)), palette tests ([#137](https://github.com/Gaurav-Gosain/tuios/pull/137)), reattach replay ([#139](https://github.com/Gaurav-Gosain/tuios/pull/139)), percentage resize ([#140](https://github.com/Gaurav-Gosain/tuios/pull/140), [#142](https://github.com/Gaurav-Gosain/tuios/pull/142)), the clipboard fallback ([#182](https://github.com/Gaurav-Gosain/tuios/pull/182)), the right-click pane menu ([#183](https://github.com/Gaurav-Gosain/tuios/pull/183)), a scrollback lock fix ([#184](https://github.com/Gaurav-Gosain/tuios/pull/184)) and session appearance ([#190](https://github.com/Gaurav-Gosain/tuios/pull/190))\n- @NotAFlightRisk: `--list-themes` ([#134](https://github.com/Gaurav-Gosain/tuios/pull/134)), dock docs ([#147](https://github.com/Gaurav-Gosain/tuios/pull/147)) and grouped `list-options` output ([#192](https://github.com/Gaurav-Gosain/tuios/pull/192))\n- @masshirodev: Home and End under DECCKM ([#193](https://github.com/Gaurav-Gosain/tuios/pull/193))\n- @ronisbr: theme chrome surfaces ([#189](https://github.com/Gaurav-Gosain/tuios/pull/189))\n- @noomz: terminal mode on focus change ([#130](https://github.com/Gaurav-Gosain/tuios/pull/130))\n- @actes2: screen size clamping ([#128](https://github.com/Gaurav-Gosain/tuios/pull/128))\n- @ethanhawkes-gif: a render panic fix ([#125](https://github.com/Gaurav-Gosain/tuios/pull/125))\n- @FaintFlower: the star history chart ([#126](https://github.com/Gaurav-Gosain/tuios/pull/126))\n\nThanks also to everyone who reported bugs and asked questions.\n\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.7.0...v0.8.0\n","reactions":{"total_count":5,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":5,"eyes":0},"mentions_count":8}
