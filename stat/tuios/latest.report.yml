iew_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4497733,"digest":"sha256:b4e3daa692e38a223ce0c4e3efef1ab200d1795778db37fb10b9904cfaecf89c","download_count":902,"created_at":"2026-03-28T21:21:01Z","updated_at":"2026-03-28T21:21:02Z"}],"body":"## What's New in v0.7.0\r\n\r\n### Video Playback\r\n\r\nYou can now watch videos inside tuios. `mpv --vo=kitty` works with both shared memory and base64 modes. For the best experience, use `--vo-kitty-use-shm=yes` which sends just a file reference instead of streaming megabytes of pixel data through the terminal. [youterm](https://github.com/Gaurav-Gosain/youterm) also works out of the box.\r\n\r\n### Kitty Keyboard Protocol\r\n\r\nFull support for the kitty progressive enhancement keyboard protocol with push/pop/query. Fish 4.x enables this automatically on startup, and it just works. Capital letters and other shifted printable keys are sent as text directly rather than CSI u encoding, which is what shells actually expect.\r\n\r\n### Kitty Graphics Improvements\r\n\r\n- Static images (icat, yazi) render with proper vertical clipping when they extend past the viewport\r\n- Images hide cleanly when the window goes out of bounds on any edge\r\n- Fixed a bug where raw APC data was double-wrapped, which was silently breaking all direct base64 image transfers\r\n- Shared memory transfers now send the correct shm object name to the host terminal\r\n\r\n### Pane Zoom\r\n\r\nPress `z` in window management mode or `Ctrl+B z` in terminal mode to fullscreen any pane. When using shared borders, the zoomed pane renders without individual borders and the separator lines are hidden. The dockbar shows a Z indicator when a pane is zoomed.\r\n\r\n### Layout Prefix\r\n\r\n`Ctrl+B L` opens a layout submenu where `l` loads and `s` saves a layout template. Loading is non-destructive now: existing windows get repositioned to match the template instead of being killed. If you have more windows than the template needs, the extras get minimized.\r\n\r\n### Copy Mode Drag Auto-Scroll\r\n\r\nWhen you drag a selection above or below the pane in copy mode, scrolling now continues smoothly even if you stop moving the mouse. This uses a timer that fires every 50ms while you hold the mouse outside the content area.\r\n\r\n### Protocol Support\r\n\r\n- OSC 4 palette color queries and sets\r\n- OSC 52 clipboard operations\r\n- Mode 2026 (synchronized output) and mode 2027 (unicode core)\r\n- DA1 response includes sixel capability\r\n- OSC 66 kitty text sizing (experimental, has known scrollback issues)\r\n\r\n### Quit Confirmation\r\n\r\nNew `--confirm-quit` flag and `confirm_quit` config option to always show the quit dialog, regardless of whether there are active foreground processes.\r\n\r\n### Bug Fixes\r\n\r\n- Fixed crashes from concurrent map access in HasMouseMode (uses atomic bools now)\r\n- Thread-safe KittyKeyboardFlags via atomic cache\r\n- Sixel passthrough improvements with better viewport clipping\r\n- Fixed prefix commands (Ctrl+B z, Ctrl+B L) not working in window management mode\r\n- Fixed Dockerfile Go version to match go.mod\r\n\r\n### Known Limitations\r\n\r\n- Kitty text sizing protocol (OSC 66) has basic passthrough but breaks with scrollback and window repositioning\r\n- Sixel passthrough works but lacks pixel-level clipping\r\n- Kitty animation protocol (a=f, a=a, a=c) is not supported yet\r\n- Video playback without shm can flicker depending on frame rate and terminal performance. Use `--vo-kitty-use-shm=yes` when possible.\r\n\r\n### Installation\r\n\r\n#### TUIOS (Terminal Window Manager)\r\n\r\n**Quick Install (Linux/macOS):**\r\n```bash\r\ncurl -sSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\r\n```\r\n\r\n**Homebrew (macOS/Linux):**\r\n```bash\r\nbrew tap Gaurav-Gosain/tap\r\nbrew install tuios\r\n```\r\n\r\n**Arch Linux (AUR):**\r\n```bash\r\n# Using yay\r\nyay -S tuios-bin\r\n\r\n# Using paru\r\nparu -S tuios-bin\r\n```\r\n\r\n**Nix:**\r\n```bash\r\n# Run directly\r\nnix run github:Gaurav-Gosain/tuios#tuios\r\n\r\n# Or add to your configuration\r\nnix-shell -p tuios\r\n```\r\n\r\n**Go Install:**\r\n```bash\r\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.7.0\r\n```\r\n\r\n#### tuios-web (Web Terminal Server)\r\n\r\n**Homebrew (macOS/Linux):**\r\n```bash\r\nbrew tap Gaurav-Gosain/tap\r\nbrew install tuios-web\r\n```\r\n\r\n**Arch Linux (AUR):**\r\n```bash\r\n# Using yay\r\nyay -S tuios-web-bin\r\n\r\n# Using paru\r\nparu -S tuios-web-bin\r\n```\r\n\r\n**Go Install:**\r\n```bash\r\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios-web@v0.7.0\r\n```\r\n\r\n**Manual Download:**\r\nDownload the appropriate `tuios_*` or `tuios-web_*` archive for your platform below, extract it, and run.\r\n\r\n## Changelog\r\n### New Features\r\n* ae0f742252da604089f040c3662b531bf5d0e79d: Reapply \"feat: grid-based shared borders with proper junction characters\" (@Gaurav-Gosain)\r\n* b5ab00f7027cfb02ce051196446dc5db5a945f58: Reapply \"feat: shared borders between tiled windows (simple overlap approach)\" (@Gaurav-Gosain)\r\n* e7dd53dcfb2c7d0b88e5fb1ccb831484ef6cf1d8: Revert \"feat: grid-based shared borders with proper junction characters\" (@Gaurav-Gosain)\r\n* 4caa30734671286712e10d74a3dd777ed8c3db1e: Revert \"feat: grid-based shared borders with proper junction characters\" (@Gaurav-Gosain)\r\n* b26925ec17b77df57ec07c8f480b7482075d3e53: Revert \"feat: shared borders between tiled windows (simple overlap approach)\" (@Gaurav-Gosain)\r\n* dd246e32d2eaa9c428443857984957830b60f13c: Revert \"feat: shared borders with post-compositing junction character fix\" (@Gaurav-Gosain)\r\n* cdff775d4221e0f3462036dd9f55b087c85b2125: feat: OSC 66 text sizing passthrough with PostRenderWriter (@Gaurav-Gosain)\r\n* f77543d533a739f69adf1b1f076293aee0983d11: feat: add --confirm-quit flag and confirm_quit config option (@Gaurav-Gosain)\r\n* 8308b3b026d564a676554e7be2f9946dcad682cb: feat: add command palette (ctrl+p) with fuzzy search (@Gaurav-Gosain)\r\n* 4e9f8237a118735fad3845476c410c93afe5563e: feat: add kitty keyboard protocol, OSC 4/52/66, mode 2026/2027, thread-safe mouse modes (@Gaurav-Gosain)\r\n* adca4775a0d0401f00c0a137ba3729c8a334160a: feat: add scrollback browser with OSC 133 parsing, vim navigation, and mouse support (@Gaurav-Gosain)\r\n* 0acc9f0780900b01444e1ae3f917ca55a452256e: feat: add session switcher overlay (prefix+S or command palette) (@Gaurav-Gosain)\r\n* 7d086f71e997298348f8d60fd8eabe269286a513: feat: comprehensive layout template v2 with CLI, BSP, CWD, startup commands (@Gaurav-Gosain)\r\n* cc3c86c4f0e8c8ccece495c9f82c34ffa3fd99a3: feat: grid-based shared borders with proper junction characters (@Gaurav-Gosain)\r\n* 1fa11a6dda2bd89cc3aeea6bdb41652694ccb341: feat: interactive scrollbar with theme colors, click-to-jump, drag support (@Gaurav-Gosain)\r\n* c26deaa40317a02b0daab9fac92178cb24a5f15d: feat: kitty keyboard protocol input pipeline (CSI u encoding) (@Gaurav-Gosain)\r\n* e8d4db8118bb7335aa221d30754ff3e2555ff1fd: feat: layout prefix (Ctrl+B L) with save/load, non-destructive layout loading (@Gaurav-Gosain)\r\n* 3ec872c7cbbe6efcfffca53d25cea534270b22b9: feat: mouse wheel scrollback + visibility gating for hidden panes (@Gaurav-Gosain)\r\n* 3e11e2ab8e466c9a7985ad50ed492499143f570f: feat: pane zoom, scrollback search, layout templates, fast render path (@Gaurav-Gosain)\r\n* 1dab0af946cbdab9606ce980051f1bb6aa22c4e2: feat: pass through kitty animation/frame/compose commands (@Gaurav-Gosain)\r\n* de22884922f9022e51065f008cdf3fbae4db8fba: feat: ranked fuzzy search in command palette (@Gaurav-Gosain)\r\n* 6000e9f3e61593df9ee8c392ce05ec6e5a770138: feat: scrollback position indicator on window border (@Gaurav-Gosain)\r\n* c87bd47762261f22f8d50592c4c88139f80ad318: feat: scrollbar click/drag, dark gray colors, hide during manipulation (@Gaurav-Gosain)\r\n* 67de79eabb7fa5a82e4e49dceeb65982e232770d: feat: scrollbar in border + selection auto-scroll (@Gaurav-Gosain)\r\n* 114b7937e50238c0f5d515e7d4570380922113ca: feat: shared borders between tiled windows (@Gaurav-Gosain)\r\n* 42cf5d6e28c1e146914f4c528b49bf7408c14496: feat: shared borders between tiled windows (simple overlap approach) (@Gaurav-Gosain)\r\n* a32d979e35a2019bf833cc8e86e89930b9a56614: feat: shared borders with post-compositing junction character fix (@Gaurav-Gosain)\r\n* f46f63ed6dae6043fb5f0311d3e07bb2fd3541ca: feat: smart split, scrollback indicator, and graphics refresh in render path (@Gaurav-Gosain)\r\n* 97920db032680d7ef884db3e1bbe5c920daaf141: feat: timer-based continuous auto-scroll for copy mode drag selection (@Gaurav-Gosain)\r\n* e9608d67064e00ab7df54fc4c5f7e82ea6181785: feat: tmux-style shared borders with separator overlay (@Gaurav-Gosain)\r\n* 626af671273b29e89c23f68be67820686a8be679: feat: visual scrollbar in copy mode using block characters (@Gaurav-Gosain)\r\n* df56e4c4a3cfc1f6734f246fa376cf9e473df32c: feat: workspace-aware PTY subscriptions (@Gaurav-Gosain)\r\n### Bug Fixes\r\n* b9019978e25466e1e4b08577b45a85f7e5881997: Revert \"fix: shared borders resize + remove broken junction fixer\" (@Gaurav-Gosain)\r\n* af344cceb2348f0493f2a6f3d76cc34073ef9602: fix: Ctrl+B passthrough uses CSI u when kitty keyboard active, thread-safe flags (@Gaurav-Gosain)\r\n* 4fd97b9e365d6db92bc03144bcc993f99098131a: fix: add bounds checking for video frame placement (@Gaurav-Gosain)\r\n* 5b8bd71e5945c1083e3714c2034cdaa6d56b1024: fix: add q=2 and proper m=1 to streamed kitty graphics continuation chunks (@Gaurav-Gosain)\r\n* 61fa9e7205847a64333f411a5090255e700a3741: fix: all tiling toggle paths now use ToggleAutoTiling() (@Gaurav-Gosain)\r\n* 51bf80f31f27843ea694866001e9efc5f3f029f6: fix: borders appear/disappear immediately when toggling tiling mode (@Gaurav-Gosain)\r\n* b4bdc0117e1b158c2b6da1adff2e8473d1531a7d: fix: clear cached content when disabling tiling so borders render immediately (@Gaurav-Gosain)\r\n* 54c356ba125058a08cf247a318a8feb963fabe08: fix: clear stale image placement when dimensions change on resize (@Gaurav-Gosain)\r\n* d911c1787c100948b895e21638e5686875a0d816: fix: copy mode dock indicator color from neon yellow (#ffff00) to soft amber (#e0af68) (@Gaurav-Gosain)\r\n* defce9f781e86c2830cb50cd1f0ce0d03e453d8c: fix: ctrl+d window close race + eliminate kitty graphics flicker (@Gaurav-Gosain)\r\n* a0a163bed76ccd8426e85526466ab3ff0668f6f9: fix: deduplicate sixel renders + revert to BorderOffset for X position (@Gaurav-Gosain)\r\n* 7768dff1a1fe3ce3c546c49508bc1177024c6e4f: fix: disable shared borders (flag exists but not yet implemented) (@Gaurav-Gosain)\r\n* 819b3b19aa214f3d24b46a94e56ad198961b752f: fix: distinguish video frames from icat by checking cmd.More (@Gaurav-Gosain)\r\n* 67d9eb24fe140cba064fbd2611e189adfa123d90: fix: eliminate screen tearing by batching graphics with render cycle (@Gaurav-Gosain)\r\n* 7feb20275e89ad299dec1be52c4f38490f54b7e8: fix: enable Kitty graphics protocol detection in daemon mode (@Gaurav-Gosain)\r\n* d2e824e724a5eced3e027d9d7a5987758f484ad4: fix: enable sixel passthrough when host terminal supports it (@Gaurav-Gosain)\r\n* 8f6cb56e9d4fff6371db1990ea3bc858f6867388: fix: flush video frames immediately to host terminal for shm/file playback (@Gaurav-Gosain)\r\n* 26d674c771b9f9874ef8f3b0951e63a14c8add38: fix: force full re-render when disabling tiling \u2014 set HasNewOutput + MarkAllDirty (@Gaurav-Gosain)\r\n* 5f6b345c9ea429206eb281d213d040149576fd10: fix: graphics passthrough and window dimension restore in daemon mode (@Gaurav-Gosain)\r\n* bbfac446bcb7779f6bc6fae86aea942d790a3da5: fix: handle errcheck lint warning in mouse test (@Gaurav-Gosain)\r\n* 5a78481c676b366e951c4082ca3f6b1bb5d10ee3: fix: handle mpv m=1 on every frame + always use a=T for placement requests (@Gaurav-Gosain)\r\n* dfa682c8720ad8f50947dfaa4bb0c33f030c5da2: fix: hide and re-place kitty images on terminal resize (@Gaurav-Gosain)\r\n* d608590eb15608f2ac2922a2bd17f3791ff1109d: fix: hide images during overlays, increase daemon subscriber buffer (@Gaurav-Gosain)\r\n* 9995187845a91b946ba6494eb39ba68b907e44f8: fix: hide kitty images during copy mode scrollback (@Gaurav-Gosain)\r\n* 5d5bdf17800f279a584147d8208f834e0446fb44: fix: hide kitty images near bottom screen edge to prevent scroll feedback loop (@Gaurav-Gosain)\r\n* c10f12c16bf5ea4e4dd8ce479654abf79893355d: fix: hide kitty images that extend past window bounds (@Gaurav-Gosain)\r\n* 3503490e81e503067bcc7587db2edb6ecb8563f9: fix: icat/static images - only use immediate flush for video frames (@Gaurav-Gosain)\r\n* 728fa6f2a10cca3e5b3d4ffcc3318db67787ff5b: fix: idle tick syncs background windows to prevent stale content (@Gaurav-Gosain)\r\n* 698146442eeabdd2ef69cc4fc57ea319252daee4: fix: image rendering bugs during window drag and position changes (@Gaurav-Gosain)\r\n* 98012d40b1598410570e780ddb91989ed9757298: fix: images now actually follow windows during drag (@Gaurav-Gosain)\r\n* dca77df2053abebbd0d29e08894396381365cbd7: fix: images now follow windows during drag instead of hiding (@Gaurav-Gosain)\r\n* ddd1584a8e0a187216a525c50be6067376d020d6: fix: kitty graphics video playback - accumulate frames, fix APC framing (@Gaurav-Gosain)\r\n* 41854eb9a96addd7760c95531a55c09a7d246314: fix: kitty graphics video playback - use a=T for frame updates (@Gaurav-Gosain)\r\n* ebee35eb2e140c09a9cf3dc6c781ebd9639adbaa: fix: layout load blank windows + separator drawn above dragged window (@Gaurav-Gosain)\r\n* 1ee84f13e344514ad0837ef3f382cf251a4c718b: fix: mouse wheel scrolling now enters copy mode instead of scrollback mode (@Gaurav-Gosain)\r\n* 52c3522bffd221fae2dbbb33bad30ca7fc241052: fix: only skip sixel images that hit screen bottom, not window edge (@Gaurav-Gosain)\r\n* cdb67a6d68a7a64328d8253cfaf74b1b9a1d5a34: fix: pass alt screen kitty graphics raw for animation apps (@Gaurav-Gosain)\r\n* ddec3218148e0fe9ac7270c37f905d6698be7ca1: fix: preserve ANSI escape sequences when clipping off-screen windows (@Gaurav-Gosain)\r\n* f5e2d0f6621e188e292f2ee84443356be6a6406b: fix: prevent double placement for non-video shm images (ytk, icat) (@Gaurav-Gosain)\r\n* 352ffc08f237d031b774186bd65584bc3f9a3a3d: fix: prevent phantom keypresses from mouse motion and fix white terminal colors (@Gaurav-Gosain)\r\n* 38bf2344ed945eade5c3fe05a2999d03751e8341: fix: re-enable sixel passthrough + hide images during copy mode scroll (@Gaurav-Gosain)\r\n* 29bda64ba4286ce0e1684fe6c9fdb4dff34e114d: fix: reduce window close timeout from 500ms to 10ms (@Gaurav-Gosain)\r\n* d3d14c7d6a6d5ae95448cdc473aaf805f54f0eea: fix: remove broken scrollback search, fix templates/resize/help sync (@Gaurav-Gosain)\r\n* 483ed8b19b90e7344bc10b28791c1e24d9f19182: fix: remove screen bounds check that was skipping most sixel images (@Gaurav-Gosain)\r\n* 380547fb5238d323fe30ad4d37ee63da400ad153: fix: resolve FakeShell bugs and clean up linter warnings (@Gaurav-Gosain)\r\n* 418806625efeefcb8e59f5684fcb61f5598df2ba: fix: resolve gopls hints in tests (@Gaurav-Gosain)\r\n* 316f7b2b52d6f3957cfd1c73c695278fc7e68b6e: fix: resolve light theme rendering issues with ANSI colors (#74, #72, #41) (@Gaurav-Gosain)\r\n* 2ddbdb5a0194e03f6101ec69363ee53da2fc4aaf: fix: revert default tiling to SchemeSpiral (smart split is opt-in) (@Gaurav-Gosain)\r\n* 7f695fe5825961625421c1328249edfe03c86a8f: fix: screen edge bounds checking for video, store window pos in pending (@Gaurav-Gosain)\r\n* fe01cbc3a43d5d7f20064808b695fc8043b9bffd: fix: scrollback mode UX and command palette overlay positioning (@Gaurav-Gosain)\r\n* 788e55d82004fabe2b6b5b5958e808827779f100: fix: scrollbar actually renders + copy mode selection auto-scroll (@Gaurav-Gosain)\r\n* 8c4839b133c5c49a30e20ca280639b5a21f28ea0: fix: scrollbar as always-fresh layer bypassing window cache entirely (@Gaurav-Gosain)\r\n* a6f5403561a312b509669d353ddec7107af45078: fix: scrollbar as overlay layer on right border + race condition fix (@Gaurav-Gosain)\r\n* bac0f9fe154669214aa07bf8766a598ec4b84774: fix: scrollbar con