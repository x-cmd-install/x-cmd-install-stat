800c759a5e5137d7e478668c","download_count":231,"created_at":"2026-11-15T20:12:11Z","updated_at":"2026-11-15T20:12:12Z"},{"id":752211695,"node_id":"RA_kwDOPrEI7s4s1dbv","name":"tuios_0.13.2_Openbsd_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":18293261,"digest":"sha256:0360be79c9696008f16088611a93403dbd35fb83ceb3e5051a4061855254ae3f","download_count":1,"created_at":"2026-11-15T20:12:10Z","updated_at":"2026-11-15T20:12:11Z"},{"id":752211576,"node_id":"RA_kwDOPrEI7s4s1dZ4","name":"tuios_0.13.2_Openbsd_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":18812659,"digest":"sha256:83b077981f1005bed63201ac77b5ef46d48af19f2e48edcbf3256556c9663033","download_count":1,"created_at":"2026-11-15T20:12:08Z","updated_at":"2026-11-15T20:12:09Z"},{"id":752211678,"node_id":"RA_kwDOPrEI7s4s1dbe","name":"tuios_0.13.2_Openbsd_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":20014661,"digest":"sha256:ecb851a2bc3aca2c754a3110e8d542deb8489152813a36478e07ce1288a8fd63","download_count":1,"created_at":"2026-11-15T20:12:09Z","updated_at":"2026-11-15T20:12:11Z"},{"id":752211483,"node_id":"RA_kwDOPrEI7s4s1dYb","name":"tuios_0.13.2_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":19369503,"digest":"sha256:bb860ae84007c38d708e63c0eea5a3d724818db7dfe63308c39d86b2560d1ef3","download_count":4,"created_at":"2026-11-15T20:12:06Z","updated_at":"2026-11-15T20:12:07Z"},{"id":752211589,"node_id":"RA_kwDOPrEI7s4s1daF","name":"tuios_0.13.2_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":20210798,"digest":"sha256:eeedeb3474a7acf714d06935e0d166d8dcfd2c2c07b47d8516b7c9b6dbd44579","download_count":26,"created_at":"2026-11-15T20:12:08Z","updated_at":"2026-11-15T20:12:09Z"}],"body":"tuios 0.13.2 is a small release, and nearly all of it is the agents view (`ctrl+b i`). This round fixes the rough edges that show up when you run a lot of agents at once. Code blocks in the thread wrap, scroll sideways and copy with one key. File paths open in quick look on a click. An answer moves you to the next agent that needs you, and `r` no longer rejects anything.\n\nUpgrading from v0.13.1 is live on macOS and Linux: install, then run `tuios daemon upgrade`, and every program in your panes keeps running.\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.13.2\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.13.2\n```\n\nA binary installed by the script or from an archive updates with `tuios update`.\n\n## Agents view\n\n- **`r` always replies, and `X` rejects.** Before, `r` rejected a held approval, so a reply could turn into a reject. On a held approval or plan, `r` now tells you to press `a` or `X` first. A user who bound `X` in the agents view keeps that binding. ([#2131](https://github.com/Gaurav-Gosain/tuios/pull/2131))\n- **Code blocks in the thread.** A cut line ends with a quiet `…`. `W` wraps the long lines of every block, and `W` again cuts them. `(` and `)` or a sideways wheel scroll a wide block. `copy` in a block's header, or `C`, copies the whole block as the agent wrote it. ([#2102](https://github.com/Gaurav-Gosain/tuios/pull/2102), [#2106](https://github.com/Gaurav-Gosain/tuios/pull/2106), [#2108](https://github.com/Gaurav-Gosain/tuios/pull/2108))\n- **Links and paths open on a click.** A click on a link in the view opens it, and `gx` does the same in copy mode. A file path that exists opens in quick look at the line it names: a plain click in the view, `ctrl+click` in a pane. `e` in quick look opens the file in your editor at that line. A `file://` link now opens in quick look first. ([#2113](https://github.com/Gaurav-Gosain/tuios/pull/2113), [#2117](https://github.com/Gaurav-Gosain/tuios/pull/2117))\n- **Select the thread with the mouse.** Drag across cards, double click a word, triple click a line. A right click on the selection offers Copy, Copy as Markdown and Search for it. In copy mode a click moves the cursor. ([#2122](https://github.com/Gaurav-Gosain/tuios/pull/2122))\n- **An answer moves to the next agent that needs you,** so a queue of approvals is `a` `enter`, `a` `enter`. Set `[agents] answer_advance = false` to stay on the agent you answered. ([#2107](https://github.com/Gaurav-Gosain/tuios/pull/2107))\n- **Questions show their options as keys.** A question from Claude Code reads \"Asks\" with its text, and a digit picks an option. ([#2112](https://github.com/Gaurav-Gosain/tuios/pull/2112))\n- **Mail between agents draws as message cards,** with the subject, the message, whether it was read and the replies under it. A Talked with line under the focus header has a chip for each agent this one wrote to, and a click selects that agent. ([#2100](https://github.com/Gaurav-Gosain/tuios/pull/2100), [#2103](https://github.com/Gaurav-Gosain/tuios/pull/2103))\n- **A long plan reads by page.** `J` and `K` move a page, `G` goes to the end, and `Z` gives the card the whole focus. The plan draws as Markdown. ([#2104](https://github.com/Gaurav-Gosain/tuios/pull/2104))\n- **Compare uses `J` to ask a judge and `K` to keep,** so `j` and `k` move, as everywhere else. ([#2116](https://github.com/Gaurav-Gosain/tuios/pull/2116))\n- **Agents that share a folder are marked \"shared folder\",** and the New agent sheet suggests a worktree when agents already work there. ([#2123](https://github.com/Gaurav-Gosain/tuios/pull/2123))\n- A new agent takes its name from its branch or its task, not from the title its program sets. ([#2110](https://github.com/Gaurav-Gosain/tuios/pull/2110))\n- Paths show relative to the agent's worktree: `cmd/main.go`, not the last three parts of an absolute path. ([#2111](https://github.com/Gaurav-Gosain/tuios/pull/2111))\n- The Changes tab gives its rows to the diff and opens at the first file. ([#2127](https://github.com/Gaurav-Gosain/tuios/pull/2127))\n- Search finds names first and keeps the cursor on the agent you found. The search box keeps its place at every width. ([#2118](https://github.com/Gaurav-Gosain/tuios/pull/2118))\n- A narrowed view says \"1 of 8 agents · esc shows all\", and `esc` brings every agent back. ([#2109](https://github.com/Gaurav-Gosain/tuios/pull/2109))\n- At 80 columns, or in a long group, a one-line row still says what the agent needs or does. ([#2115](https://github.com/Gaurav-Gosain/tuios/pull/2115))\n- On a light terminal with no theme set, the agents view is light too. ([#2119](https://github.com/Gaurav-Gosain/tuios/pull/2119))\n- A followed thread streams in place. A sent prompt no longer jumps to the top, and the live row becomes the call's card without a jump. ([#2099](https://github.com/Gaurav-Gosain/tuios/pull/2099))\n\n## Fixes\n\n- The reply editor no longer crashes when `ctrl+r`, the external editor or a drag changes the draft while the `@` list is open. Thanks to @Gsirawan. ([#2130](https://github.com/Gaurav-Gosain/tuios/pull/2130))\n- A thread that opened before its agent had a transcript now reads the transcript when it comes, with no key pressed. ([#2101](https://github.com/Gaurav-Gosain/tuios/pull/2101))\n- An answer key that does nothing says why on the card. `enter` on a held approval in another session hands the prompt back to its pane. ([#2105](https://github.com/Gaurav-Gosain/tuios/pull/2105))\n- A reply to an agent on another machine is queued there when you are attached through a host. ([#2129](https://github.com/Gaurav-Gosain/tuios/pull/2129))\n- Bold around a code span closes when more code follows on the line, so ``**`main.go`:**`` no longer shows its stars. ([#2120](https://github.com/Gaurav-Gosain/tuios/pull/2120))\n- The rename field selects with shift and the arrows, and a selection looks the same in both directions. ([#2121](https://github.com/Gaurav-Gosain/tuios/pull/2121))\n- `tuios integration status` says what differs when the installed hooks have the same version but are not the ones this build writes. ([#2098](https://github.com/Gaurav-Gosain/tuios/pull/2098))\n- A stopped git no longer leaves an index lock file in the temp folder. ([#2128](https://github.com/Gaurav-Gosain/tuios/pull/2128))\n\n**Full changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.13.1...v0.13.2\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.13.1...v0.13.2\n\n","mentions_count":1}
