:"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":14457474,"digest":"sha256:8e83e19eec09c498d71167f260d60e892db97cfbcf7de59d8edcc9b3ba575439","download_count":0,"created_at":"2026-10-16T06:19:48Z","updated_at":"2026-10-16T06:19:49Z"},{"id":646364552,"node_id":"RA_kwDOPrEI7s4mhr2I","name":"tuios_0.10.0_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":14067215,"digest":"sha256:2a0f9ff6c2c83a40c4812bdd0ed41ba3b2ed60b3c7bc5aaef11e416785b66a29","download_count":1,"created_at":"2026-10-16T06:19:44Z","updated_at":"2026-10-16T06:19:46Z"},{"id":646364676,"node_id":"RA_kwDOPrEI7s4mhr4E","name":"tuios_0.10.0_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":14698720,"digest":"sha256:dac85e1737b900d46f272cdb22503c1f31031275dbc76e75c090ef228226e7f1","download_count":36,"created_at":"2026-10-16T06:19:47Z","updated_at":"2026-10-16T06:19:48Z"}],"body":"tuios 0.10.0 is a feature release. On [Omarchy](https://omarchy.org), tuios now uses the Omarchy theme when you set no theme, and it changes its colours when you switch the Omarchy theme. You do not restart tuios.\nThe terminal emulator of tuios is now a Go library of its own, `tuios.dev/vt`. A second library, `tuios.dev/swatch`, reads the colour theme of a desktop. Host links reconnect after a laptop wakes from sleep. Read [Upgrading](#upgrading) before you update: the theme on Omarchy, the `TERM` of new sessions, some terminal mode keys and Option characters on macOS changed.\n\nThe full list is at [tuios.dev/releases](https://tuios.dev/releases).\n\n## Install\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.10.0\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.10.0\n```\n\nA binary installed by the script or from an archive updates with `tuios update`.\n\n## Omarchy\n\n- **The Omarchy theme by default.** On a machine with Omarchy, tuios uses the applied Omarchy theme when `appearance.theme` is empty. The panes, the chrome, the rail and the dock take its colours. The panes get the colours that Omarchy gives kitty, ghostty and foot ([#734](https://github.com/Gaurav-Gosain/tuios/pull/734)).\n- **Live follow.** When you switch the Omarchy theme, tuios changes its colours at the same moment as your terminal. You do not restart tuios and you do not press a key ([#738](https://github.com/Gaurav-Gosain/tuios/pull/738)).\n  - tuios watches the theme folder with one file watch. No timer runs. A machine without Omarchy watches nothing.\n  - A theme that you pick by hand stays. A theme in a picker preview stays.\n- **Theme ids.** `theme = \"omarchy\"` uses the Omarchy theme, and shows a warning on a machine without Omarchy. `theme = \"none\"` uses the colours of your terminal. Each installed Omarchy theme is also in the theme list as `omarchy/NAME`, such as `omarchy/gruvbox`. Such an id is fixed. It does not change with the Omarchy theme.\n- **`tuios list-themes`** shows the Omarchy theme that it found, and whether tuios uses it.\n- **Theme colours in a pane.** A program in a pane of a daemon session now gets the theme's colours when it asks with OSC 10, 11 and 4. Before, under any theme, it got black, white and the xterm colours. Neovim, Claude Code and other programs use this answer to pick a light or a dark look ([#730](https://github.com/Gaurav-Gosain/tuios/pull/730)).\n- **Light and dark reports.** A program that turns on mode 2031 gets a report when the background changes between light and dark. This also works when your terminal changes its own colour scheme. tuios sends no SIGWINCH ([#738](https://github.com/Gaurav-Gosain/tuios/pull/738)).\n\nSee [Omarchy](https://tuios.dev/docs/omarchy) for the keys that tuios reads.\n\n- **Theme switch animation.** `appearance.theme_transition` shows a change of theme as an animation. `circle` grows the new theme from the middle of the screen, and `fade` changes every cell from the old colours to the new colours. The default, `none`, changes the theme in one frame. It runs for the theme picker, `set-config`, a config reload and the Omarchy live follow. `appearance.theme_transition_duration` sets the time, 450 ms by default, from 100 to 2000. `animation_speed` scales it. `motion = \"none\"` and `--no-animations` turn it off. `fade` needs a truecolor terminal ([#757](https://github.com/Gaurav-Gosain/tuios/pull/757)).\n\n- **CharmTone themes.** Two new built-in themes, `charmtone` (dark) and `charmtone-light`, use the colours of [CharmTone](https://github.com/charmbracelet/tone), the colour system of Charm ([#755](https://github.com/Gaurav-Gosain/tuios/pull/755)).\n\n## Go libraries\n\n- **`tuios.dev/vt`**, the terminal emulator of tuios, is now its own Go module ([#725](https://github.com/Gaurav-Gosain/tuios/pull/725)). It keeps the screen that a program draws: cells, colours, the cursor, scrollback with reflow, kitty graphics and sixel. The default build is pure Go. The `ghostty` build tag uses libghostty-vt.\n  - v0.1.0 is the first release, with a documented API and a `Screen` interface.\n  - v0.2.0 adds `TakeResponses`, a read of the replies to the program that never blocks. It also adds the mode 2031 report, the ConPTY kitty keyboard switch and two calls that give back memory. The `vtgen` input generator now shrinks a failing input all the way down ([#740](https://github.com/Gaurav-Gosain/tuios/pull/740)).\n  - [tuitest](https://github.com/Gaurav-Gosain/tuitest) now uses `tuios.dev/vt` in place of its own copy of the emulator ([tuitest#8](https://github.com/Gaurav-Gosain/tuitest/pull/8)).\n- **`tuios.dev/swatch` v0.1.0** reads the colour theme of a desktop as one palette with named roles, such as background, accent and error ([#731](https://github.com/Gaurav-Gosain/tuios/pull/731), [#732](https://github.com/Gaurav-Gosain/tuios/pull/732), [#739](https://github.com/Gaurav-Gosain/tuios/pull/739)).\n  - `swatch/omarchy` reads the Omarchy theme. Its colours match the output of `omarchy-theme-color` for every shipped theme.\n  - `swatch.Watch` follows a theme and sends each new palette.\n  - `swatch/teaswatch` connects a watch to a Bubble Tea program, and follows the colours of the terminal.\n  - `swatch/termconfig` reads kitty, ghostty, alacritty and wezterm colour files. `tuios import-theme` now uses it.\n\nThe library pages are at [tuios.dev/docs/libraries](https://tuios.dev/docs/libraries).\n\n\n## Hosts\n\n- **Reconnect after sleep.** After a laptop wakes, a host link now reconnects. Before, the link stayed on a dead connection, and a click on a remote session did nothing or froze the screen ([#728](https://github.com/Gaurav-Gosain/tuios/pull/728), fixes [#720](https://github.com/Gaurav-Gosain/tuios/issues/720)).\n  - A link that carried nothing for 15 seconds sends a check to its host. Two missed answers end the link, and tuios dials again.\n  - After this machine wakes, one missed answer ends the link, and a link that waits to dial again dials at once.\n  - The first dial after a dead link opens its own ssh connection, so an ssh master that did not survive the sleep does not block it.\n- **Remote sessions open in every link state.** Each remote session on the rail is a click target. A click on a host that is up says \"Connecting to HOST\". A click on a host that is down says \"Reconnecting to HOST\", and the session opens when the link comes up. The wait ends after one minute, and tuios says why.\n\n## Sessions\n\n- **Spaces.** A space is a named group of related sessions ([#708](https://github.com/Gaurav-Gosain/tuios/pull/708), part of [#681](https://github.com/Gaurav-Gosain/tuios/issues/681)). Thanks to @abhijit-s.\n  - `tuios new NAME --space SPACE` makes a session in a space. `tuios set-session-space SPACE -s SESSION` files a session that exists. With no space, it takes the session out of its space.\n  - `tuios ls` shows one table for each space. A daemon restart keeps the space of each session.\n  - A global session cannot be in a space.\n- **Move a window to another session.** `tuios move-window --to-session NAME` moves a window and its program to another session. The program keeps running, and the scrollback stays ([#660](https://github.com/Gaurav-Gosain/tuios/pull/660)).\n  - The tmux shim's `join-pane` and `move-pane`, and herdr's `pane.move`, now move a pane to another session too.\n- **Split toward a side.** `tuios split-window left`, `right`, `up` and `down` put the new pane on that side. The tape `Split` command takes the same words ([#707](https://github.com/Gaurav-Gosain/tuios/pull/707)).\n- **Merged worktrees.** `tuios worktree ls` has a MERGED column. It shows `into <ref>` when the base of the branch holds its work. A merge commit, a fast-forward, a rebase and a squash merge all count. tuios does not fetch, and it does not remove a worktree ([#657](https://github.com/Gaurav-Gosain/tuios/pull/657)).\n- **Daemon sessions in the rail.** `[appearance.sidebar.left] session = \"NAME\"` and the same key under `right` show the panes of a daemon session in that rail, one on top of the other. You type in them as in other panes. `session_workspace` shows the rail only on one workspace. Detach does not stop the programs ([#741](https://github.com/Gaurav-Gosain/tuios/pull/741), from [#626](https://github.com/Gaurav-Gosain/tuios/pull/626)). Thanks to @drawde-nadroj.\n\n## Panes and the mouse\n\n- **Links to a window.** A program can print an OSC 8 link to `tuios://window/<id>`. A `Ctrl`+click on it goes to that window. A `tuios://window/<id>/close` link asks first, and the confirmation names the pane ([#609](https://github.com/Gaurav-Gosain/tuios/pull/609)). Thanks to @davidreuss.\n- **Page scroll and middle-click paste.** In terminal mode, `Shift+PageUp` and `Shift+PageDown` now scroll one page of the pane's history. The middle mouse button pastes from the clipboard. A program that uses the full screen or the mouse still gets these keys and the middle button. You can rebind or unbind all three in `[keybindings.terminal_mode]` ([#679](https://github.com/Gaurav-Gosain/tuios/pull/679)). Thanks to @stevegt.\n- **The drop preview.** While you drag a pane in BSP, the preview is a pane frame in the accent colour over one even tint. The text under it fades into the tint ([#705](https://github.com/Gaurav-Gosain/tuios/pull/705), [#714](https://github.com/Gaurav-Gosain/tuios/pull/714)). The preview follows the layout when it changes under a held drag ([#721](https://github.com/Gaurav-Gosain/tuios/pull/721)). Thanks to @abhijit-s.\n- **Cancel a drag.** A press of another mouse button during a pane drag now cancels the drag. Before, a right click left the pane floating over the tiles ([#713](https://github.com/Gaurav-Gosain/tuios/pull/713)).\n\n## Keys and settings\n\n- **List keys.** The new `[keybindings.lists]` section sets the keys that move the cursor in every list: the palette, the launcher, the pickers, the menus and the settings page. The actions are `list_up`, `list_down`, `list_page_up`, `list_page_down`, `list_first` and `list_last`. The defaults are the old keys ([#745](https://github.com/Gaurav-Gosain/tuios/pull/745)). Thanks to @ural89.\n- **Animation speed.** `appearance.animation_speed` sets the speed of the window animations, in percent. 200 runs them in half the time. The range is 25 to 400 ([#747](https://github.com/Gaurav-Gosain/tuios/pull/747)). Thanks to @adilw3nomad.\n\n- **Option characters on macOS.** On macOS, tuios now reads the keyboard layout at startup. On a US or ABC layout, Option+N switches the workspace as before. On any other layout, a character that the keyboard composes, such as `\u00a3` on a UK Mac or the AZERTY characters, goes to the pane as text. Before, tuios read these characters as Option key bindings. On a UK Mac, Shift+3 types `\u00a3`, and tuios switched to workspace 3. `keybindings.option_glyphs` has a new default, `auto`. See [Upgrading](#option-characters-on-macos) ([#753](https://github.com/Gaurav-Gosain/tuios/pull/753), fixes [#746](https://github.com/Gaurav-Gosain/tuios/issues/746) and [#575](https://github.com/Gaurav-Gosain/tuios/issues/575)).\n\n- **tmux-style actions.** New actions with no default key, so you can write a tmux keymap in `config.toml` ([#718](https://github.com/Gaurav-Gosain/tuios/pull/718)). Thanks to @SugarHashira.\n  - `mark_pane` marks a pane, and `join_marked_left`, `_right`, `_up` and `_down` move the marked pane next to the focused one.\n  - `resize_pane_left_5` and the other `resize_pane_*_5` and `resize_pane_*_20` actions move an edge of the pane by 5 or 20 cells.\n  - `new_workspace`, `move_workspace_left`, `move_workspace_right` and `send_to_workspace_1` to `send_to_workspace_9` work on workspaces.\n  - `reload_config` reads `config.toml` again. `toggle_mouse` lets the terminal select text. `cycle_layout` goes through BSP, master-stack and scrolling.\n- **Workspace tab style.** `[dock.tabs] style = \"flat\"` draws the workspace strip of the dock as text with a separator, as a tmux status line does. The tab format also takes `{icon}` and `{zoom}`. With no `[dock.tabs]` table the strip does not change ([#715](https://github.com/Gaurav-Gosain/tuios/pull/715)). Thanks to @SugarHashira.\n- **Dim only the background.** `appearance.dim_foreground = false` makes `dim_unfocused` dim the background of a pane you are not in, and keeps its text at full strength ([#717](https://github.com/Gaurav-Gosain/tuios/pull/717)). Thanks to @SugarHashira.\n- **A steady dock.** A clock or another component in the centre of the dock no longer moves when a notification shows, changes or goes away ([#752](https://github.com/Gaurav-Gosain/tuios/pull/752), fixes [#751](https://github.com/Gaurav-Gosain/tuios/issues/751)). Thanks to @syz51.\n\n- **A session cell in the dock.** The new `session` dock component shows the session and the position of the pane, such as `main 2:1`. `[dock.session]` and each `[dock.custom.NAME]` take colours and caps ([#716](https://github.com/Gaurav-Gosain/tuios/pull/716)). Thanks to @SugarHashira.\n\n## Terminal\n\n- **The caller's terminal.** A session that a command makes now gives its panes the `TERM` and `COLORTERM` of the terminal you ran the command in. Before, these sessions got `xterm-256color`. This holds for `tuios call new-session`, `tuios switch-session --create` ([#700](https://github.com/Gaurav-Gosain/tuios/pull/700), fixes [#697](https://github.com/Gaurav-Gosain/tuios/issues/697)), `tuios new` from an attached client ([#727](https://github.com/Gaurav-Gosain/tuios/pull/727)), `start-agent` ([#729](https://github.com/Gaurav-Gosain/tuios/pull/729)), and `new-worktree` and `fan` ([#749](https://github.com/Gaurav-Gosain/tuios/pull/749)). Thanks to @abhijit-s. See [Upgrading](#the-term-of-new-sessions).\n- **Kitty images by number.** An image that a program sends by number (`I=`) now shows. Each placement of an image stays, so one sprite can show at many places. tuios answers uploads as kitty does ([#646](https://github.com/Gaurav-Gosain/tuios/pull/646), [#651](https://github.com/Gaurav-Gosain/tuios/pull/651), fixes [#644](https://github.com/Gaurav-Gosain/tuios/issues/644)).\n- **Wide text at the edge of the screen.** A pane that the left edge of the screen cuts keeps its border in place when the cut part has CJK text or emoji ([#744](https://github.com/Gaurav-Gosain/tuios/pull/744), fixes [#743](https://github.com/Gaurav-Gosain/tuios/issues/743)).\n\n## Windows\n\n- **No kitty keyboard protocol in ConPTY panes.** A pane on Windows no longer offers the kitty keyboard protocol, because older conhost versions drop its keys. Programs such as pi and neovim then use the legacy keys, and Escape works again ([#596](https://github.com/Gaurav-Gosain/tuios/pull/596)). Thanks to @chexxor.\n\n## The rail\n\n- **A steady peek.** When the terminals section is above the sessions section, a hover on a session row no longer changes the height of the terminals section. The row under the pointer stays in place ([#699](https://github.com/Gaurav-Gosain/tuios/pull/699), fixes [#698](https://github.com/Gaurav-Gosain/tuios/issues/698)). Thanks to @abhijit-s.\n\n## Daemon verbs\n\nThese verbs and events are for scripts and for a GUI client. The protocol is in [protocol.md](https://github.com/Gaurav-Gosain/tuios/blob/main/docs/protocol.md).\n\n- `search-panes` finds text in the history and the screen of every pane. `command-history` lists the commands that shells in panes ran. `list-ports` lists the TCP ports that the programs in a pane listen on ([#666](https://github.com/Gaurav-Gosain/tuios/pull/666)).\n- Each window has `started_by`, the pane whose call made it.\n- `review-stage` stages and unstages a change by file, by hunk or by line, and each call gives an undo. `review-diff` marks the changed words ([#662](https://github.com/Gaurav-Gosain/tuios/pull/662)).\n- `file-preview` makes a preview of a file on this machine or on a host. It keeps the read rules of `file-read` ([#659](https://github.com/Gaurav-Gosain/tuios/pull/659)).\n- `set-session-space` files a session under a space. `move-window` takes `to_session`.\n- A `layout-changed` event names a workspace whose panes moved. `list-windows` marks a floating window ([#707](https://github.com/Gaurav-Gosain/tuios/pull/707)).\n- `hello` takes `term` and `color_term` ([#700](https://github.com/Gaurav-Gosain/tuios/pull/700)).\n- `tuios gui-bridge` serves a session to a native renderer over stdin and stdout. The `[keybindings.gui]` section holds its keys. The desktop app that uses it is not released yet ([#658](https://github.com/Gaurav-Gosain/tuios/pull/658), [#661](https://github.com/Gaurav-Gosain/tuios/pull/661)).\n\n## Performance and binary size\n\n- **Less memory in the daemon.** The cleanup sweep of the daemon, every 30 seconds, now frees the resize buffers of each pane, and the alternate screen of each pane that left it. That is about 1.7 MB each for a pane of 171x83. On a load of 25 panes, the first change takes the live heap from 42.3 MB to 34.9 MB, and the second from 42.3 MB to 37.0 MB ([#735](https://github.com/Gaurav-Gosain/tuios/pull/735), [#736](https://github.com/Gaurav-Gosain/tuios/pull/736)). Thanks to @abhijit-s.\n- **A faster clip.** To cut a pane of 42 rows at the left screen edge, tuios now makes 45 allocations in place of 259 ([#744](https://github.com/Gaurav-Gosain/tuios/pull/744)).\n- **Fewer wakeups while a message shows.** A client with a message on the dock now sleeps until the rule under the message changes. Before, it woke at the frame rate. Client CPU on an idle screen with a message went from 0.77% to 0.27% ([#763](https://github.com/Gaurav-Gosain/tuios/pull/763)).\n- **Binary size.** The size budget is now 36,620,000 bytes on linux/amd64 and 34,465,000 bytes on darwin/arm64. In v0.9.3 it was 35,560,000 and 33,500,000. The GUI bridge, file previews, the new verbs, the rail sessions, the Omarchy theme, the tmux-style actions and the theme transition take the difference ([#759](https://github.com/Gaurav-Gosain/tuios/pull/759)). The ceiling stays at 40 MB.\n\n## Fixes\n\n- **ssh sockets on macOS.** On macOS, tuios refused every ssh socket under `/var`, because `/var` is a symlink there. A split of a pane that runs ssh, and the SSH agent of a pane, can use these sockets again ([#617](https://github.com/Gaurav-Gosain/tuios/pull/617), fixes [#615](https://github.com/Gaurav-Gosain/tuios/issues/615)). Thanks to @abhijit-s.\n- **Theme reload.** A config reload that removes the `theme` line now puts the default theme back ([#734](https://github.com/Gaurav-Gosain/tuios/pull/734)).\n- **Settings from config.toml in the daemon.** `tuios get-config`, `list-themes`, `list-glyphs` and the screenshot settings of the daemon now read `config.toml`. Before, they gave the built-in default for a key that only `config.toml` set. A `set-config` value still wins. A call over a host link does not read the file. On Omarchy with no theme set, they report `omarchy` ([#758](https://github.com/Gaurav-Gosain/tuios/pull/758)).\n- **A split that is too small.** In BSP, tuios refuses a split that leaves a pane smaller than 20 columns by 5 rows, and says why ([#658](https://github.com/Gaurav-Gosain/tuios/pull/658)).\n\n## Maintenance\n\n- The release workflow uses goreleaser-action 7.3.0 ([#754](https://github.com/Gaurav-Gosain/tuios/pull/754)).\n\n## Upgrading\n\n### The daemon\n\nThe daemon protocol did not change, so a v0.9.3 daemon works with a v0.10.0 client, and the reverse. The new fields are optional in both directions. The sleep reconnect, the theme colours in panes, spaces, window moves and the memory fixes are in the daemon. To get them, restart the daemon:\n\n```bash\ntuios kill-server\n```\n\nThis closes every pane in every session, so save your work first.\n\n### The theme on Omarchy\n\nOn a machine with Omarchy, an empty `appearance.theme` now means the Omarchy theme. Before, it meant the colours of your terminal. To keep the colours of your terminal, set:\n\n```toml\n[appearance]\ntheme = \"none\"\n```\n\nA machine without Omarchy does not change. A theme that you set does not change.\n\n### Theme colours in daemon panes\n\nA program in a daemon pane now gets the theme's colours from OSC 10, 11 and 4. A program that picks a light or a dark look from the background can change its look after the update. With no theme set, nothing changes.\n\n### The TERM of new sessions\n\nA session made by `tuios call new-session`, `tuios switch-session --create`, an attached `tuios new`, `start-agent`, `new-worktree` or `fan` now gets your `TERM` and `COLORTERM`. Before, it got `xterm-256color`. tuios gives a pane your `TERM` only when the machine that runs the pane has a terminfo entry for it. Otherwise the pane gets `xterm-256color`, as before. A program in the pane that runs `ssh` to a machine with no entry for your `TERM` can show wrong keys or colours there. Install the entry on that machine, for example with `infocmp -x xterm-kitty | ssh HOST tic -x -`. The SSH server, `tuios-web` and the GUI bridge do not send a `TERM`. Their sessions still get `xterm-256color`.\n\n### Terminal mode keys\n\n`Shift+PageUp` and `Shift+PageDown` now scroll the pane's history, and the middle mouse button pastes from the clipboard. A program that uses the full screen or the mouse still gets them. To give the keys and the button back to every program, remove them from the bindings:\n\n```toml\n[keybindings.terminal_mode]\nterminal_scroll_page_up = []\nterminal_scroll_page_down = []\nterminal_paste_host = [\"ctrl+shift+v\", \"super+v\", \"shift+super+v\"]\n```\n\n### Option characters on macOS\n\nThis is a change in behaviour on a keyboard layout other than US. `keybindings.option_glyphs` now defaults to `auto`. On macOS, tuios reads the keyboard layout when it starts:\n\n- On a US or ABC layout, nothing changes. Option+N switches the workspace.\n- On any other layout, such as UK or AZERTY, a character that the keyboard composes, such as `\u00a3` or `\u00a9`, goes to the pane as text. In Terminal.app and iTerm2 as they ship, Option+N then types its character. It does not switch the workspace.\n\n`keyboard_layout` in `[keybindings]` overrides the layout that tuios reads. To get the Option bindings on any layout, set the Option key of the terminal to send Alt. In Terminal.app, tick \"Use Option as Meta Key\". In iTerm2, set the Option key to \"Esc+\". To keep the old behaviour, set `option_glyphs = \"bind\"`. Ghostty, and kitty with the kitty keyboard protocol, report Alt, so they do not change.\n\n### New config keys\n\nThe defaults keep the old behaviour. The `session` lines are examples.\n\n```toml\n[appearance]\nanimation_speed = 100            # 25 to 400, 0 is 100\ndim_foreground = true            # false dims only the background\ntheme_transition = \"none\"        # none, circle, fade\ntheme_transition_duration = 450  # milliseconds, 100 to 2000\n\n[appearance.sidebar.left]\nsession = \"side-left\"            # a daemon session to show in this rail\nsession_workspace = 0            # 0 is every workspace, or 1 to 9\n\n[appearance.sidebar.right]\nsession = \"side-right\"\nsession_workspace = 0\n\n[keybindings.lists]\nlist_up = [\"up\", \"ctrl+p\", \"k\"]\nlist_down = [\"down\", \"ctrl+n\", \"j\"]\nlist_page_up = [\"pgup\"]\nlist_page_down = [\"pgdown\"]\nlist_first = [\"home\", \"g\"]\nlist_last = [\"end\", \"G\"]\n\n[keybindings.terminal_mode]\nterminal_scroll_page_up = [\"shift+pgup\"]\nterminal_scroll_page_down = [\"shift+pgdown\"]\n\n[dock.tabs]\nstyle = \"pill\"                   # pill, flat\n\n[dock.session]\nformat = \"{session} {workspace}:{pane}\"   # add \"session\" to a [dock] list to draw it\n```\n\n`[dock.tabs]` also takes `separator`, `separator_fg`, the `active_` and `inactive_` colours, `number_glyphs`, `zoom_marker` and `show_add`. The tmux-style actions have no default key.\n\n`appearance.theme` also takes `omarchy`, `omarchy/NAME`, `charmtone` and `charmtone-light`. See [CONFIGURATION.md](https://github.com/Gaurav-Gosain/tuios/blob/main/docs/CONFIGURATION.md).\n\n### For developers\n\n- `tuios.dev/vt` needs Go 1.26. `tuios.dev/swatch` needs Go 1.25. tuios itself still builds with the Go version in `go.mod`.\n- The emulator moved from `internal/vt` to `vt/`, the `tuios.dev/vt` module. The snapshot of a terminal moved to `tuios.dev/vt/snapshot` ([#724](https://github.com/Gaurav-Gosain/tuios/pull/724)). `go.work` holds the app, `progstatus`, `vt` and `swatch`. To build tuios as `go install` does, use `GOWORK=off`.\n- The binary size budgets went up in commits of their own. See `docs/perf.md`.\n\n## Contributors\n\nThank you to everyone who sent a pull request for this release:\n\n- @abhijit-s: spaces ([#708](https://github.com/Gaurav-Gosain/tuios/pull/708)), the caller's terminal for new sessions ([#700](https://github.com/Gaurav-Gosain/tuios/pull/700), [#729](https://github.com/Gaurav-Gosain/tuios/pull/729)), less memory in the daemon ([#735](https://github.com/Gaurav-Gosain/tuios/pull/735), [#736](https://github.com/Gaurav-Gosain/tuios/pull/736)), the drop zone under a held drag ([#721](https://github.com/Gaurav-Gosain/tuios/pull/721)), the steady peek ([#699](https://github.com/Gaurav-Gosain/tuios/pull/699)) and the ssh sockets on macOS ([#617](https://github.com/Gaurav-Gosain/tuios/pull/617)), and the terminal for worktree sessions ([#749](https://github.com/Gaurav-Gosain/tuios/pull/749))\n- @SugarHashira: tmux-style actions ([#718](https://github.com/Gaurav-Gosain/tuios/pull/718)), the workspace tab style ([#715](https://github.com/Gaurav-Gosain/tuios/pull/715)) `dim_foreground` ([#717](https://github.com/Gaurav-Gosain/tuios/pull/717)) and the session cell in the dock ([#716](https://github.com/Gaurav-Gosain/tuios/pull/716))\n- @drawde-nadroj: daemon sessions in the rail ([#626](https://github.com/Gaurav-Gosain/tuios/pull/626))\n- @davidreuss: links to a window ([#609](https://github.com/Gaurav-Gosain/tuios/pull/609))\n- @stevegt: page scroll and middle-click paste ([#679](https://github.com/Gaurav-Gosain/tuios/pull/679))\n- @chexxor: the kitty keyboard protocol in ConPTY panes ([#596](https://github.com/Gaurav-Gosain/tuios/pull/596))\n- @ural89: list keys ([#745](https://github.com/Gaurav-Gosain/tuios/pull/745))\n- @adilw3nomad: animation speed ([#747](https://github.com/Gaurav-Gosain/tuios/pull/747))\n- @syz51: the steady dock ([#752](https://github.com/Gaurav-Gosain/tuios/pull/752))\n- @LeeSamuel14: the config command in its own file ([#677](https://github.com/Gaurav-Gosain/tuios/pull/677))\n\nAnd thanks to everyone who reported bugs and asked for features: @Brookke for the \u00a3 key and its analysis ([#746](https://github.com/Gaurav-Gosain/tuios/issues/746)), @florian-guily for the AZERTY keys ([#575](https://github.com/Gaurav-Gosain/tuios/issues/575)), @syz51 for the dock clock ([#751](https://github.com/Gaurav-Gosain/tuios/issues/751)), @fonnesbeck for the reconnect after sleep ([#720](https://github.com/Gaurav-Gosain/tuios/issues/720)), @pshickeydev for the kitty images ([#644](https://github.com/Gaurav-Gosain/tuios/issues/644)), @lost-melody for the wide text at the screen edge ([#743](https://github.com/Gaurav-Gosain/tuios/issues/743)), @abhi-easygo for the ssh sockets on macOS ([#615](https://github.com/Gaurav-Gosain/tuios/issues/615)), and @abhijit-s for spaces ([#681](https://github.com/Gaurav-Gosain/tuios/issues/681)), the `TERM` of new sessions ([#697](https://github.com/Gaurav-Gosain/tuios/issues/697)) and the rail peek ([#698](https://github.com/Gaurav-Gosain/tuios/issues/698)).\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.9.3...v0.10.0\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.9.3...v0.10.0\n\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":16}
