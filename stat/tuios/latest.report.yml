b-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10987964,"digest":"sha256:6d60823b7bbb4fd558e1fb4ccfe1b7693a1ab3d82d0876aa449a0dbac6c03836","download_count":1,"created_at":"2026-10-02T06:02:42Z","updated_at":"2026-10-02T06:02:43Z"},{"id":604937585,"node_id":"RA_kwDOPrEI7s4kDp1x","name":"tuios_0.8.5_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10680541,"digest":"sha256:7b95612bfbfa4f35198c1fab0ff97e35f717f874443eb87d3ad9b13bc57dbfb4","download_count":3,"created_at":"2026-10-02T06:02:45Z","updated_at":"2026-10-02T06:02:45Z"},{"id":604937641,"node_id":"RA_kwDOPrEI7s4kDp2p","name":"tuios_0.8.5_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11119622,"digest":"sha256:94275e32d1712d800c9c628bd5969f684d77084b8d23b0930f554baa4033e743","download_count":104,"created_at":"2026-10-02T06:02:46Z","updated_at":"2026-10-02T06:02:47Z"}],"body":"tuios 0.8.5 makes tiling more configurable and lets herdr plugins run in a tuios pane. It adds a tmux-style size policy for sessions with more than one client. Scrollback keeps its text when you resize a pane. The sidebar files list follows the disk and panes on other machines.\n\nBefore you upgrade, read [Breaking changes and migration](#breaking-changes-and-migration). The pure Go emulator now reflows lines when a pane changes width.\n\nThe full list is at [tuios.dev/releases](https://tuios.dev/releases).\n\n## Install\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.8.5\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.8.5\n```\n\nA binary installed by the script or from an archive updates with `tuios update`.\n\n## New features\n\n- **Master position.** The master pane can be on the left, right, top or bottom, or in the center ([#325](https://github.com/Gaurav-Gosain/tuios/pull/325)). With `center`, the other panes go to the right and to the left in turn. This closes [#321](https://github.com/Gaurav-Gosain/tuios/issues/321).\n  - `appearance.master_position` sets the side. `appearance.master_count` sets how many master panes there are (1 to 9).\n  - In the layout prefix (`Ctrl+B L`):\n    - `o` moves the master to the next side.\n    - `Enter` swaps the focused pane with the master.\n    - `m` focuses the master.\n    - `i` and `d` add and remove a master.\n  - `tuios set-layout --master-position center --masters 2` changes the current workspace.\n  - Each workspace keeps its own side and count, also after a daemon restart.\n- **herdr plugins.** In a pane, herdr's command line now answers through tuios ([#328](https://github.com/Gaurav-Gosain/tuios/pull/328)).\n  - terminal-browser, terminal-code and the Vim navigation plugins work in a tuios pane.\n  - The herdr socket answers 8 more methods: `pane.process_info`, `pane.focus_direction`, `pane.neighbor`, `pane.edges`, `pane.swap`, `pane.zoom`, `workspace.focus` and `agent.start`.\n  - Every pane gets `HERDR_TAB_ID`.\n  - Each method is held to the grants of the pane that calls it. `pane.process_info` shows the command line and folder only to a pane that has `write`.\n- **Session size.** `[daemon] window_size` sets the size of a session that has more than one client ([#330](https://github.com/Gaurav-Gosain/tuios/pull/330)). The values are the values of tmux's `window-size` option.\n  - `smallest` (the default) works as before.\n  - `largest` uses the biggest client.\n  - `latest` follows the client you typed in last.\n  - A client smaller than the session shows the part of the session around the cursor. A mark on the line above the dock says so.\n  - `tuios set-config daemon.window_size latest -s NAME` changes a running session.\n  - A read-only `tuios-web` viewer does not set the size under `largest` or `latest`.\n- **Subagents.** A Claude Code agent's rail row shows how many subagents it runs, for example `3 subagents` ([#307](https://github.com/Gaurav-Gosain/tuios/pull/307)). Thanks to @JakeChop.\n\n## Fixes\n\n- **Scrollback and resize.** Text no longer gets lost when a pane changes size ([#331](https://github.com/Gaurav-Gosain/tuios/pull/331), [#333](https://github.com/Gaurav-Gosain/tuios/pull/333), [#323](https://github.com/Gaurav-Gosain/tuios/pull/323)).\n  - A narrower pane keeps the end of each line, and a wider pane shows it again.\n  - A shorter pane keeps the text below the cursor and the prompt under a full-screen program.\n  - A scroll region moves its rows to history.\n  - Wide characters stay in history.\n  - A daemon restart keeps history rows that are wider than the pane.\n- **Files list.** The sidebar files list now updates when a file is added, removed or renamed ([#319](https://github.com/Gaurav-Gosain/tuios/pull/319), [#327](https://github.com/Gaurav-Gosain/tuios/pull/327)). This closes [#313](https://github.com/Gaurav-Gosain/tuios/issues/313).\n  - A pane on another machine updates its list when you `cd`, and when files change on that machine.\n  - In a pane that runs `ssh`, the files section says that the shell is on the other machine.\n  - Nothing polls. An idle session stays idle.\n- **New windows in BSP.** A new window now splits the focused pane, on the preselected side when you set one ([#349](https://github.com/Gaurav-Gosain/tuios/pull/349)). Before, it always split the last pane, which is the bottom-right one. This answers discussion [#347](https://github.com/Gaurav-Gosain/tuios/discussions/347).\n  - A preselection now works in daemon sessions too.\n  - `longest_side` reads the size of the pane it splits.\n- **Zoom in the scrolling layout.** Moving to the next column while zoomed no longer shows a gap during the slide ([#324](https://github.com/Gaurav-Gosain/tuios/pull/324)).\n- **Log viewer.** The log viewer opens on the newest entry and scrolls to the last entry it draws ([#329](https://github.com/Gaurav-Gosain/tuios/pull/329)). Thanks to @davidreuss.\n- **install.sh on the BSDs.** `install.sh` downloads the right archive on FreeBSD and OpenBSD ([#322](https://github.com/Gaurav-Gosain/tuios/pull/322)). Thanks to @fdoving.\n- **herdr events.** A client that subscribes and then acts at once now gets the event ([#326](https://github.com/Gaurav-Gosain/tuios/pull/326)).\n- **Kitty images.** An image in a pane started with `new-window -- prog` no longer disappears when the session state syncs ([#343](https://github.com/Gaurav-Gosain/tuios/pull/343)).\n- **Speed.**\n  - The terminal emulator reads kitty and sixel image data about 15 times faster ([#338](https://github.com/Gaurav-Gosain/tuios/pull/338)).\n  - A cropped pane draws about three times faster, and a folder that changes often causes fewer sidebar redraws ([#335](https://github.com/Gaurav-Gosain/tuios/pull/335)).\n\n## Breaking changes and migration\n\n### Reflow\n\n- The pure Go emulator now rewraps the lines on the screen when a pane changes width, as kitty, ghostty and tmux do. Older history keeps the width it was written at.\n- On the pure Go emulator, a full-width prompt that is not marked with OSC 133 leaves one extra row each time the pane gets narrower. The ghostty emulator already did this. To stop it, mark the prompt with OSC 133. See the shell recipes in `tuios doctor`.\n\n### herdr\n\n- `HERDR_BIN_PATH` in a pane now names a link to tuios that answers herdr's command line. Before, it named the tuios binary.\n- A herdr plugin that calls `$HERDR_BIN_PATH` now reaches tuios. To run the real herdr inside a tuios pane, set `[agents] herdr_protocol = \"agents\"` as before.\n\n### Layout keys\n\n- `o`, `Enter`, `m`, `i` and `d` in the layout prefix are new defaults. If your `[keybindings.layout_prefix]` already binds one of these keys, your binding wins.\n\n### Claude Code subagents\n\n- The subagent count needs version 3 of the Claude Code integration. Run `tuios integration status`. If it reports the integration as out of date, run:\n\n  ```bash\n  tuios integration install claude-code\n  ```\n\n### Mixed versions\n\n- The session size policy, the herdr command front, the files list for panes on other machines, the subagent count and master positions need a v0.8.5 daemon. To start a v0.8.5 daemon, run `tuios kill-server` after the upgrade. This closes every pane in every session, so save your work first.\n- An older client in a session under `latest` or `largest` makes the session use `smallest` until it leaves.\n\n## Contributors\n\nThank you to everyone who sent a pull request for this release:\n\n- @JakeChop: subagent count on the rail ([#307](https://github.com/Gaurav-Gosain/tuios/pull/307))\n- @davidreuss: log viewer scroll ([#329](https://github.com/Gaurav-Gosain/tuios/pull/329))\n- @fdoving: install.sh on FreeBSD and OpenBSD ([#322](https://github.com/Gaurav-Gosain/tuios/pull/322))\n\nThanks to @adamcstephens for the master position request ([#321](https://github.com/Gaurav-Gosain/tuios/issues/321)), and to @LovesAsuna for the files list reports ([#313](https://github.com/Gaurav-Gosain/tuios/issues/313)) and the BSP report ([#347](https://github.com/Gaurav-Gosain/tuios/discussions/347)).\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.8.4...v0.8.5\n\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
