[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":13163975,"digest":"sha256:1e6a8c03ec71228fecd9b3c09bd1b2e9c961d7f1e4dab02ffeff1ae75c4e2aad","download_count":0,"created_at":"2026-10-08T15:58:14Z","updated_at":"2026-10-08T15:58:15Z"},{"id":622295874,"node_id":"RA_kwDOPrEI7s4lF3tC","name":"tuios_0.9.1_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":12741013,"digest":"sha256:d480a9a7c0a7786a2eef03865ccb3266a7fdcad1f5b32d42de0b6aa1a473e5f4","download_count":2,"created_at":"2026-10-08T15:58:18Z","updated_at":"2026-10-08T15:58:19Z"},{"id":622295808,"node_id":"RA_kwDOPrEI7s4lF3sA","name":"tuios_0.9.1_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":13320044,"digest":"sha256:c22746f6072e98e081a16d11446237679bc38fa0b1bdc641b8c1dd6bb6a6076e","download_count":39,"created_at":"2026-10-08T15:58:17Z","updated_at":"2026-10-08T15:58:18Z"}],"body":"tuios 0.9.1 is a fix release. It fixes a daemon crash on agent transcripts, races in the daemon's client state, a scrollback line that broke after a reattach, and a theme from a config file that missed the panes.\nIt also moves tuios-web to sip v0.8.5, which blocks DNS rebinding and caps the size of a browser window.\n\nThe full list is at [tuios.dev/releases](https://tuios.dev/releases).\n\n## Install\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.9.1\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.9.1\n```\n\nA binary installed by the script or from an archive updates with `tuios update`.\n\n## Fixes\n\n- **Daemon crash on transcripts.** Two reads of one agent transcript at the same time could crash the daemon and close every pane. The reads now run one at a time ([#574](https://github.com/Gaurav-Gosain/tuios/pull/574)). Thanks to @Guipegoraro.\n- **Client state order.** With more than one client on a session, a client could get an older state after a newer one. It could then go back to an old workspace, or move the session back for every client ([#561](https://github.com/Gaurav-Gosain/tuios/pull/561), [#565](https://github.com/Gaurav-Gosain/tuios/pull/565)).\n  - The repair that an attaching client gets now comes in order with the other states.\n  - A push from one client reaches the other clients in order, also when two clients push at once.\n  - The reply to a push no longer overtakes a state that is already queued for that client.\n- **Reattach.** A line that wrapped at the last column could break in the scrollback after a reattach. Every character after the wrap was one column out. The pane snapshot now carries the pending wrap ([#571](https://github.com/Gaurav-Gosain/tuios/pull/571)).\n- **Origin mode on the ghostty build.** A restored cursor under DECOM with left and right margins no longer moves too far right ([#571](https://github.com/Gaurav-Gosain/tuios/pull/571)).\n- **Themes from a config file.** A theme saved in config.toml, an included file or a config.d file now recolours the panes. Before, only the borders changed until you used the theme picker ([#569](https://github.com/Gaurav-Gosain/tuios/pull/569)).\n- **Screensaver speed.** The screensaver and the effect preview paint at 60 fps at most. At `max_fps` 240 the effects ran four times too fast and used four times the CPU ([#563](https://github.com/Gaurav-Gosain/tuios/pull/563)).\n- **No false config problem in the browser.** A tuios-web client no longer shows \"1 config problem\" when the config does not set `notify`. A setting that a client cannot carry out is now a notice in the log viewer ([#572](https://github.com/Gaurav-Gosain/tuios/pull/572)).\n- **Kitty keys in tuios-web.** Escape and Ctrl+C reach tuios with the kitty keyboard protocol. This comes with sip v0.8.4 ([#570](https://github.com/Gaurav-Gosain/tuios/pull/570)).\n- **Libraries.** tuiffects v0.7.1 removes control bytes from effect input and writes smaller frames. tuitest v0.1.0 makes the e2e suite recover from emulator panics ([#570](https://github.com/Gaurav-Gosain/tuios/pull/570)).\n- **CLI code.** The root and ssh commands are in their own files. The CLI works as before ([#568](https://github.com/Gaurav-Gosain/tuios/pull/568)). Thanks to @LeeSamuel14.\n- **Browser tests in CI.** The Playwright tests for tuios-web run on pull requests and every night ([#572](https://github.com/Gaurav-Gosain/tuios/pull/572)).\n\n## Security\n\n- **DNS rebinding.** tuios-web uses sip v0.8.5, which checks the Host header on a loopback bind. `--allow-host` adds names to that check ([#573](https://github.com/Gaurav-Gosain/tuios/pull/573)).\n- **Frames.** tuios-web sends `frame-ancestors 'self'` and `X-Frame-Options`. A page on another site cannot put tuios-web in a frame.\n- **Window size.** One browser could ask tuios-web for about 22 GB of memory with a large window. tuios-web now clamps every window to 1200 columns, 500 rows and 250000 cells ([#563](https://github.com/Gaurav-Gosain/tuios/pull/563), [#573](https://github.com/Gaurav-Gosain/tuios/pull/573)).\n\n## Upgrading\n\n### The daemon\n\nThe daemon protocol did not change, so a v0.9.0 daemon works with a v0.9.1 client. The transcript crash, state order and reattach fixes are in the daemon. To get them, restart the daemon:\n\n```bash\ntuios kill-server\n```\n\nThis closes every pane in every session, so save your work first.\n\n### tuios-web\n\n- **`--allow-host '*'` is refused.** Give `--allow-host` a host name, such as `term.example.com`. tuios-web does not start with `*`.\n- **Windows are clamped.** A browser window gets 1200 columns, 500 rows and 250000 cells at most. A window that is 1200 columns wide gets 208 rows. tuios-web clamps a larger window and keeps the session.\n\n## Contributors\n\nThank you to everyone who sent a pull request for this release:\n\n- @Guipegoraro: the transcript read crash fix ([#574](https://github.com/Gaurav-Gosain/tuios/pull/574))\n- @LeeSamuel14: the root and ssh command files ([#568](https://github.com/Gaurav-Gosain/tuios/pull/568))\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.9.0...v0.9.1\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.9.0...v0.9.1\n\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0},"mentions_count":2}
