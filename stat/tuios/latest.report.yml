ain)\r\n* c35f45845d059e1c99f1b328501c59ae3ec1fa72: fix: shifted printable keys send text directly, not CSI u (@Gaurav-Gosain)\r\n* 72de5adf2eb7cba7e632c2f81c233d3ab1f67ca8: fix: sixel X position off by 1 + remove debug logging (@Gaurav-Gosain)\r\n* 059d67977d690ea0d5bb9ac7665efdcc6eecafca: fix: sixel passthrough writes directly at correct host position (@Gaurav-Gosain)\r\n* 6c519eb38394ff3ba026782aa9719b170d9abe5a: fix: sixel position hardcode +1 border offset instead of BorderOffset() (@Gaurav-Gosain)\r\n* d96c05f8433001c488956c5286e8f4bebedcbf5d: fix: sixel positioning uses BorderOffset + screen bottom bounds check (@Gaurav-Gosain)\r\n* 68008da85ebf3f12361d5303291657940f764f37: fix: sixel writes directly to /dev/tty to avoid buffer fragmentation (@Gaurav-Gosain)\r\n* 6c1700964b6110a9a952c3aa360d31c548108e85: fix: skip sixel images that extend past window or screen bounds (@Gaurav-Gosain)\r\n* b9b89e7b8fe94c991a9ed2e6acc8ed7e4be305fa: fix: stale content in unfocused windows and focus switch latency (@Gaurav-Gosain)\r\n* 13c611f761b0cb3190e357f18b20dc2175540cdc: fix: staticcheck SA4006 unused value in tick rate selection (@Gaurav-Gosain)\r\n* 19e3ecf1da0dd3c51ecae891f958a822c21f6f85: fix: stream kitty graphics chunks directly to host for video playback (@Gaurav-Gosain)\r\n* 6e8df0af60575361e78ef15e994a742667f31566: fix: sync daemon PTY dimensions on session reattach (@Gaurav-Gosain)\r\n* f186c63166ae3ff0b37acf9c749ef0a1bfaaf967: fix: tape script Enter command send CRLF instead of LF in Windows (@dodorz)\r\n* 6e1eee45f41b59c10ea03c03b4d329d68f11a4e3: fix: text sizing dedup includes cursorX and scrollback to prevent silent drops (@Gaurav-Gosain)\r\n* ae1bf203784712e3bd06c3ef6afea0bbd1cc2216: fix: tiled window content rendering \u2014 use content directly without lipgloss size wrapper (@Gaurav-Gosain)\r\n* 81e9183cc3563a80cf185b40e16c16f46e734572: fix: update Dockerfile to Go 1.25 (matches go.mod) (@Gaurav-Gosain)\r\n* c85ab472eed4206cf3c806571ce621cab740ef98: fix: us