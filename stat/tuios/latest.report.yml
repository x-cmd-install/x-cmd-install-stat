ot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10771889,"digest":"sha256:846b147710d29776de1223f512d44188d19d037eced38dab2e63af9e1d7b8c50","download_count":0,"created_at":"2026-10-01T12:14:48Z","updated_at":"2026-10-01T12:14:49Z"},{"id":603195173,"node_id":"RA_kwDOPrEI7s4j9Acl","name":"tuios_0.8.4_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10477374,"digest":"sha256:581eedc8e7454d8a581628be755a3ddc53261d29c5ee8b40f96885f92cc1d1f3","download_count":2,"created_at":"2026-10-01T12:14:47Z","updated_at":"2026-10-01T12:14:47Z"},{"id":603195080,"node_id":"RA_kwDOPrEI7s4j9AbI","name":"tuios_0.8.4_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10907519,"digest":"sha256:525b348f25fb7385ecd8506edeed116f051bd7b1224d41de626a4b3325a59646","download_count":21,"created_at":"2026-10-01T12:14:44Z","updated_at":"2026-10-01T12:14:46Z"}],"body":"tuios 0.8.4 is a fix release. It repairs the default mode of `tuios xpanes` and removes more invisible characters from untrusted text. It also fixes the Homebrew cask warning and a race in the herdr socket.\n\nThe full list is at [tuios.dev/releases](https://tuios.dev/releases).\n\n## Install\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.8.4\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.8.4\n```\n\nA binary installed by the script or from an archive updates with `tuios update`.\n\n## Fixes\n\n- **xpanes.** In v0.8.3, `tuios xpanes` with no `-s` typed every command into the first pane, and no command ran ([#310](https://github.com/Gaurav-Gosain/tuios/pull/310)).\n  - Each command now goes to its own pane.\n  - tuios waits for the shell prompt of the pane before it types the command.\n  - With `-ss`, a pane closes when its command ends, also when no client is attached.\n- **Untrusted text.** The untrusted content fence removes every invisible character ([#314](https://github.com/Gaurav-Gosain/tuios/pull/314)).\n  - This adds the line and paragraph separators, the soft hyphen, the tag characters, the variation selectors and the other format characters.\n  - A line or paragraph separator becomes a line break.\n  - A zero-width joiner stays only between two emoji.\n  - Mail, replies, captures from a host, notifications, agent titles and approval lines use the same rule.\n- **herdr socket.** A caller over the connection limit gets a `rate_limited` answer. Before, its write sometimes failed with a broken pipe ([#315](https://github.com/Gaurav-Gosain/tuios/pull/315)).\n- **Pane capture.** Two waits on one pane no longer race when they read its screen ([#315](https://github.com/Gaurav-Gosain/tuios/pull/315)).\n- **Homebrew.** The casks use `postflight_steps`. Homebrew no longer shows a deprecation warning on install or upgrade ([#311](https://github.com/Gaurav-Gosain/tuios/pull/311)).\n\n## Upgrade\n\nThe fixes to `-ss`, the fence and the herdr socket are in the daemon. To start a v0.8.4 daemon, run `tuios kill-server` after the upgrade. This closes every pane in every session, so save your work first.\n\n## Thanks\n\nThanks to @Gsirawan for reporting the invisible characters that passed the fence ([#312](https://github.com/Gaurav-Gosain/tuios/pull/312)).\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.8.3...v0.8.4\n\n","mentions_count":1}
