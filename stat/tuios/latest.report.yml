8b0f3fbfda309f56b8f7363dcba1356716988eb2218a6e5e6de10e9c30","download_count":5,"created_at":"2026-10-31T12:22:25Z","updated_at":"2026-10-31T12:22:26Z"},{"id":695315205,"node_id":"RA_kwDOPrEI7s4pcasF","name":"tuios_0.12.1_Openbsd_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":18637963,"digest":"sha256:4ba70fdb73e7d3dd2c455d12c844d661e4f9434afabeff6d519686ccf902d4b8","download_count":5,"created_at":"2026-10-31T12:22:24Z","updated_at":"2026-10-31T12:22:25Z"},{"id":695315133,"node_id":"RA_kwDOPrEI7s4pcaq9","name":"tuios_0.12.1_Openbsd_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":19875736,"digest":"sha256:f6c0edf95b2ffd74cd04aa6b91c988085ac09df823ab7ac34e46a28da8f1c36b","download_count":5,"created_at":"2026-10-31T12:22:23Z","updated_at":"2026-10-31T12:22:24Z"},{"id":695315051,"node_id":"RA_kwDOPrEI7s4pcapr","name":"tuios_0.12.1_Windows_i386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":19212701,"digest":"sha256:b3d4805fb1ce607acc00900cc187ae5a5e35ebdf3aac18d8327fd64616a2e135","download_count":8,"created_at":"2026-10-31T12:22:21Z","updated_at":"2026-10-31T12:22:22Z"},{"id":695315185,"node_id":"RA_kwDOPrEI7s4pcarx","name":"tuios_0.12.1_Windows_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":20074120,"digest":"sha256:7f0a782183897773fae6308df6be7213df126fd7ecd534c7d84747e745ffdfcd","download_count":217,"created_at":"2026-10-31T12:22:24Z","updated_at":"2026-10-31T12:22:26Z"}],"body":"tuios 0.12.1 fixes a crash on the task board and makes right-click Preview work from any pane. The rail now shows the names your agents set. The drop preview is now only a frame by default.\n\n## Install\n\n```bash\nbrew install tuios                     # Homebrew (macOS, Linux)\nyay -S tuios-bin                       # AUR (tuios-web-bin for the web server)\nnix run github:Gaurav-Gosain/tuios     # Nix\ncurl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash\ngo install github.com/Gaurav-Gosain/tuios/cmd/tuios@v0.12.1\ndocker run -it --rm ghcr.io/gaurav-gosain/tuios:v0.12.1\n```\n\nA binary installed by the script or from an archive updates with `tuios update`. Then run `tuios restart-server` to move the daemon to the new build. The restart stops the programs in your panes. Each session comes back with its layout, its pane history and new shells.\n\n## Before you upgrade\n\n- **The drop preview is only a frame.** While you drag a pane in BSP, the preview now draws a frame with no tint inside. Set `appearance.drop_preview = \"fill\"` to get the tint back ([#1408](https://github.com/Gaurav-Gosain/tuios/pull/1408)).\n- **A correction to the v0.12.0 notes.** `tuios restart-server` does not apply the SSH fix from v0.12.0, because the limits are in the `tuios ssh` process. If you run `tuios ssh` where other people can reach it, restart that process too ([#1392](https://github.com/Gaurav-Gosain/tuios/pull/1392)).\n\n## Fixes\n\n- The task board no longer crashes when the selection reaches the folded Done heading ([#1409](https://github.com/Gaurav-Gosain/tuios/pull/1409)).\n- Right-click a file and pick Preview now works from any focus. In v0.12.0 the preview closed at once unless the rail had the keyboard and its cursor was on a file ([#1387](https://github.com/Gaurav-Gosain/tuios/pull/1387)).\n- `next_session`, `prev_session` and `switch_session_N` now follow the order of the rail's rows, and the number beside a row is the key that opens it. Thanks to @zerone0x, and to @maciej-lech for the report ([#1300](https://github.com/Gaurav-Gosain/tuios/pull/1300)).\n- The sessions section scrolls to a new or switched-to session when the list is grouped. Thanks to @maciej-lech for the report ([#1401](https://github.com/Gaurav-Gosain/tuios/pull/1401)).\n- The `files` control in the rail's footer now opens the files section when `appearance.sidebar.sections` leaves it out. You can keep the section hidden by default and open it when you need it. Thanks to @maciej-lech for the report ([#1407](https://github.com/Gaurav-Gosain/tuios/pull/1407)).\n- Two data races are gone: one on a pane's folder report and one on `OS.SetTheme` ([#1402](https://github.com/Gaurav-Gosain/tuios/pull/1402), [#1403](https://github.com/Gaurav-Gosain/tuios/pull/1403)).\n\n## New\n\n- **Agent names in the rail.** A row now shows the title that an agent set, such as the name from `claude -n` or `/rename`. A custom name still comes first. When several agents show only the program, each row has a suffix that stays with its pane. Thanks to @zoneblaze for the report and the first proposal ([#1388](https://github.com/Gaurav-Gosain/tuios/pull/1388)).\n- **Open a review on the file list.** Set `[review] focus = \"files\"`. Thanks to @maciej-lech ([#1378](https://github.com/Gaurav-Gosain/tuios/pull/1378)).\n- **More surfaces follow your look.** With `appearance.pane_overlays` on, the plugin approval dialog, the scrollback browser and the copy-mode search bar take the pane look. The scrollback browser and its help modal also follow `appearance.border_style`. Thanks to @abhijit-s ([#1096](https://github.com/Gaurav-Gosain/tuios/pull/1096), [#1108](https://github.com/Gaurav-Gosain/tuios/pull/1108)).\n- **Windows.** A pane opens on the `conpty.dll` and `OpenConsole.exe` beside `tuios.exe` when both files are there. With them, a pane's sixel images reach tuios. Without them, nothing changes. Thanks to @badmagick329 ([#1389](https://github.com/Gaurav-Gosain/tuios/pull/1389)).\n- **For the apps.** The new `list-routes` verb gives the addresses a phone can reach this machine on, and `queue-prompt` takes a `client_id`, so a resend queues once ([#1380](https://github.com/Gaurav-Gosain/tuios/pull/1380), [#1379](https://github.com/Gaurav-Gosain/tuios/pull/1379)). The GUI bridge reports the queue, the draft and the shelf, and it can read an agent's transcript ([#1377](https://github.com/Gaurav-Gosain/tuios/pull/1377)).\n\n## Development\n\n- The macOS development checks pass. Thanks to @syz51 ([#1394](https://github.com/Gaurav-Gosain/tuios/pull/1394)).\n- Several tests that failed in the nightly race run no longer give false failures ([#1404](https://github.com/Gaurav-Gosain/tuios/pull/1404), [#1405](https://github.com/Gaurav-Gosain/tuios/pull/1405), [#1406](https://github.com/Gaurav-Gosain/tuios/pull/1406)).\n\n---\n\n**Full Changelog**: https://github.com/Gaurav-Gosain/tuios/compare/v0.12.0...v0.12.1\n\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
