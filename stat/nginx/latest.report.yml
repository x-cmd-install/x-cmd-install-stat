ogin":"pluknet","id":105847909,"node_id":"U_kgDOBk8cZQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":862,"digest":"sha256:7a5b41844c4ddcb84177841a96070a7519e58ade3b9d62dc811a85c5682cc144","download_count":28,"created_at":"2026-10-14T15:15:51Z","updated_at":"2026-10-14T15:15:51Z"}],"body":"[nginx-1.31.7](https://nginx.org/en/download.html) mainline version has been [released](https://blog.nginx.org/blog/nginx-1-31-7-native-geoip2-support-http-2-priorities-and-quic-improvements), with fixes for [buffer overflow](https://nginx.org/en/security_advisories.html) vulnerability when using alias with rewrite (CVE-2026-15176), [buffer overflow](https://nginx.org/en/security_advisories.html) vulnerability when evaluating string expressions with variables (CVE-2026-93479), [request body injection](https://nginx.org/en/security_advisories.html) vulnerability in HTTP/3 (CVE-2026-95101), [session forgery](https://nginx.org/en/security_advisories.html) vulnerability when using TLS session ticket key rotation (CVE-2026-97629), and [use-after-free](https://nginx.org/en/security_advisories.html) vulnerability when using ngx_http_ssi_module with AIO (CVE-2026-97205).\r\n\r\nSee official [CHANGES](https://nginx.org/en/CHANGES) on nginx.org.\r\n\r\nBelow is a release summary generated by GitHub.\r\n\r\n## What's Changed\r\n* Dav: destination validation for COPY and MOVE with \"alias\" by @VadimZhestikov in https://github.com/nginx/nginx/pull/1764\r\n* Version bump by @pluknet in https://github.com/nginx/nginx/pull/1773\r\n* SSL: set c->error on connection reset SSL_read() error. by @pluknet in https://github.com/nginx/nginx/pull/1271\r\n* SSL: support for iPAddress subjectAltName in certificates. by @jimf5 in https://github.com/nginx/nginx/pull/1264\r\n* Rejected zero size in buffer-size directives. by @sbhowmikf5 in https://github.com/nginx/nginx/pull/1644\r\n* HTTP/2: implement RFC 9218 Extensible Prioritization Scheme for HTTP by @ac000 in https://github.com/nginx/nginx/pull/1520\r\n* QUIC: support BPF reload and binary upgrade by @saikrishnakumarreddy in https://github.com/nginx/nginx/pull/1756\r\n* QUIC: fixed binary upgrade from older versions by @route443 in https://github.com/nginx/nginx/pull/1813\r\n* Updated OpenSSL and PCRE used for win32 builds by @pluknet in https://github.com/nginx/nginx/pull/1816\r\n* GeoIP2: support for GeoIP2 http & stream modules by @nitin9977 in https://github.com/nginx/nginx/pull/1655\r\n\r\n\r\n**Full Changelog**: https://github.com/nginx/nginx/compare/release-1.31.6...release-1.31.7","reactions":{"total_count":15,"+1":5,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":5,"rocket":2,"eyes":0},"mentions_count":8}
