{"id":452493478,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAaRdW84a-ICm","tag_name":"18.1.0","target_commitish":"39f029d687cf2e667a43bc7005c1a16e8c36930d","name":"18.1.0","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-11-20T09:28:54Z","updated_at":"2026-11-20T09:34:12Z","published_at":"2026-11-20T09:34:12Z","assets":[],"body":"It runs the rules in multiple passes when autofixing so that fixes no longer introduce new problems, and it fixes 14 other bugs.\r\n\r\n* Fixed: `fix` introducing new problems in the CLI and Node.js API by running the rules in multiple passes (#9637) (@jeddy3).\r\n* Fixed: `fix` configuration property not writing the fixed code to files (#9662) (@ybiquitous).\r\n* Fixed: false positives and negatives after `fix` for comments within values, selectors and at-rule preludes (#9640) (@romainmenke).\r\n* Fixed: `at-rule-no-deprecated` autofix removing comments (#9658) (@jeddy3).\r\n* Fixed: `custom-property-empty-line-before` and `declaration-empty-line-before` false positives and negatives after autofixing (#9649) (@jeddy3).\r\n* Fixed: `declaration-property-value-no-unknown`, `property-no-unknown` and `value-type-custom-property-required-list` false negatives for rules nested within non-nesting at-rules (#9630) (@jeddy3).\r\n* Fixed: `font-family-name-quotes` autofix removing comments (#9648) (@jeddy3).\r\n* Fixed: `function-url-quotes` autofix for empty `url()` (#9646) (@jeddy3).\r\n* Fixed: `import-notation` autofix removing comments (#9644) (@jeddy3).\r\n* Fixed: `media-feature-name-no-vendor-prefix` false positives for names repeated inside the at-rule's block (#9643) (@jeddy3).\r\n* Fixed: `relative-selector-nesting-notation` autofix removing comments (#9659) (@jeddy3).\r\n* Fixed: `selector-class-pattern`, `selector-max-type` and `selector-type-{case,no-unknown}` false negatives for selector lists containing `from` or `to` outside `@keyframes` (#9669) (@jeddy3).\r\n* Fixed: `selector-not-notation` autofix for empty selectors (#9660) (@jeddy3).\r\n* Fixed: `shorthand-property-no-redundant-values` autofix removing comments (#9647) (@jeddy3).\r\n* Fixed: `value-no-vendor-prefix` autofix removing comments (#9645) (@jeddy3).\r\n","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
