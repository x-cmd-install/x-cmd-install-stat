{"id":432678571,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAaRdW84Zyiar","tag_name":"18.0.0","target_commitish":"7c49e1828311b9d413826cb47703ef1c6ccae4ef","name":"18.0.0","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-11-03T12:38:16Z","updated_at":"2026-11-03T12:48:48Z","published_at":"2026-11-03T12:48:48Z","assets":[],"body":"It contains 13 breaking changes, which we've detailed in the [migrating to `18.0.0` guide](https://github.com/stylelint/stylelint/blob/main/docs/migration-guide/to-18.md). It also adds 4 new rules and fixes 16 bugs.\r\n\r\n* Removed: support for end-of-life and older versions of Node.js (#9486) (@jeddy3).\r\n* Removed: support for CommonJS-style filename-less and extension-less locator paths (#9545) (@jeddy3).\r\n* Removed: resolution of packages from the global `node_modules` directory (#9534) (@jeddy3).\r\n* Removed: `context.fix` property (#9505) (@jeddy3).\r\n* Removed: `declaration-block-single-line-max-declarations` rule (#9565) (@jeddy3).\r\n* Removed: `*syntax` options from `declaration-property-value-no-unknown` (#9487) (@jeddy3).\r\n* Removed: `ignoreSelectors` option from `selector-max-specificity` (#9579) (@jeddy3).\r\n* Changed: TypeScript config files to be loaded by Node.js's built-in type stripping (#9489) (@jeddy3).\r\n* Changed: the CLI to parse arguments with `node:util.parseArgs` (#9508) (@jeddy3).\r\n* Changed: `globbyOptions` to support only a subset of options (#9500) (@jeddy3).\r\n* Changed: `function-no-unknown` to use the CSSTree Syntax Reference for known functions and to ignore vendor-prefixed functions (#9574) (@jeddy3).\r\n* Changed: color detection to use new `color` option with `node:util.styleText` (#9529) (@jeddy3).\r\n* Changed: hyperlink detection (#9536) (@jeddy3).\r\n* Added: `at-charset-rule-no-invalid` rule (#9509) (@firefoxic).\r\n* Added: `declaration-property-custom-property-allowed-list` rule (#9542) (@jeddy3).\r\n* Added: `value-no-invalid` rule (#9507) (@jeddy3).\r\n* Added: `value-type-custom-property-required-list` experimental rule (#9572) (@jeddy3).\r\n* Added: stable support for `processors` configuration property (#9543) (@jeddy3).\r\n* Added: stable support for `referenceFiles` configuration property (#9598) (@jeddy3).\r\n* Added: `result.stylelint.postcss` property for plugins (#9594) (@jeddy3).\r\n* Added: `stylelint.version` property (#9595) (@ybiquitous).\r\n* Added: `languageOptions.syntax` support to `function-no-unknown` (#9574) (@jeddy3).\r\n* Fixed: `referenceFiles` performance (#9573) (@jeddy3).\r\n* Fixed: import and cache performance by replacing `file-entry-cache` (#9593) (@jeddy3).\r\n* Fixed: import performance by lazily loading `css-tree` (#9580) (@jeddy3).\r\n* Fixed: exit code when all errors in a file are suppressed and other problems are reported (#9528) (@schreibse).\r\n* Fixed: `--fix` for files where the only change is the removal of a byte order mark (#9512) (@firefoxic).\r\n* Fixed: `Config['extends']` type for configuration objects (#9526) (@firefoxic).\r\n* Fixed: `at-rule-descriptor-value-no-unknown` false negatives for `var()` (#9614) (@jeddy3).\r\n* Fixed: `custom-property-{pattern,no-missing-var-function}` and `*-no-unknown` false positives and negatives for `@property` with a list of names (#9571) (@jeddy3).\r\n* Fixed: `custom-property-no-missing-var-function` false negatives for custom properties defined in `referenceFiles` (#9570) (@jeddy3).\r\n* Fixed: `custom-property-no-missing-var-function` false positives for recently introduced properties (#9567) (@jeddy3).\r\n* Fixed: `declaration-block-no-redundant-longhand-properties` and `declaration-block-no-shorthand-property-overrides` false negatives for `contain-intrinsic-size` (#9550) (@firefoxic).\r\n* Fixed: `declaration-block-no-shorthand-property-overrides` false negatives for flow-relative properties overridden by physical shorthands (#9549) (@firefoxic).\r\n* Fixed: `declaration-property-value-no-unknown` false negatives for values containing known custom properties (#9537) (@jeddy3).\r\n* Fixed: `declaration-property-value-no-unknown` false negatives for values containing registered custom properties (#9566) (@jeddy3).\r\n* Fixed: `declaration-property-value-no-unknown` false positives and negatives for files included in a `referenceFiles` bundle (#9358) (@romainmenke).\r\n* Fixed: `property-layout-mappings` false negatives for physical shorthand properties (#9615) (@jeddy3).\r\n","reactions":{"total_count":7,"+1":2,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":5}
