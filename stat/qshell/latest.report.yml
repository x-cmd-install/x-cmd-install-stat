created_at":"2026-11-10T07:31:45Z","updated_at":"2026-11-10T07:31:45Z"},{"id":730528556,"node_id":"RA_kwDOAZbyZ84rivss","name":"qshell-v2.21.1-linux-mipsle.tar.gz.md5","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":33,"digest":"sha256:877bca11e7a671c0db235d06b11a50d6dfd50aa1e77927e11332cc706b206b6a","download_count":0,"created_at":"2026-11-10T07:31:46Z","updated_at":"2026-11-10T07:31:46Z"}],"body":"## 更新\n\n- 升级 `golang.org/x/crypto` 至 `v0.52.0`，同步升级相关 `golang.org/x/*` 依赖。\n- 发布二进制统一使用 Go 1.27.3 构建。\n- CI 同时验证 Go 1.25.x 和 Go 1.27.x，并固定使用矩阵指定的工具链。\n\n## 兼容性说明\n\n- 从源码构建的最低 Go 版本由 1.24 提高至 1.25。\n- 停止提供 Windows 32 位 ARM（`windows/arm`）二进制包；保留 Windows x86、x64 和 ARM64，共提供 15 个平台的二进制包。\n\n## 验证\n\n- Go 1.25.14 和 Go 1.27.3 默认测试及 `unit` 标签测试通过。\n- 两个 Go 版本构建的 CLI 已验证版本输出、帮助、Base64 编解码和错误退出码。\n- PR 的 15 个平台构建检查及 Prow 集成测试通过。\n\n相关变更：#467\n\n完整变更：https://github.com/qiniu/qshell/compare/v2.21.0...v2.21.1\n"}
