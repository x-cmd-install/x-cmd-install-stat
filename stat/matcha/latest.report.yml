ged\n### New Features\n* feat(cli): add mail subcommands by @Robin-Everaars in https://github.com/floatpane/matcha/pull/1755\n### Bug Fixes\n* fix(app): honor quit/cancel keybinds by @ayanpandey in https://github.com/floatpane/matcha/pull/1771\n* fix: move Emails to Trash on delete by @bl4zee1g in https://github.com/floatpane/matcha/pull/1779\n* fix(imap): support multipart/digest by @fsarud in https://github.com/floatpane/matcha/pull/1781\n* fix(config): migrate smtp_password by @andrinoff in https://github.com/floatpane/matcha/pull/1782\n* fix(config): atomic OAuth script write by @vaccaroraul-afk in https://github.com/floatpane/matcha/pull/1773\n### Documentation\n* docs: update feature screenshots by @floatpanebot in https://github.com/floatpane/matcha/pull/1724\n* docs: update demo.gif by @floatpanebot in https://github.com/floatpane/matcha/pull/1759\n### Other Changes\n* docs: correct brew install by @andrinoff in https://github.com/floatpane/matcha/pull/1783\n\n## New Contributors\n* @ayanpandey made their first contribution in https://github.com/floatpane/matcha/pull/1771\n* @bl4zee1g made their first contribution in https://github.com/floatpane/matcha/pull/1779\n* @fsarud made their first contribution in https://github.com/floatpane/matcha/pull/1781\n* @vaccaroraul-afk made their first contribution in https://github.com/floatpane/matcha/pull/1773\n* @Robin-Everaars made their first contribution in https://github.com/floatpane/matcha/pull/1755\n\n**Full Changelog**: https://github.com/floatpane/matcha/compare/v1.4.3...v1.5.0\n\n---\nThis version is also available on **[Snapcraft](https://snapcraft.io/matcha)**, **Homebrew**, **[Flatpak](https://matcha.email/matcha.flatpakref)**!\n\nView the [installation instructions](https://docs.matcha.email/installation) for more details.\n\n","reactions":{"total_count":4,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":7}
