ged\n### New Features\n* feat(export): add EML email export by @ishaan-jindal in https://github.com/floatpane/matcha/pull/1746\n* feat: fit inbox subjects to row width by @mvanhorn in https://github.com/floatpane/matcha/pull/1750\n### Bug Fixes\n* fix(i18n): arabic dual vs 3-10 plurals by @owgreen-dev in https://github.com/floatpane/matcha/pull/1732\n* fix: Flatpak signing key by @andrinoff in https://github.com/floatpane/matcha/pull/1745\n* fix(security): bump Go to 1.26.10 by @kawacukennedy in https://github.com/floatpane/matcha/pull/1749\n* fix(ci): use install_steps hook by @kawacukennedy in https://github.com/floatpane/matcha/pull/1756\n### Documentation\n* docs: update demo.gif by @floatpanebot in https://github.com/floatpane/matcha/pull/1737\n### Continuous Integration\n* fix(imap): STARTTLS for non-993 ports by @kawacukennedy in https://github.com/floatpane/matcha/pull/1690\n### Other Changes\n* fix(sender): add SMTP dial timeouts by @kawacukennedy in https://github.com/floatpane/matcha/pull/1692\n\n## New Contributors\n* @owgreen-dev made their first contribution in https://github.com/floatpane/matcha/pull/1732\n* @ishaan-jindal made their first contribution in https://github.com/floatpane/matcha/pull/1746\n\n**Full Changelog**: https://github.com/floatpane/matcha/compare/v1.1.0...v1.2.0\n\n---\nThis version is also available on **[Snapcraft](https://snapcraft.io/matcha)**, **Homebrew**, **[Flatpak](https://matcha.email/matcha.flatpakref)**!\n\nView the [installation instructions](https://docs.matcha.email/installation) for more details.\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":6}
