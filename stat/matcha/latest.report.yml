s Changed\r\n\r\n### New Features\r\n* feat(gitmail): initial by @andrinoff in https://github.com/floatpane/matcha/pull/1420\r\n* feat: horizontal split pane view by @andrinoff in https://github.com/floatpane/matcha/pull/1423\r\n* feat: command palette by @andrinoff in https://github.com/floatpane/matcha/pull/1431\r\n* feat: macos helper (initial) by @steveevansdev in https://github.com/floatpane/matcha/pull/1444\r\n* feat: contact manager by @andrinoff in https://github.com/floatpane/matcha/pull/1472\r\n* feat: mouse support by @steveevansdev in https://github.com/floatpane/matcha/pull/1477\r\n* feat: custom smtp and imap logins by @andrinoff in https://github.com/floatpane/matcha/pull/1486\r\n* feat: pgp encryption by @LeaWhoCodes in https://github.com/floatpane/matcha/pull/1487\r\n* feat: view body, when composing a reply by @andrinoff in https://github.com/floatpane/matcha/pull/1492\r\n* feat: display code blocks by @andrinoff in https://github.com/floatpane/matcha/pull/1499\r\n* feat: export as HTML/MD by @andrinoff in https://github.com/floatpane/matcha/pull/1501\r\n* feat: emoji picker by @andrinoff in https://github.com/floatpane/matcha/pull/1608\r\n* feat: PGP key look up via WKD by @andrinoff in https://github.com/floatpane/matcha/pull/1610\r\n* feat: install themes via CLI by @andrinoff in https://github.com/floatpane/matcha/pull/1622\r\n* feat: jump to folder by @andriy-chernov in https://github.com/floatpane/matcha/pull/1624\r\n* feat: support new marketplace by @andrinoff in https://github.com/floatpane/matcha/pull/1632\r\n* feat: ui customization via plugins by @andrinoff in https://github.com/floatpane/matcha/pull/1633\r\n* feat: more HTML tags by @LeaWhoCodes in https://github.com/floatpane/matcha/pull/1638\r\n* feat: git patch support by @andrinoff in https://github.com/floatpane/matcha/pull/1646\r\n* feat: change layout per email view by @andrinoff in https://github.com/floatpane/matcha/pull/1650\r\n* feat: help command by @andrinoff in https://github.com/floatpane/matcha/pull/1700\r\n### Bug Fixes\r\n* fix: add row offset for split pane mode by @andrinoff in https://github.com/floatpane/matcha/pull/1436\r\n* fix: improve marketplace by @andrinoff in https://github.com/floatpane/matcha/pull/1498\r\n* fix: dont show all options in composer by @andrinoff in https://github.com/floatpane/matcha/pull/1611\r\n* fix: adds retries to fetch by @andrinoff in https://github.com/floatpane/matcha/pull/1631\r\n* fix: attachments being dropped by @andrinoff in https://github.com/floatpane/matcha/pull/1636\r\n* fix: better log for plugins by @andrinoff in https://github.com/floatpane/matcha/pull/1637\r\n* fix: daemon socket death by @andrinoff in https://github.com/floatpane/matcha/pull/1648\r\n* fix: remove limit for headers by @andrinoff in https://github.com/floatpane/matcha/pull/1655\r\n* fix(daemonclient): register IMAP/POP3 by @2005czq in https://github.com/floatpane/matcha/pull/1668\r\n### Dependencies\r\n* chore: use bubble-overlay v0.1.0 by @andrinoff in https://github.com/floatpane/matcha/pull/1435\r\n### Continuous Integration\r\n* chore: refactor main.go by @andriy-chernov in https://github.com/floatpane/matcha/pull/1603\r\n* chore: change auto-update for RCs by @andrinoff in https://github.com/floatpane/matcha/pull/1616\r\n* ci: fix demo workflow config by @andrinoff in https://github.com/floatpane/matcha/pull/1654\r\n### Chores\r\n* chore: update logo by @andrinoff in https://github.com/floatpane/matcha/pull/1489\r\n* chore: delete patch file by @andrinoff in https://github.com/floatpane/matcha/pull/1615\r\n* chore: removes onboarding from gif demo by @andrinoff in https://github.com/floatpane/matcha/pull/1628\r\n### Other Changes\r\n* feat: setup guide by @andrinoff in https://github.com/floatpane/matcha/pull/1447\r\n* chore(deps): golang.org/x/term ^ v0.44.0 (#1458) by @andrinoff in https://github.com/floatpane/matcha/pull/1467\r\n* feat: show CC BCC in composer by @andrinoff in https://github.com/floatpane/matcha/pull/1625\r\n* fix(fetcher): decode address names by @2005czq in https://github.com/floatpane/matcha/pull/1669\r\n\r\n### Chores\r\n* chore: sync gomod2nix.toml by @floatpanebot in https://github.com/floatpane/matcha/pull/1718\r\n* chore: update flake.lock by @floatpanebot in https://github.com/floatpane/matcha/pull/1717\r\n\r\n## New Contributors\r\n* @steveevansdev made their first contribution in https://github.com/floatpane/matcha/pull/1444\r\n* @andriy-chernov made their first contribution in https://github.com/floatpane/matcha/pull/1603\r\n* @2005czq made their first contribution in https://github.com/floatpane/matcha/pull/1668\r\n\r\n**Full Changelog**: https://github.com/floatpane/matcha/compare/v0.44.0...v1.0.1\r\n\r\n---\r\nThis version is also available on **[Snapcraft](https://snapcraft.io/matcha)**, **Homebrew**, **[Flatpak](https://matcha.email/matcha.flatpakref)**!\r\n\r\nView the [installation instructions](https://docs.matcha.email/installation) for more details.\r\n\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":6}
