ged\n### New Features\n* feat(view): opt in to remote images by @christos-chatzifountas-biotz-io in https://github.com/floatpane/matcha/pull/1744\n### Bug Fixes\n* fix: raw fetch fallback for bad MIME by @andrinoff in https://github.com/floatpane/matcha/pull/1758\n### Dependencies\n* chore(deps): github.com/charmbracelet/x/ansi ^ v0.11.9 by @floatpanebot in https://github.com/floatpane/matcha/pull/1740\n* chore(deps): github.com/protonmail/go-crypto ^ v1.5.2 by @floatpanebot in https://github.com/floatpane/matcha/pull/1731\n* chore(deps): greenmail/standalone ^ 2.1.15 by @floatpanebot in https://github.com/floatpane/matcha/pull/1683\n* chore(deps): github/issue-labeler ^ v3.5 by @floatpanebot in https://github.com/floatpane/matcha/pull/1760\n* chore(deps): charm.land/bubbletea/v2 ^ v2.1.1 by @floatpanebot in https://github.com/floatpane/matcha/pull/1739\n* chore(deps): github.com/puerkitobio/goquery ^ v1.13.0 by @floatpanebot in https://github.com/floatpane/matcha/pull/1747\n### Chores\n* chore: update flake.lock by @floatpanebot in https://github.com/floatpane/matcha/pull/1763\n* chore: sync gomod2nix.toml by @floatpanebot in https://github.com/floatpane/matcha/pull/1764\n### Other Changes\n* fix(config): timeout OAuth subprocesses by @kawacukennedy in https://github.com/floatpane/matcha/pull/1694\n\n## New Contributors\n* @christos-chatzifountas-biotz-io made their first contribution in https://github.com/floatpane/matcha/pull/1744\n\n**Full Changelog**: https://github.com/floatpane/matcha/compare/v1.2.0...v1.3.0\n\n---\nThis version is also available on **[Snapcraft](https://snapcraft.io/matcha)**, **Homebrew**, **[Flatpak](https://matcha.email/matcha.flatpakref)**!\n\nView the [installation instructions](https://docs.matcha.email/installation) for more details.\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":4}
