d_count":7,"created_at":"2026-08-20T12:28:58Z","updated_at":"2026-08-20T12:28:59Z"},{"id":522222503,"node_id":"RA_kwDOJyaTHM4fIHun","name":"pop_0.5.0_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":5490477,"digest":"sha256:d4af06ceebf5d67e0b74447f7f57f2a85e7fa39beecf685a51da3b2950052348","download_count":2,"created_at":"2026-08-20T12:28:58Z","updated_at":"2026-08-20T12:28:59Z"}],"body":"# Now verified \u2611\ufe0f\r\n\r\n<img width=\"538\" height=\"259\" alt=\"Screenshot 2026-08-20 at 16 23 37\" src=\"https://github.com/user-attachments/assets/a6770055-e485-4944-b6a5-904754911f53\" />\r\n\r\nThis is a small update replacing DCR (Dynamic Client Registration) with our client on Resend. Now, when running `pop auth` you will see the new screen, showing us verified!\r\n\r\nXXX, Charm\r\n\r\n## Changelog\r\n### New!\r\n* 90d0f736d24b421347b14f36e9bb6b4af3a0de17: feat(oauth): hardcoded client ID, instead of DCR (#179) (@andrinoff)\r\n### Other stuff\r\n* a8dc029875a00f29053d11b43932577a1b70d9b4: ci: sync dependabot config (#152) (@charmcli)\r\n* cc5a0a73fb7f0841ad49394c7edf14e08e99efd2: v0.5.0 (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/pop/releases/download/v0.5.0/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/pop/releases/download/v0.5.0/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/pop/releases/download/v0.5.0/checksums.txt'\r\nwget 'https://github.com/charmbracelet/pop/releases/download/v0.5.0/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","mentions_count":2}
