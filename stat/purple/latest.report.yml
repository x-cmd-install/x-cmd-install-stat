t":"2026-08-26T17:55:47Z","updated_at":"2026-08-26T17:55:48Z"},{"id":531131019,"node_id":"RA_kwDORUEPt84fqGqL","name":"purple-3.27.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5408833,"digest":"sha256:f1eee722cd52bc2096d347eb4bd8a4aee4c4be6a34a28223255221065effbfd0","download_count":20,"created_at":"2026-08-26T17:55:47Z","updated_at":"2026-08-26T17:55:48Z"},{"id":531131029,"node_id":"RA_kwDORUEPt84fqGqV","name":"purple-3.27.0-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:fcaebb905d326762b06b676fb352c444dfe17a8b9b28032a25079a25a45359a4","download_count":3,"created_at":"2026-08-26T17:55:47Z","updated_at":"2026-08-26T17:55:48Z"}],"body":"\n- feat: Your NetBox inventory becomes your SSH host list.\n- feat: Add NetBox with `S` in the TUI: fill URL and token and your devices and virtual machines sync into `~/.ssh/config`. Primary IPs become HostNames, tag slugs become searchable tags and site, role, platform and status show up in the detail panel.\n- feat: Scope the sync with NetBox's own query language in the Filter field: `status=active` is the default and `tag=ssh&site=ams1` narrows it to exactly the machines you reach over SSH.\n- feat: Both token forms work without configuration: new `nbt_` tokens and classic API tokens are detected automatically. Self-signed TLS is a toggle away."}
