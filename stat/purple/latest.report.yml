2026-10-21T16:02:39Z","updated_at":"2026-10-21T16:02:39Z"},{"id":663036139,"node_id":"RA_kwDORUEPt84nhSDr","name":"purple-3.31.0-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5609752,"digest":"sha256:be28171f98d4af8baaa78acf10e45ec8e542d5d8b5e8bdafdfd9f4f6544ad83b","download_count":8,"created_at":"2026-10-21T16:02:39Z","updated_at":"2026-10-21T16:02:39Z"},{"id":663036163,"node_id":"RA_kwDORUEPt84nhSED","name":"purple-3.31.0-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:2172f6847ea6cbb074082612ff9f19240923db572236a750251b03da00e035b7","download_count":1,"created_at":"2026-10-21T16:02:39Z","updated_at":"2026-10-21T16:02:39Z"}],"body":"\n- feat: Use your YubiKey with a PIN everywhere in purple.\n- feat: A tunnel, a file browser listing or a key push that needs your security key PIN asks for it inside purple and carries on with it. Touch the key when it blinks. This needs OpenSSH 8.5 or newer.\n- feat: purple keeps the PIN in memory per key until you quit and never writes it to disk. Once a connection proves it right, later tunnels, listings, transfers, container commands and snippets reuse it.\n- feat: A wrong PIN costs your key one attempt. purple stops using a PIN the key refused, tells you why and asks again. Hosts that share a key take turns, so one wrong PIN never spends an attempt on every host at once.\n- feat: Connecting from the host list asks for your security key PIN in the terminal, even when the host has a password source. Your password only ever answers a password prompt.\n- change: Provider sync and the update check use current TLS root certificates and the latest certificate checks."}
