4T00:42:56Z"},{"id":670845787,"node_id":"RA_kwDOQAyAEs4n_Etb","name":"beads_1.3.2_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":49449677,"digest":"sha256:39b34a1246b7216031a98ae838c785a7dbba29cf9f50f109114ac462a4b85e7c","download_count":227,"created_at":"2026-10-24T00:42:57Z","updated_at":"2026-10-24T00:42:58Z"},{"id":670845961,"node_id":"RA_kwDOQAyAEs4n_EwJ","name":"beads_1.3.2_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":54179617,"digest":"sha256:e59cb7742278185493e30c2eb97cb318db8d7a58c28ee5e88c2a30c7630c0975","download_count":610,"created_at":"2026-10-24T00:43:00Z","updated_at":"2026-10-24T00:43:02Z"},{"id":670845626,"node_id":"RA_kwDOQAyAEs4n_Eq6","name":"beads_1.3.2_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":30457130,"digest":"sha256:9cc467dc39a44bbc12f01701e4acfa0999ba5c365f922e548b3577114e2dc6d5","download_count":53,"created_at":"2026-10-24T00:42:51Z","updated_at":"2026-10-24T00:42:52Z"},{"id":670855804,"node_id":"RA_kwDOQAyAEs4n_HJ8","name":"checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":881,"digest":"sha256:41ff71509301dac70eced380e6782776751603ae14e152d68436357173edadfc","download_count":2301,"created_at":"2026-10-24T00:48:37Z","updated_at":"2026-10-24T00:48:37Z"}],"body":"<!--\nSTYLE: follows the v1.3.1 release body (title, version/date line, framing intro, Highlights ->\nUpgrading Notes -> Fixed -> Security -> Validation -> Installing -> Contributors -> Full Changelog;\nbolded operative sentence then dense prose; refs inline as #NNNN; operator-facing; no emoji),\nscaled down for a fix-only patch release: no Added or Changed section, because nothing was added.\n\nSPAN: v1.3.1 -> v1.3.2 = the CHANGELOG sections [1.3.2], [1.3.2-rc.3], [1.3.2-rc.2] and\n[1.3.2-rc.1] at the v1.3.2 tag (9b65b9e19), cross-checked against `git log v1.3.1..v1.3.2` and\nthe PRs it references. The v1.3.2 tree is the v1.3.2-rc.3 tree plus the version stamp and release\nmetadata. The proxied backup family, `bd purge --wisps-plane`/`--limit`, the #6716 fan-in recheck,\n`bd sql` parser classification, proxied `bd show --watch`, `bd types`, the clean-exit proxy\nretirement and authoritative `BEADS_DIR` all shipped in v1.3.1; they appear here only where\nv1.3.2 fixes them (purge live-dependent chain, auto-backup watermark, recheck publication,\npurge --limit hint). The doc re-review markers (#7267, #7268) are docs-only and not listed.\n\nEvery claim traces to that CHANGELOG or to a merged PR. Validation cites only runs that were looked\nup: the tag's Release / Migration Test Harness / Cross-Version Smoke runs, the PR and Nightly runs\non the hotfix/1.3.1 PRs, and the Gas City v1.5.1 RC Gate. The goreleaser \"## Changelog\" commit\nlist is dropped, as v1.3.0 and v1.3.1 did.\n-->\n\n# Beads v1.3.2\n\n**v1.3.2** — the second patch release on the 1.3 line. Released 2026-10-24, cut from\n`hotfix/1.3.1` at `9b65b9e19`. It ships exactly the code that was qualified as `v1.3.2-rc.3`; the\nonly change since that candidate is the version stamp.\n\nThere is **no schema migration**, and the embedded Dolt engine is unchanged (Dolt 2.2.0). Upgrading\nfrom v1.3.1 or any v1.3.2 release candidate is a binary swap. If you are coming from v1.3.0 or\nearlier, read the [v1.3.1 release notes](https://github.com/gastownhall/beads/releases/tag/v1.3.1)\nfirst — everything in them applies, and this release adds to it.\n\nThis is a fix-only release. It closes two ways v1.3.1's new retention and backup paths could lose\ndata, makes the post-commit blocked-state recheck safe under concurrent writes, lets a\nleast-privilege Dolt user write again, removes an export stall on large wisp sets, and rebuilds with\nGo 1.26.10 and patched dependencies. It also carries an upgrade note for every store that crossed\nmigration 0059 under bd 1.3.0 or later: read it before you upgrade.\n\n## Highlights\n\n- **`bd purge` no longer deletes the closed root of a chain that still has live work under it**\n  (#7041, fixes #7031). v1.3.1's live-dependent protection only covered a closed bead a live bead\n  pointed at directly, so an orchestrator's `bd purge --wisps-plane --older-than ...` retention\n  sweep could delete a closed root above a closed child above an open grandchild, orphaning both.\n  Protection now propagates up the whole closed chain.\n- **Auto-backup never claims a commit the snapshot does not contain** (#7044, fixes #7032). The\n  watermark is read before the sync, so a commit that lands mid-sync stays pending for the next\n  backup instead of being skipped as \"no changes\".\n- **The fan-in recheck no longer reverts concurrent writes** (#7146, backport of #6876, fixes\n  #7030). On the Dolt server backend, the post-commit blocked-state recheck could write rows other\n  sessions had just committed back to their earlier values. It now runs in its own transaction and\n  publishes its Dolt commit after that transaction commits.\n- **A least-privilege Dolt user can write again** (#7786, backport of #7322). `bd create --graph`,\n  `bd mol wisp`, `bd history` and `bd recompute-blocked` no longer fail with `command denied` for a\n  server user granted EXECUTE on only `dolt_add`/`dolt_commit`.\n- **`bd export --all` no longer stalls on workspaces with many wisps** (#7603, backport of #6444,\n  with #7785). Bulk readers read at most 200 ids per statement, and a repeated id is read once.\n- **Security rebuild.** Release binaries build with Go 1.26.10 (#7732), and `x/net`, `x/crypto`,\n  `grpc` and `thrift` are raised past every fixable advisory that reaches the binary (#6355,\n  #7495).\n\n## Upgrading Notes\n\n- **After upgrading from bd 1.3.0 or earlier, run `bd recompute-blocked` once per workspace**\n  (#7037). Migration 0059, first shipped in v1.3.0, recomputes the stored `is_blocked` flag with a\n  recursive query. On Dolt servers older than 2.4.0, and on the embedded engine, a query-planner bug\n  ([dolthub/dolt#11886](https://github.com/dolthub/dolt/issues/11886), fixed in Dolt 2.4.0) drops\n  the query's `parent-child` edge filter, so blockedness spreads across every dependency type,\n  including `relates-to`, `discovered-from` and `tracks`. Beads that are not blocked are marked\n  blocked and silently disappear from `bd ready` and `bd list --ready`. The flag is stored, so the\n  damage persists until it is recomputed, and **nothing in v1.3.2 repairs it automatically**. This\n  applies to every workspace whose store crossed migration 0059 under bd 1.3.0 or later, which\n  includes a workspace now on v1.3.1 that was first created by 1.2.x or earlier. The command is\n  idempotent, reports `rows_corrected`, and changes nothing on a workspace that was not affected.\n- **`bd purge` keeps more closed beads** (#7041). Every closed bead in a chain above a live bead is\n  now kept and counted in `live_dependent_skipped`, on every backend. A retention sweep that used to\n  delete such a root no longer does, so its purged count can drop.\n- **The `bd purge --limit N` confirmation suggests a `--force` command that keeps `--limit`**\n  (#7540, fixes #7534). The suggested command used to drop `--limit`, so running it as printed\n  deleted every eligible row instead of N. If you copied that suggestion into a script, check it.\n- **A negative `--older-than` that overflows is refused** on `bd purge` and `bd prune` (#7540, fixes\n  #7524). A large negative day count, such as `--older-than=-213503d`, used to wrap to a small\n  positive age and purge.\n- **`bd export` fails when it cannot classify wisp-plane rows** (#7603). When the `wisps` table\n  exists but its membership cannot be read, export now fails with `failed to classify wisp-plane\n  rows` instead of silently exporting without wisp markers. Only a missing `wisps` table is\n  tolerated.\n\n## Fixed\n\n- **`bd purge` keeps the whole closed chain above a live bead** (#7041, fixes #7031). Take a closed\n  root R, a closed child S1 and an open grandchild S2. v1.3.1 protected S1, because S2 is live, but\n  not R, because its only dependent S1 is closed, so purge deleted R and orphaned S1 and S2;\n  `--dry-run` reported the same deletion. Protection now propagates through closed candidates until\n  nothing changes, on the Dolt server, embedded and proxied backends.\n- **The auto-backup watermark no longer runs ahead of the snapshot** (#7044, fixes #7032).\n  Auto-backup read Dolt HEAD after the sync and recorded it as the newest commit backed up, so a\n  commit that landed during the sync was recorded as backed up although the snapshot lacked it, and\n  auto-backup then reported \"no changes since last backup\" until HEAD moved again. Only opted-in\n  auto-backup (`backup.enabled: true`) was affected; `bd backup sync` records no commit watermark.\n- **The post-commit blocked-state recheck no longer reverts concurrent writes** (#7146, backport of\n  #6876, fixes #7030). v1.3.1's #6716 fan-in fix minted its Dolt commit while its own SQL\n  transaction was still open. `DOLT_ADD` stages the table from the session's BEGIN-time root, so the\n  commit could write `issues` rows that other sessions had just committed back to their BEGIN-time\n  values. The recheck runs only when unblocking writes (closes, dependency removals, deletes) race,\n  which is exactly when this matters. The recompute now runs alone in its own retried transaction\n  and the Dolt commit is published after it. A failed trailing commit is counted as\n  `post_tx_commit_dropped` and logged, instead of being reported as a recheck failure, because the\n  flag repair itself is already committed.\n- **A least-privilege Dolt user can write again** (#7786, backport of #7322). Two fresh-connection\n  paths ran `CALL DOLT_CHECKOUT` even when the session was already on the requested branch: the\n  fallback for the ignored-tables transaction, and the pinned connection used by long-timeout\n  versioned reads and the blocked recompute. A server user granted EXECUTE on only\n  `dolt_add`/`dolt_commit` is denied even that no-op checkout. The checkout now runs only when the\n  session is on a different branch.\n- **`bd export --all` no longer stalls on workspaces with many wisps** (#7603, backport of #6444).\n  The bulk label, comment, dependency and issue readers sent every id in one `IN (...)` list, and\n  Dolt's cost grows faster than linearly in the list length; one reported workspace stopped\n  completing exports past about 21k wisps. The readers now read at most 200 ids per statement, and\n  export reads the wisp-plane relations only for ids that are wisps. A repeated id is read once, so\n  batching never duplicates or drops a row (#7785).\n- **`bd purge --limit N` confirmation and `--older-than` overflow** (#7784, backport of #7540, fixes\n  #7534 and #7524). See Upgrading Notes.\n\n## Security\n\n- **Release binaries build with Go 1.26.10** (#7787, backport of #7732), which distrusts the\n  compromised eMudhra intermediate CAs in `crypto/x509`. `release.yml` uses uv 0.13.4, which ships\n  the same distrust.\n- **Dependency floors raised** (#7787): `golang.org/x/net` v0.60.0 and `golang.org/x/crypto`\n  v0.57.0 (backport of #6355), and `google.golang.org/grpc` v1.83.2 and `github.com/apache/thrift`\n  v0.24.0 (backport of #7495). `govulncheck` reported 16 reachable advisories on rc.2's module set\n  and none on rc.3's, which is the v1.3.2 module set.\n\n## Validation\n\n- **v1.3.2 is the qualified rc.3 code.** The tag (`9b65b9e19`) differs from `v1.3.2-rc.3`\n  (`0dee73e43`) only in the version stamp, the CHANGELOG, the `bd info` digest, and package and\n  plugin version metadata.\n- **Every fix landed on `hotfix/1.3.1` as a `cherry-pick -x` PR of a commit already on `main`,\n  tested at its head.** The backport PRs (#7220, #7146, #7786, #7784, #7603, #7787) and the three\n  RC prep PRs (#7221, #7461, #7788) each passed the full PR matrix of 120–122 checks, including the\n  required `CI Gate / Required` gate that PRs into `hotfix/**` now run (#7198, ported in #7217). The\n  promotion PR (#7809) passed 121 checks plus the Nightly Full Tests workflow by dispatch, once for\n  the full test suite\n  ([40042534271](https://github.com/gastownhall/beads/actions/runs/40042534271)) and once for the\n  PR Linux command suite\n  ([40042536408](https://github.com/gastownhall/beads/actions/runs/40042536408)).\n- **The release pipeline completed green** (run\n  [40044707863](https://github.com/gastownhall/beads/actions/runs/40044707863)):\n  `verify-version-consistency`, both goreleaser legs (linux and macOS), both package gates (MCP and\n  npm), `publish-pypi`, `publish-npm` and release attestation. The tag-triggered Migration Test\n  Harness ([40044708076](https://github.com/gastownhall/beads/actions/runs/40044708076)) and\n  Cross-Version Smoke Tests\n  ([40044707912](https://github.com/gastownhall/beads/actions/runs/40044707912)) also passed. 11\n  assets were published: linux amd64/arm64, darwin amd64/arm64, windows amd64/arm64, freebsd amd64,\n  android arm64, the contract corpus, an SPDX SBOM and checksums. All three release candidates also\n  completed their release pipelines.\n- **Qualified against a real downstream consumer before the tag.** Gas City's `hotfix/1.5.1`\n  branch, pinned to `v1.3.2-rc.3`, passed its full RC Gate on the first attempt:\n  [40034407401](https://github.com/gastownhall/gascity/actions/runs/40034407401), at\n  `9d970f7cc8`. No job failed: the Linux CI parity tiers (including the beads topology\n  acceptance, the bd CLI contract jobs against the current and minimum-supported bd, and a contract\n  radar against beads `main`), acceptance A, B and C, all integration shards, tutorial goldens 1–6,\n  the four worker-core providers, the goreleaser snapshot, and the full macOS regression set.\n\n## Installing\n\nPre-compiled binaries for Linux, macOS (Intel & Apple Silicon), Windows (AMD64 & ARM64),\nAndroid/Termux (ARM64), and FreeBSD are attached to this release.\n\n**Homebrew (macOS/Linux):**\n```bash\nbrew install beads\n```\n\n**Quick Install (macOS/Linux/FreeBSD):**\n```bash\ncurl -sSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash\n```\n\n**Windows (PowerShell):**\n```powershell\nirm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex\n```\n\n**Manual Install:**\nDownload the appropriate binary for your platform below, extract it, and place it in your PATH.\n\nWhichever method you use, run `which -a bd` afterwards. A second, older `bd` earlier in `PATH` is\nthe mixed-version fleet problem described in the v1.3.0 upgrading notes. Then run\n`bd recompute-blocked` once per workspace if the first upgrading note applies to you.\n\n## Contributors\n\nThanks to everyone who contributed to v1.3.2 (between `v1.3.1` and `v1.3.2`):\n\n@bee-ghosttrack, @bourgois, @brandonmartin, @julianknutsen, @rjgeng\n\n<!-- Commit authors in `git log v1.3.1..v1.3.2` (Bee = bee-ghosttrack, Karel Bourgois = bourgois,\nJulian Knutsen = julianknutsen, Rongjun GENG = rjgeng), plus the author of backport PR #7603\n(brandonmartin), mapped through the PR author via `gh api`. The gascityinc-randy[bot] author of\n#7495's dependency bump and the \"Gas City Adopt-PR\" placeholder identity are excluded. -->\n\n**Full Changelog**: https://github.com/gastownhall/beads/compare/v1.3.1...v1.3.2\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
