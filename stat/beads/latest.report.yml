","updated_at":"2026-11-04T09:26:38Z"}],"body":"## beads v1.3.4\n\nPre-compiled binaries for Linux, macOS (Intel & Apple Silicon), Windows (AMD64 & ARM64), Android/Termux (ARM64), and FreeBSD.\n\n### Release notes\n\n1.3.4 is 1.3.3 plus one fix: bd reads `GT_ROOT` from a rig's `.beads/.env` again ([#8118](https://github.com/gastownhall/beads/pull/8118), a backport of [#8117](https://github.com/gastownhall/beads/pull/8117)). 1.3.3 ignored it and printed `beads: ignoring GT_ROOT from .beads/.env` on every bd command in a Gas City rig. That made released gc misreport failed bd commands there.\n\nRead the full notes in [CHANGELOG.md](https://github.com/gastownhall/beads/blob/v1.3.4/CHANGELOG.md): the `[1.3.4]` and `[1.3.4-rc.1]` sections. **Coming from 1.3.2 or earlier,** also read the `[1.3.3-rc.1]` **Upgrade notes** and **Known issues**. They still apply to 1.3.4, including the warning not to run `bd compact` or `bd flatten` on a clone that adopted migration 0062 by pull, by bootstrap, or after it ([#7039](https://github.com/gastownhall/beads/issues/7039)).\n\n### Installation\n\n**Homebrew (macOS/Linux):**\n```bash\nbrew install beads\n```\n\n**Quick Install (macOS/Linux/FreeBSD):**\n```bash\ncurl -sSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash\n```\n\n**Windows (PowerShell):**\n```powershell\nirm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex\n```\n\n**Manual Install:**\nDownload the appropriate binary for your platform below, extract it, and place it in your PATH.\n\n\n## Changelog\n### Others\n* 6fabc97e728254ad3e009886e32a816c8f4d00f9 release(notes): keep the v1.3.4 known-issue scope and correct the gate claim\n* d151f4109ed0bd917cf976c7191896590a52c242 release: prep v1.3.4\n\n\n"}
