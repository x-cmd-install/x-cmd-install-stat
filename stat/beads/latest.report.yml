T23:37:32Z"},{"id":602014963,"node_id":"RA_kwDOQAyAEs4j4gTz","name":"beads_1.3.1_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":49394999,"digest":"sha256:c3b32c71a6c0cd6358a12c28272b17e6818db991da192f87df52339c222e423a","download_count":346,"created_at":"2026-09-30T23:37:32Z","updated_at":"2026-09-30T23:37:35Z"},{"id":602014845,"node_id":"RA_kwDOQAyAEs4j4gR9","name":"beads_1.3.1_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":54131010,"digest":"sha256:48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76","download_count":425,"created_at":"2026-09-30T23:37:24Z","updated_at":"2026-09-30T23:37:25Z"},{"id":602014876,"node_id":"RA_kwDOQAyAEs4j4gSc","name":"beads_1.3.1_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":30433155,"digest":"sha256:af761ba43f1283a97d55a52a9285239fba54d85fd3449c109252f533b026c9db","download_count":43,"created_at":"2026-09-30T23:37:26Z","updated_at":"2026-09-30T23:37:27Z"},{"id":602046229,"node_id":"RA_kwDOQAyAEs4j4n8V","name":"checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":881,"digest":"sha256:8c4f1d28c26b179e471534c16712aef66ba57e3060ca339a6601b919ec3ab204","download_count":1819,"created_at":"2026-10-01T00:01:49Z","updated_at":"2026-10-01T00:01:49Z"}],"body":"<!--\nSTYLE: follows the v1.3.0 release body (title, version/date line, framing intro, Highlights ->\nUpgrading Notes -> Added -> Changed -> Fixed -> Validation -> Installing -> Contributors -> Full\nChangelog; bolded operative sentence then dense prose; refs inline as #NNNN; operator-facing; no\nemoji), scaled down for a patch release the way v1.2.2 was framed.\n\nSPAN: v1.3.0 -> v1.3.1 = the CHANGELOG sections [1.3.1], [1.3.1-rc.2] and [1.3.1-rc.1] at the\nv1.3.1 tag (c1c4b642a), cross-checked against `git log v1.3.0..v1.3.1` and the PRs it references.\nThe v1.3.1 tree is the v1.3.1-rc.2 tree plus the version stamp and release metadata.\n\nEvery claim traces to that CHANGELOG or to a merged PR. Validation cites only runs that were looked\nup: the tag's Release / Migration Test Harness / Cross-Version Smoke runs, the PR and Nightly Full\nTests runs on the release/1.3.0 and hotfix/1.3.1 PRs, and the Gas City v1.5.0 RC Gate and\ngascity-packs triage records. The goreleaser \"## Changelog\" commit list is dropped, as v1.3.0 did.\n-->\n\n# Beads v1.3.1\n\n**v1.3.1** \u2014 the first patch release on the 1.3 line. Released 2026-09-30, cut from `hotfix/1.3.1`\nat `c1c4b642a`. It ships exactly the code that was qualified as `v1.3.1-rc.2`; the only change since\nthat candidate is the version stamp.\n\nThere is **no schema migration**. Upgrading from v1.3.0, v1.3.1-rc.1 or v1.3.1-rc.2 is a binary\nswap. If you are still on v1.2.2 or earlier, read the\n[v1.3.0 release notes](https://github.com/gastownhall/beads/releases/tag/v1.3.0) first \u2014 everything\nin them applies, and this release adds to it.\n\nThe release is mostly about proxied-server mode, which became the default topology in 1.3.0: it gets\na backup path, honors `dolt.auto-commit`, can watch a bead, and stops reporting a dead backend as\nrunning. Alongside that it fixes a fan-in stall that hid ready work, gives orchestrators a bounded\nwisp-retention sweep, and corrects several commands whose exit codes or output scripts could not\ntrust. Several of those corrections change behaviour a script may depend on, so read the upgrading\nnotes.\n\n## Highlights\n\n- **A proxied-server workspace has a backup path** (#6582, #6584, #6694, #6879). In v1.3.0 `bd\n  backup` was refused outright on a proxied workspace, which was listed as a known issue. On a\n  proxied workspace whose Dolt server bd runs itself, `bd backup init`, `sync`, `remove`, `status`\n  and `restore` now work, and an explicit `backup.enabled=true` turns on the same throttled\n  auto-backup direct mode takes. Auto-backup stays off by default. On a proxied workspace pointed at\n  a Dolt server bd does not own, the family stays refused by design, because a backup remote\n  registered there would be global to every client of that server.\n- **Fan-in no longer stalls ready work** (#6716; #6719, #6942). Closing two blockers of one\n  dependent at the same time \u2014 formula fan-in with parallel workers, or a close racing a `bd dep\n  remove` or a delete \u2014 could leave the dependent `is_blocked=1` and missing from `bd ready` until\n  someone ran `bd recompute-blocked`. Every write that takes a blocker away now rechecks its\n  dependents after it commits, on the Dolt store, on every proxied-server write route, and inside\n  `RunInTransaction`.\n- **`bd purge` can run an orchestrator's wisp retention sweep** (#6883). `bd purge --wisps-plane\n  --older-than 168h --force` replaces a raw `DELETE FROM wisps` step. `--limit` drains a large\n  backlog in bounded transactions, `--older-than` takes hours, and a closed bead that live work\n  still depends on is always kept.\n- **Proxied-server mode catches up with direct mode.** `dolt.auto-commit=batch`/`off` take effect and\n  `bd dolt commit` works (#6499). `bd show --watch` works (#6933). `bd dolt start` no longer launches\n  a second sql-server over the proxy's data directory, and `bd dolt status` reports the proxy and\n  its backend truthfully (#6580). The proxy retires when its Dolt backend exits cleanly instead of\n  staying up in front of a dead store (#6937). Refusals that remain now say whether they are\n  permanent (`reason: design`) or a gap with an owner (`reason: unimplemented`) (#6582).\n- **The smart migrate gate stops wedging clones that are behind the remote** (#6575; #6659, #6695).\n  A clone level with the remote on schema but behind it on data used to auto-migrate in place,\n  after which every `bd dolt pull` refused (#6368). The gate now stops and tells you to run `bd dolt\n  pull` first, and `bd dolt pull` is allowed to run from that state.\n- **Exit codes and output scripts can rely on.** A `bd close` batch with a refused id exits non-zero\n  (#6740, #6771). A piped `bd query` is no longer silently capped at 50 rows (#6744). `bd sql` no\n  longer drops the rows of CTE queries or `CALL` result sets (#6932).\n\n## Upgrading Notes\n\n- **No migration, but behaviour changes.** The list below is everything in this release that can\n  change what a script sees. Each item is described in full under **Changed** or **Fixed**.\n- **`bd show --watch <id>` exits 1 when the id cannot be found**, on both the direct and proxied\n  routes. It used to exit 0 (#6933).\n- **`bd sql` output changed in two places** (#6932). In direct server mode, a multi-statement write,\n  or a write the parser cannot classify, now prints `OK` / `{\"status\":\"ok\"}` instead of `OK, N rows\n  affected` / `{\"rows_affected\":N}`. Proxied mode already did this. `bd sql --readonly` now refuses a\n  statement it cannot parse (for example `PRAGMA`) instead of running it as a read.\n- **A failure to read the custom issue types is now an error** (#6934). `bd types`, `bd create\n  --graph` and `bd config set storage-class.*` fail instead of continuing as if there were no custom\n  types.\n- **`BEADS_DIR` must point at the `.beads` directory itself** (#6938). A `BEADS_DIR` that names a\n  project root (`BEADS_DIR=$repo` instead of `BEADS_DIR=$repo/.beads`), or a `.beads` that does not\n  exist yet, used to work by accident because discovery walked up to the nearest workspace. It now\n  fails with \"no beads database found\". Fix the variable; behaviour with `BEADS_DIR` unset is\n  unchanged.\n- **`bd purge` always keeps closed beads that a live bead depends on** (#6883). This covers\n  `parent-child`, `tracks` and `blocks` edges, and there is no flag to turn it off. The held-back\n  count is reported as `live_dependent_skipped`. `bd prune` does not apply this protection.\n- **`--older-than` on `bd purge` and `bd prune` is exact at hour precision** (#6883). `12h` used to\n  round up to one day and now means 12 hours, so **`bd prune --older-than 12h` deletes rows closed\n  12\u201324 hours ago that it used to keep**. `36h` used to floor to one day and now means 36 hours. Day\n  values (`7`, `7d`, `2w`) are unchanged.\n- **`bd close` with several ids exits non-zero when any of them fails to close** (#6740, #6771). The\n  ids that can close still close, and a final `Error: N of M issues failed to close` line is added.\n  An id that was already closed still counts as success.\n- **An unflagged piped `bd query` is no longer capped at 50 rows** (#6744). It follows `bd list`'s\n  policy: an explicit `--limit` wins, piped stdout is unlimited, agent mode on a terminal gets 20,\n  and a terminal gets 50. Pass `--limit` if a pipeline relied on the cap.\n- **On a proxied workspace with `dolt.auto-commit` set to `batch` or `off`, writes stop being\n  committed to Dolt history one at a time** (#6499). The setting used to be ignored there. Changes\n  now accumulate in the server's working set until `bd dolt commit`, and `dolt log`, `dolt push` and\n  backups do not see them before that. The default, `on`, is unchanged.\n- **`bd dolt status --json` has a new shape on a proxied workspace** (#6580). The always-false\n  `{\"running\": false, \"pid\": 0, \"port\": 0}` is replaced by `running` (now describing the proxy) plus\n  `proxy_*` and `backend_*` fields. `pid` and `port` are gone. This is the rc.1 change most likely to\n  break a parser. Other topologies keep their output.\n- **`bd config set <dotted.key>` writes a nested mapping** (#6578). Where `.beads/config.yaml`\n  already had the flat spelling (a top-level `dolt.host: ...`), that entry is removed and re-written\n  under `dolt:`. Two writes that used to exit 0 without a visible effect now exit 1: setting a dotted\n  key under a parent that holds a scalar, and setting one in a file whose top level is not a mapping.\n  If another tool writes flat dotted keys to the same file, check for a duplicated key after `bd\n  config set` (#6594, open).\n- **`bd ready` and `bd list --ready` grow for workspaces with custom `active`-category statuses**\n  (#5918). Those issues were always meant to be ready work and now appear. Counts and dashboards will\n  read higher.\n- **`bd list --wisp-type <t>` without `--include-ephemeral` is now refused** instead of printing an\n  empty listing for every input (#6098).\n- **Opening a store against an unreachable Dolt server now waits before failing**, up to about 40s\n  per open (#6003). This applies only to proxied-server workspaces and to `bd serve`. Embedded\n  workspaces, and ordinary CLI commands in a server-mode workspace, are unaffected. Bad credentials,\n  an unknown database and an unresolvable hostname still fail immediately.\n- **`bd backup sync` fails after 5 seconds if another backup of the same workspace is running**,\n  rather than overlapping with it. A backup sync that would leave the manifest ahead of its chunk\n  files now fails at that point instead of corrupting the backup quietly (#5931). A backup already in\n  that state is not repaired by upgrading and has to be re-seeded.\n- **`bd doctor` warns about a missing `.beads/dolt-server-config.yaml` gitignore pattern** on every\n  workspace created before this release (#5978). Run `bd doctor --fix` once to add it.\n\n## Added\n\n- **The `bd backup` family on a proxied-server workspace bd runs the Dolt server for** (#6584,\n  #6694). `init`, `sync`, `remove`, `status` and `restore` are routed over the proxied provider.\n  `bd backup restore` stops the proxy and its Dolt child before replacing the database, so the next\n  command relaunches against the restored data. On a proxied workspace pointed at an external host,\n  socket, or team-server database, the family is still refused with code\n  `proxy.backup.unsupported`, now carrying `\"reason\": \"design\"`. `CALL DOLT_BACKUP('add', \u2026)` would\n  register the remote on the server for every client, and a `file://` destination would resolve on\n  the server's filesystem.\n- **Opt-in auto-backup on a managed-local proxied workspace** (#6879). With `backup.enabled=true` (or\n  `BD_BACKUP_ENABLED=1`) the post-command hook takes the same change-detected Dolt-native backup into\n  `.beads/backup` that it takes in direct mode. It is off by default, as on every server-mode\n  workspace. It does nothing on an external or team-server topology, under strict `--readonly`,\n  `bd serve`, `--dry-run`/`--inspect`, or a migration freeze. `bd backup status` now reports `auto:\n  off in proxied-server mode; set backup.enabled=true to opt in` instead of blaming a missing git\n  remote. A per-workspace `.beads/backup.lock` stops auto-backup and `bd backup sync` from running\n  at the same time.\n- **`bd purge --wisps-plane`, `--limit`, and hour-precision `--older-than`** (#6883).\n  `--wisps-plane` selects every closed row in the wisps table, including `--no-history` beads. It\n  works on embedded, server and proxied workspaces, and requires `--older-than` or `--pattern`.\n  `--limit N` caps one run at N beads, oldest-closed first. With `--json` the output then adds\n  `remaining` and `has_more`; loop while `has_more` is true. `--older-than` accepts `36h`, `168h`,\n  `90m`, and values down to `1s`. A value too large to represent (for example `213504d`) is refused\n  instead of wrapping to a tiny age.\n- **`bd list --include-ephemeral`** (#6098). This is the flag `--wisp-type` needs to reach any rows.\n  `bd list --include-ephemeral --wisp-type heartbeat` is the working form. It is off by default, so\n  the default listing is unchanged.\n- **`bd types` lists system types** (#6934). A new \"System types\" section shows `message`,\n  `molecule`, `gate` and `event`, and `bd types --json` gains an additive `system_types` field.\n\n## Changed\n\n- **Proxied-server refusals carry a `reason`** (#6582). The JSON a refused command prints gains\n  `reason: design` (expected to stay: shared history, multi-repo routing, destructive admin, strict\n  `--readonly`) or `reason: unimplemented` (a gap with a named owner). Codes, messages and exit\n  statuses are unchanged. A command with no proxied route now fails with the typed\n  `proxy.store.unrouted` instead of an internal string.\n- **`bd backup restore --json` prints `{\"restored\": true, \"source\": \"<dir>\"}` on every topology**,\n  where it used to print nothing. On failure, `bd backup init`/`sync`/`remove`/`restore` now print a\n  single error line instead of the error followed by the full usage text. Exit statuses are\n  unchanged.\n- **`dolt.auto-commit=batch`/`off` take effect on a proxied workspace, and `bd dolt commit` works\n  there** (#6499, #4995). Commands that are explicit commit points (`bd batch`, `bd mol\n  bond`/`pour`/`squash`, `bd mol wisp create`, the wisp half of `bd mol burn`) still commit, and\n  `bd serve` writes still commit per write. `bd vc commit`'s proxied refusal now points at `bd dolt\n  commit`.\n- **`bd purge` keeps closed beads a live bead depends on, and `--older-than` is exact** (#6883). See\n  Upgrading Notes.\n- **`bd ready` / `bd list --ready` include custom `active`-category statuses** (#5918, #5831). Custom\n  `wip`/`done`/`frozen`/unspecified statuses and `in_progress` stay out. The `--ready` footer and\n  help text still describe the default as open-only, which now understates the set (#6187, #6188,\n  open).\n- **The `--ready` footer names the status selector that applied** (#5924). With an explicit\n  `--status` it now reads `<selector> only`.\n- **Store opens retry transient connection failures for up to 30s** (#6003), with each attempt\n  capped at 10s, so about 40s is the realistic worst case for one open. A provider open pings twice,\n  so a narrow ordering can reach about 80s. Only proxied-server workspaces and `bd serve` take this\n  path.\n- **The Dolt bump rejects a backup manifest update that references a missing table file** (#5931,\n  #4070). This catches the corruption when it happens instead of at some later sync. It is a\n  mitigation: backup publish is still not atomic.\n- **`bd dolt status --json` reports the proxy and its backend separately on a proxied workspace**\n  (#6580), and **`bd config set` writes dotted keys nested** (#6578). See Upgrading Notes.\n\n## Fixed\n\n- **An explicit `BEADS_DIR` is authoritative during workspace discovery** (#6938). A `BEADS_DIR`\n  naming a directory with no project files used to be ignored. Discovery then walked up from the\n  current directory and rebound to the parent workspace, so `bd init` refused with \"already\n  initialized\" and `bd create`/`bd list` used the parent's store. `bd init` now initializes the named\n  directory, and `bd import`, `bd setup` and `bd bootstrap` target it.\n- **Concurrent unblocking no longer leaves a dependent stuck as blocked** (#6716; #6719, #6942).\n  Covered: the Dolt store write transactions; every proxied-server write route (`bd close` single\n  and batch, `bd update --status`, `bd dep remove`, `bd delete`, `bd batch`, `bd serve`);\n  `RunInTransaction` (`bd batch` direct, `bd cook`, `bd mol squash`/`burn`, SDK callers); the wisp\n  writers; and the legacy dependency removal behind `bd duplicates --merge`.\n- **`bd close` reports a partial batch failure** (#6648; #6740, #6771). In `--json` mode the summary\n  is a compact JSON line on stderr naming the failed ids, matching `bd update`, and each `failed[]`\n  entry carries the same refusal text on both routes. `--claim-next` still claims when part of the\n  batch closed, and the summary names the claimed id.\n- **`bd sql` classifies statements with the Dolt SQL parser** (#6932). In proxied mode, `WITH ...\n  SELECT` and `WITH RECURSIVE` queries were misread as writes and printed `OK, 0 rows affected`; they\n  now return their rows. Statements that may both write and return rows (`CALL`, `EXPLAIN ANALYZE`\n  of a write, `RETURNING`) are committed and their rows printed, so `CALL DOLT_BRANCH(...)`-style\n  result sets are no longer discarded.\n- **`bd query` applies `bd list`'s piped-output limit policy** (#6229, #6744).\n- **`bd show --watch` works under `--proxied-server`** (#6933). It was refused with\n  `proxy.watch.unsupported`. It now shares the direct route's loop: re-read every 2s, redraw on a\n  status or `updated_at` change, stop cleanly on Ctrl+C/SIGTERM. Each poll uses its own short unit\n  of work, so a long watch does not hold a transaction open.\n- **A proxy retires when its Dolt backend exits cleanly** (#6937). It used to notice only a non-zero\n  exit. A gracefully stopped backend left the proxy adoptable in front of a dead store, and with\n  `--proxied-server-idle-timeout 0` that never cleared. `bd dolt status` now reports such a proxy as\n  \"not serving\" (`running: false`, with `proxy_pid` still set), including one started by an older bd.\n- **`bd dolt start` is refused on a proxied workspace** with `proxy.dolt_start.conflict` (#6580).\n  It used to launch an unsupervised sql-server over the proxy's data directory or adopt the proxy's\n  own Dolt child, which was a v1.3.0 known issue. **`bd dolt status` now reads the proxy's own\n  records** instead of a PID file proxied mode never writes, so it no longer says \"not running\" while\n  the proxy is serving.\n- **The smart migrate gate stops a data-behind clone instead of auto-migrating it** (#6575; #6659,\n  #6695). A clone that has commits left to pull, whether or not it also has its own, is told to\n  run `bd dolt pull` first, and is told when that pull will merge rather than fast-forward. `bd dolt\n  pull` opens leniently for this one refusal, which changes the v1.3.0 upgrade note that said the\n  gate refuses `bd dolt pull` too. Commands that keep working (`bd list`, `bd ready`, `bd show`,\n  `bd dolt commit`) print the pull-first guidance instead of the migrate-or-adopt bullets. `--json`\n  callers get a single `pull-first` option and a `data_behind_shape` of `fast-forward` or\n  `diverged`. For a fast-forward on a non-shared store, `human_decision_required` is `false`. On a\n  shared server the guidance names `bd migrate schema --force` as the consent step. A proxied\n  workspace reaches the same stop, with the guidance naming the host the pull has to run on\n  (`pull-first-on-server-host`). `BD_SMART_GATE=0`, `bd migrate --force` and\n  `BD_ALLOW_REMOTE_MIGRATE=1` behave as before.\n- **A clone missing its local `events`, `bd_events_journal` or `bd_events_seq` table recreates it on\n  open** (#6547). These dolt-ignored tables could be absent on a clone that was otherwise at the\n  latest schema, and bd never created them. That was the write-dead store listed under v1.3.0's known\n  issues (#6142). The migration runner now replays the creating migrations from each table's own\n  floor.\n- **Deleting or purging a wisp removes its dependent rows on stores without the wisp foreign keys**\n  (#6487; #6563, #6627). Wisp deletes (including `bd purge`, `bd mol burn` and wisp GC) left\n  `wisp_dependencies` edges and `wisp_labels`, `wisp_events`, `wisp_comments` and\n  `wisp_child_counters` rows behind. This is a forward fix: orphans already in a store are not\n  cleaned up.\n- **A server-mode workspace with an empty `.beads/dolt` is no longer refused as legacy** (#5682,\n  #6935). When the gitignored `.local_version` witness was missing, every command, including\n  `bd init`, was refused and nothing could repair it. An empty root is now admitted and the witness\n  written. A pre-1.0 witness, or a non-empty `.beads/dolt`, is still refused.\n- **`bd types` lists exactly the types `bd create --type` accepts** (#6934). Server mode dropped\n  `config.yaml` custom types once the database had any, and proxied `bd config set storage-class.*`\n  ignored types registered in the database. Every mode now uses one rule.\n- **A dotted config key round-trips** (#6578). `bd config set sync.remote` wrote a top-level key\n  whose name contained the dot, which `bd config get` found and bd's direct reader did not, so `bd\n  init --remote` recorded a remote that was then not found. `bd config unset` now removes the nested\n  form too.\n- **`bd list --status <s> --ready` honors `--status`** (#5832, #5924). It used to drop it and return\n  the unfiltered ready set.\n- **`bd gate check` resolves bead gates whose target lives in a prefix-routed rig** (#5859), reading\n  the owning store through `routes.jsonl` without writing to it.\n- **Smaller fixes.** `bd doctor` and the gitignore template cover the generated\n  `.beads/dolt-server-config.yaml`, which holds a per-machine port and path (#5978). The\n  missing-prefix error points at `bd init --prefix` / `bd bootstrap` instead of a `config.yaml` key\n  that has no effect (#5916, #5936). `bd create --file` says it creates one issue per `##` heading\n  and suggests `--body-file` (#5921). The list truncation hint no longer leaves a padded blank line\n  under the prompt (#5685, #5927). `bd setup claude` and `bd init` stop rewriting\n  `.claude/settings.json` when nothing changed (#5693, #5944).\n\n## Validation\n\n- **v1.3.1 is the qualified rc.2 code.** The tag (`c1c4b642a`) differs from `v1.3.1-rc.2`\n  (`696e3967b`) only in the version stamp, the CHANGELOG, and package and plugin version metadata.\n- **The rc.1 content and the first rc.2 changes landed on `release/1.3.0` through PRs** (#6578,\n  #6580, #6653, #6659, #6695, #6547 among them), each green across the full PR matrix of 119\u2013122\n  checks.\n- **The `hotfix/1.3.1` work landed in four batch PRs, each tested at its merged head.** Batch 1\n  (#6905: proxied backup and the purge changes) passed the full PR matrix, 121 checks green. Batches\n  2\u20134 (#6936, #6945, #6947) each ran the Nightly Full Tests workflow twice by dispatch, once for the\n  full test suite and once for the PR Linux command suite, alongside the Migration Test Harness (15\n  historical upgrade lanes, v0.9.1 through v1.2.2 \u2192 candidate) and the managed-local proxied\n  lifecycle lane. All green at the merged heads. Batch 2's first full-suite run failed in\n  `TestHistoryDirectOnlyRefusalContract`, a release-branch-only test that still expected proxied\n  `bd dolt commit` to be refused after #6499. A test-only adaptation (`70867888f`) fixed it before\n  merge.\n- **The release pipeline completed green** (run\n  [36775172697](https://github.com/gastownhall/beads/actions/runs/36775172697)):\n  `verify-version-consistency`, both goreleaser legs (linux and macOS), both package gates (MCP and\n  npm), `publish-pypi`, `publish-npm` and release attestation. The tag-triggered Migration Test\n  Harness and Cross-Version Smoke Tests also passed. 11 assets were published: linux amd64/arm64,\n  darwin amd64/arm64, windows amd64/arm64, freebsd amd64, android arm64, the contract corpus, an SPDX\n  SBOM and checksums. Both release candidates also completed their release pipelines.\n- **Qualified against a real downstream consumer before the tag.** Gas City's v1.5.0 release branch,\n  pinned to `v1.3.1-rc.2`, ran its RC Gate twice. GitHub marks both runs failed overall. Every\n  failure was triaged, and none of them came from bd.\n  - [36621609134](https://github.com/gastownhall/gascity/actions/runs/36621609134): every Linux tier\n    passed, including the beads topology and proxied-native acceptance jobs, the bd CLI contract\n    jobs, all 29 integration shards and tutorial goldens 1\u20136. The failures were a GitHub\n    release-asset download 500, empty responses from an external inference provider, and a\n    macOS-only Gas City test-fixture symlink bug unrelated to bd.\n  - [36672304937](https://github.com/gastownhall/gascity/actions/runs/36672304937), at a\n    product-identical head with that fixture fixed: everything passed, including every macOS job,\n    except one acceptance shard. That shard did not run either attempt because of the same\n    external-provider preflight failure, and the integration and tutorial tiers that depend on it\n    were skipped. Their results carry over from the first run.\n- **The gascity-packs inference suites passed against bd `v1.3.1-rc.2`.** The full superpowers,\n  compound-engineering and bmad suites passed on the first try, the gastown suite passed, and all\n  five smokes passed (superpowers, compound, gstack, bmad, gastown). The full gstack suite did not\n  complete: its first attempt hit a host-load startup timeout and its retry hit the build deadline\n  while still iterating, with no failed step. On a proxied-server fixture, Gas City's `mol-dog-backup`\n  order synced 2/2 databases through the new proxied backup path with `unsupported: 0`, and the\n  `reaper` and `jsonl-export` orders also succeeded, with no direct Dolt access.\n\n## Installing\n\nPre-compiled binaries for Linux, macOS (Intel & Apple Silicon), Windows (AMD64 & ARM64),\nAndroid/Termux (ARM64), and FreeBSD are attached to this release.\n\n**Homebrew (macOS/Linux):**\n```bash\nbrew install beads\n```\n\n**Quick Install (macOS/Linux/FreeBSD):**\n```bash\ncurl -sSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash\n```\n\n**Windows (PowerShell):**\n```powershell\nirm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex\n```\n\n**Manual Install:**\nDownload the appropriate binary for your platform below, extract it, and place it in your PATH.\n\nWhichever method you use, run `which -a bd` afterwards. A second, older `bd` earlier in `PATH` is\nthe mixed-version fleet problem described in the v1.3.0 upgrading notes.\n\n## Contributors\n\nThanks to everyone who contributed to v1.3.1 (between `v1.3.0` and `v1.3.1`):\n\n@A3Ackerman, @aspiers, @bourgois, @harry-miller-trimble, @julianknutsen, @mattdoka, @postoso,\n@quad341, @swedeinasia-flow, @vishnujayvel\n\n<!-- Commit authors in `git log v1.3.0..v1.3.1` (A3Ackerman, harry-miller-trimble, julianknutsen,\nmattdoka, quad341 [git author Jim Wordelman, #6547], vishnujayvel), plus the original authors of\nwork carried as cherry-picks, credited by Co-authored-by trailers and mapped through the PR author\nvia `gh api`: aspiers (#5978), bourgois (#6098), swedeinasia-flow (#5859), postoso (#6026, carried\nas #6581). The \"Gas City Adopt-PR\" placeholder identity is excluded. -->\n\n**Full Changelog**: https://github.com/gastownhall/beads/compare/v1.3.0...v1.3.1\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":10}
