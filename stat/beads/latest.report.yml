-15T19:33:11Z"},{"id":566364067,"node_id":"RA_kwDOQAyAEs4hwgej","name":"beads_1.3.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":49272237,"digest":"sha256:4ce9446a68edc13202b76c84a47d66fb3dad2787b6464c9522a108faf9c1c608","download_count":709,"created_at":"2026-09-15T19:33:11Z","updated_at":"2026-09-15T19:33:13Z"},{"id":566364168,"node_id":"RA_kwDOQAyAEs4hwggI","name":"beads_1.3.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":53984039,"digest":"sha256:fa4c72c5d27f68f906e89a759656b5a051b330088c4acc38fa445cbb561e5cdf","download_count":1396,"created_at":"2026-09-15T19:33:15Z","updated_at":"2026-09-15T19:33:17Z"},{"id":566363929,"node_id":"RA_kwDOQAyAEs4hwgcZ","name":"beads_1.3.0_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":30348482,"digest":"sha256:bfd28da754f6adc271b77a5a21e59ac4053a0d794bcbe4ff6d5d8effca1bcb0d","download_count":59,"created_at":"2026-09-15T19:33:05Z","updated_at":"2026-09-15T19:33:07Z"},{"id":566378537,"node_id":"RA_kwDOQAyAEs4hwkAp","name":"checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":881,"digest":"sha256:dfc88280d6883399068195c063d05a3323752755771ea545e30e19e0bd19f503","download_count":7072,"created_at":"2026-09-15T19:40:45Z","updated_at":"2026-09-15T19:40:45Z"}],"body":"<!--\r\nSTYLE SUMMARY \u2014 extracted from gastownhall/gascity big releases (v1.3.0, v1.4.0; cross-checked v1.2.0):\r\n- Title \"# Gas City vX.Y.Z\"; optional 1-paragraph framing intro. Section order (settled template as of\r\n  v1.4.0): Highlights -> Upgrading Notes -> Added -> Changed -> Fixed -> Troubleshooting (one-command\r\n  lead + Symptom/Cause/Fix table) -> Validation -> Homebrew/install -> Contributors (+ New\r\n  Contributors with first-PR links) -> Recommended Reading (docs pinned at the tag) -> \"**Full\r\n  Changelog**: compare link\".\r\n- Bullets open with a **bolded operative sentence**, then dense narrative prose (1-5 sentences);\r\n  measured numbers are cited; refs appear inline as #NNNN / issue IDs in parentheses; commands in\r\n  backticks; fenced code blocks for recipes. No emoji outside quoted CLI output.\r\n- Breaking changes live inside Upgrading Notes as prescriptive imperatives with the exact command\r\n  (\"Run `gc doctor --fix` once per existing city\"). Tone is operator-facing, terse-but-narrative,\r\n  confident, honest about caveats and known papercuts.\r\n- Contributors: \"Thanks to everyone who contributed to vX (between `vA` and `vX`):\" + alphabetical\r\n  @handles; typical big-release length is 300-500 lines.\r\nAdaptation here: beads vocabulary (bead/wisp/clone-local plane/Dolt), a Security section (this\r\nrelease's named theme), and a \"Breaking changes for v1.2.2 users\" block because the changelog\r\ncarries the withheld [1.2.1] breaks \u2014 the analog of gascity v1.2.0's dedicated Breaking Changes.\r\n\r\nSPAN \u2014 this document covers the FULL v1.1 -> v1.3.0 arc, not just the [1.3.0] changelog section.\r\n`Added`, `Changed` and `Fixed` each carry two subsections: work that first reaches a tested release\r\nhere (the withheld `[1.2.1]` section \u2014 which IS the 1.2.0 content; there is no `[1.2.0]` section,\r\nthat tag burned pre-publish) and work new in `[1.3.0]`. The era split is consistent across all three\r\nsections so a reader can tell which release each item originally landed in.\r\n\r\nFINAL FORM \u2014 this copy is stamped for the `v1.3.0` release, not for a prerelease. It was recovered\r\nfrom the published `v1.3.0-rc.1` release body (the only surviving copy; `/data/tmp` deleted the\r\nworking file twice) and re-stamped. TWO lines carried the RC tag and have been changed: the\r\nversion/date header under the title, and the first line of `## Installing`. Everything else is\r\nwritten against `release/1.3.0` (docs links, the Full Changelog compare) so it resolves either way.\r\nOptional once the tag exists: repin the bottom compare link to `...v1.3.0` and the Recommended\r\nReading `blob/release/1.3.0/` paths to `blob/v1.3.0/` for the canonical, immutable form.\r\n\r\nThe `## Validation` section reports the v1.3.0 pipeline's actual results, plus the downstream\r\nqualification run against the release content before the tag. The `## Performance` figures are from a\r\nsingle-host measurement whose caveats are stated inline.\r\n\r\nEvery claim below traces to the merged CHANGELOG at `release/1.3.0` (`[1.3.0]`, `[1.2.1]`, `[1.1.2]`)\r\nor to a PR merged into that branch, AND was verified to still exist at the `v1.3.0-rc.1` tag\r\n(9c6a69ec1). Nothing withdrawn or later removed is advertised \u2014 in particular the `[1.2.1]` entry\r\n\"Storage backend scope simplified\" claims SQLite remains a supported storage path, which is false at\r\nthe tag, and is deliberately not reproduced. Nothing is projected.\r\n-->\r\n\r\n# Beads v1.3.0\r\n\r\n**v1.3.0** \u2014 the first tested release off `main` since the 1.1 line. Released 2026-09-15, cut from\r\n`release/1.3.0` at `f45b249ce`.\r\n\r\nWhat that means for you, concretely:\r\n\r\n- **On v1.2.2** \u2014 you are running v1.1.2-era code. You receive the entire `[1.2.1]` section (2,236\r\n  changelog lines, the largest in the file) *and* everything in `[1.3.0]`. Whole subsystems below \u2014\r\n  an HTTP API server, work leases, a durable events journal, `bd sync`, a public Go API \u2014 do not\r\n  exist in your build in any form. This is the upgrade to read the notes for.\r\n- **On v1.1.2** \u2014 identical to the above. v1.2.2 is your tree with a different version string; the\r\n  only functional difference is a forward-skew error message.\r\n- **On v1.1.0** \u2014 the same, plus the `[1.1.2]` dolt#11131 aux-row-rekey drift fix (#4380), which is\r\n  a data-availability fix and is re-listed under **Fixed** below.\r\n- **On v1.2.1** \u2014 you should not be; it is retracted. `bd` will stop with `schema version mismatch`.\r\n  Roll the schema cursor back first, per the\r\n  [recovery runbook](https://beads.gascity.com/recovery/accidental-1-2-1-release).\r\n\r\nThere is no 1.1.1 and no 1.2.0 upgrade path: both tags burned before publishing anything.\r\n\r\nRead the upgrading notes before installing.\r\n\r\n## Highlights\r\n\r\n- **beads has an HTTP API server.** `bd serve` binds a port and answers the whole work loop over\r\n  **41 OpenAPI-specified operations across 35 paths** \u2014 ready/list/get/query/count/related, stats,\r\n  dependencies (list, count, tree, blocking, cycles), config, memories, events, and the writes: claim,\r\n  claimNext,\r\n  release, close, reopen, PATCH, batchCreate, batchClose, batchApply, delete, sweep, casMetadata,\r\n  dependency add/remove. Errors are RFC 9457 `problem+json` with a frozen machine-readable `code`\r\n  vocabulary and one HTTP status per code, so a client classifies a claim conflict from a typed 409\r\n  instead of substring-matching error prose; listing pages with an opaque keyset cursor that does not\r\n  expire and survives restart; `GET /v0/beads/context` reports which operations the running build\r\n  actually implements. The spec is hand-written and checked in, the Go wire types are generated from\r\n  it, and `make api-check` fails a change that edits one without the other. **This is 100% net-new on\r\n  upgrade** \u2014 `internal/httpapi/spec/openapi.v0.yaml` does not exist at v1.1.2 \u2014 and it is the\r\n  subsystem the current release notes had been missing entirely.\r\n- **`bd serve` is deployable, not just a loopback toy** (#5516). `--auth-token-file` names a file of\r\n  accepted bearer tokens, one per line; every operation except `GET /healthz` then requires\r\n  `Authorization: Bearer <token>`, including `GET /v0/beads/context`. The file is re-read while the\r\n  server runs, so **revocation** \u2014 not just rotation \u2014 is a file rewrite with no restart, and a\r\n  failed or empty re-read keeps the last-good set. There is deliberately no `--auth-token` flag: a\r\n  credential in argv is readable out of `ps`. `--allow-non-loopback` now requires a token file, with\r\n  `--insecure-no-auth` as the explicit auditable opt-out, and `--allowed-host` extends the\r\n  DNS-rebinding allowlist. Read the omissions as contract: **there is no TLS** (the deployment\r\n  supplies confidentiality), a token is a shared secret granting the whole surface rather than an\r\n  identity, `actor` stays caller-asserted provenance, hooks do not fire on HTTP mutations, and the\r\n  surface includes destructive operations (`issues:sweep`, `issues:delete`).\r\n- **A multi-agent coordination layer, from claim to recovery.** A claim used to be permanent: a\r\n  worker that died mid-task stranded its bead `in_progress` forever with no recovery verb. Claims now\r\n  carry a lease \u2014 `lease_expires_at` (default TTL 5m) and `heartbeat_at`, schema v54 \u2014 with\r\n  `bd heartbeat <id>` to extend it, `bd reclaim --older-than <dur>` to revert expired ones back to\r\n  ready, and `bd unclaim` to give one back (#4537). Because Dolt has no row locking and merges\r\n  concurrent commits cell-by-cell, every ownership-mutating path also rewrites a shared `row_lock`\r\n  cell, forcing a racing heartbeat-vs-reclaim into a serialization conflict the retry layer replays\r\n  rather than cell-merging into a zombie claim; the same landing wrapped the work-queue hot paths in\r\n  serialization-conflict retry, so N workers draining one queue stop surfacing raw MySQL 1213/1205\r\n  errors. Leases are replica-aware: `leases.granted_node` records the granting replica and `bd\r\n  reclaim` skips a lease another replica granted unless you pass `--any-replica` (wy-jpd3.7). The\r\n  guard is opt-in and fail-open, armed by `node_id` / `BEADS_NODE_ID`, so an upgrade can never strand\r\n  a lease the reaper could previously recover.\r\n- **Compare-and-set updates close the two coordination transitions no verb could express**\r\n  (bd-wsqvw). `bd update --if-assignee` / `--if-status` apply only if the bead's current value still\r\n  equals the expected one \u2014 one atomic transaction, nothing written on a mismatch. `--if-assignee ''`\r\n  means \"expected unassigned\". A stale guard is machine-distinguishable from infrastructure failure:\r\n  **exit code 13** when every failure in the run was a guard mismatch (a racer won \u2014 skip gracefully)\r\n  versus 1 for anything else, with `\"guard_mismatch\": true` per failed entry under `--json`. That is\r\n  what makes `bd update <id> --if-assignee worker -a mayor` \u2014 reassign X\u2192Y only while X still holds\r\n  it \u2014 safe without a read-then-write race. `bd unclaim --if-assignee` is the inverse spelling, and\r\n  `claim.pools` (bd-bguz6) turns the dispatcher-fleet pattern into a one-step atomic take: aliases\r\n  listed in `bd config set claim.pools \"fable-crew,night-crew\"` become claimable by any actor through\r\n  the same compare-and-swap, while beads assigned to a real actor keep their anti-steal protection.\r\n- **`bd sync` is the federation loop as one verb** (wy-jpd3.4). Pull, detect conflicts, recompute\r\n  `is_blocked`, push, with bounded retry (default 3) when another replica wins the push race. Two\r\n  properties are the point. Conflicts are detected **positively**, from the merge's own captured\r\n  conflict rows and from `dolt_conflicts`, never inferred from the pull's exit status \u2014 a pull fails\r\n  for plenty of reasons that are not conflicts, and a settled-but-conflicted merge aborts leaving\r\n  `dolt_conflicts` empty, so an exit-status guess invents phantom conflicts and misses real ones. And\r\n  a conflict it cannot settle is **never** resolved by picking a side: it halts before recomputing or\r\n  pushing, with no `--strategy` override. The recompute between pull and push is not bookkeeping \u2014\r\n  `is_blocked` is denormalized, so a merge that brings in another replica's dependency edge leaves\r\n  `bd ready` stale until it runs, which is precisely the step a hand-rolled shell loop omits. Exit\r\n  codes are the machine contract: 0 synced, 1 error, 2 merge conflict (halted, nothing pushed), 3\r\n  push-race retries exhausted, and \u2014 new in 1.3.0 \u2014 4 for a dirty working set that is stuck rather\r\n  than busy. `bd conflicts list|show|resolve` is the companion that clears an exit-2 halt without\r\n  dropping into the raw `dolt` CLI.\r\n- **A durable events journal, and `bd events` to read it** (bd-opisf). Every committed bead mutation\r\n  writes one ordered record in the same transaction as the mutation, carrying the operation, the\r\n  mutated id, and the bead's full post-mutation snapshot including `is_blocked` \u2014 so a downstream\r\n  mirror stays correct without re-querying the graph. Off by default; opt in per workspace with\r\n  `bd config set events-journal true` or `BD_EVENTS_JOURNAL=1`. `bd events tail --since <seq>` prints\r\n  JSON lines and `--follow` streams as writes commit; `bd events export` prints from the beginning;\r\n  `bd events prune --before <seq>` takes an earlier cut. A read that cannot resume **fails rather\r\n  than lying**: a `--since` below the oldest retained record exits 1 with a typed\r\n  `events_journal_truncated` error carrying `since`, `floor` and `head`. Retention floors\r\n  (`events-journal-retain-days` 7, `events-journal-retain-rows` 100000) are enforced by a throttled\r\n  prune that can never fail a command. Scope it correctly: the journal is clone-local working-set\r\n  state (dolt_ignored) \u2014 never versioned, never pushed or federated, per branch **and** per replica,\r\n  so a checkpoint from one replica is meaningless against another. External tooling previously had\r\n  only fire-and-forget hooks (which may not run) or snapshot polling (which misses anything that\r\n  changed twice between reads); this is the third option.\r\n- **The biggest lever on agent token cost in the whole arc: `--brief` and `--brief-deps`** (#5546,\r\n  #5547, #5549, #5554, #5586). On one real 16,051-bead store `bd ready --json` returned **454,021\r\n  bytes**, with notes plus description accounting for 76% of it \u2014 on exactly the call an agent makes\r\n  to decide what to work on next. `--brief` on `bd list` and `bd ready` omits the free-form text\r\n  (`description`, `design`, `acceptance_criteria`, `notes`, `payload`, `waiters`) and measured\r\n  **93.4% smaller**. Separately, one `bd show --json` returned **214,456 bytes** of which 193,039 was\r\n  the `dependencies` array, one dependency carrying a 180,975-byte `notes` field; `--brief-deps`\r\n  projects each dependency to `id`, `title`, `status`, `issue_type`, `priority`, `dependency_type` and\r\n  measured **89.3% smaller**. Both are opt-in, both have HTTP twins (`brief`, `brief_deps`), and both\r\n  are *refused* wherever they could not be honored rather than accepted and dropped. One caveat to\r\n  design around: **the JSON response carries no marker for the omission** \u2014 an omitted field is\r\n  indistinguishable from a genuinely empty one, so only the caller that passed the flag knows its rows\r\n  are partial.\r\n- **One guided, crash-resumable migration from v53 to v66.** On an embedded or local store, the first\r\n  invocation after installing migrates your schema in place \u2014 13 main-series migrations plus 15\r\n  clone-local ones, about **28 migrations**, with the counter visibly restarting partway through (that\r\n  is the clone-local series, not a loop). Back up first, with the binary you have now.\r\n- **A shared Dolt sql-server is never auto-migrated.** Migrating one promotes the schema for every\r\n  attached client at once, so a version bump there now waits for explicit consent \u2014 `bd migrate\r\n  schema` after the fleet is upgraded, or `BD_ALLOW_REMOTE_MIGRATE=1` in scripted use (#5920, #6048).\r\n  The gate also runs on the proxied `bd serve` open path, which had been migrating shared databases on\r\n  every open, reads included (#6055), and is scoped so a server bd auto-starts for a single workspace\r\n  still migrates on open as it always has (#6088). Write commands respect a `MIGRATION-FREEZE`\r\n  sentinel with a dedicated exit code 14 (#6043), and `bd doctor` honors `--readonly` and the freeze\r\n  instead of `--fix`-ing through them (#6056).\r\n- **Data-integrity heals across the Dolt plane.** Duplicate typed dependency edges merge instead of\r\n  aborting the rekey half-applied (#6045), a legacy tracked migration-cursor table is untracked at\r\n  open so `bd dolt pull` unwedges (#6046), `bd delete` no longer wedges auto-export forever (#6059),\r\n  an ignored-series sentinel gap no longer replays the whole clone-local chain and restamps wisp\r\n  timestamps (#6054), and server-mode `DOLT_ADD`/`DOLT_COMMIT` now run after the SQL transaction\r\n  commits, ending concurrent lost updates (#6040, carrying @nova-submodules' #5740).\r\n- **Two long-standing correctness bugs that were silently costing you work.** A dated defer now means\r\n  what it says: `--until` set `status=deferred` and a timestamp, but nothing ever flipped the status\r\n  back, so an expired defer stayed invisible to `bd ready` forever \u2014 one deployment measured **241\r\n  beads, including P1s, silently dark this way**, regenerating daily from correct-looking automation.\r\n  Ready-front reads now run a lazy wake sweep first (bd-i8qx8). And `--label-any` was emitted by\r\n  `bd list` but silently dropped by `bd ready` and `bd ready --claim` on every backend, so a worker\r\n  fencing itself to its own lane (`bd ready --claim --label-any lane-a --parent epic-1`) would happily\r\n  claim another lane's bead and believe it was fenced (bd-s10oa).\r\n- **JSON contracts fixed before 1.3.0 freezes them.** String revision tokens, `--set-metadata` scalar\r\n  typing, and `bd create --json` nano timestamps (#6053); `--storage-class` wired through the proxied,\r\n  markdown, and graph create paths (#6060); journal delete and cascade rows carry the request actor\r\n  (#6061); and `GET /v0/beads/issues` gains `sort` with order-bound cursors (#5666).\r\n- **Errors tell the truth.** `bd bootstrap` probes git remotes for Dolt data instead of rejecting\r\n  them, and exits non-zero when it declines (#6037); proxied/gateway `bd init` attributes identity\r\n  safely and classifies access denials honestly (#6062); the legacy-backend tombstone names the exact\r\n  heal instead of destructive advice (#6044); a Homebrew `--HEAD` version stamp is recognized rather\r\n  than misread as `0.0.0` and routed into a `.dolt`-deleting recovery (#6079); `bd prime` says when\r\n  the memory plane could not be read (#5877).\r\n- **Security posture for the tag.** The Go toolchain moves to 1.26.7, closing seven stdlib advisories\r\n  reachable from the shipped `bd` binary, alongside dependency bumps clearing all 25 open advisories\r\n  with per-cluster reachability verdicts (#6047). Carried from the same arc: `bd dolt push` and\r\n  `bd sync` no longer adopt a git-origin-derived Dolt remote without consent (#5068), the settings\r\n  plane no longer serves the `kv.` memory plane by any read (bd-rfwtv, bd-klko9), and the no-ID\r\n  \"last touched issue\" fallback is interactive-only (#4839).\r\n- **The upgrade path is tested where it bites.** A new wisp-plane upgrade corpus seeds and asserts the\r\n  clone-local plane \u2014 wisps, leases, events, the ignored-migration cursor \u2014 that the 1.3.0 chain\r\n  actually rewrites (#6049).\r\n\r\n## Upgrading Notes\r\n\r\n- **On an embedded or local store, the first invocation migrates your schema, in place, from v53 to\r\n  v66.** A v1.2.2 (or any 1.1.x) database sits at main-series schema v53; this binary knows v66, so\r\n  the first command that opens the store applies 13 main-series migrations,\r\n  `0054_add_lease_columns` through `0066_add_events_journal_actor`. Two of those passes rewrite rows\r\n  rather than just reshaping tables \u2014 the aux-row id rekey and the `events` dolt_ignore flip described\r\n  under **Changed** \u2014 so on a large store the first invocation is *noticeably* slower than the ones\r\n  after it. It is crash-resumable and picks up where it left off, but do not interrupt it if you can\r\n  avoid it.\r\n- **A shared `dolt sql-server` is never auto-migrated** (#5920, #6048).\r\n  A server-mode database is served to every client attached to it, so migrating it promotes the schema\r\n  for all of them at once and locks out anything still on an older binary. Upgrade that server's\r\n  clients *first*, then consent once:\r\n\r\n  ```bash\r\n  # 1. upgrade bd on every client of the server; reads keep working throughout\r\n  bd version                     # on each client, confirm the new version\r\n\r\n  # 2. once, from a workspace already set up against this server:\r\n  bd migrate schema              # add --global for the shared global database\r\n\r\n  # 3. confirm\r\n  bd doctor\r\n  ```\r\n\r\n  Between steps 1 and 2 an upgraded client reads normally and its writes are refused with the gate's\r\n  guidance \u2014 nothing is silently promoted, so there is no deadline, but keep the window short.\r\n  `BD_ALLOW_REMOTE_MIGRATE=1` is the scripted, auditable standing consent, and a client *joining* a\r\n  behind-schema server is refused before its workspace is written, so join and migrate in one step\r\n  with `BD_ALLOW_REMOTE_MIGRATE=1 bd init \u2026`. If the shared server also has a Dolt remote, step 2 is\r\n  not enough: two hazards apply at once and bd requires the stronger designated-migrator consent\r\n  (`bd migrate --force` from exactly one machine, then `bd dolt push`). Recipes in\r\n  [Shared servers](https://beads.gascity.com/getting-started/upgrading#shared-servers).\r\n- **The counter restarts partway through, and that is not a loop.** The clone-local (dolt_ignored)\r\n  series runs after the main one, through the same printer and its own numbering, and it moves 0011 \u2192\r\n  0026 on this upgrade. So the run is about **28 migrations**, not 13, and what you see on stderr is\r\n  13 lines counting up to 0066 followed by 15 lines starting again at 0012:\r\n\r\n  ```\r\n  Applying migration 0065: widen_wisp_comments_text\u2026\r\n  Applying migration 0066: add_events_journal_actor\u2026\r\n  Applying migration 0012: create_leases\u2026      \u2190 clone-local series, not a restart\r\n  ```\r\n\r\n  A counter that jumps backwards is the signature operators kill runs over. Let it finish. Progress\r\n  prints only when stderr is a terminal \u2014 piped and CI runs see nothing at all, which is deliberate: a\r\n  silent-looking CI upgrade is not a stuck one.\r\n- **Back up first, with the binary you have now.** Take the backup *before* you install 1.3.0. Under\r\n  the new binary `bd export` triggers the auto-migration before it exports, so a snapshot taken\r\n  afterwards is a post-migration snapshot and cannot protect you against the migration going wrong. On\r\n  a remote-backed store, finish syncing with the old binary too: once 1.3.0 is installed the\r\n  pending-migration gate refuses `bd dolt push` and `bd dolt pull` as well, not just `bd migrate`.\r\n\r\n  ```bash\r\n  # with your CURRENT bd, before installing 1.3.0:\r\n  bd dolt push                                                   # remote-backed stores only\r\n  bd export --all -o .beads/backup/pre-1.3.0-$(date +%Y%m%d).jsonl\r\n  ```\r\n\r\n  A JSONL export is cheap, issue-complete, and importable by any bd version. If you want a Dolt-native\r\n  snapshot that keeps history and config, configure a destination and sync it \u2014 **bare `bd backup`\r\n  takes no backup**, it is a command group that prints help and exits 0:\r\n\r\n  ```bash\r\n  bd backup init <path-or-dolthub-url>   # once, to configure a destination\r\n  bd backup sync                         # take the snapshot\r\n  ```\r\n\r\n- **Upgrade every client that shares a store, together.** The forward schema-skew guard means an older\r\n  co-resident binary \u2014 a second `bd` earlier in `PATH`, a long-running `bd serve`, another clone's\r\n  cron job \u2014 refuses a database migrated past what it knows, rather than proceeding blind. That is the\r\n  guard working, not a bug, but it makes a mixed-version fleet a broken fleet: one machine running\r\n  1.3.0 takes the whole store forward and every 1.2.2 client stops. Run `which -a bd` after\r\n  installing, and on a remote-backed store follow the designated-migrator procedure (one clone migrates\r\n  and pushes; the rest pull or re-clone). See\r\n  [Upgrading](https://beads.gascity.com/getting-started/upgrading) for the per-install-method recipes\r\n  and the multi-clone flow.\r\n- **Expect your ready front to grow, and your first purge to clear more than usual.** Two fixes in\r\n  this arc surface work that was previously unreachable. Expired dated defers now wake back onto the\r\n  ready front (bd-i8qx8) \u2014 if you use `bd defer --until` at all, beads you believed would come back\r\n  have probably not been coming back, and they reappear after upgrading. And `bd purge` / `bd prune`\r\n  now select candidates by tier (#5995), so wisps minted before the `ephemeral` column was set \u2014 one\r\n  production database held 858 of them, reachable by no sweep \u2014 are finally swept.\r\n- **Dolt is the only storage backend; SQLite, PostgreSQL and MySQL are gone.** If you read the\r\n  `[1.2.1]` changelog section directly, note that its \"Storage backend scope simplified\" entry states\r\n  SQLite remains a supported storage path. **That sentence is stale and does not describe this\r\n  release.** The direct PostgreSQL and MySQL adapters were rolled back before ever entering a tagged\r\n  release; SQLite was removed in the open-core split. At the tag the supported paths are embedded\r\n  Dolt, Dolt server, and any conformance-passing backend registered through the public `backend`\r\n  package. `sqlite`, `postgres` and `mysql` survive only as *recognized-and-rejected* names so a stale\r\n  `\"backend\"` field in `.beads/metadata.json` produces a targeted heal instead of a confusing failure\r\n  (#6044), and `bd migrate legacy-sqlite --source-db PATH` is a read-only JSONL extraction path off an\r\n  old database.\r\n- **If you need to go back**, the rollback is a schema-cursor rollback, not a downgrade of the data:\r\n  the procedure is written up in the\r\n  [recovery runbook](https://beads.gascity.com/recovery/accidental-1-2-1-release) (repo copy:\r\n  `docs/recovery/accidental-1-2-1-release.md`). Its worked example is the v53\u2194v65 case from the\r\n  accidental 1.2.1 release; the steps are the same for v66, with the version numbers adjusted.\r\n- **After upgrading, `bd upgrade review` prints exactly the entries between the version you were\r\n  running and this one.** Prefer it to `bd info --whats-new`, which dumps the entire release history.\r\n  Several commands changed defaults, so read it before your first session.\r\n\r\n## Breaking changes for v1.2.2 users\r\n\r\n**This is a highlights list, not the complete set.** A v1.2.2 user is crossing two releases at once,\r\nand the breaks below are the ones most likely to stop a script or a service. The full set is the\r\n`[1.2.1]` section of the\r\n[CHANGELOG](https://github.com/gastownhall/beads/blob/release/1.3.0/CHANGELOG.md) plus the **Changed**\r\nsection here \u2014 read `[1.2.1]` in full before upgrading, since v1.2.2 withheld it and v1.2.1 itself was\r\npulled, so nobody on the supported line has seen it.\r\n\r\nCarried from [1.2.1], never shipped to v1.2.2 users:\r\n\r\n- **`bd update --status <done-status>` now enforces close policy** \u2014 open children or a live direct\r\n  blocker refuse the move, matching `bd close`. Override with `bd update --force`; an unforced refusal\r\n  rolls back the entire batch.\r\n- **`bd search` includes closed issues by default** (bd-t5yex). Narrow with `--status open` for the\r\n  old behavior; `bd list` keeps its open-only default. Note the trade: matches beyond `--limit`\r\n  (default 50) are dropped under a status-blind sort, so a broad query on a large database can now\r\n  fill the page with closed matches and silently drop open ones.\r\n- **The no-ID \"last touched issue\" fallback on `bd update` / `bd close` is interactive-only** (#4839).\r\n  A scripted `bd update $ID \u2026` with an empty `$ID` now refuses instead of mutating whatever was\r\n  touched last. Set `BD_LAST_TOUCHED_FALLBACK=1` if a script genuinely relied on it.\r\n- **`bd human list` hides done/frozen and pinned beads by default, and validates `--status`** (#5332).\r\n  A `--status` typo is now an error rather than an empty list.\r\n- **`bd dolt push` and `bd sync` no longer adopt a git-origin-derived Dolt remote without consent**\r\n  (#5068). Adoption now prompts (defaulting to no) and fails closed non-interactively; `--yes`/`-y`\r\n  consents ahead of time, and `--no-adopt` / `BD_NO_REMOTE_ADOPT=1` disables it entirely and wins over\r\n  `--yes`. **CI and cron that relied on the silent adoption will now fail closed.**\r\n- **`bd --readonly serve` is refused** instead of binding a server that cannot do what it advertises.\r\n  Anything scripted as a \"safe\" read-only server does not start after this upgrade \u2014 drop the flag.\r\n  Worth checking before you restart a long-running `bd serve` as part of the fleet upgrade above.\r\n- **`bd config list` and `GET /v0/beads/config` no longer enumerate the `kv.` plane**, which is where\r\n  `bd remember` memories live \u2014 that closed an unauthenticated endpoint handing out every stored\r\n  memory. A later landing in the same era closed point reads too: `bd config get kv.memory.<slug>` now\r\n  answers exactly as a key nothing ever stored does (echoed key, empty value, nil error), because\r\n  `bd remember` derives its key from the content it stores and the names are guessable. Use `bd kv`,\r\n  `bd recall` and `bd memories`, which read the store directly and are unaffected; `bd config\r\n  set`/`unset` still take a verbatim `kv.` key as the escape hatch for a wedged memory.\r\n- **`bd delete --force` on a team server orphans dependents instead of deleting them** (bd-x82so).\r\n  Against a proxied server `bd delete X --force` used to delete X *and* its whole dependent subtree,\r\n  and `--cascade` was refused outright. Both routes now carry the local database's meanings: plain\r\n  `bd delete X` is refused if anything outside the request depends on X, `--force` orphans dependents,\r\n  `--cascade --force` takes the subtree. **A script that relied on the implicit cascade will start\r\n  leaving orphans \u2014 add `--cascade`.**\r\n- **`bd dep cycles --json` emits a new shape** (bd-wfkbv). An array of\r\n  `{\"members\": [{\"id\", \"issue\"?}], \"partial\": bool}` where it used to emit an array of arrays of\r\n  issues. The report is also canonical now (members rotated so the lowest id leads, cycles sorted\r\n  against each other) and honest about members it cannot resolve, which previously vanished from the\r\n  path \u2014 so a three-node cycle could render as a two-node one and look complete.\r\n- **`bd list --ready` refuses a filter it cannot honor** (bd-yby99.8) instead of silently ignoring it.\r\n  `bd list --ready --id tst-d68` used to answer with every ready bead in the workspace. Refused with\r\n  `--ready`: `--id`, `--title`, `--spec`, the `*-contains` family, `--external-ref`, any date bound,\r\n  `--deferred`, `--overdue`, `--empty-description`, `--no-labels`, `--no-parent`, `--pinned`,\r\n  `--priority-min/max`. A script that passed one was *already* getting the wrong answer.\r\n- **`bd list --status=all` stops hiding pinned beads** (#5332). `all` promises every status, but the\r\n  pinned exclusion compared the raw selector string, so `all` fell through and kept forcing\r\n  `Pinned=false` \u2014 and `--status=pinned,closed` excluded the pinned beads it explicitly asked for. Add\r\n  `--no-pinned` to keep the old result.\r\n- **A dependency type is bounded at 32 characters, not 50** (bd-yby99.3). The column on both\r\n  dependency planes is `VARCHAR(32)`, so the old bound accepted a range no row could carry. In\r\n  practice nothing should notice \u2014 the longest well-known type, `conditional-blocks`, is 18 characters\r\n  \u2014 but the **error text changed**: messages that read `max 50 chars` now name 32.\r\n- **Text-input commands refuse two sources** (#5332). `bd comment`, `bd note` and `bd comments add`\r\n  used to let `--stdin`/`--file` win over positional text and drop the positional half silently; the\r\n  dropped half was, in every case found, the text the caller meant. Naming two sources is now an\r\n  error.\r\n- **`bd label add`/`remove` over many beads is no longer one atomic transaction** (ga-26w10, #5489).\r\n  `bd label add a b c mylabel` records three history entries instead of one, and a failure on the\r\n  third leaves the first two written where the old shape rolled them back.\r\n- **`--dolt-auto-commit batch`/`off` actually defer version commits in SQL-server mode** (bd-4wamg).\r\n  The mode was silently inert there. If you explicitly configured `dolt.auto-commit: off`, it was\r\n  behaving like `on`; it now genuinely stops minting version commits until an explicit\r\n  `bd dolt commit`. Proxied-server routes never apply auto-commit policy, so batch/off remain inert\r\n  there.\r\n- **The published `backend` package drops orphan handling** (bd-gwryr). A Go consumer that names\r\n  `backend.OrphanHandling` or its constants no longer compiles. Delete the option \u2014 every call site\r\n  passed `OrphanAllow`, which is exactly what the code still does.\r\n- **`bd purge` / `bd prune` version-control messages changed** (bd-pn231). The entry is now\r\n  `bd: sweep <n> <tier> bead(s)` on both routes, replacing `bd: prune <n> bead(s)` and\r\n  `bd: delete <n> issue(s)`.\r\n\r\nNew in 1.3.0 (full entries under **Changed**):\r\n\r\n- **`--profile` is now `--cpu-profile`, with no alias** (#5126). The old spelling fails as an unknown\r\n  flag rather than silently doing nothing.\r\n- An explicitly configured Dolt server port now outranks the ambient `BEADS_DOLT_PORT` environment\r\n  variable.\r\n- Actor matching decodes an exact `--` run to `/` instead of collapsing it to a generic separator, so\r\n  `gastown--mayor` matches `gastown/mayor` and stops matching `gastown__mayor`.\r\n\r\n## Added\r\n\r\n### First shipped on a tested release here \u2014 the withheld [1.2.1] work\r\n\r\n- **`bd serve` \u2014 the beads work surface over HTTP** (bd-serve v0; #5410, #5417, #5422, #5423, #5429,\r\n  #5506, #5507, #5508, #5510, #5535, #5536, #5540). One process answering **41 OpenAPI-specified\r\n  operations across 35 paths** instead of a `bd` subprocess forked per call. Reads: `context`,\r\n  `ready`, `issues`\r\n  (list, get, query, count, related, comments), `stats`, `dependencies` (list, count, tree, blocking,\r\n  cycles), `config` and `config/{key}`, `memories`, `events` and `events:watch`. Writes: `:claim`,\r\n  `:claimNext`, `:release`, `:close`, `:reopen`, `PATCH /issues/{id}`, `:batchCreate`, `:batchClose`,\r\n  `:batchApply`, `:delete`, `:sweep`, `:casMetadata`, `dependencies:add`/`:remove`. Close and reopen\r\n  are idempotent and say so in the *body* (`already_closed: true`) rather than in a status. `PATCH`\r\n  publishes nineteen members, four of them nullable where an explicit `null` clears them \u2014 a closed,\r\n  machine-checked set, so a `null` on any other member is a 400 rather than an unannounced clear.\r\n  `expected_version` on close/reopen/delete plus `revision` on the detail read give the row's\r\n  optimistic-concurrency token, so a read-modify-write loop can start from a *read* rather than seeding\r\n  its first guard from a write it did not want to make. Two operating caveats: an **embedded-Dolt\r\n  workspace is permanently refused** (that backend commits outside the SQL transaction, so per-request\r\n  atomicity would be a lie), and `--addr 127.0.0.1:0` takes an ephemeral port with no mutual exclusion\r\n  \u2014 pass an explicit port. Probe readiness with `GET /v0/beads/ready?limit=1`; `/healthz` is liveness\r\n  only and stays green while the database is unreachable.\r\n- **Bearer authentication and a supported beyond-loopback deployment for `bd serve`** (#5516). See the\r\n  Highlights entry for the full posture. `BEADS_SERVE_TOKEN_FILE` is the environment fallback;\r\n  `401`/`unauthenticated` joins the frozen code vocabulary with a fixed `detail` that never echoes the\r\n  presented credential, and missing header, wrong scheme and unknown token are deliberately one code.\r\n- **`Bd-Project-Id` request stamping, and the `project.enforce` capability.** A client that knows which\r\n  workspace it means to address stamps the request with that workspace's project id; a server serving a\r\n  different one refuses **before any database work**, so a misdirected read or write mutates nothing.\r\n  An absent header is served exactly as before, so this is additive wire surface, not a new\r\n  precondition. `GET /healthz` and `GET /v0/beads/context` are exempt \u2014 liveness must answer whatever\r\n  workspace a caller believed it reached, and the handshake is where a client *learns* the id to stamp\r\n  with. The refusal is the only one carrying `server_project_id`, so its presence is the signal that\r\n  this check fired rather than the Host gate or a deployment's auth layer.\r\n- **Work leases: `bd heartbeat`, `bd reclaim`, `bd unclaim`** (#4537, schema v54, migration\r\n  `0054_add_lease_columns` \u2014 the first of the 13 main-series migrations this upgrade applies). See\r\n  Highlights. `bd reclaim` also takes the full claim-side scope surface \u2014 `--label`, `--label-any`,\r\n  `--exclude-label`, `--assignee`, `--id` (wy-jpd3.3) \u2014 so a supervisor can point its reaper at exactly\r\n  the partition it claims from; filters AND-combine and never widen the stale set, and a scope flag\r\n  supplied with no usable value is a hard error rather than a silent degrade into a global sweep.\r\n- **Replica-aware leases** (wy-jpd3.7, ignored migration 0016). `leases.granted_node` rides the JSONL\r\n  interchange so an imported lease keeps its provenance, and `--any-replica` is the escape hatch for a\r\n  replica that is permanently gone. Deliberately no hostname fallback: on a shared `dolt sql-server`\r\n  many hosts are clients of *one* store, and a hostname guard there would stop a supervisor reaping any\r\n  worker's lease at all. Documented limitation: a heartbeat proves the holder is alive, not that the\r\n  lease moved, so `granted_node` is backfilled but never overwritten \u2014 a renamed replica keeps reading\r\n  foreign and is recoverable only with `--any-replica`.\r\n- **`bd sync` \u2014 the federation loop as one verb** (wy-jpd3.4), and **`bd conflicts list|show|resolve`**\r\n  (wy-jpd3.5) as the companion that clears an exit-2 halt. `bd conflicts show` renders each conflicted\r\n  row field by field (only disagreeing fields unless `--all-fields`); `bd conflicts resolve` takes\r\n  named beads row by row or whole tables with `--all`, via `--ours`/`--theirs`/`--strategy`, then\r\n  concludes the merge. Note `bd conflicts` is **not supported in proxied-server mode**.\r\n- **Compare-and-set updates: `bd update --if-assignee` / `--if-status`** (bd-wsqvw, epic wy-mdi5h). See\r\n  Highlights. Guards require a field update to ride on, are mutually exclusive with `--claim` (its own\r\n  CAS), and compose with each other and with the engine's `ExpectedVersion` row CAS. Library consumers\r\n  get them through new `UpdateIssueOptions.ExpectedAssignee`/`ExpectedStatus` on the existing\r\n  `UpdateIssueChecked` \u2014 no interface change. An out-of-tree `Storage` implementation that ignores the\r\n  new fields simply does not enforce them, and should add support before advertising guard semantics.\r\n- **Pool-aware claiming via the `claim.pools` config key** (bd-bguz6). Off by default; with no\r\n  `claim.pools` configured, behavior is unchanged. One gotcha: if a pool take's lease expires,\r\n  `bd reclaim` returns the bead to the **unassigned** pool, not to the pool alias it was dispatched to.\r\n- **A durable events journal, and `bd events tail|export|prune`** (bd-opisf). See Highlights. HTTP\r\n  twins are `GET /v0/beads/events` and a streaming `GET /v0/beads/events:watch`. Not journaled, by\r\n  design: `bd dolt pull`, merge-settled changes, raw `bd sql` DML, store-open migrations and compaction\r\n  rewrites. Size the retention floors for the longest outage a consumer must survive \u2014 they are a\r\n  recent-window guarantee, not a consumer watermark. Reference:\r\n  [`docs/reference/events-journal.md`](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/reference/events-journal.md).\r\n- **A public Go API: the `backend` and `issueops` packages plus a conformance suite** (bd-h3dib.2,\r\n  #4415, bd-yby99, #4911, facade waves 1\u20134). See Highlights. Note the `beads.Storage` interface gained\r\n  required methods across this arc (`IssueClaimer()`, `IssueReader()`, `ReadyClaimer()`,\r\n  `BatchCloser()`, `DependencyEditor()`, `Commenter()`, `IssueRelations()`, `UpdateIssueChecked`,\r\n  `MergeMetadata`) \u2014 callers are unaffected, but any external type that *implements* it must add them\r\n  to compile.\r\n- **`--brief` on `bd list` / `bd ready` and `--brief-deps` on `bd show`** (#5546, #5547, #5549, #5554,\r\n  #5586), with `brief` / `brief_deps` on the HTTP twins. See Highlights for the measurements. Refused\r\n  where it could not be honored: on `bd ready` it requires `--json` and is refused with `--claim`,\r\n  `--gated`, `--mol` and `--explain`; on `bd list` it works in text mode but is refused with\r\n  `--watch`, the `--parent` tree walk, and `--format`, where a caller's template could print a dropped\r\n  field with nothing to mark it. Text mode carries the single visible marker: `bd list --long --brief`\r\n  prints `Description: (omitted by --brief)`.\r\n- **`--max-rows` on the walking reads, plus `BEADS_MAX_ROWS`.** A hard upper bound on rows returned by\r\n  `bd list`, `bd ready`, `bd graph`, `bd dep tree` and `bd find-duplicates`, exiting 2 when exceeded; 0\r\n  disables. Honored on both the direct and the proxied-server route. A circuit breaker for CI and agent\r\n  rigs against one bad filter returning a multi-hundred-megabyte result, settable fleet-wide by\r\n  environment.\r\n- **`bd provenance record|log|by-ref` \u2014 an append-only provenance event log** (#4461). Records typed\r\n  bindings from a bead to an opaque external artifact: `--kind` (cut, claim, suspend, resume, handoff,\r\n  commit, land, used), `--source`, `--ref` with `--ref-kind` (git-sha, pr, work-id, transcript,\r\n  branch). Append-only \u2014 no update, no delete \u2014 and **idempotent** on a deterministic id computed from\r\n  `source:issue:kind:(ref or --at)`, so a git hook or CI job that fires twice is harmless. beads never\r\n  interprets the actor or the ref; only kind and ref-kind are structurally validated. This is the\r\n  supported way to bind beads to commits, PRs and transcripts without abusing labels or metadata.\r\n- **`bd schema` \u2014 a published JSON Schema for `--json` and export output** (#5098). Reflected from the\r\n  same Go structs bd actually serializes, so it cannot drift from the real output; named string enums\r\n  carry their allowed values and referenced types are inlined, so each record schema is self-contained\r\n  and directly consumable by codegen (`bd schema | jq '.types.issue'`). Runs without a workspace or\r\n  database. Reference:\r\n  [`docs/reference/json-schema.md`](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/reference/json-schema.md).\r\n- **Cursor agent hooks, and Cursor at parity with Claude Code and Codex.** `bd setup cursor` installs\r\n  `.cursor/hooks.json` alongside the rules file, wiring three lifecycle events to a hidden\r\n  `bd cursor-hook`: `sessionStart` injects full `bd prime` context into every new agent session,\r\n  `preCompact` arms a one-shot refresh marker, and `postToolUse` re-injects `bd prime` exactly once\r\n  after a compaction then no-ops \u2014 so beads context survives compaction instead of being forgotten\r\n  mid-session. Existing user hooks are preserved and `--remove` only removes the beads-managed entries.\r\n  Parity work rides along: `bd init` auto-installs Cursor the way it already does Claude Code and\r\n  Codex; `--global` writes `~/.cursor/hooks.json` and the agent skill to `~/.agents/skills/beads`;\r\n  `.cursor/rules/beads.mdc` now wraps the shared `recipes.Template` instead of a hand-maintained copy\r\n  that drifted; and `bd doctor` reports `Cursor Integration`, `Cursor Settings Health` and `Cursor Hook\r\n  Completeness`. Verified on the Cursor 2026.06 line; early-2026 CLI builds only fired shell hooks.\r\n- **Vendor-neutral credential resolution for a protected or gateway database.** A new credential seam\r\n  resolves what bd uses to open a protected database at command time, backend- and issuer-neutral: a\r\n  source yields either a secret that lands in the password slot of a direct connection, or an identity\r\n  presented as the connection username to an authenticating gateway, and an ordered ladder takes the\r\n  first configured hit and fails closed when a configured source errors. The built-in rung is the\r\n  standard credential-process idiom (kubectl `ExecCredential`, AWS `credential_process`, git credential\r\n  helper): the command's stdout is a short-lived token, bare or in a `{token,expirationTimestamp}` /\r\n  `{access_token,expires_in}` envelope. Configured via `BEADS_DOLT_CREDENTIAL_COMMAND` \u2014 **environment\r\n  only, deliberately not `metadata.json`**, because a metadata-sourced command is arbitrary code run on\r\n  open. The credential's kind is decided by the config slot that produced it and never inferred from\r\n  the value, so an identity token can never be mistaken for a password.\r\n- **`bd migrate --force`, and automatic fast-forward when a remote-ahead adopt is provably loss-free**\r\n  (#4259, #4516). `bd migrate --force` (and `bd migrate schema --force`) is the CLI twin of\r\n  `BD_ALLOW_REMOTE_MIGRATE=1` for the single designated migrator, and it is process-local so it cannot\r\n  leak into child processes (git hooks, dolt subprocesses) the way an exported variable does.\r\n  Separately, when the smart gate finds the remote ahead with no content skew, this clone's local Dolt\r\n  history a strict ancestor of the remote's with a clean working set, **and** the fast-forward would\r\n  land exactly at this binary's own latest migration, bd fast-forwards automatically rather than\r\n  stopping with an adopt directive \u2014 nothing local is discarded. An unpushed local commit, a dirty\r\n  working set, or a remote not exactly at this binary's latest migration all disqualify it and fall\r\n  back to the manual adopt directive, never a forced write. `BD_SMART_GATE=0` opts out. Directly\r\n  relevant on upgrade day, when every clone is behind at once.\r\n- **`bd dolt clean-databases --purge-dropped`, including in proxied-server mode** (be-pq5, #3663,\r\n  p1-9lf). `DROP DATABASE` only moves a database's directory under `.dolt_dropped_databases/`; Dolt\r\n  keeps the data there \u2014 recoverable via `CALL DOLT_UNDROP(name)` \u2014 until an explicit purge, so disk\r\n  usage on a shared server stayed high across repeated cleanup runs. The flag runs that purge, and\r\n  fires even on a run that finds nothing stale, since a prior run's residue is not visible to\r\n  `SHOW DATABASES`. **Read the warning as written:** `CALL DOLT_PURGE_DROPPED_DATABASES()` is\r\n  server-global and irreversible \u2014 Dolt cannot scope it to the databases a given run dropped, so this\r\n  also permanently deletes every other dropped-but-unpurged database on the server and removes\r\n  `DOLT_UNDROP` recovery for all of them. It defaults to off for exactly that reason.\r\n- **Deployment-mode migration commands, and `bd migrate legacy-sqlite`.** Four `bd migrate` mode-switch\r\n  subcommands move a workspace between Dolt deployment modes in place \u2014 `from-server-to-proxied-server`,\r\n  `from-proxied-server-to-server`, and the two shared-server variants \u2014 all marked **experimental**.\r\n  Both proxied-server and server mode root their `dolt sql-server` at the same `.beads/dolt` directory,\r\n  so the switch is a config change rather than a data move. This matters because `bd serve` refuses\r\n  embedded Dolt: these are the supported route from the default workspace mode to one that can serve\r\n  HTTP. `bd migrate legacy-sqlite --source-db PATH --output PATH|-` reads an authenticated legacy SQLite\r\n  database read-only and emits JSONL. `bd migrate-personal` moves your own planning beads out of a\r\n  project database into your personal planning repo.\r\n- **New global flags: `--no-color`, `--database`, `--mem-profile`.** `--no-color` also honors\r\n  `NO_COLOR=1` / `CLICOLOR=0`. `--database` runs a single invocation against a different server\r\n  database without changing the project's configured database (proxied-server mode only) \u2014 and note the\r\n  paired semantic shift: in proxied-server mode a `--db` value that is not an existing path is now\r\n  treated as a database-name override. `--mem-profile FILE` writes a heap profile on exit (also\r\n  `BEADS_MEM_PROFILE`).\r\n- **New `bd init` deployment flags**, all experimental where marked: `--team-server` (the shared\r\n  database's schema is managed externally; bd never creates the database or runs migrations, only\r\n  verifies the schema version \u2014 proxied-server mode only), `--server-tls` (require TLS for the\r\n  init-time Dolt server connection; **not persisted**, so set the environment or credentials for\r\n  subsequent commands), `--proxied-server-port`, `--proxied-server-idle-timeout` (default 30s; 0 keeps\r\n  the proxy alive indefinitely), and the `--proxied-server-external-tls-*` trio.\r\n- **Assorted new flags across existing commands.** `bd create --storage-class\r\n  {versioned|unversioned|ephemeral}`, `--status`, `--allow-empty-description`; `bd list\r\n  --deps[=scheduling|all]`, `--external-ref`, `--external-contains`; `bd ready --label-regex`,\r\n  `--label-pattern`; `bd graph --open`; `bd status --no-blocked` (not supported in proxied-server\r\n  mode); `bd export --exclude-owner` (repeatable; also reads `export.exclude_owners`) and `--verbose`;\r\n  `bd prime --no-memories`, `--max-memories`, `--max-memory-chars` \u2014 agent context budget is now\r\n  tunable; `bd types --sections`; `bd history --events`; `bd prune --ignore-references`; `bd q\r\n  --parent`; `bd human respond --file`/`--stdin`; `bd worktree remove --merged-into`; `bd dolt pull\r\n  --strategy`; `bd dolt remote reset-data` (the recovery step after a history squash, where a plain\r\n  push cannot advance a rewritten history); and `bd formula schema`, which prints every exported struct\r\n  a `.formula.toml`/`.formula.json` can declare, generated from source so it cannot drift.\r\n\r\n### New in [1.3.0]\r\n\r\n- **The events journal records WHO performed each mutation.** `bd_events_journal` gains an `actor`\r\n  column (migration 0066 plus its ignored-series twin 0025), stamped inside the mutating transaction\r\n  with the same identity the audit-events table resolves. `bd events tail` / `bd events export` JSON\r\n  gains an additive, omit-when-empty `actor` field \u2014 empty means the path had no actor, never a user.\r\n  Delete and cascade `dep_remove` rows carry the request actor too, and reading a disabled journal now\r\n  says so instead of returning silence (#6061, #5985).\r\n- **`sort` on `GET /v0/beads/issues`** (#5666). Two values, and the set is closed: `created` (the\r\n  existing order, now spellable) and `priority` (`bd list`'s flagless ordering) \u2014 measured over a\r\n  1400-row store at the 200-row page an HTTP client actually uses, `?sort=priority` turns a 7-request\r\n  page-and-resort walk into 1 request. Cursors are now `v2` tokens that carry their order, and a cursor\r\n  replayed under a different `sort` is refused as `invalid_cursor` instead of silently paging a\r\n  different total order; outstanding `v1` tokens stay readable, so no traversal in flight has to\r\n  restart. Absent `sort` still means `created`, permanently.\r\n- **`bd` warns when it stores a label containing a space** (#5813). `-l 'good first issue'` is stored\r\n  as asked, but a missed comma looks identical at the point of writing, so a stderr line catches it at\r\n  the keystroke: `\u26a0 Stored \"auth backend\" as ONE label \u2014 it contains a space.` Advice, not an error;\r\n  `--quiet` silences it. `bd doctor` gains a matching warn-only `Label Whitespace` check, and `bd\r\n  doctor --fix` repairs damage already in the database.\r\n- **`bd stale` and `bd blocked` gain `--label`, `--label-any` and `--exclude-label`** (#5822), with the\r\n  same meanings they already have on `bd list` and `bd ready`. Filtering happens in SQL ahead of\r\n  `LIMIT`, so `--label x --limit 10` returns ten matching beads.\r\n- **New `*.gate.lock` files appear next to and inside `.beads`** (#5046, #5093). A two-level\r\n  cooperative flock gate serializes operations that cannot safely overlap \u2014 ordinary commands take it\r\n  shared, maintenance like `bd backup restore` takes it exclusive. The files are the lock's *name*, not\r\n  its state: created once and deliberately never deleted. Both are covered by the `*.gate.lock*`\r\n  gitignore pattern `bd doctor` maintains.\r\n- **A wisp-plane upgrade corpus** (#6049). Neither upgrade harness had ever seeded a wisp, so the\r\n  clone-local plane the 1.3.0 chain rewrites \u2014 `wisps`, `wisp_dependencies`, `wisp_comments`, `leases`,\r\n  `events`, and the ignored-migration cursor \u2014 used to reach the candidate binary empty. A new lane\r\n  seeds those classes and asserts them across the upgrade, including detection of an ignored-track\r\n  replay the old harness was structurally blind to.\r\n\r\n## Changed\r\n\r\n### First shipped on a tested release here \u2014 the withheld [1.2.1] work\r\n\r\n- **`bd search` includes closed issues by default** (bd-t5yex). The dominant real-world query is \"was\r\n  this already found/filed/fixed?\", exactly the query where silently excluding closed beads produced a\r\n  false \"no\" \u2014 downstream repos had grown shell wrappers purely to undo the old default. `bd list`\r\n  keeps its open-only default, and `bd query` (plus the HTTP `q=` endpoint) deliberately keeps its\r\n  closed-exclusion default with opt-in `--all`. Applies to both the embedded and proxied-server paths.\r\n- **Cross-type blocking dependencies are now allowed** (bd-wg7ve, #4034, supersedes GH#1495).\r\n  `bd dep add <task> <epic>` \u2014 gating a work item on an epic completing \u2014 used to fail with a\r\n  backwards-reading error. The blanket same-type rule is replaced by a hierarchy deadlock guard that\r\n  rejects only the cases that actually wedge the graph: gating a bead on its own **ancestor** (which\r\n  cannot close until its descendants finish) or on its own **descendant** (blocked status cascades down\r\n  to the very bead that must close to clear the gate). Sibling ordering edges stay allowed, and the\r\n  guard now covers `conditional-blocks`, which previously skipped cross-type validation entirely. A\r\n  task gated on an epic becomes ready when the epic closes. Over HTTP the refusal is\r\n  `409 dependency_cycle` carrying `issue_id`, `blocker_id` and `blocker_is_ancestor`; the **absence** of\r\n  those members is what tells a client it got a plain scheduling cycle instead.\r\n- **`bd delete` is one transactional role across every route.** Existence probe, dependents guard,\r\n  cascade expansion, deletion and the `[deleted:ID]` reference rewrite now run as one transaction on a\r\n  shared role used by the direct route, the proxied route and `bd serve`. Consequences beyond the\r\n  team-server break listed above: `bd delete --cascade` on a wisp no longer marks **live** beads as\r\n  deleted in other beads' text (the rewrite set was computed differently from the delete set, and\r\n  `bd wisp gc` ran exactly this path), a one-id delete without `--force` refuses when the bead has an\r\n  outside dependent instead of printing a preview and exiting 0, and the whole request is refused when\r\n  any id names no bead. Know the trade: the transaction is now as large as the deletion plus its graph\r\n  neighbourhood, so a delete whose neighbourhood exceeds the backend write timeout fails **whole**\r\n  rather than deleting rows and leaving stale text \u2014 split very large `--from-file` batches. Text\r\n  already corrupted by earlier builds is not repaired.\r\n- **`bd purge` and `bd prune` select and delete in one transaction** (bd-pn231). The count a sweep\r\n  reports is now the set it deleted; previously a bead closed between the two transactions could be\r\n  counted and not deleted, or deleted and not counted. Same trade as above: the Dolt server backend can\r\n  no longer batch wisp deletions 200 at a time, so a purge big enough to exceed Dolt's write timeout\r\n  now fails whole instead of deleting part of the workspace and reporting nothing \u2014 sweep in slices\r\n  with `--pattern` or `--closed-before`. Over HTTP, `POST /v0/beads/issues:sweep` defaults\r\n  `protect_referenced` to **true** where the CLI's `--ignore-references` is opt-out, on purpose: being\r\n  authenticated says nothing about whether this particular deletion was meant.\r\n- **`bd create --file` is all-or-nothing, and its plan-wide flags now mean something** (bd-lu170). Both\r\n  routes build one batch request on a shared role, so a markdown plan is created as one act with one\r\n  history entry on either. A file the workspace refuses now creates **nothing** \u2014 each template goes\r\n  through the same validation a single `bd create` goes through \u2014 and a declared dependency on an id\r\n  that does not exist is an error rather than a silently dropped edge, which is how a plan file with a\r\n  typo used to produce a graph that looked complete and was not. `--ephemeral`, `--no-history`,\r\n  `--mol-type` and `--validate` are now honoured on the direct route, where all four were accepted and\r\n  silently ignored while the proxied route acted on them. **Re-running a file that used to fail can\r\n  give a different outcome**, because the earlier run may have landed rows this one refuses to\r\n  duplicate \u2014 check `bd list` before re-running a plan that errored on an older version. `bd create\r\n  --graph` is untouched.\r\n- **`bd serve` runs on a registered storage backend, and `context` stops guessing.** `bd serve` alone\r\n  used to reimplement a creation path hard-wired to Dolt's SQL wire; it now uses the store the root\r\n  command already opened, through the same registry dispatch \u2014 one creation path rather than two, with\r\n  the startup line naming both source and backend. Relatedly, the shared identity projection behind\r\n  `GET /v0/beads/context` and `bd context` hardcoded `backend: dolt` and copied `dolt_mode` and\r\n  `database` unconditionally, so a registered-backend workspace was confidently reported as\r\n  `backend=\"dolt\"`, `dolt_mode=\"embedded\"`, `database=\"beads\"` on the one endpoint automation is told to\r\n  trust for a server's identity. The backend is now named as the store open resolves it, which also\r\n  closes a latent `CGO_ENABLED=0` bug where a registered workspace was handed to the Dolt provider and\r\n  either failed with a misleading error or connected to a defaulted host and served the **wrong\r\n  database**.\r\n- **Field-level three-way auto-merge on pull.** beads stamps `issues.updated_at` on every mutation, so\r\n  any two edits to the same bead on two replicas between syncs collide on that cell even when the\r\n  semantic fields are disjoint \u2014 machine A adds a comment, machine B adds a label, and the row conflicts\r\n  on nothing but the timestamp both bumped. The observed conflict rate was therefore far higher than the\r\n  semantic-conflict rate, and the row-level last-write-wins resolver could only take the safe half of\r\n  it: it declined whenever both sides had moved `updated_at` past the merge base, because taking one\r\n  side's whole row would drop the other side's field edits. A field-level three-way merge now encodes\r\n  beads' actual write semantics \u2014 a column only one side changed relative to the merge base keeps that\r\n  side's value, and only a genuinely contested cell falls to last-write-wins. Reached through\r\n  `bd dolt pull` and `bd sync`; there is no flag.\r\n- **`bd label add`/`remove` over many beads is no longer one atomic transaction** (ga-26w10, #5489).\r\n  Both routes now end at the shared lifecycle and reader roles, deleting the four-way\r\n  `(add|remove) \u00d7 (wisp|durable)` switch the proxied route hand-rolled below them. The deliberate\r\n  delta: a multi-bead edit is N guarded updates rather than one raw transaction, so it records N history\r\n  entries and a failure partway leaves earlier edits written. Neither shape is obviously right \u2014 the new\r\n  one attributes each edit to its own bead and lands what it could \u2014 but a script that depended on\r\n  all-or-nothing label edits needs to know the guarantee changed. `bd label list-all` and\r\n  `bd label propagate` are unchanged and deliberately stay off the role.\r\n- **Text-input commands refuse two sources, and `bd human` matches `bd list`** (#5332). See the breaking\r\n  list for `bd comment`/`bd note`/`bd comments add` and `--status=all`. Alongside them: `bd human\r\n  respond` gains the same input layer (`--response` is no longer required) and `bd human dismiss` takes\r\n  its reason positionally; `bd human list` matches `bd list`'s status handling while hiding **no** bead\r\n  type, because a `human` label is an explicit request for a person's attention; and `bd human stats`\r\n  classifies dismissals by the `Dismissed` close-reason **prefix** shared as one constant with\r\n  `bd human dismiss`, instead of matching the substring `dismiss` anywhere in the reason. Beads closed\r\n  before this with a lowercase or mid-string \"dismiss\" move from the Dismissed count to the Responded\r\n  count.\r\n- **`--dolt-auto-commit batch`/`off` actually defer version commits in SQL-server mode** (bd-4wamg). The\r\n  mode was silently inert there: the CLI's policy was embedded-only and the storage layer minted one\r\n  Dolt commit inside every write transaction regardless \u2014 measured at one commit per write through all\r\n  five configuration paths. The write verbs now thread the deferral to the storage layer's commit sites\r\n  in server and embedded mode alike. The server-mode **default changes spelling, not behavior**: it used\r\n  to resolve to `off` while behaving like `on`, and now resolves to `on`, naming what a default\r\n  server-mode write has always done. On a shared server, staging is table-level, so an `on`-mode writer's\r\n  commit may sweep up another client's deferred rows \u2014 deferral bounds who *creates* commits, not commit\r\n  contents.\r\n- **The PostgreSQL and MySQL adapters were rolled back before entering a tagged release** (bd-sadcd).\r\n  The rationale is worth stating because it is the shape of the storage story: dialect, credential,\r\n  schema-lifecycle, migration, CI and operational complexity, against a project whose version-control\r\n  semantics are Dolt's. An existing PostgreSQL or MySQL workspace stops **before** its configured\r\n  database is opened or modified. See the Upgrading note above for what the supported storage paths\r\n  actually are at this tag.\r\n\r\n### New in [1.3.0]\r\n\r\n- **Shared stores refuse version-bump migration without explicit consent** (#5920, #6048, #6055, #6088;\r\n  closes the gate leg of #5043). Embedded and single-user databases still auto-migrate silently, and\r\n  fresh databases still migrate on creation \u2014 creating a database is consent for its schema. But a\r\n  shared `dolt sql-server` accepts co-resident clients by construction, so a version bump there refuses\r\n  instead of taking the whole fleet's schema forward as a side effect of one upgraded client; the smart\r\n  gate's \"safe first-mover\" and auto-fast-forward arms are embedded-only for the same reason (#4516).\r\n  The gate now also runs on the proxied `bd serve` open path, which had been migrating shared databases\r\n  on every open \u2014 including from read commands \u2014 since v1.2.2: read commands warn and continue, writes\r\n  refuse, `bd serve` fails to start until the schema is reconciled, `bd migrate schema` works in proxied\r\n  mode instead of refusing, and gate failures print their full actionable block instead of one truncated\r\n  line. **\"Shared\" is drawn deliberately** (#6088): shared-server mode, an operator-managed server, a\r\n  remote host, a TLS endpoint, a unix socket, or no workspace at all \u2014 a server bd auto-starts for a\r\n  single workspace is a database no other client can observe, and migrates on open as it always has.\r\n- **`bd doctor` respects `--readonly` and the migration freeze** (#6056; fixes #6028). `bd doctor --fix`\r\n  previously mutated workspaces that strict `--readonly` and an active freeze had both declared\r\n  off-limits \u2014 and plain `bd doctor`, with no `--fix` at all, could rewrite `.local_version` or\r\n  auto-migrate a frozen store as a side effect of diagnosis. Both bypasses are closed, with no\r\n  doctor-side override, and both gates key on the directory doctor was pointed at rather than only the\r\n  one it was launched in.\r\n- **Write commands refuse to run while a `MIGRATION-FREEZE` marker is present** (dc-6jaq, #6043).\r\n  Discovery is generic: the marker is found in the workspace directory, the working directory, or any\r\n  ancestor of either, and `BD_MIGRATION_FREEZE_FILE` is authoritative when set. Every write command\r\n  (~120 call sites, `bd q` included), plus `bd init --reinit-local` and `bd bootstrap`, prints\r\n  `\u26d4 workspace is frozen for migration` naming the marker's own path and exits **14**\r\n  (`ExitMigrationFrozen`) instead of a generic 1. Read commands keep working, and bd's own maintenance\r\n  stands down with them \u2014 auto-migration, JSONL auto-import, Dolt auto-commit, auto-backup, auto-export\r\n  and auto-push are all skipped, so a frozen store is never rewritten just because someone ran a read.\r\n  **A running `bd serve` is not gated: stop it before freezing.**\r\n- **Migration 0061 rekeys every events, comments, snapshot and compaction-snapshot row to a\r\n  content-derived id** (#5150). Random UUIDv7 ids never converged under newest-wins replication; ids are\r\n  now UUIDv5 over the row's own content, so the same fact derives the same id everywhere. Existing rows\r\n  are converted by a one-time, crash-resumable bulk rekey on the first open after upgrade \u2014 the main\r\n  reason that invocation is slower. **Any external reference to an event, comment or snapshot id taken\r\n  before the upgrade will not resolve afterwards.**\r\n- **The `events` audit table is now clone-local** (#5162). Migration 0062 moves `events` onto the\r\n  dolt_ignored plane, preserving every row. Events keep full SQL durability locally and\r\n  `bd history <id> --events` still reads them, but **`events` rows no longer replicate** \u2014 minting a\r\n  versioned Dolt commit per audit row was the dominant source of commit churn on a busy store. Comments\r\n  stay versioned.\r\n- **The `interactions.jsonl` audit sidecar is opt-in** (#4688). `audit.enabled` defaults to false and\r\n  `bd init` no longer creates the file; the database-backed replacement is `bd history <id> --events`.\r\n- **Auto-backup defaults to off under a Dolt sql-server** (wy-zrmqr) \u2014 on one shared server, ~31 clients\r\n  had each independently decided to back up the same database. Embedded mode is unchanged; an explicit\r\n  `backup.enabled` always wins, and `bd config get backup.enabled` now prints the effective value with\r\n  its source.\r\n- **`--profile` is now `--cpu-profile`, with no alias** (#5126). The old spelling fails as an unknown\r\n  flag instead of silently doing nothing.\r\n- **`bd import` refuses a redirected stdin rather than quietly ignoring it** (#5171).\r\n  `bd import < file.jsonl` looked like `bd import -` and behaved like bare `bd import`; it now errors\r\n  and names both fixes.\r\n- **`bd hooks install --chain` and `--force` are accepted no-ops** (#5284). Managed marker sections\r\n  always preserve content outside them and always keep an existing hook running alongside the bd\r\n  section; symlinked and git-tracked hook paths are refused before anything is written.\r\n- **An explicitly configured Dolt server port now outranks the ambient\r\n  `BEADS_DOLT_SERVER_PORT`/`BEADS_DOLT_PORT` environment variables** (GH#4052). A port asserted by the\r\n  user \u2014 `bd init --server-port`, config, a library caller \u2014 is no longer silently replaced by whatever\r\n  the surrounding shell exported, and the legacy `BEADS_DOLT_PORT` spelling no longer overrides\r\n  configured ports. Ports bd resolved for itself stay overridable by either spelling, and a stale\r\n  `.beads/dolt-server.port` left by a crashed server no longer makes auto-start refuse over a port\r\n  nobody configured.\r\n- **The legacy-backend tombstone rejection is truthful** (#6044). A workspace whose `metadata.json`\r\n  still says `\"backend\": \"sqlite\"` (v1.2.x opened these as Dolt anyway) is still refused fail-closed,\r\n  but when live Dolt data is detected the message now carries the exact one-field heal instead of\r\n  advising an export/reinit that would have destroyed a database one edit from healthy. Detection helper\r\n  ported from @steveyegge's #4740.\r\n- **The new exported Go packages are marked experimental before the tag freezes them** (#6036).\r\n  `backend`, `beadserrors`, `issueops`, `journalops`, `memoryops`, `schema` and the conformance profiles\r\n  ship usable but explicitly unfrozen \u2014 the extension door for out-of-tree backends stays open without a\r\n  v2 to walk back through. Pin an exact beads version and re-run the conformance suite on every bump.\r\n- **`bd show` labels `created_by` as `Created by:`, not `Owner:`** (be-ss66); `bd dep add` names the\r\n  implicit `type=blocks` default to interactive operators (#5854); `bd reclaim` summarizes replica-guard\r\n  skips in one line instead of one line per stranded lease (wy-sp2l4); `beads_dir` and `repo_root`\r\n  become OPTIONAL in `ContextResponse` (`bd serve` still publishes both \u2014 the relaxation is a promise to\r\n  clients, not a switch on the server); and actor matching decodes an exact `--` run to `/` (be-p7dzx).\r\n\r\n## Fixed\r\n\r\n### First shipped on a tested release here \u2014 the withheld [1.2.1] work\r\n\r\n- **A dated defer now means what it says: expired defers return to the ready front** (bd-i8qx8).\r\n  `bd defer --until` and `bd update --defer` set `status=deferred` plus a `defer_until` timestamp, but\r\n  nothing ever flipped the status back \u2014 so an expired defer stayed invisible to `bd ready` forever\r\n  until a human ran `bd undefer`. **One deployment measured 241 beads, including P1s, silently dark this\r\n  way**, regenerating daily from correct-looking automation. Ready-front reads and claims (`bd ready`,\r\n  `bd ready --claim`, `bd list --ready`, and the serve/proxied reader roles) now run a lazy wake sweep\r\n  first: every bead and wisp with `status=deferred` and `defer_until <= now` flips to\r\n  `status=open, defer_until=NULL`, byte-identical to what `bd undefer` writes so a later dateless\r\n  re-defer cannot inherit a stale past date. Each wake records a `status_changed` event with actor\r\n  `bd-defer-wake`. What does **not** change: a dateless defer is the indefinite icebox and never\r\n  auto-wakes. The sweep is a no-op when nothing has expired (no Dolt commit is minted), advisory by\r\n  contract (a ready listing never fails because the sweep could not run; strict `--readonly` skips it),\r\n  and identical in embedded, server and proxied-server modes.\r\n- **`--label-any` is no longer silently dropped by `bd ready` and `bd ready --claim`** (bd-s10oa). The\r\n  ready-work WHERE builder emitted clauses for `--label` and `--exclude-label` but none for\r\n  `--label-any`, so the OR-set filter was ignored on the ready and claim paths on every backend \u2014 while\r\n  `bd list` and `bd search` honored it. On an **atomic claim** this was dangerous rather than merely\r\n  wrong: a worker fencing itself to its own lane would claim another lane's bead and believe it was\r\n  fenced. An exhausted lane now claims nothing instead of falling back to unfenced work. Related: `bd\r\n  ready --claim` now honours the directory-label scope, where the branch applying a directory's\r\n  configured `directory.labels` default tested the filter it had already written the default into, so it\r\n  could never fire.\r\n- **`bd query` no longer drops matches from an `OR` or `NOT` query** (bd-pohmh). To answer an expression\r\n  the storage filter cannot express, both routes fetched `max(3 \u00d7 --limit, 100)` rows and applied the\r\n  expression to those in memory. A match past that window was absent from the page \u2014 and the truncation\r\n  hint said nothing, so the answer looked complete: `bd query \"type=bug OR label=urgent\"` over a\r\n  workspace with more than a hundred beads has been returning an arbitrary prefix of its answer. The\r\n  window is gone; the page is the first `--limit` **matches** and the truncation hint is exact.\r\n  `--offset N` now works with `OR`/`NOT` where it used to be refused outright. **Your results will\r\n  change, and they change by getting bigger.** The cost is real: a broad `OR`/`NOT` expression over a\r\n  large workspace now reads every row its plain filters admit \u2014 narrow the expression if that matters.\r\n- **Claim-family writes are verified by re-read in Dolt server mode** (bd-zccb9, incident wy-ejph3).\r\n  Under a degraded sql-server the exit status of `bd update --claim` / `bd claim` / unclaim was not truth\r\n  in either direction: a claim could report success while the server-side transaction died with the\r\n  abandoned connection and rolled back \u2014 a phantom claim that later cost a duplicate implementation \u2014\r\n  and conversely a connection error could print with the write actually applied. bd now re-reads the\r\n  bead's assignee and status on a **fresh connection** after the claim transaction and resolves the\r\n  outcome against the database: a reported success that did not land fails loudly, and an ambiguous\r\n  commit-phase loss is settled by the re-read (verified applied becomes an accurate success; verified\r\n  rolled back is replayed once). New metrics `bd.claim_verify_lost_total` and\r\n  `bd.claim_verify_recovered_total`. Applies to claim, ready-claim and unclaim in server mode; wisps and\r\n  embedded mode are unchanged.\r\n- **Script hooks now fire on both write plumbings, and a command waits for its own hooks** (bd-opisf).\r\n  bd has two write plumbings and only one ran the workspace's hook scripts. The storage decorator chain\r\n  fires `on_create`/`on_update`/`on_close` after every mutation it lands; the unit-of-work plumbing \u2014\r\n  the one **proxied-server mode writes through** \u2014 fired nothing, so an integration wired to\r\n  `.beads/hooks/` silently missed every mutation that went through it. Four commands had grown\r\n  hand-wired hook calls to paper over the gap; every other write ran no hook at all. A notifying wrapper\r\n  now fires them from the plumbing, buffered during the transaction and drained only after the commit\r\n  succeeds. **If you run a team server and wired anything to `.beads/hooks/`, it has been silently\r\n  missing most mutations and will start running on upgrade.** One change every workspace sees: a command\r\n  now waits for its own fire-and-forget hooks before exiting (bounded by the 10s per-hook timeout),\r\n  because a short command could previously return from `main` before a hook had even started; the wait\r\n  happens after the store closes, so a hook script's own `bd` can open the workspace. `bd serve` still\r\n  runs no hooks, and `bd import` still fires none on either plumbing.\r\n- **Team-server data corruption: proxied `bd init`, `bd create --id`, and `bd update --ephemeral`**\r\n  (bd-zl3u8, bd-7oyh5, bd-xt6de). Three independent silent-corruption bugs on the `--proxied-server`\r\n  route. (1) `bd init --proxied-server` against a team server whose database another rig had already\r\n  identified wrote its own locally-derived issue prefix and project id straight over the stored pair \u2014\r\n  **renaming every id the co-tenant was about to mint**. It now reads the identity first and prints\r\n  `Adopted project identity from existing database`; there is no flag that restores the overwrite.\r\n  (2) `bd create --id <id>` on a proxied server silently **upserted** every column of a resident bead \u2014\r\n  title, type, description, labels \u2014 and exited zero, with no history entry naming a create and nothing\r\n  in the output to suggest anything had been replaced; both routes now return an already-exists error\r\n  naming the id and leave the stored row untouched. (3) Proxied `bd update --ephemeral`/`--no-history`\r\n  ran a plain column update on whichever table the row already sat in, so the bead stayed in `issues`\r\n  carrying `ephemeral = 1` \u2014 still durable, still versioned, still replicated, but invisible to every\r\n  wisp-plane read and skipped by JSONL export; both routes now perform the atomic aggregate move.\r\n  **Caveat: the `--ephemeral` fix does not repair existing rows.** Any bead a proxied\r\n  `bd update --ephemeral` produced before this release is still in `issues` with the flag set, and\r\n  nothing here finds it.\r\n- **More team-server parity, from the facade programme.** Proxied `bd config set status.custom` and\r\n  `types.custom` now project into their tables so the setting and its effect land together (previously\r\n  `bd config set types.custom \"session\"` reported success and `bd create -t session` failed for as long\r\n  as the workspace lived); `bd config set-many issue_prefix=<x>` is refused as `bd config set` always\r\n  was, where it used to walk past the guard and re-prefix the workspace; proxied `bd reopen` reopens a\r\n  bead in any configured done status; `bd update --parent` on a proxied server replaces **every** parent\r\n  edge instead of stopping at the first; `bd dep remove` on a wisp-sourced edge actually removes it; a\r\n  dependency on a bead in another repository no longer fails with a raw foreign-key `Error 1452`;\r\n  `bd dep tree` on a team server resolves partial ids and honors `--max-rows`; and proxied\r\n  `bd create`/`reopen`/`update --json` emit the direct route's shape, gaining the `labels` field they\r\n  were silently dropping.\r\n- **`bd purge --pattern` / `bd prune --pattern` stop reporting success on a malformed glob, and\r\n  `--dry-run` matches the real run** (bd-pn231). Both routes matched with the error return of\r\n  `filepath.Match` discarded, so `bd prune --pattern '[' --force` printed `No closed beads to prune` and\r\n  exited 0 \u2014 indistinguishable from a correct pattern over an empty set, which is the worst possible\r\n  failure mode for a cleanup script. And `--dry-run` asked for the refuse-if-any-external-dependent path\r\n  while the confirmed run asked for the force path, so a dry run could report `has dependents not in\r\n  deletion set` for a sweep `--force` finishes, with the CLI then swallowing the error and printing\r\n  zeros.\r\n- **`bd dep cycles` is deterministic and no longer shortens a cycle it cannot fully describe**\r\n  (bd-wfkbv). The walk iterated a Go map, so two runs against an unchanged database disagreed on both\r\n  cycle order and each cycle's starting point \u2014 and on a graph with overlapping cycles even the *set* of\r\n  cycles could differ. Members that could not be looked up were silently dropped from the path, so a\r\n  three-node cycle rendered as a two-node one and a cycle none of whose members resolved vanished from\r\n  the report and from the `Found N dependency cycles` count entirely. Diffing two cycle snapshots is now\r\n  meaningful, which it never was. The same sweep backs the post-add cycle warning that `bd dep add`,\r\n  `bd dep --blocks` and `bd link` print, on both routes. See the breaking list for the `--json` shape\r\n  change.\r\n- **Telemetry no longer taxes every `bd` invocation.** Two startup costs paid on every command are gone.\r\n  The machine-scoped distinct ID was recomputed on every invocation \u2014 a fork of the platform machine-id\r\n  probe (`ioreg` on macOS, measured at **20.2\u00b11.2ms**) \u2014 even with `BD_DISABLE_METRICS=1` and even for\r\n  `bd --version`; it is now resolved only when metrics are enabled and cached at `~/.beads/machine-id`\r\n  (0600), with a probe failure retried next run rather than cached. Second, every invocation\r\n  unconditionally spawned a detached `bd send-metrics` child \u2014 a full re-exec of the binary plus an\r\n  HTTPS upload attempt, with no check that anything was queued; the spawn now requires at least one\r\n  queued event batch and is throttled to one attempt per 5 minutes. **Every `bd` call gets measurably\r\n  faster, including calls from users who had already opted out of telemetry.** Telemetry content,\r\n  opt-out semantics and endpoint pinning are unchanged.\r\n- **A long or multi-paragraph close reason renders as body text in `bd show`** (#5595). Every other\r\n  free-text field reaches the terminal through the markdown renderer, which word wraps and indents; the\r\n  close reason was formatted into the metadata block beside `Owner:` and `Created:`, so it never wrapped\r\n  and its second and later lines read as separate metadata entries \u2014 a blank line and a bare `- bullet`\r\n  sitting directly under `Created:`. `bd close --reason-file` exists so agents can write structured close\r\n  reports, and those were exactly the reasons that came out corrupted. Anything larger than one metadata\r\n  line now gets a `CLOSE REASON` section rendered by the same call the other body fields make; the JSON\r\n  payload is untouched.\r\n- **Smaller listing and reporting corrections.** `bd list` and `bd children` print blocker ids in\r\n  **ascending** order with repeats collapsed, on both routes, where they used to come out in\r\n  map-iteration order so an unchanged workspace could print different bytes on two consecutive runs \u2014\r\n  which makes diff-based snapshot scripts stable for the first time. `bd list --max-rows` reports its own\r\n  malformed value before the filter's. `bd status --assigned` reports the underlying error instead of a\r\n  causeless \"failed to get assigned statistics\". `bd count` is one implementation again on a shared role,\r\n  with byte-identical output. Multi-id `bd dep list` no longer changes its JSON shape on failure, reports\r\n  ids that name nothing on stderr, answers a repeated anchor once, and no longer prints an empty section\r\n  header under `--type`. Claim/unclaim refusals steer toward coordinating with the holder instead of\r\n  suggesting `bd unclaim <id>` \u2014 the old copy taught an unclaim-then-claim steamroller that evicted a\r\n  live, heartbeated claim mid-review (bd-at6rc, #4675). And a single-bead `bd create --id P.N` no longer\r\n  leaves `child_counters` stale, which could re-mint an already-used suffix once such children were\r\n  archived (GH#4750).\r\n- **FreeBSD builds compile again** (#5661; CI gap tracked as GH#5662). The dbproxy process-identity arc\r\n  shipped linux/darwin/windows implementations with no fallback, breaking `GOOS=freebsd` compilation \u2014\r\n  caught only by the release build's cross-compile, **which is what burned the v1.2.0 tag pre-publish**.\r\n  Unsupported platforms now get stubs that fail proxied-mode spawns with a clean, actionable error;\r\n  classic (non-proxied) bd is unaffected, matching what v1.1.2 shipped on freebsd.\r\n\r\n### New in [1.3.0]\r\n\r\n- **Convergent dependency rekey** (#6045; fixes #5268). A database can legally hold the same logical\r\n  edge twice under different typed columns; the rekey derived the same UUIDv5 for both, died on the\r\n  duplicate primary key, and \u2014 because the cursor commits per step \u2014 left the store half-applied. The\r\n  planner now *orders* convergible states and merges duplicate typed edges, the rename path that minted\r\n  them is fixed at the source, databases left half-rekeyed by earlier binaries are repaired on the next\r\n  pass, and the refusals that remain can no longer brick an open.\r\n- **Legacy tracked `ignored_schema_migrations` is untracked at open** (#6046; fixes #4356). On legacy\r\n  lineages the clone-local migration cursor predated its `dolt_ignore` pattern and sat committed at\r\n  HEAD, so every migration pass dirtied a tracked table bd could never clean \u2014 push worked and every\r\n  `bd dolt pull` died with `cannot merge with uncommitted changes`, permanently (reported independently\r\n  on two fleets, 24 and 17 databases). An open-time reconcile untracks it and unwedges the pull.\r\n- **`bd delete` no longer wedges auto-export forever** (#6059, completing #5806; fixes #5896).\r\n  Auto-export's orphan guard refused to overwrite an `issues.jsonl` holding a deleted bead's record,\r\n  refused again on every subsequent command, and the documented recovery re-imported the JSONL \u2014\r\n  resurrecting the bead the user deleted. Deletions are now proven via store history (a new\r\n  `storage.HistoryPresence` capability that the default embedded store implements too) and the export\r\n  proceeds; unprovable cases still refuse.\r\n- **Ignored-cursor sentinel replay is clamped to floor 11** (#6054; #5981 class, #5366 follow-up). A\r\n  missing clone-local sentinel used to zero the migration cursor and replay the whole `ignored` chain\r\n  from 0001 on every upgrade from a released tree \u2014 v1.1.0/v1.1.2/v1.2.x all top that cursor at 11 and\r\n  have no `leases` table, so the sentinel was always missing. That replay dragged in `ignored/0007`'s\r\n  unguarded `UPDATE wisps SET is_blocked = 0`, silently restamping `wisps.updated_at` across the plane,\r\n  unrecoverable because the wisp plane has no committed history. Upgrades now apply exactly the pending\r\n  set, `ignored/0012`\u2013`0026`.\r\n- **Server-mode `DOLT_ADD`/`DOLT_COMMIT` run after the SQL transaction commits** (#6040, carrying\r\n  @nova-submodules' #5740). Staging inside the still-open transaction materialized Dolt commits from the\r\n  BEGIN-time snapshot, silently reverting rows concurrent sessions had committed in the window \u2014\r\n  observed in production as claims reverting minutes after being made. The commit now stages the\r\n  post-merge working set.\r\n- **`bd bootstrap` probes git remotes for Dolt data instead of rejecting them, and exits non-zero when\r\n  it declines** (#6037; fixes #5743, #5663). Bootstrap rejected the very git-origin-derived remote\r\n  `bd init` persists, printed `\u2713 Database already exists` for the refusal, and exited 0 with nothing\r\n  created \u2014 a closed loop with `bd init --reinit-local` pointing back at it.\r\n- **Truthful errors and safe identity attribution for proxied/gateway `bd init`** (#6062). Nothing on\r\n  the open path asserted the SQL session was on the database bd asked for, so a credential-scoped front\r\n  door could serve its own database while bd attributed the reads to the requested one; every `USE`\r\n  failure was labeled `database not found`, including access denials. Both are fixed, along with a\r\n  silent-data-hazard variant worse than the reported error, and `--init-if-missing` is honored in\r\n  proxied-server mode.\r\n- **`--storage-class` is honored on every create path** (#6060). The flag was accepted and ignored on\r\n  the proxied route (minting a durable versioned row for a request that asked for ephemeral), on\r\n  `--file` markdown batches, and on `--graph` plans; the direct door was fixed in-window (#5149, #5164).\r\n  The ephemeral/versioned conflict is now rejected on the proxied route with the same message as the\r\n  direct one.\r\n- **Three JSON-contract defects fixed before 1.3.0 froze them** (#6053): revision tokens are opaque\r\n  decimal strings again on the way out and must be sent as strings in `expected_version` \u2014 JSON numbers\r\n  exceeded JavaScript's 2^53 precision; `--set-metadata k=5` stores the typed scalar `5` (restoring\r\n  v1.2.2's inference); and `bd create --json` timestamps carry nanosecond precision again.\r\n- **A Homebrew `--HEAD` version stamp is recognized instead of being misread as `0.0.0`** (#6079,\r\n  carrying @anisoptera's #5625; refs #5603, #5650). Version comparison scans dot-separated parts with\r\n  `%d` and leaves what it cannot read at 0, so every non-semver stamp bd has written compared as \"older\r\n  than 0.56.0\" and handed a live workspace to the pre-v56 recovery \u2014 which **deletes `.dolt`** when the\r\n  `.bd-dolt-ok` marker is absent. Two stamps reach that call: `HEAD-<shortsha>` from\r\n  `brew install --HEAD`, and the `v1.1.1-0.2026\u2026` Go pseudo-version that bricked five production cities\r\n  in #5650. The recovery is now gated on `IsValidSemver` before the comparison, so it can only remove\r\n  predecessors from the recovery set, never add one. Alongside it: `bd doctor` reports a `--HEAD` build\r\n  as healthy instead of nagging `brew upgrade beads` (which would undo what the user asked for), a\r\n  changed HEAD stamp counts as an upgrade so the post-upgrade reconciliation runs, and\r\n  `bd upgrade status`/`review` yields no delta rather than dumping the entire release history.\r\n- **`bd flatten` / `bd compact` run a full GC after the rewrite** (#6057; fixes #5907). Dolt's\r\n  generational GC never revisits the old generation, so the post-rewrite pass freed ~nothing and orphaned\r\n  history kept resolving, contradicting flatten's own contract. `bd gc --full` is new, and a low-reclaim\r\n  pass now hints at it.\r\n- **`bd` no longer serializes every invocation behind the schema-init advisory lock** (#6022). Measured\r\n  on an 18-seat rig, the lock was held 96.7% of the time and cost 0.4\u20132.4s of pure waiting on every\r\n  claim, heartbeat, list, comment and mail check. The steady-state probe now answers without the lock and\r\n  takes `GET_LOCK` only on the path that can actually migrate; it issues no writes and fails closed.\r\n- **`bd purge` and `bd prune` select candidates by tier** (#5995). A wisp minted before the `ephemeral`\r\n  column was set belonged to neither sweep \u2014 one production database had 858 rows no sweep could ever\r\n  reach. The tiers are now complementary predicates, so **the first purge after upgrade may clear\r\n  considerably more than usual**.\r\n- **Server mode honors `Config.LenientOpen`** (#5783 by @Toady00; fixes #5781). The dirty-table\r\n  refusal's documented recovery \u2014 `bd dolt commit` \u2014 could not itself open a server-backed store, a\r\n  deadlock previously broken for embedded mode only. Found in the wild: 15 of 21 databases on one\r\n  deployed server carried a permanently dirty `config` table.\r\n- **The aux-row rekey survives dolt#11131 encoding drift** (#5064; fixes #4380). A drifted\r\n  `events`/`comments` table panicked Dolt inside the re-key scan, aborting the migration and leaving the\r\n  database unopenable. Drifted tables are now skipped with a warning, recorded clone-locally in\r\n  `aux_row_rekey_drifted`, and re-keyed on a later pass; healing the drift itself is Dolt's\r\n  `schema-encoding-drift recover-rows`. **This already reached 1.1.x and v1.2.2 users \u2014 it is the\r\n  [1.1.2] fix \u2014 and lands on the main line here, so a store upgrading from v1.2.2 is not newly exposed.**\r\n  It is load-bearing for this upgrade specifically: the v53 \u2192 v66 chain runs a **second** aux-row rekey\r\n  pass through the same drift-protected code path when a v53 store crosses main-series v61, and at this\r\n  tag the dirty-table exemption is computed per-pass and scoped to exactly the tables the upcoming\r\n  rewrite will touch, so a post-marker resume cannot sweep a non-drifted table's pre-existing user edits\r\n  into the migration commit. Diagnosis and fix by @marcodelpin, carried and reworked by @maphew.\r\n- **Incremental auto-export actually takes the incremental path** (#5806), and three format/scope\r\n  regressions the dead code path was hiding \u2014 leaked memories, included owner issues, a missing `_type`\r\n  discriminator \u2014 are pinned by tests. Server-mode only; embedded mode still full-exports every cycle.\r\n- **Disabling telemetry no longer strands the queued metrics backlog forever** (GH#5712) \u2014 2M+ files /\r\n  15.8GB observed on one control VM; the prune child now runs, network-free, until the backlog decays.\r\n- **Quality-of-life truth-telling:** `bd prime` says when the memory plane could not be read instead of\r\n  impersonating an empty one (#5877); `bd show` on a deleted or purged bead points at `bd history <id>`\r\n  instead of printing text identical to an ID that never existed (ga-m6inyb); `bd vc commit` /\r\n  `bd dolt commit` sweep the entire working set and report `Nothing to commit` honestly; every CLI label\r\n  write normalizes its input so a label can match its own filter \u2014 one real database had 150 such rows\r\n  across 111 beads (#5813, fixes #5812); `bd show` no longer corrupts quoted shell globs via CommonMark\r\n  emphasis pairing (#5799); and `bd blocked` no longer silently ignores the label filters it already\r\n  accepted (#5822).\r\n- **An externally-managed Dolt sql-server was classified as bd's own, silently disarming the\r\n  shared-store migrate gate** (#6118). This is the one to read if you run a shared server. When the\r\n  port arrived from `BEADS_DOLT_SERVER_PORT`, from `bd init --server-port` \u2014 the documented way to\r\n  attach a workspace to an existing server \u2014 or from a stale port file left by a bd server that had\r\n  since died and been replaced on that port, bd treated a genuinely shared server as workspace-owned.\r\n  The gate added by #5920/#6048 to prevent exactly this never fired, so bd promoted the shared schema\r\n  in place with no prompt, no warning and exit 0, after which every older client of that server was\r\n  hard-refused with `schema version mismatch`. Ownership is now **proven** rather than inferred: bd\r\n  must have bound that port itself, per its own port file, and the PID it recorded must still be\r\n  alive. Everything else is shared. The pre-existing explicit-external arms run *after* the proof, so\r\n  proof of a bd-managed server can never un-gate a topology #5920/#6048 already gated.\r\n- **A `dolt.mode: server` workspace declared in `.beads/config.yaml` was refused as a legacy\r\n  workspace** (#6119). The upgrade guard resolved the connection mode from `metadata.json` and nothing\r\n  else, while `Config.IsDoltServerMode` documents six further layers \u2014 one of which is `dolt.mode` in\r\n  the workspace's own config.yaml. A workspace of that shape resolved to embedded, found a\r\n  `.beads/dolt` directory, and was refused before any store was constructed, so every command failed.\r\n  The guard now resolves the mode through the same precedence chain store selection uses.\r\n- **Host-implied server mode was not applied when config.yaml declared a mode** (#6120), so a\r\n  workspace could resolve to embedded against a host that implies a server.\r\n\r\n## Security\r\n\r\n### First shipped on a tested release here \u2014 the withheld [1.2.1] work\r\n\r\n- **`bd dolt push` and `bd sync` no longer adopt a git-origin-derived Dolt remote without consent**\r\n  (#5068). On a rig with no Dolt remote configured, both commands silently derived one from\r\n  `git remote get-url origin`, added it, persisted `sync.remote` into `.beads/config.yaml`, committed\r\n  that config change under the user's git identity, and uploaded the full issue history \u2014 no prompt, no\r\n  flag, no opt-out. **A public git origin therefore published the whole issue database on a command the\r\n  user believed targeted an already-configured remote.** Adoption is now a consent decision and fails\r\n  closed: interactively bd shows the derived URL and every side effect that follows a yes, and defaults\r\n  to **no**; non-interactively it refuses and exits non-zero, naming the URL it would have adopted.\r\n  `--yes`/`-y` consents ahead of time for scripted use; `--no-adopt` or `BD_NO_REMOTE_ADOPT=1` disables\r\n  adoption entirely and **wins over `--yes`**. Workspace resolution moved below the gate, since nothing\r\n  may mutate before consent is established. Rigs with a remote already configured are unaffected.\r\n- **The settings plane no longer serves the KV plane by any read** (bd-rfwtv, bd-klko9). `bd kv` keys\r\n  and the `bd remember` memories nested under them are user data stored as config rows \u2014 they ride in the\r\n  settings table because there is one table, not because they are settings \u2014 and both doors onto the\r\n  settings plane were listing them **with their values**. On the HTTP door that meant an unauthenticated\r\n  `GET /v0/beads/config` handed every stored memory to anything that could reach the port, and the\r\n  surface's key-name-based redaction is no defence there because a memory's content is in the *value*.\r\n  The exclusion lives in the shared role both doors call, not in the HTTP handler, so the CLI and the API\r\n  cannot drift on what a setting is. Frame it honestly: this is plane hygiene, not a confidentiality\r\n  boundary \u2014 `bd serve` still serves every memory in full through `/v0/beads/memories` by design.\r\n- **The no-ID \"last touched issue\" fallback is interactive-only** (bd-m00pb, #4839). A scripted\r\n  `bd update $ID \u2026` with an accidentally empty `$ID` silently mutated whatever bead was touched last \u2014 a\r\n  real agent session corrupted an unrelated closed bead this way. The refusal now happens in argument\r\n  validation, **before** any store open, migration, or auto-import side effect.\r\n- **`bd serve`'s bearer authentication** (#5516) is listed under **Added** because it is new surface, but\r\n  read it as a security control: without it, `bd serve` is only ever a loopback developer tool, and both\r\n  flags default to today's behavior so a bare `bd serve` is byte-for-byte the server it always was.\r\n\r\n### New in [1.3.0]\r\n\r\n- **Go toolchain 1.26.5 \u2192 1.26.7** (#6047), closing **seven stdlib advisories reachable from the shipped\r\n  `bd` binary**: quadratic `net/url` path resolution, `html/template` JavaScript-regexp context tracking,\r\n  unbounded post-handshake `crypto/tls` messages, a missing `ReadHeaderTimeout` on `net/http`'s\r\n  unencrypted HTTP/2 check, unbounded recursion in `encoding/xml` and `encoding/asn1`, and the\r\n  `x/net/idna` Punycode bug in `net/http`'s vendored copy \u2014 `bd serve` is a real HTTP server and bd makes\r\n  outbound TLS calls. The `go` directive stays at 1.26.5, so importers of the module keep their current\r\n  floor.\r\n- **Dependency bumps clearing all 25 open advisories** (#6047), one commit per cluster with a\r\n  reachability verdict each: `golang.org/x/crypto` 0.55.0, `golang.org/x/mod` 0.40.0,\r\n  `klauspost/compress` 1.18.7, `moby/go-archive` 0.3.3, `kin-openapi` 0.144.0 with `oapi-codegen` 2.7.1,\r\n  and a refreshed `beads-mcp/uv.lock`. None of the fixed code is reachable from the shipped binary \u2014 the\r\n  headline critical is `kin-openapi`'s `openapi3filter` middleware, which enters the graph only through\r\n  the `tool` directive for spec codegen. No behavior change; no dolt bump was required.\r\n\r\n## Troubleshooting (upgrading from v1.2.2)\r\n\r\nMost upgrades need no command at all \u2014 on an embedded or local store the first invocation migrates in\r\nplace. The papercuts below are the shapes worth recognizing before you file a bug:\r\n\r\n| Symptom | Cause | Fix |\r\n| --- | --- | --- |\r\n| Migration counter jumps backwards to `0012` after reaching `0066` | The clone-local series runs after the main one, with its own numbering | Let it finish \u2014 it is not a loop |\r\n| A piped or CI upgrade prints nothing | Progress goes to stderr only when it is a terminal | Not a stall; wait for exit |\r\n| A shared `dolt sql-server` did not migrate at all | It is never auto-migrated; consent is explicit (#5920, #6048) | Upgrade every client, then `bd migrate schema` once \u2014 or `BD_ALLOW_REMOTE_MIGRATE=1` in scripted use |\r\n| `bd serve` refuses to start against a proxied store | A daemon has no operator to consent for it, and the gate now covers that path (#6055) | Reconcile the schema first, or set `BD_ALLOW_REMOTE_MIGRATE=1` as standing consent for the service |\r\n| `bd serve` refuses an embedded workspace outright | Embedded Dolt commits outside the SQL transaction, so per-request atomicity would be a lie \u2014 this refusal is permanent | Move to a Dolt sql-server mode: `bd migrate from-server-to-proxied-server` and siblings (experimental) |\r\n| Another machine's `bd` refuses the database after one client upgraded | Forward schema-skew guard: a mixed-version fleet is a broken fleet | Upgrade every client together; check `which -a bd`; designated-migrator flow for multi-clone stores |\r\n| `bd dolt push` / `bd dolt pull` refused after installing 1.3.0 | The pending-migration gate covers sync, not just `bd migrate` | Finish syncing with the old binary first, or migrate and push from the designated migrator |\r\n| `bd dolt push` in CI now fails asking for consent | Git-origin remote adoption no longer happens silently (#5068) | Add `--yes`, or configure the Dolt remote explicitly; `--no-adopt` to forbid it entirely |\r\n| A long-running `bd --readonly serve` does not come back up | The flag is now refused instead of binding a silently writable server | Drop `--readonly` from the serve invocation |\r\n| `\u26d4 workspace is frozen for migration`, exit 14 | A `MIGRATION-FREEZE` sentinel in the workspace root, the cwd, or an ancestor of either | Remove the file the message names (or unset `BD_MIGRATION_FREEZE_FILE`) once the migration is done |\r\n| A `bd update` exits 13 instead of 0 or 1 | A `--if-assignee`/`--if-status` guard did not match: a racer won, nothing was written | Skip gracefully \u2014 13 means stale precondition, not infrastructure failure |\r\n| `bd sync` exits 2 and nothing was pushed | A merge conflict it will not resolve by picking a side | `bd conflicts list`, then `bd conflicts resolve <id> --ours\\|--theirs` |\r\n| `bd ready` suddenly lists beads you deferred months ago | Expired dated defers now wake back onto the ready front (bd-i8qx8) | Expected, one-time; dateless defers still never auto-wake |\r\n| A `bd search` script's hit count changed | `bd search` now includes closed beads by default (bd-t5yex) | Add `--status open`, and raise `--limit` when hunting live work |\r\n| `bd dep cycles --json` breaks a parser | The shape is now `{members:[{id,issue?}],partial}` (bd-wfkbv) | Update the parser; `issue` is absent, never null, for an unresolvable member |\r\n| A team-server `bd delete --force` left orphans behind | `--force` no longer implies cascade on the proxied route (bd-x82so) | Add `--cascade` where you meant the subtree |\r\n| Open refused over `\"backend\": \"sqlite\"` in `.beads/metadata.json` | A stale field from the 1.2.x era; the live data is Dolt | Apply the exact one-field edit the rejection message gives |\r\n| First `bd purge` after upgrade clears far more than usual | Legacy typed wisps are now reachable by the tier predicate | Expected, one-time (#5995) |\r\n| A cross-rig bead gate stays pending under a proxied-server rig | Known limitation: multi-rig prefix routing (`routes.jsonl`) is not supported with proxied-server rigs (#5861) | `bd gate check`, or `bd close --force` |\r\n\r\n## Validation\r\n\r\n- **The release was cut from `release/1.3.0`**, and every change on the branch landed through a reviewed\r\n  PR against it \u2014 28 of them, driven by a full pre-tag release audit.\r\n- **The full check matrix is green at the branch tip.** The release-prep PR (#6038), whose merge commit\r\n  `b3ef65c8` is the tip, was tested on a head that had already merged #6088: **122 checks green, 1\r\n  skipped, 0 failing.** That matrix is the Embedded Dolt Cmd shards (20), Embedded Dolt Storage shards\r\n  (5), Proxied Dolt Cmd shards (15) and Server Dolt Full Suite shards (16), plus Embedded Dolt\r\n  Conformance (core and audit), Server Dolt Conformance, the storage-backend conformance oracle, the\r\n  contract corpus, the Differential Regression against the v0.49.6 baseline, the macOS lane, the Windows\r\n  lanes (native/msys2/cygwin make shells, dbproxy server, `doltversion`, `cmd/bd` liveness,\r\n  worktree-remove boundary), and `nix build .#default`.\r\n- **The last red lanes were closed before the prep PR, and only one was a product defect.** #6088 was\r\n  that one \u2014 the #6048 consent gate had swept in bd-owned auto-started servers and re-checked itself on\r\n  every schema-init retry, red across the Server Dolt matrix \u2014 now fixed and pinned by\r\n  `TestSharedServerDatabase` in both directions. The other three were harness bugs: a `jsonOutput` global\r\n  leak breaking the shared-migrate-refusal subtests in full-package runs (#6073), a freeze-marker path\r\n  comparison that was not symlink-safe, which is what the macOS doctor freeze-gate failures were (#6087),\r\n  and the missing assertion for #6053's string revision token in both `show` suites (#6086).\r\n- **Upgrade smoke ran the five legs that matter for this release** \u2014 v1.1.0, v1.1.2, v1.2.1, v1.2.2 and\r\n  v1.2.2-rc.1 \u2192 candidate \u2014 alongside 14 historical upgrade lanes from v0.9.1 through v1.2.2.\r\n- **A new wisp-plane upgrade corpus (#6049) seeds and asserts the clone-local plane** the 1.3.0 migration\r\n  chain rewrites \u2014 wisps, wisp deps and comments, leases, events, and the ignored-track cursor \u2014 across\r\n  v1.0.1/v1.1.x/v1.2.2 \u2192 candidate, closing the coverage hole behind this release's sentinel-replay and\r\n  restamp fixes.\r\n- **The v53 \u2192 v66 upgrade, the shared-server consent flow, the backup-first recipes, and the multi-clone\r\n  designated-migrator flow are documented** in\r\n  [Upgrading](https://beads.gascity.com/getting-started/upgrading), with the cursor-rollback procedure in\r\n  the [recovery runbook](https://beads.gascity.com/recovery/accidental-1-2-1-release).\r\n- **Two release candidates preceded this tag, and rc.2's content is what shipped.** `v1.3.0-rc.1`\r\n  (`9c6a69ec1`) and `v1.3.0-rc.2` (`c185735c3`) each completed the full release pipeline with both\r\n  registry publish jobs correctly skipped by prerelease gating. rc.2 fixed four defects that only\r\n  appeared when rc.1 was driven against a real downstream integration: #6118, #6119, #6120 (all\r\n  described under Fixed) and a CI-only timeout. The `v1.3.0` tree is rc.2's tree plus the version stamp\r\n  \u2014 the commit reverts an unreferenced package that no RC had validated, leaving the shipped code\r\n  byte-identical to what rc.2 was tested as.\r\n- **The v1.3.0 release pipeline completed green.** `verify-version-consistency`, both goreleaser legs\r\n  (linux + macOS), both package gates (MCP, npm), release attestation, and \u2014 for the first time, since\r\n  prerelease gating no longer applies \u2014 `publish-pypi` and `publish-npm`. The tag-triggered Migration\r\n  Test Harness and Cross-Version Smoke Tests both passed. 11 assets published: linux amd64/arm64,\r\n  darwin amd64/arm64, windows amd64/arm64, freebsd amd64, android arm64, the contract corpus, an SPDX\r\n  SBOM, and checksums.\r\n- **Independently qualified against a real downstream consumer before the tag.** Gas City ran its full\r\n  acceptance matrix against a bd built from the exact release content, with schema parity asserted in\r\n  `TestMain` and no `replace` directive: the seven-shape init-topology matrix (proxied-local,\r\n  direct-local, direct-external \u00d72, proxied-external, legacy externally-managed, deferred-init) at 8/8\r\n  subtests each, both migration paths including the live-server refusal, and its dashboard probe and pin\r\n  suites. All pass, zero skips, zero non-zero exits.\r\n- **A local validation battery against the tag** passed the full release stability gate \u2014 all 7 upgrade\r\n  scenarios from each of v1.2.2, v1.1.2 and v1.1.0, including the new wisp-plane leg \u2014 plus\r\n  fresh-workspace, migration-UX (28 steps, counter restart as documented), forward schema-skew guard,\r\n  migration-freeze, and journal-actor checks.\r\n\r\n## Known issues\r\n\r\n- **A store whose `events` table is missing stays write-dead, and 1.3.0 does not repair it**\r\n  ([#6142](https://github.com/gastownhall/beads/issues/6142)). Reads all succeed, so the store looks\r\n  healthy until the first write, which fails with a raw `Error 1146: table not found: events`. The\r\n  cause is that `events`, `bd_events_journal` and `bd_events_seq` are created by the clone-local\r\n  migration series but are not among its sentinel tables, so a cursor that claims they were created is\r\n  believed even when they are absent and the creating migration is never replayed. 1.3.0's new\r\n  cursor-reality floor heals `wisps` and `wisp_dependencies` this way but not these three.\r\n  [#6547](https://github.com/gastownhall/beads/pull/6547) adds them to the floor and is held for 1.3.1\r\n  rather than landing after the release candidates had already been qualified.\r\n- **Proxied-server mode has no backup path.** `bd backup` and `bd restore` are refused in\r\n  proxied-server mode. Use server or embedded mode if you need `bd backup`, or take backups through\r\n  Dolt remotes with `bd dolt push`.\r\n- **`bd dolt start` is not proxied-aware.** On a proxied-server workspace `bd dolt status` reports the\r\n  server as not running, and `bd dolt start` would launch a second, unmanaged `dolt sql-server` over the\r\n  same data directory. Use the proxy's own lifecycle rather than `bd dolt start` on those workspaces.\r\n\r\n## Performance\r\n\r\n1.3.0's proxied-server topology changes the resource profile rather than raw throughput, and the\r\ndifference is in what a workspace costs when nobody is using it. Measured on one host with `bd` built\r\nfrom the release content, comparing a per-workspace `dolt sql-server` against proxied-server mode with\r\nits built-in 30-second idle timeout:\r\n\r\n| Workspaces | Direct \u2014 idle | Proxied-local \u2014 idle | Proxied, one shared backend \u2014 idle |\r\n|---|---|---|---|\r\n| 1 | 130 MB, 1 process | **0 MB, 0 processes** | 123 MB, 1 process |\r\n| 5 | 616 MB, 5 processes | **0 MB, 0 processes** | 185 MB, 1 process |\r\n| 20 | 2456 MB, 20 processes | **0 MB, 0 processes** | 603 MB, 1 process |\r\n\r\nDirect mode's idle footprint scales linearly with workspace count and is held indefinitely; a proxied\r\nworkspace reaps its backend once idle and returns to zero. At 20 workspaces that is **2.46 GB reclaimed**.\r\n\r\nThe honest counterweight: proxied mode costs *more* while active \u2014 3445 MB against direct's 2483 MB at\r\n20 workspaces, because a proxy process sits alongside each backend \u2014 and a reaped workspace pays a cold\r\nstart on next use, measured at **0.30\u20130.63 s** across every arm and scale. Idle CPU is not the\r\ninteresting axis: direct burned roughly 1.6 CPU-seconds per server per hour, real but small, and proxied\r\nburned none because the processes no longer exist. If your workspaces are continuously busy, direct is\r\ncheaper; if you carry many workspaces that are idle most of the time, proxied is dramatically cheaper.\r\n\r\nCaveats worth stating: single host, a `dolt` CLI one patch behind the pinned version, and a machine\r\nunder heavy unrelated load \u2014 so treat the figures as representative of the shape, not as precise\r\nbenchmarks.\r\n\r\n## Installing\r\n\r\nUse the command that matches your install method. The package managers below track the latest stable\r\nrelease, which **v1.3.0** is; the binaries attached to this release are there if you would rather take\r\none directly:\r\n\r\n```bash\r\n# macOS / Linux / FreeBSD\r\ncurl -fsSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash\r\n\r\n# Homebrew (macOS, Linux)\r\nbrew upgrade beads\r\n\r\n# npm\r\nnpm update -g @beads/bd\r\n\r\n# go install \u2014 server-mode only\r\nCGO_ENABLED=0 go install github.com/steveyegge/beads/cmd/bd@latest\r\n\r\n# go install \u2014 embedded-capable\r\nCGO_ENABLED=1 GOFLAGS=-tags=gms_pure_go go install github.com/steveyegge/beads/cmd/bd@latest\r\n```\r\n\r\n```pwsh\r\n# Windows\r\nirm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex\r\n```\r\n\r\nIf you still have the old tap formula installed as `bd`, switch to the Homebrew core formula:\r\n\r\n```bash\r\nbrew uninstall bd\r\nbrew untap gastownhall/beads 2>/dev/null || true\r\nbrew untap steveyegge/beads 2>/dev/null || true\r\nbrew install beads\r\n```\r\n\r\nWhatever you use, run `which -a bd` afterwards: a second binary earlier in `PATH` is the fleet-skew\r\nfailure described in the upgrading notes.\r\n\r\n## Contributors\r\n\r\nThanks to everyone who contributed to v1.3.0 (between `v1.2.2` and `release/1.3.0` \u2014 which, because\r\nv1.2.2 re-shipped the v1.1.2 tree, spans the whole 1.2 line's work):\r\n\r\n@A3Ackerman, @AJBcoding, @anisoptera, @aphexcx, @arcaven, @aryrabelo,\r\n@athosmartins, @banozz0, @bee-ghosttrack, @boardthatpowder, @brendan-appstart,\r\n@chrisjunlee, @coffeegoddd, @cosentinode, @csauer02-personal-user, @csells,\r\n@cuongbphv, @daniel-jasinski, @davevan2, @DyrtyJax, @ecuthiell, @enieuwy,\r\n@eric-richardson1, @Ethee, @GraemeF, @HackAttack, @harry-miller-trimble,\r\n@heymatthew, @iamthebot, @idirectships, @idvorkin-ai-tools, @imkp1,\r\n@itsandyking, @jacobhausler, @jamelt, @jdelic, @jjgarzella, @johnzook,\r\n@joshuaguyervs, @julianknutsen, @kevglynn, @Kevinwochan, @liviux,\r\n@lumaks-redox, @maphew, @marcodelpin, @marlon-costa-dc, @maxinflection,\r\n@mccraigmccraig, @mlushpenko, @mohamedramadan14, @Mosnar, @MovGP0, @mwotton,\r\n@nova-submodules, @ousamabenyounes, @Photobombastic, @postoso, @prmichaelsen,\r\n@pvinis, @quad341, @RaviTharuma, @remuscazacu, @rjc123, @Rome-1, @ryanwclark1,\r\n@scotthamilton77, @shaunc, @shiminshen, @ShiroKSH, @shon-yuan, @sjarmak,\r\n@srobroek, @steveyegge, @swedeinasia-flow, @thewoolleyman, @Toady00,\r\n@uschtwill, @vishnujayvel, @Wldc4rd, @zach-source, @Zireael\r\n\r\nSpecial thanks to the external contributors whose fixes were carried onto the release branch:\r\n\r\n- @marcodelpin (Marco Del Pin), whose diagnosis and fix for dolt#11131 encoding drift lets the migration\r\n  path survive tables it cannot read \u2014 carried and reworked as #5064 by @maphew (matt wilkie)\r\n- @Toady00 (Brandon Dennis), whose #5783 makes server mode honor `Config.LenientOpen` so the dirty-table\r\n  refusal's own recovery works\r\n- @nova-submodules (Nova Latent), whose #5740 diagnosis and fix for server-mode lost updates was carried\r\n  as #6040\r\n- @anisoptera (Isis Anisoptera), whose #5625 recognizer for Homebrew `--HEAD` version stamps was carried\r\n  as #6079, keeping a HEAD build out of the `.dolt`-deleting pre-v56 recovery\r\n\r\n<!-- Handle list regenerated from the GitHub compare v1.2.2...release/1.3.0 at\r\nthe current tip b3ef65c8 (1340 commits; three bot accounts and one placeholder\r\nidentity excluded), plus @nova-submodules, credited in the changelog for #5740\r\nbut not a commit author in the range. 82 handles. No \"New Contributors\" block:\r\nthe release tooling produces no first-PR links, and guessing them risks a wrong\r\nattribution. -->\r\n\r\n## Recommended Reading\r\n\r\n- [Upgrading guide](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/getting-started/upgrading.md)\r\n- [Recovery runbook: cursor rollback](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/recovery/accidental-1-2-1-release.md)\r\n- [Dolt architecture: embedded and server modes](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/architecture/dolt.md)\r\n- [Federation and multi-replica leases](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/multi-agent/federation.md)\r\n- [Events journal reference](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/reference/events-journal.md)\r\n- [JSON Schema for `--json` and export output](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/reference/json-schema.md)\r\n- [Observability and OpenTelemetry](https://github.com/gastownhall/beads/blob/release/1.3.0/docs/reference/observability.md)\r\n- **`bd serve`**: the v0 wire contract is the checked-in OpenAPI document,\r\n  [`internal/httpapi/spec/openapi.v0.yaml`](https://github.com/gastownhall/beads/blob/release/1.3.0/internal/httpapi/spec/openapi.v0.yaml),\r\n  with operator guidance in the\r\n  [serve runbook](https://github.com/gastownhall/beads/blob/release/1.3.0/engdocs/SERVE_RUNBOOK.md) and\r\n  the [v0 design note](https://github.com/gastownhall/beads/blob/release/1.3.0/engdocs/design/bd-serve-v0.md).\r\n  The published docs site does not yet carry an HTTP API reference page.\r\n- [Full changelog, including the withheld [1.2.1] section](https://github.com/gastownhall/beads/blob/release/1.3.0/CHANGELOG.md)\r\n\r\n**Full Changelog**: https://github.com/gastownhall/beads/compare/v1.2.2...release/1.3.0\r\n\r\n","mentions_count":82}
