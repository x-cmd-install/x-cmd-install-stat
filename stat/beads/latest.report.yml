08Z"},{"id":707554138,"node_id":"RA_kwDOQAyAEs4qLGta","name":"beads_1.3.3_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":49530637,"digest":"sha256:7cbaeff861ed5f8b336ae94e4c22342363df8ade113f95f95098940da9bd808c","download_count":16,"created_at":"2026-11-03T23:58:09Z","updated_at":"2026-11-03T23:58:12Z"},{"id":707554422,"node_id":"RA_kwDOQAyAEs4qLGx2","name":"beads_1.3.3_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":54270852,"digest":"sha256:2b65e0daa918f730f8a6222cc600a15369330c2634bd33b09f2e48843bc95fb6","download_count":75,"created_at":"2026-11-03T23:58:15Z","updated_at":"2026-11-03T23:58:18Z"},{"id":707553669,"node_id":"RA_kwDOQAyAEs4qLGmF","name":"beads_1.3.3_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":30536130,"digest":"sha256:83c2fbe9bbe67f5e60b87e3052b63bf19f86cd4656c4588797a6bcdf2ccfe2c4","download_count":15,"created_at":"2026-11-03T23:58:00Z","updated_at":"2026-11-03T23:58:02Z"},{"id":707575543,"node_id":"RA_kwDOQAyAEs4qLL73","name":"checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":881,"digest":"sha256:b0b4f945edd63bcdcc1862905804b29a3ee61f34eb86710aee9f8fa5bf2db484","download_count":188,"created_at":"2026-11-04T00:05:41Z","updated_at":"2026-11-04T00:05:41Z"}],"body":"## beads v1.3.3\n\nPre-compiled binaries for Linux, macOS (Intel & Apple Silicon), Windows (AMD64 & ARM64), Android/Termux (ARM64), and FreeBSD.\n\n### Release notes\n\nRead the full notes in [CHANGELOG.md](https://github.com/gastownhall/beads/blob/v1.3.3/CHANGELOG.md): the `[1.3.3]` and `[1.3.3-rc.1]` sections. They cover the security fixes, data-loss fixes and dependency updates, the **Upgrade notes** on what commands now accept or print, and the **Known issues** with their workarounds.\n\n### Known issue found after release: `GT_ROOT` in `.beads/.env` is ignored\n\n1.3.3 imports only an allowlist of keys from a project's `.beads/.env` (#7879). Gas City's `gc rig add` writes `GT_ROOT=<city root>` into each rig's `.beads/.env`, and 1.3.3 drops it. Every bd command in a rig prints `beads: ignoring GT_ROOT from .beads/.env` on stderr.\n\n- **Gas City: failed bd commands in a rig can be misreported.** gc exports `GT_ROOT` into agent sessions itself, so formulas still resolve. But released gc versions read bd's JSON error from stdout only when stderr is empty, and the notice fills stderr. A bd failure in a rig (for example a missing id) can therefore surface as the notice text instead of bd's error. gc's fix is gastownhall/gascity#8817.\n- **When you run `bd` by hand in a rig without `GT_ROOT` exported,** the city's formulas (`$GT_ROOT/.beads/formulas`) and town molecules are not found. The repo's own `.beads/formulas` and `~/.beads/formulas` still work. Workaround: `export GT_ROOT=<path to your city>` before running bd in a rig.\n\nNothing else is affected: no data, Dolt server selection or credentials. **bd 1.3.4** will allow `GT_ROOT` from `.beads/.env` again (#8117), which removes the notice for every gc version.\n\n### Installation\n\n**Homebrew (macOS/Linux):**\n```bash\nbrew install beads\n```\n\n**Quick Install (macOS/Linux/FreeBSD):**\n```bash\ncurl -sSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash\n```\n\n**Windows (PowerShell):**\n```powershell\nirm https://raw.githubusercontent.com/gastownhall/beads/main/install.ps1 | iex\n```\n\n**Manual Install:**\nDownload the appropriate binary for your platform below, extract it, and place it in your PATH.\n\n\n## Changelog\n### Others\n* 10eec1f707feea8e9472ab0c0ed4ec4ed9dcb05b release(notes): align the v1.3.3 known-issue and gate notes with rc.1\n* 04a9bd02d6b8613a7dcf981487ffc3cf693dc4af release: prep v1.3.3\n\n\n\n"}
