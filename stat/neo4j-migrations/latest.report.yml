-migrations-4.2.0-windows-x86_64.zip","label":"","uploader":{"login":"michael-simons","id":526383,"node_id":"MDQ6VXNlcjUyNjM4Mw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16769918,"digest":"sha256:beb1797d7633508b15de508de8d6c4e115405ed51d59e5a03adb6c60b925a896","download_count":4,"created_at":"2026-09-07T15:20:33Z","updated_at":"2026-09-07T15:20:34Z"},{"id":548984044,"node_id":"RA_kwDODd4s_84guNTs","name":"neo4j-migrations-4.2.0.zip","label":"","uploader":{"login":"michael-simons","id":526383,"node_id":"MDQ6VXNlcjUyNjM4Mw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6587208,"digest":"sha256:903358b6e04f6a1555d3428f5949dc353f045c9d4cdca343ef2af232325e7613","download_count":8,"created_at":"2026-09-07T15:20:34Z","updated_at":"2026-09-07T15:20:35Z"}],"body":"# What's Changed\r\n\r\nThis is a recommended security update for all users. There are no breaking changes and we only bumped the minor version due to a new factory method that we added for one interface that while being intended for internal use might be used externally as well.\r\n\r\n## \ud83d\udc1b Bug Fixes\r\n- c15024c fix: Escape full-text index names on old Neo4j versions proper.\r\n- 71afbd1 fix: Version comparator must not fold different versions into one.\r\n- c392b1a fix: Join repetitions to path.\r\n- 1943680 fix: Don't assume `neo4j` as default database name when computing the lock name.\r\n- ac5b284 fix: Add the migration target to repaired (inserted) migration chain entries.\r\n- 49746f5 fix: Move predicate to actual match clause\r\n\r\n## \ud83d\udd04\ufe0f Refactorings\r\n- f87ef34 refactor: Trim password (no newlines via file or environment).\r\n- 666b32a refactor: Run insertion of repetition and rewiring in one transaction.\r\n- ef02abd refactor: Make `DelayingIterator` actually obey iterator contract full.\r\n- 6ca010c refactor: Improve interoperability with flyway + Neo4j-JDBC driver.\r\n- 5415885 refactor: Use user read/write only permissions for init script if available.\r\n- b56dc23 refactor: User Cypher-DSL for escaping all index option keys.\r\n- 0c58f08 refactor: Use SHA-256 for generating internal names.\r\n- 231e1aa refactor: Disable any access to external DTD and schema in the XML parser used for XML based migrations.\r\n- e60dab8 refactor: Use schema name sanitzer for rendering the properties of fulltext indizes.\r\n\r\n## \ud83d\udcdd Documentation\r\n- 9e1ea21 docs: Update local changelog.\r\n\r\n## \ud83e\uddf9 Housekeeping\r\n- 8c6a379 Bump org.codehaus.plexus:plexus-classworlds from 2.12.0 to 2.12.1 (#2049)\r\n- 8796f98 Bump com.puppycrawl.tools:checkstyle from 14.0.0 to 14.1.0 (#2050)\r\n- c591ee5 Bump neo4j-ogm.version from 5.0.8 to 5.0.9 (#2051)\r\n- 94c6430 Bump org.apache.maven.plugins:maven-surefire-plugin from 3.5.6 to 3.6.0 (#2052)\r\n- 3c06f73 Bump org.objenesis:objenesis from 3.5 to 3.6 (#2053)\r\n- 75bcad2 Bump spring-boot.version from 4.1.0 to 4.1.1 (#2054)\r\n- 19e5bee Bump org.junit:junit-bom from 6.1.2 to 6.1.3 (#2055)\r\n- 6c684fe Bump org.neo4j.test:neo4j-harness from 2026.06.0 to 2026.07.1 (#2056)\r\n- fd09b75 Bump plexus-utils.version from 4.0.3 to 4.1.0 (#2057)\r\n- 431b907 Bump org.graalvm.buildtools:native-maven-plugin from 1.1.10 to 1.1.11 (#2058)\r\n- e7f7d68 Bump org.neo4j.driver:neo4j-java-driver from 6.2.0 to 6.2.1 (#2043)\r\n- 5aca3d3 Bump io.fabric8:docker-maven-plugin from 0.48.1 to 0.49.0 (#2039)\r\n- 6b2e6e0 Bump io.github.classgraph:classgraph from 4.8.186 to 4.8.193 (#2040)\r\n- 6d4378f Bump byte-buddy.version from 1.18.11-jdk5 to 1.18.12-jdk5 (#2041)\r\n- 7ad516f build(deps-dev): Bump com.tngtech.archunit:archunit from 1.4.2 to 1.5.0 (#2042)\r\n- ab2ef45 build(deps-dev): Bump com.google.guava:guava from 33.6.0-jre to 33.7.1-jre (#2044)\r\n- 7db039f build(deps-dev): Bump org.springframework.data:spring-data-neo4j from 8.1.0 to 8.1.1 (#2045)\r\n- 451cdbb build(deps-dev): Bump org.checkerframework:checker-qual from 4.2.1 to 4.2.2 (#2046)\r\n- 3eb0dbc Bump org.graalvm.buildtools:native-maven-plugin from 1.1.8 to 1.1.10 (#2047)\r\n- 9eb9b62 Bump org.apache.maven:apache-maven from 3.9.11 to 3.9.16 (#2048)\r\n\r\n## \ud83d\udee0 Build\r\n- db48ac6 build: Upgrade to Quarkus 3.39.2"}
