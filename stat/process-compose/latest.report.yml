e":"process-compose_linux_386.tar.gz","label":"","uploader":{"login":"F1bonacc1","id":806740,"node_id":"MDQ6VXNlcjgwNjc0MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15120157,"digest":"sha256:d97602f5c0baf84edaf336bf57c260078e790255a88b802fd90dd32a8c92faf3","download_count":4,"created_at":"2026-08-17T23:00:38Z","updated_at":"2026-08-17T23:00:47Z"},{"id":518622317,"node_id":"RA_kwDOHIIuBM4e6Yxt","name":"process-compose_linux_amd64.tar.gz","label":"","uploader":{"login":"F1bonacc1","id":806740,"node_id":"MDQ6VXNlcjgwNjc0MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15908686,"digest":"sha256:9b6dbc38324c0b0481f1cd1dd828ffdc78117129ec797678f4bf8c4023311281","download_count":20132,"created_at":"2026-08-17T23:00:38Z","updated_at":"2026-08-17T23:00:47Z"},{"id":518622320,"node_id":"RA_kwDOHIIuBM4e6Yxw","name":"process-compose_linux_arm.tar.gz","label":"","uploader":{"login":"F1bonacc1","id":806740,"node_id":"MDQ6VXNlcjgwNjc0MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":15216712,"digest":"sha256:148efe002326a683c9ca9d58c7e442efb051ff5e84182fca04737bb120b8e2ce","download_count":4,"created_at":"2026-08-17T23:00:38Z","updated_at":"2026-08-17T23:00:47Z"},{"id":518622328,"node_id":"RA_kwDOHIIuBM4e6Yx4","name":"process-compose_linux_arm64.tar.gz","label":"","uploader":{"login":"F1bonacc1","id":806740,"node_id":"MDQ6VXNlcjgwNjc0MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":14648378,"digest":"sha256:52fa7d5a2d5e0db470faec5976204fc215ed7e3d13689e930cf522becfb63778","download_count":895,"created_at":"2026-08-17T23:00:38Z","updated_at":"2026-08-17T23:00:47Z"},{"id":518622326,"node_id":"RA_kwDOHIIuBM4e6Yx2","name":"process-compose_windows_amd64.zip","label":"","uploader":{"login":"F1bonacc1","id":806740,"node_id":"MDQ6VXNlcjgwNjc0MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16026320,"digest":"sha256:13fd7023199c7375c26477f11f213fde826e932d831f7dd51a5c229fbee3bf79","download_count":358,"created_at":"2026-08-17T23:00:38Z","updated_at":"2026-08-17T23:00:47Z"},{"id":518622325,"node_id":"RA_kwDOHIIuBM4e6Yx1","name":"process-compose_windows_arm64.zip","label":"","uploader":{"login":"F1bonacc1","id":806740,"node_id":"MDQ6VXNlcjgwNjc0MA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":14582413,"digest":"sha256:36a7bcf76e584a630f0b6ec7253c51cd116e686f8ffdd61c9371eeb69e7b3b49","download_count":22,"created_at":"2026-08-17T23:00:38Z","updated_at":"2026-08-17T23:00:47Z"}],"body":"## [v1.122.0] - 2026-08-18\r\n\r\n### New Features\r\n\r\n- Added [file watching](https://f1bonacc1.github.io/process-compose/watch/): a per-process `watch` block restarts a process when its files change, with include/exclude globs, a configurable `debounce`, and `cascade: true` to restart the process's dependents transitively (in dependency order, so a rebuilt artifact is ready before its consumers restart). A process that has exited while its watch is still armed reports the new `Watching` state, and the TUI names the file that caused each restart. Watch-triggered restarts skip the restart backoff and reset the restart counter, since they are user intent rather than a crash loop. File watching can be turned off entirely with `--no-watch` / `PC_NO_WATCH`.\r\n- Added support for [multiple namespaces per process](https://f1bonacc1.github.io/process-compose/configuration/#multiple-namespaces): `namespace` now accepts either a single string or a list of strings (similar to docker-compose profiles), so a shared process (e.g. a database) can be selected and operated as part of any of its namespaces, addresses issue #519.\r\n\r\n### Bug Fixes\r\n\r\n- Fixed restarting a process shutting the whole project down when that process was configured with `availability.exit_on_end` or `restart: exit_on_failure`. Every exit routed through the same path, and a restarted process does not exit cleanly (a `SIGTERM`ed process reports a non-zero code), so an intentional restart was indistinguishable from the process ending. This affected manual restarts from the TUI, the CLI and the API; it is also what would have made every watch-triggered restart end the project.\r\n- Fixed [namespace operations](https://f1bonacc1.github.io/process-compose/configuration/#namespace-operations) skipping processes that were not started: `process-compose namespace start <ns>` now starts every configured member of the namespace, including processes excluded from an `up <process>...` selection or marked `disabled: true`, instead of failing with \"namespace not found (no processes assigned)\", addresses issue #528.\r\n- Fixed a [project update or reload](https://f1bonacc1.github.io/process-compose/configuration/#project-edit) starting the processes that were excluded from a `process-compose up <process>...` selection: the selection is now re-applied to the reloaded configuration, the same way the `--namespace` admission policies already were.\r\n- Fixed a project or process update shutting the project down when it restarted the only running process: the momentary gap while the process is stopped is no longer mistaken for the project having completed.\r\n- Fixed stopping or restarting a process while it is still waiting on its [dependencies](https://f1bonacc1.github.io/process-compose/launcher/#define-process-dependencies): the process was left wedged in `Terminating` and its still-waiting instance later started an untracked copy, which `stop`, `start` and `restart` could not manage, which a subsequent `start` duplicated, and which survived `down` as an orphan. A pending process now stops immediately instead of waiting for its dependencies to resolve, and a superseded instance can no longer deregister its replacement, addresses issue #530.\r\n- Fixed the TUI **Namespace Operations** modal silently ignoring failures: a failed namespace start, stop or restart is now reported in an error dialog instead of only being written to the log file.\r\n- Fixed the HTTP API rejecting process names that contain slashes: routes are now matched against the raw percent-encoded path and the client encodes process names as path segments, addresses issue #523.\r\n- Client-mode commands (`down`, `attach`, `list`, `process`, `project`, `namespace`) now write their internal logs to a [separate log file](https://f1bonacc1.github.io/process-compose/logging/#client-commands-and-pc_log_file) (`/tmp/process-compose-$USER-client.log` by default) instead of truncating the log file of a running server, documentation by @soy-chrislo.\r\n\r\n## Changelog\r\n* 4857b39404e1e672da77727e549cc0f6d7379648 Merge branch 'main' of github.com:F1bonacc1/process-compose\r\n* c458fd26b1b9f7c741447b6a07f44673ccaf3138 chore: release v1.122.0 notes and update vendor hash\r\n* 644f0e8e2793557e15de24e2e5872253b4f32bd3 chore: update project dependencies\r\n* 414372efe628b428667df21738134c657538a328 docs(logging): clarify PC_LOG_FILE truncation between server and client commands (#516)\r\n* 54c2ef9bfe33dc4b3ca9f8ccdf38718705f33ee1 feat: implement filesystem watching to trigger process restarts with optional cascading dependents\r\n* f5a43e7ace20c127a0955047d277d85590785271 feat: implement multi-namespace support for processes with configuration and TUI updates Addresses: #519\r\n* e42175058ad74fdbeb48137d42dfc447d29e6451 fix: allow starting disabled namespace members and fix TUI error reporting and project shutdown race conditions Addresses #528\r\n* 54273f802b6c344986ecb169a185dc7044a90009 fix: handle process names with slashes by updating API routing and normalizing path segment encoding Addresses: #523\r\n* 673850dd20683ef14b33890444ca3416d02c751c fix: prevent restart-in-flight from overriding stop requests by tracking stop epochs and retriggering completion checks.\r\n* 8528c8d2e15038f533a252063d69281e4fe75270 fix: resolve process restart deadlock by aborting dependency wait on termination and properly initializing incarnation state Addresses #530\r\n* 8352b2faecb305571e2a70b51816878ce4a19619 refactor: redirect client-mode command logs to separate files using cobra annotations\r\n\r\n","mentions_count":1}
