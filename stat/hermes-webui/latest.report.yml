quena/hermes-webui/pull/8194\n* Release exp-v0.52.470: metadata-only session reads skip regeneration authority (#8173) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8207\n* fix(sessions): skip regeneration authority on metadata-only reads by @tobenot in https://github.com/nesquena/hermes-webui/pull/8173\n* Release exp-v0.52.471: a malformed passkey response is a 400/401, never a 500 (#8138) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8145\n* fix(passkeys): a malformed passkey response is a 400/401, never a 500 (#8126) by @ybai08 in https://github.com/nesquena/hermes-webui/pull/8138\n* Release exp-v0.52.472: Insights Models card gets 3x width in the usage row (#8157) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8209\n* fix(insights): give the Models card 3x width in the usage row by @aleesposito85 in https://github.com/nesquena/hermes-webui/pull/8157\n* Release (tag at ship): sign-in works with a malformed foreign cookie (#8124, fixes #8123) [maintainer GO required] by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8136\n* parse_cookie: skip malformed cookies instead of dropping the rest of the header by @pcsokonay in https://github.com/nesquena/hermes-webui/pull/8124\n* Release (tag at ship): Enter on a focused control (incl. Deny) no longer approves a pending action (#8131, fixes #8130) [independent review required] by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8134\n* fix(approval): Enter on a focused control (incl. Deny) no longer approves a pending action (#8130) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8131\n* Release (tag at ship): English Edge TTS voices, title-regenerate error text, sign-in page language (#8210, #8117, #8182) + RFC docs (#7852) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/8213\n* fix: resolve #2361 \u2014 run state consistency authority matrix, invariants 10-11, and layer-named 