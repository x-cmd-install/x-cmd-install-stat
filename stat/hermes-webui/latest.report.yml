{"id":451924008,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR1LuPM4a79Ao","tag_name":"v0.52.702","target_commitish":"master","name":"v0.52.702","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-19T21:00:49Z","updated_at":"2026-11-20T00:45:02Z","published_at":"2026-11-19T21:01:08Z","assets":[],"body":"## Known issues\n- **Context meter after a reload or model switch (#8975).** For some sessions on custom or self-hosted endpoints, the\n  context meter can show the default window (256K) instead of the model's real window after a page reload or a model\n  switch. It corrects itself on the next turn. Compression and chats are unaffected. Context-management plugins that\n  read WebUI's context window see the same default until then.\n- Credentials can pair with the wrong URL on Agent builds after hermes-agent #151775 when a providers: entry named like a built-in provider has its own URL and model.base_url differs (#8973, Form 3). Present in every release; not fixed yet.\n- **\"Always allow\" on approvals WebUI holds (#9128).** With an Agent connected, \"Always allow\" on an approval that WebUI holds lasts for the session but isn't saved, so a new session asks again. It never allows more than you chose. It isn't fixed yet; #9128 tracks it.\n- **Agent v0.23.3 (#9149, #9157).** Hermes Agent v0.23.3 stores conversations in a new way that this WebUI release doesn't fully support: a reused conversation can fail on its next message, and session titles, workspace folders and token counts stop syncing to the Agent's database. Don't update the Agent to v0.23.3 until a stable WebUI release lists this as fixed; Agent v0.23.2 and earlier are unaffected. Agent `main` and canary builds since Nov 17 (version 0.23.2+N) have the same issue. Fixes are in exp-v0.52.713, exp-v0.52.715 and exp-v0.52.718; the last fix (#9150) is shipping to the experimental channel now.\n\n\n## What's Changed\n* Release exp-v0.52.702: async completion ACK retry keeps a finished delegation from being delivered twice (#9124) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/9135\n* fix(delegation): retry the durable completion ACK on transient ledger errors by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/9124\n\n\n**Full Changelog**: https://github.com/nesquena/hermes-webui/compare/v0.52.701...v0.52.702\n\n","mentions_count":1}
