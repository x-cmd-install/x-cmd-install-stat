{"id":446364109,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR1LuPM4amvnN","tag_name":"v0.52.679","target_commitish":"master","name":"v0.52.679","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-15T21:01:32Z","updated_at":"2026-11-15T21:02:52Z","published_at":"2026-11-15T21:01:53Z","assets":[],"body":"## Known issues\n- **Context meter after a reload or model switch (#8975).** For some sessions on custom or self-hosted endpoints, the\n  context meter can show the default window (256K) instead of the model's real window after a page reload or a model\n  switch. It corrects itself on the next turn. Compression and chats are unaffected. Context-management plugins that\n  read WebUI's context window see the same default until then.\n- Credentials can pair with the wrong URL on Agent builds after hermes-agent #151775 when a providers: entry named like a built-in provider has its own URL and model.base_url differs (#8973, Form 3). Present in every release; fix in progress.\n- **External memory providers on newer Agent builds (#9060).** With a Hermes Agent at or after `c9de60702c0d` (Agent `main` since Nov 13, canary builds since Nov 14, and the v0.23.2 release candidates), WebUI chats silently run without an external memory provider such as honcho or mem0. Agent v0.23.1 and earlier are unaffected. The fix is in exp-v0.52.686 and comes to stable with the next promotion.\n\n\n## What's Changed\n* Release exp-v0.52.679: New Chat shows why it could not create a session (#9027) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/9043\n* fix(sessions): surface the reason New Chat could not create a session by @pxxD1998 in https://github.com/nesquena/hermes-webui/pull/9027\n\n\n**Full Changelog**: https://github.com/nesquena/hermes-webui/compare/v0.52.678...v0.52.679\n","mentions_count":2}
