{"id":455183892,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR1LuPM4bIY4U","tag_name":"v0.52.732","target_commitish":"master","name":"v0.52.732","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-23T09:01:45Z","updated_at":"2026-11-23T09:04:16Z","published_at":"2026-11-23T09:02:08Z","assets":[],"body":"## Known issues\n- **Context meter after a reload or model switch (#8975).** For some sessions on custom or self-hosted endpoints, the\n  context meter can show the default window (256K) instead of the model's real window after a page reload or a model\n  switch. It corrects itself on the next turn. Compression and chats are unaffected. Context-management plugins that\n  read WebUI's context window see the same default until then.\n- Credentials can pair with the wrong URL on Agent builds after hermes-agent #151775 when a providers: entry named like a built-in provider has its own URL and model.base_url differs (#8973, Form 3). Present in every release; not fixed yet.\n- **\"Always allow\" on approvals WebUI holds (#9128).** With an Agent connected, \"Always allow\" on an approval that WebUI holds lasts for the session but isn't saved, so a new session asks again. It never allows more than you chose. It isn't fixed yet; #9128 tracks it.\n\n\n## What's Changed\n* docs(changelog): stamp v0.52.724 by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/9264\n* Release exp-v0.52.732: German reads as one consistent translation (#8787) by @nesquena-hermes in https://github.com/nesquena/hermes-webui/pull/9265\n* i18n(de): unify register and glossary, restore meaning lost against en by @goetterbote2342 in https://github.com/nesquena/hermes-webui/pull/8787\n\n## New Contributors\n* @goetterbote2342 made their first contribution in https://github.com/nesquena/hermes-webui/pull/8787\n\n**Full Changelog**: https://github.com/nesquena/hermes-webui/compare/v0.52.731...v0.52.732","mentions_count":2}
