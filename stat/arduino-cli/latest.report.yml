"uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":1866,"digest":"sha256:2dcdbb96947be7ee1b6c5acccd10acb9d1c28e945448f35a93c79059ebd2d776","download_count":9,"created_at":"2026-11-10T15:38:07Z","updated_at":"2026-11-10T15:38:07Z"}],"body":"## What's Changed\r\n\r\n### Improvements\r\n* Arduino CLI is now available for Windows on ARM64. by @cmaglie in https://github.com/arduino/arduino-cli/pull/3249\r\n* Lower memory use when loading the library index. by @lucarin91 in https://github.com/arduino/arduino-cli/pull/3261 and https://github.com/arduino/arduino-cli/pull/3343\r\n* Faster `upload` when no port is given and the board does not need one. by @robgee86 in https://github.com/arduino/arduino-cli/pull/3348\r\n* Faster installation of cores and tools packed as `.xz` archives. by @lucarin91 in https://github.com/arduino/arduino-cli/pull/3332\r\n* Package index URLs no longer need to end with a file name. by @pillo79 in https://github.com/arduino/arduino-cli/pull/3227\r\n* Downloads from GitHub use `GITHUB_TOKEN`, if it is set, to avoid GitHub download limits. by @pillo79 in https://github.com/arduino/arduino-cli/pull/3201\r\n\r\n### Bug fixes\r\n* Installed files are safely written to disk, so a power loss during an installation no longer leaves broken files. by @lucarin91 in https://github.com/arduino/arduino-cli/pull/3329\r\n* Pressing Ctrl-C twice now always stops the CLI. by @lucarin91 in https://github.com/arduino/arduino-cli/pull/3288\r\n* Fixed a crash when a board does not define its flash memory size. by @cmaglie in https://github.com/arduino/arduino-cli/pull/3306\r\n* Fixed a crash when the configuration is read and changed at the same time. by @nitishagar in https://github.com/arduino/arduino-cli/pull/3216\r\n* Libraries whose `utility` folder is a symlink now compile correctly. by @cmaglie in https://github.com/arduino/arduino-cli/pull/3257\r\n* Library detection no longer fails when the compiler prints colored error messages. by @giri256 in https://github.com/arduino/arduino-cli/pull/3248\r\n* Platform versions that are installed but no longer in any package index are now shown correctly. by @pillo79 in https://github.com/arduino/arduino-cli/pull/3233\r\n\r\n### For developers and integrators\r\n* The gRPC API exposes the libraries that a platform provides. by @mirkoCrobu in https://github.com/arduino/arduino-cli/pull/3295\r\n* Tools can be force-installed for a different architecture. by @facchinm in https://github.com/arduino/arduino-cli/pull/3292\r\n\r\n## New Contributors\r\n* @nitishagar made their first contribution in https://github.com/arduino/arduino-cli/pull/3216\r\n* @giri256 made their first contribution in https://github.com/arduino/arduino-cli/pull/3248\r\n* @lucarin91 made their first contribution in https://github.com/arduino/arduino-cli/pull/3261\r\n* @mirkoCrobu made their first contribution in https://github.com/arduino/arduino-cli/pull/3295\r\n* @robgee86 made their first contribution in https://github.com/arduino/arduino-cli/pull/3348\r\n\r\n**Full Changelog**: https://github.com/arduino/arduino-cli/compare/v1.5.1...v1.6.0","mentions_count":8}
