<!-- Release notes generated using configuration in .github/release.yml at v0.4.00 -->\n\n## What's Changed\n### Other\n* fix(actions): read response files on every getValueOf call by @xaaha in https://github.com/xaaha/hulak/pull/252\n* fix(actions): invalidate a cached response file against the file on disk by @xaaha in https://github.com/xaaha/hulak/pull/254\n* chore: drop review bookkeeping from the getValueOf cache comments by @xaaha in https://github.com/xaaha/hulak/pull/264\n* fix(test): stop the doctor fixtures committing to the developer's repository by @xaaha in https://github.com/xaaha/hulak/pull/263\n* chore: upgrade Go to 1.27.1, pin golangci-lint once, silence the mise warning by @xaaha in https://github.com/xaaha/hulak/pull/262\n* fix(release): move the cask's quarantine removal off the deprecated postflight by @xaaha in https://github.com/xaaha/hulak/pull/265\n* fix: reject multi-document request files (#257) by @xaaha in https://github.com/xaaha/hulak/pull/267\n* fix: getFile backticks, GraphQL kind reporting, and a request variable helper (#258) by @xaaha in https://github.com/xaaha/hulak/pull/266\n* fix: mask resolved secret values in dry-run and debug output (#256) by @xaaha in https://github.com/xaaha/hulak/pull/268\n* fix(template): ignore {{.2}} and chained {{(.a).b}} as env keys by @MrBeldum in https://github.com/xaaha/hulak/pull/272\n* feat(mcp): list_requests reports host, auth and variables (#259) by @xaaha in https://github.com/xaaha/hulak/pull/273\n* feat(mcp): add read_request and request_format, and tell agents when to use hulak (#260) by @xaaha in https://github.com/xaaha/hulak/pull/274\n* fix: reject split request files before the env prompt (#269) by @xaaha in https://github.com/xaaha/hulak/pull/276\n* fix: upgrade go-yaml so non-text field values error instead of panic (#278) by @xaaha in https://github.com/xaaha/hulak/pull/279\n* test(secrets): fix the flaky same-second backup collision test by @xaaha in https://github.com/xaaha/hulak/pull/281\n* docs: replace the README logo with the swallow-and-envelope mark and add a tagline by @xaaha in https://github.com/xaaha/hulak/pull/282\n\n## New Contributors\n* @MrBeldum made their first contribution in https://github.com/xaaha/hulak/pull/272\n\n**Full Changelog**: https://github.com/xaaha/hulak/compare/v0.3.33...v0.4.00\n","mentions_count":2}
