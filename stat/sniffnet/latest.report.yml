:"Sniffnet_macOS_Intel.dmg","label":null,"uploader":{"login":"GyulyVGC","id":100347457,"node_id":"U_kgDOBfsuQQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-diskcopy","state":"uploaded","size":16928753,"digest":"sha256:aee70b9263594db8477c1429d61eff4f4a89793b42765a03c62c5c193e364802","download_count":830,"created_at":"2026-11-13T15:53:22Z","updated_at":"2026-11-13T15:53:30Z"},{"id":744225124,"node_id":"RA_kwDOHvz5Q84sW_lk","name":"Sniffnet_Windows_arm64.msi","label":null,"uploader":{"login":"GyulyVGC","id":100347457,"node_id":"U_kgDOBfsuQQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17731584,"digest":"sha256:e9deec7d7bf0013bd51cfd4493ef63fc1fe8adbf3a507c6caa7a7c8e997c29e0","download_count":209,"created_at":"2026-11-13T15:53:14Z","updated_at":"2026-11-13T15:53:22Z"},{"id":744224593,"node_id":"RA_kwDOHvz5Q84sW_dR","name":"Sniffnet_Windows_x64.msi","label":null,"uploader":{"login":"GyulyVGC","id":100347457,"node_id":"U_kgDOBfsuQQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18268160,"digest":"sha256:37da7e813f75a9881a3a7133d60b7e634ac0c97edf7df66e9fc94022ad4f2f00","download_count":3366,"created_at":"2026-11-13T15:53:05Z","updated_at":"2026-11-13T15:53:14Z"},{"id":744223434,"node_id":"RA_kwDOHvz5Q84sW_LK","name":"Sniffnet_Windows_x86.msi","label":null,"uploader":{"login":"GyulyVGC","id":100347457,"node_id":"U_kgDOBfsuQQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17604608,"digest":"sha256:1e031c23d6117e01f633c18551e05d6b863cf5858afe144765af01bfd853a9c7","download_count":372,"created_at":"2026-11-13T15:52:42Z","updated_at":"2026-11-13T15:52:51Z"}],"body":"## New features\r\n- IPFIX collector capabilities: receive and analyze network traffic from remote devices ([#1270](https://github.com/GyulyVGC/sniffnet/pull/1270) — fixes [#303](https://github.com/GyulyVGC/sniffnet/issues/303))\r\n\r\n<div align=\"center\">\r\n<picture><img title=\"IPFIX support\" width=\"65%\" alt=\"cover\" src=\"https://github.com/user-attachments/assets/131d4722-f03c-473e-85bc-83204fd910a0\" /></picture>\r\n<picture><img title=\"IPFIX support\" width=\"65%\" alt=\"cs_ipfix\" src=\"https://github.com/user-attachments/assets/b70182b0-2b6c-4ab6-9fe7-2b5d8f03961d\" /></picture>\r\n</div>\r\n\r\n- Show current data rates ([#1324](https://github.com/GyulyVGC/sniffnet/pull/1324) — fixes [#1077](https://github.com/GyulyVGC/sniffnet/issues/1077), [#1135](https://github.com/GyulyVGC/sniffnet/issues/1135))\r\n\r\n<div align=\"center\">\r\n<picture><img width=\"75%\" title=\"Current data rates\" src=\"https://github.com/user-attachments/assets/e11fe608-fe27-433f-b9de-12f730fcc5fc\" /></picture>\r\n</div>\r\n\r\n- Service taxonomy: classify upper layer services into 20 different categories ([#1312](https://github.com/GyulyVGC/sniffnet/pull/1312) — fixes [#1102](https://github.com/GyulyVGC/sniffnet/issues/1102))\r\n\r\n<div align=\"center\">\r\n<picture><img width=\"40%\" title=\"Service taxonomy\" src=\"https://github.com/user-attachments/assets/48602971-57ae-4eed-a839-12c09e05b738\" /></picture>\r\n</div>\r\n\r\n- Added support for IGMP connections and messages ([#1301](https://github.com/GyulyVGC/sniffnet/pull/1301) — fixes [#1269](https://github.com/GyulyVGC/sniffnet/issues/1269))\r\n- Added support for VLAN-tagged connections ([#1302](https://github.com/GyulyVGC/sniffnet/pull/1302) — fixes [#1070](https://github.com/GyulyVGC/sniffnet/issues/1070))\r\n- Expanded view setting: slimmer header and hidden footer, allowing users to focus on what matters most ([#1310](https://github.com/GyulyVGC/sniffnet/pull/1310) — fixes [#884](https://github.com/GyulyVGC/sniffnet/issues/884))\r\n- Added Albanian translation 🇦🇱 ([#1340](https://github.com/GyulyVGC/sniffnet/pull/1340))\r\n\r\n## Improvements\r\n- Enhance update checks ([#1307](https://github.com/GyulyVGC/sniffnet/pull/1307) — fixes [#1027](https://github.com/GyulyVGC/sniffnet/issues/1027))\r\n- Show output file path in Overview page when exporting a PCAP file ([`3f2c42c`](https://github.com/GyulyVGC/sniffnet/pull/1290/commits/3f2c42c70f06d5d29ddad80dde956281c6705511))\r\n- Show more details about dropped packets ([#1306](https://github.com/GyulyVGC/sniffnet/pull/1306) — fixes [#1079](https://github.com/GyulyVGC/sniffnet/issues/1079))\r\n- The Sniffnet Wiki has been moved from GitHub to [sniffnet.app/wiki](https://sniffnet.app/wiki/)\r\n- Updated some of the existing translations to v1.6:\r\n  - Simplified Chinese ([#1322](https://github.com/GyulyVGC/sniffnet/pull/1322))\r\n  - Traditional Chinese (Taiwan) ([#1323](https://github.com/GyulyVGC/sniffnet/pull/1323))\r\n  - Russian ([#1328](https://github.com/GyulyVGC/sniffnet/pull/1328))\r\n  - French ([#1330](https://github.com/GyulyVGC/sniffnet/pull/1330))\r\n  - Spanish ([#1339](https://github.com/GyulyVGC/sniffnet/pull/1339))\r\n  - Vietnamese ([#1342](https://github.com/GyulyVGC/sniffnet/pull/1342))\r\n  - Indonesian ([#1345](https://github.com/GyulyVGC/sniffnet/pull/1345))\r\n  - Uzbek ([#1352](https://github.com/GyulyVGC/sniffnet/pull/1352))\r\n  - Polish ([#1353](https://github.com/GyulyVGC/sniffnet/pull/1353))\r\n\r\n\r\n## Fixes\r\n- Avoid opening captures on Linux D-Bus devices, preventing system operations from hanging ([#1320](https://github.com/GyulyVGC/sniffnet/pull/1320) — fixes [#1190](https://github.com/GyulyVGC/sniffnet/issues/1190))\r\n- Fix the app freezing and exhausting memory when importing a PCAP file containing a large time gap between consecutive packets ([`4605ec7`](https://github.com/GyulyVGC/sniffnet/pull/1290/commits/4605ec717bbaf8fa34268805814d5585f084201e))\r\n- Restrict the PCAP export file to have a valid PCAP extension, so that files of other types can't be overwritten ([`5b4801b`](https://github.com/GyulyVGC/sniffnet/pull/1290/commits/5b4801b438ff1c7968cfac423a8e8585778309a8))\r\n- Correctly filter by favorites-only before rDNS completes ([#1275](https://github.com/GyulyVGC/sniffnet/pull/1275))\r\n- Set `Content-Type: application/json` header on remote notifications ([#1266](https://github.com/GyulyVGC/sniffnet/pull/1266))\r\n\r\n## Thanks to:\r\n- @recallai, @coderabbitai, @ipinfo, @cthulu201, @golanbenoni, @ZEROF, @wahn for [sponsoring Sniffnet](https://github.com/sponsors/GyulyVGC) 💖 \r\n- [NLnet](https://nlnet.nl) for supporting the development of this version via the [NGI Zero Commons Fund](https://nlnet.nl/commonsfund/)\r\n- @Src-Bhavesh for reporting and fixing Linux system bugs when capturing on D-Bus devices\r\n- @cuyua9 for fixing favorites filtering before rDNS completes\r\n- @karpovantonme for adding the `Content-Type` header on remote notifications\r\n- @tomCSLK for fixing IPFIX parsing in presence of zero-length fields\r\n- @bgodole for adding Albanian translation\r\n- @isecvirus for drafting Arabic translation\r\n-  @tinngo777, @jason081112, @mrvi0, @Charpy, @FrancoB4, @Ptraaah, @turgunovabb1, @przemekperon, for updating the existing translations\r\n\r\n<p>\r\n<picture>\r\n<img alt=\"\" src=\"https://github.com/GyulyVGC/sniffnet/blob/main/resources/repository/hr.png?raw=true\" width=\"100%\"/>\r\n</picture>\r\n</p>\r\n\r\n<div align=\"center\">\r\n\r\n<h3> Support Sniffnet </h3>\r\n\r\n<a href=\"https://github.com/sponsors/GyulyVGC\">\r\n<img alt=\"\" title=\"Sponsor\" src=\"https://custom-icon-badges.demolab.com/badge/-Sponsor-ea4aaa?style=for-the-badge&logo=heart&logoColor=white\"/>\r\n</a>\r\n\r\n<h3> Stay in the loop </h3>\r\n\r\n<p>\r\n<a href=\"https://bsky.app/profile/sniffnet.app\"><img width=\"48\" height=\"48\" alt=\"Bluesky\" title=\"Bluesky\" src=\"https://raw.githubusercontent.com/GyulyVGC/sniffnet/main/resources/repository/badges/bluesky.svg\"/></a>&nbsp;\r\n<a href=\"https://www.linkedin.com/company/sniffnet\"><img width=\"48\" height=\"48\" alt=\"LinkedIn\" title=\"LinkedIn\" src=\"https://raw.githubusercontent.com/GyulyVGC/sniffnet/main/resources/repository/badges/linkedin.svg\"/></a>&nbsp;\r\n<a href=\"https://mastodon.social/@sniffnet\"><img width=\"48\" height=\"48\" alt=\"Mastodon\" title=\"Mastodon\" src=\"https://raw.githubusercontent.com/GyulyVGC/sniffnet/main/resources/repository/badges/mastodon.svg\"/></a>&nbsp;\r\n<a href=\"https://t.me/sniffnet\"><img width=\"48\" height=\"48\" alt=\"Telegram\" title=\"Telegram\" src=\"https://raw.githubusercontent.com/GyulyVGC/sniffnet/main/resources/repository/badges/telegram.svg\"/></a>&nbsp;\r\n<a href=\"https://x.com/sniffnet\"><img width=\"48\" height=\"48\" alt=\"Twitter / X\" title=\"Twitter / X\" src=\"https://raw.githubusercontent.com/GyulyVGC/sniffnet/main/resources/repository/badges/x.svg\"/></a>\r\n</p>\r\n\r\n</div>","reactions":{"total_count":32,"+1":13,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":8,"rocket":5,"eyes":2},"mentions_count":21}
