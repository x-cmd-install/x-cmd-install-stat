{"id":92893556,"author":{"login":"fathyb","id":5746414,"node_id":"MDQ6VXNlcjU3NDY0MTQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOIz4ePs4FiXF0","tag_name":"v0.0.3","target_commitish":"main","name":"0.0.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2023-02-18T00:17:20Z","updated_at":"2023-02-18T00:31:03Z","published_at":"2023-02-18T00:23:14Z","assets":[{"id":96129489,"node_id":"RA_kwDOIz4ePs4FutHR","name":"carbonyl.linux-amd64.zip","label":null,"uploader":{"login":"fathyb","id":5746414,"node_id":"MDQ6VXNlcjU3NDY0MTQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":78049320,"digest":null,"download_count":63081,"created_at":"2023-02-18T00:20:24Z","updated_at":"2023-02-18T00:20:29Z"},{"id":96129493,"node_id":"RA_kwDOIz4ePs4FutHV","name":"carbonyl.linux-arm64.zip","label":null,"uploader":{"login":"fathyb","id":5746414,"node_id":"MDQ6VXNlcjU3NDY0MTQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":80183490,"digest":null,"download_count":7732,"created_at":"2023-02-18T00:20:28Z","updated_at":"2023-02-18T00:20:32Z"},{"id":96129498,"node_id":"RA_kwDOIz4ePs4FutHa","name":"carbonyl.macos-amd64.zip","label":null,"uploader":{"login":"fathyb","id":5746414,"node_id":"MDQ6VXNlcjU3NDY0MTQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":77040274,"digest":null,"download_count":4088,"created_at":"2023-02-18T00:20:38Z","updated_at":"2023-02-18T00:20:41Z"},{"id":96129500,"node_id":"RA_kwDOIz4ePs4FutHc","name":"carbonyl.macos-arm64.zip","label":null,"uploader":{"login":"fathyb","id":5746414,"node_id":"MDQ6VXNlcjU3NDY0MTQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":68738483,"digest":null,"download_count":6293,"created_at":"2023-02-18T00:20:40Z","updated_at":"2023-02-18T00:20:43Z"}],"body":"This second release of Carbonyl is very special!\r\n\r\n\r\n## Introducing Bitmap Mode\r\n\r\nYou can now start Carbonyl with a `--bitmap` flag to disable terminal text rendering.\r\nCombined with the new `--zoom` flag, this lets you get a high-res browser in most terminals with zoom control. Look ma', no SIXEL!\r\n\r\n<p>&nbsp;</p>\r\n\r\n<div align=\"center\">\r\n  <video src=\"https://user-images.githubusercontent.com/5746414/219806624-d8d89a5e-085e-4d24-8daf-823b8d549ed3.mp4\" />\r\n</div>\r\n\r\n<p>&nbsp;</p>\r\n\r\nSome terminals such as the macOS stock terminal are not efficient enough to render in bitmap mode. We found Alacritty and Kitty to perform the best, although Kitty's zoom is limited. Alacritty can render Carbonyl in 1080p at ~40FPS on an M1.\r\n\r\nMore is coming to bitmap mode. Most notably, we will integrate the complete Chromium UI.\r\n\r\n## Bigger\r\n\r\nCarbonyl now uses a process we call \"quadrant binarization\": we take 4 pixels and turn them into a foreground color, a background color, and one of these unicode quadrant characters: `\u2584`, `\u2596`, `\u2597`, `\u259d`, `\u2598`, `\u259e`, `\u2590`, `\u258c`, `\u259a`. ([code](https://github.com/fathyb/carbonyl/blob/6748a197c2974b113e8dde1d4f9ba594a5f77a5e/src/output/quad.rs))\r\n\r\nThis allows Carbonyl to render 4 visible pixels per terminal cells, instead of 2 for previous versions. The page zoom also got tweaked to look better on terminals.\r\n\r\n<table>\r\n  <tr>\r\n    <th><code>0.0.2</code>\r\n    <th><code>0.0.3</code>\r\n  <tr>\r\n    <td><img alt=\"Screenshot 2023-02-17 at 23 08 32\" src=\"https://user-images.githubusercontent.com/5746414/219803102-d57252ce-d092-45f3-a1ed-cfaefdbab1ba.png\">\r\n    <td><img alt=\"Screenshot 2023-02-17 at 23 08 40\" src=\"https://user-images.githubusercontent.com/5746414/219803099-795ff207-5e2a-48e7-9358-a6b025a69e7d.png\">\r\n  </tr>\r\n  <tr>\r\n    <td><img width=\"1220\" alt=\"Screenshot 2023-02-17 at 23 12 26\" src=\"https://user-images.githubusercontent.com/5746414/219803637-947055ff-ddff-4aa3-b9b2-b3a892c4a890.png\">\r\n    <td><img width=\"1218\" alt=\"Screenshot 2023-02-17 at 23 12 34\" src=\"https://user-images.githubusercontent.com/5746414/219803642-c817d8f8-7493-45a0-aa08-dd06e51e839c.png\">\r\n  </tr>\r\n  <tr>\r\n    <td><img width=\"1458\" alt=\"Screenshot 2023-02-18 at 00 33 06 1\" src=\"https://user-images.githubusercontent.com/5746414/219816554-df8ed4b7-20e5-4489-a453-ed2ce7c674b7.png\">\r\n    <td><img width=\"1458\" alt=\"Screenshot 2023-02-18 at 00 33 14\" src=\"https://user-images.githubusercontent.com/5746414/219816549-3b498881-4aca-426e-9475-e357c52c714a.png\">\r\n  </tr>\r\n</table>\r\n\r\n\r\n## Faster\r\n\r\nBitmap mode puts more pressure on Carbonyl's renderer, so the renderer now runs in a dedicated thread and batches input events. This frees the browser thread to handle inputs and send them to tab processes. This makes expensive inputs such as scrolling far smoother.\r\n\r\nAll binaries are now compiled with Chromium PGO profiles, this brings a ~4% speedup. macOS binaries are now compiled with LLVM `lld` and have LTO enabled, this brings a ~15% speedup.\r\n\r\n## Lighter\r\n\r\nPrevious versions required a cocktail of ~20 dependencies to work on Linux. It makes sense for Chromium to have that many dependencies, but in our case we do not render in a window server or use GUI toolkits.\r\n\r\nThis version of Carbonyl only requires 4 dependencies now:\r\n- `libnss3`: SSL library needed for root SSL certificates\r\n- `libexpat1`: XML library, will be removed in the future\r\n- `libasound2`: ALSA library for audio playback\r\n- `libfontconfig1`: we need the configuration this package generates\r\n\r\nThis makes the Docker image go from 160 MB to 110 MB.\r\n\r\n---\r\n\r\n### \ud83d\ude80 Features\r\n\r\n- Add `--help` and `--version` ([#105](https://github.com/fathyb/carbonyl/issues/105))\r\n- Add logo and description to `--help` ([#106](https://github.com/fathyb/carbonyl/issues/106))\r\n- Use Cmd instead of Alt for navigation shortcuts ([#109](https://github.com/fathyb/carbonyl/issues/109))\r\n- Enable h.264 support ([#103](https://github.com/fathyb/carbonyl/issues/103))\r\n- Introduce quadrant rendering ([#120](https://github.com/fathyb/carbonyl/issues/120))\r\n\r\n### \ud83d\udc1b Bug Fixes\r\n\r\n- Fix arguments parsing ([#108](https://github.com/fathyb/carbonyl/issues/108))\r\n- Fix missing module error on npm package ([#113](https://github.com/fathyb/carbonyl/issues/113))\r\n- Enable threaded compositing with bitmap mode\r\n- Fix idling CPU usage ([#126](https://github.com/fathyb/carbonyl/issues/126))\r\n- Package proper library in binaries ([#127](https://github.com/fathyb/carbonyl/issues/127))\r\n\r\n### \ud83d\udcd6 Documentation\r\n\r\n- Update download links\r\n- Fix commit_preprocessors url ([#102](https://github.com/fathyb/carbonyl/issues/102))\r\n- Add `--rm` to Docker example ([#101](https://github.com/fathyb/carbonyl/issues/101))\r\n","reactions":{"total_count":74,"+1":27,"-1":0,"laugh":0,"hooray":22,"confused":0,"heart":18,"rocket":6,"eyes":1}}
