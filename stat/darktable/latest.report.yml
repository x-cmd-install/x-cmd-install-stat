":"darktable-5.6.2.tar.xz","label":null,"uploader":{"login":"TurboGit","id":467069,"node_id":"MDQ6VXNlcjQ2NzA2OQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":8458268,"digest":"sha256:d2da92c670401d350b576431f21e58bee40348e1f5078201a8a1b8c270585834","download_count":1057,"created_at":"2026-10-04T15:53:45Z","updated_at":"2026-10-04T15:53:47Z"},{"id":610129381,"node_id":"RA_kwDOADnb284kXdXl","name":"darktable-5.6.2.tar.xz.asc","label":null,"uploader":{"login":"TurboGit","id":467069,"node_id":"MDQ6VXNlcjQ2NzA2OQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":195,"digest":"sha256:ac556938f2f8ffbfcbba5bd43fa8402b56b074525b09ff70ed7e210eb0a29811","download_count":66,"created_at":"2026-10-04T15:53:47Z","updated_at":"2026-10-04T15:53:48Z"}],"body":"We're proud to announce the bug-fix release of darktable, 5.6.2!\r\n\r\nThe github release is here: [https://github.com/darktable-org/darktable/releases/tag/release-5.6.2](https://github.com/darktable-org/darktable/releases/tag/release-5.6.2).\r\n\r\nTo build from source, do not use the autogenerated tarball provided by GitHub on the release page, download our tar.xz file instead. If you're just building for yourself without creating a package for some distribution, then using source code cloning in git is an even more convenient way.\r\n\r\nThe checksums are:\r\n\r\n```\r\n$ sha256sum darktable-5.6.2.tar.xz\r\n  d2da92c670401d350b576431f21e58bee40348e1f5078201a8a1b8c270585834  darktable-5.6.2.tar.xz\r\n\r\n$ sha256sum darktable-5.6.2-x86_64.AppImage\r\n  4b0d1c737a2a18c7d8afb81aa3daaf25930bbe541dda98e6354dabd5c2e4dc36  Darktable-5.6.2-x86_64.AppImage\r\n\r\n$ sha256sum darktable-5.6.2-aarch64.AppImage\r\n  5b8015f8534453cb3bbd6e5a03e362cb7d9d9573f20d3928aadad354df18ad10  Darktable-5.6.2-aarch64.AppImage\r\n\r\n$ sha256sum darktable-5.6.2-arm64.dmg\r\n  6ff88e58a2a59cb07b0a1502fea7205e68cd783380a33a3ce7bda68ec29def0c  darktable-5.6.2-arm64.dmg\r\n\r\n$ sha256sum darktable-5.6.2-win64.exe\r\n  7f7a1eabcd0a1b548dcfacac842c8203fc85a4175697fb09f90bb891c8931edd  darktable-5.6.2-win64.exe\r\n\r\n$ sha256sum darktable-5.6.2-woa64.exe\r\n  bcb700de8275f894c29ae4ccb5f600412b269bef1a581eecce9bbed697421fcc  darktable-5.6.2-woa64.exe\r\n```\r\n\r\nWhen updating from the stable 5.4 series, please bear in mind that your edits will be preserved during this process, but the new library and configuration will no longer be usable with 5.4.\r\n\r\nYou are strongly advised to take a backup first.\r\n\r\n#### Important note: to make sure that darktable can keep on supporting the raw file format for your camera, *please* read [this post](https://discuss.pixls.us/t/raw-samples-wanted/5420?u=lebedevri) on how/what raw samples you can contribute to ensure that we have the *full* raw sample set for your camera under CC0 license!\r\n\r\nSince darktable 5.6.1:\r\n\r\n- 63 commits to darktable+rawspeed\r\n- 26 pull requests handled\r\n-  0 issues closed\r\n\r\n## The Big Ones\r\n\r\nThe following is a summary of the main features added to darktable 5.6.2. Please see the user manual for more details of the individual changes (where available).\r\n\r\n- N/A\r\n\r\n## UI/UX Improvements\r\n\r\n- N/A\r\n\r\n## Performance Improvements\r\n\r\n- N/A\r\n\r\n## Other Changes\r\n\r\n- N/A\r\n\r\n## Documentation updates\r\n\r\n- Versioning of the docs has resumed! With release of each new major version of darktable we take a snapshot of the current state of the development-docs.\r\n\r\n- The stable documentation for 5.6.2 can be found [here](https://docs.darktable.org/usermanual/5.6/en/) and now contains a version switcher at the top to switch between 5.6 and development version of the manual.\r\n\r\n- If you find room for improvement on the manual, you are welcome to open an\r\n  [issue](https://github.com/darktable-org/dtdocs/issues), post to\r\n  [pixls.us](https://discuss.pixls.us/c/software/darktable/19),\r\n  or submit a [PR](https://github.com/darktable-org/dtdocs/pulls) yourself.\r\n\r\n- Translations of the docs are maintained through [weblate](https://hosted.weblate.org/projects/darktable-documentation/).\r\n\r\n## Bug Fixes\r\n\r\n- Fixed highlights modes for 4BAYER (CYGM/RGBE) raws, only clipping mode is available for those.\r\n\r\n- Fixed darktable stealing the focus from other applications on Windows, pushing itself in front of whatever you were using and\r\n  taking the keyboard. This could happen when hovering over lighttable thumbnails, during import and export, and when log messages appeared\r\n  or expired.  While darktable was minimized it took the keyboard without becoming visible.\r\n\r\n- Fixed Alt+Tab failing to switch away from darktable on Windows when the mouse pointer was over a lighttable thumbnail.\r\n\r\n- Fixed the console windows that repeatedly appeared on Windows when darktable or a Lua script ran an external command. darktable now\r\n  keeps a single console session for its lifetime instead of creating a new console for each command.\r\n\r\n- Fixed highlights laplacian OpenCL code.\r\n\r\n- Fixed OpenCL input gamma corrected scaling for some devices.\r\n\r\n- Fixed an OpenCL error in filmicrgb leading to wrong masks.\r\n\r\n- Fixed transparent dialog title bars on macOS 27.\r\n\r\n- Fixed a crash when importing a style whose module order is empty. The malformed order is now ignored and the style keeps the default one.\r\n\r\n- Fixed a crash at the end of neural restore's raw denoise on certain sensor sizes, where blending the tile seams wrote past the edge of\r\n  the image.\r\n\r\n- Fixed small memory leaks when expanding variables, which grew with the number of images exported or imported in one run.\r\n\r\n- Fixed a small memory leak each time a history stack was pasted onto the image open in darkroom.\r\n\r\n- Fixed a crash or hang on Windows when checking a faulty custom ONNX Runtime library.\r\n\r\n- Fixed corrupted output or a crash when an AI model returns more data than darktable reserved for it, affecting object masks and Lua models.\r\n\r\n- Fixed OpenCL support for recent Intel drivers.\r\n\r\n## Lua\r\n\r\n### API Version\r\n\r\n- N/A\r\n\r\n### New Features\r\n\r\n- N/A\r\n\r\n### Bug Fixes\r\n\r\n- Stop script_manager from starting twice and causing a stack overflow.\r\n\r\n- Change to user installed scripts directory before updating.\r\n\r\n- Execute user luarc file in all cases.\r\n\r\n### New Scripts\r\n\r\n- N/A\r\n\r\n### Other Lua changes\r\n\r\n- N/A\r\n\r\n## Notes\r\n\r\n- When exporting to AVIF, EXR, JPEG XL, or XCF, selecting specific metadata (e.g. geo-tag or creator) is not currently possible. For\r\n  AVIF, EXR, JPEG XL, and XCF formats, darktable will not include any metadata fields unless the user selects all of the checkboxes in the\r\n  export module's preference options.\r\n\r\n- Starting with release 5.4, macOS versions older than 14.0 are no longer supported on Apple Silicon Macs, nor older than macOS 15 on\r\n  Intel Macs.\r\n\r\n- On Windows 11 24H2 and later, darktable no longer creates any console window. On earlier Windows versions one console window is\r\n  retained for as long as darktable runs and closes automatically when darktable exits.\r\n\r\n## Changed Dependencies\r\n\r\n### Mandatory\r\n\r\n- N/A\r\n\r\n### Optional\r\n\r\n- N/A\r\n\r\n## Camera support, compared to 5.6.1\r\n\r\n### Base Support\r\n\r\n- Leica SL3-P (DNG)\r\n- Sony ILCE-7RM6\r\n\r\n### White Balance Presets\r\n\r\n- N/A\r\n\r\n### Noise Profiles\r\n\r\n- N/A\r\n\r\n### Missing Compression Mode Support\r\n\r\n- Apple ProRAW DNGs\r\n- CinemaDNG lossless (Blackmagic, some DJI, etc.) and lossy (Blackmagic)\r\n- DNG 1.7 using JPEG XL (Adobe enhanced, Samsung Expert RAW)\r\n- Fujifilm lossy RAFs\r\n- Nikon high efficiency NEFs\r\n- Phase One other than IIQ L\r\n- Sony ARW 4.0/5.0 downsized lossless (\"M\" for full-frame, \"S\" for full-frame & APS-C)\r\n- Sony ARW 6.0 compressed and compressed (HQ)\r\n\r\n### Suspended Support\r\n\r\nSupport for the following cameras is suspended because no samples are available on https://raw.pixls.us:\r\n\r\n- Creo/Leaf Aptus 22(LF3779)/Hasselblad H1\r\n- Fujifilm IS-1\r\n- Kodak EasyShare Z980\r\n- Leaf Aptus-II 5(LI300059)/Mamiya 645 AFD\r\n- Leaf Credo 60\r\n- Leaf Credo 80\r\n- Olympus SP320\r\n- Phase One IQ250\r\n- ST Micro STV680\r\n\r\n## Translations\r\n\r\n- Albanian\r\n- Brazilian Portuguese\r\n- Chinese (Simplified)\r\n- Chinese (Traditional)\r\n- Czech\r\n- Dutch\r\n- European Spanish\r\n- Finnish\r\n- French\r\n- German\r\n- Hungarian\r\n- Japanese\r\n- Korean\r\n- Lao\r\n- Norwegian Bokm\u00e5l\r\n- Polish\r\n- Russian\r\n- Slovenian\r\n- Swedish\r\n- Ukrainian\r\n","reactions":{"total_count":24,"+1":3,"-1":0,"laugh":1,"hooray":2,"confused":0,"heart":12,"rocket":3,"eyes":3}}
