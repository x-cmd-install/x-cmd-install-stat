=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2908064,"digest":"sha256:6e3a00d061be73f66282d6dce0533bcaebcb331eb555b38c2802e7ee220dc512","download_count":2637,"created_at":"2025-12-02T20:53:47Z","updated_at":"2025-12-02T20:53:48Z"},{"id":323549158,"node_id":"RA_kwDOB8a8wc4TSPfm","name":"bat_0.26.1_i686.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":3087444,"digest":"sha256:3c8acef5b897084b2168eae343aa72dedc728e265a8edd9f8d2eaf2a718e0c58","download_count":1906,"created_at":"2025-12-02T20:58:12Z","updated_at":"2025-12-02T20:58:12Z"},{"id":323548114,"node_id":"RA_kwDOB8a8wc4TSPPS","name":"bat_0.26.1_musl-linux-armhf.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":2929440,"digest":"sha256:b2c35e363a046e13e8e9267d61046bf9813ff8da7b607f65fcf1e6e4ff6a86e8","download_count":1854,"created_at":"2025-12-02T20:54:09Z","updated_at":"2025-12-02T20:54:09Z"}],"body":"# v0.26.1\r\n\r\n## Features\r\n\r\n- Add paging to '-h' and '--help' see PR #3478 (@MuntasirSZN)\r\n\r\n## Bugfixes\r\n\r\n- Fix hang when using `--list-themes` with an explicit pager, see #3457 (@abhinavcool42)\r\n- Fix negative values of N not being parsed in <N:M> line ranges without `=` flag value separator, see #3442 (@lmmx)\r\n- Fix broken Docker syntax preventing use of custom assets, see #3476 (@keith-hall)\r\n- Fix decorations being applied unexpectedly when piping. Now only line numbers explicitly required on the command line should be applied in auto decorations mode for `cat` compatibility. See #3496 (@keith-hall)\r\n- Fix diagnostics attempting to find the version of an executable named builtin when builtin pager is used. See #3498 (@keith-hall)\r\n- `--help` now correctly reads the config file for theme information etc. See #3507 (@keith-hall)\r\n\r\n## Other\r\n- Improve README documentation on pager options passed to less, see #3443 (@injust)\r\n- Make PowerShell completions compatible with PowerShell v5.1, see #3495 (@keith-hall)\r\n- Use more robust approach to escaping in Bash completions, see #3448 (@akinomyoga)\r\n\r\n## Syntaxes\r\n\r\n- Update quadlet syntax mapping to include *.{build,pod} files #3484 (@cyqsimon)\r\n- Fix inconsistencies in Ada syntax, see #3481 (@AldanTanneo)\r\n- Add syntax mapping for podman's `artifact` quadlet files, see #3497 (@xduugu)\r\n- Highlight Korn Shell scripts (i.e. with a shebang of ...`ksh`) using Bash syntax, see #3509 (@keith-hall)\r\n","reactions":{"total_count":48,"+1":26,"-1":0,"laugh":1,"hooray":4,"confused":0,"heart":10,"rocket":6,"eyes":1},"mentions_count":9}
