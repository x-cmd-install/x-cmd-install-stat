,"updated_at":"2026-09-28T08:32:48Z"},{"id":594915312,"node_id":"RA_kwDOFfNmi84jda_w","name":"skate_1.1.0_x86.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":5486691,"digest":"sha256:a32af893e1b0a4fbc4d2027f6a33851b0a332d82914baaae12f70a9d483fac45","download_count":0,"created_at":"2026-09-28T08:32:46Z","updated_at":"2026-09-28T08:32:47Z"},{"id":594915309,"node_id":"RA_kwDOFfNmi84jda_t","name":"skate_1.1.0_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":5633191,"digest":"sha256:4d75988f6f89bb04ffe93bcce79dafded86d02d68da4cec10b0d65850af9e01b","download_count":0,"created_at":"2026-09-28T08:32:46Z","updated_at":"2026-09-28T08:32:47Z"}],"body":"# Wheel Be Right Back\r\n\r\nA small release with a few new features\r\n\r\n## Copy to clipboard\r\n\r\nYou can now copy straight to the clipboard with `-c` or `--copy` flags\r\n\r\n## Basic aliases\r\n\r\nAwesome @apgmckay added basic aliases for list and delete commands!\r\n\r\n## Customize your location\r\n\r\nAlso, @harryvince added an ability to customize where the passwords are stored! Kudos!\r\n\r\nBests,\r\nCharm XX \u2728\r\n\r\n## Changelog\r\n### New!\r\n* fcff0fa3e1030e429c858ef7c1d36199ae9ab1d3: feat: basic aliases for list and delete commands (#150) (@apgmckay)\r\n* 32f6039ebf3597a6a24776d7338834cfe9c1c548: feat: copy to clipboard flag (#180) (@andrinoff)\r\n* 3ff7fa3f19f65f4dbbb9f0a3c03a08a92f7155c4: feat: implement custom store locations (#183) (@harryvince)\r\n* 0bbe2d19dac92529d3f51b2a3788fb69228f31ee: feat: use fang (#151) (@caarlos0)\r\n### Fixed\r\n* a6cb4e89f659ddbcc932e047b108bdbf76b9dc0e: fix: lint issues (@caarlos0)\r\n### Other stuff\r\n* dd04dc87f5247aae99fb2fbb2d6c6a8138023c72: Revert \"ci: sync dependabot config (#134)\" (#135) (@caarlos0)\r\n* 34ede57a7d9cdaa3e71705b0e7f16ef01cef3847: ci: lint jobs and configs (@caarlos0)\r\n* dd4f35f9733913072f93dbd3012b7163890fee4d: ci: sync dependabot config (#134) (@charmcli)\r\n* 83b241d082c00f5b6157612a9ce1db65db4ddb51: ci: sync dependabot config (#139) (@charmcli)\r\n* b3b6c434684ee5432317c6201d1f572fd0d25498: ci: sync dependabot config (#147) (@charmcli)\r\n* 972e0fa32ba6e6d5c1673ea8f5b6ec36f535ab7b: ci: sync dependabot config (#158) (@charmcli)\r\n* 06ec43c72249d81e95fc2bdce87769f2e318bbc7: ci: sync dependabot config (#163) (@charmcli)\r\n* 7979ffd5a2537d941e70d9575ffe31ddab4771ae: ci: sync dependabot config (#178) (@charmcli)\r\n* 947201b7464ca07b8b1e3d9b88a7d97664c0cbf7: ci: sync golangci-lint config (#155) (@github-actions[bot])\r\n* 42427dcc6e405bb1e4bfd46c2b5990e29bdda8a3: v1.1.0 (@andrinoff)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/skate/releases/download/v1.1.0/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/skate/releases/download/v1.1.0/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/skate/releases/download/v1.1.0/checksums.txt'\r\nwget 'https://github.com/charmbracelet/skate/releases/download/v1.1.0/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","mentions_count":5}
