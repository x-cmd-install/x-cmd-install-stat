d12b0099: fix: document the fact that `set` works with STDIN if the value is omitted (#96) (@ilyagr)\n* 4900be3a38964722df1ee2c9cd7c16edb22bb41e: fix: lint issues (@caarlos0)\n### Dependency updates\n* 451a1b8c9e4d0e6a87df8868cab3b222358d26d3: feat(deps): bump github.com/agnivade/levenshtein from 1.1.1 to 1.2.0 (#108) (@dependabot[bot])\n* b80cf0285b673cb55692ea93158190c881df3367: feat(deps): bump github.com/agnivade/levenshtein from 1.2.0 to 1.2.1 (#124) (@dependabot[bot])\n* 0f3699e3f33b68db69264d1e5da9145fcf598c99: feat(deps): bump github.com/charmbracelet/lipgloss from 0.13.0 to 0.13.1 (#111) (@dependabot[bot])\n* 1c5884bf8f546220e38da21b8ca2bd01d1ada4a9: feat(deps): bump github.com/charmbracelet/lipgloss from 0.13.1 to 1.0.0 (#112) (@dependabot[bot])\n* 4710ad08b23c83a96fb99379b0579578b555a2f3: feat(deps): bump github.com/dgraph-io/badger/v4 from 4.2.0 to 4.3.0 (#106) (@dependabot[bot])\n* 4b76b254210391d9c5ec216e7adfaabbb2db3d03: feat(deps): bump github.com/dgraph-io/badger/v4 from 4.3.0 to 4.3.1 (#109) (@dependabot[bot])\n* c3d7af17054851b38a6e24e58e5e09ed7603812f: feat(deps): bump github.com/dgraph-io/badger/v4 from 4.3.1 to 4.4.0 (#114) (@dependabot[bot])\n* e8e0228b9ac055406c95b98005833d52df2d61f6: feat(deps): bump github.com/dgraph-io/badger/v4 from 4.4.0 to 4.5.0 (#115) (@dependabot[bot])\n* c67243a73ec26bdda05a3e9eb39e11f3c93fd862: feat(deps): bump github.com/dgraph-io/badger/v4 from 4.5.0 to 4.5.1 (#121) (@dependabot[bot])\n* 1ccdba9d390a0be21d6814496648d8d1555ad83e: feat(deps): bump golang.org/x/term from 0.23.0 to 0.24.0 (#107) (@dependabot[bot])\n* d07603eebf7456d49f117b5484fcd90132aa17b8: feat(deps): bump golang.org/x/term from 0.24.0 to 0.25.0 (#110) (@dependabot[bot])\n* 267b22237f43f3eedb620c1ed5b618dacf199873: feat(deps): bump golang.org/x/term from 0.25.0 to 0.26.0 (#113) (@dependabot[bot])\n* f13cfdd66d8ef652bac11ee8ea1a4bfa37f139ed: feat(deps): bump golang.org/x/term from 0.26.0 to 0.27.0 (#117) (@dependabot[bot])\n* d053602575b259ceb1a0781d2eeb2d75b1a7beef: feat(deps): bump golang.org/x/term from 0.27.0 to 0.28.0 (#118) (@dependabot[bot])\n* 2d0eaaa64f6b87be41fffd696f2f7b38640c7d22: feat(deps): bump golang.org/x/term from 0.28.0 to 0.29.0 (#126) (@dependabot[bot])\n### Documentation updates\n* 90a2185b9ee94967d8a0187e90280de827bbe6f4: docs(readme): add charm cloud sunset notice (@meowgorithm)\n### Other work\n* b3fbfac69db75473ac128ec5b06b58c1c4bf1be5: ci: sync dependabot config (#127) (@charmcli)\n* 463dc66a50f1d276c6d7ff88ce6edb8217855b9f: ci: sync dependabot config (#128) (@charmcli)\n* 602c2fab6065d15316d662b80dd541bd15a5c696: typo: update README.md (#122) (@davidsneighbour)\n\n---\n\n<details>\n<summary>Verifying the artifacts</summary>\n\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/skate/releases/download/1.0.1/checksums.txt), for example, with `wget`:\n\n```bash\nwget 'https://github.com/charmbracelet/skate/releases/download/v1.0.1/checksums.txt'\n```\n\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\n\n```bash\ncosign verify-blob \\\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\n  --cert 'https://github.com/charmbracelet/skate/releases/download/v1.0.1/checksums.txt.pem' \\\n  --signature 'https://github.com/charmbracelet/skate/releases/download/v1.0.1/checksums.txt.sig' \\\n  ./checksums.txt\n```\n\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\n\n```bash\nsha256sum --ignore-missing -c checksums.txt\n```\n\nDone! You artifacts are now verified!\n\n</details>\n\n<a href=\"https://charm.sh/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-badge.jpg\" width=\"400\"></a>\n\nThoughts? Questions? We love hearing from you. Feel free to reach out on [Twitter](https://twitter.com/charmcli), [The Fediverse](https://mastodon.technology/@charm), or on [Discord](https://charm.sh/chat).\n\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":6}
