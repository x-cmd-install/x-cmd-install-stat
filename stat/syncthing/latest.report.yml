952b85a5f530320175105bab072","download_count":270,"created_at":"2026-10-06T06:08:24Z","updated_at":"2026-10-06T06:08:25Z"},{"id":614663079,"node_id":"RA_kwDOAOCAEs4kowOn","name":"syncthing_2.1.6_amd64.deb","label":"","uploader":{"login":"st-release","id":14043830,"node_id":"MDQ6VXNlcjE0MDQzODMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":11814934,"digest":"sha256:1c2412c50df54b61bd18d61a947943122a92169e9e73dcc54ad787f295935938","download_count":152,"created_at":"2026-10-06T06:08:25Z","updated_at":"2026-10-06T06:08:25Z"},{"id":614663083,"node_id":"RA_kwDOAOCAEs4kowOr","name":"syncthing_2.1.6_arm64.deb","label":"","uploader":{"login":"st-release","id":14043830,"node_id":"MDQ6VXNlcjE0MDQzODMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":10892992,"digest":"sha256:b1ebceb1f07b1fe41903def0c98d80e48fc3e243a6e3f3477fac5e76ff807b0a","download_count":87,"created_at":"2026-10-06T06:08:25Z","updated_at":"2026-10-06T06:08:26Z"},{"id":614663092,"node_id":"RA_kwDOAOCAEs4kowO0","name":"syncthing_2.1.6_armel.deb","label":"","uploader":{"login":"st-release","id":14043830,"node_id":"MDQ6VXNlcjE0MDQzODMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":11293960,"digest":"sha256:7378081c88fe33b204dad60794fd4d98d0500cb33553efba6fb519ce95e8ab35","download_count":52,"created_at":"2026-10-06T06:08:25Z","updated_at":"2026-10-06T06:08:26Z"},{"id":614663098,"node_id":"RA_kwDOAOCAEs4kowO6","name":"syncthing_2.1.6_armhf.deb","label":"","uploader":{"login":"st-release","id":14043830,"node_id":"MDQ6VXNlcjE0MDQzODMw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":11293802,"digest":"sha256:51ffa5360a0093bd3e4038909519b540def692802dd78f1e1dae1aeddc0ea50c","download_count":56,"created_at":"2026-10-06T06:08:25Z","updated_at":"2026-10-06T06:08:26Z"}],"body":"## Major changes in 2.1\r\n\r\n- Devices and folders can now be grouped in the GUI by setting the new\r\n  `group` attribute.\r\n\r\n- HTTP and HTTPS proxies with support for CONNECT can now be used, in\r\n  addition to the existing support for SOCKS proxies (the environment\r\n  variable `all_proxy=https://...`).\r\n\r\n- Block indexing can be turned off for folders where it's more desirable to\r\n  optimise for reduced database size and overhead than minimal transfer\r\n  size (the `blockIndexing` attribute on folder configuration).\r\n\r\n- GUI login session duration can be configured to be longer or shorter than\r\n  the default one week, or set to infinitely long. The cookie path can also\r\n  be adjusted. (The `sessionCookieDurationS` and `sessionCookiePath`\r\n  attributes in the GUI configuration.)\r\n\r\nThis release is also available as:\r\n\r\n* APT repository: https://apt.syncthing.net/\r\n\r\n* Docker image: `docker.io/syncthing/syncthing:2.1.6` or `ghcr.io/syncthing/syncthing:2.1.6`\r\n  (`{docker,ghcr}.io/syncthing/syncthing:2` to follow just the major version)\r\n\r\n## What's Changed\r\n### Fixes\r\n* fix(model): introducers should not be able to add themselves to folders by @calmh in https://github.com/syncthing/syncthing/pull/10880\r\n* fix(gui): add accessible labels to buttons in Edit Device modal (fixes #10873) by @tomasz1986 in https://github.com/syncthing/syncthing/pull/10874\r\n* fix(model): properly error out when a temp file can't be created by @calmh in https://github.com/syncthing/syncthing/pull/10883\r\n* fix: disable keepalive on most outgoing HTTP connections by @calmh in https://github.com/syncthing/syncthing/pull/10891\r\n* fix(monitor): continue log writes when stdout is unavailable on detached Windows consoles (fixes #10882) by @Shablone in https://github.com/syncthing/syncthing/pull/10889\r\n* fix(gui): improve header and button color contrast (fixes #10488) by @giri256 in https://github.com/syncthing/syncthing/pull/10815\r\n* fix: use global short lived HTTP client with proper HTTP/2 support by @calmh in https://github.com/syncthing/syncthing/pull/10901\r\n* fix: remove unnecessary delay in index transmission by @calmh in https://github.com/syncthing/syncthing/pull/10908\r\n* fix(watchaggregator): properly convert floating-point time duration (fixes #10899) by @calmh in https://github.com/syncthing/syncthing/pull/10900\r\n\r\n## New Contributors\r\n* @giri256 made their first contribution in https://github.com/syncthing/syncthing/pull/10815\r\n\r\n**Full Changelog**: https://github.com/syncthing/syncthing/compare/v2.1.5...v2.1.6","reactions":{"total_count":41,"+1":22,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":7,"rocket":8,"eyes":0},"mentions_count":4}
