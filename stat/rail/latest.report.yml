12T01:17:11Z"},{"id":737563024,"node_id":"RA_kwDOVEdbEs4r9lGQ","name":"rail-v0.10.3-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":12919093,"digest":"sha256:766fd315cf685074b9ea2edd232d4fc27b0bce250b7242365c9c3ae10d798874","download_count":8,"created_at":"2026-11-12T01:17:10Z","updated_at":"2026-11-12T01:17:11Z"},{"id":737563029,"node_id":"RA_kwDOVEdbEs4r9lGV","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":436,"digest":"sha256:4cfea1ee2fd2f2284d9ce3cf6113df004c07dc1dbbf3bcb2d999137e7a0b37be","download_count":4,"created_at":"2026-11-12T01:17:10Z","updated_at":"2026-11-12T01:17:11Z"}],"body":"\nTrusting your own company's domain now works on Microsoft 365 (#190).\n\n### Fixed\n\n- **Trusting your own company's domain now works on Microsoft 365.** Mail a colleague sends\n  inside the organisation carries `dkim=none dmarc=none`, because Exchange signs with DKIM only\n  on the way out, so `I` showed the domain as `(not verified for this mail)` and a trusted\n  colleague's pictures never loaded on their own. Rail now also accepts Exchange's stamp that\n  the sender signed in to the organisation (`X-MS-Exchange-Organization-AuthAs` and\n  `X-MS-Exchange-CrossTenant-AuthAs` both `Internal`, each once), for the account's own domain\n  only. Exchange strips those headers from mail arriving from outside, so a spoof cannot carry\n  them.\n\n### Upgrading\n\n- Internal mail already stored keeps its old result until its body is fetched again, so `I` on\n  an older colleague's message may still say `(not verified for this mail)`. New mail is\n  checked as it arrives.\n\n### Downloads\n\n| Archive | For |\n|---|---|\n| `rail-v0.10.3-x86_64-unknown-linux-gnu.tar.gz` | Linux x86_64, glibc 2.36 or newer |\n| `rail-v0.10.3-aarch64-unknown-linux-gnu.tar.gz` | Linux ARM64, glibc 2.36 or newer |\n| `rail-v0.10.3-aarch64-apple-darwin.tar.gz` | macOS 11 or newer on Apple Silicon |\n| `rail-v0.10.3-x86_64-apple-darwin.tar.gz` | macOS 11 or newer on Intel |\n\nEach archive holds the `rail` binary, the README and `docs/`, the changelog, the licences and\n`BUILD-INFO.txt`. Extract it and put `rail` in a directory on your `PATH`.\n\nCheck an archive against `SHA256SUMS`, and check where it was built:\n\n```sh\nsha256sum -c --ignore-missing SHA256SUMS   # macOS: shasum -a 256 -c --ignore-missing SHA256SUMS\ngh attestation verify rail-v0.10.3-<target>.tar.gz --repo vitosans/rail\n```\n\nOn other systems, build from the tag with Rust 1.88 or newer:\n\n```sh\ngit clone --branch v0.10.3 --depth 1 https://github.com/vitosans/rail.git\ncd rail\ncargo install --locked --path crates/rail\n```\n"}
