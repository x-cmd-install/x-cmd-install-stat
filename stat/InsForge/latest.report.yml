r self-host backups by @Harsh-Daga in https://github.com/InsForge/InsForge/pull/1913\n* fix(dashboard): stop the capacity fallback stacking its oldest bars by @ayaangazali in https://github.com/InsForge/InsForge/pull/1917\n* docs(openapi): document 404 for function invoke methods by @Gautam-aman in https://github.com/InsForge/InsForge/pull/1922\n* ci: validate changed OpenAPI specs in lint-and-format by @ayaangazali in https://github.com/InsForge/InsForge/pull/1847\n* feat(ai): show why the Model Gateway is unavailable, and hide it for partner orgs by @Fermionic-Lyu in https://github.com/InsForge/InsForge/pull/1933\n* feat(compute): Docker compute driver for self-hosted InsForge by @Fermionic-Lyu in https://github.com/InsForge/InsForge/pull/1930\n* Bump version to 2.3.1 by @agent-zhang-beihai[bot] in https://github.com/InsForge/InsForge/pull/1934\n\n## New Contributors\n* @ssrajadh made their first contribution in https://github.com/InsForge/InsForge/pull/1889\n* @Harsh-Daga made their first contribution in https://github.com/InsForge/InsForge/pull/1910\n\n**Full Changelog**: https://github.com/InsForge/InsForge/compare/v2.3.0...v2.3.1","mentions_count":6}
