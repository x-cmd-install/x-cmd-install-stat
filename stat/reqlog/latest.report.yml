Z","updated_at":"2026-10-24T14:37:36Z"},{"id":672493642,"node_id":"RA_kwDORs-mB84oFXBK","name":"reqlog_0.11.0_linux_arm64.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":2252042,"digest":"sha256:6af79987ffdfa7e1290fddb59ca6fa76645a2368e012d02682e5155c02211acc","download_count":0,"created_at":"2026-10-24T14:37:35Z","updated_at":"2026-10-24T14:37:36Z"},{"id":672493608,"node_id":"RA_kwDORs-mB84oFXAo","name":"reqlog_0.11.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2198405,"digest":"sha256:aa81b35425a25f0dfcccd3de246ddc5508b5ca94c9e11f500cf69204598e74ee","download_count":3,"created_at":"2026-10-24T14:37:34Z","updated_at":"2026-10-24T14:37:34Z"},{"id":672493602,"node_id":"RA_kwDORs-mB84oFXAi","name":"reqlog_0.11.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":2473066,"digest":"sha256:affd0119a3a4d6f2ccc60e653920b71a579ab18c2d5706d856344c301ba66ecc","download_count":1,"created_at":"2026-10-24T14:37:34Z","updated_at":"2026-10-24T14:37:34Z"},{"id":672493614,"node_id":"RA_kwDORs-mB84oFXAu","name":"reqlog_0.11.0_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":2234308,"digest":"sha256:f6ea6177ae0b87f784871a0e5c91c38b7acf15e3a1599e34be588a1c05dd3912","download_count":1,"created_at":"2026-10-24T14:37:34Z","updated_at":"2026-10-24T14:37:35Z"}],"body":"This release lets you stream all live logs without a search value, adds a one-line install script for macOS and Linux, and fixes several issues with diagnostics and concurrent output.\r\n\r\n## Stream All Live Logs\r\n\r\n`--follow` (`-f`) no longer requires a search value. Without one, reqlog skips existing logs and streams every new line as it is written:\r\n\r\n```bash\r\nreqlog -f\r\nreqlog -f -S docker\r\nreqlog -f -H srv1,srv2\r\n```\r\n\r\n- Works with local files, Docker containers, and remote hosts over SSH.\r\n- Source and filtering flags such as `-d`, `-r`, `-s`, `-S`, and `-H` work as usual.\r\n- Lines that can't be parsed are skipped.\r\n- Log files whose size can't be read at startup are skipped and reported with `-V` / `--verbose`.\r\n- `reqlog -f <search_value>` behaves exactly as before.\r\n\r\n## Quick Install (macOS/Linux)\r\n\r\nreqlog can now be installed with a single command:\r\n\r\n```bash\r\ncurl -sSL https://raw.githubusercontent.com/sagarmaheshwary/reqlog/master/install.sh | bash\r\n```\r\n\r\nInstall a specific version:\r\n\r\n```bash\r\ncurl -sSL https://raw.githubusercontent.com/sagarmaheshwary/reqlog/master/install.sh | bash -s v0.11.0\r\n```\r\n\r\nThe install script now:\r\n\r\n- Supports the new release asset naming (`reqlog_<version>_<os>_<arch>.tar.gz`) used since v0.10.0, while still installing older versions.\r\n- Extracts into a temporary directory instead of the current directory.\r\n- Accepts versions with or without the `v` prefix.\r\n\r\n## Bug Fixes\r\n\r\n- Fixed `-V` / `--verbose` printing nothing when every host passed to `-H` failed to connect. Each host's connection error is now printed before reqlog exits.\r\n- Fixed a data race where diagnostics recorded from multiple hosts at the same time could be lost.\r\n- Fixed a data race in Docker follow mode when writing output from multiple containers.\r\n- Aligned the service column in pretty output when streaming without a search value.\r\n\r\n## Documentation\r\n\r\n- Documented streaming without a search value in the README and usage guide.\r\n- Added the quick install script to the README.\r\n\r\n\r\n## Changelog\r\n* d8c13bac6f8da8e08718229cdb9180823ec9f4b3 Merge pull request #76 from SagarMaheshwary/feat/follow-without-search\r\n* 8580ebf534761b4dbb23451940359dc3c6916769 docs: document live-only follow mode and quick install script\r\n* 2766aaf26f5815715e5ceb90a20750a3bd207aea Merge pull request #75 from SagarMaheshwary/feat/follow-without-search\r\n* c3cd2688c06bb6eb00d92486ebffa7bbc8f46a87 Merge pull request #74 from SagarMaheshwary/feat/follow-without-search\r\n* dbd3d1eb606ed5753e5c9879e208ec4f7b74e046 fix: support GoReleaser asset names in install.sh\r\n* a87ffe6bf25d59301a82f2f1d52f817a25004e0b fix: print diagnostics with --verbose when all hosts fail to connect\r\n* 225a58e2c3b2c2cb0774b8b514386615eb774c8e chore: ignore local coverage and demo files.\r\n* 5903170f9daf7636fb1ce812811024e0fc3fd523 feat: stream all live logs when --follow is used without a search value\r\n* 20eb5a45bae228fa4b8f9c195fda60bace9ecc25 Merge pull request #73 from SagarMaheshwary/docs/v0.10.0\r\n* bd433a8ed6f3a59d188265705656d9fdf52e6d75 docs: simplified installation section in readme\r\n\r\n"}
