reated_at":"2026-07-16T15:04:03Z","updated_at":"2026-07-16T15:04:03Z"}],"body":"This release focuses on making reqlog easier to install and distribute across platforms by introducing package manager support and a fully automated release pipeline.\r\n\r\n## New Installation Options\r\n\r\nreqlog can now be installed using native package managers on major platforms:\r\n\r\n### macOS\r\n\r\n```bash\r\nbrew install sagarmaheshwary/tap/reqlog\r\n```\r\n\r\n### Windows\r\n\r\n```powershell\r\nscoop bucket add sagarmaheshwary https://github.com/sagarmaheshwary/scoop-bucket\r\nscoop install reqlog\r\n```\r\n\r\n### Linux\r\n\r\nDebian/Ubuntu:\r\n\r\n```bash\r\nsudo apt install ./reqlog_<version>_linux_amd64.deb\r\n```\r\n\r\nFedora/RHEL/openSUSE:\r\n\r\n```bash\r\nsudo rpm -Uvh reqlog-<version>-1.x86_64.rpm\r\n```\r\n\r\nManual binary downloads remain available through GitHub Releases.\r\n\r\n## Distribution Improvements\r\n\r\n- Added Homebrew support for macOS users.\r\n- Added Scoop support for Windows users.\r\n- Added Debian (`.deb`) package generation.\r\n- Added RPM (`.rpm`) package generation.\r\n- Added release checksums for artifact verification.\r\n- Included `README.md` and `LICENSE` files in release archives and packages.\r\n- Added support for both `amd64` and `arm64` architectures across all distributions.\r\n\r\n## Release Infrastructure\r\n\r\n- Migrated the release pipeline to GoReleaser.\r\n- Automated Homebrew formula updates.\r\n- Automated Scoop manifest updates.\r\n- Added support for prerelease tags such as `v0.10.0-rc1`.\r\n"}
