{"id":402172646,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCUkrlM4X-Krm","tag_name":"4.5.0","target_commitish":"main","name":"[4.5.0] - 2026-10-30","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-30T20:13:28Z","updated_at":"2026-10-30T20:28:09Z","published_at":"2026-10-30T20:28:09Z","assets":[],"body":"## Highlights\r\n\r\nThis minor release focuses on performance, clearer diagnostics and new layout options, alongside a large wave of Databricks and SparkSQL support and a broad set of dialect improvements and bug fixes.\r\n\r\n* **Linting is faster across the board.** A series of performance changes removes quadratic work in the layout rules and `LT09`, reuses whole-file reflow sequences across rules, and skips parse subtrees that can't match. It also cuts fixed costs every linted file pays and sends less data to and from worker processes. The Rust engine also gets lower allocation overhead and a per-process regex cache.\r\n* **Parse errors are easier to act on.** Unparsable-section messages now name the unexpected token and show the grammar the parser expected. Diagnostics on templated code now carry full source positions.\r\n* **New layout and convention options.**\r\n  * `LT05` gains a `list_wrapping = fill` option that puts as many list elements on each line as fit, rather than one per line.\r\n  * The new `indented_using_on_newline` option indents `ON`/`USING` below a join target on its own line.\r\n  * `CV03` adds a `require_multiline_forbid_single_line` trailing-comma policy.\r\n  * `fixed_suffix` can now be set in config, not just on the CLI.\r\n* **Databricks and SparkSQL support grows a lot**, including:\r\n  * SQL scripting and stored procedures\r\n  * Unity Catalog `SHOW`/`DESCRIBE`, privileges and tags\r\n  * `GEOGRAPHY`/`GEOMETRY` types\r\n  * `EXECUTE IMMEDIATE` and named parameter markers\r\n  * SQL-bodied `CREATE FUNCTION`\r\n  * a Databricks parameter style for the placeholder templater\r\n* **The Jinja templater supports more dbt behaviour.** It adds dbt materialization blocks and the `fromjson`/`tojson` helpers, and fixes `return` handling in nested macros defined in the same file.\r\n\r\nBeyond that, this release expands parsing support across DuckDB, Snowflake, T-SQL, MySQL/MariaDB, PostgreSQL, ClickHouse, SQLite, Trino, Oracle, Redshift, BigQuery, Flink, Db2, StarRocks, Doris and other dialects. Rule fixes stop several autofixes from changing query meaning: `ST02`, `ST06`, `ST08`, `ST09` and `CV06` now preserve precedence, parentheses, operators and statement boundaries. Other fixes reduce false positives in `AL05`, `AM01`, `AM07`, `RF01`, `RF03` and `LT09`. SQLFluff also now supports Click 8.5.\r\n\r\nThis release also includes first-time contributions from **fifty-five** new contributors. Thank you all for your contributions. 🏆\r\n\r\n## What’s Changed\r\n\r\n* Trino: parse CREATE/DROP MATERIALIZED VIEW (#8940) @adhavan18\r\n* Fix LT02 blank-line growth after empty inline templates (#8944) @zhangxinyao88\r\n* SparkSQL: Support multi-column TABLE() arguments (#8761) @WittierDinosaur, @claude\r\n* T-SQL: Parse $PARTITION.<function>() calls (#8917) @pujitha24\r\n* Snowflake: Support aggregation and projection policies (#8936) @sai-sakalam\r\n* Postgres: support GROUP BY DISTINCT / ALL (#8925) @YashG1836\r\n* Fix pre-commit end-of-file-fixer failure on main (vertica fixture) (#8929) @YashG1836\r\n* Include source positions for templated diagnostics (#8697) @dheeraj-juvvadi, @claude\r\n* linter: surface the expected grammar in unparsable messages (#8558) @taslater, @claude\r\n* fix(RF03): only skip templated refs for the placeholder templater (#8561) @udsy19\r\n* Preserve expression precedence when ST02 negates a CASE (#8867) @Jackmeson1, @claude\r\n* ClickHouse: Support multiple comma-separated actions in ALTER TABLE  (#8914) @manjirisharma\r\n* fix(vertica): support integer literals and DEFAULT in ALTER TABLE SET MERGEOUT (#8894) @pranaysb\r\n* MySQL: support DESCRIBE, DESC and full EXPLAIN syntax (#8923) @YashG1836\r\n* fix(doris): remove unsupported FlushStatementSegment from StatementSegment (#8901) @Pyhroff\r\n* fix(starrocks): remove unsupported FlushStatementSegment from StatementSegment (#8902) @Pyhroff\r\n* Fix pre-commit end-of-file-fixer failure on main (#8927) @keraion\r\n* fix(doris): use CommaSegment for fixed range partition grammar (#8896) @pranaysb\r\n* Test rule-filter options in the diff-quality integration (#8898) @zhangxinyao88\r\n* fix(LT09): do not rejoin single select target when line length exceeds limit (#8624) (#8863) @askarshabdanov1-collab\r\n* SQLite: allow MATCH, VIRTUAL and LAST as identifiers (#8905) @kennywu411-dev\r\n* perf: skip subtrees that cannot match and trim redundant rule work (#8910) @joshmarkovic\r\n* fix(postgres): resolve COLUMN keyword ref in AlterForeignTableActionSegment (#8888) @pranaysb\r\n* Add show statement to MySQL (#8812) @bigbuger\r\n* fix(mysql, mariadb): resolve TableReference typo and optional validation in ALTER TABLE EXCHANGE PARTITION (#8878) @askarshabdanov1-collab\r\n* fix(db2): register INVALID keyword for XML index definitions (#8892) @pranaysb\r\n* fix(redshift): replace postgres-only statements with Redshift grammar (#8856) @Duo-ee, adenyoung\r\n* fix(trino): support CREATE FUNCTION with RETURN and register missing keywords (#8881) @askarshabdanov1-collab\r\n* fix(flink): add missing BUCKETS and BUCKET unreserved keywords (#8879) @askarshabdanov1-collab\r\n* T-SQL: Fix RuntimeError from keywords missing in the dialect (#8872) @555aaditya\r\n* Databricks: support Unity Catalog SHOW, DESCRIBE, privileges and tags (#8862) @taslater, @claude\r\n* fix(databricks): register NOVALIDATE keyword and support constraint option (#8890) @pranaysb\r\n* feat(db2): support all COMMENT ON object types (#8908) @bekoenig\r\n* feat(flink): support common Flink 1.20 SQL constructs (#8912) @kalanyuz\r\n* RF02: list ignore_words and ignore_words_regex in config_keywords (#8907) @rawsun007\r\n* Clarify CV06 diagnostics for misplaced semicolons (#8911) @sugarzzzcccsss\r\n* perf(core): cut three fixed costs that every linted file pays (#8909) @joshmarkovic\r\n* AM01: Don't flag DISTINCT ON used with GROUP BY (#8919) @555aaditya\r\n* Add indented_using_on_newline to indent ON/USING below a join target on its own line (#8864) @pjpscriv, [@cubic-dev-ai[bot]](https://github.com/apps/cubic-dev-ai)\r\n* Snowflake: Support data metric functions on tables and views (#8885) @sai-sakalam\r\n* SQLite: stop parsing bare functions and literals as column references (#8903) @kennywu411-dev\r\n* Bracketed: drop the redundant trailing gap match (#8848) @WittierDinosaur, @claude, Danny Jones\r\n* fix(sqlite): add PARTIAL and SIMPLE unreserved keywords for foreign key MATCH clause (#8880) @askarshabdanov1-collab\r\n* T-SQL: Accept signed values and bare CACHE in CREATE SEQUENCE (#8875) @555aaditya\r\n* SparkSQL: Support named parameter markers (#8765) @WittierDinosaur, @claude\r\n* perf(reflow): find alignment siblings in a single walk (#8869) @Duo-ee, adenyoung\r\n* T-SQL: Support ENABLE TRIGGER statement (#8865) @555aaditya\r\n* fix(redshift): parse SHOW statements (#8857) @Duo-ee, adenyoung\r\n* fix(trino): parse TRUNCATE TABLE statements (#8858) @Duo-ee, adenyoung\r\n* Add dbt JSON conversion helpers to the Jinja templater (#8853) @hector2394\r\n* fix(clickhouse): preserve case-sensitive function names (#8852) @hector2394\r\n* Databricks: support SQL scripting and stored procedures (#8847) @taslater, @claude\r\n* SparkSQL/Databricks: accept keywords used as identifiers, JSON path wildcards and bracketed set operands (#8846) @taslater, @claude\r\n* Databricks: support GEOGRAPHY and GEOMETRY types (#8851) @taslater, @claude\r\n* fix(bigquery): parse date parts by argument position (#8703) @normaltank\r\n* fix: support Click 8.5.0 (#8648) @Sam