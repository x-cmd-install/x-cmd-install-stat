{"id":366997167,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCUkrlM4V3-6v","tag_name":"4.4.0","target_commitish":"main","name":"[4.4.0] - 2026-10-02","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-02T18:51:59Z","updated_at":"2026-10-02T18:54:08Z","published_at":"2026-10-02T18:54:08Z","assets":[],"body":"## Highlights\r\n\r\nThis minor release introduces SQLMesh integration, new linting and formatting options, and a refreshed documentation site, alongside a broad set of dialect improvements and bug fixes.\r\n\r\n* **SQLMesh projects can now use SQLFluff through the new `sqlfluff-templater-sqlmesh` plugin.** The optional templater brings SQLFluff linting to SQLMesh models, with support for model definitions and macro rendering.\r\n* **Two recent rules offer additional opt-in conventions.** `CV13` encourages a pure `SELECT * FROM <cte>` passthrough as the final query in a CTE-based model, following the dbt convention. `TQ04` prefers `expression AS alias` over T-SQL's `alias = expression` syntax. Both are currently disabled by default and can be enabled with `force_enable = True`.\r\n* **The CLI gains GitLab Code Quality output** through `--format gitlab`, allowing findings to appear directly in GitLab merge requests. This joins the existing SARIF and GitHub annotation formats for integrating SQLFluff into CI.\r\n* **The Jinja templater now supports custom delimiters**, including the `<% ... %>` syntax used by Snowflake CLI. `LT15` also gains an optional minimum number of blank lines between statements.\r\n* **[docs.sqlfluff.com](https://docs.sqlfluff.com) has migrated to a new documentation format.** The site is more responsive, easier to search, and supports dark mode, with a design that fits the rest of the SQLFluff project.\r\n\r\nBeyond that, this release expands parsing support across Snowflake, MariaDB/MySQL, ClickHouse, PostgreSQL, Oracle, Databricks, Flink, Athena, SQLite, Trino, and other dialects. Rule and templater fixes improve reliability, reduce false positives, and prevent unsafe autofixes.\r\n\r\nThis release also includes first-time contributions from **forty-three** new contributors. Thank you all for your contributions. \ud83c\udfc6\r\n\r\n## What\u2019s Changed\r\n\r\n* Make stable the default docs landing version (#8631) @alanmcruickshank\r\n* build(deps): bump github/issue-labeler from 3.4 to 3.5 in the github-actions group (#8618) [@dependabot[bot]](https://github.com/apps/dependabot)\r\n* fix(AM02): preserve UNION's existing case instead of forcing a hardcoded one (#8534) @udsy19\r\n* Redshift: parse array accessors in SUPER paths in the FROM clause (#8526) @adhavan18\r\n* Prepare docs URL parity and production indexing (#8629) @alanmcruickshank\r\n* ci: fix mypy type annotation for \"subclass\" (#8621) @keraion\r\n* docs: refine historical versions index (#8609) @alanmcruickshank\r\n* Databricks: support Unity Catalog volume privileges in GRANT and REVOKE (#8512) @taslater, @claude\r\n* fix(mysql): parse DO statements (#8582) @rfanth, @claude\r\n* Oracle: allow DELETE without the optional FROM keyword (#8576) @MrDKOz, [@cubic-dev-ai[bot]](https://github.com/apps/cubic-dev-ai)\r\n* StarRocks: support PARTITION BY LIST (#8555) (#8595) @mishra-prince\r\n* feat(clickhouse): add support for projections (#8585) @AndrewKurg\r\n* Hive/Impala: support the NULL-safe equals operator `<=>` (#8575) @remilepriol, @claude\r\n* fix(RF01): allow Trino ROW access for single table targets (#8475) @dennisimoo\r\n* Trino: support SHOW, DESCRIBE and EXPLAIN ANALYZE statements (#8540) @adhavan18\r\n* Snowflake: Support ROW_TIMESTAMP_DEFAULT and trailing commas in table column definitions (#8472) @itzzdev09\r\n* Postgres: support SET ACCESS METHOD on tables and materialized views (#8436) @Mynk11\r\n* Apply an inner .sqlfluffignore below its own directory on a relative path (#8429) @devYRPauli\r\n* Snowflake: ALTER USER policy attachment (AUTHENTICATION/PASSWORD/SESSION POLICY) and WORKLOAD_IDENTITY (#8367) @cotsupa, @claude\r\n* Snowflake: inherited grants (GRANT/REVOKE INHERITED), CREATE SEMANTIC VIEW and CREATE DATABASE ROLE privileges (#8366) @cotsupa, @claude\r\n* Trino: accept the DISTINCT qualifier on INTERSECT and EXCEPT (#8532) @maksimtech, Claude Opus 5\r\n* fix(cli): respect output_line_length in the rules listing (#8529) @ddy314\r\n* ClickHouse: accept the DISTINCT qualifier on INTERSECT and EXCEPT (#8533) @maksimtech, Claude Opus 5\r\n* Placeholder: ignore embedded colons in colon_optional_quotes (#8566) @devYRPauli, @claude\r\n* ST04: keep the space before the outer END when flattening (#8568) @devYRPauli, @claude\r\n* fix(snowflake): stop scripting IF terminators leaking into CASE expressions (#8468) @michal-swiatowy, @claude\r\n* Oracle: parse the SQL*Plus SHOW command (#8484) @itzzdev09, @claude\r\n* feat(clickhouse): add support for underscores in numeric literals and for hex and binary numeric literals (#8537) @AndrewKurg\r\n* feat(clickhouse): add support for IS NOT DISTINCT FROM operator (<=>) (#8528) @AndrewKurg\r\n* Databricks: require SEQUENCE BY in a CREATE FLOW REPLACE USING spec (#8460) @devYRPauli, @claude\r\n* fix: raise a clear error instead of crashing on a non-table `rules` value in pyproject.toml (#8493) @udsy19\r\n* fix(mysql): support multiple variables and expression defaults in DEC\u2026 (#8538) @rfanth, @claude\r\n* fix(mysql): allow CALL without parentheses (#8539) @rfanth, @claude\r\n* docs(parser): drop the stale tf arg from RustParser.parse's docstring (#8530) @simpleqt\r\n* Databricks: support MANAGED LOCATION on CREATE CATALOG (#8511) @taslater, @claude\r\n* SparkSQL: allow DESCRIBE HISTORY and DESCRIBE DETAIL as relations (#8514) @taslater, @claude\r\n* Snowflake: add CREATE / ALTER SESSION POLICY statements (#8487) @cotsupa, @claude\r\n* Support ClickHouse materialized CTE (#8497) @dolik-rce\r\n* fix(snowflake): parse key=>value USING params in EXECUTE IMMEDIATE FROM (#8518) @udsy19\r\n* Oracle: support PERCENT in the FETCH clause (#8489) @itzzdev09, @claude\r\n* SparkSQL: accept DESC as an abbreviation for DESCRIBE HISTORY and DETAIL (#8510) @taslater, @claude\r\n* Postgres: support COPY options added in PostgreSQL 15-18 (#8488) @itzzdev09, @claude\r\n* Snowflake: support EXECUTE DBT PROJECT statement (#8504) @davis0178\r\n* Databricks: allow a magic cell body after a single-line magic directive (#8507) @taslater\r\n* fix(doris): parse aggregate-type column definitions with DEFAULT/COMMENT/NOT NULL (#8500) @udsy19\r\n* Databricks: allow a materialized view to declare only expectations (#8508) @taslater, @claude\r\n* Snowflake: support empty DEFAULT_SECONDARY_ROLES list and ALTER USER SET DEFAULT_SECONDARY_ROLES (#8486) @cotsupa, @claude\r\n* fix(snowflake): allow arbitrary expressions in EXECUTE IMMEDIATE (#8470) @michal-swiatowy, @claude\r\n* fix(snowflake): allow CREATE STREAM APPEND_ONLY/SHOW_INITIAL_ROWS in either order (#8469) @michal-swiatowy, @claude\r\n* Databricks: support PRIVATE streaming tables and CREATE FLOW append flows (#8509) @taslater, @claude\r\n* fix(config): preserve nested TOML templater context arrays (#8477) @dennisimoo\r\n* fix(diff-quality): skip linting when no eligible files remain (#8476) @dennisimoo\r\n* fix: preserve conversions in dotted Python template variables (#8464) @Yukibei\r\n* Parse redundant brackets around a join used as a join target (#8393) @chiruu12\r\n* Snowflake: DCM DEFINE gaps (DEFINE PIPE, DEFINE FILE FORMAT, external stages in DEFINE STAGE) (#8365) @cotsupa, @claude\r\n* fix(CV11): support MySQL-family CONVERT(expr, type) argument order (#8171) (#8449) @eminsk\r\n* TSQL: support touching table alias column lists (#8451) @be-student\r\n* fix(ST06): don't reorder select targets when it would displace comments (#8296) @sjh9714\r\n* fix: map deprecated semicolon_newline onto CV06 multiline_newline (#