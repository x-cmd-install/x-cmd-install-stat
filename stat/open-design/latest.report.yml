cc88a273075927a2c7dc","download_count":56,"created_at":"2026-09-09T12:29:48Z","updated_at":"2026-09-09T12:30:05Z"},{"id":552720313,"node_id":"RA_kwDOSOgY8s4g8de5","name":"open-design-0.22.1-mac-x64.dmg.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:91f692d52fedce9b3ecf253779c6b4103abbeed481da9ba70831de321357fa73","download_count":14,"created_at":"2026-09-09T12:29:48Z","updated_at":"2026-09-09T12:29:48Z"},{"id":552720312,"node_id":"RA_kwDOSOgY8s4g8de4","name":"open-design-0.22.1-win-x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":438196572,"digest":"sha256:5e56d49c3839c35c2ab276fbeabbcb85d58952119d3e5b33d4fc877448759cfa","download_count":1085,"created_at":"2026-09-09T12:29:48Z","updated_at":"2026-09-09T12:30:04Z"},{"id":552720333,"node_id":"RA_kwDOSOgY8s4g8dfN","name":"open-design-0.22.1-win-x64-setup.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":104,"digest":"sha256:f97313e544c78c93b49848a3fcc4f1528537db9131a371bff38c1e3e291f1f6c","download_count":35,"created_at":"2026-09-09T12:29:48Z","updated_at":"2026-09-09T12:29:49Z"}],"body":"Open Design 0.22.1 builds on 0.22.0 with a simpler start for supported design tasks and clearer ways to recover when a run goes wrong.\n\n## \ud83d\udd01 Changed\n\n- \ud83e\udded **Start supported design tasks with OD Next.** Prototypes, slide decks, marketing designs, and Hyperframes videos use OD Next by default on supported agents. Settings \u2192 Labs \u2192 Design Harness still lets you turn it off, and an existing choice to disable it stays respected. (#7876)\n- \ud83e\uddf0 **Keep design work focused.** OD Next uses more concise tool guidance, clearer completion instructions, and the active run's workspace when loading media skills. (#7804)\n\n> \ud83d\udce5 **Download Open Design 0.22.1**\n\n| Platform | Architecture | Installer |\n|---|---|---|\n| macOS | Apple Silicon (arm64) | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.22.1/open-design-0.22.1-mac-arm64.dmg) |\n| macOS | Intel (x64) | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.22.1/open-design-0.22.1-mac-x64.dmg) |\n| Windows | x64 | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.22.1/open-design-0.22.1-win-x64-setup.exe) |\n\n## \ud83d\udc1b Fixed\n\n### \ud83d\udcac Conversations & recovery\n\n- \ud83d\udedf **A failed run keeps a useful next step.** Failure cards survive returning to a conversation, retain timeout and retry information, and keep Retry available when the current chat cannot switch the run to Cloud. (#7871, #7884, #7897) Thanks @lefarcen.\n- \ud83d\udd11 **An invalid API key points you to the right fix.** Bring-your-own-key authentication errors have their own explanation and a shortcut to model settings. (#7893) Thanks @lefarcen.\n- \ud83d\uddfa\ufe0f **Get clearer explanations for run and preview problems.** Messages for unavailable models, unsupported capabilities, timeouts, missing preview files, and regional restrictions give more specific guidance. (#7887) Thanks @lefarcen.\n- \ud83d\udcdd **Keep your answers when sending fails.** If a clarification answer cannot start a run, it remains in the conversation with a Retry action that resends the same answer. Internal routing text stays hidden. (#7900) Thanks @lefarcen.\n- \ud83d\udcdc **Keep following a reply as it grows.** A browser scroll adjustment no longer silently switches off automatic following. Scrolling up yourself still lets you read earlier messages. (#7898) Thanks @lefarcen.\n\n### \ud83c\udfa8 Design & delivery\n\n- \ud83c\udfac **Failed media work no longer looks complete.** When image, video, or audio generation fails before the turn finishes, the turn shows unfinished work instead of a completed checkmark. (#7933) Thanks @lefarcen.\n\n- \ud83d\udcac **A greeting gets a reply.** OD Next no longer invents a website for a greeting or a request that does not call for a design, and an explained blocked result avoids a duplicate failure card. (#7725)\n- \u2705 **Keep your web deliverable while syntax checks do their best.** Eligible HTML deliverables receive final syntax checks and safe automatic repairs without another agent turn. If a check is incomplete or a safe repair is unavailable, the original artifact remains available and delivery continues. (#7801, #7925) Thanks @lbjzz-hash.\n- \ud83e\udde9 **Continue the brief you just collected.** The official Codex plugin accepts the workflow identifier returned by brief collection when confirming that brief, while still rejecting mismatched identifiers. (#7779) Thanks @taljeon.\n\n### \ud83d\uddc2\ufe0f Workspace & settings\n\n- \ud83c\udfaf **Find your current model immediately.** Reopening the model picker brings your current model into view, including its company in the two-level OpenDesign model list. (#7917) Thanks @lefarcen.\n\n- \ud83d\udce3 **Announcement buttons describe where they lead.** What\u2019s New supports localized button labels that match the announcement\u2019s destination. (#7943)\n\n- \ud83d\udd17 **Reference projects from the workspace you are using.** Project references list the active workspace's projects and refresh when you switch workspaces. (#7701)\n- \ud83e\udd16 **See which model a local CLI actually used.** Connection tests show the resolved model behind a rolling alias, making the result easier to check. (#6386) Thanks @MumuTW.\n- \ud83c\uddeb\ud83c\uddf7 **More consistent French guidance.** Settings and recovery messages, along with core documentation, use updated French wording. (#7753, #7754) Thanks @davezfr.\n- \ud83c\udf0d **Social-link hints follow your language.** Navigation tooltips are localized and support right-to-left layouts. (#7665)\n\n### \ud83d\udda5\ufe0f Installation & Docker\n\n- \ud83d\uddbc\ufe0f **Browse bundled plugins with previews in Docker.** Plugin posters and hover clips are available again in Docker installations. (#7028) Thanks @jiulongche.\n- \ud83d\udcc1 **Respect existing contents when choosing a download location.** Directories and symbolic links with names resembling system clutter are no longer mistaken for ignorable system files when deciding whether a download folder can be adopted. (#7718) Thanks @mikemikimike.\n\n## \ud83d\ude4f Thanks to everyone who shipped 0.22.1\n\n@MumuTW \u00b7 @davezfr \u00b7 @jiulongche \u00b7 @lbjzz-hash \u00b7 @lefarcen \u00b7 @mikemikimike \u00b7 @taljeon\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":7}
