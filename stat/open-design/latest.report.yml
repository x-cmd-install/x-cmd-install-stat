5502766","download_count":289,"created_at":"2026-10-22T12:52:13Z","updated_at":"2026-10-22T12:52:33Z"},{"id":665874136,"node_id":"RA_kwDOSOgY8s4nsG7Y","name":"open-design-0.26.1-mac-x64.dmg.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:50089f572837fb4eafaa83ec890da13ee1a49e1576adcbbcb378eff862f9b23f","download_count":48,"created_at":"2026-10-22T12:52:13Z","updated_at":"2026-10-22T12:52:13Z"},{"id":665874138,"node_id":"RA_kwDOSOgY8s4nsG7a","name":"open-design-0.26.1-win-x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":443156985,"digest":"sha256:704a996e2a4f4a0a5a3dcac18d80e26ff163ce37cc9bda4e6004c0a8dc524f3c","download_count":6822,"created_at":"2026-10-22T12:52:13Z","updated_at":"2026-10-22T12:52:30Z"},{"id":665874162,"node_id":"RA_kwDOSOgY8s4nsG7y","name":"open-design-0.26.1-win-x64-setup.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":104,"digest":"sha256:4732fa653179b5fe1a092d18688a8b1be4a158d72c9e391604b44ba74d24f524","download_count":417,"created_at":"2026-10-22T12:52:14Z","updated_at":"2026-10-22T12:52:14Z"}],"body":"## English\n\nMeet Skill Discovery: describe what you want to create, and Open Design finds the relevant Skills to guide the work\u2014from your first idea to the next revision.\n\nYour idea should be the starting point. In 0.26.1, **Skill Discovery helps Open Design understand the kind of work you want to make and choose the Skills that fit.** You can focus on the result, with less manual setup before creating and more continuity as you refine it. Alongside this, smoother project starts, connected feedback, and steadier previews keep your work moving.\n\n## \ud83d\udce5 Download / \u4e0b\u8f7d\n\n| Platform / \u5e73\u53f0 | Installer / \u5b89\u88c5\u5305 |\n|---|---|\n| macOS Apple silicon | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-arm64.dmg) \u00b7 [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-arm64.dmg.sha256) |\n| macOS Intel | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-x64.dmg) \u00b7 [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-x64.dmg.sha256) |\n| Windows x64 | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-win-x64-setup.exe) \u00b7 [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-win-x64-setup.exe.sha256) |\n\n## \ud83e\udde0 Skill Discovery: the right Skills for what you have in mind\n\nDescribe the result you want. **Skill Discovery selects the deliverable type and reads its native Skill guidance**, giving Open Design a task-specific starting point. It supports eleven deliverable types, including interactive prototypes and motion work. (#8804)\n\n- **Start with your intent.** Your explicit request takes priority when it conflicts with a selected task type. Skills and templates you mention provide compatible guidance and references while keeping the requested deliverable in focus.\n- **Bring the right guidance into the work.** Open Design reads the relevant Skill instructions for the chosen type, so you spend less time finding and selecting them yourself.\n- **Keep the direction as you iterate.** Follow-up work carries the chosen Skill guidance forward, keeping revisions consistent. If you ask only for a plan or clarification, that request does not silently become permission to produce the final work.\n\n## \ud83d\udd25 Highlights\n\n- \ud83d\udd17 **Share the work, not a pile of screenshots.** Publish a design file as one public link, stop it when the review is over, and resume the same link later. Comments left on the shared page flow back to the file, with unread feedback waiting where you work. (#8408, #8859, #8867, #8904) Thanks @alchemistklk.\n- \ud83e\udd16 **Bring your own connection \u2014 and keep the Agent in the loop.** Open Design can use available registered runtimes, and the same BYOK connection works from the app or the `od` CLI. Your project preview stays isolated to its own work, even when two projects use the same browser storage. (#8702) Thanks @itscheems.\n- \ud83d\udeaa **Home now opens straight into the real project.** Send an idea from Home and the project is already there: one steady workspace, one Working state, and no disappearing first message while creation or uploads catch up. (#8267) Thanks @Siri-Ray.\n- \ud83c\udfac **Motion keeps its rhythm.** Video-motion previews stop jumping through music when the browser hiccups; while a video is still being made, you can watch the picture without unexpected sound, then hear the finished result normally. (#8777) Thanks to the Open Design crew.\n\n## \u2728 Added\n\n### \ud83c\udfa8 Studio, prototypes and media\n\n- **Use your organisation's image sources without a key hunt.** Open Design can use configured company stock sources while retaining source information and keeping credits out of the finished page unless you ask for them. (#8691)\n- **Chinese community help now leads to Feishu.** Simplified and Traditional Chinese entry points point to the official Feishu community, while other locales continue to use Discord. (#8884) Thanks @joeylee12629-star.\n\n### \ud83e\udde0 Agents, workspaces and CLI\n\n- **Your MCP tools follow the workspace you selected.** Switch workspaces, reconnect, and the bridge now sees the projects and artifacts you actually have open. (#7619) Thanks @roian6.\n\n## \u26a1 Performance\n\n- **Spend less time waiting for a Motion export.** Desktop video capture is faster while preserving the requested frame size, frame rate, and image quality. (#8798) Thanks @PerishCode.\n\n## \ud83d\udc1b Fixed\n\n### \ud83e\udde9 Home and projects\n\n- **Task choices and the More menu feel like Home again.** The task-type controls, cancellation behaviour, compact-window layout, and keyboard navigation are back where your draft can rely on them. (#8947)\n- **Artifact actions stay visible in chat.** Project conversations keep the familiar action styling for generated artifacts, and Home no longer surfaces the obsolete plugin hover card. (#8978, #8911) Thanks @alchemistklk.\n- **Finished work stays finished.** A brief history lookup failure no longer turns an existing delivered run into a failure when you reopen the project. (#8804)\n\n### \ud83c\udf9e\ufe0f Preview and sharing\n\n- **Keep commenting while the preview changes.** A saved artifact can refresh with a comment draft open; a missing target asks for reselection instead of throwing the draft away. (#8904) Thanks @alchemistklk.\n- **An existing shared file keeps its identity.** If local share bookkeeping is missing, Open Design recovers a verified cloud file and its original link rather than silently minting a replacement. (#8859, #8867) Thanks @alchemistklk.\n\n## \ud83d\ude4f Thanks to everyone who shipped 0.26.1\n\n@alchemistklk \u00b7 @itscheems \u00b7 @roian6 \u00b7 @Siri-Ray \u00b7 @PerishCode \u00b7 @joeylee12629-star\n\n---\n\n## \u4e2d\u6587\n\n\u5168\u65b0 Skill Discovery\uff0c\u4ece\u4f60\u7684\u521b\u4f5c\u610f\u56fe\u51fa\u53d1\uff0c\u53d1\u73b0\u5e76\u9009\u7528\u5408\u9002\u7684 Skill\u3002\u5c11\u4e00\u4e9b\u624b\u52a8\u914d\u7f6e\uff0c\u4ece\u7b2c\u4e00\u4e2a\u60f3\u6cd5\u5230\u4e0b\u4e00\u8f6e\u4fee\u6539\uff0c\u8ba9\u521b\u4f5c\u66f4\u8d34\u8fd1\u4f60\u60f3\u8981\u7684\u7ed3\u679c\u3002\n\n\u8bf4\u51fa\u4f60\u60f3\u505a\u4ec0\u4e48\uff0c\u8ba9 Open Design \u66f4\u61c2\u5f97\u5982\u4f55\u5f00\u59cb\u30020.26.1 \u5e26\u6765 **Skill Discovery\uff1a\u7406\u89e3\u4f60\u60f3\u521b\u4f5c\u7684\u4f5c\u54c1\u7c7b\u578b\uff0c\u9009\u62e9\u5bf9\u5e94 Skill\uff0c\u5e76\u5728\u540e\u7eed\u4fee\u6539\u4e2d\u5ef6\u7eed\u521b\u4f5c\u65b9\u5411\u3002**\u4ece\u5f00\u59cb\u521b\u4f5c\u524d\u7684\u80fd\u529b\u9009\u62e9\uff0c\u5230\u4f5c\u54c1\u751f\u6210\u540e\u7684\u7ee7\u7eed\u6253\u78e8\uff0c\u4f60\u53ef\u4ee5\u628a\u66f4\u591a\u6ce8\u610f\u529b\u7559\u7ed9\u60f3\u6cd5\u672c\u8eab\u3002\u66f4\u987a\u7545\u7684\u9879\u76ee\u542f\u52a8\u3001\u5206\u4eab\u53cd\u9988\u548c\u9884\u89c8\u4f53\u9a8c\uff0c\u4e5f\u8ba9\u6574\u4e2a\u521b\u4f5c\u8fc7\u7a0b\u66f4\u52a0\u8fde\u8d2f\u3002\n\n\ud83d\udce5 [\u4e0b\u8f7d\u6b63\u5f0f\u7248\u5b89\u88c5\u5305](https://github.com/nexu-io/open-design/releases/tag/open-design-v0.26.1#assets)\n\n## \ud83e\udde0 Skill Discovery\uff1a\u66f4\u61c2\u4f60\u7684\u60f3\u6cd5\uff0c\u4e5f\u66f4\u61c2\u8be5\u7528\u4ec0\u4e48\u80fd\u529b\n\n\u63cf\u8ff0\u4f60\u60f3\u8981\u7684\u7ed3\u679c\uff0c**Skill Discovery \u4f1a\u8bc6\u522b\u4f5c\u54c1\u7c7b\u578b\uff0c\u9009\u62e9\u5e76\u8bfb\u53d6\u5bf9\u5e94\u7684\u539f\u751f Skill \u6307\u5f15**\uff0c\u8ba9 Open Design \u5e26\u7740\u9002\u5408\u8fd9\u7c7b\u4efb\u52a1\u7684\u65b9\u6cd5\u5f00\u59cb\u521b\u4f5c\u3002\u76ee\u524d\u8986\u76d6 11 \u7c7b\u4ea4\u4ed8\u7269\uff0c\u5305\u62ec\u4ea4\u4e92\u539f\u578b\u3001\u52a8\u6548\u7b49\u521b\u4f5c\u573a\u666f\u3002 (#8804)\n\n- **\u4ece\u4f60\u7684\u610f\u56fe\u51fa\u53d1\u3002** \u5f53\u660e\u786e\u9700\u6c42\u4e0e\u624b\u52a8\u9009\u62e9\u7684\u4efb\u52a1\u7c7b\u578b\u4e0d\u4e00\u81f4\u65f6\uff0c\u4f18\u5148\u5c0a\u91cd\u4f60\u8bf4\u51fa\u7684\u9700\u6c42\uff1b\u4f60\u63d0\u5230\u7684 Skill \u548c\u6a21\u677f\u4f1a\u4f5c\u4e3a\u76f8\u5bb9\u7684\u6307\u5bfc\u4e0e\u53c2\u8003\uff0c\u8ba9\u521b\u4f5c\u56f4\u7ed5\u4f60\u771f\u6b63\u60f3\u8981\u7684\u4f5c\u54c1\u5c55\u5f00\u3002\n- **\u8ba9\u5408\u9002\u7684\u80fd\u529b\u53c2\u4e0e\u521b\u4f5c\u3002** \u6839\u636e\u4f5c\u54c1\u7c7b\u578b\u8bfb\u53d6\u5bf9\u5e94 Skill \u7684\u5177\u4f53\u6307\u5f15\uff0c\u51cf\u5c11\u4f60\u5728\u5f00\u59cb\u524d\u67e5\u627e\u3001\u9009\u62e9\u6280\u80fd\u7684\u64cd\u4f5c\u3002\n- **\u7ee7\u7eed\u4fee\u6539\uff0c\u5ef6\u7eed\u521b\u4f5c\u65b9\u5411\u3002** \u7ee7\u7eed\u4fee\u6539\u65f6\uff0c\u6cbf\u7528\u5df2\u9009 Skill \u7684\u521b\u4f5c\u6307\u5bfc\uff0c\u4fdd\u6301\u524d\u540e\u8fde\u8d2f\u3002\u4f60\u53ea\u60f3\u8ba8\u8bba\u65b9\u6848\u6216\u6f84\u6e05\u9700\u6c42\u65f6\uff0c\u4e5f\u4f1a\u5c0a\u91cd\u8fd9\u4e2a\u9636\u6bb5\u7684\u610f\u56fe\uff0c\u4e0d\u64c5\u81ea\u5f00\u59cb\u5236\u4f5c\u3002\n\n## \ud83d\udd25 \u91cd\u70b9\u66f4\u65b0\n\n- \ud83d\udd17 **\u5206\u4eab\u4f5c\u54c1\uff0c\u800c\u4e0d\u662f\u4e00\u5806\u622a\u56fe\u3002** \u628a\u8bbe\u8ba1\u6587\u4ef6\u53d1\u5e03\u4e3a\u4e00\u4e2a\u516c\u5f00\u94fe\u63a5\uff1b\u8bc4\u5ba1\u7ed3\u675f\u65f6\u505c\u6b62\u5206\u4eab\uff0c\u9700\u8981\u7ee7\u7eed\u65f6\u4ecd\u6cbf\u7528\u540c\u4e00\u4e2a\u94fe\u63a5\u3002\u516c\u5f00\u9875\u9762\u4e0a\u7684\u8bc4\u8bba\u4f1a\u540c\u6b65\u56de\u6587\u4ef6\uff0c\u672a\u8bfb\u53cd\u9988\u5c31\u5728\u4f60\u5de5\u4f5c\u7684\u5730\u65b9\u7b49\u4f60\u5904\u7406\u3002 (#8408\u3001#8859\u3001#8867\u3001#8904) \u611f\u8c22 @alchemistklk\u3002\n- \ud83e\udd16 **\u5e26\u4e0a\u81ea\u5df1\u7684\u8fde\u63a5\uff0c\u628a Agent \u7559\u5728\u6d41\u7a0b\u91cc\u3002** Open Design \u53ef\u4ee5\u4f7f\u7528\u5df2\u6ce8\u518c\u4e14\u53ef\u7528\u7684\u8fd0\u884c\u65f6\uff1b\u540c\u4e00\u5957 BYOK \u8fde\u63a5\u65e2\u80fd\u5728\u5e94\u7528\u4e2d\u4f7f\u7528\uff0c\u4e5f\u80fd\u901a\u8fc7 `od` CLI \u4f7f\u7528\u3002\u5373\u4f7f\u4e24\u4e2a\u9879\u76ee\u7528\u4e86\u76f8\u540c\u7684\u6d4f\u89c8\u5668\u5b58\u50a8\u952e\uff0c\u9884\u89c8\u72b6\u6001\u4e5f\u5404\u81ea\u72ec\u7acb\u3002 (#8702) \u611f\u8c22 @itscheems\u3002\n- \ud83d\udeaa **\u4ece Home \u53d1\u9001\uff0c\u76f4\u63a5\u8fdb\u5165\u771f\u5b9e\u9879\u76ee\u3002** \u4ece Home \u53d1\u51fa\u60f3\u6cd5\u540e\uff0c\u9879\u76ee\u5de5\u4f5c\u533a\u7acb\u5373\u5c31\u4f4d\uff1a\u53ea\u6709\u4e00\u4e2a\u7a33\u5b9a\u7684\u754c\u9762\u3001\u4e00\u4e2a Working \u72b6\u6001\uff1b\u521b\u5efa\u6216\u4e0a\u4f20\u8f83\u6162\u65f6\uff0c\u7b2c\u4e00\u6761\u6d88\u606f\u4e5f\u4e0d\u4f1a\u6d88\u5931\u3002 (#8267) \u611f\u8c22 @Siri-Ray\u3002\n- \ud83c\udfac **\u52a8\u6548\u9884\u89c8\u7ec8\u4e8e\u8ddf\u5f97\u4e0a\u8282\u594f\u3002** \u6d4f\u89c8\u5668\u77ed\u6682\u5361\u987f\u65f6\uff0c\u89c6\u9891\u52a8\u6548\u4e0d\u4f1a\u53cd\u590d\u8df3\u97f3\uff1b\u751f\u6210\u671f\u95f4\u53ef\u4ee5\u770b\u753b\u9762\u800c\u4e0d\u4f1a\u610f\u5916\u51fa\u58f0\uff0c\u5b8c\u6210\u540e\u4ecd\u53ef\u6b63\u5e38\u542c\u5230\u6210\u7247\u58f0\u97f3\u3002 (#8777) \u611f\u8c22 Open Design \u56e2\u961f\u3002\n\n## \u2728 \u65b0\u589e\n\n### \ud83c\udfa8 \u5de5\u4f5c\u53f0\u3001\u539f\u578b\u4e0e\u7d20\u6750\n\n- **\u4f7f\u7528\u56e2\u961f\u7d20\u6750\u5e93\uff0c\u4e0d\u5fc5\u518d\u627e Key\u3002** Open Design \u53ef\u4ee5\u4f7f\u7528\u5df2\u914d\u7f6e\u7684\u516c\u53f8\u7d20\u6750\u6765\u6e90\uff0c\u4fdd\u7559\u6765\u6e90\u4fe1\u606f\uff1b\u9664\u975e\u4f60\u660e\u786e\u8981\u6c42\uff0c\u6210\u54c1\u9875\u9762\u4e0d\u4f1a\u51fa\u73b0\u7f72\u540d\u3002 (#8691)\n- **\u4e2d\u6587\u793e\u533a\u5165\u53e3\u73b0\u5728\u524d\u5f80\u98de\u4e66\u3002** \u7b80\u4f53\u4e2d\u6587\u548c\u7e41\u4f53\u4e2d\u6587\u7684\u5165\u53e3\u4f1a\u6253\u5f00\u5b98\u65b9\u98de\u4e66\u793e\u533a\uff0c\u5176\u4ed6\u8bed\u8a00\u7ee7\u7eed\u4f7f\u7528 Discord\u3002 (#8884) \u611f\u8c22 @joeylee12629-star\u3002\n\n### \ud83e\udde0 Agent\u3001\u5de5\u4f5c\u533a\u4e0e CLI\n\n- **MCP \u4f1a\u8ddf\u968f\u4f60\u6b63\u5728\u4f7f\u7528\u7684\u5de5\u4f5c\u533a\u3002** \u5207\u6362\u5de5\u4f5c\u533a\u5e76\u91cd\u65b0\u8fde\u63a5\u540e\uff0c\u5de5\u5177\u770b\u5230\u7684\u662f\u5f53\u524d\u9879\u76ee\u548c\u4ea7\u7269\uff0c\u4e0d\u518d\u8bef\u843d\u5230\u5176\u4ed6\u5de5\u4f5c\u533a\u3002 (#7619) \u611f\u8c22 @roian6\u3002\n\n## \u26a1 \u6027\u80fd\n\n- **\u5c11\u7b49\u4e00\u4f1a\u513f\u52a8\u6548\u5bfc\u51fa\u3002** \u684c\u9762\u7aef\u89c6\u9891\u6293\u5e27\u66f4\u5feb\uff0c\u540c\u65f6\u4fdd\u6301\u8bf7\u6c42\u7684\u5206\u8fa8\u7387\u3001\u5e27\u7387\u548c\u753b\u9762\u8d28\u91cf\u3002 (#8798) \u611f\u8c22 @PerishCode\u3002\n\n## \ud83d\udc1b \u4fee\u590d\n\n### \ud83e\udde9 Home \u4e0e\u9879\u76ee\n\n- **\u4efb\u52a1\u9009\u62e9\u548c\u201c\u66f4\u591a\u201d\u83dc\u5355\u91cd\u65b0\u53ef\u9760\u3002** \u4efb\u52a1\u7c7b\u578b\u63a7\u4ef6\u3001\u53d6\u6d88\u9009\u62e9\u3001\u77ed\u7a97\u53e3\u5e03\u5c40\u548c\u952e\u76d8\u5bfc\u822a\u90fd\u56de\u5230\u80fd\u653e\u5fc3\u4fdd\u7559\u8349\u7a3f\u7684\u4f4d\u7f6e\u3002 (#8947)\n- **\u5bf9\u8bdd\u4e2d\u7684\u4f5c\u54c1\u64cd\u4f5c\u91cd\u65b0\u6e05\u6670\u53ef\u89c1\u3002** \u751f\u6210\u4f5c\u54c1\u7684\u64cd\u4f5c\u6837\u5f0f\u6062\u590d\u719f\u6089\u7684\u6837\u5b50\uff0cHome \u4e5f\u4e0d\u518d\u663e\u793a\u8fc7\u65f6\u7684\u63d2\u4ef6\u60ac\u6d6e\u5361\u3002 (#8978\u3001#8911) \u611f\u8c22 @alchemistklk\u3002\n- **\u5df2\u5b8c\u6210\u7684\u5de5\u4f5c\u4ecd\u7136\u662f\u5df2\u5b8c\u6210\u3002** \u91cd\u65b0\u6253\u5f00\u9879\u76ee\u65f6\uff0c\u5373\u4f7f\u5386\u53f2\u72b6\u6001\u77ed\u6682\u65e0\u6cd5\u8bfb\u53d6\uff0c\u5df2\u6709\u4ea4\u4ed8\u7269\u4e5f\u4e0d\u4f1a\u88ab\u9519\u8bef\u663e\u793a\u4e3a\u5931\u8d25\u3002 (#8804)\n\n### \ud83c\udf9e\ufe0f \u9884\u89c8\u4e0e\u5206\u4eab\n\n- **\u9884\u89c8\u53d8\u5316\u65f6\uff0c\u8bc4\u8bba\u53ef\u4ee5\u7ee7\u7eed\u5199\u3002** \u4fdd\u5b58\u4f5c\u54c1\u540e\uff0c\u5373\u4f7f\u8bc4\u8bba\u8349\u7a3f\u8fd8\u5f00\u7740\uff0c\u9884\u89c8\u4e5f\u4f1a\u5237\u65b0\uff1b\u8bc4\u8bba\u76ee\u6807\u6d88\u5931\u65f6\u4f1a\u63d0\u793a\u91cd\u65b0\u9009\u62e9\uff0c\u800c\u4e0d\u662f\u4e22\u6389\u8349\u7a3f\u3002 (#8904) \u611f\u8c22 @alchemistklk\u3002\n- **\u5df2\u6709\u7684\u5206\u4eab\u6587\u4ef6\u4fdd\u7559\u81ea\u5df1\u7684\u8eab\u4efd\u3002** \u672c\u5730\u5206\u4eab\u8bb0\u5f55\u7f3a\u5931\u65f6\uff0cOpen Design \u4f1a\u6062\u590d\u5df2\u9a8c\u8bc1\u7684\u4e91\u7aef\u6587\u4ef6\u4e0e\u539f\u94fe\u63a5\uff0c\u800c\u4e0d\u4f1a\u6084\u6084\u65b0\u5efa\u66ff\u4ee3\u94fe\u63a5\u3002 (#8859\u3001#8867) \u611f\u8c22 @alchemistklk\u3002\n\n## \ud83d\ude4f \u611f\u8c22\u53c2\u4e0e 0.26.1 \u7684\u8d21\u732e\u8005\n\n@alchemistklk \u00b7 @itscheems \u00b7 @roian6 \u00b7 @Siri-Ray \u00b7 @PerishCode \u00b7 @joeylee12629-star\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
