66","download_count":534,"created_at":"2026-10-22T12:52:13Z","updated_at":"2026-10-22T12:52:33Z"},{"id":665874136,"node_id":"RA_kwDOSOgY8s4nsG7Y","name":"open-design-0.26.1-mac-x64.dmg.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:50089f572837fb4eafaa83ec890da13ee1a49e1576adcbbcb378eff862f9b23f","download_count":82,"created_at":"2026-10-22T12:52:13Z","updated_at":"2026-10-22T12:52:13Z"},{"id":665874138,"node_id":"RA_kwDOSOgY8s4nsG7a","name":"open-design-0.26.1-win-x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":443156985,"digest":"sha256:704a996e2a4f4a0a5a3dcac18d80e26ff163ce37cc9bda4e6004c0a8dc524f3c","download_count":13280,"created_at":"2026-10-22T12:52:13Z","updated_at":"2026-10-22T12:52:30Z"},{"id":665874162,"node_id":"RA_kwDOSOgY8s4nsG7y","name":"open-design-0.26.1-win-x64-setup.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":104,"digest":"sha256:4732fa653179b5fe1a092d18688a8b1be4a158d72c9e391604b44ba74d24f524","download_count":824,"created_at":"2026-10-22T12:52:14Z","updated_at":"2026-10-22T12:52:14Z"}],"body":"## English\n\nMeet Skill Discovery: describe what you want to create, and Open Design finds the relevant Skills to guide the work—from your first idea to the next revision.\n\nYour idea should be the starting point. In 0.26.1, **Skill Discovery helps Open Design understand the kind of work you want to make and choose the Skills that fit.** You can focus on the result, with less manual setup before creating and more continuity as you refine it. Alongside this, smoother project starts, connected feedback, and steadier previews keep your work moving.\n\n## 📥 Download / 下载\n\n| Platform / 平台 | Installer / 安装包 |\n|---|---|\n| macOS Apple silicon | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-arm64.dmg) · [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-arm64.dmg.sha256) |\n| macOS Intel | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-x64.dmg) · [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-mac-x64.dmg.sha256) |\n| Windows x64 | [Download](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-win-x64-setup.exe) · [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.26.1/open-design-0.26.1-win-x64-setup.exe.sha256) |\n\n## 🧠 Skill Discovery: the right Skills for what you have in mind\n\nDescribe the result you want. **Skill Discovery selects the deliverable type and reads its native Skill guidance**, giving Open Design a task-specific starting point. It supports eleven deliverable types, including interactive prototypes and motion work. (#8804)\n\n- **Start with your intent.** Your explicit request takes priority when it conflicts with a selected task type. Skills and templates you mention provide compatible guidance and references while keeping the requested deliverable in focus.\n- **Bring the right guidance into the work.** Open Design reads the relevant Skill instructions for the chosen type, so you spend less time finding and selecting them yourself.\n- **Keep the direction as you iterate.** Follow-up work carries the chosen Skill guidance forward, keeping revisions consistent. If you ask only for a plan or clarification, that request does not silently become permission to produce the final work.\n\n## 🔥 Highlights\n\n- 🔗 **Share the work, not a pile of screenshots.** Publish a design file as one public link, stop it when the review is over, and resume the same link later. Comments left on the shared page flow back to the file, with unread feedback waiting where you work. (#8408, #8859, #8867, #8904) Thanks @alchemistklk.\n- 🤖 **Bring your own connection — and keep the Agent in the loop.** Open Design can use available registered runtimes, and the same BYOK connection works from the app or the `od` CLI. Your project preview stays isolated to its own work, even when two projects use the same browser storage. (#8702) Thanks @itscheems.\n- 🚪 **Home now opens straight into the real project.** Send an idea from Home and the project is already there: one steady workspace, one Working state, and no disappearing first message while creation or uploads catch up. (#8267) Thanks @Siri-Ray.\n- 🎬 **Motion keeps its rhythm.** Video-motion previews stop jumping through music when the browser hiccups; while a video is still being made, you can watch the picture without unexpected sound, then hear the finished result normally. (#8777) Thanks to the Open Design crew.\n\n## ✨ Added\n\n### 🎨 Studio, prototypes and media\n\n- **Use your organisation's image sources without a key hunt.** Open Design can use configured company stock sources while retaining source information and keeping credits out of the finished page unless you ask for them. (#8691)\n- **Chinese community help now leads to Feishu.** Simplified and Traditional Chinese entry points point to the official Feishu community, while other locales continue to use Discord. (#8884) Thanks @joeylee12629-star.\n\n### 🧠 Agents, workspaces and CLI\n\n- **Your MCP tools follow the workspace you selected.** Switch workspaces, reconnect, and the bridge now sees the projects and artifacts you actually have open. (#7619) Thanks @roian6.\n\n## ⚡ Performance\n\n- **Spend less time waiting for a Motion export.** Desktop video capture is faster while preserving the requested frame size, frame rate, and image quality. (#8798) Thanks @PerishCode.\n\n## 🐛 Fixed\n\n### 🧩 Home and projects\n\n- **Task choices and the More menu feel like Home again.** The task-type controls, cancellation behaviour, compact-window layout, and keyboard navigation are back where your draft can rely on them. (#8947)\n- **Artifact actions stay visible in chat.** Project conversations keep the familiar action styling for generated artifacts, and Home no longer surfaces the obsolete plugin hover card. (#8978, #8911) Thanks @alchemistklk.\n- **Finished work stays finished.** A brief history lookup failure no longer turns an existing delivered run into a failure when you reopen the project. (#8804)\n\n### 🎞️ Preview and sharing\n\n- **Keep commenting while the preview changes.** A saved artifact can refresh with a comment draft open; a missing target asks for reselection instead of throwing the draft away. (#8904) Thanks @alchemistklk.\n- **An existing shared file keeps its identity.** If local share bookkeeping is missing, Open Design recovers a verified cloud file and its original link rather than silently minting a replacement. (#8859, #8867) Thanks @alchemistklk.\n\n## 🙏 Thanks to everyone who shipped 0.26.1\n\n@alchemistklk · @itscheems · @roian6 · @Siri-Ray · @PerishCode · @joeylee12629-star\n\n---\n\n## 中文\n\n全新 Skill Discovery，从你的创作意图出发，发现并选用合适的 Skill。少一些手动配置，从第一个想法到下一轮修改，让创作更贴近你想要的结果。\n\n说出你想做什么，让 Open Design 更懂得如何开始。0.26.1 带来 **Skill Discovery：理解你想创作的作品类型，选择对应 Skill，并在后续修改中延续创作方向。**从开始创作前的能力选择，到作品生成后的继续打磨，你可以把更多注意力留给想法本身。更顺畅的项目启动、分享反馈和预览体验，也让整个创作过程更加连贯。\n\n📥 [下载正式版安装包](https://github.com/nexu-io/open-design/releases/tag/open-design-v0.26.1#assets)\n\n## 🧠 Skill Discovery：更懂你的想法，也更懂该用什么能力\n\n描述你想要的结果，**Skill Discovery 会识别作品类型，选择并读取对应的原生 Skill 指引**，让 Open Design 带着适合这类任务的方法开始创作。目前覆盖 11 类交付物，包括交互原型、动效等创作场景。 (#8804)\n\n- **从你的意图出发。** 当明确需求与手动选择的任务类型不一致时，优先尊重你说出的需求；你提到的 Skill 和模板会作为相容的指导与参考，让创作围绕你真正想要的作品展开。\n- **让合适的能力参与创作。** 根据作品类型读取对应 Skill 的具体指引，减少你在开始前查找、选择技能的操作。\n- **继续修改，延续创作方向。** 继续修改时，沿用已选 Skill 的创作指导，保持前后连贯。你只想讨论方案或澄清需求时，也会尊重这个阶段的意图，不擅自开始制作。\n\n## 🔥 重点更新\n\n- 🔗 **分享作品，而不是一堆截图。** 把设计文件发布为一个公开链接；评审结束时停止分享，需要继续时仍沿用同一个链接。公开页面上的评论会同步回文件，未读反馈就在你工作的地方等你处理。 (#8408、#8859、#8867、#8904) 感谢 @alchemistklk。\n- 🤖 **带上自己的连接，把 Agent 留在流程里。** Open Design 可以使用已注册且可用的运行时；同一套 BYOK 连接既能在应用中使用，也能通过 `od` CLI 使用。即使两个项目用了相同的浏览器存储键，预览状态也各自独立。 (#8702) 感谢 @itscheems。\n- 🚪 **从 Home 发送，直接进入真实项目。** 从 Home 发出想法后，项目工作区立即就位：只有一个稳定的界面、一个 Working 状态；创建或上传较慢时，第一条消息也不会消失。 (#8267) 感谢 @Siri-Ray。\n- 🎬 **动效预览终于跟得上节奏。** 浏览器短暂卡顿时，视频动效不会反复跳音；生成期间可以看画面而不会意外出声，完成后仍可正常听到成片声音。 (#8777) 感谢 Open Design 团队。\n\n## ✨ 新增\n\n### 🎨 工作台、原型与素材\n\n- **使用团队素材库，不必再找 Key。** Open Design 可以使用已配置的公司素材来源，保留来源信息；除非你明确要求，成品页面不会出现署名。 (#8691)\n- **中文社区入口现在前往飞书。** 简体中文和繁体中文的入口会打开官方飞书社区，其他语言继续使用 Discord。 (#8884) 感谢 @joeylee12629-star。\n\n### 🧠 Agent、工作区与 CLI\n\n- **MCP 会跟随你正在使用的工作区。** 切换工作区并重新连接后，工具看到的是当前项目和产物，不再误落到其他工作区。 (#7619) 感谢 @roian6。\n\n## ⚡ 性能\n\n- **少等一会儿动效导出。** 桌面端视频抓帧更快，同时保持请求的分辨率、帧率和画面质量。 (#8798) 感谢 @PerishCode。\n\n## 🐛 修复\n\n### 🧩 Home 与项目\n\n- **任务选择和“更多”菜单重新可靠。** 任务类型控件、取消选择、短窗口布局和键盘导航都回到能放心保留草稿的位置。 (#8947)\n- **对话中的作品操作重新清晰可见。** 生成作品的操作样式恢复熟悉的样子，Home 也不再显示过时的插件悬浮卡。 (#8978、#8911) 感谢 @alchemistklk。\n- **已完成的工作仍然是已完成。** 重新打开项目时，即使历史状态短暂无法读取，已有交付物也不会被错误显示为失败。 (#8804)\n\n### 🎞️ 预览与分享\n\n- **预览变化时，评论可以继续写。** 保存作品后，即使评论草稿还开着，预览也会刷新；评论目标消失时会提示重新选择，而不是丢掉草稿。 (#8904) 感谢 @alchemistklk。\n- **已有的分享文件保留自己的身份。** 本地分享记录缺失时，Open Design 会恢复已验证的云端文件与原链接，而不会悄悄新建替代链接。 (#8859、#8867) 感谢 @alchemistklk。\n\n## 🙏 感谢参与 0.26.1 的贡献者\n\n@alchemistklk · @itscheems · @roian6 · @Siri-Ray · @PerishCode · @joeylee12629-star\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":6}
