{"id":395537899,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOSOgY8s4Xk23r","tag_name":"open-design-v0.24.1","target_commitish":"89e64d813bb1c7a11519b3f668f011f7017637d7","name":"Open Design 0.24.1 \u2014 \u2728 World\u2019s First Design Plan","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-24T07:16:08Z","updated_at":"2026-09-24T09:54:54Z","published_at":"2026-09-24T09:48:53Z","assets":[{"id":585639657,"node_id":"RA_kwDOSOgY8s4i6Cbp","name":"open-design-0.24.1-mac-arm64.dmg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":400755598,"digest":"sha256:1737bf108f6668cafff095ceaa9ca7cff3fa24cc8c697ef4b868802ee136ade7","download_count":2038,"created_at":"2026-09-24T09:48:16Z","updated_at":"2026-09-24T09:48:38Z"},{"id":585639653,"node_id":"RA_kwDOSOgY8s4i6Cbl","name":"open-design-0.24.1-mac-x64.dmg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":420847915,"digest":"sha256:ea35f91f3260755f76c9be1a294da22701c5f2c2bd5a81ae76a9136c59994ba6","download_count":173,"created_at":"2026-09-24T09:48:16Z","updated_at":"2026-09-24T09:48:42Z"},{"id":585639655,"node_id":"RA_kwDOSOgY8s4i6Cbn","name":"open-design-0.24.1-win-x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":438224539,"digest":"sha256:3a544dca7a5f078029d55f272e218278e52edac55efbfb292d56258113e8a441","download_count":3853,"created_at":"2026-09-24T09:48:16Z","updated_at":"2026-09-24T09:48:43Z"}],"body":"## \u2728 World\u2019s First Design Plan: Affordable models for everyone\r\n\r\n**Generous monthly allowance.** Explore and refine your designs with DeepSeek V4.1 Flash, GLM-5.3 Flash and MiMo 2.6 Flash. Get started with Go for **\\$8** for your first month, or choose Plus or above for up to **\\$200** in bonus credits.\r\n\r\n**API access across your workflow.** All personal subscription tiers support API calls. Use your OpenDesign API key with Codex, Claude Code, DSH, OpenCode, Hermes and other AI agents.\r\n\r\n**Free credits for new users.** Every new user receives approximately \\$0.50 in free credits to try OpenDesign.\r\n\r\n## \ud83d\udc1b Fixed\r\n\r\n### \ud83e\udde0 Agents, runtimes and diagnostics\r\n\r\n- **A cleanly finished run stays visibly finished.** A task-level block no longer turns a clean agent exit into a misleading failed-run card; real crashes and failed exits still remain failures. ([#8350](https://github.com/nexu-io/open-design/pull/8350)) Thanks @itscheems.\r\n- **Support bundles retain the clues that matter.** Diagnostics now carry daemon health evidence for memory pressure, SQLite growth and unclean exits, whether you export from the app or with `od diagnostics export`. ([#8354](https://github.com/nexu-io/open-design/pull/8354)) Thanks @PerishCode.\r\n- **Failure evidence can be collected before the trail goes cold.** With existing consent enabled, detected Agent and delivery failures queue bounded, redacted diagnostics automatically; opting out stops collection. ([#8357](https://github.com/nexu-io/open-design/pull/8357)) Thanks @Siri-Ray.\r\n- **OD Next sandboxed runs clean up after themselves.** The run input access root remains writable for sandbox teardown instead of leaving a run stranded on cleanup. ([#8024](https://github.com/nexu-io/open-design/pull/8024)) Thanks @arqueon.\r\n- **Fatal MCP failures say what happened.** An MCP stdio process now writes its fatal error before it exits, so the client has a usable diagnostic instead of a silent disappearance. ([#7340](https://github.com/nexu-io/open-design/pull/7340)) Thanks @lorenzozanee.\r\n\r\n### \ud83d\udda5\ufe0f Desktop and presentation\r\n\r\n- **Updating the desktop app no longer races its own shutdown.** Renderer traffic is stopped before the packaged runtime retires, making the restart handoff safer. ([#8348](https://github.com/nexu-io/open-design/pull/8348)) Thanks @PerishCode.\r\n- **The fullscreen exit button belongs to the theme you chose.** Its colors, hover state and keyboard focus now remain readable in both light and dark presentations. ([#7272](https://github.com/nexu-io/open-design/pull/7272)) Thanks @dennytosp.\r\n- **A macOS MCP session can become a desktop window in place.** Opening the app after its headless runtime started now reveals the normal window without losing the local session. ([#8398](https://github.com/nexu-io/open-design/pull/8398)) Thanks @PerishCode.\r\n\r\n### \ud83c\udfe0 Home and campaigns\r\n\r\n- **The task-type menu stays open when you ask for it.** A click immediately after Home chooses a type no longer opens the picker only for it to snap shut. ([#8386](https://github.com/nexu-io/open-design/pull/8386)) Thanks @Siri-Ray.\r\n- **A valid campaign remains present through ordinary interruptions.** Network changes, short sleeps and tab switches no longer unnecessarily remove an active campaign; cached content follows its known server schedule while offline. ([#8292](https://github.com/nexu-io/open-design/pull/8292)) Thanks @alchemistklk.\r\n\r\n> \ud83d\udce5 **Download:** Tag `open-design-v0.24.1`.\r\n>\r\n> | Platform | Architecture | Assets |\r\n> |---|---|---|\r\n> | macOS | Apple silicon | [DMG](https://github.com/nexu-io/open-design/releases/download/open-design-v0.24.1/open-design-0.24.1-mac-arm64.dmg) |\r\n> | macOS | Intel | [DMG](https://github.com/nexu-io/open-design/releases/download/open-design-v0.24.1/open-design-0.24.1-mac-x64.dmg) |\r\n> | Windows | x64 | [Installer](https://github.com/nexu-io/open-design/releases/download/open-design-v0.24.1/open-design-0.24.1-win-x64-setup.exe) |\r\n\r\n## \ud83d\ude4f Thanks to everyone who shipped 0.24.1\r\n\r\n@PerishCode \u00b7 @Siri-Ray \u00b7 @alchemistklk \u00b7 @itscheems \u00b7 @lefarcen \u00b7 @simpleqt \u00b7 @arqueon \u00b7 @dennytosp \u00b7 @lorenzozanee\r\n\r\n","reactions":{"total_count":6,"+1":6,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":9}
