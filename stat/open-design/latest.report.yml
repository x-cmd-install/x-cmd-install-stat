66de3825ec02fec18b","download_count":782,"created_at":"2026-09-10T10:24:11Z","updated_at":"2026-09-10T10:24:39Z"},{"id":554780317,"node_id":"RA_kwDOSOgY8s4hEUad","name":"open-design-0.22.2-mac-x64.dmg.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:390f541d950cc4cdc652ecf6274142f8fb9652f37035e3e6e525e2718541cfcb","download_count":118,"created_at":"2026-09-10T10:24:11Z","updated_at":"2026-09-10T10:24:11Z"},{"id":554780315,"node_id":"RA_kwDOSOgY8s4hEUab","name":"open-design-0.22.2-win-x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":438207278,"digest":"sha256:7916ea5fbb4e61edb186951ac3689f8b0eccac4f448f740c80d26067094ce0f2","download_count":22161,"created_at":"2026-09-10T10:24:11Z","updated_at":"2026-09-10T10:24:39Z"},{"id":554780332,"node_id":"RA_kwDOSOgY8s4hEUas","name":"open-design-0.22.2-win-x64-setup.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":104,"digest":"sha256:e439a2041828c120c6ecce171471b22483dfc65bfdccafb3877c1c4f49f35c84","download_count":940,"created_at":"2026-09-10T10:24:12Z","updated_at":"2026-09-10T10:24:12Z"}],"body":"Open Design 0.22.2 is a focused desktop update reliability patch for macOS and Windows.\n\n## \ud83d\udc1b Fixed\n\n- \ud83d\udd04 **Return to the app more reliably after an update.** The updated app waits for the previous instance to finish closing before starting, helping prevent an update restart from ending without a new window. (#7970) Thanks @PerishCode.\n- \u23f3 **Keep clear feedback while an update restarts.** An accepted restart no longer shows a quit failure just because closing background work takes more than ten seconds. Repeated quit requests wait for the same cleanup; an explicit quit refusal still offers a retry without reinstalling the update. (#7982) Thanks @PerishCode.\n\n### Upgrading from an older version\n\nThe first upgrade to 0.22.2 still uses the older app's shutdown screen and behavior. If it reports a quit error but then restarts successfully, the new version can still be installed. Clients already stuck in a restart loop may need help from customer support; this patch does not automatically recover those installations.\n\n> \ud83d\udce5 **Download:** [Open Design downloads](https://open-design.ai/download/).\n\n## \ud83d\ude4f Thanks to everyone who shipped 0.22.2\n\n@PerishCode\n","reactions":{"total_count":7,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":1}
