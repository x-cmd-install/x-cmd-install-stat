DORPtl3M4q4qDL","name":"unifly-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":17071616,"digest":"sha256:75066be2af636c4b16dea9f87a7e8fff74da453fa4d290dae877f2a9dcec660e","download_count":8,"created_at":"2026-11-07T03:39:30Z","updated_at":"2026-11-07T03:39:31Z"}],"body":"unifly 0.13.0 adds UniFi Network 11 support across the CLI, TUI, and Rust library, while retaining legacy statistics support on Network 10.\n\n## Network 11 support\n\n- Read site, device, client, and gateway statistics through the modern time-series API. Reports retain native bucket durations and monthly resolution; charts calculate rates from the actual duration.\n- Read paginated system-log history and dashboard critical alerts, including acknowledgement. Legacy fallback applies only when the modern endpoint is absent.\n- Inspect LAGs, MC-LAG domains, and switch stacks with `devices lags`, `devices mc-lag-domains`, and `devices switch-stacks`.\n- Configure firewall flow reporting and the WiFi 2.4 GHz channel and DTIM locks. Updates preserve fields you did not change.\n- Create gateway- and switch-managed networks with validated IPv4 and DHCP settings. Switch creation requires its owning Integration device UUID.\n\n## Fixes\n\nNetwork and firewall writes resolve names consistently, preserve Network 11 filters, and reject changes that would discard an unfamiliar filter. Native WiFi bindings and site deletion use the controller's expected wire formats. DHCP create and update share range validation.\n\nCLI and TUI startup share configuration resolution, including cloud host discovery. Config edits preserve comments and unknown keys. Explicit API-key overrides select API-key authentication, raw Integration calls work with hybrid and cloud profiles, and malformed URL passwords remain masked.\n\nNetwork forms submit only edited fields and retain invalid drafts. Client kicks require confirmation. Event timestamps use local time, topology labels stay inside their boxes, and successful historical charts update even when DPI is unavailable.\n\nUnrelated Session reads no longer hold a shared lock across network requests. Port-array updates remain atomic per switch. Event retention is bounded, pagination handles continuation flags, and optional inventory failures retain previously loaded data with a warning.\n\n## Upgrade notes\n\n- Five unsupported Integration NAT methods are removed from `unifly-api`. Use Session NAT methods or controller commands.\n- Library site creation takes one display name. CLI `sites create --description` is an alias for `--name`.\n- `CreateNetworkRequest` gains `device_id`; switch-managed creation requires an Integration device UUID. Gateway and switch creation require an IPv4 host/prefix even with DHCP disabled. Event and firewall-filter types also gain fields or variants; see the [library migration guide](https://github.com/hyperb1iss/unifly/blob/v0.13.0/docs/content/reference/library.md#migrating-to-013).\n- New allow policies and block-to-allow edits default mirrored return traffic to false. Pass `--allow-return-traffic true` when required and supported by the destination zone.\n- Firewall block events are hidden by default. Use `events list --include-firewall` to include them; intrusion-prevention events remain visible.\n\n## Validation\n\nThe full local gate passed 1,218 tests with one ignored test. CI passed Linux checks, dependency policy, Windows builds and configuration tests, and controller E2E.\n\nA disposable UniFi OS lab running Network 11.0.99 passed all 29 E2E tests, including all four Integration API tests. Additional live checks covered DHCP lifecycle, native WiFi bindings, firewall fields and filters, site lifecycle, populated statistics, and acknowledgement of a generated WAN-down critical alert. The legacy Docker lane passed all 25 Session tests, with four expected API-key skips. Read-only checks on Network 10.6.109 returned populated legacy history.\n\nSwitch-owned network creation and populated LAG/MC-LAG/stack details remain schema or fixture coverage without physical L3 switching hardware. The fresh lab cannot establish aged monthly history or populated DPI classification. No production controller was upgraded or mutated.\n\n[Full changelog](https://github.com/hyperb1iss/unifly/blob/v0.13.0/CHANGELOG.md) · [Implementation and review receipts](https://github.com/hyperb1iss/unifly/pull/79)\n"}
