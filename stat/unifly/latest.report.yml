_kwDORPtl3M4eFzYp","name":"unifly-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":17008640,"digest":"sha256:923bfd952672fb7e56a508b91f2f4554316f091ff84a3dc3a355eb2846c772a1","download_count":23,"created_at":"2026-08-07T07:40:57Z","updated_at":"2026-08-07T07:40:58Z"}],"body":"# Release Notes v0.10.0\n\n**Released:** 2026-08-07\n\nThis release brings a full VPN management surface, Site Manager cloud fleet commands, switch port config-as-code, and TUI auto-reconnect. Significant work went into fixing real-world controller compatibility: DNS record type parsing, firewall payload decoding, NAT visibility under session-only auth, and a config resolution overhaul that finally honors `[defaults]` fields and respects the TLS/timeout precedence chain.\n\n## \u2728 Highlights\n\n### Full VPN Management Surface\nSite-to-site CRUD, remote-access CRUD (with `suggest-port` and `download-config`), client profiles, peer management, connections list/get/restart, magic-site-to-site, and `vpn settings` with flag groups for teleport, OpenVPN, and peer-to-peer. Most write paths accept `--from-file` for declarative config. Detail views (`vpn servers get`, `vpn tunnels get`) expose subnet, port, protocol, peer address, and IKE version. `vpn status` and `vpn health` provide live IPsec SA state and subsystem health.\n\n### Site Manager Cloud Fleet Commands\nNew `cloud` command group (`hosts`, `sites`, `devices`, `isp`, `sdwan`) backed by a `unifly-api` fleet client with `nextToken` pagination and rate-limit handling. `config cloud-setup` walks through API key validation, console selection, site discovery, and profile writing. `cloud switch <site>` retargets an active cloud profile to a different controller site. Cloud host auto-resolution kicks in for Integration commands when the profile omits `host_id` but the API key maps to a single console.\n\n### Switch Port Management as Code\n`devices ports`, `devices ports-export`, and `devices port-set` cover mode, native VLAN, tagged VLANs, PoE, and speed per port. `port-set --from-file` accepts JSONC with splice semantics (omitted ports keep their current override; per-port `\"reset\": true` clears one). `ports-export` emits sparse JSONC by default; `--with-clients` injects `// last-seen <ISO8601>: <mac>` comments for git-diff drift detection.\n\n### TUI Auto-Reconnect\nA failed controller connection no longer leaves the dashboard dead. The data bridge retries with exponential backoff (2s doubling to a 30s cap), the status bar shows the attempt number while reconnecting, and `Ctrl+r` triggers an immediate manual retry. Connect failures now display the reason in the status bar instead of showing a silent \"disconnected\".\n\n### Create Commands Print to stdout\nEvery create command now emits the created entity on stdout in the requested `--output` format, so pipelines can capture IDs directly: `unifly networks create ... -o json | jq -r .id`. Covers networks, wifi, firewall policies/zones/groups, NAT, ACL, DNS, traffic-lists, hotspot vouchers, and VPN records. The human confirmation stays on stderr. If the response cannot be rendered, a warning is emitted on stderr instead of failing the command.\n\n### Config Resolution Overhaul\nThe `[defaults]` fields `insecure` and `timeout` are now honored during profile resolution. Precedence follows: CLI flags > env vars > profile > `[defaults]` > builtin. A profile's `ca_cert` beats an inherited `defaults.insecure = true`, and `--insecure=false` explicitly re-enables verification. Cloud profiles always use strict TLS. `config init` now asks about self-signed certificates with smart defaults based on URL heuristics (yes for IPs, `.local`/`.lan` hosts, single-label hostnames; no for public FQDNs).\n\n## \ud83d\udd27 CLI and API Surface\n\n- `settings` top-level command: `list / get <KEY> / set <KEY> / export` for site-level Session API settings\n- `firewall groups` CRUD for port groups, address groups, and IPv6 address groups via the Session API, with `--type` filter on list\n- Port/address group references in firewall policies via `--dst-port-group`, `--src-port-group`, `--dst-address-group`, `--src-address-group` flags and `--from-file` shorthand fields\n- `--after-system` on `firewall policies create` to place a policy after system-defined rules in one step\n- `--from-file` shorthand fields for firewall policies: `dst_ip`, `dst_port`, `src_ip`, `src_port`, `dst_network`, `src_network` resolve into canonical filter structures\n- `wifi neighbors` lists rogue/neighboring APs; `wifi channels` shows per-radio regulatory availability\n- `clients roams <mac>` surfaces a client's connection timeline; `clients wifi <ip>` shows Wi-Fi experience metrics\n- `Client::switch_port` populated from session-side `sw_port`, visible in `clients get` detail view\n\n## \ud83d\udc1b Fixes\n\n- **NAT policies visible under session-only auth.** The session-only refresh snapshot omitted NAT entirely; rules created on the controller were invisible to `nat policies list` while update and delete still worked. The refresh now fetches NAT via `list_nat_rules()` with error recovery.\n- **DNS policies parse modern `*_RECORD` type tokens** (#27). Controllers send `A_RECORD`-style identifiers; the old short-name tables mislabeled every non-forward record as `ForwardDomain`. One canonical mapping now covers read and write, unknown record types are skipped with a warning, and the CLI shows short names (`A`, `CNAME`, `Forward`).\n- **Firewall policy lists survive real controller payloads** (#26). Port ranges arrive as `start`/`stop` per Ubiquiti's spec; the model demanded invented `startPort`/`endPort` names. Integration list pages now decode per-item, so a single unparseable record cannot empty an entire collection, and pagination advances by wire count so dropped items cannot truncate a scan.\n- **TUI honors CLI flag and env overrides** (#25). The profile path dropped `--insecure`, `--site`, `--api-key`, `--totp`, `--no-cache`, and `--controller`; `UNIFI_INSECURE=true unifly tui -k` failed TLS while the CLI worked.\n- **Profile timeout takes effect.** The `--timeout` flag's baked-in clap default shadowed every profile timeout. Resolution now follows flag/env, then profile, then the 30-second builtin, including cloud transports.\n- Port range items in firewall payloads now serialize as `PORT_NUMBER_RANGE` instead of `PORT_RANGE` (still accepted on read for backward compatibility)\n- TUI redraws correctly after direct keyboard input\n\n## \u267b\ufe0f Nomenclature: \"Legacy\" \u2192 \"Session\"\n\nThe UniFi `/api/*` and `/v2/api/*` HTTP surface is not deprecated; Ubiquiti ships new functionality there regularly, and with API-key discovery it is no longer tied to cookie session auth. It is now consistently called the **Session API** in code, types, docs, and user-facing messages.\n\n- Rust: `legacy/` module renamed to `session/`, `LegacyClient` to `SessionClient`, error types and access-check methods renamed accordingly\n- TUI: `AuthMode::Legacy` renamed to `AuthMode::Session`; onboarding wizard shows \"Username / Password (Session API)\"\n- CLI errors: differentiate \"API key rejected\" from \"session expired\" based on auth kind\n- Config: `auth_mode = \"session\"` is the canonical value; `\"legacy\"` is accepted as a backward-compatible alias and normalized silently\n- `EntityId::Legacy(String)` is kept, as it names an ID format (MongoDB ObjectId), not the API surface\n\n## \ud83d\udda5\ufe0f TUI Enhancements\n\n- HyperChart widget with tachyonfx-driven effects and Octant Canvas bandwidth chart on the Stats screen\n- Rank column on ranked-bar lists\n- 160ms `fade_from_fg` transition between screens\n- Bridge connect attempts are now cancellation-safe\n\n## \u2705 Testing\n\n- New e2e tests cover firewall group CRUD round-trip, NAT policy lifecycle (validates the session-only fix), and switch port read/export path shape\n- Nine new unit tests in `resolve.rs` cover defaults application, profile override, flag override, `--insecure=false` forcing verification, CA cert precedence, and timeout precedence at all three layers\n- DNS conversion tests validate all 7 record types with both long and short wire names, plus graceful skip of unknown types\n\n## \u26a0\ufe0f Breaking Changes\n\n- **`From<DnsPolicyResponse>` replaced with `TryFrom`** (affects `unifly-api` library consumers). The conversion now returns `UnrecognizedDnsRecordType` instead of silently mislabeling unknown record types as `ForwardDomain`.\n- **Credential precedence reversed.** When both an explicit `api_key` (or `password`) in TOML config and a keyring entry exist, the explicit config value now wins. The older behavior preferred the keyring. This makes headless and shared-machine workflows predictable (PR #22).\n\n## \ud83d\udcdd Documentation\n\n- README updated for the 0.10 surface: WiFi screen, new flags, defaults\n- New guide pages: `docs/content/guide/vpn.md`, `cloud.md`, `switch-ports.md`, `settings.md`\n- CLI reference refreshed for the 28-command surface\n- AGENTS.md updated with architecture facts and gotchas for 0.10\n- CONTRIBUTING.md documents the dockerized e2e suite\n- SKILL.md and skill references updated for session-only surface and create-stdout capture\n\n## \ud83d\udc77 Build\n\n- Rust toolchain pinned in `rust-toolchain.toml`\n- Dependency graph refreshed (`Cargo.lock`)\n"}
