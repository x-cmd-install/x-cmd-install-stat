RPtl3M4s553-","name":"unifly-windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":18226176,"digest":"sha256:6db9aa2acaa4dce25693a7d58315c3ee215457847242b45d4d9b1e28f39f0e86","download_count":4,"created_at":"2026-11-16T04:01:57Z","updated_at":"2026-11-16T04:01:58Z"}],"body":"# Release Notes v0.14.0\n\n**Released:** 2026-11-16\n\nIn 0.14.0 the TUI can make changes to the network, not only display it. Most screens now have write actions: Devices, Clients, Networks, Firewall, WiFi, Events, Topology and Dashboard. Every command reports its progress and result through one toast and refresh path. The release also fixes ACL rule and firewall policy updates that dropped fields the update did not name. One of those bugs could turn a \"block TCP\" rule into \"block everything\". There are breaking type changes for `unifly-api` consumers.\n\n## 🌟 Highlights\n\n### ✨ Manage the network from the TUI\nDevices can be adopted, provisioned, removed and speed tested. Clients can be blocked, kicked, given a fixed IP, authorized as guests and forgotten. Networks can be created and deleted. Firewall policies, ACL rules and NAT rules can be toggled and deleted. You can also manage SSIDs and archive alarms without leaving the TUI. Disruptive actions ask for confirmation first, and the confirmation says what it will cost.\n\n### 🐛 Updates no longer drop rule fields\nAny ACL rule update, including a plain enable or disable, used to rewrite the rule without its protocol filter. The controller reads a missing filter as every protocol, so a \"block TCP\" rule became \"block everything\". MAC rules lost their network filter the same way. `firewall policies update --ip-version` dropped the protocol filter. Updates now send back everything they fetched.\n\n### ✨ Feedback for every command\nA progress toast appears when a command starts and changes to its result when the command finishes. The controller data is then fetched again, so the screen shows the change right away. Toasts stack in the top-right corner, wrap long text and never replace one another. Press `n` to see the last 50.\n\n### ♻️ Consistent keys and one footer\n`Tab` always switches screens. `h`/`l` and the arrow keys step through sub-tabs, filters and periods on every screen. `F1` opens help everywhere. `Ctrl+c` quits from any state. A single status-bar footer replaces the per-screen hint rows and lists only the actions that work for the current row and mode.\n\n### ⚡️ Connection state you can trust\nAfter the second periodic refresh fails in a row, the controller publishes `ConnectionState::Reconnecting` with the failure count. Any successful full refresh publishes `Connected` again. A lost link now shows as reconnecting instead of leaving frozen data under a connected status. Events arrive in time order without duplicates.\n\n## 🖥️ TUI Screens\n\n- **Devices**: added adopt, provision, remove and gateway speed test next to restart, locate and upgrade. Devices waiting for adoption are listed with the adopted ones.\n  - The Ports and Clients tabs have their own cursor. The Ports tab can power cycle a PoE port, toggle PoE (keeping its previous mode) and rename the port.\n  - The table filters by type and sorts by column (`s`, with `r` to reverse). The Updates filter counts devices with firmware waiting.\n- **Clients**: `b` blocks or unblocks, `x` kicks a wireless client, `I` sets or removes a fixed IP, `A` authorizes or revokes a guest and `F` forgets the client. A new Blocked filter includes offline clients the controller remembers.\n- **Networks**: create (`c`) and delete (`D`) work alongside edit.\n  - The form has cursor editing, accepts a paste, shows validation under the field it applies to and only offers fields the network's kind supports.\n  - Saves that would delete settings or cut devices off ask first. Delete names whatever uses the network. DHCP relay networks show `Relay` and list their relay servers.\n- **Firewall**: `Enter` opens a detail panel for policies, zones, ACL rules and NAT rules.\n  - Policies and rules can be enabled, disabled and deleted, and a policy's logging can be toggled. Each change is checked against the list read back from the controller.\n  - Rules owned by the controller refuse those keys and say why.\n  - Reordering now works as pick up, move, apply: `K`/`J` move a policy on screen, `Enter` writes the new order and `Esc` cancels.\n- **WiFi**: a new SSIDs sub-tab can enable, disable, hide, rename, change the passphrase of and delete an SSID.\n  - The passphrase is typed twice. `P` is refused on open SSIDs, enterprise SSIDs and SSIDs with per-network keys.\n  - Settings missing from the controller's list show as `…` or unknown, never as off.\n  - `Space` sets an explicit focus on one access point. Each sub-tab keeps its own sort, search and panel.\n- **Events**:\n  - A cursor and detail pane (`Enter`) that jumps to the event's device or client.\n  - A category filter (`h`/`l`) and search by message text.\n  - Paged older history (`o`, with `Esc` to cancel a load) and firewall blocks on demand (`f`).\n  - An Alarms view (`v`) that archives one alarm or all of them.\n- **Topology**: the map opens fitted to the screen, never below 80% zoom. `f` fits the map, `r` resets to 100%, `[`/`]` walk a device cursor and `Enter` opens the selected device.\n- **Dashboard**: arrows and `hjkl` move focus across panels and `Enter` opens the focused panel's screen. `S` runs a WAN speed test whose result appears on the Gateway panel's new `Speed` line.\n\n## 🔧 Input, Setup and Settings\n\n- A shared `LineInput` editor gives every typed field cursor movement, readline chords and paste handling.\n- A one-line prompt overlay takes single values such as a fixed IP, a port name or a passphrase. `Ctrl+t` shows or hides a masked value.\n- Bracketed paste is on. Pasted text goes only to the search bar or the focused field. Before this change, a paste containing `J` could reorder firewall policies.\n- `PgUp`, `PgDn`, `Home` and `End` work in every list. `Ctrl+l` redraws the screen. `Ctrl+r` refreshes data while connected and retries the connection while disconnected.\n- `Esc` closes one thing per press: the detail view, then a toast, then a kept search filter, then the screen.\n- Locate is now a toggle: press `L` again to turn the LED off.\n- Setup and Settings share one form.\n  - The form has a one-time MFA code field, a site picker filled from the controller, and editable CA certificate and timeout fields.\n  - Settings has a profile picker that can start the wizard for a new profile.\n  - The wizard asks for the auth mode first, skips the address for Cloud and makes turning off certificate checks an explicit choice.\n  - Only a connection that passes its test is saved. A save keeps keys the form did not change, such as `api_key_env` and `host_id_env`.\n- `SIGTERM`, `SIGHUP`, `SIGINT`, `SIGQUIT` and a closed input stream quit cleanly and restore the terminal.\n\n## 💻 CLI Changes\n\n- `clients set-ip` and `clients remove-ip` accept `--network` as an Integration ID, a session `_id` or a name, and work on session-only profiles.\n- `devices list` includes devices waiting for adoption on profiles that can reach the Integration API.\n- `firewall policies patch --enabled` now fetches the full policy and writes it back. The controller's PATCH endpoint silently ignored `enabled`.\n- `networks create` and `networks update` refuse settings the network's kind has no field for, instead of dropping them. An update also refuses:\n  - more than four DNS servers\n  - a DNS server that is not IPv4\n  - turning IPv6 on when the network has no IPv6 configuration\n- `networks delete --force` now reaches the controller.\n- `clients block`, `unblock` and `kick` use the session station manager whenever a session exists, so they reach offline blocked clients.\n- `wifi list -o json|yaml` leaves out `hidden`, `client_isolation`, `band_steering`, `mlo_enabled` and `fast_roaming` when the controller does not report them, and adds `preshared_key_count`. Previously those fields printed `false`. `wifi get` prints `-` for settings the controller did not report.\n- Network JSON output gains `dhcp.relay_servers`.\n\n## 🐛 Fixes\n\n- Fixed IPs are written under the network's session ID. API-key and Hybrid profiles used to send the Integration ID.\n- Guest and blocked state now reach clients on API-key and Hybrid profiles.\n- A one-time TOTP code is sent once per controller and never replayed on reconnect. Replaying it caused failed MFA logins. A reconnect asks `totp_command` for a fresh code.\n- `?` opens help on terminals that report Shift with it. `Ctrl` and `Alt` chords no longer act as their plain letter.\n- A network save the controller refuses keeps the form open with the draft and the reason.\n- The connection test validates what was typed, not a cached session or `UNIFI_PASSWORD`. It can be cancelled, and it explains failures by kind.\n- The WiFi channel map counts every radio of every online AP, marks DFS channels and counts each neighbor once.\n- Stats shows loading, error and no-access states instead of stale charts.\n- The Dashboard no longer draws a stalled WAN rate as a flat line.\n- Demo sessions redact addresses and MACs in firewall filters, port labels and error text. A `totp_command` is shown by its program name only.\n\n## 🧪 Demo Mode\n\nThe demo fleet simulates the new writes offline and validates them the way the controller does. Covered writes:\n\n- network create, edit and delete\n- policy and rule toggles, deletes and reorders\n- SSID edits and deletes\n- alarm archiving\n- port PoE and rename\n- guest authorization, fixed IPs and forgetting a client\n- removing and adopting an access point\n\n## 🔒 Security\n\n- Bumped `rustix` to 1.1.6 for RUSTSEC-2026-0486.\n\n## 💥 Breaking Changes (`unifly-api`)\n\n- `WifiBroadcast`: `hidden`, `client_isolation`, `band_steering`, `mlo_enabled` and `fast_roaming` are now `Option<bool>`. New: `preshared_key_count`, `WifiBroadcast::summary()` and `Controller::wifi_passphrase_matches`.\n- `FirewallPolicyPatch.enabled` is removed. Enable or disable a policy through the full policy update.\n- `IntegrationClient::delete_network` takes a `force` argument.\n- `Command::SetClientFixedIp.network_id` is `Option<EntityId>`. `None` picks the network whose subnet contains the address.\n- `EventHistoryQuery` gains `until`.\n- `DhcpConfig.relay_servers`, `AclRuleResponse.extra` and `AclRuleCreateUpdate.extra` are new fields, which breaks struct literals of those types.\n- `ConnectionState::Reconnecting` can now be published while the controller is connected. It means the link is failing, not gone, and commands still run.\n- New: `Controller::logout_session()` and `session_cache::cache_dir()`.\n\n## Upgrade Notes\n\n- `Tab` no longer cycles the Clients filter or the WiFi sub-tabs. Use `h`/`l` or the arrow keys.\n- Stats periods now step with `h`/`l` instead of the `h`, `d`, `w` and `m` keys.\n- Firewall reordering now needs `Enter` to apply. `K`/`J` alone no longer write to the controller.\n- Toasts now appear in the top-right corner.\n- Scripts that parse `wifi list -o json` should treat missing `hidden`, `client_isolation`, `band_steering`, `mlo_enabled` and `fast_roaming` keys as unknown.\n- `unifly-api` consumers:\n  - Update struct literals for `EventHistoryQuery`, `DhcpConfig` and the ACL types, or add `..Default::default()`.\n  - Handle `Option<bool>` on `WifiBroadcast`.\n  - Replace uses of `FirewallPolicyPatch.enabled` with the full policy update.\n- If you rely on ACL rule or firewall policy updates, check rules that were edited with earlier versions. Their protocol or network filters may have been dropped.\n"}
