sshs-windows-amd64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":66,"digest":"sha256:622fa606651a468987b277faa43b83ba2713c4fc795ed4096340838bc6ee8a56","download_count":44,"created_at":"2026-08-28T16:15:38Z","updated_at":"2026-08-28T16:15:39Z"},{"id":534043892,"node_id":"RA_kwDOGxKwjc4f1Nz0","name":"sshs-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":2044928,"digest":"sha256:ab788195c48499dfe13de072de1661cfc3b59e43e05eeb152bf4be50d4ff0cd1","download_count":15,"created_at":"2026-08-28T16:15:19Z","updated_at":"2026-08-28T16:15:20Z"},{"id":534043933,"node_id":"RA_kwDOGxKwjc4f1N0d","name":"sshs-windows-arm64.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":66,"digest":"sha256:66dea18a739474370533dd7a55cff47d174bf0c6b4b2a23ddb60c588e2f5b748","download_count":40,"created_at":"2026-08-28T16:15:21Z","updated_at":"2026-08-28T16:15:22Z"}],"body":"## \u2728 What's New \u2728\r\n\r\n### Interface\r\n* **Reload with `Ctrl+R`** - sshs reads the configuration files again and updates the host list. A restart is not necessary.\r\n* **Pick your palette with `--color`** - the value is a Tailwind palette name, for example `blue`, `green`, or `rose`.\r\n* **Keep your order with `--no-sort`** - sshs shows the hosts in configuration file order.\r\n* **Sort by match score with `--sort-fancy`** - the best fuzzy match comes first ([#140](https://github.com/quantumsheep/sshs/pull/140)).\r\n* **Select text in your terminal** - sshs does not capture the mouse any more.\r\n* **See the real destination** - sshs expands the `%h` and `%n` tokens in the destination column.\r\n\r\n### Search\r\n* **Each word must match** - sshs divides the query at spaces. A host appears only when all the words match.\r\n* **Wider match scope** - the fuzzy score includes the name, the aliases, and the destination.\r\n* **Stable selection** - when the query changes, the selection returns to the top match.\r\n\r\n### SSH configuration parser\r\n* Quoted values keep their `#` characters, and sshs removes the surrounding quotes.\r\n* `Match` block entries do not leak into the previous host.\r\n* Relative `Include` paths in the system file resolve against `/etc/ssh`.\r\n* `Include` recursion stops at a safe depth and does not overflow the stack.\r\n* Alias merging is blocked only when `HostName` depends on `%h` or `%n` ([#153](https://github.com/quantumsheep/sshs/pull/153)).\r\n* Parser errors show the offending line. A missing configuration file gives a clear error.\r\n* A `Host` entry with no patterns does not cause a crash.\r\n\r\n### Stability\r\n* No crash on `End` or `PageDown` when the host list is empty.\r\n* Page navigation moves by the visible table height.\r\n* Table columns use their computed widths.\r\n* When an SSH session exits with an error, sshs returns to the host list.\r\n\r\n### Packaging and documentation\r\n* New installation instructions for Debian and Ubuntu.\r\n* New installation method for NetBSD ([#142](https://github.com/quantumsheep/sshs/pull/142)).\r\n\r\n## \ud83c\udf1f New Contributors \ud83c\udf1f\r\n* [@OmenWild](https://github.com/OmenWild) made their first contribution in [#140](https://github.com/quantumsheep/sshs/pull/140)\r\n* [@0323pin](https://github.com/0323pin) made their first contribution in [#142](https://github.com/quantumsheep/sshs/pull/142)\r\n* [@mwestza](https://github.com/mwestza) made their first contribution in [#153](https://github.com/quantumsheep/sshs/pull/153)\r\n\r\n**See All the Changes:** [The full list of updates from version 4.7.2 to 4.8.0](https://github.com/quantumsheep/sshs/compare/4.7.2...4.8.0)\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
