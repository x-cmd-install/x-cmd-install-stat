))\n- **MD057**: stop requiring index.md for directory links in filesystem mode ([c04ae4e](https://github.com/rvben/rumdl/commit/c04ae4e9bef6353800f8e9f392768dad15b79993))\n- **MD051**: validate fragments in repository-absolute cross-file links ([ead5f39](https://github.com/rvben/rumdl/commit/ead5f39d48d2d15f594218da01896182d7874ba3))\n- **parser**: stop reading headings inside blocks whose body is not Markdown ([59958b1](https://github.com/rvben/rumdl/commit/59958b124e5665e7c91a5ad7b9bd5ec9fdebe67d))\n- **MD077**: carry a code block's interior indentation when reindenting its fence ([00c578d](https://github.com/rvben/rumdl/commit/00c578d6e0ea9d1070cdb4cfa1f19ae352c5e209))\n\n\n## Downloads\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [rumdl-v0.2.73-x86_64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-x86_64-unknown-linux-gnu.tar.gz) | Linux x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.73-x86_64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-x86_64-unknown-linux-musl.tar.gz) | Linux x86_64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-x86_64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.2.73-aarch64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-aarch64-unknown-linux-gnu.tar.gz) | Linux ARM64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.73-aarch64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-aarch64-unknown-linux-musl.tar.gz) | Linux ARM64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-aarch64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.2.73-x86_64-a