ication/gzip","state":"uploaded","size":7399374,"digest":"sha256:3a02b5677a7a3f6e7a8f6cc09d93bb384ee56f4da0273865f4ddf94594382785","download_count":76,"created_at":"2026-09-23T01:45:04Z","updated_at":"2026-09-23T01:45:05Z"},{"id":582707691,"node_id":"RA_kwDOOBOm5M4iu2nr","name":"rumdl-v0.2.76-x86_64-unknown-linux-gnu.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":112,"digest":"sha256:4a5967c8021b69edb6dbba6daa3a58e4920d31600c8ef86ac8b59b4ae06db2af","download_count":4,"created_at":"2026-09-23T01:45:04Z","updated_at":"2026-09-23T01:45:04Z"},{"id":582707676,"node_id":"RA_kwDOOBOm5M4iu2nc","name":"rumdl-v0.2.76-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7343365,"digest":"sha256:320214327d38161f9a376d6e1dab5b8da200b3b9e2a3f361728718e760ff96c6","download_count":39,"created_at":"2026-09-23T01:45:04Z","updated_at":"2026-09-23T01:45:05Z"},{"id":582707690,"node_id":"RA_kwDOOBOm5M4iu2nq","name":"rumdl-v0.2.76-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:9dec48516b3996dbf414b9219c53840a369002c78cb9ba383cc4bd34f08791d8","download_count":25,"created_at":"2026-09-23T01:45:04Z","updated_at":"2026-09-23T01:45:04Z"}],"body":"\n### Added\n\n- **MD094**: report each invalid UTF-8 sequence, with its position ([6c25d76](https://github.com/rvben/rumdl/commit/6c25d76c5df831f1c1c7673b9914bfaea2b623f1))\n- **encoding**: lint files containing invalid UTF-8 instead of skipping them ([f531bf4](https://github.com/rvben/rumdl/commit/f531bf4c9207216e6fa770602ae36899c8ec5f82))\n\n### Fixed\n\n- **MD013**: leave definition lists as written when reflowing, instead of moving a definition's later paragraph out of the list ([93ab135](https://github.com/rvben/rumdl/commit/93ab1356b1c0bb65643b8648215c90eefd3d3e5e))\n- **MD013**: keep every block of consecutive mkdocstrings blocks out of reflow ([7199b0a](https://github.com/rvben/rumdl/commit/7199b0a4c6a6c0699a8c0ae7d575644520f91338))\n- **MD013**: recognize mkdocstrings blocks whose identifier has no dot ([31b56ea](https://github.com/rvben/rumdl/commit/31b56eaa7e0010a9e2244b5e91b579593c84520b))\n- **cli**: report a skipped file on the same stream as the run's other findings, not always stderr ([9558bc5](https://github.com/rvben/rumdl/commit/9558bc5ffb7970b13b2713521ce643a5d01dc09a))\n- **MD092**: follow the invocation's rule selection ([b0dfbe2](https://github.com/rvben/rumdl/commit/b0dfbe235aa0002a961656b235c583b5bfc3cea7))\n- **lint-context**: record only CommonMark headings as headings ([1479a1e](https://github.com/rvben/rumdl/commit/1479a1e0369490a17899318fa3dac460928ba0d7))\n- **cli**: name every ignore file --respect-gitignore controls ([268a54d](https://github.com/rvben/rumdl/commit/268a54d9afcd3eb9cec2a80276600221a93f15ce))\n- **discovery**: attribute empty runs to .markdownlintignore separately ([834e10c](https://github.com/rvben/rumdl/commit/834e10cf53846d4647ebdb6805f2b2791d1f0dd7))\n\n\n## Downloads\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [rumdl-v0.2.76-x86_64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.76/rumdl-v0.2.76-x86_64-unknown-linux-gnu.tar.gz) | Linux x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.76/rumdl-v0.2.76-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.76-x86_64-unknown-linux-musl.tar.gz](https://gith