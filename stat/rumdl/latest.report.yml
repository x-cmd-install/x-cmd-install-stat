gzip","state":"uploaded","size":9186988,"digest":"sha256:dceca66687b4ae5bc129f34378268f329f830b9d736cd34b8c515790dc6347ee","download_count":451,"created_at":"2026-11-24T16:49:00Z","updated_at":"2026-11-24T16:49:01Z"},{"id":788018548,"node_id":"RA_kwDOOBOm5M4u-DV0","name":"rumdl-v0.3.6-x86_64-unknown-linux-gnu.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":111,"digest":"sha256:2195c6a233b178673e8e93432759a7396a7c27785ee5bc7aacf37ccda8125e3c","download_count":44,"created_at":"2026-11-24T16:49:00Z","updated_at":"2026-11-24T16:49:00Z"},{"id":788018561,"node_id":"RA_kwDOOBOm5M4u-DWB","name":"rumdl-v0.3.6-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9156105,"digest":"sha256:a50fe06c5a878b81d617cbf1cb98c3c245ebf7fef1fb1463345d85922e7e1c32","download_count":197,"created_at":"2026-11-24T16:49:00Z","updated_at":"2026-11-24T16:49:01Z"},{"id":788018546,"node_id":"RA_kwDOOBOm5M4u-DVy","name":"rumdl-v0.3.6-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":112,"digest":"sha256:80ac0ce228eb4d0010e3f4f8fd5e2f297d2782c5cb87cc41a84698c49e4c1722","download_count":124,"created_at":"2026-11-24T16:49:00Z","updated_at":"2026-11-24T16:49:00Z"}],"body":"\n### Added\n\n- **MD034**: add opt-in CJK punctuation handling ([df36147](https://github.com/rvben/rumdl/commit/df361471876d8b68caae20caba57e1a7c376fb31))\n- **MD057**: check inline links inside HTML comments behind html-comments ([074bb03](https://github.com/rvben/rumdl/commit/074bb03cedbe7e37554bee3a4edc66813b198db5))\n\n### Fixed\n\n- Respect blank and exclusion-only `include` patterns when updating the language server workspace index.\n- **MD034**: preserve protected URLs with CJK punctuation ([4559341](https://github.com/rvben/rumdl/commit/4559341cb516455e89226fc069fefbddd78188e4))\n- **MD061**: pick the longest term with valid boundaries ([b6c662e](https://github.com/rvben/rumdl/commit/b6c662e2565c54e00222501c548360d83c422a5d))\n- **MD061**: report a term that extends an earlier listed term ([ee42482](https://github.com/rvben/rumdl/commit/ee424821eb1b508e0d197fc5bab0656908908a39))\n- **schema**: type MD072 custom key order ([9127bf1](https://github.com/rvben/rumdl/commit/9127bf11bcdb842355688b2433ef6517011bd268))\n- **schema**: support both kebab case and snake case for MD072 options ([8713325](https://github.com/rvben/rumdl/commit/8713325c5528980342b20d517fe2a6b08b6002f6))\n- **tables**: read a delimiter row inside a code span as code ([0c0a233](https://github.com/rvben/rumdl/commit/0c0a2339ce88d47f3bfece089104d5fe76126c5f))\n- **MD077**: keep the fix from turning paragraph text into a block ([d97c8e0](https://github.com/rvben/rumdl/commit/d97c8e0ae6df00dfede4e2dd73bcfab3d15ea1c6))\n- **tables**: detect a table whose header row opens with a code span ([6c441a5](https://github.com/rvben/rumdl/commit/6c441a525d2546e4fd4ac301b8556800915845b1))\n- **tables**: keep the list context across a lazy continuation line ([61c894e](https://github.com/rvben/rumdl/commit/61c894ed358b3790cf4d36261569a4177702e938))\n- **MD077**: align a continuation line that opens with a code span ([94766cc](https://github.com/rvben/rumdl/commit/94766cc81eeedd350335314a8eec459ca962d880))\n- **deps**: refresh Rust dependencies for v0.3.6 ([c75c611](https://github.com/rvben/rumdl/commit/c75c611b41e2661971114b123c90b8959539e47b))\n\n### Performance\n\n- **lsp**: convert the ranges of a quick fix in one pass ([5fbdd19](https://github.com/rvben/rumdl/commit/5fbdd190b77aa57767b74dbbf1ef87ec1000a8ce))\n- **tables**: scan a lazy line without walking every open list level ([cbeb9c0](https://github.com/rvben/rumdl/commit/cbeb9c06d31e58b579cbf84eaefa10c2ec620177))\n\n### Security\n\n- Update `url` to 2.5.9 to address [RUSTSEC-2026-0592](https://rustsec.org/advisories/RUSTSEC-2026-0592).\n\n\n## Downloads\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [rumdl-v0.3.6-x86_64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-unknown-linux-gnu.tar.gz) | Linux x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.3.6-x86_64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-unknown-linux-musl.tar.gz) | Linux x86_64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.3.6-aarch64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-aarch64-unknown-linux-gnu.tar.gz) | Linux ARM64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.3.6-aarch64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-aarch64-unknown-linux-musl.tar.gz) | Linux ARM64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-aarch64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.3.6-x86_64-apple-darwin.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-apple-darwin.tar.gz) | macOS x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-apple-darwin.tar.gz.sha256) |\n| [rumdl-v0.3.6-aarch64-apple-darwin.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-aarch64-apple-darwin.tar.gz) | macOS ARM64 (Apple Silicon) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-aarch64-apple-darwin.tar.gz.sha256) |\n| [rumdl-v0.3.6-x86_64-pc-windows-msvc.zip](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-pc-windows-msvc.zip) | Windows x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.3.6/rumdl-v0.3.6-x86_64-pc-windows-msvc.zip.sha256) |\n\n## Installation\n\n### Using uv (Recommended)\n```bash\nuv tool install rumdl\n```\n\n### Using pip\n```bash\npip install rumdl\n```\n\n### Using pipx\n```bash\npipx install rumdl\n```\n\n### Direct Download\nDownload the appropriate binary for your platform from the table above, extract it, and add it to your PATH.\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
