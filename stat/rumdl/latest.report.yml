: separate lists from standalone code fences ([e335c58](https://github.com/rvben/rumdl/commit/e335c588257c604e67eb81313621ff275d4438e2))\n- **mdx**: avoid parser panic on malformed Setext headings ([5e4a387](https://github.com/rvben/rumdl/commit/5e4a387e7360f6f3f8bd3de4403276da30d5fc80))\n- preserve markdown containing merge conflicts ([8aabd3d](https://github.com/rvben/rumdl/commit/8aabd3d00cb628ae9bbdcce623daa27396c3b3ef))\n- **deps**: remove unmaintained paste and atomic-polyfill ([e2ab5cb](https://github.com/rvben/rumdl/commit/e2ab5cb9f05023b865cca1560e6d6df45a62313a))\n\n\n## Downloads\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [rumdl-v0.2.69-x86_64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-x86_64-unknown-linux-gnu.tar.gz) | Linux x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.69-x86_64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-x86_64-unknown-linux-musl.tar.gz) | Linux x86_64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-x86_64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.2.69-aarch64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-aarch64-unknown-linux-gnu.tar.gz) | Linux ARM64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.69-aarch64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-aarch64-unknown-linux-musl.tar.gz) | Linux ARM64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-aarch64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.2.69-x86_64-apple-darwin.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-x86_64-appl