,"digest":"sha256:d036588bd9027b7bf2a57e9fcb476ab95880f078d9b0a622869f397fb9030088","download_count":75,"created_at":"2026-10-22T16:17:35Z","updated_at":"2026-10-22T16:17:36Z"},{"id":666389255,"node_id":"RA_kwDOAMayZs4nuEsH","name":"git-lfs-windows-amd64-v3.8.1.zip","label":"Windows AMD64","uploader":{"login":"chrisd8088","id":28857117,"node_id":"MDQ6VXNlcjI4ODU3MTE3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"application/zip","state":"uploaded","size":5870805,"digest":"sha256:5bb771c12b3dacc535e912d0270a010c209d4da2e63819c5918e3547c2defed9","download_count":3340,"created_at":"2026-10-22T16:17:37Z","updated_at":"2026-10-22T16:17:38Z"},{"id":666389340,"node_id":"RA_kwDOAMayZs4nuEtc","name":"git-lfs-windows-arm64-v3.8.1.zip","label":"Windows ARM64","uploader":{"login":"chrisd8088","id":28857117,"node_id":"MDQ6VXNlcjI4ODU3MTE3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"application/zip","state":"uploaded","size":5270378,"digest":"sha256:7e70990e339efab3e793affb919355b548c9a41c5b6bb52d90267bcb84ba4784","download_count":94,"created_at":"2026-10-22T16:17:39Z","updated_at":"2026-10-22T16:17:40Z"},{"id":666389421,"node_id":"RA_kwDOAMayZs4nuEut","name":"git-lfs-windows-v3.8.1.exe","label":"Windows Installer","uploader":{"login":"chrisd8088","id":28857117,"node_id":"MDQ6VXNlcjI4ODU3MTE3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"application/octet-stream","state":"uploaded","size":13262232,"digest":"sha256:7ac0422468f9cce06a7916156ed284f223527ed40e6d9ccf5fc0e89ad05b389c","download_count":7477,"created_at":"2026-10-22T16:17:40Z","updated_at":"2026-10-22T16:17:42Z"},{"id":666527186,"node_id":"RA_kwDOAMayZs4numXS","name":"hashes.asc","label":"Signed Hashes","uploader":{"login":"chrisd8088","id":28857117,"node_id":"MDQ6VXNlcjI4ODU3MTE3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"text/plain","state":"uploaded","size":23233,"digest":"sha256:d55d49188f51ff23d8ed04fb0fb7e08b0f14c8466d6c87215cde85c9674c73f8","download_count":52,"created_at":"2026-10-22T17:14:16Z","updated_at":"2026-10-22T17:14:16Z"},{"id":666527252,"node_id":"RA_kwDOAMayZs4numYU","name":"sha256sums.asc","label":"Signed SHA-256 Hashes","uploader":{"login":"chrisd8088","id":28857117,"node_id":"MDQ6VXNlcjI4ODU3MTE3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"text/plain","state":"uploaded","size":2621,"digest":"sha256:b648ddbf8cd768e4d9dc9db4ac7c15dd3830d7ef00cba86c614a5f9b5ba9b9f4","download_count":7177,"created_at":"2026-10-22T17:14:17Z","updated_at":"2026-10-22T17:14:17Z"}],"body":"This release introduces security fixes for four vulnerabilities that\r\nhave been assigned the identifiers CVE-2026-69260, CVE-2026-69261,\r\nCVE-2026-105802, and CVE-2026-105803.  These vulnerabilities apply\r\nto all of the operating systems supported by Git LFS.\r\n\r\n* CVE-2026-69260:\r\n\r\n  When Git LFS sends a remote command via SSH, it does not properly\r\n  format the argument it derives from the remote SSH URL.  Servers\r\n  which pass remote commands to a shell without sanitizing their\r\n  arguments may be induced to execute malicious programs.\r\n\r\n  Git LFS has resolved this problem by fully quoting the arguments\r\n  of the remote commands it sends via SSH.\r\n\r\n* CVE-2026-69261:\r\n\r\n  After receiving an HTTP redirection, Git LFS may forward Cookie\r\n  headers to a host other than the one for which they were intended.\r\n  If credentials or other secrets are stored in HTTP cookies, they\r\n  may be leaked to a potentially malicious host.\r\n\r\n  Git LFS has resolved this issue by only sending Cookie headers\r\n  to the hosts for which they were intended.\r\n\r\n* CVE-2026-105802:\r\n\r\n  When operating in a malicious repository which contains a submodule,\r\n  Git LFS may execute an arbitrary program after incorrectly parsing\r\n  line feed (LF) characters in the submodule's URL.\r\n\r\n  Git LFS has resolved this issue by always using an unambiguous\r\n  format to read and parse Git configuration options.\r\n\r\n* CVE-2026-105803:\r\n\r\n  When operating in a malicious repository, Git LFS may execute an\r\n  arbitrary program as a custom transfer adapter after incorrectly\r\n  filtering the options defined in an `.lfsconfig` file.\r\n\r\n  Git LFS has resolved this issue by restricting the configuration\r\n  of custom object transfer commands to local sources.\r\n\r\nAs well as the changes listed above, Git LFS has resolved a problem\r\nwith its encoding of the HTTPS URL it checks when a remote SSH host\r\neither does not support Git LFS commands or does not return an\r\nHTTP URL in response to an authentication request.\r\n\r\nWe would like to extend a special thanks to the following security\r\nresearchers for first reporting these issues to us in a responsible\r\nmanner:\r\n\r\n* @dungNHVhust (CVE-2026-69260)\r\n* @izzysec (CVE-2026-105802)\r\n* @jthack (CVE-2026-105803)\r\n* @SnailSploit (CVE-2026-69261)\r\n\r\nIn addition, we would like to thank the following researchers who\r\nalso reported these issues to us responsibly:\r\n\r\n* Idan Bachar and Niv Levy (CVE-2026-105803)\r\n* @bughunter0xff (CVE-2026-105802)\r\n* @castilho101 (CVE-2026-105803)\r\n* @douglasday (CVE-2026-105803)\r\n* @evanconnelly (CVE-2026-105803)\r\n* @Hexix23 (CVE-2026-105803)\r\n* @izzysec (CVE-2026-69260)\r\n* Yonghwa Lee (Theori) (CVE-2026-105803)\r\n* Rojan Rijal (Ophion Security/Anthropic) (CVE-2026-105803)\r\n* @SAYUTIM (CVE-2026-69260)\r\n\r\n### Bugs\r\n\r\n* Parse configuration options unambiguously (@chrisd8088, @aniketgup)\r\n* Use strict matching for custom transfer configuration options (@chrisd8088, @aniketgup)\r\n* Limit protected HTTP headers to same origin (@aniketgup, @chrisd8088)\r\n* Fix shell quoting of paths with SSH (@bk2204, @chrisd8088)\r\n\r\n### Misc\r\n\r\n* Update some Linux workflow jobs for Ubuntu 26.04 runners (@chrisd8088)\r\n* Update code signing and notarization of macOS release assets (@chrisd8088)\r\n* Fix Linux release package build and upload issues (@chrisd8088)\r\n\r\n## Packages\r\n\r\nUp to date packages are available on [PackageCloud](https://packagecloud.io/github/git-lfs) and [Homebrew](http://brew.sh/).\r\n\r\n[RPM RHEL 8/Rocky Linux 8](https://packagecloud.io/github/git-lfs/packages/el/8/git-lfs-3.8.1-1.el8.x86_64.rpm/download)\r\n[RPM RHEL 9/Rocky Linux 9](https://packagecloud.io/github/git-lfs/packages/el/9/git-lfs-3.8.1-1.el9.x86_64.rpm/download)\r\n[RPM RHEL 10/Rocky Linux 10](https://packagecloud.io/github/git-lfs/packages/el/10/git-lfs-3.8.1-1.el10.x86_64.rpm/download)\r\n[Debian 11 (AMD64)](https://packagecloud.io/github/git-lfs/packages/debian/bullseye/git-lfs_3.8.1_amd64.deb/download)\r\n[Debian 11 (ARM64)](https://packagecloud.io/github/git-lfs/packages/debian/bullseye/git-lfs_3.8.1_arm64.deb/download)\r\n[Debian 12 (AMD64)](https://packagecloud.io/github/git-lfs/packages/debian/bookworm/git-lfs_3.8.1_amd64.deb/download)\r\n[Debian 12 (ARM64)](https://packagecloud.io/github/git-lfs/packages/debian/bookworm/git-lfs_3.8.1_arm64.deb/download)\r\n[Debian 13 (AMD64)](https://packagecloud.io/github/git-lfs/packages/debian/trixie/git-lfs_3.8.1_amd64.deb/download)\r\n[Debian 13 (ARM64)](https://packagecloud.io/github/git-lfs/packages/debian/trixie/git-lfs_3.8.1_arm64.deb/download)\r\n\r\n## SHA-256 hashes:\r\n**git-lfs-darwin-amd64-v3.8.1.zip**\r\n4292b3518e717e53c20a6c2c0696e2069a21e97500ad14b80b06bd52de8f3b72\r\n\r\n**git-lfs-darwin-arm64-v3.8.1.zip**\r\n0ba10e897e0496412cd86eacaed4ed554c97ddc29bc5c709d28faa5eaaa2222c\r\n\r\n**git-lfs-freebsd-386-v3.8.1.tar.gz**\r\n76398b95eff2281e7d3088f8677ec548d13d6b08f553f2af573506b84767264c\r\n\r\n**git-lfs-freebsd-amd64-v3.8.1.tar.gz**\r\nacbd1d6f93d9578be358ce12a9c699ffb6b2e082f744c7bb8ec033e706375ded\r\n\r\n**git-lfs-linux-386-v3.8.1.tar.gz**\r\n42d862b5cad499820fde9ea6c3080c73327f679f19