_count":0,"created_at":"2026-09-29T22:32:29Z","updated_at":"2026-09-29T22:32:44Z"},{"id":599384747,"node_id":"RA_kwDORwA07s4jueKr","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":303320362,"digest":"sha256:de99e120fd9d0dc6b1899e97cbfaca70c2c251892a15bc03842e1c006c806bc7","download_count":4,"created_at":"2026-09-29T22:32:29Z","updated_at":"2026-09-29T22:32:43Z"},{"id":599384749,"node_id":"RA_kwDORwA07s4jueKt","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":280759336,"digest":"sha256:3114109dcfd8d40680746f1db898b8cd521e873cd82a29d1a667fea9d27ba452","download_count":72,"created_at":"2026-09-29T22:32:29Z","updated_at":"2026-09-29T22:32:44Z"},{"id":599384739,"node_id":"RA_kwDORwA07s4jueKj","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:5a1d43039a8bf441a4bfbb4a423e663893e6f090d734bdccab06dbf4e7f324dc","download_count":16,"created_at":"2026-09-29T22:32:29Z","updated_at":"2026-09-29T22:32:29Z"}],"body":"## Highlights\n\n- **Merger arbitrage in `MA`.** Pending deals with live arbitrage spreads, annualized returns and expected close, plus an M&A tab in Ticker Research. (#1174, #1215)\n- **Social attention in `BUZZ`.** Daily X posts, Reddit mentions and Wikipedia page views per ticker, also as equity screener columns. (#1169, #1170)\n- **Brokers you sign in to.** IBKR and Robinhood connect from `Add Broker` by signing in, and your Gloom account holds the connection, so every device and your agents share it. (#1129)\n- **Bloomberg names work.** `IMAP`, `CF`, `NSE`, `BLP`, `HRA`, `GLCO` and other Bloomberg mnemonics open the matching function. (#1189)\n- **Generic futures and credit boards.** Chart and quote `CL1`, `TY2` or `VX1` with a switchable roll rule, view a futures curve as of a past date in `CTM`, and browse index and sovereign CDS in `CDX` and `SOVR`. (#1205, #1206, #1207, #1222)\n- **Deeper fundamentals.** `FA` adds ratio tabs for profitability, leverage, liquidity, efficiency and valuation, `SEG` splits quarterly revenue by product, segment and region, and the screener adds returns, beta, P/B, EV/EBITDA, ROE, revisions, upside and IV. (#1211, #1115, #1213)\n\n## Also in this release\n\n- `IPO` is built in and now covers the US, Hong Kong, India, Japan, Australia, London, Euronext, SIX, Deutsche B\u00f6rse, Shanghai and Shenzhen. Market Heatmap, Market Halts and Fear & Greed are built back in. (#1225, #1183, #1216)\n- Earnings and news: `ERN` shows the market's earnings days and each company's report history, `MOST` adds pre-market, after-hours and gap lists, and news shows publishers and wire times, with `TOP` as a ranked 20. (#1200, #1224, #1223)\n- Boards: option chains show IV, volume and open interest by default, the Treasury curve adds 2s10s, 3m10y and 5s30s, the rate path leads with the moves priced, and the futures board adds livestock, soy crush, KC wheat and aluminum. (#1188, #1185, #1190, #1199)\n- Official plugins update themselves, and typing an official plugin's code in the command bar offers to install it. (#1163, #1212)\n- A new Halo app icon, a macOS Dock icon that follows your theme, and White as the default theme. (#1105)\n- The app now reports crashes and counts which functions get opened, without tickers, queries or portfolios. Turn either off with `gloomberb config set telemetry.crashReports false` or `telemetry.usage false`, or set `GLOOMBERB_NO_TELEMETRY=1`. (#1147, #1181)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.2...v0.15.3)\n"}
