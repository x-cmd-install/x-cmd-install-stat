:0,"created_at":"2026-09-30T11:27:30Z","updated_at":"2026-09-30T11:27:43Z"},{"id":600760546,"node_id":"RA_kwDORwA07s4jzuDi","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":303326556,"digest":"sha256:5759debdc3638268da0335d0c18ef70f55a4d1a1ff70002ee5a909fc34832506","download_count":10,"created_at":"2026-09-30T11:27:30Z","updated_at":"2026-09-30T11:27:43Z"},{"id":600760533,"node_id":"RA_kwDORwA07s4jzuDV","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":280773386,"digest":"sha256:a4e03d9f8679929b4ef38d078a049ae668bd6b0870089a4ac9464088cd808f25","download_count":67,"created_at":"2026-09-30T11:27:29Z","updated_at":"2026-09-30T11:27:42Z"},{"id":600760532,"node_id":"RA_kwDORwA07s4jzuDU","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:2840f1931ad0f2798e6d1b04748dfb84e837d6c970967da0e69b42b40a3bf49a","download_count":51,"created_at":"2026-09-30T11:27:29Z","updated_at":"2026-09-30T11:27:30Z"}],"body":"## Highlights\n\n- **Plugins get their packages on every install.** BYOK AI and other plugins with dependencies now load in the desktop app and the standalone terminal without Bun installed, and a plugin that was installed without its packages gets them on the next launch. (#1230)\n- **Plugins on Windows without Developer Mode.** Installs from source or npm on Windows link external plugins with a junction, so they load without admin rights. (#1227)\n- **A fuller `DES`.** The Overview tab adds float, next earnings, ex-dividend date, beta, short float, institutional and insider ownership, and a Profile grid with employees, fiscal year end, SIC and website; each figure opens the function that explains it. (#1229)\n\n## Also in this release\n\n- Global installs that keep one flat `node_modules` no longer break every plugin on React. (#1231)\n- `CORR` uses a diverging heat scale and a quiet diagonal. (#1228)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.3...v0.15.4)\n"}
