1-12T23:18:38Z"},{"id":741457282,"node_id":"RA_kwDORwA07s4sMb2C","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":200,"digest":"sha256:f752157b5bbbba50fd10b531dc2f738745ddfb81cbf869383a17ba4d5dff7db5","download_count":31,"created_at":"2026-11-12T23:18:38Z","updated_at":"2026-11-12T23:18:38Z"},{"id":741457295,"node_id":"RA_kwDORwA07s4sMb2P","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:ff1dfccfcf22252ddea0ef269fe9e7c43e3c7e6bb1fcb17e753dc27fb6bb37b9","download_count":3,"created_at":"2026-11-12T23:18:38Z","updated_at":"2026-11-12T23:18:38Z"}],"body":"## Highlights\n\n- **The terminal app draws and moves cleanly.** The command bar no longer greys the panes beside it, chat channel lists scroll and keep the selection in view, Financials fits more periods with no dead row under the scrollbar, window magnets catch only when you pause, and charts no longer draw over windows and menus. (#2678)\n- **Interactive Brokers shows when your sign-in ends.** The Brokers pane shows the end date all week, `c` renews it for a full seven days, and a sign-in ended by another AI app on the account says so instead of an error code. (#2683)\n- **Drag a table header to move its column.** The order is remembered per pane. (#2684)\n- **Screener checks read tickers the way quote does.** `fn EQS --check 700.HK` or `5:HKEX` finds 0700:HKEX and 0005:HKEX. (#2694)\n- **Funds get no P/E.** ETFs and other funds no longer show a P/E or PEG in `valuation` and the screener. (#2686)\n\nAlso: the screener keeps your rows and scroll position across its auto refresh, and an idle tab does less work on busy quotes (#2689).\n"}
