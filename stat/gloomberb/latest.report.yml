1eb","download_count":0,"created_at":"2026-10-02T18:51:23Z","updated_at":"2026-10-02T18:51:41Z"},{"id":606261881,"node_id":"RA_kwDORwA07s4kItJ5","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":303572128,"digest":"sha256:86cb4d46dfaee7291b790fb0fd2d1a43765384a8673122aec5932ba9803e8dae","download_count":9,"created_at":"2026-10-02T18:51:23Z","updated_at":"2026-10-02T18:51:40Z"},{"id":606261883,"node_id":"RA_kwDORwA07s4kItJ7","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":281028408,"digest":"sha256:7d6ce12b032b237acf9d8cbb7826d30dcca03e7df3d0d6bd41b6f3fe7a8b153e","download_count":47,"created_at":"2026-10-02T18:51:23Z","updated_at":"2026-10-02T18:51:39Z"},{"id":606261876,"node_id":"RA_kwDORwA07s4kItJ0","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:8f0bab2e733866004b17c6afaf9c54106981e90ea9630ce410455466298fd820","download_count":36,"created_at":"2026-10-02T18:51:23Z","updated_at":"2026-10-02T18:51:23Z"}],"body":"## Highlights\n\n- **Alerts reach you when the app is closed.** A price alert that triggers while no Gloom app is open now arrives by email with the symbol, the price and whether it is real-time or delayed. Re-arming an alert at the same target emails again. (#1264)\n- **Forms open in a central modal.** New watchlist, New portfolio, Set position, Add alert, plugin wizards and every confirm open in a centered dialog instead of the command bar, with `Tab` between fields and `Ctrl+S` or `Cmd+S` to submit. Broker profiles are managed in the Brokers pane. (#1226)\n- **Pick companies on day one.** A new account with an empty or untouched starter watchlist is asked \"Which companies do you follow?\", with search and a grid of company cards. (#1247)\n- **`RISK`, `EXEC` and `EK` are Pro in the terminal.** Free accounts see an upgrade wall; the free per-company pages on gloom.sh stay open. (#1272)\n- **Market data comes through Gloom Cloud.** Quotes, history, fundamentals, research, movers and heatmaps load from Gloom Cloud instead of provider code on your device. Signed-out delayed access still works. (#1274)\n\n## Also in this release\n\n- Linux installs with no `~/.gloomberb` use `~/.config/gloomberb`, `~/.local/share/gloomberb` and `~/.cache/gloomberb`. Existing installs and `GLOOMBERB_HOME` are unchanged. (#1278)\n- The news source column credits the publication that wrote the story. (#1277)\n- Install with `brew install --cask gloomberb`. (#1275)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.6...v0.15.7)\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
