","download_count":2,"created_at":"2026-10-09T00:50:05Z","updated_at":"2026-10-09T00:50:16Z"},{"id":623444540,"node_id":"RA_kwDORwA07s4lKQI8","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":305341473,"digest":"sha256:70c5a8b67c89548d7eb0a71ea5c6bdccc25353262cadcf3836666ec970f18b2b","download_count":5,"created_at":"2026-10-09T00:50:05Z","updated_at":"2026-10-09T00:50:18Z"},{"id":623444531,"node_id":"RA_kwDORwA07s4lKQIz","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":282752899,"digest":"sha256:036fb62773446ebb9035f15617d78fee6199725868826fc50bafe5a85d13aa77","download_count":59,"created_at":"2026-10-09T00:50:05Z","updated_at":"2026-10-09T00:50:16Z"},{"id":623444532,"node_id":"RA_kwDORwA07s4lKQI0","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:d9e9efed04190f8faeae55de4ed96d5048cd7bbd181d252b789edc85c7f295a2","download_count":30,"created_at":"2026-10-09T00:50:05Z","updated_at":"2026-10-09T00:50:05Z"}],"body":"## Highlights\n\n- **A heat map that moves.** `HM` groups the 500 largest US stocks by sector and industry, sizes them by the square root of market cap (plain market cap is one click away) and recolours and glides with live prices. (#1405)\n![HM](https://gloom.sh/screenshots/fn/HM.png)\n- **Restart on your terms.** The desktop app downloads an update in the background and shows a Restart button instead of restarting by itself. (#1400)\n- **`PORT` risk on real accounts.** Risk, Factors, Correlation and Stress estimate on the holdings that qualify and say how much of the account they cover, instead of dashes when one holding is foreign or unquoted. (#1402)\n- **`MEMB` ETF members.** Members, movers and index changes for IVV, IJH, IJR, IWM and IWB. (#1391)\n![MEMB](https://gloom.sh/screenshots/fn/MEMB.png)\n- **`FXC` with 45 currencies.** Pick a set or filter the list, with country flags and a tint for each cross's move. (#1399, #1401, #1403)\n- **The right listing.** `NET:` in the command bar lists a symbol's venues, busiest first, and a bare symbol added to a list takes the busiest. (#1396)\n\n## Also in this release\n\n- Single-ticker panes can link to another ticker pane. (#1383)\n- The desktop window reopens where you left it, and a fullscreen pane's corner leaves fullscreen instead of closing the pane. (#1384)\n- Search badges coins and funds and hides mutual funds that cannot be quoted; mutual fund NAVs stay current until the next publication window and `DES` hides Options and 13F for them. (#1389, #1393, #1395)\n- Market movers use direct average volumes. (#1392, #1394)\n- Equity perpetual rows stay on the chosen listing, and `PEB` dates EPS by the company's report when no publication date exists. (#1397, #1404)\n- Installing IBKR Gateway installs Interactive Brokers first, so it loads in the same session. (#1398)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.16.0...v0.16.1)\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
