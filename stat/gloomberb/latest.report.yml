04T08:00:37Z","updated_at":"2026-11-04T08:00:37Z"},{"id":708730855,"node_id":"RA_kwDORwA07s4qPl_n","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":199,"digest":"sha256:a3d998198efddab3a15ba4aa3768f1a36b350e2a2edd2e66b8cd98ac615a4e8d","download_count":164,"created_at":"2026-11-04T08:00:37Z","updated_at":"2026-11-04T08:00:37Z"},{"id":708730829,"node_id":"RA_kwDORwA07s4qPl_N","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:5771d950fa1dc1c806210962935f9b2cd36bf7e2a26776156a4acaa529138cb3","download_count":3,"created_at":"2026-11-04T08:00:37Z","updated_at":"2026-11-04T08:00:37Z"}],"body":"## Highlights\n\n- **The Windows app stays responsive.** In v0.20.0 the Windows app could freeze for several seconds while an update unpacked or a menu was open, and quitting with a menu open could hang. Menus, window messages and update unpacking now run off the app's main thread. (#2449)\n- **The first launch after upgrading draws right away.** On a setup from before the official plugins moved to their own repositories, the app no longer shows a blank screen while it reinstalls them. It draws in under a second, each plugin's panes appear in place once it is back, and a stalled download gives up with a plain message and tries again next launch. (#2468)\n- **Hong Kong spot crypto ETFs.** `correlation` works for HKEX-listed ETFs such as `3046:HKEX`, their fund facts show in the ETF pane, and the DeFi list adds fees and revenue. (#2470)\n\n## Also in this release\n\n- `CRYP` marks bond tokens such as Bond USD0 instead of calling them a depeg, and sorts by distance from the peg with `--sort offpeg`. (#2469)\n- `RISK` shows a 10-K that lists no risk factors as one line, and signed out it points to the free risk-factors page. (#2471, #2466)\n- `GIP` dates its bars by the quote, and `QR` leads with the best bid and offer. (#2466)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.0...v0.20.1)\n"}
