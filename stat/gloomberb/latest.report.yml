11-02T21:08:43Z","updated_at":"2026-11-02T21:08:44Z"}],"body":"## Highlights\n\n- **Plugins load again in the standalone terminal.** Since v0.19.3 the terminal installed by the script, the AUR package or a self-update, and the `gloom` command inside the desktop app, failed to load most plugins with \"Export named 'useCallback' not found\". (#2447)\n- **Grades and classic scores in `EQS`.** Screen on Value, Growth, Profitability, Momentum and Revisions grades ranked within each sector, a Top to Bottom composite, Piotroski F, Altman Z, Graham and Magic Formula, start from eight ready screens, and save the matches to a watchlist. (#2434, #2442)\n- **One window per screen.** The desktop app opens more windows, one full window per display, and puts each back on its screen when you relaunch. (#2415)\n- **Lighter live charts.** A live tick costs less work, and moving the pointer over a chart redraws only the crosshair. (#2433, #2439)\n\n## Also in this release\n\n- Pasted grids keep every column, a dead ticker asks which listing you mean, and commands take a ticker first. (#2440)\n- The last close stays the headline when a print lands on a weekend or holiday. (#2437)\n- The VIX futures curve opens from VIX words and shows spot VIX and the front premium. (#2438)\n- Rates: retired symbols, curve spreads, DV01 and 32nds read right, also at narrow widths. (#2435)\n- `TBO` company tables give names the spare width and show every listing as a ticker chip. (#2444)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.19.5...v0.19.6)\n"}
