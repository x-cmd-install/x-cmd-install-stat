oad_count":1,"created_at":"2026-10-07T10:04:44Z","updated_at":"2026-10-07T10:04:59Z"},{"id":618295560,"node_id":"RA_kwDORwA07s4k2nEI","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":305138826,"digest":"sha256:daceed23113dbaa7dc49e3f262d3161fe305872477497285dae24866facf7406","download_count":9,"created_at":"2026-10-07T10:04:44Z","updated_at":"2026-10-07T10:04:59Z"},{"id":618295556,"node_id":"RA_kwDORwA07s4k2nEE","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":282565803,"digest":"sha256:55f32129c9707e567f8146cd765d8d1e3023a22afaac507245e7f4ad6a453af4","download_count":105,"created_at":"2026-10-07T10:04:44Z","updated_at":"2026-10-07T10:04:59Z"},{"id":618295562,"node_id":"RA_kwDORwA07s4k2nEK","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:b5ead79443e7bdc0f43e404f27eb26888bc2a81387788b377503080f65c81a2f","download_count":49,"created_at":"2026-10-07T10:04:44Z","updated_at":"2026-10-07T10:04:44Z"}],"body":"## Highlights\n\n- **`SPLC` supply chain.** See who a company sells to and buys from, with each link's share of revenue, as a table or a flow, and follow links several hops out. `RIPL` lists the customers and suppliers of your holdings that report soon. (#1298, #1304, #1313, #1322, #1326)\n![SPLC](https://gloom.sh/screenshots/fn/SPLC.png)\n- **`GPU` rental prices.** GPU rental prices by model and provider, as each provider lists or declares them, with history, price changes and related stocks. (#1299, #1312, #1342)\n![GPU](https://gloom.sh/screenshots/fn/GPU.png)\n- **`CPI` consumer prices.** US inflation by component with weights, each component's contribution to the headline and the next release date. `MDAY` shows how a ticker moves on CPI, jobs and FOMC days. (#1297, #1332)\n![CPI](https://gloom.sh/screenshots/fn/CPI.png)\n- **Images in chat.** Paste, drop or attach up to four images in the desktop and web apps; the terminal opens them in the browser. Your own message also shows as sent right away. (#1380, #1376)\n- **Ask Gloom knows your portfolios.** It lists what a portfolio or watchlist holds, uses your own portfolio ids instead of guessing, and Undo works. `PF` prints the same holdings. (#1381, #1388)\n\n## Also in this release\n\n- Valuation: `RDCF` shows the growth a price assumes, `PEB` the price against multiples of EPS, and `SIW` the crowded shorts in your lists. (#1302, #1330, #1329)\n- New panes: `TRIAL` clinical trials, `CLTR` SEC comment letters, `FDA` drug and device reports and recalls, and `RETURN` returns by interval. (#1349, #1354, #1357, #1363)\n- News and search: filter, mute and pop out articles, an `FH` feed of the latest news, article and filing lookup, asset class filters and suggested recents in the command bar. (#1352, #1356, #1358, #1360, #1362)\n- Lists: `THEM` baskets are a tab in `BI`, the portfolio's list is a `HM` tab, `d` deletes the selected ticker, and the M&A pane has a Distress tab. (#1379, #1371, #1373, #1390)\n- Chat: an unread inbox, back navigation in a narrow pane, selected text stays selected, and double Esc closes it. (#1364, #1377, #1368)\n- Fixes: a bad cloud socket URL no longer crashes the web terminal, desktop timeouts name the request that stalled, and NSE and BSE keep their closes through holidays. (#1375, #1369, #1300)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.8...v0.16.0)\n\n\n"}
