te":"uploaded","size":293067151,"digest":"sha256:2fba528b061623dc8ecf6c8c519c08d6a2618d8341b2aa09b32b1c1b555117d6","download_count":107,"created_at":"2026-10-25T14:36:49Z","updated_at":"2026-10-25T14:37:07Z"},{"id":675272342,"node_id":"RA_kwDORwA07s4oP9aW","name":"stable-win-x64-GloomSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":293067151,"digest":"sha256:2fba528b061623dc8ecf6c8c519c08d6a2618d8341b2aa09b32b1c1b555117d6","download_count":667,"created_at":"2026-10-25T14:36:49Z","updated_at":"2026-10-25T14:37:08Z"},{"id":675272351,"node_id":"RA_kwDORwA07s4oP9af","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:d65d4c34fc5c9d0cd4c50965a644348c5419b8df9167f54a9121d563036f3dce","download_count":129,"created_at":"2026-10-25T14:36:49Z","updated_at":"2026-10-25T14:36:49Z"}],"body":"## Highlights\n\n- **A live scanner.** `SCAN` watches intraday conditions you set across US stocks, an index, a sector or a watchlist, and can alert you on a new match. (#2221)\n![SCAN](https://gloom.sh/screenshots/fn/SCAN.png)\n- **BTC and ETH options.** `options BTC-USD`, `OPX` and `OVDV` now cover bitcoin and ether options, with the DVOL volatility index. (#2129)\n- **Valuation and technical alerts.** `ALRT` and `gloom alerts add` can fire on P/E, P/S, RSI, moving-average crosses and a close against a moving average.\n- **Daily valuation charts.** `GE AAPL` charts P/E, EV/EBITDA and other multiples day by day, with average and standard deviation guides.\n- **The desktop app is now called Gloom.** Existing macOS and Windows installs move over on their own when they update. (#2226)\n\n## Also in this release\n\n- `OVME` and `YAS` show their full labels and values again instead of only the first letters. (#2234)\n- `MEMB` has a Breadth tab: advancers and decliners, the share above the 20, 50 and 200-day averages, and new highs and lows.\n- Chat turns a function written in backticks into a chip that runs it. (#2216)\n- Chart formulas work across currencies and per tonne, with an axis per unit. (#2233)\n- Futures read closed from the Friday close to the Sunday open, and `MEMB`, `PERP` and `THEM` say live only when they are. (#2231, #2222)\n- Quotes and search stop and say so on a hung connection, and switching accounts keeps each cloud workspace separate. (#2211, #2243)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.18.4...v0.18.5)\n\n"}
