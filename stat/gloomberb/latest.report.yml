","download_count":0,"created_at":"2026-09-19T19:05:56Z","updated_at":"2026-09-19T19:06:09Z"},{"id":575320565,"node_id":"RA_kwDORwA07s4iSrH1","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":300457546,"digest":"sha256:fb1e09af63f3b8caef3ac829737f5794e255bfe53148c1f267bcc9ee09da5717","download_count":2,"created_at":"2026-09-19T19:05:56Z","updated_at":"2026-09-19T19:06:12Z"},{"id":575320557,"node_id":"RA_kwDORwA07s4iSrHt","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":278153033,"digest":"sha256:3e7c71c5953d054a54186708c8d59dcd86016052f643f444638de59a79892351","download_count":286,"created_at":"2026-09-19T19:05:55Z","updated_at":"2026-09-19T19:06:11Z"},{"id":575320551,"node_id":"RA_kwDORwA07s4iSrHn","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:95ca5e138612fd690a6ef8c68b7245f84778939ec8d96d5f9c9599a6d6e0140c","download_count":6,"created_at":"2026-09-19T19:05:55Z","updated_at":"2026-09-19T19:05:56Z"}],"body":"## Highlights\n\n- **Keybindings are yours.** Every global and pane key lives in one table you can rebind from the Help pane, the command bar, or `gloomberb config set keybindings.*`. Any command bar text can go on a chord, so `F5` can be `CN` and `Alt+1` can be `DES AAPL`. (#933, #934)\n- **A broken plugin no longer stops the app.** A plugin in `~/.gloomberb/plugins` with a reserved or duplicate id, or one whose `setup()` throws, used to take the whole launch down with a stack trace. It is now reported as failed in the Plugins pane, with the reason, and everything else starts. (#932)\n- **Move your data folder.** `GLOOMBERB_HOME` relocates the whole `~/.gloomberb` folder: config, database, plugins, and plugin cache. (#932)\n- **TV stops burning a core.** A player stranded by a reload kept decoding video and writing frames with no pane open anywhere. Both hosts now reap a stranded player at startup, and playback no longer decodes more than the pane can show. (#937)\n- **Analyst targets get a chart.** The pane's context moves into the status bar, arrows walk the rows again, and the space that frees up plots the consensus target rebuilt from the dated targets in the ratings history. (#939)\n\n## Keybindings\n\n- Core keys are configurable through a keybinding table, editable from Help, the command bar's bind row, and the CLI. `config.json` takes `keybindings.actions` (by action id, including `plugin:<shortcut id>`) and `keybindings.commands` (chord to command bar text). (#933)\n- Command chords need Ctrl, Cmd, Alt or a function key so they never fire mid-typing, and Control chords yield to a focused text field. (#933)\n- Ticker search stays on the backtick alone; rebind it if that key is awkward on your layout. (#934)\n\n## Panes and charts\n\n- Analyst consensus context moves to the status bar, with a target chart rebuilt from dated ratings history. (#939)\n- Jobs adds evergreen and contract shares, with `N specific` open roles on a roomy column. (#940)\n- The chat sidebar gets consistent sections, a foldable public channel list, and a drag handle to resize it. (#941)\n- Help renders its shortcut and function lists as real tables on the shared kit. (#938, #944)\n- Price-only charts adopt the source's real interval list, and Auto steps down when a range preset's interval is unsupported. (#935, #936)\n- Disclosure chevrons stay inside their cell and sit centred between the row edge and the label. (#942, #943)\n\n## Plugins, installs and updates\n\n- An external plugin that cannot register is marked failed with its reason instead of failing the launch; a built-in that cannot register still stops startup, because that is a bug in this repository. (#932)\n- `GLOOMBERB_HOME` moves the config, data directory, plugins, plugin cache and terminal media state together. A moved `config.json` that still names the old data directory is corrected on the first launch. (#932)\n- An install this process cannot write to, such as a Nix store path or a distro package, is reported as package managed: the header says to update through whatever installed Gloomberb rather than failing with a read-only filesystem error. (#932)\n- The Homebrew cask no longer passes the parameter Homebrew deprecated, so `brew cleanup` stops warning. (#932)\n\n## Terminal\n\n- A TV player stranded by a watch reload is reaped at startup from both the terminal host and the desktop process, and only when it has actually been orphaned, so a second window never stops the first one's playback. (#937)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.14.0...v0.14.1)\n"}
