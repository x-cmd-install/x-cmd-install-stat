1-12T05:31:15Z","updated_at":"2026-11-12T05:31:16Z"},{"id":738211362,"node_id":"RA_kwDORwA07s4sADYi","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":199,"digest":"sha256:e3cd4b4fc82d62a815689adb680420a32910e2609e356b23fad2100601915026","download_count":13,"created_at":"2026-11-12T05:31:15Z","updated_at":"2026-11-12T05:31:16Z"},{"id":738211363,"node_id":"RA_kwDORwA07s4sADYj","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:5c7f96191a59cb2076e109a3478521f8439ae8aa355fd0d561f726b495cf2133","download_count":1,"created_at":"2026-11-12T05:31:15Z","updated_at":"2026-11-12T05:31:16Z"}],"body":"## Highlights\n\n- **Hong Kong listings, valued and cited.** One enterprise value bridge everywhere, results read from the company's own announcements, half-year growth and TTM, Exchange Fund Bill yields and `movers hk`. (#2638, #2639, #2609)\n- **Every US ETF that holds a stock.** `MEMB` lists them by weight from their latest filings, each row saying what its holdings are as of, and looks through thematic ETFs to the stocks they hold. (#2614, #2602)\n- **Prices stay current through a dropped stream.** A cut quote stream gets the same grace as a clean close, so prices no longer flash stale while it reconnects. (#2645)\n- **First-run setup always lets you out.** It can be finished or skipped even when your profile can't be saved, and on Windows a save waits a moment for another program holding the file. (#2660)\n- **The desktop app rides out a lost connection.** Requests go through while its internal socket is down, and panes that failed reload when it answers again. (#2628)\n\n## Also in this release\n\n- The app stays signed in after a password change, and deleting the account from an old session asks for the password. (#2650, #2651)\n- Text from chat, shares and data sources draws without control characters. (#2647)\n- IV and skew alerts on BTC and ETH. (#2652)\n- Pence, cents and agorot prices convert. (#2649)\n- Tokyo listings: ETF bars in the right unit, P/E on the latest EPS, English names. (#2622, #2625)\n- `PF` rebalances by keyboard, with CASH and TOTAL rows. (#2659)\n- `VX` futures on `FUT`. (#2604)\n- The CLI's search waits for a venue's own site again. (#2605)\n- Chart value tags read at the value's own precision.\n- `MDAY` keeps each release day's actual, forecast and FOMC decision. (#2663)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.7...v0.20.8)\n"}
