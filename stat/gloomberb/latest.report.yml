":"2026-11-06T05:16:02Z"},{"id":716001808,"node_id":"RA_kwDORwA07s4qrVIQ","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":199,"digest":"sha256:34313811a2be47109327557cddcd58a998833f8c1c43c1143b8c228d57785179","download_count":8,"created_at":"2026-11-06T05:16:02Z","updated_at":"2026-11-06T05:16:02Z"},{"id":716001813,"node_id":"RA_kwDORwA07s4qrVIV","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:db6d6e7b42fb46c7415c5ebc47b12cb2565882731c303b44ba7217a69714dd93","download_count":1,"created_at":"2026-11-06T05:16:02Z","updated_at":"2026-11-06T05:16:02Z"}],"body":"## Highlights\n\n- **Pane title tickers line up on the Mac.** In the desktop app on the Mac and in Safari, the ticker in a pane's title sat below the title with its letters cut off. It now sits on the title's baseline. (#2491)\n- **Import positions from your broker's CSV.** If Gloom does not sync your broker (Fidelity, Schwab, Vanguard, E*TRADE, Merrill, 401(k) sites), import the positions file its site downloads, in the app or the CLI. (#2476)\n- **A company page with eleven tabs.** `DES` grouped its 28 tabs into eleven, each holding its related views as choices, so News and Thesis no longer hide behind the overflow menu. (#2472)\n- **Ask Gloom shows where each figure came from.** Every figure links to the data behind it, and follow-up questions appear as chips under the answer. (#2490, #2506)\n- **Hong Kong listings read correctly.** `ERN` shows a Hong Kong listing's past reports in their own period and currency, and `KPIS`, `TBOC`, `SEC` and the quote header find HK listings by code and company name. (#2516, #2513, #2518)\n\n## Also in this release\n\n- `RETURN` gets a Chart tab, one bar per interval. (#2497, #2499)\n- Mac shortcut labels use Apple's notation: `⇧⌘F`, `⌃S`, `⌥↩`. (#2489)\n- `PORT` adds a correlation matrix and past-selloff stress. (#2487)\n- Futures moves read against the settle across the CME reopen, and `history --back-adjust` joins contracts. (#2488)\n- A link can open a function: `term.gloom.sh/?fn=ERN&arg=NVDA`. (#2477)\n- First-run fixes: charts work under `NODE_ENV=production`, Home is no longer covered, and Enter leaves setup's holdings step. (#2514)\n- Sync pauses instead of merging against damaged history, and keeps another device's broker account. (#2480, #2484, #2504)\n- The desktop app never downloads the version it already runs. (#2483)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.1...v0.20.2)\n"}
