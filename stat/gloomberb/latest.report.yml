reated_at":"2026-10-09T23:29:37Z","updated_at":"2026-10-09T23:29:52Z"},{"id":626465092,"node_id":"RA_kwDORwA07s4lVxlE","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":306516935,"digest":"sha256:29da6708ec88e440528af7728931b819478b922a647371b606f62612a2d99ccb","download_count":4,"created_at":"2026-10-09T23:29:37Z","updated_at":"2026-10-09T23:29:52Z"},{"id":626465081,"node_id":"RA_kwDORwA07s4lVxk5","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":283901389,"digest":"sha256:eeedfb764b9bbab155c19583fa63f2dc55058884f7ad44a4b4d745f562e4a9d4","download_count":34,"created_at":"2026-10-09T23:29:37Z","updated_at":"2026-10-09T23:29:53Z"},{"id":626465086,"node_id":"RA_kwDORwA07s4lVxk-","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:1eb392064e2baf4e3568c3e5da0f30aac791bda3b9b015c630c18e50001c3aa4","download_count":13,"created_at":"2026-10-09T23:29:37Z","updated_at":"2026-10-09T23:29:38Z"}],"body":"## Highlights\n\n- **Smoother pane drags.** Panes follow the pointer without redrawing the layout, and a quick click no longer leaves the window following the pointer. (#1493, #1499, #1500)\n- **Broker portfolios show their equity.** `PF` leads with `Net Liq`, labels the positions' sum `Gross`, and adds `Cash` and `Lev`. The account is kept across restarts, a lapsed broker sign-in is named in the footer, and `KELLY` sizes from equity. (#1504)\n- **`MAP` as a world map.** Country names on the map, and a flight opens where flights show. (#1495, #1498, #1492)\n- **Holder values in the right currency.** `HDS` labels each holder value in its own currency and marks depositary-receipt share counts. (#1496)\n- **Members in other panes.** Open a theme's or fund's members in `RRG`, `CORR`, `SIW` or `RIPL`, or save them as a watchlist. (#1465)\n\n## Also in this release\n\n- Arrow keys scroll detail panes that left scrolling unset. (#1502)\n- `fn` and `fundamentals --csv` write flat rows with the displayed columns. (#1494)\n- The CLI rejects unknown options, and `history` says why bars are missing. (#1497)\n- US quotes stay available after the close until an after-hours trade prints. (#1501)\n- A zero enterprise value shows as missing, and trailing figures name the reporting currency. (#1489)\n- Thinly traded listings use Gloom Cloud's not-stale verdict. (#1490)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.16.2...v0.16.3)\n"}
