ated_at":"2026-11-08T21:36:59Z","updated_at":"2026-11-08T21:36:59Z"},{"id":725267275,"node_id":"RA_kwDORwA07s4rOrNL","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":198,"digest":"sha256:a3f837cbf30a0f95ef03521ccbf2bbe4e4e42abee232070fcc6a17421c65212e","download_count":145,"created_at":"2026-11-08T21:36:59Z","updated_at":"2026-11-08T21:36:59Z"},{"id":725267264,"node_id":"RA_kwDORwA07s4rOrNA","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:a315a2da9d32c79cdf418c22a490631ec3ec44f1b97fe8c447a9e5d3bd7e9af9","download_count":4,"created_at":"2026-11-08T21:36:59Z","updated_at":"2026-11-08T21:36:59Z"}],"body":"## Highlights\n\n- **Hong Kong quotes read right.** A counter that did not trade shows its move against the right session, HKEX's own five-digit codes like `00700.HK` and `03042.HK` work, and index moves name the session they compare with. (#2594)\n- **A portfolio opens in value order.** A value-sorted portfolio no longer paints alphabetically for a few seconds before it reorders, and a large one uses less memory. (#2598)\n- **Listings abroad say what they read.** Holders and supply chain for a Shanghai or Shenzhen line with nothing on record say which sources were read, instead of a bare `NO_DATA`. (#2593)\n- **India's special sessions.** The calendar knows NSE and BSE's Muhurat session, so its moves compare with the last regular close. (#2600)\n\n## Also in this release\n\n- `MEMB` says when a fund is not covered and points to its fund facts, and its Changes tab says why it is empty. (#2600)\n- A screenshot of a long list ends on its last whole row and says how many rows it shows. (#2600)\n- `portfolio show` totals the day's move. (#2594)\n- A new alert says when its level already holds, and the examples use levels that are not met yet.\n- The offline docs match the live docs. (#2599)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.6...v0.20.7)\n"}
