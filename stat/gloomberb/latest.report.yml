ad_count":0,"created_at":"2026-10-19T22:28:13Z","updated_at":"2026-10-19T22:28:29Z"},{"id":657608891,"node_id":"RA_kwDORwA07s4nMlC7","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":314077661,"digest":"sha256:b33c4b28970cfa9598ae5943257cc9c31b88eb692dc31e77ee0aded3756071eb","download_count":6,"created_at":"2026-10-19T22:28:13Z","updated_at":"2026-10-19T22:28:30Z"},{"id":657608885,"node_id":"RA_kwDORwA07s4nMlC1","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":291444472,"digest":"sha256:f445623eada3a3dc2ad2b23096c3f2b4d5a5db300cb226677a7dfcf9128d6e57","download_count":61,"created_at":"2026-10-19T22:28:13Z","updated_at":"2026-10-19T22:28:29Z"},{"id":657608892,"node_id":"RA_kwDORwA07s4nMlC8","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:5aba5f40e2dfc1afd43aaf43c1d993b9e9935396c4e2b36a26d854052b23f34e","download_count":21,"created_at":"2026-10-19T22:28:13Z","updated_at":"2026-10-19T22:28:13Z"}],"body":"## Highlights\n\n- **One design system.** Every pane and plugin now shares the same type sizes, spacing, colours, tables and reader column on the desktop and web, so a table or a heading looks the same wherever you open it. (#1825, #1946, #1959)\n- **Insider activity in one view.** `INS` with no ticker lists open-market buying or selling with the reasons as columns, and Enter opens that company's own `INS` with Trades and Insiders views. (#1909, #1929, #1939)\n- **Pin a moment across the tab.** Press `p` to pin the crosshair: every chart, news list and time and sales in the tab holds that moment, the arrows move it, and a shared chart link opens on it. (#1924, #1925, #1926)\n- **Portfolios can hold a hedge.** Short positions and futures valued by the contract, settled at the close and counted in exposure. (#1980)\n- **Stablecoins in `CRYP`.** Total supply stacked by coin over time, supply columns, the off-peg move and a `G` series. (#1967, #1966)\n- **Listen while you read.** The Calls pane plays an earnings call beside its transcript. (#1907)\n\n## Also in this release\n\n- Funds: `fn ETF` and `DES` show fee, NAV, premium or discount and net assets, and bond funds add SEC yield, tax-equivalent yield and the muni/Treasury ratio. (#1944, #1949, #1983)\n- Rates and credit: rank a yield move against history back to 1979, query `TRACE` by issuer or CUSIP, and single-name CDS adds 1W and 1M moves and a daily 5Y export. (#1914, #1899, #1989)\n- Banks after results: statements name their filing and the quarter released since, with deposits, uninsured share and CRE. (#1974, #1973)\n- New users land on what they want first in the command bar, Help and the economic calendar. (#1697)\n- Connect a broker without a code, and cancel a Pro trial from `ACM` after a clear warning. (#1894, #1942)\n- Search says it is busy instead of \"No matches\" when it could not answer. (#1955, #1957)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.17.6...v0.18.0)\n"}
