1f493f7126ff","download_count":0,"created_at":"2026-10-03T09:58:10Z","updated_at":"2026-10-03T09:58:21Z"},{"id":607572613,"node_id":"RA_kwDORwA07s4kNtKF","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":303653024,"digest":"sha256:8503e60f22e2d26d0691803640f77f9e0fc0123d0e439b67358850e4d78db363","download_count":9,"created_at":"2026-10-03T09:58:10Z","updated_at":"2026-10-03T09:58:19Z"},{"id":607572600,"node_id":"RA_kwDORwA07s4kNtJ4","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":281102242,"digest":"sha256:150ecd6a4c4d62fd84b5bdedcb9bf2737ee74eaaf5696ecee78b1d211b0522e9","download_count":1173,"created_at":"2026-10-03T09:58:10Z","updated_at":"2026-10-03T09:58:20Z"},{"id":607572605,"node_id":"RA_kwDORwA07s4kNtJ9","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:075ebae9ff1f616d37529361c2099c84995bb7931b9139c18cbd46b66bebe0f8","download_count":142,"created_at":"2026-10-03T09:58:10Z","updated_at":"2026-10-03T09:58:10Z"}],"body":"## Highlights\n\n- **Charts keep working after the close.** Intraday and 1D charts of US and non-US listings no longer go empty or fail once the market closes, or the next morning before the new session's first delayed bar arrives. (#1279, #1281, #1284)\n- **1D shows the latest session.** A 1D chart covers the listing's latest trading session in the venue's own time instead of a rolling 24 hours, and US listings get an `Extended hours` toggle for pre-market and after-hours bars. (#1279)\n- **Oil and gas inventories in `DOE`.** The EIA's weekly crude, product and gas storage numbers against their five-year ranges, charted over the year, with `NGS` opening the gas tab. (#1288)\n- **Onboarding in the listing's currency.** Positions added at first run take the listing's currency, with a Currency field to change it, and Avg cost clears after each add. (#1285)\n\n## Also in this release\n\n- Charts: a listing a few days old charts the range it has traded instead of a two-point line, and 30m on 3M charts the intraday history that exists instead of nothing. (#1284, #1287)\n- Deleting a watchlist also removes it from its tickers. (#1283)\n- ROE reads N/M when equity changes sign, instead of figures like 15,367%. (#1286)\n- Exchange suffixes like `TTALO.HEL` resolve to the listing. (#1285)\n- Section headings are set in bright, bold title case. (#1273, #1280)\n- A fullscreen pane no longer has the floating border drawn through it. (#1282)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.7...v0.15.8)\n"}
