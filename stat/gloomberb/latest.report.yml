ate with `GLOOMBERB_SESSION_TOKEN`.\n- The first browser visit opens as a six-pane workspace in the white theme.\n\n## Changes\n\n- Let headless callers authenticate with GLOOMBERB_SESSION_TOKEN #726\n- Open the browser first visit as a three-pane research workspace #729\n- fix: keep Windows smoke cleanup from failing releases #730\n- Open the browser first visit as a six-pane workspace in the white theme #731\n- Stop macOS installs from handing Intel Macs an arm64 build #732\n- Render pane screenshots from the routed provider #733\n- Publish an Intel macOS terminal build #734\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.13.2...v0.13.3)"}
