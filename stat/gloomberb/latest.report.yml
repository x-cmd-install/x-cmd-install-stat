d_count":0,"created_at":"2026-10-11T16:52:35Z","updated_at":"2026-10-11T16:52:52Z"},{"id":631274147,"node_id":"RA_kwDORwA07s4loHqj","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":307895463,"digest":"sha256:7c4e6bab0f74fa962bdf210569b787396aac008b9cc40115efe7de7b399e612b","download_count":5,"created_at":"2026-10-11T16:52:35Z","updated_at":"2026-10-11T16:52:50Z"},{"id":631274132,"node_id":"RA_kwDORwA07s4loHqU","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":285288011,"digest":"sha256:0ad5d9348ff1bb0d3b7e1cc28d9c1b86f14e8d78f9e04e32c480b377e7355b2a","download_count":31,"created_at":"2026-10-11T16:52:35Z","updated_at":"2026-10-11T16:52:54Z"},{"id":631274133,"node_id":"RA_kwDORwA07s4loHqV","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":72,"digest":"sha256:37744cc595852c04f4ed4504c0284eb6eda7eb4346c45ee6739e8553abe7fa47","download_count":21,"created_at":"2026-10-11T16:52:35Z","updated_at":"2026-10-11T16:52:36Z"}],"body":"## Highlights\n\n- **The docs open inside Gloom.** `?` on a pane opens its entry in `DOCS`, `DOCS <function>` jumps to any function, and an offline copy works without a network. (#1613)\n- **Resizing follows the pointer.** Docked panes with their divider and floating panes from any edge track the mouse, and charts and heat maps keep up, drawn at the pane's own pixel size. (#1615, #1629, #1657)\n- **Copy Screenshot paints what you see.** SVG gauges and charts, images, gradients and masked icons are in the copy. (#1614)\n- **A bigger data catalog.** `CAT` lists about 455 chartable series instead of 153, from research attention and hiring to GPU indexes, awards and perpetual long-account share. (#1616, #1627)\n- **Futures and rates, read properly.** Settlements and contract terms in `CTM` and quotes, rates reports in bp with the daily move, and more curves open in `CTM`. (#1572, #1607, #1584, #1618, #1634, #1641)\n- **13F and lists.** Compare a 13F manager with an ETF, import a 13F as a portfolio, and add many symbols to a watchlist or portfolio at once. (#1621, #1635)\n- **Earlier warnings.** Alerts can fire days before earnings, CPI and FOMC. (#1598)\n- **Assistants can capture a pane** of the desktop app with `pane.screenshot`. (#1622)\n\n## Also in this release\n\n- Listings: rows are labelled by listing (`SAN:EPA`, `SAN:NYSE`), a bare code several companies list asks which exchange, every command uses one venue list, and `TSE`, `KRX` and `EURONEXT` read as venues. (#1592, #1604, #1589, #1649, #1661)\n- Exchanges: Egypt, Oman, Bahrain and Kuwait keep their Sunday to Thursday week, and OMR, BHD, KWD, JOD, TND and LYD prices show to the mill. (#1585, #1594, #1599, #1602, #1617)\n- `SEAS` has a Weekdays tab, and report dates carry the year and the trading day, with a time zone setting. (#1324, #1583)\n- `PERP` dates each venue's own observation and opens the stock's `DES`, and CDS reports carry the 5Y spread and date each view by its last trade. (#1626, #1654, #1665)\n- Desktop dialogs show their keys on the buttons, and starter packs are templates you apply from the research heading. (#1597, #1611, #1612)\n- The install script checks its download's SHA-256, and the README covers Windows.\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.16.4...v0.16.5)\n"}
