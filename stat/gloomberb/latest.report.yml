:"2026-11-03T23:46:46Z"},{"id":707523328,"node_id":"RA_kwDORwA07s4qK_MA","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":199,"digest":"sha256:5924d4ddcc5d52d2843863b89c77c502c2357af2295f306f224729a25f35a4c3","download_count":47,"created_at":"2026-11-03T23:46:45Z","updated_at":"2026-11-03T23:46:46Z"},{"id":707523350,"node_id":"RA_kwDORwA07s4qK_MW","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:d5996fca0d8686a690af13d7e48d779e2d72b7f5f0bab8d6e3da5adda258447b","download_count":1,"created_at":"2026-11-03T23:46:46Z","updated_at":"2026-11-03T23:46:46Z"}],"body":"## Highlights\n\n- **A faster, lighter desktop app.** The desktop app moves to a new runtime: it starts about a quarter faster on Windows and a third faster on Mac, and uses less memory (on a Mac, about 600 MB instead of 950 MB). On Windows the app moves to a new folder on its first update; your shortcuts and the `gloom` command follow it, and your settings stay in `~/.gloomberb`. (#2443)\n- **Windows stop at their minimum size.** Dragging a desktop window's corner past its smallest size no longer shrinks it and snaps it back. It stops at the limit, at any display scale. (#2445)\n- **Dragged windows glide onto edges.** A floating pane eases onto the edge it snaps to instead of jumping as your pointer slows down near it. (#2457)\n- **Forward P/E names its year, and `EQS` screens a watchlist.** `DES` shows `Fwd P/E FY27`, `EQS` screens a watchlist or a list of up to 500 symbols, and `TRACE` shows a bond's kept price history. (#2451)\n- **The delay is said once.** Signed out or on Free, `15m delayed` appears once in the status bar instead of in every pane, and the status bar keeps only what a new visitor needs. (#2462)\n\n## Also in this release\n\n- Chat needs an account like the other Gloom Cloud panes; signed out it shows the sign-in wall. (#2452)\n- A fast `Esc Esc` closes the focused pane even when a detail is open; repeat it to close floating panes one by one. (#2453)\n- A custom view whose columns, filters or sort name data its source never has is refused with the reason, instead of showing an empty table. (#2455)\n- Quote boards paint a batch at once and keep the last price when a batch is late; table figures line up, and `EVT` and `SI` read cleaner.\n- Prediction Markets on the web finds Kalshi series such as Senate control. (#2463)\n- Safer pane captures, plugin installs and app links. (#2459)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.19.6...v0.20.0)\n"}
