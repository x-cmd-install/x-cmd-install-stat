ploaded","size":293602693,"digest":"sha256:20adb7e7a567c1e556ba2b7353f842a67cced5b45b69d625aa86133ea7ca2021","download_count":0,"created_at":"2026-10-28T16:55:18Z","updated_at":"2026-10-28T16:55:31Z"},{"id":685690466,"node_id":"RA_kwDORwA07s4o3s5i","name":"stable-win-x64-GloomSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":293602693,"digest":"sha256:20adb7e7a567c1e556ba2b7353f842a67cced5b45b69d625aa86133ea7ca2021","download_count":254,"created_at":"2026-10-28T16:55:18Z","updated_at":"2026-10-28T16:55:30Z"},{"id":685690461,"node_id":"RA_kwDORwA07s4o3s5d","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:824daa14e988853dd975decd64b9b23f63ed4a36e4460958dd9bb40194f2583b","download_count":49,"created_at":"2026-10-28T16:55:18Z","updated_at":"2026-10-28T16:55:18Z"}],"body":"## Highlights\n\n- **Screen more option strategies.** `CSP` now has a tab each for covered calls, verticals, iron condors, straddles, strangles and calendars beside cash-secured puts. (#2256)\n- **New chart tools.** Hollow and Heikin Ashi candles, Fib, box and ray drawings, kinetic pan, direction-coloured volume, and an option to draw rising candles in your theme's gain colour. (#2290, #2293)\n- **Alert on a ratio or an RRG quadrant.** Set an alert on XLK/SPY above 0.25 or on a quadrant change. Daily rules now wait for the final close, and alert lists show when each was created, its listing and its last reading. (#2294, #2295)\n- **Screen on technicals, volatility and float in `EQS`.** Moving averages, RSI, MACD, new highs, IV percentile, HV rank, float and ownership, plus ready technical screens. (#2266, #2280, #2296, #2305)\n- **Crypto and options flow.** `PERP` adds Liquidations and Depth tabs across venues, and `FLOW` takes a ticker with a strike breakdown and the session's net-premium tide. (#2265, #2281)\n\n## Also in this release\n\n- `COT`: the Traders in Financial Futures report, and futures and options combined. (#2283)\n- London lines: `BP.` quotes, clean pence history, and dividends in `DVD` for any exchange-qualified listing. (#2287, #2288, #2289)\n- Pro users get real-time Top News right after launch instead of the delayed feed. (#2276)\n- Desktop: a damaged update download is fetched again instead of failing every install. (#2300)\n- Charts no longer refetch their history on every live tick after a pan, and `SCAN` says when it is warming up. (#2302, #2275)\n- Closed-end funds show NAV, premium and flows, `KELLY` sizes without a bankroll, and `fn --output` writes its file. (#2262, #2255, #2305)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.18.5...v0.19.0)\n"}
