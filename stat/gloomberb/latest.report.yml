ded a timing entry for every render and never freed it, so it grew heavier the longer it ran. Thanks @Harshil-Jani. (#1101)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.1...v0.15.2)\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
