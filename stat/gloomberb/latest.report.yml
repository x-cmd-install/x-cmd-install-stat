ated_at":"2026-11-15T01:34:55Z"},{"id":749417641,"node_id":"RA_kwDORwA07s4sqzSp","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":199,"digest":"sha256:a6b791bf4bc80d082eae9e720a011d42b1f8ba5c6c238944206dd82ca3a70141","download_count":22,"created_at":"2026-11-15T01:34:55Z","updated_at":"2026-11-15T01:34:55Z"},{"id":749417628,"node_id":"RA_kwDORwA07s4sqzSc","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:5b5c04fe2dab0ec34df9961a667fc46d5f9256868ce381b7b24d8c315788f458","download_count":1,"created_at":"2026-11-15T01:34:55Z","updated_at":"2026-11-15T01:34:55Z"}],"body":"## Highlights\n\n- **CPI surprises stay visible.** `MDAY` includes a CPI day with no year-over-year actual using its core monthly surprise, labels that basis, and counts prints excluded by a filter; `CPI` and `ECST` explain missing yearly figures. (#2729)\n- **Portfolio returns by currency.** Period P&L separates price moves from FX for each currency and names holdings left out; `PORT` matches US and Asian holdings over dates both share. (#2724, #2728)\n- **Crypto prices in context.** Headers name the exchange and trade time, stablecoin ranges identify isolated extremes, and prices and range endpoints keep consistent precision. (#2721, #2726, #2730)\n- **Names find the right listing.** Tracker Fund opens on HKEX rather than a receipt; Hermès finds its Paris line, and Swiss exchange codes no longer resolve to an unrelated company. (#2717, #2729)\n\n## Also in this release\n\n- Pasted symbol lists preserve blank, invalid and duplicate rows in exports; historical price exports include currency and interval. (#2717)\n- A failed history request says to retry instead of claiming the listing has no history. (#2729)\n- Sign-in, password and other dialogs can be closed by mouse, with protection against stray clicks during sign-in. (#2721, #2726)\n- `RIPL` and `INS` explain unsupported instruments together rather than returning a raw error. (#2728)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.13...v0.20.14)\n"}
