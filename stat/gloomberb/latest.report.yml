804f89","download_count":1,"created_at":"2026-09-19T19:05:56Z","updated_at":"2026-09-19T19:06:09Z"},{"id":575320565,"node_id":"RA_kwDORwA07s4iSrH1","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":300457546,"digest":"sha256:fb1e09af63f3b8caef3ac829737f5794e255bfe53148c1f267bcc9ee09da5717","download_count":11,"created_at":"2026-09-19T19:05:56Z","updated_at":"2026-09-19T19:06:12Z"},{"id":575320557,"node_id":"RA_kwDORwA07s4iSrHt","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":278153033,"digest":"sha256:3e7c71c5953d054a54186708c8d59dcd86016052f643f444638de59a79892351","download_count":2309,"created_at":"2026-09-19T19:05:55Z","updated_at":"2026-09-19T19:06:11Z"},{"id":575320551,"node_id":"RA_kwDORwA07s4iSrHn","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:95ca5e138612fd690a6ef8c68b7245f84778939ec8d96d5f9c9599a6d6e0140c","download_count":92,"created_at":"2026-09-19T19:05:55Z","updated_at":"2026-09-19T19:05:56Z"}],"body":"## Highlights\n\n- **Keybindings are yours.** Rebind every global and pane key from the Help pane, the command bar, or `gloomberb config set keybindings.*`. Any command bar text can go on a chord, so `F5` can be `CN` and `Alt+1` can be `DES AAPL`. (#933, #934)\n- **A broken plugin no longer stops the app.** A plugin that fails to register is marked failed in the Plugins pane, with the reason, and everything else starts. (#932)\n- **Move your data folder.** `GLOOMBERB_HOME` relocates the whole `~/.gloomberb` folder: config, database, plugins and plugin cache. (#932)\n- **TV stops burning a core.** A player stranded by a reload is reaped at startup, and playback no longer decodes more than the pane can show. (#937)\n- **Analyst targets get a chart.** The consensus target is plotted from the dated targets in the ratings history, and the pane's context moves to the status bar. (#939)\n\n## Also in this release\n\n- Jobs adds evergreen and contract shares and an open roles column. (#940)\n- The chat sidebar gets consistent sections, a foldable channel list and a drag handle. (#941)\n- Help renders its shortcut and function lists as real tables. (#938, #944)\n- Price-only charts use the source's real interval list, and Auto steps down when a preset's interval is unsupported. (#935, #936)\n- Package-managed installs (Nix, distro packages) say to update through the package manager instead of failing on a read-only filesystem. (#932)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.14.0...v0.14.1)\n"}
