":"2026-11-01T22:01:20Z","updated_at":"2026-11-01T22:01:21Z"}],"body":"## Highlights\n\n- **Dragged panes keep to the pointer.** Moving a floating pane or pulling a docked pane out no longer stops and jumps at every edge it crosses; edges still snap when you slow down near one. (#2428)\n- **Lighter with live prices.** Streaming quotes redraw the terminal about half as often, prices reach the screen sooner, and the web and desktop app do less work on every redraw. (#2424, #2425)\n- **FX closes you can trust.** A rate cached before the FX week closed is no longer shown as the close, each pair names its unit one way, and currency words find `FXC` and `fx`. (#2426)\n- **Resize from the top on Windows.** The desktop window's top edge and top corners now resize it like a native window. (#2352)\n\n## Also in this release\n\n- `RIPL` refuses a list of more than ten tickers instead of opening on your holdings. (#2430)\n- The cash-secured put says when the earnings calendar could not be read, instead of \"no upcoming date published\". (#2431)\n- SEC rows write filer names the way `INS` does, ADR pair prices keep their decimals, and chart time axes keep ticks off the end labels. (#2432)\n- Windows: the restart after an error waits longer for Windows to start the app again, and the app's helper programs carry Gloom's name and version. (#2427, #2353)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.19.4...v0.19.5)\n"}
