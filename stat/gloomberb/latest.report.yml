ad_count":0,"created_at":"2026-10-01T23:04:30Z","updated_at":"2026-10-01T23:04:41Z"},{"id":604312487,"node_id":"RA_kwDORwA07s4kBROn","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":303531316,"digest":"sha256:c44655a8db064003537718f890ab3a0dbdff087195ca453ad0c455aecac241f3","download_count":3,"created_at":"2026-10-01T23:04:30Z","updated_at":"2026-10-01T23:04:43Z"},{"id":604312480,"node_id":"RA_kwDORwA07s4kBROg","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":280982311,"digest":"sha256:ca9b347d618e600f87e79e56b6468170e29d5b5576b76996166115faeeaec36f","download_count":29,"created_at":"2026-10-01T23:04:30Z","updated_at":"2026-10-01T23:04:41Z"},{"id":604312476,"node_id":"RA_kwDORwA07s4kBROc","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":72,"digest":"sha256:c4d0d65e94b75b2c0d05d15220c08d56806f51090df8ebbe6c61a1bcbcb3fe49","download_count":14,"created_at":"2026-10-01T23:04:30Z","updated_at":"2026-10-01T23:04:30Z"}],"body":"## Highlights\n\n- **Trader tools on every chart.** VWAP, anchored VWAP, volume profile and ATR join the indicators, extended-hours bars are shaded, and a price level drawn on a ticker shows on every chart of it and can become a price alert. (#1255, #1256, #1258, #1259)\n- **`OPX` options positioning.** Open interest by strike and expiry, max pain and dealer gamma for a ticker's chain. (#1257)\n- **`SEAS` seasonality.** A ticker's monthly returns by year as a heatmap, each month's average and hit rate, and every year overlaid on one calendar. (#1254)\n- **`GC` government curves.** Curves from their publishers, compared across dates, with a forward curve and a World tab. (#1245)\n- **Help on any function.** `HELP <fn>` or `F1` opens a card with what the function does and how fresh its data is on your plan. (#1243, #1248)\n\n## Also in this release\n\n- Installing IBKR Gateway brings the Interactive Brokers plugin along, and a half-installed plugin repairs its packages on launch. (#1237)\n- The web terminal installs as an app from the browser, and a web plugin that fails to load tries again. (#1233, #1232)\n- Plugin tokens set on this device survive another device's settings syncing in. (#1261)\n- `HALT` refreshes every minute. (#1252)\n- On Linux without `xdg-open`, opening a link copies it instead of failing. (#1262)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.15.4...v0.15.5)\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
