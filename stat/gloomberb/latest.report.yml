:06Z","updated_at":"2026-11-08T00:02:06Z"},{"id":722340998,"node_id":"RA_kwDORwA07s4rDgyG","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":199,"digest":"sha256:7775896e597ad5ae2a0994f1b8ac62da48c63a2e6159f40da2a15fc9889f4bd3","download_count":23,"created_at":"2026-11-08T00:02:06Z","updated_at":"2026-11-08T00:02:06Z"},{"id":722341003,"node_id":"RA_kwDORwA07s4rDgyL","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:cda778926564ac63b36a4a75c6e3ed1d21092cd0794341cdf11258a57be2d18c","download_count":1,"created_at":"2026-11-08T00:02:06Z","updated_at":"2026-11-08T00:02:06Z"}],"body":"## Highlights\n\n- **Ask Gloom answers in time on the biggest funds.** A 13F question about a fund like Millennium or Citadel answers in a few seconds instead of running out of time, a fund's name finds the fund, and portfolio risk on a large book takes about 3 seconds. (#2574)\n- **Shared links show what was shared.** A pane link pasted into Gloom chat shows the story's headline and first line, or the company with its exchange and sector, above the pane it opens. (#2569)\n- **A smoother first run in the terminal.** Alt+1 to Alt+9 switch layout tabs in terminals that never send Ctrl with a digit, Esc closes Help and the workspace card, and a small terminal gets a three-spot Home. (#2575, #2577)\n- **Professional reports say more.** EPS estimates name their basis, extended-hours moves are kept apart from the regular session, and `PORT --view sectors` compares your sectors with the S&P 500. (#2573)\n- **Brazil and Mexico books read right.** `econ --search selic` or `banxico` finds the rate decision, with fixes to receipts, listings, closes, news, yields and tabs. (#2567)\n\n## Also in this release\n\n- A ticker pane opened before its lookup answers leaves undo, redo and recent tickers as a normal open would, and spellings Gloom already holds, like `700.HK`, open at once. (#2578)\n- An npm install without Bun says how to get it. (#2579)\n- `MDAY` fills the latest payrolls and FOMC rows, `AUCT` shows what yields did after an auction, bill rates are labelled as discount rates, and yield drawdowns read in bp. (#2576)\n- `news ECB`, `news FED` and other central-bank short names show the bank's stories instead of a foreign listing's. (#2582)\n- Financials values fit a narrow pane. (#2577)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.4...v0.20.5)\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0}}
