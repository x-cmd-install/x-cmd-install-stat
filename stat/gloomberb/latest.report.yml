_count":0,"created_at":"2026-10-14T16:52:31Z","updated_at":"2026-10-14T16:52:46Z"},{"id":641018866,"node_id":"RA_kwDORwA07s4mNSvy","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":312633469,"digest":"sha256:df558045565edf0c8f1b40aac8586c23daad7b5444cf67e59c570b13c4fce752","download_count":5,"created_at":"2026-10-14T16:52:31Z","updated_at":"2026-10-14T16:52:47Z"},{"id":641018857,"node_id":"RA_kwDORwA07s4mNSvp","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":290025256,"digest":"sha256:5b96269e0bf839732aeb7d0b1e9a2175d8555274bab485e283e582edd7f0dbca","download_count":39,"created_at":"2026-10-14T16:52:31Z","updated_at":"2026-10-14T16:52:47Z"},{"id":641018869,"node_id":"RA_kwDORwA07s4mNSv1","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:8fc6ddac54a10e80e3026bed2254cc6402c2b88de8559a1ad642b0daa2cb2610","download_count":12,"created_at":"2026-10-14T16:52:31Z","updated_at":"2026-10-14T16:52:31Z"}],"body":"## Highlights\n\n- **Keep your newer layout.** Starting another device no longer replaces a newer Cloud layout with its untouched local copy; if both devices edit offline, the later edit wins once they reconnect. Update both devices. (#1816)\n- **The top bar fits.** Update status gives way before Help and the market summary, so \u201cUpdate ready\u201d and Restart no longer paint over them in the desktop app. (#1815)\n- **Chat reads as written.** Bold, italic, code, links, lists and quotes render in chat on the desktop and terminal, including messages bridged from Discord. (#1814)\n- **Clearer financial figures.** Quotes agree across spellings of one listing, enterprise value uses one close, short interest names its settlement and availability dates, and futures name the contract month and price unit. (#1798, #1805, #1807, #1809, #1811)\n\n## Also in this release\n\n- Changelog\u2019s Full diff opens the comparison instead of showing raw markdown. (#1797)\n- Six panes show cached rows while fresh data loads; unchanged ticks avoid needless redraws. (#1800, #1801)\n- Unknown commands suggest catalog matches, and locked or empty CLI reports explain what to do next. (#1804, #1806)\n- Watchlist imports handle pasted symbols and exit with an error when none resolve. (#1808)\n- Index quotes distinguish points from dollars, and the glossary explains more beginner terms. (#1810)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.17.2...v0.17.3)\n"}
