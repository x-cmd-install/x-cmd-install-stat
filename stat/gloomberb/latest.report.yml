,"updated_at":"2026-11-18T21:29:31Z"},{"id":765072738,"node_id":"RA_kwDORwA07s4tmhVi","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":200,"digest":"sha256:a451078f4e0085eb1db5ba6b6dd4a11f092a8ce04375cfd194f77765067ec500","download_count":507,"created_at":"2026-11-18T21:29:30Z","updated_at":"2026-11-18T21:29:31Z"},{"id":765072766,"node_id":"RA_kwDORwA07s4tmhV-","name":"stable-win-x64-update.json.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93,"digest":"sha256:6b8d5c66acbeaed0e031ea2454f6dc1643acdadc7fdb62196241d34b4aadfff9","download_count":2,"created_at":"2026-11-18T21:29:31Z","updated_at":"2026-11-18T21:29:31Z"}],"body":"## Highlights\n\n- **Every chart drawing comes back.** A chart with more than 100 drawings or long freehand strokes reopens with all of them, instead of empty with the next edit writing over the saved list. (#2824)\n- **From an insider-sale story to its Form 4s.** A story about insider buying or selling lists the Form 4s behind it, and each filing lists the stories citing it. (#2810)\n- **ICE positioning in `COT`.** Brent, gasoil, Dubai, ICE cocoa, robusta, white sugar and ICE wheat open on the Disaggregated report. (#2774)\n- **Statements in one currency.** `FA` and `GF` take `--currency` to compare companies, with the rate shown. (#2807)\n\n## Also in this release\n\n- `KPIS` compares a year to date with the same window a year earlier, and `CMP` 1D compares intraday with `GP`'s extended-hours control. (#2816, #2825)\n- A symbol listed only abroad, such as `O8A`, resolves in every command, and Enter on a typed listing in the command bar opens that listing, never a saved row the letters match. (#2817, #2820)\n- The web terminal shows unread chat in the tab title, with optional browser notifications. (#2804)\n- Options flow alerts say they need Pro, `OSA` values a scenario at its own date, and `DES` shows Hong Kong board lots. (#2823, #2803)\n- Earnings with no actual yet read as pending, stale history shows as behind, and a slow Cloud read is told apart from an outage. (#2811, #2818, #2806, #2815)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.20.18...v0.20.19)\n"}
