ownload_count":0,"created_at":"2026-10-21T17:15:28Z","updated_at":"2026-10-21T17:15:45Z"},{"id":663240128,"node_id":"RA_kwDORwA07s4niD3A","name":"stable-win-x64-Gloomberb.tar.zst","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":314895353,"digest":"sha256:49805f0257896bc397bc93a4c6238298258a48d985a85386e96ab5241759799d","download_count":8,"created_at":"2026-10-21T17:15:28Z","updated_at":"2026-10-21T17:15:41Z"},{"id":663240133,"node_id":"RA_kwDORwA07s4niD3F","name":"stable-win-x64-GloomberbSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":292267268,"digest":"sha256:f1540dd09153778af59fe94b59b6893ab128813750617e9fec3863fba9db54ec","download_count":114,"created_at":"2026-10-21T17:15:28Z","updated_at":"2026-10-21T17:15:41Z"},{"id":663240134,"node_id":"RA_kwDORwA07s4niD3G","name":"stable-win-x64-update.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":73,"digest":"sha256:3a5c611f614482426599a2e7a72f14ff0af8cad2b085ba5dceade9f1a7e7cd21","download_count":35,"created_at":"2026-10-21T17:15:28Z","updated_at":"2026-10-21T17:15:29Z"}],"body":"## Fixes\n\n- **Order ticket prices.** A new limit order now starts from a current quote only. Before the open, a broker's last-session quote shows its age instead of reading as the market. (#2065)\n- **Removing drawings.** Click a drawing with no tool picked, then press Delete or Backspace. This works with the order ticket docked too, and a removed last drawing stays removed. (#2066)\n- **Desktop updates.** Restart now installs the update you downloaded, even if a newer release came out in between. On macOS and Linux the old app is kept aside until the new one is in place. When an update fails, the header says why, and `U` retries. (#2052, #2069)\n\nIf your desktop app has been stuck on an older version, press `U` and then Restart as soon as \"Update ready\" shows, or reinstall from gloom.sh/download.\n\n## Also in this release\n\n- The active tab in a pane's title bar is a raised box again. (#2055)\n- Tabs and the query bar stay in place while a tab, filter or refresh loads. (#2053)\n- Currency: pence and cent prices convert correctly, rate pairs follow market convention, and `INS` names its dollars. (#2062)\n- `fn` is steadier for scripts, with real exit codes, fixed CSV headers and an `HIVG` event export. (#2049)\n- `OVDV` prices a closed session's chain at the close and measures skew from the forward. `EQS` lists match companies by issuer and explain empty currency screens. (#2048, #2051)\n\n[Full diff](https://github.com/gloom-sh/gloomberb/compare/v0.18.2...v0.18.3)\n"}
