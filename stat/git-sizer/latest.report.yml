ion/zip","state":"uploaded","size":2002014,"digest":null,"download_count":143829,"created_at":"2021-11-16T16:09:13Z","updated_at":"2021-11-16T16:09:16Z"},{"id":49591619,"node_id":"RA_kwDOBxtGaM4C9LVD","name":"git-sizer-1.5.0-windows-386.zip","label":null,"uploader":{"login":"mhagger","id":119718,"node_id":"MDQ6VXNlcjExOTcxOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"application/zip","state":"uploaded","size":1994529,"digest":null,"download_count":11351,"created_at":"2021-11-16T16:09:16Z","updated_at":"2021-11-16T16:09:18Z"},{"id":49591624,"node_id":"RA_kwDOBxtGaM4C9LVI","name":"git-sizer-1.5.0-windows-amd64.zip","label":null,"uploader":{"login":"mhagger","id":119718,"node_id":"MDQ6VXNlcjExOTcxOA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":true},"content_type":"application/zip","state":"uploaded","size":2065282,"digest":null,"download_count":28369,"created_at":"2021-11-16T16:09:18Z","updated_at":"2021-11-16T16:09:20Z"}],"body":"The emphasis of this release is making it easy to select exactly what references should be included in the analysis, and also to output counts of references by type (e.g., branches vs. tags vs. pull request heads).\r\n\r\n## What's new:\r\n\r\n* Allow several options to be set via gitconfig:\r\n    * `sizer.jsonVersion`\r\n    * `sizer.threshold`\r\n    * `sizer.names`\r\n    * `sizer.progress`\r\n* Add more reference selection options:\r\n    * `--no-branches` (the opposite of `--branches`)\r\n    * `--no-tags` (the opposite of `--tags`)\r\n    * `--no-remotes` (the opposite of `--remotes`)\r\n    * `--notes`/`--no-notes`\r\n    * `--stash`/`--no-stash`\r\n* Allow references to be selected by prefix or by regular expression:\r\n    * `--include=PREFIX`, `--exclude=PREFIX`\r\n    * `--include=/REGEXP/`, `--exclude=/REGEXP/`\r\n* Make it possible to define groups of references via gitconfig:\r\n    * `refgroup.REFGROUP.name=NAME`\r\n    * `refgroup.REFGROUP.include=PREFIX`\r\n    * `refgroup.REFGROUP.includeRegexp=REGEXP`\r\n    * `refgroup.REFGROUP.exclude=PREFIX`\r\n    * `refgroup.REFGROUP.excludeRegexp=REGEXP`\r\n* Make it possible to include/exclude references by refgroup:\r\n    * `--include=@REFGROUP`, `--exclude=@REFGROUP`\r\n* Create some predefined refgroups: `branches`, `tags`, `remotes`, `pulls`, `changes`, `notes`, and `stash`.\r\n* Include, in the output, the numbers of references in each defined refgroup, including the predefined refgroups like `branches` and `tags`.\r\n\r\n## Internal changes:\r\n\r\n* Use a new `pipe` package for managing command pipelines. This fixes some error-handling paths.\r\n* Set up an action to run a linter over the code.\r\n* Clean up a bunch of linter-reported warnings.\r\n* Set up automated testing under Windows.\r\n* Build with the Go 1.17.3 toolchain.\r\n","reactions":{"total_count":40,"+1":34,"-1":0,"laugh":1,"hooray":1,"confused":0,"heart":2,"rocket":1,"eyes":1}}
