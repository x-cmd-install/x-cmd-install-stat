{"id":434022604,"author":{"login":"lfnovo","id":579178,"node_id":"MDQ6VXNlcjU3OTE3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDONDsQ184Z3qjM","tag_name":"v1.15.1","target_commitish":"main","name":"v1.15.1 — security release","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T00:47:55Z","updated_at":"2026-11-04T14:19:57Z","published_at":"2026-11-04T14:19:57Z","assets":[],"body":"**Security release — we recommend all users upgrade.** v1.15.1 closes gaps in how sources are processed and requires content-core 2.2.1, which hardens URL fetching. It also ships the documentation rewrite and a handful of small fixes. Validated with the backend and frontend suites and a hands-on pass over the published 1.15.1 image.\n\n## 🔒 Security\n\n- Source processing now enforces the uploads-directory and URL checks in the background worker itself, so they apply on every path that processes a source, not only when a source is created.\n- Requires `content-core` 2.2.1 or later, which refuses link-local and cloud-metadata addresses on every redirect hop when fetching URLs.\n- `POST /api/commands/jobs`, the generic \"submit any background command\" endpoint, is removed. Nothing in Open Notebook used it; every operation has its own endpoint. Job status (`GET /api/commands/jobs/{job_id}`) is unchanged.\n\nSecurity advisories with the details will be published on this repository.\n\n## 📚 Documentation\n\nEvery page under `docs/` was checked against v1.15.0 and rewritten where it described an older or imagined product (#1458, #1459, #1460, #1461): one canonical install path built on the shipped `docker-compose.yml`, a first-run flow that ends in a working chat, a complete environment-variable reference, troubleshooting keyed on the exact error messages the app shows, and development docs rewritten from the code.\n\n## 🐛 Notable fixes\n\n- Timeouts no longer read as connection failures: a model that doesn't answer within `ESPERANTO_LLM_TIMEOUT` now says the provider took too long and how to raise the limit\n- Error hints point to screens that exist (Manage → Models, Podcasts → Profiles) (#1457)\n- Italian is selectable in the language menu, with dates formatted in Italian (#1457)\n- `make start-all` starts SurrealDB again; the legacy `SURREAL_ADDRESS` / `SURREAL_PORT` fallback builds a valid database URL (#1457)\n- Docs no longer recommend settings that do nothing (`API_CLIENT_TIMEOUT`, editing `.env` plus `docker compose restart`) (#1456)\n\n## ⚠️ Behavior changes for self-hosters\n\n- Anything that called `POST /api/commands/jobs` directly will now get `405 Method Not Allowed`. Use the specific endpoints (for example `POST /api/sources`) instead.\n- A source whose file is outside the uploads directory, or whose URL targets a link-local or cloud-metadata address, now fails with a permanent error instead of being processed. Private and loopback addresses (Ollama, LM Studio, other local services) are still allowed.\n\n**Full changelog:** https://github.com/lfnovo/open-notebook/compare/v1.15.0...v1.15.1\n"}
