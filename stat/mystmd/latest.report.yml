int to 10 [#3147](https://github.com/jupyter-book/mystmd/pull/3147) ([@agoose77](https://github.com/agoose77))\n- Switch to `oxfmt` for code formatting [#3146](https://github.com/jupyter-book/mystmd/pull/3146) ([@agoose77](https://github.com/agoose77))\n- Update vitest to 5.1 [#3145](https://github.com/jupyter-book/mystmd/pull/3145) ([@agoose77](https://github.com/agoose77))\n- Update turbo to 2.11 [#3144](https://github.com/jupyter-book/mystmd/pull/3144) ([@agoose77](https://github.com/agoose77))\n- Upgrade changesets to v3 [#3143](https://github.com/jupyter-book/mystmd/pull/3143) ([@agoose77](https://github.com/agoose77))\n- Upgrade to unified 11 [#3107](https://github.com/jupyter-book/mystmd/pull/3107) ([@ciyer](https://github.com/ciyer), [@agoose77](https://github.com/agoose77), [@choldgraf](https://github.com/choldgraf), [@claude](https://github.com/claude))\n\n## Documentation improvements\n\n- Document URL redirects [#3152](https://github.com/jupyter-book/mystmd/pull/3152) ([@choldgraf](https://github.com/choldgraf), [@agoose77](https://github.com/agoose77))\n- Document Plausible script URL for analytics_plausible [#3150](https://github.com/jupyter-book/mystmd/pull/3150) ([@stefanv](https://github.com/stefanv), [@choldgraf](https://github.com/choldgraf))\n\n## Other merged PRs\n\n- Version Packages [#3148](https://github.com/jupyter-book/mystmd/pull/3148) ([@agoose77](https://github.com/agoose77))\n- 🚀 Release [#3120](https://github.com/jupyter-book/mystmd/pull/3120) ([@agoose77](https://github.com/agoose77))\n\n## Contributors to this release\n\nThe following people contributed discussions, new ideas, code and documentation contributions, and review.\nSee [our definition of contributors](https://github-activity.readthedocs.io/en/latest/use/#how-does-this-tool-define-contributions-in-the-reports).\n\n([GitHub contributors page for this release](https://github.com/jupyter-book/mystmd/graphs/contributors?from=2026-11-12&to=2026-11-24&type=c))\n\n@agoose77 ([act