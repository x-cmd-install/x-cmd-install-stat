{"id":432125109,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEMeOJM4ZwbS1","tag_name":"mystmd@1.12.0","target_commitish":"main","name":"mystmd@1.12.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-26T19:09:07Z","updated_at":"2026-11-03T00:43:35Z","published_at":"2026-11-03T00:43:35Z","assets":[],"body":"\n([full changelog](https://github.com/jupyter-book/mystmd/compare/mystmd@1.11.0...2210e7003a0b70d0f9884b5da81e98841f7b79e2))\n\n## Enhancements made\n\n- Add avif and webm to the list of supported extensions [#3084](https://github.com/jupyter-book/mystmd/pull/3084) ([@agoose77](https://github.com/agoose77), [@goekce](https://github.com/goekce))\n- Add keys to option/frontmatter warnings for selective `error_rules` [#3075](https://github.com/jupyter-book/mystmd/pull/3075) ([@parmentelat](https://github.com/parmentelat), [@agoose77](https://github.com/agoose77), [@claude](https://github.com/claude), [@rowanc1](https://github.com/rowanc1))\n- myst start --execute-parallel [#3061](https://github.com/jupyter-book/mystmd/pull/3061) ([@parmentelat](https://github.com/parmentelat), [@agoose77](https://github.com/agoose77))\n- Support arrays in template options [#2910](https://github.com/jupyter-book/mystmd/pull/2910) ([@parmentelat](https://github.com/parmentelat), [@agoose77](https://github.com/agoose77))\n\n## Bugs fixed\n\n- Manually call the link command w/ npm run link [#3110](https://github.com/jupyter-book/mystmd/pull/3110) ([@choldgraf](https://github.com/choldgraf))\n- Remove `npm link` from `package.json` [#3106](https://github.com/jupyter-book/mystmd/pull/3106) ([@agoose77](https://github.com/agoose77))\n- 📝 Fix test invocation [#3105](https://github.com/jupyter-book/mystmd/pull/3105) ([@agoose77](https://github.com/agoose77))\n- Run `bun audit` to fix some of our security warnings [#3104](https://github.com/jupyter-book/mystmd/pull/3104) ([@agoose77](https://github.com/agoose77))\n- Use `bun run test` rather than Bun's test runner [#3092](https://github.com/jupyter-book/mystmd/pull/3092) ([@agoose77](https://github.com/agoose77))\n- 🐛 Handle unknown directives in myst-to-html [#3083](https://github.com/jupyter-book/mystmd/pull/3083) ([@stefanv](https://github.com/stefanv), [@agoose77](https://github.com/agoose77), [@choldgraf](https://github.com/choldgraf))\n- 🐛 Add blank line after typst block quotes [#3068](https://github.com/jupyter-book/mystmd/pull/3068) ([@stefanv](https://github.com/stefanv), [@agoose77](https://github.com/agoose77))\n- Update minimum Node version to 22+ [#3064](https://github.com/jupyter-book/mystmd/pull/3064) ([@agoose77](https://github.com/agoose77))\n- 🐛 Preserve matched target identifier for case-sensitive cross-references [#2989](https://github.com/jupyter-book/mystmd/pull/2989) ([@coretl](https://github.com/coretl), [@agoose77](https://github.com/agoose77), [@choldgraf](https://github.com/choldgraf), [@claude](https://github.com/claude), [@fwkoch](https://github.com/fwkoch), [@rowanc1](https://github.com/rowanc1), [@stefanv](https://github.com/stefanv))\n- 🧹 Remove test-case patching in myst-parser tests [#870](https://github.com/jupyter-book/mystmd/pull/870) ([@fwkoch](https://github.com/fwkoch), [@agoose77](https://github.com/agoose77))\n\n## Maintenance and upkeep improvements\n\n- Only trigger documentation update when a release succeeds [#2661](https://github.com/jupyter-book/mystmd/pull/2661) ([@choldgraf](https://github.com/choldgraf), [@agoose77](https://github.com/agoose77), [@bsipocz](https://github.com/bsipocz), [@stefanv](https://github.com/stefanv))\n\n## Documentation improvements\n\n- Add Developer API docs [#2882](https://github.com/jupyter-book/mystmd/pull/2882) ([@stefanv](https://github.com/stefanv), [@agoose77](https://github.com/agoose77), [@choldgraf](https://github.com/choldgraf), [@fwkoch](https://github.com/fwkoch))\n\n## Other merged PRs\n\n- 🚀 Release [#3062](https://github.com/jupyter-book/mystmd/pull/3062) ([@agoose77](https://github.com/agoose77))\n- 🚀 Release [#2906](https://github.com/jupyter-book/mystmd/pull/2906) ([@stefanv](https://github.com/stefanv))\n- 📝 Typst template documentation [#1179](https://github.com/jupyter-book/mystmd/pull/1179) ([@roaldarbol](https://github.com/roaldarbol), [@agoose77](https://github.com/agoose77))\n\n## Contributors to this release\n\nThe following people contributed discussions, new ideas, code and documentation contributions, and review.\nSee [our definition of contributors](https://github-activity.readthedocs.io/en/latest/use/#how-does-this-tool-define-contributions-in-the-reports).\n\n([GitHub contributors page for this release](https://github.com/jupyter-book/mystmd/graphs/contributors?from=2026-09-21&to=2026-11-03&type=c))\n\n@agoose77 ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Aagoose77+updated%3A2026-09-21..2026-11-03&type=Issues)) | @bsipocz ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Absipocz+updated%3A2026-09-21..2026-11-03&type=Issues)) | @choldgraf ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Acholdgraf+updated%3A2026-09-21..2026-11-03&type=Issues)) | @claude ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Aclaude+updated%3A2026-09-21..2026-11-03&type=Issues)) | @coretl ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Acoretl+updated%3A2026-09-21..2026-11-03&type=Issues)) | @fwkoch ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Afwkoch+updated%3A2026-09-21..2026-11-03&type=Issues)) | @goekce ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Agoekce+updated%3A2026-09-21..2026-11-03&type=Issues)) | @parmentelat ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Aparm