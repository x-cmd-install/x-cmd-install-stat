{"id":15543450,"author":{"login":"klaudiosinani","id":12670537,"node_id":"MDQ6VXNlcjEyNjcwNTM3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"MDc6UmVsZWFzZTE1NTQzNDUw","tag_name":"v0.3.0","target_commitish":"master","name":"0.3.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2019-02-13T19:55:17Z","updated_at":"2019-02-14T05:57:03Z","published_at":"2019-02-13T19:57:41Z","assets":[],"body":"## Highlights\r\n\r\n- Added new `--begin`/`-b` option to start/pause progress of tasks. (#105) 904a007\r\n- Restore functionality of `--copy` option on snap package. (#123) d917db2\r\n- Improved functionality of `--find` option. (#126) (#110) (#111) 97eb4ec aaf244f\r\n- Prevent usage of `--begin` & `--check` options on note items. 39a0d4a\r\n- Render `note` instead of `notes` on single note item existence. (#106) 57b3990\r\n- Docs: Sorted flag options & examples alphabetically. (#107) 1d044f8\r\n- Renamed `in progress` indicator to `in-progress` on stats overview. 080f4c3\r\n- Docs: Added French Translation. (#121) afe62af\r\n- Docs: Improvements for the French Translation. (#122) b0dda8b\r\n- Updated snapcraft package versioning to `x.y.z` format. 0f35d99\r\n- Renamed `lib` directory to `src`. 82c8742\r\n- Docs: Fixed minor typo. (#120) 1c60acd\r\n- Upgraded snapcraft node-engine@10.15.0. fe2ec38\r\n\r\n## Thanks\r\n\r\nHuge thank you to @codehearts, @allen-munsch, @samsawan, @jalandis, @johnlunney & @Maltemo for contributing and helping out with this release!\r\n\r\n## All changes\r\n\r\n[klaussinani/taskbook@`v0.2.0...v0.3.0`](https://github.com/klaussinani/taskbook/compare/v0.2.0...v0.3.0)\r\n"}
