.6.1\n\nA consolidation release that removes an external dependency for image rendering and reworks the detail/edit layer around generic, type-driven field editors.\n\n### Embedded SVG rasterization\n\nSVG rasterization now runs in-process \u2014 the external `resvg` CLI no longer needs to be installed on your `PATH`. Diagram and image sizing was retuned in the process so diagrams and SVGs render at a sensible natural width.\n\n### Generic field editors\n\nEditing in the detail view no longer relies on per-type, hardcoded editors. A generic field-editor system resolves the right in-place editor from each field's declared type, driven by a shared `fieldmeta` layer, so custom fields and catalog scalars all edit consistently. A new `user` data type joins the built-in types.\n\n### Unified multi-part editors\n\nThe date, datetime, and recurrence editors were unified onto a single segmented multi-part editor, replacing three divergent implementations. This adds a proper `datetime` value type and consistent segment navigation across all date-like fields.\n\n### Open files by title\n\nA new file box lets you open any tracked Markdown document directly, presented as a navigable markdown tree, and the document's title is shown when a file is opened.\n\n## Changelog\n### Others\n* 63313595613eba42298fb8c5ce9aa073f41448a5 Merge pull request #207 from boolean-maybe/dev\n* d8c6491951a84448c3ed1c157ea246f98bf32f02 Merge pull request #209 from boolean-maybe/feature/svg-wasm\n* 872cc5ff178a698f976b0d50570c4d0738dfd92d Merge pull request #210 from boolean-maybe/dev\n* bb9795405b9b566bb0be86011805074e6155d10e detail view fixes\n* e41ef9de90b86025611e65b897c85f52ead7b5b4 drop legacy upgrader and slim edit-session/detail-view layer\n* 0c3fc2fdbaeee601607931c0fb5140dca0c1676b embed WASM SVG rasterization\n* 54ff9678f6cc02d58a30efaf70e0a410bd9c41e3 fix bug-tracker workflow\n* d231bd34866241b751698ad4608c601db5fc9039 fix skill\n* b97dffe3e060dd5994502bbe7c32488a38b8a4e9 generic field editors\n* 5fd8a558891a40f988c30c4c9d5718048685ee28 improve progress bar\n* fd001d65b5b9c1e3a30aa5cd872cc0dd1c1377b6 open file box\n* facde29de0a2f988f667a77efdd3a7ffe5be0889 remove blocks builtin\n* 6be632935b2267383a7ede63fc6707c8c0c7c9ff show progress on image render\n* 55491be38e8db42241f5e8e284388a0c440b438a show title on opening file\n* 2e889b32315a1bee9dc5ccc1cc07793708c6705c tune diagram/image sizing\n* 788875c0a049f650894b455c0f143c01d2b986b1 unify multi-part editors\n* 91488790948e9ac33276711ab3da28ba3d86260a upgrade to navidown 0.5.1\n* eef087e54fe8fb800df69f8b0cc19f2776002c72 user data type\n"}
