ader":{"login":"ivanvc","id":27286,"node_id":"MDQ6VXNlcjI3Mjg2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":21917428,"digest":"sha256:ce4c08f5f43d99f0d1993552ce2906829c0366077a97e5e52529337f151a29fb","download_count":3584,"created_at":"2026-10-22T23:06:58Z","updated_at":"2026-10-22T23:07:00Z"},{"id":667347338,"node_id":"RA_kwDOAKtHts4nxumK","name":"etcd-v3.7.3-linux-ppc64le.tar.gz","label":"","uploader":{"login":"ivanvc","id":27286,"node_id":"MDQ6VXNlcjI3Mjg2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22093180,"digest":"sha256:acf0702f8bfffbc1c7252a1d588fc243028a0665af368f4d2d32b02955a0ff32","download_count":390,"created_at":"2026-10-22T23:06:55Z","updated_at":"2026-10-22T23:06:57Z"},{"id":667347212,"node_id":"RA_kwDOAKtHts4nxukM","name":"etcd-v3.7.3-linux-s390x.tar.gz","label":"","uploader":{"login":"ivanvc","id":27286,"node_id":"MDQ6VXNlcjI3Mjg2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":23631502,"digest":"sha256:380d1d395bc9282ad3a60c9c45dc39e0dd8eedc56f66c7d76df1981ae9774bfd","download_count":305,"created_at":"2026-10-22T23:06:52Z","updated_at":"2026-10-22T23:06:54Z"},{"id":667347782,"node_id":"RA_kwDOAKtHts4nxutG","name":"etcd-v3.7.3-windows-amd64.zip","label":"","uploader":{"login":"ivanvc","id":27286,"node_id":"MDQ6VXNlcjI3Mjg2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24456625,"digest":"sha256:bf5f9c92e862ce776699166ec9ac003a1609e06ea7cc4d8b11b3f9e836a86101","download_count":1227,"created_at":"2026-10-22T23:07:04Z","updated_at":"2026-10-22T23:07:06Z"},{"id":667348165,"node_id":"RA_kwDOAKtHts4nxuzF","name":"SHA256SUMS","label":"","uploader":{"login":"ivanvc","id":27286,"node_id":"MDQ6VXNlcjI3Mjg2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":676,"digest":"sha256:babdf54f91046c4c2bc3911335f4e066738e25daf30430bdbd29bfd3e5c3cb26","download_count":6498,"created_at":"2026-10-22T23:07:13Z","updated_at":"2026-10-22T23:07:13Z"}],"body":"Please check out [CHANGELOG](https://github.com/etcd-io/etcd/blob/main/CHANGELOG/CHANGELOG-3.7.md) for a full list of changes. And make sure to read [upgrade guide](https://etcd.io/docs/v3.7/upgrades/upgrade_3_7/) before upgrading etcd (there may be breaking changes).\r\n\r\nFor installation guides, please check out [play.etcd.io](http://play.etcd.io) and [operating etcd](https://etcd.io/docs/v3.7/op-guide/). Latest support status for common architectures and operating systems can be found at [supported platforms](https://etcd.io/docs/v3.7/op-guide/supported-platform/).\r\n\r\n###### Linux\r\n\r\n```sh\r\nETCD_VER=v3.7.3\r\n\r\n# choose either URL\r\nGOOGLE_URL=https://storage.googleapis.com/etcd\r\nGITHUB_URL=https://github.com/etcd-io/etcd/releases/download\r\nDOWNLOAD_URL=${GOOGLE_URL}\r\n\r\nrm -f /tmp/etcd-${ETCD_VER}-linux-amd64.tar.gz\r\nrm -rf /tmp/etcd-download-test && mkdir -p /tmp/etcd-download-test\r\n\r\ncurl -L ${DOWNLOAD_URL}/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz -o /tmp/etcd-${ETCD_VER}-linux-amd64.tar.gz\r\ntar xzvf /tmp/etcd-${ETCD_VER}-linux-amd64.tar.gz -C /tmp/etcd-download-test --strip-components=1 --no-same-owner\r\nrm -f /tmp/etcd-${ETCD_VER}-linux-amd64.tar.gz\r\n\r\n/tmp/etcd-download-test/etcd --version\r\n/tmp/etcd-download-test/etcdctl version\r\n/tmp/etcd-download-test/etcdutl version\r\n\r\n# start a local etcd server\r\n/tmp/etcd-download-test/etcd\r\n\r\n# write,read to etcd\r\n/tmp/etcd-download-test/etcdctl --endpoints=localhost:2379 put foo bar\r\n/tmp/etcd-download-test/etcdctl --endpoints=localhost:2379 get foo\r\n```\r\n\r\n###### macOS (Darwin)\r\n\r\n```sh\r\nETCD_VER=v3.7.3\r\n\r\n# choose either URL\r\nGOOGLE_URL=https://storage.googleapis.com/etcd\r\nGITHUB_URL=https://github.com/etcd-io/etcd/releases/download\r\nDOWNLOAD_URL=${GOOGLE_URL}\r\n\r\nrm -f /tmp/etcd-${ETCD_VER}-darwin-amd64.zip\r\nrm -rf /tmp/etcd-download-test && mkdir -p /tmp/etcd-download-test\r\n\r\ncurl -L ${DOWNLOAD_URL}/${ETCD_VER}/etcd-${ETCD_VER}-darwin-amd64.zip -o /tmp/etcd-${ETCD_VER}-darwin-amd64.zip\r\nunzip /tmp/etcd-${ETCD_VER}-darwin-amd64.zip -d /tmp && rm -f /tmp/etcd-${ETCD_VER}-darwin-amd64.zip\r\nmv /tmp/etcd-${ETCD_VER}-darwin-amd64/* /tmp/etcd-download-test && rm -rf mv /tmp/etcd-${ETCD_VER}-darwin-amd64\r\n\r\n/tmp/etcd-download-test/etcd --version\r\n/tmp/etcd-download-test/etcdctl version\r\n/tmp/etcd-download-test/etcdutl version\r\n```\r\n\r\n###### Docker\r\n\r\netcd uses [`gcr.io/etcd-development/etcd`](https://gcr.io/etcd-development/etcd) as a primary container registry, and [`quay.io/coreos/etcd`](https://quay.io/coreos/etcd) as secondary.\r\n\r\n```sh\r\nETCD_VER=v3.7.3\r\n\r\nrm -rf /tmp/etcd-data.tmp && mkdir -p /tmp/etcd-data.tmp && \\\r\n  docker rmi gcr.io/etcd-development/etcd:${ETCD_VER} || true && \\\r\n  docker run \\\r\n  -p 2379:2379 \\\r\n  -p 2380:2380 \\\r\n  --mount type=bind,source=/tmp/etcd-data.tmp,destination=/etcd-data \\\r\n  --name etcd-gcr-${ETCD_VER} \\\r\n  gcr.io/etcd-development/etcd:${ETCD_VER} \\\r\n  /usr/local/bin/etcd \\\r\n  --name s1 \\\r\n  --data-dir /etcd-data \\\r\n  --listen-client-urls http://0.0.0.0:2379 \\\r\n  --advertise-client-urls http://0.0.0.0:2379 \\\r\n  --listen-peer-urls http://0.0.0.0:2380 \\\r\n  --initial-advertise-peer-urls http://0.0.0.0:2380 \\\r\n  --initial-cluster s1=http://0.0.0.0:2380 \\\r\n  --initial-cluster-token tkn \\\r\n  --initial-cluster-state new \\\r\n  --log-level info \\\r\n  --logger zap \\\r\n  --log-outputs stderr\r\n\r\ndocker exec etcd-gcr-${ETCD_VER} /usr/local/bin/etcd --version\r\ndocker exec etcd-gcr-${ETCD_VER} /usr/local/bin/etcdctl version\r\ndocker exec etcd-gcr-${ETCD_VER} /usr/local/bin/etcdutl version\r\ndocker exec etcd-gcr-${ETCD_VER} /usr/local/bin/etcdctl endpoint health\r\ndocker exec etcd-gcr-${ETCD_VER} /usr/local/bin/etcdctl put foo bar\r\ndocker exec etcd-gcr-${ETCD_VER} /usr/local/bin/etcdctl get foo\r\n```\r\n"}
