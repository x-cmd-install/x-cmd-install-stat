 && sudo apt install lazyjournal\r\n```\r\n\r\nInstallation instructions for Debian have been updated in PR #79.\r\n\r\n- #75 Massive performance inprovements:\r\n- - Added `io_uring` on Linux.\r\n- - Linux io_uring input and end-of-file log reads, with automatic fallback on unsupported systems.\r\n- - Cached coloring regexes and constant-time username lookup.\r\n- - Concurrent, ordered filtering and coloring using available CPUs.\r\n- - Streaming stdin processing slow producers now display output immediately instead of waiting for EOF.\r\n- - Buffered stdout, bounded work queues, long line and CRLF support.\r\n- #46 Fix: stop dropping `--user` flag when filtering user units by name.\r\n- #80 Restore navigation after SSH manager host switching (closes #70).\r\n- #64 Added the ability to copy visible lines from the log window to the clipboard (`Shift+C` hotkey) using a terminal system call via ANSI sequences (OSC 52), without requiring any external dependencies.\r\n- #82 and #84 Fix: 55 issues identified by golangci linters have been resolved using OpenCode.\r\n- #71 The `etc` directory has been added to the list of paths from which the application reads its configuration for RHEL-based systems.\r\n- #73 Fix: check `$PATH` before appending `.local/bin` in `install.sh`.\r\n- #76 The Go version has been updated to `1.27.0`, along with module versions (with corresponding updates applied to Docker images and all workflows).\r\n- #77 Added sing to go-releaser using GPG key.\r\n\r\n## New Contributors\r\n\r\n* @Booyaka101 made their first contribution in https://github.com/Lifailon/lazyjournal/pull/56\r\n* @fierroviejo made their first contribution in https://github.com/Lifailon/lazyjournal/pull/79\r\n* @alexjoedt made their first contribution in https://github.com/Lifailon/lazyjournal/pull/73\r\n* @AquilaIgnis made their first contribution in https://github.com/Lifailon/lazyjournal/pull/75\r\n* @mvanhorn made their first contribution in https://github.com/Lifailon/lazyjournal/pull/80","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
