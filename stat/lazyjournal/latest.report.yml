b92b8e8b30fd8e4d6cb78f98c6696e0b8fe8b299807260ad9ee4d785","download_count":113,"created_at":"2026-03-16T13:07:30Z","updated_at":"2026-03-16T13:07:30Z"},{"id":374974919,"node_id":"RA_kwDONOBqa84WWanH","name":"lazyjournal-0.8.6-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4218880,"digest":"sha256:8d28e731191580cf1ef14b8a9423ca7b97fde1ea0b15bcfd53b8f43f08e0c757","download_count":20,"created_at":"2026-03-16T13:07:32Z","updated_at":"2026-03-16T13:07:32Z"}],"body":"**Full Changelog**: https://github.com/Lifailon/lazyjournal/compare/0.8.5...0.8.6\r\n\r\n- #45 Fixed errors when scrolling through logs.\r\n- #46 Changed the user log retrieval list to a list of units from `systemd`, and added loading of logs for user units.\r\n- #46 Added the `-U/--unit-types` flag and the `unitType` configuration parameter for filtering unit lists, for example, `--unit-types service,timer,scope,socket,mount` (`service` by default).\r\n- #50 Added the `-l/--logging` flag and and the `logging` configuration parameter for write executed commands to a log file when loading lists and the selected log (for local debugging in the terminal).\r\n- Replaced the System and User journals lists (obtained from `journald` with field filtering by `UNIT` and `USER_UNIT`) with a single list with user-defined filtering using the `-j/--journal-field` flag and the `journalField` configuration parameter (`SYSLOG_IDENTIFIER` by default). This also significantly speeds up list loading.\r\n- Added the `-b/--journal-boot` switch and the `journalBoot` configuration flag to limit loading of system and user journals to the specified system boot only.\r\n- Added the `-J/--journal-priority` switch and the `journalPriority` configuration flag to define the default log content priority at startup, with support for dynamic changes in the interface.\r\n- Added validation of passed values \u200b\u200bin new flags to display a list of available values.","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
