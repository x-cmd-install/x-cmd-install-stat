ren Hammudoglu (1)\r\n* Ijtihed Kilani (1) +\r\n* Andrew Nelson (2)\r\n* Ilhan Polat (1)\r\n* Tyler Reddy (39)\r\n* romao05 (1) +\r\n* Michael Simacek (1) +\r\n* Jacob Vanderplas (2)\r\n\r\n A total of 18 people contributed to this release.\r\n People with a \"+\" by their names contributed a patch for the first time.\r\n This list of names is automatically generated, and may not be fully complete.\r\n\r\nNote that the source and binary assets associated with this release were published to PyPI using [trusted publishing](https://docs.pypi.org/trusted-publishers/), and so the trusted assets and their hashes are made available more securely at https://pypi.org/project/scipy/1.18.1/ rather than providing them here in a less secure manner.\r\n\r\nA complete list of issues and pull requests associated with this release is available in the associated [`README.txt`](https://github.com/scipy/scipy/releases/download/v1.18.1/README.txt).","reactions":{"total_count":14,"+1":5,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":4,"rocket":2,"eyes":0}}
