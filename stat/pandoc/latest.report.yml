lcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":42700800,"digest":"sha256:208eeef81b3d734a24f999afb5bf49db4dcf0be4fb72307bebf9ad02353f9a73","download_count":31473,"created_at":"2026-10-26T21:33:40Z","updated_at":"2026-10-26T21:33:49Z"},{"id":679545200,"node_id":"RA_kwDOAAi5es4ogQlw","name":"pandoc-3.13-windows-x86_64.zip","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":42983200,"digest":"sha256:23e1f2e978a3df80db8bf65c9c59534f41a23140480cfb4f783a882ab7dc6a4e","download_count":9076,"created_at":"2026-10-26T21:33:49Z","updated_at":"2026-10-26T21:33:59Z"},{"id":679545684,"node_id":"RA_kwDOAAi5es4ogQtU","name":"pandoc-3.13-x86_64-macOS.pkg","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":26831967,"digest":"sha256:f777e705c3eade6dc2c55927d37175aec09e9a545abfefeaec52df76cabb33ac","download_count":743,"created_at":"2026-10-26T21:33:59Z","updated_at":"2026-10-26T21:34:06Z"},{"id":679546008,"node_id":"RA_kwDOAAi5es4ogQyY","name":"pandoc-3.13-x86_64-macOS.zip","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26891866,"digest":"sha256:1823278715aa405aaf21b59cde5dc789346aa8d4fc307467f9a9ee84162bedc5","download_count":290,"created_at":"2026-10-26T21:34:06Z","updated_at":"2026-10-26T21:34:12Z"}],"body":"I'm pleased to announce the release of pandoc 3.13,\r\navailable in the usual places:\r\n\r\nBinary packages & changelog:\r\nhttps://github.com/jgm/pandoc/releases/tag/3.13\r\n\r\nSource & API documentation:\r\nhttp://hackage.haskell.org/package/pandoc-3.13\r\n\r\nThis release fixes some regressions and makes many minor\r\nimprovements.  See the changelog for full details.\r\n\r\nBehavior changes:\r\n\r\n- Locations of errors in default files are now reported.\r\n- YAML is now parsed with the yamlet library, which implements\r\n  YAML 1.2. As a result, we'll get better error messages, and:\r\n\r\n  + `yes`, `no`, `on`, `off`, `y` and `n` are strings, not booleans.\r\n  + Duplicate keys in a mapping are an error. They were a warning.\r\n  + `.5`, `.inf` and `.nan` are numbers.\r\n\r\n  The most likely way this change will bite you is if you use\r\n  `no` in a boolean field. This will be interpreted as a nonempty\r\n  value, which will be treated as truthy in a template.\r\n\r\nAPI changes:\r\n\r\n- Text.Pandoc.Sharde: export `plainToPara` and `paraToPlain`.\r\n- Text.Pandoc.Writers.Shared: export new functions `wrapColumns` and\r\n  `rendereWithTemplate`.\r\n- Text.Pandoc.Translations: `readTranslations` now takes the path\r\n  of the file as argument.\r\n\r\nThanks to all who contributed, especially new contributors\r\nAndrzej Rybczak, Patrick Creighton, Wleeaf, and enieuwy.\r\n\r\n<details>\r\n  <summary>Click to expand changelog</summary>\r\n\r\n- Report the location of errors in defaults files (#8759, Andrzej Rybczak). An invalid value in a defaults file gave an error at the start of the file, with no indication of the field. The error now names the option and points at its value.\r\n\r\n- Use yamlet for YAML parsing. Pandoc parsed YAML with the yaml package, which depends on the C library libyaml. It now uses yamlet, a pure Haskell YAML 1.2 parser. Values still go through the existing aeson instances. Note these behavior changes:\r\n\r\n  - `yes`, `no`, `on`, `off`, `y` and `n` are strings, not booleans, as in YAML 1.2.\r\n  - YAML errors now show the file, the line and the column, with the offending line. In metadata blocks the line is the line in the document.\r\n  - Duplicate keys in a mapping are an error. They were a warning.\r\n  - `.5`, `.inf` and `.nan` are numbers.\r\n\r\n- Docx reader:\r\n\r\n  - Read `w:fldSimple` fields (#11944, Aslak Hellesøy).\r\n  - Keep grid columns that have no width (#11989, Patrick Creighton). `w:w` is optional on `w:gridCol`, but `elemToTblGrid` skipped the grid columns that had none. The table then had fewer columns than its rows had cells, and the extra cells were dropped. Every grid column is now kept. If any of them has no (readable) width, all columns get the default width.\r\n  - Fix namespaces in notes and comments (#11991, Patrick Creighton). The contents of footnotes, endnotes and comments were read with the namespace prefixes declared in word/document.xml rather than in their own parts.\r\n  - Records the indentation of each list level and track the open list levels; an unnumbered paragraph whose left indentation matches the text indentation of an open level is treated as a continuation of that level’s current item, rather than as a block quote (cf. #9197).\r\n  - Recover from fields with a missing instruction (#11943, enieuwy). This fixes a bug that could lead to content being omitted.\r\n  - Fix regression (from 3.11) in parsing column widths (#11969). The regression caused only the first column to get assigned its alignment; every other column received default alignment. In addition, in 3.11 alignment was taken from the header row if present; this changed behavior from earlier versions, which took it from the first body row. We revert to the earlier behavior, using the header row only if there are no body rows. It’s common for the header to have different alignment than the rest.\r\n  - Keep tracked paragraph marks inside notes (#11971, Aslak Hellesøy).\r\n\r\n- RST reader:\r\n\r\n  - Allow inline markup and bare links after `:`, `/`, `'`, `\"`, `<` (Wleeaf). Fixes a regression since 3.2.1; these characters could no longer precede an inline markup start-string or a bare URI or email address, although the reStructuredText spec allows them. Also implement the rule that a start-character between an opening character and its closing counterpart, as in `(*)` or `\"*\"`, does not trigger inline markup.\r\n\r\n- RTF reader:\r\n\r\n  - Fix tokenization bug (#11981). We were consuming certain symbols after `\\uNNNN` during tokenization. This led to an *extra* character being consumed as the “fallback,” so letters went missing after encoded unicode characters.\r\n\r\n- LaTeX reader:\r\n\r\n  - Detect macro expansion loops across `doMacros` calls (#11088).\r\n\r\n- ODT reader:\r\n\r\n  - Fix start numbers with `text:continue-numbering` (#9595).\r\n\r\n- Markdown writer:\r\n\r\n  - Write wide tables as grid tables instead of falling back to HTML (#11945, Aslak Hellesøy).\r\n  - Don’t drop notes in notes.\r\n  - Fix regression with code block language (#11987). We try to identify which class is a language name and emit that as the gfm style info string. If none of the classes match a recognized language, before 3.10.1 we emitted the first class; fater 3.10.1, we emit nothing. This commit reverts to the pre-3.10.1 behavior.\r\n\r\n- RST writer:\r\n\r\n  - Don’t drop notes in notes.\r\n\r\n- Haddock writer:\r\n\r\n  - Don’t drop notes in notes.\r\n\r\n- Docx writer:\r\n\r\n  - Fix multi-paragraph list items (#9197). Previously the docx writer gave the second and subsequent paragraphs of a list item numbering from a separate list with an invisible bullet. This looked right, but semantically these paragraphs were items of another list, which is what Word, screen readers, and pandoc’s own docx reader saw; the list was also split in three. The writer now gives these paragraphs no numbering, just an indentation that lines them up with the text of the list item (as Word’s “List Continue” styles do).\r\n\r\n- LaTeX writer:\r\n\r\n  - Use braces around term containing `=` (#11954). This is needed for the new LaTeX list code, which is triggered by using `pdfstandard`.\r\n\r\n- PowerPoint writer:\r\n\r\n  - Add `clrMapOvr` to notes slides (#11935, Gaurav Vijay Jadhav). This makes them importable by Keynote.\r\n  - Include `lang` in core document properties.\r\n\r\n- DocBook, JATS, TEI writers:\r\n\r\n  - Apply `writerIdentifierPrefix` prefix consistently.\r\n\r\n- Typst writer:\r\n\r\n  - Escape `...` and `-?` ligatures (#11979).\r\n  - Use `getLang` to determine lang and region. Previously only the `lang` metadata field was consulted, so `lang` could not be set properly using a variable.\r\n\r\n- Text.Pandoc.Translations:\r\n\r\n  - `readTranslations` now takes the path of the file, for error messages \\[API change\\].\r\n\r\n- Text.Pandoc.Writers.Shared:\r\n\r\n  - Add `wrapColumns`, `renderWithTemplate` \\[API change\\]. These factor out code that was repeated in about 20 writers: computing the line length from writerWrapText/writerColumns, and rendering the body with or without the template.\r\n\r\n- Text.Pandoc.Shared:\r\n\r\n  - Export `plainToPara` and `paraToPlain`. \\[API change\\]\r\n\r\n- Text.Pandoc.PDF:\r\n\r\n  - Make `--presentational-hints` default for weasyprint. This is necessary to get list attributes (start, ordered list type, etc.) working properly (#11976).\r\n\r\n- cabal.project:\r\n\r\n  - Use bundle C option for zlib by default. This allows pandoc to be built without first installing the C library zlib. Those who want to use the system zlib can still compile pandoc that way by overriding this setting in cabal.project.local, or just installing directly from Hackage.\r\n  - Default to `+http` on GHC \\>= 9.14 (previously done only in CI), so local builds behave the same; `-f-http` still overrides it.\r\n  - Pass wasm link flags for `pandoc-cli` as `ghc-options`. cabal only passes ld-options along when it finds an `ld` program on the PATH. In an environment without one (e.g. `nix shell` with just the ghc-wasm-meta toolchain), the flags were silently dropped and linking pandoc.wasm failed with undefined `setjmp` and clock symbols. Use `-optl- ghc-options` instead, which GHC passes to its linker regardless.\r\n\r\n- Makefile:\r\n\r\n  - Add `release` target.\r\n  - Improve `make pandoc-templates` so it does the whole job.\r\n  - Use bash as `SHELL` (`check-cabal` uses `pushd`, `check-version-sync` uses `==`).\r\n  - Fix `$(id -u)` in `debpkg`, which make expanded to empty.\r\n  - Fix missing `echo` in `validate-docx-golden-tests{,2}`.\r\n  - Ensure pandoc is built before rules that run it to produce files.\r\n  - Use `git ls-files` for `SOURCEFILES`, not the main branch’s tree.\r\n  - Drop redundant `embed_data_files` flag in `quick-stack`.\r\n\r\n- Use released citeproc 0.14.1.1, texmath 0.13.3.3, gridtables 0.1.1.1 (#9085).\r\n\r\n- MANUAL.txt:\r\n\r\n  - Clarify the effect of `raw_html` in commonmark formats (#8305).\r\n\r\n- Bump bounds on crypton, crypton-x509-system, tasty-bench.\r\n\r\n- Add `tools/circleci-build-release.sh`, `tools/github-build-release.sh`.\r\n\r\n</details>\r\n","reactions":{"total_count":29,"+1":11,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":8,"rocket":5,"eyes":2}}
