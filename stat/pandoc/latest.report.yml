d":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41761100,"digest":"sha256:2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d","download_count":21765,"created_at":"2026-08-29T00:49:42Z","updated_at":"2026-08-29T00:49:51Z"},{"id":534533673,"node_id":"RA_kwDOAAi5es4f3FYp","name":"pandoc-3.11-x86_64-macOS.pkg","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":26093618,"digest":"sha256:0fd0f1ebd439da17121a148f9afa624e9a3bb8e6a5c5822dea01232e8d9f3de6","download_count":3048,"created_at":"2026-08-29T00:49:51Z","updated_at":"2026-08-29T00:49:57Z"},{"id":534533757,"node_id":"RA_kwDOAAi5es4f3FZ9","name":"pandoc-3.11-x86_64-macOS.zip","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":26145603,"digest":"sha256:3b1c1b57f160112c821d02f23d946ede8b7f57a6ccf4632a25a512d334a9291f","download_count":717,"created_at":"2026-08-29T00:49:57Z","updated_at":"2026-08-29T00:50:03Z"},{"id":534533804,"node_id":"RA_kwDOAAi5es4f3Fas","name":"pandoc-3.11.wasm.zip","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16415572,"digest":"sha256:bd856c19094f5333ee92f239dd93d288a05429f1d957efef1c37e7bb97ac14bd","download_count":358,"created_at":"2026-08-29T00:50:03Z","updated_at":"2026-08-29T00:50:08Z"}],"body":"```\r\nI'm pleased to announce the release of pandoc 3.11,\r\navailable in the usual places:\r\n\r\nBinary packages & changelog:\r\nhttps://github.com/jgm/pandoc/releases/tag/3.11\r\n\r\nSource & API documentation:\r\nhttp://hackage.haskell.org/package/pandoc-3.11\r\n\r\nSome changes of note:\r\n\r\n- A new `--math-method` option, which replaces the (now deprecated but\r\n  still functional) options `--mathml`, `--mathjax`, `--gladtex`,\r\n  `--katex`, `--webtex`. The `plain` style can now be specified\r\n  explicitly. In defaults files, `html-math-method` is now\r\n  `math-method` (though `html-math-method` will still work).\r\n\r\n- `mathml` is now the default math-method.\r\n\r\n- A new option `--completion={bash,zsh,fish}` generates completion\r\n  scripts for all three shells (see the manual for instructions on\r\n  how to use them). `--bash-completion` continues ot work, an alias of\r\n  `--completion=bash`.\r\n\r\n- It is now possible to reset a Markdown example list counter (e.g.,\r\n  at the beginning of a chapter), using the syntax `(1@)` or\r\n  `(1@label)`.\r\n\r\n- Enhanced support for RTL languages: RTL text direction now\r\n  works in ODT. In addition, setting `lang` at the document level\r\n  is now sufficient in Docx to make documents RTL.\r\n\r\n- Fixed pandoc 3.8 regressions in syntax highlighting.\r\n\r\n- Fixed a security-related bug in template fetching which\r\n  could result in a local file being fetched instead of a\r\n  remote one.\r\n\r\nAPI changes:\r\n\r\n- Text.Pandoc.Options: Rename HTMLMathMethod type to MathMethod.\r\n  Rename `writerHTMLMathMethod` field of WriterOptions to\r\n  `writerMathMethod`.\r\n\r\n- Text.Pandoc.App: the `optHTMLMathMethod` constructor for OPt\r\n  is renamed to optMathMethod.\r\n\r\nThanks to all who contributed, especially new contributors Wrong-Code\r\nand wzy.\r\n```\r\n\r\n<details>\r\n  <summary>Click to expand changelog</summary>\r\n\r\n- Add `--math-method` option. This replaces (now deprecated but still functional) options `--mathml`, `--mathjax`, `--gladtex`, `--katex`, `--webtex`. The `plain` style can now be specified explicitly. In defaults files, `html-math-method` is now `math-method` (though `html-math-method` will still work).\r\n\r\n- Make `mathml` the default math-method (#11751).\r\n\r\n- Add `--completion={bash,zsh,fish}` (#8542, wzy). Make `--bash-completion` an alias of `--completion=bash`. See the manual for instructions on how to use these completions.\r\n\r\n- Text.Pandoc.Options \\[API change\\]:\r\n\r\n  - Rename HTMLMathMethod type to MathMethod.\r\n  - Rename `writerHTMLMathMethod` field of WriterOptions to `writerMathMethod`.\r\n\r\n- Markdown reader:\r\n\r\n  - Add a syntax `(1@label)` for resetting example list counter (#10940). This is needed often at the beginning of a chapter.\r\n\r\n- MediaWiki writer:\r\n\r\n  - Put `<nowiki>` around possible URLs (#11834). Otherwise they get linkified automatically.\r\n\r\n- Docx reader:\r\n\r\n  - Handle case where non-header rows come before header rows (#11833).\r\n  - Improve handling of tables with uneven rows (#11833).\r\n\r\n- RTF Reader:\r\n\r\n  - Add support for nested tables (#11218, Alex).\r\n\r\n- Typst reader:\r\n\r\n  - Remove handling of \u2018block\u2019 as an inline-level element (#11814).\r\n\r\n- HTML reader:\r\n\r\n  - Handle `pre` without `code` (#11810). Preserve whitespace as nonbreaking spaces.\r\n\r\n- ODT/OpenDocument writers:\r\n\r\n  - Support RTL text direction (#11301). RTL is now properly handled in these cases: `dir: rtl` (or `ltr`) in document metadata; an RTL `lang` in metadata (e.g.\u00a0`he`, `ar`), unless overridden by `dir`; a `dir` attribute on a Div. Code blocks remain ltr regardless.\r\n  - Use `style:language-complex` rather than `fo:language` for RTL languages (#11301).\r\n  - Fix treatment of DefaultHighlighting (#11829).\r\n\r\n- Docx writer:\r\n\r\n  - Initialize envLang from `lang` metadata (#11301). This ensures that setting `lang` will affect the whole document. Previously, setting `lang` to `he` was not sufficient to make the document RTL.\r\n\r\n- JATS writer:\r\n\r\n  - Fix illegal use of `p` element inside `p` (#11809).\r\n\r\n- Ms writer:\r\n\r\n  - Fix treatment of DefaultHighlighting (#11829). (Regression from 3.8.)\r\n\r\n- ConTeXt writer:\r\n\r\n  - Fix bug in syntax highlighting (#11829). (Regression from 3.8.)\r\n\r\n- Text.Pandoc.App.Opt:\r\n\r\n  - In Opt, change `optHTMLMathMethod` to `optMathMethod`. \\[API change\\]\r\n\r\n- MSI installer: Fix upgrade detection for per-machine installations (#11827, Wrong-Code). Previously, registry records of previous versions were not being removed.\r\n\r\n- Text.Pandoc.Templates:\r\n\r\n  - Fix bug in `getTemplate`. When calling `fetchItem` in `getTemplate`, we temporarily reset the `stSourceURL` in CommonState so that the template is sought locally. Previously, an exception in `fetchItem` would prevent `stSourceURL` from being set back to its original value. This could result in a local file being fetched instead of a remote one. Note that an exception is triggered when one uses e.g.\u00a0`--template default.html5`; in that case `getTemplate` handles the exception by looking for the file in the user data directory. This patch fixes the bug so that the `stSourceURL` is reset regardless of whether `fetchItem` raises an exception. Thanks to Yingjie Su for identifying the problem.\r\n\r\n- beamer template: remove spurious extra tableofcontents (#11819).\r\n\r\n- Text.Pandoc.App.CommandLineOptions:\r\n\r\n  - Export OptionSpec, which can encode the type of completion needed by each option (wzy).\r\n\r\n- Add new unexported module Text.Pandoc.Completion (wzy).\r\n\r\n- Replace a use of `nub` with `nubOrd`.\r\n\r\n- Use latest releases of djot, asciidoc, typst, texmath.\r\n\r\n- MANUAL.txt:\r\n\r\n  - Add a note that `thanks` in typst doesn\u2019t currently work (#11807).\r\n  - Note that sourcepos extension works for djot too.\r\n\r\n</details>\r\n\r\n","reactions":{"total_count":35,"+1":16,"-1":0,"laugh":0,"hooray":8,"confused":0,"heart":8,"rocket":2,"eyes":1}}
