=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":43319296,"digest":"sha256:7794998679a6afa1d7c3f7adee689aa17ed75e8a06faf2ed7c60a303bccfcf23","download_count":296,"created_at":"2026-11-12T04:31:14Z","updated_at":"2026-11-12T04:31:26Z"},{"id":738065141,"node_id":"RA_kwDOAAi5es4r_fr1","name":"pandoc-3.14-windows-x86_64.zip","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43614099,"digest":"sha256:0144b96e8c7b023fd382ec5ef5bdc475e873f1019d6fa72502492df2c9a94a3b","download_count":354,"created_at":"2026-11-12T04:31:26Z","updated_at":"2026-11-12T04:31:36Z"},{"id":738065576,"node_id":"RA_kwDOAAi5es4r_fyo","name":"pandoc-3.14-x86_64-macOS.pkg","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":27431693,"digest":"sha256:145a39969291a8af79fe81037be3eb6e56511f0056b4dfd562571312f0b9b7c7","download_count":68,"created_at":"2026-11-12T04:31:36Z","updated_at":"2026-11-12T04:31:42Z"},{"id":738065864,"node_id":"RA_kwDOAAi5es4r_f3I","name":"pandoc-3.14-x86_64-macOS.zip","label":null,"uploader":{"login":"jgm","id":3044,"node_id":"MDQ6VXNlcjMwNDQ=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27490795,"digest":"sha256:891708579061e7b1c1a6ce0df30ebb3cb2b6d0ca045ed3c8554ab830c1e0c270","download_count":18,"created_at":"2026-11-12T04:31:42Z","updated_at":"2026-11-12T04:31:49Z"}],"body":"I'm pleased to announce the release of pandoc 3.14,\r\navailable in the usual places:\r\n\r\nBinary packages & changelog:\r\nhttps://github.com/jgm/pandoc/releases/tag/3.14\r\n\r\nSource & API documentation:\r\nhttp://hackage.haskell.org/package/pandoc-3.14\r\n\r\nThis release includes a lot of bug fixes and small improvements,\r\nincluding improvements in dependencies, which you can read about\r\nin the changelog. Here are the changes of special note:\r\n\r\n- Pandoc now searches a path given in an enviornment variable\r\n  PANDOC_DATA_DIRS when looking up data files (including\r\n  templates, filters, defaults files, metadata files, etc.).\r\n  The user data directory is still tried first. This change\r\n  will make it easier to create distributions of pandoc with\r\n  special customized data files.\r\n\r\n- The LaTeX writer now uses custom macros for footnotes in\r\n  tables and definition lists, fixing a bug with hyperlinks\r\n  in the notes in these contexts. Those who use custom templates\r\n  will need to import the definitions of these macros from\r\n  the default LaTeX template.\r\n\r\nAPI change:\r\n\r\n- Text.Pandoc.Class exports new functions `getDataDirs`\r\n  and `getPandocDataDirs`.\r\n\r\nThanks to all who contributed, especially new contributors\r\nAlain Lesage, Asuka, Caio Vinícius, Jeremy Levartovsky,\r\nNacho García, tyler000000.\r\n\r\n<details>\r\n  <summary>Click to expand changelog</summary>\r\n\r\n- Support `PANDOC_DATA_DIRS` for data file lookup (#7922). If `PANDOC_DATA_DIRS` is set, the (absolute) directories it lists are searched, in order, for data files not found in the user data directory, before falling back to the default data files. This covers templates, filters, defaults files, metadata files, CSL styles, and other data files. If `PANDOC_USER_DATA_DIRS` is set, print its value in `--version` output.\r\n\r\n- Reset sourcepos when parsing footnotes and grid table cells (#12001, extends fix for #11888). Otherwise, when one of these ends a file, relative paths in it can be rebased against the next file on the command line.\r\n\r\n- LaTeX reader:\r\n\r\n  - Fix duplicated text after a control space at line end (#12051, Asuka).\r\n  - Handle pandoc’s deferred footnotes (`\\pandocfootnotemark{n}` and `\\pandocfootnotetext{n}{..}`) as produced by the LaTeX writer for notes in tables, captions, etc.\r\n  - Ignore definitions of `\\pandocbounded`, `\\pandocfootnotemark`, and `\\pandocfootnotetext` (e.g. from pandoc’s template), which the reader handles directly. Previously these definitions were expanded, producing garbage and losing content.\r\n  - Fix file-crossing bug in `rawLaTeXParser` (#12072). The raw LaTeX parser didn’t work properly when crossing from one source file to another.\r\n\r\n- Typst reader:\r\n\r\n  - Handle `columns: auto` in grid (#12061).\r\n\r\n- HTML reader:\r\n\r\n  - Don’t drop ordered lists and rules inside footnotes (#11852). Previously an `<ol>` inside the body of a note was treated as the list of notes, and its items were lost. Similarly, an `<hr>` inside a note was dropped.\r\n\r\n- RST reader:\r\n\r\n  - Strip minimum indentation from indented blocks (#12071). Previously the indentation of the first line was stripped, so lines with less indentation lost all their leading whitespace. Now, as in docutils, the minimum indentation is stripped and relative indentation is preserved.\r\n  - Require descriptions in option list items (#12063).\r\n\r\n- ODT reader:\r\n\r\n  - Support the `styles` extension (#12060).\r\n\r\n- Docx reader:\r\n\r\n  - Merge adjacent styled code blocks (#9183, Caio Vinícius). Without `+styles`, consecutive “Source Code” paragraphs are combined into a single code block by `combineBlocks`. With `+styles`, each paragraph is first wrapped in a `Div` carrying its `custom-style` attribute, so the `CodeBlock` case no longer matched and every line became its own `Div [CodeBlock]`.\r\n  - Don’t drop contents of customXml element (#12050).\r\n  - Read all underline types (#11988, Patrick Creighton).\r\n  - Follow `w:numStyleLink` in abstract numberings (#9222, Caio Vinícius).\r\n\r\n- Pptx reader:\r\n\r\n  - Don’t add spaces between text runs (#12016, Nacho García).\r\n  - Read the shapes inside group shapes (#12017, Nacho García).\r\n  - Read equations and markup-compatibility blocks (#12025, Nacho Garcia).\r\n  - Read speaker notes (Nacho García, #12023). Each slide’s notes are now read into a `notes` div at the end of the slide’s blocks, the form the pptx writer turns into speaker notes, so pptx -\\> Markdown -\\> pptx keeps them.\r\n  - Read charts as tables (Nacho García, #12023). Previously, a chart was read as a placeholder text. We now create a table from the chart’s cached data. The table is put in a `chart` Div whose `type` attribute holds the chart type. The chart’s title becomes the table captions. The chart code is in Text.Pandoc.Readers.OOXML.Charts.\r\n  - Mark hidden slides with a `hidden` class on the header (Nacho García, #12023).\r\n  - Handle merged table cells (Nacho García).\r\n  - Parse bold, italic, sub/superscript and hyperlinks (Nacho García). Text runs were previously read as plain text, so their formatting and hyperlinks were lost.\r\n  - Read inherited bullets, numbering and nested lists (#12042, Nacho García).\r\n  - Skip slide number placeholders (#12045, Nacho García).\r\n\r\n- Xlsx reader:\r\n\r\n  - Resolve package-absolute relationship targets (#12013, Nacho García).\r\n  - Read inline strings and rich text as written (#12014, Nacho García).\r\n  - Look up a cell’s font through its cell format (#12033, Nacho García).\r\n  - Read merged cells as spans (Nacho García).\r\n  - Render dates and times (Nacho García).\r\n  - Render numbers as Excel’s General format (Nacho García, #12023).\r\n  - Read charts (#12043, Nacho García). Charts are now read as tables using the cached data.\r\n\r\n- Docx writer:\r\n\r\n  - Implement flip-flopping for emph (#11961). Emph within emph becomes upright. This is important for correct formatting of titles in CSL, among other things. LaTeX does this automatically, and in HTML we achieve it via CSS.\r\n\r\n- EPUB writer:\r\n\r\n  - Fix `id` clash with added title header (#12003, Alain Lesage).\r\n  - Skip dates that cannot be normalized (#12002, Alain Lesage).\r\n\r\n- Ipynb writer:\r\n\r\n  - Make ANSI escape stripping linear (#7744, Jeremy Levartovsky).\r\n\r\n- Vimwiki reader:\r\n\r\n  - Support rejected todos (tyler000000).\r\n\r\n- LaTeX writer:\r\n\r\n  - Fix hyperlinks for deferred footnotes (#11936). Notes in tables, captions, and definition list terms are rendered as a mark followed later by the note text. Previously we used `\\footnotemark{}` and `\\footnotetext` with manual adjustments to the footnote counter. But hyperref anchors each `\\footnotetext` at the destination of the most recent `\\footnotemark`, so when there were several such notes, all of the texts got the last mark’s anchor and the links for the other marks were broken. We now emit `\\pandocfootnotemark{n}` and `\\pandocfootnotetext{n}{..}`, where `n` is a unique id. These macros, defined in the default template when the `deferred-notes` variable is set, save the footnote mark and hyperref anchor at the mark and restore them at the text. This removes the need for counter arithmetic, works when the footnote counter is reset by chapter, and handles notes nested inside deferred notes (whose texts are now emitted after the text containing their marks). **Note:** Users of custom LaTeX templates, or of LaTeX fragments produced without `--standalone`, will need to include the definitions of `\\pandocfootnotemark` and `\\pandocfootnotetext` from the default template.\r\n  - Allow repeated longtable captions (#4558, Václav Haisman). If a table has a `repeat-caption` class, captions will be repeated on each page of a longtable.\r\n\r\n- HTML styles template:\r\n\r\n  - Add emph flip-flopping. So, emph within emph renders as upright, etc.\r\n  - Move `@print` rules to end (#12064), so they aren’t overridden.\r\n\r\n- Text.Pandoc.PDF:\r\n\r\n  - PDF via LaTeX: do at most 3 runs when only a TOC is present (#12012, Alain Lesage).\r\n\r\n- Text.Pandoc.Class:\r\n\r\n  - Export new functions `getDataDirs` and `getPandocDataDirs`. \\[API change\\]\r\n\r\n- Text.Pandoc.Citeproc:\r\n\r\n  - `removeFinalPeriod` now acts across Link boundary.\r\n\r\n- pandoc-lua-engine: raise lower bound for pandoc to 3.13 (#12066).\r\n\r\n- Depend on texmath 0.13.3.5, commonmark 0.3.2, commonmark-extensions 0.2.8, citeproc 0.14.2, typst 0.12.1, emojis 0.1.6, skylighting 0.15.0.1.\r\n\r\n- New bounds for crypton in pandoc-lua-engine and pandoc.\r\n\r\n- Makefile:\r\n\r\n  - Fix release-templates target so it pushes tags.\r\n  - Remove default CABALOPTS. These can be put in cabal.project.local. This will ensure that the same options are used by HLS, so that rebuilds aren’t needed.\r\n  - `make check-cabal`: exit with error status on outdated deps.\r\n  - Reorganize `check-cabal`; add `check-sdist` target we can run separately.\r\n\r\n- cabal.project: specify `+http` flag for all ghc versions.\r\n\r\n- Minimize the test docx, odt, pptx files. This reduces the size of the test files (and release tarball) by 1.79 MB.\r\n\r\n</details>\r\n","reactions":{"total_count":8,"+1":3,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":2,"eyes":0}}
