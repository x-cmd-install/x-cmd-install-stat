"2026-11-19T03:28:16Z","updated_at":"2026-11-19T03:28:17Z"},{"id":766055085,"node_id":"RA_kwDOEgpjzc4tqRKt","name":"scorecard_checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":612,"digest":"sha256:626e9220f58f57ab9a3cd133378b67669a50b71ee6ffba675a58c41434710fef","download_count":181,"created_at":"2026-11-19T03:28:16Z","updated_at":"2026-11-19T03:28:17Z"}],"body":"## Highlights\r\n\r\n- **Built with Go 1.27.4**, which rejects TLS certificate chains through the distrusted eMudhra intermediate CAs\r\n  ([GO-2026-6809](https://pkg.go.dev/vuln/GO-2026-6809)), so Scorecard no longer connects to servers that present them\r\n  ([#5364](https://github.com/ossf/scorecard/issues/5364)). by @justaugustus in #5460\r\n- **GitHub immutable releases count** for Signed-Releases and Pinned-Dependencies. See [Score changes](#score-changes).\r\n\r\n### `scorecard mcp`: Scorecard in your AI assistant (experimental)\r\n\r\n`scorecard mcp` runs a Model Context Protocol (MCP) server, so assistants such as Claude Code, Claude Desktop and VS\r\nCode can answer questions about a project's security practices from Scorecard data. Ask for a repository's score, the\r\ndetails and remediation for one check, or a comparison of several repositories, and the answer comes from Scorecard's\r\npublished results, with the commit, scan date and Scorecard version it reflects.\r\n\r\nIt needs no token and no extra install: it's part of the `scorecard` binary and talks to the client over stdio. For\r\nClaude Code:\r\n\r\n```sh\r\nclaude mcp add scorecard --scope user -- scorecard mcp\r\n```\r\n\r\nIt covers repositories that publish their results, such as those using scorecard-action or included in the weekly public\r\nscan. It doesn't run new scans yet. Setup for other clients is in the [README](https://github.com/ossf/scorecard#scorecard-mcp-server) and [docs/mcp.md](https://github.com/ossf/scorecard/blob/main/docs/mcp.md).\r\nby @justaugustus in #5402, with fixes listed under General.\r\n\r\n### OSPS Baseline conformance mode (experimental)\r\n\r\nScorecard can now report a repository's results against [OSPS Baseline](https://baseline.openssf.org) requirements\r\ninstead of check scores. Choose a maturity level and an output format:\r\n\r\n```sh\r\nscorecard --repo=github.com/ossf/scorecard \\\r\n  --catalog=osps-baseline --profile=maturity-1 --format=json\r\n```\r\n\r\nEach requirement gets PASS, FAIL, UNKNOWN, NOT_APPLICABLE or NEEDS_REVIEW, with the probe findings behind it as\r\nevidence. Requirements Scorecard doesn't map yet are listed as not evaluated. This first release evaluates the\r\nprimary-branch protection requirements, OSPS-AC-03.01 and OSPS-AC-03.02. `--format=gemara` writes a\r\n[Gemara](https://github.com/gemaraproj/gemara) Evaluation Log for compliance tooling. Runs without `--catalog` are\r\nunchanged. The options and output may change, and every run says so on standard error. Details are in\r\n[docs/conformance.md](https://github.com/ossf/scorecard/blob/main/docs/conformance.md). by @justaugustus in #5449\r\n\r\n## Action Required\r\n\r\n- **Scorecard exits 1 again when a repository scan or writing results fails.** v5.4.0 through v5.6.0 exited 0 in these\r\n  cases, for example a missing `--local` path, an unwritable `--output` file, or an unknown probe. v5.3.0 and earlier\r\n  exited 1. Remaining repositories are still scanned, and low or inconclusive scores still exit 0. by @JamieMagee in\r\n  #5319\r\n- **`scorecard serve` listens on 127.0.0.1 by default and no longer sends CORS headers.** To reach it from other hosts,\r\n  including through a published container port, pass `--listen`, for example `scorecard serve --listen 0.0.0.0`.\r\n  `scorecard serve --help` now says the server has no authentication or rate limiting. by @justaugustus in #5378 and\r\n  #5337\r\n- **`scorecard-attestor` has been removed**, along with its `attestor/` Go packages. by @justaugustus in #5371\r\n- **GitLab: `GITLAB_AUTH_TOKEN` is sent only to the instance in `GL_HOST`**, or to GitLab.com when `GL_HOST` is unset.\r\n  Other GitLab instances are scanned without the token, so set `GL_HOST` to scan private projects on a self-managed\r\n  instance. GitLab repository URLs must use https. by @justaugustus in 8517fc17\r\n- **Library users: Go 1.27.4 or later is required** (`go` directive raised from 1.26.8). by @justaugustus in #5475\r\n- **Library users: `clients.RepoClient` has a new method, `IsReleaseImmutable`.** Implementations outside Scorecard must\r\n  add it. by @jessehouwing in #5248\r\n\r\n## Security\r\n\r\nv5.7.0 fixes the issues in these advisories.\r\n\r\n- [GHSA-vphr-r3r5-mmfv]: git file mode no longer reads files outside the clone through symlinks, and skips symlinks it\r\n  can't read instead of failing the check. by @justaugustus in #5377\r\n- [GHSA-6r4f-r463-fh56]: `scorecard serve` no longer allows cross-origin reads. by @justaugustus in #5378\r\n- [GHSA-f6hq-fqq8-mjq8]: `GITLAB_AUTH_TOKEN` goes only to the configured GitLab instance. by @justaugustus in 8517fc17\r\n- [GHSA-fm8f-fq23-92xp]: GitHub (token and GitHub App) and GitLab (REST, GraphQL and archive downloads) credentials are\r\n  no longer sent when a forge redirects a request to a different host or scheme. by @justaugustus in d7552fb3, and by\r\n  @Sahana2524 in #5189\r\n- [GHSA-h59x-jjpq-gr9p] and [GHSA-rvqc-48xm-qrmm]: attestor policy bypasses, resolved by removing `scorecard-attestor`.\r\n  by @justaugustus in #5371\r\n\r\nAlso published: [GHSA-crhh-248m-2rm9], for this repository's `scdiff` CI workflow, fixed in 2024 by #4376. It needs no\r\naction from users.\r\n\r\n[GHSA-vphr-r3r5-mmfv]: https://github.com/ossf/scorecard/security/advisories/GHSA-vphr-r3r5-mmfv\r\n[GHSA-6r4f-r463-fh56]: https://github.com/ossf/scorecard/security/advisories/GHSA-6r4f-r463-fh56\r\n[GHSA-f6hq-fqq8-mjq8]: https://github.com/ossf/scorecard/security/advisories/GHSA-f6hq-fqq8-mjq8\r\n[GHSA-fm8f-fq23-92xp]: https://github.com/ossf/scorecard/security/advisories/GHSA-fm8f-fq23-92xp\r\n[GHSA-h59x-jjpq-gr9p]: https://github.com/ossf/scorecard/security/advisories/GHSA-h59x-jjpq-gr9p\r\n[GHSA-rvqc-48xm-qrmm]: https://github.com/ossf/scorecard/security/advisories/GHSA-rvqc-48xm-qrmm\r\n[GHSA-crhh-248m-2rm9]: https://github.com/ossf/scorecard/security/advisories/GHSA-crhh-248m-2rm9\r\n\r\n## Score changes\r\n\r\n### Branch-Protection\r\n\r\n- A GitHub merge queue required by an active repository ruleset now satisfies \"require branches to be up to date before\r\n  merging\". Scores can go up. by @osterman in #5281\r\n- Azure DevOps: PR policies for default and named branches are mapped to branch protection, without counting unrelated\r\n  push restrictions or unproven permissions. by @JamieMagee in #5340\r\n- GitLab: a failed API request no longer stops the check, and a 401 or 403 from the external status checks API counts as\r\n  no status checks instead of failing the check. by @vishnums2k5 in #5359\r\n\r\n### Code-Review\r\n\r\n- Azure DevOps: approvals use PR identity IDs and reviewer votes, and a missing identity no longer counts as an\r\n  approval. Scores can go down. by @JamieMagee in #5325\r\n\r\n### Dangerous-Workflow\r\n\r\n- An unterminated `${{` expression in a workflow no longer aborts the check. by @Sahana2524 in #5177\r\n\r\n### Maintained\r\n\r\n- GitLab: each issue's author is checked separately. Before, one issue opened by a project member made every issue count\r\n  as member activity, so some GitLab projects may score lower. by @vishnums2k5 in #5381\r\n\r\n### Pinned-Dependencies\r\n\r\n- Actions pinned to a tag of a GitHub immutable release count as pinned. Scores can go up. by @jessehouwing in #5248\r\n\r\n### SAST\r\n\r\n- References to LGTM.com, closed in 2022, have been removed. by @Kielek in #4985\r\n\r\n### Signed-Releases\r\n\r\n- A GitHub immutable release counts as signed, so projects that publish immutable releases can score higher. by\r\n  @martincostello in #5002\r\n\r\n### Vulnerabilities\r\n\r\n- osv-scanner is updated to v2.7.1. Two upstream fixes drop false matches: Go standard library vulnerabilities on\r\n  modules whose path ends in `/go`, and results from network-based plugins in offline mode. Scores can go up. by\r\n  @justaugustus in #5475\r\n\r\n## General\r\n\r\n- With `--file-mode git`, a malformed or all-zero `--commit` fails with `invalid commit SHA` instead of silently\r\n  scanning the default branch. by @cpanato in #5368\r\n- `scorecard --help` documents the token environment variables, corrects the `--repo` and `--repos` formats, and sorts\r\n  the `--checks` values. by @lasomethingsomething in #5430\r\n\r\n### `scorecard mcp`\r\n\r\nFixes since the subcommand landed in #5402:\r\n\r\n- `get_check_result` returns `missing_checks` and `complete` metadata. by @areeebs in #5418\r\n- Repository references with an uppercase scheme or a trailing `.git` are accepted, `.` and `..` path segments are\r\n  rejected, and GitLab subgroup paths are reported as unsupported. by @areeebs in #5419\r\n- Commit SHAs are lowercased before querying published results, a missing result for a pinned commit is reported\r\n  separately from a repository with no results, and results whose commit doesn't match the request are rejected. by\r\n  @areeebs in #5420\r\n- The experimental flag for each check comes from its definition. by @Muneer320 in #5421\r\n\r\n## Docs\r\n\r\n- :book: Document dependency, review, and advisory policies by @justaugustus in #5334\r\n- :book: Document repository access and bug reporting by @justaugustus in #5335\r\n- :book: Document architecture and privileged workflows, and script the `scdiff` comparison workflow by @justaugustus in\r\n  #5336\r\n- :book: Add a Gemara threat model for the scan engine by @justaugustus in #5337\r\n- :book: Add the LF CRA stewardship statement and escalation policy by @justaugustus in #5369\r\n- :book: Add [OpenSpec](https://openspec.dev/) specs for current behavior by @justaugustus in #5326\r\n- :book: Retarget the OSPS Baseline coverage doc to `v2026.08.28` by @justaugustus in #5470\r\n- :book: Fix broken doc links by @farisbasha in #5477\r\n- :book: Drop flaky links from documentation by @justaugustus in #5480\r\n\r\n## Other\r\n\r\n- :seedling: Define each check's wiring once, in `internal/checkdef` (no behavior change) by @justaugustus in #5425,\r\n  #5427, #5428, #5432, #5433, #5434, #5435, #5436, #5437, #5438, #5439, #5440, #5441\r\n- :seedling: Replace issue templates with issue forms by @justaugustus in #5414\r\n- :seedling: Publish OSPS Baseline results to [grc.store](https://grc.store/targets/scorecard/scorecard) by\r\n  @justaugustus in #5338\r\n- :seedling: Check doc links with lychee on PRs and weekly by @justaugustus in #5478\r\n- :seedling: Turn off setup-go caching in scdiff and release workflows by @justaugustus in #5363\r\n- :seedling: Bump golangci-lint tool to v2.15.0 by @cpanato in #5366\r\n- :seedling: Bump ossf/scorecard-action to v2.5.0 by @justaugustus in #5313\r\n- :seedling: Update e2e test for 10 open62541 vulnerabilities by @justaugustus in #5360\r\n\r\n## Project\r\n\r\n- We closed 165 issues filed before 2024 to refresh the tracker, and new issues now go through issue forms (#5414).\r\n  Details are in the [issue cleanup discussion](https://github.com/ossf/scorecard/discussions/5415).\r\n\r\n## Known Issues\r\n\r\n- **GitLab: Vulnerabilities returns −1 (inconclusive)** for GitLab repositories\r\n  ([#5056](https://github.com/ossf/scorecard/issues/5056)).\r\n- **Pinned-Dependencies: findings reached through a YAML alias point at the anchor's line**, not the alias\r\n  ([#5291](https://github.com/ossf/scorecard/issues/5291)). Planned for v5.8.0.\r\n- **Dangerous-Workflow misses some untrusted checkouts and `workflow_run` context fields**\r\n  ([#5379](https://github.com/ossf/scorecard/issues/5379), [#5396](https://github.com/ossf/scorecard/issues/5396)).\r\n- **CI-Tests and SAST can fail with an unrelated organization IP allow-list error** when recent commits carry\r\n  third-party app check suites ([#5382](https://github.com/ossf/scorecard/issues/5382)).\r\n- **CI-Tests and SAST can score lower when GitHub no longer returns older PR check data**\r\n  ([#5411](https://github.com/ossf/scorecard/issues/5411)).\r\n- **GitLab: Maintained reads only the first 20 issues and project members**, so large projects may score lower.\r\n\r\n## New Contributors\r\n\r\n- @osterman made their first contribution in #5281\r\n- @jessehouwing made their first contribution in #5248\r\n- @vishnums2k5 made their first contribution in #5381\r\n- @lasomethingsomething made their first contribution in #5430\r\n- @farisbasha made their first contribution in #5477\r\n- @areeebs made their first contribution in #5418\r\n- @Muneer320 made their first contribution in #5421\r\n\r\n**Full Changelog**: <https://github.com/ossf/scorecard/compare/v5.6.0...v5.7.0>\r\n\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":13}
