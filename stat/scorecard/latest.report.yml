d_at":"2026-10-12T00:27:45Z","updated_at":"2026-10-12T00:27:46Z"},{"id":632187170,"node_id":"RA_kwDOEgpjzc4lrmki","name":"scorecard_checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":612,"digest":"sha256:7885cd81e0bf6ef30492de2c4252f3c293929da5716df8b9c2863dd5a1674422","download_count":413,"created_at":"2026-10-12T00:27:45Z","updated_at":"2026-10-12T00:27:45Z"}],"body":"## Scorecard Infrastructure Migration\r\n\r\nv5.6.0 is the first Scorecard release since our hosted services moved! :tada:\r\n\r\nThe weekly batch scans and the REST API now run on [AboutCode Foundation](https://aboutcode.org)\r\ninfrastructure on AWS, operated in partnership with the Scorecard Steering Committee.\r\n\r\nAboutCode is a public-benefit non-profit that already consumes Scorecard data and runs similar\r\nlarge-scale data services, including [PurlDB](https://purldb.io) and\r\n[VulnerableCode](https://public.vulnerablecode.io).\r\n\r\nThe full announcement is in [#5208](https://github.com/ossf/scorecard/issues/5208).\r\n\r\nWhat this means for you:\r\n\r\n- **CLI and REST API users:** nothing changes. The API endpoint and the tooling are the same.\r\n- **Scorecard Action users:** Upgrade to\r\n  [v2.5.0](https://github.com/ossf/scorecard-action/releases/tag/v2.5.0) or later. Older versions\r\n  pull images from `gcr.io`, which has been retired, and will fail.\r\n- **Container images:** use `ghcr.io/ossf/scorecard`. Existing version tags were copied from\r\n  `gcr.io/openssf/scorecard` with identical digests (v5.5.0 was already published to GHCR), so only\r\n  the registry and namespace change:\r\n\r\n  ```diff\r\n  - gcr.io/openssf/scorecard:<tag>@sha256:<sha>\r\n  + ghcr.io/ossf/scorecard:<tag>@sha256:<sha>\r\n  ```\r\n\r\n- **BigQuery dataset users:** the public dataset is no longer available.\r\n- **Weekly scan inventory:** to add a repository to the weekly scans, follow\r\n  [`ossf/scorecard-infra`'s contributing guide](https://github.com/ossf/scorecard-infra/blob/main/CONTRIBUTING.md).\r\n  The pipeline and its project lists moved there.\r\n- **Allstar users:** the hosted Allstar GitHub App has been retired. Allstar continues as a\r\n  Scorecard subproject; see the [Allstar README](https://github.com/ossf/allstar) for self-hosting.\r\n\r\nReport infrastructure problems at [ossf/scorecard-infra](https://github.com/ossf/scorecard-infra/issues).\r\n\r\nThank you to AboutCode Foundation for giving Scorecard a new home, and to everyone who reported\r\nmigration issues and helped other projects update.\r\n\r\n## Action Required\r\n\r\n- **Workflow checks now read YAML aliases, so Pinned-Dependencies may report more findings.** Steps\r\n  reached through an alias (`uses: *anchor`, aliased `run:`) were previously skipped and are now\r\n  checked by Pinned-Dependencies, Dangerous-Workflow and the other workflow-based checks. Each\r\n  aliased step counts, so a repository that reuses unpinned actions this way and wasn't already at 0\r\n  can lose score. by @justaugustus in https://github.com/ossf/scorecard/pull/5287\r\n- **Library users: `checks/fileparser` signatures changed.** Exported workflow helpers\r\n  (`GetJobName`, `AnyJobsMatch`, `IsPackagingWorkflow` and others) now take Scorecard's own workflow\r\n  types instead of `github.com/rhysd/actionlint` types, and some workflow parse error messages are\r\n  worded differently. by @justaugustus in https://github.com/ossf/scorecard/pull/5287\r\n- **Library users: `cron/` has been removed.** `cron/data` and `cron/config` are no longer\r\n  importable; the batch-scan pipeline now lives in `ossf/scorecard-infra` (see Scorecard\r\n  Infrastructure Migration). by @justaugustus in https://github.com/ossf/scorecard/pull/5210\r\n- **Library users: Go 1.26.5 or later is required** (`go` directive raised from 1.26.0). by\r\n  @justaugustus in https://github.com/ossf/scorecard/pull/5296\r\n\r\n## General\r\n\r\n- Release container images are built with Go 1.27.2. by @dependabot[bot] in https://github.com/ossf/scorecard/pull/5310\r\n- `--format=intoto` output is now serialized with `protojson`, so field names match the in-toto\r\n  specification. by @puerco in https://github.com/ossf/scorecard/pull/5225\r\n- On Windows, file paths from GitHub, GitLab and Azure DevOps repositories now use forward slashes,\r\n  matching other platforms. by @pujitha24 in https://github.com/ossf/scorecard/pull/5153\r\n\r\n### Azure DevOps\r\n\r\n- Legacy Azure DevOps repository URLs are accepted and normalized to `dev.azure.com`. by @JamieMagee\r\n  in https://github.com/ossf/scorecard/pull/5128\r\n- No workflow runs are returned, without querying every build, when the requested YAML pipeline\r\n  doesn't exist. by @JamieMagee in https://github.com/ossf/scorecard/pull/5129\r\n- Language-aware checks fall back to all supported languages when language analytics are\r\n  unavailable. by @JamieMagee in https://github.com/ossf/scorecard/pull/5130\r\n- A repository file larger than the archive extraction limit is now rejected instead of silently\r\n  truncated. by @Sahana2524 in https://github.com/ossf/scorecard/pull/5173\r\n\r\n## Checks\r\n\r\n### Packaging\r\n\r\n- ko publishing workflows are detected with either `imjasonh/setup-ko` or `ko-build/setup-ko`;\r\n  previously the matcher never fired. by @arcaven in https://github.com/ossf/scorecard/pull/5134\r\n\r\n### Pinned-Dependencies\r\n\r\n- Actions referenced from the same repository with GitHub's `$/` prefix (for example `uses:\r\n  $/.github/actions/example`) are treated like `./` local actions and no longer reported as\r\n  unpinned. by @trask with @Kielek in https://github.com/ossf/scorecard/pull/5191\r\n\r\n### Vulnerabilities\r\n\r\n- Python requirements files no longer trigger transitive dependency resolution, which could stall\r\n  the check until it timed out. For library users, `clients.ExperimentalLocalOSVClient` no longer\r\n  makes network requests for transitive resolution. osv-scanner is updated to v2.5.1. by\r\n  @justaugustus with @adilalperenciftci in https://github.com/ossf/scorecard/pull/5296\r\n- Maven dependencies whose version is an unresolved build placeholder (for example\r\n  `@project.version@` or `${revision}`) are no longer reported. by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5306\r\n\r\n### Probes\r\n\r\n- The `unsafeblock` probe also detects Java's `sun.misc.Unsafe` and `jdk.internal.misc.Unsafe`\r\n  classes. by @thomasleplus in https://github.com/ossf/scorecard/pull/4849\r\n\r\n## Docs\r\n\r\n- :book: Set GitLab support for Code-Review and Dependency-Update-Tool by @dvcorreia in\r\n  https://github.com/ossf/scorecard/pull/4963\r\n- \ud83d\udcd6 docs: clarify partial credit logic for Branch-Protection tiers by @aban-alazzeh in\r\n  https://github.com/ossf/scorecard/pull/5010\r\n- :book: Validate Security Insights in CI (and fix the schema) by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5298\r\n\r\n## Other\r\n\r\n- \ud83c\udf31 ci: use ginkgo --flake-attempts instead of nick-invision/retry for e2e tests by @alliasgher in\r\n  https://github.com/ossf/scorecard/pull/5013\r\n- :seedling: update e2e test to account for new vulns by @spencerschrock in\r\n  https://github.com/ossf/scorecard/pull/5159\r\n- :seedling: deps: Upgrade golang.org/x/crypto v0.50.0 => v0.56.0 by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5223\r\n- :seedling: e2e/fuzz: Account for Scorecard API repo migration by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5253\r\n- :seedling: workflows/stale: Stop closing stale pull requests by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5259\r\n- :seedling: dependabot: Add/fix broken `exclude-patterns` in gomod group by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5260\r\n- :seedling: dependabot: Exclude `moby/buildkit` and `goreleaser` from grouped updates by\r\n  @justaugustus in https://github.com/ossf/scorecard/pull/5263\r\n- :seedling: dependabot: Exclude `google/ko` and `go-git` from grouped updates by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5269\r\n- :seedling: go.mod: Bump go-git, containerd, sigstore-go, slack-go, go-pkcs12 by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5271\r\n- :seedling: Bump github.com/prometheus/prometheus to v0.311.3 by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5294\r\n- :seedling: Bump golang.org/x/net from 0.58.0 to 0.60.0 by @justaugustus in\r\n  https://github.com/ossf/scorecard/pull/5311\r\n- :seedling: Bump GoReleaser to v2.18.3 and pin it for releases by @dependabot[bot] in\r\n  https://github.com/ossf/scorecard/pull/5309\r\n\r\n## Known Issues\r\n\r\n- **GitLab: Vulnerabilities returns \u22121** for every GitLab repository\r\n  ([#5056](https://github.com/ossf/scorecard/issues/5056)). A fix is planned for v5.7.0\r\n  ([#5180](https://github.com/ossf/scorecard/pull/5180)).\r\n- **Vulnerabilities: npm bundled dependencies are not checked.** Since the osv-scanner update,\r\n  `package-lock.json` entries without a `resolved` URL, which includes bundled dependencies, are\r\n  skipped when matching known vulnerabilities. This comes from osv-scalibr; we're following up\r\n  upstream.\r\n- **Pinned-Dependencies: findings reached through a YAML alias point at the anchor's line**, not the\r\n  alias. How aliased steps are counted and attributed is tracked in\r\n  [#5291](https://github.com/ossf/scorecard/issues/5291).\r\n\r\n## New Contributors\r\n\r\n- @dvcorreia made their first contribution in https://github.com/ossf/scorecard/pull/4963\r\n- @aban-alazzeh made their first contribution in https://github.com/ossf/scorecard/pull/5010\r\n- @alliasgher made their first contribution in https://github.com/ossf/scorecard/pull/5013\r\n- @thomasleplus made their first contribution in https://github.com/ossf/scorecard/pull/4849\r\n- @pujitha24 made their first contribution in https://github.com/ossf/scorecard/pull/5153\r\n- @Sahana2524 made their first contribution in https://github.com/ossf/scorecard/pull/5173\r\n- @arcaven made their first contribution in https://github.com/ossf/scorecard/pull/5134\r\n\r\n**Full Changelog**: https://github.com/ossf/scorecard/compare/v5.5.0...v5.6.0\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":15}
