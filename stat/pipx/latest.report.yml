{"id":427535911,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCQ1fNs4Ze64n","tag_name":"1.18.9","target_commitish":"8ab8da96cc9b45cd92bfdf472fed550cb73ab88a","name":"1.18.9","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-10-29T06:35:28Z","updated_at":"2026-10-29T06:37:22Z","published_at":"2026-10-29T06:37:22Z","assets":[{"id":687615219,"node_id":"RA_kwDOCQ1fNs4o_Czz","name":"pipx.pyz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":747407,"digest":"sha256:93e83447842bc7e41f5bafd8d2fecae10d977d922058e0204929d827b976566a","download_count":0,"created_at":"2026-10-29T06:37:21Z","updated_at":"2026-10-29T06:37:21Z"}],"body":"<a name=\"release-1-18-9-fixed\"></a>\n\n### Bug fixes\n\n- Extend the 1.18.8 handling of recorded pip arguments to uv's path options and to `--group`. pipx no longer records `--group`, which names a `pyproject.toml` to read packages from, like `-r`. On POSIX, a recorded `--config-file`, `--project`, `--directory`, `--overrides`/`--override` or `--excludes`/`--exclude` that points at a path another account could change stops `pipx upgrade`, `pipx reinstall` and the other replaying commands with the same error as `--find-links`. `pipx list --outdated` runs the same check and reports such an environment as failed instead of querying the recorded location. `pipx runpip` reads its install arguments with the same parser, so it records an install written as `-qe ./project` or `-e./project` as editable ([#2363](https://github.com/pypa/pipx/pull/2363)) by @gaborbernat.\n- When a rebuild fails during a parallel `pipx reinstall-all`, the restored environment gets back the shared app, man page or completion links another environment took while the rebuild had it in the trash, unless something outside this run has replaced them since ([#2371](https://github.com/pypa/pipx/pull/2371)) by @gaborbernat.\n- `pipx run` no longer reuses a cached environment after a change to a variable outside `PIP_*` and `UV_*` that decides which config file pip or uv reads, which proxy or index answers, which certificate is trusted or which credentials are sent, such as `XDG_CONFIG_HOME`, `SSL_CERT_FILE`, `HTTPS_PROXY` or `NETRC`. The values only feed the cache key's hash, so secrets in them stay out of cache paths and logs ([#2364](https://github.com/pypa/pipx/pull/2364)) by @gaborbernat.\n\n[PyPI release](https://pypi.org/project/pipx/1.18.9/)\n\n[Full Changelog](https://github.com/pypa/pipx/compare/1.18.8...1.18.9)\n","mentions_count":1}
