},{"id":632215259,"node_id":"RA_kwDOQz8JRs4lrtbb","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":118278144,"digest":"sha256:fbcf6ecf4f66d923844217c912529f239ee90abfbc8ca198eab46fbde37da9ce","download_count":508,"created_at":"2026-10-12T00:43:27Z","updated_at":"2026-10-12T00:43:33Z"},{"id":632215256,"node_id":"RA_kwDOQz8JRs4lrtbY","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":38858920,"digest":"sha256:246a18a788a01f9f97930d5bef2a81f468dcdc43aadc89a97745a22455971ca1","download_count":23,"created_at":"2026-10-12T00:43:27Z","updated_at":"2026-10-12T00:43:30Z"},{"id":632215518,"node_id":"RA_kwDOQz8JRs4lrtfe","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:4321e4323a2cfdb7fab561a2ae48600789da64da9874dce599d2a0f663740cc9","download_count":620,"created_at":"2026-10-12T00:43:37Z","updated_at":"2026-10-12T00:43:37Z"}],"body":"### Highlights\n\n- OpenCode Go models, including grok-4.7 and gpt-6-luna, now route over the Responses API\n- Hooks expose turn-end token usage, and turn_start/turn_end now fire for one-shot jcode run turns\n- /agents supports per-session worker model overrides\n\n### Improvements\n\n- /resume can open scoped to the current project when display.resume_project_scope is enabled\n- Swarm gains a stalled-worker watchdog, and headless run --socket sessions can join swarms\n- The macOS menu bar helper uses a stable signing identity, draws the streaming icon green, and can be turned off with [menubar] enabled = false\n- Inline images fit their reserved box and the info widget hugs its content\n- Command risk assessment now inspects commands inside $(...), backticks, and heredocs\n- SDK-launched private instances no longer auto-update mid-session and give shorter, more accurate connect errors\n\n### Fixes\n\n- Ctrl/Alt/Cmd shortcuts work on the Korean 2-Set input source\n- The terminal keyboard protocol and TUI modes are restored when jcode exits on a signal\n- Rate-limit and provider reconnect auto-resumes are bounded instead of retrying indefinitely\n- OpenAI streams recover faster from stalls and OAuth token refresh no longer hangs\n- Tool calls emitted as DSML/invoke markup text are recovered instead of lost\n- Kimi reasoning via OpenRouter no longer loses text from non-cumulative snapshots\n- Resumed sessions heal a stale credential route so swarm workers inherit the live one\n- Computer-use screenshots kept in transcripts are bounded in size\n- The browser tool reuses persistent sessions on macOS without opening repeated windows\n- Only one menu bar helper runs when jcode is started with an overridden HOME\n- Swarm member attribution and restart notices are correct\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.94.0...v0.95.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.95.0 -->\n"}
