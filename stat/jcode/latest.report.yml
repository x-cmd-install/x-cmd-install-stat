d\\`.\n- Normalize \\`jarvis\\_user\\` role on soft-interrupt transcripts and suppress always-on Jarvis capture during companion push-to-talk.\n\n## Bundled changes\n\n[View all 3 commits](https://github.com/1jehuang/jcode/compare/0672d6453766031e5ba9960b7e0d731bba14e911...4f874c9ea6b7c3e228045fa8269e4d84bec66a6b)\n- fix(tui): show streaming/finalizing activity label and hide stale websocket detail\n- Publish Linux releases directly via hosted justrust instead of GitHub Actions\n- docs: update weekly stars chart\n\n<!-- jcode-discord-announced:v1.1.2 -->\n"}
