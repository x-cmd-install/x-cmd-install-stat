Z"},{"id":594285285,"node_id":"RA_kwDOQz8JRs4jbBLl","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":111908352,"digest":"sha256:6cd8da9af4aa93f77760d721042af76b3ee6e8dfff4e929c12509dd018db1b00","download_count":1382,"created_at":"2026-09-28T02:28:12Z","updated_at":"2026-09-28T02:28:16Z"},{"id":594285288,"node_id":"RA_kwDOQz8JRs4jbBLo","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":36731287,"digest":"sha256:a818740e23e78ccd63ebba1dd68d13995af7963303ed1fe644b870748b9a0b4d","download_count":65,"created_at":"2026-09-28T02:28:12Z","updated_at":"2026-09-28T02:28:14Z"},{"id":594285483,"node_id":"RA_kwDOQz8JRs4jbBOr","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:906b3d7d05946be464b2a5d3a72f7e1fae47feb94059bd54089ff4c102a9b554","download_count":1886,"created_at":"2026-09-28T02:28:20Z","updated_at":"2026-09-28T02:28:20Z"}],"body":"**Built-in voice input, agent applets, and a pinned session status line**\n\n### Highlights\n\n- Built-in voice input for the CLI, with native microphone capture on macOS and Windows and coding-aware dictation vocabulary\n- The session status line (directory, branch, git status, context, provider, and model) stays pinned below the input, with info widgets showing the detail behind it\n- Agents can show interactive applets, and swarms can message each other across swarms with unique labels\n\n### Improvements\n\n- The Changes widget lists dirty files newest first with line counts and marks the files the agent edited\n- MCP tools load through provider-native deferred loading, so adding or using MCP servers no longer busts the prompt cache\n- Accounts have a persistent auto-switch pool, and failover rotates through it in your chosen order\n- Show an upgrade card and daily feature allowances when a Jcode plan limit is reached\n- The daemon detects KV cache misses and reports them to every client\n- Untitled sessions are named after their first prompt, and save labels name the session\n- Keep your reading position across terminal resizes\n- Support embedded and multiple slash commands in one message\n- The first Ctrl+C clears the input and the second quits\n- Add pre-tool input transformers\n- Add the Yolo-Auto provider, grok-4.7 and grok-4.6 on Cursor, and OpenRouter image support from the model catalog\n- Block lid-close sleep on macOS and Windows while sessions are working\n- Rust and TypeScript SDKs support per-connection SSH identities and pinned host keys\n\n### Fixes\n\n- Antigravity consumer accounts no longer hit 429s from the wrong endpoint\n- Claude usage limits are shared across processes and keep the last good values when throttled\n- MCP servers no longer stall startup or spawn duplicates, and pending requests fail when a stdio server exits\n- Reload exits with an error when the new server never becomes ready\n- Switching models validates against the target provider, and configured default models with a provider prefix match correctly\n- The effort chip follows model changes, and the alternate-enter hint respects queue mode and keymap conflicts\n- Ctrl+Up into prompt history keeps your draft\n- Hooks never flash a console window on Windows\n- DeepSeek Flash and MiMo v2.6 models keep their full context window\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.88.0...v0.89.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.89.0 -->\n"}
