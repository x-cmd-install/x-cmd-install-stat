33Z"},{"id":573902292,"node_id":"RA_kwDOQz8JRs4iNQ3U","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":130455552,"digest":"sha256:827b05de9234622d77d5e32dd0c0ed3579038e64db6c535f210b63172583f908","download_count":1374,"created_at":"2026-09-19T02:25:29Z","updated_at":"2026-09-19T02:25:33Z"},{"id":573902283,"node_id":"RA_kwDOQz8JRs4iNQ3L","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":42197367,"digest":"sha256:3201ef27ad33faac6488a2ec489cfd6c362479b5833bdb11aa6d792b10736b1b","download_count":48,"created_at":"2026-09-19T02:25:29Z","updated_at":"2026-09-19T02:25:31Z"},{"id":573902458,"node_id":"RA_kwDOQz8JRs4iNQ56","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:3c7db6a098c118805ad2ae253d00d4901e4655232eb279b8fe08ff6e76e88a57","download_count":1753,"created_at":"2026-09-19T02:25:35Z","updated_at":"2026-09-19T02:25:36Z"}],"body":"**Configurable swarm effort and richer client workflows**\n\n### Highlights\n\n- Configure root-model reasoning effort independently for swarm and deep swarm, with the selected effort shown in the effort switcher\n- Delegate multi-step browser tasks to a bounded Jev browser session that returns control to the parent agent\n- Create and manage separate panels from Markdown or linked PDFs, with bounded PDF payloads and safe Markdown fallback for older TUI clients\n\n### Improvements\n\n- Model pickers remember route usage and use shared usage-aware ranking across clients\n- Gemini adds project and OAuth-route configuration, and context compaction can be capped below a model's full window\n- Native SDK clients gain cancellable OAuth login, local Git worktree operations, per-turn response and edit statistics, swarm lifecycle metadata, and side-panel snapshots\n- Light terminal themes have clearer contrast while preserving custom colors, with better-aligned resume previews and Markdown blockquote gutters\n- OpenAI tool details begin streaming earlier, and DeepSeek Flash supports image input\n- Desktop source checkouts receive dedicated self-development tools and instructions\n- The initiative command is temporarily unavailable, while existing initiative data is retained\n\n### Fixes\n\n- Active turns survive client reconnects, and restored image attachments retain their positions and batching\n- Grok login and model switching preserve the selected authentication route\n- OAuth-backed Bash calls honor their configured timeouts\n- Ambient configuration changes take effect without restarting the session\n- Development builds are protected against unintended backward updates\n- Gemini retains tool thought signatures and retries transient Code Assist failures without confusing provider sessions with Jcode sessions\n- MCP tools with colliding normalized names remain independently callable without losing their tool policies\n- Compatible tmux sessions request extended keys so Shift+Enter reaches the input editor\n- Project and global prompt guidance no longer appears twice when it resolves to the same source\n- Logs, history and usage displays identify the active provider profile rather than an unrelated route\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.84.0...v0.85.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.85.0 -->\n","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":6,"rocket":0,"eyes":0}}
