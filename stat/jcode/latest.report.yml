6Z"},{"id":614466189,"node_id":"RA_kwDOQz8JRs4koAKN","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":115020288,"digest":"sha256:01cfad20a9a7ba4c5f9bd0ad65942a61c1e5c4303688067d58f65f479e50d327","download_count":1929,"created_at":"2026-10-06T04:25:44Z","updated_at":"2026-10-06T04:25:47Z"},{"id":614466187,"node_id":"RA_kwDOQz8JRs4koAKL","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":37703256,"digest":"sha256:789e132d596d43ad4a8ca3d965f067b0a93d278d8db82899178ce30dbdb9a79a","download_count":75,"created_at":"2026-10-06T04:25:44Z","updated_at":"2026-10-06T04:25:46Z"},{"id":614466367,"node_id":"RA_kwDOQz8JRs4koAM_","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:63120e62fb3cb6cfdae429ac23a32c54f179f10296bff5b7191848e0c770799c","download_count":2344,"created_at":"2026-10-06T04:25:50Z","updated_at":"2026-10-06T04:25:50Z"}],"body":"**Google Calendar and speed tiers**\n\n### Highlights\n\n- Google login lets you pick which services to connect and adds a built-in calendar tool for viewing, creating, updating, and deleting events\n- Guided Google OAuth app setup that detects existing gcloud credentials, validates generated project IDs, and imports the app automatically\n- Alt+Up/Down cycles the speed tier between Standard, Fast, and Ultrafast\n- New /desktop command opens the current session in Jcode Desktop\n\n### Improvements\n\n- MCP tool results and mcp_search output are fitted to token budgets instead of fixed caps, and accept_large_output returns the full result\n- The mcp list action lists only tool names, and mcp_search ranks name matches first\n- Todo quality gates share rows instead of taking one line each\n\n### Fixes\n\n- Browser actions target the right browser when several run the bridge extension\n- Interrupting a coordinator stops the swarm workers it spawned (thanks @SiavZ)\n- A per-call swarm spawn_mode of auto defers to your configured mode (thanks @SiavZ)\n- /restart and /reload from a remote client no longer wipe the server's transcript (thanks @SiavZ)\n- The shared server reloads after an install repoints the link it started from (thanks @SiavZ)\n- run --json and --ndjson report the local or direct profile instead of openrouter\n- Fixed swarm plan and status handlers that could stall the server\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.90.1...v0.91.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.91.0 -->\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":1}
