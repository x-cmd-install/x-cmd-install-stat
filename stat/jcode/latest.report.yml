:"2026-10-22T14:55:56Z"}],"body":"**OpenAI request fix and stability**\n\n### Highlights\n\n- Fix OpenAI models failing every turn with invalid_request_error due to a rejected tool schema\n- Recover the TUI from a vanished or unresponsive server instead of retrying forever\n- Native Muse subscription login and Venice AI provider support\n\n### Improvements\n\n- Add configurable Kagi web search backend\n- Add persistent /latex rendering controls\n- Show live stopwatch, context, and token stats per swarm worker\n\n### Fixes\n\n- Honor the configured model for fresh sessions\n- Report token counts for OpenAI native compaction\n- Reject stale patch hunks before any file changes\n- Keep swarm workers alive across reloads\n- Fix OAuth credential handoff and stale daemon token recovery\n- Fix Kitty images in Zellij\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.99.0...v0.99.1\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n\nWindows executables are **unsigned**. Azure Artifact Signing is not configured and the repository's existing `WINDOWS_SIGNING_REQUIRED=false` override allowed unsigned publication. Windows may show publisher or SmartScreen warnings.\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.99.1 -->\n","reactions":{"total_count":5,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":1,"eyes":0}}
