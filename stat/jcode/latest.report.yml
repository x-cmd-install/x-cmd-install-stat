26-10-15T00:11:15Z"}],"body":"**Faster idle sessions and richer responses**\n\n### Highlights\n\n- Reduce idle CPU and disk reads in repositories with many untracked files\n- Share model catalog processing across equivalent clients while keeping usage and account state fresh\n- Allow Desktop-capable clients to receive Markdown responses through the new user_response tool\n\n### Improvements\n\n- Show compact context usage before and after compaction\n- Open the resume picker immediately while session scanning continues in the background\n- Disable automatic memory recall while retaining explicit memory search\n- Display large recorded token and cost summaries compactly\n\n### Fixes\n\n- Recover browser handoffs from runtime provider failures using direct browser actions\n- Restore Windows companion connections over named pipes\n- Expose global user-session connection presence to SDK clients\n- Keep worker emoji placement consistent in the swarm status strip\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.97.0...v0.98.1\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.98.1 -->\n\n\n## Windows signature status\n\nWindows x86_64 and ARM64 executables are **unsigned**. Azure Artifact Signing is not configured and the repository's existing `WINDOWS_SIGNING_REQUIRED=false` override allowed unsigned publication. Windows may show publisher or SmartScreen warnings. SHA-256 checksums are provided for download integrity.\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
