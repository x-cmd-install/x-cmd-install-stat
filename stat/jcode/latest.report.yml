},{"id":603722354,"node_id":"RA_kwDOQz8JRs4j_BJy","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113678336,"digest":"sha256:82198011d78d1f725b97bbaf978315ae3058cb289ab5b5063771667ddbb626d0","download_count":582,"created_at":"2026-10-01T17:05:38Z","updated_at":"2026-10-01T17:05:42Z"},{"id":603722352,"node_id":"RA_kwDOQz8JRs4j_BJw","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":37263919,"digest":"sha256:5e86849f9a91efd69a3be70830a5786e1d3d73ed56d824dd2f19525c38d2e39e","download_count":25,"created_at":"2026-10-01T17:05:38Z","updated_at":"2026-10-01T17:05:40Z"},{"id":603722615,"node_id":"RA_kwDOQz8JRs4j_BN3","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:67b9de156a6409ada68929946b824594fa2fe61802005c27d765843c6d6089ed","download_count":853,"created_at":"2026-10-01T17:05:45Z","updated_at":"2026-10-01T17:05:45Z"}],"body":"**Provider-native web search**\n\n### Highlights\n\n- Web search now uses your model provider's own server-side search (Anthropic and OpenAI) by default instead of scraping from your machine, shown as regular web search rows live and on resume (thanks @johnnyfish)\n\n### Improvements\n\n- Set websearch.prefer_native = false or JCODE_WEBSEARCH_PREFER_NATIVE=0 to keep using local search engines\n- Provider-side search follows each session's allowed and disabled tool policy\n- SDK apps that register their own websearch tool keep it instead of having it replaced by provider search\n- Installing a skill mid-session no longer invalidates the prompt cache, so the next turn stays fast and cheap\n- When switching providers, earlier native search results are summarized clearly so the model does not retract correct answers\n\n### Fixes\n\n- OpenAI login validation no longer hangs when the account hits a usage limit\n- Retrying a turn no longer leaves web search rows from the aborted attempt\n- Interrupted Anthropic turns that used native search no longer risk a request error on the next message\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.89.3...v0.90.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.90.0 -->\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":2,"eyes":0},"mentions_count":1}
