},{"id":624147234,"node_id":"RA_kwDOQz8JRs4lM7si","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":116676608,"digest":"sha256:66bb48d2672f97815d229ab3f4173206cae53ce2b0a8f3b287f131ba9a4af59d","download_count":1172,"created_at":"2026-10-09T06:45:54Z","updated_at":"2026-10-09T06:45:59Z"},{"id":624147238,"node_id":"RA_kwDOQz8JRs4lM7sm","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":38385358,"digest":"sha256:b5207968ff36a3a0ed5a0bc39b531cc8577397af82b3d7b1e22731e4a40875dc","download_count":46,"created_at":"2026-10-09T06:45:54Z","updated_at":"2026-10-09T06:45:56Z"},{"id":624147471,"node_id":"RA_kwDOQz8JRs4lM7wP","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:24e323d3118fed507410fe87ec578a3157284b7ee02eb08d60caaee1a3cc8343","download_count":1367,"created_at":"2026-10-09T06:46:01Z","updated_at":"2026-10-09T06:46:01Z"}],"body":"**Instant startup**\n\n### Highlights\n\n- New sessions paint their first frame in about 20ms instead of about 135ms, and the screen no longer shifts while connecting\n- Opening several sessions in quick succession is fast again, and resuming large sessions is about three times quicker\n- New post_tool_feedback hook feeds a script's output back to the model after each tool call, and post_tool hooks now receive the tool input, call id, and touched paths\n\n### Improvements\n\n- The jcode: model prefix and JCODE_OPENROUTER_MODEL are honored, and jcode run fails clearly when --model cannot be applied\n- Onboarding predicts your default provider and model from existing logins\n- Expired status notices clear on their own without waiting for a keypress\n- Old build binaries and stale scratch files are pruned automatically\n- Web search hints no longer recommend the retired Bing Search API\n- jcode builds on FreeBSD\n\n### Fixes\n\n- New sessions no longer show \"Waiting for reload handoff\" right after a reload\n- --provider-profile works with Anthropic-compatible profiles\n- Copy selections that end inside a wide character include that character\n- The warning gate fails closed on cargo check errors and prints the diagnostics\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.92.0...v0.93.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.93.0 -->\n"}
