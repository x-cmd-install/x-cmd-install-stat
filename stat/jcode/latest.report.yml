7Z"},{"id":583649591,"node_id":"RA_kwDOQz8JRs4iyck3","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":110169088,"digest":"sha256:c194f970ffafb9e43c7ae9f80f1eec27200fcd42ef1c536ccecc16235702e69e","download_count":1873,"created_at":"2026-09-23T11:39:11Z","updated_at":"2026-09-23T11:39:18Z"},{"id":583649590,"node_id":"RA_kwDOQz8JRs4iyck2","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":36206791,"digest":"sha256:68178d76a9305e5febcb0313e05b3b42dd404d4a0dfb5c7aa521757a568c2422","download_count":81,"created_at":"2026-09-23T11:39:11Z","updated_at":"2026-09-23T11:39:15Z"},{"id":583649851,"node_id":"RA_kwDOQz8JRs4iyco7","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:7a64b8310343aad1debc61199d6b83e48d796316236078cec7e774b0a3144493","download_count":2531,"created_at":"2026-09-23T11:39:21Z","updated_at":"2026-09-23T11:39:21Z"}],"body":"**Claude Opus 5.5 default, multi-browser support, and banked usage resets**\n\n### Highlights\n\n- Claude Opus 5.5 at medium effort is now the default Anthropic model, and anthropic-api: model specs use the native Anthropic runtime\n- The browser tool detects your default browser and supports Chrome, Edge, Brave, Chromium, and Safari in addition to Firefox\n- Reset exhausted OpenAI usage with banked resets through a confirmed command, with a hint shown when your account has one available\n\n### Improvements\n\n- The edit tool now applies multiple replacements atomically, replacing the separate multiedit tool\n- Saved sessions always appear in the session list even when they are older than the recency limit, and /save bookmarks persist through later writes\n- Voice input starts recording immediately without waiting for the Nari connection, keeps your first words, and recognizes Jcode product vocabulary\n- Unclear voice requests are routed to the coding agent instead of being dropped as uncertain\n- Importing credentials from other tools never overrides logins Jcode already has\n- Add OrcaRouter as a provider choice for jcode login and --provider\n- Parallel tool calls stream their names and inputs as soon as they arrive\n- Rust and TypeScript SDK clients can set per-session system prompts, enforce tool policies, and receive structured reasons for abnormal turn stops\n- The auth badge updates immediately when switching between OAuth and API-key routes\n- Add /merge-remote-release to merge the current branch and trigger a CI release in one step\n\n### Fixes\n\n- Saving settings from the CLI no longer erases Jcode Desktop settings in the shared config file\n- Visible swarm agents keep their chosen model, provider, and effort when their window attaches\n- Proxy tool arguments are preserved until the stream completes\n- Interleaved streaming tool calls from OpenAI stay matched to the correct call\n- Todo quality checks stay quiet after the final response, and the usage reset review flow shows credit expirations\n- Long TLDR swarm summaries are accepted, and null bash notification flags fall back to defaults\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.87.1...v0.88.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.88.0 -->\n"}
