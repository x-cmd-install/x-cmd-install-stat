{"id":611220267,"node_id":"RA_kwDOQz8JRs4kbnsr","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":114491904,"digest":"sha256:2069fb7b1951b0c7d88b8adab2e018084451e1583de66d36a4423bbc538c1fc5","download_count":265,"created_at":"2026-10-05T02:11:43Z","updated_at":"2026-10-05T02:11:48Z"},{"id":611220266,"node_id":"RA_kwDOQz8JRs4kbnsq","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":37531934,"digest":"sha256:3b3439ff816ff41a07667f38e0a7f98b45c4d3c334c6c5737089e8fe2c27c673","download_count":11,"created_at":"2026-10-05T02:11:43Z","updated_at":"2026-10-05T02:11:45Z"},{"id":611220424,"node_id":"RA_kwDOQz8JRs4kbnvI","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:c4f35517f07bfe3f478b2f53b3021cfbcb3ef75126541978e555ab01a6d27592","download_count":468,"created_at":"2026-10-05T02:11:51Z","updated_at":"2026-10-05T02:11:52Z"}],"body":"**Provider reliability and fixes**\n\n### Highlights\n\n- OpenAI-compatible providers that answer 529 or another 5xx \"heavy usage\" error are now retried automatically instead of failing the turn, and the error no longer blames your network\n- /usage shows real quota windows for Kimi Code, Cursor, and the Z.ai Coding Plan (thanks @ghoker143)\n- Pressing Esc while a follow-up prompt is pending stops the current turn and runs the follow-up (thanks @SiavZ)\n\n### Improvements\n\n- Copilot accepts reasoning effort for every model whose catalog advertises it and sends it on both the Responses and Chat Completions APIs\n- Saved API keys stay in their env files instead of the running process, so editing a key file takes effect without a restart\n- The client shows the context window the server resolved instead of a placeholder\n- The jcode log records which binary actually launched, to diagnose stale copies on PATH\n- Gmail can update, list, and delete drafts\n- Undo in the composer reverts a whole typing burst at once, including Korean and other IME input (thanks @mg-mg-mg)\n- Cost estimates for OpenAI-compatible profiles fall back to a matching model from another provider's price catalog (thanks @ogodevonline)\n- Edit tool rows show their intent, and the expand badge appears in every diff mode\n\n### Fixes\n\n- DeepSeek enabled through --provider auto uses its own default model and 1M context instead of anthropic/claude-sonnet-4 with 200K\n- In-app updates on Termux patch the glibc ELF interpreter like the installer does, and refuse to switch to a binary that cannot run\n- Configured /colors roles now apply on 256-color terminals\n- Images in formats providers reject are no longer stored or sent, and sessions self-heal from the resulting 400 errors\n- Session saves are drained on SIGTERM, and an interrupted checkpoint can no longer duplicate history\n- Anthropic history repair: orphaned or late tool results and orphaned native web searches no longer cause request errors\n- Malformed tool calls are corrected within a bounded number of retries instead of looping\n- Auto-poke re-arms when new open work appears after the completion gate trips\n- /accounting is no longer parsed as /account\n- The crash detector no longer reports a session that closed while idle as interrupted (thanks @SK-DEV-AI)\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.90.0...v0.90.1\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.90.1 -->\n","mentions_count":5}
