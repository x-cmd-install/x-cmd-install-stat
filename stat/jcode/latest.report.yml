},{"id":599087681,"node_id":"RA_kwDOQz8JRs4jtVpB","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113149440,"digest":"sha256:e73a56ff0538868b8d5da0251a34ad0c9cb0e9cd1c13b9675eba4016ad695bcf","download_count":550,"created_at":"2026-09-29T19:57:27Z","updated_at":"2026-09-29T19:57:35Z"},{"id":599087687,"node_id":"RA_kwDOQz8JRs4jtVpH","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":37121683,"digest":"sha256:4ca0e7771ed08cd47a0735aebebef48eb4eb5570e5ba32f9503beba9beeee818","download_count":28,"created_at":"2026-09-29T19:57:27Z","updated_at":"2026-09-29T19:57:30Z"},{"id":599088034,"node_id":"RA_kwDOQz8JRs4jtVui","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":836,"digest":"sha256:54b1541db53975e9e77f570adbcc3d06c36ecd03e2c38bcbf6f14f283ec60e14","download_count":809,"created_at":"2026-09-29T19:57:37Z","updated_at":"2026-09-29T19:57:37Z"}],"body":"**Herdr support and /cloud session moves**\n\n### Highlights\n\n- jcode is now a first-class agent in herdr: its name and working/idle state show in the sidebar and herdr agent list, herdr agent wait works on it, and after a herdr restart the pane reopens the same jcode session\n- /cloud and /local move a live session, including uncommitted code, to a cloud host and back\n\n### Improvements\n\n- herdr reports run in the background with a short timeout, so herdr can never slow jcode down, and jcode releases the pane when you quit\n\n### Fixes\n\n- Usage telemetry now counts tokens from responses that fail mid-stream, crashed sessions, compaction, and background agents\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.89.2...v0.89.3\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.89.3 -->\n"}
