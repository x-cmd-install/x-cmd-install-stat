5Z"},{"id":654841640,"node_id":"RA_kwDOQz8JRs4nCBco","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":133010944,"digest":"sha256:c4a0699e17daf780c468238c0c0f88f950b28fac6acd7b5ebc08cf547f07168e","download_count":1926,"created_at":"2026-10-19T00:33:32Z","updated_at":"2026-10-19T00:33:38Z"},{"id":654841638,"node_id":"RA_kwDOQz8JRs4nCBcm","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":45798386,"digest":"sha256:f2c74f8aa2bc88e8507fd830d3adfeb7e0493e54010c4630c2ab41c1a54d4e88","download_count":66,"created_at":"2026-10-19T00:33:32Z","updated_at":"2026-10-19T00:33:36Z"},{"id":654841801,"node_id":"RA_kwDOQz8JRs4nCBfJ","name":"release-provenance.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":526,"digest":"sha256:82dd88cd92ff379f8c2fe60f2b8bc417a3852f5ecaabb0e98e27cb3a998f67c2","download_count":20,"created_at":"2026-10-19T00:33:41Z","updated_at":"2026-10-19T00:33:41Z"},{"id":654841804,"node_id":"RA_kwDOQz8JRs4nCBfM","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":926,"digest":"sha256:c5170609e8402d2896a55571c2a85cf05f865cc5106a11150b65728a88bef050","download_count":2054,"created_at":"2026-10-19T00:33:41Z","updated_at":"2026-10-19T00:33:41Z"}],"body":"**Account failover, hibernation, and faster reloads**\n\n### Highlights\n\n- Automatically retry turns on the next pool account when one hits a usage limit, including for Desktop and SDK clients\n- Hibernate idle sessions to free memory, with measured RAM status and transparent wake on the next interaction\n- Reload and resume large sessions much faster by showing the local transcript immediately and sending only new history\n\n### Improvements\n\n- Support OpenAI Ultrafast speed tiers for GPT-6.1 Sol, with Fast commands and hotkeys that apply promptly\n- Show saved accounts, cached quotas, and available resets in the startup account router and usage cards\n- Polish usage cards with responsive gauges and compact Mil and Bil token totals\n- Offer additional OAuth accounts in the login picker and reauthenticate saved accounts from it\n- Show cache misses inline with more accurate cache reuse diagnostics\n- Show Jcode inference spending balance\n- Compress OpenAI and Anthropic request bodies to reduce upload time\n- Build the /model picker off the UI thread for large remote catalogs\n- Reconnect only changed MCP servers instead of restarting all of them\n- Simplify swarm mode by removing the task graph and defaulting swarm root effort to low\n\n### Fixes\n\n- Keep startup headers and account rows on a single line at narrow widths\n- Show usage-limit rejections clearly instead of stale quota bars\n- Fix forked sessions failing on replayed Anthropic web search blocks\n- Count Gemini thinking and tool-use tokens correctly in usage\n- Keep streamed OpenAI output when the completion payload arrives empty\n- Preserve token usage when requests are cancelled or fail\n- Fix Windows named-pipe connections hanging or failing on startup probes\n- Fix Firefox cold starts blocked by stale zombie processes\n- Collapse expanded pinned todos and restore overall progress display\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v0.98.1...v0.99.0\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n\nWindows executables are **unsigned**. Azure Artifact Signing is not configured and the repository's existing `WINDOWS_SIGNING_REQUIRED=false` override allowed unsigned publication. Windows may show publisher or SmartScreen warnings.\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-announced:v0.99.0 -->\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0}}
