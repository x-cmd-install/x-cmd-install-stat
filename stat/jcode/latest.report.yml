adge\n- fix(deps): update url to 2.5.9 for RUSTSEC-2026-0592\n- test(tui): update login prompt and progress card test assertions for v1.1.0\n\n## Bundled changes\n\n[View all 19 commits](https://github.com/1jehuang/jcode/compare/a43cd3e1cc230e7776f8cc9b826cf519bd0de939...0672d6453766031e5ba9960b7e0d731bba14e911)\n- fix(ci): resolve formatting, clippy, dead-code, and guardrail baselines for v1.1.0\n- chore(release): prepare v1.1.0\n- Normalize jarvis\\_user role on SoftInterruptInjected so final transcripts render cleanly\n- Synthesize transcripts, sanitize captures, and auto-attach selfdev Discord UI diffs\n- feat(tui,selfdev): top /login starter providers (OpenAI, Anthropic, Gemini, API key, Auto Import) and selfdev screenshot/before-after actions\n- release: add --before-crop-rows/--after-crop-rows and 1:1 vertical padding to compose\\_before\\_after.py\n- release: vector-draw box-drawing borders and fallback font for ★/☆ in compose\\_before\\_after.py\n- Default Jarvis Jev action\\_probability threshold to 0.5\n- Suppress always-on Jarvis capture during companion push-to-talk\n- release: require visually inspecting generated Before/After PNGs with read before attaching\n- release: fix HiDPI header/badge scaling, 2-pass bg/text rendering, and vector ▰/▱ bars in compose\\_before\\_after.py\n\n<!-- jcode-discord-announced:v1.1.1 -->\n"}
