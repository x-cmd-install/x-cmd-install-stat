{"id":777812825,"node_id":"RA_kwDOQz8JRs4uXHtZ","name":"jcode-windows-x86_64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":154304512,"digest":"sha256:3c929e46b2facc14a21032f845d26c0e2a80a7a9d008cb64c4845fa4434d30dd","download_count":340,"created_at":"2026-11-22T04:03:15Z","updated_at":"2026-11-22T04:03:21Z"},{"id":777812817,"node_id":"RA_kwDOQz8JRs4uXHtR","name":"jcode-windows-x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":53003830,"digest":"sha256:de40f140d0d91902df1ed0e885bbdd8532bcaba49157afe5d69c875677f2877d","download_count":17,"created_at":"2026-11-22T04:03:14Z","updated_at":"2026-11-22T04:03:16Z"},{"id":777813032,"node_id":"RA_kwDOQz8JRs4uXHwo","name":"release-provenance.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":525,"digest":"sha256:70c5509222c4988b317a4d460e785c1bc584817210e889385e4b8bfbd29cd76f","download_count":5,"created_at":"2026-11-22T04:03:22Z","updated_at":"2026-11-22T04:03:23Z"},{"id":777813181,"node_id":"RA_kwDOQz8JRs4uXHy9","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":926,"digest":"sha256:640d4133e703ac5350b872d8d0057dade7a5f292ab01390498ed7751cf00b1c2","download_count":331,"created_at":"2026-11-22T04:03:28Z","updated_at":"2026-11-22T04:03:28Z"}],"body":"**Antigravity Google login, scriptable API-key setup, and always-on Jarvis voice**\n\n### Highlights\n\n- Google personal accounts now sign in through Antigravity with Gemini 4 (Neon) as the default model and pooled Gemini, Argon, and Claude quota bars in the account router.\n- Every API-key provider now supports non-interactive login with --api-key, --api-key-env, and --json, including scripted AWS Bedrock and Azure OpenAI setup.\n- Always-on Jarvis voice now streams live captions as you speak, recovers automatically after network outages, and keeps a session-only replay history of accepted requests.\n\n### Improvements\n\n- Model and fuzzy pickers now rank literal substring matches ahead of typo and usage-boosted loose matches.\n- Todo lists now support withdrawing tasks by name with archived reasons while keeping retired and delegated work out of active reminders.\n- Queued follow-up messages now preserve image attachments and are delivered before retrying empty post-tool answers.\n- Long-running background tasks now trigger a one-time review after five minutes, while routine swarm wait receipts stay hidden from the transcript.\n- macOS menu bar session counts now render with native contrast, including 0/0 when idle.\n\n### Fixes\n\n- Reading a 13th screenshot no longer drops earlier images or invalidates the prompt cache just because of image count (retains tool images up to 48 MiB).\n- Retired Gemini Code Assist personal OAuth entries are hidden from login pickers and routed to Antigravity instead.\n- Jarvis speech playback waits until the microphone is quiet and keeps live captions, provisional turns, and final transcripts ordered per utterance.\n- Coordinator interrupts in swarms now stay scoped to the addressed session rather than interrupting unrelated workers.\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v1.0.1...v1.0.3\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n\nWindows executables are **unsigned**. Azure Artifact Signing is not configured and the repository's existing `WINDOWS_SIGNING_REQUIRED=false` override allowed unsigned publication. Windows may show publisher or SmartScreen warnings.\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-part:v1.0.3:cdd3cc207d35651ee12415fe298d0137e77b9e05df76a1a7fa46883c05184046:1:sent:1573911905091981324 -->\n\n<!-- jcode-discord-announced:v1.0.3 -->\n"}
