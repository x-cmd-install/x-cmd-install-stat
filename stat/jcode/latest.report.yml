-11-18T13:08:49Z"}],"body":"**Model catalog fix**\n\n### Highlights\n\n- Newly released models such as GPT-6.2 Sol appear in the model picker even when live catalog updates arrive while an agent is busy\n\n### Fixes\n\n- Retain model catalog updates that arrive while agents are busy instead of dropping them\n- Update lettre, anyhow, event-listener, and tokio for new RustSec advisories\n\n**Full changelog**: https://github.com/1jehuang/jcode/compare/v1.0.0...v1.0.1\n\n<!-- jcode-platform-availability:start -->\n## Platform availability\n\n- Linux x86_64: available\n- Linux aarch64: available\n- macOS Apple Silicon: available\n- macOS Intel: available\n- Windows x86_64: available\n- Windows ARM64: available\n- FreeBSD x86_64: available\n\nWindows executables are **unsigned**. Azure Artifact Signing is not configured and the repository's existing `WINDOWS_SIGNING_REQUIRED=false` override allowed unsigned publication. Windows may show publisher or SmartScreen warnings.\n<!-- jcode-platform-availability:end -->\n\n<!-- jcode-discord-part:v1.0.1:efb58f7c5a65ad3f940a73c2737c275c7c90992777f22c71b534a423a1ced365:1:sent:1572599613989322823 -->\n\n<!-- jcode-discord-announced:v1.0.1 -->\n"}
