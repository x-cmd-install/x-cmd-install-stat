{"id":330045840,"author":{"login":"bao-byterover","id":244459964,"node_id":"U_kgDODpIpvA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOO-qlQc4TrBmQ","tag_name":"v3.16.1","target_commitish":"main","name":"ByteRover CLI 3.16.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-05-27T08:56:53Z","updated_at":"2026-05-27T09:12:27Z","published_at":"2026-05-27T09:12:27Z","assets":[],"body":"ByteRover CLI 3.16.1 is a small patch release with one fix: a valid login is no longer misread at startup, so a signed-in session stays signed in across restarts. No more being bounced to the provider picker or asked to run `brv login` again on every launch. Safe to upgrade, with no behavior change and nothing to reconfigure.\r\n\r\n## What's Changed\r\n\r\n### \ud83d\udc1b Fixed\r\n\r\n* **Stay signed in across restarts.** A valid login could be misread when the CLI started up, which dropped you into the provider picker and asked you to run `brv login` again on every launch. The CLI now reads your auth state correctly, so once you are signed in you stay signed in. By @bao-byterover in #709\r\n\r\n## \ud83d\ude80 Upgrade & Install\r\n\r\n**Fresh install (macOS / Linux):**\r\n\r\n```sh\r\ncurl -fsSL https://byterover.dev/install.sh | sh\r\n```\r\n\r\n**Existing users:** re-run the installer above to upgrade in place, then run `brv restart` so the daemon picks up the new version.\r\n\r\n## \u2705 No Breaking Changes\r\n\r\nFully backward compatible. Your provider connections, settings, context trees, and connected agents keep working with no migration.\r\n\r\n## \ud83d\ude4f Contributors\r\n\r\nThanks to @bao-byterover for shipping this release.\r\n\r\n**Full Changelog**: https://github.com/campfirein/byterover-cli/compare/v3.16.0...v3.16.1\r\n","mentions_count":1}
