\n[Documentation](https://cluster-api-aws.sigs.k8s.io/)\r\n\r\n# Changelog since v2.13.0\r\n\r\n## Changes by Kind\r\n\r\n### Feature\r\n\r\n- Feat(rosa): add `ec2MetadataHttpTokens` field to ROSAControlPlane CRD to allow enforcing IMDSv2 on ROSA HCP cluster EC2 instances (#6265, @andclt)\r\n\r\n\r\nThe images for this release are: `registry.k8s.io/cluster-api-aws/cluster-api-aws-controller:v2.13.1`\r\n\r\nThanks to all our contributors.\r\n","mentions_count":1}
