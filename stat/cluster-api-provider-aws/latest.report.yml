terctl-aws-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":84466688,"digest":"sha256:b3377a211546c889f9b01ab7e54300a45472bc46fca3636dc3a4c71f9201c84a","download_count":7,"created_at":"2026-07-29T15:59:43Z","updated_at":"2026-07-29T15:59:45Z"},{"id":494234189,"node_id":"RA_kwDOCHDJVc4ddWpN","name":"infrastructure-components.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/yaml","state":"uploaded","size":1215540,"digest":"sha256:6dad6c6e553ed3d2fbddc91b2c2b6926a531e056a8574ad3c045b2607876c128","download_count":1960,"created_at":"2026-07-29T16:00:04Z","updated_at":"2026-07-29T16:00:04Z"},{"id":494234187,"node_id":"RA_kwDOCHDJVc4ddWpL","name":"metadata.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/yaml","state":"uploaded","size":1483,"digest":"sha256:5b8f97c9f03ab0f77621bbbbf8b15383c47c63c42f43a523fe4a1da6bd1b3e3a","download_count":7030,"created_at":"2026-07-29T16:00:04Z","updated_at":"2026-07-29T16:00:04Z"},{"id":494234175,"node_id":"RA_kwDOCHDJVc4ddWo_","name":"rosa-network.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/yaml","state":"uploaded","size":336,"digest":"sha256:eb13af3ae422a33d0541be706771a6af86798c59b984cc4fbf7aab34cf2ffa57","download_count":4,"created_at":"2026-07-29T16:00:03Z","updated_at":"2026-07-29T16:00:03Z"}],"body":"# Release notes for Cluster API Provider AWS (CAPA) v2.13.0\r\n\r\n[Documentation](https://cluster-api-aws.sigs.k8s.io/)\r\n\r\n# Changelog since v2.13.0\r\n\r\n<!-- Release notes generated using configuration in .github/release.yml at v2.13.0 -->\r\n\r\n## What's Changed\r\n### \u26a0 API Changes\r\n- \u2728 ROSAControlPlane now supports optional `spec.deleteProtection` and reports live protection state in `status.deleteProtection`. When enabled, CAPA syncs the setting to OCM. Deleting the ROSAControlPlane CR while protection is enabled removes the CR without cascading deletion to the ROSA cluster in OCM. (#6122, @michaelryanmcneill)\r\n### \ud83d\udc1b Bug Fixes\r\n- \ud83d\udc1bfix: bump image-builder version for AMI builds. (#6161, @richardcase)\r\n- \ud83d\udc1b fix: duplicate EC2 instance creation caused by deferred ProviderID persistence combined with EC2 API eventual consistency (#6132, @stefanonardo)\r\n- \ud83d\udc1b fix(clusterawsadm): allow zero results in release-tool ami find-missing-ami (#6158, @richardcase)\r\n- \ud83d\udc1bfix: prevented the AWSCluster validating webhook from panicking when removal of an existing secondary control plane load balancer is attempted. The update now returns a clear validation error. (#6130, @thc1006)\r\n- \ud83d\udc1b fix: set correct region when building AMIs automatically. (#6160, @richardcase)\r\n- \ud83d\udc1b fix(ROSA): infinite OCM API request loop when failed with a persistent error. (#6128, @serngawy)\r\n- \ud83d\udc1b fix(ROSA): ROSAOCMRoleConfig CRD not being deployed when using clusterctl with ROSA=true (#6141, @andclt)\r\n### \ud83c\udf31 Others\r\n- \ud83c\udf31 cleanup: change the number of k8s versions to detect to 1 minor version (down from 3). (#6155, @richardcase)\r\n- \ud83c\udf31  chore(bump): golang.org/x pkgs (#6164, @damdo)\r\n- \ud83c\udf31 chore(bump): bump Go to 1.25 (#6135, @damdo)\r\n- \ud83c\udf31 chore(e2e): bump workload cluster Kubernetes to v1.34.10 (#6159, @damdo)\r\n- \ud83c\udf31 chore(bump): Kubernetes 1.35 and Cluster API 1.13 (#6150, @damdo)\r\n\r\nThe images for this release are:\r\n\r\n `registry.k8s.io/cluster-api-aws/cluster-api-aws-controller:v2.13.0`\r\n\r\nThanks to all our contributors.","mentions_count":7}
