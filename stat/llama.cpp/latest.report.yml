{"id":382983051,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJH_K4M4W09uL","tag_name":"v0.4.0","target_commitish":"427291b5b34cd914a31b3fd3b61a68f6184f4b9f","name":"v0.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-04T19:56:41Z","updated_at":"2026-09-04T19:57:12Z","published_at":"2026-09-04T19:56:47Z","assets":[{"id":544827776,"node_id":"RA_kwDOJH_K4M4geWmA","name":"nightly-tag.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json; charset=utf-8","state":"uploaded","size":7,"digest":"sha256:bd0afc13ffe4aaa2f02eb7df8882a2617907d7f232012ae2ca0f21f6b865fbe0","download_count":5714,"created_at":"2026-09-04T19:56:48Z","updated_at":"2026-09-04T19:56:48Z"}],"body":"## Overview\r\n\r\nllama.cpp 0.4.0 adds initial Qwen3.8-Flash-Next and Nemotron-3-Puzzle support, on-demand tensor reading, per-slot server context limits, video input options, and a ggml update to 0.23.0 with major sparse flash attention and RDMA work.\r\n\r\n### API changes\r\n\r\n- Added `llama_lazy_mode` and `lazy_mode` ([#27794](https://github.com/ggml-org/llama.cpp/pull/27794)).\r\n- Added `max_buf_size` to quantize params ([#27795](https://github.com/ggml-org/llama.cpp/pull/27795)).\r\n- Bumped session/state versions for KV-cell token tracking ([#27762](https://github.com/ggml-org/llama.cpp/pull/27762)).\r\n- Added `mtmd_input_part` and `mtmd_tokenize_from_parts()` ([#28250](https://github.com/ggml-org/llama.cpp/pull/28250)).\r\n- Made `mtmd_tokenize` const-correct ([#28310](https://github.com/ggml-org/llama.cpp/pull/28310)).\r\n- Made `mtmd_bitmap_init_lazy` const-correct ([#28307](https://github.com/ggml-org/llama.cpp/pull/28307)).\r\n- Added mtmd helper video/init options ([#24318](https://github.com/ggml-org/llama.cpp/pull/24318)).\r\n- Server multimodal helpers accept `mtmd_helper_init_opt` ([#24318](https://github.com/ggml-org/llama.cpp/pull/24318)).\r\n\r\n### New models\r\n\r\n- Added initial Qwen3.8-Flash-Next (`qwen4exp`) architecture support; optimization improvements are still pending ([#27742](https://github.com/ggml-org/llama.cpp/pull/27742)).\r\n- Added NVIDIA Nemotron-3-Puzzle-75B-A9B support ([#25444](https://github.com/ggml-org/llama.cpp/pull/25444)).\r\n- Added DSpark support for Nemotron 3.5 ([#27804](https://github.com/ggml-org/llama.cpp/pull/27804)).\r\n- Added support for nanbeige4.2-3B ([#27730](https://github.com/ggml-org/llama.cpp/pull/27730)).\r\n\r\n### Core changes\r\n\r\n- Added lazy tensor reading ([#27794](https://github.com/ggml-org/llama.cpp/pull/27794)).\r\n- Renamed option to `--lazy-mode` ([#27969](https://github.com/ggml-org/llama.cpp/pull/27969)).\r\n- Added `--n-cpu-ffn` ([#26622](https://github.com/ggml-org/llama.cpp/pull/26622)).\r\n- Added per-layer expert routing/FFN ([#28323](https://github.com/ggml-org/llama.cpp/pull/28323)).\r\n- Added KV-cell token tracking ([#27762](https://github.com/ggml-org/llama.cpp/pull/27762)).\r\n- Added n-gram history lookup ([#28040](https://github.com/ggml-org/llama.cpp/pull/28040)).\r\n- Optimized KV cache restore ([#27991](https://github.com/ggml-org/llama.cpp/pull/27991)).\r\n- Stopped early sequence scans ([#28011](https://github.com/ggml-org/llama.cpp/pull/28011)).\r\n- Added quantizer RAM cap ([#27795](https://github.com/ggml-org/llama.cpp/pull/27795)).\r\n- Added quantizer row-slab streaming ([#27830](https://github.com/ggml-org/llama.cpp/pull/27830)).\r\n- Prevented RAM peaking during load ([#27483](https://github.com/ggml-org/llama.cpp/pull/27483)).\r\n- Autoscaled YaRN training context ([#28030](https://github.com/ggml-org/llama.cpp/pull/28030)).\r\n- Disabled non-fused GDN/LID ([#27877](https://github.com/ggml-org/llama.cpp/pull/27877)).\r\n- Simplified MiniMax-01 graph ([#27790](https://github.com/ggml-org/llama.cpp/pull/27790)).\r\n- Added DFlash2 support ([#27816](https://github.com/ggml-org/llama.cpp/pull/27816)).\r\n- Fused DFlash encoder into KV injection ([#27310](https://github.com/ggml-org/llama.cpp/pull/27310)).\r\n- Added sparse flash attention for DeepSeek-V4/GLM and Qwen4exp ([#27970](https://github.com/ggml-org/llama.cpp/pull/27970)).\r\n- Added Apple RDMA as an RPC transport ([#26421](https://github.com/ggml-org/llama.cpp/pull/26421)).\r\n- Added RPC event/async backend APIs ([#18626](https://github.com/ggml-org/llama.cpp/pull/18626)).\r\n- Fixed Qwen4exp graph issues ([#27941](https://github.com/ggml-org/llama.cpp/pull/27941)).\r\n- Added Qwen4exp recurrent rollback ([#28123](https://github.com/ggml-org/llama.cpp/pull/28123)).\r\n- Summed Qwen4exp indexer heads ([#28023](https://github.com/ggml-org/llama.cpp/pull/28023)).\r\n- Reduced Qwen4exp graph splits ([#27880](https://github.com/ggml-org/llama.cpp/pull/27880)).\r\n- Fixed DeepSeek-V4 input vision ([#28154](https://github.com/ggml-org/llama.cpp/pull/28154)).\r\n- Fixed Gemma-4 vision handling ([#28335](https://github.com/ggml-org/llama.cpp/pull/28335)).\r\n- Fixed Gemma-4 assistant ([#28183](https://github.com/ggml-org/llama.cpp/pull/28183)).\r\n- Added synthetic spec acceptance options ([#27711](https://github.com/ggml-org/llama.cpp/pull/27711)).\r\n- Made build info stream configurable ([#28322](https://github.com/ggml-org/llama.cpp/pull/28322)).\r\n- Fixed JSON-schema empty object grammar ([#28279](https://github.com/ggml-org/llama.cpp/pull/28279)).\r\n\r\n### Multi-modality changes\r\n\r\n- Added `mtmd_tokenize_from_parts()` ([#28250](https://github.com/ggml-org/llama.cpp/pull/28250)).\r\n- Added DeepSeek-V4-Flash-Vision-Exp ([#28133](https://github.com/ggml-org/llama.cpp/pull/28133)).\r\n- Added DeepSeek-V4 input vision handling ([#28154](https://github.com/ggml-org/llama.cpp/pull/28154)).\r\n- Fixed Gemma-4 vision handling ([#28335](https://github.com/ggml-org/llama.cpp/pull/28335)).\r\n- Fixed Idefics3 preprocessing ([#28273](https://github.com/ggml-org/llama.cpp/pull/28273)).\r\n- Fixed Qwen3-TTS ([#28231](https://github.com/ggml-org/llama.cpp/pull/28231)).\r\n- Added video parameters/`--video-*` ([#24318](https://github.com/ggml-org/llama.cpp/pull/24318)).\r\n- Made image preprocessors const-correct ([#28310](https://github.com/ggml-org/llama.cpp/pull/28310)).\r\n- Made audio preprocessors const-correct ([#28307](https://github.com/ggml-org/llama.cpp/pull/28307)).\r\n\r\n### Server changes\r\n\r\n- Added per-slot context limit ([#24124](https://github.com/ggml-org/llama.cpp/pull/24124)).\r\n- Accept `data:` URLs for media ([#27735](https://github.com/ggml-org/llama.cpp/pull/27735)).\r\n- Enabled `preserve_reasoning` by default ([#28174](https://github.com/ggml-org/llama.cpp/pull/28174)).\r\n- Reject prefilled assistant tool calls ([#27626](https://github.com/ggml-org/llama.cpp/pull/27626)).\r\n- Added synthetic spec acceptance options ([#27711](https://github.com/ggml-org/llama.cpp/pull/27711)).\r\n- Added pytest-xdist server tests ([#28298](https://github.com/ggml-org/llama.cpp/pull/28298)).\r\n\r\n### UI changes\r\n\r\n- Improved Chat Form Actions UI/UX ([#27746](https://github.com/ggml-org/llama.cpp/pull/27746)).\r\n- Replaced MCP overrides with tool policy ([#27745](https://github.com/ggml-org/llama.cpp/pull/27745)).\r\n- Moved Settings/MCP routes to dialogs ([#27744](https://github.com/ggml-org/llama.cpp/pull/27744)).\r\n- Updated dialog styling ([#27743](https://github.com/ggml-org/llama.cpp/pull/27743)).\r\n- Copy grouped agentic response text ([#27832](https://github.com/ggml-org/llama.cpp/pull/27832)).\r\n- Updated ESLint config ([#27700](https://github.com/ggml-org/llama.cpp/pull/27700)).\r\n- Updated package scripts ([#28270](https://github.com/ggml-org/llama.cpp/pull/28270)).\r\n\r\n### ggml changes\r\n\r\n- Bumped ggml from v0.22.0 to v0.23.0 ([release](https://github.com/ggml-org/ggml/releases/tag/v0.23.0)).\r\n\r\nVersion 0.23.0 adds new operators and backend scheduling APIs for sparse attention, asynchronous execution, and allocation-dependency tracking. The most notable additions are sparse flash attention (`ggml_flash_attn_ext_set_n_kv_max`), RPC event/async APIs, and Apple RDMA transport support. It also includes broad correctness and performance work across CPU, GPU, and accelerator backends.\r\n\r\n## Assets\r\n\r\n**Nightly build:** [b10809](https://github.com/ggml-org/llama.cpp/releases/tag/b10809)\r\n\r\n## More info\r\n\r\n- [Releases and versioning of `ggml-org` projects](https://github.com/ggml-org/ggml/discussions/1579)\r\n\r\n## Changelog since v0.3.0\r\n\r\n5266f24da llama.cpp : bump version to 0.4.0 (#28386)\r\n64a155d24 sync : ggml (#28379)\r\n163a40796 model, mtmd: fix gemma4 vision handling (#28335)\r\n8f83678fd metal : add remaining fa-vec tunings for M3 Max (#28373)\r\n86b351fd6 ggml : replace compile definitions with version.h.in (#28364)\r\nd509cb1e8 Don't use npx inside a package.json script (#28270)\r\n4cbe8b070 ggml : don't crash when backend search path can't be read (#28271)\r\n24f5bf8a4 ggml : remove GGML_CUDA_PEER_MAX_BATCH_SIZE (#28177)\r\na529af96e docs : update maintainer PRs link and regenerate AUTHORS (#28365)\r\n38521ec33 vendor: update BoringSSL to 0.20260903.0 (#28354)\r\n0ef4d560e ci : disable failing openvino tests (#28347)\r\nc390d0abb common : make build info output stream configurable (#28322)\r\n832fd6f17 ggml-cpu(s390x) : fix q5_1 uninitialized v_acc (#28332)\r\n9a4843cf2 src : add n_expert_used_max function (#28323)\r\n6703d7894 sycl: fuse rms_norm+mul+add and add+add residual chains (#27610)\r\nf9f09f02c SYCL: Refactor GGML_SYCL_ENABLE_MKL_FA to global var (#26863)\r\nd230ddd76 llama: fix whole source code rebuilt on each new commit (#28278)\r\nc5a5535e6 common/json-schema : fix GBNF grammar generation for empty object schemas (#28279)\r\n95ef7fc16 opencl: quant lm_head / decode GEMV and medium-batch GE