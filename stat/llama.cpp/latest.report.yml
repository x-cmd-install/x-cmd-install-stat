{"id":388619384,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJH_K4M4XKdx4","tag_name":"v0.4.1","target_commitish":"391fac16460f15233a7740550d858ac96df3419d","name":"v0.4.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-14T18:27:23Z","updated_at":"2026-09-14T18:28:16Z","published_at":"2026-09-14T18:27:29Z","assets":[{"id":563975851,"node_id":"RA_kwDOJH_K4M4hnZar","name":"nightly-tag.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json; charset=utf-8","state":"uploaded","size":7,"digest":"sha256:3d64814d6d05845a4b749392f4cb916b84709ab5b1393edcec5e680e2ddd4663","download_count":6592,"created_at":"2026-09-14T18:27:30Z","updated_at":"2026-09-14T18:27:30Z"}],"body":"## Overview\r\n\r\nllama.cpp 0.4.1 adds Maple 20B-A1B, Tencent Hy 4, and Spark2.5 support, improves JSON schema handling, chat parsing, logging, and server child-process management, and updates ggml to v0.24.0.\r\n\r\n### API changes\r\n\r\n- Changed `llama_sampler_chain_n()` to return `int32_t` instead of `int` ([#28631](https://github.com/ggml-org/llama.cpp/pull/28631)).\r\n- Added `server_subproc` and `waiter` for router child-process monitoring in `server-common.h` ([#28555](https://github.com/ggml-org/llama.cpp/pull/28555)).\r\n\r\n### New models\r\n\r\n- Added Maple 20B-A1B ternary MoE architecture (CPU) ([#27000](https://github.com/ggml-org/llama.cpp/pull/27000)).\r\n- Added Tencent Hy 4 (`hy_v4`) preview architecture support ([#28127](https://github.com/ggml-org/llama.cpp/pull/28127)).\r\n- Added Spark2.5 support ([#27868](https://github.com/ggml-org/llama.cpp/pull/27868)).\r\n\r\n### Core changes\r\n\r\n- Added Kimi-K3 recurrent-state rollback support ([#28466](https://github.com/ggml-org/llama.cpp/pull/28466)).\r\n- Fixed MTP context KV cache allocation for DeepSeek2, GLM-MoE, and related models ([#28630](https://github.com/ggml-org/llama.cpp/pull/28630)).\r\n- Fixed GDN normalization from `max` to `rsqrt` for affected Qwen/Kimi/GLM models ([#28068](https://github.com/ggml-org/llama.cpp/pull/28068)).\r\n- Fixed Granite parameter counts and Granite3 MoE unknown parameter counts ([#28643](https://github.com/ggml-org/llama.cpp/pull/28643), [#28632](https://github.com/ggml-org/llama.cpp/pull/28632)).\r\n- Fixed MIMO2 SWA pattern loading and incorrect `get_key_or_arr` uses ([#28865](https://github.com/ggml-org/llama.cpp/pull/28865), [#28868](https://github.com/ggml-org/llama.cpp/pull/28868)).\r\n- Added `--fuse-qkv` conversion flag to fuse Q/K/V tensors during HF-to-GGUF conversion ([#22780](https://github.com/ggml-org/llama.cpp/pull/22780)).\r\n- Wrote explicit `recurrent_layers` metadata for Qwen3-Next/Qwen3.5 conversion ([#28208](https://github.com/ggml-org/llama.cpp/pull/28208)).\r\n- Refactored JSON schema handling with a `common_schema` internal representation ([#28736](https://github.com/ggml-org/llama.cpp/pull/28736)).\r\n- Split specialized chat parsers into `common/parsers` ([#27764](https://github.com/ggml-org/llama.cpp/pull/27764)).\r\n- Added structured JSONL logging via `--log-jsonl` and `LOG_JSON` ([#28437](https://github.com/ggml-org/llama.cpp/pull/28437), [#28586](https://github.com/ggml-org/llama.cpp/pull/28586)).\r\n- Removed deprecated `--mmap`/`--mlock`/`--direct-io` args in favor of `--load-mode` ([#28334](https://github.com/ggml-org/llama.cpp/pull/28334)).\r\n- Made mmproj and draft devices default to the global `--device` selection ([#28390](https://github.com/ggml-org/llama.cpp/pull/28390)).\r\n- Disabled lazy tensor loading by default on iGPUs ([#28326](https://github.com/ggml-org/llama.cpp/pull/28326)).\r\n- Fixed speculative decoding after multimodal input and DFlash mtmd chunk decode ([#28715](https://github.com/ggml-org/llama.cpp/pull/28715), [#28587](https://github.com/ggml-org/llama.cpp/pull/28587)).\r\n- Fixed Jinja dot-property integer literals and null `in` membership ([#28817](https://github.com/ggml-org/llama.cpp/pull/28817), [#28620](https://github.com/ggml-org/llama.cpp/pull/28620)).\r\n- Improved grammar insert/move handling and max repetition threshold ([#26885](https://github.com/ggml-org/llama.cpp/pull/26885), [#28469](https://github.com/ggml-org/llama.cpp/pull/28469)).\r\n- Improved qwen3-coder complex-type parsing and typed content detection ([#28742](https://github.com/ggml-org/llama.cpp/pull/28742), [#28511](https://github.com/ggml-org/llama.cpp/pull/28511)).\r\n- Added PCH and unity build support to improve build times ([#28091](https://github.com/ggml-org/llama.cpp/pull/28091)).\r\n- Updated cpp-httplib to 0.56.0 ([#28787](https://github.com/ggml-org/llama.cpp/pull/28787)).\r\n\r\n### Multi-modality changes\r\n\r\n- Propagated video hash to bitmap IDs (`{hash}+{frame}`) for cache identification ([#28601](https://github.com/ggml-org/llama.cpp/pull/28601)).\r\n- Fixed DFlash speculative decoding failures on mtmd chunks ([#28587](https://github.com/ggml-org/llama.cpp/pull/28587)).\r\n\r\n### Server changes\r\n\r\n- Refactored server child-process handling into a single monitor thread ([#28555](https://github.com/ggml-org/llama.cpp/pull/28555)).\r\n- Fixed LRU hang on multiple requests for the same model ([#28539](https://github.com/ggml-org/llama.cpp/pull/28539)).\r\n- Allow model downloads when `--models-max` is already reached ([#28530](https://github.com/ggml-org/llama.cpp/pull/28530)).\r\n- Fixed context checkpoint eviction on prompts shorter than `checkpoint_min_step` ([#28302](https://github.com/ggml-org/llama.cpp/pull/28302)).\r\n- Fixed speculative decoding after image input ([#28715](https://github.com/ggml-org/llama.cpp/pull/28715)).\r\n- Frame router child state commands as whole lines ([#28747](https://github.com/ggml-org/llama.cpp/pull/28747)).\r\n- Enabled `--reasoning-preserve` by default ([#28437](https://github.com/ggml-org/llama.cpp/pull/28437)).\r\n\r\n### UI changes\r\n\r\n- Improved chat message rendering performance with lazy mounting and compositor-friendly animations ([#28460](https://github.com/ggml-org/llama.cpp/pull/28460)).\r\n- Added UI asset cache for faster builds ([#28802](https://github.com/ggml-org/llama.cpp/pull/28802)).\r\n- Embedded UI assets directly with CMake, removing the build-time helper ([#28445](https://github.com/ggml-org/llama.cpp/pull/28445)).\r\n- Fixed MCP image attachments not displayed in tool blocks ([#28089](https://github.com/ggml-org/llama.cpp/pull/28089)).\r\n- Export conversations from the database instead of the cached store ([#27432](https://github.com/ggml-org/llama.cpp/pull/27432)).\r\n\r\n### ggml changes\r\n\r\n- Bumped ggml from v0.23.0 to v0.24.0 ([release](https://github.com/ggml-org/ggml/releases/tag/v0.24.0)).\r\n\r\nVersion 0.24.0 focuses on expanding backend coverage and robustness, with a new precision-control API, major Vulkan/SYCL/Hexagon/OpenCL work, and numerous correctness and performance fixes across CPU, CUDA, Metal, and other backends.\r\n\r\n## Assets\r\n\r\n**Nightly build:** [b10964](https://github.com/ggml-org/llama.cpp/releases/tag/b10964)\r\n\r\n## More info\r\n\r\n- [Releases and versioning of `ggml-org` projects](https://github.com/ggml-org/ggml/discussions/1579)\r\n\r\n## Changelog since v0.4.0\r\n\r\nb29c606e2 llama.cpp : bump version to 0.4.1 (#28900)\r\nd9e03f107 sync : ggml\r\neeea73161 ggml : bump version to 0.24.0 (ggml/1627)\r\nbbdd9f246 tests : add fusion baseline README and broaden fusion CI triggers (#28893)\r\n97e4ca735 models : fix incorrect uses of get_key_or_arr (#28868)\r\n1aca1f9fc models : fix mimo2 swa pattern load (#28865)\r\nbe2c6d7d1 tests(s390x): add non-vxe build to tests (#28776)\r\n3d10bcd19 llama: add Maple 20B-A1B ternary MoE architecture (CPU) (#27000)\r\n21f6b0d22 sycl: rfc: Use radix select for top_k (#28670)\r\n2f539596c ggml-cpu : disable PCH and fix CACHE_LINE_SIZE ambiguity to fix heap corruption (#28882)\r\n89fe24240 ci : trigger self-hosted CI on changes to ci/run.sh (#28859)\r\n15d8f2d59 ci : remove gg_sum summary logic (#28857)\r\n661643e43 sycl : fix oneDNN scratchpad breaking the pool free order (#28704)\r\n093a2f86c common : move llama_n_rs_seq to before llama_decode (#28749)\r\nad6c66839 ggml-cuda: fallback to F32 on device without BF16 hardware acceleration (#28846)\r\n7a16a6ce3 grammar : coalesce find + insert into a single insert and adjust move/copy mechanics (#26885)\r\n5f436dddb tests : exclude HY_V4 from WebGPU test-llama-archs tests (#28855)\r\ne49d2c276 models : guard the expert FFN size fallback in nemotron-h against a zero divisor (#28779)\r\n697805298 ggml-cpu(s390x): guard VXE-only repack helpers (#28775)\r\n243a3082d tests : fix typo in test-quant-type-selection for nemotron 3 nano (#28835)\r\nb6b003d2c sycl : Fix get mem error (#28227)\r\nc95f8e47b ci : run editorconfig and code-style checks on ubuntu-slim (#28854)\r\nbc52a12b3 pi : prefer PI_MODEL_NAME env var for model disclosure (#28853)\r\n4a8993735 tests : reduce FA test sizes (#28842)\r\n37b3a9e0c ci : remove leftover command (#28839)\r\n002a12ad2 ci : cap test-backend-ops parallel jobs at 2 and add a 3600s timeout (#28833)\r\nf1e44dcc1 vulkan: workaround NV queuesubmit driver bug (#28830)\r\n56b9eb280 opencl: apply the noshuffle row-alignment rule to q4_K, q5_K and q8_0, not just q6_K (#28575)\r\n790cf51aa chat : improve parsing of complex types in qwen3-coder (#28742)\r\n8e330954a common: add LOG_JSON macro to log structured data (#28586)\r\nacecd5603 common : implement common_schema internal representation for JSON schemas (#28736)\r\nae9afff8d jinja : support dot property integer literals (#28817)\r\n737e0980f cmake: leave the timestamp out of precompiled headers on clang (#28816)\r\n3057bb66c ui : add cache (#28802)\r\n56381e407 server : allow model downloads at model limit fix iss