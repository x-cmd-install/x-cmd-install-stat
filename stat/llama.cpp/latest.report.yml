n66bcc2770 docs : refresh CPU ops support matrix (#29666)\r\n10f340d1a model : re-enable -sm tensor for qwen4exp (#28569)\r\n0c1e57098 webgpu: fix SSM_SCAN binding aliasing (#29750)\r\nf7b384c1e ggml-opencl : replace alloca() with std::vector (#29765)\r\nf872b5911 cuda: guard the iq4_nl dequantize row kernel against short rows (#29683)\r\na4d880fd5 Hexagon: optimize ALLREDUCE with support for safe scatter mode (#29757)\r\nfeb9a3d6d args: fix cli download mmproj arg  (#28977)\r\n4453b535f llama : preserve original batch order for speculative decoding layer inputs (#29019)\r\n4f31296a9 test-llama-archs : toggle causal_attn to catch graph shape changes (#29724)\r\nb016f461b convert : fix LoRA conversion crash for Qwen3.5 V-head reorder (#28324)\r\n81ff93ea1 llama: properly handle KV on training (#28520)\r\n60e9cf7a7 batch: migrate the rest of examples to llama_batch_ext (#29601)\r\n05af0d2b1 glm5-next: give dead indexer slots unique scatter rows (#29745)\r\n2149c00f4 ggml/gguf : fix integer overflow (#29384)\r\n876c75b1f codeowners : remove former ZenDNN owner (#29747)\r\nb04642061 cli: exit on stdin EOF and drop the console wide Ctrl+C broadcast (#29722)\r\n22bdcc4cd mimo : support dflash (convert + feature extraction) (#29650)\r\nca2e2037b jinja : support coerced array attributes (#29574)\r\nbdeb855b3 ggml-et : remove useless alloca() (#29663)\r\n3b3d022b8 ci : fix Models Backend Check by shortening the hrm_text fixture (#29744)\r\n185103dcf llama: llama_prefetch_rows (#29599)\r\n2090f60f0 ggml : add BF16 unary, GLU, binary and scale ops (CPU, CUDA) (#29675)\r\n90c908d06 cpu: accept BF16 in src1 of mul_mat (#28937)\r\n8df332de1 model-conversion : add --add-bos to run org model script (#29558)\r\n4a096b8ff ui : shared model display primitives (#29644)\r\n8664eaea3 ui : model download pipeline (#27959)\r\n4cfb6d1c7 ui : model memory-fit estimation (#27957)\r\n9b4333611 ui : Hugging Face Hub data layer (#27947)\r\nf65325040 ui : model id grammar for sidecars, quants and