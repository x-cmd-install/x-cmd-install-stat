ne71b80510 Revert \"CUDA: size routed MoE MMQ N-tiles from typical expert width on RDNA3 (#24546)\" (#28551)\r\nccc3646c6 nix : update deprecated expressions (#28145)\r\nc0b1871bc webgpu: format the GET_ROWS case block (#28542)\r\n160bd031b server: fix LRU hang on multiple requests same model (#28539)\r\ndbeb37548 sycl: add a batched L2_NORM kernel (#28222)\r\n7a333e724 vulkan: add DeepSeek-V4 hyper-connection fused ops (DSV4_HC_COMB/PRE/POST) (#26578)\r\n0c963452e CUDA: size routed MoE MMQ N-tiles from typical expert width on RDNA3 (#24546)\r\n473599738 ggml: add gfx90c HIP support (#26454)\r\nd23c47f2a convert : refactor Hy4-preview conversion - move HC tensor mapping to the global map (#28451)\r\n73ab7599b CUDA: branchless Q4_K/Q5_K unpack to speed up mmvq, L2 prefetch on DGX Spark (#26705)\r\n0cae43063 vulkan: support type-aligned GET_ROWS (#28253)\r\n1173700b9 examples : print ggml_version and ggml_commit in test-cmake [no ci] (#28538)\r\n5202104b5 caps : recheck typed content if template checks for string (#28511)\r\n9a7570587 convert : write explicit recurrent_layers for Qwen3-Next / Qwen3.5 (#28208)\r\nb74f590ea ggml-cuda: fix divergent barrier in f16 flash attention (#27870)\r\n992cb503c ggml: allow backend inputs to not create another split (#28387)\r\n9ac8c408a vulkan: rms_norm fusion opportunities (#28024)\r\n2092353c8 ci : add container image checking and tagging (wip) (#28394)\r\n8fe90e1fb vulkan: add TQ1_0 support (mm, mat-vec, mat-vec-id, dequant, get_rows) (#27765)\r\n465e49b9c convert : add `--fuse-qkv` flag to fuse Q/K/V into QKV during HF-to-GGUF conversion (#22780)\r\n5fdfa6282 models : fix GDN normalization from `max` to `rsqrt` (#28068)\r\n3ad1ba733 [Model] Support for Spark2_5ForCausalLM  implementation (#27868)\r\nd03efa5d5 opencl: properly choose weights pack for q4_K, q5_K mul_mat (#28402)\r\n73a43d1f6 cuda: fixes races in mmid and mmf (#28475)\r\n9e0e22059 grammar : fix max repetition threshold (#28469)\r\n0afb805b1 ui: Improve Chat Messages rendering performance (#28460)\r\n7620399f5 common: add --log-jsonl (#28437)\r\nc457e3bf7 ui : embed assets directly with CMake (#28445)\r\n971595d66 metal : add remaining fa-vec tunings for M2 Max (#28458)\r\n74a7c897f Github: limit blank issues to maintainers (#28435)\r\n6a1a922d2 metal : fix memory leak in early return (#28399)\r\n4d9176092 sycl : fix test-backend-ops CI break && restore Kronecker product FWHT support (#28016) (#28254)\r\ncd8cdf397 sycl: attribute device allocations by site (GGML_SYCL_MEMTRACE) (#27631)\r\n427291b5b metal : add remaining fa-vec tunings for M3 (#28396)\r\n85d5703a3 ui : fix MCP image attachments not displayed in tool block (#25789) (#28089)\r\n1548a240e opencl: extend the elementwise and data\u2010movement op coverage (#27633)\r\n4acf4a4cb opencl: add Adreno xmem SDPA path (#26331)\r\n8b4b3558f ci : move more jobs to ccache-buckets (#28375)\r\n1863ac033 ui: export conversations from database instead of cached store (#27432)\r\n49c0dc82b model : add Tencent Hy 4 (hy_v4) preview architecture support (#28127)","reactions":{"total_count":49,"+1":20,"-1":0,"laugh":0,"hooray":12,"confused":0,"heart":9,"rocket":7,"eyes":1}}
