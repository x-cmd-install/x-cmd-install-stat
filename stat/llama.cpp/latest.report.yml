A + ggml: add sparse-fa for DSV4/GLM (#27970)\r\n0f3a71be1 mtmd: Fix Qwen3-tts-0.6b (#28231)\r\nb81c99b47 ggml: avoid KleidiAI buffer type init on dispatch (#27891)\r\n960dffab0 hexagon: MUL_MAT and MUL_MAT_ID fusion and fixes (#28202)\r\nba8818cbf vulkan: handle larger batch sizes (>4) efficiently for IQ3_S mat-vec (#27449)\r\n56dd8150c vulkan : only request VK_KHR_shader_bfloat16 extension if supported (#28155)\r\n2637dfe37 ggml-cpu : conditionally add SpacemiT IME kernel sources (#27961)\r\n43d87ff2d opencl: fix out\u2010of\u2010bound reads in the Adreno image kernels (#27632)\r\n69320fef1 hexagon: add missing FARF logs for cpy/get_rows/set_rows/gdn ops (#28217)\r\nb96806d96 metal : add metallib build support for xcframework (#28163)\r\n3466812d1 cuda: fuse MoE weighted expert reduction (#25952)\r\nb356fa262 kv-cells: look up the n-gram history in the sequence position index (#28040)\r\ndfc29b64e context : autoscale n_ctx_train when yarn scaling specified (#28030)\r\nf28493c78 models : appropriately flag noscan ssm_a tensors (#28121)\r\n73159c303 model : fix gemma4-assistant (#28183)\r\nd11b3cc7e model : load relevant arrays with n_layer_all (#28173)\r\nc845263f8 Revert \"sycl : add Kronecker product FWHT support for sizes 384, 640, 768, 12\u2026\" (#28184)\r\n1f3d31873 sycl : add Kronecker product FWHT support for sizes 384, 640, 768, 1280 (#28016)\r\n8887a48f0 metal : add fa-vec tuning for M2 Pro (#28122)\r\nbe789c344 metal : add fa-vec tunings for A18 Pro (MacBook Neo) (#28152)\r\n9d817213a model : load hparams.n_layer_nextn before n_layer() calls (#28159)\r\nfe2120bc9 metal : fix more leaks due to missing autoreleasepools (#27883)\r\nd08c7872d metal : add fa-vec tuning for M2 Max (#28015)\r\n5eec3ad01 sycl : support limit max alloc memory within 2GB for host-pinned memory (#27559)\r\n36b101543 qwen4exp: fix seq_cp, block position keying, mtmd input, cuda abort, add tests (#27941)\r\nd086dbb34 tests : fix log verbosity for test-llama-archs (#28147)\r\n1b89a43e