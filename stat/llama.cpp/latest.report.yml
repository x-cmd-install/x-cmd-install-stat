{"id":403937899,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOJH_K4M4YE5pr","tag_name":"v0.6.0","target_commitish":"8345f333951c661d166b00e6f9362e553768f292","name":"v0.6.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-05T16:56:17Z","updated_at":"2026-10-05T16:58:23Z","published_at":"2026-10-05T16:56:22Z","assets":[{"id":613151064,"node_id":"RA_kwDOJH_K4M4ki_FY","name":"nightly-tag.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json; charset=utf-8","state":"uploaded","size":7,"digest":"sha256:5677c5a4561fad44f2a58fc14187dd9cde253874584e958b37094c723ea8e8a5","download_count":9559,"created_at":"2026-10-05T16:56:23Z","updated_at":"2026-10-05T16:56:23Z"}],"body":"## Overview\r\n\r\nllama.cpp v0.6.0 introduces the new `llama_batch_ext` extended batch API (with `llama_process`) for mixed token/embedding inputs and MTP/deepstack state embeddings, adds support for the GLM-5.3-Flash (GLM5-Next) 320B hybrid model, the Clef decision model (text and vision) and MTP speculative decoding for Qwen4Exp, ships a new `/v1/systemone` server API for decision models (laya, julia-1, lev, openjev, kev, nimble), overhauls the Web UI with a Hugging Face Hub data layer and model download pipeline, adds a Metal tensor-API flash attention kernel for F16 KV, sparse flash attention for quantized K/V on Vulkan, and updates ggml to v0.26.0.\r\n\r\n### Highlights\r\n\r\n- New `llama_batch_ext` extended batch API with `llama_process()`, supporting mixed token/embedding batches and per-token \"state\" embeddings for MTP and deepstack models [#24669](https://github.com/ggml-org/llama.cpp/pull/24669)\r\n- New models: GLM-5.3-Flash (GLM5-Next), a 320B text+vision hybrid model [#27773](https://github.com/ggml-org/llama.cpp/pull/27773), and the Clef decision model, fully supported with both text and vision [#29831](https://github.com/ggml-org/llama.cpp/pull/29831) [#29969](https://github.com/ggml-org/llama.cpp/pull/29969)\r\n- Qwen4Exp: high-quality support is now available, with MTP speculative decoding (~1.5x decode speedup on DGX Spark) and various correctness fixes [#29761](https://github.com/ggml-org/llama.cpp/pull/29761) [#29751](https://github.com/ggml-org/llama.cpp/pull/29751)\r\n- llama and server: new `/v1/systemone` API supporting five decision models - laya, julia-1, lev, openjev (+vision), kev [#29818](https://github.com/ggml-org/llama.cpp/pull/29818)\r\n- Metal: new tensor API flash attention kernel for F16 KV [#29570](https://github.com/ggml-org/llama.cpp/pull/29570)\r\n- Metal: new few-row MMA mat-mul kernels for speculative and batched decoding, up to ~3x faster mat-mul on Apple GPUs [#29869](https://github.com/ggml-org/llama.cpp/pull/29869)\r\n- New `llama_prefetch_rows()` using MADVISE-based prefetching of PLE tensors in Qwen4Exp and Gemma4 [#29599](https://github.com/ggml-org/llama.cpp/pull/29599)\r\n\r\n### API changes\r\n\r\n- `include/llama.h`: new `llama_batch_ext` batch API with `llama_embd`, `llama_process()` and `llama_process_type` [#24669](https://github.com/ggml-org/llama.cpp/pull/24669), new `llama_get_causal_attn()` [#28876](https://github.com/ggml-org/llama.cpp/pull/28876), session formats bumped to `LLAMA_SESSION_VERSION` 11 and `LLAMA_STATE_SEQ_VERSION` 4\r\n- `include/llama-cpp.h`: added `llama_batch_ext_ptr` and deleter for the new extended batch API [#24669](https://github.com/ggml-org/llama.cpp/pull/24669)\r\n- `tools/mtmd/mtmd.h`: `mtmd_get_memory_usage()` now returns an `mtmd_memory_usage` struct with `image_max_tokens` and `use_non_causal` [#29773](https://github.com/ggml-org/llama.cpp/pull/29773)\r\n- `tools/server`: new `/v1/systemone` endpoint for decision models [#29818](https://github.com/ggml-org/llama.cpp/pull/29818) and `/v1/embeddings` now accepts typed vision/audio/video content [#29556](https://github.com/ggml-org/llama.cpp/pull/29556)\r\n\r\n### New models\r\n\r\n- GLM-5.3-Flash (GLM5-Next): 320B KDA/DSA hybrid text+vision model with mHC and MoE [#27773](https://github.com/ggml-org/llama.cpp/pull/27773)\r\n- Clef decision model, fully supported with both text and vision [#29831](https://github.com/ggml-org/llama.cpp/pull/29831) [#29969](https://github.com/ggml-org/llama.cpp/pull/29969)\r\n- Ling 3.0 VL, folded into the BailingMoeV3 architecture [#29151](https://github.com/ggml-org/llama.cpp/pull/29151)\r\n- Nimble decision model [#29844](https://github.com/ggml-org/llama.cpp/pull/29844)\r\n- Registered `Lfm2BidirectionalForMaskedLM` for LFM2.5-Encoder-230M/350M [#29862](https://github.com/ggml-org/llama.cpp/pull/29862)\r\n- Added `classifier_pooling` support for rerankers [#29627](https://github.com/ggml-org/llama.cpp/pull/29627)\r\n\r\n### Core changes\r\n\r\n- Migrated examples, speculative decoding, mtmd and server to the new `llama_batch_ext` API [#29385](https://github.com/ggml-org/llama.cpp/pull/29385) [#29601](https://github.com/ggml-org/llama.cpp/pull/29601); batches now accept both embd and raw tokens [#29622](https://github.com/ggml-org/llama.cpp/pull/29622)\r\n- Added `llama_prec_policy` and a model-driven W4A4 (NVFP4/MXFP4) mul_mat path [#24364](https://github.com/ggml-org/llama.cpp/pull/24364)\r\n- Qwen4Exp: halved indexer score memory [#29825](https://github.com/ggml-org/llama.cpp/pull/29825), optimized mask constructions [#29824](https://github.com/ggml-org/llama.cpp/pull/29824), re-enabled the `-sm` tensor [#28569](https://github.com/ggml-org/llama.cpp/pull/28569); GLM5-Next: unique scatter rows for dead indexer slots [#29745](https://github.com/ggml-org/llama.cpp/pull/29745)\r\n- KV cache: fixed restoring mismatched KV cache rotation [#28498](https://github.com/ggml-org/llama.cpp/pull/28498), fixed K/V and recurrent state cleanup after failed restores [#27530](https://github.com/ggml-org/llama.cpp/pull/27530) and an invalid assert in recurrent memory [#29799](https://github.com/ggml-org/llama.cpp/pull/29799)\r\n- Speculative decoding: probabilistic sampling for simple draft and MTP [#27694](https://github.com/ggml-org/llama.cpp/pull/27694), fixed n-gram drafts rejected at temp > 0 after truncation [#29924](https://github.com/ggml-org/llama.cpp/pull/29924), preserved original batch order for layer inputs [#29019](https://github.com/ggml-org/llama.cpp/pull/29019), stop accepting draft tokens at EOG [#29638](https://github.com/ggml-org/llama.cpp/pull/29638)\r\n- k-pool models: fixed unexpected graph reallocation [#29958](https://github.com/ggml-org/llama.cpp/pull/29958) and clamped kpool re-pool bound to existing pools [#29805](https://github.com/ggml-org/llama.cpp/pull/29805)\r\n- Fixed tensor split for fused qkv with uneven K/V head sizes [#29294](https://github.com/ggml-org/llama.cpp/pull/29294), gather recurrent states once so the reserve covers every split [#29856](https://github.com/ggml-org/llama.cpp/pull/29856), and properly handle KV on training [#28520](https://github.com/ggml-org/llama.cpp/pull/28520)\r\n- Context: do not re-reserve the scheduler when toggling `causal_attn` [#28751](https://github.com/ggml-org/llama.cpp/pull/28751)\r\n- DFlash drafts: write Gemma embedding scale during conversion [#29802](https://github.com/ggml-org/llama.cpp/pull/29802) and add dflash support for MiMo [#29650](https://github.com/ggml-org/llama.cpp/pull/29650)\r\n\r\n### Multi-modality changes\r\n\r\n- Cap `max_image` to `n_ubatch` for non-causal models [#29773](https://github.com/ggml-org/llama.cpp/pull/29773)\r\n- Fixed the mel preprocessor in LFM2 audio [#29403](https://github.com/ggml-org/llama.cpp/pull/29403)\r\n- Migrated input processing to `llama_batch_ext` [#29385](https://github.com/ggml-org/llama.cpp/pull/29385)\r\n\r\n### Server changes\r\n\r\n- New `/v1/systemone` decision-model API with dedicated decision pipeline [#29818](https://github.com/ggml-org/llama.cpp/pull/29818), extended to the nimble decision model [#29844](https://github.com/ggml-org/llama.cpp/pull/29844)\r\n- Support vision input for Clef [#29969](https://github.com/ggml-org/llama.cpp/pull/29969)\r\n- `GET /v1/models` and `GET /models` now report model input/output modalities in a new `architecture` object [#29987](https://github.com/ggml-org/llama.cpp/pull/29987)\r\n- `/v1/embeddings`: accept typed content (vision/audio/video) input [#29556](https://github.com/ggml-org/llama.cpp/pull/29556) and return HTTP 400 for invalid embedding requests [#29060](https://github.com/ggml-org/llama.cpp/pull/29060)\r\n- Allow RANK pooling batch splitting for causal LLM rerankers (Qwen3, Qwen3-VL) [#28876](https://github.com/ggml-org/llama.cpp/pull/28876)\r\n- Reject partial media truncation [#24076](https://github.com/ggml-org/llama.cpp/pull/24076)\r\n- Logging: self-contained colors and split child commands from logs in router mode [#29895](https://github.com/ggml-org/llama.cpp/pull/29895), allow preset to set log file [#29334](https://github.com/ggml-org/llama.cpp/pull/29334), fixed dead `LLAMA_ARG_HF_REPO_FILE` key in preset allow-list [#29938](https://github.com/ggml-org/llama.cpp/pull/29938)\r\n- Fixed laya abort by limiting `n_batch` to `n_ubatch` [#29903](https://github.com/ggml-org/llama.cpp/pull/29903)\r\n- Remove the built-in UI's service worker when the UI is not served [#29565](https://github.com/ggml-org/llama.cpp/pull/29565)\r\n\r\n### UI changes\r\n\r\n- New model download pipeline [#27959](https://github.com/ggml-org/llama.cpp/pull/27959), Hugging Face Hub data layer [#27947](https://github.com/ggml-org/llama.cpp/pull/27947), model memory-fit estimation [#27957](https://github.com/ggml-org/llama.cpp/pull/27957) and model id grammar for sidecars, quants and capability parsing [#27946](https://github.com/ggml-org/llama.cpp/pull/27946)\r\n- Type-safe API types, fetch helpers and download-ready models store plumbing [#29582](https://github.com/ggml-org/llama.cpp/pull/29582)\r\n- Shared model display primitives [#29644](https://github.com/ggml-org/llama.cpp/pull/29644)\r\n- Fixed missing `svg use` and animation elements in preview and download [#28962](https://github.com/ggml-org/llama.cpp/pull/28962)\r\n- Use `toLocaleString()` formatting consistently across chat message statistics [#27990](https://github.com/ggml-org/llama.cpp/pull/27990)\r\n\r\n### ggml changes\r\n\r\n- ggml updated to [v0.26.0](https://github.com/ggml-org/ggml/releases/tag/v0.26.0): a new `alloc_buffer_n`/`get_alloc_size_n` buffer allocation API, sparse flash attention kernels on SYCL, Vulkan and Metal, and major lightning indexer improvements (halved score memory, tiling, MUSA support). The CPU backend gains BF16 ops and a tiled k-quant mul_mat, CUDA gains a model-driven W4A4 (NVFP4/MXFP4) mul_mat path plus MMVQ shared-expert fusion, and the Hexagon backend adds a sampler and more quant types. Model loading is faster with stricter GGUF size validation, Windows ARM64 MSVC builds are enabled, and WebGPU/OpenVINO/OpenCL/SYCL pick up numerous new kernels, ops and fixes.\r\n\r\n## Assets\r\n\r\n**Nightly build:** [b11429](https://github.com/ggml-org/llama.cpp/releases/tag/b11429)\r\n\r\n## More info\r\n\r\n- [Releases and versioning of `ggml-org` projects](https://github.com/ggml-org/ggml/discussions/1579)\r\n\r\n## Changelog since [v0.5.0](https://github.com/ggml-org/llama.cpp/releases/tag/v0.5.0)\r\n\r\nd81235049 llama.cpp : bump version to 0.6.0 (#29997)\r\n4d60b4d08 common, server : report model input/output modalities in GET /models (#29987)\r\nc06f84160 sync : ggml\r\nf05c8b278 ggml : bump version to 0.26.0 (ggml/1652)\r\ne117148a4 CUDA: make the alloc_deps check batch independent (#29986)\r\n6c59c4007 vulkan: fix Flash Attention shmem write out of bounds (#29988)\r\n3c9e747f7 vulkan: revert mul_mat_id tile selection PR #29182 (#29936)\r\nb809b886d cuda: use the vector lightning indexer kernel on MUSA (#29990)\r\n994e8f222 ci : add \"Require Docker\" flag to make-release workflow (#29989)\r\n9d853bb36 webui: Use toLocaleString() format consistently across chat message statistics (#27990)\r\n8f9ae20c8 ci : disable failing test on virtual Metal device (#29993)\r\n9871df591 server: support vision input for Clef (#29969)\r\n8b2fbaf32 CUDA: Optimize accumulation in mmq for NVFP4 type (#29857)\r\n2ed93db47 ci : disable unused qemu in docker build (#29984)\r\n8e1642198 server: reject partial media truncation (#24076)\r\n806eee984 vulkan: fix stale prealloc_y reuse across flash attention and soft_max (#29591)\r\nb3daa077a vulkan: sparse flash attention for quantized K/V (#29639)\r\nc173a53bd llama : fix unexpected graph reallocation in the k-pool models (#29958)\r\n210791069 kv-cache: fix restoring mismatched KV cache rotation by saving exact rotation metadata (#28498)\r\ne5983d670 ci : winget urls must be separate strings (#29978)\r\n4ca6b76f0 ci : fix docker workflow permissions (#29979)\r\n9f12cd4a4 ggml-cpu : add Q8_0 IME1 matrix kernel for SpacemiT X60 (#28479)\r\nebe18bee5 vulkan : Fix undeclared identifiers when -DGGML_VULKAN_RUN_TESTS=ON (#29912)\r\n8216c8462 webgpu: add MMVQ support for Q1_0/Q5_0/Q5_1/Q3_K/Q5_K/Q6_K/MXFP4 (#29483)\r\n1b43d3116 cuda: tile the lightning indexer over keys and tokens for 4 heads (#29901)\r\na3a1c4747 metal : few-row MMA mat-mul (#29869)\r\n9d3aba6b5 CUDA: use MMVF for thin f16/bf16 mul_mat at small batch size (#29633)\r\nd89651a7b CUDA: prefer whole-tile FlashAttention scheduling for efficient two-stage kernels (#29435)\r\na7fb71fab log, server: self contained colors, split child commands from logs in router mode (#29895)\r\n0bb496dbd llama: support both embd + raw tokens in batch (#29622)\r\n2ca15f540 CUDA: refactor swizzling code (#29612)\r\na7b94df2c ggml-cpu: support BF16/FP16/FP32 K tails in tinyBLAS on x86 (#29806)\r\n0eb6d9a81 cuda : move neu_padded to where it is used (#29940)\r\n2e7c58c54 ci : windows llvm