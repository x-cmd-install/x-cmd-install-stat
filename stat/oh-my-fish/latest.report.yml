{"id":305879403,"author":{"login":"derekstavis","id":1611639,"node_id":"MDQ6VXNlcjE2MTE2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAn7pDM4SO1lr","tag_name":"v8","target_commitish":"master","name":"Version 8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-04-07T01:00:39Z","updated_at":"2026-04-07T01:02:33Z","published_at":"2026-04-07T01:01:23Z","assets":[],"body":"# Change Log\r\n\r\n## [v8] - 2026-04-06\r\n\r\nThe first release in several years updates Oh My Fish for modern Fish versions (v4+ compatibility), refreshes the test matrix, and fixes a number of long-standing install and package-management issues.\r\n\r\n### Improvements\r\n\r\n- Raise the minimum supported Fish version to 3.0 and update CI coverage for current Linux and macOS environments.\r\n- Improve installer behavior for offline installs, tarball extraction, branch handling, and package installation from GitHub repositories.\r\n- Improve package and theme handling with better theme activation, uninstall hook support, bundle loading, and `OMF_CONFIG` package discovery.\r\n- Refresh documentation, translated READMEs, and repository metadata.\r\n\r\n### Bugs fixed\r\n\r\n- Fix the `conf.d` `$path` variable during initialization.\r\n- Fix installer path handling for values containing `=`.\r\n- Fix package-name parsing for repository names containing dots.\r\n- Fix behavior in bare Git repositories and worktrees.\r\n- Fix the published installer checksum and several documentation issues.\r\n\r\n### Contributors\r\n\r\nThanks to the people who contributed to this release.\r\n\r\n- Andy Chen\r\n- Brian Thompson\r\n- Derek Stavis\r\n- Emily Grace Seville\r\n- Fabian Homborg\r\n- fdeitylink\r\n- Heimen Stoffels\r\n- Hernawan Fa\u00efz Abdillah\r\n- Iago S\r\n- Jean-Luc Thumm\r\n- jjangga0214\r\n- Johannes Altmanninger\r\n- Justin Hileman\r\n- Karan Verma\r\n- Kevin F. Konrad\r\n- M4rk9696\r\n- Manu [tennox]\r\n- Marcelo dos Santo