37629909,"digest":"sha256:be75dd11b682dbda44d559cf73941026881496f5ef0a72e8c89243ef416bcaca","download_count":0,"created_at":"2026-09-23T14:56:55Z","updated_at":"2026-09-23T14:56:57Z"},{"id":583989717,"node_id":"RA_kwDOAJbIR84izvnV","name":"wininterrupt-windows-x64-msvc-20.0.2.7z","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-7z-compressed","state":"uploaded","size":12374,"digest":"sha256:2055b8113bd1fc3abea131071bc3fa112192bfe8bf95addfd7cc196b4b88d3ff","download_count":0,"created_at":"2026-09-23T14:56:55Z","updated_at":"2026-09-23T14:56:55Z"}],"body":"These packages are not officially supported, for official packages please check out https://download.qt.io/official_releases/qtcreator\n\nQt Creator 20.0.2\n=================\n\nQt Creator version 20.0.2 contains bug fixes.\nIt is a free upgrade for all users.\n\nThe most important changes are listed in this document. For a complete list of\nchanges, see the Git log for the Qt Creator sources that you can check out from\nthe public Git repository or view online at\n\n<https://code.qt.io/cgit/qt-creator/qt-creator.git/log/?id=v20.0.1..v20.0.2>\n\nGeneral\n-------\n\nFixed\n\n* The default search parameters for `Advanced Find`\n* A crash with the navigation views during shutdown\n\nEditing\n-------\n\nFixed\n\n* A crash when files are modified externally\n\n### QML\n\nFixed\n\n* That the wrong QML Language Server binary could be downloaded on Linux\n  (QTCREATORBUG-34931)\n\nProjects\n--------\n\nFixed\n\n* The `Always ask before stopping applications` option\n\n### CMake\n\nFixed\n\n* A crash when reloading CMake Presets\n\nPlatforms\n---------\n\n### macOS\n\nFixed\n\n* An issue with the code model with Qt 6.12 and later\n* That `bbedit` could not be run from the built-in terminal\n  (QTCREATORBUG-34886)\n\n### Android\n\nFixed\n\n* Issues with the latest Android command line tools\n  (QTCREATORBUG-34905, QTCREATORBUG-34917)\n\n### iOS\n\nFixed\n\n* Issues with the individual Simulator versus Device builds that are\n  provided with Qt 6.12 and later\n  (QTCREATORBUG-34896)\n* Issues with Xcode 27\n* That some command line arguments could not be passed to user applications\n  on devices\n  (QTCREATORBUG-34802)\n* A crash when starting an application on the Simulator fails\n  (QTCREATORBUG-34853)\n\nCredits for these changes go to:\n--------------------------------\nAlexandre Laurent  \nAndr\u00e9 P\u00f6nitz  \nAur\u00e9lien Brooke  \nBogDan Vatra  \nChristian Kandeler  \nEike Ziller  \nMarcus Tillmanns  \nPatrik Teivonen  \nSami Shalayel  \nThiago Macieira  \n"}
