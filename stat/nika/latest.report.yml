created_at":"2026-11-10T21:23:23Z","updated_at":"2026-11-10T21:23:23Z"},{"id":732998649,"node_id":"RA_kwDOQybyms4rsKv5","name":"supernovae-st-nika-check-wasm-0.124.3.tgz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":108,"digest":"sha256:6b54ae333e656d0c927d254c353e5223821ce36f5e71f15ce3ac82ee30bd8aa0","download_count":6,"created_at":"2026-11-10T21:23:26Z","updated_at":"2026-11-10T21:23:26Z"}],"body":"## What\n\nNika 0.124.3 lets an application ask what a workflow's declared ACP route offers before anything\nruns. On `nika serve`, `GET /v1/access-offers/{name}` opens the sessions a run of that file would\nopen, selects the file's model in each, reads the models, the exact reasoning efforts and the\nservice tiers the route lists for that model, and ends without a prompt. The answer says what was\nread and when, and it authorizes nothing: a run still selects and reads back on its own session.\nMeasured on one codex seat with codex-acp 1.13.1 on 2026-11-10, with a debug build of the engine:\nreading the `infer:` session of a file took 4.1 s and 5.3 s, reading an `agent:` session took 1.3 s,\nand a second request within the minute returned the kept answer in 0.02 s. For\n`openai/gpt-6-luna` that seat listed the efforts `low`, `medium`, `high`, `xhigh` and `max` and the\ntiers `standard` and `fast`; for `openai/gpt-6.1-sol` it confirmed the model and listed no effort\nand no tier. These are observations of one seat on one day, not a description of the route. The\nlanguage and the SDK protocol are unchanged; an engine that answers this request lists\n`accessSessionOffer` in `supportedCapabilities`.\n\n### Added\n\n- **`nika serve` answers what a workflow's declared ACP route offers,\n  without a prompt.** `GET /v1/access-offers/{name}` (capability\n  `accessSessionOffer` on `/health`) admits a served workflow by name, reads\n  its `run.access`, and, when the file selects ACP sessions (`via` under\n  `protocol: acp`), opens one session per shape its tasks run in and per\n  model they resolve to: the route's one-shot completion profile for\n  `infer:` tasks, its agent session for `agent:` tasks. Each session is\n  opened as a run opens it, selects the file's model for that session only,\n  lists the models, the exact reasoning efforts and the service tiers the\n  route has for that model, and ends: no effort, tier or mode is set and the\n  path holds no `session/prompt`, so an offer uses no turn. The answer is a\n  `nika/access-offer@1` document: the file's declared route, then one row\n  per session with `observed_at` and `fresh_until`. A model the session does\n  not list is a row state, and its efforts and tiers are then left\n  `unobserved` instead of being read from another model. A session that\n  gives no offer is a row with the code a run would meet (`NIKA-1803`,\n  `NIKA-1804`, `NIKA-1805`). Rows are kept 60 seconds (15 when unavailable),\n  one reading runs at a time, a ninth concurrent request answers `503\n  access_offer_busy`, and every listed value reaches the client as a bounded\n  token. The request names a served workflow and nothing else, and the\n  answer authorizes no run: `POST /v1/jobs` still selects, reads back and\n  refuses on its own session. In the library, `nika_harness::session_offer`\n  reads one session and `nika_service_execution::offer` names the sessions\n  of a workflow.\n\n## Install\n\n```sh\nbrew install supernovae-st/tap/nika          # macOS · Linux\ncurl -LsSf https://nika.sh/install.sh | sh   # script install\ndocker run --rm ghcr.io/supernovae-st/nika:0.124.3 --version\n```\n\nTarballs below: macOS arm64 / x64 · Linux x64 / arm64, plus `SHA256SUMS`.\n\n## Verify: three independent proofs\n\n```sh\n# 1 · checksum: the bytes you hold are the bytes CI hashed\nsha256sum -c SHA256SUMS --ignore-missing     # macOS: shasum -a 256 -c\n\n# 2 · attestation: GitHub-signed build provenance for this exact artifact\ngh attestation verify nika-<platform>-0.124.3.tar.gz --repo supernovae-st/nika\n\n# 3 · SLSA provenance: the intoto asset, verifiable offline\nslsa-verifier verify-artifact nika-<platform>-0.124.3.tar.gz \\\n  --provenance-path multiple.intoto.jsonl \\\n  --source-uri github.com/supernovae-st/nika --source-tag v0.124.3\n```\n\n## Provenance\n\nBuilt from tag `v0.124.3` by [`release.yml`](https://github.com/supernovae-st/nika/blob/v0.124.3/.github/workflows/release.yml)\non GitHub-hosted runners. Provenance is published twice: GitHub's native\nbuild attestation (proof 2) and the SLSA generator's `multiple.intoto.jsonl`\nrelease asset (proof 3). The release itself is a claim on the\nmachine-verified timeline: https://nika.sh/timeline\n\n\n## What's Changed\n* ci(spec-pin-heal): move the contract fixtures' spec pin with the pin, and catch the pin up by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1868\n* test(nika-serve): wait for the resident's sleep before the overlap test advances by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1869\n* feat(serve): read what a workflow's declared acp route offers, without a prompt by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1870\n* chore(release): prepare 0.124.3 by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1871\n\n\n**Full Changelog**: https://github.com/supernovae-st/nika/compare/v0.124.2...v0.124.3\n\n<!-- nika-ghcr-digest: sha256:449638f3a28e1064cebb7b42fdd60b89370039bd8e0123c6224755a366d229b5 -->","mentions_count":1}
