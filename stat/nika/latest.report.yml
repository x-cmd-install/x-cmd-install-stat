026-09-25T12:54:59Z"},{"id":588360475,"node_id":"RA_kwDOQybyms4jEasb","name":"nika-macos-arm64-0.121.0.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18551219,"digest":"sha256:858ca5385bebc0e40a50849d550da374c2cb6fb8dde221c6cbefa559c5386b5f","download_count":9,"created_at":"2026-09-25T12:54:44Z","updated_at":"2026-09-25T12:54:45Z"},{"id":588360600,"node_id":"RA_kwDOQybyms4jEauY","name":"nika-macos-x64-0.121.0.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20935713,"digest":"sha256:39b0617e5e6fe8d349c9fa0916e70480f60880cfa2174b093dc760f712911ce2","download_count":6,"created_at":"2026-09-25T12:54:49Z","updated_at":"2026-09-25T12:54:50Z"},{"id":588360986,"node_id":"RA_kwDOQybyms4jEa0a","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":388,"digest":"sha256:42bf0dce1bd4832f09c037970aa520f06c533190ab3727cc61ba9222d6736898","download_count":34,"created_at":"2026-09-25T12:55:03Z","updated_at":"2026-09-25T12:55:03Z"},{"id":588361174,"node_id":"RA_kwDOQybyms4jEa3W","name":"supernovae-st-nika-check-wasm-0.121.0.tgz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1311094,"digest":"sha256:e997052c802170242db110a178e6f1b0aa6c3e59156153fe32d2d3d969edcfe5","download_count":6,"created_at":"2026-09-25T12:55:11Z","updated_at":"2026-09-25T12:55:11Z"},{"id":588361306,"node_id":"RA_kwDOQybyms4jEa5a","name":"supernovae-st-nika-check-wasm-0.121.0.tgz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":108,"digest":"sha256:49bf6a555d699e35e3e7426e07408e3d1b79c118ba1cf592f5244a53943b2ad2","download_count":6,"created_at":"2026-09-25T12:55:15Z","updated_at":"2026-09-25T12:55:15Z"}],"body":"## What\n\n**A conversation from the request to an inspectable result.** Open `nika`,\ndescribe the work, review and correct the proposed `.nika` workflow, save it,\nthen choose Run explicitly. The Session keeps the request and earlier\nrequirements through corrections and restores pending drafts for fresh review.\nDeepSeek is the priority API path for authoring and summaries.\n\nCheck, admitted access, recorded execution and the actual output remain separate\nproofs. The [installed qualification](https://github.com/supernovae-st/nika/blob/v0.121.0/docs/qa/delivery-a-2026-09.md) records finite\nsynthetic journeys on its identified macOS development candidate; it does not\nestablish arbitrary-request correctness or Linux conversational qualification.\n\n**Compatibility:** use SDK `0.121.0` with engine/Serve `0.121.0` for the expanded\nCompile question protocol. Bare `nika` opens the terminal Session; use `--plain`\nfor its line interface (the previous `--tui` flag is retired). Older executables\nrefuse the newer Run history records: rolling back a binary does not migrate\nhistory backwards. Foundry snapshots and Jev remain optional; public installers\ndo not distribute the operator's private knowledge snapshot or provider keys.\n\n**Run cost compatibility:** the informational price catalog does not by itself\nauthorize an OpenAI-compatible API route. DeepSeek's admitted direct routes work\nwithout an unknown-price review. Other routes, including default OpenAI and\nMistral endpoints, require a fresh, bounded Run cost review when their exact\nroute and model are not admitted; unattended invocations without that review\nrefuse before dispatch. Unknown-price review supports HTTPS OpenAI-compatible\ntext routes only. HTTP API overrides and overridden native Anthropic/Gemini\ngateways refuse, including in interactive runs. Priced native routes at their\ndefault endpoints and explicit local-provider lanes retain their own admission\nrules. See [Spending](docs/usage/conversational-session.md#spending).\n\nRead the [complete changes for v0.121.0](https://github.com/supernovae-st/nika/blob/v0.121.0/CHANGELOG.md). The full changelog is preserved in this release's source tree; the pull request index follows below.\n\n## Install\n\n```sh\nbrew install supernovae-st/tap/nika          # macOS \u00b7 Linux\ncurl -LsSf https://nika.sh/install.sh | sh   # script install\ndocker run --rm ghcr.io/supernovae-st/nika:0.121.0 --version\n```\n\nTarballs below: macOS arm64 / x64 \u00b7 Linux x64 / arm64, plus `SHA256SUMS`.\n\n## Verify: three independent proofs\n\n```sh\n# 1 \u00b7 checksum: the bytes you hold are the bytes CI hashed\nsha256sum -c SHA256SUMS --ignore-missing     # macOS: shasum -a 256 -c\n\n# 2 \u00b7 attestation: GitHub-signed build provenance for this exact artifact\ngh attestation verify nika-<platform>-0.121.0.tar.gz --repo supernovae-st/nika\n\n# 3 \u00b7 SLSA provenance: the intoto asset, verifiable offline\nslsa-verifier verify-artifact nika-<platform>-0.121.0.tar.gz \\\n  --provenance-path multiple.intoto.jsonl \\\n  --source-uri github.com/supernovae-st/nika --source-tag v0.121.0\n```\n\n## Provenance\n\nBuilt from tag `v0.121.0` by [`release.yml`](https://github.com/supernovae-st/nika/blob/v0.121.0/.github/workflows/release.yml)\non GitHub-hosted runners. Provenance is published twice: GitHub's native\nbuild attestation (proof 2) and the SLSA generator's `multiple.intoto.jsonl`\nrelease asset (proof 3). The release itself is a claim on the\nmachine-verified timeline: https://nika.sh/timeline\n\n\n## What's Changed\n* fix(providers): distinguish exhausted quota from transient limits by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1714\n* feat(compile): compose bounded support workflows with explicit authoring by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1713\n* docs(roadmap): refresh recorded status and place the 0.120.3 waypoint by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1717\n* feat(nika-serve): bind schedule inputs on every resident fire and propose ADR-136 by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1721\n* feat(compile): typed computation and the meaning-survival laws (war room 20-21/09) by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1722\n* fix(nika-serve): a full or closed queue at fire time never ends the resident by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1723\n* feat(product): the canonical session from bare nika to the result by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1724\n* feat(nika-tui): the terminal renderer proof, inline-first with one owner (UX-1) by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1725\n* feat(nika-compile): compiler war room season 2 \u2014 the obligation ledger and the meaning laws by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1727\n* feat(nika-tui): the live session behind the renderer, reached by nika --tui (UX-2) by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1728\n* test(nika-serve): bound the shutdown scenario's waits and terminate a hung test under nextest by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1729\n* feat(product): converge the native session from intention to verified result by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1734\n\n\n**Full Changelog**: https://github.com/supernovae-st/nika/compare/v0.120.3...v0.121.0\n\n<!-- nika-ghcr-digest: sha256:1092fe88c36c5912af2dd8f0c239992ef8d87737b67fc8923cd405488035fb35 -->","mentions_count":1}
