6,"created_at":"2026-10-02T23:35:39Z","updated_at":"2026-10-02T23:35:39Z"},{"id":606717261,"node_id":"RA_kwDOQybyms4kKcVN","name":"supernovae-st-nika-check-wasm-0.122.0.tgz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":108,"digest":"sha256:ad7ab67eb5de5b2408bf6433e781c7a782b29a3f5ab40c75ea877f2b98d102fc","download_count":6,"created_at":"2026-10-02T23:35:41Z","updated_at":"2026-10-02T23:35:41Z"}],"body":"## What\n\n\n\nRead the [complete changes for v0.122.0](https://github.com/supernovae-st/nika/blob/v0.122.0/CHANGELOG.md). The full changelog is preserved in this release's source tree; the pull request index follows below.\n\n## Install\n\n```sh\nbrew install supernovae-st/tap/nika          # macOS \u00b7 Linux\ncurl -LsSf https://nika.sh/install.sh | sh   # script install\ndocker run --rm ghcr.io/supernovae-st/nika:0.122.0 --version\n```\n\nTarballs below: macOS arm64 / x64 \u00b7 Linux x64 / arm64, plus `SHA256SUMS`.\n\n## Verify: three independent proofs\n\n```sh\n# 1 \u00b7 checksum: the bytes you hold are the bytes CI hashed\nsha256sum -c SHA256SUMS --ignore-missing     # macOS: shasum -a 256 -c\n\n# 2 \u00b7 attestation: GitHub-signed build provenance for this exact artifact\ngh attestation verify nika-<platform>-0.122.0.tar.gz --repo supernovae-st/nika\n\n# 3 \u00b7 SLSA provenance: the intoto asset, verifiable offline\nslsa-verifier verify-artifact nika-<platform>-0.122.0.tar.gz \\\n  --provenance-path multiple.intoto.jsonl \\\n  --source-uri github.com/supernovae-st/nika --source-tag v0.122.0\n```\n\n## Provenance\n\nBuilt from tag `v0.122.0` by [`release.yml`](https://github.com/supernovae-st/nika/blob/v0.122.0/.github/workflows/release.yml)\non GitHub-hosted runners. Provenance is published twice: GitHub's native\nbuild attestation (proof 2) and the SLSA generator's `multiple.intoto.jsonl`\nrelease asset (proof 3). The release itself is a claim on the\nmachine-verified timeline: https://nika.sh/timeline\n\n\n## What's Changed\n* feat(media): rebuild the readme film and every clip on one engine by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1748\n* feat(media): four new clips and a readme for people meeting nika by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1750\n* feat(media): the session, cost, approval and typescript clips by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1751\n* feat: compose grounded authoring, session recovery and run authority by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1747\n* feat: stabilize native authoring and rehearsed copy proposals by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1753\n* Rehearse native proposals before consent by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1756\n* Patch the media dependency and clarify verification notes by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1757\n* chore(release): prepare 0.122.0 by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1758\n\n\n**Full Changelog**: https://github.com/supernovae-st/nika/compare/v0.121.0...v0.122.0\n\n<!-- nika-ghcr-digest: sha256:65f999fcc6813aca212a3b530194db60695fce8920c3d1dc0c81c58a0df2f659 -->","mentions_count":1}
