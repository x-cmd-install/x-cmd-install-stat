10,"created_at":"2026-09-05T17:56:49Z","updated_at":"2026-09-05T17:56:49Z"},{"id":546122227,"node_id":"RA_kwDOQybyms4gjSnz","name":"supernovae-st-nika-check-wasm-0.118.7.tgz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":108,"digest":"sha256:5d3fcb66f7b796802075ffc8f4abad29eae85df70c5befb86202946739c35e24","download_count":10,"created_at":"2026-09-05T17:56:52Z","updated_at":"2026-09-05T17:56:52Z"}],"body":"## What\n\n### Fixed\n\n- **File journals refuse bytes beyond the verifier's existing bounds.**\n  Check final encoded lines and cumulative bytes, including newlines,\n  before writing. A refusal stops that journal and reports lost evidence\n  while preserving the primary output and runtime settlement. This does\n  not provide complete proofs for oversized runs or resolve #1458.\n- **Hash arguments agree across check and execution.** Literal null content and invalid algorithm or encoding choices are refused before execution; omitted options keep their defaults, and accepted content keeps its original digest. Tool schemas expose the same closed choices. Gemini tool declarations carry the canonical JSON Schema through `parametersJsonSchema`.\n- **Incomplete trace diagnostics describe evidence, not runtime failure.**\n  A missing terminal frame and an unheld writer lease no longer claim a\n  crash or an unsettled run. An invalid final line also does not exclude\n  intentional modification. A file journal can stop while the primary\n  run still succeeds; verification tiers and exit codes are unchanged.\n- **Agent guidance reflects readiness and effect evidence.** The four skills preserve existing execution authorization and distinguish missing decisions from check readiness. Authoring uses examples for unfamiliar structures; debugging explains resume eligibility, uncertain remote effects and the upstream tasks included by `--task`. Operating guidance preserves secret host boundaries and separates definition pins from trust in a server. Plugin descriptions now state the limits of metered budgets and trace delivery.\n\n## Install\n\n```sh\nbrew install supernovae-st/tap/nika          # macOS \u00b7 Linux\ncurl -LsSf https://nika.sh/install.sh | sh   # script install\ndocker run --rm ghcr.io/supernovae-st/nika:0.118.7 --version\n```\n\nTarballs below: macOS arm64 / x64 \u00b7 Linux x64 / arm64, plus `SHA256SUMS`.\n\n## Verify: three independent proofs\n\n```sh\n# 1 \u00b7 checksum: the bytes you hold are the bytes CI hashed\nsha256sum -c SHA256SUMS --ignore-missing     # macOS: shasum -a 256 -c\n\n# 2 \u00b7 attestation: GitHub-signed build provenance for this exact artifact\ngh attestation verify nika-<platform>-0.118.7.tar.gz --repo supernovae-st/nika\n\n# 3 \u00b7 SLSA provenance: the intoto asset, verifiable offline\nslsa-verifier verify-artifact nika-<platform>-0.118.7.tar.gz \\\n  --provenance-path multiple.intoto.jsonl \\\n  --source-uri github.com/supernovae-st/nika --source-tag v0.118.7\n```\n\n## Provenance\n\nBuilt from tag `v0.118.7` by [`release.yml`](https://github.com/supernovae-st/nika/blob/v0.118.7/.github/workflows/release.yml)\non GitHub-hosted runners. Provenance is published twice: GitHub's native\nbuild attestation (proof 2) and the SLSA generator's `multiple.intoto.jsonl`\nrelease asset (proof 3). The release itself is a claim on the\nmachine-verified timeline: https://nika.sh/timeline\n\n\n## What's Changed\n* fix: align hash contracts and bounded journal evidence by @ThibautMelen in https://github.com/supernovae-st/nika/pull/1490\n\n\n**Full Changelog**: https://github.com/supernovae-st/nika/compare/v0.118.6...v0.118.7\n\n<!-- nika-ghcr-digest: sha256:ea24ec5cdc0b66aecbbddfc5cd6aa40776ac016bda8249b9ebe866ce48e19ea0 -->","mentions_count":1}
