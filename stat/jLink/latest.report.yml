pdated_at":"2026-09-17T12:33:41Z"},{"id":570229250,"node_id":"RA_kwDONhAAJs4h_QIC","name":"jabridge_1.1.0_source.tar.gz.sha256","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":95,"digest":"sha256:b2b29af402a765a13d05d51dea5f162037c5d410015610ed05a865397530cd2b","download_count":2,"created_at":"2026-09-17T12:33:41Z","updated_at":"2026-09-17T12:33:42Z"},{"id":570229254,"node_id":"RA_kwDONhAAJs4h_QIG","name":"jabridge_1.1.0_source.tar.gz.sig","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":88,"digest":"sha256:7ede984d9166537444389cd8c0fc5b2cf7de554eb123fadfcb628a1a9cfa1c29","download_count":1,"created_at":"2026-09-17T12:33:41Z","updated_at":"2026-09-17T12:33:42Z"},{"id":570229192,"node_id":"RA_kwDONhAAJs4h_QHI","name":"SHA256SUMS","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":295,"digest":"sha256:a655333f559a9e6103366cdb490020cea0b37b0edf327e1fe72b0eed4b052020","download_count":4,"created_at":"2026-09-17T12:33:40Z","updated_at":"2026-09-17T12:33:40Z"}],"body":"Jabridge 1.1.0\n\nThe menu is faster and smoother, with up to 30 FPS. Device search no longer freezes the menu, and the keys are easier to see.\n\nFirmware updates support more models, including Engage 75 and 75 SE. Interrupted updates can be retried.\n\nFixed the Evolve2 40 firmware update problem from [#43](https://github.com/Watchdog0x/jabridge/issues/43). Thanks @oblab for reporting it.\n\nAdded control of the headset\u2019s own volume for Evolve2 30 SE with firmware 1.11.0 over USB. Thanks @kfstorm for testing it in [#44](https://github.com/Watchdog0x/jabridge/issues/44).\n\nPlay some audio, then run:\n\n```sh\njabridge headset volume 50\n```\n\nRead the saved level or check support:\n\n```sh\njabridge headset volume get\njabridge headset volume info\n```\n\nThe saved number can be old. It does not show the live playback volume. At the lowest or highest headset volume, Linux volume may change too. Headset volume through a dongle is not ready yet.\n\n@kfstorm tested the volume commands on his Evolve2 30 SE. The other supported USB models still need tests on real devices. Engage 75 and 75 SE passed simulator tests and also need real device testing.\n\nDebug reports now include more audio details.\n\nUpdate the app and device access rules:\n\n```sh\njabridge update\njabridge setup\n```\n\nUpdate headset firmware separately from the Firmware menu.\n","mentions_count":2}
