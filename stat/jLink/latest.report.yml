ated_at":"2026-09-09T23:28:46Z"},{"id":553778701,"node_id":"RA_kwDONhAAJs4hAf4N","name":"jabridge_1.0.0_source.tar.gz.sha256","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":95,"digest":"sha256:dd346e46bfb84b7668e321ab0a56df419c701cfefa7dce9d9e1ec66448af4d9b","download_count":0,"created_at":"2026-09-09T23:28:46Z","updated_at":"2026-09-09T23:28:46Z"},{"id":553778714,"node_id":"RA_kwDONhAAJs4hAf4a","name":"jabridge_1.0.0_source.tar.gz.sig","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":88,"digest":"sha256:5c3a9f818e8fbfe9f87b56fc5946aa26b816225e130f0b3ba4a4cc10325bec33","download_count":0,"created_at":"2026-09-09T23:28:46Z","updated_at":"2026-09-09T23:28:46Z"},{"id":553778715,"node_id":"RA_kwDONhAAJs4hAf4b","name":"SHA256SUMS","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":295,"digest":"sha256:f4791576fa85d8ed4842c463d33f9c1f7869787cd6a1320cd815af323a642eb2","download_count":0,"created_at":"2026-09-09T23:28:46Z","updated_at":"2026-09-09T23:28:46Z"}],"body":"# Jabridge 1.0.0\n\njLink is now Jabridge: Jabra Direct for Linux, built by the community.\n\nThe native Go rewrite brings a simple terminal menu, headset and dongle settings,\nbattery information, PipeWire sound controls and firmware updates for supported\ndevices. No Jabra SDK is needed.\n\n## Start\n\nDownload the Linux archive for your computer, extract it and run:\n\n```bash\n./jabridge setup\n./jabridge\n```\n\n| Download | Computer |\n| --- | --- |\n| `jabridge_1.0.0_linux_amd64.tar.gz` | Most Intel and AMD PCs |\n| `jabridge_1.0.0_linux_arm64.tar.gz` | ARM64 Linux computers |\n\n## Update Jabridge\n\n```bash\n./jabridge update\n```\n\n## Device firmware\n\nOpen Firmware in the menu, choose your device and press Enter. Follow the prompts\nand keep it plugged in until it finishes. Support depends on your device.\nEngage 50 II and Evolve3 firmware updates are new previews: software checks passed,\nbut physical update and recovery testing is still needed.\n\n## Build your own app\n\nUse the [IPC guide](https://github.com/Watchdog0x/jabridge/blob/v1.0.0/docs/IPC.md)\nto build a GNOME, KDE, Hyprland or other frontend using the same background service.\n\n## Problems?\n\n```bash\n./jabridge debug --output jabridge-debug.txt\n```\n\nCheck the report before sharing it. [Open an issue](https://github.com/Watchdog0x/jabridge/issues/new)\nwith your device model, what went wrong and the report.\n\nThanks to @am4c130d, @delacor, @Danfro, @keydon, @zetneteork, @Atem18 and everyone who helped test and improve Jabridge.\n\nArchives include SHA-256 checksums and Ed25519 signatures. Jabridge verifies signed\napp updates automatically. This is an independent project, not an official Jabra product.\n","mentions_count":6}
