pdated_at":"2026-10-23T10:23:59Z"},{"id":668764240,"node_id":"RA_kwDONhAAJs4n3IhQ","name":"jabridge_1.3.0_source.tar.gz.sha256","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":95,"digest":"sha256:7b697dbf9dabd23dc6da78bab3f87265be3f06682408d26a3b1e908f8b4df9b5","download_count":0,"created_at":"2026-10-23T10:23:59Z","updated_at":"2026-10-23T10:23:59Z"},{"id":668764241,"node_id":"RA_kwDONhAAJs4n3IhR","name":"jabridge_1.3.0_source.tar.gz.sig","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":88,"digest":"sha256:77a832df22194e5a4e17657fb5eeedf73f88b1ad7c76d303c3779fba6263aa79","download_count":0,"created_at":"2026-10-23T10:23:59Z","updated_at":"2026-10-23T10:23:59Z"},{"id":668764182,"node_id":"RA_kwDONhAAJs4n3IgW","name":"SHA256SUMS","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":295,"digest":"sha256:8a5aff4592636ada774838f9f785016c7528a747342f6b2993df2f720d538ee8","download_count":0,"created_at":"2026-10-23T10:23:58Z","updated_at":"2026-10-23T10:23:58Z"}],"body":"Package maintainers can now let their package manager handle app updates and setup.\n\nBuild from the source folder with both options:\n\n```sh\nbuildinfo=github.com/Watchdog0x/jabridge/internal/buildinfo\nCGO_ENABLED=0 go build -buildvcs=false -o jabridge -ldflags \"\\\n-X ${buildinfo}.SelfUpdate=disabled \\\n-X ${buildinfo}.Setup=disabled\" ./cmd/jabridge\n```\n\nYour package must install the USB rules and user service from `internal/assets`. Point the service at the packaged app with `--daemon`, and start it before opening the menu. [Package setup steps](https://github.com/Watchdog0x/jabridge/blob/main/docs/DEVELOPMENT.md#package-managed-builds).\n\nThe menu can use the packaged service even when history cannot be saved. Testing on NixOS itself is still needed.\n\nFor official downloads, update with:\n\n```sh\njabridge update\n```\n\nThanks @rclement for #51 and #52.\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
