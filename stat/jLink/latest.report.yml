ted_at":"2026-10-31T22:31:53Z"},{"id":696650400,"node_id":"RA_kwDONhAAJs4phgqg","name":"jabridge_1.5.0_source.tar.gz.sha256","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":95,"digest":"sha256:58314fca7f9fb9adf46bed8adae65e02edef65e3fbe458e1b3c3cdef914b7a3e","download_count":1,"created_at":"2026-10-31T22:31:53Z","updated_at":"2026-10-31T22:31:53Z"},{"id":696650399,"node_id":"RA_kwDONhAAJs4phgqf","name":"jabridge_1.5.0_source.tar.gz.sig","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":88,"digest":"sha256:6aaa4782c7b3c4c3c5b8e45d79be16b22bf3dc9a88c7172c0c0686f73869ec23","download_count":1,"created_at":"2026-10-31T22:31:53Z","updated_at":"2026-10-31T22:31:53Z"},{"id":696650347,"node_id":"RA_kwDONhAAJs4phgpr","name":"SHA256SUMS","label":"","uploader":{"login":"Watchdog0x","id":84445039,"node_id":"MDQ6VXNlcjg0NDQ1MDM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":295,"digest":"sha256:b3cd3d96e0c5d861522020fe9a09ea731bb0d711817381b48e1f180c30d8350b","download_count":1,"created_at":"2026-10-31T22:31:52Z","updated_at":"2026-10-31T22:31:52Z"}],"body":"Jabridge 1.5.0 fixes the doubled sleep labels from #56 and updates Link 390 `2e57` search and pairing. A tester confirmed Classic search and pairing without a USB replug after a reset with Jabra Direct, on firmware 1.3.0 with Evolve2 55 firmware 1.2.13. An empty first search in that test is still unexplained. Thanks @ggzengel and @shimonkohn for testing these fixes.\n\nThe Link 390 firmware package from #54 is supported through its separate experimental installer. @ggzengel reported a successful 3.2.0 update and readback. Interrupted-update recovery has not been tested on hardware, so this installer stays off by default.\n\nEqualizer bands, noise button cycle and power saving are visible but read-only by default. Changing them requires the separate service test option. Link 380c `24c9` list, search and pairing also stay off unless its test option is enabled. Thanks @c-jung for reporting that variant. These options are included for voluntary testing, not as confirmed device support.\n\nLink 390 `2e56` list/search remain disabled. Link 390 factory reset stays disabled. USB voice language updates remain experimental and off by default.\n\nThe service reports control permissions to frontends, and debug history now includes fresh pairing attempts without saving request parameters.\n\nUpdate official builds with:\n\n```sh\njabridge update\n```\n\nFor package-managed builds, use your package manager. Device firmware is updated separately from the Firmware menu.\n\n[Hardware results and limits](https://github.com/Watchdog0x/jabridge/blob/v1.5.0/docs/HARDWARE_TESTING.md) · [Optional setting tests](https://github.com/Watchdog0x/jabridge/blob/v1.5.0/docs/TEST_EVOLVE3_CONTROLS.md) · [Optional Link 380c test](https://github.com/Watchdog0x/jabridge/blob/v1.5.0/docs/TEST_LINK380C.md)\n","mentions_count":3}
