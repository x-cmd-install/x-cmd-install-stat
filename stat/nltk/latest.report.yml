-2026-12841)\n* fix(security): trust the system temp dir only when it is private (CWE-377/CWE-378)\n* fix(security): validate corpus-reader roots against the data sandbox (CWE-73)\n* fix(security): validate per-call java() options and replace the -XX:/-D allowlist with a minimal one (CWE-88)\n* Additional security hardening (CWE-407, CWE-426, CWE-427, CWE-502, CWE-59, CWE-776, CWE-918)\n\nThanks to the following contributors to 3.10.3: Mohammad Favas S, leduckhuong, Ziyu Lin, dougtrainer28-cmyk, Chaitanya Kadian, 0xRenSec, Arpit Jain, Jace, nguyencanhthuong, Liling Tan, medimedi, Eric Kafe.\n\n\n\n## What's Changed\n* Sandbox Stanford JAR execution to nltk_data directories by @ekaf in https://github.com/nltk/nltk/pull/3743\n* docs: wrap Chat-80 HOWTO output by @medisean in https://github.com/nltk/nltk/pull/3741\n* ci: sandboxed-open guard + stabilize security tests across platforms/pythons (#3740) by @alvations in https://github.com/nltk/nltk/pull/3744\n* Prepare release 3.10.3 by @ekaf in https://github.com/nltk/nltk/pull/3745\n\n## New Contributors\n* @medisean made their first contribution in https://github.com/nltk/nltk/pull/3741\n\n**Full Changelog**: https://github.com/nltk/nltk/compare/v3.10.2...v3.10.3","mentions_count":3}
