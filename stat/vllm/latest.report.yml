{"id":447739190,"author":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOI7xefs4ar_U2","tag_name":"v0.34.0","target_commitish":"main","name":"v0.34.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-16T04:27:15Z","updated_at":"2026-11-18T21:02:33Z","published_at":"2026-11-16T23:22:00Z","assets":[{"id":756908420,"node_id":"RA_kwDOI7xefs4tHYGE","name":"vllm-0.34.0+cpu-cp38-abi3-macosx_11_0_arm64.whl","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":34281752,"digest":"sha256:cd0abe2a9d698bc0bef36ac9aa38da34307c53572ddee60ca35faef280af99d2","download_count":380,"created_at":"2026-11-16T23:49:58Z","updated_at":"2026-11-16T23:50:01Z"},{"id":756908432,"node_id":"RA_kwDOI7xefs4tHYGQ","name":"vllm-0.34.0+cpu-cp38-abi3-manylinux_2_39_aarch64.whl","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":78561625,"digest":"sha256:2621c0e1f231b09bd225f316447ad87ad9a857e582c08ed7f5cf735a3084225d","download_count":277,"created_at":"2026-11-16T23:49:58Z","updated_at":"2026-11-16T23:50:04Z"},{"id":756908431,"node_id":"RA_kwDOI7xefs4tHYGP","name":"vllm-0.34.0+cpu-cp38-abi3-manylinux_2_39_x86_64.whl","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":163849325,"digest":"sha256:47fc0adfbbb00168d5a755b08a4b5fbde7e180c91c0a065221e7a253b8bbb5ff","download_count":1199,"created_at":"2026-11-16T23:49:58Z","updated_at":"2026-11-16T23:50:09Z"},{"id":756908424,"node_id":"RA_kwDOI7xefs4tHYGI","name":"vllm-0.34.0+xpu-cp38-abi3-manylinux_2_34_x86_64.whl","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":38086689,"digest":"sha256:3c279c7e5cf9b871ae4a7e07d2a960090f729d1a3c8850219fc302797a8eb646","download_count":56,"created_at":"2026-11-16T23:49:58Z","updated_at":"2026-11-16T23:50:01Z"},{"id":756908444,"node_id":"RA_kwDOI7xefs4tHYGc","name":"vllm-0.34.0-cp38-abi3-manylinux_2_28_aarch64.whl","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":238960498,"digest":"sha256:7d96231fc141ad4b3a441292b77362b285b335ca7d1b0e2ab441d4ebde82f405","download_count":2473,"created_at":"2026-11-16T23:49:58Z","updated_at":"2026-11-16T23:50:13Z"},{"id":756908573,"node_id":"RA_kwDOI7xefs4tHYId","name":"vllm-0.34.0-cp38-abi3-manylinux_2_28_x86_64.whl","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":239039932,"digest":"sha256:79ca4b3cd74aec08c4bf476bdf0cb15735b605ae5368526a2faae1e30f044ca2","download_count":2711,"created_at":"2026-11-16T23:50:02Z","updated_at":"2026-11-16T23:50:15Z"},{"id":756908571,"node_id":"RA_kwDOI7xefs4tHYIb","name":"vllm-0.34.0.tar.gz","label":"","uploader":{"login":"khluu","id":51931015,"node_id":"MDQ6VXNlcjUxOTMxMDE1","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":50892813,"digest":"sha256:fcad848b246a9d8652b47e6425af92334dc02492f9802720f54e27b823cf0113","download_count":85,"created_at":"2026-11-16T23:50:02Z","updated_at":"2026-11-16T23:50:08Z"}],"body":"# v0.34.0\r\n\r\n**1,061 commits from 412 contributors (120 new).** Thank you!\r\n\r\n## TL;DR\r\n\r\n- **10 new models** (Mistral Large 4, MiniMax-M3.1-Flash, Nemotron-3.5-Transcribe, and more!)\r\n- **Extensible KV cache is on by default:** vLLM sizes the KV cache from memory actually free after warmup, so most models get a bigger cache and more throughput - in most cases you should now **remove `gpu_memory_utilization`** from your configs.\r\n- **Model Runner V1 is gone.** Model Runner V2 is now the only GPU runner.\r\n- **Big speedups** on Blackwell and MI355X: up to 1.95× decode (Step5 on GB200), 1.6× throughput (GLM-5.3-Flash), 1.24–1.40× faster long-prompt TTFT (GLM-5.3).\r\n- **Upgrade check:** default block size is now 64, ROCm 7.2 images are gone, and `huggingface_hub >= 2.0.0` is required. See [Before you upgrade](#before-you-upgrade).\r\n\r\n## Before you upgrade\r\n\r\n> [!IMPORTANT]\r\n> These changes can break existing setups.\r\n\r\n| Change | What to do | PR |\r\n|---|---|---|\r\n| Model Runner V1 removed | Remove `VLLM_USE_V2_MODEL_RUNNER=0`; it now fails at startup. Port V1 logits processors to `vllm.v1.worker.gpu.sample.logits_processor`. | #63373 |\r\n| Default `--block-size` is 64 (was 16) | Pass `--block-size 16` to keep the old behavior. ROCm paged attention still uses 16. | #63231 |\r\n| Extensible KV cache on by default; `gpu_memory_utilization` defaults to 1.0 | **In most cases it's now best to not set `gpu_memory_utilization`**. This should provide maximum kv cache capacity while avoiding runtime OOMs. Use it to share a GPU with other processes or when extensible kv cache is disabled. | #56492 |\r\n| ROCm 7.2 artifacts dropped | Use the ROCm 10.0 wheels and images. `-rocm72` is no longer published. | #61939 |\r\n| `huggingface_hub >= 2.0.0` required | Also requires `tokenizers >= 0.23.3` and `timm >= 1.0.30`. | #64779 |\r\n| QuTLASS / `fp_quant` removed | `fp_quant` checkpoints no longer load. | #65230 |\r\n| Marlin W4A8 removed | Use `--quantization humming` with `VLLM_HUMMING_INPUT_QUANT_CONFIG` instead of `VLLM_MARLIN_INPUT_DTYPE`. | #65542 |\r\n| Keye-VL and Keye-VL-1.5 removed | — | #64287 |\r\n\r\nAll breaking changes, deprecations and new defaults are listed in [the full changelog](#full-changelog).\r\n\r\n## New models\r\n\r\n| Model | Notes | PR |\r\n|---|---|---|\r\n| **Mistral Large 4** | 1T total / 52B active, FP8 and NVFP4. Runs on NVIDIA Blackwell/Hopper and AMD MI350. | #64534 |\r\n| MiniMax-M3.1-Flash | Blackwell NVFP4 and ROCm kernels, DSpark draft | #64111 |\r\n| NVIDIA Nemotron-3.5-Transcribe | 30B-A4B speech model: audio chat and `/v1/audio/transcriptions` | #64282 |\r\n| Ricursive Ripple-65B Preview | BF16 and NVFP4, `ripple` reasoning and tool parsers | #65745 |\r\n| Zyphra ZAYA1 | ZAYA1-8B, ZAYA1-74B-preview | #65302 |\r\n| Baidu Unlimited-OCR-2 | DASH sparse attention | #64016 |\r\n| Liquid AI LFM3, LFM3-VL, LFM3-Audio | | #65826, #65827, #65828 |\r\n| NVIDIA Canary-1B-v2 | ASR and X↔En translation | #64215 |\r\n| Ming3-ASR | | #63585 |\r\n| NVIDIA Parakeet TDT | Through the vllm-parakeet-plugin | #65005 |\r\n\r\n## Highlights\r\n\r\n### Extensible KV cache, on by default\r\n\r\n- On CUDA and ROCm, the KV cache is sized from memory actually free **after** CUDA graph capture and warmup, not from an estimate (#56492).\r\n- **Result:** a larger cache (e.g. MiniMax-M3 on H200: 433k → 672k tokens), so throughput is higher and TTFT lower at high concurrency.\r\n- **Trade-off:** per-token decode latency can rise on some models (TPOT +6–18% on some H200 models at concurrency 128). Opt out with `--gpu-memory-utilization 0.9` or `--no-enable-extensible-kv-cache`.\r\n- Hardened with fixes for allocator fragmentation, startup OOMs and KV connectors (#67296, #67485, #66731, #66523, #66197, #65137, #66605, #66674).\r\n\r\n### Model Runner V2 only\r\n\r\n- Model Runner V1 is removed (#63373).\r\n- Dual-batch overlap now runs on MRV2, including with speculative decoding and DCP (#61464).\r\n\r\n### Speculative decoding\r\n\r\n- **Suffix decoding** runs on MRV2 with a GPU speculator; Arctic Inference is no longer needed (#60339).\r\n- **Custom speculators:** declarative configs plus a `register_speculative_method` plugin API (#63205).\r\n- **CUDA graphs** for MRV2 draft-model speculators (#60989).\r\n- **Adaptive verification** works with XPress (#65175).\r\n- **Draft KV cache matches the target's dtype**, so an FP8 target gets an FP8 draft cache (#65198).\r\n\r\n### Performance\r\n\r\n| Improvement | Hardware | Gain | PR |\r\n|---|---|---|---|\r\n| Step5 NVFP4 MoE on TRTLLM-Gen | 4×GB200 | up to **1.95×** decode | #65152 |\r\n| GLM-5.3-Flash DeepGEMM FP8 MegaMoE | NVIDIA | **1.6×** output throughput vs DEP4 | #60895 |\r\n| Muse Spark Open specialized decode (opt-in) | GB300 | **1.5×** single-stream decode | #64077 |\r\n| Token-sharded sparse-MLA prefill under TP (default) | GB200 | GLM-5.3 TTFT **1.24–1.40×** faster at 32K–128K | #63956 |\r\n| KV-balanced MLA decode for Kimi-K3 (opt-in) | GB300 | **1.34–1.59×** decode attention | #63638 |\r\n| Qwen3.5 on breakable CUDA graphs (no torch.compile) | NVIDIA | **3.0–8.8%** lower decode ITL | #51012 |\r\n| FlyDSL decode monokernel, Muse Spark Open DSpark | 8×MI355X | **+35–57%** interactivity at conc. 1–8 | #63440 |\r\n\r\n### AMD ROCm\r\n\r\n- Release images and wheels are **ROCm 10.0 only** (#61939).\r\n- MoRI EPv2 via `--all2all-backend mori` (#61361).\r\n- Kimi-K3 specialized decode on MI355X, opt-in (#61435).\r\n- TRITON_ATTN is the default attention backend on RDNA3 and RDNA4 (#60418).\r\n\r\n### Serving and operations\r\n\r\n- **Checkpoint/restore** (CRIU + `cuda-checkpoint`) through `/checkpoint/prepare`, `/checkpoint/status` and `/checkpoint/restore`, in both the Python and Rust frontends (#62570).\r\n- **Fault-tolerant DP+EP scale-down:** dead ranks are removed and their experts redistributed without a restart (#46370).\r\n- Best-effort **NUMA binding** on by default (#61258).\r\n- Opt-in **cache-aware admission** ordering (#54625).\r\n- Rust frontend: stateless **Responses API** (#63902) and **`n > 1`** (#65625).\r\n\r\n## Install\r\n\r\n**Python wheels**\r\n\r\n| Platform | Install |\r\n|---|---|\r\n| CUDA 13.0 (PyPI) | `pip install vllm` |\r\n| CUDA 13.0 (uv) | `uv pip install vllm --torch-backend=auto` |\r\n| ROCm 10.0 | `pip install vllm --extra-index-url https://wheels.vllm.ai/rocm/0.34.0/rocm100` |\r\n| XPU | `uv pip install vllm --extra-index-url https://wheels.vllm.ai/0.34.0/xpu --extra-index-url https://download.pytorch.org/whl/xpu --index-strategy unsafe-best-match` |\r\n\r\n<!-- TODO(reviewer): confirm the XPU install line still resolves now that vllm_xpu_kernels==0.1.17 comes from https://vllm-project.github.io/vllm-xpu-kernels/whl (#64633, #60609); the release index may need that extra index too. -->\r\n\r\n**Docker images**\r\n\r\n| Platform | Image | Short alias |\r\n|---|---|---|\r\n| CUDA 13.0 (default) | `vllm/vllm-openai:v0.34.0` | `vllm/vllm:v0.34.0` |\r\n| CUDA 13.0 + DeepEP over AWS EFA | `vllm/vllm-openai:v0.34.0-efa` | `vllm/vllm:v0.34.0-efa` |\r\n| ROCm 10.0 | `vllm/vllm-openai-rocm:v0.34.0` | `vllm/vllm:v0.34.0-rocm` |\r\n| CPU | `vllm/vllm-openai-cpu:v0.34.0` | `vllm/vllm:v0.34.0-cpu` |\r\n| XPU | `vllm/vllm-openai-xpu:v0.34.0` | `vllm/vllm:v0.34.0-xpu` |\r\n\r\n`latest` tags work the same way (e.g. `vllm/vllm:latest-rocm`). The default CUDA image now includes the AWS EFA userspace (libfabric, aws-ofi-nccl). The `-efa` image adds DeepEP built for EFA and routes NCCL over EFA by default (#65576).\r\n\r\nThe **Assets** section below has the source tarball and the CUDA 13.0 (x86_64, arm64), CPU (x86_64, arm64, macOS) and XPU (x86_64) wheels.\r\n\r\n## Full changelog\r\n\r\n<details>\r\n<summary><b>Model support</b></summary>\r\n\r\n- **Mistral Large 4** (#64534) runs on MRV2 with:\r\n  - sparse MLA plus the DSA indexer, and cross-layer KV sharing;\r\n  - DSpark, DCP/PCP, NIXL P/D and HiSparse.\r\n- **Other new models:**\r\n  - MiniMax-M3.1-Flash (#64111), plus P/D across different prefill and decode TP (#64475).\r\n  - Nemotron-3.5-Transcribe with MTP and DFlash2 (#64282, #64944).\r\n- **DeepSeek-V4 / V4.1**\r\n  - Prefill gathers compressed KV once per KV-source group: 38 → 4 gathers per step (#59131).\r\n  - Decoder replay graphs share the model graph pool: prefill graph memory 15.52 → 9.88 GiB per rank on GB200 (#63155).\r\n  - `fused_inv_rope_fp8_quant` 3.5× faster, prefill 6% faster (#63540).\r\n  - DSpark/MTP memory savings of about 512 MiB per GPU (#63996).\r\n  - Engram host tables shared across DP ranks (#62359).\r\n  - DeepGEMM sparse MQA logits on the FP8 indexer cache (#62011).\r\n  - Packed multi-image vision encoding, 1.6–2.6× (#65030).\r\n  - LoRA on the language model, compressor and `wo_a` layers (#57245, #64880).\r\n  - DSpark with PCP (#61994); PCP with PP or DP (#63098).\r\n  - Fixes: sparse prefill in FULL CUDA graphs (#59986), prefill memory budgeting (#63047), MTP embedding under PP (#65816), DeepSeek-V3.2 PP (#59961).\r\n- **GLM**\r\n  - GLM-5.3-Flash: DeepGEMM FP8 MegaMoE (#60895), adaptive verification (#60229), row-strided QKV into FlashKDA (#61614).\r\n  - GLM-5.3 FP8 MoE sorted-A TMA on H200, 6.0–7.6% E2E throughput (#64760).\r\n  - FP8 KV cache for DSpark and DFlash drafts (#63841, #64612, #65553).\r\n  - FP32 indexer MQA logits restored for GLM-5/GLM-5.3/HY-V4, with new `--attention-config.indexer_logits_dtype` (#64580).\r\n  - Fused KDA convs fix stale weights after RL refit (#60991).\r\n- **Muse Spark**\r\n  - Opt-in Muse Spark Open specialized decode on GB300 (#64077).\r\n  - One RoPE cache shared across layers: 11.5 GiB per GPU saved, 14.5% more KV cache on 8×B200 (#65206).\r\n  - GEMM and communication+norm fusions (#65438, #64638); hybrid DeepGEMM MegaMoE / TRT-LLM for NVFP4 (#64525).\r\n  - CUDA routing kernel (#64553), MegaMoE JIT warmup (#63920), DSpark draft loading fix (#65125).\r\n- **MiniMax-M3 / M3.1**\r\n  - Sequence parallelism and GEMM-RS for TP + MegaMoE, 14–20% lower P50 TTFT (#64659), also with PP (#65537).\r\n  - Fused norm + MXFP8 quant, 1.39–1.60× (#64852).\r\n  - Triton query-tiled sparse prefill on Hopper (#57420); SM90 split-K indexer (#64037).\r\n  - No host sync in prefill metadata (#65883); NVFP4 MegaMoE warmup (#66227); fmha_sm100 indexer updates (#66228).\r\n  - Fixes: M3.1 prefill workspace (#64856), sequence parallelism (#65496), encoder CUDA graphs (#65226).\r\n- **Kimi**\r\n  - Opt-in `--attention-backend KIMI_K3_KV_BALANCED_MLA` for agentic workloads on Blackwell (#63638).\r\n  - Kimi-K3 MegaMoE symmetric buffer 10.73 → 2.50 GiB per GPU at TP8 EP (#63541).\r\n  - FlashInfer fused FP8 chunked-context K/V pack (#61527).\r\n  - Fixes: KDA prefill OOM (#63989), NaNs via FlashKDA/FlashMLA pins (#64759), sleep mode (#64583, #66273).\r\n  - Kimi K3.1 groundwork landed (#66030, #66028), but **K3.1 is not servable in this release**.\r\n- **Qwen**\r\n  - Qwen3.5: breakable CUDA graphs instead of torch.compile (#51012); fused norm/gate + quant (#64509) and AR + norm + quant (#64723); GDN `in_proj` overlap (#64425, #64999).\r\n  - GDN prefill state gather/scatter fused for Qwen3-Next/Qwen3.5 and Kimi KDA, 1.16–1.50× (#66064).\r\n  - Qwen3.8-Flash-Next: PLE disk offload via `--engram-config '{\"disk_offload\": true}'` (27 GiB less on DGX Spark, #59958), PP (#60234), shared QSA top-k buffer (#65619), loading fixes (#62318, #65812, #64820, #60490).\r\n  - Fixes: long-context int32 overflow (#63761), multi-layer MTP (#62111).\r\n- **Other models**\r\n  - Step5 MegaMoE with PP (#65504) and KV block sizing (#65153).\r\n  - Gemma 4: multimodal encoder DP (#60314), PP (#65989), FA4 FP8 MMA on SM90 (#60372).\r\n  - Moved to the Transformers modeling backend: OLMoE (#63384), Gemma v1 and StableLM (#66393), Aria (#59767; temporarily about 11% less KV cache and 25% lower image throughput).\r\n  - Matryoshka dimensions for EmbeddingGemma 2 (#64885, #60978); RADIO C-RADIO v2/v3/v4 (#58468).\r\n  - Qwen3-ASR on the upstream Transformers config; no `--hf-overrides` needed for the ForceAligner (#66097, #63274).\r\n  - Fixes: GPT-OSS MXFP4 LoRA (#65825), PLaMo3 GPTQ (#62836), Ling3 (#65088), DomynEdge (#66819).\r\n- **Multimodal**\r\n  - Encoder CUDA graphs for Pixtral/Mistral3 (#56277), shared capture buffers (#65084), one replay per batch up to `encoder_cudagraph_max_token_budget` (#65227).\r\n  - On-device input normalization for Nemotron VL (#57924), Gemma 3 (#64487), Gemma 4 (#65577).\r\n  - `--mm-encoder-tp-mode data` for MiMo-V2.6 (#64179).\r\n  - Fixes: FlashInfer ViT attention on GLM-4.1V/GLM-OCR/GLM-5.3-Flash (#65778), Qwen3-Omni and Qwen2.5-Omni video budgets (#66017, #66190), dots_ocr with TP (#64543), embedding-only startup (#65689), media cache eviction (#65363).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Engine core</b></summary>\r\n\r\n- **Extensible KV cache**\r\n  - On by default on CUDA and ROCm (#56492).\r\n  - Headroom for measured allocator fragmentation, validated on Qwen3.5-397B-A17B-FP8 at TP8+EP on 8×H200 (#67296).\r\n  - Fixes: sizing and startup OOMs (#67485, #66523, #66731, #66197, #65554), connectors that failed to start (#65225), up to 84% undersized caches on DGX Spark (#65413), `--max-model-len auto` (#65463).\r\n  - Startup warning when an explicit `gpu_memory_utilization` withholds memory from it (#66704); docs on when to set it (#67071).\r\n- **Model Runner V2**\r\n  - The only runner after MRV1's removal (#63373); DBO with spec decode and DCP (#61464).\r\n  - Separate prefill (token) and decode (request) CUDA graph capture sizes (#63406).\r\n  - Staged writes copied straight into UVA (#63633); idle sampler writes skipped, about 10–11% faster small-batch decode (#62748).\r\n  - Sampler warmed up after graph capture to stop memory growth under load (#62560).\r\n  - Lower peak memory for chunked prompt logprobs (#64841, #64914); Triton ReplaySSM (#65033).\r\n  - NVIDIA Confidential Computing decode fixes (#59981).\r\n- **Speculative decoding**\r\n  - Suffix decoding (#60339) and custom speculators (#63205) on MRV2; draft-model CUDA graphs (#60989).\r\n  - XPress with adaptive verification (#65175); adaptive verification draft budgets on a Triton kernel (#63421).\r\n  - Batch-sharded draft logits (#63554); DSpark sequential blocks (#63886).\r\n  - DSpark sliding-window MLA draft layers (#63795) under DCP (#63796); fused Markov sampling, 42–50% less sampling time (#64476); `draft_lm_head_quantization` (#64368).\r\n  - Draft KV cache dtype aligned with the target (#65198).\r\n  - Trace replay with ngram/EAGLE3/MTP, 1.47–2.03× (#63275); 3× faster resample kernel (#65100).\r\n  - Fixes: DFlash acceptance of 0 with FULL CUDA graphs (#64059), a resample race (#66048), acceptance-estimator cancellation (#65229), standalone draft prefill under FULL graphs (#65804), grammar-invalid drafts (#61557).\r\n- **Scheduler and engine overhead**\r\n  - Prompt token ids kept as int32 buffers: 40× less per-request CPU on a 128K prompt (#62702).\r\n  - Per-request id lists kept out of the cyclic GC (#65300); 45–50% less KV block allocation CPU (#65831).\r\n  - New requests and aborts handled while waiting for model output (#65466), with a cheaper wait loop (#65773).\r\n  - Opt-in cache-aware admission via `--cache-aware-admission-window` (#54625).\r\n  - `--max-num-inflight-kv-loads` starts async KV loads while the batch is full (#65319), with cached reservations: 47.2 → 5.4 ms per schedule (#65285).\r\n  - A multimodal item is no longer split by a prefix hit (#65271).\r\n- **Startup and compile**\r\n  - No openai/fastapi imports in EngineCore and workers (#65423, #65589).\r\n  - CUDA graph memory profile skipped when its estimate is disabled (#64622).\r\n  - Device-neutral compile cache via `VLLM_COMPILE_ON_ONE_RANK`, on by default (#63247); all graph-affecting config fields hashed into compile cache keys (#65652).\r\n  - `--shuffle-safetensors-files` for large EP startups (#42837).\r\n  - `BasevLLMParameter`'s Python `__torch_function__` dropped: GLM-5.2-FP8 TTFT −6.1% on GB300 (#63785).\r\n- **Lifecycle**\r\n  - Process checkpoint/restore over HTTP (#62570); opt-in multi-worker CUDA checkpoint sleep (#64186).\r\n  - Best-effort NUMA binding by default; `--no-numa-bind` to disable (#61258).\r\n  - Sleep mode with exact-size pinned backups, up to about 578 GiB less host memory per node on Mistral Large 4 TP8 (#64630); level 2 discards only parameters (#66010, #66165, #59994).\r\n  - Fast Start weight-cache restarts for online FP8/MXFP8, ModelOpt CUTLASS FP8/NVFP4/block-FP8 and AWQ/GPTQ Marlin (#63672, #63754, #64119, #64182), with pluggable shared warmup-cache stores (#65168).\r\n  - `WatermarkConfig.enforce` (#62966).\r\n- **RL and weight loading**\r\n  - `VLLM_RELOAD_MODE=direct` writes checkpoint tensors straight into the live model (#64336, #64352, #65281).\r\n  - Every load and update finishes through `finalize_model_weights` (#65914, #64357, #64692, #57678).\r\n  - Load plans for weight-transfer engines (#65235); per-update NCCL source ranks for PP trainers (#62557).\r\n  - Sparse weight patches validated in one pass, 40–48% shorter pause (#66021).\r\n  - Offloaded KV tier survives pause/sleep (#57810); partial stacked weights rejected (#63752).\r\n- **LoRA**\r\n  - MoE-LoRA shrink/expand kernels up to 64 tokens (#64653); embedding LoRA scaled by `embed_scale` (#62470).\r\n  - Rejected: adapters on unwrapped modules (#63489), non-linear expert placement with EP (#62797).\r\n  - Fixes: reloads with requests in flight (#64616), KV-sharing fast prefill (#61162), SEQ_CLS heads (#63286), fused MoE expand rounding (#63894), Mamba-1 (#64681).\r\n- **Batch invariance:** LFM2 ShortConv (#62367), FlashInfer FP8 bmm and W4A16 NVFP4 (#62192), GPTQ (#60479), FA sliding window (#65627), `aten::mm` out_dtype overloads (#60047).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Large-scale serving</b></summary>\r\n\r\n- **Expert parallelism and fault tolerance**\r\n  - DP+EP scale-down via `POST /v1/fault_tolerance/apply` (#46370); MoRI EPv2 (#61361).\r\n  - Opt-in `symm_mem` EPLB weight-migration backend (#62009).\r\n  - `--enable-ep-weight-filter` with EPLB: DeepSeek-R1 NVFP4 DEP8 reads 105 GiB per rank instead of 385 GiB (#64187).\r\n  - `num_redundant_experts` defaults to the minimum valid value (#30614).\r\n  - Skipped combine staging copy in `flashinfer_nvlink_one_sided` (#65498); DeepEP V2 padded rows (#54109).\r\n- **Context parallelism and sparse attention**\r\n  - Token-sharded sparse-MLA prefill under TP (#63956); DCP on the FlashMLA sparse bf16 KV path (#61609).\r\n  - MLA decode up-projected before the A2A merge with `--dcp-comm-backend a2a` (#64994); faster DCP sparse-indexer top-k (#65178, #64129).\r\n  - Cross-layer KV cache sharing for MLA layers (#64095).\r\n  - Fixes: PP rank derivation under PCP (#65539), FlashInfer MLA DCP decode (#59392).\r\n- **KV connectors**\r\n  - NIXL: push mode via `transfer_mode` (#64230); `ucx_backend_params` (rocm_ipc on MI355X: 3.4 → 483.7 Gbps, #62905); 38% fewer hybrid SSM transfer bytes (#62317); block pairing across different P/D block sizes (#59746), with mismatched push handshakes rejected (#59747); same-host NVLink with the extensible KV cache (#65137).\r\n  - Mooncake: selective leases (#63420), automatic `cache_prefix` (#65160), per-GPU RDMA devices (#65076), heterogeneous-TP hybrid sharing (#54307), sleep mode (#59934), lease renewal (#64193).\r\n  - Lookahead block hashes in NIXL, Mooncake and offloading connectors (#64096); UMBP standalone mode (#61795, #61793).\r\n  - Out-of-tree and LMCache MP connectors with the extensible KV cache (#66605, #66674).\r\n- **KV offload**\r\n  - SimpleCPUOffload with one host buffer per rank and opt-in HugeTLB pages (#60130); no zero-filled pool (#64345).\r\n  - KVCR v0.2.0 (#64224, #63889); async lookups published per request group (#57474); secondary tiers rejected on multi-node engines (#62930).\r\n  - Hardened P2P tier (#63781, #64250, #64256, #64251, #64501, #63618, #64300, #63988) and correctness fixes (#64229, #63566, #65279, #65631, #64400, #63937, #65640).\r\n- **HiSparse**\r\n  - Uses the extensible KV cache by default: 16% more GPU+host KV capacity (#65214).\r\n  - Fused slot invalidation, up to 1.8% lower TPOT on GLM-5.3-NVFP4 (#60103); fewer hash probes (#61263); speculative-group prefetch (#63801).\r\n  - Platform backend for hardware plugins (#62592); scheduler deadlock fix (#62979).\r\n- **EPD and distributed**\r\n  - Metadata-only image and video inputs for GLM-5.3-Flash and DeepSeek-V4.1 (#64071, #62802).\r\n  - Bitwise-identical 1-stage and 2-stage custom all-reduce (#57042); FlashInfer all-reduce gated on 16-byte rows (#63123).\r\n  - Cross-node MNNVL groups kept off CUDA IPC all-reduce (#55835).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Hardware</b></summary>\r\n\r\n- **NVIDIA**\r\n  - Step5 NVFP4 TRTLLM-Gen MoE (#65152).\r\n  - DeepSeek-V4.1: latency_specialized decode extended, 5.9–17% faster decode step on GB300 (#63921); swap-AB CuTe DSL decode attention for TP2/TP4, 1.4–2.15× (#62633); opt-in fused DSpark Markov sampling, 1.6–3.9× (#64442).\r\n  - Sparse-indexer top-k reads BF16 logits directly (#62172, #64138); single-launch fused prefill top-k (#60618).\r\n  - GLM-5.3 TMA MoE projections on H200 and SM100 (#63820, #65746); SM90 native small-head sparse FlashMLA, +10% on GLM-5.3-Flash TP4 (#64510).\r\n  - CuTe DSL BF16x3 router GEMM for fp32 routers on Hopper (#61903); fused GDN MTP decode for DSpark K=8, +18% on B300 (#65874).\r\n  - GLM-5.3-Flash on 2× DGX Spark, 15% lower TPOT (#62956); faster weight loading on integrated GPUs (#58868).\r\n  - Rubin locality-domain NVFP4 MoE (#61685); Jetson Thor (SM110) fixes (#62133, #65050, #62275).\r\n- **AMD ROCm**\r\n  - ROCm 10.0 only (#61939); AITER v0.1.28.post1 (#63774, #65937); MoRI EPv2 (#61361).\r\n  - MonoKernel decode for Muse Spark Open DSpark verify (#63440), DeepSeek-V4.1-Flash at TP8 (#64101) and the MiniMax-M3.1 DSpark drafter, +10% P90 interactivity (#65386).\r\n  - Kimi-K3 specialized decode (#61435), AITER-tuned prefill GEMMs: mean TTFT 5.35 → 4.05 s (#63730), opt-in FlyDSL FP8 MLA prefill (#59124).\r\n  - DeepSeek-V4-Pro P/D over MoRIIO (#48989); Step-5-Preview (#61837) and Reflection Beam 1.0 (#62057) on ROCm.\r\n  - RDNA: TRITON_ATTN by default (#60418), AITER Triton kernels on RDNA3 (#52970), HIP GDN prefill backend for gfx1151 (#56307), opt-in W4A16 dense prefill cache: TTFT −22 to −26% on Strix Halo (#60710).\r\n  - Fixes: Kimi-K2.6 int4 prefill regression on Triton 3.8 (#62565), MI355 extensible KV cache OOMs (#65418).\r\n- **Intel XPU**\r\n  - PyTorch 2.15 (#63977) and vllm_xpu_kernels 0.1.17 with new MoE/MLA interfaces (#60609).\r\n  - Per-token dynamic FP8 activations (#61362); faster batched Triton MoE (#51605); MRoPE kernel (#59938); GDN metadata reuse (#64479); DeepSeek-V4 adaptive verification (#62309).\r\n- **CPU**\r\n  - MRV2 on CPU backends without Triton: Arm, IBM Z, PowerPC, RISC-V (#61995).\r\n  - zentorch 2.14.0.2 (#65669) and Laguna MoE on Zen (#63711).\r\n  - Faster GDN spec-decode updates (#64829); Gemma 4 MoE gelu_tanh (#61593); bidirectional encoder-only attention (#63738).\r\n- **Other:** out-of-tree layer overrides via `vllm.model_executor.hw_agnostic.resolve` (#60218); shared routed-expert row restorers (#64689); Ascend Triton fix (#64013).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Quantization</b></summary>\r\n\r\n- New `--quantization lut_b_moe`: about 3.14-bit MoE experts with MXFP8 activations, native on Rubin (#62759).\r\n- `w4afp8` checkpoints on the W4A8 FP8 MoE path (#64410).\r\n- Block Hadamard input rotation with online `mxfp4_hadamard32` and Quark online-rotation checkpoints (#62750).\r\n- CSF-compressed NVFP4 block scales in ModelOpt (#64312); activation quant overrides for online MXFP4 (#51808).\r\n- DeepSeek-V4.1 MXFP8 linears on cuBLASLt (#64815); 3× faster MXFP4 activation quant (#63101); faster FP8 quant on SM100+ (#61641).\r\n- QuIP NVFP4 on Humming (#65230).\r\n- Fixes: NVFP4 NaN logits (#63382, #61755), Humming FP8 (#60163, #56606), hadacore (#63514).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>API and frontend</b></summary>\r\n\r\n- **New endpoints and options**\r\n  - `/checkpoint/prepare`, `/checkpoint/status`, `/checkpoint/restore` (#62570).\r\n  - `thinking_token_budget` on `/v1/responses` (#63896); `/v1/completions` in `vllm run-batch` (#64097).\r\n  - Streaming derender on `/inference/v1/generate` (#63103).\r\n  - Anthropic Messages API: `min_tokens` (#65459) and `thinking.type=between_tools` (#65954).\r\n  - `vllm:request_render_duration_seconds` histogram (#60213).\r\n- **Tool calling and reasoning**\r\n  - New `granite_toolcall_parser` for Granite 4.2 (#65216); llama3_json moved to the ParserEngine (#63569).\r\n  - Incremental streaming for Kimi K3 (#62203), `tool_choice=\"required\"` (#60882), DeepSeek V4/V3.2 (#58780), GLM-4.7 (#64535), Qwen3 (#64675).\r\n  - Fixes: DeepSeek V4.1 (#62517, #64971, #62729, #62647), GLM-4.7 (#64615), Step3 (#65274), FunctionGemma (#63992), union/enum string parameters (#64518).\r\n- **Behavior**\r\n  - Corrupt or oversized images and disabled local media return 400 instead of 500 (#63433, #60308, #64032).\r\n  - Responses accepts incomplete assistant/reasoning history, e.g. from Codex (#35508).\r\n  - Multi-template processors use the default template (#63606); an empty `tools` array is accepted like OpenAI (#65547).\r\n  - The first streamed usage reports cached prompt tokens (#65036); plain completion stream frames render about 9× faster (#52875).\r\n- **Rust frontend**\r\n  - Stateless Responses API (#63902) with namespace tools (#65853); `n > 1` (#65625); `--skip-tokenizer-init` (#64697).\r\n  - Hybrid and external DP load balancing (#64451, #64450); native GLM-5.3 chat rendering (#62424).\r\n  - Prompt block hashing off the engine's GIL (#63842); `--reasoning-effort-map` (#62312).\r\n  - `--enable-log-outputs`, `--max-log-len`, `--root-path`, `--log-error-stack` (#63769, #64223, #64222, #65001).\r\n  - More request, response and metric parity with Python (#65293, #65294, #65623, #65624, #64218, #64526, #63964, #65636).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>Security, dependencies and build</b></summary>\r\n\r\n- **Security**\r\n  - ReDoS in the validation-error sanitizer fixed (#52120).\r\n  - FunAudioChat audio bounded to the profiled duration (#57411).\r\n  - `/v1/systemone` honors `--trust-request-chat-template` (#64503).\r\n  - Raised floors for filelock, OpenTelemetry, graphql-core and others (#63574).\r\n- **Dependencies**\r\n  - PyTorch stays at 2.14.0. FlashInfer 0.7.3 (#65930).\r\n  - `huggingface_hub >= 2.0.0`, `tokenizers >= 0.23.3`, `timm >= 1.0.30` (#64779); `transformers >= 5.16.1, < 5.23.0` (#64049, #64529); `mistral-common >= 1.13.0` (#64169).\r\n  - DeepEP 2.1 (#59844); DeepGEMM pin updates (#64411, #64580, #65494); FlashMLA and FlashKDA pins (#61971, #64759).\r\n  - NIXL 1.5.2 (#64579, #64585); mooncake-transfer-engine 0.3.14 (#65576); Run:ai Model Streamer 0.17.1 (#63174); `fastokens >= 0.3.5` for `VLLM_USE_FASTOKENS` (#65679).\r\n  - ROCm: AITER v0.1.27 → v0.1.28.post1 (#63774, #65937). XPU: PyTorch 2.15 (#63977), triton-xpu 3.9.0 (#65047), vllm_xpu_kernels 0.1.17 (#60609). CPU: zentorch 2.14.0.2 (#65669).\r\n- **Build**\r\n  - x86_64 CUDA wheel about 82 MB (about 25%) smaller, kernels unchanged (#65518).\r\n  - Default CUDA image installs the AWS EFA userspace; the `-efa` image now only adds DeepEP for EFA (#65576); nightly EFA images as `vllm/vllm-openai:efa-nightly` (#64028).\r\n  - One ROCm build and release pipeline, ROCm 10.0 only (#61939).\r\n  - Source builds fetch `triton_kernels` from a tarball (#65162) and ship tuned kernel configs in the wheel (#64063).\r\n  - CUDA `x.yf` arches no longer fall back to a lower minor (#66016).\r\n\r\n</details>\r\n\r\n<details>\r\n<summary><b>All breaking changes, deprecations and new defaults</b></summary>\r\n\r\n- **Model Runner V1 removed** (#63373).\r\n  - `VLLM_USE_V2_MODEL_RUNNER` and `VllmConfig.use_v2_model_runner` are gone; setting the env var to anything but `1` fails at startup.\r\n  - Dropped with it: the V1 logits-processor API (`vllm.v1.worker.gpu.sample.logits_processor` is the only interface), the `custom_class` speculative method, `use_heterogeneous_vocab`, `disable_padded_drafter_batch`, `parallel_drafting` outside DFlash/DSpark, PP with `external_launcher`, `NGramPerReqLogitsProcessor`, and x86 CPUs without Triton.\r\n  - Deprecated: `parallel_drafting`, `capture_torch_profiler`, `enable_layerwise_nvtx_tracing`.\r\n- **Default `--block-size` is 64** instead of 16 (#63231). Backends with a preferred block size still override it (ROCm paged attention keeps 16), and an explicit `--block-size` still wins.\r\n- **`gpu_memory_utilization` defaults to 1.0** when unset with the extensible KV cache on (#56492). An explicit value in (0.8, 1.0) that withholds 1 GiB or more logs a warning (#66704).\r\n- **ROCm 7.2** wheels and `-rocm72` images are no longer published (#61939).\r\n- **Removed:**\r\n  - QuTLASS and the `fp_quant` method (#65230).\r\n  - Marlin INT8/FP8-activation (W4A8) paths and `VLLM_MARLIN_INPUT_DTYPE`; use `--quantization humming` with `VLLM_HUMMING_INPUT_QUANT_CONFIG` (#65542).\r\n  - Keye-VL and Keye-VL-1.5 (#64287); `disable_mtp_completeness_check` (#49459); the `refresh_derived_weights` hook (#65914).\r\n- **Dependencies:** `huggingface_hub >= 2.0.0` (#64779); `mistral-common >= 1.13.0` (#64169); XPU requires vllm_xpu_kernels 0.1.17 (#60609).\r\n- **Model and plugin code:** all `process_weights_after_loading` hooks share one signature and the loader runs every module's hook (#57678); config `compute_hash()` replaced by `compile_factors()` / `hash_config()` (#65652).\r\n- **API behavior:**\r\n  - llama3_json no longer streams tool arguments incrementally (#63569).\r\n  - Canary transcription without `language` returns 400 (#65445).\r\n  - An empty `tools` array is accepted in both frontends (#65547, #65854).\r\n  - `/v1/systemone` rejects request-supplied chat templates without `--trust-request-chat-template` (#64503).\r\n  - LoRA adapters on modules vLLM does not wrap are refused (#63489); misconfigured NCCL weight transfer raises (#57022).\r\n  - `vllm-rs serve` no longer reads `--data-parallel-rank` from `VLLM_DP_RANK` (#65369).\r\n  - AITER fused shared experts with MiniMax M3 and DeepSeek V4 need `VLLM_ROCM_USE_AITER=1` (#61457).\r\n- **Still deprecated:** `--mamba-cache-mode` has no effect; its removal was postponed (#64838).\r\n- **New defaults:**\r\n  - Extensible KV cache (#56492); block size 64 (#63231); best-effort NUMA binding (#61258).\r\n  - Token-sharded sparse-MLA prefill at 1024 or more prefill tokens (#63956); MLA decode up-projection before the A2A merge (#64994).\r\n  - `VLLM_COMPILE_ON_ONE_RANK` (#63247); minimum valid EPLB `num_redundant_experts` (#30614).\r\n  - HiSparse on the extensible KV cache (#65214); encoder CUDA graphs up to `encoder_cudagraph_max_token_budget=5120`, eager above (#65227).\r\n  - TRITON_ATTN on RDNA3/RDNA4 (#60418); MRV2 on non-Triton CPUs (#61995); `float32` Mamba SSM cache for Nemotron Omni (#63218); Zipf routing in `vllm bench forward` (#64167).\r\n\r\n<!-- TODO(reviewer): `--mamba-cache-mode` and `--ir-op-priority` still exist in v0.34.0 with warnings that say \"will be removed in v0.34.0\", and the LM Format Enforcer backend is still deprecated rather than opt-in as v0.33.0 announced (#64838, #63371, #63423). Should these notes name a new removal version, or leave the timeline out? -->\r\n\r\n</details>\r\n\r\n## Contributors\r\n\r\n<details>\r\n<summary><b>120 new contributors</b>: welcome!</summary>\r\n\r\n* @0xDexe made their first contribution in https://github.com/vllm-project/vllm/pull/65274\r\n* @akote123 made their first contribution in https://github.com/vllm-project/vllm/pull/61593\