{"id":372863451,"author":{"login":"amanusk","id":7280933,"node_id":"MDQ6VXNlcjcyODA5MzM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBTpGcM4WOXHb","tag_name":"v1.5.0","target_commitish":"master","name":"v1.5.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-19T07:17:40Z","updated_at":"2026-08-19T07:23:35Z","published_at":"2026-08-19T07:23:35Z","assets":[],"body":"# V1.5.0 Release notes\r\n\r\n## What's new\r\nThe main new addition is adding throttle detect for supported AMD CPUs. This is not as advanced as the Intel version, but if a CPU is being throttled below it's base clock due to power or temperature limitations, this will be indicated by a change in color of the graph and of the statistic line\r\nAlso bug fixes and stability improvements thaks to new contributors. \r\n\r\n\r\n## What's Changed\r\n* Unsafe handling of psutil.cpu_count() by @tang-vu in https://github.com/amanusk/s-tui/pull/278\r\n* Change the dashed line, fixing #280 by @amanusk in https://github.com/amanusk/s-tui/pull/282\r\n* Replace built-in stresser's numpy kernel with dense matmul for stronger thermal load by @amanusk in https://github.com/amanusk/s-tui/pull/286\r\n* Handle dynamic Energy Performance Preference in Power Profile by @s-stepien in https://github.com/amanusk/s-tui/pull/287\r\n* Narrow EPP choices reactively when a write is rejected (Intel fix) by @amanusk in https://github.com/amanusk/s-tui/pull/288\r\n* Do not show a strategy if it is not available by @amanusk in https://github.com/amanusk/s-tui/pull/291\r\n* Save stress menu options between sessions by @amanusk in https://github.com/amanusk/s-tui/pull/292\r\n* Feat/amd throttle detect by @amanusk in https://github.com/amanusk/s-tui/pull/281\r\n* Fall back to /proc/device-tree/model for processor name by @Sanjays2402 in https://github.com/amanusk/s-tui/pull/295\r\n* Disable buffering on MSR reads by @JosefSchoenberger in https://github.com/amanusk/s-tui/pull/297\r\n* fix: handle psutil sensor read failures by @gentosai404 in https://github.com/amanusk/s-tui/pull/299\r\n* Handle non-IndexError failures in graph and summary updates by @Sanjays2402 in https://github.com/amanusk/s-tui/pull/296\r\n* chore(lint): pyright basic mode, drop 21 stale urwid ignores by @amanusk in https://github.com/amanusk/s-tui/pull/301\r\n* fix: stop rebuilding Fan/Rapl widget tree every cycle (100% CPU after hours) by @amanusk in https://github.com/amanusk/s-tui/pull/300\r\n\r\n## New Contributors\r\n* @tang-vu made their first contribution in https://github.com/amanusk/s-tui/pull/278\r\n* @s-stepien made their first contribution in https://github.com/amanusk/s-tui/pull/287\r\n* @Sanjays2402 made their first contribution in https://github.com/amanusk/s-tui/pull/295\r\n* @JosefSchoenberger made their first contribution in https://github.com/amanusk/s-tui/pull/297\r\n* @gentosai404 made their first contribution in https://github.com/amanusk/s-tui/pull/299\r\n\r\n**Full Changelog**: https://github.com/amanusk/s-tui/compare/v1.4.0...v1.5.0","reactions":{"total_count":3,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":6}
