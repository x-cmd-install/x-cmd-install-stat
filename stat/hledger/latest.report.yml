{"id":377758270,"author":{"login":"simonmichael","id":10144,"node_id":"MDQ6VXNlcjEwMTQ0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAI3tps4WhCI-","tag_name":"1.52.3","target_commitish":"main","name":"1.52.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-27T11:07:46Z","updated_at":"2026-09-05T17:27:36Z","published_at":"2026-08-27T11:10:37Z","assets":[{"id":532198314,"node_id":"RA_kwDOAI3tps4fuLOq","name":"hledger-linux-x64.tar.gz","label":"","uploader":{"login":"simonmichael","id":10144,"node_id":"MDQ6VXNlcjEwMTQ0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":48712153,"digest":"sha256:d14a4fc2ac804b556f481b64e8c54efa380db1ac85b3723c9df7b1eeade74b3a","download_count":1102,"created_at":"2026-08-27T11:20:24Z","updated_at":"2026-08-27T11:20:29Z"},{"id":532198395,"node_id":"RA_kwDOAI3tps4fuLP7","name":"hledger-mac-arm64.tar.gz","label":"","uploader":{"login":"simonmichael","id":10144,"node_id":"MDQ6VXNlcjEwMTQ0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":53162732,"digest":"sha256:430ef7b9684c9eadde274267fa4fc7c0e1c4b59f066d3a3f93cda04fce930d45","download_count":67,"created_at":"2026-08-27T11:20:30Z","updated_at":"2026-08-27T11:20:36Z"},{"id":532198504,"node_id":"RA_kwDOAI3tps4fuLRo","name":"hledger-mac-x64.tar.gz","label":"","uploader":{"login":"simonmichael","id":10144,"node_id":"MDQ6VXNlcjEwMTQ0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":17940270,"digest":"sha256:c9b7d376eb0068388c3c810ad3465e08b76057c1a3712d7283650fa712b9aa62","download_count":24,"created_at":"2026-08-27T11:20:36Z","updated_at":"2026-08-27T11:20:39Z"},{"id":532198555,"node_id":"RA_kwDOAI3tps4fuLSb","name":"hledger-windows-x64.zip","label":"","uploader":{"login":"simonmichael","id":10144,"node_id":"MDQ6VXNlcjEwMTQ0","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":52003118,"digest":"sha256:ae16e1f6a311f7cae6e09d4ef1d0fc0c214fb4041d9100d0ac29bade1219fc09","download_count":456,"created_at":"2026-08-27T11:20:39Z","updated_at":"2026-08-27T11:20:45Z"}],"body":"\n<details>\n<summary>\n\n## Release notes\n\n</summary>\n\n### hledger 1.52.3\n\n- Uses hledger-lib 1.52.3.\n\n\n### hledger-ui 1.52.3\n\n- Uses hledger 1.52.3.\n\n\n### hledger-web 1.52.3\n\n\nFixes\n\n- Another XSS (cross-site scripting) vulnerability has been fixed, in\n  the add transaction form's error message. Any web page visited while\n  hledger-web was running could use it to run javascript in\n  hledger-web's origin, and from there read the whole journal, or\n  alter it. All hledger-web users should upgrade. See also:\n  GHSA-vq7r-8w52-jv84.  (Arthur Cinader, Simon Michael, [#2700])\n\n- A newline submitted in a transaction's description, code or account\n  name is no longer written into the journal file. This removes the\n  possibility of the user inserting an include directive, which could\n  expose system files readable by the hledger-web server. See also:\n  GHSA-vq7r-8w52-jv84.  [#2704]\n\n  Note: as with #2698 in 1.52.2, these fixes were backported from\n  AI-assisted fixes in hledger 2, under the security exception in\n  https://hledger.org/AI.html; they have been reviewed and tested.\n\n- hledger-web's official binaries, and builds from the hledger source\n  tree, now use aeson 2.3, avoiding a denial of service bug.\n  (<https://haskell.github.io/security-advisories/advisory/HSEC-2026-0007.html>)\n\n[#2700]: https://github.com/simonmichael/hledger/issues/2700\n[#2704]: https://github.com/simonmichael/hledger/issues/2704\n\n\n### credits 1.52.3\n\nSimon Michael,\nArthur Cinader.\n\n\n\n</details>\n\n<details>\n<summary>\n\n## Install\n\n</summary>\n\nThe [hledger Install page](https://hledger.org/install) lists the easiest ways to install a recent release,\nsuch as `brew` on macos, `choco`/`scoop`/`winget` on Windows, or `eget` on all platforms.\n\nOr, follow these instructions to install the specific release binaries below:\n\n\nUpdates to binaries:\n- 2026-01-12: Fixed the hledger-linux-x64.tar.gz asset below, it previously contained a dev build. [#2526](https://github.com/plaintextaccounting/hledger/issues/2526)\n<!--\n-->\n\n<!--\nIf github releases are immutable, they can be verified as follows:\n\n```\ngh --version  # ensure you have github CLI 2.81.0+\ngh release verify 1.52.3  # check the 1.52.3 github release is immutable\ncurl -fLO https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-linux-x64.tar.gz  # eg\ngh release verify-asset 1.52.3 ./hledger-linux-x64.tar.gz  # check the tarball is correct\ntar xzv -f hledger-linux-x64.tar.gz -C/usr/local/bin hledger hledger-ui hledger-web\n```\n-->\n\n### GNU/Linux, 64-bit Intel\n\nAt the command line:\n\n```\ncurl -fL https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-linux-x64.tar.gz | tar -xzv -f- -C/usr/local/bin hledger hledger-ui hledger-web\nhledger --version; hledger-ui --version; hledger-web --version    # should show 1.52.3\n```\n\nPrefix `tar` with `sudo` if `/usr/local/bin` is not writable.\n\n### Mac, 64-bit ARM or Intel\n\nOpen a terminal window.\n(Don't download these binaries with your web browser - they won't get authorised.)\n\nOn ARM macs:\n```\nsudo mkdir -p /usr/local/bin\ncurl -fL https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-mac-arm64.tar.gz | sudo tar -xzv -f- -C/usr/local/bin hledger hledger-ui hledger-web\nhledger --version; hledger-ui --version; hledger-web --version    # should show 1.52.3\n```\n\nOn Intel macs:\n```\nsudo mkdir -p /usr/local/bin\ncurl -fL https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-mac-x64.tar.gz | sudo tar -xzv -f- -C/usr/local/bin hledger hledger-ui hledger-web\nhledger --version; hledger-ui --version; hledger-web --version    # should show 1.52.3\n```\n\nIf the version check shows an older version, you have another hledger earlier in `$PATH`; `which -a hledger` will find it.\n\n### Windows, 64-bit ARM or Intel\n\nIn a powershell window (press `WINDOWS-R`, `powershell`, `ENTER`).\n(Don't download the zip with your web browser - programs downloaded that way may be blocked when you run them.)\n\n```\ncd ~\ncurl.exe -fLO https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-windows-x64.zip\nExpand-Archive hledger-windows-x64.zip -Force -DestinationPath \"$env:LOCALAPPDATA\\Programs\\hledger\"\n```\n\n`$env:LOCALAPPDATA\\Programs\\hledger` (ie `C:\\Users\\YOURNAME\\AppData\\Local\\Programs\\hledger`) is not in `$env:Path` by default,\nso if `$env:Path` doesn't show it, add it once:\n```\n[Environment]::SetEnvironmentVariable('Path', \"$env:LOCALAPPDATA\\Programs\\hledger;\" + [Environment]::GetEnvironmentVariable('Path','User'), 'User')\n$env:Path = \"$env:LOCALAPPDATA\\Programs\\hledger;$env:Path\"    # for this window; new windows will pick it up automatically\n```\n\nThen:\n```\nhledger --version; hledger-ui --version; hledger-web --version    # should show 1.52.3\n```\n\nIf the version check shows an older version, you have another hledger earlier in `$env:Path`; `where.exe hledger` will find it.\n\nThese are 64-bit Intel binaries; they also run on ARM machines (emulated).\n\nThey may also work on Windows 7:\nuse Windows Explorer to extract `hledger-windows-x64.zip` into a folder of your choice,\nthen open a command window (`WINDOWS-R`, `cmd`, `ENTER`) and run the hledger programs.\n\n<!--\nAnd ensure a default journal file exists, and without a problematic encoding (I'm not sure if/why \"ascii\" was needed here).\nThis will allow you to start hledger-web by double-clicking on its icon if you wish.\n```\nout-file -append -encoding ascii $HOME/.hledger.journal\n```\n-->\n\n### Next steps\nOnce installed, run `hledger`,\nand see the [hledger Docs](https://hledger.org/doc.html).\n\n</details>\n","reactions":{"total_count":2,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
