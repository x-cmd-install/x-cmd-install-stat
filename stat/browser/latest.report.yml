abel":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":94122817,"digest":"sha256:e510299683b37a203912eac0ee00732224b2ef9b07fe58e69c467f5255be45e2","download_count":72,"created_at":"2026-10-02T10:12:02Z","updated_at":"2026-10-02T10:12:06Z"},{"id":605344787,"node_id":"RA_kwDOI67vws4kFNQT","name":"lightpanda_1.0.0_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":35983712,"digest":"sha256:718ab546ab03e77773d42240d2af50e24c116864b4445cc4ab78b2083146217b","download_count":121,"created_at":"2026-10-02T10:19:24Z","updated_at":"2026-10-02T10:19:26Z"},{"id":605345037,"node_id":"RA_kwDOI67vws4kFNUN","name":"lightpanda_1.0.0_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":33964344,"digest":"sha256:71949a4a0505b73b14a85c9345b5b89888c4196ef2eb716fc1740cb6b3322eda","download_count":70,"created_at":"2026-10-02T10:19:32Z","updated_at":"2026-10-02T10:19:34Z"}],"body":"## Behavior changes\r\n- `getComputedStyle` results are now read-only.\r\n- The `\"en\"` language fallback was removed. Language now comes from `--locale`.\r\n- Redirects that switch to GET now drop body headers.\r\n\r\n## WebDriver\r\n- Classic HTTP WebDriver, built out into a usable driver\r\n- Session management; `navigate`; back/forward; `execute`\r\n- Element endpoints; input (click, clear, sendKeys); cookie and viewport endpoints\r\n- Higher default/max HTTP limits\r\n\r\n## CORS\r\n- CORS is now enforced by default. Cross-origin fetch/XHR requests that fail a CORS check are blocked. Turn it off with `--disable-features cors`. The old `--experimental-features cors` flag is gone.\r\n- CORS store with an entry limit (`--cors-store-entry-limit`, default 1000)\r\n- Fetch referrer policy + CorsGate referrer checking\r\n- `Sec-Fetch-Site` and `Sec-Fetch-Mode` request headers\r\n- Limit redirects that carry credentials\r\n\r\n## New Web APIs\r\n- `WebAssembly.compileStreaming` and `instantiateStreaming`\r\n- Sanitizer API (initial)\r\n- `TextEncoder.encodeInto`\r\n- `element.requestFullscreen` (mostly a stub)\r\n- `inert` property; `iframe` `sandbox` setter\r\n- `img` `srcset` support; report natural dimensions for fetched images\r\n- `new Option()` and the legacy constructor API\r\n- `DOMTokenList` setters; more accurate `window.isSecureContext`\r\n- Experimental `ServiceWorker` (behind `--experimental-features serviceworker`) with `Cache`/`CacheStorage`\r\n\r\n## Web API behavior / fixes\r\n- `<template>` content handling\r\n- Custom element callbacks may move the element during parse\r\n- `request.clone()` clones headers; correct fetch/response handling of null bodies\r\n- XHR/fetch report the status reason from the server; `TypeError` on XHR `send(SharedArrayBuffer)`\r\n- `input.select()` no longer throws for email/number; `element.focus()` only on focusable elements\r\n- Correct error on a wrong method; guard headers\r\n- Validate the XML declaration\r\n- Avoid spurious mutations for unchanged CSS declarations\r\n\r\n## CSS / rendering\r\n- Split the style cascade into property groups; honor `!important` on tracked stylesheet properties\r\n- Resolve width/height from stylesheet rules; give the document a height and clamp viewport scroll to it\r\n- Measure wrapped text for an element's content height\r\n- Resolve scroll containers through the style cascade; unify wheel dispatch; clamp scroll offsets and latch a wheel to one container\r\n\r\n## CDP (Chrome DevTools Protocol)\r\n- Optimize `Network.getResponseBody`\r\n- `DOM.getFrameOwner` returns the owning `<iframe>`; nodes carry a `frameId`\r\n- Answer inspector commands on the session that sent them; echo the `sessionId` in browser-level replies\r\n- Notify target closure when disposing browser contexts; report the initial `about:blank` as loaded\r\n- `window.devicePixelRatio` from the viewport scale; char text insertion\r\n- Move a kept isolated-world context onto the navigated origin\r\n\r\n## HTTP / Networking\r\n- Improve caching; add `x-frame-options` support\r\n- Keep connections healthy: don't re-use connections likely in a bad state\r\n- Lowercase response headers; clamp the response status range and report the server's reason phrase\r\n- Add headers to the sync-request path\r\n- Accept Netscape cookie format in `--cookie`; report invalid same-site over CDP\r\n- Generate an appropriate error on a bot challenge\r\n\r\n## Agent / tools\r\n- Add OpenRouter provider; `lightpanda run -` reads a script from stdin\r\n- Report the HTTP status of a navigation; wait for networkidle after an action-triggered navigation\r\n- `findElement` matches names by `/regex/`\r\n- MCP carries the navigation outcome as `structuredContent`\r\n- REPL output fixes and simpler command dispatch\r\n\r\n## CLI / ops\r\n- Report usage errors once, accept `-h`, show tips only on a terminal; scale the \"did you mean\" distance with input length\r\n- Respect `NO_COLOR` and disable colors when stderr is not a tty\r\n- Per-page context logs; many warn/err logs downgraded to debug\r\n- Log the stalled page and JS stack on watchdog termination\r\n- Record Linux fatal signals without blocking on stderr\r\n\r\n## Dependencies\r\n- V8 updated to 15.5.35.13\r\n- BoringSSL, nghttp2 1.70.0, PCRE2 10.49, refreshed public suffix list\r\n\r\n## Performance / memory\r\n- Replace the slab allocator; set `M_MMAP_THRESHOLD` to 128K on Linux\r\n- Convert recursive walks to iterative: XPath, SemanticTree/AXNode, markdown, screenshot, dump\r\n- Share one PCRE2 wrapper across the regex paths\r\n- Faster V8 background-job scheduling and task wakeup\r\n- Track and free abandoned html5ever parsers; drop the allocation for the default sanitizer\r\n\r\n## Stability fixes\r\n- Crash fixes: node cycles when the parser reparents moved nodes, a scrolling stack overflow, a double-free in IndexedDB, a rare import crash\r\n- Stop load events on a document superseded by navigation\r\n- V8 always detaches the global","reactions":{"total_count":35,"+1":10,"-1":0,"laugh":0,"hooray":8,"confused":0,"heart":8,"rocket":9,"eyes":0}}
