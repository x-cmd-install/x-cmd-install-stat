,"label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":11577,"digest":"sha256:e12416f695e2c968993d726d959537c2521580d08a80ded26060e23bfa7738fe","download_count":60,"created_at":"2026-10-15T14:56:54Z","updated_at":"2026-10-15T14:56:54Z"},{"id":644204069,"node_id":"RA_kwDOI67vws4mZcYl","name":"lightpanda-x86_64-linux","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":75670856,"digest":"sha256:551747e35c51ba107b5d5277eca4b48e077b2a3b40f09a047bf6670448bc35fd","download_count":3288,"created_at":"2026-10-15T14:56:47Z","updated_at":"2026-10-15T14:56:50Z"},{"id":644204258,"node_id":"RA_kwDOI67vws4mZcbi","name":"lightpanda-x86_64-linux.debug","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":46265832,"digest":"sha256:b59320be2ea16544549f7885f21913931183e10690f20bedfdc2c7c9796a69f0","download_count":33,"created_at":"2026-10-15T14:56:51Z","updated_at":"2026-10-15T14:56:53Z"},{"id":644200423,"node_id":"RA_kwDOI67vws4mZbfn","name":"lightpanda-x86_64-macos","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":96332629,"digest":"sha256:1fcca0ae7684f470780de611a56e9a8ea612d5ff21e37dbb48905ebac5b918a7","download_count":81,"created_at":"2026-10-15T14:55:38Z","updated_at":"2026-10-15T14:55:42Z"},{"id":644214122,"node_id":"RA_kwDOI67vws4mZe1q","name":"lightpanda_1.0.1_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":19539216,"digest":"sha256:c66a305e950cfb101e4361c6aaac416005e1d427691e5c691f49fdc3dc755bd8","download_count":128,"created_at":"2026-10-15T15:00:00Z","updated_at":"2026-10-15T15:00:01Z"},{"id":644213874,"node_id":"RA_kwDOI67vws4mZexy","name":"lightpanda_1.0.1_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":17460236,"digest":"sha256:e5197eb7acf984c35c5929c55c6e6175e1b78fc816ddf26f28bc6d386a463256","download_count":32,"created_at":"2026-10-15T14:59:54Z","updated_at":"2026-10-15T14:59:55Z"}],"body":"## Behavior changes\r\n- `setImmediate` and `clearImmediate` were removed (deprecated, not part of the web platform).\r\n- MCP and agent modes now load external stylesheets by default.\r\n- Max HTTP redirects raised from 10 to 20, matching the Fetch spec.\r\n- Unsupported protocols are no longer navigated to; `javascript:` URLs are run instead of navigated to.\r\n\r\n## New Web APIs\r\n- Web Locks\r\n- Compression Streams API\r\n- RSA-OAEP in Web Crypto (`generateKey`, `importKey`, `encrypt`, `decrypt`)\r\n- Custom elements: `ElementInternals` and form-associated callbacks\r\n- `Request.body` and `Request.textStream`\r\n- `HTMLFormElement.reset`, form numeric and named index, `form.field`\r\n- `HTMLTableElement.rows`, `HTMLSelectElement.remove(index)`, `select.length` setter\r\n- `textarea.type`, `fieldset.type`, `output.type`; `HTMLMeterElement` accessors\r\n- `GlobalEventHandlers` attributes on `Window` and `Document`; document named index\r\n- Performance secondary buffer; `performance.timeOrigin` relative to the Unix epoch\r\n- `Console` and `CSS` are now proper namespaces; more missing namespace methods\r\n\r\n## Forms / input\r\n- Implicit submit on Enter; improved form submission; GET submissions replace the action's query\r\n- Fire `change` when typed text is committed by blur or Enter\r\n- Ctrl+A selects the whole value in text fields\r\n- All text edits go through one gated path; better `contenteditable` detection\r\n- Single-contact touch for CDP, testdriver and BiDi\r\n- One WebDriver key table shared by BiDi, testdriver and `press`\r\n- Click press/release sequences shared across input paths and matched to Chrome\r\n- Keydown default actions run only for trusted events\r\n- Range and color inputs get their default value; `input.value` reflects to the attribute in default modes\r\n- Skip inputs with an empty name; `:checked` applies to options; option text strips and collapses whitespace\r\n\r\n## Web API behavior / fixes\r\n- `fetch` resolves after headers are received; an abort signal aborts a fetch\r\n- XHR response header compliance; improved data-URL parsing\r\n- Exceptions from timers, animation frames, `on*` handlers, observers and microtasks go to `reportError`\r\n- `on*` handler attributes behave like any other event listener\r\n- `document.open` resets loaded frame state; several `document.close` crash fixes\r\n- Fire `popstate` on a fragment navigation; history traverses within a document by entry\r\n- Each `Window` gets its own `History`; `Location` URLs resolve against the calling document\r\n- Dynamic `<base>` updates the document base URL\r\n- `iframe` reflects and reacts to `src`; sandbox token queries; iframe removal cleanup\r\n- `replaceChildren` adopts nodes from another document\r\n- Classic scripts are decoded with their charset\r\n- Timers accept any value; negative delays clamp to zero\r\n- `IntersectionObserver` only intersects connected targets\r\n- Fix custom element upgrade ordering during fragment parsing; undefined custom elements use the `HTMLElement` prototype\r\n\r\n## CSS / selectors / rendering\r\n- Computed style reports initial values and a resolved `font-size`; padding, margin and border widths default to `0px`\r\n- `text-transform` applied in `innerText` and resolved in `getComputedStyle`\r\n- `revert` and `revert-layer` treated like `inherit`\r\n- Decode fetched stylesheets; fix tokenizer exponent and hyphen-escape bugs; external stylesheet cap raised to 4 MiB\r\n- Hit testing honors `pointer-events:none` and `visibility:hidden`\r\n- Visibility inheritance matches Chromium in styles and the AX tree\r\n- Hide a `[popover]` that is not showing\r\n- Block-level flex and grid containers no longer grow with their items\r\n- Selectors: `:valid`/`:invalid` on every validity constraint, `:read-write`/`:read-only` per HTML, case-insensitive attribute values, type selectors on XML and foreign elements, pseudo-elements accepted\r\n\r\n## CDP (Chrome DevTools Protocol)\r\n- Pause requests at the `Fetch` response stage\r\n- Start of the `Debugger` domain\r\n- Emit `Runtime.exceptionThrown` for uncaught page exceptions\r\n- `Page.navigatedWithinDocument` for fragment navigations and traversals; `Target.targetInfoChanged` on URL/title change\r\n- Honor `Page.navigate` `referrer`/`referrerPolicy` and client target filters in `setAutoAttach`\r\n- Keyboard input reaches the focused element inside an iframe; `rawKeyDown` dispatches keydown\r\n- AX tree: `depth` param, properties written closer to Chrome, accepted without params\r\n- Accept the cookie fields Chrome accepts, so `deleteCookie` works\r\n\r\n## WebDriver / BiDi\r\n- BiDi `browser.getClientWindow`\r\n- WebDriver window close\r\n- CDP and BiDi cookies built through one Chrome-checked constructor\r\n\r\n## HTTP / Networking\r\n- Update libcurl to 8.23.0; enable zstd\r\n- Check more HTTP caching headers\r\n- Cookies: keep a session cookie set with `expires -1`; accept a UTC zone in `expires`\r\n- `--http-curves` to set TLS key exchange groups; `--http-debug` for libcurl verbose output\r\n- `serve` accepts the `--advertise-host` name as the WebSocket `Host`\r\n\r\n## MCP / agent / tools\r\n- MCP runs each HTTP session on its own thread; idle sessions can be reaped with `--http-session-timeout` (off by default)\r\n- Agent: `--trace` writes one JSON line per step; `--trace-results` adds tool result text\r\n- Agent: tells the model today's date, flags 4xx/5xx navigations, drops stale tool results\r\n- Tree tool: `maxBytes` budget with `[more]` markers; iframes listed with their URL\r\n- Search drops results the browser would block\r\n- Telemetry records tool calls and the MCP client name\r\n\r\n## Dump / markdown / PDF\r\n- PDF output includes the actual text\r\n- `--render-font` adds fonts for characters the bundled DejaVu fonts lack (e.g. CJK)\r\n- More aggressive clutter stripping; `<template>` contents serialized; fenced code blocks keep their language\r\n\r\n## CLI\r\n- `completion` command prints shell completion for bash, fish and zsh\r\n\r\n## Performance / memory\r\n- Return freed malloc memory to the OS when a connection closes (glibc)\r\n- Cache computed ancestry values and the root node during parse\r\n- Faster `Node.getDocument`, owner frame lookup and anchor query matching\r\n- Backtrack limit on user-supplied regex\r\n- Limit V8 `ArrayBuffer` allocation to 4 GB; don't copy `ReadableStream` chunks into the page arena\r\n\r\n## Stability fixes\r\n- Fix UAF in `MutationObserver`\r\n- Refuse native calls when terminating; run microtasks only at call depth 0\r\n- Commit an error document when a root navigation fails\r\n- Re-implement `__clear_cache` on Linux arm64 to work around a Zig bug\r\n- Log the script that ran out of JS heap\r\n\r\n## Build / CI\r\n- Upgrade to Zig 0.17\r\n- Unit tests run across parallel processes (about 3x faster)\r\n- Nightly builds strip debug symbols","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
