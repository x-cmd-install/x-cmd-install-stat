","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":16820,"digest":"sha256:a913f37e872b1b65792489fa83b3b00869cfa21665221b03e8f808698a60cfd9","download_count":96,"created_at":"2026-11-20T14:02:44Z","updated_at":"2026-11-20T14:02:45Z"},{"id":772044597,"node_id":"RA_kwDOI67vws4uBHc1","name":"lightpanda-x86_64-linux","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":78026056,"digest":"sha256:0ec21fa4867ab9e82b35285ff4ab0e7336c6c1d89f26fe991f27d73c8a678bd7","download_count":3052,"created_at":"2026-11-20T14:02:39Z","updated_at":"2026-11-20T14:02:42Z"},{"id":772044783,"node_id":"RA_kwDOI67vws4uBHfv","name":"lightpanda-x86_64-linux.debug","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":49010880,"digest":"sha256:206d9333aaaf1ef2fe105f8f9ce36de910cb6c188d06da7987915e5455d78063","download_count":52,"created_at":"2026-11-20T14:02:42Z","updated_at":"2026-11-20T14:02:44Z"},{"id":772073034,"node_id":"RA_kwDOI67vws4uBOZK","name":"lightpanda-x86_64-macos","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":96121539,"digest":"sha256:2b75c9fee5c36d5d840f7938df6a532074bec03bf0485c3130b28597999a66fe","download_count":156,"created_at":"2026-11-20T14:10:44Z","updated_at":"2026-11-20T14:10:48Z"},{"id":772082899,"node_id":"RA_kwDOI67vws4uBQzT","name":"lightpanda_1.0.5_amd64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":20195156,"digest":"sha256:f04d1e6312c3aa8339b859b8d1348687ddfaf489b843178020c63f1c754178b4","download_count":230,"created_at":"2026-11-20T14:13:29Z","updated_at":"2026-11-20T14:13:30Z"},{"id":772083160,"node_id":"RA_kwDOI67vws4uBQ3Y","name":"lightpanda_1.0.5_arm64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":18016532,"digest":"sha256:9871b83085a758dc2ae4a59959e8872835ec6cf707966d4814cb484612fc80cd","download_count":112,"created_at":"2026-11-20T14:13:34Z","updated_at":"2026-11-20T14:13:35Z"}],"body":"## Behavior changes\r\n- PandaScript: `page.evaluate()` now returns a promise, like `page.goto()`. Saved scripts need `await` in front of every `page.evaluate(...)`. Several evaluates can now run at once with `Promise.all`.\r\n- `--v8-gc-hint-floor-mb` is renamed `--v8-gc-request-min-mb`. The old name still works but is deprecated.\r\n- New `--v8-gc-auto-min-mb`, default 32: V8 doesn't start a full GC on its own below this heap size. `0` keeps V8's default.\r\n- `classify`, `acceptCookies` and `login` can use Gemini, but only with `LIGHTPANDA_DECISION_PROVIDER=gemini`. TypeSafe stays the default.\r\n- `agent --save` replays a read-only script once before writing it. If the replay fails or returns nothing, the model gets one turn to fix the script, and the first script is kept, with a warning, when the fix doesn't replay. Scripts that act on a page are written unchecked.\r\n- A fetch or XHR whose connection drops before the end of a `Content-Length` or chunked body now fails, instead of resolving as a complete 200.\r\n- `history.pushState`/`replaceState` to a URL of another origin throws a `SecurityError`.\r\n- Responses served from the HTTP cache now go through CORS checks.\r\n- `document.currentScript` is `null` while a module runs.\r\n- The `goto` timeout (script API and MCP tool) now bounds the navigation wait, even while a parser-blocking script is loading.\r\n- Mouse hit testing skips `inert` subtrees.\r\n\r\n## Layout\r\n- More realistic `top` and `height`, with awareness of positioned boxes, tables and text\r\n- `display: grid` support\r\n- `em`, `rem` and basic `calc()` lengths; `min-height` and `max-height`\r\n- Text wrapping uses the computed width\r\n- Hit testing: positioned boxes are above the normal flow, negative `z-index` below it\r\n- Layout, hit testing and bounding rects are much faster (style caches are cleared only where a change can reach)\r\n\r\n## New Web APIs\r\n- `NavigateEvent.intercept()`\r\n- `ReadableStream.tee()` and `values()`\r\n- `XMLHttpRequest.upload` progress events\r\n- `Attr.specified`\r\n\r\n## Web API behavior / fixes\r\n- XHR: re-opening a request in flight doesn't fire `abort`/`loadend`; `responseType = 'document'` is ignored in a worker\r\n- WebSocket `close()` while connecting moves to `CLOSING` and queues a `close` event\r\n- `Request` keeps the case of methods other than the six standard ones\r\n- `fetch` with `redirect: 'manual'` keeps the URL\r\n- The `formdata` event gets its own copy of the `FormData`\r\n- `ResizeObserver` starts from a size of -1×-1\r\n- IndexedDB: a pending request keeps its JS object until its event fires (fixes Zone.js apps)\r\n\r\n## CDP\r\n- Playwright can use the default context before any page: `context.addCookies()` works, and `page.close()` on the startup page no longer hangs\r\n- `DOM.getBoxModel` returns Chrome's error for an element under `display: none`\r\n- `Accessibility.getFullAXTree` reports the selected option's label as a combobox value\r\n- `LP.dump` `withFrames` option: include iframe content in the HTML dump\r\n- Crash fix in request interception on an aborted transfer\r\n\r\n## WebDriver\r\n- `/alert` commands answer `no such alert`\r\n- Element `/displayed`, `/computedrole` and `/computedlabel`\r\n- Shadow root endpoints: `/element/{id}/shadow`, `/shadow/{id}/element`, `/shadow/{id}/elements`\r\n- Sessions accept `acceptInsecureCerts`\r\n\r\n## BiDi\r\n- `script.addPreloadScript` and `script.removePreloadScript` (no `arguments` yet)\r\n\r\n## Tools / MCP / Agent\r\n- `lightpanda mcp --tools goto,tree,...` exposes only the named tools; `--list-tools` prints every name\r\n- MCP over HTTP: memory is returned to the OS when a session ends, and the idle default session closes its pages after `--http-session-timeout`\r\n- PandaScript `page.getCookies()`\r\n- `lightpanda run` and `agent` now apply `--cookie` and `--cookie-jar`\r\n- Markdown: definition list terms and details go on their own lines\r\n\r\n## Performance / memory\r\n- Stylesheets with `--load-resources stylesheet` are preloaded in parallel\r\n- Smaller CSS DOM: rules are created only when JS reads them, `@media`/`@layer`/`@supports` parsed once\r\n- Smaller nodes and elements (a `div` goes from 80 to 64 bytes)\r\n- The page HTML is held once instead of three times (CNN peak memory 65 MB → 54 MB)\r\n- `fetch()` takes the response body instead of copying it\r\n- Semantic tree uses less memory (HTML spec: 249 MB → 154 MB)\r\n- Faster `getComputedStyle`, `nodeList[i]` and object wrapping","reactions":{"total_count":7,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":3,"eyes":0}}
