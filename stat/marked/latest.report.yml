ithub.com/markedjs/marked/issues/4151)) ([9cb84e0](https://github.com/markedjs/marked/commit/9cb84e07d18833a241f3df13d7419596f5b203ff))\n* end a list item before a lazy line after an html block ([#4159](https://github.com/markedjs/marked/issues/4159)) ([7ba42f4](https://github.com/markedjs/marked/commit/7ba42f445cd88286dbad4e4104e6b3842ed814b5))\n* end blockquote before a lazy line after a table ([#4161](https://github.com/markedjs/marked/issues/4161)) ([e7dcf52](https://github.com/markedjs/marked/commit/e7dcf52ddbf88171e630ec1b88d8242d67b29e0b))\n* isolate extension names from Object.prototype ([#4177](https://github.com/markedjs/marked/issues/4177)) ([5cb03bd](https://github.com/markedjs/marked/commit/5cb03bd9a293976c8dd3099274cff161b08f5cb0))\n* keep a block quote open after a lazy line in a nested block quote ([#4175](https://github.com/markedjs/marked/issues/4175)) ([1d7272f](https://github.com/markedjs/marked/commit/1d7272f9ca02cdef3fb2ad061fa4da38b8978661))\n* only close a code fence with the opening fence character ([#4164](https://github.com/markedjs/marked/issues/4164)) ([1d4d8fe](https://github.com/markedjs/marked/commit/1d4d8fe6f5ed2a4ead1a75bf67627318ca92115a))\n* preserve zero-valued custom renderer results ([#4162](https://github.com/markedjs/marked/issues/4162)) ([e43ceef](https://github.com/markedjs/marked/commit/e43ceef44a981a620072252c021f43f4e5395fc4))\n* recognize task list items when a tab follows the checkbox ([#4163](https://github.com/markedjs/marked/issues/4163)) ([64a299d](https://github.com/markedjs/marked/commit/64a299def97ab8d2aa0c92458585ee894c247a5d))\n* start a GFM www autolink only at a word boundary ([#4166](https://github.com/markedjs/marked/issues/4166)) ([84beefb](https://github.com/markedjs/marked/commit/84beefb3eb24dbf25c526467a2a3906b9afe11e8))\n\n\n### Performance Improvements\n\n* fix backtracking in padantic html ([#4173](https://github.com/markedjs/marked/issues/4173)) ([2d4a23c](https://github.com/markedjs/marked/commit/