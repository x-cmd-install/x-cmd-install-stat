ues/4176) [#4176](https://github.com/markedjs/marked/issues/4176)\n* keep a tab after the block quote marker's space literal ([#4208](https://github.com/markedjs/marked/issues/4208)) ([2d3b47f](https://github.com/markedjs/marked/commit/2d3b47fa217a06f9a360d86ebf0f766d19949621))\n* keep rejected table candidates in the preceding paragraph ([#4218](https://github.com/markedjs/marked/issues/4218)) ([1c5969e](https://github.com/markedjs/marked/commit/1c5969e395905fa3f33f3a847d8ad655f1dfcce7))\n* keep tabs that are code content under a block quote ([#4217](https://github.com/markedjs/marked/issues/4217)) ([d2c6f73](https://github.com/markedjs/marked/commit/d2c6f736f339b4739a16426c681528ca210a6e87)), closes [#4184](https://github.com/markedjs/marked/issues/4184)\n* let a mid-run opener close against a delimiter that can also open ([#4203](https://github.com/markedjs/marked/issues/4203)) ([06e1d10](https://github.com/markedjs/marked/commit/06e1d1090338b76c3d458a26d52ee67f72c8d6e1))\n* let an autolink or inline html line start or continue a setext heading ([#4191](https://github.com/markedjs/marked/issues/4191)) ([72d0fec](https://github.com/markedjs/marked/commit/72d0fec9b59a12c5446b9377cf4363a2794ce54b))\n* parse links generated by inline tokenizers ([#4204](https://github.com/markedjs/marked/issues/4204)) ([0460f98](https://github.com/markedjs/marked/commit/0460f98b7e2a1dfedf40eccddaa8d8ada1731d2a))\n* preserve trailing blank lines in fenced code ([#4200](https://github.com/markedjs/marked/issues/4200)) ([7499eb3](https://github.com/markedjs/marked/commit/7499eb3a23eb29c0e9d2ffde551b92439a9b3af6))\n* reject a link destination in angle brackets with an unescaped < or > ([#4206](https://github.com/markedjs/marked/issues/4206)) ([de71210](https://github.com/markedjs/marked/commit/de71210d4204745b326d2e8357240f7a350221f8))\n* remove a task item's checkbox marker from its own text ([#4215](https://github.com/markedjs/marked/issues/4215)) ([5902442](https://github.com/markedjs/marked/commit/59024421a4ce874168d3f551565f4ebad121f5af))\n* **types:** preserve custom output types in tokenizer overrides ([#4214](https://github.com/markedjs/marked/issues/4214)) ([5e35708](https://github.com/markedjs/marked/commit/5e35708f3f4a88d477c37c2d42ad86907d6b4daf))\n\n\n### Performance Improvements\n\n* check the first character before inline tokenizer regexes ([#4193](https://github.com/markedjs/marked/issues/4193)) ([95ccf6c](https://github.com/markedjs/marked/commit/95ccf6c186a38e092dfb666d68f70cfcd89c53a5))\n* close residual O(n²) parse time on unmatched emphasis/strikethrough delimiter runs (follow-up to [#4099](https://github.com/markedjs/marked/issues/4099) / [#4103](https://github.com/markedjs/marked/issues/4103)) ([#4196](https://github.com/markedjs/marked/issues/4196)) ([0b8b3b3](https://github.com/markedjs/marked/commit/0b8b3b33863822681a1cb5a365baec684c368230))\n* skip the emphasis closer scan for inline runs without a delimiter ([#4195](https://github.com/markedjs/marked/issues/4195)) ([ffa06d5](https://github.com/markedjs/marked/commit/ffa06d52ce67f952e0c50ccc7371f50cfe27cfc6))\n\n\n\n"}
