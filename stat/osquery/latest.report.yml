:40:43Z"},{"id":629560786,"node_id":"RA_kwDOAVW19c4lhlXS","name":"osquery_5.24.0-1.linux_amd64.deb","label":"","uploader":{"login":"theopolis","id":981645,"node_id":"MDQ6VXNlcjk4MTY0NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":11200014,"digest":"sha256:8ae0416d85336a1aea6883920ae9c2751a98538fe0bb624822e92934d3be5592","download_count":338,"created_at":"2026-10-11T02:27:00Z","updated_at":"2026-10-11T02:27:01Z"},{"id":629560875,"node_id":"RA_kwDOAVW19c4lhlYr","name":"osquery_5.24.0-1.linux_arm64.deb","label":"","uploader":{"login":"theopolis","id":981645,"node_id":"MDQ6VXNlcjk4MTY0NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":11041882,"digest":"sha256:ee737e5d2d0c011ed5a15883f930c5df4913365e12b262598d3250ce1340645c","download_count":85,"created_at":"2026-10-11T02:27:02Z","updated_at":"2026-10-11T02:27:03Z"}],"body":"## What's Changed\r\n* file table : lnk-related columns were not always computed on Windows by @thierryfranzetti in https://github.com/osquery/osquery/pull/8855\r\n* Fix `process_open_handles` comments and spec by @directionless in https://github.com/osquery/osquery/pull/8853\r\n* Remove cleanup_ec2_runners action by @zwass in https://github.com/osquery/osquery/pull/8856\r\n* Upgrade Linux toolchain to 1.3.0 by @zwass in https://github.com/osquery/osquery/pull/8814\r\n* Update Linux build docs for toolchain 1.3.0 by @zwass in https://github.com/osquery/osquery/pull/8868\r\n* fix: clear errno before getmntent_r to avoid false error logs at EOF by @stefanamaerz in https://github.com/osquery/osquery/pull/8875\r\n* Conditionally install init.d script and fix postrm cleanup by @a-cognet in https://github.com/osquery/osquery/pull/8857\r\n* Remove older cipher suites from kTLSCiphers by @thom-bartlett in https://github.com/osquery/osquery/pull/8872\r\n* feat: Add the column protector_types to the table bitlocker_info by @rchan-cjj in https://github.com/osquery/osquery/pull/8873\r\n* Fix: Windows prefetch table does not report full executable path by @raaz252 in https://github.com/osquery/osquery/pull/8924\r\n* Fix heap buffer overflow in Windows processes table (GHSA-4r78-6hg6-33gg) by @directionless in https://github.com/osquery/osquery/pull/8934\r\n* Preserve object identifiers in Windows certificates table via subject2/issuer2 by @getvictor in https://github.com/osquery/osquery/pull/8963\r\n* Switch authenticode getOriginalProgramName to CryptDecodeObjectEx by @directionless in https://github.com/osquery/osquery/pull/8923\r\n* Fix Linux audit-based process_file_events cache cleanup by @zwass in https://github.com/osquery/osquery/pull/8950\r\n* Ensure in-progress file carves are readable only by the user running osquery by @zwass in https://github.com/osquery/osquery/pull/8961\r\n* bitlocker_info: read ProtectionStatus via GetProtectionStatus() method to avoid stale cached value by @rodchristiansen in https://github.com/osquery/osquery/pull/8931\r\n* Update macOS CI configurations by @zwass in https://github.com/osquery/osquery/pull/8871\r\n* Fix macOS build for Boost by @zwass in https://github.com/osquery/osquery/pull/8982\r\n* Document macOS platform support status by @thebeaverliam in https://github.com/osquery/osquery/pull/8926\r\n* Scan XDG Base Directory Firefox profiles in firefox_addons by @munzzyy in https://github.com/osquery/osquery/pull/8986\r\n* Add .devin path to vscode_extensions for the Windsurf rebrand by @munzzyy in https://github.com/osquery/osquery/pull/8987\r\n* Update GitHub Actions caching strategy by @zwass in https://github.com/osquery/osquery/pull/8866\r\n* Update ccache configurations for CI and local development by @zwass in https://github.com/osquery/osquery/pull/8865\r\n* Fix wrong end-iterator guard in vscode_extensions (one-past-end deref) by @munzzyy in https://github.com/osquery/osquery/pull/8990\r\n* Add Microsoft Edge and Flatpak paths to chrome_extensions on Linux by @munzzyy in https://github.com/osquery/osquery/pull/8991\r\n* docs: fix SECURITY.md vulnerability-reporting link (dead CONTRIBUTING anchor → GitHub advisory) by @kobihikri in https://github.com/osquery/osquery/pull/8994\r\n* Add missing Chromium browser variants to chrome_extensions table by @FritzX6 in https://github.com/osquery/osquery/pull/8995\r\n* Set default build options for macOS builds by @zwass in https://github.com/osquery/osquery/pull/8867\r\n* Use pre-compiled headers to optimize clean build times by @zwass in https://github.com/osquery/osquery/pull/8843\r\n* libs: Remove unused libexpat by @Smjert in https://github.com/osquery/osquery/pull/8997\r\n* libs: Update openssl to 3.6.3 by @Smjert in https://github.com/osquery/osquery/pull/8998\r\n* Fix macOS SDK auto-detection running before CMAKE_SYSTEM_NAME is set by @TemidayoA in https://github.com/osquery/osquery/pull/9005\r\n* Fix weekday and timezone extraction in non-English locales by @hedwigz in https://github.com/osquery/osquery/pull/9009\r\n* Fix incorrect key_strength for Windows certificates by @munzzyy in https://github.com/osquery/osquery/pull/8989\r\n* Key the recursive-glob visited set on (device, inode) by @munzzyy in https://github.com/osquery/osquery/pull/9010\r\n* Docs: change macOS build steps to recommend Python venv by @pascalrobert in https://github.com/osquery/osquery/pull/9031\r\n* Windows pipes: set SQOS on named-pipe CreateFile (defense-in-depth) by @mike-myers-aapl in https://github.com/osquery/osquery/pull/8999\r\n* Increase maximum config size from 1 MiB to 4MiB by @RebeccaMahany in https://github.com/osquery/osquery/pull/9042\r\n* Add chrome_search_engines table exposing the default search engine by @TemidayoA in https://github.com/osquery/osquery/pull/9029\r\n* Pare down openssl build by @zwass in https://github.com/osquery/osquery/pull/9041\r\n* Add a pacman_packages table by @abguymon in https://github.com/osquery/osquery/pull/9035\r\n* Fix: Do not read FIFOs when hashing files in file_events by @zwass in https://github.com/osquery/osquery/pull/9037\r\n* Split the sudoers header on the first unescaped whitespace by @munzzyy in https://github.com/osquery/osquery/pull/9036\r\n* Fix off-by-one bounds check in the platform_info BIOS parser by @munzzyy in https://github.com/osquery/osquery/pull/9051\r\n* Bump GitHub Actions to latest Node 24 versions by @stefanamaerz in https://github.com/osquery/osquery/pull/9058\r\n* Registry nocase path name by @getvictor in https://github.com/osquery/osquery/pull/9080\r\n* tests: accept macOS 26.6 code-signing authority in SignatureTest by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9103\r\n* Etag config TLS by @rfairburn in https://github.com/osquery/osquery/pull/9033\r\n* Widen mounts table statfs counts from uint32_t to uint64_t by @munzzyy in https://github.com/osquery/osquery/pull/9068\r\n* Add a macports_packages table by @jrjsmrtn in https://github.com/osquery/osquery/pull/9074\r\n* Add negotiated TLS version and cipher suite to curl_certificate by @FrankieAtElastic in https://github.com/osquery/osquery/pull/9071\r\n* Use effective permissions for Linux SMBIOS discovery by @s-bernard in https://github.com/osquery/osquery/pull/9073\r\n* Scan Homebrew and MacPorts prefixes in suid_bin by @jrjsmrtn in https://github.com/osquery/osquery/pull/9075\r\n* Scan the MacPorts prefix in npm_packages and python_packages by @jrjsmrtn in https://github.com/osquery/osquery/pull/9076\r\n* Fix memory leak in the darwin processes table by @iko1 in https://github.com/osquery/osquery/pull/9101\r\n* libs: zlib: 1.3.1 -> 1.3.2 by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9096\r\n* libs: sleuthkit: 4.11.0 -> 4.15.0 by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9097\r\n* CMake: fall back to full submodule clone when shallow update fails by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9108\r\n* Add snap_packages table and yaml-cpp dependency by @zwass in https://github.com/osquery/osquery/pull/9053\r\n* libs: thrift: 0.17.0 -> 0.24.0 by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9098\r\n* Allow overriding osqueryd's TLS User-Agent prefix by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9111\r\n* Enable homebrew_packages on Linux by @Hanabi9248 in https://github.com/osquery/osquery/pull/9106\r\n* libs: librdkafka: 1.8.0 -> 2.15.1 by @lyoung-confluent in https://github.com/osquery/osquery/pull/9112\r\n* libs: libarchive: 3.8.1 -> 3.8.9 by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9095\r\n* Add reserved keywords build-time check for new tables by @lucasmrod in https://github.com/osquery/osquery/pull/9117\r\n* Security issue ignores by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9094\r\n* Enable snappy compression support for the Kafka logger on Windows by @lyoung-confluent in https://github.com/osquery/osquery/pull/9116\r\n* smbios fix for aarch64 by @heywoodlh in https://github.com/osquery/osquery/pull/9120\r\n* Refactor to make macOS CI more efficient by @zwass in https://github.com/osquery/osquery/pull/9110\r\n* Merge tests to reduce link time and artifact sizes in build by @zwass in https://github.com/osquery/osquery/pull/9122\r\n* Strip dead code and local symbols from osquery binaries by @lucasmrod in https://github.com/osquery/osquery/pull/9125\r\n* Remove CI disk cleanups by @zwass in https://github.com/osquery/osquery/pull/8996\r\n* Add fallback for system_info.cpu_brand for Windows ARM by @danielhoward314 in https://github.com/osquery/osquery/pull/9048\r\n* Find SSH keys in subdirectories by @opfpqgoon in https://github.com/osquery/osquery/pull/9128\r\n* Remove install cmake step in CI by @zwass in https://github.com/osquery/osquery/pull/9129\r\n* check license is an object before member lookup in npm_packages by @Sahana2524 in https://github.com/osquery/osquery/pull/9126\r\n* Add flatpak_packages table by @zwass in https://github.com/osquery/osquery/pull/9054\r\n* Add `gpu_info` table for Linux, macOS, and Windows by @javuto in https://github.com/osquery/osquery/pull/9065\r\n* Clean up and set max sizes for CI (s)ccache by @zwass in https://github.com/osquery/osquery/pull/9133\r\n* Add vscode_extensions support for Antigravity and code-server by @zwass in https://github.com/osquery/osquery/pull/9052\r\n* check token count before reading the process name in kernel_panics by @Sahana2524 in https://github.com/osquery/osquery/pull/9131\r\n* Add ai_agent_skills table by @quietrouter in https://github.com/osquery/osquery/pull/9044\r\n* Fix apt_sources silently dropping deb822 repos with Enabled: yes by @stefanamaerz in https://github.com/osquery/osquery/pull/8928\r\n* Discover Safari extensions under Application Support for safari_extensions by @cacaosteve in https://github.com/osquery/osquery/pull/9034\r\n* libs: openssl: 3.6.3 -> 3.6.5 by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9158\r\n* Fix battery table on macOS 27.2 by @zwass in https://github.com/osquery/osquery/pull/9130\r\n* Fix crash in `cups_jobs` when `cupsGetJobs` fails by @mike-myers-aapl in https://github.com/osquery/osquery/pull/9159\r\n* docs: correct scheduled-result JSON examples by @1sgtpepper in https://github.com/osquery/osquery/pull/9160\r\n* registry: don't hold the registry lock across extension removal by @a-cognet in https://github.com/osquery/osquery/pull/9163\r\n* Add `gpu_metrics` table by @zwass in https://github.com/osquery/osquery/pull/9030\r\n\r\n## New Contributors\r\n* @thom-bartlett made their first contribution in https://github.com/osquery/osquery/pull/8872\r\n* @rchan-cjj made their first contribution in https://github.com/osquery/osquery/pull/8873\r\n* @raaz252 made their first contribution in https://github.com/osquery/osquery/pull/8924\r\n* @rodchristiansen made their first contribution in https://github