15:45:22Z"},{"id":689042116,"node_id":"RA_kwDOAVW19c4pEfLE","name":"osquery_5.24.1-1.linux_amd64.deb","label":"","uploader":{"login":"theopolis","id":981645,"node_id":"MDQ6VXNlcjk4MTY0NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":29865994,"digest":"sha256:c6a37aec1156712cce0fafeb01a3697a2b73a1863a2b39fc3473b07600aea68d","download_count":330,"created_at":"2026-10-29T15:45:28Z","updated_at":"2026-10-29T15:45:32Z"},{"id":689042299,"node_id":"RA_kwDOAVW19c4pEfN7","name":"osquery_5.24.1-1.linux_arm64.deb","label":"","uploader":{"login":"theopolis","id":981645,"node_id":"MDQ6VXNlcjk4MTY0NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":27773414,"digest":"sha256:6a14f55b8be802e1e9b10108295ce7df82437e02161f28030ce71711fbf27a64","download_count":219,"created_at":"2026-10-29T15:45:32Z","updated_at":"2026-10-29T15:45:34Z"}],"body":"## 5.24.1\r\n\r\n### Security\r\n\r\n- Update the Mozilla CA certificate bundle (removes eMudhra certificates) ([#9206](https://github.com/osquery/osquery/pull/9206))\r\n- Add `_FORTIFY_SOURCE`, CET/BTI on Linux, and explicit Windows mitigations ([#9167](https://github.com/osquery/osquery/pull/9167))\r\n- Disable TLS 1.0 and 1.1 in `curl_certificate` and the OpenSSL build ([#9192](https://github.com/osquery/osquery/pull/9192), [#9202](https://github.com/osquery/osquery/pull/9202))\r\n- Limit decompressed JetBrains plugin metadata size ([#9211](https://github.com/osquery/osquery/pull/9211))\r\n- Disable shell command macro expansion in librpm ([#9223](https://github.com/osquery/osquery/pull/9223))\r\n- Fix bounds checks and traversal for package BOM paths ([#9164](https://github.com/osquery/osquery/pull/9164), [#9184](https://github.com/osquery/osquery/pull/9184), [#9190](https://github.com/osquery/osquery/pull/9190))\r\n- Correct the prefetch validation size check ([#9177](https://github.com/osquery/osquery/pull/9177))\r\n- Guard against `npos` when joining arguments in `parseProcCmdline` ([#9176](https://github.com/osquery/osquery/pull/9176))\r\n- Guard against truncated drive fields ([#9218](https://github.com/osquery/osquery/pull/9218))\r\n- Check registry value size before decoding fixed-width types ([#9220](https://github.com/osquery/osquery/pull/9220))\r\n\r\n### Bug Fixes\r\n\r\n- Restore BPF tables removed in 5.24.0 ([#9225](https://github.com/osquery/osquery/pull/9225))\r\n- Fix `chrome_extensions` state for modern Chromium profiles ([#9170](https://github.com/osquery/osquery/pull/9170))\r\n- Fix Linux Audit argument reconstruction ([#9208](https://github.com/osquery/osquery/pull/9208))\r\n- Fix an out-of-bounds read when comparing an empty path in `PathSet` ([#9188](https://github.com/osquery/osquery/pull/9188))\r\n- Fix extension-table links in shell warnings ([#9186](https://github.com/osquery/osquery/pull/9186))\r\n- Fix TLS connection reuse ([#9199](https://github.com/osquery/osquery/pull/9199))\r\n- Return the full result string from the `carve()` SQL function ([#9191](https://github.com/osquery/osquery/pull/9191))\r\n- Add a timeout around `statfs()` to handle hung filesystems ([#9175](https://github.com/osquery/osquery/pull/9175))\r\n- Keep host and instance UUIDs stable when the database is reset ([#9203](https://github.com/osquery/osquery/pull/9203))\r\n- Synchronize access to the custom flag map ([#9195](https://github.com/osquery/osquery/pull/9195))\r\n- Preserve `IN` constraints when `xFilter` runs again for the same plan ([#9230](https://github.com/osquery/osquery/pull/9230))\r\n- Record query performance when numeric monitoring is enabled ([#9219](https://github.com/osquery/osquery/pull/9219))\r\n- Register all foreign table specs with `--enable_foreign` ([#9194](https://github.com/osquery/osquery/pull/9194))\r\n- Serialize librpm global state in `rpm_packages` ([#9173](https://github.com/osquery/osquery/pull/9173))\r\n\r\n### Documentation\r\n\r\n- Make `PacksTests.test_sharding` independent of the shard cache ([#9182](https://github.com/osquery/osquery/pull/9182))\r\n- Make `gpu_info` and Sleuth Kit table specs available on Windows ([#9210](https://github.com/osquery/osquery/pull/9210), [#9212](https://github.com/osquery/osquery/pull/9212))\r\n- Document Docker prerequisites for Linux tests ([#9172](https://github.com/osquery/osquery/pull/9172))\r\n- Fix the remote settings test walkthrough ([#9161](https://github.com/osquery/osquery/pull/9161))\r\n- Assorted documentation fixes ([#9185](https://github.com/osquery/osquery/pull/9185))\r\n\r\n**Full Changelog**: https://github.com/osquery/osquery/compare/5.24.0...5.24.1","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":3,"eyes":0}}
