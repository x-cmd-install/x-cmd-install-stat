{"id":6481280,"author":{"login":"Mixih","id":5818750,"node_id":"MDQ6VXNlcjU4MTg3NTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"MDc6UmVsZWFzZTY0ODEyODA=","tag_name":"0.11.0","target_commitish":"release/0.11","name":"coala-bears 0.11.0 - BrewBear","draft":false,"immutable":false,"prerelease":false,"created_at":"2017-05-23T19:41:35Z","updated_at":"2017-05-23T19:50:45Z","published_at":"2017-05-23T19:50:45Z","assets":[],"body":"This release has been brought to you by 30 contributors contributing\r\nover 101 commits.\r\n\r\n**New Bears**\r\n\r\nCSS:\r\n\r\n-   `StyleLintBear` - Lints css files using stylelint\r\n\r\nElm:\r\n\r\n-   `ElmLintBear` - Formats source code according to given set of rules.\r\n\r\nGeneric:\r\n\r\n-   `LicenseCheckBear` - Checks given files for license. Searches start\r\n    or end of files for lines belonging to various licenses.\r\n-   `DuplicateFileBear` - Checks for duplicate files.\r\n\r\nEnhancements:\r\n\r\n-   `FilenameBear` can now recognize kebab-case naming convention.\r\n-   `FilenameBear` can predict naming conventions for wide-spread\r\n    languages like java, javascript and python. Set the\r\n    `file_naming_convention` to `auto` to use this feature.\r\n-   `GitCommitBear` can now enforce issue reference in commits.\r\n-   `GitCommitBear` now recognizes `user/repo#12` type issue references.\r\n-   `JSONFormatBear` notifies if run on empty files.\r\n-   `JSONFormatBear` tells the lines and columns at which the error\r\n    occured instead of showing it in the error message.\r\n\r\n**New settings**\r\n\r\n-   `LineCountBear` can now exclude blank lines in counting the number\r\n    of lines in a file. The new setting name is `exclude_blank_lines`\r\n    and it is disabled by default i.e. `False`.\r\n-   `PyUnusedCodeBear` can remove unused variables, see setting\r\n    `remove_unused_variable`.\r\n-   `ShellCheckBear` can ignore specific rules by providing those in the\r\n    `ignore_actions` setting.\r\n-   `YAMLLintBear` can now be configured to check for maximum characters\r\n    in a line, by default it is set to 80.\r\n\r\n**Default Setting Modifications**\r\n\r\n-   `LanguageToolBear` - `language` setting is changed to\r\n    `natural_language`, please update your settings, it'll be deprecated\r\n    completely in next release.\r\n-   `MarkdownBear` - `max_line_length` setting is changed to `None`\r\n    instead of 80. [Issue 1581](https://github.com/coala/coala-bears/issues/1581)\r\n-   `YAMLLintBear` - `document_start` setting is changed to `None`, not\r\n    forbiding the usage of document start marker(---) by default. [Issue 1417](https://github.com/coala/coala-bears/issues/1417)\r\n\r\n**Bug Fixes**\r\n\r\n-   `InvalidLinkBear` now extracts links from markdown correctly. [Issue 1338](https://github.com/coala/coala-bears/issues/1338)\r\n-   `InvalidLinkBear` now extracts all the links in a line. Earlier it\r\n    used to extract only the first match.\r\n-   `PyCodeStyleBear` now uses user settings along with default\r\n    settings. Earlier it used to ignore default settings if user changed\r\n    one of them.\r\n-   `PyImportSortBear` now correctly supports option\r\n    `known_third_party_imports`. [Issue 1510](https://github.com/coala/coala-bears/issues/1510)\r\n-   `KeywordBear` doesn't report false results when unsetting it.\r\n    Previously, it used to match any text instead of matching nothing.\r\n    [Issue 1689](https://github.com/coala/coala-bears/issues/1689)"}
