e_id":"RA_kwDOAwORNs4iLrSD","name":"pnpm-linux-x64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":22971079,"digest":"sha256:5a397dfb6b3d4b07d3d7769586aeb471048faf04299a492e2808b95a9a1c701f","download_count":990,"created_at":"2026-09-18T21:26:21Z","updated_at":"2026-09-18T21:26:22Z"},{"id":573486221,"node_id":"RA_kwDOAwORNs4iLrSN","name":"pnpm-win32-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":19678518,"digest":"sha256:04e81aeb4f66bebc730e2f95a42dbb0eb8f2ce1ebba2d1eb33f8a27571f8b94a","download_count":29,"created_at":"2026-09-18T21:26:21Z","updated_at":"2026-09-18T21:26:22Z"},{"id":573486214,"node_id":"RA_kwDOAwORNs4iLrSG","name":"pnpm-win32-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21351258,"digest":"sha256:fd20b55fe51414951efd4870a24dc4609694e391d07620e0df69aac151278989","download_count":1185,"created_at":"2026-09-18T21:26:21Z","updated_at":"2026-09-18T21:26:22Z"}],"body":"## Patch Changes\r\n\r\n- pnpm now reports an unknown task setting in `pnpm-workspace.yaml` and carries on. It used to refuse to start, so a project could not use a task setting that only the pnpm version its `packageManager` pins reads. The setting is still an error when the running pnpm is that pinned version.\r\n\r\n- Python interpreter installation now retries historical release metadata requests. It caches the release list for up to 24 hours and refreshes it once after a lookup miss. When a release omits the current platform, the search samples at most eight other releases before reporting that the lookup is inconclusive.\r\n\r\n- Python `registries` entries now route packages by exact names or trailing-prefix patterns in `packages`. Registry declaration order no longer affects resolution. A matched package resolves exclusively from its assigned registry, including transitive and build dependencies. Use `packages: [\"*\"]` to declare the default index.\r\n\r\n- `pnpm install` no longer fails with \"Too many levels of symbolic links\" when a Cargo configuration file above the workspace is a symlink, such as a `~/.cargo/config.toml` linked from a dotfiles repository.\r\n\r\n- `pnpm install` now returns \"Already up to date\" in a workspace where `dedupeDirectDeps` left a project without a `node_modules` directory of its own. Such a project forced a full install on every run.\r\n\r\n- `pnpm install` no longer refuses the repeat-install fast path just because a changed `pnpm-lock.yaml` is 16 MiB or larger. Such a lockfile forced a full install on the run after every change.\r\n\r\n<!-- sponsors -->\r\n\r\n## Platinum Sponsors\r\n\r\n<table>\r\n  <tbody>\r\n    <tr>\r\n      <td align=\"center\" valign=\"middle\">\r\n        <a href=\"https://bit.cloud/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"https://pnpm.io/img/users/bit.svg\" width=\"80\" alt=\"Bit\"></a>\r\n      </td>\r\n      <td align=\"center\" valign=\"middle\">\r\n        <a href=\"https://openai.com/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\">\r\n          <picture>\r\n            <source media=\"(prefers-color-scheme: light)\" srcset=\"https://pnpm.io/img/users/openai_dark.svg\" />\r\n            <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://pnpm.io/img/users/openai_light.svg\" />\r\n            <img src=\"https://pnpm.io/img/users/openai_dark.svg\" width=\"160\" alt=\"OpenAI\" />\r\n   