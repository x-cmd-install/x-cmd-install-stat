,"node_id":"RA_kwDOQ3j5Ts4kA0ey","name":"agent-browser-linux-musl-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15418440,"digest":"sha256:eafeca9ca0fdb2fa2aa60c4554723348c739656b0ddba0d82ff654d4d33311b1","download_count":57,"created_at":"2026-10-01T21:44:25Z","updated_at":"2026-10-01T21:44:26Z"},{"id":604194744,"node_id":"RA_kwDOQ3j5Ts4kA0e4","name":"agent-browser-linux-musl-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17863544,"digest":"sha256:993d462f4dcfc19860d93a6521a452eba4502bfc449fe0120303c2ccb998e675","download_count":485,"created_at":"2026-10-01T21:44:25Z","updated_at":"2026-10-01T21:44:26Z"},{"id":604194795,"node_id":"RA_kwDOQ3j5Ts4kA0fr","name":"agent-browser-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18084048,"digest":"sha256:a54b765192db774666f0513fa8b545a298753b6f29e73bcdf4a1e78f18e7c0e1","download_count":3113,"created_at":"2026-10-01T21:44:26Z","updated_at":"2026-10-01T21:44:27Z"},{"id":604194796,"node_id":"RA_kwDOQ3j5Ts4kA0fs","name":"agent-browser-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17694720,"digest":"sha256:a6a9a3654c41ee19c05961b73489db98cff9eae88a77436986df08a7a7a73786","download_count":596,"created_at":"2026-10-01T21:44:26Z","updated_at":"2026-10-01T21:44:28Z"}],"body":"### Bug Fixes\n\n- Fixed **auth vault login** to pick usable controls when hidden duplicates exist, and to bind credential entry to the selected field so replaced fields or redirected focus are rejected before submitting (#2014)\n- Fixed **chat mode** to allow `webmcp`, `skills`, and other top-level browser commands, so the model uses page WebMCP tools instead of falling back to `eval` (#2015)\n- Fixed **Kernel profiles** so `KERNEL_PROFILE_NAME` sessions send the profile as an object instead of failing with a 400, and added `KERNEL_PROFILE_SAVE_CHANGES` to opt into saving changes back (#2004)\n- Fixed **Chrome freezing after launch** by draining its stderr for the browser's lifetime, so a full log pipe no longer blocks the browser (#2003)\n- Fixed **Browser Use** by switching to Cloud V4, which creates, attaches to, and stops the same browser with bounded timeouts (#1879)\n- Fixed **Vercel Sandbox shared memory detection** by measuring `/dev/shm` capacity and adding `--disable-dev-shm-usage` below 256 MiB, so Chrome no longer terminates renderers on the undersized mount (#1890)\n\n### Improvements\n\n- Upgraded the **eve integration** from eve 0.47.3 to 0.57.0, so apps on eve 0.50 and later build again (#1945)\n\n### Documentation\n\n- Updated the **contact sheet example** with the loading-flash demo output (#1871)\n\n### Contributors\n\n- @Railly\n- @benjamincanac\n- @boatri\n- @luxleader\n- @petehunt\n- @robertjamesprior\n- @simonellefsen\n- @zyz619963502zyz\n","mentions_count":8}
