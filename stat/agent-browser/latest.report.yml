,"node_id":"RA_kwDOQ3j5Ts4sMWX6","name":"agent-browser-linux-musl-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17653144,"digest":"sha256:f1d146ad95c1df627b3055475fcb971dfd02f757a1eef756a8f2bd9e19ffff4a","download_count":91,"created_at":"2026-11-12T23:09:28Z","updated_at":"2026-11-12T23:09:29Z"},{"id":741434872,"node_id":"RA_kwDOQ3j5Ts4sMWX4","name":"agent-browser-linux-musl-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20242928,"digest":"sha256:10b3b1d5fa8f53f7bc44273bcefaa64299ab77071bc83e75d96de5ed66025c89","download_count":477,"created_at":"2026-11-12T23:09:27Z","updated_at":"2026-11-12T23:09:29Z"},{"id":741434933,"node_id":"RA_kwDOQ3j5Ts4sMWY1","name":"agent-browser-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20460232,"digest":"sha256:8e69c9fb662514c9cf36e4911e94e913742ba066e55102486350e049dd847612","download_count":2957,"created_at":"2026-11-12T23:09:29Z","updated_at":"2026-11-12T23:09:30Z"},{"id":741434937,"node_id":"RA_kwDOQ3j5Ts4sMWY5","name":"agent-browser-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20043776,"digest":"sha256:ebcef5ebea93c7ccf0fe3f8c18eee908ae9174dfef8e52a3dda6f24a59f630dc","download_count":1046,"created_at":"2026-11-12T23:09:29Z","updated_at":"2026-11-12T23:09:30Z"}],"body":"\n### New Features\n\n- Added **snapshot hints** for controls whose accessible name is empty or shared with another ref in the same snapshot. The hint follows the ref and lists the control's icon, image file, `data-testid`, `name` or `id`, and the text of the nearest row or list item (#2578)\n- Added a **Modern Web Guidance skill** that retrieves Chrome's guidance for a task and checks the built page in agent-browser (#2577)\n\n### Bug Fixes\n\n- Fixed **commands on closed tabs** waiting for the timeout. A command whose tab closes before Chrome answers now fails with `Target closed: CDP session <id> detached` (#2576)\n- Fixed **recordings with an emulated device scale**, which now capture at full density by switching to screenshots when a screencast frame is below the page's scale (#2572)\n\n### Improvements\n\n- Native binaries now ship as **per-platform packages**, so an install downloads only the binary for the host platform, and the global command links to it when install scripts are blocked (#2150)\n- **Snapshots of large pages** parse the accessibility tree once, so they finish sooner (#2509)\n\n### Documentation\n\n- Added a **Modern Web Guidance** guide to the docs (#2546, #2573, #2575)\n\n### Contributors\n\n- @ctate\n- @lahfir\n- @shuding\n\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
