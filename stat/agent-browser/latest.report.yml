de_id":"RA_kwDOQ3j5Ts4o9R9u","name":"agent-browser-linux-musl-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15768728,"digest":"sha256:77d0dd11dd5e2e9b30e4987603960c2a3f9b4794af782292259a90f3cc1010a1","download_count":4,"created_at":"2026-10-29T02:52:52Z","updated_at":"2026-10-29T02:52:53Z"},{"id":687153010,"node_id":"RA_kwDOQ3j5Ts4o9R9y","name":"agent-browser-linux-musl-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18240608,"digest":"sha256:9585897e9453517683a4ca42f3c3f8d8376282f3160268d911ed219b2e0ad62a","download_count":9,"created_at":"2026-10-29T02:52:52Z","updated_at":"2026-10-29T02:52:53Z"},{"id":687153056,"node_id":"RA_kwDOQ3j5Ts4o9R-g","name":"agent-browser-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18432952,"digest":"sha256:399c7e9f06bd29aa933fdf25c0bd958eea06927fc0ce6f536ba6347aabd64628","download_count":56,"created_at":"2026-10-29T02:52:54Z","updated_at":"2026-10-29T02:52:55Z"},{"id":687153057,"node_id":"RA_kwDOQ3j5Ts4o9R-h","name":"agent-browser-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18057728,"digest":"sha256:dee86b78071cbe7217f71ec1c9df6a50efa73cd44d64a18877bb36556fc8e270","download_count":45,"created_at":"2026-10-29T02:52:54Z","updated_at":"2026-10-29T02:52:55Z"}],"body":"\n### Breaking Changes\n\n- **`@agent-browser/eve` tools now come from the MCP tool catalog.** The extension exposes the CLI's MCP tools instead of 21 hand-written ones, so tool names and inputs change: `navigate` is `open`, `evaluate` is `eval`, `press_key` is `press`, `select_option` is `select`, `set_checked` is `check` and `uncheck`, `get` is `get_text`, `get_url` and the other `get_*` tools, `tabs` is the `tab_*` tools, and `wait_for` is the `wait_*` tools. The same names apply to `@agent-browser/eve/tools` overrides. The sandbox needs agent-browser 0.41, which the extension installs by default (#2241)\n\n### New Features\n\n- Added **`agent-browser mcp call <tool> '<json>'`** to run one MCP tool without a stdio session and print its result as JSON with the agent-browser version, for runtimes that cannot keep a process open between tool calls (#2238)\n- Added **`@agent-browser/sandbox/mcp-tools.json`**, every MCP tool with its title, description, input schema, annotations and profiles, generated from the CLI and checked by a test (#2240)\n\n### Improvements\n\n- **`@agent-browser/eve` runs each tool as its own short-lived process**, so no `agent-browser` process outlives a tool call. The 28 `core` tools are listed to the model and the other 14 are deferred, found with `eve__search`, which keeps the listed tool context at its previous size (#2241)\n\n### Bug Fixes\n\n- **MCP tool arguments can no longer set global flags.** The CLI reads global flags anywhere in its arguments, so a value such as a selector or `extraArgs` entry could carry its own `--allowed-domains` and override the server or caller allowlist. Tool calls that try are now rejected (#2238)\n\n### Contributors\n\n- @Railly\n- @lahfir\n\n","mentions_count":2}
