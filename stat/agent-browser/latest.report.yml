"node_id":"RA_kwDOQ3j5Ts4re-Vs","name":"agent-browser-linux-musl-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":17554744,"digest":"sha256:17e5c6322bbb2166f8e37b5711fa01f3dbd932abc88b1e3df053e54405654411","download_count":29,"created_at":"2026-11-10T00:37:15Z","updated_at":"2026-11-10T00:37:16Z"},{"id":729539950,"node_id":"RA_kwDOQ3j5Ts4re-Vu","name":"agent-browser-linux-musl-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20168008,"digest":"sha256:aa48d29a5dab41c67938bcd2dcbe2a04f90a0f38195bc6e0711c542394ec416d","download_count":253,"created_at":"2026-11-10T00:37:15Z","updated_at":"2026-11-10T00:37:17Z"},{"id":729540024,"node_id":"RA_kwDOQ3j5Ts4re-W4","name":"agent-browser-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20373120,"digest":"sha256:b69e0f5ea76dcb51f8f75da6bcb87c7f4d81f79b5738f1f08bd121b51cb3dc57","download_count":1205,"created_at":"2026-11-10T00:37:17Z","updated_at":"2026-11-10T00:37:18Z"},{"id":729540035,"node_id":"RA_kwDOQ3j5Ts4re-XD","name":"agent-browser-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19946496,"digest":"sha256:8209f42e604d012f789caa14ae73a57200925608409fa09427b0fd6e4f3adf15","download_count":705,"created_at":"2026-11-10T00:37:17Z","updated_at":"2026-11-10T00:37:18Z"}],"body":"\n### New Features\n\n- Added **saved flows** (experimental): record a browser task once, then replay its requests. A run tries direct HTTP first, then the same request from the page, then a replay of the recorded commands, and saves the tier that worked. Runs send requests only to public addresses, and saving waits for in-flight requests and follows redirects to the end (#2236, #2397, #2432, #2433, #2444)\n- **MCP tools** now list only the shared arguments each tool uses (#2311)\n\n### Bug Fixes\n\n- Fixed **session reuse and relaunch**, now decided in one place in the daemon. A connection target is kept only after an attach succeeds, and security settings persist across daemon restarts (#2396, #2418, #2429)\n- Fixed **Safari and iOS WebDriver sessions** being dropped (#2385)\n- Fixed **fill and type** altering literal text, and **mouse and element coordinates** losing fractional values (#2394, #2393)\n- Fixed **percent-encoded proxy credentials** not being decoded (#2389)\n- Fixed **downloads** moving local files from an attached Chrome (#2392)\n- Fixed **MCP tool results** that repeated JSON stdout (#2390)\n- Fixed **unknown commands and cookie operations**, now rejected, and **misplaced global options** in batch commands (#2383, #2386)\n- Fixed **errors output** to print page error text, and labeled `storage clear` as storage rather than the request log (#2427, #2428)\n- Fixed **macOS Chrome discovery** for apps installed in the user's Applications folder (#2388)\n- Fixed **Windows recording** opening ffmpeg console windows (#2382)\n- Skipped a repeat `Browser.getVersion` call after the outdated-browser check (#2420)\n\n### Improvements\n\n- The **core skill** now tells agents to prefer snapshots: screenshot only when asked or for content the DOM cannot represent, and wait and snapshot again when an expected element is missing (#2453, #2461)\n- The package now declares a **Node 22 minimum** and drops `engines.pnpm` (#2404)\n- Docs and dashboard chat use **openai/gpt-6-luna-fast** (#2440)\n- Upgraded the repository to **TypeScript 7**\n\n### Contributors\n\n- @Railly\n- @ctate\n- @lahfir\n\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
