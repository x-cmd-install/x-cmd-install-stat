ot/hummingbot/pull/8227\r\n* fix(gateway): handle mint-address in order sizing and skip BudgetChecker for Gateway swaps by @fengtality in https://github.com/hummingbot/hummingbot/pull/8377\r\n* fix / ensure candle requests always span at least one interval (fixes #8327) by @matthiola0 in https://github.com/hummingbot/hummingbot/pull/8338\r\n* (fix) suppress GLOBAL_STOP_LOSS spam after position close in pmm_mister by @ybapat in https://github.com/hummingbot/hummingbot/pull/8348\r\n* fix/order_executor: set position_close=True whenever self.config.position_action == PositionAction.CLOSE by @lgrawet in https://github.com/hummingbot/hummingbot/pull/8362\r\n* Fix Hyperliquid perpetual order price quantization to exchange tick size by @chevoisiatesalvati in https://github.com/hummingbot/hummingbot/pull/8356\r\n* fix(strategy_v2): full LP unwind, realized swap fills, and shutdown that preserves position holds by @fengtality in https://github.com/hummingbot/hummingbot/pull/8391\r\n* fix(strategy_v2): preserve position exposure when executors time out during shutdown by @erickuhn19 in https://github.com/hummingbot/hummingbot/pull/8389\r\n* Add Gemini exchange connector by @erickuhn19 in https://github.com/hummingbot/hummingbot/pull/8027\r\n* fix(lp): close the position when an open fails after add_liquidity landed by @fengtality in https://github.com/hummingbot/hummingbot/pull/8395\r\n* fix(lp): correct keep_position gating, position_hold accounting, and failed-open cleanup by @fengtality in https://github.com/hummingbot/hummingbot/pull/8394\r\n* fix(backtesting): allow hyperliquid and hyperliquid_perpetual to be backtested by @fengtality in https://github.com/hummingbot/hummingbot/pull/8398\r\n* fix/backpack_perp: correct available balance after fills (post-#8323) by @lgrawet in https://github.com/hummingbot/hummingbot/pull/8363\r\n* fix: Pacifica connector crash on spot instruments and lost order fills by @dizpers in https://github.com/hummingbot/hummingbot/pull/8397\r\n\r