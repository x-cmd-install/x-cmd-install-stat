{"id":344810405,"author":{"login":"yuh-yang","id":43330997,"node_id":"MDQ6VXNlcjQzMzMwOTk3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORhiEjM4UjWOl","tag_name":"v0.4.0","target_commitish":"main","name":"v0.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-06-25T13:45:58Z","updated_at":"2026-06-25T15:17:49Z","published_at":"2026-06-25T15:17:49Z","assets":[],"body":"## Highlights\n* **CLI-Matrix** \u2014 a new `cli-hub matrix` command family that turns curated, multi-CLI workflow \"matrices\" into one-shot, capability-driven installs. Discover with `cli-hub matrix list/search` and `cli-hub can <task>`, inspect with `matrix info/doctor`, verify capability coverage with `matrix preflight`, and provision an entire workflow with `matrix install` (recipes, scoped installs, dry-run, resume). Ships `cli-anything-hub` **0.4.0** to PyPI with `matrix.py` / `matrix_skill.py` and unified install/preflight/discover analytics.\n* **30 new CLIs** added across creative, productivity, dev, and data domains \u2014 including ArcGIS Pro, Calibre, Stata, SiYuan, Joplin, Rekordbox, OpenRefine, Tigris, Mailchimp, MiniMax (chat + TTS), OpenWebUI, EEZ Studio, NSLogger, JumpServer, UEAtelier & smithue (Unreal Editor), s&box, WaveTone, Ink/Stitch, 3MF, quietshrink, and more \u2014 plus new agent-skill adapters (Hermes, Reasonix).\n* **17 bug fixes** hardening existing harnesses \u2014 LibreOffice headless conversion (macOS), Zoom recording downloads, Obsidian search, Godot GDScript validation, Browser/DOMShell MCP 2.0.0 migration, n8n REPL, Sketch, Zotero, and more.\n* **4 security hardenings** \u2014 routing untrusted XML through `defusedxml`, owner-only token/config permissions, and restricting token-file resolution against arbitrary file access.\n* **Docs & i18n** \u2014 new German README (`README_DE.md`), expanded troubleshooting, and contributor-guide fixes.\n* **42 new contributors** joined this release. \ud83c\udf89\n\n## What's Changed\n* Feature/cli matrix multi approach by @yuh-yang in https://github.com/HKUDS/CLI-Anything/pull/355\n* fix(browser): propagate --json flag to REPL subcommands by @fuleinist in https://github.com/HKUDS/CLI-Anything/pull/239\n* test(zoom): add credential permission regression tests by @marcelsafin in https://github.com/HKUDS/CLI-Anything/pull/231\n* feat: enhance Nsight Graphics analysis by @AiMiDi in https://github.com/HKUDS/CLI-Anything/pull/246\n* docs: add unknown-skill troubleshooting for Claude Code by @marcelsafin in https://github.com/HKUDS/CLI-Anything/pull/232\n* feat: add quietshrink harness \u2014 Apple Silicon screen recording compressor by @achiya-automation in https://github.com/HKUDS/CLI-Anything/pull/254\n* feat: add s&box CLI harness by @KarandeepSWranch in https://github.com/HKUDS/CLI-Anything/pull/251\n* fix(libreoffice): import existing office files by @yuh-yang in https://github.com/HKUDS/CLI-Anything/pull/264\n* Fix license badge: Apache 2.0 not MIT by @hllqkb in https://github.com/HKUDS/CLI-Anything/pull/267\n* feat(registry): add Stata CLI harness (standalone repo) by @LI-Meng420 in https://github.com/HKUDS/CLI-Anything/pull/266\n* feat: add Ink/Stitch CLI harness (standalone) by @bobbymarko in https://github.com/HKUDS/CLI-Anything/pull/270\n* refactor(openclaw-skill\u2192macrocli): rename, complete backends, add recorder and visual anchor \u2014 layered macro runtime that turns GUI workflows into agent-callable CLI commands by @haorui-harry in https://github.com/HKUDS/CLI-Anything/pull/237\n* feat: add ve-twini to registry by @collectivewinca in https://github.com/HKUDS/CLI-Anything/pull/259\n* feat: add hacker-feeds-cli to registry by @collectivewinca in https://github.com/HKUDS/CLI-Anything/pull/260\n* feat: add DeployHQ CLI (dhq) to CLI-Hub registry by @MartaKar in https://github.com/HKUDS/CLI-Anything/pull/277\n* fix(zotero_http): default Content-Type for raw data + raise connector import timeouts by @stevenpi140 in https://github.com/HKUDS/CLI-Anything/pull/274\n* feat: add Mailchimp CLI harness by @iGodly in https://github.com/HKUDS/CLI-Anything/pull/275\n* feat: mature lldb agent harness by @AiMiDi in https://github.com/HKUDS/CLI-Anything/pull/245\n* Feat/add firefly iii cli by @joyous-coder in https://github.com/HKUDS/CLI-Anything/pull/241\n* feat: add NSLogger CLI harness by @bazinga8023 in https://github.com/HKUDS/CLI-Anything/pull/238\n* feat: improve Unreal Insights live analysis by @AiMiDi in https://github.com/HKUDS/CLI-Anything/pull/244\n* fix: avoid mutating registry entries by @hiSandog in https://github.com/HKUDS/CLI-Anything/pull/281\n* Update README.md by @chaohuang-ai in https://github.com/HKUDS/CLI-Anything/pull/285\n* Update README.md by @chaohuang-ai in https://github.com/HKUDS/CLI-Anything/pull/286\n* fix(zoom): download recordings from direct URL by @sjh9714 in https://github.com/HKUDS/CLI-Anything/pull/294\n* fix(n8n): drop bogus arg from print_banner call to unbreak REPL by @akhilesharora in https://github.com/HKUDS/CLI-Anything/pull/280\n* fix(obsidian): use vendor Content-Type for /search/ (DQL + JsonLogic) by @Mubashirrrr in https://github.com/HKUDS/CLI-Anything/pull/289\n* fix(libreoffice): harden headless conversion on macOS (#221) by @Mubashirrrr in https://github.com/HKUDS/CLI-Anything/pull/290\n* fix(security): route untrusted XML parsing through defusedxml by @aaronjmars in https://github.com/HKUDS/CLI-Anything/pull/296\n* Add UEAtelier \u2014 Unreal Editor 5.6/5.7 MCP self-extension workbench by @edwinmeng163-oss in https://github.com/HKUDS/CLI-Anything/pull/297\n* feat: add 3MF mesh geometry editor CLI by @Gituheart in https://github.com/HKUDS/CLI-Anything/pull/209\n* feat: add MiniMax CLI harness (chat + TTS) by @octo-patch in https://github.com/HKUDS/CLI-Anything/pull/189\n* feat: add Calibre CLI harness for e-book library management by @OGRLEAF in https://github.com/HKUDS/CLI-Anything/pull/223\n* Add cli-anything-rekordbox: Pioneer Rekordbox 6/7 harness by @Moonwolf711 in https://github.com/HKUDS/CLI-Anything/pull/252\n* feat(Joplin): add a CLI-Anything harness for Joplin by @27494539a-hub in https://github.com/HKUDS/CLI-Anything/pull/300\n* fix(sketch): restrict token file resolution to prevent arbitrary file access by @RinZ27 in https://github.com/HKUDS/CLI-Anything/pull/304\n* feat: add obsidian-agent-cli to public registry by @ProxyLandLLC in https://github.com/HKUDS/CLI-Anything/pull/307\n* fix: support python pip module installs in registry dates by @hiSandog in https://github.com/HKUDS/CLI-Anything/pull/312\n* registry: add ArcGIS Pro harness (cli-anything-arcgis-pro) by @Jasper0122 in https://github.com/HKUDS/CLI-Anything/pull/318\n* feat: add Hermes Agent skill for CLI-Anything by @leockl in https://github.com/HKUDS/CLI-Anything/pull/320\n* feat: add Hermes Agent skill for CLI-Anything by @ligl0325 in https://github.com/HKUDS/CLI-Anything/pull/287\n* demos: add ArcGIS Pro live-bridge demo (registered arcgis-pro harness) by @Jasper0122 in https://github.com/HKUDS/CLI-Anything/pull/325\n* docs: add German translation (README_DE.md) and update language switchers by @flitzrrr in https://github.com/HKUDS/CLI-Anything/pull/291\n* feat: upgrade cli-anything-minimax default model to MiniMax-M3 by @octo-patch in https://github.com/HKUDS/CLI-Anything/pull/326\n* docs(readme): add Hermes Agent skill to platform list by @leockl in https://github.com/HKUDS/CLI-Anything/pull/322\n* fix(godot): detect GDScript parse errors via stderr in validate_script by @Rubiadragon in https://github.com/HKUDS/CLI-Anything/pull/335\n* feat: add CloakBrowser CLI to public registry by @dreamor in https://github.com/HKUDS/CLI-Anything/pull/336\n* Fix skill generator Click name parsing by @hiSandog in https://github.com/HKUDS/CLI-Anything/pull/321\n* fix(browser): migrate DOMShell MCP integration to @apireno/domshell 2.0.0 by @apireno in https://github.com/HKUDS/CLI-Anything/pull/308\n* fix: vendor full methodology resources for Codex skill by @Liuyaguangzz in https://github.com/HKUDS/CLI-Anything/pull/332\n* feat: add WaveTone CLI harness by @Manifold68575 in https://github.com/HKUDS/CLI-Anything/pull/337\n* feat: add OpenWebUI CLI registry entry by @ashaiful in https://github.com/HKUDS/CLI-Anything/pull/341\n* feat: add Web Yu-pri CLI harness by @shinpei710 in https://github.com/HKUDS/CLI-Anything/pull/345\n* feat: add Reasonix agent skill adapter by @PaysNatal in https://github.com/HKUDS/CLI-Anything/pull/344\n* feat: add SiYuan CLI (cli-anything-siyuan) by @hito0512 in https://github.com/HKUDS/CLI-Anything/pull/311\n* feat: add smithue-cli (Unreal Engine editor CLI) by @123dx-svg in https://github.com/HKUDS/CLI-Anything/pull/338\n* feat: add CC Switch CLI harness by @computersniper in https://github.com/HKUDS/CLI-Anything/pull/310\n* feat: add Tigris CLI harness for S3-compatible object storage by @davidmyriel in https://github.com/HKUDS/CLI-Anything/pull/301\n* [Live2D] Add editing, linting, batch ops, and workflow commands (v0.3.0) by @zyzly0705 in https://github.com/HKUDS/CLI-Anything/pull/313\n* feat: add EEZ Studio CLI harness by @yuh-yang in https://github.com/HKUDS/CLI-Anything/pull/334\n* feat: add cli-anything-jumpserver v0.1.0 harness by @Ayasaz in https://github.com/HKUDS/CLI-Anything/pull/346\n* feat: add OpenRefine CLI harness by @yuh-yang in https://github.com/HKUDS/CLI-Anything/pull/347\n* feat: add TinyFish Web Agent CLI (standalone repo) by @webdevtodayjason in https://github.com/HKUDS/CLI-Anything/pull/348\n* Skip pip option values in registry date updater by @hiSandog in https://github.com/HKUDS/CLI-Anything/pull/354\n* fix: classify harness docs as documentation by @hiSandog in https://github.com/HKUDS/CLI-Anything/pull/349\n* test: add regression tests for Live2D review blockers by @zyzly0705 in https://github.com/HKUDS/CLI-Anything/pull/350\n\n## New Contributors\n* @fuleinist made their first contribution in https://github.com/HKUDS/CLI-Anything/pull/239\n