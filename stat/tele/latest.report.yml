ication/json","state":"uploaded","size":120971,"digest":"sha256:d489b412ff933485f3cac027b6a1aa65000b4bfd5d1819fb06faf85b451e3938","download_count":0,"created_at":"2026-10-23T14:56:54Z","updated_at":"2026-10-23T14:56:55Z"},{"id":669453575,"node_id":"RA_kwDOSYLbr84n5w0H","name":"tele_openbsd_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":9577616,"digest":"sha256:7de61a3afa6c094c634438ae4076f25d9efeb35a543c47f0da061583adbf5d89","download_count":0,"created_at":"2026-10-23T14:56:08Z","updated_at":"2026-10-23T14:56:09Z"},{"id":669455798,"node_id":"RA_kwDOSYLbr84n5xW2","name":"tele_openbsd_arm64.tar.gz.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":120971,"digest":"sha256:ef7b0ea070622ddc01e5e688fe1b3e8071df4b4701d8019a359b83e5639e6181","download_count":0,"created_at":"2026-10-23T14:56:56Z","updated_at":"2026-10-23T14:56:56Z"},{"id":669453141,"node_id":"RA_kwDOSYLbr84n5wtV","name":"tele_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":18584902,"digest":"sha256:ec2630eb4fd4da48c17e6034600838796f4a64d2f778d9d1aeea3e823794d09a","download_count":16,"created_at":"2026-10-23T14:56:00Z","updated_at":"2026-10-23T14:56:01Z"},{"id":669455597,"node_id":"RA_kwDOSYLbr84n5xTt","name":"tele_windows_amd64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":126856,"digest":"sha256:b4b5f3dbb0720c1f44ef01eeb23adc14ded50bc35e2a5e7354e244fd93df569e","download_count":1,"created_at":"2026-10-23T14:56:52Z","updated_at":"2026-10-23T14:56:52Z"},{"id":669453242,"node_id":"RA_kwDOSYLbr84n5wu6","name":"tele_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16690686,"digest":"sha256:3469df97bc1d4d968afeb1de68a7107ec4f50542577cc781e31950b2cd4ca146","download_count":11,"created_at":"2026-10-23T14:56:01Z","updated_at":"2026-10-23T14:56:03Z"},{"id":669455644,"node_id":"RA_kwDOSYLbr84n5xUc","name":"tele_windows_arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":126856,"digest":"sha256:55f6da10c13c99f56d898b464b1a9ab30f76fad67278f593139a48c9bd9438e9","download_count":0,"created_at":"2026-10-23T14:56:53Z","updated_at":"2026-10-23T14:56:53Z"}],"body":"### Upgrading from 1.11\n\n- A second `tele` on the same account no longer exits: it joins the first as\n  another window and shares its connection.\n- Once you are logged in, `tele` offers once to install itself as a service,\n  so the account is held and notifications arrive with no window open. `n`\n  keeps things as they were; `tele daemon install` does it later.\n- Flags take two dashes, and the version and the theme tools are commands:\n  `tele version`, `tele theme check`, `tele theme dump`. `-e` stays.\n- 1.11 and 2.0 cannot hold the same account at once: quit 1.11 before\n  starting 2.0.\n\n### Added\n\n- `tele daemon` holds the account with no window: it keeps the connection and\n  delivers desktop notifications, and windows join it as they would join any\n  other `tele`. It never joins another one; one already holding the account is\n  named by its version and process id (#208).\n- `tele daemon status` says how the `tele` holding the account is doing, a\n  window's included: versions, what keeps it running, uptime, joined windows,\n  the account, the link to Telegram, the last update and the messages waiting\n  to be sent. It exits 3 when nothing answers (#208).\n- `tele daemon --service`, for a service manager to run. It waits for a state\n  directory another `tele` holds instead of exiting, and takes over when that\n  one quits (#208).\n- `tele daemon install` keeps `tele` running at every login as a service: a\n  LaunchAgent on macOS, a systemd user unit on Linux, a Task Scheduler task on\n  Windows. It runs `tele` as the `PATH` finds it, so an upgrade replaces what\n  it starts, and refuses a `PATH` that finds another `tele` unless `--path`\n  names one. There is one service per config file. `tele daemon uninstall`\n  stops and removes it, leaving state and config alone (#182).\n- `tele daemon status` warns when the installed service runs a command that is\n  gone, or another version than yours (#182).\n- Once logged in, a `tele` that holds the account asks once whether to install\n  the service: `y` installs it, `n` or Esc leaves it, and the question names\n  `tele daemon install` for later. It is not asked where installing could not\n  succeed, nor when the service is installed already (#208).\n- A window joined to a service waits for it through a restart: the status bar\n  says it is reconnecting, Enter keeps the text instead of sending it, and the\n  window carries on once the service is back. After thirty seconds, ninety on\n  Windows, it gives up and points to `tele daemon status`. A service that was\n  uninstalled is not waited for (#210, #182).\n- A newer window restarts an older service on the version installed now, and\n  an older window is told `tele` was updated. A `tele` that is not a service\n  is never restarted from outside (#183).\n- A log out, or a banned account, with no window open is told to the desktop\n  once, whatever `ui.notifications.desktop` says (#211).\n- `tele daemon status --json` prints the same answer as one JSON object, for\n  scripts. [docs/cli.md](docs/cli.md) describes it, with the exit codes and\n  the rules commands are named by (#213).\n- `-c` is short for `--config` (#213).\n\n### Changed\n\n- **Breaking:** flags take two dashes. `-version`, `-config`, `-theme-dump`\n  and `-theme-check` no longer work; use `--config`, and the commands below\n  for the rest. `-e` stays, and is also `--debug` (#208).\n- The version and the theme tools are commands: `tele version`,\n  `tele theme check [NAME]` and `tele theme dump [NAME]`. `--version`,\n  `--theme-check` and `--theme-dump` still work but are no longer offered.\n  A command line `tele` cannot read exits 2 instead of 1 (#213).\n- `tele daemon status` counts windows and commands apart, and says when\n  Telegram asked `tele` to wait. A command asking `tele` something no longer\n  counts as a window: a log out while one runs is still told to the desktop,\n  and quitting a window does not count it among the windows it would close\n  (#213, #212).\n- Every call to Telegram, from every window joined to the same `tele`, comes\n  out of one budget, spread out ahead of time instead of each call waiting on\n  its own. A flood wait holds only the kind of call that earned it, so a wait\n  on loading history no longer holds sending, and is not asked again until\n  it is over. Work nobody waits on, such as eager full-size photos, yields to\n  what you are doing. A wait something you are waiting on runs into is\n  counted down in the status bar. Telegram does not publish its limits, so\n  the budget is a guess: if `tele` often has you waiting, please report it\n  (#212).\n- The interface reaches the account only the way another process would:\n  through one link that outlives a log out, with everything it is told -\n  messages, notifications, progress, the login - on one stream in the order\n  it happened (#309).\n- The login is followed by tele itself rather than by the screen, so the\n  step being asked, a clock that is off and a connection that failed are\n  shown to whatever attaches, whenever it attaches. A login answer meant for\n  a step that has already moved on is refused instead of being taken for the\n  next one (#309).\n- Folders arrive together with the chat list instead of on their own (#309).\n- Logging out finishes any request still under way as cancelled, instead of\n  letting it fail on whatever the log out closed under it. A request to end\n  an account that has already ended no longer touches the next one (#309).\n- Everything the interface asks of the account and is told by it crosses a\n  local socket, after the two sides check that they speak the same protocol,\n  even when they run in the same process: every `tele` starts by looking for\n  the one that holds the state directory, and becomes it when there is none\n  (#205, #206, #209, #208).\n- A second `tele` on the same account no longer exits. It joins the first as\n  another window, sharing its connection, and closes when the first one quits.\n  The first one asks before quitting while others are joined to it, whatever\n  `confirm_quit` says. A window whose `tele` went away says whether it quit or\n  the connection broke, and prints what was typed but not sent when you quit\n  it (#208, #210).\n- The settings that belong to the connection - the app key, the state\n  directory, the proxy, the cache sizes, how much history is fetched, desktop\n  notifications - can be changed from any window, including one that joined\n  another `tele`. The change is sent to the `tele` holding the connection,\n  which writes it into its own config file and applies it; a window never\n  writes one of these into its own file. `history_limit` is always the one\n  the `tele` holding the connection reads (#208, #315).\n- One of those read only at start is marked `[host restart]`: it takes hold\n  when the `tele` holding the connection starts again, not when the window\n  does (#315).\n- Reloading the config from a window reloads the `tele` holding the\n  connection too, and says in one notice what either found wrong. A warning\n  about a setting is said once, by whichever side the setting belongs to\n  (#315).\n- Two `tele` processes changing settings in one config file at the same\n  moment no longer lose one of the changes (#315).\n- A window that joined another `tele` logs to `tele-client.log`, with its\n  process id on every line (#208).\n- A `tele` that cannot be joined - 1.11, an earlier 2.0 beta, or one speaking\n  another protocol - is named, with its version or process id, instead of the\n  new one waiting on it for ever (#208).\n- One client answers a login at a time. An answer typed in another window is\n  refused and says so, and a login whose window closed halfway starts again\n  from the phone number, so nobody finishes it with a code they never saw\n  (#211).\n- What is typed to log in is kept out of the log at every level, and a test\n  now holds it to that (#211).\n- Mentioning someone found in a group's member list keeps working when the\n  window has no address for them: the address is filled in by the `tele` that\n  holds the connection, and a mention it has none for is sent as plain text\n  (#208).\n\n### Fixed\n\n- On Windows, the default config file is read from and written to\n  `~\\.config\\tele\\config.yml` in the home directory, rather than under a\n  directory named `~` in whichever directory tele was started from.\n\n## Changelog\n\n"}
