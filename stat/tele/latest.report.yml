ded","size":126856,"digest":"sha256:88fb67f19c83c4a09f847fe85c831559f1ddba05de0657089672f89efad6bfb9","download_count":0,"created_at":"2026-11-06T20:36:21Z","updated_at":"2026-11-06T20:36:21Z"},{"id":718478128,"node_id":"RA_kwDOSYLbr84q0xsw","name":"tele_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16777006,"digest":"sha256:f96d5528a1982ec1dc2cf384ff5ca7b48ad2edcc7b4d6793ff4e3f57655c7d99","download_count":18,"created_at":"2026-11-06T20:35:13Z","updated_at":"2026-11-06T20:35:14Z"},{"id":718480327,"node_id":"RA_kwDOSYLbr84q0yPH","name":"tele_windows_arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":126856,"digest":"sha256:54924da3fe29c97504af469601c17a2abd45c63b202977898cd939f59db4e6ed","download_count":0,"created_at":"2026-11-06T20:36:11Z","updated_at":"2026-11-06T20:36:11Z"}],"body":"### Fixed\n\n- `tele daemon install` over a running service on macOS and Windows waits\n  for the old service to stop before it starts the new one. It used to fail\n  with `Bootstrap failed: 5` on macOS, or start nothing on Windows, and leave\n  the account with no host. `tele daemon uninstall` waits too, so an install\n  right after it works (#327).\n- Inline GIFs and the video player no longer blink or jump back and forth in\n  Ghostty. Each frame replaced the picture on screen, which Ghostty draws as\n  nothing until the new frame is decoded, and large frames were encoded\n  several at a time and arrived out of order. A frame now loads off screen\n  and is shown once it is ready, one frame at a time, and encodes about three\n  times faster (#331).\n\n## Changelog\n### Bug fixes\n* 7a8d7a2c43515df833dfbf87a47ccc1d02f4cd08: fix: #327 Show the wait for the old service (@sorokin-vladimir)\n* f901f99ac1ea8cbeb40f15c65903e542384c6189: fix: #327 Wait for launchd to let the old agent go (@sorokin-vladimir)\n* db3eca173cd21fd157cdc06676eaefa819da5975: fix: #327 Wait for the old task to stop on Windows (@sorokin-vladimir)\n* aeff9335c7d8898e7088dea5b5934a0adeb9b050: fix: #330 Let the link go unwatched again (@sorokin-vladimir)\n* 4e4057c0a2c255e1d83af6938efba7ffe933bb59: fix: #331 Encode one animation frame at a time (@sorokin-vladimir)\n* 60ce18fe4d5f2cc039d4e7caa987d99030263954: fix: #331 Give an animated image a second Kitty id (@sorokin-vladimir)\n* bbf74bbbf4a4b6fff1eda4ceb200d1dbc7c79bc0: fix: #331 Show a GIF frame once it is loaded (@sorokin-vladimir)\n* 020f4747294d15ef2594bd6e32b1017bc7459084: fix: #331 Show a modal frame once it is loaded (@sorokin-vladimir)\n\n","mentions_count":1}
