ed","size":126856,"digest":"sha256:41bb97fb80cc573004b2e5901e42a20821ba492b2478033608ce82fe09b0f9aa","download_count":1,"created_at":"2026-11-02T13:39:54Z","updated_at":"2026-11-02T13:39:54Z"},{"id":701886051,"node_id":"RA_kwDOSYLbr84p1e5j","name":"tele_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16769282,"digest":"sha256:5490f2ec60de1d60dc3685fb79361b5834753940491f0bbb1413fc7ae7b33e2d","download_count":16,"created_at":"2026-11-02T13:39:00Z","updated_at":"2026-11-02T13:39:01Z"},{"id":701888344,"node_id":"RA_kwDOSYLbr84p1fdY","name":"tele_windows_arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":126856,"digest":"sha256:fc59b236f5b023bf1d4455db3fc58eace381e08e3a116eb98c7e94a5b9bfea0e","download_count":1,"created_at":"2026-11-02T13:39:55Z","updated_at":"2026-11-02T13:39:55Z"}],"body":"### Added\n\n- `tele chats` prints a chat's `@username` in its own column, between the id\n  and the title, so the name a command takes is on screen. It is never cut\n  short (#328).\n- Logging in starts with a QR code to scan with Telegram on a phone, so a\n  login no longer waits on a code that may not arrive. `p` turns to the phone\n  number, and Esc goes back to the QR code from any step after it (#330).\n- The log records each step of the login: how Telegram sent the code, how it\n  would send the next one, and every refusal with Telegram's own error. Never\n  the number, the code, the password or the QR code's token (#330).\n\n### Fixed\n\n- A reply quoting one contact in a private chat no longer changes colour from\n  one message to the next: a message Telegram sends without its sender now\n  counts as sent by the chat's user (#282, #316).\n\n## Changelog\n### Features\n* f76c4c502b9ccc96262f85f7b4a57d00e67afa90: feat: #328 Show a chat's @username in tele chats (@sorokin-vladimir)\n* fe4b66d3759bd863de8ea73888e87c8205ace493: feat: #330 Carry the QR step to every window (@sorokin-vladimir)\n* d7b23b74fef0a390b76976b9a246357d5ce7ab5f: feat: #330 Carry the QR step to every window (@sorokin-vladimir)\n* add7238ad836a9b452b3db20a50c166b5827eef2: feat: #330 Draw the QR code on the login screen (@sorokin-vladimir)\n* 1675d3b090abec7346651c3e72e0fa09cacd6802: feat: #330 Log each step of the login (@sorokin-vladimir)\n* bc5c846a113e8440b5e34cde24efdca372a90d4f: feat: #330 Log in by QR code in the login loop (@sorokin-vladimir)\n* c472d97760a426f031e5dc9144f968f34105f239: feat: #330 Log in by QR code in the login loop (@sorokin-vladimir)\n### Bug fixes\n* c77a667bff7733fb775d7eeb442e330f15858b15: fix: #316 Assign peer ID to SenderID for incoming messages without FromID (@AdamMagued)\n### Other\n* 70cd146b0c85a0ce0414acbca3301e436381330a: build: Say TUI and CLI in the package description (@sorokin-vladimir)\n\n","mentions_count":2}
