1:10:29Z","updated_at":"2026-09-22T21:10:32Z"},{"id":582257687,"node_id":"RA_kwDOMSqWwc4itIwX","name":"Cline_0.0.34_x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":93538592,"digest":"sha256:c58b9789d2489069e8c15455fe62c5b3c83c08b167835c40ec73db3c6b33d494","download_count":5148,"created_at":"2026-09-22T21:10:29Z","updated_at":"2026-09-22T21:10:32Z"},{"id":582257682,"node_id":"RA_kwDOMSqWwc4itIwS","name":"Cline_0.0.34_x64-setup.exe.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":416,"digest":"sha256:09929e885a284d35e436d79e76126ec319a9c95a96d3ca0fa4e36c8e05bb5222","download_count":5,"created_at":"2026-09-22T21:10:29Z","updated_at":"2026-09-22T21:10:29Z"},{"id":582257688,"node_id":"RA_kwDOMSqWwc4itIwY","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":2882,"digest":"sha256:1fa30ba67d9b219db0e07ee4d28e3ad48edc6361db4cf1d6b898445ba9272844","download_count":9,"created_at":"2026-09-22T21:10:29Z","updated_at":"2026-09-22T21:10:29Z"}],"body":"\n- Composio connectors now load all their tools, not just the first 20. Google Calendar, for example, showed only 20 of its 47 tools, and the Installed view wrongly said \"20/20.\" The full list is now fetched and the tool cache refreshes instead of staying stale forever\n- You can now connect to a Mac as an SSH remote from a Mac. Picking a Mac host used to fail with \"Remote target darwin/arm64 is unsupported in SSH\" even though **Test** passed on the same profile. The app now uses its own signed backend as the helper on both Apple Silicon and Intel Mac hosts. Windows and Linux desktops still can't connect to a Mac out of the box\n- Session errors now stay in the transcript when you leave a session or open it in another client. Before, a failed run's error disappeared once you went away and came back, or opened the session in the CLI. Failures after all retries run out are now recorded too, and these error-only entries are left out of compaction\n- Stopping a run while it waits to retry an empty model response now takes effect right away, instead of after the backoff finishes\n\n**Full Changelog**: https://github.com/cline/cline/compare/desktop-v0.0.33...desktop-v0.0.34\n"}
