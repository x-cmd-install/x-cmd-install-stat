b830518e997b868d51377788bbe86691359879e6a0f0857dbebe1f5164c18","download_count":16,"created_at":"2026-10-08T06:50:31Z","updated_at":"2026-10-08T06:50:31Z"},{"id":621006840,"node_id":"RA_kwDOMSqWwc4lA8_4","name":"Cline_0.0.45_x86_64.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-redhat-package-manager","state":"uploaded","size":136049172,"digest":"sha256:98bed82634dcbaceae5d86bde355ffdcd390141bef2f0709f3b806771cb2e2c6","download_count":215,"created_at":"2026-10-08T06:50:31Z","updated_at":"2026-10-08T06:50:37Z"},{"id":621006843,"node_id":"RA_kwDOMSqWwc4lA8_7","name":"Cline_0.0.45_x86_64.rpm.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":416,"digest":"sha256:7f11bda303459efd070821da77fede1848dfafd8c09b7556139be2fca92c713d","download_count":9,"created_at":"2026-10-08T06:50:31Z","updated_at":"2026-10-08T06:50:31Z"},{"id":621006834,"node_id":"RA_kwDOMSqWwc4lA8_y","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5088,"digest":"sha256:45d2ec79d12594476e845bb51d64ff2778f3e43f122051c81254f6835963c15b","download_count":28,"created_at":"2026-10-08T06:50:31Z","updated_at":"2026-10-08T06:50:31Z"}],"body":"\n- SSH remotes start again. Since 0.0.38, connecting to an SSH environment failed with `SyntaxError: Invalid character`\n- On SSH environments, the git branch label no longer opens two new SSH logins every 5 seconds. It checks every 30 seconds now, and switching branches from the picker still updates it right away\n- Long model names in the composer show in full when the row has room, and only truncate when it runs out\n- Turning reasoning off no longer fails with a 400 error on GPT-6 Astra, GPT-6.1 Sol, Claude Fable 5 or Claude Opus 5.5\n- The background service no longer crashes about 3 seconds after an MCP server or hook quits before reading all of its input\n- Settings migrated from the VS Code extension no longer add an empty SAP AI Core provider\n- Refreshed the model catalog. Adds Claude Haiku 5.5. Default models change for Google Vertex AI (Claude Sonnet 5.5 \u2192 Claude Haiku 5.5), Cortecs, DevPass (LLM Gateway), Eden AI, GitHub Copilot, LLM Gateway, NanoGPT, OpenCode Go, Requesty, and Vivgrid (most now Claude Haiku 5.5)\n\n**Full Changelog**: https://github.com/cline/cline/compare/desktop-v0.0.44...desktop-v0.0.45\n"}
