8407c505ee12695e671d44e246070ca01eeecddc64568302c5","download_count":5,"created_at":"2026-09-30T23:56:14Z","updated_at":"2026-09-30T23:56:14Z"},{"id":602038506,"node_id":"RA_kwDOMSqWwc4j4mDq","name":"Cline_0.0.40_x86_64.rpm","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-redhat-package-manager","state":"uploaded","size":109853628,"digest":"sha256:598443c45744ada8ebfa33a606b59c38ff5eabdb0d37a766be4eb008a06d7098","download_count":26,"created_at":"2026-09-30T23:56:14Z","updated_at":"2026-09-30T23:56:17Z"},{"id":602038501,"node_id":"RA_kwDOMSqWwc4j4mDl","name":"Cline_0.0.40_x86_64.rpm.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":416,"digest":"sha256:a1862da062d42b1925e553e55fb7fd008a022fda6ec0ba2f64824bd1542879ed","download_count":4,"created_at":"2026-09-30T23:56:14Z","updated_at":"2026-09-30T23:56:14Z"},{"id":602038508,"node_id":"RA_kwDOMSqWwc4j4mDs","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":5443,"digest":"sha256:2c92d907373070a6541fd0c0a0b6d2d330090728a37e18dc7c8c16ee4e58d584","download_count":5,"created_at":"2026-09-30T23:56:14Z","updated_at":"2026-09-30T23:56:14Z"}],"body":"\n- Custom providers added with **Add Provider** now work when you run a task. They showed up in the provider and model pickers but failed with `Unknown or disabled provider`\n- New chats remember whether you last used **Cloud** or **Local**, and which Cloud model you picked, instead of always going back to Local. Switching a thread from Local to Cloud also opens on your remembered Cloud model\n- Saving provider credentials no longer fails when the provider's model list can't be fetched, and the model list refreshes when you change a provider's API key or endpoint\n- MCP settings always use the same file. With `CLINE_MCP_SETTINGS_PATH`, `CLINE_DATA_DIR`, or `CLINE_DIR` set, reading and saving servers, MCP OAuth sign-in, and **Open MCP settings** now all use that path, where some could open a different file before\n- Tool diffs now follow the app's font size setting instead of a fixed 13px\n- When an MCP tool returns more output than fits in context, the agent can now read the rest. It gets a preview plus a link it can page through, so the output past the cutoff is no longer lost\n- Refreshed the model catalog. The Cline recommended list adds GPT-6.1 Sol. Default models change for 302.AI (Claude Sonnet 5.5), NanoGPT (Ling 3.1 Flash), Vivgrid (GPT-6.1 Sol), and Vultr (MiMo V2.6 Flash RL). Vultr's model ids were renamed upstream, so a pinned Vultr model may need to be re-selected\n\n**Full Changelog**: https://github.com/cline/cline/compare/desktop-v0.0.39...desktop-v0.0.40\n"}
