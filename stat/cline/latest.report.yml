T01:42:36Z","updated_at":"2026-09-18T01:43:09Z"},{"id":571560968,"node_id":"RA_kwDOMSqWwc4iEVQI","name":"Cline_0.0.32_x64-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":94699616,"digest":"sha256:fd83b00f68d94d5ef3328421a016485bcacc77654a7994ec1cea8bc6f05ff7f6","download_count":18799,"created_at":"2026-09-18T01:42:36Z","updated_at":"2026-09-18T01:42:47Z"},{"id":571560972,"node_id":"RA_kwDOMSqWwc4iEVQM","name":"Cline_0.0.32_x64-setup.exe.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":416,"digest":"sha256:00bf320d948ad1e37cf05682f9231514372c8b58eac50d4f318bc84c3445e85d","download_count":27,"created_at":"2026-09-18T01:42:36Z","updated_at":"2026-09-18T01:42:36Z"},{"id":571560969,"node_id":"RA_kwDOMSqWwc4iEVQJ","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":2464,"digest":"sha256:32b42dbe47a597b58892184decc8c0922f82d07a92c2363a0568e217e68411f8","download_count":45,"created_at":"2026-09-18T01:42:36Z","updated_at":"2026-09-18T01:42:36Z"}],"body":"\n- Cline starts again after updating. In 0.0.31 the app could fail at launch with \"desktop backend exited before publishing its endpoint\" and never reach the workspace picker. Cline runs its own copy of the Cline Hub in the background, and the two halves had been built from different copies of the same code \u2014 so the Hub announced one build identity while the app expected another, the app shut down the very Hub it had just started, and startup timed out reporting \"No compatible hub runtime is available\". Both halves now load the same copy of that code, and the real compiled backend is now booted end-to-end in CI on every change so the two cannot drift apart again\n\n**Full Changelog**: https://github.com/cline/cline/compare/desktop-v0.0.31...desktop-v0.0.32\n","reactions":{"total_count":10,"+1":5,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":1,"eyes":0}}
