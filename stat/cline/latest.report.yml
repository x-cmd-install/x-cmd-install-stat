{"id":398848474,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOMSqWwc4XxfHa","tag_name":"sdk/sdk/v0.0.87","target_commitish":"main","name":"SDK v0.0.87","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-29T05:30:44Z","updated_at":"2026-09-29T05:30:55Z","published_at":"2026-09-29T05:30:55Z","assets":[],"body":"\n- The hub now starts reliably on Windows machines with a system proxy. Bun's fetch sends loopback requests through `HTTP(S)_PROXY` with no localhost bypass, so on machines that export those variables (Clash, v2ray, corporate proxies) every hub discovery probe went to the proxy, the healthy daemon looked unreachable, and startup failed with \"No compatible hub runtime is available\". New `ensureLoopbackProxyBypass()` adds the loopback addresses to `NO_PROXY`/`no_proxy` whenever a proxy variable is set, and the hub client calls it before every probe, drain, and shutdown request. Compiled Bun entry detection also recognizes the Windows `B:\\~BUN\\` embedded path, so Windows daemons are spawned with the `--cline-hub-daemon` marker instead of a dead entry path\n- The hub daemon log now records one line per socket close with the close code and reason, whether the heartbeat sweep dropped it for a missed pong, and whether the server was already shutting down. When the daemon dies with `EADDRINUSE`, `hub.daemon.startup` telemetry and the daemon log now say what holds the port (PID, command line, whether the instance lock was held, and whether the occupant answers the hub health probe)\n- Token usage no longer counts reasoning tokens twice. Providers report reasoning tokens as a subset of `outputTokens`, but `normalizeUsage()` returned the raw total alongside `reasoningTokenCount`, so session totals and telemetry counted them in both. `outputTokens` now excludes reasoning tokens, including for the AI SDK v4 `outputTokens.reasoning` shape. Cost is still computed from the full total, since reasoning is billed at the output rate\n- Gateway models on providers that mix endpoints keep their per-model `apiProtocol` (responses, messages, gemini, or chat/completions). Configured models replace catalog entries and dropped the field, so those models fell back to the provider-wide default API\n- Bedrock fixes. Bare OpenAI GPT-6 and GPT-5.6 ids now route through inference profiles like Claude, Nova, and DeepSeek already did, since Bedrock only serves them that way; `gpt-oss` stays on-demand, and India regions (`ap-south-1`, `ap-south-2`) now resolve the `in.` geo profile. `@ai-sdk/amazon-bedrock` moves to `^5.0.96`: OpenAI models behind inference profiles get `reasoning.effort` instead of the rejected `reasoningConfig`, and models the adapter can't classify (application inference-profile ARNs, Nova Micro) no longer receive a reasoning config that Bedrock rejects with \"Extra inputs are not permitted\"\n- Provider-settings migration now treats a bare legacy `awsProfile` (set with neither `awsAuthentication: \"profile\"` nor `awsUseProfile`) as Bedrock profile auth, instead of writing a Bedrock entry with no profile\n- The yolo-mode system prompt no longer includes the plan/act mode instructions, since yolo sessions don't use that workflow. Plan and act prompts are unchanged\n- Cron (`.cline/cron/*.md`) and task (`*.task.md`) specs saved as UTF-8 with BOM, as Windows Notepad does, now parse. Before, the BOM hid the opening frontmatter fence and the spec was rejected\n- The fallback code search now includes PHP sources and templates (`php`, `phtml`, `inc`, `twig`), so Laravel and other PHP projects show up in `search_codebase`. Composer's `vendor` directory is excluded from search and the workspace file index, matching `node_modules`\n- `LocalRuntimeHost.updateSession` returns the persisted metadata and refreshes the active session's in-memory metadata after an update, including a title change, so hosts no longer read stale metadata until the session is reloaded\n- The `./cloud` export gains shared cloud handoff support (moving a local session to a cloud agent and back) and persistent cloud workspaces that can be suspended and resumed. Saved reasoning settings survive a runtime restart and a resume, and automatic Git backups only run for ephemeral sandboxes\n- Refreshed the model catalog: 209 to 211 providers and 6,386 to 6,447 models. New providers are `bee` (Bee by HEOSSI) and `pareto` (Pareto Inference, reads `PARETO_API_KEY`). The Cline recommended list adds Claude Sonnet 5.5, Claude Opus 5.5, and the `stealth/pixel-canary` stealth model, and drops Claude Opus 5\n\n**Full Changelog**: https://github.com/cline/cline/compare/sdk/sdk/v0.0.86...sdk/sdk/v0.0.87\n"}
