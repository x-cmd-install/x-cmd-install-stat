r\n## Highlights\r\n\r\n- Added Planner to bring Markdown tasks and calendar events into one view.\r\n- Schedule tasks by dragging them onto the calendar, move and resize time blocks, find free time, and undo supported changes.\r\n- Connect Apple Calendar and Apple Reminders to manage events and tasks alongside your notes.\r\n- Added Planner tools to AI Chat for finding tasks, checking availability, and managing your schedule.\r\n- Added Meeting Notes with on-device transcription from microphone and system audio, saved directly into Markdown with speaker labels.\r\n- Refined the 3D Graph View with a quieter constellation design, improved light and dark themes, and trackpad pan, pinch zoom, and rotation.\r\n- Rebuilt Agent World as an interactive harbor with 25 resident variants, note-linked buildings, animated connections, and more efficient rendering.\r\n\r\n## Notes\r\n\r\n- Meeting Notes requires an Apple Silicon Mac running macOS 15 or later. First use downloads approximately 1.76 GB of models and requires audio permissions. Audio processing stays on your device; saved notes follow your vault\u2019s sync settings.\r\n- Apple Calendar and Apple Reminders require their respective macOS permissions.\r\n- Google Calendar integration is temporarily disabled while OAuth scope verification is pending. Existing Google sign-in remains available.\r\n- Agent World remains experimental and disabled by default. Enable it in Settings > Plugins and restart the app.\r\n\r\n**Full Changelog**: [0.5.8 \u2192 0.6.0](https://github.com/kuku-mom/kuku/compare/0.5.8...0.6.0)"}
