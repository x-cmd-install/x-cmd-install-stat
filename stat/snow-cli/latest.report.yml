{"id":416320358,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84Y0Itm","tag_name":"v0.9.9","target_commitish":"main","name":"Release v0.9.9","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-18T08:07:08Z","updated_at":"2026-10-18T08:12:06Z","published_at":"2026-10-18T08:12:06Z","assets":[],"body":"## Snow CLI v0.9.9\n\n### What's New\n\n- Tool-call correction: the new `/tool-correction` command (`on` / `off` / `status`) enables automatic repair of failed tool arguments by the active profile's basic model (falling back to the advanced model). Only argument-level failures are retried, up to 3 repairs per failed invocation; permission, network, timeout and user-cancellation errors pass through unchanged. Repaired `terminal-execute` commands are re-checked against sensitive-command rules, `askuser-ask_question` is never auto-corrected, and a live repairing / retrying / repaired / gave-up indicator is shown in the status line. The setting is project-scoped (`toolCorrectionEnabled`) and enabled by default\n- OAuth identity headers as editable schemes: fixed provider identity headers (Codex, Claude, Antigravity) are no longer hardcoded in request code; sign-in now creates and binds same-named custom header schemes (`Codex` / `Claude` / `Antigravity`), so you can inspect and adjust them in the Custom Headers settings while account-level dynamic headers such as `chatgpt-account-id` are still injected per request. A one-time startup migration creates and binds schemes for legacy OAuth profiles\n- No-op edit protection: edit-by-search and hashline edit tools now reject edits that would leave the file unchanged instead of reporting success with an empty diff, and the DiffViewer plus the pending diff collector drop no-change entries, including results restored from older sessions or logs\n- Docs and i18n: command panel documentation and the en / zh / zh-TW strings are updated for the new tool-correction command and OAuth header scheme behavior\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
