{"id":392469749,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84XZJz1","tag_name":"v0.8.35","target_commitish":"main","name":"Release v0.8.35","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-20T15:00:51Z","updated_at":"2026-09-20T15:04:59Z","published_at":"2026-09-20T15:04:59Z","assets":[],"body":"## Snow CLI v0.8.35\n\n### What's New\n\n- Add WebSocket transport support for the Responses API: a new \"Responses WebSocket Mode\" toggle (off by default, only shown when the request method is Responses) that streams over a persistent WebSocket connection on the same /responses endpoint instead of HTTP + SSE, with proxy support, handshake timeout, and idle-timeout handling\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
