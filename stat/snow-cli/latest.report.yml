{"id":428027224,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84Zgy1Y","tag_name":"v0.9.13","target_commitish":"main","name":"Release v0.9.13","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-29T14:55:57Z","updated_at":"2026-10-29T15:13:02Z","published_at":"2026-10-29T15:13:02Z","assets":[],"body":"## Snow CLI v0.9.13\n\n### What's New\n\n- Faithful session resume: file-change previews are no longer lost when a conversation is restored from disk or replayed after compression. Messages rebuilt from persisted history are tagged with a new `restoredFromSession` flag, so the diffs of `filesystem-edit`, `filesystem-replaceedit`, `filesystem-create` and `filesystem-copy` (including batch results) keep rendering exactly as they did in the original turn instead of disappearing once the tool is no longer `pending`\n- Robust `/btw` side questions: the conversation snapshot sent by `/btw` is now sanitized before hitting the API. An unfinished tool-call round (assistant `tool_calls` still waiting for results, typical when a side question is asked mid-turn) keeps only its text content, and orphaned `tool` messages are dropped, so OpenAI-compatible providers no longer reject the request with `invalid_request_error: No tool output found for function call ...`\n- Engineering hygiene: the touched modules are re-formatted with the existing Biome configuration (import and call-argument wrapping normalized), with no behavior change\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
