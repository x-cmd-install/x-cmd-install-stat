{"id":418128666,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84Y7CMa","tag_name":"v0.9.11","target_commitish":"main","name":"Release v0.9.11","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-20T07:40:26Z","updated_at":"2026-10-20T07:47:24Z","published_at":"2026-10-20T07:47:24Z","assets":[],"body":"## Snow CLI v0.9.11\n\n### What's New\n\n- MCP custom API mode: MCP servers now support `type: \"api\"` (plus an explicit `sse` transport), mapping plain HTTP endpoints to MCP tools without spawning a subprocess or keeping a persistent connection. Endpoint definitions cover method/path, per-endpoint headers, shared cookies, parameters in query/path/header/body with types, required flags and default values, and `none`/`json`/`form`/`multipart`/`raw` bodies with `{{param}}` templates (typed placeholders, missing optional params pruned automatically). Configs copied from Snow APP's API-type MCP servers work as-is, including the `args: {cookies, endpoints}` database format; validation requires a URL and at least one endpoint\n- Safer tool-call correction: automatic argument repair is now limited to tools shipped by Snow. User-configured MCP server tools are excluded because retrying unknown side effects could duplicate writes, and `terminal-execute`, `session-command-run`, `scheduler-schedule_task` plus every `team-` / `subagent-` tool are never silently repaired. Built-in tool prefixes are centralized in a single allowlist shared by tool discovery and correction\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
