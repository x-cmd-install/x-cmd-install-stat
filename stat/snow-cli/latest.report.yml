{"id":414003066,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84YrS96","tag_name":"v0.9.7","target_commitish":"main","name":"Release v0.9.7","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-15T15:53:32Z","updated_at":"2026-10-15T15:59:34Z","published_at":"2026-10-15T15:59:34Z","assets":[],"body":"## Snow CLI v0.9.7\n\n### What's New\n\n- Perceptual theme engine: a new zero-dependency OKLCH color engine with bisection gamut mapping and W3C APCA readability gates powers the custom theme screen, adding 7 built-in presets (Dracula, Monokai, Solarized, Catppuccin, Gruvbox, Nord, Neon) and an APCA-driven dynamic contrast boost in DiffViewer for accessible syntax diffing\n- Lively token awaiting indicator: the frozen \"0 tokens\" placeholder shown while waiting for the first streamed token (TTFT) is replaced with a dynamic awaiting state, falling back to a compact \"\u00b7\u00b7\u00b7\" on terminals narrower than 60 columns\n- Session resume and compression fixes: context summary prefixes are filtered out when resolving the initial user prompt so compression summaries are no longer hijacked by the ancient root prompt, and genuinely completed tool calls no longer leave ghost pending cards when a session is resumed\n- Core robustness fixes: background codebase indexing is skipped when the workspace is the home directory, a root drive, or a multi-user root (with grep/rg depth safeguards and broader system directory excludes), and /clear no longer blocks on Stop-The-World GC while preserving persistent MCP connections and tool caches\n- Clean terminal exit: focus reporting is disabled on all exit paths (exit, SIGINT, SIGTERM, uncaughtException) so no ^[[I/^[[O bracketed garbage leaks into the shell, and cursor visibility and default shape are restored\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
