{"id":431376015,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84ZtkaP","tag_name":"v0.9.14","target_commitish":"main","name":"Release v0.9.14","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-02T11:18:18Z","updated_at":"2026-11-02T11:22:42Z","published_at":"2026-11-02T11:22:42Z","assets":[],"body":"## Snow CLI v0.9.14\n\n### What's New\n\n- Tool-call correction is now reflected in conversation history: when the correction agent repairs a failed call and the retry succeeds, the repaired arguments replace the original ones in the assistant `tool_calls` message. Both the in-memory context and the persisted session therefore contain exactly the call that actually ran, with no repair note and no failed intermediate attempts leaking into the main flow; the correction status note was also rewritten to describe the repair accurately\n- Large-file diffs are dramatically faster: diff previews take an exact-match fast path before falling back to the expensive sliding-window similarity scan, and that scan now pre-filters candidate windows with prefix-sum length checks. `DiffViewer` keeps only six context lines around the change before handing content to jsdiff, falls back to simple replacement hunks for enormous near-total rewrites (every line is still rendered), skips the per-line hashline scan when no anchors are present, wraps ANSI-coloured output without O(n^2) re-slicing, and gains light-theme syntax colours; terminal previews and the confirmation panel now share one file reader so both produce an identical diff\n- Plugin panel state survives terminal resize: `AnyPanel` now reloads and re-initializes a plugin only when its `pluginId` changes. Width, language, session and translation updates re-render in place, and per-instance `initialized`/`disposed`/`cleaned` flags make cleanup idempotent, so hot reloads and refresh timers can no longer touch stale instances or reset host UI state\n- Cleaner editor context: cursor line and column are no longer injected into user messages, because they are not a reliable instruction target and could make the model misjudge where the user's focus actually is. The active file and the selected code are still included\n- Speedometer and Ultra TODO mode are now enabled by default: both can still be turned off explicitly (`/speedometer off`, `/ultra-todo`), and an explicit `false` is honored on startup. Command descriptions and the documentation now state the default\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
