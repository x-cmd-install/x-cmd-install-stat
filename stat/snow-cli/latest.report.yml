{"id":414537435,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPfAcG84YtVbb","tag_name":"v0.9.8","target_commitish":"main","name":"Release v0.9.8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-16T04:21:02Z","updated_at":"2026-10-16T04:25:43Z","published_at":"2026-10-16T04:25:43Z","assets":[],"body":"## Snow CLI v0.9.8\n\n### What's New\n\n- Terminal shell preference: a new terminalShell setting (auto, pwsh, powershell, cmd, git-bash) is exposed through an interactive config selector, and Windows shell resolution now honors the chosen shell with automatic fallback so commands run in the shell you expect\n- MCP resilience and process hygiene: a two-tier MCP tool catalog disk cache with config-hash validation and hit/miss statistics, a circuit breaker that fast-fails dead or unreachable MCP servers after 2 consecutive failures and recovers via a single canary probe after a 2-minute cooldown, and unified cross-platform process-tree termination (recursive POSIX descendant reaping plus process-group kill, Windows taskkill /T) so aborted or timed-out commands no longer leave orphaned children\n- Pending message delivery: user messages queued while a tool call is running are now injected reliably at the end of the tool round, guarded by a timing signal that never interleaves them into an unclosed tool_call turn\n- Session compression and resume fixes: compression now resolves and injects the current active user request instead of falling back to the ancient root prompt, and a new canonical path utility normalizes separators for consistent cross-platform path handling\n- Config plane and i18n: a SNOW_CONFIG_DIR environment override for the global config directory, plus restoration of i18n keys and the awaiting-first-token label that were lost during recent merges\n\n### Installation\n```bash\nnpm install -g snow-ai\n```\n\n### Usage\n```bash\nsnow\n```\n### Update\n```bash\nsnow --update\n```\n"}
