{"id":456420747,"author":{"login":"intellild","id":8379858,"node_id":"MDQ6VXNlcjgzNzk4NTg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4bNG2L","tag_name":"v2.3.4","target_commitish":"main","name":"v2.3.4","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-24T07:03:17Z","updated_at":"2026-11-24T07:58:26Z","published_at":"2026-11-24T07:58:26Z","assets":[],"body":"## Highlights\r\n\r\n### Smaller bundles\r\n\r\nRspack now produces smaller bundles with less runtime code on modern targets, skipping unnecessary helpers, and improved tree-shaking.\r\n\r\n### Clearer plugin, loader, and build diagnostics\r\n\r\nDiagnostics across built-in plugins and loaders now include plugin names, loader names, and source filenames so issues are easier to trace back to configuration and source files.\r\n\r\n### Solid v2 support\r\n\r\nRspack now supports Solid v2 through [`solid-loader`](https://github.com/rstackjs/solid-loader).\r\n`create-rspack` now includes `solid-js` and `solid-ts` starter templates. You can now create Solid projects with `create-rspack`:\r\n\r\n```bash\r\nnpm create rspack@latest -- --template solid-ts\r\n```\r\n\r\nSee [#16752](https://github.com/web-infra-dev/rspack/pull/16752).\r\n\r\n## What's Changed\r\n### New Features 🎉\r\n* feat: support output.environment.spread by @hai-x in https://github.com/web-infra-dev/rspack/pull/16604\r\n* feat: show plugin names in SRI and ESM library diagnostics by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16728\r\n* feat: show plugin names in copy errors and ESM chunk name warnings by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16731\r\n* feat: show loader names in SWC and Lightning CSS warnings by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16732\r\n* feat(runtime): bridge webpack runtime globals for runtime extensions by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16681\r\n* feat: show source filenames in asset conflict errors by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16733\r\n* feat: support output.environment.symbol by @hai-x in https://github.com/web-infra-dev/rspack/pull/16707\r\n* feat(create-rspack): add Solid JavaScript and TypeScript templates by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16752\r\n* feat(javascript): clarify warnings for dynamic module paths by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16771\r\n* feat(lightningcss): add lightDark feature option by @CyberAP in https://github.com/web-infra-dev/rspack/pull/16829\r\n* feat(lightningcss): support drafts.scrollNavigationControls by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16833\r\n### Performance 🚀\r\n* perf(build): use LLD on macOS by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16666\r\n* perf: avoid eager cloning of parallel loader tasks by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16457\r\n* perf: port upstream specifier parsing fast paths by @SyMind in https://github.com/web-infra-dev/rspack/pull/16719\r\n* perf: emit arrow callbacks for dynamic imports by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16742\r\n* perf(runtime): use globalThis directly when supported by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16745\r\n* perf: skip unused CommonJS default interop getters by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16751\r\n* perf(runtime): trim redundant code in runtime helper templates by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16766\r\n* perf(runtime): emit concise arrow in getChunkFilename by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16764\r\n* perf: emit arrow callbacks for remaining dynamic import helpers by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16765\r\n* perf(runtime): shorten automatic public path code by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16767\r\n* perf(hmr): cache chunk versions and avoid redundant allocations by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16673\r\n* perf: emit CommonJS default interop getter only when it is read by @hai-x in https://github.com/web-infra-dev/rspack/pull/16811\r\n### Bug Fixes 🐞\r\n* fix(cache): validate virtual modules by content in new cache by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16679\r\n* fix: tree shake shorthand property in destructuring assignment by @hai-x in https://github.com/web-infra-dev/rspack/pull/16659\r\n* fix(ci): handle nightly Rust linker flags in musl builds by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16696\r\n* fix(deps): upgrade SWC to fix preserved class name collisions by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16697\r\n* fix: make warning regex filters stateless by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16694\r\n* fix(rsc): preserve CSS import order in RSC entries by @SyMind in https://github.com/web-infra-dev/rspack/pull/16699\r\n* fix(rsc): preserve client module order in RSC entries by @SyMind in https://github.com/web-infra-dev/rspack/pull/16704\r\n* fix(rsc): reuse generated entries from the persistent cache by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16709\r\n* fix(mf): isolate shared fallback caches and outputs by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16721\r\n* fix(javascript): avoid numeric-only chunk content hashes by @hai-x in https://github.com/web-infra-dev/rspack/pull/16715\r\n* fix: restore source map extraction warnings from module cache by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16723\r\n* fix(cache): preserve cacheability for handled importModule errors by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16727\r\n* fix(css): preserve pure context in nested rules by @intellild in https://github.com/web-infra-dev/rspack/pull/16685\r\n* fix(mf): match short caret and tilde ranges in the consume runtime by @arnaud-zg in https://github.com/web-infra-dev/rspack/pull/16663\r\n* fix(core): stop module graph memory growth in watch mode by @Dennis273 in https://github.com/web-infra-dev/rspack/pull/16475\r\n* fix(html): include the filename in HTML parse errors by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16737\r\n* fix(asset): clarify the error for unknown MIME types by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16741\r\n* fix(core): show the resolution directory in missing loader errors by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16744\r\n* fix(core): distinguish source map read and parse failures by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16746\r\n* fix(define-plugin): clarify conflicting NODE_ENV values by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16747\r\n* fix(core): preserve query and fragment in fully specified import hints by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16756\r\n* fix(core): skip file extension hints when resolving directories by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16757\r\n* fix(runtime): honor even priorities in onChunksLoaded by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16758\r\n* fix(core): shorten long lists of possible exports by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16762\r\n* fix(worker): treat top-level this in classic browser worker entry as global scope by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16763\r\n* fix: iterate ArrayQueue in FIFO order after internal reversal by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16787\r\n* fix(deps): upgrade swc_core to 85.0.0 to keep React Compiler source maps by @Nsttt in https://github.com/web-infra-dev/rspack/pull/16775\r\n* fix(core): clarify the hint for fully specified imports by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16788\r\n* fix: clamp unit index and reject non-finite values in formatSize by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16789\r\n* fix: return false in Template.getModulesArrayBounds for empty or invalid module ids by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16790\r\n* fix: reject out-of-range version components in encodeVersion by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16791\r\n* fix: honor boolean stats options and aggregate versions by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16726\r\n* fix(rsc): unblock compiler shutdown after a fatal build error by @SyMind in https://github.com/web-infra-dev/rspack/pull/16818\r\n* fix(css): resolve imported @value class selectors to the shared scope… by @intellild in https://github.com/web-infra-dev/rspack/pull/16740\r\n* fix: tree shake evaluation-only dynamic imports by @SyMind in https://github.com/web-infra-dev/rspack/pull/16738\r\n* fix(css): inject external @import rules with exportType style by @intellild in https://github.com/web-infra-dev/rspack/pull/16734\r\n* fix(css): preserve inherited conditions and intersect media queries for external @import by @intellild in https://github.com/web-infra-dev/rspack/pull/16759\r\n* fix(cache): honor virtual module writes in thisCompilation by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16820\r\n* fix(rsc): include client references returned by server actions by @SyMind in https://github.com/web-infra-dev/rspack/pull/16821\r\n* fix(cache): avoid producer dependencies on extracted CSS modules by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16825\r\n* fix(cache): respect force_build when restoring modules from cache by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16826\r\n* fix: compile error by @hai-x in https://github.com/web-infra-dev/rspack/pull/16828\r\n* fix(tree-shaking): track short-circuit dependency guards by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16816\r\n* fix(javascript): clarify invalid DefinePlugin expression warnings by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16794\r\n* fix: normalize absolute source map resource paths by @SyMind in https://github.com/web-infra-dev/rspack/pull/16778\r\n### Refactor 🔨\r\n* refactor(hmr): resolve loading chunk data in the assign runtime ids pass by @hai-x in https://github.com/web-infra-dev/rspack/pull/16710\r\n* refactor: avoid redundant work in source map extraction by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16736\r\n* refactor(core): share module options by matched rule effects by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16743\r\n* refactor(watcher): store timestamps and event baselines in one file record by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16824\r\n### Document 📖\r\n* docs: clarify Stats usage and performance guidance by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16678\r\n* docs: clarify splitChunks performance guidance by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16682\r\n* docs: clarify module rules performance guidance by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16691\r\n* docs: explain externals function performance overhead by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16706\r\n* docs: document Solid 2 integration with solid-loader by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16720\r\n* docs(agents): use compilerCases only for direct compiler tests by @ScriptedAlchemy in https://github.com/web-infra-dev/rspack/pull/16755\r\n* docs: remove outdated ESM output roadmap by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16761\r\n* docs: clarify preserveModules usage and output by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16768\r\n* docs: rewrite the ESM output guide by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16772\r\n* docs: clarify output.module and its effect on defaults by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16774\r\n* docs: clarify script types for runtime chunks and HTML entries by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16776\r\n* docs: clarify when avoidEntryIife removes the entry wrapper by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16792\r\n* docs: clarify ESM library output types by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16795\r\n* docs: clarify how ESM output loads external dependencies by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16834\r\n### Other Changes\r\n* chore: upgrade Rust to nightly-2026-11-13 (take 2) by @quininer in https://github.com/web-infra-dev/rspack/pull/16677\r\n* chore: remove obsolete development commands by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16684\r\n* chore(deps): remove unused plugin dependencies by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16688\r\n* test: clean up disabled Rust tests by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16689\r\n* chore: remove stale platform release commands by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16692\r\n* test: remove deprecated CSS experiment options by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16693\r\n* test: customize persistent cache checks per namespace by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16680\r\n* test: restore commented loader source map cases by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16698\r\n* chore: remove redundant homepage warnings by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16700\r\n* test: allow cases to skip persistent cache checks by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16705\r\n* test: clean up stale test filters by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16708\r\n* test: remove obsolete compatibility helpers by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16714\r\n* test: remove obsolete HTTPS lazy compilation fixture by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16716\r\n* chore: clean up stale maintenance configuration by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16718\r\n* test: shrink file-dependencies-huge to fix flaky afterAll timeout by @hai-x in https://github.com/web-infra-dev/rspack/pull/16722\r\n* chore: upgrade to Rslib 1.1 beta by @elecmonkey in https://github.com/web-infra-dev/rspack/pull/16735\r\n* chore(deps): update patch npm dependencies by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16783\r\n* chore(deps): update dependency playwright to v1.65.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16780\r\n* chore(deps): update dependency webpack-sources to v3.7.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16781\r\n* chore(deps): update patch crates by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16782\r\n* test(core): add a directory for unit tests by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16793\r\n* test(core): move Template unit tests into the core package by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16798\r\n* chore(deps): update dependency ws to ^8.23.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16810\r\n* chore(deps): update dependency ts-checker-rspack-plugin to ^1.8.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16809\r\n* chore(deps): update dependency cspell to ^10.5.2 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16807\r\n* test(core): move standalone assertions into the core unit suite by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16799\r\n* chore(deps): update dependency path-serializer to v0.8.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16808\r\n* test(watcher): cover snapshots of times info with symlink following disabled by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16823\r\n* chore: bump `swc_core` from 85.0 to 85.1 by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16832\r\n\r\n## New Contributors\r\n* @Dennis273 made their first contribution in https://github.com/web-infra-dev/rspack/pull/16475\r\n* @Nsttt made their first contribution in https://github.com/web-infra-dev/rspack/pull/16775\r\n\r\n**Full Changelog**: https://github.com/web-infra-dev/rspack/compare/v2.3.3...v2.3.4\r\n\r\n","reactions":{"total_count":4,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":19}
