{"id":440284475,"author":{"login":"JSerFeng","id":57202839,"node_id":"MDQ6VXNlcjU3MjAyODM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4aPjU7","tag_name":"v2.3.2","target_commitish":"main","name":"v2.3.2","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-10T11:32:51Z","updated_at":"2026-11-10T17:06:35Z","published_at":"2026-11-10T11:47:41Z","assets":[],"body":"## Highlights 💡\r\n\r\n### More reliable HMR, fewer full-page reloads\r\n\r\nHMR now handles code-splitting changes more reliably, reducing unnecessary full-page reloads when chunks are added or rearranged. Newly required chunks are loaded before HMR accept callbacks run, and changes to async chunk dependencies no longer cause unnecessary update propagation. \r\n\r\n### Experimental `rule.as`\r\n\r\nThe experimental `rule.as` option lets a matched resource use a different path for subsequent rule matching while preserving the original resource for file reading and loaders. For example, `as: '[resource-path].txt'` lets later `.txt` rules also process `example.source.js`. ([#15917](https://github.com/web-infra-dev/rspack/pull/15917))\r\n\r\n```js\r\n// rspack.config.mjs\r\nexport default {\r\n  module: {\r\n    rules: [\r\n      {\r\n        test: /\\.source\\.js$/,\r\n        type: 'asset/source',\r\n        as: '[resource-path].txt',\r\n      },\r\n      { test: /\\.txt$/, use: './text-loader.js' },\r\n    ],\r\n  },\r\n};\r\n```\r\n\r\nHere, `example.source.js` matches the later `.txt` rule as `example.source.js.txt`; `text-loader.js` still receives the contents of the original file.\r\n\r\n### Skip side-effect-free `export *` passthrough modules\r\n\r\nRspack can now bypass side-effect-free modules that only forward exports with `export *`, connecting directly to the underlying module. [#16472](https://github.com/web-infra-dev/rspack/pull/16472)\r\n\r\nMark the package as side-effect-free in `package.json`:\r\n\r\n```json\r\n{\r\n  \"sideEffects\": false\r\n}\r\n```\r\n\r\n```js\r\n// src/value.js\r\nexport const value = 42;\r\n\r\n// src/passthrough.js\r\nexport * from './value.js';\r\n\r\n// src/index.js\r\nexport * from './passthrough.js';\r\n```\r\n\r\nWith `optimization.sideEffects` enabled (the default in production), the `export *` connection from `index.js` can now go directly to `value.js`, skipping `passthrough.js`.\r\n\r\n## What's Changed\r\n### New Features 🎉\r\n* feat(sri): support hashLoading: \"lazy\" in SubresourceIntegrityPlugin by @sd2k in https://github.com/web-infra-dev/rspack/pull/16374\r\n* feat: add output.environment.topLevelAwait and await async ESM entries by @hai-x in https://github.com/web-infra-dev/rspack/pull/16386\r\n* feat: support externals.byLayer by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16307\r\n* feat(css): Add opt-in runtime public paths for injected styles by @scttcper in https://github.com/web-infra-dev/rspack/pull/15705\r\n* feat: add experimental rule.as by @intellild in https://github.com/web-infra-dev/rspack/pull/15917\r\n* feat(tree-shaking): prune dynamic imports from unused exports by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15449\r\n* feat: skip side-effect-free `export *` passthrough modules by @hai-x in https://github.com/web-infra-dev/rspack/pull/16472\r\n### Performance 🚀\r\n* perf: use memchr SIMD scans and drop winnow by @intellild in https://github.com/web-infra-dev/rspack/pull/16424\r\n* perf(sources): box the replacement name by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15878\r\n* perf: lazily create existing loader dependency sets by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16449\r\n* perf: lazily materialize package.json metadata by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16469\r\n* perf(core): trim runtime spec sets on creation by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16478\r\n* perf(sources): share source map text with BytesStr by @SyMind in https://github.com/web-infra-dev/rspack/pull/16468\r\n* perf(core): free the previous compilation's assets during a rebuild by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16479\r\n* perf(sources): compact noSources maps only when retained by @SyMind in https://github.com/web-infra-dev/rspack/pull/16536\r\n* perf: reduce source map memory during asset generation and content hashing by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16470\r\n### Bug Fixes 🐞\r\n* fix(core): keep property access when inlining an export reached through a re-export by @flex-mookeun in https://github.com/web-infra-dev/rspack/pull/16310\r\n* fix(core): keep the full hash stable across rebuilds without HMR by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16280\r\n* fix(runtime): avoid coercion collisions in chunk ID matchers by @intellild in https://github.com/web-infra-dev/rspack/pull/16423\r\n* fix(devtool): map bootstrap and startup sources by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16426\r\n* fix: keep receiver exports for calls on unprovided members by @hai-x in https://github.com/web-infra-dev/rspack/pull/16418\r\n* fix: restore side-effect imports after package metadata changes by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16435\r\n* fix(cache): reuse completed builds for external and generated modules by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16429\r\n* fix(core): fold chunk hashes into the full hash in chunk id order by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16293\r\n* fix: keep initializers of unused top-level using declarations by @hai-x in https://github.com/web-infra-dev/rspack/pull/16437\r\n* fix(watcher): preserve concrete paths in native watcher events by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16411\r\n* fix(stats): report each runtime module's own size and chunks by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16076\r\n* fix(hmr): complete new entry chunk dependencies by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15955\r\n* fix: isolate entry declarations from runtime tables by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16497\r\n* fix: preserve module namespace key order for mixed exports by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16491\r\n* fix(watcher): separate filesystem accuracy from cache by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16512\r\n* fix(watcher): align rename events with watchpack by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16460\r\n* fix: skip cyclic star re-exports when resolving a binding by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16496\r\n* fix: preserve lone surrogates during constant evaluation by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16494\r\n* fix(watcher): pass SystemTime to mtime_accuracy by @hai-x in https://github.com/web-infra-dev/rspack/pull/16526\r\n* fix(resolver): support UTF-8 BOM in tsconfig files by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16518\r\n* fix: evaluate `x in ns` to true when `x` is a re-exported namespace by @hai-x in https://github.com/web-infra-dev/rspack/pull/16509\r\n* fix: preserve negative zero in exports and use JavaScript number strings in constant evaluation by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16527\r\n* fix(mf): keep the whole requiredVersion range in mf-manifest.json by @arnaud-zg in https://github.com/web-infra-dev/rspack/pull/16402\r\n* fix(core): distinguish fatal module errors from loader diagnostics by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16538\r\n* fix(css): scope counter styles and implicit grid lines by @intellild in https://github.com/web-infra-dev/rspack/pull/16520\r\n* fix(hmr): invalidate cached chunks when version tags change by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16548\r\n* fix(watcher): account for directory mtime accuracy by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16531\r\n* fix(mf): read provided shared fields directly in manifests by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16533\r\n* fix(resolver): report circular tsconfig extends instead of crashing by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16513\r\n* fix(hmr): load async groups through their last chunk by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16328\r\n* fix(resolver): reload PnP manifest from cached path by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16543\r\n### Refactor 🔨\r\n* refactor(binding): rely on napi-rs for module retention by @SyMind in https://github.com/web-infra-dev/rspack/pull/16431\r\n* refactor: remove unused exports_definitions hook from ConcatenatedModule by @hai-x in https://github.com/web-infra-dev/rspack/pull/16434\r\n* refactor(binding): implement module classes in JavaScript by @SyMind in https://github.com/web-infra-dev/rspack/pull/16436\r\n### Document 📖\r\n* docs: clarify split chunks sizing and cache group examples by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16409\r\n* docs: clarify split chunks counting and troubleshooting by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16412\r\n* docs: explain entry dependencies and shared runtime by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16413\r\n* docs: standardize Rspack runtime terminology by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16427\r\n* docs: clarify Lightning CSS minimizer options and examples by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16417\r\n* docs: add Nitro to community integrations by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16428\r\n* docs: introduce rspack-chain for configuration customization by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16430\r\n* docs: illustrate runtime chunk initialization by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16414\r\n* docs: add compilation dependency tracking examples by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16415\r\n* docs: add entrypoints manifest example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16416\r\n* docs: refresh Rspack and Rstack introduction by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16455\r\n* docs: clarify stats asset metadata by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16461\r\n* docs: redirect moved pages on Cloudflare Pages by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16465\r\n* docs(website): simplify Rspress configuration by @SoonIter in https://github.com/web-infra-dev/rspack/pull/16522\r\n* docs: expand community plugin list by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16524\r\n* docs: expand community loader list by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16528\r\n* docs: clarify chunk ID assignment when chunkIds is false by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16523\r\n* docs: use a WebMCP prompt in the Rspack 2.3 announcement by @SoonIter in https://github.com/web-infra-dev/rspack/pull/16553\r\n### Other Changes\r\n* test(cache): validate persistent cache hits in config and normal cases by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16397\r\n* test: exclude external re-export case from cache reuse checks by @SyMind in https://github.com/web-infra-dev/rspack/pull/16425\r\n* ci: use trunk baseline for branch-based PR stacks by @ScriptedAlchemy in https://github.com/web-infra-dev/rspack/pull/16201\r\n* chore(deps): update napi by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16230\r\n* chore(deps): update dependency tiny-emitter to v2.1.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16440\r\n* test: exclude container tree shaking for configCases cache test by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16450\r\n* chore(deps): upgrade SWC crates and browserslist-rs by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16458\r\n* chore(deps): update dependency rsbuild-plugin-google-analytics to v1.1.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16438\r\n* chore(deps): update dependency coffee-loader to v5 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16441\r\n* chore(deps): update patch npm dependencies by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16476\r\n* chore(deps): update dependency mermaid to ^12.3.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16480\r\n* chore: use Rspress built-in Shiki transformers by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16489\r\n* chore(deps): update dependency playwright to v1.65.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16481\r\n* chore(ci): use mini runner for ecosystem ci dispatcher by @stormslowly in https://github.com/web-infra-dev/rspack/pull/14471\r\n* test(watcher): stabilize nested context removal case by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16519\r\n* chore(deps): update Rslib to 1.0.6 by @SoonIter in https://github.com/web-infra-dev/rspack/pull/16471\r\n* chore(deps): update dependency sass-loader to ^17.1.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16498\r\n* chore(deps): update rust crate tokio to 1.54.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16502\r\n* chore(deps): update dependency jsdom to v31 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16504\r\n* chore(deps): bump swc-next to 0.6.1 by @CPunisher in https://github.com/web-infra-dev/rspack/pull/16525\r\n* chore: bump `swc_core` from 84.0.1 to 84.0.2 by @CPunisher in https://github.com/web-infra-dev/rspack/pull/16547\r\n* test(stats): cover shared issuers in child compilations by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16456\r\n* chore(deps): update dependency execa to v10 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16503\r\n* test: wait for both watchers to finish the initial batch in rename cases by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16530\r\n* test(watcher): validate burst aggregation against event timing by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16544\r\n* test: stabilize cache restoration watch test by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16555\r\n\r\n## New Contributors\r\n* @sd2k made their first contribution in https://github.com/web-infra-dev/rspack/pull/16374\r\n* @scttcper made their first contribution in https://github.com/web-infra-dev/rspack/pull/15705\r\n* @arnaud-zg made their first contribution in https://github.com/web-infra-dev/rspack/pull/16402\r\n\r\n**Full Changelog**: https://github.com/web-infra-dev/rspack/compare/v2.3.1...v2.3.2\r\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":17}
