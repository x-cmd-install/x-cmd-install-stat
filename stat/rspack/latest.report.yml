{"id":384578804,"author":{"login":"SyMind","id":19852293,"node_id":"MDQ6VXNlcjE5ODUyMjkz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4W7DT0","tag_name":"v2.2.3","target_commitish":"main","name":"v2.2.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-08T08:42:57Z","updated_at":"2026-09-08T09:10:07Z","published_at":"2026-09-08T09:10:07Z","assets":[],"body":"## Highlights\r\n\r\n### CSS Import and Asset URL Externals\r\n\r\nRspack now supports `asset`, `asset-url`, and `css-import` external types, allowing CSS to reference stylesheets and assets hosted elsewhere. External `@import` statements preserve `layer`, `supports`, and media conditions, so conditional styles stay conditional in the emitted CSS. [#15431](https://github.com/web-infra-dev/rspack/pull/15431), [#15522](https://github.com/web-infra-dev/rspack/pull/15522).\r\n\r\n### More Flexible and Reliable Native Watching\r\n\r\nWith `experiments.nativeWatcher` enabled, `watchOptions.ignored` now accepts a function, making it easier to reuse existing ignore rules when switching to the native watcher. File event processing has also been improved to reduce event loss during large bursts of changes on Linux. [#15254](https://github.com/web-infra-dev/rspack/pull/15254).\r\n\r\n### Lower Resolution Overhead for TypeScript Projects\r\n\r\nRelative imports such as `./utils` and `../shared` no longer trigger unnecessary tsconfig loading or tracking of its project-reference tree. This reduces configuration reads and dependency tracking, especially in large TypeScript projects with many project references. [#15492](https://github.com/web-infra-dev/rspack/pull/15492).\r\n\r\n## What's Changed\r\n\r\n### New Features \ud83c\udf89\r\n\r\n* feat(cache): align maxMemoryGenerations with webpack by @hardfist in https://github.com/web-infra-dev/rspack/pull/15430\r\n* feat(cache): support builtin swc-loader cache by @intellild in https://github.com/web-infra-dev/rspack/pull/15324\r\n* feat(watcher): support a function for the native watcher `ignored` option by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15254\r\n* feat(core): expose import attributes on NormalModuleFactory ResolveData by @kakiuwang-ui in https://github.com/web-infra-dev/rspack/pull/15439\r\n* feat(cache): port webpack persistent module cache by @hardfist in https://github.com/web-infra-dev/rspack/pull/15380\r\n* feat(css): support CSS import and asset URL externals by @intellild in https://github.com/web-infra-dev/rspack/pull/15431\r\n* feat: error handling for new cache by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/15525\r\n\r\n### Performance \ud83d\ude80\r\n\r\n* perf(resolver): skip tsconfig paths for relative specifiers by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15492\r\n* perf(cache): remove module serialization preflight by @hardfist in https://github.com/web-infra-dev/rspack/pull/15509\r\n\r\n### Bug Fixes \ud83d\udc1e\r\n\r\n* fix: treat CJS export assignment as side-effect-free without breaking innerGraph by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/14623\r\n* fix(ci): speed up dylint and fail on warnings by @SyMind in https://github.com/web-infra-dev/rspack/pull/15376\r\n* fix: preserve leading zeros in string module ids by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15428\r\n* fix(devtool): key eval cache by module to keep sourceURL correct by @stormslowly in https://github.com/web-infra-dev/rspack/pull/14866\r\n* fix(types): improve loader context filesystem types by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15437\r\n* fix(types): allow optionless filesystem sync calls by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15438\r\n* fix(javascript): handle shared URL asset runtimes by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15446\r\n* fix(copy-plugin): reuse cache for empty rebuilds by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15448\r\n* fix(esm): remove empty chunks except for facade chunks by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15424\r\n* fix(binding): guard module graph accessors against stale and mid-pass reads by @kakiuwang-ui in https://github.com/web-infra-dev/rspack/pull/15454\r\n* fix: stabilize incremental missing-module diagnostic location by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15456\r\n* fix: prevent recursive module federation shared compilation by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15494\r\n* fix: preserve diagnostics returned by importModule by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15496\r\n* fix: preserve css-import external conditions by @intellild in https://github.com/web-infra-dev/rspack/pull/15522\r\n* fix: support Windows DOS device paths by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15507\r\n* fix(css): substitute value references in media queries and selectors by @intellild in https://github.com/web-infra-dev/rspack/pull/15523\r\n* fix(css): skip esm flag for concatenated modules by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15539\r\n* fix(ids): stabilize named external module ids by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15540\r\n* fix: pre-register modules before chunk graph splitting by @mvanhorn in https://github.com/web-infra-dev/rspack/pull/15308\r\n\r\n### Refactor \ud83d\udd28\r\n\r\n* refactor(javascript): internalize side effects analysis by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15436\r\n* refactor: share concatenation backend logic by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15419\r\n* refactor: avoid store and restore channel blocking by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/15425\r\n* refactor(javascript): use Rspack-owned atoms by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15441\r\n* refactor(core): use DependencyRef in BuildResult by @hardfist in https://github.com/web-infra-dev/rspack/pull/15457\r\n* refactor(core): remove unnecessary DynClone from codegen data by @hardfist in https://github.com/web-infra-dev/rspack/pull/15489\r\n* refactor: remove redundant clones in core and JSON by @hardfist in https://github.com/web-infra-dev/rspack/pull/15502\r\n* refactor: remove unused Clone derives in core by @hardfist in https://github.com/web-infra-dev/rspack/pull/15508\r\n* refactor(core): share published async dependency blocks by @hardfist in https://github.com/web-infra-dev/rspack/pull/15504\r\n* refactor: remove redundant clones in core by @hardfist in https://github.com/web-infra-dev/rspack/pull/15518\r\n* refactor: remove redundant clones and unused Clone derives by @hardfist in https://github.com/web-infra-dev/rspack/pull/15519\r\n\r\n### Document \ud83d\udcd6\r\n\r\n* docs: add Rstest testing guide by @9aoy in https://github.com/web-infra-dev/rspack/pull/15415\r\n* docs: reorganize guide navigation by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15422\r\n* docs: refine guide navigation by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15423\r\n* docs: correct collection types in API docs by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15429\r\n\r\n### Other Changes\r\n\r\n* chore(deps): update rstack to v0.7.1 by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15416\r\n* chore: support single-target preview releases by @hardfist in https://github.com/web-infra-dev/rspack/pull/15434\r\n* test: cover isolated declarations across persistent cache modes by @intellild in https://github.com/web-infra-dev/rspack/pull/15444\r\n* chore: bump `swc_core` from 77.0.0 to 77.1.2 by @tusharsingh308 in https://github.com/web-infra-dev/rspack/pull/15421\r\n* chore(deps): upgrade Rslib to 1.0.0 by @Timeless0911 in https://github.com/web-infra-dev/rspack/pull/15447\r\n* chore: add Rspack API assessment skill by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15470\r\n* chore(ci): skip builds for tooling-only changes by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15472\r\n* chore: upgrade Rstack to v0.7.3 and simplify Rspress config by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15473\r\n* chore(deps): update dependency terser to v5.51.2 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15479\r\n* chore(deps): update dependency path-serializer to v0.7.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15478\r\n* chore(deps): update dependency memfs to v4.69.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15477\r\n* chore(deps): update dependency happy-dom to ^20.14.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15476\r\n* chore(deps): update dependency cspell to ^10.2.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15475\r\n* chore(deps): update dependency happy-dom to ^20.14.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15482\r\n* chore(deps): update pnpm to v11.25.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15481\r\n* chore(deps): update patch npm dependencies by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15474\r\n* chore(ci): remove unused workflow inputs by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15499\r\n* chore: run build-only CI targets on main by @hardfist in https://github.com/web-infra-dev/rspack/pull/15510\r\n* chore: document Rust Clone requirements by @hardfist in https://github.com/web-infra-dev/rspack/pull/15511\r\n* chore(ci): enable workflows for release/2.3.0 by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15542\r\n\r\n**Full Changelog**: https://github.com/web-infra-dev/rspack/compare/v2.2.2...v2.2.3\r\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"