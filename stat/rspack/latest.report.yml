{"id":448336398,"author":{"login":"stormslowly","id":415655,"node_id":"MDQ6VXNlcjQxNTY1NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4auRIO","tag_name":"v2.3.3","target_commitish":"main","name":"v2.3.3","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-17T08:22:53Z","updated_at":"2026-11-17T09:26:11Z","published_at":"2026-11-17T09:26:11Z","assets":[],"body":"## Highlights\r\n\r\n### Breaking change: webpack-compatible HTTP lockfiles\r\n\r\nHTTP module lockfiles and content cache filenames now match webpack, allowing existing webpack lockfiles and cached resources to be reused together. The previous Rspack format is no longer supported: delete the old HTTP lockfile and content cache, rebuild with `experiments.buildHttp.frozen: false`, then review and commit the regenerated files before re-enabling frozen builds. See [#16656](https://github.com/web-infra-dev/rspack/pull/16656).\r\n\r\n### Better tree shaking for dynamic imports\r\n\r\nRspack now tracks member usage through destructured dynamic-import namespaces, allowing unused nested exports to be removed more precisely. This covers awaited imports, destructured `.then()` parameters, and `Promise.all()` results. See [#16574](https://github.com/web-infra-dev/rspack/pull/16574).\r\n\r\n### Faster HMR-enabled builds with repeated dynamic imports\r\n\r\nProjects with many `import()` expressions targeting the same module avoid repeated chunk-group scans during HMR-enabled compilation. Rspack now caches loading-chunk lookups and reuses sibling chunk lists, addressing a compilation bottleneck that grew rapidly with the number of imports. See [#16674](https://github.com/web-infra-dev/rspack/pull/16674).\r\n\r\n### Shared loader cache across compilers\r\n\r\nRspack now shares loader cache results between compilers in the same process. For example, in an SSR build, the client and server compilers can reuse loader transformations for shared source files, avoiding repeated work. Compilers can share results when using memory cache or the same persistent cache directory. See [#16558](https://github.com/web-infra-dev/rspack/pull/16558).\r\n\r\n## What's Changed\r\n### Breaking Changes 🍭\r\n* fix!: align HTTP module lockfiles with webpack by @SyMind in https://github.com/web-infra-dev/rspack/pull/16656\r\n### New Features 🎉\r\n* feat(ids): support salt for deterministic chunk and compact-hashed ids by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16537\r\n* feat(tree-shaking): narrow destructured dynamic import namespaces by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16574\r\n* feat(externals): support interop hints for object externals by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16529\r\n### Performance 🚀\r\n* perf(limit-chunk-count): keep chunk combinations in an ordered set by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16466\r\n* perf: reduce chunk filename runtime size by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16598\r\n* perf: reduce dynamic chunk filename runtime size by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16602\r\n* perf(core): avoid serializing hook register arrays by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16628\r\n* perf(stats): avoid splitting loader chains when grouping modules by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16631\r\n* perf(stats): reuse split error details when truncating output by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16632\r\n* perf(stats): count diagnostic details without intermediate arrays by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16630\r\n* perf(core): lazily cache log type bit flags by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16629\r\n* perf(core): streamline runtime global reverse mapping by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16634\r\n* perf(stats): avoid splitting hierarchical hook names by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16635\r\n* perf(sri): avoid unnecessary path separator conversions by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16636\r\n* perf(sri): avoid allocating hash match results by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16637\r\n* perf(sri): avoid copying asset keys before lookup by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16638\r\n* perf(core): avoid splitting stacks to remove loader frames by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16642\r\n* perf(stats): collect printable contents in one pass by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16643\r\n* perf(hmr): avoid cubic HMR loading chunk resolution by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16674\r\n### Bug Fixes 🐞\r\n* fix: isolate module build cache sessions by graph by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16540\r\n* fix(resolver): respect tsconfig extends array precedence by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16554\r\n* fix(split-chunks): prune source types below minSizeReduction by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16573\r\n* fix: preserve Rule.as path delimiters and portable resources by @intellild in https://github.com/web-infra-dev/rspack/pull/16551\r\n* fix: initialize build-time runtime globals in both runtime modes by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16577\r\n* fix(cache): serialize shared consumption dependencies by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16561\r\n* fix(cache): filter source map assets before lookup by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16562\r\n* fix(cache): normalize context resource dependency paths by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16563\r\n* fix(cache): reuse restored remote modules by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16565\r\n* fix(lazy-compilation): reject imports after HMR failure by @ScriptedAlchemy in https://github.com/web-infra-dev/rspack/pull/15947\r\n* fix(ci): preserve clang during Linux disk cleanup by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16588\r\n* fix: mark modules with a top-level await using as async by @hai-x in https://github.com/web-infra-dev/rspack/pull/16442\r\n* fix(split-chunks): keep named groups that narrowing would remove by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16487\r\n* fix: handle HTTP module response stream errors by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16233\r\n* fix(sri): carry lazy hashes in the chunk that makes the import() call by @sd2k in https://github.com/web-infra-dev/rspack/pull/16420\r\n* fix(css-extract): find stylesheets whose filename has a query by @ebidel in https://github.com/web-infra-dev/rspack/pull/16346\r\n* fix(cache): track DefinePlugin definition keys by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16589\r\n* fix(tree-shaking): avoid receivers for destructured dynamic import calls by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16593\r\n* fix: preserve target major versions above 255 by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16601\r\n* fix(cache): reuse loader output after a caught import cycle by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16583\r\n* fix(cache): snapshot invalid Windows missing paths by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16584\r\n* fix(cache): share loader cache across modes and SSR compilers by @intellild in https://github.com/web-infra-dev/rspack/pull/16558\r\n* fix: finalize finishMake module rebuilds and artifacts by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16580\r\n* fix: resolve import() of self-accepting modules to their latest evaluation by @hai-x in https://github.com/web-infra-dev/rspack/pull/16595\r\n* fix(cache): cache module-not-found resolution results by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16560\r\n* fix(javascript): preserve outer ASI boundaries across nested statements by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16613\r\n* fix: annotate pure module initializers in ESM output by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/16605\r\n* fix(cache): keep lazy barrel state per compilation by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16609\r\n* fix: cache extracted CSS modules with fresh input validation by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16618\r\n* fix: count reused metadata for empty child compilers by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16620\r\n* fix(cache): include loader configuration and versions in etags by @intellild in https://github.com/web-infra-dev/rspack/pull/16591\r\n* fix(tree-shaking): resolve CommonJS default re-export to module.exports by @hai-x in https://github.com/web-infra-dev/rspack/pull/16639\r\n* fix(binding): preserve normal module createData context by @SyMind in https://github.com/web-infra-dev/rspack/pull/16657\r\n* fix(javascript): keep shorthand property keys when replacing identifiers by @hai-x in https://github.com/web-infra-dev/rspack/pull/16627\r\n* fix(css): respect devtool for embedded source maps by @intellild in https://github.com/web-infra-dev/rspack/pull/16655\r\n* fix(css): omit unused JavaScript modules for CSS URL assets by @intellild in https://github.com/web-infra-dev/rspack/pull/16654\r\n* fix(swc-loader): migrate box patterns to deref patterns by @intellild in https://github.com/web-infra-dev/rspack/pull/16667\r\n* fix(cache): invalidate newCache when configured build dependencies change by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16660\r\n* fix(core): preserve factorization metadata for reused entries by @SyMind in https://github.com/web-infra-dev/rspack/pull/16668\r\n* fix(resolver): make preferAbsolute try the absolute path first by @cezaraugusto in https://github.com/web-infra-dev/rspack/pull/16617\r\n* fix(core): clean up loader error stacks by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16641\r\n### Refactor 🔨\r\n* refactor(hmr): use the chunk content hash as its hmr version by @hai-x in https://github.com/web-infra-dev/rspack/pull/16585\r\n* refactor(core): simplify property checks and iteration by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16644\r\n### Document 📖\r\n* docs: clarify module rule as usage by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16564\r\n* docs: add MDX example for reusing compilation rules by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16570\r\n* docs: clarify rule as asset minification behavior by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16572\r\n* docs: enable ESM output for website by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16600\r\n* docs: fix the default devtool module filename templates by @ragib-mrb in https://github.com/web-infra-dev/rspack/pull/16658\r\n* docs(resolver): exclude allocative from docs.rs features by @intellild in https://github.com/web-infra-dev/rspack/pull/16669\r\n### Other Changes\r\n* test(cache): run cache checks before fixture cleanup by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16566\r\n* chore(deps): update dependency table to v6.10.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16499\r\n* chore(deps): update dependency webpack-sources to v3.7.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16500\r\n* chore(deps): update rust crate html-escape to 0.3.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16501\r\n* test: wait for activation instead of a fixed delay in hot cases by @hai-x in https://github.com/web-infra-dev/rspack/pull/16596\r\n* chore(deps): update patch npm dependencies by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16606\r\n* chore(deps): update patch crates by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16369\r\n* chore(deps): update dependency enhanced-resolve to v5.27.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16611\r\n* chore(deps): update dependency commander to v15.1.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16610\r\n* chore(deps): update swc by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/16607\r\n* test(cli): propagate watch startup errors by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16541\r\n* test: expand persistent cache compatibility coverage by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16614\r\n* test: include cached assets in filename assertions by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16619\r\n* test: await child compilation in config fixtures by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16621\r\n* test: validate circular warnings cache reuse separately from errors by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16623\r\n* test: mark compilation-mutating loader as non-cacheable by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16624\r\n* test: validate issuer stats across persistent cache builds by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/16625\r\n* ci(windows): fix flaky proc-macro DLL load via read-after-link by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16648\r\n* chore(deps): update swc-next to 0.7.0 by @CPunisher in https://github.com/web-infra-dev/rspack/pull/16650\r\n\r\n## New Contributors\r\n* @ebidel made their first contribution in https://github.com/web-infra-dev/rspack/pull/16346\r\n* @ragib-mrb made their first contribution in https://github.com/web-infra-dev/rspack/pull/16658\r\n\r\n**Full Changelog**: https://github.com/web-infra-dev/rspack/compare/v2.3.2...v2.3.3\r\n","reactions":{"total_count":5,"+1":3,"-1":0,