{"id":398347420,"author":{"login":"JSerFeng","id":57202839,"node_id":"MDQ6VXNlcjU3MjAyODM5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4Xvkyc","tag_name":"v2.2.8","target_commitish":"main","name":"v2.2.8","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-28T14:33:13Z","updated_at":"2026-09-28T14:55:37Z","published_at":"2026-09-28T14:55:37Z","assets":[],"body":"\r\n## What's Changed\r\n### New Features \ud83c\udf89\r\n* feat: support JavaScript URL entries with factory type probes by @intellild in https://github.com/web-infra-dev/rspack/pull/15666\r\n* feat: resolver cache in the new cache system by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/15839\r\n### Performance \ud83d\ude80\r\n* perf(core): box optional match resource data by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15831\r\n* perf: reduce exports info and parser memory footprint by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15821\r\n* perf(core): box optional RSC metadata by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15837\r\n* perf(concatenated): store binding references as indices by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15834\r\n* perf: reuse compilation dependency arrays and strings by @SyMind in https://github.com/web-infra-dev/rspack/pull/15763\r\n* perf(core): box import attributes by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15844\r\n* perf(core): shrink dependency location storage by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15849\r\n* perf(core): store module requests as boxed strings by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15856\r\n* perf: reduce retained dependency and source capacity by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15854\r\n* perf(javascript): share the used-by-exports payload of a dependency by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15851\r\n* perf: skip unused code splitting cache copies by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15867\r\n* perf(stats): release handles per module while converting stats to JS by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15788\r\n### Bug Fixes \ud83d\udc1e\r\n* fix(types): allow void context module waterfall callbacks by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15832\r\n* fix: revert \"feat: support JavaScript URL entries with factory type probes\" by @intellild in https://github.com/web-infra-dev/rspack/pull/15840\r\n* fix: preserve deferred evaluation in modern-module output by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15846\r\n* fix(resolve): resolve relative tsconfig paths against cwd by @intellild in https://github.com/web-infra-dev/rspack/pull/15713\r\n* fix(rstest): resolve mock APIs through the runtime registry by @9aoy in https://github.com/web-infra-dev/rspack/pull/15823\r\n* fix: interrupt compaction at cache shutdown by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/15850\r\n* fix(types): make SharePlugin enhanced option optional by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15855\r\n* fix(types): align externals function signatures by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15857\r\n* fix(types): correct externals resolver overloads by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15863\r\n* fix: reset MultiCompiler done state on watch restart by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15865\r\n* fix(types): allow unnamed module federation consumers by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15868\r\n* fix: require a name for shared dependency tree shaking by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15872\r\n* fix(types): allow stats printer hooks to return void by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15874\r\n* fix(types): support custom stats fields in extract hooks by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15880\r\n* fix(types): allow shouldEmit hooks to return void by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15881\r\n* fix(types): allow Node fs as intermediate file system by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15895\r\n* fix(types): accept entry dependencies in ModuleGraph queries by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15896\r\n* fix(cli): enable compile cache before loading CLI by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15903\r\n* fix: respect CI=false and skip compile cache in CI by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15904\r\n* fix(rstest): transform non-hoisted mock APIs in expression position by @fi3ework in https://github.com/web-infra-dev/rspack/pull/15877\r\n* fix: avoid retaining source copies in RealContentHash by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15902\r\n* fix(loader): avoid mutating lightningcss-loader options by @tiagovilasboas in https://github.com/web-infra-dev/rspack/pull/15900\r\n* fix(loader): normalize builtin options for inline requests by @SoonIter in https://github.com/web-infra-dev/rspack/pull/15909\r\n### Document \ud83d\udcd6\r\n* docs: clarify externals usage and consolidate function reference by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15866\r\n### Other Changes\r\n* chore(deps): upgrade Rstack to 0.8.0 by @SoonIter in https://github.com/web-infra-dev/rspack/pull/15838\r\n* chore(test): migrate 60 more configs to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15836\r\n* test: migrate 47 more configs to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15843\r\n* chore(test): migrate 20 cache and callback configs to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15852\r\n* chore(deps): update dependency memfs to v4.79.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15891\r\n* chore(deps): update rust crate swc_ecma_minifier to 61.0.9 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15890\r\n* chore(deps): update patch npm dependencies by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15889\r\n* chore(deps): update dependency webpack-sources to v3.5.3 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15888\r\n* test: migrate HTTP integrity configuration to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15892\r\n* test: migrate five configurations to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15893\r\n\r\n## New Contributors\r\n* @tiagovilasboas made their first contribution in https://github.com/web-infra-dev/rspack/pull/15900\r\n\r\n**Full Changelog**: https://github.com/web-infra-dev/rspack/compare/v2.2.7...v2.2.8\r\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":12}
