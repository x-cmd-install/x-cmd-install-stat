{"id":390653846,"author":{"login":"intellild","id":8379858,"node_id":"MDQ6VXNlcjgzNzk4NTg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4XSOeW","tag_name":"v2.2.6","target_commitish":"main","name":"v2.2.6","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-17T11:10:33Z","updated_at":"2026-09-17T11:25:48Z","published_at":"2026-09-17T11:25:48Z","assets":[],"body":"## What's Changed\r\n\r\n### New Features \ud83c\udf89\r\n\r\n* feat(loader): support buildInfo custom fields in parallel loaders by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15629\r\n\r\n### Performance \ud83d\ude80\r\n\r\n* perf: streamline SplitChunks candidate preparation by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15691\r\n* perf(loader): track loader dependencies with sets by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15659\r\n* perf(watch): defer internal Watchpack timestamp collection by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15686\r\n* perf: replace BigUint with FixedBitSet in code splitter by @SyMind in https://github.com/web-infra-dev/rspack/pull/15712\r\n* perf: use SsoHashSet for small module chunk memberships by @SyMind in https://github.com/web-infra-dev/rspack/pull/15731\r\n* perf: vectorize CSS string and URL scanning with memchr by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15738\r\n\r\n### Bug Fixes \ud83d\udc1e\r\n\r\n* fix: retain mf manifest expose assets shared with providers by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15700\r\n* fix(core): make module source maps context independent by @SyMind in https://github.com/web-infra-dev/rspack/pull/15671\r\n* fix(loader): revert native loader hook invocation by @intellild in https://github.com/web-infra-dev/rspack/pull/15719\r\n\r\n### Document \ud83d\udcd6\r\n\r\n* docs: update hyfdev profile links by @hyfdev-agent in https://github.com/web-infra-dev/rspack/pull/15729\r\n\r\n### Other Changes\r\n\r\n* test: make @rspack/test-tools a dual package by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15698\r\n* test: migrate basic test entry points to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15701\r\n* test: migrate config, compiler, HMR and cache entries to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15703\r\n* test: migrate watcher test entries to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15706\r\n* test: migrate lifecycle child scripts to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15707\r\n* test: migrate request rewrite E2E loaders to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15708\r\n* test: migrate recovery and CSS HMR loaders to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15709\r\n* test: support ESM test configs and migrate initial fixtures by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15714\r\n* chore(build): enable rspack runtime mode for rslib builds by @Timeless0911 in https://github.com/web-infra-dev/rspack/pull/15715\r\n* test: remove obsolete webpack config support by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15716\r\n* test: migrate standalone suite configs to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15721\r\n* test: migrate asset, loader and hook configs to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15722\r\n* test: migrate remaining test configs to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15724\r\n* test: migrate test configs and filters to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15725\r\n* test: migrate expectation files to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15726\r\n* test: migrate test definitions to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15727\r\n* test: enable supported cases and capture ESM HMR snapshots by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15732\r\n* chore: exclude test outputs from JavaScript language service by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15733\r\n* test: use rspack.sources in test cases by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15734\r\n* test: migrate remaining test configs and common helpers to ESM by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15739\r\n* ci: migrate CodSpeed simulation runner by @hardfist in https://github.com/web-infra-dev/rspack/pull/15710\r\n\r\n## New Contributors\r\n* @hyfdev-agent made their first contribution in https://github.com/web-infra-dev/rspack/pull/15729\r\n\r\n**Full Changelog**: https://github.com/web-infra-dev/rspack/compare/v2.2.5...v2.2.6\r\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":9}
