{"id":411433805,"author":{"login":"intellild","id":8379858,"node_id":"MDQ6VXNlcjgzNzk4NTg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOHGj9Ks4YhftN","tag_name":"v2.2.9","target_commitish":"54ce0512472b321c6813b064e25d31a24bca2c3b","name":"v2.2.9","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-13T07:43:47Z","updated_at":"2026-10-13T08:50:05Z","published_at":"2026-10-13T08:50:05Z","assets":[],"body":"## Highlights\r\n\r\n### Less duplicate code. Smaller bundles. \ud83d\udce6\r\n\r\nRspack's chunking algorithm has been improved to reduce duplicate modules across chunks. ([#15885](https://github.com/web-infra-dev/rspack/pull/15885))\r\n\r\nhttps://github.com/user-attachments/assets/0840ec5b-7eea-4d37-9053-cc5cef176103\r\n\r\n\r\n### Smaller package size\r\n\r\nRspack upgrades `browserslist-rs` and enables deflate compression for its browser data,  reducing native binary by **2.13 MB (3.08%)**.  ([#16009](https://github.com/web-infra-dev/rspack/pull/16009#issuecomment-6053872498))\r\n\r\n\r\n## What's Changed\r\n### New Features \ud83c\udf89\r\n* feat: propagate available module growth during code splitting by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15885\r\n### Performance \ud83d\ude80\r\n* perf(binding): query compilation modules lazily by @SyMind in https://github.com/web-infra-dev/rspack/pull/15906\r\n* perf: avoid transferring unused NormalModuleFactory dependencies by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/15931\r\n* perf(sources): compact retained source storage by @SyMind in https://github.com/web-infra-dev/rspack/pull/15944\r\n* perf(stats): cache item type strings in StatsFactory by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15779\r\n* perf: use a hash set to deduplicate extracted comments by @CoderSerio in https://github.com/web-infra-dev/rspack/pull/15967\r\n* perf(watcher): avoid per-node concurrent sets in the root analyzer by @guru-irl in https://github.com/web-infra-dev/rspack/pull/15965\r\n* perf: share Module and KnownBuildInfo accessors by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15883\r\n* perf: optimize placeholder and Node external matching by @intellild in https://github.com/web-infra-dev/rspack/pull/15808\r\n* perf(sources): profile allocations and trim source map capacity by @SyMind in https://github.com/web-infra-dev/rspack/pull/16014\r\n* perf(sources): release generated value after static source map by @SyMind in https://github.com/web-infra-dev/rspack/pull/16022\r\n* perf(core): cache assetEmitted source and content per info object by @guru-irl in https://github.com/web-infra-dev/rspack/pull/15963\r\n* perf(binding): share NormalModule accessors by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16039\r\n* perf: share equal factorize path lists by content by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16036\r\n* perf(split-chunks): reuse function chunks filter results per chunk set by @guru-irl in https://github.com/web-infra-dev/rspack/pull/15964\r\n* perf(binding): materialize module source maps lazily by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/15882\r\n* perf: share compilation log entry accessors by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16052\r\n* perf(cache): restore cached modules off the make main task by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16050\r\n* perf(core): share file counter dependency lists by interned content by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16043\r\n### Bug Fixes \ud83d\udc1e\r\n* fix(types): allow void returns in needAdditionalPass hooks by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15908\r\n* fix(types): accept falsy loaders and child compiler plugins by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15912\r\n* fix(types): allow single loader returns from rule use functions by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15920\r\n* fix: preserve interned path sharing in cache serialize by @ahabhgk in https://github.com/web-infra-dev/rspack/pull/15910\r\n* fix(types): correct Compilation.getAsset return type by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15932\r\n* fix(binding): scope importModule publicPath callbacks to compiler by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15928\r\n* fix(binding): release transient TSFN callbacks by @SyMind in https://github.com/web-infra-dev/rspack/pull/15938\r\n* fix(types): allow omitting child compiler plugins by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15948\r\n* fix(css): load async stylesheets with a shared runtime by @intellild in https://github.com/web-infra-dev/rspack/pull/15869\r\n* fix(deps): upgrade lightningcss to 1.0.0-alpha.72 by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15991\r\n* fix: propagate async status through lazy barrel re-exports by @dmchoi77 in https://github.com/web-infra-dev/rspack/pull/15905\r\n* fix(copy): register a missing glob base dir as a missing dependency by @BleedingDev in https://github.com/web-infra-dev/rspack/pull/15901\r\n* fix(css): end unterminated url() at EOF as a url token by @IShinji in https://github.com/web-infra-dev/rspack/pull/15911\r\n* fix: preserve statement boundaries in modern-module output by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16008\r\n* fix(ids): rehash identical keys in compact-hashed ids by @n0th1ng-else in https://github.com/web-infra-dev/rspack/pull/15915\r\n* fix(deps): upgrade swc_core to 82.0.0 by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16009\r\n* fix: resolve aliases in import.meta.glob patterns by @aryan1306 in https://github.com/web-infra-dev/rspack/pull/15898\r\n* fix: only source map JS and CSS assets from devtool, matching webpack by @Paca-Vaca in https://github.com/web-infra-dev/rspack/pull/16018\r\n* fix: support deferred imports introduced by hot updates by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16015\r\n* fix: concatenate empty CommonJS modules without export access by @JSerFeng in https://github.com/web-infra-dev/rspack/pull/15913\r\n* fix(core): ignore source map directives in JavaScript strings by @Tiancheng-Xu in https://github.com/web-infra-dev/rspack/pull/15969\r\n* fix(css-extract): preserve relative paths from publicPath callbacks by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15923\r\n* fix(lazy-compilation): keep import attributes and phase when building activated modules by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16023\r\n* fix(lazy-compilation): keep activated modules across rebuilds by @stormslowly in https://github.com/web-infra-dev/rspack/pull/15134\r\n* fix(lazy-compilation): keep issuer and resolve options when building activated modules by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16024\r\n* fix(watcher): report watched files inside directories that appear by @guru-irl in https://github.com/web-infra-dev/rspack/pull/15966\r\n* fix(mf): honor singleton options for shared prefixes in manifests by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16012\r\n* fix(watcher): report recreated files by their final state by @guru-irl in https://github.com/web-infra-dev/rspack/pull/16040\r\n* fix: preserve pure exports during module concatenation by @LingyuCoder in https://github.com/web-infra-dev/rspack/pull/16053\r\n* fix(resolver): keep RegExp restrictions in ResolverFactory cache key by @stormslowly in https://github.com/web-infra-dev/rspack/pull/16054\r\n### Document \ud83d\udcd6\r\n* docs: use synchronous tap in getStats example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15981\r\n* docs: fix CopyRspackPlugin patterns example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15982\r\n* docs: mark asynchronous compiler hook callbacks async by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15983\r\n* docs: fix asset name in processAssets example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15985\r\n* docs: avoid duplicate declarations in resolver example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15987\r\n* docs: use supported compilation hooks in examples by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15984\r\n* docs: clarify source map asset filtering by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15990\r\n* docs: define RuntimeGlobals in addRuntimeModule example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15986\r\n* docs: register run examples on the run hook by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15989\r\n* docs: await module rebuilds in finishModules example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15988\r\n* docs: clarify emitAsset filename conflicts by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15992\r\n* docs: fix statsNormalize option assignment by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15994\r\n* docs: document compilation hook factory parameters by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15998\r\n* docs: document ignoring requests in afterResolve by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16001\r\n* docs: call the runtime hash getter in example by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15996\r\n* docs: clarify compilation hash properties by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15995\r\n* docs: document compile hook parameters by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15997\r\n* docs: document resolveForScheme hook map and return value by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16000\r\n* docs: correct statsPreset hook map type by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15999\r\n* docs: clarify child compiler inheritance by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15993\r\n* docs: improve page descriptions for documentation discovery by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16004\r\n* docs: clarify target defaults and Lightning CSS inheritance by @intellild in https://github.com/web-infra-dev/rspack/pull/15546\r\n* docs: add RomeOS to homepage users by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16056\r\n* docs: document SWC loader reactCompiler option by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16060\r\n* docs: clarify Rspack-specific SWC loader options by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16062\r\n* docs: fix missing imports and variables in config examples by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16063\r\n* docs: fix SWC examples and simplify isolatedModules guidance by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/16064\r\n### Other Changes\r\n* test: migrate more configurations to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15919\r\n* test: migrate nine more configurations to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15925\r\n* test: migrate persistent caching example to TypeScript by @chenjiahan in https://github.com/web-infra-dev/rspack/pull/15937\r\n* chore(deps): update rust crate swc_config to 6.0.1 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15954\r\n* chore(deps): update dependency @shikijs/transformers to ^4.5.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15956\r\n* chore(deps): update dependency enhanced-resolve to v5.26.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15957\r\n* chore(deps): update dependency memfs to v4.80.0 by @renovate[bot] in https://github.com/web-infra-dev/rspack/pull/15958\r\n* chore(deps): update patch npm dependencies by @r