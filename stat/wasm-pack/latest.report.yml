:"2026-10-30T05:42:34Z","updated_at":"2026-10-30T05:42:35Z"},{"id":691077542,"node_id":"RA_kwDOBzovgs4pMQGm","name":"wasm-pack-v0.15.1-aarch64-pc-windows-msvc.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2209772,"digest":"sha256:ea0d7da57b84fe256885ae0ee9d29f510303c9abc0c8253aa2d7dfbad49dbec8","download_count":5,"created_at":"2026-10-30T05:42:29Z","updated_at":"2026-10-30T05:42:30Z"},{"id":691077493,"node_id":"RA_kwDOBzovgs4pMQF1","name":"wasm-pack-v0.15.1-aarch64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2777886,"digest":"sha256:7004853c7925ae1984033b5f25866ec604bbc921ef956d5e6c5595bc5af6d30c","download_count":90,"created_at":"2026-10-30T05:42:27Z","updated_at":"2026-10-30T05:42:27Z"},{"id":691077649,"node_id":"RA_kwDOBzovgs4pMQIR","name":"wasm-pack-v0.15.1-x86_64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2631654,"digest":"sha256:9387715ad345a1fe58751d60c80f49d9139957540728bafd0668d005a37cef62","download_count":61,"created_at":"2026-10-30T05:42:33Z","updated_at":"2026-10-30T05:42:34Z"},{"id":691077516,"node_id":"RA_kwDOBzovgs4pMQGM","name":"wasm-pack-v0.15.1-x86_64-pc-windows-msvc.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2318270,"digest":"sha256:80afe1f95aaa3f7442917c4457c8316bd1a383c1f27eb0e40601ff3ee3217583","download_count":332,"created_at":"2026-10-30T05:42:28Z","updated_at":"2026-10-30T05:42:29Z"},{"id":691077448,"node_id":"RA_kwDOBzovgs4pMQFI","name":"wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":2886204,"digest":"sha256:410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2","download_count":4804,"created_at":"2026-10-30T05:42:26Z","updated_at":"2026-10-30T05:42:26Z"}],"body":"- ### ✨ Features\n\n  - **Add prebuilt Windows ARM binaries to releases - [6x68], [pull/1606]**\n\n    Releases now include a wasm-pack binary built for Windows on ARM64.\n\n    [pull/1606]: https://github.com/wasm-bindgen/wasm-pack/pull/1606\n    [6x68]: https://github.com/6x68\n\n  - **Add `--no-gitignore` flag - [NellowTCS], [pull/1590]**\n\n    Skips writing the `.gitignore` file into the output directory, so the generated package can be committed.\n\n    [pull/1590]: https://github.com/wasm-bindgen/wasm-pack/pull/1590\n    [NellowTCS]: https://github.com/NellowTCS\n\n- ### 🤕 Fixes\n\n  - **Read the `package.json` written by wasm-bindgen 0.2.94+ - [tomoyan596], [pull/1533]**\n\n    Since wasm-bindgen 0.2.94, the `package.json` it writes for the npm dependencies of JS\n    snippets has the form `{\"dependencies\": {...}}`. wasm-pack expected a flat map of names to\n    versions, so builds failed with `invalid type: map, expected a string`. Both forms are now\n    read, and the dependencies are merged into the generated `package.json`.\n\n    [pull/1533]: https://github.com/wasm-bindgen/wasm-pack/pull/1533\n    [tomoyan596]: https://github.com/tomoyan596\n\n  - **Download prebuilt wasm-bindgen for every platform it is published for - [guybedford], [pull/1619]**\n\n    On Windows ARM64, wasm-bindgen and cargo-generate are now downloaded as their x64 builds,\n    which run under emulation, instead of being built from source. Linux ARM64 downloads\n    the static musl build of wasm-bindgen (0.2.104+) and cargo-generate, so they also run on\n    musl hosts, and Linux RISC-V 64 downloads the prebuilt wasm-bindgen (0.2.127+).\n\n    [pull/1619]: https://github.com/wasm-bindgen/wasm-pack/pull/1619\n\n  - **Drop 32-bit Linux geckodriver support - [guybedford], [pull/1595]**\n\n    Mozilla discontinued 32-bit (x86) Linux geckodriver builds in v0.37.0, so the\n    download URL now 404s. The 32-bit Linux target is removed from `install_geckodriver`\n    and its test is skipped on that platform.\n\n    [pull/1595]: https://github.com/wasm-bindgen/wasm-pack/pull/1595\n\n  - **Use prebuilt wasm-bindgen binary on macOS aarch64 - [guybedford], [pull/1585]**\n\n    Previously wasm-pack built `wasm-bindgen-cli` from source on Apple Silicon. The\n    prebuilt `aarch64-apple-darwin` release is now used directly.\n\n    [pull/1585]: https://github.com/wasm-bindgen/wasm-pack/pull/1585\n\n  - **Download prebuilt wasm-opt binary on Windows aarch64/arm64 - [gSys1337], [pull/1605]**\n\n    wasm-pack now downloads prebuilt `wasm-opt` binaries for Windows on AARCH64/ARM64\n    (`arm64-windows`) from Binaryen releases instead of failing with an\n    unrecognized target error.\n\n    [pull/1605]: https://github.com/wasm-bindgen/wasm-pack/pull/1605\n    [gSys1337]: https://github.com/gSys1337\n\n  - **Pass `--enable-exception-handling` to wasm-opt for `--panic-unwind` builds - [guybedford], [pull/1600]**\n\n    Previously this relied on Binaryen detecting the feature from the `target_features`\n    custom section, so the optimisation step failed if that section was stripped or an\n    older `wasm-opt` on `PATH` was used.\n\n    [pull/1600]: https://github.com/wasm-bindgen/wasm-pack/pull/1600\n    [guybedford]: https://github.com/guybedford\n\n  - **Update Binaryen to v130 - [divergentdave], [pull/1599]**\n\n    The bundled `wasm-opt` now accepts builds with the wide arithmetic target feature enabled.\n\n    [pull/1599]: https://github.com/wasm-bindgen/wasm-pack/pull/1599\n    [divergentdave]: https://github.com/divergentdave\n\n  - **Fix tier-3 target handling for wasm64 and bump Binaryen to v129 - [guybedford], [pull/1586]**\n\n    Building for `wasm64-unknown-unknown` no longer fails on `rustup target add`. wasm-pack\n    now resolves the target triple the same way cargo does, checks for a nightly toolchain\n    and installs `rust-src` for tier-3 wasm targets, and leaves `+nightly` and `-Z build-std`\n    to the project's `rust-toolchain.toml` and `.cargo/config.toml`. The bundled Binaryen\n    is bumped so `wasm-opt` accepts 64-bit memories and tables.\n\n    [pull/1586]: https://github.com/wasm-bindgen/wasm-pack/pull/1586\n\n  - **Bundle snippets - [coval3nte], [pull/1584]**\n\n    The generated `package.json` now lists the `snippets` directory in `files` when it\n    exists, so wasm-bindgen JS snippets are included in the published package.\n\n    [pull/1584]: https://github.com/wasm-bindgen/wasm-pack/pull/1584\n    [coval3nte]: https://github.com/coval3nte\n\n- ### 📖 Documentation\n\n  - **Document custom profile configuration for wasm-pack - [viandoxdev], [pull/1558]**\n\n    Documents the `Cargo.toml` wasm-pack configuration for custom profiles used with `--profile`.\n\n    [pull/1558]: https://github.com/wasm-bindgen/wasm-pack/pull/1558\n    [viandoxdev]: https://github.com/viandoxdev\n\n"}
