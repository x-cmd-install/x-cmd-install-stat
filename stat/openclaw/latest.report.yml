erified.\n- Pending: ClawHub recovery, npm beta-selector synchronization, remaining native app distribution, and stable main closeout. Android native qualification failed. Windows historical-upgrade and Vercel mirror advisory failures remain recorded.\n- The [repaired split-publication verifier](https://github.com/openclaw/openclaw/pull/144638) passed live npm/Docker verification. Full beta-selector verification and the immutable main-closeout record remain pending. The attached postpublish evidence preserves the earlier recovery snapshot; these follow-ups are not marked complete.\n- Linux desktop AppImage and Debian package: published from `v2026.9.4` source `3a9d69db306cd7f081e06254cb89c4bcc14a7107`. [Build, packaged runtime smoke, and signing](https://github.com/openclaw/openclaw/actions/runs/34749148773) passed; GitHub asset upload was recovered using the exact successful CI artifacts. Public downloads match the [checksums](https://github.com/openclaw/openclaw/releases/download/v2026.9.4/SHA256SUMS.linux-app.txt), and the AppImage signature was independently verified. The [Linux updater manifest](https://github.com/openclaw/openclaw/releases/download/v2026.9.4/latest.json) is published, and the stable update endpoint was verified at 2026.9.4.\n","reactions":{"total_count":56,"+1":28,"-1":0,"laugh":5,"hooray":6,"confused":0,"heart":4,"rocket":7,"eyes":6},"mentions_count":200}
