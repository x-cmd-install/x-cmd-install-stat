82,"node_id":"RA_kwDOJ7brVs4hsYfe","name":"openai_codex_cli_bin-0.0.44-py3-none-win_amd64.whl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":141014260,"digest":"sha256:4a31d63d5d77d7d8f195d4757feff2229cae1b1e0420ae141e73d0a6a5e1c332","download_count":3,"created_at":"2026-09-15T08:38:15Z","updated_at":"2026-09-15T08:39:00Z"},{"id":565282814,"node_id":"RA_kwDOJ7brVs4hsYf-","name":"openai_codex_cli_bin-0.0.44-py3-none-win_arm64.whl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":130064276,"digest":"sha256:5c10e46f0bc67da5fa1ae5e1a7fca45158fefbe4a3b78264a22638672f6076d5","download_count":3,"created_at":"2026-09-15T08:38:15Z","updated_at":"2026-09-15T08:38:58Z"}],"body":"# Open Interpreter 0.0.44\n\n## Models\n\n- Add source-generated GLM-5.3 and GLM-5.3-Flash picker entries for Z.AI Coding Plan, Zhipu AI, and Zhipu AI Coding Plan.\n- Refresh related provider metadata, including GLM-5.2/5.3 highspeed entries where the source exposes them. Picker membership follows the maintained source's tool-calling eligibility; this does not claim other IDs were retired by the provider.\n- GLM-5.3-Flash exposes image input and a 1M-token context window in generated source metadata.\n- Existing inherited GPT-6 Astra and GPT-5.6 presets and Gemini 3.8 Flash support are unchanged.\n\nChoose provider `zai-coding-plan` and model `glm-5.3` or `glm-5.3-flash` through `/model`; set `ZAI_API_KEY` for that service. Zhipu services use `ZHIPU_API_KEY`. Availability depends on account, region, plan, and provider response.\n\nThis release updates Open Interpreter's generated provider catalog; it does not introduce a new upstream Codex preset or change the stable Codex baseline.\n\nSources: [GLM-5.3](https://docs.z.ai/guides/llm/glm-5.3), [GLM-5.3-Flash](https://docs.z.ai/guides/vlm/glm-5.3-flash), and [models.dev](https://models.dev).\n\n"}
