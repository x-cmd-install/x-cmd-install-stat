e":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:5524586120dcf4bdb9cbf7f9eaa767b5d443abaf4668c73a7464b7ac5c380dad","download_count":2,"created_at":"2026-07-14T01:06:12Z","updated_at":"2026-07-14T01:06:12Z"}],"body":"## Release Notes\n\n### Added\n\n- Interactive-mode search (`/`) supports glob wildcards (`*`, `?`) when the query contains one\n- `--output html` renders a self-contained, collapsible HTML directory index\n\n### Changed\n\n- Updated major dependencies: ratatui 0.30, colored 3, lscolors 0.21, git2 0.21, clap 4.6\n- When `LS_COLORS` is set, only the suffixes it defines are colored (lscolors no longer merges built-in defaults into a custom `LS_COLORS`); behavior without `LS_COLORS` is unchanged\n- Declared a minimum supported Rust version of 1.88 (`rust-version` in Cargo.toml)\n\n## Install lstr 0.4.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/bgreenwell/lstr/releases/download/v0.4.0/lstr-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/bgreenwell/lstr/releases/download/v0.4.0/lstr-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install bgreenwell/tap/lstr\n```\n\n## Download lstr 0.4.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [lstr-aarch64-apple-darwin.tar.xz](https://github.com/bgreenwell/lstr/releases/download/v0.4.0/lstr-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/bgreenwell/lstr/releases/download/v0.4.0/lstr-aarch64-apple-darwin.tar.xz.sha256) |\n| [lstr-x86_64-apple-darwin.tar.xz](https://github.com/bgreenwell/lstr/releases/download/v0.4.0/lstr-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/bgreenwell/lstr/releases/download/v0.4.0/lstr-x86_64-apple-d