pN1M4hG_-9","name":"mercury-macos-arm64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68498786,"digest":"sha256:a3058c36d15949a926f711b08c9c6e895133d33b40544e67ddfbfe22b6485636","download_count":5,"created_at":"2026-09-10T17:35:32Z","updated_at":"2026-09-10T17:39:32Z"},{"id":555483070,"node_id":"RA_kwDOSHpN1M4hG_--","name":"mercury-macos-x64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":74186832,"digest":"sha256:f7219be10f86d567552a006d5f64eab6141fe7aa355d8ae2a9a77a80122f243c","download_count":2,"created_at":"2026-09-10T17:35:32Z","updated_at":"2026-09-10T17:39:38Z"},{"id":555483073,"node_id":"RA_kwDOSHpN1M4hG__B","name":"mercury-win-x64.exe","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":103491584,"digest":"sha256:6d852650466e1ed01b5d2623d2117b3652346118ce17005d6decd67f3393d29b","download_count":2,"created_at":"2026-09-10T17:35:33Z","updated_at":"2026-09-10T17:40:01Z"},{"id":555489107,"node_id":"RA_kwDOSHpN1M4hHBdT","name":"web.tar.gz","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1367836,"digest":"sha256:02b090beea0beea1e5741085a22ccd1d621c6dea2048f8c0e61fbd11e28e1726","download_count":4,"created_at":"2026-09-10T17:39:34Z","updated_at":"2026-09-10T17:39:35Z"}],"body":"The release where **1.2.4's promises actually ship.** The squash merge into main silently dropped the newest Release/1.23 work \u2014 the native-scrollback TUI, the flicker fix, the chat delivery contract, and even `mercury attach`'s command registration \u2014 so the shipped package had the code but not the features. All of it is restored and verified here.\n\n## Highlights\n\n### Native scrollback \u2014 wheel scroll and copy-paste are the terminal's own\n- Finalized messages print **once** into the terminal's native scrollback through `<Static>`; only the small live region (streaming tail, steps, prompt, input, status) repaints\n- **Mouse reporting stays OFF in Mercury Code** \u2014 the terminal itself handles wheel scrolling and drag-select/copy-paste; synthetic mouse capture would break both\n- Viewport anchoring keeps the live region pinned while you scroll back freely\n\n### The flicker fix \u2014 diff-rendered live region\n- Ink's frame writer is patched (shipped via the ink patch) to **erase and rewrite only the rows that changed**: a permission-selection toggle or a spinner tick no longer repaints the entire live region \u2014 no more full-UI flash on every keystroke of state\n\n### Chat delivery contract \u2014 no false positives, anywhere\n- The completion contract now holds for plain chat on every channel: an implementation-style request must actually run its tools \u2014 narration alone can't end a task without having done anything\n- A change that landed but was never verified is forced through one bounded evidence round (build/test/typecheck), same as execute mode\n- **Text deliverables stay exempt**: poems, emails, essays \u2014 replies where the response itself is the work \u2014 are never forced through file tools\n\n### `mercury attach` \u2014 now actually works\n- 1.2.4 shipped the attach code but **lost the command registration in the merge**; `mercury attach` didn't exist there\n- Full command wiring restored: `mercury attach` connects a second terminal to the running runtime (live streaming TUI), a second `mercury` invocation auto-attaches, and the machine-local attach token rotates at every boot\n- Detach with Ctrl+C \u2014 the runtime keeps running\n\n## Fixed\n- Restored Release/1.23 work dropped by a conflicted merge (`40f5aea`): 11 files, including the ink patch's log-update diff-render, the scrollback TUI, the attach wiring, and the chat delivery contract \u2014 verified by tree-diff against the feature-complete commit"}
