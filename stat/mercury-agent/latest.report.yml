0+ models.** AI/ML API joins Mercury as a first-class provider, alongside two quiet reliability fixes from the community.\n\n## Highlights\n\n### AI/ML API provider \u2014 350+ chat models on one key\n- New named provider (`AIMLAPI_API_KEY`) with the full setup flow: `mercury setup` validates your key by fetching its live chat catalogue and offers a model pick (recommendation: `anthropic/claude-sonnet-4.6`)\n- Model discovery is surface-aware: AI/ML API lists chat, image, video and speech models as separate rows with repeated ids \u2014 Mercury keeps only the chat surface and collapses the repeats, so the picker shows real chat models instead of \"could not find any supported chat models\"\n- Also configurable through the web UI (Providers page) and `.env` (`AIMLAPI_BASE_URL` / `AIMLAPI_MODEL` / `AIMLAPI_ENABLED`)\n- Without a key it stays unconfigured and unregistered \u2014 nothing changes for existing installs; the default provider is untouched\n\n## Fixed\n- **`mercury uninstall` local-install detection** \u2014 the project-level npm install was never discoverable (one `dirname()` too many stripped the project directory); the scan now also works on machines with no global install, verified against simulated nvm-managed roots\n- **The bundled ink fixes are now self-sufficient** \u2014 previously the log-update diff-render and the live-region guard came only from patch-package, which fails on Termux (Android). The applier now carries the full set (Yoga WASM hygiene, Static identity dedup, freeze gate, live-region guard, diff-render) with a regression test driving a stock ink 5.2.1 tree through it\n\n**Full changelog:** https://github.com/cosmicstack-labs/mercury-agent/compare/v1.2.6...v1.2.7"}
