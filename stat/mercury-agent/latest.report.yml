,"node_id":"RA_kwDOSHpN1M4lkfB0","name":"mercury-macos-arm64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68895074,"digest":"sha256:675c8a8c62934f81e9a0caf6f591cf43c41b2d77c50c92a5d57dbf7ed6658d9f","download_count":7,"created_at":"2026-10-11T09:22:42Z","updated_at":"2026-10-11T09:24:01Z"},{"id":630336989,"node_id":"RA_kwDOSHpN1M4lki3d","name":"mercury-macos-x64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":74580048,"digest":"sha256:d0b1dcc522034b525cbbf7b9467dfe31cc3e0697a95313ef33e8ca509320b02e","download_count":2,"created_at":"2026-10-11T09:30:55Z","updated_at":"2026-10-11T09:32:34Z"},{"id":630340444,"node_id":"RA_kwDOSHpN1M4lkjtc","name":"mercury-win-x64.exe","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":103882240,"digest":"sha256:58acf1bc7cd36e965760f3caaf0e4963f78ed38c5c5ddd2f659c4e475fd33c18","download_count":7,"created_at":"2026-10-11T09:32:37Z","updated_at":"2026-10-11T09:34:32Z"},{"id":630343949,"node_id":"RA_kwDOSHpN1M4lkkkN","name":"web.tar.gz","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1366770,"digest":"sha256:6a8d04efcb5e50c58906ed7fb271cc5e4f36d2459edc3b8bfaa4affb4dc01b40","download_count":15,"created_at":"2026-10-11T09:34:34Z","updated_at":"2026-10-11T09:34:36Z"}],"body":"- **Launch pad on `mercury`.** The default launch attaches to the daemon (ADR-024) and the attach screen had dropped the launch pad \u2014 the wordmark, provider/skills/web/budget rows and tip the main TUI opens with. It is back, fed by real runtime state, above the session picker.\n- **`/stop` then a command.** `/stop` aborts asynchronously; a slash command typed before the turn finished unwinding was answered \"Agent is busy\u2026\". The launcher now waits for the stop to complete (up to 5 s) and runs the command normally.\n- **`/code` works again from `mercury`.** Since 1.3.1 the default launch attaches to the daemon, and `/code` typed there was forwarded to the daemon's web channel \u2014 which has no terminal to switch into \u2014 so it printed \"Programming mode: Off\". The attach TUI now hands the terminal to Mercury Code (`/code` or `/code <dir>`), exactly what `mercury code` does; the runtime keeps running in the background. `/code plan|auto|off` inside the attach TUI explain where to run them.\n"}
