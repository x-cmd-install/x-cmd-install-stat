N1M4hGWPU","name":"mercury-macos-arm64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68482274,"digest":"sha256:4f85246d59ec7c16ac5a4efc8814f31258faeeb94f2cf2b5bcb5abb14fbbaf58","download_count":1,"created_at":"2026-09-10T15:50:01Z","updated_at":"2026-09-10T15:51:51Z"},{"id":555312085,"node_id":"RA_kwDOSHpN1M4hGWPV","name":"mercury-macos-x64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":74170448,"digest":"sha256:ebc6d0aae87fb59c359f8398430c0e906c568f0e6a3235c48115f8b1d575e38b","download_count":0,"created_at":"2026-09-10T15:50:01Z","updated_at":"2026-09-10T15:52:04Z"},{"id":555312086,"node_id":"RA_kwDOSHpN1M4hGWPW","name":"mercury-win-x64.exe","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":103474688,"digest":"sha256:5302b999b9d32856e17691c39a72e21b594eea2fd6900e6278c18c92471a08fc","download_count":0,"created_at":"2026-09-10T15:50:02Z","updated_at":"2026-09-10T15:52:42Z"},{"id":555315023,"node_id":"RA_kwDOSHpN1M4hGW9P","name":"web.tar.gz","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1367817,"digest":"sha256:7e81017f6f240aa89d3df4140f9d4d6608bd43795fc63a4b91f7c3684c83f145","download_count":1,"created_at":"2026-09-10T15:51:53Z","updated_at":"2026-09-10T15:51:54Z"}],"body":"The release where **one Mercury runtime serves every terminal you open.** `mercury attach` connects a second terminal to the running session \u2014 a full live TUI over the runtime's event feed \u2014 while the runtime itself keeps running untouched in the first.\n\n## Highlights\n\n### `mercury attach`\n- **Second terminal, same Mercury** \u2014 `mercury attach` connects to the already-running runtime and opens the full TUI: live streaming, step markers, prompts, input. The runtime is never touched from the attached side.\n- **Auto-attach** \u2014 a second `mercury` invocation finds the running runtime and attaches instead of starting a duplicate.\n- **Native scrollback** (same model as the main TUI) \u2014 finalized messages print once into the terminal's own scrollback through `<Static>`; only the small live region (streaming tail, steps, prompt, input, status) repaints.\n- **Every surface's history** \u2014 the conversation history comes from the shared session repository, so messages sent from other surfaces (CLI, Telegram, web) are visible as history in the attached view.\n- **Clean detach** \u2014 Ctrl+C detaches; the runtime keeps running (`mercury stop` stops it).\n\n### Attach-token auth\n- **Machine-local token** written at boot to `attach-token` (`0600` \u2014 same trust level as credential files), rotated on every restart.\n- **Loopback-only**: the token is accepted only from `127.0.0.1` connections \u2014 non-loopback or wrong token gets `401`.\n- Regular web session tokens still work for API calls unchanged.\n\n### Website & docs\n- New **Cloud Instance** platform guide \u2014 hosted Mercury via [Atomic Bot](https://atomicbot.ai)\n- New **completion architecture** reference page\n- Richer per-page OG preview cards with sections, description, and breadcrumb\n\n## Fixed\n- `perm-tui-repaint` test stabilized for CI: ink suppresses non-static frame writes under `is-in-ci` (only `<Static>` output survives); the test now clears `CI` before ink loads and polls for the rendered frame instead of sleeping\n- Windows: POSIX file-mode assertion skipped in `attach-token` test (Windows doesn't enforce `0600`; `stat` reports `0666` for writable files)"}
