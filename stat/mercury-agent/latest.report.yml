SHpN1M4g1ym6","name":"mercury-macos-arm64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":68482274,"digest":"sha256:948bca9f3113965b06218807705072a0cbfab3269ed4cfecebec7e2620ffd42c","download_count":3,"created_at":"2026-09-08T17:35:34Z","updated_at":"2026-09-08T17:37:06Z"},{"id":550971835,"node_id":"RA_kwDOSHpN1M4g1ym7","name":"mercury-macos-x64","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":74170448,"digest":"sha256:04f04e0242d77ffb91acfa287e4661b6c8572e37dd4ae59eb7c463e15f533868","download_count":1,"created_at":"2026-09-08T17:35:34Z","updated_at":"2026-09-08T17:37:17Z"},{"id":550971833,"node_id":"RA_kwDOSHpN1M4g1ym5","name":"mercury-win-x64.exe","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":103474176,"digest":"sha256:381646212942071d8fbc93f36d8bd8b4245956216e0d300aca81970ed5f53acc","download_count":1,"created_at":"2026-09-08T17:35:34Z","updated_at":"2026-09-08T17:37:36Z"},{"id":550973996,"node_id":"RA_kwDOSHpN1M4g1zIs","name":"web.tar.gz","label":"","uploader":{"login":"hotheadhacker","id":18418340,"node_id":"MDQ6VXNlcjE4NDE4MzQw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1367816,"digest":"sha256:f6e8806989784d3a02a93fbf574649579f39addcd723acc96083ce1044bcc2aa","download_count":6,"created_at":"2026-09-08T17:37:06Z","updated_at":"2026-09-08T17:37:07Z"}],"body":"The release where **Mercury Code stops dying and starts telling the truth.** The completion pipeline was rebuilt around a completion contract: every task ends in a verdict \u2014 a verified completion with evidence, or an honest pause that names its blocker and resumes. Tasks can no longer fake success, die silently, or loop forever.\n\n## Highlights\n\n### Completion contract\n- Every task end is classified (`text-stop` / `steps-exhausted` / `interrupted` / `truncated` / `aborted`) \u2014 budget exhaustion is a *pause*, never a fake \"Task complete\"\n- Evidence-gated completion: implementation tasks must run a build/test/typecheck before the completion banner is allowed\n- Honest banners: \"Response delivered \u00b7 no file changes\" (git-verified), first-person pause messages, per-file change summary at completion\n\n### AUTO mode \u2014 no more manual plan/execute switching\n- Mercury Code's new default: read first, plan silently, implement immediately in one flow\n- Small/medium changes build without asking; large or consequential changes present a concise plan with a single confirmation (recommended option default-selected), then build without re-asking\n\n### The escalation harness \u2014 the agent makes things happen\nWhen a model narrates instead of building, the agent escalates mechanically \u2014 none of it depends on the model's goodwill:\n1. **Grounding** \u2014 the agent executes a deterministic directory listing itself (no LLM) and injects it as verified state\n2. **Forced action** \u2014 via `prepareStep`, the first step of a guard round runs with `toolChoice: 'required'` and **mutating tools only** \u2014 narration is mechanically impossible on that step\n3. **Provider rotation** \u2014 guard rounds walk the fallback chain; a narration-locked model isn't the only worker\n4. **Wake-up call** \u2014 after a full failed cycle, the bound doubles (10 mechanical rounds total) with a blunt directive: *\"Your next response MUST begin with a mutating tool call. ZERO prose.\"*\n\n### Reliability \u2014 compact-on-pressure + no imposed size limit\n- Memory pressure now **compacts the conversation in place and continues** (OpenCode's `SessionCompaction` practice) instead of aborting long builds\n- **No Mercury-imposed output size limit** \u2014 the model's native limit governs (32,768 ceiling); providers that reject a high `max_tokens` get an adaptive halving\n\n## Security hardening\n- **SSRF guard**: `fetch_url` and `install_skill` validate scheme + private ranges (DNS-resolved) on every redirect hop; 512 KB caps\n- **Credential files** (`web-config.json`, `web-sessions.json`) written `0600` and repaired on load\n- **Random initial web password** \u2014 no more hardcoded default from a public repo\n- **Secret redaction** \u2014 API keys masked in logs and command-output echoes\n- **Shell blocklist** \u2014 swapped-flag `rm -fr` variants added to the never-execute tier\n\n## Live TUI\n- **Plan checklist** \u2014 the `update_plan` tool maintains pending / \u25b6 active / \u2611 done steps in the transcript\n- **`ask_user` choice picker** \u2014 now renders inside Mercury Code (previously invisible \u2192 hang) and owns the keyboard; Esc cancels safely\n- **Thinking preview** \u2014 model reasoning streams as a quoted preview instead of 52 seconds of dead air\n- **Wheel scrolling** \u2014 full-screen transcripts scroll with the trackpad via a filtered stdin proxy\n\n## Fixed\n- Yoga WASM \"memory access out of bounds\" crashes \u2014 ink patched (freed-node hygiene + `<Static>` identity dedup), shipped via patch-package\n- Duplicate-message render loop (~30 s cadence)\n- Scroll repair after long-session trims (`/mc scroll-set` was parsed as a NaN delta)\n- Prose questions no longer fight the narration guard; non-git dirs no longer false-claim \"no file changes\"\n- Mercury Cloud recovery error now says \"run `mercury cloud connect`\" instead of an opaque 401 loop\n- Chat-mode thinking indicator surfaces live provider/phase activity\n\n## Upgrade\n\n```bash\nnpm install -g @cosmicstack/mercury-agent@1.2.3\n```\n\nNo config changes required. New optional env vars: `MERCURY_STALL_SOFT_MS`, `MERCURY_STALL_HARD_MS`, `MERCURY_ALLOW_PRIVATE_FETCH`. `patch-package` ships as a runtime dependency \u2014 the bundled ink patch applies automatically on install.\n\n**Full changelog:** https://github.com/cosmicstack-labs/mercury-agent/blob/main/CHANGELOG.md"}
