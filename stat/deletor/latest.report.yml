"deletor-v2.0.0-windows-arm.exe","label":null,"uploader":{"login":"pashkov256","id":94466508,"node_id":"U_kgDOBaFxzA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":4778496,"digest":"sha256:2caece975c9fe0a91d032bdf0ad2552fa6be21444191580fa295b956f0fb9f35","download_count":31,"created_at":"2026-04-04T13:59:10Z","updated_at":"2026-04-04T13:59:12Z"},{"id":388693501,"node_id":"RA_kwDONvfhg84XKv39","name":"deletor-v2.0.0-windows-arm64.exe","label":null,"uploader":{"login":"pashkov256","id":94466508,"node_id":"U_kgDOBaFxzA","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":4998144,"digest":"sha256:501b65d72eb71e28305bf782b210cfa68dc66a4edbad76f9ed49c71a1080ecec","download_count":47,"created_at":"2026-04-04T13:59:04Z","updated_at":"2026-04-04T13:59:08Z"}],"body":"## \ud83c\udf89 Major Updates\r\n\r\n### \u23f1 One-off Scheduled Clean (TUI)\r\n- Added a dedicated **TUI page** to schedule a **single** future clean run\r\n- Takes a **snapshot of saved rules**, then runs the clean once when the timer fires\r\n- Keeps the scheduling **session-bound** (the run happens while Deletor stays open)\r\n- Preserves directory mode when refreshing the clean view, and aligns validation behavior with the parser\r\n\r\n**PR:** #318  https://github.com/pashkov256/deletor/pull/318\r\n\r\n---\r\n\r\n### \ud83e\uddf1 Centralized file filters + hardened rules handling\r\n- Centralized shared **file filter state** between CLI config and [filemanager](cci:9://file:///c:/Users/pashkov/Documents/GitHub/deletor/internal/filemanager:0:0-0:0)\r\n- Rules improvements:\r\n  - Preserve rule values across partial updates\r\n  - Cache rules reads\r\n  - Validate persisted rule data before writing\r\n  - Surface rule save failures in the TUI (instead of swallowing them)\r\n\r\n**PR:** #317 \r\n\r\n---\r\n\r\n## \ud83e\udde9 CLI Improvements / Fixes\r\n\r\n### \ud83d\udcc8 CLI progress wiring fix\r\n- Fixed CLI progress plumbing\r\n- Extended regression coverage around the parser and TUI refresh path (to prevent related regressions)\r\n\r\n**PR:** #318  https://github.com/pashkov256/deletor/pull/318\r\n\r\n---\r\n\r\n## \ud83d\udc1b TUI UX & Reliability\r\n\r\n### \ud83e\uddfe Show errors in Clean cache view\r\n- Added `Error *errors.Error` field to `CacheModel` (same pattern as the rules view)\r\n- Errors are displayed with type-specific styling via `errors.GetStyle()`\r\n- Unsupported OS (darwin) and failed `ClearCache()` operations now show proper `ErrorTypeFileSystem`\r\n- Error is cleared when a new scan is initiated\r\n- Success messages use `SuccessStyle` instead of `InfoStyle`\r\n\r\n**PR:** #275  https://github.com/pashkov256/deletor/pull/275\r\n\r\n---\r\n\r\n### \ud83d\ude00 Option to disable emojis\r\n- Added a TUI option to disable emojis\r\n\r\n**PR:** #274  https://github.com/pashkov256/deletor/pull/274\r\n\r\n---\r\n\r\n### \ud83d\udd04 Spinner while processing files\r\n- Added a spinner when files are being processed\r\n\r\n**PR:** #273  https://github.com/pashkov256/deletor/pull/273\r\n\r\n---\r\n\r\n## \ud83e\uddf0 Utils / Platform\r\n\r\n### \ud83c\udfe0 [ExpandTilde](cci:1://file:///c:/Users/pashkov/Documents/GitHub/deletor/internal/filemanager/interface.go:15:1-15:32) now supports `~username`\r\n- Added support for expanding `~username` paths via `os/user.Lookup()`\r\n- Fixed path splitting for both Unix (`/`) and Windows (`\\`) separators\r\n- Improved error handling: if user lookup fails, the original path is returned (backward compatible)\r\n- Added comprehensive unit tests (including edge cases)\r\n\r\n**PR:** #295  https://github.com/pashkov256/deletor/pull/295\r\n\r\n---\r\n\r\n## \ud83e\uddea Testing & Coverage Improvements\r\n\r\n### \u2705 New unit tests and regression coverage\r\n- Table-driven unit tests for:\r\n  - `ParseExtToSlice`\r\n  - `ParseExcludeToSlice`\r\n- Comprehensive unit tests for [internal/path](cci:9://file:///c:/Users/pashkov/Documents/GitHub/deletor/internal/path:0:0-0:0)\r\n- Added / expanded regression coverage around new scheduling flow and TUI refresh behavior\r\n\r\n**PRs:**\r\n- #300  \r\n- #297  \r\n- #293 (similar scope around parser tests; include if it landed separately)  \r\n\r\n### Other test/infra PRs from this cycle\r\n- #271 \u2014 tests for `GetNextOption`  \r\n- #290 \u2014 tests for [IsEmptyDir](cci:1://file:///c:/Users/pashkov/Documents/GitHub/deletor/internal/filemanager/interface.go:14:1-14:28) and [ExpandTilde](cci:1://file:///c:/Users/pashkov/Documents/GitHub/deletor/internal/filemanager/interface.go:15:1-15:32)  \r\n- #277 \u2014 tests for `ParseTimeDuration`  \r\n- #258 \u2014 CLI flags parsing tests + coverage boost  \r\n- #257 \u2014 tests for `DeleteFileWithWindowsAPI`  \r\n- #256 \u2014 TabManager test coverage  \r\n- #255 \u2014 fix: #254 fmt unix cache test  \r\n- #265 \u2014 JSON logging support for CLI  \r\n\r\n\r\n---\r\n\r\n## \ud83d\udd17 Related PRs (short list)\r\n- #318 \u2014 feat: add one-off scheduled clean flow  \r\n- #317 \u2014 refactor: centralize file filters and harden rules handling  \r\n- #300 / #297 / #295 / #275 / #274 / #273 \u2014 features/tests/polish (links above)\r\n\r\n\r\n## New Contributors\r\n* @AlsuGibadullina made their first contribution in https://github.com/pashkov256/deletor/pull/251\r\n* @CyberPatriarchy made their first contribution in https://github.com/pashkov256/deletor/pull/256\r\n* @MowlCoder made their first contribution in https://github.com/pashkov256/deletor/pull/257\r\n* @yuvraj-kolkar17 made their first contribution in https://github.com/pashkov256/deletor/pull/258\r\n* @ElyarSadig made their first contribution in https://github.com/pashkov256/deletor/pull/260\r\n* @rjfeeney made their first contribution in https://github.com/pashkov256/deletor/pull/262\r\n* @Prem-Rajendran made their first contribution in https://github.com/pashkov256/deletor/pull/265\r\n* @pigeio made their first contribution in https://github.com/pashkov256/deletor/pull/271\r\n* @pxc1984 made their first contribution in https://github.com/pashkov256/deletor/pull/273\r\n* @2B2Tmatt made their first contribution in https://github.com/pashkov256/deletor/pull/274\r\n* @tergel-996 made their first contribution in https://github.com/pashkov256/deletor/pull/275\r\n* @a2sh3r made their first contribution in https://github.com/pashkov256/deletor/pull/291\r\n* @princeh23 made their first contribution in https://github.com/pashkov256/deletor/pull/290\r\n* @Deepak8858 made their first contribution in https://github.com/pashkov256/deletor/pull/293\r\n* @clarabennettdev made their first contribution in https://github.com/pashkov256/deletor/pull/277\r\n* @AliyaRazyapova made their first contribution in https://github.com/pashkov256/deletor/pull/295\r\n* @Yuki9814 made their first contribution in https://github.com/pashkov256/deletor/pull/300\r\n* @kaberovnikita made their first contribution in https://github.com/pashkov256/deletor/pull/302\r\n* @jasperan made their first contribution in https://github.com/pashkov256/deletor/pull/317\r\n* @ElioNeto made their first contribution in https://github.com/pashkov256/deletor/pull/297\r\n","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":20}
