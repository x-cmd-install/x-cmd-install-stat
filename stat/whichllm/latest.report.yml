{"id":451355969,"author":{"login":"Andyyyy64","id":105579829,"node_id":"U_kgDOBksFNQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOReQROs4a5yVB","tag_name":"v0.6.9","target_commitish":"3f51a8f436635f5df4d018385a94d9af1cc8498b","name":"v0.6.9","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-19T13:04:19Z","updated_at":"2026-11-19T13:04:35Z","published_at":"2026-11-19T13:04:35Z","assets":[],"body":"# whichllm 0.6.9\n\nArtificial Analysis scores are read live again, which reshuffles the top of the ranking. This release also adds an engine card for llama-modchip, detects a Jetson AGX Thor as a GPU and re-reads eight engine cards.\n\n## Live Artificial Analysis scores\n\nAA moved its Intelligence Index to v5, on another scale, and since then every fetch fell back to the 2026-10-27 snapshot, so no new release got a live index score. v5 values are now converted onto the v4.3.2 scale by a line through five releases read on both versions, and 31 more open-weights releases on the v5 leaderboard map to their Hugging Face repos.\n\nQwen3.8-Flash-Next goes from 75.4 to 91.9 and ranks first on a 16, 24 or 32 GB GPU with 64 GB of RAM, ahead of Qwen3.8-27B. Kimi K3.1 Pro converts past the top of the scale and is held at 100. (#309)\n\n## llama-modchip\n\nllama-modchip is a llama.cpp fork built for large MoE models on the CPU. Its own quant types, `FRACTAL_64` and `VQ3_64`, have type IDs mainline llama.cpp does not register, and standard GGUFs load too. It ships CPU builds for Linux and Windows and a Metal build on a Mac, and Windows has an opt-in CUDA build. `whichllm engines` names it beside the other runners, and a ranked row lists it among the engines that can run that row. (#308)\n\n## Fixes\n\n- A row placed on the GPU no longer lists an engine that runs only on the CPU on that machine. ik_llama.cpp has no ROCm or SYCL build and needs CUDA compute capability 7.5, so on an AMD or Intel GPU, or an NVIDIA one older than Turing, it was listed for every GGUF row. When it was installed, the run line could name it for a row it would run on the CPU. llama-modchip, whose Linux install builds only for the CPU, had the same problem. (#314)\n- A Jetson AGX Thor is detected as a GPU instead of CPU-only. Its driver names the GPU `NVIDIA Thor`, without the `(nvgpu)` suffix of Orin and Xavier, so the board matched no unified-memory marker. The T5000 module now reads as Jetson AGX Thor with 273 GB/s and compute capability 11.0. (#316)\n\n## Engine cards\n\nThe cards were re-read for llama.cpp 1.0.0, vLLM 0.34.0, Lemonade 2026.47.1, llama-modchip 3.0, Strata 0.2.16, TurboFieldfare 0.10.0, WARP 0.8.2 and ik_llama.cpp. (#317)\n\n- Strata no longer runs DeepSeek V4.1 Flash, so its three DeepSeek packs are gone.\n- llama-modchip 3.0 gives its own quant types their own IDs, and VQ3_64 no longer needs AVX-512.\n- ik_llama.cpp loads mainline FP8 (`F8_E4M3`) GGUFs.\n- vLLM's release wheels are ROCm 10.0 only, and Lemonade's CUDA build needs driver 525.60.13 on Linux or 528.33 on Windows.\n\n## How it was checked\n\nAll 2,041 tests pass, locally and in CI on Python 3.11 to 3.13, and in the job that runs them with the newest release of every dependency.\n\n## Upgrade\n\n```bash\nuv tool upgrade whichllm\npip install -U whichllm\nbrew upgrade whichllm\n```\n\nEverything else is in [CHANGELOG.md](https://github.com/Andyyyy64/whichllm/blob/main/CHANGELOG.md).\n"}
