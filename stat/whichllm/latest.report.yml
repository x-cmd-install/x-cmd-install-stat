{"id":370376822,"author":{"login":"Andyyyy64","id":105579829,"node_id":"U_kgDOBksFNQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOReQROs4WE4B2","tag_name":"v0.5.16","target_commitish":"861f841d267dbbc5dbe51849e07169c77feaf9ed","name":"v0.5.16","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-14T05:42:30Z","updated_at":"2026-09-07T08:12:20Z","published_at":"2026-08-14T05:48:23Z","assets":[],"body":"## v0.5.16\n\nsorry this release took longer than it should have\n\n- Escape Hugging Face model IDs, GGUF filenames, and quantization types in generated `run` and `snippet` scripts\n- Keep synthetic GGUF recommendations tied to direct quantizations of the selected checkpoint\n- Reject fine-tunes, merges, conflicting lineage, and artifacts without explicit provenance\n- Split benchmark fetching, caching, indexing, lineage, and lookup into focused modules\n- Lock the development tools used locally and in required CI checks\n\n### Security\n\nv0.5.16 fixes [CVE-2026-58474](https://www.cve.org/CVERecord?id=CVE-2026-58474) ([GHSA-hfpc-7mr4-p297](https://github.com/advisories/GHSA-hfpc-7mr4-p297)), a code injection vulnerability affecting versions before 0.5.16.\n\nA malicious Hugging Face repository could use a crafted GGUF filename to alter Python generated by `whichllm run` or `whichllm snippet`. Exploitation requires the user to run the affected command or execute the generated snippet.\n\nUsers on an earlier version should upgrade to v0.5.16 or later:\n\n```bash\npython -m pip install --upgrade \"whichllm>=0.5.16\"\n```\n\nThanks @RaghavRD for the benchmark refactor and @hannibal-lee for the generated-script escaping fix.\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
