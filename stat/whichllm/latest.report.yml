{"id":442925536,"author":{"login":"Andyyyy64","id":105579829,"node_id":"U_kgDOBksFNQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOReQROs4aZoHg","tag_name":"v0.6.7","target_commitish":"f72d41f75979a0430c358c56fac7a2da3fdcb626","name":"v0.6.7","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-12T12:35:34Z","updated_at":"2026-11-12T12:35:49Z","published_at":"2026-11-12T12:35:49Z","assets":[],"body":"# whichllm 0.6.7\n\nA fix for the pack whichllm names under a model. On some PCs it named a pack built for a PC one size bigger, with the speed measured on that bigger PC.\n\n## What happened\n\nOn my PC, an RTX 5080 with 16 GB and 64 GB of RAM, 0.6.6 named Abyss's 24G64G pack under Qwen3.8-Flash-Next, with the 69.9 tok/s its docs measured on a 24 GB GPU. `whichllm engines` counted 8 of Abyss's 15 packs where 6 fit. It only showed up once the disk had room for the bigger pack.\n\nTwo things added up.\n\n- Abyss's card gave each pack's memory as the GPU plus the memory limit the author tests with, 58 GB for a 64 GB PC. whichllm compares that with all of a PC's RAM, so the PC started 5 GB ahead.\n- The 4% allowance from 0.6.5, for a PC that reports under the size it is sold as, was taken off what a pack needs. That also shrank needs that are measured figures and no PC size.\n\nThe PC reports 15.9 + 63.3 = 79.2 GB, and the pack's 82 GB less 4% is 78.7.\n\n## What changed\n\n- The allowance is now on the machine's side. RAM or VRAM within 4% under a size PCs are sold with counts as that size, so 63.3 GB is 64 and 15.9 is 16. A pack's need is compared as written.\n- Abyss's packs give the GPU and RAM of the PC they are named for, together. 24G64G is 88 GB.\n- Strata's Coder IQ1_M pack needs 33 GB of RAM and no longer counts as in memory on a 32 GB PC that reports 31.9 GB. It reads from the SSD there, as its docs say.\n- Strata's DeepSeek V4.1 packs at 1.75 and 2.25 bpw need 121 and 155 GB. They no longer count as in memory on a 24 GB GPU with 96 and 128 GB of RAM.\n\nEvery fit the new rule allows, the old one allowed too, so nothing new starts to fit. If 0.6.6 named a pack for you and 0.6.7 names a smaller one, the smaller one is the one built for your PC.\n\n## How it was checked\n\nI compared the new rule with 0.6.6 over 154 PCs, 11 GPU sizes by 14 RAM sizes as they report themselves, for every engine but Abyss. The three Strata packs above are the only ones that change. A new test walks every Abyss pack named for a PC. The pack fits that PC as it reports itself, and doesn't fit in memory on the next PC down. With my PC's sizes whichllm names the 16G64G pack with 70.7 tok/s and counts 6 of 15. All 1,989 tests pass.\n\n## Upgrade\n\n```bash\nuv tool upgrade whichllm\npip install -U whichllm\nbrew upgrade whichllm\n```\n\nEverything else is in [CHANGELOG.md](https://github.com/Andyyyy64/whichllm/blob/main/CHANGELOG.md).\n"}
