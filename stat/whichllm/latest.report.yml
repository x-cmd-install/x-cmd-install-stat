{"id":417147514,"author":{"login":"Andyyyy64","id":105579829,"node_id":"U_kgDOBksFNQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOReQROs4Y3Sp6","tag_name":"v0.5.21","target_commitish":"9f3709fbbe468c6ab2dd676d6a3e9888cff62562","name":"v0.5.21","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-19T09:58:07Z","updated_at":"2026-10-19T10:08:50Z","published_at":"2026-10-19T10:08:50Z","assets":[],"body":"Fix Artificial Analysis checkpoint matching for Kimi K2 and Command R+ (#188).\n\nThe Kimi K2 row now maps only to `moonshotai/Kimi-K2-Instruct`. The April Command R+ row maps only to `CohereForAI/c4ai-command-r-plus`. `Kimi-K2-Base` and `c4ai-command-r-plus-08-2024` no longer inherit their sibling's live AA score. Stored fallback scores are unchanged.\n\nUse `--refresh` to bypass an existing benchmark cache.\n\nThe release candidate passed all 594 tests on Python 3.11, 3.12, and 3.13, plus Ruff lint and format checks. Its wheel was built from the sdist and checked against all 88 source package files. A clean Python 3.13 installation with production dependencies only returned recommendation JSON from an empty cache and the same picks on a cached rerun.\n\nRequired lint and Python 3.11, 3.12, and 3.13 CI checks pass on release commit `9f3709fbbe468c6ab2dd676d6a3e9888cff62562`.\n"}
