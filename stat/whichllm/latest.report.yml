{"id":426939145,"author":{"login":"Andyyyy64","id":105579829,"node_id":"U_kgDOBksFNQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOReQROs4ZcpMJ","tag_name":"v0.5.23","target_commitish":"019b5fb796cbaebd480f20cbdda26dbdb98d1c09","name":"v0.5.23","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-28T16:49:40Z","updated_at":"2026-10-28T16:50:27Z","published_at":"2026-10-28T16:50:27Z","assets":[],"body":"Fetch trending models again and keep the model cache for its full 6 hours (#202).\n\nThe Hugging Face API rejects `sort=trending` with HTTP 400, so both trending model lists were always skipped and newly popular repositories only appeared once they also ranked by downloads. whichllm now uses `sort=trendingScore`, which returns the 300 trending models. In 0.5.22 the failing lists also marked every fetched model list as incomplete, so it was cached for 30 minutes instead of 6 hours.\n\nThe release candidate passed all 699 tests (plus 23 expected failures) and Ruff lint and format checks. Its wheel was built from a clean checkout and contains exactly the 89 source package files. A clean Python 3.13 installation with production dependencies only returned recommendation JSON from an empty cache and stored a complete model list of 1,131 models.\n\nRequired lint and Python 3.11, 3.12, and 3.13 CI checks pass on release commit `019b5fb796cbaebd480f20cbdda26dbdb98d1c09`.\n"}
