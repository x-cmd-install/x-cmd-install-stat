e of Vifm (i.e., don't put `let $TMPDIR = ...` to `vifmrc`, it won't have the desired effect).\r\n\r\n[More details](https://vifm.info/v0.14.5)\r\n","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":0,"rocket":0,"eyes":0}}
