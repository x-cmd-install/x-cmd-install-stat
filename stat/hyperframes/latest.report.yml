{"id":397400762,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORi26-c4Xr9q6","tag_name":"v0.8.79","target_commitish":"main","name":"v0.8.79","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-26T21:05:52Z","updated_at":"2026-09-26T21:25:24Z","published_at":"2026-09-26T21:25:24Z","assets":[],"body":"# HyperFrames v0.8.79\n\nReleased on 2026-09-26.\n\nStudio feels faster: a paused preview goes quiet, playback no longer re-renders the whole app, and an edit can swap one scene into the running preview. Many fixes keep saves, undo, audio and the picker in step with what you see.\n\n## Features\n\n- **Core:** The runtime reports where a composition's animations end, one cycle each ([e0e6442d9](https://github.com/heygen-com/hyperframes/commit/e0e6442d9c5935867365c15b598302c750378f2a), [#4541](https://github.com/heygen-com/hyperframes/pull/4541)).\n- **Studio Server:** History can copy the files before or after any change into a folder ([7c017a08d](https://github.com/heygen-com/hyperframes/commit/7c017a08de35e013beaee0f388afec7a6e4280bf), [#4493](https://github.com/heygen-com/hyperframes/pull/4493)).\n\n## Fixes\n\n- **Studio Server:** History refuses once closed and reopens when a new project takes its folder ([7eb6430e4](https://github.com/heygen-com/hyperframes/commit/7eb6430e4e974160f06c2a7f87c2b4bdf7d24529), [#4537](https://github.com/heygen-com/hyperframes/pull/4537)).\n- **Core:** A picked heading is named by its text, not just Heading ([22eb0ce5e](https://github.com/heygen-com/hyperframes/commit/22eb0ce5e59ef04f8ff6d6719e0e0fa71581b3c5), [#4545](https://github.com/heygen-com/hyperframes/pull/4545)).\n- **Core:** The picker offers what is drawn under the pointer, not see-through layers over it ([473c86248](https://github.com/heygen-com/hyperframes/commit/473c86248ce2a7a800f113b191d830b7b08c274b), [#4536](https://github.com/heygen-com/hyperframes/pull/4536)).\n- **Core:** An added sub-composition keeps its declared variable defaults when bundled ([89fe898cd](https://github.com/heygen-com/hyperframes/commit/89fe898cd5da9a9d8e72707246be989271842fb0), [#4539](https://github.com/heygen-com/hyperframes/pull/4539)).\n- **Core:** Pick mode keeps its highlight on the hovered element and offers it on click ([0b24a0ea8](https://github.com/heygen-com/hyperframes/commit/0b24a0ea8270995d2ca4025eadd4f45769e3bcf2), [#4538](https://github.com/heygen-com/hyperframes/pull/4538)).\n- **Studio Server:** A gesture sent without an idle time holds until another key ([162de1a6a](https://github.com/heygen-com/hyperframes/commit/162de1a6ab5ae1d9651e3236e5192c9226639480), [#4513](https://github.com/heygen-com/hyperframes/pull/4513)).\n- **Core:** Muting or unmuting an audio group while playing takes effect at once ([fb3fdd4f0](https://github.com/heygen-com/hyperframes/commit/fb3fdd4f0c8fe7dba6068bfe4175e86e8b9a9417), [#4532](https://github.com/heygen-com/hyperframes/pull/4532)).\n- **Studio Server:** Undo of a studio edit keeps a save that landed just before it ([9faade09e](https://github.com/heygen-com/hyperframes/commit/9faade09e735830d9cb91a497ca251fca94504bc), [#4524](https://github.com/heygen-com/hyperframes/pull/4524)).\n- **Studio:** An effect save resolves with whether it landed, was refused or failed ([5b034cab7](https://github.com/heygen-com/hyperframes/commit/5b034cab74b01c3382d8099ec459f176c48534ce), [#4531](https://github.com/heygen-com/hyperframes/pull/4531)).\n- **Core:** A film stops at its declared length instead of playing its animation past it ([79144f914](https://github.com/heygen-com/hyperframes/commit/79144f914b88d79dd76cee084d40bd6fbf80feb9), [#4530](https://github.com/heygen-com/hyperframes/pull/4530)).\n- **Studio:** Playback no longer re-renders the whole app every frame ([5a74db903](https://github.com/heygen-com/hyperframes/commit/5a74db903d316999e6210084cd30850ed08d16e4), [#4529](https://github.com/heygen-com/hyperframes/pull/4529)).\n- **Studio Server:** Studio element edits keep a save that lands while they apply ([0f14691c7](https://github.com/heygen-com/hyperframes/commit/0f14691c7b57e25a015c43db26826397c5a91079), [#4510](https://github.com/heygen-com/hyperframes/pull/4510)).\n- **Shader Transitions:** A runtime seek during the prewarm is where the preview lands ([0bb7b2f61](https://github.com/heygen-com/hyperframes/commit/0bb7b2f61a3ec72ec0719ad549bc1b4aa89d98e9), [#4523](https://github.com/heygen-com/hyperframes/pull/4523)).\n- **Studio:** A copied clip pastes as saved, not with the preview's hidden styles ([516320c28](https://github.com/heygen-com/hyperframes/commit/516320c28d038b7021ad6fba3ae4a281e399c340), [#4506](https://github.com/heygen-com/hyperframes/pull/4506)).\n- **Shader Transitions:** A paused preview keeps the runtime's scene visibility ([5fc876673](https://github.com/heygen-com/hyperframes/commit/5fc87667313b3f877f686ff0fd989e5af6544e8b), [#4522](https://github.com/heygen-com/hyperframes/pull/4522)).\n- **Player:** End and loop films whose length falls between two frames ([5e962a4ee](https://github.com/heygen-com/hyperframes/commit/5e962a4eebfd50e4af861a0f7d841fff9ba32e3a), [#4504](https://github.com/heygen-com/hyperframes/pull/4504)).\n- **Core:** A video's voice keeps pace with the playhead instead of trailing it ([f2c63ca42](https://github.com/heygen-com/hyperframes/commit/f2c63ca4242cc77aee0fb2523e7922100c3369fd), [#4511](https://github.com/heygen-com/hyperframes/pull/4511)).\n- **Studio:** A picked element's edit writes only that element to source ([b66739820](https://github.com/heygen-com/hyperframes/commit/b66739820762551e0af268d19568cd8a790a35f2), [#4508](https://github.com/heygen-com/hyperframes/pull/4508)).\n- **Core:** Scrubbing stays audible after the first Play ([416d009a6](https://github.com/heygen-com/hyperframes/commit/416d009a6bff45e2b098501419d8c9e94bba053e), [#4517](https://github.com/heygen-com/hyperframes/pull/4517)).\n- **Core:** A project path typed in another letter case stays inside the project ([259f65c00](https://github.com/heygen-com/hyperframes/commit/259f65c000b43e6deba6ba89f925dc8cc0fe6e93), [#4514](https://github.com/heygen-com/hyperframes/pull/4514)).\n\n## Performance\n\n- **Studio:** Tag each scene's parts in the preview so one scene can be swapped ([dce0acd6d](https://github.com/heygen-com/hyperframes/commit/dce0acd6d2ea26cae80338bdc7bb2f1cce745d27), [#4503](https://github.com/heygen-com/hyperframes/pull/4503)).\n- **Core:** A paused preview stops running its audio output ([36db44d9b](https://github.com/heygen-com/hyperframes/commit/36db44d9b7a4a0e330b4605157ed76ffc0b9cd48), [#4534](https://github.com/heygen-com/hyperframes/pull/4534)).\n- **Runtime:** Swap edited scenes into the running preview from a rebuilt document ([cb8e7995a](https://github.com/heygen-com/hyperframes/commit/cb8e7995a261093f6d10cc792be45a08e03908fc), [#4502](https://github.com/heygen-com/hyperframes/pull/4502)).\n- **Studio:** A clip's filmstrip decodes 9 frames instead of 272 and reaches the clip's end ([db42e6022](https://github.com/heygen-com/hyperframes/commit/db42e60223b0fdd075bb3c3433e84bd0615725fe), [#4526](https://github.com/heygen-com/hyperframes/pull/4526)).\n- **Studio:** Let a paused preview check in once a second instead of every 80 ms ([0985b45c3](https://github.com/heygen-com/hyperframes/commit/0985b45c32b18145224a8a460167dc18f23890cc), [#4512](https://github.com/heygen-com/hyperframes/pull/4512)).\n\n## Catalog\n\n- **Registry:** Carousel cards fall back to their sample image inside the assets folder ([8798e40da](https://github.com/heygen-com/hyperframes/commit/8798e40da8d56b2f0f3be0b74198d0cbbec1dc06), [#4543](https://github.com/heygen-com/hyperframes/pull/4543)).\n\n## Internal\n\n- **Media Use:** Tests never write into the person's media library ([c238abfe6](https://github.com/heygen-com/hyperframes/commit/c238abfe6fa3a643f4b436ee9ee318dfd5b4b311), [#4459](https://github.com/heygen-com/hyperframes/pull/4459)).\n- **Repo:** Keep one fallow audit base cache per checkout instead of one per main commit ([81d8a03d2](https://github.com/heygen-com/hyperframes/commit/81d8a03d2e5b8e3bc2207472ccacd374a7320c8a), [#4525](https://github.com/heygen-com/hyperframes/pull/4525)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.78...v0.8.79\n"}
