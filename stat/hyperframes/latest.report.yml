026-11-13T04:57:20Z"}],"body":"# HyperFrames v0.9.41\n\nReleased on 2026-11-13.\n\nFast capture works again on Chrome 157 and newer, which fixes Windows exports that failed at drawElementImage. Local renders keep Chrome's sandbox on where the host supports it and launch Chrome with only the environment it needs and explain a failed launch with the environment it had, cloud render --json lists the files an upload leaves out, publish copies only media, font, CSS and JS files from outside the project and leaves out the rest that came in with an import, a video variable given as a link now plays its sound once, media ids that differ only by case get separate folders so a render no longer fails with a missing file, and the Studio timeline and overlays read an opaque preview over its channel.\n\n## Features\n\n- **CLI:** Cloud render --json lists the files an upload leaves out ([2591abfbf](https://github.com/heygen-com/hyperframes/commit/2591abfbf014c2f70fdc48ac315fd8acbd704e3d), [#7631](https://github.com/heygen-com/hyperframes/pull/7631)).\n- **Studio:** Read overlay geometry from an opaque preview over its channel ([faff4e16a](https://github.com/heygen-com/hyperframes/commit/faff4e16a8719c63234ac7a02fc3006ddf3cc375), [#7628](https://github.com/heygen-com/hyperframes/pull/7628)).\n- **Studio:** Timeline select and selection refresh read an opaque preview over its channel ([aed4c18fe](https://github.com/heygen-com/hyperframes/commit/aed4c18feb6b9d57aa91307306b0299a46b30974), [#7613](https://github.com/heygen-com/hyperframes/pull/7613)).\n\n## Fixes\n\n- **CLI:** Copy only media, font, CSS and JS files from outside the project ([89a7aa300](https://github.com/heygen-com/hyperframes/commit/89a7aa30042e34eb2643205e1dca6a18b642cf0e), [#7636](https://github.com/heygen-com/hyperframes/pull/7636)).\n- **Engine:** Keep media ids that differ only by case in separate folders ([b54e4981f](https://github.com/heygen-com/hyperframes/commit/b54e4981f2f710e928215e3138e1fa075b1d1108), [#7635](https://github.com/heygen-com/hyperframes/pull/7635)).\n- **Producer:** A video variable given as a link plays its sound once ([2760fa119](https://github.com/heygen-com/hyperframes/commit/2760fa11916d37a512044f6243fcbbaba43fad3a), [#7633](https://github.com/heygen-com/hyperframes/pull/7633)).\n- **Engine:** Diagnose a failed Chrome launch with the env it had ([9701f4bbf](https://github.com/heygen-com/hyperframes/commit/9701f4bbf3d1ef41753dcf5613fead937e1edf2c), [#7634](https://github.com/heygen-com/hyperframes/pull/7634)).\n- **Engine:** Launch Chrome with only the env it needs ([24d56e681](https://github.com/heygen-com/hyperframes/commit/24d56e6813c776ede08a7ebb2a7f963ac31b5526), [#7629](https://github.com/heygen-com/hyperframes/pull/7629)).\n- **Engine:** Diagnose the launch attempt whose error surfaces ([43722355a](https://github.com/heygen-com/hyperframes/commit/43722355a3efa42c2675ce7c95d69b4fd51aa9bb), [#7630](https://github.com/heygen-com/hyperframes/pull/7630)).\n- **CLI:** Publish leaves out outside files that came in with an imported project ([a810a8b00](https://github.com/heygen-com/hyperframes/commit/a810a8b002113534e6c2219818f4f0d5010862d1), [#7598](https://github.com/heygen-com/hyperframes/pull/7598)).\n- **Engine:** Keep Chrome's sandbox on for local renders where the host supports it ([400a4e228](https://github.com/heygen-com/hyperframes/commit/400a4e22853906e531ab76d1b45792e70cb79ace), [#7625](https://github.com/heygen-com/hyperframes/pull/7625)).\n- **Engine:** Fast capture works on Chrome 157+, which wants content=drawable ([9c3258ccb](https://github.com/heygen-com/hyperframes/commit/9c3258ccbf8f88e0f6656cd358e95f926a09160c), [#7626](https://github.com/heygen-com/hyperframes/pull/7626)).\n- **Producer,docs:** Motion blur's compile hint and preview claim say what is measured ([e09fe6e50](https://github.com/heygen-com/hyperframes/commit/e09fe6e505d7d355c7daa15389b6b9dbe0d74248), [#7581](https://github.com/heygen-com/hyperframes/pull/7581)).\n\n## Internal\n\n- **Tests:** Move gen-os-static asset links to static.heygen.ai ([aadd5bd6f](https://github.com/heygen-com/hyperframes/commit/aadd5bd6f28bbf7c66bd96b1fda429d16eed5623), [#7536](https://github.com/heygen-com/hyperframes/pull/7536)).\n- Give Test (runtime) 15 minutes ([d30f1f4ce](https://github.com/heygen-com/hyperframes/commit/d30f1f4ce42406d7e5cb2c6b70426abf0ef7afa3), [#7627](https://github.com/heygen-com/hyperframes/pull/7627)).\n- **Engine:** The blur trail mask covers the shutter's sweep, not only whole frames ([2df837be9](https://github.com/heygen-com/hyperframes/commit/2df837be9efbe1d4346ee7f19be806dd51c56f16), [#7624](https://github.com/heygen-com/hyperframes/pull/7624)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.40...v0.9.41\n"}
