},{"id":781340742,"node_id":"RA_kwDORi26-c4uklBG","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:ed660ebdb64334f75eec241155fdd5bc8a5014142978efb5fa9510d4e3207505","download_count":5,"created_at":"2026-11-23T03:15:09Z","updated_at":"2026-11-23T03:15:10Z"},{"id":781340587,"node_id":"RA_kwDORi26-c4ukk-r","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132205659,"digest":"sha256:731c2f01b14f5369bbc1bce5d26941a98e9bfdcb1867d9966d886ae23d087228","download_count":10,"created_at":"2026-11-23T03:15:05Z","updated_at":"2026-11-23T03:15:09Z"},{"id":781340793,"node_id":"RA_kwDORi26-c4uklB5","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":395986432,"digest":"sha256:0e526f905a460b8002b1457779eabdf1fd19e4ec883c6ed0727ce580d571f35a","download_count":6,"created_at":"2026-11-23T03:15:10Z","updated_at":"2026-11-23T03:15:26Z"},{"id":781341391,"node_id":"RA_kwDORi26-c4uklLP","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:8fe01c6d7d8be8f890e17abbc48f93754d0fa499de13f6bdc1978408fa1963de","download_count":5,"created_at":"2026-11-23T03:15:27Z","updated_at":"2026-11-23T03:15:27Z"}],"body":"# HyperFrames v0.9.84\n\nReleased on 2026-11-23.\n\nA new blank project opens on an empty timeline again. Leftover render folders are cleaned up reliably on macOS and Windows, and capture finishes on a small host with no GPU.\n\n## Fixes\n\n- **Lint:** A page with thousands of scripts and tags lints in seconds ([148f9deb7](https://github.com/heygen-com/hyperframes/commit/148f9deb771f1c47f834f609e9cc667ab15f36c5), [#8551](https://github.com/heygen-com/hyperframes/pull/8551)).\n- **CLI:** Keep objects sliding offscreen in one shot ([b734a4114](https://github.com/heygen-com/hyperframes/commit/b734a411420e7d5e738d6a07b6a5ac097f40ee74), [#8552](https://github.com/heygen-com/hyperframes/pull/8552)).\n- **Core:** A sealed resize keeps a layer centred by a % translate under the pointer ([effc9586b](https://github.com/heygen-com/hyperframes/commit/effc9586b98cc0d8cb134d6f9251c347098f19af), [#8547](https://github.com/heygen-com/hyperframes/pull/8547)).\n- **Studio:** A sealed preview that can't swap scenes reloads without asking first ([35a0d81c2](https://github.com/heygen-com/hyperframes/commit/35a0d81c2b0e66308bf7049c1bf4f97dced62fac), [#8544](https://github.com/heygen-com/hyperframes/pull/8544)).\n- **Studio:** A new blank project opens on an empty timeline again ([e51b75208](https://github.com/heygen-com/hyperframes/commit/e51b75208ac5933f0174406b95243e181cc00163), [#8546](https://github.com/heygen-com/hyperframes/pull/8546)).\n- **Producer:** A dead render's folder is cleaned up reliably, never another machine's ([3ee763267](https://github.com/heygen-com/hyperframes/commit/3ee763267ccfba4da3baadfba790424660acb843), [#8538](https://github.com/heygen-com/hyperframes/pull/8538)).\n- **Studio:** A sealed scale resize lands where it was dropped ([513dcce82](https://github.com/heygen-com/hyperframes/commit/513dcce820c65d23b944d9c2b355a0da66efbe8e), [#8301](https://github.com/heygen-com/hyperframes/pull/8301)).\n- **Skills:** A pasted figma link alone no longer picks the figma skill ([f246845ba](https://github.com/heygen-com/hyperframes/commit/f246845ba45cd93347d6f8b55beed2e6df89e421), [#8536](https://github.com/heygen-com/hyperframes/pull/8536)).\n- **Studio:** A sealed resize step draws its offset and size in one message, shipped in v0.9.83 ([8521027ff](https://github.com/heygen-com/hyperframes/commit/8521027ffc3b5016219c4062c529b5dae7970f3a), [#8537](https://github.com/heygen-com/hyperframes/pull/8537))\n\n## Performance\n\n- **CLI:** Capture of an animated page finishes on a small host with no GPU ([fff27ce94](https://github.com/heygen-com/hyperframes/commit/fff27ce94419555721a4b327a9c8f383baadb2e9), [#8533](https://github.com/heygen-com/hyperframes/pull/8533)).\n\n## Internal\n\n- **Studio:** Name the draft send by the microtask it waits for ([543fcebb9](https://github.com/heygen-com/hyperframes/commit/543fcebb9abc6d0081d2c121068bf244ac6e3026), [#8541](https://github.com/heygen-com/hyperframes/pull/8541)).\n- A release whose checks fail fails the required Build, so it cannot merge ([014e0b0fb](https://github.com/heygen-com/hyperframes/commit/014e0b0fb8f5776cd88b6ef4f867dec34cbca384), [#8543](https://github.com/heygen-com/hyperframes/pull/8543)).\n- **Studio:** The edit bench reads an undo once Studio says its reload is done ([07949fb80](https://github.com/heygen-com/hyperframes/commit/07949fb80d1e9a2cacb81d7992af9d52819754f4), [#8542](https://github.com/heygen-com/hyperframes/pull/8542)).\n- **Studio Server:** A slow runner no longer leaves index.html's first copy owed in step-ahead tests ([cda1b0082](https://github.com/heygen-com/hyperframes/commit/cda1b008203d841c7de671d9ec34769b87809419), [#8540](https://github.com/heygen-com/hyperframes/pull/8540)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.83...v0.9.84\n"}
