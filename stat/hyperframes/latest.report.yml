"created_at":"2026-11-21T05:25:53Z","updated_at":"2026-11-21T05:25:53Z"}],"body":"# HyperFrames v0.9.75\n\nReleased on 2026-11-21.\n\nSeeking a film with many videos no longer hangs Safari. Opening and pruning history no longer stalls on a slow project folder, and CLI writes never follow a link already in a project.\n\n## Fixes\n\n- **CLI:** Writes into a project folder never follow a link already there ([4a50fb279](https://github.com/heygen-com/hyperframes/commit/4a50fb2798186e3292144f4cee78071cbca7172b), [#8334](https://github.com/heygen-com/hyperframes/pull/8334)).\n- **Studio Server:** History reads a project's folder off the thread when opening and pruning ([63d1bb559](https://github.com/heygen-com/hyperframes/commit/63d1bb5596d0a307b3efa4290a7a3cf3848e090e), [#8340](https://github.com/heygen-com/hyperframes/pull/8340)).\n- **Core:** Look up attribute-selector aliases by sorted key instead of scanning each ([370f09d74](https://github.com/heygen-com/hyperframes/commit/370f09d74ca61020ba51417e7fd375b8bb50ad28), [#8280](https://github.com/heygen-com/hyperframes/pull/8280)).\n- **Media Use:** Read recipe freeze sources only as regular files ([056a13e28](https://github.com/heygen-com/hyperframes/commit/056a13e28ee76ae8eda1d372e01d45d32a25dbc3), [#8325](https://github.com/heygen-com/hyperframes/pull/8325)).\n- **Core:** Seeking a film with many videos no longer hangs Safari ([6515a9080](https://github.com/heygen-com/hyperframes/commit/6515a9080440bfbeffa9380e83f7f8d688e280fa), [#8278](https://github.com/heygen-com/hyperframes/pull/8278)).\n- **CLI:** Show control characters in failure messages as text ([183bc1080](https://github.com/heygen-com/hyperframes/commit/183bc10807b930158cc02ca4d928252ca8211d3e), [#8336](https://github.com/heygen-com/hyperframes/pull/8336)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.74...v0.9.75\n"}
