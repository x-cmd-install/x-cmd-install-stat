\n\nReleased on 2026-10-17.\n\nRendering from inside an agent's macOS sandbox now works, because Chrome starts as one process instead of several that the sandbox blocks.\n\n## Fixes\n\n- **CLI:** Chrome starts inside an agent's macOS sandbox as one process over a pipe ([5e7ba0be944](https://github.com/heygen-com/hyperframes/commit/5e7ba0be944b076d514fc082c25a0b7e35eeb42f), [#5781](https://github.com/heygen-com/hyperframes/pull/5781)).\n- **Gcp Cloud Run:** The BeginFrame contract image resolves the engine's core import ([b18b3e958aa](https://github.com/heygen-com/hyperframes/commit/b18b3e958aa199529fa5fa06728e81b97d520021), [#5785](https://github.com/heygen-com/hyperframes/pull/5785)).\n\n## Internal\n\n- **Studio:** The edit accuracy bench starts one server when node is a Volta shim ([c7151399769](https://github.com/heygen-com/hyperframes/commit/c71513997694f6f56e230d768b6f5c9ed7a73fab), [#5779](https://github.com/heygen-com/hyperframes/pull/5779)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.168...v0.8.169\n"}
