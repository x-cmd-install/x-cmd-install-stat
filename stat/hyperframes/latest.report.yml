ORi26-c4oTUJt","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:2cbe78ea7886efba5850a1b7882225c3f76f4fc0818fcd3dd5ee1a4e108abcc1","download_count":3,"created_at":"2026-10-25T21:18:55Z","updated_at":"2026-10-25T21:18:55Z"},{"id":676151909,"node_id":"RA_kwDORi26-c4oTUJl","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":129276300,"digest":"sha256:4f6ae7f0e9f6d8da51ceab6236d8c2c0822ccc992725609eebec900081a99f53","download_count":11,"created_at":"2026-10-25T21:18:55Z","updated_at":"2026-10-25T21:18:59Z"},{"id":676152067,"node_id":"RA_kwDORi26-c4oTUMD","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-tar","state":"uploaded","size":244653568,"digest":"sha256:98633a6b991cb79f5f0984d9111822f0e686d9e711d6e87bb37ca1474b282b8e","download_count":8,"created_at":"2026-10-25T21:19:00Z","updated_at":"2026-10-25T21:19:08Z"},{"id":676152068,"node_id":"RA_kwDORi26-c4oTUME","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:7987642cd51b142f14f3b36b906536eb96308aa8b742bb5e3d4ce76e8cae7bea","download_count":3,"created_at":"2026-10-25T21:19:00Z","updated_at":"2026-10-25T21:19:00Z"}],"body":"# HyperFrames v0.8.200\n\nReleased on 2026-10-25.\n\nThe preview draws only the scenes near the playhead, so long projects scrub faster. Renders size their capture browsers by frame cost and keep fast capture on for more frames.\n\n## Fixes\n\n- **Producer:** The audio peak correction sizes its cut from the PCM it re-encodes ([1a37db4aee](https://github.com/heygen-com/hyperframes/commit/1a37db4aee9349e6c619313475159e90b49da083), [#6312](https://github.com/heygen-com/hyperframes/pull/6312)).\n\n## Performance\n\n- **Core:** The preview mounts and draws only the scenes near the playhead ([70187a13b5](https://github.com/heygen-com/hyperframes/commit/70187a13b59118cf056f3bcdcd0c0df8f453a9f8), [#6189](https://github.com/heygen-com/hyperframes/pull/6189)).\n- **Engine:** Fast capture stays on for frames a shadow, blur or clip effect does not touch ([c50918277a](https://github.com/heygen-com/hyperframes/commit/c50918277ae69b45677c200e95575faec5fd1519), [#6318](https://github.com/heygen-com/hyperframes/pull/6318)).\n- **Producer:** Size a chunk's capture browsers by its frame cost, not its frame count ([69405a7736](https://github.com/heygen-com/hyperframes/commit/69405a7736830f743dc2a8192c36f26dac99d4ae), [#6319](https://github.com/heygen-com/hyperframes/pull/6319)).\n\n## Internal\n\n- Run cli tests in their own job so runtime tests stop timing out ([8214cdcd29](https://github.com/heygen-com/hyperframes/commit/8214cdcd295de9542a05b8484ccf1b48ed97937b), [#6326](https://github.com/heygen-com/hyperframes/pull/6326)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.199...v0.8.200\n"}
