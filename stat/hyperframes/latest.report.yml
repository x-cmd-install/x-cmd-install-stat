Z"},{"id":798441114,"node_id":"RA_kwDORi26-c4vlz6a","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:9d5510d736dd6512a6ed4cccb91f9c5fe3b515d64c27ebe6e72ddce73392a1c9","download_count":9,"created_at":"2026-11-27T01:25:50Z","updated_at":"2026-11-27T01:25:50Z"},{"id":798440889,"node_id":"RA_kwDORi26-c4vlz25","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":132443521,"digest":"sha256:4e0aa3e96a6daf7ba2b72723e42cb21083e22685741a8e8181260500e2ef74dc","download_count":13,"created_at":"2026-11-27T01:25:45Z","updated_at":"2026-11-27T01:25:50Z"},{"id":798441157,"node_id":"RA_kwDORi26-c4vlz7F","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":396219904,"digest":"sha256:379939468ad390326785aafdd9f0475ae5faf302aa6d8c63dd69922b4b60af33","download_count":13,"created_at":"2026-11-27T01:25:52Z","updated_at":"2026-11-27T01:26:05Z"},{"id":798441902,"node_id":"RA_kwDORi26-c4vl0Gu","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:2e02e7ca829f11a3453b390a80ba84a2ac394f8144287a60eaaa565654a3aebf","download_count":8,"created_at":"2026-11-27T01:26:06Z","updated_at":"2026-11-27T01:26:07Z"}],"body":"# HyperFrames v0.9.102\n\nReleased on 2026-11-27.\n\nStudio stays responsive when a preview asks for paused frames or the disk holding a history lock stops answering. The CLI reports EPIPE crashes from browser pipes, and core starts safely when the page has no body yet.\n\n## Fixes\n\n- **CLI:** Report non-stdio EPIPE crashes and guard launched browser pipes ([bd477dc45](https://github.com/heygen-com/hyperframes/commit/bd477dc45215c70d98879bb5f3cb9f170184e7e9), [#8949](https://github.com/heygen-com/hyperframes/pull/8949)).\n- **Studio Server:** A history lock on a disk that stops answering no longer freezes the app ([281db3bd6](https://github.com/heygen-com/hyperframes/commit/281db3bd6dfd0cb914f44c3bcfd6f752c86d9c4f), [#8948](https://github.com/heygen-com/hyperframes/pull/8948)).\n- **Core:** Guard runtime init and paused video observer when document.body is null ([0c3bd551e](https://github.com/heygen-com/hyperframes/commit/0c3bd551e2cd8dd2d1dcb5540c8240e1120a7d48), [#8936](https://github.com/heygen-com/hyperframes/pull/8936)).\n- **Studio:** Keep the editor responsive when a preview asks for paused frames ([5d0d9945d](https://github.com/heygen-com/hyperframes/commit/5d0d9945d5c44182d8bd04ae1bebbaa257f1cc09), [#8943](https://github.com/heygen-com/hyperframes/pull/8943)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.101...v0.9.102\n"}
