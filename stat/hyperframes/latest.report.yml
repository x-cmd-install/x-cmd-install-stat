ORi26-c4ovEbB","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:5f7e0a96eef7096fa323caab311bcb317ba4a1b64c3632f8b52b545eeb9d5b78","download_count":3,"created_at":"2026-10-28T01:22:15Z","updated_at":"2026-10-28T01:22:15Z"},{"id":683427518,"node_id":"RA_kwDORi26-c4ovEa-","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":129297206,"digest":"sha256:4c2431e91410c3cd0a1ed7be21e6964a1ca7a495f38926ec65a52275b4b103a1","download_count":7,"created_at":"2026-10-28T01:22:15Z","updated_at":"2026-10-28T01:22:21Z"},{"id":683427848,"node_id":"RA_kwDORi26-c4ovEgI","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-tar","state":"uploaded","size":244675584,"digest":"sha256:56754b3b0ad55bef79e94c59ebb19e3f63c0de0d8011837aab4ae6214ca1bf6a","download_count":8,"created_at":"2026-10-28T01:22:22Z","updated_at":"2026-10-28T01:22:32Z"},{"id":683427846,"node_id":"RA_kwDORi26-c4ovEgG","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:208652e6343da5440565e877a511480c4c6160c8358b1285f4a2aab2dad2bd7c","download_count":4,"created_at":"2026-10-28T01:22:22Z","updated_at":"2026-10-28T01:22:22Z"}],"body":"# HyperFrames v0.8.210\n\nReleased on 2026-10-27.\n\nMOV renders can now pick a ProRes profile, and HDR sources render correctly to formats that cannot carry HDR. A page whose renderer crashes now fails at once with a clear reason instead of hanging.\n\n## Features\n\n- **CLI:** Render --prores-profile picks ProRes 4444, hq, 422, lt or proxy for MOV ([957df5c268c66](https://github.com/heygen-com/hyperframes/commit/957df5c268c6622c94879a701c845d35d72d1762), [#6581](https://github.com/heygen-com/hyperframes/pull/6581)).\n- **CLI:** Doctor names the tested ffmpeg build and says loudness is only comparable on it ([98e774384efdc](https://github.com/heygen-com/hyperframes/commit/98e774384efdc785c7d49947948e796a8b8b4004), [#6566](https://github.com/heygen-com/hyperframes/pull/6566)).\n\n## Fixes\n\n- **CLI:** A page whose renderer crashes fails at once, named as the crash ([439d6856780f0](https://github.com/heygen-com/hyperframes/commit/439d6856780f0525d1b1e4a75708c43f8f868536), [#6598](https://github.com/heygen-com/hyperframes/pull/6598)).\n- **Producer:** HDR sources are tone-mapped for formats that cannot carry HDR ([313792408d641](https://github.com/heygen-com/hyperframes/commit/313792408d641f702ea7624fd6abda10c957aab3), [#6597](https://github.com/heygen-com/hyperframes/pull/6597)).\n- **Engine:** Extraction waits out the decode up to a deep seek in a long-GOP video ([3b2058a2b7a2e](https://github.com/heygen-com/hyperframes/commit/3b2058a2b7a2ebb36abd5887c35aa48f7398a389), [#6583](https://github.com/heygen-com/hyperframes/pull/6583)).\n- **Preview:** The proxy copy for the video at the playhead is made ahead of the rest ([bff39004b0312](https://github.com/heygen-com/hyperframes/commit/bff39004b0312ed903fbe0882ec31c6d0b1a0a25), [#6586](https://github.com/heygen-com/hyperframes/pull/6586)).\n- **CLI:** Hyperframes add keeps going when Windows holds the file it replaces ([e21fd123fd8f8](https://github.com/heygen-com/hyperframes/commit/e21fd123fd8f8f1e9231a08546a5bcd6a33b7227), [#6576](https://github.com/heygen-com/hyperframes/pull/6576)).\n- **CLI:** A killed remove-background run no longer leaves its CoreML temp files behind ([0a703edc6f119](https://github.com/heygen-com/hyperframes/commit/0a703edc6f119bbdb8d42d48e259bb745b6cb620), [#6582](https://github.com/heygen-com/hyperframes/pull/6582)).\n- **Engine:** Mux uppercase WebM exports with Opus audio ([1d4aadc1fb436](https://github.com/heygen-com/hyperframes/commit/1d4aadc1fb436daba83184ab8dd894df13513cef), [#6579](https://github.com/heygen-com/hyperframes/pull/6579)).\n- **Producer:** Stop HDR video windows after the first from repeating one frame ([07b0f2cda1cf7](https://github.com/heygen-com/hyperframes/commit/07b0f2cda1cf7b51e0f12d0d05c304b37b4e881c), [#6575](https://github.com/heygen-com/hyperframes/pull/6575)).\n- **CLI:** Check fails a full-frame element that covers every other clip, naming it ([2a0fa7f4de970](https://github.com/heygen-com/hyperframes/commit/2a0fa7f4de9704ef5dd8f88b0e974383914e6c3f), [#6572](https://github.com/heygen-com/hyperframes/pull/6572)).\n- **CLI:** A failed --against reference no longer also says it has no frame ([696ca8f779cd3](https://github.com/heygen-com/hyperframes/commit/696ca8f779cd36bfef53102658722c46e9c3e522), [#6574](https://github.com/heygen-com/hyperframes/pull/6574)).\n- **AWS Lambda:** A network blip no longer stops the release ffmpeg build ([8cd9c517c79be](https://github.com/heygen-com/hyperframes/commit/8cd9c517c79be5ada1878ba58bdffeac6cfe39eb), [#6569](https://github.com/heygen-com/hyperframes/pull/6569)).\n- **CLI:** Capture waits for a mid-read navigation to settle and reads the page again once ([013fe4e18ad7c](https://github.com/heygen-com/hyperframes/commit/013fe4e18ad7c4aa43eb23967abd27ea4e16bf33), [#6567](https://github.com/heygen-com/hyperframes/pull/6567)).\n- **CLI:** A capture DNS helper that dies silently says how it ended ([d571d77cae9d8](https://github.com/heygen-com/hyperframes/commit/d571d77cae9d8ea7ffc1ec7262855fb4905ed859), [#6570](https://github.com/heygen-com/hyperframes/pull/6570)).\n- **Studio:** Keep the canvas outline off the scaled preview iframe ([624c9becfde73](https://github.com/heygen-com/hyperframes/commit/624c9becfde73dc8bc50de00e210807ad1f6d7bd), [#6452](https://github.com/heygen-com/hyperframes/pull/6452)).\n- **CLI:** A snapshot clip whose frame fails is named with ffmpeg's reason ([7a0c75bb69925](https://github.com/heygen-com/hyperframes/commit/7a0c75bb69925205eacd109433fb45ff4385bcae), [#6564](https://github.com/heygen-com/hyperframes/pull/6564)).\n- **CLI:** A nearer copy of another version no longer hides the host's pinned onnxruntime-node ([5561640809154](https://github.com/heygen-com/hyperframes/commit/5561640809154089671bb3b0406ba8e48c99c6f2), [#6563](https://github.com/heygen-com/hyperframes/pull/6563)).\n\n## Docs & Examples\n\n- Link the free lessons from the docs ([0163ee11a75a3](https://github.com/heygen-com/hyperframes/commit/0163ee11a75a3409b9146a642bab0f80c3bdad1b), [#6588](https://github.com/heygen-com/hyperframes/pull/6588)).\n- Links point at hyperframes.studio, the app's new home ([6ae7c7688cec2](https://github.com/heygen-com/hyperframes/commit/6ae7c7688cec29911b66936a24482b1cfb0f9589), [#6585](https://github.com/heygen-com/hyperframes/pull/6585)).\n\n## Internal\n\n- No change-detection or reachability checkout can run into the one-minute limit ([7fea875ede12d](https://github.com/heygen-com/hyperframes/commit/7fea875ede12d4b5d38327520b259113aa21388d), [#6577](https://github.com/heygen-com/hyperframes/pull/6577)).\n- **Engine:** The test Chrome warms its first page in beforeAll; browser hooks get 30 s ([c391b50163d0f](https://github.com/heygen-com/hyperframes/commit/c391b50163d0f4e2b1d7b564c4a39a1cc4193741), [#6568](https://github.com/heygen-com/hyperframes/pull/6568)).\n- **CLI:** Chrome-driving tests run in their own project after the rest ([9b9dd7665499a](https://github.com/heygen-com/hyperframes/commit/9b9dd7665499a128310d3bb26c52b1536918f936), [#6560](https://github.com/heygen-com/hyperframes/pull/6560)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.209...v0.8.210\n"}
