{"id":411276432,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORi26-c4Yg5SQ","tag_name":"v0.8.151","target_commitish":"main","name":"v0.8.151","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-13T04:13:03Z","updated_at":"2026-10-13T04:33:57Z","published_at":"2026-10-13T04:33:55Z","assets":[{"id":635892771,"node_id":"RA_kwDORi26-c4l5vQj","name":"hyperframes-agent-plugin.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":726,"digest":"sha256:6df7b0210b42425903f098c1cdc0a93f74b6d96ec7cc1a45cb1d667490784234","download_count":4,"created_at":"2026-10-13T04:33:57Z","updated_at":"2026-10-13T04:33:57Z"},{"id":635892775,"node_id":"RA_kwDORi26-c4l5vQn","name":"hyperframes-agent-plugin.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":95,"digest":"sha256:c6ac13c3b512e2cb87c98f335bd5e007a8e090c3b64233098f405f4c16151907","download_count":3,"created_at":"2026-10-13T04:33:57Z","updated_at":"2026-10-13T04:33:57Z"},{"id":635892773,"node_id":"RA_kwDORi26-c4l5vQl","name":"hyperframes-agent-plugin.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":11919477,"digest":"sha256:5ebba3786972ebf12e796cc595a930c797ab2763563f54a7bedd2bad32fdcb49","download_count":22,"created_at":"2026-10-13T04:33:57Z","updated_at":"2026-10-13T04:33:57Z"}],"body":"# HyperFrames v0.8.151\n\nReleased on 2026-10-13.\n\nStandard and high-quality exports preserve graded footage without the colour noise introduced by JPEG frame capture. This release also improves ProRes colours, video cuts and animation seeking.\n\n## Features\n\n- **CLI:** Check warns when a tween ends just after a later tween on the same property ([69f3306415](https://github.com/heygen-com/hyperframes/commit/69f33064156a520cdb1c9d63d10bca1c40c75ae2), [#5521](https://github.com/heygen-com/hyperframes/pull/5521)).\n- **Inspector:** Element map, live inspection engine and Node runtime ([072f53cda9](https://github.com/heygen-com/hyperframes/commit/072f53cda9bb648ef0f4e00836825352e6619d39), [#5509](https://github.com/heygen-com/hyperframes/pull/5509)).\n- **Inspector:** Query timelines and inspect the live preview ([f45788bb6d](https://github.com/heygen-com/hyperframes/commit/f45788bb6d3b4a8d51391b841c815ac6444d2f34), [#5508](https://github.com/heygen-com/hyperframes/pull/5508)).\n- **Inspector:** Add the component inspector package ([73bbd378df](https://github.com/heygen-com/hyperframes/commit/73bbd378df6cce37cc8885585018b3055ead8f22), [#5507](https://github.com/heygen-com/hyperframes/pull/5507)).\n- **CLI:** Snapshot a time range or one composition ([1cd086f7e3](https://github.com/heygen-com/hyperframes/commit/1cd086f7e3675c992492714250a09cd36989a5c6), [#5519](https://github.com/heygen-com/hyperframes/pull/5519)).\n\n## Fixes\n\n- **Producer:** Stop JPEG frame capture adding colour noise to graded footage ([f073281bd9](https://github.com/heygen-com/hyperframes/commit/f073281bd9e81b24d86c646feb863504e4d685f0), [#5514](https://github.com/heygen-com/hyperframes/pull/5514)).\n- **CLI:** Resolve the render worker's tsx loader from the CLI install ([e9216456a5](https://github.com/heygen-com/hyperframes/commit/e9216456a523f0c5e2894ac076dc5950c32aae1a), [#5517](https://github.com/heygen-com/hyperframes/pull/5517)).\n- **Lint:** Read a sub-composition's linked stylesheet from the project root ([9713e93a52](https://github.com/heygen-com/hyperframes/commit/9713e93a52c4c373a287e10ac977d51298697fc5), [#5084](https://github.com/heygen-com/hyperframes/pull/5084)).\n- **Engine:** Encode and tag ProRes mov output as BT.709 ([c8e105dc92](https://github.com/heygen-com/hyperframes/commit/c8e105dc9281d29ccd667a72f3cc9f970b1b862f), [#5382](https://github.com/heygen-com/hyperframes/pull/5382)).\n- **Media Use:** Transcript-cut video renders without repeated frames or a keyframe warning ([1d2aa5240d](https://github.com/heygen-com/hyperframes/commit/1d2aa5240d2126ca2763eeffd1bd87c69f2b772d), [#5463](https://github.com/heygen-com/hyperframes/pull/5463)).\n- **CLI:** Say when the Docker image build times out instead of blaming Docker ([3bf9035d2a](https://github.com/heygen-com/hyperframes/commit/3bf9035d2aaee5f90e901576e2d7e548f68cc5f2), [#5394](https://github.com/heygen-com/hyperframes/pull/5394)).\n- **Media Use:** Keep frame precision on transcript-cut seek boundaries ([b71c9f4e1b](https://github.com/heygen-com/hyperframes/commit/b71c9f4e1b3228d51556d910c4836b0803af0251), [#5426](https://github.com/heygen-com/hyperframes/pull/5426)).\n- **Media Use:** Honor telemetryEnabled: false from shared config in optedOut ([1577060dc1](https://github.com/heygen-com/hyperframes/commit/1577060dc182e023d121fddcdffe2589ace1325b), [#5490](https://github.com/heygen-com/hyperframes/pull/5490)).\n- **Studio:** Splitting a video in an untimed wrapper cuts the video, not the wrapper ([aa9413b05e](https://github.com/heygen-com/hyperframes/commit/aa9413b05ebba83eb1c96f3ebdb707ba51cf1897), [#5486](https://github.com/heygen-com/hyperframes/pull/5486)).\n- **Core:** An animation playing at its first seek shows the sought time ([5e6e58fc9b](https://github.com/heygen-com/hyperframes/commit/5e6e58fc9baee3cc1b7b3cda937280b7be573b6e), [#5503](https://github.com/heygen-com/hyperframes/pull/5503)).\n- **Media:** Read ElevenLabs input as UTF-8 ([ea7a4e433f](https://github.com/heygen-com/hyperframes/commit/ea7a4e433f8c646825cfb25ef468461bc5047814), [#5469](https://github.com/heygen-com/hyperframes/pull/5469)).\n- **Media Use:** Clean up temporary TTS text directories ([73d89b81c7](https://github.com/heygen-com/hyperframes/commit/73d89b81c7617c22fcfcb2e5d182faa8b9410776), [#5477](https://github.com/heygen-com/hyperframes/pull/5477)).\n- **Skills:** Reject occlusion timeout before verdict ([4120042ca3](https://github.com/heygen-com/hyperframes/commit/4120042ca3b8e4c6e09ab9b76ce988d56837687b), [#5491](https://github.com/heygen-com/hyperframes/pull/5491)).\n\n## Docs & Examples\n\n- **Lint:** Add a reference page for every lint finding code ([c3816a121b](https://github.com/heygen-com/hyperframes/commit/c3816a121b0dae08af2e3bf13df9d2fe225628bf), [#5493](https://github.com/heygen-com/hyperframes/pull/5493)).\n- **CLI:** Document open, catch-up, timeline and history ([2973b3c8e4](https://github.com/heygen-com/hyperframes/commit/2973b3c8e4464a2cd454d0909dd59c4277afd6f3), [#5442](https://github.com/heygen-com/hyperframes/pull/5442)).\n- **Changelog:** Weekly digest 2026-10-05\u20132026-10-12 ([86ff462d21](https://github.com/heygen-com/hyperframes/commit/86ff462d21b5f72b52cb2762dee60491b58dc531), [#5497](https://github.com/heygen-com/hyperframes/pull/5497)).\n- **Changelog:** Weekly digest 2026-09-28-2026-10-05 ([0e535ac6ab](https://github.com/heygen-com/hyperframes/commit/0e535ac6abb1a92a93260f88157bfd77961bf678), [#5076](https://github.com/heygen-com/hyperframes/pull/5076)).\n\n## Catalog\n\n- **Catalog:** Publish generated catalog ([ab06445439](https://github.com/heygen-com/hyperframes/commit/ab06445439333ce23eb5e415f9c51e3bd3ac461d), [#5500](https://github.com/heygen-com/hyperframes/pull/5500)).\n- **Registry:** Clamp filmed-screen's curve and vignette ([37a79e9371](https://github.com/heygen-com/hyperframes/commit/37a79e93717b38ca5e856f075dc528ebc8e1c894), [#5501](https://github.com/heygen-com/hyperframes/pull/5501)).\n- **Registry:** Filmed-screen curves, orbits and follows typing by default ([3886aaec28](https://github.com/heygen-com/hyperframes/commit/3886aaec28ae1ccf8ce3a0bd1bd48a084c353fa9), [#5499](https://github.com/heygen-com/hyperframes/pull/5499)).\n- **Catalog:** Publish generated catalog ([4f941de0da](https://github.com/heygen-com/hyperframes/commit/4f941de0da1aab8bd741c788a07e75b7fd482bb2), [#5498](https://github.com/heygen-com/hyperframes/pull/5498)).\n- **Registry:** Add filmed-screen component ([071ce8044f](https://github.com/heygen-com/hyperframes/commit/071ce8044fd98736f80278e8c2645e97628430d0), [#5487](https://github.com/heygen-com/hyperframes/pull/5487)).\n\n## Internal\n\n- **Core:** Share keyframe property defaults between SDK and Studio ([b100ff16f3](https://github.com/heygen-com/hyperframes/commit/b100ff16f3d1783c30ebb0b428bb7b5e230e3a5e), [#5438](https://github.com/heygen-com/hyperframes/pull/5438)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.150...v0.8.151\n"}
