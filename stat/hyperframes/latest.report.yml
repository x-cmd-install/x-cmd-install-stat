{"id":395248931,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORi26-c4XjwUj","tag_name":"v0.8.70","target_commitish":"main","name":"v0.8.70","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-24T02:10:27Z","updated_at":"2026-09-24T02:15:33Z","published_at":"2026-09-24T02:15:33Z","assets":[],"body":"# HyperFrames v0.8.70\n\nReleased on 2026-09-24.\n\nFilms whose animations run past the narration now report their real length, so players show the right total. Media skills gain Gemini voices, layout checks catch more hidden text, and Studio shows a film's first frame sooner.\n\n## Features\n\n- Add Gemini TTS models and service-account auth to media skills ([01601d110](https://github.com/heygen-com/hyperframes/commit/01601d110569967adbfe998e81f77bdeec4b1f2d), [#4377](https://github.com/heygen-com/hyperframes/pull/4377)).\n\n## Fixes\n\n- **Layout:** Flag nowrap text that still sticks out of a container that does not clip ([549a2f51b](https://github.com/heygen-com/hyperframes/commit/549a2f51bb268b6af3e56e2f3f9ab305185bd3b5), [#4379](https://github.com/heygen-com/hyperframes/pull/4379)).\n- **Layout:** Keep covered text flagged when the occlusion waiver is on a wrapper ([625bdd66f](https://github.com/heygen-com/hyperframes/commit/625bdd66fa0b017dc93de0c2098d0f2d0e1cf1bf), [#4380](https://github.com/heygen-com/hyperframes/pull/4380)).\n- **Core:** The runtime never reports a film's length as Infinity ([c6913aabe](https://github.com/heygen-com/hyperframes/commit/c6913aabe26c985111769716539c6b9a8508d831), [#4372](https://github.com/heygen-com/hyperframes/pull/4372)).\n\n## Performance\n\n- **Studio:** Show a film's first frame sooner by loading preview assets by URL ([86fa10ced](https://github.com/heygen-com/hyperframes/commit/86fa10ced4297bfd9f4fe67b6767afae7a07fd3c), [#4357](https://github.com/heygen-com/hyperframes/pull/4357)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.69...v0.8.70\n"}
