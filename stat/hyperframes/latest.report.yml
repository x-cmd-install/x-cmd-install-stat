n\nReleased on 2026-10-02.\n\nRenaming a file in Studio now rewrites only the references that point at it, and keyframe edits no longer copy other animations' values. Manual edits also stay under 8 ms per frame, and Studio reads modern CSS colors.\n\n## Fixes\n\n- **Studio Server:** A rename rewrites only references that name the renamed path ([1168bb740d33](https://github.com/heygen-com/hyperframes/commit/1168bb740d336f366849c91308a3c2bbb850c570), [#4915](https://github.com/heygen-com/hyperframes/pull/4915)).\n- **Studio:** Parse modern CSS colors without a new dependency ([5c52f72399e2](https://github.com/heygen-com/hyperframes/commit/5c52f72399e21f8dcf3ede2bf2d24978c6522a94), [#3931](https://github.com/heygen-com/hyperframes/pull/3931)).\n- **Studio:** Keep a keyframe edit from copying other tweens' channels ([dc9c38efd8f6](https://github.com/heygen-com/hyperframes/commit/dc9c38efd8f6eadefb654d73f55e6e8671a1c8f4), [#4918](https://github.com/heygen-com/hyperframes/pull/4918)).\n- **CLI:** Select containing source frames in snapshots ([0d3d42320015](https://github.com/heygen-com/hyperframes/commit/0d3d423200153fa96d82ca5bc5b91565b87e5f29), [#4809](https://github.com/heygen-com/hyperframes/pull/4809)).\n- **Studio:** One GSAP-writes check that sees every keyframe form ([00b61b8b7611](https://github.com/heygen-com/hyperframes/commit/00b61b8b7611f68e3c52f29314015b00cd241bf6), [#4781](https://github.com/heygen-com/hyperframes/pull/4781)).\n- **CLI:** A background preview launch keeps only the server its own child started ([fd2f90c7d81d](https://github.com/heygen-com/hyperframes/commit/fd2f90c7d81d4c2a57848bb21e225cbccc66ec4f), [#4914](https://github.com/heygen-com/hyperframes/pull/4914)).\n\n## Performance\n\n- **Studio:** Manual edits stay under 8 ms per frame ([438ea9d59fd5](https://github.com/heygen-com/hyperframes/commit/438ea9d59fd5c1e720cc55311150dd3b25fab3db), [#4898](https://github.com/heygen-com/hyperframes/pull/4898)).\n\n## Internal\n\n- **Studio:** Give the real-Chrome undo test a time budget Windows can meet ([d5b56426c2a6](https://github.com/heygen-com/hyperframes/commit/d5b56426c2a65eddce404e74b04992fff2c2b87d), [#4912](https://github.com/heygen-com/hyperframes/pull/4912)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.113...v0.8.114\n"}
