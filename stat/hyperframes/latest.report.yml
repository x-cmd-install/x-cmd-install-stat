Ri26-c4s6DfE","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:005c7bb31f13d8746bcc1f1e79e52e7ddc49c9f75c1d8d1e4c3f3a21ddb59539","download_count":19,"created_at":"2026-11-16T04:17:36Z","updated_at":"2026-11-16T04:17:36Z"},{"id":753416134,"node_id":"RA_kwDORi26-c4s6DfG","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":131024599,"digest":"sha256:04f84ea2d290ade05cf24157ed5df9a135086af0cba3feff44a04914228043b1","download_count":9,"created_at":"2026-11-16T04:17:36Z","updated_at":"2026-11-16T04:17:40Z"},{"id":753416314,"node_id":"RA_kwDORi26-c4s6Dh6","name":"hyperframes-lambda-video-arm64.oci.tar","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-tar","state":"uploaded","size":246165504,"digest":"sha256:55ac05220d89d9089ee9cdb581ef9cfa143484a6af62d4e21058d4194e8d61e5","download_count":5,"created_at":"2026-11-16T04:17:41Z","updated_at":"2026-11-16T04:17:47Z"},{"id":753416313,"node_id":"RA_kwDORi26-c4s6Dh5","name":"hyperframes-lambda-video-arm64.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:a6d128bdbeb00b7cbd48cc96bdff31e920bc91d4d5b22db612c0453b48cf23ff","download_count":22,"created_at":"2026-11-16T04:17:41Z","updated_at":"2026-11-16T04:17:41Z"}],"body":"# HyperFrames v0.9.56\n\nReleased on 2026-11-16.\n\nStudio's preview and the local servers now act only for their own pages. The CLI keeps its cache, history and restores inside the project. The arm64 Lambda image ships only the reviewed ffmpeg build, and large previews build faster.\n\n## Fixes\n\n- **Studio Server:** The composition file servers no longer serve credential or tool-state files ([014326b40](https://github.com/heygen-com/hyperframes/commit/014326b40bf22bebb77a5cf08a50d5b0968c112e), [#7889](https://github.com/heygen-com/hyperframes/pull/7889)).\n- **Studio Server:** Lint and probe run only for requests from Studio's own pages ([bbac8900e](https://github.com/heygen-com/hyperframes/commit/bbac8900ea9201dca8aacdd17387e3275a9e6d84), [#7894](https://github.com/heygen-com/hyperframes/pull/7894)).\n- **Studio Server:** A history restore stays inside the project and uses only intact copies ([478313ba0](https://github.com/heygen-com/hyperframes/commit/478313ba0e674d51c3b307afa862de8dd87afcf9), [#7902](https://github.com/heygen-com/hyperframes/pull/7902)).\n- **Studio:** Take playback works for a preview its server made opaque ([1e542956d](https://github.com/heygen-com/hyperframes/commit/1e542956d978ceb6be9e50c8396ffdcf2c0fc433), [#7815](https://github.com/heygen-com/hyperframes/pull/7815)).\n- **Studio:** The preview frame keeps the sandbox origin its host set ([b650d0d19](https://github.com/heygen-com/hyperframes/commit/b650d0d198bae4dfd440ba2bad32b4a2351862aa), [#7886](https://github.com/heygen-com/hyperframes/pull/7886)).\n- **Studio:** Present decks open only in their own site, and the preview reads only its own frame's messages ([4067efc45](https://github.com/heygen-com/hyperframes/commit/4067efc454382463979f0625e8e031a73ff05b9d), [#7877](https://github.com/heygen-com/hyperframes/pull/7877)).\n- **Core:** The runtime bridge checks each control message before acting on it ([97d8f26e7](https://github.com/heygen-com/hyperframes/commit/97d8f26e713987cbb9f2ba6cb7d45eb3481a9093), [#7892](https://github.com/heygen-com/hyperframes/pull/7892)).\n- **CLI:** `render --docker` keeps the host's page-network restriction inside the container ([5d8605eb8](https://github.com/heygen-com/hyperframes/commit/5d8605eb8e56fa6de714482e99c9f63cd258581a), [#7890](https://github.com/heygen-com/hyperframes/pull/7890)).\n- **CLI:** `preview --stop` stops only the process the system reports holding the port ([ace8a78dc](https://github.com/heygen-com/hyperframes/commit/ace8a78dcc14499b82b077301bcc4633c99e66c6), [#7882](https://github.com/heygen-com/hyperframes/pull/7882)).\n- **CLI:** The check cache is saved only as a project record, never through a linked file ([7801e3ff3](https://github.com/heygen-com/hyperframes/commit/7801e3ff346f65d994ef64d9c5d067f3dcd52b87), [#7884](https://github.com/heygen-com/hyperframes/pull/7884)).\n- **CLI:** History turn ids read from the project folder are checked and sent encoded ([6efa6b635](https://github.com/heygen-com/hyperframes/commit/6efa6b63536970758b56c210d12ec581c4e82261), [#7883](https://github.com/heygen-com/hyperframes/pull/7883)).\n- **CLI:** Catch-up lists only the turns the app added after the hand-off ([0f23f40f8](https://github.com/heygen-com/hyperframes/commit/0f23f40f8b06761a57922c85721209d6c4943f25), [#7874](https://github.com/heygen-com/hyperframes/pull/7874)).\n- **CLI:** A received-files record in a folder under the project counts for a render ([1c159c550](https://github.com/heygen-com/hyperframes/commit/1c159c550d27d267a9ee8d0d6759691147cd8a1d), [#7900](https://github.com/heygen-com/hyperframes/pull/7900)).\n- **CLI:** Media-use copies only the sound effects its bundled index names ([ed93a1312](https://github.com/heygen-com/hyperframes/commit/ed93a131251a1ae6c21fd3908c86f9972765d5c6), [#7895](https://github.com/heygen-com/hyperframes/pull/7895)).\n- **Media Use:** Local models start from a folder outside the project ([756c2c6c1](https://github.com/heygen-com/hyperframes/commit/756c2c6c1b3446873e0e5547f1f5c02697293acf), [#7888](https://github.com/heygen-com/hyperframes/pull/7888)).\n- **Engine:** A cached browser is used only when its files match the pinned build ([56a2d0c53](https://github.com/heygen-com/hyperframes/commit/56a2d0c53ff8d3353ad0e0c56d518e8862484ac4), [#7865](https://github.com/heygen-com/hyperframes/pull/7865)).\n- **Engine:** Timeline frame predictions stay within the render's frames ([f5a74a567](https://github.com/heygen-com/hyperframes/commit/f5a74a567884443e136762a39b2c0bac1a9f43d9), [#7885](https://github.com/heygen-com/hyperframes/pull/7885)).\n- **Engine:** Each superset extraction works in a folder of its own ([a4139e9ea](https://github.com/heygen-com/hyperframes/commit/a4139e9ead02bea455feb3409c0076d2de050896), [#7901](https://github.com/heygen-com/hyperframes/pull/7901)).\n- **Parsers:** Reading a canvas scaffold's width and height takes the same short time on any input ([b856a1d63](https://github.com/heygen-com/hyperframes/commit/b856a1d63fed7443bcdad5b2246983e33f7e3aac), [#7873](https://github.com/heygen-com/hyperframes/pull/7873)).\n- **Lint:** Agent-made scenes and sound effects stay on one timeline lane ([98208241e](https://github.com/heygen-com/hyperframes/commit/98208241e7800122607db651d961bcc26a724077), [#7775](https://github.com/heygen-com/hyperframes/pull/7775)).\n- **Skills:** Standalone installs run the CLI through its launcher too ([3fc3050bc](https://github.com/heygen-com/hyperframes/commit/3fc3050bc38a41f76a39ab50e075bdbf13120418), [#7879](https://github.com/heygen-com/hyperframes/pull/7879)).\n- **AWS Lambda:** A release ships the arm64 ffmpeg only when it matches the digest committed beside its build ([d9488119b](https://github.com/heygen-com/hyperframes/commit/d9488119beb6470015fcfb9e21f90a384baf822c), [#7872](https://github.com/heygen-com/hyperframes/pull/7872)).\n\n## Performance\n\n- **Core:** A preview build reads a large page without copying it on every pass ([082d63683](https://github.com/heygen-com/hyperframes/commit/082d63683f8b599c35fda3567ca1ed0659a30cac), [#7878](https://github.com/heygen-com/hyperframes/pull/7878)).\n- **Producer:** Compile and render-telemetry tag scans take time in step with the page's size ([82fdf406c](https://github.com/heygen-com/hyperframes/commit/82fdf406c43851ac75a82a0d49aa944cdc955254), [#7896](https://github.com/heygen-com/hyperframes/pull/7896)).\n\n## Internal\n\n- **Publish:** Every npm publish waits on the npm-publish approval ([a54de748e](https://github.com/heygen-com/hyperframes/commit/a54de748ee3d89d05ff8c0b0bedcf65c8714b661), [#7870](https://github.com/heygen-com/hyperframes/pull/7870)).\n- **Publish:** Prebuilt tarballs publish from a job that runs no code from the release commit ([af0560c85](https://github.com/heygen-com/hyperframes/commit/af0560c8598a5196f51bb45baf406ae50a213c6b), [#7869](https://github.com/heygen-com/hyperframes/pull/7869)).\n- **CI:** Publishing workflows run only for main ([7bd6b9daf](https://github.com/heygen-com/hyperframes/commit/7bd6b9daf89faf95b6ed46dbd6b84ec8c5de1c00), [#7875](https://github.com/heygen-com/hyperframes/pull/7875)).\n- **CI:** Test fixtures no longer look like real HeyGen keys, and CI rejects one that does ([5dc3b336a](https://github.com/heygen-com/hyperframes/commit/5dc3b336aa186f7e2e019ee8039f195befe8383a), [#7876](https://github.com/heygen-com/hyperframes/pull/7876)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.55...v0.9.56\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
