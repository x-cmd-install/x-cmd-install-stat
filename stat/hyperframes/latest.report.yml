ORi26-c4nOtXh","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:843a1689c7b64874fbb9fda0ac02477578c95f73fb684d644cb1199644903fd1","download_count":2,"created_at":"2026-10-20T03:37:06Z","updated_at":"2026-10-20T03:37:07Z"},{"id":658167260,"node_id":"RA_kwDORi26-c4nOtXc","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":129250221,"digest":"sha256:547401886f6fd729e0e12ad07bdebfdaf990972c22efadcd6129ea1af6b8b525","download_count":4,"created_at":"2026-10-20T03:37:06Z","updated_at":"2026-10-20T03:37:10Z"}],"body":"# HyperFrames v0.8.181\n\nReleased on 2026-10-20.\n\nLong phone-video exports no longer time out or stall before the first frame, and the cloud render plan checks audio peaks faster. Studio keeps an edit preview waiting while its window draws no frames.\n\n## Fixes\n\n- **Studio:** Keep an edit's preview waiting while the window draws no frames ([f5033879f](https://github.com/heygen-com/hyperframes/commit/f5033879f763e532bc1b6be146ce0e7503f2a4f3), [#5926](https://github.com/heygen-com/hyperframes/pull/5926)).\n- **Engine:** Long phone-video exports neither time out nor stall before the first frame ([472ee43c3](https://github.com/heygen-com/hyperframes/commit/472ee43c3a26128ea6ac493e20709d65c0edb3c3), [#5921](https://github.com/heygen-com/hyperframes/pull/5921)).\n\n## Performance\n\n- **Producer:** The plan's true-peak check runs in parallel segments ([c77061e3a](https://github.com/heygen-com/hyperframes/commit/c77061e3af548b84b3666a06400486cdea70e92b), [#5925](https://github.com/heygen-com/hyperframes/pull/5925)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.180...v0.8.181\n"}
