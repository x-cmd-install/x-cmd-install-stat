:7,"created_at":"2026-11-24T05:54:07Z","updated_at":"2026-11-24T05:54:07Z"}],"body":"# HyperFrames v0.9.88\n\nReleased on 2026-11-24.\n\nA cloud render no longer stops a chunk as stalled while its video frames are still extracting. The 4K clip on screen plays its own file while its lighter preview copy is made, instead of showing a still.\n\n## Fixes\n\n- **Producer:** A cloud chunk is not stopped as stalled while its video frames are still extracting ([8cdf5b22dc](https://github.com/heygen-com/hyperframes/commit/8cdf5b22dc2edf6766d2cd8c17e3b8d35883cdfa), [#8632](https://github.com/heygen-com/hyperframes/pull/8632)).\n- **Player:** A film ready before load no longer times the frame's next own document from it ([779bed5c0a](https://github.com/heygen-com/hyperframes/commit/779bed5c0a6da3c7364d441f8945c2d8a54a8cbe), [#8634](https://github.com/heygen-com/hyperframes/pull/8634))\n- **Studio:** A media reader reads only the file it was opened on ([d04d8fe468](https://github.com/heygen-com/hyperframes/commit/d04d8fe4682b3672b13083da3c82e5f6966e9b78), [#8630](https://github.com/heygen-com/hyperframes/pull/8630)).\n- **CLI:** Announce publish deprecation for new projects ([57ffe0b07d](https://github.com/heygen-com/hyperframes/commit/57ffe0b07d52a7d15da30107077b83786f8a19d5), [#8629](https://github.com/heygen-com/hyperframes/pull/8629)).\n- **Core:** A held clip shows its own frame, not black, while its lighter copy is made ([66eeb13a92](https://github.com/heygen-com/hyperframes/commit/66eeb13a92f225bcc4d706ef15233defc61c1c70), [#8618](https://github.com/heygen-com/hyperframes/pull/8618))\n- **Core:** The 4K clip on screen plays its own file while its preview copy is made ([e2fe0e6f53](https://github.com/heygen-com/hyperframes/commit/e2fe0e6f53430f80efe50883e3d4dab86299689d), [#8602](https://github.com/heygen-com/hyperframes/pull/8602)).\n- **CLI:** Layout check reads black covers as opaque and scores modern-colour gradients ([c9f9a52077](https://github.com/heygen-com/hyperframes/commit/c9f9a5207778f9f3efe7db064f95ef4b9357269b), [#8628](https://github.com/heygen-com/hyperframes/pull/8628)).\n- **Studio:** A failed preview's retry button takes a click again ([df57e691cb](https://github.com/heygen-com/hyperframes/commit/df57e691cbe95dc96f2c87fd868e04b5fdcd8085), [#8610](https://github.com/heygen-com/hyperframes/pull/8610)).\n\n## Docs & Examples\n\n- The quickstart's first door opens HyperFrames Studio in the browser, the download beside it ([34c7e64bb1](https://github.com/heygen-com/hyperframes/commit/34c7e64bb1997103474dbd0ab155767ff84f8543), [#8625](https://github.com/heygen-com/hyperframes/pull/8625)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.9.87...v0.9.88\n"}
