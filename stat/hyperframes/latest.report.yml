":"2026-10-28T17:27:08Z"}],"body":"# HyperFrames v0.8.214\n\nReleased on 2026-10-28.\n\nA lane of clips can now share one colour grade, so grading a camera means editing one element. A grade can also be baked into a 3D LUT that matches the preview.\n\n## Features\n\n- **Core:** Grade groups grade a whole lane from one hf-color-group ([09b129047](https://github.com/heygen-com/hyperframes/commit/09b12904748b71ab1777d335f20026d45d6944ca), [#6678](https://github.com/heygen-com/hyperframes/pull/6678)).\n- **Core:** Bake a colour grade into a 3D LUT (.cube) ([c9017f45f](https://github.com/heygen-com/hyperframes/commit/c9017f45f4b8c38e11396a70a3d05d3432c58b48), [#6679](https://github.com/heygen-com/hyperframes/pull/6679)).\n\n## Fixes\n\n- **Studio:** A tab's save keeps the newer video version another tab recorded ([348971c22](https://github.com/heygen-com/hyperframes/commit/348971c22285421a062ab5df45ad94bb4680bf9c), [#6682](https://github.com/heygen-com/hyperframes/pull/6682)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.213...v0.8.214\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":2,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
