DORi26-c4nuvRb","name":"hyperframes-lambda-handler.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":97,"digest":"sha256:7faa039a6fea7bd13b6faf0f8609864eaa5065fd15b1310ada12cdc911372b2b","download_count":3,"created_at":"2026-10-22T17:28:34Z","updated_at":"2026-10-22T17:28:34Z"},{"id":666563674,"node_id":"RA_kwDORi26-c4nuvRa","name":"hyperframes-lambda-handler.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":129247659,"digest":"sha256:fa8555652527ad7daeefe1bc843eca96e7be7a8b2be310d1d0686a2347dd7ef1","download_count":8,"created_at":"2026-10-22T17:28:34Z","updated_at":"2026-10-22T17:28:40Z"}],"body":"# HyperFrames v0.8.186\n\nReleased on 2026-10-22.\n\nCapture motion blur now reaches renders and Studio, and it turns itself off, saying why, on pages it cannot blur safely. `hyperframes history` lists its entries even when it cannot write them, and `init --video` frames the project to the clip's shape.\n\n## Features\n\n- **CLI:** Read a whole recording as voice, effect and music lines ([2c1d9d50d](https://github.com/heygen-com/hyperframes/commit/2c1d9d50d239d48862578f574c25de216be02746), [#6056](https://github.com/heygen-com/hyperframes/pull/6056)).\n- **CLI:** Tell authors in check why motion blur is off ([4371981b7](https://github.com/heygen-com/hyperframes/commit/4371981b740d92f70e520cfbec34db68a1c93434), [#5992](https://github.com/heygen-com/hyperframes/pull/5992)).\n- **Core,engine:** Report why blur is off, and what each render session did ([38f6e01c2](https://github.com/heygen-com/hyperframes/commit/38f6e01c2be3e29770df4b62f24cf734e385b707), [#5991](https://github.com/heygen-com/hyperframes/pull/5991)).\n- **Core,producer:** Decide blur defects once per timeline, off on routes that cannot host it ([08c185d90](https://github.com/heygen-com/hyperframes/commit/08c185d908d657f6142f3cc9ff118b9e29151616), [#5990](https://github.com/heygen-com/hyperframes/pull/5990)).\n- **Core:** Block capture motion blur on html-in-canvas defects ([536346c5d](https://github.com/heygen-com/hyperframes/commit/536346c5d1e63a8a840bb0a8ba9423ffbab24502), [#5971](https://github.com/heygen-com/hyperframes/pull/5971)).\n- **Core,engine:** Track accelerated canvases before any page script runs ([0865b6f36](https://github.com/heygen-com/hyperframes/commit/0865b6f36d42a52247bf03de9db3ec9139ed8640), [#5970](https://github.com/heygen-com/hyperframes/pull/5970)).\n- **Producer,studio:** Wire capture motion blur into renders and Studio ([1f8ead7bd](https://github.com/heygen-com/hyperframes/commit/1f8ead7bde73a2acb9ff1c5b6327ad0153bd09b8), [#5969](https://github.com/heygen-com/hyperframes/pull/5969)).\n\n## Fixes\n\n- **CLI:** History lists its entries even when this run cannot write the history ([934c88bac](https://github.com/heygen-com/hyperframes/commit/934c88bac8cf6dc37db07cecf3bd0b58314c9921), [#6061](https://github.com/heygen-com/hyperframes/pull/6061)).\n- **CLI:** Init --video frames the project to the clip's shape, so nothing is cropped ([86b90bb42](https://github.com/heygen-com/hyperframes/commit/86b90bb424cd3f121419a15e930f17478afc0ea4), [#5984](https://github.com/heygen-com/hyperframes/pull/5984)).\n- **Core:** A clip's volume lane stays smooth in preview while the page is busy ([cfff4493d](https://github.com/heygen-com/hyperframes/commit/cfff4493dfc6ec2edb6f88295009fd89eebfd6c5), [#6057](https://github.com/heygen-com/hyperframes/pull/6057)).\n- **CLI:** A check that runs out of time says which step it was in and how long each took ([2ef60f3f2](https://github.com/heygen-com/hyperframes/commit/2ef60f3f26fd51ecf86dc9baa081f7e2b9982a67), [#6060](https://github.com/heygen-com/hyperframes/pull/6060)).\n- **Ci:** Packed consumer installs keep same-day dependency bumps on every Bun release ([2faf660ac](https://github.com/heygen-com/hyperframes/commit/2faf660ac1298af0205ebb34028ff45ad5293145), [#6059](https://github.com/heygen-com/hyperframes/pull/6059)).\n- **CLI:** Keep whisper CJK tokens as separate timed words ([3a0caeeb2](https://github.com/heygen-com/hyperframes/commit/3a0caeeb2da8c6428612e67d634b5accaed94fe2), [#6058](https://github.com/heygen-com/hyperframes/pull/6058)).\n\n## Docs & Examples\n\n- Say background removal can drop objects a person holds ([8d6ceb735](https://github.com/heygen-com/hyperframes/commit/8d6ceb73598206b2735827d22fcac545f293cd8d), [#6002](https://github.com/heygen-com/hyperframes/pull/6002)).\n- Rename the Workflows nav group to Make a video and drop retired workflow steps ([c4edac305](https://github.com/heygen-com/hyperframes/commit/c4edac305621f27070e0fa12132fbb6a0ab51004), [#5655](https://github.com/heygen-com/hyperframes/pull/5655)).\n\n## Internal\n\n- **Skills:** Hide retired skills on ClawHub once the sync has run ([f5873b808](https://github.com/heygen-com/hyperframes/commit/f5873b80892274cb4cfc063f680bbe539c396baf), [#5656](https://github.com/heygen-com/hyperframes/pull/5656)).\n- **Core:** Raise the unpacked size budget for capture motion blur's defect checks ([14e4772b3](https://github.com/heygen-com/hyperframes/commit/14e4772b36cca08986aa791c49f1e1dcb26eddaa), [#6055](https://github.com/heygen-com/hyperframes/pull/6055)).\n\n## Full changelog\n\nhttps://github.com/heygen-com/hyperframes/compare/v0.8.185...v0.8.186\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
