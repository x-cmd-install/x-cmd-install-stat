{"id":300668889,"author":{"login":"payne0420","id":10525363,"node_id":"MDQ6VXNlcjEwNTI1MzYz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOsvYA84R69fZ","tag_name":"v2.3.5","target_commitish":"main","name":"dtop v2.3.5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-03-24T12:45:03Z","updated_at":"2026-03-24T12:45:12Z","published_at":"2026-03-24T12:45:12Z","assets":[],"body":"## What's changed\n\n- **Tmux**: Removed `tmux set-option` mouse toggling. Mouse is session-scoped in tmux, so the old `-p` usage could break other windows. dtop now relies on XTerm mouse tracking escape sequences (plus Textual's driver) so tmux forwards wheel/clicks without changing session options.\n\nInstall: `pip install dtop==2.3.5`"}
