","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:a8e8814b910571c416bce09f15d721b04109c0865eafeaad9af347a6cd72f198","download_count":14,"created_at":"2026-05-26T15:38:20Z","updated_at":"2026-05-26T15:38:20Z"}],"body":"## Release Notes\n\n### Added\n- `SourceCode` paragraph style renders as a distinct code block in all export formats and the TUI ([#76](https://github.com/bgreenwell/doxx/issues/76))\n- Text inside `wps:txbx` shape text boxes is now extracted and rendered with box-drawing borders instead of being silently dropped ([#76](https://github.com/bgreenwell/doxx/issues/76))\n\n### Fixed\n- Numbered list items sharing the same abstract numbering definition now count sequentially instead of both restarting at 1 ([#76](https://github.com/bgreenwell/doxx/issues/76))\n- Bullet-format list levels (`numFmt=\"bullet\"`) no longer render as lettered sequences ([#76](https://github.com/bgreenwell/doxx/issues/76))\n- `w:br` line break elements inside a run are now preserved, fixing multi-line code blocks concatenated into a single line ([#76](https://github.com/bgreenwell/doxx/issues/76))\n\n## Install doxx 0.1.4\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/bgreenwell/doxx/releases/download/v0.1.4/doxx-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/bgreenwell/doxx/releases/download/v0.1.4/doxx-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install bgreenwell/doxx/doxx\n```\n\n## Download doxx 0.1.4\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [doxx-aarch64-apple-darwin.tar.xz](https://github.com/bgreenwell/doxx/releases/download/v0.1.4/doxx-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://githu