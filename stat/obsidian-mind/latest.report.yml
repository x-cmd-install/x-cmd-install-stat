o the latest obsidian-mind from https://github.com/breferrari/obsidian-mind`\n\n## v8.4.0 \u2014 2026-09-02\n\n### Fixed\n- the qmd search path was paying for a duplicate vector search and inheriting the wrong embedder\n- the markup refusal's recovery is a different shape, not the one that folded\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
