{"id":402460701,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORbYSZs4X_RAd","tag_name":"v9.0.0","target_commitish":"main","name":"v9.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-03T10:36:19Z","updated_at":"2026-10-03T10:38:07Z","published_at":"2026-10-03T10:36:25Z","assets":[{"id":607627211,"node_id":"RA_kwDORbYSZs4kN6fL","name":"obsidian-mind-v9.0.0.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4851051,"digest":"sha256:b4c259d99b8071f26b20f822201e0ab2b14b3ea59608d4ba21c97f5c9103d268","download_count":4,"created_at":"2026-10-03T10:36:24Z","updated_at":"2026-10-03T10:36:24Z"}],"body":"## obsidian-mind 9.0: the vault rides inside Claude Code\n\nUntil now, everything the vault gave Claude came through hooks. Hooks have limits nobody sees.\n\nClaude Code cuts hook output at 10,000 characters. After compaction, the session context shrank to a pointer. Subagents never got it at all. And the Stop report either reached only you, or reached Claude printed as \"Stop hook error\".\n\n9.0 ships a Claude Code mod. Same vault, same scripts, a better way in.\n\n### What changes\n\n**Session context arrives as an instruction file**, the way `CLAUDE.md` does. It survives `/compact` and `/clear` whole. It reaches general-purpose subagents. It is no longer cut at 10,000 characters: it gets its own budget, `eager_layer_instruction_budget_bytes`, default 20,000 bytes. `/memory` lists it as `.claude/session-context.md`.\n\n**The Stop report becomes one line under the answer.** `obsidian-mind: vault check: 1 note(s) marked done but still in active/`. That's all you see. Claude gets the full report with your next message, unseen. Once per change, never repeated, and it survives `claude --resume`.\n\n**Hooks work after `/cd`.** Every hook command now finds the vault root from a subfolder.\n\n### Proven, not assumed\n\nA new delivery gate asks the model itself what context it received: at startup, after `/compact`, after `/clear`, and from a subagent. It passes every checkpoint on Claude Code 2.1.287 and 2.1.288. Its self-test runs two deliberately broken mods and fails every time, so a pass means something.\n\nBefore this release, 9.0 was back-ported by hand into two heavily customized vaults and run there until audits came back empty. 1,715 hook tests and 72 mod tests pass.\n\n### Nothing breaks if you don't use it\n\nCodex, Gemini, Claude Code before 2.1.287, a folder you haven't trusted: the hooks run exactly as before. The mod only loads after you accept Claude Code's trust prompt for the vault.\n\nIt is code that runs with your permissions. Read what it does first:\n\n```bash\nclaude plugin validate .claude/skills/obsidian-mind\n```\n\nIt lists every event the mod hooks and every call it makes. To turn it off, add `\"enabledPlugins\": { \"obsidian-mind@skills-dir\": false }` to `.claude/settings.local.json`.\n\n### Also in 9.0\n\n- The qmd search client no longer crashes when qmd's process dies mid-write.\n- Running the test suite no longer touches your real QMD index.\n\n---\n\n## Quick Start\n\n**Requirements:** [Obsidian](https://obsidian.md), [Node 22+ LTS](https://nodejs.org), and one of: [Claude Code](https://claude.ai/code) \u00b7 [Codex CLI](https://github.com/openai/codex) \u00b7 [Gemini CLI](https://github.com/google-gemini/gemini-cli)\n\n**Install via [ShardMind](https://github.com/breferrari/shardmind) (recommended \u2014 wizard, optional modules, managed upgrades):**\n\n```bash\nnpm install -g shardmind\nmkdir my-vault && cd my-vault\nshardmind install github:breferrari/obsidian-mind\n```\n\n**Or clone directly:**\n\n```bash\ngit clone https://github.com/breferrari/obsidian-mind.git\ncd obsidian-mind\nnpm install -g @tobilu/qmd && qmd index && qmd embed   # optional: semantic search\n```\n\nOpen the folder as an Obsidian vault, then run `claude`, `codex`, or `gemini` in the directory and type `/om-standup` (or `om-standup` in Codex).\n\nOr download the vault zip below and extract it into your Obsidian vaults folder.\n\n**Already using obsidian-mind?** Just tell your agent: `Update this vault to the latest obsidian-mind from https://github.com/breferrari/obsidian-mind`\n\n## v9.0.0 \u2014 2026-10-03\n\n### Added\n- show the Stop report as one line under the answer through the mod\n- deliver session context as an instruction file through a Claude Code mod\n- add om_mod flags to session-start and stop-checklist\n\n### Fixed\n- find the vault root in hook commands after /cd\n- keep hook tests off the real QMD sentinel\n- fail waiting qmd calls when the client's stdin breaks, instead of crashing\n\n"}
