{"id":404374887,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORbYSZs4YGkVn","tag_name":"v9.1.0","target_commitish":"main","name":"v9.1.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-06T06:13:54Z","updated_at":"2026-10-06T06:25:10Z","published_at":"2026-10-06T06:13:59Z","assets":[{"id":614672710,"node_id":"RA_kwDORbYSZs4koylG","name":"obsidian-mind-v9.1.0.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4878513,"digest":"sha256:f5484264e3f5bcf685da5ab0a0a01b503e7750b2ec46353010daa06afd47ca83","download_count":0,"created_at":"2026-10-06T06:13:59Z","updated_at":"2026-10-06T06:13:59Z"}],"body":"## obsidian-mind 9.1: sessions keep their goals, and upgrades keep your changes\n\n## Highlights\n\n- **Start every session with your goals, even with a long North Star.**\n  When the hook budget is tight, sections now shrink step by step instead of vanishing:\n  1. full North Star\n  2. Current Focus only\n  3. one headline per goal\n  4. the goals that fit\n  5. a pointer to the file\n\n  The size line names whatever was shrunk. Before, 30 long goals arrived as a bare pointer. Now all 30 arrive as headlines. This is the path Codex, Gemini and older Claude Code use.\n- **Upgrade with `/om-vault-upgrade`.** Run it with no arguments; it works through ShardMind 0.2.1. Before changing anything, it shows each file that differs from the template:\n  - **behind:** takes the new version;\n  - **ahead:** keeps yours, and flags it as worth upstreaming;\n  - **merged** or **conflict:** for you to review.\n- **Lean on two new test gates:** every anchored `promoted:` marker must resolve, and no note may hold hard-wrapped prose.\n\n## Before you upgrade\n\n- **Update ShardMind to 0.2.1 or later first:** `npm install -g shardmind@latest`.\n  ShardMind 0.2.0 can delete a clone's `.shardmind/` files when `adopt` fails or is cancelled, and `/om-vault-upgrade` runs `adopt`, so older versions are now refused. Already hit by it? Run `git checkout -- .shardmind`.\n- **Fix what the new gates flag in your own `npm test`.** Re-point `promoted:` markers after a note split, as `/om-tidy` describes. Unwrap hard-wrapped paragraphs, or mark a raw capture `verbatim: true` (or drop a `.verbatim` file in its folder).\n- **Expect more write warnings.** The hook now applies `frontmatter_required` from `vault-manifest.json`: work notes need `quarter` and `status`, 1:1 notes `quarter`, people `title`, and main incident notes `ticket`, `severity` and `role`. They are warnings only, and the Work Note template gains `quarter:`.\n- **Delete old test leftovers if you have them:** `session-start-*` files in `~/.cache/qmd` and `~/.config/qmd`. `npm test` now keeps qmd's files out of your folders and fails if a test writes there.\n- **Start Codex and Gemini sessions from the vault root on Windows.** Their hooks now find their scripts there; a session started in a subfolder still doesn't (#302).\n\n## Built on 9.0: the vault rides inside Claude Code\n\nHooks have limits nobody sees. Claude Code cuts their output at 10,000 characters, compaction shrinks the session context to a pointer, and subagents never get it. 9.0 added a Claude Code mod: same vault, same scripts, a better way in.\n\n- **Session context arrives as an instruction file**, the way `CLAUDE.md` does. It survives `/compact` and `/clear`, reaches subagents, and gets its own 20,000-byte budget (`eager_layer_instruction_budget_bytes`). `/memory` lists it as `.claude/session-context.md`.\n- **The Stop report is one line under the answer.** Claude gets the full report with your next message, once per change.\n- **Hooks work after `/cd`.** Every hook finds the vault root from a subfolder.\n\nA delivery gate asks the model itself what it received: at startup, after `/compact` and `/clear`, and from a subagent. \"It works\" is measured, not assumed.\n\n**Nothing breaks if you don't use it.** Codex, Gemini, Claude Code before 2.1.287 and untrusted folders run the hooks as before; the mod loads only after you accept Claude Code's trust prompt. It runs with your permissions, so read what it does first with `claude plugin validate .claude/skills/obsidian-mind`. To turn it off, add `\"enabledPlugins\": { \"obsidian-mind@skills-dir\": false }` to `.claude/settings.local.json`.\n\nFull 9.0 notes: [v9.0.0](https://github.com/breferrari/obsidian-mind/releases/tag/v9.0.0).\n\n---\n\n## Quick Start\n\n**Requirements:** [Obsidian](https://obsidian.md), [Node 22+ LTS](https://nodejs.org), and one of: [Claude Code](https://claude.ai/code) \u00b7 [Codex CLI](https://github.com/openai/codex) \u00b7 [Gemini CLI](https://github.com/google-gemini/gemini-cli)\n\n**Install via [ShardMind](https://github.com/breferrari/shardmind) (recommended \u2014 wizard, optional modules, managed upgrades):**\n\n```bash\nnpm install -g shardmind\nmkdir my-vault && cd my-vault\nshardmind install github:breferrari/obsidian-mind\n```\n\n**Or clone directly:**\n\n```bash\ngit clone https://github.com/breferrari/obsidian-mind.git\ncd obsidian-mind\nnpm install -g @tobilu/qmd && qmd index && qmd embed   # optional: semantic search\n```\n\nOpen the folder as an Obsidian vault, then run `claude`, `codex`, or `gemini` in the directory and type `/om-standup` (or `om-standup` in Codex).\n\nOr download the vault zip below and extract it into your Obsidian vaults folder.\n\n**Already using obsidian-mind?** Just tell your agent: `Update this vault to the latest obsidian-mind from https://github.com/breferrari/obsidian-mind`\n\n## v9.1.0 \u2014 2026-10-06\n\n### Added\n- make /om-vault-upgrade ShardMind-aware, keeping local improvements through an upgrade\n- add a prose-width rule so vaults stop teaching sessions to hard wrap\n- gate every anchored promoted marker on resolving, and retarget markers on a split\n\n### Fixed\n- run the release job's tests as CI does, and stop two Stop tests depending on qmd\n- require shardmind 0.2.1 so a failed adopt cannot delete a clone's .shardmind files\n- run Codex and Gemini hooks on Windows by a relative script path\n- deliver every live goal at North Star's full level, and report any cut in the meter\n- degrade eager-layer sections by levels instead of collapsing them whole\n- resolve the QMD store path the way qmd does, honouring INDEX_PATH\n- keep the test suite from writing QMD stores and configs into the user's folders\n- enforce every tool's schema required fields in the MCP dispatcher\n- link an informed_by title holding # or | by basename so the link resolves\n- drive the frontmatter write check from frontmatter_required in the manifest\n- drop backticks from memory filenames so a wikilink to them resolves\n- refuse a record_work call with no title instead of writing an undefined note\n- flag mcp_never_expose entries that are paths or folders instead of ignoring them\n- derive the auto-memory directory on Windows so tidy-fix migrates strays there\n- add a trailing flush so edits inside the QMD refresh debounce window get indexed\n- report tidy-fix moves as fixed only when they succeed\n- prefer a runnable qmd install over the first one that merely exists\n- fail charcount when the section is not found, and match ## headings\n"}
