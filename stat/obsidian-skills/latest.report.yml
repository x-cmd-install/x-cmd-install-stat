{"id":447603381,"author":{"login":"kepano","id":10565871,"node_id":"MDQ6VXNlcjEwNTY1ODcx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQyvZCM4areK1","tag_name":"1.2.0","target_commitish":"caf3e98cd22d810db164f26c9a442f0a280daa43","name":"1.2.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-16T20:53:24Z","updated_at":"2026-11-16T20:55:54Z","published_at":"2026-11-16T20:55:46Z","assets":[{"id":756415472,"node_id":"RA_kwDOQyvZCM4tFfvw","name":"obsidian-gemini.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":22510,"digest":"sha256:df3980615a844653dd54699e92259e5f16d66ef68a76f1a7b7e4a0110e4efd81","download_count":89,"created_at":"2026-11-16T20:55:53Z","updated_at":"2026-11-16T20:55:54Z"}],"body":"Obsidian Skills now has a skill for Obsidian Headless, so agents can sync and publish vaults without the desktop app. The plugin also installs in Gemini CLI.\n\nIf you installed from the Claude Code marketplace, run `claude plugin update obsidian@obsidian-skills`.\n\n### Plugin\n\n- Added a Gemini CLI extension: `gemini extensions install https://github.com/obsidianmd/obsidian-skills`.\n\n### Skills\n\n- Headless: added a skill for `ob`, the Obsidian Headless CLI, to sync and publish vaults from the command line. It asks the user to type passwords and runs `publish` with `--dry-run` first (#75, #155).\n- Bases: added kanban views and `groupOrder` (#153), and documented the `note.` prefix that `displayName` needs in `properties` (#84).\n- Obsidian CLI: on WSL, call `Obsidian.com` instead of `Obsidian.exe` so output isn't lost (#96).\n\nThanks @catlee, @bencharoenwong, @hst368 and @citizen204!\n","reactions":{"total_count":7,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":1,"eyes":0},"mentions_count":4}
