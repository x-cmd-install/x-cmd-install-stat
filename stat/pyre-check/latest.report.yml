{"id":182565140,"author":{"login":"migeed-z","id":10407760,"node_id":"MDQ6VXNlcjEwNDA3NzYw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBpKnuM4K4bkU","tag_name":"v0.9.23","target_commitish":"main","name":"PEP695 v0","draft":false,"immutable":false,"prerelease":false,"created_at":"2024-10-29T16:13:53Z","updated_at":"2024-10-29T21:22:27Z","published_at":"2024-10-29T21:22:27Z","assets":[],"body":"We support basic PEP695 syntax, which includes writing generic type variables, param spec and type var tuples in the new style. We also support bounds. Let us list some sandbox examples:\r\n\r\n1- Generic type variables for classes and methods, with bounds\r\n2- Generic type variables for functions \r\n3- ParamSpec \r\n4- TypeVarTuple \r\n5- Type Statements \r\n6- Fully conformant bound checking \r\n\r\nWhat are we not conformant on?\r\n\r\n1- Mixing legacy and PEP695 syntax \r\n2- PEP695 variables cannot be used in the same way that legacy style syntax when it comes to declaring them \r\n3- We have to keep track type variable redefinitions within the program itself ","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":2}}
