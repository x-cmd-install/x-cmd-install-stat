8:27Z"},{"id":701498853,"node_id":"RA_kwDOTxUfT84p0AXl","name":"justray-1.9.0-macos-amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":18670575,"digest":"sha256:c3d1f8f05563e74133474e235b5f894adec7de00b5ff21046b0f1500e6f88ed8","download_count":2,"created_at":"2026-11-02T11:18:24Z","updated_at":"2026-11-02T11:18:26Z"},{"id":701498849,"node_id":"RA_kwDOTxUfT84p0AXh","name":"justray-1.9.0-macos-arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":17340952,"digest":"sha256:627dc1e859c63f22d29bb0745726d5767b9854d227f2ea5b175f9bf84365cccc","download_count":7,"created_at":"2026-11-02T11:18:24Z","updated_at":"2026-11-02T11:18:25Z"},{"id":701498852,"node_id":"RA_kwDOTxUfT84p0AXk","name":"justray-1.9.0-windows-amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":19022759,"digest":"sha256:4e3186a8b08ccec2ff1557d647fd643184a37d807345d17f1c7b52252d0b80f5","download_count":47,"created_at":"2026-11-02T11:18:24Z","updated_at":"2026-11-02T11:18:26Z"},{"id":701498925,"node_id":"RA_kwDOTxUfT84p0AYt","name":"justray-1.9.0-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":16847026,"digest":"sha256:dc93c1e86d01ed501494c496e6781a7cd1694ab5b84e606444d4c25cbb2bafbd","download_count":30,"created_at":"2026-11-02T11:18:26Z","updated_at":"2026-11-02T11:18:27Z"}],"body":"## Changelog\r\n\r\n### 🚀 Features\r\n\r\n- GeoIP & Geosite\r\n  - Finally! Add `geoip:<country>` and `geosite:<tag>` rules support (like `geoip:ru` or `geosite:google`). Rules taken from [sing-geosite](https://github.com/SagerNet/sing-geosite)\r\n  - Automatically fetch remote .srs rule-sets and cache them locally so startup stays fast\r\n- Proxy Modes\r\n  - Add proxy type setting (Local / System) to toggle your system proxy automatically when you don't want to use TUN (via sing-box ofc), default still on local\r\n- TUI & Shortcuts\r\n  - Move search and error messages to the bottom line like in vim\r\n\r\n### 🐛 Bug Fixes\r\n\r\n- Routing & Rules\r\n  - Don't trip over spaces in app paths, Windows .exe names, or wildcard domains\r\n  - Fetch remote .srs rule-sets through your active proxy connection if direct access to GitHub is blocked\r\n- Connections & Probing\r\n  - Latency probes now properly treat HTTP errors as failures instead of reporting fake successs\r\n  - Restore default host fallback for HTTP transport when host header is empty\r\n  - Improve DNS handling and settings reload\r\n- System & Imports\r\n  - Catch broken credentials earlier when importing configs\r\n  - Use fixed temporary files and clean up sockets properly on exit\r\n\r\n### ♻️ Refactoring\r\n\r\n- Delete out legacy WireGuard outbound hacks and ancient migration code\r\n- Better download cancellation when subscription fetch fails\r\n- Simplify daemon lifecycle, os matching, and remove duplicate code\r\n\r\nFull Changelog: [v1.8.1...v1.9.0](https://github.com/luynrs/justray/compare/v1.8.1...v1.9.0)\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
