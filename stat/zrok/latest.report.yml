me":"zrok_2.0.11_darwin_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":35727204,"digest":"sha256:507de76f191400f95f9cc6a1ae429919ff1d7faac1607cf25b786a1b8332e63c","download_count":42,"created_at":"2026-11-19T18:17:38Z","updated_at":"2026-11-19T18:17:40Z"},{"id":768754652,"node_id":"RA_kwDOHrcHjM4t0kPc","name":"zrok_2.0.11_darwin_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":33068868,"digest":"sha256:649e702c9f46064a0f486ffe5f8961d83ba6aa3a7f0c4a41bb3124cc439b9861","download_count":120,"created_at":"2026-11-19T18:17:37Z","updated_at":"2026-11-19T18:17:38Z"},{"id":768754726,"node_id":"RA_kwDOHrcHjM4t0kQm","name":"zrok_2.0.11_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":34751308,"digest":"sha256:4db2e2f0be382a9cdd415735520f7d0ac0715b799d54c922d7801cc35803dd8c","download_count":874,"created_at":"2026-11-19T18:17:38Z","updated_at":"2026-11-19T18:17:40Z"},{"id":768754761,"node_id":"RA_kwDOHrcHjM4t0kRJ","name":"zrok_2.0.11_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":32196536,"digest":"sha256:15a1a6f072ae17c8f23e91f26e615985be3398c35663e9d6bfad70586573318d","download_count":82,"created_at":"2026-11-19T18:17:39Z","updated_at":"2026-11-19T18:17:40Z"},{"id":768754658,"node_id":"RA_kwDOHrcHjM4t0kPi","name":"zrok_2.0.11_linux_armv7.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":33201330,"digest":"sha256:4e0f58f52ce9a2cca75840ba73ff1108bc86d0a99a483c9466393defce3fb83e","download_count":19,"created_at":"2026-11-19T18:17:37Z","updated_at":"2026-11-19T18:17:39Z"},{"id":768754779,"node_id":"RA_kwDOHrcHjM4t0kRb","name":"zrok_2.0.11_windows_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":35356930,"digest":"sha256:463b83f6d50a631af7ccd9e85eeb8206f7dea62e95f441dd5691590a0a8fb834","download_count":988,"created_at":"2026-11-19T18:17:39Z","updated_at":"2026-11-19T18:17:41Z"}],"body":"FIX: The metrics bridge with a file source could skip usage events, or pass on a partial event that was then discarded, when it read the file while OpenZiti was writing to it. Some usage consequently went unrecorded. The file source now delivers each event once, when its line is complete.\r\n\r\nFIX: Usage for a share with more than one connection in a reporting interval was under-reported because each connection's report replaced the one before it. These reports now keep separate points, so totals shown in the console and API will be higher for such shares from the upgrade on. Limits are now enforced against the true totals: an account may reach a warning or limit it did not reach before, and operators may want to review their limit values. Usage recorded before the upgrade is not corrected.\r\n\r\nCHANGE: The controller's metrics agent now remembers which share each OpenZiti service belongs to, and which services are not shares at all, instead of asking the database again for every usage event. A busy controller makes far fewer database queries as a result; usage keeps being attributed to the same share, environment and account. A share is remembered for 10 minutes and a service that is not a share for 1 minute, set with `metrics.agent.share_cache_lifetime` and `metrics.agent.not_share_cache_lifetime`; `metrics.agent.share_cache_size` bounds how many are held (100000 by default). A failed database lookup is never remembered. Every 5 minutes, when usage has flowed, the agent logs how many lookups it answered from memory and how many went to the database; `metrics.agent.cache_report_interval` changes that, and a negative value turns the line off. A negative lifetime turns that kind of remembering off and restores the previous behaviour.\r\n\r\nCHANGE: The controller's limits agent now remembers, for a short time, each account's limits and its transfer totals from InfluxDB, and finishes a usage event without a database query or an InfluxDB query when they show there is nothing to do. Warnings and limits are still journaled and applied only from the database and InfluxDB, read at that moment. Enforcement can therefore lag: a change to an account's limit classes or limitless flag can take up to `limits.account_cache_lifetime` to be noticed, and a crossing of a threshold up to `limits.usage_cache_lifetime`, 60 seconds each by default. Every 5 minutes, when usage has flowed, the agent logs how many events it finished from memory and how many took the full path; `limits.cache_report_interval` changes that, and a negative value turns the line off. A negative lifetime turns that cache off; setting both negative restores the previous behaviour.\r\n\r\nFIX: The agent can release and clean up an access or a private share that the zrok service has already removed. When the share behind an access was deleted on its own side, the access showed as `failed` in `zrok2 agent status`, `zrok2 agent release access` answered `unaccessNotFound`, and only restarting the agent cleared it. The agent now confirms through the account overview that the access or share is really gone and finishes the cleanup. Deleting a private share or an access from the agent is also bounded at 30 seconds, as deleting a public share already was.\r\n\r\n"}
