e":"zrok_2.0.10_darwin_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":35714669,"digest":"sha256:bf37da83fd2a89d828c10faad7f0f7e79ed8c2b75675acfeb446c404eb049356","download_count":4,"created_at":"2026-11-16T21:09:02Z","updated_at":"2026-11-16T21:09:05Z"},{"id":756457696,"node_id":"RA_kwDOHrcHjM4tFqDg","name":"zrok_2.0.10_darwin_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":33059795,"digest":"sha256:44cacbdb5e4f96269d407f0a95de5253e8b57b18f29a0204d85b2473f402f6d7","download_count":61,"created_at":"2026-11-16T21:08:58Z","updated_at":"2026-11-16T21:09:01Z"},{"id":756457687,"node_id":"RA_kwDOHrcHjM4tFqDX","name":"zrok_2.0.10_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":34742210,"digest":"sha256:e356df6845a99da775544e3e66cae7c4d20a104c1613227138d0e1b841e7e504","download_count":39,"created_at":"2026-11-16T21:08:57Z","updated_at":"2026-11-16T21:09:01Z"},{"id":756457940,"node_id":"RA_kwDOHrcHjM4tFqHU","name":"zrok_2.0.10_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":32189242,"digest":"sha256:8b34dd0796e11adbf5a991ece618e028a1eced692b3078368c37c2705d024998","download_count":11,"created_at":"2026-11-16T21:09:02Z","updated_at":"2026-11-16T21:09:04Z"},{"id":756457693,"node_id":"RA_kwDOHrcHjM4tFqDd","name":"zrok_2.0.10_linux_armv7.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":33185788,"digest":"sha256:fb44b4672879df518650553a2124b6ed2a931f18af5bdb99132ee253bdeabc18","download_count":6,"created_at":"2026-11-16T21:08:57Z","updated_at":"2026-11-16T21:09:02Z"},{"id":756457692,"node_id":"RA_kwDOHrcHjM4tFqDc","name":"zrok_2.0.10_windows_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":35352296,"digest":"sha256:eefe03287baf24ed04d304306c9ed4207602c3a3fca645ba1c08ac490846c17d","download_count":211,"created_at":"2026-11-16T21:08:57Z","updated_at":"2026-11-16T21:09:01Z"}],"body":"CHANGE: **The agent registry (`agent-registry.json`) is now version 3, which agents from v2.0.9 and earlier cannot read.** The agent reads an existing version 2 registry as it is and saves it as version 3 at the end of its first startup, so upgrading needs no manual step. A v2.0.9 agent will not start on a version 3 registry: it reports the unsupported version, exits 1 and leaves the file as it was. Rolling back to v2.0.9 or earlier therefore needs a manual edit of the registry before the older agent will run; the procedure is in `docs/current/agent-share-lifecycle.md`. A v2.0.8 agent does start, with nothing restored, and replaces the registry with an empty one at its next save, so for v2.0.8 make the edit before starting it.\r\n\r\nFEATURE: `zrok2 share public --basic-auth-from-stdin` reads one `<username:password>` from the first line of stdin instead of `--basic-auth`, so a supervising process can pass the credential without it appearing in the process command line or environment, where other local users and endpoint monitoring can read it. It cannot be combined with `--basic-auth` or `--oauth-provider`, and an empty or unreadable stdin fails with exit 2 before the share is created.\r\n\r\nFEATURE: `zrok2 share public --basic-auth-file <path>` reads basic authentication users from a file, one `<username:password>` per line, so the credentials appear in neither the process command line nor the environment. Blank lines are skipped, either line ending is accepted, and a password may contain a colon. A missing, empty or malformed file, a file over 1 MiB, or `--basic-auth-file \"\"` fails with exit 2 before the share is created, naming the path and, for a malformed entry, the line number, never the line's contents. It cannot be combined with `--basic-auth`, `--basic-auth-from-stdin` or `--oauth-provider`. With `zrok2 agent` running, the command sends the agent the file's absolute path, not its contents, and the agent reads the file each time it creates the share, including when it restores a named share at startup. The saved registry holds the path and never the users, and a changed file takes effect the next time the agent creates the share. A file that is missing or bad when the agent restarts leaves the share down and retried, never running without authentication. An agent left running from an earlier release does not understand the path; the command refuses with exit 2 and asks for the agent to be restarted on the current version.\r\n\r\nFIX: Basic authentication passwords may now contain a colon. An entry is split at its first colon, as the frontends do when they check a login, so `admin:s3:cret` is user `admin` with password `s3:cret`. This applies to `--basic-auth`, `--basic-auth-from-stdin` and the Go, Node and Python SDKs. An agent left running from an earlier release cannot take such a password; `zrok2 share public` refuses with exit 2 without sending the credential, and asks for the agent to be restarted on the current version.\r\n\r\nFIX: A malformed basic authentication entry no longer prints the credential. Errors name where the entry came from (its position among `--basic-auth` values, or stdin) and never its contents, so a supervising service that logs stderr no longer records the password.\r\n\r\nFIX: The Node SDK now throws an error for a basic authentication entry without a colon. It previously dropped that user without a word and created the share without it.\r\n\r\nFIX: Basic authentication in the Python SDK works. Creating a share with `BasicAuth` previously failed with `AttributeError: 'ShareRequest' object has no attribute 'auth_users'` before anything was sent to the controller; the users now reach the controller.\r\n"}
