17](https://github.com/AlexsJones/llmfit/compare/v1.1.16...v1.1.17) (2026-10-08)\n\n\n### Features\n\n* **cli:** add --memory-percent and --ram-percent overrides ([#1089](https://github.com/AlexsJones/llmfit/issues/1089)) ([17d45bd](https://github.com/AlexsJones/llmfit/commit/17d45bd667bb9cca95008182e07852d2208087c1))\n* **tui:** add mouse support to existing controls ([#1110](https://github.com/AlexsJones/llmfit/issues/1110)) ([8caf925](https://github.com/AlexsJones/llmfit/commit/8caf9256739d8d3e4f5359462990f8cf18f1856c))\n\n\n### Bug Fixes\n\n* **api:** make include_too_tight=true return too_tight rows ([#1087](https://github.com/AlexsJones/llmfit/issues/1087)) ([cbd30d7](https://github.com/AlexsJones/llmfit/commit/cbd30d7d512885c1eff2e545da37c09f2768963c))\n* **cli:** honor --json in search ([#1113](https://github.com/AlexsJones/llmfit/issues/1113)) ([f89395b](https://github.com/AlexsJones/llmfit/commit/f89395bed72a3d4905e792688d8119141f3b792e)), closes [#901](https://github.com/AlexsJones/llmfit/issues/901)\n* **cli:** reject unknown recommend filter values ([#1114](https://github.com/AlexsJones/llmfit/issues/1114)) ([35fdd4f](https://github.com/AlexsJones/llmfit/commit/35fdd4f941f75e991a6a53a02efaae73a6e04582))\n* **fit:** dense CpuOffload TPS uses measured DDR bandwidth and the GPU/RAM split ([#1108](https://github.com/AlexsJones/llmfit/issues/1108)) ([b3a5974](https://github.com/AlexsJones/llmfit/commit/b3a5974325e3a312605de1caeb8ba2c6e9677dc9))\n* **fit:** make ranking deterministic across runs ([#1066](https://github.com/AlexsJones/llmfit/issues/1066)) ([f2eafd0](https://github.com/AlexsJones/llmfit/commit/f2eafd0797ac5424c9663c03fbd218f1c3679364))\n* **fit:** pick the best quant within the Marginal ceiling ([#1120](https://github.com/AlexsJones/llmfit/issues/1120)) ([449fe95](https://github.com/AlexsJones/llmfit/commit/449fe9555231036ba77e2a0c5caa7a43be6cae71)), closes [#1118](https://github.com/AlexsJones/llmfit/issues/1118)\n* **hardware:** treat an Intel adapter with no series name as integrated ([#1100](https://github.com/AlexsJones/llmfit/issues/1100)) ([c299bc5](https://github.com/AlexsJones/llmfit/commit/c299bc5f891d2b57e5f79aa8915fe1406876ddaa))\n* **models:** prefer name-declared size when scraped params are implausible ([#925](https://github.com/AlexsJones/llmfit/issues/925)) ([f433cf6](https://github.com/AlexsJones/llmfit/commit/f433cf6737e8ffd34f23201f3a8d39d90e09e158))\n\n\n### Performance Improvements\n\n* **hardware:** run lspci once per process ([#1065](https://github.com/AlexsJones/llmfit/issues/1065)) ([0728894](https://github.com/AlexsJones/llmfit/commit/0728894b93e0ec0dd2b3e6aff178e34268b42cda))\n* **tui:** optimize model search filtering in apply_filters for 40%+ speedup ([#934](https://github.com/AlexsJones/llmfit/issues/934)) ([ca864d0](https://github.com/AlexsJones/llmfit/commit/ca864d0977460042dd08831659f21b8463514e8b))\n\n## What's Changed\n* docs: new README demo GIF, recorded from a reproducible VHS tape by @AlexsJones in https://github.com/AlexsJones/llmfit/pull/1068\n* perf(hardware): run lspci once per process by @AlexsJones in https://github.com/AlexsJones/llmfit/pull/1065\n* fix(fit): make ranking deterministic across runs by @AlexsJones in https://github.com/AlexsJones/llmfit/pull/1066\n* bench: community results for nvidia-geforce-gtx-1080-ti by @farkusza in https://github.com/AlexsJones/llmfit/pull/1078\n* bench: community results for nvidia-geforce-gtx-1080-ti by @farkusza in https://github.com/AlexsJones/llmfit/pull/1079\n* [Automated] Weekly model data refresh by @github-actions[bot] in https://github.com/AlexsJones/llmfit/pull/1077\n* feat(cli): add --memory-percent and --ram-percent overrides by @MannXo in https://github.com/AlexsJones/llmfit/pull/1089\n* fix(api): make include_too_tight=true return too_tight rows by @SulimanAbdulrazzaq in https://github.com/AlexsJones/llmfit/pull/1087\n* perf(tui): optimize model search filtering in apply_filters for 40%+ by @iam-saiteja in https://github.com/AlexsJones/llmfit/pull/934\n* chore(deps): bump jsonschema from 0.51.0 to 0.55.0 by @dependabot[bot] in https://github.com/AlexsJones/llmfit/pull/1074\n* chore(deps): bump tabled from 0.21.0 to 0.22.0 by @dependabot[bot] in https://github.com/AlexsJones/llmfit/pull/1073\n* fix(models): prefer name-declared size when scraped params are implausible by @DangMinh0412 in https://github.com/AlexsJones/llmfit/pull/925\n* bench: community results for nvidia-geforce-gtx-1080-ti by @farkusza in https://github.com/AlexsJones/llmfit/pull/1099\n* fix(hardware): treat an Intel adapter with no series name as integrated by @Yi-111-a in https://github.com/AlexsJones/llmfit/pull/1100\n* bench: community results for intel-raptor-lake-p-iris-xe-graphics-integrated by @FabioLeitao in https://github.com/AlexsJones/llmfit/pull/1083\n* fix(fit): dense CpuOffload TPS uses measured DDR bandwidth and the GPU/RAM split by @mvanhorn in https://github.com/AlexsJones/llmfit/pull/1108\n* docs: sync Chinese translation with new demo GIF and layout updates by @JasonYeYuhe in https://github.com/AlexsJones/llmfit/pull/1111\n* chore(deps): bump the cargo-minor-patch group across 1 directory with 4 updates by @dependabot[bot] in https://github.com/AlexsJones/llmfit/pull/1109\n* [Automated] Weekly model data refresh by @github-actions[bot] in https://github.com/AlexsJones/llmfit/pull/1112\n* fix(cli): reject unknown recommend filter values by @jayhemnani9910 in https://github.com/AlexsJones/llmfit/pull/1114\n* fix(cli): honor --json in search by @jayhemnani9910 in https://github.com/AlexsJones/llmfit/pull/1113\n* bench: community results for intel-3rd-gen-core-processor-graphics-controller-integrated by @FabioLeitao in https://github.com/AlexsJones/llmfit/pull/1123\n* fix(fit): pick the best quant within the Marginal ceiling by @jayhemnani9910 in https://github.com/AlexsJones/llmfit/pull/1120\n* bench: community results for nvidia-geforce-rtx-4060-laptop-gpu by @celalthedon in https://g