e},"content_type":"application/x-gtar","state":"uploaded","size":5454,"digest":"sha256:42562534cf5d1cfabacfc32f5f962e2ee27c87f191da6ac3876bdd66fa9dcae2","download_count":5062,"created_at":"2026-10-12T18:51:49Z","updated_at":"2026-10-12T18:51:49Z"},{"id":634672116,"node_id":"RA_kwDOIuuGOM4l1FP0","name":"SHA256SUMS.txt","label":"","uploader":{"login":"copilot-cli-release-app[bot]","id":238481402,"node_id":"BOT_kgDODjbv-g","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1740,"digest":"sha256:94a4663eac3bc0b9ffd60c5cceb35ef6c09037cb7619f0d5dfeff275b359ca97","download_count":8888,"created_at":"2026-10-12T18:51:48Z","updated_at":"2026-10-12T18:51:49Z"}],"body":"2026-10-12\n\n- Interactive sandbox settings suggest possible environment secrets and let you add masking hosts before saving.\n- Make model IDs in /model and /config model case-insensitive and save canonical IDs\n- Keep /allow-all available during startup while enterprise policy is still resolving\n- /add-dir grants sandbox access to added directories for the current session\n- /user list shows the authentication source for each signed-in account\n- Show retry progress messages before recovered responses after transient model failures\n- Model completions no longer show an authentication warning when an account-owned catalog is unavailable while signed out\n- Interactive sessions in git repositories reach the input prompt sooner\n- Timeline now shows whether you, Assisted Permissions, policy, or unattended fallback made each permission decision.","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":0}}
