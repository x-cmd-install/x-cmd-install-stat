n":false},"content_type":"application/x-gtar","state":"uploaded","size":5452,"digest":"sha256:4f305d718a1e6cb994e926d0f570883eb63bfb79ef091d00d5ff9c67d9d83781","download_count":21828,"created_at":"2026-10-01T17:24:48Z","updated_at":"2026-10-01T17:24:48Z"},{"id":603757953,"node_id":"RA_kwDOIuuGOM4j_J2B","name":"SHA256SUMS.txt","label":"","uploader":{"login":"copilot-cli-release-app[bot]","id":238481402,"node_id":"BOT_kgDODjbv-g","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1740,"digest":"sha256:59db4ee6ebd9f0da12a3698c2e2d96932b2dd84e7a5703a08ee645225e41e9ec","download_count":26182,"created_at":"2026-10-01T17:24:47Z","updated_at":"2026-10-01T17:24:48Z"}],"body":"2026-10-01\n\n- Add `copilot sandbox ca` commands to check, create, trust, rotate, and remove proxy CA trust, including unattended Windows setup; `/sandbox ca install` becomes `create` and `trust`\n- Session timelines now clear busy status after interrupted turns finish.\n- Sandboxed commands run on Windows versions without filesystem enumeration support, with a warning that PowerShell's current location may be wrong\n- Footer text selection stays on the same visible line when the footer grows or shrinks.\n- Offer sandbox network bypass for Node/npm EACCES socket denials on Windows\n- CLI shutdown flushes pending telemetry before exit, with a bounded delay when telemetry is still initializing.\n- Complete, statically analyzable read-only shell pipelines can now enter execution-evidence review, while incomplete or unbound pipelines require explicit approval.","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
