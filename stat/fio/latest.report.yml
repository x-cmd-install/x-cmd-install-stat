turely when encountering SOBR zone types if using libzbc engine by @rorychen in https://github.com/axboe/fio/pull/2083\r\n* cgroup: fix path buffer overflows for long cgroup names by @linuxholic in https://github.com/axboe/fio/pull/2085\r\n* t/io_uring: add --hugetlb option for hugetlbfs IO buffers by @ming1 in https://github.com/axboe/fio/pull/2088\r\n* init: fix memory leaks reported by LeakSanitizer by @malikoyv in https://github.com/axboe/fio/pull/2090\r\n* verify: skip errored WRITE offset in verify by @minwooim in https://github.com/axboe/fio/pull/2086\r\n* backend: remove linux/prctl.h include to fix musl conflict by @lucashecht in https://github.com/axboe/fio/pull/2097\r\n* engines/nvme: fix addr/data_len for no data nvme commands by @swarnagh6 in https://github.com/axboe/fio/pull/2101\r\n* blktrace: fix three bugs in merge_blktrace_iologs path by @wangxp006 in https://github.com/axboe/fio/pull/2099\r\n* doc: indicate that metadata options are supported with io_uring by @calebsander in https://github.com/axboe/fio/pull/2104\r\n* Introduce crash-aware data verification by @minwooim in https://github.com/axboe/fio/pull/2091\r\n* Io uring/multiple write modes by @minwooim in https://github.com/axboe/fio/pull/2089\r\n* backend: log trim @io_u to io_hist even `do_verify=0` by @minwooim in https://github.com/axboe/fio/pull/2105\r\n* io_uring: register ring fd and reduce code duplication by @calebsander in https://github.com/axboe/fio/pull/2108\r\n* verify: fix bandwidth asymmetry and memory leak with norandommap by @malikoyv in https://github.com/axboe/fio/pull/2107\r\n* engines/io_uring: Introduce BSG io uring cmd by @ljw8161 in https://github.com/axboe/fio/pull/2102\r\n* io_uring: Add support for 'zone_append' when using uring_cmd and zonemode ZBD by @Krien in https://github.com/axboe/fio/pull/2103\r\n* Implement Sequence Distribution feature with Striding by @vadlakondaswetha in https://github.com/axboe/fio/pull/2094\r\n* server: properly reap child processes on SIGINT to prevent assertion crash by @cenhuil in https://github.com/axboe/fio/pull/2109\r\n* iolog: size pending log larger than iodepth to avoid log assertion by @SAY-5 in https://github.com/axboe/fio/pull/2115\r\n* Fix a few recent Coverity complaints by @bvanassche in https://github.com/axboe/fio/pull/2116\r\n* parse: ignore leading minus sign when splitting options by @cenhuil in https://github.com/axboe/fio/pull/2112\r\n* stop experimental verify based on bytes issued, not completed by @malikoyv in https://github.com/axboe/fio/pull/2118\r\n* engines/io_uring: add copyright header to bsg files by @ljw8161 in https://github.com/axboe/fio/pull/2125\r\n* engines: add ROCm hipFile engine via shared gpuaccel layer by @sbates130272 in https://github.com/axboe/fio/pull/2113\r\n* libnfs only requires gnutls on Linux by @bsdkurt in https://github.com/axboe/fio/pull/2135\r\n* engines/io_uring_cmd: extend bsg cmd_type with cdb_len, verify, and prefetch by @ljw8161 in https://github.com/axboe/fio/pull/2123\r\n* doc: change RWF_UNCACHED to RWF_DONTCACHE by @Panky-codes in https://github.com/axboe/fio/pull/2138\r\n* backend: exit non-zero when a job process is killed by a signal by @Vladyyy in https://github.com/axboe/fio/pull/2129\r\n* verify: dump the received buffer when zero verify fails by @sarthak-k in https://github.com/axboe/fio/pull/2140\r\n* Consolidate all caller of io_ops_commit() to call td_io_commit() by @dennischerchang in https://github.com/axboe/fio/pull/2139\r\n* Fixes: #2142 inconsistent type of convert_agg_kbytes_percent()'s caller by @dennischerchang in https://github.com/axboe/fio/pull/2143\r\n* README: fix unclosed angle bracket in maintainer email by @vic233333 in https://github.com/axboe/fio/pull/2147\r\n* Remove metadata transfer from Data Transfer 00b commands by @sc108-lee in https://github.com/axboe/fio/pull/2145\r\n\r\n## New Contributors\r\n* @dennischerchang made their first contribution in https://github.com/axboe/fio/pull/2069\r\n* @rorychen made their first contribution in https://github.com/axboe/fio/pull/2083\r\n* @linuxholic made their first contribution in https://github.com/axboe/fio/pull/2085\r\n* @ming1 made their first contribution in https://github.com/axboe/fio/pull/2088\r\n* @lucashecht made their first contribution in https://github.com/axboe/fio/pull/2097\r\n* @swarnagh6 made their first contribution in https://github.com/axboe/fio/pull/2101\r\n* @wangxp006 made their first contribution in https://github.com/axboe/fio/pull/2099\r\n* @ljw8161 made their first contribution in https://github.com/axboe/fio/pull/2102\r\n* @Krien made their first contribution in https://github.com/axboe/fio/pull/2103\r\n* @vadlakondaswetha made their first contribution in https://github.com/axboe/fio/pull/2094\r\n* @cenhuil made their first contribution in https://github.com/axboe/fio/pull/2109\r\n* @SAY-5 made their first contribution in https://github.com/axboe/fio/pull/2115\r\n* @Vladyyy made their first contribution in https://github.com/axboe/fio/pull/2129\r\n* @sarthak-k made their first contribution in https://github.com/axboe/fio/pull/2140\r\n* @vic233333 made their first contribution in https://github.com/axboe/fio/pull/2147\r\n* @sc108-lee made their first contribution in https://github.com/axboe/fio/pull/2145\r\n\r\n**Full Changelog**: https://github.com/axboe/fio/compare/fio-3.42...fio-3.43","mentions_count":24}
