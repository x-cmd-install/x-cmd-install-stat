/fio/pull/1989\r\n* engines/io_uring: validate PI on read by @stanleyzhang9 in https://github.com/axboe/fio/pull/1992\r\n* doc: add documentation for uncached buffered I/O by @Panky-codes in https://github.com/axboe/fio/pull/1995\r\n* test, memcpy: reorder #includes to use platform-specific code by @betonmischer86 in https://github.com/axboe/fio/pull/1998\r\n* memory: add cuda 13 support  by @maxime-peim in https://github.com/axboe/fio/pull/2000\r\n* options: Add range validation for log_hist_coarseness by @tachyonwill in https://github.com/axboe/fio/pull/2004\r\n* configure: support --extra-ldflags by @pirDOL in https://github.com/axboe/fio/pull/2005\r\n* Remove leftover code for platforms lacking clock_gettime and clockid_t by @betonmischer86 in https://github.com/axboe/fio/pull/1999\r\n* backend.c: fix async ioengine prep/queue direction mismatch in experimental_verify by @yehormalikov in https://github.com/axboe/fio/pull/2007\r\n* backend: get io_u from requeue if exists by @JeongJonghwi in https://github.com/axboe/fio/pull/1980\r\n* backend: fix zero-numberio in dry-run by @minwooim in https://github.com/axboe/fio/pull/2015\r\n* Mmap engine fixes by @geertj in https://github.com/axboe/fio/pull/2017\r\n* backend: fix OOB access in usec_for_io() with DDIR_SYNC by @fmayer in https://github.com/axboe/fio/pull/2028\r\n* fix musl builds by @baloo in https://github.com/axboe/fio/pull/2029\r\n* io_uring: don't segfault if pi_chk isn't specified by @calebsander in https://github.com/axboe/fio/pull/2030\r\n* 20251023 steady state add latency by @mcgrof in https://github.com/axboe/fio/pull/2003\r\n* write_hist_log: do not require ZLIB for non-server instances by @alex310110 in https://github.com/axboe/fio/pull/2033\r\n* windows: fix a Y2038 bug by replacing `Int32x32To64` with multiplication by @CookiePLMonster in https://github.com/axboe/fio/pull/2034\r\n* Sync for file operations by @struschev in https://github.com/axboe/fio/pull/2018\r\n* Add ZBD support for SMR drives to io_uring engine by @mannanal in https://github.com/axboe/fio/pull/2035\r\n* RBD Encryption Support by @Greenpepper15 in https://github.com/axboe/fio/pull/2039\r\n* stat: Avoid printing \"issued rwts\" when \"verify_only\" is supplied by @gautammenghani in https://github.com/axboe/fio/pull/2037\r\n* Add option to specify job process comm by @robertbaldyga in https://github.com/axboe/fio/pull/2045\r\n* backend: set td->eo to NULL after freeing eo by @malikoyv in https://github.com/axboe/fio/pull/2050\r\n* fio: sprandom: append newline to error message by @tomas-winkler-sndk in https://github.com/axboe/fio/pull/2051\r\n* workqueue: fix threads stall when running with io_submit_mode offload by @tomas-winkler-sndk in https://github.com/axboe/fio/pull/2053\r\n* SPRandom Cache Size Behavior Implementation by @cachyyyk in https://github.com/axboe/fio/pull/2044\r\n* fio: fixes for io_submit_mode=offload stability by @tomas-winkler-sndk in https://github.com/axboe/fio/pull/2058\r\n* Fix use-after-free of idle_prof_common variable by @jsemric in https://github.com/axboe/fio/pull/2066\r\n* options: fix heap-use-after-free in ioengine_so_path by @msuozzo in https://github.com/axboe/fio/pull/2070\r\n* options: add support more POSIX errnos by @minwooim in https://github.com/axboe/fio/pull/2071\r\n* backend: guard prctl(PR_SET_NAME) against NULL thread name by @Criticayon in https://github.com/axboe/fio/pull/2073\r\n* Fix stat_sem/rusage_sem deadlock during stats collection by @RyanTedrick in https://github.com/axboe/fio/pull/2076\r\n* iolog: free io_piece log on thread cleanup by @minwooim in https://github.com/axboe/fio/pull/2077\r\n\r\n## New Contributors\r\n* @Developer-Ecosystem-Engineering made their first contribution in https://github.com/axboe/fio/pull/1883\r\n* @Meiye-lj made their first contribution in https://github.com/axboe/fio/pull/1974\r\n* @kaimeyer-arcserve made their first contribution in https://github.com/axboe/fio/pull/1989\r\n* @stanleyzhang9 made their 