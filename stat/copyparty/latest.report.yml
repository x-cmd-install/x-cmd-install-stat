,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":815168,"digest":"sha256:6b7d2413afe236e29410b0e83df9aaf843abd246607269e52b83796c7ce0c143","download_count":58,"created_at":"2026-10-06T01:04:06Z","updated_at":"2026-10-06T01:04:07Z"},{"id":614061147,"node_id":"RA_kwDOCz9Wcs4kmdRb","name":"copyparty-sfx.py","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/x-python","state":"uploaded","size":1205416,"digest":"sha256:fed92d38ae9efe99b453a9d48020ba860758cc7b3207a8909e9495ffb600cd1f","download_count":1390,"created_at":"2026-10-06T01:04:04Z","updated_at":"2026-10-06T01:04:05Z"},{"id":614061327,"node_id":"RA_kwDOCz9Wcs4kmdUP","name":"copyparty.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":13206412,"digest":"sha256:dff72a65ffbba85ddb7748011efe44019b0effa6f9e96c0cbd8aff44fec7490e","download_count":445,"created_at":"2026-10-06T01:04:09Z","updated_at":"2026-10-06T01:04:10Z"},{"id":614061170,"node_id":"RA_kwDOCz9Wcs4kmdRy","name":"copyparty.pyz","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1170088,"digest":"sha256:42c9c42f87216264db5b23b753e590556a23df55d0047fdc05582b0d58faa104","download_count":72,"created_at":"2026-10-06T01:04:05Z","updated_at":"2026-10-06T01:04:06Z"},{"id":614061284,"node_id":"RA_kwDOCz9Wcs4kmdTk","name":"copyparty32.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":6635805,"digest":"sha256:cd0c96d0a3caf54ae15df29fc37c5fb910c69bec0c1215ceaeae159549f2a922","download_count":105,"created_at":"2026-10-06T01:04:08Z","updated_at":"2026-10-06T01:04:09Z"},{"id":614061226,"node_id":"RA_kwDOCz9Wcs4kmdSq","name":"helptext.html","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/html","state":"uploaded","size":284703,"digest":"sha256:d5bbb3a94f6e9e4dae9cafc2e004734140696271b5506e4021a8aa9f825723eb","download_count":83,"created_at":"2026-10-06T01:04:07Z","updated_at":"2026-10-06T01:04:07Z"},{"id":614061240,"node_id":"RA_kwDOCz9Wcs4kmdS4","name":"u2c.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":3494951,"digest":"sha256:3ef122978f959727e79be7ac98c30c4184ee40ca039ed40d85c567c1987e08fc","download_count":81,"created_at":"2026-10-06T01:04:07Z","updated_at":"2026-10-06T01:04:08Z"}],"body":"<img src=\"https://github.com/9001/copyparty/raw/hovudstraum/docs/logo.svg\" width=\"250\" align=\"right\"/>\r\n\r\n* read-only demo server at https://a.ocv.me/pub/demo/\r\n* [docker image](https://github.com/9001/copyparty/tree/hovudstraum/scripts/docker) \u2571 [similar software](https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md) \u2571 [client testbed](https://cd.ocv.me/b/)\r\n\r\nthere is a [discord server](https://discord.gg/25J8CdTT6G) with an `@everyone` in case of future important updates, such as [vulnerabilities](https://github.com/9001/copyparty/security) (most recently 2026-10-06)\r\n\r\n## \u26a0\ufe0f ATTN: this release mitigates a Windows/MacOS-specific issue with shadowing\r\n\r\n[GHSA-3c88-p299-7hvr](https://github.com/9001/copyparty/security/advisories/GHSA-3c88-p299-7hvr): due to windows/macos having case-insensitive (casefolding) filesystems, [shadowing](https://github.com/9001/copyparty/#shadowing) is not bulletproof, even with this fix\r\n\r\n## recent important news\r\n\r\n* [v1.20.25 (2026-10-05)](https://github.com/9001/copyparty/releases/tag/v1.20.25) improved shadowing on Windows/MacOS\r\n* [v1.20.19 (2026-07-27)](https://github.com/9001/copyparty/releases/tag/v1.20.19) fixed an FTP-server vuln (upload outside defined volumes)\r\n* [v1.20.17 (2026-07-06)](https://github.com/9001/copyparty/releases/tag/v1.20.17) introduced csp nonces, possibly breaking some javascript-based plugins\r\n\r\n## \ud83e\uddea new features\r\n\r\n* #1498 [--acao-re](https://copyparty.eu/cli/#g-acao-re) for allowing cross-domain access with more complex rules ab2299e3\r\n* #1652 [redup](https://copyparty.eu/cli/#redup-help-page): detect and skip hardlinks / reflinks which are already optimally deduplicated 08093578\r\n* [--sftp-fastldr](https://copyparty.eu/cli/#g-sftp-fastldr) to improve startup time on extremely old hardware 186cbf93\r\n* [--sftp-chattr](https://copyparty.eu/cli/#g-sftp-chattr) to restrict chattr to certain properties e59fc05e\r\n\r\n## \ud83e\ude79 bugfixes\r\n\r\n* GHSA-3c88-p299-7hvr e8de4211\r\n  * for further context, torvalds has some [technically accurate and colourful opinions](https://lore.kernel.org/lkml/CAHk-=wjajMJyoTv2KZdpVRoPn0LFZ94Loci37WLVXmMxDbLOjg@mail.gmail.com/) (nsfw) on how casefolding filesystems are an ongoing mistake\r\n  * on a more serious note, [the readme was updated](https://github.com/9001/copyparty/#shadowing)\r\n* fix uploads struggling to resume from a network glitch if the server filesystem is FAT32 or exFAT 23e00c0a 731dbbff\r\n* #1647 shares: fix cleanup of single-file shares when manually deleted before expiration (thx @willie6666!) f445bfa8\r\n* #1660 ban-pw now more aggressive on failed basic-auth (thx @PAStheLoD!) 5e0a88e3\r\n* #1656 webdav: return 404 instead of 400 when file didn't exist 74b17374\r\n* fix navigating to an index.html webroot (thx @tilse!) 334dccc5\r\n* fix IP-address detection on Windows XP 107dec9e\r\n\r\n## \ud83d\udd27 other changes\r\n\r\n* #1658 constant-time verification of filekeys/dirkeys (thx @rozbb!) a31870cb\r\n* prevent enabling the smb server unless `--hack-me-bro` is also enabled because the smb-server was intentionally made super-insecure so it would work with ancient outdated equipment in emergencies and should never be used otherwise 1341b342\r\n* now possible to upload [09. t+pazolite - I still think about y%#'()_*{\\\\\"'&36)%(\"'$&''&(15y!!!_??*`~.flac](https://www.youtube.com/watch?v=btPU_rluFSE) (dont click that link on acid) 28f9f6f0 64f574fe\r\n\r\n## \ud83c\udf20 fun facts\r\n\r\n* [thx t+paz](https://a.ocv.me/pub/g/2026/10/Screenshot_20261002-221751_1.png?cache)\r\n\r\n----\r\n\r\n# \ud83d\udcbe what to download?\r\n| download link | is it good? | description |\r\n| -- | -- | -- |\r\n| **[copyparty-sfx.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-sfx.py)** | \u2705 the best \ud83d\udc4d | runs anywhere! only needs python |\r\n| [copyparty-en.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.py) | \u2705 also good | same but english-only, no i18n |\r\n| [a docker image](https://github.com/9001/copyparty/blob/hovudstraum/scripts/docker/README.md) | it's ok | good if you prefer docker \ud83d\udc0b |\r\n| [copyparty.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty.exe) |  \u26a0\ufe0f [acceptable](https://github.com/9001/copyparty#copypartyexe) | for [win8](https://user-images.githubusercontent.com/241032/221445946-1e328e56-8c5b-44a9-8b9f-dee84d942535.png) or later; built-in thumbnailer |\r\n| [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.25/u2c.exe) | \u26a0\ufe0f acceptable | [CLI uploader](https://github.com/9001/copyparty/blob/hovudstraum/bin/u2c.py) as a win7+ exe ([video](https://a.ocv.me/pub/demo/pics-vids/u2cli.webm)) |\r\n| [copyparty.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty.pyz) | \u26a0\ufe0f acceptable | similar to the regular sfx, [mostly worse](https://github.com/9001/copyparty#zipapp) |\r\n| [copyparty-en.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.pyz) | \u26a0\ufe0f acceptable | english-only, no smb-server |\r\n| [copyparty32.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty32.exe) | \u26d4\ufe0f [dangerous](https://github.com/9001/copyparty#copypartyexe) | for [win7](https://user-images.githubusercontent.com/241032/221445944-ae85d1f4-d351-4837-b130-82cab57d6cca.png) -- never expose to the internet! |\r\n| [cpp-winpe64.exe](https://github.com/9001/copyparty/releases/download/v1.16.5/copyparty-winpe64.exe) | \u26d4\ufe0f dangerous | runs on [64bit WinPE](https://user-images.githubusercontent.com/241032/205454984-e6b550df-3c49-486d-9267-1614078dd0dd.png), otherwise useless |\r\n| [bootable usb](https://a.ocv.me/pub/stuff/edcd001/enterprise-edition/) | \u2510(\uff9f\u2200\uff9f)\u250c | a surprisingly useful joke (x86_64) |\r\n\r\n* except for [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.25/u2c.exe), all of the options above are mostly equivalent\r\n* the zip and tar.gz files below are just source code\r\n* python packages are available at [PyPI](https://pypi.org/project/copyparty/#files)","reactions":{"total_count":12,"+1":9,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":4}
