{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":818208,"digest":"sha256:cacdbe9eb5fe3b3c0de647c8a13384cb26e9013c7e0396378e1d43af1f31c130","download_count":43,"created_at":"2026-11-22T22:48:45Z","updated_at":"2026-11-22T22:48:46Z"},{"id":780720055,"node_id":"RA_kwDOCz9Wcs4uiNe3","name":"copyparty-sfx.py","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/x-python","state":"uploaded","size":1208495,"digest":"sha256:0f5c7aa06347cab658f665d89e87ad3aeda5f4aa6f148ded918eb9ac14816fac","download_count":404,"created_at":"2026-11-22T22:48:46Z","updated_at":"2026-11-22T22:48:46Z"},{"id":780719799,"node_id":"RA_kwDOCz9Wcs4uiNa3","name":"copyparty.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":13230917,"digest":"sha256:9353c80f9b64c1b9ad0c88e0931a5b9d8f77eb33fd91956f89c9a4849327653c","download_count":121,"created_at":"2026-11-22T22:48:38Z","updated_at":"2026-11-22T22:48:41Z"},{"id":780719900,"node_id":"RA_kwDOCz9Wcs4uiNcc","name":"copyparty.pyz","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1173122,"digest":"sha256:bd99434aa3eded7459a5d022de6533acea36e1f2411ee20760b23e656f47dba8","download_count":44,"created_at":"2026-11-22T22:48:41Z","updated_at":"2026-11-22T22:48:41Z"},{"id":780719917,"node_id":"RA_kwDOCz9Wcs4uiNct","name":"copyparty32.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":6639557,"digest":"sha256:c8430a5cc70be7a39423d27511e520f52030748575384609e706014d5155aa8e","download_count":62,"created_at":"2026-11-22T22:48:41Z","updated_at":"2026-11-22T22:48:43Z"},{"id":780720071,"node_id":"RA_kwDOCz9Wcs4uiNfH","name":"helptext.html","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/html","state":"uploaded","size":285626,"digest":"sha256:cb57b6b80ecbf3fe01b091878c47fab6e6546bdb1b44fba040a0437549ccc5f8","download_count":45,"created_at":"2026-11-22T22:48:46Z","updated_at":"2026-11-22T22:48:47Z"}],"body":"<img src=\"https://github.com/9001/copyparty/raw/hovudstraum/docs/logo.svg\" width=\"250\" align=\"right\"/>\r\n\r\n* read-only demo server at https://a.ocv.me/pub/demo/\r\n* [docker image](https://github.com/9001/copyparty/tree/hovudstraum/scripts/docker) ╱ [similar software](https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md) ╱ [client testbed](https://cd.ocv.me/b/)\r\n\r\nthere is a [discord server](https://discord.gg/25J8CdTT6G) with an `@everyone` in case of future important updates, such as [vulnerabilities](https://github.com/9001/copyparty/security) (most recently 2026-11-22)\r\n\r\n## ⚠️ ATTN: this release fixes security issues:\r\n\r\n* GHSA-8gpx-8h68-6wgh -- [dirkeys](https://github.com/9001/copyparty/#dirkeys) allowed downloading from subfolders\r\n* GHSA-677g-3f98-vr4p -- SFTP: users with read-access could truncate files\r\n* GHSA-j7p7-25xm-9pv6 -- csrf; not a concern in default/reasonable deployments\r\n* GHSA-q5w8-q9m6-8xw5 -- xss; ideally also of minimal concern\r\n* None of these issues were exploitable by default; they all required certain features to be enabled or changed\r\n\r\n## 🩹 bugfixes\r\n\r\n* #1698 logout failing in hybrid idp deployments\r\n* #1679 login failing in some reverseproxy setups\r\n\r\n## 🔧 other changes\r\n\r\n* docker: build pillow from source to get v13 since v13 fixes vulns but cannot be backported to current alpine stable because it also has breaking changes which doesnt affect copyparty\r\n\r\n## 🧪 new features\r\n\r\n* can now [bind/listen](https://copyparty.eu/cli/#bind-help-page) on:\r\n  * subnets such as `-i 192.168.0.0/16`\r\n  * nic-names such as `-i eth0,wlan0`\r\n  * ipv6 linklocal such as `-i fe80::deca%wlan0`\r\n  * when binding to subnets or nic-name, beware that new IPs are NOT detected at runtime, so ensure all IPs are NIC-assigned before startup\r\n* textfile editor can be used even when [nohtml](https://copyparty.eu/cli/#g-no-html) enabled\r\n* [--bauth-q](https://copyparty.eu/cli/#g-bauth-q) to configure the basic-auth realm\r\n* [--sftp-ipa](https://copyparty.eu/cli/#g-sftp-ipa) to restrict sftp to certain client IPs\r\n  * please do not rely on this for security; ssh has pubkey-auth for a reason\r\n* [--scots](https://copyparty.eu/cli/#g-scots)\r\n\r\n## ☄️ facts\r\n\r\n* already obvious, but here's the confirmation: I'm not able to spend time on copyparty at the moment, definitely until 2027-03, maybe longer. Fixing vulnerabilities and severe bugs in a timely manner is still target, but right now not much else\r\n\r\n----\r\n\r\n# 💾 what to download?\r\n| download link | is it good? | description |\r\n| -- | -- | -- |\r\n| **[copyparty-sfx.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-sfx.py)** | ✅ the best 👍 | runs anywhere! only needs python |\r\n| [copyparty-en.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.py) | ✅ also good | same but english-only, no i18n |\r\n| [a docker image](https://github.com/9001/copyparty/blob/hovudstraum/scripts/docker/README.md) | it's ok | good if you prefer docker 🐋 |\r\n| [copyparty.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty.exe) |  ⚠️ [acceptable](https://github.com/9001/copyparty#copypartyexe) | for [win8](https://user-images.githubusercontent.com/241032/221445946-1e328e56-8c5b-44a9-8b9f-dee84d942535.png) or later; built-in thumbnailer |\r\n| [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.25/u2c.exe) | ⚠️ acceptable | [CLI uploader](https://github.com/9001/copyparty/blob/hovudstraum/bin/u2c.py) as a win7+ exe ([video](https://a.ocv.me/pub/demo/pics-vids/u2cli.webm)) |\r\n| [copyparty.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty.pyz) | ⚠️ acceptable | similar to the regular sfx, [mostly worse](https://github.com/9001/copyparty#zipapp) |\r\n| [copyparty-en.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.pyz) | ⚠️ acceptable | english-only, no smb-server |\r\n| [copyparty32.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty32.exe) | ⛔️ [dangerous](https://github.com/9001/copyparty#copypartyexe) | for [win7](https://user-images.githubusercontent.com/241032/221445944-ae85d1f4-d351-4837-b130-82cab57d6cca.png) -- never expose to the internet! |\r\n| [cpp-winpe64.exe](https://github.com/9001/copyparty/releases/download/v1.16.5/copyparty-winpe64.exe) | ⛔️ dangerous | runs on [64bit WinPE](https://user-images.githubusercontent.com/241032/205454984-e6b550df-3c49-486d-9267-1614078dd0dd.png), otherwise useless |\r\n| [bootable usb](https://a.ocv.me/pub/stuff/edcd001/enterprise-edition/) | ┐(ﾟ∀ﾟ)┌ | a surprisingly useful joke (x86_64) |\r\n\r\n* except for [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.25/u2c.exe), all of the options above are mostly equivalent\r\n* the zip and tar.gz files below are just source code\r\n* python packages are available at [PyPI](https://pypi.org/project/copyparty/#files)","reactions":{"total_count":9,"+1":3,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":3,"rocket":0,"eyes":0}}
