ype":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":6633017,"digest":"sha256:6315d52076a1588c46531e86026b161215d13b930407a2ba05b865dbda4a372e","download_count":113,"created_at":"2026-09-19T22:04:38Z","updated_at":"2026-09-19T22:04:39Z"},{"id":575565039,"node_id":"RA_kwDOCz9Wcs4iTmzv","name":"helptext.html","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/html","state":"uploaded","size":283085,"digest":"sha256:736da5427a0c145fd734ac375d4098c222c03bd0da957c1e37ba503073b15b82","download_count":125,"created_at":"2026-09-19T22:04:42Z","updated_at":"2026-09-19T22:04:42Z"}],"body":"<img src=\"https://github.com/9001/copyparty/raw/hovudstraum/docs/logo.svg\" width=\"250\" align=\"right\"/>\r\n\r\n* read-only demo server at https://a.ocv.me/pub/demo/\r\n* [docker image](https://github.com/9001/copyparty/tree/hovudstraum/scripts/docker) \u2571 [similar software](https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md) \u2571 [client testbed](https://cd.ocv.me/b/)\r\n\r\nthere is a [discord server](https://discord.gg/25J8CdTT6G) with an `@everyone` in case of future important updates, such as [vulnerabilities](https://github.com/9001/copyparty/security) (most recently 2026-07-27)\r\n\r\n## recent important news\r\n\r\n* [v1.20.19 (2026-07-27)](https://github.com/9001/copyparty/releases/tag/v1.20.19) fixed an FTP-server vuln (upload outside defined volumes)\r\n* [v1.20.17 (2026-07-06)](https://github.com/9001/copyparty/releases/tag/v1.20.17) fixed a vuln when a volume has both filekeys and dirkeys enabled\r\n* [v1.20.17 (2026-07-06)](https://github.com/9001/copyparty/releases/tag/v1.20.17) introduced csp nonces, possibly breaking some javascript-based plugins\r\n\r\n## \ud83e\uddea new features\r\n\r\n* new option [--redup](https://copyparty.eu/cli/#g-redup) (global or volflag) to convert local files between various dedup approaches fd4f4341 22915902 16a3f5d5\r\n  * turn full copies into reflinks/symlinks/hardlinks or convert between those\r\n  * run it with `--redup-dry` (dryrun) to check for unexpected consequences\r\n  * WARNING: maybe take a snapshot of your filesystem before enabling this; brand new code with little testing, read [--help-redup](https://copyparty.eu/cli/#redup-help-page) and use with care\r\n    * ~~the feature is currently being stress-tested; results on tuesday~~\r\n    * seems fine for converting between symlinks and reflinks, probably hardlinks too\r\n* #1643 textfile-viewer can detect filetype from shebang (thx @botahamec!) 097b8305\r\n* when dedup with [reflink](https://copyparty.eu/cli/#g-reflink) is enabled, then also dedup between volumes when possible (since reflink makes that safe) 735d6e00 5ddbce31\r\n* option [-i no](https://copyparty.eu/cli/#bind-help-page) to launch copyparty without the webserver, for indexing / testing / whatever c92435c2\r\n\r\n## \ud83e\ude79 bugfixes\r\n\r\n* if `--dedup` was enabled, then copying a file from one volume to another could dedup (create a symlink/hardlink/reflink) instead of a full copy 947d73ee\r\n  * mainly an issue for portable storage such as flashdrives, and the main reason why `--redup` was added\r\n* the list of filenames given as input to xiu hooks did not have a trailing newline c688bb2e\r\n* #1611 volflag `nosub` would still result in empty folders from up2k ec4a95e1\r\n* fix `PRTY_NO_IFADDR` 6867ccc5\r\n\r\n## \ud83d\udd27 other changes\r\n\r\n* iOS: further improved upload-speeds on buggy iOS versions 971a62cc\r\n  * looks like apple is working on fixing this bug; iOS v27 made https way more stable but http is still just as broken, so improved the workaround a bit more\r\n* added [--help-dedup](https://copyparty.eu/cli/#dedup-help-page) and [--help-redup](https://copyparty.eu/cli/#redup-help-page) 22915902 16a3f5d5\r\n* add a warning that the sourceforge project is not official and probably malware bfc3cff8\r\n\r\n## \ud83c\udf20 fun facts\r\n\r\n* the [railgun roulette vip-mix](https://www.youtube.com/watch?v=mv9BmrzkiJc) has the same bpm as the [turn-signal on a honda jazz](https://a.ocv.me/pub/stuff/music/railgun-roulette-honda-remix.opus)\r\n  * on that note, [this fantasy-OPNA remake](https://www.youtube.com/watch?v=hv2hr8aPBMU) is too awesome to leave out\r\n\r\n----\r\n\r\n# \ud83d\udcbe what to download?\r\n| download link | is it good? | description |\r\n| -- | -- | -- |\r\n| **[copyparty-sfx.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-sfx.py)** | \u2705 the best \ud83d\udc4d | runs anywhere! only needs python |\r\n| [copyparty-en.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.py) | \u2705 also good | same but english-only, no i18n |\r\n| [a docker image](https://github.com/9001/copyparty/blob/hovudstraum/scripts/docker/README.md) | it's ok | good if you prefer docker \ud83d\udc0b |\r\n| [copyparty.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty.exe) |  \u26a0\ufe0f [acceptable](https://github.com/9001/copyparty#copypartyexe) | for [win8](https://user-images.githubusercontent.com/241032/221445946-1e328e56-8c5b-44a9-8b9f-dee84d942535.png) or later; built-in thumbnailer |\r\n| [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.22/u2c.exe) | \u26a0\ufe0f acceptable | [CLI uploader](https://github.com/9001/copyparty/blob/hovudstraum/bin/u2c.py) as a win7+ exe ([video](https://a.ocv.me/pub/demo/pics-vids/u2cli.webm)) |\r\n| [copyparty.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty.pyz) | \u26a0\ufe0f acceptable | similar to the regular sfx, [mostly worse](https://github.com/9001/copyparty#zipapp) |\r\n| [copyparty-en.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.pyz) | \u26a0\ufe0f acceptable | english-only, no smb-server |\r\n| [copyparty32.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty32.exe) | \u26d4\ufe0f [dangerous](https://github.com/9001/copyparty#copypartyexe) | for [win7](https://user-images.githubusercontent.com/241032/221445944-ae85d1f4-d351-4837-b130-82cab57d6cca.png) -- never expose to the internet! |\r\n| [cpp-winpe64.exe](https://github.com/9001/copyparty/releases/download/v1.16.5/copyparty-winpe64.exe) | \u26d4\ufe0f dangerous | runs on [64bit WinPE](https://user-images.githubusercontent.com/241032/205454984-e6b550df-3c49-486d-9267-1614078dd0dd.png), otherwise useless |\r\n| [bootable usb](https://a.ocv.me/pub/stuff/edcd001/enterprise-edition/) | \u2510(\uff9f\u2200\uff9f)\u250c | a surprisingly useful joke (x86_64) |\r\n\r\n* except for [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.22/u2c.exe), all of the options above are mostly equivalent\r\n* the zip and tar.gz files below are just source code\r\n* python packages are available at [PyPI](https://pypi.org/project/copyparty/#files)","reactions":{"total_count":18,"+1":6,"-1":0,"laugh":1,"hooray":4,"confused":0,"heart":3,"rocket":4,"eyes":0},"mentions_count":1}
