:"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":808945,"digest":"sha256:daf0faeff249e8c70c1f15f0d4965519187182a7f89d46c8b12a79bd66c7ae16","download_count":45,"created_at":"2026-09-06T23:07:07Z","updated_at":"2026-09-06T23:07:08Z"},{"id":547794381,"node_id":"RA_kwDOCz9Wcs4gpq3N","name":"copyparty-sfx.py","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/x-python","state":"uploaded","size":1199353,"digest":"sha256:d8a57376a1bd33f93b9e0c0c3f57e9f3705c0ecec5a757d7720281f438086dd9","download_count":1918,"created_at":"2026-09-06T23:07:06Z","updated_at":"2026-09-06T23:07:06Z"},{"id":547794417,"node_id":"RA_kwDOCz9Wcs4gpq3x","name":"copyparty.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":13042005,"digest":"sha256:155a096724d43c04ac62ef71f6d7142c583400ac2ef0b15d16ce1e4b50c9652e","download_count":475,"created_at":"2026-09-06T23:07:09Z","updated_at":"2026-09-06T23:07:11Z"},{"id":547794389,"node_id":"RA_kwDOCz9Wcs4gpq3V","name":"copyparty.pyz","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1163853,"digest":"sha256:cb6e32c8d34ad9439ae515d3b90ad2af8ecef93f4589d0be4d9aaefc3d56fda2","download_count":55,"created_at":"2026-09-06T23:07:06Z","updated_at":"2026-09-06T23:07:07Z"},{"id":547794410,"node_id":"RA_kwDOCz9Wcs4gpq3q","name":"copyparty32.exe","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":6628048,"digest":"sha256:9d12c7f9183ae5386cfae2804d80d8305615cadfada31e2d7b01c3628b5a5a2d","download_count":77,"created_at":"2026-09-06T23:07:08Z","updated_at":"2026-09-06T23:07:09Z"},{"id":547794406,"node_id":"RA_kwDOCz9Wcs4gpq3m","name":"helptext.html","label":null,"uploader":{"login":"9001","id":241032,"node_id":"MDQ6VXNlcjI0MTAzMg==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/html","state":"uploaded","size":277256,"digest":"sha256:7762834cf9a04fbcccab6b3f935c6f2d509e4d93e806e2d3ff016f6798306eeb","download_count":79,"created_at":"2026-09-06T23:07:08Z","updated_at":"2026-09-06T23:07:08Z"}],"body":"<img src=\"https://github.com/9001/copyparty/raw/hovudstraum/docs/logo.svg\" width=\"250\" align=\"right\"/>\r\n\r\n* read-only demo server at https://a.ocv.me/pub/demo/\r\n* [docker image](https://github.com/9001/copyparty/tree/hovudstraum/scripts/docker) \u2571 [similar software](https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md) \u2571 [client testbed](https://cd.ocv.me/b/)\r\n\r\nthere is a [discord server](https://discord.gg/25J8CdTT6G) with an `@everyone` in case of future important updates, such as [vulnerabilities](https://github.com/9001/copyparty/security) (most recently 2026-07-27)\r\n\r\n## recent important news\r\n\r\n* [v1.20.19 (2026-07-27)](https://github.com/9001/copyparty/releases/tag/v1.20.19) fixed an FTP-server vuln (upload outside defined volumes)\r\n* [v1.20.17 (2026-07-06)](https://github.com/9001/copyparty/releases/tag/v1.20.17) fixed a vuln when a volume has both filekeys and dirkeys enabled\r\n* [v1.20.17 (2026-07-06)](https://github.com/9001/copyparty/releases/tag/v1.20.17) introduced csp nonces, possibly breaking some javascript-based plugins\r\n\r\n## \ud83e\ude79 bugfixes\r\n\r\n* the custom right-click-menu didn't like being enabled ad9994be\r\n  * this release is a hotfix for that; see [v1.20.22](https://github.com/9001/copyparty/releases/tag/v1.20.22) for all the other new stuff\r\n\r\n## \ud83c\udf20 fun facts\r\n\r\n* #887 copyparty has been packaged for Fedora 44! And EPEL-10 is on the way too... Thx @supakeen o/\r\n  * [verified at RevSpace NL](https://a.ocv.me/pub/g/2026/09/20260901_151949.jpg?cache)\r\n\r\n----\r\n\r\n# \ud83d\udcbe what to download?\r\n| download link | is it good? | description |\r\n| -- | -- | -- |\r\n| **[copyparty-sfx.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-sfx.py)** | \u2705 the best \ud83d\udc4d | runs anywhere! only needs python |\r\n| [copyparty-en.py](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.py) | \u2705 also good | same but english-only, no i18n |\r\n| [a docker image](https://github.com/9001/copyparty/blob/hovudstraum/scripts/docker/README.md) | it's ok | good if you prefer docker \ud83d\udc0b |\r\n| [copyparty.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty.exe) |  \u26a0\ufe0f [acceptable](https://github.com/9001/copyparty#copypartyexe) | for [win8](https://user-images.githubusercontent.com/241032/221445946-1e328e56-8c5b-44a9-8b9f-dee84d942535.png) or later; built-in thumbnailer |\r\n| [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.22/u2c.exe) | \u26a0\ufe0f acceptable | [CLI uploader](https://github.com/9001/copyparty/blob/hovudstraum/bin/u2c.py) as a win7+ exe ([video](https://a.ocv.me/pub/demo/pics-vids/u2cli.webm)) |\r\n| [copyparty.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty.pyz) | \u26a0\ufe0f acceptable | similar to the regular sfx, [mostly worse](https://github.com/9001/copyparty#zipapp) |\r\n| [copyparty-en.pyz](https://github.com/9001/copyparty/releases/latest/download/copyparty-en.pyz) | \u26a0\ufe0f acceptable | english-only, no smb-server |\r\n| [copyparty32.exe](https://github.com/9001/copyparty/releases/latest/download/copyparty32.exe) | \u26d4\ufe0f [dangerous](https://github.com/9001/copyparty#copypartyexe) | for [win7](https://user-images.githubusercontent.com/241032/221445944-ae85d1f4-d351-4837-b130-82cab57d6cca.png) -- never expose to the internet! |\r\n| [cpp-winpe64.exe](https://github.com/9001/copyparty/releases/download/v1.16.5/copyparty-winpe64.exe) | \u26d4\ufe0f dangerous | runs on [64bit WinPE](https://user-images.githubusercontent.com/241032/205454984-e6b550df-3c49-486d-9267-1614078dd0dd.png), otherwise useless |\r\n| [bootable usb](https://a.ocv.me/pub/stuff/edcd001/enterprise-edition/) | \u2510(\uff9f\u2200\uff9f)\u250c | a surprisingly useful joke (x86_64) |\r\n\r\n* except for [u2c.exe](https://github.com/9001/copyparty/releases/download/v1.20.22/u2c.exe), all of the options above are mostly equivalent\r\n* the zip and tar.gz files below are just source code\r\n* python packages are available at [PyPI](https://pypi.org/project/copyparty/#files)","reactions":{"total_count":15,"+1":9,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":5,"rocket":1,"eyes":0},"mentions_count":1}
