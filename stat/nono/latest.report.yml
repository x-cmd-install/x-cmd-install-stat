om/nolabs-ai/nono/pull/1935\r\n* ci: harden workflow permissions and add ShellCheck by @SequeI in https://github.com/nolabs-ai/nono/pull/1934\r\n* fix: provide workflow scope by @SequeI in https://github.com/nolabs-ai/nono/pull/1937\r\n* chore(nix): update prebuilt hashes for v0.78.0 by @SequeI in https://github.com/nolabs-ai/nono/pull/1936\r\n* fix(cli): keep protected-root attempts out of actionable denial guidance by @SequeI in https://github.com/nolabs-ai/nono/pull/1941\r\n* fix(policy): let man/apropos/whatis work on Linux by @david-a-wheeler in https://github.com/nolabs-ai/nono/pull/1953\r\n* docs(sandbox): add docker tool sandbox prototype example  by @lukehinds in https://github.com/nolabs-ai/nono/pull/1955\r\n* fix(exec): keep session temp files alive against the OS reaper by @panga in https://github.com/nolabs-ai/nono/pull/1942\r\n* chore(deps): bump docker/build-push-action from 7.3.0 to 7.4.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1962\r\n* chore(deps): bump docker/setup-buildx-action from 4.3.0 to 4.4.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1966\r\n* chore(deps): bump docker/setup-qemu-action from 4.3.0 to 4.4.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1969\r\n* chore(deps): bump typify from 0.7.0 to 0.8.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1965\r\n* chore(deps): bump rcgen from 0.14.9 to 0.14.10 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1963\r\n* chore(deps): bump syn from 3.0.3 to 3.0.6 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1967\r\n* chore(deps): bump serde_json from 1.0.150 to 1.0.151 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1964\r\n* chore(deps): bump uuid from 1.24.0 to 1.26.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1968\r\n* ci: acquire test_env::ENV_LOCK before calling host git by @SequeI in https://github.com/nolabs-ai/nono/pull/1972\r\n* feat(cli)!: remove legacy Claude hook cleanup by @SequeI in https://github.com/nolabs-ai/nono/pull/1973\r\n* fix(aur): update upstream URLs to nolabs-ai by @sarovin in https://github.com/nolabs-ai/nono/pull/1979\r\n* fix(proxy): decode chunked client-credentials token responses by @Gandem in https://github.com/nolabs-ai/nono/pull/1976\r\n* fix(tool-sandbox): isolate network policy by effective command scope by @SequeI in https://github.com/nolabs-ai/nono/pull/1981\r\n* feat(policy): add standalone Snap runtime group by @SequeI in https://github.com/nolabs-ai/nono/pull/1990\r\n* fix(policy): allow Linux font configuration reads by @SequeI in https://github.com/nolabs-ai/nono/pull/1991\r\n* docs(cli): correct credential flag source documentation by @Pybsama in https://github.com/nolabs-ai/nono/pull/1998\r\n* docs: standardize sandbox policy taxonomy by @SequeI in https://github.com/nolabs-ai/nono/pull/1993\r\n* fix(linux): preserve O_PATH in musl builds by @SequeI in https://github.com/nolabs-ai/nono/pull/2005\r\n* feat(cli): render proxy network denials in diagnostic footer by @lukehinds in https://github.com/nolabs-ai/nono/pull/1992\r\n* fix(cli): audit approval backend decisions prior to file operations by @lukehinds in https://github.com/nolabs-ai/nono/pull/2010\r\n* fix(tool-sandbox): derive shim broker socket from executable path by @panga in https://github.com/nolabs-ai/nono/pull/2002\r\n* fix(policy): allow reading Linux MIME types by @SequeI in https://github.com/nolabs-ai/nono/pull/2013\r\n* fix(keystore): refuse empty sanitized PATH for host-side brokers by @SebTardif in https://github.com/nolabs-ai/nono/pull/1895\r\n* docs(NEP): macOS keychain in nono-cli by @kurtisc in https://github.com/nolabs-ai/nono/pull/1982\r\n* chore(deps): bump futures-util from 0.3.32 to 0.3.34 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2014\r\n* chore(deps): bump dns-lookup from 2.1.1 to 4.0.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2015\r\n* chore(deps): bump rand from 0.10.2 to 0.10.3 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2016\r\n* chore(deps): bump clap from 4.6.6 to 4.6.7 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2017\r\n* chore(deps): bump hyper-rustls from 0.27.9 to 0.27.10 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2018\r\n* docs(neps): add nep 0004 for linux namespace isolation by @lukehinds in https://github.com/nolabs-ai/nono/pull/2021\r\n* feat(cli): launch and attach to remote agent sessions by @lukehinds in https://github.com/nolabs-ai/nono/pull/2022\r\n* feat(profile): add diagnostics.redaction.extra_env_vars by @christine-at-datadog in https://github.com/nolabs-ai/nono/pull/1917\r\n* fix: file grants negate filesystem.deny - #1949 by @kurtisc in https://github.com/nolabs-ai/nono/pull/2019\r\n* fix(macos): recursively block sockets under denied directories by @SequeI in https://github.com/nolabs-ai/nono/pull/2026\r\n* chore: release v0.79.0 by @SequeI in https://github.com/nolabs-ai/nono/pull/2027\r\n\r\n## New Contributors\r\n* @jbtechie made their first contribution in https://github.com/nolabs-ai/nono/pull/1931\r\n* @david-a-wheeler made their first contribution in https://github.com/nolabs-ai/nono/pull/1953\r\n* @Gandem made their first contribution in https://github.com/nolabs-ai/nono/pull/1976\r\n* @Pybsama made their first contribution in https://github.com/nolabs-ai/nono/pull/1998\r\n\r\n**Full Changelog**: https://github.com/nolabs-ai/nono/compare/v0.78.0...v0.79.0","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":13}
