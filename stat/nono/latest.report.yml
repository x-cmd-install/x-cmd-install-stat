: stop notifying retired downstream repos by @SequeI in https://github.com/nolabs-ai/nono/pull/2110\r\n* chore(nix): update prebuilt hashes for v0.80.0 by @github-actions[bot] in https://github.com/nolabs-ai/nono/pull/2109\r\n* chore(deps): bump ureq from 3.4.1 to 3.4.2 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2113\r\n* chore(deps): bump uuid from 1.26.1 to 1.28.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2114\r\n* chore(deps): bump tokio from 1.53.1 to 1.53.2 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2116\r\n* chore(deps): bump hyper from 1.11.1 to 1.12.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2117\r\n* chore(deps): bump hyper-util from 0.1.20 to 0.1.21 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2115\r\n* fix(proxy): use HTTP/1.1 for AWS intercept routes by @kurtisc in https://github.com/nolabs-ai/nono/pull/2111\r\n* feat(cli): skip approval requests for ungrantable procfs paths by @lukehinds in https://github.com/nolabs-ai/nono/pull/2054\r\n* chore(deps): group routine Dependabot updates by @SequeI in https://github.com/nolabs-ai/nono/pull/2119\r\n* chore(deps): bump the routine-rust group with 6 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2122\r\n* feat(profiles): require fully qualified package profile names by @SequeI in https://github.com/nolabs-ai/nono/pull/2118\r\n* fix(ci): update cargo audit failures by @kurtisc in https://github.com/nolabs-ai/nono/pull/2127\r\n* Update maintainers list by @lukehinds in https://github.com/nolabs-ai/nono/pull/2137\r\n* docs(readme): remove references to archived TypeScript and Go bindings by @kipz in https://github.com/nolabs-ai/nono/pull/2138\r\n* docs(readme): rewrite introduction and feature breakdown by @lukehinds in https://github.com/nolabs-ai/nono/pull/2139\r\n* docs(neps): add NEP 0007 for remote supervisor decisions over vsock by @lukehinds in https://github.com/nolabs-ai/nono/pull/2150\r\n* feat(linux): opt-in namespace isolation (NEP-0004) by @lukehinds in https://github.com/nolabs-ai/nono/pull/2145\r\n* docs(cli): document network.listen_port_range in profiles-groups by @LuckVd in https://github.com/nolabs-ai/nono/pull/2153\r\n* fix(policy): enable Nix runtime and cache/channel access by @jpds in https://github.com/nolabs-ai/nono/pull/2151\r\n* fix(policy): grant system_read_linux_core access to /var/lib/ca-certificates by @bharathvemula in https://github.com/nolabs-ai/nono/pull/2149\r\n* chore(release): automate NEP roadmap generation script and workflow by @lukehinds in https://github.com/nolabs-ai/nono/pull/2144\r\n* fix(proxy): resolve the Authorization phantom on token endpoint requests by @kipz in https://github.com/nolabs-ai/nono/pull/2136\r\n* fix(proxy): tolerate skew in certificates by @kurtisc in https://github.com/nolabs-ai/nono/pull/2126\r\n* chore(deps): bump dirs from 6.0.0 to 7.0.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2124\r\n* chore(deps): bump jsonschema from 0.56.0 to 0.58.6 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2123\r\n* fix(cli): keep --log-file output under --silent by @sreyas-endor in https://github.com/nolabs-ai/nono/pull/2159\r\n* chore(deps): bump the routine-rust group with 5 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2162\r\n* chore(deps): bump cachix/install-nix-action from 31.11.1 to 31.11.2 in the routine-actions group by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2161\r\n* chore(deps): bump the sigstore group across 1 directory with 2 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2160\r\n* feat(policy): add `rtk_state` group by @jpds in https://github.com/nolabs-ai/nono/pull/2155\r\n* refactor(headers): consolidate the HTTP token check by @jpds in https://github.com/nolabs-ai/nono/pull/2168\r\n* fix(cli): resolve wrapper exec after env assignments by @LuckVd in https://github.com/nolabs-ai/nono/pull/2165\r\n* feat(proxy): include denial_category in proxy deny log lines by @sreyas-endor in https://github.com/nolabs-ai/nono/pull/2173\r\n* chore(deps): update Rust TLS dependencies by @SequeI in https://github.com/nolabs-ai/nono/pull/2175\r\n* fix(proxy): retain ownership of credential command children by @Frankie-Xu in https://github.com/nolabs-ai/nono/pull/2073\r\n* fix(proxy): redact proxy audit paths, reasons, and upstream URLs by @jpds in https://github.com/nolabs-ai/nono/pull/2181\r\n* fix(profiles): simplify package profile listing for fully qualified names by @SequeI in https://github.com/nolabs-ai/nono/pull/2166\r\n* fix(proxy): honor connect ports in supervised mode by @LuckVd in https://github.com/nolabs-ai/nono/pull/2189\r\n* fix(proxy): answer 407 when an unauthenticated CONNECT arrives with an upstream proxy by @kipz in https://github.com/nolabs-ai/nono/pull/2133\r\n* chore(deps): bump ctutils to 0.4.4 by @SequeI in https://github.com/nolabs-ai/nono/pull/2192\r\n* chore: clean up workspace dependencies and build configuration by @SequeI in https://github.com/nolabs-ai/nono/pull/2210\r\n* perf(linux): read only the ELF regions the exec gate parses by @jeremy in https://github.com/nolabs-ai/nono/pull/2195\r\n* chore(deps): bump the routine-actions group with 2 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2203\r\n* chore(deps): bump the routine-rust group across 1 directory with 9 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2212\r\n* chore(deps): bump the sigstore group across 1 directory with 2 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2202\r\n* chore(deps): bump jsonschema from 0.58.6 to 0.60.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2205\r\n* chore(deps): bump vt100 from 0.16.2 to 0.18.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2206\r\n* fix(oauth-capture): rewrite form-urlencoded OAuth token responses by @kipz in https://github.com/nolabs-ai/nono/pull/1836\r\n* fix(sandbox): deny io_uring during AF_UNIX mediation by @SequeI in https://github.com/nolabs-ai/nono/pull/2215\r\n* fix(proxy): prevent UTF-8 nonce parsing panic by @SequeI in https://github.com/nolabs-ai/nono/pull/2216\r\n* feat(sandbox): detect Landlock ABI up to V9, keep enforcement at V6 by @lukehinds in https://github.com/nolabs-ai/nono/pull/2217\r\n* feat(proxy): network approval backends by @panga in https://github.com/nolabs-ai/nono/pull/1781\r\n* docs(claude): clarify packaged macOS keychain access by @SequeI in https://github.com/nolabs-ai/nono/pull/2219\r\n* fix(why): add pathname Unix socket policy diagnostics by @SequeI in https://github.com/nolabs-ai/nono/pull/2220\r\n* docs(neps): add nep-0008 session flight recorder proposal by @lukehinds in https://github.com/nolabs-ai/nono/pull/2223\r\n* fix(proxy): redeem phantoms inside Basic credentials on token endpoints by @kipz in https://github.com/nolabs-ai/nono/pull/2225\r\n* docs: document safe Codex app server isolation by @SequeI in https://github.com/nolabs-ai/nono/pull/2227\r\n* chore: release v0.81.0 by @SequeI in https://github.com/nolabs-ai/nono/pull/2229\r\n\r\n## New Contributors\r\n* @LuckVd made their first contribution in https://github.com/nolabs-ai/nono/pull/2153\r\n* @jpds made their first contribution in https://github.com/nolabs-ai/nono/pull/2151\r\n* @bharathvemula made their first contribution in https://github.com/nolabs-ai/nono/pull/2149\r\n* @sreyas-endor made their first contribution in https://github.com/nolabs-ai/nono/pull/2159\r\n* @jeremy made their first contribution in https://github.com/nolabs-ai/nono/pull/2195\r\n\r\n**Full Changelog**: https://github.com/nolabs-ai/nono/compare/v0.80.0...v0.81.0","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":12}
