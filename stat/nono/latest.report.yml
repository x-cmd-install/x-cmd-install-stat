://github.com/nolabs-ai/nono/security/advisories/GHSA-8r33-hr9m-69wh)\r\n- [GHSA-wjv5-93q3-xm73](https://github.com/nolabs-ai/nono/security/advisories/GHSA-wjv5-93q3-xm73)\r\n\r\n## What's Changed\r\n* docs(cli): update built-in profiles and groups list by @lukehinds in https://github.com/nolabs-ai/nono/pull/1840\r\n* feat(profile)!: remove all legacy aliases and deprecation shims for v1.0.0 prep by @SequeI in https://github.com/nolabs-ai/nono/pull/1826\r\n* docs(cli): link built-in groups to their policy.json source by @SequeI in https://github.com/nolabs-ai/nono/pull/1850\r\n* fix(cli): ignore unhandled keys in the denied-path review selector by @MateSaary in https://github.com/nolabs-ai/nono/pull/1852\r\n* fix(cli): always re-invoke the credential source for ambient captures by @kipz in https://github.com/nolabs-ai/nono/pull/1849\r\n* fix(lib): validate localhost port ranges for zero end and inverted ranges by @Ayush7614 in https://github.com/nolabs-ai/nono/pull/1860\r\n* fix(cli): guard denied-path selector against type-ahead by @MateSaary in https://github.com/nolabs-ai/nono/pull/1863\r\n* fix(cli): keep legacy ~/.claude.json in sync with CLAUDE_CONFIG_DIR redirects by @SequeI in https://github.com/nolabs-ai/nono/pull/1837\r\n* ci: run full integration suite on PRs by @SequeI in https://github.com/nolabs-ai/nono/pull/1872\r\n* feat(cli): use CLONE_FILES bootstrap for network-notification sessions by @lukehinds in https://github.com/nolabs-ai/nono/pull/1825\r\n* chore: release v0.77.0 by @lukehinds in https://github.com/nolabs-ai/nono/pull/1874\r\n* fix(proxy): fail closed when upstream DNS returns no addresses by @SebTardif in https://github.com/nolabs-ai/nono/pull/1894\r\n* feat(macos): allow opting out of implicit DNS grants by @domenkozar in https://github.com/nolabs-ai/nono/pull/1876\r\n* fix(cli): reject . and .. in pack namespace and name by @SebTardif in https://github.com/nolabs-ai/nono/pull/1896\r\n* fix(cli): harden calculate_dir_size against silent errors and symlink cycles by @Ayush7614 in https://github.com/nolabs-ai/nono/pull/1862\r\n* feat(cli): backend-signed approval webhooks with submit-and-poll by @lukehinds in https://github.com/nolabs-ai/nono/pull/1879\r\n* feat(cleanup)!: remove remaining deprecated surfaces by @SequeI in https://github.com/nolabs-ai/nono/pull/1871\r\n* fix(cli): stop save-prompt failures from overriding the child exit code by @SequeI in https://github.com/nolabs-ai/nono/pull/1804\r\n* fix(why): tolerate volatile process-relative aliases in --self reload by @tim-nordell-nimbelink in https://github.com/nolabs-ai/nono/pull/1873\r\n* feat(nix): add #prebuilt output for release tarball installs by @levonk in https://github.com/nolabs-ai/nono/pull/1823\r\n* fix(cli): pass through AF_UNIX traffic in proxy-only mode by @lukehinds in https://github.com/nolabs-ai/nono/pull/1902\r\n* test: isolate integration suite XDG state by @SequeI in https://github.com/nolabs-ai/nono/pull/1911\r\n* chore(deps): bump DeterminateSystems/nix-installer-action from 22 to 23 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1904\r\n* build(deps): update rustls and chacha20 by @SequeI in https://github.com/nolabs-ai/nono/pull/1915\r\n* chore(deps): bump DeterminateSystems/magic-nix-cache-action from 14 to 15 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1906\r\n* chore(deps): bump aws-lc-rs from 1.18.0 to 1.18.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1907\r\n* chore(deps): bump aws-config from 1.10.1 to 1.12.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1909\r\n* chore(deps): bump jsonschema from 0.48.0 to 0.56.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1908\r\n* chore(deps): bump ureq from 3.4.0 to 3.4.1 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1905\r\n* chore(deps): bump landlock from 0.4.5 to 0.4.7 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/1910\r\n* fix(proxy): preserve query string on jwt-bearer token_url by @SebTardif in https://github.com/nolabs-ai/nono/pull/1913\r\n* ci: add release runbook and preflight checks by @SequeI in https://github.com/nolabs-ai/nono/pull/1914\r\n* chore: refresh maintainer guidance and remove stale references by @SequeI in https://github.com/nolabs-ai/nono/pull/1922\r\n* fix(tool-sandbox): fall back to the interpreter's directory for RPATH-less ELF dependencies by @Ekleog in https://github.com/nolabs-ai/nono/pull/1650\r\n* chore: release v0.78.0 by @SequeI in https://github.com/nolabs-ai/nono/pull/1928\r\n\r\n## New Contributors\r\n* @Ayush7614 made their first contribution in https://github.com/nolabs-ai/nono/pull/1860\r\n* @domenkozar made their first contribution in https://github.com/nolabs-ai/nono/pull/1876\r\n* @tim-nordell-nimbelink made their first contribution in https://github.com/nolabs-ai/nono/pull/1873\r\n* @Ekleog made their first contribution in https://github.com/nolabs-ai/nono/pull/1650\r\n\r\n**Full Changelog**: https://github.com/nolabs-ai/nono/compare/v0.76.0...v0.78.0","mentions_count":11}
