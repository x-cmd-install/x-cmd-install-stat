-ai/nono/pull/2234\n* fix(cli): support kitty release and repeat events in detach matcher by @lukehinds in https://github.com/nolabs-ai/nono/pull/2239\n* docs(nep): propose nep-0009 for cli oauth login and device enrollment by @lukehinds in https://github.com/nolabs-ai/nono/pull/2245\n* feat(cli): support approval elevation for AF_UNIX pathname sockets by @lukehinds in https://github.com/nolabs-ai/nono/pull/2238\n* docs(neps): update implementation status and pre-1.0 compatibility guidance by @SequeI in https://github.com/nolabs-ai/nono/pull/2249\n* chore(deps): bump the routine-rust group with 6 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2251\n* feat(approval): unix-socket webhook transport and network approvals in `nono proxy` by @panga in https://github.com/nolabs-ai/nono/pull/2240\n* fix(proxy): fail upstream connections that go silent by @jeremy in https://github.com/nolabs-ai/nono/pull/2237\n* fix(policy): keep exact-file directory bypasses literal by @SebTardif in https://github.com/nolabs-ai/nono/pull/2142\n* feat(cli): add nono login and logout commands by @lukehinds in https://github.com/nolabs-ai/nono/pull/2250\n* fix(proxy): strip hop headers when the colon is spaced by @SebTardif in https://github.com/nolabs-ai/nono/pull/2254\n* refactor(cli): simplify remote session display and selector layout by @lukehinds in https://github.com/nolabs-ai/nono/pull/2260\n* fix(proxy): enforce endpoint rules for forward HTTP requests by @LuckVd in https://github.com/nolabs-ai/nono/pull/2184\n* docs(neps): add nep 0010 for session terminal capture by @lukehinds in https://github.com/nolabs-ai/nono/pull/2259\n* docs(schema): add command sandbox exec_paths and open_port fields by @daescha in https://github.com/nolabs-ai/nono/pull/2276\n* feat(proxy): network approval for plain-HTTP forward requests by @panga in https://github.com/nolabs-ai/nono/pull/2265\n* docs(undo): fix snapshot comments that describe a fast check and zeroed hash by @no-hup in https://github.com/nolabs-ai/nono/pull/2264\n* fix(docker): create home directory for nono user by @SequeI in https://github.com/nolabs-ai/nono/pull/2278\n* fix(sandbox): scope macOS process-exec to the read set by @panga in https://github.com/nolabs-ai/nono/pull/2282\n* feat(proxy): select aws_auth signing profile by placeholder access key ID by @nmgrenyi in https://github.com/nolabs-ai/nono/pull/2277\n* chore(deps): bump the routine-actions group with 5 updates by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2288\n* chore(deps): bump ureq from 3.5.0 to 3.5.1 in the routine-rust group by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2289\n* feat(proxy): derive aws_auth signing region from request host for wildcard upstreams by @panga in https://github.com/nolabs-ai/nono/pull/2280\n* fix(proxy): skip synthetic _EP_ env vars for endpoint-filtered routes (#2286) by @bharathvemula in https://github.com/nolabs-ai/nono/pull/2287\n* feat(proxy): match AWS operations in endpoint_policy on aws_auth routes by @panga in https://github.com/nolabs-ai/nono/pull/2279\n* feat(proxy): add phantom_format to custom credentials by @panga in https://github.com/nolabs-ai/nono/pull/2281\n* fix(deps): upgrade aws-config and remove crypto-bigint audit exception by @SequeI in https://github.com/nolabs-ai/nono/pull/2294\n* feat(cli): add session terminal recording (NEP-0010) by @lukehinds in https://github.com/nolabs-ai/nono/pull/2293\n* feat(proxy): approvals for allow_domain endpoints by @panga in https://github.com/nolabs-ai/nono/pull/2266\n* fix(proxy): normalize trailing slash in endpoint rule paths by @rnestler in https://github.com/nolabs-ai/nono/pull/2295\n* fix(proxy): distinguish credential capture failures in HTTP responses by @wincent in https://github.com/nolabs-ai/nono/pull/2191\n* feat(cli)!: unify platform commands and automatic enrollment by @SequeI in https://github.com/nolabs-ai/nono/pull/2297\n* feat(proxy): accept AWS GovCloud regions and s3 bucket-subdomain wildcards by @panga in https://github.com/nolabs-ai/nono/pull/2302\n* fix(cli): allow mise to read ~/.tool-versions by @rnestler in https://github.com/nolabs-ai/nono/pull/2307\n* chore: release v0.82.0 by @SequeI in https://github.com/nolabs-ai/nono/pull/2311\n\n## New Contributors\n* @daescha made their first contribution in https://github.com/nolabs-ai/nono/pull/2276\n* @no-hup made their first contribution in https://github.com/nolabs-ai/nono/pull/2264\n* @wincent made their first contribution in https://github.com/nolabs-ai/nono/pull/2191\n\n**Full Changelog**: https://github.com/nolabs-ai/nono/compare/v0.81.0...v0.82.0","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":13}
