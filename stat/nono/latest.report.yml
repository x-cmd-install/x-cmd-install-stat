olabs-ai/nono/pull/2042\n* fix(macos): allow bypassed sockets under denied directories by @SequeI in https://github.com/nolabs-ai/nono/pull/2041\n* docs(neps): add nep-0005 for windows enforcement backend by @lukehinds in https://github.com/nolabs-ai/nono/pull/2032\n* fix(supervisor): separate network denial throttling from policy enforcement by @lukehinds in https://github.com/nolabs-ai/nono/pull/2047\n* feat(tool-sandbox): per-command aws_auth + fix scoped-proxy CA env ordering by @nmgrenyi in https://github.com/nolabs-ai/nono/pull/2024\n* docs(neps): add NEP-0002 for invocation-scoped commands by @lukehinds in https://github.com/nolabs-ai/nono/pull/1971\n* chore(deps): bump clap_complete from 4.6.9 to 4.6.11 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2057\n* chore(deps): bump der from 0.8.1 to 0.8.2 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2056\n* chore(deps): bump thiserror from 2.0.20 to 2.0.21 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2058\n* chore(deps): bump jsonc-parser from 0.33.1 to 0.34.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2059\n* feat(cli): add command-level keychain_access grant for macOS by @lukehinds in https://github.com/nolabs-ai/nono/pull/2093\n* fix(cli): keep Claude Code on its default Keychain service (#1950) by @ranguard in https://github.com/nolabs-ai/nono/pull/2085\n* fix(proxy): add serverAuth EKU to minted TLS intercept leaf certificates by @polarctos in https://github.com/nolabs-ai/nono/pull/2068\n* chore(deps): bump sigstore-sign from 0.11.0 to 0.14.0 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2060\n* chore(deps): bump actions/upload-artifact from 7.0.1 to 7.0.2 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2102\n* chore(deps): bump actions/download-artifact from 8.0.1 to 8.0.2 by @dependabot[bot] in https://github.com/nolabs-ai/nono/pull/2101\n* chore(deps): bump zeroize from 1.9.0 to 1.9.1 by @dependabot[bot] in htt