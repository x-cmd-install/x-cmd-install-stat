{"id":436706274,"author":{"login":"bot-gradle","id":62695641,"node_id":"MDQ6VXNlcjYyNjk1NjQx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAASc8s4aB5vi","tag_name":"v9.9.0","target_commitish":"dabfe84a6c2590fa6ecaab03ff6fefe5b838d558","name":"9.9.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-06T12:54:38Z","updated_at":"2026-11-06T17:17:32Z","published_at":"2026-11-06T17:17:32Z","assets":[],"body":"The Gradle team is excited to announce Gradle 9.9.0.\r\n\r\nHere are the highlights of this release:\r\n\r\n - Performance improvements for Kotlin DSL compilation\r\n - Test filtering for non-method JUnit Platform tests\r\n - Wrapper settings preserved on upgrade\r\n - Predefined groups in the Problems API\r\n\r\n[Read the Release Notes](https://docs.gradle.org/9.9.0/release-notes.html)\r\n\r\nWe would like to thank the following community members for their contributions to this release of Gradle:\r\n[Aurimas](https://github.com/liutikas),\r\n[devareddy05](https://github.com/devareddy05),\r\n[DragonFSKY](https://github.com/DragonFSKY),\r\n[fru1tworld](https://github.com/fru1tworld),\r\n[Ivan Khanas](https://github.com/ikxeno),\r\n[Jeremy Schoemaker](https://github.com/shoemoney),\r\n[John Burns](https://github.com/wakingrufus),\r\n[Labh R Jethe](https://github.com/itsCodeTide),\r\n[Marcin Mycek](https://github.com/Herudaio),\r\n[monkey](https://github.com/Develop-KIM),\r\n[Nelson Osacky](https://github.com/runningcode),\r\n[Roberto Perez Alcolea](https://github.com/rpalcolea),\r\n[Róbert Papp](https://github.com/TWiStErRob),\r\n[SeungTaek Lim](https://github.com/namest504),\r\n[Stefan Oehme](https://github.com/oehme),\r\n[万彬宇](https://github.com/Wanbinyu),\r\n[한의준](https://github.com/exijn).\r\n\r\n## Upgrade instructions\r\nSwitch your build to use Gradle 9.9.0 by updating your wrapper:\r\n```\r\n./gradlew :wrapper --gradle-version=9.9.0 && ./gradlew :wrapper\r\n```\r\nSee the Gradle [9.x upgrade guide](https://docs.gradle.org/9.9.0/userguide/upgrading_version_9.html) to learn about deprecations, breaking changes and other considerations when upgrading.\r\n\r\nFor Java, Groovy, Kotlin and Android compatibility, see the [full compatibility notes](https://docs.gradle.org/9.9.0/userguide/compatibility.html).\r\n\r\n## Reporting problems\r\n\r\nIf you find a problem with this release, please file a bug on [GitHub Issues](https://github.com/gradle/gradle/issues) adhering to our issue guidelines.\r\nIf you're not sure you're encountering a bug, please use the [forum](https://discuss.gradle.org/c/help-discuss).\r\n\r\nWe hope you will build happiness with Gradle, and we look forward to your feedback via [Twitter](https://twitter.com/gradle) or on [GitHub](https://github.com/gradle).\r\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
