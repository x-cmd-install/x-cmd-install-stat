{"id":426619501,"author":{"login":"pgaskin","id":13909717,"node_id":"MDQ6VXNlcjEzOTA5NzE3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAHBiEM4ZbbJt","tag_name":"v2.13.0","target_commitish":"master","name":"cmus 2.13.0 «2k26»","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-28T11:43:11Z","updated_at":"2026-10-28T12:06:55Z","published_at":"2026-10-28T12:06:55Z","assets":[],"body":"I am happy to announce a new cmus release, two years after the last one, containing many bugfixes by the members of the community, most notably @ihy123, and a few new features.\r\n\r\n## What's Changed\r\n* Set the minimum requested AAudio buffer capacity by @pgaskin in https://github.com/cmus/cmus/pull/1386\r\n* Check for libavutil pkg-config by @pgaskin in https://github.com/cmus/cmus/pull/1388\r\n* [CI] Update dependency list to fix ubuntu build setup by @gavtroy in https://github.com/cmus/cmus/pull/1414\r\n* Add sort by duration by @hunkyburrito in https://github.com/cmus/cmus/pull/1440\r\n* Respect scroll_offset setting when resizing window by @gavtroy in https://github.com/cmus/cmus/pull/1413\r\n* Try to fallback to any plugin upon failure to init output plugin by @WalrusDevil in https://github.com/cmus/cmus/pull/1416\r\n* PulseAudio bugfixes and APPLICATION_ID @ihy123 in https://github.com/cmus/cmus/pull/1405\r\n* ip/ffmpeg fixes and ffmpeg 8.0 support by @ihy123 in https://github.com/cmus/cmus/pull/1444\r\n* CUE handling improvements and replaygain/genre support @ihy123 in https://github.com/cmus/cmus/pull/1406\r\n* Fix for missing Icecast streaming bitrate display. by @thecloudexpanse in https://github.com/cmus/cmus/pull/1451\r\n* op/mixer_alsa: alsamixer's volume scale; setting mixer control like aplay does it by @ihy123 in https://github.com/cmus/cmus/pull/1445\r\n* ip/ffmpeg: fix seeking and compiler warning about %lld by @ihy123 in https://github.com/cmus/cmus/pull/1454\r\n* Fix libmp4v2 check by @gavtroy in https://github.com/cmus/cmus/pull/1458\r\n* Make sure to not try freeing an uninitialized pointer by @xant in https://github.com/cmus/cmus/pull/1463\r\n* op/alsa: remove polling for events before pause (fixes #1461) by @ihy123 in https://github.com/cmus/cmus/pull/1462\r\n* A line of code To improve CommiT b4252db by @4rrimeki in https://github.com/cmus/cmus/pull/1467\r\n* Fix unterminated-string-initialization warnings by @chggr in https://github.com/cmus/cmus/pull/1472\r\n* Fix stringop-truncation warning by @chggr in https://github.com/cmus/cmus/pull/1473\r\n* Standardise in using xmalloc by @chggr in https://github.com/cmus/cmus/pull/1478\r\n* Fix memory leak in bass.c by @chggr in https://github.com/cmus/cmus/pull/1477\r\n* Fix compiler warning about uninitialized rb_parent_color by @chggr in https://github.com/cmus/cmus/pull/1484\r\n* op/aaudio: fix dsp.aaudio.sharing_mode getter by @pgaskin in https://github.com/cmus/cmus/pull/1508\r\n* Properly handle directory listing errors in browser by @pgaskin in https://github.com/cmus/cmus/pull/1509\r\n* Fix old colors being left behind when applying an incomplete theme by @pgaskin in https://github.com/cmus/cmus/pull/1510\r\n* Define _XOPEN_SOURCE so wcwidth can be found by @gavtroy in https://github.com/cmus/cmus/pull/1498\r\n* Pass playback position to status_display_program by @leana8959 in https://github.com/cmus/cmus/pull/1502\r\n* Do not delete missing files from playlists. by @jchook in https://github.com/cmus/cmus/pull/1470\r\n* op/aaudio: fix remap buffer size by @pgaskin in https://github.com/cmus/cmus/pull/1511\r\n* ip/wavpack: don't leak fd on failure by @pgaskin in https://github.com/cmus/cmus/pull/1517\r\n* Fix buffer overflow caused by invalid UTF-8 by @pgaskin in https://github.com/cmus/cmus/pull/1520\r\n* ip/opus: fix opusfile callbacks and fdsan abort on invalid files by @pgaskin in https://github.com/cmus/cmus/pull/1518\r\n* mpris: set xesam:url by @pgaskin in https://github.com/cmus/cmus/pull/1521\r\n* Make :clear -p work properly for playlists by @pgaskin in https://github.com/cmus/cmus/pull/1523\r\n* Add auto_mark_selected_playlist option by @pgaskin in https://github.com/cmus/cmus/pull/1524\r\n* mpris: report the correct position in Seeked by @pgaskin in https://github.com/cmus/cmus/pull/1522\r\n* Silence clang warnings by @gavtroy in https://github.com/cmus/cmus/pull/1533\r\n\r\n## New Contributors\r\n* @hunkyburrito made their first contribution in https://github.com/cmus/cmus/pull/1440\r\n* @WalrusDevil made their first contribution in https://github.com/cmus/cmus/pull/1416\r\n* @ihy123 made their first contribution in https://github.com/cmus/cmus/pull/1405\r\n* @thecloudexpanse made their first contribution in https://github.com/cmus/cmus/pull/1451\r\n* @xant made their first contribution in https://github.com/cmus/cmus/pull/1463\r\n* @4rrimeki made their first contribution in https://github.com/cmus/cmus/pull/1467\r\n* @chggr made their first contribution in https://github.com/cmus/cmus/pull/1472\r\n* @leana8959 made their first contribution in https://github.com/cmus/cmus/pull/1502\r\n* @jchook made their first contribution in https://github.com/cmus/cmus/pull/1470\r\n\r\n**Full Changelog**: https://github.com/cmus/cmus/compare/v2.12.0...v2.13.0","reactions":{"total_count":6,"+1":0,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":11}
