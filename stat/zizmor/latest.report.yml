609255,"node_id":"RA_kwDOMlil3c4mTXBn","name":"zizmor-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8386169,"digest":"sha256:746d82a338981515ffedd049e249349b6d1456f92afcf6cfdd1ea6f958ef9c59","download_count":47,"created_at":"2026-10-15T04:03:46Z","updated_at":"2026-10-15T04:03:46Z"},{"id":642609258,"node_id":"RA_kwDOMlil3c4mTXBq","name":"zizmor-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":9286395,"digest":"sha256:95776c59c2d4c0d6e10560647b4830762b8dbcca8d7d9b7469ff227c73a6fee6","download_count":226,"created_at":"2026-10-15T04:03:46Z","updated_at":"2026-10-15T04:03:46Z"}],"body":"[Sponsorship is appreciated!](https://github.com/sponsors/woodruffw/)\r\n\r\n## Enhancements \ud83c\udf31[\ud83d\udd17](https://docs.zizmor.sh/release-notes/#enhancements)\r\n\r\n- The [typosquat-uses](https://docs.zizmor.sh/audits/#typosquat-uses) audit now supports pre-commit config inputs ([#2437](https://github.com/zizmorcore/zizmor/issues/2437))\r\n\r\n- The [self-hosted-runner](https://docs.zizmor.sh/audits/#self-hosted-runner) audit is now significantly more precise ([#2350](https://github.com/zizmorcore/zizmor/issues/2350))\r\n\r\n    Many thanks to [@ubiratansoares](https://github.com/ubiratansoares) for proposing and implementing this enhancement!\r\n\r\n- The [dangerous-triggers](https://docs.zizmor.sh/audits/#dangerous-triggers) audit now considers the issue_comment trigger fundamentally dangerous ([#2396](https://github.com/zizmorcore/zizmor/issues/2396))\r\n\r\n- zizmor is now aware of the image_version workflow trigger ([#2397](https://github.com/zizmorcore/zizmor/issues/2397))\r\n\r\n- The [dangerous-triggers](https://docs.zizmor.sh/audits/#dangerous-triggers) audit now produces more precise finding/diagnostic spans ([#2402](https://github.com/zizmorcore/zizmor/issues/2402))\r\n\r\n- The [cache-poisoning](https://docs.zizmor.sh/audits/#cache-poisoning) audit is now aware of [pnpm/setup](https://github.com/pnpm/setup) ([#2409](https://github.com/zizmorcore/zizmor/issues/2409))\r\n\r\n- The [unpinned-images](https://docs.zizmor.sh/audits/#unpinned-images) audit now produces more precise findings when the user's workflow contains an indirect matrix ([#2395](https://github.com/zizmorcore/zizmor/issues/2395))\r\n\r\n    Many thanks to [@ubiratansoares](https://github.com/ubiratansoares) for proposing and implementing this enhancement!\r\n\r\n- The [cache-poisoning](https://docs.zizmor.sh/audits/#cache-poisoning) audit is now aware of GitHub's new cache-mode: setting, and will skip any findings that would occur when a job has an effective cache-mode: none ([#2418](https://github.com/zizmorcore/zizmor/issues/2418))\r\n\r\n- The [cache-poisoning](https://docs.zizmor.sh/audits/#cache-poisoning) audit now flags usages of cache-mode: write and cache-mode: write-only with dangerous triggers, i.e. triggers that give an attacker privileged code execution ([#2426](https://github.com/zizmorcore/zizmor/issues/2426))\r\n\r\n- zizmor now uses a tree-sitter grammar for PowerShell that's more precise/capable of capturing more non-trivial PowerShell expressions ([#2444](https://github.com/zizmorcore/zizmor/issues/2444))\r\n\r\n## Bug Fixes \ud83d\udc1b[\ud83d\udd17](https://docs.zizmor.sh/release-notes/#bug-fixes)\r\n\r\n- Fixed a class of false positives/imprecisions in [adhoc-packages](https://docs.zizmor.sh/audits/#adhoc-packages) that caused some pnpm and yarn invocations to be misclassified as package installations ([#2386](https://github.com/zizmorcore/zizmor/issues/2386))\r\n\r\n    Many thanks to [@marcalexiei](https://github.com/marcalexiei) for implementing this improvement!\r\n\r\n- Fixed a bug where zizmor would fail to honor Git submodules and worktrees when discovering configuration files relative to a repo root ([#2390](https://github.com/zizmorcore/zizmor/issues/2390))\r\n\r\n- Fixed a bug where the [ref-version-mismatch](https://docs.zizmor.sh/audits/#ref-version-mismatch) audit would crash on unusually placed version comments ([#2394](https://github.com/zizmorcore/zizmor/issues/2394))\r\n\r\n- Fixed a bug where zizmor would fail to handle some pre-commit inputs that use prek extensions to the language_version and default_language_version keys ([#2413](https://github.com/zizmorcore/zizmor/issues/2413))\r\n\r\n- Fixed a bug where the [use-trusted-publishing](https://docs.zizmor.sh/audits/#use-trusted-publishing) audit would fail to detect certain true-positive patterns inside of PowerShell blocks ([#2444](https://github.com/zizmorcore/zizmor/issues/2444))"}
