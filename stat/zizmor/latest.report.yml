":537081735,"node_id":"RA_kwDOMlil3c4gAzeH","name":"zizmor-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8244779,"digest":"sha256:a2fcf298b84d3d8498a3d718bb63f0abe26823bf68a11f0f439620f8f2f878f0","download_count":1450,"created_at":"2026-08-30T21:25:48Z","updated_at":"2026-08-30T21:25:49Z"},{"id":537081732,"node_id":"RA_kwDOMlil3c4gAzeE","name":"zizmor-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":9146039,"digest":"sha256:ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed","download_count":35899,"created_at":"2026-08-30T21:25:48Z","updated_at":"2026-08-30T21:25:49Z"}],"body":"[Sponsorship is appreciated!](https://github.com/sponsors/woodruffw/)\r\n\r\n## New Features \ud83c\udf08[\ud83d\udd17](https://docs.zizmor.sh/release-notes/#new-features)\r\n\r\n- New audit: [self-repository](https://docs.zizmor.sh/audits/#self-repository) detects usages of the old \"workspace-relative\" form for local reusable workflows and actions and recommends the new \"self-repository\" form instead ([#2271](https://github.com/zizmorcore/zizmor/issues/2271))\r\nEnhancements \ud83c\udf31[\ud83d\udd17](https://docs.zizmor.sh/release-notes/#enhancements)\r\n\r\n- The [impostor-commit](https://docs.zizmor.sh/audits/#impostor-commit) audit now supports pre-commit config inputs ([#2256](https://github.com/zizmorcore/zizmor/issues/2256))\r\n\r\n- The [forbidden-uses](https://docs.zizmor.sh/audits/#forbidden-uses) audit now supports pre-commit config inputs ([#2263](https://github.com/zizmorcore/zizmor/issues/2263))\r\n\r\n- The [adhoc-packages](https://docs.zizmor.sh/audits/#adhoc-packages) audit now detects more ad-hoc package management patterns, including bundle add and yarn add\r\n\r\n    Many thanks to [@connorshea](https://github.com/connorshea) for proposing and implementing this enhancement!\r\n\r\n- The [archived-uses](https://docs.zizmor.sh/audits/#archived-uses) audit now supports pre-commit config inputs ([#2272](https://github.com/zizmorcore/zizmor/issues/2272))\r\n\r\n- The [ref-confusion](https://docs.zizmor.sh/audits/#ref-confusion) audit now supports pre-commit config inputs ([#2274](https://github.com/zizmorcore/zizmor/issues/2274))\r\n\r\n- The [cache-poisoning](https://docs.zizmor.sh/audits/#cache-poisoning) audit now produces more detailed and more precise diagnostics ([#2330](https://github.com/zizmorcore/zizmor/issues/2330))\r\n\r\n- The [cache-poisoning](https://docs.zizmor.sh/audits/#cache-poisoning) audit now handles and exposes auto-fixes in a more general manner ([#2332](https://github.com/zizmorcore/zizmor/issues/2332))\r\n\r\n- zizmor now recognizes [sethvargo/ratchet](https://github.com/sethvargo/ratchet) version comments when evaluating ref pinning ([#2319](https://github.com/zizmorcore/zizmor/issues/2319))\r\n\r\n    Many thanks to [@njgudman](https://github.com/njgudman) for proposing and implementing this enhancement!\r\n\r\n- The [unpinned-tools](https://docs.zizmor.sh/audits/#unpinned-tools) audit now produces more detailed and more precise diagnostics ([#2339](https://github.com/zizmorcore/zizmor/issues/2339))\r\n\r\n- The [unpinned-tools](https://docs.zizmor.sh/audits/#unpinned-tools) audit now detects usages of [extractions/setup-just](https://github.com/extractions/setup-just) ([#2339](https://github.com/zizmorcore/zizmor/issues/2339))\r\n\r\n- The [unpinned-tools](https://docs.zizmor.sh/audits/#unpinned-tools) audit now detects usages of [extractions/setup-crate](https://github.com/extractions/setup-crate) ([#2340](https://github.com/zizmorcore/zizmor/issues/2340))\r\n\r\n- The [archived-uses](https://docs.zizmor.sh/audits/#archived-uses) audit now detects several more archived repositories ([#2340](https://github.com/zizmorcore/zizmor/issues/2340))\r\n\r\n- The [ref-version-mismatch](https://docs.zizmor.sh/audits/#ref-version-mismatch) audit now supports uses: that reference reusable workflows ([#2344](https://github.com/zizmorcore/zizmor/issues/2344))\r\n\r\n- The [stale-action-refs](https://docs.zizmor.sh/audits/#stale-action-refs) audit now supports uses: that reference reusable workflows ([#2345](https://github.com/zizmorcore/zizmor/issues/2345))\r\n\r\n## Bug Fixes \ud83d\udc1b[\ud83d\udd17](https://docs.zizmor.sh/release-notes/#bug-fixes)\r\n\r\n- Fixed a bug where zizmor would reject a .pre-commit-config.yml input containing a prek-specific builtin section ([#2259](https://github.com/zizmorcore/zizmor/issues/2259))\r\n\r\n- Fixed a bug where the [unpinned-uses](https://docs.zizmor.sh/audits/#unpinned-uses) audit would fail to honor ignore comments within the same step scope ([#2289](https://github.com/zizmorcore/zizmor/issues/2289))\r\n\r\n- Fixed a bug where zizmor would reject a dependabot.yml containing a goproxy-server registry definition ([#2300](https://github.com/zizmorcore/zizmor/issues/2300))\r\n\r\n- Fixed a bug where zizmor would reject pre-commit configurations containing prek-specific glob patterns in files or exclude ([#2308](https://github.com/zizmorcore/zizmor/issues/2308))\r\n\r\n- Fixed a handful of unsound patch bugs when performing YAML add and/or replace operations ([#2295](https://github.com/zizmorcore/zizmor/issues/2295))\r\n\r\n    Many thanks to [@dmbuil](https://github.com/dmbuil) for proposing and implementing this improvement!\r\n\r\n- Fixed a bug where the [cache-poisoning](https://docs.zizmor.sh/audits/#cache-poisoning) audit would incorrectly flag newer [astral-sh/setup-uv](https://github.com/astral-sh/setup-uv) versions that disable caching behavior automatically ([#2330](https://github.com/zizmorcore/zizmor/issues/2330))\r\n\r\n- Fixed a bug where the [ref-version-mismatch](https://docs.zizmor.sh/audits/#ref-version-mismatch) audit would produce a misleading diagnostic when an action has overlapping branch and tag names ([#2337](https://github.com/zizmorcore/zizmor/issues/2337))\r\n\r\n- Fixed a bug where the [artipacked](https://docs.zizmor.sh/audits/#artipacked) audit would incorrectly flag the with: clauses of unrelated actions ([#2339](https://github.com/zizmorcore/zizmor/issues/2339))\r\n\r\n- Fixed a class of bugs where zizmor would incorrectly match an action's commit to a sibling action's tag ([#2247](https://github.com/zizmorcore/zizmor/issues/2247))\r\n\r\n    Many thanks to [@potiuk](https://github.com/potiuk) for proposing and implementing this improvement!\r\n\r\n- Fixed a bug where zizmor would crash on deeply nested GitHub Actions expressions ([#2349](https://github.com/zizmorcore/zizmor/issues/2349))","reactions":{"total_count":12,"+1":0,"-1":0,"laugh":0,"hooray":12,"confused":0,"heart":0,"rocket":0,"eyes":0}}
