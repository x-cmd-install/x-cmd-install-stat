{"id":399321461,"author":{"login":"anthrotype","id":6939968,"node_id":"MDQ6VXNlcjY5Mzk5Njg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOALGbVc4XzSl1","tag_name":"4.66.1","target_commitish":"main","name":"4.66.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-29T15:41:17Z","updated_at":"2026-09-29T16:16:11Z","published_at":"2026-09-29T16:16:11Z","assets":[],"body":"- [designspaceLib] When splitting a DesignSpace v5 document with `makeNames=True` (as `varLib.build_many` does), family and style names set explicitly on an instance now take precedence over the ones computed from the STAT labels, in all languages, and a PostScript name is no longer made up from the labels for an instance that has its own style name (#3131, #4206, #4208).\n- [cmap] Decompiling a format 4 subtable whose `idRangeOffset` points outside `glyphIndexArray` now raises `TTLibError`. A negative index used to silently map the code point to the wrong glyph, and one past the end raised a bare `AssertionError` (#4209).\n- [cmap] Fix compiling a format 2 subtable when the lowest glyph ID in a lead-byte row is 32768 or higher, which failed with `struct.error` (#4210).\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
