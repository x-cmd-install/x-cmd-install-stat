down/pull/2594\r\n* Test MCP input errors with real conversions by @afourney in https://github.com/microsoft/markitdown/pull/2597\r\n* Restore JSON regression coverage for late non-ASCII text by @afourney in https://github.com/microsoft/markitdown/pull/2601\r\n* Bump the magika dependency by @afourney in https://github.com/microsoft/markitdown/pull/2722\r\n* Bump Mammoth dependency to >=1.12.2,<2 by @afourney in https://github.com/microsoft/markitdown/pull/2729\r\n* Require certifi>=2026.10.19 for updated CA trust by @afourney in https://github.com/microsoft/markitdown/pull/2730\r\n* Update Black, Pillow, and Windows ARM Cryptography baselines by @afourney in https://github.com/microsoft/markitdown/pull/2731\r\n\r\n## New Contributors\r\n* @YasirAlibrahem made their first contribution in https://github.com/microsoft/markitdown/pull/1511\r\n* @GopalGB made their first contribution in https://github.com/microsoft/markitdown/pull/1850\r\n* @octo-patch made their first contribution in https://github.com/microsoft/markitdown/pull/1656\r\n* @hchmch made their first contribution in https://github.com/microsoft/markitdown/pull/1295\r\n* @Amitanand983 made their first contribution in https://github.com/microsoft/markitdown/pull/1919\r\n\r\n**Full Changelog**: https://github.com/microsoft/markitdown/compare/v0.1.8...v0.1.9","reactions":{"total_count":43,"+1":24,"-1":0,"laugh":0,"hooray":6,"confused":0,"heart":5,"rocket":5,"eyes":3},"mentions_count":7}
