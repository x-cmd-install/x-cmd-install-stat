","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12006733,"digest":"sha256:e14d172823702653c74b3557a5d861a92351bd7108e9d3c5516aca7aac2c7810","download_count":9,"created_at":"2026-09-11T11:55:58Z","updated_at":"2026-09-11T11:56:00Z"},{"id":557163504,"node_id":"RA_kwDOBgTesc4hNaPw","name":"quick-start-telemetry.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12010873,"digest":"sha256:14ae5a4da2f656e11e4eca7d1d4bf202402c8c58791a6fa9d81a126c40dd1c07","download_count":9,"created_at":"2026-09-11T11:55:58Z","updated_at":"2026-09-11T11:56:00Z"},{"id":557163512,"node_id":"RA_kwDOBgTesc4hNaP4","name":"sbom.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":283846,"digest":"sha256:b9f8fc0d635d81d254059d998d70d8ee9bcc92ad9be217c33c5c606402e82fa7","download_count":0,"created_at":"2026-09-11T11:55:58Z","updated_at":"2026-09-11T11:55:58Z"}],"body":"# Quick Start\n\n## What's New?\n\nFind out on [our blog](https://blog.argoproj.io) and [changelog](https://github.com/argoproj/argo-workflows/blob/main/CHANGELOG.md).\n\n## Breaking Changes and Known Issues\n\nCheck the [upgrading guide](https://argo-workflows.readthedocs.io/en/latest/upgrading/) and search for [existing issues on GitHub](https://github.com/argoproj/argo-workflows/issues).\n\n## Installation\n\n### CLI\n\n#### Mac / Linux\n\nAvailable via `curl`\n\n```bash\n# Detect OS\nARGO_OS=\"darwin\"\nif [[ \"$(uname -s)\" != \"Darwin\" ]]; then\n  ARGO_OS=\"linux\"\nfi\n\n# Download the binary\ncurl -sLO \"https://github.com/argoproj/argo-workflows/releases/download/v4.1.3/argo-$ARGO_OS-amd64.gz\"\n\n# Unzip\ngunzip \"argo-$ARGO_OS-amd64.gz\"\n\n# Make binary executable\nchmod +x \"argo-$ARGO_OS-amd64\"\n\n# Move binary to path\nmv \"./argo-$ARGO_OS-amd64\" /usr/local/bin/argo\n\n# Test installation\nargo version\n```\n\n### Controller and Server\n\n```bash\nkubectl create namespace argo\nkubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/download/v4.1.3/install.yaml\n```\n"}
