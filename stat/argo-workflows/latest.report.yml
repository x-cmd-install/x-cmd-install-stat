l","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12006735,"digest":"sha256:0c4c03f2c23aab17e565742104d727be3333a911055f670fd2f0a9d0f821ae26","download_count":10,"created_at":"2026-10-09T15:08:45Z","updated_at":"2026-10-09T15:08:47Z"},{"id":625312712,"node_id":"RA_kwDOBgTesc4lRYPI","name":"quick-start-telemetry.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12010875,"digest":"sha256:de1ebaa33b69aeb2e7d6b3dd1aca2e453c7d8185e2bac7acfa120829540d3edb","download_count":10,"created_at":"2026-10-09T15:08:45Z","updated_at":"2026-10-09T15:08:47Z"},{"id":625312724,"node_id":"RA_kwDOBgTesc4lRYPU","name":"sbom.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":283735,"digest":"sha256:4fe63f6bf7956bdafe3dd89e63653561d69e39d074fdd52eee6bf2cb0b138a68","download_count":1,"created_at":"2026-10-09T15:08:45Z","updated_at":"2026-10-09T15:08:46Z"}],"body":"# Quick Start\n\n## What's New?\n\nFind out on [our blog](https://blog.argoproj.io) and [changelog](https://github.com/argoproj/argo-workflows/blob/main/CHANGELOG.md).\n\n## Breaking Changes and Known Issues\n\nCheck the [upgrading guide](https://argo-workflows.readthedocs.io/en/latest/upgrading/) and search for [existing issues on GitHub](https://github.com/argoproj/argo-workflows/issues).\n\n## Installation\n\n### CLI\n\n#### Mac / Linux\n\nAvailable via `curl`\n\n```bash\n# Detect OS\nARGO_OS=\"darwin\"\nif [[ \"$(uname -s)\" != \"Darwin\" ]]; then\n  ARGO_OS=\"linux\"\nfi\n\n# Download the binary\ncurl -sLO \"https://github.com/argoproj/argo-workflows/releases/download/v4.1.5/argo-$ARGO_OS-amd64.gz\"\n\n# Unzip\ngunzip \"argo-$ARGO_OS-amd64.gz\"\n\n# Make binary executable\nchmod +x \"argo-$ARGO_OS-amd64\"\n\n# Move binary to path\nmv \"./argo-$ARGO_OS-amd64\" /usr/local/bin/argo\n\n# Test installation\nargo version\n```\n\n### Controller and Server\n\n```bash\nkubectl create namespace argo\nkubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/download/v4.1.5/install.yaml\n```\n"}
