rt-postgres.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12006733,"digest":"sha256:6f36a389a3e1df8d64adc3a0ff0eaf019d680e69c97553c00bf313ab46a09334","download_count":33,"created_at":"2026-08-21T11:40:44Z","updated_at":"2026-08-21T11:40:45Z"},{"id":523665290,"node_id":"RA_kwDOBgTesc4fNn-K","name":"quick-start-telemetry.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12010873,"digest":"sha256:f2283688f392d5635d09a8ce8b7bf5a032320ef2d4768873421f9d7681035bb1","download_count":17,"created_at":"2026-08-21T11:40:44Z","updated_at":"2026-08-21T11:40:45Z"},{"id":523665301,"node_id":"RA_kwDOBgTesc4fNn-V","name":"sbom.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":283837,"digest":"sha256:61a9ba91d1eedd5abcd49df5c56a6fb79df79f2d640e1b169dffa54b6bf19c6d","download_count":7,"created_at":"2026-08-21T11:40:44Z","updated_at":"2026-08-21T11:40:44Z"}],"body":"# Quick Start\n\n## What's New?\n\nFind out on [our blog](https://blog.argoproj.io) and [changelog](https://github.com/argoproj/argo-workflows/blob/main/CHANGELOG.md).\n\n## Breaking Changes and Known Issues\n\nCheck the [upgrading guide](https://argo-workflows.readthedocs.io/en/latest/upgrading/) and search for [existing issues on GitHub](https://github.com/argoproj/argo-workflows/issues).\n\n## Installation\n\n### CLI\n\n#### Mac / Linux\n\nAvailable via `curl`\n\n```bash\n# Detect OS\nARGO_OS=\"darwin\"\nif [[ \"$(uname -s)\" != \"Darwin\" ]]; then\n  ARGO_OS=\"linux\"\nfi\n\n# Download the binary\ncurl -sLO \"https://github.com/argoproj/argo-workflows/releases/download/v4.1.2/argo-$ARGO_OS-amd64.gz\"\n\n# Unzip\ngunzip \"argo-$ARGO_OS-amd64.gz\"\n\n# Make binary executable\nchmod +x \"argo-$ARGO_OS-amd64\"\n\n# Move binary to path\nmv \"./argo-$ARGO_OS-amd64\" /usr/local/bin/argo\n\n# Test installation\nargo version\n```\n\n### Controller and Server\n\n```bash\nkubectl create namespace argo\nkubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/download/v4.1.2/install.yaml\n```\n"}
