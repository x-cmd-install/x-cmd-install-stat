ml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12006735,"digest":"sha256:62c67e735ec94240d0aa4f3a4495eb747fdcec1514509632f3df5f557ca3e968","download_count":14,"created_at":"2026-11-25T16:48:33Z","updated_at":"2026-11-25T16:48:34Z"},{"id":792327639,"node_id":"RA_kwDOBgTesc4vOfXX","name":"quick-start-telemetry.yaml","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/yaml","state":"uploaded","size":12010875,"digest":"sha256:6ab2513e206dde5b682d07b12992ee43e0309184c04c6a96f2427eec5cda7675","download_count":14,"created_at":"2026-11-25T16:48:33Z","updated_at":"2026-11-25T16:48:34Z"},{"id":792327607,"node_id":"RA_kwDOBgTesc4vOfW3","name":"sbom.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":284751,"digest":"sha256:14e0d39ce7cfb6380ef6faf3cb20e7ccadd5db7f6d04aa072a517ae2f267a12a","download_count":4,"created_at":"2026-11-25T16:48:32Z","updated_at":"2026-11-25T16:48:33Z"}],"body":"# Quick Start\n\n## What's New?\n\nFind out on [our blog](https://blog.argoproj.io) and [changelog](https://github.com/argoproj/argo-workflows/blob/main/CHANGELOG.md).\n\n## Breaking Changes and Known Issues\n\nCheck the [upgrading guide](https://argo-workflows.readthedocs.io/en/latest/upgrading/) and search for [existing issues on GitHub](https://github.com/argoproj/argo-workflows/issues).\n\n## Installation\n\n### CLI\n\n#### Mac / Linux\n\nAvailable via `curl`\n\n```bash\n# Detect OS\nARGO_OS=\"darwin\"\nif [[ \"$(uname -s)\" != \"Darwin\" ]]; then\n  ARGO_OS=\"linux\"\nfi\n\n# Download the binary\ncurl -sLO \"https://github.com/argoproj/argo-workflows/releases/download/v4.1.7/argo-$ARGO_OS-amd64.gz\"\n\n# Unzip\ngunzip \"argo-$ARGO_OS-amd64.gz\"\n\n# Make binary executable\nchmod +x \"argo-$ARGO_OS-amd64\"\n\n# Move binary to path\nmv \"./argo-$ARGO_OS-amd64\" /usr/local/bin/argo\n\n# Test installation\nargo version\n```\n\n### Controller and Server\n\n```bash\nkubectl create namespace argo\nkubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/download/v4.1.7/install.yaml\n```\n"}
