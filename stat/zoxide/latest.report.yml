admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":423784,"digest":"sha256:ef7895cf10ba89f71953d058c386e5b313fa0f439dc351b331640129d7a81ae8","download_count":172,"created_at":"2026-07-04T12:34:57Z","updated_at":"2026-07-04T12:34:57Z"},{"id":466316386,"node_id":"RA_kwDODpzygM4by2xi","name":"zoxide_0.10.0-1_i386.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":495792,"digest":"sha256:e589703cd0cc9ae3ee7d9aa9c1bd08421af4509349d6fd898f671e62f50b0e42","download_count":173,"created_at":"2026-07-04T12:35:07Z","updated_at":"2026-07-04T12:35:08Z"},{"id":466316282,"node_id":"RA_kwDODpzygM4by2v6","name":"zoxide_0.10.0-1_riscv64.deb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":426360,"digest":"sha256:9e821e421da295579529395379f7f99c3494f0e6514c2ed940409184ac6f841a","download_count":175,"created_at":"2026-07-04T12:34:57Z","updated_at":"2026-07-04T12:34:57Z"}],"body":"### Added\r\n\r\n- `import` now supports fetching entries from `atuin`.\r\n- `import` now auto-detects database files.\r\n- `import` now skips directories matching `$_ZO_EXCLUDE_DIRS`.\r\n- POSIX: support for non-Cygwin Windows environments (e.g. Busybox).\r\n- Fish: Space-Tab completions now display and run the selected command.\r\n- Bash/POSIX/Zsh: `z` now honors `$CDPATH`.\r\n- Bash: don't add to the database when history is disabled (`set +o history`).\r\n- Nushell: export commands so the init script can be imported with `use`.\r\n- Support for RISC-V (riscv64) Linux.\r\n\r\n### Changed\r\n\r\n- `import` now takes a subcommand instead of the `--from` flag.\r\n- Nushell: upgrade minimum supported version to v0.106.0.\r\n\r\n### Fixed\r\n\r\n- Bash/POSIX/Zsh: `z` now handles relative paths through symlinked directories.\r\n- Bash/Fish/POSIX/Zsh: `_ZO_RESOLVE_SYMLINKS` now works on Windows.\r\n- Bash: handle `$PROMPT_COMMAND` values ending in a semicolon.\r\n- PowerShell: navigate to home directory with `z` on drives that don't define `HOME`.\r\n- PowerShell: use fully qualified names when invoking cmdlets.\r\n- Zsh: skip doctor diagnostics in non-interactive shells.\r\n- Zsh: avoid inserting a trailing space when cancelling interactive Space-Tab completions.\r\n- Bash: avoid blanking the prompt when cancelling interactive Space-Tab completions.\r\n- Bash/Fish/Zsh: avoid drawing a new line when Space-Tab completion finds no matches.\r\n- Tcsh: preserve any existing `precmd` alias instead of overwriting it.\r\n- Nushell: complete only directories for `z`, instead of all files.","reactions":{"total_count":49,"+1":19,"-1":0,"laugh":0,"hooray":11,"confused":0,"heart":7,"rocket":11,"eyes":1}}
