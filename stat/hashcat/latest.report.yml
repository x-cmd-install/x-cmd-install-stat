{"id":423634004,"author":{"login":"jsteube","id":10434361,"node_id":"MDQ6VXNlcjEwNDM0MzYx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAtNqCM4ZQCRU","tag_name":"v8.0.0","target_commitish":"master","name":"hashcat v8.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-25T17:34:45Z","updated_at":"2026-10-25T20:09:20Z","published_at":"2026-10-25T20:09:20Z","assets":[{"id":676005253,"node_id":"RA_kwDOAtNqCM4oSwWF","name":"hashcat-8.0.0.7z","label":"","uploader":{"login":"jsteube","id":10434361,"node_id":"MDQ6VXNlcjEwNDM0MzYx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-7z-compressed","state":"uploaded","size":20350217,"digest":"sha256:9fa86e1bfd5dd898d3c83aa38a67b08db1ba5d2f5252dffa2af44a8c62585f49","download_count":176,"created_at":"2026-10-25T20:09:18Z","updated_at":"2026-10-25T20:09:20Z"},{"id":676005254,"node_id":"RA_kwDOAtNqCM4oSwWG","name":"hashcat-8.0.0.7z.asc","label":"","uploader":{"login":"jsteube","id":10434361,"node_id":"MDQ6VXNlcjEwNDM0MzYx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":488,"digest":"sha256:26dea42d4c575ad5eafa3094108796cc369a663d325bf36fb7adaf5fef74a35d","download_count":11,"created_at":"2026-10-25T20:09:18Z","updated_at":"2026-10-25T20:09:19Z"}],"body":"---\n\nWelcome to **hashcat v8.0.0**!\n\nDownload binaries and source code from [hashcat](https://hashcat.net/hashcat/) or from [GitHub](https://github.com/hashcat/hashcat)\n\n---\n\nWe're proud to announce the release of hashcat v8.0.0. This is the largest update in the history of hashcat. No earlier release changed as many files, and no earlier release collected as many changelog entries.\n\nIf you have an hour, here's the writeup: [Full Release Notes and detailed writeup](https://github.com/hashcat/hashcat/blob/v8.0.0/docs/releases_notes_v8.0.0.pdf)\n\nIf you are upgrading an existing setup, please read section 5, \"Before You Upgrade\", first.\n\nHere's a quick summary:\n\n- 11 major features and four new attack-modes\n- 146 new hash-modes and 306 bug fixes\n- 4,091 files changed, with 439,469 lines added and 229,313 deleted\n- Contributions from 63 people, 43 of them first-time contributors\n\n---\n\n## Major New Features\n\n- **PCFG Attacks (-a 4)**: Probabilistic attacks that try the most likely passwords first, from a grammar trained on real passwords. Narrow them with a mask, or feed them hints about one person. Hashcat can seek anywhere in their keyspace, so they finally work in distributed setups.\n- **Hash Recipes (-m 4000)**: Describe a custom hash on the command line, such as --hash-recipe 'md5(md5(salt) . pass)', and crack it at GPU speed. No need to wait for someone to write a hash-mode for it.\n- **FPGA Support (-m 75000)**: For the first time, hashcat runs on FPGAs, starting with bcrypt on seven types of boards. These boards run right next to your GPUs.\n- **Table Attacks (-a 5)**: The table attack is back, under its original attack-mode number from hashcat-legacy.\n- **Wordlists in Masks (-a 12)**: Place a word anywhere in a mask with ?w, and a word from a second wordlist with ?q.\n- **Rules in Every Attack-Mode**: Rule files given with -r now work in combinator, brute-force, PCFG, table and hybrid attacks as well.\n- **Account-Aware Association (-a 9)**: Hashcat reads the words for each hash directly from the hash file, so you no longer have to build the wordlist yourself.\n- **Feed Plugins (-a 8)**: Candidate generators run as plugins, with full support for keyspace, work distribution, restore and status.\n- **Lookup (--lookup)**: Find out whether an attack reaches a given password, and at which point, without running the attack.\n\n---\n\n## Large-Scale and Distributed Work\n\n- Seekable wordlists: a seek database lets every device start near its range, including inside xz and zstd compressed wordlists\n- Many wordlists, one keyspace: --skip, --limit and --keyspace now work with wordlist directories, mask files and --increment\n- A new brain server database, and a way to fill the brain from an earlier attack\n- Large hash lists are loaded using every CPU core. A list of 5 million salted hashes now loads in 1.2 seconds instead of 7 seconds\n- Memory budgets per process for shared machines, with HASHCAT_DEVICE_MEM_LIMIT and HASHCAT_HOST_MEM_LIMIT\n\n---\n\n## New Algorithm Support\n\n- 146 new hash-modes, including yescrypt, Kerberos 5 etype 3, FreeBSD GELI, OpenBSD softraid, Google fscrypt, KDE KWallet, OpenSSH bcrypt-pbkdf, BIP39 passphrases, MSSQL (2025) and iClass\n- 91 of them are raw hash-modes for the new hash functions introduced through hash recipes, from 40084 to 40175\n- 26 new hash primitives\n- Eight new tools to extract hashes\n- The 74 hash-modes that run only as a stored recipe now have numbers from 40009 to 40082. The old numbers still work\n\n---\n\n## Performance Improvements\n\n- A new autotune that starts from what the device reports instead of trying every launch size. With a file of 200 masks, it takes 4 seconds instead of 243 seconds\n- Small wordlists with many rules now keep every device busy. On two RTX 4090 cards, a mode 12700 run with 50,000 words and 150,000 rules finishes in 17 seconds instead of 60 seconds\n- Optimizations to individual hash-modes, including:\n  - PKZIP: 13.8x (RTX 4090), 12.1x (Arc A770), 4.4x (RX 7900 XTX)\n  - Raw private keys: 32x to 58x (RTX 4090, RX 7900 XTX, Arc A770)\n  - Radmin3: 11x (RTX 4090), 8.2x (RX 7900 XTX)\n  - NetNTLMv1: 2.9x to 3.8x (Metal)\n  - LM: 8.7x (Arc A770)\n  - RACF KDFAES: 10.9x (Arc A770)\n- Less memory spent on buffers that were never used\n\n---\n\n## Backends and Platforms\n\n- **Metal 4 (Apple):** Used on Apple Silicon Macs with macOS 26, with cached pipelines. Builds on Apple Silicon are now native arm64 by default\n- **Mesa rusticl (AMD):** Hashcat now runs on AMD GPUs under the open source OpenCL driver provided by Mesa\n- **Shared core library:** Hashcat is now built as libhashcat, which the modules, bridges and feeds link to. This makes it much easier to package\n\n---\n\n## Before You Upgrade\n\n- --restore now prints the stored command instead of running it (CVE-2026-68766)\n- The brain protocol moved to version 2. Upgrade the clients and the server together\n- Custom plugins built for v7.1.2 need porting and a rebuild\n- -w is accepted but ignored. Every run uses the former workload profile 3\n- Mode 72000 is removed. Use mode 73000\n- Hashcat exits with -2 for user errors, distinct from the generic -1\n\nSee section 5 of the release notes for the full list.\n\n---\n\n## Bug Fixes\n\n- 306 fixed bugs, 64 of them memory safety fixes, most of them in the hash parsers\n- Several fixes for passwords that older versions missed, for example in WPA, SAP, NTLM and Argon2. If you attacked one of these hash-modes with v7, it may be worth running the attack again\n\n---\n\n## Final Words\n\nHashcat v8.0.0 brings several major features, and honestly, they could have filled several releases. They all came in at the same time, and at a pace that left no room to slow down for a release in between.\n\nIf I had to name the most important ones, it would be PCFG and hash recipes. Both are for the users, not for the developers. PCFG is most likely what you will start once your wordlist and rule attacks are exhausted. And with hash recipes, hashcat no longer supports \"only\" 700 hash-modes. It supports an unlimited number of them.\n\nI want to sincerely thank all contributors, testers, and supporters who helped bring this release to life. You know who you are. Thank you.\n","reactions":{"total_count":20,"+1":5,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":6,"rocket":3,"eyes":1}}
