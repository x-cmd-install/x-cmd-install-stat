4hBdvZ","name":"sq_0.55.0_linux_arm64.deb","label":"","uploader":{"login":"neilotoole","id":6013203,"node_id":"MDQ6VXNlcjYwMTMyMDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":38643460,"digest":"sha256:3eab66e917050cbee5bde44adc14dfbc665a498c845b6fbfa5df999ac357ccfb","download_count":4,"created_at":"2026-09-10T02:14:37Z","updated_at":"2026-09-10T02:14:38Z"},{"id":554032086,"node_id":"RA_kwDOAxZo5M4hBdvW","name":"sq_0.55.0_linux_arm64.pkg.tar.zst","label":"","uploader":{"login":"neilotoole","id":6013203,"node_id":"MDQ6VXNlcjYwMTMyMDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zstd","state":"uploaded","size":36065130,"digest":"sha256:c86632eec2621b77f53b6268621981cbda1200440bcd3f726bf5d7f90f3a875b","download_count":3,"created_at":"2026-09-10T02:14:37Z","updated_at":"2026-09-10T02:14:38Z"},{"id":554032051,"node_id":"RA_kwDOAxZo5M4hBduz","name":"sq_0.55.0_linux_arm64.rpm","label":"","uploader":{"login":"neilotoole","id":6013203,"node_id":"MDQ6VXNlcjYwMTMyMDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-rpm","state":"uploaded","size":39646016,"digest":"sha256:24ce50587d9cadfe36ec9dda8d3b47e7d02095d8cfe674988fcbe5b27f1ed1e9","download_count":2,"created_at":"2026-09-10T02:14:35Z","updated_at":"2026-09-10T02:14:36Z"}],"body":"### Added\r\n\r\n- [#986]: [`sq driver ls`](https://sq.io/docs/cmd/driver-ls) with `-j` / `-y` now reports an `is_embedded_sql` field for each driver, `true` for the in-process SQL  drivers (SQLite, DuckDB) and `false` for the networked engines (including rqlite,  which is SQLite-backed but reached over HTTP) and non-SQL drivers.\r\n\r\n### Changed\r\n\r\n- \u2622\ufe0f [#1136]: In JSON output, a backspace or form feed inside a string value is now written using  its two-character short escape instead of the six-character numeric escape. This aligns `sq` with  the behavior of `encoding/json` since [Go 1.22](https://go.dev/doc/go1.22#encoding/json). Both  spellings decode to the same string, so anything that parses `sq`'s JSON is unaffected, and only  output containing one of those two characters changes at all. Stored fixtures, golden files or  checksums that compare `sq`'s JSON byte-for-byte may need regenerating.\r\n\r\n### Fixed\r\n\r\n- [#975]: A join across two sources could fail with `database is locked` when  large tables were copied into the temporary join database.\r\n- [#1017]: A canceled or failed table copy or ingest could commit a partially-written  table instead of rolling back.\r\n- [#976], [#994]: The DuckDB driver now correctly quotes table, column, and schema  names that contain a double quote (e.g. a `we\"ird` table created from a CSV  header), completing the identifier-quoting fix [#821] applied to SQLite and rqlite.\r\n- [#968]: Aligned the SQLite and DuckDB Sakila test fixtures with the canonical  schema used by the other drivers.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
