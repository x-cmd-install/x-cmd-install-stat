e in `tmp` by @chris-dmello in https://github.com/harbor-framework/harbor/pull/3529\n* fix(daytona): make dockerd wait configurable by @kobe0938 in https://github.com/harbor-framework/harbor/pull/2432\n* antigravity-sdk: upgrade google-antigravity to 0.1.20 and fix antigravity_sdk configs by @IUdalov in https://github.com/harbor-framework/harbor/pull/3398\n* create-task skill: move multi_step_reward_strategy above [task] by @no-hup in https://github.com/harbor-framework/harbor/pull/3409\n* Fix agent.env credential overrides in agent adapters by @alexgshaw in https://github.com/harbor-framework/harbor/pull/3571\n* fix(job): round-trip versioned package datasets by @reinainblood in https://github.com/harbor-framework/harbor/pull/2851\n* fix: resume the exact requested job directory by @davidbzyk in https://github.com/harbor-framework/harbor/pull/3207\n* Add more ERROR_PATTERN entries in BaseInstalledAgent to avoid falling back to NonZeroAgentExitCodeError by @scale-ai-chris-liu in https://github.com/harbor-framework/harbor/pull/3569\n* ci: speed up Python checks with parallel jobs and steps by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3575\n* fix(docker): preserve host credentials when task HOME changes by @arpitg1991 in https://github.com/harbor-framework/harbor/pull/3580\n* Classify Claude Code StreamTruncated error as ApiConnectionClosedError by @viveksb007 in https://github.com/harbor-framework/harbor/pull/3577\n* fix(mini-swe-agent): tolerate null text parts in ATIF conversion by @scale-ai-chris-liu in https://github.com/harbor-framework/harbor/pull/3591\n* fix(rewardkit): stop the example task from passing a stub solution by @YanggWendy in https://github.com/harbor-framework/harbor/pull/3523\n* docs: add interactive LiteLLM model lookup by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3605\n* fix(codex): chown auth.json to the image's agent user by @YanggWendy in https://github.com/harbor-framework/harbor/pull/3594\n* feat(agent