obe0938 in https://github.com/harbor-framework/harbor/pull/3685\n* feat(cli): shorten API connection flags by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3686\n* docs: add dark mode error classification diagram by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3670\n* docs: clarify ACP bridge target support by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3592\n* docs: document the reasoning effort flag by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3566\n* Remove stale reward files before verification by @alexgshaw in https://github.com/harbor-framework/harbor/pull/3692\n* fix(claude-code): register MCP servers in ACP mode by @tempoden in https://github.com/harbor-framework/harbor/pull/3630\n* feat(mcp): forward HTTP headers to supported agents by @tempoden in https://github.com/harbor-framework/harbor/pull/3661\n* fix(trial): keep scrubbed JSON valid and skip boolean flag values by @tempoden in https://github.com/harbor-framework/harbor/pull/3653\n* feat(trial): add failure policy accessors to trial results by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3694\n* Add harbor lint for static task validation by @alexgshaw in https://github.com/harbor-framework/harbor/pull/3674\n* Honor explicit API keys in LiteLLM-backed agents by @scvance in https://github.com/harbor-framework/harbor/pull/3720\n* support multiple solutions by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3724\n* perf(runta): reuse connections and optimize directory downloads by @ADD-SP in https://github.com/harbor-framework/harbor/pull/3659\n* Support generic LLM configuration in native OpenHands SDK agent by @neubig in https://github.com/harbor-framework/harbor/pull/3689\n* fix(swe-agent): use the working directory as a preexisting repo without /testbed by @CatherineYin1213 in https://github.com/harbor-framework/harbor/pull/3715\n* feat(qwen): support native settings through config by @DragonnZhang in https