me":"LocalAI-Launcher-arm64.AppImage.sha256","label":"","uploader":{"login":"mudler-agent","id":307077781,"node_id":"U_kgDOEk2ilQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":98,"digest":"sha256:904549e2676c508441e5087fa91893030ab52975d2cfccf58b1e67ac7ae692a3","download_count":12,"created_at":"2026-11-18T21:19:06Z","updated_at":"2026-11-18T21:19:07Z"},{"id":765043044,"node_id":"RA_kwDOJLVrdc4tmaFk","name":"LocalAI-Launcher-x86_64.AppImage","label":"","uploader":{"login":"mudler-agent","id":307077781,"node_id":"U_kgDOEk2ilQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.appimage","state":"uploaded","size":126376530,"digest":"sha256:fd01721d8f5826f931a894e367d44755243e8fea1018059d0d16b82bbe09b16d","download_count":177,"created_at":"2026-11-18T21:19:06Z","updated_at":"2026-11-18T21:24:38Z"},{"id":765043041,"node_id":"RA_kwDOJLVrdc4tmaFh","name":"LocalAI-Launcher-x86_64.AppImage.sha256","label":"","uploader":{"login":"mudler-agent","id":307077781,"node_id":"U_kgDOEk2ilQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":99,"digest":"sha256:b89254990bd2066d8986597f1e30b3ac3248187b5a805598fdcd25dcbab907a5","download_count":12,"created_at":"2026-11-18T21:19:06Z","updated_at":"2026-11-18T21:19:07Z"},{"id":764271757,"node_id":"RA_kwDOJLVrdc4tjdyN","name":"LocalAI-v5.0.0-checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":378,"digest":"sha256:fda9789fc28a90bb13846d4c148d790d1cfff0cc1cc45ddd7840438a83e76606","download_count":514,"created_at":"2026-11-18T17:15:59Z","updated_at":"2026-11-18T17:15:59Z"},{"id":764271578,"node_id":"RA_kwDOJLVrdc4tjdva","name":"LocalAI-v5.0.0-source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":65435419,"digest":"sha256:8879ff68b4356bef0c14997609d2e9740c4fbbbe62e8428e621286b9c5aaf42e","download_count":62,"created_at":"2026-11-18T17:15:55Z","updated_at":"2026-11-18T17:15:58Z"},{"id":765043045,"node_id":"RA_kwDOJLVrdc4tmaFl","name":"LocalAI.dmg","label":"","uploader":{"login":"mudler-agent","id":307077781,"node_id":"U_kgDOEk2ilQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":120721974,"digest":"sha256:f7df5384af6523406ff303153d4c8058215356547ce7721de724ef4664298c62","download_count":100,"created_at":"2026-11-18T21:19:06Z","updated_at":"2026-11-18T21:24:24Z"},{"id":765043114,"node_id":"RA_kwDOJLVrdc4tmaGq","name":"LocalAI.dmg.sha256","label":"","uploader":{"login":"mudler-agent","id":307077781,"node_id":"U_kgDOEk2ilQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":78,"digest":"sha256:78d0b8aa5ab9c9c3f4e9c3c45212003961cd55bb00f62b866eacf7ce99efd2c6","download_count":12,"created_at":"2026-11-18T21:19:08Z","updated_at":"2026-11-18T21:19:08Z"}],"body":"<p align=\"center\">\r\n  <!-- 📸 DRAG-AND-DROP: 00-release-banner.png -->\r\n  <em>\r\n<img width=\"1920\" height=\"1080\" alt=\"site-release-1920x1080-v3\" src=\"https://github.com/user-attachments/assets/92800193-8455-425c-9972-5955bb6483ae\" />\r\n</em>\r\n</p>\r\n\r\n\r\nRun open models for chat, images, speech and video on your own machines. The API speaks the OpenAI and Anthropic formats. Your team gets chats, files and documents on top, and the assistant can write and run code. 5.0 adds a desktop app, Projects, a Files page, Office documents, a Python sandbox, team sharing and an add-on library, all built on chats that now run on the server.\r\n\r\n<hr>\r\n\r\n**Highlights:**\r\n\r\n- 🖥️ **Desktop app**: a new app for macOS (Apple silicon) and Linux (x86-64 and ARM64) installs, updates, starts and stops LocalAI, or connects to a LocalAI server somewhere else.\r\n- 🗂️ **Projects**: group chats around one folder, with notes the chats read and that you confirm before they are saved.\r\n- 💬 **Chats on the server**: a chat keeps working when you close the tab. Steer it while it works, hand work to sub-agents, set a `/goal`, or talk to it hands-free with Live.\r\n- 📁 **Files**: upload, preview, search, extract archives, Trash, and a History tab that undoes any change, yours or the model's.\r\n- 📄 **Office documents from a chat**: the Simple Office add-on reads, edits and creates Word, Excel and PowerPoint files, and reads and creates PDF.\r\n- 🐍 **Sandbox**: run Python and shell commands on your files in an isolated runtime with no network by default. Linux only in this release.\r\n- 👥 **Team and sharing**: accounts and roles, plus sharing of folders, saved agents, Knowledge collections and connections with one person or with everyone.\r\n- 🧩 **Add-ons**: a library of separate programs that add tools to a chat, from Slack and Discord bots to Mail, Google Drive, GitHub and Home Assistant.\r\n- 🔌 **Remotes**: connect another LocalAI instance, or an OpenAI or Anthropic compatible endpoint, and use its models like your own.\r\n- 🎨 **New look and a better first run**: a new theme, logo and mascot, and Home recommends a model for your hardware.\r\n\r\n---\r\n\r\n## 📊 This release in numbers\r\n\r\n| | |\r\n|---|---|\r\n| Pull requests merged | **130** |\r\n| Commits | **1,432** (non-merge), most of them direct commits |\r\n| Files changed | 7,310 |\r\n| Feature PRs | 41 |\r\n| User-facing fix PRs | 35 |\r\n| Model library | 2,212 to **2,325** entries (+134 added, 21 removed) |\r\n| Backends | more than 80 |\r\n\r\nCounts compare `v4.12.1` with the release-preparation snapshot. Most of 5.0 landed as direct commits, so the sections below cite commits and docs pages as well as PRs.\r\n\r\n---\r\n\r\n## 📌 TL;DR\r\n\r\n| Area | Summary |\r\n|---|---|\r\n| 🖥️ Desktop app | Electron app for macOS (Apple silicon) and Linux AppImages. It replaces the older launcher and reads the same `~/.localai` folder. |\r\n| 🗂️ Projects | Chats grouped around one folder, with a `memory/` folder of notes, defaults for new chats, and agents made from a project. |\r\n| 💬 Chats | Chats run on the server, with steering, a message queue, sub-agents, compaction, goals, slash commands and Live voice. `/v1/chat/completions` is unchanged. |\r\n| 📁 Files | Files page with folders, upload, preview, search inside documents, archive extraction, Trash and undoable history. |\r\n| 📄 Office | Simple Office add-on: 11 tools for Word, Excel, PowerPoint and PDF, and PowerPoint decks built on your own template. |\r\n| 🐍 Sandbox | `bash` tool in a KVM or gVisor sandbox with your files mounted. Each command is one undoable change. Linux only. |\r\n| 👥 Team | Roles, per-user features, and one Share dialog for folders, agents, collections and connections. |\r\n| 📑 Pages | The assistant writes small HTML pages that keep their data in your files and open beside the chat. |\r\n| 🧩 Add-ons | Add-on library with install by tag, upgrade review, one Updates page, OAuth login for add-ons, and Slack and Discord chat apps. |\r\n| 🔎 Models | Remotes, model search in Explore, the model library, an experimental Strata backend, LFM3-Audio speech-to-speech and a forecast API. |\r\n| 🎨 UI | New theme, logo and mascot, a first-run model recommendation, a redesigned Nodes page. |\r\n\r\n---\r\n\r\n## ⚠️ Upgrade notes\r\n\r\n5.0 replaces the chat page and the agent runtime, and moves Studio and Talk to add-ons. Read this before you upgrade a server that other people use.\r\n\r\n- **Chats replace the old chat page, agents, agent jobs and skills.** On the first start the server converts what the old features left on disk and in the database into saved agents, triggers, skills and chats. It does not change or delete the old data. Converted triggers, MCP connectors and connector bindings are switched off until you turn them on. Conversations kept only in a browser were never on the server: upload them with `POST /api/chats/import/browser`. `GET /api/chats/conversion` returns the report, and each dropped setting is named in it. See [Chats: moving from the old chat, agents and skills](https://localai.io/docs/features/chats-migration/). #12918\r\n- **Removed APIs.** `/api/agents` (agents, actions, SSE), `/api/agents/skills`, `/api/agents/git-repos` and `/api/conversations` answer `404`. Use `/api/chats/agents`, `/api/chats` and `/api/chats/skills`. The collections API moved to `/api/collections`; the old path still works with a `Deprecation: true` header. The command `local-ai agent` is gone.\r\n- **Renamed and ignored options.** The `LOCALAI_AGENT_POOL_*` collection settings are now `LOCALAI_COLLECTIONS_*`, and `LOCALAI_DISABLE_AGENTS` is split into `LOCALAI_DISABLE_CHATS` and `LOCALAI_DISABLE_COLLECTIONS`. The old names still work and log a deprecation warning. Some agent pool options are now ignored; the migration page lists them.\r\n- **Studio and Talk are add-ons.** Nothing is preinstalled. An administrator installs them from **Add-ons**, and users need the `addons` feature, which the upgrade does not grant. See [Upgrading: Studio and Talk are add-ons now](https://localai.io/docs/addons/install-and-update/#upgrading-studio-and-talk-are-add-ons-now).\r\n- **Permissions.** On a server with accounts, saved agents, triggers, connectors, pages and add-ons are off by default for new users until an administrator grants them. The `skills` and `chat_history` features are gone from the user permissions.\r\n- **`liquid-audio` is removed.** Configs with `backend: liquid-audio` stop working. Use an `lfm3-audio-2b` entry on `llama-cpp` with `pipeline.any_to_any: true`. LFM2-Audio and LFM2.5-Audio have no replacement. `llama-cpp` models with `realtime_audio` must now set `pipeline.any_to_any: true`. #12958\r\n- **Simple Office creation tools take Markdown or CSV.** The old `blocks` (DOCX, PDF) and `sheets` (XLSX) arguments are rejected with migration guidance. #13029\r\n- **The desktop app replaces the older launcher.** The older launcher does not update itself to the new app: download the new file once. Your models, backends and settings in `~/.localai` stay. See [Move from the older launcher](https://localai.io/docs/start/install/desktop/#move-from-the-older-launcher). Commits [0a72543](https://github.com/mudler/LocalAI/commit/0a72543fd), [822a7bc](https://github.com/mudler/LocalAI/commit/822a7bc7c).\r\n- **Models and backends come from the libraries.** Release builds read the model library (`official-models`) and the backend library by default. `gallery/index.yaml` is now a generated copy, kept for older releases. See [Model library](https://localai.io/docs/models/#model-library-preview).\r\n- **Add-ons follow the release.** A release build reads the add-on index attached to its own release. A source build reads the development channel.\r\n\r\n---\r\n\r\n## 📦 Downloads\r\n\r\n| Platform | File |\r\n|---|---|\r\n| macOS, Apple silicon (desktop app) | `LocalAI.dmg` |\r\n| Linux x86-64 (desktop app) | `LocalAI-Launcher-x86_64.AppImage` |\r\n| Linux ARM64 (desktop app) | `LocalAI-Launcher-arm64.AppImage` |\r\n| Linux x86-64 (server binary) | `local-ai-v5.0.0-linux-amd64` |\r\n| Linux ARM64 (server binary) | `local-ai-v5.0.0-linux-arm64` |\r\n| macOS, Apple silicon (server binary) | `local-ai-v5.0.0-darwin-arm64` |\r\n\r\nEach file has a `.sha256` file next to it. There is no macOS build for Intel: use a container there. The AppImage needs FUSE 2; on Ubuntu 24.04 and later install `libfuse2t64`. See the [desktop app guide](https://localai.io/docs/start/install/desktop/).\r\n\r\nTo install a server instead:\r\n\r\n```bash\r\ncurl -sSL https://localai.io/install.sh | sh\r\n```\r\n\r\nor with a container:\r\n\r\n```bash\r\ndocker run -p 8080:8080 --name local-ai -ti localai/localai:latest\r\n```\r\n\r\n---\r\n\r\n## 🚀 New Features & Major Enhancements\r\n\r\n### 🖥️ The desktop app\r\n\r\nLocalAI has a desktop app for macOS and Linux, built on Electron. It installs, updates, starts and stops the LocalAI server on your computer, and shows the web interface in its own window with a status bar for the server. On the first start you choose to run LocalAI on this computer or to connect to a server that runs somewhere else, and you can keep several servers. It has pages for logs, settings, and a Connect page that shows how other devices and apps reach the server.\r\n\r\nThe DMG and the app are signed with an Apple Developer ID and notarized. On Ubuntu 23.10 and later, the AppImage starts with the Chromium sandbox off unless user namespaces are allowed; the status bar says so, and the app can open the web interface in your browser instead. The app replaces the older Go launcher.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"1600\" height=\"1170\" alt=\"02-desktop-app-first-run\" src=\"https://github.com/user-attachments/assets/6cb8be03-86b3-470e-9356-5cee0bf349bc\" /></em>\r\n  <br><em>On first start, the desktop app asks where LocalAI should run: on this computer or on a LocalAI server.</em>\r\n</p>\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1535\" alt=\"03-desktop-app-models\" src=\"https://github.com/user-attachments/assets/1877a542-b0c1-4468-aa8b-db3185fcfa94\" /></em>\r\n  <br><em>The Models page lists the models that fit this computer, with the best fit first.</em>\r\n</p>\r\n\r\n> 🔗 Commits: [Electron launcher](https://github.com/mudler/LocalAI/commit/0a72543fd), [remove the Go launcher](https://github.com/mudler/LocalAI/commit/822a7bc7c), [DMG build](https://github.com/mudler/LocalAI/commit/2a16321d7). Docs: [Desktop app](https://localai.io/docs/start/install/desktop/).\r\n\r\n### 🗂️ Projects\r\n\r\nA project groups chats around one folder in your own files. The folder holds a `files/` folder for the material and a `memory/` folder of notes that the project's chats read at each turn. The model can propose a note, and you confirm it before it is saved. The **Tools** tab sets defaults for new chats: skills, add-ons, MCP servers, connectors and collections. A chat has one home project and can read up to eight others. You can make a saved agent from a project and share the project folder.\r\n\r\nA project organises chats. It is not an access boundary: a chat outside the project can still read the project's files from your home folder.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"1400\" height=\"875\" alt=\"projects\" src=\"https://github.com/user-attachments/assets/24c6aa72-e71b-4fdb-b4cc-62e2f1e9f55b\" /></em>\r\n  <br><em>A project page: recent chats, the project memory and the tabs for files, agents and tool defaults.</em>\r\n</p>\r\n\r\n> 🔗 Commit: [add Projects](https://github.com/mudler/LocalAI/commit/ed7b699d0). Docs: [Projects](https://localai.io/docs/features/projects/).\r\n\r\n### 💬 Chats that run on the server\r\n\r\nChats are now kept and run by the server, so a chat keeps working when you close the tab. A message you send while the model works waits in a queue, can be edited or discarded, and reaches the model at its next step. The model can start sub-agents in the foreground or the background (up to four in the background), and long chats are compacted. The OpenAI-compatible `/v1/chat/completions` endpoint is unchanged.\r\n\r\n- **Goals.** `/goal <text>` keeps a chat working toward an objective over many turns. It pauses on **Stop** and at its limits: 20 turns and 400 steps by default (`chats_goal_max_turns`, `chats_goal_max_steps`).\r\n- **Slash commands.** `/compact`, `/clear`, `/loop`, `/skill`, and your own commands.\r\n- **Live.** Talk to a chat hands-free from the chat or from Home. Live needs a microphone, a speech-to-text model and a voice model; an administrator installs small ones with one click from the setup sheet. Your audio stays on your LocalAI server.\r\n- **Memory and change proposals.** Every chat can read the index of your notes with `memory_read`. A model asks to change a note or an agent profile with `propose_change`, and nothing is written until you confirm. A confirmed change can be undone.\r\n- **MCP connector tools behind the tool search.** With `chats_tool_search` on, MCP connector tools are found on demand instead of being sent on every turn.\r\n- **Send a message from a chat.** With `send_message`, a chat and its loops can post to an approved channel of one of your messaging connections, for example to report a result. One chat sends at most 5 messages in 10 minutes.\r\n- **Context size for the chat agent.** For a chat model with no `context_size`, the loader aims at 32,768 tokens and steps down to what fits, never below 16,384 while that fits. A banner says when a model's window is too small.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1316\" alt=\"07-agents-create\" src=\"https://github.com/user-attachments/assets/c3d9d0c2-18bc-4cc5-82df-fe8cff51c393\" />\r\n</em>\r\n  <br><em>Create a saved agent in four steps: purpose, abilities, where it works, and a review.</em>\r\n</p>\r\n\r\n> 🔗 PRs: #12918, #13064, #13066, #13069, #13163, #13153, #13199. Commits: [Live](https://github.com/mudler/LocalAI/commit/f35ea7f85), [Live from Home](https://github.com/mudler/LocalAI/commit/8f8eb02f0), [user slash commands](https://github.com/mudler/LocalAI/commit/6cd94a5f1), [send_message](https://github.com/mudler/LocalAI/commit/4e66a1f3a). Docs: [Goals](https://localai.io/docs/features/chats-goals/), [Live](https://localai.io/docs/features/chats-api/#talk-to-a-chat-live).\r\n\r\n### 📁 Files\r\n\r\nThe new **Files** page holds your files. Upload files and folders, drag rows between folders, preview a document and download it. Search covers names and the text inside PDF, Word, Excel and PowerPoint files. **Extract here** unpacks ZIP and TAR archives; 7z and RAR stay off until an administrator turns them on. Deleting moves a file to the Trash, and the **History** tab undoes a change.\r\n\r\nA chat uses the same files. Attach a file to a message, or let the model list, read, search, write and edit your files. What the model changes goes into the same history, so you can undo it. A saved agent can be limited to chosen folders, each as read or write. Distributed deployments without S3 can keep the files on a shared filesystem.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1325\" alt=\"06-files-history-undo\" src=\"https://github.com/user-attachments/assets/00cbbb95-63bb-4cd9-b7ec-74e83effc3b2\" />\r\n</em>\r\n  <br><em>Every change is listed in History with an Undo, including the commands a chat ran in the Sandbox.</em>\r\n</p>\r\n\r\n> 🔗 PRs: #13009, #13012. Commits: [extract an archive](https://github.com/mudler/LocalAI/commit/e751dbced), [managed folders](https://github.com/mudler/LocalAI/commit/aa2d59ea5). Docs: [Files and shared folders](https://localai.io/docs/features/files/).\r\n\r\n### 📄 Office documents from a chat\r\n\r\nThe Simple Office add-on has 11 tools: read, edit and create for Word, Excel and PowerPoint, and read and create for PDF. Creation takes Markdown (Word, PDF) or CSV (Excel). A PowerPoint deck can be built on your own `.pptx` or `.potx` template and keeps its masters, layouts, theme colours and fonts. When a file name is taken, the new file is saved next to the old one. Limits: no PDF editing, the PDF writer takes Latin-1 text only, and layouts are basic. For charts or exact layout, use the Sandbox.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1303\" alt=\"04-office-preview\" src=\"https://github.com/user-attachments/assets/09798516-b3b9-403c-8e03-0249107f1f48\" />\r\n</em>\r\n  <br><em>Preview a spreadsheet in Files, next to the Word, PDF and PowerPoint files of the same plan.</em>\r\n</p>\r\n\r\n> 🔗 PRs: #13029, #13227. Docs: [Office](https://localai.io/docs/addons/catalogue/work/office/).\r\n\r\n### 🐍 Sandbox: run Python on your files\r\n\r\nThe Sandbox add-on gives a chat a `bash` tool that runs in an isolated runtime with your files mounted. Ask for a chart from a CSV file, and the model runs a Python script and saves the image in your files. What a command changed is saved as one change that you can undo. The add-on tries KVM (Cloud Hypervisor) first, then gVisor. The `base` profile has Python with pandas, matplotlib, openpyxl, python-docx, python-pptx, pypdf and Pillow; the `media` profile adds ffmpeg, sox and ImageMagick.\r\n\r\nA sandbox has no network device. HTTP and HTTPS go through a proxy, and the default is **Off**, so `pip install` fails until an administrator allows package registries or public sites. A chat can ask for a wider setting, but never for more than the administrator allows. The Sandbox add-on runs on Linux (amd64 and arm64) in this release.\r\n\r\n<p align=\"center\">\r\n  <em>\r\n<img width=\"1600\" height=\"1566\" alt=\"05-sandbox-chart\" src=\"https://github.com/user-attachments/assets/bf7f0a50-b284-4c3b-9a27-116442fb9e1c\" /></em>\r\n  <br><em>The chart comes back as a file in the chat, created by the assistant.</em>\r\n</p>\r\n\r\n> 🔗 PRs: #13038, #13073. Docs: [Sandbox](https://localai.io/docs/addons/catalogue/work/sandbox/).\r\n\r\n### 👥 Team and sharing\r\n\r\nWith accounts on, there are administrator and user roles, and each person has their own files, chats and saved agents. One **Share** dialog shares a folder of your home, a saved agent, a Knowledge collection or a connection with one person or with everyone. Revoking access stops the work that the new role no longer allows. A shared saved agent runs as the person who uses it, with that person's folders, memory and connections. An administrator can also make shared folders and choose their members.\r\n\r\nOnly a person can share, from the browser. No model, agent or add-on can share anything or take access away.\r\n\r\n> 🔗 PRs: #13130, #13009. Docs: [Sharing](https://localai.io/docs/features/sharing/).\r\n\r\n### 📑 Pages\r\n\r\nAsk the assistant for a small HTML page, such as a task board, and it writes one that keeps its data in your files. Pages open in a dock beside the chat, and a trigger can keep a page's data current. For users on a server with accounts, pages are off until an administrator switches them on.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1350\" alt=\"10-pages\" src=\"https://github.com/user-attachments/assets/128c7a82-b65c-4d46-9537-0fe80fa48ebe\" />\r\n</em>\r\n  <br><em>A task board page made by the assistant, open beside the chat.</em>\r\n</p>\r\n\r\n> 🔗 PR: #13127. Commits: [pages beside the chat](https://github.com/mudler/LocalAI/commit/4e8333502). Docs: [Pages and Home](https://localai.io/docs/features/pages-and-home/).\r\n\r\n### 🧩 Add-ons and the add-on library\r\n\r\nAn add-on is a separate program that gives LocalAI new tools. An administrator installs it from the library, and its tools appear in the chat's **Tools** menu. The library includes Studio and Talk, Voice, Face, Fine-tuning, Quantization, Tables, Simple Office, Sandbox, Web, Calendar, Contacts, Mail (IMAP and SMTP), Gmail, Google Drive, GitHub, SSH, Home Assistant, Jellyfin and PiKVM.\r\n\r\n- **Chat apps.** Slack and Discord add-ons let people talk to a saved agent from those apps. A binding answers nobody until you add allowed senders, and it can limit the kinds of file it reads.\r\n- **OAuth for add-ons.** An add-on can ask a person to log in to an external service with OAuth 2.0; the host runs the login after an administrator approves it.\r\n- **Write modes.** Mail, Gmail, Google Drive and PiKVM offer **Read only**, **Asks you first** and **Allow all**.\r\n- **Updates in one place.** An **Updates** page covers backends and add-ons, with a review step before anything runs and inbox notifications.\r\n- **Install and run.** Development add-ons install by tag and are verified against the resolved digest. The add-on owner can run as its own workload in a cluster (`--addons-role`).\r\n\r\nAn add-on runs as the operating system user that runs LocalAI, so install only add-ons you trust. Only the Sandbox isolates what it runs.\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1288\" alt=\"08-addons-tables\" src=\"https://github.com/user-attachments/assets/7dadb59f-33f2-47b1-8e47-1ab8e172fab6\" />\r\n</em>\r\n  <br><em>The Tables add-on: a Library database with a Books table that you can filter, export and share.</em>\r\n</p>\r\n\r\n<p align=\"center\">\r\n  <em><img width=\"2400\" height=\"1350\" alt=\"09-addons-library\" src=\"https://github.com/user-attachments/assets/22a4621d-c9fe-409f-8119-50dc9de1172f\" />\r\n</em>\r\n  <br><em>Find add-ons in the library and install them from the card.</em>\r\n</p>\r\n\r\n> 🔗 PRs: #12858, #12867, #12875, #12883, #12898, #12948, #13034, #13077, #13097, #13104, #13128, #13154, #13167, #13173. Docs: [Add-ons](https://localai.io/docs/addons/).\r\n\r\n### 🔌 Remotes\r\n\r\nConnect another LocalAI instance, or an OpenAI or Anthropic compatible endpoint, from the first-run guide or from the Models page. Each model the remote offers becomes an ordinary model config, so it works in chats, the API and failover. The credential is sealed at rest and write-only in the API. The admin API is under `/api/remotes`.\r\n\r\n> 🔗 PR: #13235. Docs: [Remotes](https://localai.io/docs/administration/remotes/).\r\n\r\n### 🔎 Models, backends and engines\r\n\r\n- **Model search.** The **Explore** tab searches Hugging Face, with the size of each file and whether it fits your machine. Gated Hugging Face repositories are not offered.\r\n- **Strata (experimental).** A backend for the Strata engine runs Qwen3.8-Flash-Next and DeepSeek V4.1-Flash on supported GPUs, with gallery entries that build the engine's pack on first load. #13125, #13131, #13132\r\n- **LFM3-Audio speech-to-speech.** LFM3-Audio-2B runs on `llama-cpp` in the Realtime API (WebSocket and WebRTC). #12958\r\n- **Forecasting.** A `timestral-cpp` backend and a `POST /v1/forecast` endpoint return quantile forecasts for time series, on CPU. #12885\r\n- **Vision alias.** An alias can name a `vision_alias` model that serves its requests with images. #13171\r\n- **llama.cpp.** New `moe_cache_cpu_share` option, and fixes for `reasoning_budget` and `mlock`. #13155, #13157\r\n- **Backend operations.** `--max-concurrent-backend-operations` lets installs, upgrades and deletes run in parallel (default 1). #12888\r\n- **Realtime.** Transcription-only sessions announce the speaker of each turn. #12871\r\n\r\n> 🔗 Commits: [model search API](https://github.com/mudler/LocalAI/commit/a65d87b4b), [search from Explore](https://github.com/mudler/LocalAI/commit/c54c3d93a).\r\n\r\n### 🎨 New look and first run\r\n\r\nThe web UI has a new theme, logo and mascot, in light and dark. On a fresh install, Home recommends a model for the hardware it detects, and the first-run guide asks whether your models run on this machine or on another server. The Nodes page is redesigned with a fleet card, grouped rows and an inspector. iOS shows the logo when you add LocalAI to the home screen.\r\n\r\n<p align=\"center\">\r\n  <em>\r\n<img width=\"1600\" height=\"900\" alt=\"x09-look-before-after-1600x900\" src=\"https://github.com/user-attachments/assets/9f8494ef-f47e-4207-82a7-615fa82bf2d6\" />\r\n\r\n</em>\r\n  <br><em>Home in 4.12 on the left, and in 5.0 on the right.</em>\r\n</p>\r\n\r\n> 🔗 PRs: #13187, #13199, #13231, #13121, #12917.\r\n\r\n---\r\n\r\n## 🐛 Bug Fixes (recap)\r\n\r\n- `fix(distributed)`: keep one idle replica when scaling down, and keep healthy replicas when one fails. #13201, #13233\r\n- `fix(chats)`: keep the system prompt stable across chats so the prompt cache hits, and start every shell in the chat's work folder. #13153, #13212\r\n- `fix(llama-cpp)`: fix `reasoning_budget` and `mlock`, add missing options, harden raw flags; keep an existing image data URL. #13157, #12921\r\n- `fix(downloader)`: parse the Hugging Face `@revision` suffix without panicking. #13179\r\n- `fix(oci)`: fall back to the OS temp folder when the staging folder is not writable. #13186\r\n- `fix(vram)`: do not cache failed probes. #13203\r\n- `fix(realtime)`: never offer deprecated IPv6 addresses as WebRTC ICE candidates. #13172\r\n- `fix(cloud-proxy)`: collapse nullable type unions in OpenAI tool schemas. #13165\r\n- `fix(proxy)`: propagate model env and accept direct keys. #12940\r\n- `fix(trace)`: stop trace writes into the data path on shutdown. #13161\r\n- `fix(core)`: correct AMD discovery and MCP and P2P handling. #13044\r\n- `fix(strata)`: preserve image markers in tokenizer messages. #13254\r\n- `fix(mlx-vlm)`: bump the mlx-vlm pin to v0.6.12. #12818\r\n- `fix(ui)`: show GPU memory use on the Settings page, no \"No models loaded\" for non-admins, keep the Models page tabs usable. #13162, #13166, #12899\r\n- `fix(addons)`, `fix(connectors)`, `fix(studio)`: owner settings, upgrades, discovery and connector delivery fixes. #12850, #12878, #12943, #13026, #13030, #13033, #13035, #13062, #13078, #13127, #13129\r\n- `fix(kokoros)`: implement Forecast as unsupported. #13134\r\n- `fix(gallery)`: installing a recommended model with no variants from Home no longer fails with \"pinned model variant not found\". #13277\r\n- `fix(timestral-cpp)`: build on arm64 (Linux and macOS). #13276\r\n\r\n---\r\n\r\n## 🧠 Models\r\n\r\nThe model library grows from 2,212 to 2,325 entries: 134 added, 21 removed (the `liquid-audio` entries among them). Additions include the Strata GGUF sets (Qwen3.8-Flash-Next and DeepSeek V4.1-Flash), Phonon-2.5 and Fluid Speech Pro on `parakeet-cpp`, Flint, MiniCPM-OCR 1.0, Nanbeige4.3, Gemma 4 and Qwen3.5 Artemis variants, Ternary Bonsai 2, and BGE English embedding variants. Check each model card for its licence and hardware needs.\r\n\r\n> 🔗 PRs: #12854, #12896, #12994, #13131, #13132, #13253, #13267.\r\n\r\n---\r\n\r\n## 👒 Dependencies\r\n\r\nThe range has 104 engine update commits, most made directly by the update bot, and 19 dependency PRs.\r\n\r\n| Source | Updates |\r\n|---|---:|\r\n| `ikawrakow/ik_llama.cpp` | 15 |\r\n| `0xShug0/audio.cpp` | 15 |\r\n| `ggml-org/llama.cpp` | 14 |\r\n| `leejet/stable-diffusion.cpp` | 12 |\r\n| `mudler/vllm.cpp` | 11 |\r\n| `CrispStrobe/CrispASR` | 9 |\r\n| `NVIDIA/NeMo-Speech.cpp` | 5 |\r\n| `ggml-org/whisper.cpp` | 5 |\r\n| `ServeurpersoCom/omnivoice.cpp` | 3 |\r\n| `PrismML-Eng/llama.cpp` | 3 |\r\n| `Niko1221/Strata` | 3 |\r\n| `antirez/ds4` | 3 |\r\n| Four other sources | 6 |\r\n\r\n---\r\n\r\n## 📖 Documentation\r\n\r\nThe docs are regrouped into nine sections with a new brand, website and README (#13178). New pages cover the desktop app, Projects, Files, chats and goals, Live, the migration from the old chat and agents, Remotes, the add-on catalogue, and connecting coding agents to the OpenAI Chat Completions, OpenAI Responses and Anthropic Messages APIs. The product lede names coding (#13275). The 5.0 blog post and the home page download buttons are in #13229 and #13271.\r\n\r\n---\r\n\r\n## 🐞 Reporting problems\r\n\r\n5.0 carries a lot of new work. If something breaks after the upgrade, open an [issue](https://github.com/mudler/LocalAI/issues) or ask in the [Discord](https://discord.gg/uJAeKSAGDy).\r\n\r\n---\r\n\r\n## 🙌 New Contributors\r\n\r\nThanks to the contributors making their first merged PRs:\r\n\r\n- @genx7up in #12818.\r\n- @ilsawa in #12921.\r\n- @Lil-Clanky in #13162.\r\n- @Rutvij97 in #13186.\r\n- @zjuncal in #13203.\r\n\r\nThanks also to @walcz-de for the chat, connector and Simple Office work in this release.\r\n\r\n**Full Changelog**: https://github.com/mudler/LocalAI/compare/v4.12.1...v5.0.0\r\n\r\n<!-- Release notes generated using configuration in .github/release.yml at master -->\r\n\r\n## What's Changed\r\n### Breaking Changes 🛠\r\n* feat(realtime): LFM3-Audio speech-to-speech on llama.cpp, remove liquid-audio by @mudler-agent in https://github.com/mudler/LocalAI/pull/12958\r\n* feat(chats): server-side chats with steering, sub-agents and compaction by @mudler-agent in https://github.com/mudler/LocalAI/pull/12918\r\n### Bug fixes :bug:\r\n* fix(addons): one page title, one primary action and clearer empty states by @mudler-agent in https://github.com/mudler/LocalAI/pull/12850\r\n* fix(mlx-vlm): bump mlx-vlm pin to v0.6.12 by @genx7up in https://github.com/mudler/LocalAI/pull/12818\r\n* fix(ui): keep backends off the add-on browse list by @mudler-agent in https://github.com/mudler/LocalAI/pull/12878\r\n* fix(ui): keep the Models page fixed and give its tabs and filters room by @mudler-agent in https://github.com/mudler/LocalAI/pull/12899\r\n* fix(proxy): propagate model env and accept direct keys by @mudler-agent in https://github.com/mudler/LocalAI/pull/12940\r\n* fix(addons): verify the platform child of an add-on index by @mudler-agent in https://github.com/mudler/LocalAI/pull/12943\r\n* [llama-cpp] keep an existing image data URL by @ilsawa in https://github.com/mudler/LocalAI/pull/12921\r\n* fix(agents): allow aliases in the model picker by @mudler-agent in https://github.com/mudler/LocalAI/pull/13024\r\n* fix(connectors): route calls through the owner by @mudler-agent in https://github.com/mudler/LocalAI/pull/13026\r\n* fix(connectors): preserve disabled add-on discovery by @mudler-agent in https://github.com/mudler/LocalAI/pull/13030\r\n* fix(addons): make owner settings authoritative by @mudler-agent in https://github.com/mudler/LocalAI/pull/13033\r\n* fix(addons): run accepted upgrades on the owner by @mudler-agent in https://github.com/mudler/LocalAI/pull/13035\r\n* fix(studio): tell the model of a connector chat that files are attached by @mudler-agent in https://github.com/mudler/LocalAI/pull/13062\r\n* fix(core): correct AMD discovery and MCP/P2P handling by @mudler-agent in https://github.com/mudler/LocalAI/pull/13044\r\n* fix(studio): always read the thread when the bot is mentioned in it by @mudler-agent in https://github.com/mudler/LocalAI/pull/13078\r\n* fix(studio): keep trigger files reachable, let update_trigger change delivery and acts by @mudler-agent in https://github.com/mudler/LocalAI/pull/13127\r\n* fix(connectors): link back to the agent, report what a save changes, keep non-ASCII file-change cards by @mudler-agent in https://github.com/mudler/LocalAI/pull/13129\r\n* fix(kokoros): implement Forecast as unsupported by @mudler-agent in https://github.com/mudler/LocalAI/pull/13134\r\n* fix(chats): keep the system prompt stable across chats so the prompt cache hits by @walcz-de in https://github.com/mudler/LocalAI/pull/13153\r\n* fix(llama-cpp): fix reasoning_budget and mmlock, add missing options, harden raw flags by @mudler-agent in https://github.com/mudler/LocalAI/pull/13157\r\n* fix(cloud-proxy): collapse nullable type unions in OpenAI tool schemas by @walcz-de in https://github.com/mudler/LocalAI/pull/13165\r\n* [ui] fix(ui): show GPU memory use on the Settings page by @Lil-Clanky in https://github.com/mudler/LocalAI/pull/13162\r\n* fix(trace): stop trace persistence writes into DataPath on Shutdown by @walcz-de in https://github.com/mudler/LocalAI/pull/13161\r\n* fix(ui): no \"No models loaded\" for non-admins, Manage setups with an agent by @walcz-de in https://github.com/mudler/LocalAI/pull/13166\r\n* fix(realtime): never offer deprecated IPv6 addresses as WebRTC ICE candidates by @walcz-de in https://github.com/mudler/LocalAI/pull/13172\r\n* fix(downloader): parse the HuggingFace @revision suffix without panicking by @simpleqt in https://github.com/mudler/LocalAI/pull/13179\r\n* fix(oci): fall back to OS temp when the staging dir is not writable by @Rutvij97 in https://github.com/mudler/LocalAI/pull/13186\r\n* fix(distributed): keep one idle replica when scaling down by @mudler-agent in https://github.com/mudler/LocalAI/pull/13201\r\n* fix(chats): start every shell in the chat's work folder and quote paths by @mudler-agent in https://github.com/mudler/LocalAI/pull/13212\r\n* [vram] fix: avoid caching failed probes by @zjuncal in https://github.com/mudler/LocalAI/pull/13203\r\n* fix(ui): word the first-run add-on step without add-on names by @mudler-agent in https://github.com/mudler/LocalAI/pull/13231\r\n* fix(distributed): keep healthy replicas when one replica fails by @mudler-agent in https://github.com/mudler/LocalAI/pull/13233\r\n* [strata] fix: preserve image markers in tokenizer messages by @leilei3167 in https://github.com/mudler/LocalAI/pull/13254\r\n* fix(timestral-cpp): pin the arm64 build fix by @mudler-agent in https://github.com/mudler/LocalAI/pull/13276\r\n* fix(gallery): accept the entry's own name as the pin on a single-build entry by @mudler-agent in https://github.com/mudler/LocalAI/pull/13277\r\n### Exciting New Features 🎉\r\n* feat(addons): add-ons UI direction B: one name, Turn on and Turn off, preview pane by @mudler-agent in https://github.com/mudler/LocalAI/pull/12858\r\n* realtime: announce speakers in transcription-only sessions by @mudler-agent in https://github.com/mudler/LocalAI/pull/12871\r\n* feat(addons): log the reason behind a generic denial by @mudler-agent in https://github.com/mudler/LocalAI/pull/12875\r\n* feat(addons): run the add-on owner as its own workload by @mudler-agent in https://github.com/mudler/LocalAI/pull/12867\r\n* feat(addons): install development add-ons by tag, as backends do by @mudler-agent in https://github.com/mudler/LocalAI/pull/12883\r\n* feat(backends): timestral.cpp forecast backend and /v1/forecast API by @mudler-agent in https://github.com/mudler/LocalAI/pull/12885\r\n* feat(galleryop): limit concurrent backend operations by @mudler-agent in https://github.com/mudler/LocalAI/pull/12888\r\n* feat(addons): show the tool count of each add-on before install by @mudler-agent in https://github.com/mudler/LocalAI/pull/12898\r\n* feat(ui): serve an apple-touch-icon so iOS shows the logo on the home screen by @mauro-agent in https://github.com/mudler/LocalAI/pull/12917\r\n* feat(ui): review add-on and backend upgrades before they run by @mudler-agent in https://github.com/mudler/LocalAI/pull/12948\r\n* feat(agents): limit saved agents to one folder by @mudler-agent in https://github.com/mudler/LocalAI/pull/13009\r\n* feat(workspace): use filesystem storage without S3 by @mudler-agent in https://github.com/mudler/LocalAI/pull/13012\r\n* feat(addons): simplify Office and discover Tables by @mudler-agent in https://github.com/mudler/LocalAI/pull/13029\r\n* feat(sandbox): own document authoring skills by @mudler-agent in https://github.com/mudler/LocalAI/pull/13038\r\n* feat(addons): declare typed host capabilities by @mudler-agent in https://github.com/mudler/LocalAI/pull/13034\r\n* feat(studio): load context files and add memory_read to every chat by @mudler-agent in https://github.com/mudler/LocalAI/pull/13064\r\n* feat(studio): propose_change and revert_change with a proposal store by @mudler-agent in https://github.com/mudler/LocalAI/pull/13066\r\n* feat(ui): proposal card, Proposals page and Memory settings for change proposals by @mudler-agent in https://github.com/mudler/LocalAI/pull/13069\r\n* feat(addons): a network capability for the network-policy control by @mudler-agent in https://github.com/mudler/LocalAI/pull/13073\r\n* feat(connectors): declare file limits and build the sentences from them by @mudler-agent in https://github.com/mudler/LocalAI/pull/13077\r\n* feat(ui): redesign the Nodes page with a fleet card, grouped rows and an inspector by @mudler-agent in https://github.com/mudler/LocalAI/pull/13121\r\n* feat(ui): list the connections of an agent on its page by @mudler-agent in https://github.com/mudler/LocalAI/pull/13128\r\n* feat(strata): add an experimental backend for the Strata engine by @mudler-agent in https://github.com/mudler/LocalAI/pull/13125\r\n* feat(addons): add the Mail add-on (IMAP and SMTP) by @mudler-agent in https://github.com/mudler/LocalAI/pull/13104\r\n* feat(strata): add the GGUF models to the gallery and build the pack on first load by @mudler-agent in https://github.com/mudler/LocalAI/pull/13131\r\n* feat(strata): run DeepSeek V4.1-Flash and add its gallery entries by @mudler-agent in https://github.com/mudler/LocalAI/pull/13132\r\n* feat(sharing): share agents, connections, collections and folders between accounts by @mudler-agent in https://github.com/mudler/LocalAI/pull/13130\r\n* feat(addons): generic OAuth 2.0 login for add-ons, with Google Drive and Gmail add-ons by @mudler-agent in https://github.com/mudler/LocalAI/pull/13097\r\n* feat(llama-cpp): bump llama.cpp and add the moe_cache_cpu_share option by @mudler-agent in https://github.com/mudler/LocalAI/pull/13155\r\n* feat(ui): one place for backend and add-on updates, with inbox notifications by @mudler-agent in https://github.com/mudler/LocalAI/pull/13154\r\n* feat(chats): defer MCP connector tools behind the tool search by @walcz-de in https://github.com/mudler/LocalAI/pull/13163\r\n* feat(addons): add an Allow all write mode to mail, Gmail, Drive and PiKVM by @mudler-agent in https://github.com/mudler/LocalAI/pull/13167\r\n* feat(chats): let a connector binding limit the kinds of file it reads by @walcz-de in https://github.com/mudler/LocalAI/pull/13173\r\n* feat(config): serve image requests to an alias on a vision_alias model by @walcz-de in https://github.com/mudler/LocalAI/pull/13171\r\n* feat(ui): new LocalAI theme, logo and empty-state mascot for the web UI by @mudler-agent in https://github.com/mudler/LocalAI/pull/13187\r\n* feat: recommend a model on first run and size the context for the chat agent by @mudler-agent in https://github.com/mudler/LocalAI/pull/13199\r\n* feat(sandbox): add a macOS VM backend built on Virtualization.framework by @mudler-agent in https://github.com/mudler/LocalAI/pull/13230\r\n* [office] feat: build a PowerPoint deck on a template by @walcz-de in https://github.com/mudler/LocalAI/pull/13227\r\n* feat(remotes): connect a LocalAI instance or an OpenAI or Anthropic endpoint by @mudler-agent in https://github.com/mudler/LocalAI/pull/13235\r\n### 🧠 Models\r\n* feat(gallery): add flint and bump llama.cpp to a37cc461 by @mudler-agent in https://github.com/mudler/LocalAI/pull/12854\r\n* feat(gallery): add Phonon-2.5 parakeet-cpp models by @mudler-agent in https://github.com/mudler/LocalAI/pull/12896\r\n* fix(model-gallery): point pinned LFM3-Audio entries at main by @mudler-agent in https://github.com/mudler/LocalAI/pull/12994\r\n* chore(model-gallery): :arrow_up: update checksum by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13253\r\n* chore(model-gallery): :arrow_up: update checksum by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13267\r\n### 📖 Documentation and examples\r\n* docs: new brand, docs sections, website and README by @mudler-agent in https://github.com/mudler/LocalAI/pull/13178\r\n* blog: LocalAI 5.0 launch post and film (draft, publish with the release) by @mudler-agent in https://github.com/mudler/LocalAI/pull/13229\r\n* site: Download for Linux and Mac buttons on the home page by @mudler-agent in https://github.com/mudler/LocalAI/pull/13271\r\n* docs: name coding in the product lede by @mudler-agent in https://github.com/mudler/LocalAI/pull/13275\r\n### 👒 Dependencies\r\n* chore(deps): bump actions/setup-node from 6 to 7 by @dependabot[bot] in https://github.com/mudler/LocalAI/pull/12837\r\n* chore(deps): bump docker/login-action from 3 to 4 by @dependabot[bot] in https://github.com/mudler/LocalAI/pull/12836\r\n* chore(deps): bump grpcio from 1.84.0 to 1.85.0 in /backend/python/rerankers by @dependabot[bot] in https://github.com/mudler/LocalAI/pull/12963\r\n* chore(deps): bump docs/themes/h