ai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13290\r\n* chore(model-gallery): :arrow_up: update checksum by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13297\r\n* chore: :arrow_up: Update mudler/timestral.cpp to `57cf8a7ca4060b37ae26ebe07da1eb0af595b1f0` by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13286\r\n* chore: :arrow_up: Update 0xShug0/audio.cpp to `4de392e03f9fce78bc54154dabea898dde180c84` by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13282\r\n* chore: :arrow_up: Update CrispStrobe/CrispASR to `369d7b44fcb8854585c8dc44c20e102942122c39` by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13288\r\n* chore: :arrow_up: Update ServeurpersoCom/omnivoice.cpp to `a650381a67905fd6ad08b323ed026b042a07b623` by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13287\r\n* chore: :arrow_up: Update ggml-org/whisper.cpp to `6680804f99c3982b7d59f27ae315ce880570017e` by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13283\r\n* fix(ci): attach the add-on catalog without a manual re-run by @mudler-agent in https://github.com/mudler/LocalAI/pull/13307\r\n* feat(sandbox): enable the darwin/arm64 package by @mudler-agent in https://github.com/mudler/LocalAI/pull/13306\r\n* feat: add native Windows support (server + windows/amd64 llama-cpp backend) by @LionelColaso in https://github.com/mudler/LocalAI/pull/11429\r\n* fix(downloader): keep the old model file until the new one is verified by @mudler-agent in https://github.com/mudler/LocalAI/pull/13308\r\n* chore: :arrow_up: Update ggml-org/llama.cpp to `78e05298f0d68abff41d08d79fa7469264b2aff0` by @localai-update-bot[bot] in https://github.com/mudler/LocalAI/pull/13284\r\n* fix(studio): keep the sender's grant in the wake-up turn of a wait by @mudler-agent in https://github.com/mudler/LocalAI/pull/13314\r\n* feat(studio): simplify the loop settings by @mudler-agent in https://github.com/mudler/LocalAI/pull/13315\r\n* fix(rocm): point *_TENSILE_LIBPATH at the folder of the installed GPU by @walcz-de in https://github.com/mudler/LocalAI/pull/13321\r\n* feat(privacy-filter): build a ROCm (hipblas) image by @walcz-de in https://github.com/mudler/LocalAI/pull/13316\r\n* fix(addons): follow the GitHub release redirect of the add-on index by @mudler-agent in https://github.com/mudler/LocalAI/pull/13341\r\n* fix(tables): build the add-on without cgo for musl hosts by @mudler-agent in https://github.com/mudler/LocalAI/pull/13343\r\n* feat(launcher): start the x64 AppImage on hosts without glibc by @mudler-agent in https://github.com/mudler/LocalAI/pull/13340\r\n\r\n## New Contributors\r\n* @AnythingLinux made their first contribution in https://github.com/mudler/LocalAI/pull/13304\r\n* @LionelColaso made their first contribution in https://github.com/mudler/LocalAI/pull/11429\r\n\r\n**Full Changelog**: https://github.com/mudler/LocalAI/compare/v5.0.0...v5.0.1","mentions_count":4}
