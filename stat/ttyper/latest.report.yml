rgument [#120](https://github.com/max-niederman/ttyper/pull/120) ([Max Niederman](https://github.com/max-niederman/ttyper/commit/ad237e1c681440377147f8ef933dd2c63f59241e))\n- **languages**: Add galician [#125](https://github.com/max-niederman/ttyper/pull/125) ([manuelpardopose](https://github.com/max-niederman/ttyper/commit/a67b9f9210547868a4d118c9cbf29b5123789270))\n\n## Documentation\n- add discord server to readme and update badges ([Max Niederman](https://github.com/max-niederman/ttyper/commit/83f4d1f919f9e43ce71f8352d58a1474c15d02fb))\n- **readme**: specify that rounded is the default border type [#136](https://github.com/max-niederman/ttyper/pull/136) ([Max Niederman](https://github.com/max-niederman/ttyper/commit/412119788939cde42e1356f1a5ba40329de2f0bc))\n\n## Code Refactoring\n- **cli**: migrate from structopt to clap-derive [#120](https://github.com/max-niederman/ttyper/pull/120) ([Marcin Puc](https://github.com/max-niederman/ttyper/commit/24aa18bf3b9ab97c88ffcd79db6ce661ffe51d26))\n\n## Commits\n- wordlists of portuguese with 200, 1000 lines and advanced\u2026 (#119) [#119](https://github.com/max-niederman/ttyper/pull/119) ([Mohan Elias](https://github.com/max-niederman/ttyper/commit/333b12388ec883525b2f1a4602113f56d0319273))\n- 4987fa8: Bumps libc from 0.2.153 to 0.2.155 (yzewei) [#128](https://github.com/max-niederman/ttyper/pull/128)\n- 8627ad9: Create FUNDING.yml (Max Niederman)\n- 1efd8ae: Added border type functionality inside the 'config.toml' file. (Gabriel Marin) [#136](https://github.com/max-niederman/ttyper/pull/136)\n- 00ca3ae: 1.6.0 (Max Niederman)","reactions":{"total_count":7,"+1":0,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":0,"rocket":0,"eyes":0}}
