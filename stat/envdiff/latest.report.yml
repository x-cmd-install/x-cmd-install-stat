T01:29:39Z","updated_at":"2026-04-13T01:29:39Z"}],"body":"### \ud83d\ude80 Major Evolution: Dynamic Validation Framework\n\nThis release transforms **envdiff** from a static environment scanner into a flexible, extensible validation framework. Whether you are a developer managing project dependencies or an IT Admin auditing a fleet of machines, v0.2.0 provides the tools to define and enforce your 'Golden Standard.'\n\n#### \u2728 Key Features\n\n- **Config-driven Probing**:  now intelligently probes only the runtimes and packages defined in your config. This eliminates noise and ensures validation is focused on your specific requirements.\n- **Custom Runtime Definitions**: Add support for any CLI-based tool in seconds. Define custom command-line probes, arguments, and version regex directly in your .\n- **OS Package Collector**: First-class support for system-level dependencies. Capture and validate packages from **Homebrew (macOS)**, **Apt (Ubuntu/Debian)**, and **Dnf/Yum (RHEL/CentOS)**.\n- **Dynamic Collector Registry**: A refactored internal architecture that allows for easy extension and modular data gathering.\n- **Universal Rendering**: Enhanced CLI and Markdown output formats now include detailed system package sections.\n\n#### \ud83d\udcdd Documentation Updates\n- Overhauled **Architecture** and **README** to highlight 'Machine Standards' and 'Golden Image' use cases.\n- New default  baseline included in the repository.\n\n#### \ud83d\udd27 Internal Improvements\n- Increased UI column widths for better display of descriptive package names (e.g., ).\n- Improved parallel detection logic for faster snapshots.\n\n---\n**'It works on my machine' \u2192 'Show me exactly why.'**"}
