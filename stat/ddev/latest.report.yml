@rfay in https://github.com/ddev/ddev/pull/9098\r\n* ci: pin crun 1.30.1 for podman-rootless tests, for containers/crun#2466 by @rfay in https://github.com/ddev/ddev/pull/9111\r\n* ci(apple-container): add socktainer Buildkite test and perf legs, for #7372 by @rfay in https://github.com/ddev/ddev/pull/9115\r\n* fix: write project router ports that match the default or global value by @rfay in https://github.com/ddev/ddev/pull/9101\r\n* refactor: use DDEV helpers instead of raw OS, env, file, and PATH checks by @rfay in https://github.com/ddev/ddev/pull/9107\r\n* ci(perf): skip socktainer perf leg until ddev supports it, for #7372 [skip ci] by @rfay in https://github.com/ddev/ddev/pull/9119\r\n* fix(mutagen): retry sync create and start flush after Mutagen races by @rfay in https://github.com/ddev/ddev/pull/9112\r\n* fix: capture output as written, and pull images as linux/arch (socktainer split-off) by @rfay in https://github.com/ddev/ddev/pull/9108\r\n* test: log file-sharing diagnostics on write timeout by @rfay in https://github.com/ddev/ddev/pull/9123\r\n* ci: clear cask quarantine after testbot brew upgrade [skip buildkite] by @rfay in https://github.com/ddev/ddev/pull/9125\r\n* ci(buildkite): select macOS provider with DOCKER_CONTEXT, keep providers running by @rfay in https://github.com/ddev/ddev/pull/9114\r\n* fix(xhgui): reach php-fpm on 127.0.0.1, not by service name by @rfay in https://github.com/ddev/ddev/pull/9121\r\n* feat: pass the host's `CI` variable into the web container, fixes ddev/github-action-setup-ddev#61 by @rfay in https://github.com/ddev/ddev/pull/9124\r\n* ci: report which Buildkite startup step failed, with docker diagnostics by @rfay in https://github.com/ddev/ddev/pull/9136\r\n* fix(webserver): make deny rules cover PHP files and dotfiles by @rfay in https://github.com/ddev/ddev/pull/9128\r\n* chore(claude): set up the ddev agent-skills plugin from project settings by @rfay in https://github.com/ddev/ddev/pull/9135\r\n* test: pin drush