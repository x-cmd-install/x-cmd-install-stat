.4.zip","label":"","uploader":{"login":"rfay","id":112444,"node_id":"MDQ6VXNlcjExMjQ0NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":17521013,"digest":"sha256:ddfe08b3d3af8357de7374fbb2147f864f51b1e5ea3db1504a18d3bb070b72d1","download_count":15,"created_at":"2026-09-02T14:00:21Z","updated_at":"2026-09-02T14:00:23Z"},{"id":541256718,"node_id":"RA_kwDOBM7rWM4gQuwO","name":"ddev_windows_amd64_installer.v1.25.4.exe","label":"","uploader":{"login":"rfay","id":112444,"node_id":"MDQ6VXNlcjExMjQ0NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":38131440,"digest":"sha256:a0bca7d8f97612d2aafaa627ff941aa3eb427d4d6014f0395cc01ac612abe9ae","download_count":994,"created_at":"2026-09-02T14:00:22Z","updated_at":"2026-09-02T14:00:24Z"},{"id":541256736,"node_id":"RA_kwDOBM7rWM4gQuwg","name":"ddev_windows_arm64_installer.v1.25.4.exe","label":"","uploader":{"login":"rfay","id":112444,"node_id":"MDQ6VXNlcjExMjQ0NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":34413688,"digest":"sha256:5793174b1c8d6b0cde4e372f245071890bb9dab1fd8c5f979b8fa1727a3b23b4","download_count":55,"created_at":"2026-09-02T14:00:23Z","updated_at":"2026-09-02T14:00:25Z"}],"body":"## Installation\r\n\r\nSee the [installation instructions](https://docs.ddev.com/en/stable/users/install/ddev-installation/) for details, but it's easy:\r\n\r\n- macOS: `brew install ddev/ddev/ddev` or just `brew upgrade ddev`.\r\n- Linux: Use `sudo apt-get update && sudo apt-get install ddev`, see [apt/yum installation](https://docs.ddev.com/en/stable/users/install/ddev-installation/#linux)\r\n  \u26a0\ufe0f **Linux apt/yum users**: packages are now served from Cloudsmith (`packages.ddev.com`). Your existing Gemfury (`pkg.ddev.com`) setup keeps working, but please re-run the [Linux installation steps](https://docs.ddev.com/en/stable/users/install/ddev-installation/#ddev-installation-linux) to switch over.\r\n- Windows and WSL2: Download the [Windows Installer](https://ddev.com/download/#wsl2-and-traditional-windows); you can run it for install or upgrade.\r\n  \u26a0\ufe0f **Traditional Windows users (not WSL2)**: If needed, the installer will prompt you to uninstall the previous system-wide installation to avoid conflicts with the new per-user installation.\r\n- Consider `ddev delete images` or `ddev delete images --all` after upgrading to free up disk space used by previous Docker image versions. This does no harm.\r\n- Consider `ddev config --auto` to update your projects to current configuration.\r\n\r\n## \u26a0\ufe0f Breaking Changes\r\n\r\n- If you maintain your own `.ddev/apache/apache-site.conf` or `.ddev/nginx_full/nginx-site.conf` by removing the `#ddev-generated` line, temporarily restore it, run `ddev restart` to regenerate the file, then compare the regenerated file with your version and merge any required changes.\r\n- `xdebug_enabled` is gone from `ddev describe -j`. It reported project config, not live Xdebug status, so use `ddev xdebug status` for that. This only affects a custom GUI or script that read the field, thanks to @jonesrussell\r\n- The minimum Go version for building DDEV is now Go 1.27, up from 1.26.3. This only affects downstream source builds, not prebuilt binaries\r\n\r\n## Highlights\r\n\r\nBlog announcement: https://ddev.com/blog/release-v1-25-4/\r\n\r\n- **Database seeding and reset:** `ddev start --seed-snapshot=<name-or-path>` fills a new database from any snapshot, and `ddev start --reset-database` deletes the current database and starts fresh, see **Snapshots and Database Seeding** below\r\n- **MySQL 9.7 LTS support**, and MySQL 8.0/8.4 now build from [Docker Hardened Images](https://hub.docker.com/hardened-images/catalog/dhi/mysql/images) (`dhi.io/mysql`) instead of `bitnamilegacy/mysql`, which gets no updates\r\n- **Env files:** `.env.local` for values you don't want in Git, several files per service separated by a label, and global files that apply to every project, see [Environment Variables](https://docs.ddev.com/en/stable/users/configuration/environment-variables/)\r\n- **Set things once for every project:** global Dockerfiles in `~/.ddev/web-build/` and `~/.ddev/db-build/`, and global env files in `~/.ddev/.env*`, see **Global Configuration** below\r\n- **apt/rpm packages are now published to Cloudsmith** (`packages.ddev.com`) as well as Gemfury, and the yum repo now verifies package signatures, which the Gemfury one never did. Gemfury (`pkg.ddev.com`) is still supported but will be retired eventually; see the Linux note above to switch over\r\n\r\n## Snapshots and Database Seeding\r\n\r\n- A snapshot named `seed` is automatically loaded when you start a project with an empty database. So if you delete your db or project and then `ddev start`, you'll have the database from the `seed` snapshot.\r\n- [`ddev start --seed-snapshot`](https://docs.ddev.com/en/stable/users/usage/database-management/#seeding-a-fresh-database-from-a-snapshot) fills a new database from a snapshot in `.ddev/db_snapshots`, or from a path to one anywhere else on your machine. A snapshot outside the project is read where it is instead of being copied, so a multi-GB file is not duplicated. A snapshot named `seed` is used automatically, with no flag. Works for MariaDB, MySQL, and PostgreSQL\r\n- [`ddev start --reset-database`](https://docs.ddev.com/en/stable/users/usage/database-management/#starting-over-with-a-new-database) deletes the database and starts fresh. It takes a snapshot first, using the database version that created the data, so this also works when you already changed `database:` in your config. `ddev config --database=` now warns instead of failing, and `ddev delete` no longer refuses to work on a project whose data came from a different database server\r\n- `ddev snapshot restore --force` restores a snapshot made by a different version of the same database server\r\n- `ddev snapshot --list` shows each snapshot's size and database version\r\n- `ddev snapshot restore` and `ddev snapshot --list` also see snapshots from other Git worktrees of the same repository, so a database doesn't have to be copied between worktrees by hand\r\n- Snapshots and the database seed can skip compression with `--uncompressed`: more disk space, faster restore. The `base_db` seed also reads zstd now, not only gzip, which is much faster for a custom `dbimage` with a large database built into it, thanks to @weitzman\r\n\r\n## Global Configuration\r\n\r\nThese apply to every project on your machine, so you set them once instead of in each project.\r\n\r\n- New [global Dockerfiles](https://docs.ddev.com/en/stable/users/extend/customizing-images/#global-dockerfiles) in `~/.ddev/web-build/` and `~/.ddev/db-build/` add the same image changes to every project - CA certificates, system tools, extra apt packages. If a project has a file with the same name in its own `.ddev/web-build/`, the project file is used, thanks to @rmott-littler\r\n- New [global env files](https://docs.ddev.com/en/stable/users/configuration/environment-variables/#global-env-files) `~/.ddev/.env` and `~/.ddev/.env.<service>` set variables for every project. This is the only way to set a variable globally for a container other than `web`, since `web_environment` only reaches `web`. If a project sets the same variable, the project value is used. Write these files with [`ddev dotenv global set`](https://docs.ddev.com/en/stable/users/usage/commands/#dotenv-global-set)\r\n- Add-on install actions now see `.ddev/.env` and the global `~/.ddev/.env*` files, not only `.ddev/.env.<addon>`. If you set a `DDEV_*` variable in `.ddev/.env`, that value is used there. A `.ddev/.env.<service>.<label>` file is also passed into that service's container now; before, it was only used to fill in variables in your docker-compose files\r\n\r\n## Features\r\n\r\n- **Two new project types:** [MODX Revolution](https://docs.ddev.com/en/stable/users/quickstart/#modx-revolution) 2.x/3.x, thanks to @casparml, and [Maho](https://docs.ddev.com/en/stable/users/quickstart/#maho), thanks to @fballiano\r\n- Shopware 6 projects get `shopware-cli` in the web image, plus `ddev admin-watch` and `ddev storefront-watch` with the ports they need, so the [ddev-shopware-cli](https://github.com/vanWittlaer/ddev-shopware-cli) add-on isn't needed, thanks to @vanWittlaer\r\n- New [`ddev add-on update`](https://docs.ddev.com/en/stable/users/usage/commands/#add-on-update) checks installed add-ons against their latest GitHub release and updates the outdated ones, with `--dry-run` to see what would change\r\n- New [`ddev utility download-ddev`](https://docs.ddev.com/en/stable/users/usage/commands/#utility-download-ddev) fetches the `ddev` and `ddev-hostname` binaries for a PR, branch, commit, release tag, latest stable, or `main` HEAD, without touching your installed DDEV\r\n- New [`ddev utility delete-volume`](https://docs.ddev.com/en/stable/users/usage/commands/#utility-delete-volume) removes one of the project's Docker volumes by name or from an interactive list, for add-ons like ddev-solr that create their own\r\n- [`ddev launch --print-url`](https://docs.ddev.com/en/stable/users/usage/commands/#launch) and `DDEV_LAUNCH_PRINT_URL=true ddev launch` print the URL instead of opening a browser, for SSH, containers, and CI, thanks to @steffenmaechtel\r\n- New [`ddev tablepro`](https://docs.ddev.com/en/stable/users/usage/commands/#tablepro) host command for the TablePro database client on macOS, thanks to @datlechin\r\n- New [`nodejs_root`](https://docs.ddev.com/en/stable/users/configuration/config/#nodejs_root) lets `nodejs_version: auto`/`engine` read the version file from a subdirectory such as `web/themes/custom/mytheme`. Both now require that file to exist; before, if it was missing, DDEV installed its default version without telling you, thanks to @dpacassi\r\n- The [`dbimage`](https://docs.ddev.com/en/stable/users/configuration/config/#dbimage) config option works again after a long absence, mirroring `webimage`, along with `ddev config --db-image`/`--db-image-default`\r\n- If you pin a custom `webimage` or `dbimage`, `ddev start` warns you when that image was built from an older DDEV image than this version expects, instead of failing later in a way that gives no hint why. Official images now record the DDEV version they were built for, so the warning starts working after you rebuild your own image, thanks to @weitzman\r\n- `ddev ssh` and `ddev exec` pass your `TERM` and `COLORTERM` into interactive sessions, so you get more than 16 colors, thanks to @wazum\r\n- `ddev start` warns when DDEV itself is an unreleased build from a PR or a local branch, and `ddev version` shows where it came from\r\n- Drupal `settings.ddev.php` configures `symfony_mailer_lite` the way it already configured `symfony_mailer`, thanks to @mxr576\r\n- The [FAQ](https://docs.ddev.com/en/stable/users/usage/faq/#homebrew) explains how to move from Homebrew to a specific DDEV version, thanks to @joachim-n\r\n\r\n## Bug Fixes for Regressions from v1.25.3\r\n\r\n- Project image builds are fast again. Permissions on the Node.js directory were being changed recursively on every build, and now they are set once when the image is built\r\n- Add-ons and apps that write log files straight into `/var/log` can do that again, after the directory was locked down to root only\r\n- A site that generates `/robots.txt` itself works again, including Drupal's RobotsTxt module. An nginx rule was answering `/robots.txt` before your site could, and it is now removed\r\n- Projects that pin the web service to a specific platform, like `platform: linux/amd64` on an Apple Silicon Mac, start again\r\n- Orphan containers get removed again, so Docker Compose stops warning about them\r\n\r\n## Bug Fixes\r\n\r\n- `ddev wp` uses the path from your project's own `wp-cli.yml` again, and only falls back to the docroot when that file doesn't set one, which is what the docs always said. Since v1.24.5 it always added `--path=$DDEV_DOCROOT`, which broke Bedrock and any layout where WordPress isn't in the docroot\r\n- Running `ddev` in a subdirectory that has its own `.ddev/config.yaml`, like a Drupal contrib module or a Git submodule, keeps using the outer project and tells you which one it chose. Before, it switched to the nested project silently, and the outer project's custom commands stopped working. `ddev start` there asks whether you want the nested project\r\n- DDEV stops writing database connection settings into your CMS config when there's no db container or you configured a different database. That fixes TYPO3 projects using `omit_containers: [db]`, which failed to install with `getaddrinfo for db failed`, and a TYPO3 SQLite setup that got switched back to MySQL on every restart. thanks to @staatzstreich for the diagnosis and the original fix, made general here so Drupal and Backdrop get it too\r\n- `ddev pull acquia` handles long application names, where the Acquia CLI breaks the database filename across several lines, thanks to @danepowell\r\n- Your `pre-`/`post-import-db` and `pre-`/`post-import-files` hooks now run when a provider does its own importing with `db_import_command`/`files_import_command`, and those pulls no longer print a \"skipping database pull\" warning that wasn't true\r\n- When port 80 or 443 is already taken and DDEV uses a different port instead, `ddev-router` remembers that. Before, after the program using that port stopped, starting another project rebuilt the router for no reason\r\n- Drupal 10, 11, and 12 projects handle a page with unusually large HTTP headers instead of failing with a 502 error. Drupal test runs hit this, since they report deprecation notices in the response headers, thanks to @phenaproxima\r\n- The bundled `settings.php` for the `drupal11` and `drupal12` project types is refreshed from upstream, and drupal11's `settings.ddev.php` gets the garbage-collection threshold that drupal12 already had, thanks to @rpkoller\r\n\r\n## Security Changes\r\n\r\n- A malicious archive can no longer create an absolute symlink that a later file in the same archive follows, to write files outside the folder being extracted - your shell startup files, for example. This was reachable through `ddev add-on get` and `ddev import-db`/`import-files`, and it completes the fix for CVE-2026-32885. thanks to @arpitjain099 for the report, see [GHSA-9hq4-hm3j-jmph](https://github.com/ddev/ddev/security/advisories/GHSA-9hq4-hm3j-jmph)\r\n- A `docroot` or `upload_dirs` value in `.ddev/config.yaml`, or a path you pass to `ddev dotenv`, now gives a clear error when it points outside the project, instead of DDEV silently reading and writing files there\r\n\r\n## Internal Changes\r\n\r\n- Snapshots and the internal snapshot used at startup are now compressed with `zstd` by default, for faster, smaller snapshots. Thanks to @weitzman.\r\n- `ddev-webserver` explains the 403s and 404s it generates itself instead of serving a bare error page, since those usually mean a wrong `docroot` or a project that isn't installed yet, and `ddev-router` does the same for a hostname that matches no project. A 403 or 404 from your own application is passed through unchanged. This replaces the \"docroot may be wrong\" warning on `ddev start`, which you couldn't see in a browser and which warned wrongly when `.htaccess` rewrites into a subdirectory\r\n- `ddev-php-base` is consolidated into `ddev-webserver` as local build stages, so a new base image no longer has to be pushed to Docker Hub before `ddev-webserver` can reference it. `ddev/ddev-php-base` and `ddev/ddev-php-prod` are no longer published and stay at their last-pushed tag; the `ddev-webserver` image itself behaves the same\r\n- Per-project certificates no longer carry a shared `*.<TLD>` wildcard SAN, which Traefik 3.7.6+ would use to serve one project's certificate for every hostname on a shared custom TLD. v1.25.3 shipped Traefik 3.6.13, which isn't affected. The obsolete `*.ddev.local` SAN is also gone from the global default certificate\r\n- Under rootless Docker or Podman, the host's `usr.sbin.mysqld` AppArmor profile attaches to the container's mysqld and left it unable to read `/etc/my.cnf`. That profile is loaded on any Linux machine with `mysql-server` installed, and the new `dhi.io/mysql` base puts mysqld at the path it matches. MySQL 8.0, 8.4, and 9.7 now load their config with an explicit `--defaults-file` instead \r\n- A nightly performance benchmark harness feeding a [performance history](https://ddev.github.io/ddev/perf/) dashboard, plus [CI test runtime](https://ddev.github.io/ddev/perf/ci/) tracking per test type across GitHub Actions and Buildkite\r\n- Rootless Podman CI setup reworked, `podman-root` CI dropped\r\n- `DDEV_DOCKER_ORG` points a binary at a different Docker Hub organization, so a release built outside `ddev/ddev` can be pull-tested end to end\r\n- `last_started_version` is recorded by every command that starts containers, not only `ddev start`/`ddev restart`, so you stop being asked for a `ddev poweroff` that isn't needed. `ddev start -y` records it too\r\n- Three fixes toward Apple Container and socktainer support ([#7372](https://github.com/ddev/ddev/issues/7372)): bound host ports fall back to `NetworkSettings.Ports` when `HostConfig.PortBindings` comes back empty, a running project's database version is read by exec instead of a second mount of an already-attached volume, and `ddev start` survives a `chown` failure on `/mnt/ddev-global-cache` where the filesystem rejects it even though ownership is already correct\r\n\r\n## Minor Updates\r\n\r\n- PHP 8.5.9, 8.4.24, 8.3.33, and 8.2.33\r\n- Composer 2.10.3, Node.js 24.20.0, npm 11.19.0\r\n- MariaDB client 11.8.9; bundled MySQL clients 9.7 (new), 8.4.10, and 8.0.46\r\n\r\n## What's Changed\r\n* test(shopware): remove pin for Twig, for #8557 (#8568) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8568\r\n* test(php): remove skip for php8.5-solr, for #7697 (#8569) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8569\r\n* ci(linkspector): remove skip for 429 error, for #7270 (#8570) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8570\r\n* chore: remove unused \"default\" provider (#8571) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8571\r\n* fix(mysql): build mysql 8.0/8.4 from Docker Hardened Images, fixes #7962 by @rfay in https://github.com/ddev/ddev/pull/8535\r\n* fix(mysql): bump webserver mysql client to 8.0.46/8.4.10 by @rfay in https://github.com/ddev/ddev/pull/8576\r\n* ci(github): update dependabot.yml (#8565) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8565\r\n* docs(commands): add precision about `launch` which start project, fixes #8583 by @MrYamous in https://github.com/ddev/ddev/pull/8585\r\n* fix(router): stop sharing wildcard SANs across per-project certs, fixes #8562 by @stasadev in https://github.com/ddev/ddev/pull/8563\r\n* fix(router): remove obsolete *.ddev.local from generated certs, fixes #8586 by @rfay in https://github.com/ddev/ddev/pull/8589\r\n* docs(diagnostics): document all opt-in instrumentation events (#8592) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8592\r\n* feat(commands): add `ddev tablepro` global host command by @datlechin in https://github.com/ddev/ddev/pull/8580\r\n* fix(build): honor service platform override when building images, fixes #8578 by @rfay in https://github.com/ddev/ddev/pull/8579\r\n* feat(router): serve informative message for unmatched routes, fixes #8587 by @rfay in https://github.com/ddev/ddev/pull/8591\r\n* chore: Updates to the settings.php for the drupal11 and drupal12 project types by @rpkoller in https://github.com/ddev/ddev/pull/8581\r\n* docs(quickstart): update Shopware 6 references to up-to-date information by @vanWittlaer in https://github.com/ddev/ddev/pull/8593\r\n* fix(buildkite): run orb start/stop synchronously so orbstack reliably ends up running (#8605) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8605\r\n* feat(webserver): explain webserver-level 404s, fixes #8588 by @rfay in https://github.com/ddev/ddev/pull/8590\r\n* chore: replace github.com/sponsors/ddev with ddev.com/sponsor by @stasadev in https://github.com/ddev/ddev/pull/8615\r\n* docs: expand CLAUDE.md language rules to curb AI-nonsense words and ego-stroking [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8619\r\n* docs(quickstart): work around Drush/Guzzle 8 conflict in Drupal 12 install (#8618) [skip buildkite] by @rfay in https://github.com/ddev/ddev/pull/8618\r\n* docs(shopware): fix quickstart for php-http/discovery no longer prompting by @rfay in https://github.com/ddev/ddev/pull/8620\r\n* docs(quickstart): revert Drush/Guzzle 8 workaround for Drupal 12 by @rfay in https://github.com/ddev/ddev/pull/8621\r\n* docs: add details on changing from Homebrew to a specific version (#8459) [skip ci] by @joachim-n in https://github.com/ddev/ddev/pull/8459\r\n* feat: add support for global Dockerfiles, fixes #8406 (#8405) [skip ci] by @rmott-littler in https://github.com/ddev/ddev/pull/8405\r\n* fix(nodejs): stop recursively chgrp/chmod'ing /usr/local/n on every project build, fixes #8600 by @rfay in https://github.com/ddev/ddev/pull/8603\r\n* test(silverstripe): update fixture to test-silverstripe 6.2.2 (#8626) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8626\r\n* fix(describe): omit xdebug_enabled from describe output, fixes #8159 (#8360) [skip ci] by @jonesrussell in https://github.com/ddev/ddev/pull/8360\r\n* fix: don't write CMS db connection settings when db container is omitted or another driver is configured, for #8582 (#8594) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8594\r\n* feat(maho): add Maho project type by @fballiano in https://github.com/ddev/ddev/pull/8606\r\n* docs(quickstart): pin quickstart to Symfony LTS, fixes symfony.bats failures [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8628\r\n* fix: reject symlinks with rooted/absolute targets in Untar, for #8213 (#8625) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8625\r\n* perf(router): update network aliases in place instead of recreating on start, for #8132 (#8561) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/8561\r\n* build(docker): consolidate ddev-php-base into ddev-webserver, fixes #8012 by @rfay in https://github.com/ddev/ddev/pull/8604\r\n* ci(podman): force k8s-file log driver to avoid conmon journald crash (#8630) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8630\r\n* ci(podman): force nftables firewall backend to avoid intermittent netavark failure [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8633\r\n* test(macos-docker-desktop): skip tests hitting a Docker Desktop connection reset by @rfay in https://github.com/ddev/ddev/pull/8627\r\n* feat: add MySQL 9.7 LTS support, fixes #8514 by @rfay in https://github.com/ddev/ddev/pull/8629\r\n* feat(config): re-implement dbimage config option, mirroring webimage by @rfay in https://github.com/ddev/ddev/pull/8610\r\n* test(router): make TestUseEphemeralPort resilient to host port races, fixes #8293 (#8638) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8638\r\n* fix(settings): close file handles in TYPO3/Drupal settings writers (Traditional Windows test failures), for #8582 (#8632) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8632\r\n* fix(webserver): tolerate a stale non-FIFO /var/tmp/logpipe on container start (#8635) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/8635\r\n* fix(compose): remove BuildKit snapshot race retry logic, for #8136 by @rfay in https://github.com/ddev/ddev/pull/8637\r\n* fix(docker): quiet per-layer image pull progress in non-interactive outpu