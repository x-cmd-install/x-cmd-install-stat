abel":"","uploader":{"login":"rfay","id":112444,"node_id":"MDQ6VXNlcjExMjQ0NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":18253463,"digest":"sha256:1140e7baff4cac84381fde17839a6b2fa974cc5e7b626b539044b43a113854a7","download_count":7,"created_at":"2026-11-20T20:15:10Z","updated_at":"2026-11-20T20:15:12Z"},{"id":773196091,"node_id":"RA_kwDOBM7rWM4uFgk7","name":"ddev_windows_amd64_installer.v1.25.6.exe","label":"","uploader":{"login":"rfay","id":112444,"node_id":"MDQ6VXNlcjExMjQ0NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":39783544,"digest":"sha256:8a86da9a8beaca0e741c64c353992601a8cc0d53ab650e307f54eb403c58315d","download_count":315,"created_at":"2026-11-20T20:15:12Z","updated_at":"2026-11-20T20:15:14Z"},{"id":773196127,"node_id":"RA_kwDOBM7rWM4uFglf","name":"ddev_windows_arm64_installer.v1.25.6.exe","label":"","uploader":{"login":"rfay","id":112444,"node_id":"MDQ6VXNlcjExMjQ0NA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":35935384,"digest":"sha256:94375460d39160d765bb5f623f7426460887031224cc6814cff491a11e7d795c","download_count":30,"created_at":"2026-11-20T20:15:12Z","updated_at":"2026-11-20T20:15:14Z"}],"body":"## Installation\r\n\r\nSee the [installation instructions](https://docs.ddev.com/en/stable/users/install/ddev-installation/) for details, but it's easy:\r\n\r\n- macOS: `brew install ddev/ddev/ddev` or just `brew upgrade ddev`.\r\n- Linux: Use `sudo apt-get update && sudo apt-get install ddev`, see [apt/yum installation](https://docs.ddev.com/en/stable/users/install/ddev-installation/#linux)\r\n- Windows and WSL2: Download the [Windows Installer](https://ddev.com/download/); you can run it for install or upgrade.\r\n- Consider `ddev delete images` or `ddev delete images --all` after upgrading to free up disk space used by previous Docker image versions. This does no harm.\r\n- Consider `ddev config --auto` to update your projects to current configuration.\r\n\r\n## Highlights\r\n\r\nBlog announcement: https://ddev.com/blog/release-v1-25-6/\r\n\r\n- **[PHP 8.6.0](https://docs.ddev.com/en/stable/users/configuration/config/#php_version)**, the final release, replacing 8.6.0 RC3. apcu, imagick, memcached, redis, uploadprogress, xdebug, xhprof, xmlrpc, and yaml are not available for 8.6 yet\r\n- **PHP security releases** 8.5.13, 8.4.28, 8.3.37, and 8.2.36, see below\r\n\r\n## PHP Security Fixes\r\n\r\n- PHP 8.5.13, 8.4.28, 8.3.37, and 8.2.36 fix the [17 advisories](https://github.com/php/php-src/security/advisories) published on November 19. deb.sury.org backported the same fixes to PHP 5.6 through 8.1, keeping their version numbers. DDEV installs them when it builds the project's web image\r\n- None looks urgent for a default DDEV project. DDEV's settings already block two of the critical ones (`session.upload_progress.enabled = 0` and `zend.exception_ignore_args = On`), and its setup avoids the PHP-FPM ones. A custom config, like a file-based `error_log` or `fastcgi_keep_conn on`, can open some of them again\r\n- For future PHP releases, the tip in [`php_version`](https://docs.ddev.com/en/stable/users/configuration/config/#php_version) shows how to get a patch release before DDEV ships it\r\n\r\n## ⚠️ Breaking Changes\r\n\r\n- `web` and `db` no longer mount the shared `ddev-global-cache` volume. Add-ons that write to `/mnt/ddev-global-cache` from `web`, like ddev-nvm and ddev-pnpm, lose that data on restart until they mount it themselves, see [The `ddev-global-cache` Volume](https://docs.ddev.com/en/stable/users/usage/architecture/#the-ddev-global-cache-volume)\r\n- Each project has its own [cache volumes](https://docs.ddev.com/en/stable/users/usage/architecture/#project-cache-volumes). After upgrading, bash and MySQL history start empty, and the first Composer or npm install downloads everything again\r\n- nginx now denies what the CMS's `.htaccess` denies on Apache, such as Drupal `*.yml` and `*.twig` files, and Apache denies dotfiles. If you removed `#ddev-generated` from [`.ddev/nginx_full/nginx-site.conf`](https://docs.ddev.com/en/stable/users/extend/customization-extendibility/#custom-nginx-configuration) or [`.ddev/apache/apache-site.conf`](https://docs.ddev.com/en/stable/users/extend/customization-extendibility/#custom-apache-configuration), merge the changes from the new template\r\n- The table output of `ddev list`, `ddev describe`, and `ddev snapshot --list` changed. Scripts should use `-j`\r\n- Scripts that pipe answers into bare `ddev config` need a leading `no` line\r\n\r\n## Features\r\n\r\n- Interactive [`ddev config`](https://docs.ddev.com/en/stable/users/usage/commands/#config) shows the detected configuration in a form, where you can change the PHP version, database, and webserver before accepting it\r\n- [`ddev list`](https://docs.ddev.com/en/stable/users/usage/commands/#list), [`ddev describe`](https://docs.ddev.com/en/stable/users/usage/commands/#describe), and [`ddev snapshot --list`](https://docs.ddev.com/en/stable/users/usage/commands/#snapshot) fit the terminal width and match [`ddev tui`](https://docs.ddev.com/en/stable/users/usage/commands/#tui)\r\n- `CI` from the host is [passed into the `web` container](https://docs.ddev.com/en/stable/users/configuration/environment-variables/#ci-from-the-host)\r\n- The [Wagtail quickstart](https://docs.ddev.com/en/stable/users/quickstart/#wagtail) builds its virtual environment in the web image, see [Python Packages from `requirements.txt`](https://docs.ddev.com/en/stable/users/extend/customizing-images/#python-packages-from-requirementstxt)\r\n- `ddev start` warns when Docker Desktop on macOS resets connections to router ports\r\n\r\n## Bug Fixes for Regressions\r\n\r\n- Usage data is sent again when you [opted in](https://docs.ddev.com/en/stable/users/usage/diagnostics/). v1.25.5 sent nothing\r\n- Lines typed after a command that reads the terminal, like the Craft CMS setup wizard, are no longer dropped. This broke in v1.25.3\r\n\r\n## Bug Fixes\r\n\r\n- Global commands no longer go missing or come from another global config directory\r\n- A restarted `web` or `xhgui` container no longer takes about 60 seconds to become healthy\r\n- Commands that run at the same time no longer drop each other's projects from `project_list.yaml`, and `omit_project_name_by_default` no longer registers a project with an empty name\r\n- [Custom command](https://docs.ddev.com/en/stable/users/extend/custom-commands/) files keep their group-write bit and ACLs, thanks to @steffenmaechtel\r\n- A renamed project no longer causes \"Router configuration errors\"\r\n- On Windows, `ddev pull` no longer fails with `Unknown command '\\U'`, and WordPress and Backdrop no longer get a `.gitignore` in the project root\r\n- A substitute port used because the configured one was busy is no longer written into `.ddev/config.yaml`, and neither is a port from the global configuration\r\n- Let's Encrypt no longer stops silently when `acme.json` permissions change\r\n- XHGui imports profiles up to 100MB, not 5MB\r\n- Ctrl-C no longer leaves temporary containers behind when Docker is slow\r\n- `ddev start` with Mutagen retries after two intermittent Mutagen races\r\n- `ddev composer create-project` no longer hangs on an open stdin pipe, no longer shows stray `tate=working:app=composer` text with Composer 2.11, and passes piped answers to Composer scripts in order\r\n- With Podman and Mutagen, the image's default `index.html` is no longer synced into new projects\r\n\r\n## Security Changes\r\n\r\n- A crafted archive in `ddev add-on get`, `ddev import-db`, or `ddev import-files` can no longer write outside the destination through relative symlinks, see [GHSA-vxj4-5gfg-97c2](https://github.com/ddev/ddev/security/advisories/GHSA-vxj4-5gfg-97c2)\r\n- nginx deny rules now come before the PHP location, so PHP files in denied directories (TYPO3 `vendor`, CodeIgniter `system`, hidden directories) no longer run, thanks to @Atesca\r\n- The `ddev-xhgui` image gets current Alpine packages instead of PHP 8.3.23 and nginx 1.28.0 from July 2025\r\n\r\n## Internal Changes\r\n\r\n- Work toward Apple Container support ([#7372](https://github.com/ddev/ddev/issues/7372), [#8895](https://github.com/ddev/ddev/issues/8895)): no DDEV volume is mounted read-write by two containers\r\n- [Opt-in usage data](https://docs.ddev.com/en/stable/users/usage/diagnostics/) is sent as weekly summaries instead of an event for every command. Nothing is sent unless you opted in\r\n\r\n## Minor Updates\r\n\r\n- PHP 8.6.0, 8.5.13, 8.4.28, 8.3.37, and 8.2.36\r\n- PHP 8.6 uses PHP's default `fatal_error_backtraces` again\r\n- Docker Compose v5.8.0, recommended buildx 0.39.0\r\n- `--help` shows `[=true|false]` after boolean flags, and the error for an invalid flag value is worded differently (pflag v1.1.0)\r\n\r\n## What's Changed\r\n* ci(buildkite): use HEAD ddev in test.sh, clear stray host containers before installer tests, drop Chocolatey by @rfay in https://github.com/ddev/ddev/pull/9014\r\n* docs(quickstart): fix OpenMage Composer install by @stasadev in https://github.com/ddev/ddev/pull/9021\r\n* feat(wagtail): build venv from requirements.txt in web image by @stasadev in https://github.com/ddev/ddev/pull/9018\r\n* fix(dbserver): drop xtrabackup's libcurl4-openssl-dev dependency for MySQL 8.0/8.4/9.7, fixes #8925 by @rfay in https://github.com/ddev/ddev/pull/9023\r\n* fix: stop a stale healthy marker from delaying restarted web and xhgui containers by 59s (#9019) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/9019\r\n* feat(router): give the router its own ddev-router-traefik volume, for #8895, fixes #8975 by @rfay in https://github.com/ddev/ddev/pull/8945\r\n* fix: lock and reread project_list.yaml on every change, never register an empty project name, fixes #9004, fixes #9017 by @rfay in https://github.com/ddev/ddev/pull/9020\r\n* fix(xhgui): raise upload limits to 100M so large profiles import, fixes #9025 by @rfay in https://github.com/ddev/ddev/pull/9027\r\n* feat: give web and db their own project cache volumes, for #8895 by @rfay in https://github.com/ddev/ddev/pull/9024\r\n* chore(claude): replace the ddev-commit skill with /ddev:commit by @stasadev in https://github.com/ddev/ddev/pull/9030\r\n* fix(xhgui): upgrade Alpine packages so the image gets PHP and nginx security fixes by @rfay in https://github.com/ddev/ddev/pull/9028\r\n* fix(router): detect Docker Desktop connection resets on router ports after alias updates by @rfay in https://github.com/ddev/ddev/pull/9026\r\n* fix: copy global commands into each container instead of the shared volume, fixes #5806, for #8895 by @stasadev in https://github.com/ddev/ddev/pull/8956\r\n* fix: make custom commands executable without dropping group-write or ACLs, fixes #9031 by @steffenmaechtel in https://github.com/ddev/ddev/pull/9032\r\n* build(deps): bump owenthereal/action-upterm from 1 to 2 (#9033) [skip ci] by @dependabot[bot] in https://github.com/ddev/ddev/pull/9033\r\n* fix: use filepath.Base for the pulled database file name on Windows, fixes #8998 by @rfay in https://github.com/ddev/ddev/pull/9039\r\n* refactor: omit the project name in WriteConfig's copy, not in app.Name (#9029) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/9029\r\n* fix: mount ddev-config read-only in web and db with no_bind_mounts, for #8895 by @rfay in https://github.com/ddev/ddev/pull/9043\r\n* ci(buildkite): keep macOS testbot disk usage under control, prepare for socktainer by @rfay in https://github.com/ddev/ddev/pull/9037\r\n* ci: lint Go files for macOS and Windows too (#9050) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/9050\r\n* fix: clean up router files through the running router on stop, for #8895 (#9042) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/9042\r\n* fix: skip start-chown for volumes a running container holds, for #8895 (#9041) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/9041\r\n* fix(traefik): remove stale #ddev-generated config and certs after a project rename, fixes #9001 by @rfay in https://github.com/ddev/ddev/pull/9038\r\n* ci(buildkite): remove buildx refs dir instead of find -mtime, which timed out on Windows by @rfay in https://github.com/ddev/ddev/pull/9052\r\n* feat: copy the mkcert root CA into web at /usr/local/lib/ddev/mkcert instead of mounting ddev-global-cache, for #8895 by @rfay in https://github.com/ddev/ddev/pull/9045\r\n* fix: use filepath for Windows host paths and lint path misuse (#9051) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/9051\r\n* fix(docker): check image labels client-side before deleting images, for #7372 by @rfay in https://github.com/ddev/ddev/pull/9040\r\n* docs: add Tailscale remote access for test runners, keep Chrome Remote Desktop as fallback by @rfay in https://github.com/ddev/ddev/pull/9015\r\n* docs: allow php-http/discovery Composer plugin in Craft CMS quickstart by @rfay in https://github.com/ddev/ddev/pull/9057\r\n* test: fail when a named volume has more than one writer, for #8895 by @rfay in https://github.com/ddev/ddev/pull/9046\r\n* ci(buildkite): raise sanetestbot.sh timeout from 60s to 5m by @stasadev in https://github.com/ddev/ddev/pull/9058\r\n* chore(claude): let agents push to forks with approval, never to ddev/ddev, fixes #9022 by @rfay in https://github.com/ddev/ddev/pull/9054\r\n* ci(wsl2): time out the WSL2 install step after 15 minutes (#9059) [skip ci] by @stasadev in https://github.com/ddev/ddev/pull/9059\r\n* ci: limit disk use in container tests for smaller ubuntu-26.04 runners (#9062) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/9062\r\n* ci(perf): file issues for sustained nightly regressions, make perf-start-time a failing PR check (#9060) [skip ci] by @rfay in https://github.com/ddev/ddev/pull/9060\r\n* fix(webserver): empty /var/www/html in the image for all runtimes, replacing the Podman-only cleanup (fixes socktainer + Mutagen) by @rfay in https://github.com/ddev/ddev/pull/9061\r\n* ci(docs): ignore viget.com in linkspector, its 429 is a bot challenge by @rfay in https://github.com/ddev/ddev/pull/9066\r\n* ci: keep the nightly container-tests run from canceling a push run on main by @rfay in https://github.com/ddev/ddev/pull/9065\r\n* fix: remove stray escape-code text from `ddev composer create-project` by @stasadev in https://github.com/ddev/ddev/pull/9056\r\n* test: resume paused Upsun envs before site check by @rfay in https://github.com/ddev/ddev/pull/9067\r\n* ci(wsl2): time out WSL restart, add failure diagnostics by @stasadev in https://github.com/ddev/ddev/pull/9068\r\n* ci(images): simplify image tag cleanup to a release cutoff and batches by @stasadev in https://github.com/ddev/ddev/pull/9064\r\n* fix(amplitude): v1.25.5 sends no usage data even when opted in by @rfay in https://github.com/ddev/ddev/pull/9070\r\n* test(mutagen): ignore zombie daemons when checking Mutagen stopped by @rfay in https://github.com/ddev/ddev/pull/9081\r\n* ci(images): keep tag cleanup listing working after deletions, for #9064 by @stasadev in https://github.com/ddev/ddev/pull/9086\r\n* ci(images): show Docker Hub storage size in tag cleanup, for #9064 by @stasadev in https://github.com/ddev/ddev/pull/9087\r\n* fix: track temporary containers before creating them, so an interrupt can't leak one, for #8951 by @rfay in https://github.com/ddev/ddev/pull/9069\r\n* fix: keep global router ports out of config.yaml, fix three tests by @rfay in https://github.com/ddev/ddev/pull/9072\r\n* docs: remove php-http/discovery step from Craft CMS quickstart by @stasadev in https://github.com/ddev/ddev/pull/9088\r\n* fix: don't hang `ddev composer create-project` on open stdin by @stasadev in https://github.com/ddev/ddev/pull/