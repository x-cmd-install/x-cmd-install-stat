{"id":471210029,"node_id":"RA_kwDOADUBZ84cFhgt","name":"opam-full-2.5.2.tar.gz.sig","label":null,"uploader":{"login":"rjbou","id":37832926,"node_id":"MDQ6VXNlcjM3ODMyOTI2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:abf72865cbd6a71e84569a0f507ac0bbd5a53229e490baa3a5d915e2cfa8f248","download_count":9,"created_at":"2026-07-09T09:44:42Z","updated_at":"2026-07-09T09:44:42Z"}],"body":"This is the release of opam 2.5.2.\r\n\r\nBinaries and full archive are signed by the [opam dev team](https://opam.ocaml.org/opam-dev-pubkey.pgp) (fingerprint `92C5 26AE 50DF 3947 0EB2 911B ED4C F1CA 67CB AA92`).\r\nTo verify the authenticity of one of these files, run the following commands:\r\n```\r\ncurl -fsSLO https://opam.ocaml.org/opam-dev-pubkey.pgp\r\ngpg --import opam-dev-pubkey.pgp\r\ngpg --verify *.sig\r\n```\r\n\r\nPlease see our [blog post](https://opam.ocaml.org/blog/opam-2-5-2) for more details and the upgrade instructions.\r\n\r\n[Changelog](https://github.com/ocaml/opam/blob/2.5.2/CHANGES):\r\n\r\n## Security fix\r\n* Fix a bug that allowed a package to install files anywhere on the system using a symlink to an external directory without warning the user and asking for their permission: CVE-2026-57825 / [OSEC-2026-10](https://github.com/ocaml/security-advisories/pull/28). [#7005 @NathanReb]\r\n\r\n## Other changes\r\n* Re-allow `..` in `.install` files, partially reverts 2.5.1's #6898 [#7008 @kit-ty-kate - fix [ocaml/dune#14393](https://github.com/ocaml/dune/issues/14393)]\r\n* Stop the installation process via .install file from creating unnecessary intermediate directories for paths that contain `..` [#7015 @kit-ty-kate]\r\n* Improve and extend the testsuite [#6953 #7011 #7008 #7005 @NathanReb @rjbou @kit-ty-kate]\r\n* API changes in `opam-core`:\r\n  * `OpamFilename.{,dir_}starts_with`: Fix a bug where `foo/bar` would be considered a prefix of `foo/bar-baz` [#6953 @NathanReb - fix #6948]\r\n  * `OpamFilename.{,dir_}starts_with`: `/` and `\\` are now equivalent on Windows [#6953 @NathanReb]\r\n  * `OpamFilename.starts_with`: `starts_with \"a/b\" \"a/b\"` no longer returns `true` [#6953 @NathanReb]\r\n  * `OpamSystem.real_path`: fix a bug where paths after a non existent directory where not resolve [#7011 @kit-ty-kate - fix #7010]\r\n","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":3}
