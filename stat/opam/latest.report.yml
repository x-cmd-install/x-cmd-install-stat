4:20Z","updated_at":"2026-10-07T12:14:27Z"},{"id":618598661,"node_id":"RA_kwDOADUBZ84k3xEF","name":"opam-full-2.6.1.tar.gz.sig","label":null,"uploader":{"login":"kit-ty-kate","id":2611789,"node_id":"MDQ6VXNlcjI2MTE3ODk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":594,"digest":"sha256:97732e50127cc48bd7f4cd79441b9160e4c1a4e8a5589caa17e23ea99b991db5","download_count":3,"created_at":"2026-10-07T12:14:49Z","updated_at":"2026-10-07T12:14:50Z"}],"body":"This is the release of opam 2.6.1.\r\n\r\nBinaries and full archive are signed by the [opam dev team](https://opam.ocaml.org/opam-dev-pubkey.pgp) (fingerprint `92C5 26AE 50DF 3947 0EB2 911B ED4C F1CA 67CB AA92`).\r\nTo verify the authenticity of one of these files, run the following commands:\r\n```\r\ncurl -fsSLO https://opam.ocaml.org/opam-dev-pubkey.pgp\r\ngpg --import opam-dev-pubkey.pgp\r\ngpg --verify *.sig\r\n```\r\n\r\nPlease see our [blog post](https://opam.ocaml.org/blog/opam-2-6-1) for more details and the upgrade instructions.\r\n\r\n[Changelog](https://github.com/ocaml/opam/blob/2.6.1/CHANGES):\r\n\r\n## Changes\r\n### Regression fixes\r\n* Fix the depexts installation on `opam install --deps` when the system packages already exist in a repository [#7158 @kit-ty-kate - fix #7153]\r\n\r\n### Improvements\r\n* Add support for using git repositories owned by another local user [#6980 @kit-ty-kate - fix #6963]\r\n* Use `/dev/null` on both Unix and Windows when setting `GIT_CONFIG_*` (works around a bug in Git-for-Windows 2.56.0.windows.1) [#7085 @kit-ty-kate]\r\n\r\n### Miscellaneous\r\n* Upgrade the \"lockfile\" with checkseum.0.5.4 and decompress.1.6.1 [#7172 @kit-ty-kate]\r\n* Improve and extend the testsuite [#7158 #6980 @kit-ty-kate @rjbou]\r\n\r\n## API updates\r\n### `opam-repository`\r\n* `OpamGit`: git calls now will all carry git config `safe.directory=.` (current directory) [#6980 @kit-ty-kate - fix #6963]\r\n\r\n### `opam-state`\r\n* `OpamSwitchState.update_sys_packages` (new in 2.6.0) was removed in favour of the already existing `update_package_metadata` or `update_pin` functions [#7158 @kit-ty-kate]","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":2}
