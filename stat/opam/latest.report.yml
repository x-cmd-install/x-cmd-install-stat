pdated_at":"2026-09-17T11:31:08Z"},{"id":570125783,"node_id":"RA_kwDOADUBZ84h-23X","name":"opam-full-2.6.0.tar.gz.sig","label":null,"uploader":{"login":"kit-ty-kate","id":2611789,"node_id":"MDQ6VXNlcjI2MTE3ODk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":594,"digest":"sha256:25e35a103478cf6070720d244e18420fca3106dab52b7d71b1b4efa6fea88680","download_count":3,"created_at":"2026-09-17T11:30:44Z","updated_at":"2026-09-17T11:30:45Z"}],"body":"This is the final release of opam 2.6.0.\r\n\r\nBinaries and full archive are signed by the [opam dev team](https://opam.ocaml.org/opam-dev-pubkey.pgp) (fingerprint `92C5 26AE 50DF 3947 0EB2 911B ED4C F1CA 67CB AA92`).\r\nTo verify the authenticity of one of these files, run the following commands:\r\n```\r\ncurl -fsSLO https://opam.ocaml.org/opam-dev-pubkey.pgp\r\ngpg --import opam-dev-pubkey.pgp\r\ngpg --verify *.sig\r\n```\r\n\r\n[Changelog](https://github.com/ocaml/opam/blob/2.6.0/CHANGES):\r\n\r\n## Changes\r\n\r\n* Bump `opam-root-version` to 2.6 [#7146 @kit-ty-kate]\r\n* Improve and extend the testsuite [#7146 @kit-ty-kate @rjbou]\r\n\r\nTo get the detailed list of changes compared to 2.5.2, you can look at the pre-releases' release notes:\r\n- [the release note for 2.6.0~alpha1](https://github.com/ocaml/opam/releases/tag/2.6.0-alpha1)\r\n- [the release note for 2.6.0~beta1](https://github.com/ocaml/opam/releases/tag/2.6.0-beta1)\r\n- [the release note for 2.6.0~beta2](https://github.com/ocaml/opam/releases/tag/2.6.0-beta2)\r\n- [the release note for 2.6.0~rc1](https://github.com/ocaml/opam/releases/tag/2.6.0-rc1)\r\n\r\n**For a more descriptive and simplified list of changes, please read our [blog post](https://opam.ocaml.org/blog/opam-2-6-0/).**\r\n\r\n---\r\n**Special thanks to the Haematology department and Bone Marrow Transplant Unit of the NHS Greater Glasgow for making this release possible <3**","mentions_count":2}
