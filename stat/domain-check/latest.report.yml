cation/zip","state":"uploaded","size":1571491,"digest":"sha256:bea53000930a295323137ba1ddda5cb3aa1272d8b1d5ab33f1f6c7b2d823996a","download_count":62,"created_at":"2026-03-22T08:04:14Z","updated_at":"2026-03-22T08:04:14Z"}],"body":"# Domain Check v1.0.2\n\n## Installation\n\n**Homebrew:**\n```bash\nbrew tap saidutt46/domain-check\nbrew install domain-check\n```\n\n**Cargo:**\n```bash\n# CLI\ncargo install domain-check@1.0.2\n\n# MCP Server (for AI agents)\ncargo install domain-check-mcp@1.0.2\n\n# Library\ncargo add domain-check-lib@1.0.2\n```\n\n**Download Binaries:** CLI and MCP server binaries available below for all platforms.\n\n## MCP Server\n\nThe MCP server exposes domain checking as tools for AI coding agents. Works with Claude Code/Desktop, VS Code Copilot, Cursor, Windsurf, and any MCP-compatible client.\n\n```bash\n# Add to your agent\nclaude mcp add domain-check -- domain-check-mcp\n```\n\nSee [domain-check-mcp/README.md](https://github.com/saidutt46/domain-check/blob/v1.0.2/domain-check-mcp/README.md) for full setup instructions.\n\n## Backward Compatibility\n100% backward compatible - all existing commands work unchanged.\n\nSee [CHANGELOG.md](https://github.com/saidutt46/domain-check/blob/v1.0.2/CHANGELOG.md) for complete details.\n"}
