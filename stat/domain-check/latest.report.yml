state":"uploaded","size":1532636,"digest":"sha256:00bdf9bf1e88ea14929beb0060bb9cbf9f86592cf6c14dd87ad03be18c871e50","download_count":8,"created_at":"2026-09-28T03:37:58Z","updated_at":"2026-09-28T03:37:58Z"}],"body":"# Domain Check v1.0.3\n\n## Installation\n\n**Homebrew:**\n```bash\nbrew install domain-check\n```\n\n**Cargo:**\n```bash\n# CLI\ncargo install domain-check@1.0.3\n\n# MCP Server (for AI agents)\ncargo install domain-check-mcp@1.0.3\n\n# Library\ncargo add domain-check-lib@1.0.3\n```\n\n**Download Binaries:** CLI and MCP server binaries available below for all platforms.\n\n## MCP Server\n\nThe MCP server exposes domain checking as tools for AI coding agents. Works with Claude Code/Desktop, VS Code Copilot, Cursor, Windsurf, and any MCP-compatible client.\n\n```bash\n# Add to your agent\nclaude mcp add domain-check -- domain-check-mcp\n```\n\nSee [domain-check-mcp/README.md](https://github.com/saidutt46/domain-check/blob/v1.0.3/domain-check-mcp/README.md) for full setup instructions.\n\n## Backward Compatibility\n100% backward compatible - all existing commands work unchanged.\n\nSee [CHANGELOG.md](https://github.com/saidutt46/domain-check/blob/v1.0.3/CHANGELOG.md) for complete details.\n"}
