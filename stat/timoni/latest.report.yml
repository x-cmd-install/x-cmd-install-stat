0-30T12:24:36Z"},{"id":692043542,"node_id":"RA_kwDOI8nQV84pP78W","name":"timoni_0.37.0_sbom.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":441181,"digest":"sha256:b67120a2d1fd6771ba27601cfd26e9dd8bf32317311c1cb40b4186615f5d55f0","download_count":4,"created_at":"2026-10-30T12:23:32Z","updated_at":"2026-10-30T12:23:33Z"},{"id":692043541,"node_id":"RA_kwDOI8nQV84pP78V","name":"timoni_0.37.0_source_code.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":1367107,"digest":"sha256:8d86203b291a6b3790d07c4c53658b1fb251c9f341c94f424afdede43b5d8959","download_count":23,"created_at":"2026-10-30T12:23:32Z","updated_at":"2026-10-30T12:23:33Z"},{"id":692043540,"node_id":"RA_kwDOI8nQV84pP78U","name":"timoni_0.37.0_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22088592,"digest":"sha256:6efff7300cd6cfae6098df913dd67d1d70d7cbbaf940acc0022ba69a7aca8175","download_count":9,"created_at":"2026-10-30T12:23:32Z","updated_at":"2026-10-30T12:23:33Z"},{"id":692043523,"node_id":"RA_kwDOI8nQV84pP78D","name":"timoni_0.37.0_windows_arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":19222362,"digest":"sha256:b3faaf322eaf71276bf5e68d03f448bf059c9479c1c8347cf35eb9aeddf7039f","download_count":6,"created_at":"2026-10-30T12:23:32Z","updated_at":"2026-10-30T12:23:33Z"}],"body":"## Highlights\n\n* The artifacts built by Timoni are now reproducible across machines with different umasks and operating systems, as the file permissions in the content layers are set to `0755` for directories and owner-executable files and `0644` for other files, see [artifact](https://timoni.sh/concepts/#artifact).\n\n## Breaking changes\n\n* Modules and artifacts whose files carry other permissions, such as `0664` files and `0775` directories created with a `0002` umask or any content built on Windows, get a new digest the first time they are built with this version. Artifacts already published and the digests pinned in bundles are not affected. Publish the rebuilt content under a new version, as re-pushing an existing tag changes its digest.\n* Pulled files no longer keep restrictive permissions: files pushed as `0600` or `0444` are extracted as `0644`, and files executable only by group or others lose the execute bit.\n\n## What's Changed\n* test: replace Distribution with the go-containerregistry test registry by @stefanprodan in https://github.com/stefanprodan/timoni/pull/672\n* fix(oci): normalize file modes in artifact layers by @stefanprodan in https://github.com/stefanprodan/timoni/pull/673\n* build(deps): update Go dependencies, GitHub Actions and controller-gen by @stefanprodan in https://github.com/stefanprodan/timoni/pull/674\n\n\n**Full Changelog**: https://github.com/stefanprodan/timoni/compare/v0.36.0...v0.37.0\n\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
