"2026-10-21T17:25:46Z","updated_at":"2026-10-21T17:25:48Z"}],"body":"## Highlights\n\n* The `timoni mod build` and `timoni artifact build` commands take the `--resolve-symlinks` flag for packaging the symlink targets as regular files, the same as `timoni mod push` and `timoni artifact push`, see [symbolic links](https://timoni.sh/cue/module/publishing/#symbolic-links).\n* Timoni is now built with Go 1.27.3.\n\n## What's Changed\n* feat(cli): add `--resolve-symlinks` flag to `mod build` and `artifact build` by @stefanprodan in https://github.com/stefanprodan/timoni/pull/663\n* build(deps): update Go dependencies, GitHub Actions and golangci-lint by @stefanprodan in https://github.com/stefanprodan/timoni/pull/669\n\n\n**Full Changelog**: https://github.com/stefanprodan/timoni/compare/v0.35.0...v0.36.0\n\n\n","mentions_count":1}
