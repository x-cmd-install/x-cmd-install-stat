-11-25T10:28:02Z","updated_at":"2026-11-25T10:28:03Z"}],"body":"## Highlights\n\n* Timoni is now built with [CUE v0.18.0](https://github.com/cue-lang/cue/releases/tag/v0.18.0).\n* `timoni mod vendor crd` keeps the CRD maps declared with `additionalProperties` open. Maps with `additionalProperties: true`, preserved unknown fields and int-or-string values were vendored as closed structs that rejected every key. Re-run `timoni mod vendor crd` to regenerate the affected schemas, see [custom resources](https://timoni.sh/cue/module/custom-resources).\n* The temporary files created when reading bundles and runtimes from stdin with `-f -` are now removed when the command exits.\n\n## What's Changed\n* fix(cli): Remove stdin temp files on exit by @somaz94 in https://github.com/stefanprodan/timoni/pull/676\n* build(deps): bump the ci group across 1 directory with 8 updates by @dependabot[bot] in https://github.com/stefanprodan/timoni/pull/681\n* build(deps): update CUE to v0.18.0 and Go dependencies by @stefanprodan in https://github.com/stefanprodan/timoni/pull/682\n\n## New Contributors\n* @somaz94 made their first contribution in https://github.com/stefanprodan/timoni/pull/676\n\n**Full Changelog**: https://github.com/stefanprodan/timoni/compare/v0.37.0...v0.38.0\n\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
