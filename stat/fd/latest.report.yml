ing).\r\n\r\n## Bugfixes\r\n- Sanitize control characters and bidirectional override characters in filenames\r\n  when output goes to a terminal, to prevent terminal escape-sequence injection.\r\n  Also reject a placeholder as the executable for `--exec-batch`, while still\r\n  allowing it for `--exec`.\r\n- Handle invalid working directories gracefully when using `--full-path`, see #1900 (@Xavrir).\r\n- Fire the \"search pattern contains a path separator\" diagnostic for any pattern containing `/`, not just patterns that happen to name an existing directory. Preserves the legacy Windows behaviour that also flags native `\\` separators when the pattern resolves to a real directory. See #1873.\r\n- Also fire the \"search pattern contains a path separator\" diagnostic for `--and` patterns, not only the primary positional pattern. `--and` patterns are matched against the file name just like the primary pattern, so a path separator in them silently returned zero results. See #1873.\r\n- Fix bug where passing \"-\" as a directory argument didn't actually search that directory, see #849 (@Sean-Kenneth-Doherty).\r\n- Fix panic when `--changed-before`/`--changed-within` is given an out-of-range `@` Unix timestamp; the value is now rejected gracefully, see #2081 (@nikolauspschuetz).\r\n\r\n\r\n## New Contributors\r\n* @liruiluo made their first contribution in https://github.com/sharkdp/fd/pull/1924\r\n* @Xavrir made their first contribution in https://github.com/sharkdp/fd/pull/1917\r\n* @rexkirshner made their first contribution in https://github.com/sharkdp/fd/pull/1921\r\n* @Rohan5commit made their first contribution in https://github.com/sharkdp/fd/pull/1934\r\n* @tmchow made their first contribution in https://github.com/sharkdp/fd/pull/1959\r\n* @YoshKoz made their first contribution in https://github.com/sharkdp/fd/pull/1979\r\n* @SAY-5 made their first contribution in https://github.com/sharkdp/fd/pull/1975\r\n* @skane-lukas made their first contribution in https://github.com/sharkdp/fd/pull/1889\r\n* @Sean-Kenneth-Doherty made their first contribution in https://github.com/sharkdp/fd/pull/2006\r\n* @stevenwalton made their first contribution in https://github.com/sharkdp/fd/pull/2011\r\n* @DeflateAwning made their first contribution in https://github.com/sharkdp/fd/pull/1983\r\n* @wyf027 made their first contribution in https://github.com/sharkdp/fd/pull/2001\r\n* @bonanza127 made their first contribution in https://github.com/sharkdp/fd/pull/2040\r\n* @mahirhir made their first contribution in https://github.com/sharkdp/fd/pull/2036\r\n* @parneetsingh022 made their first contribution in https://github.com/sharkdp/fd/pull/2037\r\n* @curious-rabbit made their first contribution in https://github.com/sharkdp/fd/pull/1976\r\n* @WilliamLeony made their first contribution in https://github.com/sharkdp/fd/pull/2064\r\n* @kobihikri made their first contribution in https://github.com/sharkdp/fd/pull/2063\r\n* @cmelaro made their first contribution in https://github.com/sharkdp/fd/pull/2075\r\n* @nikolauspschuetz made their first contribution in https://github.com/sharkdp/fd/pull/2082\r\n\r\n**Full Changelog**: https://github.com/sharkdp/fd/compare/v10.4.2...v10.5.0","reactions":{"total_count":45,"+1":15,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":15,"rocket":7,"eyes":1},"mentions_count":20}
