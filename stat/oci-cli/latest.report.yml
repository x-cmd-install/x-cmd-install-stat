:"2026-09-09T07:16:54Z"},{"id":552224312,"node_id":"RA_kwDOBFcSgc4g6kY4","name":"oci-cli-3.92.1-Windows-Server-Installer.msi","label":"","uploader":{"login":"oci-dex-release-bot","id":95374885,"node_id":"U_kgDOBa9OJQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":38871040,"digest":"sha256:35509de25bad8075ee07c3443e26bba9f0a234a1d7cac45f6f82eb06e60aa133","download_count":169,"created_at":"2026-09-09T07:16:19Z","updated_at":"2026-09-09T07:16:25Z"},{"id":550286428,"node_id":"RA_kwDOBFcSgc4gzLRc","name":"oci-cli-3.92.1.zip","label":"","uploader":{"login":"oci-dex-release-bot","id":95374885,"node_id":"U_kgDOBa9OJQ","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":185662080,"digest":"sha256:cb593aca9a9244645b085d79c55d44828b9acd0dc94904747e956b0bdc79db92","download_count":57,"created_at":"2026-09-08T10:18:30Z","updated_at":"2026-09-08T10:18:37Z"}],"body":"\n## Added\n* Database Service\n  * Support for Grid Infrastructure Home (GI Home) lifecycle operations\n    * ``oci db gi-home create``\n    * ``oci db gi-home delete``\n    * ``oci db gi-home get``\n    * ``oci db gi-home list``\n    * ``oci db gi-home update``\n  * Support for new optional parameter ``--source-gi-home-id``\n    * ``oci db database-software-image create --source-gi-home-id``\n* OCI Cache\n  * Support for converting an existing OCI Cache cluster into a secondary cluster, converting a secondary cluster into a standalone cluster, and performing switchover between primary and secondary clusters\n    * ``oci redis redis-cluster redis-cluster convert-to-secondary-cluster``\n    * ``oci redis redis-cluster redis-cluster convert-to-standalone-cluster``\n    * ``oci redis redis-cluster redis-cluster switchover``\n  * Support for new optional parameter ``--primary-cluster-id``\n    * ``oci redis redis-cluster redis-cluster create --primary-cluster-id``\n* Oracle Cloud VMware Solution\n  * Support for configurable fault domain host distribution via new optional parameter ``--initial-fault-domain-host-distribution`` (accepted values: EVENLY_DISTRIBUTED, UNEVENLY_DISTRIBUTED)\n    * ``oci ocvs cluster create --initial-fault-domain-host-distribution``\n    * ``oci ocvs esxi-host create --initial-fault-domain-host-distribution``\n    * ``oci ocvs esxi-host inplace-upgrade --initial-fault-domain-host-distribution``\n    * ``oci ocvs esxi-host replace-host --initial-fault-domain-host-distribution``\n  * Support for new command\n    * ``oci ocvs cluster generate-host-distribution-report``\n\n## File Checksums (SHA256)\noci-cli-3.92.1.zip cb593aca9a9244645b085d79c55d44828b9acd0dc94904747e956b0bdc79db92\noci-cli-3.92.1-Oracle-Linux-9-Offline.zip 09df27d5eb595252ef74693cc170350bdcde4d54a71f658ccde27dd4cc2c5405\noci-cli-3.92.1-Windows-Server-2016-Offline.zip 00d9f70a20f86d6399939f319924393788f2c0f19540f6a5fecfc8214874dcd9\noci-cli-3.92.1-Ubuntu-22.04-Offline.zip b221fa31f11c7ad3f2671ae3e6b63620bc727196d2181940cc1327372bfb7aea\noci-cli-3.92.1-Oracle-Linux-10-Offline.zip 28925e1aa32a244e4c1deefc62c74ab61982a4fafde0d9f74e715edd8d98505c\noci-cli-3.92.1-Ubuntu-20.04-Offline.zip 5ba8739d904d9c5150fce0003eeaea208ac6a6b5a075ff43a17b24becce777fe\noci-cli-3.92.1-Windows-Server-Installer.msi 35509de25bad8075ee07c3443e26bba9f0a234a1d7cac45f6f82eb06e60aa133\noci-cli-3.92.1-Oracle-Linux-8-Offline.zip 1499764580bda97cf1cd5cb1b9513c3d9cb1223d446e0b2bb82fac05fd57eabe\noci-cli-3.92.1-Windows-Server-2019-Offline.zip f49a1a1b2231ca95b6400c096dfb03dc687ea247d4a49972f456c96884f7ef03"}
