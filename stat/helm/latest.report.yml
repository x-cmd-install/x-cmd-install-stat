0-windows-arm64.zip.sha256sum.asc","label":null,"uploader":{"login":"scottrigby","id":407675,"node_id":"MDQ6VXNlcjQwNzY3NQ==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":870,"digest":"sha256:8a308129a9736e4b9099ed7da1ff2a960be390a86fcfbffae5b7ca08a4343ab8","download_count":13,"created_at":"2026-09-09T23:51:19Z","updated_at":"2026-09-09T23:51:19Z"}],"body":"Helm v4.3.0 is a feature release. Users are encouraged to upgrade for the best experience.\r\n\r\nThe community keeps growing, and we'd love to see you there!\r\n\r\n- Join the discussion in [Kubernetes Slack](https://kubernetes.slack.com):\r\n  -  for questions and just to hang out\r\n  -  for discussing PRs, code, and bugs\r\n- Hang out at the Public Developer Call: Thursday, 9:30 Pacific via [Zoom](https://zoom-lfx.platform.linuxfoundation.org/meeting/91295593969?password=17825db5-c698-44cc-9f00-ef1f61f5d3fb)\r\n- Test, debug, and contribute charts: [ArtifactHub/packages](https://artifacthub.io/packages/search?kind=0)\r\n\r\n## Notable Changes\r\n\r\n* feat: Add duration functions by @aeroyorch in https://github.com/helm/helm/pull/31695\r\n* feat(engine): add debug logging when lookup returns empty by @ogulcanaydogan in https://github.com/helm/helm/pull/32205\r\n* feat: add ownership verification before deleting resources during uni\u2026 by @banjoh in https://github.com/helm/helm/pull/31584\r\n* feat: honor SOURCE_DATE_EPOCH for chart archives by @lohitkolluri in https://github.com/helm/helm/pull/32162\r\n* feat(rollback): add --description flag to provide rollback reason by @biagiopietro in https://github.com/helm/helm/pull/31580\r\n* fix (internal/plugin): remove zero-width spaces from plugin name comment by @lexfrei in https://github.com/helm/helm/pull/32134\r\n* fix(loader): do not drop values files ending at a 4096-byte boundary by @locker95 in https://github.com/helm/helm/pull/32525\r\n* fix(chart): normalize StampModTimes timestamp to UTC/truncate + Chart.lock reproducibility test by @Mentigen in https://github.com/helm/helm/pull/32485\r\n* fix(provenance): support GnuPG keybox (pubring.kbx) keyrings by @ruslan-shaydullin in https://github.com/helm/helm/pull/32281\r\n* fix(template): regression - route registry messages to stderr in template and show by @amarkdotdev in https://github.com/helm/helm/pull/32217\r\n* refactor: lower resync period from one hour to 3 minutes by @AustinAbro321 in https://github.com/helm/helm/pull/31944\r\n* perf: enable concurrent status computation to prevent multi-minute delays by @mapleeit in https://github.com/helm/helm/pull/32043\r\n* chore(deps): bump the k8s-io group to 0.37.0 - #32598\r\n\r\n## Installation and Upgrading\r\n\r\nDownload Helm v4.3.0. The common platform binaries are here:\r\n\r\n- [MacOS amd64](https://get.helm.sh/helm-v4.3.0-darwin-amd64.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-darwin-amd64.tar.gz.sha256sum) / 347a784877e0e20eac865e8d1c36a80f6bb0861d6f29abd34defb6570ef95d92)\r\n- [MacOS arm64](https://get.helm.sh/helm-v4.3.0-darwin-arm64.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-darwin-arm64.tar.gz.sha256sum) / d3870437e1e95b67f8edbde964156c84a26503f560821d40c542441658934fba)\r\n- [Linux amd64](https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum) / 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb)\r\n- [Linux arm](https://get.helm.sh/helm-v4.3.0-linux-arm.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-arm.tar.gz.sha256sum) / 467c353e4a1ab57412dd00c6bfb1a6a2ab4a57d775506f8b38c58502c0ba6861)\r\n- [Linux arm64](https://get.helm.sh/helm-v4.3.0-linux-arm64.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-arm64.tar.gz.sha256sum) / 31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08)\r\n- [Linux i386](https://get.helm.sh/helm-v4.3.0-linux-386.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-386.tar.gz.sha256sum) / e969a9492ac128097069aef7eb63be3b2504a20b5377a240b4c5c9bfc4b51575)\r\n- [Linux loong64](https://get.helm.sh/helm-v4.3.0-linux-loong64.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-loong64.tar.gz.sha256sum) / 4ffe485ef474d722699794851642e1c7037e4776233e77637c649f69f3e9a4ce)\r\n- [Linux ppc64le](https://get.helm.sh/helm-v4.3.0-linux-ppc64le.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-ppc64le.tar.gz.sha256sum) / 5ff7d5ea6f396c15f3cfda3fb8ecb0ecb1b11bc283785adeb55eefb2c62e0bda)\r\n- [Linux s390x](https://get.helm.sh/helm-v4.3.0-linux-s390x.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-s390x.tar.gz.sha256sum) / ab637a6a1c3d457b9975726c100d74e484e579d5462c4fd2e3bfcfa97df57cd7)\r\n- [Linux riscv64](https://get.helm.sh/helm-v4.3.0-linux-riscv64.tar.gz) ([checksum](https://get.helm.sh/helm-v4.3.0-linux-riscv64.tar.gz.sha256sum) / 5359f5544478de80de2dfd60bdc5e0c22f26255b3c44335483e0f9bd3ba6ec58)\r\n- [Windows amd64](https://get.helm.sh/helm-v4.3.0-windows-amd64.zip) ([checksum](https://get.helm.sh/helm-v4.3.0-windows-amd64.zip.sha256sum) / 304ea163cce4d9ad14e189c01846c6a34de9cfdfe48536ae54b2e8ba7884e67c)\r\n- [Windows arm64](https://get.helm.sh/helm-v4.3.0-windows-arm64.zip) ([checksum](https://get.helm.sh/helm-v4.3.0-windows-arm64.zip.sha256sum) / 4a9eefa30d26eb73900a9a0f16e97eae678582172204db60cbd454c68acea246)\r\n\r\nThis release was signed with `208D D36E D5BB 3745 A167 43A4 C7C6 FBB5 B91C 1155` and can be found at @scottrigby [keybase account](https://keybase.io/r6by). Please use the attached signatures for verifying this release using `gpg`.\r\n\r\nThe [Quickstart Guide](https://helm.sh/docs/intro/quickstart/) will get you going from there. For **upgrade instructions** or detailed installation notes, check the [install guide](https://helm.sh/docs/intro/install/). You can also use a [script to install](https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4) on any system with `bash`.\r\n\r\n#