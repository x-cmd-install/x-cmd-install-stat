] in https://github.com/VSCodium/vscodium/pull/2953\n* build(deps): bump actions/stale from 10.4.0 to 11.0.0 by @dependabot[bot] in https://github.com/VSCodium/vscodium/pull/2954\n* build(deps-dev): bump fast-uri from 3.1.4 to 3.1.5 in /font-size by @dependabot[bot] in https://github.com/VSCodium/vscodium/pull/2955\n* build(deps): bump postcss from 8.5.18 to 8.5.23 in /font-size by @dependabot[bot] in https://github.com/VSCodium/vscodium/pull/2956\n* build(deps): bump signpath/github-action-submit-signing-request from 2.2 to 2.3 by @dependabot[bot] in https://github.com/VSCodium/vscodium/pull/2971\n* build(deps): bump zizmorcore/zizmor-action from 0.6.1 to 0.6.2 by @dependabot[bot] in https://github.com/VSCodium/vscodium/pull/2964\n* build(font-size): replace xo with eslint by @daiyam in https://github.com/VSCodium/vscodium/pull/2972\n* feat(1.135): update patches by @daiyam in https://github.com/VSCodium/vscodium/pull/2973\n* build: use nodejs-v24.20 by @daiyam in https://github.com/VSCodium/vscodium/pull/2974\n* Fix inverted `enableASARSupport()` guard by @0zitro in https://github.com/VSCodium/vscodium/pull/2978\n* wip: fixing oom and slow build by @daiyam in https://github.com/VSCodium/vscodium/pull/2977\n* fix: replace max-old-space-size with our own limit by @daiyam in https://github.com/VSCodium/vscodium/pull/2979\n* Honor custom product branding by @ThadHouse in https://github.com/VSCodium/vscodium/pull/2981\n* Honor disabled CLI builds by @ThadHouse in https://github.com/VSCodium/vscodium/pull/2982\n* Preserve the update-disable patch by @ThadHouse in https://github.com/VSCodium/vscodium/pull/2983\n* fix(windows): update by @daiyam in https://github.com/VSCodium/vscodium/pull/2986\n* Add anylinux-appimage by @Shikakiben in https://github.com/VSCodium/vscodium/pull/2950\n* build(linux): update location of electron version by @daiyam in https://github.com/VSCodium/vscodium/pull/2985\n* Address EditorConfig violations by @BaumiCoder in https://github.com/VSCodi