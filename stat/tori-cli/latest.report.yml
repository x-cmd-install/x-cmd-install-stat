bYelc","name":"tori_0.3.4_linux_amd64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":15278264,"digest":"sha256:a4ad0fcaf39588f03c6d6cd3f04e87d483df625e81f854c15ee20efb0eb6c223","download_count":88,"created_at":"2026-06-27T09:59:35Z","updated_at":"2026-06-27T09:59:36Z"},{"id":459401566,"node_id":"RA_kwDORMzKwc4bYele","name":"tori_0.3.4_linux_arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14549176,"digest":"sha256:16ca8f7f4545f9934c4be224abe223295b936644d405a99b99e1398205cf1622","download_count":17,"created_at":"2026-06-27T09:59:35Z","updated_at":"2026-06-27T09:59:36Z"}],"body":"### What's New\r\n\r\n**SQLite performance overhaul**\r\n\r\nReduced I/O amplification and fixed query contention under write load. Servers with chatty containers were experiencing excessive block I/O in docker stats and intermittent TUI connection timeouts.\r\n\r\n**Read/write connection split**\r\nQueries no longer queue behind log inserts. The single SQLite connection is split into a dedicated write connection and a 4-connection read pool, reducing query latency under load from 12.9x to 1.2x baseline.\r\n\r\n**I/O reduction**\r\nDropped two rarely-needed indexes on the logs table (5 \u2192 3), increased log batch size (100 \u2192 500), and tuned WAL/cache PRAGMAs. Per-entry I/O drops from 2,246 to 1,057 bytes \u2014 a 53% reduction. At 4 containers \u00d7 500 lines/sec, daily I/O goes from 363 GB to 170 GB.\r\n\r\n**PRAGMA tuning**\r\ncache_size 2MB \u2192 8MB, \r\nauto_vacuum incremental \u2192 off, \r\nwal_autocheckpoint 1000 \u2192 10000, \r\ncache_spill disabled, \r\nbusy_timeout 5000ms, \r\nmmap_size 256MB for reads.\r\n\r\n_All changes are backwards compatible \u2014 same logs stored, same queries work, same TUI behavior. Existing databases require no migration._\r\n\r\n**Dependency Updates**\r\n- modernc.org/sqlite 1.48.0 \u2192 1.52.0\r\n- Go image bumps in /deploy\r\n- Alpine 3.21 \u2192 3.24 in /deploy\r\n- goreleaser/goreleaser-action 6.4.0 \u2192 7.2.2\r\n- codecov/codecov-action 6.0.0 \u2192 7.0.0\r\n- actions/checkout 6.0.2 \u2192 6.0.3\r\n- docker/setup-qemu-action 4.0.0 \u2192 4.1.0\r\n- docker/setup-buildx-action 4.0.0 \u2192 4.1.0\r\n- docker/login-action 3.7.0 \u2192 4.2.0\r\n\r\n## Changelog\r\n* 9f736614cb020072680b1ed4bb856991a47b2c2e Merge pull request #110 from thobiasn/fix/performance-and-crash\r\n* 9c31d9b3ca365085f4afe02772d1ffce4a688cf8 Reduce SQLite I/O amplification and fix query contention under write load\r\n* 02bccab855a9de7f4d9499b23eb3f9aaa1b9d6d9 Merge pull request #107 from thobiasn/dependabot/docker/deploy/golang-f1ddd9f\r\n* 92a1d546c3110c53bae6b6ee854b9925b71022de Merge pull request #108 from thobiasn/dependabot/docker/deploy/alpine-3.24\r\n* 7bdc9a43c368c58b2972318ae9c83f28503f8650 Merge pull request #109 from thobiasn/dependabot/go_modules/all-d902ad55bd\r\n* 96b4820405da2e398e35129f872031479ac1312a Bump modernc.org/sqlite from 1.51.0 to 1.52.0 in the all group\r\n* f2d29f0eff96798b14d890c707935c865a4cf68b Bump alpine from 3.23 to 3.24 in /deploy\r\n* 16ebc46f8adfed6a70bdcff74f34fab05c5a41f7 Bump golang from `f23e8b2` to `f1ddd9f` in /deploy\r\n* 7f368df24df989ce9f0bb8e2e15bdc6c698dab6f Merge pull request #102 from thobiasn/dependabot/docker/deploy/golang-f23e8b2\r\n* 66c823b0e1d522b462f444e42e18bed085703f5c Merge pull request #103 from thobiasn/dependabot/go_modules/all-820560494d\r\n* ee35d3a12170b020b7ce2c4c9a6b9bf6c4a37ac1 Merge pull request #104 from thobiasn/dependabot/github_actions/docker/setup-qemu-action-4.1.0\r\n* 1fd1fb355dcf6bb1b2965f74adac501e22e1bc2d Merge pull request #105 from thobiasn/dependabot/gi