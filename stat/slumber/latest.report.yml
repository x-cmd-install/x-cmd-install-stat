Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:669d860c93cac5a52db1b3272493233571c4a94374452658639a66a14323f3f5","download_count":5,"created_at":"2026-05-16T12:21:10Z","updated_at":"2026-05-16T12:21:10Z"}],"body":"## Release Notes\n\n<!-- ANCHOR: changelog -->\n\n### Added\n\n- Resize panes dynamically with `[` and `]`\n  - [Rebind](https://slumber.lucaspickering.me/api/configuration/input_bindings.html) the actions `resize_back` and `resize_forward` to customize\n\n### Changed\n\n- Exit fullscreen whenever changing panes\n  - With resizable panes, keeping fullscreen persistent ends up being more annoying than useful\n\n### Fixed\n\n- Border of the selected pane is always fully highlighted\n\n## Install slumber 5.3.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install LucasPickering/tap/slumber\n```\n\n## Download slumber 5.3.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [slumber-aarch64-apple-darwin.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-apple-darwin.tar.xz.sha256) |\n| [slumber-x86_64-apple-darwin.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-apple-darwin.tar.xz.sha256) |\n| [slumber-aarch64-pc-windows-msvc.zip](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-pc-windows-msvc.zip.sha256) |\n| [slumber-x86_64-pc-windows-msvc.zip](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-pc-windows-msvc.zip.sha256) |\n| [slumber-aarch64-unknown-linux-gnu.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [slumber-x86_64-unknown-linux-gnu.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [slumber-aarch64-unknown-linux-musl.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [slumber-x86_64-unknown-linux-musl.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.3.0/slumber-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n\n","reactions":{"total_count":4,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":0}}
