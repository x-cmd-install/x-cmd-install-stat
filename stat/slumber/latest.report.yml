":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:cb795875cfe13a846566e953640833e7200bb7c78cd8d813d2a87ea8182110ff","download_count":2,"created_at":"2026-10-14T21:53:51Z","updated_at":"2026-10-14T21:53:51Z"}],"body":"## Release Notes\n\n<!-- ANCHOR: changelog -->\n\n### Changed\n\n- Use a single unicode character for checkboxes\n- Support compressed responses\n  - brotli, deflate, gzip, and zstd content encodings are now supported\n  - Slumber will not include a `Content-Encoding` header by default; if you want your responses to be compressed, you'll have to manually add the request header\n- Include database path in TUI Help page\n\n### Fixed\n\n- Fixed underflow in hotkey hint [#767](https://github.com/LucasPickering/slumber/pull/767) (@MichaelXavier)\n\n## Install slumber 5.4.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-installer.ps1 | iex\"\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install LucasPickering/tap/slumber\n```\n\n## Download slumber 5.4.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [slumber-aarch64-apple-darwin.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-apple-darwin.tar.xz.sha256) |\n| [slumber-x86_64-apple-darwin.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-apple-darwin.tar.xz.sha256) |\n| [slumber-aarch64-pc-windows-msvc.zip](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-pc-windows-msvc.zip) | ARM64 Windows | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-pc-windows-msvc.zip.sha256) |\n| [slumber-x86_64-pc-windows-msvc.zip](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-pc-windows-msvc.zip.sha256) |\n| [slumber-aarch64-unknown-linux-gnu.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [slumber-x86_64-unknown-linux-gnu.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [slumber-aarch64-unknown-linux-musl.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [slumber-x86_64-unknown-linux-musl.tar.xz](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/LucasPickering/slumber/releases/download/v5.4.0/slumber-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n\n","mentions_count":1}
