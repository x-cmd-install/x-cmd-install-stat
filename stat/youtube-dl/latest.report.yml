iew_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":null,"download_count":37372,"created_at":"2021-12-16T19:01:15Z","updated_at":"2021-12-16T19:01:16Z"},{"id":51949457,"node_id":"RA_kwDOAA_coM4DGK-R","name":"youtube-dl.sig","label":"","uploader":{"login":"dstftw","id":1908898,"node_id":"MDQ6VXNlcjE5MDg4OTg=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":null,"download_count":36852,"created_at":"2021-12-16T19:01:12Z","updated_at":"2021-12-16T19:01:12Z"}],"body":"**This release is old and has many known issues.** See \"... commits to master since this release\" above.\r\n\r\nYou almost certainly want the [nightly build release](https://github.com/ytdl-org/ytdl-nightly/releases/), and not this one. The nightly build is created from the `master` branch of this repo if changes have been committed since the last build. Read about [Installation](https://github.com/ytdl-org/ytdl-nightly#user-content-installation) of the nightly build. Major fixes in the nightly build are listed [here](https://github.com/ytdl-org/youtube-dl/issues/30839).\r\n\r\nCore\r\n* [postprocessor/ffmpeg] Show ffmpeg output on error (#22680, #29336)\r\n\r\nExtractors\r\n* [youtube] Update signature function patterns (#30363, #30366)\r\n* [peertube] Only call description endpoint if necessary (#29383)\r\n* [periscope] Pass referer to HLS requests (#29419)\r\n- [liveleak] Remove extractor (#17625, #24222, #29331)\r\n+ [pornhub] Add support for pornhubthbh7ap3u.onion\r\n* [pornhub] Detect geo restriction\r\n* [pornhub] Dismiss tbr extracted from download URLs (#28927)\r\n* [curiositystream:collection] Extend _VALID_URL (#26326, #29117)\r\n* [youtube] Make get_video_info processing more robust (#29333)\r\n* [youtube] Workaround for get_video_info request (#29333)\r\n* [bilibili] Strip uploader name (#29202)\r\n* [youtube] Update invidious instance list (#29281)\r\n* [umg:de] Update GraphQL API URL (#29304)\r\n* [nrk] Switch psapi URL to https (#29344)\r\n+ [egghead] Add support for app.egghead.io (#28404, #29303)\r\n* [appleconnect] Fix extraction (#29208)\r\n+ [orf:tvthek] Add support for MPD formats (#28672, #29236)","reactions":{"total_count":589,"+1":253,"-1":0,"laugh":36,"hooray":109,"confused":0,"heart":79,"rocket":46,"eyes":66}}
