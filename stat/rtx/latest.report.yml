login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:a22095b4a14a27acd8948ba9b79a2b5d8e0f9fdceecff7e9fba8283665cc3da2","download_count":16545,"created_at":"2026-10-15T10:07:04Z","updated_at":"2026-10-15T10:07:04Z"},{"id":643450311,"node_id":"RA_kwDOIvux3s4mWkXH","name":"SHASUMS512.asc","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":7057,"digest":"sha256:a8cdd8b463d78d7b9cbd5e256733f3b2f9d997bcc670dc1ad52f4bf0a83c9252","download_count":17,"created_at":"2026-10-15T10:07:04Z","updated_at":"2026-10-15T10:07:04Z"},{"id":643450310,"node_id":"RA_kwDOIvux3s4mWkXG","name":"SHASUMS512.txt","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":6175,"digest":"sha256:bd4f1d73293f8cf5c1c6cb20518beff21b428238a3d272a6488bb49036af96f4","download_count":24,"created_at":"2026-10-15T10:07:04Z","updated_at":"2026-10-15T10:07:04Z"},{"id":643450326,"node_id":"RA_kwDOIvux3s4mWkXW","name":"SHASUMS512.txt.minisig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":309,"digest":"sha256:d4ed3a0a1d900ea5e951d0b50062241e4e59a98f0c04808a41d78c5658a9d1b7","download_count":20,"created_at":"2026-10-15T10:07:04Z","updated_at":"2026-10-15T10:07:04Z"},{"id":643451107,"node_id":"RA_kwDOIvux3s4mWkjj","name":"v2026.10.11.tar.gz.sig","label":"","uploader":{"login":"mise-en-dev","id":123107610,"node_id":"U_kgDOB1Z5Gg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":566,"digest":"sha256:7f81d7499e71f621378b15d247452ef8d4529ea2fc9ac5bd8ec68648337985d1","download_count":15,"created_at":"2026-10-15T10:07:25Z","updated_at":"2026-10-15T10:07:25Z"}],"body":"mise is much faster in this release and calls the GitHub API far less. Version lists, release tags, attestations and other public GitHub metadata now come from mise-versions, so everyday commands like `mise install`, `exec`, shims, `outdated`, `lock` and `self-update` are quicker and users without a GitHub token no longer run into the 60-requests-an-hour limit. Cached version lists are reused for longer, so repeat installs skip most lookups. It also adds `mise bootstrap --upgrade` and `mise env --paths`, and closes a trust gap in remote task files.\n\n## Speed and GitHub API usage\n\nCold-cache timings for v2026.10.10 versus v2026.10.11, measured with hyperfine on one Linux x64 machine with no GitHub token set:\n\n| Command | v2026.10.10 | v2026.10.11 |\n| --- | --- | --- |\n| `mise ls-remote python` | 961 ms | 93 ms |\n| `mise install` (jq, ripgrep, fd, bat, gh, shellcheck) | 1.49 s | 1.08 s |\n| `mise outdated` (same six tools installed) | 433 ms | 272 ms |\n\nThe install and `outdated` runs are noisy (\u00b10.1\u20130.4s over 4 runs) and the install time includes downloads, so treat them as rough. Requests to `api.github.com` in a cold `mise install` of `github:` tools dropped from 2 to 0. Cold `mise outdated` made 8 network requests before and none now.\n\n- **Public GitHub metadata comes from mise-versions.** With `use_versions_host` on (the default), release lists, `latest`, git tags (aqua `github_tag` packages, ubi and go), artifact attestations (including aqua's `predicate_type` filters) and the digest in the checksum-mismatch hint are read from mise-versions instead of `api.github.com`. GitHub is still asked directly for repositories mise-versions doesn't list when you have a token (the private-repository case), and in paranoid mode for attestations. The direct API is also used with `use_versions_host = false`, GitHub `url_replacements` and custom `api_url`s. [#14460](https://github.com/jdx/mise/pull/14460), [#14461](https://github.com/jdx/mise/pull/14461), [#14469](https://github.com/jdx/mise/pull/14469), [#14481](https://github.com/jdx/mise/pull/14481), [#14477](https://github.com/jdx/mise/pull/14477), [#14443](https://github.com/jdx/mise/pull/14443)\n- Other requests also moved off the GitHub API:\n  - `mise x`, `mise exec`, shims and `hook-env` use mise-versions when they auto-install a tool. [#14458](https://github.com/jdx/mise/pull/14458)\n  - `mise self-update` reads mise's releases from mise-versions and downloads the archive from github.com release downloads. Packslip and zipsign verification are unchanged. [#14464](https://github.com/jdx/mise/pull/14464)\n  - `mise lock` downloads artifacts for provenance checks from github.com instead of the API asset endpoint. [#14465](https://github.com/jdx/mise/pull/14465)\n  - Aqua registries hosted on GitHub are fetched from raw.githubusercontent.com. [#14470](https://github.com/jdx/mise/pull/14470)\n  - Ruby looks up the latest ruby-build release through mise-versions. [#14471](https://github.com/jdx/mise/pull/14471)\n- **Fewer version-list fetches.** `mise install`, `use` and `run` now reuse a cached version list for the tool's `minimum_release_age` window minus one hour, clamped to 1\u201324h. With the default 24h cutoff, that is 23h. `outdated`, `upgrade`, `ls-remote`, `lock` and `latest` still refresh after 1h. If you set `fetch_remote_versions_cache` yourself, your value applies to every command. [#14484](https://github.com/jdx/mise/pull/14484), [#14485](https://github.com/jdx/mise/pull/14485), [#14457](https://github.com/jdx/mise/pull/14457)\n- **Faster version resolution:**\n  - Multi-tool commands such as `mise outdated` can resolve many registry tools with one request to the mise-versions index. [#14473](https://github.com/jdx/mise/pull/14473)\n  - `latest` is resolved without refetching the list. [#14456](https://github.com/jdx/mise/pull/14456)\n  - Explicit backend args such as `aqua:jqlang/jq` reuse the registry tool's version list. [#14459](https://github.com/jdx/mise/pull/14459)\n  - Release tags come from the versions host instead of being listed or guessed. [#14442](https://github.com/jdx/mise/pull/14442)\n  - Packslip installs no longer re-download what resolution already verified. [#14466](https://github.com/jdx/mise/pull/14466)\n  - Install tracking and the Python version list are served from static assets. [#14441](https://github.com/jdx/mise/pull/14441)\n- **Python version listing no longer clones pyenv.** `mise ls-remote python`, `outdated`, `upgrade` and fuzzy `mise use python@3.12` read the python-build definitions from mise-versions. A cold listing took about 960ms before and about 90ms now. pyenv is still cloned when mise compiles Python, when `python.pyenv_repo` points at a fork, when you're offline, or when `use_versions_host = false`. Some definitions that had no date before now have one, so they are held back by `minimum_release_age` until they are old enough. [#14455](https://github.com/jdx/mise/pull/14455)\n- `mise oci build` now requires root for `apt:` packages, as it already did for apk, and fails up front with a clear message. If apt-get still fails, the error now includes the last lines of dpkg's output. [#14447](https://github.com/jdx/mise/pull/14447)\n- Registry: `native-sdk` now installs from npm (`@native-sdk/cli`), so the `native` command works. It requires Node 24+. [#14431](https://github.com/jdx/mise/pull/14431)\n\n## Security\n\n- **Remote task files now need trust before their headers render.** A `mise.toml` with only `[tasks]` loads without trust. Before this fix, if one of those tasks set `file` to a remote URL, `mise tasks ls`, `mise tasks info` and `mise tasks validate` rendered the file's `#MISE` headers, so a template like `{{ exec(...) }}` ran without a trust prompt. Remote files now follow the same rule as local task includes: if the headers contain template syntax, the config that references them must be trusted first. Remote files with plain headers still list without trust, and braces in the script body need no trust. [#14416](https://github.com/jdx/mise/pull/14416) (@JamBalaya56562, @risu729)\n- Updated rustls to 0.23.46 to address a RustSec advisory. [#14434](https://github.com/jdx/mise/pull/14434)\n\n## Added\n\n- **`mise bootstrap --upgrade`** installs what is missing and then upgrades what is already installed, in a single run. In the packages phase it runs the same upgrade as `mise bootstrap packages upgrade`, and pins are respected. In the tools phase it runs `mise upgrade` without `--bump`, so configured version ranges hold. Both run before the matching post hooks and dependent services. `--dry-run` previews both steps and `--skip` works as before. It does not update mise itself, repositories or images, and it does not restart services. [#14433](https://github.com/jdx/mise/pull/14433)\n\n  ```sh\n  mise self-update --yes && mise bootstrap --upgrade\n  ```\n\n- **`mise env --paths`** prints the PATH entries mise manages, one per line and in PATH order: tool bin directories, `_.path` entries, and inherited directories that mise moves forward, such as `~/.cargo/bin`. This lets CI integrations export only mise's additions without diffing `PATH`. [#14429](https://github.com/jdx/mise/pull/14429)\n\n  ```console\n  $ mise env --paths\n  /home/me/.local/share/mise/installs/node/24.11.0/bin\n  /home/me/.cargo/bin\n  ```\n\n- **The install script downloads pinned versions from mise.jdx.dev.** `curl https://mise.run | MISE_VERSION=<version> sh` now tries mise.jdx.dev first and falls back to GitHub Releases if that download fails. Checksums for pinned versions still come only from GitHub's `SHASUMS256.txt`. If no checksum is found, the script refuses to install. `MISE_INSTALL_FROM_GITHUB=1` still uses GitHub only. [#14446](https://github.com/jdx/mise/pull/14446)\n- Registry: `gdal` installs the GDAL/OGR command-line tools from conda-forge (`conda:libgdal-core`). [#14440](https://github.com/jdx/mise/pull/14440) (@ivan-ivkovic)\n\n## Fixed\n\n- **A bare `mise upgrade` no longer installs lazy tools that have never been installed.** Naming the tool still installs it. A lazy tool that already has a version installed upgrades as before. A missing lazy tool is still installed if an upgraded tool depends on it. `mise outdated` now marks these tools as `[MISSING] (lazy)`, and the bare upgrade no longer looks up their versions. [#14422](https://github.com/jdx/mise/pull/14422) (@ryanrhughes), [#14444](https://github.com/jdx/mise/pull/14444)\n- Fixed false `stack limit reached` errors on the static musl builds, for example on Ubuntu 26.04. These errors broke aqua `version_filter` parsing and made shims such as kubectl's report \"not a valid shim\". [#14450](https://github.com/jdx/mise/pull/14450)\n- `mise lock --platform ...` run on Alpine or NixOS no longer records Node source builds for other platforms. Only an explicit `node.compile` or `all_compile = true` forces source builds for those targets. [#14432](https://github.com/jdx/mise/pull/14432)\n- `mise upgrade --bump` and hand-edited version pins no longer drop a pipx tool's locked uv dependency graph. Before, `mise install --locked` then failed on a fresh checkout. [#14426](https://github.com/jdx/mise/pull/14426) (@wislertt)\n- Packslip prefixes such as `fnox@1` now skip releases this host can't install, the same way `latest` does. Each skipped release gets a warning, and if no match can be installed, mise reports a clear error. [#14467](https://github.com/jdx/mise/pull/14467)\n- A `bash` shim ahead of `/bin` no longer causes a false \"shim fallback recursion detected\" error for commands like `bash -c 'bash --version'`. The docs now recommend installing shells with the system package manager instead of `[tools]`. [#14475](https://github.com/jdx/mise/pull/14475)\n- Bootstrap UFW rules with an `interface` now render the incoming direction (`ufw allow in on tailscale0 ...`), which fixes `Invalid token 'on'` errors. [#14480](https://github.com/jdx/mise/pull/14480)\n- Dotfiles:\n  - Before the `files: apply` prompt, mise now lists each file it will create, overwrite or remove and warns that local edits will be replaced. The prompt now defaults to No. [#14430](https://github.com/jdx/mise/pull/14430)\n  - `mise dot add --changed` now also captures edited files that a copy-mode `dotfile_groups` root discovers automatically, not just files listed explicitly in `entries`. [#14436](https://github.com/jdx/mise/pull/14436)\n\n## Documentation\n\n- The docs now recommend committing `mise.lock`, so CI and Docker builds skip version lookups. [#14453](https://github.com/jdx/mise/pull/14453)\n\n## New Contributors\n\n* @ivan-ivkovic made their first contribution in [#14440](https://github.com/jdx/mise/pull/14440)\n\n**Full Changelog**: https://github.com/jdx/mise/compare/v2026.10.10...v2026.10.11\n\n## \ud83d\udc9a Sponsor mise\n\nmise is built and maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.\n\nIf mise saves you or your team time, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep mise fast, free, and independent.\n\n","reactions":{"total_count":10,"+1":4,"-1":0,"laugh":0,"hooray":5,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":5}
