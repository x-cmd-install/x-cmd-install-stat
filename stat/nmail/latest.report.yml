d support for built-in html email conversion\r\n- add support for selecting and opening links in html message view\r\n- add support for selecting and opening links in plain text message view\r\n- add support for upgrading pre-built release binary\r\n- add support for saving message as text or markdown\r\n- add markdown text styling, configurable text attributes and new themes\r\n- add compact message view header showing names only\r\n- add command line option for installing bundled themes\r\n- add improved setup wizard and special folders detection\r\n- add configurable idle_delay_sec\r\n- fix build on freebsd\r\n- fix build on openbsd\r\n- fix custom regular text color not being applied\r\n- fix charset detection in pre-built binaries\r\n- fix single-char help key padding in list, compose and prompt views\r\n- fix raw html passthrough in markdown compose\r\n- fix unexpected hdr content warning when sending queued messages\r\n- improve oauth2 login robustness\r\n- change default message view to html\r\n- trim leading blank lines in message view\r\n- align message view header labels as in compose\r\n","reactions":{"total_count":5,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":1,"rocket":1,"eyes":1}}
