g in https://github.com/zerobrewhq/zerobrew/pull/459\n* ci: make the timing job faster and fix the nightly by @cachebag in https://github.com/zerobrewhq/zerobrew/pull/460\n* chore(ci): rename `master` to `main` for brew actions by @cachebag in https://github.com/zerobrewhq/zerobrew/pull/462\n* feat(zb_io): add with_env to the formula shim by @cutiechi in https://github.com/zerobrewhq/zerobrew/pull/461\n* fix(deps): bump rustls to 0.23.46 by @cachebag in https://github.com/zerobrewhq/zerobrew/pull/465\n* chore: prepare 0.4.1 release by @cachebag in https://github.com/zerobrewhq/zerobrew/pull/467\n\n## New Contributors\n* @Linuxdazhao made their first contribution in https://github.com/zerobrewhq/zerobrew/pull/455\n* @cutiechi made their first contribution in https://github.com/zerobrewhq/zerobrew/pull/454\n\n**Full Changelog**: https://github.com/zerobrewhq/zerobrew/compare/v0.4.0...v0.4.1","mentions_count":3}
