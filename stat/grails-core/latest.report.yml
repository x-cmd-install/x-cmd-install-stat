:42:58Z"},{"id":610406514,"node_id":"RA_kwDOAAfRJ84kYhBy","name":"apache-grails-wrapper-8.0.0-bin.zip.asc","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-keys","state":"uploaded","size":833,"digest":"sha256:ef645aa511b806c128953c80f0bcffd159c66d86216e9b7c28de697cf4dfa047","download_count":7,"created_at":"2026-10-04T18:42:57Z","updated_at":"2026-10-04T18:42:58Z"},{"id":610406516,"node_id":"RA_kwDOAAfRJ84kYhB0","name":"apache-grails-wrapper-8.0.0-bin.zip.sha512","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":166,"digest":"sha256:f1e4ce19d2bf30c828c06c7b25faed9fea108a133b66199547d388eb366d16bf","download_count":9,"created_at":"2026-10-04T18:42:57Z","updated_at":"2026-10-04T18:42:58Z"},{"id":610442091,"node_id":"RA_kwDOAAfRJ84kYptr","name":"DIST_SVN_REVISION.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":473,"digest":"sha256:c54ac006f6932b21f945bef870a7cd1622cc79a44d27662bc339701c1c65ca8b","download_count":1,"created_at":"2026-10-04T19:02:09Z","updated_at":"2026-10-04T19:02:09Z"}],"body":"## What's Changed\r\n\r\n- 8.0 (fix): Show every container filter in chain order on the welcome page, and add a grails-compile-static Forge feature @codeconsole (#16499)\r\n- Implement sqlRestriction for Hibernate 7 criteria queries @matrei (#16505)\r\n- Upgrade Asset Pipeline to 5.2.0 @jdaugherty (#16514)\r\n- Save a multi-tenant instance under the current tenant again @matrei (#16511)\r\n- Return joined entities and native query entities from Hibernate 7 HQL and SQL queries @matrei (#16506)\r\n- Fix Hibernate 7 criteria, lock mode and BOM bugs @matrei (#16500)\r\n- Rethrow TenantNotFoundException from the multi-tenant event listener @matrei (#16509)\r\n- Apply the GORM session flush mode to the bound Hibernate 7 session @matrei (#16504)\r\n- Fix the Hibernate 5 mapWith check and withFlushMode, and remove a dead Integrator file @matrei (#16501)\r\n- Fix the Hibernate 7 mapWith check and withFlushMode, and remove a dead Integrator file @matrei (#16502)\r\n- Give Hibernate 5 templates the configured flush mode @matrei (#16503)\r\n- Run every feature of the TCK CrudOperationsSpec @matrei (#16507)\r\n- Use the right `@since` for the classes of GORM for Hibernate 7 @matrei (#16508)\r\n- 8.0 (fix): Let a GORM for MongoDB application be checkpointed as its context refreshes @codeconsole (#16495)\r\n- 8.0 (fix): Register the GORM for MongoDB Spring Boot auto-configuration where Spring Boot reads it @codeconsole (#16496)\r\n- 8.0 (fix): Stop '*' defaults discarding property mappings and duplicate keys ending the index build + Index Cleanup Support @codeconsole (#16494)\r\n- Upgrade SiteMesh to 3.3.0 @codeconsole (#16498)\r\n- Fix `TEMPLATE_MODEL` leak after forward to another controller action @ruthst00 (#16492)\r\n- Restore subclass command binding in compatibility mode @jdaugherty (#16491)\r\n- Composite key issues @jdaugherty (#16485)\r\n- Hibernate 7: accept a Class as the type of a 'user-type' mapping @jdaugherty (#16480)\r\n- Type Hibernate 7 comparison values from the property they compare with @jdaugherty (#16479)\r\n- Keep mock response output lazy after reset @jdaugherty (#16490)\r\n- Restore Hibernate validation error-reset semantics @jdaugherty (#16489)\r\n- 8.0 (fix): Point development reloading at the build's own classes and resources directories @codeconsole (#16472)\r\n- Keep the Close Release job going when post-release fails @jdaugherty (#16488)\r\n- Update Grails 8 Upgrade skill based on application upgrade @jdaugherty (#16493)\r\n- Updated `getModel()` with fallback: when no `ModelAndView` is set in the request. @ruthst00 (#16453)\r\n- Document the dataSource defaults that are actually applied @matrei (#16457)\r\n- Register the default dataSource bean without dataSource configuration @matrei (#16458)\r\n- Link guide cross references to the chapter page that holds their target @matrei (#16476)\r\n- Start every context of a GrailsAppBuilder hierarchy with a GrailsApp @jdaugherty (#16462)\r\n- Preserve servlet Errors through interceptor completion @jdaugherty (#16467)\r\n- Close the constant-text gaps in the query safety check and keep its cost linear in nesting depth @matrei (#16482)\r\n- Apply the configured nullable default to properties copied with importFrom @matrei (#16474)\r\n- Attach Hibernate 7 proxies created by `proxy(id)` to the current session @matrei (#16484)\r\n- Backport #16154 to 8.0.x: replace finders inheritance hierarchy with composition @jdaugherty (#16478)\r\n- Split `grails.mail.overrideAddress` into separate to/from overrides. @ruthst00 (#16452)\r\n- Preserve custom identifier generators in mapping metadata @jdaugherty (#16468)\r\n- Fix guide cross references that name no section @matrei (#16477)\r\n- Hibernate 7: return subclass rows when querying an intermediate class @jdaugherty (#16470)\r\n- Make the XML-safe HTML encoder the default for grails.views.gsp.htmlcodec @matrei (#16460)\r\n- Recognise constant HQL fragments and declaration-level suppression in the query safety check @jdaugherty (#16463)\r\n- Hibernate 7: restore the class discriminator column with fully qualified names @jdaugherty (#16471)\r\n- Honor configured nullable defaults in domain unit tests @jdaugherty (#16466)\r\n- Expand resource patterns when converting to Resource[] @jdaugherty (#16469)\r\n- Find plugin metadata in the resources directory of the Gradle build in config-report @matrei (#16450)\r\n- ci: give each pull request its own release drafter run @codeconsole (#16213)\r\n- Upgrade Asset Pipeline to 5.2.0-RC4 @jdaugherty (#16449)\r\n- Add proxy package test coverage and fix IntelliJ inspections in grails-datamapping-core @borinquenkid (#16155)\r\n- Document Deployment Mechanisms & Production Considerations @Ajay9704 (#15338)\r\n- Bump aws-actions/configure-aws-credentials from 6.2.3 to 6.3.0 @[dependabot[bot]](https://github.com/apps/dependabot) (#16442)\r\n- build: guard against duplicate classes using dependency analysis plugin @sanjana2505006 (#15341)\r\n- Bump codecov/codecov-action from 7.0.0 to 7.1.1 @[dependabot[bot]](https://github.com/apps/dependabot) (#16443)\r\n- Bump testlens-app/setup-testlens from 1.9.3 to 1.9.4 @[dependabot[bot]](https://github.com/apps/dependabot) (#16446)\r\n- Fix the two causes of the intermittent Neo4j functional test failures @jdaugherty (#16436)\r\n- Bump softprops/action-gh-release from 3.0.2 to 3.0.3 @[dependabot[bot]](https://github.com/apps/dependabot) (#16447)\r\n- Bump release-drafter/release-drafter from 7.3.1 to 7.7.0 @[dependabot[bot]](https://github.com/apps/dependabot) (#16448)\r\n- Bump github/codeql-action to v4.38.2 and group its Dependabot updates @jdaugherty (#16437)\r\n- Resolve configured messageSource basenames ahead of discovered bundles (#11795) @jdaugherty (#14753)\r\n- Include the configuration metadata of plugins in config-report @matrei (#16434)\r\n- test: pause in the first recording test of PerTestRecordingSpec @matrei (#16435)\r\n- test: raise coverage in grails-data-hibernate7 @borinquenkid (#16278)\r\n- Explain the missing application class in tasks that need one @matrei (#16433)\r\n\r\n## \ud83d\ude80 Features\r\n\r\n- Improve type hints in web unit test support classes @matrei (#16093)\r\n\r\n## Contributors\r\n\r\n@Ajay9704, @borinquenkid, @codeconsole, @jdaugherty, @matrei, @ruthst00, @sanjana2505006, [@dependabot[bot]](https://github.com/apps/dependabot), @claude, @jamesfredley and @robertoschwald\r\n","mentions_count":10}
