h_x86-64_windows.exe","label":null,"uploader":{"login":"Dr-Noob","id":22979883,"node_id":"MDQ6VXNlcjIyOTc5ODgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":261095,"digest":"sha256:4d2337ab8b938176599ed40ad17b8e0c5bf12cfda0cea08dc9ff5658a0c67574","download_count":2484,"created_at":"2025-11-01T07:13:10Z","updated_at":"2025-11-01T07:13:11Z"},{"id":311238298,"node_id":"RA_kwDOB4l3v84SjR6a","name":"cpufetch_x86_linux","label":null,"uploader":{"login":"Dr-Noob","id":22979883,"node_id":"MDQ6VXNlcjIyOTc5ODgz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1171084,"digest":"sha256:6732ff270972a0bfce152d70609c6fe9c8faa82c61b5992abd3086e91b622f90","download_count":111,"created_at":"2025-11-01T07:13:09Z","updated_at":"2025-11-01T07:13:09Z"}],"body":"| File                        | Architecture     | OS        | Min. OS    | Statically linked   |\r\n|-------------------------    |------------------|-----------|:----------:|:-------------------:|\r\n| cpufetch_arm64_android      | ARM (64 bit)     | Android   | -          | No                  |\r\n| cpufetch_arm64_linux        | ARM (64 bit)     | GNU/Linux | 3.7.0      | Yes                 |\r\n| cpufetch_x86-64_linux       | x86 (64 bit)     | GNU/Linux | 4.4.0      | Yes                 |\r\n| cpufetch_x86_linux          | x86 (32/64 bit)  | GNU/Linux | 4.4.0      | Yes                 |\r\n| cpufetch_x86-64_windows.exe | x86 (64 bit)     | Windows   | -          | Yes                 |\r\n\r\n**Changelog:**\r\n- [Apple] Implement fallback frequency calculation (#251)\r\n- [X86] Add old Intel and AMD CPUs (#260)\r\n- [X86] Fix 2 bugs in --accurate-pp\r\n- [ARM] Add (experimental) Windows on Arm support (#273)\r\n- [ARM] Add support for *a lot* of new SoCs\r\n- [ARM] Add automatic SoC inferring from device tree (**)\r\n- [RISCV] Significantly improved support for RISC-V, specially uarch detection and multi-letter extension support.\r\n\r\n** This was a response for the large number of ARM SoCs out there. It's not realistic to detect one by one manually so we needed some automatic approach to make the SoC detection a bit more scalable.\r\n\r\nThis release also fixes some bugs, adds small features and adds support for some new hardware. See the commit list for more details.\r\n\r\n**Notes:** \r\n- GNU/Linux versions also work on Android, but they detect fewer features than the Android version.","reactions":{"total_count":12,"+1":4,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":2,"rocket":1,"eyes":1}}
