T09:59:08Z"},{"id":154171262,"node_id":"RA_kwDOFAg02c4JMHd-","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":114420,"digest":null,"download_count":21,"created_at":"2024-02-29T09:59:07Z","updated_at":"2024-02-29T09:59:07Z"},{"id":154171260,"node_id":"RA_kwDOFAg02c4JMHd8","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"raw","state":"uploaded","size":80,"digest":null,"download_count":4,"created_at":"2024-02-29T09:59:06Z","updated_at":"2024-02-29T09:59:07Z"}],"body":"## Release Notes\n\n### Added\n\n- This changelog file\n- Option `--round` for `list` and `report` to round start and end times (thanks to [@berkes](https://github.com/berkes))\n- Subcommand `change` to modify the currently running activity\n- Subcommand `sanity` for several sanity checks on the bartib log (thanks to [@lukasdietrich](https://github.com/lukasdietrich))\n- Compact mode `--compact` for `projects` - list currently running projects only\n- GitHub Actions for tests (thanks to [@Ernaldis](https://github.com/Ernaldis))\n\n### Changed\n\n- `--project` filters for `list` and `report` now support wildcards (thanks to [@simonsan](https://github.com/simonsan))\n- Display activities where start and end time is the same with a duration of \"&lt;1m\" ([issue #24](https://github.com/nikolassv/bartib/issues/24) - thanks to [@julianmatos97](https://github.com/julianmatos97))\n- Do not display the number of days in durations - [issue #12](https://github.com/nikolassv/bartib/issues/12)\n- Many minor adjustments to the documentation\n\n## Install bartib 1.1.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\nirm https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-installer.ps1 | iex\n```\n\n## Download bartib 1.1.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [bartib-aarch64-apple-darwin.tar.xz](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-aarch64-apple-darwin.tar.xz.sha256) |\n| [bartib-x86_64-apple-darwin.tar.xz](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-apple-darwin.tar.xz.sha256) |\n| [bartib-x86_64-pc-windows-msvc.zip](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-pc-windows-msvc.zip.sha256) |\n| [bartib-x86_64-pc-windows-msvc.msi](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-pc-windows-msvc.msi) | x64 Windows | [checksum](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-pc-windows-msvc.msi.sha256) |\n| [bartib-x86_64-unknown-linux-gnu.tar.xz](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/nikolassv/bartib/releases/download/v1.1.0/bartib-x86_64-unknown-linux-gnu.tar.xz.sha256) |","reactions":{"total_count":3,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":2,"eyes":0}}
