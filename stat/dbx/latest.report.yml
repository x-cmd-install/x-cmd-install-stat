tate":"uploaded","size":33611776,"digest":"sha256:2bf766ba7e73a248667541a333269a0e84385b5b08784b92c25782f73bffd2ad","download_count":45,"created_at":"2026-09-22T15:31:33Z","updated_at":"2026-09-22T15:31:35Z"},{"id":581690954,"node_id":"RA_kwDOSPdiBc4iq-ZK","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":38257552,"digest":"sha256:ada4e6b12110c8663dd23ce98eef31805e210e249f0d09c460f6fb73653dc049","download_count":37,"created_at":"2026-09-22T15:35:05Z","updated_at":"2026-09-22T15:35:07Z"},{"id":581776437,"node_id":"RA_kwDOSPdiBc4irTQ1","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":19151,"digest":"sha256:b110c75fb24e16edc82a704e1582496b74022373b7ce6f46956d01c47a015fae","download_count":10360,"created_at":"2026-09-22T16:23:47Z","updated_at":"2026-09-22T16:23:47Z"}],"body":"### \u8d5e\u52a9\u4fe1\u606f\n\n- \u534e\u9f99\u7b97\u529bAI\u4e2d\u8f6c\u7ad9\u559c\u8fce\u4e2d\u79cb\u56fd\u5e86\u6d3b\u52a8\uff1a\u5145\u503c 88 \u5143\u5f97 100 \u5143\u989d\u5ea6\uff0c\u6bcf\u4eba\u9650 1 \u5355\uff0c[\u6d3b\u52a8\u5165\u53e3](https://dbx.hualong.online/)\n\n### \u65b0\u529f\u80fd\n\n- \u4e3b\u7a97\u53e3\u4e0e\u5206\u79bb\u51fa\u7684\u6807\u7b7e\u7a97\u53e3\u652f\u6301\u7a97\u53e3\u7f6e\u9876 (contributed by @Mo-Moore) (PR [#10001](https://github.com/t8y2/dbx/pull/10001))\n- \u4fa7\u8fb9\u680f\u8868\u5206\u7ec4\u6269\u5c55\u5230\u89c6\u56fe\u3001\u5b58\u50a8\u8fc7\u7a0b\u3001\u51fd\u6570\u3001\u89e6\u53d1\u5668\u7b49\u5168\u90e8\u5bf9\u8c61\u5bb9\u5668\uff0c\u5747\u53ef\u5efa\u7ec4\u3001\u62d6\u62fd\u548c\u6301\u4e45\u5316 (contributed by @alex-1263) (PR [#9890](https://github.com/t8y2/dbx/pull/9890))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u81ea\u52a8\u6362\u884c\u5de5\u5177\u680f\u6309\u94ae\uff0c\u957f\u8bed\u53e5\u53ef\u4e00\u952e\u6298\u884c\u663e\u793a (contributed by @caichangqing1120) (PR [#9949](https://github.com/t8y2/dbx/pull/9949))\n- \u6570\u636e\u7f51\u683c\u5217\u7b5b\u9009\u9762\u677f\u65b0\u589e\u300c\u81ea\u52a8\u9002\u914d\u5217\u5bbd\u300d\uff0c\u4e00\u952e\u6309\u5185\u5bb9\u6491\u5f00\u5168\u90e8\u5217 (PR [#9862](https://github.com/t8y2/dbx/pull/9862))\n- MongoDB \u67e5\u8be2\u7ed3\u679c\u7f51\u683c\u652f\u6301\u76f4\u63a5\u5220\u9664\u9009\u4e2d\u7684\u6587\u6863\u884c (contributed by @onenewcode) (PR [#9951](https://github.com/t8y2/dbx/pull/9951))\n- MongoDB \u5e93\u8868\u89c6\u56fe\u7684\u884c\u6570\u4e0e\u5360\u7528\u5927\u5c0f\u5217\u5728\u4f7f\u7528 legacy Agent \u7684\u8fde\u63a5\u4e0a\u4e5f\u80fd\u6b63\u5e38\u663e\u793a (contributed by @thailoc-dev) (PR [#9925](https://github.com/t8y2/dbx/pull/9925))\n- \u63d2\u4ef6\u53ef\u4ee5\u628a\u9009\u4e2d\u6570\u636e\u53d1\u9001\u5230\u5185\u7f6e AI \u9762\u677f\u5206\u6790\uff0c\u4f1a\u8bdd\u4fdd\u7559\u5728\u9762\u677f\u4e2d\u53ef\u7ee7\u7eed\u8ffd\u95ee\u548c\u5bfc\u51fa (PR [#9157](https://github.com/t8y2/dbx/pull/9157))\n- \u63d2\u4ef6 API \u652f\u6301\u5728\u4fa7\u8fb9\u680f\u8868\u8282\u70b9\u4e0a\u6ce8\u518c\u81ea\u5b9a\u4e49\u53f3\u952e\u83dc\u5355\u9879 (contributed by @0verme) (PR [#9923](https://github.com/t8y2/dbx/pull/9923))\n- Nacos \u65b0\u589e\u5168\u5c40\u5185\u5bb9\u66ff\u6362\uff0c\u652f\u6301\u8de8 Data ID \u9884\u89c8\u5dee\u5f02\u3001\u53d1\u5e03\u6821\u9a8c\u4e0e\u53ef\u56de\u6eda\u7684\u6279\u6b21\u5386\u53f2 (contributed by @xiaochouwei) (PR [#9328](https://github.com/t8y2/dbx/pull/9328))\n- \u6570\u636e\u5e93\u5bfc\u51fa\u8865\u5145\u89e6\u53d1\u5668\u4e0e\u4e8b\u4ef6\u5bf9\u8c61 (PR [#9930](https://github.com/t8y2/dbx/pull/9930))\n- DDL \u751f\u6210\u300c\u53bb\u6389\u5b58\u50a8\u5c5e\u6027\u300d\u9009\u9879\u5bf9 Oracle \u751f\u6548 (PR [#9932](https://github.com/t8y2/dbx/pull/9932))\n- SQL \u7f16\u8f91\u5668\u652f\u6301\u6298\u53e0 IN/VALUES \u7b49\u503c\u5217\u8868\uff0c\u5e76\u53ef\u4ece\u884c\u53f7\u69fd\u5feb\u901f\u6267\u884c\u9009\u4e2d\u8bed\u53e5 (contributed by @jasonchen8068) (PR [#10037](https://github.com/t8y2/dbx/pull/10037))\n\n### \u6539\u8fdb\n\n- \u6253\u5f00\u6570\u636e\u8868\u6216\u6267\u884c SQL \u65f6\u540e\u53f0\u9884\u70ed\u4f1a\u8bdd\u6c60\uff0c\u5efa\u8fde\u63a5\u4e0e\u8868\u7ed3\u6784\u52a0\u8f7d\u5e76\u884c\uff0c\u9996\u6b21\u52a0\u8f7d\u660e\u663e\u66f4\u5feb\uff0c\u6267\u884c\u6458\u8981\u4e5f\u6539\u4e3a\u4e0a\u62a5\u7528\u6237\u5b9e\u9645\u7b49\u5f85\u7684\u8017\u65f6 (PR [#9623](https://github.com/t8y2/dbx/pull/9623))\n- \u8868\u4fe1\u606f DDL \u641c\u7d22\u6539\u4e3a\u5728\u5df2\u6e32\u67d3\u5185\u5bb9\u4e0a\u6253\u6807\u8bb0\uff0c\u957f DDL \u9010\u5b57\u641c\u7d22\u4e0d\u518d\u53cd\u590d\u91cd\u65b0\u7740\u8272 (PR [#9926](https://github.com/t8y2/dbx/pull/9926))\n- \u5927\u578b SQL \u811a\u672c\u6267\u884c\u4e0d\u518d\u91cd\u590d\u5168\u91cf\u626b\u63cf\u8bed\u53e5\u8303\u56f4\uff0c\u957f\u811a\u672c\u6267\u884c\u66f4\u6d41\u7545\n- SQL \u6587\u4ef6\u6267\u884c\u5bf9\u8bdd\u6846\u5728\u8fdb\u5ea6\u5237\u65b0\u65f6\u7f13\u5b58\u9884\u89c8\u9ad8\u4eae\uff0c\u957f\u6587\u4ef6\u6267\u884c\u4e2d\u754c\u9762\u4e0d\u518d\u53cd\u590d\u91cd\u6e32\u67d3\n- SQL \u81ea\u52a8\u8865\u5168\u7684\u8bed\u53e5\u5757\u626b\u63cf\u9650\u5b9a\u5728\u5f53\u524d\u6d3b\u52a8\u8bed\u53e5\uff0c\u5927\u811a\u672c\u4e2d\u8865\u5168\u4e0d\u518d\u5361\u987f\n- \u67e5\u8be2\u7ed3\u679c\u7f13\u5b58\u7f16\u7801\u51cf\u5c11\u91cd\u590d\u6570\u636e\u62f7\u8d1d\uff0c\u5927\u7ed3\u679c\u96c6\u4e0b\u5185\u5b58\u4e0e CPU \u5f00\u9500\u66f4\u4f4e\n- \u63d0\u9ad8\u6570\u636e\u884c\u9009\u4e2d\u6001\u7684\u989c\u8272\u5bf9\u6bd4\u5ea6\uff0c\u9009\u4e2d\u5355\u5143\u683c\u8fb9\u6846\u52a0\u6df1\u5e76\u4e0e\u4e3b\u9898\u8272\u5bf9\u9f50 (contributed by @leekeep) (PR [#8603](https://github.com/t8y2/dbx/pull/8603))\n\n### \u4fee\u590d\n\n- MySQL \u6267\u884c EXECUTE \u52a8\u6001\u8bed\u53e5\u7684\u7ed3\u679c\u96c6\u4e0d\u518d\u88ab\u4e22\u5f03 (PR [#10016](https://github.com/t8y2/dbx/pull/10016))\n- MySQL \u5b58\u50a8\u8fc7\u7a0b\u652f\u6301\u624b\u52a8\u5237\u65b0\uff0c\u4fdd\u5b58\u5931\u8d25\u65f6\u4e0d\u518d\u4e22\u5931\u7f16\u8f91\u524d\u7684\u539f\u8fc7\u7a0b (contributed by @Mo-Moore) (PR [#9965](https://github.com/t8y2/dbx/pull/9965))\n- MySQL \u8868\u884c\u6570\u7edf\u8ba1\u7981\u7528\u4f1a\u8bdd\u7ea7\u7f13\u5b58\uff0c\u5bf9\u8c61\u5217\u8868\u884c\u6570\u6062\u590d\u540e\u80fd\u6b63\u5e38\u5237\u65b0 (PR [#9927](https://github.com/t8y2/dbx/pull/9927))\n- MySQL \u517c\u5bb9\u4e0d\u652f\u6301 utf8mb4 \u7684\u8001\u670d\u52a1\u7aef\uff0c\u5efa\u8fde\u4e0d\u518d\u62a5 Unknown character set (PR [#9929](https://github.com/t8y2/dbx/pull/9929))\n- MySQL \u6267\u884c USE \u8bed\u53e5\u540e\u6807\u7b7e\u9875\u5e93\u540d\u8ddf\u968f\u4f1a\u8bdd\u5207\u6362 (PR [#9961](https://github.com/t8y2/dbx/pull/9961))\n- MySQL \u81ea\u52a8\u63d0\u4ea4\u6807\u7b7e\u9875\u65b0\u589e\u53ef\u9009\u8bbe\u7f6e\uff0c\u5f00\u542f\u540e\u8de8\u6b21\u6267\u884c\u4fdd\u7559\u663e\u5f0f\u4e8b\u52a1\uff0c\u4e0d\u518d\u9759\u9ed8\u56de\u6eda\u7528\u6237\u7684 START TRANSACTION (PR [#9784](https://github.com/t8y2/dbx/pull/9784))\n- MySQL \u8fde\u63a5 Gaea \u4e2d\u95f4\u4ef6\u65f6 group concat \u521d\u59cb\u5316\u89e3\u6790\u5931\u8d25\u4f1a\u81ea\u52a8\u91cd\u8bd5 (contributed by @caichangqing1120) (PR [#9999](https://github.com/t8y2/dbx/pull/9999))\n- MySQL \u8fde\u63a5 Doris\u3001PolarDB-X \u7b49\u62d2\u7edd group concat \u8bbe\u7f6e\u8bed\u53e5\u65f6\u81ea\u52a8\u964d\u7ea7\u91cd\u8bd5\uff0c\u4e0d\u518d\u76f4\u63a5\u8fde\u63a5\u5931\u8d25\n- PostgreSQL \u540c\u6b65 DDL \u65f6\u4fdd\u7559\u8868\u8fbe\u5f0f\u7d22\u5f15\u5b8c\u6574\u5b9a\u4e49\u4e0e\u7d22\u5f15\u952e\u6392\u5e8f (PR [#10011](https://github.com/t8y2/dbx/pull/10011))\n- PostgreSQL/openGauss \u8fde\u63a5\u4fdd\u7559 Oracle \u98ce\u683c\u4f8b\u7a0b\u4f53\uff0cGaussDB/openGauss A \u517c\u5bb9\u5b9e\u4f8b\u7684\u5b58\u50a8\u8fc7\u7a0b\u4e0d\u518d\u6267\u884c\u62a5\u9519 (PR [#9928](https://github.com/t8y2/dbx/pull/9928))\n- SQL Server \u6267\u884c IF/ELSE \u63a7\u5236\u6d41\u6279\u6b21\u4e0d\u518d\u88ab\u62c6\u6563\uff0c\u6574\u6279\u4fdd\u6301\u5728\u540c\u4e00\u6267\u884c\u8303\u56f4 (PR [#9758](https://github.com/t8y2/dbx/pull/9758))\n- MongoDB \u5728\u4f7f\u7528 legacy Agent \u7684\u8fde\u63a5\u4e0a\u63d0\u4f9b\u91cd\u547d\u540d\u96c6\u5408\u64cd\u4f5c (contributed by @thailoc-dev) (PR [#9924](https://github.com/t8y2/dbx/pull/9924))\n- \u53ea\u8bfb\u8fde\u63a5\u6267\u884c\u542b REPLACE()/INSERT() \u6807\u91cf\u51fd\u6570\u7684\u67e5\u8be2\u4e0d\u518d\u88ab\u8bef\u5224\u4e3a\u5199\u64cd\u4f5c (PR [#10007](https://github.com/t8y2/dbx/pull/10007))\n- \u6570\u5b57\u5f00\u5934\u7684\u4e0d\u52a0\u5f15\u53f7\u8868\u540d\uff08\u5982 01_table\uff09\u4e0d\u518d\u88ab\u5224\u4e3a\u53ea\u8bfb\uff0c\u60ac\u505c\u4e5f\u80fd\u6b63\u5e38\u663e\u793a\u8868\u7ed3\u6784 (PR [#10020](https://github.com/t8y2/dbx/pull/10020))\n- \u514b\u9686\u8868\u4e0e\u7c98\u8d34\u8868\u7ed3\u6784\u7684\u515c\u5e95 DDL \u6539\u7528\u5e03\u5c14\u5047\u8c13\u8bcd\uff0c\u701a\u9ad8\u3001Kingbase \u7b49 PG \u7cfb\u5f15\u64ce\u4e0d\u518d\u5efa\u8868\u5931\u8d25 (PR [#10013](https://github.com/t8y2/dbx/pull/10013))\n- \u6570\u636e\u4f20\u8f93\u5230 Oracle \u8bed\u6cd5\u65cf\u76ee\u6807\u65f6\u6587\u672c\u7c7b\u578b\u6539\u7528 CLOB\uff0cOracle\u2192OceanBase\u3001MySQL\u2192Oracle \u5efa\u8868\u4e0d\u518d\u62a5\u9519 (PR [#9933](https://github.com/t8y2/dbx/pull/9933))\n- \u6570\u636e\u4f20\u8f93\u5f00\u59cb\u786e\u8ba4\u5bf9\u8bdd\u6846\u4e0d\u518d\u91cd\u590d\u663e\u793a MySQL \u6570\u636e\u5e93\u540d (contributed by @onenewcode) (PR [#9969](https://github.com/t8y2/dbx/pull/9969))\n- \u6570\u636e\u5e93\u5bfc\u51fa\u7684\u5143\u6570\u636e\u9884\u53d6\u6309\u4f1a\u8bdd\u6c60\u5b9e\u9645\u5bb9\u91cf\u6536\u655b\u5e76\u53d1\u