d159c68694ee463612f46bc5","download_count":26,"created_at":"2026-11-05T03:12:14Z","updated_at":"2026-11-05T03:12:17Z"},{"id":711873449,"node_id":"RA_kwDOSPdiBc4qblOp","name":"DBX_0.6.66_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":44810240,"digest":"sha256:94e54c689752aa15b680b7fa66215364c8e68b400155674a3d8f34f03d50ec14","download_count":24,"created_at":"2026-11-05T03:12:28Z","updated_at":"2026-11-05T03:12:30Z"},{"id":710731465,"node_id":"RA_kwDOSPdiBc4qXObJ","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":49975446,"digest":"sha256:868e6fb02707d962f888465072e8440f9d7609d469e74c865dc15be0838c6548","download_count":69,"created_at":"2026-11-04T19:56:56Z","updated_at":"2026-11-04T19:56:59Z"},{"id":711912571,"node_id":"RA_kwDOSPdiBc4qbux7","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":20567,"digest":"sha256:581c013acfe697a506c079a5c5075cedca50bcc86e325b4e37070308e2232f75","download_count":5042,"created_at":"2026-11-05T03:27:55Z","updated_at":"2026-11-05T03:27:55Z"}],"body":"### 新功能\n\n- 数据库导出选表支持粘贴逗号分隔的表名批量匹配勾选，并可用正则表达式筛选表名 (contributed by @chukui2005) (PR [#14293](https://github.com/t8y2/dbx/pull/14293))\n- Kingbase SQL 编辑器支持手动提交与自动提交切换 (contributed by @Gaiokane) (PR [#14249](https://github.com/t8y2/dbx/pull/14249))\n- 快速查询栏新增「复制 SQL」按钮，可复制包含当前筛选、排序和分页的查询 SQL (contributed by @Acd-kk) (PR [#14203](https://github.com/t8y2/dbx/pull/14203))\n- 查询页连接选择器同步显示连接配置的颜色，便于区分生产、测试等环境 (contributed by @imcman) (PR [#14256](https://github.com/t8y2/dbx/pull/14256))\n- SQL 补全匹配模式可在设置 → 编辑器中配置，新增严格连续匹配（含拼音首字母）选项，默认保持原有模糊匹配 (contributed by @zhongtait) (PR [#13833](https://github.com/t8y2/dbx/pull/13833))\n- 侧边栏布局被其他进程（MCP 服务器、CLI）改写后自动刷新，不再需要重启才能看到变化 (contributed by @reginaldoroge) (PR [#13607](https://github.com/t8y2/dbx/pull/13607))\n- CSV 导出新增「UTF-8 无 BOM」开关，默认仍保留 BOM 以兼容旧消费方 (contributed by @xingxingshese) (PR [#14190](https://github.com/t8y2/dbx/pull/14190))\n- 已完成的数据传输任务可按原配置一键重新执行，无需重新配置 (contributed by @lxk955) (PR [#13796](https://github.com/t8y2/dbx/pull/13796))\n- 表信息面板的字段列表支持按字段名、类型、可空和默认值排序，仅改变展示顺序 (contributed by @eryajf) (PR [#14201](https://github.com/t8y2/dbx/pull/14201))\n- SQL Server 导出和网格复制 SQL 时空间列（geometry/geography）改用 STGeomFromText 生成可直接执行的语句 (contributed by @lxk955) (PR [#11798](https://github.com/t8y2/dbx/pull/11798))\n- 侧边栏边缘悬停展开新增关闭开关和 100–2000 毫秒可配置延迟 (contributed by @r9yn) (PR [#14169](https://github.com/t8y2/dbx/pull/14169))\n\n### 改进\n\n- 数据表格的删除行、删除列操作统一收入「危险操作」子菜单，删除列仅在字段表头右键时显示，降低误操作风险 (contributed by @eryajf) (PR [#14205](https://github.com/t8y2/dbx/pull/14205))\n- 标签页外观设置在宽屏下改为两行网格排列并移除底部集中说明，长选项不再被截断 (contributed by @zipg) (PR [#14160](https://github.com/t8y2/dbx/pull/14160))\n- 连接配置弹窗统一宽度并对齐高级页字段，超时选项不再异常换行 (contributed by @zipg) (PR [#14197](https://github.com/t8y2/dbx/pull/14197))\n- 设置中展示的社区 QQ 群号更新为 244975070\n\n### 修复\n\n- 修复 MySQL 查询引用会话变量时「总计 0 行」统计错误的问题，此类查询不再生成 COUNT 包裹 (contributed by @dienaso) (PR [#14005](https://github.com/t8y2/dbx/pull/14005))\n- 修复 MySQL 多表库浏览被对象详情和数据库容量元数据查询长时间阻塞的问题，改为按需加载 (contributed by @CN-Scars) (PR [#14189](https://github.com/t8y2/dbx/pull/14189))\n- 修复通过 MySQL Router 连接时握手失败无法登录的问题 (contributed by @CN-Scars) (PR [#14247](https://github.com/t8y2/dbx/pull/14247))\n- 修复 MySQL 新建表预设字段中 ON UPDATE CURRENT_TIMESTAMP 默认值被加引号生成错误 DDL 的问题 (contributed by @dienaso) (PR [#14170](https://github.com/t8y2/dbx/pull/14170))\n- 修复 TiDB 索引列在结构编辑器显示为 (NULL) 的问题，索引加载失败时保留草稿并阻止残缺 DDL 提交 (contributed by @CN-Scars) (PR [#14175](https://github.com/t8y2/dbx/pull/14175))\n- 修复 PostgreSQL 全库导出时跨 schema 视图先于其依赖创建、导出脚本无法直接恢复的问题 (contributed by @CN-Scars) (PR [#14292](https://github.com/t8y2/dbx/pull/14292))\n- 修复 PostgreSQL 导出的视图先于其读取的视图创建、回放报 relation does not exist 的问题 (contributed by @jeff377) (PR [#14248](https://github.com/t8y2/dbx/pull/14248))\n- 修复 PostgreSQL 已分隔标识符被重复加引号导致打开表报语法错误的问题 (contributed by @xiaou61) (PR [#14237](https://github.com/t8y2/dbx/pull/14237))\n- 修复 PostgreSQL 协议连接重新展开大型树时已加载范围回退、需反复「加载更多」的问题 (contributed by @CN-Scars) (PR [#14176](https://github.com/t8y2/dbx/pull/14176))\n- 修复 Oracle 通过公共同义词查询后网格保存被限定到错误 schema、报 ORA-00942 的问题 (contributed by @jeff377) (PR [#14301](https://github.com/t8y2/dbx/pull/14301))\n- 修复 SQL Server 连接清除端口后测试或保存报错、端口被误固定导致 host\\instance 直连 1433 被拒的问题 (contributed by @xiaou61) (PR [#14242](https://github.com/t8y2/dbx/pull/14242))\n- 修复 Firebird 表 DDL 中列默认值排在 NOT NULL 之后、无法重建带默认值非空列的问题 (contributed by @lcq928) (PR [#14302](https://github.com/t8y2/dbx/pull/14302))\n- 修复 StarRocks/Doris 表结构编辑器索引页为空的问题 (contributed by @seaways1015-afk) (PR [#14124](https://github.com/t8y2/dbx/pull/14124))\n- 修复 GaussDB A 兼容模式下无参数存储过程和函数无法查看源码的问题 (contributed by @imcman) (PR [#14224](https://github.com/t8y2/dbx/pull/14224))\n- 修复连接表单无法导入 Databend 官方 databend:// DSN 的问题 (contributed by @wubx) (PR [#14268](https://github.com/t8y2/dbx/pull/14268))\n- 修复 Oscar 数据库列表因大小写不同重复显示的问题\n- 修复 ZooKeeper 多端点连接串绕过 SSH/代理传输层直连的问题 (contributed by @CN-Scars) (PR [#14287](https://github.com/t8y2/dbx/pull/14287))\n- 修复 Redis 粘贴数十万行大脚本导致 DBX 彻底卡死、重启后仍无法打开的问题 (contributed by @onenewcode) (PR [#14227](https://github.com/t8y2/dbx/pull/14227))\n- 修复 MQTT 证书认证密码未持久化到加密存储、重启后丢失的问题\n- 修复备份目录位于 NFS/CIFS 等网络挂载时重挂载后被拒绝备份、需手动清状态才能恢复的问题 (contributed by @dienaso) (PR [#14020](https://github.com/t8y2/dbx/pull/14020))\n- 修复插件市场安装时下载经统计服务触发 HTTP 429 失败的问题 (contributed by @yyn0210) (PR [#14255](https://github.com/t8y2/dbx/pull/14255))\n- 修复「导出所选」导出内容与勾选不一致、空选择被当作整库导出的问题，并补上 Oracle 包对象的导出 (contributed by @seaways1015-afk) (PR [#13990](https://github.com/t8y2/dbx/pull/13990))\n- 修复 Ctrl+F 表搜索未限定当前数据库的问题 (contributed by @lxk955) (PR [#11522](https://github.com/t8y2/dbx/pull/11522))\n- 修复侧边栏搜索出的表右键无法移入已有分组、子菜单只剩新建分组的问题 (contributed by @caiyq925-cell) (PR [#14250](https://github.com/t8y2/dbx/pull/14250))\n- 修复对象预览 DDL 搜索按回车不定位、无法查找下一处的问题 (contributed by @liuchaowu12) (PR [#14246](https://github.com/t8y2/dbx/pull/14246))\n- 修复矩形多光标接受代码片段时只有第一行展开、其余行残留触发词的问题 (contributed by @Tong-bit-art) (PR [#14118](https://github.com/t8y2/dbx/pull/14118))\n- 修复 SQL 补全替换范围超出已输入前缀、接受候选后改坏前文的问题 (contributed by @dajiaohuang) (PR [#14207](https://github.com/t8y2/dbx/pull/14207))\n- 修复数据生成忽略声明列类型、bit(n) 等列生成值无法写入的问题 (contributed by @yiqiui) (PR [#13014](https://github.com/t8y2/dbx/pull/13014))\n- 修复聚合查询结果列头和列详情不显示列注释的问题 (contributed by @davids-dot) (PR [#14253](https://github.com/t8y2/dbx/pull/14253))\n- 修复设置搜索因连接信息说明中的字面 @ 触发 i18n 编译错误导致页面空白的问题 (contributed by @eryajf) (PR [#14193](https://github.com/t8y2/dbx/pull/14193))\n- 修复侧边栏重命名对话框残留上次输入名称、不预填当前对象名的问题 (contributed by @thailoc-dev) (PR [#14195](https://github.com/t8y2/dbx/pull/14195))\n- 修复 macOS 主窗口重启后记不住大小和位置的问题 (contributed by @TaroXin) (PR [#14174](https://github.com/t8y2/dbx/pull/14174))\n- 修复 SQL 文件执行成功后弹窗默认立即关闭、执行结果看不到的问题 (contributed by @ericbyz) (PR [#14145](https://github.com/t8y2/dbx/pull/14145))\n- 修复连接高级设置中「全局 / 当前连接」标签在普通弹窗宽度下被截断的问题 (contributed by @zipg) (PR [#14156](https://github.com/t8y2/dbx/pull/14156))\n- 修复壁纸模式下侧边栏悬停展开遮罩透明、透出底层内容的问题 (contributed by @r9yn) (PR [#14234](https://github.com/t8y2/dbx/pull/14234))\n- 修复壁纸模式下表结构编辑器粘性表头透明、滚动时与数据行重叠的问题 (contributed by @thailoc-dev) (PR [#14209](https://github.com/t8y2/dbx/pull/14209))\n- 修复 Beta 渠道每次启动误弹更新中心的问题 (contributed by @zipg) (PR [#14180](https://github.com/t8y2/dbx/pull/14180))\n- 修复退出确认弹窗被 × 或 Esc 关闭后退出请求未取消、阻塞后续更新安装的问题 (contributed by @zipg) (PR [#14173](https://github.com/t8y2/dbx/pull/14173))\n- 修复 Beta 构建提升为正式版后界面仍显示 Beta 构建版本号的问题\n","mentions_count":29}
