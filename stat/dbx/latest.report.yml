\u7b5b\u9009\u6761\u4ef6\u8f93\u5165\u6846\n\n### \u6539\u8fdb\n\n- \u5927\u503c\u5355\u5143\u683c\u9884\u89c8\u6309\u5206\u6bb5\u9650\u989d\u52a0\u8f7d\u5e76\u663e\u793a\u5b9e\u9645\u6267\u884c\u7684 SQL\uff0c\u8d85\u5927\u5b57\u6bb5\u4e0d\u518d\u62d6\u6162\u754c\u9762\n\n### \u4fee\u590d\n\n- Linux Secret Service \u5bc6\u94a5\u67e5\u8be2\u4fee\u590d\uff0c\u51ed\u636e\u52a0\u5bc6\u5728 Linux \u684c\u9762\u73af\u5883\u6062\u590d\u6b63\u5e38\n- \u65e0\u4e3b\u952e PostgreSQL \u8868\u4f20\u8f93\u6539\u6309 ctid \u5757\u7a97\u53e3\u5206\u9875\uff0c\u5927\u6570\u636e\u91cf\u4e0d\u518d\u5931\u8d25 (contributed by @zipg) (PR [#10743](https://github.com/t8y2/dbx/pull/10743))\n- \u8fc1\u79fb\u8fc7\u7a0b\u4fdd\u7559\u51ed\u636e\u9519\u8bef\u8be6\u60c5\u5e76\u53ef\u4ece\u5931\u8d25\u72b6\u6001\u6062\u590d (contributed by @eryajf) (PR [#10731](https://github.com/t8y2/dbx/pull/10731))\n- \u5916\u90e8\u9a71\u52a8\u4f1a\u8bdd\u5931\u8d25\u540e\u6b63\u786e\u5173\u95ed\uff0c\u4e0d\u518d\u6b8b\u7559\u5360\u7528\n- SunDB \u5185\u7f6e JDBC \u9a71\u52a8\uff0c\u5f00\u7bb1\u5373\u7528 (contributed by @zipg) (PR [#10734](https://github.com/t8y2/dbx/pull/10734))\n- MCP \u8bbf\u95ee\u7b56\u7565\u4ec5\u5728\u663e\u5f0f\u5e94\u7528\u65f6\u6301\u4e45\u5316\uff0c\u4e0d\u518d\u81ea\u52a8\u4fdd\u5b58\n- \u8fde\u63a5\u5bfc\u5165\u6587\u4ef6\u652f\u6301 UTF-8 \u4ee5\u5916\u7f16\u7801 (contributed by @JoAdo07) (PR [#10688](https://github.com/t8y2/dbx/pull/10688))\n- \u62d6\u62fd\u6587\u4ef6\u4e0e\u6587\u4ef6\u5939\u5230\u63d2\u4ef6\u5de5\u4f5c\u53f0\u6539\u4e3a\u6d41\u5f0f\u4f20\u8f93 (contributed by @jinpy666) (PR [#10717](https://github.com/t8y2/dbx/pull/10717))\n- CSV/TSV \u5bfc\u51fa\u4e0d\u518d\u7528\u7b49\u53f7\u524d\u7f00\u516c\u5f0f\u5305\u88c5\u65e5\u671f (contributed by @ma123456mai) (PR [#10729](https://github.com/t8y2/dbx/pull/10729))\n- CSV/TSV \u5bfc\u51fa\u4e2d\u548c\u516c\u5f0f\u6ce8\u5165\u98ce\u9669 (contributed by @jinpy666) (PR [#10542](https://github.com/t8y2/dbx/pull/10542))\n- MongoDB \u65e0\u65f6\u533a\u7b5b\u9009\u65e5\u671f\u6309\u672c\u5730\u65f6\u95f4\u8bfb\u53d6\n- \u6570\u636e\u6bd4\u8f83\u6309\u8868\u9650\u91cf\u8bfb\u53d6\u5e76\u6807\u8bb0\u622a\u65ad\uff0c\u8d85\u5927\u8868\u4e0d\u518d\u65e0\u4f11\u6b62\u5bf9\u6bd4\n- \u4f20\u8f93\u786e\u8ba4\u5bf9\u8bdd\u6846\u6309\u6253\u5f00\u987a\u5e8f\u5806\u53e0\uff0c\u4fee\u590d\u51bb\u7ed3\n- \u7f51\u683c\u5de5\u5177\u680f\u6d6e\u5c42\u83dc\u5355\u951a\u5b9a\u5230\u89e6\u53d1\u6309\u94ae\uff0c\u4e0d\u518d\u6f02\u79fb\n- PolarDB \u5feb\u7167\u4e8b\u52a1\u8bed\u6cd5\u517c\u5bb9\u91cd\u8bd5\n- \u65ad\u5f00\u8fde\u63a5\u540e\u4fa7\u8fb9\u680f\u56fe\u6807\u4fdd\u7559\u989c\u8272\u6807\u8bc6\n- AI \u652f\u6301\u5c06\u7f16\u8f91\u5668\u9009\u4e2d\u6587\u672c\u4f5c\u4e3a\u7ed1\u5b9a\u4e0a\u4e0b\u6587\u53d1\u9001\n- \u5916\u89c2\u8bbe\u7f6e\u504f\u597d\u6b63\u786e\u6301\u4e45\u5316\n\n---\n<!-- dbx-cnb-mirror -->\n> \u56fd\u5185\u4e0b\u8f7d\uff1a\u5982\u679c GitHub \u4e0b\u8f7d\u8f83\u6162\uff0c\u53ef\u4ece [CNB \u955c\u50cf](https://cnb.cool/dbxio.com/dbx/-/releases/tag/v0.6.29) \u4e0b\u8f7d\u684c\u9762\u7aef\u5b89\u88c5\u5305\uff0cDocker \u955c\u50cf\u4ece `docker.cnb.cool/dbxio.com/dbx:v0.6.29` \u62c9\u53d6\u3002\n","mentions_count":6}
