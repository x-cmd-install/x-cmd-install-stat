31\u8d25 (contributed by @wzw1990) (PR [#13157](https://github.com/t8y2/dbx/pull/13157))\n- Redis \u952e\u8be6\u60c5\u65b0\u589e\u63d2\u4ef6\u89e3\u7801\u9009\u9879\uff0c\u53ef\u9009\u62e9\u5df2\u5b89\u88c5\u7684\u89e3\u7801\u63d2\u4ef6\uff0c\u628a\u5e94\u7528\u7279\u5b9a\u7684\u4e8c\u8fdb\u5236\u503c\u5728\u672c\u9762\u677f\u5185\u663e\u793a\u4e3a JSON \u6216\u6587\u672c (contributed by @Chow-Code) (PR [#13154](https://github.com/t8y2/dbx/pull/13154))\n- SQL \u8865\u5168\u65b0\u589e CockroachDB \u4e13\u5c5e\u7684\u5173\u952e\u5b57\u4e0e\u51fd\u6570\u652f\u6301 (contributed by @Pius-x) (PR [#13169](https://github.com/t8y2/dbx/pull/13169))\n- SQL \u8865\u5168\u65b0\u589e Spanner \u7684\u5173\u952e\u5b57\u4e0e\u51fd\u6570\u652f\u6301 (contributed by @dienaso) (PR [#13136](https://github.com/t8y2/dbx/pull/13136))\n- \u67e5\u8be2\u5de5\u5177\u680f\u7684\u8fde\u63a5\u9009\u62e9\u5668\u663e\u793a\u8fde\u63a5\u7684\u5b8c\u6574\u5206\u7ec4\u8def\u5f84\uff0c\u9f20\u6807\u60ac\u6d6e\u8fde\u63a5\u540d\u79f0\u53ef\u9884\u89c8\u8fde\u63a5\u8be6\u60c5 (contributed by @hanxuanyu) (PR [#13155](https://github.com/t8y2/dbx/pull/13155))\n\n### \u6539\u8fdb\n\n- \u4fa7\u8fb9\u680f\u591a\u9009\u8868\u884c\u6539\u7528\u6301\u7eed\u7684\u84dd\u8272\u9ad8\u4eae\u548c\u5185\u5d4c\u6807\u8bb0\uff0c\u7126\u70b9\u79fb\u51fa\u6811\u6216\u914d\u7f6e\u8fde\u63a5\u8272\u540e\u4f9d\u7136\u6e05\u6670\u53ef\u8fa8 (contributed by @heeeex100) (PR [#13113](https://github.com/t8y2/dbx/pull/13113))\n- \u591a\u8bed\u53e5\u6267\u884c\u6458\u8981\u7684\u8fdb\u5ea6\u6761\u548c\u8868\u683c\u94fa\u6ee1\u6574\u4e2a\u7ed3\u679c\u9762\u677f\uff0c\u4e0d\u518d\u53ea\u6324\u5728\u5de6\u4fa7\u7559\u51fa\u5927\u7247\u7a7a\u767d (contributed by @eryajf) (PR [#13188](https://github.com/t8y2/dbx/pull/13188))\n- \u79fb\u9664\u7ed3\u679c\u533a\u57df\u5916\u5708\u7684\u8fde\u63a5\u8272\u63cf\u8fb9\uff0c\u4fdd\u7559\u8fde\u63a5\u8272\u70b9\u7b49\u6807\u8bc6\uff0c\u914d\u7f6e\u9c9c\u8273\u8fde\u63a5\u8272\u65f6\u89c6\u89c9\u66f4\u67d4\u548c (contributed by @eryajf) (PR [#13195](https://github.com/t8y2/dbx/pull/13195))\n- \u5206\u7ec4\u6807\u7b7e\u9009\u4e2d\u6001\u53ea\u4fdd\u7559\u4e00\u6761\u5206\u7ec4\u8272\u5e95\u7ebf\uff0c\u975e\u6d3b\u52a8\u6807\u7b7e\u5e95\u7ebf\u5f31\u5316\u3001\u5206\u7ec4\u6807\u9898\u6587\u5b57\u6539\u7528\u4e2d\u6027\u8272\uff0c\u591a\u4e2a\u5f69\u8272\u5206\u7ec4\u91cc\u66f4\u6613\u8fa8\u8ba4 (contributed by @zipg) (PR [#13196](https://github.com/t8y2/dbx/pull/13196))\n- MySQL \u8865\u5168\u8865\u9f50 SHOW BINARY LOGS\u3001SHOW BINLOG EVENTS \u8bed\u53e5\u548c REGEXP/RLIKE \u8fd0\u7b97\u7b26 (contributed by @yiqiui) (PR [#13133](https://github.com/t8y2/dbx/pull/13133))\n- \u4fa7\u8fb9\u680f\u8868\u641c\u7d22\u590d\u7528\u5185\u5b58\u548c\u6301\u4e45\u5316\u7d22\u5f15\u7f13\u5b58\uff0c\u4e0d\u518d\u6bcf\u6b21\u641c\u7d22\u90fd\u91cd\u65b0\u52a0\u8f7d\u5bf9\u8c61\u6811\uff0c\u641c\u7d22\u66f4\u5feb\u4e5f\u4e0d\u4f1a\u53cd\u590d\u95ea\u65ad (contributed by @poncosh) (PR [#13062](https://github.com/t8y2/dbx/pull/13062))\n\n### \u4fee\u590d\n\n- Linux\uff1aMCP \u72b6\u6001\u68c0\u6d4b\u8c03\u7528\u7528\u6237 shell \u65f6\u6539\u4e3a\u5728\u72ec\u7acb\u8fdb\u7a0b\u4f1a\u8bdd\u4e2d\u6267\u884c\uff0c\u4ea4\u4e92\u5f0f shell \u65e0\u6cd5\u518d\u901a\u8fc7\u7ec8\u7aef\u4f5c\u4e1a\u63a7\u5236\u6302\u8d77 DBX \u8fdb\u7a0b (contributed by @hoangph-34) (PR [#13198](https://github.com/t8y2/dbx/pull/13198))\n- PostgreSQL\uff1a\u5bfc\u51fa\u8868 DDL \u5c06\u6807\u51c6\u547d\u540d\u5e8f\u5217\u7684 nextval \u9ed8\u8ba4\u503c\u8fd8\u539f\u4e3a serial/bigserial \u7c7b\u578b\uff0c\u6062\u590d\u5efa\u8868\u4e0d\u518d\u56e0\u5e8f\u5217\u7f3a\u5931\u800c\u5931\u8d25 (contributed by @dienaso) (PR [#13112](https://github.com/t8y2/dbx/pull/13112))\n- \u5f00\u542f\u300c\u81ea\u52a8\u4fdd\u7559\u67e5\u8be2\u7ed3\u679c\u300d\u540e\uff0c\u5237\u65b0\u3001\u81ea\u52a8\u5237\u65b0\u3001\u7ffb\u9875\u548c\u6570\u636e\u5e93\u6392\u5e8f\u5728\u5f53\u524d\u7ed3\u679c\u6807\u7b7e\u9875\u539f\u5730\u66f4\u65b0\uff0c\u4e0d\u518d\u6bcf\u6b21\u90fd\u65b0\u589e\u7ed3\u679c\u6807\u7b7e\u4e0d\u65ad\u5806\u79ef (contributed by @zipg) (PR [#13178](https://github.com/t8y2/dbx/pull/13178))\n- Linux\uff1a\u65b0\u589e\u300c\u7a97\u53e3\u900f\u660e\u6548\u679c\u300d\u8bbe\u7f6e\uff0c\u900f\u660e\u8fb9\u6846\u5bfc\u81f4\u7a97\u53e3\u9891\u95ea\uff08\u5982 Fedora\uff09\u65f6\u53ef\u5c06\u5176\u5173\u95ed\uff0c\u5e94\u7528\u5e76\u91cd\u542f\u540e\u751f\u6548 (contributed by @AspBamboo) (PR [#12975](https://github.com/t8y2/dbx/pull/12975))\n- Redis\uff1a\u517c\u5bb9 TongRDS \u7b49\u5bf9 GETRANGE \u8d8a\u754c\u4e25\u683c\u62d2\u7edd\u7684\u5185\u6838\uff0cString \u952e\u8be6\u60c5\u4e0d\u518d\u7a7a\u767d\uff0c\u8bfb\u53d6\u5931\u8d25\u65f6\u9762\u677f\u4f1a\u663e\u793a\u539f\u56e0\u5e76\u63d0\u4f9b\u91cd\u8bd5 (contributed by @Gaiokane) (PR [#13123](https://github.com/t8y2/dbx/pull/13123))\n- \u8bbe\u7f6e\u5bfc\u51fa\u5bfc\u5165\u8986\u76d6\u660e\u6697\u4e3b\u9898\u6a21\u5f0f\u548c\u684c\u9762\u504f\u597d\uff08\u6258\u76d8\u56fe\u6807\u3001\u5173\u95ed\u884c\u4e3a\u3001\u56fe\u6807\u4e3b\u9898\u7b49\uff09\uff0c\u5907\u4efd\u5f80\u8fd4\u4e0d\u518d\u4e22\u5931\u8fd9\u4e9b\u8bbe\u7f6e (contributed by @caiyq925-cell) (PR [#13186](https://github.com/t8y2/dbx/pull/13186))\n- jdbc \u901a\u7528\u8fde\u63a5\u4e0a\u7684 DuckDB\uff1a\u4e0d\u518d\u4e0b\u53d1 DuckDB JDBC \u4e0d\u652f\u6301\u7684 loginTimeout/connectTimeout \u5c5e\u6027\uff0c\u8fde\u63a5\u4e0d\u518d\u5efa\u7acb\u5931\u8d25 (contributed by @heeeex100) (PR [#13161](https://github.com/t8y2/dbx/pull/13161))\n- SQL \u6587\u4ef6\u9762\u677f\u65b0\u589e\u6587\u4ef6\u3001\u91cd\u547d\u540d\u6216\u5237\u65b0\u540e\u4fdd\u6301\u5f53\u524d\u6eda\u52a8\u4f4d\u7f6e\uff0c\u4e0d\u518d\u8df3\u56de\u9876\u90e8 (contributed by @yiqiui) (PR [#13124](https://github.com/t8y2/dbx/pull/13124))\n- SQL Server\uff1a\u7f16\u8f91\u89c6\u56fe\u4fdd\u5b58\u65f6\u6b63\u786e\u6539\u5199\u5e26\u524d\u5bfc\u6ce8\u91ca\u7684\u6e90\u7801\u4e3a ALTER VIEW\uf