"site_admin":false},"content_type":"application/zip","state":"uploaded","size":40075264,"digest":"sha256:86c15f5dc98b7bb317b120d9ab36a39a20b8366a493e8db8f5cf64a64a589c1a","download_count":62,"created_at":"2026-10-19T18:57:48Z","updated_at":"2026-10-19T18:57:50Z"},{"id":657194453,"node_id":"RA_kwDOSPdiBc4nK_3V","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":44903070,"digest":"sha256:2b4897460e97b6ebba314693f82d5480763adbf1be782867f28b00538e3c5ffa","download_count":80,"created_at":"2026-10-19T19:19:43Z","updated_at":"2026-10-19T19:19:46Z"},{"id":657272046,"node_id":"RA_kwDOSPdiBc4nLSzu","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":19075,"digest":"sha256:7738e148dbdc2dab17f244e511fd834212aee0fb0eeb3e34e105510bebd8bdc6","download_count":8680,"created_at":"2026-10-19T19:53:12Z","updated_at":"2026-10-19T19:53:12Z"}],"body":"### \u8d5e\u52a9\u4fe1\u606f\n\n- Jalapeno Cloud\uff1aGLM-5.3 \u9650\u65f6 3 \u6298\uff0810 \u6708 19 \u65e5\u81f3 25 \u65e5\uff09\uff0cStep 5 \u5df2\u4e0a\u7ebf\uff0c[\u6d3b\u52a8\u5165\u53e3](https://www.jalapeno-cloud.ai/DBX)\n\n### \u65b0\u529f\u80fd\n\n- \u67e5\u8be2\u7ed3\u679c\u6807\u7b7e\u3001\u7ed3\u679c\u96c6\u6807\u7b7e\u548c\u7ed3\u679c\u533a\u8fb9\u6846\u663e\u793a\u6765\u6e90\u8fde\u63a5\u914d\u7f6e\u7684\u989c\u8272\uff0c\u4fbf\u4e8e\u533a\u5206\u6d4b\u8bd5\u4e0e\u751f\u4ea7\u7b49\u4e0d\u540c\u73af\u5883\u7684\u8fde\u63a5 (contributed by @CSXFanMeng) (PR [#10823](https://github.com/t8y2/dbx/pull/10823))\n- SQL \u7f16\u8f91\u5668\u8865\u5168\u652f\u6301\u6309\u8868\u548c\u5217\u7684\u6ce8\u91ca\u641c\u7d22\uff0c\u4e2d\u6587\u6ce8\u91ca\u3001\u62fc\u97f3\u9996\u5b57\u6bcd\u548c\u82f1\u6587\u6ce8\u91ca\u6587\u672c\u5747\u53ef\u5339\u914d (contributed by @lxk955) (PR [#12629](https://github.com/t8y2/dbx/pull/12629))\n- \u5bf9\u8c61\u548c\u6570\u636e\u5e93\u6d4f\u89c8\u5668\u7684\u7d27\u51d1\u5361\u7247\u5bbd\u5ea6\u53ef\u5728 160\u3001200\u3001240 \u50cf\u7d20\u95f4\u9009\u62e9\uff08\u9ed8\u8ba4 160\uff09\uff0c\u4e24\u4e2a\u6d4f\u89c8\u5668\u5171\u4eab\u8be5\u8bbe\u7f6e (contributed by @eryajf) (PR [#12721](https://github.com/t8y2/dbx/pull/12721))\n- SQL \u8865\u5168\u5217\u8868\u652f\u6301 Ctrl-N/P \u4e0a\u4e0b\u9009\u62e9\u8865\u5168\u9879 (contributed by @Xcylway) (PR [#12698](https://github.com/t8y2/dbx/pull/12698))\n- \u67e5\u8be2\u7ed3\u679c\u5217\u5bbd\u6309 SQL \u6587\u4ef6\u8bb0\u5fc6\uff0c\u624b\u52a8\u8c03\u6574\u7684\u5217\u5bbd\u8de8\u4f1a\u8bdd\u548c\u8de8\u6807\u7b7e\u9875\u4fdd\u7559 (contributed by @lxk955) (PR [#12641](https://github.com/t8y2/dbx/pull/12641))\n- \u534e\u4e3a DWS \u8fde\u63a5\u652f\u6301\u67e5\u770b Estimated Plan \u9884\u4f30\u6267\u884c\u8ba1\u5212 (contributed by @0verme) (PR [#12644](https://github.com/t8y2/dbx/pull/12644))\n- \u6570\u636e\u4f20\u8f93\u65b0\u589e\u76ee\u6807\u5217\u540d\u8f6c\u5927\u5199\u9009\u9879\n\n### \u6539\u8fdb\n\n- \u8bbe\u7f6e\u9875\u8bed\u8a00\u9009\u9879\u7684\u56fd\u65d7\u56fe\u6807\u6539\u7528\u5185\u7f6e SVG \u6e32\u67d3\uff0cWindows \u4e0a\u4e0d\u518d\u4f9d\u8d56\u7cfb\u7edf emoji \u5b57\u4f53\uff0c\u5404\u5e73\u53f0\u663e\u793a\u4e00\u81f4 (contributed by @Ezreal-byte) (PR [#12715](https://github.com/t8y2/dbx/pull/12715))\n- \u6df1\u8272\u4e3b\u9898\u4e0b\u5de5\u4f5c\u53f0\u5185\u5c42\u9762\u677f\u6539\u7528\u4e0d\u900f\u660e\u8fb9\u6846\u548c\u66f4\u6e05\u6670\u7684\u5706\u89d2\uff0c\u9762\u677f\u8f6e\u5ed3\u4e0d\u518d\u96be\u4ee5\u5206\u8fa8 (contributed by @cseda-gullivernet) (PR [#12600](https://github.com/t8y2/dbx/pull/12600))\n- \u300c\u8df3\u8f6c\u5217\u300d\u76ee\u6807\u5217\u8868\u6309\u7528\u6237\u8c03