u590d\u5236 (contributed by @Abeautifulsnow) (PR [#11494](https://github.com/t8y2/dbx/pull/11494))\n- DB2 \u652f\u6301\u67e5\u770b\u4f30\u7b97\u6267\u884c\u8ba1\u5212 (contributed by @Rendegou) (PR [#11485](https://github.com/t8y2/dbx/pull/11485))\n- MySQL \u5efa\u8868\u65f6\u652f\u6301\u8bbe\u7f6e\u81ea\u589e\u8d77\u59cb\u503c (contributed by @eryajf) (PR [#11476](https://github.com/t8y2/dbx/pull/11476))\n- OceanBase Oracle \u6a21\u5f0f\u5bf9\u8c61\u6811\u663e\u793a\u5bf9\u8c61\u6ce8\u91ca\u5e76\u652f\u6301\u6309\u6ce8\u91ca\u641c\u7d22 (contributed by @efeire) (PR [#11448](https://github.com/t8y2/dbx/pull/11448))\n- OceanBase Oracle \u6a21\u5f0f\u65b0\u589e\u7ea6\u675f\u53ea\u8bfb\u9875 (contributed by @efeire) (PR [#11450](https://github.com/t8y2/dbx/pull/11450))\n- \u6570\u636e\u4f20\u8f93\u4efb\u52a1\u4fdd\u7559\u8fd0\u884c\u5386\u53f2\u8bb0\u5f55 (contributed by @0verme) (PR [#11303](https://github.com/t8y2/dbx/pull/11303))\n- \u65b0\u589e\u5173\u95ed\u7a97\u53e3\u5feb\u6377\u952e Shift+Mod+W (contributed by @lxk955) (PR [#11084](https://github.com/t8y2/dbx/pull/11084))\n\n### \u6539\u8fdb\n\n- \u8fde\u63a5\u6811\u652f\u6301\u7d27\u51d1\u884c\u5bc6\u5ea6\u8bbe\u7f6e (contributed by @lxk955) (PR [#11082](https://github.com/t8y2/dbx/pull/11082))\n- \u652f\u6301\u81ea\u5b9a\u4e49\u7ed3\u679c\u96c6\u5341\u5b57\u5149\u6807\u9ad8\u4eae\u989c\u8272 (contributed by @lxk955) (PR [#11078](https://github.com/t8y2/dbx/pull/11078))\n- MQ \u4e3b\u9898\u5217\u8868\u652f\u6301\u624b\u52a8\u8c03\u6574\u5217\u5bbd\u5e76\u6301\u4e45\u5316 (contributed by @zipg) (PR [#11366](https://github.com/t8y2/dbx/pull/11366))\n- \u6570\u636e\u5bfc\u5165\u65f6\u5217\u540d\u4e0d\u5339\u914d\u9ed8\u8ba4\u6539\u7528\u6309\u4f4d\u7f6e\u6620\u5c04 (contributed by @lxk955) (PR [#11305](https://github.com/t8y2/dbx/pull/11305))\n- \u4f18\u5316 PostgreSQL \u67e5\u8be2\u7ed3\u679c\u884c\u5904\u7406\u6027\u80fd\uff0c\u672a\u914d\u7f6e\u6587\u672c\u7f16\u7801\u7684\u8fde\u63a5\u4e0d\u518d\u9010\u884c\u8