pg) (PR [#10493](https://github.com/t8y2/dbx/pull/10493))\n- PostgreSQL \u8868\u884c\u6570\u663e\u793a\u6539\u7528\u5b9e\u65f6\u4f30\u7b97\u5e76\u5728\u7edf\u8ba1\u8fc7\u671f\u65f6\u81ea\u52a8\u5237\u65b0\uff0c\u4e0d\u518d\u505c\u7559\u5728\u65e7\u7f13\u5b58\u503c (contributed by @zipg) (PR [#10479](https://github.com/t8y2/dbx/pull/10479))\n- Oracle \u6267\u884c SQL \u6587\u4ef6\u65f6\u4fdd\u7559\u5df2\u9009 schema\uff0c\u300c\u6570\u636e\u5e93\u9009\u62e9\u65e0\u6548\u300d\u62a5\u9519\u6d88\u9664\n- \u5206\u5377 ZIP \u4e2d\u7684 SQL \u811a\u672c\u8de8\u5206\u5377\u8bed\u53e5\u5b8c\u6574\u4fdd\u7559\uff0c\u4e0d\u518d\u88ab\u622a\u65ad\u4e22\u5931 (contributed by @hanhvs) (PR [#10489](https://github.com/t8y2/dbx/pull/10489))\n- PL/SQL \u533f\u540d\u5757\u6309\u5206\u53f7\u62c6\u5206\u65f6\u4fdd\u7559\u53cc\u5f15\u53f7\u6807\u8bc6\u7b26\uff0c\u8fbe\u68a6\u5b58\u50a8\u8fc7\u7a0b\u6267\u884c\u4e0d\u518d\u62a5\u9519 (contributed by @zipg) (PR [#10445](https://github.com/t8y2/dbx/pull/10445))\n- Neo4j \u6309\u670d\u52a1\u7aef\u7248\u672c\u9009\u62e9\u8282\u70b9\u6807\u8bc6\u51fd\u6570\uff0c4.x \u4e0e 3.5 \u6253\u5f00\u8868\u6570\u636e\u6062\u590d\u6b63\u5e38 (contributed by @zipg) (PR [#10514](https://github.com/t8y2/dbx/pull/10514))\n- \u5355\u673a Neo4j\uff08Bolt 3\uff09\u5728\u8def\u7531\u62a5\u9519\u65f6\u81ea\u52a8\u56de\u9000\u76f4\u8fde\uff0c\u8fde\u63a5\u6062\u590d\u6b63\u5e38 (contributed by @zipg) (PR [#10447](https://github.com/t8y2/dbx/pull/10447))\n- MongoDB \u65e0 listDatabases \u6743\u9650\u65f6\u56de\u9000\u663e\u793a\u8d26\u53f7\u5df2\u6388\u6743\u7684\u6570\u636e\u5e93 (contributed by @zipg) (PR [#10511](https://github.com/t8y2/dbx/pull/10511))\n- MongoDB \u8865\u5168\u5728\u65e0\u53c2\u6570\u6a21\u578b\u7684\u53c2\u6570\u4f4d\u7f6e\u4e0d\u518d\u7ed9\u51fa\u9519\u8bef\u5efa\u8bae (contributed by @thailoc-dev) (PR [#10421](https://github.com/t8y2/dbx/pull/10421))\n- SQL Server \u4e8c\u8fdb\u5236\u5217\u5bfc\u51fa\u4e3a 0x \u5341\u516d\u8fdb\u5236\u5b57\u9