w_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":37650432,"digest":"sha256:07bbc428dd9de71f5fc55b86c7e4166f98c22b5e02de0a73625aa4e701252005","download_count":129,"created_at":"2026-10-06T16:29:50Z","updated_at":"2026-10-06T16:29:51Z"},{"id":616157198,"node_id":"RA_kwDOSPdiBc4kudAO","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":42412757,"digest":"sha256:ac6881a0e4e760515c735d54f4e5f79a97dd7b1cb86d9ca927a9a29ba6b9583c","download_count":161,"created_at":"2026-10-06T17:19:11Z","updated_at":"2026-10-06T17:19:14Z"},{"id":616215941,"node_id":"RA_kwDOSPdiBc4kurWF","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":16617,"digest":"sha256:6235d14efd15e22ee71f3f018ffccba396f757a38b1fd92dabb503b9be59a663","download_count":22597,"created_at":"2026-10-06T17:44:59Z","updated_at":"2026-10-06T17:45:00Z"}],"body":"### \u65b0\u529f\u80fd\n\n- SQL Server \u652f\u6301\u624b\u52a8\u4e8b\u52a1\uff0c\u53ef\u624b\u52a8\u5f00\u59cb\u3001\u63d0\u4ea4\u3001\u56de\u6eda\u4e8b\u52a1\uff0c\u5e76\u517c\u5bb9 SQL Server 2000 \u65e7\u9a71\u52a8 (contributed by @Rendegou) (PR [#11100](https://github.com/t8y2/dbx/pull/11100))\n- \u865a\u8c37\u6570\u636e\u5e93\u652f\u6301\u53ef\u89c6\u5316\u4f30\u7b97\u6267\u884c\u8ba1\u5212 (contributed by @mapan0424) (PR [#11118](https://github.com/t8y2/dbx/pull/11118))\n- \u6267\u884c\u8ba1\u5212\u7ed3\u679c\u652f\u6301\u5bfc\u51fa\u4e3a\u6587\u4ef6 (contributed by @poncosh) (PR [#11120](https://github.com/t8y2/dbx/pull/11120))\n- JSON \u683c\u5f0f\u7684\u6267\u884c\u8ba1\u5212\u7ed3\u679c\u5728\u53ea\u8bfb\u7f16\u8f91\u5668\u4e2d\u5c55\u793a\u5e76\u652f\u6301\u4e00\u952e\u590d\u5236 (contributed by @saefulrahman) (PR [#11123](https://github.com/t8y2/dbx/pull/11123))\n- MySQL \u6570\u636e\u5e93\u53f3\u952e\u83dc\u5355\u65b0\u589e\u6e05\u7a7a\u6240\u6709\u8868\u6570\u636e\uff0c\u6309\u5916\u952e\u4f9d\u8d56\u987a\u5e8f\u6267\u884c\u5e76\u6c47\u62a5\u6bcf\u5f20\u8868\u7ed3\u679c (contributed by @eryajf) (PR [#11110](https://github.com/t8y2/dbx/pull/11110))\n- Redis \u952e\u5217\u8868\u652f\u6301\u9f20\u6807\u62d6\u62fd\u6846\u9009\u591a\u4e2a\u952e (contributed by @eryajf) (PR [#11115](https://github.com/t8y2/dbx/pull/11115))\n- MongoDB \u67e5\u8be2\u8865\u5168\u652f\u6301\u5d4c\u5957\u67e5\u8be2\u64cd\u4f5c\u7b26\u548c\u9009\u9879\u5efa\u8bae (contributed by @thailoc-dev) (PR [#11113](https://github.com/t8y2/dbx/pull/11113))\n- \u6570\u636e\u7f51\u683c\u65b0\u589e\u53ef\u56fa\u5b9a\u7684\u5217\u67e5\u627e\u4fa7\u680f\uff0c\u53ef\u6309\u540d\u79f0\u5feb\u901f\u5b9a\u4f4d\u76ee\u6807\u5217 (contributed by @eryajf) (PR [#11116](https://github.com/t8y2/dbx/pull/11116))\n- \u6570\u636e\u7f51\u683c\u652f\u6301\u6309\u4f4f Alt \u952e\u7528\u9f20\u6807\u6eda\u8f6e\u6a2a\u5411\u6eda\u52a8 (contributed by @lxk955) (PR [#11131](https://github.com/t8y2/dbx/pull/11131))\n- SQL \u7f16\u8f91\u5668\u652f\u6301\u9009\u62e9\u6253\u5f00\u548c\u4fdd\u5b58 SQL \u6587\u4ef6\u65f6\u4f7f\u7528\u7684\u7f16\u7801 (contributed by @eryajf) (PR [#11108](https://github.com/t8y2/dbx/pull/11108))\n- \u65b0\u589e\u6253\u5f00\u8fde\u63a5\u65f6\u76f4\u63a5\u8fdb\u5165\u67e5\u8be2\u9875\u7684\u8bbe\u7f6e\u9879 (contributed by @eryajf) (PR [#11097](https://github.com/t8y2/dbx/pull/11097))\n- \u63d2\u4ef6\u53ef\u6309\u63d2\u4ef6\u7c92\u5ea6\u6388\u6743\u56fe\u5f62\u5f15\u64ce\u6240\u9700\u7684 unsafe-eval CSP \u6743\u9650 (contributed by @onceMisery) (PR [#11087](https://github.com/t8y2/dbx/pull/11087))\n- \u4e91\u540c\u6b65\u5907\u4efd\u9009\u62e9\u5bf9\u8bdd\u6846\u652f\u6301\u6279\u91cf\u9009\u62e9\u5