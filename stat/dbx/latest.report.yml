609bdd67ed71683c344462568ee","download_count":25,"created_at":"2026-11-11T03:34:25Z","updated_at":"2026-11-11T03:34:29Z"},{"id":733987080,"node_id":"RA_kwDOSPdiBc4rv8EI","name":"DBX_0.6.69_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":44924928,"digest":"sha256:c607edbcd591f687e4dc90d7c29510bb2dce7c31d5a966e566085dd08eb5c343","download_count":17,"created_at":"2026-11-11T03:34:41Z","updated_at":"2026-11-11T03:34:43Z"},{"id":732770757,"node_id":"RA_kwDOSPdiBc4rrTHF","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":50098817,"digest":"sha256:61908e18938a3ef26c6b48354ecd3fc2099b270f14b9716fc8f9e5fa8cb6a7bf","download_count":60,"created_at":"2026-11-10T20:01:56Z","updated_at":"2026-11-10T20:01:58Z"},{"id":734059024,"node_id":"RA_kwDOSPdiBc4rwNoQ","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":17502,"digest":"sha256:2e5b462deefb122602ddaca821b984e78e412d84b283c9cf15be4d69ddf368d6","download_count":4133,"created_at":"2026-11-11T04:01:43Z","updated_at":"2026-11-11T04:01:43Z"}],"body":"### 新功能\n\n- 查询结果新增可自定义的「复制当前结果集」快捷键，按默认复制格式复制已加载的可见行列，保持编辑器焦点不变 (contributed by @imcman) (PR [#14545](https://github.com/t8y2/dbx/pull/14545))\n- 数据网格复制菜单新增一键「复制列名（逗号分隔）」和「复制列名（单引号 + 逗号）」，可直接粘贴为 IN 列表 (contributed by @xiaou61) (PR [#14501](https://github.com/t8y2/dbx/pull/14501))\n- 列格式化新增「数字」类型，可将科学计数法显示的数值改为普通数字表示，支持千分位分隔符和固定小数位 (contributed by @ThugKd) (PR [#14551](https://github.com/t8y2/dbx/pull/14551))\n- SQL 编辑器工具栏新增「切换行注释」按钮，右键菜单的次要操作收进「更多」子菜单，常用操作保持直达 (contributed by @ThugKd) (PR [#14557](https://github.com/t8y2/dbx/pull/14557))\n- 存储过程和函数编辑新增「保存到数据库」入口，正确处理 DELIMITER 和过程体内的分号，保存后自动刷新对象列表 (contributed by @Acd-kk) (PR [#14556](https://github.com/t8y2/dbx/pull/14556))\n- 侧边栏本地表搜索支持 schema.table 形式，可直接定位其他 schema 下的同名表 (contributed by @xiaou61) (PR [#14499](https://github.com/t8y2/dbx/pull/14499))\n- 对象浏览器「配置显示列」支持拖拽调整列显示顺序并按连接范围持久化，也支持键盘移动 (contributed by @ThugKd) (PR [#14676](https://github.com/t8y2/dbx/pull/14676))\n- 数据传输将每张表的条件设置、查看和清除入口移到已选对象列表中对应表的右侧，表多时不再需要在两个列表间来回定位 (contributed by @ThugKd) (PR [#14673](https://github.com/t8y2/dbx/pull/14673))\n- Elasticsearch / Easysearch 连接新增独立的索引局部搜索框，按名称和别名筛选，不影响全局搜索 (contributed by @ThugKd) (PR [#14553](https://github.com/t8y2/dbx/pull/14553))\n- 连接深链支持插件提供的连接类型（如 type=ssh），可直接预填打开新建连接弹窗 (contributed by @Evvvvvvvan) (PR [#14678](https://github.com/t8y2/dbx/pull/14678))\n\n### 改进\n\n- 更新 HuaLongAI 入口链接\n- 执行历史的耗时改用与查询摘要一致的执行耗时口径，多语句累加各结果耗时 (contributed by @ThugKd) (PR [#14683](https://github.com/t8y2/dbx/pull/14683))\n- MySQL 视图在编辑器源码标签页中按 SQL 格式化偏好排版查询部分，保留 ALGORITHM、DEFINER 等头部 (contributed by @ThugKd) (PR [#14549](https://github.com/t8y2/dbx/pull/14549))\n- MySQL 查询编辑器补全新增 FORCE INDEX 建议，表引用后按子句优先级排序展示 (contributed by @ThugKd) (PR [#14431](https://github.com/t8y2/dbx/pull/14431))\n- MongoDB 的 find / sort 输入框支持自动补齐括号和引号，字段补全优先显示当前页已有字段，不必等待远端采样 (contributed by @ThugKd) (PR [#14547](https://github.com/t8y2/dbx/pull/14547))\n- MySQL 对象浏览的元数据加载预算跟随连接的查询超时设置，不再固定为 5 秒 (contributed by @zipg) (PR [#14488](https://github.com/t8y2/dbx/pull/14488))\n- Redis 大型 Hash 键的行预览改为按边界解码，打开键时不再整体格式化超大字段，查看、复制和编辑仍使用完整值 (contributed by @ThugKd) (PR [#14438](https://github.com/t8y2/dbx/pull/14438))\n- 表结构编辑页统一字段名、类型下拉选项和默认值的字体、字号与字重显示 (contributed by @Acd-kk) (PR [#14560](https://github.com/t8y2/dbx/pull/14560))\n- 悬停 SQL 编辑器书签时不再绘制额外背景，书签槽与行号槽的当前行高亮保持一致 (contributed by @heeeex100) (PR [#14493](https://github.com/t8y2/dbx/pull/14493))\n- 备份进度百分比四舍五入为整数显示，不再出现过长小数 (contributed by @chukui2005) (PR [#14609](https://github.com/t8y2/dbx/pull/14609))\n\n### 修复\n\n- 达梦 FLOAT 列按双精度读取，修复大数值只保留约 7 位有效数字、显示为近似值的问题 (contributed by @seaways1015-afk) (PR [#14684](https://github.com/t8y2/dbx/pull/14684))\n- MySQL 表传输携带零值日期（0000-00-00）到严格模式目标库时不再报 ERROR 1292 (contributed by @jeff377) (PR [#14681](https://github.com/t8y2/dbx/pull/14681))\n- PostgreSQL 系引擎标识符折叠规则不同（如 TDSQL-PG / OpenTenBase 折叠为大写）导致编辑数据提交报 42P01 的问题，改为按目录中存储的真实表名回填写目标 (contributed by @hongshuo-wang) (PR [#14607](https://github.com/t8y2/dbx/pull/14607))\n- 无主键 PostgreSQL 表的重复行编辑和删除改用隐藏元组定位（tableoid/ctid/xmin），不再生成可能命中多行的全列条件 (contributed by @thailoc-dev) (PR [#14596](https://github.com/t8y2/dbx/pull/14596))\n- PostgreSQL 类型下拉对保留字类型名（如 order）保留引号，修复由此生成非法 CREATE TABLE 的问题 (contributed by @dienaso) (PR [#14561](https://github.com/t8y2/dbx/pull/14561))\n- PostgreSQL 语句出错时展示底层服务器错误信息，不再只显示通用的「解析服务器响应失败」 (contributed by @lxk955) (PR [#13426](https://github.com/t8y2/dbx/pull/13426))\n- Oracle 对象树触发器列表改按基表 owner 过滤，修复跨 schema 触发器不显示的问题 (contributed by @yiqiui) (PR [#13537](https://github.com/t8y2/dbx/pull/13537))\n- IoTDB 查询超时设为「不限制」时显式传超大预算，长导出不再被服务端默认 60 秒终止 (contributed by @dienaso) (PR [#13993](https://github.com/t8y2/dbx/pull/13993))\n- MCP 只读范围策略下超过 2048 token 的 PostgreSQL 长查询不再被误判为超出数据库范围而拒绝执行 (contributed by @xiaou61) (PR [#14597](https://github.com/t8y2/dbx/pull/14597))\n- 重新执行 SQL 前确认未保存的结果修改，不再静默清空待提交的表格编辑 (contributed by @zipg) (PR [#14619](https://github.com/t8y2/dbx/pull/14619))\n- 启用点击置顶后在结果标签页之间切换不再误取消已有的置顶状态 (contributed by @x-labb) (PR [#14631](https://github.com/t8y2/dbx/pull/14631))\n- 新建 schema 后查询编辑器的 schema 选择列表即时刷新，不再显示过期缓存 (contributed by @xiaou61) (PR [#14594](https://github.com/t8y2/dbx/pull/14594))\n","mentions_count":16}
