308da6c9391","download_count":17,"created_at":"2026-11-16T05:39:43Z","updated_at":"2026-11-16T05:39:45Z"},{"id":752139841,"node_id":"RA_kwDOSPdiBc4s1L5B","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":50331860,"digest":"sha256:fb73958dfedc4d42f17a7f57d5f353526d8535c3c2d5bf052d21a396c4d66212","download_count":58,"created_at":"2026-11-15T19:44:39Z","updated_at":"2026-11-15T19:44:41Z"},{"id":753653702,"node_id":"RA_kwDOSPdiBc4s69fG","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":31787,"digest":"sha256:a712eac4eef55c0840e6115fe3ca8d033fc60cda6073d700fead90f12800aba4","download_count":3019,"created_at":"2026-11-16T05:53:29Z","updated_at":"2026-11-16T05:53:29Z"}],"body":"### 新功能\n\n- 设置新增工具栏自定义，可配置新建连接、新建查询、备份等按钮的显隐与顺序 (contributed by @ThugKd) (PR [#14667](https://github.com/t8y2/dbx/pull/14667))\n- 全局快速打开升级为统一搜索入口，可在连接、数据库、表、字段、SQL 文件与插件命令间结构化搜索，支持拼音匹配和范围筛选 (contributed by @eryajf) (PR [#14826](https://github.com/t8y2/dbx/pull/14826))\n- 顶部菜单新增可搜索的最近关闭标签选择器，关闭全部标签后也能快速找回 (contributed by @ThugKd) (PR [#14558](https://github.com/t8y2/dbx/pull/14558))\n- 侧栏连接和数据库节点新增新建数据库一级入口，并支持 Shift+F4 快捷键 (contributed by @ThugKd) (PR [#14913](https://github.com/t8y2/dbx/pull/14913))\n- 侧栏选中数据库或表分组时可用快捷键直接打开新建表编辑器 (contributed by @ThugKd) (PR [#14910](https://github.com/t8y2/dbx/pull/14910))\n- 侧栏列名双击行为可配置为生成条件查询语句 (contributed by @ThugKd) (PR [#14552](https://github.com/t8y2/dbx/pull/14552))\n- 执行 SQL 文件对话框新增目标 Schema 选择，批量导入可落入指定 Schema (contributed by @xiaou61) (PR [#14590](https://github.com/t8y2/dbx/pull/14590))\n- 数据网格新增条件面板 WHERE/ORDER BY 宽度比例设置和 ORDER BY 显隐开关 (contributed by @zhongtait) (PR [#14612](https://github.com/t8y2/dbx/pull/14612))\n- 数据库导出支持限制每张表的导出行数，并可按指定字段取最早或最新的 N 行 (contributed by @dienaso) (PR [#14799](https://github.com/t8y2/dbx/pull/14799))\n- SQL 编辑器支持自定义上一条/下一条补全项的快捷键 (contributed by @ThugKd) (PR [#14763](https://github.com/t8y2/dbx/pull/14763))\n- 字段补全新增设置：无歧义字段可不加表名前缀 (contributed by @ThugKd) (PR [#14685](https://github.com/t8y2/dbx/pull/14685))\n- SQL 编辑器双击括号可选中括号内的内容 (contributed by @x-labb) (PR [#14783](https://github.com/t8y2/dbx/pull/14783))\n- Oracle 表右键新增表授权查看，按受权者展示表级与列级权限 (contributed by @ThugKd) (PR [#14953](https://github.com/t8y2/dbx/pull/14953))\n- Oracle 存储过程、函数、序列、包和同义词支持导出对象 DDL 为 SQL 文件 (contributed by @ThugKd) (PR [#14958](https://github.com/t8y2/dbx/pull/14958))\n- Oracle 对象浏览器支持从右键菜单直接编译无效的存储过程、函数和视图 (contributed by @ThugKd) (PR [#14954](https://github.com/t8y2/dbx/pull/14954))\n- PostgreSQL 侧栏新增行级安全策略查看入口 (contributed by @ThugKd) (PR [#14935](https://github.com/t8y2/dbx/pull/14935))\n- PostgreSQL 模式下新增用户自定义聚合函数列表入口 (contributed by @ThugKd) (PR [#14949](https://github.com/t8y2/dbx/pull/14949))\n- PostgreSQL 序列查看显示步长、范围、缓存等选项，并提供新建序列模板 (contributed by @ThugKd) (PR [#14941](https://github.com/t8y2/dbx/pull/14941))\n- Redis 键列表支持按类型筛选，Stream 条目同时显示对应的本地时间 (contributed by @ThugKd) (PR [#14942](https://github.com/t8y2/dbx/pull/14942))\n\n### 改进\n\n- MySQL 表列表新增 AUTO_INCREMENT 值列 (contributed by @x-labb) (PR [#14850](https://github.com/t8y2/dbx/pull/14850))\n- MySQL 补全支持 IGNORE INDEX 和 USE INDEX 索引提示 (contributed by @x-labb) (PR [#14633](https://github.com/t8y2/dbx/pull/14633))\n- MySQL WHERE 条件开头输入字符串字段时提供字段 = '' 补全 (contributed by @ThugKd) (PR [#14947](https://github.com/t8y2/dbx/pull/14947))\n- MySQL INSERT IGNORE 列清单中可补全表字段 (contributed by @jeff377) (PR [#14655](https://github.com/t8y2/dbx/pull/14655))\n- PostgreSQL 未选 Schema 时表补全可跨 Schema 查找，Schema 选择器支持清除 (contributed by @ThugKd) (PR [#14934](https://github.com/t8y2/dbx/pull/14934))\n- PostgreSQL 表 DDL 元数据批量查询失败时标明具体失败项，不再只显示 db error (contributed by @hongshuo-wang) (PR [#14660](https://github.com/t8y2/dbx/pull/14660))\n- Oracle INSERT 语句的 VALUES 与 SYSDATE 等表达式补全更准确 (contributed by @ThugKd) (PR [#14661](https://github.com/t8y2/dbx/pull/14661))\n- Oracle 短 RAW 值（如 SYS_GUID() 结果）在网格中直接显示十六进制 (contributed by @ThugKd) (PR [#14761](https://github.com/t8y2/dbx/pull/14761))\n- Oracle 对象列表元数据查询按请求的对象类型裁剪，大 Schema 下查询负担更低 (contributed by @Acd-kk) (PR [#14979](https://github.com/t8y2/dbx/pull/14979))\n- 达梦字段补全按未加引号标识符规则处理大小写，小写用户名也能匹配字段 (contributed by @ThugKd) (PR [#14937](https://github.com/t8y2/dbx/pull/14937))\n- 达梦编辑器高亮补齐原生数据类型、自增关键字和日期函数 (contributed by @ThugKd) (PR [#14938](https://github.com/t8y2/dbx/pull/14938))\n- SQL Server 批量执行遇旧版驱动时提示升级驱动，不再报反序列化错误 (contributed by @jeff377) (PR [#14621](https://github.com/t8y2/dbx/pull/14621))\n- SQL Server 结构比较延迟加载两侧同名表的 DDL，元数据查询数量减半 (contributed by @BrydonJ) (PR [#14408](https://github.com/t8y2/dbx/pull/14408))\n- Kafka 主题页新增按连接保存的自动加载主题开关 (contributed by @ThugKd) (PR [#14936](https://github.com/t8y2/dbx/pull/14936))\n- RabbitMQ 订阅列表新增消费者客户端地址列 (contributed by @ThugKd) (PR [#14548](https://github.com/t8y2/dbx/pull/14548))\n- StarRocks 视图 DDL 显示时对查询部分做格式化换行 (contributed by @ThugKd) (PR [#14659](https://github.com/t8y2/dbx/pull/14659))\n- TiDB 对象浏览器的行数列明确标注为估算行数 (contributed by @ThugKd) (PR [#14917](https://github.com/t8y2/dbx/pull/14917))\n- MongoDB 只读文档预览按 Mongo Shell 风格显示 ObjectId、BSON 日期等类型 (contributed by @ThugKd) (PR [#14920](https://github.com/t8y2/dbx/pull/14920))\n- CTE 体内的列补全仅引用当前 CTE 体及其之前声明的数据源 (contributed by @x-labb) (PR [#14632](https://github.com/t8y2/dbx/pull/14632))\n- CSV 导入支持多字符分隔符（如 |@|） (contributed by @ThugKd) (PR [#14273](https://github.com/t8y2/dbx/pull/14273))\n- ClickHouse 连接测试错误展示完整传输层原因链（DNS/TCP/TLS 等）\n- AI 预设列表更新：移除 Atlas Cloud 集成\n- AI 预设列表更新：下线 Jalapeno Cloud，优先展示 AICodeMirror\n- AI 助手识别虚谷（XuguDB）方言的 SQL 转换请求 (contributed by @mapan0424) (PR [#14699](https://github.com/t8y2/dbx/pull/14699))\n- 更新中心显示真实下载进度和更新全部的批量进度 (contributed by @hongshuo-wang) (PR [#14570](https://github.com/t8y2/dbx/pull/14570))\n- 更新中心弹窗高度随内容自适应，正文滚动时标题和操作按钮保持可见 (contributed by @ThugKd) (PR [#14765](https://github.com/t8y2/dbx/pull/14765))\n- SQL 参数对话框新增一键清除参数值历史 (contributed by @xiaou61) (PR [#14903](https://github.com/t8y2/dbx/pull/14903))\n- 结构比较结果与部署确认步骤顶部显示源/目标两端连接信息 (contributed by @xiaou61) (PR [#14886](https://github.com/t8y2/dbx/pull/14886))\n- SQL 编辑器数据库选择器选项可直接复制数据库名 (contributed by @heeeex100) (PR [#14387](https://github.com/t8y2/dbx/pull/14387))\n- 新查询保存到 SQL 库时默认归入同名数据库文件夹，图标按连接颜色区分 (contributed by @ThugKd) (PR [#14956](https://github.com/t8y2/dbx/pull/14956))\n- 表详情面板新增新建查询入口 (contributed by @ThugKd) (PR [#14906](https://github.com/t8y2/dbx/pull/14906))\n- 表数据页隐藏列后复制查询 SQL 只包含可见列 (contributed by @x-labb) (PR [#14940](https://github.com/t8y2/dbx/pull/14940))\n- 数据网格检索浮层可拖动到表格内其他位置 (contributed by @ThugKd) (PR [#14904](https://github.com/t8y2/dbx/pull/14904))\n- WHERE 字段下拉按网格自定义列顺序排列 (contributed by @xiaou61) (PR [#14887](https://github.com/t8y2/dbx/pull/14887))\n- 快捷筛选与排序构建器的候选字段跟随表格列布局排序 (contributed by @ThugKd) (PR [#14914](https://github.com/t8y2/dbx/pull/14914))\n- 表头排序图标左键点击直接切换升/降序，右键仍可打开完整菜单 (contributed by @ThugKd) (PR [#14680](https://github.com/t8y2/dbx/pull/14680))\n- 结果集筛选可视化：已筛选列头显示漏斗标识，可单独关闭某个字段的筛选 (contributed by @dienaso) (PR [#14975](https://github.com/t8y2/dbx/pull/14975))\n- 表格拖动表头调整列顺序后先确认再保存，避免误拖改变布局 (contributed by @ThugKd) (PR [#14978](https://github.com/t8y2/dbx/pull/14978))\n- 对象列表列设置按钮固定在表头右侧，不再遮挡列标题 (contributed by @ThugKd) (PR [#14813](https://github.com/t8y2/dbx/pull/14813))\n- 对象列表常用列（行数、注释等）前置，并补显示创建和更新时间 (contributed by @Acd-kk) (PR [#14959](https://github.com/t8y2/dbx/pull/14959))\n- 对象列表新增重置顺序操作，一键恢复内置列顺序 (contributed by @ThugKd) (PR [#14694](https://github.com/t8y2/dbx/pull/14694))\n- Oracle 对象浏览器默认视图搜索时匹配已加载的各类对象，不再只搜表名 (contributed by @ThugKd) (PR [#14932](https://github.com/t8y2/dbx/pull/14932))\n- 快速打开支持按 MySQL 字段名、字段注释和表注释搜索 (contributed by @ThugKd) (PR [#14951](https://github.com/t8y2/dbx/pull/14951))\n- 多语句执行摘要的耗时列按量级自适应显示单位 (contributed by @MomentarySixthSense) (PR [#14902](https://github.com/t8y2/dbx/pull/14902))\n- 新建查询等入口统一图标并显示快捷键提示 (contributed by @eryajf) (PR [#14990](https://github.com/t8y2/dbx/pull/14990))\n- 桌面主窗口最小宽度降至 760 逻辑像素，适配更窄窗口 (contributed by @ThugKd) (PR [#14948](https://github.com/t8y2/dbx/pull/14948))\n- 侧栏拖拽把手在浅色背景下清晰可见 (contributed by @sx4im) (PR [#14928](https://github.com/t8y2/dbx/pull/14928))\n- 拖动结果表横向滚动条时不再弹出 SQL 悬浮预览遮挡内容 (contributed by @chukui2005) (PR [#14640](https://github.com/t8y2/dbx/pull/14640))\n- Nacos 配置页窄分栏下筛选输入框显示更完整 (contributed by @chukui2005) (PR [#14855](https://github.com/t8y2/dbx/pull/14855))\n- SQL 编辑器主题样式跨标签生命周期复用，恢复缓存标签不再累积重复样式 (contributed by @Acd-kk) (PR [#14463](https://github.com/t8y2/dbx/pull/14463))\n- 西班牙语界面补齐 224 个缺失词条，回到与英文对齐 (contributed by @0scar07) (PR [#14214](https://github.com/t8y2/dbx/pull/14214))\n\n### 修复\n\n- MySQL 服务器默认 autocommit=0 时，自动提交标签页的写入不再被静默回滚 (contributed by @Acd-kk) (PR [#14662](https://github.com/t8y2/dbx/pull/14662))\n- MySQL 查询标签切换数据库后保留会话变量、临时表和事务状态 (contributed by @Acd-kk) (PR [#14927](https://github.com/t8y2/dbx/pull/14927))\n- MySQL 大表导出中断后立即停止服务端查询，不再因排空结果集超时卡住导出队列 (contributed by @jeff377) (PR [#14861](https://github.com/t8y2/dbx/pull/14861))\n- MySQL 诊断不再把 TIMESTAMPDIFF/TIMESTAMPADD 的时间单位误报为未知字段 (contributed by @ThugKd) (PR [#14810](https://github.com/t8y2/dbx/pull/14810))\n- PostgreSQL 删除外表生成 DROP FOREIGN TABLE，侧栏删除外表不再报错 (contributed by @xiaou61) (PR [#14771](https://github.com/t8y2/dbx/pull/14771))\n- CockroachDB 索引与列元数据查询改用 concat()，不再报 unknown function: textcat (contributed by @Pius-x) (PR [#14875](https://github.com/t8y2/dbx/pull/14875))\n- GaussDB 列查询改用 ::int 简写，侧栏可正常列出表字段 (contributed by @xiaou61) (PR [#15000](https://github.com/t8y2/dbx/pull/15000))\n- PostgreSQL 视图与列注释在单对象 DDL 和数据库导出中完整保留 (contributed by @CN-Scars) (PR [#14753](https://github.com/t8y2/dbx/pull/14753))\n- openGauss 普通账号备份按 USAGE 权限过滤 Schema，不再因无权 Schema 整体失败 (contributed by @zipg) (PR [#14275](https://github.com/t8y2/dbx/pull/14275))\n- Greenplum、Cloudberry、Hologres 停用元组定位符，无主键表编辑不再报错\n- 数据网格排序被数据库拒绝时自动去掉行定位符重试 (contributed by @sx4im) (PR [#14939](https://github.com/t8y2/dbx/pull/14939))\n- Kingbase 查询工具栏不再误清除已保存的默认数据库 (contributed by @ThugKd) (PR [#14816](https://github.com/t8y2/dbx/pull/14816))\n- DROP INDEX CONCURRENTLY 语句不再被编辑器误标为语法错误 (contributed by @dienaso) (PR [#14856](https://github.com/t8y2/dbx/pull/14856))\n- Oracle 会话遵循客户端日期语言，中文 NLS 日期字面量不再报 ORA-01843 (contributed by @Lan-zk) (PR [#14863](https://github.com/t8y2/dbx/pull/14863))\n- Oracle 语义诊断解析 PUBLIC 同义词，DUAL 等不再误报未知表 (contributed by @zipg) (PR [#14864](https://github.com/t8y2/dbx/pull/14864))\n- Oracle 对象浏览器恢复显示表、视图和物化视图的注释 (contributed by @ThugKd) (PR [#14687](https://github.com/t8y2/dbx/pull/14687))\n- Oracle 以多层括号或前置注释开头的查询可正常返回结果行 (contributed by @ThugKd) (PR [#14436](https://github.com/t8y2/dbx/pull/14436))\n- Oracle 与 SQL Server 同义词的 DDL 和列信息解析到背后的底层对象 (contributed by @jeff377) (PR [#14896](https://github.com/t8y2/dbx/pull/14896))\n- Oracle 11g 下 PL/SQL 调试辅助标识符缩短到 30 字符内，调试功能恢复可用\n- SQL Server 临时表补全不再因 tempdb 目录锁阻塞整个连接的元数据请求 (contributed by @jeff377) (PR [#14466](https://github.com/t8y2/dbx/pull/14466))\n- 达梦实例缺少 ALL_OBJECTS 字典时回退 JDBC 元数据，表列表可正常显示 (contributed by @xiaou61) (PR [#14998](https://github.com/t8y2/dbx/pull/14998))\n- 达梦 CURRENT_USER 被拒绝时回退 USER，作业页面可正常打开\n- 达梦 dexp/dimp 对含 @ 或 / 的密码加引号处理，导出导入不再连接失败\n- ClickHouse 执行 USE 后查询跟随切换到新数据库，不再返回旧库数据\n- InfluxDB 语句错误随 HTTP 200 返回时如实报错，不再显示成功 0 行 (contributed by @xiaou61) (PR [#15001](https://github.com/t8y2/dbx/pull/15001))\n- Teradata 表预览与有界读改用 TOP/ROW_NUMBER 分页，不再生成报 3706 错误的 LIMIT (contributed by @dienaso) (PR [#14630](https://github.com/t8y2/dbx/pull/14630))\n- Doris 与 StarRocks 表在侧栏大小模式下正常显示表大小 (contributed by @xiaou61) (PR [#14965](https://github.com/t8y2/dbx/pull/14965))\n- Redis 值面板窄分栏下自动换行开关不再竖排换行并遮挡下方控件 (contributed by @Abeautifulsnow) (PR [#14760](https://github.com/t8y2/dbx/pul