02c5141020bcf4b","download_count":19,"created_at":"2026-11-26T02:36:15Z","updated_at":"2026-11-26T02:36:17Z"},{"id":792860276,"node_id":"RA_kwDOSPdiBc4vQhZ0","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":51836135,"digest":"sha256:e257f0ef0f84ca13d040d3e469f1aeec716efa7aff176560be65e2601f2bdc08","download_count":52,"created_at":"2026-11-25T19:34:30Z","updated_at":"2026-11-25T19:34:32Z"},{"id":794063158,"node_id":"RA_kwDOSPdiBc4vVHE2","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":12309,"digest":"sha256:dd8b110942793d437c674d83e4d2cac6c40e8758eef210b207635498f60b9f74","download_count":7155,"created_at":"2026-11-26T02:49:36Z","updated_at":"2026-11-26T02:49:37Z"}],"body":"### 新功能\n\n- MySQL 表对象支持直接编辑注释等元数据，并提供对象分组管理入口 (contributed by @A-noble) (PR [#14905](https://github.com/t8y2/dbx/pull/14905))\n\n### 改进\n\n- 日语界面全面润色并统一术语 (contributed by @cwatanab) (PR [#14222](https://github.com/t8y2/dbx/pull/14222))\n- AI 预设列表更新：移除 HiAPI 集成\n\n### 修复\n\n- 语句超时设置只作用于查询读取，不再中断写入和 DDL 语句 (contributed by @zipg) (PR [#15362](https://github.com/t8y2/dbx/pull/15362))\n- Kingbase 序列 DDL 改用 concat() 生成，不再因 || 操作符缺失报错 (contributed by @0xvectr) (PR [#15636](https://github.com/t8y2/dbx/pull/15636))\n- 行点击聚焦不再导致表结构编辑器列下拉框收起 (contributed by @Acd-kk) (PR [#15610](https://github.com/t8y2/dbx/pull/15610))\n- 换行和非溢出模式下隐藏标签栏横向滚动条 (contributed by @Acd-kk) (PR [#15635](https://github.com/t8y2/dbx/pull/15635))\n- SQL 文件预览对话框高度稳定，不再反复跳动 (contributed by @zipg) (PR [#15613](https://github.com/t8y2/dbx/pull/15613))\n- 结果网格不再在每次刷新时重建滚动 ResizeObserver，降低刷新开销\n","mentions_count":5}
