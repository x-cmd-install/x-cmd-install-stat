,"site_admin":false},"content_type":"application/zip","state":"uploaded","size":39059456,"digest":"sha256:2c0a94428de170cc24603d05afc3f9a6e2b5d0ed4721093692ea5e38f2f5ccbc","download_count":53,"created_at":"2026-10-14T16:58:50Z","updated_at":"2026-10-14T16:58:52Z"},{"id":641075476,"node_id":"RA_kwDOSPdiBc4mNgkU","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43862110,"digest":"sha256:e6dc28e12a6bf61df62ca1345cf40e427e95572a824e6488d4e8cd257579dfad","download_count":77,"created_at":"2026-10-14T17:14:04Z","updated_at":"2026-10-14T17:14:06Z"},{"id":641132952,"node_id":"RA_kwDOSPdiBc4mNumY","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":17806,"digest":"sha256:283025bf6cd191dd4e8c45610d457adabd3042e7f1880724632524c25e3f7377","download_count":9738,"created_at":"2026-10-14T17:35:59Z","updated_at":"2026-10-14T17:36:00Z"}],"body":"### \u8d5e\u52a9\u4fe1\u606f\n\n- \u8d5e\u52a9\u4f19\u4f34 HuaLongAI\uff08\u534e\u9f99\u7b97\u529b\uff09\u611f\u6069\u56de\u9988\u8001\u7528\u6237\uff1a10 \u6708 19 \u65e5\u4e0a\u5348 10 \u70b9\u5728\u5176\u4f01\u4e1a\u5fae\u4fe1\u7fa4\u62bd\u5956\uff0c\u5956\u54c1\u4e3a\u4e00\u53f0 vmiss CN.HK.BGP.Basic \u4e3b\u673a\uff08\u6709\u6548\u671f\u81f3 2027-05-16\uff09\uff0c[\u6d3b\u52a8\u5165\u53e3](https://dbx.hualong.online/)\n\n### \u65b0\u529f\u80fd\n\n- \u65b0\u589e StarRocks \u6570\u636e\u5e93\u652f\u6301\uff0c\u53ef\u8fde\u63a5\u6267\u884c SQL \u5e76\u5728\u8868\u7ed3\u6784\u7f16\u8f91\u5668\u4e2d\u7ba1\u7406\u8868\u3001\u5206\u533a\u4e0e\u6876\u5e03\u5c40 (contributed by @AspBamboo) (PR [#11687](https://github.com/t8y2/dbx/pull/11687))\n- \u65b0\u589e\u6cf0\u8bed\u754c\u9762 (contributed by @PingSunn) (PR [#11935](https://github.com/t8y2/dbx/pull/11935))\n- \u8868\u7ed3\u6784\u7f16\u8f91\u5668\u652f\u6301\u8de8\u8fde\u63a5\u3001\u8de8\u6570\u636e\u5e93\u590d\u5236\u5b57\u6bb5 (contributed by @eryajf) (PR [#12137](https://github.com/t8y2/dbx/pull/12137))\n- \u6570\u636e\u5e93\u7ed3\u6784\u641c\u7d22\u540c\u65f6\u5339\u914d\u8868\u6ce8\u91ca\uff0c\u6309\u6ce8\u91ca\u5185\u5bb9\u4e5f\u80fd\u627e\u5230\u5bf9\u5e94\u7684\u8868 (contributed by @HighBigSky) (PR [#11860](https://github.com/t8y2/dbx/pull/11860))\n- OceanBase Oracle \u6a21\u5f0f\u7684\u8868\u3001\u89c6\u56fe\u3001\u8fc7\u7a0b\u548c\u51fd\u6570\u91cd\u547d\u540d\u4f1a\u5148\u751f\u6210\u53d8\u66f4\u9884\u89c8\u518d\u6267\u884c\uff0c\u5e76\u652f\u6301\u5305\u53e6\u5b58\u4e3a (contributed by @efeire) (PR [#12144](https://github.com/t8y2/dbx/pull/12144))\n- Oracle \u8fde\u63a5\u65b0\u589e\u7528\u6237\u4e0e\u6743\u9650\u7ba1\u7406\u9875\u9762\uff0c\u53ef\u76f4\u63a5\u7ba1\u7406\u8d26\u53f7\u548c\u6388\u6743 (contributed by @efeire) (PR [#12005](https://github.com/t8y2/dbx/pull/12005))\n- \u8fbe\u68a6\u7684 SQL \u8865\u5168\u652f\u6301\u50cf Oracle \u4e00\u6837\u5efa\u8bae\u5e8f\u5217 (contributed by @yiqiui) (PR [#12161](https://github.com/t8y2/dbx/pull/12161))\n- MQTT \u6d88\u606f Payload \u67e5\u770b\u5668\u65b0\u589e\u5168\u90e8\u5c55\u5f00\u548c\u5168\u90e8\u6298\u53e0\u64cd\u4f5c (contributed by @onlytl) (PR [#12186](https://github.com/t8y2/dbx/pull/12186))\n\n### \u6539\u8fdb\n\n- \u5185\u7f6e MCP \u670d\u52a1\u7684\u5168\u90e8\u9759\u6001\u5de5\u5177\u58f0\u660e\u5de5\u5177\u6ce8\u89e3\uff0cMCP \u5ba2\u6237\u7aef\u53ef\u4ee5\u6b63\u786e\u8bc6\u522b\u53ea\u8bfb\u7b49\u5de5\u5177\u5c5e\u6027 (contributed by @yiqiui) (PR [#12185](https://github.com/t8y2/dbx/pull/12185))\n- \u8fbe\u68a6\u67e5\u8be2\u5148\u6267\u884c\u8bed\u53e5\u3001\u518d\u6309\u9700\u52a0\u8f7d\u51b7\u5143\u6570\u636e\uff0c\u51cf\u5c11\u6267\u884c\u524d\u7684\u7b49\