u4e2d\u5bf9\u8c61\u7684\u8868\u7ed3\u6784\u7f16\u8f91\u5668 (contributed by @lxk955) (PR [#12037](https://github.com/t8y2/dbx/pull/12037))\n- \u8868\u7ed3\u6784\u7f16\u8f91\u5668\u4e2d\u6309 F5 \u5373\u53ef\u5237\u65b0\u5f53\u524d\u8868\u7ed3\u6784 (contributed by @kkwangxx) (PR [#11858](https://github.com/t8y2/dbx/pull/11858))\n- \u6807\u7b7e\u9875\u652f\u6301\u7528 Ctrl/Cmd+Shift+T \u6216\u53f3\u952e\u83dc\u5355\u91cd\u65b0\u6253\u5f00\u6700\u8fd1\u5173\u95ed\u7684\u6807\u7b7e\u9875 (contributed by @lxk955) (PR [#11651](https://github.com/t8y2/dbx/pull/11651))\n- \u6570\u636e\u7f51\u683c\u89c6\u56fe\u9009\u9879\u65b0\u589e\u300c\u5168\u5c40\u51bb\u7ed3\u9996\u5217\u300d\uff0c\u6a2a\u5411\u6eda\u52a8\u65f6\u4fdd\u6301\u9996\u5217\u56fa\u5b9a (contributed by @eryajf) (PR [#11633](https://github.com/t8y2/dbx/pull/11633))\n- \u9012\u589e ID \u751f\u6210\u652f\u6301\u8865\u96f6\u4f4d\u6570\u3001\u81ea\u5b9a\u4e49\u524d\u7f00\u548c\u540e\u7f00\uff0c\u5e76\u5b9e\u65f6\u9884\u89c8\u751f\u6210\u6548\u679c (contributed by @lxk955) (PR [#11937](https://github.com/t8y2/dbx/pull/11937))\n- JSON \u503c\u7f16\u8f91\u5668\u652f\u6301\u8282\u70b9\u6298\u53e0\uff0c\u6298\u53e0\u7bad\u5934\u6539\u7528\u7edf\u4e00\u7684 SVG \u56fe\u6807\uff0c\u907f\u514d\u5728\u90e8\u5206\u5b57\u4f53\u4e0b\u663e\u793a\u4e3a\u7a7a\u6846 (contributed by @lxk955) (PR [#11938](https://github.com/t8y2/dbx/pull/11938))\n- \u5feb\u6377\u952e\u641c\u7d22\u65b0\u589e\u300c\u5f55\u5236\u6309\u952e\u300d\u6a21\u5f0f\uff0c\u6309\u4e0b\u7ec4\u5408\u952e\u5373\u53ef\u7b5b\u9009\u51fa\u7ed1\u5b9a\u8be5\u952e\u7684\u64cd\u4f5c (contributed by @Abeautifulsnow) (PR [#11949](https://github.com/t8y2/dbx/pull/11949))\n- OceanBase Oracle \u6a21\u5f0f\u7684 SQL \u8865\u5168\u652f\u6301\u5efa\u8bae\u5e8f\u5217\u540d\u4ee5\u53ca NEXTVAL/CURRVAL \u4f2a\u5217 (contributed by @lxk955) (PR [#12073](https://github.com/t8y2/dbx/pull/12073))\n- SAP HANA \u652f\u6301\u8868\u91cd\u547d\u540d\u548c\u8868\u7ed3\u6784\u7f16\u8f91\uff0c\