6807\u9898\u547d\u540d (contributed by @lxk955) (PR [#12525](https://github.com/t8y2/dbx/pull/12525))\n- OpenCode CLI \u63d0\u4f9b\u65b9\u652f\u6301 OpenCode 2\uff0c\u53ef\u81ea\u52a8\u63a2\u6d4b\u7248\u672c\u6216\u624b\u52a8\u6307\u5b9a\uff0c\u4e0d\u518d\u5bf9 2.x \u4f20\u5165\u5df2\u79fb\u9664\u7684 --pure \u53c2\u6570 (contributed by @lxk955) (PR [#12546](https://github.com/t8y2/dbx/pull/12546))\n- \u7f16\u8f91\u5668\u65b0\u589e\u5feb\u6377\u952e\u76f4\u63a5\u6253\u5f00\u8fde\u63a5\u3001\u6570\u636e\u5e93\u548c Schema \u9009\u62e9\u5668\uff08\u9ed8\u8ba4 Cmd/Ctrl+Alt+C/D/S\uff0c\u53ef\u5728\u8bbe\u7f6e\u4e2d\u81ea\u5b9a\u4e49\uff09 (contributed by @SaifAqqad) (PR [#12538](https://github.com/t8y2/dbx/pull/12538))\n- \u7ed3\u6784\u5bf9\u6bd4\u90e8\u7f72\u65b0\u589e\u51fa\u9519\u7ee7\u7eed\u9009\u9879\uff0c\u5355\u6761\u8bed\u53e5\u5931\u8d25\u65f6\u53ef\u9009\u7ee7\u7eed\u6267\u884c\u5269\u4f59\u811a\u672c (contributed by @Xcylway) (PR [#12545](https://github.com/t8y2/dbx/pull/12545))\n\n### \u6539\u8fdb\n\n- \u5bf9\u8c61\u6d4f\u89c8\u5668\u65b0\u589e\u8bbe\u7f6e\uff0c\u53ef\u5173\u95ed\u9009\u4e2d\u5bf9\u8c61\u65f6\u81ea\u52a8\u6253\u5f00\u8be6\u60c5\u9762\u677f (contributed by @lxk955) (PR [#12559](https://github.com/t8y2/dbx/pull/12559))\n- \u7ed3\u679c\u6807\u7b7e\u9875\u65b0\u589e\u8bbe\u7f6e\uff0c\u53ef\u5173\u95ed\u70b9\u51fb\u6807\u7b7e\u9875\u56fa\u5b9a\u7ed3\u679c\u7684\u4ea4\u4e92 (contributed by @Xcylway) (PR [#12555](https://github.com/t8y2/dbx/pull/12555))\n- \u7ed3\u679c\u9762\u677f\u5e95\u90e8\u7684 SQL \u8bed\u53e5\u680f\u652f\u6301\u5f00\u5173\u663e\u793a (contributed by @eryajf) (PR [#12520](https://github.com/t8y2/dbx/pull/12520))\n- \u4fa7\u8fb9\u680f\u6d3b\u52a8\u8fde\u63a5\u663e\u793a\u4e3b\u673a\u548c\u7aef\u53e3\uff0c\u591a\u8fde\u63a5\u540c\u540d\u65f6\u66f4\u6613\u533a\u5206 (contributed by @dienaso) (PR [#12536](https://github.com/t8y2/dbx/pull/12536))\n- \u67e5\u8be2\u6807\u7b7e\u9875\u6539\u7528\u67e5\u8be2\u6587\u4ef6\u56fe\u6807\uff0