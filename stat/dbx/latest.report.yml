u636e\u4f20\u8f93\u4ec5\u7ed3\u6784\u6a21\u5f0f\u65b0\u589e\u6267\u884c\u524d SQL \u9884\u89c8\uff0c\u53ef\u5148\u786e\u8ba4\u76ee\u6807\u5e93\u5c06\u8981\u6267\u884c\u7684\u7ed3\u6784\u8bed\u53e5\u518d\u5f00\u59cb\u4f20\u8f93 (contributed by @0verme) (PR [#11066](https://github.com/t8y2/dbx/pull/11066))\n- \u63d2\u4ef6\u5de5\u4f5c\u53f0\u65b0\u589e\u72ec\u7acb\u6d6e\u7a97\u627f\u8f7d\u65b9\u5f0f\uff0c\u53ef\u7f6e\u9876\u5e38\u9a7b\u5e76\u505c\u9760\u5230\u5c4f\u5e55\u8fb9\u7f18\uff0c\u9002\u5408\u64ad\u653e\u5668\u3001\u5feb\u6377\u9009\u62e9\u5668\u7b49\u5c0f\u7ec4\u4ef6 (contributed by @onceMisery) (PR [#11064](https://github.com/t8y2/dbx/pull/11064))\n- \u67e5\u8be2\u56fe\u8868\u652f\u6301\u5728\u67f1\u72b6\u56fe\u548c\u6298\u7ebf\u56fe\u4e0a\u663e\u793a\u6570\u636e\u6807\u7b7e\uff0c\u76f4\u63a5\u8bfb\u53d6\u6bcf\u4e2a\u6570\u636e\u70b9\u7684\u6570\u503c (contributed by @lxk955) (PR [#11067](https://github.com/t8y2/dbx/pull/11067))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u884c\u5c3e\u591a\u5149\u6807\uff0c\u53ef\u4e00\u6b21\u5728\u591a\u884c\u884c\u5c3e\u540c\u65f6\u8f93\u5165 (contributed by @eryajf) (PR [#10880](https://github.com/t8y2/dbx/pull/10880))\n- \u5de5\u5177\u680f\u65b0\u589e\u7acb\u5373\u540c\u6b65\u5165\u53e3\uff0c\u65e0\u9700\u8fdb\u5165\u8bbe\u7f6e\u5373\u53ef\u89e6\u53d1\u540c\u6b65 (contributed by @eryajf) (PR [#10898](https://github.com/t8y2/dbx/pull/10898))\n- CREATE TABLE \u548c ALTER TABLE \u4e2d\u7684\u5217\u7c7b\u578b\u652f\u6301\u81ea\u52a8\u8865\u5168 (contributed by @lxk955) (PR [#11073](https://github.com/t8y2/dbx/pull/11073))\n- \u4fa7\u8fb9\u680f\u53cc\u51fb\u5b57\u6bb5\u6216\u7d22\u5f15\u76f4\u63a5\u6253\u5f00\u8868\u7ed3\u6784\u7f16\u8f91\u5668\u5e76\u5b9a\u4f4d\u5230\u76ee\u6807\u9879\uff0c\u5355\u51fb\u5b9a\u4f4d\u6570\u636e\u5217\u7684\u884c\u4e3a\u4fdd\u6301\u4e0d\u53d8 (contributed by @eryajf) (PR [#11075](https://github.com/t8y2/dbx/pull/11075))\n- \u4fa7\u8fb9\u680f\u5bf9\u8c61\u6811\u663e\u793a\u5b58\u50a8\u8fc7\u7a0b\u548c\