279\u91cf\u52fe\u9009\uff0c\u8868\u540d\u4e2d\u7684\u661f\u53f7\u3001\u9017\u53f7\u548c\u70b9\u53f7\u4fdd\u6301\u5b57\u9762\u542b\u4e49 (contributed by @zipg) (PR [#10900](https://github.com/t8y2/dbx/pull/10900))\n- SQL Server \u65f6\u6001\u8868\u7684\u4ea4\u4e92\u5f0f DDL \u5b8c\u6574\u4fdd\u7559 GENERATED ALWAYS\u3001HIDDEN\u3001PERIOD\u3001\u7cfb\u7edf\u7248\u672c\u63a7\u5236\u548c\u5386\u53f2\u8868\u5173\u8054\uff0c\u5386\u53f2\u8868\u5b9a\u4e49\u4e2d\u6ce8\u660e\u6240\u5c5e\u65f6\u6001\u8868 (contributed by @zipg) (PR [#10913](https://github.com/t8y2/dbx/pull/10913))\n- \u5bfc\u5165\u65e0\u6807\u9898\u7684 CSV\u3001TSV\u3001\u5206\u9694\u6587\u672c\u548c Excel \u5230\u5df2\u6709\u8868\u65f6\uff0c\u6e90\u5217\u6309\u76ee\u6807\u5b57\u6bb5\u987a\u5e8f\u81ea\u52a8\u6620\u5c04\uff0c\u4e0d\u518d\u9700\u8981\u9010\u5217\u624b\u52a8\u9009\u62e9 (contributed by @CSXFanMeng) (PR [#10822](https://github.com/t8y2/dbx/pull/10822))\n- \u6570\u636e\u89c6\u56fe\u8868\u5934\u7684\u8fde\u63a5\u540d\u548c\u300c\u5e93\u540d@\u6a21\u5f0f\u300d\u80f6\u56ca\u6539\u4e3a\u53ef\u70b9\u51fb\uff0c\u53ef\u56de\u8df3\u5bf9\u5e94\u8fde\u63a5\u6216\u5bf9\u8c61\u6d4f\u89c8\u5668\u5e76\u590d\u7528\u5df2\u6709\u6807\u7b7e\u9875 (contributed by @onceMisery) (PR [#10899](https://github.com/t8y2/dbx/pull/10899))\n- MongoDB \u5b57\u6bb5\u8865\u5168\u6539\u4e3a\u4ece\u968f\u673a\u91c7\u6837\u7684 100 \u4e2a\u6587\u6863\u5b66\u4e60\u96c6\u5408\u7ed3\u6784\uff0c\u4ec5\u5b58\u5728\u4e8e\u8f83\u65b0\u6216\u8f83\u5c11\u6587\u6863\u4e2d\u7684\u5b57\u6bb5\u548c\u66f4\u6df1\u7684\u6570\u7ec4\u5143\u7d20\u4e5f\u80fd\u88ab\u5efa\u8bae (contributed by @thailoc-dev) (PR [#10902](https://github.com/t8y2/dbx/pull/10902))\n- MongoDB \u8865\u5168\u652f\u6301 show dbs\u3001createUser \u548c\u65e7\u7248 insert \u8f85\u52a9\u547d\u4ee4 (contributed by @thailoc-dev) (PR [#10904](https://github.com/t8y2/dbx/pull/10904))\n- MongoDB \u7b5b\u9009\u6761\u4ef6\u4e2d\u8fd0\u7b97\u7b26\u7684\u503c\u4f4d\u7f6e\u6309\u8fd0\u7b97