:"application/json","state":"uploaded","size":17599,"digest":"sha256:e6d3c53e37228a86858604ecf695cbfb0cf09999285098d9733c5117879edc5a","download_count":2598,"created_at":"2026-09-26T01:22:38Z","updated_at":"2026-09-26T01:22:38Z"}],"body":"### \u65b0\u529f\u80fd\n- DBX MCP \u65b0\u589e\u539f\u751f\u72ec\u7acb\u5b89\u88c5\uff0c\u8bbe\u7f6e\u9875\u53ef\u4e00\u952e\u5207\u6362\u5e76\u4fdd\u7559 npm \u5b89\u88c5\u4f5c\u4e3a\u515c\u5e95\uff0cMCP \u670d\u52a1\u7aef\u65b0\u589e\u8d44\u6e90\u53d1\u73b0\uff08resources\uff09\u80fd\u529b\n- \u8bbe\u7f6e\u9875\u65b0\u589e Web/Docker \u7248 MCP HTTP \u8bbf\u95ee\u7ba1\u7406\uff0c\u652f\u6301\u8bbf\u95ee\u5bc6\u7801\u3001Host/Origin \u767d\u540d\u5355\u4e0e\u4ee4\u724c\u8f6e\u6362 (contributed by @HandSonic) (PR [#10294](https://github.com/t8y2/dbx/pull/10294))\n- \u6570\u636e\u5b57\u5178 PDF \u5bfc\u51fa\u6539\u4e3a\u540e\u53f0\u4efb\u52a1\uff0c\u5173\u95ed\u5411\u5bfc\u4e0d\u518d\u4e2d\u65ad\u5bfc\u51fa\uff0c\u53ef\u5728\u4efb\u52a1\u9762\u677f\u67e5\u770b\u8fdb\u5ea6\u4e0e\u7ed3\u679c (contributed by @caichangqing1120) (PR [#10304](https://github.com/t8y2/dbx/pull/10304))\n- \u8868\u7ed3\u6784 DDL \u5f39\u6846\u652f\u6301\u56db\u8fb9\u56db\u89d2\u62d6\u62fd\u7f29\u653e\uff0c\u53cc\u51fb\u6807\u9898\u680f\u53ef\u6700\u5927\u5316\u4e0e\u8fd8\u539f (contributed by @ma123456mai) (PR [#10293](https://github.com/t8y2/dbx/pull/10293))\n- \u5bf9\u8c61\u6d4f\u89c8\u5668\u4e2d\u6253\u5f00\u8868\u65f6\u9ed8\u8ba4\u663e\u793a DDL \u9875\u7b7e\uff0c\u300c\u8868\u4fe1\u606f\u300d\u9875\u7b7e\u4ecd\u53ef\u5207\u6362 (contributed by @eryajf) (PR [#10314](https://github.com/t8y2/dbx/pull/10314))\n### \u6539\u8fdb\n- \u66f4\u65b0\u4e2d\u5fc3\u6539\u7528\u7d27\u51d1\u5355\u884c\u5217\u8868\u6837\u5f0f\u5e76\u4e3a\u9875\u7b7e\u589e\u52a0\u4e0b\u5212\u7ebf\u6307\u793a\n### \u4fee\u590d\n- PostgreSQL 9.2\u20139.4 \u7ed3\u6784\u540c\u6b65\u4e0d\u518d\u751f\u6210 CREATE INDEX / CREATE SEQUENCE \u7684 IF NOT EXISTS\uff0c\u4f4e\u7248\u672c\u53ef\u6b63\u5e38\u6267\u884c (contributed by @zipg) (PR [#10326](https://github.com/t8y2/dbx/pull/10326))\n- \u4fee\u590d PostgreSQL 9.x \u67e5\u770b\u8868\u7ed3\u6784 DDL \u4e0e\u5bfc\u51fa\u5e8f\u5217\u5931\u8d25\u7684\u95ee\u9898 (contributed by @zipg) (PR [#10306](https://github.com/t8y2/dbx/pull/10306))\n- \u7ed3\u6784\u540c\u6b65\u521b\u5efa\u76ee\u6807\u5e8f\u5217\u65f6\u4e0d\u518d\u5f15\u7528\u6e90\u5e93\u7684\u9ed8\u8ba4\u503c (contributed by @thanadon-dev) (PR [#10299](https://github.com/t8y2/dbx/pull/10299))\n- MySQL \u517c\u5bb9\u5f15\u64ce\u62d2\u7edd\u8865\u5168\u5143\u6570\u636e\u67e5\u8be2\u65f6\u81ea\u52a8\u56de\u9000\uff0c\u4ee3\u7801\u8865\u5168\u4e0d\u518d\u5931\u8d25 (contributed by @CN-Scars) (PR [#10305](https://github.com/t8y2/dbx/pull/10305))\n- \u8fde\u63a5 MyCAT\u3001DBLE \u7b49 MySQL \u4e2d\u95f4\u4ef6\u65f6\u8868\u6e05\u5355\u53ef\u6b63\u5e38\u52a0\u8f7d\n- Doris \u8fde\u63a5\u6b63\u786e\u5e94\u7528 MySQL TLS \u914d\u7f6e (contributed by @CN-Scars) (PR [#10320](https://github.com/t8y2/dbx/pull/10320))\n- SQL Server \u67e5\u770b\u4e0e\u5bfc\u51fa DDL \u4fdd\u7559\u8ba1\u7b97\u5217\u539f\u59cb\u5b9a\u4e49\uff0c\u4e0d\u518d\u5199\u6210\u6d3e\u751f\u7ed3\u679c\u7c7b\u578b (contributed by @zipg) (PR [#10290](https://github.com/t8y2/dbx/pull/10290))\n- SQL Server\uff08\u65e7\u9a71\u52a8\uff09\u89c6\u56fe\u4e0e\u89e6\u53d1\u5668\u7684\u300c\u67e5\u770b DDL\u300d\u8fd4\u56de\u5bf9\u8c61\u5b9a\u4e49\uff0c\u4e0d\u518d\u62a5 Unsupported object type (contributed by @zipg) (PR [#10279](https://github.com/t8y2/dbx/pull/10279))\n- OceanBase Oracle \u6a21\u5f0f\u6253\u5f00\u90e8\u5206\u5b58\u50a8\u8fc7\u7a0b\u4e0d\u518d\u754c\u9762\u65e0\u54cd\u5e94\uff0cPL \u6e90\u7801\u4f18\u5148\u4ece ALL_SOURCE \u8bfb\u53d6\n- \u4fee\u590d Cach\u00e9/IRIS \u8868\u6570\u636e\u5206\u9875 offset \u5931\u6548\u4e0e\u603b\u884c\u6570\u7edf\u8ba1 SQL \u5f15\u7528\u9519\u8bef (contributed by @zipg) (PR [#10311](https://github.com/t8y2/dbx/pull/10311))\n- IRIS %Boolean \u5217\u6309\u5b