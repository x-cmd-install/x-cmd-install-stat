tate":"uploaded","size":34082816,"digest":"sha256:5c9ca62d60840e490845cb10ed11fdacb825465e9ffe8aa983f6fba3fcb551a5","download_count":44,"created_at":"2026-09-23T18:59:10Z","updated_at":"2026-09-23T18:59:11Z"},{"id":584423679,"node_id":"RA_kwDOSPdiBc4i1Zj_","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":38743319,"digest":"sha256:d7fe9068e41fe076ef36a402c96493e28e7957d9c09ae0b4cfadf8b2bb065a01","download_count":44,"created_at":"2026-09-23T19:10:19Z","updated_at":"2026-09-23T19:10:21Z"},{"id":584514996,"node_id":"RA_kwDOSPdiBc4i1v20","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":18904,"digest":"sha256:d246e527c4cf75c18b529b4e8a9e6ee002d0892afbf7a7844e1dc96c21aa8f54","download_count":7374,"created_at":"2026-09-23T20:15:29Z","updated_at":"2026-09-23T20:15:29Z"}],"body":"### \u5b89\u88c5\n\n> \ud83d\udd10 \u91cd\u8981\u5b89\u5168\u5347\u7ea7\uff1a\u672c\u7248\u672c\u4f1a\u5c06\u8fde\u63a5\u3001\u63d2\u4ef6\u3001AI\u3001Tunnel \u548c\u540c\u6b65\u51ed\u636e\u8fc1\u79fb\u5230\u52a0\u5bc6 Secret Store\uff0c\u5df2\u6709\u914d\u7f6e\u7684\u7528\u6237\u5fc5\u987b\u6309\u542f\u52a8\u65f6\u51fa\u73b0\u7684\u300c\u6570\u636e\u5b89\u5168\u5347\u7ea7\u300d\u5411\u5bfc\u5b8c\u6210\u8fc1\u79fb\u3002\n\n- \u5347\u7ea7\u524d\u8bf7\u5907\u4efd\u5b8c\u6574\u6570\u636e\u76ee\u5f55\uff0c\u4fdd\u7559\u539f\u6709\u6570\u636e\u5e93\u548c\u52a0\u5bc6\u5bc6\u94a5\uff0c\u4e0d\u8981\u5220\u9664\u6216\u66ff\u6362\u3002\n- Docker/Web \u90e8\u7f72\u5fc5\u987b\u6301\u4e45\u5316 DBX_DATA_DIR\uff0c\u5e76\u4fdd\u7559 .dbx/secret.key\uff1b\u4e0d\u8981\u76f4\u63a5\u590d\u5236 dbx.db \u8de8\u8bbe\u5907\u8fc1\u79fb\u914d\u7f6e\u3002\n- \u8fc1\u79fb\u5931\u8d25\u65f6\u6309\u5411\u5bfc\u63d0\u793a\u4fee\u590d\u5e76\u91cd\u8bd5\uff0c\u4e0d\u8981\u5220\u9664\u539f\u59cb\u6570\u636e\u3001\u5bc6\u94a5\u6216\u8fc1\u79fb\u5907\u4efd\uff1b\u786e\u8ba4\u529f\u80fd\u6b63\u5e38\u540e\u518d\u6e05\u7406\u5907\u4efd\u3002\n- CLI \u548c MCP \u4e0d\u4f1a\u81ea\u52a8\u6267\u884c\u5386\u53f2\u6570\u636e\u8fc1\u79fb\uff0c\u9047\u5230 DATA_MIGRATION_REQUIRED \u65f6\u8bf7\u5148\u901a\u8fc7\u684c\u9762\u7aef\u6216 dbx-web \u5b8c\u6210\u5347\u7ea7\u3002\n- \u5b8c\u6574\u8bf4\u660e\u89c1[\u4e2d\u6587\u6587\u6863](https://github.com/t8y2/dbx/blob/main/docs/data-security-migration.zh-CN.md)\u4e0e[\u82f1\u6587\u6587\u6863](https://github.com/t8y2/dbx/blob/main/docs/data-security-migration.md) (PR [#9803](https://github.com/t8y2/dbx/pull/9803))\n\n### \u65b0\u529f\u80fd\n\n- \u8fde\u63a5\u5bc6\u7801\u3001\u63d2\u4ef6\u5bc6\u94a5\u3001AI API Key \u7b49\u672c\u5730\u654f\u611f\u4fe1\u606f\u6539\u4e3a AES-256-GCM \u52a0\u5bc6\u5b58\u50a8\uff0c\u5df2\u6709\u914d\u7f6e\u5347\u7ea7\u540e\u7531\u6570\u636e\u5b89\u5168\u8fc1\u79fb\u5411\u5bfc\u5f15\u5bfc\u5b8c\u6210\u5e76\u81ea\u52a8\u5907\u4efd (contributed by @eryajf) (PR [#9803](https://github.com/t8y2/dbx/pull/9803))\n- \u5b9a\u65f6\u6570\u636e\u5e93\u5907\u4efd\u6539\u4e3a\u8de8\u5e73\u53f0\u540e\u53f0\u6267\u884c\uff0c\u684c\u9762\u7aef\u5173\u95ed\u7a97\u53e3\u540e\u4ecd\u6309\u8ba1\u5212\u7ee7\u7eed\uff0cWeb/\u5bb9\u5668\u7aef\u7531\u670d\u52a1\u8fdb\u7a0b\u6301\u7eed\u6267\u884c (contributed by @CSXFanMeng) (PR [#9086](https://github.com/t8y2/dbx/pull/9086))\n- \u65b0\u589e DBX_DEMO_MODE \u6f14\u793a\u6a21\u5f0f\uff0c\u516c\u7f51\u90e8\u7f72\u53ef\u5c01\u9501\u63d2\u4ef6\u4e0e\u9a71\u52a8\u5b89\u88c5\u3001\u8fde\u63a5\u7f16\u8f91\u3001AI \u914d\u7f6e\u4e0e\u4e91\u540c\u6b65\u7b49\u5165\u53e3\uff0c\u4ec5\u5141\u8bb8\u4f7f\u7528\u9884\u7f6e\u8fde\u63a5\n- \u63d2\u4ef6\u652f\u6301\u901a\u8fc7\u6e05\u5355\u58f0\u660e\u547d\u4ee4\u4e0e\u83dc\u5355\u8d21\u732e\u70b9\uff08\u547d\u4ee4\u9762\u677f\u3001\u5de5\u5177\u680f\u3001\u4fa7\u8fb9\u680f\uff09\uff0c\u5e76\u65b0\u589e\u5168\u5c40\u5e95\u90e8 Dock \u505c\u9760\u533a\u627f\u8f7d\u63d2\u4ef6\u9762\u677f (contributed by @jinpy666) (PR [#10097](https://github.com/t8y2/dbx/pull/10097))\n- \u63d2\u4ef6 Host API \u65b0\u589e\u53ea\u8bfb\u8868\u7ed3\u6784\u5143\u6570\u636e\u63a5\u53e3\uff0c\u6309 schema:read \u6743\u9650\u95e8\u63a7\u5e76\u590d\u7528\u5df2\u6253\u5f00\u7684\u8fde\u63a5 (contributed by @0verme) (PR [#10043](https://github.com/t8y2/dbx/pull/10043))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u8868\u7ed3\u6784 Peek \u6d6e\u52a8\u9762\u677f\uff0c\u53ef\u5feb\u901f\u67e5\u770b\u5217\u3001\u7c7b\u578b\u3001\u53ef\u7a7a\u3001\u9ed8\u8ba4\u503c\u4e0e\u6ce8\u91ca\uff0c\u53cc\u51fb\u5355\u5143\u683c\u5373\u53ef\u5199\u5165\u7f16\u8f91\u5668 (contributed by @Mo-Moore) (PR [#10071](https://github.com/t8y2/dbx/pull/10071))\n- \u540c\u4e00\u6761 SQL \u53d1\u5f80\u591a\u4e2a\u6570\u636e\u6e90\u65f6\uff0c\u67e5\u8be2\u7ed3\u679c\u5408\u5e76\u4e3a\u5355\u4e2a\u89c6\u56fe\u5c55\u793a\u5e76\u5bf9\u5168\u6570\u5b57\u5217\u7ed9\u51fa SUM \u6c47\u603b\uff0cUPDATE/DELETE \u7b49\u5199\u8bed\u53e5\u6309\u76ee\u6807\u5c55\u793a\u72b6\u6001\u4e0e\u5f71\u54cd\u884c\u6570 (contributed by @goodvecn-dev) (PR [#10048](https://github.com/t8y2/dbx/pull/10048))\n- \u5bf9\u8c61\u6d4f\u89c8\u5668\u9009\u4e2d\u8868\u540e\uff0c\u4fe1\u606f\u9762\u677f\u9ed8\u8ba4\u5c55\u793a\u8868\u540d\u3001\u6ce8\u91ca\u3001\u884c\u6570\u4e0e\u5927\u5c0f\u7b49\u5c5e\u6027\uff0cMySQL \u8fde\u63a5\u8fd8\u5305\u542b\u5f15\u64ce\u3001\u521b\u5efa\u65f6\u95f4\u4e0e\u6392\u5e8f\u89c4\u5219\u7b49 (contributed by @eryajf) (PR [#10059](https://github.com/t8y2/dbx/pull/10059))\n- \u4fa7\u8fb9\u680f\u5b57\u6bb5\u5217\u8868\u663e\u793a\u5217\u7684\u53ef\u7a7a\u6027\uff0c\u60ac\u6d6e\u8be6\u60c5\u540c\u6b65\u5c55\u793a (contributed by @eryajf) (PR [#10046](https://github.com/t8y2/dbx/pull/10046))\n- \u65