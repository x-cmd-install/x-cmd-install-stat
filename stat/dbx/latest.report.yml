669bbd5","download_count":13,"created_at":"2026-11-08T03:44:07Z","updated_at":"2026-11-08T03:44:08Z"},{"id":722788975,"node_id":"RA_kwDOSPdiBc4rFOJv","name":"DBX_0.6.68_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":44904448,"digest":"sha256:3f60d08f261ea113b81644725e20e8956bee61870be08f7a63f766a3bb511a56","download_count":5,"created_at":"2026-11-08T03:44:15Z","updated_at":"2026-11-08T03:44:17Z"},{"id":721717288,"node_id":"RA_kwDOSPdiBc4rBIgo","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":50070148,"digest":"sha256:c1c6b68a6ea4509484995421a203dd1846d0f2c9ecbb4d568baada2f13e5d683","download_count":28,"created_at":"2026-11-07T19:32:54Z","updated_at":"2026-11-07T19:32:57Z"},{"id":722844789,"node_id":"RA_kwDOSPdiBc4rFbx1","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":18463,"digest":"sha256:b3a3feaa4fa661b44ce105279548f6f00b850d8223f4851e0e1441a02c713ff4","download_count":2448,"created_at":"2026-11-08T04:11:41Z","updated_at":"2026-11-08T04:11:42Z"}],"body":"### 新功能\n\n- 导入表数据支持为生成列手填固定值，不再只能用数据库表达式 (contributed by @javalover123) (PR [#14537](https://github.com/t8y2/dbx/pull/14537))\n- 对象列表与数据库列表新增表格复制选项，可复制名称、选中对象、当前列表或全部筛选结果为可直接粘贴到电子表格的 TSV (contributed by @eryajf) (PR [#14514](https://github.com/t8y2/dbx/pull/14514))\n- MySQL 对象浏览器的表列表新增「字符集」「排序规则」两列，并支持排序、调整列宽与显示隐藏 (contributed by @Acd-kk) (PR [#14513](https://github.com/t8y2/dbx/pull/14513))\n- Kafka 消息浏览器支持按结束时间戳读取消息 (contributed by @pengwow) (PR [#14297](https://github.com/t8y2/dbx/pull/14297))\n\n### 改进\n\n- 双击只读对象（如触发器）改为复用现有标签页，不再每次新建标签页 (contributed by @javalover123) (PR [#14526](https://github.com/t8y2/dbx/pull/14526))\n- 查询结果转置视图把记录表头固定在纵向滚动区外并随数据区横向滚动，列宽调整统一放到表头 (contributed by @hanxuanyu) (PR [#14506](https://github.com/t8y2/dbx/pull/14506))\n- 侧边栏用青色链接图标区分外部表，并在悬浮详情中显示数据库上报的类型 (contributed by @ThugKd) (PR [#14486](https://github.com/t8y2/dbx/pull/14486))\n- 查询结果工具栏的「保存结果」改用独立归档图标，仅显示图标时也能与数据导出区分 (contributed by @ThugKd) (PR [#14484](https://github.com/t8y2/dbx/pull/14484))\n- 表结构编辑器的类型与长度控件改用界面字体，Oracle 长度单位一并调整 (contributed by @ThugKd) (PR [#14481](https://github.com/t8y2/dbx/pull/14481))\n- Redis JSON 视图对单引号、无引号键等非标准 JSON 按层级缩进展示 (contributed by @seaways1015-afk) (PR [#14447](https://github.com/t8y2/dbx/pull/14447))\n- MCP 的 dbx_add_connection 新增 external_config 参数，可传入 Nacos 等连接的额外配置 (contributed by @dienaso) (PR [#14539](https://github.com/t8y2/dbx/pull/14539))\n\n### 修复\n\n- 修复 Doris 导出数据库、导出表（含数据）报 START TRANSACTION failed、始终导出 0 行的问题 (contributed by @zipg) (PR [#14510](https://github.com/t8y2/dbx/pull/14510))\n- 修复 TDengine 导出与传输 SQL 使用双引号标识符导致语法错误、导出 0 行的问题，改用反引号 (contributed by @dienaso) (PR [#14541](https://github.com/t8y2/dbx/pull/14541))\n- 修复 Oracle 无主键基表在 SQL 查询结果中只读、而「表数据」页签可编辑的不一致 (contributed by @dienaso) (PR [#14542](https://github.com/t8y2/dbx/pull/14542))\n- 修复 Oracle 对象浏览器的精确列表不显示表注释的问题 (contributed by @lxk955) (PR [#13702](https://github.com/t8y2/dbx/pull/13702))\n- 修复 MySQL、Oracle 触发器源码无法写回数据库（MySQL 1359、Oracle ORA-00900）的问题 (contributed by @dienaso) (PR [#14529](https://github.com/t8y2/dbx/pull/14529))\n- 修复 PostgreSQL 建表、改表时类型下拉缺少扩展与用户自定义类型（如 pgvector 的 vector）的问题 (contributed by @dienaso) (PR [#14536](https://github.com/t8y2/dbx/pull/14536))\n- 修复 SQL Server 连接忽略 URL 参数 instanceName、连到默认实例的问题 (contributed by @ThugKd) (PR [#14381](https://github.com/t8y2/dbx/pull/14381))\n- 修复 SQL Server 查询包含未命名子查询列时无法统计总数、只显示首批数据的问题 (contributed by @Acd-kk) (PR [#14511](https://github.com/t8y2/dbx/pull/14511))\n- 修复 T-SQL 存储过程、函数、触发器中的原生 @变量被当作模板参数替换、掩盖未声明变量错误的问题 (contributed by @Acd-kk) (PR [#14524](https://github.com/t8y2/dbx/pull/14524))\n- 修复通过 MCP 添加的 Nacos 连接缺少默认 /nacos 上下文、打开报 apiVersionMismatch 404 的问题 (contributed by @thailoc-dev) (PR [#14533](https://github.com/t8y2/dbx/pull/14533))\n- 修复 Windows 下 PATH 中 GNU tar 优先时安装 MCP Server 失败的问题 (contributed by @javalover123) (PR [#14520](https://github.com/t8y2/dbx/pull/14520))\n- 修复 Windows 7 下连接 Neo4j 时 Agent 报「不是有效的 Win32 应用程序」的问题，x64 产物改用兼容工具链构建 (contributed by @Acd-kk) (PR [#14512](https://github.com/t8y2/dbx/pull/14512))\n- 修复插件连接点击原生「新建查询」无反应的问题，改为打开新的工作台窗口 (contributed by @fwrq41251) (PR [#13866](https://github.com/t8y2/dbx/pull/13866))\n- 修复 SSH 及插件连接的备注无法新增、修改和清空的问题 (contributed by @Acd-kk) (PR [#14476](https://github.com/t8y2/dbx/pull/14476))\n- 修复 macOS 从更新重启后主窗口位置与大小丢失的问题，重启前会保存当前窗口几何 (contributed by @ThugKd) (PR [#14494](https://github.com/t8y2/dbx/pull/14494))\n- 修复停用的缓存标签页仍保留整张 Canvas 位图、持续占用内存的问题 (contributed by @lcq928) (PR [#14538](https://github.com/t8y2/dbx/pull/14538))\n- 修复数据网格可误删列的问题，列删除入口已移除 (contributed by @Evvvvvvvan) (PR [#14505](https://github.com/t8y2/dbx/pull/14505))\n- 修复 MySQL 结构对比忽略「忽略字符集/排序规则」设置、生成多余 CHARSET 与 COLLATE 变更的问题 (contributed by @adminkk) (PR [#14448](https://github.com/t8y2/dbx/pull/14448))\n- 修复 MySQL 结构对比把表达式默认值渲染成无法回放 SQL 的问题，现补全外层括号 (contributed by @adminkk) (PR [#14498](https://github.com/t8y2/dbx/pull/14498))\n- 修复 MySQL 8+ 对象浏览器轻量加载不返回表注释、列表注释列为空的问题 (contributed by @dienaso) (PR [#14440](https://github.com/t8y2/dbx/pull/14440))\n- 修复隐式连接（逗号 join）在 WHERE、ORDER BY、GROUP BY 之后列补全失效的问题 (contributed by @dienaso) (PR [#14450](https://github.com/t8y2/dbx/pull/14450))\n- 修复 SQL 语义分析把 CTE 与派生表别名当作未知表、导致误报与补全缺失的问题 (contributed by @Gaiokane) (PR [#14441](https://github.com/t8y2/dbx/pull/14441))\n- 修复 MCP 只读安全检查越过 CTE 边界、误判 CTE 内数据表越权的问题 (contributed by @jiejie1133) (PR [#14393](https://github.com/t8y2/dbx/pull/14393))\n- 修复超长 INSERT 语句被截断后仍会发送的问题，改为自动拆分并拦截被截断的语句 (contributed by @Evvvvvvvan) (PR [#14483](https://github.com/t8y2/dbx/pull/14483))\n- 修复 Doris 连接在认证 OK 包尾部带零字节 padding 时握手失败的问题 (contributed by @zipg) (PR [#14425](https://github.com/t8y2/dbx/pull/14425))\n- 修复火山引擎 MySQL 连接因认证 OK 包尾部信息字节解析失败而报错的问题 (#14451)\n- 修复 Linux 下窗口关闭请求未遵循托盘设置的问题 (contributed by @ThugKd) (PR [#14491](https://github.com/t8y2/dbx/pull/14491))\n- 修复 macOS「关于」面板在 beta 晋升为正式版后仍显示 beta 版本号的问题 (contributed by @Abeautifulsnow) (PR [#14515](https://github.com/t8y2/dbx/pull/14515))\n- 修复设置中「表分页大小」应用后仍残留未保存改动、按钮保持可点的问题 (contributed by @luckdewei) (PR [#13942](https://github.com/t8y2/dbx/pull/13942))\n","mentions_count":19}
