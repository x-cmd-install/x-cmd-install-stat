"content_type":"application/json","state":"uploaded","size":14466,"digest":"sha256:f6bd3227adbc49a1eb88d9c1cdaaa10896f7158ecff9d2c00c0c4daa7c71017d","download_count":6904,"created_at":"2026-09-27T20:58:50Z","updated_at":"2026-09-27T20:58:50Z"}],"body":"### \u65b0\u529f\u80fd\n- \u6570\u636e\u5bfc\u5165\u65b0\u589e\u4e3b\u952e\u51b2\u7a81\u65f6\u66f4\u65b0\u5df2\u6709\u884c\u7684\u9009\u9879\uff0c\u51b2\u7a81\u884c\u53ef\u76f4\u63a5\u66f4\u65b0\u800c\u4e0d\u518d\u53ea\u80fd\u62a5\u9519\u6216\u8df3\u8fc7\n- \u6570\u636e\u751f\u6210\u4e0e\u6570\u636e\u4f20\u8f93\u4efb\u52a1\u8f6c\u5165\u540e\u53f0\u8fd0\u884c\uff0c\u6700\u5c0f\u5316\u7a97\u53e3\u540e\u4ecd\u7ee7\u7eed\u6267\u884c\n- \u5bfc\u51fa\u65b0\u589e\u300c\u6807\u51c6 SQL INSERT\u300d\u683c\u5f0f\uff0c\u8868\u6570\u636e\u4f7f\u7528\u53ef\u8de8\u5e93\u8fc1\u79fb\u7684\u901a\u7528 SQL \u8bed\u53e5\n- \u7ed3\u6784\u6bd4\u8f83\u65b0\u589e\u5b57\u7b26\u96c6\u6bd4\u8f83\u5f00\u5173\uff0c\u53ef\u6309\u9700\u5f00\u542f\u5b57\u7b26\u96c6\u5dee\u5f02\u6bd4\u5bf9\n- \u6253\u5f00 SQL \u6587\u4ef6\u65f6\u590d\u7528\u5f53\u524d\u6807\u7b7e\u9875\u7684\u6d3b\u52a8\u8fde\u63a5\uff0c\u4e0d\u518d\u91cd\u65b0\u9009\u62e9\u8fde\u63a5\n- InfluxDB 1.x \u6570\u636e\u8868\u683c\u652f\u6301\u5220\u9664\u6570\u636e\u70b9\uff0c\u5220\u9664\u524d\u9700\u786e\u8ba4\n- Redis \u547d\u4ee4\u884c\u67e5\u8be2\u7ed3\u679c\u65b0\u589e\u4eff\u7ec8\u7aef\u8f93\u51fa\u6a21\u5f0f\uff0c\u53ef\u6309\u547d\u4ee4\u884c\u98ce\u683c\u67e5\u770b\u547d\u4ee4\u8fd4\u56de\n- DBX CLI \u5185\u7f6e\u5b98\u65b9 Agent Skill\uff0cAI \u7f16\u7801\u5de5\u5177\u65e0\u9700\u8054\u7f51\u68c0\u7d22\u5373\u53ef\u83b7\u5f97 DBX \u7528\u6cd5\u6307\u5f15\n- \u8fde\u63a5\u9ad8\u7ea7\u8bbe\u7f6e\u65b0\u589e\u300c\u81ea\u52a8\u52a0\u8f7d\u5168\u90e8\u8868\u300d\u5f00\u5173\uff0c\u5c55\u5f00\u8868\u5206\u7ec4\u65f6\u52a0\u8f7d\u5168\u90e8\u5206\u9875\uff0c\u8868\u540d\u7b5b\u9009\u53ef\u8986\u76d6\u6240\u6709\u8868\n- \u8fdc\u7a0b SQLite \u7684 SSH \u8fde\u63a5\u652f\u6301\u524d\u7f6e HTTP CONNECT \u6216 SOCKS5 \u4ee3\u7406\u5c42\n- \u6570\u636e\u4f20\u8f93\u652f\u6301\u5d16\u5c71\u6570\u636e\u5e93\uff08YashanDB\uff09\n- Nacos \u670d\u52a1\u5217\u8868\u53ef\u76f4\u63a5\u67e5\u770b\u5404\u670d\u52a1\u5b9e\u4f8b\u7684\u5065\u5eb7\u72b6\u6001\n- MongoDB \u6587\u6863\u4e2d\u7684\u65e5\u671f\u5b57\u6bb5\u6309\u7ed3\u679c\u7f51\u683c\u7684\u65e5\u671f\u65f6\u95f4\u683c\u5f0f\u4e0e\u65f6\u533a\u8bbe\u7f6e\u663e\u793a\n- \u5de5\u5177\u680f\u65b0\u589e\u6570\u636e\u5e93\u5907\u4efd\u4e0e MCP \u5feb\u6377\u5165\u53e3\u6309\u94ae\n### \u6539\u8fdb\n- \u63d2\u4ef6 dock\u300c+\u300d\u542f\u52a8\u9879\u6807\u7b7e\u8ddf\u968f\u754c\u9762\u8bed\u8a00\u672c\u5730\u5316\uff0c\u8fde\u63a5\u76ee\u6807\u6539\u4e3a\u5206\u7ec4\u6811\u9009\u62e9\u5e76\u652f\u6301\u641c\u7d22\uff0c\u5f39\u7a97\u56fa\u5b9a\u5411\u4e0b\u5f39\u51fa\u4e0d\u518d\u906e\u6321 (contributed by @jinpy666) (PR [#10393](https://github.com/t8y2/dbx/pull/10393))\n- \u6570\u636e\u7f51\u683c\u5217\u5bbd\u6a21\u5f0f\u9ed8\u8ba4\u6539\u4e3a\u6309\u5185\u5bb9\u81ea\u9002\u5e94\n### \u4fee\u590d\n- macOS 26/27 \u4e0b SQL \u7f16\u8f91\u5668\u5168\u9009\u540e\u53f3\u952e\u83dc\u5355\u4e0d\u518d\u5361\u987f (contributed by @zipg) (PR [#10404](https://github.com/t8y2/dbx/pull/10404))\n- MongoDB \u901a\u8fc7 getSiblingDB \u5207\u6362\u76ee\u6807\u5e93\u540e\uff0c\u547d\u4ee4\u8865\u5168\u9488\u5bf9\u8be5\u5e93\u5b8c\u6210 (contributed by @thailoc-dev) (PR [#10401](https://github.com/t8y2/dbx/pull/10401))\n- Doris \u805a\u5408\u72b6\u6001\u5217\u7684\u67e5\u8be2\u7ed3\u679c\u6309\u539f\u59cb\u5b57\u8282\u4fdd\u7559\u5c55\u793a\uff0c\u4e0d\u518d\u4e22\u5931\u5185\u5bb9 (contributed by @CN-Scars) (PR [#10387](https://github.com/t8y2/dbx/pull/10387))\n- IoTDB LIST \u67e5\u8be2\u7684\u7ed3\u679c\u96c6\u6b63\u5e38\u5c55\u793a\uff0c\u4e0d\u518d\u88ab\u4e22\u5f03 (contributed by @CN-Scars) (PR [#10391](https://github.com/t8y2/dbx/pull/10391))\n- ZooKeeper \u8282\u70b9\u53f3\u952e\u83dc\u5355\u5b8c\u6210\u56fd\u9645\u5316\uff0c\u5bfc\u51fa\u529f\u80fd\u6062\u590d\u54cd\u5e94\u5e76\u652f\u6301\u539f\u751f\u4fdd\u5b58\u5bf9\u8bdd\u6846 (contributed by @eryajf) (PR [#10402](https://github.com/t8y2/dbx/pull/10402))\n- \u6570\u636e\u8fc1\u79fb\u9047\u5230\u65e0\u6cd5\u89e3\u6790\u7684\u9057\u7559\u8fde\u63a5\u884c\u65f6\u8df3\u8fc7\u8be5\u884c\u800c\u4e0d\u662f\u6574\u4f53\u5931\u8d25\uff0c\u643a\u5e26\u65e7\u683c\u5f0f\u8fde\u63a5\u7684\u5347\u7ea7\u4e0d\u518d\u88ab\u5361\u6b7b (contributed by @dienaso) (PR [#10397](https://github.com/t8y2/dbx/pull/10397))\n- \u8f6c\u7f6e\u89c6\u56fe\u652f\u6301\u6309\u8868\u5934\u6392\u5e8f\n- \u8fbe\u68a6\u8868\u7edf\u8ba1\u3001\u7d22\u5f15\u4e0e\u5916\u952e\u5143\u6570\u636e\u67e5\u8be2\u9650\u5b9a\u5230\u5355\u8868\u8303\u56f4\uff0c\u9996\u6b21\u52a0\u8f7d\u8868 DDL \u4e0d\u518d\u7f13\u6162\n- Databricks Unity Catalog \u8868\u9884\u89c8\u4f7f\u7528\u9650\u5b9a\u8868\u540d\uff0c\u8de8 schema/catalog \u67e5\u770b\u4e0d\u518d\u62a5 TABLE_OR_VIEW_NOT_FOUND\n- \u591a\u8868\u4f20\u8f93\u7684\u786e\u8ba4\u5bf9\u8bdd\u6846\u6b63\u786e\u663e\u793a\u8868\u6570\u91cf\uff0c\u5e76\u63d0\u793a\u4efb\u52a1\u5df2\u8f6c\u5165\u540e\u53f0\n- \u7f16\u8f91\u8868\u7ed3\u6784\u65f6\u9009\u4e2d\u884c\u7684\u8868\u5355\u63a7\u4ef6\u6837\u5f0f\u4fdd\u6301\u6b63\u786e\n- RabbitMQ \u961f\u5217\u4e0e\u4ea4\u6362\u673a\u7ba1\u7406\u5217\u8868\u6539\u4e3a\u5206\u9875\u52a0\u8f7d\uff0c\u5bf9\u8c61\u8fc7\u591a\u65f6\u4e0d\u518d\u5c55\u793a\u5f02\u5e38\n- Kafka \u5ba2\u6237\u7aef\u5347\u7ea7\u81f3 3.9.1\uff0c\u65b0\u7248 JDK \u4e0a\u4f7f\u7528 SASL \u8ba4\u8bc1\u4e0d\u518d\u5931\u8d25\n- \u4fbf\u643a\u7248\u91cd\u542f\u66f4\u65b0\u5c06\u66ff\u6362\u6587\u4ef6\u4fdd\u7559\u5728\u76ee\u6807\u5377\uff0c\u66f4\u65b0\u6062\u590d\u751f\u6548\n- Kyuubi \u4ee3\u7406 Trino \u65f6\u6309 Trino \u89c4\u5219\u5904\u7406\u6807\u8bc6\u7b26\u5f15\u53f7\uff0c\u8fde\u63a5\u67e5\u8be2\u4e0d\u518d\u62a5\u9519\n- SQL Server 2000 \u7e41\u4f53\u4e2d\u6587\u73af\u5883\u4e0b\u7684\u8fde\u63a5\u9519\u8bef\u4e5f\u80fd\u89e6\u53d1\u65e7\u9a71\u52a8\u56de\u9000\uff0c\u8fde\u63a5\u6062\u590d\u6b63\u5e38\n- \u63d2\u4ef6\u6587\u4ef6\u9884\u89c8\u7a97\u683c\u652f\u6301\u62d6\u52a8\u8c03\u6574\u5927\u5c0f\uff0cWindows 11 \u4e0b\u4e0d\u518d\u663e\u793a\u6df7\u4e71\n- Spanner \u9ed8\u8ba4 schema \u4e0b\u7684\u67e5\u8be2\u5b57\u6bb5\u8865\u5168\u6062\u590d\n- \u542f\u52a8\u65f6\u6062\u590d\u7684 SQL \u5e93\u9875\u7b7e\u6b63\u786e\u52a0\u8f7d\u5185\u5bb9\uff0c\u4e0d\u518d\u663e\u793a\u4e3a\u7a7a\n- OceanBase Oracle \u6a21\u5f0f\u7684 JDBC \u8fde\u63a5\u88ab\u6b63\u786e\u8bc6\u522b\uff0c\u7ed3\u6784\u540c\u6b65\u4e0d\u518d\u62a5\u9519\n- \u4fa7\u8fb9\u680f\u6839\u8282\u70b9\u5237\u65b0\u540e\u4ecd\u80fd\u6b63\u786e\u5b8c\u6210\u6570\u636e\u5e93\u52a0\u8f7d\uff0c\u4e0d\u518d\u51fa\u73b0\u52a0\u8f7d\u672a\u7ed3\u675f\u7684\u72b6\u6001\n\n---\n<!-- dbx-cnb-mirror -->\n> \u56fd\u5185\u4e0b\u8f7d\uff1a\u5982\u679c GitHub \u4e0b\u8f7d\u8f83\u6162\uff0c\u53ef\u4ece [CNB \u955c\u50cf](https://cnb.cool/dbxio.com/dbx/-/releases/tag/v0.6.26) \u4e0b\u8f7d\u684c\u9762\u7aef\u5b89\u88c5\u5305\uff0cDocker \u955c\u50cf\u4ece `docker.cnb.cool/dbxio.com/dbx:v0.6.26` \u62c9\u53d6\u3002\n","mentions_count":6}
