8865\u5168\u73b0\u5728\u80fd\u89e3\u6790\u5f15\u7528\u5148\u524d CTE \u7684\u5d4c\u5957 CTE \u5217 (contributed by @lxk955) (PR [#11738](https://github.com/t8y2/dbx/pull/11738))\n- \u53f3\u952e\u8868\u53ef\u6309\u5f39\u7a97\u6307\u5b9a\u7684\u884c\u6570\u751f\u6210\u591a\u884c INSERT \u6a21\u677f\uff0c\u591a\u884c\u5360\u4f4d\u503c\u6309\u884c\u53f7\u533a\u5206 (contributed by @xiaohuowa) (PR [#11695](https://github.com/t8y2/dbx/pull/11695))\n- \u7ed3\u679c\u7f51\u683c\u65b0\u589e\"\u4ec5\u4fdd\u7559\u503c\uff08\u5355\u5217\uff09\"\u590d\u5236\u683c\u5f0f\uff0c\u5355\u5217\u9009\u62e9\u65f6\u590d\u5236\u4e3a\u7eaf\u503c JSON \u6570\u7ec4\uff0c\u591a\u5217\u9009\u62e9\u4ecd\u8f93\u51fa\u5bf9\u8c61 (contributed by @yiqiui) (PR [#11731](https://github.com/t8y2/dbx/pull/11731))\n- XLSX \u5bfc\u51fa\u65b0\u589e\"\u5b57\u6bb5\u540d\u79f0\u4e0e\u6ce8\u91ca\u5206\u4e24\u884c\u8868\u5934\"\u6a21\u5f0f\uff0c\u7b2c 1 \u884c\u4e3a\u5b57\u6bb5\u540d\u3001\u7b2c 2 \u884c\u4e3a\u6ce8\u91ca\u3001\u6570\u636e\u4ece\u7b2c 3 \u884c\u5f00\u59cb (contributed by @yiqiui) (PR [#11732](https://github.com/t8y2/dbx/pull/11732))\n- Excel \u5bfc\u5165\u65b0\u589e\"\u7a7a\u5b57\u7b26\u4e32\u8bc6\u522b\u4e3a NULL\"\u9009\u9879\uff0c\u672a\u52fe\u9009\u65f6\u4fdd\u7559\u4e3a\u7a7a\u5b57\u7b26\u4e32 (contributed by @lxk955) (PR [#11734](https://github.com/t8y2/dbx/pull/11734))\n- Redis \u5b57\u7b26\u4e32\u503c\u4e3a\u5e8f\u5217\u5316 JSON \u65f6\u4ee5\u683c\u5f0f\u5316 JSON \u5448\u73b0\u5e76\u53ef\u56de\u5199 (contributed by @lxk955) (PR [#11737](https://github.com/t8y2/dbx/pull/11737))\n- MySQL \u7ed3\u6784\u6bd4\u8f83\u90e8\u7f72\u65b0\u589e\"\u5ffd\u7565\u5916\u952e\u68c0\u67e5\"\u9009\u9879\uff0c\u5141\u8bb8\u4ee5\u4efb\u610f\u987a\u5e8f\u5220\u9664\u548c\u91cd\u5efa\u8868 (contributed by @DengQingNian) (PR [#11701](https://github.com/t8y2/dbx/pull/11701))\n- \u641c\u7d22\u5feb\u6377\u952e\u652f\u6301\u5feb\u901f\u8fde\u6309\u4e24\u6b21\u540c\u4e00\u4fee\u9970\u952e\uff08Shift/Cmd/Ctrl/Alt\uf