","site_admin":false},"content_type":"application/zip","state":"uploaded","size":36667392,"digest":"sha256:975cb050041524b02f60740ac34e9c34d72c762ff7d745b831814f65e179cf4e","download_count":77,"created_at":"2026-09-29T16:01:17Z","updated_at":"2026-09-29T16:01:18Z"},{"id":598657098,"node_id":"RA_kwDOSPdiBc4jrshK","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41386737,"digest":"sha256:11de2c0ec8adbf113b5de3d25e7abfe5c2ddfe1fc8b116fa122e3e1b8432e1dc","download_count":57,"created_at":"2026-09-29T16:20:52Z","updated_at":"2026-09-29T16:20:54Z"},{"id":598699169,"node_id":"RA_kwDOSPdiBc4jr2yh","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":18797,"digest":"sha256:1865d6536228dd58cf6c2ff76f0d25d954d3dd33a6816c2e2c0132d476dff5f5","download_count":10478,"created_at":"2026-09-29T16:41:00Z","updated_at":"2026-09-29T16:41:00Z"}],"body":"### \u65b0\u529f\u80fd\n- \u65b0\u589e\u672c\u5730\u5907\u4efd\u5bfc\u51fa\u4e0e\u6062\u590d\uff0c\u53ef\u81ea\u9009\u5907\u4efd\u5185\u5bb9\u4e0e\u5bfc\u51fa\u4f4d\u7f6e\uff0c\u654f\u611f\u4fe1\u606f\u7ecf\u6570\u636e\u540c\u6b65\u5bc6\u7801\u52a0\u5bc6\u540e\u5bfc\u51fa (contributed by @ma123456mai) (PR [#10578](https://github.com/t8y2/dbx/pull/10578))\n- \u7f16\u8f91\u5668 Vim \u6a21\u5f0f\u652f\u6301 ~/.dbx/vimrc \u914d\u7f6e\u6587\u4ef6\uff0c\u53ef\u52a0\u8f7d\u5e38\u7528 Ex \u547d\u4ee4\u5e76\u652f\u6301 clipboard=unnamedplus \u7cfb\u7edf\u526a\u8d34\u677f (contributed by @TuZaaaaa) (PR [#10646](https://github.com/t8y2/dbx/pull/10646))\n- \u4ece Java\u3001Python\u3001JavaScript \u7b49\u6e90\u7801\u590d\u5236\u7684\u5b57\u7b26\u4e32\u62fc\u63a5 SQL\uff0c\u7c98\u8d34\u8fdb\u7f16\u8f91\u5668\u65f6\u81ea\u52a8\u8fd8\u539f\u4e3a\u53ef\u76f4\u63a5\u6267\u884c\u7684 SQL (contributed by @HighBigSky) (PR [#10656](https://github.com/t8y2/dbx/pull/10556))\n- CSV/TSV \u5bfc\u5165\u65b0\u589e\u5c0f\u6570\u5206\u9694\u7b26\u9009\u9879\uff0c\u652f\u6301 1,23 \u5f62\u5f0f\u7684\u9017\u53f7\u5c0f\u6570 (contributed by @caichangqing1120) (PR [#10649](https://github.com/t8y2/dbx/pull/10649))\n- \u63d2\u4ef6\u65b0\u589e AI \u80fd\u529b\u63a5\u53e3\uff0c\u53ef\u83b7\u53d6\u4f9b\u5e94\u5546\u4e0e\u6a21\u578b\u5217\u8868\u5e76\u8c03\u7528\u6587\u672c\u751f\u6210\uff0c\u51ed\u636e\u7531 DBX \u6258\u7ba1\u3001\u8c03\u7528\u524d\u7ecf\u7528\u6237\u786e\u8ba4 (contributed by @yuwenGueen) (PR [#10629](https://github.com/t8y2/dbx/pull/10629))\n- \u65b0\u589e NebulaGraph 3.x \u652f\u6301\uff0c\u53ef\u6d4f\u89c8 space\u3001tag\u3001edge \u5143\u6570\u636e\u5e76\u6267\u884c\u67e5\u8be2 (contributed by @HandSonic) (PR [#10662](https://github.com/t8y2/dbx/pull/10662))\n- \u865a\u8c37\u6570\u636e\u5e93\u65b0\u589e\u53ef\u89c6\u5316\u7528\u6237\u4e0e\u6743\u9650\u7ba1\u7406\uff0c\u5b9e\u4f8b\u3001\u5e93\u3001schema\u3001\u5bf9\u8c61\u4e0e\u89d2\u8272\u6743\u9650\u5747\u53ef\u754c\u9762\u914d\u7f6e (contributed by @mapan0424) (PR [#10610](https://github.com/t8y2/dbx/pull/10610))\n- StarRocks \u8868\u6570\u636e\u7f51\u683c\u652f\u6301 F2 \u91cd\u547d\u540d\u8868 (contributed by @AspBamboo) (PR [#10620](https://github.com/t8y2/dbx/pull/10620))\n- \u4fa7\u680f\u641c\u7d22\u65b0\u589e\u300c\u4ec5\u641c\u7d22\u5df2\u6253\u5f00\u7684\u6570\u636e\u5e93\u300d\u8bbe\u7f6e\uff08\u9ed8\u8ba4\u5f00\u542f\uff09\uff0c\u672a\u6253\u5f00\u7684\u5e93\u4e0d\u518d\u89e6\u53d1\u8fdc\u7a0b\u52a0\u8f7d (contributed by @jefferyjob) (PR [#10609](https://github.com/t8y2/dbx/pull/10609))\n- \u4fa7\u680f\u8fde\u63a5\u56fe\u6807\u4ee5\u5f69\u8272\u4e0e\u7070\u8272\u8868\u8fbe\u8fde\u63a5\u72b6\u6001\uff0c\u8fde\u63a5\u60c5\u51b5\u4e00\u76ee\u4e86\u