c","site_admin":false},"content_type":"application/zip","state":"uploaded","size":40284160,"digest":"sha256:1d89683ff014f623cd88a17757620158e736061b539ed535e2fb45bea01f8c86","download_count":68,"created_at":"2026-10-21T17:13:34Z","updated_at":"2026-10-21T17:13:36Z"},{"id":663337841,"node_id":"RA_kwDOSPdiBc4nibtx","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":45118567,"digest":"sha256:f9174bc17b2731cf6aa4e0913b0ee7b177a5be0be44538019d8fa342ac7f3676","download_count":82,"created_at":"2026-10-21T17:55:03Z","updated_at":"2026-10-21T17:55:06Z"},{"id":663384120,"node_id":"RA_kwDOSPdiBc4ninA4","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":24533,"digest":"sha256:532eee51a19303c49244ee079775ccafc994ee9db3d800a50902c742a0bd13e1","download_count":10364,"created_at":"2026-10-21T18:15:17Z","updated_at":"2026-10-21T18:15:17Z"}],"body":"### \u8d5e\u52a9\u4fe1\u606f\n\n- HuaLongAI\uff08\u534e\u9f99\u7b97\u529b\uff09\u56fd\u6a21\u767e\u4ebf\u8865\u8d34\uff1aDeepSeek\u7b49\u6a21\u578b\u4f4e\u81f3 0.8 \u6298\uff0c\u8c37\u4ef7 0.4 \u6298\uff0cGPT \u6a21\u578b\u4e0d\u964d\u667a 0.15 \u500d\u7387\uff0c[\u6ce8\u518c\u5165\u53e3](https://dbx.hualong.online/)\n\n### \u65b0\u529f\u80fd\n\n- SQL \u683c\u5f0f\u5316\u65b0\u589e\u53ef\u914d\u7f6e\u89c4\u5219\uff1a\u72ec\u7acb\u5217\u8868\u6362\u884c\u3001WHERE/JOIN ON \u903b\u8f91\u6362\u884c\u3001\u4ee3\u7801\u7a7a\u884c\u4e0e\u884c\u5bbd\u7b49\u5747\u53ef\u81ea\u5b9a\u4e49\uff0c\u8bbe\u7f6e\u9762\u677f\u652f\u6301\u5b9e\u65f6\u9884\u89c8\uff0c\u9ed8\u8ba4\u5173\u95ed (contributed by @efeire) (PR [#12772](https://github.com/t8y2/dbx/pull/12772))\n- \u7f16\u8f91\u5668\u65b0\u589e\u300c\u6267\u884c\u5168\u90e8 SQL\u300d\u5de5\u5177\u680f\u6309\u94ae\u548c Alt+X \u5feb\u6377\u952e (contributed by @lxk955) (PR [#12778](https://github.com/t8y2/dbx/pull/12778))\n- Vim \u6a21\u5f0f\u65b0\u589e :dbx \u7cfb\u5217\u547d\u4ee4\uff0c\u53ef\u5728\u547d\u4ee4\u884c\u76f4\u63a5\u6267\u884c DBX \u64cd\u4f5c\u5e76\u652f\u6301 vimrc \u6620\u5c04 (contributed by @youmin1017) (PR [#13044](https://github.com/t8y2/dbx/pull/13044))\n- \u6c34\u5e73\u6807\u7b7e\u680f\u65b0\u589e\u53ef\u9009\u7684\u300c\u4e24\u884c\u5206\u7ec4\u300d\u5e03\u5c40\uff0c\u7b2c\u4e00\u884c\u663e\u793a\u5206\u7ec4\u3001\u7b2c\u4e8c\u884c\u663e\u793a\u5f53\u524d\u5206\u7ec4\u6807\u7b7e (contributed by @yaoxinghuo) (PR [#12905](https://github.com/t8y2/dbx/pull/12905))\n- Redis \u652f\u6301\u5728\u952e\u524d\u7f00\u76ee\u5f55\u8282\u70b9\u4e0a\u5355\u72ec\u5237\u65b0\uff0c\u65e0\u9700\u91cd\u8f7d\u6574\u68f5\u6570\u636e\u5e93\u6811 (contributed by @caichangqing1120) (PR [#13050](https://github.com/t8y2/dbx/pull/13050))\n- AI \u52a9\u624b\u751f\u6210\u7ed3\u6784\u4e0a\u4e0b\u6587\u65f6\u4f1a\u8bfb\u53d6\u8fde\u63a5\u7684 Database Docs \u5907\u6ce8\uff0c\u8868\u548c\u5217\u7684\u4e1a\u52a1\u542b\u4e49\u65e0\u9700\u5199\u5165\u6570\u636e\u5e93\u6ce8\u91ca\u5373\u53ef\u63d0\u4f9b\u7ed9\u6a21\u578b (contributed by @Abeautifulsnow) (PR [#12705](https://github.com/t8y2/dbx/pull/12705))\n- \u63d2\u4ef6\u5546\u5e97\u663e\u793a\u6bcf\u4e2a\u63d2\u4ef6\u7684\u5b89\u88c5\u91cf\uff0c\u5e76\u652f\u6301\u6309\u5b89\u88c5\u91cf\u6392\u5e8f (contributed by @peakxy) (PR [#13083](https://github.com/t8y2/dbx/pull/13083))\n- SQL \u6587\u4ef6\u9762\u677f\u652f\u6301\u952e\u76d8\u5bfc\u822a\uff08\u65b9\u5411\u952e\u9009\u62e9\u3001Enter \u6253\u5f00\u3001F2 \u91cd\u547d\u540d\uff09\uff0c\u5e76\u53ef\u8bbe\u7f6e\u5355\u51fb\u6216\u53cc\u51fb\u6253\u5f00\u6587\u4ef6 (contributed by @eryajf) (PR [#13076](https://github.com/t8y2/dbx/pull/13076))\n\n### \u6539\u8f