- \u6570\u636e\u7f51\u683c\u5217\u7b5b\u9009\u7684\u5019\u9009\u503c\u968f\u5176\u4ed6\u5df2\u751f\u6548\u7b5b\u9009\u6761\u4ef6\u8054\u52a8\u6536\u655b\uff0c\u672c\u5730\u7b5b\u9009\u548c\u6570\u636e\u5e93\u7b5b\u9009\u5747\u652f\u6301 (contributed by @eryajf) (PR [#12369](https://github.com/t8y2/dbx/pull/12369))\n- \u7b5b\u9009\u9762\u677f\u65b0\u589e\u81ea\u5b9a\u4e49\u8fd0\u7b97\u7b26\u6392\u5e8f\u5bf9\u8bdd\u6846\uff0c\u53ef\u6309\u6570\u636e\u5e93\u7c7b\u578b\u6301\u4e45\u5316\u8c03\u6574\u8fd0\u7b97\u7b26\u987a\u5e8f (contributed by @zipg) (PR [#12362](https://github.com/t8y2/dbx/pull/12362))\n- GaussDB \u8fde\u63a5\u7684 query_dop \u5e76\u884c\u8bbe\u7f6e\u540c\u6b65\u5e94\u7528\u5230\u884c\u6570\u7edf\u8ba1\u548c\u5206\u9875 SQL\uff0c\u4e0e\u4e3b\u67e5\u8be2\u4e00\u81f4 (contributed by @AndrewDi) (PR [#12300](https://github.com/t8y2/dbx/pull/12300))\n- \u5355\u5143\u683c\u8be6\u60c5\u652f\u6301 base64 \u4e8c\u8fdb\u5236\u5185\u5bb9\u5185\u8054\u9884\u89c8\uff0c\u81ea\u52a8\u8bc6\u522b\u683c\u5f0f\u5e76\u53ef\u76f4\u63a5\u4fdd\u5b58\u4e3a\u6587\u4ef6 (contributed by @dbin0123) (PR [#12210](https://github.com/t8y2/dbx/pull/12210))\n- Oracle \u4e0e OceanBase Oracle \u8868\u7ed3\u6784\u7f16\u8f91\u5668\u652f\u6301\u4e3b\u952e\u3001CHECK/UNIQUE\u3001\u5916\u952e\u7ea6\u675f\u548c\u7d22\u5f15\u7684\u7f16\u8f91\uff0c\u6267\u884c\u524d\u590d\u6838\u5bf9\u8c61\u72b6\u6001 (contributed by @efeire) (PR [#12345](https://github.com/t8y2/dbx/pull/12345))\n- \u6807\u7b7e\u9875\u53f3\u952e\u83dc\u5355\u65b0\u589e\"\u4fdd\u5b58\u5168\u90e8\u6807\u7b7e\"\uff0c\u4e00\u6b21\u4fdd\u5b58\u6240\u6709\u6709\u6539\u52a8\u7684\u6807\u7b7e (contributed by @lxk955) (PR [#12352](https://github.com/t8y2/dbx/pull/12352))\n- MySQL \u6279\u91cf\u4fdd\u5b58\u591a\u4e2a\u76f8\u540c\u503c\u7684\u6539\u52a8\u65f6\u628a\u4e3b\u952e\u5408\u5e76\u4e3a IN \u6761\u4ef6\uff0c\u4e0d\u518d\u751f\u6210 DBA \u96be\u4ee5\u63a5\u53d7\u7684\u957f OR \u94fe (contributed by @Abeautifulsnow) (PR [#12334](https://github.com/t8y2/dbx/pull/12334))\n- \u8868\u7ed3\u6784\u7f16\u8f91\u5668\u7684\u63d2\u5165\u9884\u8bbe\u5b57\u6bb5\u5728\u7f16\u8f91\u5df2\u6709\u8868\u65f6\u4e5f\u53ef\u4f7f\u7528\uff0c\u4e0d\u518d\u4ec5\u9650\u5efa\u8868\u6a21\u5f0f (contributed by @lxk955) (PR [#12335](https://github.com/t8y2/dbx/pull/12335))\n- \u6267\u884c SQL \u6587\u4ef6\u652f\u6301\u9009\u62e9\u6587\u4ef6\u7f16\u7801\uff08\u81ea\u52a8\u68c0\u6d4b\u3001UTF-8\u3001GBK\u3001UTF-16 LE\u3001UTF-16 BE\uff09\uff0c\u65e0\u9700\u9884\u5148\u8f6c\u7801\uff0c\u9884\u89c8\u4e0e\u6267\u884c\u4fdd\u6301\u4e00\u81f4 (contributed by @eryajf) (PR [#12285](https://github.com/t8y2/dbx/pull/12285))\n- Redis \u8fde\u63a5\u7684\u9ad8\u7ea7\u8bbe\u7f6e\u652f\u6301\u914d\u7f6e\u503c\u9884\u89c8\u5927\u5c0f\u4e0a\u9650\uff081\u201365536 KiB\uff0c\u9ed8\u8ba4 64 KiB\uff09\uff0c\u8f83\u5927\u7684\u503c\u4e0d\u5fc5\u518d\u4e0b\u8f7d\u67e5\u770b (contributed by @zipg) (PR [#12089](https://github.com/t8y2/dbx/pull/12089))\n- MongoDB \u67e5\u8be2\u7f16\u8f91\u5668\u652f\u6301 db.createView \u4ee5\u53ca\u7528\u6237\u548c\u89d2\u8272\u76f8\u5173 shell \u8f85\u52a9\u547d\u4ee4 (contributed by @thailoc-dev) (PR [#12234](https://github.com/t8y2/dbx/pull/12234))\n- \u6570\u636e\u4f20\u8f93\u652f\u6301\u6309\u4efb\u52a1\u914d\u7f6e\u5355\u6b21\u64cd\u4f5c\u8d85\u65f6\uff08\u79d2\uff09\uff0c\u6d41\u5f0f\u8bfb\u53d6\u6309\u65e0\u8fdb\u5c55\u65f6\u95f4\u8ba1\u7b97\uff0c\u4e0d\u9650\u5236\u4efb\u52a1\u603b\u65f6\u957f\n- \u4fa7\u8fb9\u680f\u8868\u7684\"\u514b\u9686\"\u64cd\u4f5c\u76f4\u63a5\u6253\u5f00\u590d\u5236\u4e3a\u65b0\u8868\u5bf9\u8bdd\u6846\uff0c\u81ea\u52a8\u5e26\u5165\u6e90\u8868\n- MySQL \u517c\u5bb9\u8fde\u63a5\uff08MariaDB\u3001TiDB\u3001OceanBase\u3001TDSQL\u3001PolarDB\u3001GreatSQL\u3001GoldenDB\u3001Dolt \u7b49\uff09\u652f\u6301\u8bbe\u7f6e AUTO_INCREMENT\n- \u4fa7\u8fb9\u680f\u9644\u52a0\u4fe1\u606f\u65b0\u589e\"\u6ce8\u91ca + \u5bf9\u8c61\u5927\u5c0f\"\u7ec4\u5408\u9009\u9879\uff0c\u540c\u65f6\u67e5\u770b\u5b