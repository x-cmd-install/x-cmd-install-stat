d\u65b0\u589e Navicat .nb3 \u683c\u5f0f\u7684\u5907\u4efd\u4e0e\u6062\u590d\uff0c\u5e76\u652f\u6301\u5bfc\u5165\u3001\u6062\u590d DBX \u4e4b\u5916\u521b\u5efa\u7684\u5907\u4efd\u6587\u4ef6 (contributed by @FrederykAbryan) (PR [#13210](https://github.com/t8y2/dbx/pull/13210))\n- Elasticsearch \u8fde\u63a5\u65b0\u589e API Key \u8ba4\u8bc1\u65b9\u5f0f\uff0c\u652f\u6301\u76f4\u8fde\u548c Kibana \u4ee3\u7406\u4f20\u8f93 (contributed by @seth-shi) (PR [#13230](https://github.com/t8y2/dbx/pull/13230))\n- SSH \u96a7\u9053\u5c42\u652f\u6301\u56fa\u5b9a\u672c\u5730\u7aef\u53e3\uff0c\u8fde\u63a5\u6253\u5f00\u671f\u95f4\u5176\u4ed6\u672c\u5730\u5de5\u5177\u53ef\u590d\u7528 DBX \u5df2\u5efa\u7acb\u7684\u96a7\u9053 (contributed by @HabibAlmaula) (PR [#13013](https://github.com/t8y2/dbx/pull/13013))\n- \u5916\u90e8 SQL \u6587\u4ef6\u9762\u677f\u652f\u6301\u540c\u76ee\u5f55\u62d6\u62fd\u6392\u5e8f\uff0c\u63d0\u4f9b\u624b\u52a8\u3001\u540d\u79f0\u5347\u5e8f\u548c\u540d\u79f0\u964d\u5e8f\u4e09\u79cd\u6a21\u5f0f\u5e76\u672c\u5730\u6301\u4e45\u5316 (contributed by @eryajf) (PR [#13322](https://github.com/t8y2/dbx/pull/13322))\n- \u5173\u8054\u78c1\u76d8\u6587\u4ef6\u7684\u67e5\u8be2\u6807\u7b7e\u65b0\u589e\u300c\u5728 SQL \u6587\u4ef6\u5217\u8868\u4e2d\u5b9a\u4f4d\u300d\u53f3\u952e\u83dc\u5355\uff0c\u53ef\u5728\u6587\u4ef6\u9762\u677f\u4e2d\u5c55\u5f00\u5e76\u9ad8\u4eae\u5bf9\u5e94\u6587\u4ef6 (contributed by @eryajf) (PR [#13079](https://github.com/t8y2/dbx/pull/13079))\n- SQL \u7f16\u8f91\u5668\u67e5\u627e\u9762\u677f\u65b0\u589e\u5168\u5b57\u5339\u914d\u5f00\u5173\uff0c\u53ef\u4e0e\u5927\u5c0f\u5199\u548c\u6b63\u5219\u5f00\u5173\u7ec4\u5408\u4f7f\u7528 (contributed by @xiaou61) (PR [#13297](https://github.com/t8y2/dbx/pull/13297))\n- SQL \u7f16\u8f91\u5668\u53ca\u5355\u5143\u683c\u8be6\u60c5\u7b49\u7f16\u8f91\u5668\u652f\u6301\u89e6\u63a7\u677f\u53cc\u6307\u634f\u5408\u7f29\u653e\u5b57\u53f7 (contributed by @kkwangxx) (PR [#13260](https://github.com/t8y2/dbx/pull/13260))\n- Oracle \