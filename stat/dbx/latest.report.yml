on","state":"uploaded","size":18867,"digest":"sha256:010089b3ff48fd4a5f2794bb75d6bba3267383facffa941377113ece9fdf13d8","download_count":976,"created_at":"2026-09-25T04:20:13Z","updated_at":"2026-09-25T04:20:13Z"}],"body":"### \u65b0\u529f\u80fd\n- \u65b0\u589e Salesforce\uff08SOQL\uff09\u6570\u636e\u6e90\uff0c\u652f\u6301 OAuth \u767b\u5f55\u3001SOQL \u67e5\u8be2\u4e0e\u5206\u9875\u3001\u5bf9\u8c61\u5143\u6570\u636e\u6d4f\u89c8\u3001\u7f51\u683c\u7f16\u8f91\u53ca MCP \u5de5\u5177 (contributed by @zouchao) (PR [#10214](https://github.com/t8y2/dbx/pull/10214))\n- PostgreSQL \u7cfb\u5217\u8fde\u63a5\u652f\u6301\u6d4f\u89c8\u6570\u636e\u5e93\u7ea7\u4e8b\u4ef6\u89e6\u53d1\u5668\uff08Event Trigger\uff09\u5bf9\u8c61 (contributed by @Tara8573) (PR [#10138](https://github.com/t8y2/dbx/pull/10138))\n- \u65b0\u589e\u300c\u5bfc\u51fa\u6570\u636e\u5b57\u5178\u300d\u529f\u80fd\uff0c\u53ef\u751f\u6210\u5305\u542b\u5b57\u6bb5\u3001\u6ce8\u91ca\u4e0e\u5916\u952e\u7684 PDF \u62a5\u544a\uff0c\u652f\u6301\u9009\u62e9\u6a21\u677f\u3001\u5c01\u9762\u3001\u76ee\u5f55\u4e0e\u7eb8\u5f20\u65b9\u5411 (contributed by @onenewcode) (PR [#10206](https://github.com/t8y2/dbx/pull/10206))\n- \u63d2\u4ef6\u5e73\u53f0\u65b0\u589e AI \u5de5\u5177\u8c03\u7528\u80fd\u529b\uff0c\u63d2\u4ef6\u53ef\u5728\u7528\u6237\u9010\u6b21\u6388\u6743\u540e\u8bbf\u95ee\u8fde\u63a5\u6570\u636e\n- \u63d2\u4ef6\u6c99\u7bb1\u65b0\u589e\u7cfb\u7edf\u526a\u8d34\u677f\u8bfb\u53d6\u6865\u63a5\uff0c\u53d7 host.clipboard:read \u6743\u9650\u95e8\u63a7\uff0cSSH \u7ec8\u7aef\u7b49\u63d2\u4ef6\u53ef\u76f4\u63a5\u7c98\u8d34 (contributed by @jinpy666) (PR [#10155](https://github.com/t8y2/dbx/pull/10155))\n- \u63d2\u4ef6\u5feb\u6377\u5165\u53e3\u652f\u6301\u914d\u7f6e\u663e\u793a\u4e0e\u505c\u9760\u4f4d\u7f6e (contributed by @Ezreal-byte) (PR [#10229](https://github.com/t8y2/dbx/pull/10229))\n- \u63d2\u4ef6\u5e02\u573a\u652f\u6301\u591a\u79cd\u6392\u5e8f\u65b9\u5f0f\uff08\u540d\u79f0\u3001\u6700\u8fd1\u66f4\u65b0\u3001\u6700\u65b0\u53d1\u5e03\u7b49\uff09\u5e76\u663e\u793a\u7248\u672c\u53d1\u5e03\u65e5\u671f (contributed by @Abeautifulsnow) (PR [#10247](https://github.com/t8y2/dbx/pull/10247))\n- \u53ef\u901a\u8fc7\u53f3\u952e\u83dc\u5355\u76f4\u63a5\u6253\u5f00\u63d2\u4ef6\u63d0\u4f9b\u7684 Workbench (contributed by @0verme) (PR [#10244](https://github.com/t8y2/dbx/pull/10244))\n- SQL \u7f16\u8f91\u5668\u81ea\u52a8\u9ad8\u4eae\u6574\u4e2a\u6587\u4ef6\u4e2d\u6570\u636e\u5e93\u4e0d\u5b58\u5728\u7684\u8868\u540d\u4e0e\u5b57\u6bb5\u540d\uff0c\u65e0\u9700\u6267\u884c\u5373\u53ef\u53d1\u73b0\u62fc\u9519\u6216\u5931\u6548\u7684\u540d\u5b57 (contributed by @dafeng-001) (PR [#9771](https://github.com/t8y2/dbx/pull/9771))\n- \u53cc\u51fb\u4f8b\u7a0b\u53ef\u76f4\u63a5\u5728\u6e90\u7801\u9875\u7b7e\u6253\u5f00\u67e5\u770b\u5b9a\u4e49 (contributed by @OOMEcho) (PR [#10237](https://github.com/t8y2/dbx/pull/10237))\n- \u67e5\u8be2\u7ed3\u679c\u9875\u7b7e\u652f\u6301\u70b9\u51fb\u56fa\u5b9a\u4e0e\u91cd\u547d\u540d\uff0c\u6267\u884c\u6279\u6b21\u6807\u7b7e\u663e\u793a\u6765\u6e90\u8868\u540d\uff0c\u5e76\u53ef\u914d\u7f6e\u9875\u7b7e\u540d\u79f0\u662f\u5426\u5305\u542b\u6570\u636e\u5e93\u540d (contributed by @HighBigSky) (PR [#10173](https://github.com/t8y2/dbx/pull/10173))\n- \u67e5\u8be2\u7ed3\u679c\u663e\u793a\u8bf7\u6c42\u7b49\u5f85\u65f6\u95f4\u4e0e\u5206\u9636\u6bb5\u8017\u65f6\u660e\u7ec6\uff0c\u8986\u76d6 SQL\u3001MongoDB\u3001Redis\u3001Elasticsearch \u53ca JDBC \u5185\u90e8\u9636\u6bb5 (contributed by @efeire) (PR [#10231](https://github.com/t8y2/dbx/pull/10231))\n- \u7f51\u683c\u6570\u636e\u52a0\u8f7d\u4e0e\u5237\u65b0\u6d6e\u5c42\u65b0\u589e\u505c\u6b62\u6309\u94ae\uff0c\u53ef\u4e2d\u65ad\u8017\u65f6\u64cd\u4f5c (contributed by @zipg) (PR [#10250](https://github.com/t8y2/dbx/pull/10250))\n- \u65b0\u589e\u8bbe\u7f6e\u9879\u63a7\u5236\u7f51\u683c\u5217\u5934\u63d0\u793a\uff08tooltip\uff09\u7684\u663e\u793a (contributed by @OOMEcho) (PR [#10207](https://github.com/t8y2/dbx/pull/10207))\n- \u66f4\u65b0\u4e