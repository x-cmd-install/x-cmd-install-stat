u652f\u6301 findOneAndUpdate\u3001findOneAndReplace \u4e0e findOneAndDelete (contributed by @thailoc-dev) (PR [#9838](https://github.com/t8y2/dbx/pull/9838))\n- MongoDB \u65e7\u7248 Agent \u8fde\u63a5\u652f\u6301 distinct \u67e5\u8be2 (contributed by @thailoc-dev) (PR [#9884](https://github.com/t8y2/dbx/pull/9884))\n- MongoDB \u5e93\u8868\u89c6\u56fe\u663e\u793a\u96c6\u5408\u5360\u7528\u7a7a\u95f4\u5e76\u652f\u6301\u6309\u5927\u5c0f\u6392\u5e8f (contributed by @zipg) (PR [#9810](https://github.com/t8y2/dbx/pull/9810))\n- PostgreSQL \u4e0e Kingbase \u652f\u6301\u67e5\u770b\u5206\u533a\u8868\u8be6\u7ec6\u4fe1\u606f\u5e76\u7ba1\u7406\u5206\u533a (contributed by @amwps290) (PR [#9812](https://github.com/t8y2/dbx/pull/9812))\n- Excel \u6279\u91cf\u5efa\u8868\u5bfc\u5165\u652f\u6301\u52fe\u9009\u8981\u5bfc\u5165\u7684\u5de5\u4f5c\u8868 (contributed by @tdog54646) (PR [#9910](https://github.com/t8y2/dbx/pull/9910))\n- MCP \u56fa\u5b9a\u4f1a\u8bdd\u652f\u6301\u901a\u8fc7\u73af\u5883\u53d8\u91cf DBX_SESSION_IDLE_TTL_SECS \u914d\u7f6e\u7a7a\u95f2\u8d85\u65f6 (contributed by @tdog54646) (PR [#9909](https://github.com/t8y2/dbx/pull/9909))\n- \u67e5\u8be2\u5386\u53f2\u4fdd\u7559\u6761\u6570\u652f\u6301\u5728\u8bbe\u7f6e\u4e2d\u914d\u7f6e (contributed by @tdog54646) (PR [#9908](https://github.com/t8y2/dbx/pull/9908))\n- \u8868\u5c5e\u6027\u62bd\u5c49\u65b0\u589e\u300c\u8868\u4fe1\u606f\u300d\u9875\u7b7e\uff0c\u96c6\u4e2d\u67e5\u770b\u8868\u57fa\u672c\u4fe1\u606f\u4e0e\u4f53\u79ef\u7edf\u8ba1 (contributed by @sxhjlzl) (PR [#9876](https://github.com/t8y2/dbx/pull/9876))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u300c\u8df3\u8f6c\u5230\u884c\u300d\uff0c\u53ef\u8f93\u5165\u884c\u53f7\u5feb\u901f\u5b9a\u4f4d\uff08Ctrl+G / \u2318\u2325G\uff09 (contributed by @zipg) (PR [#9799](https://github.com/t8y2/dbx/pull/9799))\n- Oracle \u6267\u884c\u62a5\u9519\u65f6\u6309\u9519\u8bef\u6d88\u606f\u4e2d\u7684\u884c\u5217\u4f4d\u7f6e\u5b9a\u4f4d\u9519\u8bef\u5e76\u951a\u5b9a\u5149\u6807 (contributed by @zipg) (PR [#9804](https://github.com/t8y2/dbx/pull/9804))\n- AI \u652f\u6301\u4ee5\u53ea\u8bfb\u65b9\u5f0f\u9644\u52a0\u7528\u6237\u7ea7 Codex \u517c\u5bb9\u7684 SKILL.md \u6587\u4ef6\u4f5c\u4e3a\u8865\u5145\u6307\u4ee4 (contributed by @Abeautifulsnow) (PR [#9906](https://github.com/t8y2/dbx/pull/9906))\n- DDL \u7ed3\u6784\u89c6\u56fe\u65b0\u589e\u300c\u67e5\u770b\u6570\u636e\u300d\u5165\u53e3 (contributed by @zipg) (PR [#9790](https://github.com/t8y2/dbx/pull/9790))\n- \u63d2\u4ef6\u5de5\u4f5c\u53f0 UI \u8d44\u6e90\u6539\u7ecf dbx-plugin:// \u534f\u8bae\u52a0\u8f7d\uff0c\u4f7f\u7528\u76f8\u5bf9\u8def\u5f84\u5206\u5305\u7684\u63d2\u4ef6\u6062\u590d\u61d2\u52a0\u8f7d\u4e0e\u5b57\u4f53\u52a0\u8f7d\n- \u63d2\u4ef6 Host API \u65b0\u589e storage \u6865\u63a5\uff0c\u63d2\u4ef6\u53ef\u6301\u4e45\u5316\u8bfb\u5199\u72ec\u7acb\u7684\u6570\u636e\u76ee\u5f55\n\n### \u6539\u8fdb\n\n- \u8868\u7ed3\u6784\u7f16\u8f91\u5668\u7684\u5217\u7f51\u683c\u6539\u4e3a\u865a\u62df\u6e32\u67d3\uff0c\u5927\u8868\u6eda\u52a8\u66f4\u6d41\u7545\n- \u540d\u79f0\u76f8\u540c\u7684\u6807\u7b7e\u9875\u81ea\u52a8\u6dfb\u52a0\u6570\u5b57\u540e\u7f00\uff0c\u4fbf\u4e8e\u533a\u5206 (contributed by @zipg) (PR [#9913](https://github.com/t8y2/dbx/pull/9913))\n- \u66f4\u65b0\u4e2d\u5fc3\u65e0\u53ef\u7528\u66f4\u65b0\u65f6\u9690\u85cf\u5ba2\u6237\u7aef\u9875\u7b7e (contributed by @zipg) (PR [#9912](https://github.com/t8y2/dbx/pull/9912))\n- \u5bfc\u51fa SQL \u65f6\u6bcf\u6761\u6570\u636e\u884c\u5355\u72ec\u6210\u884c\uff0c\u4fbf\u4e8e\u9605\u8bfb\u4e0e\u6bd4\u5bf9 (contributed by @zipg) (PR [#9836](https://github.com/t8y2/dbx/pull/9836))\n\n### \u4fee\u590d\n\n- \u4fee\u590d MySQL group_concat_max_len \u4f1a\u8bdd\u8bbe\u7f6e\u88ab\u4e0b\u8c03\u8986\u76d6\u670d\u52a1\u7aef\u66f4\u9ad8\u914d\u7f6e (contributed by @zipg) (PR [#9795](https://github.com/t8y2/dbx/pull/9795))\n- \u4fee\u590d SQL Server \u7ed3\u6784\u5bf9\u6bd4\u9047\u5230 tinyint \u5916\u952e\u65f6\u62a5\u9519\u9000\u51fa (contributed by @zipg) (PR