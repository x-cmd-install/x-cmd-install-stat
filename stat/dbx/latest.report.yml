62b4c6e3f758350c507d6894997c9fac612ff25","download_count":120,"created_at":"2026-11-06T01:38:26Z","updated_at":"2026-11-06T01:38:27Z"},{"id":715503857,"node_id":"RA_kwDOSPdiBc4qpbjx","name":"DBX_0.6.67_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":44838912,"digest":"sha256:71117755d77ed679ce0279c2526bd7650ff14899056928d1e480f67876da287c","download_count":51,"created_at":"2026-11-06T01:38:36Z","updated_at":"2026-11-06T01:38:38Z"},{"id":714653167,"node_id":"RA_kwDOSPdiBc4qmL3v","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":50002416,"digest":"sha256:ebf7583237f66d03484250722c68ce0e2c2fac00a91635ffd87d8474c9a4656b","download_count":92,"created_at":"2026-11-05T20:06:03Z","updated_at":"2026-11-05T20:06:06Z"},{"id":715536471,"node_id":"RA_kwDOSPdiBc4qpjhX","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":17324,"digest":"sha256:464b8f068e863654c2ff8741a93f7951c70b7e7ae6a265c1ba9585e7b0413f53","download_count":24270,"created_at":"2026-11-06T01:52:45Z","updated_at":"2026-11-06T01:52:46Z"}],"body":"### 新功能\n\n- Web 访问登录页新增图片验证码，默认在登录失败后自动触发，可在设置 → 安全中选择始终、自动或关闭\n- MySQL 批量截断、清空、删除对象时新增「外键检查」选项（默认/启用/禁用），非默认选项在独立会话中执行并在结束后恢复原值 (contributed by @alanslengkoan) (PR [#14000](https://github.com/t8y2/dbx/pull/14000))\n- 数据网格复制新增独立的 SQL DELETE 选项，可仅复制所选行的删除语句 (contributed by @eryajf) (PR [#14318](https://github.com/t8y2/dbx/pull/14318))\n- 查找替换面板支持 Ctrl+Alt+Enter 全部替换，与 VS Code 快捷键一致 (contributed by @AndreasK79) (PR [#14342](https://github.com/t8y2/dbx/pull/14342))\n- 「选中内容转换为带分隔符的列表」命令新增可自定义快捷键，默认 Mod+Alt+, (contributed by @AndreasK79) (PR [#14310](https://github.com/t8y2/dbx/pull/14310))\n- 重名标签页新增可选的连接名区分方式，显示为「对象名 + 连接名」，默认仍使用序号 (contributed by @javalover123) (PR [#14343](https://github.com/t8y2/dbx/pull/14343))\n\n### 改进\n\n- MySQL 建表 SQL 补全新增 MEDIUMINT 数据类型建议 (contributed by @MuY-DG) (PR [#14148](https://github.com/t8y2/dbx/pull/14148))\n- SQL 语义诊断新增未知表别名检查，引用不存在的别名时会给出标注提示 (contributed by @Gaiokane) (PR [#14363](https://github.com/t8y2/dbx/pull/14363))\n- 导入工具的自动生成值与数据类型下拉框支持点击外部或 Esc 关闭，并随滚动实时跟随 (contributed by @chukui2005) (PR [#14354](https://github.com/t8y2/dbx/pull/14354))\n- 通用表复制（如 GaussDB）执行期间在侧边栏和对象浏览器显示运行状态，完成后自动清除 (contributed by @ThugKd) (PR [#14378](https://github.com/t8y2/dbx/pull/14378))\n- 源码与 DDL 标签页改为在当前标签右侧打开，便于连续查看 (contributed by @imcman) (PR [#14296](https://github.com/t8y2/dbx/pull/14296))\n\n### 修复\n\n- 修复 Doris 连接报 Unexpected packet 无法登录的问题（v0.6.66 握手调整的回归），兼容 MySQL 协议的连接默认改用传统 EOF (contributed by @zipg) (PR [#14362](https://github.com/t8y2/dbx/pull/14362))\n- 修复 MySQL 对象列表的注释、时间和大小列默认为空、手动「加载详情」又不生效的问题，详情与统计改为后台自动补齐 (contributed by @zipg) (PR [#14400](https://github.com/t8y2/dbx/pull/14400))\n- 修复 MySQL 查询带 LIMIT 时结果总数直接显示为 LIMIT 上限的问题，并避免分页重复统计 (contributed by @eryajf) (PR [#14288](https://github.com/t8y2/dbx/pull/14288))\n- 修复 MySQL 向达梦传输表结构时列默认值丢失的问题 (contributed by @ThugKd) (PR [#14375](https://github.com/t8y2/dbx/pull/14375))\n- 修复达梦向 PostgreSQL 传输表结构时列默认值丢失的问题 (contributed by @ThugKd) (PR [#14364](https://github.com/t8y2/dbx/pull/14364))\n- 修复达梦原生作业识别会话用户失败的问题，改用 CURRENT_USER 查询当前用户\n- 修复 GaussDB EXECUTE DIRECT 查询不显示结果网格的问题 (contributed by @Tong-bit-art) (PR [#14120](https://github.com/t8y2/dbx/pull/14120))\n- 修复 JDBC 插件在 PostgreSQL 及兼容库上 CREATE TABLE AS 报 42P07 并留下空表的问题，DDL 不再进入分页查询事务 (contributed by @hongshuo-wang) (PR [#14368](https://github.com/t8y2/dbx/pull/14368))\n- 修复 SQL Server 导出脚本未用 GO 分隔视图、存储过程、函数、触发器批次、新库回放报错的问题 (contributed by @0xvectr) (PR [#14312](https://github.com/t8y2/dbx/pull/14312))\n- 修复 Redis 保存编辑的集合成员后搜索框和筛选结果被清空的问题 (contributed by @xiaou61) (PR [#14331](https://github.com/t8y2/dbx/pull/14331))\n- 修复 Kafka 主题保留策略恒显示 -1、保存时把 -1 回写并抹掉原有保留配置的问题，现仅下发实际修改过的字段 (contributed by @pengwow) (PR [#14347](https://github.com/t8y2/dbx/pull/14347))\n- 修复 MQTT 证书连接被无关的密码弹窗拦截、无法连接 broker 的问题 (contributed by @lcq928) (PR [#14346](https://github.com/t8y2/dbx/pull/14346))\n- 修复 TDengine SSL/TLS 连接失败及 rustls CryptoProvider panic 的问题，连接对话框补充 SSL/TLS 配置页 (contributed by @DeanCen) (PR [#14391](https://github.com/t8y2/dbx/pull/14391))\n- 修复新建 DuckDB 连接时文件选择对话框无法选中无扩展名或自定义扩展名数据库文件的问题 (contributed by @ThugKd) (PR [#14366](https://github.com/t8y2/dbx/pull/14366))\n- 修复在已有代码前缩进时自动弹出列补全、按 Tab 把候选插入原有文本之前的问题 (contributed by @0scar07) (PR [#14216](https://github.com/t8y2/dbx/pull/14216))\n- 修复 Vim 模式 r 命令遇到输入法上屏字符不生效、直接插入光标前的问题 (contributed by @xiaou61) (PR [#14059](https://github.com/t8y2/dbx/pull/14059))\n- 修复自定义 SQL 格式化在长语句换行时丢失限定名前空格（如 COLUMNtest_table.h）的问题 (contributed by @CN-Scars) (PR [#14394](https://github.com/t8y2/dbx/pull/14394))\n- 修复 SQL 快捷方式行数上限被静默钳制在 100000、配置更大值不生效的问题 (contributed by @ericbyz) (PR [#14329](https://github.com/t8y2/dbx/pull/14329))\n- 修复 SQL 文件面板不识别 Oracle、PostgreSQL、SQL Server 等引擎专用脚本扩展名（.pkb、.psql、.tsql 等）、交给系统外部程序打开的问题 (contributed by @FrankChan8) (PR [#14206](https://github.com/t8y2/dbx/pull/14206))\n- 修复手动事务执行被中断后 busy 标记不清理、会话永久无法再执行语句的问题 (contributed by @dienaso) (PR [#14386](https://github.com/t8y2/dbx/pull/14386))\n- 修复更新中心在版本被忽略时误报「已是最新」的问题，现会标明被忽略的版本并支持一键恢复 (contributed by @xiaou61) (PR [#13969](https://github.com/t8y2/dbx/pull/13969))\n- 修复 Windows 侧边栏表备注不跟随界面字体设置的问题 (contributed by @eryajf) (PR [#14274](https://github.com/t8y2/dbx/pull/14274))\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":22}
