t":"2026-11-20T01:20:50Z"},{"id":769011316,"node_id":"RA_kwDOSPdiBc4t1i50","name":"DBX_0.6.72_x64-win7-server2008r2-offline-setup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":188703344,"digest":"sha256:6bd2810fb57ac64079e2a7ceab91be40aeda6c7dce1c84fb22342feaa372b4f4","download_count":187,"created_at":"2026-11-19T19:40:46Z","updated_at":"2026-11-19T19:40:53Z"},{"id":769011315,"node_id":"RA_kwDOSPdiBc4t1i5z","name":"DBX_0.6.72_x64-win7-server2008r2-offline-setup.exe.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":118,"digest":"sha256:d76a4217e1a48f952624f4644f193ad4491d09b1d0290f390887aaf8b64371e5","download_count":24,"created_at":"2026-11-19T19:40:46Z","updated_at":"2026-11-19T19:40:46Z"},{"id":769961271,"node_id":"RA_kwDOSPdiBc4t5K03","name":"DBX_0.6.72_x64.dmg","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-apple-diskimage","state":"uploaded","size":50515332,"digest":"sha256:39309b5eb8600b016caed0b72369e3c1f539c6979a06810705074da54b7eeb73","download_count":145,"created_at":"2026-11-20T01:20:43Z","updated_at":"2026-11-20T01:20:46Z"},{"id":769961716,"node_id":"RA_kwDOSPdiBc4t5K70","name":"DBX_0.6.72_x64_en-US.msi","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msi","state":"uploaded","size":45428736,"digest":"sha256:8cb3df9e74938daf9190fca7e05d504b501d6f8e5433e05f459787c0115de203","download_count":75,"created_at":"2026-11-20T01:20:56Z","updated_at":"2026-11-20T01:20:58Z"},{"id":769036035,"node_id":"RA_kwDOSPdiBc4t1o8D","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":50598351,"digest":"sha256:cecba3319e1b348a6736b3a8247b2a6f12f6b89015a0d647b91140bb14c03029","download_count":223,"created_at":"2026-11-19T19:49:18Z","updated_at":"2026-11-19T19:49:22Z"},{"id":770255017,"node_id":"RA_kwDOSPdiBc4t6Sip","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":25726,"digest":"sha256:45ebdf7b4afefadec2992bdd21418d4057f186079a594f481841a2800d99c713","download_count":23477,"created_at":"2026-11-20T03:15:32Z","updated_at":"2026-11-20T03:15:33Z"}],"body":"### 新功能\n\n- Kafka 新增查看 Broker 生效配置，可按名称、值和来源浏览 (contributed by @CSXFanMeng) (PR [#15227](https://github.com/t8y2/dbx/pull/15227))\n- Elasticsearch 支持按文本搜索索引文档\n- Redis 逻辑库节点下直接列出该库已保存的命令，点击即可打开编辑器 (contributed by @ThugKd) (PR [#15052](https://github.com/t8y2/dbx/pull/15052))\n- Redis 支持将大值下载为结构化 JSON\n- MongoDB 的 JSON 预览新增「当前页」模式，沿用表格筛选与排序并支持完整复制 (contributed by @ThugKd) (PR [#15139](https://github.com/t8y2/dbx/pull/15139))\n- Oracle 包和包体源码页新增可收起的成员列表，点击跳转到声明 (contributed by @ThugKd) (PR [#15140](https://github.com/t8y2/dbx/pull/15140))\n- StarRocks 权限编辑支持表、视图和物化视图，并按对象类型生成 ON TABLE / ON VIEW / ON MATERIALIZED VIEW 授权语句 (contributed by @ThugKd) (PR [#15094](https://github.com/t8y2/dbx/pull/15094))\n- SQL 编辑器右键菜单新增「从此处执行 SQL 脚本」，从右键位置执行到文末 (contributed by @ThugKd) (PR [#15173](https://github.com/t8y2/dbx/pull/15173))\n- SQL 编辑器调用存储过程时显示参数提示\n- 新增跨 SQL 标签共享的持久书签面板，按文件分组并列出全部书签 (contributed by @RickieGao) (PR [#15220](https://github.com/t8y2/dbx/pull/15220))\n- 查询结果支持一键全屏查看，Esc 或切换标签恢复原分栏 (contributed by @ThugKd) (PR [#15137](https://github.com/t8y2/dbx/pull/15137))\n- 新增 Alt+Ctrl/Cmd 独立复合修饰符选区风格，可保留已有选区、切换单个选区并支持双击选词 (contributed by @yifurusi9-cyber) (PR [#14971](https://github.com/t8y2/dbx/pull/14971))\n- SQL 参数弹窗支持按需保留单引号字符串中的模板占位符，字符串外参数仍可填值 (contributed by @ThugKd) (PR [#15100](https://github.com/t8y2/dbx/pull/15100))\n- 表数据行详情新增 JSON 预览，在每个属性旁显示字段注释 (contributed by @ThugKd) (PR [#15055](https://github.com/t8y2/dbx/pull/15055))\n- 支持将选中的结果列导出为 SQL UPDATE，主键自动用于 WHERE 定位 (contributed by @ThugKd) (PR [#15098](https://github.com/t8y2/dbx/pull/15098))\n- 二进制列格式化新增十六进制、UTF-8、UUID 及按 MySQL 时间位交换恢复 UUID 四种显示方式 (contributed by @ThugKd) (PR [#15097](https://github.com/t8y2/dbx/pull/15097))\n- 表数据分页支持「设为此表的默认值」，单表页大小按连接与表保存 (contributed by @ThugKd) (PR [#14989](https://github.com/t8y2/dbx/pull/14989))\n- 查询结果转置视图按标签持久记忆，重新执行后仍保持所选视图 (contributed by @ThugKd) (PR [#14982](https://github.com/t8y2/dbx/pull/14982))\n- 单元格值转换新增「多行压缩为一行」，粘贴的多行文本可压回一行再写回或导出 (contributed by @dienaso) (PR [#15008](https://github.com/t8y2/dbx/pull/15008))\n- 查询结果工具栏显示当前默认复制格式，点击即可切换后按 Ctrl+C 复制 (contributed by @jiejie1133) (PR [#15215](https://github.com/t8y2/dbx/pull/15215))\n- 新增「选中上一列 / 下一列」快捷键，可按可见列顺序整列选择并横向滚动 (contributed by @ThugKd) (PR [#15101](https://github.com/t8y2/dbx/pull/15101))\n- 连接下的数据库支持本地虚拟分组，覆盖 Redis、MongoDB 和 Milvus 并支持拖拽排序 (contributed by @eryajf) (PR [#15151](https://github.com/t8y2/dbx/pull/15151))\n- 侧边栏表节点右键新增只读「查看表结构」，不必再打开写入型编辑器 (contributed by @jhp8048) (PR [#14502](https://github.com/t8y2/dbx/pull/14502))\n- 侧边栏支持复制生成的 SQL 和 DDL 到剪贴板\n- Schema/库选择器支持 % 通配符搜索并一键选中匹配项 (contributed by @dienaso) (PR [#15146](https://github.com/t8y2/dbx/pull/15146))\n- 全局搜索理解 schema.table 形式的限定名 (contributed by @xiaou61) (PR [#15077](https://github.com/t8y2/dbx/pull/15077))\n- 侧边栏表字段用钥匙标识主键并用不同颜色图标区分普通与唯一索引 (contributed by @ThugKd) (PR [#14983](https://github.com/t8y2/dbx/pull/14983))\n- 对象树滚动到连接内部时固定当前连接栏，可直接折叠返回 (contributed by @ThugKd) (PR [#14980](https://github.com/t8y2/dbx/pull/14980))\n- 简单视图新增「隐藏与表并列的索引」选项，减少索引干扰 (contributed by @ThugKd) (PR [#15051](https://github.com/t8y2/dbx/pull/15051))\n- 数据库查找可限定选定的表和视图范围 (contributed by @ThugKd) (PR [#14985](https://github.com/t8y2/dbx/pull/14985))\n- 对象搜索显示当前数据库范围，无匹配时提供「搜索全部数据库」入口 (contributed by @ThugKd) (PR [#15092](https://github.com/t8y2/dbx/pull/15092))\n- SQL 库支持配置文件单击或双击打开，低频操作收纳进「更多」菜单 (contributed by @eryajf) (PR [#14286](https://github.com/t8y2/dbx/pull/14286))\n- SQL 库支持手动顺序、名称、创建日期和修改日期排序 (contributed by @ThugKd) (PR [#15138](https://github.com/t8y2/dbx/pull/15138))\n- 工具栏右侧操作支持文字标签显示切换\n- 连接导出对话框支持按分组和名称搜索，并按侧边栏排序展示 (contributed by @Abeautifulsnow) (PR [#15029](https://github.com/t8y2/dbx/pull/15029))\n- ER 图支持增量添加表、按表重试字段读取及折叠字段 (contributed by @CSXFanMeng) (PR [#15226](https://github.com/t8y2/dbx/pull/15226))\n- 导航树新增可选的彩色连接徽标样式，彩底表示已连接、灰底表示未连接 (contributed by @GuryYu) (PR [#15112](https://github.com/t8y2/dbx/pull/15112))\n- 单实例锁按数据目录隔离，不同数据目录的 DBX 可同时运行 (contributed by @CSXFanMeng) (PR [#14722](https://github.com/t8y2/dbx/pull/14722))\n- 支持跨窗口转移标签与分组、多窗口设置同步和会话恢复，并补齐各布局的「在新窗口打开」入口 (contributed by @zorohu) (PR [#8116](https://github.com/t8y2/dbx/pull/8116))\n- 插件新增通用连接编辑草稿 API，可查询可预填字段并唤起连接编辑器 (contributed by @Misaka10091) (PR [#15286](https://github.com/t8y2/dbx/pull/15286))\n\n### 改进\n\n- SQL 编辑器查找替换栏停靠在代码上方并预留高度，窄分栏下自动换行 (contributed by @ThugKd) (PR [#14986](https://github.com/t8y2/dbx/pull/14986))\n- 查询结果滚动条改为不占宽度的覆盖式滑块，静止淡出、滚动时增强显示 (contributed by @ThugKd) (PR [#15126](https://github.com/t8y2/dbx/pull/15126))\n- 查询结果字号上限从 16 px 提高到 24 px，行高、列宽与滚动定位同步适配 (contributed by @ThugKd) (PR [#15175](https://github.com/t8y2/dbx/pull/15175))\n- 表数据顶栏空间不足时操作按钮自动折叠为图标，表名保留省略显示 (contributed by @eryajf) (PR [#15070](https://github.com/t8y2/dbx/pull/15070))\n- 数据传输开始前增加传输计划确认提示，先检查再写入 (contributed by @ThugKd) (PR [#14987](https://github.com/t8y2/dbx/pull/14987))\n- SQL 库区分文件夹与 SQL 文件颜色，自定义连接颜色改以色点显示 (contributed by @ThugKd) (PR [#15167](https://github.com/t8y2/dbx/pull/15167))\n- AI 回复中的行内代码跟随 AI 对话字体设置 (contributed by @ThugKd) (PR [#15048](https://github.com/t8y2/dbx/pull/15048))\n- 表 DDL 视图应用选中的编辑器配色主题，浅色主题不再出现深色行号栏 (contributed by @lyinglyingl) (PR [#15214](https://github.com/t8y2/dbx/pull/15214))\n- 表结构编辑器字段名输入框的下划线不再显示不全或颜色过浅 (contributed by @Acd-kk) (PR [#15225](https://github.com/t8y2/dbx/pull/15225))\n- SQL 补全不再对嵌套子查询做指数级扫描，深层嵌套语句补全显著提速\n\n### 修复\n\n- Oracle 修复字段补全缺失并支持大小写不敏感匹配，侧边栏「定位表位置」恢复正常 (contributed by @Acd-kk) (PR [#15266](https://github.com/t8y2/dbx/pull/15266))\n- Oracle 修复例程格式化时包声明、ELSIF 分支和块注释的缩进错乱 (contributed by @ThugKd) (PR [#15136](https://github.com/t8y2/dbx/pull/15136))\n- MySQL 修复 Navicat HTTP 隧道的空用户名限制、初始化误拦截和无状态会话误判，写入不再随连接关闭回滚 (contributed by @portlet-z) (PR [#15018](https://github.com/t8y2/dbx/pull/15018))\n- MySQL 修复空闲连接被池回收且无事务时首次查询报 MYSQL_CLIENT_SESSION_LOST 的问题\n- MySQL 修复服务器版本变化后数据库列表不刷新的问题\n- MySQL 修复 BIT 字面量未按列声明宽度生成的问题\n- PostgreSQL 修复标量 real 查询结果固定截断六位小数导致小值变为零的问题 (contributed by @lyinglyingl) (PR [#15153](https://github.com/t8y2/dbx/pull/15153))\n- PostgreSQL 修复无主键表查询因隐藏元组定位列被兼容引擎拒绝而报错的问题，检测到拒绝后自动去除定位列重试\n- GaussDB 标识符引号按连接兼容模式生成，MySQL 兼容模式使用反引号 (contributed by @AndrewDi) (PR [#14615](https://github.com/t8y2/dbx/pull/14615))\n- GaussDB 修复 information_schema 列查询引用 udt_name 导致打开表无列、导出报错的问题 (contributed by @xiaou61) (PR [#15133](https://github.com/t8y2/dbx/pull/15133))\n- KingbaseES 对象列表类型签名改用 concat() 生成，修复模式对象页报错 (contributed by @xiaou61) (PR [#15134](https://github.com/t8y2/dbx/pull/15134))\n- Kingbase 保留克隆表的注释并修复零参数例程无法打开的问题\n- Doris 和 StarRocks 网格 LIKE 过滤省略不支持的 ESCAPE 子句并改用反斜杠转义，不再报语法错误\n- ClickHouse 流式行中的无效 UTF-8 字节替换为替换符，单个坏值不再导致整个查询失败 (contributed by @0xvectr) (PR [#15033](https://github.com/t8y2/dbx/pull/15033))\n- ClickHouse 遇到 per-user 设置约束报错时回退客户端侧结果限制，受限用户不再直接失败\n- SQL Server 语句分割器保持模块批次完整，修复存储过程编译被内部分号切断的问题 (contributed by @xiaou61) (PR [#15095](https://github.com/t8y2/dbx/pull/15095))\n- SQL Server SQL 补全显示列注释（MS_Description）\n- SQL Server 补全助手中的列注释搜索生效 (contributed by @dienaso) (PR [#15009](https://github.com/t8y2/dbx/pull/15009))\n- SQLite 修复 Windows verbatim 扩展路径被误判为 UNC 导致的启动闪退 (contributed by @Ezreal-byte) (PR [#15259](https://github.com/t8y2/dbx/pull/15259))\n- SQLite 恢复网络 URI 中 verbatim UNC 前缀的处理\n- Snowflake 为 Arrow 结果集打开 java.nio 模块访问，修复查询报错 (contributed by @0xvectr) (PR [#15230](https://github.com/t8y2/dbx/pull/15230))\n- SAP HANA 编辑视图描述改用 COMMENT ON VIEW，不再误生成 COMMENT ON TABLE (contributed by @zipg) (PR [#15201](https://github.com/t8y2/dbx/pull/15201))\n- DB2 修复深链接报 Unsupported connection type: db2 无法打开连接的问题 (contributed by @Aaron3S) (PR [#15141](https://github.com/t8y2/dbx/pull/15141))\n- Firebird SQL 补全复用旧库注释解码，修复中文注释乱码 (contributed by @ThugKd) (PR [#15135](https://github.com/t8y2/dbx/pull/15135))\n- InterSystems Caché 错误消息携带 SQLCODE 时回退 JDBC 元数据，修复表浏览失败 (contributed by @xiaou61) (PR [#15105](https://github.com/t8y2/dbx/pull/15105))\n- TDengine 导出稳定表数据改为仅通过子表，修复导出文件无法回导的问题 (contributed by @xiaou61) (PR [#14984](https://github.com/t8y2/dbx/pull/14984))\n- MongoDB 保留 mongodb+srv 发现并让各节点经 SSH 路由连接 (contributed by @thailoc-dev) (PR [#15295](https://github.com/t8y2/dbx/pull/15295))\n- MongoDB 混合类型列及子文档、数组中的 BSON 日期应用全局日期格式 (contributed by @ThugKd) (PR [#15143](https://github.com/t8y2/dbx/pull/15143))\n- Redis SCAN COUNT 被拒时按服务器自身上限重试，修复 TongRDS 下「获取全部」失败 (contributed by @Gaiokane) (PR [#14412](https://github.com/t8y2/dbx/pull/14412))\n- JDBC 插件连接增加空闲保活与健康检查，修复链路被 NAT 回收后查询失败只能手动重连 (contributed by @Acd-kk) (PR [#15296](https://github.com/t8y2/dbx/pull/15296))\n- 内嵌 Derby 复用共享 JVM 运行时\n- 数据传输到 MySQL 时替换 GoldenDB 等厂商专属存储引擎，修复建表报 Unknown storage engine (contributed by @dienaso) (PR [#14693](https://github.com/t8y2/dbx/pull/14693))\n- SQL 补全遵循查询块作用域，不再泄漏其他块的对象\n- 侧边栏刷新后数据库和 Schema 节点保持收起状态 (contributed by @onenewcode) (PR [#15103](https://github.com/t8y2/dbx/pull/15103))\n- 修复连接文件夹内 Elasticsearch 索引搜索不生效的问题 (contributed by @ThugKd) (PR [#15060](https://github.com/t8y2/dbx/pull/15060))\n- 全局搜索过滤期间保留局部表搜索框，可继续缩小范围 (contributed by @dienaso) (PR [#15154](https://github.com/t8y2/dbx/pull/15154))\n- 插件市场跳过需要未知权限的条目，其余兼容插件正常浏览 (contributed by @ThugKd) (PR [#15058](https://github.com/t8y2/dbx/pull/15058))\n- Web MCP 能力列表显示插件工具\n- MCP 高危调用审批详情保留完整长命令和参数，不再截断 (contributed by @wifi504) (PR [#15124](https://github.com/t8y2/dbx/pull/15124))\n- 桌面外观主题纳入备份与同步恢复，恢复到新设备后不再丢失 (contributed by @ThugKd) (PR [#15132](https://github.com/t8y2/dbx/pull/15132))\n- 清空 Find 快捷键后 Ctrl+F 不再被编辑器搜索面板占用 (contributed by @dienaso) (PR [#14636](https://github.com/t8y2/dbx/pull/14636))\n- 修复空格确认补全在已有代码上方插入语句时光标跳行且空格丢失的问题 (contributed by @chukui2005) (PR [#15287](https://github.com/t8y2/dbx/pull/15287))\n- 粘贴 IN 条件时保留引号内的空值与首尾空格，不再改变匹配结果 (contributed by @Celestial-0) (PR [#15145](https://github.com/t8y2/dbx/pull/15145))\n- 拖动查询结果分隔条时保留编辑器选区与焦点 (contributed by @ThugKd) (PR [#15082](https://github.com/t8y2/dbx/pull/15082))\n- AI 流式输出等无关容器滚动不再关闭已打开的右键菜单 (contributed by @onenewcode) (PR [#15120](https://github.com/t8y2/dbx/pull/15120))\n- SQL 库导出使用重命名后的文件名\n","mentions_count":27}
