1891](https://github.com/t8y2/dbx/pull/11891))\n- GaussDB \u548c openGauss \u8fde\u63a5\u652f\u6301\u624b\u52a8\u4e8b\u52a1\u7ba1\u7406 (contributed by @AndrewDi) (PR [#11888](https://github.com/t8y2/dbx/pull/11888))\n- Web \u90e8\u7f72\u53ef\u901a\u8fc7\u73af\u5883\u53d8\u91cf\u5c06\u5df2\u4fdd\u5b58\u8fde\u63a5\u7684\u51ed\u636e\u4fdd\u7559\u5728\u670d\u52a1\u7aef\uff0c\u63a5\u53e3\u4e0d\u518d\u8fd4\u56de\u660e\u6587\u5bc6\u7801 (contributed by @zipg) (PR [#11902](https://github.com/t8y2/dbx/pull/11902))\n- MQTT \u6d88\u606f\u5217\u8868\u652f\u6301\u6309\u65b9\u5411\u7b5b\u9009\uff08\u5168\u90e8 / \u5df2\u63a5\u6536 / \u5df2\u53d1\u9001\uff09 (contributed by @ma123456mai) (PR [#11904](https://github.com/t8y2/dbx/pull/11904))\n- \u5355\u5143\u683c\u53f3\u952e\u7b5b\u9009\u5b50\u83dc\u5355\u65b0\u589e\u300c\u81ea\u5b9a\u4e49\u7b5b\u9009\u300d\u5165\u53e3\uff0c\u53ef\u76f4\u63a5\u6253\u5f00\u6761\u4ef6\u7b5b\u9009\u9762\u677f\u5e76\u9884\u586b\u5f53\u524d\u5355\u5143\u683c\u503c (contributed by @hongshuo-wang) (PR [#11880](https://github.com/t8y2/dbx/pull/11880))\n- \u5378\u8f7d\u63d2\u4ef6\u65f6\u4f1a\u5217\u51fa\u5e76\u786e\u8ba4\u4ecd\u5728\u4f7f\u7528\u8be5\u63d2\u4ef6\u7684\u5df2\u4fdd\u5b58\u8fde\u63a5 (contributed by @Abeautifulsnow) (PR [#11872](https://github.com/t8y2/dbx/pull/11872))\n- \u4fa7\u8fb9\u680f\u7684\u8868\u3001\u89c6\u56fe\u7b49\u5bf9\u8c61\u884c\u4e5f\u4f1a\u663e\u793a\u751f\u4ea7\u73af\u5883\u5fbd\u7ae0\uff0c\u8fde\u63a5\u884c\u6eda\u51fa\u89c6\u91ce\u540e\u4ecd\u53ef\u8bc6\u522b (contributed by @hongshuo-wang) (PR [#11852](https://github.com/t8y2/dbx/pull/11852))\n- \u865a\u8c37 Xugu \u652f\u6301 schema \u8303\u56f4\u7684\u5b57\u6bb5\u8840\u7f18\u5206\u6790 (contributed by @mapan0424) (PR [#11622](https://github.com/t8y2/dbx/pull/11622))\n- Redis \u5217\u8868\u63a8\u5165\u65f6\u53ef\u9009\u63d2\u5165\u961f\u5934 (LPUSH) \u6216\u961f\u5c3e (RPUSH) (contributed by @yangzidemuou) (PR [#11784](https://github.com/t8y2/dbx/pull/11784))\n- \u6807\u7