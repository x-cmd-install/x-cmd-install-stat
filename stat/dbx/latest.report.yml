c","site_admin":false},"content_type":"application/zip","state":"uploaded","size":36560896,"digest":"sha256:124124eb36ff98507bd90a17a1f422bafc41113f7c2f07b89d4d5bfc1ac9ff1c","download_count":53,"created_at":"2026-09-28T19:42:53Z","updated_at":"2026-09-28T19:42:55Z"},{"id":596307392,"node_id":"RA_kwDOSPdiBc4jiu3A","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":41286991,"digest":"sha256:cc5e2b420b09fdf40e52a9f0498dee6d1b5bd173f8426247ab4e8927ddde1b60","download_count":52,"created_at":"2026-09-28T20:10:41Z","updated_at":"2026-09-28T20:10:44Z"},{"id":596364131,"node_id":"RA_kwDOSPdiBc4ji8tj","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":19549,"digest":"sha256:eb92868b59bb7233bf1fa70d2cc8720255dea8e9796f6c58f4f6d0468f32321e","download_count":8406,"created_at":"2026-09-28T20:39:46Z","updated_at":"2026-09-28T20:39:46Z"}],"body":"### \u65b0\u529f\u80fd\n- \u65b0\u589e\u661f\u73af Transwarp Inceptor \u6570\u636e\u6e90\uff0c\u652f\u6301\u5143\u6570\u636e\u6d4f\u89c8\u3001SQL \u6267\u884c\u3001\u8868\u7ed3\u6784\u7f16\u8f91\u3001\u6570\u636e\u5bfc\u5165\u4e0e\u4f20\u8f93\uff0c\u5efa\u8868\u53ef\u914d\u7f6e\u5206\u533a\u3001\u5206\u6876\u3001\u5b58\u50a8\u683c\u5f0f\u4e0e\u4e8b\u52a1\u8868 (contributed by @HandSonic) (PR [#10521](https://github.com/t8y2/dbx/pull/10521))\n- \u4e91\u540c\u6b65\u65b0\u589e\u9009\u62e9\u6027\u5907\u4efd\u4e0e\u6062\u590d\uff0c\u8fde\u63a5\u4e0e SSH\u3001\u5171\u4eab\u96a7\u9053\u3001\u4fdd\u5b58\u7684 SQL\u3001\u4e2a\u4eba\u8bbe\u7f6e\u3001\u654f\u611f\u4fe1\u606f\u3001\u63d2\u4ef6\u6570\u636e\u548c\u5de5\u4f5c\u533a\u5e03\u5c40\u5747\u53ef\u6309\u9700\u52fe\u9009\u5907\u4efd\u6216\u6062\u590d (contributed by @ma123456mai) (PR [#10500](https://github.com/t8y2/dbx/pull/10500))\n- DuckDB \u8fde\u63a5\u7684\u8868\u5bfc\u5165\u65b0\u589e Parquet \u683c\u5f0f\uff0c\u53ef\u9884\u89c8\u5e76\u5bfc\u5165 Parquet \u6587\u4ef6 (contributed by @Abeautifulsnow) (PR [#10473](https://github.com/t8y2/dbx/pull/10473))\n- SQL \u6587\u4ef6\u5bfc\u51fa\u652f\u6301\u9009\u62e9\u5217\uff0c\u53ef\u53ea\u5bfc\u51fa\u90e8\u5206\u5b57\u6bb5\n- SQL \u5e93\u4e2d\u7684\u6587\u4ef6\u652f\u6301\u6279\u91cf\u4fee\u6539\u6240\u5c5e\u8fde\u63a5\u4e0e\u6570\u636e\u5e93\n- AI \u5bf9\u8bdd\u65b0\u589e\u72ec\u7acb\u5b57\u4f53\u8bbe\u7f6e\uff0c\u53ef\u5355\u72ec\u8c03\u6574\u4f1a\u8bdd\u5185\u5bb9\u5b57\u4f53\n- \u5185\u7f6e AI \u667a\u80fd\u4f53\u65b0\u589e Redis \u53ea\u8bfb\u5de5\u5177\uff0c\u53ef\u5728\u5bf9\u8bdd\u4e2d\u67e5\u8be2\u5df2\u8fde\u63a5 Redis \u7684\u6570\u636e (contributed by @Abeautifulsnow) (PR [#10510](https://github.com/t8y2/dbx/pull/10510))\n- \u63d2\u4ef6\u7684 MCP \u5de5\u5177\u53ef\u5728\u5185\u7f6e AI \u4e0e\u5916\u90e8 dbx MCP \u670d\u52a1\u5668\u4e2d\u9009\u7528\uff0c\u5916\u90e8\u670d\u52a1\u5668\u4ee5\u7edf\u4e00\u524d\u7f00\u66b4\u9732\u63d2\u4ef6\u5de5\u5177 (contributed by @jinpy666) (PR [#10376](https://github.com/t8y2/dbx/pull/10376))\n- \u7f16\u8f91\u5668\u6807\u7b7e\u9875\u6309\u8fde\u63a5\u663e\u793a\u989c\u8272\uff0c\u624b\u52a8\u914d\u7f6e\u7684\u8fde\u63a5\u989c\u8272\u4f18\u5148\uff0c\u672a\u914d\u7f6e\u65f6\u6309\u8fde\u63a5\u7a33\u5b9a\u751f\u6210 (contributed by @eryajf) (PR [#10529](https://github.com/t8y2/dbx/pull/10529))\n- \u7f16\u8f91\u5668\u65b0\u589e\u53cc\u51fb\u5b57\u7b26\u4e32\u9009\u62e9\u6a21\u5f0f\u8bbe\u7f6e\uff0c\u53ef\u9009\u300c\u6574\u6bb5\u5185\u5bb9\u300d\u6216\u300c\u5355\u4e2a\u5355\u8bcd\u300d (contributed by @zipg) (PR [#10424](https://github.com/t8y2/dbx/pull/10424))\n- \u6570\u636e\u8868\u7b5b\u9009\u6761\u4ef6\u7684\u503c\u8f93\u5165\u6846\u65b0\u589e\u6570