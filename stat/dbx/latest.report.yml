ba1\u3001\u8fde\u63a5\u540d\u79f0\u4e0e SQL \u5386\u53f2\uff0c\u53ef\u5728\u8bbe\u7f6e\u4e2d\u5207\u6362\u56de\u5de5\u4f5c\u533a\u6982\u89c8 (contributed by @eryajf) (PR [#10927](https://github.com/t8y2/dbx/pull/10927))\n- \u6807\u7b7e\u680f\u65b0\u589e\u6309\u8fde\u63a5\u3001\u6570\u636e\u5e93\u3001\u8868\u5206\u7ec4\u7684\u4e09\u5c42\u5c42\u7ea7\u6a21\u5f0f\uff0c\u5e76\u4fee\u590d\u591a\u5e93\u591a\u8868\u573a\u666f\u4e0b\u5c42\u7ea7\u8fde\u7ebf\u9519\u4e71\u7684\u95ee\u9898 (contributed by @eryajf) (PR [#10982](https://github.com/t8y2/dbx/pull/10982))\n- \u7ed3\u6784\u7f16\u8f91\u5668\u4e3a\u5b57\u6bb5\u7c7b\u578b\u548c\u5404\u7c7b\u7d22\u5f15\u542f\u7528\u7edf\u4e00\u914d\u8272\uff0c\u53f3\u952e\u5b57\u6bb5\u53ef\u76f4\u63a5\u521b\u5efa\u4e3b\u952e\u3001\u552f\u4e00\u3001\u5168\u6587\u7b49\u7d22\u5f15\uff0c\u65b0\u5efa MySQL \u7d22\u5f15\u81ea\u52a8\u4f7f\u7528\u7b80\u77ed\u7a33\u5b9a\u7684\u540d\u79f0 (contributed by @weekhy) (PR [#10974](https://github.com/t8y2/dbx/pull/10974))\n- Web \u6a21\u5f0f\u65b0\u589e\u9000\u51fa\u767b\u5f55\u6309\u94ae\uff0c\u5de5\u5177\u680f\u548c\u8bbe\u7f6e\u7684\u5b89\u5168\u533a\u57df\u5747\u53ef\u5b89\u5168\u9000\u51fa\u5f53\u524d\u4f1a\u8bdd (contributed by @lxk955) (PR [#11008](https://github.com/t8y2/dbx/pull/11008))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u5168\u90e8\u6298\u53e0\u548c\u5168\u90e8\u5c55\u5f00\u5feb\u6377\u952e\u3001\u5de5\u5177\u680f\u6309\u94ae\u4e0e\u53f3\u952e\u83dc\u5355\uff0c\u957f\u811a\u672c\u53ef\u4e00\u952e\u6536\u8d77\u5c55\u5f00 (contributed by @lxk955) (PR [#10990](https://github.com/t8y2/dbx/pull/10990))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u5207\u6362\u5927\u5c0f\u5199\u5feb\u6377\u952e\uff0c\u9996\u6b21\u8f6c\u4e3a\u5927\u5199\u3001\u518d\u6b21\u8f6c\u56de\u5c0f\u5199\uff0c\u5b57\u7b26\u4e32\u4e0e\u6ce8\u91ca\u5185\u5bb9\u4fdd\u6301\u4e0d\u53d8 (contributed by @lxk955) (PR [#11022](https://github.com/t8y2/dbx/pull/11022))\n- \u4ee3\u7801\u7247\u6bb5\u8865\u5168\u89e6\u53d1\u952e\u652f\u6301\u914d\u7f6e\u4e3a Tab\u3001\u7a7a\u683c\u6216\u4e24\u8005\u7686\u53ef (contributed by @lxk955) (PR [#11023](https://github.com/t8y2/dbx/pull/11023))\n- \u7f16\u8f91\u5668\u53f3\u952e\u83dc\u5355\u65b0\u589e\u6267\u884c\u8ba1\u5212\u5165\u53e3\uff0c\u683c\u5f0f\u5316 SQL \u5728\u9009\u4e2d\u6587\u672c\u65f6\u4ec5\u683c\u5f0f\u5316\u9009\u4e2d\u90e8\u5206 (contributed by @lxk955) (PR [#11017](https://github.com/t8y2/dbx/pull/11017))\n- \u4e3b\u9898\u81ea\u5b9a\u4e49\u65b0\u589e\u5f53\u524d\u884c\u3001\u9009\u533a\u3001\u5149\u6807\u3001\u884c\u53f7\u80cc\u666f\u7b49\u7f16\u8f91\u5668\u754c\u9762\u989c\u8272\u914d\u7f6e (contributed by @lxk955) (PR [#11005](https://github.com/t8y2/dbx/pull/11005))\n- \u6570\u636e\u8868\u683c\u6591\u9a6c\u7eb9\u80cc\u666f\u652f\u6301\u5728\u8bbe\u7f6e\u4e2d\u5173\u95ed\uff0c\u6062\u590d\u7edf\u4e00\u5e95\u8272\u663e\u793a (contributed by @lxk955) (PR [#10971](https://github.com/t8y2/dbx/pull/10971))\n- \u6570\u636e\u8868\u683c\u6591\u9a6c\u7eb9\u884c\u80cc\u666f\u989c\u8272\u652f\u6301\u81ea\u5b9a\u4e49 (contributed by @lxk955) (PR [#10868](https://github.com/t8y2/dbx/pull/10868))\n- \u65b0\u589e\u5355\u5143\u683c\u8be6\u60c5\u9ed8\u8ba4\u4ee5\u5f39\u7a97\u6253\u5f00\u7684\u8bbe\u7f6e\uff0c\u67e5\u770b\u957f JSON \u7b49\u5185\u5bb9\u4e0d\u518d\u53d7\u5206\u680f\u7a7a\u95f4\u9650\u5236 (contributed by @lxk955) (PR [#11021](https://github.com/t8y2/dbx/pull/11021))\n- \u53f3\u952e\u6267\u884c\u7684\u622a\u65ad\u8868\u3001\u6e05\u7a7a\u6570\u636e\u3001\u5220\u9664\u8868\u64cd\u4f5c\u73b0\u5728\u8bb0\u5f55\u5230 SQL \u6267\u884c\u5386\u53f2\uff0c\u5355\u4e2a\u4e0e\u6279\u91cf\u64cd\u4f5c\u5747\u8986\u76d6 (contributed by @lxk955) (PR [#11002](https://github.com/t8y2/dbx/pull/11002))\n- \u65b0\u589e\u8bbe\u7f6e\u63a7\u5236\u9ed8\u8ba4\u6570\u636e\u5e93\u662f\u5426\u56fa\u5b9a\u5728\u4fa7\u8fb9\u680f\u9876\u90e8\uff0c\u53ef\u6062\u590d\u6309\u5b57\u6bcd\u6392\u5e8f\u67e5\u627e (contributed by @lxk955) (PR [#10991](https://github.com/t8y2/dbx/pull/10991))\n\n### \u6539\u8fdb\n\n- \u7f16\u8f91\u5668\u7b49\u5bbd\u5b57\u4f53\u6808\u52a0\u5165\u4e2d\u6587\u5b57\u4f53\u56de\u9000\uff0cWindows \u4e0a\u4e2d\u6587\u4e0d\u518d\u56de\u9000\u4e3a\u5b8b\u4f53\u663e\u793a (contributed by @lxk955) (PR [#11012](https://github.com/t8y2/dbx/pull/11012))\n- \u683c\u5f0f\u5316 SQL \u540e\u4fdd\u6301\u5149\u6807\u4f4d\u7f6e\uff0c\u4e0d\u518d\u8df3\u8f6c\u5230\u6587\u6863\u5f00\u5934\n- \u7f16\u8f91\u5668\u5de5\u5177\u680f\u3001\u5e94\u7528\u5de5\u5177\u680f\u548c\u6570\u636e\u7f51\u683c\u7684\u6309\u94ae\u60ac\u505c\u63d0\u793a\u663e\u793a\u5bf9\u5e94\u5feb\u6377\u952e (contributed by @lxk955) (PR [#11018](https://github.com/t8y2/dbx/pull/11018))\n- \u5220\u9664\u884c\u7b49\u5371\u9669\u64cd\u4f5c\u786e\u8ba4\u5f39\u7a97\u9ed8\u8ba4\u805a\u7126\u786e\u8ba4\u6309\u94ae\uff0c\u53ef\u76f4\u63a5\u56de\u8f66\u786e\u8ba4 (contributed by @lxk955) (PR [#11014](https://github.com/t8y2/dbx/pull/11014))\n- Web \u6a21\u5f0f\u5de5\u5177\u680f\u5de6\u4e0a\u89d2\u663e\u793a DBX \u54c1\u724c\u6807\u8bc6 (contributed by @lxk955) (PR [#11011](https://github.com/t8y2/dbx/pull/11011))\n- DBX Web \u542f\u52a8\u5165\u53e3\u652f\u6301 -h \u548c --help \u67e5\u770b\u53ef\u7528\u9009\u9879\uff0c\u5e76\u8865\u5145 RUST_LOG \u65e5\u5fd7\u6392\u67e5\u6307\u5f15 (contributed by @eryajf) (PR [#10976](https://github.com/t8y2/dbx/pull/10976))\n- SQL \u6587\u4ef6\u5217\u8868\u6392\u5e8f\u8ddf\u968f\u4fa7\u8fb9\u680f\u8fde\u63a5\u987a\u5e8f\uff0c\u6309\u8fde\u63a5\u5b9a\u4f4d\u6587\u4ef6\u66f4\u76f4\u89c2\n\n### \u4fee\u590d\n\n- \u4fee\u590d Windows \u4e0a\u5378\u8f7d\u6216\u66f4\u65b0\u811a\u672c\u578b\u63d2\u4ef6\u65f6\u6d3e\u751f\u8fdb\u7a0b\u672a\u7ec8\u6b62\u5bfc\u81f4\u7684\u62d2\u7edd\u8bbf\u95ee\u9519\u8bef (os error 5) (contributed by @0verme) (PR [#10619](https://github.com/t8y2/dbx/pull/10619))\n- \u4fee\u590d\u9875\u9762\u5237\u65b0\u540e\u6062\u590d\u7684\u63d2\u4ef6\u5de5\u4f5c\u53f0\u6807\u7b7e\u9875\u505c\u7559\u5728\u9700\u8981\u91cd\u65b0\u52a