e_admin":false},"content_type":"application/zip","state":"uploaded","size":38465536,"digest":"sha256:84bb6307909d0913ea192a78767c4dd5311461106567ac6437e06b0a93f79616","download_count":51,"created_at":"2026-10-12T01:55:53Z","updated_at":"2026-10-12T01:55:55Z"},{"id":632417234,"node_id":"RA_kwDOSPdiBc4lsevS","name":"DBX_x64.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43233112,"digest":"sha256:8a5e647d479a28d7de2bc6152a2e6a3a421666ac8c8278cbc328b81148c418e0","download_count":58,"created_at":"2026-10-12T02:26:10Z","updated_at":"2026-10-12T02:26:13Z"},{"id":632451390,"node_id":"RA_kwDOSPdiBc4lsnE-","name":"latest.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":17466,"digest":"sha256:46f1aa6d1f4b93a4587dd798b7dc978ffae13be31728f2d0025a39649d2cd4e8","download_count":4437,"created_at":"2026-10-12T02:43:22Z","updated_at":"2026-10-12T02:43:22Z"}],"body":"### \u8d5e\u52a9\u4fe1\u606f\n\n- \u8d5e\u52a9\u4f19\u4f34 HiAPI \u5165\u9a7b\uff0c\u63d0\u4f9b\u56fe\u7247\u3001\u89c6\u9891\u3001\u97f3\u9891\u53ca\u6587\u672c\u6a21\u578b API\uff08GPT Image 2.5 \u7b49\uff09\uff0c\u65b0\u7528\u6237\u6ce8\u518c\u8d60 200 Credits\u3001\u5145\u503c\u9001 10% \u79ef\u5206\uff0c[\u6ce8\u518c\u5165\u53e3](https://www.hiapi.ai/invite/dbx?utm_source=dbx&utm_medium=affiliate&utm_campaign=backlink&utm_content=readme-zh)\n\n### \u65b0\u529f\u80fd\n\n- \u63d2\u4ef6\u5546\u5e97\u65b0\u589e\u8be6\u60c5\u6d4f\u89c8\u3001\u4f5c\u8005\u7b5b\u9009\u4ee5\u53ca\u5df2\u5b89\u88c5\u63d2\u4ef6\u7684\u5de5\u4f5c\u53f0\u5165\u53e3 (contributed by @eryajf) (PR [#11774](https://github.com/t8y2/dbx/pull/11774))\n- \u4fa7\u8fb9\u680f\u65b0\u589e\u6309\u5217\u540d\u548c\u6ce8\u91ca\u641c\u7d22\u6570\u636e\u5e93\u7ed3\u6784 (contributed by @1gcat) (PR [#11748](https://github.com/t8y2/dbx/pull/11748))\n- SQL \u7f16\u8f91\u5668\u65b0\u589e\u884c\u6eda\u52a8\u5feb\u6377\u952e\u3001\u7ed3\u679c\u96c6\u7a7a\u5217\u9690\u85cf\u4ee5\u53ca\u591a\u8bed\u53e5\u6267\u884c\u9519\u8bef\u4f4d\u7f6e\u6620\u5c04\n- \u7ed3\u679c\u96c6\u7b5b\u9009\u53d6\u503c\u652f\u6301\u76f4\u63a5\u4ece\u5f53\u524d\u9875\u83b7\u53d6\u5019\u9009\u503c (contributed by @lxk955) (PR [#11739](https://github.com/t8y2/dbx/pull/11739))\n- \u6570\u636e\u7f51\u683c\u751f\u6210\u503c\u65b0\u589e\u300c\u5f53\u524d\u65e5\u671f\u65f6\u95f4\uff08\u6beb\u79d2\uff09\u300d (contributed by @HighBigSky) (PR [#11659](https://github.com/t8y2/dbx/pull/11659))\n- \u67e5\u8be2\u7ed3\u679c\u9875\u7b7e\u5e03\u5c40\u4f18\u5316\uff0c\u5e76\u652f\u6301\u9f20\u6807\u4e2d\u952e\u5173\u95ed (contributed by @lxk955) (PR [#11744](https://github.com/t8y2/dbx/pull/11744))\n- \u4fa7\u8fb9\u680f\u641c\u7d22\u652f\u6301\u6309 Enter \u76f4\u63a5\u6253\u5f00\u9996\u4e2a\u5339\u914d\u9879 (contributed by @yiqiui) (PR [#11746](https://github.com/t8y2/dbx/pull/11746))\n- \u590d\u5236\u5c1a\u672a\u52a0\u8f7d\u5b8c\u6574\u7684\u7ed3\u679c\u96c6\u65f6\u4f1a\u7ed9\u51fa\u63d0\u793a (contributed by @yiqiui) (PR [#11752](https://github.com/t8y2/dbx/pull/11752))\n- SQL \u7f16\u8f91\u5668\u652f\u6301\u6309\u540d\u79f0\u6392\u9664\u6307\u5b9a\u81ea\u52a8\u8865\u5168\u9879 (contributed by @yiqiui) (PR [#11751](https://github.com/t8y2/dbx/pull/11751))\n- \u65b0\u5efa\u4e3b\u952e\u65f6\u652f\u6301\u81ea\u5b9a\u4e49\u4e3b\u952e\u540d\u79f0 (contributed by @yiqiui) (PR [#11768](https://github.com/t8y2/dbx/pull/11768))\n- \u7d22\u5f15\u5217\u9009\u62e9\u5668\u4e2d\u7684\u672a\u9009\u5217\u6309\u5b57\u6bcd\u6392\u5e8f\u5c55\u793a (contributed by @yiqiui) (PR [#11757](https://github.com/t8y2/dbx/pull/11757))\n- SQL \u6587\u4ef6\u6267\u884c\u5931\u8d25\u65f6\u652f\u6301\u5bfc\u51fa\u548c\u590d\u5236\u5931\u8d25\u8bed\u53e5\u8be6\u60c5 (contributed by @Abeautifulsnow) (PR [#11753](https://github.com/t8y2/dbx/pull/11753))\n- \u5206\u7ec4\u53f3\u952e\u83dc\u5355\u652f\u6301\u81ea\u5b9a\u4e49\u4e00\u7ea7\u64cd\u4f5c\u548c\u6392\u5e8f (contributed by @zipg) (PR [#11564](https://github.com/t8y2/dbx/pull/11564))\n- \u65b0\u589e PackyCode \u5408\u4f5c\u4f19\u4f34 AI \u670d\u52a1\u9884\u8bbe\n\n### \u6539\u8fdb\n\n- \u7d22\u5f15\u7f16\u8f91\u5668\u6e32\u67d3\u4e0e\u5217\u9009\u9879\u67e5\u8be2\u6027\u80fd\u4f18\u5316 (contributed by @lxk955) (PR [#11763](https://github.com/t8y2/dbx/pull/11763))\n\n### \u4fee\u590d\n\n- \u542f\u7528\u591a\u6570\u636e\u5e93\u7684 Valkey \u96c6\u7fa4\u73b0\u5728\u53ef\u4ee5\u6b63\u5e38\u663e\u793a\u548c\u64cd\u4f5c\u975e db0 \u7684\u903b\u8f91\u6570\u636e\u5e93 (contributed by @CN-Scars) (PR [#11776](https://github.com/t8y2/dbx/pull/11776))\n- Oracle \u5206\u7ec4\u67e5\u8be2\u4e0d\u518d\u56e0\u6ce8\u5165\u9690\u85cf ROWID \u5bfc\u81f4\u7b2c\u4e8c\u6b21\u6267\u884c\u62a5\u9519 (contributed by @lxk955) (PR [#11775](https://github.com/t8y2/dbx/pull/11775))\n- \u4fee\u590d OceanBase Oracle \u4e2d\u5bf9\u5305\u542b\u53cd\u659c\u6760\u7ed3\u5c3e\u5b57\u7b26\u4e32\u6216 q'\u2026' \u5b57\u9762\u91cf\u7684\u67e5\u8be2\u70b9\u51fb\u5217\u6392\u5e8f\u65f6\u4f1a\u8ffd\u52a0\u7b2c\u4e8c\u4e2a ORDER BY \u5bfc\u81f4\u62a5\u9519\u7684\u95ee\u9898 (contributed by @Tong-bit-art) (PR [#11771](https://github.com/t8y2/dbx/pull/11771))\n- \u8fbe\u68a6\u3001Oracle \u4e0e OceanBase Oracle \u7684\u53c2\u6570\u66ff\u6362\u548c\u53d8\u91cf\u5c55\u5f00\u4e0d\u518d\u8bef\u541e\u6570\u636e\u5e93\u94fe\u63a5\u548c SQL \u51fd\u6570\u6a21\u677f (contributed by @Grapexh) (PR [#11676](https://github.com/t8y2/dbx/pull/11676))\n- PostgreSQL \u8868\u7ed3\u6784\u7f16\u8f91\u5668\u652f\u6301\u4fee\u6539\u5217\u7684\u6807\u8bc6\u5c5e\u6027\uff08identity\uff09\u5e76\u751f\u6210\u5bf9\u5e94 ALTER \u8bed\u53e5 (contributed by @lxk955) (PR [#11756](https://github.com/t8y2/dbx/pull/11756))\n- SQL \u98ce\u9669\u626b\u63cf\u73b0\u5728\u4f1a\u6b63\u786e\u5904\u7406 PostgreSQL E'\u2026' \u8f6c\u4e49\u5b57\u7b26\u4e32 (contributed by @Tong-bit-art) (PR [#11759](https://github.com/t8y2/dbx/pull/11759))\n- SQL \u98ce\u9669\u626b\u63cf\u73b0\u5728\u4f1a\u626b\u63cf Oracle q'\u2026' \u66ff\u4ee3\u5f15\u7528\u5b57\u7b26\u4e32 (contributed by @Tong-bit-art) (PR [#11762](https://github.com/t8y2/dbx/pull/11762))\n- PostgreSQL/openGauss \u5386\u53f2\u7f16\u7801\u6587\u672c\u89e3\u7801\u5931\u8d25\u65f6\u4fdd\u7559\u539f\u6587\u5e76\u7ee7\u7eed\u67e5\u8be2\uff0c\u4e0d\u518d\u4f7f\u6574\u6761 SELECT \u5931\u8d25 (contributed by @zipg) (PR [#11647](https://github.com/t8y2/dbx/pull/11647))\n- Oracle JDBC \u8fde\u63a5\u51ed\u636e\u4e2d\u7684\u7279\u6b8a\u5b57\u7b26\u4e0d\u518d\u88ab\u7834\u574f (contributed by @zipg) (PR [#11612](https://github.com/t8y2/dbx/pull/11612))\n- \u6570\u636e\u7f51\u683c\u53ef\u9884\u89c8 Oracle BLOB \u5355\u5143\u683c\u4e2d\u4ee5\u6587\u672c\u5b58\u50a8\u7684\u5185\u5bb9 (contributed by @lxk955) (PR [#11750](https://github.com/t8y2/dbx/pull/11750))\n- \u901a\u8fc7 JDBC \u8fde\u63a5 SQL Server \u65f6\uff0c\u542b\u81ea\u5b9a\u4e49 schema \u7684\u6570\u636e\u5e93\u540c\u65f6\u5217\u51fa dbo \u7b49\u5185\u7f6e schema (contributed by @lxk955) (PR [#11077](https://github.com/t8y2/dbx/pull/11077))\n- \u4f20\u8f93\u5230 SQL Server \u65f6\u590d\u7528\u7684 DDL \u73b0\u5728\u4f1a\u91cd\u5b9a\u5411\u5230\u76ee\u6807 schema \u5e76\u4fee\u6b63\u6ce8\u91ca\u6240\u6709\u8005 (contributed by @dienaso) (PR [#11650](https://github.com/t8y2/dbx/pull/11650))\n- DuckDB \u591a\u8bed\u53e5\u62c6\u5206\u4e0d\u518d\u88ab Windows \u8def\u5f84\u5b57\u7b26\u4e32\u548c E'\u2026' \u5b57\u7b26\u4e32\u7834\u574f (contributed by @onenewcode) (PR [#11652](https://github.com/t8y2/dbx/pull/11652))\n- \u4ee5\u5206\u53f7\u7ed3\u5c3e\u7684 SQL \u4e2d GROUP BY / ORDER BY \u5f15\u7528\u6295\u5f71\u5217\u522b\u540d\u4e0d\u518d\u88ab\u8bef\u62a5\u4e3a Unknown colum