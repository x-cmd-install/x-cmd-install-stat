":"2026-10-29T16:34:14Z","updated_at":"2026-10-29T16:34:15Z"},{"id":689184218,"node_id":"RA_kwDOQuEzk84pFB3a","name":"lazykiq-0.2.0-windows-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6228398,"digest":"sha256:09354c203101f63fd21d2d671c332ecfa05d12416226f9e2d1f387e4357b9d80","download_count":0,"created_at":"2026-10-29T16:34:13Z","updated_at":"2026-10-29T16:34:14Z"},{"id":689184274,"node_id":"RA_kwDOQuEzk84pFB4S","name":"lazykiq-0.2.0-windows-arm64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":55380,"digest":"sha256:b20ee60dd6013f1cc4971f556e660f9dae236bd78cff890d569bc1eedb6cf571","download_count":0,"created_at":"2026-10-29T16:34:14Z","updated_at":"2026-10-29T16:34:14Z"},{"id":689184225,"node_id":"RA_kwDOQuEzk84pFB3h","name":"lazykiq-0.2.0-windows-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7175292,"digest":"sha256:1a192f5d76db7fa1265b7c4f9a0377cbd88f1873401aeec3d4f0fc9ae234786e","download_count":0,"created_at":"2026-10-29T16:34:13Z","updated_at":"2026-10-29T16:34:14Z"},{"id":689184280,"node_id":"RA_kwDOQuEzk84pFB4Y","name":"lazykiq-0.2.0-windows-x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":55421,"digest":"sha256:793fe735a7989c061e75e272d8bb4879e135c0a04c72bcd351f6291ed9a75ceb","download_count":0,"created_at":"2026-10-29T16:34:14Z","updated_at":"2026-10-29T16:34:15Z"}],"body":"Queue pausing, performance, stability improvements (oh my!) — all of that and more in today's release. Let's start with new features:\r\n\r\nYou can now **pause and resume queues** on Sidekiq Pro 7.3.5+ and compatible Enterprise versions. You can enable integrations with `--enable=pro` or `--enable=ent`. While paused queues are marked as such in read-only mode, you can pause/unpause in `--danger` mode after a confirmation. #171\r\n\r\nWhile searching, an animated **Searching...** status is displayed, and navigation is still responsive. If you leave the screen, the scan is canceled, and obsolete search results and errors are ignored. #170\r\n\r\nColors now follow terminal background changes across views, charts, bars, and open dialogs while preserving navigation, filters, and cursor blinking. Changes without a terminal notification are detected on the next five-second refresh. #194\r\n\r\n<img width=\"2540\" height=\"1742\" alt=\"CleanShot 2026-10-29 at 12 54 18 PM@2x\" src=\"https://github.com/user-attachments/assets/8dc7ee8c-6c0e-4bb3-9de3-f4d1dd63fb21\" />\r\n\r\nNow the boring stuff, which can be summarized as \"works snappier than it used to.\" I have generated this with Codex from pull requests, so to avoid unintentionally exposing you to AI-generated content, I am going to hide it. You were warned.\r\n\r\n<details><summary>AI-generated summary of performance and bug fixes</summary>\r\n\r\n## Performance\r\n\r\n- **Scrolling through jobs with large arguments:** table previews stop at 200 terminal columns, with complete arguments available in job details. For 75 jobs with 32 KiB arguments, vertical scrolling fell from **127 ms to 1.2 ms** and horizontal scrolling from **143 ms to 1.2 ms**. Building Busy rows for 75 jobs with 64 KiB arguments later fell from **60 ms to 1.8 ms**, with **97% fewer allocated bytes**, by stopping preview formatting once the visible text is ready. #169, #180\r\n- **Navigating loaded tables:** only visible rows are styled, and overlapping rows are reused when scrolling. With 22 rows visible, cursor movement took **65% less time for 75 loaded rows** and **97% less for 1,000 rows**. At 100,000 loaded rows, it fell from **75 ms to 0.021 ms**. Full data refreshes still inspect all loaded rows. #179\r\n- **Refreshing tables:** skip unnecessary column-width measurements and create padding only within the visible area. Separate 75-row benchmarks measured **28–30% less refresh time** for ordinary short values. In an extreme case with one 65,536-character value, refresh time fell from **153 ms to 2.4 ms**. #174, #183\r\n- **Reading large job properties:** wrap text once per job and panel width, then render visible lines. Wrapping a 4 KiB property fell from **8.4 ms to 0.027 ms**. Redrawing a prepared panel with 16 KiB arguments fell from **92 ms to 0.070 ms**. A pathological 64 KiB property that previously took **2.1 seconds** to wrap now takes about **0.44 ms**. #172\r\n- **Scrolling wide JSON:** jump directly to the visible part of long strings instead of repeatedly scanning their prefixes. Rendering an 80-column window within a 1 KiB string took **93% less time**. For a 1 MiB string, a middle-window redraw fell from **23 ms to 0.0017 ms**. Preparing the JSON now costs more time and retains additional indexing data, especially for Unicode. #181\r\n- **Browsing installations with many queues:** batch metadata requests and reuse their results while paging. With 1,000 registered empty queues, loading the queue list dropped from **2,001 Redis round trips to 11**, and local fetch time fell from **26 ms to 1.8 ms**. Paging continues to fetch current jobs and totals without refreshing every queue’s metadata. #175\r\n- **Opening the process picker:** fetch process information without downloading running jobs. With one process running 100 jobs containing 1 KiB arguments, fetch time fell from **0.55 ms to 0.042 ms**, with **99.6% fewer allocated bytes**. With 64 KiB arguments, it fell from **22 ms to 0.042 ms**. #182\r\n- **Grouping errors:** decode the fields needed for grouping without decoding unused arguments, context, or backtraces. Grouping 1,000 jobs with small arguments took **42% less time** and allocated **45% fewer bytes**. With 64 KiB arguments, time fell from **97 ms to 50 ms**. These measurements exclude Redis transfer and screen rendering. #176\r\n- **Reaching deep search results:** improve selection of later pages in Retries, Scheduled, Dead, and error groups while preserving ordering and exact totals. Fetching the last 100 of 100,000 matching jobs fell from **581 ms to 139 ms**; an error group spanning 100,000 dead and 100,000 retry jobs fell from **1.47 seconds to 0.50 seconds**. First-page time was essentially unchanged; searches still scan all matches. #184\r\n- **Redrawing Busy:** cache the process header and format only its visible rows. App sizing and rendering with 10 processes took **25% less time**. With 1,000 processes, it fell from **21 ms to 0.67 ms**. These measurements use an empty job list and exclude Redis requests. #185\r\n- **Redrawing charts between updates:** reuse Dashboard and Job Metrics charts until their data, size, or styles change. Replaying captured demo data at 120×30, with three simulated renders per polling interval, reduced rendering time by **82% for Dashboard** and **58% for Job Metrics**, with **86% and 60% fewer allocated bytes**. Job Metrics still redraws its charts on every detail reply; its savings come from renders between replies. #186\r\n- **Leaving Metrics:** release the previous data snapshot while preserving the selected period and filter. In a stress case with 10,000 job classes, additional retained heap after navigation fell from **3.7 MB to 336 bytes**. Returning to Metrics fetches fresh data. #187\r\n- **Using development logging with large payloads:** keep bounded previews instead of retaining complete Redis commands and results. A full 500-entry log containing 64 KiB commands retained **2.1 MB instead of 36.9 MB**; with 256 KiB commands, **2.1 MB instead of 135.2 MB**. Actual Redis values remain intact. Small entries can cost slightly more to store and format. #188\r\n- **Loading long Metrics periods:** process metric buckets in smaller batches. With 1,000 job classes, measured peak process memory fell from **38 MB to 21 MB for one hour**, and **189 MB to 21 MB for eight hours**, without a filter. The eight-hour query now uses **60 Redis round trips instead of one**; high-latency Redis connections were not measured. #178\r\n\r\n## Fixes\r\n\r\n- Keep Dashboard counters and navigation visible in short terminals, avoiding crashes when charts cannot fit. #173\r\n- Keep multiline errors within one table row and preserve complete Unicode characters and emoji in error previews. Horizontal scrolling through wide characters also keeps table columns and scrollbars aligned. #167, #174, #197\r\n- Prevent `End` and `$` from scrolling Unicode job JSON past its contents into an empty panel. #192\r\n- Restore paste handling and cursor blinking in filter and development-console inputs. #191\r\n- Keep the selected Busy process visible and preserve its selection when workers join, leave, or change position. Return to All when the selected process disappears. #185, #196\r\n- Open the job or queue selected when Enter was pressed, even if a refresh replaces the rows before navigation completes. This also prevents crashes when the source view has been cleared. #193\r\n- Keep scheduled fetches tied to their original filters, history ranges, and connections. #195\r\n- Retry Sidekiq version detection after canceled or failed Redis requests, and safely share discovery between concurrent requests. #190, #198\r\n\r\n## Maintenance\r\n\r\nUpdated Go to 1.27.3, Bubble Tea to 2.1.1, Bubbles to 2.2.1, ntcharts to 2.8.0, and go-redis to 9.23.0, alongside documentation, demo, build, and GitHub Actions dependencies. Bubble Tea now rejects implausible terminal-size reports, and command-line help uses refreshed neutral colors.\r\n\r\n</details>\r\n\r\n## Changelog\r\n\r\n* 8c82163acb51c557ddc4819f5dbcb4c8cb6df2e5: Fix docs build with Node 22 (@kpumuk)\r\n* d15646e9018a6a0466af5aa8e0ce77d9dc047513: Refresh build dependencies (@kpumuk)\r\n* aaf01cc5fa98044304a2b66a9805c04dec67a2e5: Declare website build dependency (@kpumuk)\r\n* 1640847e2200c2bd00649a3c85b2ec66d27acdbe: Build documentation in pull requests (@kpumuk)\r\n* e7e3c3989cc1c7ff3acad8cd90ec07c599b5d63c: Remove unused Changesets dependencies (@kpumuk)\r\n* d2b428084a197d98b2c4cccaaefc9773a4c63f19: Move CodeQL config to recommended path (@kpumuk)\r\n* 08436026ac506d516adf5c84c2ebae5c39037bc0: Fix Thulite 3 documentation builds (@kpumuk)\r\n* ed6466dd30e4e7cdb458759d7233d1ac8b435573: Install Dart Sass without an additional action (@kpumuk)\r\n* 10e91ee898d483192b091b8115dcbd54d82cac8c: Use shell for Dart Sass setup (@kpumuk)\r\n* 77c07ca40374be9966da96aa4703e325833f9f26: Keep Redis pipelines within shared connection limit (@kpumuk)\r\n* 0642b56a21babfe93b8abe7a6f7d78a165284547: Keep multiline error messages within table rows (@kpumuk)\r\n* 7976a996cb7a427eaab43764f20a31f23828a5e7: Upgrade Go toolchain to 1.27.3 (@kpumuk)\r\n* df8f6cb5120af1501f3f3d7883ed300911bcd400: Cap job table argument previews to keep scrolling responsive (@kpumuk)\r\n* cff9d746b89de261baa74b774227f0927c422b15: Keep job searches responsive and show search progress (@kpumuk)\r\n* 62c2813f9e604eebd6e90a38f18ff18183f3349f: Reject deferred search errors after request invalidation (@kpumuk)\r\n* f4cd35ee3cc4ad4c4b8fc359bf939274a837f8d5: Add opt-in Sidekiq Pro queue pause controls (@kpumuk)\r\n* 3ecf47682a320d8fed47567f8883555097967bc2: Keep job details responsive with large properties (@kpumuk)\r\n* 907870dea855f18438a610b2275d2f5f575d13c1: Render table padding within the horizontal viewport (@kpumuk)\r\n* 85450598a20b32e0afbf09b62678ad940ed7c60e: Prevent dashboard panics in short terminals (@kpumuk)\r\n* 0f6a83b010544a23545a8fc7fd54000fdfea7bc8: Batch queue metadata and reuse paging snapshots (@kpumuk)\r\n* 9608472c549784db6e94d10eff75c43fb875e0e5: Avoid redundant queue metadata refresh on entry (@kpumuk)\r\n* 3206e9ca3dab15512290e6823a3538ba99555565: Group errors without decoding unused job payloads (@kpumuk)\r\n* 329323619a832e4c349ac3a089bdbf8ce0833614: Define evidence requirements for pull requests (@kpumuk)\r\n* d60b65a8f306824ba8439d00b8989ba218f7d91f: Bound metrics bucket response memory (@kpumuk)\r\n* c8f01f76d85d7217069dce2fd6cf9ccb48e128fc: Render only visible table rows (@kpumuk)\r\n* f9e40b06952e5b11d036474fdf21664de33edb11: Budget table argument preview formatting (@kpumuk)\r\n* 1c1712539e90528d363ce5f6ec8ef9cba3c869de: Keep wide JSON rendering within the viewport (@kpumuk)\r\n* 0b1ad061869d58a80f086ce50d5df1c85cdffd0a: Verify JSON syntax colors during horizontal scroll (@kpumuk)\r\n* 6412ce76fca8081ac6019c5da2daf03e0fad7b47: Fetch process metadata without active jobs (@kpumuk)\r\n* 82be1c85c4b0f4708e281f4dd2bbe5ee8e6a0416: Skip width measurements for cells that already fit (@kpumuk)\r\n* 7af77335fd9649cd20ef9465abe798b71c278ca2: Bound filtered sorted-set page selection (@kpumuk)\r\n* 4017432c4c6633bf4127d1121bcbd9862e6fc4db: Cache the Busy process header (@kpumuk)\r\n* 034cae51c4a2102131663fcfcc921dba9c51183a: Cache unchanged chart output in owning views (@kpumuk)\r\n* 3b07a4e70b306824bdbe5f4262a06a0e08cdcc46: Require latest base before publishing pull requests (@kpumuk)\r\n* dbbedfebe3ce67595ba8182c73aad4f5df583618: Release Metrics snapshots after navigation (@kpumuk)\r\n* 731a3d0d3ceb08eef74576c2133d8df6f6aa0e57: Bound development log previews (@kpumuk)\r\n* f2394fce6bab2c9bf6d17e777eef49c6c3520a36: Keep mixed map preview ordering consistent (@kpumuk)\r\n* 42327dac924aa3421be96f8fdeb30610518c860a: Update Bubble Tea and CharmTone dependencies (@kpumuk)\r\n* a9e01836e32237b051180bf07b7a5898ed410a94: Snapshot selected rows before deferred detail navigation (@kpumuk)\r\n* 432bcc8860d603956460cf26c48476e6865a98b2: Retry failed Sidekiq version detection (@kpumuk)\r\n* 8e93529628c0814dbc2df75db55935d10cb1556f: Forward text input messages in dialogs (@kpumuk)\r\n* 4d78397dd826eb838729ee8812d1952c791acf46: Measure JSON scroll bounds in terminal cells (@kpumuk)\r\n* 937c02d1b2fa2860c3fe78a06a3535fd8b682054: Capture inputs before scheduling view fetches (@kpumuk)\r\n* 33a2d9b78c73704adecf317558027cbe3166f7d9: Preserve Busy process selection across refreshes (@kpumuk)\r\n* b6bc6aa005bd68ccb7e86140e2d2994484171906: Truncate error previews at whole graphemes (@kpumuk)\r\n* 3ecd3bcc973cb90c24506c46b9feb176cc5ee8fc: Synchronize shared Sidekiq version discovery (@kpumuk)\r\n* 29a41860a6419eb2157027d9cb60f1c8791520ee: Resolve terminal theme through Bubble Tea (@kpumuk)\r\n* b4069be900dfa021168a393e4cb31eefeb820803: Refresh themes on terminal appearance changes (@kpumuk)\r\n* 988b94c275c3a6983e5f2c39c489c38ae93ac494: Refresh themes after terminal config changes (@kpumuk)\r\n* dea6dfd2f0860de2e7c2fb775896b93a8d9969e9: Simplify theme style construction (@kpumuk)\r\n* a6d9f7b5f304c002fa04ef0396bbe7bdc0b35357: Restore Fang help and enable shell completion (@kpumuk)\r\n\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0},"mentions_count":1}
