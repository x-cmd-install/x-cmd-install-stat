afd65bf5a17d9645258e55afeb1db51cee0b9c014f42253ef4a28f01","download_count":45,"created_at":"2026-11-14T21:20:51Z","updated_at":"2026-11-14T21:20:52Z"},{"id":748809966,"node_id":"RA_kwDOQEkLn84soe7u","name":"worktrunk-x86_64-unknown-linux-musl.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":8418872,"digest":"sha256:d1e38cf36d8c14ef0682a6d6617f8a512b1a971feb3dfa437419d00136e19a3e","download_count":6682,"created_at":"2026-11-14T21:20:52Z","updated_at":"2026-11-14T21:20:52Z"},{"id":748809971,"node_id":"RA_kwDOQEkLn84soe7z","name":"worktrunk-x86_64-unknown-linux-musl.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":110,"digest":"sha256:89ce63bd2182e0521beec419546a4a9ad2ebe6b7e9c65a278474aed91e078fb0","download_count":2237,"created_at":"2026-11-14T21:20:52Z","updated_at":"2026-11-14T21:20:52Z"},{"id":748809989,"node_id":"RA_kwDOQEkLn84soe8F","name":"wt.rb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-ruby","state":"uploaded","size":2645,"digest":"sha256:fa2004fd4e5d5a71db90ffa16bae95789ee5c021a970355655e2dc6940ef9b37","download_count":8,"created_at":"2026-11-14T21:20:52Z","updated_at":"2026-11-14T21:20:52Z"}],"body":"## Release Notes\n\n### Improved\n\n- **Backups before forced removal**: `wt remove --force` snapshots the worktree, including untracked files, to `refs/wt-backup/<branch>` and prints a recovery command. Ignored files, changes inside submodules, and separate staged versions are excluded. A failed backup stops removal; an unreadable status still permits removal without one. [Docs](https://worktrunk.dev/remove/#force-flags) ([#4545](https://github.com/max-sixty/worktrunk/pull/4545), thanks @yajo for [#4544](https://github.com/max-sixty/worktrunk/issues/4544))\n\n- **Codex activity hooks ship separately**: skills stay in `worktrunk`; activity hooks move to `worktrunk-markers`, so skill updates don't trigger hook reapproval. (Breaking: existing installs need `codex plugin add worktrunk-markers@worktrunk` to retain activity markers after updating.) [Docs](https://worktrunk.dev/claude-code/#codex) ([#4707](https://github.com/max-sixty/worktrunk/pull/4707), thanks @win5do for [#4654](https://github.com/max-sixty/worktrunk/issues/4654))\n\n- **Claude Code `/wt-diff` pane**: shows the branch diff for worktrees the session has worked in, including work detected from subagents. Failed worktree lookups are retried, and tool errors reach Claude's hook diagnostics. [Docs](https://worktrunk.dev/claude-code/#wt-diff-pane-claude-code-only) ([#4638](https://github.com/max-sixty/worktrunk/pull/4638), [#4668](https://github.com/max-sixty/worktrunk/pull/4668), [#4689](https://github.com/max-sixty/worktrunk/pull/4689), thanks @rudycelekli and @Yash2031v)\n\n- **Shell completion**: typing `wt switch origin/` completes that remote's branches. Hook names honor per-project user overrides and source-qualified filters; completion honors `-C`, `--config`, config overrides, and alias precedence over executables on PATH. PowerShell filters suggestions by the typed prefix. ([#4613](https://github.com/max-sixty/worktrunk/pull/4613), [#4549](https://github.com/max-sixty/worktrunk/pull/4549), [#4551](https://github.com/max-sixty/worktrunk/pull/4551), [#4548](https://github.com/max-sixty/worktrunk/pull/4548), [#4560](https://github.com/max-sixty/worktrunk/pull/4560), [#4721](https://github.com/max-sixty/worktrunk/pull/4721), thanks @Bortlesboat, and @thernstig for [#4612](https://github.com/max-sixty/worktrunk/issues/4612))\n\n- **JSON survives later failures**: commands retain confirmed results when a later step fails, while diagnostics go to stderr and the exit status signals failure. `wt switch --format=json` emits one result after execution. List schema 1 reports the tracked remote branch when its name differs locally. ([#4345](https://github.com/max-sixty/worktrunk/pull/4345), [#4574](https://github.com/max-sixty/worktrunk/pull/4574), [#4584](https://github.com/max-sixty/worktrunk/pull/4584), [#4756](https://github.com/max-sixty/worktrunk/pull/4756))\n\n- **Removal feedback**: failures describe the surviving checkout and branch. `--delete-branch` is visible in help as the override for `delete-branch = false`, and the picker briefly confirms successful `Alt-x` removal. ([#4457](https://github.com/max-sixty/worktrunk/pull/4457), [#4615](https://github.com/max-sixty/worktrunk/pull/4615), [#4669](https://github.com/max-sixty/worktrunk/pull/4669), thanks @Yash2031v for the picker feedback and @cazador481 for [#4614](https://github.com/max-sixty/worktrunk/issues/4614))\n\n- **Fewer repeated Git operations**: committing skips the second staging pass when no pre-commit hook ran; concurrent list tasks share identical ahead/behind counts. ([#4540](https://github.com/max-sixty/worktrunk/pull/4540), [#4663](https://github.com/max-sixty/worktrunk/pull/4663))\n\n### Fixed\n\n- **Copying ignored files**: `.worktreeinclude` can select paths inside wholly ignored directories, such as `.cache/types/`. Copy and promotion also enforce destination containment before creating directories or moving files. ([#4751](https://github.com/max-sixty/worktrunk/pull/4751))\n\n- **Foreground cancellation**: signal handling closes races around child startup and completion, so Ctrl-C stops subsequent command steps. On Unix, `wt step tether` stops its supervised processes on interruption and now propagates a command's failure status. ([#4596](https://github.com/max-sixty/worktrunk/pull/4596), [#4609](https://github.com/max-sixty/worktrunk/pull/4609), [#4623](https://github.com/max-sixty/worktrunk/pull/4623), [#4598](https://github.com/max-sixty/worktrunk/pull/4598), thanks @drldavis for [#4622](https://github.com/max-sixty/worktrunk/issues/4622))\n\n- **Hook execution and feedback**: unselected templates no longer cause errors or consume arguments. Filtered background hooks retain independent user and project pipelines, and template failures identify the command. Background hooks running in different directories receive separate announcements. ([#4429](https://github.com/max-sixty/worktrunk/pull/4429), [#4781](https://github.com/max-sixty/worktrunk/pull/4781))\n\n- **Config loading**: rejected environment overrides warn and fall back to file settings consistently across commands; unreadable config files are reported instead of silently ignored. System-config deprecations point to the file that needs editing. ([#4358](https://github.com/max-sixty/worktrunk/pull/4358), [#4564](https://github.com/max-sixty/worktrunk/pull/4564), [#4767](https://github.com/max-sixty/worktrunk/pull/4767))\n\n- **State values**: clearing a key removes all repeated values. Branch-local reads and clears exclude variables belonging to branches whose names extend with `.vars.*`. State tables preserve literal pipes, links, and formatting characters. ([#4566](https://github.com/max-sixty/worktrunk/pull/4566), [#4779](https://github.com/max-sixty/worktrunk/pull/4779), [#4780](https://github.com/max-sixty/worktrunk/pull/4780))\n\n- **Log and terminal handling**: authentication-probe output is redacted from diagnostics; Unix logs use private permissions, and permission repair leaves symlink targets unchanged. Commit subjects, PR context, and list summaries escape terminal control characters. ([#4604](https://github.com/max-sixty/worktrunk/pull/4604), [#4611](https://github.com/max-sixty/worktrunk/pull/4611), [#4605](https://github.com/max-sixty/worktrunk/pull/4605), [#4730](https://github.com/max-sixty/worktrunk/pull/4730))\n\n- **SSH remotes with a non-default port**: port-less legacy project IDs no longer supply approvals or project settings to a different SSH server. Those repositories need port-qualified approvals and project overrides. ([#4606](https://github.com/max-sixty/worktrunk/pull/4606))\n\n- **Removal with submodules**: text-mode removal warns about submodule commits reachable from no remote; the warning does not prevent removal. Orphan cleanup preserves fsmonitor daemons serving live submodules. ([#4460](https://github.com/max-sixty/worktrunk/pull/4460), [#4729](https://github.com/max-sixty/worktrunk/pull/4729))\n\n- **Fork branch conflicts and GitHub Enterprise**: GitLab and Azure DevOps use a prefixed, fetch-only branch when a fork's branch name conflicts locally. GitHub Enterprise PR lookup uses the remote’s host, or a supplied PR URL’s host, when `gh` is authenticated there. ([#4542](https://github.com/max-sixty/worktrunk/pull/4542), [#4710](https://github.com/max-sixty/worktrunk/pull/4710), [#4722](https://github.com/max-sixty/worktrunk/pull/4722), thanks @anqorithm, and @pgilad-rna for [#4709](https://github.com/max-sixty/worktrunk/issues/4709))\n\n- **Azure DevOps remotes**: collection-prefixed URLs, legacy SSH URLs, and URLs omitting the project segment resolve the correct project for links and CI lookup. ([#4764](https://github.com/max-sixty/worktrunk/pull/4764), thanks @owpac for [#4763](https://github.com/max-sixty/worktrunk/issues/4763))\n\n- **Shell integration**: directory changes preserve trailing spaces, and PowerShell treats paths containing brackets literally. Installation continues configuring other shells after an rc-file error; uninstall matches recognized standalone setup lines and leaves customized lines for manual removal. ([#4608](https://github.com/max-sixty/worktrunk/pull/4608), [#4680](https://github.com/max-sixty/worktrunk/pull/4680), [#4583](https://github.com/max-sixty/worktrunk/pull/4583), [#4595](https://github.com/max-sixty/worktrunk/pull/4595), thanks @dajiaohuang for the PowerShell fix and @lucasfonte21 for [#4582](https://github.com/max-sixty/worktrunk/issues/4582))\n\n- **Agent plugins**: Claude's worktree-switching skill leaves the current worktree session before entering another by path. On Windows, Pi, oh-my-pi, and OpenCode select Worktrunk rather than Windows Terminal's `wt`; Claude activity markers are written without launching another `wt`. ([#4714](https://github.com/max-sixty/worktrunk/pull/4714), [#4698](https://github.com/max-sixty/worktrunk/pull/4698), [#4619](https://github.com/max-sixty/worktrunk/pull/4619), thanks @tian-yu200 for [#4697](https://github.com/max-sixty/worktrunk/issues/4697))\n\n- **Branch markers**: deleting a branch through Worktrunk or creating it with `wt switch --create` clears its marker, so reused names don't inherit stale activity. Clearing all markers preserves a state variable named `marker`. ([#4684](https://github.com/max-sixty/worktrunk/pull/4684), [#4704](https://github.com/max-sixty/worktrunk/pull/4704), [#4528](https://github.com/max-sixty/worktrunk/pull/4528), thanks @wsgavin for [#4683](https://github.com/max-sixty/worktrunk/issues/4683))\n\n- **List and picker display**: headers use `@` for HEAD and `^` for the default branch. Variation-selector emoji align; IPv6-only loopback servers are detected; the footer shows task progress; stale refreshes cannot overwrite removal layout. ([#4682](https://github.com/max-sixty/worktrunk/pull/4682), [#4694](https://github.com/max-sixty/worktrunk/pull/4694), [#4620](https://github.com/max-sixty/worktrunk/pull/4620), [#4708](https://github.com/max-sixty/worktrunk/pull/4708), [#4732](https://github.com/max-sixty/worktrunk/pull/4732), thanks @nixpulvis for [#4727](https://github.com/max-sixty/worktrunk/issues/4727), @saltcoffee for the IPv6 fix and @NorfeldtKnowit for [#4681](https://github.com/max-sixty/worktrunk/issues/4681))\n\n- **Numeric custom columns**: list-column validation accepts `int` and `float` filters on `vars.*` and `git.branch.*` values. ([#4775](https://github.com/max-sixty/worktrunk/pull/4775), thanks @adrian-gierakowski for [#1983](https://github.com/max-sixty/worktrunk/issues/1983))\n\n- **Linux process cleanup**: `wt remove --reap` discovers process working directories through `/proc`, avoiding a timed-out system-wide `lsof` scan. ([#4631](https://github.com/max-sixty/worktrunk/pull/4631), thanks @OmerFarukOruc for [#4630](https://github.com/max-sixty/worktrunk/issues/4630))\n\n- **Aliases and custom commands**: named aliases can be inspected outside a repository; project aliases display migrated template variables. Custom-command discovery excludes non-executable entries. ([#4547](https://github.com/max-sixty/worktrunk/pull/4547), [#4690](https://github.com/max-sixty/worktrunk/pull/4690), [#4565](https://github.com/max-sixty/worktrunk/pull/4565))\n\n- **Fixes for unusual setups**: slash-named remotes work in branch inventory; same-named tags don't affect the push range; non-UTF-8 environment entries no longer panic config loading; invalid alias arguments cannot fall through to a PATH executable; failed Git ref queries propagate as errors. ([#4271](https://github.com/max-sixty/worktrunk/pull/4271), [#4499](https://github.com/max-sixty/worktrunk/pull/4499), [#4563](https://github.com/max-sixty/worktrunk/pull/4563), [#4550](https://github.com/max-sixty/worktrunk/pull/4550), [#4562](https://github.com/max-sixty/worktrunk/pull/4562), thanks @Duang777)\n\n### Documentation\n\n- **Claude desktop worktrees**: clarifies that the desktop app skips the plugin’s worktree hooks, so its worktree sessions bypass Worktrunk. [Docs](https://worktrunk.dev/claude-code/#worktree-isolation-claude-code-and-opencode) ([#4777](https://github.com/max-sixty/worktrunk/pull/4777), thanks @chatoo2412 for [#4776](https://github.com/max-sixty/worktrunk/issues/4776))\n\n- **Interactive browser demo**: a [Try it page](https://worktrunk.dev/try-it/) runs Worktrunk in a browser workspace. ([#4280](https://github.com/max-sixty/worktrunk/pull/4280), [#4546](https://github.com/max-sixty/worktrunk/pull/4546), [#4579](https://github.com/max-sixty/worktrunk/pull/4579), [#4581](https://github.com/max-sixty/worktrunk/pull/4581), thanks @kooler)\n\n- **Guides and examples**: guides explain shortened list counts and the default base branch for Claude’s hook-created worktrees. Skill anchors and site icon links are repaired; the move-changes alias stops if stashing or restoring fails. ([#4575](https://github.com/max-sixty/worktrunk/pull/4575), [#4576](https://github.com/max-sixty/worktrunk/pull/4576), [#4688](https://github.com/max-sixty/worktrunk/pull/4688), [#4678](https://github.com/max-sixty/worktrunk/pull/4678), [#4770](https://github.com/max-sixty/worktrunk/pull/4770), [#4751](https://github.com/max-sixty/worktrunk/pull/4751), [#4719](https://github.com/max-sixty/worktrunk/pull/4719), thanks @viwe-monai)\n\n### Internal\n\n- **Temporary-index cleanup** reclaims abandoned scratch indexes while owner locks protect active operations, including removal backups. ([#4469](https://github.com/max-sixty/worktrunk/pull/4469), thanks @jonah-osmo)\n\n- **Breaking Rust library changes**: public types and function signatures changed; downstream crates need to update for 0.82.0.\n\n## Install worktrunk 0.82.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-installer.sh | sh && wt config shell install\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-installer.ps1 | iex\"; git-wt config shell install\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install worktrunk && wt config shell install\n```\n\n## Download worktrunk 0.82.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [worktrunk-aarch64-apple-darwin.tar.xz](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-aarch64-apple-darwin.tar.xz.sha256) |\n| [worktrunk-x86_64-apple-darwin.tar.xz](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-x86_64-apple-darwin.tar.xz.sha256) |\n| [worktrunk-x86_64-pc-windows-msvc.zip](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-x86_64-pc-windows-msvc.zip.sha256) |\n| [worktrunk-aarch64-unknown-linux-musl.tar.xz](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [worktrunk-x86_64-unknown-linux-musl.tar.xz](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/max-sixty/worktrunk/releases/download/v0.82.0/worktrunk-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n\n\n### Install via Cargo\n\n```sh\ncargo install worktrunk && wt config shell install\n```\n\n### Install via Winget (Windows)\n\n```sh\nwinget install max-sixty.worktrunk && git-wt config shell install\n```\n\n### Install via AUR (Arch Linux)\n\n```sh\nparu worktrunk-bin && wt config shell install\n```\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":25}
