{"id":247469521,"author":{"login":"ZeroSumQuant","id":164113542,"node_id":"U_kgDOCcgshg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOwbw7M4OwBXR","tag_name":"v1.1.2","target_commitish":"main","name":"v1.1.2 - Fixed Preview Extraction & Enhanced Display","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-09-16T00:30:39Z","updated_at":"2025-09-16T00:30:48Z","published_at":"2025-09-16T00:24:40Z","assets":[],"body":"## \ud83c\udf89 Claude Conversation Extractor v1.1.2\n\n### \ud83d\udd25 Critical Fixes from v1.1.1\n\n**v1.1.1 has been yanked** - it was published without the latest fixes. v1.1.2 includes all intended improvements.\n\n### \u2728 What's New\n- **Fixed preview extraction** - Now correctly shows actual user messages, not system/assistant messages\n- **Enhanced conversation display** - Shows ALL conversations by default with:\n  - \ud83d\udcac Message counts\n  - \ud83d\udcdd Preview of first real user message  \n  - \ud83d\udcc5 Timestamps\n  - \ud83d\udcbe File sizes\n- **Improved search** - Fixed arrow key handling that was inserting weird characters\n- **Better file organization** - Clean project structure\n\n### \ud83d\udc1b Bug Fixes\n- Fixed preview showing \"extractor is running...\" instead of user messages\n- Fixed preview showing \"This session is being continued...\" (Claude's system messages)\n- Fixed arrow keys in real-time search (macOS compatibility)\n- Fixed command conflicts with old projects\n- Resolved 'claude-logs not found' issues\n- Now properly skips system messages to find real user queries\n\n### \ud83d\udce6 Installation\n```bash\npipx install claude-conversation-extractor\n```\n\n### \ud83d\ude80 Quick Start\n```bash\nclaude-start      # Interactive UI with real-time search\nclaude-extract    # CLI mode - now shows all conversations\nclaude-search     # Direct search command\nclaude-logs       # Still works for backward compatibility\n```\n\nFull changelog: https://github.com/ZeroSumQuant/claude-conversation-extractor/compare/v1.1.0...v1.1.2"}
