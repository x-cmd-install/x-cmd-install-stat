te off `ci`, and guard it out of CI (#2146) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2167\r\n* chore(web): extract App.tsx's connection lifecycle into useConnectionLifecycle by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2169\r\n* feat(web): use the Ace JSON editor everywhere, and restore the raw-JSON toggle by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2170\r\n* chore(web): extract App.tsx's server commands into useServerCommands by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2173\r\n* fix: say why a never-acknowledged subscriptions/listen ended, instead of retrying it eight times by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2176\r\n* fix(web): surface failed resource subscribe/unsubscribe by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2179\r\n* fix(web): refuse a raw-JSON tool argument the schema would retype by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2175\r\n* fix(scripts): give the render-smoke overlap test room for process startup by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2178\r\n* test(scripts): anchor the render-smoke overlap paint to the parent's clock by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2181\r\n* chore(web): collapse InspectorView's prop wall into domain bundles by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2182\r\n* fix: cancel a Streamable HTTP call by closing its stream (#2140) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2185\r\n* feat(auth): revoke OAuth tokens at the authorization server on clear (RFC 7009) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2186\r\n* fix(auth): accept RFC 8414 metadata served at the OIDC well-known path by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2184\r\n* fix(core): r