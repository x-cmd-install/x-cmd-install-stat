{"id":427040973,"author":{"login":"cliffhall","id":871933,"node_id":"MDQ6VXNlcjg3MTkzMw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM7KEns4ZdCDN","tag_name":"2.13.0","target_commitish":"main","name":"2.13.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-28T18:29:12Z","updated_at":"2026-10-28T19:30:54Z","published_at":"2026-10-28T18:41:38Z","assets":[],"body":"## Security: Node.js runtime advisories (October 2026)\n\nOn October 20, 2026, eMudhra disclosed that the private keys for eight of its intermediate CA certificates could be recovered from the public certificates. On October 21, Node.js shipped [security releases](https://nodejs.org/en/blog/vulnerability/october-2026-security-releases) that update its bundled CA certificates for the compromise. The same releases fix several unrelated high-severity runtime CVEs, including DNS name truncation, TLS hostname checks on non-canonical IP addresses, and an out-of-bounds write in the Brotli decoder.\n\n**How this release stands**\n\n- **The Inspector relies on the Node.js runtime for certificate checks.** It ships no CA certificates of its own and doesn't opt into the system trust store. Every HTTPS connection it makes, to MCP servers and to OAuth discovery and token endpoints, is verified by the Node.js it runs on.\n- **The Docker image needs no action.** `ghcr.io/modelcontextprotocol/inspector:2.13.0` runs Node.js **22.23.4**, a patched release, and contains no system CA store.\n- **This release also updates two of its own dependencies past published advisories:** `undici` (#2812) and `fast-uri` (#2820).\n\n**If you run the Inspector from npm (`npx` or a global install)**\n\nIt runs on your Node.js, which we can't update for you. Please run Node.js **22.23.4, 24.22.1 or 26.12.1, or later**, and check with `node --version`. The package's `engines` field still accepts Node.js 22.19.0 and up, so npm won't warn you about an older, unpatched runtime. Node.js 20 and earlier are end-of-life, get no fix, and aren't supported by Inspector v2.\n\n## What's Changed\n* feat(cli): --load-max-error-rate / --load-max-p99 thresholds set the exit code by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2787\n* feat(cli): --load-connections spreads a load run over many sessions by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2791\n* fix(auth): keep a static client's SEP-2352 issuer stamp across saves and restarts by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2794\n* docs(skills): document the v1 release procedure and advisory-fork merge constraints by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2785\n* feat(scripts): release:notes --advisory lists GHSA fixes and credits their reporters by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2788\n* test(cli): isolate the suite's default catalog from ~/.mcp-inspector by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2793\n* chore(web): restrict the dev Vite server's CORS to the configured origins by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2789\n* Warn on non-loopback web binds and document the token's access-control boundary by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2790\n* fix(auth): read a DCR secret stamped for another client as absent (#2768) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2792\n* feat(cli): carry 429 retry timing in the CLI and mcpdo error envelopes by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2795\n* feat(web): sort the Tools list by displayed label (#2782) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2798\n* feat(mcpdo): add tools/call --load on the shared load engine by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2786\n* fix(web): keep a failed connect's reason on the server card (#2783) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2801\n* chore(cli): migrate the CLI bundle from tsup to tsdown by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2803\n* fix: guard OAuth destinations against link-local and metadata addresses in every client by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2796\n* chore(deps): upgrade the MCP TypeScript SDK to 2.4.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2799\n* chore(build): migrate the web runner, mcpdo and TUI bundles from tsup to tsdown by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2807\n* feat(mcpdo): --load-connections and --load-max-* thresholds for tools/call --load by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2806\n* chore(skills): take SEP-2640 constants and schemas from the SDK, move the rest to core/extension/skills by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2808\n* feat(auth): opt-in scope on OAuth token refresh via scopeForRefresh (Entra AADSTS90009) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2809\n* Release 2.13.0 step 1: audit fixes and bump to 2.13.0 on v2/main by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2815\n* fix(core): a deliberate disconnect no longer ends in \"error\" (#2817) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2819\n* fix(deps): update fast-uri to 3.1.9 past four moderate advisories (#2820) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2821\n* chore(release): merge v2/main into main for v2.13.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2818\n\n\n**Full Changelog**: https://github.com/modelcontextprotocol/inspector/compare/2.12.0...2.13.0\n**Smoke test ledger for milestone branch**: [v2/chore/milestone-merge-v2.13.0](https://claude.ai/artifact/UZDd4FNgaqTKq4AuBAgGhz)\n\n## Thanks for helping us improve\n\nThis release addresses issues reported by these community members. Thank you for taking the time to file them:\n\n* @aurelium (#2782)\n* @tarun-amagian (#2783)\n\n","mentions_count":3}
