{"id":449737225,"author":{"login":"cliffhall","id":871933,"node_id":"MDQ6VXNlcjg3MTkzMw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM7KEns4aznIJ","tag_name":"2.16.0","target_commitish":"main","name":"2.16.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-18T09:04:15Z","updated_at":"2026-11-18T14:37:45Z","published_at":"2026-11-18T09:08:03Z","assets":[],"body":"## What's Changed\r\n* Key a budget-declined pattern to its own schema by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2969\r\n* Show the target rate in a stepped --load run's text header by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2970\r\n* Add a v1 npm deprecate step to the release skill by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2968\r\n* Validate against the schema passed in, not the first registered under its $id by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2974\r\n* mcpdo: keep the sign-in helper's failure classification without a TTY (#2962) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2971\r\n* Add a showcase config that broadcasts resource updates for --load-subscribe by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2972\r\n* TUI: keep the test and roots forms inert under a pending request overlay by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2975\r\n* Add an opt-in per-server HTTP cookie jar for sticky sessions (#2936) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2976\r\n* mcpdo: run the daemon test suites on Windows over named pipes by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2977\r\n* Absorb a re-raised interrupt still in flight when a --load run ends (#2973) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2978\r\n* feat(web): mirror SEP-2792 _meta acceptLanguage to upstream Accept-Language by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2988\r\n* feat(core): mirror SEP-2792 acceptLanguage on every Streamable HTTP send by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2990\r\n* Cap SSE line and event size on every SDK transport stream (GHSA-3xgv-mvj6-g78r) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2997\r\n* fix(core): cap SSE line length and event size on every SDK transport stream (v2) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2993\r\n* Release 2.16.0 step 1: bump version to 2.16.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3001\r\n* chore(release): merge v2/main into main for v2.16.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3006\r\n\r\n\r\n**Full Changelog**: https://github.com/modelcontextprotocol/inspector/compare/2.15.0...2.16.0\r\n**Release ledger for milestone branch**: [v2/chore/milestone-merge-v2.16.0](https://claude.ai/artifact/3PTpgwspmJPvXvMg4k55bh)\r\n\r\n## Known issue\r\n\r\n**npm audit reports GHSA-fc5q-39xc-vjpf (picomatch ReDoS, `<= 4.0.7`), which has no patched release yet.** In the published package it is reached only through `vite`, which the Inspector uses for `--web --dev`, and the globs it matches come from developer configuration rather than from MCP servers or the network. Every other package `npm audit` flags is flagged only through picomatch. We will take a fixed picomatch as soon as one is published ([#3000](https://github.com/modelcontextprotocol/inspector/issues/3000)).\r\n\r\n## Thanks for helping us improve\r\n\r\nThis release addresses issues and vulnerabilities reported by these community members. Thank you for taking the time to report them:\r\n\r\n* @CloneOfAlex (#2934, #2935)\r\n* @lizexinxin (#2936)\r\n* @SamMorrowDrums (#2979)\r\n* @SounLabs (GHSA-3xgv-mvj6-g78r)\r\n","mentions_count":5}
