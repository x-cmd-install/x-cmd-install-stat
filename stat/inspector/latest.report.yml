{"id":406431304,"author":{"login":"cliffhall","id":871933,"node_id":"MDQ6VXNlcjg3MTkzMw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM7KEns4YOaZI","tag_name":"2.10.1","target_commitish":"main","name":"2.10.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-08T05:02:46Z","updated_at":"2026-10-08T05:12:32Z","published_at":"2026-10-08T05:05:05Z","assets":[],"body":"## Why The Patch?\r\nThe addition of the new `mcpdo` client threw a curveball into the default `npx @modelcontextprotocol/inspector@latest` method of running the inspector, because there were now two binaries to run, the `launcher` (used by the other clients) and `mcpdo`. This quick follow-up patch restores sanity so that command works again. Instructions for launching new `mcpdo` client are on `README.md`.\r\n\r\n## What's Changed\r\n* fix(package): restore npx @modelcontextprotocol/inspector with an inspector bin alias by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2652\r\n* chore(release): 2.10.1 step 1 \u2014 audit, bump to 2.10.1 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2655\r\n* docs(publishing): list pack:verify's npm default-bin check by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2659\r\n* chore(release): merge v2/main into main for v2.10.1 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2657\r\n\r\n\r\n**Full Changelog**: https://github.com/modelcontextprotocol/inspector/compare/2.10.0...2.10.1\r\n**Smoke test ledger for milestone branch**: [v2/chore/milestone-merge-v2.10.1](https://claude.ai/artifact/NKoqS9ANaGb6Yx5ANPdcdU)\r\n","mentions_count":1}
