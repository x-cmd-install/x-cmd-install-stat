{"id":412336816,"author":{"login":"cliffhall","id":871933,"node_id":"MDQ6VXNlcjg3MTkzMw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM7KEns4Yk8Kw","tag_name":"2.11.0","target_commitish":"main","name":"2.11.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-14T04:24:06Z","updated_at":"2026-10-14T04:26:29Z","published_at":"2026-10-14T04:26:29Z","assets":[],"body":"## What's Changed\n* docs(pr-flow): always start work in a new git worktree by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2663\n* chore(deps): upgrade the MCP TypeScript SDK to 2.3.1 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2665\n* fix(gate-lease): key the lock on a fixed per-user path, not TMPDIR by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2664\n* test(web): bind the auto-open server to :0 instead of probing a free port by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2669\n* fix(cli): refresh write-back updates the fresh on-disk entry by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2666\n* fix(smoke): run the Firefox pass in the Playwright container on macOS 27 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2662\n* fix(auth): carry stripped-namespace secrets over before purging (#2630) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2671\n* docs(agents): pace bulk GitHub writes under the secondary rate limit by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2673\n* fix(auth): pass empty fallbacks to joinSnapshot in updateOAuthServerEntry by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2685\n* fix(remote): relay upstream HTTP status so auto era falls back on a 400 probe by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2684\n* feat(web): hide 'Run as task' on modern-era connections by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2687\n* fix(web): keep every monitoring-sidebar entry inside its column (#2675) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2688\n* chore(pack:verify): assert skills/mcpdo ships and drive an mcpdo tool call by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2679\n* docs(skills): fix test-servers' path to ensure-test-servers.mjs (#2523) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2678\n* test(web): isolate integration OAuth state from ~/.mcp-inspector (#2670) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2677\n* fix(mcpdo): route connections and OAuth through HTTPS_PROXY / HTTP_PROXY by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2686\n* fix(web): one-line warning when the browser opener cannot start by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2689\n* fix(auth): don't treat a plain 403 without WWW-Authenticate as an OAuth challenge by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2690\n* fix(tui): delete copy-to-file temp files when the TUI exits by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2692\n* fix(tui): Esc clears a kept list filter before exiting by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2693\n* fix(web): re-read the viewed skill file on a skills/get fetch (#2516) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2694\n* fix(launcher): print the version for --version / -V in every mode by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2695\n* fix(mcpdo): restore a fresh OAuth-flow lock instead of deleting it on a lost steal by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2696\n* docs(release): drive mcpdo in the milestone smoke by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2697\n* fix(skills): name each client's own catalog-budget remedies by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2698\n* fix(auth): apply endpoint overrides when the AS publishes no metadata by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2691\n* fix(cli): call a taskSupport: required tool via the task path by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2699\n* fix(cli): keep the stdio target when an option precedes it by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2704\n* fix(cli): exit quietly when --completion's reader closes early by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2700\n* fix(cli): -q suppresses the --output \"Wrote N bytes\" status line by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2702\n* fix(cli,mcpdo,tui): name each client's own remedy on a connect timeout by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2703\n* fix(cli): refuse a URL that contradicts a positional command or --transport stdio by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2701\n* fix(tui): show the Inspector version in the header by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2706\n* feat(web): show tool/prompt/resource counts in list headers and Connection Info by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2708\n* feat(web): form rows for array-of-object tool inputs by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2707\n* chore(scripts): guard the file set each coverage run measures (#2709) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2711\n* chore(deps): October dependency refresh (#2557) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2710\n* fix(install): strip npm_config_allow_scripts from the per-client installs by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2713\n* chore(deps): deny esbuild/fsevents install scripts; guard unreviewed ones by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2714\n* chore: bump version to 2.11.0 (#2716) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2717\n* chore(release): merge v2/main into main for v2.11.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2720\n\n\n**Full Changelog**: https://github.com/modelcontextprotocol/inspector/compare/2.10.1...2.11.0\n**Smoke test ledger for milestone branch**: [v2/chore/milestone-merge-v2.11.0](https://claude.ai/artifact/XYJcbYMQtrufXjUtcsy63y)\n\n## Thanks for helping us improve\n\nThis release addresses issues reported by these community members. Thank you for taking the time to file them:\n\n* @ashokjayaprakash (#2561)\n* @axel-codebear (#2562)\n* @ivan-kovatchev (#2660)\n* @jhelm (#2518)\n* @revetkn (#2515)\n* @Rohit496 (#2607)\n* @roli-lpci (#2523)\n* @symdeb (#2516)\n* @v0ropaev (#2611)\n","mentions_count":10}
