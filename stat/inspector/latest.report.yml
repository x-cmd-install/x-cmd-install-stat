{"id":434552082,"author":{"login":"cliffhall","id":871933,"node_id":"MDQ6VXNlcjg3MTkzMw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM7KEns4Z5r0S","tag_name":"2.14.0","target_commitish":"main","name":"2.14.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T22:56:35Z","updated_at":"2026-11-04T23:55:33Z","published_at":"2026-11-04T23:55:33Z","assets":[],"body":"## What's Changed\r\n\r\n### Security fixes\r\n\r\n2.14.0 fixes three vulnerabilities reported privately against v2. Upgrade with `npx @modelcontextprotocol/inspector@latest`. One of them, GHSA-2fw8-7jmw-r937, also affects the deprecated v1 line, where it is fixed in 1.0.4 (`@v1-latest`).\r\n\r\n* **An MCP App can no longer navigate its sandbox frame away from the policy it was given.** The proxy enforces a frame policy built from the app's approved CSP grants. When the frame starts to leave the document the host loaded, it closes the relay and removes the frame, and it tells the host why. ([GHSA-h9j8-vj8g-v3gg](https://github.com/modelcontextprotocol/inspector/security/advisories/GHSA-h9j8-vj8g-v3gg))\r\n* **server.json import shows the exact command before it is saved**, and rejects a package with an invalid or empty environment-variable name or unsafe tokens. **URL elicitations open only http(s) URLs.** Any other scheme is refused, with a reason. **The HTML preview's CSP now precedes all document markup.** ([GHSA-rwv7-mh2c-ff2p](https://github.com/modelcontextprotocol/inspector/security/advisories/GHSA-rwv7-mh2c-ff2p))\r\n* **Server-supplied schema patterns are checked in bounded time.** Tool output and app elicitation schemas use a linear-time matcher with per-pattern and per-schema limits. A pattern beyond those limits is reported as unverified instead of being evaluated. ([GHSA-2fw8-7jmw-r937](https://github.com/modelcontextprotocol/inspector/security/advisories/GHSA-2fw8-7jmw-r937))\r\n\r\n### Upgrading\r\n\r\n* **The Node floor is now `^22.23.4 || ^24.22.1 || >=26.12.1`**, the October 2026 Node security releases (#2822). npm prints `EBADENGINE` on older versions. The field is advisory, so the Inspector still runs.\r\n* **`--load` latency now counts successful calls only.** `latencyMs` and the `--load-max-p99` gate cover successful calls only, failed calls are reported separately as `errorLatencyMs`, and tool-error text is now shown (#2836). If no call succeeds, `--load-max-p99` fails with a message saying there is no p99 to check.\r\n\r\n### Other changes\r\n\r\n* docs(skills): allow full advisory details on the GHSA draft card by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2857\r\n* chore: raise Node floor to the Oct 2026 security releases; bump vitest, happy-dom, ext-apps, ip-address by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2852\r\n* fix: reap the backend session (and stdio child) when a web tab closes or reloads by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2853\r\n* fix(core): OAuth callback listener acts only on this flow's state by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2854\r\n* fix(load): partial summary on Ctrl+C, circuit breaker, success-only latency, dropped rate slots by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2855\r\n* fix: nine small defects from the v2.13 review (#2827) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2856\r\n* fix(docker): probe /healthz over https when the web UI serves TLS by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2848\r\n* fix(mcpdo): fail connections/list and MRU inference on an over-limit socket path by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2849\r\n* fix(tui): one-line list rows keep the selection in view; Windows-safe save-queue test by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2850\r\n* chore(release): bump version to 2.14.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2864\r\n* fix(mcpdo): name a connection_lost abort instead of tallying [object Object] by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2868\r\n* fix(mcpdo): refuse a connection daemon from another release by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2871\r\n* chore(release): merge v2/main into main for v2.14.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2867\r\n* fix: harden server.json import review, URL elicitation scheme, and preview CSP injection by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2876\r\n* fix(web): stop an MCP App navigating its sandbox frame elsewhere by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2875\r\n* fix(core): evaluate server-supplied schema patterns in bounded time (v2) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2877\r\n* chore(release): merge v2/main into main for the v2.14.0 security fixes by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/2882\r\n\r\n\r\n**Full Changelog**: https://github.com/modelcontextprotocol/inspector/compare/2.13.0...2.14.0\r\n**Smoke test ledger for milestone branch**: [v2/chore/milestone-merge-v2.14.0](https://claude.ai/artifact/4TfnRPjxJDedDzQNArH6ma)\r\n\r\n## Thanks for helping us improve\r\n\r\nThis release addresses issues and vulnerabilities reported by these community members. Thank you for taking the time to report them:\r\n\r\n* @CloneOfAlex (#2824, #2825, #2826, #2827, #2834, #2835, #2836, #2837, #2843, #2847, GHSA-h9j8-vj8g-v3gg)\r\n* @Sonica-B (#2810)\r\n* @3099404236 (GHSA-rwv7-mh2c-ff2p)\r\n* @KillerX345 (GHSA-2fw8-7jmw-r937)\r\n\r\n","mentions_count":5}
