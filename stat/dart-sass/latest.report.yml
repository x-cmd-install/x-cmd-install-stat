","updated_at":"2026-09-12T07:50:02Z"},{"id":558859245,"node_id":"RA_kwDOBFHeo84hT4Pt","name":"dart-sass-1.104.1-windows-x64.zip","label":"","uploader":{"login":"sassbot","id":25648076,"node_id":"MDQ6VXNlcjI1NjQ4MDc2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4777390,"digest":"sha256:b1d51698b28a952ef8c9ad7f6c32f5c0f9a05c7989da37562297c092b770a034","download_count":737,"created_at":"2026-09-12T07:50:02Z","updated_at":"2026-09-12T07:50:02Z"}],"body":"To install Sass 1.104.1, download one of the packages below and [add it to your PATH][], or see [the Sass website][] for full installation instructions.\n\n[add it to your PATH]: https://katiek2.github.io/path-doc/\n[the Sass website]: https://sass-lang.com/install\n\n# Changes\n\n* Fix a bug where loud comments before `@use` rules could be emitted multiple times under certain circumstances.\n\n* Fix a bug in which an invalid selector at the end of an indented syntax stylesheet would cause the parser to crash instead of emitting a useful error message.\n\n### Command Line Interface\n\n* Many-to-many compilations no longer compile any files that appear in the output directory if the output directory is also within the source directory. This fixes a bug where `--watch` mode could enter an infinite loop recompiling the same CSS file over and over.\n\n* Sass now sets the modification time of output files to the time compilation *started* rather than the time it *ended*. This ensures that, if a source file is modified during compilation, `--watch` and `--update` mode will recompile the outputs to include the new source file contents.\n\nSee the [full changelog](https://github.com/sass/dart-sass/blob/master/CHANGELOG.md#11041) for changes in earlier releases.","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0}}
