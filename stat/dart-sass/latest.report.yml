dated_at":"2026-10-21T22:03:39Z"},{"id":663918067,"node_id":"RA_kwDOBFHeo84nkpXz","name":"dart-sass-1.106.1-windows-x64.zip","label":"","uploader":{"login":"sassbot","id":25648076,"node_id":"MDQ6VXNlcjI1NjQ4MDc2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4800406,"digest":"sha256:a6e5bf97187af4a175279eabb6316af597d6e4b06ec2099ae961dc553655d8e1","download_count":359,"created_at":"2026-10-21T22:03:38Z","updated_at":"2026-10-21T22:03:39Z"}],"body":"To install Sass 1.106.1, download one of the packages below and [add it to your PATH][], or see [the Sass website][] for full installation instructions.\n\n[add it to your PATH]: https://katiek2.github.io/path-doc/\n[the Sass website]: https://sass-lang.com/install\n\n# Changes\n\n* Fix a bug where an attribute selector with an empty value (such as `[class=\"\"]`) would crash when serializing.\n\n* Don't crash when serializing a number with an empty unit. This is only possible through the JavaScript and Dart APIs or the embedded protocol.\n\n### Embedded Dart Sass\n\n* More robustly convert invalid value errors into `PARAMS` errors.\n\nSee the [full changelog](https://github.com/sass/dart-sass/blob/master/CHANGELOG.md#11061) for changes in earlier releases."}
