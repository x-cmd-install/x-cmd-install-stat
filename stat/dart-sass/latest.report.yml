ated_at":"2026-10-28T22:18:36Z"},{"id":686523281,"node_id":"RA_kwDOBFHeo84o64OR","name":"dart-sass-1.107.0-windows-x64.zip","label":"","uploader":{"login":"sassbot","id":25648076,"node_id":"MDQ6VXNlcjI1NjQ4MDc2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4811692,"digest":"sha256:e46229fa38b617d348648cc9cb2693e7fe23f6260869d6e11d4e62da91acad8f","download_count":113,"created_at":"2026-10-28T22:18:35Z","updated_at":"2026-10-28T22:18:36Z"}],"body":"To install Sass 1.107.0, download one of the packages below and [add it to your PATH][], or see [the Sass website][] for full installation instructions.\n\n[add it to your PATH]: https://katiek2.github.io/path-doc/\n[the Sass website]: https://sass-lang.com/install\n\n# Changes\n\n### Command-Line Interface\n\n* The `--fatal-deprecation` flag can now exclude deprecations that would otherwise be included by passing a version number. To exclude a deprecation, add `-` before its name. For example, `--fatal-deprecation=1.107.0,-import` includes all deprecations that were present in Dart Sass 1.107.0 *except* for the `@import` deprecation.\n\n* The `--fatal-deprecation` flag now takes the special value `dart-sass-2`, which treats as fatal all deprecations that will become fatal in Dart Sass 2.0.0.\n\n### JavaScript API\n\n* `Options.fatalDeprecations` can now take a `DeprecationSelectorDifference` object of the form `{include: ..., except: ...}`, where the `include` field lists deprecations to mark fatal (which can be version numbers) and the `except` field lists deprecations *not* to mark fatal. The `except` field takes precedence over `include`.\n\n* Add a (non-enumerable) `sass.deprecations.dartSass2` property which can be passed to `Options.fatalDeprecations` to mark as fatal exactly the deprecations that will become fatal in Dart Sass 2.0.0. This can be combined with other deprecations or used in a `DeprecationSelectorDifference` to modify exactly which deprecations it covers.\n\n* Passing a version number beyond the current Dart Sass version to `Options.fatalDeprecations` is now deprecated. See [the Sass website](https://sass-lang.com/d/deprecation-version) for details.\n\n### Dart API\n\n* Add a `Deprecation.dartSass2` property which returns exactly the set of deprecations that will become fatal in Dart Sass 2.0.0.\n\n* Passing a version number beyond the current Dart Sass version to `Deprecation.forVersion` is now deprecated.\n\n### Embedded Protocol\n\n* Add a `CompileRequest.fatal_deprecation_except` field which excludes deprecations from being considered fatal if they would have been enabled by `CompileRequest.fatal_deprecation`.\n\nSee the [full changelog](https://github.com/sass/dart-sass/blob/master/CHANGELOG.md#11070) for changes in earlier releases."}
