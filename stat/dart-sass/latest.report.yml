53Z","updated_at":"2026-09-22T17:33:54Z"},{"id":581898721,"node_id":"RA_kwDOBFHeo84irxHh","name":"dart-sass-1.105.0-windows-x64.zip","label":"","uploader":{"login":"sassbot","id":25648076,"node_id":"MDQ6VXNlcjI1NjQ4MDc2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4784370,"digest":"sha256:720463a7c0554641e17239e6b359f24fa5c5bc10776c25236e29c45416ddff07","download_count":528,"created_at":"2026-09-22T17:33:54Z","updated_at":"2026-09-22T17:33:54Z"}],"body":"To install Sass 1.105.0, download one of the packages below and [add it to your PATH][], or see [the Sass website][] for full installation instructions.\n\n[add it to your PATH]: https://katiek2.github.io/path-doc/\n[the Sass website]: https://sass-lang.com/install\n\n# Changes\n\n* Add support for first-class modules. These can be accessed using the new `meta.load()` and `meta.get-module()` functions, and may be passed as the `$module` argument to numerous eisting `sass:meta` functions.\n\n* Add the `meta.css()` mixin, which includes CSS from a first-class module.\n\n### JS API\n\n* Add a `SassModule` class and a corresponding `Value.assertModule()` method.\n\n### Dart API\n\n* Add a `SassModule` class and a corresponding `Value.assertModule()` method.\n\nSee the [full changelog](https://github.com/sass/dart-sass/blob/master/CHANGELOG.md#11050) for changes in earlier releases."}
