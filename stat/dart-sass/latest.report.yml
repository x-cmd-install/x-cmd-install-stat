pdated_at":"2026-09-03T23:33:02Z"},{"id":543481114,"node_id":"RA_kwDOBFHeo84gZN0a","name":"dart-sass-1.104.0-windows-x64.zip","label":"","uploader":{"login":"sassbot","id":25648076,"node_id":"MDQ6VXNlcjI1NjQ4MDc2","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4776714,"digest":"sha256:86762db57859b67ac733d7c2822ad47d09489309aed6cbe02ab69152169ed527","download_count":440,"created_at":"2026-09-03T23:33:01Z","updated_at":"2026-09-03T23:33:02Z"}],"body":"To install Sass 1.104.0, download one of the packages below and [add it to your PATH][], or see [the Sass website][] for full installation instructions.\n\n[add it to your PATH]: https://katiek2.github.io/path-doc/\n[the Sass website]: https://sass-lang.com/install\n\n# Changes\n\n* **Potentially breaking compatibility fix:** Colors now convert the special values NaN and negative zero, as well as infinity and negative infinity for polar-hue channels, to 0 as per the CSS spec.\n\n* The special value negative zero is now serialized as `-0` instead of `0` for greater compatibility when using it in CSS calculations.\n\nSee the [full changelog](https://github.com/sass/dart-sass/blob/master/CHANGELOG.md#11040) for changes in earlier releases."}
