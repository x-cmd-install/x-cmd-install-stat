{"id":312397379,"author":{"login":"devanbenz","id":22461703,"node_id":"MDQ6VXNlcjIyNDYxNzAz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOFT2qP84Sns5D","tag_name":"v2.8.0","target_commitish":"main","name":"v2.8.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-04-22T18:55:12Z","updated_at":"2026-04-24T21:01:18Z","published_at":"2026-04-24T21:01:18Z","assets":[],"body":"## v2.8.0 [2026-04-22]\r\n----------------------\r\n\r\nIn addition to the list of changes below, please also see the [official release notes] (https://docs.influxdata.com/influxdb/v2/reference/release-notes/influx-cli/#v280) for other important information about this release.\r\n\r\n\r\n### Bug Fixes\r\n\r\n- [929952d](https://github.com/influxdata/influx-cli/commit/929952d): Rename package to influxdb2-cli\r\n- [3a2e139](https://github.com/influxdata/influx-cli/commit/3a2e139): Check for all available cookies instead of the count\r\n- [467d545](https://github.com/influxdata/influx-cli/commit/467d545): Don't import non-existent/unused GPG private key\r\n- [3a37835](https://github.com/influxdata/influx-cli/commit/3a37835): Supply \"VERSION\" and \"COMMIT\" to Makefile\r\n- [9db72b0](https://github.com/influxdata/influx-cli/commit/9db72b0): Create errors-file if it does not exist\r\n- [cea19bf](https://github.com/influxdata/influx-cli/commit/cea19bf): Avoid panic on empty tag value\r\n- [4d6fac2](https://github.com/influxdata/influx-cli/commit/4d6fac2): Dbrp correct json output\r\n- [8cdf401](https://github.com/influxdata/influx-cli/commit/8cdf401): Update fingerprint\r\n\r\n### Features\r\n\r\n- [bdb9324](https://github.com/influxdata/influx-cli/commit/bdb9324): Add `--operator-token` flag to restore subcommand\r\n- [de93ca0](https://github.com/influxdata/influx-cli/commit/de93ca0): Adds gzip compression level configuration to backups for v2\r\n\r\n### Other\r\n\r\n- [8a2499f](https://github.com/influxdata/influx-cli/commit/8a2499f): Chore: update to go 1.20.3\r\n- [b7eacf9](https://github.com/influxdata/influx-cli/commit/b7eacf9): Chore: use remote package signing\r\n- [a187815](https://github.com/influxdata/influx-cli/commit/a187815): Chore: make sure .exe is on windows builds\r\n- [e2e7fcf](https://github.com/influxdata/influx-cli/commit/e2e7fcf): Build(deps): bump golang.org/x/text from 0.3.7 to 0.3.8\r\n- [c73d46e](https://github.com/influxdata/influx-cli/commit/c73d46e): Chore: update MacOS executor to M1\r\n- [08605a3](https://github.com/influxdata/influx-cli/commit/08605a3): Build(deps): bump google.golang.org/protobuf from 1.30.0 to 1.33.0\r\n- [938f6a4](https://github.com/influxdata/influx-cli/commit/938f6a4): Chore: upgrade to go 1.21.12\r\n- [cf80a73](https://github.com/influxdata/influx-cli/commit/cf80a73): Chore: upgrade GoLang to 1.22.11\r\n- [ba62e03](https://github.com/influxdata/influx-cli/commit/ba62e03): Chore(CI): add \"influxdata-archive-keyring\" package\r\n- [80776b8](https://github.com/influxdata/influx-cli/commit/80776b8): Chore(ci): use supported macOS runner\r\n- [4180737](https://github.com/influxdata/influx-cli/commit/4180737): Chore: update to go 1.25.7\r\n- [7285c37](https://github.com/influxdata/influx-cli/commit/7285c37): Ci: strip release binaries\r\n- [e8ca87e](https://github.com/influxdata/influx-cli/commit/e8ca87e): Chore: update to go 1.25.9\r\n"}
