ated_at":"2026-11-24T20:06:15Z","updated_at":"2026-11-24T20:06:20Z"},{"id":788665543,"node_id":"RA_kwDOPYoUTM4vAhTH","name":"openspec-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":45271143,"digest":"sha256:27bdeaa7dde5842a34bc66734665b455abd93250d26f3e225b7a45a77442ac32","download_count":219,"created_at":"2026-11-24T20:06:16Z","updated_at":"2026-11-24T20:06:19Z"},{"id":788665865,"node_id":"RA_kwDOPYoUTM4vAhYJ","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":754,"digest":"sha256:35968096b649af7bb6a694e5be95b20a74ab57f0717e5c161273f32f5a3e95bf","download_count":610,"created_at":"2026-11-24T20:06:21Z","updated_at":"2026-11-24T20:06:37Z"}],"body":"## What's New in v2.2.0\n\n**OpenSpec now has a skill router.** Type `/openspec`, say what you want, and the router picks the right OpenSpec skill and runs it.\n\n## How to upgrade\n\nRun `openspec update`. The update adds the `openspec` router skill and changes no other skill.\n\n### New: the `/openspec` skill router\n\n- **One command for everything** - `/openspec` accepts any OpenSpec request in plain words. In Codex the command is `$openspec`.\n- **The router picks the skill** - You no longer need to know which of the 12 workflow skills to call.\n- **The router answers questions** - Ask \"where does add-auth stand?\" and the router checks your project, then tells you the status and the next step.\n- **The router runs several steps in order** - Ask \"verify add-auth, then archive it\" and the router runs both skills, pausing wherever a step needs your approval.\n- **Every existing skill still works** - `/openspec-propose` and the other 11 skills keep their names, their tab completion and their behavior.\n- **Every profile gets the router** - Core and custom profiles both install the router, and `openspec config profile` does not list it because the router is not a workflow you choose.\n\n### New: reference files for skills\n\n- **A skill can now ship a `references/` folder** - The folder sits next to `SKILL.md` and holds detail the agent opens only when a task needs it.\n- **The router is the first skill with references** - `openspec init` and `openspec update` install, refresh and remove reference files together with their skill.\n\n### Improved\n\n- **`openspec update` repairs reference files** - A reference file that was deleted or edited is restored on the next `openspec update`.\n\n### Fixed\n\n- **Windows install no longer fails on a locked file** - The install script now retries for up to five seconds when Windows still has the new `openspec.exe` locked.\n\n**Full Changelog**: https://github.com/Fission-AI/OpenSpec/compare/v2.1.1...v2.2.0\n"}
