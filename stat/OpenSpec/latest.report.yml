ated_at":"2026-10-30T23:47:38Z","updated_at":"2026-10-30T23:47:40Z"},{"id":693785699,"node_id":"RA_kwDOPYoUTM4pWlRj","name":"openspec-windows-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":45093128,"digest":"sha256:da1685e290857f10503f02995973078df681ec3a2f859c83b6b4d3b6261b3062","download_count":43,"created_at":"2026-10-30T23:47:38Z","updated_at":"2026-10-30T23:47:40Z"},{"id":693785732,"node_id":"RA_kwDOPYoUTM4pWlSE","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":754,"digest":"sha256:6cc4af0875c3fb58a0e1ca1dc02873a976c6c9b811585d59f47d3c647ec76bf7","download_count":90,"created_at":"2026-10-30T23:47:41Z","updated_at":"2026-10-30T23:47:41Z"}],"body":"## What's New in v1.16.0\n\nInstall from openspec.dev, catch more spec mistakes in `validate`, and a new Node.js floor for npm installs.\n\n### Breaking\n\n- **Node.js 22.12.0 or newer for npm installs** - Node 20 reached end-of-life on April 30, 2026. The standalone binary, the default install since v1.15.0, doesn't use Node, and Homebrew installs and manages its own Node. If you can't upgrade, switch to the standalone binary: `curl -fsSL https://openspec.dev/cli/install.sh | sh` (Windows: `irm https://openspec.dev/cli/install.ps1 | iex`).\n\n### New\n\n- **Install from openspec.dev** - `curl -fsSL https://openspec.dev/cli/install.sh | sh` (Windows: `irm https://openspec.dev/cli/install.ps1 | iex`). Release files are now `.tar.gz` archives (`.zip` on Windows).\n- **Scenario step check** - `openspec validate` warns when a `Scenario:` has no WHEN/GIVEN step or no THEN step, in change deltas and main specs. Plain `validate` and `archive` are unchanged; `--strict` fails on it.\n- **Store suggestion** - When a command finds no OpenSpec root and you have registered stores, the error names the store whose id matches your repo's `origin` name, with the `--store` flag and `store:` line that select it. It only suggests; it never picks a store for you.\n\n### Fixed\n\n- **Invalid config.yaml** - `openspec validate` now exits 1 when `openspec/config.yaml` can't be read or isn't valid YAML, instead of passing while every rule in it is ignored. Other commands still warn and carry on.\n- **zsh completion with ZDOTDIR** - `openspec completion install zsh` writes to `$ZDOTDIR/.zshrc` when `ZDOTDIR` is an absolute path, the file zsh actually reads. If completion never worked for you, run the install again. `completion uninstall zsh` also cleans up a block an earlier install left in `~/.zshrc`.\n- **Inline code fences** - A line starting with triple-backtick inline code (```` ```npm test``` ````) no longer opens a phantom code fence that hid every requirement after it.\n- **Unspaced headers** - `validate` now reports duplicate or misplaced main-spec requirements written as `###Requirement:`, matching how archive reads them.\n\n## New Contributors\n\n* @micromagicman made their first contribution in https://github.com/Fission-AI/OpenSpec/pull/2077\n* @IvanFeric made their first contribution in https://github.com/Fission-AI/OpenSpec/pull/2107\n* @artemasmith made their first contribution in https://github.com/Fission-AI/OpenSpec/pull/2079\n\n**Full Changelog**: https://github.com/Fission-AI/OpenSpec/compare/v1.15.0...v1.16.0\n","reactions":{"total_count":3,"+1":2,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
