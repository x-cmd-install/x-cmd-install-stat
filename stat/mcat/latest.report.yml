bel":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":9255024,"digest":"sha256:0baa8362643a112be3cc848c41e5dd0434d4d04b9ffdca685f8d9584f02fd7a4","download_count":4,"created_at":"2026-08-29T17:55:29Z","updated_at":"2026-08-29T17:55:30Z"},{"id":535540328,"node_id":"RA_kwDOOZW7eM4f67Jo","name":"mcat_0.6.5_arm64.deb.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:f86ab840566d4eb0c899c618e4d145ca61882490d6594f2d9433184d9d8780ba","download_count":3,"created_at":"2026-08-29T17:55:29Z","updated_at":"2026-08-29T17:55:29Z"}],"body":"## Changelog\n\n- added optional avif support, feature `avif`\n- added mappings for more exotic file ext (e.g. ots, mdc, ott, dotx, potx, ott..)\n- added `-e` flag, gives file ext hint for stdin, helps for when the stdin is something mcat can't know alone, like csv\n- imporved the interactive mode (`-I`), now supports zooming out (below 1)\n- imporved the interactive mode (`-I`), now syncs using decset 2026, no longer blinks\n- imporved the interactive mode (`-I`), now spamming won't buffer input, but will work as if it does all at once, fixing phantom actions continuing after release\n- improved the sixel encoder, now faster and should produce better looking images/videos\n- improved tmux support for kitty image protocol\n- improved iterm and sixel frame encoders, added a scheduler for varying sleep times and frame drop, also no longer saving the results in ram for loop, the video will just redemux and mcat will re render\n- improved support for iterm+sixel image protocol for both normal and tmux, video is now rendered inline and doesn't clear the screen, and in tmux the cursor goes after the video\n- fixed potential memory leak, if you rendered a kitty animation on a terminal that doesn't support kitty at all (through `--kitty`) flag, the first image would not be cleaned and would sit in /dev/shm (only linux and if the terminal is the tty)\n- fixed an issue in the interactive mode (`-I`) where ascii images would've overflowed over the prompt\n\n## Install\n\n**Linux / macOS**\n```bash\ncurl -fsSL https://github.com/Skardyy/mcat/releases/download/v0.6.5/install.sh | sh\n```\n\n**PowerShell (Windows)**\n```powershell\nirm https://github.com/Skardyy/mcat/releases/download/v0.6.5/install.ps1 | iex\n```\n\n**Debian / Ubuntu (.deb)**\n```bash\n# glibc\ncurl -LO https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat_0.6.5_amd64.deb\nsudo dpkg -i mcat_0.6.5_amd64.deb\n\n# musl\ncurl -LO https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-musl_0.6.5_amd64.deb\nsudo dpkg -i mcat-musl_0.6.5_amd64.deb\n```\n\n**Fedora / RHEL (.rpm)**\n```bash\n# glibc\nsudo dnf install https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-0.6.5-1.x86_64.rpm\n\n# musl\nsudo dnf install https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-musl-0.6.5-1.x86_64.rpm\n```\n\n## Download\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [mcat-v0.6.5-x86_64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-v0.6.5-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-v0.6.5-x86_64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.5-aarch64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-v0.6.5-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.5/mcat-v0.6.5-aarch64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.5-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6