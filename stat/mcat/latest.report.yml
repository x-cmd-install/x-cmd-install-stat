","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":9298772,"digest":"sha256:eed401d82ea3eaa9b22f5c19c33e3635cff1e7aef0f627aaee1979715d4556de","download_count":1,"created_at":"2026-10-23T14:25:37Z","updated_at":"2026-10-23T14:25:38Z"},{"id":669367793,"node_id":"RA_kwDOOZW7eM4n5b3x","name":"mcat_0.6.6_arm64.deb.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:e0106df18b15687f3198a882eaa487fe39123d429c595ef19a60f3ac1ec6f58e","download_count":1,"created_at":"2026-10-23T14:25:38Z","updated_at":"2026-10-23T14:25:38Z"}],"body":"## Changelog\n\n- fixed an regression on kitty animation\n- added support for animated avif files in the video route\n- added fallback to multi stream container, choosing a stream with more then 1 fps\n- added more syntax highlighting support for the interactive mode `-I`\n- added OSC query for sixel and kitty graphics support\n- added OSC query for the terminal bg, now with auto theme - choosing the best theme according to the terminal bg\n- added `OSC 9;4` support for kitty too (terminal progress bar)\n\n## Install\n\n**Linux / macOS**\n```bash\ncurl -fsSL https://github.com/Skardyy/mcat/releases/download/v0.6.6/install.sh | sh\n```\n\n**PowerShell (Windows)**\n```powershell\nirm https://github.com/Skardyy/mcat/releases/download/v0.6.6/install.ps1 | iex\n```\n\n**Debian / Ubuntu (.deb)**\n```bash\n# glibc\ncurl -LO https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat_0.6.6_amd64.deb\nsudo dpkg -i mcat_0.6.6_amd64.deb\n\n# musl\ncurl -LO https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-musl_0.6.6_amd64.deb\nsudo dpkg -i mcat-musl_0.6.6_amd64.deb\n```\n\n**Fedora / RHEL (.rpm)**\n```bash\n# glibc\nsudo dnf install https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-0.6.6-1.x86_64.rpm\n\n# musl\nsudo dnf install https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-musl-0.6.6-1.x86_64.rpm\n```\n\n## Download\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [mcat-v0.6.6-x86_64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-x86_64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.6-aarch64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-aarch64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.6-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux (gnu) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [mcat-v0.6.6-aarch64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux (gnu) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [mcat-v0.6.6-x86_64-unknown-linux-musl.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-x86_64-unknown-linux-musl.tar.xz) | x64 Linux (musl) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-x86_64-unknown-linux-musl.tar.xz.sha256) |\n| [mcat-v0.6.6-aarch64-unknown-linux-musl.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.6/mcat-v0.6.6-aarch64-unknown-linux-musl.tar.xz) | ARM64 Linux (musl) | [c