ases/download/v0.6.9/mcat-musl-0.6.9-1.x86_64.rpm\n```\n\n## Download\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [mcat-v0.6.9-x86_64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x86_64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.9-aarch64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-aarch64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.9-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux (gnu) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [mcat-v0.6.9-aarch64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux (gnu) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [mcat-v0.6.9-x86_64-unknown-linux-musl.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x86_64-unknown-linux-musl.tar.xz) | x64 Linux (musl) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x86_64-unknown-linux-musl.tar.xz.sha256) |\n| [mcat-v0.6.9-aarch64-unknown-linux-musl.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-aarch64-unknown-linux-musl.tar.xz) | ARM64 Linux (musl) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [mcat-v0.6.9-x86_64-pc-windows-msvc.zip](https://github.com/Skardyy/mcat/releases/download/v0.6.9/mcat-v0.6.9-x8