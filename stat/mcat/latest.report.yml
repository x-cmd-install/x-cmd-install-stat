uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-debian-package","state":"uploaded","size":9299348,"digest":"sha256:0cce45f673b37fdb5fff71ed82c7e0522e85a0fae2866ab71e4f5dcb299c430c","download_count":3,"created_at":"2026-10-30T21:03:44Z","updated_at":"2026-10-30T21:03:45Z"},{"id":693416916,"node_id":"RA_kwDOOZW7eM4pVLPU","name":"mcat_0.6.8_arm64.deb.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":87,"digest":"sha256:70e7343434089d2f4508a765951de1695b070885039189503f1df08c620ee05f","download_count":3,"created_at":"2026-10-30T21:03:44Z","updated_at":"2026-10-30T21:03:44Z"}],"body":"## Changelog\n\n- improved image/video encoder logic, now splitted kitty features to do different things according to the depth of support to the kitty protocol rather then just supported binary\n- improved tmux support\n- imporved the image encoder selection to prefer iterm or sixel over kitty when in tmux and the terminal doesn't support kitty unicode placeholder ext, works better\n- added kitty animation support for when the terminal supports kitty but not the animation ext\n- added kitty animation support for macos and bsd too, previously was just locked to linux, still only works on kitty terminal\n- fixed an issue where video from url/stdin won't be looped\n- fixed kitty animation failing on wrong shm name\n- fixed an issue where images in markdown won't appear in tmux\n\n## Install\n\n**Linux / macOS**\n```bash\ncurl -fsSL https://github.com/Skardyy/mcat/releases/download/v0.6.8/install.sh | sh\n```\n\n**PowerShell (Windows)**\n```powershell\nirm https://github.com/Skardyy/mcat/releases/download/v0.6.8/install.ps1 | iex\n```\n\n**Debian / Ubuntu (.deb)**\n```bash\n# glibc\ncurl -LO https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat_0.6.8_amd64.deb\nsudo dpkg -i mcat_0.6.8_amd64.deb\n\n# musl\ncurl -LO https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-musl_0.6.8_amd64.deb\nsudo dpkg -i mcat-musl_0.6.8_amd64.deb\n```\n\n**Fedora / RHEL (.rpm)**\n```bash\n# glibc\nsudo dnf install https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-0.6.8-1.x86_64.rpm\n\n# musl\nsudo dnf install https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-musl-0.6.8-1.x86_64.rpm\n```\n\n## Download\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [mcat-v0.6.8-x86_64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-x86_64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.8-aarch64-apple-darwin.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-aarch64-apple-darwin.tar.xz.sha256) |\n| [mcat-v0.6.8-x86_64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux (gnu) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [mcat-v0.6.8-aarch64-unknown-linux-gnu.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux (gnu) | [checksum](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [mcat-v0.6.8-x86_64-unknown-linux-musl.tar.xz](https://github.com/Skardyy/mcat/releases/download/v0.6.8/mcat-v0.6.8-x86_64-unknown-linux-musl.tar.xz) | x64 Linux (musl) | [checksum](https://github.com