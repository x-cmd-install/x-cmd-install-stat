lDB","name":"circumflex_5.0_linux_386.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11288318,"digest":"sha256:5f25d8e13d1ac3d263b318e36e0330adb9b8c37b6dc4c48ffd6ed94c07aec734","download_count":7,"created_at":"2026-07-29T16:57:25Z","updated_at":"2026-07-29T16:57:26Z"},{"id":494293186,"node_id":"RA_kwDOEN_Zec4ddlDC","name":"circumflex_5.0_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":12179655,"digest":"sha256:830ea047491b7edfe6aa07b4801cc95d186ee15bfed66fc13529298992cfcd82","download_count":79,"created_at":"2026-07-29T16:57:25Z","updated_at":"2026-07-29T16:57:26Z"},{"id":494293187,"node_id":"RA_kwDOEN_Zec4ddlDD","name":"circumflex_5.0_linux_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":11254326,"digest":"sha256:451c31559dd0df8350b95ab4b5fe61f486a879e58fa9c9e78b0ccd22620c66d5","download_count":8,"created_at":"2026-07-29T16:57:25Z","updated_at":"2026-07-29T16:57:26Z"}],"body":"Another large release. The headliners are search, kitty image protocol and syntax highlighting in code snippets. It also\r\nbrings a few breaking changes in order to mainly improve the naming of some of the flags and fields.\r\n\r\n**New Features**\r\n\r\n- Added Search to Stories, Comment Section and Reader Mode\r\n- Syntax-highlight code blocks in Reader Mode and the Comment Section\r\n- Added URL selection mode to Reader Mode and the Comment Section, with the ability to follow links in place\r\n- Added a `jobs` category\r\n- Added `config.toml` for persistent settings\r\n- Terminal title now follows the content displayed\r\n\r\n**Reader Mode**\r\n\r\n- Links to other Hacker News discussions open in the comment section\r\n- Images now render in high resolution on terminals with Kitty graphics support (Ghostty, Kitty, Konsole)\r\n- arXiv links now open the full paper instead of the abstract page, with equations converted to Unicode math\r\n- Add support for displaying AVIF images\r\n- Fix Mermaid diagrams not rendering\r\n- Fix missing labels and titles in Matplotlib charts and other SVGs\r\n- Markdown pages are now rendered and fully formatted\r\n- Charts and diagrams now render as described figures\r\n\r\n**Comment Section**\r\n\r\n- Navigate mode moved from <kbd>Tab</kbd> to <kbd>a</kbd>, exiting with <kbd>Esc</kbd> like search; <kbd>Tab</kbd> now\r\n  opens the URL selector in every view\r\n- Flagged, deleted, and delayed comments without replies are no longer shown\r\n\r\n**Design**\r\n\r\n- Re-stylize the meta block\r\n- Soften comment footer colors\r\n- Update indent level indicator\r\n\r\n**Breaking Changes**\r\n\r\n- Renamed `--disable-history` to `--no-history`\r\n- Renamed `clx clear` to `clx clear-history`\r\n- Renamed `--reader-mode-images` to `--show-images-on-open`, replacing `CLX_READER_MODE_IMAGES`\r\n- Images require a terminal with Kitty graphics support; override the detection with `--graphics always|never`\r\n- Favorites moved to `favorites.toml` (migrated automatically)\r\n\r\nHope you enjoy using `circumflex`."}
