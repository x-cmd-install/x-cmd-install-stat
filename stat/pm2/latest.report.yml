{"id":375684580,"author":{"login":"Unitech","id":757747,"node_id":"MDQ6VXNlcjc1Nzc0Nw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOAJtxSs4WZH3k","tag_name":"v7.0.4","target_commitish":"master","name":"v7.0.4","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-08-24T12:35:02Z","updated_at":"2026-08-24T12:35:48Z","published_at":"2026-08-24T12:35:48Z","assets":[],"body":"## 7.0.4\r\n\r\n### Features\r\n\r\n- Start `.ts` apps with Node.js native type stripping when bun is not installed (Node.js >= 22.18 /\r\n23.6, `--experimental-strip-types` auto-injected on 22.6+); `ts-node` fallback now resolved from the\r\napp's own dependencies\r\n\r\n### Bug Fixes\r\n\r\n- Fix `pm2 start --container` / `--container --dist` crashing with `Cannot find module` \u2014 wrong\r\nrequire depth in `Containerizer.js` from the v7 promptly internalization\r\n- Bump `js-yaml` 4.3.0 \u2192 4.3.1\r\n- Fix overlapping reloads colliding on the `_old_<pm_id>` slot and orphaning a cluster worker \u2014 a\r\nreload is now refused while one is in progress #6129\r\n- Ignore stale exit events from a replaced process \u2014 fixes double start on Windows with\r\n`shutdown_with_message` #6142\r\n- Fix `retrying in NaNms` kill log and ~1ms poll spam when `kill_retry_time` is unset \u2014 fallback to\r\n`KILL_RETRY_TIME` constant (100ms, `PM2_KILL_RETRY_TIME` overridable)\r\n- Fix `pm2 start`/`restart` RPC hanging forever when a cluster worker dies before its `online` event\r\n(bad `node_args`, boot OOM) \u2014 executeApp now concludes on exit-before-online\r\n- Surface the daemon's actual error in CLI output instead of masking everything as `Process not\r\nfound`\r\n- Pin OpenTelemetry package versions in `pm2 install-otel` and re-emit legacy HTTP span tags\r\n(`http.method`, `http.status_code`, `http.target`) dropped by `@opentelemetry/instrumentation-http`\r\n>= 0.220\r\n\r\n### Core Refactor\r\n\r\n- Remove dead code: `promise.min.js` polyfill (native `Promise`), `IsAbsolute.js` (native\r\n`path.isAbsolute`), unused Java/Ruby Dockerfile templates, always-false `win64` platform checks","reactions":{"total_count":6,"+1":2,"-1":0,"laugh":0,"hooray":3,"confused":0,"heart":0,"rocket":0,"eyes":1}}
