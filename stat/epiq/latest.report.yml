macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":130052448,"digest":"sha256:fb62dd88415a5495a6c3e01376b66ed1859622da243ab9d9a78a5bc4800601db","download_count":0,"created_at":"2026-10-26T22:30:19Z","updated_at":"2026-10-26T22:30:23Z"},{"id":679683283,"node_id":"RA_kwDOPAGkN84ogyTT","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101846016,"digest":"sha256:87a5386a4c4cd62daef67eeb03328efd209711699377bddc751c6a3cad5090a1","download_count":0,"created_at":"2026-10-26T22:30:31Z","updated_at":"2026-10-26T22:30:35Z"}],"body":"v1.16.0\r\n\r\nGoals\r\n- Put tickets in a goal to group them, even across boards\r\n- Each goal shows as a pill above the lanes, with a bar showing how much is done\r\n- Click a pill to see only that goal's tickets and its details\r\n- Works in the GUI, the TUI (:goal, :ungoal, :filter goal) and the MCP\r\n\r\nLanes\r\n- Click a lane's kebab menu to open its details: rename it, describe it or delete it\r\n- Mark a lane as a \"done\"-lane, and tickets in it count as done\r\n- A lane called Done always counts as done\r\n- In the TUI: :rule done and :unrule done\r\n\r\nUpdates\r\n- The GUI tells you when a new version of epiq is out, and how to update\r\n\r\nGUI\r\n- UX, Styling"}
