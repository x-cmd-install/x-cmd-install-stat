macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":130130880,"digest":"sha256:2f93fbc38cfd874196ea30706bf6588478fccdbe39b5f7fb526147efc723b4b5","download_count":0,"created_at":"2026-11-18T21:28:31Z","updated_at":"2026-11-18T21:28:35Z"},{"id":764833860,"node_id":"RA_kwDOPAGkN84tlnBE","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101970432,"digest":"sha256:ddec43215007283cc3d99a9f0d410ffa6be3073e731e7c8de6333ce6756fe6fa","download_count":0,"created_at":"2026-11-18T20:12:46Z","updated_at":"2026-11-18T20:12:52Z"}],"body":"v1.18.0\r\n\r\nSetup\r\n- Additional standalone `epiq setup` command, for when you don't want to initialize a new project also\r\n- Addiitonal `epiq init` command starts a board from a script, without the TUI\r\n- The editor falls back to $VISUAL, then $EDITOR; pick another with :config editor\r\n\r\nTUI\r\n- Quit with :q, :q!, :quit or :wq; q at the top offers :exit\r\n- Exiting leaves a clean terminal\r\n\r\nGUI\r\n- Comments read oldest first, with the composer pinned under the thread (contributed by @zz-simbe) (#579)\r\n- Prettier markdown tables \r\n- A lane the filter empties says how many tickets it hides, with a Clear\r\n- Switching board keeps tag, contributor and goal filters\r\n- The board switcher counts every ticket again, whatever the filter hides\r\n- Dense cards count the tags they can't fit","mentions_count":1}
