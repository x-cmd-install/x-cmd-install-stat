cos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":131629856,"digest":"sha256:e339bb7f033ccd6c85445f087d1fea94e9366afcdd7af7752da6468930d0e264","download_count":0,"created_at":"2026-09-16T21:58:23Z","updated_at":"2026-09-16T21:58:27Z"},{"id":568882004,"node_id":"RA_kwDOPAGkN84h6HNU","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":103431168,"digest":"sha256:f44d3f816ca51cb053d1c95e13fd37531b22c487503e3b19ddf3d0055e77c319","download_count":0,"created_at":"2026-09-16T21:58:36Z","updated_at":"2026-09-16T21:58:40Z"}],"body":"* **Board and project management:** Create, rename, and switch boards from the GUI; preserve project identity across checkouts; and expose board creation to agents.\r\n* **Timeline exploration:** Add the Flow layout, text and ticket filtering, improved series narrowing, Spotlight mode, and clearer impact-based controls.\r\n* **Event log:** Make the log resizable and detachable, with configurable columns, actor lanes, improved navigation, and inline diff statistics.\r\n* **Interface polish:** Improve spacing, controls, icon buttons, ticket cards, tags, agent labels, segment boundaries, and dock interactions.\r\n* **Reliability and testing:** Make event ordering locale-independent, validate writes against live nodes, improve drag-test coverage, and handle release binaries more safely.\r\n"}
