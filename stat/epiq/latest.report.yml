macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129334112,"digest":"sha256:cde31ecaa217985365f82d1f60c9edf8a7357f97c8d0749d282e9f0382e16c6b","download_count":1,"created_at":"2026-11-23T19:35:43Z","updated_at":"2026-11-23T19:35:49Z"},{"id":784274506,"node_id":"RA_kwDOPAGkN84uvxRK","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101149696,"digest":"sha256:877325153a7316ac86b8a3ccfb2e2f714af07cd334b72a312d3fa39473b83363","download_count":1,"created_at":"2026-11-23T19:35:45Z","updated_at":"2026-11-23T19:35:49Z"}],"body":"v1.19.0\r\n\r\nBig boards, much faster. On a 400,000-event board (20 people, 10 years), compared with v1.17:\r\n- Time-travel scrubbing is 44× faster per step\r\n- A teammate's change shows up 3× faster\r\n- Agents look up a ticket about 150× faster\r\n- A third less memory\r\n\r\nInstall\r\n- npm i epiq installs no other packages (was 258)\r\n- Unknown command-line flags now fail instead of being ignored\r\n\r\nPerformance\r\n- Syncs on big boards are much faster (535 → 22 ms at 400k events)\r\n- The GUI shows the board sooner, loading it while your browser opens\r\n- Opened tickets show their comments at once\r\n\r\nGUI\r\n- The Closed lane shows tickets closed in the last year, by close date\r\n- Tickets sharing a position are ordered the same in the TUI, GUI and MCP\r\n- A comment edited after it was deleted reappears everywhere\r\n\r\nTUI\r\n- Ticket history describes each move relative to the previous one\r\n\r\nAgents (MCP)\r\n- Leaner replies and a shorter tool list, so agents use fewer tokens\r\n- epiq_state_get is removed; use epiq_issue_get and the list tools\r\n- The epiq skill asks agents to write tickets concisely\r\n\r\nFixes\r\n- Changes are no longer missed on filesystems that store file times in whole seconds\r\n- A ticket's history no longer includes events from before it existed"}
