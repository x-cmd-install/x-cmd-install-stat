macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129755744,"digest":"sha256:5cbe289df3e95158c9773f2891bcd2a70b264f10a016b5dcadad6bc999ece647","download_count":0,"created_at":"2026-09-28T21:11:55Z","updated_at":"2026-09-28T21:12:03Z"},{"id":596427076,"node_id":"RA_kwDOPAGkN84jjMFE","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101572608,"digest":"sha256:e6700f504d1e65b904547968340386f68e3bf4a1fc81e68c72a132cb58f5d1ca","download_count":0,"created_at":"2026-09-28T21:12:11Z","updated_at":"2026-09-28T21:12:14Z"}],"body":"v1.12.0\r\n\r\nLive across processes\r\n\r\n- Another process's writes reach the board without a sync: a TUI picks\r\n  up what an MCP agent, a GUI or a second TUI appends to the same\r\n  project, within about a second (VHMXHR0)\r\n- The GUI publishes another process's writes to its browsers whether or\r\n  not autosync is on, and a change made in one GUI tab reaches the\r\n  others (NFWEV5N)\r\n- The watch waits out syncs and loads, holds back while you are in the\r\n  past, and catches up on your return (VHMXHR0, NFWEV5N)\r\n\r\nGUI\r\n\r\n- The board switcher reads in the same quiet colour as the text filter\r\n  beside it (JW7AJAF)\r\n\r\nFixes\r\n\r\n- A sync that throws no longer leaves the TUI stuck at \"syncing\": it\r\n  reports the failure, and :sync and autosync work again without a\r\n  restart (VHMXHR0)\r\n\r\nDocs\r\n\r\n- The readme's and site's `claude mcp add` commands use --package=epiq;\r\n  some Claude Code versions took -p as their own print flag and never\r\n  registered the server (A6RJ5JY)\r\n- The epiq ski_install keepsonly what a board\r\n  user needs, r length(T3230XV)\r\n\r\nInternal\r\n\r\n- A real TUI and GUI are proven to see each other's writes, across\r\n  processes and with autosync off (NFWEV5N)\r\n"}
