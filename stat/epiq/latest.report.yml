macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129759872,"digest":"sha256:12610ce8c453d0a77c79388b22648f20732faa89aeb4f5148544750d28a4ba10","download_count":1,"created_at":"2026-10-06T18:59:45Z","updated_at":"2026-10-06T18:59:52Z"},{"id":616389384,"node_id":"RA_kwDOPAGkN84kvVsI","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101554688,"digest":"sha256:d6abe890e7148f3d68ac3e7d84a2b6331be9fa50babcc151e280ad27b77b4426","download_count":2,"created_at":"2026-10-06T19:00:10Z","updated_at":"2026-10-06T19:00:15Z"}],"body":"v1.12.2\r\n\r\nCode tab\r\n\r\n- Long diff lines can wrap instead of scrolling sideways: a scroll /\r\n  wrap pair at the end of the Diff / Commits row switches every diff,\r\n  and the choice is remembered (S7NVYBN, #434)\r\n\r\nHeadless and behind a proxy\r\n\r\n- `epiq gui` no longer exits when no browser opener is installed; it\r\n  keeps serving and prints the URL (KRJD9HJ, #429)\r\n- `epiq gui --no-open` serves without opening a browser, and on Linux\r\n  with no display it skips the open on its own (KRJD9HJ, #429)\r\n- The board connects over wss:// when the GUI is served over https, so\r\n  it no longer loads blank behind a TLS-terminating proxy (5YXJATQ,\r\n  #429)\r\n\r\nFixes\r\n\r\n- Switching tab on a ticket keeps the board's zoomed window; a diff\r\n  link's line range had been clearing it (TGPKA5V)\r\n- The Code series' line bars are scaled against the largest bucket on a\r\n  log scale, so busy periods no longer clip to one height (KSMVDM8)"}
