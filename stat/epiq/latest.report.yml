macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129797168,"digest":"sha256:275cf3edbf12231b5f2f7539c0e8bdc6c58e75ed084e51968ea3d761482c2860","download_count":0,"created_at":"2026-10-20T22:20:57Z","updated_at":"2026-10-20T22:21:01Z"},{"id":660651779,"node_id":"RA_kwDOPAGkN84nYL8D","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101611520,"digest":"sha256:18b5f92271cdc5b2d77efb343a6234551785d1cb6bef134add69b1133867fc33","download_count":1,"created_at":"2026-10-20T22:21:29Z","updated_at":"2026-10-20T22:21:33Z"}],"body":"v1.14.0\r\n\r\nBoard and lane descriptions\r\n- Board and lane descriptions hold conventions agents follow; the MCP\r\n  hands them out on assume, get, create and move (requested by @cmoncure)\r\n\r\nBoard and lane panels\r\n- Lane and board panels hold their description; a board's opens from\r\n  its row in the switcher\r\n- Board stats: flow over 8 weeks and time per lane, with checkbox\r\n  legends on every breakdown\r\n\r\nCommits\r\n- Link a commit by an Epiq-Ref: line in its body (by @mikepurvis)\r\n- Commit messages show in the commit panel and Code tab\r\n\r\nEditing\r\n- Unsent ticket text survives tab switches; ask before leaving (requested by @aclemmensen)\r\n- Descriptions keep line breaks, and the editor grows with its text\r\n\r\nGUI\r\n- Styling, cleanup\r\n\r\nPerformance\r\n- Board reads stay fast at 10-year size\r\n\r\nSpecial thanks to\r\n- @mikepurvis for Epiq-Ref commit linking (#468)\r\n- @cmoncure for the idea of board rules for agents (#469)\r\n- @aclemmensen for keeping unsent text (#475)","mentions_count":3}
