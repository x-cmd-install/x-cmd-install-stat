macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129751616,"digest":"sha256:04f5d13780e2cb5f7350385e0d5ca433c4db5fd64f833085e31b28c1554c3325","download_count":0,"created_at":"2026-09-20T16:03:15Z","updated_at":"2026-09-20T16:03:20Z"},{"id":577102804,"node_id":"RA_kwDOPAGkN84iZePU","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101570048,"digest":"sha256:eca7b2b46c19dad9ac772739b53ae74548cf829a8e32226903433e5d630026d7","download_count":2,"created_at":"2026-09-20T16:03:40Z","updated_at":"2026-09-20T16:03:43Z"}],"body":"v1.11.0\r\n\r\nBoard scoping\r\n\r\n- The log and the chart list the commits linked to this board's tickets,\r\n  not the repository's (89HF7NW, 7C92VCY)\r\n- A ticket counts for every board it has lived on, so closing it or moving\r\n  it leaves its history on the board the work happened on (KWYX3CX)\r\n- Every series trigger says what of it is plotted, (all) included, and the\r\n  chart opens on linked commits (RAWW8MS)\r\n\r\nGUI\r\n\r\n- The board switcher moves up into the topbar, and its list says how many\r\n  tickets each board holds (A4M82FD, 632A02T)\r\n- The Code series can measure the lines its commits moved, stacked from\r\n  the baseline (H6K29N8)\r\n- The log's field boxes fold into a menu when the pane is too narrow for\r\n  the row (CP39GRP)\r\n- The log's board-facing edge is drawn like the ticket panel's, and casts\r\n  the same shadow (G85FP03)\r\n- Panels open and close with a short move instead of jumping (9H4ENW8)\r\n- A lane lights from further off (BSYQCRR)\r\n- The chrome's quiet text is lifted a fifth, from 3.2:1 to 4.3:1 (8H3YWD1)\r\n\r\nFixes\r\n\r\n- A ticket filed just after the board loads opens its panel again: one\r\n  socket lasts the session, so a request in flight keeps its reply\r\n  (8GXKQR4)\r\n- A ref lock left in the common git directory is cleared, so the state\r\n  branch can be committed to again (QR97TP3)\r\n\r\nInternal\r\n\r\n- Duplicate flows consolidated: one door to boot, one gradient sampler,\r\n  one addTicket (6J2R205)\r\n- The killed-sync suite kills while the actor is syncing, and says so\r\n  (P5VM0FE)\r\n"}
