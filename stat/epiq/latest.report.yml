macos-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":130094240,"digest":"sha256:5765a87f4fd1e31de142069f7fdbd35fad973c684b3533b5944b9cb175b3deff","download_count":0,"created_at":"2026-10-13T23:57:20Z","updated_at":"2026-10-13T23:57:25Z"},{"id":638619214,"node_id":"RA_kwDOPAGkN84mEI5O","name":"epiq-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":101884928,"digest":"sha256:be9dd463254de7b7d357ece037c31c12a1f7b1f44f99c2422173f8089ce3d029","download_count":0,"created_at":"2026-10-13T23:57:06Z","updated_at":"2026-10-13T23:57:11Z"}],"body":"v1.13.0\r\n\r\nCommits from other repos\r\n\r\n- Connect other repos to a board; their commits show on the tickets\r\n  they name and in the timeline (4SC2RXY, #450)\r\n- Connecting previews the repo first and asks to confirm (6YXX7VQ, #462)\r\n- The repo list syncs with the board, no commit needed (6YXX7VQ, #462)\r\n- Labels, branch choice and history window per repo (NFJE6KS, #450)\r\n- Local paths are refused: only repos everyone can fetch (VZK650A, #463)\r\n\r\nClones\r\n\r\n- Read-only clones, fetched on sync, capped at 2 GB each (HSH4BSK, #451)\r\n- Interrupted or broken clones recover on their own (E7YXMP6, ACAM1F1,\r\n  #455\u2013#459)\r\n\r\nSettings\r\n\r\n- One settings panel, from the avatar or the gear (9FNQFP3, #460)\r\n\r\nFixes\r\n\r\n- Diffs of a repo's first commit no longer show a git error\r\n(6YXX7VQ,\r\n  #462)\r\n- Writes from a noame machine always show\r\n  (6YXX7VQ, #462)\r\n\r\nInternal\r\n\r\n- Three CI flakes"}
