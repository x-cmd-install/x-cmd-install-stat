"2026-11-04T08:38:26Z"},{"id":708832325,"node_id":"RA_kwDOSI1tKc4qP-xF","name":"octoscope_0.40.0_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6466648,"digest":"sha256:8cab5a30def14a979f34b50866ba05f55b196e01cb52670a16db844920904d29","download_count":8,"created_at":"2026-11-04T08:38:22Z","updated_at":"2026-11-04T08:38:24Z"},{"id":708832427,"node_id":"RA_kwDOSI1tKc4qP-yr","name":"octoscope_0.40.0_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7077568,"digest":"sha256:86dd6a22766db085a537d475494de67880310c5e9c4560b6ddbd8014e26dab01","download_count":1,"created_at":"2026-11-04T08:38:24Z","updated_at":"2026-11-04T08:38:25Z"},{"id":708832386,"node_id":"RA_kwDOSI1tKc4qP-yC","name":"octoscope_0.40.0_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19403264,"digest":"sha256:391235fae0415b119026c117a9ce399ddf8d1d7159dd8b0bba32686dcf529f6f","download_count":1,"created_at":"2026-11-04T08:38:24Z","updated_at":"2026-11-04T08:38:26Z"},{"id":708832497,"node_id":"RA_kwDOSI1tKc4qP-zx","name":"octoscope_0.40.0_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7051066,"digest":"sha256:29fa2c2ce792f5866aa6adf1124ae33e25e0c0c90c3c126ce941fa97c50dfd9c","download_count":1,"created_at":"2026-11-04T08:38:26Z","updated_at":"2026-11-04T08:38:27Z"}],"body":"**Archived repositories stop counting as work.** GitHub makes an archived repository read-only, so its open issues and pull requests are not waiting on anyone. The Overview's *Open Issues (own)* and *Open PRs (own)* now leave them out, the Repos tab and Top repositories tag them *Archived*, and two of the work filters stop sending you to them. It is also the first release with code from the community: thank you, [@soulchainer](https://github.com/soulchainer).\n\n## Open issues and PRs, without the archive\n\n*Open Issues (own)* and *Open PRs (own)*, in the Overview's Operational section, count only the repositories you can still act on. *Stars Received*, *Forks Received* and *Repositories* still include archived ones: archiving a repository takes back none of its stars or forks. `--public-only` recomputes the counters from your public repositories by the same rule. An account with no archived repository sees the same numbers as before. Closes [#247](https://github.com/gfazioli/octoscope/issues/247). ([#250](https://github.com/gfazioli/octoscope/pull/250))\n\n## An *Archived* tag\n\n- **Repos tab and Top repositories.** An archived repository carries a muted *Archived* tag before its name. Only those rows make room for it, so the Name column is no wider for every other repository, and the row under the cursor keeps its highlight.\n- **Work filters (`w`).** *PRs open* and *CI broken* skip archived repositories, owned and watched alike. *stale 90d* still lists them: it asks what has gone quiet, and an archived repository has.\n- **`--json`.** Every entry in `repositories` carries `\"archived\": true` or `false`. `operational.open_issues` and `operational.open_prs` leave archived repositories out, as the Overview does, so they can be lower than the sum over `repositories`; the new field says which rows make the difference. It is additive, so `schema_version` stays 1.\n\n## The first community pull request\n\n[@soulchainer](https://github.com/soulchainer) proposed this in [#247](https://github.com/gfazioli/octoscope/issues/247) and wrote it in [#250](https://github.com/gfazioli/octoscope/pull/250): the counters, the tag, the work filters, the docs and their tests. The review added the cursor highlight, the per-row width, the fit of Top repositories on a narrow terminal and the `--json` field on top of their commits. They are credited in the What's new tab and in the README's new *Contributors* section.\n\n## Notable polish\n\n- **Go 1.26.10**, which fixes [GO-2026-6809](https://pkg.go.dev/vuln/GO-2026-6809) in the standard library's `crypto/x509`; govulncheck flagged the path as reachable. No module dependency changed. Building from source now needs Go 1.26.10.\n- **The docs say what the counters compute.** The landing's Operational card spoke of public repositories and the guide's Repos tab did not mention forks: both now say every repository you own except forks. The public-only card said the counters stay complete, while those built from your repositories are recomputed from the public ones. The guide no longer calls *Commits (yr)* a lifetime total, and the README gives the `--json` repository cap as 500, not 100.\n- **The README** opens with a card of the repository under its title, rendered daily by [glancecard](https://github.com/gfazioli/glancecard) and matched to your GitHub theme.\n- **The privacy policy** names privacy@undolog.com for data requests.\n- **A new sponsor** on the landing's wall: thank you, [@guimazza](https://github.com/guimazza).\n- **This release is built by goreleaser-action 7.3.0.**\n\n## Tests\n\n- **The counters.** Archived repositories are left out of the workload counters on the fetch path and in `Public()`, and the archive flag is pinned on both the owned and the watched fetch.\n- **The tables.** Only archived rows make room for the tag, the cursor row keeps its accent, and Top repositories stays inside its width, down to the narrowest Overview.\n- **The work filters** skip archived repositories for *PRs open* and *CI broken* only.\n- **`--json`** marks archived repositories.\n- **Mutation-tested.** Ten mutants over the counters, the fetch mapping, the work filters and both tables: every one fails a test. Two survived the first run; the tests that catch them came with the review.\n- **Reviewed by Codex**: two passes on the contribution, security included, and one on the release prep. Every finding was verified against the code before it was applied or declined.\n\n## Upgrade\n\n```\nbrew upgrade gfazioli/tap/octoscope\n```\n"}
