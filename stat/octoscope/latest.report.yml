"2026-09-16T07:06:01Z"},{"id":567401188,"node_id":"RA_kwDOSI1tKc4h0drk","name":"octoscope_0.35.0_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6404563,"digest":"sha256:20f0f77005d35fc9b5346397d3d0eea91a17485c03544cfaaf50359c0d5ca9cf","download_count":8,"created_at":"2026-09-16T07:06:00Z","updated_at":"2026-09-16T07:06:01Z"},{"id":567401173,"node_id":"RA_kwDOSI1tKc4h0drV","name":"octoscope_0.35.0_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7006081,"digest":"sha256:9374229c8761642bfd924a814fd7d643b13851132127c357ecf9ec40156e1073","download_count":1,"created_at":"2026-09-16T07:05:59Z","updated_at":"2026-09-16T07:06:00Z"},{"id":567401157,"node_id":"RA_kwDOSI1tKc4h0drF","name":"octoscope_0.35.0_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19171840,"digest":"sha256:46fee8317565df7792eeb5436c8c6ff0ce86113efeea31a179f69d439b0ad883","download_count":1,"created_at":"2026-09-16T07:05:58Z","updated_at":"2026-09-16T07:06:00Z"},{"id":567401128,"node_id":"RA_kwDOSI1tKc4h0dqo","name":"octoscope_0.35.0_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6979031,"digest":"sha256:e384e47113fae36c746f92eb7ee19dd16928647ac4f59ad1c411c37874e311ce","download_count":0,"created_at":"2026-09-16T07:05:57Z","updated_at":"2026-09-16T07:05:58Z"}],"body":"**Your activity reaches your scripts, and arrives in order.** The scriptable half of octoscope could report on your repositories and never on what you did with them. It can now \u2014 and wiring it up turned up something that had been wrong the whole time.\n\n## Recent activity in `--json` and `--plain`\n\n`--activity` adds the event feed to both machine-readable outputs, carrying the same fields the TUI renders. Closes [#125](https://github.com/gfazioli/octoscope/issues/125).\n\nOne decision worth stating, because it is the kind of thing a consumer builds on: when the feed is **not** asked for, `recent_activity` is **absent** from the JSON rather than present and empty. An empty array would be a claim \u2014 \"we looked, there was nothing\" \u2014 and that claim would be false. A missing key lets a script tell *not fetched* from *nothing happened*.\n\nAnd when the feed **is** requested and the fetch fails, that is an error, not an empty result. The earlier shape reported a failed request identically to a quiet account.\n\n## The feed was never in chronological order\n\nFound while wiring the above, and true for as long as octoscope has had an Activity tab. Closes [#184](https://github.com/gfazioli/octoscope/issues/184).\n\nThe events API is not documented as returning a sorted feed, and it does not. Measured on three independent feeds: **27 of 99** adjacent event pairs came back out of sequence, then 28, then 25. The responses we measured interleaved two ranges of event id, and the code trusted the order it was given \u2014 so the Activity tab has been showing an almost-sorted list, which is worse than an obviously unsorted one because it reads as correct.\n\nThe sort happens where events are parsed, so the TUI and the report are fixed by the same change. The tie-break on equal timestamps is the event id, compared as a number rather than as a string, because `\"9\"` sorts after `\"10\"` and a tie-break that is not a total order produces a different answer on different runs.\n\n## A trigger counts only where the repository lets it reach outsiders\n\nThe supply-chain scan's capability axis treats `issues`, `discussion`, `discussion_comment` and `fork` as untrusted-input triggers. They only are where the repository permits them. Closes [#114](https://github.com/gfazioli/octoscope/issues/114).\n\nA workflow reacting to discussions on a repository with discussions **disabled** is not an exposure. Neither is `issues` on a repository only collaborators can open one on. Four flags the existing query already pays for now decide it, so this costs nothing on the wire.\n\nThis moves the score in **both** directions, which is the honest way to describe it:\n\n- **fewer findings** where a repository's own settings make a trigger unreachable;\n- **more findings on private and internal repositories**, where the axis used to go quiet \u2014 exactly the case where a read-access user is the supplier it exists to worry about.\n\n## A macOS build is verified before it is public, not after\n\n0.34.3 added a job that downloads the published binaries, asks Gatekeeper for a verdict, re-applies the quarantine flag and runs them. It worked \u2014 and it ran **after** publishing, so it could make a bad release loud without preventing it. Closes [#182](https://github.com/gfazioli/octoscope/issues/182).\n\ngoreleaser now publishes a **draft**. Verification runs against the draft's own assets, and only a passing verification promotes the release to public and moves the Homebrew cask. The failure mode is inverted: a bad build now stays invisible instead of being downloadable for the minutes it takes a check to go red.\n\nTwo things were measured rather than reasoned about while building it, both load-bearing:\n\n- A `GITHUB_TOKEN` with `contents: read` **cannot see a draft release** \u2014 `gh` answers `release not found`. The verification job needs `contents: write` purely to read what it is verifying. Had this been assumed, the first real run would have failed at its first step.\n- `gh release view`/`edit`/`download` resolve a draft tag by *listing* releases, so they find it; a raw `GET /releases/tags/{tag}` returns 404. A reviewer's claim to the contrary was checked against a real draft before being rejected.\n\nThe cask is fetched and **validated before the tap is pushed** \u2014 the rendered `version` stanza has to be the tag being released, compared as a string rather than matched by a pattern, and its SHA-256 has to equal the digest recorded when it was built.\n\n## The site publishes without Jekyll\n\n`docs/` is served by `upload-pages-artifact` + `deploy-pages` now. From this repository's creation until this release, Pages ran Jekyll over `docs/` whatever the documentation said \u2014 and `jekyll-optional-front-matter`, which Pages loads by default, runs Liquid over a front-matter-less markdown file. That is how a `{{` inside a sample in `docs/design/` failed the publish seven consecutive times over twenty-two hours in August, while the site quietly kept serving the previous release. Closes [#122](https://github.com/gfazioli/octoscope/issues/122).\n\n## Notable polish\n\n- **What's new titles never wrapped, at any width.** A title longer than the pane ran off the edge instead of folding. Fixing the renderer repairs the entries already shipped in 0.34.1, not only this release's.\n- The Homebrew tap is cloned without a token; the token is supplied only on the push.\n- The release-workflow retry path distinguishes a *failed* promotion, where re-running is legitimate, from a *skipped or cancelled* one, where re-running would publish without the gate that was never reached.\n- Release artifacts are retained for 90 days rather than one, so a post-mortem has something to read.\n- The macOS verification job no longer holds a write-scoped token while executing the binaries it downloaded.\n\n## Tests\n\nThe full suite, plus two new guards on the What's new pane: one that keeps titles inside an editorial budget measured in terminal **cells** rather than runes, and one that renders every shipped entry at 80 and 50 columns and requires every line to fit the pane octoscope actually computes. Both were validated by breaking what they protect and requiring them to fail \u2014 the first two versions of the fit guard passed against a terminal four columns wider than any real one, and said nothing.\n\n`actionlint` and `shellcheck` over the changed workflow, each checked by injecting a deliberate error and requiring it to be caught.\n\n## Upgrade\n\n```\nbrew upgrade gfazioli/tap/octoscope\n```\n"}
