"2026-09-08T11:55:01Z"},{"id":550404379,"node_id":"RA_kwDOSI1tKc4gzoEb","name":"octoscope_0.33.0_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6387708,"digest":"sha256:a485707ad8b42953773fadf1ff0a62eb0659146559450256afca39f4804ce48a","download_count":0,"created_at":"2026-09-08T11:54:58Z","updated_at":"2026-09-08T11:54:58Z"},{"id":550404435,"node_id":"RA_kwDOSI1tKc4gzoFT","name":"octoscope_0.33.0_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6842054,"digest":"sha256:8a3bca3802595ddbb632b025fffee30daa8d6013c00335f331dfc1e455ee82e0","download_count":0,"created_at":"2026-09-08T11:54:59Z","updated_at":"2026-09-08T11:55:00Z"},{"id":550404378,"node_id":"RA_kwDOSI1tKc4gzoEa","name":"octoscope_0.33.0_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19150848,"digest":"sha256:afaf0c1b00b4fb4378b8f430669c736e3e0da3715e80fca29723321a5c000714","download_count":0,"created_at":"2026-09-08T11:54:58Z","updated_at":"2026-09-08T11:54:59Z"},{"id":550404476,"node_id":"RA_kwDOSI1tKc4gzoF8","name":"octoscope_0.33.0_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6968626,"digest":"sha256:af64694282c683b75619193a9de7419952ae8ddbc1894817ec8860a2f01402b3","download_count":0,"created_at":"2026-09-08T11:55:00Z","updated_at":"2026-09-08T11:55:01Z"}],"body":"## octoscope 0.33.0\n\nTerminal dashboard for your GitHub account \u2014 see [README](https://github.com/gfazioli/octoscope#readme) for a tour.\n\n## Changelog\n### Features\n* 8d4365f5d32e51b1ac19d5735c29704f2c8fb55a: feat(scan): parse the npm lockfile's install-script surface (@gfazioli)\n* 9f51a20c4e6420966fdfd54e53b0294f0298b976: feat(scan): read the default branch's lockfile on a budget of its own (@gfazioli)\n* ce8e0479f54903d7e2f5db05b7b338b4d0203290: feat(scan): record the dependency install surface in the fingerprint (@gfazioli)\n* 53c0dcf9dcd16b25a48950138683e6eac649e466: feat(scan): say what the dependency surface did NOT cover (@gfazioli)\n* c94c34c8dab9b14530955980efbbc6b1a9022a81: feat(scan): the dependency install surface, diffed (@gfazioli)\n### Fixes\n* 9df575e921d2e87dd3503654d9cfeb7a9f7a4c19: fix(lockfile): an unmeasured schema, and a change that got lost (@gfazioli)\n* 523e2a5491214ae1578f4dc4cedab5253fe2dfe5: fix(scan): five holes in the dependency delta, one of them the verdict (@gfazioli)\n* 56003f178ee801d749e5820d12d6089d31c78e56: fix(scan): the lockfile precedence must hold when the file is unreadable (@gfazioli)\n* d2c0299d7ff3681ce125cdb1e5c9fb4feb875e2d: fix(test): format the scan helper the way go.mod's gofmt does (@gfazioli)\n### Other\n* 4014fdae9dcb55146c3d4fbb0075393e7543d5e4: chore(release): 0.33.0 \u2014 the part of a PR nobody reads line by line (@gfazioli)\n* d96b91035884eac7125ce2dba834104623e3640b: chore(release): refresh landing hero screenshot for v0.33.0 (@gfazioli)\n* f7024f89c198208b3efe9b5e68769eb054ea50e8: docs(scan): Axis 1b, and the measurements behind its weights (@gfazioli)\n\n## Install\n\nVia Homebrew (recommended):\n\n```bash\nbrew install gfazioli/tap/octoscope\n```\n\nOr download a platform-specific archive below and drop the binary on your `$PATH`.\n\nThe bare `*_<os>-<arch>` assets are the same binary without the archive, for a\n`curl` in a CI step or a Docker build stage:\n\n```bash\ncurl -fsSL -o octoscope \\\n  https://github.com/gfazioli/octoscope/releases/download/v0.33.0/octoscope_0.33.0_linux-amd64 \\\n  && chmod +x octoscope\n```\n\n","mentions_count":1}
