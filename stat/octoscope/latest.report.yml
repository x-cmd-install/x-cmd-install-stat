"2026-11-15T14:33:12Z"},{"id":751271982,"node_id":"RA_kwDOSI1tKc4sx4Au","name":"octoscope_0.41.2_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6487122,"digest":"sha256:4ce02d8500d258277af362ed364626530a4e0f355556e8e0c2aa2979b01435aa","download_count":14,"created_at":"2026-11-15T14:33:10Z","updated_at":"2026-11-15T14:33:11Z"},{"id":751272132,"node_id":"RA_kwDOSI1tKc4sx4DE","name":"octoscope_0.41.2_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7092247,"digest":"sha256:eeb60a68e1041b15592940f6aaad1236081d1c75a0e4f78ef4256b99429edfa1","download_count":2,"created_at":"2026-11-15T14:33:12Z","updated_at":"2026-11-15T14:33:13Z"},{"id":751272052,"node_id":"RA_kwDOSI1tKc4sx4B0","name":"octoscope_0.41.2_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19443200,"digest":"sha256:cf138d72f6972912c6b089478787cde79d27e2c750f0739783efb1f08dfa89be","download_count":2,"created_at":"2026-11-15T14:33:11Z","updated_at":"2026-11-15T14:33:12Z"},{"id":751272139,"node_id":"RA_kwDOSI1tKc4sx4DL","name":"octoscope_0.41.2_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7068912,"digest":"sha256:87b16eb7376838431dfa239c248a233a3737d0d0cfba9ca027b81450fedd61d9","download_count":1,"created_at":"2026-11-15T14:33:12Z","updated_at":"2026-11-15T14:33:13Z"}],"body":"**A refused search costs one line, not the dashboard.** The search behind the PRs tab's \"awaiting your review\" section was the one optional part of a refresh that could take the whole dashboard down with it. It no longer can, and when it fails the tab says so instead of showing an empty section.\n\n## A failed review-request search stays in its section\n\nA refresh runs up to eight queries side by side. Gists, commit counts and the stack markers already degraded quietly when theirs failed: the dashboard rendered without them. The review-request search did not. If GitHub refused it while everything else answered:\n\n| Before | |\n| --- | --- |\n| no dashboard on screen yet | the error screen |\n| a permission refusal, since 0.39.0 | the dashboard already on screen was dropped too, because that reason reads as a credential failure |\n| `--json` / `--plain` | the whole run failed, exit status 1 |\n\nNow the rest of the dashboard loads as usual, and the PRs tab adds one line under its header: *Couldn't ask GitHub which pull requests await your review.* It takes the place of the blank line above the table, so the tab is exactly as tall as before, down to an 80×24 terminal. An empty awaiting-review section without that line still means what it always did: nothing is waiting for you. Closes [#240](https://github.com/gfazioli/octoscope/issues/240). ([#267](https://github.com/gfazioli/octoscope/pull/267))\n\nFor scripts, `--json` adds `review_requests_unavailable: true`, present only when that search failed, so `review_requests: []` beside it means \"could not ask\", not \"nothing to review\". `--plain` prints *Review requests could not be loaded this run.* The key is additive: `schema_version` stays 1.\n\nTwo things that may read as a change:\n\n- **A script that gated on the run failing** now gets exit status 0 with the flag set. A gate on `.review_requests` should check `.review_requests_unavailable` first; the README's Scripting section says so.\n- **A momentary 5xx on that one search** used to retry the whole refresh, every query again. It now costs the section until the next refresh, as it already did for gists and the stack markers.\n\n## Notable polish\n\n- **README and the guide** (Scripting, Tabs) document the new key and the line, and that a gate on review requests should check the key.\n- **Built with Go 1.26.11**, which fixes GO-2026-6859 in `net/http`. govulncheck found octoscope's requests reaching the affected code in 1.26.10, which 0.41.1 was built with. ([f0f2390](https://github.com/gfazioli/octoscope/commit/f0f2390))\n\n## Tests\n\n- **The real fetch, hermetic.** A GraphQL permission error and a 502 on the search alone, through the same HTTP client and goroutines a refresh uses: the dashboard is kept, repositories included, the flag is raised and the section is empty. A search that answers leaves the flag down.\n- **The PRs tab.** The line in every shape the tab takes (a list, nothing at all, a filter that matches nothing, a filter being typed) and never when the search answered; one line at 40 and 120 columns; the same height with and without it at 120×20, 120×9 and 120×6.\n- **The report.** The JSON key and the plain line appear only on failure, under `--public-only` too.\n- **Mutation-tested.** Every new assertion was checked by breaking what it guards: 15 mutation runs over the fetch, the tab and the report, each one failing a test.\n- **In the real binary**: on a live account whose search answers, `--json` and `--plain` list the same review requests with no new key and no new line; the failure path was rendered through the real model from 80×24 to 120×40.\n- **Reviewed by Codex**, two passes. The first found the line pushing a 24-row terminal one row over, fixed before merge, and a cursor that can outlive a list a refresh shortens, which is older than this release and is [#268](https://github.com/gfazioli/octoscope/issues/268).\n\n## Upgrade\n\n```\nbrew upgrade gfazioli/tap/octoscope\n```\n"}
