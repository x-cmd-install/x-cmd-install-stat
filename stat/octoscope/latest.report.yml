:"2026-11-17T11:05:19Z"},{"id":758714074,"node_id":"RA_kwDOSI1tKc4tOQ7a","name":"octoscope_0.41.3_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6488170,"digest":"sha256:aa5e5ddab5206dec1ea07c70abc1e486425bbcba33bb6cce1d459bfff8a59c11","download_count":13,"created_at":"2026-11-17T11:05:16Z","updated_at":"2026-11-17T11:05:17Z"},{"id":758714156,"node_id":"RA_kwDOSI1tKc4tOQ8s","name":"octoscope_0.41.3_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7093329,"digest":"sha256:99763f6a17dc8e55f6630faef7b99ee2755884f745266aa521a757eb7026c004","download_count":2,"created_at":"2026-11-17T11:05:17Z","updated_at":"2026-11-17T11:05:18Z"},{"id":758714147,"node_id":"RA_kwDOSI1tKc4tOQ8j","name":"octoscope_0.41.3_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19444736,"digest":"sha256:be87a06b116a29cf33c4a5004323b18e3f9473bae5a856d5e8f9b6a9cf978c08","download_count":2,"created_at":"2026-11-17T11:05:17Z","updated_at":"2026-11-17T11:05:18Z"},{"id":758714205,"node_id":"RA_kwDOSI1tKc4tOQ9d","name":"octoscope_0.41.3_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7069616,"digest":"sha256:abb616d04eb0cd58ba2582a0f6bef5df42b247ab7992df11ef17cd9653f44afc","download_count":1,"created_at":"2026-11-17T11:05:18Z","updated_at":"2026-11-17T11:05:19Z"}],"body":"**Keys act on the row you see, after a list gets shorter.** When a refresh or the public-only toggle left a list tab with fewer rows under its cursor, the row drawn as selected and the row the keys acted on were no longer the same one. They are again.\n\n## The highlighted row is the one the keys act on\n\nThe Repos, PRs, Issues and Gists tabs kept their cursor where it was when their list got shorter underneath it: a refresh after a pull request merged, review requests answered or an issue closed, or `p` hiding private rows. The cursor was then past the new end of the list. The screen still drew the last row as selected, but `enter` / `d`, `o`, `c` and `P` did nothing, and the first `↑` stepped from a row that was no longer there, until you moved the cursor yourself. Every key now acts on the highlighted row, the way the Activity feed and the Inbox already did. Closes [#268](https://github.com/gfazioli/octoscope/issues/268). ([#269](https://github.com/gfazioli/octoscope/pull/269))\n\nOne thing that may read as a change:\n\n- **After a list empties completely** and you press a key on it, the cursor starts again from the top when the rows come back, as on the Activity feed and the Inbox. Before, it returned to the position it had.\n\n## Tests\n\n- **Through the real model, per tab.** A fetch, the tab's key, `G`, a fetch with fewer rows: `enter` opens the row the rendered screen marks as selected, and `↑` lands on the row above it. Then the list is emptied, a key pressed, the list refilled, and `enter` again.\n- **Mutation-tested.** Each half of each tab's fix removed on its own, 8 runs, each one failing its own tab's test.\n- **In the real binary, on a live account.** On 0.41.2, Repos, `G`, `p`, `enter` opened nothing; on 0.41.3 the same keys open the highlighted repository, and `G`, `p`, `enter` open the highlighted row on the PRs, Issues and Gists tabs too.\n- **Reviewed by Codex**, one pass, no findings.\n\n## Upgrade\n\n```\nbrew upgrade gfazioli/tap/octoscope\n```\n"}
