"2026-11-10T19:56:51Z"},{"id":732755698,"node_id":"RA_kwDOSI1tKc4rrPby","name":"octoscope_0.41.1_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6486065,"digest":"sha256:4b1e6bea279be44332d0c9156797937841574d1b1a8b70bf2337230c4c4f111d","download_count":14,"created_at":"2026-11-10T19:56:48Z","updated_at":"2026-11-10T19:56:48Z"},{"id":732755806,"node_id":"RA_kwDOSI1tKc4rrPde","name":"octoscope_0.41.1_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7090271,"digest":"sha256:4b28d9601882248d484486d3fbd270d85eb018c422219b9e77b6dba8c1ae27c5","download_count":2,"created_at":"2026-11-10T19:56:51Z","updated_at":"2026-11-10T19:56:52Z"},{"id":732755774,"node_id":"RA_kwDOSI1tKc4rrPc-","name":"octoscope_0.41.1_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19439104,"digest":"sha256:60a2dc1fcf4546db84154379d3e7bbd8ea116255bfe71e473f0145b4eb23118f","download_count":2,"created_at":"2026-11-10T19:56:50Z","updated_at":"2026-11-10T19:56:51Z"},{"id":732755694,"node_id":"RA_kwDOSI1tKc4rrPbu","name":"octoscope_0.41.1_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7067105,"digest":"sha256:951f71ac8ee97da98d5f9d7a7c7d7349f43df0c5efdcc0be0fcac47b6c0e115a","download_count":2,"created_at":"2026-11-10T19:56:48Z","updated_at":"2026-11-10T19:56:48Z"}],"body":"**A flag stays a flag, and `q` quits before the dashboard too.** Two things that did not do what the docs and the screen said: a command-line flag was written to your config file by the next save about anything else, and on the launch screen `q` could be taken by a panel you could not see.\n\n## A flag is for the run it is given to\n\nThe guide says \"Flags override the config file for that run\". They also reached the file. Measured on 0.41.0, against a config with `theme = \"octoscope\"`, `refresh_interval = \"60s\"`, `compact = false` and `show_sponsor = true`:\n\n```\noctoscope --theme amber --refresh 5m --compact --no-sponsor\n```\n\nthen `p` twice (public-only on and off again) and `q`. The file then read `amber`, `5m0s`, `true` and `false`. Pinning a repository or saving the settings panel did the same, and `--public-only` went the same way.\n\nA config write now leaves a setting the run took from a flag as the file had it. A setting you change in the app is a choice and is saved: a row of the settings panel whose value you changed, or `p`. Closes [#260](https://github.com/gfazioli/octoscope/issues/260). ([#263](https://github.com/gfazioli/octoscope/pull/263))\n\nOne thing that may read as a change: if you used a flag once to set something for good, it no longer sticks. Change that row in the settings panel (`,`) instead.\n\n## `q` quits on the launch screen\n\nBefore the first dashboard octoscope draws the launch screen, which shows one key: `q quit`. Nothing that draws on the dashboard is on screen there, and the keys that open those things still worked:\n\n| On the launch screen, 0.41.0 | What happened |\n| --- | --- |\n| `,` then `q` | the settings panel opened behind the screen and took the `q`: no quit |\n| a list tab chosen ahead, `/`, then `q` | a filter box opened and the `q` was typed into it |\n| `p` | public-only switched and the config was written, with nothing on screen to say so |\n\nUntil there is a dashboard the screen now takes `q`, `ctrl+c`, the two overlays it can draw (`?` and `%`) and a tab chosen ahead (`1`–`8`, `tab`), which is where the dashboard opens. Every other key does nothing. This is 0.41.0's error-screen rule, taken to the screen before it. Closes [#261](https://github.com/gfazioli/octoscope/issues/261). ([#264](https://github.com/gfazioli/octoscope/pull/264))\n\nWhat is given up: a filter typed before the first dashboard arrives is no longer kept.\n\n## Notable polish\n\n- **The release's own Homebrew check passes again.** v0.41.0's post-release cask check went red on a cask that installs: it turned Homebrew's JSON API off, which on the current CI image sent the cask's one formula dependency through a six-minute clone and then did not find it. The check now installs the way a Mac does. Installs and upgrades were never affected. Closes [#259](https://github.com/gfazioli/octoscope/issues/259). ([#262](https://github.com/gfazioli/octoscope/pull/262))\n- **README and the flags guide** say it in so many words: a flag is never saved, a setting changed in the app is.\n\n## Tests\n\n- **Flags.** Every flag and then an unrelated config write; the same values read from the file, which are written as before; one flag at a time; `p` twice; and the settings panel saved with nothing changed, with each row changed alone, and with every row changed.\n- **The launch screen.** 15 keys that must do nothing there (no command, no surface, no tab, sort or public-only change, no config write, no fetch) and `q` quitting after each; the tab keys and the dashboard arriving on the tab chosen; `?`, `%`, `ctrl+c`; and the same keys back once the dashboard is on screen.\n- **Mutation-tested.** 20 mutants over the flags and 9 over the launch screen: every one fails a test.\n- **In the real binary**: the measured flag sequence leaves the file as it was, and `,` then `q` on the launch screen quits, where 0.41.0 kept running.\n- **Reviewed by Codex**, one pass per pull request. Every finding was verified against the code before it was applied.\n\n## Upgrade\n\n```\nbrew upgrade gfazioli/tap/octoscope\n```\n"}
