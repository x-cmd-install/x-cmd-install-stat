"2026-09-13T16:14:49Z"},{"id":561517867,"node_id":"RA_kwDOSI1tKc4heBUr","name":"octoscope_0.34.3_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6397875,"digest":"sha256:4c31c16a132b9191017409dece1e9342e183898cd41e242c165d775f7719aa45","download_count":5,"created_at":"2026-09-13T16:14:47Z","updated_at":"2026-09-13T16:14:48Z"},{"id":561517937,"node_id":"RA_kwDOSI1tKc4heBVx","name":"octoscope_0.34.3_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":7000365,"digest":"sha256:a2d1d50eb947326782cd6db36688f21d5bd5a9ca1d2173d4b967a6393c94a5c3","download_count":2,"created_at":"2026-09-13T16:14:50Z","updated_at":"2026-09-13T16:14:50Z"},{"id":561517906,"node_id":"RA_kwDOSI1tKc4heBVS","name":"octoscope_0.34.3_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19156480,"digest":"sha256:17f65a212db29d35b0a87b957562486e4a4282fcd12b3766f510317273e3a01c","download_count":1,"created_at":"2026-09-13T16:14:49Z","updated_at":"2026-09-13T16:14:50Z"},{"id":561517940,"node_id":"RA_kwDOSI1tKc4heBV0","name":"octoscope_0.34.3_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6971575,"digest":"sha256:6f5753627b5caf339e9e85bdecd6ed02f1a0b08358c3cdf3c5bbf11b3233528f","download_count":0,"created_at":"2026-09-13T16:14:50Z","updated_at":"2026-09-13T16:14:50Z"}],"body":"**The macOS binaries are signed and notarized.** Every one octoscope has ever shipped carried the ad-hoc signature the Go linker applies \u2014 `Identifier=a.out`, no team identifier, nobody's identity. From this release they carry a Developer ID certificate and a notarization ticket from Apple.\n\n## What this fixes for you\n\nIf you install with Homebrew, nothing changes: it already worked, because the cask clears the quarantine flag on install.\n\nIf you **downloaded a `.tar.gz` or a bare executable from the Releases page**, it did not work \u2014 macOS refused to run it once the download had been flagged `com.apple.quarantine`, which is what a browser download does. That path works now.\n\nThe measurement worth passing on, because the intuitive fix is the wrong one: **signing without notarizing changes nothing at all.** A binary with a valid Developer ID signature, hardened runtime and Apple timestamp is still killed under quarantine \u2014 `spctl` answers `rejected / source=Unnotarized Developer ID` and the process dies on SIGKILL, exactly as the ad-hoc one did. Gatekeeper looks for the notarization ticket; the signature is only its prerequisite.\n\nThe cask keeps clearing the quarantine flag, deliberately. A notarization ticket cannot be stapled into a bare executable \u2014 `stapler` wants a bundle \u2014 so Gatekeeper resolves it online at first run. Clearing the flag is what keeps a first run with no network working.\n\n## The release now verifies itself on macOS\n\nA green release did not mean a notarized one. goreleaser's notary pipe fails on an `Invalid` or `Rejected` verdict, but on a **timeout** it logs and carries on \u2014 so a slow notary could publish a signed-but-unnotarized binary behind a green build, which is precisely how 0.34.1 went out broken.\n\nSo there is a new job that reads no logs. It downloads what was published, asserts the team identifier and hardened runtime on both architectures, asserts Gatekeeper calls them notarized, re-applies the quarantine flag by hand and **runs the binary**. Then it installs the published cask and compares the installed binary's SHA-256 against the archive it just verified.\n\nIt also carries a control: the same binary re-signed ad-hoc, which must run unquarantined and must die under quarantine. Without it, the whole job would pass on a runner where Gatekeeper is not enforcing \u2014 a check that cannot fail is worse than no check.\n\nUntil now nothing automated had ever executed octoscope on a Mac.\n\n## Homebrew 7.0.0\n\nReleased the same day, and checked rather than assumed: the `postflight` \u2192 `postflight_steps` deprecation is one octoscope migrated in 0.34.2, and 7.0's new sandbox restrictions on launching processes do not block the cask's quarantine step. Verified by installing the published cask against 7.0.0 and confirming the staged binary comes out runnable.\n\n## Notable polish\n\n- The release workflow refuses to start unless all five signing secrets are present, so a renamed or deleted secret can no longer publish an unsigned release instead of failing.\n- The cask verification is gated to stable tags, since goreleaser does not push the tap for a prerelease.\n- The README and the guide previously said pre-0.34.3 binaries \"would not run at all once downloaded\". Measured and corrected: `curl` sets no quarantine attribute, so that path always worked. The refusal needs the flag.\n- The UI rendering conventions moved out of the root `CLAUDE.md` into `internal/ui/`, where they load when the code they describe is being edited.\n\n## Tests\n\nThe full suite, plus `actionlint` and `shellcheck` over the new workflow job \u2014 and both were themselves checked by injecting a deliberate error and requiring it to be caught, since a linter that silently skips a file reports the same green as one that found nothing.\n\n## Upgrade\n\n```\nbrew upgrade gfazioli/tap/octoscope\n```\n\nComing from a version before 0.34.0, when the tap shipped a formula rather than a cask:\n\n```\nbrew uninstall octoscope\nbrew install --cask gfazioli/tap/octoscope\n```\n"}
