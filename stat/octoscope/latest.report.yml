"2026-09-12T18:45:12Z"},{"id":559766199,"node_id":"RA_kwDOSI1tKc4hXVq3","name":"octoscope_0.34.0_macOS_arm64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6390058,"digest":"sha256:42ed78684d308fde60687274fdeef20dcf1dd69f0113c37d685e9e9d72cc201b","download_count":0,"created_at":"2026-09-12T18:45:08Z","updated_at":"2026-09-12T18:45:09Z"},{"id":559766254,"node_id":"RA_kwDOSI1tKc4hXVru","name":"octoscope_0.34.0_macOS_x86_64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6845398,"digest":"sha256:582c03dd776e0f25ca77000ad9843795735bbc4ccc9f8c947149b115de957df1","download_count":0,"created_at":"2026-09-12T18:45:10Z","updated_at":"2026-09-12T18:45:11Z"},{"id":559766248,"node_id":"RA_kwDOSI1tKc4hXVro","name":"octoscope_0.34.0_windows-amd64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19155456,"digest":"sha256:98a6de413993ddfbff088a88aff205aa1da2d8766405465fad8068a56f016caf","download_count":1,"created_at":"2026-09-12T18:45:10Z","updated_at":"2026-09-12T18:45:11Z"},{"id":559766279,"node_id":"RA_kwDOSI1tKc4hXVsH","name":"octoscope_0.34.0_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6971317,"digest":"sha256:cbb94b016d265181e7bf1f99e729135b48797e49e11b58e8e65f97d851bf1d0e","download_count":0,"created_at":"2026-09-12T18:45:11Z","updated_at":"2026-09-12T18:45:12Z"}],"body":"## The scan stops reporting things you did not do\n\nFour of this release's changes are the same sentence from different angles: a security signal is only worth reading if it fires on what happened, not on what you did to your own repository. A moved workspace was being reported as a dependency that began executing code at install. Upgrading to this release would have been reported as the same thing. Two findings of equal weight came out in whatever order Go's map iteration produced, so the report shuffled between runs. And the place the axis would have paid most \u2014 a monorepo with thousands of dependencies \u2014 was the place it stopped reading.\n\n## A workspace is identified by its name, not its location\n\nThe lockfile parser keyed a workspace package by its entry path, so renaming `packages/cli` to `apps/cli` read as one dependency starting to run code at install and another stopping. A monorepo reorganisation produced a burst of them at once, which is the shape most likely to teach a reader to skip an axis.\n\nThe fix was measured before it was chosen. Across 115 workspace entries in seven npm-workspace monorepos, npm writes the `name` field exactly when it differs from the directory's basename \u2014 85 entries carried one, and all 85 differed. So the declared name wins and the fallback is the last path segment, which is the half the obvious reading would have missed: \"read `name`, else the path\" would have fixed 3 of the 7 real install-script workspaces in that sample.\n\nA workspace also records the sentinel rather than any content hash. Those same 115 entries carried zero `integrity` and zero `resolved` fields, because a workspace is local source \u2014 and accepting one from a crafted lockfile is what would let two colliding keys forge a *same version, different bytes* finding, the heaviest claim this axis makes.\n\n## Upgrading to this version is not itself a finding\n\nThat key change would have made the first scan after this release report every install-script workspace as newly arrived, at weight 2. The recorded baseline now carries the key format it was written in, so an older one reads as **not comparable** \u2014 the wording the report already uses for a surface it has never seen \u2014 instead of being diffed against a different naming scheme. It costs one scan: the surface is rewritten in the current format as that scan goes.\n\n## Big monorepo lockfiles are compared again\n\nThe lockfile read shared the 1.5 MiB cap that bounds what gets handed to entropy and obfuscation analysis. Different question, wrong budget. It has its own 4 MiB ceiling now, chosen against two measurements rather than a guess: thirteen real root `package-lock.json` files \u2014 WordPress/gutenberg at 1.81 MiB and puppeteer at 1.63 were both above the old cap \u2014 and what the parse actually allocates, about 29 MiB of transient allocation for a pathological 4 MiB lockfile, once per scan, re-derivable from a committed benchmark.\n\nThe cap is enforced twice: on the size the tree reports, which costs no request, and on the bytes actually read.\n\n## The same scan reads the same twice\n\nFindings of equal weight on one path were emitted in map order, so re-running a scan could shuffle that block. The report is meant to be run twice and compared by eye \u2014 that is the whole argument behind the comparison window and the delta axis \u2014 so the order is decided rather than inherited.\n\n## Homebrew installs a cask\n\ngoreleaser deprecated the formula generator, so `goreleaser check` could not be used as a gate. It exits 0 now, and a cask serves Linux Homebrew as well as macOS.\n\n**If you installed through the formula**, the one-time move is:\n\n```sh\nbrew uninstall octoscope\nbrew install --cask gfazioli/tap/octoscope\n```\n\nmacOS notifications still pull in `terminal-notifier`, scoped to macOS so a Linux install is no longer asked for a macOS-only formula.\n\n## Notable polish\n\n- The baseline's **write semantics** are documented where a user meets them: every completed scan attempts the write, with no confirmation step and whatever the verdict \u2014 so scanning a repository that is already compromised makes that state the baseline. A scan that returns an error attempts nothing, and an unreadable lockfile is not such an error.\n- Every blob read drops the base64 envelope, which removes two full-size copies of every file the scan reads.\n- A failed GitHub Pages deployment stops being invisible: CI fails when this commit's site build errored, and says so when the most recent build errored for another.\n\n## Tests\n\nEach behaviour change is pinned by a test measured failing before the fix, and several by mutation: removing the sort restores the shuffle, equalising the two caps trips its own guard, removing the read bound lets a 10 MiB body be allocated behind a 64-byte cap, and putting the lockfile read back on the blob budget restores the unread disclosure.\n\n## Upgrade\n\n```sh\nbrew upgrade gfazioli/tap/octoscope\n```\n\nor, coming from the formula, the uninstall/install pair above.\n"}
