on/pull/12432\n- `@remotion/web-renderer`: Allow muted video preview with unsupported audio by @alec-watts in https://github.com/remotion-dev/remotion/pull/12436\n- `@remotion/effects`: [Add `longShadows()` for directional shadows](https://www.remotion.dev/docs/effects/long-shadows) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12458\n\n## Elements\n\n- Redesign catalog layout by @samohovets in https://github.com/remotion-dev/remotion/pull/12455\n- Simplify third-party library browsing by @samohovets in https://github.com/remotion-dev/remotion/pull/12422\n- Link sidebar categories to catalog sections by @samohovets in https://github.com/remotion-dev/remotion/pull/12394\n- Buffer spinning globe until loaded by @samohovets in https://github.com/remotion-dev/remotion/pull/12424\n- Match globe preview background to other elements by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/ac4a127eaa\n- Fix catalog spacing and redundant heading in iframe mode by @samohovets in https://github.com/remotion-dev/remotion/pull/12536\n\n## Templates\n\n- Element Library: Add authoring lint rules by @samohovets in https://github.com/remotion-dev/remotion/pull/12428\n\n## Docs\n\n- [Move Element authoring guides into a dedicated section](https://www.remotion.dev/docs/elements/libraries) by @samohovets in https://github.com/remotion-dev/remotion/pull/12453\n- [Explain why there is no Remotion app](https://www.remotion.dev/docs/miscellaneous/no-remotion-app) by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/8115099fb9\n- Link the SDK webhook helpers from the webhook pages by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12420\n- Link Element Library template from integration guide by @samohovets in https://github.com/remotion-dev/remotion/pull/12425\n- Scope Element entrance and exit guidance to overlays by @samohovets in https://github.com/remotion-dev/remotion/pull/12429\n- Terms: Merge client-side and server-side into just