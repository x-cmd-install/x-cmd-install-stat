ion/studio`: Reduce timeline zoom rendering work by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12407\n- `@remotion/studio`: Reduce timeline work during playback and Series dragging by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12465\n- `@remotion/studio`: Reduce selection outline work during playback by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12469\n- `@remotion/studio`: Reduce inspector and timeline re-renders during playback by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12471\n- `@remotion/studio`: Only rerender edited elements when saving prop changes by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12472\n- `@remotion/studio`: Speed up canvas outlines and long transition timelines by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12474\n- `@remotion/studio`: Speed up source remapping when editing large compositions by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12482\n- `@remotion/studio`: Skip volume curve sampling for offscreen timeline clips by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12488\n- `@remotion/studio`: Avoid repeated track scans when inspecting multiple sequences by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12490\n- `@remotion/studio`: Avoid rerendering unchanged source subscribers by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12493\n- `@remotion/studio`: Avoid repeated scans when selecting many timeline items by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12496\n- `@remotion/studio`: Avoid repeated scans for timeline selection highlights by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12501\n- `@remotion/studio`: Reduce memory used by large timeline selections by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12504\n- `@remotion/studio`: Speed up multi-selection inspector previews by @JonnyBurger in https://github