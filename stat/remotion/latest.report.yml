ks by @parbhatkapila4 in https://github.com/remotion-dev/remotion/pull/12521\n- `@remotion/lambda-php`: Add `renderStillOnLambda()` by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12524\n- `@remotion/media`: Bound the preview reveal frame cache by @alec-watts in https://github.com/remotion-dev/remotion/pull/12540\n- `@remotion/media`: Release abandoned preview startup on disposal by @alec-watts in https://github.com/remotion-dev/remotion/pull/12541\n- `@remotion/media-utils`: Fix non-finite values in `visualizeAudio()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12555\n- `@remotion/media-utils`: Ignore stale `useAudioData()` requests by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12570\n- `@remotion/media-utils`: Fix audio context leaks in `getAudioData()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12576\n- `@remotion/media-utils`: Fix multichannel audio corruption in `audioBufferToDataUrl()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12586\n- `@remotion/paths`: Fix geometry of relative quadratic paths by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12547\n- `@remotion/paths`: Fix `translatePath()` for paths starting with `m` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12553\n- `@remotion/player`: Fix browser rewind and fast-forward seeking by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12543\n- `@remotion/player`: Fix component updates with `noSuspense` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12579\n- `@remotion/player`: Fix keyboard trapping in the playback-speed menu by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12581\n- `@remotion/renderer`: Don't deadlock when concurrent renders merge 32+ audio tracks by @parbhatkapila4 in https://github.com/remotion-dev/remotion/pull/12539\n- `@remotion/renderer`: Fix downloads with relative redirect paths by @JonnyBurger in https://