{"id":400196378,"author":{"login":"JonnyBurger","id":1629785,"node_id":"MDQ6VXNlcjE2Mjk3ODU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFx3wc4X2oMa","tag_name":"v4.0.531","target_commitish":"main","name":"v4.0.531","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-30T15:00:04Z","updated_at":"2026-09-30T15:40:40Z","published_at":"2026-09-30T15:40:40Z","assets":[],"body":"## What's Changed\n\n- `remotion`: Adapt HTML-in-canvas to Chrome 157 implementation by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11829\n- `remotion`: Fix connected compositions for `Interactive.withSchema()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11814\n- `remotion`: Hide composition-root `Interactive.withSchema()` sequence from timeline by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11836\n- `remotion`: Remove `loop` from `Interactive.baseSchema` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11800\n- `@remotion/studio`: Split captions with Enter by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11805\n- `@remotion/studio`: Link update release titles to GitHub releases by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11830\n- `@remotion/studio`: Remove uneven dimension warnings from composition dialogs by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11810\n- `@remotion/studio`: Fix multi-selection timeline resize flicker by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11806\n- `@remotion/studio`: Fix vertical timeline jump while scrubbing by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11838\n- `@remotion/timeline-utils`: Display timeline waveforms on a decibel scale by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11804\n- `@remotion/transitions`: Show `TransitionSeries.Overlay` in JSX order in Studio by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11841\n- `@remotion/studio-server`: Reject file source paths outside the project by @DeryFerd in https://github.com/remotion-dev/remotion/pull/11751\n- `@remotion/cli`: Fall back to Webpack in WebContainers by @samohovets in https://github.com/remotion-dev/remotion/pull/11799\n- `@remotion/renderer`: Compensate libfdk_aac priming when muxing ADTS into MP4/MOV by @nicolascoutureau in https://github.com/remotion-dev/remotion/pull/11705\n- `@remotion/renderer`: Require `videoBitrate` with `encodingBufferSize` for VP8, VP9 and AV1 by @developerjillur in https://github.com/remotion-dev/remotion/pull/11818\n- `create-video`: Default Tailwind prompt to No and fix installation opt-out by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11812\n- `create-video`: Suppress npm install warnings by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11807\n- `@remotion/promo-pages`: Add Browser Studio links to templates by @samohovets in https://github.com/remotion-dev/remotion/pull/11803\n\n## Elements\n\n- Add Speed Lines storytelling element by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11843\n- Make caption Elements flexible in size by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11802\n- Cap library card widths and limit rows to three columns by @samohovets in https://github.com/remotion-dev/remotion/pull/11833\n- Fix navbar flash on first Studio library load by @samohovets in https://github.com/remotion-dev/remotion/pull/11828\n\n## Templates\n\n- Hello World template: Make title and logo editable in Studio by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11848\n- Electron template: Bump electron from 40.8.5 to 40.10.2 by @app/dependabot in https://github.com/remotion-dev/remotion/pull/11822\n\n## Skills\n\n- Open Studio preview before building videos by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11837\n- Premount timed components in Remotion markup by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11840\n\n## Docs\n\n- [Make Browse Elements in Studio discoverable](https://remotion.dev/docs/studio/browse-elements) by @samohovets in https://github.com/remotion-dev/remotion/pull/11797\n- Clarify ElevenLabs transcript input formats by @samohovets in https://github.com/remotion-dev/remotion/pull/11821\n\n## Internal and Experimental\n\n- `@remotion/canvas`: Add `queueSequenceNodePathRemappings()` to apply codemod remappings with the next Fast Refresh by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11778\n- `@remotion/agent-plugin`: Remove portable manifest from Codex releases by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11808\n- remotion.dev/brand: Make the Whats New video editable in Studio by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11811\n- Internal testbed: Add WhatsNew video composition by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11825\n- Internal testbed: Make Portfolio text layers editable by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11831\n- Internal: Add `--old` option to `./new` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11827\n- Skills: Add timed PR workflow script by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11834\n\n## New Contributors\n\n- @DeryFerd made their first contribution in https://github.com/remotion-dev/remotion/pull/11751\n\n**Full Changelog**: https://github.com/remotion-dev/remotion/compare/v4.0.530...v4.0.531\n","mentions_count":5}
