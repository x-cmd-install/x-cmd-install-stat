{"id":434936384,"author":{"login":"JonnyBurger","id":1629785,"node_id":"MDQ6VXNlcjE2Mjk3ODU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFx3wc4Z7JpA","tag_name":"v4.0.541","target_commitish":"main","name":"v4.0.541","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-05T07:56:03Z","updated_at":"2026-11-05T08:22:08Z","published_at":"2026-11-05T08:22:08Z","assets":[],"body":"## What's Changed\n\n- [`@remotion/lambda`: Allow custom function names to `deployFunction()`](https://remotion.dev/docs/lambda/custom-function-names) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12849\n- `remotion`: Forward Solid data and aria props to its canvas by @alec-watts in https://github.com/remotion-dev/remotion/pull/12933\n- `remotion`: Round fractional `rgb()` channels in `interpolateColors()` by @kevin9327 in https://github.com/remotion-dev/remotion/pull/12912\n- `remotion`: Remove broken `requestVideoFrameCallback` time comparison from media sync by @samohovets in https://github.com/remotion-dev/remotion/pull/12903\n- `remotion`: Avoid replaying HTML5 audio after Player buffering by @keiffff in https://github.com/remotion-dev/remotion/pull/12514\n- `@remotion/studio`: Add \"Render and replace\" action to swap a scene for its rendered video by @samohovets in https://github.com/remotion-dev/remotion/pull/12839\n- `@remotion/lambda-client`: Remove the duplicate bundled `fast-xml-parser` dependency by @gongfpp in https://github.com/remotion-dev/remotion/pull/12943\n- `@remotion/lambda-python`: Upload input props to the forced bucket by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12854\n- `@remotion/media`: Fix Windows hardware decoder stalls with high-fps source videos by @alec-watts in https://github.com/remotion-dev/remotion/pull/12842\n- `@remotion/media`: Call `<Video>` `onError` in client-side rendering and respect disallowed fallbacks by @samohovets in https://github.com/remotion-dev/remotion/pull/12901\n- `@remotion/media`: Skip rerunning effects on an unchanged decoded video frame by @FTMManager in https://github.com/remotion-dev/remotion/pull/12878\n- `@remotion/media`: Avoid duplicate animated video effect paints by @samohovets in https://github.com/remotion-dev/remotion/pull/12885\n- `@remotion/motion-blur`: Render a single sample when the shutter angle is 0 by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12913\n- `@remotion/paths`: Fix NaN length of arcs whose radii are scaled up by @b84330808 in https://github.com/remotion-dev/remotion/pull/12910\n- `@remotion/paths`: Cut the closing `Z` command in `cutPath()` by @b84330808 in https://github.com/remotion-dev/remotion/pull/12921\n- `@remotion/renderer`: Gracefully close Chrome to avoid retained macOS code-sign clones by @antidebug in https://github.com/remotion-dev/remotion/pull/12804\n- `@remotion/renderer`: Fix flickering issue on Windows by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12939\n- `@remotion/renderer`: Avoid reusing pages of a browser that was replaced after a crash by @yongjip in https://github.com/remotion-dev/remotion/pull/12896\n- `@remotion/renderer`: Fix render hanging forever after a browser crash by @yongjip in https://github.com/remotion-dev/remotion/pull/12841\n- `@remotion/studio`: Add playback controls to fullscreen preview by @npmisantosh in https://github.com/remotion-dev/remotion/pull/12906\n- `@remotion/studio`: Fix timeline edits, output paths, and tab restoration by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12931\n- `@remotion/studio`: Improve timeline editing, render outputs, captions, and undo/redo by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12875\n- `@remotion/studio`: Keep cursors stable throughout drag gestures by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12940\n- `@remotion/studio`: Fix trim cursors during marquee selection by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12937\n- `@remotion/studio`: Don't show notification after pasting a property onto multiple sequences by @Maxwell-II in https://github.com/remotion-dev/remotion/pull/12941\n- `@remotion/studio`: Open hosted Studio links without a leading slash by @samohovets in https://github.com/remotion-dev/remotion/pull/12926\n- `@remotion/studio`: Fall back to `execCommand('copy')` when the Clipboard API is unavailable by @andriidrok1 in https://github.com/remotion-dev/remotion/pull/12911\n- `@remotion/studio`: Fix 1px video seam at the edge of the fitted preview by @Asyncronize in https://github.com/remotion-dev/remotion/pull/12877\n\n## Templates\n\n- Vibe Code template: Fix visual editing and browser exports by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12932\n\n## Docs\n\n- Fix hydration errors caused by the SWC HTML minifier by @samohovets in https://github.com/remotion-dev/remotion/pull/12930\n- Add Karaoke Captions to product resources by @ParishKhan in https://github.com/remotion-dev/remotion/pull/12871\n- Remove Recorder from Products navbar by @samohovets in https://github.com/remotion-dev/remotion/pull/12887\n\n## Internal and Experimental\n\n- [`@remotion/sdk`: Add `getCanvasKeyframeValueChange()` for editing selected keyframes](https://remotion.dev/docs/sdk/get-canvas-keyframe-value-change) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12932\n- `@remotion/paths`: Prepare arc tangent direction fix for Remotion 5 by @b84330808 in https://github.com/remotion-dev/remotion/pull/12868\n- `@remotion/promo-pages`: Fix pricing terms links across sites by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12919\n- Skills: Add `/fix-root-cause` skill by @samohovets in https://github.com/remotion-dev/remotion/pull/12902\n- Skills: Add `/no-comments` skill by @samohovets in https://github.com/remotion-dev/remotion/pull/12892\n- remotion.dev/brand: Add 2020 Remotion prototype podcast edit by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12895\n- remotion.dev/brand: Polish agentic video and standardize Dark+ visuals by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/72a13b0872\n\n## New Contributors\n\n- @gongfpp made their first contribution in https://github.com/remotion-dev/remotion/pull/12943\n- @kevin9327 made their first contribution in https://github.com/remotion-dev/remotion/pull/12912\n- @npmisantosh made their first contribution in https://github.com/remotion-dev/remotion/pull/12906\n\n**Full Changelog**: https://github.com/remotion-dev/remotion/compare/v4.0.540...v4.0.541\n","reactions":{"total_count":5,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":0,"eyes":0},"mentions_count":16}
