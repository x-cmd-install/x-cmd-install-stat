r in https://github.com/remotion-dev/remotion/pull/11726\n- `@remotion/studio`: Remove preselection from dropdowns without checkmarks by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11649\n- `@remotion/studio`: Disable scroll anchoring in Studio scroll areas by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11644\n- `@remotion/studio`: Fix keyframe timing when changing playback rate by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11653\n- `@remotion/studio`: Fix first keyframe edits in concise-arrow components by @samohovets in https://github.com/remotion-dev/remotion/pull/11646\n- `@remotion/studio`: Fix undo and redo shortcuts and tooltips by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11655\n- `@remotion/studio`: Fix Ask AI when cross-site isolation is enabled by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11656\n- `@remotion/studio`: Fix File menu rerenders on composition change by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11693\n- `@remotion/studio`: Fix split position for clips inside offset sequences by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11735\n- `@remotion/studio`: Fix visual editing flicker during Fast Refresh by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11747\n- `@remotion/studio`: Fix video filmstrip flicker while trimming by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11753\n- `@remotion/studio`: Fix timeline media flicker while trimming by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11763\n- `@remotion/studio`: Fix trim timing tooltip in Canvas Capture by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11765\n- `@remotion/studio`: Fix Visual Editing after splitting multiple items by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11801\n- `remotion`: Add a `wrapInSequence` option to `Interactive.withSchema()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11744\n- `remotion`: Deprecate `outlineRef` in favor of automatic outlines by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11666\n- `remotion`: Fix WebGL contexts of canvas effects not being released on unmount and size change by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11650\n- `remotion`: Distinguish disabled HTML-in-canvas from unsupported browsers by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11758\n- `@remotion/cli`: Normalize terminology to \"Composition ID\" by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11694\n- `@remotion/cli`: Pin `@mediabunny/server` version in `remotion add` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11781\n- `@remotion/codemods`: Set canvas capture `<AbsoluteFill>` duration by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11654\n- `@remotion/codemods`: Fix Canvas Capture with multiple custom cursors by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11710\n- `@remotion/codemods`: Fix Basic Captions insertion formatting by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11772\n- `@remotion/compositor`: Fix full-range video with non-J pixel formats (10/12-bit) being range-expanded twice by @wkasekende in https://github.com/remotion-dev/remotion/pull/11712\n- `@remotion/media`: Add a `maxCanvasSinkFrameSize` prop to `<Video>` for smaller preview frames by @DonCarignan in https://github.com/remotion-dev/remotion/pull/11730\n- `@remotion/media`: Fix preview audio gaps with premounting by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11761\n- `@remotion/motion-blur`: Fix duplicate timeline layers in `<HtmlInCanvasMotionBlur>` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11691\n- `@remotion/renderer`: Enable row-based multithreading for VP9 by @developerjillur in https://github.com/remotion-dev/remotion/pull/11677\n- `@remotion/renderer`: Fix a crash after a page function throws by @developerjillur in https://github.com/remotion-dev/remotion/pull/11680\n- `@remotion/renderer`: Use each frame's render time for `slowestFrames` by @developerjillur in https://github.com/remotion-dev/remotion/pull/11722\n- `@remotion/renderer`: Take the output extension from the last path segment only by @developerjillur in https://github.com/remotion-dev/remotion/pull/11738\n- `@remotion/studio-protocol`: Deprecate contextual composition ID by @samohovets in https://github.com/remotion-dev/remotion/pull/11752\n- `@remotion/studio-protocol`: Remove 5 minute focused Studio timeout by @samohovets in https://github.com/remotion-dev/remotion/pull/11749\n- `@remotion/studio-server`: Print URL when Studio is already running by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11785\n- `@remotion/transitions`: Fix `TransitionSeries` presentations rendering outside transition ranges by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11720\n- `@remotion/web-renderer`: Crop scaled video dimensions to even values by @alec-watts in https://github.com/remotion-dev/remotion/pull/11587\n- `@remotion/web-renderer`: Fix positioned SVG elements rendering blank by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11742\n- `create-video`: Fix npm audit warnings in generated projects by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11796\n\n## Elements\n\n- Add hover install button to library cards by @samohovets in https://github.com/remotion-dev/remotion/pull/11659\n- Fix Studio installation without a selected composition by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11717\n- Install into the sole unfocused Studio tab by @samohovets in https://github.com/remotion-dev/remotion/pull/11793\n- Keep Studio library open when canceling installation by @samohovets in https://github.com/remotion-dev/remotion/pull/11794\n- Restore inline Studio install guidance on detail pages by @samohovets in https://github.com/remotion-dev/remotion/pull/11790\n- Hide docs navigation in Studio library iframe by @samohovets in https://github.com/remotion-dev/remotion/pull/11762\n- Remove height prop from caption elements by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11775\n- Remove obsolete ref forwarding by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11724\n\n## Skills\n- Skills: Make timeline better editable by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11788\n\n## Docs\n\n- [Restructure motion blur guide and API URLs](https://remotion.dev/docs/motion-blur/api) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11678\n- Fix asset 404s during deployments by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11672\n- Add BrewReel to resources (Tooling) by @Finderchangchang in https://github.com/remotion-dev/remotion/pull/11733\n\n## Internal and Experimental\n\n- `@remotion/studio`: Rename the Studio operations to `deleteNodes()`, `duplicateNodes()`, `wrapNode()`, `splitSequences()` and `insertCompositionElement()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11671\n- [`@remotion/codemods`: Replace `addSolid()`, `addMedia()` and `addComponent()` with `createElement()` and `addElement()`](https://remotion.dev/docs/codemods/add-element) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11667\n- `@remotion/canvas`: Add `onSequencePropsChange` to `<Canvas>` for moving elements by dragging outlines by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11700\n- `@remotion/canvas`: Add automatic outlines for `<Sequence layout=\"none\">` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11642\n- `@remotion/canvas`: Fix timeline crash after ThreeCanvas unmounts by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11692\n- [`@remotion/canvas`: Add `getCanvasKeyframeToggle()` and `startCanvasKeyframeDrag()` for editing keyframes outside the Studio](https://remotion.dev/docs/canvas/get-canvas-keyframe-toggle) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11716\n- [`@remotion/canvas`: Add `getCanvasKeyframeEasingChange()` and `getCanvasKeyframeSettingsChange()` for editing easings and interpolation settings outside the Studio](https://remotion.dev/docs/canvas/get-canvas-keyframe-easing-change) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11728\n- [`@remotion/canvas`: Add `controller.overrides` and `controller.setSequenceNodePaths()` for editing mounted sequences outside the Studio](https://remotion.dev/docs/canvas/get-canvas-sequence-source-location) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11641\n- Skills: Fix examples that import missing exports by @developerjillur in https://github.com/remotion-dev/remotion/pull/11670\n- Skills: Fix npm token handling in release skill by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11662\n- Internal: Add local create-video scaffold script by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11774\n- Internal: Use local Remotion packages in `./new` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11786\n- Internal tests: Consolidate embedded video frame accuracy renders by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/11718\n\n**Full Changelog**: https://github.com/remotion-dev/remotion/compare/v4.0.529...v4.0.530\n","mentions_count":7}
