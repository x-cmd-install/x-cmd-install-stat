{"id":449826022,"author":{"login":"JonnyBurger","id":1629785,"node_id":"MDQ6VXNlcjE2Mjk3ODU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFx3wc4az8zm","tag_name":"v4.0.545","target_commitish":"main","name":"v4.0.545","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-18T09:39:37Z","updated_at":"2026-11-18T10:29:30Z","published_at":"2026-11-18T10:29:30Z","assets":[],"body":"## What's Changed\n\n- [**Remotion now supports proper motion blur**](https://remotion.dev/motion-blur)\n- `@remotion/transitions`: Add `motionBlur` to `TransitionSeries.Transition` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13005\n- `remotion`: Reject non-finite volume values by @DeryFerd in https://github.com/remotion-dev/remotion/pull/13473\n- `remotion`: Align package license declarations by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13433\n- `@remotion/cli`: Stop listing `--public-license-key` for `render` and `still` by @samohovets in https://github.com/remotion-dev/remotion/pull/13438\n- `@remotion/eslint-config-flat`: Bundle patched minimatch and brace-expansion by @andriidrok1 in https://github.com/remotion-dev/remotion/pull/13309\n- `@remotion/media`: Fix seek intent for videos inside `Freeze` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13490\n- `@remotion/media`: Point to CORS docs when a network error causes a fallback by @samohovets in https://github.com/remotion-dev/remotion/pull/13440\n- `@remotion/motion-blur`: Add GPU compositing to `HtmlInCanvasMotionBlur` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13452\n- `@remotion/motion-blur`: Add `disabledInPreview` to `<HtmlInCanvasMotionBlur>` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13488\n- `@remotion/motion-blur`: Reuse media frames across samples by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13498\n- `@remotion/renderer`: Print a one-line error when a usage event can't be sent by @samohovets in https://github.com/remotion-dev/remotion/pull/13437\n- `@remotion/renderer`: Keep the original error as `cause` when an asset download fails by @samohovets in https://github.com/remotion-dev/remotion/pull/13441\n- `@remotion/skills`: Fix Claude plugin packaging by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13434\n- `@remotion/skills`: Distinguish requirements from capabilities by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13484\n- `@remotion/studio`: Fix MPEG-2.5 MP3 and MPEG-2 AAC files being rejected on import by @adityajai119 in https://github.com/remotion-dev/remotion/pull/13411\n- `@remotion/studio`: Show a multi-effect context menu when several effects are selected by @VAbhijeetCD in https://github.com/remotion-dev/remotion/pull/13418\n- `@remotion/studio-server`: Normalize file watcher keys case-insensitively on Windows by @EnesKartal in https://github.com/remotion-dev/remotion/pull/13420\n- `@remotion/transitions`: Use GPU compositing for transition motion blur by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13487\n- `@remotion/transitions`: Warm up transitions during premounting by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13497\n- `@remotion/web-renderer`: Draw inset and spread box shadows by @alec-watts in https://github.com/remotion-dev/remotion/pull/13030\n- `@remotion/web-renderer`: Fix registered fonts in SVG `foreignObject` exports by @alec-watts in https://github.com/remotion-dev/remotion/pull/13109\n- `@remotion/web-renderer`: Fix CJK text overlapping when words wrap by @jeffierw in https://github.com/remotion-dev/remotion/pull/13429\n- `@remotion/web-renderer`: Fix audio sample alignment for nonzero frame ranges by @alec-watts in https://github.com/remotion-dev/remotion/pull/13454\n- `@remotion/web-renderer`: Keep still and frame renders progressing in background tabs by @samohovets in https://github.com/remotion-dev/remotion/pull/13469\n- `@remotion/web-renderer`: Embed CSS `@font-face` fonts into SVG text by @samohovets in https://github.com/remotion-dev/remotion/pull/13470\n- `@remotion/web-renderer`: Wait for fonts that are still loading by @samohovets in https://github.com/remotion-dev/remotion/pull/13480\n- `create-video`: Extract templates into a unique temporary directory by @DeryFerd in https://github.com/remotion-dev/remotion/pull/13477\n\n## Templates\n\n- Remove manual premounting from examples by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13451\n- Bump next from 16.4.1 to 16.4.5 in /packages/template-vibe-code by @app/dependabot in https://github.com/remotion-dev/remotion/pull/13457\n\n## Docs\n\n- Mention the Remotion SDK on the embed Studio page by @Dani-Google in https://github.com/remotion-dev/remotion/pull/13422\n- Explain how to pass a license key on Lambda and how to verify usage events by @samohovets in https://github.com/remotion-dev/remotion/pull/13436\n- Serve folder-named pages like /docs/studio as .md by @samohovets in https://github.com/remotion-dev/remotion/pull/13439\n- Track HTML-in-canvas iframe crashes and memory growth by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13467\n- Shorten `disabledInPreview` description by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13489\n\n## Internal and Experimental\n\n- License platform: Fix invitation links with trailing slashes by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13430\n- License platform: Fix trailing slash bugs by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13432\n- Bump astro from 7.3.3 to 7.4.7 in /packages/astro-example by @app/dependabot in https://github.com/remotion-dev/remotion/pull/13399\n- Add skill for triaging external pull requests by @samohovets in https://github.com/remotion-dev/remotion/pull/13493\n- Upgrade Playwright to 1.65.1 for Ubuntu 26.04 support by @samohovets in https://github.com/remotion-dev/remotion/pull/13495\n- Skip full local docs builds in PR readiness checks by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13496\n- remotion.dev/brand: Add motion blur short-form video by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13499\n- remotion.dev/brand: Remove motion blur media manifest by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13512\n\n**Full Changelog**: https://github.com/remotion-dev/remotion/compare/v4.0.544...v4.0.545\n","mentions_count":10}
