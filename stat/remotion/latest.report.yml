{"id":420893428,"author":{"login":"JonnyBurger","id":1629785,"node_id":"MDQ6VXNlcjE2Mjk3ODU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFx3wc4ZFlL0","tag_name":"v4.0.538","target_commitish":"main","name":"v4.0.538","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-22T15:02:59Z","updated_at":"2026-10-22T15:32:38Z","published_at":"2026-10-22T15:32:38Z","assets":[],"body":"## What's Changed\n\nMany performance improvements in the Studio!\n\n- `@remotion/studio`: [Preserve pitch when changing playback speed](https://www.remotion.dev/docs/options/preserve-pitch-on-playback) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12423\n- Upgrade Mediabunny to 1.62.0 by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12450\n- `@remotion/media`: Add `preservePitch` to change speed without changing pitch by @alec-watts in https://github.com/remotion-dev/remotion/pull/12350\n- `remotion`: Show notice in `<HtmlInCanvas>` when not supported instead of crash by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12421\n- `remotion`: Fix memory leak when replacing `<Sequence>` children by @alec-watts in https://github.com/remotion-dev/remotion/pull/12291\n- `remotion`: Fix retention of replaced components and callbacks by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12462\n- `remotion`: Fix Studio sequence prop resubscriptions when seeking by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12401\n- `remotion`: Speed up sequential `spring()` calculations by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12516\n- `remotion`: Speed up `interpolateColors()` by reusing color matchers by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12525\n- `remotion`: Speed up `Easing.ease()` evaluations by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12527\n- `remotion`: Skip unused premount frame subscriptions by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12531\n- `remotion`: Skip unchanged `Sequence` layout wrapper renders by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12533\n- `remotion`: Avoid redundant `Html5Audio` volume evaluations by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12535\n- `@remotion/agent-plugin`: Publish on every release by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12459\n- `@remotion/bundler`: Avoid repeated sorting while scanning public assets by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12481\n- `@remotion/codemods`: Speed up `getNodes()` for large compositions by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12486\n- `@remotion/codemods`: Speed up `updateMultipleNodeProps()` for large selections by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12489\n- `@remotion/codemods`: Skip unnecessary scope lookups for numeric props by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12492\n- `@remotion/codemods`: Speed up bulk nonnumeric property edits by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12497\n- `@remotion/codemods`: Speed up `deleteNodes()` and `duplicateNodes()` for large selections by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12502\n- `@remotion/codemods`: Speed up `updateMultipleNodeProps()` and `reorderNodes()` for large selections by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12503\n- `@remotion/google-fonts`: Add font faces to `document.fonts` in a deterministic order by @serdarucel in https://github.com/remotion-dev/remotion/pull/12443\n- `@remotion/google-fonts`: Share the loader across ESM entry points by @alec-watts in https://github.com/remotion-dev/remotion/pull/12476\n- `@remotion/lambda`: Remove `@remotion/serverless` and `@remotion/serverless-client` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12426\n- `@remotion/lambda`: Generate default output key when `outName.key` is omitted by @smartcalsystems-sketch in https://github.com/remotion-dev/remotion/pull/12399\n- `@remotion/lambda`: Don't fail a render when a retried stream replays an artifact by @parbhatkapila4 in https://github.com/remotion-dev/remotion/pull/12452\n- `@remotion/lambda-client`: Accept the raw request body in `validateWebhookSignature()` by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12454\n- `@remotion/lambda-php`: Add `WebhookSignature::validate()` by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12415\n- `@remotion/lambda-ruby`: Add `validate_webhook_signature()` by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12396\n- `@remotion/media`: Fix extra GOP decoded when seeking to fractional MP4 keyframes by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12348\n- `@remotion/media`: Fix memory growth during audio playback by @alec-watts in https://github.com/remotion-dev/remotion/pull/12409\n- `@remotion/media`: Fix automatic audio selection when the preferred track cannot decode by @alec-watts in https://github.com/remotion-dev/remotion/pull/12433\n- `@remotion/media`: Fix audio decoding errors being replaced by timeouts in web renders by @alec-watts in https://github.com/remotion-dev/remotion/pull/12434\n- `@remotion/media`: Close extracted video frames on parallel audio failures by @alec-watts in https://github.com/remotion-dev/remotion/pull/12435\n- `@remotion/media`: Preserve audio and video decode failure details by @alec-watts in https://github.com/remotion-dev/remotion/pull/12437\n- `@remotion/media-utils`: Fix audio data hooks timing out on errors in web renders by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12442\n- `@remotion/paths`: Cut cubic curves at the requested arc length in `cutPath()` by @serdarucel in https://github.com/remotion-dev/remotion/pull/12410\n- `@remotion/player`: Fix audio anchor shifts when `durationInFrames`