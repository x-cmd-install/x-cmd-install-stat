{"id":417511415,"author":{"login":"JonnyBurger","id":1629785,"node_id":"MDQ6VXNlcjE2Mjk3ODU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFx3wc4Y4rf3","tag_name":"v4.0.537","target_commitish":"main","name":"v4.0.537","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-19T16:11:34Z","updated_at":"2026-10-19T16:38:46Z","published_at":"2026-10-19T16:38:46Z","assets":[],"body":"## What's Changed\n\n- `@remotion/effects`: [Add `cylinder()`](https://www.remotion.dev/docs/effects/cylinder) and [`sphere()`](https://www.remotion.dev/docs/effects/sphere) projections by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12351\n- `@remotion/effects`: [Add `pageTurn()`](https://www.remotion.dev/docs/effects/page-turn) and add Peel Element by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12352\n- `@remotion/effects`: [Add `fractalNoise()` for procedural textures](https://www.remotion.dev/docs/effects/fractal-noise) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12354\n- `@remotion/effects`: [Add `turbulentDisplace()` for animated distortion](https://www.remotion.dev/docs/effects/turbulent-displace) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12355\n- `@remotion/effects`: [Add `lensBlur()` for camera defocus](https://www.remotion.dev/docs/effects/lens-blur) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12356\n- `@remotion/effects`: [Add `bevelAlpha()` for raised text and shapes](https://www.remotion.dev/docs/effects/bevel-alpha) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12359\n- `@remotion/captions`: [Add `parseVtt()`](https://www.remotion.dev/docs/captions/parse-vtt) by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12318\n- `remotion`: Default premounting to zero inside `<HtmlInCanvas>` to work around bug by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12373\n- `remotion`: Prevent `<HtmlInCanvas>` from flashing unprocessed HTML before effects finish by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12377\n- `remotion`: Avoid snapshot crashes with nested `<HtmlInCanvas>` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12371\n- `remotion`: Fix `<AnimatedImage>` decoder errors when scrubbing by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12336\n- `remotion`: Fix error message for non-finite `durationInFrames` by @DeryFerd in https://github.com/remotion-dev/remotion/pull/12365\n- `remotion`: Skip frame updates for static interactive components by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12366\n- `remotion`: Skip redundant preparation for unchanged effects by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12368\n- `@remotion/codemods`: Group split clips in a named `Track` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12332\n- `create-video`: Open a shell in newly created projects by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12343\n- `create-video`: Install every skill when Install all skills is selected by @DanielMcSheehy in https://github.com/remotion-dev/remotion/pull/12361\n- `@remotion/lambda`: Reject directory symbolic links during site deployment by @serdarucel in https://github.com/remotion-dev/remotion/pull/12376\n- `@remotion/lambda`: Fix stale output recovery when overwriting renders by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12388\n- `@remotion/maptiler`: Fix crashes when hidden maps become visible again by @samohovets in https://github.com/remotion-dev/remotion/pull/12321\n- Upgrade Mediabunny to 1.61.6 by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12387\n- `@remotion/player`: Keep the playback clock across effect re-runs when `durationInFrames` changes by @chiragjangiir in https://github.com/remotion-dev/remotion/pull/12324\n- `@remotion/renderer`: Bind render server to localhost by default by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12381\n- `@remotion/serverless`: Don't merge a chunk twice when a streamed chunk is retried by @parbhatkapila4 in https://github.com/remotion-dev/remotion/pull/12337\n- `@remotion/studio`: Save and watch default props in the file that registers the composition by @costajohnt in https://github.com/remotion-dev/remotion/pull/12370\n- `@remotion/studio`: Offer project download for server-side rendering in Browser Studio by @samohovets in https://github.com/remotion-dev/remotion/pull/12346\n- `@remotion/studio`: Scale timeline waveforms by static volume by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12330\n- `@remotion/studio`: Hide timeline labels too narrow to show a full character by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/e0a094c7d8a2689432dabbfef328c35b86db7bd5\n- `@remotion/studio`: Fix missing gaps between nested scene clips by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/ba7cc17d5ba99362bc649caea48301d8241bf4d2\n- `@remotion/studio`: Fix connected composition icon clipping in short timeline rows by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/a8cf5c20b2e76399d831c78b6cce7978e7d66a2b\n- `@remotion/studio`: Keep roll trim interactions below timeline ticks by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/b30f31746d3a3ec7a5ab8b412bab256e1d70b6d9\n- `@remotion/studio`: Fix marquee selection starting during rolling edits by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12335\n- `@remotion/studio`: Fix stale source subscriptions after refresh by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12385\n- `@remotion/studio`: Batch sequence prop unsubscriptions by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12327\n- `@remotion/whisper-web`: Stop publishing starting with v5 by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12328\n\n## Elements\n\n- Migrate to `Interactive.create()` by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12339\n- Use dropdown for caption style libraries in Studio by @samohovets in https://github.com/remotion-dev/remotion/pull/12342\n\n## Templates\n\n- Elements: Add starter template for publishing libraries by @samohovets in https://github.com/remotion-dev/remotion/pull/12325\n- Elements: Add Markdown pages and catalogs to library template by @samohovets in https://github.com/remotion-dev/remotion/pull/12382\n\n## Docs\n\n- [Simplify Element contribution guide](https://www.remotion.dev/docs/contributing/elements) by @samohovets in https://github.com/remotion-dev/remotion/pull/12390\n- Add HTML-in-canvas bug tracker by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12378\n- Add rendering alternatives to SSR comparison by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12329\n- Remove NPM Kiosk publishing recommendation by @samohovets in https://github.com/remotion-dev/remotion/pull/12391\n- Remove background-check claim from DPA by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12345\n- Remove Remotion Pro branding from licensing statements by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12393\n\n## Internal and Experimental\n\n- `@remotion/codemods`: [Add `unwrapNode()` to remove wrappers and keep children](https://www.remotion.dev/docs/codemods/unwrap-node) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12334\n- `remotion`: Add a regression test for the AnimatedImage decoder lifecycle by @chiragjangiir in https://github.com/remotion-dev/remotion/pull/12358\n- remotion.dev/brand: Add a 3D timeline comparison by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12333\n- remotion.dev/brand: Center close-up interactions at 1920x1080 by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12340\n- remotion.dev/brand: Add video rolling edit close-up by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/87d7ae2164ad7cc862810b9bfa248328f34507d2\n- remotion.dev/brand: Add source-only trim close-ups by @JonnyBurger in https://github.com/remotion-dev/remotion/commit/36a18eb2c8ff5a5c48741cd5394e9427ee47090d\n- Internal testbed: Consolidate still rendering workflows by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12362\n- Skills: Rewrite editable timeline guidance and example by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/12341\n- Skills: Add Arabic and right-to-left text guidance by @AmroAlemam in https://github.com/remotion-dev/remotion/pull/12374\n\n## New Contributors\n\n- @serdarucel made their first contribution in https://github.com/remotion-dev/remotion/pull/12376\n\n**Full Changelog**: https://github.com/remotion-dev/remotion/compare/v4.0.536...v4.0.537\n","mentions_count":9}
