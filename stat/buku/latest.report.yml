{"id":268115877,"author":{"login":"jarun","id":5959286,"node_id":"MDQ6VXNlcjU5NTkyODY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOArQQOM4P-x-l","tag_name":"v5.1","target_commitish":"master","name":"buku v5.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-12-07T15:03:00Z","updated_at":"2025-12-07T16:47:26Z","published_at":"2025-12-07T15:14:15Z","assets":[],"body":"buku v5.1 release notes.\r\n\r\n- [x] auto-import from Brave Browser\r\n- [x] `amd64` docker image (will be built starting from next release)\r\n- [x] sorting bookmarks by absence/presence of a specific tag\r\n- [x] reordering all bookmarks in DB (based on specified sorting)\r\n- [x] support overriding default URI scheme for `browse()` (@meonkeys)\r\n- [x] include a `Sec-Fetch-Mode` header when fetching a webpage (in case the website admin cares about that)\r\n- [x] source: renaming main file to `buku.py` (which is the name it gets installed as)\r\n- [x] packaging: migrating from [`setup.py`](https://docs.python.org/3.11/install/index.html) to [`pyproject.toml`](https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html) (@branchvincent)\r\n- [x] packaging: [installing the manpage into `pipx` venv](https://pipx.pypa.io/stable/how-pipx-works/#manual-pages) (@branchvincent)\r\n- [x] Python: adding v3.14, removing v3.9\r\n- [x] API: improved BukuCrypt\r\n- [x] Bukuserver: Swagger-based interactive documentation for the web-API\r\n- [x] Bukuserver: option to change initial value of Fetch checkbox in Create Bookmark form\r\n- [x] Bukuserver: migrate from Bootstrap v3 to v4\r\n- [x] migrate to the upcoming flask-admin v2 (see #753) (@LeXofLeviafan)","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":3}
