about:
  description: DockBridge is a Go-based client-server system that provisions Hetzner Cloud servers for Docker containers, with laptop lock detection and keep-alive features. It enables seamless Docker workflows by proxying commands to remote Hetzner Cloud instances, managing server lifecycle by user activity and connection status.
