"gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-bzip2","state":"uploaded","size":9955636,"digest":"sha256:4b132ecdcea17453d9eab92e621811c470a477593521bf44a4bc174776e77c1c","download_count":101,"created_at":"2026-07-05T08:11:04Z","updated_at":"2026-07-05T08:11:10Z"},{"id":466998829,"node_id":"RA_kwDOASUPCM4b1dYt","name":"restic_0.19.1_solaris_amd64.bz2","label":null,"uploader":{"login":"fd0","id":123276,"node_id":"MDQ6VXNlcjEyMzI3Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-bzip2","state":"uploaded","size":9959606,"digest":"sha256:e2c3efaa37968cb67698ecfb2e12bfff5dc2225424caef15e3bbcf3837d8e36b","download_count":64,"created_at":"2026-07-05T08:10:58Z","updated_at":"2026-07-05T08:11:04Z"},{"id":466998746,"node_id":"RA_kwDOASUPCM4b1dXa","name":"restic_0.19.1_windows_386.zip","label":null,"uploader":{"login":"fd0","id":123276,"node_id":"MDQ6VXNlcjEyMzI3Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":10883369,"digest":"sha256:24147168e7988af20e4957d06ab7a9ba73792755150ce1ff270ad586c37fd160","download_count":1441,"created_at":"2026-07-05T08:10:51Z","updated_at":"2026-07-05T08:10:58Z"},{"id":466998668,"node_id":"RA_kwDOASUPCM4b1dWM","name":"restic_0.19.1_windows_amd64.zip","label":null,"uploader":{"login":"fd0","id":123276,"node_id":"MDQ6VXNlcjEyMzI3Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":11237567,"digest":"sha256:da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d","download_count":56226,"created_at":"2026-07-05T08:10:43Z","updated_at":"2026-07-05T08:10:51Z"},{"id":467000668,"node_id":"RA_kwDOASUPCM4b1d1c","name":"SHA256SUMS","label":null,"uploader":{"login":"fd0","id":123276,"node_id":"MDQ6VXNlcjEyMzI3Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2503,"digest":"sha256:fb520966ee01d2a3d4219c66762c66efa56300833b6f639f36082b7462f91cb8","download_count":280775,"created_at":"2026-07-05T08:13:29Z","updated_at":"2026-07-05T08:13:29Z"},{"id":467000659,"node_id":"RA_kwDOASUPCM4b1d1T","name":"SHA256SUMS.asc","label":null,"uploader":{"login":"fd0","id":123276,"node_id":"MDQ6VXNlcjEyMzI3Ng==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":833,"digest":"sha256:649f3a48d322c3d7a457ef58e2dc4c5094b1f823192cdbac3f092ea23e194d9a","download_count":247402,"created_at":"2026-07-05T08:13:28Z","updated_at":"2026-07-05T08:13:29Z"}],"body":"Changelog for restic 0.19.1 (2026-07-05)\r\n=======================================\r\n\r\nThe following sections list the changes in restic 0.19.1 relevant to restic users. The changes are ordered by importance.\r\n\r\nSummary\r\n-------\r\n\r\n * Fix [#5234](https://github.com/restic/restic/issues/5234): Prevent mounting over the repository directory\r\n * Fix [#5667](https://github.com/restic/restic/issues/5667): Skip inaccessible `backup` source paths\r\n * Fix [#5722](https://github.com/restic/restic/issues/5722): Update `mount` latest symlink after snapshot reload\r\n * Fix [#21866](https://github.com/restic/restic/issues/21866): Hide `stats` progress bar in JSON mode\r\n * Fix [#21869](https://github.com/restic/restic/issues/21869): Restore old behavior of `snapshots --latest <n>` without `--group-by`\r\n * Fix [#21876](https://github.com/restic/restic/pull/21876): Show timezone location in `snapshots` output\r\n * Fix [#21879](https://github.com/restic/restic/pull/21879): Prevent crash in mountpoint validation if mountpoint is inaccessible\r\n * Fix [#21895](https://github.com/restic/restic/issues/21895): Remove read-only files via the SFTP backend on Windows servers\r\n * Fix [#21899](https://github.com/restic/restic/issues/21899): Make `backup` respect excludes for duplicate directory entries\r\n\r\nDetails\r\n-------\r\n\r\n * Bugfix #5234: Prevent mounting over the repository directory\r\n\r\n   Using a local repository directory as the `mount` target \u2014 or a path that contains it, or that it contains \u2014 caused the FUSE server to read its own backend files through the new mount, deadlocking the kernel and requiring a long reboot to recover.\r\n\r\n   Restic now resolves both paths and refuses any such overlap with a clear error before mounting.\r\n\r\n    [#5234](https://github.com/restic/restic/issues/5234) [#5348](https://github.com/restic/restic/pull/5348) \r\n\r\n * Bugfix #5667: Skip inaccessible `backup` source paths\r\n\r\n   The `backup` command only skipped source paths that did not exist. A path that could not be accessed for another reason, such as a malformed path on Windows, was kept and produced an empty snapshot. Restic now skips any such path and aborts if none remain.\r\n\r\n    [#5667](https://github.com/restic/restic/issues/5667) [#21852](https://github.com/restic/restic/pull/21852) \r\n\r\n * Bugfix #5722: Update `mount` latest symlink after snapshot reload\r\n\r\n   When `restic mount` was kept running while new snapshots were created, the new snapshots appeared in the mountpoint, but the `latest` symlink could still point to the previously latest snapshot. Restic now invalidates the cached snapshot directory entries after a snapshot reload so that `latest` points to the newest snapshot.\r\n\r\n    [#5722](https://github.com/restic/restic/issues/5722) [#21873](https://github.com/restic/restic/pull/21873) \r\n\r\n * Bugfix #21866: Hide `stats` progress bar in JSON mode\r\n\r\n   Since restic 0.19.0, the `stats` command shows a progress bar. This progress bar was unintentionally displayed also when using the `--json` option, mixing regular text output with JSON. This is now fixed.\r\n\r\n    [#21866](https://github.com/restic/restic/issues/21866) [#21871](https://github.com/restic/restic/pull/21871) \r\n\r\n * Bugfix #21869: Restore old behavior of `snapshots --latest <n>` without `--group-by`\r\n\r\n   Restic 0.19.0 accidentally changed the behavior of `snapshots --latest <n>` to no longer group snapshots by host and paths by default.\r\n\r\n   The `snapshots --latest <n>` command now again uses the old behavior of grouping by host and paths when `--group-by` is not specified. However, when specifying `--group-by` the output is still grouped as requested, as in restic 0.19.0.\r\n\r\n    [#21869](https://github.com/restic/restic/issues/21869) [#21875](https://github.com/restic/restic/pull/21875) \r\n\r\n * Bugfix #21876: Show timezone location in `snapshots` output\r\n\r\n   With restic 0.19.0, the `snapshots` command printed the current timezone when listing snapshots. However, that timezone label might change during the year, for example with daylight saving time. Restic now prints a more consistent and shorter version of the text.\r\n\r\n    [#21876](https://github.com/restic/restic/pull/21876) https://forum.restic.net/t/possible-bug-in-timezone-naming/10867\r\n\r\n * Bugfix #21879: Prevent crash in mountpoint validation if mountpoint is inaccessible\r\n\r\n   Since restic 0.19.0, the `mount` command validates a mountpoint before loading the repository. If restic was unable to stat the mountpoint, this would result in a crash. This has now been fixed to correctly return an error instead.\r\n\r\n    [#21879](https://github.com/restic/restic/pull/21879) \r\n\r\n * Bugfix #21895: Remove read-only files via the SFTP backend on Windows servers\r\n\r\n   Since restic 0.19.0, repository files on the SFTP backend are marked read-only after save. On Windows SFTP servers, removing them failed with a permission error. The SFTP backend now clears the read-only flag before removing the file.\r\n\r\n    [#21895](https://github.com/restic/restic/issues/21895) [#21897](https://github.com/restic/restic/pull/21897) \r\n\r\n * Bugfix #21899: Make `backup` respect excludes for duplicate directory entries\r\n\r\n   Since restic 0.19.0, backing up a directory with duplicate directory entries always produced \"Warning: at least one source file could not be read\", even when those files were excluded. This has now been fixed.\r\n\r\n    [#21899](https://github.com/restic/restic/issues/21899) [#21900](https://github.com/restic/restic/pull/21900) \r\n\r\n","reactions":{"total_count":70,"+1":25,"-1":0,"laugh":1,"hooray":9,"confused":0,"heart":19,"rocket":13,"eyes":3}}
