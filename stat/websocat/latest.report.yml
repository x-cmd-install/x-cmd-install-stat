o cross-compile. Note that for previous version (1.14.0) `arm-unknown-linux-musleabi` does have OpenSSL. As there are few changes between 1.14.0 and 1.14.1, it is recommended to just use the previous version.\r\n* Other Linux and the FreeBSD executables embed OpenSSL 3.5.4.\r\n* Windows and Mac should use native TLS.\r\n\r\n# Other notes\r\n\r\n* You are invited to try [Websocat4](https://github.com/vi/websocat/releases/tag/v4.0.0-alpha3) and file bugs for broken things and/or [vote](https://github.com/vi/websocat/issues/276) for features to be ported from Websocat1.","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":0,"rocket":0,"eyes":0}}
