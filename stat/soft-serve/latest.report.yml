T06:59:29Z","updated_at":"2026-10-23T06:59:31Z"}],"body":"This release fixes 3 security advisories [`GHSA-64rg-mqfg-gqg9`](https://github.com/charmbracelet/soft-serve/security/advisories/GHSA-64rg-mqfg-gqg9), [`GHSA-gv74-crjm-8535`](https://github.com/charmbracelet/soft-serve/security/advisories/GHSA-gv74-crjm-8535) and [`GHSA-9cw6-2v8p-5vhj`](https://github.com/charmbracelet/soft-serve/security/advisories/GHSA-9cw6-2v8p-5vhj) 2 high and 1 medium. It is advised to update your instance of soft serve immediately.\r\n\r\n## Changelog\r\n\r\n### Fixed\r\n* c0c7f4d7b89cca651f4a3d01e3e5797fd560f923: fix: answer HTTP pushes the same for private and missing repositories (@taciturnaxolotl)\r\n* b42d31f3daa04ced6d3244c2006cfcd2e3226f77: fix: disable imports and mirror syncs when git is too old to be safe (@taciturnaxolotl)\r\n* 784cb6d76473e9b0397297be94cabf320a25b139: fix: give one answer for unreadable repositories over SSH git and TUI (@taciturnaxolotl)\r\n* 3f0324c409bb52a403d1b24e86e9c7f3548385f1: fix: keep the server's DNS resolver out of remote validation errors (@taciturnaxolotl)\r\n* bf55b6ba8726faaa83daae59e46f2a685b9ffd51: fix: reject repository names that would nest or alias another repository (@taciturnaxolotl)\r\n* 03ec783da1553787430229fdf836369d917ed644: fix: report a missing repository the same way from every setting (@taciturnaxolotl)\r\n* d9618a71d1472d01c6f30084c474b691feb3dbb9: fix: restrict which ssh hosts users may import from or mirror (@taciturnaxolotl)\r\n* fdbd2ff9a23541ed789bfdfc98d1a4dc8eceb951: fix: stop SSH repo commands from revealing which repositories exist (@taciturnaxolotl)\r\n* 909808dee7ac1e026c69f3304dac2a937e5539f4: fix: stop a failed repository import from hanging the caller (@taciturnaxolotl)\r\n* 85e84d2c1e557cab3a852cbff46422f65f3680da: fix: stop a new repository from being created on top of an existing one (@taciturnaxolotl)\r\n* 01be54014470039778a0c54fc97b8a79be2453fd: fix: stop bearer tokens from revealing which repositories exist (@taciturnaxolotl)\r\n* e0bfa3b324ed96925198577c5a3736aecdd040d6: fix: stop the git daemon from confirming private repository names (@taciturnaxolotl)\r\n* 057c41fba91438c885fb09e1f5faa34e49b138f1: fix: validate import remotes that Go cannot parse instead of trusting them (@taciturnaxolotl)\r\n* 6743887e9e52e2c0d80f326384ccd13c803b040a: fix: verify host keys when the server clones or syncs ssh remotes (@taciturnaxolotl)\r\n### Deps\r\n* 3ae8efcc8a0140d914205c67605a9b450330bc1d: fix(deps): update Go and x/net to clear newly reported vulnerabilities (@taciturnaxolotl)\r\n### Other stuff\r\n* 52ba4c852667ff464675b0876fcb1ca2da257dce: v0.12.4 (@taciturnaxolotl)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/soft-serve/releases/download/v0.12.4/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/soft-serve/releases/download/v0.12.4/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/soft-serve/releases/download/v0.12.4/checksums.txt'\r\nwget 'https://github.com/charmbracelet/soft-serve/releases/download/v0.12.4/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n","mentions_count":1}
