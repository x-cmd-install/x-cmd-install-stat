c4kiNPS","name":"soft-serve_0.12.3_Windows_x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":11541773,"digest":"sha256:8b4df904351d3571029d8d1b71318f88c4569c84967f408f083f6690c4e49f2a","download_count":38,"created_at":"2026-10-05T15:29:54Z","updated_at":"2026-10-05T15:29:56Z"},{"id":612946998,"node_id":"RA_kwDOF1FgSc4kiNQ2","name":"soft-serve_0.12.3_Windows_x86_64.zip.sbom.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":147547,"digest":"sha256:67812d4762563bf4f02a842776a25e2ee396f01d2fca0613922f9e88372a8d10","download_count":3,"created_at":"2026-10-05T15:29:56Z","updated_at":"2026-10-05T15:29:57Z"},{"id":612946908,"node_id":"RA_kwDOF1FgSc4kiNPc","name":"soft-serve_0.12.3_x86.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":11155770,"digest":"sha256:10ba842a18a3f62a628588dde03f84ea325c156e507d839baf172d6e4e1df709","download_count":9,"created_at":"2026-10-05T15:29:55Z","updated_at":"2026-10-05T15:29:56Z"},{"id":612946901,"node_id":"RA_kwDOF1FgSc4kiNPV","name":"soft-serve_0.12.3_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":11750312,"digest":"sha256:cad0abffddd01990f9887ae456d14f429848197756597fd4d93de1a7be31f988","download_count":2,"created_at":"2026-10-05T15:29:54Z","updated_at":"2026-10-05T15:29:56Z"}],"body":"This release fixes three security issues reported by @sondt99 and @Xiaoyiyi23.\r\n\r\n## Security\r\n\r\n### Private repository names disclosed over HTTP ([GHSA-fgxm-5hvv-x4vh], medium)\r\n\r\nSoft Serve's implementation of Go's `?go-get=1` could expose a private repo name that a user didn't have access to.\r\n\r\nThe Git and LFS routes could leak the name as well via status code.\r\n\r\n### `no-access` collaborators could read private repositories ([GHSA-pmgj-8mr6-9rff], medium)\r\n\r\nPreviously on private repositories a `no-access` collaborator was elevated to `read-only` due to a mis ordered check.\r\n\r\n### Repositories could stay public after being made private ([GHSA-f3fj-9625-rv3m], medium)\r\n\r\nRepository records were cached in memory with no expiry and trusted for all access checks. Making a repository private cleared the cache before the change was saved, allow for a race condition where a request arriving before the save took effect could cache the old public record, and the repository would stay readable until the server restarted. Multiple instances sharing a database also had a variant of this which caused the cache of one instance to never get propagated to the others.\r\n\r\n## Fixed\r\n\r\n* Deleting a user who owns repositories always failed with \"database is locked\". It now refuses with a list of the repositories they own.\r\n* A repository whose directory had already been deleted couldn't be deleted. Now the database entry is removed regardless of the directory removal.\r\n* The `repository_visibility_change` webhook fired every time visibility was set, even if the value didn't change.\r\n\r\n## Changelog\r\n### Fixed\r\n* dc351aa0d824c8bef528c6924a7acdfb9f20c852: fix: answer the same for private and missing repositories over HTTP (@taciturnaxolotl)\r\n* 5b307b4da4db285f797cc028b381ba4d3d853019: fix: keep a repository private after its visibility changes (@taciturnaxolotl)\r\n* d108e2c4a395b6995738d740d23c82fd0f9c4828: fix: refuse to delete users who still own repositories (@taciturnaxolotl)\r\n* 0a4e6f0b7e063927c7128756e1c1b3db871edabf: fix: send the visibility webhook only when visibility changes (@taciturnaxolotl)\r\n* bf0f7bb23f6d81ff3244e640dbbde7fbe53b654d: fix: stop failed logins and stray requests from creating repositories (@taciturnaxolotl)\r\n* 74e41543304d1e12fd54fc59e410bd428373dd34: fix: stop go-get requests from revealing private repository names (@taciturnaxolotl)\r\n* db6e0d0bc324eebee999aa459610f32875891604: fix: stop granting read access to no-access collaborators on private repos (@taciturnaxolotl)\r\n### Deps\r\n* 8877a1460cbc6bc1ea2a1725efe1f33fc9687b35: fix(deps): update Go and x/crypto to clear reported vulnerabilities (@taciturnaxolotl)\r\n### Other stuff\r\n* 37685d36f5b7bf0e32217ddd7c8e045c57772619: ci: sync dependabot config (#927) (@charmcli)\r\n* e89e3102edf8ec2168e0ac0eaf5636dc0f0b35e5: refactor: move LFS lock handlers into their own file (@taciturnaxolotl)\r\n* d12156d95533294607e78900802be1d9b6fe064a: refactor: share the missing-repository check across LFS handlers (@taciturnaxolotl)\r\n* 6b169bc3af4d407aec43fb64c606d02af520bd0e: v0.12.3 (@taciturnaxolotl)\r\n\r\n---\r\n\r\n<details>\r\n<summary>Verifying the artifacts</summary>\r\n\r\nFirst, download the [`checksums.txt` file](https://github.com/charmbracelet/soft-serve/releases/download/v0.12.3/checksums.txt) and the [`checksums.txt.sigstore.json` file](https://github.com/charmbracelet/soft-serve/releases/download/v0.12.3/checksums.txt.sigstore.json) files, for example, with `wget`:\r\n\r\n```bash\r\nwget 'https://github.com/charmbracelet/soft-serve/releases/download/v0.12.3/checksums.txt'\r\nwget 'https://github.com/charmbracelet/soft-serve/releases/download/v0.12.3/checksums.txt.sigstore.json'\r\n```\r\n\r\nThen, verify it using [`cosign`](https://github.com/sigstore/cosign):\r\n\r\n```bash\r\ncosign verify-blob \\\r\n  --certificate-identity 'https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main' \\\r\n  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\r\n  --bundle 'checksums.txt.sigstore.json' \\\r\n  ./checksums.txt\r\n```\r\n\r\nIf the output is `Verified OK`, you can safely use it to verify the checksums of other artifacts you downloaded from the release using `sha256sum`:\r\n\r\n```bash\r\nsha256sum --ignore-missing -c checksums.txt\r\n```\r\n\r\nDone! You artifacts are now verified!\r\n\r\n</details>\r\n\r\n<a href=\"https://charm.land/\"><img alt=\"The Charm logo\" src=\"https://stuff.charm.sh/charm-banner-next.jpg\" width=\"400\"></a>\r\n\r\nThoughts? Questions? We love hearing from you. Feel free to reach out on [X](https://x.com/charmcli), [Discord](https://charm.land/discord), [Slack](https://charm.land/slack), [The Fediverse](https://mastodon.social/@charmcli), [Bluesky](https://bsky.app/profile/charm.land).\r\n\r\n\r\n","mentions_count":4}
