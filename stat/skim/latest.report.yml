n the query is below --min-query-length (#1158)\n- Path_name_offset returns bytes while Rank::begin is a char index (#1160)\n\n### \ud83e\udd16 CI\n\n- Automatically update PRs on pushes to master\n- Fix auto update branch\n\n### \u2699\ufe0f Miscellaneous Tasks\n\n- Clippy & fmt after cargo update\n\n## Install skim 5.6.6\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-installer.ps1 | iex\"\n```\n\n## Download skim 5.6.6\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [skim-aarch64-apple-darwin.tar.xz](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-aarch64-apple-darwin.tar.xz.sha256) |\n| [skim-x86_64-apple-darwin.tar.xz](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-x86_64-apple-darwin.tar.xz.sha256) |\n| [skim-x86_64-pc-windows-msvc.zip](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-x86_64-pc-windows-msvc.zip.sha256) |\n| [skim-x86_64-pc-windows-msvc.msi](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-x86_64-pc-windows-msvc.msi) | x64 Windows | [checksum](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-x86_64-pc-windows-msvc.msi.sha256) |\n| [skim-aarch64-unknown-linux-gnu.tar.xz](https://github.com/skim-rs/skim/releases/download/v5.6.6/skim-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://g