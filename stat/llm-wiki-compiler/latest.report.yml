{"id":401535674,"author":{"login":"ethanj","id":1934146,"node_id":"MDQ6VXNlcjE5MzQxNDY=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOR6jouM4X7vK6","tag_name":"v1.4.1","target_commitish":"main","name":"1.4.1","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-02T03:42:01Z","updated_at":"2026-10-02T04:14:38Z","published_at":"2026-10-02T04:14:38Z","assets":[],"body":"llmwiki 1.4.1 makes it easier for agents to find the compiler and use an existing wiki as evidence.\n\n- A bundled Agent Skill explains when to use llmwiki and guides agents to inspect the wiki and retrieve cited context before generating or writing.\n- Searchable npm metadata, a versioned MCP Registry manifest, and clearer MCP descriptions improve discovery and tool selection.\n- Updated setup documentation explains installation, provider requirements, and review boundaries.\n- The README highlights 1.4.0 benefits; the changelog consolidates its release history and contributor credits; the architecture guide reflects the released implementation.\n\nExisting MCP tool names, inputs, and execution behavior are unchanged. Install `llm-wiki-compiler@1.4.1`; the supporting packages use matching versions.\n"}
