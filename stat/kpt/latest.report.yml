ptdev/kpt/pull/4690\r\n* Add needs step to save PR num by @efiacor in https://github.com/kptdev/kpt/pull/4699\r\n* feat: Add CEL-based conditional function execution (#4388) by @SurbhiAgarwal1 in https://github.com/kptdev/kpt/pull/4469\r\n* Add sonar fix and debug logging by @efiacor in https://github.com/kptdev/kpt/pull/4706\r\n* Remove internal dir from sonar reporting by @efiacor in https://github.com/kptdev/kpt/pull/4712\r\n* Docs: use Docsy alert shortcode for notes and warnings by @aravindtga in https://github.com/kptdev/kpt/pull/4703\r\n* Refactor: Move setup-go-kpt composite action from porch to kpt by @aravindtga in https://github.com/kptdev/kpt/pull/4709\r\n* fix: Improve CEL conditional execution consistency and test coverage by @aravindtga in https://github.com/kptdev/kpt/pull/4713\r\n* Docs: Rationalize and document local-config annotation in the book by @aravindtga in https://github.com/kptdev/kpt/pull/4679\r\n* Bump API dependency for v1.0.0 by @mozesl-nokia in https://github.com/kptdev/kpt/pull/4718\r\n\r\n\r\n**Full Changelog**: https://github.com/kptdev/kpt/compare/v1.0.0-beta.68...v1.0.0","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":4}
