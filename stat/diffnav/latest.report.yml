r","id":6196971,"node_id":"MDQ6VXNlcjYxOTY5NzE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3275033,"digest":"sha256:cfd179110cd38e01a9d705d8b1d8cdd44ae80091291e7982549958aac3a62c99","download_count":20,"created_at":"2026-07-24T10:18:42Z","updated_at":"2026-07-24T10:18:42Z"},{"id":488282401,"node_id":"RA_kwDOMzjlPM4dGpkh","name":"diffnav_Windows_x86_64.zip","label":"","uploader":{"login":"dlvhdr","id":6196971,"node_id":"MDQ6VXNlcjYxOTY5NzE=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":3442159,"digest":"sha256:4c02537248b9852bbb33c8b866107fd51efe9a7753e1576d5ea99f92344d8916","download_count":472,"created_at":"2026-07-24T10:18:42Z","updated_at":"2026-07-24T10:18:42Z"}],"body":"# Robust Diff Searching\r\n\r\nI've integrated https://github.com/robinovitch61/viewport to enable searching in the diffview.\r\nIt supports regular, insensitive, regex and fuzzy search modes.\r\n\r\n## Changelog\r\n\r\n### New Features\r\n\r\n* 1f9207798f2e56da7b8372488b9908f9982bc44e feat(diff): scroll line up/down when focused on tree (#140)\r\n* 1de38e61d07b802ce7dc768692deab173afb00f0 feat(diffviewer): use viewport by robinovitch61 (#144)\r\n* 214ed73186e038a20b0a411231470c20fd3d904b feat: add ui.startFoldersOpenDepth config option (#123)\r\n* 4e7ddc66d6a1f37e2b525c52dc344c29d52e8a41 feat: scroll to bottom and top (#125)\r\n* 7934a3915066214a90911354cc8cc107b9c41ef7 feat: show file tree when showFileTree is false (#130)\r\n\r\n### Fixes\r\n\r\n* 5f77725dc54e29e174abb1ffc80c5058b66b5e2f Resolve Git repo root from CWD when possible. (#118)\r\n* cbd0e975ad65beede45431e6cecde49b43bc222a fix(diffviewer): wrap long lines through delta in side-by-side, mark clipped lines in unified (closes #99) (#133)\r\n* 19b947d09f6b03c4883c08e8a7cf0b90c8c2d3d9 fix(filetree): use forward-slash path separator for git diff paths (#121) (#128)\r\n* 8c2de69b8e2786900dccd852a62277180891b4a5 fix: keys not handled in some cases (#136)\r\n* a2722c288fd449636f5040246a0bd014badeb94b fix: pass non-unified-diff input through to stdout (closes #115) (#132)\r\n* d592537bb98d7b8d8f6bc7c16c1bb8fff2cfa78b fix: sponsors (#134)\r\n\r\n### Chores\r\n\r\n* e890e0493947c3994caf2ad36a06104a37f65bb5 ci: tidy workflows (#137)\r\n","reactions":{"total_count":2,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
