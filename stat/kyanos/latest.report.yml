col parsing, command support, protocol inference, and tests in https://github.com/hengyoush/kyanos/pull/275\r\n* Added DNS protocol support, including parsing, filtering, protocol inference, CLI command, docs, and tests in https://github.com/hengyoush/kyanos/pull/309\r\n\r\n### eBPF and Capture Improvements\r\n* Replaced tracepoint-based hooks with fentry where available to improve probe behavior and compatibility in https://github.com/hengyoush/kyanos/pull/311\r\n* Added `security_socket_sendmsg` fentry support and fixed `security_socket_recvmsg/sendmsg` attach handling\r\n* Added architecture-specific syscall tracing support for amd64 and arm64\r\n* Fixed NAT flow direction handling\r\n* Skipped unnecessary protocol inference when the protocol is specified from the command line in https://github.com/hengyoush/kyanos/pull/310\r\n\r\n### SSL/TLS\r\n* Added OpenSSL 3.5.0 SSL decryption support\r\n* Added OpenSSL 3.5.1-3.5.5 version mapping support\r\n* Fixed a concurrency issue in the global map used while tracking SSL events in https://github.com/hengyoush/kyanos/pull/305\r\n\r\n### Stability and Memory\r\n* Added memory monitoring utilities\r\n* Added goroutine management utilities\r\n* Fixed StreamBuffer timestamp cleanup to prevent memory leaks\r\n* Added StreamBuffer memory leak tests in https://github.com/hengyoush/kyanos/pull/333\r\n\r\n### Fixes\r\n* Fixed cgo DNS resolution crash\r\n* Fixed `--json-output` exit behavior after BPF is loaded\r\n* Fixed issue https://github.com/hengyoush/kyanos/issues/300 in https://github.com/hengyoush/kyanos/pull/302\r\n* Updated `golang.org/x/arch` to v0.24.0 in https://github.com/hengyoush/kyanos/pull/104\r\n\r\n### Documentation and CI\r\n* Updated compilation documentation in https://github.com/hengyoush/kyanos/pull/308\r\n* Added AGENTS.md guidance files in https://github.com/hengyoush/kyanos/pull/329 and https://github.com/hengyoush/kyanos/pull/330\r\n* Added MongoDB and DNS test coverage\r\n* Improved RocketMQ docker compose compatibility\r\n* Simplified CI test dependencies and updated workflow actions\r\n* Bumped `cilium/little-vm-helper` to v0.0.28\r\n\r\n**Full Changelog**: https://github.com/hengyoush/kyanos/compare/v1.5.0...v1.6.0\r\n"}
