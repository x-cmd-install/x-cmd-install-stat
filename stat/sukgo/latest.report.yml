{"id":313867670,"author":{"login":"reallygood83","id":193194902,"node_id":"U_kgDOC4Prlg","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOSM4dtM4StT2W","tag_name":"v0.0.13","target_commitish":"main","name":"v0.0.13 — Deep Interview 네이티브 포팅 🧠","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-04-27T03:38:27Z","updated_at":"2026-04-27T03:39:02Z","published_at":"2026-04-27T03:39:02Z","assets":[],"body":"> codex 없이도 동일한 깊이의 Socratic 인터뷰. **모든 사용자**에게 Deep 모드 즉시 사용 가능.\n\n## 🎯 v0.0.12 의 한계\n\nDeep 모드는 codex CLI + omx 프레임워크 + deep-interview 스킬 **3가지 모두 설치된 사용자만** 사용 가능했음. 일반 사용자는 Quick 모드에 갇혀 있었어.\n\n## ✨ v0.0.13 — 네이티브 포팅\n\nomx deep-interview 알고리즘을 sukgo Python 안에 직접 구현. **LLM 한 호출 = 한 인터뷰 라운드**.\n\n## 🔬 알고리즘 (omx SKILL.md 호환)\n\n### 5차원 가중 점수\n\\`\\`\\`\nambiguity = 1 - (\n  intent      × 0.30 +   # 왜 이 결정을 원하는가\n  outcome     × 0.25 +   # 무엇이 끝 상태인가\n  scope       × 0.20 +   # 어디까지 가는가\n  constraints × 0.15 +   # 제약 조건\n  success     × 0.10     # 성공 판단 신호\n)\n\\`\\`\\`\n\n### 3 프로필\n| 프로필 | 임계치 | 최대 라운드 |\n|--------|-------|-----------|\n| Quick | ambiguity ≤ 0.30 | 5 |\n| **Standard** (기본) | ambiguity ≤ 0.20 | 12 |\n| Deep | ambiguity ≤ 0.15 | 20 |\n\n### Mandatory Gates\n- **Non-goals** 명시적\n- **Decision Boundaries** 명시적\n- **Pressure Pass** (이전 답변에 깊은 follow-up 1회 이상)\n\n이 3개 gate 가 모두 통과되지 않으면 ambiguity 임계치 도달해도 인터뷰 계속.\n\n### Challenge Modes (자동 활성화)\n- **contrarian** (round 2+): 핵심 가정에 의문\n- **simplifier** (round 4+): 최소 viable scope\n- **ontologist** (round 5+): essence-level 재구성\n\n### JSON 인터페이스\n매 라운드 LLM 응답:\n\\`\\`\\`json\n{\n  \"next_question\": \"구체적 질문\",\n  \"target_dimension\": \"intent|outcome|scope|constraints|success\",\n  \"challenge_mode\": \"none|contrarian|simplifier|ontologist\",\n  \"scores\": { \"intent\": 0.0~1.0, ... },\n  \"ambiguity\": 0.0~1.0,\n  \"non_goals_explicit\": bool,\n  \"decision_boundaries_explicit\": bool,\n  \"pressure_pass_done\": bool,\n  \"ready_to_crystallize\": bool,\n  \"reasoning\": \"한 줄 이유\"\n}\n\\`\\`\\`\n\n## 🎨 실시간 진행 표시\n\n\\`\\`\\`\n── Round 3/12 ── [contrarian]\nclarity: [██████████░░░░░░░░░░] 52%  target: scope  NG✓ DB✓\n\n❓ \"이직 후 6개월 안에 만들어야 할 가장 중요한 결과 1가지만 꼽는다면?\n   그것을 못 만들었을 때 어떤 신호로 알아챌 수 있나요?\"\n\n> [사용자 답변]\n\\`\\`\\`\n\nclarity bar / target dimension / gate 통과 상태 / challenge mode 가 매 라운드 시각적으로 갱신됨.\n\n## 🔀 엔진 선택\n\nDeep 모드 선택 시:\n- **codex 설치됨** → \\`a) codex omx (권장)\\` / \\`b) sukgo native\\` 선택 가능\n- **codex 미설치** → 네이티브 자동 사용\n\n자동 폴백: codex 위임 실패 → native / native 실패 → Quick\n\n## 🎬 Crystallize 단계\n\n인터뷰 종료 시 LLM 이 모든 라운드를 종합해 구조화된 spec 생성:\n\n\\`\\`\\`markdown\n# Deep Interview Spec\n\n## Intent — 왜 이 결정을 원하는가\n## Desired Outcome — 무엇이 끝 상태인가\n## In-Scope\n## Out-of-Scope / Non-goals\n## Decision Boundaries\n## Constraints\n## Acceptance Criteria\n## Assumptions Exposed\n## Pressure-Pass Findings\n## Full Transcript\n\\`\\`\\`\n\n이 spec 이 본 분석에 그대로 입력 → 매우 정밀한 보고서 생성.\n\n## 🛠 핵심 컴포넌트\n\n- \\`DEEP_INTERVIEW_SYSTEM\\` — 라운드별 시스템 프롬프트\n- \\`DEEP_INTERVIEW_CRYSTALLIZE\\` — 최종 spec 생성 프롬프트\n- \\`_clarify_deep_native()\\` — 인터뷰 루프 + 종료 조건\n- \\`_extract_json()\\` — 견고한 JSON 파싱 (depth-tracked + 코드펜스)\n- \\`DEEP_INTERVIEW_PROFILES\\` — 3개 프로필 설정\n- \\`DIM_WEIGHTS\\` — 5차원 가중치\n\n## 🚀 업데이트\n\n\\`\\`\\`bash\nsukgo update\n\\`\\`\\`\n\n업데이트 후 Career/Investment/Education/Pre-mortem/Decision Matrix 도구에서 옵션 \\`2. Deep\\` 선택 → codex 없이도 즉시 사용 가능.\n\n---\n**Full Changelog**: https://github.com/reallygood83/sukgo/compare/v0.0.12...v0.0.13"}
