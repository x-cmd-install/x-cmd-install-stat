7,"created_at":"2026-08-18T06:51:24Z","updated_at":"2026-08-18T06:51:25Z"},{"id":519065128,"node_id":"RA_kwDOB1EGJs4e8E4o","name":"gdu_openbsd_amd64.tgz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":8451413,"digest":"sha256:18efa7198cc653f6129afd7d69f251db8c4e6765cdde6b40576e73c1a84d9fd4","download_count":11,"created_at":"2026-08-18T06:51:24Z","updated_at":"2026-08-18T06:51:25Z"},{"id":519065133,"node_id":"RA_kwDOB1EGJs4e8E4t","name":"gdu_windows_amd64.exe.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8680872,"digest":"sha256:c8eebbad26799d5d0bd55b740e1acf0353c8889be4dccd98bc3aeac73660eee3","download_count":8833,"created_at":"2026-08-18T06:51:24Z","updated_at":"2026-08-18T06:51:25Z"},{"id":519065130,"node_id":"RA_kwDOB1EGJs4e8E4q","name":"sha256sums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":2504,"digest":"sha256:f9e4eb7f65e7f91235d5fd09266134fdbb240ebe87d5a040027bc2e7632c33c5","download_count":254,"created_at":"2026-08-18T06:51:24Z","updated_at":"2026-08-18T06:51:24Z"},{"id":519065127,"node_id":"RA_kwDOB1EGJs4e8E4n","name":"sha256sums.txt.asc","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-keys","state":"uploaded","size":833,"digest":"sha256:373edef60a5ed1f6ac2a1fca7c4e5067f8b17ab430593fd3ddb0684be4735147","download_count":20,"created_at":"2026-08-18T06:51:24Z","updated_at":"2026-08-18T06:51:24Z"}],"body":"# What's New\r\n\r\nThis release brings a browser-based UI, more control over long scans, richer\r\nfile-list information, and finer-grained configuration and export options. Below\r\nis a walkthrough of each new feature.\r\n\r\n## Web UI\r\n\r\nGdu can now serve a browser-based interface instead of the terminal UI.\r\n\r\n```\r\ngdu --web /some/dir\r\n```\r\n\r\nGdu scans the directory, prints the URL, and (by default) opens it in your\r\ndefault browser. The interface shows an animated donut chart of the current\r\ndirectory's contents alongside a sortable table with size bars, breadcrumb\r\nnavigation, and a disk-usage/apparent-size toggle. Scan progress is streamed\r\nlive while the analysis runs.\r\n\r\nBy default the server binds to `localhost` on a random free port. Use\r\n`--web-listen` (or the `web.listen` config option) to pin a fixed address, and\r\n`--web-open=false` to print the URL without launching a browser.\r\n\r\nThe compiled web assets are embedded in the binary, so no extra files or network\r\naccess are required.\r\n\r\n**Security:** the web UI is read-only and has no authentication. It exposes file\r\nnames and sizes over HTTP, so keep it bound to `localhost` (the default). Binding\r\nto a non-loopback address makes those details reachable by other hosts on the\r\nnetwork and prints a warning.\r\n\r\n<img width=\"1032\" height=\"563\" alt=\"Screenshot 2026-08-18 at 12 56 21\" src=\"https://github.com/user-attachments/assets/ad3ba0f1-cad6-4e7f-8bcd-7e20dce8f004\" />\r\n\r\n_by @dundee in #617_\r\n\r\n## Preview results during a scan (Tab)\r\n\r\nYou no longer have to wait for a scan to finish before looking at results. Press\r\n`Tab` during a scan to preview the directory totals found so far, then keep\r\nwatching them update as the analysis continues.\r\n\r\n_by @ultranity in #594_\r\n\r\n## Stop scanning and keep partial results\r\n\r\nLong scans can now be cut short without losing work. Press `Ctrl+C` during a scan\r\nto stop scheduling new work and keep the results found so far, so you can start\r\nbrowsing (or exporting) immediately instead of aborting the whole run.\r\n\r\n_by @ShivamB25 in #606_\r\n\r\n## Show symlink target\r\n\r\nSymlinks can be displayed as `name -> target`, showing the link destination next\r\nto the name just like `ls -l`. Enable it with:\r\n\r\n```\r\ngdu --show-symlink-target /some/dir\r\n```\r\n\r\nSymlinks and sockets continue to be marked with the `@` file flag.\r\n\r\n_by @yurenchen000 in #612_\r\n\r\n## Move items to XDG trash (D key)\r\n\r\nIn addition to permanent deletion (`d`), you can now move the selected file or\r\ndirectory to the XDG trash with the `D` key on Linux, matching the behavior of most\r\ndesktop file managers so items can be recovered later.\r\n\r\n_by @phaethix in #608_\r\n\r\n## Configurable colors for marked items\r\n\r\nThe colors used for marked items can now be customized in the configuration\r\nfile:\r\n\r\n```\r\nstyle:\r\n    marked:\r\n        text-color: white\r\n        background-color: \"#6600cc\"\r\n```\r\n\r\n_by @dundee in #566_\r\n\r\n## System-wide config: /etc/gdu.yaml\r\n\r\nGdu now loads `/etc/gdu.yaml` as a system-wide configuration file, letting\r\nadministrators set defaults for all users on a machine. Per-user config files\r\n(`$HOME/.config/gdu/gdu.yaml` and `$HOME/.gdu.yaml`) still apply on top of it.\r\n\r\n_by @graysky2 in #567_\r\n\r\n## Numeric percentage on usage bars\r\n\r\nUsage bars now display the numeric percentage alongside the bar, making it easier\r\nto read exactly how much space each item takes relative to its siblings.\r\n\r\n_by @dundee in #590_\r\n\r\n## Confirm before quitting after a long scan\r\n\r\nTo prevent accidentally discarding the results of a long scan, gdu now asks for\r\nconfirmation before quitting when a lengthy scan's results would otherwise be\r\nlost. You can disable the prompt with `--no-confirm-quit`.\r\n\r\n_by @ultranity in #593_\r\n\r\n## Honor block size environment variables\r\n\r\nTerminal output now honors the `BLOCK_SIZE` and `BLOCKSIZE` environment\r\nvariables. `BLOCK_SIZE` takes precedence; both accept GNU coreutils block-size\r\nvalues such as `1K`, `kB`, `human-readable`, and `si`. Explicit size-format flags\r\noverride these variables, and exported JSON always retains raw byte values.\r\n\r\n_by @ShivamB25 in #604_\r\n\r\n## Customize JSON export attributes\r\n\r\nThe JSON export can now be trimmed to only the attributes you need:\r\n\r\n```\r\ngdu --output-attrs=asize,dsize -o out.json /some/dir\r\n```\r\n\r\n`name` is always included; available optional attributes are `asize`, `dsize`,\r\n`items`, `mtime`, and `notreg`. Directories always retain their `asize`, `dsize`,\r\nand `items` summary stats so they can be preserved on import.\r\n\r\n_by @ShivamB25 in #605_\r\n\r\n## Exclude OneDrive online-only file sizes\r\n\r\nGdu can now exclude the sizes of OneDrive online-only (\"cloud\") files, so\r\nplaceholder files that aren't actually stored locally don't inflate your disk\r\nusage totals.\r\n\r\n_by @tpill90 in #609_\r\n\r\n## Summary of all changes\r\n* feat: add web UI by @dundee in https://github.com/dundee/gdu/pull/617\r\n* feat: preview results found so far during a scan (Tab) by @ultranity in https://github.com/dundee/gdu/pull/594\r\n* feat: stop scanning and keep partial results by @ShivamB25 in https://github.com/dundee/gdu/pull/606\r\n* feat: show symlink target #260 by @yurenchen000 in https://github.com/dundee/gdu/pull/612\r\n* feat: move items to XDG trash with D key (#12) by @phaethix in https://github.com/dundee/gdu/pull/608\r\n* feat: config option to change colors for marked items by @dundee in https://github.com/dundee/gdu/pull/566\r\n* feat: load /etc/gdu.yaml as system-wide config by @graysky2 in https://github.com/dundee/gdu/pull/567\r\n* feat: show numeric percentage on usage bars by @dundee in https://github.com/dundee/gdu/pull/590\r\n* feat: confirm before quitting when a long scan would be lost by @ultranity in https://github.com/dundee/gdu/pull/593\r\n* feat: honor block size environment by @ShivamB25 in https://github.com/dundee/gdu/pull/604\r\n* feat: customize JSON export attributes by @ShivamB25 in https://github.com/dundee/gdu/pull/605\r\n* feat: excluding OneDrive online file storage sizes by @tpill90 in https://github.com/dundee/gdu/pull/609\r\n* feat: update vite by @dundee in https://github.com/dundee/gdu/pull/628\r\n* fix: respect --show-apparent-size for file paths in non-interactive mode by @wahajahmed010 in https://github.com/dundee/gdu/pull/558\r\n* fix: ignore for root directory not working by @dundee in https://github.com/dundee/gdu/pull/573\r\n* fix: correct item count and size for empty dirs by @dundee in https://github.com/dundee/gdu/pull/574\r\n* fix: stack overflow by @dundee in https://github.com/dundee/gdu/pull/577\r\n* fix: import panic for empty array by @dundee in https://github.com/dundee/gdu/pull/578\r\n* fix: import panic on wrong name by @dundee in https://github.com/dundee/gdu/pull/581\r\n* fix: implement IsDir and GetPath for SimpleDir by @dundee in https://github.com/dundee/gdu/pull/583\r\n* fix: SQLite analyzer permission error flags by @sjh9714 in https://github.com/dundee/gdu/pull/598\r\n* fix(report): make JSON export respect -t, --depth and --summarize filters by @ShivamB25 in https://github.com/dundee/gdu/pull/600\r\n* fix: sanitize control characters in paths printed on quit by @carfeii in https://github.com/dundee/gdu/pull/616\r\n* fix(report): preserve directory stats in JSON export by @ShivamB25 in https://github.com/dundee/gdu/pull/603\r\n* fix(device): skip malformed mount lines instead of panicking by @VXNCXNX in https://github.com/dundee/gdu/pull/625\r\n* fix(cmd): stop truncating a --config-file path at the first space by @VXNCXNX in https://github.com/dundee/gdu/pull/624\r\n* fix(ignore): anchor the whole ignore-pattern alternation by @VXNCXNX in https://github.com/dundee/gdu/pull/623\r\n* fix: don't materialize dataless files when scanning on macOS by @ngrilly in https://github.com/dundee/gdu/pull/622\r\n* fix(timefilter): drop the stray separator in the until= filter footer by @VXNCXNX in https://github.com/dundee/gdu/pull/621\r\n* perf: concurrent processing in sqlite analyzer by @dundee in https://github.com/dundee/gdu/pull/565\r\n* refactor: use atomic counter instead of mutex by @dundee in https://github.com/dundee/gdu/pull/597\r\n* docs: fix typo \"relase\" -> \"release\" in release run-book by @maxtaran2010 in https://github.com/dundee/gdu/pull/601\r\n* docs: for contributors and agents by @dundee in https://github.com/dundee/gdu/pull/626\r\n* chore(deps): bump golang.org/x/text from 0.36.0 to 0.37.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/569\r\n* chore(deps): bump golang.org/x/sys from 0.43.0 to 0.44.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/568\r\n* chore(deps): bump golang.org/x/sys from 0.44.0 to 0.45.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/575\r\n* chore(deps): bump github.com/gdamore/tcell/v2 from 2.13.9 to 2.13.10 by @dependabot[bot] in https://github.com/dundee/gdu/pull/579\r\n* chore(deps): bump github.com/mattn/go-isatty from 0.0.21 to 0.0.22 by @dependabot[bot] in https://github.com/dundee/gdu/pull/559\r\n* chore(deps): bump modernc.org/sqlite from 1.49.1 to 1.51.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/582\r\n* chore(deps): bump actions/checkout from 6 to 7 by @dependabot[bot] in https://github.com/dundee/gdu/pull/592\r\n* chore(deps): bump golang.org/x/net from 0.47.0 to 0.55.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/596\r\n* chore(deps): bump actions/setup-go from 6 to 7 by @dependabot[bot] in https://github.com/dundee/gdu/pull/602\r\n* chore(deps): bump actions/setup-node from 4 to 7 by @dependabot[bot] in https://github.com/dundee/gdu/pull/620\r\n* chore(deps-dev): bump vitest from 2.1.9 to