d_at":"2026-10-05T09:35:16Z","updated_at":"2026-10-05T09:35:17Z"},{"id":612119533,"node_id":"RA_kwDOB1EGJs4kfDPt","name":"gdu_openbsd_amd64.tgz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":8792604,"digest":"sha256:9b2b48c51cd05b48592657da1843d0fd230f964d459b4b7098a27ff4067c2fc8","download_count":5,"created_at":"2026-10-05T09:35:16Z","updated_at":"2026-10-05T09:35:17Z"},{"id":612119539,"node_id":"RA_kwDOB1EGJs4kfDPz","name":"gdu_windows_amd64.exe.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":9027701,"digest":"sha256:22e6616e0bdc25d8d803934b4d3189996ebf74de8ac9b3635a4e4e079c3d7f8a","download_count":380,"created_at":"2026-10-05T09:35:16Z","updated_at":"2026-10-05T09:35:17Z"},{"id":612119537,"node_id":"RA_kwDOB1EGJs4kfDPx","name":"gdu_windows_arm64.exe.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":8154231,"digest":"sha256:ac557d787b0d07c7a45f32d098a6d240932b5a3d9d1aeca3f89acffea459a6df","download_count":13,"created_at":"2026-10-05T09:35:16Z","updated_at":"2026-10-05T09:35:17Z"},{"id":612119531,"node_id":"RA_kwDOB1EGJs4kfDPr","name":"sha256sums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":2596,"digest":"sha256:6f09857dfb9f67f67a91c0866ffe7598df985f25fcf011ce33b041e243e6672c","download_count":68,"created_at":"2026-10-05T09:35:16Z","updated_at":"2026-10-05T09:35:16Z"},{"id":612119549,"node_id":"RA_kwDOB1EGJs4kfDP9","name":"sha256sums.txt.asc","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-keys","state":"uploaded","size":833,"digest":"sha256:9d7bb0bb3e845e480791198ab16a5c1f3921d9222104b99aebf2df934df9e154","download_count":4,"created_at":"2026-10-05T09:35:16Z","updated_at":"2026-10-05T09:35:16Z"}],"body":"# What's New\r\n\r\nThis release lets you scan several directories in one run, adds a treemap view\r\nand item actions to the web UI, teaches gdu to read `.gitignore` files, and lets\r\nyou plug in your own trash command. Below is a walkthrough of each new feature.\r\n\r\n## Scan multiple directories at once\r\n\r\nMore than one directory can now be given on the command line, which is useful\r\nwhen only a subset of a large tree is of interest:\r\n\r\n```\r\ngdu ~/projects/alpha ~/projects/beta ~/projects/gamma\r\n```\r\n\r\nThe directories are scanned one after another and presented together under a\r\nvirtual top level directory named `(multiple)`, so they can be compared and\r\nsorted like ordinary siblings. They are listed by their absolute path, so\r\ndirectories that share a base name stay distinguishable, and each one keeps its\r\nreal path, so rescanning, deletion and opening a shell work as usual once you\r\nnavigate into one of them.\r\n\r\nDirectories nested in one another are rejected, since scanning both would count\r\nthe nested part twice. Exporting (`-o`) and database storage (`--db`) accept a\r\nsingle directory only. The virtual top level directory has no counterpart on\r\ndisk, so `--change-cwd`, spawning a shell, `--browse-parent-dirs` and exporting\r\nare unavailable while it is shown; rescanning it rescans every directory below\r\nit.\r\n\r\n_by @dundee in #653_\r\n\r\n## Treemap view in the web UI\r\n\r\nThe web UI gained a full-window treemap next to the existing donut chart. Toggle\r\nbetween the two from the header button. The treemap shows the complete nested\r\nsubtree of the current directory rather than just its direct children, so a\r\nsingle screen is enough to find what is taking up the space. Details too small\r\nto display are folded into their nearest visible parent directory.\r\n\r\nClick a tile to select it, double-click a directory to open it, and press `?`\r\nfor the keyboard shortcuts.\r\n\r\n_by @mikhail-angelov in #651_\r\n\r\n## Reveal and delete items from the web UI\r\n\r\nThe web UI is no longer read-only. In the treemap, press `O` to reveal the\r\nselected item in the system file manager and `D` (or `Delete`) to delete it\r\nafter confirmation. In the donut view, each row of the table has its own reveal\r\nand delete buttons that act on that item.\r\n\r\nThe confirmation dialog offers both \"Move to Trash\" and \"Delete Permanently\",\r\nand can suppress further confirmations for the current browser session - the\r\nchoice is shared between the treemap and the table, so with \"permanent\" chosen a\r\nsingle click on a row's delete button deletes immediately.\r\n\r\n`--no-delete` applies to the web UI as well: the delete action is hidden and the\r\nserver rejects delete requests. Reveal remains available because it does not\r\nmodify scanned data. Deletion while a filter is active is disabled by default,\r\nsince the displayed tree may omit files that are still present on disk; set\r\n`GDU_ALLOW_DELETE_WITH_FILTER=1` to override the check.\r\n\r\n**Security:** browsing stays unauthenticated, but reveal and delete need more: a\r\nrequest that both originates from a loopback address and carries a random token,\r\ngenerated fresh for each server run and never served over the API. The token\r\ntravels only in the URL gdu prints and opens. On a multi-user machine, use\r\n`--web-open=false` and open the printed URL from an already-running browser, as\r\na cold-started browser may retain that URL in its command line.\r\n\r\n_by @mikhail-angelov in #659 and @dundee in #683_\r\n\r\n## Ignore directories from a .gitignore file\r\n\r\nDirectories can now be ignored using `.gitignore`-style patterns read from a\r\nfile:\r\n\r\n```\r\ngdu -G .gitignore /some/dir\r\n```\r\n\r\nA name without `/` matches at any depth, a trailing `/` marks a directory, and a\r\nleading `/` anchors the pattern to the directory being scanned. Blank lines and\r\ncomments are skipped.\r\n\r\nNegated patterns (starting with `!`) and patterns matching every directory (such\r\nas `*` or `**`) are rejected with an error rather than skipped silently, as both\r\nwould make gdu report less than is really on disk. Since gdu prunes whole\r\ndirectories, file patterns such as `*.class` are accepted but have no effect.\r\n\r\n`-I`, `-X` and `-G` now combine: a directory is ignored if it matches any of\r\nthem, instead of the last option winning and silently dropping the others.\r\nPaths from `-i` apply in addition.\r\n\r\n_by @TigerZCoder in #673_\r\n\r\n## Use your own trash command\r\n\r\nThe `D` key and the web UI's \"Move to Trash\" action can now be routed through a\r\ncommand of your choice instead of the built-in XDG trash:\r\n\r\n```\r\ngdu --trash-command 'trash-put --trash-dir ~/mytrash'\r\ngdu --trash-command 'mv -f \"$1\" ~/mytrash/'\r\n```\r\n\r\nThe command is evaluated by `/bin/sh` with the absolute path of the item\r\nappended as an argument, which is also exported as `GDU_TRASH_PATH`. Commands\r\nthat take their destination last can refer to the path as `\"$1\"` instead, in\r\nwhich case it is not appended. The command must not be interactive. Not\r\nsupported on Windows.\r\n\r\n_by @dundee in #652_\r\n\r\n## Copy the path of the selected item\r\n\r\nPress `y` to copy the full path of the file or directory under the cursor to the\r\nsystem clipboard. Gdu shells out to the usual clipboard tools - `pbcopy` on\r\nmacOS, `clip` on Windows, and `wl-copy`, `xclip` or `xsel` elsewhere - so no new\r\ndependency is pulled in, but one of them has to be installed.\r\n\r\n_by @addielaruee in #645_\r\n\r\n## Bars for the item count column\r\n\r\nThe item count column can now be drawn with a bar next to the number, the same\r\nway sizes are, making it easy to spot the directories holding the most files.\r\nEnable it in the configuration file:\r\n\r\n```\r\nstyle:\r\n    show-item-count-bar: true\r\n```\r\n\r\nThe bar is only drawn while the item count column itself is visible, so combine\r\nit with `-C` or toggle the column with the `c` key.\r\n\r\n_by @dundee in #649_\r\n\r\n## Finer control over Ctrl+C during a scan\r\n\r\nStopping a scan and keeping partial results, introduced in v5.37.0, got a second\r\nstep: pressing `Ctrl+C` again while the scan is still stopping quits gdu\r\nimmediately, so a scan that is slow to wind down no longer traps you.\r\n\r\nIf you would rather have the first `Ctrl+C` quit gdu outright, use the new\r\n`--ctrl-c-quits` flag. `Esc` always stops the scan and keeps the results found\r\nso far, regardless of the flag.\r\n\r\n_by @dundee in #664 and #665_\r\n\r\n## Hardlinks preserved in trimmed JSON exports\r\n\r\nExports that selected attributes explicitly with `--output-attrs` dropped the\r\ninode information for hardlinked files, so re-importing them counted the same\r\nfile several times and inflated the totals. `ino` is now a selectable attribute\r\nand is honored by both the in-memory and SQLite exporters:\r\n\r\n```\r\ngdu --output-attrs=asize,dsize,ino -o out.json /some/dir\r\n```\r\n\r\nAvailable attributes are `asize`, `dsize`, `items`, `mtime`, `notreg` and `ino`;\r\n`name` is always included.\r\n\r\n_by @AdamMagued in #686_\r\n\r\n## Windows ARM64 binaries\r\n\r\nReleases now include a native Windows ARM64 build, `gdu_windows_arm64.exe.zip`,\r\nalongside the existing amd64 one.\r\n\r\n_by @meop in #647_\r\n\r\n## Summary of all changes\r\n* feat: allow scanning multiple directories by @dundee in https://github.com/dundee/gdu/pull/653\r\n* feat: add Treemap feature for web UI by @mikhail-angelov in https://github.com/dundee/gdu/pull/651\r\n* feat: add user actions: delete, reveal file ( to webui treemap) by @mikhail-angelov in https://github.com/dundee/gdu/pull/659\r\n* feat(webui): add reveal and delete actions to the file table by @dundee in https://github.com/dundee/gdu/pull/683\r\n* feat(ignore): add -G/--ignore-from-gitignore for .gitignore-style patterns by @TigerZCoder in https://github.com/dundee/gdu/pull/673\r\n* feat: add --trash-command option by @dundee in https://github.com/dundee/gdu/pull/652\r\n* feat: copy path of selected item to clipboard by @addielaruee in https://github.com/dundee/gdu/pull/645\r\n* feat: show bar for item count  by @dundee in https://github.com/dundee/gdu/pull/649\r\n* feat: allow ctrl+c to quit instead of stopping the scan by @dundee in https://github.com/dundee/gdu/pull/664\r\n* feat: quit on second ctrl+c during a scan by @dundee in https://github.com/dundee/gdu/pull/665\r\n* fix: support ino in --output-attrs to preserve hardlinks by @AdamMagued in https://github.com/dundee/gdu/pull/686\r\n* fix: StoreDir fixes by @dundee in https://github.com/dundee/gdu/pull/644\r\n* fix(report): prevent export progress from wrapping by @sjh9714 in https://github.com/dundee/gdu/pull/646\r\n* fix: panic exporting top files from archives or a persistent DB by @VXNCXNX in https://github.com/dundee/gdu/pull/631\r\n* fix(device): include same-filesystem bind mounts with --no-cross by @fzlzjerry in https://github.com/dundee/gdu/pull/662\r\n* fix(stdout): --depth ignores --show-apparent-size when sorting by @VXNCXNX in https://github.com/dundee/gdu/pull/630\r\n* fix(report): honor --summarize and --depth for stored and archived items by @VXNCXNX in https://github.com/dundee/gdu/pull/660\r\n* fix(device): skip macOS mounts reached through the Data volume with --no-cross by @anandghegde in https://github.com/dundee/gdu/pull/670\r\n* fix(stdout): honor --top and --depth when reading an input file by @VXNCXNX in https://github.com/dundee/gdu/pull/668\r\n* fix(stdout): honor apparent-size flag in --top ranking by @VXNCXNX in https://github.com/dundee/gdu/pull/669\r\n* fix(ignore): escape path separators in generated absolute path alternatives by @TigerZCoder in https://github.com/dundee/gdu/pull/672\r\n* test: take expected disk usage from stat instead of assuming 4 KiB blocks by @Juice-de-Orange in https://github.com/dundee/gdu/pull/682\r\n* ci: build Windows ARM64 release binary by @meop in https://github.com/dundee/gdu/pull/647\r\n* ci: bump version of golang by @dundee in https://github.com/dundee/gdu/pull/650\r\n* chore(deps): bump github/codeql-action from 4.37.4 to 4.37.8 by @dependabot[bot] in https://github.com/dundee/gdu/pull/642\r\n* chore(deps): bump github.com/dgraph-io/badger/v4 from 4.9.2 to 4.9.6 by @dependabot[bot] in https://github.com/dundee/gdu/pull/635\r\n* chore(deps): bump github/codeql-action from 4.37.8 to 4.37.9 by @dependabot[bot] in https://github.com/dundee/gdu/pull/648\r\n* chore(deps): bump github/codeql-action from 4.37.9 to 4.38.1 by @dependabot[bot] in https://github.com/dundee/gdu/pull/675\r\n* chore(deps): bump docker/login-action from 4.5.2 to 4.6.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/632\r\n* chore(deps): bump golang.org/x/sys from 0.46.0 to 0.47.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/636\r\n* chore(deps): bump github.com/mattn/go-isatty from 0.0.22 to 0.0.24 by @dependabot[bot] in https://github.com/dundee/gdu/pull/655\r\n* chore(deps): bump github.com/stretchr/testify from 1.11.1 to 1.12.1 by @dependabot[bot] in https://github.com/dundee/gdu/pull/656\r\n* chore(deps): bump modernc.org/sqlite from 1.52.0 to 1.59.0 by @dependabot[bot] in https://github.com/dundee/gdu/pull/657\r\n* chore(deps): bump github.com/sirupsen/logrus from 1.9.4 to 1.10.2 by @dependabot[bot] in https://github.com/dundee/gdu/pull/658\r\n* chore(deps): bump @vitest/mocker and vitest in /webui/frontend by @dependabot[bot] in https://github.com/dundee/gdu/pull/663\r\n\r\n## New Contributors\r\n* @addielaruee made their first contribution in https://github.com/dundee/gdu/pull/645\r\n* @mikhail-angelov made their first contribution in https://github.com/dundee/gdu/pull/651\r\n* @fzlzjerry made their first contribution in https://github.com/dundee/gdu/pull/662\r\n* @anandghegde made their first contribution in https://github.com/dundee/gdu/pull/670\r\n* @TigerZCoder made their first contribution in https://github.com/dundee/gdu/pull/672\r\n* @Juice-de-Orange made their first contribution in https://github.com/dundee/gdu/pull/682\r\n* @meop made their first contribution in https://github.com/dundee/gdu/pull/647\r\n* @AdamMagued made their first contribution in https://github.com/dundee/gdu/pull/686\r\n\r\n**Full Changelog**: https://github.com/dundee/gdu/compare/v5.37.0...v5.38.0\r\n","reactions":{"total_count":5,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":4,"rocket":0,"eyes":0},"mentions_count":12}
