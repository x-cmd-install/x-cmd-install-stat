","updated_at":"2025-10-18T14:00:16Z"},{"id":305835598,"node_id":"RA_kwDODWmwf84SOq5O","name":"dotenv-linter-win-x64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1387371,"digest":"sha256:771214659b86d2de5c8c5214e6d59484ceb0de8a87037d488ce37d6ca6f6cc1a","download_count":10331,"created_at":"2025-10-18T14:00:50Z","updated_at":"2025-10-18T14:00:50Z"}],"body":"### Features\r\n\r\n- New CLI API ([#922](https://github.com/dotenv-linter/dotenv-linter/pull/922), @mgrachev)\r\n- Allow & and = in quoted values ([#917](https://github.com/dotenv-linter/dotenv-linter/pull/917), @aditya-raj-panjiyara)\r\n- Add `--dry-run` option to fix subcommand ([#772](https://github.com/dotenv-linter/dotenv-linter/pull/772), @Dev380)\r\n- New schema based checker ([#761](https://github.com/dotenv-linter/dotenv-linter/pull/761), @pm100)\r\n- Add \"No difference found\" message on successful compare ([#648](https://github.com/dotenv-linter/dotenv-linter/pull/648), @jklott)\r\n- Allow setting `skip_updates` flag via environment variable ([#625](https://github.com/dotenv-linter/dotenv-linter/pull/625), @jackyef)\r\n- Add support for `DOTENV_LINTER_IGNORE_CHECKS` environment variable to skip checks ([#623](https://github.com/dotenv-linter/dotenv-linter/pull/623), @YeswanthRajakumar)\r\n\r\n### Fixes\r\n\r\n- Docker image for `linux/arm64` ([#757](https://github.com/dotenv-linter/dotenv-linter/pull/757), @harryzcy)\r\n\r\n### CI\r\n\r\n- Exclude installing v1 and v2 on macos ([#834](https://github.com/dotenv-linter/dotenv-linter/pull/834), @harryzcy)\r\n- Use macos 13 and 14 as the OS ([#833](https://github.com/dotenv-linter/dotenv-linter/pull/833), @harryzcy)\r\n- Fix benchmarks ([#774](https://github.com/dotenv-linter/dotenv-linter/pull/774), @mgrachev)\r\n- Fix problem with installing linker ([#674](https://github.com/dotenv-linter/dotenv-linter/pull/674), @mgrachev)\r\n- Get rid of `set-output` ([#632](https://github.com/dotenv-linter/dotenv-linter/pull/632), @DDtKey)\r\n- Check PR name instead of commits ([#631](https://github.com/dotenv-linter/dotenv-linter/pull/631), @mgrachev)\r\n\r\n### Miscellaneous Tasks\r\n\r\n- Fix release script ([#923](https://github.com/dotenv-linter/dotenv-linter/pull/923), @mgrachev)\r\n- Add pre commit hook ([#878](https://github.com/dotenv-linter/dotenv-linter/pull/878), @hbontempo-br)\r\n- Rename `dotenv-linter` with `dotenv-cli` ([#905](https://github.com/dotenv-linter/dotenv-linter/pull/905), @mgrachev)\r\n- Update edition ([#904](https://github.com/dotenv-linter/dotenv-linter/pull/904), @mgrachev)\r\n- Rename `dotenv-lookup` with `dotenv-finder` ([#892](https://github.com/dotenv-linter/dotenv-linter/pull/892), @mgrachev)\r\n- Fix clippy warnings ([#880](https://github.com/dotenv-linter/dotenv-linter/pull/880), @mgrachev)\r\n- Update dependencies ([#849](https://github.com/dotenv-linter/dotenv-linter/pull/849), @mgrachev)\r\n- Fix CI and warnings ([#840](https://github.com/dotenv-linter/dotenv-linter/pull/840), @mgrachev)\r\n- Fix clippy warnings ([#735](https://github.com/dotenv-linter/dotenv-linter/pull/735), @mgrachev)\r\n- Remove `stale` action ([#680](https://github.com/dotenv-linter/dotenv-linter/pull/680), @mgrachev)\r\n- Update `cargo-deny` config ([#644](https://github.com/dotenv-linter/dotenv-linter/pull/644), @mgrachev)\r\n- Get rid of `orhun/git-cliff-action` ([#614](https://github.com/dotenv-linter/dotenv-linter/pull/614), @mgrachev)\r\n\r\n### Refactor\r\n\r\n- Create new crate `dotenv-analyzer` ([#903](https://github.com/dotenv-linter/dotenv-linter/pull/903), @mgrachev)\r\n- Create new crate `dotenv-core` ([#902](https://github.com/dotenv-linter/dotenv-linter/pull/902), @mgrachev)\r\n- Use Builder pattern ([#900](https://github.com/dotenv-linter/dotenv-linter/pull/900), @mgrachev)\r\n- Create new crate `dotenv-schema` ([#894](https://github.com/dotenv-linter/dotenv-linter/pull/894), @mgrachev)\r\n- Change visibility of some functions ([#893](https://github.com/dotenv-linter/dotenv-linter/pull/893), @mgrachev)\r\n- Remove `file_entry.rs` as not inluded in file tree ([#657](https://github.com/dotenv-linter/dotenv-linter/pull/657), @brahms116)\r\n- Move `cli/mod.rs` to `cli.rs` ([#656](https://github.com/dotenv-linter/dotenv-linter/pull/656), @brahms116)\r\n- Divide code into 2 crates ([#620](https://github.com/dotenv-linter/dotenv-linter/pull/620), @mgrachev)\r\n- Get rid of `list` command ([#619](https://github.com/dotenv-linter/dotenv-linter/pull/619), @mgrachev)\r\n- Don't display option `--skip-updates` if it's disabled ([#617](https://github.com/dotenv-linter/dotenv-linter/pull/617), @mgrachev)\r\n\r\n### Update dependencies\r\n\r\n- Bump tempfile from 3.21.0 to 3.22.0 ([#906](https://github.com/dotenv-linter/dotenv-linter/pull/906))\r\n- Bump clap from 4.5.43 to 4.5.47 ([#901](https://github.com/dotenv-linter/dotenv-linter/pull/901))\r\n- Bump lycheeverse/lychee-action from 2.4.1 to 2.6.1 ([#898](https://github.com/dotenv-linter/dotenv-linter/pull/898))\r\n- Bump regex from 1.11.1 to 1.11.2 ([#897](https://github.com/dotenv-linter/dotenv-linter/pull/897))\r\n- Bump tempfile from 3.20.0 to 3.21.0 ([#891](https://github.com/dotenv-linter/dotenv-linter/pull/891))\r\n- Bump serde_json from 1.0.142 to 1.0.143 ([#890](https://github.com/dotenv-linter/dotenv-linter/pull/890))\r\n- Bump dprint/check from 2.2 to 2.3 ([#883](https://github.com/dotenv-linter/dotenv-linter/pull/883))\r\n- Bump actions/checkout from 4 to 5 ([#887](https://github.com/dotenv-linter/dotenv-linter/pull/887))\r\n- Bump tokio from 1.29.1 to 1.44.2 ([#870](https://github.com/dotenv-linter/dotenv-linter/pull/870))\r\n- Bump Swatinem/rust-cache from 2.7.7 to 2.7.8 ([#865](https://github.com/dotenv-linter/dotenv-linter/pull/865))\r\n- Bump ring from 0.17.8 to 0.17.14 ([#882](https://github.com/dotenv-linter/dotenv-linter/pull/882))\r\n- Bump lycheeverse/lychee-action from 2.3.0 to 2.4.1 ([#874](https://github.com/dotenv-linter/dotenv-linter/pull/874))\r\n- Update dependencies ([#881](https://github.com/dotenv-linter/dotenv-linter/pull/881))\r\n- Bump clap from 4.5.28 to 4.5.29 ([#851](https://github.com/dotenv-linter/dotenv-linter/pull/851))\r\n- Bump rustls from 0.21.2 to 0.21.12 ([#850](https://github.com/dotenv-linter/dotenv-linter/pull/850))\r\n- Bump anstream from 0.6.7 to 0.6.15 ([#847](https://github.com/dotenv-linter/dotenv-linter/pull/847))\r\n- Bump h2 from 0.3.24 to 0.3.26 ([#771](https://github.com/dotenv-linter/dotenv-linter/pull/771))\r\n- Bump mio from 0.8.8 to 0.8.11 ([#760](https://github.com/dotenv-linter/dotenv-linter/pull/760))\r\n- Bump clap from 4.4.18 to 4.5.3 ([#767](https://github.com/dotenv-linter/dotenv-linter/pull/767))\r\n- Bump softprops/action-gh-release from 1 to 2 ([#766](https://github.com/dotenv-linter/dotenv-linter/pull/766))\r\n- Bump tempfile from 3.9.0 to 3.10.1 ([#755](https://github.com/dotenv-linter/dotenv-linter/pull/755))\r\n- Bump assert_cmd from 2.0.13 to 2.0.14 ([#754](https://github.com/dotenv-linter/dotenv-linter/pull/754))\r\n- Bump codecov/codecov-action from 3 to 4 ([#750](https://github.com/dotenv-linter/dotenv-linter/pull/750))\r\n- Bump lycheeverse/lychee-action from 1.9.2 to 1.9.3 ([#748](https://github.com/dotenv-linter/dotenv-linter/pull/748))\r\n- Bump lycheeverse/lychee-action from 1.9.1 to 1.9.2 ([#747](https://github.com/dotenv-linter/dotenv-linter/pull/747))\r\n- Bump h2 from 0.3.20 to 0.3.24 ([#746](https://github.com/dotenv-linter/dotenv-linter/pull/746))\r\n- Bump clap from 4.4.17 to 4.4.18 ([#745](https://github.com/dotenv-linter/dotenv-linter/pull/745))\r\n- Bump clap from 4.4.16 to 4.4.17 ([#744](https://github.com/dotenv-linter/dotenv-linter/pull/744))\r\n- Bump Swatinem/rust-cache from 2.7.2 to 2.7.3 ([#743](https://github.com/dotenv-linter/dotenv-linter/pull/743))\r\n- Bump assert_cmd from 2.0.12 to 2.