09482ae9ccb24ae6132c14ca85343b25a4a3d6bdb362acddeaf081","download_count":136,"created_at":"2026-10-10T22:50:16Z","updated_at":"2026-10-10T22:50:17Z"},{"id":629186601,"node_id":"RA_kwDOQK_mG84lgKAp","name":"bookokrat-v0.3.13-x86_64-unknown-linux-gnu.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":116,"digest":"sha256:7e10abf96fe500d2f197b752d892b682c7ece177f0289a32b8e0e9cc4dd6c2be","download_count":13,"created_at":"2026-10-10T22:50:16Z","updated_at":"2026-10-10T22:50:16Z"},{"id":629186554,"node_id":"RA_kwDOQK_mG84lgJ_6","name":"bookokrat-v0.3.13-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":10573324,"digest":"sha256:1218e6e93b0727dc3588b8d5c4db8f8bd5c9ad5607a35764e2c616cece494b3c","download_count":11,"created_at":"2026-10-10T22:50:14Z","updated_at":"2026-10-10T22:50:15Z"},{"id":629186553,"node_id":"RA_kwDOQK_mG84lgJ_5","name":"bookokrat-v0.3.13-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":117,"digest":"sha256:b7209eb468d5b8371579a7cabd900779ad035468f959522b85e1c97b51f58d88","download_count":3,"created_at":"2026-10-10T22:50:14Z","updated_at":"2026-10-10T22:50:14Z"}],"body":"# Bookokrat 0.3.13\r\n\r\n## Highlights\r\n\r\n- Added reading from stdin (`curl \u2026 | bookokrat -`); piped documents resume with their highlights and comments.\r\n- Added a `--no-images` text-only mode.\r\n- Inline annotation bodies can be hidden with `Space+i` and peeked at with `K` / `Space+k`.\r\n\r\n## Improvements\r\n\r\n- Large libraries no longer slow down startup; the library is scanned in the background.\r\n- EPUB images now fit the reader view; the old fixed size is available in settings.\r\n- Smoother image scrolling in iTerm2, WezTerm, Konsole and Warp.\r\n- Added Android (Termux) support.\r\n\r\n## Fixes\r\n\r\n- Dialogue lines that start with a dash are no longer merged into a single paragraph.\r\n- Highlights and comments after a line break no longer land a few characters early.\r\n- PDF zoom, zen mode, enhance and dual-page switching keep the reading position; fixed dual-page loading hangs.\r\n- Fixed text selection in multi-column PDFs.\r\n- PDF pages no longer linger after switching tmux windows in newer Ghostty versions.\r\n- Fixed keyboard input when stdin is redirected, `Ctrl+o` after following links, and the page-scroll highlight at document edges.\r\n- Improved Nord theme status-line readability.\r\n- Fixed builds on FreeBSD and with the Nix flake.\r\n\r\n## Upgrade notes\r\n\r\n- Annotations, positions and marks are migrated to the new dialogue layout on first open; older versions will show them misplaced.\r\n- PDF normal mode: `a` now adds a comment (was `d`), `dd` deletes it.\r\n"}
