{"id":289847241,"author":{"login":"raghavpillai","id":76788658,"node_id":"MDQ6VXNlcjc2Nzg4NjU4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOPhb5Cs4RRrfJ","tag_name":"v1.0.0","target_commitish":"main","name":"v1.0.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-02-24T10:39:48Z","updated_at":"2026-02-24T12:57:26Z","published_at":"2026-02-24T12:57:26Z","assets":[],"body":"Non-interactive CLI, update checker, remote branches, and a bunch of internal cleanup.\n\n- `branchlet create -n my-feature -s main`, `branchlet list --json`, `branchlet delete -n my-feature -f`: scriptable commands for CI and automation\n- Daily update check against npm, plus a manual check in settings\n- Create worktrees from remote branches, not just local ones\n- Type to filter in branch and worktree lists\n- Viewport scrolling for long lists instead of overflowing the terminal\n- `$schema` support in `.branchlet.json` for editor autocompletion\n- Shell completions are now part of the setup block instead of separate scripts\n- Replaced static-only service classes with plain exported functions\n- Upgraded to glob v13 and other dependency bumps","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
