}],"body":"[ptUserX64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysUserSetup-0.101.2362.0-x64.exe\r\n[ptUserArm64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysUserSetup-0.101.2362.0-arm64.exe\r\n[ptMachineX64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysSetup-0.101.2362.0-x64.exe\r\n[ptMachineArm64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysSetup-0.101.2362.0-arm64.exe\r\n\r\n![Hero image of what's new in version 0.100](https://github.com/user-attachments/assets/aa918e54-5310-44ec-abe2-4067f5ad387b)\r\n\r\n## Installer Hashes\r\n\r\n| Description | Filename | sha256 hash |\r\n| --- | --- | --- |\r\n| Per user - x64 | [PowerToysUserSetup-0.101.2362.0-x64.exe][ptUserX64] | D56FA7130FA68AFE553068C15A59A6B24C8DBCC9A0989A43EF0FC5A373230DE3 |\r\n| Per user - ARM64 | [PowerToysUserSetup-0.101.2362.0-arm64.exe][ptUserArm64] | 4C2AE5156B7E4F1F5BA744BA6E1CF6BFE3D9614978356E6B00AA47CAB86350DB |\r\n| Machine wide - x64 | [PowerToysSetup-0.101.2362.0-x64.exe][ptMachineX64] | F27E4B4B01BFF1A74BFA0116C99F9205F7138DB6F7DFCAA9223FB8B635FE6050 |\r\n| Machine wide - ARM64 | [PowerToysSetup-0.101.2362.0-arm64.exe][ptMachineArm64] | BEE299302C0CD59E282BDC92CC8AAF737713EABCCA77BB8BF09F43745D43CD93 |\r\n\r\n[ptUserX64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysUserSetup-0.101.2362.0-x64.exe\r\n[ptUserArm64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysUserSetup-0.101.2362.0-arm64.exe\r\n[ptMachineX64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysSetup-0.101.2362.0-x64.exe\r\n[ptMachineArm64]: https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysSetup-0.101.2362.0-arm64.exe\r\n\r\n##\r\n\r\n#### Highlights\r\n\r\n**\u26a0\ufe0f Update: We\u2019re working through an issue with the update rollout, so this PowerToys release may take a little longer than usual to reach everyone. \u26a0\ufe0f** \r\n\r\nPowerToys 0.101 introduces **Window Hopper** for quickly moving between windows from the same app, a redesigned **update experience with Stable and Insider channels**, and **compact mode for Command Palette**. This release also continues our WinUI 3 modernization, brings on-device Phi Silica transformations to Advanced Paste, and adds a big set of improvements across PowerDisplay and Shortcut Guide.\r\n\r\n## \ud83e\ude9f Meet Window Hopper\r\n\r\nIf you regularly have several windows open from the same app, switching between them is now much faster. **Window Hopper works like Alt + Tab, but stays within the app you're currently using.** Once the utility is enabled, press the configurable **Alt + backtick** shortcut to cycle through that app's windows without stepping through everything else on your desktop. It is especially useful when you're juggling multiple browser windows, terminals, File Explorer windows, or editor instances.\r\n\r\n<img width=\"680\" height=\"251\" alt=\"Window Hopper\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/WindowHopper.webp\" />\r\n\r\nPR: [#48281](https://github.com/microsoft/PowerToys/pull/48281) (with coauthor credit to [@wzhudev](https://github.com/wzhudev))\r\n\r\n## \ud83d\udd04 A smoother update experience and the new Insider channel\r\n\r\nPowerToys updates now have a clearer home in Settings. Open **Settings > General > Update channel** to choose between **Stable** and **Insider**. Stable remains the default, while Insider lets you opt in to PowerToys Preview builds and try the latest work sooner. The selected channel remains visible when the setting is collapsed, preview builds are clearly labeled, and managed devices can still have preview updates controlled by organizational policy.\r\n\r\nWe also redesigned the update experience with clearer badges and a compact status surface that tracks each step, from checking and downloading to installation or errors. Bug reports are easier too, with progress updates, quick access to the generated ZIP, and a prefilled GitHub issue.\r\n\r\n<img width=\"680\" height=\"426\" alt=\"PowerToys update settings\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/Settings.webp\" />\r\n\r\nPRs: [#49414](https://github.com/microsoft/PowerToys/pull/49414), [#49722](https://github.com/microsoft/PowerToys/pull/49722), and [#49872](https://github.com/microsoft/PowerToys/pull/49872)\r\n\r\n## \u26a1 Command Palette goes compact\r\n\r\nCommand Palette can now stay out of the way until you need the results. Enable **compact mode** in Command Palette Settings and the palette opens as a focused search box at a configurable vertical position. Start typing and it expands just enough to show matching results; you can also use **Down Arrow** or **Tab** to expand it from the keyboard. Pages that need more room, such as detailed views and confirmation dialogs, still expand fully when required. Compact mode is off by default, so the existing full experience remains unchanged unless you opt in.\r\n\r\n<img width=\"680\" height=\"160\" alt=\"Command Palette compact mode\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/CompactCmdpal.webp\" />\r\n\r\nCompact mode is only one part of this Command Palette update:\r\n\r\n*   **Search and responsiveness:** Better ranking, cached Window Walker results, and progressive icon loading make results feel faster and more predictable.\r\n*   **Reliability:** Improved backdrop switching, icon loading, dock cleanup, and extension-resource management make prolonged use more stable.\r\n*   **Dock improvements:** Auto-hide reclaims screen space, while the dock clock and an optional bell provide quick access to Notification Center.\r\n*   **Richer notifications:** Extensions can show toasts with configurable positions, icons, and action buttons.\r\n*   **Performance Monitor:** New disk activity metrics and clearer network bands make it easier to keep an eye on system performance.\r\n*   **Extension Gallery:** Deep links can open the gallery or take you directly to a specific extension's installation page.\r\n*   **Windows Update commands:** **Update and restart** and **Update and shut down** appear when Windows is waiting for a reboot.\r\n\r\nMassive thanks to [@jiripolasek](https://github.com/jiripolasek) for the sustained Command Palette work across this release!\r\n\r\nPRs: [#48801](https://github.com/microsoft/PowerToys/pull/48801), [#49177](https://github.com/microsoft/PowerToys/pull/49177), and [#49780](https://github.com/microsoft/PowerToys/pull/49780)\r\n\r\n## \ud83d\udd04 Quick Accent and Mouse Jump move to WinUI 3\r\n\r\nWe're continuing to modernize PowerToys utilities with WinUI 3, and this release brings refreshed foundations to **Quick Accent** and **Mouse Jump**. Quick Accent keeps its familiar character picker while gaining better theming, accessibility, and DPI-aware placement. It also adds an optional **Press and hold the letter** activation mode: choose it in Quick Accent Settings, configure the hold duration, then hold an accent-capable letter to open the picker. Use the arrow keys or Space to select a character and release the letter to insert it. A quick tap still types the original letter, and normal Ctrl, Alt, AltGr, and Windows-key shortcuts remain unaffected.\r\n\r\nMouse Jump now uses a WinUI 3 interface with improved multi-monitor and mixed-DPI behavior. Invoke Mouse Jump with your configured shortcut, then click the destination in the preview or use the number keys, Home and End, or the arrow keys to select a monitor from the keyboard. Smaller improvements across the two utilities include more reliable Quick Accent activation, better first-frame rendering, expanded language, currency, punctuation, and IPA character sets, plus updated Mouse Jump layout and release support for both x64 and ARM64.\r\n\r\nPRs: [#48891](https://github.com/microsoft/PowerToys/pull/48891), [#48937](https://github.com/microsoft/PowerToys/pull/48937), and [#48393](https://github.com/microsoft/PowerToys/pull/48393) (Thanks, [@LegendaryBlair](https://github.com/LegendaryBlair) and [@mikeclayton](https://github.com/mikeclayton)!)\r\n\r\n## \ud83d\udda5\ufe0f PowerDisplay gets linked controls and faster access\r\n\r\nPowerDisplay can now control the brightness of several monitors together. Turn on **linked brightness** to get one All Displays slider for every included brightness-capable monitor, while keeping selected displays independent when needed. Individual display cards remain available in an expandable section, and applying a saved profile returns to per-monitor control before restoring its values. You can also opt in to brightness control from the tray icon: choose whether scrolling over it adjusts the primary display or all linked displays, then set the amount each mouse-wheel notch should change.\r\n\r\n<img width=\"508\" height=\"335\" alt=\"PowerDisplay linked controls\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/PowerDisplay.webp\" />\r\n\r\nPowerDisplay can now wake supported monitors by selecting **On** from the display's power-state control, and a new command-line interface lets you inspect displays, change monitor settings, and apply saved profiles from scripts. This release also improves built-in panel detection on hybrid-GPU systems, makes Maximum compatibility mode more resilient with unreliable monitors, preserves recent setting changes during exit, restores saved brightness, contrast, volume, and color temperature more reliably, and cleans up monitor and tray resources more consistently.\r\n\r\nPRs: [#48207](https://github.com/microsoft/PowerToys/pull/48207) (Thanks, [@gilnatab](https://github.com/gilnatab)!), [#48628](https://github.com/microsoft/PowerToys/pull/48628), and [#49446](https://github.com/microsoft/PowerToys/pull/49446)\r\n\r\n## \ud83d\udccb Advanced Paste brings local AI to custom actions\r\n\r\nAdvanced Paste now supports **on-device transformations with Phi Silica** on supported Windows devices, so you can use local AI without configuring a cloud endpoint or API key. In Advanced Paste Settings, check Phi Silica availability and download the model when prompted. You can then choose Phi Silica as the provider for an action, customize its prompt and coaching behavior, and assign a shortcut for quick access. Provider selection, prompts, and shortcuts can all be configured per action, making it easier to mix local and online models for different clipboard workflows.\r\n\r\n<img width=\"680\" height=\"433\" alt=\"Advanced Paste Phi Silica settings\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/AdvancedPaste.webp\" />\r\n\r\nYou can also hide the AI paste section when you do not use AI features, keeping the Advanced Paste window focused on the actions you need. Custom OpenAI and Azure OpenAI actions now work more reliably with models that do not support the `minimal` reasoning-effort setting by allowing those services to use their own defaults.\r\n\r\nPR: [#46727](https://github.com/microsoft/PowerToys/pull/46727)\r\n\r\n## \u2328\ufe0f Shortcut Guide adds Windows-key activation and search\r\n\r\nShortcut Guide can now respond when you hold the **Windows key**. In Settings, choose whether this shows taskbar indicators, opens the full guide, or remains disabled. You can also configure the hold duration and whether the full guide closes when you release the key, while keeping the regular activation shortcut independent.\r\n\r\nShortcut Guide now includes page-local search across shortcut names, descriptions, modifiers, and displayed keys. This makes it much faster to find one command without scanning an entire app's shortcut list.\r\n\r\n<img width=\"613\" height=\"524\" alt=\"Shortcut Guide search\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/SHortcutGuide.webp\" />\r\n\r\nThe experience also moves to a single transparent overlay, enabling smoother transitions, cleaner click-outside behavior, and taskbar indicators that adapt to taskbars positioned along any screen edge. Shortcut Guide adds coverage for Brave Browser, Zoom Workspace, the new Outlook for Windows, DaVinci Resolve, Greenshot, 1Password, Godot, Obsidian, ON1 Photo RAW, and Postman, alongside fixes for key rendering, navigation, and stability.\r\n\r\nBig thanks to [@noraa-junker](https://github.com/noraa-junker) for the Windows-key activation options and continued Shortcut Guide improvements!\r\n\r\nPRs: [#49661](https://github.com/microsoft/PowerToys/pull/49661), [#49639](https://github.com/microsoft/PowerToys/pull/49639), and [#48683](https://github.com/microsoft/PowerToys/pull/48683)\r\n\r\n## \ud83c\udfa5 ZoomIt adds DemoMirror\r\n\r\nZoomIt introduces **DemoMirror**, making it easier to present from one display while showing a live view on another. Press **Ctrl+9** to mirror the full screen, **Ctrl+Shift+9** to select a region, or **Ctrl+Alt+9** to mirror the window under your pointer. The mirror includes the mouse pointer, and the optional **Track window region** setting keeps a mirrored window in view as it moves or resizes.\r\n\r\n<img width=\"680\" height=\"323\" alt=\"ZoomIt DemoMirror\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/ZoomIt.webp\" />\r\n\r\nZoomIt also adds webcam background blur, microphone noise cancellation, and brightness controls for recording; WebP and JPEG screenshot and panorama formats; independently configurable Snip Save and Panorama Save shortcuts; and more capable recording, trimming, and automatic snip-copying workflows.\r\n\r\nPRs: [#49607](https://github.com/microsoft/PowerToys/pull/49607) (Thanks, [@chakrik73](https://github.com/chakrik73)!), [#48266](https://github.com/microsoft/PowerToys/pull/48266), and [#48818](https://github.com/microsoft/PowerToys/pull/48818)\r\n\r\n## \ud83d\uddb1\ufe0f Mouse Highlighter gets composition-powered ripple effects\r\n\r\nMouse Highlighter now includes a **Ripple** mode with smooth, composition-based effects for mouse clicks. In **Settings > Mouse Utilities > Mouse Highlighter**, select Ripple and customize its size, intensity, duration, drag trail, and release pulse. Left and right clicks now use green and blue by default, while existing color preferences are preserved.\r\n\r\nRipple rendering, animation, timers, and window ordering now run separately from the low-level mouse hook. This keeps clicks responsive and prevents lost button-up events, stuck ripples, and pressed states during longer sessions.\r\n\r\n<img width=\"680\" height=\"406\" alt=\"Mouse Highlighter ripple effects\" src=\"https://devblogs.microsoft.com/commandline/wp-content/uploads/sites/33/2026/08/riice.gif\" />\r\n\r\nPRs: [#48232](https://github.com/microsoft/PowerToys/pull/48232), [#49699](https://github.com/microsoft/PowerToys/pull/49699), and [#49833](https://github.com/microsoft/PowerToys/pull/49833)\r\n\r\n### \ud83e\udde9 Other notable changes\r\n\r\n*   **FancyZones:** Custom layout spacing, sensitivity, and zone-count edits now apply immediately, and a new opt-in window rotation mode can move eligible windows left or right across connected displays.\r\n*   **Keyboard Manager:** Fixed startup and elevated file-picker issues in the new editor, improved Alt and AltGr remapping reliability, and standardized modifier labels as Win, Ctrl, Alt, and Shift.\r\n*   **Peek:** Added structured Unreal Engine project and plugin previews, optional always-on-top and taskbar visibility settings, restored `.tar.gz` and `.tgz` previews, and improved shortcut and shutdown reliability.\r\n*   **PowerToys Run:** Prevented stale searches from accumulating worker threads and restored recent VS Code workspace discovery, including UNC paths.\r\n*   **File Explorer Add-ons:** Added policy-controllable Markdown previews for validated relative, local, and UNC image paths, refreshed the Monaco editor, and preserved transparency in SVG thumbnails.\r\n*   **Image Resizer:** Moved preset editing into a modern save-or-cancel dialog, clarified preset descriptions, improved File Explorer integration, and strengthened the public CLI's validation and diagnostics.\r\n*   **New+:** Improved template renaming and now places new desktop items near the context-menu pointer with per-monitor DPI awareness.\r\n*   **Mouse Without Borders:** Improved connections between computers with fresh encryption parameters and stronger session-key derivation while preserving existing pairing settings after every computer is updated.\r\n*   **Always On Top and Grab and Move:** Improved shutdown and sign-out reliability, prevented potential border-update crashes, and made full-opacity Always On Top borders render consistently.\r\n*   **Color Picker:** Kept the picker out of its own zoomed preview and improved sampling reliability on displays that report default refresh-rate values.\r\n\r\n### \u2728 Big thanks to the community\r\n\r\nAs always, a big **thank-you** to everyone who contributed \u2014 we couldn't do this release without you! Thanks [@Sthitadhi1](https://github.com/Sthitadhi1), [@daverayment](https://github.com/daverayment), [@jiripolasek](https://github.com/jiripolasek), [@Knyrps](https://github.com/Knyrps), [@JRScott812](https://github.com/JRScott812), [@Subhro-ai](https://github.com/Subhro-ai), [@pratnala](https://github.com/pratnala), [@giruuuuj](https://github.com/giruuuuj), [@MrBisquit](https://github.com/MrBisquit), [@DataVoyager-Aditya](https://github.com/DataVoyager-Aditya), [@APONTES19](https://github.com/APONTES19), [@st-gr](https://github.com/st-gr), [@pedrolamas](https://github.com/pedrolamas), [@Umoxfo](https://github.com/Umoxfo), [@LegendaryBlair](https://github.com/LegendaryBlair), [@foxmsft](https://github.com/foxmsft), [@oMatheusmol](https://github.com/oMatheusmol), [@fluffyspace](https://github.com/fluffyspace), [@agbuddy7](https://github.com/agbuddy7), [@mikeclayton](https://github.com/mikeclayton), [@cgaarden](https://github.com/cgaarden), [@Ares9323](https://github.com/Ares9323), [@AkazaRenn](https://github.com/AkazaRenn), [@zheng-fan](https://github.com/zheng-fan), [@noraa-junker](https://github.com/noraa-junker), [@gilnatab](https://github.com/gilnatab), [@Hashim1999164](https://github.com/Hashim1999164), [@thetsaw](https://github.com/thetsaw), [@MardSilva](https://github.com/MardSilva), [@ScymicX](https://github.com/ScymicX), [@jan-jaros](https://github.com/jan-jaros), [@Greyaircraft](https://github.com/Greyaircraft), [@Derylfabiensyah](https://github.com/Derylfabiensyah), [@ganmatthew](https://github.com/ganmatthew), [@class-Avirup](https://github.com/class-Avirup), [@agsoto](https://github.com/agsoto), [@0utsights](https://github.com/0utsights), [@tburns10](https://github.com/tburns10), [@tuckburns](https://github.com/tuckburns), [@Korb](https://github.com/Korb), [@brycewc](https://github.com/brycewc), [@chakrik73](https://github.com/chakrik73), [@SeanKilleen](https://github.com/SeanKilleen), [@MarioHewardt](https://github.com/MarioHewardt), [@flcdrg](https://github.com/flcdrg), [@MrRishabhJain](https://github.com/MrRishabhJain), [@tonythethompson](https://github.com/tonythethompson), [@PsychodelEKS](https://github.com/PsychodelEKS), [@antonkesy](https://github.com/antonkesy), [@gavinzhangth](https://github.com/gavinzhangth), [@Moli13337](https://github.com/Moli13337), [@snickler](https://github.com/snickler), and [@wzhudev](https://github.com/wzhudev) for your pull requests!\r\n\r\nWe're always happy to get your feedback and contributions, whether it's a bug report, a feature idea, or a pull request. Head over to the [PowerToys repo](https://github.com/microsoft/PowerToys) to jump in.\r\n\r\n### \ud83d\udd17 Useful links\r\n\r\n*   [PowerToys overview](https://learn.microsoft.com/windows/powertoys/)\r\n*   [PowerToys GitHub repository](https://github.com/microsoft/PowerToys)\r\n*   [PowerToys installation instructions](https://learn.microsoft.com/windows/powertoys/install)\r\n\r\n---\r\n\r\n## Full release notes\r\n\r\n### Advanced Paste\r\n\r\n- Added on-device Phi Silica transformations and per-action provider, prompt, coaching, and shortcut customization in [#46727](https://github.com/microsoft/PowerToys/pull/46727)\r\n- Added an Advanced Paste setting to hide the AI paste section, giving users a cleaner window when they do not need AI features in [#45242](https://github.com/microsoft/PowerToys/pull/45242)\r\n- Fixed custom OpenAI and Azure OpenAI paste actions on models that do not support the `minimal` reasoning effort by allowing service defaults in [#49840](https://github.com/microsoft/PowerToys/pull/49840), with regression coverage added in [#49867](https://github.com/microsoft/PowerToys/pull/49867) by [@Sthitadhi1](https://github.com/Sthitadhi1)\r\n\r\n### Window Hopper\r\n\r\n- Added Window Hopper for quickly switching among windows from the current application with a configurable Alt+backtick shortcut in [#48281](https://github.com/microsoft/PowerToys/pull/48281)\r\n\r\n### Always On Top\r\n\r\n- Fixed window-border updates during resource transitions, preventing potential Always On Top crashes in [#48412](https://github.com/microsoft/PowerToys/pull/48412)\r\n- Fixed Always On Top borders looking mottled at full opacity, producing a consistently solid frame with the configured shape and thickness in [#49698](https://github.com/microsoft/PowerToys/pull/49698)\r\n- Fixed Grab and Move, Always On Top, and FancyZones hanging during Windows sign-out or shutdown by letting them exit promptly in [#48404](https://github.com/microsoft/PowerToys/pull/48404)\r\n\r\n### Color Picker\r\n\r\n- Fixed the picker window appearing inside the zoomed preview, keeping sampled content unobstructed in [#48762](https://github.com/microsoft/PowerToys/pull/48762) by [@daverayment](https://github.com/daverayment)\r\n- Fixed Color Picker sampling on displays reporting default refresh-rate sentinel values, retaining the 60 Hz fallback instead of producing invalid or one-second timer intervals in [#49973](https://github.com/microsoft/PowerToys/pull/49973)\r\n\r\n### Command Palette\r\n\r\n- Added Down Arrow and Tab expansion shortcuts, making collapsed compact mode easier to use by keyboard in [#49177](https://github.com/microsoft/PowerToys/pull/49177) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added Notification Center access from the dock clock and an optional dedicated bell item in [#48514](https://github.com/microsoft/PowerToys/pull/48514) by [@Knyrps](https://github.com/Knyrps)\r\n- Added deep links to open the Extension Gallery or a specific extension's installation page in [#49780](https://github.com/microsoft/PowerToys/pull/49780) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added compact mode with configurable vertical placement, starting with a focused search box and expanding with results in [#48801](https://github.com/microsoft/PowerToys/pull/48801)\r\n- Added dock auto-hide, reclaiming screen space until the pointer reaches the dock edge in [#48565](https://github.com/microsoft/PowerToys/pull/48565)\r\n- Added consistent `sign(x)` and `sgn(x)` calculator functions, making sign calculations easier in [#49392](https://github.com/microsoft/PowerToys/pull/49392) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added disk activity, read, and write metrics to Performance Monitor with configurable units and dock support in [#48844](https://github.com/microsoft/PowerToys/pull/48844) by [@JRScott812](https://github.com/JRScott812)\r\n- Added combined network traffic across all adapters by default, with an option to select a preferred adapter in [#49678](https://github.com/microsoft/PowerToys/pull/49678) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Simplified the default Performance Monitor band to CPU and memory and added a separate network speed band in [#49674](https://github.com/microsoft/PowerToys/pull/49674) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added notification-position choices, letting users place toasts at preferred screen locations in [#49262](https://github.com/microsoft/PowerToys/pull/49262) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added icons and action buttons to extension toasts, enabling richer notifications that pause while hovered in [#49260](https://github.com/microsoft/PowerToys/pull/49260) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added disabled placeholders for unavailable Performance Monitor bands, clearly showing why metrics disappeared in [#49162](https://github.com/microsoft/PowerToys/pull/49162) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added reciprocal and inverse functions, arbitrary-base logarithms, and n-th roots while fixing inverse-function parsing in [#49356](https://github.com/microsoft/PowerToys/pull/49356) by [@Subhro-ai](https://github.com/Subhro-ai)\r\n- Added Settings and Help to the search-bar context menu, providing faster access alongside editing commands in [#49266](https://github.com/microsoft/PowerToys/pull/49266) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Added live details-pane updates, showing extension content changes without reopening the item in [#48070](https://github.com/microsoft/PowerToys/pull/48070)\r\n- Added animated acrylic notifications, delivering smoother and more polished transient messages in [#48176](https://github.com/microsoft/PowerToys/pull/48176)\r\n- Added display labels while pinning, making the correct dock easier to identify on multi-monitor systems in [#48726](https://github.com/microsoft/PowerToys/pull/48726)\r\n- Added Enter-key submission for single-line Adaptive Card forms, improving keyboard-only workflows in [#48768](https://github.com/microsoft/PowerToys/pull/48768)\r\n- Limited pin-to-dock choices to enabled displays, preventing pins that appear ineffective in [#48723](https://github.com/microsoft/PowerToys/pull/48723)\r\n- Fixed the hidden compact-mode window frame reappearing after focus changes in [#49184](https://github.com/microsoft/PowerToys/pull/49184)\r\n- Fixed deferred compact-mode page loading, improving navigation, search visibility, and accessibility announcements in [#49165](https://github.com/microsoft/PowerToys/pull/49165) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed live compact-mode switching, immediately restoring the results list when compact mode is disabled in [#49111](https://github.com/microsoft/PowerToys/pull/49111) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed quoted bookmark folder paths, reliably opening directories whose names contain spaces in [#48955](https://github.com/microsoft/PowerToys/pull/48955) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed retained Performance Monitor network items, reducing memory growth during repeated dock refreshes in [#48880](https://github.com/microsoft/PowerToys/pull/48880)\r\n- Fixed confirmation dialogs being clipped or hidden in compact mode by expanding the palette while dialogs are open in [#49451](https://github.com/microsoft/PowerToys/pull/49451)\r\n- Fixed Command Palette crashes when changing the main window backdrop at runtime and improved transparent fallback rendering in [#49755](https://github.com/microsoft/PowerToys/pull/49755) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed Settings title bar icons using the wrong foreground color after an app theme change in [#49750](https://github.com/microsoft/PowerToys/pull/49750) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed page icons disappearing when extensions change them at runtime in [#49672](https://github.com/microsoft/PowerToys/pull/49672) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Improved dock button feedback and spacing, making vertical and icon-only controls clearer in [#49703](https://github.com/microsoft/PowerToys/pull/49703) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed Extension Gallery pages without homepage links, preventing a crash in [#48869](https://github.com/microsoft/PowerToys/pull/48869)\r\n- Fixed empty icon scaling, preventing crashes when an icon fails to provide dimensions in [#49385](https://github.com/microsoft/PowerToys/pull/49385) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed Settings breadcrumbs in non-English languages, restoring reliable navigation in [#49253](https://github.com/microsoft/PowerToys/pull/49253) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Improved search ranking tiers, consistently placing exact, prefix, and acronym matches above weaker results in [#49189](https://github.com/microsoft/PowerToys/pull/49189)\r\n- Prevented collapsed compact mode from executing an unseen selected result in [#49182](https://github.com/microsoft/PowerToys/pull/49182) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Improved Window Walker responsiveness with cached results, background refreshes, and progressive icon loading in [#49317](https://github.com/microsoft/PowerToys/pull/49317) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed overlapping dock visual states, producing consistent text, icon, spacing, and alignment in [#49319](https://github.com/microsoft/PowerToys/pull/49319) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed bookmark titles and icons in the Add band flyout, including a reliable loading fallback in [#49336](https://github.com/microsoft/PowerToys/pull/49336) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed the Open Command Palette dock item, reliably returning users to the root page in [#49095](https://github.com/microsoft/PowerToys/pull/49095) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Prevented delayed palette updates from stealing focus from other applications in [#49087](https://github.com/microsoft/PowerToys/pull/49087) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed the Run command's default alias mapping and migrated existing aliases automatically in [#49384](https://github.com/microsoft/PowerToys/pull/49384) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed large Extension Gallery screenshot strips, preventing crashes during horizontal scrolling in [#48090](https://github.com/microsoft/PowerToys/pull/48090)\r\n- Fixed pinned bookmark bands after restart, preserving dock customizations through transient loading failures in [#48092](https://github.com/microsoft/PowerToys/pull/48092)\r\n- Fixed stale dock clocks, applying second-display preferences immediately without repetitive screen-reader interruptions in [#48253](https://github.com/microsoft/PowerToys/pull/48253)\r\n- Fixed multi-GPU cycling in Performance Monitor, showing metrics and names for the active GPU in [#48503](https://github.com/microsoft/PowerToys/pull/48503) by [@pratnala](https://github.com/pratnala)\r\n- Fixed performance widgets showing `???` after restart, refreshing values when data becomes available in [#48682](https://github.com/microsoft/PowerToys/pull/48682) by [@giruuuuj](https://github.com/giruuuuj)\r\n- Prevented duplicate settings history entries, making Back navigation more predictable in [#48703](https://github.com/microsoft/PowerToys/pull/48703)\r\n- Fixed Run history initialization in optimized builds, restoring previously used commands after startup in [#48463](https://github.com/microsoft/PowerToys/pull/48463)\r\n- Prevented repeated shortcut-dialog requests from crashing Command Palette or Settings in [#49334](https://github.com/microsoft/PowerToys/pull/49334) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Limited expanded compact mode to the current monitor, keeping the palette fully on-screen after display changes in [#49532](https://github.com/microsoft/PowerToys/pull/49532)\r\n- Reduced retained resources during prolonged use, improving Command Palette stability in [#48884](https://github.com/microsoft/PowerToys/pull/48884)\r\n- Improved icon loading responsiveness and allowed failed or interrupted loads to retry in [#49738](https://github.com/microsoft/PowerToys/pull/49738) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Reduced UI stalls during concurrent icon updates by removing broad icon-cache locking in [#49737](https://github.com/microsoft/PowerToys/pull/49737) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Reduced unnecessary Performance Monitor refresh work while disk metrics update in [#49735](https://github.com/microsoft/PowerToys/pull/49735) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Improved cleanup when commands and parameter lists are replaced or fail to initialize, reducing retained extension resources in [#49730](https://github.com/microsoft/PowerToys/pull/49730) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Improved cleanup of extension objects after navigating away from list pages in [#49732](https://github.com/microsoft/PowerToys/pull/49732) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Improved cleanup when top-level commands, dock bands, or providers are removed, reloaded, or disabled in [#49728](https://github.com/microsoft/PowerToys/pull/49728) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed SDK command subscriptions remaining attached after replacement, allowing extension objects to be released in [#49731](https://github.com/microsoft/PowerToys/pull/49731) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Reduced unnecessary work after settings changes, avoiding unrelated hotkey, backdrop, and dock recreation in [#49171](https://github.com/microsoft/PowerToys/pull/49171) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Corrected Alt+F4 handling, keeping docks open and adding control over whether the main palette quits in [#49708](https://github.com/microsoft/PowerToys/pull/49708)\r\n- Corrected the Hibernate command icon, clearly distinguishing it from Sleep in [#48689](https://github.com/microsoft/PowerToys/pull/48689) by [@MrBisquit](https://github.com/MrBisquit)\r\n- Corrected multi-engine GPU calculations, keeping dock usage values at realistic levels in [#48710](https://github.com/microsoft/PowerToys/pull/48710)\r\n- Refactored transient overlays into reusable animated surfaces, preserving polished notifications and enabling consistent future experiences in [#48915](https://github.com/microsoft/PowerToys/pull/48915)\r\n- Removed one-pixel gaps between docks and screen edges, creating flush layouts across Windows versions in [#49641](https://github.com/microsoft/PowerToys/pull/49641) and [#48091](https://github.com/microsoft/PowerToys/pull/48091)\r\n- Refreshed the display list when Dock settings opens, showing newly connected monitors immediately in [#49705](https://github.com/microsoft/PowerToys/pull/49705)\r\n- Restored the previous Performance Monitor widget refresh behavior after restart to avoid regressions in [#48835](https://github.com/microsoft/PowerToys/pull/48835)\r\n- Removed the unintended link icon from the dock clock, keeping its appearance clear in [#49309](https://github.com/microsoft/PowerToys/pull/49309)\r\n- Recognized Origin, Ubisoft Connect, and Xbox internet shortcuts as launchable apps in [#49241](https://github.com/microsoft/PowerToys/pull/49241) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Removed the separator below the search bar when compact mode is collapsed in [#49313](https://github.com/microsoft/PowerToys/pull/49313) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Simplified the file picker button label to \u201cSelect file\u201d in [#49752](https://github.com/microsoft/PowerToys/pull/49752) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Stretched expanded palette content vertically, filling the available window instead of shrinking to content in [#49109](https://github.com/microsoft/PowerToys/pull/49109) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Deduplicated Windows Settings by title and destination, retaining distinct settings while removing true duplicates in [#49340](https://github.com/microsoft/PowerToys/pull/49340) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Preserved manual result scrolling and selection while more items load, preventing snap-back interruptions in [#49354](https://github.com/microsoft/PowerToys/pull/49354) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Disabled compact mode by default, opening Command Palette in its full expanded experience in [#49186](https://github.com/microsoft/PowerToys/pull/49186)\r\n- Removed disabled fallback commands from search results, respecting users' fallback preferences in [#48777](https://github.com/microsoft/PowerToys/pull/48777)\r\n- Removed Uninstall actions from protected Windows apps, avoiding unusable commands in [#48804](https://github.com/microsoft/PowerToys/pull/48804)\r\n- Reduced Narrator output when opening Command Palette's More actions menu, providing one clear announcement while retaining useful navigation feedback in [#48928](https://github.com/microsoft/PowerToys/pull/48928)\r\n- Expanded Command Palette's Windows Settings search with localized Control Panel tasks, making tools such as Game Controllers, File History, and Performance Options easy to find and launch in [#49252](https://github.com/microsoft/PowerToys/pull/49252) by [@DataVoyager-Aditya](https://github.com/DataVoyager-Aditya) and [@jiripolasek](https://github.com/jiripolasek)\r\n- Consolidated the remaining search-ranking improvements so result scoring is applied consistently across Command Palette in [#49832](https://github.com/microsoft/PowerToys/pull/49832)\r\n- Fixed dock band activation and cleanup races, reducing the chance of bands becoming stuck during rebuilds in [#49739](https://github.com/microsoft/PowerToys/pull/49739) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Simplified Command Palette settings with clearer General and Personalization sections and removed obsolete extension-discovery UI in [#49865](https://github.com/microsoft/PowerToys/pull/49865)\r\n- Ignored failed package catalog operations instead of treating them as successful extension changes in [#49887](https://github.com/microsoft/PowerToys/pull/49887) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed docks becoming empty or misconfigured after docking, undocking, or changing monitor topology in [#49814](https://github.com/microsoft/PowerToys/pull/49814)\r\n- Reduced retained resources during dock refreshes by reusing item view models, coalescing refreshes, and cleaning replaced views in [#49742](https://github.com/microsoft/PowerToys/pull/49742) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Ranked global fallback commands by live title and subtitle matches, allowing exact fallbacks to appear with similarly relevant results in [#49983](https://github.com/microsoft/PowerToys/pull/49983)\r\n- Added Update and restart and Update and shut down system commands that appear when Windows Update is waiting for a reboot in [#49437](https://github.com/microsoft/PowerToys/pull/49437) by [@Subhro-ai](https://github.com/Subhro-ai)\r\n\r\n### Environment Variables\r\n\r\n- Restricted profile changes to the current user's environment, matching the documented scope in [#48740](https://github.com/microsoft/PowerToys/pull/48740)\r\n- Centralized profile and variable validation, preventing invalid registry writes and improving error guidance in [#46837](https://github.com/microsoft/PowerToys/pull/46837) by [@daverayment](https://github.com/daverayment)\r\n\r\n### FancyZones\r\n\r\n- Prevented shutdown and reconfiguration races, improving stability during display changes, dragging, and exit in [#48473](https://github.com/microsoft/PowerToys/pull/48473)\r\n- Ended dragging cleanly when a window closes, removing stuck overlays and restoring intercepted keys in [#48569](https://github.com/microsoft/PowerToys/pull/48569) by [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Applied custom-layout spacing, sensitivity, and zone-count edits immediately without restarting or reapplying in [#49433](https://github.com/microsoft/PowerToys/pull/49433) by [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Added an opt-in monitor window rotation mode for previewing and moving processable windows left or right across connected displays in [#48772](https://github.com/microsoft/PowerToys/pull/48772) by [@APONTES19](https://github.com/APONTES19)\r\n\r\n### File Explorer\r\n\r\n- Updated the Monaco Editor used by preview experiences, refreshing language support and editor assets in [#48415](https://github.com/microsoft/PowerToys/pull/48415)\r\n- Aligned the File Explorer Add-ons page and navigation titles for a consistent Settings experience in [#49692](https://github.com/microsoft/PowerToys/pull/49692)\r\n- Added an optional, policy-controllable Markdown preview setting for securely rendering validated relative, local, and UNC image paths in [#47857](https://github.com/microsoft/PowerToys/pull/47857) by [@st-gr](https://github.com/st-gr)\r\n- Preserved SVG alpha transparency in thumbnails instead of rendering transparent areas as black in [#49301](https://github.com/microsoft/PowerToys/pull/49301) by [@pedrolamas](https://github.com/pedrolamas)\r\n\r\n### File Locksmith\r\n\r\n- Fixed Windows 11 context-menu items not using localized text in [#49606](https://github.com/microsoft/PowerToys/pull/49606) by [@Umoxfo](https://github.com/Umoxfo)\r\n- Fixed File Locksmith crashing when a listed process executable no longer exists by showing a fallback icon and keeping the process available in [#48719](https://github.com/microsoft/PowerToys/pull/48719) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n\r\n### Find My Mouse\r\n\r\n- Improved Chinese Find My Mouse translations to retain the familiar Ctrl key label, making activation options easier to understand in [#49693](https://github.com/microsoft/PowerToys/pull/49693)\r\n\r\n### Grab and Move\r\n\r\n- Anchored restored maximized windows to the original grab point for more predictable dragging in [#49118](https://github.com/microsoft/PowerToys/pull/49118) by [@foxmsft](https://github.com/foxmsft)\r\n- Refined Grab and Move overlays to hug visible window frames with a warning-gold outline and reduced the default Always On Top border to 4 pixels for cleaner visuals in [#48474](https://github.com/microsoft/PowerToys/pull/48474)\r\n- Matched Grab and Move overlay corners to square windows in remote desktop sessions while preserving rounded corners locally in [#48999](https://github.com/microsoft/PowerToys/pull/48999)\r\n- Allowed modifier-clicks without dragging to reach the target application while retaining window move and resize gestures in [#49121](https://github.com/microsoft/PowerToys/pull/49121) by [@foxmsft](https://github.com/foxmsft)\r\n\r\n### Image Resizer\r\n\r\n- Added complete MSIX logo sets for File Locksmith, Image Resizer, and PowerRename so their context-menu icons display correctly across Windows surfaces in [#48925](https://github.com/microsoft/PowerToys/pull/48925)\r\n- Corrected Image Resizer context-menu command reporting to improve File Explorer compatibility and avoid unsupported command responses in [#48399](https://github.com/microsoft/PowerToys/pull/48399)\r\n- Clarified Image Resizer preset descriptions with a consistent mode-and-dimensions format across the resize dialog and Settings in [#49694](https://github.com/microsoft/PowerToys/pull/49694)\r\n- Moved Image Resizer preset editing into a modern confirmation dialog so canceled changes are discarded and settings are written only after saving in [#49161](https://github.com/microsoft/PowerToys/pull/49161)\r\n- Made the public Image Resizer CLI validate options, files, and dimensions strictly, deduplicate equivalent inputs, and report actionable diagnostics in [#49854](https://github.com/microsoft/PowerToys/pull/49854)\r\n\r\n### Keyboard Manager\r\n\r\n- Fixed a startup crash that prevented the new Keyboard Manager editor from opening, while improving early diagnostics and Windows 10 window rendering in [#49524](https://github.com/microsoft/PowerToys/pull/49524)\r\n- Fixed the Keyboard Manager editor's program and folder browse dialogs failing to open when PowerToys is running as administrator in [#48876](https://github.com/microsoft/PowerToys/pull/48876)\r\n- Fixed key-to-text remaps while Alt is held and prevented modifiers from becoming stuck or failed remaps from being dropped in [#48571](https://github.com/microsoft/PowerToys/pull/48571)\r\n- Fixed modifier-to-regular-key remaps being treated as system shortcuts so mappings such as Left Alt to Backspace perform the intended action in [#47192](https://github.com/microsoft/PowerToys/pull/47192) by [@oMatheusmol](https://github.com/oMatheusmol)\r\n- Fixed Ctrl remaining stuck after AltGr was pressed without activating a remapped shortcut, restoring reliable keyboard input in [#46672](https://github.com/microsoft/PowerToys/pull/46672) by [@fluffyspace](https://github.com/fluffyspace)\r\n- Standardized shortcut modifier display as Win, Ctrl, Alt, and Shift regardless of press order for easier recognition in [#49707](https://github.com/microsoft/PowerToys/pull/49707) by [@agbuddy7](https://github.com/agbuddy7)\r\n\r\n### Mouse Highlighter\r\n\r\n- Added customizable ripple effects for mouse clicks, making click activity easier to see in [#48232](https://github.com/microsoft/PowerToys/pull/48232)\r\n- Moved ripple rendering, animation, timers, and Z-order work off the low-level mouse hook, preventing lost button-up events and stuck ripple or pressed states in [#49699](https://github.com/microsoft/PowerToys/pull/49699)\r\n- Updated default left- and right-click highlights to green and blue while preserving existing user preferences in [#49833](https://github.com/microsoft/PowerToys/pull/49833)\r\n\r\n### Mouse Jump\r\n\r\n- Modernized Mouse Jump with a WinUI 3 interface, improved multi-monitor and mixed-DPI behavior, and added keyboard shortcuts for selecting monitors in [#48393](https://github.com/microsoft/PowerToys/pull/48393) by [@LegendaryBlair](https://github.com/LegendaryBlair) and [@mikeclayton](https://github.com/mikeclayton)\r\n- Updated release signing for the new Mouse Jump binaries so x64 and ARM64 builds complete successfully in [#49747](https://github.com/microsoft/PowerToys/pull/49747) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n\r\n### Mouse Utilities\r\n\r\n- Clarified the Gliding Cursor description so users understand that its keyboard shortcut positions the pointer and performs a click in [#49691](https://github.com/microsoft/PowerToys/pull/49691)\r\n\r\n### Mouse Without Borders\r\n\r\n- Fixed the German \u201cDrag & Drop\u201d text so Mouse Without Borders displays a normal ampersand instead of an HTML entity in [#49687](https://github.com/microsoft/PowerToys/pull/49687)\r\n- Improved connections between Mouse Without Borders computers while preserving existing pairing settings after every computer is updated, using fresh encryption parameters in [#48742](https://github.com/microsoft/PowerToys/pull/48742) and stronger session-key derivation in [#49600](https://github.com/microsoft/PowerToys/pull/49600)\r\n\r\n### New+\r\n\r\n- Corrected French localization guidance so New+ appears as \u201cNouveau+\u201d instead of the inaccurate \u201cNouveaut\u00e9+\u201d in [#47225](https://github.com/microsoft/PowerToys/pull/47225)\r\n- Updated the New+ attribution text and link to accurately credit the original New++ utility in [#49047](https://github.com/microsoft/PowerToys/pull/49047) by [@cgaarden](https://github.com/cgaarden)\r\n- Improved template renaming and positioned new desktop items near the context-menu cursor with per-monitor DPI handling in [#48083](https://github.com/microsoft/PowerToys/pull/48083) by [@cgaarden](https://github.com/cgaarden)\r\n\r\n### Peek\r\n\r\n- Added JSON syntax highlighting, folding, and structured navigation for Unreal Engine project and plugin files in Peek in [#47931](https://github.com/microsoft/PowerToys/pull/47931) by [@Ares9323](https://github.com/Ares9323)\r\n- Added Peek settings to keep its window on top and show or hide its taskbar and app-switcher icon in [#44645](https://github.com/microsoft/PowerToys/pull/44645) by [@AkazaRenn](https://github.com/AkazaRenn)\r\n- Updated Peek's archive handling, restoring `.tar.gz` and `.tgz` previews while improving extracted-size and non-ASCII filename accuracy in [#49520](https://github.com/microsoft/PowerToys/pull/49520)\r\n- Fixed Peek\u2019s close and navigation shortcuts after focus moves into web or native preview content in [#48293](https://github.com/microsoft/PowerToys/pull/48293) by [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Fixed system media controls so Peek appears only for media previews and disappears after switching files or closing in [#46899](https://github.com/microsoft/PowerToys/pull/46899) by [@MuyuanMS](https://github.com/MuyuanMS) and [@zheng-fan](https://github.com/zheng-fan)\r\n- Fixed Monaco registration for Unreal Engine project and plugin files to restore their intended editor support in [#49300](https://github.com/microsoft/PowerToys/pull/49300) by [@noraa-junker](https://github.com/noraa-junker)\r\n- Improved Peek and Registry Preview shutdown reliability by containing cleanup failures and clearing stale preview-handler resources in [#48564](https://github.com/microsoft/PowerToys/pull/48564) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n\r\n### PowerDisplay\r\n\r\n- Added linked brightness control to adjust multiple monitors from one slider while allowing selected displays to remain independent in [#48207](https://github.com/microsoft/PowerToys/pull/48207) by [@gilnatab](https://github.com/gilnatab)\r\n- Enabled PowerDisplay to wake supported monitors from standby by selecting On in the power-state control in [#48628](https://github.com/microsoft/PowerToys/pull/48628)\r\n- Added stable profile IDs so duplicate names and renames retain reliable PowerDisplay and Light Switch references in [#49175](https://github.com/microsoft/PowerToys/pull/49175)\r\n- Added an opt-in setting to adjust primary or linked display brightness by scrolling over the PowerDisplay tray icon in [#49446](https://github.com/microsoft/PowerToys/pull/49446)\r\n- Added a PowerDisplay setting for choosing how much brightness, contrast, and volume sliders change per mouse-wheel notch in [#49002](https://github.com/microsoft/PowerToys/pull/49002)\r\n- Added a PowerDisplay command-line interface for monitor controls, enabling scripts to inspect displays, change settings, and apply saved profiles in [#48632](https://github.com/microsoft/PowerToys/pull/48632)\r\n- Fixed built-in laptop panel detection when a discrete GPU drives the display, restoring brightness control on hybrid-GPU systems in [#48637](https://github.com/microsoft/PowerToys/pull/48637)\r\n- Improved Maximum compatibility mode by reusing previous successful monitor readings after intermittent communication failures in [#49445](https://github.com/microsoft/PowerToys/pull/49445)\r\n- Prevented recent PowerDisplay setting changes from being lost during exit by coordinating and atomically publishing monitor-state saves in [#49629](https://github.com/microsoft/PowerToys/pull/49629)\r\n- Improved Maximum compatibility mode by reusing probe results, reducing traffic to unreliable monitors and preserving more accurate displayed values in [#49596](https://github.com/microsoft/PowerToys/pull/49596)\r\n- Fixed tray-menu exit cleanup so PowerDisplay removes its icon immediately and restarts cleanly in [#49580](https://github.com/microsoft/PowerToys/pull/49580)\r\n- Improved monitor detection in Maximum compatibility mode by pacing and retrying transient control probes without repeating definitive failures in [#49579](https://github.com/microsoft/PowerToys/pull/49579)\r\n- Prevented monitor-handle resource usage from accumulating when PowerDisplay abandons failed discovery attempts in [#49578](https://github.com/microsoft/PowerToys/pull/49578)\r\n- Fixed monitor setting restoration so saved brightness, contrast, volume, and color temperature are applied even after failed discovery reads in [#49577](https://github.com/microsoft/PowerToys/pull/49577)\r\n\r\n### PowerToys Run\r\n\r\n- Corrected \u201csearchbox\u201d to \u201csearch box\u201d in the plugin keyword settings description in [#49777](https://github.com/microsoft/PowerToys/pull/49777) by [@Hashim1999164](https://github.com/Hashim1999164)\r\n- Updated the DiskAnalyzer plugin listing to its current ValleySoft repository and author, restoring access to the maintained project in [#48618](https://github.com/microsoft/PowerToys/pull/48618) by [@thetsaw](https://github.com/thetsaw)\r\n- Fixed stale PowerToys Run queries leaking workers during rapid typing, preventing thread growth and eventual out-of-memory failures in [#48394](https://github.com/microsoft/PowerToys/pull/48394)\r\n- Restored recent VS Code workspace discovery across supported variants after storage-location changes, with duplicate results removed in [#47505](https://github.com/microsoft/PowerToys/pull/47505) by [@MardSilva](https://github.com/MardSilva)\r\n- Fixed VS Code workspace handling for UNC network paths, allowing shared workspaces to appear and open correctly in [#48922](https://github.com/microsoft/PowerToys/pull/48922) by [@ScymicX](https://github.com/ScymicX)\r\n- Added DevDocs and PoetSearch to the third-party plugin directory in [#49697](https://github.com/microsoft/PowerToys/pull/49697) by [@jan-jaros](https://github.com/jan-jaros) and [#49946](https://github.com/microsoft/PowerToys/pull/49946) by [@Greyaircraft](https://github.com/Greyaircraft)\r\n\r\n### Quick Accent\r\n\r\n- Added an optional press-and-hold activation mode, enabling accent selection by holding a letter without disrupting quick taps or shortcuts in [#48937](https://github.com/microsoft/PowerToys/pull/48937)\r\n- Fixed press-and-hold activation showing the picker after another key cancels the pending action in [#49701](https://github.com/microsoft/PowerToys/pull/49701)\r\n- Fixed the final character's selection highlight disappearing when long character lists are scrolled to the end in [#49820](https://github.com/microsoft/PowerToys/pull/49820)\r\n- Modernized the Quick Accent selector with WinUI 3, preserving familiar interactions while improving theming, accessibility, and DPI-aware positioning in [#48891](https://github.com/microsoft/PowerToys/pull/48891)\r\n- Added inverted exclamation and question marks to the relevant Quick Accent menus for Spanish and Catalan in [#48599](https://github.com/microsoft/PowerToys/pull/48599) by [@Derylfabiensyah](https://github.com/Derylfabiensyah)\r\n- Added the Philippine peso symbol to the P-key menu in the Currency character set in [#48444](https://github.com/microsoft/PowerToys/pull/48444) by [@ganmatthew](https://github.com/ganmatthew)\r\n- Added Belarusian Latin and Cyrillic character sets, expanding Quick Accent language coverage in [#48344](https://github.com/microsoft/PowerToys/pull/48344) by [@daverayment](https://github.com/daverayment)\r\n- Corrected Bulgarian character mappings and added commonly used currency, quotation, and punctuation symbols in [#49344](https://github.com/microsoft/PowerToys/pull/49344) by [@daverayment](https://github.com/daverayment)\r\n- Added Pitjantjatjara and Yankunytjatjara retroflex consonants to Quick Accent, enabling accurate typing without a specialized keyboard in [#48561](https://github.com/microsoft/PowerToys/pull/48561) by [@class-Avirup](https://github.com/class-Avirup)\r\n- Fixed the Quick Accent bar appearing blank, clipped, or undersized on its first frame, ensuring wider characters display correctly in [#49633](https://github.com/microsoft/PowerToys/pull/49633)\r\n- Fixed the Quick Accent bar reappearing with a stale frame by cloaking it while hidden, keeping it rendered and removing the fixed reveal delay in [#49655](https://github.com/microsoft/PowerToys/pull/49655)\r\n- Fixed canceled Quick Accent activations leaving letters stuck as held, keeping Keyboard Manager remaps and other shortcuts responsive in [#49644](https://github.com/microsoft/PowerToys/pull/49644) by [@agsoto](https://github.com/agsoto)\r\n- Fixed stale render timers making the Quick Accent toolbar flash or appear too early after repeated key presses in [#48944](https://github.com/microsoft/PowerToys/pull/48944)\r\n- Fixed Quick Accent clipping or shifting the final character when descriptions are disabled, including on scaled displays in [#49402](https://github.com/microsoft/PowerToys/pull/49402) by [@0utsights](https://github.com/0utsights) and [@daverayment](https://github.com/daverayment)\r\n- Prevented inserted characters and navigation keys from retriggering PowerToys shortcuts, improving reliability across repeated Quick Accent activations in [#48572](https://github.com/microsoft/PowerToys/pull/48572)\r\n- Corrected and expanded currency mappings for Greek, Hebrew, and Vietnamese character sets in [#49343](https://github.com/microsoft/PowerToys/pull/49343) by [@daverayment](https://github.com/daverayment)\r\n- Expanded and reorganized IPA and Special character mappings, adding more phonetic symbols, punctuation, and per-mille characters in [#49030](https://github.com/microsoft/PowerToys/pull/49030) by [@daverayment](https://github.com/daverayment)\r\n\r\n### Screen Ruler\r\n\r\n- Migrated legacy measurement-unit values and repaired invalid settings, preventing Settings from crashing when leaving the Screen Ruler page in [#49898](https://github.com/microsoft/PowerToys/pull/49898)\r\n\r\n### Settings\r\n\r\n- Added a selector for choosing Stable or Insider update channels in [#49722](https://github.com/microsoft/PowerToys/pull/49722)\r\n- Restored navigation to the General page by applying the correct style to the update-channel description, preventing a XAML parsing failure in [#49801](https://github.com/microsoft/PowerToys/pull/49801) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Resolved the PowerToys install path from the running executable before falling back to the registry, making Settings deep links and Workspaces launches more reliable in [#48905](https://github.com/microsoft/PowerToys/pull/48905)\r\n- Added progress and result feedback to the Bug Report flow, with quick access to the generated ZIP and a prefilled GitHub issue in [#48980](https://github.com/microsoft/PowerToys/pull/48980)\r\n- Improved PowerToys component communication to reduce hangs, stale callbacks, and blocked writes during shutdown in [#48902](https://github.com/microsoft/PowerToys/pull/48902)\r\n- Fixed the FancyZones Settings page bouncing near Excluded apps, making bottom-of-page scrolling smooth and predictable in [#47937](https://github.com/microsoft/PowerToys/pull/47937)\r\n- Improved Settings navigation and search failure handling, preventing unexpected errors from terminating the app in [#46688](https://github.com/microsoft/PowerToys/pull/46688) by [@tburns10](https://github.com/tburns10) and [@tuckburns](https://github.com/tuckburns)\r\n- Fixed unreadable What's New headings, links, content, and caption buttons when Windows and PowerToys use different themes in [#48910](https://github.com/microsoft/PowerToys/pull/48910)\r\n- Made attribution wording and the Stereolithography term localizable, enabling more natural translations across Settings in [#49690](https://github.com/microsoft/PowerToys/pull/49690)\r\n- Protected elevated Runner commands by verifying Settings and Quick Access clients before accepting requests, preserving normal communication while rejecting untrusted callers in [#49527](https://github.com/microsoft/PowerToys/pull/49527) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Redesigned update notifications with consistent state badges and a compact status surface for checking, downloading, ready-to-install, and failure states in [#49872](https://github.com/microsoft/PowerToys/pull/49872)\r\n- Moved the NEW badge from Shortcut Guide to Window Hopper so Settings highlights the newly introduced utility in [#49995](https://github.com/microsoft/PowerToys/pull/49995)\r\n\r\n### Shortcut Guide\r\n\r\n- Added Brave Browser shortcuts covering tabs, Brave features, the address bar, and web page navigation in [#49615](https://github.com/microsoft/PowerToys/pull/49615)\r\n- Added correct less-than and greater-than key rendering and prevented crashes from empty or invalid shortcut keys in [#49562](https://github.com/microsoft/PowerToys/pull/49562) by [@noraa-junker](https://github.com/noraa-junker)\r\n- Added Greenshot capture and editor shortcuts to Shortcut Guide in [#49407](https://github.com/microsoft/PowerToys/pull/49407) by [@Korb](https://github.com/Korb) and [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Added the Win+, desktop peek shortcut to the Windows shortcuts view in [#49638](https://github.com/microsoft/PowerToys/pull/49638)\r\n- Added Zoom Workspace shortcuts to Shortcut Guide, surfacing common meeting, view, mute, video, sharing, and leave controls while Zoom is active in [#49062](https://github.com/microsoft/PowerToys/pull/49062)\r\n- Added email, calendar, navigation, formatting, and editing shortcuts for the new Outlook for Windows in [#48821](https://github.com/microsoft/PowerToys/pull/48821)\r\n- Added common editing, playback, and color-grading shortcuts for DaVinci Resolve in [#48652](https://github.com/microsoft/PowerToys/pull/48652) by [@giruuuuj](https://github.com/giruuuuj)\r\n- Added navigation, item, account, locking, and view shortcuts for the 1Password desktop app in [#48793](https://github.com/microsoft/PowerToys/pull/48793) by [@brycewc](https://github.com/brycewc)\r\n- Added bundled Godot shortcuts to Shortcut Guide, making common editor commands available at a glance in [#48959](https://github.com/microsoft/PowerToys/pull/48959)\r\n- Added common Obsidian shortcuts to Shortcut Guide, making navigation, tab, and editing commands easier to recall in [#48960](https://github.com/microsoft/PowerToys/pull/48960)\r\n- Added ON1 Photo RAW shortcuts to Shortcut Guide, covering navigation, editing, masking, and other common workflows in [#49143](https://github.com/microsoft/PowerToys/pull/49143)\r\n- Added Postman shortcuts and fixed numbered-key rendering, making tab, request, sidebar, console, and digit-based commands display correctly in [#48461](https://github.com/microsoft/PowerToys/pull/48461) by [@brycewc](https://github.com/brycewc)\r\n- Fixed Shortcut Guide crashing or closing when navigating between sidebar sections in [#48481](https://github.com/microsoft/PowerToys/pull/48481)\r\n- Fixed number-key rendering across bundled app manifests, making displayed shortcuts accurate in Adobe apps, browsers, Slack, Visual Studio Code, Blender, Figma, and Notepad in [#48757](https://github.com/microsoft/PowerToys/pull/48757) by [@brycewc](https://github.com/brycewc)\r\n- Replaced dual windows with a single transparent overlay, delivering smoother transitions, edge-aware taskbar indicators, and an on-screen hold control in [#48683](https://github.com/microsoft/PowerToys/pull/48683) by [@noraa-junker](https://github.com/noraa-junker)\r\n- Renamed Win+Q as Open Click to Do on Copilot+ PCs while preserving the Windows Search label for Win+S in [#48439](https://github.com/microsoft/PowerToys/pull/48439)\r\n- Added configurable Windows-key hold behavior: disabled, taskbar indicators, or the full guide, with hold duration and close-on-release options in [#49661](https://github.com/microsoft/PowerToys/pull/49661) by [@noraa-junker](https://github.com/noraa-junker)\r\n- Added accessible page-local search across shortcut names, descriptions, modifiers, and displayed keys in [#49639](https://github.com/microsoft/PowerToys/pull/49639)\r\n\r\n### ZoomIt\r\n\r\n- Added DemoMirror to mirror a screen, region, or hovered window with the pointer onto a second monitor for clearer presentations in [#49607](https://github.com/microsoft/PowerToys/pull/49607) by [@chakrik73](https://github.com/chakrik73)\r\n- Added independently configurable ZoomIt Snip Save and Panorama Save shortcuts, preventing derived combinations from overriding common shortcuts such as Ctrl+S in [#49075](https://github.com/microsoft/PowerToys/pull/49075) by [@foxmsft](https://github.com/foxmsft) and [@SeanKilleen](https://github.com/SeanKilleen)\r\n- Added WebP and JPEG formats for ZoomIt screenshots and panorama captures, with zoomed and actual-size save options where applicable in [#48818](https://github.com/microsoft/PowerToys/pull/48818) by [@MarioHewardt](https://github.com/MarioHewardt)\r\n- Added webcam background blur, microphone noise cancellation, and brightness controls to video recording while restoring Mono audio and reliable standalone shortcuts in [#48266](https://github.com/microsoft/PowerToys/pull/48266) by [@foxmsft](https://github.com/foxmsft) and [@MarioHewardt](https://github.com/MarioHewardt)\r\n- Added interior video segment deletion, automatic snip copying, and recording borders while improving trim reliability, making ZoomIt capture and editing workflows more capable in [#49553](https://github.com/microsoft/PowerToys/pull/49553) by [@chakrik73](https://github.com/chakrik73)\r\n- Fixed repeated or garbled wording in ZoomIt's Chinese description in [#47370](https://github.com/microsoft/PowerToys/pull/47370) by [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Fixed a race that could crash ZoomIt when video recording with audio started before initialization completed in [#48685](https://github.com/microsoft/PowerToys/pull/48685) by [@MarioHewardt](https://github.com/MarioHewardt)\r\n- Fixed custom recording filenames losing numeric suffixes, while timestamped defaults now sort more clearly in [#43236](https://github.com/microsoft/PowerToys/pull/43236) by [@daverayment](https://github.com/daverayment)\r\n- Improved ZoomIt dialog alignment, spacing, and text layout, making configuration screens more consistent and readable in [#49210](https://github.com/microsoft/PowerToys/pull/49210) by [@foxmsft](https://github.com/foxmsft)\r\n- Prevented failed audio initialization from racing with recording startup and destabilizing ZoomIt in [#49912](https://github.com/microsoft/PowerToys/pull/49912)\r\n\r\n### Development\r\n\r\n- Added next-generation UI test suites for Image Resizer, Peek, File Explorer add-ons, and File Locksmith, plus local VM tooling and CI test-signing support in [#49671](https://github.com/microsoft/PowerToys/pull/49671)\r\n- Improved release version handling so automatic builds use a clear default and explicit versions can recover from exhausted daily counters in [#49745](https://github.com/microsoft/PowerToys/pull/49745) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Advanced automatic preview builds to the PowerToys 0.101 release train in [#49795](https://github.com/microsoft/PowerToys/pull/49795) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Added opt-in preview update checks while retaining stable updates by default, clearly identifying preview builds and isolating their publishing flows in [#49414](https://github.com/microsoft/PowerToys/pull/49414) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Fixed Runner hangs during Windows shutdown, restart, and sign-out, allowing PowerToys to exit promptly while preserving normal exit cleanup in [#48363](https://github.com/microsoft/PowerToys/pull/48363)\r\n- Removed unused updater constants, simplifying maintenance and reducing dead code in [#46974](https://github.com/microsoft/PowerToys/pull/46974)\r\n- Rejected invalid cached installer filenames that resolve outside the Updates folder, keeping normal updates on the intended path in [#48741](https://github.com/microsoft/PowerToys/pull/48741)\r\n- Restricted each autorun task to its owner, administrators, and the system account while preserving startup and elevated-run behavior in [#48739](https://github.com/microsoft/PowerToys/pull/48739)\r\n- Verified downloaded update installers before launch, rejecting unsigned, corrupted, or unexpected packages in [#48903](https://github.com/microsoft/PowerToys/pull/48903) by [@LegendaryBlair](https://github.com/LegendaryBlair) and [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Anchored updater shutdown waits to the original PowerToys process, preventing recycled process IDs from delaying or disrupting updates in [#46973](https://github.com/microsoft/PowerToys/pull/46973)\r\n- Added fallback window titles across affected utilities, preventing startup crashes when localized titles are temporarily unavailable in [#49069](https://github.com/microsoft/PowerToys/pull/49069)\r\n- Corrected Bug Report Tool event-detail formatting to safely handle unusually long data and keep report collection reliable in [#48398](https://github.com/microsoft/PowerToys/pull/48398)\r\n- Fixed spelling checks for third-party ZoomIt sources and binary assets, preventing unrelated files from disrupting validation in [#48548](https://github.com/microsoft/PowerToys/pull/48548)\r\n- Hardened centralized keyboard handling against released keys and shutdown races, preventing stuck or ghost hotkey actions in [#48570](https://github.com/microsoft/PowerToys/pull/48570)\r\n- Hardened PowerShell-based resource generation against user profiles and module warnings, making builds more reliable in [#46729](https://github.com/microsoft/PowerToys/pull/46729) by [@flcdrg](https://github.com/flcdrg)\r\n- Strengthened navigation-failure tests for missing page and exception details, helping prevent future Settings crashes in [#48410](https://github.com/microsoft/PowerToys/pull/48410)\r\n- Fixed native compilation for the built-in Bookmarks extension by removing invalid COM metadata in [#49357](https://github.com/microsoft/PowerToys/pull/49357) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Updated Command Palette to version 0.12, aligning packaging and release identification in [#49586](https://github.com/microsoft/PowerToys/pull/49586)\r\n- Reordered the solution filter consistently, preventing unrelated Visual Studio project-order changes in [#49337](https://github.com/microsoft/PowerToys/pull/49337) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Refactored extension loading into dedicated services, simplifying support for additional extension types in [#48417](https://github.com/microsoft/PowerToys/pull/48417)\r\n- Added a design specification for future ambient-light adaptive brightness on external monitors in [#49199](https://github.com/microsoft/PowerToys/pull/49199) by [@MrRishabhJain](https://github.com/MrRishabhJain)\r\n- Enabled ahead-of-time compilation support and trimming-compatible shortcut serialization, improving Shortcut Guide deployment readiness in [#49673](https://github.com/microsoft/PowerToys/pull/49673) by [@noraa-junker](https://github.com/noraa-junker)\r\n- Improved contributor guidance for Shortcut Guide manifests, helping new app definitions follow the correct schema and naming rules in [#48967](https://github.com/microsoft/PowerToys/pull/48967)\r\n- Added Japanese translation guidance for download and built-in battery terms in Command Palette, improving terminology accuracy in [#48649](https://github.com/microsoft/PowerToys/pull/48649) by [@giruuuuj](https://github.com/giruuuuj)\r\n- Added Chinese translation guidance that distinguishes Sleep from Hibernate in Command Palette, making system commands clearer in [#48653](https://github.com/microsoft/PowerToys/pull/48653) by [@giruuuuj](https://github.com/giruuuuj)\r\n- Added native Runner coverage for duplicate module hotkeys, improving regression detection for in-app shortcut conflicts in [#48352](https://github.com/microsoft/PowerToys/pull/48352)\r\n- Added opt-in Escape and focus-loss dismissal to TransparentWindow, enabling consistent light-dismiss behavior without changing existing consumers in [#48950](https://github.com/microsoft/PowerToys/pull/48950)\r\n- Added a ready-to-use settings manager to new extension templates, accelerating configurable extension development in [#46028](https://github.com/microsoft/PowerToys/pull/46028) by [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Added Quick Shell to the community plugin list, making it easier to open saved project folders in any terminal in [#49567](https://github.com/microsoft/PowerToys/pull/49567) by [@tonythethompson](https://github.com/tonythethompson)\r\n- Improved WPF-to-WinUI 3 guidance with PowerToys windowing and declarative XAML patterns, helping contributors produce more consistent migrations in [#49303](https://github.com/microsoft/PowerToys/pull/49303)\r\n- Corrected Visual Studio 2026 setup components, ensuring automated environments install the required Windows 11 SDK and Windows App SDK tools in [#48824](https://github.com/microsoft/PowerToys/pull/48824)\r\n- Excluded locally generated AI planning files from source control, preventing workspace-only artifacts from being committed in [#48633](https://github.com/microsoft/PowerToys/pull/48633)\r\n- Removed an unused WebView2 WPF reference from non-WPF projects, eliminating recurring WindowsBase conflict warnings during compilation in [#49049](https://github.com/microsoft/PowerToys/pull/49049)\r\n- Handled unexpected Quick Access startup and navigation errors without terminating the flyout, keeping it available for the next launch in [#48457](https://github.com/microsoft/PowerToys/pull/48457)\r\n- Automated inactivity handling for pull requests awaiting author feedback, keeping the contribution queue current in [#49151](https://github.com/microsoft/PowerToys/pull/49151) by [@MuyuanMS](https://github.com/MuyuanMS)\r\n- Expanded automatic area labeling to pull requests, improving repository triage coverage in [#48729](https://github.com/microsoft/PowerToys/pull/48729)\r\n- Expanded WPF-to-WinUI 3 migration guidance with additional API, namespace, XAML, and phased-migration mappings, helping contributors complete ports in [#47043](https://github.com/microsoft/PowerToys/pull/47043)\r\n- Preserved existing pull-request labels during automatic classification, avoiding duplicate or overwritten triage in [#48877](https://github.com/microsoft/PowerToys/pull/48877)\r\n- Updated CI branch filters for stacked pull requests, ensuring changes targeting non-main branches are validated in [#49646](https://github.com/microsoft/PowerToys/pull/49646)\r\n- Restricted GitHub artifacts helper credentials to GitHub API requests, preventing attachment downloads from forwarding tokens to external hosts in [#48782](https://github.com/microsoft/PowerToys/pull/48782)\r\n- Consolidated PowerToys issue-triage queries into a repository-maintained developer document for easier updates in [#48744](https://github.com/microsoft/PowerToys/pull/48744)\r\n- Refreshed the PowerToys README release banner artwork to present current release information more clearly in [#48392](https://github.com/microsoft/PowerToys/pull/48392)\r\n- Fixed standalone project output paths, preventing recursive directories and maximum-path build failures in [#49643](https://github.com/microsoft/PowerToys/pull/49643)\r\n- Updated Adaptive Cards dependencies, bringing newer fixes and improved native compilation support in [#49362](https://github.com/microsoft/PowerToys/pull/49362) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Updated WebView2 dependencies and aligned native package references to prevent version drift in the Keyboard Manager editor in [#49051](https://github.com/microsoft/PowerToys/pull/49051)\r\n- Normalized the character-mapping file's line endings, preventing false modifications and simplifying contributor workflows in [#49203](https://github.com/microsoft/PowerToys/pull/49203) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Updated third-party notices for ZoomIt's WebP screenshot encoding, keeping bundled component documentation accurate in [#48843](https://github.com/microsoft/PowerToys/pull/48843) by [@MarioHewardt](https://github.com/MarioHewardt)\r\n- Added an automatically published developer documentation site, making PowerToys contribution guidance easier to browse in [#48752](https://github.com/microsoft/PowerToys/pull/48752)\r\n- Added an early build check for Windows long path support, replacing cryptic build failures with actionable setup guidance in [#49028](https://github.com/microsoft/PowerToys/pull/49028)\r\n- Added a guided migration path for legacy UI tests and ported Screen Ruler as the first example, expanding CI coverage for the new framework in [#48842](https://github.com/microsoft/PowerToys/pull/48842) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Added Awake module-services coverage for timed settings, establishing regression tests for runtime state creation in [#48346](https://github.com/microsoft/PowerToys/pull/48346)\r\n- Added source-link rewriting so developer documentation links work both locally and on the published site in [#48754](https://github.com/microsoft/PowerToys/pull/48754)\r\n- Added a Copilot agent skill for validating PowerToys modules against release checklists with evidence-based results in [#48717](https://github.com/microsoft/PowerToys/pull/48717) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Added tests for Peek\u2019s math and path helpers and clearer errors for invalid modulo divisors in [#49105](https://github.com/microsoft/PowerToys/pull/49105)\r\n- Added Launchy to the third-party PowerToys Run plugin documentation, making the community file and folder launcher easier to discover in [#49080](https://github.com/microsoft/PowerToys/pull/49080) by [@PsychodelEKS](https://github.com/PsychodelEKS)\r\n- Added a WinApp CLI-based UI test framework with Color Picker end-to-end and Settings navigation coverage, reducing reliance on legacy test infrastructure in [#48467](https://github.com/microsoft/PowerToys/pull/48467)\r\n- Improved next-generation UI test window targeting and executable discovery, reducing flaky interactions across local and CI environments in [#49242](https://github.com/microsoft/PowerToys/pull/49242) by [@LegendaryBlair](https://github.com/LegendaryBlair)\r\n- Fixed malformed skill metadata so WPF-to-WinUI 3 migration guidance loads correctly in Copilot CLI in [#49059](https://github.com/microsoft/PowerToys/pull/49059)\r\n- Corrected grammar and typographical errors across module text, documentation, comments, and tests for clearer wording in [#47539](https://github.com/microsoft/PowerToys/pull/47539) by [@antonkesy](https://github.com/antonkesy)\r\n- Improved local C++ build reliability across Windows locales with consistent UTF-8 handling and repository-relative output paths in [#49575](https://github.com/microsoft/PowerToys/pull/49575) by [@gavinzhangth](https://github.com/gavinzhangth)\r\n- Restored the Folder plugin unit-test project to the main solution for x64 and ARM64, ensuring its tests build with standard solution workflows in [#46897](https://github.com/microsoft/PowerToys/pull/46897) by [@jiripolasek](https://github.com/jiripolasek)\r\n- Fixed broken developer documentation links for File Explorer add-ons, the Calculator plugin, and Runner, making referenced source files and tests easier to find in [#49294](https://github.com/microsoft/PowerToys/pull/49294) by [@Moli13337](https://github.com/Moli13337)\r\n- Updated MessagePack to version 3.1.7, delivering the latest maintenance fixes in [#49029](https://github.com/microsoft/PowerToys/pull/49029)\r\n- Migrated CalculatorEngineCommon to standard C++20 coroutines, restoring full builds with newer Visual Studio toolchains in [#48790](https://github.com/microsoft/PowerToys/pull/48790)\r\n- Upgraded