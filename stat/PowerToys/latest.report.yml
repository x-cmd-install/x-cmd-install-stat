"updated_at":"2026-10-27T09:42:38Z"}],"body":"This hotfix release addresses crashes in File Locksmith and Quick Accent. See the [v0.102.2933.0 release notes](https://github.com/microsoft/PowerToys/releases/tag/v0.102.2933.0) for the full list of changes in PowerToys v0.102.\r\n\r\n## Installer Hashes\r\n\r\n| Description | Filename | SHA256 |\r\n| --- | --- | --- |\r\n| Per user - x64 | [PowerToysUserSetup-0.102.3001.0-x64.exe][ptUserX64] | `4459B9F1AD5D70A342E109FFB66DBBB08EA07B2D2EC5634B314F878700F9FF0B` |\r\n| Per user - ARM64 | [PowerToysUserSetup-0.102.3001.0-arm64.exe][ptUserArm64] | `074208C93541BE77BB6E875D436A8A765E21649F2613196CEE62D9CA936611F2` |\r\n| Machine wide - x64 | [PowerToysSetup-0.102.3001.0-x64.exe][ptMachineX64] | `3FB386E628296D6F960F8EFC92B47FAFA9E29C915C5EFD774255A95190DCC87D` |\r\n| Machine wide - ARM64 | [PowerToysSetup-0.102.3001.0-arm64.exe][ptMachineArm64] | `1D6A23E643B4E34EA1C3292AD4F8615BC1082AC938B0998D56899264DDA5E2AD` |\r\n\r\n## Highlights\r\n\r\nThis patch contains two fixes since the previous stable release.\r\n\r\n### File Locksmith\r\n\r\n- Fixed crashes when File Locksmith encounters a stalled file-handle scan, including crashes after the scan completes, in [#51507](https://github.com/microsoft/PowerToys/pull/51507).\r\n\r\n### Quick Accent\r\n\r\n- Fixed Quick Accent crashes when using arrow-key activation after changing languages or switching from a shorter character list, in [#51583](https://github.com/microsoft/PowerToys/pull/51583).\r\n\r\n[ptUserX64]: https://github.com/microsoft/PowerToys/releases/download/v0.102.3001/PowerToysUserSetup-0.102.3001.0-x64.exe\r\n[ptUserArm64]: https://github.com/microsoft/PowerToys/releases/download/v0.102.3001/PowerToysUserSetup-0.102.3001.0-arm64.exe\r\n[ptMachineX64]: https://github.com/microsoft/PowerToys/releases/download/v0.102.3001/PowerToysSetup-0.102.3001.0-x64.exe\r\n[ptMachineArm64]: https://github.com/microsoft/PowerToys/releases/download/v0.102.3001/PowerToysSetup-0.102.3001.0-arm64.exe\r\n","reactions":{"total_count":53,"+1":28,"-1":0,"laugh":0,"hooray":9,"confused":0,"heart":9,"rocket":6,"eyes":1}}
