anne/powerline-go/pull/396\r\n* fix hardcoded .docker path by @tjblackheart in https://github.com/justjanne/powerline-go/pull/404\r\n* Update segment-aws to use profile OR region by @elebertus in https://github.com/justjanne/powerline-go/pull/402\r\n* fix segment-gcp crashes with simple configuration by @0Delta in https://github.com/justjanne/powerline-go/pull/408\r\n* feat: segment-azure for displaying current active Azure subscription and resource group by @yurhasko in https://github.com/justjanne/powerline-go/pull/415\r\n* Add version flag by @marklap in https://github.com/justjanne/powerline-go/pull/385\r\n\r\n## New Contributors\r\n* @samueloph made their first contribution in https://github.com/justjanne/powerline-go/pull/399\r\n* @dcm made their first contribution in https://github.com/justjanne/powerline-go/pull/401\r\n* @betaboon made their first contribution in https://github.com/justjanne/powerline-go/pull/396\r\n* @tjblackheart made their first contribution in https://github.com/justjanne/powerline-go/pull/404\r\n* @0Delta made their first contribution in https://github.com/justjanne/powerline-go/pull/408\r\n* @yurhasko made their first contribution in https://github.com/justjanne/powerline-go/pull/415\r\n* @marklap made their first contribution in https://github.com/justjanne/powerline-go/pull/385\r\n\r\n**Full Changelog**: https://github.com/justjanne/powerline-go/compare/v1.25...v1.26","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":8}
