DM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":116741832,"digest":"sha256:26dea13e75960c17c5cbaa5487faa3ed7f5e1369e11d236388cfcd241c29cba6","download_count":14,"created_at":"2026-10-21T14:36:10Z","updated_at":"2026-10-21T14:36:15Z"},{"id":662765092,"node_id":"RA_kwDOAdvLx84ngP4k","name":"pwndbg_2026.10.22_x86_64-portable.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":113498652,"digest":"sha256:776df636d1505ed563947108493048aa885e53939aefd69f033e987cce0c02b3","download_count":232,"created_at":"2026-10-21T14:25:07Z","updated_at":"2026-10-21T14:25:12Z"},{"id":662763544,"node_id":"RA_kwDOAdvLx84ngPgY","name":"pwndbg_2026.10.22_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":185690557,"digest":"sha256:dd9f00f825b4e5a8ed2316d54024c45fd6758e34bf677d3b461b535b6c20aae1","download_count":11,"created_at":"2026-10-21T14:24:31Z","updated_at":"2026-10-21T14:24:43Z"}],"body":"**This release brings support for m68k architecture and unknown architectures, better C++ symbols, expression support and guides ([debugging C++](https://pwndbg.re/dev/tutorials/debugging-cxx/), [symbol mangling](https://pwndbg.re/dev/tutorials/mangling/), [pretty printing](https://pwndbg.re/dev/tutorials/pretty-printing/)), `nearpc -o` showing opcode bytes, Android Bionic detection and libc information, Objective-C class inspection (`objc show-class` and `objc list-classes`), better glibc heap discovery, Linux kernel 7.0 SLUB sheaf and barn inspection, a new `setrlimit` command to set debugee' resource limits, displaying SIMD registers with `regs` command and more!**\r\n\r\nScreenshots and details below. Thanks to everyone who contributed!\r\n\r\nPlease [sponsor us at Pwndbg](https://github.com/sponsors/pwndbg) so we can keep improving it! -- We can give you a talk about Pwndbg too!\r\n\r\n----\r\n\r\n## Quick install\r\n\r\nInstall Pwndbg portable on Linux or macOS (choose one line for GDB or LLDB):\r\n\r\n```sh\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-gdb\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-lldb\r\n```\r\n\r\nHomebrew package (macOS only; choose one line for GDB or LLDB):\r\n\r\n```sh\r\nbrew install pwndbg/tap/pwndbg-gdb  # only allows for remote debugging of ELFs\r\nbrew install pwndbg/tap/pwndbg-lldb\r\n```\r\n\r\nNix package manager (Linux/macOS; choose one line for GDB or LLDB):\r\n\r\n```sh\r\nnix shell github:pwndbg/pwndbg  # this is pwndbg-gdb\r\nnix shell github:pwndbg/pwndbg#pwndbg-lldb\r\n```\r\n\r\nOther options:\r\n\r\n* For distro and architecture packages, see the [setup docs](https://pwndbg.re/stable/setup) and the release assets below.\r\n* For the latest development version, [install from source](https://pwndbg.re/dev/setup/#installing-from-source).\r\n\r\n----\r\n\r\n## What's changed\r\n\r\n### Architectures\r\nAdded m68k support including disassembly via Capstone and emulation of code via Unicorn engine. This includes branch target resolution and instruction annotations (#4225)\r\n<img width=\"1240\" height=\"307\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3ae8b1f4-36f5-4e39-985c-810871b3dbd0\" />\r\n\r\nPwndbg also no longer refuses to start on architectures it does not explicitly support. It falls back to the underlying debugger's disassembler, with reduced context functionality and no emulation (#4226).\r\n\r\n### Nearpc changes and regs\r\nThe `nearpc --opcode` (or `-o`) now shows opcode bytes to fit the longest instruction in the listing, or `nearpc -o 4` for a fixed four-byte column. This works per command, without changing `nearpc-num-opcode-bytes` ([#4220](https://github.com/pwndbg/pwndbg/pull/4220)).\r\n\r\nThe `nearpc <start> <end>` now disassembles up to an end address. Use `-r 0` to omit the preceding instructions ([#4176](https://github.com/pwndbg/pwndbg/pull/4176))\r\n\r\nBranch visualization now colors the full branch path and avoids misleading connections between separate address regions ([#4182](https://github.com/pwndbg/pwndbg/pull/4182), [#4175](https://github.com/pwndbg/pwndbg/pull/4175))\r\n\r\n<img width=\"1521\" height=\"694\" alt=\"nearpc-opcodes\" src=\"https://github.com/user-attachments/assets/55790e5b-21ce-4cbf-8ef8-e24f053ff256\" />\r\n\r\n### Regs command changes\r\nThe `regs` command now decodes individual flags register flags (`regs eflags`; #4211) and can display SIMD registers, for example `regs xmm0` (#4212).\r\n\r\n<img width=\"75%\" height=\"75%\" alt=\"registers\" src=\"https://github.com/user-attachments/assets/5fb1683e-ed97-457c-af63-d11965298ea1\" />\r\n\r\n### Android Bionic libc support\r\nPwndbg now detects Bionic and resolves Android libc and loader mappings. It shows this with the `libc` (or `libcinfo`) command. This is a first step toward better Android debugging (#3988).\r\n\r\n<img width=\"1236\" height=\"386\" alt=\"image\" src=\"https://github.com/user-attachments/assets/1ff891b6-3beb-4aa2-a416-b92d3de7de6d\" />\r\n\r\n### Heap & Linux Kernel Debugging\r\n\r\nWe improvec glibc heap discovery combining debug symbols with fallback heuristics. This improves tcache discovery on glibc 2.42 and newer, where the tcache is not necessarily the first heap chunk (#4172).\r\n\r\nThe `resolve-heap-via-heuristic` configuration is deprecated and has no effect. Pwndbg always tries symbols first and then heuristics (#4172).\r\n\r\nLinux 7.0+ SLUB support: the `slab info` now displays per-CPU sheaves and per-node barns (#3990)\r\n* We also added `slab sheaf <address>` commant to dump objects in a sheaf (#3990)\r\n\r\n<img width=\"65%\" height=\"65%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/fde24df7-31f1-4bbc-bcbc-8300c846b6f8\" />\r\n\r\n<img width=\"65%\" height=\"65%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/c68bffb0-e246-4049-a7e1-9d2ac7f2b5f2\" />\r\n<img width=\"50%\" height=\"50%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3c460990-ec22-4bec-8726-9a9126a91d4b\" />\r\n\r\n\r\n### Objective-C classes inspection commands\r\n\r\nWe added two new commands in #4205:\r\n- `objc show-class -n MyClass` displays class metadata in pseudo-Objective-C syntax, including method implementation and selector addresses. You can also look up a class by address with `-a <address>` or module with `-m <module>`.\r\n* `objc list-classes` lists classes in the main module; use `-a` for all modules except the DYLD shared cache, or `-A` to include it.\r\n\r\n<img width=\"60%\" height=\"60%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/6b76bd92-bd11-4069-8042-0111920c5c13\" />\r\n<img width=\"85%\" height=\"85%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/a1c88acc-3963-4c49-8dd0-ddc8ab94d2d5\" />\r\n\r\n<img width=\"75%\" height=\"75%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/c7895cf3-2886-4117-998a-dda93cc21ecd\" />\r\n\r\n### LLDB\r\n* Added `target create -r` for specifying a remote executable path and `process launch -w` for setting working directory (#4194)\r\n* Launching now respects `target.run-args` (#4221)\r\n* Fixed powerpc64le architecture support (#3821)\r\n\r\n### Others\r\n* We added `setrlimit` command to set resource limits. For example `setrlimit nofile 1 2` will set soft and hard open-files limit, whereas `setrlimit core infinite` will set both core-file limits to unlimited (#4251)\r\n<img width=\"1942\" height=\"1232\" alt=\"image\" src=\"https://github.com/user-attachments/assets/f5ec8ff1-bbc7-43a5-b770-173d22fe1053\" />\r\n\r\n* Quoted C++ symbols and expressions now work more reliably in GDB commands including expressions such as 'my symbol'+1. Symbol arguments also have more intuitive value/address handling (#4190, #4235, #4247)\r\n\r\n* We added new guides for: [debugging C++](https://pwndbg.re/dev/tutorials/debugging-cxx/), [symbol mangling](https://pwndbg.re/dev/tutorials/mangling/) and [pretty printing](https://pwndbg.re/dev/tutorials/pretty-printing/), covering quoted symbols, libstdc++ pretty printers and type casting (#4183)\r\n\r\n* Fixed `p2p` crashing with `any` or `*` mappings and documented `begin:end` ranges with examples (#4240, #4249)\r\n* Fixed `search -1 -- -1` cases (#4250)\r\n* Fixed `vmmap -A` omitting last result (#4244)\r\n* Fixed `mmap <flags>` to be incorrectly processed (#4242)\r\n\r\n---\r\n\r\nWe actually did many many more! Full Changelog here: https://github.com/pwndbg/pwndbg/compare/2026.09.15...2026.10.22\r\n\r\nThanks also to our new contributors: @victorwon2001 ([#4145](https://github.com/pwndbg/pwndbg/pull/4145)), @dolszewski-antmicro ([#4210](https://github.com/pwndbg/pwndbg/pull/4210)), @Tusm11 ([#4213](https://github.com/pwndbg/pwndbg/pull/4213)), @MishowHD ([#4219](https://github.com/pwndbg/pwndbg/pull/4219)), @Sarthak-Shreshtha01 ([#4230](https://github.com/pwndbg/pwndbg/pull/4230)), @APX403 ([#4222](https://github.com/pwndbg/pwndbg/pull/4222)), @stanleys12 ([#4214](https://github.com/pwndbg/pwndbg/pull/4214)), @u7k4rs6 ([#4240](https://github.com/pwndbg/pwndbg/pull/4240)), @k0nnect ([#4221](https://github.com/pwndbg/pwndbg/pull/4221)), and @xovishnukosuri ([#3821](https://github.com/pwndbg/pwndbg/pull/3821))!","reactions":{"total_count":5,"+1":1,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":2,"rocket":1,"eyes":0},"mentions_count":10}
