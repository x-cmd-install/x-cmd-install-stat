","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":116551168,"digest":"sha256:11d65861c7ce80636d2c646fbdd6c036e2c264bd5d2979b416d0dbcfb70f5b63","download_count":10,"created_at":"2026-10-28T20:46:47Z","updated_at":"2026-10-28T20:46:51Z"},{"id":686271854,"node_id":"RA_kwDOAdvLx84o561u","name":"pwndbg_2026.10.28_x86_64-portable.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":110905720,"digest":"sha256:17049a23ba8cbcf4780c4bc9b4aeb519f2801ceabe7304b55d3d622acca03b8c","download_count":30,"created_at":"2026-10-28T20:37:59Z","updated_at":"2026-10-28T20:38:03Z"},{"id":686252378,"node_id":"RA_kwDOAdvLx84o52Fa","name":"pwndbg_2026.10.28_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":185625477,"digest":"sha256:d82c608e0934ba0797d1a37cbcf5a3848437980cd1665d4f645834cc2c3dc07a","download_count":9,"created_at":"2026-10-28T20:30:26Z","updated_at":"2026-10-28T20:30:36Z"}],"body":"_This is a hotfix release for the [2026.10.22](https://github.com/pwndbg/pwndbg/releases/tag/2026.10.22) release._\r\n\r\n**This release fixes Pwndbg for LLDB, which did not start at all in 2026.10.22 portable builds.** If you installed `pwndbg-lldb` 2026.10.22 (via the install script, Homebrew, or the release packages and tarballs), please upgrade. Pwndbg for GDB was not affected.\r\n\r\nIt also brings a few fixes to the `spray`, `hexdump` and `try-free` commands.\r\n\r\nThanks to everyone who reported the issue and contributed!\r\n\r\nPlease [sponsor us at Pwndbg](https://github.com/sponsors/pwndbg) so we can keep improving it! -- We can give you a talk about Pwndbg too!\r\n\r\n----\r\n\r\n## Quick install\r\n\r\nInstall Pwndbg portable on Linux or macOS (choose one line for GDB or LLDB):\r\n\r\n```sh\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-gdb\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-lldb\r\n```\r\n\r\nHomebrew package (macOS only; choose one line for GDB or LLDB):\r\n\r\n```sh\r\nbrew install pwndbg/tap/pwndbg-gdb  # only allows for remote debugging of ELFs\r\nbrew install pwndbg/tap/pwndbg-lldb\r\n```\r\n\r\nNix package manager (Linux/macOS; choose one line for GDB or LLDB):\r\n\r\n```sh\r\nnix shell github:pwndbg/pwndbg  # this is pwndbg-gdb\r\nnix shell github:pwndbg/pwndbg#pwndbg-lldb\r\n```\r\n\r\nOther options:\r\n\r\n* For distro and architecture packages, see the [setup docs](https://pwndbg.re/stable/setup) and the release assets below.\r\n* For the latest development version, [install from source](https://pwndbg.re/dev/setup/#installing-from-source).\r\n\r\n----\r\n\r\n## What's changed\r\n\r\n### LLDB regression fix\r\n\r\nIn 2026.10.22, the portable `pwndbg-lldb` failed to start with:\r\n\r\n```\r\npwndbg-lldb: line 3: .../pwndbg/bin/python3: No such file or directory\r\n```\r\n\r\nThe launcher script was changed to run `bin/python3` (#4102), but that wrapper was only added to the GDB bundle and not to the LLDB one. The LLDB bundle now includes it too ([#4268](https://github.com/pwndbg/pwndbg/pull/4268)).\r\n\r\n### Other fixes\r\n\r\n* `spray <addr> <length> --value <value>` now writes the value (truncated) when the length is shorter than the value; previously it wrote nothing ([#4261](https://github.com/pwndbg/pwndbg/pull/4261))\r\n* `hexdump` no longer hides the first line of a run of identical lines that comes right after exactly two identical lines ([#4260](https://github.com/pwndbg/pwndbg/pull/4260))\r\n* `try-free` now checks the unsorted bin the same way glibc does, so it catches the `free(): corrupted unsorted chunks` case instead of reporting \"All checks passed!\" ([#4262](https://github.com/pwndbg/pwndbg/pull/4262))\r\n\r\n---\r\n\r\nFull Changelog: https://github.com/pwndbg/pwndbg/compare/2026.10.22...2026.10.28\r\n\r\nThanks also to our new contributor: @sindooo ([#4268](https://github.com/pwndbg/pwndbg/pull/4268)), who found and fixed the LLDB regression!\r\n","mentions_count":1}
