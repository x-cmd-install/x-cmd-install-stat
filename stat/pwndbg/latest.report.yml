6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":112106716,"digest":"sha256:99acdb3649aae3018917796368296d78f7cb32e3f1a4d243af972d33c1eb78f7","download_count":13,"created_at":"2026-09-15T22:47:09Z","updated_at":"2026-09-15T22:47:13Z"},{"id":566633367,"node_id":"RA_kwDOAdvLx84hxiOX","name":"pwndbg_2026.09.15_x86_64-portable.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":108200928,"digest":"sha256:7ba64666ee595885ba4b0e073f85e423829103e9fdbe921ba4eef1acd9150803","download_count":544,"created_at":"2026-09-15T22:26:40Z","updated_at":"2026-09-15T22:26:44Z"},{"id":566650371,"node_id":"RA_kwDOAdvLx84hxmYD","name":"pwndbg_2026.09.15_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":177846003,"digest":"sha256:739a882c154ad7f88edd0f850528c026d260d42a320268a778286ae592e8aab2","download_count":13,"created_at":"2026-09-15T22:38:22Z","updated_at":"2026-09-15T22:38:30Z"}],"body":"**This release brings lots of disassembly improvements: backwards disassembly in context and `nearpc`, better indirect jumps display and `nearpc -f|--function` working without debugging symbols; new `stack-vis` command to visualize stack frames (similarly to `vis-heap-chunks`); emulation working with x64 kernels; `v2p`, `p2v` and `pageinfo` commands displaying full page info; LLDB and portable fixes; improved glibc 2.42-2.44 support and many other!**\r\n\r\nSee below for screenshots and more info!\r\n\r\nAlso, please [sponsor the project to let us keep improving](https://github.com/sponsors/pwndbg)!\r\n\r\nThanks to everyone who made this possible!\r\n\r\n----\r\n\r\n## Quick install\r\n\r\nInstall Pwndbg portable on Linux or macOS (choose one line for GDB or LLDB):\r\n```\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-gdb\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-lldb\r\n```\r\n\r\nHomebrew package (macOS only; choose one line for GDB or LLDB):\r\n\r\n```\r\nbrew install pwndbg/tap/pwndbg-gdb  # only allows for remote debugging of ELFs\r\nbrew install pwndbg/tap/pwndbg-lldb\r\n```\r\n\r\nNix package manager (Linux/macOS; choose one line for GDB or LLDB):\r\n```\r\nnix shell github:pwndbg/pwndbg  # this is pwndbg-gdb\r\nnix shell github:pwndbg/pwndbg#pwndbg-lldb\r\n```\r\n\r\nOther options:\r\n* Want specific distro and architecture package? [Check out setup docs](https://pwndbg.re/stable/setup) and download the specific asset below.\r\n* Want latest development version? See [install from source](https://pwndbg.re/dev/setup/#installing-from-source).\r\n\r\n----\r\n\r\n### Dissasembly improvements\r\n* Pwndbg can now disassemble backwards, which makes lifes easier in many ways (in context disasm it gives info on the stuff before $PC when stopping at a breakpoint or right after a syscall, and in `nearpc` you no longer need to guess addresses to go backwards)\r\n<img width=\"874\" height=\"331\" alt=\"image\" src=\"https://github.com/user-attachments/assets/4879d087-9d75-41e2-a119-67cb1453dfd2\" />\r\n\r\n* The `nearpc -f|--function` now works without debugging symbols. Finally, it now acts as a full replacement for GDB's/LLDB's disass command to disassemble a full function (is guaranteed to work in all cases the underlying command would work). Our disassembly adds all sorts of nice stuff (branch visualization, branch targets, showing strings and  symbols of instruction operands, etc.)\r\n<img width=\"1601\" height=\"552\" alt=\"image\" src=\"https://github.com/user-attachments/assets/b11d7238-55ef-463a-aed3-6e7a309f27b5\" />\r\n\r\n* Indirect jumps are handled much better for x86 PLT. Return (`ret` etc.) instructions and memory-indirect jumps that can segfault are now also handled, visualizing segfaulting ROP chains.\r\n<img width=\"1251\" height=\"288\" alt=\"image\" src=\"https://github.com/user-attachments/assets/5b7027a6-77da-4a90-816c-5bf335d10389\" />\r\n<img width=\"1502\" height=\"642\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3f208e7a-c660-4c44-9341-99537e39e4e3\" />\r\n\r\n* Emulation now works when debugging x64 kernels, so get more perks of our disassembly system (emulated flow of instructions, concrete instructions operands indicated)\r\n\r\n### New `stack-vis` command\r\nThe `stack-vis` command can now be used to visualize the stack frames of current thread in a similar fashion as `vis-heap-chunks` can be used for heap chunks (#3994)\r\n<img width=\"1278\" height=\"603\" alt=\"image\" src=\"https://github.com/user-attachments/assets/74bc0a89-2415-4f36-803b-8e8f5727d0b5\" />\r\n\r\n### Linux kernel debugging\r\n* The `v2p`, `p2v` and `pageinfo` commands now display full page info (vaddr, paddr, and page) (#4057)\r\n\r\n### Others\r\n* Set defauly debuginfod server timeouts (#4079)\r\n* Fixed Glibc >= 2.42 tcache handling (#4133), glibc 2.44 refilling of `AT_RANDOM` (#4054), exithandlers command with glibc 2.44 (#4053), and tcache_max_bytes for glibc 2.42 (#4128)\r\n* Bumped versions of LLDB to 23 and Capstone to 8.0.0 (#4071, #4094)\r\n* Fixed multiple bugs and crashes with pwndbg-lldb and portable\r\n* Breaking change: `pwndbg.dbg_mod.Error` was renamed to `pwndbg.dbg_mod.DebuggerError` (#4034)\r\n\r\n...and many many many others! See full changelog at: https://github.com/pwndbg/pwndbg/compare/2026.07.29...2026.09.15\r\n\r\n----\r\n\r\nAlso thanks to all new contributors: @ksaweryr (#3994), @ChickenisLegit (#4068), @trukwava (#4084), @Eirikwst (#4099), @N3thunt3r69 (#4124), @M4idCat (#4128), @kozabrada123 (#4133)!\r\n\r\n","reactions":{"total_count":10,"+1":1,"-1":0,"laugh":1,"hooray":5,"confused":0,"heart":1,"rocket":1,"eyes":1},"mentions_count":7}
