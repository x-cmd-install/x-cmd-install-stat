2,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":111902232,"digest":"sha256:5ef85b0fe332e33e7bdbc4f3a89ff79314226725baa768498fefe7ea9d488f94","download_count":28,"created_at":"2026-07-29T13:37:07Z","updated_at":"2026-07-29T13:37:12Z"},{"id":494061387,"node_id":"RA_kwDOAdvLx84dcsdL","name":"pwndbg_2026.07.29_x86_64-portable.tar.xz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":107920228,"digest":"sha256:63c38b76bf8baeb44b4bc018c73ea0b05b872c2aba205ed5680892f2d65adb03","download_count":3434,"created_at":"2026-07-29T13:13:48Z","updated_at":"2026-07-29T13:13:51Z"},{"id":494090980,"node_id":"RA_kwDOAdvLx84dczrk","name":"pwndbg_2026.07.29_x86_64.apk","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/vnd.android.package-archive","state":"uploaded","size":178219164,"digest":"sha256:7fe8219470b45cdb2dc3ee696d2cae037916047a61162cdf57d55c2bfe8f4ca0","download_count":22,"created_at":"2026-07-29T13:45:09Z","updated_at":"2026-07-29T13:45:16Z"}],"body":"**This release brings:** `exithandlers` command to inspect glibc exit handlers, Linux kernel task introspection without typeinfo (`kstack`, `kseccomp`, `ksighand`, `knamespace`), glibc 2.43 heap inspection improvements, heap tracker allocation call sites (`track-heap --where`), a much richer `procinfo` output (netlink info, socket or pipe peers), vmmap being cached on macOS, LLDB fixes and many other!\r\n\r\nSee below for screenshots and more info!\r\n\r\nAlso, please [sponsor the project to let us keep improving](https://github.com/sponsors/pwndbg)!\r\n\r\nThanks to everyone who made this possible!\r\n\r\n----\r\n\r\n## Quick install\r\n\r\nInstall Pwndbg portable on Linux or macOS (choose one line for GDB or LLDB):\r\n```\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-gdb\r\ncurl --proto '=https' --tlsv1.2 -LsSf 'https://install.pwndbg.re' | sh -s -- -t pwndbg-lldb\r\n```\r\n\r\nHomebrew package (macOS only; choose one line for GDB or LLDB):\r\n\r\n```\r\nbrew install pwndbg/tap/pwndbg-gdb  # only allows for remote debugging of ELFs\r\nbrew install pwndbg/tap/pwndbg-lldb\r\n```\r\n\r\nNix package manager (Linux/macOS; choose one line for GDB or LLDB):\r\n```\r\nnix shell github:pwndbg/pwndbg  # this is pwndbg-gdb\r\nnix shell github:pwndbg/pwndbg#pwndbg-lldb\r\n```\r\n\r\nOther options:\r\n* Want specific distro and architecture package? [Check out setup docs](https://pwndbg.re/stable/setup) and download the specific asset below.\r\n* Want latest development version? See [install from source](https://pwndbg.re/stable/setup/#installing-from-source).\r\n\r\n----\r\n\r\n## What's changed\r\n\r\n### Breaking Changes\r\n\r\n* **The `mallocng-*`, `jemalloc-*` and `knft-*` commands are now subcommands** - use `mallocng dump`, `mallocng vis`, `jemalloc heap`, `jemalloc extent-info`, `knft list-tables` etc. instead of the old dash-separated names ([#3750](https://github.com/pwndbg/pwndbg/pull/3750))\r\n* **`cyclic` output is now consistent with pwntools** - the generated de Bruijn sequence matches `pwn cyclic` ([#3801](https://github.com/pwndbg/pwndbg/pull/3801))\r\n* Developer API: `pwndbg.aglib.disasm.arch` was renamed to `pwndbg.aglib.disasm.assistant` ([#3919](https://github.com/pwndbg/pwndbg/pull/3919))\r\n\r\n### New: `exithandlers`\r\n\r\n**Added the `exithandlers` command** (alias `exitfuncs`) - lists the currently registered glibc exit handlers by walking `__exit_funcs` and `tls_dtor_list`, demangling the `PTR_MANGLE`d function pointers and printing the `pointer_guard` cookie. Very handy when hijacking exit handlers during exploitation ([#3973](https://github.com/pwndbg/pwndbg/pull/3973), alignment fixes in [#3983](https://github.com/pwndbg/pwndbg/pull/3983))\r\n\r\n<img width=\"80%\" height=\"80%\" alt=\"exithandlers command\" src=\"https://github.com/user-attachments/assets/86a4b624-4613-4d4c-84fe-8d09f4b7c776\" />\r\n\r\n### Linux Kernel Debugging\r\n\r\n**Full support for debugging kernel tasks without typeinfo** - along with four new commands to introspect any kernel task ([#3647](https://github.com/pwndbg/pwndbg/pull/3647)):\r\n* `kstack [pid]` - display information about the stack of a task\r\n* `kseccomp [pid]` - display seccomp information of a user task\r\n* `ksighand [pid]` - display signal handlers of a task\r\n* `knamespace [pid]` - display namespaces of a task\r\n\r\n<img width=\"4855\" height=\"2311\" alt=\"kernel-tasks\" src=\"https://github.com/user-attachments/assets/34f5ab71-40fe-4686-9216-1280085d1e9d\" />\r\n\r\nOther kernel improvements:\r\n* **Added the `percpu` GDB function** - to resolve per-CPU variables from `print`/`break` expressions ([#3950](https://github.com/pwndbg/pwndbg/pull/3950))\r\n* **Added `v2p` and `p2v` GDB function helpers** - to convert between virtual and physical addresses inside expressions ([#3842](https://github.com/pwndbg/pwndbg/pull/3842))\r\n* **Added support for breaking at the start of a JIT-compiled eBPF program** ([#3757](https://github.com/pwndbg/pwndbg/pull/3757))\r\n* Page table scanning now reads `/proc/pid/mem` by default, which is much faster ([#3947](https://github.com/pwndbg/pwndbg/pull/3947))\r\n* Kernel common structs are now loaded only when necessary, speeding up startup ([#3948](https://github.com/pwndbg/pwndbg/pull/3948))\r\n* Added a kernel symbol lookup function decorator ([#3776](https://github.com/pwndbg/pwndbg/pull/3776))\r\n* `slab_contains` now shows inuse/total object count on its own line ([#3830](https://github.com/pwndbg/pwndbg/pull/3830), [#3833](https://github.com/pwndbg/pwndbg/pull/3833))\r\n* Added help to `slab` subparsers ([#3769](https://github.com/pwndbg/pwndbg/pull/3769))\r\n* IDT entries are now iterated with a generator ([#3768](https://github.com/pwndbg/pwndbg/pull/3768))\r\n* Kernel image downloads are parallelized and much faster ([#3972](https://github.com/pwndbg/pwndbg/pull/3972))\r\n* LOTS of fixes ([#3971](https://github.com/pwndbg/pwndbg/pull/3971), [#4003](https://github.com/pwndbg/pwndbg/pull/4003), [#3803](https://github.com/pwndbg/pwndbg/pull/3803), [#3940](https://github.com/pwndbg/pwndbg/pull/3940), [#3853](https://github.com/pwndbg/pwndbg/pull/3853), [#3785](https://github.com/pwndbg/pwndbg/pull/3785), [#3871](https://github.com/pwndbg/pwndbg/pull/3871), [#3918](https://github.com/pwndbg/pwndbg/pull/3918), [#3831](https://github.com/pwndbg/pwndbg/pull/3831))\r\n\r\n### Heap & Allocators\r\n\r\n* **Added glibc 2.43 heap support** ([#3744](https://github.com/pwndbg/pwndbg/pull/3744))\r\n* **Added support for tcache large chunks since glibc 2.42** ([#3854](https://github.com/pwndbg/pwndbg/pull/3854))\r\n* **Added `heap --count <N>` and address range limits** - `heap <start> <end>` walks only the requested range, and both limits can be combined ([#3812](https://github.com/pwndbg/pwndbg/pull/3812))\r\n* **The heap tracker can now annotate each event with its call site** - `track-heap enable --where` shows the nearest program symbol that triggered every malloc/realloc/calloc/free ([#3986](https://github.com/pwndbg/pwndbg/pull/3986))\r\n\r\n<img width=\"80%\" height=\"80%\" alt=\"track-heap --where\" src=\"https://github.com/user-attachments/assets/4a4c9abd-1b64-4f48-abc4-d9db80f357da\" />\r\n\r\n* **Added `track-heap enable -r`** - to report offsets relative to the mapping instead of absolute addresses ([#3738](https://github.com/pwndbg/pwndbg/pull/3738))\r\n* **Musl libc is now detected in statically linked binaries** ([#3798](https://github.com/pwndbg/pwndbg/pull/3798))\r\n* Fixed a dead duplicate loop in `Tracker.malloc` ([#3997](https://github.com/pwndbg/pwndbg/pull/3997))\r\n\r\n### Process & Memory\r\n\r\n**`procinfo` now shows a lot more about file descriptors** - netlink socket protocol, portid and groups ([#3892](https://github.com/pwndbg/pwndbg/pull/3892)), the peer process for unix-domain sockets ([#3893](https://github.com/pwndbg/pwndbg/pull/3893), [#3993](https://github.com/pwndbg/pwndbg/pull/3993)), and pipe peers together with the read/write end of each pipe ([#3894](https://github.com/pwndbg/pwndbg/pull/3894))\r\n\r\n<img width=\"80%\" height=\"80%\" alt=\"procinfo file descriptors\" src=\"https://github.com/user-attachments/assets/0536f2dc-8948-4705-9683-00c93915232a\" />\r\n\r\n* **Cleaned up and improved the `mmap`/`mprotect` commands** - better argument handling, address validity warnings and hints, plus `--quiet` and `--force` flags ([#4039](https://github.com/pwndbg/pwndbg/pull/4039))\r\n* **Replaced the system `readelf` with pyelftools** - so ELF parsing works for every architecture without external tools ([#3470](https://github.com/pwndbg/pwndbg/pull/3470))\r\n* **Added `set vmmap-cache`** - vmmap is now persisted across stops on macOS ([#3913](https://github.com/pwndbg/pwndbg/pull/3913))\r\n\r\n### Disassembly & Context\r\n\r\n* **Unresolved conditional branches are now marked with a question mark** in the disassembly view ([#3906](https://github.com/pwndbg/pwndbg/pull/3906))\r\n* **The disassembly view now indicates when the current pc is at a breakpoint** with a `b\u25ba` marker ([#3789](https://github.com/pwndbg/pwndbg/pull/3789))\r\n* **Added `set telescope-pad-leading-zeroes on`** - to print pointer-aligned integers zero-padded to the pointer width in `telescope` ([#3902](https://github.com/pwndbg/pwndbg/pull/3902))\r\n* **GDB's `print` command now shows values in hex** by default ([#3788](https://github.com/pwndbg/pwndbg/pull/3788))\r\n\r\n<img width=\"85%\" height=\"85%\" alt=\"breakpoint marker, hex print and telescope padding\" src=\"https://github.com/user-attachments/assets/83d8ac14-2d64-4960-a60a-3b249e5223d6\" />\r\n\r\n* **Fixed shortcomings of `nearpc --function` compared to `disass`** ([#3823](https://github.com/pwndbg/pwndbg/pull/3823))\r\n* Fixed addresses, symbols and other columns being truncated in the backtrace context ([#4042](https://github.com/pwndbg/pwndbg/pull/4042))\r\n* Fixed alignment issues in the context backtrace ([#3946](https://github.com/pwndbg/pwndbg/pull/3946)) and large frame offsets ([#3914](https://github.com/pwndbg/pwndbg/pull/3914))\r\n* Fixed messed up stack repeating logic ([#3901](https://github.com/pwndbg/pwndbg/pull/3901))\r\n* Fixed `IndexError` when `longest_history == 1` ([#3904](https://github.com/pwndbg/pwndbg/pull/3904))\r\n\r\n### `dt` Improvements\r\n\r\n**The `dt` command now handles bitfields, nested structs and flexible array members properly** - bitfields get sub-byte offsets (`+0x0000.1`), nested field offsets are printed recursively, and flexible array members are displayed ([#3876](https://github.com/pwndbg/pwndbg/pull/3876), [#3862](https://github.com/pwndbg/pwndbg/pull/3862), [#3814](https://github.com/pwndbg/pwndbg/pull/3814))\r\n\r\n<img width=\"70%\" height=\"70%\" alt=\"dt with bitfields, nested structs and flexible array members\" src=\"https://github.com/user-attachments/assets/ff0103d8-d683-41be-9d9f-2dbdaf07b774\" />\r\n\r\n### LLDB\r\n\r\n* **Command history and Enter-to-repeat now work on LLDB** ([#1374](https://github.com/pwndbg/pwndbg/issues/1374), [#3980](https://github.com/pwndbg/pwndbg/pull/3980))\r\n* Allowed C++ symbol characters in symbol name validation ([#3987](https://github.com/pwndbg/pwndbg/pull/3987))\r\n* LLDB + Hexagon no longer crashes immediately ([#3671](https://github.com/pwndbg/pwndbg/pull/3671))\r\n* Fixed invalid color setting on LLDB ([#4036](https://github.com/pwndbg/pwndbg/pull/4036))\r\n\r\n### Architectures\r\n\r\n* **Enabled RISC-V B extension disassembling** ([#3920](https://github.com/pwndbg/pwndbg/pull/3920))\r\n* **Upgraded past Capstone v6 alpha 6** ([#3864](https://github.com/pwndbg/pwndbg/pull/3864))\r\n* Added the IOPL eflag field ([#3834](https://github.com/pwndbg/pwndbg/pull/3834))\r\n* Handle `ljmp` instruction target resolution for i8086 ([#3953](https://github.com/pwndbg/pwndbg/pull/3953))\r\n* Fixed unsupported architecture `powerpc64le` ([#3827](https://github.com/pwndbg/pwndbg/pull/3827))\r\n* Fixed the `vbar` register in AArch64, which should be `vbar_el1` ([#3869](https://github.com/pwndbg/pwndbg/pull/3869))\r\n* Added register-name aliases to `read_reg` ([#3877](https://github.com/pwndbg/pwndbg/pull/3877))\r\n\r\n### General\r\n\r\n* **The pwndbg themes collection now lives in the main repository** - see the `themes/` directory, previously hosted in `pwndbg/pwndbg-themes` ([#3928](https://github.com/pwndbg/pwndbg/pull/3928))\r\n* **`stepsyscall` can now step until a given syscall or condition** - `stepsyscall write` or `stepsyscall -c '$rdi==0'` ([#3564](https://github.com/pwndbg/pwndbg/pull/3564))\r\n* **Added an optional count/length parameter to the windbg-style `dds`/`dps`/`dqs`/`kd` commands** ([#3961](https://github.com/pwndbg/pwndbg/pull/3961))\r\n* **Invalid color names are now rejected** instead of silently breaking the output, on both GDB and LLDB ([#3949](https://github.com/pwndbg/pwndbg/pull/3949), [#4033](https://github.com/pwndbg/pwndbg/pull/4033), [#4036](https://github.com/pwndbg/pwndbg/pull/4036)), and a color decorator was implemented in `pwndbg.color` ([#4037](https://github.com/pwndbg/pwndbg/pull/4037))\r\n* **`gnureadline` is now optional** ([#3787](https://github.com/pwndbg/pwndbg/pull/3787))\r\n* Added more tips ([#3891](https://github.com/pwndbg/pwndbg/pull/3891))\r\n* Fixed Go type `direct_iface` resolution ([#3868](https://github.com/pwndbg/pwndbg/pull/3868))\r\n* Fixed Ghidra decompiler integration out of bounds ([#3932](https://github.com/pwndbg/pwndbg/pull/3932))\r\n* Fixed `profiler` subcommand being optional when it is required ([#3951](https://github.com/pwndbg/pwndbg/pull/3951))\r\n* Fixed `OSError` parameter order in `get_file` ([#4021](https://github.com/pwndbg/pwndbg/pull/4021))\r\n* Fixed handling of GDB builds without debuginfod support ([#3867](https://github.com/pwndbg/pwndbg/pull/3867))\r\n* `gdbinit` no longer triggers an early `pwndbginit` import ([#3964](https://github.com/pwndbg/pwndbg/pull/3964))\r\n* Bumped GDB and LLDB used in our releases ([#3982](https://github.com/pwndbg/pwndbg/pull/3982), [#3794](https://github.com/pwndbg/pwndbg/pull/3794), [#4044](https://github.com/pwndbg/pwndbg/pull/4044))\r\n\r\n### Internals & Housekeeping\r\n\r\n* Enabled a lot more ruff rulesets: flake8-bugbear ([#4014](https://github.com/pwndbg/pwndbg/pull/4014)), PLE ([#3999](https://github.com/pwndbg/pwndbg/pull/3999)), PLR ([#3962](https://github.com/pwndbg/pwndbg/pull/3962)), FURB ([#3955](https://github.com/pwndbg/pwndbg/pull/3955)), SIM ([#3924](https://github.com/pwndbg/pwndbg/pull/3924)), PIE ([#3925](https://github.com/pwndbg/pwndbg/pull/3925)) and flake8-return ([#3923](https://github.com/pwndbg/pwndbg/pull/3923))\r\n* Cleaned up `pwndbg.hexdump` ([#4030](https://github.com/pwndbg/pwndbg/pull/4030)), `pwndbg.aglib.onegadget` ([#3942](https://github.com/pwndbg/pwndbg/pull/3942)), `pwndbg.color` naming ([#3941](https://github.com/pwndbg/pwndbg/pull/3941)) and `wrappers/readelf.py` ([#3850](https://github.com/pwndbg/pwndbg/pull/3850))\r\n* Bumped Vermin to 1.8.0 ([#3883](https://github.com/pwndbg/pwndbg/pull/3883)) and pyelftools now that types were added ([#3930](https://github.com/pwndbg/pwndbg/pull/3930))\r\n* Pinned GitHub Actions to commit SHAs ([#3958](https://github.com/pwndbg/pwndbg/pull/3958)) and fixed a number of flaky tests and Docker/CI caching issues ([#3957](https://github.com/pwndbg/pwndbg/pull/3957), [#3895](https://github.com/pwndbg/pwndbg/pull/3895), [#3872](https://github.com/pwndbg/pwndbg/pull/3872), [#3852](https://github.com/pwndbg/pwndbg/pull/3852))\r\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":3,"eyes":0}}
