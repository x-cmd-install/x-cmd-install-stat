dated_at":"2026-09-15T20:35:32Z"},{"id":566464312,"node_id":"RA_kwDOAogB9s4hw484","name":"wabt-1.0.42.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":85,"digest":"sha256:134a41ef7e24f532775957bf86685abb8d02eac9627877a4925c0dcca562d657","download_count":5,"created_at":"2026-09-15T20:35:33Z","updated_at":"2026-09-15T20:35:34Z"}],"body":"## What's Changed\r\n* [wasi-interp] fix integer overflow in wasi getMemPtr size calculation by @aizu-m in https://github.com/WebAssembly/wabt/pull/2752\r\n* Use unsigned shift in GetAlignment to avoid signed overflow by @aizu-m in https://github.com/WebAssembly/wabt/pull/2755\r\n* [wasm2c] Avoid size_t overflow in wasm_rt_grow table reallocation by @aizu-m in https://github.com/WebAssembly/wabt/pull/2756\r\n* parse decimal float literals independent of the C locale by @aizu-m in https://github.com/WebAssembly/wabt/pull/2757\r\n* [wasm-decompile] Avoid out-of-range shift in load/store rewrite by @aizu-m in https://github.com/WebAssembly/wabt/pull/2758\r\n* [wasm2c] Use locale-independent ctype in GenerateHeaderGuard by @aizu-m in https://github.com/WebAssembly/wabt/pull/2759\r\n* Avoid unbounded alloca in FloatParser::ParseFloat by @aizu-m in https://github.com/WebAssembly/wabt/pull/2754\r\n* [interp] Use u64 table operands so out-of-range table64 indices trap by @aizu-m in https://github.com/WebAssembly/wabt/pull/2760\r\n* Avoid string_view underflow in ParseCodeMetadataAnnotation by @aizu-m in https://github.com/WebAssembly/wabt/pull/2761\r\n* Avoid Var::name() on function-level branches in decompiler by @aizu-m in https://github.com/WebAssembly/wabt/pull/2762\r\n* Update man pages and html docs by @sbc100 in https://github.com/WebAssembly/wabt/pull/2763\r\n* Avoid front() on an empty element expression in the validator by @aizu-m in https://github.com/WebAssembly/wabt/pull/2765\r\n* Add ruff python linter. NFC by @sbc100 in https://github.com/WebAssembly/wabt/pull/2770\r\n* Remove wasm-decompile by @sbc100 in https://github.com/WebAssembly/wabt/pull/2769\r\n* Support 64 bit limits for tables by @zherczeg in https://github.com/WebAssembly/wabt/pull/2767\r\n* [binary-reader] Templatize LEB reading functions. NFC by @sbc100 in https://github.com/WebAssembly/wabt/pull/2771\r\n* Update from C++17 to C++20 by @sbc100 in https://github.com/WebAssembly/wabt/pull/2772\r\n* Add -Wno-gnu-folding-constant when compiling c api examples by @sbc100 in https://github.com/WebAssembly/wabt/pull/2774\r\n* Use C++20 standard bit utilities and std::bit_cast. NFC by @sbc100 in https://github.com/WebAssembly/wabt/pull/2773\r\n* [wasm2c] Write float constants independent of the host locale by @aizu-m in https://github.com/WebAssembly/wabt/pull/2768\r\n* Avoid out-of-bounds section_starts_ read on invalid reloc index by @aizu-m in https://github.com/WebAssembly/wabt/pull/2777\r\n* Remove ReadLeb128 type argument by @zherczeg in https://github.com/WebAssembly/wabt/pull/2776\r\n* [interp] Stop on first error in the binary reader fuzzer by @aizu-m in https://github.com/WebAssembly/wabt/pull/2778\r\n* [cpp20] Modernize binary reader and writer APIs to use std::span by @sbc100 in https://github.com/WebAssembly/wabt/pull/2775\r\n* Fix DecodeInvalidOpcode for 9-bit opcode codes by @sbc100 in https://github.com/WebAssembly/wabt/pull/2781\r\n* wasm2c: (Security) fix runtime overflows when running Wasm modules with memory64 by @shravanrn in https://github.com/WebAssembly/wabt/pull/2783\r\n* [validator] Allow call_indirect/return_call_indirect table elements to be subtypes of funcref by @6d6f6d656e746f in https://github.com/WebAssembly/wabt/pull/2780\r\n* Check size overflow and calloc failure in wasm_rt_allocate_memory by @aizu-m in https://github.com/WebAssembly/wabt/pull/2786\r\n* wasm2c: fix errors in atomic ops implementation by @shravanrn in https://github.com/WebAssembly/wabt/pull/2784\r\n* wasm2c: fix to check address + offset addition for memory64 by @shravanrn in https://github.com/WebAssembly/wabt/pull/2785\r\n* Bounds-check function index in name section local handlers by @aizu-m in https://github.com/WebAssembly/wabt/pull/2787\r\n* wasm2c: Move to O3 optimizations for wasm2c spec compliance tests by @shravanrn in https://github.com/WebAssembly/wabt/pull/2788\r\n* Zero-init an InitInst to avoid accessing unintialized memory by @lexi-nadia in https://github.com/WebAssembly/wabt/pull/2789\r\n* Mark Result as [[nodiscard]] and fix associated errors by @lexi-nadia in https://github.com/WebAssembly/wabt/pull/2791\r\n* Add WABT_USE annotations for Result values only used in assertions by @lexi-nadia in https://github.com/WebAssembly/wabt/pull/2793\r\n* Fix WABT_PRINTF_TYPE_CODE to correctly handle INT_MIN by @lexi-nadia in https://github.com/WebAssembly/wabt/pull/2792\r\n* Check memory64 addr+offset overflow in wasm2c store/atomic/simd ops by @aizu-m in https://github.com/WebAssembly/wabt/pull/2790\r\n* Fix operand arity of v128.storeN_lane in GetExprArity by @aizu-m in https://github.com/WebAssembly/wabt/pull/2764\r\n* Fix out-of-bounds read in BinaryReaderLogging::WriteIndent by @aizu-m in https://github.com/WebAssembly/wabt/pull/2795\r\n* Fix out-of-bounds write in MakeTypeBindingReverseMapping by @aizu-m in https://github.com/WebAssembly/wabt/pull/2796\r\n* Avoid out-of-bounds imports read in wasm_instance_new by @aizu-m in https://github.com/WebAssembly/wabt/pull/2797\r\n* Fix out-of-bounds type stack read after rethrow in c-writer by @aizu-m in https://github.com/WebAssembly/wabt/pull/2798\r\n* [interp] Pop memory.copy/table.copy length using the minimum index type by @aizu-m in https://github.com/WebAssembly/wabt/pull/2800\r\n* Fix out-of-bounds read when tracing global.set and table ops by @aizu-m in https://github.com/WebAssembly/wabt/pull/2802\r\n* wasm2c: Extend segue to simd and unshared atomics by @shravanrn in https://github.com/WebAssembly/wabt/pull/2803\r\n* Fix memory64 offset truncation in the interp istream by @aizu-m in https://github.com/WebAssembly/wabt/pull/2799\r\n* Fix use-after-free resolving reference type names in wast-parser by @aizu-m in https://github.com/WebAssembly/wabt/pull/2805\r\n* wasm2c: Optimize call indirect code footprint for better performance by @shravanrn in https://github.com/WebAssembly/wabt/pull/2807\r\n* Fix float argument types in wasm-interp --run-export by @XX-Q in https://github.com/WebAssembly/wabt/pull/2811\r\n* wasm2c: Remove unnecessary force_read in bounds check mode for performance by @shravanrn in https://github.com/WebAssembly/wabt/pull/2814\r\n* [binary-reader] Fix out-of-bounds read on invalid name sub-section by @aizu-m in https://github.com/WebAssembly/wabt/pull/2801\r\n* Fix validation of typed select with empty result types (#2708) by @ANAMASGARD in https://github.com/WebAssembly/wabt/pull/2810\r\n* Give the tools an 8MB stack on msvc by @Nishuuzz in https://github.com/WebAssembly/wabt/pull/2815\r\n* Assert that ReadBinaryIr is not used with skip_function_bodies by @Nishuuzz in https://github.com/WebAssembly/wabt/pull/2817\r\n* [interp] Fix out-of-bounds read tracing call_ref and return_call_ref by @aizu-m in https://github.com/WebAssembly/wabt/pull/2819\r\n* wasm2c: optimize performance of float handling by @shravanrn in https://github.com/WebAssembly/wabt/pull/2822\r\n* Don't abort on an empty input file by @Nishuuzz in https://github.com/WebAssembly/wabt/pull/2821\r\n* interp: assert stop_on_first_error in ReadBinaryInterp by @ANAMASGARD in https://github.com/WebAssembly/wabt/pull/2816\r\n* wasm2c: Optimize force_read performance by @shravanrn in https://github.com/WebAssembly/wabt/pull/2808\r\n* wasm2c: reject contradictory imports instead of aborting by @ANAMASGARD in https://github.com/WebAssembly/wabt/pull/2813\r\n* wasm2c: Save memory base/size locally as a perf optimization by @shravanrn in https://github.com/WebAssembly/wabt/pull/2804\r\n* Write init expressions folded so they can be parsed back by @Nishuuzz in https://github.com/WebAssembly/wabt/pull/2830\r\n* Support (module definition ...) constructs by @zherczeg in https://github.com/WebAssembly/wabt/pull/2829\r\n* Propagate parse errors out of instruction and expression lists by @Nishuuzz in https://github.com/WebAssembly/wabt/pull/2824\r\n* Don't generate a bare \"$\" from an empty export name by @Nishuuzz in https://github.com/WebAssembly/wabt/pull/2832\r\n* wasm2c: missing guard force_read error with escape hatch by @shravanrn in https://github.com/WebAssembly/wabt/pull/2826\r\n* Enable supported stage 5 proposals by default by @sbc100 in https://github.com/WebAssembly/wabt/pull/2837\r\n* Support u64 limits for wasm 3.0 by @zherczeg in https://github.com/WebAssembly/wabt/pull/2836\r\n* Reject delegate depth overflow in TypeChecker::OnDelegate by @aizu-m in https://github.com/WebAssembly/wabt/pull/2841\r\n* [cmake] Require Python 3.8 to run tests by @sbc100 in https://github.com/WebAssembly/wabt/pull/2843\r\n* wasm2c: Re-enable s390x CI with some tests disabled (Fix #2655) by @shravanrn in https://github.com/WebAssembly/wabt/pull/2855\r\n* [interp] Fix operand types when tracing table.set by @aizu-m in https://github.com/WebAssembly/wabt/pull/2825\r\n* Update ruff version from 0.15.7 -> 0.16.6 by @sbc100 in https://github.com/WebAssembly/wabt/pull/2844\r\n* [interp] Fix wasm-interp stack cleanup for tail calls by @KKiiim in https://github.com/WebAssembly/wabt/pull/2835\r\n* ci: add -y to apt-get commands and unify cross-build install by @kevmoo in https://github.com/WebAssembly/wabt/pull/2717\r\n* Fix validating imported global refs by @zherczeg in https://github.com/WebAssembly/wabt/pull/2848\r\n* Support (module instance ...) constructs by @zherczeg in https://github.com/WebAssembly/wabt/pull/2847\r\n* Bump version to 1.0.42 by @sbc100 in https://github.com/WebAssembly/wabt/pull/2859\r\n\r\n## New Contributors\r\n* @aizu-m made their first contribution in https://github.com/WebAssembly/wabt/pull/2752\r\n* @6d6f6d656e746f made their first contribution in https://github.com/WebAssembly/wabt/pull/2780\r\n* @lexi-nadia made their first contribution in https://github.com/WebAssembly/wabt/pull/2789\r\n* @XX-Q made their first contribution in https://github.com/WebAssembly/wabt/pull/2811\r\n* @ANAMASGARD made their first contribution in https://github.com/WebAssembly/wabt/pull/2810\r\n* @Nishuuzz made their first contribution in https://github.com/WebAssembly/wabt/pull/2815\r\n\r\n**Full Changelog**: https://github.com/WebAssembly/wabt/compare/1.0.41...1.0.42","mentions_count":11}
