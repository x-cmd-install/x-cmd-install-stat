{"id":434462581,"author":{"login":"mirkobrombin","id":9479903,"node_id":"MDQ6VXNlcjk0Nzk5MDM=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBl_qpc4Z5V91","tag_name":"67.6","target_commitish":"69d69bbf964510b094bbcf698d04f0050e8e0c46","name":"67.6","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T21:09:29Z","updated_at":"2026-11-04T21:15:20Z","published_at":"2026-11-04T21:15:20Z","assets":[],"body":"## What's Changed\n* Added bottle moves between directories and a destination picker when duplicating bottles.\n* Added per-bottle notes and library sorting by bottle name.\n* Added Default, Application and System DPI scaling modes in Advanced Display Settings.\n* Added optional UMU controls, support for launch wrappers and download status in the library.\n* Added a playtime reset button and warnings for missing program files without removing shortcuts.\n* Fixed interrupted downloads on slow connections with a longer read timeout and bounded retries.\n* Fixed startup delays, repeated Battle.net launches and saving imported bottles on external drives.\n* Fixed Windows XP selection on 64-bit bottles and switching between Fsync and NTSync.\n* Fixed restoring the Windows version after dependency installation, dependency progress and multiple uninstallers.\n* Fixed Wine server shutdown and added an installer option to stop completed sessions.\n* Fixed GL32 debug symbol mounts and exposed the selected Wine executable to launch scripts.\n* Updated the experimental Soda catalogs and installer progress logs.\n\n**Full Changelog**: https://github.com/bottlesdevs/Bottles/compare/67.5...67.6\n\n<!-- install-badges -->\n\n## Get Bottles\n\n[![Download on Flathub](https://flathub.org/api/badge?svg&locale=en)](https://flathub.org/apps/com.usebottles.bottles)\n[![Get it with cpak](https://cpak.it/badges/get-it-with-cpak.svg)](https://cpak.it/store/Utilities/github.com/bottlesdevs/bottles)\n","reactions":{"total_