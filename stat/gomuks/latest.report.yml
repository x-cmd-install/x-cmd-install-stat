win-arm64","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14263312,"digest":"sha256:da2eea976bbdd7e7173181b87149df7a2284bbf186a358adf8e68196963cceb9","download_count":4,"created_at":"2026-08-16T13:34:12Z","updated_at":"2026-08-16T13:34:13Z"},{"id":516853743,"node_id":"RA_kwDOB1EdH84ezo_v","name":"gomuks-windows-amd64.exe","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":81270272,"digest":"sha256:ba4ba821cc399255d7387f9c0cf258ed916bc44e98fd171524ef9b1486cfa7f0","download_count":14,"created_at":"2026-08-16T13:34:13Z","updated_at":"2026-08-16T13:34:17Z"},{"id":516853782,"node_id":"RA_kwDOB1EdH84ezpAW","name":"sha256sums.txt","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1159,"digest":"sha256:2584a3c851e7ae0a93139cc61d97105e92d9d6912a225ed5f4b49a2c97f08615","download_count":37,"created_at":"2026-08-16T13:34:17Z","updated_at":"2026-08-16T13:34:18Z"}],"body":"Release post: <https://mau.fi/blog/2026-08-mautrix-release/>\r\n\r\n### Backend\r\n* Added streaming HTTP response as an alternative for websockets.\r\n  * The stream can either use server-sent events (`text/event-stream`) or plain JSON objects (`application/jsonl`) based on the `Accept` header.\r\n* Added support for room list catch-up syncs for frontends.\r\n* Added media download method to C FFI.\r\n* Added support for using the reply UI with the `/raw` command.\r\n* Added `/htmlmd` command which allows sending messages that mix HTML and markdown.\r\n* Added support for calling any HTTP endpoint with basic auth without having to exchange it for an auth cookie first.\r\n* Added `get_versions` and `get_capabilities` commands to get features supported by the homeserver.\r\n* Switched to latest revision of [MSC4461] for sending per-message profiles.\r\n* Changed recovery key reset RPC API generate cross-signing with the recovery key and taking them as a parameter to the upload request instead of generating at upload time.\r\n* Changed format of `get_profile` responses to allow locally generated fields.\r\n* Changed sync responses to allow omitting any field in room entries.\r\n* Changed HTML sanitizer to only allow checkboxes inside unordered list items.\r\n* Changed room state resync to send space edges to clients if the room being resynced is a space.\r\n* Changed verification check to fall back to the verify screen if the key backup encryption key has changed.\r\n* Fixed HTML sanitizer not applying the depth limit specified by Matrix.\r\n* Fixed `prev_batch` token not being saved when paginating messages from the server returns no new messages.\r\n* Fixed `prev_batch` not being reset on limited syncs.\r\n* Fixed clients never receiving initial sync payload if they connect during database initialization.\r\n\r\n[MSC4461]: https://github.com/matrix-org/matrix-spec-proposals/pull/4461\r\n\r\n### Web\r\n* Added option to use server-sent events instead of websockets.\r\n* Added optional client-side room list cache, which is used to reduce the initial payload size when reloading the page. The cache is enabled when both SSE and low-bandwidth mode are enabled.\r\n* Added knocked users to room user list.\r\n* Added option to pin low priority rooms to bottom of room list.\r\n* Added option to stop counting unread messages in low priority rooms.\r\n* Added button to reset TOFU status after another user's master key changed.\r\n* Added hacky support for checking/unchecking todo list items in own messages.\r\n* Added button to subscribe to image packs in the image pack editor.\r\n* Added button to open the user's member event from the right panel user info.\r\n* Added button for fetching previous state events in the room state explorer.\r\n* Added current backend version string to settings.\r\n* Added support for [MSC4440] profile biographies.\r\n* Changed user info panel to blur any user-defined fields if the user is banned in the current room.\r\n* Changed per-message profile rendering to not render \"via\" if the name is the same.\r\n* Fixed websocket auto-reconnection getting throttled by browsers.\r\n* Fixed typing notifications getting stuck when the websocket reconnects.\r\n* Fixed unread counts and space bar not being visible when the room list was resized to be too small.\r\n\r\n[MSC4440]: https://github.com/matrix-org/matrix-spec-proposals/pull/4440\r\n\r\n### Desktop\r\n* Added UI for managing backends.\r\n* Added option to disable tray icon.\r\n  * Closing the main window will stop the backend too when the tray is disabled.\r\n* Added option to disable notifications per backend.\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0}}
