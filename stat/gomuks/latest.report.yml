-arm64","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14924336,"digest":"sha256:4e18da08f415bf7e827310e006e97d919f77a590d32e6611581d3228e4bfb50b","download_count":1,"created_at":"2026-10-16T17:54:18Z","updated_at":"2026-10-16T17:54:19Z"},{"id":648126253,"node_id":"RA_kwDOB1EdH84moZ8t","name":"gomuks-windows-amd64.exe","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":83517440,"digest":"sha256:747696da661f032a418dcb1378cdc5082b033e3b852b42157edc8429f02f7ac2","download_count":1,"created_at":"2026-10-16T17:54:19Z","updated_at":"2026-10-16T17:54:23Z"},{"id":648126425,"node_id":"RA_kwDOB1EdH84moZ_Z","name":"sha256sums.txt","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1159,"digest":"sha256:8ac9686d40305c57d9da2c22c71a6d169694eacc81fc300e89aa0df2e70cdd91","download_count":29,"created_at":"2026-10-16T17:54:23Z","updated_at":"2026-10-16T17:54:23Z"}],"body":"Release post: <https://mau.fi/blog/2026-10-mautrix-release/>\r\n\r\n### Backend\r\n* Added fallback text if the preview message has no text itself.\r\n* Added h2c support for HTTP server.\r\n* Added option to listen with TLS.\r\n* Added option to change initial device displayname via the config file.\r\n* Added support for storing edits received from server-side aggregations.\r\n* Added support for displaying reactions with quotes in the text.\r\n* Added aggregation of own reaction event IDs.\r\n* Added room alias management RPC methods.\r\n* Added config options to change HTTP request timeouts.\r\n* Added `is_dm` flag to pushes.\r\n* Added `formatted_body` for fake events (like command responses) so frontends that don't use the sanitized HTML can still render them.\r\n* Added RPC methods for calling MatrixRTC livekit token endpoints.\r\n* Added support for sending thread read receipts via RPC API.\r\n* Added support for logging out in the Wasm build.\r\n* Changed response type of `get_mentions` to support returning related events.\r\n* Changed HTML sanitizer to allow `<small>` tag.\r\n* Optimized filling reaction count and latest edit aggregations.\r\n* Improved various database indexes to be more efficient.\r\n* Fixed reaction counts not being recalculated when paginating history. \r\n* Fixed timeline reset failing when logged into an account that's only joined to 1 room.\r\n* Fixed syncs not returning latest aggregation data when the original event and aggregated events like edits and reactions were a part of the same sync.\r\n\r\n### Web\r\n* Added spacious room list style option, in addition to the existing compact\r\n  and standard styles.\r\n* Added support for removing own reactions by clicking on them.\r\n* Added `/upgraderoom` command, which pre-fills the room creation dialog.\r\n* Added locally failed sends (ones that didn't even reach the backend) to the timeline to allow retrying them.\r\n* Added support for sharing plain text on Android.\r\n* Added support for sharing to a specific room on Android.\r\n* Added reporting sent messages to Android wrapper for updating native conversation shortcuts.\r\n* Added option to override default preferences from backend config.\r\n* Added support for rendering galleries.\r\n  * Sending is also supported, but mostly disabled, as allowing sending such backwards-incompatible events would be irresponsible.\r\n* Added support for dropping files in the chat view to upload them.\r\n* Improved picking the letter for fallback avatars.\r\n* Fixed pending device code login state not being cleared on successful login.\r\n* Fixed composer draft not being cleared when jumping to another room with `/join`.\r\n* Fixed context menu opening on mobile when unspoilering text or clicking polls.\r\n* Fixed profiles not showing up in notifications panel.\r\n* Fixed copy /raw button for unencrypted events in encrypted rooms.\r\n* Fixed shares from Android being dropped if the main screen wasn't loaded.\r\n* Fixed extra whitespace when copying text from the event source view.\r\n\r\n### C FFI\r\n* Removed root parameter from `GomuksInit`.\r\n* Added `GomuksSetEnv` function for setting environment variables like `GOMUKS_ROOT`.\r\n* Added config parameter to `GomuksInit`.\r\n* Changed `GomuksHandlePush` to return room data in addition to the event.\r\n\r\n### Go RPC client\r\n* Fixed handling syncs without room metadata (thanks to @bleader in #763).\r\n","mentions_count":1}
