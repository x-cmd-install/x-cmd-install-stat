m64","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":14923696,"digest":"sha256:3ae923393a58eae27b67b24891fbcf676dfd865b4e2955f0bae725c1c761bc3c","download_count":2,"created_at":"2026-09-16T11:40:20Z","updated_at":"2026-09-16T11:40:21Z"},{"id":567849747,"node_id":"RA_kwDOB1EdH84h2LMT","name":"gomuks-windows-amd64.exe","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":82364416,"digest":"sha256:51a82d9f48d2159d22076456d3d79267603df36493b1de684ebaeddb58aea2ad","download_count":1,"created_at":"2026-09-16T11:40:21Z","updated_at":"2026-09-16T11:40:25Z"},{"id":567849862,"node_id":"RA_kwDOB1EdH84h2LOG","name":"sha256sums.txt","label":null,"uploader":{"login":"tulir","id":4224639,"node_id":"MDQ6VXNlcjQyMjQ2Mzk=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1159,"digest":"sha256:83d083e6ebba5608d0b0415a3f28c2283c0dae5c2bdac456c6f0f8e729f189cf","download_count":7,"created_at":"2026-09-16T11:40:25Z","updated_at":"2026-09-16T11:40:25Z"}],"body":"Release post: <https://mau.fi/blog/2026-09-mautrix-release/>\r\n\r\n### Backend\r\n* Bumped minimum Go version to 1.26.\r\n* Added support for handling push notifications from homeserver.\r\n  * This is meant for clients that use gomuks as an SDK. The web frontend won't use it.\r\n* Added support for accounts with a broken default SSSS key ID (likely caused by setting up encryption with fluffychat).\r\n* Added `--update` flag to update the current backend binary and exit.\r\n* Added preview text to locally calculated content of events and stopped mutating the raw content to remove fallbacks.\r\n* Added callback-based async methods to the C FFI.\r\n* Switched macOS CI builds to use goolm.\r\n* Fixed room sorting timestamp being bumped by all encrypted events instead of only messages.\r\n\r\n### Web\r\n* Added swipe to reply.\r\n* Added support for jumping to raw event IDs using `/join`.\r\n* Added button to copy `/raw` command including per-message profile in event source view.\r\n* Added `/version` command to check the current gomuks version.\r\n* Added app identifier to outgoing messages.\r\n* Added compact room list option.\r\n* Adjusted padding of composer and room list entries, and fixed alignment of unread counters.\r\n* Changed room names in room list to be less bold when the room is fully read.\r\n* Changed default font to Inter instead of OS defaults.\r\n* Changed emoji/sticker/gif picker to not take up the entire screen on mobile.\r\n* Changed message send errors to be rendered more prominently.\r\n* Re-added support for Tenor in the gif picker.\r\n* Removed custom top context menu on mobile and changed the standard context menu to open when tapping a message.\r\n* Disabled the ability to reply to internal command response messages.\r\n* Fixed message search results not showing date of newest result.\r\n* Fixed internal command response messages using a federated mxc for the avatar instead of loading it locally.\r\n* Fixed tall images being stretched in the upload dialog.\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
