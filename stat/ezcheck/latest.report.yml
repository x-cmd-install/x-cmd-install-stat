:"ezcheck-x86_64-unknown-linux-gnu-mix_backend.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":505654,"digest":null,"download_count":16,"created_at":"2025-02-23T06:34:09Z","updated_at":"2025-02-23T06:34:10Z"},{"id":231762789,"node_id":"RA_kwDONK5IPs4N0Gtl","name":"ezcheck-x86_64-unknown-linux-musl-mix_backend.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"binary/octet-stream","state":"uploaded","size":556625,"digest":null,"download_count":6,"created_at":"2025-02-23T06:33:36Z","updated_at":"2025-02-23T06:33:36Z"}],"body":"## What's Changed\r\n\r\n* \u26a0\ufe0f Breaking change\r\nThe output format of the xxHash series algorithms in ezcheck **0.1.7** is the same as that of [Cyan4973/xxHash](https://github.com/Cyan4973/xxHash) and is no longer compatible with the output format of ezcheck **0.1.6**. If you have already used ezcheck 0.1.6, for the **XXHASH32** and **XXHASH64** algorithms, please remove the `0x` prefix at the beginning of the output. For **XXHASH3_64**, please change the `0x` prefix at the beginning of the output to `XXH3_`. For example,\r\n\r\n  | Algorithm  | Old Format         | New Format            |\r\n  |------------|--------------------|-----------------------|\r\n  | XXHASH32   | 0x0163d3a2         | 0163d3a2              |\r\n  | XXHASH64   | 0x4a34911ba20e6c30 | 4a34911ba20e6c30      |\r\n  | XXHASH3_64 | 0x802c0db623389036 | XXH3_802c0db623389036 |\r\n\r\n* New algorithm alias\r\nNow, you can use `xxhash32` or `xxh32` to use the **XXHASH32** algorithm; you can use `xxhash64` or `xxh64` to use the **XXHASH64** algorithm; you can use `xxh3`, `xxh3_64`, `xxh3-64`, `xxh3/64`, `xxhash3_64`, `xxhash3-64`, or `xxhash3/64` to use the **XXHASH3_64** algorithm.\r\n\r\n* Update dependencies.\r\n\r\n**Full Changelog**: https://github.com/Metaphorme/ezcheck/compare/0.1.6...0.1.7"}
