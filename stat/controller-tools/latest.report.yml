:24Z","updated_at":"2026-09-02T10:29:26Z"},{"id":541008625,"node_id":"RA_kwDOCDDvx84gPyLx","name":"controller-gen-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":32867328,"digest":"sha256:a953a3c2a526b5a0dadd40929cf20af75f666151b19a9f835e008c890fd4e0c4","download_count":5,"created_at":"2026-09-02T10:29:24Z","updated_at":"2026-09-02T10:29:26Z"}],"body":"## What's Changed\r\n\r\n* \u26a0\ufe0f Deprecated +kubebuilder:validation:Required and +kubebuilder:validation:Optional markers in favor of shorter +required and +optional forms (both continue to work) by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1390\r\n* \u26a0\ufe0f Generate ApplyConfig ExtractFuns when kubebuilder:resource marker is absent by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1449\r\n* \u2728 crd: Add k8s:listType and k8s:listMapKey markers by @itzPranshul in https://github.com/kubernetes-sigs/controller-tools/pull/1357\r\n* \u2728 webhook: Add patch field for webhook customization by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1339 https://github.com/kubernetes-sigs/controller-tools/pull/1461\r\n* \ud83c\udf31 crd/markers: Emit cheaper CEL rules for `oneOf` markers by @HadrienPatte in https://github.com/kubernetes-sigs/controller-tools/pull/1408\r\n* \ud83d\udc1b Fix marker parser misinterpreting number-ish strings as numeric literals by @sivchari in https://github.com/kubernetes-sigs/controller-tools/pull/1366\r\n* \ud83d\udc1b Accept `encoding.TextMarshaler` types as CRD map keys by @HadrienPatte in https://github.com/kubernetes-sigs/controller-tools/pull/1419\r\n* \ud83d\udc1b Handle `omitzero` in `OneOf` constraint validation by @HadrienPatte in https://github.com/kubernetes-sigs/controller-tools/pull/1375\r\n* \ud83d\udc1b crd: Fix duplicate MinProperties/MaxProperties by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1398\r\n* \ud83d\udc1b crd: Panic when parsing type aliases from indirectly imported packages by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1399\r\n* \ud83d\udc1b crd: Raise error message instead of crash when using unnamed struct types by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1394\r\n\r\n## Misc\r\n\r\n* \ud83c\udf31 Add OS-specific files and build artifacts to .gitignore by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1403\r\n* \ud83c\udf31 Add copyright header validation & fix findings by @sbueringer in https://github.com/kubernetes-sigs/controller-tools/pull/1451\r\n* \ud83c\udf31 Add envtest tests for +kubebuilder:default={} with nested field defaults by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1392\r\n* \ud83c\udf31 Add new test to ensure that pointer embedded structs with the inline JSON tag works by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1395\r\n* \ud83c\udf31 Add tests to improve coverage for IntOrStringWithEnumSlice by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1385\r\n* \ud83c\udf31 Add verify-generated check for golden files by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1457\r\n* \ud83c\udf31 Declare contents: read permissions for pr-verify action by @arpitjain099 in https://github.com/kubernetes-sigs/controller-tools/pull/1412\r\n* \ud83c\udf31 Migrate to Ginkgo v2 and ensure test temp directories are cleaned up on failure by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1396\r\n* \ud83c\udf31 Replace gopkg.in/yaml with sigs.k8s.io/yaml and go.yaml.in/yaml/v3 by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1440\r\n* \ud83c\udf31 Revert \"Migrate away from custom GitHub action approval workflow\" by @sbueringer in https://github.com/kubernetes-sigs/controller-tools/pull/1428\r\n* \ud83d\udcd6 Add comprehensive XValidation CEL documentation and examples by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1341\r\n* \ud83d\udcd6 Improve documentation about path behaviour by @camilamacedo86 in https://github.com/kubernetes-sigs/controller-tools/pull/1438\r\n* \ud83d\udcd6 Update README compatibility matrix and remove stale content by @HadrienPatte in https://github.com/kubernetes-sigs/controller-tools/pull/1435\r\n\r\n## envtest\r\n\r\n* \u2728 Release envtest v1.36.2 by @yuluo-yx in https://github.com/kubernetes-sigs/controller-tools/pull/1444\r\n* \u2728 Release envtest v1.37.0 by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1468\r\n* \ud83c\udf31 Promotion of envtest release for Kubernetes v1.36.2 by @sbueringer in https://github.com/kubernetes-sigs/controller-tools/pull/1445\r\n* \ud83c\udf31 Promotion of envtest release for Kubernetes v1.37.0 by @sbueringer in https://github.com/kubernetes-sigs/controller-tools/pull/1471\r\n\r\n## Dependency bumps\r\n\r\n* \ud83c\udf31 Bump k8s.io/* to v1.36.1 by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1418\r\n* \ud83c\udf31 Bump k8s.io/* to v0.37.0-beta.0 by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1455\r\n* \ud83c\udf31 Bump k8s.io/* to v0.37.0 by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1470\r\n* \ud83c\udf31 Bump EndBug/add-and-commit from 10.0.0 to 11.0.0 in the all-github-actions group by @dependabot[bot] in https://github.com/kubernetes-sigs/controller-tools/pull/1466\r\n* \ud83c\udf31 Bump EndBug/add-and-commit from 11.0.0 to 11.1.1 in the all-github-actions group by @dependabot[bot] in https://github.com/kubernetes-sigs/controller-tools/pull/1467\r\n* \ud83c\udf