:10Z","updated_at":"2026-10-15T16:50:15Z"},{"id":644519124,"node_id":"RA_kwDOCDDvx84mapTU","name":"controller-gen-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":32901120,"digest":"sha256:4b336ae8538d9e310fe7f06bb0c2245cb643a3599569454d397a0e1b6fc8c3a4","download_count":12,"created_at":"2026-10-15T16:50:10Z","updated_at":"2026-10-15T16:50:12Z"}],"body":"This is an additional minor release independent of the Kubernetes release cadence to deliver\r\n https://github.com/kubernetes-sigs/controller-tools/pull/1474 because this bug fix is a breaking change so it was not possible to backport it.\r\n\r\n## What's Changed\r\n\r\n* ✨ Add option to omit controller-gen version in generated output by @pedjak in https://github.com/kubernetes-sigs/controller-tools/pull/1437\r\n* 🐛 Fix +listType marker not working on type alias fields by @sivchari in https://github.com/kubernetes-sigs/controller-tools/pull/1359\r\n* 🐛 Inject min boundaries for +k8s:required on strings, maps, and slices by @lalitc375 in https://github.com/kubernetes-sigs/controller-tools/pull/1458\r\n* 🐛 crd: support Kubernetes declarative validation bounds by @kannon92 in https://github.com/kubernetes-sigs/controller-tools/pull/1474\r\n\r\n## Dependency bumps\r\n\r\n* 🌱 Bump github.com/onsi/gomega from 1.43.1 to 1.44.0 in the all-go-mod-patch-and-minor group by @dependabot[bot] in https://github.com/kubernetes-sigs/controller-tools/pull/1480\r\n* 🌱 Bump golang.org/x/tools from 0.50.0 to 0.51.0 in the all-go-mod-patch-and-minor group by @dependabot[bot] in https://github.com/kubernetes-sigs/controller-tools/pull/1487\r\n* 🌱 Bump golangci-lint to v2.14.0 and enable promlinter, reassign linters by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1488\r\n* 🌱 Bump sigs.k8s.io/controller-runtime from v0.24.0 to v0.25.0 by @dongjiang1989 in https://github.com/kubernetes-sigs/controller-tools/pull/1476\r\n* 🌱 Bump softprops/action-gh-release from 3.0.2 to 3.0.3 in the all-github-actions group by @dependabot[bot] in https://github.com/kubernetes-sigs/controller-tools/pull/1475\r\n* 🌱 Bump the all-go-mod-patch-and-minor group across 1 directory with 3 updates by @dependabot[bot] in https://github.com/kubernetes-sigs/controller-tools/pull/1478\r\n\r\n\r\n**Full Changelog**: https://github.com/kubernetes-sigs/controller-tools/compare/v0.22.0...v0.23.0","mentions_count":6}
