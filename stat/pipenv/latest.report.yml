{"id":415722800,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBL06l84Yx20w","tag_name":"v2026.10.0","target_commitish":"main","name":"Release v2026.10.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-17T10:02:19Z","updated_at":"2026-10-17T10:03:08Z","published_at":"2026-10-17T10:02:43Z","assets":[],"body":"## \ud83e\udd16 AI-Generated Changelog\n\n## Added\n- Support `file://` URLs as package index and mirror sources\n- Support non-Git local VCS schemes in URL unpacking\n- Accept newer minor `pylock.toml` lock versions with a warning instead of failing\n\n## Fixed\n- Correctly check `pylock.toml` `requires-python` and `environments` fields before installing\n- Pick the correct matching entry for packages listed more than once in `pylock.toml`\n- Preserve local, VCS, and file sources when generating `pylock.toml`\n- Convert `file://` requirements.txt URLs to paths before resolving\n- Fix malformed pip line for file URL extras on `--skip-lock` path\n- Fix `file://` Pipfile entries being mis-handled as filesystem paths on Windows\n- Fix VCS Pipfile entries collapsing when the name also resolves via the index\n- Fix broken pip line when building `file=...+extras=[...]` dependencies\n- Preserve existing Pipfile sources during requirements import\n- Preserve requirements-file source order during deduplication\n- Make requirements.txt `-i <url>` replace the default index rather than add to it\n- Skip `--trusted-host` for hostless source URLs regardless of `verify_ssl`\n- Fix insecure `verify_ssl=false` handling on hardcoded `file://` source blocks\n- Recalculate lock hash after writing temporary Pipfile source\n\n## Changed\n- Vendor bumps: `packaging` to 26.3, `plette` to 2.4.0, `build` to 1.6.1, `pyproject_hooks` to 1.3.3, `dotenv` to 1.2.4\n- Vendor `tomli` for hatchling's build isolation on Python < 3.11\n- Consolidate `VCS_SCHEMES` into `pipenv.utils.constants`\n- Migrate integration tests off real network dependencies to offline `file://`-based fixtures\n\n---\n\n\ud83d\udd17 **Full Changelog**: https://github.com/pypa/pipenv/compare/v2026.9.1...v2026.10.0\n"}
