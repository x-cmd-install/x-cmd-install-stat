{"id":457564253,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBL06l84bReBd","tag_name":"v2026.12.0","target_commitish":"main","name":"Release v2026.12.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-25T02:07:32Z","updated_at":"2026-11-25T02:09:09Z","published_at":"2026-11-25T02:08:44Z","assets":[],"body":"## 🤖 AI-Generated Changelog\n\n## Fixed\n\n- Dropped `cache-dir` value from constraint files to prevent invalid constraint file generation\n- Kept extras on file and path dependencies in requirements output\n- Kept `sys_platform` markers on path/file entries when using `--from-pipfile`\n- Preserved literal percent escapes in local file URL conversion; fixed double-decoding of file URLs\n- Stopped Rich from wrapping `--json`, `--json-tree`, and `--bare` graph output\n- Escaped Rich markup in subprocess output displayed during locking and graph errors\n- Kept going and exited non-zero when `pip uninstall` fails during `clean`/`uninstall` operations, rather than stopping silently\n- Showed pip's stderr output when `pip uninstall` fails\n- Used resolved package names for editable installs during uninstall\n- Kept the downloaded requirements file when running `pipenv install -r <url>`\n- Ran the direct `pip install` safety retry using `subprocess.run` in `check`/`scan`\n- Fell back to default values when numeric environment variables contain non-integer values\n- Raised clean errors for malformed `[scripts]` entries instead of cryptic tracebacks\n- Fixed VCS URL handling: no longer appends empty revision for ref-less entries; extras are no longer incorrectly included on VCS URLs; name-discovery parsers now return `None` on malformed input\n- Tolerated `Name:<val>` (no space) metadata format in dependency parsing\n- Fixed missing f-string in vendored subdependency license path\n- Fixed vendoring license download compatibility with Python 3.15 runners\n\n---\n\n🔗 **Full Changelog**: https://github.com/pypa/pipenv/compare/v2026.11.0...v2026.12.0\n"}
