github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:6c61f4831594ff6b975a6539f0dc9cc79fb4a353bbd06ab26bb1c95fce18c884","download_count":6,"created_at":"2026-11-17T22:53:40Z","updated_at":"2026-11-17T22:53:40Z"}],"body":"FluentCI 0.17.8 adds parallel cache downloads, richer progress reporting, and account-scoped remote build caching.\r\n\r\n### CLI and Engine\r\n\r\n- Show an Indicatif progress bar during `fluentci upgrade`, including percentage, downloaded bytes, transfer speed, and ETA. Upgrade archives stream to disk.\r\n- Replace shell-based CDN cache downloads with bounded Tokio/reqwest workers. Large archives use parallel 8 MiB ranges when a strong ETag is available; other responses use sequential streaming.\r\n- Configure parallel CDN downloads with `FLUENTCI_CACHE_DOWNLOAD_JOBS` (default: 4; range: 1–32).\r\n- Validate byte ranges, object versions, and response lengths before atomically publishing downloaded archives. Failed or cancelled downloads cannot become reusable partial cache entries.\r\n\r\n### Remote build cache\r\n\r\n- Add a standalone cache service with S3-compatible, file, and memory storage, public reads, and account-scoped uploads.\r\n- Support Bazel HTTP and gRPC caching, Turborepo, Nx, BuildKit OCI registry caching, sccache, Go, Gradle, Maven Build Cache, Nix binary caches, and generic HTTP artifacts. Bazel remote execution is not provided.\r\n- Issue upload tokens that remain valid until revoked. Token inventories are paginated and redacted; individual revocation persists across server restarts and cache clearing.\r\n- Manage collaborators and owner-created CI credentials, with token exchanges for automated builds.\r\n- Add owner storage browsing, filtering, usage totals, individual deletion, and cache clearing.\r\n- Refresh the cache dashboard with sidebar navigation, filterable tables, loading skeletons, collaborator avatars, and 30-day storage charts with hover tooltips.\r\n- Collect daily storage snapshots with an hourly worker and prevent concurrent API/worker migration races.\r\n\r\nThe cache service is deployed separately from the CLI. Direct CDN request counts and cache-hit metrics are not included in storage charts.\r\n\r\n### Fixes and documentation\r\n\r\n- Return HTTP 404 for missing registry packages.\r\n- Preserve public read-only cache behavior while protecting administrative operations.\r\n- Update NetBSD release builds to target NetBSD 11.0.\r\n- Document exported module functions across all SDKs.\r\n- Add setup examples for every supported cache protocol, CI authentication, systemd deployment, CDN configuration, and token revocation.\r\n\r\n### Upgrade notes\r\n\r\n- Generate a new upload token once to replace an older expiring token. Existing signed tokens retain their original expiry.\r\n- Update any copied `scripts/cache-token.mjs` helper to support tokens without an expiration date.\r\n- For self-hosted account caches, update the cache service and landing UI before the API. API startup applies the token-metadata migration. Keep revocation markers outside artifact-expiration lifecycle rules.\r\n- Parallel downloading applies to Engine CDN archive restores. The native DAG action-record cache remains local.\r\n\r\n### Validation\r\n\r\nThe release source passed [CI](https://github.com/fluentci-io/fluentci/actions/runs/44174705182), [Component SDK checks](https://github.com/fluentci-io/fluentci/actions/runs/44174705061), and [Nix builds](https://github.com/fluentci-io/fluentci/actions/runs/44174704874). Release binaries are built and uploaded by the release workflows after publication.\r\n\r\n[Full changelog](https://github.com/fluentci-io/fluentci/compare/v0.17.7...v0.17.8)\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0}}
