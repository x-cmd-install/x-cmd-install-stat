id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:fb4852d51e84d21b081785842bd8a7cf1f62b5b8a05c8381d4b7daab3e717468","download_count":0,"created_at":"2026-11-15T05:41:10Z","updated_at":"2026-11-15T05:41:10Z"}],"body":"## Python and TypeScript pipeline builders\r\n\r\nFluentCI 0.17.6 adds fluent method chaining for composing generated module functions with native pipeline primitives.\r\n\r\n- Python: `.pipe(module.function, args)` composes typed module operations with existing `.workdir()`, `.env()`, `.exec()`, `.map()`, `.ensuring()` and `.run()` methods.\r\n- TypeScript: pipeline builders expose the same composition style, with typed result propagation through `.pipe()` and `.map()`.\r\n- Pipelines remain immutable and deferred: constructing a chain does not execute commands; `.run()` starts execution.\r\n- Existing function-based composition APIs remain available.\r\n- FluentCI's bundled SDK sources and fluentci-engine SDK sources are synchronized.\r\n\r\n```python\r\npipeline(\"ci\").pipe(postgres.start, {}).exec(\"bun\", \"test\").run()\r\n```\r\n\r\n```typescript\r\nflow.pipeline(\"ci\")\r\n  .pipe(postgres.start, {})\r\n  .exec([\"bun\", \"test\"])\r\n  .run();\r\n```\r\n\r\nService pipelines should register `.ensuring()` cleanup before executing tests.\r\n\r\nThis release also updates the desktop Cargo lockfile to match FluentCI 0.17.6. Regression coverage was added for deferred construction, immutable branches and mixed module/native chains. Runtime verification is delegated to CI; release assets are uploaded as release jobs complete.\r\n","reactions":{"total_count":2,"+1":0,"-1":0,"laugh":0,"hooray":1,"confused":0,"heart":0,"rocket":1,"eyes":0}}
