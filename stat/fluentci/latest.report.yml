ithub-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":113,"digest":"sha256:27a2211b1736128df4e989e0a39a5bbe31a4d64485ba6a1e23595efcab414361","download_count":0,"created_at":"2026-11-23T07:11:06Z","updated_at":"2026-11-23T07:11:07Z"}],"body":"FluentCI 0.17.9 adds built-in coordination for fresh VM runners, bearer-token authentication for API servers, and improvements to remote build caching and CI packaging.\n\n### Horizontally scalable VM runners\n\n- Use the same `fluentci` binary for the API, runner registration, and developer commands: `cluster serve`, `join`, `submit`, `runners`, `runs`, `inspect`, `cancel`, and `doctor`.\n- Run stateless Tokio/Axum API replicas behind one entry point, with configurable etcd or Consul shared state. Runner hosts can join at any time using outbound API connections, without exposing an inbound runner API or receiving state-backend credentials.\n- Boot a fresh bsdkrun Linux OCI VM for each job. Submit an image, HTTPS Git repository and revision, guest command, CPU/memory limits, timeout, and scheduling labels. Configure each runner's local concurrency with `--slots`.\n- Coordinate durable jobs through atomic claims, unique ownership tokens, heartbeats, and idempotent submission UUIDs. Inspect shared run status and bounded final logs; cancel queued or running work.\n- Remove VMs before publishing results, and retain local cleanup journals for recovery after interrupted runners. Expired claims are reported as lost rather than automatically retried.\n\nRunner images must contain `sh`, `git`, and the requested build tools. Include the Linux FluentCI binary to execute `fluentci run` inside a guest. This release does not provision runner hosts, distribute an individual DAG between machines, or provide live log streaming or artifact storage.\n\n### API authentication\n\n- `fluentci server` and `fluentci cluster serve` generate and display an OS-random 256-bit bearer token when no token is configured.\n- Set `FLUENTCI_SERVER_TOKEN` for the standalone API or `FLUENTCI_CLUSTER_TOKEN` for cluster APIs, runners, and developer commands. A configured token remains stable across restarts and can be shared by API replicas.\n- Protect API HTTP and WebSocket endpoints with constant-time bearer-token checks. Missing or invalid credentials receive HTTP 401; invalid configured secrets are rejected at startup.\n\n**Upgrade note:** standalone API clients now need `Authorization: Bearer <token>`. Configure a stable token for supervised servers and cluster API replicas; generated tokens change on restart. The separate local `fluentci studio` flow remains available for browser development.\n\n### Remote cache and registry\n\n- Add readable DID and handle cache URLs and canonical owner-DID namespaces while preserving legacy hash URL and token compatibility.\n- Provide an incremental DID-key migration helper that preserves source artifacts and token revocation markers. Self-hosted cache operators should follow the [migration guide](https://github.com/fluentci-io/fluentci/blob/v0.17.9/cache/README.md) when upgrading stored namespaces.\n- Add SQLite-backed cache key search and protocol usage charts; improve listing indexes, cached Nix output restoration, and direct CDN reads for public Nix and generic HTTP artifacts.\n- Improve upload handling with two-hour upload support, transient-failure retries, and draining of duplicate uploads before reporting success.\n- Restrict registry Jetstream persistence to FluentCI activity, improve author indexing, and preserve inactive-publisher data during cleanup.\n\nThe cache service and hosted API/UI are separate deployments from the CLI; their changes require updating those services.\n\n### SDKs, CI, and documentation\n\n- Correct PureScript metadata inspection for parenthesized record return types.\n- Integrate FluentCI caching into CLI, desktop, and Nix release workflows; improve signed Nix artifact publication and BSD/macOS build handling.\n- Add cluster setup and architecture documentation, complete cluster CLI argument help, and fix Markdown formatting and Mermaid sequence-diagram syntax.\n\n### Release builds\n\nPlatform binaries and desktop assets are built and uploaded by GitHub Actions after publication. The release workflows bootstrap with the previously published FluentCI v0.17.8.\n\n[Cluster setup](https://github.com/fluentci-io/fluentci/blob/v0.17.9/docs/cluster.md) · [Architecture diagrams](https://github.com/fluentci-io/fluentci/blob/v0.17.9/docs/cluster-architecture.md) · [Full changelog](https://github.com/fluentci-io/fluentci/compare/v0.17.8...v0.17.9)\n"}
