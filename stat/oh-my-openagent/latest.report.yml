_count":11,"created_at":"2026-10-28T22:43:26Z","updated_at":"2026-10-28T22:43:27Z"},{"id":686585463,"node_id":"RA_kwDOQheEEc4o7HZ3","name":"senpi-desktop-engine-linux-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18690472,"digest":"sha256:be0eb8f07cfbab4b62a88f6e6a3517f1f44235448f7e6dd6d8b5c6c9452c8d9c","download_count":13,"created_at":"2026-10-28T22:43:27Z","updated_at":"2026-10-28T22:43:28Z"},{"id":686585496,"node_id":"RA_kwDOQheEEc4o7HaY","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20637240,"digest":"sha256:452c52d28d970ad9e908497ab29d49f0e9c68351f9b4b8584b592ca420d189b5","download_count":17,"created_at":"2026-10-28T22:43:27Z","updated_at":"2026-10-28T22:43:29Z"},{"id":686585554,"node_id":"RA_kwDOQheEEc4o7HbS","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4321792,"digest":"sha256:e23869b2af302172e8b3c21d8eef6c477c8cad0f323058ab7ed3ee44be16e74c","download_count":8,"created_at":"2026-10-28T22:43:28Z","updated_at":"2026-10-28T22:43:29Z"},{"id":686585596,"node_id":"RA_kwDOQheEEc4o7Hb8","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5109248,"digest":"sha256:449b6dd4cb366d9e3187187d11e12b9abdd55def1533862a22e0946c7215267c","download_count":13,"created_at":"2026-10-28T22:43:29Z","updated_at":"2026-10-28T22:43:30Z"},{"id":686585263,"node_id":"RA_kwDOQheEEc4o7HWv","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:eeda06cb87b6e996b6c4e3fda7a6eea67063edf2b79f36b2f4f88ecc420ac1be","download_count":38,"created_at":"2026-10-28T22:43:24Z","updated_at":"2026-10-28T22:43:24Z"}],"body":"5.1.49 and 5.1.50 were not published; their changes ship here.\n\nSession startup and task RPC attachment no longer wait for task-host liveness probes. Recovery runs independently per host, stops claiming or reviving children after shutdown, and preserves newer ownership claims. ([#11335](https://github.com/code-yeongyu/oh-my-openagent/pull/11335)) DAG recovery and workpool reconciliation now wait for that same session-start reconcile (one shared gate) without holding admission, so a paused DAG's revivable child is never judged orphaned and a queued workpool item of an orphaned worker is redelivered rather than marked delivery_uncertain. ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\nContinuing a synchronous task whose session was already deleted now fails at once with an error saying to start a new task, instead of waiting out the 30-minute sync poll timeout; a sync poll also stops when the server keeps reporting its session as not found. Completed sync task sessions now honor `background_task.taskCleanupDelayMs` instead of a fixed 10 minutes. Reported by @orgito. ([#11524](https://github.com/code-yeongyu/oh-my-openagent/pull/11524), fixes [#11520](https://github.com/code-yeongyu/oh-my-openagent/issues/11520))\n\n**omo.dev deploys again after the document-shell change.** The `/design` showcase became a root layout of its own and lost the hourly revalidation it used to inherit, so one prerendered page had no expiry and the deploy's asset-retention check refused the build. The design layout revalidates hourly again, within the site's one-hour HTML lifetime. ([#11587](https://github.com/code-yeongyu/oh-my-openagent/pull/11587), fixes [#11585](https://github.com/code-yeongyu/oh-my-openagent/issues/11585))\n\nRelease pull requests no longer fail the changelog gate when fragments for the next release land on the base branch after the cut. ([#11574](https://github.com/code-yeongyu/oh-my-openagent/pull/11574))\n\n- Release preparation no longer fails its own command-string audit when changelog fragments have been folded into the changelog. ([#11562](https://github.com/code-yeongyu/oh-my-openagent/pull/11562))\n\n**The frontend skill now builds in ten habits that design reviewers check for.** Before designing a new screen, a redesign, or a design system, it reads the guideline source in full, defines the ideal state per persona and journey step, and records every gap in a ledger. Controls keep the same box size in every state, and a spinner or arrow never adds padding. Pointer targets are at least 24 px, colour roles come before components (built from shadcn/ui anatomy), glass and dated trend surfaces stay out unless the brief asks for them, and the subtract pass counts the controls. Every UI or design-system deliverable states a per-criterion WCAG 2.2 AA result. ([#11536](https://github.com/code-yeongyu/oh-my-openagent/pull/11536), fixes [#11534](https://github.com/code-yeongyu/oh-my-openagent/issues/11534))\n\n**macOS computer use releases the keys and buttons it holds even if the engine dies mid-call.** An input request that presses now starts the engine binary again as a hidden release helper and streams every press, drag move and release to it; when the engine is killed, crashes or a request unwinds with something still held, the helper posts the releases (within 2 seconds) through the same routes, leaving any key or button the user is physically holding to the user. The helper runs in its own session, ignores the hangup and terminate a group kill sends until its releases are out, and refuses to run unless the engine that spawned it is its parent and the stream carries its per-spawn token. Other platforms are unchanged. ([#11535](https://github.com/code-yeongyu/oh-my-openagent/pull/11535))\n\n**A process child whose provider has no usable sign-in now moves on to the next provider instead of failing.** When the engine refuses a child's first prompt with `provider_credentials_missing` or `provider_credentials_expired`, the task skips the remaining models on that provider and starts on the next provider in its fallback chain, ending on the parent session's model when nothing else is left. Each hop is recorded as a `task_model_fallback` event naming the provider. An engine that does not send these codes behaves exactly as before. Every other refused first prompt in process mode now also carries the engine's validated error code as `cause_code` in its `task_start_failed` event and in the start-failure message (for example `host_refused: host_memory_pressure`); this is diagnostic only and does not change what the task does. ([#11440](https://github.com/code-yeongyu/oh-my-openagent/pull/11440), part of [#10806](https://github.com/code-yeongyu/oh-my-openagent/issues/10806)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\n**A queued steer to a subagent keeps its own id across the child boundary, and a lost acknowledgment is checked before anything is sent again.** A message queued for a child that is still starting reaches it under the id it was queued with, so a drain repeated after a restart replays instead of delivering a second copy. When the child's acknowledgment is lost, omo asks the child whether it holds that id (`get_pending_inputs`): held settles it, not held resends the same id, and an unreadable answer keeps it uncertain instead of guessing. ([#11427](https://github.com/code-yeongyu/oh-my-openagent/pull/11427), part of [sisyphuslabs/omo-desktop-app#2838](https://github.com/sisyphuslabs/omo-desktop-app/issues/2838)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\n**Model-profile notices no longer reach the model.** A notice such as \"model profile ... has no available model\" was sent as part of the conversation, so the model read it ahead of your first message, and on a slow start it could cost an extra model request. The notice now stays out of the conversation: when there is something to do, the desktop app shows it as a notice with the next step (sign in from Provider authentication settings, or choose a model in the composer), and a headless run logs it. ([#11365](https://github.com/code-yeongyu/oh-my-openagent/pull/11365)) A stored login that failed while a working provider was used instead still reaches you as a notice naming the provider to re-authenticate, and a profile model the registry no longer finds is reported with the step to choose another model. ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\n**Memory read grants now check the file a raw-string tool actually opens.** Containment follows native filesystem traversal before normalizing paths, so a directory symlink followed by `..` cannot redirect a project-memory grant to another identity. Built-in tools retain their resolved-path behavior, missing notes remain readable through their existing canonical ancestor, and case aliases of the same directory remain accepted. ([#11339](https://github.com/code-yeongyu/oh-my-openagent/pull/11339)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\n**Completed Momus review verdicts are now persisted as numbered Markdown artifacts next to the plan file.** Each `.omo/plans/{plan}.reviews/NNN-okay.md` or `NNN-reject.md` artifact captures the verdict, timestamp, model, plan sha256, review duration, reviewer session id, and the verdict block (the reasoning that precedes the verdict is not stored), so a finished review survives the end of the session. A `.gitignore` written next to the plans keeps the `.reviews` directories out of the user's own staging area. Momus itself stays read-only; persistence happens entirely on the orchestrator side after the review result returns. ([#11237](https://github.com/code-yeongyu/oh-my-openagent/pull/11237), fixes [#3002](https://github.com/code-yeongyu/oh-my-openagent/issues/3002)) Thanks to [@surlymochan](https://github.com/surlymochan) for this contribution. ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\n**Release binaries may be up to 200 MiB, and 5.1.49 was not published.** omo 5.1.49's Linux binaries came out over the 182 MiB size budget (linux-x64 200.0 MB, linux-arm64 198.2 MB), so that release stopped before anything was published. The growth is the Bun 1.4.4 runtime itself: an empty compiled Bun program grew from 90.8 MB to 109.1 MB between Bun 1.4.3 and 1.4.4, while everything omo added since 5.1.48 is about 0.46 MB. The budget moves from 182 MiB to 200 MiB so releases keep shipping the Bun version CI tests. ([#11491](https://github.com/code-yeongyu/oh-my-openagent/pull/11491)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n\n**Every omo.dev page now declares its own language and the dark colour scheme, and starts with a skip link.** Korean, Japanese, Chinese and the other locales set `<html lang>` to their language (it was always English), form controls and scrollbars render dark, the first Tab offers \"Skip to content\", focused controls no longer hide under the sticky header, and unknown pages show a 404 in the reader's language. ([#11498](https://github.com/code-yeongyu/oh-my-openagent/pull/11498))\n\n**The omo.dev docs search box has a visible edge and a real label.** Its border now meets the 3:1 contrast floor (it was 1.2:1), screen readers announce it as \"Filter documentation sections\" instead of its placeholder, and the section list has its own name. ([#11492](https://github.com/code-yeongyu/oh-my-openagent/pull/11492))\n\n**Icon buttons on omo.dev show their label on keyboard focus, and Escape closes the mobile menu.** The workflow graph's Fit and Center buttons get a real tooltip (shown on hover and focus, dismissed with Escape), and Escape closes the mobile navigation sheet and puts focus back on the menu button. ([#11490](https://github.com/code-yeongyu/oh-my-openagent/pull/11490))\n\n**Dimmed graph nodes and quiet labels on omo.dev are readable again.** Nodes off the highlighted path in the workflow graph recede by colour instead of fading to 20% (text contrast goes from 1.1:1 to 5.8:1), and step numbers and the corrected word in the demo no longer use the decoration-only grey. ([#11488](https://github.com/code-yeongyu/oh-my-openagent/pull/11488))\n\n**The opencode edition's skill tool no longer repeats skill descriptions OpenCode already lists.** A skill is left out of the skill tool's item list only when OpenCode core's own skill list has the same skill (same name, same file) with a description, so its description is sent once per request instead of twice. Skills core does not list (flat `.md` skills, skills without a name or description, skills core skips because of its disable flags or a custom Claude config dir, OMO-bundled skills) stay in the skill tool's list, and when core's list cannot be read nothing is left out. ([#11456](https://github.com/code-yeongyu/oh-my-openagent/pull/11456))\n\n**The provider sign-in page shows the OmO logo.** Every omo launch path (npm, the compiled binary, the local launcher) hands the engine the OmO icon with its brand, so the page a browser shows after signing in to a provider can carry the OmO mark instead of only the name. The logo appears only once omo pins a senpi release that includes senpi#4432/#4434; the currently pinned senpi (2026.10.27-1) ignores it. ([#11445](https://github.com/code-yeongyu/oh-my-openagent/pull/11445), fixes [#11444](https://github.com/code-yeongyu/oh-my-openagent/issues/11444))\n\n**Release preparation no longer fails its own tests.** The changelog stamp-agreement test read `changes/unreleased` unconditionally; a release-state tree has consumed every fragment and has no such directory, so the test crashed on every release PR. It now reads the real fragments only when the directory exists. ([#11443](https://github.com/code-yeongyu/oh-my-openagent/pull/11443))\n\n**LazyCodex bug-fix skills now send fixes to the repository that owns the source.** `lcx-contribute-bug-fix` told agents that a LazyCodex-owned defect must become a verified-fix issue carrying the patch on the `code-yeongyu/lazycodex` mirror, so a fix that already sat as an open lead PR here was filed a second time as a full diff on the mirror. The skill now searches the author's own open PRs across repos first, then opens a fork PR against `code-yeongyu/oh-my-openagent` (base `dev`, `packages/omo-codex/plugin/...` paths, changelog fragment); the mirror gets no PR and at most a short issue that links it. `lcx-report-bug` routes fixes the same way. Upstream `openai/codex` routing is unchanged. ([#11410](https://github.com/code-yeongyu/oh-my-openagent/pull/11410))\n\n**Research fact locators now bind to original snapshot bytes.** Source snapshots retain the fetched bytes as `raw.bin`; a `--text` file alone becomes a converted-only source that supports warned quotations but no measured rows, and `--raw <bytes> --text <extraction>` keeps the original next to a declared extraction. Page locators read only reader-visible text nodes (never attributes, scripts, styles, or hidden elements), record byte offsets in the source's own encoding, and `fact verify` fails closed when a cited snapshot cannot be read. The new `source refresh` command repins a re-fetched source and re-anchors its rows by quote and context; a legacy row on a refreshed source is listed as not re-anchored and blocks verification instead of passing unchecked. ([#11287](https://github.com/code-yeongyu/oh-my-openagent/pull/11287))\n\n**Research collection now catches numbers that text conversion changed, and refuses to register them.** `source probe-conversion` compares numeric multisets with one grouped-number grammar (a footnote digit glued onto `12,345` is reported; a lone `1.234` is a decimal), never groups digits across a table cell, row, list item or line break, lets digits copied from link targets, image sources, alt text and titles cover only numbers inside Markdown link or image syntax, treats a converter's ordered-list markers (only where the source has that `<ol>` item, lazy `1. 1. 1.` numbering included), numeric reference-link labels, footnote-definition labels and hard-wrapped digit groups as conversion syntax rather than numbers, reads a sign through the emphasis, code, titled-link, image and escape markup a converter adds (`**2019**-2023` is a range), decodes named references with one table on both sides (`&minus;`, `&thinsp;`), reads the raw inline HTML a converter keeps (`10<sup>-5</sup>`, a sized `<img>`) as the source's own tags, accepts a reference title on the next line, and counts a minus touching Korean text, a single letter or an exponent, or written as an en dash. `source snapshot` prints the altered numbers, and `fact add` refuses a value its source's conversion altered with `conversion_altered_number`; the recovery is `source snapshot --id S<n> --text <verified.txt> --replace`, refused while an active row cites the source. The fact-ledger reference declares the probe's guaranteed scope and lists what is out of scope (shortcodes, LaTeX, non-CommonMark tables), which always reports as altered. Both research editions describe this flow; their existing phase instructions now live in focused references. ([#11286](https://github.com/code-yeongyu/oh-my-openagent/pull/11286))\n\n**Skill MCP clients can use MCP 2026-07-28 servers.** Modern servers receive discovery and per-request protocol metadata without an initialization handshake. Input-required operations stop with a clear error because skill MCP does not support elicitation. Legacy servers receive a discovery probe before their existing initialization negotiation; a timed-out probe logs the fallback and is paid only once per server per process, because later connects to that server go straight to legacy initialization (a failed legacy initialization forgets it), and unsupported-version fallback preserves the legacy server's capabilities and identity. ([#11243](https://github.com/code-yeongyu/oh-my-openagent/pull/11243), part of [#11205](https://github.com/code-yeongyu/oh-my-openagent/issues/11205))\n\n**The desktop-engine MCP server also serves MCP 2026-07-28 clients.** Discovery and per-request protocol metadata work without initialization; modern results identify the server and complete result type, and tool lists include cache hints. Unsupported request versions are rejected before daemon access, notifications receive no reply, and legacy initialization keeps its existing supported-version negotiation. ([#11239](https://github.com/code-yeongyu/oh-my-openagent/pull/11239), part of [#11205](https://github.com/code-yeongyu/oh-my-openagent/issues/11205))\n\n### Fixed\n\n- Atlas schedules its delayed boulder-continuation retry through an injectable scheduler (default: the real timer), and its tests drive that scheduler instead of patching global timers, so a whole-suite run no longer fires other modules' timers in the retry tests ([#11619](https://github.com/code-yeongyu/oh-my-openagent/pull/11619), fixes [#11617](https://github.com/code-yeongyu/oh-my-openagent/issues/11617))\n- Cancelling a prompt now stops an in-flight skill MCP call: `skill_mcp` passes the session abort signal to the MCP request, which rejects at once with the abort reason, and an HTTP MCP server's request and SSE stream are closed instead of staying open until the connection is torn down ([#11592](https://github.com/code-yeongyu/oh-my-openagent/pull/11592))\n- The Prometheus planning-file guard resolves Windows paths the way the executor opens them: both `/` and `\\` split the physical walk, so a `link/..` spelling is followed through the link instead of being collapsed lexically (a symlink escape was allowed), a symlinked or junctioned planning directory such as `.omo -> docs\\plans` is recognised again, and 8.3 short names, drive-letter case and directory case all resolve to one canonical path. Inside-planning checks compare the canonical paths exactly, which keeps case-variant entries on case-sensitive directories distinct ([#11548](https://github.com/code-yeongyu/oh-my-openagent/pull/11548))\n- A ChatGPT subscription whose sign-in refresh fails only briefly at session start (connection refused, timeout, a 408/429/5xx from the token endpoint) now stays selected in the model profile. Before, the session moved to the next provider, for example a configured OpenAI API key, and stayed on that metered lane until it was restarted. A refused refresh still skips the provider with the re-authenticate notice, a credential failure seen while re-checking the model still skips the provider with the matching notice, a model whose own request headers fail to resolve is still skipped, and a candidate kept while its refresh is still unresolved logs one warning with the error class and transport code so a later first-turn failure can be traced ([#11442](https://github.com/code-yeongyu/oh-my-openagent/pull/11442), fixes [#11432](https://github.com/code-yeongyu/oh-my-openagent/issues/11432)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n- `omo logout` now leaves a small sign-out note (no credentials, just the device and the time), so OmO Desktop can tell a deliberate sign-out from a credential store that hasn't answered yet. `omo account token` and `export` report it with exit code 10; exit 4 still means nothing could be read. Signing in again removes the note. The note is written before the credentials are removed, so a failed write leaves you signed in and `omo logout` reports the error; a damaged note is ignored (exit 4) and never breaks `omo account show`. ([#11441](https://github.com/code-yeongyu/oh-my-openagent/pull/11441), fixes [#11434](https://github.com/code-yeongyu/oh-my-openagent/issues/11434)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n- A workflow (DAG) category node whose whole model chain is spent or signed out now finishes on the parent session's model, the same last rung a `task` child gets. The model is captured when the workflow starts and kept on the run, so retried and recovered nodes keep it too. ([#11439](https://github.com/code-yeongyu/oh-my-openagent/pull/11439)) ([#11525](https://github.com/code-yeongyu/oh-my-openagent/pull/11525))\n- Prometheus checks and executes the same authorized planning-file path, including relative symlink/`..` paths, aliased project roots, hashline renames, and patch moves. Patch headers must round-trip through the supported executor parser without changing authorized operations or targets. Rename/delete preserve named final links; content writes follow only allowed targets. The physical planning directory may have any name the user chose (for example `.omo -> docs/plans`) but must be strictly inside the real project root, never the root itself or an ancestor; a `.omo` path segment matches with filesystem-native casing. Every denial is logged with its specific reason. Nested plans and parent-folder Windows paths remain supported; required argument rewrites fail closed if the host's retained arguments cannot receive them ([#11424](https://github.com/code-yeongyu/oh-my-openagent/pull/11424))\n- Bundled skills no longer ship a top-level `__tests__` or `*_test` folder. Only a skill's top-level `test/` and `tests/` folders are exempt from the test-folder filter; before, any top-level folder name escaped it. ([#11398](https://github.com/code-yeongyu/oh-my-openagent/pull/11398), fixes [#11393](https://github.com/code-yeongyu/oh-my-openagent/issues/11393))\n- Prometheus now checks every `apply_patch` Add, Update, Delete, and Move target using the executor's line-splitting and header-slicing rules, including carriage returns and Unicode line separators; empty or unclassifiable headers fail closed ([#11392](https://github.com/code-yeongyu/oh-my-openagent/pull/11392))\n- Prometheus allows plan updates beside Markdown horizontal rules and triple-emphasized text by treating Update context as content, while still checking subsequent mutation headers ([#11392](https://github.com/code-yeongyu/oh-my-openagent/pull/11392))\n- `omo run` starts its OpenCode server with a per-run password when `OPENCODE_SERVER_PASSWORD` is not set, so a web page on another localhost port can no longer drive it; attaching to that server from outside the run now needs the password ([#11370](https://github.com/code-yeongyu/oh-my-openagent/pull/11370))\n- Authenticated tmux panes receive credentials through owner-only, one-use files instead of process arguments; run cleanup removes any unread files ([#11370](https://github.com/code-yeongyu/oh-my-openagent/pull/11370)).\n- Research fidelity verification now blocks only the facts whose source snapshot is unreadable, names the cause, accepts grouped derived values such as \"3,234 KRW-e8\" exactly as fill writes them, and detects edits to the original value or unit shown beside a conversion, in any bracket style (ASCII, fullwidth, square, lenticular, corner or tortoise-shell), a missing or misplaced original, a non-numeric bracket, a dash in place of brackets, and a second original (a bare figure in the operand's dimension right after the conversion), in HTML and Markdown editions; another filled fact, a parenthetical figure in prose, a year, or a range after a conversion no longer blocks an untampered report. ([#11310](https://github.com/code-yeongyu/oh-my-openagent/pull/11310))\n- Verified and assumed claim placeholders now fill with their claim marks in HTML and Markdown verification; format guidance reflects Markdown support. ([#11310](https://github.com/code-yeongyu/oh-my-openagent/pull/11310))\n- Research fidelity verification binds the unit written right after a value-only fact, with or without a space and with a Korean particle, a currency sign before it, its unit placeholder, or its table column header by visual column, so hand-edited units block and ordinary prose such as \"m in total length\" no longer raises a false unit mismatch. A scale word inside the value (\"3,234억\", \"12 million\") is part of the value, and a row header in a key/value table is never read as a column header. A qualifier after the value (\"초과\", \"이상\", \"or more\") or an ordinary word that is also a unit alias (\"won awards\", \"second place\") is never read as a unit; a unit wrapped in inline markup, in parentheses or after a line break is read; and fill records each value's bound unit, mode included, in the fill map, so an edit to an unknown unit, a deleted unit, or a deleted `data-fact-mode` attribute still blocks. The longest unit written after a value is the one checked, so a longer unit that starts with the row's unit (\"12% 포인트\", \"12 percent points\" for a row in %) blocks, and an ordinary unit word beside a currency sign of another currency (\"$320 pounds\") blocks. ([#11301](https://github.com/code-yeongyu/oh-my-openagent/pull/11301))\n- First-person verification cues (\"we verified\", \"we double-checked\", and the Korean equivalents) warn only when the clause names a result and no document before the clause ends (\"We measured a latency of 40 ms, as this report shows.\" and \"We verified the value on page 3.\" warn); one cue list covers English and Korean. ([#11301](https://github.com/code-yeongyu/oh-my-openagent/pull/11301))\n- Research fidelity verification now matches complete source revisions (a sentence-final period included), reports a missing operand timestamp and a missing operand row under their own codes instead of a window mismatch, and reads quoted CSV labels correctly. ([#11290](https://github.com/code-yeongyu/oh-my-openagent/pull/11290))\n- Polished report editions retain their original brief binding in a separate `<out>.polished.fill-map.json`, the pre-polish fill map is never rewritten (so `fact pairs --changed-since` still re-checks every sentence that changed, including after polishing in place), a fill map that does not match the report is refused, and editions without a fill map cannot bypass a changed brief. ([#11290](https://github.com/code-yeongyu/oh-my-openagent/pull/11290))\n- Fact derivation requires caller-supplied observation time (`fact derive --now`; without it the command refuses with `missing_now`) and preserves ledger validation errors. Quote exact rules, negative zero, source-value rendering, placeholder identifiers, and literal-brace guidance are corrected. ([#11290](https://github.com/code-yeongyu/oh-my-openagent/pull/11290))\n\n### Added\n\n- CI now fails a pull request that adds an unused file, an unused export, an unused dependency, or an unlisted or unresolved import (`bun run knip:check`, knip 6.43.0). Findings already on `dev` are scoped ignores in `knip.jsonc`, each with its reason. ([#11481](https://github.com/code-yeongyu/oh-my-openagent/pull/11481), fixes [#11433](https://github.com/code-yeongyu/oh-my-openagent/issues/11433))\n- Add the OpenSSL hash-directory selection for the planned engine CA importer: it reads only the hash files Bun's own lookup can reach, walking constructed `<hash>.N` names and stopping at the first failure, so an orphan, misnamed or post-gap file is never trusted. Nothing uses it yet. ([#11430](https://github.com/code-yeongyu/oh-my-openagent/pull/11430), part of [#10762](https://github.com/code-yeongyu/oh-my-openagent/issues/10762))\n- Add the OpenSSL default-file rule for the planned engine CA importer: a default file Bun would reject, or one holding a certificate it indexes but cannot parse, now contributes nothing as a whole, so the importer never trusts a root that Bun itself cannot reach. Nothing uses it yet. ([#11411](https://github.com/code-yeongyu/oh-my-openagent/pull/11411), part of [#10762](https://github.com/code-yeongyu/oh-my-openagent/issues/10762))\n- Add the Linux trust-bundle selector for the planned engine CA importer: it picks the one distribution-generated TLS bundle from `os-release` (Debian, Fedora and SUSE families, with no cross-family fallback) and reads it with an 8 MiB cap and a replacement check. Nothing uses it yet. ([#11407](https://github.com/code-yeongyu/oh-my-openagent/pull/11407), part of [#10762](https://github.com/code-yeongyu/oh-my-openagent/issues/10762))\n- Add the v1 engine trust policy, the pure decision behind the planned engine CA importer: from per-OS certificate facts it selects the SSL-server roots and chain-building intermediates, and it applies every OS Deny or Disallowed entry. Nothing uses it yet; the engine still trusts the OS store through `NODE_USE_SYSTEM_CA`. ([#11405](https://github.com/code-yeongyu/oh-my-openagent/pull/11405), part of [#10762](https://github.com/code-yeongyu/oh-my-openagent/issues/10762))\n\n### Security\n\n- Capture the host execution arguments before the complete before-hook chain, rejecting detached or subsequently changed Prometheus approvals. Tests also cover aliased temporary roots rather than assuming temporary paths are canonical. ([#11424](https://github.com/code-yeongyu/oh-my-openagent/pull/11424))\n- Known and not fixed here: a hard link already under `.omo` can share an inode with a file outside `.omo`; realpath does not provide inode isolation. ([#11424](https://github.com/code-yeongyu/oh-my-openagent/pull/11424))\n- Known and not fixed here: TOCTOU between `tool.execute.before` and the tool's open. Closing this race requires tool-side `O_NOFOLLOW` and directory-handle confinement. ([#11424](https://github.com/code-yeongyu/oh-my-openagent/pull/11424))\n- Known and not fixed here: the patch round-trip trusts the vendored parser pinned to OpenCode 32f278b4; if the host parser changes, checked and executed targets can diverge again. ([#11424](https://github.com/code-yeongyu/oh-my-openagent/pull/11424))\n\n### Also in this release: the changes prepared for 5.1.49\n\n**Error messages name a step that works today.** While terminal sign-in is closed, every \"run omo login\" hint (sign-in, `omo sync`, expired or unreadable sign-ins, memory sync) points at the OmO desktop app instead, and keeps naming `omo login` once accounts open. A refused service request says whether to sign in again, wait, try later or update omo, instead of always blaming sign-in. A missing plugin file, `omo thread` and `omo update` on a broken current install print the exact reinstall command, and `/computer` says why computer use is unavailable. ([#11390](https://github.com/code-yeongyu/oh-my-openagent/pull/11390), part of [#11379](https://github.com/code-yeongyu/oh-my-openagent/issues/11379)) ([#11417](https://github.com/code-yeongyu/oh-my-openagent/pull/11417))\n\n**Maintainers can inspect or recreate a stuck get.omo.dev channel pointer from the installer mirror workflow.** A manual run with `op=head` prints the signed HEAD and GET of `channels/latest` or `channels/beta` (status, every response header, body; credentials redacted), and `op=recreate` deletes the pointer and writes the given version as a new object, then reads it back; it refuses a version that is not fully mirrored or does not fit the channel (a prerelease on beta, a stable release on latest). Both share one concurrency group per channel with a mirror that moves that channel. ([#11349](https://github.com/code-yeongyu/oh-my-openagent/pull/11349), part of [#11313](https://github.com/code-yeongyu/oh-my-openagent/issues/11313)) ([#11417](https://github.com/code-yeongyu/oh-my-openagent/pull/11417))\n\n**A permission denial or a refusal by the user is final for what the refused call was meant to do.** Every model route of Sisyphus, Sisyphus-Junior, Hephaestus and Atlas now ends its prompt (before any `prompt_append`) with one rule: never reach a refused result with another tool, command, path or host; ask the user. Every ultrawork variant (default, Gemini, GLM, GPT, Codex, planner) and the todo and boulder continuations carry the same rule. A test enumerates every prompt route, so a new route without the rule fails. The continuations say \"Proceed without asking whether to continue\" instead of \"Proceed without asking for permission\". Computer-use telemetry still counts a refusal as a permission denial when senpi adds guidance after its first sentence. ([#11371](https://github.com/code-yeongyu/oh-my-openagent/pull/11371), part of [code-yeongyu/senpi#4309](https://github.com/code-yeongyu/senpi/issues/4309)) ([#11391](https://github.com/code-yeongyu/oh-my-openagent/pull/11391))\n\n**Bug reports reach the OmO team again.** Every report sent from `/bug`, `/feedback` or the desktop's in-app report was refused by the report service, which the app showed as a connection problem. Reports now carry the exact-body SHA-256 and length and a semantic redactor version, as the service requires, and terminal reports use your `omo login` account when you are signed in; signed-out reports still work, and an expired or unusable sign-in sends the report without your account instead of blocking it. In the terminal, each refusal the service can answer is now named: sign-in refusals point to `omo login`, a request the service rejects shows its error code and request ID, a service-side failure says to try again later, and only a send with no answer is reported as a connection problem ([#11194](https://github.com/code-yeongyu/oh-my-openagent/issues/11194), [#11213](https://github.com/code-yeongyu/oh-my-openagent/pull/11213)). ([#11391](https://github.com/code-yeongyu/oh-my-openagent/pull/11391))\n\nRuns on senpi 2026.10.27-1, which tightens shell permission checks. ([#11364](https://github.com/code-yeongyu/oh-my-openagent/pull/11364))\n\n**Memory patches that move a file twice in one change no longer leave the memory repository blocked.** A chained move such as `a.md -> c.md -> d.md` listed the intermediate `c.md` as a path to commit even though it never existed, so git refused the commit and the next memory write found a dirty tree. The intermediate is now dropped when it never existed and kept when it was a real tracked file. Thanks to @MoerAI for the fix. ([#11305](https://github.com/code-yeongyu/oh-my-openagent/pull/11305), car [#11307](https://github.com/code-yeongyu/oh-my-openagent/pull/11307), part of [#10858](https://github.com/code-yeongyu/oh-my-openagent/issues/10858)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n\n**Memory notice warnings go through the memory logger, and a failed watermark rename keeps its own error.** Directory-sync warnings after a soul or agreement watermark is published are now reported through the memory component's logger instead of a direct `console.warn`, so the host decides where they go, and a temp-file cleanup failure no longer replaces the original rename error. ([#11284](https://github.com/code-yeongyu/oh-my-openagent/pull/11284), part of [#10707](https://github.com/code-yeongyu/oh-my-openagent/issues/10707)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n\n**omo.dev/download now redirects temporarily (307) to the public desktop beta page.** Browsers no longer cache the redirect, so they will reach omo.dev's own download page once that page is enabled; a browser that already cached the earlier permanent (301) redirect keeps it until that cache entry expires. ([#11272](https://github.com/code-yeongyu/oh-my-openagent/pull/11272), follow-up to [#11270](https://github.com/code-yeongyu/oh-my-openagent/pull/11270)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n\n**Claude Fable 5.5 leads the Fable chains once released.** Once 5.5 is released, every builtin chain or profile that runs Claude Fable 5.1 tries 5.5 first at the same effort, with 5.1 kept as the next step. Until then no builtin default, chain or profile lists 5.5, so 5.1 keeps running ([#10798](https://github.com/code-yeongyu/oh-my-openagent/issues/10798), [#10800](https://github.com/code-yeongyu/oh-my-openagent/pull/10800)). ([#11350](https://github.com/code-yeongyu/oh-my-openagent/pull/11350))\n\n**Claude Fable 5.5 is recognised ahead of its launch.** Model detection, context limits, telemetry and the refusal fallback notice know Claude Fable 5.5. Until it is released, no routing path picks the provisional id without proof the model exists, and catalog data always wins over the launch placeholder ([#10798](https://github.com/code-yeongyu/oh-my-openagent/issues/10798), [#10800](https://github.com/code-yeongyu/oh-my-openagent/pull/10800)). ([#11350](https://github.com/code-yeongyu/oh-my-openagent/pull/11350))\n\n**The frontend skill's `llms.txt` fetch allowance covers same-origin pages only, and robots.txt still wins over it.** Agents read the pages a site's own `llms.txt` links on that site, never off-site links, and a robots.txt disallow beats an `llms.txt` link. ([#11338](https://github.com/code-yeongyu/oh-my-openagent/pull/11338), fixes [#11337](https://github.com/code-yeongyu/oh-my-openagent/issues/11337))\n\n**The omo.dev desktop beta button reads naturally in Spanish, Portuguese, French and Chinese.** ([#11331](https://github.com/code-yeongyu/oh-my-openagent/pull/11331))\n\n**The frontend skill's fetch rule now covers pages a site's own `llms.txt` links.** footer.design's `/styles` pages were listed as an agent surface while the same file forbade reading HTML pages; agents may now read the pages a site's `llms.txt` links and still never crawl other HTML pages. ([#11323](https://github.com/code-yeongyu/oh-my-openagent/pull/11323), fixes [#11320](https://github.com/code-yeongyu/oh-my-openagent/issues/11320))\n\n**omo.dev's hero links the OmO desktop public beta.** A \"Get the desktop beta\" button next to Get started opens https://get.omo.dev/desktop/beta/ in every site language. ([#11315](https://github.com/code-yeongyu/oh-my-openagent/pull/11315))\n\n**The frontend skill routes more design sources and asks for research before a landing redesign.** MicroKit, Motion Primitives, Uiverse and 21st.dev join the component catalog with licence, agent surface and measured reduced-motion coverage; section galleries (navbar, pricing, CTA, hero, footer, landing.love, Awwwards) are listed as structure-only references; Mobbin is used only through the user's own connected MCP. A marketing-page redesign writes a four-part research report before the first edit, the draft guard names invented proof, prop decoration and repeated headline formulas, and fix passes after the first build stay scoped to one region. ([#11314](https://github.com/code-yeongyu/oh-my-openagent/pull/11314), fixes [#11312](https://github.com/code-yeongyu/oh-my-openagent/issues/11312))\n\n**Bun type declarations now match the Bun 1.4.4 toolchain.** Every package manifest pins `bun-types` or `@types/bun` to 1.4.4, with the root, web, worker, Codex plugin and both LSP package lockfiles synchronized. The committed Codex installer was regenerated in the pinned Linux container. ([#11311](https://github.com/code-yeongyu/oh-my-openagent/pull/11311))\n\n**A session command OmO adds later is no longer sent to an attach-enforcing senpi host without an attachment.** The thread client fenced only a fixed list of mutations, while the host refuses every session command from an unattached connection except its read allowlist; under `SENPI_RPC_REQUIRE_ATTACH=1` any command missing from the client's list would be refused. The client now fences every session command except the reads the host exempts. ([#11278](https://github.com/code-yeongyu/oh-my-openagent/pull/11278), part of [#10944](https://github.com/code-yeongyu/oh-my-openagent/issues/10944)) ([#11297](https://github.com/code-yeongyu/oh-my-openagent/pull/11297))\n\n**A summary queued by a session that named only its profile is judged with the account's home again.** Since #11202 a queued session summary is judged by the config it was recorded under; when that config named a profile but no home, the consent read had no home at all and fell back to the working directory. It now reads the account's home, as the send gate does. The reference doc also says that summaries queued before #11202 keep the old reading until they expire. ([#11275](https://github.com/code-yeongyu/oh-my-openagent/pull/11275)) ([#11297](https://github.com/code-yeongyu/oh-my-openagent/pull/11297))\n\n**Memory sync and the `memory` tool no longer hang while a macOS keychain approval dialog is open.** A session's sign-in read now gives up after 5 s with an error that names the \"bun wants to access key omo-cli\" dialog to answer, instead of waiting with no end. Memory sync skips that pass, logs why, and retries after 15 s, doubling to a 5-minute cap, and the `memory` tool returns at once. A one-time \"Allow\" clicked after that 5 s deadline is not kept, so the next sync retry asks again; choose \"Always Allow\" to stop the prompts. All reads in one process share the one keychain request that is still waiting, so parallel sessions no longer stack a blocked read (and another dialog) per request, and after a late approval the next read goes back to the OS store, so another process's rotated token cannot be replaced by an old answer. `omo login`, `omo whoami`, `omo account` and `omo sync` still wait for the dialog, and now say so after 2 s. Reported by @floweredao. ([#11264](https://github.com/code-yeongyu/oh-my-openagent/pull/11264), part of [#11262](https://github.com/code-yeongyu/oh-my-openagent/issues/11262)) ([#11297](https://github.com/code-yeongyu/oh-my-openagent/pull/11297))\n\n**The research delivery barrier checks one meaning record per delivered edition.** `fact meaning-check --edition <format>` writes `fidelity-meaning-defects.<format>.json` bound to that edition's bytes, so an html report delivered with a byte-different inline, Markdown, or post edition passes once each edition with different bytes is checked (an edition whose bytes match a checked edition, such as a copy at another path or a PDF of the html edition, shares its record), and a stale or unchecked edition refuses alone. A single-edition session keeps using `fidelity-meaning-defects.json` unchanged. Existing session fidelity records remain blocking even when a delivered row attaches a different clean record, and two paths to one record (including through a symlink) no longer duplicate its defects. (Closes #11241, Part of #11009) ([#11289](https://github.com/code-yeongyu/oh-my-openagent/pull/11289))\n\n**CI, release workflows and the devcontainer run Bun 1.4.4.** Every `oven-sh/setup-bun` step installs Bun 1.4.4 instead of 1.4.3, the Bun install-cache keys move to `bun-1.4.4-`, the devcontainer installs `bun-v1.4.4`, and `script/agent/setup.sh` expects 1.4.4. ([#10895](https://github.com/code-yeongyu/oh-my-openagent/pull/10895))\n\n### Added\n\n- Set `OMO_BUNDLED_SKILLS_DIR` to an absolute directory to share bundled skills\n  across runtime installations. Absent or empty is unchanged. An invalid\n  `OMO_BUNDLED_SKILLS_DIR` (relative, missing, not a directory, unreadable) now\n  logs ONE error naming the variable and falls back to the plugin-relative\n  bundled skills; task tools and the bare skill commands stay\n  registered. Conditional, user, project, and memory skill roots keep their\n  existing locations. ([#11332](https://github.com/code-yeongyu/oh-my-openagent/pull/11332)) ([#11417](https://github.com/code-yeongyu/oh-my-openagent/pull/11417))\n- An explicit `skillsDir` option now wins over a valid\n  `OMO_BUNDLED_SKILLS_DIR`; precedence is explicit option, then a valid\n  override, then the plugin default. ([#11332](https://github.com/code-yeongyu/oh-my-openagent/pull/11332)) ([#11417](https://github.com/code-yeongyu/oh-my-openagent/pull/11417))\n- The override resolver lives in the bundled-skills component itself (no\n  separate module), which keeps the built `omo.js` inside its size budget:\n  the change costs 531 bytes instead of 1,899. ([#11332](https://github.com/code-yeongyu/oh-my-openagent/pull/11332)) ([#11417](https://github.com/code-yeongyu/oh-my-openagent/pull/11417))\n- Add generation-fenced computer-use stop-authority admission: a newer stop\n  rejects an in-flight activation, and durable completion cannot reopen input.\n  This is the local safety prerequisite for the protected stop broker; existing\n  launch modes retain their behavior. ([#11333](https://github.com/code-yeongyu/oh-my-openagent/pull/11333)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n\n### Fixed\n\n- After quitting and reopening the same stopped session, the person's next message releases the Stop and reopens task admission even if an acknowledged paused child cannot restore. That child's failure remains recorded, its acknowledged cutoff is kept, and a later Resume can retry it without a live hold observer. This does not recover a parked queued admission (`held_admission`) marked `lost`: after restart, `retryLost` has no resume credential to re-admit it, so it stays stranded (omo#10864, item 1). ([#11401](https://github.com/code-yeongyu/oh-my-openagent/pull/11401)) ([#11417](https://github.com/code-yeongyu/oh-my-openagent/pull/11417))\n- Bundled skills no longer ship `test`, `tests`, `__tests__`, or `*_test` folders nested below a skill's top level (such as ultimate-browsing's `engine/tests`), so a test module can no longer run inside the installed app and write caches there. Top-level `test/` and `tests/` resources still ship. ([#11377](https://github.com/code-yeongyu/oh-my-openagent/pull/11377), part of [#11373](https://github.com/code-yeongyu/oh-my-openagent/issues/11373)) ([#11391](https://github.com/code-yeongyu/oh-my-openagent/pull/11391))\n- Running a bundled skill no longer writes files inside the installed app, so OmO Desktop no longer reports its files as changed and stops its local server after the coding-agent-sessions, ultimate-browsing or frontend skills run their Python scripts. A manual ast-grep install now downloads into a user cache folder instead of the skill folder. Python the agent runs now keeps its compiled bytecode in an OmO cache folder instead of next to the script, so your projects still start fast without `__pycache__` folders appearing in them; if you set `PYTHONDONTWRITEBYTECODE` or `PYTHONPYCACHEPREFIX` yourself, OmO leaves both alone. Thanks to @minerva32 for the report. ([#11376](https://github.com/code-yeongyu/oh-my-openagent/pull/11376), fixes [#11373](https://github.com/code-yeongyu/oh-my-openagent/issues/11373)) ([#11391](https://github.com/code-yeongyu/oh-my-openagent/pull/11391))\n- Prometheus can no longer write outside `.omo/*.md` through `apply_patch`, `multiedit` or a hashline edit's `rename`; a write whose target it cannot read is blocked ([#11369](https://github.com/code-yeongyu/oh-my-openagent/pull/11369))\n- Count a Windows stop-hotkey request once in authority mode instead of\n  advancing its stop generation again when the worker completes it. ([#11333](https://github.com/code-yeongyu/oh-my-openagent/pull/11333)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n- Codex installations now contain only regular files and directories, preventing dependency symlinks from disabling every OmO hook during plugin fingerprinting. Native comment-checker resolution remains available without npm executable links. ([#11328](https://github.com/code-yeongyu/oh-my-openagent/pull/11328)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n- The direct Codex package now includes its local LSP dependency so installation can materialize it instead of leaving a dangling package link. ([#11328](https://github.com/code-yeongyu/oh-my-openagent/pull/11328)) ([#11363](https://github.com/code-yeongyu/oh-my-openagent/pull/11363))\n- Hosted tasks retain their original session through missed state probes, report unresponsive and recovered status to the parent, and resume queued steering without creating another child. An overdue unresponsive session is reported ended only after the live host confirms its absence following close, never from an acknowledgement or closed frame alone. ([#11317](https://github.com/code-yeongyu/oh-my-openagent/pull/11317)) ([#11350](https://github.com/code-yeongyu/oh-my-openagent/pull/11350))\n- Child activity resets missed heartbeat probes, so a delayed state reply does not label a still-streaming child unresponsive. ([#11317](https://github.com/code-yeongyu/oh-my-openagent/pull/11317)) ([#11350](https://github.com/code-yeongyu/oh-my-openagent/pull/11350))\n- Finished resident children report retryable unresponsiveness, and transient liveness oscillations are coalesced instead of repeatedly waking the parent. ([#11317](https://github.com/code-yeongyu/oh-my-openagent/pull/11317)) ([#11350](https://github.com/code-yeongyu/oh-my-openagent/pull/11350))\n- Research outcome initialization records the run clock once, from `--started-at`, an earlier valid manifest, a supervisor's run-state file, or the timestamped session directory name, and refuses impossible, future, or copied start times. ([#11302](https://github.com/code-yeongyu/oh-my-openagent/pull/11302))\n- Claim prefixes (V, A, D) fill through the claim-kind registry, and Sources sections check every sentence holding a numeral that is not a citation field (a year or date, a page, volume, issue, or edition marker, a number inside a URL, DOI, arXiv id, ISBN, quoted or cited title, or a citation tag), so reference entries stay exempt and claim sentences are checked; a number in an unquoted title is checked. A year range and link text count as citation fields, and a digit run glued to letters that are not a unit, multiplier, or currency (a commit hash, an issue number, GPT-4, Q3) is a name rather than a numeral, while 50M, 10k, 3x, x3, 2.5GB, 12%, 5mn, 40pct, 5yrs and 1.234.567 stay numerals, also when a word is glued in front of the measure. ([#11302](https://github.com/code-yeongyu/oh-my-openagent/pull/11302))\n- Keep quoted style end-tag attributes inside the polish markup boundary, report edits adjacent to unfinished character references precisely, and respect Markdown closing-fence indentation. ([#11291](https://github.com/code-yeongyu/oh-my-openagent/pull/11291))\n- Expose whether every polish edit applied through a JSON boolean while preserving partial-output success and accepted-edit counts. ([#11291](https://github.com/code-yeongyu/oh-my-openagent/pull/11291))\n- Memory supervisor integration tests report an exited supervisor's code, stderr and run artifacts when a child start or durable state never arrives, instead of stalling until a timeout. ([#11288](https://github.com/code-yeongyu/oh-my-openagent/pull/11288))\n\n- c8955517dd docs(release): 5.1.51 notes: drop the dev-only knip bullet and the stale next-release line\n- 95c926c34c docs(release): 5.1.51 notes: ship the unpublished 5.1.49 and 5.1.50 entries, lead with the speed fixes\n- 4c0afd4679 Merge pull request #11664 from code-yeongyu/fix/knip-telemetry-rename-rows\n- 3cc1f5eefb Merge remote-tracking branch 'origin/dev' into fix/knip-telemetry-rename-rows\n- e9ad0f09c9 Merge pull request #11548 from code-yeongyu/fix/11541-windows-path-identity\n- aa6e9d184d Merge pull request #11646 from code-yeongyu/fix/knip-dev-design-revalidate\n- bd1310b65d Merge pull request #11563 from code-yeongyu/fix/9766-script-scratch-temp-leak\n- a57d2da4fb Merge pull request #11502 from code-yeongyu/p0/p0-06i-control-confirm-char\n- d0b1623163 Merge origin/dev into fix/11541-windows-path-identity\n- 8159bfbbf4 docs(changes): changelog fr