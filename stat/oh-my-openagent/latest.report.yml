b4d522b7bdeac869c9099469d1986006dc384efb","download_count":20,"created_at":"2026-11-07T16:57:55Z","updated_at":"2026-11-07T16:57:56Z"},{"id":721319263,"node_id":"RA_kwDOQheEEc4q_nVf","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4929024,"digest":"sha256:b9b117311dc20956686503b166fe64955077ca334d554ccccb68d30d0293385b","download_count":18,"created_at":"2026-11-07T16:57:55Z","updated_at":"2026-11-07T16:57:56Z"},{"id":721319267,"node_id":"RA_kwDOQheEEc4q_nVj","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6048768,"digest":"sha256:69d198b96b89ef001bbab5c1c6f7182d906052aec956be163e150a36b21b115e","download_count":26,"created_at":"2026-11-07T16:57:55Z","updated_at":"2026-11-07T16:57:56Z"},{"id":721319167,"node_id":"RA_kwDOQheEEc4q_nT_","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1232,"digest":"sha256:d8ce4d9764c1252d07542118483dfb3ac44edc6f5399544d2d52fba294234781","download_count":82,"created_at":"2026-11-07T16:57:53Z","updated_at":"2026-11-07T16:57:54Z"}],"body":"**Desktop memory sync now starts as soon as the engine boots, without waiting for a session.** An engine started by `omo host ensure` loads extensions only when a session opens, while the desktop opens none until the engine has sent the memory-sync bootstrap handshake, so the two waited on each other. The compiled `omo` and the npm launcher now start that one claim before the engine loads whenever an RPC engine's launch declares a `memory-sync` channel; the first session reuses it. A claim that fails still reports memory sync as unavailable and never falls back to CLI credentials. ([#12702](https://github.com/code-yeongyu/oh-my-openagent/issues/12702)) ([#12704](https://github.com/code-yeongyu/oh-my-openagent/pull/12704))\n\nInternal (tests only): macOS trust acquisition reads `/etc/ssl/cert.pem` through the already-injectable bundle reader, and a test now proves that a malformed default file yields the structured `openssl-default-file-malformed` drop entry (file, cause, block index, narrowing). ([#12633](https://github.com/code-yeongyu/oh-my-openagent/pull/12633))\n\nInternal (tests only): the OpenSSL default-file importer tests now pin that any high byte on a BEGIN line, not only a BOM, drops the whole file. ([#12632](https://github.com/code-yeongyu/oh-my-openagent/pull/12632))\n\nInternal (release tooling): the omo-native trust mutation harness counts a mutant as killed only when a named test fails by an assertion; a mutant that only throws a runtime error or crashes on load is now reported as `crashed` and fails the run. ([#12631](https://github.com/code-yeongyu/oh-my-openagent/pull/12631))\n\n### Fixed\n\n- Memory sync no longer loses an edit when two devices change the same line of a memory file at the same time. Devices on this version keep both edits as whole lines, and every device converges. Before, the edits were merged character by character into text that matched neither (#12279).\n  - Between devices on this version, an edit does not disturb a line nobody edited. The exception is a very large rewrite: when one device adds and removes more than about 2,000 lines of a note in one save, that save is merged character by character, as before this fix, so a concurrent edit to the same line can still splice.\n  - When the note's body or the new text does not end with a newline, the edit is still merged character by character, as before, so two concurrent edits to that last line can still splice.\n  - With a device that still runs an older version, its old character merge can still go wrong in these ways:\n    - **Adjacent lines can fuse.** The older device rewrites the line right after a line this version edited. Depending on the two devices' internal ids, the two edits can fuse into one line followed by an empty line. Measured: from `head`, `one`, `two`, `tail`, this version writes `ONE` and the older device writes `TWO`, and the result can be `head`, `TWOONE`, an empty line, `tail`. Two older devices give `head`, `ONE`, `TWO`, `tail`.\n    - **Leftover text moves.** The older device edits a line this version deletes. Its leftover text joins a neighbouring line.\n    - **Its own diff touches other lines.** The older device's character merge crosses into a line its user did not edit. This also happens between two older devices.\n  - Two older devices keep their old character merge until they update. ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n- Memory sync: the push phase of a large memory set no longer needs memory in proportion to the whole set. Every push step used to re-read and re-write one journal file holding every pending item's data, several times per batch. A device pushing a few thousand memory files therefore peaked at 2 GiB or more (#12286). The journal now keeps a small index of pending items with their data in separate files, and a push reads only the batch it is sending. Capturing the set before the push still holds each captured file's text until the capture ends. A journal written by an older build is converted the first time it is read, including one where an older build added items next to the new index. ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n- Memory sync: a device receiving a large memory set no longer slows down with every file it lands. The render step used to re-read every render record of the cycle for each file, so the first pull of a few thousand memory files took tens of minutes (#12285). Each file now costs the same, and the crash-resume behavior is unchanged. ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n- Memory git no longer takes `core.hooksPath`, `core.fsmonitor`, `include.path` or `includeIf.*.path` from an inherited `GIT_CONFIG_COUNT` pair or `GIT_CONFIG_PARAMETERS` entry, so an exported pair such as `core.hooksPath=/dev/null` can no longer silently skip the memory repository's hooks and mirror push. Every other injected pair (`url.*.insteadOf`, `http.extraHeader`, credentials, `safe.directory`, ...) still applies, renumbered; an injected list git itself cannot parse is dropped whole. Memory git also no longer inherits repository redirection (`GIT_DIR`, `GIT_WORK_TREE`, `GIT_COMMON_DIR`, `GIT_OBJECT_DIRECTORY`, `GIT_NAMESPACE`, `GIT_CONFIG`, ...), so it can no longer be pointed at another repository; `GIT_INDEX_FILE`, `GIT_CONFIG_GLOBAL` and `GIT_CONFIG_NOSYSTEM` are kept. ([#12360](https://github.com/code-yeongyu/oh-my-openagent/pull/12360), fixes [#12354](https://github.com/code-yeongyu/oh-my-openagent/issues/12354)) ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n- Memory sync no longer stops every push from a device when one memory file's change is larger than the 8 MiB batch limit: that file is held back and named in the sync status with what to do, every other memory keeps syncing, and the file syncs on its own once it fits. A change another device makes to a held file is kept and lands in this device's copy once the file fits, and a change an older build had already queued for such a file is recovered the same way instead of staying stuck. The TUI footer shows ` sync held` and the notice says the file is being held back, and a refused entry that pauses sync is never hidden behind a held file. ([#12284](https://github.com/code-yeongyu/oh-my-openagent/issues/12284)) ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n- Opening a memory repository starts up to six fewer git processes: the local config defaults are read with one `git config --list` instead of one `git config --get` per key, and the line-ending repair is skipped while the repository tracks nothing. Every session that opens memory pays this, and on a loaded machine each git process costs hundreds of milliseconds. memory-core's own tests now run under the canonical 20 s test budget instead of per-file 5-15 s limits, which made them fail only on busy hosts. ([#12104](https://github.com/code-yeongyu/oh-my-openagent/pull/12104), fixes [#12103](https://github.com/code-yeongyu/oh-my-openagent/issues/12103)) ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n- `thread_send` no longer reports a message as `queued` when nothing will ever pick it up. When the target thread's session has no running drain, the send now answers `queued_offline`: the message is kept and the session takes it the next time it runs, so a caller knows no turn started and can act instead of waiting. The drain also reports a message it is holding behind the user's unsent draft, so a live drain is never mistaken for a missing one. ([#12488](https://github.com/code-yeongyu/oh-my-openagent/pull/12488), fixes [#12486](https://github.com/code-yeongyu/oh-my-openagent/issues/12486))\n- Verify recursive removal (sync and async) actually removed its path, retry bounded silent leftovers, and join sweep-test removers before deleting their fixture parents. ([#11834](https://github.com/code-yeongyu/oh-my-openagent/pull/11834))\n\n### Added\n\n- Windows releases now carry `omo-git-job-helper.exe`, a small native helper that runs each memory git command inside its own kill-on-close job object, so a later writer can prove that a killed writer's git is gone before it reclaims a stranded lock. Nothing uses the helper yet: memory-core keeps today's Windows behavior until a follow-up wires it in, and no release claims the new protocol until its in-flight-creation stress row has passed on Windows CI. ([#12105](https://github.com/code-yeongyu/oh-my-openagent/pull/12105), part of [#10391](https://github.com/code-yeongyu/oh-my-openagent/issues/10391)) ([#12597](https://github.com/code-yeongyu/oh-my-openagent/pull/12597))\n\n- f2f2264ab1 Merge pull request #12597 from code-yeongyu/memsync/train-memsync-5\n- 44fa71da6d Merge pull request #11834 from code-yeongyu/fix/11806-root-sweep-cleanup\n- 32ae1261db Merge remote-tracking branch 'origin/dev' into fix/11806-root-sweep-cleanup\n- 454d7abee9 Merge remote-tracking branch 'origin/dev' into memsync/train-memsync-5\n- 22ef0148e9 Merge pull request #12488 from code-yeongyu/fix/12486-thread-send-no-drain\n- 55ca0d7d7f Merge pull request #12704 from code-yeongyu/fix/memsync-claim-at-host-boot\n- cab3d22b99 Merge remote-tracking branch 'origin/dev' into fix/12486-thread-send-no-drain\n- 3a6a7bba34 Merge pull request #12632 from code-yeongyu/test/10762-begin-highbyte-nonbom\n- f218dfca2b Merge remote-tracking branch 'origin/dev' into test/10762-begin-highbyte-nonbom\n- 69bdd38afd Merge pull request #12633 from code-yeongyu/test/10762-native-default-file-drop\n- 0a55872fdb Merge pull request #12631 from code-yeongyu/fix/10762-mutation-kill-assertion\n- db007091f8 Merge remote-tracking branch 'origin/dev' into fix/memsync-claim-at-host-boot\n- e481d62384 Merge pull request #12738 from code-yeongyu/release/v5.1.63-source-state\n- 02efb0caa2 Merge remote-tracking branch 'origin/dev' into test/10762-native-default-file-drop\n- 219e68ab6b Merge remote-tracking branch 'origin/dev' into fix/10762-mutation-kill-assertion\n- e1463cfb32 Merge remote-tracking branch 'origin/dev' into test/10762-begin-highbyte-nonbom\n- 065a093a66 Merge pull request #12739 from cynkai/fix/12733-registrant-event-timestamps\n- 53f2db0137 Merge remote-tracking branch 'origin/dev' into fix/12486-thread-send-no-drain\