unt":5,"created_at":"2026-10-03T02:26:10Z","updated_at":"2026-10-03T02:26:10Z"},{"id":606976760,"node_id":"RA_kwDOQheEEc4kLbr4","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19737048,"digest":"sha256:13ccc50351ddfdad6e5aee1c34b23f3904cacaedc1a598ce0b3c183abd84e8e2","download_count":4,"created_at":"2026-10-03T02:26:10Z","updated_at":"2026-10-03T02:26:11Z"},{"id":606976762,"node_id":"RA_kwDOQheEEc4kLbr6","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4386816,"digest":"sha256:5f1657cbad994335cc48c95e7052adeeee75351a1d9f3863ad5121d9f3ea28a3","download_count":7,"created_at":"2026-10-03T02:26:10Z","updated_at":"2026-10-03T02:26:11Z"},{"id":606976749,"node_id":"RA_kwDOQheEEc4kLbrt","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:0618dc2f8c68c80cace3e4c44ee1b8abf595bb2ea7e3b3e5e2bf2fb90a3fb7b9","download_count":6,"created_at":"2026-10-03T02:26:09Z","updated_at":"2026-10-03T02:26:09Z"}],"body":"**The desktop app can now see when computer use is waiting on a system permission, and a cancelled task on Windows no longer shows up as a crash.** This release runs on the senpi 2026.10.2 engine, which carries the upstream pi v1.0.0 changes.\n\n### Added\n\n**A computer-use permission request reaches the root session as an event.** When a computer-use action, an eval cell or a delegated task stops because the system has not granted a permission computer use needs (such as Screen Recording or Accessibility), omo emits `omo.computer.permission_required` on the root session, with that session's id, once per missing permission. The desktop app can show the request instead of a bare tool error, and other failures never turn into permission events. ([#9393](https://github.com/code-yeongyu/oh-my-openagent/pull/9393))\n\n### Changed\n\n**omo runs on senpi 2026.10.2.** Reloading or replacing a session while a monitor or an eval cell is running no longer kills the process, and the engine carries the upstream pi v1.0.0 changes. Full list: [senpi 2026.10.2](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.2).\n\n### Fixed\n\n**On Windows, a cancelled delegated task is recorded as cancelled, not as a crash.** A killed task child could be recorded as an error carrying Bun's child-reaper message when enough of those messages filled the end of its error output; it now counts as killed, while any real error output still marks a crash. ([#9443](https://github.com/code-yeongyu/oh-my-openagent/pull/9443))\n\n**A platform package is published only if its release binary passed the smoke.** The platform publish uploaded its npm package before the release-binary smoke ran, so a platform whose smoke failed still published its package (5.1.8 published both Windows x64 packages from a run whose smoke failed). The package is now uploaded only after that platform's smoke passes, so a failed smoke stops exactly that platform's publish while the others still publish, and the linux-arm64 smokes now finish before their packages publish. ([#9385](https://github.com/code-yeongyu/oh-my-openagent/issues/9385), [#9439](https://github.com/code-yeongyu/oh-my-openagent/pull/9439))\n\n- 867752cba Merge pull request #9457 from code-yeongyu/release/v5.1.12-source-state\n- 924567ca3 Merge pull request #9456 from code-yeongyu/docs/changelog-5.1.12-9439-link\n- 279bb612d docs(changelog): link #9385 and #9439 on the platform-publish line\n- 1d06901b6 Merge pull request #9417 from code-yeongyu/fix/omob-source-siblings\n- 5e911a797 docs(omob): describe the external dependency guard as rejecting differing specs\n- 33ca7a0d5 fix(omob): build the engine with its own source siblings\n- 1ad36bf98 Merge pull request #9393 from code-yeongyu/fix/computer-permission-event-relay\n- 567de3bf3 docs(changelog): drop diff3 conflict markers from the rebase union\n- 03513cad9 fix(computer-use): relay permission events from child-process children and re-prompt after revocation\n- 47c30fbe3 fix(computer-use): make the permission latch owner-controlled\n- 86bdd5e0f fix(computer-use): retain permission latches across reload\n- 4d12e4f70 fix(computer-use): keep permission delivery independent of journal writes\n- 9a047f4b8 test(computer-use): keep permission fixtures faithful to runtime seams\n- b1f29224b fix(computer-use): reject nullable permission details\n- 2e2f64b18 fix(computer-use): relay permission events to the root session\n- f7eb995ea Merge pull request #9395 from code-yeongyu/dfa/57b-task-state\n- 1e9a3b75e fix(task): keep adopted legacy stores and non-directory roots\n- c3669fbbf fix(task): ignore empty legacy state scaffolding\n- f7005945b Merge pull request #9387 from code-yeongyu/fix/9228-wrapped-reaper-advisory\n- e4e76fb53 Merge pull request #9443 from code-yeongyu/fix/win32-reaper-advisory-tail\n- 228e9430a Merge pull request #9439 from code-yeongyu/ci/omo-native-gate-publish-on-smoke\n- 923fb5813 docs(omo-native): describe the behavioural publish-gate test in the dev log\n- 6bbc1e5b7 test(omo-native): exercise the publish gate's own steps instead of the workflow text\n- c0cbc880a ci(omo-native): gate platform publish on the arm64 eval smokes\n\n```bash\nbun add -g omo-ai\n```\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
