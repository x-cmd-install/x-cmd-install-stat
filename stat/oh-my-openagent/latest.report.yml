","download_count":43,"created_at":"2026-10-25T15:23:56Z","updated_at":"2026-10-25T15:23:57Z"},{"id":675375726,"node_id":"RA_kwDOQheEEc4oQWpu","name":"senpi-desktop-engine-linux-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18668752,"digest":"sha256:5fcad86233a3355f42ec9dc73165a62adf96299e563c7ca6abc52fbcb1ad62c9","download_count":39,"created_at":"2026-10-25T15:23:57Z","updated_at":"2026-10-25T15:23:58Z"},{"id":675375727,"node_id":"RA_kwDOQheEEc4oQWpv","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20598616,"digest":"sha256:2a0c2a00e0f7121d0453fe292c98b56bbf30aa11754524772a37e2a97ee14c78","download_count":71,"created_at":"2026-10-25T15:23:57Z","updated_at":"2026-10-25T15:23:58Z"},{"id":675375741,"node_id":"RA_kwDOQheEEc4oQWp9","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4308992,"digest":"sha256:95619797c0f147461f18f96377ed7d4b0221a23b0ee78b607233d1e9ccc502f0","download_count":27,"created_at":"2026-10-25T15:23:57Z","updated_at":"2026-10-25T15:23:58Z"},{"id":675375770,"node_id":"RA_kwDOQheEEc4oQWqa","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5093376,"digest":"sha256:85ce0c0877d2c9cdb9198ead10e5c4edfd29706c8cba6869cfb127d3fd419d5f","download_count":82,"created_at":"2026-10-25T15:23:58Z","updated_at":"2026-10-25T15:23:59Z"},{"id":675375683,"node_id":"RA_kwDOQheEEc4oQWpD","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:10ae8eeeca3c16b27d2e24059b59ad1771236bfed805e294f17fdca2499d3456","download_count":181,"created_at":"2026-10-25T15:23:56Z","updated_at":"2026-10-25T15:23:56Z"}],"body":"**OmO Native stops waiting on a stalled turn-end subscriber after two seconds.** Memory recovery remains retryable without treating the cancelled wait as a failed reflection run, and stall diagnostics identify the component and hook instead of only `omo.js`. Thanks to @floweredao for the report. ([#11254](https://github.com/code-yeongyu/oh-my-openagent/pull/11254), Part of [#11249](https://github.com/code-yeongyu/oh-my-openagent/issues/11249)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n**Warm memory prompts avoid repeated git processes for HEAD and agreements.** Committed agreement reads are cached by repository and full revision, and cache misses inspect only the ledger path. Standard file-backed HEADs resolve from stat-validated Git files, including packed refs and linked worktrees, with git fallback for unusual layouts. ([#11216](https://github.com/code-yeongyu/oh-my-openagent/pull/11216), part of [#10707](https://github.com/code-yeongyu/oh-my-openagent/issues/10707)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n**Unchanged memory notices no longer yield a warm prompt to cold recall.** Soul and agreement notices read their small atomic watermarks directly and skip lock acquisition only when valid state confirms nothing needs announcing or updating. Missing, malformed, or unreadable state is rechecked under the identity lock. Writers publish through unique, exclusively created temporary files, flush them before rename, and sync the directory where supported. ([#11215](https://github.com/code-yeongyu/oh-my-openagent/pull/11215), part of [#10707](https://github.com/code-yeongyu/oh-my-openagent/issues/10707)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n**Memory notices survive a directory-sync failure after publication.** Soul and agreement watermarks still flush before atomic rename and attempt directory sync, but a sync error after publication is logged without discarding that turn's announcement. Failed writes clean up their temporary files, repeated agreement ids use set comparison, and HEAD reads defer to git for worktree configuration. ([#11234](https://github.com/code-yeongyu/oh-my-openagent/pull/11234), part of [#10707](https://github.com/code-yeongyu/oh-my-openagent/issues/10707)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n**Nested in-process tasks retain their original session tree.** A child's own tasks now record the tree root and increasing depth, so nested delegation obeys `max_depth` instead of restarting at depth 1. The root session's own view now also covers its nested in-process descendants: the footer, `/tasks`, the default `task_output` list, and `task_send` and cancel. Process-mode descendants already appeared there. ([#11226](https://github.com/code-yeongyu/oh-my-openagent/pull/11226)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n**Nested team members retain the original session tree.** A child session leading a team now gives each member its own session as parent and the original tree root, with depth increasing from the lead. Persisted member ancestry is preserved when rebuilding a respawn. ([#11229](https://github.com/code-yeongyu/oh-my-openagent/pull/11229)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n**The engine moves to senpi 2026.10.25-2: resuming a session interrupted mid-run no longer crashes, startup with many skills is fast again, long sessions keep their prompt cache when the context-budget reminder appears, and the per-request engine turn limit is off by default ([#11240](https://github.com/code-yeongyu/oh-my-openagent/pull/11240)).** With 748 skills, startup drops from 83.2 s to 1.4 s, fixing the slow start since 5.1.45 ([#11245](https://github.com/code-yeongyu/oh-my-openagent/issues/11245)). In a long session that crossed the reminder at about 714k tokens of context, the request now writes 44k cache tokens instead of 758k. `engineTurns.maxPerUserInput` turns the turn limit back on; the 6-hour turn runtime cap still applies. Compaction finds a shorter safe tail when the summary would not fit. Kimi Code serves Kimi K3.1 Pro. A session that restarts or clears its queue no longer receives another session's queued messages twice. Claude subscription sessions run their SDK children in the session's project folder, so home-level Claude Code memory and settings no longer load into every session. MCP forms cancel instead of submitting empty answers when dismissed. Claude Code auto memory is never injected into Anthropic subscription sessions.\n\n**A ulw-research run cannot produce a reader-facing artifact against an undecided brief.** The deliverable interview now also records a `## Fidelity` block, and the new `scripts/fidelity-policy.mjs` registry turns it into the rules the CLI enforces: `fact fill`, `fact verify`, `fact pairs`, `fact meaning-check`, `fact polish-apply` and `fact polish-diff` refuse an unlocked brief with one `fidelity_interview_incomplete` defect and write nothing, each reading `--brief` (default `$SESSION_DIR/brief.md`), while collection keeps running; `fact fill` then refuses a derived row under `derived numbers: none`, evaluates the source floor live against each source's `meta.json`, binds a translation to its quote only under `languages ... with translation beside`, and omits a twice-failed sentence under `fallback: omit`. Off-table `derived numbers` or `fallback` values are usage errors instead of silently allowing; under any floor but `standard` a row with no source is refused; and the fill map records the brief's hash, so `fact verify` refuses an edition filled under a different brief (`brief_changed`) and re-checks every value against the current one. ([#11166](https://github.com/code-yeongyu/oh-my-openagent/pull/11166), closes [#11009](https://github.com/code-yeongyu/oh-my-openagent/issues/11009))\n\n### Fixed\n\n- Remove automatic `process_crashed` telemetry that used ordinary usage settings without separate crash consent. Starting a session no longer harvests operational crash records; manual `/bug` reports remain separate. ([#11258](https://github.com/code-yeongyu/oh-my-openagent/pull/11258)) ([#11280](https://github.com/code-yeongyu/oh-my-openagent/pull/11280))\n\n- 75401cb5e7 Merge pull request #11166 from code-yeongyu/feat/11009-t19\n- 40fe813022 Merge pull request #11280 from code-yeongyu/batch/memsync-coord-13\n- 91e090ed53 chore(batch-13): canonical regen after the 5.1.47 release-state merge (pair a8428de970afabaa)\n- d8dd7c2d44 Merge remote-tracking branch 'origin/dev' into b13\n- 08e9a95c08 Merge pull request #11282 from code-yeongyu/release/v5.1.47-source-state\n- 68d424111e Merge remote-tracking branch 'origin/dev' into feat/11009-t19\n- 3e6ad34828 chore(batch-13): canonical regen on the merge result (pair 1c36c222100a40df)\n- eff07352ab docs(changes): name the batch fragment after the batch PR (#11280)\n- 95640d0cec fix(ulw-research): fail closed on brief values, judge sourceless rows, and bind the brief into the fill map (Part of #11009)\n- c98c444128 docs(changes): #11254's entry into the batch fragment\n- 65cdd58ae8 Merge #11254 (fbf6544030) into batch #13\n- 4924ad7d84 Merge remote-tracking branch 'origin/dev' into feat/11009-t19\n- 