,"download_count":27,"created_at":"2026-10-13T16:40:56Z","updated_at":"2026-10-13T16:40:56Z"},{"id":637628994,"node_id":"RA_kwDOQheEEc4mAXJC","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20197664,"digest":"sha256:73c6f0ed5825a379e818ee6ae9cd7ff79bc5accd60c38f6251cf78bd0b4023af","download_count":45,"created_at":"2026-10-13T16:40:56Z","updated_at":"2026-10-13T16:40:57Z"},{"id":637629016,"node_id":"RA_kwDOQheEEc4mAXJY","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4731904,"digest":"sha256:519ac74504a02fc3ac5c8483d87a8ad13481f50a2cadf5640180f566c2755ad3","download_count":69,"created_at":"2026-10-13T16:40:57Z","updated_at":"2026-10-13T16:40:57Z"},{"id":637628951,"node_id":"RA_kwDOQheEEc4mAXIX","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:4bb710898de5fd3436d97900d631fcba1e2ffa472857f7c0e620feb195119020","download_count":87,"created_at":"2026-10-13T16:40:55Z","updated_at":"2026-10-13T16:40:56Z"}],"body":"**omo runs on senpi 2026.10.13: a busy host gives memory back when its sessions end.** An RPC host serving many sessions used to keep the heap of every session it had run until it exited, so a long day of terminal-heavy work held its peak footprint; it now returns freed heap as sessions drop ([senpi#3240](https://github.com/code-yeongyu/senpi/pull/3240), [senpi#3221](https://github.com/code-yeongyu/senpi/pull/3221)). Tool calls through DeepSeek's official API, and gateways that forward to it, stop failing with `400 Invalid schema ... got 'type: null'`, because every tool schema now declares a root `type: \"object\"` ([senpi#3250](https://github.com/code-yeongyu/senpi/pull/3250)). The Claude subscription lane runs Claude Code 2.1.296 ([senpi#3258](https://github.com/code-yeongyu/senpi/pull/3258)), the model catalog is refreshed from the live providers ([senpi#3248](https://github.com/code-yeongyu/senpi/pull/3248)), large eval data cells no longer stall the shared host ([senpi#3206](https://github.com/code-yeongyu/senpi/pull/3206)), and RPC clients see a scheduled goal continuation and can run it now ([senpi#3208](https://github.com/code-yeongyu/senpi/pull/3208)). Full notes: [senpi 2026.10.13](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.13).\n\n**Daemon-hosted background tasks keep running when their parent exits or starts a new session.** The parent detaches without aborting their turns. On `/new` or exit, one notice names the old session and the `omo --resume` command to collect results; children stay owned by that session. Local in-process and stdio children retain their shutdown behavior. ([#8517](https://github.com/code-yeongyu/oh-my-openagent/issues/8517), [#10018](https://github.com/code-yeongyu/oh-my-openagent/issues/10018))\n\n**A child that stops answering no longer hangs a task indefinitely.** Stdio RPC requests have deadlines, and both process runners keep one heartbeat in flight. Three missed ten-second probes end a running child as `child-unresponsive`, preserve its transcript, and name how to inspect and rerun it in `task_output`. The last successful heartbeat appears as `last_seen_at` in the live task snapshot. ([#10017](https://github.com/code-yeongyu/oh-my-openagent/issues/10017))\n\n**Resuming a background task no longer waits for a free slot.** When its concurrency group is full, resuming a finished background task now returns at once as pending and sends the follow-up when a slot frees, instead of blocking the call. A second resume of the same task while one is queued is refused, cancelling a queued resume releases nothing it didn't hold, and a fallback retry keeps the latest follow-up prompt. Thanks to @imadal1n. ([#9985](https://github.com/code-yeongyu/oh-my-openagent/pull/9985))\n\n**A task child started as its own process never receives its fallback chain after its first prompt.** When the engine answered the capability check only after the chain deadline, the runner still sent `set_retry_fallback` once the first prompt was already out; it now drops the chain at the deadline, and the child keeps the manager's fallback with the usual \"no answer\" warning. This was the intermittent windows-latest test failure. ([#9582](https://github.com/code-yeongyu/oh-my-openagent/issues/9582), [#10087](https://github.com/code-yeongyu/oh-my-openagent/pull/10087))\n\n**ulw-execute stops a checkpoint that keeps failing instead of retrying it for days.** After the same failure twice in a row, a third failed attempt, or four hours open, the checkpoint and every checkpoint that depends on it are marked blocked (`[~]`) with the gap left, recorded in the ledger and the final report, and the run moves on to the rest of the plan. A broken test harness gets one repair attempt, and work found while a checkpoint is open is queued after it unless it blocks that checkpoint. ([#10051](https://github.com/code-yeongyu/oh-my-openagent/issues/10051))\n\n**Mass research plans its whole collection before it starts instead of one wave at a time.** `mass ulw research` now defines every angle as a harvest, expand and verify chain that passes its findings to the next step through a file, so a fast angle reaches verification while slow ones are still harvesting, and leads that are still open join each cluster of angles as soon as that cluster settles. The mass-ulw and ulw-execute skills n