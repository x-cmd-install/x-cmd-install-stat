755264,"digest":"sha256:1cfcd93569e3418124076aee70a6dc111b18a3fa4feca3c60f2dab65b3e81b39","download_count":50,"created_at":"2026-11-24T02:40:10Z","updated_at":"2026-11-24T02:40:11Z"},{"id":785417333,"node_id":"RA_kwDOQheEEc4u0IR1","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5264896,"digest":"sha256:22dd2b4fe45b84db9ceae98bd2fb3bdca02c4866ec806d5011f7c99805d4db60","download_count":29,"created_at":"2026-11-24T02:40:11Z","updated_at":"2026-11-24T02:40:12Z"},{"id":785417348,"node_id":"RA_kwDOQheEEc4u0ISE","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6276608,"digest":"sha256:899ee03fc023190fb85798e5d40c78e903681d9b6542dacbce2e51b39e92da5a","download_count":62,"created_at":"2026-11-24T02:40:11Z","updated_at":"2026-11-24T02:40:12Z"},{"id":785417243,"node_id":"RA_kwDOQheEEc4u0IQb","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1232,"digest":"sha256:a64ae80b35034512cb8d9b60c1eacfa66ff568df8012e51a0bef57d24b969890","download_count":136,"created_at":"2026-11-24T02:40:09Z","updated_at":"2026-11-24T02:40:09Z"}],"body":"### Fixed\n\n- A project on TypeScript 7 or later gets TypeScript diagnostics after an edit through its own `tsc --lsp --stdio`, with nothing else installed. The compiler is taken from the edited file's project, so a monorepo package on TypeScript 7 is served by its own `tsc` even when the session starts at the repository root, while a sibling package on an older TypeScript keeps typescript-language-server. A diagnostics scan of a whole directory sends each file to its own project's server, so a scan at the repository root covers both kinds of package, and a package whose server is slow to start no longer holds up the others, nor does giving up on it stop a server another request is still waiting for. A file is judged by where it really lives: a symlink inside the session never lends it another project's compiler, and a `bin/tsc` belonging to another kind of project, or a `node_modules/.bin/tsc` left behind without its `typescript` package, never hides the TypeScript installed for the package. A `typescript` command you configured is never replaced. A project on an older TypeScript, or none, still resolves typescript-language-server exactly as before. ([#14656](https://github.com/code-yeongyu/oh-my-openagent/pull/14656))\n\n### Changed\n\n- Ultrawork: verifying a UI deliverable asks for a play-through, a script that walks the product to several places or states and screenshots each, re-run after each feature. The default directive's existing verification sentences are rewritten in place and it is 6 bytes shorter. ([#14654](https://github.com/code-yeongyu/oh-my-openagent/pull/14654))\n\n- 1cfa727787 Merge pull request #14853 from code-yeongyu/fix/13986-remote-send-windows\n- 95cbf08c0c Merge pull request #14656 from code-yeongyu/fix/14642-tsc-native-lsp\n- a0a58c156c test(native): keep the store worker from source; end each case with the send and clean up after it (#13986)\n- 4b68bab3c4 test(native): remote send exactly-once cases load the shipped store worker and end with the send (#13986)\n- 1fce963c5b Merge dev 3836f44bfd into fix/14642-tsc-native-lsp\n- 3836f44bfd Merge pull request #14848 from code-yeongyu/release/v5.1.82-land-stamp\n- 55d509eead Merge release: v5.1.82 stamp (#14845) into dev\n- 872bf3fd2b Merge pull request #14780 from code-yeongyu/fix/build-extension-cold-build-progress\n- fde98aaf7a Merge pull request #14654 from code-yeongyu/fix/14643-ulw-ui-playthrough\n- b71f279b76 Merge dev 615362696c into fix/build-extension-cold-build-progress\n- 615362696c Merge pull request #14843 from code-yeongyu/fix/14842-v14-backlog-baseline\n- 1147dca196 Merge dev 154679e986 into fix/14643-ulw-ui-playthrough\n- 713d705656 test(thread): take the v14 case's backlog baseline after the start delivery is written (#14842)\n- 2955f01f9f chore(knip): export-check the new process-tree CPU reader (#13965)\n- c26eaf68a9 test(build-extension): exit-kill case is POSIX-only; tree-gone checks ignore zombies; trip waits for the leader (#13965)\n- 7752e500ff test(build-extension): win32 is an explicit unmeasurable outcome; trip kill falls back (#13965)\n- 35f23e2a80 test(build-extension): portable bounded-build cases, a kill that throws rejects, bound per runner (#13965)\n- caf0705abc test(build-extension): bound cold builds with the shared tree watcher on every platform (#13965)\n- c914af016c Merge dev b742b12f8e into fix/build-extension-cold-build-progress\n- 52362cc894 Merge dev 2c4033078c into fix/14643-ulw-ui-playthrough\n- d9851a3529 Merge branch 'dev' into fix/14643-ulw-ui-playthrough\n- a2a2017657 Merge remote-tracking branch 'origin/dev' into fix/build-extension-cold-build-progress\n- 92d4c87f65 Merge remote-tracking branch 'origin/dev' into fix/14643-ulw-ui-playthrough\n- 41ab8b17ff Merge branch 'dev' into fix/14643-ulw-ui-playthrough\n- d1571b9048 Merge branch 'dev' into fix/14642-tsc-native-lsp\n- 002393d99c fix(lsp-core): keep two manager test helpers file-local\n- 9b377baa8c fix(lsp-core): turn an acquisition into a reference without a gap\n- e1ebcc449c fix(lsp-core): let a timed-out waiter detach from a shared start and pass over a stale tsc shim\n- ece0df4f2f fix(lsp-core): scope directory scan clients to each group and take tsc only from node_modules/.bin\n- 78f69f4bad fix(lsp-core): judge the TypeScript server by real location and per file in directory scans\n- 03a73ed9de fix(lsp-core): key resident LSP clients by resolved command\n- 8aca434b9f fix(lsp-core): take native tsc from the edited file's project and keep configured commands\n- 28719216fb docs(changes): fragment for #14656\n- b1c752c209 docs(changes): fragment for #14654\n- 4ca98913ae fix(ultrawork): UI verification asks for a play-through of the product\n- f05081f053 fix(lsp-core): serve a TypeScript 7 project through its own tsc --lsp\n\n```bash\nbun add -g omo-ai\n```\n","reactions":{"total_count":3,"+1":2,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":1,"eyes":0}}
