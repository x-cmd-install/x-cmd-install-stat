unt":11,"created_at":"2026-10-13T00:15:48Z","updated_at":"2026-10-13T00:15:49Z"},{"id":635369598,"node_id":"RA_kwDOQheEEc4l3vh-","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20197664,"digest":"sha256:73c6f0ed5825a379e818ee6ae9cd7ff79bc5accd60c38f6251cf78bd0b4023af","download_count":9,"created_at":"2026-10-13T00:15:49Z","updated_at":"2026-10-13T00:15:50Z"},{"id":635369634,"node_id":"RA_kwDOQheEEc4l3vii","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4731904,"digest":"sha256:758cb672e3abe43b68f776a8ff02c35ac378de89c5c1332c17b6f57b4e83f61c","download_count":18,"created_at":"2026-10-13T00:15:50Z","updated_at":"2026-10-13T00:15:50Z"},{"id":635369559,"node_id":"RA_kwDOQheEEc4l3vhX","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:0a30145c43a0323ec6ba2b02e82da4cf3cf4884ab6c77ba5dbbbb05730f58430","download_count":29,"created_at":"2026-10-13T00:15:48Z","updated_at":"2026-10-13T00:15:48Z"}],"body":"**5.1.32 is the release that 5.1.31 was meant to be: 5.1.31 never reached npm.** Two checks in the release pipeline stopped it before any package was published, one on the macOS Intel desktop engine and one on the Linux musl builds. omo itself did not change between the two, so every entry below is new to anyone upgrading from 5.1.30. The notarization check now waits for Apple's ticket to reach Gatekeeper, and the musl smoke no longer reports an exited host supervisor as a leak. ([#10081](https://github.com/code-yeongyu/oh-my-openagent/pull/10081), [#10082](https://github.com/code-yeongyu/oh-my-openagent/pull/10082))\n\n**omo runs on senpi 2026.10.12, and long sessions stop growing with every shell command.** A finished bash session used to keep its whole headless terminal screen (10,000 lines of scrollback plus replay history, about 20 MB for a 4,000-line output) until the 32-session limit evicted it, so a busy session or task host grew by that much per command; it now keeps only its final visible screen and its bounded output, and a live terminal's replay history is stored as flat strings instead of about 31 bytes per character. After an accepted compaction, prompts, retries and resumes use the compacted context, so a session that fits is no longer refused with \"Context remains above the compaction threshold\" or compacted twice. When one provider account runs out of quota, its other models are skipped, compaction runs on a model that can still answer, and the error names the provider, the reset time and the `/model` way out instead of raw 429 JSON. ChatGPT-subscription GPT-6.1 Sol, Fast and Ultrafast get a 500,000-token context window. Web search uses the active model's own server-side search first on routes where it was tested live, and falls back once to the standalone search if that fails. Prompt-cache prewarm is now opt-in (`promptCache.keepAlive.enabled`) and starts only on your first edit, never on session start or resume. RPC clients gain `eval_cells.list`/`peek`/`stop`, and a shared host that is shutting down refuses new sessions with `host_stopping` instead of adopting them. Thanks to @MoerAI and @Bearmancer. ([senpi#3171](https://github.com/code-yeongyu/senpi/issues/3171), [senpi#3170](https://github.com/code-yeongyu/senpi/issues/3170), [senpi#3137](https://github.com/code-yeongyu/senpi/issues/3137), [senpi#3062](https://github.com/code-yeongyu/senpi/issues/3062), [senpi#3131](https://github.com/code-yeongyu/senpi/issues/3131), [senpi#3150](https://github.com/code-yeongyu/senpi/issues/3150), [senpi#3122](https://github.com/code-yeongyu/senpi/issues/3122), [senpi#3140](https://github.com/code-yeongyu/senpi/issues/3140), [senpi#3072](https://github.com/code-yeongyu/senpi/issues/3072), [senpi#3059](https://github.com/code-yeongyu/senpi/issues/3059), [senpi#3101](https://github.com/code-yeongyu/senpi/issues/3101), [senpi#3055](https://github.com/code-yeongyu/senpi/pull/3055)) ([#10069](https://github.com/code-yeongyu/oh-my-openagent/pull/10069))\n\n**The Recommended model profile is gone: with no model profile set, OmO starts on Daily \u00b7 Normal.** A fresh OmO Desktop or headless session with no `model_profile` applies Daily \u00b7 Normal (Claude Opus 5.5, then Kimi K3, then GLM 5.3). If none of those is connected, it uses the first lane that is: Daily \u00b7 Heavy, Geeky \u00b7 Normal, then Geeky \u00b7 Heavy, so a ChatGPT-only setup starts on Geeky \u00b7 Normal. A config that still says `model_profile: \"recommended\"` gets the same default and one log line; it is never an error, and `omo.json` is not rewritten. A `model_profiles.recommended` you defined yourself still applies. The interactive TUI is unchanged. Requested by @code-yeongyu. ([#10029](https://github.com/code-yeongyu/oh-my-openagent/issues/10029))\n\n**Session tools find sessions kept in OpenCode's older storage, and show the real error instead of `[object Object]`.** A session that exists only in OpenCode's legacy JSON storage is listed, but the SQLite server answers `NotFoundError` for it; `session_search`, `session_list`, `session_read` and `session_info` now read such a session from the older storage instead of failing. Any other error reads as its name and message, and when `session_search` or `session_list` (without a date filter) still cannot read a session, it skips it and names it at the end instead of failing the whole call. Thanks to @crazyrabbit0 for the reproduction. ([#5854](https://github.com/code-yeongyu/oh-my-openagent/issues/5854), [#10041](https://github.com/code-yeongyu/oh-my-openagent/pull/10041))\n\n**Ultrawork tracks task-owned worktrees and runtime caches when they are created.** Cleanup guidance now scopes cache paths before task commands, requires path-specific todos and removal receipts, and preserves worktrees still needed by open PRs without wiping shared caches. Native full and compact directives, Codex, and OpenCode variants carry the same lifecycle; co-loaded workflows refer to it instead of repeating it. ([#9951](https://github.com/code-yeongyu/oh-my-openagent/issues/9951), [#9953](https://github.com/code-yeongyu/oh-my-openagent/pull/9953))\n**Computer use can list and choose menu commands on Linux.** On X11 and Wayland, `menus.items` and `menus.select` walk a window's menu bar through AT-SPI and run the chosen item's own activation action, without focusing or raising the window. The request is bound to the exact window you named, so a same-titled sibling window of the same app is refused rather than used, and ambiguous, disabled or submenu labels are refused before anything runs. Selecting a menu command also no longer crashes GTK apps on Ubuntu 22.04. ([#9651](https://github.com/code-yeongyu/oh-my-openagent/issues/9651), [#9994](https://github.com/code-yeongyu/oh-my-openagent/pull/9994))\n\n**Computer use can take a screenshot and read a window's accessibility tree in one step.** `observe()` on a window returns both together, and a failed or cancelled observation normally leaves the previous screenshot and accessibility references in place. ([#9651](https://github.com/code-yeongyu/oh-my-openagent/issues/9651))\n\n**Computer use can zoom into part of a screenshot at full detail without changing where clicks land.** `zoom(region)` on the desktop, a window or a display captures that region again at native resolution, while later clicks and typing still use the coordinates of the last full screenshot. ([#9651](https://github.com/code-yeongyu/oh-my-openagent/issues/9651))\n\n**Computer use can list and choose menu commands on Windows.** `menus.items` and `menus.select` read a window's classic menu bar directly, or its UI Automation menu when it has none, and run the chosen command without keyboard input. Elevated windows, ambiguous or disabled labels, submenus, and menus that change mid-request are refused before anything runs; apps that take focus while they act are refused in the background and work with `delivery: \"foreground\"`. ([#9651](https://github.com/code-yeongyu/oh-my-openagent/issues/9651), [#9991](https://github.com/code-yeongyu/oh-my-openagent/pull/9991))\n\n**Computer use screenshots the monitor you are working on by default, and `computer.display(id)` reaches any other one.** An unset `computer.display` now captures the active monitor, the one the focused window mostly sits on, instead of compositing every display; `\"all\"` and display ids work as before. `computer.display(\"all\" | \"active\" | id)` gives a screenshot and input handle for one display without changing the session default, and `computer.displays()` lists every monitor. ([#9651](https://github.com/code-yeongyu/oh-my-openagent/issues/9651), [#9995](https://github.com/code-yeongyu/oh-my-openagent/pull/9995))\n\n**OpenCode requests now follow the selected model's live capabilities instead of a stale model cache.** When OpenCode passes the live model to `chat.params`, its variants, thinking support, temperature support and output limit take precedence over the cached provider list, and the SDK's `provider.info.id` provider context is accepted alongside `provider.id`; calls that carry only model IDs keep the cached and bundled fallback. Thanks to @MoerAI. ([#10001](https://github.com/code-yeongyu/oh-my-openagent/pull/10001))\n\n**`background_task.taskCleanupDelayMs` now also sets how long finished background tasks stay retrievable.** A delay longer than 30 minutes is no longer cut short; leaving it unset keeps the existing timing. Thanks to @imadal1n. ([#9984](https://github.com/code-yeongyu/oh-my-openagent/pull/9984))\n\n**The MCP OAuth callback server answers errors in plain text.** Its not-found, provider-error and missing-parameter responses are now sent as `text/plain; charset=utf-8` with `X-Content-Type-Options: nosniff`, so an `error_description` in the callback URL is shown as text and never rendered as HTML. MCP sign-in currently runs through a second callback server that never echoed that text, so nothing you see changes; consolidating the two is tracked separately. Thanks to @niStee. ([#6464](https://github.com/code-yeongyu/oh-my-openagent/pull/6464), [#9979](https://github.com/code-yeongyu/oh-my-openagent/issues/9979))\n\n**OpenCode task delegation and team creation now honor `claude_code.agents: false`, so disabled Claude Code agents fail fast instead of being selected.** Thanks to @cynkai. ([#8744](https://github.com/code-yeongyu/oh-my-openagent/issues/8744), [#8802](https://github.com/code-yeongyu/oh-my-openagent/pull/8802))\n\n**Delegated OpenCode sessions show their task category in the title.** Background, synchronous and fallback-created child sessions prefix the category while keeping the description and agent suffix; tasks without a category keep their existing title. ([#6854](https://github.com/code-yeongyu/oh-my-openagent/issues/6854), [#7256](https://github.com/code-yeongyu/oh-my-openagent/pull/7256))\n\n**OpenCode runtime fallback can switch models after a provider content-filter error.** When fallback is enabled and alternate models are configured, a blocked response advances to a different model; the existing attempt limit and chain exhaustion still stop retries. ([#6796](https://github.com/code-yeongyu/oh-my-openagent/issues/6796), [#7257](https://github.com/code-yeongyu/oh-my-openagent/pull/7257))\n\n**Memory facts are extracted only after you type a prompt.** Pending facts no longer start a model call when a session starts, rebinds, resumes or forks; extraction waits for a real prompt of yours in a top-level session. It runs on `memory.facts.model`, a configured quick chain or the session's own model, and with none of those available the queue stays pending without recording a failure. ([#9922](https://github.com/code-yeongyu/oh-my-openagent/issues/9922), [#9954](https://github.com/code-yeongyu/oh-my-openagent/pull/9954))\n\n**Naming a `ulw-*` skill no longer switches on ultrawork.** `ulw-plan`, `ulw-research`, `ulw-execute` and `ulw-loop` in a prompt leave ultrawork off, while a bare `ulw` or `ultrawork` still turns it on. ([#6876](https://github.com/code-yeongyu/oh-my-openagent/issues/6876), [#7255](https://github.com/code-yeongyu/oh-my-openagent/pull/7255))\n\n**Tests now catch environment leaks at the file that causes them.** A test file that leaves `process.env` changed fails with the names of the changed keys, and the next file starts from a clean environment. Thanks to @Dante-dan. ([#9390](https://github.com/code-yeongyu/oh-my-openagent/issues/9390), [#9469](https://github.com/code-yeongyu/oh-my-openagent/pull/9469))\n\n- 269d219f7 Merge pull request #10083 from code-yeongyu/docs/changelog-5.1.32-carry-5.1.31\n- f989a4bf2 Merge pull request #10082 from code-yeongyu/fix/musl-smoke-zombie-supervisor\n- d99043c8d Merge pull request #10081 from code-yeongyu/fix/10080-gatekeeper-poll\n- 80a062af1 docs(changelog): carry the unpublished 5.1.31 notes into 5.1.32\n- 0f06814a2 fix(release): reap the musl smoke container and count a zombie supervisor as exited\n- ad2f9a35a fix(release): wait for Gatekeeper to see the notarization ticket after Accepted (#10080)\n- b5a08887f Merge pull request #10077 from code-yeongyu/release/v5.1.31-source-state\n- a59ed3691 Merge pull request #10040 from code-yeongyu/feat/unset-profile-daily\n- fdb728fe9 Merge remote-tracking branch 'origin/dev' into feat/unset-profile-daily\n- 7aaa3576a Merge pull 