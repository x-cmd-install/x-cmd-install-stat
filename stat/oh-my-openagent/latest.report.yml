5003114,"node_id":"RA_kwDOQheEEc4iRdnq","name":"omo-linux-x64-musl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":118421040,"digest":"sha256:65f7771caf83724c5ae63099ca2596a4914b3e50b67197d4f0a4df9e1ccdbc44","download_count":4,"created_at":"2026-09-19T15:31:31Z","updated_at":"2026-09-19T15:31:35Z"},{"id":575003119,"node_id":"RA_kwDOQheEEc4iRdnv","name":"omo-linux-x64-musl-baseline","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":118421040,"digest":"sha256:88d5529e69b7098d9b0d49ec0951f693a423801128d8d727f939ffdca00f784e","download_count":3,"created_at":"2026-09-19T15:31:31Z","updated_at":"2026-09-19T15:31:35Z"},{"id":575003123,"node_id":"RA_kwDOQheEEc4iRdnz","name":"omo-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":120736256,"digest":"sha256:2f16084d76a4678ec6d919237cd22e10800a39eab12a8cf2f23429e86026ce6a","download_count":4,"created_at":"2026-09-19T15:31:32Z","updated_at":"2026-09-19T15:31:34Z"},{"id":575003166,"node_id":"RA_kwDOQheEEc4iRdoe","name":"omo-windows-x64-baseline.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129244160,"digest":"sha256:dfa83a7055062578814df5780a2bec1efea6bdf0fd171c12367d9d40428171fb","download_count":4,"created_at":"2026-09-19T15:31:34Z","updated_at":"2026-09-19T15:31:37Z"},{"id":575003176,"node_id":"RA_kwDOQheEEc4iRdoo","name":"omo-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":129244160,"digest":"sha256:9d54f9bebc730460e5ecd682ea77d5e0bad5f2187c7d3ff4d6eca6a3b2c89451","download_count":10,"created_at":"2026-09-19T15:31:34Z","updated_at":"2026-09-19T15:31:38Z"},{"id":575003197,"node_id":"RA_kwDOQheEEc4iRdo9","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:0967c454bb13e16827d108161a51bf50db57857e56c4530e373c90ebeeaeb2a7","download_count":4,"created_at":"2026-09-19T15:31:35Z","updated_at":"2026-09-19T15:31:35Z"}],"body":"### Fixed\n\n**Task children can use providers installed through configured packages.** Process-mode children\nnow inherit the package extensions actually loaded by the parent, so providers such as glm-zcode\nand commandcode are available when a task resolves its model. Every child-launch path resolves the\nsame list, so a revived child keeps the provider it started with, and team members and pool workers\nget it too instead of only a first spawn. ([#8492](https://github.com/code-yeongyu/oh-my-openagent/issues/8492))\n\n**A task that cannot serve its model now says so.** A `task({ category })` spawn whose model was missing from the child's own profile died with `Task runner failed to start.` and nothing else. The admission probe knew the real reason and said it plainly, but the manager mapped only four failure kinds to a message and `model_unavailable` was not one of them, so the useful half never reached the caller. The reason now travels as a closed set of parent-authored codes rather than as text, which is what makes it safe to show: the child's stderr stays out of every record and tool result, and the caller gets a sentence that names the cause. ([#8492](https://github.com/code-yeongyu/oh-my-openagent/issues/8492))\n\n**A category with four spare models stops giving up on the first one.** A category resolves to a chain, but only the leading entry was ever attempted. When admission refused it, the spawn failed outright and the remaining entries were never tried, even when the next one was a built-in provider that would have worked. In a graph run that also skip-cascaded every dependent node. A refusal that means \"this child cannot serve this model\" now walks to the next entry in the chain; every other kind of start failure still fails immediately, because it would repeat identically on the rest of the chain. ([#8492](https://github.com/code-yeongyu/oh-my-openagent/issues/8492))\n\n- dc0881e8c Merge pull request #8503 from code-yeongyu/release/v5.0.0-beta.79-source-state\n- c51aa837d Merge pull request #8497 from DevNewbie1826/fix/task-child-package-providers\n- 28914a943 Merge remote-tracking branch 'origin/dev' into pr8497-work\n- 5100d2124 Merge pull request #8500 from code-yeongyu/fix/8492-start-failure-fallback\n- 5272f544e chore(changelog): record the start-failure cause and chain fallback\n- c43a34195 Merge pull request #8493 from code-yeongyu/fix/task-host-e2e-fixture-drift\n\n```bash\nnpm i -g omo-ai@beta\n```\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
