_at":"2026-10-11T14:46:35Z"},{"id":630992322,"node_id":"RA_kwDOQheEEc4lnC3C","name":"omo-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":147686912,"digest":"sha256:cd0a5005139e2fce2c5ab9e52d72f83a56cf031b85caa566e20838fe56551def","download_count":48,"created_at":"2026-10-11T14:46:27Z","updated_at":"2026-10-11T14:46:34Z"},{"id":630992390,"node_id":"RA_kwDOQheEEc4lnC4G","name":"senpi-desktop-engine-checksums.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":396,"digest":"sha256:dd373b7a3f43c280e1b4dc8249584497546f08448f3e7c456025dfde042f00bf","download_count":56,"created_at":"2026-10-11T14:46:28Z","updated_at":"2026-10-11T14:46:28Z"},{"id":630992340,"node_id":"RA_kwDOQheEEc4lnC3U","name":"senpi-desktop-engine-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5576432,"digest":"sha256:4d3181974f04e5d66b147f5e124de486680d8dc7a8fb5329baeac39ce74c0133","download_count":32,"created_at":"2026-10-11T14:46:27Z","updated_at":"2026-10-11T14:46:28Z"},{"id":630992346,"node_id":"RA_kwDOQheEEc4lnC3a","name":"senpi-desktop-engine-darwin-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5760576,"digest":"sha256:62e434f399e709e79ad1fde95ac02e9b3cf6baf29528876b75346eed50206da1","download_count":12,"created_at":"2026-10-11T14:46:27Z","updated_at":"2026-10-11T14:46:28Z"},{"id":630992360,"node_id":"RA_kwDOQheEEc4lnC3o","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19966800,"digest":"sha256:1944878397f04dca7e57cdf8ca21b1a5678209afffdf3ebb87709f66732b9564","download_count":25,"created_at":"2026-10-11T14:46:27Z","updated_at":"2026-10-11T14:46:29Z"},{"id":630992386,"node_id":"RA_kwDOQheEEc4lnC4C","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4511232,"digest":"sha256:4c28c107d394247359f339862f30d4172999e24255cf53c27c555c1abaaa4992","download_count":24,"created_at":"2026-10-11T14:46:28Z","updated_at":"2026-10-11T14:46:29Z"},{"id":630992319,"node_id":"RA_kwDOQheEEc4lnC2_","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:6fb827359003b44e30971535d2fdf75bade8a2431c3b2ffa295bfd8fbc6b3064","download_count":25,"created_at":"2026-10-11T14:46:27Z","updated_at":"2026-10-11T14:46:27Z"}],"body":"**`ulw-research` reads sources in your own browser instead of fetching them.** The Phase 0 brief now decides `Collection: search-only | browser` by one rule (search-only only when a result snippet settles every axis), and the web workers read every candidate through the `browser` skill's attached engine: one named session per worker, one tab per source, several tabs side by side while comparing, with a full-page screenshot per top source. `webfetch` is reserved for raw files, hosts the browser cannot open go to `ultimate-browsing` with their provenance, and a team member's brief names the `browser` skill to read since members cannot carry `load_skills`. `ultimate-browsing` no longer presents itself as the research browsing lane, and the `browser` skill no longer sends plain page reading elsewhere. ([#9958](https://github.com/code-yeongyu/oh-my-openagent/issues/9958), [#9959](https://github.com/code-yeongyu/oh-my-openagent/pull/9959))\n\n**Your first real prompt starts onboarding, not opening a session.** First-run context now rides along with the first prompt you actually send, without a separate model turn. The agent answers your request first, then offers the tour. Background, preview and headless sessions no longer use up onboarding, the TUI shows a static welcome until you ask something, and a failed or aborted first turn frees onboarding to try again. `--onboard` still starts the tour right away in the TUI, and in RPC it applies to the first real prompt. ([#9905](https://github.com/code-yeongyu/oh-my-openagent/issues/9905), [#9907](https://github.com/code-yeongyu/oh-my-openagent/pull/9907))\n\n**Custom category models keep their own reasoning settings when background work starts or resumes.** A category with a model override or a `models` chain no longer inherits the builtin category's variant. Reasoning is resolved against the model actually selected before dispatch, with `reasoning` taking precedence over `reasoningEffort` and the legacy `variant`, and a resumed task keeps that model's generation settings. Builtin categories keep their existing defaults. Thanks to @MoerAI, @willowite and @pointfish6660. ([#8510](https://github.com/code-yeongyu/oh-my-openagent/issues/8510), [#9013](https://github.com/code-yeongyu/oh-my-openagent/pull/9013))\n\n**Groundwork for OmO accounts: `omo login`, `omo whoami` and `omo logout` ship ahead of the account service, which hasn't launched yet.** Until it does, `omo login` checks the service first and stops at once with a one-line error naming the service address, instead of opening a browser or waiting, and `omo whoami` reports that you aren't signed in. When the service launches, sign-in will use a browser flow or a headless device-code flow (`--device` or `--no-browser`), keep credentials and device keys only in the operating system's credential store (Keychain on macOS, Secret Service on Linux, Credential Manager on Windows) with no plaintext fallback, and keep a sign-in through connection and browser-launch failures. ([#9829](https://github.com/code-yeongyu/oh-my-openagent/issues/9829), [#9811](https://github.com/code-yeongyu/oh-my-openagent/issues/9811), [#9831](https://github.com/code-yeongyu/oh-my-openagent/pull/9831), [#9833](https://github.com/code-yeongyu/oh-my-openagent/pull/9833))\n\n**A child stopped during parent teardown no longer briefly reports a failure of its own.** An unexpected exit is now held for a two-second confirmation window. If the owning manager survives, a genuine failure is reported; if the owner exits first, recovery records the interrupted work as `lost` without replaying it. Recovery also revisits children it had deferred to another live owner once that owner has exited, so those records no longer stay stranded. ([#9715](https://github.com/code-yeongyu/oh-my-openagent/issues/9715), [#9884](https://github.com/code-yeongyu/oh-my-openagent/pull/9884))\n\n**One `task` call can submit more than 16 child tasks.** The per-call batch cap is gone from both validation and execution. Global, provider and model concurrency limits still decide how many children run at once; the rest queue and start as slots free up. Synchronous batch results still come back in input order. ([#9854](https://github.com/code-yeongyu/oh-my-openagent/issues/9854), [#9859](https://github.com/code-yeongyu/oh-my-openagent/pull/9859))\n\n**`unspecified-low` uses GPT-6.1 Sol at medium reasoning on the OpenAI lanes.** The default chain adds `gpt-6.1-sol` for OpenAI API and ChatGPT Subscription ahead of the older GPT fallback. GPT-5.6 Terra is replaced by GPT-5.6 Sol at medium reasoning, which keeps a supported fallback for GitHub Copilot, OpenCode and catalogs without 6.1 Sol. Other categories keep their defaults. ([#9844](https://github.com/code-yeongyu/oh-my-openagent/issues/9844), [#9845](https://github.com/code-yeongyu/oh-my-openagent/pull/9845))\n\n**Windows hook commands and plugin updates no longer open extra console windows.** Claude-compatible hooks and helper probes now hide their child consoles, so a GUI-launched session doesn't get a terminal flash or a focus-stealing window on every hook. The shared Bun spawn path applies the same setting, and OmO's Codex plugin hides consoles for background updates, version checks and manual-update commands. ([#7144](https://github.com/code-yeongyu/oh-my-openagent/issues/7144), [#9837](https://github.com/code-yeongyu/oh-my-openagent/pull/9837), [#9840](https://github.com/code-yeongyu/oh-my-openagent/issues/9840), [#9841](https://github.com/code-yeongyu/oh-my-openagent/pull/9841), [#9838](https://github.com/code-yeongyu/oh-my-openagent/issues/9838), [#9839](https://github.com/code-yeongyu/oh-my-openagent/pull/9839))\n\n**OpenCode session tools can find sessions across projects, not just the current server directory.** Session listing and cross-session search use the paginated global session endpoint when it's available, keep their project and date filters, and fall back to the existing session list when it isn't. Search still caps how many sessions it scans. Thanks to @MoerAI. ([#5810](https://github.com/code-yeongyu/oh-my-openagent/issues/5810), [#9023](https://github.com/code-yeongyu/oh-my-openagent/pull/9023))\n\n**Computer use can inspect and select macOS menu-bar commands by their menu path.** `win.menu.items(path?)` lists titles, paths, enabled and checked states, submenus and shortcuts, and `win.menu.select(path)` invokes one unambiguous, enabled leaf command. Selection re-checks the target window and command right before dispatch and restores the keyboard context afterwards. Ambiguous labels, disabled items and submenu-only targets are refused, and on macOS an app with several windows is refused rather than risking the wrong one. The API is cross-platform, but native support in this release is macOS only. ([#9875](https://github.com/code-yeongyu/oh-my-openagent/pull/9875), [#9881](https://github.com/code-yeongyu/oh-my-openagent/pull/9881), [#9886](https://github.com/code-yeongyu/oh-my-openagent/pull/9886))\n\n**Setting a macOS popup now picks the option instead of reporting an ignored write as success.** `el.setValue(text)` opens the popup's menu, selects the exact matching option and verifies the result. Missing, ambiguous and disabled options are refused with the available choices. A menu the call opened is closed again whether selection succeeds or fails, while one that was already open is left alone. Pull-down popups aren't supported yet. ([#9852](https://github.com/code-yeongyu/oh-my-openagent/pull/9852))\n\n**Computer use can write ISO-8601 values to macOS date and time controls.** `el.setValue(text)` now writes a native date and reads it back to verify. A date-only value keeps the current time of day, local date-times use the system time zone, and values with `Z` or a numeric offset name an exact instant. Malformed input, and local times that daylight saving skips or repeats, are refused rather than quietly shifted. ([#9853](https://github.com/code-yeongyu/oh-my-openagent/pull/9853))\n\n**Computer-use timeout messages show where the desktop engine stopped answering.** A failed startup probe now names its handshake phase: neither reply yet, `engine.hello` answered while capabilities are pending, or capabilities answered while `engine.hello` is pending. A stalled engine is easier to diagnose when every timeout no longer looks the same. Thanks to @MoerAI. ([#9720](https://github.com/code-yeongyu/oh-my-openagent/issues/9720), [#9742](https://github.com/code-yeongyu/oh-my-openagent/pull/9742), [#9916](https://github.com/code-yeongyu/oh-my-openagent/pull/9916))\n\n**Foreground computer use now needs your explicit OK.** Before the model can type, click in the foreground or raise a window, its computer code calls `desktop.control.acquire({ reason })`, and OmO asks you to confirm with that reason. Only an explicit yes grants control; declining, letting the 45-second prompt time out, a headless run or a read-only run all leave it ungranted. The grant ends when the model releases it, when the run ends or fails, on the stop chord, or when the session closes, and resuming never restores it. One session's grant is never taken over by another. Background delivery is unchanged and stays the default. ([#9899](https://github.com/code-yeongyu/oh-my-openagent/pull/9899), [#9908](https://github.com/code-yeongyu/oh-my-openagent/pull/9908))\n\n**Thread bindings accept WhatsApp as a native platform.** `thread_bind` and the session-gateway store now accept `whatsapp` instead of refusing a connector's first message, and existing bindings are kept as the store upgrades. This is the core binding support a WhatsApp connector needs; it doesn't install or link one by itself. ([#9871](https://github.com/code-yeongyu/oh-my-openagent/pull/9871))\n\n**Workflow node IDs are checked before their results are stored.** Empty IDs, `.` and `..`, path separators, colons and NUL bytes are rejected with `invalid_node_id` instead of being used to build result paths, and the result store refuses unsafe paths too. An existing run whose node IDs contain those characters can't resume its saved results after upgrading: rename the nodes and restart the run. Thanks to @DeryFerd. ([#9869](https://github.com/code-yeongyu/oh-my-openagent/pull/9869))\n\n**Mass-ulw joins adjacent all-to-all waves through one review node.** The planning guide now puts a single verification node between two complete waves instead of drawing every producer-to-consumer edge. A finding reruns only the producer it names, and a consumer that needs just one branch waits on that branch's review alone. ([#9866](https://github.com/code-yeongyu/oh-my-openagent/pull/9866))\n\n**omo.dev download stats are set to refresh hourly.** The downloads worker now schedules its rollup at 17 minutes past each hour, so the public stats update regularly once the worker runs with its analytics credential. Nothing changes in your local install. ([#9827](https://github.com/code-yeongyu/oh-my-openagent/pull/9827))\n\n**omo runs on senpi 2026.10.11, and a task shard stops soon after the session that owns it exits.** Task shards are now started with senpi's caller-lifetime ownership, so a multi-GB `p-*` shard host no longer stays resident for the full idle window after its owning session quits; peers and running turns still keep it alive. The engine also waits for its host child to really exit before releasing a stopped host, and required compaction no longer wedges on an unsafe newest message. Long sessions stop rewriting the prompt cache every turn: context reduction holds a stable prefix between large steps and survives restarts. OpenAI models behind a Responses-compatible gateway no longer fail every turn with `Invalid value: 'allowed_tools'`. The footer shows a reasoning model's level as `effort <level>` next to the key that changes it (`shift+tab` by default) when the footer has room. Reloading a session no longer keeps the previous extension runner in memory, and the runtime snapshot a first launch builds leaves out dependency development trees and redundant TypeScript sources. Full engine notes: [senpi 2026.10.10-12](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.10-12) and [senpi 2026.10.11](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.11). (code-yeongyu/senpi#3044, code-yeongyu/senpi#3054, code-yeongyu/senpi#3060, code-yeongyu/senpi#900, code-yeongyu/senpi#3080, code-yeongyu/senpi#3090, code-yeongyu/senpi#3066, code-yeongyu/senpi#3083, [#9876](https://github.com/code-yeongyu/oh-my-openagent/pull/9876), [#9976](https://github.com/code-yeongyu/oh-my-openagent/pull/9976))\n\n**Suspended children no longer linger in the task list: each one resumes or ends on its own.** A child that was parked while it could not run is now revived as soon as it can be, or ends within a bounded recovery window with one final result, so it never sits in the task list as suspended. Messages sent to it meanwhile are queued and delivered in order when it resumes; if it can't resume, the parent is told in that one result how many messages were not delivered, and `task_output` then shows `error` rather than the original status. ([#9861](https://github.com/code-yeongyu/oh-my-openagent/issues/9861), [#9868](https://github.com/code-yeongyu/oh-my-openagent/pull/9868))\n\n- f2d6a8f95 docs(changelog): cite #9976\n- 60570cca1 docs(changes): record the Linux bundle check for the 2026.10.11 adoption\n- 4c7b3f810 Merge pull request #9971 from code-yeongyu/fix/login-service-preflight\n- 03d7e46e7 Merge pull request #9969 from code-yeongyu/docs/changelog-9899-host-confirm\n- 82aa6c72b test(cli): drive the login preflight through the real launcher instead of module mocks\n- c5bf9b2e4 fix(cli): name the unreachable or unavailable OmO accounts origin, drop the test-only seam, regenerate the launcher bundle\n- f88d61616 Merge pull request #9960 from code-yeongyu/feat/ulw-research-browser-companion\n- 8e3b7cb61 Merge pull request #7260 from code-yeongyu/fix/bip-7190\n- c5e33942d fix(cli): omo login checks the account service before opening a browser\n- f3514d474 Merge pull request #7266 from code-yeongyu/fix/bip-7227\n- d4657c418 docs(changelog): describe the shipped host confirmation for foreground computer use (#9899, #9908)\n- 53abd39ba Merge origin/dev into feat/ulw-research-browser-companion\n- c66300fea Merge