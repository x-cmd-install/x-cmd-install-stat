ownload_count":11,"created_at":"2026-10-09T17:49:38Z","updated_at":"2026-10-09T17:49:38Z"},{"id":625716281,"node_id":"RA_kwDOQheEEc4lS6w5","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19737048,"digest":"sha256:13ccc50351ddfdad6e5aee1c34b23f3904cacaedc1a598ce0b3c183abd84e8e2","download_count":25,"created_at":"2026-10-09T17:49:38Z","updated_at":"2026-10-09T17:49:39Z"},{"id":625716290,"node_id":"RA_kwDOQheEEc4lS6xC","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4386816,"digest":"sha256:510b14bf89be031638df9ce4e36b512fee85ee13ca7f2dc3f6dc50f7a2dca53e","download_count":36,"created_at":"2026-10-09T17:49:38Z","updated_at":"2026-10-09T17:49:38Z"},{"id":625716250,"node_id":"RA_kwDOQheEEc4lS6wa","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:b68ef6286e2277f61e3ce2b3f5d81476727a43dfc61f4f491ab8558438d1b3d0","download_count":55,"created_at":"2026-10-09T17:49:37Z","updated_at":"2026-10-09T17:49:37Z"}],"body":"**Child tasks and Kibitzer wakes of a fast-mode session no longer fail with `model_unavailable`: a `-fast` pin is accepted when the session starts on its paired base model.** Since 5.1.25, a category pinned to a `-fast` catalog variant such as `chatgpt-subscription/gpt-6-luna-fast` was refused after start, because senpi starts a `-fast` pin on its base model with the priority tier. Kibitzer recall wakes failed on every wake, and the built-in fast-first chains (`quick`, `deep-low`, `deep-high`, `ultrabrain`) silently skipped their first model. A run that started on the standard tier instead of priority is now accepted and recorded on the task (`effective_model.service_tier`) instead of refused. ([#9793](https://github.com/code-yeongyu/oh-my-openagent/issues/9793), [#9808](https://github.com/code-yeongyu/oh-my-openagent/pull/9808), [#9812](https://github.com/code-yeongyu/oh-my-openagent/issues/9812), [#9813](https://github.com/code-yeongyu/oh-my-openagent/pull/9813))\n\n**omo runs on senpi 2026.10.10-11.** `tool_schema(\"eval:environments\")` now documents `packages.install` and its `environment_install_timeout`, so JavaScript and Python cells can discover how to install packages without changing the default eval description or parameters. Julia, Ruby and Python cells do less fixed work per cell: no globals walk below the memory thresholds, no awaited cwd stat, and leaner Python queue and capture bookkeeping. A scheduled prompt created in a desktop thread before the OmO desktop moved that folder now fires, and `--session`, `--resume` and `--continue` find such sessions in the folder's new home. A session another live process already holds is refused with a typed `session_held` error instead of being opened twice. Sessions that share MCP servers but resolve different MCP configs no longer break each other's tools. A goal whose continuation stops also stops its timer. On Windows, stopping a command's process tree can no longer kill an unrelated process that reused a pid. On macOS and Linux, processes a JavaScript eval cell starts get their own process group, so a group kill can't stop the agent, and leftover grandchildren are stopped when the cell ends. Full engine notes: [senpi 2026.10.10-11](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.10-11). (code-yeongyu/senpi#3003, code-yeongyu/senpi#3028, code-yeongyu/senpi#3033, code-yeongyu/senpi#3034, code-yeongyu/senpi#2990, code-yeongyu/senpi#2951, code-yeongyu/senpi#2597, code-yeongyu/senpi#3007, code-yeongyu/senpi#2999, code-yeongyu/senpi#2995, code-yeongyu/senpi#3020, #9825)\n\n### Fixed\n\n**A background child no longer stays suspended while its parent is running.** A child parked while its parent session was still live was only revisited at the parent's next start, so it could sit suspended for hours and a goal waiting on its result waited forever. It is now revived right away, or ends with one result. ([#9350](https://github.com/code-yeongyu/oh-my-openagent/issues/9350), [#9799](https://github.com/code-yeongyu/oh-my-openagent/pull/9799))\n\n**omo.dev shows its live stats more reliably.** A cold page load whose first stats refresh hit one upstream blip showed the fallback numbers; it now falls back to the last complete set instead. ([#9820](https://github.com/code-yeongyu/oh-my-openagent/issues/9820), [#9821](https://github.com/code-yeongyu/oh-my-openagent/pull/9821))\n\n- 29fa016ac Merge pull request #9823 from code-yeongyu/docs/5.1.29-notes\n- a9562635a docs(changelog): 5.1.29 release notes (lead with the -fast fix; promote the -11 adoption entry from #9825)\n- 78214c8c6 Merge pull request #9826 from code-yeongyu/fix/get-worker-rollup-first-day\n- 3201f741b fix(get-worker): the hourly rollup never writes days before ROLLUP_FIRST_DAY (2026-10-10)\n- 8e750a6b6 Merge pull request #9822 from code-yeongyu/fix/first-deploy-asset-history\n- 06f3a39df Merge pull request #9819 from code-yeongyu/test/9766-stage2-guard-followups\n- dfc99dc5d fix(web): restore the workflow tests (committed empty); report the waiver only when used; cutover summary prints the reason\n- 4b5d0b8d6 Merge pull request #9816 from code-yeongyu/cutover/repoint-installer-mirror\n- f698f74f5 fix(web): first deploy after a deployment made outside the retention pipeline (dispatch-only reason)\n- efb8ca510 Merge pull request #9821 from code-yeongyu/fix/9820-stats-last-known-good\n- 0d14edbd4 style(web): prettier on the stats tests\n- 014d3591c test(web): stored copy keeps its age; malformed counts, description and time are ignored\n- 6be372286 fix(web): serve a shared last-known-good stats copy when a cold isolate refresh fails\n- ac9fcb6f4 Merge pull request #9815 from code-yeongyu/cutover/repoint-omo-deploys\n- cd2da6329 test(#9766): stage 2: list only omo-test-session-manager-fallback- (review)\n- cbeec581d test(#9766): stage 2: the shrink check accepts narrowing; list omo-test-session-manager- for omo-opencode\n- aaaccc383 Merge pull request #9818 from code-yeongyu/test/9812-fast-spelling-pin\n- c03993053 test(#9766): stage 2 review: both messages in the thrown error, two-way creator match, skip own fixtures\n- 2d43758ef test(#9766): stage 2: shared matcher with a table test, both errors from the hermetic-home teardown, derivation script, drop generic and duplicate entries\n- 5a1a127b5 Merge pull request #9813 from code-yeongyu/fix/9812-fast-pairing\n- 6ba3f19dc Merge pull request #9810 from code-yeongyu/fix/9766-test-temp-leak\n- 556e338d8 ci(installer): check the served channel against the bucket pointer after the run, with a bounded wait\n- 4bc6edfc3 ci(cutover): installer mirror writes the Sisyphus Labs omo-releases bucket and proves get.omo.dev serves the tag\n- 4038c65c3 ci(cutover): gate the manual omo-get deploy too, fail closed without a ledger or migrations, and update the deploy docs\n- bd42334f9 ci(cutover): live deploys target the Sisyphus Labs account; omo-get refuses a pending D1 migration\n- 6355b0842 test(#9766): exact report-only entries end in '$' (a leading '=' tripped the agent command-string audit on '=omo.js')\n- fda039900 test(#9766): derive template-literal and concatenated temp names into the report-only list; resolve the sg helper's omo-<name>- prefixes; .d.mts for the shrink script (CI)\n- 0b8bcf5d5 Merge pull request #9809 from code-yeongyu/cutover/stage2-omo-routes\n- 70f8ab910 Merge pull request #9808 from code-yeongyu/fix/9793-fast-variant-pin\n- 73d79dc8f test(#9766): report-only list derived from source + measurements; guard runs in the hermetic home's finally after hosts exit; exact '=' entries; ownerless-root sweep; exit-code base check (review)\n- 09ec25fb9 ci(cutover): name the target zone by id on the get.omo.dev custom domain too\n- e860d5c63 test(memory): tools-operations uses the support module's per-test root instead of the removed roots array (#9766 review)\n- 5b066c3ee ci(cutover): get.omo.dev is a custom domain for the target omo-get, as on live\n- f89fdbb77 ci(cutover): zone routes on the Sisyphus Labs omo.dev zone for the target web and get Workers\n- e3d69436d Merge pull request #9804 from code-yeongyu/cutover/stage1-target-deploy\n- e9eaa0dc1 Merge pull request #9799 from code-yeongyu/fix/9350-suspended-child-live-parent\n- 315196215 wip(test): per-run temp root, leak guard, report-only list, fixed creators (#9766)\n- fa9c31d7d ci(cutover): job summary (dev's summary rule); smokes wait up to 5 min for a fresh workers.dev script\n- 95de08a76 ci(cutover): deploy in its own step (no token for install/build); smoke proves the R2 source (review round 2)\n- e9cd1499a ci(cutover): token only on the deploy commands; smoke R2 and D1 reads (review round 1)\n- 99529d27e ci(cutover): stage-1 target deploy for omo.dev's Workers (workers.dev only)\n- ae4ddd2b3 Merge pull request #9806 from code-yeongyu/release/v5.1.28-source-state\n\n```bash\nbun add -g omo-ai\n```\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
