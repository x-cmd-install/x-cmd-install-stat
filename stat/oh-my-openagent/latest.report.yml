t":"2026-11-15T21:52:12Z","updated_at":"2026-11-15T21:52:12Z"},{"id":752464780,"node_id":"RA_kwDOQheEEc4s2bOM","name":"senpi-desktop-engine-darwin-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":8782992,"digest":"sha256:0dcfb3ed38ef1065a01ec95176457d2897e0cc374a10bec2cc62971a4a99b17f","download_count":24,"created_at":"2026-11-15T21:52:08Z","updated_at":"2026-11-15T21:52:09Z"},{"id":752464793,"node_id":"RA_kwDOQheEEc4s2bOZ","name":"senpi-desktop-engine-darwin-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":8937696,"digest":"sha256:c3c7f39e44646d458dec8c6e3bf73ad5349927a0e1ddc1f852a91c1249c9b18a","download_count":7,"created_at":"2026-11-15T21:52:09Z","updated_at":"2026-11-15T21:52:10Z"},{"id":752464810,"node_id":"RA_kwDOQheEEc4s2bOq","name":"senpi-desktop-engine-linux-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20516488,"digest":"sha256:5fe423c698de5d70a4431ac9bb056b91504089bf3db55c24696a401fa029f854","download_count":6,"created_at":"2026-11-15T21:52:10Z","updated_at":"2026-11-15T21:52:11Z"},{"id":752464822,"node_id":"RA_kwDOQheEEc4s2bO2","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":22648592,"digest":"sha256:5745239929f6fa30732b69ae24efafb582e89425cb488076885578af61dfb371","download_count":8,"created_at":"2026-11-15T21:52:10Z","updated_at":"2026-11-15T21:52:12Z"},{"id":752464839,"node_id":"RA_kwDOQheEEc4s2bPH","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5258752,"digest":"sha256:375b06029ded3970239abe0765ce5b386abeaacf91ecccd390ff7d87e5898200","download_count":6,"created_at":"2026-11-15T21:52:11Z","updated_at":"2026-11-15T21:52:11Z"},{"id":752464862,"node_id":"RA_kwDOQheEEc4s2bPe","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6291968,"digest":"sha256:7ae12371eb9f42919656df6cb92550e61eb64b50bb921aea71b0a31516815235","download_count":12,"created_at":"2026-11-15T21:52:11Z","updated_at":"2026-11-15T21:52:12Z"},{"id":752464768,"node_id":"RA_kwDOQheEEc4s2bOA","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1232,"digest":"sha256:873d83b05468afcd3e6052557b7cab1b81dfd3fd1249d965ef332f2d850ec97c","download_count":57,"created_at":"2026-11-15T21:52:08Z","updated_at":"2026-11-15T21:52:08Z"}],"body":"**A thread send now reaches a session that is not running, on this device or on another of your devices, and starts it.** It needs senpi 2026.11.15-2 or later (omo pins it), and device service 0.1.31 or later on both devices for a wake from another device. A reply to a sender on another device reads only that device's sessions instead of the whole account listing; a send to a live session that is paused or holds a Stop answers `queued` with `waiting_on: { kind: \"hold\", device }`; and `waiting_on.kind` in a `thread_send` result can be `approval`, `hold` or `wake`. ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n\n### Changed\n\n- `omo remote enable` now sets the device up in one command after `omo login`. It installs the OmO device service when none runs, registers this omo's agent dir with it, turns remote sessions on, and installs and starts the always-on session host unit. If you signed in before the device service was installed, it also links that sign-in to the service, so `omo login` then `omo remote enable` leaves the device connected. Running it again changes nothing that is already in place (#13594). ([#13602](https://github.com/code-yeongyu/oh-my-openagent/pull/13602)) ([#13606](https://github.com/code-yeongyu/oh-my-openagent/pull/13606))\n- `omo remote status` also shows this device's own units as the service manager reports them: the session host unit (running, enabled, pinned host), the device service's unit, whether the cold-wake entry is in place, and the agent dir omo registers. With `--json` these are a `local` object beside the status fields (#13594). ([#13602](https://github.com/code-yeongyu/oh-my-openagent/pull/13602)) ([#13606](https://github.com/code-yeongyu/oh-my-openagent/pull/13606))\n- Thread gateway: waking a session that is not running is on (#13037). It runs on senpi 2026.11.15-2 or later (omo now pins it), the release whose session release drops a woken session's retained record. A message from another of your devices wakes a session here once both devices run device service 0.1.31 or later. The local omo daemon (`omo daemon run`, or the device service's cold-wake unit) registers this device's agent dir with the device service and takes deliveries as soon as it starts, with no session open. ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the operator daemon declares the delivery consumer as soon as it loads omo, with no session open (#13037 cold wake). `omo daemon run` sends the daemon it ensured senpi's `warm`, so a daemon the device service starts on demand can be handed deliveries before any session runs. A warm that is refused or unsupported prints one line and the run still exits 0. ([#13596](https://github.com/code-yeongyu/oh-my-openagent/pull/13596)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the session wake loads from its own sidecar (`extensions/omo-wake.js` behind `#omo-wake-runtime`): the carrier, the delivery consumer and the device-service client never enter the main `omo.js` bundle, which carries only lazy shells; the ensured host's idle-exit setting is read inside the sidecar. ([#13456](https://github.com/code-yeongyu/oh-my-openagent/pull/13456)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: waking a session that is not running needs no setting (#13037). A `thread_send` from this machine to a session here that is not running now starts it by default, and the answer is `queued` with `waiting_on: { kind: \"wake\" }`. `session_wake.same_device` stays in the configuration schema only as an explicit opt-out (`false`), read for the target session's own project. The wake starts on senpi 2026.11.15-2 or later (senpi#6449), which omo now pins. ([#13456](https://github.com/code-yeongyu/oh-my-openagent/pull/13456)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: when no operator host is running, a session that is not running still starts (#13037). Before it opens the session, the carrier asks the engine's own `host ensure --policy never`, from omo's daemon launch spec, on the socket `thread_create` uses. A running host is reused whatever its build; one is started only when nothing answers. The ensured host runs with `omo daemon`'s own host environment: the agent directory is named (`OMO_AGENT_DIR`) and the configured `task.host_idle_exit_ms` rides along (`SENPI_RPC_HOST_IDLE_EXIT_MS`) instead of the launch spec's default, and from a source tree the launch spec resolves to the plugin's tracked copy so the CLI is always handed a file that exists. ([#13456](https://github.com/code-yeongyu/oh-my-openagent/pull/13456)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: a delivery from another device is no longer gated on the device service's wake switch being told on. While this engine's delivery consumer is served (from its serving acknowledgement, before its startup pending sweep, so a remote row that sweep wakes is never told the gate is off), the carrier opens the session. The consumer serves on senpi 2026.11.15-2 or later with device service 0.1.31 or later, and it no longer reads the wake the service tells: the wake switch it tracked (`wakeAllowed`, the `delivery.wake` event) had no production reader left. ([#13456](https://github.com/code-yeongyu/oh-my-openagent/pull/13456)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- The delivery consumer (design 5.4) runs beside the carrier. The engine minimum for a woken session, `MIN_WAKE_ENGINE_VERSION` (A8.1, senpi 2026.11.15-2, the release that drops a released session's retained record), gates the carrier as well. A device service older than 0.1.31 does not carry the delivery protocol, so on it the consumer serves nothing and does not ask again. ([#13455](https://github.com/code-yeongyu/oh-my-openagent/pull/13455)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- The gateway store's schema moves to version 12: three nullable columns on deliveries and a unique index on the new ledger id. The first process on this release migrates the store; any process still on the previous build then reports the store's \"schema too new\" error on its thread tools and inbox drain until it restarts. ([#13208](https://github.com/code-yeongyu/oh-my-openagent/pull/13208)) ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: once a build carrying this store ships, every gateway store open runs the schema step to version 13 (one new table, `woken_sessions`) and raises the store's `user_version` for good. An older build, or a rolled-back one, that shares the same agent directory then refuses to open that store with its \"schema too new\" error until it is upgraded again. ([#13212](https://github.com/code-yeongyu/oh-my-openagent/pull/13212)) ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- A reply to a message that came from another of your devices goes to the session on that device that sent it, whether you reply by its session id or by the name it gave. A session on another device, or on this one, that only carries the same id or name no longer receives the reply. ([#13218](https://github.com/code-yeongyu/oh-my-openagent/pull/13218), part of [#13037](https://github.com/code-yeongyu/oh-my-openagent/issues/13037)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n\n### Fixed\n\n- An omo engine on a device whose device service runs on a non-default `--state-dir` now registers with it: `deviceServiceStateDir` takes a non-empty absolute `OMO_DEVICE_SERVICE_STATE_DIR`, then the `device-service.location.json` discovery file beside the default dir, and only then `~/.omo/device-service` (#13597). ([#13598](https://github.com/code-yeongyu/oh-my-openagent/pull/13598)) ([#13606](https://github.com/code-yeongyu/oh-my-openagent/pull/13606))\n- A remote worktree remove refused for an empty reflog now says reflogs may be off in the repository, instead of claiming they are: an expired or deleted reflog looks the same (#13542 follow-up). ([#13546](https://github.com/code-yeongyu/oh-my-openagent/pull/13546)) ([#13606](https://github.com/code-yeongyu/oh-my-openagent/pull/13606))\n- Thread gateway: the session wake keeps working after the session that started it ends (#13037). The carrier and the delivery consumer are one per agent directory for the whole process, but they used the first session's gateway store, which that session's shutdown closed, so every later wake in the process failed. The running wake now opens its own store for the life of the process. ([#13596](https://github.com/code-yeongyu/oh-my-openagent/pull/13596)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the carrier re-checks the sender's peer admission at the moment of every open of a row from another device (#13456 review follow-up), so the retry and lease-takeover paths - which the accept-time check of the consumer and the before-turn check of the drain bracketed but nothing else covered - start nothing when the answer is refused or unknown. A lease takeover now consults the same allowance a wake does, ending its record when nothing queued allows the open; the runtime answers the carrier's admission ask on the live delivery port, so the startup pending sweep's own wakes are admitted too. ([#13511](https://github.com/code-yeongyu/oh-my-openagent/pull/13511)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the session wake loads from its own sidecar (`extensions/omo-wake.js` behind `#omo-wake-runtime`): the carrier, the delivery consumer and the device-service client never enter the main `omo.js` bundle, which carries only lazy shells. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: a consumer failure that changes kind (a device that answers nothing and then refuses the declaration) is warned again: the retry loop's one-warning rule is keyed on the failure itself, not on merely being down, and still stays silent while the same failure repeats. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the delivery consumer listens before it declares itself, so the records the device service hands it right after the acknowledgement are no longer dropped. It counts as serving from that acknowledgement, so a session it wakes during its own start is opened, not left switched off. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the delivery consumer is started again after it dies (#13457 review): a device service that answers nothing, refuses the declaration, or restarts under a served connection no longer leaves remote wake off for the engine's life. A failed start closes its port and reports itself, a connection that ends during the startup sweep leaves no stale serving consumer behind, and a connect failure the client reports is logged instead of dropped. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the wake switch the service tells (`delivery.wake`) has no reader since the carrier's gate moved to the consumer serving, so the consumer no longer tracks it. The conformance fakes the production-port test uses are now a package export of `device-service-core` instead of a deep path into its test tree. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: a delivery id that the same device repeats after its 30-day receipt expired, while its row is still in the store, is answered from that row as deduplicated instead of failing with a raw unique-constraint error (the review of #13208). ([#13212](https://github.com/code-yeongyu/oh-my-openagent/pull/13212)) ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: a session whose file header cannot be read, or names a session kind this build does not know, is never started or reopened unattended. It is refused like a child or worker session instead of being treated as an ordinary interactive one (#13037). ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- When another device refuses to wake a session there that is not running, the reason its delivery consumer gives is shown only when it is a short machine code; any other reason is shown as `unrecognised`. ([#13277](https://github.com/code-yeongyu/oh-my-openagent/pull/13277), part of [#13037](https://github.com/code-yeongyu/oh-my-openagent/issues/13037)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n\n### Added\n\n- `omo remote bootstrap` and `omo remote enable` install and start one fixed, always-on per-user unit beside the OmO device service that runs the omo session host: the systemd user unit `omo-session-host.service` on Linux (enabled, restarted after every exit) and the LaunchAgent `ai.omo.session-host` on macOS (run at load, kept alive). It runs `omo daemon run --pinned` for the registered agent dir, and the device service's `OMO_RELAYD_SERVICES` table names it (entry `\"omo\"`) as the only unit it may start for a cold wake. The table keeps its other entries, and the device service restarts only when the table changed. `omo remote disable` disables and removes both, and while remote sessions are off a bootstrap removes them instead of installing them (#13594). ([#13595](https://github.com/code-yeongyu/oh-my-openagent/pull/13595)) ([#13606](https://github.com/code-yeongyu/oh-my-openagent/pull/13606))\n- `omo daemon run --pinned` starts the operator host with no idle exit; a task host started from one of its sessions still idles out as usual (#13594). ([#13595](https://github.com/code-yeongyu/oh-my-openagent/pull/13595)) ([#13606](https://github.com/code-yeongyu/oh-my-openagent/pull/13606))\n- Device service client: the delivery-consumer requests of #13037 (`deliveries.serve`, `delivery.answer`, `delivery.held`, `delivery.pending`, `delivery.drained`, `peer.admitted`) and their events (`delivery.inbound`, `delivery.holds`, `delivery.wake`), in the shapes omo-relay-daemon #1076 ships, behind `connectDeliveryConsumer` in `device-service-core`. The conformance fixtures are copied in-tree from that release. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the engine's delivery consumer now connects to the device service through that client, so a delivery from another device for a session here that is not running is taken in, answered, and the session started. ([#13457](https://github.com/code-yeongyu/oh-my-openagent/pull/13457)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the session wake now loads from its own sidecar, `extensions/omo-wake.js` behind `#omo-wake-runtime`: the carrier and its host connection, the delivery consumer and the device-service client never enter the main `omo.js` bundle, which carries only three lazy shells (the session-start start, a send's same-device wake, the control endpoint's admission ask); a sidecar that fails to load answers as if no wake exists. Measured 1,547,852 -> 1,476,860 bytes on this branch; the byte ceiling in `bundle-budget.json` moves to 1,478,000 for it. ([#13455](https://github.com/code-yeongyu/oh-my-openagent/pull/13455)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the session wake of #13037 now runs in production, but only on an engine at or above the wake engine minimum `MIN_WAKE_ENGINE_VERSION` (A8.1): the first engine release that drops a woken session's retained record (senpi#6449). Below it no carrier starts, and a `thread_send` naming a session that is not running answers as it did before the wake existed (`queued_offline` with `reason: \"wake_unavailable\"`). At or above it, every `tui` or `rpc` engine (never a task child, never under CI) starts one carrier per agent directory on its first session start: it opens the session by path on the operator host that `thread_create` opens on, sends the engine's `wake`, and hands it back quietly once it has finished; the answer is then `queued` with `waiting_on: { kind: \"wake\" }`. It still follows `session_wake.same_device`, read for the target session's own project, which stays off by default. ([#13455](https://github.com/code-yeongyu/oh-my-openagent/pull/13455)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the carrier sweeps its woken rows on a timer only while the table holds a row (design A3.1.4: an empty table leaves no timer). ([#13455](https://github.com/code-yeongyu/oh-my-openagent/pull/13455)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: a session's own inbox drain admits nothing while a carrier is opening it (A3.1.5). It asks the device service whether a row's sending device is admitted before it takes in a delivery from another device (5.6). ([#13455](https://github.com/code-yeongyu/oh-my-openagent/pull/13455)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the store can take in a delivery that another device's service attested for a session on this device that is not running (the intake row of #13037). The row is committed in the same transaction as a same-device delivery, keeps the sender's delivery id, text and display text, is rate-limited per sending device, and is admitted later under the engine's own ledger key, so the engine counts it once even if the same delivery also arrives live. A repeat of a delivery id from the same device is answered with the first answer. A reply to such a delivery continues its chain. ([#13208](https://github.com/code-yeongyu/oh-my-openagent/pull/13208)) ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the store keeps a record of each session a wake asked for or opened (#13037): one row with its state, a lease and a generation that fences every write, at most 4 such sessions past `requested` per agent directory, and a transient open failure that returns the row to `requested` with its attempts and the time of the next one (the third deletes it). A wake primitive resolves a durable id to its one session file, refuses child and worker sessions, ensures the host and sends one plain `open_session` frame (no `attended`, no permission preset). ([#13212](https://github.com/code-yeongyu/oh-my-openagent/pull/13212)) ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- Thread gateway: the pieces that will let a message from another of your signed-in devices reach a session that is not running on this device are the delivery consumer, the carrier that opens such a session in its own working directory and hands it back when its turn is done, and the pending sweep (#13037). ([#13220](https://github.com/code-yeongyu/oh-my-openagent/pull/13220)) ([#13279](https://github.com/code-yeongyu/oh-my-openagent/pull/13279)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n- `omo remote wake [on|off|default]` reads or sets whether sessions on this device that are not running may be started by a message from your other signed-in devices; `default` follows the build's default, which is off. It needs device service 0.1.31 or later; on an older one the command sends nothing and says so. ([#13257](https://github.com/code-yeongyu/oh-my-openagent/pull/13257), part of [#13037](https://github.com/code-yeongyu/oh-my-openagent/issues/13037)) ([#13599](https://github.com/code-yeongyu/oh-my-openagent/pull/13599))\n\n- 71cc3ecf70 Merge pull request #13606 from code-yeongyu/chore/omo-5172-train\n- 49d521db38 train(omo-5172): drop two stale sentences from the #13599 fragment (review L1, #13604)\n- 3f5bbc72e1 chore(release): regenerate bundles at the omo-5172 train top after dev facd9fa7ea (#13599)\n- b1107d3486 Merge remote-tracking branch 'origin/dev' into chore/omo-5172-train\n- facd9fa7ea Merge pull request #13599 from code-yeongyu/train/13037-coldwake\n- c0cc53d321 test(device-service,thread): two Windows-only reds in the cold-wake tests\n- ffb1600914 test(device-service-core): run the POSIX discovery-file cases on a POSIX host only (a Windows temp path is not POSIX-absolute) (#13598 on Windows)\n- d739c147e3 chore(release): regenerate bundles at the omo-5172 train top after dev v5.1.71\n- 41d688506b Merge remote-tracking branch 'origin/dev' into chore/omo-5172-train\n- bcfa13f1e6 train(omo-5172): export-check the remote CLI test kit as a knip entry (knip-entry-exports probe)\n- 69c7cd55ed Merge remote-tracking branch 'origin/dev' into train/13037-coldwake\n- d4922b00cf Merge pull request #13605 from code-yeongyu/release/v5.1.71-source-state\n- 16a5f0e1d5 chore(bundle): raise the omo.js budget to the cold-wake train's measured size after merging dev\n- 9c8654793e Merge remote-tracking branch 'origin/dev' into train/13037-coldwake\n- 391210c0f0 train(omo-5172): fold the member fragments into 13606.md\n- 9a94634f36 chore(release): regenerate bundles at the omo-5172 train top after dev b4c13ecd11 and #13546\n- 77e8f0a74e Merge remote-tracking branch 'origin/pr-13546' into chore/omo-5172-train\n- 19b82fbe4d Merge remote-tracking branch 'origin/dev' into chore/omo-5172-train\n- 5aab1c373