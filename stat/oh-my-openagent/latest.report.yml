\n\n### Fixed\n\n- Internal maintenance. ([#12062](https://github.com/code-yeongyu/oh-my-openagent/pull/12062), fixes [#12061](https://github.com/code-yeongyu/oh-my-openagent/issues/12061))\n\n- e887cabf50 Merge pull request #12062 from code-yeongyu/fix/turn-span-session-role\n- ed5cc1f377 Merge pull request #12047 from code-yeongyu/fix/12046-release-state-service-auth\n- f349bbe0f3 Merge remote-tracking branch 'origin/dev' into fix/turn-span-session-role\n- 813f7fd875 Merge pull request #12059 from code-yeongyu/release/v5.1.56-source-state\n- 66d22f04f5 changes: fragment for #12062\n- 2af262f90a Merge remote-tracking branch 'origin/dev' into fix/12046-release-state-service-auth\n- 76f934bdf2 Merge remote-tracking branch 'origin/dev' into fix/12054-eq-omo-eval-rerecord\n- 6940c1c764 Merge remote-tracking branch 'origin/dev' into fix/12046-release-state-service-auth\n- e77ab508c6 fix(release): stage the service-auth bundle by directory and register its builder as a knip entry\n- c8c10c191a fix(release): rebuild and stage the service-auth bundle in the release-state commit\n\n```bash\nbun add -g omo-ai\n```\n\n\n"}
