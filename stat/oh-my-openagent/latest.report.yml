ad_count":5,"created_at":"2026-10-05T03:45:33Z","updated_at":"2026-10-05T03:45:34Z"},{"id":611397033,"node_id":"RA_kwDOQheEEc4kcS2p","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19737048,"digest":"sha256:13ccc50351ddfdad6e5aee1c34b23f3904cacaedc1a598ce0b3c183abd84e8e2","download_count":25,"created_at":"2026-10-05T03:45:34Z","updated_at":"2026-10-05T03:45:35Z"},{"id":611397060,"node_id":"RA_kwDOQheEEc4kcS3E","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4386816,"digest":"sha256:a5470e89ffbe96a40b5a526107dcf18413ebb5cc3d4430e56d5e21f14451ccc7","download_count":33,"created_at":"2026-10-05T03:45:34Z","updated_at":"2026-10-05T03:45:35Z"},{"id":611397010,"node_id":"RA_kwDOQheEEc4kcS2S","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:837ef864578a3469475a395b0a6cfcd10786c8b008c9f41ce8efcb3bc7a265e9","download_count":23,"created_at":"2026-10-05T03:45:33Z","updated_at":"2026-10-05T03:45:33Z"}],"body":"**Code mode can install JavaScript packages per session.** 5.1.19 runs on senpi 2026.10.10. A cell that is only `%bun add <package ...>` or `%npm add <package ...>` installs packages into the session's own managed environment without restarting the kernel, and the next cell imports them. The project's `package.json` and `node_modules` are untouched and package scripts never run. ([senpi 2026.10.10](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.10))\n\n### Added\n\n**A Python cell's `@tool` functions can be granted to a task child**, the same way JavaScript `tool(fn)` tools already were. ([#9529](https://github.com/code-yeongyu/oh-my-openagent/pull/9529))\n\n### Changed\n\n**An idle gateway store gives back its worker thread.** After 60 seconds with no store call in flight, the worker is retired, and the next call starts a fresh one with its registrations restored. That frees about 2.9 MB per terminal control endpoint. ([#9592](https://github.com/code-yeongyu/oh-my-openagent/pull/9592))\n\n**omo runs on senpi 2026.10.10.** It warns when a requested thinking level isn't available instead of dropping it, keeps project rule discovery inside the project on Windows, and keeps the resident Claude subscription session receiving only new messages when `compaction.model` is set. Code mode also gets opt-in isolated cells (`isolate: true` with `sandbox.enabled`). Full list: [senpi 2026.10.10](https://github.com/code-yeongyu/senpi/releases/tag/v2026.10.10).\n\nThanks to @Dante-dan for the manifesto reveal fixes on the site ([#9586](https://github.com/code-yeongyu/oh-my-openagent/pull/9586)) and a test-fixture fix ([#9599](https://github.com/code-yeongyu/oh-my-openagent/pull/9599)).\n\n- a8019016f Merge pull request #9615 from code-yeongyu/release/v5.1.19-source-state\n- 69ad5f9b0 Merge pull request #9608 from code-yeongyu/fix/openclaw-ready-test-budget\n- 259acef9b test(openclaw-core): give the reply-listener success test a budget a slow runner cannot miss\n- 689666cf8 Merge pull request #9529 from code-yeongyu/codemode/n27-py-kernel-tools\n- eab62751d Merge dev into the omo#9529 branch\n- b9463e692 Merge pull request #9592 from code-yeongyu/perf/gateway-store-worker-idle-retire\n- ba2eed3a5 Merge pull request #9599 from Dante-dan/fix/9596-process-tree-ready\n- c0209210e Merge pull request #9593 from code-yeongyu/fix/9591-manifesto-lit-depth\n- 6f554f39d fix(web): keep the top three quarters of the manifesto fully lit (#9591)\n- 92ae283cc Merge pull request #9586 from Dante-dan/fix/9558-manifesto-order-rendering\n- ff035f59d Merge remote-tracking branch 'origin/dev' into perf/gateway-store-worker-idle-retire\n- 51cb4ceb5 test(web): normalize glyph screenshot antialiasing\n- 30b29f1fb Merge origin/dev into codemode/n27-py-kernel-tools\n- 33b4c9198 Merge remote-tracking branch 'origin/dev' into perf/gateway-store-worker-idle-retire\n- 7a508a8c9 fix(web): preserve reading order across font metrics and persist glyph evidence\n- 1591fa23f Merge remote-tracking branch 'origin/dev' into perf/gateway-store-worker-idle-retire\n- 7d10ebdac fix(gateway): dispose waits for a retiring store worker; report an unreadable legacy mailbox once\n- 69c609e13 test(web): preserve spatial evidence for split-word failures\n- 071b5a86d perf(gateway): retire the idle store worker thread\n- 63ae0fb13 fix(web): cluster visual lines and tolerate glyph antialiasing\n- e5108c6ad wip(web): clamp manifesto order and compare uniform glyph rendering\n- 0fa40d294 Merge origin/dev into codemode/n27-py-kernel-tools\n\n**Thank you to 1 community contributor:**\n- @Dante-dan:\n  - wip(web): clamp manifesto order and compare uniform glyph rendering\n  - fix(web): cluster visual lines and tolerate glyph antialiasing\n  - test(web): preserve spatial evidence for split-word failures\n  - fix(web): preserve reading order across font metrics and persist glyph evidence\n  - test(web): normalize glyph screenshot antialiasing\n\n```bash\nbun add -g omo-ai\n```\n","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
