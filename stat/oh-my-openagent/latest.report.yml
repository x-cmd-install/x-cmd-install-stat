264,"digest":"sha256:1cfcd93569e3418124076aee70a6dc111b18a3fa4feca3c60f2dab65b3e81b39","download_count":17,"created_at":"2026-11-26T16:00:21Z","updated_at":"2026-11-26T16:00:22Z"},{"id":796635896,"node_id":"RA_kwDOQheEEc4ve7L4","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5264896,"digest":"sha256:2e5eed3924e411dbbd885246330215aefed6f0d6a4e2a748bbc20fb34985a78e","download_count":14,"created_at":"2026-11-26T16:00:21Z","updated_at":"2026-11-26T16:00:22Z"},{"id":796635907,"node_id":"RA_kwDOQheEEc4ve7MD","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6276608,"digest":"sha256:32dd26395e91383796398295c95d7429c128798fd96f2fe882bc8a52e0d08c7f","download_count":32,"created_at":"2026-11-26T16:00:21Z","updated_at":"2026-11-26T16:00:22Z"},{"id":796635701,"node_id":"RA_kwDOQheEEc4ve7I1","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1232,"digest":"sha256:5c0b383d511a836a8998114d42b869ffeed16a94a9f8075bdb3641dfd2475542","download_count":90,"created_at":"2026-11-26T16:00:18Z","updated_at":"2026-11-26T16:00:19Z"}],"body":"---\ntype: fix\n---\nA run from TypeScript source that no omo launcher started (a bare `bun test`, `bun <script>`) no longer migrates the account's shared gateway store past what released omo reads; it may still migrate an isolated agent dir (#14892). ([#14894](https://github.com/code-yeongyu/oh-my-openagent/pull/14894))\n\n### Fixed\n\n- On Windows, a task or team member that runs as its own process is no longer refused at startup for CPU it never used: the startup CPU cap counted an unrelated long-running process whose exited parent had the same process id as the new child (#15098). The cap itself is unchanged. ([#15099](https://github.com/code-yeongyu/oh-my-openagent/pull/15099)) ([#15111](https://github.com/code-yeongyu/oh-my-openagent/pull/15111))\n- Display escaping for thread command output. ([#15025](https://github.com/code-yeongyu/oh-my-openagent/pull/15025)) ([#15111](https://github.com/code-yeongyu/oh-my-openagent/pull/15111))\n- Behaviour change: C1 control characters are refused in a typed thread reference (covered in `addressing.test.ts`; tab, line feed, vertical tab, form feed and carriage return still fold into a space and the other C0 controls and DEL are still refused, as before). ([#15025](https://github.com/code-yeongyu/oh-my-openagent/pull/15025)) ([#15111](https://github.com/code-yeongyu/oh-my-openagent/pull/15111))\n- Ultrawork: `ulw` requests broad discovery before planning, a todo for each action, and one local commit per verified increment. ([#14871](https://github.com/code-yeongyu/oh-my-openagent/pull/14871)) ([#15111](https://github.com/code-yeongyu/oh-my-openagent/pull/15111))\n- The attached-engine loop example runs as written on example.com and example.org, whose pages no longer have an `h1`. ([#15083](https://github.com/code-yeongyu/oh-my-openagent/pull/15083))\n- The omo SDK parity gate builds its merge-base comparison tree correctly on Windows: installed packages and paths on another drive are recognised with Windows path separators (#15052). No command or tool changes behaviour. ([#15055](https://github.com/code-yeongyu/oh-my-openagent/pull/15055))\n- The attached-engine loop example sends its first `navigate` without a sync context, which the untouched Agent Window tab refuses (first reported and fixed in #14385 by @kristianvast). ([#15051](https://github.com/code-yeongyu/oh-my-openagent/pull/15051))\n- `omo thread close` no longer fails with a TypeError on every call; it closes the thread and honours `--force` and `--graceful` (#14992). ([#15009](https://github.com/code-yeongyu/oh-my-openagent/pull/15009))\n- The omo-senpi telemetry component check resolves its imports as the bundler does, so `loadOmoConfig` type-checks again, and the plugin bundles are regenerated from the current sources. ([#14940](https://github.com/code-yeongyu/oh-my-openagent/pull/14940))\n- `knip:check` passes on `dev` again: the unused `DEFAULT_OTLP_ENDPOINT` re-export and `telemetryDestinationHosts()` are gone from telemetry-core's destinations module. ([#14934](https://github.com/code-yeongyu/oh-my-openagent/pull/14934), fixes [#14933](https://github.com/code-yeongyu/oh-my-openagent/issues/14933)) ([#14940](https://github.com/code-yeongyu/oh-my-openagent/pull/14940))\n- A task child whose open was still connecting when its parent released it no longer stays attached to the task host: the open is refused and its connection closed. ([#15069](https://github.com/code-yeongyu/oh-my-openagent/pull/15069)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- A thread message sent with `omo thread send` (or through the thread SDK) to a session that is not running now wakes it, as a message from another session already did, instead of waiting until someone opens it. ([#15024](https://github.com/code-yeongyu/oh-my-openagent/pull/15024)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- Several thread messages sent at once to an idle session no longer lose one or split into a second turn when they race the turn starting: each one joins the turn that is running. ([#15017](https://github.com/code-yeongyu/oh-my-openagent/pull/15017)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- A thread session that is idle or woken with several deliveries queued now takes them all in its first turn, in send order, instead of starting on the first one and running the rest as later turns. ([#14980](https://github.com/code-yeongyu/oh-my-openagent/pull/14980)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- A same-device thread wake that fails is now logged with the session id and the cause, and retried by the carrier's sweep, instead of leaving queued deliveries waiting with no trace. ([#14975](https://github.com/code-yeongyu/oh-my-openagent/pull/14975)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- `omo remote enable` renders the session-host unit for the omo that ran it - the compiled binary or the npm launcher running the verb - instead of an older runtime's OMO_BIN left in the environment, and the launch-time refresh now also upgrades a unit naming an older omo-versions install (#14258). ([#14710](https://github.com/code-yeongyu/oh-my-openagent/pull/14710)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- `omo logout` no longer waits on the credential store twice when a stalled or locked keyring fails its read: it makes one store call, clears nothing, and exits 9 as store-unavailable (the same code as `omo account`). An unreadable stored sign-in is still cleared, as before. ([#14711](https://github.com/code-yeongyu/oh-my-openagent/pull/14711)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- On Windows, a local monitor or thread path written with mixed separators (`C:\\\\a/b`, `\\\\\\\\server\\\\share/x`) or as a drive-relative path (`C:dir`) is recognised as local instead of being refused as a remote target. ([#14743](https://github.com/code-yeongyu/oh-my-openagent/pull/14743)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- A thread tool given the bare id of a closed thread on another device (`thread_create({ thread })`, `thread_send`, `thread_read`, the control tools) reaches it as `<device>/<thread>` does. When every device is asked at once, a device that answers its own lookup in time could pass the 3.5 s cap and be counted silent, so the call answered `host_unavailable`. Now, when that first round finds no holder, each device that stayed silent is asked again alone, one at a time, with no other lookup of that device service in flight. A retry is made only when the earlier lookups finish in time and the call has enough of its time budget left, so `host_unavailable` can still name a device that was not asked again, as well as one that did not answer on its own. ([#14754](https://github.com/code-yeongyu/oh-my-openagent/pull/14754)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- Closing a remote client now releases the attaches its sessions held, so no idle attach timer outlives the client and fires later against a closed or replaced session ([#14812](https://github.com/code-yeongyu/oh-my-openagent/pull/14812)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- A thread looked up by name on disk in the caller's workspace no longer matches sessions from a sibling directory whose path extends the workspace's (`<root>-tmp`) (#14893). ([#14898](https://github.com/code-yeongyu/oh-my-openagent/pull/14898)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- Threads: the sender device of a delivery taken in from another device is read by one rule everywhere, so the wake carrier and reply pinning name the same device for the same delivery. ([#14872](https://github.com/code-yeongyu/oh-my-openagent/pull/14872))\n- Memory sync: redacting credentials from URLs no longer slows down quadratically on a very long run of letters next to `://` (200k letters took about 5.7 s, now about 10 ms). What gets redacted is unchanged. ([#14865](https://github.com/code-yeongyu/oh-my-openagent/pull/14865))\n- A task child started through a launcher that runs the engine as its own child process (an npm shim or a wrapper script) no longer fails its start as a stall while the engine boots. The startup bound now follows the CPU of the launcher's whole process tree on Linux, macOS and Windows. ([#14827](https://github.com/code-yeongyu/oh-my-openagent/pull/14827), fixes [#14820](https://github.com/code-yeongyu/oh-my-openagent/issues/14820))\n- On Linux, a task child's CPU time is read with the system's own clock-tick rate (`sysconf(_SC_CLK_TCK)`) instead of an assumed 100 ticks per second, so the startup stall window and CPU cap measure real CPU seconds on a kernel built with a different rate. 100 remains the fallback when the rate cannot be read. ([#14824](https://github.com/code-yeongyu/oh-my-openagent/pull/14824), fixes [#14821](https://github.com/code-yeongyu/oh-my-openagent/issues/14821))\n- `thread_read` and `thread_send` of a thread another device parked reopen it there and reach it, instead of answering `not_resumable` while that device still keeps the session file. ([#14807](https://github.com/code-yeongyu/oh-my-openagent/pull/14807))\n- `thread_create` on another device no longer answers `idempotency_uncertain` (`reply_lost`) for a session that device did create. The create is opened under the id its `idempotency_key` derives; when the open's reply is lost (a busy device answering after the call's budget), the session that device lists under that id is answered as the created thread, on the spot or on a retry under the same key, and no second session is opened. An engine that ignores the id still answers uncertain. A retry of an uncertain create now runs the create again instead of replaying the uncertain answer. ([#14564](https://github.com/code-yeongyu/oh-my-openagent/pull/14564), fixes [#14560](https://github.com/code-yeongyu/oh-my-openagent/issues/14560)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- A session that received a message from a session in another workspace on the same device can now answer it with `thread_send` without `all_scope`, as the delivery tells it to; before, the reply was refused `scope_denied`. A reply by the name the message stated reaches the sender even after it renamed itself or when only its session file lists it. Only the sender of a message this run took in is reachable this way; every other session outside the workspace still needs `all_scope`. ([#14542](https://github.com/code-yeongyu/oh-my-openagent/pull/14542)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- `thread_list` rows for threads on another device show when the thread was created. They showed the time the holder last synced its listing, the same value as `updated_at`. ([#14479](https://github.com/code-yeongyu/oh-my-openagent/pull/14479)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- Reading a thread from its session file now returns the latest messages even when bookkeeping follows them. The window and byte budget count message payloads, as on a live read. Re-read without a cursor to restart a page begun on an older version. ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- A short-lived SQLite client that opens, commits to and closes the live gateway store (`~/.omo/agent/gateway/gateway.sqlite`) no longer deletes its `-wal` and `-shm` files under running omo sessions, which left every thread tool failing with `disk I/O error` until restart and lost later writes. Opening a second store in one process no longer drops the process's SQLite locks. A store whose WAL files were removed or replaced anyway, or that hits an SQLite I/O error, now reopens its connection and retries the call once by itself. ([#14566](https://github.com/code-yeongyu/oh-my-openagent/pull/14566), fixes [#14562](https://github.com/code-yeongyu/oh-my-openagent/issues/14562)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- The thread SDK refuses an argument key an operation does not read (a misspelt `allScope`, say) as `invalid_arguments` naming it, instead of ignoring it (#14316). ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- A local thread reopening after a daemon handoff now lists as `opening` instead of `idle`. Closing it before it is ready reports `session_opening`, not `not_live`. ([#14426](https://github.com/code-yeongyu/oh-my-openagent/pull/14426)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- A retained thread delivery can now report its outcome separately from its original admission. Same-key retries reconcile the receiving gateway's application or refusal, and `thread_read` with `delivery_id` queries an existing receipt without sending or waking a session. Unreachable or older peers report an unavailable outcome instead of guessing expiry. Refusal notices respect the original sender's current access. ([#14449](https://github.com/code-yeongyu/oh-my-openagent/pull/14449)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- `thread_send` and other commands to a session on another device no longer answer \"unsupported, update omo and senpi\" when that device refuses with `engine_capability_missing` and a cause that passes on its own. When the device answers `attach_required` (it lists the session on a route that takes no delegated connections, such as a terminal, and does not count an attach of this device to it), omo drops its attach, attaches again and sends the command once more. That lands an attach-less send. A re-attach can rejoin an attachment the device service still shares but the other device no longer counts; then, as for `daemon_unavailable`, the result is `host_unavailable` with the cause in `details.cause` and a retry hint, and nothing ran. Only an engine that will never take the command stays `unsupported`. ([#14359](https://github.com/code-yeongyu/oh-my-openagent/pull/14359)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- A retry of an uncertain `thread_create` on another device now answers the worktree the first run made there, names the first uncertain answer's cause (`first_cause`), ends an adopted session the device's route does not reach, and never replays a retry's failure as the final answer. ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623), fixes [#14569](https://github.com/code-yeongyu/oh-my-openagent/issues/14569))\n\n### Changed\n\n- The `browser` skill (#15066) teaches the BrowserSkill 0.5 shared-control contract: what the `strict` and `target` control policies need per action kind, how to pass `observation` and `expect`, how a false `expect` is refused under each policy, `read` and `extract` in place of `evaluate` when the answer is already in the DOM, and `waitForElement`. `references/commands.md` adds three traps seen in Chromium-based browsers (a frame injected by another extension, a control inside another extension's own frame, clipboard writes in an unfocused Agent Window) and error rows for `observation_required`, `observation_changed` and `control_context_invalid`. ([#15083](https://github.com/code-yeongyu/oh-my-openagent/pull/15083))\n- The browser skill's bundled runtime is omowright 0.3.4 (was 0.3.3): gated actions take `{ context, observation, expect, dependsOn }`, `cooperate(\"sync\", { controlPolicy })` returns the observation id, `read`, `extract`, `waitForElement` and `drag` are typed, `BskClient` is exported for a caller-supplied transport, and a session's first `navigate` recovers by itself when the extension refuses it while the new tab is still blank. `requestHelp` now requires `prompt`, and only `click` accepts a `{ captureId, x, y }` target. ([#15083](https://github.com/code-yeongyu/oh-my-openagent/pull/15083))\n- The `programming` skill's references gain worked examples for scoped cleanup (`await using` with `AsyncDisposableStack` in TypeScript, `AsyncExitStack` in Python) and compact Python thread and process pool rules (#15061). ([#15061](https://github.com/code-yeongyu/oh-my-openagent/pull/15061))\n- The `browser` skill (#15047) now shows the owned-browser loop beside the attached one and adds three rules: wait for a page state instead of a fixed delay, keep one connection per task and hand a wait that can outlast an eval cell to `tool.monitor`, and read pages within a token budget. The desktop built-in browser step and the doctor state table moved to `references/desktop.md` and `references/install.md`. `references/commands.md` now lists `tabCreate` / `tabSelect` as not gated and states which calls reject an unknown option (#12540, #12905). Examples in `visual-qa`, `debugging` and `ultimate-browsing` take the browser path from `detectBrowsers()` instead of an undefined variable. ([#15051](https://github.com/code-yeongyu/oh-my-openagent/pull/15051))\n- The browser skill's bundled runtime is omowright 0.3.3 (was 0.3.2): scroll collection ends each round on the next response instead of a fixed 800 ms delay, an `emulate()` device survives `goto()`, a failed `fill()` no longer echoes the entered value, and `cooperate(\"sync\")` resolves without a context on a BrowserSkill extension that has no shared control. ([#15051](https://github.com/code-yeongyu/oh-my-openagent/pull/15051))\n- The `dag-library` skill is folded into `mass-ulw`. Saving a DAG, running a saved one, re-running a graph by name and scheduling the same graph now load `mass-ulw`, which routes those requests to its `references/library.md` (library dirs, placeholders, key rotation, `lib.load`/`lib.start`, the Python recipe). `dag-library` no longer ships as a separate skill. ([#15049](https://github.com/code-yeongyu/oh-my-openagent/pull/15049), refs [#15044](https://github.com/code-yeongyu/oh-my-openagent/issues/15044))\n- The `programming` skill loads 6,835 fewer tokens on every activation (9,008 to 2,173, o200k_base): per-language tables and reference lists now live only in each language's README. It gains two design rules, one owner per decision behind a deep module and effects kept at the edge of the domain logic (#15042). ([#15043](https://github.com/code-yeongyu/oh-my-openagent/pull/15043))\n- omo now pins device service 0.1.45, the current signed release, so remote devices update to it at start-up once it is served. ([#14930](https://github.com/code-yeongyu/oh-my-openagent/pull/14930)) ([#14936](https://github.com/code-yeongyu/oh-my-openagent/pull/14936))\n- Telemetry destinations are disclosed everywhere they must be, and every opt-out now stops every sender: the first-run notice, the installer text, the privacy policy and the telemetry reference name both destinations (the PostHog project at `https://us.i.posthog.com` and OmO's own OTLP collector at `https://t.omo.dev`); `OTEL_SDK_DISABLED=true` now disables the PostHog senders as well, not only the collector; `*_SEND_ANONYMOUS_TELEMETRY=yes` no longer opts out (`0`, `false` and `no` still do — migration note in the telemetry reference); and the Codex adapter's daily ping (CLI, installer, and plugin session start) now honors `telemetry.enabled: false` in `omo.json` like every other sender. ([#14920](https://github.com/code-yeongyu/oh-my-openagent/issues/14920)) ([#14923](https://github.com/code-yeongyu/oh-my-openagent/pull/14923))\n- Remote sessions: `sessions.resolve` reads the thread part of an address by the same rules as the thread tools and `omo remote`: a thread id prefix and an account alias now resolve, an exact thread id beats another row's listing key, and a miss on an offline device is `device_offline`. ([#14869](https://github.com/code-yeongyu/oh-my-openagent/pull/14869))\n- Listings of another device's sessions now ask its device service for listing rows 7 first and step down one version at a time to rows 2 when it refuses. A service at relayd 0.1.46 or later then sends each row's holder retry wait (`waiting`, rows 6) and engine version (`engine_version`, rows 7). An older service answers as before. ([#14511](https://github.com/code-yeongyu/oh-my-openagent/pull/14511)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- `thread_list` rows from another device show the holder's retry wait (`waiting_on`, running rows only) and `engine_version` once that device's listing carries them (rows 6 / rows 7). A cached row, and a row without the fields, show neither; nothing is inferred. ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n- `thread_list` rows from another device show the holder's retry wait (`waiting_on`, running rows only) and `engine_version` once that device's listing carries them (rows 6 / rows 7). A cached row, and a row without the fields, show neither; nothing is inferred. ([#14459](https://github.com/code-yeongyu/oh-my-openagent/pull/14459))\n\n### Added\n\n- The security-sensitive contracts of the omo SDK (#14949): the five principals and the root options that fix one, the typed inputs and closed non-secret answers of the credential-bearing, launch, attach, extension-session, run and loop calls, the security design's principal matrix with one refusal scenario per refused cell, and its approved behaviour changes as data. Types and tables only; no command, tool or SDK call changes behaviour. ([#14981](https://github.com/code-yeongyu/oh-my-openagent/pull/14981))\n- The typed contract of the omo SDK root (#14948): the root's type computed from one call table, the input schema of every capability that carries no principal, credential, endpoint or launch option, the failure code registry and the conformance scenario table, each checked against the parity registry. Types and tables only; no command, tool or SDK call changes behaviour. ([#14977](https://github.com/code-yeongyu/oh-my-openagent/pull/14977))\n- A parity check for the omo SDK (#14943): a registry of every capability of both editions' CLIs and the thread tools, checked against their real dispatch, with a baseline of today's gaps and a pull-request gate that refuses a CLI or tool change under an open gap without its SDK call. No command or tool changes behaviour. ([#14970](https://github.com/code-yeongyu/oh-my-openagent/pull/14970))\n- OmO Native asks a first-run consent question (an interactive `ui.confirm` dialog naming both destinations and every opt-out); the answer is persisted once in a 0600 marker next to the install id, and telemetry is allowed only when it reads `accepted`. A run with no dialog (headless, print, RPC, hosted engines) asks nothing, writes nothing, and counts as not consented, so nothing leaves such a run. The consent-gate writer audit registers the new marker site. This is wave B of #14920 and intentionally changes the fresh-install behavior from \"on after an informational notice\" to \"on after an explicit allow\"; it is held for the default-change decision. ([#14920](https://github.com/code-yeongyu/oh-my-openagent/issues/14920)) ([#14924](https://github.com/code-yeongyu/oh-my-openagent/pull/14924))\n- `thread_create { fork_from }` forks a thread, on this device or another, when the engine that holds the source advertises `open_session_fork` (senpi#7085). The answer is a new thread with the source's history. On an engine without it, `fork_from` is still refused `unsupported` (`fork_unsupported`) before anything opens. A source the engine does not hold answers `not_found` with `details.reason` `fork_source_not_local` or `fork_source_not_found`, and the next action names the device that holds it. ([#14403](https://github.com/code-yeongyu/oh-my-openagent/pull/14403), fixes [#13031](https://github.com/code-yeongyu/oh-my-openagent/issues/13031)) ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n\n### Removed\n\n- Thread bindings are gone (#14312). `omo thread` keeps `list`, `send <target> <text>`, `read` and `close`; `bind`, `unbind`, `rebind`, `bindings`, `report`, `answer`, `outbox`, `ack`, `send --binding` and the `--author-*` flags are unknown now. The thread SDK (`runtime/thread-sdk/sdk.js`) loses the same methods, and `send` takes exactly `{ thread, text, mode?, expected_turn_id?, all_scope?, idempotency_key?, collapse_key? }`. The agent tools `thread_report`, `thread_outbox`, `thread_outbox_ack` and `thread_answer` are gone, as are the store-extension helpers `bind`, `unbind`, `rebind`, `bindingsForSession`, `enqueue`, `outboxAck` and `outboxPending`. The gateway keeps the `bindings`, `outbox`, `outbox_cursors` and `completion_arms` tables, empty and unread, so an omo still running gateway schema 14 keeps working through the upgrade; an extension reads its old routes from `bindings` through the read-only `bindingFor`. Dropping the tables is deferred to #14859. A connector keeps its own chat-thread-to-session map and sends by session id. ([#14623](https://github.com/code-yeongyu/oh-my-openagent/pull/14623))\n\n- c7b62004ab Merge pull request #15111 from code-yeongyu/train/13\n- c99358ddc3 Merge dev 6cbb2133f0 into train 13\n- efb24edc0e Merge #15104 (71010471b2) into train 13\n- 71010471b2 test(thread): runtime-start disposes the stores it hands to the wake before removing their directory (#15118)\n- 6cbb2133f0 Merge pull request #15061 from code-yeongyu/docs/skills-scoped-cleanup\n- fd5d615389 Merge #15025 (24642a0c89) into train 13\n- 24642a0c89 test(thread): the display-escaping tests run at the default timeout: the /remote fixture loops take 60 ms, and the skip-log test writes its rows in one transaction (300 ms, was 1.1 s)\n- 0a9081c21a docs(changes): one fragment for train 13 (#15111), its members' entries moved\n- d0b2a31508 chore(ultrawork): embed the directive for train 13\n- 3e1d15651b Merge #15104 (50189c7524) into train 13\n- 50189c7524 test(thread,task): train 12 follow-ons: wake tests remove their temp dirs, replay test waits for applied, short temp root stays short on win32\n- e4b52202ea Merge #15025 (da611a9473) into train 13\n- 008802755b Merge #14871 (c632aada9f) into train 13\n- 9dccc504e8 Merge #15101 (2b1ccaca1f) into train 13\n- 3786124e50 Merge #15099 (