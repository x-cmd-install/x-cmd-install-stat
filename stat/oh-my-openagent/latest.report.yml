pdated_at":"2026-09-22T00:15:42Z"},{"id":580139987,"node_id":"RA_kwDOQheEEc4ilDvT","name":"omo-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":130107904,"digest":"sha256:3da91de18fecd332da200e2a1e2e7efa3e9b3ddd0890b3b5ca21bb101419b6c5","download_count":14,"created_at":"2026-09-22T00:15:38Z","updated_at":"2026-09-22T00:15:42Z"},{"id":580139998,"node_id":"RA_kwDOQheEEc4ilDve","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:35430b37eac321579768a6c68e54587d60b8f39027b04505869dcf2acfe2c28a","download_count":8,"created_at":"2026-09-22T00:15:39Z","updated_at":"2026-09-22T00:15:39Z"}],"body":"### Added\n\n- The OpenCode edition now tells you the standalone Senpi edition exists. Finishing `oh-my-openagent install` \u2014 the interactive setup or `--no-tui` \u2014 prints a short pointer: omo also ships as a standalone Senpi edition with one `omo` command and no OpenCode host, installed with `bun add -g omo-ai@beta`, with a link to the installation guide. The package postinstall prints the same one-line notice. Installs that target the senpi platform itself do not get the pointer. ([#8593](https://github.com/code-yeongyu/oh-my-openagent/issues/8593))\n- `@oh-my-opencode/isolation-core`, a copy-on-write task isolation PAL with baseline capture and merge-back. Filesystem backends \u2014 APFS clonefile, btrfs and ZFS reflink clones, fuse-overlayfs, ReFS block clone, and a git-worktree rcopy fallback \u2014 write only inside the supplied context base directory; an unavailable backend surfaces as a typed `IsolationUnavailableError` and falls through to the next candidate. Baselines capture staged, unstaged and untracked work under a per-repository budget, and merge-back replays it as a patch or a task branch without ever committing the user's overlapping WIP: a failed replay retains the isolated tree with a manual recovery command. A new Linux CI job exercises publication, copy-on-write and teardown on real loopback btrfs and ZFS. ([#8573](https://github.com/code-yeongyu/oh-my-openagent/issues/8573))\n\n- **A delegated task can now run in a copy-on-write clone of your checkout.** Pass `isolated: true` to the task tool (or turn on `task.isolation.enabled`) and the child works in a clone instead of your working tree, so its edits cannot collide with what you are doing. When the child completes, its changes are merged back and the clone is removed; any other ending merges nothing and keeps the delta as a patch and a summary you can read. A merge that cannot apply cleanly leaves your files untouched, reports the conflict, and parks the clone beside its original with the exact `git apply --3way` command to finish by hand. A repository that cannot be cloned refuses the spawn instead of quietly using the real checkout, and if the host dies mid-run the next session salvages the clone's delta before reclaiming it. ([#8574](https://github.com/code-yeongyu/oh-my-openagent/issues/8574))\n\n### Fixed\n\n**A task that waits on the child it just spawned no longer deadlocks at the concurrency cap.** A task held its lane slot for its entire run, so spawning a child with `run_in_background: false` on a full lane left the child queued behind the very parent that was waiting for it, and the whole spawn tree stopped. The parent's slot is now parked for the length of the wait - outside lane and global room - so the child is admitted immediately, and the parent is re-admitted ahead of anything that queued while it waited. Promoting the child to the background re-counts the parent right away instead of making promotion wait, cancelling a parked parent releases its slot, and `task_output` reports whether a task currently holds or has parked its lease. ([#8575](https://github.com/code-yeongyu/oh-my-openagent/issues/8575))\n\n**A sandboxed memory reflection now reads the same credentials as the session that started it.** The reflection sandbox granted the agent directory the adapter detected on its own, while the child asked the engine where its agent directory was - and the two answers differ whenever a project-local config directory, a brand prefix, or a second layout on the same machine is involved. The child then locked `auth.json` outside the grant, so a reflection died with `EPERM` on the credential lock and `No API key found`, while the parent stayed authenticated. The child now inherits the directory the engine resolved for the session: it is granted to the sandbox and pinned in the child's environment, so the reflection worktree it runs in cannot send it looking somewhere else. ([#8595](https://github.com/code-yeongyu/oh-my-openagent/issues/8595))\n\n- 6885e24ad Merge pull request #8606 from code-yeongyu/release/v5.0.0-beta.82-source-state\n- bb6557033 Merge pull request #8614 from code-yeongyu/fix/8609-pin-idle-before-crash\n- fc40cb90d Merge pull request #8610 from code-yeongyu/fix/worker-compile-windows-cleanup-ebusy\n- ba7db7a1a Merge pull request #8613 from code-yeongyu/fix/8609-fake-host-rebind\n- f74d03598 test(build): retry the Windows temp cleanup in the compiled-worker test\n- 4e894a6ef Merge pull request #8607 from code-yeongyu/fix/isolation-core-windows-suite-20260921\n- 8ca7ff56d fix(isolation-core): classify fsutil probe failures as a capability gap\n- 397304a88 fix(isolation-core): keep killTree's taskkill branch win32-only\n- 865f05e26 fix(isolation-core): land the native-resolver canonical and POSIX-literal overlay targets\n- 1fe1d17a5 fix(isolation-core): green the windows-latest suite (#8604)\n- 40872be36 Merge pull request #8603 from code-yeongyu/fix/isolation-core-fixture-auto-maintenance-20260921\n- b0a632bf1 test(isolation-core): disable git auto-maintenance in fixture repositories\n- ac6addd6d Merge pull request #8601 from code-yeongyu/fix/reflection-sandbox-agent-dir-8595\n- 82434c418 test(qa): record the reflection sandbox credential-lock evidence\n- f1ac4a3ad docs(memory): record where the reflection child's agent directory comes from\n- 238478840 fix(memory): grant the reflection child the agent directory the engine resolved\n- 76dd673d3 Merge pull request #8600 from code-yeongyu/refactor/thread-contracts-tools-loc-split\n- dbfe31117 docs(evidence): record the isolation e2e run on the rebased dev\n- 943532f88 docs(changelog): describe isolated task children (#8574)\n- 8e411f323 Merge pull request #8594 from code-yeongyu/feat/task-lease-parking-20260921\n- b82abd23f Merge pull request #8588 from code-yeongyu/feat/thread-tools-revival-session-control\n- e7ce22cd2 docs(changelog): describe the foreground-wait lane-lease parking fix (#8575)\n- 2bccd5fd7 test(qa): add the session-control scenario for the thread tools\n- 1b21dc9bd Merge pull request #8587 from code-yeongyu/feat/isolation-core-20260921\n- 1414cab7c Merge pull request #8591 from code-yeongyu/fix/web-app-icons-pipeline-20260921\n- 7c5e3213b fix(web): pin app icon artwork against icon.svg and ship maskable PWA icons\n- 495f6df91 fix(isolation-core): tear down git's process tree on budget breach and signal it by pid in tests\n- e0b28f663 fix(isolation-core): preserve the caller's error through teardown signal deaths\n- b05db8124 fix(isolation-core): keep runGit's signal, spawn-error and stream contracts on node:child_process\n- 3b02bda1d test(isolation-core): exercise the apfs loader classification on every platform\n- 62c15da7b fix(isolation-core): decide btrfs sameness by filesystem UUID, not st_dev\n- 349957bc7 fix(isolation-core): satisfy repo audits for workflows, registration and child processes\n- 9061c9cc7 fix(isolation-core): treat unprivileged btrfs B-tree search as inconclusive\n- 3d9dc695f fix(isolation-core): keep the sandbox base outside subvolume repository roots\n- 6cc01b813 fix(isolation-core): scope review findings in stash, rcopy, detachment and backend classification\n- ac8c41c73 fix(isolation-core): keep reflink walks out of their own destination and trust the btrfs CLI over st_dev\n- 7c18758c6 docs(changelog): describe the isolation-core task isolation PAL\n- 6be7162d0 feat(isolation-core): btrfs, zfs, reflink, fuse-overlayfs and ReFS block-clone backends with a Linux fs CI job\n- 7c4f9cf2c feat(isolation-core): patch and branch merge-back with fail-closed retention\n- 3d7c29c69 feat(isolation-core): baseline capture and synthetic-tree delta patches\n- 101f317fe feat(isolation-core): apfs clonefile and git-worktree rcopy backends with detachGitDir\n- 2c3e6f37c feat(isolation-core): backend contract, candidate resolution, base dir and owner markers\n- ed985de4d Revert \"feat(omo-native): inherit opencode content in omo setup\"\n- 16a74cf60 Revert \"docs(omo-native): correct the postinstall execution evidence\"\n- 027217282 Revert \"fix(omo-native): preserve migration semantics across both launchers\"\n- 9e1fc2bc5 Revert \"fix(omo-native): preserve literal credentials and consent snapshots\"\n- e3457cc8b Revert \"fix(omo-native): honor source config layers and validate MCP imports\"\n- 7a43afaa8 Revert \"fix(omo-native): validate model imports and normalize migration failures\"\n- 58d805f33 Revert \"fix(omo-native): skip restricted agent imports that conflict with enabled state\"\n- 954be6589 Revert \"fix(omo-native): honor harness and profile agent restrictions\"\n- c35e6d1d7 Revert \"fix(omo-native): translate legacy agents through native safety checks\"\n- 5f1a07b5c Revert \"fix(omo-native): preserve tracked ignore rules during default builds\"\n- d3afc6adf Revert \"fix(omo-native): align provider definitions with migrated default aliases\"\n- 726f43359 Revert \"fix(omo-native): validate defaults against preserved provider catalogs\"\n- afd888df7 Revert \"fix(omo-native): resolve defaults against the complete planned catalog\"\n- 41e90d9b4 docs(omo-native): keep migration QA artifacts out of the PR\n- d90456a10 fix(omo-native): merge dev and resolve migration PR conflicts\n- f277285f6 fix(omo-native): resolve defaults against the complete planned catalog\n- a3861edcb fix(omo-native): validate defaults against preserved provider catalogs\n- 821e05d66 fix(omo-native): align provider definitions with migrated default aliases\n- 11536e90b fix(omo-native): preserve tracked ignore rules during default builds\n- a6a63a364 fix(omo-native): translate legacy agents through native safety checks\n- 18f7b544a fix(omo-native): honor harness and profile agent restrictions\n- cd731e23b fix(omo-native): skip restricted agent imports that conflict with enabled state\n- 28192dfeb fix(omo-native): validate model imports and normalize migration failures\n- 844f6650d fix(omo-native): honor source config layers and validate MCP imports\n- 5695fc209 fix(omo-native): preserve literal credentials and consent snapshots\n- 4b42ec544 fix(omo-native): preserve migration semantics across both launchers\n- 5c87c70f2 docs(omo-native): correct the postinstall execution evidence\n- 5fb0807bf fix(omo-native): preserve setup state and translate import references\n- 9a6028354 docs(guide): note the cosmetic npm allow-scripts warning on omo-ai installs\n- de5d25b0e docs(guide): migration guide and transition policy for opencode users\n- decdc060d feat(omo-native): add omo migrate codemod for opencode state\n- 753cc669a feat(omo-native): inherit opencode content in omo setup\n\n**Thank you to 1 community contributor:**\n- @effortprogrammer:\n  - feat(omo-native): inherit opencode content in omo setup\n  - feat(omo-native): add omo migrate codemod for opencode state\n  - docs(guide): migration guide and transition policy for opencode users\n  - docs(guide): note the cosmetic npm allow-scripts warning on omo-ai installs\n  - fix(omo-native): preserve setup state and translate import references\n  - docs(omo-native): correct the postinstall execution evidence\n  - fix(omo-native): preserve migration semantics across both launchers\n  - fix(omo-native): preserve literal credentials and consent snapshots\n  - fix(omo-native): honor source config layers and validate MCP imports\n  - fix(omo-native): validate model imports and normalize migration failures\n  - fix(omo-native): skip restricted agent imports that conflict with enabled state\n  - fix(omo-native): honor harness and profile agent restrictions\n  - fix(omo-native): translate legacy agents through native safety checks\n  - fix(omo-native): preserve tracked ignore rules during default builds\n  - fix(omo-native): align provider definitions with migrated default aliases\n  - fix(omo-native): validate defaults against preserved provider catalogs\n  - fix(omo-native): resolve defaults against the complete planned catalog\n  - fix(omo-native): merge dev and resolve migration PR conflicts\n  - docs(omo-native): keep migration QA artifacts out of the PR\n  - Revert \"fix(omo-native): resolve defaults against the complete planned catalog\"\n  - Revert \"fix(omo-native): validate defaults against preserved provider catalogs\"\n  - Revert \"fix(omo-native): align provider definitions with migrated default aliases\"\n  - Revert \"fix(omo-native): preserve tracked ignore rules during default builds\"\n  - Revert \"fix(omo-native): translate legacy agents through native safety checks\"\n  - Revert \"fix(omo-native): honor harness and profile agent restrictions\"\n  - Revert \"fix(omo-native): skip restricted agent imports that conflict with enabled state\"\n  - Revert \"fix(omo-native): validate model imports and normalize migration failures\"\n  - Revert \"fix(omo-native): honor source config layers and validate MCP imports\"\n  - Revert \"fix(omo-native): preserve literal credentials and consent snapshots\"\n  - R