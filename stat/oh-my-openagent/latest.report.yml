nload_count":6,"created_at":"2026-10-19T10:12:19Z","updated_at":"2026-10-19T10:12:20Z"},{"id":655918745,"node_id":"RA_kwDOQheEEc4nGIaZ","name":"senpi-desktop-engine-linux-arm64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":18657200,"digest":"sha256:25eb5d8f67c342652abd185d5a555eb32654957ceede125be5c7d2b4971d72f5","download_count":10,"created_at":"2026-10-19T10:12:19Z","updated_at":"2026-10-19T10:12:22Z"},{"id":655918780,"node_id":"RA_kwDOQheEEc4nGIa8","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":20606368,"digest":"sha256:6a425dfe1f85d48956c98032d61dc6ed6d2faef3a97804b883f1f692747eb3c5","download_count":16,"created_at":"2026-10-19T10:12:20Z","updated_at":"2026-10-19T10:12:23Z"},{"id":655918779,"node_id":"RA_kwDOQheEEc4nGIa7","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4298752,"digest":"sha256:94ad6d9ab0704e7fb280094a7f4d1cb5596df31a37e3c14616b571279709fc1e","download_count":6,"created_at":"2026-10-19T10:12:20Z","updated_at":"2026-10-19T10:12:21Z"},{"id":655918823,"node_id":"RA_kwDOQheEEc4nGIbn","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5088768,"digest":"sha256:3aeea23be1f91c3f3dbe1ca8d02ee9d72a41974cef566d5ed7f6d5afcca4feda","download_count":17,"created_at":"2026-10-19T10:12:22Z","updated_at":"2026-10-19T10:12:23Z"},{"id":655918683,"node_id":"RA_kwDOQheEEc4nGIZb","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:3b53912327068e9c7d127efd53dcfb145990734be0b4b054feefdd1f842f5d70","download_count":62,"created_at":"2026-10-19T10:12:18Z","updated_at":"2026-10-19T10:12:18Z"}],"body":"5.1.37 was tagged but its publish stopped on Linux (the release binaries outgrew their size budget), so its main packages never reached npm; everything listed for it ships in this release. ([#10566](https://github.com/code-yeongyu/oh-my-openagent/pull/10566))\n\n**Release binaries may be up to 182 MiB.** The per-platform size budget moves from 160 MiB to 182 MiB after measuring what grew: the Bun 1.4.3 runtime adds 9.5 MB to every binary and the senpi update about 1.25 MB, so linux-x64 reached 173.4 MB. Nothing was bundled by mistake. ([#10566](https://github.com/code-yeongyu/oh-my-openagent/pull/10566))\n\n5.1.36 was prepared but never published; everything listed for it ships in this release. ([#10552](https://github.com/code-yeongyu/oh-my-openagent/pull/10552))\n\n**The engine moves to senpi 2026.10.19: a hung extension handler no longer freezes a session, and queued input survives a crash.** An extension handler that never settles on a lifecycle event is named in the session after 60 s and released after 20 min, or at once on Esc or the turn deadline. Input queued with a client id is written to the session file before it is queued and delivered exactly once. The mouse wheel scrolls the transcript again while a question prompt is waiting, Alt+Q restores queued messages on WSL, and the /btw panel no longer repeats a running eval's output in the scrollback. Anthropic requests of 4096+ characters to `api.anthropic.com` are now sent gzip-compressed, as Claude Code does. ([senpi#3650](https://github.com/code-yeongyu/senpi/issues/3650), [senpi#3549](https://github.com/code-yeongyu/senpi/issues/3549), [senpi#3604](https://github.com/code-yeongyu/senpi/issues/3604), [senpi#3628](https://github.com/code-yeongyu/senpi/issues/3628), [senpi#3649](https://github.com/code-yeongyu/senpi/issues/3649), [senpi#3643](https://github.com/code-yeongyu/senpi/issues/3643), [#10552](https://github.com/code-yeongyu/oh-my-openagent/pull/10552))\n\n**Goals keep going while they make progress, and long sessions open and stay light (senpi 2026.10.18-1).** A goal no longer stops after a fixed 150 automatic continuations; it stops only after 60 in a row with no new tool effect, todo change or message from a person, and says why and that any message resumes it. Opening a very large session on a shared host no longer stalls the other sessions, a reopened session keeps only its latest compaction window in memory (four of the largest local transcripts went from 1441 MB to 216 MB of live heap), and reading a very long history over RPC pages instead of dropping the connection. A Claude subscription from `CLAUDE_CODE_OAUTH_TOKEN` or an ambient Claude Code login now shows as a connected subscription, and a host daemon inherits every credential variable the engine reads. Provider accounts can be ordered, and grep starts 5 to 14 `rg` processes where it used to start 63 to 87. ([#10280](https://github.com/code-yeongyu/oh-my-openagent/issues/10280), [#10509](https://github.com/code-yeongyu/oh-my-openagent/pull/10509)) The engine also fixes ChatGPT browser sign-in dead-ending on \"State mismatch.\" when another session holds the callback port ([senpi #3627](https://github.com/code-yeongyu/senpi/pull/3627)), and a compiled engine now finds the Claude Code binary shipped beside its executable instead of failing the lookup ([senpi #3640](https://github.com/code-yeongyu/senpi/pull/3640)).\n\n**A client re-attaching to a retained session gets the full task snapshot again, and can pull it on demand.** The task RPC bridge listens for `session_resumed`, which senpi fires when the first client re-attaches to a still-open session, and re-emits the complete `omo.task.updated` snapshot instead of waiting for the next store change to alter its fingerprint; a new `omo.task.list` request answers the same payload for the parent session it names. ([#10016](https://github.com/code-yeongyu/oh-my-openagent/issues/10016), [#10122](https://github.com/code-yeongyu/oh-my-openagent/pull/10122))\n**Memory recall's search index takes a quarter of the memory it did, and a memory write no longer rebuilds it.** Every session that recalls memory keeps a search index of the whole memory. It stored each note's words as a separate table, so a memory of 6,406 notes cost about 231 MB per session, and each memory write threw the index away and rebuilt it, taking 3 to 11 seconds. Words are now numbered once and each note keeps a compact list of numbers that survives a memory write, so the same memory costs 55 MB and a write updates the index in about 16 ms. The notes found and their order are unchanged. ([#10510](https://github.com/code-yeongyu/oh-my-openagent/issues/10510), [#10512](https://github.com/code-yeongyu/oh-my-openagent/pull/10512))\n\n**A background task child follows its session when another client replaces it.** A raw RPC client that issues `new_session`, `switch_session` or `fork` on a daemon child's routing handle moves that session to a new durable id and transcript; the child now observes the `session_replaced` record, re-stamps its record's session path and durable id, appends a `replaced` task event, and reattaches to the new transcript instead of the abandoned one. When the replacement stops a turn the child was running, the child ends `interrupted` with the reason and a `task_send` action, and the parent is notified because it did not ask for that stop (a parent's own interrupt stays silent); this needs a senpi that names the cause on `agent_end` (senpi#3357), and an older host keeps the previous error. ([#10018](https://github.com/code-yeongyu/oh-my-openagent/issues/10018), [#10112](https://github.com/code-yeongyu/oh-my-openagent/pull/10112))\n**`unspecified-low` tries GLM 5.3 before GPT.** A user with Claude and Z.ai (or OpenCode Go) but no Xiaomi or xAI provider used to fall from Sonnet 5.5 straight to GPT-6.1 Sol once Sonnet was unavailable. The chain now has `glm-5.3` at high thinking right after Grok 4.7 and ahead of the GPT rungs, so the order for users who hold MiMo or Grok is unchanged. ([#10306](https://github.com/code-yeongyu/oh-my-openagent/issues/10306), [#10311](https://github.com/code-yeongyu/oh-my-openagent/pull/10311))\n\n**`omo --help` no longer moves your OpenCode config before you start a session.** On a fresh install `--help` (and `--list-models` / `--list-tips`) loads the omo extension, and its startup migration moved `~/.config/opencode/oh-my-openagent.json` into `~/.omo/migration-backup-*`, so a 4.19.x OpenCode plugin fell back to its defaults. The migration now runs only on launches that can start a session, and `--help` still lists omo's own flags. Thanks to @bluet for the report and @twotnguyen for #10433. ([#10428](https://github.com/code-yeongyu/oh-my-openagent/issues/10428), [#10454](https://github.com/code-yeongyu/oh-my-openagent/pull/10454))\n\n**Built, tested and released on Bun 1.4.3.** CI, the release workflows and the devcontainer move from Bun 1.4.2 to 1.4.3, the current stable release, which fixes CVE-2026-48618 (TLS host names) and idle garbage collection in workers. ([#10432](https://github.com/code-yeongyu/oh-my-openagent/pull/10432))\n\n**OpenCode edition: Sisyphus names GPT-6.1 Sol and GPT-6 Luna as themselves.** On `gpt-6.1-sol` (and its `-fast`, dashed and Venice `gpt-61-sol` ids) and on `gpt-6-luna`, the Sisyphus and Sisyphus-Junior GPT prompts introduced the model as \"a GPT-family model\"; they now say \"GPT-6.1 Sol\" and \"GPT-6 Luna\". ([#10291](https://github.com/code-yeongyu/oh-my-openagent/issues/10291), [#10292](https://github.com/code-yeongyu/oh-my-openagent/pull/10292))\n\n**Memory session shutdown waits for the work it started in the memory directory.** Shutdown now waits, within its existing drain budget, for an in-flight repo maintenance pass and for the status refreshes started at bind and settle, all of which run git inside the identity directory. Before, they could still hold files open after shutdown returned; on Windows the next delete of that directory failed with `EBUSY`/`EFAULT`, which is how the memory pressure-dream test failed intermittently in CI. ([#10154](https://github.com/code-yeongyu/oh-my-openagent/issues/10154), [#10312](https://github.com/code-yeongyu/oh-my-openagent/pull/10312))\n\n**Oh My OpenAgent loads on OpenCode 2.** OpenCode 2 refused the plugin with `Plugin must export a default definition with an id and an effect or setup function`, because both entry points exported only the OpenCode 1.x shape. The server and TUI entries now also export an OpenCode 2 `setup` built with `Plugin.define` from `@opencode/plugin`, next to the OpenCode 1.x `server` and `tui` entries, which keep working as before. Each OpenCode 2 start shows a notice that points to OmO Native, with the install command and guide link. ([#8485](https://github.com/code-yeongyu/oh-my-openagent/issues/8485), [#10439](https://github.com/code-yeongyu/oh-my-openagent/pull/10439))\n\n**The frontend skill keeps coloured edge stripes off rounded cards, and a linter catches the ones that slip through.** A card with a coloured stripe along one edge, its rounded corners bending the stripe, is one of the most recognizable marks of generated UI, and the skill only banned it when the stripe marked a selected or focused item. It now rules the stripe out before drafting, whether it decorates the card or marks state, and offers what to use instead: a tonal surface, a heading in the accent colour, a glyph, or spacing. The new `check-accent-stripes.ts` script finds the pattern in CSS, Tailwind classes, inline styles, and styled-components, and the skill's checklist runs it before visual QA. Focus rings, form validation, neutral dividers, and tables are left alone. ([#10437](https://github.com/code-yeongyu/oh-my-openagent/issues/10437))\n\n**A store extension's `orderBy` can only name columns its statement returns, and its text never reaches the SQL.** `orderBy` used to be pasted into the gateway's ordered read as given, so a `LIMIT`, an `OFFSET` or a column the statement does not select failed as broken SQL (`near \"LIMIT\": syntax error`, `no such column`). Each comma-separated term must now be one of the statement's own output columns (matched case-insensitively, as SQLite does), optionally with `COLLATE BINARY`/`NOCASE`/`RTRIM`, `ASC`/`DESC` and `NULLS FIRST`/`NULLS LAST`. The ORDER BY is rebuilt from the matched column name and those fixed keywords. Anything else, including quoted or bracketed names, comments, look-alike Unicode letters and unknown columns, is refused with `extension_schema_violation` and a message that names the rule and the columns the statement does return; put a `LIMIT` in the statement itself. ([#9626](https://github.com/code-yeongyu/oh-my-openagent/pull/9626))\n\n**The standalone `omo` binary's `omo setup` carries your OpenCode model choices again.** The release binary printed `could not read the engine's model list (ENOENT ... '/package.json')` and skipped the default model and agent/category picks, and it would have imported a user skill named like a bundled one over the bundled skill. Setup in the binary now reads the provider catalog and bundled skills it ships with; the npm install is unchanged. Thanks to @bluet for the report. ([#10429](https://github.com/code-yeongyu/oh-my-openagent/issues/10429), [#10455](https://github.com/code-yeongyu/oh-my-openagent/pull/10455))\n\n**Only you can stop computer use with the stop chord on macOS and Linux X11.** A chord a program sends (the agent's own key presses, `xdotool`, another app posting key events) used to stop every session, and repeated, could keep computer use stopped; it is now ignored, while a press on a real keyboard still stops every running session at once. Wayland's shortcut portal cannot tell the two apart, and Windows follows in a separate change. ([#10444](https://github.com/code-yeongyu/oh-my-openagent/issues/10444), [#10449](https://github.com/code-yeongyu/oh-my-openagent/pull/10449))\n\n**On Windows every session can now arm the stop chord, and only a key press on a real keyboard triggers it.** The chord used to be a `RegisterHotKey` registration, which only one process can hold: a second session's engine could not arm it, so its computer use refused input with `StopPathUnavailable`; and a chord a program sent (the agent's own key presses or any other app's `SendInput`) stopped computer use like a real press. A low-level keyboard hook now watches the chord in every session, ignores injected key events, and never swallows a key; one physical press stops every running session at once. ([#10444](https://github.com/code-yeongyu/oh-my-openagent/issues/10444), [#10453](https://github.com/code-yeongyu/oh-my-openagent/pull/10453))\n\n**Computer use works on arm64 Linux and Windows.** Each OmO release now carries the desktop engine for Linux arm64 (glibc) and Windows arm64, built on native arm64 machines and checked with its self-test before upload. The compiled OmO binaries for those hosts include the engine, and an npm install downloads it on first use, where it used to report that no engine is built for the host. Musl Linux still has no engine. ([#10440](https://github.com/code-yeongyu/oh-my-openagent/issues/10440), [#10442](https://github.com/code-yeongyu/oh-my-openagent/pull/10442))\n\n**A memory-sync account can be recovered on a new device with a passkey.** memory-core can enroll a dedicated recovery passkey and, on a fresh device, use it to rejoin the account: the device's native bridge derives the recovery keys from the passkey and keeps them in the main process, the device walks the served history from the recovery key's own record and pins it, and only a wrap that record vouches for is opened. A wrap the server made up is refused, whatever the server sends. Nothing syncs to a server yet. ([#10412](https://github.com/code-yeongyu/oh-my-openagent/pull/10412))\n\n**`herdr agent prompt` reaches OmO panes.** herdr only types into a pane whose foreground process it can name, and the OmO engine runs as `bun \u2026/cli.js`, so every OmO pane was refused with `agent_not_ready`. Under herdr, the interactive engine now starts with `HERDR_AGENT=pi`, the label herdr already shows for these panes. OmO drops it from the environment it hands to anything it starts. Thanks to @devswha for the report. ([#10448](https://github.com/code-yeongyu/oh-my-openagent/issues/10448), [#10452](https://github.com/code-yeongyu/oh-my-openagent/pull/10452))\n\n**A memory writer killed mid-commit no longer leaves the next writer stuck on a git lock, and a live commit's lock is never taken.** When a memory writer dies holding a git `index.lock` or ref lock, the writer that takes over its memory-write lock now removes that lock, but only after proving the previous owner dead, seeing no other process still working in the repository (a killed writer's own git command can outlive it), and seeing no process holding the file open. When any of that cannot be proven, including when the open-file check is slow or never answers, the lock stays put and the write fails with an error that names each lock file, says why it was kept, and gives the way out: `/memory unlock <path>` re-checks that one lock, shows what it found, refuses while any live holder, repository user or memory writer is visible, and removes only that file after you confirm (`--force` skips the prompt in a non-interactive session, never a refusal). On Linux desktops and SSH logins where some of your own processes cannot be inspected, the automatic removal does not fire and this command is the way out; [#10322](https://github.com/code-yeongyu/oh-my-openagent/issues/10322) tracks making liveness independent of `/proc`. On Linux this check reads `/proc` directly, so recovery also works on minimal installs and containers without `lsof`. ([#10177](https://github.com/code-yeongyu/oh-my-openagent/issues/10177)) ([#10199](https://github.com/code-yeongyu/oh-my-openagent/pull/10199))\n\n**Synced memory refuses a forged or reordered history on the device, the same way the server does.** memory-core now checks every sync object, the hash chain linking them, and the device keyring folded from it, using the format the service ships. A device rejects a record signed by a key that was rotated out or revoked, a dropped or reordered entry, a recovery join from a removed recovery key, and a batch sealed for another account. It treats the server as untrusted: a device trusts an account history only if it starts from the root it pinned during its own pairing or recovery, so a history the server invents, or a different root that looks valid, is refused before any key is opened. A key wrap opens only from a record of that trusted history, and only through the device's own keyring. A missing or damaged pin is treated as no trust at all, and the device asks to re-pair or recover. A replayed batch, a swapped record body, an unsigned row in a vetoed epoch and a row with fields the format does not define are each refused and counted. Nothing syncs to a server yet. ([#10178](https://github.com/code-yeongyu/oh-my-openagent/issues/10178), [#10298](https://github.com/code-yeongyu/oh-my-openagent/pull/10298))\n\n**A memory that already exists on a device joins its synced space without losing anything.** Each project's synced memory gets one identity that every device computes the same way from the repository, so two devices enabling sync offline land in one space. When local files meet the space's copy, nothing is deleted: body lines are only added, a list keeps every element from both sides, and a frontmatter value that differs keeps both whole values side by side, never spliced together and never a conflict note in the file. Leftover hub conflict copies are folded in and removed only after a read-back proves every line made it. Nothing syncs to a server yet. ([#10206](https://github.com/code-yeongyu/oh-my-openagent/pull/10206))\n\n**`runtime_fallback` moves to the next model when a Cursor pool is spent.** cursor-opencode-provider reports a spent pool as `capacity_limit`, which the fallback classifier did not recognize, so the session ended on the error instead of trying the next rung of the chain. It is now treated like the `resource_exhausted` error it replaces. ([#10170](https://github.com/code-yeongyu/oh-my-openagent/issues/10170), [#10224](https://github.com/code-yeongyu/oh-my-openagent/pull/10224))\n\n- 663629894 Merge pull request #10566 from code-yeongyu/fix/release-binary-size-budget\n- ce54c09ca docs(changelog): carry 5.1.37 into [Unreleased] for 5.1.38 and note the size budget (#10566)\n- e54e97360 fix(release): raise the release binary size budget to 182 MiB, measured\n- 3772ec56a Merge pull request #10559 from code-yeongyu/release/v5.1.37-source-state\n- cc0282033 docs(changelog): link #10552 from the 5.1.37 adoption lines\n- 5273cc11d Merge pull request #10542 from code-yeongyu/release/v5.1.36-source-state\n- fd3da875c Merge pull request #10434 from code-yeongyu/memsync/memcore-linux-skip-intrinsic\n- 29a2da5f7 Merge pull request #10412 from code-yeongyu/memsync/recovery\n- a77a19e58 Merge remote-tracking branch 'origin/dev' into memsync/recovery\n- 1424efcb8 Merge pull request #10122 from code-yeongyu/fix/rpc-seam-11-resumed-snapshot\n- 0c319f428 Merge remote-tracking branch 'origin/dev' into fi