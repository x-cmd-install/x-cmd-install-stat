e1791f95da83cc8cefe9f693ae4d4268d101352680671edca9d6927b4a1","download_count":8,"created_at":"2026-10-31T16:03:42Z","updated_at":"2026-10-31T16:03:43Z"},{"id":695818046,"node_id":"RA_kwDOQheEEc4peVc-","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5250560,"digest":"sha256:8b6599d183fcefe510deab9af1644590dc912a5cc3afb974a88033fb9d11e659","download_count":11,"created_at":"2026-10-31T16:03:42Z","updated_at":"2026-10-31T16:03:43Z"},{"id":695817960,"node_id":"RA_kwDOQheEEc4peVbo","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1136,"digest":"sha256:23ea77f91f1c8b89086be5c2b035987bcfac86feb4a219bcec1dec1c1f560254","download_count":37,"created_at":"2026-10-31T16:03:40Z","updated_at":"2026-10-31T16:03:40Z"}],"body":"5.1.53 and 5.1.52 were not published; their changes, listed under 5.1.53 and 5.1.52 below, ship in this release.\n\n**The `programming` skill's Go scaffolder writes LF files on every platform.** A checkout that converts line endings (Windows with `autocrlf`) no longer leaks CRLF into the project it generates; the templates are pinned to LF in `.gitattributes` and normalised on read. ([#11991](https://github.com/code-yeongyu/oh-my-openagent/pull/11991))\n\n**The `programming` skill's Python, Rust, and Go project scaffolders run on Bun, so Rust and Go users no longer install uv and typer just to start a project.** `bun run scripts/python/new-project.ts`, `scripts/python/new-script.ts`, `scripts/rust/new-project.ts`, and `scripts/go/new-project.ts` replace the old `uv run ... .py` commands and produce the same files. A missing `uv` or `cargo` now ends with a clear message and exit code 1, and a missing `go` still writes a fallback `go.mod`. ([#11970](https://github.com/code-yeongyu/oh-my-openagent/pull/11970))\n\n**The programming skill routes every test file to a testing reference that carries the four-question authoring gate and the junk-test classes.** Writing, reshaping, or deleting a test now loads `references/testing/README.md` (Given/When/Then, the mock ladder, determinism, the prompt-test rule, and a \"test your test\" mutation step) and `references/testing/junk-classes.md` (the one table of junk classes, retention bar, and R/F/C/D marks that the gate reviewer applies), so a test that would be deleted in review is a test the skill stops you from writing. ([#11967](https://github.com/code-yeongyu/oh-my-openagent/pull/11967))\n\n### Fixed\n\n- The release check for the macOS keychain helper accepts a correctly signed helper again: it ignores the `/* exists */` notes `codesign` prints in the designated requirement, and still rejects a different identifier or team (#11980). ([#11981](https://github.com/code-yeongyu/oh-my-openagent/pull/11981))\n\n- 82c1bb9a34 docs(release): note that 5.1.53 and 5.1.52 ship in 5.1.54\n- c4312cd8bd Merge pull request #11991 from code-yeongyu/fix/go-scaffolder-crlf-11990\n- 27f46b9a1b docs(changelog): fragment for #11991\n- 4583ba1812 fix(programming): the go scaffolder writes LF on a CRLF checkout\n- c7cfbc1c4b Merge pull request #11967 from code-yeongyu/test-rules/programming-testing-refs\n- b3660e554c Merge pull request #11981 from code-yeongyu/fix/keychain-helper-annotated-requirement\n- d08cbb9d59 Merge pull request #11970 from code-yeongyu/test-rules/scripts-bun-ts\n- 99927cbd8e test(qa): refresh Linux E21-E24 for the programming skill description (#11967)\n- 0772cc77df docs(changes): fragment for #11981\n- bb23b08327 fix(release): accept codesign's annotated designated requirement for the keychain helper\n- 35a550978a Merge origin/dev (