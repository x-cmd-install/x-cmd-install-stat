,"digest":"sha256:1cfcd93569e3418124076aee70a6dc111b18a3fa4feca3c60f2dab65b3e81b39","download_count":11,"created_at":"2026-11-16T19:29:20Z","updated_at":"2026-11-16T19:29:22Z"},{"id":756149332,"node_id":"RA_kwDOQheEEc4tEexU","name":"senpi-desktop-engine-win32-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":5264896,"digest":"sha256:b2c0a1d2b0dc33bac3678c3619569ca387b9c4d0343ed2bea824df4a9b0c6733","download_count":10,"created_at":"2026-11-16T19:29:20Z","updated_at":"2026-11-16T19:29:21Z"},{"id":756149391,"node_id":"RA_kwDOQheEEc4tEeyP","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":6276608,"digest":"sha256:0eadbd33045da41207202e40d062547b9bb9f6597ec919f87c6624a8730857ad","download_count":16,"created_at":"2026-11-16T19:29:21Z","updated_at":"2026-11-16T19:29:22Z"},{"id":756149238,"node_id":"RA_kwDOQheEEc4tEev2","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1232,"digest":"sha256:33db4906de8f14674ec0c0ec2c2b3e44a5878ce0b651b59e240ad829157cb0dc","download_count":327,"created_at":"2026-11-16T19:29:18Z","updated_at":"2026-11-16T19:29:18Z"}],"body":"### Fixed\n\n- `omo remote devices` shows this device offline while its device service is not connected, and `omo remote sessions --device` naming a device the account does not have reports it instead of listing nothing. ([#13916](https://github.com/code-yeongyu/oh-my-openagent/pull/13916))\n- Memory sync's own test suite no longer fails a later, unrelated test when one test times out while a sync cycle is still running: device teardown in the tests now stops the engine and waits for that cycle before removing its files, and the push-bounded test waits on the cycle instead of a fixed 30 s budget. ([#13887](https://github.com/code-yeongyu/oh-my-openagent/pull/13887), fixes [#13680](https://github.com/code-yeongyu/oh-my-openagent/issues/13680))\n- The first memory sync cycle after signing in no longer fails with \"the device's sign-in token could not be read or refreshed\" when the system keychain briefly reads nothing. That one empty read is now checked again before sync treats the sign-in as gone; signing out still stops sync at once. ([#13879](https://github.com/code-yeongyu/oh-my-openagent/pull/13879), fixes [#13739](https://github.com/code-yeongyu/oh-my-openagent/issues/13739))\n- Regenerating the computer-use prelude (`bun run generate` in `senpi-desktop-prelude`) now runs its generated method tables through `bun fmt`, so `prelude.js`, its `index.ts` allowlist and the desktop protocol tier tables stay formatter-clean instead of reverting to unformatted output at every release regeneration. The published prelude JavaScript is the formatted copy again. ([#13855](https://github.com/code-yeongyu/oh-my-openagent/pull/13855))\n\n### Changed\n\n- A memory sync capture that receives files from other devices no longer scans every known file once per received file, so a large memory catching up on many incoming files stays fast. ([#13862](https://github.com/code-yeongyu/oh-my-openagent/pull/13862))\n\n- 2ec6b5d944 ci(publish): operator-built darwin artifacts for the v5.1.75 release (workflows from #13928, merge 8f8f4d1076)\n- 89bbf71eda Merge pull request #13887 from code-yeongyu/fix/memory-sync-push-bounded-test-13680\n- 598ec2344c Merge pull request #13862 from code-yeongyu/fix/memory-sync-capture-known-set\n- c3304b602a Merge pull request #13879 from code-yeongyu/fix/memory-sync-first-receive-token-13739\n- 83422463da Merge pull request #13870 from code-yeongyu/docs/13855-pin-comment-wording\n- 9ed8307f17 Merge origin/dev into fix/memory-sync-first-receive-token-13739\n- f47c976114 chore(changes): the fragment links this PR (#13887)\n- bc1abdab02 Merge origin/dev into fix/memory-sync-push-bounded-test-13680\n- 8c3f1a1502 Merge origin/dev into fix/memory-sync-capture-known-set\n- 821eafd5a2 Merge remote-tracking branch 'origin/dev' into docs/13855-pin-comment-wording\n- 31e08cb319 Merge pull request #13916 from code-yeongyu/rt/13414-client-parity\n- 984088bb87 Merge origin/dev into fix/memory-sync-first-receive-token-13739\n- 9bd2382748 Merge pull request #13855 from code-yeongyu/fix/prelude-fmt-clean-regen\n- f865a7afc5 Merge pull request #13918 from code-yeongyu/ci/platform-decision-body-comment\n- ebeaac0e72 Merge remote-tracking branch 'origin/dev' into fix/prelude-fmt-clean-regen\n- 03e4b7e8c5 ci(pr-platform-decision): restore why the PR body is read from the event file (#13859)\n- f9f610d53a Merge pull request #13912 from code-yeongyu/ci/platform-decision-one-cap\n- add0ca2bc2 docs(changes): fragment for remote client read-path parity (#13916)\n- bca0d62dde Merge branch 'dev' into rt/13414-client-parity\n- 72cecaeec7 fix(remote): the client's devices.list and sessions.list carry #13402's CLI behaviour (#13414)\n- 02915ac7ad Merge remote-tracking branch 'origin/dev' into fix/prelude-fmt-clean-regen\n- eac1e0af78 ci(pr-platform-decision): one file-cap number, owned by the classifier (#13859)\n- 86949060a2 Merge origin/dev into fix/memory-sync-capture-known-set\n- d81b80ade6 Merge remote-tracking branch 'origin/dev' into fix/prelude-fmt-clean-regen\n- 2fc39fc83f Merge origin/dev into fix/memory-sync-first-receive-token-13739\n- 00026f3825 chore(changes): the fragment carries this PR's number (#13887)\n- 223aefb941 test(memory-sync): teardown waits for a running cycle; push-bounded waits on the cycle\