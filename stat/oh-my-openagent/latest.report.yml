t":4,"created_at":"2026-10-02T01:13:40Z","updated_at":"2026-10-02T01:13:40Z"},{"id":604495295,"node_id":"RA_kwDOQheEEc4kB92_","name":"senpi-desktop-engine-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":19737048,"digest":"sha256:13ccc50351ddfdad6e5aee1c34b23f3904cacaedc1a598ce0b3c183abd84e8e2","download_count":4,"created_at":"2026-10-02T01:13:40Z","updated_at":"2026-10-02T01:13:41Z"},{"id":604495298,"node_id":"RA_kwDOQheEEc4kB93C","name":"senpi-desktop-engine-win32-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":4386816,"digest":"sha256:a9ae10958b825532066562938a0345d2225dbfa4720d42f4b3a3d0cf048add59","download_count":12,"created_at":"2026-10-02T01:13:41Z","updated_at":"2026-10-02T01:13:41Z"},{"id":604495277,"node_id":"RA_kwDOQheEEc4kB92t","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:7f04928c21dbf7ae6c49104c15b8e096554f31d9e8910174a3d7af8a4bc5cc53","download_count":10,"created_at":"2026-10-02T01:13:39Z","updated_at":"2026-10-02T01:13:40Z"}],"body":"**In the desktop app's restricted modes, the agent's own tools stop asking for approval, and a bash call from an eval cell no longer hangs.** Files that ship with the app no longer count as outside paths, the first Python cell after a cold start works on Windows x64, and delegated tasks keep your timeout settings and run at thinking levels their models accept. This release runs on the senpi 2026.10.1-3 engine.\n\n### Fixed\n\nIn the desktop app's \"Work in this project\" and \"Ask first\" modes, senpi's own internal tools (todo, tool search, ask-user, monitor, memory) no longer ask for approval, reading files that ship inside the app no longer counts as an outside path, and a bash call from an eval cell shows its approval prompt instead of hanging. Real commands, outside reads and outside watches still ask. ([senpi#2511](https://github.com/code-yeongyu/senpi/issues/2511), [senpi#2513](https://github.com/code-yeongyu/senpi/issues/2513), [senpi#2512](https://github.com/code-yeongyu/senpi/issues/2512))\n\nOn Windows x64, the first Python cell after a cold start no longer fails with \"Python kernel did not become ready\": Python eval waits on the kernel's own readiness stages instead of a 5-second deadline and names a stalled stage in the error. This was a known issue in 5.1.8.\n\nTool search keeps working after a reload or session replacement. Thanks to @jerilkuriakose for the report. ([senpi#2509](https://github.com/code-yeongyu/senpi/issues/2509))\n\nToggle-only reasoning models offer only the thinking states their API accepts. Thanks to @effortprogrammer. ([senpi#891](https://github.com/code-yeongyu/senpi/issues/891))\n\nOn a Claude subscription, a long run survives a lost session whose re-sent conversation is rejected as too long, and images the agent read with a tool are no longer re-sent as new attachments (thanks to @willowite). ([senpi#2480](https://github.com/code-yeongyu/senpi/issues/2480), [senpi#2490](https://github.com/code-yeongyu/senpi/issues/2490))\n\nA delegated task that runs in-process now keeps your timeout and retry settings, such as `retry.provider.streamStartTimeoutMs`, instead of the built-in defaults. Thanks to @rhyme227 for the report. ([#9353](https://github.com/code-yeongyu/oh-my-openagent/issues/9353))\n\nBuiltin category chains only name thinking levels their models accept, so child sessions no longer flood `fallback.log` with `validation_warning` lines and each rung runs at its declared level instead of a silent clamp. Thanks to @markshikada for the report and the byte-compare that pinned it down. ([#9378](https://github.com/code-yeongyu/oh-my-openagent/issues/9378))\n\nOn macOS, a repeated permission denial no longer claims the privacy pane was just opened; it points at the pane opened earlier, or tells you to open it when the first attempt failed.\n\n- bcc854a49 Merge pull request #9410 from code-yeongyu/release/v5.1.9-source-state\n- 809d7428e Merge pull request #9409 from code-yeongyu/docs/changelog-5.1.9-notes\n- a4be3694f docs(changelog): add the 5.1.9 notes\n- edbf8356b Merge pull request #9396 from code-yeongyu/fix/9245-skipped-legs-not-green\n- 5527b9f3b Merge branch 'dev' into fix/9245-skipped-legs-not-green\n- 5d0c1bd5d Merge pull request #9394 from code-yeongyu/fix/gateway-hook-windows-8dot3\n- b13ec4b6a fix(omo-native): resolve gateway package paths with realpathSync.native on Windows\n- 50ac0636d Merge pull request #9392 from code-yeongyu/fix/copy-tree-test-tmpdir\n- d84db06fc Merge pull request #9243 from code-yeongyu/feat/gateway-hook\n- 9667ee46b test(isolation-core): use the OS temp dir in the copy-tree self-destination test\n- 96c801530 Merge pull request #9388 from code-yeongyu/ci/9219-rpc-host-isolation\n- 2c1c46bab feat(omo-native): pass the plugin root and thread SDK URL to the gateway host\n- 8b27d4e00 fix(omo-native): verify the installed gateway package before loading it\n- e2c71a80c fix(omo-native): distinguish broken gateway host from absent package\n- d3f06d075 feat(omo-native): load a separately installed gateway through a minimal hook\n- 408065584 Merge branch 'dev' into ci/9219-rpc-host-isolation\n- 9ab137a29 Merge pull request #9382 from code-yeongyu/fix/9378-builtin-fallback-variants\n- 87953a414 ci(windows): contain the Bun rpc-host worker crash in its own retried invocation (refs #9219)\n- ac28307c1 Merge pull request #9376 from code-yeongyu/fix/macos-permission-repeat-wording\n- 4fe86f80a test(desktop-macos): name the repeat-denial tests after what they assert\n- a53213924 fix: clarify repeated macOS permission denials\n- 5e980d895 Merge remote-tracking branch 'origin/dev' into fix/9378-builtin-fallback-variants\n- cb7244b4f Merge pull request #9377 from code-yeongyu/fix/9353-in-process-child-settings\n- 1c7f6d259 Merge remote-tracking branch 'origin/dev' into fix/9353-in-process-child-settings\n- f4ec0065c Merge pull request #9384 from code-yeongyu/fix/9383-fake-clock-try-update\n- 9fbec6f75 build(desktop): pin the Rust toolchain to 1.99.0\n- 72728613b fix(desktop): replace the deprecated fetch_update in the fake clock\n\n**Thank you to 1 community contributor:**\n- @effortprogrammer:\n  - fix(omo-native): distinguish broken gateway host from absent package\n\n```bash\nbun add -g omo-ai\n```","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":5}
