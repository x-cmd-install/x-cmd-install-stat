a9c84cf44b0f494c6a8795079a7f21accb14c8711146d974b8e83bf","download_count":0,"created_at":"2026-10-23T05:11:37Z","updated_at":"2026-10-23T05:11:38Z"},{"id":668043311,"node_id":"RA_kwDOQheEEc4n0Ygv","name":"SHA256SUMS","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1040,"digest":"sha256:a71e393eb95f16a987cedcd6cef12079b4027c6796b90d960378561bad70abc2","download_count":0,"created_at":"2026-10-23T05:11:35Z","updated_at":"2026-10-23T05:11:35Z"}],"body":"**The engine moves to senpi 2026.10.21-3: long 1M-context conversations stop re-writing their cached prefix, Anthropic subscription context is counted once, and \"No credential slots available\" no longer locks every account out ([#10965](https://github.com/code-yeongyu/oh-my-openagent/pull/10965)).** When context reduction trims a long conversation on a 1M window, the reduced prefix now stays identical and keeps its cache checkpoint, so each step writes only what changed. Anthropic subscription turns with internal SDK re-requests no longer double the context percentage or start compaction early, and a configured compaction model now summarizes while your session provider is healthy, overflow recovery included. The subscription lane is the only layer that picks its accounts, so one revoked or briefly rate-limited account no longer blocks the rest until you log in again. Every turn end says what happens next, a turn-end report names the hold your queued message released, the trailing \"Anything else? (optional)\" card is gone from clients without native questions, and moving a session between machines runs through one implementation. Forced recovery after a context overflow no longer picks the same compaction cut again when an invisible entry leads the session; an overflow still never moves a task to its next fallback model.\n\n- 484685379e Merge pull request #10998 from code-yeongyu/release/v5.1.44-source-state\n- db09ca13a6 docs(changelog): 5.1.44: a configured compaction model also covers overflow recovery\n- a2595cb6ef Merge pull request #10970 from code-yeongyu/fix/telemetry-spool-recovery-test-no-wallclock\n- 5a98fb002c Merge remote-tracking branch 'origin/dev' into fix/telemetry-spool-recovery-test-no-wallclock\n- 820426fe04 Merge pull request #10984 from code-yeongyu/fix/env-isolation-test-windows\n- 9aa25019a3 Merge remote-tracking branch 'origin/dev' into fix/telemetry-spool-recovery-test-no-wallclock\n- 651620f74e chore(deps): regenerate the plugin bundles after merging dev\n- 541c6029ea Merge pull request #10966 from code-yeongyu/fix/tests-never-replace-process-env\n- 4cc2e162b3 Merge remote-tracking branch 'origin/dev' into fix/tests-never-replace-process-env\n- bc9452cc84 Merge pull request #10962 from code-yeongyu/test/10959-takeover-trace\n- ecb7a0ef89 Merge remote-tracking branch 'origin/dev' into test/10959-takeover-trace\n- 3f7ec769ba Merge remote-tracking branch 'origin/dev' into fix/tests-never-replace-process-env\n- 7d7925141a Merge remote-tracking branch 'origin/dev' into fix/telemetry-spool-recovery-test-no-wallclock\n- 84bc5a1b00 test(telemetry-core): assert shutdown deadline order and cap, not wall-clock budgets\n- 22204690bb test(memory-core): takeover trace job fails on a failed run; every test phase is bounded\n- 9528599d72 test(memory-core): writer child imports existsSync through the resilient fs module\n- bcbad0693d test(memory-core): the SIGKILL takeover test waits on events, not a 30 s budget\n- 31382c3022 test(memory-core): opt-in timeline for the SIGKILL takeover test, plus a 3-OS measurement workflow\n\n```bash\nbun add -g omo-ai\n```\n"}
