t\" colspan=\"4\"><a href=\"https://github.com/terminaldweller\"><img width=\"80\" src=\"https://avatars.githubusercontent.com/u/20871975\"></a></td>\r\n  </tr>\r\n  <tr>\r\n    <td>Nicolas&nbsp;Évrard<br>@nicoe</td>\r\n    <td>Robert Ricci<br>@ricci</td>\r\n    <td>Igor&nbsp;Serebryany<br>@igor47</td>\r\n    <td align=\"left\" colspan=\"2\">Andreas Bulling<br>@andreas-bulling</td>\r\n    <td align=\"left\" colspan=\"4\">Farzad Sadeghi<br>@terminaldweller</td>\r\n  </tr>\r\n</table>\r\n\r\n- Robert Labudda\r\n- Morgan Kelly\r\n- Tiziano Zito (@otizonaizit)\r\n- Anonymous (BitCoin)\r\n- Matti Klock (@mattiklock)\r\n\r\n[Become a sponsor of NeoMutt](https://neomutt.org/sponsor)\r\n\r\n## ❤️ Thanks\r\n\r\nMany thanks to our **new contributors**:\r\n\r\n- Javeed Khan (@jmestwa-coder)\r\n- funsafemath (@funsafemath)\r\n- Bernhard M. Wiedemann (@bmwiedemann)\r\n- Dennis Eriksen (@dennisse)\r\n\r\nand our **regular contributor**:\r\n\r\n- Rayford Shireman (@rayfordshire)\r\n\r\n## 🔒 Security\r\n\r\n- #4900 bcache: sanitize mailbox names that escape the cache dir\r\n- #4901 auth_gss: fix out-of-bounds read of GSS security token\r\n\r\n## 🐞 Bug Fixes\r\n\r\n- #4866 Fix broken message-hook in the pager\r\n- #4869 Fix duplicate \"no mail\" message\r\n- #4874 Restore the `-C` command-line flag\r\n- #4882 Refresh notmuch tag completion cache, and fix a tag completion crash\r\n- #4893 Fix index-format-hook parsing\r\n- #4897 Allow `<entire-thread>` from any mailbox type, and fix a related crash\r\n- email: fix header rewind after mbox separator\r\n- imap: retry login after a failure\r\n- maildir/notmuch: fix memory leak\r\n- config: fix inherited has_been_set\r\n- main: fix inverted condition in init_nntp\r\n\r\n## ⚙️ Code\r\n\r\n- test: fix conddate after 2038\r\n\r\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":3,"rocket":0,"eyes":0},"mentions_count":17}
