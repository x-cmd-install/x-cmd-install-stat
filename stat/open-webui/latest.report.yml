{"id":457901459,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKdDCc84bSwWT","tag_name":"v0.13.5","target_commitish":"main","name":"v0.13.5","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-25T09:37:38Z","updated_at":"2026-11-25T09:37:55Z","published_at":"2026-11-25T09:37:55Z","assets":[],"body":"\n### Added\n\n- **Folder workspaces.** Run your project’s tests in a terminal and try the app in a browser while your chat stays open beside them. Choose the computer and project directory once for the folder. Even in a shared folder, everyone can return to their own tabs and layout. If you used the standalone Open WebUI Computer (cptr) app, that workflow is now built into Open WebUI. [#34804](https://github.com/open-webui/open-webui/pull/34804), [#34805](https://github.com/open-webui/open-webui/pull/34805), [#34800](https://github.com/open-webui/open-webui/issues/34800), [#34803](https://github.com/open-webui/open-webui/issues/34803)\n- **Project instructions and skills.** Tell the assistant how your project works once in an `AGENTS.md` or `CLAUDE.md` file. Every new chat in that project folder reads those instructions. Connect the project machine with Open Terminal 0.18.0 or later and the assistant can also follow reusable project instructions called skills, run checks in your terminal and inspect the result in your browser tab.\n- **Long chat performance.** Sending a message was 34× faster in our 130 MB PostgreSQL test chat. The server accepted it in 0.32 seconds, down from 10.9, because it now saves just the messages that changed. Database writes fell from 533 MB to 2 KB per message. [#34689](https://github.com/open-webui/open-webui/pull/34689), [#34671](https://github.com/open-webui/open-webui/pull/34671), [#34688](https://github.com/open-webui/open-webui/issues/34688), [#34672](https://github.com/open-webui/open-webui/issues/34672), [#34674](https://github.com/open-webui/open-webui/issues/34674), [#34670](https://github.com/open-webui/open-webui/issues/34670), [#34646](https://github.com/open-webui/open-webui/issues/34646)\n- **Automatic model selection.** Put one router in the chat’s model picker and it can send coding questions to one model and writing requests to another. Admins choose text patterns or describe the kind of question each model should handle. If nothing matches, the router uses the first model on its list or picks one at random. [#34900](https://github.com/open-webui/open-webui/pull/34900), [#34895](https://github.com/open-webui/open-webui/pull/34895), [#34791](https://github.com/open-webui/open-webui/pull/34791), [#34796](https://github.com/open-webui/open-webui/pull/34796), [#34908](https://github.com/open-webui/open-webui/pull/34908), [#34662](https://github.com/open-webui/open-webui/pull/34662), [#34956](https://github.com/open-webui/open-webui/pull/34956), [#34957](https://github.com/open-webui/open-webui/pull/34957), [#34887](https://github.com/open-webui/open-webui/issues/34887), [#34786](https://github.com/open-webui/open-webui/issues/34786), [#34793](https://github.com/open-webui/open-webui/issues/34793), [#34897](https://github.com/open-webui/open-webui/issues/34897), [#34898](https://github.com/open-webui/open-webui/issues/34898), [#34466](https://github.com/open-webui/open-webui/discussions/34466), [#15996](https://github.com/open-webui/open-webui/discussions/15996)\n- **Citations beside the chat.** Hover over a source number for a quick excerpt, or click it to read the evidence beside the answer. You can compare passages from the same document, see how closely they match your question and jump to the cited PDF page when page information is available. [#34923](https://github.com/open-webui/open-webui/pull/34923), [#34836](https://github.com/open-webui/open-webui/pull/34836), [#34921](https://github.com/open-webui/open-webui/issues/34921), [#34828](https://github.com/open-webui/open-webui/issues/34828), [#34831](https://github.com/open-webui/open-webui/issues/34831), [#34832](https://github.com/open-webui/open-webui/issues/34832), [#34833](https://github.com/open-webui/open-webui/issues/34833), [#34913](https://github.com/open-webui/open-webui/issues/34913), [#34834](https://github.com/open-webui/open-webui/issues/34834), [#34829](https://github.com/open-webui/open-webui/issues/34829), [#20829](https://github.com/open-webui/open-webui/discussions/20829)\n- **Steer a coding agent while it works.** If Codex or Claude Code starts editing the wrong file, send a correction in the same chat. The coding agent can act on a text follow-up while the job is running. A follow-up with attachments waits for the next turn so the agent receives the instruction and files together.\n- **Recurring tasks can continue a conversation.** Schedule a morning status report in the same chat or channel thread each day. The automation reads the replies people added since its last run, so today’s report can account for a decision someone posted yesterday afternoon. [#33731](https://github.com/open-webui/open-webui/discussions/33731)\n- **Use a remote computer from chat.** Connect a workstation over SSH, the same secure connection you use to log in remotely, and work with its files and command-line tools from chat. This setup requires Open Terminal 0.17.21 or later and supports Linux on x86-64 or ARM64 and Apple silicon Macs.\n- **Follow work delegated by a chat.** When the assistant gives a task to another agent, open Status in the original chat and choose the agent under Threads. You can read its progress, approve a tool call or stop the job. Status also shows how much of the model’s available space for messages is in use and how many messages and tasks are waiting. [#34917](https://github.com/open-webui/open-webui/issues/34917), [#33262](https://github.com/open-webui/open-webui/issues/33262), [#34408](https://github.com/open-webui/open-webui/discussions/34408)\n- **Generate videos with ComfyUI.** Describe a scene or attach a starting image to make a video in chat. Admins import a video-generation workflow from ComfyUI into Admin Settings > Images & Videos in API format and choose which inputs control the prompt, dimensions, frame count and frame rate. People using chat can then run it without opening ComfyUI. [#6343](https://github.com/open-webui/open-webui/issues/6343)\n- **Ask another saved chat for help.** With sub-agents enabled, a planning chat can ask one of your coding chats why it chose a particular approach. An idle chat wakes up to handle the question, while a busy chat receives it between tool calls. A link shows the receiving chat which conversation asked.\n- **Start an automation from another service.** A form submission can now trigger a task in Open WebUI and pass the submitted answers into its prompt. Give the form service the automation’s secret webhook URL so it knows where to send the data. The same task can also run on a schedule. [#26090](https://github.com/open-webui/open-webui/issues/26090)\n- **Share an automated task.** Let teammates see a task’s past runs or give them permission to run it and change its schedule. When someone starts a shared automation, it runs with the owner’s permissions. The owner controls its instructions, model, variables and the secret URL external services use to trigger it. [#29527](https://github.com/open-webui/open-webui/discussions/29527)\n- **Faster chat opening.** Start typing in a new chat while models and tools load. Reopening a saved chat also fetches the conversation and model list in parallel. In a 500-message test on a 5 Mbit/s connection, the messages appeared and the input was ready about a second sooner. [#34869](https://github.com/open-webui/open-webui/pull/34869), [#34842](https://github.com/open-webui/open-webui/pull/34842), [#34868](https://github.com/open-webui/open-webui/issues/34868), [#34841](https://github.com/open-webui/open-webui/issues/34841), [#34863](https://github.com/open-webui/open-webui/issues/34863), [#34874](https://github.com/open-webui/open-webui/issues/34874), [#34919](https://github.com/open-webui/open-webui/issues/34919)\n- **Faster startup with connected tools.** After a restart, people can use chat while the server finishes connecting to external tools and machines. Even deployments without a shared Redis cache can reuse connection details on later requests, so opening another chat doesn’t repeat the same setup. [#34856](https://github.com/open-webui/open-webui/pull/34856), [#34866](https://github.com/open-webui/open-webui/pull/34866), [#34855](https://github.com/open-webui/open-webui/issues/34855), [#34865](https://github.com/open-webui/open-webui/issues/34865)\n- **Notes in folders.** Keep a project brief in the same sidebar folder as the chats where you discuss it. Drag the note into the folder and it inherits the folder’s read or edit access, so the people already working there can use it too. [#34894](https://github.com/open-webui/open-webui/issues/34894), [#24242](https://github.com/open-webui/open-webui/discussions/24242)\n- **Conversation-wide citations.** A source keeps its number throughout a saved conversation. If a model cites a report as “source 3,” you can come back several replies later, ask how source 3 supports a claim and still be talking about the same report.\n- **Preview the files behind an answer.** Search a knowledge base you’ve attached to a chat and open its files beside the conversation to check what they contain. When attaching a large document, you can choose whether the assistant reads it in full or retrieves passages relevant to your question.\n- **Limit how much tool output reaches the model.** A command can return a log so long that the model has little room left for earlier messages. Set `TOOL_OUTPUT_MAX_CHARS` to limit how many characters from each result go into the conversation. If a machine is connected, the model can still open the full output as a file. [#30110](https://github.com/open-webui/open-webui/issues/30110)\n- **Faster shared chat search.** Find an old conversation faster, even on a site where thousands of chats have been shared. Search checks which chats you can open before looking through messages. In one PostgreSQL test with 61,000 chats, a two-word search under All fell from 18.2 seconds to 1.4. [#34911](https://github.com/open-webui/open-webui/pull/34911), [#34903](https://github.com/open-webui/open-webui/issues/34903)\n- **Faster page loads.** A plain chat now loads without making your browser download the terminal, spreadsheet viewer or code highlighter up front. Those features load when you use them, so there’s less to fetch before you can start a conversation. [#34890](https://github.com/open-webui/open-webui/pull/34890), [#34888](https://github.com/open-webui/open-webui/issues/34888)\n- **Run commands on the Open WebUI server.** Admins running a single Open WebUI instance can grant selected people permission to use the server itself as a machine in chat. This experimental setup requires Open Terminal 0.17.21 or later. Commands run on the same computer that hosts Open WebUI.\n- **Folder chat priorities.** Move a chat from routine work to an urgent follow-up by dragging its card on the folder board. A single move sets both status and priority, and the board’s filters help the team find conversations that need attention first.\n- **Resume unfinished work from the home page.** The Continue section on the home page shows up to three project folders with work in progress. Chats waiting for your approval come first, so you can jump straight to a conversation where the assistant needs permission to run a tool.\n- **Act on GitHub review feedback.** When reviewing a GitHub pull request in Open WebUI, choose Address feedback to send your coding agent the unresolved comments and the lines of code they refer to. With Open Terminal 0.18.1 or later, the agent has the reviewer’s instructions and their location without anyone copying them into chat.\n- **Docked note chats.** Keep the note you’re writing and the chat you’re consulting visible side by side. Ask about a passage or work through a revision, then collapse the conversation when you want the full width back for writing.\n- **Cloud file selection.** Pick several Google Drive or OneDrive files at once to ask a question about a whole set of documents. If a download fails, the picker identifies the file that needs another try, so you don’t have to work out which attachment is missing.\n- **Choose when the model reads a whole document.** For uploaded files, the default cutoff between sending the whole text and retrieving relevant passages is 50,000 characters per file. Admins can change the cutoff with `RAG_FULL_TEXT_THRESHOLD` and use `RAG_FULL_TEXT_THRESHOLD_TYPE` to count tokens, the units a model uses to measure how much text it can read. [#34712](https://github.com/open-webui/open-webui/discussions/34712)\n- **User directory tool.** Give a model access to the user directory independently of chat history. Enable its Users tool and it can look up a colleague you mention by name, even on a deployment where the Chats tool is turned off. [#34713](https://github.com/open-webui/open-webui/issues/34713)\n- **Share a machine setup across a site.** Admins can make a machine template public so everyone on the site can choose the same setup when connecting a computer to chat. When someone shares a chat, the dialog explains when granting permission to reply can also grant access to the connected computer and its files.\n- **Prepare a machine for project work.** Choose which directory a managed terminal opens in and which options it starts with. On supported Debian or Ubuntu machines, Open Terminal 0.17.22 or later can also install extra packages over an SSH connection if the remote account can run administrator commands with sudo without a password. [#34916](https://github.com/open-webui/open-webui/pull/34916), [#34915](https://github.com/open-webui/open-webui/issues/34915), [#34808](https://github.com/open-webui/open-webui/issues/34808)\n- **Record audio in chat.** Use Capture in the message input to add a spoken explanation to a chat or note, record shared audio, or take a desktop screenshot. On a phone you can also open the camera to show the model what you’re looking at.\n- **Discover tools on demand.** A model can see the names of tools it can load when it needs them. If the available tools change often, admins can turn off `TOOL_SEARCH_LIST_TOOLS` to omit that list from the prompt, letting the provider reuse previously processed instructions across requests.\n- **Limit simultaneous automation runs.** If several scheduled tasks start at the same time, each server worker can now run a set number and queue the rest. Set `AUTOMATION_MAX_CONCURRENT` to choose the limit per worker. By default, all runs can start as soon as they’re ready.\n- **Choose which requests to audit.** Admins can now see which background task made a model request, filter logged OpenAI and Ollama requests by URL path, and record activity from visitors before they sign in by enabling `ENABLE_AUDIT_ANONYMOUS_REQUESTS`. [#34665](https://github.com/open-webui/open-webui/pull/34665), [#33249](https://github.com/open-webui/open-webui/issues/33249)\n- **Audit log details.** See whether a request succeeded or failed at any audit level. Successful sign-ins and sign-ups identify the account, and supported model requests record which model handled them, giving admins more to go on when tracing an incident. [#34663](https://github.com/open-webui/open-webui/pull/34663), [#34664](https://github.com/open-webui/open-webui/pull/34664), [#33249](https://github.com/open-webui/open-webui/issues/33249)\n- **Check the audit log before accepting traffic.** If your deployment must record requests to a file, enable `ENABLE_AUDIT_LOGS_FILE_STARTUP_CHECK` alongside file auditing. Open WebUI then checks that it can open the audit log before serving requests and stops startup if it can’t.\n- **Sidebar chat filters.** Bring archived conversations back into view without leaving the sidebar. Show active chats, archived chats or both, restore a chat where you find it and keep your preferred filters and sort order the next time you use that browser.\n- **Note tags and search.** Organize notes and chats under the same colored project tags. If you remember a phrase from a note but forget its title, search the note text and rename the match right in the results. [#34792](https://github.com/open-webui/open-webui/pull/34792), [#34787](https://github.com/open-webui/open-webui/issues/34787)\n- **Download files from apps inside chat.** An app embedded in a conversation through the Model Context Protocol (MCP) can offer a file, such as a generated report, for download. Review the names or links and save the files directly from the chat where the app produced them.\n- **Keep reasoning across follow-up questions.** If you connect models through vLLM or OpenRouter using an OpenAI-compatible endpoint, choose the matching provider type in the connection settings. Open WebUI sends the model’s earlier reasoning back in the format that service needs when someone asks a follow-up.\n- **Open a PDF to the page behind a citation.** If your site uses MinerU to extract text from PDFs, Open WebUI now keeps the page number whenever MinerU can match a passage to its page. Click the citation in an answer to open that page, even if the quoted passage is buried deep in a report.\n- **Faster sidebar folders.** Your sidebar can show folders full of documents without reading the contents of every file you uploaded. In a test with 30 folders and 240 files, the folder list loaded in 44–61 milliseconds, down from 335. Files shared by someone else still get their usual access check. [#34862](https://github.com/open-webui/open-webui/pull/34862), [#34861](https://github.com/open-webui/open-webui/issues/34861)\n- **Fit more tool results in a conversation.** When a tool returns structured data, chat shows the indented version for people to read and sends the model a copy with unnecessary whitespace removed. In one Open Terminal file listing, compacting the JSON cut the model’s input from 1,013 tokens to 672, leaving room for more conversation history. [#34640](https://github.com/open-webui/open-webui/pull/34640), [#34639](https://github.com/open-webui/open-webui/issues/34639)\n- **Lighter tool animations.** A running tool can keep showing progress without making the browser recalculate the layout of the whole conversation for each animation frame. That reduces CPU use while you’re waiting for a long-running tool to finish. [#34625](https://github.com/open-webui/open-webui/pull/34625), [#34624](https://github.com/open-webui/open-webui/pull/34624), [#34623](https://github.com/open-webui/open-webui/issues/34623)\n- **See which tool the assistant is using.** When the assistant runs a built-in tool, the chat now labels the action even if the model didn’t name the step. You can follow what the assistant is doing during a run before its final answer arrives.\n- **Readable provider errors.** Errors from a model provider keep their line breaks, links and code formatting, so you can read the instructions or follow a troubleshooting link directly from chat. [#34954](https://github.com/open-webui/open-webui/pull/34954), [#34955](https://github.com/open-webui/open-webui/pull/34955), [#34950](https://github.com/open-webui/open-webui/issues/34950), [#34951](https://github.com/open-webui/open-webui/issues/34951)\n- **Send the first message in a project folder.** When you start a folder chat, your first message appears while Open WebUI prepares the directory where the assistant will work. If setup fails, the message and its attachments return to the input so you can retry with everything in place.\n- **Reorganized admin settings.** Admin Settings now groups connections under Integrations, image and video settings under Images & Videos, and Code Execution and Pipelines under Legacy, with old Apps and Videos links opening their new tabs. [#34733](https://github.com/open-webui/open-webui/pull/34733), [#34731](https://github.com/open-webui/open-webui/issues/34731)\n- **Drag into split view.** Pull a reference note from the Notes page, or another chat from a folder list, onto the side of an open conversation. Both stay visible while you compare answers or write with the source material in view.\n- **Mobile terminal keys.** Use familiar shell shortcuts from a phone. The terminal adds a row with Tab for completing a path, Ctrl for commands such as Ctrl+C, Esc, and arrow keys for navigating the command line.\n- **Custom theme colors.** Choose and preview your own text and background colors for light and dark mode under Settings > General > Colors, with separate palettes saved in each browser. [#17909](https://github.com/open-webui/open-webui/discussions/17909)\n- **Recent chats.** When a model has no suggested prompts, the new-chat screen gives you five recent conversations to pick up. Chats waiting for approval are marked, so work you can unblock is visible before you start something new.\n- **Sidebar folder order.** Drag your own sidebar folders above or below each other to set their order, or drop one inside another to create a subfolder.\n- **Discuss a shared item while reviewing it.** Open the comments beside a model, knowledge base, prompt, skill or tool on the Workspace page. For example, teammates reviewing a shared prompt can read its exact wording and reply to each other with the prompt still in view.\n- **Automation run history.** Track down the first time an automation produced an unexpected result. Its Activity view includes the creation date, can load earlier runs and lets you sort oldest first to follow the history from the beginning.\n- **Faster model settings.** Open a model’s saved settings while the available voices, tools and skills are still loading. Saving during that wait preserves earlier selections. The Workspace Models list and the Models and Interface pages in Admin Settings also open sooner. [#34871](https://github.com/open-webui/open-webui/pull/34871), [#34873](https://github.com/open-webui/open-webui/pull/34873), [#34891](https://github.com/open-webui/open-webui/pull/34891), [#34844](https://github.com/open-webui/open-webui/pull/34844), [#34870](https://github.com/open-webui/open-webui/issues/34870), [#34872](https://github.com/open-webui/open-webui/issues/34872), [#34889](https://github.com/open-webui/open-webui/issues/34889), [#34843](https://github.com/open-webui/open-webui/issues/34843)\n- **Faster settings saves.** Change a personal preference without waiting for every connected provider to return its model list again. The difference is especially noticeable on installations with several providers or one that is slow to respond. [#34847](https://github.com/open-webui/open-webui/pull/34847), [#34846](https://github.com/open-webui/open-webui/issues/34846)\n- **Model profile images.** Model lists no longer carry the full contents of every newly added profile picture. Images are stored separately so large pictures don’t hold up browsing, and exporting a model still bundles its picture for the next installation. [#34656](https://github.com/open-webui/open-webui/issues/34656)\n- **Tab group overview.** Working with two conversations side by side? Open Overview from either tab group’s + menu to jump to an earlier message in that group’s active chat while the other conversation stays in view. [#34770](https://github.com/open-webui/open-webui/pull/34770), [#34496](https://github.com/open-webui/open-webui/discussions/34496)\n- **Edit a connection from chat.** Admins can open Integrations from the chat input, then click a connection’s address to edit its settings. This also works for a disabled connection, so you can correct the address before turning it back on. [#34946](https://github.com/open-webui/open-webui/pull/34946), [#34945](https://github.com/open-webui/open-webui/discussions/34945)\n- **Find notes and manage scheduled tasks.** On the Notes page, filters now have their own controls separate from sort order and layout. On the Automations page, use the header to search tasks, filter by status or select several automations for an action together.\n- **Clearer notifications.** A success, a warning and an error now have distinct notification icons. You can tell at a glance which message needs attention and dismiss an individual notice as soon as you’ve read it.\n- **Personalized chat greetings.** A new chat greets you by first name and time of day when neither the model nor your interface settings supply custom welcome text.\n- **Recognize people by their initials.** When someone hasn’t uploaded a profile picture, Open WebUI shows their initials in a consistent color so you can recognize them across conversations. The avatar uses a single character for Chinese, Japanese and Korean names.\n- **Calendar backgrounds.** If you’ve set a page background image, it now shows behind events in the calendar too. [#34813](https://github.com/open-webui/open-webui/pull/34813), [#34812](https://github.com/open-webui/open-webui/discussions/34812)\n- **About page links.** Open Settings > About to find the enterprise documentation, community links, careers and sponsorship information.\n- **Accessibility improvements.** Use the keyboard to open a cited source and keep your place when toggling a note’s chat or deleting a list item. Screen readers also announce which setting each switch controls, so the action makes sense as you move through a settings page.\n- **Server startup, saves and audit records.** Server maintenance changes shorten the wait for Open WebUI to start and improve reliability when it saves data or records requests in the audit log.\n- **Translation updates.** More interface text, including greetings and settings, is available in your chosen language, with updates to regional Arabic, Chinese, English, French and Portuguese variants and both Uzbek scripts.\n\n### Fixed\n\n- **Security Advisory.** Update Open WebUI deployments to 0.13.5 promptly to receive this release’s security fixes. The project will publish details in its security advisories once the fixes have CVE identifiers, the public reference numbers used to track vulnerabilities. [Advisories](https://github.com/open-webui/open-webui/security)\n- **Organization sign-in with OpenID Connect.** If your organization uses OpenID Connect for single sign-on, people can now sign in when the identity provider uses HS256 to sign its proof of identity. Open WebUI verifies the signature with the shared client secret, so the provider can keep its existing signing setup. [#34930](https://github.com/open-webui/open-webui/pull/34930), [#34922](https://github.com/open-webui/open-webui/issues/34922)\n- **Integration settings load errors.** A connection list that fails to load in Admin Settings > Integrations now shows an error. You can save changes elsewhere on the page and the existing connections in that list stay intact, even though you couldn’t see them.\n- **Queued chat attachments.** Attach a file and queue a question about it while the model is still answering your previous message. When the follow-up reaches the front of the queue, the model gets the attachment with the question you wrote about it. [#34935](https://github.com/open-webui/open-webui/pull/34935), [#34933](https://github.com/open-webui/open-webui/issues/34933)\n- **Channel message delivery.** Channel messages recover when the browser misses the server’s delivery confirmation, so a delivered message no longer sits greyed out. If sending really did fail, you can edit the draft, retry it or remove it from the conversation. [#34772](https://github.com/open-webui/open-webui/pull/34772), [#34771](https://github.com/open-webui/open-webui/issues/34771)\n- **Recover a rejected tool sign-in.** When an external tool connected through the Model Context Protocol (MCP) rejects a sign-in token before its expiry time, Open WebUI tries to renew it through OAuth and retry the request. If that succeeds, the assistant can finish using the tool without asking you to sign in again. [#34699](https://github.com/open-webui/open-webui/issues/34699)\n- **Coding agent attachments.** Attach a screenshot or a file to a coding request and the agent can open it on the connected machine. Supported images are also shown directly to the agent, up to 10 MiB per message, so you can point out a visual issue in the same turn. [#34652](https://github.com/open-webui/open-webui/issues/34652), [#34660](https://github.com/open-webui/open-webui/issues/34660)\n- **Keep follow-ups on the right conversation branch.** If you have the same chat open in two browser tabs, you can send a follow-up from one while a reply is finishing in the other. A tab showing an older message now queues your follow-up after the latest reply on that branch of the conversation.\n- **Batch knowledge imports.** Import a batch of PDFs into a knowledge base and their extracted passages keep their page numbers, just as they do for individual uploads. People reading an answer can jump straight to the supporting page even when the whole collection was uploaded at once. [#34886](https://github.com/open-webui/open-webui/pull/34886), [#34876](https://github.com/open-webui/open-webui/issues/34876)\n- **Use tools on your own computer from chat.** Tether, the desktop app that connects your computer to Open WebUI, now lets chat call local tools that use the Model Context Protocol (MCP). For tools described by an OpenAPI specification, chat also picks the right tool when a Tether tool shares a name with another integration. [#34730](https://github.com/open-webui/open-webui/pull/34730), [#34728](https://github.com/open-webui/open-webui/pull/34728), [#34729](https://github.com/open-webui/open-webui/issues/34729), [#34718](https://github.com/open-webui/open-webui/issues/34718)\n- **Replies after tool limits.** When a model uses up its tool calls or a tool fails repeatedly, Open WebUI asks it to finish with what it has learned. A long search can still end with an answer based on the results the model already collected. [#34759](https://github.com/open-webui/open-webui/pull/34759), [#34750](https://github.com/open-webui/open-webui/issues/34750)\n- **Keep a reasoning model’s place between turns.** When a chat uses the Responses API and the provider doesn’t store the conversation, Open WebUI now sends the same model its earlier encrypted reasoning along with the messages and tool calls. The model can use that work when you ask it to continue a multi-step task. [#33956](https://github.com/open-webui/open-webui/issues/33956)\n- **Reuse instructions on Responses API connections.** If a deployment gives a model a custom name, the provider can still reuse the system instructions it has already processed for that model. On Responses API connections where the provider keeps conversation state, tool calls also reuse the instructions the provider already holds. [#34802](https://github.com/open-webui/open-webui/pull/34802), [#34801](https://github.com/open-webui/open-webui/issues/34801)\n- **Per-chat coding agents.** Choose a coding agent before sending the first message, even when each new chat gets its own machine. You can put the task in your opening message and start with the agent you intended to use. [#34824](https://github.com/open-webui/open-webui/issues/34824)\n- **Keep file edits with the right model’s machine.** Some sites connect each model to a different computer for running commands and editing files. Switching models in chat now brings up the tabs for the correct machine, and any unsaved file edits stay on the computer where you made them. [#34815](https://github.com/open-webui/open-webui/issues/34815)\n- **Remember the computer you chose for chat.** Once you pick a machine to use for your next conversation, a brief disconnect no longer clears that choice. Open WebUI also keeps the selection if you visit a separate chat where a background agent is working without a machine of its own. [#34928](https://github.com/open-webui/open-webui/issues/34928), [#34643](https://github.com/open-webui/open-webui/issues/34643)\n- **PDF export rendering.** Export a conversation as a styled PDF and it includes every model’s answer, even those behind another tab. Long code lines wrap to the page, and the export waits for equations and diagrams to render so those parts of the conversation make it onto the page too. [#19227](https://github.com/open-webui/open-webui/issues/19227)\n- **Chat input selection.** After selecting all text in the chat input, Enter and Shift+Enter again send or insert a line break according to your shortcut setting. [#34760](https://github.com/open-webui/open-webui/pull/34760), [#34758](https://github.com/open-webui/open-webui/issues/34758)\n- **Touch preview controls.** Pinch to inspect a small detail in an image, document, diagram or slide on a phone, then zoom back out without losing the preview. Zoomable images also respond to the Download button when you want the original. [#34952](https://github.com/open-webui/open-webui/pull/34952), [#34953](https://github.com/open-webui/open-webui/pull/34953), [#34942](https://github.com/open-webui/open-webui/issues/34942), [#34939](https://github.com/open-webui/open-webui/issues/34939)\n- **Continuing failed replies.** Pick Continue Response after a failed reply and the error clears once the model successfully resumes. That correction is saved with the conversation, so reopening it later shows the completed reply without the obsolete failure message. [#34822](https://github.com/open-webui/open-webui/pull/34822), [#34814](https://github.com/open-webui/open-webui/issues/34814)\n- **Page tabs after upgrades.** An Open WebUI session can stay open across a server upgrade. If you then open a page tab that needs code from the previous version, the browser reloads the updated app so you can reach the page. [#34634](https://github.com/open-webui/open-webui/pull/34634), [#34633](https://github.com/open-webui/open-webui/issues/34633)\n- **Keep token counts when you stop a reply.** A model reports how much text it has processed in units called tokens. If you stop a reply during a series of tool calls, Open WebUI now keeps the count reported so far. The next message can use that count to avoid summarizing the conversation earlier than necessary. [#34627](https://github.com/open-webui/open-webui/pull/34627), [#34626](https://github.com/open-webui/open-webui/issues/34626)\n- **See how much room is left in a chat.** Type `/status` to see how much of the model’s available space for messages and tool results is already in use. The estimate includes results that arrived after the model last reported its token count, even if the response stopped or failed. [#34622](https://github.com/open-webui/open-webui/pull/34622), [#34617](https://github.com/open-webui/open-webui/issues/34617)\n- **Type into a browser on a connected machine.** Open a connected computer’s Browser tab in Chrome view to interact with pages running on that computer. Japanese and Korean input methods, accented characters and the Enter key now work there, including when you submit a form or add a line. [#34739](https://github.com/open-webui/open-webui/pull/34739), [#34738](https://github.com/open-webui/open-webui/pull/34738), [#34735](https://github.com/open-webui/open-webui/issues/34735), [#34717](https://github.com/open-webui/open-webui/issues/34717)\n- **Diagnose empty knowledge searches.** A knowledge search may return nothing after you change the model that turns text into numbers for search. If your site uses the Chroma database, the server log now identifies when the new model expects a different number of values per passage, so admins know when to rebuild the search index. [#34764](https://github.com/open-webui/open-webui/pull/34764), [#34761](https://github.com/open-webui/open-webui/issues/34761)\n- **Encrypt knowledge searches sent to Qdrant.** If your site stores its knowledge search index in Qdrant and uses gRPC to reach it, an HTTPS address in `QDRANT_URI` now enables TLS. This encrypts traffic between Open WebUI and the database using the security setting already specified in the address. [#34783](https://github.com/open-webui/open-webui/pull/34783), [#34780](https://github.com/open-webui/open-webui/issues/34780)\n- **Use tools with long operation names.** A connected service can publish its tools in an OpenAPI specification, but some model providers limit tool names to 64 characters. Open WebUI now shortens the names it generates so a long operation name can no longer prevent a chat from starting. [#34736](https://github.com/open-webui/open-webui/issues/34736)\n- **Connections without API keys.** You can save a connection to an OpenAI-compatible service with the API key field empty when its selected sign-in method doesn’t require a key.\n- **Open Excel files with large pivot tables.** An Excel workbook could be rejected as too large because data used by its pivot tables counted twice. Open WebUI now excludes the duplicate data when it checks the unpacked size of an XLSX or XLSM workbook, letting files that fit the limit open normally. [#34944](https://github.com/open-webui/open-webui/issues/34944)\n- **Pinned model suggestions.** Open a model pinned to your sidebar and its own suggested prompts appear in the new chat. Start typing to narrow the suggestions, making it easier to find a task the model’s author has already set up. [#34845](https://github.com/open-webui/open-webui/pull/34845), [#34830](https://github.com/open-webui/open-webui/issues/34830)\n- **Live machine file previews.** Keep a file preview open while a coding agent or another program edits the file on the connected machine. The preview updates as the file changes, so you can see the result in place without closing and reopening it.\n- **Chart library requests.** If a model builds a chart with Chart.js but forgets to load the library, the Visualizations tool now tells it what is missing. The model can correct the chart in the same reply, saving you a separate troubleshooting turn. [#34912](https://github.com/open-webui/open-webui/pull/34912), [#34909](https://github.com/open-webui/open-webui/issues/34909)\n- **Generate a video from text alone.** Some OpenAI-compatible video services expect prompts in the same multipart format used to upload files. Open WebUI now sends a text-only prompt in that format when required, so you can generate a video on those services without attaching a starting image. [#34681](https://github.com/open-webui/open-webui/pull/34681), [#34679](https://github.com/open-webui/open-webui/issues/34679)\n- **Copy an equation with the surrounding text.** Select a sentence from a chat answer and copy it into a note or document that supports LaTeX math. Equations now keep the markers that tell the editor to render them within a sentence or on a line of their own, even when you copy only part of the answer. [#34779](https://github.com/open-webui/open-webui/pull/34779), [#34776](https://github.com/open-webui/open-webui/issues/34776)\n- **Windows machine images.** Use an image already saved on a connected Windows machine as the input for an edit or the first frame of a video. Open WebUI now recognizes its Windows path, so you can refer to the file where it lives. [#34727](https://github.com/open-webui/open-webui/pull/34727), [#34719](https://github.com/open-webui/open-webui/issues/34719)\n- **Channel input suggestions.** Press Enter on a highlighted emoji or slash command in a channel and it goes into your draft first. You can finish the message before sending it, even when you use the keyboard for the whole exchange. [#34618](https://github.com/open-webui/open-webui/pull/34618), [#34616](https://github.com/open-webui/open-webui/issues/34616)\n- **Chat link destination.** Opening a chat link shows the conversation itself even if you left a channel or another tab in front the last time you used it. [#34702](https://github.com/open-webui/open-webui/issues/34702)\n- **Message pairs in notes.** In a new note’s chat, press Ctrl+Shift+Enter to add your question and the assistant’s answer to the note together. The exchange stays with the note and doesn’t create a separate conversation in the sidebar. [#34782](https://github.com/open-webui/open-webui/pull/34782), [#34781](https://github.com/open-webui/open-webui/issues/34781)\n- **Notify integrations when a coding agent finishes.** An integration that listens for completed chat replies now gets that notification when a coding agent finishes too. Where available, the event includes a readable name for the agent or for a model connected through the Tether desktop app, so the integration can show who answered.\n- **Avoid duplicate time zone notifications.** Systems that subscribe to account changes can receive an automatic notification, called a webhook, when someone changes their time zone. Refreshing Open WebUI in the same time zone no longer sends that notification or runs the workflows listening for it. [#34838](https://github.com/open-webui/open-webui/pull/34838), [#34837](https://github.com/open-webui/open-webui/issues/34837)\n- **Dismissed banners.** Turn off Remember Dismissal on a banner and it becomes visible again to people who closed it earlier. Admins can bring an announcement back to those readers by changing the existing banner’s setting. [#34684](https://github.com/open-webui/open-webui/pull/34684), [#34683](https://github.com/open-webui/open-webui/issues/34683)\n- **Live tool summaries.** Collapse a busy group of tool calls and its heading keeps updating as the model works. You can follow whether it’s running commands, searching or working with files while leaving the individual calls tucked away. [#34621](https://github.com/open-webui/open-webui/pull/34621), [#34620](https://github.com/open-webui/open-webui/issues/34620)\n- **Selected text highlight.** Select a passage in a reply and choose Ask to write a follow-up about it. The passage stays highlighted while you type, so you can refer to the exact wording even in a long answer. [#34769](https://github.com/open-webui/open-webui/pull/34769), [#34768](https://github.com/open-webui/open-webui/issues/34768)\n- **Accurate reply counts in comment threads.** Deleting a reply now removes it from the count shown on the comment thread. If a parent comment has been deleted too, it disappears once its last remaining reply is gone, so an empty thread doesn’t stay on screen.\n- **Menus during drags.** Starting a drag outside an open dropdown closes it so the menu doesn’t cover the chat you’re dragging into a split view. [#34959](https://github.com/open-webui/open-webui/pull/34959), [#34958](https://github.com/open-webui/open-webui/issues/34958)\n- **Menus follow page tabs.** An open menu such as the calendar’s view selector now closes when you switch to another page tab. [#34716](https://github.com/open-webui/open-webui/pull/34716), [#34715](https://github.com/open-webui/open-webui/issues/34715)\n- **Note formatting toolbar.** Clicking outside the note editor closes the formatting toolbar and its tooltips so they don’t cover the rest of the page. [#34966](https://github.com/open-webui/open-webui/pull/34966), [#34965](https://github.com/open-webui/open-webui/issues/34965)\n- **Python formatting shortcut.** Format a Python code block with Ctrl+Shift+F or Cmd+Shift+F even if the model labeled the block `py`, `python` or used capital letters. The shortcut recognizes those labels without requiring you to edit the block first. [#34734](https://github.com/open-webui/open-webui/pull/34734), [#34732](https://github.com/open-webui/open-webui/issues/34732)\n- **Close a terminal after its shell exits.** Once Open WebUI detects that the command-line session in a terminal tab has ended, you can close the tab immediately. The confirmation asking whether to stop the shell now applies only while the tab still considers the session active.\n- **Clear a file selection in the skill editor.** A skill packages reusable instructions and files for the assistant. When you edit one, press Escape or click empty space in the file list to deselect every highlighted file at once. [#34691](https://github.com/open-webui/open-webui/pull/34691), [#34690](https://github.com/open-webui/open-webui/issues/34690)\n- **Skip channel requests when channels are disabled.** On sites where admins have turned off Channels, opening a page no longer asks the server for a list of channels. This clears a misleading permission error from the browser console on deployments that have deliberately disabled the feature. [#34821](https://github.com/open-webui/open-webui/pull/34821), [#34820](https://github.com/open-webui/open-webui/issues/34820)\n- **Distinguish setup from a failed tool sign-in.** A tool server connected through the Model Context Protocol (MCP) can still be waiting to register Open WebUI as an OAuth client. Startup logs now distinguish that normal setup state from unreadable saved credentials, which still produce an error an admin can investigate. [#34938](https://github.com/open-webui/open-webui/pull/34938)\n- **Account birth dates.** Open WebUI now rejects a future date of birth both in Account settings and through the API, so profile imports and integrations follow the same validation as someone editing their own account. [#34961](https://github.com/open-webui/open-webui/pull/34961), [#34960](https://github.com/open-webui/open-webui/issues/34960)\n\n### Changed\n\n- **Database migrations.** Open WebUI 0.13.5 stores each chat message separately, so upgrading converts the history in your existing database. Back up the database and associated data first, then upgrade all workers and servers together because the old and new versions use incompatible formats. The conversion runs in batches and can resume after an interruption.\n- **Read chat history through the API.** If your integration pins, moves, archives or shares a chat, the API now returns its details without repeating the full conversation. To read messages, fetch the chat itself and use `chat.history`. Older clients that read the separate flat list of messages need to switch to that field. [#34689](https://github.com/open-webui/open-webui/pull/34689), [#34688](https://github.com/open-webui/open-webui/issues/34688)\n- **Terminal connections are now called Machines.** To manage the computers a chat can use for files and commands, look under Machines in Open WebUI. Connections previously listed as Terminals keep their permissions. API clients should switch to `/api/v1/machines` and `/api/v1/configs/machines` and read the `MACHINE_CONNECTIONS` response key. [#34810](https://github.com/open-webui/open-webui/pull/34810), [#34809](https://github.com/open-webui/open-webui/issues/34809)\n- **Move Arena model selection to routers.** Saved Arena configurations, which let people try a randomly selected model in chat, become routers that choose from a model list at random. If you selected All or excluded specific models, the upgrade saves the matching list as it stands on upgrade day. Recreate the built-in Arena as a random router if you used it, and move environment-only definitions to `ROUTER_MODELS`.\n- **Let an assistant delegate work in the background.** In a saved chat, the assistant can give another agent a task and keep answering your questions while that agent works. In a shared channel or an automated task, the assistant waits for the delegated result. Admins can set `SUBAGENTS_MAX_ASYNC` to limit simultaneous background jobs per server worker.\n- **Document conversion with Docling.** Sites that use Docling to extract text from uploaded documents now send each conversion as a background job. Before upgrading Open WebUI, check that your Docling server accepts job submissions, lets Open WebUI check their progress and provides the converted document for download.\n- **Default API for an OpenAI connection.** When an admin enters OpenAI’s API address in the connection editor, Open WebUI now defaults to the Responses API for sending model requests. Integrations built for the Chat Completions API can still select it explicitly in that editor.\n- **Automated reports in channels.** When an automation posts to a shared channel, its replies now appear in a thread by default so readers can follow the discussion under the original message. For an announcement that should appear in the main channel, turn off Reply in thread on that automation.\n- **See which claims a document supports.** When answering questions using passages found in your documents, the default prompt now asks the assistant to put a source number beside each claim the documents support. It also asks the assistant to say when it draws on its own knowledge so you know which statements you can verify in the documents. [#20829](https://github.com/open-webui/open-webui/discussions/20829)\n- **Rename machine connection settings at your own pace.** For deployments configured through environment variables, use `MACHINE_CONNECTIONS` for the computers available to chat, `MACHINE_PROXY_HEADERS` for headers sent through their proxy and `AIOHTTP_CLIENT_TIMEOUT_MACHINE` for the request timeout. The previous terminal variable names still work, so admins can update one setting at a time.\n- **OLED dark theme.** If you used OLED Dark, upgrading carries your black background into the Dark theme as a custom color. You can keep that look or fine-tune it alongside your other theme colors in Settings > General > Colors.\n- **Find permissions in connection dialogs.** Open Access in a tool, image or video connection’s settings to choose who can use it. When connecting a remote tool server through the Model Context Protocol (MCP), the connection dialog now displays it without the experimental label.\n\n","reactions":{"total_count":36,"+1":20,"-1":0,"laugh":0,"hooray":7,"confused":0,"heart":4,"rocket":4,"eyes":1}}
