{"id":438481582,"author":{"login":"jacob-bd","id":47641890,"node_id":"MDQ6VXNlcjQ3NjQxODkw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQtfMFM4aIrKu","tag_name":"v0.16.2","target_commitish":"main","name":"v0.16.2: safer setup errors and current notebook chat requests","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-08T19:47:40Z","updated_at":"2026-11-08T19:53:28Z","published_at":"2026-11-08T19:51:29Z","assets":[{"id":725023717,"node_id":"RA_kwDOQtfMFM4rNvvl","name":"notebooklm-mcp-0.16.2.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2605,"digest":"sha256:3bdf8a810abbe7d8bce9924783f3160f11bcf033ad2c001150a6402bf3acaf45","download_count":6,"created_at":"2026-11-08T19:53:28Z","updated_at":"2026-11-08T19:53:28Z"}],"body":"# v0.16.2: safer setup errors and current notebook chat requests\n\n### Fixed\n\n- Empty or whitespace-only MCP client config files can now be initialized. Malformed JSON and TOML files remain untouched and are reported clearly. `nlm setup list` continues past an unreadable client config, while `nlm setup add` and `nlm setup remove` show the affected path instead of a traceback (#400).\n- Notebook chat sends the current 9-slot consumer request while preserving Enterprise behavior (#398). Live checks covered fresh conversations, follow-ups, selected sources, and citations. The previous request format also worked during verification, so treat this as a compatibility update rather than a confirmed fix for a production failure.\n\n### Credits\n\nThanks to @pengqun for #400 and the report in #399, and to @saariuslystoned for #398.\n","mentions_count":2}
