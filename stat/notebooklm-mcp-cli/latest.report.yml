{"id":388085525,"author":{"login":"jacob-bd","id":47641890,"node_id":"MDQ6VXNlcjQ3NjQxODkw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQtfMFM4XIbcV","tag_name":"v0.11.4","target_commitish":"main","name":"v0.11.4 Profile-Isolated Usage Release","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-14T00:44:53Z","updated_at":"2026-09-14T00:46:20Z","published_at":"2026-09-14T00:44:55Z","assets":[{"id":562228929,"node_id":"RA_kwDOQtfMFM4hgu7B","name":"notebooklm-mcp-0.11.4.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2546,"digest":"sha256:e595dd212e71be9142f96dd81e60b66445cabb36248e32b4dad8d14655a53bbb","download_count":43,"created_at":"2026-09-14T00:46:20Z","updated_at":"2026-09-14T00:46:20Z"}],"body":"# v0.11.4 Profile-Isolated Usage Release\n\nThis patch release adds account-isolated usage checks for named authentication\nprofiles. Thanks to **@insane66613** for the contribution in\n[PR #328](https://github.com/jacob-bd/gemini-notebook-mcp-cli/pull/328).\n\n## Added\n\n- `nlm usage --profile <name>` and `nlm usage -p <name>` inspect a saved\n  profile without switching the configured default.\n- `usage_get(profile=\"<name>\")` provides the same per-call selection over MCP.\n\n## Fixed\n\n- Explicit profiles take precedence over `NOTEBOOKLM_COOKIES`.\n- Missing or invalid profiles return an error instead of falling back to another\n  account.\n\n## Known limitation\n\n- Google may not return usage windows for Enterprise/Workspace accounts on the\n  \u201cPro\u201d tier. `nlm usage` and `usage_get` therefore cannot show allowance data\n  for those accounts, while personal Pro accounts can return the normal usage\n  report.\n\n## Verification\n\n- Full non-E2E suite: 1,609 passed, 38 skipped, 1 deselected.\n- Ruff lint and formatting checks passed.\n","mentions_count":1}
