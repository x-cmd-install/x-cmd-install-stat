{"id":422207476,"author":{"login":"jacob-bd","id":47641890,"node_id":"MDQ6VXNlcjQ3NjQxODkw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOQtfMFM4ZKl_0","tag_name":"v0.15.7","target_commitish":"main","name":"v0.15.7: Claude Desktop Windows Store migrated-folder fix","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-23T18:57:44Z","updated_at":"2026-10-23T19:00:06Z","published_at":"2026-10-23T18:57:55Z","assets":[{"id":670086787,"node_id":"RA_kwDOQtfMFM4n8LaD","name":"notebooklm-mcp-0.15.7.mcpb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":2607,"digest":"sha256:0a6d5e6f0dd4e0725dcffaee32a2bc29f3fbdea622f502882a8e48cd500de6c4","download_count":11,"created_at":"2026-10-23T19:00:05Z","updated_at":"2026-10-23T19:00:06Z"}],"body":"## Fixed\n\n- **`nlm setup add claude-desktop` now writes to the right file on migrated Windows Store installs.** Newer Microsoft Store builds of Claude Desktop move their user data to `%LOCALAPPDATA%\\Claude-Data\\<package>`. We only knew the old path under `Packages\\`, so `setup add` wrote a config the app never read, and `setup list` showed a false \u2713 for it. The resolver now follows the app's own rule: the new folder is used only when it exists as a directory and no `.user-data-back.<package>` marker is in the old folder. An empty `Claude-Data` next to a live old folder keeps the old path, so working installs don't change ([#378](https://github.com/jacob-bd/gemini-notebook-mcp-cli/issues/378)).\n\n## Notes\n\n- Unverified: when the new folder exists with neither a `left` nor a `back` marker, Claude Desktop runs an extra check we haven't read. We treat that case as migrated.\n\n## Credits\n\nThanks to **@diogoflorencio** for the report and the manual workaround in #378.\n","mentions_count":1}
