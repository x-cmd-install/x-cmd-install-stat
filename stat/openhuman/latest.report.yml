","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":420,"digest":"sha256:27b78624716a4ba23f2a1552b0aee9eadd0dc42f441056f0736712c70f8e4b64","download_count":19,"created_at":"2026-09-26T00:54:54Z","updated_at":"2026-09-26T00:54:55Z"},{"id":589565063,"node_id":"RA_kwDORTXxrs4jJAyH","name":"OpenHuman_0.64.4_x86_64-apple-darwin.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":52583367,"digest":"sha256:8dae6f987b3413fd2d649cdcc8f82707d0e11d9f026d85c5236306a590ec440c","download_count":34,"created_at":"2026-09-26T00:39:19Z","updated_at":"2026-09-26T00:39:27Z"},{"id":589565065,"node_id":"RA_kwDORTXxrs4jJAyJ","name":"OpenHuman_0.64.4_x86_64-apple-darwin.app.tar.gz.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":444,"digest":"sha256:255daed48fadc2e3c41c269dc80eeb59f9f496ad2093e1ba4329664f580c8683","download_count":15,"created_at":"2026-09-26T00:39:19Z","updated_at":"2026-09-26T00:39:20Z"}],"body":"# The Better Windows Desktop Upgrade\n\nThis release is all about making the Windows desktop experience more reliable, more polished, and smoother to operate\u2014especially when you\u2019re offline. \ud83c\udf89\n\n## Highlights\n\n### Offline-ready Windows installers \ud83d\udce6\nWindows desktop installers now bundle all registry-pinned native modules (and their extracted DLLs) directly into the installer, so key features don\u2019t depend on a first-run download. Module resolution now prefers the read-only installer bundle before user cache or network, and the Windows checks/smoke steps were updated to verify offline module loading end-to-end. ([#6687](https://github.com/tinyhumansai/openhuman/pull/6687)) \u2014 Thank you @senamakel!\n\n### Sharper Windows window controls & cleaner shutdown \ud83e\ude9f\nWindows gets a more compact first-launch window and improved custom window controls (minimize, maximize/restore, close), with the drag strip staying available during boot and error screens. Shutdown behavior is also fixed so closing properly exits both the desktop host and embedded core (including support for the `app_quit` IPC command), plus the dev launcher was simplified with earlier architecture mismatch detection. ([#6692](https://github.com/tinyhumansai/openhuman/pull/6692)) \u2014 Thank you @stevent95-star!\n\n## Contributor Credits\nThanks to everyone who contributed to this release: @senamakel, @stevent95-star.\n\n## Full Compare\nhttps://github.com/tinyhumansai/openhuman/compare/v0.64.3...v0.64.4\n","mentions_count":2}
