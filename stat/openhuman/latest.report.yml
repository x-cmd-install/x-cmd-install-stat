ogin":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":420,"digest":"sha256:c5031ebfb56e1f6d32b50cadd19f68e8306d361c31e89b0eb88bb812c21d9151","download_count":3,"created_at":"2026-09-29T01:31:21Z","updated_at":"2026-09-29T01:31:21Z"},{"id":596876223,"node_id":"RA_kwDORTXxrs4jk5u_","name":"OpenHuman_0.64.7_x86_64-apple-darwin.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":52402892,"digest":"sha256:026b2edf2401385a76e009a62d601121aed9890fa2e05cad111dad6a55d88d85","download_count":5,"created_at":"2026-09-29T01:23:19Z","updated_at":"2026-09-29T01:23:21Z"},{"id":596876224,"node_id":"RA_kwDORTXxrs4jk5vA","name":"OpenHuman_0.64.7_x86_64-apple-darwin.app.tar.gz.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":444,"digest":"sha256:5f22b5ff33ba9c84a2cd90b3bbd6350468f8929887f4710c85057e7d92a31d37","download_count":5,"created_at":"2026-09-29T01:23:19Z","updated_at":"2026-09-29T01:23:19Z"}],"body":"# The Intelligence Upgrade \ud83c\udf89\n\nv0.64.4 to v0.64.7 brings 12 PRs across 12 commits, with upgrades across memory, voice, agents, reliability, and developer foundations. Thank you to everyone who contributed to this release. \u2728\n\n## Highlights \ud83d\ude80\n\n### \u2705 Tasks, chat & agent workflows\n\nTask, chat, and agent workflows become easier to steer and inspect, with better task boards, persistent run state, safer delegation, and clearer model/thread controls. ([#6672](https://github.com/tinyhumansai/openhuman/pull/6672), [#6683](https://github.com/tinyhumansai/openhuman/pull/6683), [#6702](https://github.com/tinyhumansai/openhuman/pull/6702), [#6760](https://github.com/tinyhumansai/openhuman/pull/6760)) \u2014 Thank you @M3gA-Mind and @senamakel!\n\n### \ud83e\udde9 Integrations, UI & developer foundations\n\nIntegrations, UI polish, and developer foundations also move forward, including clearer connected-account surfaces, meeting-agent wiring, presentation/artifact improvements, and cleaner docs/code organization. ([#6668](https://github.com/tinyhumansai/openhuman/pull/6668), [#6678](https://github.com/tinyhumansai/openhuman/pull/6678), [#6693](https://github.com/tinyhumansai/openhuman/pull/6693), [#6699](https://github.com/tinyhumansai/openhuman/pull/6699), [#6700](https://github.com/tinyhumansai/openhuman/pull/6700), [#6701](https://github.com/tinyhumansai/openhuman/pull/6701), [#6704](https://github.com/tinyhumansai/openhuman/pull/6704), [#6759](https://github.com/tinyhumansai/openhuman/pull/6759)) \u2014 Thank you @senamakel, @M3gA-Mind, and @siddarthkay!\n\n\n## Contributor Credits \ud83d\ude4c\n\n- M3gA-Mind (#6672, #6693) \u2014 thank you!\n- senamakel (#6668, #6678, #6683, #6700, #6701, #6702, #6704, #6759, #6760) \u2014 thank you!\n- siddarthkay (#6699) \u2014 thank you!\n\n## Full Compare \ud83e\udded\n\nhttps://github.com/tinyhumansai/openhuman/compare/v0.64.4...v0.64.7\n","mentions_count":3}
