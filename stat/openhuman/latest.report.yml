en-US.msi.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":424,"digest":"sha256:c2d0629954e3b022d982799a6571c896da43b7c7312406e8459f1d6f4ff8482a","download_count":15,"created_at":"2026-09-30T21:14:02Z","updated_at":"2026-09-30T21:14:02Z"},{"id":601797635,"node_id":"RA_kwDORTXxrs4j3rQD","name":"OpenHuman_0.64.10_x86_64-apple-darwin.app.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":57608957,"digest":"sha256:934b3fc2f25e216c60cc8985a29aaaced1854cef7586d2f520fca4e200223514","download_count":40,"created_at":"2026-09-30T21:04:56Z","updated_at":"2026-09-30T21:04:58Z"},{"id":601797637,"node_id":"RA_kwDORTXxrs4j3rQF","name":"OpenHuman_0.64.10_x86_64-apple-darwin.app.tar.gz.sig","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/pgp-signature","state":"uploaded","size":444,"digest":"sha256:049b7250fe0969f69712cb3bc0209d83dd71512d215ea1c1d4860269ac396359","download_count":14,"created_at":"2026-09-30T21:04:56Z","updated_at":"2026-09-30T21:04:56Z"}],"body":"# The Speed, Structure & Reliability Upgrade\n\nThis release tightens the core experience from end to end\u2014faster first turns, clearer chat feedback, sturdier integrations, and a big internal modularity push that sets us up for even quicker iteration. \ud83c\udf89\n\n## Highlights\n\n### Performance & responsiveness \u26a1\nThe agent loop is noticeably snappier: first-turn prompts are dramatically smaller, prompt caching stays warm (improving time-to-first-token), and the managed inference path avoids unnecessary per-call client setup. Tool-output compaction is also enabled by default again\u2014with new \u201cREPL-style\u201d tools over stored results to keep large tool outputs from stalling turns.\n\n([#6787](https://github.com/tinyhumansai/openhuman/pull/6787), [#6788](https://github.com/tinyhumansai/openhuman/pull/6788), [#6823](https://github.com/tinyhumansai/openhuman/pull/6823)) \u2014 Thank you @senamakel!\n\n### Chat UI & approvals polish \ud83d\udcac\nChat got a round of UX improvements: long source lists now collapse cleanly (with better favicons), web-search rendering no longer leaves awkward gaps, and the silence watchdog now warns instead of killing a running turn\u2014staying in sync with the core\u2019s actual turn state. Approvals are also smoother: answered approvals won\u2019t \u201cghost\u201d into the background deck, and refusals now carry a clear deny reason that the model can actually read.\n\n([#6802](https://github.com/tinyhumansai/openhuman/pull/6802), [#6827](https://github.com/tinyhumansai/openhuman/pull/6827), [#6800](https://github.com/tinyhumansai/openhuman/pull/6800), [#6810](https://github.com/tinyhumansai/openhuman/pull/6810)) \u2014 Thank you @senamakel and @M3gA-Mind!\n\n### Memory & knowledge engines \ud83e\udde0\nMemory is now explicitly selectable: you can choose exactly one active engine, including Local (TinyCortex) or CortexDB via TinyHumans, plus other supported providers. Switching engines can also copy existing memories across\u2014making experimentation and migration much less painful.\n\n([#6777](https://github.com/tinyhumansai/openhuman/pull/6777)) \u2014 Thank you @senamakel!\n\n### MCP & Composio integrations \ud83d\udd0c\nMCP tooling becomes much more ergonomic and robust: server tools are exposed as stable, individually-addressable tools from a persistent cache, and string-encoded JSON arguments are normalized so calls don\u2019t fail unexpectedly. Refusals from tool listing now tell the model what it *can* do (and avoid pointing at RPC-only methods). On the Composio side, embedders can give each agent its own credentials, and backend-routed Composio calls now flow through the tinyconnectors module instead of an in-process client.\n\n([#6767](https://github.com/tinyhumansai/openhuman/pull/6767), [#6769](https://github.com/tinyhumansai/openhuman/pull/6769), [#6818](https://github.com/tinyhumansai/openhuman/pull/6818), [#6689](https://github.com/tinyhumansai/openhuman/pull/6689), [#6796](https://github.com/tinyhumansai/openhuman/pull/6796)) \u2014 Thank you @senamakel, @M3gA-Mind, and @oxoxDev!\n\n### Security, safety & policy hardening \ud83d\udee1\ufe0f\nSecurity protections are sharper and less noisy: the prompt-injection guard is less likely to false-positive on recalled transcripts, and browser IP blocking now uses the full non-global range definitions (with regression tests). Shell execution reliability also improves in scheduled jobs on Windows, and shell scanning logic is consolidated upstream for consistency.\n\n([#6776](https://github.com/tinyhumansai/openhuman/pull/6776), [#6709](https://github.com/tinyhumansai/openhuman/pull/6709), [#6764](https://github.com/tinyhumansai/openhuman/pull/6764), [#6790](https://github.com/tinyhumansai/openhuman/pull/6790)) \u2014 Thank you @senamakel, @Avi-Bendetsky, and @sanil-23!\n\n### Architecture & vendor modularity push \ud83e\uddf1\nA major theme of this series is extracting host-independent logic out of `openhuman-core` and into the appropriate `vendor/tiny*` modules\u2014keeping core focused on product policy, adapters, and contracts. This includes splitting RPC/server responsibilities, moving channels/skills/web3/filesystem/hooks/session/runtime/tooling helpers into their owning crates, and updating vendor pins to merged upstream mains. Along the way, stale subsystem references were cleaned up, and the tool-call type is now adopted directly from tinytools to reduce duplication and drift.\n\n([#6703](https://github.com/tinyhumansai/openhuman/pull/6703), [#6779](https://github.com/tinyhumansai/openhuman/pull/6779), [#6780](https://github.com/tinyhumansai/openhuman/pull/6780), [#6782](https://github.com/tinyhumansai/openhuman/pull/6782), [#6783](https://github.com/tinyhumansai/openhuman/pull/6783), [#6784](https://github.com/tinyhumansai/openhuman/pull/6784), [#6785](https://github.com/tinyhumansai/openhuman/pull/6785), [#6786](https://github.com/tinyhumansai/openhuman/pull/6786), [#6789](https://github.com/tinyhumansai/openhuman/pull/6789), [#6791](https://github.com/tinyhumansai/openhuman/pull/6791), [#6793](https://github.com/tinyhumansai/openhuman/pull/6793), [#6794](https://github.com/tinyhumansai/openhuman/pull/6794), [#6795](https://github.com/tinyhumansai/openhuman/pull/6795), [#6797](https://github.com/tinyhumansai/openhuman/pull/6797), [#6804](https://github.com/tinyhumansai/openhuman/pull/6804), [#6805](https://github.com/tinyhumansai/openhuman/pull/6805), [#6806](https://github.com/tinyhumansai/openhuman/pull/6806), [#6807](https://github.com/tinyhumansai/openhuman/pull/6807), [#6809](https://github.com/tinyhumansai/openhuman/pull/6809), [#6773](https://github.com/tinyhumansai/openhuman/pull/6773)) \u2014 Thank you @senamakel!\n\n### Reliability, updates & CI/e2e stability \u2705\nThis set also focuses on \u201ckeeping main green\u201d: E2E web runs now avoid port collisions and refuse taken ports, the core updater once again resolves the correct versioned archive and stages the real binary, and managed backend outages now trigger bounded exponential backoff with explicit terminal outcomes. CI coverage improves too, including executing module-gated Rust tests, better layout gating behavior, and keeping vendor/lockfile pins aligned (including tinymcp and tinymemory pin handling).\n\n([#6719](https://github.com/tinyhumansai/openhuman/pull/6719), [#6770](https://github.com/tinyhumansai/openhuman/pull/6770), [#6569](https://github.com/tinyhumansai/openhuman/pull/6569), [#6605](https://github.com/tinyhumansai/openhuman/pull/6605), [#6817](https://github.com/tinyhumansai/openhuman/pull/6817), [#6771](https://github.com/tinyhumansai/openhuman/pull/6771), [#6772](https://github.com/tinyhumansai/openhuman/pull/6772), [#6798](https://github.com/tinyhumansai/openhuman/pull/6798)) \u2014 Thank you @obchain, @lorenzozanee, @M3gA-Mind, @sanil-23, and @senamakel!\n\n### Desktop, voice & platform fixes \ud83d\udda5\ufe0f\nTinyComputer gains saved flows, task reports, and a live Bali booking E2E to make real-world debugging and iteration much easier. There are also key platform fixes: macOS desktop builds were restored after upstream accessibility API changes, and vendor bumps include a Windows build fix for `unsafe_code` constraints in tinyagents.\n\n([#6761](https://github.com/tinyhumansai/openhuman/pull/6761), [#6822](https://github.com/tinyhumansai/openhuman/pull/6822), [#6839](https://github.com/tinyhumansai/openhuman/pull/6839)) \u2014 Thank you @senamakel and @M3gA-Mind!\n\n### Web3 & x402 improvements \ud83d\udcb1\nWeb3 functionality continues its move into tinywallet, with follow-on pinning to pick up important x402, fee, probing, and chain-status fixes\u2014plus host-side support and tests to keep behavior correct and traceable.\n\n([#6792](https://github.com/tinyhumansai/openhuman/pull/6792)) \u2014 Thank you @senamakel!\n\n### Usage & accounting accuracy \ud83d\udcca\nThe Usage page now reflects the spend it actually recorded: workspace tracking is fixed across auth transitions, duplicate recordings are avoided (and legacy duplicates ignored), and tiny UI details like `<$0.01` and negative-zero rendering are corrected. The \u201cToken & Cost\u201d tab was also renamed to \u201cToken savings\u201d in all locales to match what it truly shows.\n\n([#6720](https://github.com/tinyhumansai/openhuman/pull/6720)) \u2014 Thank you @graycyrus!\n\n### Embedder & agent control knobs \ud83c\udf9b\ufe0f\nEmbedders now have tighter control over runs with a per-turn tool-call budget limiter, without needing to alter persistent agent configuration. There\u2019s also cleanup after the inline-skills/deferred-tools work: vestigial spawn args are removed and e2e tests fixed accordingly.\n\n([#6350](https://github.com/tinyhumansai/openhuman/pull/6350), [#6762](https://github.com/tinyhumansai/openhuman/pull/6762)) \u2014 Thank you @theamazinghenk and @senamakel!\n\n### Settings & provider catalog changes \ud83d\udd01\nA built-in Cheaper Inference provider entry was added, then reverted\u2014returning settings and documentation to their prior routing behavior.\n\n([#6620](https://github.com/tinyhumansai/openhuman/pull/6620), [#6778](https://github.com/tinyhumansai/openhuman/pull/6778)) \u2014 Thank you @aiapienthusiast and @senamakel!\n\n### Docs & developer workflow helpers \ud83e\uddf0\nInternal contributor tooling improves with a new tracked Claude skill guide for migrating code into vendor submodules, and tinyskills is bumped to fix sourceUrl resolution behavior for non-`SKILL.md` Markdown blobs.\n\n([#6775](https://github.com/tinyhumansai/openhuman/pull/6775), [#6819](https://github.com/tinyhumansai/openhuman/pull/6819)) \u2014 Thank you @senamakel and @M3gA-Mind!\n\n### Release housekeeping \ud83d\ude80\nThis range includes the release PR used to cut and ship the bundle.\n\n([#6826](https://github.com/tinyhumansai/openhuman/pull/6826)) \u2014 Thank you @M3gA-Mind!\n### Additional highlights \ud83d\udd17\n\nA few more focused contributions round out this release with targeted fixes and improvements that are worth calling out. ([#6781](https://github.com/tinyhumansai/openhuman/pull/6781), [#6803](https://github.com/tinyhumansai/openhuman/pull/6803)) \u2014 Thank you @senamakel!\n\n## Contributor Credits\n\nThanks to everyone who contributed to this release: @aiapienthusiast, @Avi-Bendetsky, @graycyrus, @lorenzozanee, @M3gA-Mind, @obchain, @oxoxDev, @sanil-23, @senamakel, and @theamazinghenk.\n\n## Full Compare\n\nhttps://github.com/tinyhumansai/openhuman/compare/v0.64.7...v0.64.10\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":10}
