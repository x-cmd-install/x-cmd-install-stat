 module directory permission checks.  \n\n([#7155](https://github.com/tinyhumansai/openhuman/pull/7155)) \u2014 Thank you @senamakel!\n\n## Contributor Credits\nThanks to @senamakel for the fix and the fast turnaround!\n\n## Full Compare\nhttps://github.com/tinyhumansai/openhuman/compare/v0.64.14...v0.64.15\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":4,"eyes":0},"mentions_count":1}
