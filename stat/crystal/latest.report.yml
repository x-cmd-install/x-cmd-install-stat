pdated_at":"2026-10-12T13:42:21Z"},{"id":633905767,"node_id":"RA_kwDOAGkZhc4lyKJn","name":"crystal-1.22.0-windows-aarch64-gnu-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":60762753,"digest":"sha256:ba04dc63992c77477bd70bb178c937671b7e565509ad515535803d1c6f205026","download_count":10,"created_at":"2026-10-12T13:41:52Z","updated_at":"2026-10-12T13:43:35Z"},{"id":633905849,"node_id":"RA_kwDOAGkZhc4lyKK5","name":"crystal-1.22.0-windows-aarch64-msvc-unsupported.exe","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":36176918,"digest":"sha256:553f2a80e4833167e61501f7cb0dacddfc6395756e70b225dcee171ca088b1c0","download_count":9,"created_at":"2026-10-12T13:41:55Z","updated_at":"2026-10-12T13:42:36Z"},{"id":633905956,"node_id":"RA_kwDOAGkZhc4lyKMk","name":"crystal-1.22.0-windows-aarch64-msvc-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":49959080,"digest":"sha256:9b4b9a734cd4c3d63b9b4035f488ca7bc62fff4c6bcbd73d9e8e5ce5dfcaaa1b","download_count":7,"created_at":"2026-10-12T13:41:58Z","updated_at":"2026-10-12T13:43:22Z"},{"id":633906867,"node_id":"RA_kwDOAGkZhc4lyKaz","name":"crystal-1.22.0-windows-x86_64-gnu-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":62490230,"digest":"sha256:749b440198f74e8103f55aa59029c9ba3ddc9108b6fecb7bb1df373b1acff3bf","download_count":54,"created_at":"2026-10-12T13:42:23Z","updated_at":"2026-10-12T13:43:48Z"},{"id":633907456,"node_id":"RA_kwDOAGkZhc4lyKkA","name":"crystal-1.22.0-windows-x86_64-msvc-unsupported.exe","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":39126986,"digest":"sha256:c48bef4dca999e43a55cf6470982c640998fc1c65aca4815fdb0ac771d8b27f1","download_count":85,"created_at":"2026-10-12T13:42:38Z","updated_at":"2026-10-12T13:43:26Z"},{"id":633909336,"node_id":"RA_kwDOAGkZhc4lyLBY","name":"crystal-1.22.0-windows-x86_64-msvc-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":55166805,"digest":"sha256:ce7bc09462fa87ced9f051cc813938ae66c2a84ccfbbe43ef6cb2c610423b7fe","download_count":1208,"created_at":"2026-10-12T13:43:24Z","updated_at":"2026-10-12T13:43:57Z"}],"body":"### Breaking changes\r\n\r\n#### stdlib\r\n\r\n- _(system)_ Drop `Process.fork` ([#17367], thanks @straight-shoota)\r\n\r\n[#17367]: https://github.com/crystal-lang/crystal/pull/17367\r\n\r\n### Features\r\n\r\n#### lang\r\n\r\n- Allow constants with type declarations ([#16951], thanks @stakach)\r\n- _(macros)_ Add `StringLiteral#bytesize` ([#17176], thanks @straight-shoota)\r\n- _(macros)_ Add `NumberLiteral#chr` ([#17169], thanks @straight-shoota)\r\n- _(macros)_ Support `CharLiteral` in `RangeLiteral#each` ([#17170], thanks @straight-shoota)\r\n\r\n[#16951]: https://github.com/crystal-lang/crystal/pull/16951\r\n[#17169]: https://github.com/crystal-lang/crystal/pull/17169\r\n[#17170]: https://github.com/crystal-lang/crystal/pull/17170\r\n[#17176]: https://github.com/crystal-lang/crystal/pull/17176\r\n\r\n#### stdlib\r\n\r\n- Add warning about minimum supported Crystal version in `prelude` ([#17349], thanks @straight-shoota)\r\n- _(crypto)_ Enable OpenSSL Kernel TLS support by default ([#17059], thanks @ysbaddaden)\r\n- _(crypto)_ Add `OpenSSL::Cipher#gcm_tag` and `#gcm_tag=` for AEAD ciphers ([#17096], thanks @paulocoghi)\r\n- _(files)_ Add `IO::Memory#writable?` ([#17167], thanks @spuun)\r\n- _(llvm)_ Support LLVM 23.1 and 24.0 ([#17432], thanks @HertzDevil)\r\n- _(macros)_ Add all enum types to `Enum`'s list of subclasses ([#17425], thanks @HertzDevil)\r\n- _(networking)_ Add `HTTP::Context#remote_address`, `#local_address` ([#17196], thanks @straight-shoota)\r\n- _(networking)_ Validate method, version, and host in `HTTP::WebSocketHandler` ([#17235], thanks @hahwul)\r\n- _(networking)_ `HTTP::Client::Request` support `Content-Encoding: x-gzip` ([#17263], thanks @straight-shoota)\r\n- _(networking)_ Add `HTTP::Headers#merge` ([#17326], thanks @jgaskins)\r\n- _(networking)_ Serialize `IO::Memory` in HTTP body with `Content-Length` header ([#17388], thanks @straight-shoota)\r\n- _(runtime)_ Add `GC.syscall(&)` ([#17150], thanks @ysbaddaden)\r\n- _(runtime)_ Add `Thread#wait` and `Thread#wake` methods ([#17226], [#17243], [#17247], [#17380], [#17419], thanks @ysbaddaden)\r\n- _(runtime)_ Add `Crystal::LRUCache` ([#17284], thanks @ysbaddaden)\r\n- _(runtime)_ Add `GC.max_heap_size=` ([#17346], thanks @straight-shoota)\r\n- _(runtime)_ Use epoll event loop on Solaris targets ([#17370], thanks @ysbaddaden)\r\n- _(runtime)_ DWARF: build function names table for fast binary search ([#17410], [#17433], thanks @ysbaddaden)\r\n- _(runtime)_ Enable kqueue event-loop by default on all BSD targets ([#17421], thanks @ysbaddaden)\r\n- _(runtime)_ DWARF: build index of `.debug_line` section ([#17455], thanks @ysbaddaden)\r\n- _(runtime)_ Support `Bytes` in `Crystal::System.printf(%s)` ([#17463], thanks @ysbaddaden)\r\n- _(runtime)_ Support `DW_FORM_addrx<n>` and `DW_FORM_strx<n>` from DWARF 5 ([#17445], thanks @ysbaddaden)\r\n- _(runtime)_ Add `Fiber::ExecutionContext::Parallel#scale_up` to manually scale parallel contexts ([#17438], thanks @ysbaddaden)\r\n- _(runtime)_ Re-enable pretty backtraces in UNIX segfault handler ([#17456], thanks @ysbaddaden)\r\n- _(serialization)_ Add `XML::Node#line_number` ([#17179], thanks @n-rodriguez)\r\n- _(system)_ Include exit code in `Process::Status#description` ([#17087], thanks @straight-shoota)\r\n- _(system)_ Add `File::Info#inspect` ([#17375], thanks @straight-shoota)\r\n- _(system)_ Add `File.exists?(follow_symlinks: true)` ([#17307], [#17600], thanks @straight-shoota, @ysbaddaden)\r\n- _(system)_ `File::Info.readable?`, `.writable?`, `.executable?` `follow_symlinks: false` ([#17391], thanks @straight-shoota)\r\n- _(text)_ Add `Char::Reader.new(Bytes)` ([#17428], thanks @straight-shoota)\r\n- _(time)_ Add `Time::Span#to_nanoseconds` etc. ([#17190], thanks @straight-shoota)\r\n\r\n[#17059]: https://github.com/crystal-lang/crystal/pull/17059\r\n[#17087]: https://github.com/crystal-lang/crystal/pull/17087\r\n[#17096]: https://github.com/crystal-lang/crystal/pull/17096\r\n[#17150]: https://github.com/crystal-lang/crystal/pull/17150\r\n[#17167]: https://github.com/crystal-lang/crystal/pull/17167\r\n[#17179]: https://github.com/crystal-lang/crystal/pull/17179\r\n[#17190]: https://github.com/crystal-lang/crystal/pull/17190\r\n[#17196]: https://github.com/crystal-lang/crystal/pull/17196\r\n[#17226]: https://github.com/crystal-lang/crystal/pull/17226\r\n[#17235]: https://github.com/crystal-lang/crystal/pull/17235\r\n[#17243]: https://github.com/crystal-lang/crystal/pull/17243\r\n[#17247]: https://github.com/crystal-lang/crystal/pull/17247\r\n[#17263]: https://github.com/crystal-lang/crystal/pull/17263\r\n[#17284]: https://github.com/crystal-lang/crystal/pull/17284\r\n[#17307]: https://github.com/crystal-lang/crystal/pull/17307\r\n[#17326]: https://github.com/crystal-lang/crystal/pull/17326\r\n[#17346]: https://github.com/crystal-lang/crystal/pull/17346\r\n[#17349]: https://github.com/crystal-lang/crystal/pull/17349\r\n[#17370]: https://github.com/crystal-lang/crystal/pull/17370\r\n[#17375]: https://github.com/crystal-lang/crystal/pull/17375\r\n[#17380]: https://github.com/crystal-lang/crystal/pull/17380\r\n[#17388]: https://github.com/crystal-lang/crystal/pull/17388\r\n[#17391]: https://github.com/crystal-lang/crystal/pull/17391\r\n[#17410]: https://github.com/crystal-lang/crystal/pull/17410\r\n[#17419]: https://github.com/crystal-lang/crystal/pull/17419\r\n[#17421]: https://github.com/crystal-lang/crystal/pull/17421\r\n[#17425]: https://github.com/crystal-lang/crystal/pull/17425\r\n[#17428]: https://github.com/crystal-lang/crystal/pull/17428\r\n[#17432]: https://github.com/crystal-lang/crystal/pull/17432\r\n[#17433]: https://github.com/crystal-lang/crystal/pull/17433\r\n[#17438]: https://github.com/crystal-lang/crystal/pull/17438\r\n[#17445]: https://github.com/crystal-lang/crystal/pull/17445\r\n[#17455]: https://github.com/crystal-lang/crystal/pull/17455\r\n[#17456]: https://github.com/crystal-lang/crystal/pull/17456\r\n[#17463]: https://github.com/crystal-lang/crystal/pull/17463\r\n[#17600]: https://github.com/crystal-lang/crystal/pull/17600\r\n\r\n#### compiler\r\n\r\n- _(cli)_ Improve compiler error when writing cross-compile output fails ([#17457], thanks @ralsina)\r\n- _(parser)_ Fix parsing suffix form of `ensure` after an `ExceptionHandler` ([#17426], [#17460], thanks @Sija)\r\n- _(semantic)_ Add `Crystal::ALL_FLAGS` and `USER_FLAGS` ([#17392], [#17621], thanks @straight-shoota)\r\n- _(semantic)_ Fix `method_missing` call location metadata ([#17465], thanks @nobodywasishere)\r\n\r\n[#17392]: https://github.com/crystal-lang/crystal/pull/17392\r\n[#17426]: https://github.com/crystal-lang/crystal/pull/17426\r\n[#17457]: https://github.com/crystal-lang/crystal/pull/17457\r\n[#17460]: https://github.com/crystal-lang/crystal/pull/17460\r\n[#17465]: https://github.com/crystal-lang/crystal/pull/17465\r\n[#17621]: https://github.com/crystal-lang/crystal/pull/17621\r\n\r\n#### tools\r\n\r\n- _(docs-generator)_ Update markd 0.6.0 ([#17269], thanks @straight-shoota)\r\n\r\n[#17269]: https://github.com/crystal-lang/crystal/pull/17269\r\n\r\n### Bugfixes\r\n\r\n#### stdlib\r\n\r\n- _(cli)_ Fix bundled short options not consuming a value from the next argument ([#17473], thanks @alter)\r\n- _(collection)_ Fix invalid access in `BitArray#[](Int, Int)` ([#17205], thanks @HertzDevil)\r\n- _(collection)_ Fix `Range#step` raise on zero step size ([#17225], thanks @straight-shoota)\r\n- _(collection)_ Fix `Range#size` overflow on max integer value ([#17266], thanks @mvanhorn)\r\n- _(collection)_ Fix each_repeated_combination iterator raising on an empty collection ([#17275], thanks @SAY-5)\r\n- _(concurrency)_ `Sync::RWLock#try_write_lock?` skips type protection ([#17472], thanks @ysbaddaden)\r\n- _(files)_ invalid resize when writing `IO::Memory` to itself ([#17241], thanks @ysbaddaden)\r\n- _(llvm)_ Add pointer indirection for `__crystal_type_id_to_class_name_map` ([#17502], thanks @HertzDevil)\r\n- _(llvm)_ Fix `LLVM#gep` and `#inbounds_gep` signatures with multiple indices ([#17538], thanks @HertzDevil)\r\n- _(networking)_ Reject unrecognized HTTP `Transfer-Encoding` header ([#17140], thanks @straight-shoota)\r\n- _(networking)_ Reject `HTTP::Client::Response` with invalid `Content-Encoding` ([#17262], thanks @straight-shoota)\r\n- _(networking)_ Fix `HTTP::Request.from_io` parsing empty header name ([#17254], thanks @straight-shoota)\r\n- _(networking)_ **[breaking]** Fix `HTTP::Request#body=` return value ([#17257], thanks @straight-shoota)\r\n- _(networking)_ Fix `Content-Encoding: deflate` ([#17261], thanks @straight-shoota)\r\n- _(networking)_ Fix validation in `Request#hostname` ([#17258], thanks @straight-shoota)\r\n- _(networking)_ Fix `HTTP::Request#form_params?` to ignore invalid content-type ([#17256], thanks @straight-shoota)\r\n- _(networking)_ Fix `HTTP.parse_headers_and_body` to not raise with `without_zlib` ([#17272], thanks @straight-shoota)\r\n- _(networking)_ Validate `HTTP::Request#method` ([#17255], thanks @straight-shoota)\r\n- _(networking)_ Validate `HTTP::Request#version` ([#17304], [#17374], thanks @straight-shoota, @Sija)\r\n- _(networking)_ Fix `HTTP::Request#content_length=` return value ([#17273], thanks @straight-shoota)\r\n- _(networking)_ Validate `HTTP::Request#resource` ([#17310], thanks @straight-shoota)\r\n- _(networking)_ Fix `Socket#sendfile` when `count > file.size` ([#17286], thanks @straight-shoota)\r\n- _(networking)_ Fix `File#sendfile` should not move `#pos` ([#17293], thanks @straight-shoota)\r\n- _(networking)_ Fix IPv6 address passed to `OpenSSL::SSL::Socket::Client.new` for OpenSSL 4.0 ([#17321], thanks @HertzDevil)\r\n- _(networking)_ Fix `HTTP::VALID_TOKEN_CHAR_MAP` for Crystal < 1.16 ([#17333], thanks @straight-shoota)\r\n- _(networking)_ Fix validate `HTTP::Headers` name ([#17317], thanks @straight-shoota)\r\n- _(networking)_ Close `HTTP::Client` on `IO::Error` during request ([#17318], thanks @jgaskins)\r\n- _(networking)_ Fix reject invalid HTTP trailer ([#17337], thanks @straight-shoota)\r\n- _(networking)_ Validate `HTTP::Request#content_length` and type as `Int64` ([#17312], thanks @straight-shoota)\r\n- _(networking)_ Fix keep `HTTP::Request#content_length` in sync with `#body` ([#17389], thanks @straight-shoota)\r\n- _(networking)_ Fix `WebSocket` buffer corruption with interleaved control frame ([#17553], thanks @straight-shoota)\r\n- _(networking)_ Fix `WebSocket::Protocol#receive` to validate masked/unmasked state ([#17562], [#17603], thanks @straight-shoota)\r\n- _(networking)_ Fix `WebSocket` reject mixed opcode continuation ([#17552], thanks @straight-shoota)\r\n- _(numeric)_ Fix `BigRational#<=>` with an infinite `Float` ([#17223], thanks @youdie006)\r\n- _(numeric)_ Fix `Int#humanize_bytes` to use `KiB` in IEC format ([#17234], thanks @kojix2)\r\n- _(runtime)_ `ThreadPool#main_thread_loop` ([#17194], thanks @ysbaddaden)\r\n- _(runtime)_ free dead fiber stack when there's no stack pool ([#17229], thanks @ysbaddaden)\r\n- _(runtime)_ support bare threads in crystal/once ([#17228], thanks @ysbaddaden)\r\n- _(runtime)_ io_uring event loop hangs on sendfile ([#17299], thanks @ysbaddaden)\r\n- _(runtime)_ correctly iterate ELF file sections ([#17327], thanks @ysbaddaden)\r\n- _(runtime)_ backtraces on musl-libc when linking with `-static-pie` ([#17316], thanks @ysbaddaden)\r\n- _(runtime)_ abort on out-of-memory instead of segfaulting ([#17111], [#17345], thanks @carlhoerberg, @straight-shoota)\r\n- _(runtime)_ enqueue thread once into thread pool ([#17350], thanks @ysbaddaden)\r\n- _(runtime)_ save stdio closed state on program start ([#17378], thanks @ysbaddaden)\r\n- _(runtime)_ rewrite thread pool logic to avoid race conditions ([#17400], thanks @ysbaddaden)\r\n- _(runtime)_ don't propagate trace environment variables to sub-processes ([#17402], thanks @ysbaddaden)\r\n- _(runtime)_ tracing 128 bit integers ([#17403], thanks @ysbaddaden)\r\n- _(runtime)_ kqueue event loop on NetBSD ([#17420], thanks @ysbaddaden)\r\n- _(runtime)_ **[regression]** Fix COFF symbols table being empty on MinGW-w64 ([#17442], thanks @HertzDevil)\r\n- _(runtime)_ Fix running on CPUs with `cpu_count > UInt8::MAX` ([#17437], thanks @willhbr)\r\n- _(runtime)_ parallel schedulers may deadlock each other ([#17491], thanks @ysbaddaden)\r\n- _(runtime)_ crystal/once must cleanup when an exception is raised ([#17546], thanks @ysbaddaden)\r\n- _(runtime)_ auto-scaling of multiple execution contexts ([#17514], thanks @ysbaddaden)\r\n- _(runtime)_ Distinguish kqueue registration errors from kevent errors ([#17599], thanks @ysbaddaden)\r\n- _(serialization)_ Fix CSV error line numbers with CRLF input ([#17381], thanks @cuishuang)\r\n- _(serialization)_ Fix CSV builder to escape CR characters ([#17548], thanks @ysbaddaden)\r\n- _(system)_ **[regression]** Fix missing NULL terminator for `execve` vargs ([#17184], thanks @sdogruyol)\r\n- _(system)_ Fix `Process.new` to close pipes on error ([#17297], thanks @straight-shoota)\r\n- _(system)_ **[breaking]** Add `IO::FileDescriptor#exit_on_broken_pipe` ([#17335], thanks @straight-shoota)\r\n- _(system)_ Skip inaccessible candidates for `Process.find_executable` ([#17409], thanks @mvanhorn)\r\n- _(system)_ Fix `FileUtils.mv(Enumerable)` swallowing errors ([#17407], thanks @LaskaIDK)\r\n- _(system)_ Ignore all `File::Error` in `Process.find_executable` ([#17542], thanks @jochenseeber)\r\n- _(text)_ Fix `String#gsub` when `Regex` pattern matches empty string and advances ([#17204], thanks @HertzDevil)\r\n- _(text)_ Fix `URI#resolve` for path without `/` ([#17213], thanks @straight-shoota)\r\n- _(text)_ Handle consecutive whitespace in `String#titleize` ([#17206], thanks @HertzDevil)\r\n- _(text)_ Fix `String#each_line(remove_empty: true)` with many empty lines ([#17242], thanks @straight-shoota)\r\n- _(text)_ Fix `Char::Reader#pos=` to raise on negative position ([#17382], thanks @straight-shoota)\r\n- _(text)_ Fix `Char::Reader#current_char_width` to be zero at end ([#17405], thanks @straight-shoota)\r\n- _(text)_ Fix `String#compare(case_insensitive: true)` to order invalid byte sequences ([#17314], thanks @straight-shoota)\r\n- _(text)_ Fix `Char::Reader.new` to raise on an invalid position ([#17416], thanks @youdie006)\r\n- _(text)_ Fix `PCRE2#jit_compile` to accept nomemory error for implicit fallback ([#17559], thanks @straight-shoota)\r\n- _(time)_ Fix local timezone location name for Android ([#17248], thanks @HertzDevil)\r\n- _(time)_ Fix `Time::Location.load?` for Android ([#17249], thanks @HertzDevil)\r\n\r\n[#17111]: https://github.com/crystal-lang/crystal/pull/17111\r\n[#17140]: https://github.com/crystal-lang/crystal/pull/17140\r\n[#17184]: https://github.com/crystal-lang/crystal/pull/17184\r\n[#17194]: https://githu