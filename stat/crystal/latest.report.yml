8Z","updated_at":"2026-07-16T14:27:41Z"},{"id":479262433,"node_id":"RA_kwDOAGkZhc4ckPbh","name":"crystal-1.21.0-windows-aarch64-gnu-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":60678025,"digest":"sha256:f5d11da3b1727ef49e4acffabcebab6229a631886f6164a94475be1f1390ae83","download_count":109,"created_at":"2026-07-16T14:27:28Z","updated_at":"2026-07-16T14:28:13Z"},{"id":479364212,"node_id":"RA_kwDOAGkZhc4ckoR0","name":"crystal-1.21.0-windows-x86_64-gnu-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":62204829,"digest":"sha256:d0f6f50b16720b240a4c49563c7670ddf1a790fd84c04b29d09818cd9b20608f","download_count":384,"created_at":"2026-07-16T16:05:53Z","updated_at":"2026-07-16T16:06:32Z"},{"id":479371415,"node_id":"RA_kwDOAGkZhc4ckqCX","name":"crystal-1.21.0-windows-x86_64-msvc-unsupported.exe","label":null,"uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-msdownload","state":"uploaded","size":37138468,"digest":"sha256:6b0cd091199937bb89b07736d7e899c292b2d89c5074d292a7c5b22e08dd3f2f","download_count":733,"created_at":"2026-07-16T16:12:47Z","updated_at":"2026-07-16T16:13:01Z"},{"id":479364214,"node_id":"RA_kwDOAGkZhc4ckoR2","name":"crystal-1.21.0-windows-x86_64-msvc-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":51869479,"digest":"sha256:1c691057aa9b17623e021a40f569ca10ce454eae068b61bba2615893249751a7","download_count":7477,"created_at":"2026-07-16T16:05:53Z","updated_at":"2026-07-16T16:06:29Z"}],"body":"### Breaking changes\r\n\r\n#### stdlib\r\n\r\n- _(runtime)_ Release: Execution Contexts ([#17100], [#17104], thanks @ysbaddaden)\r\n- _(text)_ Disable automatic fallback to legacy `PCRE` ([#16924], thanks @straight-shoota)\r\n\r\n[#16924]: https://github.com/crystal-lang/crystal/pull/16924\r\n[#17100]: https://github.com/crystal-lang/crystal/pull/17100\r\n[#17104]: https://github.com/crystal-lang/crystal/pull/17104\r\n\r\n### Features\r\n\r\n#### lang\r\n\r\n- Add `%W` percent string array literals with interpolation ([#16919], thanks @straight-shoota)\r\n- _(macros)_ Add `TypeNode#all_methods` that includes the type's ancestor's methods ([#16902], thanks @Blacksmoke16)\r\n\r\n[#16902]: https://github.com/crystal-lang/crystal/pull/16902\r\n[#16919]: https://github.com/crystal-lang/crystal/pull/16919\r\n\r\n#### stdlib\r\n\r\n- _(cli)_ Align long-only options in OptionParser help ([#16914], thanks @kojix2)\r\n- _(collection)_ Make `Channel(T)` an `Iterator(T)` ([#16916], thanks @jgaskins)\r\n- _(crypto)_ Add support for OpenSSL 4.0 ([#16839], thanks @straight-shoota)\r\n- _(crypto)_ Support OpenSSL 4.x DLLs on Windows MSVC ([#17116], thanks @HertzDevil)\r\n- _(networking)_ **[experimental]** Add `Socket#sendfile` (and `Crystal::EventLoop::Socket#sendfile`) ([#16665], [#17133], thanks @ysbaddaden, @straight-shoota)\r\n- _(networking)_ Add `HTTP::WebSocket#receive` as a synchronous call ([#16689], thanks @jgaskins)\r\n- _(runtime)_ Add `Crystal::EventLoop::FileDescriptor#pread` ([#17068], thanks @ysbaddaden)\r\n- _(runtime)_ Add `without_main` flag ([#17074], thanks @kojix2)\r\n- _(runtime)_ OpenBSD: use kqueue event loop by default ([#17123], thanks @ysbaddaden)\r\n- _(serialization)_ Support nested `root` properties in `JSON::Field` ([#17016], thanks @tcoatswo)\r\n- _(serialization)_ Add `URI::Params::Field(ignore:)`, `ignore_serialize`, `ignore_deserialize` ([#17029], thanks @trypsynth)\r\n- _(specs)_ Allow chaining `#should`, `#should_not` expectations ([#17020], thanks @straight-shoota)\r\n- _(system)_ Expose `Path#kind` ([#16917], thanks @Sija)\r\n- _(system)_ Add splat overloads for `Process.capture`, `.run` and `.new` ([#16975], thanks @straight-shoota)\r\n- _(system)_ Add `Process::Status.[]` constructor ([#17003], thanks @straight-shoota)\r\n- _(text)_ Add `String#present?` ([#16930], thanks @Sija)\r\n- _(text)_ Add `UUID.v6` and `.v8` generators ([#17010], thanks @trypsynth)\r\n\r\n[#16665]: https://github.com/crystal-lang/crystal/pull/16665\r\n[#16689]: https://github.com/crystal-lang/crystal/pull/16689\r\n[#16839]: https://github.com/crystal-lang/crystal/pull/16839\r\n[#16914]: https://github.com/crystal-lang/crystal/pull/16914\r\n[#16916]: https://github.com/crystal-lang/crystal/pull/16916\r\n[#16917]: https://github.com/crystal-lang/crystal/pull/16917\r\n[#16930]: https://github.com/crystal-lang/crystal/pull/16930\r\n[#16975]: https://github.com/crystal-lang/crystal/pull/16975\r\n[#17003]: https://github.com/crystal-lang/crystal/pull/17003\r\n[#17010]: https://github.com/crystal-lang/crystal/pull/17010\r\n[#17016]: https://github.com/crystal-lang/crystal/pull/17016\r\n[#17020]: https://github.com/crystal-lang/crystal/pull/17020\r\n[#17029]: https://github.com/crystal-lang/crystal/pull/17029\r\n[#17068]: https://github.com/crystal-lang/crystal/pull/17068\r\n[#17074]: https://github.com/crystal-lang/crystal/pull/17074\r\n[#17116]: https://github.com/crystal-lang/crystal/pull/17116\r\n[#17123]: https://github.com/crystal-lang/crystal/pull/17123\r\n[#17133]: https://github.com/crystal-lang/crystal/pull/17133\r\n\r\n#### compiler\r\n\r\n- _(cli)_ Classify compiler exit reasons ([#17028], thanks @straight-shoota)\r\n- _(debugger)_ Improve proc debug metadata ([#16830], thanks @skuznetsov)\r\n- _(debugger)_ Emit debug metadata for constants and class vars ([#16831], thanks @skuznetsov)\r\n- _(debugger)_ Improve LLDB collection formatters ([#16832], thanks @skuznetsov)\r\n- _(parser)_ Add `ASTNode#inspect` ([#16699], thanks @straight-shoota)\r\n- _(parser)_ Parse `MacroVar` with empty expressions: `%var{}` ([#16772], thanks @straight-shoota)\r\n- _(semantic)_ Split branches on `when Bar, Baz` ([#17072], thanks @straight-shoota)\r\n\r\n[#16699]: https://github.com/crystal-lang/crystal/pull/16699\r\n[#16772]: https://github.com/crystal-lang/crystal/pull/16772\r\n[#16830]: https://github.com/crystal-lang/crystal/pull/16830\r\n[#16831]: https://github.com/crystal-lang/crystal/pull/16831\r\n[#16832]: https://github.com/crystal-lang/crystal/pull/16832\r\n[#17028]: https://github.com/crystal-lang/crystal/pull/17028\r\n[#17072]: https://github.com/crystal-lang/crystal/pull/17072\r\n\r\n#### tools\r\n\r\n- _(docs-generator)_ Improve wording in warning about doc generator without LibXML2 ([#16926], thanks @kojix2)\r\n\r\n[#16926]: https://github.com/crystal-lang/crystal/pull/16926\r\n\r\n### Bugfixes\r\n\r\n#### stdlib\r\n\r\n- _(cli)_ Fix summary wrapping condition in OptionParser ([#16915], thanks @kojix2)\r\n- _(cli)_ Avoid `Process.exec` on Windows and explicitly spawn subprocess ([#17049], thanks @straight-shoota)\r\n- _(collection)_ Fix `Iterator#compact_map` with `EmptyIterator` ([#16928], thanks @straight-shoota)\r\n- _(collection)_ Fix `Iterator#compact_map` with non-nilable compactor proc ([#16927], thanks @straight-shoota)\r\n- _(concurrency)_ Fix swapped atomic orderings in `Sync::MU` fast paths ([#17063], thanks @stevegeek)\r\n- _(llvm)_ Fix use line 0 for unknown debug location ([#17013], thanks @straight-shoota)\r\n- _(networking)_ Fix `HTTP::Request.form_params?` to recognize `Content-Type` and `charset` ([#16934], [#16971], thanks @swsch, @straight-shoota)\r\n- _(networking)_ Fix `HTTP::Client` to retry for connection recovery only ([#16981], thanks @straight-shoota)\r\n- _(networking)_ Disable transport read-ahead for Kernel TLS sockets ([#17053], thanks @jage)\r\n- _(runtime)_ `Fiber::ExecutionContext::Monitor` compat with old Crystal releases ([#17007], thanks @ysbaddaden)\r\n- _(runtime)_ `EventLoop::IoUring#open` musn't set `O_NONBLOCK` when blocking ([#17035], thanks @ysbaddaden)\r\n- _(runtime)_ underperforming unlock conditions in `Sync::MU` ([#17070], thanks @ysbaddaden)\r\n- _(runtime)_ `fdlock#try_close?` must release ref after yielding to the block ([#17089], thanks @ysbaddaden)\r\n- _(runtime)_ `Fiber::ExecutionContext.current?` ([#17092], thanks @ysbaddaden)\r\n- _(runtime)_ Refactor Win32 iocp evloop ([#17101], thanks @ysbaddaden)\r\n- _(serialization)_ memory leak in `XML::Node#each_namespace` ([#17038], thanks @ysbaddaden)\r\n- _(system)_ skip Windows registry MIME entries with an invalid Content Type ([#17106], thanks @SAY-5)\r\n- _(text)_ Fix `IO::Encoder#write` when operating on long strings ([#16797], thanks @jgaskins)\r\n\r\n[#16797]: https://github.com/crystal-lang/crystal/pull/16797\r\n[#16915]: https://github.com/crystal-lang/crystal/pull/16915\r\n[#16927]: https://github.com/crystal-lang/crystal/pull/16927\r\n[#16928]: https://github.com/crystal-lang/crystal/pull/16928\r\n[#16934]: https://github.com/crystal-lang/crystal/pull/16934\r\n[#16971]: https://github.com/crystal-lang/crystal/pull/16971\r\n[#16981]: https://github.com/crystal-lang/crystal/pull/16981\r\n[#17007]: https://github.com/crystal-lang/crystal/pull/17007\r\n[#17013]: https://github.com/crystal-lang/crystal/pull/17013\r\n[#17035]: https://github.com/crystal-lang/crystal/pull/17035\r\n[#17038]: https://github.com/crystal-lang/crystal/pull/17038\r\n[#17049]: https://github.com/crystal-lang/crystal/pull/17049\r\n[#17053]: https://github.com/crystal-lang/crystal/pull/17053\r\n[#17063]: https://github.com/crystal-lang/crystal/pull/17063\r\n[#17070]: https://github.com/crystal-lang/crystal/pull/17070\r\n[#17089]: https://github.com/crystal-lang/crystal/pull/17089\r\n[#17092]: https://github.com/crystal-lang/crystal/pull/17092\r\n[#17101]: https://github.com/crystal-lang/crystal/pull/17101\r\n[#17106]: https://github.com/crystal-lang/crystal/pull/17106\r\n\r\n#### compiler\r\n\r\n- _(cli)_ Remedy short-flag conflict for `crystal spec -p` ([#17062], thanks @straight-shoota)\r\n- _(codegen)_ Fix codegen treating distinct lib `type` aliases as the same type ([#16961], thanks @stakach)\r\n- _(interpreter)_ Add interpreter `upcast_distinct` for `Pointer` to `Pointer` ([#16962], thanks @stakach)\r\n- _(interpreter:repl)_ Fix auto-indentation in the REPL when typing classes. ([#16910], thanks @I3oris)\r\n- _(interpreter:repl)_ Fix interpreter multidispatch cache collision ([#16958], thanks @stakach)\r\n- _(parser)_ Fix lexing `MacroVar` syntax in literal ([#16779], thanks @straight-shoota)\r\n- _(parser)_ Fix parsing macro var without exps followed by macro expression ([#16879], thanks @straight-shoota)\r\n- _(parser)_ Fix parse parenthesized expression in block arg assignment ([#16894], thanks @straight-shoota)\r\n- _(parser)_ Do not merge nested `Expression` and `ExceptionHandler` ([#16852], thanks @straight-shoota)\r\n- _(parser)_ Fix parser silently ignoring `&(...)`, `&[...]`, `&{...}` in assignment ([#16960], thanks @stakach)\r\n- _(parser)_ Fix parser allow `/` and `//` immediately after `self`, `nil`, `true`, `false` ([#16942], thanks @stakach)\r\n- _(parser)_ Fix short block setter call end location ([#17039], thanks @Sija)\r\n- _(semantic)_ Fix freeze type of variable declared with `out` ([#16870], thanks @straight-shoota)\r\n- _(semantic)_ Fix `lookup_matches_in_type` to reject partial matches ([#16867], thanks @straight-shoota)\r\n- _(semantic)_ Fix location of double splat named tuple typenode entry locations ([#16889], thanks @Blacksmoke16)\r\n- _(semantic)_ Fix `sizeof`, `offsetof` as generic type argument in inferred ivar type ([#16811], thanks @kojix2)\r\n- _(semantic)_ Fix macro argument errors for path receiver calls ([#16923], thanks @kojix2)\r\n- _(semantic)_ Detect uninitialized ancestor ivars through macro_def initializers ([#16959], thanks @stakach)\r\n- _(semantic)_ Preserve `nil_if_read?` across while cond filters ([#16963], thanks @stakach)\r\n- _(semantic)_ Keep wider subclass observer when call owner narrows (#16947) ([#16990], thanks @stakach)\r\n- _(semantic)_ Symmetric `common_descendent` for two generic class types (#10831) ([#16999], thanks @stakach)\r\n\r\n[#16779]: https://github.com/crystal-lang/crystal/pull/16779\r\n[#16811]: https://github.com/crystal-lang/crystal/pull/16811\r\n[#16852]: https://github.com/crystal-lang/crystal/pull/16852\r\n[#16867]: https://github.com/crystal-lang/crystal/pull/16867\r\n[#16870]: https://github.com/crystal-lang/crystal/pull/16870\r\n[#16879]: https://github.com/crystal-lang/crystal/pull/16879\r\n[#16889]: https://github.com/crystal-lang/crystal/pull/16889\r\n[#16894]: https://github.com/crystal-lang/crystal/pull/16894\r\n[#16910]: https://github.com/crystal-lang/crystal/pull/16910\r\n[#16923]: https://github.com/crystal-lang/crystal/pull/16923\r\n[#16942]: https://github.com/crystal-lang/crystal/pull/16942\r\n[#16958]: https://github.com/crystal-lang/crystal/pull/16958\r\n[#16959]: https://github.com/crystal-lang/crystal/pull/16959\r\n[#16960]: https://github.com/crystal-lang/crystal/pull/16960\r\n[#16961]: https://github.com/crystal-lang/crystal/pull/16961\r\n[#16962]: https://github.com/crystal-lang/crystal/pull/16962\r\n[#16963]: https://github.com/crystal-lang/crystal/pull/16963\r\n[#16990]: https://github.com/crystal-lang/crystal/pull/16990\r\n[#16999]: https://github.com/crystal-lang/crystal/pull/16999\r\n[#17039]: https://github.com/crystal-lang/crystal/pull/17039\r\n[#17062]: https://github.com/crystal-lang/crystal/pull/17062\r\n\r\n#### tools\r\n\r\n- _(formatter)_ Fix format empty `then` with trailing comment ([#16878], thanks @straight-shoota)\r\n- _(formatter)_ Fix formatting whitespace in ternary `if` with trailing comments ([#16880], thanks @straight-shoota)\r\n- _(formatter)_ Fix formatter on empty string literal continuation ([#16817], thanks @straight-shoota)\r\n- _(formatter)_ Fix format annotations of splat parameter ([#16987], thanks @straight-shoota)\r\n- _(formatter)_ Fix formatter strip empty lines in heredoc ([#17034], thanks @straight-shoota)\r\n\r\n[#16817]: https://github.com/crystal-lang/crystal/pull/16817\r\n[#16878]: https://github.com/crystal-lang/crystal/pull/16878\r\n[#16880]: https://github.com/crystal-lang/crystal/pull/16880\r\n[#16987]: https://github.com/crystal-lang/crystal/pull/16987\r\n[#17034]: https://github.com/crystal-lang/crystal/pull/17034\r\n\r\n### Chores\r\n\r\n#### stdlib\r\n\r\n- _(cli)_ **[deprecation]** Deprecate `Colorize.on_tty_only!` ([#16859], thanks @straight-shoota)\r\n- _(concurrency)_ **[deprecation]** Deprecate `spawn(same_thread:)` ([#17097], thanks @ysbaddaden)\r\n- _(files)_ **[deprecation]** Rename parameter to `writable` in `IO::Memory.new` ([#16858], [#16883], thanks @straight-shoota)\r\n- _(system)_ **[deprecation]** Hide platform-specific `Process::Status` constructor ([#16997], thanks @straight-shoota)\r\n\r\n[#16858]: https://github.com/crystal-lang/crystal/pull/16858\r\n[#16859]: https://github.com/crystal-lang/crystal/pull/16859\r\n[#16883]: https://github.com/crystal-lang/crystal/pull/16883\r\n[#16997]: https://github.com/crystal-lang/crystal/pull/16997\r\n[#17097]: https://github.com/crystal-lang/crystal/pull/17097\r\n\r\n### Performance\r\n\r\n#### stdlib\r\n\r\n- _(collection)_ Preallocate correct size for hash in `Hash.zip` ([#17054], thanks @carlhoerberg)\r\n\r\n[#17054]: https://github.com/crystal-lang/crystal/pull/17054\r\n\r\n### Refactor\r\n\r\n#### stdlib\r\n\r\n- _(cli)_ Split error helper for compiler CLI into independent methods ([#16984], thanks @straight-shoota)\r\n- _(cli)_ Refactor compiler code to raise `CompilerError` instead of `abort` ([#16995], thanks @straight-shoota)\r\n- _(concurrency)_ simplify read console (windows) 