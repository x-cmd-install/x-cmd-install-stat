89be7d8199c16a1588a6ad5b465a250f88cf53e0","download_count":9,"created_at":"2026-10-22T22:01:35Z","updated_at":"2026-10-22T22:03:50Z"},{"id":667213598,"node_id":"RA_kwDOAGkZhc4nxN8e","name":"crystal-1.22.1-windows-x86_64-msvc-unsupported.exe","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":39121113,"digest":"sha256:71c4f789f41115a6eb70dd9a6df2014f75e80ac3b73446e70dec7634a198f91e","download_count":160,"created_at":"2026-10-22T22:02:12Z","updated_at":"2026-10-22T22:03:27Z"},{"id":667215316,"node_id":"RA_kwDOAGkZhc4nxOXU","name":"crystal-1.22.1-windows-x86_64-msvc-unsupported.zip","label":"","uploader":{"login":"straight-shoota","id":466378,"node_id":"MDQ6VXNlcjQ2NjM3OA==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":55116769,"digest":"sha256:b544330c3bbca8fd1238af6f2552b2c89d50032274b2045bc1f0bc9ff55b058b","download_count":679,"created_at":"2026-10-22T22:03:05Z","updated_at":"2026-10-22T22:04:02Z"}],"body":"### Bugfixes\r\n\r\n#### stdlib\r\n\r\n- _(crypto)_ **[security]** Fix invalid `OpenSSL::SSL::Options::ALL` option ([#17657], thanks @ysbaddaden)\r\n- _(crypto)_ Allow exactly 72 byte bcrypt passwords ([#17676], thanks @Blacksmoke16)\r\n- _(networking)_ **[regression]** Send `Content-Length: 0` for `POST` and `PUT` without body ([#17631], thanks @dentarg)\r\n- _(networking)_ **[regression]** Send `Content-Length: 0` for `PATCH` without body ([#17632], thanks @dentarg)\r\n- _(runtime)_ **[regression]** Fix `Fiber::ExecutionContext::Isolated` resuming its fiber without an event ([#17630], thanks @dentarg)\r\n- _(runtime)_ Refactor io_uring event loop's sleep to use timers ([#17655], thanks @ysbaddaden)\r\n- _(runtime)_ Fix adjust IP before resolving backtraces ([#17622], thanks @ysbaddaden)\r\n- _(runtime)_ Fix race condition in select timeout action ([#17640], thanks @ysbaddaden)\r\n- _(runtime)_ `Crystal.init_runtime` must create main Thread and Fiber ([#17688], thanks @ysbaddaden)\r\n- _(serialization)_ Fix out-of-bounds reads in `XML::Node#name` ([#17648], thanks @zw963)\r\n- _(system)_ Fix `FileUtils.rm_r` failing on a symlink loop ([#17613], thanks @jochenseeber)\r\n- _(text)_ **[regression]** Fix out-of-bound access in `String#scan_byte_index` ([#17625], thanks @HertzDevil)\r\n- _(text)_ Fix `String::Builder` buffer grows capacity for trailing zero ([#17650], thanks @straight-shoota)\r\n\r\n[#17613]: https://github.com/crystal-lang/crystal/pull/17613\r\n[#17622]: https://github.com/crystal-lang/crystal/pull/17622\r\n[#17625]: https://github.com/crystal-lang/crystal/pull/17625\r\n[#17630]: https://github.com/crystal-lang/crystal/pull/17630\r\n[#17631]: https://github.com/crystal-lang/crystal/pull/17631\r\n[#17632]: https://github.com/crystal-lang/crystal/pull/17632\r\n[#17640]: https://github.com/crystal-lang/crystal/pull/17640\r\n[#17648]: https://github.com/crystal-lang/crystal/pull/17648\r\n[#17650]: https://github.com/crystal-lang/crystal/pull/17650\r\n[#17655]: https://github.com/crystal-lang/crystal/pull/17655\r\n[#17657]: https://github.com/crystal-lang/crystal/pull/17657\r\n[#17676]: https://github.com/crystal-lang/crystal/pull/17676\r\n[#17688]: https://github.com/crystal-lang/crystal/pull/17688\r\n\r\n#### compiler\r\n\r\n- _(codegen)_ Do not redeclare lib funs or LLVM intrinsics in the main LLVM module ([#17637], [#17672], thanks @HertzDevil)\r\n- _(debugger)_ Set debug location before inlining a call ([#17602], thanks @Blacksmoke16)\r\n- _(semantic)_ Fix propagate raises state to target defs in call cycles ([#17656], thanks @ysbaddaden)\r\n- _(semantic)_ Fix `IndexError` condition in strict 1-to-n assignment with splats ([#17675], thanks @HertzDevil)\r\n\r\n[#17602]: https://github.com/crystal-lang/crystal/pull/17602\r\n[#17637]: https://github.com/crystal-lang/crystal/pull/17637\r\n[#17656]: https://github.com/crystal-lang/crystal/pull/17656\r\n[#17672]: https://github.com/crystal-lang/crystal/pull/17672\r\n[#17675]: https://github.com/crystal-lang/crystal/pull/17675\r\n\r\n### Chores\r\n\r\n#### stdlib\r\n\r\n- _(networking)_ Disable kernel TLS by default again ([#17649], thanks @straight-shoota)\r\n\r\n[#17649]: https://github.com/crystal-lang/crystal/pull/17649\r\n\r\n### Infrastructure\r\n\r\n- Add changelog for 1.22.1 ([#17683], thanks @straight-shoota)\r\n- Update distribution-scripts ([#17699], thanks @straight-shoota)\r\n\r\n[#17683]: https://github.com/crystal-lang/crystal/pull/17683\r\n[#17699]: https://github.com/crystal-lang/crystal/pull/17699\r\n\r\n","reactions":{"total_count":16,"+1":3,"-1":0,"laugh":1,"hooray":3,"confused":0,"heart":7,"rocket":2,"eyes":0},"mentions_count":7}
