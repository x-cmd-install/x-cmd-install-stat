 variables ([#17558], thanks @grepsedawk)\r\n- _(semantic)_ Fix instance variable initializer using a class variable assignment ([#17148], thanks @nobodywasishere)\r\n- _(semantic)_ Fix bug allowing `self` in private top-level method ([#17149], thanks @nobodywasishere)\r\n- _(semantic)_ Fix dynamic class declaration macro error ([#17274], thanks @nobodywasishere)\r\n- _(semantic)_ Backfill included type to existing instantiations ([#17094], thanks @straight-shoota)\r\n- _(semantic)_ Fix ICE when module with ivar is included in a type that can't have them ([#17386], thanks @bcardiff)\r\n- _(semantic)_ Disallow `instance_sizeof` and `instance_alignof` on `Void` or `NoReturn` ([#17453], thanks @HertzDevil)\r\n\r\n[#17094]: https://github.com/crystal-lang/crystal/pull/17094\r\n[#17130]: https://github.com/crystal-lang/crystal/pull/17130\r\n[#17148]: https://github.com/crystal-lang/crystal/pull/17148\r\n[#17149]: https://github.com/crystal-lang/crystal/pull/17149\r\n[#17159]: https://github.com/crystal-lang/crystal/pull/17159\r\n[#17274]: https://github.com/crystal-lang/crystal/pull/17274\r\n[#17365]: https://github.com/crystal-lang/crystal/pull/17365\r\n[#17386]: https://github.com/crystal-lang/crystal/pull/17386\r\n[#17395]: https://github.com/crystal-lang/crystal/pull/17395\r\n[#17397]: https://github.com/crystal-lang/crystal/pull/17397\r\n[#17424]: https://github.com/crystal-lang/crystal/pull/17424\r\n[#17448]: https://github.com/crystal-lang/crystal/pull/17448\r\n[#17450]: https://github.com/crystal-lang/crystal/pull/17450\r\n[#17453]: https://github.com/crystal-lang/crystal/pull/17453\r\n[#17510]: https://github.com/crystal-lang/crystal/pull/17510\r\n[#17518]: https://github.com/crystal-lang/crystal/pull/17518\r\n[#17558]: https://github.com/crystal-lang/crystal/pull/17558\r\n[#17572]: https://github.com/crystal-lang/crystal/pull/17572\r\n[#17616]: https://github.com/crystal-lang/crystal/pull/17616\r\n\r\n#### tools\r\n\r\n- _(formatter)_ Fix formatter for setter assignment with parenthesized values ([#17083], thanks @mamantoha)\r\n- _(formatter)_ formatter unescapes fresh variables ([#17517], thanks @ysbaddaden)\r\n\r\n[#17083]: https://github.com/crystal-lang/crystal/pull/17083\r\n[#17517]: https://github.com/crystal-lang/crystal/pull/17517\r\n\r\n### Chores\r\n\r\n#### lang\r\n\r\n- **[deprecation]** Deprecate uppercase instance and class variables ([#17160], thanks @nobodywasishere)\r\n\r\n[#17160]: https://github.com/crystal-lang/crystal/pull/17160\r\n\r\n#### stdlib\r\n\r\n- _(llvm)_ **[deprecation]** Deprecate `LLVM::Type#size` and `#alignment` ([#17494], [#17533], thanks @HertzDevil)\r\n- _(networking)_ **[deprecation]** Deprecate `HTTP::Request#local_address` and `#remote_address` ([#17260], thanks @straight-shoota)\r\n\r\n[#17260]: https://github.com/crystal-lang/crystal/pull/17260\r\n[#17494]: https://github.com/crystal-lang/crystal/pull/17494\r\n[#17533]: https://github.com/crystal-lang/crystal/pull/17533\r\n\r\n#### compiler\r\n\r\n- _(codegen)_ Drop `Compiler#fork_codegen` ([#16417], thanks @straight-shoota)\r\n\r\n[#16417]: https://github.com/crystal-lang/crystal/pull/16417\r\n\r\n#### other\r\n\r\n- Fix deprecation warnings in samples ([#17342], thanks @HertzDevil)\r\n\r\n[#17342]: https://github.com/crystal-lang/crystal/pull/17342\r\n\r\n### Performance\r\n\r\n#### stdlib\r\n\r\n- _(networking)_ Optimize `HTTP.header_name` ([#14503], thanks @jgaskins)\r\n- _(runtime)_ Keep decoded backtrace lines into LRU cache ([#17285], thanks @ysbaddaden)\r\n- _(text)_ Optimize `String#byte_index(Int)` ([#17303], thanks @HertzDevil)\r\n- _(text)_ Optimize `String#gsub(String)` and `#scan(String)` ([#17305], thanks @HertzDevil)\r\n\r\n[#14503]: https://github.com/crystal-lang/crystal/pull/14503\r\n[#17285]: https://github.com/crystal-lang/crystal/pull/17285\r\n[#17303]: https://github.com/crystal-lang/crystal/pull/17303\r\n[#17305]: https://github.com/crystal-lang/crystal/pull/17305\r\n\r\n### Refactor\r\n\r\n#### stdlib\r\n\r\n- _(collection)_ Optimize buffer size in `Enum.parse?` with `StringLiteral#bytesize` ([#17193], thanks @straight-shoota)\r\n- _(networking)_ Refactor `Socket::IPAddress` interface index conversion ([#17250], thanks @HertzDevil)\r\n- _(networking)_ Refactor `RequestProcessor#process` to receive a single IO ([#17461], thanks @straight-shoota)\r\n- _(numeric)_ Use unchecked arithmetic in compiler-rt ports ([#17180], thanks @HertzDevil)\r\n- _(numeric)_ Use native `UInt128` in Dragonbox ([#16262], thanks @HertzDevil)\r\n- _(numeric)_ Format `Int` `MIN`and `MAX` constants as hex numbers ([#17352], thanks @straight-shoota)\r\n- _(numeric)_ Use 128-bit literals ([#5545], thanks @Sija)\r\n- _(runtime)_ Execution contexts directly enqueue fibers during event loop runs ([#17158], thanks @ysbaddaden)\r\n- _(runtime)_ Add `Runnables#lazy_grab?` to skip the mutex on quick dequeue ([#17151], thanks @ysbaddaden)\r\n- _(runtime)_ Refactor file lock ([#17105], thanks @ysbaddaden)\r\n- _(runtime)_ Refactor `Exception::CallStack.decode_backtrace_frame` ([#17282], thanks @ysbaddaden)\r\n- _(runtime)_ DWARF: scan sections instead of building large tables ([#17283], thanks @ysbaddaden)\r\n- _(text)_ Refactor `Char::Reader#next_char` and ivar initialization ([#17383], thanks @straight-shoota)\r\n- _(time)_ Change `Time.zero` to create new instance instead of returning `ZERO` ([#17216], thanks @straight-shoota)\r\n- _(time)_ Replace `Time::Span::ZERO` with `.zero` ([#17217], thanks @straight-shoota)\r\n- _(time)_ Use `Time::Span#to_seconds` etc. ([#17259], thanks @straight-shoota)\r\n\r\n[#5545]: https://github.com/crystal-lang/crystal/pull/5545\r\n[#16262]: https://github.com/crystal-lang/crystal/pull/16262\r\n[#17105]: https://github.com/crystal-lang/crystal/pull/17105\r\n[#17151]: https://github.com/crystal-lang/crystal/pull/17151\r\n[#17158]: https://github.com/crystal-lang/crystal/pull/17158\r\n[#17180]: https://github.com/crystal-lang/crystal/pull/17180\r\n[#17193]: https://github.com/crystal-lang/crystal/pull/17193\r\n[#17216]: https://github.com/crystal-lang/crystal/pull/17216\r\n[#17217]: https://github.com/crystal-lang/crystal/pull/17217\r\n[#17250]: https://github.com/crystal-lang/crystal/pull/17250\r\n[#17259]: https://github.com/crystal-lang/crystal/pull/17259\r\n[#17282]: https://github.com/crystal-lang/crystal/pull/17282\r\n[#17283]: https://github.com/crystal-lang/crystal/pull/17283\r\n[#17352]: https://github.com/crystal-lang/crystal/pull/17352\r\n[#17383]: https://github.com/crystal-lang/crystal/pull/17383\r\n[#17461]: https://github.com/crystal-lang/crystal/pull/17461\r\n\r\n#### compiler\r\n\r\n- Refactor `Program#define_crystal_constants` ([#17268], thanks @straight-shoota)\r\n- _(codegen)_ Remove `Crystal::LLVMBuilderHelper#llvm_size` and friends ([#17452], thanks @HertzDevil)\r\n- _(semantic)_ Refactor `RangeLiteral#each` ([#17195], thanks @straight-shoota)\r\n- _(semantic)_ Refactor `#interpret_to_range` ([#17227], thanks @straight-shoota)\r\n\r\n[#17195]: https://github.com/crystal-lang/crystal/pull/17195\r\n[#17227]: https://github.com/crystal-lang/crystal/pull/17227\r\n[#17268]: https://github.com/crystal-lang/crystal/pull/17268\r\n[#17452]: https://github.com/crystal-lang/crystal/pull/17452\r\n\r\n#### other\r\n\r\n- Remove unnecessary requires ([#17306], thanks @straight-shoota)\r\n- Do not use relative requires for the standard library ([#17320], thanks @HertzDevil)\r\n\r\n[#17306]: https://github.com/crystal-lang/crystal/pull/17306\r\n[#17320]: https://github.com/crystal-lang/crystal/pull/17320\r\n\r\n### Documentation\r\n\r\n#### stdlib\r\n\r\n- _(collection)_ Fix doc example for `Hash#put` ([#17459], thanks @spuun)\r\n- _(concurrency)_ Clarify docs for `Channel` buffered channel close and drain semantics ([#17423], thanks @renich)\r\n- _(numeric)_ Fix typo in doc comment for `Int` ([#17238], thanks @swsch)\r\n- _(runtime)_ Undocument internal `GC` methods ([#17451], thanks @ysbaddaden)\r\n- _(serialization)_ Ment