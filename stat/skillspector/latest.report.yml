{"id":395111829,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORsnMJ84XjO2V","tag_name":"v2.12.0","target_commitish":"main","name":"SkillSpector v2.12.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-09-23T22:27:53Z","updated_at":"2026-10-04T08:16:18Z","published_at":"2026-09-23T22:28:18Z","assets":[{"id":584692101,"node_id":"RA_kwDORsnMJ84i2bGF","name":"skillspector-2.12.0-py3-none-any.whl","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":665509,"digest":"sha256:62973f6254d30c871480246869f88a01e17dff6f12e9d43010962eb0d7e305f4","download_count":2605,"created_at":"2026-09-23T22:28:17Z","updated_at":"2026-09-23T22:28:17Z"},{"id":584692099,"node_id":"RA_kwDORsnMJ84i2bGD","name":"skillspector-2.12.0.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1543434,"digest":"sha256:507c367b8f53b821adf0568bb32c7e08dd2da8f63900efa7ceccb53e9b401b53","download_count":97,"created_at":"2026-09-23T22:28:17Z","updated_at":"2026-09-23T22:28:17Z"}],"body":"# SkillSpector v2.12.0\n\nPublished September 23, 2026.\n\n## Summary\n\nSkillSpector 2.12.0 improves skill analysis, report consistency, scan visibility, and performance. It adds OpenCode integrations, more flexible repository inputs, expanded model configuration, and optional CI controls. The release also includes security hardening, bug fixes, and reliability improvements.\n\n## Highlights\n\n- Improved analysis accuracy and more consistent reporting of scan completeness.\n- Better finding identity, source locations, and machine-readable reports.\n- Faster scanning and interactive progress that keeps report output separate from status messages.\n- OpenCode integration and expanded provider and model configuration guidance.\n- GitHub subdirectory scanning and direct GitHub/GitLab file-link support.\n- Additional regression coverage and portability improvements.\n\n## Features and usability\n\n- Add the optional `opencode_cli` provider and a repository-provided OpenCode command and tool.\n- Support selected GitHub `/tree/` subdirectories using advertised branches or tags. Arbitrary commit-SHA tree URLs are not supported by this selection path. GitHub/GitLab `/blob/` links are processed as file contents.\n- Add the opt-in `--fail-on-findings` CLI flag and a configurable per-artifact static-analysis allowance.\n- Show progress and discovered files on standard error during non-verbose interactive scans. JSON and SARIF report output remains on standard output.\n- Add sanitized LLM configuration and execution provenance to JSON reports. Provenance describes the recorded configuration and execution; it does not guarantee deterministic provider results.\n- Add optional compact prompt line numbering, updated model-budget metadata, and Gemini 3.5 Flash setup guidance for the existing OpenAI-compatible provider.\n- Improve recursive reporting and finding locations in JSON and SARIF.\n- Retry eligible transient provider failures within the workflow deadline. Additional requests and backoff can affect latency and provider cost.\n\n## Upgrade and compatibility notes\n\n- Findings, risk scores, recommendations, and completeness results can change after upgrading. Review existing baselines and downstream report handling.\n- Use supported inputs and UTF-8 instruction files. Unsupported required input or execution errors may return exit code 2. Input-size and complexity limits continue to apply.\n- `--fail-on-findings` is opt-in. Combine it with `--fail-on-incomplete` when CI must reject either active findings or incomplete coverage. A policy-gate failure returns code 1; code 2 denotes an input or execution error. Exit code 0 alone does not establish complete inspection.\n- Report consumers should tolerate additive metadata and diagnostic fields, preserve completeness and omission information, and handle occurrence-specific locations. JSON columns are zero-based; SARIF columns are one-based Unicode-codepoint positions. Unavailable columns remain unknown.\n- Reference diagnostics distinguish `reference_missing` from `reference_unresolved`. MCP consumers must check completeness separately: an eligible installation result may still carry missing-reference caveats. Retain eligibility, completeness, and recommendation fields together.\n- The default static-analysis allowance increases from 30 to 300 seconds per artifact, still bounded by the workflow deadline. Set `SKILLSPECTOR_MAX_STATIC_ANALYSIS_SECONDS_PER_ARTIFACT=30` to retain the previous allowance, and restart the process after changing it.\n- OpenCode semantic analysis is opt-in and requires an authenticated OpenCode **1.18.31** installation. Install the native OpenCode integration by copying `.opencode/` from a checkout; it is not installed by the Python wheel. The native tool defaults to static analysis. Configure the provider and set `noLlm=false` when requesting semantic analysis. Token-usage accounting is not currently available for `opencode_cli`.\n- Pi extension users must use the extension's `.venv` or configure `SKILLSPECTOR_BIN` as an existing absolute executable path, and keep report outputs within the current workspace. These requirements are specific to the Pi extension.\n- CLI providers now honor valid `SKILLSPECTOR_MODEL_REGISTRY` token-budget overrides. LLM seeds must fit a signed 64-bit integer. Optional compact prompt numbering is enabled with `SKILLSPECTOR_COMPACT_PROMPTS`; existing formatting remains the default.\n- Use `--no-llm` for an intended static-only scan. Requested analysis that cannot run remains visible in completeness metadata.\n- Third-party dependency versions are unchanged from 2.11.2. No deprecations are introduced in this release.\n\n## Validation and scope\n\nRegression coverage and cross-platform test fixtures were expanded. Scan results remain bounded by the supported inputs, configured analyzers, and recorded resource limits. Incomplete inspection remains a reportable outcome.\n\nProvider availability, model behavior, and deployment compatibility depend on the configured environment and require environment-specific validation. Publication of this release does not establish that every provider, platform, or downstream deployment has been qualified.\n\nPrepared by Codex on behalf of Mohit Gupta.\n","reactions":{"total_count":4,"+1":0,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":0,"rocket":0,"eyes":0}}
