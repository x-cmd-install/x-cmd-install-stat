"uploader":{"login":"netblue30","id":13711990,"node_id":"MDQ6VXNlcjEzNzExOTkw","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/vnd.debian.binary-package","state":"uploaded","size":539860,"digest":"sha256:93cd33680c0a99128c8013155c281901df60ab6668bf0efd0a07a2e2ef6d754e","download_count":14,"created_at":"2026-11-02T14:30:31Z","updated_at":"2026-11-02T14:30:32Z"}],"body":"  * security: create `~/.config/firejail` to prevent sandbox escape (#7154)\r\n  * security: fix use of dangling pointer for netns argument (#7246)\r\n  * feature: allow subpaths in xdg macros (#2359 #7151)\r\n  * feature: add `${PROJECTS}` macro (#7157)\r\n  * feature: add `${PUBLICSHARE}` and `${TEMPLATES}` macros (#7164)\r\n  * feature: profstats: add --include command line option (#7265)\r\n  * feature: implement `syscall:log` in seccomp lists (#7289)\r\n  * modif: create a new syscall group: `@program-keep` (9d90daf)\r\n  * modif: stop following symlinks to /dev/null on disable (#5803 #7129)\r\n  * modif: add backtick in `reject_meta_chars()` (#7183)\r\n  * modif: add more metachars in `reject_meta_chars()` (#7186)\r\n  * modif: fbwrap: improve log messages (#7227)\r\n  * modif: add fchroot syscall (928e6ff 541dd07)\r\n  * modif: move hardcoded blacklist ~/.config/firejail into disable-common\r\n    (#7132 #7282)\r\n  * modif/removal: X11 code restructuring:\r\n    --x11=xpra support was removed.\r\n    --x11=xorg support (Xorg security extension) was disabled in the default\r\n    software configuration, the user will need to add --enable-x11-legacy flag\r\n    for ./configure (./configure --enable-x11-legacy)\r\n    --x11=xvfb support (xvfb display server) is disabled in the default software\r\n    configuration, the user will need to add --enable-x11-legacy flag for\r\n    ./configure (./configure --enable-x11-legacy)\r\n    --x11=xephyr command is removed, however, Xephyr display server is used by\r\n    default by --x11 command.\r\n  * removal: temporarily disabled --ip=dhcp. ISC-DHCP is no longer supported\r\n     in Debian. We will bring back this option in release 0.9.84 using\r\n     a different DHCP client\r\n     (https://tracker.debian.org/news/1782808/removed-443-p1-8-from-unstable/)\r\n  * removal: --bandwidth= command (#7197)\r\n  * removal: --tracelog/blacklist-nolog commands (#7198)\r\n  * removal: ./configure --enable-busybox-workaround option (#7199)\r\n  * removal: --private-home command (#7200)\r\n  * removal: ./configure --disable-sandbox-check option (#7201)\r\n  * removal: --x11=xpra option (#7207)\r\n  * removal: firecfg --guide; the pertinent information was moved in\r\n    man firejail (#7260)\r\n  * removal: private-lib (#7261)\r\n  * removal: ssh restricted shell feature (#7262)\r\n  * bugfix: disable /run/systemd/resolve with net=none - fixes potential DNS\r\n    leaks when using systemd-resolved (#7209 #7216)\r\n  * bugfix: fbwrap: wait for target and propagate exit code (#7081 #7224)\r\n  * bugfix: mountinfo: handle lines longer than 4096 bytes (#6450 #7225)\r\n  * bugfix: fix string lifetimes in profile.c (#7267)\r\n  * bugfix: fix ignored negation for syscalls number 0 (#7255 #7280)\r\n  * bugfix: fix non-standard /etc/hosts lines (#6210 #7281)\r\n  * docs: man: fix typo in example (#7106)\r\n  * docs: recommend .deb or building from source on debian/ubuntu (#7110)\r\n  * docs: note how to use net=none for appimages (#7257)\r\n  * docs: firecfg: note to not enable devtools (#7276)\r\n  * build: fix empty lists in syscall.c breaking compilation (#7108 #7109)\r\n  * build: remove unused install.sh (#7124)\r\n  * build: merge fnettrace headers into `fnettrace_common.h` (#7127)\r\n  * build: remove unused `remove_cnt` variable in src/fsec-optimize/optimizer.c\r\n    (156593d)\r\n  * build: gen-syscalls.sh: remove trailing spaces in `new_syscalls.txt`\r\n    (4a5ed83)\r\n  * build: deb: add conflict with firejail-profiles (#7141)\r\n  * build: netfilter.c: replace `system()` with `execv()` (#7159)\r\n  * build: remove etc-fixes directory (#7148)\r\n  * build: fix scan-build warnings (#7205)\r\n  * build: disable --chroot= by default (#7202)\r\n  * build: simplify and improve test-compile (#7206)\r\n  * build: test: fix cleaning of some temporary files (#7222)\r\n  * build: test: format/improve targets (#7223)\r\n  * build: test: sync `DISTFILES_TEST` with `TESTS` (#7238)\r\n  * build: disable --x11=(xorg|xvfb) options by default (#7263)\r\n  * build: disable --ip=dhcp by default (#7264)\r\n  * test: fix unescaped newlines in error messages (#7146)\r\n  * test/fs: improve tests related to macros (#7147)\r\n  * test/fs: deduplicate xdg dirs in macro tests (#7163)\r\n  * test/fs: support and use XDG user dir env vars (#7167)\r\n  * test/apps: full rewrite; currently make test-apps command test runs tests\r\n    on about 70 common Linux applications; the test is targeted to Arch\r\n    and/or Fedora platforms.\r\n  * ci: make all main make steps parallel and sync output (#7162)\r\n  * ci: dependabot: split and group codeql actions to fix checks (#7192)\r\n  * ci: update clang-14 to clang-18 (#7203)\r\n  * ci: build: replace ubuntu-22.04 with ubuntu-latest (#7210)\r\n  * profiles: disable-programs: add lact paths (#7083)\r\n  * profiles: disable-exec: add mount paths (#7112)\r\n  * profiles: mumble: include whitelist-runuser-common (#7084)\r\n  * profiles: disable-common: add xfce clipman path (#7120)\r\n  * profiles: steam: allow ~/.cache/nvidia to improve game performance (#7114)\r\n  * profiles: firefox-common: allow auto light/dark theme switching (#7103)\r\n  * profiles: steam: allow more 3d cache paths (#7149)\r\n  * profiles: torbrowser-launcher: add no3d (#7143)\r\n  * profiles: add llm-agent-common.profile (#7158)\r\n  * profiles: use xdg macros with subpaths (#7160)\r\n  * profiles: man: add terminfo (#7130 #7131)\r\n  * profiles: lutris: fix proton compatibility (#7181)\r\n  * profiles: add allow-bwrap to profile.template (3725c08 1cd47bf)\r\n  * profiles: templates: improve formatting & clarify rules (#7172)\r\n  * profiles: disable-common: allow `${PATH}/dpkg` (6c0ec7c e694324)\r\n  * profiles: firefox-common: add seccomp.block-secondary (#7204)\r\n  * profiles: llm-agent-common: disable private-cache (#7212)\r\n  * profiles: librewolf: add ~/.config/librewolf (#7233)\r\n  * profiles: keepassxc: add ~/.local/state/keepassxc (#7235)\r\n  * profiles: mpv: allow dbus mpris (#7134 #7237)\r\n  * profiles: browsers: add private-cache to firefox-common and chromium-common\r\n    browsers (d3bf6ac, 70107ef)\r\n  * profiles: keepassxc & thunderbird: allow librewolf paths (#7272)\r\n  * profiles: keepassxc-proxy: fix typo (#7278)\r\n  * profiles: evince: add deterministic-shutdown (#7269 #7277)\r\n  * profiles: blink-common-hardened: drop netlink & add mdwe comment (#7165)\r\n  * profiles: torbrowser-launcher: add getconf to private-bin (#7152)\r\n  * profiles: firefox-common: allow `ioprio_set` syscall (#7284)\r\n  * profiles: steam: allow `mount_setattr` syscall (#7268 #7287)\r\n  * new profile: gemini (#6936)\r\n  * new profile: opencode (#7135)\r\n  * new profile: pi (#7136)\r\n  * new profile: ephoto (#7153)\r\n  * new profile: tldr (#7166)\r\n  * new profile: claude (#7169)\r\n  * new profile: tasks-org (#7273)\r\n  * new profile: ChiPass (#7271)\r\n  * new profile: maki (#7285)\r\n","reactions":{"total_count":9,"+1":0,"-1":0,"laugh":0,"hooray":2,"confused":0,"heart":4,"rocket":3,"eyes":0}}
