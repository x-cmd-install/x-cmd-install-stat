eated_at":"2026-11-17T06:51:52Z","updated_at":"2026-11-17T06:51:53Z"},{"id":757976462,"node_id":"RA_kwDOQq9Vx84tLc2O","name":"sigye-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":1398788,"digest":"sha256:269c0e9ed8878046d816773ab8a0768277a8c278bc84b882fa9716173e139b6f","download_count":1,"created_at":"2026-11-17T06:51:52Z","updated_at":"2026-11-17T06:51:53Z"},{"id":757974325,"node_id":"RA_kwDOQq9Vx84tLcU1","name":"sigye-x86_64-unknown-linux-gnu.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":104,"digest":"sha256:80c0e28331270aaf7c800eac6f079cde2b244e2d57a7808c844d6b1c60e77a51","download_count":2,"created_at":"2026-11-17T06:50:55Z","updated_at":"2026-11-17T06:50:55Z"},{"id":757974327,"node_id":"RA_kwDOQq9Vx84tLcU3","name":"sigye-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1966942,"digest":"sha256:1e5dd69d63283e849a24370a93acd92c8f1622f07e300312d4a2afe246ce4557","download_count":2,"created_at":"2026-11-17T06:50:55Z","updated_at":"2026-11-17T06:50:55Z"},{"id":757976397,"node_id":"RA_kwDOQq9Vx84tLc1N","name":"sigye-x86_64-unknown-linux-musl.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":105,"digest":"sha256:22743142e762c2c84bd2b75703a8f08155babefd23d883053ad357adbbf3494f","download_count":1,"created_at":"2026-11-17T06:51:50Z","updated_at":"2026-11-17T06:51:50Z"},{"id":757976387,"node_id":"RA_kwDOQq9Vx84tLc1D","name":"sigye-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":2046326,"digest":"sha256:55c14e407de3222a163dafaa507221f8b1e95248be0fd20d83b564f483cbb83e","download_count":1,"created_at":"2026-11-17T06:51:50Z","updated_at":"2026-11-17T06:51:50Z"}],"body":"Mouse controls, timers that keep running in the background, and a round of correctness fixes across timers, weather, fonts, and backgrounds.\n\n### ⚠️ Breaking\n- **A config file that cannot be read or parsed now stops sigye at startup.** It prints the path and the error location, then exits, and leaves the file alone. Previously sigye started on defaults, and the next save overwrote your file.\n- **`sigye-config` (library API):** `Config::load` now returns `Result<Config, ConfigError>`, and `ConfigError` has a new `Parse` variant. `Config::load_from` and `Config::save_to` take an explicit path.\n\n### Added\n- **Mouse controls:** click footer actions, dialog rows, and settings arrows, and scroll long lists with the wheel. A click closes Help, restores the minimal clock view, and exits screensaver mode.\n- **Background timers:** Timer and Pomodoro keep counting while another mode is on screen, and still ring, notify, and run their hooks when they finish.\n- `Ctrl+C` quits from anywhere, including dialogs and the help overlay.\n- `--timer` accepts 1–99 minutes and rejects anything else with an error.\n\n### Fixed\n- Timer and Pomodoro ran slow: each tick dropped the leftover fraction of a second.\n- Pomodoro now counts only time the work timer actually ran as focus time.\n- A skipped work phase no longer counts as a completed session.\n- `on_start` runs once, when a work phase is first started (including `--pomo`). It no longer runs when a work phase is entered or on every resume.\n- Changing Pomodoro durations in settings now updates a phase that hasn't started yet.\n- Settings preset arrows step to the nearest preset when the current value isn't one, instead of jumping to a fixed default.\n- The desktop notifications setting now takes effect without a restart.\n- Hour and minute flashes are no longer cut short.\n- Flash effects fade in Stopwatch and World Clock too.\n- The year progress bar counts the elapsed part of today, so it no longer sits at 100% all of December 31.\n- **Weather background:**\n  - A failed fetch keeps the last conditions and retries after a minute, instead of falling back to Starfield for 30 minutes.\n  - Dawn, day, dusk, and night now follow the clock between fetches.\n  - Location names are fully URL-encoded, so non-ASCII names such as `서울` work.\n- Matrix rain uses half-width katakana, so its columns line up.\n- Stateful backgrounds no longer panic on a zero-sized terminal.\n- The Fire gradient no longer overflows on very wide text.\n- The settings dialog no longer crashes in very short terminals.\n- The help overlay no longer cuts off its last line.\n- **Hooks:** their output no longer draws over the clock, and finished hooks no longer linger as zombie processes. Windows now runs them with `cmd /C`.\n- **Fonts:** FIGlet glyphs whose end marker isn't `@` now parse correctly.\n- **Countdown:** onboarding example dates are always in the future.\n\n### Changed\n- The release binary is about 1 MB smaller (4.8 MB → 3.9 MB): the Mono fonts no longer embed glyphs the parser never reads.\n- The system-reactive backgrounds poll only CPU and memory instead of every process.\n- Stopwatch status labels and colors now match the timer.\n\n### Docs & CI\n- **README:**\n  - Lists the config directory for each platform; on macOS it is `~/Library/Application Support/com.sigye.sigye/`.\n  - Documents all CLI options and the `on_complete`, `on_start`, and `on_break` hooks.\n  - Corrects the font and background counts.\n- **CI:**\n  - Clippy now fails on warnings.\n  - A new job checks the declared MSRV (1.97.1).\n  - The cargo cache is restored before the build.\n\n### Dependencies\n- clap 4.6.7 (#52, #57), notify-rust 4.19.0 (#59, #66), arboard 3.7.0 (#60), ureq 3.5.1 (#63), sysinfo 0.40.1 (#65)\n- Cross-platform e2e stability fixes (#64)\n\n**Full changelog:** https://github.com/am2rican5/sigye/compare/v0.6.0...v0.7.0\n"}
