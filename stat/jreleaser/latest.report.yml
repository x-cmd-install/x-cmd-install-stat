":51082291,"digest":"sha256:e601850b1da17b36848953c4c45671b8108b25ba94ee8b35caf37cd656e40639","download_count":1186,"created_at":"2026-08-31T07:54:18Z","updated_at":"2026-08-31T07:54:19Z"},{"id":537653872,"node_id":"RA_kwDOEuFCls4gC_Jw","name":"jreleaser-tool-provider-1.26.0.jar.asc","label":"","uploader":{"login":"aalmiray","id":13969,"node_id":"MDQ6VXNlcjEzOTY5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":821,"digest":"sha256:aa49379ded58b2562f81f78ba403a2a2a19d37efdbb3bd0c345a3e44d9c57c95","download_count":0,"created_at":"2026-08-31T07:54:20Z","updated_at":"2026-08-31T07:54:20Z"},{"id":537652657,"node_id":"RA_kwDOEuFCls4gC-2x","name":"VERSION","label":"","uploader":{"login":"aalmiray","id":13969,"node_id":"MDQ6VXNlcjEzOTY5","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":7,"digest":"sha256:acef448c3973160e815171b20f8788735d99b01e7bf551b3619bbde1ae1db7a8","download_count":2,"created_at":"2026-08-31T07:53:05Z","updated_at":"2026-08-31T07:53:05Z"}],"body":"## Binaries\n\n[https://github.com/jreleaser/jreleaser/wiki/Release-v1.26.0](https://github.com/jreleaser/jreleaser/wiki/Release-v1.26.0)\n\n## Changelog\n\n## \ud83d\ude80 Features\n**packagers**\n- 1788008 Option to skip tagging packager repository (opt-out), closes #2162\n- 8407e63 Deprecate snap.runOn in favor of smap.buildFor, closes #2159\n- bdc08ea Support snap.platforms, closes #2159\n- 6602c86 Additional properties in snapcraft templates, closes #2160\n- 5689378 improve warnings for incompatible distribution types, closes #2124\n\n## \ud83d\udc1b Fixes\n**assemble**\n- c76f76a Fix generated native-image executable name, closes #2146 #2147\n\n**deploy**\n- ded0f1c Add missing error message for failed GitLab package deletion, closes #2155\n- 1b83dca Make the mavenCentral deployer resilient to transient Central Portal failures, closes #2152\n\n**gradle**\n- 633a041 Remove usage of project in favor of AnsiConsole, closes #771\n- f8f8ab7 Avoid eager resolve of JReleaserLogger, closes #2145\n- c3d1c0f Skip Kordamp plugins if running Gradle +9.7.0, closes #2161\n\n## \ud83d\udee0  Build\n\n- 9edadad Update GH actions\n- c04999a Update snap configuration\n- 98de563 Update PULL_REQUEST_TEMPLATE.md\n- 251f5fc Fix update-website script\n\n## \ud83d\udcdd Documentation\n\n- 8e18de4 Add exoego as a contributor for code\n\n## \u2699\ufe0f  Dependencies\n\n- 4827788 Update aws-java-sdk to 2.54.6\n- 3eb5014 Update bouncycastle to 1.85\n- 8a5781d Update byte-buddy to 1.18.12\n- 49e3dd1 Update classworlds to 2.12.1\n- 53ca0d0 Update commons-codec to 1.22.1\n- 94834e9 Update commons-jexl to 3.7.0\n- b18ba0b Update cosign to 3.1.3\n- be9317c Update cyclonedx to 0.33.1\n- 701ead6 Update feign to 13.14\n- b697379 Update jsoup to 1.23.1\n- 6c4535f Update junit5 to 6.1.3\n- 8d196db Update syft to 1.51.1\n- 73555e1 Update woodstox to 7.2.2\n- 890bf01 Update zstd-jni to 1.5.7-15\n\n---\n- 8fb9ed6 Releasing version 1.26.0\n- 1841ba9 Add lprimak as a contributor for code\n- 2e2789f Bump for next development cycle\n\n\n## Contributors\nWe'd like to thank the following people for their contributions:\n- Andres Almiray ([@aalmiray](https://github.com/aalmiray))\n- Harsh Mehta\n- Lenny Primak ([@lprimak](https://github.com/lprimak))\n- TATSUNO \u201cTaz\u201d Yasuhiro"}
