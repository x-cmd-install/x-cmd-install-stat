4719,"node_id":"RA_kwDONmL37M4iknmP","name":"endcord-lite-1.5.4-macos-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20511363,"digest":"sha256:bc00eba922df8ff8e2060c75d83816426817366fc51f24e7461b7c248d585f0c","download_count":3,"created_at":"2026-09-21T22:49:25Z","updated_at":"2026-09-21T22:49:27Z"},{"id":580024717,"node_id":"RA_kwDONmL37M4iknmN","name":"endcord-lite-1.5.4-macos-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22132105,"digest":"sha256:e13cd2b7b7f2b29b9c1228bf038d60c56864904770f634654e77e4f1c717fbe6","download_count":4,"created_at":"2026-09-21T22:49:25Z","updated_at":"2026-09-21T22:49:27Z"},{"id":580024725,"node_id":"RA_kwDONmL37M4iknmV","name":"endcord-lite-1.5.4-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22184342,"digest":"sha256:200317f3c058b23b9468f49a1abc363d12c3697a50cae75e15095e02add44cef","download_count":10,"created_at":"2026-09-21T22:49:25Z","updated_at":"2026-09-21T22:49:27Z"}],"body":"### Highlights\r\n- **endcord-gui binaries** are finally stable, and from this version onward they will be included in every release!\r\n- endcord installer.sh script had full overhaul, now it can install any endcord binary, build from source, uninstall and more, this is perfect for package maintainers so they dont have to package endcord at all\r\n- Other TUIs (profile manager, keybinding resolver...) also got borders\r\n- There is new UI: setup for silence detection\r\n- Channels can now be pinned\r\n\r\n#### endcord-gui-specific features\r\n- All bindings work, Ctrl+C, Ctrl+Z, Shift+Enter...\r\n- Customizable tray icon, window can be minimized to tray\r\n- Window can be transparent, and background colors can also be made transparent\r\n- Uses only 15MB more RAM (vs most terminals using 20-100MB)\r\n- GTK-native pasting and drag n' drop (text and files)\r\n- Desktop integration: notification count badge, click on notification\r\n- Perfect for windows, because there is no sane terminal emulator there\r\n\r\n<details>\r\n<summary><strong>New features</strong></summary>\r\n\r\n- Add endcord-GUI binaries for linux andwindows\r\n- Add author to rich embed\r\n- Add optional noise supression to voice calls\r\n- Add qrcode drawing to gtkcurses\r\n- Add gtkcurses window transparency option\r\n- Add gtkcurses bg color transparency option\r\n- Add drag and drop in gtkcurses\r\n- Add notification floating number to desktop icon to gtkcurses\r\n- Add error handler to gtkcurses\r\n- Add gtk native pasting\r\n- Add full paste support on windows\r\n- Add pinned channels\r\n- Add command to toggle pinned channel\r\n- Add UI for silence detection setup\r\n- Add borders to other UIs\r\n- Add border and UI color to profile manager\r\n- Add ability to toggle call volumes\r\n- Add command-binding for push to talk\r\n- Add headless mode\r\n- Add embeds to send and update message api\r\n- Add .desktop launcher\r\n- Add build.log to build script\r\n- Add executable icon\r\n- Add version information to binaries\r\n</details>\r\n\r\n\r\n<details>\r\n<summary><strong>Changes</strong></summary>\r\n\r\n- Make install script more interactive\r\n- Make unsorted servers appear at top of tree\r\n- Improve build script\r\n- Dont rename log file, copy it instead\r\n- Redirect gobject logging to main log\r\n- Speedup initial connection\r\n- Insert space after mention\r\n- Silence libayatana logs\r\n- Disable tray in some modes in gtkcurses\r\n- Allow gtkcurses to send lone modifier bindings\r\n- Improve stats metrics\r\n- Fix RPC not connecting when app has no assets\r\n- Use \"instant message\" notification sound on windows\r\n- Show live stats from command\r\n- Update only one config key when its saved\r\n- Optimize chat drawing\r\n- Update client properties\r\n- Improve --version arg\r\n- Improve --help args\r\n- Bump dependencies\r\n</details>\r\n\r\n\r\n<details>\r\n<summary><strong>Bugfixes</strong></summary>\r\n\r\n- Fix 403 forbidden from gateway url\r\n- Fix crash with fallback keybinding parser\r\n- Fix crash on windows when cant initialize toaster\r\n- Fix crash from fix_line_format() and fix_map_ranges()\r\n- Fix crash when joining unread VC\r\n- Fix crash with some embeds\r\n- Fix crash with gateway when network error\r\n- Fix main profile changing when editing server profile\r\n- Fix space in gtkcurses\r\n- Fix gtkcurses emoji rendering\r\n- Fix chat selected line removing format\r\n- Fix edit prompt resets after pressing binding\r\n- Fix paste text on Ctrl+V\r\n- Fix article embed saving as file\r\n- Fix gtkcurses doesnt always exit on main program end\r\n- Fix notifications when not focused in gtkcurses\r\n- Fix not removing notification\r\n- Fix crash when processing channel overrides\r\n- Fix crash when viewing profile\r\n- Fix upload not working on macos\r\n- Fix forums cant be tabbed\r\n- Fix typos\r\n</details>\r\n\r\n\r\n**Full Changelog**: https://github.com/sparklost/endcord/compare/1.5.3...1.5.4"}
