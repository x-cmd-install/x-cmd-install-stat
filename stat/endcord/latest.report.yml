"},{"id":492938699,"node_id":"RA_kwDONmL37M4dYaXL","name":"endcord-lite-1.5.3-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":21931316,"digest":"sha256:972f8d2cc243aa4e3205ea8ac277563088c42a594c6837683ba03451f2c80de9","download_count":179,"created_at":"2026-07-28T16:36:20Z","updated_at":"2026-07-28T16:36:22Z"}],"body":"### Highlights\r\n- Rewrote experimental windowed mode from scratch with GTK3, it is no longer experimental! Try it with `python build.pt --toggle-windowed` then run from source: `uv run main.py`\r\n- Code block language syntax (uses source-highlight or python-pygments system deps or [this](https://github.com/sparklost/endcord-pygments-syntax) endcord extension)\r\n- Bar shaped cursor (togglable)\r\n- Embed/attachment overhaul (dont show redundant URLs, format URLs, double click on file names)\r\n- Command-bindings (macros) overhaul (added `repeat` command, can execute bindings and can send raw keycodes)\r\n\r\n<details>\r\n<summary><strong>New features</strong></summary>\r\n\r\n- Add code block language syntax\r\n- Add per-channel member list\r\n- Add bar-shaped cursor\r\n- Add file name to file attachments\r\n- Add duration to voice messages\r\n- Add double click on attachment to download it\r\n- Add thread member list\r\n- Add voice call transmitter audio mixer\r\n- Add `call_opus_mode` option\r\n- Add `call_fast_mixer` option\r\n- Add PGUP, PGDN, HOME, END keys to keybinding parsers\r\n- Add error popup when downloading\r\n- Add `repeat` to command-bindings\r\n- Add `end_left` and `end_right` bindings\r\n- Add `select_end_left` and `select_end_right` bindings\r\n</details>\r\n\r\n\r\n<details>\r\n<summary><strong>Changes</strong></summary>\r\n\r\n- Rewrite windowed (previously experimental) mode in GTK3\r\n- Allow command bindings to send keypress\r\n- Keep previous log\r\n- Limit number of subscribed channels to 5 per guild - decrease network usage\r\n- Switch `remember_collapsed_channels = True`\r\n- Adjust `color_chat_mention`\r\n- Prevent negative chat selection when editing message\r\n- Skip selected range when move left/right\r\n- Make emoji search value shorter matches more\r\n- Prevent errors during call decryption\r\n- Make vim normal mode use block when bar cursor is enabled\r\n- Change gif url to formatted title\r\n- Change main link embed url into formatted title\r\n- Stop assist when same trigger is typed while assist is active\r\n- Keep reply state when caching typed text\r\n- Bump ncurses\r\n- Bump dependencies\r\n</details>\r\n\r\n\r\n<details>\r\n<summary><strong>Bugfixes</strong></summary>\r\n\r\n- Fix voice call sent audio\r\n- Fix voice call RTP metrics\r\n- Fix voice call receiver audio mixer\r\n- Fix gif names in gif search\r\n- Fix file attachments\r\n- Fix emoji search\r\n- Fix reply background overwriting url and edited colors\r\n- Fix inline images not fully cleared on channel switch\r\n- Fix switch tab with num in vim mode\r\n- Fix playing video in medium level\r\n- Fix some emoji failing to demojize when editing message\r\n- Fix quit command not added to history\r\n- Fix image bottom edge not drawn when scrolling\r\n- Fix typed text not cached when switching tab\r\n- Fix building curses on gentoo\r\n- Fix mini and micro version still installing unwanted dependencies\r\n- Fix crash when playing file\r\n- Fix crash when connecting to voice while switching channel\r\n- Fix crash when switching to forum\r\n- Fix crash when joining some threads\r\n- Fix crash when sending attachment\r\n- Fix crash on remove thread event\r\n- Fix crash when voice call errors\r\n</details>\r\n\r\n\r\n**Full Changelog**: https://github.com/sparklost/endcord/compare/1.5.2...1.5.3\r\n\r\n\r\n**New Extensions**\r\n- [endcord-pygments-syntax](https://github.com/sparklost/endcord-pygments-syntax) - Adds builtin code blocks syntax highlighting using pygments.\r\n- [endcord-custom-emoji](https://github.com/sparklost/endcord-custom-emoji) - Adds command to insert any discord emoji or sticker as image url, so it will appear as embed.\r\n"}
