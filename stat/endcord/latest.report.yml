,"node_id":"RA_kwDONmL37M4sMYwy","name":"endcord-lite-1.6.0-macos-arm64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":20492248,"digest":"sha256:093228d790bdeac0f3911e21fe300edda77adaec93d90d96a12b01c229fc2e67","download_count":1,"created_at":"2026-11-12T23:13:24Z","updated_at":"2026-11-12T23:13:25Z"},{"id":741444655,"node_id":"RA_kwDONmL37M4sMYwv","name":"endcord-lite-1.6.0-macos-x86_64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22947761,"digest":"sha256:fa1b75aefdcbb8afbe3084879aa6175b86fc4000692b58c70ac7718afbfd8af4","download_count":1,"created_at":"2026-11-12T23:13:23Z","updated_at":"2026-11-12T23:13:25Z"},{"id":741444653,"node_id":"RA_kwDONmL37M4sMYwt","name":"endcord-lite-1.6.0-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":22531326,"digest":"sha256:7d96ec140bfbe19002f47358e7f2d45a8ac93b69538306cdf99482611685deb6","download_count":4,"created_at":"2026-11-12T23:13:23Z","updated_at":"2026-11-12T23:13:25Z"}],"body":"### Highlights\r\n- Video calls are now possible (watch and stream video)\r\n- There are images, pfps and emoji rendered in endcord-gui\r\n- Spellcheckrer corrections can be triggered with `Alt+[` and `Alt+]`\r\n- official endcord website is available here: https://sparklost.github.io/endcord/\r\n- Global push-to-talk for voice calls\r\n- Many bugfixes and improvements\r\n\r\n\r\n#### Endcord-GUI\r\n- Add inline images to endcord-GUI\r\n- Add image emoji to endcord-GUI\r\n- Add pfp to endcord-GUI\r\n- Add webp support\r\n- Fix Shift+Space\r\n- Fix crashes\r\n- Optimizations\r\n\r\n\r\n<details>\r\n<summary><strong>New features</strong></summary>\r\n\r\n- Add video calls\r\n- Add website\r\n- Add (desktop) global push to talk\r\n- Add spellcheck corrections assist\r\n- Add bounding box for inline media\r\n- Add optional \"retro slow image loading\" effect\r\n- Add colors to extension search assist\r\n- Add automatic conversion of `@name` and `@role` in sent message\r\n- Add `assist_stop_space` option\r\n- Add `call_x264_bitrate` and `call_x264_preset` options\r\n- Add command to change volume per-user in voice call\r\n- Add command to show command history\r\n- Add options to play sound when someone joins/leaves current call\r\n- Add display for pressed binding chain\r\n- Add more default command bindings\r\n- Add fallback path for rpc socket\r\n- Add which-key-like assist for chained bindings\r\n- Add activity icons in tree DMs\r\n- Add `host` option to profile manager\r\n- Add central cache cleaner\r\n- Add libopus to build script\r\n- Add vumeter warning for no rnnoise\r\n- Add vim_mode_strings options\r\n\r\n</details>\r\n\r\n\r\n<details>\r\n<summary><strong>Changes</strong></summary>\r\n\r\n- Improve voice channel switching\r\n- Remove braille pattern blank\r\n- Rework chat url system\r\n- Click on temporary notification to close it\r\n- Use libopus instead of pyav for voice calls\r\n- Allow voice call in endcord-medium\r\n- Rework embed processing\r\n- Split temp stuff to temp and runtime dirs\r\n- Handle set_activity with no activities in rpc server\r\n- Cleanly handle rpc client socket disconnect\r\n- Generate vim mode bindings in initial config\r\n- Tweak compiler args\r\n- Bump dependencies\r\n- Improve documentation and readme\r\n</details>\r\n\r\n\r\n<details>\r\n<summary><strong>Bugfixes</strong></summary>\r\n\r\n- Fix crash when italic text in message\r\n- Fix crash when resizing\r\n- Fix crash with emoji_safe mode\r\n- Fix crash with inline images in formatter\r\n- Fix crash when selected line is pushed out of chat history\r\n- Fix crash when downloading from api\r\n- Fix crash with custom keybindings\r\n- Fix crash with extension update\r\n- Fix crash with media player and custom python\r\n- Fix binary crash with curses\r\n- Fix build.py crash with libpous\r\n- Fix limiting extra line size\r\n- Fix embeds missing url\r\n- Fix spellchecker instability\r\n- Fix goto assist\r\n- Fix cant uncollapse channels with new state\r\n- Fix file name not in embed/attachment\r\n- Fix ctrl+left/right/home/end not scrolling to edges\r\n- Fix duplicate detectable_apps.ndjson in config dir\r\n- Fix rich embeds not rendered\r\n- Fix frame not redrawn in inline images\r\n- Fix assist disappearing when typing @username\r\n- Fix assist not closing after space\r\n- Fix yotube embed not visible without inline media\r\n- Fix input line cleared after closing extra window\r\n- Fix input line not cached when editing message\r\n- Fix all extensions marked outdated in log\r\n- Fix rpc server not handling millisecond timestamps\r\n- Fix rpc server ignoring PIDs\r\n- Fix build.py failing with custom python\r\n- Fix inline images loading\r\n- Fix blinking when executing command that opens extra window\r\n- Fix voice channel call UI\r\n- Fix no usernames when joining after other users\r\n- Fix italic/bold inside markdown url\r\n- Fix channel/message url inside markdown url\r\n- Fix animated emoji assist\r\n- Fix inconsistent temporary extra line\r\n- Fix minimize/maximize resetting prompts\r\n- Fix copy_message_link command\r\n- Fix (edited) in code blocks\r\n- Fix blinking qrcode in profile manager\r\n- Fix profile manager exitting after qr code scan\r\n- Fix building pycryptodome every time\r\n- Fix poor outgoing call audio\r\n- Fix poor incoming call audio\r\n- Fix outgoing audio stuttering when using rnnoise\r\n</details>\r\n\r\n\r\n**Full Changelog**: https://github.com/sparklost/endcord/compare/1.5.4...1.6.0\r\n\r\n\r\n**New Extensions**\r\n- [endcord-kitty-keyboard](https://github.com/sparklost/endcord-kitty-keyboard) - Adds kitty keyboard protocol support to endcord"}
