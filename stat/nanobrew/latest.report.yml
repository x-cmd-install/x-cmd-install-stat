node_id":"RA_kwDORQosbM4hOe_v","name":"nb-x86_64-linux.tar.gz.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":89,"digest":"sha256:ec39303d172fb870f60641339e905d08c7c34540bb2d1bb28bab6b20cc396125","download_count":4,"created_at":"2026-09-11T14:54:12Z","updated_at":"2026-09-11T14:54:12Z"},{"id":557445100,"node_id":"RA_kwDORQosbM4hOe_s","name":"nb-x86_64-windows.zip","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":212576,"digest":"sha256:5f72f60011ae242d2f1d119cde55026f58de52ba8d1b7bff0bdefb809d431cb6","download_count":3,"created_at":"2026-09-11T14:54:12Z","updated_at":"2026-09-11T14:54:12Z"},{"id":557445104,"node_id":"RA_kwDORQosbM4hOe_w","name":"nb-x86_64-windows.zip.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":88,"digest":"sha256:65ee3fe5a5b5196f32eae748232ee8c7621ed578d5dda0397cb5dec68c57b24a","download_count":3,"created_at":"2026-09-11T14:54:12Z","updated_at":"2026-09-11T14:54:12Z"}],"body":"v0.1.211 improves cask upgrades, startup checks, and recovery when something goes wrong. It also tightens package selection and ships signed, notarized macOS binaries alongside Linux and Windows builds.\n\n**1. Recoverable cask upgrades \u2014 fixes #387**\n\nPreviously, outdated casks were skipped because replacing their installed apps and binaries could leave a broken installation if something failed. Supported casks now upgrade through a recoverable transaction:\n\n- Download the new package and verify its checksum, including cached downloads.\n- Stage the complete payload, preserving companion executables, package metadata, and runtime resources.\n- Check ownership of existing apps and binary links before replacing them, and reject conflicting destinations.\n- Write a durable recovery journal, then activate the new payload, apps, binary links, and database state.\n- Restore the previous installation if activation fails.\n- Recover an interrupted upgrade before the next command that accesses installed state proceeds. Recovery also handles interruption during rollback.\n\nThe old payload remains available until the upgrade commits successfully. Removed or renamed artifacts participate in the transaction so an upgrade does not leave obsolete public links behind. Oversized journals are rejected before publication so every accepted journal remains readable during recovery.\n\nSupported downloads are **ZIP, tar.gz, tar.xz, and direct binaries**, containing app or binary artifacts. **DMG, `.pkg`, script installers, and artifacts requiring other side effects remain explicitly skipped**, outside the actionable upgrade plan.\n\nThis provides automatic recovery from failed or interrupted upgrades. It does not add a command for undoing an arbitrary previously successful cask upgrade; the old payload is cleaned up after commit.\n\n**2. Fairer startup checks for freshly installed CLIs \u2014 fixes #386**\n\nSome programs, such as Cursor's CLI, take longer on their first launch. The previous two-second limit could mark a successful installation as unhealthy simply because its first execution was slow.\n\n- A cask with one declared executable gets up to **10 seconds** for its startup probe.\n- Casks with multiple executables retain **two-second slices**, within a **10-second package budget**, so one hanging executable cannot consume the entire allowance immediately.\n- Fallback arguments (`--version`, `version`, and `--help`) share the executable's deadline.\n- Diagnostics distinguish timeouts, launch failures, and unsuccessful exits.\n- Deadlines remain effective when a process closes stdout and stderr before hanging.\n- Timed-out processes are killed and reaped, including processes that ignore `SIGTERM`.\n\nA failed probe reports **runtime health unverified**. It does not undo an otherwise successful installation or upgrade. The probe checks whether a CLI responds; it is not a comprehensive test of every feature in the installed application.\n\n**3. More predictable package selection and diagnostics**\n\n`nb outdated` now honors package names and `--cask`/`--deb` filters. It rejects unknown flags, conflicting filters, and missing packages. `nb upgrade --cask` stays scoped to casks, and its summary distinguishes upgrades, unsupported skips, pinned packages, and failures.\n\nFor example:\n\n```sh\nnb outdated --cask cursor\nnb upgrade --cask cursor\nnb doctor --probe cursor\n```\n\nRecovery checks now use filesystem metadata to support Linux emulation, and directory syncing uses handles that Linux can sync. Debian parity tests expose setup and install progress and stop on command errors, making failures easier to diagnose.\n\n**4. Release binaries and notarization**\n\n| Platform | Archive |\n| --- | --- |\n| macOS Apple Silicon | `nb-arm64-apple-darwin.tar.gz` |\n| macOS Intel | `nb-x86_64-apple-darwin.tar.gz` |\n| Linux ARM64 | `nb-aarch64-linux.tar.gz` |\n| Linux x86-64 | `nb-x86_64-linux.tar.gz` |\n| Windows x86-64 | `nb-x86_64-windows.zip` |\n\nBoth macOS binaries target **macOS 12.0 or later**, are **Developer ID signed with hardened runtime**, and received **Accepted** results from Apple notarization. The Intel binary was smoke-tested through Rosetta on Apple Silicon; targeting macOS 12 is distinct from testing on a machine running macOS 12.\n\nEach archive contains the executable and has a separate **SHA256 sidecar**. All ten uploaded files were downloaded again and matched against the validated local files. The macOS archives contain the signed executable without extra AppleDouble metadata files.\n\n**5. Validation**\n\n- **321 local unit tests passed**, with one skipped.\n- **59 transaction scenarios passed**, covering successful upgrades, failures, process interruption, states between activation operations, and interrupted rollback.\n- Real CLI checks covered installation, upgrade, filtered `outdated`, cold startup, unsupported upgrade plans, and timeout diagnostics.\n- Both signed macOS binaries ran successfully, and the signed Apple Silicon release binary passed the cask CLI regression test.\n- Both Linux release binaries ran successfully in containers.\n- The Windows release binary exactly matched the binary smoke-tested by Windows CI.\n- All five final formula PR CI jobs passed. Its Debian parity run reported **11 passed, zero failed**, including installation of all 35 curl dependencies and working curl, wget, and git commands.\n\n**6. Availability and upgrade**\n\nThe implementation was merged through [PR #389](https://github.com/justrach/nanobrew/pull/389), and the Homebrew formula update through [PR #390](https://github.com/justrach/nanobrew/pull/390). Both original issues are closed.\n\nUpdate an existing installation with:\n\n```sh\nnb update\n```\n\nFor a Homebrew-managed installation:\n\n```sh\nbrew update\nbrew upgrade nanobrew\n```\n\nBuilt from commit [`8d6d6545561c8f89bfafb3c2a7e7ff3953525cbf`](https://github.com/justrach/nanobrew/commit/8d6d6545561c8f89bfafb3c2a7e7ff3953525cbf).\n\n[Full changelog: v0.1.210 \u2192 v0.1.211](https://github.com/justrach/nanobrew/compare/v0.1.210...v0.1.211)\n"}
