2245,"node_id":"RA_kwDORQosbM4q8WGl","name":"nb-x86_64-linux.tar.gz.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":89,"digest":"sha256:38728903c47f865f5f087c73a4b500008663c61643e994eebf5dcb00281812e8","download_count":11,"created_at":"2026-11-07T11:08:54Z","updated_at":"2026-11-07T11:08:54Z"},{"id":720462247,"node_id":"RA_kwDORQosbM4q8WGn","name":"nb-x86_64-windows.zip","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":211879,"digest":"sha256:5de1c8b76ed8e2f06a0b54a1bea46cc9645f26720337c733140176eedc2fe657","download_count":5,"created_at":"2026-11-07T11:08:54Z","updated_at":"2026-11-07T11:08:55Z"},{"id":720462255,"node_id":"RA_kwDORQosbM4q8WGv","name":"nb-x86_64-windows.zip.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":88,"digest":"sha256:560a3fba367ba96c7dc4bbbb2db13c98b348f9f85b3628be6b2cce57500f0bb9","download_count":3,"created_at":"2026-11-07T11:08:55Z","updated_at":"2026-11-07T11:08:55Z"}],"body":"## [0.1.216] - 2026-11-07\n\n### Added\n- `--json` on `nb list`, `nb outdated` (also with `--cask`, `--deb`, `--versions` and package names), `nb info` (formula and `--cask`), `nb search`, `nb leaves [--tree]`, `nb deps [--tree]`, `nb services list` and `nb where` prints one schema-1 JSON document instead of text. `nb outdated --json` also reports whether `nb upgrade` can replace each package and, when it cannot, the reason it would print. `nb upgrade --cask` and `nb outdated` accept an installed tap cask by its short name (`nanobrew-ui` for `Rex57/tap/nanobrew-ui`) when no other installed tap cask shares it. The text output is unchanged. See `docs/json-output.md`. Requested by @Rex57. (#495)\n- `nb upgrade --cask` upgrades DMG casks through the same staged, journaled transaction as zip and tar casks, so they are no longer skipped with \"this download format does not support staged upgrades yet\". The verified image is attached read-only at a private mount point. Only the declared `app` artifacts and relative binary sources are copied out (a symlink in the image that leads outside the volume is refused), and the image is detached before activation. If nb is killed while the image is attached, it stays mounted under `/tmp/nb-dmg-*` until it is detached or the Mac restarts; recovery does not depend on it. Proposed and first implemented by @Rex57. (#491)\n\n### Fixed\n- `nb upgrade --cask` retries `hdiutil attach` with a fresh mount point (3 attempts) when staging from a DMG, after CI runners twice failed a mount transiently. If every attempt fails, nb prints hdiutil's own message with the `MountFailed` error instead of failing silently. After staging, or after a failed attempt, nb also detaches the image's own disk if `hdiutil info` still lists it (an APFS image's synthesized container disk goes with it), so an image whose volume never mounted (or whose mount point would not detach) is not left attached; it warns only if a device really remains. (#491 follow-up)\n- The upstream-registry caches (GitHub release JSON and resolved upstream formulas) are now written to a private temp file and renamed into place, like the API cache. Read-only commands share the operation lock since #503, so two of them refreshing the same entry could let one read an empty or partly written file; a torn release JSON failed the command instead of refetching. (#503 follow-up)\n- Tap formulas that build their download URL from class constants now install, for example `telepresenceio/telepresence/telepresence-oss`. nanobrew reads constants that are string literals (also `.freeze`) or `OS.mac?`/`OS.linux?`/`Hardware::CPU.arm?`/`Hardware::CPU.intel?` ternaries, and interpolates them and `#{version}` into `url` and `bin.install`. It picks the source `sha256` whose postfix `if`/`unless` platform condition matches. `bin.install \"src\" => \"dest\"` now installs under `dest`. A download with no archive suffix whose bytes are not an archive is staged as a raw file, as with `using: :nounzip`. Nothing is evaluated as Ruby: any other `#{...}`, constant or checksum condition stops the install before the download (`UnsupportedRubyExpression`), and a formula with conditional checksums but none for this OS/CPU stops with `NoChecksumForPlatform` instead of downloading something it cannot verify. Reported by @rirze. (#499)\n- The post-install step now fetches a `lib*` formula's Ruby source from homebrew-core's `Formula/lib/` folder. Before, it used `Formula/l/` (a 404), and the step was skipped with no message. A failed fetch now prints the `post-install script failed` warning. Fix by @Rex57. (#471)\n- Bottle maintenance: `nb_bottles.py revoke` no longer falls back to a version an earlier revoke marked, from registry history or from upstream releases, and no longer strips that marker. `--fallback-version` refuses a revoked version. A version that was revoked and then unrevoked can still be chosen. Reported by @Rex57. (#431)\n- Bottle maintenance: `nb_bottles.py repackage` writes a fixed gzip timestamp, so a rerun for the same version builds the same digest and can finish a partly pushed version instead of stopping with \"refusing to overwrite tag\". Reported by @Rex57. (#455)\n- Bottle maintenance: `nb_bottles.py scan --all` keeps going when one package gets an HTTP error (for example a GHCR 404 or 5xx). That package gets a `SCAN-ERROR` entry and still fails the gate; the packages after it are scanned and `dist/scan/summary.json` is written. Reported by @Rex57. (#453)\n- HTTP requests made with Zig's built-in client (API index, cask and formula metadata, `nb outdated`) now give up on a connect after 30 s, the same limit the curl paths use with `--connect-timeout 30`, instead of hanging until the OS gives up (minutes) or forever on a network that drops packets. When a host has both IPv6 and IPv4 addresses, the losing attempt is now canceled within 25 ms of the winner connecting, so a dropped IPv6 route no longer holds up a working IPv4 one. `nb outdated` now names each package it could not check instead of silently leaving it out. The connect limit is Linux and macOS only; Windows connects as before. Read-only commands (`list`, `leaves`, `info`, `search`, `where`, `outdated`, `deps`, `services list`) now share the operation lock, so one slow read no longer blocks the others; every command that changes state still takes it exclusively and waits for readers, and a reader that finds an interrupted cask upgrade takes the exclusive lock to recover it first. Reported by @Rex57. (#503)\n- `nb upgrade --cask` retries `hdiutil detach` when it fails right after staging from a DMG, instead of ignoring the failure and leaving the image attached. If the image still cannot be detached, nb prints the command to finish it. (#491 follow-up)\n- Active probes no longer leave helper processes running. Each probed command runs in its own process group, and a timeout kills the whole group. A Ctrl-C, SIGTERM or SIGHUP during a probe also kills the probe's group before nb exits. A cask binary that is its app's main executable (`<app>/Contents/MacOS/<CFBundleExecutable>`) is no longer run with `--version`: the app's codesign check covers it. For example, `electerm --version` starts the whole GUI and never exits. (#494)\n- On macOS, cask zip archives are now extracted with `ditto -x -k` first, as Homebrew does, with `unzip` as the fallback. Before, BSD `unzip` wrote AppleDouble `._*` entries into app bundles as plain files, which broke the code signature (\"app is damaged\"), for example with hiddenbar. The zip path-traversal pre-check and the checksum check are unchanged, and a zip that stores an entry below one of its own symlinks is now refused before any extractor runs. (#425)\n- `nb outdated`/`nb upgrade` no longer downgrade an `auto_updates` cask whose app already updated itself. If `CFBundleShortVersionString` in the installed app's `Info.plist` is at or past the published version, the cask is skipped with a note. If the plist cannot be read, the recorded version decides as before. (#449)\n- `nb upgrade --cask` no longer fails with `DestinationAlreadyExists` when the new version drops a binary whose `bin/` link the user has replaced with their own file or link. Only the cask's own link is removed; the user's file is left alone and is not put in the upgrade journal. (#467)\n- `nb remove --cask` now deletes the font files a cask installed into `~/Library/Fonts`, so removing and then reinstalling a font cask no longer fails with \"refusing to overwrite existing font\". The cask record gains a `fonts` list; records without it still load, and only the listed file names are deleted from that folder. If a font cannot be deleted the record is kept for a retry. Fonts of casks installed before this change are not tracked and must be removed by hand. (#479)\n- `nb remove --cask` deletes a recorded `bin/` link only when it points into that cask's Caskroom payload or one of its apps, the same ownership rule `nb upgrade --cask` uses. A name the cask recorded but never linked (for example a binary install refused) is left alone when another package now owns it, and nanobrew says so. (#477)\n- `nb remove --cask` now removes an app the cask names inside a subfolder (`app \"Sub/Foo.app\"`). Install copies it to `/Applications/Foo.app`; the record and the post-install probe now use that basename, and removal also handles records written by older versions. (#433)\n- `nb install` runs post-install and the active probe after every install worker has finished, in dependency order. A small keg such as wget no longer gets probed before its dependency's `opt/` link exists, which used to produce a false \"probe warning\" and `probe_success=false`. (#461)\n- `nb install --shims` links its dependencies' `lib`, `include`, `share` and `etc` into the prefix again. Only their executables stay out of `prefix/bin`, as documented. Since v0.1.203 the fast linker removed every link of a private dependency. (#435)\n- `nb upgrade fortune` across a revision bump (for example `9708` -> `9708_1`) no longer deletes the new `bin/fortune` link. The old keg's unlink step now removes the link only when it points at that keg's own wrapper. (#443)\n- When several APT sources list the same package, `nb install --deb`, `nb outdated` and deb upgrades now use the newest version (dpkg ordering), as APT does with default priorities, and the first source listed on a tie. Before, the source listed last won, so on stock Ubuntu `-security` could hide a newer `-updates` build. Pin priorities are still not read. Reported by @Rex57. (#457)\n- The database load warnings (too large, read failed, parse failed) now name the file that was opened instead of always `/opt/nanobrew/db/state.json`, so a corrupt temporary or test database no longer reports the real one as corrupt. Reported by @Rex57. (#473)\n- `nb switch` with several specs now saves the new version of each package that switched, even when another spec fails. Before, `state.json` kept the old version while the links pointed at the new keg. (#475)\n- `nb install name@version` now saves the pin even when another package in the same command fails. \"Pinned\" prints only when the pin was written. A pinned package whose own install failed is not pinned at its older keg. (#429)\n- `nb install`/`nb upgrade` no longer replace a pinned formula that is pulled in as a dependency, whether by a newer version or a rebuilt bottle. They keep the pinned keg, its links and its database record, and print a note. An explicit `name@version` request still overrides the pin. (#439)\n- `nb upgrade` no longer stops at the first keg that fails to install. It tries the remaining kegs, prints the summary, and exits 1. An upgrade that installs a version newer than the cached index advertised now counts as upgraded instead of failed. (#445)\n- `nb remove` (also `--cask` and `--deb`), `nb pin`/`nb unpin`, `nb info` (also `--cask`) and `nb bundle install` now exit 1 when a named package, cask or file is missing or its removal fails. Removals and pins that succeeded in the same command are still saved. `nb reinstall` of a package that is not installed still installs it. (#463)\n- `nb reinstall <formula>` no longer removes the keg and its record first: a failed lookup or download leaves the installed keg, its links and its pin as they were. A newer version's keg replaces the old one only after it is installed. (#441)\n- A same-version reinstall copies the new keg beside the old one and swaps it in; the old keg is kept until the install finishes and put back if any step fails. (#489)\n- `nb install`/`nb deps` no longer drop a dependency whose formula fetch timed out or got a 5xx and then report success. Only an HTTP 404/410 counts as \"not a formula\" (for example a `uses_from_macos` system library). Any other fetch error stops resolution and names the formula. The dependency resolver tests now run in `zig build test`. (#447)\n- A binary the relocator could not open, read or write back is now counted as incomplete, so the install fails and the keg is not cached instead of silently shipping a half-rewritten binary. `zig build test` now also runs the ELF (Linux) and Mach-O (macOS) relocator tests. (#465)\n- A bottle is extracted into a private staging directory and published as `store/<sha256>` with one rename, so an interrupted or concurrent install can no longer leave a half-extracted store entry that later installs link as complete. (#437)\n- `zig build test` also compiles and runs the tests in `src/main.zig` (not on Windows, where `src/windows_main.zig` is the exe root). (#481)\n\n### Changed\n- Removed internal modules that nothing used: the exec thread pool and directory queue (#483), the SIMD scanner and mmap reader (#485) and the scratch arena (#487). No change in behavior.\n\nItems #429, #431, #433, #435, #437, #439, #441, #443, #445, #447, #449, #453, #455, #457, #461, #463, #465, #467, #471, #473, #475, #477, #479, #481, #483, #485, #487, #489, #491, #494, #495 and #503 were reported or proposed by @Rex57, #425 by @ferntheplant and #499 by @rirze. #495's requested output is complete, but the issue stays open for a separate question. Partial work on running the API's `post_install_steps` (#493) is not in this release.\n\n","mentions_count":3}
