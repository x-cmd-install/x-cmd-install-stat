A_kwDORQosbM4pwpWp","name":"nb-x86_64-linux.tar.gz.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":89,"digest":"sha256:fdd22ca769e4c0b20cc8fecb126c39526b2f8c32dffebe0cf91b8c38e08413b4","download_count":6,"created_at":"2026-11-02T05:21:33Z","updated_at":"2026-11-02T05:21:33Z"},{"id":700618161,"node_id":"RA_kwDORQosbM4pwpWx","name":"nb-x86_64-windows.zip","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":211930,"digest":"sha256:e3ceb775c3e11b858f59d235114b3a130ab1fd1c4787f2667cba73b1bb98767a","download_count":2,"created_at":"2026-11-02T05:21:33Z","updated_at":"2026-11-02T05:21:34Z"},{"id":700618181,"node_id":"RA_kwDORQosbM4pwpXF","name":"nb-x86_64-windows.zip.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":88,"digest":"sha256:46ecea6166017af23675d5cd1c22d014cc5f4ab075427b18ce6f5a16db06c696","download_count":1,"created_at":"2026-11-02T05:21:34Z","updated_at":"2026-11-02T05:21:34Z"}],"body":"## [0.1.215] - 2026-11-02\n\n### Fixed\n- `nb rollback` restores the previous keg before it removes the current one. It refuses, and leaves the current version installed, when the previous version's payload is gone; it exits 1 on any failure instead of printing \"Rolled back\". (#427)\n- A failed `nb install --cask` removes the Caskroom version dir it created, so a later install can no longer adopt a hand-installed app that `nb remove --cask` would then delete. (#451)\n\n### Changed\n- `SECURITY.md` and `CONTRIBUTING.md` give one instruction for security reports: GitHub private vulnerability reporting, now enabled. (#426)\n\nv0.1.213 and v0.1.214 were tagged but not published as GitHub Releases; this is the first published release that includes their changes. Items #426, #427 and #451 were reported by @Rex57.\n\n## [0.1.214] - 2026-10-14\n\n### Fixed\n- Cached bottle blobs are re-hashed against their SHA-256 before extraction; a mismatching cache entry is deleted and downloaded again. (#416)\n- A `state.json` that cannot be read or parsed is never overwritten with an almost empty database; nanobrew warns and leaves it untouched. (#415)\n- Upgrades and reinstalls keep a keg's pin. (#414)\n- The upstream registry cache is written to a temp file and renamed into place, so an interrupted or concurrent refresh can no longer leave a truncated cache that silently drops revocations. (#417)\n- Version comparison treats `-` as a separator, and `.deb` upgrades/outdated checks use dpkg ordering (epochs, `~`, revisions). (#419)\n- `nb remove --cask` keeps the cask record when an app in `/Applications` could not be deleted, instead of forgetting an app that is still installed. (#420)\n- Trust evidence publishing skips expired attestations instead of failing the weekly run. (#413)\n- Install script: curl calls time out instead of hanging (e.g. in `docker build`), root installs no longer need `sudo`, and the fallback release is used when the GitHub API fails. `/version` and the install-script fallback track the latest published release. (#422, #418, #412)\n\n### Changed\n- README: corrected Homebrew comparisons, documented that `post_install` hooks are not run, added a \"Relationship with Homebrew\" section, and the benchmark times `brew install --skip-post-install`. (#421, #411)\n\nItems #413–#420 were reported privately by @Rex57.\n\n## [0.1.213] - 2026-10-05\n\n### Added\n- Opt-in Monterey Intel Git publish job: dispatch-gated syft/grype scan gate, immutable GHCR bottles with anonymous pull verification, a rewritten `registry-monterey.json`, and a prerelease. Companion Rosetta and Linux smoke jobs exercise the same stack under translation and from the default Linux catalog. (#388)\n\n### Fixed\n- `nb upgrade` no longer deletes the new keg's `opt/<name>` link when it unlinks the old version, which left dependents failing with dyld `Library not loaded`. `nb doctor` now repairs missing or stale `opt/` links on installed kegs. Reported and root-caused by @Rex57. (#407)\n- Honor pax extended `path`/`linkpath` headers in the native tar fallback so bottles with long paths + hardlinks (gcc 16.2.0) extract correctly. (#403)\n- Create the `/opt/nb` and `/opt/homebrew` symlinks during installation by running `nb init` from both installers, and print the absolute nb path in `sudo … init` hints so they work under sudo's secure_path. (#399)\n- `nb doctor` now checks (and creates when possible) the `/opt/nb` short-prefix symlink; `nb install` warns before downloading when it is unavailable. (#399)\n\n","mentions_count":1}
