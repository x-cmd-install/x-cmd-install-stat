16T16:14:33Z"},{"id":568326503,"node_id":"RA_kwDORQosbM4h3_ln","name":"nb-x86_64-linux.tar.gz.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":89,"digest":"sha256:8ed1bad480475877dd4f03c02c67ce0edb9964b647a0b1785dd9a57f45b48681","download_count":25,"created_at":"2026-09-16T16:14:33Z","updated_at":"2026-09-16T16:14:33Z"},{"id":568326468,"node_id":"RA_kwDORQosbM4h3_lE","name":"nb-x86_64-windows.zip","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":214133,"digest":"sha256:2a5c2c235441bd485ac542418545e95fc5ad54d7dae1b37c201ed3c46fc1555b","download_count":4,"created_at":"2026-09-16T16:14:32Z","updated_at":"2026-09-16T16:14:33Z"},{"id":568326530,"node_id":"RA_kwDORQosbM4h3_mC","name":"nb-x86_64-windows.zip.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":88,"digest":"sha256:2c9d0e526ebeb2496f37ea958115441e6f16d7c6c26301f6415423e232f609ec","download_count":2,"created_at":"2026-09-16T16:14:34Z","updated_at":"2026-09-16T16:14:34Z"}],"body":"## Intel Mac and Apple Silicon package coverage\n\nAdds or refreshes native binaries for ripgrep 15.2.0, just 1.58.0, fd 10.5.0, and Git LFS 3.8.0. This includes the previously missing Intel catalog entry for fd. The bundled catalog also includes the recently published core-library batch and updated gh, uv, and oras pins.\n\n## Fix default upstream resolution\n\nA Homebrew packaging rebuild at the same software version could replace a verified upstream binary. On Intel Macs this caused ripgrep to fail loading PCRE2. Nanobrew now compares actual software versions for declared upstream binaries, preserving their verified archives across Homebrew-only packaging changes. Newer software versions still trigger freshness checks, and Homebrew bottle revision/rebuild handling remains intact.\n\nUpdate Nanobrew with `nb update`, then install with:\n\n```sh\nnb install ripgrep just fd git-lfs\n```\n\nUse `nb upgrade` for existing packages. If ripgrep was already installed from the problematic same-version Homebrew bottle, use `nb reinstall ripgrep` after updating.\n\nThe default-resolution fix requires v0.1.212. `nb update-registry` alone on v0.1.211 does not include the fix.\n\n## Validation and downloads\n\nNative Intel macOS 15 and Apple Silicon macOS 26 checks cover seven tools, exact installed versions and archive digests, native architecture, version probes, ripgrep/fd search, just recipe execution, and a local Git LFS round trip, with both pinned and default resolution.\n\nMac executables are Developer ID signed and Apple notarized. Intel client builds target macOS 12; the native package tests above do not establish compatibility for every package on older macOS versions. The refreshed Apple Silicon xz bottle requires macOS 15+.\n\nLinux x86_64, Linux aarch64, and Windows x86_64 client artifacts and SHA-256 sidecars are included. Companion package archives were downloaded and checksum-verified; the package execution tests described above cover macOS.\n\n[Signed release artifact and native install evidence](https://github.com/justrach/nanobrew/actions/runs/35121003903).\n"}
