"node_id":"RA_kwDORQosbM4eus3_","name":"nb-x86_64-linux.tar.gz.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":89,"digest":"sha256:52100310ac0ab3e274066a95beb54adac56bb94b614f341542ecb312a5910fb2","download_count":36,"created_at":"2026-08-15T09:43:41Z","updated_at":"2026-08-15T09:43:42Z"},{"id":515558946,"node_id":"RA_kwDORQosbM4eus4i","name":"nb-x86_64-windows.zip","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":211930,"digest":"sha256:55c0341a4220ebf17ffa9f17709aa09d53793f4dfe6e530a4cdd28ff715f97b6","download_count":1,"created_at":"2026-08-15T09:43:44Z","updated_at":"2026-08-15T09:43:44Z"},{"id":515558954,"node_id":"RA_kwDORQosbM4eus4q","name":"nb-x86_64-windows.zip.sha256","label":"","uploader":{"login":"justrach","id":54503978,"node_id":"MDQ6VXNlcjU0NTAzOTc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":88,"digest":"sha256:dbc24d0a17068dbd2b4efc08f69dd8a64582f64ea5ccf1cad83d6e8390c2bbf5","download_count":2,"created_at":"2026-08-15T09:43:44Z","updated_at":"2026-08-15T09:43:44Z"}],"body":"Both changes in this release are external contributions from the open PR queue, each verified live on a Debian 13 box before merge.\n\n### Added\n\n- **`nb --deb` honours the system APT configuration** (first half of #245): `install --deb`, `upgrade --deb`, and `outdated` now parse `/etc/apt/sources.list` and `/etc/apt/sources.list.d/*` (legacy one-line lists with `[arch=... signed-by=...]` option blocks, and deb822 `.sources` stanzas including `Enabled: no` and multi-valued `URIs:`/`Suites:`), filter rows by host architecture, and fetch every discovered index. Third-party repositories (Docker, NodeSource, PPAs, internal mirrors) become installable, and Debian/Ubuntu derivatives stop asking the wrong upstream archive for their codename. Each package is tagged with the mirror it was discovered on so downloads route to the correct repository; the index cache is versioned (NBIX v3) so old caches rebuild cleanly. `--repo <spec>` still overrides discovery, and systems with no usable APT config keep the distro-default fallback. Verified: with the stock deb822 config plus a legacy `docker.list`, `nb install --deb docker-ce-cli` installs 29.7.2 from download.docker.com, a package the Debian archive does not carry. (#267)\n\n### Performance\n\n- **Linux installs no longer fork `cp` per package**: the copy fallback in `cellar.materialize` is now an in-process walker that tries `ioctl(FICLONE)` per file (instant copy-on-write on btrfs/xfs, the same fast path `cp --reflink=auto` uses) and falls back to `copy_file_range`-backed `copyFile`, recreating directories, symlinks, and permission bits; any walker failure still falls back to the `cp` subprocess so exotic filesystems never regress. Verified with `/usr/bin/cp` removed from the box: installs succeed and kegs come out byte-, permission-, and symlink-identical to their store sources. (#266)\n\nKnown issue found during verification, tracked separately as #367: a non-root `nb install --deb` currently reports success while extracting nothing to `/`. Run `--deb` installs with `sudo` until that lands.\n\n**Full changelog**: https://github.com/justrach/nanobrew/blob/main/CHANGELOG.md"}
