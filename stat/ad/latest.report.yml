{"id":270328077,"author":{"login":"sminez","id":8116092,"node_id":"MDQ6VXNlcjgxMTYwOTI=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOKY4y984QHOEN","tag_name":"0.4.0","target_commitish":"develop","name":"0.4.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2025-12-15T09:17:25Z","updated_at":"2025-12-15T09:24:11Z","published_at":"2025-12-15T09:24:11Z","assets":[],"body":"See the changelog for full details\r\n\r\n## What's Changed\r\n* #94 tracking tokenized regions by @sminez in https://github.com/sminez/ad/pull/95\r\n* A sans-io API for ninep by @sminez in https://github.com/sminez/ad/pull/97\r\n* contrib: add a simple markdown preview script by @davcam in https://github.com/sminez/ad/pull/100\r\n* issue-53 async command execution by @sminez in https://github.com/sminez/ad/pull/103\r\n* A bunch of improvements to the ninep crate by @bjorn3 in https://github.com/sminez/ad/pull/105\r\n* feat: reducing allocations in the 9p protocol layer by @sminez in https://github.com/sminez/ad/pull/107\r\n* feat: #77 supporting renaming of open buffers by @sminez in https://github.com/sminez/ad/pull/109\r\n* Adding a scratch buffer #26 by @sminez in https://github.com/sminez/ad/pull/113\r\n* Issue #98 -resizing window and columns by @sminez in https://github.com/sminez/ad/pull/116\r\n* Searching for multi-byte utf-8 characters in the minibuffer results in a panic by @sminez in https://github.com/sminez/ad/pull/128\r\n* Add support for LSP completions by @sminez in https://github.com/sminez/ad/pull/133\r\n* Remove incorrect truncation of TUI minibuffer lines by @sminez in https://github.com/sminez/ad/pull/138\r\n* feat: Fast Scrolling by @sminez in https://github.com/sminez/ad/pull/139\r\n* Fix GapBuffer::char_to_byte behaviour for single line buffers ending in a multi-byte character by @sminez in https://github.com/sminez/ad/pull/142\r\n* Rename config languages section to filetypes by @sminez in https://github.com/sminez/ad/pull/144\r\n* Add smarter treatment of dot when inserting via xdot by @sminez in https://github.com/sminez/ad/pull/145\r\n* Rename environment variables for spawned commands by @sminez in https://github.com/sminez/ad/pull/148\r\n* Add support for transient scratch buffers by @sminez in https://github.com/sminez/ad/pull/149\r\n* Add bash lsp configuration by @junkblocker in https://github.com/sminez/ad/pull/151\r\n* Reduce allocations in the TUI renderer by @sminez in https://github.com/sminez/ad/pull/153\r\n* Overhaul exec by @sminez in https://github.com/sminez/ad/pull/154\r\n* Use Structex for edit expressions by @sminez in https://github.com/sminez/ad/pull/157\r\n* Prevent crash in keybinding parsing for Config by @sminez in https://github.com/sminez/ad/pull/160\r\n* Custom keymaps should override by @sminez in https://github.com/sminez/ad/pull/162\r\n* Support running external programs in exec scripts by @sminez in https://github.com/sminez/ad/pull/163\r\n* Fix invalid leading literal calculations #165 by @sminez in https://github.com/sminez/ad/pull/166\r\n* Tree sitter plumbing rules by @sminez in https://github.com/sminez/ad/pull/167\r\n* Support resizing UI layout using the mouse by @sminez in https://github.com/sminez/ad/pull/168\r\n\r\n## New Contributors\r\n* @bjorn3 made their first contribution in https://github.com/sminez/ad/pull/105\r\n* @junkblocker made their first contribution in https://github.com/sminez/ad/pull/151\r\n\r\n**Full Changelog**: https://github.com/sminez/ad/compare/0.3.1...0.4.0","mentions_count":4}
