est":"sha256:b2b293972463deee845ffd7c1c1217eff645bfd5f7ec549d99ba830dc4c0b598","download_count":731,"created_at":"2026-08-07T20:31:45Z","updated_at":"2026-08-07T20:31:45Z"},{"id":505633149,"node_id":"RA_kwDOTN3Nvs4eI1l9","name":"dnsglobe-x86_64-unknown-linux-gnu.tar.xz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":108,"digest":"sha256:6dee8b5367b92cb69b93f96d4e73bcbf6f4680387b022b56a386cb5fdd3bd1f0","download_count":51,"created_at":"2026-08-07T20:31:45Z","updated_at":"2026-08-07T20:31:45Z"},{"id":505633151,"node_id":"RA_kwDOTN3Nvs4eI1l_","name":"dnsglobe.rb","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-ruby","state":"uploaded","size":2489,"digest":"sha256:f31ac57227f86da7b48a3ee399972710136bc26ac381d8cbc1d413f109fca764","download_count":8,"created_at":"2026-08-07T20:31:45Z","updated_at":"2026-08-07T20:31:45Z"},{"id":505633152,"node_id":"RA_kwDOTN3Nvs4eI1mA","name":"sha256.sum","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":603,"digest":"sha256:fe49452aaae2b6da8f72c3d6ca332993cdef0077d1a2375cf8607862af8f46f1","download_count":10,"created_at":"2026-08-07T20:31:45Z","updated_at":"2026-08-07T20:31:45Z"},{"id":505633153,"node_id":"RA_kwDOTN3Nvs4eI1mB","name":"source.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":2505168,"digest":"sha256:f4af10c8f4126c6778e91128487770fd90184cec02bc5e9f8f4fbcec19eee0bf","download_count":6,"created_at":"2026-08-07T20:31:45Z","updated_at":"2026-08-07T20:31:45Z"},{"id":505633155,"node_id":"RA_kwDOTN3Nvs4eI1mD","name":"source.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":81,"digest":"sha256:881257d13bdb3fe7a744e8cab0f18a0c3cdef2377af8962be96189c9bd873d70","download_count":2,"created_at":"2026-08-07T20:31:45Z","updated_at":"2026-08-07T20:31:45Z"}],"body":"## Release Notes\n\n### Changed\n\n- The resolver table now fits an 80-column terminal without cropping\n  anything that matters: resolver IPs are shown in full, the numeric columns\n  (Ping, TTL, Exp) are right-aligned so their digits line up, units that the\n  header already implies are gone, and where there isn't room for the\n  spelled-out status the verdict moves to a glyph in the left margin\n  (`\u2713 \u2260 ! \u21bb \u2205 \u2717`) \u2014 one place to scan for failures. The round-trip column is\n  now headed `Ping` (it was `Time`). Wider terminals are unchanged: they keep\n  the status word, the same answer column and the same map/globe thresholds.\n  `--once` matches: it prints the same name/location/IP column widths as the\n  TUI and right-aligns its TTL, so the two views line up.\n  ([#33](https://github.com/514-labs/dnsglobe/issues/33),\n  [#40](https://github.com/514-labs/dnsglobe/pull/40))\n- The per-row expiry countdown is coarse: at most two digits and a unit\n  (`59s`, `1m`, `59m`, `1h`, `23h`, `1d`, `99d`). A whole column of seconds\n  ticking out of unison was a distraction, and above a minute the exact\n  second never changed what you'd do. The TTL advisory notes still quote the\n  precise figure (`TTL \u2248 2h23m`).\n  ([#33](https://github.com/514-labs/dnsglobe/issues/33),\n  [#40](https://github.com/514-labs/dnsglobe/pull/40))\n- Failures now show as a white-on-red badge \u2014 on the status glyph and word in\n  the table, and on the `not a domain name` label under a malformed input \u2014\n  rather than red text, which went washed-out on terminal themes with a\n  mid-toned background (macOS Terminal's \"Ocean\"). Only the marker is\n  filled \u2014 error messages, map dots, the propagation gauge and slow ping\n  times keep the plain red, so the table doesn't turn into a wall of red\n  bars. `theme.error` accepts the new `\"<fg> on <bg>\"` form (for example\n  `error = \"black on 208\"`); a plain color still works and means no badge.\n  ([#33](https://github.com/514-labs/dnsglobe/issues/33),\n  [#40](https://github.com/514-labs/dnsglobe/pull/40))\n- Anycast site discovery now asks every resolver for its NSID (RFC 5001)\n  first \u2014 a standard EDNS option servers answer with their own node name \u2014\n  and only falls back to the old operator-specific `id.server` probes when\n  that names no place. More resolvers report where they actually answered\n  from: Lumen shows `\u2192JFK`, CIRA Canadian Shield `\u2192YYZ`, DNS4EU `\u2192AMS` and\n  DNS.SB `\u2192KIX` where they used to show only the operator's home region.\n  Resolvers you add yourself in the config file can now report a site too,\n  since NSID needs no per-operator support, and Google's site takes one\n  query instead of two. Nothing that already resolved to a site changed.\n  ([#36](https://github.com/514-labs/dnsglobe/issues/36),\n  [#39](https://github.com/514-labs/dnsglobe/pull/39))\n\n### Fixed\n\n- Names with an underscore in the middle of a label are queried instead of\n  failing on every resolver with `protocol error: Label contains invalid\n  character`. Underscores are legal anywhere in a DNS label \u2014 the\n  letter-digit-hyphen rule is about *hostnames*, not the DNS wire format \u2014 so\n  the delegated SPF/DMARC hosts that EasyDMARC, Valimail and friends generate\n  (`_spf.514_ax._d.example.com`) now resolve like they do in `dig`. Default\n  and `--ecs` runs accept exactly the same set of names; previously only\n  `--ecs` handled these.\n  ([#34](https://github.com/514-labs/dnsglobe/issues/34),\n  [#37](https://github.com/514-labs/dnsglobe/pull/37))\n- A domain that really is malformed (an empty label, a label over 63\n  characters) is now reported once \u2014 as a startup error for a name given on\n  the command line, or in place of the propagation gauge for one typed in the\n  TUI \u2014 instead of filling the table with one identical error per resolver,\n  which read like a network outage.\n  ([#37](https://github.com/514-labs/dnsglobe/pull/37))\n- The TTL note no longer lets a single resolver speak for the zone. It used to\n  report the longest TTL any agreeing resolver returned, so one resolver\n  handing back an invented 8423s turned a 300s zone into \"TTL \u2248 2h23m\" and\n  advised lowering a TTL that was already low. The estimate now ignores\n  reports wildly out of line with the rest of the fleet (never more than a\n  tenth of it), and any resolver that reported one is named on the note line\n  with what it claims \u2014 that cache really will serve the old answer after a\n  change, and it is worth knowing which one it is.\n  ([#35](https://github.com/514-labs/dnsglobe/issues/35),\n  [#38](https://github.com/514-labs/dnsglobe/pull/38))\n\n## Install dnsglobe 0.5.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-installer.sh | sh\n```\n\n### Install prebuilt binaries via Homebrew\n\n```sh\nbrew install 514-labs/tap/dnsglobe\n```\n\n## Download dnsglobe 0.5.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [dnsglobe-aarch64-apple-darwin.tar.xz](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-aarch64-apple-darwin.tar.xz.sha256) |\n| [dnsglobe-x86_64-apple-darwin.tar.xz](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-x86_64-apple-darwin.tar.xz.sha256) |\n| [dnsglobe-x86_64-pc-windows-msvc.zip](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-x86_64-pc-windows-msvc.zip.sha256) |\n| [dnsglobe-aarch64-unknown-linux-gnu.tar.xz](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [dnsglobe-x86_64-unknown-linux-gnu.tar.xz](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/514-labs/dnsglobe/releases/download/v0.5.0/dnsglobe-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n\n\n","reactions":{"total_count":3,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":3,"eyes":0}}
