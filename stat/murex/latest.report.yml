{"id":409064130,"author":{"login":"lmorg","id":12153701,"node_id":"MDQ6VXNlcjEyMTUzNzAx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOBSQPns4YYdLC","tag_name":"v7.3.1231","target_commitish":"master","name":"v7.3.1231","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-10-10T14:54:26Z","updated_at":"2026-10-10T16:28:07Z","published_at":"2026-10-10T16:28:07Z","assets":[],"body":"## Breaking Changes\r\n\r\nSupport following platforms have been deprecated:\r\n* Windows running 32bit ARM\r\n* Go versions 1.25 and below\r\n\r\nYou may have success building against these deprecated targets, however they are no longer part of the automated test and deployment pipelines.\r\n\r\n## v7.3.xxxx\r\n\r\n### Features\r\n\r\n* expressions: support for logical-not variable syntax via `!$(variable)`\r\n* integrations: ttyphoon dictionaries added\r\n* integrations: force-TTY integrations reintroduced\r\n* integrations: Ttyphoon prompt events now include environment variables\r\n* dep: dependency updates, including `golang.org/x/image` and readline refreshes\r\n\r\n### Bug Fixes\r\n\r\n* expressions: avoid panic when comparing arrays with numbers\r\n* expressions: fix panic in comparison operators with non-comparable types\r\n* core: close stdin after write in unmarshal\r\n* integrations: fix `su root` execution regression ([issue](https://github.com/lmorg/murex/issues/987))\r\n* app: fix `define-force-tty-func` summary handling\r\n* core: revert duplicated-code regression\r\n* tests: improve expression coverage\r\n* `which`: don't search the current directory for bare command names\r\n* events: run `onPrompt` callbacks in the background\r\n* expressions: fix handling of invalid named regexp symbols\r\n* `ansititle`: sanitize ANSI escape sequences\r\n\r\n## Special Thanks\r\n\r\nThank you to everyone in the [discussions group](https://github.com/lmorg/murex/discussions) and all who raise bug reports.\r\n\r\nYou rock!\r\n"}
