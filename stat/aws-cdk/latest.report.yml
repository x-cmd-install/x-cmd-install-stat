":3,"created_at":"2026-09-10T21:10:52Z","updated_at":"2026-09-10T21:11:04Z"},{"id":555829612,"node_id":"RA_kwDOBk6Df84hIUls","name":"aws-cdk-python-docs-2.269.0.zip.sig","label":"","uploader":{"login":"aws-cdk-automation","id":43080478,"node_id":"MDQ6VXNlcjQzMDgwNDc4","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":566,"digest":"sha256:3baa3d830bf898ae5e94b6f291d3cce6e32a2775acde7f8c218581c2d89e8e10","download_count":2,"created_at":"2026-09-10T21:11:04Z","updated_at":"2026-09-10T21:11:04Z"}],"body":"### Features\n\n* **bedrockagentcore:** graduate Policy submodule to stable ([#38687](https://github.com/aws/aws-cdk/issues/38687)) ([2b95e32](https://github.com/aws/aws-cdk/commit/2b95e329041ce1f54fd4a075229740af88484bdf)), closes [#37219](https://github.com/aws/aws-cdk/issues/37219)\n* update L1 CloudFormation resource definitions ([#38784](https://github.com/aws/aws-cdk/issues/38784)) ([1b5e2e0](https://github.com/aws/aws-cdk/commit/1b5e2e06b5688638775cd37e7ab3544d2cdd278e))\n* **logs:** support DELIVERY log group class ([#38703](https://github.com/aws/aws-cdk/issues/38703)) ([b7a057a](https://github.com/aws/aws-cdk/commit/b7a057a1abfb386a9738623c27680c38710e527c)), closes [#34338](https://github.com/aws/aws-cdk/issues/34338)\n* **s3-deployment:** expose deployed object version IDs ([#38766](https://github.com/aws/aws-cdk/issues/38766)) ([09342df](https://github.com/aws/aws-cdk/commit/09342df0b437365940f252d25fdc2e7637c4c5fe)), closes [#38765](https://github.com/aws/aws-cdk/issues/38765)\n\n\n### Bug Fixes\n\n* **awslint:** use a default import for chalk ([#38110](https://github.com/aws/aws-cdk/issues/38110)) ([36d14e0](https://github.com/aws/aws-cdk/commit/36d14e0c11b4ce19a76e2cef8a71457068e52a26)), closes [#38109](https://github.com/aws/aws-cdk/issues/38109) [#38058](https://github.com/aws/aws-cdk/issues/38058)\n* **core:** cdk-nag warnings cannot be suppressed ([#38787](https://github.com/aws/aws-cdk/issues/38787)) ([211029f](https://github.com/aws/aws-cdk/commit/211029fb5ff35e180a43f9ac65ab9e5015aad416))\n* **core:** cdk-nag's findings duplicated in multi-environment apps ([#38707](https://github.com/aws/aws-cdk/issues/38707)) ([4b7b2e7](https://github.com/aws/aws-cdk/commit/4b7b2e74a67965e0cd326bb0a27b2d11a8f9aed8)), closes [#38483](https://github.com/aws/aws-cdk/issues/38483) [#38135](https://github.com/aws/aws-cdk/issues/38135)\n* **core:** tree.json generation is quadratic in the number of subtrees ([#38761](https://github.com/aws/aws-cdk/issues/38761)) ([3d034b6](https://github.com/aws/aws-cdk/commit/3d034b63d58aa8f78d61596a682468724753dfec)), closes [#38762](https://github.com/aws/aws-cdk/issues/38762)\n* **core:** unnecessary warnings around builtins and AZs ([#38673](https://github.com/aws/aws-cdk/issues/38673)) ([6860777](https://github.com/aws/aws-cdk/commit/68607775642942161ba2602351a963745b0d4756))\n* **core:** upgrade CloudFormation validation to latest version ([#38804](https://github.com/aws/aws-cdk/issues/38804)) ([d703eb6](https://github.com/aws/aws-cdk/commit/d703eb67cec1d52a0e43ae3d739557f4162729ca))\n* **dynamodb:** `TableV2` emits internal grants deprecation warnings ([#38806](https://github.com/aws/aws-cdk/issues/38806)) ([57b3043](https://github.com/aws/aws-cdk/commit/57b304363240cbe333e6b3222d9ddb7803f81258)), closes [#38709](https://github.com/aws/aws-cdk/issues/38709) [#38399](https://github.com/aws/aws-cdk/issues/38399) [#37892](https://github.com/aws/aws-cdk/issues/37892)\n* **ecs:** allow ephemeralStorageGiB for Windows Fargate platform version 1.0.0 ([#37589](https://github.com/aws/aws-cdk/issues/37589)) ([855dfeb](https://github.com/aws/aws-cdk/commit/855dfeb67c8cba8cd5cc58f6e72e9de36ff92cf3)), closes [#37510](https://github.com/aws/aws-cdk/issues/37510)\n* **ecs:** removing the last target group from a service is not deployed ([#38776](https://github.com/aws/aws-cdk/issues/38776)) ([73100f6](https://github.com/aws/aws-cdk/commit/73100f60b5bff1e3dfbdb79754a07099f3ca4845)), closes [#35446](https://github.com/aws/aws-cdk/issues/35446) [#35446](https://github.com/aws/aws-cdk/issues/35446) [#35452](https://github.com/aws/aws-cdk/issues/35452)\n* **lambda-go:** escape generated go build path arguments ([#38785](https://github.com/aws/aws-cdk/issues/38785)) ([279d101](https://github.com/aws/aws-cdk/commit/279d10118d703446d7f30e983564f8bd8f197259))\n* **s3-deployment:** sanitize all log outputs to mitigate CWE-117/93 ([#37670](https://github.com/aws/aws-cdk/issues/37670)) ([47a3a38](https://github.com/aws/aws-cdk/commit/47a3a38b13324098c0c6588de8bd912a3f63ca30)), closes [#37671](https://github.com/aws/aws-cdk/issues/37671) [#30746](https://github.com/aws/aws-cdk/issues/30746) [#28469](https://github.com/aws/aws-cdk/issues/28469) [#30211](https://github.com/aws/aws-cdk/issues/30211)\n---\n## Alpha modules (2.269.0-alpha.0)\n### \u26a0 BREAKING CHANGES\n\n* **glue-alpha:** Glue job constructs now reject construct-managed and Glue-reserved\narguments passed through `defaultArguments`. Previously, a managed argument set via\n`defaultArguments` was silently honored in `SparkJob` and `PythonShellJob` (customer\nvalue won over the construct default) and silently ignored in `RayJob` (construct\ndefault won). Both behaviors let a caller bypass the construct's security and\nobservability defaults with no error. Passing any of the following through\n`defaultArguments` now throws a `ValidationError` at synthesis time:\n* construct-managed arguments \u2014 `--enable-continuous-cloudwatch-log`,\n  `--continuous-log-logGroup`, `--continuous-log-logStreamPrefix`,\n  `--continuous-log-conversionPattern`, `--enable-continuous-log-filter`,\n  `--enable-metrics`, `--enable-observability-metrics`, `--enable-spark-ui`,\n  `--spark-event-logs-path`, `--job-language`, `--class`, `--extra-jars`,\n  `--user-jars-first`, `--extra-py-files`, `--extra-files`, `library-set`\n* Glue-reserved arguments \u2014 `--debug`, `--mode`, `--JOB_NAME`, `--endpoint`\n\nA managed argument is rejected whether or not the current configuration emits it, so a\ndisabled feature (e.g. `enableMetrics: false`) cannot be re-enabled through\n`defaultArguments`. Configure these through their dedicated props instead\n(`continuousLogging`, `enableMetrics`, `enableObservabilityMetrics`, `sparkUI`,\n`className`, `extraJars`, `extraJarsFirst`, `extraPythonFiles`, `extraFiles`). For\nexample, replace `defaultArguments: { '--enable-continuous-cloudwatch-log': 'false' }`\nwith `continuousLogging: { enabled: false }`. Arguments without a dedicated prop (e.g.\n`--enable-glue-datacatalog`) are unaffected and remain settable via `defaultArguments`.\n\nThe `checkNoReservedArgs(defaultArguments?)` method on the `Job` base class was removed.\nIt is replaced by two protected members: `setManagedArgument(key, value?)`, which each\njob class calls to declare (and, when a value is present, emit) a managed argument, and\n`mergeDefaultArguments(defaultArguments?)`, which validates the caller-supplied\n`defaultArguments` against the accumulated reserved set and returns the merged map.\n* **route53resolver-alpha:** `FirewallRuleGroupAssociation` now honors the previously-ignored `mutationProtection` and `name` props. Stacks that set `mutationProtection: true` will enable mutation protection on redeploy (which blocks further CloudFormation update/delete until it is set back to false); stacks that set `name` will write it to the template, which may replace the association.\n* **glue-alpha:** trigger `Action` and `Condition` are no longer plain objects \u2014 use `Action.job(...)` / `Action.crawler(...)` and `Condition.job(...)` / `Condition.crawler(...)`. Jobs are referenced via `IJobRef` and crawlers via `ICrawlerRef` (a `CfnCrawler` instance or `CfnCrawler.fromCrawlerName(...)`) instead of a `CfnCrawler` field or crawler-name string; `IJob` now extends the generated `IJobRef`. `addDailyScheduledTrigger`/`addWeeklyScheduledTrigger`/`addCustomScheduledTrigger` are replaced by `addScheduledTrigger(id, { schedule, ... })` (use `TriggerSchedule.daily()`/`weekly()`/`cron(...)`). `addNotifyEventTrigger` is renamed `addEventTrigger` (`NotifyEventTriggerOptions` \u2192 `EventTriggerOptions`). All `addXxxTrigger` methods now return `ITriggerRef` instead of `CfnTrigger`.\n* **glue-alpha:** PartitionProjectionConfiguration's variant fields (integerRange, dateRange, interval, digits, format, intervalUnit, values) are no longer public; DATE projection now takes `step: { interval, intervalUnit }` instead of top-level `interval`/`intervalUnit`.\n* **glue-alpha:** ConnectionOptions no longer has `subnet`, `vpc`, or `vpcSubnets`; use `network: ConnectionNetwork.subnet(...)` or `network: ConnectionNetwork.vpc(...)` instead.\n\n### Features\n\n* **glue-alpha:** ensure job parameters consistency ([#38480](https://github.com/aws/aws-cdk/issues/38480)) ([bc7dc0c](https://github.com/aws/aws-cdk/commit/bc7dc0c30ab1f331c2ef7c9e66337ab7ea50f3bd))\n* **glue-alpha:** model Connection VPC placement as a value object ([#38729](https://github.com/aws/aws-cdk/issues/38729)) ([f72e9fe](https://github.com/aws/aws-cdk/commit/f72e9feb91de3e6de70d667641cd848f4d297185))\n* **glue-alpha:** model partition projection variants as internal state ([#38726](https://github.com/aws/aws-cdk/issues/38726)) ([16527cd](https://github.com/aws/aws-cdk/commit/16527cd788541825e10e9238e2f322bfaca03f6f))\n* **glue-alpha:** overhaul the workflow trigger API ([#38579](https://github.com/aws/aws-cdk/issues/38579)) ([c8f917d](https://github.com/aws/aws-cdk/commit/c8f917d0d636df2daf3abcd223997709d96bc433))\n\n\n### Bug Fixes\n\n* **route53resolver-alpha:** association silently ignored mutationProtection and name ([#38795](https://github.com/aws/aws-cdk/issues/38795)) ([5ab40b2](https://github.com/aws/aws-cdk/commit/5ab40b27c4c4181d1b44f9e5a1b64666e57c760f))"}
