:"2026-11-04T02:14:50Z","updated_at":"2026-11-04T02:14:51Z"},{"id":707904911,"node_id":"RA_kwDORXwmec4qMcWP","name":"gitpane-x86_64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5074724,"digest":"sha256:afa46f02d00f29c3b2474f017bd2e202d25216efe6c16f1aa460fe0144cbb5c8","download_count":2,"created_at":"2026-11-04T02:14:50Z","updated_at":"2026-11-04T02:14:51Z"},{"id":707904916,"node_id":"RA_kwDORXwmec4qMcWU","name":"gitpane-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":5000875,"digest":"sha256:8997388804ce2ccbe9aed05813995734639d004d42a53702a5f6b46459762cf9","download_count":3,"created_at":"2026-11-04T02:14:50Z","updated_at":"2026-11-04T02:14:51Z"},{"id":707904918,"node_id":"RA_kwDORXwmec4qMcWW","name":"gitpane-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5716814,"digest":"sha256:41a0d301900b91accb0830f13d060b5744724c2987ab58c398c1b14d6144b8ad","download_count":12,"created_at":"2026-11-04T02:14:50Z","updated_at":"2026-11-04T02:14:51Z"},{"id":707904914,"node_id":"RA_kwDORXwmec4qMcWS","name":"gitpane-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6010215,"digest":"sha256:65f5649722e3d5f1f553f1b22c9b378e22a28aa3d260f18b2124f7a202984ae2","download_count":3,"created_at":"2026-11-04T02:14:50Z","updated_at":"2026-11-04T02:14:51Z"}],"body":"## [0.18.4] - 2026-11-03\n\n### Added\n- Select visible terminal text by dragging and release to copy, while retaining clicks, wheel scrolling, scrollbar scrubbing and panel resizing. Highlighted text can be copied again with `y` or `Ctrl+C`; `Esc` clears the selection. ([#131](https://github.com/affromero/gitpane/pull/131), closes [#128](https://github.com/affromero/gitpane/issues/128)) Thanks @expoli.\n- Support official Herdr desktop (`herdr-app` and `hc`) for opening repositories, configured review commands, placement choices, live session markers and terminal navigation. The editor bridge and VS Code session controls support the `herdr-app` backend. ([#131](https://github.com/affromero/gitpane/pull/131), closes [#129](https://github.com/affromero/gitpane/issues/129)) Thanks @expoli.\n\n### Fixed\n- Keep an open terminal diff visible and refresh its contents when changed files update. ([`e654ce9`](https://github.com/affromero/gitpane/commit/e654ce94f969aa40bd35a34e765e964cd7531a55))\n- Keep VS Code changed-file rows stable during refresh so they do not flash or interrupt clicks. ([#133](https://github.com/affromero/gitpane/pull/133), closes [#132](https://github.com/affromero/gitpane/issues/132))\n- Isolate test fixtures from inherited Git settings, locale and desktop identity, and use platform-native paths for Herdr fixtures. ([#131](https://github.com/affromero/gitpane/pull/131), closes [#130](https://github.com/affromero/gitpane/issues/130)) Thanks @expoli.\n\n---\n\nFull changelog: https://github.com/affromero/gitpane/blob/main/CHANGELOG.md\n","mentions_count":1}
