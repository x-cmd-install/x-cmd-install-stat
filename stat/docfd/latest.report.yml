os.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3224220,"digest":"sha256:670d3c4b316586c45dcb61288cde9105d634e9551c38fc28847f92c83fe83d66","download_count":4,"created_at":"2026-10-19T13:31:27Z","updated_at":"2026-10-19T13:31:27Z"}],"body":"**Note**: This update contains a feature that requires removing the existing index DB to take effect.\r\n\r\n- Upgraded link extraction\r\n    - This will **only** work after recreating the index DB\r\n    - Fixes issue [#22](https://github.com/darrenldl/docfd/issues/22)\r\n- Improved Markdown and wiki link path resolution, including fragments,\r\n  percent-encoded paths, and extension handling\r\n- Added `<CONFIG_DIR>` token to cli arguments in config file for expansion into\r\n  the directory that contains the config file\r\n- Added `<HOME>` token to cli arguments in config file for expansion into\r\n  the HOME environment variable\r\n- Added `--links` flag for printing links in documents non-interactively\r\n- Improved validation of incompatible interactive, non-interactive, and\r\n  early-exit CLI arguments\r\n"}
