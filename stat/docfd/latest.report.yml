s.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3187705,"digest":"sha256:620a69ee6906e7f11b040c7af19899719bd69e7bbc0db6cd1eb4fc59e1891a81","download_count":1,"created_at":"2026-08-27T14:12:02Z","updated_at":"2026-08-27T14:12:03Z"}],"body":"- Added config file support (`.docfd-config`)\r\n    - The format follows the \"cli arguments in lines\" format as with ripgrep\r\n- Added `--list-scripts` flag\r\n- Made `--script` and `--start-with-script` to look up script in data directory if provided path is a file name and not present in current directory, appending `.docfd-script` if needed during lookup in script directory\r\n- Request handling debouncing fix\r\n- Other minor fixes aiming to further reduce crashes\r\n    - Mainly around SQL related code\r\n- Added more reporting to help capture info when the rare crashes occur\r\n- Requiring `sqlite3 >= 5.4.2` for a crash fix\r\n- Added overlay for potentially long synchronous operations to make it clear Docfd is not frozen, e.g. redo/undo, reload\r\n"}
