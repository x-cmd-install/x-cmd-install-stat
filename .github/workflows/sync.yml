name: sync

# Pull the freshest card from each x-cmd-install/<software> repo at
# 16:00 UTC daily and write stat/<software>/latest.card.yml. No API
# usage — fetches go through raw.githubusercontent.com.
#
# Initial setup: this workflow needs write access to the repo. Open
# Settings → Actions → General → Workflow permissions and switch
# "Read and write permissions" on (or add a GH_TOKEN secret scoped to
# this repo).

on:
  schedule:
    # Daily at 16:00 UTC. Most upstream x-cmd-install/<software>
    # workflows run ~00:00 UTC, so by 16:00 they're all published and
    # we pull a full day's worth of cards in one sweep. timeout-minutes
    # below caps the run at 3h so a runaway loop can't pin the runner.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run sync
        # --lookback 2 = try today, fall back 2 prior days. Most repos'
        # upstream workflows run ~00:00 UTC; this gives a 3-day cushion.
        run: ./.x-cmd/sync.sh --concurrency 16 --lookback 2

      - name: Commit & push
        run: |
          if git status --porcelain -- stat/ | grep -q .; then
              git config user.name  "x-cmd-install-sync"
              git config user.email "sync@x-cmd-install.local"
              git add stat/
              git commit -m "sync: pull latest card from x-cmd-install/<software>"
              git push origin main
          else
              echo "no card updates to commit"
          fi
